answer: |-
  This is an excellent thought experiment. It cuts straight through the standard summary ("Aristotle hates capitalism") and hits the actual philosophical machinery: the relationship between *telos* (purpose), *nomos* (convention), and *phusis* (nature).

  Here is a walkthrough of how to read these specific passages to answer your three questions, highlighting where the text is firm and where it leaves you room to argue.

  ### 1. Does perishable scrip count as money? (Portability vs. Compact)

  You asked whether storability is essential to Aristotle's definition or if the "mutual compact" does all the work.

  **The Textual Joints:**
  Look at the progression in the second block. Aristotle describes a historical evolution:
  1.  **Barter:** Direct exchange of goods.
  2.  **Import/Export:** Necessaries are "not in every case readily portable."
  3.  **The Compact:** Men agree to use a substance that is "useful... [and] easy to handle." (Iron, silver).
  4.  **The Stamp:** To avoid measuring weight every time.

  **The Analysis:**
  Aristotle gives two criteria for the *origin* of money:
  *   **Functional:** It solves the portability problem of necessaries.
  *   **Formal:** It is based on a "mutual compact."

  Your perishable scrip fits the **Formal** criterion perfectly. It is purely a token of the compact. In fact, it fits the *later* stage of Aristotle's history better than the *early* stage. He admits that eventually, money became "nothing by nature but entirely a convention." The early metal money had intrinsic use (you could make tools out of iron); the later stamped money relies on the stamp (the convention). Perishable scrip is the logical endpoint of "money as convention."

  **The Problem:**
  However, it fails the **Functional** criterion regarding *time*. Aristotle says money arose because necessaries aren't portable *in space* (import/export). But the implicit function of money in his system is to allow the household to store value *in time* until it is needed for exchange.
  *   **The Shoe Move:** Recall the shoe example. A shoe has a "use peculiar to it" (wearing) and an "exchange use" (barter). The exchange use is secondary but legitimate *if* it serves the natural end (getting food you need).
  *   **Applying to Scrip:** If the scrip expires at midnight, it cannot serve the natural end of the household (provisioning for the future). It forces immediate consumption.

  **Verdict:**
  On Aristotle's account, perishable scrip **counts as money** (it satisfies the "compact" and "token" definition), but it is **dysfunctional money**. It severs the link between money and the "natural necessaries" it was invented to facilitate.
  *   *Where the text underdetermines:* Aristotle doesn't explicitly say "money must be storable." He implies it through the "portable" argument. You could argue that if the city agrees to re-stamp the coins every morning (even at a cost), storability is preserved socially, if not physically. But if the value literally vanishes, Aristotle would likely say this isn't money for *wealth-getting*, but a token for *daily rationing*.

  ### 2. If money is conventional, how is wealth-getting "unnatural"?

  This is the crux of the paradox. If money is just a convention (*nomos*), how can using it be against nature (*para phusin*)?

  **The Textual Joints:**
  *   **Block 3:** "Money is... nothing by nature but entirely a convention."
  *   **Block 4:** "It is this art of wealth-getting that is thought to be concerned with money... And these riches... are truly unlimited."
  *   **Block 5:** "The desire for life is unlimited, [so] they also desire without limit the means productive of life."

  **The Resolution:**
  For Aristotle, "Natural" does not mean "Physical" or "Non-Human." It means **Teleological** (according to purpose).
  *   **The Shoe Analogy Again:** A shoe is an artifact (conventional/man-made). Yet, there is a "natural" use (wear) and an "unnatural" use (barter *as an end*). The unnaturalness isn't in the shoe; it's in the *activity* relative to the shoe's purpose.
  *   **Money's Nature:** Money's "natural" purpose (in the household context) is to be a **measure** of exchange to satisfy needs. Its "unnatural" purpose is to be the **object** of exchange.

  **Why Convention Matters:**
  The fact that money is conventional is *precisely why* it enables the unnatural art.
  *   Food has a natural limit (you can only eat so much).
  *   Money has no natural limit (it is a number/token).
  *   Because money is conventional, it has no intrinsic "fullness." You cannot be "full" of tokens in the way you can be full of grain.

  **Verdict:**
  The unnaturalness consists in the **End**, not the **Object**.
  *   **Natural Wealth-Getting:** Using the conventional tool (money) to achieve a natural end (household sufficiency). The limit is set by the household's needs.
  *   **Unnatural Wealth-Getting:** Using the conventional tool (money) to achieve a conventional end (infinite accumulation). The limit is removed because the tool (money) has no intrinsic limit.

  The Midas story (Block 3) proves this. Midas didn't die because gold is "physical." He died because he treated the *means* (gold/conventional value) as the *end* (nourishment/natural value). The convention point highlights that money is empty of natural utility, making it dangerous to treat as a final good.

  ### 3. Would perishable scrip cure the "unlimitedness"?

  This is your strongest question. Aristotle gives two explanations for why wealth-getting becomes unlimited. Does scrip fix one or both?

  **Explanation A: The Nature of Money (The Tool)**
  *   *Text:* "Money is the first principle and limit of commerce... riches... are truly unlimited."
  *   *Logic:* Money is homogeneous and quantitative. Unlike a shoe or a loaf of bread, one coin is exactly like another, and there is no natural point where "enough coins" becomes "too many coins."
  *   *Scrip Effect:* **Yes, this cures it.** If coins expire, they regain a "qualitative" limit (time). You cannot accumulate them infinitely. The "art of wealth-getting" (defined as accumulating money) becomes impossible. You literally cannot have "unlimited riches" in scrip.

  **Explanation B: The Nature of Desire (The Soul)**
  *   *Text:* "As therefore the desire for life is unlimited, they also desire without limit the means productive of life."
  *   *Logic:* The problem isn't the coin; it's the confusion between "Living" (biological survival) and "Living Well" (virtue). People think more means = more life.
  *   *Scrip Effect:* **No, this does not cure it.** If the desire is for "life" (or pleasure), and the scrip expires, the greedy citizen will simply hoard **grain**.
  *   *Aristotle's Nuance:* Aristotle acknowledges that natural goods *can* be hoarded, but he implies they have a physical limit (grain rots, land is finite). Money removes the physical limit.
      *   *Quote:* "With all of them [other arts] the end is a limit to the means."
      *   *Medicine:* The end is Health. Health has a natural maximum. Therefore, the means (drugs) are limited.
      *   *Wealth-Getting:* The end is Riches. Riches (money) have no natural maximum. Therefore, the means are unlimited.

  **The Verdict on Scrip:**
  Perishable scrip forces the "End" (Riches) to have a limit (24 hours).
  *   If the End is limited, Aristotle's logic suggests the **Means must also become limited**.
  *   *However*, the greedy soul (Explanation B) will simply shift the "End" from Scrip to Grain.
  *   **The Underdetermination:** Aristotle conflates the *psychological error* with the *technological tool*. He blames the "art of wealth-getting" (which uses money) for the unlimitedness.
      *   If you define "Wealth-Getting" as "accumulating money," scrip kills the art.
      *   If you define "Wealth-Getting" as "accumulating resources for pleasure," scrip changes nothing.

  **My Reading:**
  Aristotle thinks the **Tool** corrupts the **Soul**. He believes that because money *looks* unlimited, it *teaches* us to desire unlimitedly.
  *   *Textual Support:* "Money is the first principle and limit of commerce."
  *   If you remove the possibility of money being a "limit" (by making it expire), you break the feedback loop.
  *   **Conclusion:** In the perishable-scrip city, the specific *unnatural art* (chrematistics) disappears because its object (accumulable currency) is gone. However, the *vice* (greed) remains and will attach itself to land or grain. Aristotle would say the city is safer, but the citizens are not necessarily virtuous.

  ### Summary for your Reading Group

  Here is how you can frame the "joints" of the argument to settle the discussion:

  1.  **On the Shoe:** Aristotle's distinction isn't "Natural Object vs. Artificial Object." It is **"Proper Use vs. Improper Use."** A shoe is artificial, but wearing it is natural. Money is conventional, but using it for household provisioning is natural. Using it for infinite accumulation is unnatural.
  2.  **On Convention:** Money is conventional *in origin*, which is why it is dangerous. Because it has no natural "fullness" (unlike food), it tricks us into thinking there is no limit to wealth. The "unnaturalness" is the **detachment of the Means from the Natural End.**
  3.  **On Perishable Scrip:**
      *   It **counts as money** (it's a compact/token).
      *   It **blocks the Unlimitedness** of the *Art* (you can't hoard the token).
      *   It **does not block the Unlimitedness** of the *Desire* (people will hoard grain instead).
      *   **The Catch:** Aristotle believes the Art shapes the Desire. By removing the possibility of infinite monetary accumulation, you remove the primary *teacher* of greed. So, scrip might actually "cure" the political disease, even if it doesn't cure the individual soul.

  **Where to push back:**
  Point out that Aristotle assumes grain *has* a natural limit (it rots). In a modern context (or a sci-fi context), we can store grain indefinitely. If natural goods can be stored infinitely, does Aristotle's distinction collapse? (This is usually where the group gets really excited).
