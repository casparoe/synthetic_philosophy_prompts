  ### The Candidate Principles

  Based on her track record, Priya is running two main principles that usually work in tandem but occasionally conflict.

  **Principle A: The Coordination Imperative (The "Escalator Rule")**
  *   *Definition:* If a norm exists to facilitate smooth interaction or safety, you must follow it, regardless of your personal opinion or whether anyone is immediately harmed.
  *   *Support:* London Escalator (stand right), Amtrak Quiet Car (no phone), Philly Line (don't cut).
  *   *Logic:* The system relies on predictability. Your individual efficiency doesn't matter; the group's predictability does.

  **Principle B: The Local Sovereignty & Exploitation Veto (The "Tokyo/Office Rule")**
  *   *Definition:* Defer to local custom *unless* that custom is exploitative, illegal, or universally unendorsed by the locals themselves.
  *   *Support:* Tokyo Tipping (don't import), Office Stay-Late (erode the norm), Southern Europe Tip (don't validate resentment).
  *   *Logic:* You are a guest in a social ecosystem. Do not impose foreign scripts (Tokyo), but also do not uphold local scripts that harm the participants (Office).

  **Where They Come Apart:**
  These principles diverge on **Case 2 (The Standing Norm).**
  *   **Principle A** says: **Stand.** Everyone else is standing. It is a predictable pattern. Breaking it causes social friction (shock, awkwardness).
  *   **Principle B** says: **Sit.** The locals do not endorse it. It is a status ritual, not a functional coordination tool. It borders on the "labor problem" of the office stay-late case.

  Priya's verdict on the Office Stay-Late suggests **Principle B wins** when harm/exploitation is involved. But "humiliation" is softer than "unpaid labor." This is the crack in her framework.

  ### The Underdetermination

  Priya's past verdicts genuinely underdetermine **Case 2.**
  *   If she rules **Stand**, she commits to **Pure Coordination:** Social friction is a harm in itself, regardless of the norm's content. (The "Quiet Car" logic).
  *   If she rules **Sit**, she commits to **Normative Validity:** A norm only binds you if it serves a function or is endorsed by the community. (The "Office" logic).

  She hasn't yet faced a case where a norm is **universally followed** but **universally hated** and **functionally useless.** The Escalator norm is hated by some but functional. The Office norm is hated and exploitative. The Standing norm is hated and *ritualistic*.

  ### The Killer Question (Case 4)

  To force her to choose between **Coordination** (Principle A) and **Endorsement** (Principle B), pose this case at dinner:

  **The "Silent Commute" Train**
  > "In this city, there is an unwritten rule that no one speaks on the morning train. It's not a law, no one enforces it, but everyone complies. It makes the ride peaceful (functional benefit). However, every local privately hates it; they feel isolated and think it's a repressive habit from a past dictatorship, but they keep quiet because 'that's just what we do.' You are a visitor. You want to ask your travel partner a simple question. Do you speak?"

  **Why this separates the rules:**
  *   **If she says "Don't Speak":** She prioritizes **System Integrity** over **Local Endorsement.** She believes that once a coordination norm is established (even on bad grounds), breaking it causes more friction (social shock) than keeping it. This aligns with the *Escalator* and *Quiet Car*.
  *   **If she says "Speak":** She prioritizes **Local Will** over **System Integrity.** She believes a norm without genuine endorsement is a "zombie norm" and guests have a right to treat people as humans, not robots. This aligns with the *Office Stay-Late* and *Standing* verdict.

  **The Trap:**
  If she says "Don't Speak," she has to explain why the *Escalator* (safety/flow) and the *Train* (psychological repression) are the same category.
  If she says "Speak," she has to explain why the *Quiet Car* (where people might also secretly want to talk but comply) is different from the *Train*.

  This forces her to define the boundary between a **Functional Convention** (which must be kept) and a **Social Ritual** (which can be broken). That is the only place her warehouse logic hasn't fully mapped the terrain.
