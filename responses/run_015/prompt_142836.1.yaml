answer: |-
  Priya isn't doing moral philosophy; she's doing **social logistics.** Her background in warehouse management shows in every verdict: she treats social norms like Standard Operating Procedures (SOPs). The goal isn't "truth" or "virtue"; it's **friction reduction** and **system integrity.**

  When she says something is "wrong," she usually means "you are introducing friction into a system you didn't build and don't own." When she says something is "fine," she means "the system is robust enough to handle your deviation," or "the system itself is broken/exploitative and needs eroding."

  Here is the reconstruction of her framework, the verdicts on your three cases, and the one question that breaks the model.

  ### The Three Verdicts

  **Case 1: The Southern Europe "Tourist Tip"**
  *   **Verdict:** **Don't tip** (unless you confirm the wage was cut).
  *   **The Reasoning:** This is a Tokyo case, not a US case. In the US, the tip is a deferred wage (part of the price). In Tokyo, the tip is a foreign script (an insult). In this European city, the tip is a **two-tiered tax.** Priya's "colonizing" comment on Tokyo is key here: if the locals resent the norm, enforcing it makes you an agent of cultural erosion, not a participant in a contract.
  *   **The Nuance:** She would distinguish the *owner's daughter* from the *cut-wage worker*. If the waiter's base pay was legally slashed because management expects tips (the US model), you now owe the tip because you've entered a wage contract. If the wage is standard and the tip is just "extra profit expected from foreigners," paying it validates a predatory pricing model. You are not obligated to fix the restaurant's revenue strategy by importing a custom the community rejects.
  *   **First vs. Ten-Thousandth Tourist:** Irrelevant. You are either participating in the norm or you aren't.
  *   **Priya's Line:** *"You're a guest, not a ATM. If the locals say the price is on the menu, believe the locals, not the menu's silence."*

  **Case 2: The Standing Norm (Pluralistic Ignorance)**
  *   **Verdict:** **Stay Seated.**
  *   **The Reasoning:** This is the "Office Stay-Late" case, not the "London Escalator" case. The Escalator norm exists for *flow* (functional coordination). The Standing norm exists for *status* (hierarchical ritual). Priya draws a hard line between **coordination conventions** (which keep the machine running) and **deference rituals** (which keep the boss happy).
  *   **The Nuance:** The fact that *no one* endorses it is the smoking gun. In the Quiet Car, people want quiet. On the Escalator, people want flow. Here, everyone wants to sit. This is a "bad equilibrium." By sitting, the consultant isn't breaking a functional system; they are offering a "waiver" to everyone else, just like the host who said "keep your shoes on." They are signaling that the norm is optional.
  *   **Priya's Line:** *"If everyone's pretending and everyone's miserable, it's not a convention, it's a hostage situation. You're allowed to cut the wire."*

  **Case 3: The Café Cup Shelf (Hidden Norm)**
  *   **Verdict:** **Not Wrong (initially).**
  *   **The Reasoning:** This is the "Bus Stop Scrum" case. You cannot coordinate with a signal you cannot see. Priya's philosophy requires **noticeability.** If the norm is truly opaque (no signs, no cues, silent resentment), the visitor cannot be held liable for the friction they cause.
  *   **The Nuance:** However, this comes with a "duty to observe." If there are cups on the shelf and yours is on the table, the signal *is* visible upon inspection. If you stay for a week and never look at the shelf, you become negligent. But for a one-off visit? You're fine. The resentment belongs to the regulars for failing to onboard the guests.
  *   **Priya's Line:** *"You can't follow a map you haven't been shown. But if you see everyone else parking their bikes, don't leave yours in the doorway."*

