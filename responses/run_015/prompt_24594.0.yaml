answer: |-
  **Project Title:** The Causal Status of Omissions in Preemptive and Overdetermined Contexts

  **Statement of the Central Question**
  This research project investigates the metaphysical and normative status of omissions within complex causal structures. The central question is: when an agent fails to perform an action that would have prevented a harm, but the harm would have occurred anyway through an independent cause or a later intervention, should the omission be treated as a cause of the harm, a mere background condition, or a distinct kind of causal contribution?

  This inquiry sits at the intersection of metaphysics and ethics. In standard causal scenarios, omissions are often treated as causes if the harm would not have occurred had the agent acted. However, in overdetermined scenarios, the harm occurs regardless of the agent's failure. Similarly, in preemptive cases, a backup cause stands ready to produce the harm if the primary cause fails, but the omission allows the primary cause to proceed. The project seeks to determine whether the causal status of an omission depends on the physical structure of the event sequence or on the normative expectations placed upon the agent. Resolving this is crucial for legal theory and moral philosophy, where liability often hinges on whether an agent's inaction was a cause of harm or merely a condition under which other causes operated.

  **Limitations of Standard Accounts**
  Current theoretical frameworks leave this issue unresolved because they rely on intuitions that fracture under overdetermination.

  First, standard counterfactual accounts define causation as dependence: an event is a cause if the effect would not have occurred without it. In overdetermined omission cases, this test fails. If the harm would have happened anyway due to a independent backup cause, the omission is not counterfactually necessary for the harm. Consequently, strict counterfactual theories must classify the omission as causally inert, conflicting with the intuition that the agent's failure is relevant to the outcome.

  Second, process-based accounts require a physical connection or transmission of energy between cause and effect. Since omissions are absences of action, they lack physical processes. Proponents of this view typically categorize omissions as non-causes, treating them as background conditions. However, this view struggles to explain why we distinguish between harmful omissions and harmless non-actions. If all omissions are causally equal background conditions, the theory cannot distinguish between a lifeguard sleeping on the job and a bystander far away who also fails to save the drowning swimmer.

  Third, responsibility-based accounts attempt to bypass metaphysical causation by grounding causal status in normative duty. On this view, an omission is a cause if the agent was obligated to act. While this aligns with legal practice, it conflates metaphysics with ethics. It risks making causation dependent on moral judgment rather than factual structure. If causation is defined by responsibility, we cannot use causation to determine responsibility without circularity. These three accounts leave a gap: they cannot explain cases where an omission feels causally potent despite lacking counterfactual necessity or physical process, nor can they separate the question of causal contribution from the question of blame.

  **Methodology and Proposed Criterion**
  To make progress, this project will employ a three-step method involving taxonomy, case separation, and criterion formulation.

  First, I will develop a rigorous taxonomy of overdetermination and preemption cases involving omissions. This taxonomy will distinguish between symmetric overdetermination (where two sufficient causes exist simultaneously), asymmetric overdetermination (where a backup cause exists but is temporally later), and preemptive structures (where a backup cause is ready but rendered inactive by the primary cause). Within each category, I will vary the nature of the omission, distinguishing between deliberate refraining, negligent forgetting, and inability to act.

  Second, I will construct a set of test cases designed to separate causal contribution from moral or legal responsibility. These scenarios will hold the physical outcome constant while varying the agent's duty and the independence of the backup cause. For example, one case will involve a guard who fails to stop a bomb, where a second guard was ready to stop it but also failed. Another will involve a guard who fails, where the second guard was not present. By comparing intuitions across these cases, I will test whether causal judgments track the physical redundancy or the normative breach. This separation is vital to determine if "causation" in these contexts is a disguised normative judgment or a distinct metaphysical relation.

  Third, based on the patterns identified in the test cases, I will propose a criterion for when an omission counts as causally relevant even though the outcome is overdetermined. The proposed hypothesis is the "Normative Expectation Criterion." This criterion suggests that an omission is causally relevant if, within the specific context, there was a stable normative expectation that the agent would intervene, and that intervention would have been sufficient to prevent the harm, regardless of backup causes. This shifts the focus from whether the omission changed the outcome to whether the omission violated a causal pathway that was normatively designated as the primary prevention mechanism. This distinguishes the lifeguard (whose omission is causal) from the distant bystander (whose omission is not), even if both failed to save the swimmer and the swimmer would have died anyway due to a shark attack.

  **Final Deliverable and Failure Conditions**
  The final deliverable will be a draft monograph comprising three integrated papers. The first will outline the taxonomy and critique of standard accounts. The second will present the test cases and analysis of intuitions. The third will defend the Normative Expectation Criterion and apply it to legal and moral examples.

  The project will be considered a failure if the test cases reveal that intuitions about causal status are too inconsistent to support a general criterion. If participants or philosophical analysis show that causal judgments track neither physical structure nor normative duty consistently, but rather vary randomly based on irrelevant framing details, the hypothesis that a unified account is possible will be falsified. Additionally, if the proposed criterion collapses back into a simple responsibility account without offering distinct metaphysical insight, the project will not have achieved its goal of separating causation from blame.

  **Month-by-Month Plan**

  *   **Months 1-2:** Comprehensive review of existing arguments regarding omission causation and overdetermination. No citations will be generated, but positions will be mapped. Focus on identifying the precise points of divergence between counterfactual and process views.
  *   **Months 3-4:** Development of the taxonomy. Drafting the initial descriptions of preemptive and overdetermined cases involving omissions. Refining the distinctions between symmetric and asymmetric structures.
  *   **Months 5-6:** Construction of test cases. Designing scenarios that isolate variables such as duty, timing, and independence of backup causes. Preliminary informal testing of these cases against standard philosophical intuitions.
  *   **Months 7-8:** Drafting the first paper. This will cover the critique of standard accounts and the presentation of the taxonomy. Establishing the failure of current models to handle the target cases.
  *   **Months 9-10:** Drafting the second and third papers. Formulating the Normative Expectation Criterion. Defending the criterion against objections, particularly the charge of circularity or conflating norms with metaphysics.
  *   **Month 11:** Integration and revision. Combining the three papers into a cohesive monograph draft. Ensuring consistent terminology and argument flow. Checking that the distinction between causation and responsibility remains clear throughout.
  *   **Month 12:** Final polish and submission preparation. Reviewing the work against the failure conditions to ensure the criterion offers genuine insight. Preparing the final report for the fellowship committee.

  This plan ensures a systematic progression from theoretical critique to constructive proposal, allowing sufficient time for the refinement of the central criterion while maintaining a realistic schedule for a one-year fellowship.
