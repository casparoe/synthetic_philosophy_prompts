          *   Maintain distinctions: unexplained vs. useless, reforming vs. repealing, specific caution vs. general suspicion.
          *   Constraints: ~1 month, ~30 hours of digging, no A/B testing.
          *   **Crucial:** Mark requirements as "Non-negotiable" vs. "Taste".
          *   **Crucial:** Flag any two requirements suspected to be mutually incompatible (trade-offs).
