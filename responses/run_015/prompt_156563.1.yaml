answer: |-
  **Specification for an Inherited Practice Decision Framework**

  1.  **Risk Stratification Capability:** The rule must categorize every practice by its worst-case failure mode (e.g., "halts payroll," "legal liability," "minor inefficiency") before evaluation begins. **[Non-negotiable]**
  2.  **Beneficiary Mapping:** The rule must require identifying a specific living stakeholder who loses value if the practice vanishes, distinguishing between "nobody can explain it" and "nobody benefits from it." **[Non-negotiable]**
  3.  **Modification Gradient:** The rule must offer options between total repeal and total retention, such as adjusting thresholds ($300 → $3,000) or frequency (Friday → Monthly), to separate the *intent* from the *implementation*. **[Non-negotiable]**
  4.  **Time-Boxed Archaeology:** The rule must force a decision based on available evidence within the 30-hour budget, prohibiting "无限 research" loops when answers are obscure. **[Non-negotiable]**
  5.  **Safe Violation Protocol:** The rule must prescribe a method to simulate removal (e.g., shadow processing, dry runs) to uncover hidden functions without triggering actual failure. **[Taste]**
  6.  **Ambiguity Default:** The rule must state a preset stance for when evidence is inconclusive after 30 hours (e.g., "retain until proven useless" vs. "sunset unless proven vital"). **[Taste]**

  **Incompatibility Flag:** Requirements **#1 (Risk Stratification/Zero Disruption)** and **#5 (Safe Violation/Discovery)** cannot be simultaneously satisfied for "load-bearing" fences. Some practices only reveal their function by breaking; if the risk ceiling forbids breakage (payroll safety), you cannot definitively solve the "violation-dependent discovery" case. You must accept either residual risk or residual ignorance.

  This spec leans Burkean in its operational constraints but pragmatic in its intent. By making risk stratification non-negotiable and forcing a default stance on ambiguity, it structurally favors retention when knowledge is incomplete, acknowledging that survival trumps optimization. However, by mandating a modification gradient and beneficiary mapping, it prevents stagnation by allowing rules to evolve rather than merely persist, seeking the *function* of the fence without worshipping the *wood*.
