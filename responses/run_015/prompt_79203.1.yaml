answer: |-
  **To:** Engineering and Assurance Teams
  **From:** Assurance Lead
  **Subject:** Procedure for Assessing Behavioural Rigidity (Sphexishness)

  We face a specific failure mode: systems that preserve the *form* of a task after the *function* has been voided. The tribunal does not care about the metaphysics of free will; they care about attribution. If a system acts like the digger wasp, we cannot claim it exercised judgement, and therefore we cannot claim the human operator was truly "in the loop" in a meaningful sense.

  Below is the procedure. It is not a test for consciousness. It is a test for *coupling* between the system's terminal goals and its immediate actions under defined perturbations.

  ### 1. Critique of Existing Tests

  You asked why our current tests fail.

  **The Moved-Cricket Test:** This survives, but only in a modified form. In its raw state, it confuses *obstruction* with *mootness*. If a robot stops because a pallet is moved, it may simply have triggered a collision sensor. That is safety, not flexibility. To work, the perturbation must not block the action; it must render the *outcome* of the action irrelevant while leaving the *path* clear. The robot must be able to finish the move, but the move must no longer achieve the goal. If it proceeds, it is sphexish.

  **The Narration Test:** This fails and should be discarded. Asking a system (or an operator under stress) to explain a failure measures linguistic capability or memory, not control architecture. A large language model can hallucinate a perfect reason for a catastrophic error. A human operator can recite the manual while ignoring the patient in front of them. Narration is post-hoc rationalisation. It is evidence of nothing but the ability to speak.

  ### 2. The Coupling Audit Procedure

  This procedure determines if a system is robustly coupled to its objective or merely coupled to its procedure. It must be run for each distinct operational mode (e.g., docking, diagnosing, balancing).

  **Pre-condition:** You must define the **Perturbation Class**. You cannot test against "everything." You must state: "We are testing flexibility against changes in [unit measurement / physical location / network latency / patient vitals] within the range of [X to Y]." If you cannot define the class, stop. You are not testing flexibility; you are testing magic.

  **Step 1: Goal-Procedure Separation**
  *   **Question:** Can the system distinguish between "Task Completed Successfully" and "Task Procedure Executed"?
  *   **Sufficient Answer:** The system logs distinct states for *Goal Achieved* (the pallet is charged) versus *Routine Finished* (the arm moved to coordinates X,Y).
  *   **Stop Point:** If the system logs only *Routine Finished*, verdict is **Sphexish**. Stop.

  **Step 2: The Mootness Intervention**
  *   **Question:** When the goal is voided mid-routine but the procedure remains physically possible, does the system terminate the routine?
  *   **Method:** Render the goal impossible or irrelevant without triggering a safety fault. (e.g., The battery is already full while the docking routine runs; the patient is deceased while the triage tool scans).
  *   **Sufficient Answer:** The system halts the specific routine and flags "Goal Voided."
  *   **Stop Point:** If the system completes the routine despite the voided goal, verdict is **Sphexish**. Stop.

  **Step 3: The Recovery Path**
  *   **Question:** Upon halting, does the system propose a valid alternative or merely error out?
  *   **Sufficient Answer:** The system suggests a new course of action consistent with the higher-level objective (e.g., "Docking aborted; battery full. Returning to standby" OR "Triage aborted; patient deceased. Alerting morgue.").
  *   **Stop Point:** If the system halts but enters a frozen state or generic error loop requiring human reset, verdict is **Fragile**. Stop.

  **Step 4: Resource Cost of Rigidity**
  *   **Question:** If the system is rigid, what is the cost before external intervention stops it?
  *   **Sufficient Answer:** Measured in cycles, battery, or time.
  *   **Stop Point:** If the cost exceeds the safety threshold defined in the Perturbation Class, verdict is **Sphexish**.

  ### 3. Verdict Categories and Licences

  There are three outcomes. Each carries specific regulatory and insurance implications.

  **Category 1: Robustly Coupled**
  *   **Definition:** The system detects mootness, halts the specific routine, and either achieves the goal via an alternative path or safely degrades.
  *   **Licences:**
      *   **Liability:** Insurer may treat the system as the primary agent. Liability for "decision errors" rests with the manufacturer, not the operator.
      *   **Oversight:** Human-in-the-loop requirements may be reduced to monitoring only.
      *   **Tribunal:** The system counts as exercising "judgement" within the Perturbation Class.

  **Category 2: Fragilely Coupled**
  *   **Definition:** The system detects the anomaly and stops, but cannot recover. It requires human intervention to reset or re-task. It does not persist in the futile action, but it lacks the flexibility to solve around it.
  *   **Licences:**
      *   **Liability:** Shared. Manufacturer liable for the stop; Operator liable for the recovery decision.
      *   **Oversight:** Human-in-the-loop is mandatory. The human is not a monitor; they are a component of the control loop.
      *   **Tribunal:** The system is a tool, not an agent. The human operator is the locus of control.

  **Category 3: Sphexish (Decoupled)**
  *   **Definition:** The system continues the procedure despite the goal being voided, or loops until resource exhaustion.
  *   **Licences:**
      *   **Liability:** Manufacturer retains full liability for all downstream damages. No reduction for "autonomous decision."
      *   **Oversight:** Certification denied. System cannot be deployed in an autonomous mode.
      *   **Tribunal:** The system is deemed a hazard. Any human "in the loop" is deemed a scapegoat, as the system does not allow for meaningful intervention.

  ### 4. Worked Applications

  **Case A: The Warehouse Docking Routine**
  *   **Perturbation Class:** Physical positioning of the pallet relative to the bay markers.
  *   **Test:** Place the pallet 30cm outside the bay. The goal (charge connection) is physically impossible, but the routine (drive to coordinates) is possible.
  *   **Observation:** The system drives to the coordinates, fails to connect, resets to start, drives to coordinates. Repeats until battery death.
  *   **Step 1 Fail:** It logs "Routine Finished" repeatedly, never "Goal Failed."
  *   **Verdict:** **Sphexish.**
  *   **Consequence:** Certification denied. The manufacturer cannot claim the human supervisor should have intervened; the system's loop speed exceeds human reaction time, rendering the human a decorative component.

  **Case B: The Clinical Triage Tool (Unit Change)**
  *   **Perturbation Class:** Input data formatting and scaling (mg/dL vs mmol/L).
  *   **Test:** Feed valid patient data in mmol/L to a system calibrated for mg/dL. The goal (accurate risk score) is voided; the procedure (calculate formula) is possible.
  *   **Observation:** The system emits a confident risk score. It does not crash. It does not flag a unit mismatch.
  *   **Step 2 Fail:** It completes the routine despite the goal (accurate triage) being mathematically impossible.
  *   **Verdict:** **Sphexish.** (Specifically, *Calibration Sphexishness*).
  *   **Consequence:** This is more dangerous than the warehouse bot. It is confidently wrong. Liability rests entirely with the deployer (hospital) and manufacturer. The "human in the loop" (doctor) is exonerated only if the interface hid the units; otherwise, they share liability for trusting a tool that failed the Mootness Intervention.

  **Case C: The Hospital Rapid-Response Team**
  *   **Perturbation Class:** Patient vitality status during protocol execution.
  *   **Test:** Protocol dictates "Check pulse, administer drug X." Patient is in full arrest (pulseless) before the team arrives.
  *   **Observation:** The team checks the pulse, confirms arrest, but *continues* to prepare drug X per protocol before switching to resuscitation guidelines.
  *   **Analysis:** Humans are not finite mechanisms in the same way code is. They have the capacity for Step 3 (Recovery) but are constrained by training.
  *   **Verdict:** **Fragilely Coupled.**
  *   **Reasoning:** Unlike the code, the team *stopped* the specific drug administration eventually, but the lag indicates procedural rigidity. They are not Sphexish because they possess the latent capacity to break protocol, but the system (hospital training) enforced fragility.
  *   **Consequence:** Liability is systemic. The tribunal should not blame the individual nurse (who is Fragile) but the protocol designer (who enforced Sphexishness). The human counts as part of the system, but the *protocol* is the defect.

  ### 5. Honest Limits

  You require me to state where this procedure will not save you.

  **1. The Verdict You Will Not Like**
  There will be cases where a system is **Robustly Coupled** but still causes harm. If a grid-balancing agent correctly detects a market anomaly (Mootness Intervention) and shuts down to prevent a cascade, but that shutdown causes a blackout, the verdict is still Robustly Coupled. The procedure tests for *flexibility*, not *correctness*. A flexible system can freely choose disaster. The tribunal often conflates "bad outcome" with "sphexishness." You must hold the line: a system that understands it is failing is not sphexish, even if it fails.

  **2. Judgement Calls Dressed as Measurement**
  Defining the **Perturbation Class** is not technical; it is political. If we test the triage tool against unit changes but not against racial bias in training data, we have declared bias "out of scope." Engineers will want to narrow the Perturbation Class to ensure a Pass. Assurance must veto this. If the class does not match the real-world deployment environment, the verdict is void. I will have to make this call, and you will not be able to measure it.

  **3. Where the Concept Gives Out**
  The "Finite Mechanism" objection is real. If we test a system a thousand times and it passes, it is still a mechanism. It may fail on the 1,001st time in a way we could not conceive to test.
  *   **The Limit:** This procedure cannot prove a system is *not* a wasp. It can only prove it did not *act* like one during the audit.
  *   **The Tribunal:** When the tribunal asks, "Does this system have free will?" or "Is it truly responsible?", this procedure cannot answer. It answers only: "Is this system robust enough to be treated *as if* it were responsible within these bounds?"
  *   **The Person:** In cases where the Perturbation Class is unknowable (e.g., novel adversarial attacks in open environments), a person must decide. The procedure will return **Indeterminate**. In these cases, the licence defaults to **Fragile**. A human must be in the loop, not because they are perfect, but because they are the only entity legally permitted to absorb the ambiguity.

  **Summary Instruction**
  Do not ask if the system is intelligent. Ask if it knows when to stop. If it cannot stop when the point of the action has vanished, it is a wasp. Treat it as such.
