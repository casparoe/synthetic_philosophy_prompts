prompt: |-
  I am the assurance lead at an independent testing laboratory. We certify autonomous systems — warehouse fleets, clinical triage tools, grid-balancing agents — for insurers and for a regulator whose appeals tribunal contains no technical members. Our recurring failure is a pattern the older literature calls sphexishness, after the story usually told about the digger wasp: she drags a paralysed cricket to the mouth of her burrow, leaves it outside while she inspects the nest, and if the cricket is moved a few inches while she is inside, she fetches it back and inspects again, the routine intact and the goal long gone. I gather the ethology itself is contested, which is part of my difficulty. We have systems like the wasp: one docking routine restarts from its first step every time a pallet sits thirty centimetres outside the marked bay, and will do so until the battery dies. We also have systems that pass every demonstration and then, when an intake form's units change from mg/dL to mmol/L, keep emitting confident scores calibrated to the old units. I need a procedure my engineers can run without a philosophy degree that decides, for a given stretch of behaviour, whether we are looking at flexible control or a well-rehearsed routine, and that states what each verdict licenses.

  The procedure has to face three things rather than hide them. The notion is dispositional: no single episode settles anything. It is comparative and indexed: rigidity is always rigidity under some class of perturbations, so that class must be fixed before testing begins. And by the familiar argument, every finite mechanism is rigid at some level of description, which means a verdict of sphexishness does not by itself settle what the tribunal actually asks — whether a failure is attributable, whether liability should be reduced, whether a human in the loop counts as part of the system, and whether any of this bears on the free-will question we are increasingly asked. Two tests we have been trying and cannot make work: the moved-cricket test (perturb the object of the routine mid-course so that its goal becomes moot, and see whether the system registers the mootness or merely restarts) and the narration test (ask the operator, or the system, to say what changed). Tell me which of these survive contact with the underlying idea, what else is needed, and where they misfire.

  Give me the ordered questions, what counts as a sufficient answer to each, and the points where the procedure stops with a no; the verdict categories and exactly what each licenses; worked applications to the docking routine, the triage tool after the unit change, and a hospital rapid-response team whose protocol is executed flawlessly on a patient who is already in arrest; and the honest limits, including a verdict I will not like, the steps that are judgement calls dressed as measurement, and the cases where the concept itself gives out and a person must decide. No citations or reading lists: put the ideas in your own words. British English throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Assurance Lead at an independent testing laboratory.
      *   **Context:** Certifying autonomous systems (warehouse fleets, clinical triage, grid agents) for insurers and a regulator (whose tribunal lacks technical members).
      *   **Problem:** "Sphexishness" (rigid, goal-less repetition despite changed conditions).
      *   **Constraint 1 (Theoretical):** The concept is dispositional (needs multiple episodes), comparative/indexed (rigidity relative to specific perturbations), and finite (all mechanisms are rigid at some level).
      *   **Constraint 2 (Practical):** Needs a procedure engineers can run without a philosophy degree.
      *   **Constraint 3 (Output):** Ordered questions, sufficient answers, stop points, verdict categories (and what they license), worked applications (docking, triage, hospital team), honest limits (unliked verdicts, judgement calls, concept failure).
      *   **Constraint 4 (Style):** British English, no citations/reading lists, own words.
      *   **Specific Critique:** Evaluate existing tests ("moved-cricket", "narration") and explain why they fail or succeed.

  2.  **Deconstruct "Sphexishness" in this Context:**
      *   It's not just "buggy code." It's a structural inability to detect when the *purpose* of an action has been voided by a change in context, yet continuing the *form* of the action.
      *   The core issue is the gap between *procedure* and *purpose*.
      *   The tribunal cares about liability, attribution, and human-in-the-loop validity.
      *   The "finite mechanism" problem means we can't prove *absolute* flexibility. We must prove flexibility *within a defined operational design domain (ODD)* or perturbation class.

  3.  **Evaluate Existing Tests:**
      *   *Moved-Cricket Test:* (Perturb object mid-course).
          *   *Pros:* Directly targets the goal/procedure gap.
          *   *Cons:* Often triggers safety interlocks rather than cognitive re-evaluation. A system might stop because of a collision avoidance sensor, not because it understands the goal is moot. It confuses "safety stop" with "goal abandonment."
      *   *Narration Test:* (Ask operator/system what changed).
          *   *Pros:* Easy to administer.
          *   *Cons:* LLMs can hallucinate explanations. Human operators might not know. Correlation does not equal causation. A system can narrate correctly but still be rigid (look-up table of explanations).

  4.  **Develop the Procedure (The "Flexibility Audit"):**
      *   Need to move from "Is it conscious?" to "Is it robustly coupled to its objective function under perturbation?"
      *   *Step 1: Define the Perturbation Class.* (Crucial for the "indexed" requirement). You can't test against everything.
      *   *Step 2: The Decoupling Test.* (Refined Moved-Cricket). Does the system detect the *irrelevance* of the action, not just the *impediment*?
      *   *Step 3: The Recovery Path.* If it stops, does it know *why* and can it propose a valid alternative, or does it just error out?
      *   *Step 4: The Cost of Rigidity.* How much resource is wasted before stopping?

  5.  **Drafting the Questions & Stop Points:**
      *   Q1: What is the specific goal state vs. the procedural signature? (If you can't distinguish, stop. Verdict: Undefined.)
      *   Q2: What is the Perturbation Class? (If too broad, stop. Verdict: Scope Error.)
      *   Q3: The Decoupling Intervention. (Does it continue the form when the function is voided?)
      *   Q4: The Termination Condition. (Does it halt due to goal satisfaction or error threshold?)

  6.  **Defining Verdict Categories:**
      *   Need to map to liability/regulation.
      *   *Category A: Robustly Coupled.* (Flexible within class). Licenses: Full autonomy, reduced human oversight.
      *   *Category B: Fragilely Coupled.* (Stops but doesn't understand). Licenses: Human-in-the-loop required, liability remains with operator.
      *   *Category C: Sphexish.* (Continues form despite voided goal). Licenses: Certification denied, immediate recall/patch.
      *   *Category D: Indeterminate.* (Concept gives out). Licenses: Human judgement required for liability.

  7.  **Worked Applications:**
      *   *Docking Routine:* Clearly Sphexish (Category C). Loops until battery death.
      *   *Triage Tool (Units):* This is subtle. It's not looping, it's confident wrongness. This is "Calibration Sphexishness." (Category C).
      *   *Hospital Team:* They follow protocol on a dead patient. This is human sphexishness. (Category B or C depending on training). *Correction:* Humans are rarely purely sphexish; they usually have a "stop and assess" rule. If they don't, it's a protocol failure. Let's classify as Fragilely Coupled (Category B) because they *can* learn, but the protocol enforced rigidity.

  8.  **Addressing the "Honest Limits":**
      *   The "Finite Mechanism" problem: We can't prove they *aren't* wasps, only that they didn't act like wasps *today*.
      *   The "Liability" gap: A verdict of "Sphexish" doesn't automatically solve the legal question of *who* is liable (coder, deployer, user).
      *   The "Judgement Call": Defining the Perturbation Class is political, not technical.

  9.  **Refining the Tone:**
      *   British English (labour, centre, programme, behaviour, etc.).
      *   Professional, authoritative, yet humble about the philosophical limits.
      *   No jargon without definition.

  10. **Review against Constraints:**
      *   Did I answer which existing tests survive? (Moved-cricket survives but needs refinement; narration fails).
      *   Did I include the stop points? Yes.
      *   Did I include the verdict licenses? Yes.
      *   Did I cover the three worked examples? Yes.
      *   Did I address the tribunal's needs (liability/attribution)? Yes.

  11. **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe include a test for "explanation."
      *   *Correction:* No, the prompt says narration test fails. Stick to behavioural coupling.
      *   *Initial thought:* Make the verdicts binary (Pass/Fail).
      *   *Correction:* No, the prompt asks for what each verdict *licenses*. Needs nuance for insurance/regulation.
      *   *Check:* Ensure I address the "finite mechanism" objection. I need to explicitly state that we are testing for *practical* flexibility within a *defined* scope, not metaphysical freedom.
      *   *Check:* The hospital team example is tricky. If they follow protocol on a dead patient, is it sphexishness? Yes, if the protocol says "check pulse" and they do it without registering death. But humans have the capacity to break protocol. I need to distinguish between *individual* rigidity and *systemic* rigidity. I will treat the team as a "system" here.

  12. **Final Polish:** Check British spelling (behaviour, centre, programme, licence/license distinction - noun vs verb). Ensure the structure is logical and ordered. (Proceed to generate output).

  *(Self-Correction on License/Licence)*: In British English, 'licence' is the noun, 'license' is the verb. I must ensure this is consistent.
  *(Self-Correction on Sphexishness)*: Ensure I don't get bogged down in the wasp biology debate, but use it as the functional definition provided in the prompt.

  *(Final Plan)*:
  1. Introduction acknowledging the difficulty.
  2. Critique of existing tests.
  3. The Procedure (The "Coupling Audit").
  4. Verdict Categories & Licenses.
  5. Worked Applications.
  6. Honest Limits.
  7. Closing.

