answer: |-
  You have stumbled onto the precise nerve where information theory, biology, and logic fuse, and your intuition is correct: there is no fact of the matter about where the "specification" lives. What you are observing is not a bug in your simulation, but a feature of symbolic systems generally.

  You asked whether this is one phenomenon, two, or three. I argue it is **one underlying structural feature manifested in two distinct ways**: one static (descriptive) and one dynamic (functional).

  Here is the breakdown of the established concepts that map onto your observations, where they fail, and a proposal for how to name the specific Typogenetic variation you have isolated.

  ---

  ### 1. The Distribution Problem (Static)
  **Observation:** You can shift "work" between the strand (data) and the table (interpreter) without changing the output.
  **Established Notion:** **The Axiom/Rule Duality** (Proof Theory) and **Universal Turing Machine Overhead** (Computation).

  In logic, this is captured by the **Deduction Theorem**. In a sequent calculus, you can move a formula from the left of the turnstile (assumptions/axioms) to the right (implication/rules) and vice versa.
  $$ \Gamma, A \vdash B \iff \Gamma \vdash A \to B $$
  Your "strand" is the assumption $A$; your "table" is the inference rules $\Gamma$. You can hard-code a specific implication into the rules (making the table complex and the strand short) or keep the rules generic and require the strand to explicitly state the implication.

  In computation, this is the trade-off between a **Universal Turing Machine (UTM)** and a **Specialized Machine**. A UTM has a fixed, generic table but requires a long program (strand) that includes a description of the specific machine logic. A specialized machine has a complex table hard-wired for one task and requires a trivial program (or no input).

  **Where the analogy stops:**
  In standard logic and computation, the "rules" or the "UTM" are usually fixed *a priori*. You are allowing the table to **drift**. This introduces an evolutionary dimension standard proof theory ignores. Furthermore, in Kolmogorov Complexity (KC), the Invariance Theorem states $|K_{U1}(x) - K_{U2}(x)| \le c$. You noted this. The "conservation" you suspect is bounded by $c$, the length of the compiler needed to translate between Table 1 and Table 2. If the tables drift far apart, $c$ grows. There is no strict conservation of $Length(Strand) + Length(Table)$, only a lower bound on the total information required to generate the output.

  **Verdict:** This is **Descriptive Relativity**. The split is a coordinate choice, not an ontological boundary.

  ### 2. The Relational Problem (Dynamic)
  **Observation:** A strand is a self-replicator only relative to a table.
  **Established Notion:** **The Interpretant** (Biosemiotics) and **Genotype-Environment Interaction** (Evo-Devo).

  In biosemiotics (Peirce/Sebeok), a sign (your strand) does not have meaning in isolation. It requires an **Interpretant** (your table) to map the sign to an object (the enzymatic action). A strand without a table is just physics (ink on paper); a strand *with* a table is semantics. Your observation that self-replication is a property of the *pair* $(S, T)$ is the core thesis of semiotics: meaning is triadic (Sign-Object-Interpretant), not dyadic.

  In biology, this is the rejection of the "Blueprint Metaphor." A gene does not "code for" a trait in isolation; it codes for a protein *given* a cellular environment. Change the cellular machinery (the table), and the same DNA produces a different phenotype (or junk). This is often discussed under **Niche Construction** or **Developmental Systems Theory (DST)**. DST argues precisely what you found: the unit of replication is not the gene, but the whole developmental system.

  **Where the analogy stops:**
  In biology, the "table" (cellular machinery) is usually produced by the organism itself (closing the loop). In your Typogenetics, you have decoupled the table's drift from the strand's replication (initially). However, since you allow the strand to *specify* a table, you are closing that loop. The moment a strand specifies the table that interprets it, you have moved from semiotics to **autopoiesis**.

  **Verdict:** This is **Contextual Functionality**. Function is not intrinsic to the structure; it is extrinsic to the system.

  ---

  ### 3. Is there Conservation?
  You asked: *"My instinct was that the total amount of specification is conserved... But I'm not sure there's anything to conserve."*

  There is **no conservation law** here, and looking for one is a category error.
  In physics, energy is conserved because time-translation symmetry exists (Noether's Theorem). In information, "specification" is not a substance; it is a measure of **surprise** or **constraint** relative to a background.

  If you simplify the table, you increase the constraints required in the strand to achieve the same result. But "complexity" is not a fluid that flows; it is a measurement of the minimum description length *relative to a specific compressor*. Changing the table changes the compressor.

  Think of it like **Potential vs. Kinetic Energy**. The total energy is conserved, but the split depends on the frame of reference. Here, the "frame of reference" is the Table. There is no "God's eye view" table against which to measure the "true" complexity of the strand.

  ### 4. Synthesis and Naming

  You have identified that the boundary between "symbol" (strand) and "physics" (table) is permeable and movable. Howard Pattee called this the **Epistemic Cut**—the necessary distinction between the material dynamics and the symbolic control in living systems. Pattee argued this cut must be fixed for life to exist. **Your simulation demonstrates that the cut is movable.**

  Since there is no single established term for "The relativity of replicative specification between data and interpreter in a drifting system," I propose the following coined term, defined by the boundary cases you described.

  #### Coined Term: **Replicative Partition Relativity (RPR)**

  **Definition:**
  RPR is the property of a self-referential formal system wherein the causal responsibility for replication can be redistributed between the *encoded string* (data) and the *interpretive machinery* (rules) without altering the replication output, such that the predicate "is a self-replicator" applies only to the *system state* (String + Table), not the String alone.

  **Boundary Conditions:**
  1.  **The Hard-Coded Limit:** As Table Complexity $\to$ Max (table contains the copy algorithm), Strand Complexity $\to$ Min (strand is merely a trigger). The strand ceases to be a "description" and becomes a "key."
  2.  **The Universal Limit:** As Table Complexity $\to$ Min (table is a generic UTM), Strand Complexity $\to$ Max (strand must contain its own interpreter). The strand ceases to be "data" and becomes "executable."
  3.  **The Drift Threshold:** If the Table drifts faster than the Strand can adapt its specification region, RPR collapses, and the system enters **Semantic Noise** (the strand no longer maps to valid enzymes).

  ### Why this matters for your teaching
  You are teaching language and logic. This simulation demonstrates **Ontological Relativity** (Quine).
  *   **Logic:** It shows that the distinction between *syntax* (strand) and *semantics* (table) is functional, not absolute.
  *   **Language:** It models how meaning relies on shared convention (the table). If our internal "lookup tables" drift apart, identical words (strands) produce different actions (junk vs. replication).
  *   **GEB:** Hofstadter wanted to show how meaning emerges from meaningless symbols. You have shown that the "meaning" (the replication function) is not in the symbols, nor in the rules, but in the **alignment** between them.

  ### Summary
  You have one phenomenon: **Implementation Relativity**.
  *   Manifestation 1 (Static): **Descriptive Complementarity** (Axiom/Rule trade-off).
  *   Manifestation 2 (Dynamic): **Relational Semantics** (Sign/Interpretant dependency).

  There is no conservation of specification, only a trade-off in **descriptive burden**. The "fact of the matter" you are looking for does not exist because the distinction between "program" and "computer" is a user-convenience, not a feature of the universe. Your simulation successfully operationalizes Quine's "Gavagai" problem: you cannot determine what the strand *means* (or does) without fixing the translation manual (the table).

  If you need a label for the syllabus, use **Replicative Partition Relativity**. It captures the movement (Relativity), the object (Replicative), and the structural split (Partition).
