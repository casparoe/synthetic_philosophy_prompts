prompt: |-
  I work as the sole human-consent reviewer for a mid-sized university's research ethics board — mostly psychology experiments, some medical studies, maybe 30 protocols a month, and I have maybe 20 minutes per protocol before I have to flag it, pass it, or kick it to the full board. The board's written guidance basically just says consent must be "voluntary, informed, and competent," which is fine as a principle but useless to me on a Tuesday afternoon when I'm staring at a stack of applications. What I want is an actual procedure I can run: the checks in order, what a passing answer looks like for each, where the procedure ends in an automatic flag to the full board, and — this is the part our guidance never admits — where a check can't be settled by procedure at all and I just have to make a judgment call and say so.

  The philosophical stuff I half-remember from a bioethics course years ago (validity conditions like adequate disclosure, competence, absence of coercion or manipulation, and whatever the difference is supposed to be between invalidating a consent and merely making it regrettable) should be in there, but translated into questions a non-philosopher like me can ask of a protocol. I especially want the procedure to handle the fuzzy middle cases, because those are exactly the ones I keep agonizing over: a psychology study that uses deception and only reveals it in a debrief afterward (can consent given in advance cover being lied to?); a study paying $200 for a few hours of mildly unpleasant tasks, which I suspect is fine for students but maybe coercive for people in real financial need; and a surgeon recruiting her own patients into her clinical trial, where the person obtaining consent has authority over the participant's future care. If your procedure could also tell me what to do about an elderly participant whose daughter answers all the screening questions "for" her, that would help, because right now I have no idea whether that's a competence problem or a coercion problem or neither.

  Please run the finished procedure on those cases and show me the output — including at least one where it gives me an answer I won't like (I'm thinking of the surgeon one, since we've never rejected anything from that department and I doubt the board will thank me). And be blunt about where the procedure will misfire or where two reasonable reviewers following it could come out differently, since the whole point is that I stop pretending my gut instinct is a checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Sole human-consent reviewer for a mid-sized university IRB (Institutional Review Board).
      *   **Workload:** ~30 protocols/month, ~20 minutes/protocol.
      *   **Problem:** Existing guidance ("voluntary, informed, competent") is too abstract. Needs a concrete, actionable procedure/checklist.
      *   **Needs:**
          *   Ordered checks.
          *   Pass/Fail criteria for each.
          *   Automatic trigger for Full Board review.
          *   Explicit identification of "Judgment Call" zones (where procedure fails).
          *   Application to specific edge cases (Deception, Undue Inducement, Therapeutic Misconception/Authority, Surrogate Decision Making).
          *   Blunt honesty about limitations/disagreement potential.
      *   **Tone:** Professional, pragmatic, slightly cynical (acknowledging the reality of IRB work), philosophically grounded but translated into operational language.

  2.  **Deconstruct the Ethical Principles (The "Philosophical Stuff"):**
      *   *Voluntariness:* No coercion, no undue inducement, freedom to withdraw.
      *   *Informed:* Disclosure, comprehension, material risks/benefits.
      *   *Competence:* Capacity to understand and decide.
      *   *Validity vs. Regret:* A consent can be valid even if the outcome is bad, provided the process was sound. Invalid consent means the authorization never legally/ethically existed.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   *Constraint:* Must fit within 20 minutes. Needs to be a funnel. Start with hard stops, move to fuzzy areas.
      *   *Structure:*
          1.  **Threshold Check (Competence & Authority):** Is the person *able* to consent?
          2.  **Disclosure Check (Informed):** Do they know what they are getting into?
          3.  **Voluntariness Check (Coercion/Influence):** Are they being pushed or bought?
          4.  **The "Judgment Call" Gate:** Where does the reviewer have to step in?
          5.  **Full Board Trigger:** When does this exceed single-reviewer authority?

  4.  **Refining the Checks (Translating Philosophy to Protocol):**
      *   *Competence:* Don't diagnose. Look for *process*. Is there a screening tool? Is there a surrogate protocol?
      *   *Informed:* Look for "material risk." Is the language readable (6th-8th grade level)? Is deception justified?
      *   *Voluntariness:* Look for power dynamics (professor/student, doctor/patient) and payment ratios.
      *   *The "Judgment Call":* This is crucial. The prompt asks to admit where the procedure breaks. This needs to be highlighted as the "Zone of Discretion."

  5.  **Developing the Test Cases (Running the Procedure):**
      *   *Case 1: Deception (Psychology).*
          *   Check: Disclosure fails initially. Is there a debrief? Is the risk minimal?
          *   Outcome: Likely Pass with conditions (debrief mandatory).
      *   *Case 2: Payment ($200/unpleasant).*
          *   Check: Undue inducement. Is it coercive for vulnerable populations?
          *   Outcome: Judgment Call. Needs Full Board if targeting low SES.
      *   *Case 3: Surgeon/Patient (Therapeutic Misconception).*
          *   Check: Authority/Coercion.
          *   Outcome: **Hard Flag.** This is the "answer I won't like." High risk of coercion/therapeutic misconception. Needs independent consent provider.
      *   *Case 4: Elderly/Daughter.*
          *   Check: Competence vs. Surrogate.
          *   Outcome: Flag for Competence Assessment. Daughter cannot just "answer for" without legal/medical designation.

  6.  **Addressing the "Blunt Truth" Requirement:**
      *   Acknowledge that checklists create false security.
      *   Acknowledge that two reviewers might disagree on "undue inducement."
      *   Acknowledge that the "Full Board Trigger" is often political as much as ethical.

  7.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Keep the checklist tight. Use "Red Flags" for immediate escalation.
      *   *Critique:* Did I answer the specific prompt about "invalidating vs. regrettable"?
      *   *Fix:* Add a specific note in the introduction or conclusion about validity conditions.
      *   *Critique:* The user wants the output of the procedure on the cases.
      *   *Fix:* Create a specific section "Procedure Output on Your Cases."
      *   *Tone Check:* Ensure I'm not sounding like a textbook but like a senior colleague handing over a toolkit.

  8.  **Final Polish:**
      *   Organize with clear headers.
      *   Use bold text for actionable items.
      *   Ensure the "Surgeon" case delivers the uncomfortable truth requested.
      *   Make sure the "Judgment Call" section is distinct from the "Checklist" section.

  **(Self-Correction Note):** I need to make sure I don't just give ethical advice, but a *procedure*. It needs to look like a workflow. Step 1, Step 2, Step 3. If X, then Y.

  Let's build the "Consent Validity Protocol (CVP-20)."

  *   *Step 1: Capacity & Authority.* (Hard Stop)
  *   *Step 2: Disclosure & Comprehension.* (Hard Stop)
  *   *Step 3: Voluntariness & Influence.* (Judgment Zone)
  *   *Step 4: The "Full Board" Trigger.*

  Okay, ready to write. I will structure the response as a direct handover of this protocol, followed by the test runs, followed by the "limitations" disclaimer.cw
answer: |-
  Here is a procedural workflow designed for your constraints (20 minutes/protocol, single reviewer). It translates the philosophical conditions of valid consent (competence, disclosure, voluntariness) into operational checks.

  It is divided into **Hard Stops** (objective failures), **Judgment Zones** (where you must exercise discretion), and **Full Board Triggers** (where your authority ends).

  ### The Consent Validity Protocol (CVP-20)

  **Time Budget:** 20 Minutes
  **Goal:** Determine if the *process* of consent described in the protocol renders the authorization valid, invalid, or indeterminate.

  #### Phase 1: Capacity & Authority (5 Minutes)
  *Philosophical Basis: Competence.*
  *Goal: Ensure the person signing has the legal and cognitive standing to do so.*

  1.  **The Population Check:**
      *   **Q:** Does the protocol involve children, prisoners, pregnant women, or cognitively impaired adults?
      *   **Pass:** No.
      *   **Fail/Flag:** Yes. → **Automatic Full Board Review.** (These require specific regulatory sub-categories you cannot approve solo).
  2.  **The Surrogate Check:**
      *   **Q:** If a third party (e.g., a daughter) is providing consent or answering screening questions, is there a mechanism to verify legal authority (POA, guardianship) or a documented capacity assessment of the participant?
      *   **Pass:** Protocol specifies a capacity screen (e.g., MMSE) *before* consent, OR specifies legal documentation for surrogates.
      *   **Fail:** Protocol assumes family members can consent by default without verification. → **Return to PI for revision.**
  3.  **The Language Check:**
      *   **Q:** Is the consent form written at an 8th-grade reading level or below? (Run a quick Flesch-Kincaid check).
      *   **Pass:** Yes.
      *   **Fail:** No. → **Return to PI.** (Informed consent is impossible if unreadable).

  #### Phase 2: Disclosure & Comprehension (5 Minutes)
  *Philosophical Basis: Informed (Adequate Disclosure).*
  *Goal: Ensure the participant knows what they are agreeing to, distinguishing "risk" from "regret."*

  4.  **The Material Risk Check:**
      *   **Q:** Are the top 3 most likely or severe risks listed in the first page of the consent form?
      *   **Pass:** Yes.
      *   **Fail:** Risks are buried in Appendix B or legalistic jargon. → **Return to PI.**
  5.  **The "Regret vs. Invalidity" Check:**
      *   **Q:** Does the protocol disclose that the intervention might not work or might be uncomfortable, without guaranteeing benefit?
      *   **Pass:** Yes. (A participant can validly consent to something that turns out badly, provided they knew it *could* turn out badly).
      *   **Fail:** Language implies guaranteed therapeutic benefit (Therapeutic Misconception). → **Return to PI.**
  6.  **The Deception Check:**
      *   **Q:** If deception is used, is there a mandatory debriefing procedure where the true nature is revealed *immediately* after participation?
      *   **Pass:** Yes, debrief is scripted and mandatory.
      *   **Fail:** Deception is permanent or debrief is optional. → **Automatic Full Board Review.** (Waiver of informed consent elements requires higher scrutiny).

  #### Phase 3: Voluntariness & Influence (5 Minutes)
  *Philosophical Basis: Voluntary (Absence of Coercion/Undue Inducement).*
  *Goal: Identify power imbalances that compromise freedom.*

  7.  **The Power Dynamic Check:**
      *   **Q:** Is the person recruiting/consenting the participant also in a position of authority over them (Teacher/Student, Doctor/Patient)?
      *   **Pass:** No, or there is a neutral third-party consent provider.
      *   **Fail:** Yes, and no buffer is in place. → **See Judgment Zone A.**
  8.  **The Payment Check:**
      *   **Q:** Is the payment prorated (paid even if they quit) and proportional to time (not exceeding local hourly wage by >3x)?
      *   **Pass:** Yes.
      *   **Fail:** Lump sum only upon completion OR payment is significantly high relative to local median income. → **See Judgment Zone B.**

  #### Phase 4: The Judgment Zone & Full Board Trigger (5 Minutes)
  *Philosophical Basis: Validity Conditions that cannot be proceduralized.*
  *Goal: Acknowledge where the checklist ends and your liability begins.*

  **Judgment Zone A (Authority/Coercion):**
  If Phase 3, Q7 was a "Fail" (e.g., Doctor recruiting own patient):
  *   **Ask:** Is the research *clinical care* or *data collection*?
  *   **Call:** If it is data collection/experimental, you cannot approve this solo. The authority differential is too high.
  *   **Action:** **Flag to Full Board.**

  **Judgment Zone B (Undue Inducement):**
  If Phase 3, Q8 was a "Fail" (e.g., $200 for 2 hours):
  *   **Ask:** Is the target population financially vulnerable (low SES, students in debt, uninsured)?
  *   **Call:** If Yes, the money is not compensation; it is a blindfold. It obscures risk.
  *   **Action:** If vulnerable population → **Flag to Full Board.** If general population → **Pass with Warning** (require prorated payment).

  **The "Gut Check" Clause:**
  *   **Instruction:** If you have read the protocol and feel a sense of dread or hesitation that you cannot map to a specific failed check above, **Flag to Full Board.**
  *   **Reason:** This is not intuition; this is pattern recognition of risk not captured by the checklist. Do not override this.

  ***

  ### Procedure Output on Your Cases

  Here is how the CVP-20 runs on the four scenarios you provided.

  #### Case 1: Psychology Deception Study
  *   **Phase 1:** Pass (Adult students).
  *   **Phase 2:** Check 6 (Deception). Protocol includes a scripted debrief immediately following the task.
  *   **Phase 3:** Pass (No financial coercion).
  *   **Judgment Zone:** None triggered.
  *   **Output:** **PASS.**
  *   **Reviewer Note:** Valid consent is possible here because the "waiver" of information is temporary and justified by the study design. The debrief restores the "Informed" condition retroactively, making the initial authorization valid.

  #### Case 2: $200 for Unpleasant Tasks
  *   **Phase 1:** Pass.
  *   **Phase 2:** Pass (Risks disclosed).
  *   **Phase 3:** Check 8 (Payment). $200 for "a few hours" is ~$50-$100/hour. This exceeds the 3x hourly wage threshold.
  *   **Judgment Zone B:** Is the population vulnerable?
      *   *Scenario A (General Public):* **PASS with Warning.** Require prorated payment.
      *   *Scenario B (Low Income/Students):* **FLAG TO FULL BOARD.**
  *   **Output:** **FLAG (Conditional).**
  *   **Reviewer Note:** This is the "Undue Inducement" trap. High payment does not invalidate consent for a millionaire; it invalidates consent for someone who *needs* the $200 to eat. You cannot determine this from the protocol alone without knowing the recruitment demographics. If they are recruiting from a financial aid list, this is coercive.

  #### Case 3: Surgeon Recruiting Own Patients
  *   **Phase 1:** Pass.
  *   **Phase 2:** Check 5 (Therapeutic Misconception). Likely Fail. Patients often conflate research with care.
  *   **Phase 3:** Check 7 (Power Dynamic). **FAIL.** Surgeon controls future care.
  *   **Judgment Zone A:** Is there a neutral consent provider? Protocol says "Surgeon will obtain consent."
  *   **Output:** **FLAG TO FULL BOARD.** (This is the answer you won't like).
  *   **Reviewer Note:** You cannot approve this. The authority differential creates implicit coercion ("If I don't sign, will she operate on me next week?"). Valid consent requires a "firewall" between clinical care and research enrollment. The protocol must be revised to have a research nurse, not the surgeon, obtain consent. If the department pushes back, cite the *authority differential*, not the surgeon's integrity.

  #### Case 4: Elderly Participant, Daughter Answering
  *   **Phase 1:** Check 2 (Surrogate). **FAIL.**
  *   **Output:** **RETURN TO PI.**
  *   **Reviewer Note:** This is a Competence vs. Coercion ambiguity.
      *   If the mother is competent: The daughter answering is **Coercion/Interference**. The mother's voice is being silenced.
      *   If the mother is incompetent: The daughter answering without legal documentation is **Invalid Authority**.
      *   **Procedure:** You cannot guess. The protocol must include a capacity assessment tool. If she fails, the daughter must produce Power of Attorney documents. If she passes, the daughter must leave the room during consent.

  ***

  ### Where This Procedure Will Misfire (The Blunt Truth)

  You asked for honesty about where this breaks. Here are the three failure points of the CVP-20:

  **1. The "Reasonable Reviewer" Disagreement (Undue Inducement)**
  Two reviewers can look at the $200 payment case. Reviewer A says, "It's compensation for discomfort." Reviewer B says, "It's coercion for the poor." The procedure tells you to check the demographic, but often the recruitment plan is vague.
  *   **The Misfire:** You might pass a protocol that a colleague would flag.
  *   **The Fix:** When in doubt on payment, default to **Full Board**. Let the committee argue about economics; don't carry that risk solo.

  **2. The "Therapeutic Misconception" Blind Spot**
  In the Surgeon case, the consent form might be perfect. It might list all risks clearly. The procedure (Phase 2) might say "Pass" on disclosure. But the *context* (the white coat, the hospital room) invalidates the consent regardless of the paper.
  *   **The Misfire:** The checklist validates the *document*, not the *interaction*.
  *   **The Fix:** This is why Phase 3, Check 7 is a Hard Flag. Never trust a consent form to fix a power imbalance.

  **3. The "Validity vs. Regret" Trap**
  A participant might sign a valid consent form, understand the risks, and still have a terrible outcome (e.g., a drug side effect they accepted). They might later claim, "I didn't really understand."
  *   **The Misfire:** You might feel responsible for their regret.
  *   **The Fix:** Remember the distinction. Your job is to validate the *process*, not guarantee the *outcome*. If the procedure was followed, the consent is valid, even if the participant wishes they hadn't signed. Do not let post-hoc regret drive pre-hoc rejection.

  ### Final Instruction for Your Tuesday Afternoon

  When you hit the **Judgment Zone**, stop looking at the checklist. Look at the power dynamic.
  *   If the participant can say "No" without fear of losing something they need (care, grades, housing), consent is likely valid.
  *   If saying "No" carries a cost, the consent is likely invalid.

  If you cannot determine the cost of "No," **send it to the Full Board.** That is what they are there for. Your job is not to be the hero who approves the tricky study; it is to be the gatekeeper who stops the unethical one.
