answer: |-
  **The Logical Space**

  Four diagnostic axes structure the space: (1) Must the Chair register a rule for moderators to enforce it? (2) Does a higher threshold rule block a lower threshold vote? (3) Can long practice cure a defective vote? (4) Are some subjects off-limits to amendment? These permit sixteen combinations. Three regions are empty. First, requiring registration but accepting efficacy without registration is contradictory. Second, denying hierarchy while asserting content limits lacks a mechanism to enforce those limits. Third, insisting the polity survives total replacement while denying efficacy treats the rulebook as a ghost. These are incoherent, not merely unattractive. Question 1 and 3 are not independent: if registration is essential, efficacy cannot cure its absence.

  **The Key**

  1. In Case 8 (Unregistered Rule), must moderators enforce the 90 per cent resolution?
     Yes: Go to 2.
     No: Go to 3.
  2. In Case 3 (Bootstrap), do the simple-majority rules passed during the three years count?
     Yes: Leaf 1.
     No: Leaf 2.
  3. In Case 1 (Repeal), does the 68 per cent vote delete the Lock?
     Yes: Go to 4.
     No: Go to 5.
  4. In Case 6 (Ratchet), is the final rule stripping minority protections in force?
     Yes: Leaf 3.
     No: Leaf 4.
  5. In Case 2 (Freeze), can the later 85 per cent resolution undo the Freeze?
     Yes: Go to 6.
     No: Leaf 5.
  6. In Case 7 (Retro-Repeal), was the Lock in force during the year before repeal?
     Yes: Leaf 6.
     No: Leaf 7.
  7. In Case 5 (Janus), is the new definition of 'Assembly' in force?
     Yes: Go to 8.
     No: Leaf 8.
  8. In Case 10 (Silent Century), is the current rulebook the same polity as the original?
     Yes: Leaf 9.
     No: Leaf 10.
  9. In Case 9 (Vanishing Assembly), are rules passed by thirty active members in force?
     Yes: Leaf 11.
     No: Leaf 12.
  10. In Case 4 (Double), does the Lock stop the lowering of the threshold?
      Yes: Leaf 13.
      No: Leaf 14.

  **The Leaves**

  1. **Official Acceptance.** The Chair's registration determines what counts as law. A mistaken registration changes the rulebook even if the vote failed.
  2. **Strict Formalism.** Only votes complying with existing thresholds create rules. Three years of unified practice count for nothing.
  3. **Flexible Positivism.** Procedure is all; any content may be enacted if steps are followed. A majority may legally abolish minority protections.
  4. **Content Limit.** Some rights cannot be removed regardless of the vote count. There is no rule specifying which rights are protected.
  5. **Irreversible Fetters.** A super-majority can bind future majorities permanently. The polity loses the power to amend its own structure.
  6. **Continuity.** Rules remain in force until properly repealed. Retroactive declarations are merely false statements.
  7. **Narrative Coherence.** The rulebook is a story that can be edited retroactively. Past actions were unlawful then but lawful now.
  8. **Identity Lock.** The original definition of membership cannot be changed. The polity cannot grow or adapt its membership.
  9. **Persistent Identity.** The polity survives total replacement of its rules. There is no limit to how much can change.
  10. **Successor State.** Total replacement creates a new polity. The current Assembly sits without original authorisation.
  11. **Efficacy.** Actual practice determines the rules regardless of formal membership. Ghost members lose their seats without a vote.
  12. **Formal Membership.** Only registered seats confer voting power. Active users are ruled by absentees.
  13. **Hierarchical Priority.** Higher thresholds block lower ones even in single resolutions. Complex resolutions must be split to pass.
  14. **Unnamed.** Simultaneous changes bypass hierarchical constraints. A rule can authorise its own repeal in the same breath.

  **Notes on Rejected Material and Inseparable Leaves**

  Case 11 (Chair's Veto) was dropped as it conflates power with duty, confusing the Chair's refusal with a lack of capacity. Case 12 (External Shutdown) was dropped as it tests survival, not amendment, and relies on external facts outside the rulebook. Case 4 (Double) overlaps with Case 1 but was retained to isolate the simultaneity problem for Leaf 14.

  Leaf 1 (Official Acceptance) and Leaf 11 (Efficacy) converge when the Chair follows practice. They separate only if the Chair resists popular consensus; otherwise, the key cannot distinguish them. Leaf 6 (Continuity) and Leaf 7 (Narrative Coherence) separate only on retroactivity; in all other cases, they yield identical outcomes. Leaf 14 is labelled 'Unnamed' because while logically possible, no stable system adopts it without collapsing into Leaf 3.
