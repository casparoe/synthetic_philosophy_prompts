      I think Dismissal is the right call for a "Vice Chair" trying to guide the board. It shows leadership.

      *Wait, I need to make sure I don't alienate the textualists.* I will phrase the dismissal as an *interpretation* of the rule, not an *exception* to it. This is key. "The rule does not cover this" vs "The rule covers this but we let it slide." The former is stronger legally.

