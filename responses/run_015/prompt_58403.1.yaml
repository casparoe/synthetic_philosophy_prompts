answer: |-
  **MEMORANDUM**

  **TO:** Judiciary Board Members
  **FROM:** Vice-Chair
  **DATE:** October 20, 2024
  **RE:** *Housing v. Priya* (Rule 4(c) Appeal)

  **RECOMMENDATION**
  I recommend the Board **DISMISS** the violation. Rule 4(c) should be interpreted according to its stated safety purpose, which is not implicated by a non-motorized unicycle stored in a single room.

  **BACKGROUND & CONTEXT**
  Rule 4(c) prohibits "wheeled personal conveyances" in rooms. It was enacted last spring specifically in response to an e-bike battery fire on the 3rd floor. The accompanying Housing memo explicitly tied the rule to two risks: (1) fire hazards from batteries/charging, and (2) obstruction of egress/inspections.

  Priya stores a non-electric unicycle in the corner of her single. It has no battery, presents no fire risk, and the RA confirmed it does not block egress. Last year, the Board allowed a resident to store a racing wheelchair in their room, establishing a precedent that "wheeled conveyance" is not an absolute ban when safety risks are absent.

  **ANALYSIS**
  **1. Purpose Over Literalism:** While a unicycle is textually a "wheeled conveyance," regulations should be interpreted to effectuate their purpose, not to create absurd outcomes. The "mischief" Rule 4(c) aims to remedy is fire and egress obstruction. A human-powered unicycle stored in a single room poses neither. Applying the ban here elevates form over substance.

  **2. Precedent:** The wheelchair exception from last year confirms that the Board and Housing have historically distinguished between *hazardous* conveyances and *necessary/safe* ones. Treating a circus unicycle differently than a racing wheelchair would be inconsistent.

  **ADDRESSING THE COUNTER-ARGUMENT**
  I recognize the strong argument from our textualist colleagues: **Predictability and Rule of Law.** If we start carving out exceptions based on "vibe checks" of safety, residents cannot rely on the written rules. If "wheeled conveyance" doesn't mean *all* wheeled conveyances, where is the line? Does this open the door for gas scooters or mopeds if they claim "no fire risk"?

  This concern is valid. However, we are not creating an *exception* here; we are performing a standard *interpretation*. We are defining the scope of "wheeled personal conveyance" *within the context of Rule 4(c)*. The scope is limited to items posing the risks the rule was written to address (batteries, motors, significant bulk). This maintains predictability: residents can rely on the fact that non-hazardous, human-powered equipment stored safely is permissible, while the ban on e-bikes/scooters remains absolute.

  **ORDER**
  1.  **Violation Dismissed.** Priya may retain the unicycle in her room.
  2.  **Safety Condition:** The unicycle must remain stored in the corner as currently verified by the RA. If it is moved to block egress or modified (e.g., motorized), the violation is automatically reinstated.
  3.  **Guidance to Housing:** If Housing intends to ban non-motorized items regardless of risk, they must amend Rule 4(c) to explicitly state "All wheeled devices, regardless of power source."

  This outcome respects the rule's intent, maintains consistency with prior Board decisions, and avoids penalizing a resident for a risk that does not exist.
