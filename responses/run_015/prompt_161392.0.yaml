prompt: |-
  Hey — I teach a joint philosophy/economics seminar on the history of economic thought, 16 undergrads, one 80-minute slot, and next week is Aristotle on exchange. I want them to feel, before I name it, why he thinks two different goods have to be brought under a single measure before any trade between them can be just at all, and why he makes need (chreia) do that job rather than labour, scarcity, or anybody's preferences — the bit in book 5 of the NE with the builder and the shoemaker, where a just exchange is supposed to satisfy the 'diagonal conjunction': builder is to shoemaker as house is to shoes, so the right rate of exchange depends on who is trading, not just on what.

  Can you design me an actual trading game for the room — cards or tokens, tiny non-monetary payoffs, roles, rounds, and nothing needed except index cards and a projector. Two things I want the rules to force on them without me saying anything: partway through, something should happen that makes one good urgently needed without changing how hard it is to produce or how much anyone likes it, and the exchange rate should have to move; and they should end up pricing according to who they're trading with, notice that this feels outrageous to modern intuitions about fairness, and have to work out for themselves what assumption would make it stop feeling outrageous. No lecture up front, and they shouldn't hear the phrase 'diagonal conjunction' until afterwards. If there's room, I'd love a last round where the tokens stop tracking need and people start hoarding them for their own sake, so they can see why Aristotle thinks that's where wealth-getting goes off the rails.

  Then a debrief that maps moments in the game onto the ideas, an honest guess at what will go wrong the first time I run it (I'm expecting somone to try to arbitrage and someone else to just refuse to trade), and a frank note on which bit of Aristotle the activity can't stage — my hunch is it's the claim that need supplies one objective measure rather than a pile of clashing urgencies, tell me if you think thats right. And write the whole thing as one continuous prose email please: no headings, bullets, bold, or tables, I'm pasting it straight into my notes and formatting turns to mush.
