answer: |-
  Hi there, this sounds like a fantastic seminar to teach and you are right to worry that lecturing on commensurability before they feel the problem will just make Aristotle sound like he is stating the obvious or worse, talking nonsense. The key is to make the medium of exchange itself the problem they have to solve, so here is a design for an eighty-minute session that uses only index cards and the projector to force those specific intuitions about need, status, and hoarding without you having to name the concepts until the debrief.

  You will need to prepare three types of index cards beforehand. The first type are Role Cards, eight marked Builder and eight marked Shoemaker. The second type are Good Cards, where you write House on about twenty cards and Shoe on about twenty cards. The third type are Status Cards, which you will hand out later, marked with numbers like 1, 2, or 4. You also need some small slips of paper to act as Money Tokens for the final round if you have time. Start the class by handing out the Role Cards randomly so half the room are Builders and half are Shoemakers. Give each Builder two House cards and each Shoemaker two Shoe cards. Project a single rule on the screen that says To Survive the Round You Must Hold One House and One Shoe. Tell them they have ten minutes to trade freely to ensure everyone survives. Do not intervene. They will quickly settle on a one-to-one exchange rate because the need is symmetrical and the endowments are symmetrical. This establishes the baseline intuition that exchange is just swapping equal things.

  For the second round, collect all the cards, reshuffle the Good Cards, and deal them out again so the endowments are messy, perhaps some Builders have no Houses and some Shoemakers have four Shoes. Now project a new rule that says Winter Has Come. Builders Must Hold Two Shoes to Survive. Shoemakers Still Need One House. Do not change the production cost or say anyone likes shoes more, just change the survival condition. This forces the exchange rate to move purely because the urgency of need has shifted on one side. You will see Builders offering more Houses for Shoes or Shoemakers demanding more Shoes per House. When you stop the round, ask them why the price moved. They will say because Builders needed shoes more. This is your hook for chreia as the measure that fluctuates while the goods remain the same.

  The third round is where you trigger the outrage about pricing based on who is trading. Collect the cards again. Hand out the Status Cards secretly or openly, but ensure all Builders get a Status Card saying Worth 4 and all Shoemakers get a Status Card saying Worth 2. Project a new rule that says A Just Trade Must Reflect the Ratio of Trader Worth. If a Builder trades a House, they must receive Shoes equal to their Worth Ratio. Since Builders are 4 and Shoemakers are 2, the ratio is 2 to 1. A Builder must get 2 Shoes for 1 House. A Shoemaker must give 2 Shoes for 1 House. Enforce this strictly. If a Builder tries to trade 1 House for 1 Shoe, walk over and declare the trade Void and Unjust. They will hate this. They will say it is unfair that the Builder gets more just for being a Builder. They will try to arbitrage or refuse to trade. Let them struggle. The point is that they feel the friction of impersonal market pricing crashing into personal status pricing. When you stop them, ask what assumption would make this stop feeling outrageous. They should eventually say that it would only be fair if the Status Numbers reflected something real about their contribution or merit, which is exactly Aristotle's point about axia or worth being the prior condition for the diagonal conjunction to be just rather than exploitative.

  If you have twenty minutes left, run a fourth round to stage the critique of wealth-getting. Introduce the Money Tokens. Tell them Goods perish at the end of the round but Money Tokens do not. They can trade Goods for Money or Goods for Goods. Survival still requires One House and One Shoe, but any Money left over is kept for a final prize. You will see them stop trading for survival and start trading to accumulate Money. They will hoard the tokens. They will refuse to sell goods to someone who needs them if the price isn't high enough in tokens. This lets you pivot to the distinction between natural exchange for need and unnatural exchange for accumulation, where the token becomes the end rather than the means.

  For the debrief, map the rounds directly to the text. Round two was need acting as the single measure that makes houses and shoes commensurable without being a physical property of the objects. Round three was the diagonal conjunction, where the proportion is not just House to Shoe but Builder to Shoemaker, and justice requires equalizing the persons through the goods. Round four was the separation of exchange from need, which Aristotle identifies as the moment commerce becomes corrupt. You should anticipate two specific failures in the first run. First, someone will try to arbitrage in round three by trading with a third party to bypass the status rule, which is a great moment to point out that Aristotle's justice is relational and political, not market-efficient. Second, someone will refuse to trade in round three on moral grounds, saying the status rule is unjust. This is actually a win for you because it proves that their intuition of fairness relies on an assumption of equal status, whereas Aristotle is asking them to consider a polis where status is unequal but still requires a proportional justice to hold the city together.

  Regarding your hunch on the limitation, you are absolutely right that the activity cannot stage the claim that need supplies one objective measure. In the game, need is just a rule you project on the screen, a subjective urgency that varies by round. Aristotle claims need is a social bond that objectively unifies the polis, a metaphysical glue rather than just a psychological hunger. The game shows need functioning as a measure, but it cannot prove that need is singular or objective rather than a pile of clashing urgencies that we just agree to pretend is one thing for the sake of trade. You will have to lecture that bit because you cannot simulate the metaphysics of the polis in a classroom game, only the mechanics of the exchange. You should tell them that Aristotle thinks money works because we all agree to trust in the future need of the community, whereas the game makes need look like a private constraint. That gap is where the real philosophy lives, and it is fine to admit that the game breaks down there so you can pick up the thread verbally.

  I hope this runs smoothly for you and that the students feel the weight of the status rule before you give them the vocabulary to dismiss it. It is always satisfying when they argue against Aristotle's rules only to realize they are arguing from premises he would recognize. Let me know how the diagonal conjunction lands when they have to live through it.

  Best of luck with the seminar next week.
