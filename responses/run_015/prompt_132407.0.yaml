answer: |-
  The board's working draft presupposes a philosophical architecture grounded in **act-individuation** and **functionalist public memory**. To understand why their distinction between a "commemorative core" and a "biographical periphery" seems reasonable to them, we must reconstruct the implicit theories of responsibility, judgment, and memory that allow them to sever the magnate's philanthropy from the source of his wealth.

  ### 1. Moral Responsibility and Historical Judgment
  The board's rule does not rely on a control-based account of blame. If it did, the magnate would be disqualified, as he exercised direct control over his fleet and knowingly profited from coerced labor. Instead, the board operates on a theory of **domain-specific moral credit**.

  *   **Act-Individuation:** The board treats moral actions as atomized units rather than expressions of a unified character. In this view, the act of funding a library is a distinct moral token from the act of transporting coerced goods. One token does not cancel out the other; they exist in separate ledgers. This rejects the concept of "moral taint," where corruption in one sphere infects the moral value of achievements in another.
  *   **Relevance over Purity:** The theory of historical judgment here is pragmatic rather than retributive. It asks: *Is the specific act being commemorated morally harmful?* It does not ask: *Was the agent morally worthy?* The board assumes that historical judgment should evaluate specific contributions to the public good in isolation from the agent's broader biography, provided the contribution itself is not inherently vicious.

  ### 2. The Ethics of Public Memory
  The distinction between "core" and "periphery" reveals a **transactional theory of public memory**.

  *   **The Gift vs. The Giver:** The board implicitly argues that the plaza commemorates the *gift* (the library, the civic space) rather than the *giver* (the magnate as a whole person). The name is a label for the transaction, not a canonization of the soul.
  *   **Contextualization as Remedy:** By proposing an interpretive installation (the "periphery"), the board assumes that historical truth can be managed through additive context. This presupposes that public memory is capacious enough to hold contradictory truths simultaneously—that a space can be both a tribute to civic generosity and a marker of economic exploitation without the latter invalidating the former.

  ### 3. Requirement vs. Fit
  It is crucial to distinguish what this practice strictly *requires* versus what it merely *fits*.

  *   **Strictly Required:** The practice requires that the **justification for the honor must be logically separable from the harmful conduct.** If the library had been built *by* coerced labor (rather than funded by profits from it), the "core" would be contaminated, and the name would have to go. The rule demands that the honored act be intrinsically benign.
  *   **Merely Fits:** This practice fits comfortably with **liberal individualism**, which views individuals as collections of choices rather than essentialized characters. However, it does not strictly require this metaphysics. A utilitarian could also support this rule if they believed keeping the name produced more social good (stability, continued philanthropy) than removing it, regardless of the magnate's character. Thus, the board is not locked into a specific metaphysics of the self, but they are locked into a **compartmentalized ethics of evaluation**.

  ### 4. Moral Character vs. Moral Action
  An opponent who accepts the board's distinction is effectively locked into a **theory of moral action over moral character**.

  *   **The Lock-In:** If one believes in **Moral Character Holism** (the idea that a person's virtues and vices form a unified whole), the board's distinction collapses. A holist would argue that the exploitation reveals a defect in character that renders the philanthropy suspect (e.g., as guilt-money or reputation-laundering). To accept the "core/periphery" split, one must believe that a moral action retains its value even if performed by a person of defective character.
  *   **The Implication:** Accepting the board's view commits one to the position that public memory is not about modeling virtue (which requires a good character) but about acknowledging benefit (which requires only a good act). You cannot hold the board's view and simultaneously believe that memorials serve primarily as exemplars of moral worthiness.

  ### 5. The Forfeiture Counterfactual
  If we replaced the board's view with one holding that **active, knowing participation in systemic harm forfeits commemorative standing**, the current practice would face a structural collapse. Specific elements would need to be abandoned or reconceived:

  *   **Retention of the Name:** This would have to be abandoned. Under a forfeiture view, the name itself is a continuing act of honor. To keep the name is to assert that the person retains standing. If standing is forfeited, the name becomes a falsehood, not a nuance.
  *   **The Interpretive Plaque:** The plaque would be insufficient and potentially incoherent. A plaque explains *why* someone is honored while adding context. If the person is not worthy of honor, the plaque shifts from "interpretive installation" to "indictment." The space would cease to be a memorial and would become a historical marker of wrongdoing, likely necessitating a rename to reflect the victims or the truth of the exploitation.
  *   **The "Defining Legacy":** The concept of a "defining legacy" would have to be reconceived from *additive* to *determinative*. Currently, the board views the legacy as a sum (Library + Shipping). The forfeiture view treats the legacy as a chain, where the weakest link (exploitation) breaks the whole. The "core" cannot be the library; the "core" becomes the exploitation, because that is the moral condition that determines eligibility for public honor.

  ### Conclusion
  The board's framework relies on the belief that public memory can be **modular**. It assumes we can honor a specific output of a life while condemning the process that made it possible. This requires a commitment to the separability of moral actions and a rejection of the idea that benefaction derived from injustice is morally tainted. To shift to a forfeiture model would be to move from a **transactional ethics** (honoring the gift) to a **relational ethics** (honoring the relationship between the state and the citizen), where the state cannot accept a gift that implicates it in the donor's crimes.
