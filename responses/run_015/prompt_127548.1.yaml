answer: |-
  # Activity Design: The Symmetry Ledger

  ## 1. Overview and Objectives
  **Activity Title:** The Symmetry Ledger
  **Target:** 12 Advanced Philosophy Students
  **Duration:** 90 Minutes
  **Core Philosophical Tension:** The Epicurean claim that death cannot harm the subject (due to non-existence) versus the Deprivationist intuition that death is bad because it removes future goods. The activity forces students to confront the Lucretian Symmetry Argument: if non-existence after death is bad due to lost goods, why is non-existence before birth not equally bad?

  **Pedagogical Goal:** Students will not be told the symmetry argument initially. Instead, they will generate inconsistent harm scores for structurally identical cases of "lost goods." The cognitive dissonance arising from the reveal drives the philosophical inquiry.

  ## 2. Materials and Setup
  *   **Case Cards (12 total):** Two types, printed on different colored cardstock to prevent accidental comparison before pairing.
      *   **Type Red (6 cards):** "Subject Alpha." Status: Never conceived. Biological initiation failed. Potential life span foregone: 50 years. Quantified Goods Lost: 50,000 "Wellbeing Units" (WUs).
      *   **Type Blue (6 cards):** "Subject Beta." Status: Died age 20. Biological cessation occurred. Potential life span foregone: 50 years. Quantified Goods Lost: 50,000 "Wellbeing Units" (WUs).
      *   *Note:* The text on both cards must emphasize the **identical quantity of lost goods** while clearly stating the **temporal direction** (Pre-vita vs. Post-vita).
  *   **Harm Score Sheets:** A simple slip requiring a single integer (0–100) representing "Degree of Harm Suffered by Subject."
  *   **Timer:** Visible to the class.
  *   **Whiteboard:** For recording aggregate scores during the reveal.

  ## 3. Phase-by-Phase Timeline

  ### Phase 1: Silent Scoring (15 Minutes)
  *   **Distribution:** Randomly hand out Red cards to 6 students and Blue cards to 6 students. Instruct them not to show their cards to anyone.
  *   **Instruction:** "You are an auditor of harm. Your task is to assign a Harm Score (0–100) to the subject on your card. Base this score *strictly* on the quantified goods lost relative to a possible alternative existence. Do not discuss metaphysical possibility yet; treat the 'Lost Goods' figure as factual."
  *   **Constraint:** Students must work in silence. They are told this is a calibration exercise for a broader ethical framework.
  *   **Expected Outcome:** Most Blue cards (Death) will receive high harm scores (e.g., 80–100). Most Red cards (Non-conception) will receive low scores (e.g., 0–20), despite identical lost goods.

  ### Phase 2: Paired Negotiation (20 Minutes)
  *   **Pairing:** Pair one Red student with one Blue student.
  *   **Task:** "Compare your Harm Scores. You must agree on a single 'Universal Score' for the pair. You may not change the text on your cards. You must justify your score using only the information provided."
  *   **Constraint:** They cannot appeal to outside theories (e.g., "Kant says...") yet. They must resolve the discrepancy using the data on the cards.
  *   **Facilitator Role:** Circulate. If a pair agrees too quickly, ask: "Did you account for the identical Wellbeing Units?" If they stall, remind them a consensus is required.
  *   **Emergent Problem:** Students will struggle to justify why 50,000 WUs lost in Beta is worse than 50,000 WUs lost in Alpha. They will instinctively reach for "potentiality" or "desires," which are not on the cards.

  ### Phase 3: The Structural Reveal (10 Minutes)
  *   **Data Collection:** Write the initial individual scores on the board in two columns (Red vs. Blue). The asymmetry will be visually obvious.
  *   **The Reveal:** Announce: "The 'Wellbeing Units' and 'Years Lost' were calibrated to be mathematically identical. The only variable changed was temporal direction: before life vs. after life."
  *   **Prompt:** "If harm is defined by deprivation of goods, your scores should match. They do not. Why did you penalize the future loss but not the past loss?"
  *   **Shift:** Do not answer this. Let the silence sit. Then ask: "For whom is this difference bad?"

  ### Phase 4: Open Deliberation (45 Minutes)
  *   **Discussion:** Open the floor. The facilitator now introduces the Epicurean framework as a diagnostic tool for their inconsistency.
  *   **Key Questions:**
      1.  "Does harm require a subject to experience it?" (Experience Requirement)
      2.  "If yes, who is the subject in the Red case? Who is the subject in the Blue case?"
      3.  "If no (Deprivationism), why does time direction matter?"
  *   **Conclusion:** Guide them toward the Epicurean conclusion: If you cannot identify a subject who suffers the asymmetry, the harm score may be a category error.

  ## 4. Debrief: Mapping Activity to Philosophy

  | Activity Phase | Philosophical Component | Conceptual Force |
  | :--- | :--- | :--- |
  | **Silent Scoring** | **Deprivation Logic** | Students intuitively apply deprivationism (lost goods = harm) but apply it inconsistently. This exposes that their deprivationism is not pure; it is tempered by temporal bias. |
  | **Paired Negotiation** | **Symmetry Pressure** | When forced to defend the discrepancy to a peer holding the "mirror" case, students feel the logical pressure of the Lucretian symmetry argument. They cannot find a relevant difference in the *goods* themselves. |
  | **The Reveal** | **Temporal-Symmetry Problem** | The visual data confirms the asymmetry is not in the cases, but in the judges. This mirrors the philosophical claim that the asymmetry is in our *attitudes*, not in the metaphysics of death. |
  | **Open Deliberation** | **The "No Subject" Conclusion** | The facilitator guides the discussion to the Epicurean root: The reason they hesitate to score the Red case high is that there is no one *there* to be deprived. Epicurus argues the same applies to the Blue case. |

  ## 5. Limitations Note: What the Activity Cannot Reproduce
  **The Metaphysical Void:**
  This activity requires students to assign a harm score to a subject. However, the core of the Epicurean position is that **there is no subject** to assign a score to. By asking students to score "Harm Suffered by Subject," the activity inadvertently reifies the non-existent person. It treats "Subject Alpha" as an entity capable of suffering harm, whereas Epicurus claims death is "nothing to us" precisely because "us" ceases to be.

  **Facilitator Correction:**
  In the Deliberation phase, you must verbally interrupt the scoring framework. State clearly: "The activity asked you to score harm for a subject. Epicurus's claim is that this instruction is incoherent. There is no subject to receive the score. The activity simulates the *intuition* of harm, but Epicurus challenges the *possibility* of harm."

  **Phenomenological Absence:**
  Students evaluate the cases from the outside (third-person). Epicurus's argument relies on the first-person perspective (when I am, death is not). The activity cannot simulate the *absence* of experience; it only simulates the *observation* of absence. You must remind them that Epicurus is not making a claim about how death looks to the living, but how it is (or isn't) experienced by the dead.

  ## 6. Prediction of Misfires and Facilitator Handling
  **Predicted Misfire 1: The "Potentiality" Defense**
  *   **Student Move:** "The Blue case had actualized potential; the Red case did not. Beta was on a trajectory; Alpha was not."
  *   **Why it Misfires:** This invokes a metaphysical asymmetry that Epicurus would reject as irrelevant to the subject's experience. It sidesteps the deprivation of goods.
  *   **Facilitator Handling:** Do not refute it immediately. Ask: "Does that trajectory matter *to the subject* once they are gone? If the subject does not exist, can they possess a trajectory?" Push them back to the experience requirement.

  **Predicted Misfire 2: Refusal to Score Prenatal Cases**
  *   **Student Move:** "I gave Alpha a 0 because you can't harm someone who doesn't exist."
  *   **Why it Misfires:** This is actually the correct Epicurean intuition, but if they apply it only to Alpha and not Beta, the symmetry is exposed. If they apply it to both, the activity "succeeds" too easily.
  *   **Facilitator Handling:** If a student scores Beta high and Alpha low, ask: "What property does Beta have that allows them to be harmed, which Alpha lacks, given both are currently non-existent?" Force them to articulate the difference without relying on "we remember Beta."

  **Predicted Misfire 3: Desire Fulfillment**
  *   **Student Move:** "Beta wanted to live. Alpha didn't want anything."
  *   **Why it Misfires:** This shifts the debate from Deprivationism to Desire Fulfillment Theory. While valid, it complicates the specific Epicurean/Deprivationist tension.
  *   **Facilitator Handling:** Acknowledge the point but bracket it: "Let's assume for this exercise that 'Goods' includes desire satisfaction. If Alpha lost the same capacity for desire satisfaction, does the lack of actual desires change the loss of *capacity*?"

  ## 7. Philosophical Status: Settled vs. Contested
  To ensure philosophical precision during the debrief, distinguish between the historical consensus and ongoing debate.

  **Broadly Settled in Literature:**
  *   **Epicurus's Core Argument:** It is consensus that Epicurus argues death cannot be bad for the one who dies because harm requires a subject to experience it, and death eliminates the subject. This is often summarized as: when we exist, death is not present; when death is present, we do not exist.
  *   **Lucretius's Symmetry:** It is settled that Lucretius formulated the symmetry argument regarding prenatal and postmortem non-existence to support the Epicurean view.
  *   **The Experience Requirement:** It is settled that Epicurus relies on a version of the experience requirement (harm must be felt).

  **Genuinely Contested:**
  *   **The Success of Deprivationism:** It is contested whether the Deprivationist account (death is bad because it deprives one of goods) successfully refutes Epicurus. Some argue deprivation does not require experience; others argue this violates the "no subject" constraint.
  *   **The Validity of Symmetry:** It is contested whether prenatal and postmortem non-existence are truly symmetrical. Some philosophers argue there is a metaphysical or modal asymmetry (e.g., we care about the future but not the past) that justifies treating death as bad while birth is neutral.
  *   **The Experience Requirement:** It is contested whether harm necessarily requires conscious experience. Counterexamples (e.g., betrayal unaware of the betrayed) are debated against the Epicurean constraint.
  *   **Temporal Location:** It is contested whether temporal location alone (future vs. past) can ground an asymmetry in harm without invoking a subject to hold the preference.

  **Facilitator Instruction:**
  Do not present Deprivationism as the "solution" to Epicurus. Present it as the dominant counter-argument that the students just intuitively employed during the scoring phase. Do not claim the Symmetry Argument is logically airtight; present it as the pressure test the students felt during the negotiation phase.
