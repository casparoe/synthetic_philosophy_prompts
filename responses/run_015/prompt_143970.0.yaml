      *   **Point 2: Capacity and Consistency (The Physical vs. Mental Divide):**
          *   *What it presupposes:* That mental illness uniquely impairs the *will* or *reasoning* in a way physical illness doesn't.
          *   *The Legal Reality:* In many jurisdictions (like England/Wales under MHA vs. MCA), mental health law creates a specific exception where diagnosis + risk allows override *without* a specific capacity test, whereas physical health requires a capacity test.
          *   *Settled vs. Live:* It is *settled law* in many places that mental health acts carve out this exception. It is *live ethical debate* (and legal challenge) whether this violates disability rights (UN CRPD argues against it).
