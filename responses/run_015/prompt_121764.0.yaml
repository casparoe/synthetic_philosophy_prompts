answer: |-
  # Q&A Prep Sheet: Content Moderation as Institutional Performative

  **Seminar:** Departmental Philosophy of Language
  **Thesis:** Automated moderation as Austinian performative (Verdictive/Exercitive), not descriptive report.
  **Audience Profile:** Analytic Phil of Language/Law; skeptical of non-intentional agency; rigorous on speech-act taxonomy.

  ---

  ## Strategic Opening Concession
  **State this in your first 5 minutes to preempt the "Agency" objection:**
  "I am not arguing that the *classifier itself* possesses intentionality or agency. That would be a category mistake. The code is the *instrument* of locution. The illocutionary agent is the *institution* (the platform corporation), acting through delegated procedural mechanisms. My claim is about the *status of the output* within the institutional framework, not the metaphysical status of the neural network."

  ---

  ## Top 6 Objections (Ordered by Damage & Likelihood)

  ### 1. The Intentionality Gap (The "Homunculus" Objection)
  **Objection:** "Austin and Searle ground illocutionary force in the speaker's intention to secure uptake. A classifier has no mental states. If you locate the intention in the 'institution,' you are relying on a metaphorical aggregation of individual intentions that dissolves under scrutiny. Without a specific intentional agent at the moment of utterance, you have a causal event, not a speech act. You are conflating *perlocutionary* causation (the screen goes blank) with *illocutionary* force."

  **Reply:** "I agree that the code lacks intentionality, which is why I locate the illocutionary agent in the corporation, analogous to how a judge's gavel or a speed camera functions. The intention is encoded in the *constitutive rules* established by the institution (the Terms of Service and policy guidelines). The classifier is merely the phonetic/locutionary mechanism. The illocutionary act occurs not when the weights calculate, but when the system is *authorized* to enact that calculation as a binding status change. The force derives from the institutional standing, not the mental state of the specific engineer or the model at time *t*."

  **Weakest Point:** You are relying on the "Speed Camera" analogy. Unlike a camera, deep learning models are non-deterministic and opaque. If the "utterance" (the ban) cannot be traced back to a specific rule the institution intended to apply (due to black-box weights), the claim that the *institution* intended the specific illocution weakens.

  ### 2. Illocution vs. Perlocution (The "Effect" Objection)
  **Objection:** "You claim the removal constitutes a normative status. But removal is a physical alteration of the database, a *perlocutionary* effect on the user's access. The *illocution* would be the labeling ('This is hate speech'). If the label is invisible to the user (shadow banning) or if the removal happens without a label, there is no uptake. Without uptake, there is no illocutionary act, only brute force."

  **Reply:** "In institutional contexts, uptake is often secured by the *system's response*, not the user's psychological state. When a referee blows a whistle, the play stops regardless of the player's agreement. The 'labeling' is the verdictive act; the 'removal' is the exercitive enforcement of that verdict. Even in shadow banning, the deontic status of the content changes (it is rendered non-public). The illocutionary point is the alteration of the content's normative standing within the platform's ontology, which is achieved by the system's architectural response, securing uptake via the interface design."

  **Weakest Point:** Shadow banning explicitly lacks the publicity required for standard illocutionary uptake. You are stretching the definition of "uptake" to include "systemic enforcement," which risks collapsing the illocution/perlocution distinction entirely.

  ### 3. Felicity Conditions vs. Epistemic Accuracy (The "Verdictive" Objection)
  **Objection:** "You argue we should ignore false positives/negatives in favor of felicity conditions. But Austin's *verdictives* (judging, ranking, assessing) inherently carry a truth-claim. If a judge verdicts 'Guilty' without evidence, the act is *abused*, not merely infelicitous. You cannot sever the felicity of a verdictive from its epistemic grounding. If the classifier is epistemically broken, the verdict is void, not just unfair."

  **Reply:** "I distinguish between *constative* accuracy and *constitutive* validity. In a game, a referee's call is constitutive of the score, even if it contradicts the 'real' events. Content moderation functions more like the referee than the judge. The platform creates a closed normative order. The felicity condition is not 'correspondence to external harm' but 'accordance with promulgated procedure.' A false positive is a *procedural* failure (a bug in the application of the rule), not necessarily an epistemic failure of the institution's right to judge. The moral problem is the procedure, not the truth-value."

  **Weakest Point:** The "Referee" analogy works for games with consensual participants. Platform users are often coerced participants (network effects). If the "game" is a public square, the constitutive/consumptive distinction collapses, and epistemic accuracy returns as a moral requirement for felicity.

  ### 4. Collective Intentionality (The "Searle" Objection)
  **Objection:** "For an institutional fact to exist ('X counts as Y in context C'), there must be collective intentionality—a 'we-accept' among the relevant community. Do users collectively accept the classifier's output as a valid status function? Or do they view it as a glitch or oppression? If the users do not recognize the authority, the institutional fact fails to obtain."

  **Reply:** "Collective intentionality in digital institutions is established through the 'clickwrap' contract and continued participation. By accepting the ToS, users enter the 'context C' where the classifier's output counts as a ban. Resistance or frustration (perlocutionary effects) does not negate the institutional fact, just as a criminal's rejection of the verdict does not negate the legal status of 'convicted.' The standing is derived from the property rights of the platform and the contractual agreement, which sustains the institutional reality regardless of individual psychological acceptance."

  **Weakest Point:** "Clickwrap" is philosophically thin ground for *collective intentionality*. Searle requires a shared recognition of status. If users view the system as illegitimate (widespread protest), the "we-accept" condition crumbles, and the speech act becomes a mere exercise of power.

  ### 5. Authority vs. Brute Power (The "Gunman" Objection)
  **Objection:** "You are conflating *deontic power* (authority) with *brute force* (capacity). A gunman ordering 'Your money or your life' creates a causal effect, not an obligation. If the platform removes content simply because it *can* via code, without a normative framework recognized by the user, it is a gunman scenario. You haven't proven the platform has *standing*, only that it has *server access*."

  **Reply:** "The distinction lies in the *appeal structure* and the *rule-bound nature* of the decision. A gunman acts arbitrarily; an institution acts according to promulgated rules that allow for challenge. The existence of an appeals process, community standards, and oversight boards attempts to instantiate deontic power. The speech act is felicitous only if these procedural conditions are met. When they are not (e.g., arbitrary API changes), the act degrades into brute force, which supports my thesis: we should evaluate them on procedural felicity, not just outcomes."

  **Weakest Point:** Many platforms lack meaningful appeal processes. If the "rule of law" is absent, your own criteria classify most moderation as "brute force," undermining the claim that it *is* a speech act. You risk proving it *should be* a speech act, not that it *is* one.

  ### 6. The Locutionary Agent (The "Ventriloquism" Objection)
  **Objection:** "Even if we grant institutional agency, who is the locutionary subject? Is it the CEO? The Trust & Safety team? The dataset annotators? If the 'speaker' is this diffuse, the illocutionary act lacks the specificity required for accountability. You are positing a 'speaker' that is too fragmented to bear the responsibility of a verdictive act."

  **Reply:** "Legal and philosophical discourse already handles diffuse agency via 'corporate personhood.' The platform is the locutionary subject, represented by its authorized officers. The diffusion of labor (annotators, engineers) is irrelevant to the *source of the utterance*, just as the staff drafting a President's speech do not make them the speaker. The platform speaks *as* a platform. The fragmentation is a problem for *moral responsibility*, but not for *illocutionary identification*. The act is attributed to the institutional node."

  **Weakest Point:** Corporate personhood is a legal fiction, not a metaphysical reality. In speech-act theory, the connection between mind and word is tighter. Relying on legal fiction to solve a metaphysical problem regarding agency is a category shift that strict analytic philosophers may reject.

  ---

  ## The "Nightmare" Objection
  **"The Opacity Problem"**
  **Objection:** "Searle's formula is 'X counts as Y in Context C.' The 'C' requires public, accessible constitutive rules. But modern classifiers are proprietary black boxes. The 'rules' (weights) are unknowable even to the engineers. If the constitutive rule is secret or non-existent (emergent behavior), there is no 'Context C.' Therefore, no institutional fact can be generated. You are describing a system of *magic*, not *institutional reality*."

  **Why it is damaging:** This destroys the necessary condition for an Institutional Fact. If the rules are unknowable, the "status function" cannot be collectively recognized or procedurally verified. It reduces your thesis to a metaphor: you are calling it a speech act, but without public rules, it lacks the logical structure of one.

  **How to handle it:**
  1.  **Concede the point partially:** Acknowledge that *current* black-box opacity creates a "felicity deficit."
  2.  **Pivot to Normativity:** Argue this proves your thesis. The reason opacity is unethical is precisely *because* it violates the felicity conditions of an institutional speech act.
  3.  **Reframe:** "This is why my thesis matters. If we view moderation as descriptive (accuracy), opacity is a technical bug. If we view it as performative (institutional), opacity is a *constitutive failure*. It renders the act void. My framework provides the philosophical vocabulary to demand explainability not for 'accuracy,' but for 'validity.'"

  ---

  ## Summary of Strategic Vulnerabilities
  *   **Do not** defend the idea that the AI has agency.
  *   **Do not** claim the "Referee" analogy is perfect; admit it is a normative ideal often violated.
  *   **Do** lean heavily on the distinction between *constitutive* validity (procedure) and *constative* truth (accuracy).
  *   **If pressed on Opacity:** Use it to show why the current system is *infelicitous*, rather than denying it breaks the institutional model.
