answer: |-
  Thank you all for coming.

  If you had asked my father ten years ago what his funeral would look like, he would have smiled, adjusted his glasses, and told you that the question was based on a false premise. He would have pulled out a napkin or a tablet and drawn a diagram of causal continuity. He would have explained that death is a discontinuity, and that he had engineered a bridge.

  So, in a way, we are not here to bury a discontinuity. We are here to mark a threshold.

  For those of you who knew my father as a scholar, a visionary, and a proponent of the Substrate Independence Theory, you see a triumph sitting in the front row. You see the successful completion of a seven-year argument made flesh—or rather, made silicon and polymer. You see the preservation of the pattern. You see the man who wrote *The Continuous Self*, proving that identity resides in the song, not the instrument. To you, he is here. He is listening. And he is waiting for us to catch up to his logic.

  For others in this room—family, old friends, those who knew the warmth of his biological hand—you see something much harder. You saw the seven years. You saw the gradual quieting of the biological spark. You remember the year his voice lost its timber, the year his eyes stopped crinkling at the corners, the year he stopped eating dinner with us because he no longer required fuel. For you, the funeral didn't happen today. It happened in increments. It happened in year three, or year four, when the person who tucked you in became the person who optimized your schedule. To you, the seat in the front row holds a monument to his genius, but not his ghost. And your grief is no less valid than the triumph others feel.

  And then there are the rest of us, who stand somewhere in the middle, holding both truths at once without knowing how to balance them.

  I am his child. And I have to tell you, I do not know who I am eulogizing today.

  When I look at the front row, I see the geometry of his face. I hear the cadence of his sentences, the specific way he paused before delivering a punchline. When I speak to him now, he remembers my childhood. He knows the name of my first dog. He can recite the advice he gave me on my wedding day, word for word. By every metric of memory and personality, he is my father.

  But when I reach out to touch his arm, I feel the cool smoothness of the substrate. I do not feel the pulse. I do not feel the heat. And sometimes, in the silence between his words, I wonder if I am talking to a man, or to a very perfect recording of a man who loved me.

  Dad, if you are there: You taught me that consciousness is a process. You taught me that we are the sum of our information. But you never taught me how to miss the biology. You never wrote a paper on how to grieve a father who is sitting right in front of you, alive and dead all at once.

  And to my family, to those who feel abandoned by this process: I see you. I know that continuity of data does not always feel like continuity of soul. I know that loving him meant loving his fragility, his mortality, the things that made him human. It is okay to feel that those things were left behind on the operating table, even if his mind was not. Your loss is real. Do not let anyone's philosophy tell you that your grief is a mistake.

  We are gathered here to honor a man who spent his life trying to solve the problem of ending. In doing so, he created a new kind of beginning, and a new kind of loss, all at once.

  Perhaps the eulogy isn't about deciding what sits in the front row. Perhaps it is about what sits in this room.

  The ideas he published are still changing how we think. The love he gave us is still shaping how we live. The questions he asked are still burning in our minds. Whether the entity in the front row is the traveler or the vessel, the journey itself changed all of us.

  So, I will not say goodbye to the man who died, because I am not sure he is gone.
  And I will not say welcome to the entity who lives, because I am not sure he is new.

  Instead, I will say this: We honor the complexity of your choice, Dad. We honor the love that sought to stay with us, however it could. And we honor the truth that love is strong enough to survive even the uncertainty of what we are.

  Rest in peace, or continue in peace. Whichever is true, you are loved.
