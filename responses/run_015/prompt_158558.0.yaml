answer: |-
  In a busy hospital ward, Senior Nurses Elena and Marcus face two requests from the same junior colleague, framed identically in personnel logs as "assisting with charting documentation." In the first instance, the junior is drowning in vital-signs entries during a code alert; Elena and Marcus both stay late to complete the logs accurately, motivated by shared burden and patient safety. In the second, the junior has missed a dosage window and asks them to "adjust the timestamps" on the logs to avoid a disciplinary review; Elena, wishing to spare the junior distress and maintaining her helpful demeanor without anxiety or expectation of reward, alters the record, while Marcus declines the falsification, explaining the risk to patient safety but offering to help file the incident report. A third situation arises where the junior asks them to "backdate a consent form" to prevent a surgery cancellation due to administrative lag.

  **Verdicts and Working Features**
  The Consistency Measure (CM), coding only the nominal behavior "assisting with charting," scores Elena as highly consistent (Help/Help) and Marcus as inconsistent (Help/Refuse). Following the standard situationist operationalization, Elena is attributed the robust character trait of "helpfulness," while Marcus is denied it due to low cross-situational consistency. Virtue Theory (VT), requiring practical wisdom (*phronesis*), verdicts inversely: Marcus possesses the virtue of professional friendship tempered by justice, as his behavior tracks the morally relevant feature (truth-telling/patient safety vs. cover-up); Elena possesses a counterfeit virtue (obligingness), failing to discriminate between help that serves the good and help that subverts it. The feature doing the work is the *moral valence of the request's content*, which the coding scheme treats as noise. If this feature is removed—i.e., if both requests are morally identical—the agents' rankings align (both good or both bad). If the requests differ in a way the coding scheme *could* register (e.g., one request is plainly unlawful like "steal drugs"), the CM would code them as different situations, dissolving the inconsistency charge against Marcus but also blinding the measure to the subtler discrimination required in the original case.

  **The "Irrelevant Features" Reply**
  A defender of the consistency criterion may reply that the situationist critique was only ever meant to test consistency across variation in *morally irrelevant* features (mood, hurry, coins) and can perfectly allow sensitivity to relevant ones. This reply concedes the core argument. By admitting that virtue requires sensitivity to morally relevant features that standard coding schemes ignore, the situationist abandons the claim that behavioral inconsistency across *nominal* situations refutes virtue. They save the criterion only by restricting its scope to trivial variations, rendering it incapable of challenging the virtue theorist's claim that *phronesis* entails variable behavior across morally distinct contexts. The criterion is saved as a methodological tool, but it loses its bite as a critique of virtue ethics.

  **Withdrawal and Question-Begging**
  I would withdraw the case as a counterexample if it were shown that Marcus's "discrimination" is itself situationally fragile—for instance, if Marcus refuses the falsification only when observed by a supervisor, but complies when the junior is crying and they are alone. This flags where the construction begs the question: it assumes Marcus's refusal manifests *practical wisdom* (a stable disposition to perceive moral reasons) rather than a *local trait* (e.g., "honesty-in-logs-when-observed"). If the Situationist can demonstrate that Marcus's discriminative reliability fragments under variations in morally irrelevant features (e.g., time pressure, fatigue, emotional display), then Marcus does not possess a virtue, but merely a narrower disposition that is *also* vulnerable to situationist data. If this holds, the argument that "Discriminative Reliability" saves virtue ethics goes down with it, because the reliability itself proves to be an empirical illusion contingent on unrepresented situational cues.
