      *   *Verdict:* It works, but needs careful phrasing to avoid simply swapping one adaptationist story (ancestral monophasic) for another (industrial monophasic is adaptive for workers). The key is that the *biology* didn't evolve for monophasic sleep; the *schedule* forces it.

