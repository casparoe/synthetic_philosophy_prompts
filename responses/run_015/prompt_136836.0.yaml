answer: |-
  Machiavelli's logic posits *virtù* not as mere aggressive domination but as adaptive force matching circumstance. The river metaphor frames fortune as chaotic energy that *virtù* structurally channels through preparation, implying we reshape conditions rather than merely navigate them. The gendered image reinforces this: fortune yields to the impetuous because she is variable, demanding boldness to exploit fleeting opportunities rather than cautious hesitation. When Machiavelli claims we direct half our actions, he suggests a dynamic interplay where bold action mitigates fortune's dominance. *Virtù* is the capacity to alter one's mode of proceeding to suit the times; if fortune changes and you do not, you fail. Thus, the "beating" signifies overcoming resistance through timely assertiveness, not random violence. The internal logic concludes that success depends on aligning human will with contingent flux. We do not control fortune's nature, but through *virtù*, we dam its flood and seize the half of life available to us, turning resistance into opportunity through calculated impetuosity.
