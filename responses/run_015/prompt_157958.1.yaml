      *   **Round 2: Negotiation/Reporting (15 mins):** Pod claims "We are spinning." Telescope says "Relative to what?" Archivists hint at the correlation.
      *   **Round 3: Allocation (10 mins):** Funding Council distributes tokens based on who provided the "true" explanation.
