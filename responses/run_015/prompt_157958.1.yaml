      *Critique:* 50 minutes is tight. 5 min intro, 15 data, 15 negotiate, 10 vote, 5 debrief = 50. Debrief needs to be longer for grad students. Cut Data to 10, Negotiate to 15, Vote 5, Debrief 15. Intro 5. Total 50.

      *Refining the "Feeling":* How to make Group 1 *feel* the force without moving?
