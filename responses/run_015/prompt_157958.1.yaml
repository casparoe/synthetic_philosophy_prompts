      *   **Constraints:** No tech, no citations/reading lists, no obscure texts/dates.

  2.  **Deconstruct the Philosophy:**
      *   *Substantivalism:* Space is a thing. Rotation is absolute relative to space itself. (Newton's Bucket: water climbs walls even if bucket stops spinning relative to surroundings, implying rotation relative to Absolute Space).
      *   *Relationism:* Space is just relations between bodies. Rotation is relative to other matter. (Mach: Water climbs walls because it rotates relative to the "fixed stars." If the universe were empty, rotation would be meaningless).
      *   *The Tension:* How do you know you're rotating if you can't see anything else? Is the "force" (centrifugal) proof of absolute space, or just proof of relation to distant matter we can't see?
      *   *The "Cosmic Coincidence":* Why does local inertia align with the average distribution of distant mass? (Mach's Principle).

  3.  **Design the Simulation ("The Void Station Protocol"):**
      *   **Setting:** A futuristic scenario to avoid historical baggage initially. Space stations in a void.
      *   **Groups:** 4 Groups of 4 students (16 total).
      *   **Group Roles:**
          *   *Group A (The Isolates):* Feel forces (simulated by cards/tasks), see no stars.
          *   *Group B (The Distant Observers):* See Group A moving, but have no force data.
