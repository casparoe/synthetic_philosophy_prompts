      *   *Actually, let's keep it epistemic:* They receive readouts. "Sensor X: 5N Outward." The *feeling* is the epistemic pressure of having data without context.

      *Refining the "Cosmic Coincidence":*
      *   Group 1 (Pod) has data: "Local Inertial Field: Active."
      *   Group 2 (Stars) has data: "Pod Rotation relative to Stars: Active."
      *   Group 3 (Archivists) has the Rule: "In 100% of prior cases, Local Inertial Field Active == Pod Rotation relative to Mean Stellar Mass."
      *   The Conflict: Group 1 claims "We are rotating absolutely." Group 2 claims "You are rotating relative to us." Group 3 says "They match."
      *   The Question for the Vote: What causes the force? Space (Substantivalism) or Stars (Relationism)?

  5.  **Addressing the Prompt's Specific Constraints:**
      *   *Non-monetary stakes:* Publication Tokens.
      *   *No naming positions:* Facilitator says "Determine the ontological status of the motion."
