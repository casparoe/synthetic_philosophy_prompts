prompt: |-
  I'm running a 50-minute philosophy of science seminar with about sixteen graduate students, and I want a runnable in-class simulation—complete with rules, assigned roles, small non-monetary stakes, and paper-only materials—that makes participants feel the live force of the substantivalism versus relationism dispute through rotational dynamics rather than through abstract lecture. Please design the activity so that the philosophical tension emerges from the structure of play itself: arrange information and incentives so that at least one subgroup acquires clear local dynamical effects (curvature, deflection, or an equivalent marker) but is deliberately deprived of relational reference points to other bodies, forcing them to decide in real time whether they are entitled to claim rotation is occurring. The other groups should hold partial observational data that either supports or undermines that claim, and there should be a collective vote or resource-allocation round with tangible but minor consequences (e.g., distributing limited "publication tokens" that determine whose measurement report is adopted by the class). Specify exactly how the room is divided, what each envelope or card contains, and how the facilitator introduces the scenario without naming the metaphysical positions in advance.

  For the debrief, map each critical moment in the activity—such as the moment the isolated subgroup reports its finding, the moment other groups challenge it for lacking stellar reference, and the moment the facilitator reveals that local inertial frames align with the average motion of distant matter—onto the corresponding moves in the substantivalist and relationist arguments, including Newton's bucket-style reasoning. Predict what will reliably go wrong on the first run (for instance, participants smuggling in an implicit background frame, or treating the absence of visible stars as proof that there is no rotation rather than as a missing relational term), and explain how to handle it without breaking the simulation. Be explicit about which feature of the philosophical dispute the activity cannot reproduce—most likely the predictive and dynamical equivalence of the two frameworks, or the explanatory question of whether distant matter genuinely explains local inertia rather than merely correlating with it—and state that the facilitator must supply that part directly. Finally, build in a niche constraint: embed a "cosmic coincidence" rule in the simulation, where every local inertial measurement happens to match the mean motion of the distant reference bodies available to other groups, so that the relationists in the room must account for that alignment without treating it as a brute accident and without being allowed to invoke an unseen background structure, while the substantivalists must explain why such an alignment should exist at all if space is genuinely independent. Keep everything runnable without technology, avoid any request for citations or reading lists, and do not depend on specific obscure texts or dates.
