      *   *Limitations:* The game can't simulate General Relativity's geometric equivalence perfectly.
      *   *Coincidence Rule:* Must be explicit in the Archivist envelope.

  6.  **Developing the Materials:**
      *   Need specific text for Envelopes A, B, C, D.
      *   Need Token distribution rules.
      *   Need Facilitator Script.

  7.  **Mapping the Debrief:**
      *   Pod's isolation = Newton's Bucket (closed system).
      *   Telescope's view = Relational data.
      *   Coincidence = Mach's Principle.
      *   Vote = Theory choice under underdetermination.

  8.  **Review against Constraints:**
      *   50 mins? Yes, tight schedule.
      *   16 students? 4 groups of 4.
      *   Paper only? Yes.
      *   No tech? Yes.
