      *   *Better:* "Strain Budget." They start with 10 tokens. Every round, if "Rotating," they pay 2 tokens to keep instruments online. They *feel* the resource drain as a proxy for physical stress. This is paper-only and tangible.

  11. **Finalizing the Structure:**
      *   **Intro:** 5 mins.
      *   **Phase 1 (Silent Analysis):** 10 mins.
      *   **Phase 2 (Restricted Comms):** 15 mins.
      *   **Phase 3 (Vote & Allocation):** 5 mins.
      *   **Debrief:** 15 mins.
      *   **Total:** 50 mins.

      *Wait, 15 min debrief is crucial.* I need to ensure the activity doesn't overrun. I will make the Comms phase very strict.

      *Let's refine the "Cosmic Coincidence" implementation.*
