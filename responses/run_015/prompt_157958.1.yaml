          *   *Solution:* The "Inertial Strain" Card Deck.
          *   Group A draws cards every round. If the hidden state is "ROTATING," they get "Stress Tokens" they must offload or they lose points. If "STATIC," they get nothing.
          *   Group B observes Group A's position on a grid.
          *   Group C holds the master key linking the two.

      *   *Wait, the prompt asks for specific information deprivation:* "at least one subgroup acquires clear local dynamical effects... but is deliberately deprived of relational reference points."
      *   *Revised Setup:*
          *   **Group 1 (The Pod):** Inside a sealed room. They have accelerometers (cards). They feel centrifugal force (cards saying "Outward Pressure"). They cannot see out.
          *   **Group 2 (The Telescope):** Outside. They see The Pod and the "Fixed Stars." They measure relative motion.
          *   **Group 3 (The Archivists):** Hold the historical data/the "Coincidence" rule.
