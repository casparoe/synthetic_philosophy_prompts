          *   *Reference:* Group B has star charts. Group A has none.
          *   *The Twist:* Group A feels force. Group B sees A rotating relative to stars. But what if Group B's stars are moving too?
          *   *The Coincidence:* The data must show that A's force intensity matches B's measured rotation rate exactly.

      *   *Refining the Mechanics for Paper-Only:*
