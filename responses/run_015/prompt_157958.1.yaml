      *   Make sure the "Stakes" matter (Tokens determine who writes the "Class Consensus Report").
      *   Check timing. 50 minutes is very short for 16 grad students to debate. The negotiation phase needs to be highly structured to prevent endless talk. I will add a "Communique Limit" (only 3 notes passed between groups).

  10. **Self-Correction on "Feeling" Rotation:**
