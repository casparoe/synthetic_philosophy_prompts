      *   *The "Cosmic Coincidence" Constraint:* The data held by Group 2 (Stars) and Group 1 (Force) must match perfectly, but Group 1 doesn't know about the stars, and Group 2 doesn't know about the forces until reports are exchanged.

  4.  **Drafting the Activity Steps:**
      *   **Intro (5 mins):** Set scene. No "Substantivalism" talk. Just "Determine the state of the Pod."
      *   **Round 1: Data Collection (15 mins):** Groups analyze envelopes.
          *   Pod: Feels force. No windows.
