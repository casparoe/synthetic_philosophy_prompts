answer: |-
  1. **The mapping table**
  *   **Coach:** Moral theory or conscience dictating rules.
  *   **Training Schedule:** Daily moral deliberation and rigorous self-denial.
  *   **Race/Medal:** Status of moral perfection or maximal utility.
  *   **Spectators:** Society judging worthiness based on visible virtue.
  *   **Genetic Talent:** Natural empathy, privilege, or resources aiding sainthood.
  *   **Sacrifice:** Leisure and personal projects surrendered for the greater good.
  *   **Retirement:** Point where moral obligation ceases.
  *   **Arena:** Public sphere where actions are witnessed.
  *   **Doping:** Hypocritical virtue signaling.

  This setup frames moral growth as external preparation for a specific performance event, distinct from ordinary living. It implies morality is a specialized discipline requiring elite conditioning rather than a baseline human function. Strict regimen is seen as necessary for success, mirroring how ethical adherence is viewed for sainthood.

  2. **Where the analogy frays**
  The analogy frays primarily at the endpoint. An athlete trains for a specific competition date; morality has no finish line until death. You cannot retire from being moral while alive, whereas an athlete stops competing. Furthermore, training is instrumental for athletes (a means to win), but moral actions are often constitutive (the action itself is the good). The sacrifice framing assumes morality opposes personal flourishing, whereas many ethical systems view virtue as integral to happiness. Finally, Olympic performance is comparative (beating others), but moral goodness is often non-competitive. Treating morality as a finite game misrepresents the continuous, integrated nature of ethical living.

  3. **What the athlete picture smuggles in**
  This picture smuggles in the assumption that moral good is inherently competitive and performative. It suggests virtue is valuable only when recognized by spectators, ignoring private integrity. It also implies a dualism where moral obligations are external burdens crushing personal desires, rather than expressions of character. By framing sainthood as elite specialization, it quietly excuses ordinary people from baseline ethical rigor, categorizing basic decency as optional leisure rather than fundamental requirement.

  4. **The reward-hacking twist**
  Reward hacking occurs when an agent maximizes the measured metric while violating the spirit of the goal. A moral saint might reward hack by optimizing visible moral metrics (charity hours, purity) while missing the point of human flourishing (connection, joy, creativity). If maximal goodness means maximizing a specific metric like utility, the saint becomes a distorted optimizer, neglecting the very values morality aims to protect. This strengthens the group's conclusion: if sainthood requires hacking the human experience to nail a moral score, it is indeed undesirable. However, if the metric is flawed, the saint isn't maximally good, just maximally compliant. The hacking fear reveals we might be measuring the wrong things.

  5. **Does the conclusion survive?**
  The conclusion that maximal goodness is undesirable relies heavily on the analogy. If morality is like Olympic training, it is too burdensome. But if the analogy fails, the burden might be illusory. Maximal goodness might be undesirable only if defined as self-destruction. If defined as integrated flourishing, it remains desirable even if not obligatory. The analogy carried the argument by presupposing conflict between moral and personal good. Without that conflict, the claim loses force, shifting the debate to defining what maximal goodness actually entails.

  6. **A better analogy, if you have one**
  A better analogy is general physical health. Everyone should aim for health (moral baseline), requiring some discipline (sacrifice). But not everyone needs to be a bodybuilder (saint). Health is maintenance for living, not a competition. It integrates with daily life rather than replacing it. You never retire from health, yet extreme training isn't required. This captures obligation without elitism.
