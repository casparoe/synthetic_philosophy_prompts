  7.  **Final Polish:** (Mental check on the "Impossibility Result" phrasing). I need to be careful not to say it *is* impossible, but that the *list reveals a tension* that forces a choice. The prompt asks to identify *whether* any subset is jointly unsatisfiable. The answer is "Yes, under standard physicalist commitments." I will frame this as the "Exclusion Tension."

