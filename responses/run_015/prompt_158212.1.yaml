answer: |-
  You are right to be unsatisfied. Your group-mate's argument is a classic case of projecting 20th-century logical positivism onto a 17th-century natural philosopher. It is anachronistic, and it does not survive contact with the text of the *General Scholium* where that famous line actually appears.

  You asked for plain speaking: The engineer is wrong. *Hypotheses non fingo* does not wall off theology from physics; in Newton's mind, it secures the theological foundation *of* the physics.

  Here is the breakdown you requested, followed by my assessment of the parameterization analogy and my own defense.

  ### 1. Readings of *Hypotheses Non Fingo*

  Here are six precise interpretations of the slogan, ranked roughly from specific to radical, evaluated against your group-mate's "Separation Thesis" (that theology is private and irrelevant to the physics).

  | Reading | Claim | Fit to Text | Work it Does | Supports Separation Thesis? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Anti-Cartesian Jab** | "Hypothesis" specifically means *mechanical* explanations (like Descartes' vortices) for which there is no empirical evidence. | **High.** Newton was fighting the Continental mechanists. He accepts action-at-a-distance because phenomena demand it, rejecting mechanical contact because phenomena don't show it. | Limits the ban to *mechanical* causes. Allows non-mechanical causes (like God or Spirit). | **No.** It explicitly leaves room for non-mechanical causes (i.e., Divine will) to operate where mechanics fail. |
  | **2. The Methodological Ban** | Do not posit causes that cannot be mathematically deduced from observed motions. | **High.** "Whatever is not deduced from the phenomena..." This is his rule of reasoning. | Distinguishes between the *law* (deduced) and the *cause of the law* (unknown). | **No.** It bans speculative physical causes, but implies a valid deduction *can* be made from phenomena elsewhere (e.g., to a Designer). |
  | **3. The Semantic Redefinition** | "Hypothesis" is redefined as "unverified speculation." Since Newton claims his laws are *deduced*, they aren't hypotheses by definition. | **Medium.** Newton plays fast and loose with "deduction." He treats induction as deduction. | Protects his theory from the charge of being "occult." | **No.** It protects the *physics*, but doesn't address the *theology*. It makes the theology a separate category of "deduction from design." |
  | **4. The Rhetorical Shield** | It is defensive posturing against critics (like Leibniz) who accused him of reintroducing occult qualities. | **High.** Contextually, he was under fire. | Political cover. Allows him to assert gravity without explaining *how*. | **No.** Rhetoric doesn't imply belief in separation. It implies belief in survival. |
  | **5. The Instrumentalist Reading** | The theory is merely a calculation tool. We don't know if gravity is "real," only that the math works. | **Low.** Newton repeatedly asserts gravity is a real *vis* (force). He seeks its cause, just admits he hasn't found it *yet*. | Makes Newton a precursor to Duhem/Quine. | **Yes.** This is the only reading that supports the Engineer. If physics is just math, God is irrelevant to the calculation. |
  | **6. The Radical Empiricist** | We can know *nothing* about causes, ever. Metaphysics is dead. | **Very Low.** Contradicted by the rest of the *Scholium* and the *Opticks* queries. | Would make Newton a positivist *avant la lettre*. | **Yes.** But it requires ignoring half the book. |

  **Verdict on the List:** Readings 1, 2, and 3 are historically robust. Reading 5 (Instrumentalism) is what your group-mate is using, but it has the lowest textual fit. It requires ignoring the very paragraphs following the slogan where Newton discusses God.

  ### 2. Can "No Hypotheses" and "Design" Coexist?

  Yes, without contradiction, provided you understand Newton's taxonomy of knowledge.

  Newton distinguishes between **Physical Causes** (within the system) and **Volitional Causes** (outside the system).

  1.  **Physical Causes:** To explain *why* gravity follows the inverse-square law via a mechanism (e.g., ether pressure) is to frame a hypothesis. There is no phenomenon to deduce this from. **Ban applied.**
  2.  **Volitional Causes:** To look at the "beautiful system of the sun, planets, and comets" and infer an "intelligent being" is, to Newton, a valid deduction from phenomena. The "phenomenon" here is the *existence and stability* of the system itself.

  For Newton, God is not a hypothesis *inside* the machine (like a gear); God is the **operator** of the machine. To say "God sustains this" is not to feign a mechanical cause; it is to acknowledge the boundary condition of the physics.

  Therefore, the *General Scholium* is not a contradiction. It is a boundary marker:
  *   *Inside the boundary:* No hypotheses (only mathematical laws deduced from motion).
  *   *At the boundary:* God (deduced from the existence/order of the system).

  Leibniz's jeer ("God winding his watch") assumes Newton's God is a *fixer* of a broken mechanical system. Newton's God is the *sustainer* of space and time themselves. Newton believed that without God's continuous presence, the system would collapse (not because the math fails, but because the ontological ground vanishes).

  ### 3. Does the Heresy Matter?

  Yes. Significantly.

  If Newton were a conventional Anglican, one might argue his God-talk was boilerplate, added to appease the church (the "Rhetorical Shield" reading). But Newton was a covert Socinian (anti-Trinitarian). This was dangerous. It was not social capital; it was a liability.

  He wrote millions of words on prophecy, alchemy, and church history. He did not keep theology in a "private box." He viewed the corruption of the Church (specifically the doctrine of the Trinity) as parallel to the corruption of Natural Philosophy (specifically Cartesian vortices). Both were idolatrous misunderstandings of God's dominion.

  His heresy confirms that his theology was **driving** his science, not separate from it. He sought a physics that reflected a unitary, sovereign God, not a Trinitarian mystery or a mechanistic clockwork that ran itself. The "Separation Thesis" fails because Newton himself did not live a separated life.

  ### 4. Your Hobby Horse: Parameterizations

  You asked: *Is Newton's move like fitting cloud microphysics we know are wrong?*

  **It is stronger than that.**

  In your field, you use a parameterization (e.g., autoconversion rates) knowing it is an effective theory, a stand-in for unresolved microphysics. You hope to replace it later with first principles.

  Newton is doing something similar regarding the **mechanism of transmission**. He knows gravity works (the "macro" behavior). He admits he doesn't know the medium (the "micro" physics).

  **However,** unlike a modern parameterization, Newton does not treat the *law* ($F = G m_1 m_2 / r^2$) as merely a fit. He claims it is **deduced from phenomena**. He believes the law is *true*, even if the mechanism is unknown.

  *   **Your Cloud Model:** "This formula predicts rain, but the physics of droplet collision is more complex."
  *   **Newton's Gravity:** "This law *is* the physics of the motion. The *medium* transmitting the force is the unknown part."

  So, Newton is not saying "Gravity is just a calculation tool." He is saying "Gravity is a real force, but I don't know how it propagates." He refuses to *lie* about the propagation (frame a hypothesis) just to make the ontology comfortable.

  ### 5. My Defense and Confidence

  **The Reading I Defend:**
  I defend a combination of **Reading 1 (Anti-Cartesian)** and **Reading 2 (Methodological)**, grounded in **Metaphysical Realism**.

  *   *Hypotheses non fingo* means: "I will not invent mechanical causes for gravity without empirical evidence."
  *   It does *not* mean: "I will not assert causes that are non-mechanical (i.e., Divine Will)."
  *   Newton's science is **not** instrumentally separated from his theology. His theology provides the ontological license for his physics (action-at-a-distance is possible because God's will acts at a distance).

  **Confidence Level:**
  **High (90%+).**
  The scholarship of the last 40 years (Hall, Westfall, Force, Popkin) has thoroughly dismantled the "Newton the Secular Scientist" myth. The evidence is in the manuscripts: the *Principia* and the theological writings were being worked on simultaneously. The *General Scholium* was added in 1713 specifically to counter the idea that the *Principia* was a mechanistic text.

  **Where Your Puzzle Might Be Muddled:**
  You asked if you are conflating "no cause" with "no theology."
  *   **Correction:** You are not conflating them; your group-mate is.
  *   **Nuance:** You must distinguish between the **cause of gravity** (which Newton bans hypotheses about) and the **cause of the system** (which Newton attributes to God).
  *   The Engineer's error is thinking *hypotheses non fingo* applies to *all* causal talk. It applies only to *physical/mechanical* causal talk within the phenomena.

  **Plain Speaking Conclusion:**
  Your group-mate is using Newton to validate a modern secular view of science that Newton would have rejected. Newton did not "file the two halves of the man apart." He believed that to study nature *was* to study God's dominion. To remove God from the *Principia* is to remove the reason Newton thought the *Principia* was possible in the first place.

  You were right at the pub. The "black box" interpretation is a convenience for moderns, not a description of Newton.
