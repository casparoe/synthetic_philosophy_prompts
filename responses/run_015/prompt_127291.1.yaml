answer: |-
  Your intuition is spot-on. Your roommate has accurately summarized a specific body of empirical research (Moral Foundations Theory and WEIRD psychology), but she is making a classic philosophical category error when she moves from those descriptive findings to a conclusion about moral truth (metaethics).

  There is indeed a "sleight of hand" here: she is conflating **Descriptive Relativism** (people *believe* different things) with **Metaethical Relativism** (there *is* no objective truth).

  Here is a breakdown of what is accurate, what is exaggerated, and why the conclusion doesn't logically follow.

  ### 1. Fact-Checking the Psychology
  Your roommate's summary of the *data* is mostly correct, but she exaggerates the extremes.

  *   **Claim:** *WEIRD populations score near zero on Loyalty, Authority, and Sanctity.*
      *   **Verdict:** **Overstatement.**
      *   **Correction:** Research by Jonathan Haidt and colleagues shows that Western liberals score significantly *lower* on the "binding foundations" (Loyalty, Authority, Sanctity) compared to conservatives and non-Western populations. However, "near zero" is empirically false. WEIRD individuals still value loyalty (to friends, teams, partners) and authority (in specific contexts like safety or expertise), they just prioritize them differently and reject them when they conflict with Care or Fairness.
  *   **Claim:** *Non-Western groups weight all five foundations more evenly, with binding dominating.*
      *   **Verdict:** **Mostly Accurate.**
      *   **Correction:** Cross-cultural studies (in India, Brazil, East Asia, etc.) generally show a more balanced "five-foundation" profile, often with a heavier weight on Binding foundations than seen in Western liberals.
  *   **Claim:** *Autonomy ethics (Shweder) are nonexistent outside WEIRD societies.*
      *   **Verdict:** **Mostly Accurate.**
      *   **Correction:** Richard Shweder's "Ethic of Autonomy" (morality based on individual rights and harm) is indeed culturally distinct. In many traditional societies, the "Ethic of Community" (duty, hierarchy) and "Ethic of Divinity" (purity, sin) are the dominant moral languages. However, saying autonomy is *nonexistent* is too strong; it is just not the *dominant framework* for organizing society.
  *   **Claim:** *Binding foundations are evolutionary older; individualism is a recent overlay.*
      *   **Verdict:** **Accurate (within the theory).**
      *   **Correction:** This is a core tenet of Haidt's evolutionary psychology. Primate hierarchies show clear evidence of authority and reciprocity (fairness), but "individual rights" is a much newer cultural technology. Henrich's work on WEIRD psychology supports the idea that hyper-individualism is a recent historical development, not the human default.

  ### 2. The Philosophical "Sleight of Hand"
  This is where your roommate's argument falls apart. She is using the **Argument from Disagreement**.

  **Her Logic:**
  1.  If moral objectivism were true, all cultures would agree on moral priorities.
  2.  Cultures do not agree on moral priorities (per MFT data).
  3.  Therefore, moral objectivism is false.

  **Why this fails:**
  This logic confuses **epistemology** (how we know things) with **ontology** (what is true).

  *   **The "Flat Earth" Counter-Example:** For most of human history, almost every culture believed the earth was flat or had different cosmologies. Does the fact that cultures disagreed on the shape of the earth mean there was no *objective* shape of the earth? No. It means human perception is fallible and culturally conditioned.
  *   **Moral Error Theory:** An objectivist can look at the MFT data and say: "Western liberals are morally blind to the value of Sanctity," or "Traditional societies are morally blind to the value of Individual Autonomy." The existence of disagreement does not prove there is no truth; it only proves that different cultures have different levels of access to that truth.
  *   **Descriptive vs. Normative:** Psychology describes what humans *do* value (Descriptive). Objectivism makes claims about what humans *should* value (Normative). You cannot derive an "ought" from an "is" (Hume's Guillotine). Showing that people *vary* in their moral instincts does not prove that no moral instinct is *correct*.

  ### 3. What the Researchers Actually Say
  Interestingly, neither Haidt nor Henrich claims to have "disproven" moral objectivism in the philosophical sense.

  *   **Jonathan Haidt:** He identifies as a **Moral Pluralist**, not a relativist. He argues that there are multiple objective goods (Care, Fairness, Loyalty, Authority, Sanctity) and that different cultures cultivate different subsets of them. He argues that Western liberals are "morally impoverished" because they ignore three of the five foundations. This is actually an objectivist claim (i.e., "You are missing something real and valuable"), not a relativist one.
  *   **Joseph Henrich:** His work on WEIRD psychology focuses on how market integration and Christianity changed human psychology to be more individualistic and analytical. He avoids making strong claims about whether individualism is "morally true," focusing instead on how it changes behavior and cognition.

  ### 4. Could the Data Support Objectivism?
  Ironically, your roommate could use this same data to argue *for* a form of objectivism.

  If the "Binding Foundations" are evolutionary older and shared with primates, an objectivist could argue: **"These moral instincts are hardwired by nature/God/evolution because they are objectively necessary for social cohesion. The Western suppression of them is a dangerous anomaly, not progress."**

  The data shows variation, but it also shows **universals**. Every culture has *some* concept of fairness and *some* concept of loyalty. The fact that there is a shared "moral grammar" (even if the settings are different) is often used by objectivists to argue for a universal human moral nature.

  ### Summary for Your Argument
  You can tell your roommate:

  1.  **You are right on the science (mostly):** WEIRD people do prioritize Care/Fairness over Binding foundations, and this is a historical anomaly.
  2.  **You are wrong on the philosophy:** Variation in moral *belief* does not disprove moral *truth*. (Disagreement $\neq$ No Truth).
  3.  **The researchers disagree with you:** Haidt uses this data to argue that Westerners are missing objective moral values (the binding ones), not that no values are objective.
  4.  **The Is-Ought Gap:** Psychological data tells us how our moral "taste buds" work. It cannot tell us whether there is a "correct diet."

  **Verdict:** Her conclusion that objectivism is "empirically refuted" is a **non-sequitur**. The data refutes *Rationalist Objectivism* (the idea that pure reason leads everyone to the same moral conclusions), but it does not refute *Moral Realism* (the idea that moral truths exist independently of our opinions). She has successfully proven that morality is culturally *variable*, but she has not proven it is culturally *constructed* in the sense of having no external truth conditions.
