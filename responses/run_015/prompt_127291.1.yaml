prompt: |-
  I was arguing with my roommate about whether morality is objective and she sent me this summary she gotten from a philosophy podcast about WEIRD psychology and cross-cultural moral differences. She says Henrich and others showed that Western, educated populations score really high on care and fairness but basically near zero on loyalty, authority, and sanctity, while non-Western groups weight all five foundations more evenly with the binding ones usually dominating. Then she claims this disproves moral objectivism, because if there was one true morality every culture should rank these foundations identically, and since they don't, moral truth must be locally constructed rather than universal. She also brought up Shweder's autonomy, community, and divinity framework and said autonomy ethics are literally existant outside WEIRD societies, which explains why Westerners misread other cultures as lacking ethics altogether when they just organize around different values. There's this extra bit about the binding foundations being evolutionary older, shared with primate hierarchies, and Western individualism being a recent cultural overlay that suppresses them. I feel like there's a sleight of hand somewhere between describing differences and disproving universals, but I can't pin it down. Could you go through this and tell me which parts are accurate, which are overstatements or misreadings, and whether her conclusion that objectivism is empirically refuted actually follows from the research?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is arguing with a roommate about moral objectivism vs. relativism/constructivism.
      *   **Roommate's Argument:** Uses Moral Foundations Theory (MFT - Haidt, Henrich, etc.) and Shweder's ethics (Autonomy, Community, Divinity) to argue against moral objectivism.
      *   **Key Claims by Roommate:**
          1.  WEIRD (Western, Educated, Industrialized, Rich, Democratic) people score high on Care/Fairness (Individualizing) but near zero on Loyalty/Authority/Sanctity (Binding).
          2.  Non-WEIRD people weight all five evenly, with Binding dominating.
          3.  This variation *disproves* moral objectivism (if truth existed, rankings would be identical).
          4.  Autonomy ethics barely exist outside WEIRD societies.
          5.  Binding foundations are evolutionary older/primate-based; Western individualism is a recent overlay suppressing them.
      *   **User's Intuition:** Feels like there's a "sleight of hand" between describing differences and disproving universals.
      *   **Task:** Evaluate accuracy of claims, identify overstatements/misreadings, and assess whether the conclusion (objectivism refuted) follows from the research.

  2.  **Deconstruct the Roommate's Claims vs. Academic Consensus:**

      *   *Claim 1: WEIRD score near zero on Binding foundations.*
          *   **Fact Check:** This is an exaggeration. MFT research (Haidt, Graham, etc.) shows WEIRD populations score *lower* on Binding foundations compared to non-WEIRD/Conservatives, but not "near zero." Liberals/WEIRD people still value loyalty, authority, and sanctity, just less intensely or in different contexts.
          *   **Verdict:** Overstatement/Exaggeration.

      *   *Claim 2: Non-WEIRD weight all five evenly with Binding dominating.*
          *   **Fact Check:** Generally accurate. Cross-cultural studies (e.g., Haidt's work in Brazil, India, etc.) show a more balanced profile or a tilt toward Binding.
          *   **Verdict:** Mostly accurate, though "evenly" might be too strong; Binding often dominates.

      *   *Claim 3: Variation disproves objectivism (If truth existed, rankings would be identical).*
          *   **Fact Check:** This is the philosophical leap. This is the "Argument from Disagreement." Philosophers (both objectivists and relativists) debate this. Objectivists argue disagreement doesn't entail no truth (e.g., scientific disagreement doesn't mean no physical truth). It might mean epistemic access varies.
          *   **Verdict:** Philosophical non-sequitur. Empirical data describes *beliefs*, not *truth conditions*.

      *   *Claim 4: Autonomy ethics are literally nonexistent outside WEIRD societies.*
          *   **Fact Check:** Shweder's "Ethic of Autonomy" is rare as a *dominant* framework in traditional societies, but saying it's "nonexistent" is strong. Individuals in all cultures have agency. However, as a *moral framework*, it is culturally specific.
          *   **Verdict:** Mostly accurate regarding dominant cultural frameworks, but needs nuance.

      *   *Claim 5: Binding foundations are evolutionary older/primate-based; Individualism is a recent overlay.*
          *   **Fact Check:** Haidt argues this (intuitions first, strategic reasoning second). Primate hierarchies show authority/loyalty behaviors. Individualism is historically recent (Enlightenment, industrialization).
          *   **Verdict:** Accurate representation of the evolutionary psychology perspective within MFT.

  3.  **Address the Core Philosophical Issue (The "Sleight of Hand"):**
      *   The user suspects a move from *Is* (descriptive psychology) to *Ought* (normative truth).
      *   The roommate is committing a version of the **Argument from Disagreement**.
      *   *Counter-argument:* Moral Objectivism doesn't require universal *agreement*, it requires universal *applicability*. People can be wrong about objective truths (e.g., flat earth vs. round earth).
      *   *MFT's Stance:* Haidt himself is a moral pluralist/pragmatist, not necessarily a hard relativist, but he uses the data to argue against *rationalist* objectivism (the idea that reason alone finds truth). He argues for "moral matrices."
      *   *The Gap:* Showing moral *psychology* varies does not prove moral *ontology* is relative.

  4.  **Drafting the Response:**

