  To: Workshop Coordination Team
  From: [Your Name]
  Date: October 24
  Subject: Fall Workshop Pitch: Carnap, Tolerance, and Planning

  Hi everyone,

  Here's the pitch for the fall slot. I'm aiming for something tight—two pages worth of substance, nothing too formal. I want to avoid the usual dry abstract style and get straight into the philosophical friction.

  **Project Title:** Frameworks Beyond Logic: Testing Carnap's Tolerance in Political Planning

  **The Core Idea**
  We usually teach Carnap's principle of tolerance as a rule for logic and language. Choose your framework, check for consistency, and go. But Carnap made scattered remarks linking this idea to social planning and value pluralism. Most scholars ignore this, treating him as a logical empiricist with no real political theory. I think that reading leaves a massive gap. If we take the logic of framework choice seriously, does it hold up when applied to political-economic planning?

  **The Gap in the Literature**
  The standard view keeps Carnap's logic distinct from his politics. They treat his work on syntax and semantics as one bucket and his occasional comments on socialism or planning as another, unrelated bucket. This distinction protects him from criticism but makes his philosophy incomplete. If tolerance is a universal pragmatic principle, it should apply to more than just linguistic conventions. It should apply to how we organize society. But when you move from choosing a logical syntax to choosing a economic system, the rules change. The literature hasn't pinned down whether Carnap's framework actually survives this transition.

  **The Precise Question**
  Here is what I want to pin down: Does extending Carnap's framework-choice model from linguistic frameworks to political-economic planning frameworks commit him to an untenable position? Specifically, does it force him into either:
  1.  **Relativism about justice:** Where any planning system is valid if internally consistent, making critique impossible?
  2.  **Hidden Technocracy:** Where "efficiency" becomes a covert, non-tolerant criterion that overrides pluralism?

  Can we coherently apply Carnap-style tolerance to large-scale planning, or does the framework collapse under the weight of material consequences?

  **Methodology**
  I'm not trying to write a monograph or pretend to be an economist. The scope is realistic for a semester workshop. I plan to use a close comparison method. I will take Carnap's arguments for framework choice (specifically from *Logical Syntax* and related essays) and map them onto a concrete planning debate.

  The case study will be **participatory budgeting versus centralized allocation**.
  *   **Participatory Budgeting:** Represents a pluralistic framework where values are decided locally and democratically.
  *   **Centralized Allocation:** Represents a technocratic framework where efficiency and global optimization are prioritized.

  I won't be evaluating which economic model is better. I'll be evaluating whether Carnap's principle of tolerance can adjudicate between them without breaking. Does Carnap allow us to say one framework is "wrong," or only that one is "inconvenient"? If he allows us to say one is wrong, what metric is he using? If he doesn't, is he stuck with relativism? This keeps the work philosophical while grounding it in a real-world dispute.

  **Success vs. Failure**
  I want to be honest about what counts as a win here.
  *   **Success:** Successfully demonstrating that extending tolerance to planning exposes a tension in Carnap's pragmatism. If I can show exactly where the logic snaps—whether at the point of value conflict or resource scarcity—that's a win. Clarifying the inconsistency is enough.
  *   **Failure:** Pretending to solve the political debate. If I start arguing for participatory budgeting on economic grounds, I've missed the point. Also, if I treat Carnap's remarks on planning as a fully formed political theory rather than scattered fragments, that's a failure of interpretation. The goal is to test the limits of his philosophy, not to build a Carnapian policy platform.

  **Why This Workshop?**
  This fits the fall theme because it bridges history of analytic philosophy and contemporary social theory. It challenges the idea that logical empiricism was purely apolitical. It also gives us a concrete way to discuss pluralism without getting stuck in abstract meta-ethics. We get to look at how philosophical tools hold up when applied to material organization.

  I think this is manageable, sharp, and opens up a conversation we aren't having. Let me know if this fits the slot.

  Best,

  [Your Name]
