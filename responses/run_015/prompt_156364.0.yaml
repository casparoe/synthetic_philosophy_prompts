prompt: |-
  I sit on the ethics and governance panel of a hospital trust that runs a clinical genomic testing service, and we are rewriting what patients get told. Three questions are live: whether to report variants of uncertain significance, whether to report findings for conditions the patient was not tested for, and whether a patient may file a standing instruction not to be told certain classes of result.

  One member of the panel closes almost every discussion with the same argument. Information, he says, is like a sharper photograph of a fixed scene. You can always squint, or blur the image, or look away, so a higher-resolution image cannot leave you worse at whatever task you were using it for; worse, in his view, only if you insist on looking at something you would have preferred not to see, which is your business and not the panel's. And this, he says, is exactly what the decision-theoretic result usually known as the value-of-information theorem says in its formal dress: for an agent who updates by conditionalisation and maximises expected utility, the expected value of an additional signal, assessed before the signal arrives, is never negative, and is strictly positive just in case the signal could change what the agent does in some state of the world. His conclusion is that release is at worst neutral, that withholding is a form of paternalism, and that the burden of argument always falls on suppression rather than on disclosure.

  I am not persuaded, but I cannot say exactly where the picture stops fitting, and I would rather not overrule him on instinct. Please audit the analogy.

  Give me the correspondence table first: what plays the part of the resolution, of the scene, of the camera, of the viewer, of the task the image is for, of squinting, and of the cost of taking the photograph. Then separate the disanalogies that matter for the use he is making of it from the ones that are merely decorative. I would like the following pressed specifically.

  Whether the squinting move is bearing more weight than the theorem gives it. The theorem lets the agent adopt any decision rule as a function of the signal, including a constant one; that is the formal counterpart of looking away. Say what has to be true for that option to be genuinely available — that ignoring costs nothing, that attention is not scarce, that the viewer can decline to attend and yet still know what he would have done without the image, that the viewer's preferences and competence are themselves unmoved by having seen it.

  Whether the ex ante framing is doing work he does not acknowledge, given that he is arguing for a policy applied to people one at a time and that a realised result can leave a particular patient worse off even when the prospect was non-negative in expectation.

  Whether the fixed scene holds. In the photograph case there is a state of the world the image resolves more or less finely, and more resolution is a refinement. In our case the report is evidence about a laboratory's current opinion, the meaning of which is revised over years; a variant of uncertain significance may be reclassified long after it is filed. Say whether that is a refinement of the same scene at all, and what follows if it is not.

  Whether the single-viewer assumption is doing the heaviest work of all. A photograph is looked at by one person and changes nothing else. A result enters a record that clinicians, relatives, insurers and employers can act on, and some arrangements — risk pooling, insurance, anything that depends on a shared ignorance — can stop working when the ignorance is removed, even though no individual has been made worse off by knowing. I want to know whether this breaks the move from cannot harm the recipient to cannot harm, or whether it is a separate argument he is entitled to set aside.

  Whether the theorem is about gross or net value, and what our panel should do with the acquisition, follow-up and downstream-testing costs that disclosure sets in motion.

  Then run the audit on three proposals in front of us: reporting variants of uncertain significance to healthy adults; offering direct to consumers a polygenic score for a common disease for which no preventive intervention exists; and reporting, in a child's genome, a finding for a late-onset condition with no treatment, where the parents had asked for everything to be reported. For each, say which disanalogy carries the weight, and whether our default should flip.

  Finally, tell me whether there is a better single picture for the case where information is generated for one person and read by many, and whether the honest answer is that no picture fits — and if so, what the panel should put in place of one. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Ethics and governance panel of a hospital trust (clinical genomic testing service). Rewriting patient information policies.
      *   **The Conflict:** A panel member argues for maximal disclosure based on an analogy (Information = Higher Resolution Photograph) and a theorem (Value of Information - VoI). He claims information is never harmful *ex ante*, withholding is paternalistic, and the burden of proof is on suppression.
      *   **The User's Position:** Not persuaded, needs to audit the analogy and theorem to find the specific flaws without relying on instinct.
      *   **Specific Requirements:**
          1.  Correspondence Table (Resolution, Scene, Camera, Viewer, Task, Squinting, Cost).
          2.  Separate Material Disanalogies from Decorative ones.
          3.  Address Specific Press Points:
              *   "Squinting" (Ignorability/Cognitive Load/Irreversibility).
              *   Ex Ante vs. Ex Post (Expectation vs. Realisation).
              *   Fixed Scene vs. Evolving Evidence (VUS reclassification).
              *   Single Viewer vs. Multiple Actors (Privacy/Insurance/Social Harm).
              *   Gross vs. Net Value (Costs of follow-up/testing).
          4.  Apply Audit to Three Proposals:
              *   VUS to healthy adults.
              *   DTC Polygenic Score (no intervention).
              *   Child's genome, late-onset, no treatment (parents requested all).
          5.  Conclusion: Better picture? No picture? Replacement framework?
          6.  **Language:** British English.

  2.  **Deconstruct the Panel Member's Argument:**
      *   *Premise 1:* Information is like a sharper photo (more detail, same reality).
      *   *Premise 2:* VoI Theorem says $E[U|Info] \ge E[U|No Info]$.
      *   *Conclusion:* Disclosure is never bad *ex ante*; withholding is paternalistic.
      *   *Flaw:* This relies on idealised Bayesian agents, costless processing, reversible attention, static truth, and isolated decision-makers. Real patients face anxiety, irreversible psychological impacts, changing medical consensus, third-party discrimination, and financial costs.

  3.  **Drafting the Correspondence Table:**
      *   *Resolution:* Granularity of genetic data (e.g., VUS vs. Pathogenic).
      *   *Scene:* The patient's biological reality/genome.
      *   *Camera:* The sequencing technology/lab pipeline.
      *   *Viewer:* The patient (and clinician).
      *   *Task:* Making life/health decisions.
      *   *Squinting:* Choosing not to act on/know the result (ignoring).
      *   *Cost:* Price of test + psychological/financial downstream costs.

  4.  **Analyzing Disanalogies (Material vs. Decorative):**
      *   *Decorative:* The medium (light vs. nucleotides), the physical act of looking.
      *   *Material:* Irreversibility of knowledge (can't "un-see"), dynamic nature of genetic interpretation (VUS changes), multi-party access (insurers/relatives), psychological impact (anxiety affects utility function), costs (financial/medical).

  5.  **Addressing Specific Press Points:**

      *   *Squinting (Ignorability):* VoI assumes you can choose a decision rule $d(s)$. If $s$ is "bad news," you can choose $d(s) = d(null)$. *But:* In humans, knowledge changes the utility function itself (anxiety). You cannot "squint" once the email is read. Cognitive load is real.
      *   *Ex Ante vs. Ex Post:* VoI is about *expected* value. A specific realization can be devastating (e.g., false positive leading to mastectomy). Policy affects individuals, not just averages.
      *   *Fixed Scene:* Genetic interpretation evolves. A VUS today might be Pathogenic tomorrow, or Benign. It's not a sharper photo of a static scene; it's a caption that changes under the photo.
      *   *Single Viewer:* Genetic info is familial. It affects insurability. It breaks "shared ignorance" (e.g., insurance pools). This creates externalities not in the VoI model.
      *   *Gross vs. Net:* VoI usually assumes costless information. Medical follow-up costs money and carries risk (biopsies). Net value can be negative.

  6.  **Applying to the Three Proposals:**

      *   *VUS to Healthy Adults:*
          *   *Key Disanalogy:* Fixed Scene (VUS changes) + Net Value (follow-up costs/anxiety).
          *   *Verdict:* Default to non-disclosure (or strict counselling).
      *   *DTC Polygenic Score (No Intervention):*
          *   *Key Disanalogy:* Task/Utility (No action available) + Squinting (Anxiety without recourse).
          *   *Verdict:* Default to non-disclosure (low clinical utility).
      *   *Child's Genome (Late-onset, No Treatment):*
          *   *Key Disanalogy:* Single Viewer (Child's future autonomy) + Ex Post (Psychological burden on child).
          *   *Verdict:* Default to non-disclosure (preserve child's "right to an open future").

  7.  **Conclusion/Alternative Framework:**
      *   Is there a better picture? Maybe "Genetic Information as a Seed" (grows, changes, affects surroundings) or "Genetic Information as a Legal Deed" (binding, affects rights).
      *   Actually, the honest answer is likely "No single picture fits."
      *   Replacement: A framework based on *Clinical Utility* and *Right to an Open Future*, acknowledging *Externalities*. Shift from "Value of Information" to "Duty of Care."

  8.  **Refining the Tone and Language:**
      *   Must be British English (e.g., "programme," "centre," "analyse," "paediatric").
      *   Tone: Professional, rigorous, respectful of the panel member's logic but firm on the limitations.
      *   Structure: Follow the prompt's requested order strictly.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "squinting" point about the decision rule? *Yes, need to emphasize that humans aren't expected utility maximizers who can compartmentalize.*
      *   *Check:* Did I distinguish between Ex Ante and Ex Post clearly? *Yes, the policy is for individuals facing specific outcomes, not a casino.*
      *   *Check:* Is the "Fixed Scene" point clear regarding VUS? *Yes, emphasize the temporal instability of genetic classification.*
      *   *Check:* Did I handle the "Single Viewer" vs. Insurance point? *Yes, this is about externalities.*
      *   *Check:* British English? *Watch for 'z' vs 's' in organization/analyse, ensure 'programme', 'centre', 'paediatric'.*

  10. **Final Polish:** Ensure the correspondence table is clear and the audit of the three proposals is distinct. Make sure the final recommendation is actionable for a governance panel. (Proceed to generate output).

  *(Self-Correction on British English)*: Ensure "analyse" instead of "analyze", "programme" instead of "program", "centre" instead of "center". Use "whilst" or "while" appropriately. Ensure spelling of "paediatric".

  *(Refining the "Better Picture")*: The prompt asks if there is a better single picture or if no picture fits. Given the complexity, arguing that *no picture fits* is intellectually honest and empowers the panel to use principles rather than metaphors. I will suggest a "Stewardship" model instead.

  *(Refining the VoI point)*: The panel member is technically correct about the *theorem* in a vacuum. The error is in the *application* to human psychology and social systems. I must validate his maths while invalidating his mapping.

  *(Final check on the three proposals)*:
  1. VUS: Unstable evidence (Fixed Scene failure).
  2. Polygenic/No Intervention: No action available (Task failure/Net Value).
  3. Child/Late-onset: Autonomy/Externalities (Single Viewer failure).

