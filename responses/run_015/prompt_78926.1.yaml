      *   *(3) Psychiatry Skepticism:* Psych categories legitimate *only* if tracking real malfunctions; manuals are administrative, not natural kinds.
      *   *(4) Homosexuality Lesson:* Atypicality $\neq$ Disorder. Social disapproval $\neq$ Biology. (Anti-normative classification).
      *   *(5) Asymptomatic Disease:* Malfunction alone can constitute disease (e.g., early tumor), even without current harm/distress. *Wait, check (2).* (2) says "harm to the person." (5) says "causes no distress and no impairment." This looks like a direct contradiction.
      *   *(6) Enhancement/Treatment Blur:* If a drug works safely, whether the mechanism was broken is *irrelevant* to medicine's remit. (This undermines the importance of the malfunction criterion for *practice*, even if kept for *definition*).

