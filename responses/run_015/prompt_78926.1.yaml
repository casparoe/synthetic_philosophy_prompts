      *   **(1)/(2) vs. (6):**
          *   (1)/(2): Disease is defined by *malfunction*. Medicine's remit is presumably treating disease.
          *   (6): Medicine's remit includes enhancement; whether mechanism was broken is *irrelevant*.
          *   *Severity:* Medium-High. It creates a disconnect between the *definition* of disease and the *scope* of medical practice. If medicine treats non-malfunctions, why is the definition of disease so fixated on malfunction? It risks making the concept of "disease" practically idle for defining medical ethics or scope.

      *   **(3) vs. (6):**
          *   (3): Psych legitimacy depends on tracking *real malfunctions*. Manuals are just admin.
          *   (6): Whether a mechanism is broken is *irrelevant* to medical intervention.
          *   *Severity:* Medium. (3) insists on a high bar for legitimacy (malfunction), while (6) suggests the bar for intervention doesn't matter. Why care if psych tracks malfunction if we treat anyway?

      *   **(4) vs. (1)/(2):**
          *   (4) aligns well with (1) and (2). It reinforces the idea that social values shouldn't dictate disease status.
