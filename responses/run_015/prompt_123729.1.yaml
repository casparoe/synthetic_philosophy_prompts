answer: |-
  **The Scenario**
  A city workforce agency manages a grant program intended to boost "Community Prosperity" by helping residents find stable work. Their primary performance metric is the "Six-Month Employment Rate" (percentage of participants employed half a year after intake), which determines their future funding. During a two-year period, the local economy shifts sharply from manufacturing to gig-based service work. The agency staff, honestly trying to maximize prosperity, successfully place participants into the available jobs; they do not falsify data or cherry-pick easy candidates, but the available jobs are now predominantly low-hour, low-wage contracts. Consequently, the **Employment Rate rises from 60% to 85%** (because gig work is easier to secure than factory work), while the **Average Monthly Income of participants falls from $3,200 to $2,100** (because the jobs are lower quality). The measure (Employment) decouples from the goal (Prosperity) purely due to external market selection, with no adversarial behavior by the staff.

  **The Structure & Numbers**
  *   **Year 1 (Manufacturing Economy):**
      *   Participants: 1,000
      *   Placed in Stable Jobs: 600 (60% Rate)
      *   Avg Income: $3,200/mo
      *   **Total Community Income:** $1.92M/month
  *   **Year 2 (Gig Economy Shift):**
      *   Participants: 1,000
      *   Placed in Gig Jobs: 850 (85% Rate)
      *   Avg Income: $2,100/mo
      *   **Total Community Income:** $1.78M/month
  *   **Decoupling:** The metric (Employment Rate) improved by **25 points**, but the reality (Total Income) degraded by **~7%**.

  **The Flavour of Goodhart**
  This is **Selection Bias Goodhart** (sometimes categorized under **Regressive Goodhart**). It is not *Adversarial* because no one manipulated the data. It is not *Causal* because measuring employment didn't cause wages to drop. Instead, the statistical relationship between the proxy (having a job) and the latent variable (prosperity) broke because the *population of jobs* changed. The metric assumed a stable environment where "Job = Prosperity," but the tail of the distribution (the quality of available jobs) shifted, making the average misleading.

  **Why the Obvious Fix Fails**
  The obvious fix is to add "Average Income" as a second metric or reweight the score to 50% Employment / 50% Income. This fails due to **Measurement Latency**. Employment status can be verified instantly via payroll tax feeds at the six-month mark. Accurate income data, however, requires annual tax reconciliation, meaning the agency wouldn't know the "Income Score" for 12+ months. In a quarterly review cycle, the "Employment Rate" dominates decision-making simply because it is the only *timely* number available. The feature doing the work is **Asymmetric Information Velocity**: the proxy is fast, the reality is slow.

  **Defending the Number**
  For the number to be trustworthy again, the **definition of "Employment"** would have to change from a binary (Yes/No) to a weighted score (e.g., "Full-Time Equivalents"), requiring real-time data integration that doesn't exist. Stuck with the current constraints, a defender would argue: *"Employment is the leading indicator; income is the lag. You cannot have income without employment, so we must optimize for entry first. If we wait for income data to correct course, we will have already missed the window to place people."* They defend the broken metric by framing it as a necessary prerequisite, betting that quantity of jobs will eventually lead to quality, even if the data currently shows otherwise.
