answer: |-
  This is an exceptionally sharp diagnosis of a stalemate that has indeed plagued the field for half a century. You are correct to sense that the impasse is not merely a lack of cleverness on either side, but a structural feature of the debate itself. The literature feels circular because the participants are often playing different games with different scorecards, yet claiming to play the same game.

  Here is a diagnosis of the disagreement and a proposal for what genuine progress would look like in your seminar.

  ### 1. Diagnosis: Methodological and Bedrock, Not Verbal

  While there is a verbal component (definitions of "existence"), characterizing the dispute as merely verbal is too deflationary. Both sides generally agree on the empirical predictions of SR. The disagreement is primarily **Methodological**, underwritten by **Bedrock** intuitions.

  **A. The Methodological Clash: Naturalism vs. Metaphysical Autonomy**
  *   **The Eternalist (Naturalist) Register:** This side operates on a Quinean criterion of ontological commitment: "To be is to be the value of a bound variable." If the best physical theory quantifies over spacetime points $p \in M$ without distinguishing a privileged $t$, then our ontology must reflect that symmetry. For them, physics is *ontologically exhaustive*. To posit a "present" that physics cannot detect is to violate parsimony and posit "surplus structure."
  *   **The Presentist (Autonomist) Register:** This side treats metaphysics as having a degree of autonomy from physics. They argue that physics describes the *structure* of relations, but metaphysics determines the *mode* of being. For them, the "manifest image" of temporal becoming is a datum that a complete ontology must accommodate, even if it requires interpreting the physics non-literally (e.g., treating the metric as a dynamical field on a 3D manifold rather than a 4D block).

  **B. The Bedrock Intuitions: Symmetry vs. Passage**
  Beneath the methodology lie competing brute intuitions that are difficult to argue for without begging the question:
  *   **Eternalist Intuition:** The "Point of View of the Universe." Reality should not depend on a perspective. If the laws are Lorentz invariant, reality should be too. The idea that existence depends on a frame of reference feels like a category error to them.
  *   **Presentist Intuition:** The "Phenomenology of Agency." The open future and the fixed past are fundamental features of experience. To deny this is to make the world unintelligible to the agents within it. The idea that the future "already exists" feels like a modal collapse to them.

  **C. Why it isn't just Verbal**
  If it were merely verbal, we could stipulate definitions and move on. But the stakes involve theoretical virtues. The Eternalist charges the Presentist with *ad hocery* (adding a hidden foliation). The Presentist charges the Eternalist with *eliminitivism* (denying the reality of change). These are substantive axiological disagreements about what makes a theory *good*, not just what words mean.

  ### 2. The Hidden Formal Question: Transitivity and "Real For"

  You suspected a hidden formal question regarding transitivity. You are right. The Rietdijk–Putnam argument relies on a specific logical structure regarding the relation $Rxy$ ("$x$ is real for $y$").

  The argument assumes:
  1.  **Relativity of Simultaneity:** Simultaneity is frame-dependent.
  2.  **No Privileged Frame:** All inertial frames are ontologically equal.
  3.  **Transitivity of Reality:** If $x$ is real for $y$, and $y$ is real for $z$, then $x$ is real for $z$.

  **Howard Stein's Intervention (1968, 1991):**
  Stein demonstrated that if one defines "becoming" as a relation on spacetime that is definable from the causal structure, one can maintain a form of temporal becoming without a preferred foliation. However, this requires rejecting the transitivity of "is present with."
  *   **Progress Point:** The Presentist can reject the transitivity of ontological commitment. Existence can be *relative to an event* without being solipsistic. If the seminar participants have not grappled with Stein's "no-go" theorem and the subsequent defenses of *relativized existence* (e.g., by Steven Savitt or Mauro Dorato), this is a concrete technical avenue to explore. It shows Presentism is not *logically* incompatible with SR, but it requires abandoning classical mereology or transitivity of identity/existence.

  ### 3. What Would Count as Progress?

  Given the diagnosis, a "proof" that one side is right is impossible. Progress in a graduate seminar should shift from **Resolution** to **Clarification of Cost**.

  **A. Abandon the "Physics Dictates Metaphysics" Premise**
  The seminar should explicitly acknowledge that SR *underdetermines* the ontology.
  *   **Eternalism** is the *natural* ontological reading of the Minkowski manifold (it requires no extra structure).
  *   **Presentism** is a *compatible* ontological reading only if one adds structure (a preferred frame) or subtracts logical principles (transitivity of existence).
  *   **Progress:** Acknowledging that the choice is not between "What SR says" and "What SR denies," but between "SR + Parsimony" and "SR + Phenomenological Fidelity."

  **B. Distinguish Coordinate Variance from Ontological Variance**
  You suggested this, and it is crucial. The Eternalist claims that because "simultaneity" is coordinate-variant, it is ontologically suspect. The Presentist claims that "existence" is not a coordinate but a metaphysical primitive.
  *   **Progress:** A clear distinction between **Invariant Structure** (the light cone, the interval) and **Ontological Status** (existence). The Eternalist conflates these: "If it's not invariant, it's not real." The Presentist separates them: "Invariance tracks physical law; Ontology tracks being." Progress is realizing these are distinct criteria.

  **C. The Axiological Turn (Theoretical Virtues)**
  Instead of asking "Which is true?", ask "What do we value?"
  *   If you value **unification and symmetry**, Eternalism wins. It treats time as a dimension analogous to space, simplifying the ontology.
  *   If you value **modal openness and agency**, Presentism wins. It preserves the intuition that the future is not fixed, even if it makes the physics slightly more cumbersome (e.g., Lorentzian Ether Theory empirically equivalent to SR).
  *   **Progress:** An honest admission that the dispute turns on prior weights assigned to theoretical virtues. This is not a defeat; it is a maturation of the debate.

  ### 4. Recommended Seminar Pivot

  To break the three-week stall, I suggest proposing the following framework to your colleagues:

  1.  **Accept Underdetermination:** Concede that SR does not *logically force* the Block Universe. (Lorentzian Presentism is empirically adequate).
  2.  **Isolate the Cost:**
      *   **Eternalist Cost:** Must explain away the vivid phenomenology of passage as an illusion or a perspectival effect (the "time-slice" problem).
      *   **Presentist Cost:** Must accept a hidden, undetectable structure (preferred foliation) or a non-transitive ontology (Stein-style becoming).
  3.  **Reframe the Question:** The question is not "Does SR refute Presentism?" but "Is the phenomenology of time robust enough to warrant positing undetectable structure?"

  **Conclusion:**
  The disagreement is **Methodological** (how we derive ontology from theory) rooted in **Bedrock** intuitions (symmetry vs. passage). Progress will not come from a formal proof, but from an **axiological clarification**. The seminar should move toward admitting that the "Problem of Time" in SR is not a puzzle to be solved, but a trade-off to be managed. The most philosophically honest position is likely a form of **Perspectival Realism**: the Block Universe is the view from nowhere (the physics), and Presentism is the view from somewhere (the agent), and neither fully reduces to the other.

  **Suggested Reading to Shift the Frame:**
  *   **Howard Stein,** "On Einstein-Minkowski Space-Time" (for the formal constraints on becoming).
  *   **Kit Fine,** "Tense and Reality" (for the distinction between fragmentalism and standard eternalism).
  *   **Craig Callender,** "The Common Now" (for the deflationary approach).
  *   **Tim Maudlin,** *The Metaphysics Within Physics* (for the argument that metaphysics should not be subservient to physics).

  This approach validates your suspicion: the stall is indeed about incompatible registers of commitment. Making that incompatibility explicit is the only way to move forward.
