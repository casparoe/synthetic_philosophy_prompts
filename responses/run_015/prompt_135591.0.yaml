prompt: |-
  I'm taking a philosophy of medicine course and we just covered Semmelweis at Vienna General in the 1840s — you know, the handwashing guy who got ridiculed and eventually ended up in an asylum. I was arguing with my roommate about whether this is really epistemic injustice in Miranda Fricker's sense, or if it's some weirder kind of failure that doesn't quite fit. The usual story is he had mortality data, the senior doctors dismissed him partly because he was young and Hungarian and partly because he had no mechanism, then he died in an institution. But I want to push the framing: is the harm mainly a credibility deficit tied to his identity and rank (testimonial injustice), or is it that the miasma framework made his statistical findings literally uninterpretible for them (hermeneutical injustice)? There's also this institutional flip side — the professors had enormous credibility excess just by being Vienna faculty — which feels related but isn't exactly the mirror image of testimonial injustice.

  Can you analyze the Semmelweis episode through the lens of epistemic injustice, but be disciplined about the mapping: who are the agents, what counts as the evidence, and what the actual harm was? In particular, I want you to deal with whether this counts as hermeneutical injustice when germ theory wasn't just socially absent but scientifically nonexistent, and whether the doctors' resistance was a moral wrong or just rational error — they wasn't malicious, they were just wrong. Also address the credibility-excess problem: does Fricker's framework have anything to say about over-trusted authorities blocking knowledge, or does that break the model? Don't just label it an example; tell me if it's actually an anomaly or if it reveals a gap in the theory.

  Please organize your response like this:

  1. The mapping (about 200 words): lay out the players, the evidence, and how testimonial vs hermeneutical injustice apply.
  2. Where the theory fits and where it slips (about 250 words): be honest about whether the doctors' blindness was a social hermeneutical gap or just pre-scientific ignorance, and whether moral wrong is required.
  3. The credibility-excess problem (about 150 words): discuss the institutional authority side and whether it extends or breaks Fricker's account.
  4. Bottom line (about 100 words): is Semmelweis a good case study, or does the episode show epistemic injustice needs tweaking for scientific contexts?

  No citations or reading lists needed — just work through the reasoning. Keep it somewhat casual.
