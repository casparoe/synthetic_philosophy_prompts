      *Ready to write.*
answer: |-
  This is a sophisticated methodological impasse, and you are right to sense that the disagreement is partly verbal but not *merely* verbal. The friction arises because your supervisors are using the word "actor" (and "action") to track different ontological and methodological commitments. One is defining history by the *logic of intention*, the other by the *logic of constraint*.

  Here is a disambiguation of the claims, an evaluation of your taxonomy, and a recommendation for how to proceed in your paper without falling into environmental determinism.

  ### 1. Disambiguating the Slogans

  We need to separate the trivial, defensible, and doubtful readings of each slogan to see where the actual argumentative weight lies.

  #### Slogan A (Supervisor): "Only people act, germs just happen."

  1.  **The Grammatical/semantic reading (Trivial/Platitude):**
      *   *Claim:* In standard English, the verb "to act" implies a subject with a mind. Germs lack minds; therefore, grammatically, they do not act.
      *   *Status:* **Platitude.** It defines "act" as synonymous with "intentional behavior."
      *   *Utility:* This entitles your supervisor to rule pathogens out of the "actor" category only if she insists that historiography must strictly mirror folk-psychological grammar. It shuts down the conversation by definition rather than argument.

  2.  **The Methodological Individualist reading (Substantive/Defensible):**
      *   *Claim:* Historical explanation is distinct from natural scientific explanation because it cites *reasons*, not just causes. To explain an event historically is to make it intelligible in terms of human projects. Germs provide causes, but only humans provide reasons.
      *   *Status:* **Substantive and Defensible.** This is a claim about the *goal* of history. If the goal is understanding human meaning-making, then germs are context.
      *   *Utility:* This is the strongest reading for your supervisor. It entitles her to exclude pathogens from "agency" because agency is defined here as *reason-giving capacity*.

  3.  **The Moral/Legal reading (Substantive/Doubtful in this context):**
      *   *Claim:* Only entities that can be held responsible can be actors. Germs cannot be blamed or praised.
      *   *Status:* **Substantive but Category Mistake.** While true in ethics, it is doubtful in historiography. We often speak of "economic forces" or "social structures" acting without assigning moral blame.
      *   *Utility:* Weak. It conflates *causal agency* with *moral accountability*.

  4.  **The Epiphenomenal reading (Radical/False):**
      *   *Claim:* Non-human events are merely background noise that never fundamentally alters the trajectory of human history, which is driven solely by human decisions.
      *   *Status:* **Straightforwardly False.** It denies obvious counterfactuals (e.g., the Plague of Justinian).
      *   *Utility:* If your supervisor holds this, she is empirically wrong. Assume she holds reading #2 instead.

  #### Slogan B (Visitor): "In the long run, nature has the last word."

  1.  **The Biological Precondition reading (Trivial/Platitude):**
      *   *Claim:* Humans must be alive to do history. If climate kills everyone, history stops.
      *   *Status:* **Platitude.**
      *   *Utility:* Trivial. It doesn't help explain specific historical outcomes, only the possibility of history itself.

  2.  **The Selection/Filter reading (Substantive/Defensible):**
      *   *Claim:* Human projects are numerous, but environmental factors select which projects survive or thrive over the *longue durée*. Nature doesn't dictate the plan, but it vetoes the unsustainable ones.
      *   *Status:* **Substantive and Defensible.** This treats nature as a constraint system rather than a director.
      *   *Utility:* This entitles the visitor to treat pathogens as crucial explanatory factors without denying human intention. It makes them "actors" in the sense of *veto players*.

  3.  **The Causal Dominance reading (Substantive/Doubtful):**
      *   *Claim:* In specific instances, environmental causes override human intentions so completely that the human intention becomes explanatorily irrelevant.
      *   *Status:* **Substantive and Context-Dependent.** True in catastrophic scenarios (Pompeii), doubtful in adaptive scenarios.
      *   *Utility:* This supports treating pathogens as primary drivers in specific episodes.

  4.  **The Hard Determinist reading (Radical/False):**
      *   *Claim:* Human intentions are themselves determined by biological/environmental states. "Agency" is an illusion.
      *   *Status:* **Straightforwardly False (for historiography).** Even if metaphysically true, it renders historical method impossible.
      *   *Utility:* If the visitor means this, they are undermining the discipline. Assume they mean reading #2 or #3.

  #### Is the Dispute Merely Verbal?

  Under Reading A1 (Grammar) and Reading B1 (Precondition), the dispute is verbal. They are talking past each other: one defines "actor" by *intent*, the other by *effect*.

  However, under Reading A2 (Reasons vs. Causes) and Reading B2 (Selection/Filter), the dispute is **substantive**. It is a disagreement about the *boundary of the historical discipline*.
  *   **Supervisor:** History is the study of human meaning. Non-human factors are the stage, not the players.
  *   **Visitor:** History is the study of human survival and change. Non-human factors are co-constitutive of the plot.

  **What survives the verbal dispute:** The question of whether historical explanation must be *anthropocentric* (focused on human reasons) or *ecocentric* (focused on systemic outcomes). If you want to treat pathogens as actors, you must argue that the goal of history is to explain *outcomes*, not just *intentions*.

  ### 2. Testing Your Taxonomy

  Your five-point taxonomy is strong, but it conflates ontological properties with epistemic ones. Here is where it collapses distinctions that matter for your paper.

  **1. Difference-making (Counterfactual Dependence)**
  *   *Definition:* Would the outcome have occurred if the pathogen were absent?
  *   *Verdict:* **Necessary but not sufficient.** A background condition (like gravity) makes a difference, but we rarely call it an actor. If the city had no water, the siege fails. Is water an actor? Usually no. This criterion is too broad for "agency."
  *   *Slogan Mapping:* The Visitor relies on this. The Supervisor ignores it.

  **2. Robustness (Insensitivity to Intervention)**
  *   *Definition:* Does the factor produce the same outcome regardless of human variation?
  *   *Verdict:* **Crucial for "Determinism" vs. "Agency."** If a pathogen kills 90% of the population regardless of quarantine, it is robust. If human intervention changes the outcome, the pathogen is less "agentic" and more "conditional."
  *   *Slogan Mapping:* The Visitor needs high robustness to claim "nature has the last word." The Supervisor needs low robustness to claim "human action matters."

  **3. Reason-responsiveness (Interaction with Intentions)**
  *   *Definition:* Can the factor be integrated into a practical syllogism? Can it respond to reasons?
  *   *Verdict:* **The Core Distinction.** This is the strongest criterion for "Agency." A pathogen does not respond to reasons (quarantine works via physical barrier, not persuasion). However, pathogens *evolve* in response to pressure, which is a thin form of responsiveness.
  *   *Slogan Mapping:* The Supervisor *needs* this reading. If you deny reason-responsiveness, you deny agency in the traditional sense.
  *   *Collapse:* You note pathogens pass this "only in a thin evolutionary sense." Be careful. Evolutionary response is not *agency*; it is *adaptation*. Conflating them risks the "Naturalistic Fallacy."

  **4. Legibility (Epistemic Access for Agents)**
  *   *Definition:* Did the historical agents know the factor existed?
  *   *Verdict:* **Epistemic, not Ontic.** This is where your taxonomy is most vulnerable. Whether a germ is an "actor" should not depend on whether 14th-century people knew about germ theory. Causation is real regardless of knowledge.
  *   *Does it belong in agency?* **No.** It belongs in *narrative reconstruction*. It determines whether the agents could treat the pathogen as a *rival* or only as a *mystery*.
  *   *Slogan Mapping:* The Supervisor might use this to say "They couldn't act against it, so it wasn't part of the historical action." This is a confusion of *explanation for us* with *action for them*.

  **5. Narrative Eligibility (Grammatical Subject)**
  *   *Definition:* Can it sit in the subject position without strain? ("The virus killed..." vs. "People died of...")
  *   *Verdict:* **Pragmatic, not Metaphysical.** This tracks our cognitive biases, not reality.
  *   *Slogan Mapping:* The Supervisor relies on this implicitly. She finds "The virus killed" pragmatically strained because it sounds like personification.

  #### Where the Taxonomy Collapses
  The taxonomy collapses the distinction between **Causal Power** (Difference-making, Robustness) and **Agency** (Reason-responsiveness).
  *   Volcanoes have high Causal Power but zero Agency.
  *   Humans have high Agency and variable Causal Power.
  *   Pathogens have high Causal Power and zero Agency (strictly speaking).

  Your Supervisor is defining "Actor" as **Agent**. The Visitor is defining "Actor" as **Causal Force**. You cannot satisfy both with one word.

  **Specific Answer on Legibility:** Legibility is an epistemic property that has **no business in an account of ontology**, but it is vital for **historiography**. A pathogen is a causal actor regardless of legibility. But it only enters the *historical narrative as a rival* if it is legible. If you are writing about the *experience* of the epidemic, legibility matters. If you are writing about the *demographic collapse*, it does not. Do not let legibility determine agency; let it determine narrative focus.

  ### 3. Agency vs. Environmental Determinism

  You asked where the line falls between treating a pathogen as an actor and sliding into environmental determinism.

  **The Line:**
  Determinism claims that environmental factors **screen off** human agency. That is, given the environmental state $E$, the outcome $O$ is fixed regardless of human variable $H$.
  *   *Determinist:* The drought caused the collapse. (Human response was irrelevant).
  *   *Actor/Interactionist:* The drought constrained the options, and the human response to the drought determined the specific outcome.

  To treat a pathogen as an "actor" without being a determinist, you must model the interaction as a **feedback loop**, not a one-way street.
  *   *Determinism:* Pathogen $\rightarrow$ Human Outcome.
  *   *Agency/Interaction:* Pathogen $\rightarrow$ Human Response $\rightarrow$ Pathogen Evolution/Spread $\rightarrow$ Human Outcome.

  If you argue the pathogen is an actor, you must show that its "actions" provoked specific human responses which in turn altered the pathogen's trajectory (even if unsuccessfully). If you argue the pathogen simply overwhelmed all response, you are arguing for determinism (or catastrophe).

  **The Risk:**
  If you grant pathogens "agency," you risk implying they have *goals*. If you deny it, you risk rendering them passive "background."
  **The Solution:**
  Do not use the word "Actor" for the pathogen. It invites the Supervisor's objection (no intention) and the Visitor's trap (determinism).

  ### 4. Terminology Recommendation

  "Actor" is the wrong word for your paper because it is overloaded with intentional baggage. It forces you into a debate about minds that distracts from the causal history.

  I recommend splitting the concept into three narrower notions. This will allow you to agree with the Visitor on causality while conceding to the Supervisor on intentionality.

  1.  **Intentional Agent:** (Humans only). Entities that act for reasons. This satisfies your Supervisor.
  2.  **Causal Actant:** (Pathogens, Climate, Volcanoes). Entities that exert force, make differences, and constrain outcomes, but do not act for reasons. This satisfies the Visitor. (Note: "Actant" is a term from semiotics and ANT that specifically decouples action from intention).
  3.  **Structural Condition:** (Background factors). Factors that set the parameters but do not trigger specific events.

  **Why this helps your paper:**
  You can argue: *"While pathogens are not Intentional Agents (conceding to Supervisor), they are Causal Actants that function as veto-players in the historical system (aligning with Visitor). Treating them merely as Structural Conditions obscures their dynamic role in the collapse."*

  This allows you to say:
  *   "Germs don't *act* (in the moral/intentional sense)."
  *   "But germs *do work* (in the causal/explanatory sense)."

  ### 5. Strategic Advice for the 5,000 Words

  **Introduction (750 words):**
  Frame the problem not as "Do germs have minds?" but as "What is the unit of historical explanation?" State that the "Actor" debate is a proxy for the "Reasons vs. Causes" debate. Propose that you will disentangle *agency* from *causal efficacy*.

  **Section 1: The Supervisor's Constraint (1,250 words):**
  Analyze the "Only people act" claim. Grant that *Intentional Agency* is unique to humans. Explain why this matters: history is about meaning. Show where this view fails: it renders catastrophic events as mere "context," making the historical narrative unintelligible (e.g., explaining a war's end solely by treaty terms when cholera killed the generals).
  *   *Use your taxonomy:* Show that "Reason-responsiveness" is the Supervisor's bottleneck.

  **Section 2: The Visitor's Correction (1,250 words):**
  Analyze the "Nature has the last word" claim. Defend the *Causal Actant* status of pathogens. Use "Difference-making" and "Robustness." Show that in your specific case, human intentions were present but *inefficacious* against the pathogen's robustness.
  *   *Use your taxonomy:* Show that "Legibility" is irrelevant to the causal crash, even if relevant to the human experience.

  **Section 3: Synthesis - The Feedback Loop (1,250 words):**
  Avoid determinism. Show how the pathogen and the population co-constituted the outcome. The pathogen acted (causally); the humans reacted (intentionally); the pathogen responded (biologically). This is not determinism; it is a **coupled system**.
  *   *Terminology:* Explicitly switch from "Actor" to "Actant" or "Causal Force" here to show conceptual precision.

  **Conclusion (500 words):**
  Conclude that the dispute is verbal regarding the word "actor" but substantive regarding *explanatory scope*. Argue that a coherent historiography must accommodate non-human *actants* without attributing human *agency* to them.

  ### Summary of Answers to Your Specific Questions

  *   **Which readings entitle the Supervisor?** The *Methodological Individualist* reading (History = Reasons). She needs *Reason-responsiveness* to be the necessary condition for "Actor."
  *   **Which readings entitle the Visitor?** The *Selection/Filter* or *Causal Dominance* reading. They need *Difference-making* and *Robustness* to be sufficient for "Actor."
  *   **Is the dispute merely verbal?** No. It is verbal about the label "actor," but substantive about whether history explains *intentions* or *outcomes*.
  *   **Where does the taxonomy collapse?** It collapses *Causal Power* (Difference-making) with *Agency* (Reason-responsiveness). You must separate these.
  *   **Does Legibility belong in agency?** No. It belongs in *narrative methodology*. A pathogen is an ontological actor regardless of whether it is legible to the subjects.
  *   **Line between Actor and Determinism:** Determinism denies the feedback loop (human response changes nothing). "Actor" status for pathogens implies a dynamic interaction where human response *attempts* to alter the path, even if it fails.
  *   **Is "Actor" the word you want?** No. Use **Intentional Agent** for humans and **Causal Actant** for pathogens. This disarms the Supervisor's objection while retaining the Visitor's insight.

  By making this distinction, you stop fighting about whether a germ has a mind and start arguing about how much explanatory weight a mindless force can carry. That is a historical argument, not a semantic one.
