answer: |-
  In the evaluation of multiverse hypotheses arising from string theory's landscape of vacua, the tension between empirical risk and explanatory risk defines the boundary of what constitutes scientific validation. The landscape scenario posits a vast number of possible vacuum states, each corresponding to a universe with potentially different physical properties. This abundance creates a crisis of predictive uniqueness, particularly regarding observable parameters like the cosmological constant. To understand whether this crisis undermines the theory's status as science or merely its capacity to explain specific features of our universe, one must analyze the nature of the underdetermination involved and the role of non-empirical confirmation.

  Empirical risk refers to the danger that a theory cannot be falsified or corroborated by observation. If a theoretical framework can accommodate any possible observational outcome by selecting a different vacuum state, it loses its ability to make risky predictions. Explanatory risk, by contrast, concerns the theory's ability to provide a causal or dynamical account of why the universe possesses its specific features. A theory might be empirically viable yet explanatorily deficient if it resorts to statistical selection effects rather than fundamental derivation to account for physical constants. The claim that mathematical consistency serves as a form of non-empirical confirmation attempts to mitigate empirical risk. Proponents argue that if a theory is uniquely mathematically consistent and no viable alternatives exist, these theoretical virtues can warrant belief in the theory even in the absence of unique empirical predictions. However, the validity of this claim depends heavily on the specific type of underdetermination present in the landscape.

  To clarify the stakes, it is necessary to distinguish between two modes of underdetermination as defined in this context: structural underdetermination and parameter underdetermination.

  Structural underdetermination occurs when the fundamental theory determines the form of physical laws but not the values of constants. In this scenario, the low-energy effective physics observed in our universe—such as the gauge groups, the number of spacetime dimensions, and the types of particles—would be a unique consequence of the fundamental theory. The only variables would be numerical values, such as coupling strengths or mass ratios. If the landscape problem is characterized primarily by structural underdetermination, the fundamental theory remains empirically testable. Observers could verify the predicted form of the laws (for example, by detecting supersymmetry or extra dimensions). In this case, the landscape does not constitute a failure of empirical testability. Instead, it represents a limitation on explanatory power. The theory would successfully predict the rules of the game but would fail to explain why the specific parameters of our universe take the values they do, requiring anthropic or statistical reasoning to fill the gap.

  Parameter underdetermination, conversely, occurs when vacuum selection renders even the form of the physical laws contingent. Here, the landscape includes vacua with fundamentally different structures—different symmetry groups, different dimensionalities, or different particle contents. In this scenario, the low-energy physics observed in our universe is merely one random draw from a vast ensemble of possibilities, with no necessary connection to a unique prediction of the fundamental theory. This distinction is critical because it shifts the problem from explanation to testability. If the form of the laws is contingent, observing the Standard Model of particle physics does not uniquely confirm the underlying fundamental theory, as that theory also allows for entirely different models. Consequently, the link between empirical data and the high-energy theory is severed.

  This distinction determines whether the landscape problem is a failure of empirical testability or only a limitation on explanatory power. If the situation is one of structural underdetermination, empirical testability is preserved because the structural features of the theory are visible in our vacuum. The risk is confined to explanation; the theory cannot derive the specific constants we measure, but it can still be proven wrong if the predicted structural features are absent. However, if the situation is one of parameter underdetermination, empirical testability is compromised. Since our local laws are contingent, the absence of specific structural signatures (like supersymmetry) does not necessarily falsify the fundamental theory; it might simply mean we inhabit a vacuum where those features are broken or hidden.

  The interaction with non-empirical confirmation becomes decisive in the latter case. When parameter underdetermination threatens empirical testability, proponents of the landscape hypothesis often rely on mathematical consistency to sustain the theory's scientific status. They argue that the uniqueness of the mathematical structure compensates for the lack of predictive uniqueness regarding physical forms. However, if the underdetermination is merely structural, non-empirical confirmation is less critical because empirical data can still constrain the theory. Therefore, the classification of the underdetermination dictates the epistemic strategy required. If the landscape implies parameter underdetermination, the theory faces a failure of empirical testability that mathematical consistency alone may not overcome without redefining the criteria of scientific evidence. If it implies only structural underdetermination, the theory remains empirically grounded but must accept a reduced role in explaining the specific numerical values of the physical constants.
