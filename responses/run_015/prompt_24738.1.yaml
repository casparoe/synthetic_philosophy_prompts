answer: |-
  The one-liner "what is bad must be bad for someone" is a compression of at least three distinct philosophical claims that are often run together. In the context of the Non-Identity Problem (NIP), the force of the argument depends entirely on which layer of the claim is being prioritized: the definition of **harm**, the condition for **wrongness**, or the ontology of **moral patients**.

  Here are the four distinct precise principles this one-liner could be expressing, evaluated according to your criteria.

  ### 1. The Narrow Person-Affecting Restriction (on Wrongness)
  **Principle:** An act is morally wrong only if it makes some *particular, identifiable* person worse off than that specific person would have been had the act not been performed.
  *   **Meaning of "Bad":** Here, "bad" is shorthand for "morally wrong" or "impermissible."
  *   **Comparison:** Strictly counterfactual and individual-specific (World A vs. World B for Person X).
  *   **Status:** **Substantive and Controversial.** It is not a platitude; it is a specific deontological constraint that rejects impersonal values (e.g., "the world is worse" is not enough; it must be worse *for X*).
  *   **NIP Refutation:** The NIP is widely considered a *reductio* of this principle. If you intuit that choosing a policy that creates a lower-quality-of-life future population is wrong (even though the specific people in that future are not worse off than they would have been), then this principle yields the wrong verdict. Most population ethicists reject this principle specifically because of NIP cases.
  *   **Support for "Not Wrong" Conclusion:** **Yes.** This is the specific engine that drives the conclusion that an identity-changing policy choice is not wrong. If you accept this principle, the fact that the future people are not comparatively worse off entails the act is not wrong.

  ### 2. The Comparative Conception of Harm
  **Principle:** Event E is "bad for" Person P if and only if P is worse off with E than P would have been without E.
  *   **Meaning of "Bad":** Prudential badness (harm/welfare reduction), not necessarily moral wrongness.
  *   **Comparison:** Counterfactual comparison of welfare levels for the *same* subject.
  *   **Status:** **Defensible but Contested.** This is the standard view in economics and tort law. However, it is philosophically substantive; it competes with non-comparative accounts of harm.
  *   **NIP Refutation:** The NIP does not refute this; it *satisfies* it. In NIP cases, the child is not harmed under this definition because their alternative was non-existence. The problem arises only if you think an act can be wrong *without* harming anyone (which requires linking this principle to Principle 1).
  *   **Support for "Not Wrong" Conclusion:** **Only conditionally.** This principle establishes that no *harm* occurred. To get to "no *wrong* occurred," you must additionally accept Principle 1 (that wrongness requires harm).

  ### 3. The Actualist Constraint on Moral Patients
  **Principle:** The phrase "someone" refers only to actually existing (or definitely will-exist) individuals, not to merely possible individuals who *could* have existed.
  *   **Meaning of "Bad":** Badness relative to moral standing.
  *   **Comparison:** N/A (Ontological claim).
  *   **Status:** **Substantive.** It denies moral standing to "possible people." A "Wide" Person-Affecting View might say an act is bad if it is bad for "someone or other" (including those who exist in the alternative world), but the one-liner usually implies a "Narrow" view restricted to actuals.
  *   **NIP Refutation:** NIP exploits this constraint. If you believe possible people have moral standing (e.g., we can wrong people by not bringing them into existence, or by bringing into existence different, worse-off people instead of better-off ones), this constraint fails.
  *   **Support for "Not Wrong" Conclusion:** **Yes.** By restricting the domain of "someone" to the people who actually end up existing, it blocks the comparison with the better-off people who *would have* existed under the alternative policy.

  ### 4. The Non-Comparative (Threshold) Conception of Harm
  **Principle:** Event E is "bad for" Person P if E causes P to be in a sufficiently bad state (e.g., suffering, below a welfare threshold), regardless of whether P would have been worse off otherwise.
  *   **Meaning of "Bad":** Intrinsic state of suffering or deprivation.
  *   **Comparison:** Absolute threshold, not counterfactual.
  *   **Status:** **Defensible.** This is the primary rival to the Comparative Conception. It allows us to say a child born with a severe genetic disease is "harmed" by the decision to conceive them, even if their life is still worth living and the alternative was non-existence.
  *   **NIP Refutation:** NIP does not refute this; rather, this conception is often invoked to *solve* NIP. It allows us to say the policy was wrong because it harmed the resulting people (by putting them below a threshold), even if it didn't make them worse off than they would have been.
  *   **Support for "Not Wrong" Conclusion:** **No.** This reading actively undermines the conclusion. If the future people are below a threshold of well-being, this principle says the outcome *is* bad for them, implying the policy could be wrong despite the identity change.

  ### Summary of Disambiguation

  | Principle | Focus | Platitude or Substantive? | Refuted by NIP? | Supports "Not Wrong" Conclusion? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Narrow Person-Affecting Restriction** | **Wrongness** | Substantive / Controversial | **Yes** (by intuition) | **Yes** (Directly) |
  | **2. Comparative Harm** | **Definition of Harm** | Defensible / Standard | No (NIP fits it) | Only if paired with #1 |
  | **3. Actualist Constraint** | **Ontology of "Someone"** | Substantive | No (NIP fits it) | **Yes** (By exclusion) |
  | **4. Non-Comparative Harm** | **Definition of Harm** | Defensible / Rival View | No | **No** (Opposes it) |

  ### The Verdict on the One-Liner

  When wielded to conclude that an identity-changing policy is **not wrong**, the one-liner is relying on a conjunction of **Principle 1 (Narrow PAR)** and **Principle 3 (Actualism)**, underpinned by **Principle 2 (Comparative Harm)**.

  *   **Is it a platitude?** No. It is a substantive ethical theory (Person-Affecting Utilitarianism or similar) disguised as a conceptual truth.
  *   **Does NIP refute it?** The NIP is generally taken to show that **Principle 1** yields counterintuitive results in identity-changing cases. If you hold the intuition that depleting resources for future generations is wrong even if it changes who is born, you are rejecting Principle 1.
  *   **Which reading supports the move?** Only the **Narrow Person-Affecting Restriction on Wrongness** supports the move from "not worse off" to "not wrong." The other readings merely define harm or ontology; they do not bridge the is-ought gap to moral permissibility without additional premises.

  Consequently, when someone uses "what is bad must be bad for someone" to shut down longtermist obligations regarding *which* people exist, they are implicitly asserting that **moral wrongness is exhausted by comparative harm to actual individuals.** This is the precise claim that the Non-Identity Problem challenges.
