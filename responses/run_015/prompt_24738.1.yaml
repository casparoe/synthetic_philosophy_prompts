prompt: |-
  I've been following the longtermism and population-ethics threads for a while now, and a certain one-liner keeps coming up in arguments about whether we owe anything to future generations, usually wielded like a reductio: "what is bad must be bad for someone". I've heard it used in at least two opposite directions — by people who conclude that a policy choice which changes which future people exist cannot be wrong, since the people who end up existing are not made worse off than they otherwise would have been, and by people who insist that person-affecting constraints are the only coherent foundation for ethics. I already accept the standard setup — that small changes alter who is conceived, that the people who exist under the worse option are not the same people who would have existed under the better one, and that each is, say, moderately happy — so please skip re-explaining the paradox and go straight to the disambiguation. Could you lay out the distinct precise principles this one-liner could be expressing — for instance, whether it is a claim about the meaning of "harm" rather than a claim about what is wrong, whether the relevant comparison is to a counterfactual world or to an absolute threshold, whose counterfactual it is, and what happens to the comparison when the choice changes which people exist at all — and say for each reading whether it is a platitude, a substantive and defensible principle, or plainly false, whether the identity-changing cases actually refute it, and which reading actually supports the move of concluding that an identity-changing policy choice is not wrong merely because the people who exist under it are not worse off than they otherwise would have been.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Population ethics, longtermism, the "Non-Identity Problem" (NIP).
      *   **Key Phrase:** "What is bad must be bad for someone."
      *   **Task:** Disambiguate this one-liner into distinct precise principles.
      *   **Specific Requirements:**
          *   Skip re-explaining the Non-Identity Problem (NIP) setup (assume user knows it).
          *   Identify distinct interpretations (meaning of "harm" vs. wrongness, counterfactual vs. threshold, whose counterfactual, identity-changing cases).
          *   Evaluate each interpretation (Platitude? Substantive/Defensible? Plainly False?).
          *   Assess whether NIP cases refute each interpretation.
          *   Identify which reading actually supports the conclusion that identity-changing policies aren't wrong (the "No Difference" conclusion).

  2.  **Deconstruct the One-Liner:**
      *   "What is bad must be bad for someone."
      *   *Ambiguity 1:* "Bad" (impersonal badness vs. moral wrongness vs. prudential badness).
      *   *Ambiguity 2:* "Bad for someone" (harm comparative vs. harm non-comparative vs. suffering).
      *   *Ambiguity 3:* "Someone" (specific identifiable individual vs. generic potential person).
      *   *Ambiguity 4:* The modal status (must be bad for someone *in that world* vs. *in the alternative world*).

  3.  **Drafting the Distinct Principles:**

      *   *Reading 1: The Person-Affecting Restriction (PAR) on Wrongness.*
          *   Idea: An act is wrong only if it makes some particular person worse off than they would otherwise have been.
          *   Focus: Moral wrongness, counterfactual comparison.
          *   Status: Substantive, controversial.
          *   NIP Impact: NIP cases seem to show acts can be wrong without making anyone worse off (if we accept the act *is* wrong). If we accept PAR, the act isn't wrong.
          *   Connection to conclusion: This is the one that supports the "not wrong" conclusion.

      *   *Reading 2: The Comparative Conception of Harm.*
          *   Idea: To harm someone is to make them worse off than they would otherwise have been.
          *   Focus: Definition of "harm," counterfactual comparison.
          *   Status: Standard in law/torts, but philosophically contested (non-comparative accounts exist).
          *   NIP Impact: In NIP, the child is not harmed (comparatively) because they wouldn't exist otherwise.
          *   Connection: Supports the idea that no *harm* occurred, but doesn't necessarily entail no *wrongness* (unless linked to Reading 1).

      *   *Reading 3: The Non-Comparative/Threshold Conception of Harm.*
          *   Idea: To harm someone is to put them below a threshold of well-being (or cause them pain), regardless of alternatives.
          *   Focus: Absolute state, not counterfactual.
          *   Status: Defensible, avoids NIP issues regarding harm.
          *   NIP Impact: If the child has a "life worth living" but below optimal, are they harmed? Non-comparative says maybe not if above threshold. If below threshold (wretched life), they are harmed even if existence is better than non-existence.
          *   Connection: Undermines the "not wrong" conclusion if the life is sufficiently bad.

      *   *Reading 4: The Impersonal Badness Constraint.*
          *   Idea: "Bad" refers to impersonal value (state of affairs), but it must be grounded in someone's experience. (Rejects free-floating value).
          *   Focus: Axiology, not necessarily morality.
          *   Status: Platitude/Conceptual truth for welfarists.
          *   NIP Impact: Doesn't solve the moral obligation question directly.

      *   *Reading 5: The "Same Number Quality Claim" (Parfit's Q).*
          *   Idea: If in two outcomes the same number of people exist, the one where people are worse off is worse, even if they are different people.
          *   Focus: Impersonal comparison.
          *   Status: Rejects the one-liner in favor of impersonal badness.
          *   NIP Impact: This is the *alternative* to the one-liner.

      *   *Refining the Readings for the Prompt:* The prompt asks specifically about interpretations of "What is bad must be bad for someone." I need to stick closer to that phrase's variations.

      *   *Revised Plan:*
          1.  **The Person-Affecting Principle (PAP) - Moral Version:** An act is wrong only if it is worse for some particular person. (The "No Fault" conclusion driver).
          2.  **The Comparative Account of Harm:** X harms Y iff X makes Y worse off than Y would otherwise have been. (The definition of "bad for").
          3.  **The Non-Comparative Account of Harm:** X harms Y iff X causes Y to be in a bad state (e.g., suffering), regardless of alternatives. (The rival definition).
          4.  **The Existence Constraint:** "Someone" must refer to an actual, identifiable individual, not a merely possible one. (The ontology of "someone").

  4.  **Fleshing out the Evaluations:**

      *   **PAP (Moral):**
          *   *Status:* Substantive, controversial. Not a platitude.
          *   *NIP Refutation:* If you intuitively feel the act *is* wrong (e.g., depleting resources knowing it lowers quality of life for future different people), NIP + PAP = Counterintuitive result. Many philosophers reject PAP because of NIP.
          *   *Support for Conclusion:* Yes, this is the engine for "not wrong."

      *   **Comparative Harm:**
          *   *Status:* Defensible, standard in economics/law.
