      *   **Principle 3: The Actualist Constraint on Moral Patients.** Focus on "Someone."
      *   **Principle 4: The Non-Comparative/Threshold Conception (The Counter-Reading).** Show how "bad for" can be read differently.
      *   **Synthesis/Conclusion:** Map which combination leads to the "No Difference" conclusion and where the philosophical friction lies.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between "Bad" (impersonal) and "Bad for" (personal). The prompt phrase is "bad for someone."
      *   *Correction:* Ensure I answer whether NIP *refutes* the principle. NIP is usually presented as a *reductio* of PAR, not necessarily a refutation of Comparative Harm.
      *   *Correction:* Be precise about the "No Difference" conclusion. That conclusion relies heavily on PAR.
      *   *Nuance:* Distinguish between "Wide" and "Narrow" Person-Affecting Views. Narrow = specific individuals. Wide = "someone or other." The one-liner usually implies Narrow.

  7.  **Final Polish:** Check against the prompt's specific constraints (skip NIP setup, focus on disambiguation, evaluate platitude/substantive/false, check NIP refutation status, identify the "not wrong" driver).

      *   *Check:* Did I explain NIP? No, assumed known.
