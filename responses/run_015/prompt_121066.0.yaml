      *   *Refined Thesis:* The disagreement is a **pragmatic conflation of taxonomy and justification**. Naturalists are trying to build a biological taxonomy (intrinsic), while Normativists are analyzing the logic of medical intervention (relational/normative). The impasse persists because both sides claim exclusive rights to the label "disease."
