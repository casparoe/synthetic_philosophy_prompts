      *   *Naturalism (e.g., Boorse's Biostatistical Theory):* Disease = failure of species-typical function relative to reference class. Value-free (in theory). "Harm" is downstream.
      *   *Normativism (e.g., Whistle-tooth, Fulford):* Disease = necessarily involves evaluation of badness/harm. You can't define disease without saying it's "bad for the person."
