answer: |-
  # Workshop Plan: The Mirror Draft

  **Concept:** A 90-minute experiential workshop exploring decision-making under symmetry.
  **Participants:** 16–18 adults.
  **Room:** Moveable tables (arranged in pairs for Rounds 1 & 3, cluster for Round 2).
  **Facilitator Stance:** You are not a lecturer. You are the "Visitor at the Retreat." You run the room. You do not explain the theory until the end.

  ## I. Materials (One Bag)

  1.  **18 "Briefing Envelopes" (White):** Numbered 1A through 9B. Inside each: Identical instruction card for the pair (see *Mechanics*), a small card for "Advice," a small card for "Choice," and a pencil.
      *   *Preparation:* 1A and 1B must contain *byte-identical* text. 2A/2B identical, etc.
  2.  **18 "Choice Envelopes" (Manila):** Larger, to seal the final decision.
  3.  **A "Common Pot" Box:** Opaque, with a slot.
  4.  **The Stakes (Visible on a side table):**
      *   One bottle of whisky/wine (sealed).
      *   Three vouchers for "15-Minute Feedback on 5 Pages."
      *   One voucher for "One-Hour Manuscript Consultation."
  5.  **A Timer:** Visible to the room.
  6.  **A Blackboard/Whiteboard:** For payoff tables.

  ## II. The Stakes & Payoff Scheme

  The currency is **"Draft Tokens."**
  *   **1 Token:** Entry into a raffle for the three 15-Minute Feedback vouchers.
  *   **5 Tokens:** Guaranteed 15-Minute Feedback voucher.
  *   **10 Tokens:** Entry into the raffle for the One-Hour Consultation.
  *   **The Bottle:** Unlocked only if the *Group* achieves a specific threshold in Round 2.

  **Where the stakes bite:**
  The Consultation is the "Holy Grail." It is scarce (only one). To win it, a participant needs 10 Tokens. The maximum possible tokens available in the game is 12. This makes every decision high-stakes. Participants must *want* the consultation for the game to function. State clearly at the start: *"I will honor these vouchers. I have the time. The bottle is real."*

  ## III. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10 | Setup & Framing**
  *   **Action:** Participants sit in pre-arranged pairs (9 tables).
  *   **Script:** "You are writers. You are in a retreat. Decisions in novels are often treated as solitary, but character is a relational act. Today, we play for time. On the table are vouchers for my attention. You will earn Draft Tokens. The rules are on the cards. Do not speak during play. If you speak, you forfeit."
  *   **Board:** Write the Payoff Table for Round 1 (see *Mechanics*).

  **00:10 – 00:25 | Round 1: The Blind Pair (Dominance)**
  *   **Mechanic:** Standard symmetric dilemma.
  *   **Action:** Distribute Envelopes 1A/1B, etc. Participants read, write Choice (Seal), hand in.
  *   **Reveal:** Open envelopes. Announce results pair by pair. Distribute Tokens.
  *   **Goal:** Establish the "rational" baseline (most will defect/secure).

  **00:25 – 00:35 | Round 2: The Common Anthology (Group Variant)**
  *   **Action:** Participants remain seated. Distribute a Red Card (Take) and Blue Card (Leave).
  *   **Script:** "The bottle on the table is for everyone. If every person in this room plays Blue, everyone gets 2 Tokens, and the bottle is opened. If *anyone* plays Red, the Red players get 3 Tokens, Blue players get 0, and the bottle remains sealed."
  *   **Play:** 2 minutes to decide. Cards held to chest. Reveal on count of three.
  *   **Goal:** Demonstrate the fragility of group trust. (Likely outcome: Bottle remains sealed).
  *   **Note:** Keep this fast. It is a pressure valve.

  **00:35 – 01:00 | Round 3: The Mirror Draft (Counterpart)**
  *   **Action:** Distribute the *second* set of Briefing Envelopes (pre-verified identical pairs).
  *   **Script:** "This round is different. You are not paired with the person at your table. You are paired with a **Counterpart**. Your Counterpart received this exact briefing, at this exact time, in this exact room. You do not know who they are. You know they are you, for the purposes of this text."
  *   **Step 1 (Advice):** "Write one sentence of advice to your Counterpart on the small card. Seal it. Hand it to me." (5 mins)
  *   **Step 2 (The Mirror):** You select 3-4 Advice cards at random and read them aloud. Anonymously. (5 mins)
  *   **Step 3 (Choice):** "Now make your Choice. Seal it. Hand it to me." (5 mins)
  *   **Step 4 (Verification):** "Before I score this, open your Briefing Envelope. Compare it with your table partner's. Confirm they are identical." (5 mins)
  *   **Scoring:** Reveal results. (5 mins)

  **01:00 – 01:30 | The Debrief (Mapping)**
  *   **Action:** Move chairs to a circle (or stay seated if tight).
  *   **Script:** No jargon yet. Ask about the *feeling* of the rounds. Then map the theory. (See *Debrief* below).

  ## IV. Mechanics & Payoff Tables

  **Round 1 & 3 Payoffs (Written on Board):**
  *   **Both "Open" (Cooperate):** Each gets 3 Tokens.
  *   **Both "Secure" (Defect):** Each gets 1 Token.
  *   **One "Secure", One "Open":** Securer gets 4 Tokens. Opener gets 0 Tokens.

  **Round 2 Payoffs (Group):**
  *   **All Blue:** 2 Tokens each + Bottle Unlocked.
  *   **Any Red:** Reds get 3 Tokens. Blues get 0. Bottle Locked.

  **The Vocabulary (Novelist Dressing):**
  *   **Defect/Secure:** "Closing the Ending." (Taking the sure thing).
  *   **Cooperate/Open:** "Leaving it Open." (Trusting the other hand).
  *   **Counterpart:** "The Ghost Writer."
  *   **Advice:** "Marginalia."

  ## V. Critique & Correction of Your Proposed Mechanics

  **1. The Advice Device:**
  *   *Your Worry:* Does it corrupt the round?
  *   *My Verdict:* **Keep it.** It does not corrupt; it *externalizes*. In standard game theory, the correlation is abstract. In fiction, it must be voiced. Writing the advice forces the participant to commit to a principle ("Trust him" or "Save yourself") before they commit to an action. When they read the advice aloud, it creates **Common Knowledge**. It makes the "Superrational" argument visceral. If they write "Trust him" and then "Secure," they feel the hypocrisy. That dissonance is the lesson.
  *   *Sequencing:* Write Advice -> Seal -> Read Sample Aloud -> Make Choice. This ensures the advice primes the room without revealing specific pairings.

  **2. The Group Variant Placement:**
  *   *Placement:* I have placed it **between** the two pair rounds.
  *   *Why:* Round 1 establishes individual rationality (Defect). Round 2 shows that scaling this rationality to a group destroys value (The Bottle stays locked). This creates a *hunger* for a solution. Round 3 offers the Counterpart logic as that solution.
  *   *Conflict:* You asked what group size does. In a pair, "We are identical" is plausible. In a group of 18, "We are identical" is statistically unlikely. The Group Variant is designed to *fail* (or likely fail) to prove that standard reasoning works in crowds but fails in mirrors. It pulls against the pair case to highlight the特殊性 (specialness) of the dyad.

  **3. Verification (The "Rigged" Fear):**
  *   *Risk:* Participants suspect the Counterpart is a plant or the briefings differ.
  *   *Fix:* The **Post-Game Verification** (Step 4 in Round 3). They compare briefings with their table partner *after* choices are sealed but *before* payoffs are announced. If 1A and 1B match, the symmetry is proven.
  *   *Trust:* You must swear on the "Literary Honor" that the pairing is random but the text is identical. If you lie here, the workshop collapses.

  ## VI. Failure Analysis: What Will Go Wrong

  **1. The Cynic's Trap:**
  *   *Failure:* A participant argues, "My choice doesn't *cause* theirs. It's just a correlation. I should still Secure."
  *   *Mitigation:* This is not a failure; it is the **target**. This is the Causal Decision Theory objection. Do not shut it down. Save it for the debrief.
  *   *Prevention:* Ensure the "Counterpart" framing is mystical but precise. "For the purpose of this text, you are the same engine."

  **2. The Payoff Skeptic:**
  *   *Failure:* "You won't actually give the hour."
  *   *Mitigation:* Put your calendar on the table. Show the slots. Make the scarcity real.

  **3. The "Nice" Defection:**
  *   *Failure:* Participants cooperate out of politeness, not reasoning.
  *   *Signal:* Listen to the Advice. If the Advice says "Look out for yourself" and the Choice is "Open," that is politeness. If Advice says "Trust" and Choice is "Secure," that is the conflict you want.

  **4. Time Creep:**
  *   *Failure:* Round 2 (Group) drags on.
  *   *Mitigation:* Be ruthless. "Cards up in 30 seconds." If it runs long, cut the discussion of Round 2, not Round 3.

  ## VII. Behavioral Signals: Evidence vs. Noise

  **Evidence the Activity Landed:**
  *   **Hesitation:** In Round 3, participants pause longer than in Round 1.
  *   **The Advice/Choice Mismatch:** You collect the cards. If you see a stack of Advice cards saying "Leave it Open" and a stack of Choice cards saying "Secure," the tension is real.
  *   **The Verification:** When they compare briefings, there is a sharp intake of breath or a nod. That is the moment they believe the symmetry.

  **Noise/Politeness:**
  *   **Smiling/Nodding:** During the instructions. Ignore this.
  *   **"We decided to...":** If they speak during the game. (Stop it immediately).
  *   **Laughter:** Nervous laughter during the Advice reading is good. Laughter during the payoff is defensive.

  ## VIII. The Debrief: Mapping Moments to Ideas

  **Order of Operations (30 Minutes):**

  1.  **The Advice (10 mins):**
      *   *Ask:* "What did it feel like to write to someone you couldn't influence?"
      *   *Map:* This is the **Algorithm of Self**. You were forced to reason from the outside.
      *   *Moment:* When I read the advice aloud.
      *   *Map:* **Common Knowledge**. You knew they knew what advice was being given.

  2.  **The Verification (5 mins):**
      *   *Ask:* "When you saw the briefings matched, did your choice feel different?"
      *   *Map:* **Symmetry**. The realization that the other event is not independent.

  3.  **The Conflict (10 mins):**
      *   *Ask:* "Who Secured? Why?" (Let them speak). "Who Opened? Why?"
      *   *Map:* **Causal vs. Evidential**.
      *   *Say:* "The standard argument says: Her choice is fixed. I cannot change it. I take the advantage."
      *   *Say:* "The rival argument says: We are the same engine. If I turn left, she turns left. The only available worlds are (Open, Open) and (Secure, Secure). (Open, Open) pays better."
      *   *Constraint:* Do not use the words "Game Theory" or "Superrationality" until this exact moment.

  4.  **The Dissent (5 mins):**
      *   *Ask:* "Who thinks the second argument is nonsense?"
      *   *Map:* **The Cost of Refusal**.

  ## IX. The Space for Dissent (Where the Character Might Be Wrong)

  **The Objection:**
  An intelligent participant will say: *"My choice doesn't reach across the room and move her hand. Correlation isn't causation. If I Open, and she Secures, I'm a fool. I can't control her."*

  **The Cost of Refusal:**
  If they refuse the Counterpart logic, they must accept **Ontological Loneliness**. They are admitting that no matter how identical two people are, they are causally severed. In a novel, this means characters can never truly understand each other, only mimic.
  *   *For your Draft:* This is where your "Visitor" character might be a fanatic. They believe in the magic of the link. The participants represent the cold, hard reality of causality.
  *   *The Trap:* If the Visitor is *right*, the novel is mystical. If the Visitor is *wrong*, the novel is tragic.
  *   *Instruction:* In the debrief, do not resolve this. Say: *"In this room, for these tokens, the math holds. In the world, for your careers, you must decide if you believe the link is real."*

  ## X. Contingency: If the Group Round Succeeds

  If, miraculously, everyone plays Blue in Round 2:
  *   **Action:** Open the bottle immediately. Pour small shots.
  *   **Debrief Adjustment:** Acknowledge that trust *can* happen, but ask: "Was it rational, or was it hope?" This strengthens the Round 3 distinction (Reason vs. Hope).

  ## XI. Summary of Constraints Checklist

  *   **No Jargon:** Checked. (Used "Open/Secure", "Counterpart", "Algorithm").
  *   **Playable:** Yes, physical cards and envelopes.
  *   **Stakes:** Real time and objects, scarce.
  *   **Verification:** Post-game briefing comparison.
  *   **Advice Mechanic:** Placed before Choice to create dissonance.
  *   **Group Variant:** Placed middle to show fragility of trust.
  *   **Dissent:** Built into the final 5 minutes.

  This structure gives you the "playable scene" for your novel (the mechanics are robust enough to be described in detail) and the "genuine workshop" for your students (the philosophical payoff is earned, not lectured). The tension between the Advice (what we say we are) and the Choice (what we do) is the dramatic core.
