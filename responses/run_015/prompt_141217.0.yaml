prompt: |-
  I am part of a small reading group — mostly graduate students in philosophy and a couple of people from an effective-altruism adjacent policy shop — that has been working slowly through the literature on tiny probabilities of astronomically large stakes. Last week we reached the case where a stranger approaches you and offers to create or spare some colossal quantity of worthwhile simulated lives — say 10 to the power of 30, or a number you would have to write as a tower of exponents — in exchange for five dollars, on pain of being ignored entirely if you decline. One member, who had been growing impatient with the whole literature, said something like: "Look, extraordinary claims require extraordinary evidence. The mugger's story is about as extraordinary as a claim gets, so we are entitled to set it aside," and then treated the topic as closed. I want to reopen it, because I don't think the slogan is doing a single determinate piece of work there. Among the things it might mean: a purely Bayesian truism (improbable hypotheses need proportionally larger likelihood ratios to reach the same posterior, which is just the odds form of Bayes' theorem); a norm about testimony or burden of proof rather than about credence; a requirement that evidence strength scale with the *stakes* or *leverage* of the claim rather than with its prior improbability; a complexity or specificity constraint on priors (a claim that specifies an enormous number is one of astronomically many competing claims, so it inherits a description-length penalty); a norm against *acting* on low-probability, high-magnitude considerations; or, as a related nineteenth-century formulation attributed to Laplace puts it, the thesis that "the weight of evidence for an extraordinary claim must be proportioned to its strangeness." These differ enormously, and one thing I want explained rather than assumed is that paying five dollars does not require *believing* the mugger — an expected-value argument can go through at a credence of one in a trillion trillion — so I'd like to know which readings, if any, actually deliver the dismissal my group member wanted, as opposed to merely capping credence at a level that is still decision-relevant.

  To force the issue, I've been playing with two variants that I think separate the readings. In the first — call it the *humdrum mugging* — nothing remotely miraculous happens: a disgruntled data-centre technician tells you he is about to pull the power on a rack, and that the rack is running a simulation containing 10 to the power of 30 morally significant beings; the only extraordinary element is the number, since pulling a plug and running a simulation violate no known regularity whatsoever. In the second — the *scaling mugging* — the mugger supplies evidence that is extraordinary by any everyday standard: he lets you inspect, interrogate and repeatedly verify a working simulation of a million clearly sentient beings, then explains that this is a demo of a far larger system whose continued existence depends on your five dollars. Intuitively that demonstration carries an enormous Bayes factor in favour of his having *some* such capacity, yet it is nowhere near enough to make the 10-to-the-30 claim more likely than not. So the question is whether "extraordinary" is indexed to weirdness, to prior improbability, to the specificity of the claim, or to the size of the stakes it invokes, and how the required quantity of evidence is supposed to be measured — as a likelihood ratio, as a total body of testimony, as a threshold of posterior probability, or as something that has to grow with the magnitude of the claimed effect. As a final check on generality, note that another member used the very same slogan a week later to dismiss a long-term risk estimate that involved no single extraordinary event at all, only the aggregation of many ordinary mechanisms.

  What I'd like is a disambiguation I can bring back to the group: a numbered menu of the distinct precise theses the slogan could be expressing, each stated tightly enough that we could see whether it is true, false, or merely a restatement of something we already accept, and each labelled as trivial, substantive-but-defensible, contentious, or confused. For every reading, please say what "extraordinary" and "evidence" would have to denote for it to hold, whether it is a claim about belief, about assertion and burden of proof, or about action, and — this is the part I care most about — whether it actually licenses setting the original mugging aside, how it handles the humdrum and scaling variants, and whether it would equally license dismissing the mundane long-term risk estimate. If some readings collapse into each other, or if the only reading that does the real work is not really about evidence at all but about a constraint on how fast priors may decay with the size of a claimed effect, say so explicitly, and tell me which reading my group member was most plausibly reaching for and whether that reading survives scrutiny.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A reading group (philosophy grad students + EA policy folks) discussing "tiny probabilities of astronomically large stakes" (Pascal's Mugging territory).
      *   **Trigger:** One member dismissed the discussion using the slogan "Extraordinary claims require extraordinary evidence" (ECREE).
      *   **User's Goal:** Reopen the discussion by showing the slogan is ambiguous. They want a disambiguation of the distinct precise theses the slogan could express.
      *   **Specific Requirements:**
          *   Numbered menu of distinct precise theses.
          *   Each thesis must be stated tightly (true/false/restatement).
          *   Each thesis labeled (trivial, substantive-but-defensible, contentious, confused).
          *   For each thesis: Define "extraordinary" and "evidence," specify domain (belief/assertion/action), assess if it licenses dismissing the mugging, handle the *humdrum* and *scaling* variants, and assess applicability to the mundane long-term risk estimate.
          *   Identify if readings collapse or if the real work is done by prior constraints.
          *   Identify what the group member was likely reaching for and if it survives scrutiny.

  2.  **Deconstruct the Slogan (ECREE):**
      *   *Origin:* Hume (miracles), Sagan (popularized), Laplace (weight of evidence).
      *   *Core Intuition:* Don't believe weird stuff without good proof.
      *   *Problem in this context:* Pascal's Mugging exploits the gap between low probability and high utility. ECREE is often used to block the *probability* assignment, but does it block the *expected value* calculation?
      *   *User's Variants:*
          *   *Standard Mugging:* Magic stranger, $5 for $10^{30}$ lives.
          *   *Humdrum Mugging:* Tech worker, plug pull, $10^{30}$ sims (physically possible but unlikely scale).
          *   *Scaling Mugging:* Demo of $10^6$ sims, claim of $10^{30}$.
          *   *Long-term Risk:* Aggregation of ordinary mechanisms (no single extraordinary event).

  3.  **Brainstorming Distinct Theses (The "Menu"):**

      *   *Idea 1: Bayesian Truism.* Low prior needs high likelihood ratio to get high posterior. (Trivial).
      *   *Idea 2: Prior Penalty for Specificity/Complexity.* Claims with large numbers have lower priors due to description length. (Substantive).
      *   *Idea 3: Evidence Scales with Stakes.* The higher the stakes, the higher the posterior probability required to act. (Action-guiding).
      *   *Idea 4: Testimonial Burden.* You can't assert this without specific kinds of proof. (Epistemic Norm).
      *   *Idea 5: Cognitive/Computational Bound.* We aren't built to process these numbers; ignore them heuristically. (Pragmatic).
      *   *Idea 6: The "Laplace" Reading.* Evidence weight must match "strangeness" (violation of laws). (Humean).

  4.  **Developing the Theses (Drafting & Refining):**

      *   *Thesis 1: The Bayesian Tautology.*
          *   Def: Low Prior + High Posterior -> High Likelihood Ratio.
          *   Label: Trivial.
          *   Dismissal? No. Doesn't cap credence, just says you need strong evidence to *believe* it. Doesn't stop EV calculation if credence > 0.
          *   Variants: Applies to all equally (prior is low in all).
          *   Long-term risk: Applies, but priors might not be "extraordinary" in the same way.

      *   *Thesis 2: The Complexity Prior (Solomonoff/Description Length).*
          *   Def: "Extraordinary" = Complex/Specific. P(H) decays with bit-length of specifying the number $10^{30}$.
          *   Label: Substantive-but-defensible (in formal epistemology).
          *   Dismissal? Maybe. If prior decays faster than utility grows, EV converges.
          *   Variants: *Humdrum* has lower complexity (no magic), so prior is higher. *Scaling* provides evidence, but does it overcome the complexity penalty of the specific number?
          *   Long-term risk: Aggregation of ordinary mechanisms has lower complexity than "Magic Mugger." So this distinguishes them.

      *   *Thesis 3: The Action Threshold (Pragmatic Encroachment).*
          *   Def: "Extraordinary" = High Stakes. "Evidence" = Posterior Probability. To act, P(H) must exceed threshold $T$, where $T$ rises with Stake $S$.
          *   Label: Contentious (Pragmatic Encroachment).
          *   Dismissal? Yes, if $T$ grows faster than $P$ can reasonably be raised.
          *   Variants: *Humdrum* still has high stakes, so threshold is high. *Scaling* raises $P$, but maybe not enough for the threshold.
          *   Long-term risk: High stakes there too. Would dismiss long-term risks unless evidence is overwhelming.

      *   *Thesis 4: The Humean/Laplacean "Strangeness" Constraint.*
          *   Def: "Extraordinary" = Violation of Natural Law. "Evidence" = Testimony/Observation.
          *   Label: Confused/Outdated (in this context).
          *   Dismissal? Works on Magic Mugging. Fails on *Humdrum* (no law violation).
          *   Long-term risk: Fails (no law violation).
          *   *Crucial Point:* This is likely what the member *said*, but not what they *need* for the Humdrum case.

      *   *Thesis 5: The Epistemic Hygiene/Heuristic.*
          *   Def: "Extraordinary" = Outside Reference Class of Reliable Experience. "Evidence" = Vindication by Peer Consensus/Standard Methods.
          *   Label: Substantive-but-defensible (as a heuristic).
          *   Dismissal? Yes, as a rule of thumb to avoid noise.
          *   Variants: *Humdrum* might pass better than Magic. *Scaling* helps.
          *   Long-term risk: Might dismiss if models are speculative.

  5.  **Addressing the User's Specific Questions:**
      *   *Collapse:* Thesis 1 is math. Thesis 2 is the real engine for blocking Mugging (prior decay). Thesis 3 blocks action even if belief is allowed.
      *   *Member's Intent:* Likely Thesis 4 (Humean) verbally, but relying on intuition from Thesis 2 or 5 to do the work.
      *   *Scrutiny:* Thesis 4 fails the *Humdrum* test. Thesis 2 is the robust philosophical defense (Pascal's Mugging is usually solved by prior penalties on complexity/stakes).

  6.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the sophistication of the prompt.
      *   The Menu (Numbered 1-5).
      *   Structure per item: Name, Definition of Terms, Domain, Status, Dismissal Power, Variant Handling, Long-term Risk Application.
      *   Synthesis/Analysis: Which one does the work? What was the member actually doing?
      *   Conclusion: Recommendation for the group.

  7.  **Self-Correction/Nuance Check during Drafting:**
      *   *Check:* Did I distinguish between *belief* and *action* clearly? Yes, Thesis 1 & 2 are about credence, Thesis 3 is about action.
      *   *Check:* Did I handle the *Humdrum* case? This is the killer for the Humean view. I need to emphasize that.
      *   *Check:* Did I handle the *Scaling* case? This tests the Likelihood Ratio vs. Prior view.
      *   *Check:* Long-term risk. This tests whether the slogan is about "weirdness" or "stakes." If it's about stakes, it kills x-risk work. If it's about weirdness, it saves x-risk work.
      *   *Refinement on Thesis 2:* Make sure to mention that specifying $10^{30}$ takes more bits than $10^6$. This is the "Complexity Penalty."
      *   *Refinement on Thesis 3:* This is essentially "Risk-Averse Decision Theory" or "Threshold Deontology" disguised as epistemology.

  8.  **Final Polish:** Ensure tone is appropriate for a philosophy reading group (precise, technical but accessible, respectful of the literature). (e.g., referencing Hume, Laplace, Solomonoff, Weisberg).

      *(Self-Correction on "Confused" label)*: Calling a thesis "confused" might be too strong. Let's use "Limited Scope" or "Category Error" for the Humean one in this context. Actually, "Confused" is okay if it conflates law-violation with improbability. Let's stick with "Contentious" or "Limited." I will use "Limited/Context-Dependent."

      *(Wait, one more thing)*: The user asked about the "nineteenth-century formulation attributed to Laplace." I should explicitly link Thesis 4 to that.

      *(Final check on the Member's likely intent)*: The member said "set it aside." This implies an action-guiding norm or a heuristic, not just a Bayesian update. They probably meant "Don't even calculate the EV." That points to Thesis 3 (Action Threshold) or Thesis 5 (Heuristic). But they justified it with ECREE (Thesis 1 or 4). There is a mismatch between justification and conclusion.

