answer: |-
  **Final Examination: Comparative Political Legitimacy**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. Your response should prioritize conceptual rigor over empirical description. Do not use citations or refer to specific texts.

  **Essay Question:**

  Political regimes often justify authoritarian governance through performance legitimacy, claiming that the delivery of sustained prosperity and social order outweighs the need for democratic input. However, this justification presupposes that citizens can verify the claimed performance. Consider the concept of **epistemic subsidy**: the condition wherein a regime's claim to legitimate authority depends not only on delivering welfare and stability but on monopolizing the informational infrastructure through which citizens verify that delivery.

  Write an essay evaluating whether the reliance on epistemic subsidy introduces a reflexive contradiction into the prosperity-order justification. Specifically, compare how the People's Republic of China and the Republic of Singapore instantiate epistemic subsidy differently. Argue whether either case can sustain a non-circular, performance-based claim to legitimacy if the verification condition is controlled by the authority being verified. In your analysis, engage with the counter-argument that performance success may eventually generate constitutional constraints without democratic input.

  ***

  **Model Answer**

  The claim that authoritarian governance is justified by performance relies on a specific logical structure: legitimacy is derived from output rather than input. In standard political philosophy, input legitimacy arises from the procedures of will-formation (e.g., voting, participation), while output legitimacy arises from the effectiveness of problem-solving (e.g., growth, security). The performance justification argues that high-quality outputs can compensate for deficient inputs. However, this argument collapses if the measurement of those outputs is endogenous to the regime. This is the problem of epistemic subsidy. When a regime monopolizes the informational infrastructure required to verify its success, it creates a reflexive contradiction: the condition required to validate the legitimacy claim (independent verification) is undermined by the means used to sustain the claim (information control).

  To evaluate this, we must distinguish between the degrees of epistemic subsidy in Singapore and China. Both regimes prioritize stability and growth, but their informational architectures differ significantly. Singapore maintains high transparency regarding economic metrics, legal rulings, and bureaucratic performance. While political dissent is constrained, the data required to verify prosperity is largely accessible to independent auditors, markets, and citizens. Here, the epistemic subsidy is low. The regime invites verification because its performance claims withstand scrutiny. Consequently, Singapore's performance legitimacy is less circular; the verification condition is met externally, even if the input condition is not.

  In contrast, China's apparatus involves a high epistemic subsidy. The state not only delivers goods but actively shapes the metrics of success and restricts access to contradictory data regarding social unrest, economic slowdowns, or policy failures. By controlling the informational infrastructure, the regime prevents the falsification of its performance claims. This introduces a severe reflexive contradiction. If legitimacy rests on the fact of prosperity, but the fact of prosperity cannot be distinguished from the propaganda of prosperity due to information monopolization, the justification becomes tautological. The regime is legitimate because it says it is successful, and it controls the language that defines success. This renders the performance claim non-falsifiable and thus philosophically empty as a justification for authority.

  However, a sophisticated defense of performance legitimacy might invoke the gradualist thesis. This counter-argument suggests that even without democratic input, sustained performance success creates social conditions (a middle class, rule of law, complex civil society) that eventually force constitutional constraints on the executive. Under this view, the epistemic subsidy is temporary. The regime controls information initially to ensure stability during development, but the material success achieved generates internal pressures that eventually liberalize the verification infrastructure itself.

  Yet, this counter-argument fails to resolve the immediate reflexive contradiction. The gradualist thesis relies on the assumption that performance is actually occurring during the authoritarian phase. If the epistemic subsidy is too high, as in the Chinese case, there is no mechanism to correct policy errors based on feedback. Without independent verification, "performance" becomes a moving target defined by the regime to suit its survival rather than citizen welfare. Therefore, the gradualist path depends on a level of transparency that high epistemic subsidy precludes. Singapore fits the gradualist model better because its lower subsidy allows for error correction, but China's high subsidy risks decoupling regime survival from actual performance.

  Ultimately, performance legitimacy cannot be non-circular if it relies on epistemic subsidy. Legitimacy requires a distinction between the claimant and the validator. When the regime monopolizes the validation mechanism, it conflates power with truth. Singapore avoids the worst of this contradiction by allowing independent verification of outputs, thereby sustaining a stronger, albeit non-democratic, performance claim. China, by conflating information control with governance success, undermines the logical foundation of its own justification. Therefore, without independent verification, performance legitimacy devolves into mere assertion, failing to provide a normative basis for authority distinct from coercion.

  ***

  **Marking Scheme (Total: 30 Points)**

  | Criterion | Specific Move Required | Points | Typical Failure Mode (Costing Marks) |
  | :--- | :--- | :--- | :--- |
  | **1. Conceptual Framework** | Define performance legitimacy via the **output/input distinction** and accurately define **epistemic subsidy** as monopolizing verification infrastructure. | 5 | Describes legitimacy as "popularity" or defines subsidy merely as "censorship" without linking to verification. |
  | **2. Reflexivity Analysis** | Identify the **reflexive contradiction**: that controlling metrics undermines the validity of the performance claim itself (tautology/non-falsifiability). | 10 | Describes information control as unethical or oppressive but fails to explain how it logically invalidates the legitimacy *argument*. |
  | **3. Comparative Application** | Differentiate **Singapore (low subsidy/high transparency)** vs. **China (high subsidy/control)** and apply the reflexivity logic to both cases distinctively. | 8 | Treats both regimes as identical "authoritarian states" or relies on empirical history without applying the epistemic framework. |
  | **4. Counter-Argument Engagement** | Engage the **gradualist thesis** (performance generates constraints) and explain why epistemic subsidy threatens this mechanism (feedback loops). | 5 | Mentions democratization trends but fails to connect them to the informational conditions required for performance correction. |
  | **5. Argumentative Coherence** | Maintain a clear thesis throughout; ensure the conclusion follows from the reflexivity analysis rather than introducing new empirical claims. | 2 | Essay lacks a central argument or concludes with a summary of facts rather than a philosophical judgment. |

  **Grade Boundaries:**
  *   **A (25-30 pts):** Explicitly diagnoses the reflexivity problem; successfully distinguishes Singapore and China via the epistemic framework; dismantles or nuance the gradualist counter-argument using the core concept.
  *   **B (18-24 pts):** Accurately describes both regimes and defines performance legitimacy; identifies information control as a problem but misses the specific *logical contradiction* regarding verification; counter-argument is descriptive rather than analytical.
  *   **C (15-17 pts):** Focuses heavily on empirical history or "Asian Values"; fails to utilize the concept of epistemic subsidy; treats legitimacy as purely sociological rather than normative.
