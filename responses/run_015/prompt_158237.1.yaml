answer: |-
  You have put your finger on a problem that has troubled philosophers of mind and value theorists for over a century, though rarely with the clinical precision you bring to it. The established name for the general territory you are circling is **the Heterogeneity of Pleasure**. This is the standard label for the observation that pleasures do not share a single, common phenomenological 'glow'. However, the specific way you have carved the problem — the two families of failure, combined with the sustained-versus-completed distinction — is a sharper diagnostic than the standard philosophical discussion usually provides.

  To answer your question directly: there is no single established term that captures your specific configuration of the problem (the narrow/broad split plus the telic distinction) as a unified whole. The components exist separately in the literature, but your synthesis of them is distinct.

  The first family of failures — where phenomenological accounts are too narrow — corresponds to the rejection of **Sensory Hedonism**. This is the view that pleasure is a specific sensation, like a taste or a colour. As you noted, the satisfaction of a crossword or the quiet of a room lacks this sensory character. Wittgenstein argued famously that there is no 'common element' to games, and later philosophers applied this to pleasure: it is a **Family Resemblance** concept rather than a natural kind.

  The second family — where motivational accounts are too broad — corresponds to the failure of simple **Conative** or **Desire Satisfaction** theories. Just because a person is disposed to repeat an action (like checking a locked door) does not mean the action is pleasant. This is often termed the **Problem of Bad Pleasures** or **Misguided Desires**, but your framing of it as a failure of breadth is more precise.

  The distinction you draw between things to be sustained (the bath) and things to be completed (the itch, the chord) is known in philosophy of action as **Telicity**. Activities that are complete in themselves at every moment are *atelic* (sustained); activities that aim at a terminal point are *telic* (completed). The wrinkle you identified — that some telic pleasures would become tortures if sustained — is a recognised complication, but it is rarely linked explicitly to the measurement problem in clinical scales.

  Since no single established term covers this specific intersection of heterogeneity, motivational failure, and telicity in the context of measurement, I propose a coined name that might serve your piece: **The Hedonic Category Error**.

  This term captures the mistake of treating a disjunctive, polymorphic set of experiences (relief, absorption, achievement, sensory gratification) as a single, unitary magnitude that can be linearly scaled. It implies that the 0–10 scale is not measuring a 'thing' called enjoyment, but rather asking patients to perform an impossible act of translation between incommensurable categories.

  Regarding your borderline cases, applying this framework yields the following classifications:

  *   **The grim satisfaction of finishing a hateful task:** This is **In**. It falls under the 'completed' (telic) category and is experienced as a transition or relief ('the difference'), rather than a sensory state. It is a vindication of agency, not a sensory glow.
  *   **The relief of a near miss:** This is **In**. Like the itch or the quiet room, this is a pleasure of cessation or avoidance. It is defined by the removal of a negative expectation. It is a change, not a state.
  *   **The absorption of a good night's sleep:** This is **Out**, or at least borderline. Sleep is typically an absence of consciousness rather than an experience *of* something. If rated highly, it is likely a retrospective judgement of restoration (a 'completed' benefit) rather than a concurrent enjoyment. It lacks the 'what it is like' character entirely.

  What does this imply for your 0–10 scale? It suggests that the scale does not measure **Hedonia** (pleasure as a feeling) but rather **Valenced Change** (the movement from a negative or neutral state to a preferred one). When your patients ranked the items, they were not ranking intensities of a common sensation; they were ranking the significance of various restorations of equilibrium.

  The scale is not invalid, but its label is misleading. It asks for 'enjoyment', but it captures **relief, agency, and restoration**. If you were to rename the axis to reflect the reality you observed — perhaps 'Sense of Well-being' or 'Satisfaction with Life Conditions' — it might reduce the conceptual friction you felt. But if you must keep 'enjoyment', you might conclude that you were not asking patients to measure a height, but to summarise a landscape. They could rank the items, as you said, but only by ignoring the fact that they were comparing apples, orchards, and the relief of hunger.

  In short, you have identified **The Hedonic Category Error**. The failures divide as they do because 'pleasure' is not a noun denoting a single object, but a verb-like marker for a variety of successful transitions. The scale works only because patients are pragmatic; they ignore the category error to give you a number that helps you help them. But your unease was philosophically sound: you were asking them to add up different currencies.
