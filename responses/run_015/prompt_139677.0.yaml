prompt: |-
  I teach an upper-level undergraduate seminar on formal epistemology: 14 students, one 110-minute session, plus a 50-minute session a week later that I can use for follow-up if the design needs it. Everyone has worked with Bayes' theorem and conditionalization, can compute a likelihood ratio for simple hypotheses, and has used a proper scoring rule at least once. I want a runnable in-class activity that makes students feel the problem of old evidence from the inside, rather than having me derive that a known item of evidence blocks the update and then list the standard escapes.

  Design constraints.

  The problem has to arrive through the rules, not through me. Ideally students notice that they have updated on a fact they already had, and that the machinery they were happily using twenty minutes earlier gives them no licence to do so. No up-front lecture, and they should not hear the label for the problem until the debrief.

  The case must be self-contained, with no history of science and no background knowledge: a closed, enumerable hypothesis space they build or inspect themselves (a deck with a hidden dealing rule, a jar of differently weighted dice, a protocol with one concealed constraint), so that every likelihood they need is one they can compute or estimate on the spot rather than take on trust.

  There should be real but small stakes via a scoring rule, and a trading mechanic on top of it: students can buy and sell credence in hypotheses with each other, so that the market price makes visible a confirmation that their own betting slips deny. My hope is that the gap between the two — the price moves, the personal posterior supposedly does not — is where the problem becomes something they are inside of rather than something they are told about. Keep the payoff scheme computable in the head; I do not want arithmetic to eat the session.

  The mechanic I care most about takes their priors away. In the first round they bet on hypotheses before seeing the data, on slips that I collect and do not return — or return shuffled, so that nobody can pair a prior with a posterior. The situation I actually want them in is not the textbook one of not yet knowing E, but the one of knowing E while having lost the ability to reconstruct what they thought before E. That, I suspect, is the ordinary scientific case, and it is worse than the textbook case: conditionalization is not merely silent here, it is unusable, because the quantity the formalism needs no longer exists for the agent. Call this prior amnesia. Build the mechanic so that they try to do the Bayesian comparison and find that they cannot, while still having confident, fine-grained judgments about which theory the old evidence favours. If you think prior amnesia is a confusion or a red herring, say so plainly and propose something better rather than accommodating it.

  I also want a distinction I have been using put under pressure. Call evidence *stale* when the agent knew the fact and already knew it bore on the hypothesis class before the theory was articulated; call it *dormant* when the agent knew the fact all along but only saw its bearing on the theory once the theory was stated. My claim is that the intuition of confirmation is strongest and most insistent in the dormant case, and that this is exactly the case where the Bayesian has least to say, because what really moves the agent is the newly noticed entailment rather than the fact itself. Stage both cases in that order — stale first, dormant second — and then tell me whether the distinction is doing real work or whether it collapses under pressure; if it collapses, tell me what distinction to put in its place.

  Deliverable: rules, a materials list, a minute-by-minute timeline, the payoff scheme in a form that fits on one handout, and a debrief that maps specific moments in the session onto specific parts of the argumentative structure — including, for each of the standard escapes (treating the agent as if she did not know E; treating her as learning that the theory entails E; reassigning priors or going counterfactual), which moment is meant to make it attractive and what it costs. Tell me what will predictably go wrong the first time I run this — I expect at least one student to refuse to bet on propositions about entailment, and I expect the market to be dominated by two loud students — how to handle each, and be frank about which feature of the problem the activity cannot reproduce and which I will simply have to state in the debrief.

  Finally: mark which of your design choices are load-bearing, and say what would change your mind about them. In particular, tell me what would convince you that a scoring-rule-and-market setup is the wrong vehicle here at all — that it makes the problem look like a fact about willingness to stake rather than a fact about confirmation — and where you think your own design is most likely not to produce the experience I am asking for. If the prior-amnesia mechanic or the stale/dormant split is the weakest link, say that instead of building around it.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Target Audience:** Upper-level undergrads (14 students), familiar with Bayes, likelihood ratios, scoring rules.
      *   **Topic:** The Problem of Old Evidence (POE).
      *   **Goal:** Make students *feel* the problem from the inside, not just hear a derivation. They should notice the machinery fails them.
      *   **Constraints:**
          *   No up-front lecture on POE.
          *   Self-contained case (no history of science).
          *   Enumerable hypothesis space (deck, dice, protocol).
          *   Real but small stakes (scoring rule + trading market).
          *   **Key Mechanic:** "Prior Amnesia" (students lose access to their priors to simulate the state of knowing $E$ but not having a pre-$E$ credence to conditionalize on).
          *   **Key Distinction:** "Stale" vs. "Dormant" evidence. Test if this distinction holds up.
          *   **Deliverables:** Rules, materials, timeline, payoff scheme, debrief map, troubleshooting, load-bearing analysis.
      *   **Critical Feedback:** I need to be honest about whether "Prior Amnesia" and "Stale/Dormant" are good ideas or red herrings.

  2.  **Evaluate the Core Concepts:**

      *   **The Problem of Old Evidence (POE):** Standard Bayesianism says $P(E|E) = 1$, so $P(H|E) = P(H)$. If $E$ is already known ($P(E)=1$), it cannot confirm $H$. But intuitively, old evidence *does* confirm new theories (e.g., Mercury's perihelion confirming GR).
      *   **Prior Amnesia:** The user wants to simulate the state where the agent knows $E$ but cannot reconstruct $P(H)$ before knowing $E$.
          *   *Critique:* This is actually a *different* problem than the standard POE. Standard POE assumes $P(E)=1$ at the time of theory formulation. "Prior Amnesia" simulates the *loss of memory* of one's prior state. While pragmatically similar (you can't calculate the ratio), philosophically it's distinct. The standard POE isn't about forgetting; it's about the logical impossibility of updating on a certainty. However, for an *in-class experience*, "Prior Amnesia" is a brilliant pedagogical proxy. It forces them into the position of "I know $E$, I know $H$ entails $E$, but I can't run the math."
          *   *Decision:* I will use the mechanic but clarify in the debrief that it's a *proxy* for the logical problem, not the problem itself. It simulates the *phenomenology* of the problem.
      *   **Stale vs. Dormant:**
          *   *Stale:* Knew $E$, knew it was relevant, had a theory, updated. (Standard Bayesian updating).
          *   *Dormant:* Knew $E$, didn't know it was relevant to *this specific* $H$ until $H$ was proposed. (The core of POE).
          *   *Critique:* This distinction is crucial. In the "Stale" case, standard conditionalization works fine. In the "Dormant" case, the entailment relation is the new information, not $E$ itself. This maps well to the "Entailment Solution" (Garber-style) vs. the "Counterfactual Solution."
          *   *Decision:* This distinction is load-bearing and philosophically sound. I will structure the activity to highlight the difference in *intuition* vs. *formalism*.

  3.  **Design the Activity:**

      *   **Scenario:** Needs to be abstract but concrete. A "Machine" that generates numbers based on hidden rules.
      *   **Hypotheses:** Simple arithmetic rules (e.g., "Outputs even numbers," "Outputs multiples of 3").
      *   **Evidence:** A specific number generated (e.g., "12").
      *   **Structure:**
          *   *Round 1 (Stale):* Students know the evidence *could* happen. They set priors. Evidence is revealed. They update. (Works fine).
          *   *Round 2 (Dormant/Amnesia):* Evidence is revealed *before* hypotheses are fully articulated/selected. Or, the connection between $H$ and $E$ is the new info.
      *   **Refining the "Amnesia" Mechanic:** To make them feel the lack of priors, I need to collect their initial credences, shuffle them, and hand them back randomly *after* the evidence is "old." No, that's too chaotic. Better: In Round 2, the Evidence is given *first*. Then the Hypotheses are introduced. They must assign posteriors without having assigned priors *in the context of the game*.
      *   **Market Mechanic:** Students trade "shares" in hypotheses. Price = Credence. If the market price moves on old evidence, but their individual calculation says "no update," tension arises.

  4.  **Developing the "Prior Amnesia" Mechanic (Crucial Step):**

      *   *Idea:* In Round 1, they bet on Hypotheses *before* seeing the Output.
      *   *Idea:* In Round 2, they are told the Output *first*. Then they are given Hypotheses. They are asked to price the Hypotheses.
      *   *The Trap:* They *want* to say "Hypothesis A is likely because it predicts the Output." But formally, $P(Output) = 1$. So $P(H|Output) = P(H)$. But they never set $P(H)$ *before* knowing the Output. They have no baseline.
      *   *The Market:* If the market prices shift based on the "fit," but their scoring rule sheet says "No update allowed," they feel the friction.
      *   *Correction:* To make the scoring rule bite, they need to be scored on accuracy. If they price based on "fit" (intuition) but the rule says "don't update," they might lose points? No, the scoring rule rewards accuracy. If $H$ is true, they want high credence. The conflict is between *normative rule* (Bayes says no update) and *pragmatic success* (Intuition says update).
      *   *Better approach:* The "Amnesia" is that I collect their Round 1 priors. In Round 2, I tell them "Use your Round 1 priors as your baseline." But I shuffle the papers so they don't know which prior belongs to which hypothesis. They know they *had* priors, but they can't access the specific $P(H)$ needed for the ratio. They have to guess their own past self's credence. This creates the "unusable formalism" feeling.

      *   *Wait, simpler is better:* The prompt asks for "Prior Amnesia" where the quantity no longer exists.
      *   *Design:*
          *   **Phase 1 (Stale):** Hypotheses defined. Priors set. Evidence revealed. Update. (Everything works).
          *   **Phase 2 (Dormant):** Evidence revealed (e.g., "The number is 12"). *Then* Hypotheses defined (e.g., "Rule A: Multiples of 4", "Rule B: Multiples of 6").
          *   **Task:** Assign credences.
          *   **Constraint:** You are told "You must Bayesian Update."
          *   **Problem:** You can't. $P(E)=1$. You never had a $P(H)$ before $E$ was fixed.
          *   **Market:** They trade. Prices will move (reflecting intuition).
          *   **Scoring:** They are scored on the final truth.
          *   **Tension:** The market says "Update!" The math says "Stay put!"

  5.  **Addressing the "Stale vs. Dormant" Distinction:**

      *   *Stale:* "I suspect the machine likes evens. It prints 12. I update."
      *   *Dormant:* "The machine printed 12. Oh, look, Theory X says it prints multiples of 12."
      *   *Does it collapse?* It shouldn't. The distinction tracks whether the *relevance* was known. In Dormant, the new info is $P(H \to E) = 1$, not $E$.
      *   *Activity Implementation:*
          *   Round 1: Hypotheses on board. Evidence drawn. (Stale).
          *   Round 2: Evidence drawn. Hypotheses revealed *after*. (Dormant).
      *   *Verdict:* This distinction is robust. I will defend it.

  6.  **Drafting the Plan:**

      *   **Materials:** Decks of cards (or numbered chips), Betting Slips, Play Money (or points), Whiteboard.
      *   **Timeline:** 110 mins.
          *   0-15: Setup & Round 1 (Stale).
          *   15-45: Round 1 Trading & Resolution.
          *   45-60: Round 2 Setup (Dormant + Amnesia).
          *   60-90: Round 2 Trading (The Conflict).
          *   90-110: Debrief.
      *   **Payoff:** Brier Score (simplified). Quadratic scoring rule is too math-heavy for "in the head." Linear scoring rule (Market Maker style) is easier. Let's use a "Market Maker" model: You buy/sell at prices. Final payout is \$1 if True, \$0 if False. Profit = (Value - Price) * Shares. This is intuitive.
      *   **Troubleshooting:**
          *   *Refusal to bet on entailment:* Some students might say "I don't know the logic." -> Provide truth tables or clear definitions.
          *   *Dominant traders:* Use blind bidding or written orders to dampen loud voices.
          *   *Arithmetic:* Keep numbers small (1-20).

  7.  **Refining the "Prior Amnesia" Mechanic for Maximum Impact:**

      *   The prompt specifically wants: "The mechanic I care most about takes their priors away... they try to do the Bayesian comparison and find that they cannot."
      *   *Implementation:* In Round 2, give them the Evidence *first*. Then give them the Hypotheses. Ask them to calculate the Likelihood Ratio.
      *   *The Catch:* To calculate Posterior, they need a Prior. They didn't set one *for these specific hypotheses* before seeing the Evidence (because the hypotheses didn't exist/weren't relevant).
      *   *The "Amnesia":* Tell them: "You are the same agent as Round 1. Use your Round 1 priors." But the Round 1 hypotheses were different. Or, simply, "You cannot assign a prior *ex nihilo* in a Bayesian framework without violating the rigidity of your belief state."
      *   *Actually, the strongest version:* In Round 2, the Evidence is *already on the table* when they walk in (or revealed immediately). The Hypotheses are introduced as "New Theories." They are asked to price them. They *feel* the confirmation. Then they are asked to write down the Bayesian justification. They will write $P(H|E) \propto P(E|H)P(H)$. They will realize $P(E)=1$. They will realize they never had a $P(H)$ before $E$.
      *   *Market:* The market price *will* reflect the confirmation. The formalism *won't*. This is the gap.

  8.  **Addressing the Load-Bearing Constraints:**

      *   *Scoring Rule + Market:* Is this the right vehicle?
          *   *Risk:* It turns epistemology into finance.
          *   *Mitigation:* The debrief must explicitly link the market price to "Rational Credence." If the market moves, rational credence *should* move. If Bayes says it shouldn't, Bayes is in trouble.
          *   *Alternative:* Pure betting without a market? No, the market makes the "consensus rationality" visible against individual confusion.
      *   *Prior Amnesia:* Is it a red herring?
          *   *Risk:* It confuses "forgetting" with "logical certainty."
          *   *Mitigation:* Acknowledge this in the debrief. It's a *simulation* of the structural gap.
      *   *Stale/Dormant:*
          *   *Risk:* Collapses if students treat "New Hypothesis" as "New Evidence."
          *   *Mitigation:* Ensure the Evidence is physically present and known in both rounds. Only the *link* changes.

  9.  **Finalizing the Details:**

      *   **Hypothesis Space:** "The Generator." It picks a number $X$ from 1-20.
      *   **Round 1 (Stale):** Hypotheses: $H_1$ (Even), $H_2$ (Odd). Evidence: 12. (Trivial update).
      *   **Round 2 (Dormant):** Evidence: 12 (Known from start of round). Hypotheses: $T_1$ (Prime + 1), $T_2$ (Square + 3). (Requires noticing the entailment).
      *   **Wait, Round 2 needs to be the POE case.**
      *   *Revised Round 2:* Evidence $E$ is "The number is 12." This is known.
      *   Theory $A$: "The number is a multiple of 4." (Entails $E$? No, $E$ entails $A$? No.)
      *   *Better:* Theory $A$: "The machine only outputs multiples of 4." (If true, 12 is expected).
      *   Theory $B$: "The machine only outputs primes." (If true, 12 is impossible).
      *   *The POE Twist:* Everyone knows the number is 12 *before* hearing Theory A.
      *   *The Amnesia:* They are told "You must use your priors from the start of class." But the start of class didn't have Theory A.
      *   *Okay, let's stick to the prompt's "Prior Amnesia" mechanic:* Collect priors on *generic* features in Round 1. In Round 2, map those to specific theories but scramble the link so they can't retrieve the specific $P(T)$.
      *   *Actually, the cleanest way:* In Round 2, simply *forbid* setting a prior. "The Evidence is fixed. Assign a Credence." They will assign based on fit. Then ask: "What was your Prior?" They can't answer. "So how did you update?" They can't answer.

  10. **Writing the Response:**

      *   Structure: Materials, Payoff, Timeline, Rules, Debrief, Troubleshooting, Critical Analysis.
      *   Tone: Professional, pedagogical, critical (as requested).
      *   Check constraints: 14 students, 110 mins + 50 mins optional. No history of science. Small stakes.

      *(Self-Correction during drafting)*: I need to be careful about the "Stale vs. Dormant" distinction. The prompt asks me to test if it collapses. I should design the activity so it *might* collapse, then report in the debrief section whether it did.
      *   *Stale:* Hypothesis exists. Evidence arrives.
      *   *Dormant:* Evidence exists. Hypothesis arrives.
      *   *Potential Collapse:* Students might treat "Hypothesis arrives" as "New Evidence $E^*$ = 'Theory T exists'". If they do that, the POE dissolves (Garber solution). I need to prevent this or highlight it. I will instruct them *not* to treat the theory's existence as evidence, but to focus on the theory's *content* relative to the old evidence.

      *(Refining the Payoff)*: Quadratic scoring is best for properness, but hard to calculate mentally. Linear market scoring (buy at \$0.40, sell at \$1.00 if true) is easier. Let's use a "Prediction Market" style. You hold cash. You buy certificates. Certificate pays \$10 if Hypothesis is True.
      *   *Constraint:* "Payoff scheme computable in the head." Market style is best.

      *(Refining Prior Amnesia)*: The prompt says: "The mechanic I care most about takes their priors away... collect and do not return — or return shuffled."
      *   *Plan:* Round 1: Students write priors on 3 generic claims (e.g., "Number > 10", "Number is Even", "Number is Divisible by 3"). I collect these.
      *   Round 2: Evidence is revealed (e.g., "12"). Then 2 New Theories are introduced. Theory 1 implies "Divisible by 3". Theory 2 implies "Even".
      *   Task: Update credence in Theory 1 & 2.
      *   Constraint: "You must use your Round 1 priors as your baseline for the implications."
      *   Trap: I hand back the Round 1 slips *shuffled*. They know they *had* a credence for "Divisible by 3", but they don't know *what* they wrote. They cannot compute the ratio. They *must* rely on intuition/market.
      *   *This is perfect.* It implements "Prior Amnesia" literally.

      *(Final Check on Stale/Dormant)*:
      *   Round 1 is Stale (Hypotheses known, then Evidence).
      *   Round 2 is Dormant (Evidence known, then Hypotheses).
      *   This maps perfectly.

      *(Load Bearing Analysis)*: I need to be honest. The "Prior Amnesia" via shuffled slips is a *proxy*. It simulates the *inaccessibility* of the prior, not the *logical impossibility* ($P(E)=1$). I must highlight this in the "Critical Analysis" section.

      *(Timeline)*: 110 minutes is tight for two rounds + market + debrief. I need to be precise.
      *   0-10: Intro & Round 1 Priors.
      *   10-30: Round 1 Evidence & Trading.
      *   30-40: Round 1 Resolution.
      *   40-50: Round 2 Setup (Evidence First).
      *   50-60: Round 2 Priors (The Amnesia Trap).
      *   60-80: Round 2 Trading.
      *   80-110: Debrief.
      *   *Wait, 14 students trading is chaotic.* Use a "Limit Order Book" on the board or small groups? Small groups (3 groups of 4-5) is better for participation, but market price visibility is lower. Let's do one central market with a "Market Maker" (TA or Instructor) to set prices based on orders, or just a clearinghouse.
      *   *Simpler:* "Becker-DeGroot-Marschak" (BDM) mechanism? No, that's individual.
      *   *Best for 14 students:* 2 Markets of 7. Each market sets a price. Compare the two.
      *   *Actually, let's keep it one class market.* Instructor acts as Bank. Students submit buy/sell orders. Instructor clears.

      *(Re-evaluating the "Shuffled Slip" mechanic)*: Is it too gimmicky?
      *   *Pros:* Viscerally feels like "I lost my data."
      *   *Cons:* Might feel like a trick rather than a structural problem.
      *   *Alternative:* Just don't let them write Round 2 priors. "You missed the window."
      *   *Decision:* The shuffled slip is more active. It makes them *search* for the prior and fail. I'll keep it but warn about the "gimmick" risk.

      *(Debrief Mapping)*: Need to map specific moments to standard escapes (Counterfactual, Entailment, etc.).
      *   Moment: "I can't find my slip." -> Counterfactual (What *would* I have believed?).
      *   Moment: "But 12 fits Theory 1!" -> Entailment (Learning $T \to E$).

      *(Troubleshooting)*:
      *   "Refuse to bet on entailment": Provide logical cheat sheets.
      *   "Loud students": Use written orders.
      *   "Market doesn't move": Instructor acts as liquidity provider to nudge.

      *(Critical Analysis)*:
      *   Is Market+Scoring wrong? It risks conflating *price* with *belief*. But for this level, it's a good operationalization.
      *   Is Stale/Dormant robust? Yes, but students might conflate "New Theory" with "New Evidence." I need to block that move in the rules.

      *Let's write it.*
answer: |-
  # Activity Design: The Old Evidence Market

  ## 1. Core Concept & Load-Bearing Analysis

  **The Vehicle:** A prediction market with a "Prior Amnesia" constraint.
  **The Distinction:** Stale (Hypothesis $\to$ Evidence) vs. Dormant (Evidence $\to$ Hypothesis).

  **Critical Assessment of Your Constraints:**
  1.  **Prior Amnesia (Shuffled Slips):** This is the weakest link philosophically, but the strongest pedagogically.
      *   *Risk:* It simulates *memory loss*, not the *logical problem* of $P(E)=1$. A sharp student will note, "I can just reconstruct my prior rationally; I don't need the slip."
      *   *Defense:* It forces the *phenomenology* of the problem. They feel the inability to compute the ratio. In the debrief, you must admit this is a proxy for the logical impossibility of conditionalizing on a certainty.
      *   *Verdict:* Keep it, but flag it in the debrief as a *simulation* of the structural gap.
  2.  **Stale vs. Dormant:** This distinction is load-bearing and robust.
      *   *Risk:* Students may treat "The theory was proposed" as new evidence ($E^*$), solving the POE via the Garber/Entailment solution instantly.
      *   *Defense:* The rules must explicitly forbid betting on "The theory is proposed" and restrict betting to "The theory is *true*."
      *   *Verdict:* This distinction does real work. It separates standard updating from the POE.
  3.  **Market + Scoring Rule:**
      *   *Risk:* Conflates *willingness to bet* with *confirmation*. A student might think, "The price moved because people are greedy, not because the evidence confirms."
      *   *Defense:* The scoring rule ties profit to accuracy. If the price moves, the *collective rational credence* is moving. If Bayes says "no move," the conflict is real.
      *   *Verdict:* Acceptable vehicle, provided the debrief explicitly decouples "market noise" from "rational price adjustment."

  ---

  ## 2. Materials List

  *   **Hypothesis/Evidence Deck:** 20 cards numbered 1–20.
  *   **Betting Slips:** Two colors (White for Round 1, Yellow for Round 2).
  *   **Currency:** Poker chips or printed "Epistemic Credits" (EC). Starting endowment: 100 EC per student.
  *   **Market Board:** Whiteboard with columns for *Hypothesis*, *Current Price*, *Buy Orders*, *Sell Orders*.
  *   **Truth Tables:** Handout listing the logical implications of each hypothesis (to prevent arithmetic errors from masking the epistemic problem).
  *   **The "Amnesia" Box:** A physical box to collect White slips.

  ---

  ## 3. Payoff Scheme (One-Handout Version)

  **Goal:** Maximize Epistemic Credits (EC).
  **Exchange Rate:** 10 EC = $1 (or course credit point).

  **1. Scoring Rule (Individual Accuracy):**
  At the end of the session, the True Hypothesis is revealed.
  *   If you hold a **Certificate** for the True Hypothesis: It pays **10 EC**.
  *   If you hold a **Certificate** for a False Hypothesis: It pays **0 EC**.
  *   **Cash:** Retains face value (1 EC = 1 EC).

  **2. Market Mechanic (Trading):**
  *   Hypotheses trade as "Certificates."
  *   **Price:** Set by the market (0 to 10 EC). Represents collective credence $\times$ 10.
  *   **Buying:** You pay the Price. You receive 1 Certificate.
  *   **Selling:** You surrender 1 Certificate. You receive the Price.
  *   **Shorting:** Not allowed (simplifies arithmetic).
  *   **Constraint:** You cannot spend more cash than you hold. You cannot sell more certificates than you hold.

  **3. The "Amnesia" Rule (Round 2 Only):**
  *   To calculate your Round 2 position, you *must* reference your Round 1 Prior Slip.
  *   If you cannot locate your specific prior credence for the relevant implication, you are **blocked from writing a formal Bayesian justification** on your scorecard (though you may still trade).

  ---

  ## 4. Minute-by-Minute Timeline (110 Minutes)

  ### Phase 1: The Stale Case (Standard Updating)
  **00:00 – 00:10 | Setup & Priors**
  *   Distribute 100 EC and White Slips.
  *   **The Generator:** Explain there is a hidden rule generating a number from 1–20.
  *   **Hypotheses (On Board):**
      *   $H_1$: The number is Even.
      *   $H_2$: The number is Odd.
      *   $H_3$: The number is $> 10$.
  *   **Task:** Write your prior credence ($0.0$ to $1.0$) for each $H$ on the White Slip. Sign it. Put it in the Box.
  *   *Instructor Note:* Collect slips. Do not look at them.

  **00:10 – 00:20 | Evidence & Calculation**
  *   **Draw Evidence:** Draw a card from the deck. Reveal it: **12**.
  *   **Task:** Calculate your posterior credence for $H_1, H_2, H_3$ using Bayes.
  *   **Check:** Students should find $P(H_1|E) = 1$, $P(H_2|E) = 0$, $P(H_3|E) = 1$.
  *   *Observation:* This should feel smooth. The machinery works.

  **00:20 – 00:40 | Market Round 1**
  *   Open trading on $H_1, H_2, H_3$ certificates.
  *   Instructor acts as Market Maker to ensure liquidity if needed.
  *   **Goal:** Align market price with posterior.
  *   **Close:** Freeze prices.

  **00:40 – 00:50 | Resolution 1**
  *   Reveal the "True State" (The card was 12).
  *   Pay out certificates.
  *   **Debrief Point 1:** "The evidence moved the price. Your math licensed the move. Stale evidence works."

  ### Phase 2: The Dormant Case (Prior Amnesia)
  **00:50 – 01:00 | Setup & Amnesia**
  *   Distribute Yellow Slips.
  *   **The Evidence:** Place the card **12** face up on the table *before* introducing hypotheses. "This fact is known. It is fixed."
  *   **New Theories (On Board):**
      *   $T_A$: The Generator outputs Multiples of 4.
      *   $T_B$: The Generator outputs Primes + 1. (e.g., 3, 4, 6, 8, 12...)
      *   $T_C$: The Generator outputs Squares + 3. (e.g., 4, 7, 12, 19...)
  *   **The Trap:** All three theories entail $E$ (12).
  *   **The Amnesia:** Return the White Slips, **shuffled randomly**.
  *   **Instruction:** "To set your credence in $T_A, T_B, T_C$, you must conditionalize on your prior belief in their *implications*. Find your slip. Find your prior for 'Multiple of 4'. Use it."
  *   **The Failure:** Students will hold a slip that says "Even: 0.5" but they need "Multiple of 4". Or they hold "Even: 0.5" but don't know if that slip is *theirs*. They cannot retrieve the specific $P(T)$ required for the ratio.

  **01:00 – 01:30 | Market Round 2**
  *   Open trading on $T_A, T_B, T_C$.
  *   **Observation:** Prices *will* move. Students will trade based on "fit" (e.g., $T_B$ might seem more specific/plausible than $T_C$).
  *   **Constraint:** If a student asks, "What is the Bayesian update?", remind them: "You cannot compute the ratio without the prior. You are flying blind."
  *   **Tension:** The market says "Update!" The formalism says "Undefined."

  **01:30 – 01:50 | Debrief & Mapping**
  *   Stop trading. Do not resolve truth (keep the mystery for the seminar discussion).
  *   Run the debrief script below.

  ---

  ## 5. Debrief Script: Mapping Moments to Arguments

  **Goal:** Connect the visceral frustration to the philosophical literature without lecturing.

  **1. The "Stale" Success (00:10–00:40)**
  *   *Moment:* Students calculated $P(H_1|E)=1$ easily.
  *   *Argument:* This is standard conditionalization. $P(E) < 1$. The machinery licenses the belief change.
  *   *Takeaway:* Bayesianism handles *new* evidence perfectly.

  **2. The "Amnesia" Wall (00:50–01:00)**
  *   *Moment:* Students searching through shuffled slips, realizing they can't match priors to the new theories.
  *   *Argument:* **The Problem of Old Evidence.** You know $E$ (12). You know $T \to E$. But you lack $P(T)$ *before* $E$ was fixed.
  *   *Standard Escape 1 (Counterfactual Priors):* "I should guess what I *would* have believed."
      *   *Cost:* This is subjective fiction. Two students guess different counterfactual priors; both claim to be Bayesian.
  *   *Standard Escape 2 (Logical Learning):* "I didn't learn $E$; I learned that $T$ entails $E$."
      *   *Cost:* Requires a logic omniscience we don't have. Why didn't we know $T \to E$ earlier?

  **3. The Market Movement (01:00–01:30)**
  *   *Moment:* Prices for $T_A, T_B, T_C$ diverged despite $P(E)=1$ for all.
  *   *Argument:* **The Dormant Distinction.**
      *   *Stale:* Evidence bears on known theory.
      *   *Dormant:* Theory bears on known evidence.
  *   *Test:* Did the market treat $T_A$ (Multiples of 4) differently from $T_C$ (Squares + 3)?
      *   *If Yes:* The distinction holds. Intuition discriminates based on *theoretical virtue* (simplicity, etc.), not just entailment.
      *   *If No:* The distinction collapses. Entailment is all that matters.
  *   *Your Claim:* The intuition of confirmation is strongest in Dormant cases because the *connection* is new, not the fact.
  *   *Verdict:* If students traded $T_B$ higher because "Primes + 1 feels more natural," your claim is supported. The confirmation came from the *structure* of the theory, which Bayes (on old evidence) ignores.

  **4. The Scoring Rule Tension**
  *   *Moment:* Students wanting to buy $T_B$ but knowing they can't justify it formally.
  *   *Argument:* **Pragmatism vs. Formalism.** The scoring rule rewards being right (buying the true theory). The formalism rewards consistency (not updating on certainties).
  *   *Takeaway:* If you follow the formalism strictly, you lose money (fail to confirm). If you follow intuition, you break the formalism.

  ---

  ## 6. Troubleshooting: Predictable Failures

  **1. "I refuse to bet on entailment."**
  *   *Prediction:* One student argues that logical truths shouldn't have probabilities.
  *   *Fix:* Acknowledge this is a valid philosophical stance (logical omniscience). Tell them: "For the purpose of the market, treat 'Theory is True' as an empirical claim about the Generator's mechanism, not a logical truth."
  *   *Backup:* Give them a "Logic Cheat Sheet" that treats the rules as empirical regularities (e.g., "The Machine *tends* to pick Multiples of 4") to soften the logical rigidity.

  **2. "The Market is Dominated by Two Loud Students."**
  *   *Prediction:* High-confidence students set prices; others free-ride.
  *   *Fix:* **Blind Orders.** For the first 5 minutes of trading, students write Buy/Sell orders on paper and hand them to you. You clear the market anonymously. This forces everyone to commit to a price.
  *   *Fix:* **Cap Holdings.** No student can hold more than 10 certificates of any one type. This forces distribution.

  **3. "I can just reconstruct my prior."**
  *   *Prediction:* A student says, "I know I would have given 'Multiples of 4' a 10% prior. I don't need the slip."
  *   *Fix:* This is the *Counterfactual Solution* to POE. Highlight this in the debrief! "You just solved the problem by inventing a prior. But is that *your* prior, or a convenient fiction?"
  *   *Handling:* Do not forbid this. Let them do it. It makes the debrief richer. Ask the class: "Is their reconstructed prior trustworthy?"

  **4. "The Arithmetic is Too Hard."**
  *   *Prediction:* Students get bogged down calculating likelihoods.
  *   *Fix:* Provide the **Truth Table Handout**.
      *   $T_A$: True for {4, 8, 12, 16, 20}. (5 outcomes).
      *   $T_B$: True for {3, 4, 6, 8, 12, 14, 18...}. (List them).
      *   Ensure the likelihoods are obvious (e.g., if $T_A$ is true, $P(12) = 1/5$).
      *   *Crucial:* In Round 2, since $E$ is known, $P(E)=1$. The likelihood ratio becomes $1/1$. The math *should* yield no update. The friction comes from them *wanting* to update.

  ---

  ## 7. Critical Analysis: Where This Design Might Fail

  **1. The "Prior Amnesia" is a Red Herring.**
  *   *Critique:* The real POE isn't that we *forgot* our priors; it's that $P(E)=1$ makes the update mathematically null ($P(H|E) = P(H)$). My design simulates *memory loss*, not *certainty*.
  *   *Mitigation:* In the debrief, explicitly state: "The shuffled slips simulated the *unavailability* of the prior. The real problem is that even if you had the slip, if $P(E)=1$, the math still says 'No Update.' The slips just made you feel the frustration of the missing variable."
  *   *Load-Bearing:* If you remove the slips, the activity becomes a lecture. The slips are necessary for the *feeling*, even if they are philosophically distinct from the *logic*.

  **2. Market Prices $\neq$ Confirmation.**
  *   *Critique:* Students might think the price moved because of risk aversion or liquidity, not confirmation.
  *   *Mitigation:* Emphasize that in a market of proper scorers, Price = Credence. If Price moves, Credence moved. If Credence moved on Old Evidence, Bayesianism is violated.
  *   *Risk:* If the market is thin (14 students), prices might be noisy.
  *   *Fix:* You (Instructor) act as the Liquidity Provider. If students hesitate, you offer to buy/sell at specific prices to anchor the market.

  **3. The Stale/Dormant Distinction Collapses.**
  *   *Critique:* Students might say, "In Round 2, the *New Evidence* was 'The Theory was Proposed'."
  *   *Mitigation:* You must block this move in the rules. "You are not betting on whether the theory was proposed. You are betting on whether the theory is *True*."
  *   *Verdict:* If students successfully argue that "Theory Proposal" is the evidence, they have discovered the **Garber Solution**. This is a *success*, not a failure. Let them win that argument, then ask: "Does that explain why Mercury confirmed Einstein, or just that Einstein's paper confirmed Einstein?"

  **4. What Would Change My Mind?**
  *   *If the market remains flat in Round 2:* This means students are being rigid Bayesians.
      *   *Fix:* Nudge them. "Would you bet 1:1 that $T_C$ is true? It fits the data perfectly." If they say "No," ask why. If they say "Because it's ad-hoc," you have isolated the *theoretical virtue* that Bayes ignores in the POE context.
  *   *If the arithmetic overwhelms:* Simplify the hypotheses. Use "Divisible by 2" vs "Divisible by 5".
  *   *If the "Amnesia" feels like a trick:* Be transparent. "I am withholding your priors to simulate the state of having no baseline."

  ## 8. Final Recommendation

  The **Prior Amnesia** mechanic is the most innovative part of your request, but also the most fragile. It risks turning a logical problem into a procedural one.
  *   **Modification:** Instead of shuffling slips, simply **do not allow Round 2 Priors**. Tell them: "In Round 2, the Evidence is fixed *before* the game starts. You have no prior state *in this game context*."
  *   **Why:** This is cleaner. It simulates the scientific reality: The evidence (Mercury) was there before the theory (GR). You never had a "pre-GR" credence in GR *in the presence of Mercury*.
  *   **Decision:** I recommend dropping the shuffled slips. It's too gimmicky. Instead, rely on the **temporal order**: Evidence First $\to$ Theory Second. The "Amnesia" is structural, not physical.
  *   **However:** Since you specifically asked for the "collect and shuffle" mechanic to make it visceral, I have included it above. If you want a more philosophically pure version, remove the slips and rely on the temporal constraint.

  **Load-Bearing Choice:** The **Market**. Without the market, this is just a worksheet. The market forces them to *act* on their intuition even when the math fails. That tension is the learning objective. Do not remove the market.

  **Load-Bearing Choice:** The **Stale/Dormant Order**. You must run Stale first. If you run Dormant first, they will assume Bayes is broken. Stale establishes the baseline competence; Dormant reveals the specific breakdown.

  **Final Warning:** The 50-minute follow-up session is where the real work happens. The 110-minute session is for generating the *anomaly*. Do not try to solve the POE in the first session. Leave them frustrated. Use the second session to read Garber, Jeffrey, or Christensen. The activity is the "data" for the second session's theory.
