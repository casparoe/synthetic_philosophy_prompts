      *   *Experimental:* Discovery of a central clock signal in the brain, or a bus architecture for memory access.
      *   *Reasoning Failure:* I might be over-indexing on the "digital" label of the neuron spike while ignoring vN's emphasis on the *systemic* statistical nature. I need to acknowledge that vN saw the *component* as digital but the *computation* as statistical.

