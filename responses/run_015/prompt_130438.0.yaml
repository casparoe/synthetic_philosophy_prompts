answer: |-
  **Index Card Rule:** Classify the claim type, demand paper trails for "averted" defenses, compare parameters against original proposals to catch retrofits, and enforce automatic termination after two dated misses or one unproven rescue.

  ### Decision Procedure for Model Renewal

  **1. Classify the Primary Claim**
  Before reviewing outcomes, categorize the model's core output as found in the original funding proposal:
  *   **Type A (Dated Forecast):** Predicts specific event $X$ will occur by date $Y$ (e.g., "Famine by 2020").
  *   **Type B (Dominance Claim):** Predicts Force $X$ will outweigh Force $Y$ by date $Z$, without specifying exact event timing (e.g., "Resource scarcity will dominate price formation by 2030").
  *   **Type C (Mechanism/Existence):** Asserts causal link $X \rightarrow Y$ exists, without specific horizon (e.g., "Trust decline accelerates after threshold $T$").

  **2. Audit the "Averted" Defense**
  If authors claim the prediction failed because policy intervention prevented it:
  *   **Requirement:** Provide documented evidence (meeting logs, policy citations, correspondence) showing decision-makers accessed the model *before* the intervention and explicitly cited it as rationale.
  *   **Ruling:** No documentation = Defense rejected. Count as a miss.
  *   **Self-Denying Check:** If the model claims *it* caused the aversion, evidence must show the model was disseminated to relevant actors prior to the window closing.

  **3. Audit Auxiliary Hypotheses**
  Compare current model parameters against the original Proposal and Year 1 Report.
  *   **Load-Bearing Check:** Identify assumptions required to make the current model fit the data (e.g., "technology remains static," "migration flows zero").
  *   **Ruling:** If a load-bearing assumption was added *after* the miss to explain the miss, classify as **Retrofitted**.
  *   **Consequence:** Retrofitted auxiliaries invalidate the current iteration immediately.

  **4. Apply Stop Rules**
  *   **Type A (Dated):** One retiming permitted *only if* original confidence intervals were explicit. Retiming must be logged in the Pre-Commitment Ledger with a new date and consequence. **Second miss = Drop.**
  *   **Type B (Dominance):** One miss permitted with re-specification. **Second miss = Drop.**
  *   **Type C (Mechanism):** If mechanism logic is contradicted by data (e.g., threshold crossed without effect), **Drop immediately.** If timing is off, treat as Type A.
  *   **Any Type:** Retrofitted auxiliaries = **Drop immediately.**

  **5. Escalate Judgment Calls**
  The following are not decided by the analyst and must be referred to the **Review Chair**:
  *   Whether a mechanism offers sufficient theoretical insight to warrant funding despite empirical failure (Type C only).
  *   Whether external shocks (war, pandemic) constitute valid force majeure for timing misses.
  *   Renewal decisions on models where the "Averted" defense has partial but incomplete documentation.

  ***

  ### Application 1: Neo-Malthusian Food-and-Population Model

  **Case Summary:**
  *   **Claim Type:** Type A (Dated Forecast). Predicted famine windows in 2015 and 2020.
  *   **Outcome:** Windows passed; yields rose due to genetic modification and supply chain optimization.
  *   **Defense:** Authors claim timing was off due to unforeseen agricultural innovation; mechanism (population > resources) remains valid.
  *   **Audit:** No "averted" claim made. Auxiliary hypothesis audit reveals original model assumed linear yield growth; current model adjusts for exponential tech growth post-hoc.

  **Procedure Run:**
  1.  **Classification:** Type A.
  2.  **Averted Defense:** N/A.
  3.  **Auxiliary Audit:** Failure. The assumption regarding yield growth was load-bearing and adjusted after the first miss to accommodate the second window. This counts as a retrofit.
  4.  **Stop Rule:** Two dated misses occurred. Even without the retrofit strike, the second miss triggers termination.
  5.  **Judgment:** None required. Automatic drop.

  **Recommendation Memo**

  **TO:** Board of Directors
  **FROM:** Model Review Unit
  **DATE:** 24 October 2023
  **SUBJECT:** Renewal Decision: Global Food Security Model (Project #404)

  **Decision:** **NON-RENEWAL (DROP)**

  **Rationale:**
  The model was funded as a predictive instrument with specific dated forecasts (famine windows in 2015 and 2020). Both windows have passed without the predicted events occurring.

  Under the Review Procedure:
  1.  **Forecast Failure:** This is the second missed dated forecast. Procedure mandates termination after two misses.
  2.  **Parameter Retrofitting:** An audit of model parameters reveals that yield-growth assumptions were adjusted after the first miss to align with observed data. This constitutes a retrofitted auxiliary hypothesis, which invalidates the current iteration independently of the forecast misses.

  **Financial Impact:**
  Ceasing funding releases $350,000 annually. No severance beyond current quarter obligations.

  **Board Action Required:**
  Sign off to close project account.

  ***

  ### Application 2: Resource-Depletion Price Model

  **Case Summary:**
  *   **Claim Type:** Type B (Dominance Claim). Predicted resource scarcity would dominate price formation by 2025.
  *   **Outcome:** Price spike occurred in 2022 (validation), followed by collapse in 2023 due to new extraction technology (fracking/deep-sea) absent from model.
  *   **Defense:** Authors argue the spike validated the mechanism; the collapse was due to an exogenous shock (tech breakthrough) not modeled.
  *   **Audit:** Original proposal stated "assuming no step-change in extraction technology." This assumption was explicit ex-ante.

  **Procedure Run:**
  1.  **Classification:** Type B.
  2.  **Averted Defense:** N/A.
  3.  **Auxiliary Audit:** Pass. The assumption regarding technology was declared in the original proposal ("no step-change"). It is not a retrofit; it is a boundary condition that was breached.
  4.  **Stop Rule:** First miss for Type B. Permits re-specification.
  5.  **Judgment:** Review Chair must decide if the mechanism is robust enough to warrant updating the boundary conditions. Given the spike occurred, the core scarcity mechanism has merit but requires dynamic tech inputs.

  **Recommendation Memo**

  **TO:** Board of Directors
  **FROM:** Model Review Unit
  **DATE:** 24 October 2023
  **SUBJECT:** Renewal Decision: Resource Depletion & Price Model (Project #512)

  **Decision:** **RENEWAL CONDITIONAL ON RE-SPECIFICATION**

  **Rationale:**
  The model successfully predicted the 2022 price spike, validating the core scarcity mechanism. However, it failed to anticipate the 2023 price collapse driven by extraction technology breakthroughs.

  Under the Review Procedure:
  1.  **Boundary Condition Breach:** The model explicitly assumed static extraction technology. This was not a retrofit, but a known limitation that has now been reached.
  2.  **Allowance:** As a Type B (Dominance) claim, the model is permitted one re-specification cycle to incorporate dynamic technological variables.

  **Conditions:**
  Funding is renewed for one year only. The team must integrate endogenous technology innovation rates. Failure to predict price stability within the new specification window will result in termination.

  **Board Action Required:**
  Approve conditional renewal budget ($300,000).

  ***

  ### Application 3: Institutional-Trust Decline Model (Flagship)

  **Case Summary:**
  *   **Claim Type:** Type A/B Hybrid. Predicted institutional trust would cross a "collapse threshold" in rich democracies within 10 years (by 2024).
  *   **Outcome:** 10-year horizon ending. Threshold not crossed. Trust metrics stable or rising in key target demographics.
  *   **Defense:** Senior author claims decline was "averted" by policy reforms inspired by the model's warnings.
  *   **Audit:** No documentation exists linking specific policy reforms to this model. Policy reforms cited (e.g., digital governance acts) predate model dissemination. Model parameters adjusted in Year 7 to redefine "trust threshold" after preliminary data showed no decline.

  **Procedure Run:**
  1.  **Classification:** Type A (Dated Threshold).
  2.  **Averted Defense:** Fail. No paper trail links model to policy intervention. Defense rejected.
  3.  **Auxiliary Audit:** Fail. The definition of "collapse threshold" was adjusted in Year 7 to accommodate early null results. This is a retrofitted auxiliary.
  4.  **Stop Rule:** Retrofitted auxiliaries trigger immediate drop. Additionally, this is a missed dated forecast.
  5.  **Judgment:** Referral to Review Chair regarding "Senior Colleague/Flagship" status. **Ruling:** Procedure applies equally to all models. Status does not exempt from falsification rules.

  **Recommendation Memo**

  **TO:** Board of Directors
  **FROM:** Model Review Unit
  **DATE:** 24 October 2023
  **SUBJECT:** Renewal Decision: Institutional Trust Flagship Model (Project #001)

  **Decision:** **NON-RENEWAL (DROP)**

  **Rationale:**
  The model's primary prediction—a threshold collapse of institutional trust by 2024—has not materialized. The authors claim this failure represents a success (policy aversion), but provided no evidence that policymakers utilized this model to drive interventions.

  Under the Review Procedure:
  1.  **Unproven Rescue:** The "averted" defense requires documented causality between model output and policy action. None exists. The prediction counts as a miss.
  2.  **Parameter Retrofitting:** An audit reveals the "collapse threshold" metric was redefined in Year 7 after initial data failed to show decline. This is a retrofitted auxiliary hypothesis, which mandates immediate termination under Section 4 of the Procedure.
  3.  **Equity Clause:** Review Procedure applies uniformly regardless of project seniority or flagship status.

  **Financial Impact:**
  Ceasing funding releases $450,000 annually.

  **Board Action Required:**
  Sign off to close project account. Initiate archive protocol for model data.
