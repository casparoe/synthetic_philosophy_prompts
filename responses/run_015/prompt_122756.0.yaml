  1. A hospital board must allocate a surplus to either install irreversible physical interlocks on radiation cabinets or fund a discretionary research endowment. Both options are roughly tied on expected value over the next decade, but the interlocks physically prevent specific errors while the endowment empowers future directors to pursue unspecified projects.

  2. Cluelessness undermines the endowment because its long-term value depends on unpredictable future choices that could reverse any initial gain, whereas the interlocks remove a specific harm pathway that cannot be resurrected by future agency. The opacity of magnitude affects both, but only the endowment suffers opacity of moral direction.

  3. The load-bearing feature is the physical irreversibility of the constraint imposed by the interlocks relative to the fungibility of the endowment. If the interlocks could be easily repurposed to facilitate harm instead of preventing it, both options become sign-flipping and cluelessness restores symmetry between them.

  4. The strongest reply is that labeling interlocks "sign-preserving" relies on empirical assumptions that future agents won't bypass them or suffer unforeseen side-effects, which is itself a long-run forecast. This objection succeeds, and conceding it costs the example its structural distinction, reducing it to a contest of competing empirical probabilities rather than a difference in causal composition.

  5. This case entitles you to assert that cluelessness is sensitive to the modal structure of causal pathways, not just their epistemic opacity. It cannot establish that sign-preserving channels are immune to skepticism, only that they are vulnerable to a different, narrower class of empirical uncertainties.
