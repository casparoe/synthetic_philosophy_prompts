answer: |-
  You have put your finger on a genuine tension in the architecture of procurement. The sealed-bid first-price tender is a mechanism that appears simple on the surface but rests upon a surprisingly delicate scaffolding of assumptions about the minds of the participants. You are correct to sense a paradox: we isolate the bidders to prevent collusion, yet the logic of their bidding strategies seems to require them to be mentally entangled in a web of mutual expectations.

  To reconstruct the implicit theory here, we must distinguish between the *mathematical ideal* of the tender and the *institutional reality* in which you operate.

  ### The Implicit Theory of Rationality

  At its starkest, the standard economic model of your tender presupposes that each bidder is an expected-utility maximiser operating under a condition of **Common Knowledge of Rationality (CKR)**.

  For a supplier to calculate the optimal bid (the point where the margin gained from shading their price exactly balances the risk of losing the contract), they must form a probability distribution over the bids of their rivals. Since rivals' bids are a function of their costs and their own shading strategies, my bidder must have a view on their costs and their rationality. But since their rationality includes forming a view on *my* bidder's costs and rationality, we enter the infinite regress you identified: I must know what you know about what I know.

  Strictly speaking, your practice does **not** require this infinite regress to be literally true in the minds of the suppliers. What it strictly presupposes is merely:
  1.  **Self-Interest:** Each bidder prefers winning at a higher price to winning at a lower price, and winning to losing.
  2.  **Private Information:** Each bidder possesses cost information that others do not perfectly possess.
  3.  **Independence:** The bidders cannot coordinate their actions (which is why you seal the bids).

  The infinite hierarchy of beliefs is not a strict prerequisite for the mechanism to function; it is merely the condition required for the mechanism to reach a specific theoretical equilibrium (the Nash equilibrium). The practice sits *comfortably* with CKR because if CKR holds, the outcome is stable and predictable. However, the tender will still allocate the contract to the lowest-cost provider even if the bidders are reasoning crudely, provided their errors are random rather than systematic.

  ### The Paradox of Sealing and Mutual Knowledge

  You note the oddity of forbidding communication while relying on mutual prediction. The resolution lies in distinguishing between *communication* and *common context*.

  When you issue the tender documents, you are creating a focal point. You are establishing **Institutional Common Knowledge**. It is not that Supplier A knows what Supplier B is thinking; it is that both know the same rules, the same deadline, and the same evaluation criteria. In the absence of private communication, rational agents will often converge on similar strategies simply because they are facing the same problem structure. The "mutual knowledge" required is not about the specific bids, but about the *nature of the game*. You seal the bids to prevent them from changing the game (by colluding), not to prevent them from solving the game.

  ### Alternative Theories of Rationality

  You ask if the practice could be licensed by other views of rationality. The answer is largely yes, which explains why the format is so ubiquitous despite the heavy theoretical baggage of the standard model.

  **1. Risk Aversion**
  If suppliers are risk-averse rather than risk-neutral, they will shade their bids less aggressively. They will sacrifice some potential profit margin to increase the probability of winning.
  *   **Does the practice need to change?** No. The mechanism remains robust. In fact, from your perspective as the buyer, risk-averse bidders are preferable; they drive the price down closer to their true costs than risk-neutral bidders would. The format is underdetermined here: both risk-neutral and risk-averse theories recommend the same procedural steps to you.

  **2. Bounded Rationality (Level-k Reasoning)**
  Suppose suppliers do not reason to a fixed point. Suppose Supplier A simply bids cost plus a standard margin (Level-0). Supplier B, anticipating this, bids just under that margin (Level-1). Supplier C, anticipating B, goes slightly lower (Level-2).
  *   **Does the practice need to change?** No. As long as there is competition, this iterative reasoning pushes prices down. The tender does not require perfect equilibrium; it merely requires that bidders try to undercut one another. The format is underdetermined between perfect rationality and bounded rationality, provided the bounded reasoning is competitive.

  **3. Learning and Repeated Interaction**
  You suggest suppliers might learn across repeated tenders rather than calculating in advance. This is perhaps the most realistic model. In the first few tenders, bids may be erratic. Over time, suppliers observe who wins and at what price (if they have market intelligence), adjusting their shading accordingly.
  *   **Does the practice need to change?** Not necessarily, but the *outcome* improves over time. The tender mechanism acts as a discovery procedure. It does not presuppose the knowledge exists at the start; it presupposes the incentives exist to find it.

  ### Where the Practice is Underdetermined

  The choice of the first-price sealed-bid format is philosophically underdetermined in the sense that it is compatible with almost any theory of rationality that includes competition. Whether your suppliers are hyper-rational game theorists, heuristic-driven pragmatists, or risk-averse conservatives, the instruction "submit a sealed number, lowest wins" remains the optimal instruction for you.

  The divergence only appears in the *price* you pay, not in the *process* you run. A world of risk-neutral Nash equilibrists yields a different price than a world of risk-averse learners, but both worlds utilise the same tender documents. This robustness is likely why the format persists in the real world while the second-price (Vickrey) format does not. The second-price format is fragile: it relies on bidders understanding the specific incentive to bid truthfully. If they misunderstand the mechanism and shade their bids anyway, the mechanism breaks. The first-price format is forgiving: if bidders misunderstand, they simply bid higher or lower, but the lowest cost provider generally still wins.

  ### The "Implausibly Cheap" Bid

  This is the point where your practice contradicts the standard theory most sharply. In the pure model, costs are private. If a supplier bids £1m and the next lowest is £2m, the model assumes the £1m supplier knows something you do not (perhaps a new technology, or lower overheads).

  By rejecting a bid for being "implausibly cheap," you are asserting that costs are not purely private, but contain a **Common Value** component that you, the buyer, understand better than the seller. You are effectively saying, "I know the market rate for this labour, and your bid violates the laws of physics."

  This implies you do not believe the bidders are fully rational or fully informed about their own cost structures. You are protecting yourself against the "Winner's Curse" in reverse: the fear that the winner is the one who made the biggest error in estimation and will subsequently default or deliver poor quality.

  ### Concrete Changes if Assumptions Drop

  If you were to explicitly abandon the assumption of Common Knowledge of Rationality, or if you knew specific details about bidder psychology, your procedures should change in the following ways:

  **1. If you know one supplier always bids true cost:**
  If Supplier A is a "truth-teller" (perhaps due to internal policy) and others are strategic shadders, the first-price auction is unfair to A. A will win often but will make zero surplus to cover risk, potentially driving them out of business.
  *   **Change:** You should move to a **negotiated procedure** or a **second-price format**. In a second-price format, the truth-teller wins and is paid the second-lowest price, granting them a surplus that compensates for their risk without penalising their honesty. Alternatively, you could qualify bids, asking for cost breakdowns to verify if the low price is genuine or an error.

  **2. If you announce bids will be published afterwards:**
  This explicitly supports the **Learning Model**. Currently, the secrecy of the tender slows down the market's convergence to an efficient price.
  *   **Change:** Publishing the winning price (and perhaps the range) after the contract is awarded reduces the information asymmetry. It allows losers to calibrate their shading for the next round. This would likely lower your prices over time as bidders become more confident in their estimates of the competition. However, it increases the risk of collusion in future tenders, as it makes it easier for rivals to detect if someone has deviated from a cartel agreement.

  **3. If you assume bidders cannot reason beyond one step:**
  If you believe suppliers simply add a standard margin to their costs without modelling rivals, your tender becomes a test of who has the lowest overheads, not who is the best strategist.
  *   **Change:** You might introduce **scoring rules** beyond price. If strategic shading is minimal, price competition is less fierce. You could weight quality or delivery speed more heavily, as the price variance will reflect cost variance rather than strategic manoeuvring.

  ### Conclusion

  Your tender format does not strictly presuppose the complex web of mutual knowledge that the textbooks describe. It presupposes only competition and self-interest. The complex theory is a description of the *limit* of the process, not its *prerequisite*.

  The practice is robust because it is underdetermined: it works whether your suppliers are geniuses or novices, risk-neutral or risk-averse. The only point of fragility is your intervention on "implausibly cheap" bids. There, you are stepping outside the logic of the auction and imposing your own valuation of the market. To be consistent, you must either trust the market mechanism (and accept the risk of default) or acknowledge that you are not running a pure price auction but a pre-qualified selection process where you retain veto power over the market's judgment.

  If you wish to remain philosophically consistent with the sealed-bid format, you must accept that the lowest bidder knows their costs better than you do. If you cannot accept that, you are not running a tender to discover prices; you are running a verification exercise to confirm your own estimates.
