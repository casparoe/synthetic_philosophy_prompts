  ### Leaf Catalog

  | Leaf | Name | Steelman | Awkward Commitment | Target |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | **The Dissolution** | The question relies on a grammatical trick; "nothing" cannot be referred to without making it a "something." | You must explain why the question *feels* so profound if it is logically empty. | Refusal |
  | 2 | **The Plenitude** | Every coherent possibility is actualized somewhere, so "nothing" was never a live option. | You must accept the existence of infinitely many unobservable, causally isolated universes. | Radical |
  | 3 | **The Modal Lock** | The laws of logic/metaphysics allow only one possible world, so this one exists by default. | You must deny that any feature of our world could have been even slightly different. | Radical |
  | 4 | **UNOCCUPIED** | (Selected Abstracta) Rules exist and pick a world, but not via value or chance. | Implies a selector mechanism with no agency and no randomness. | Radical |
  | 5 | **UNOCCUPIED** | (Lawless Cause) A cause exists outside of time and law to create law. | Requires causation to function without the very conditions (time/law) that make causation possible. | Radical |
  | 6 | **UNOCCUPIED** | (Lawless Self-Explain) The universe explains itself without fixed laws. | Lacks any stable ground for the explanation to hold; seems like magic. | Radical |
  | 7 | **The Aggregate** | Explain every tile and you've explained the floor; no "whole" exists over and above the parts. | Struggles to explain why *this* specific collection of parts exists rather than another. | Surrogate |
  | 8 | **The Physical Unstable** | Quantum fields cannot remain empty; "nothing" is physically unstable and decays into "something." | Assumes the laws of quantum physics exist prior to the physical stuff they govern. | Surrogate |
  | 9 | **The Brute Fact** | Existence is the baseline; asking for a cause of everything is a category error. | Offers no intellectual satisfaction; simply halts inquiry at the boundary. | Radical |
  | 10 | **UNNAMED** | (Cyclic Time) Existence is an infinite loop with no beginning, so no start-cause is needed. | Commits to a specific, unproven cosmological model of time. | Surrogate |
  | 11 | **The Value-Personal** | A mind chooses to create because existence is better than non-existence. | Must explain why a perfect mind would need or want to create anything at all. | Radical |
  | 12 | **The Value-Impersonal** | Existence flows from an objective "goodness" without requiring a conscious chooser. | Posits a moral force that acts without a mind, which is hard to conceptualize. | Radical |
  | 13 | **The External-Cause** | A blind, external mechanism generated the universe (e.g., a collider in a meta-universe). | Pushes the question back one step: why does the meta-universe exist? | Surrogate |
  | 14 | **UNNAMED** | (Sustainer) An external power doesn't start the universe but constantly holds it in being. | Indistinguishable from continuous creation; hard to differentiate from Internal laws. | Radical |
  | 15 | **UNOCCUPIED** | (Abstract Cause) Abstract objects (numbers) caused the physical world. | Category error; abstract objects are typically defined as causally inert. | Radical |
