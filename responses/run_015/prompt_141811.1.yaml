  1. If backward causation is admissible in the time-travel case, why is it not admissible generally, and what is supposed to stop a bilker, say, someone in 1920 with a hammer and a device that will detonate tomorrow unless a signal arrives from 2050?
  Your likely answer is that the traveller's own presence in the past is already part of the story, so the bilker's blow is no less constrained than the traveller's shot, but I press you on whether that is a claim about anyone's abilities or only a claim about what in fact happens.

  2. What does your view say the traveller cannot do other than what did not happen?
  If the answer is "nothing", you have arguably told us only that the past is actual, so how does that differ from plain fatalism about the past, and does it leave the traveller anything to deliberate about?

  3. Where does the content of a looped object come from, such as a score copied in 2024 from a manuscript that will be carried back to 1824 and then recopied, and are you committed to facts with no further explanation?
  You will probably say that local causal explanation is all that is owed and that loops are no worse than unexplained initial conditions, but is that comparison fair given that the looped fact seems explained by nothing at all rather than by a contingent boundary condition?

  4*. Suppose the traveller's father was conceived from a gamete frozen and stored years before the death of the man she goes back to kill, so that her existence is in no way hostage to his survival: do you predict that she can now succeed?
  If you bite that bullet, is your view then committed to brute coincidence in the ordinary case, such as a hundred travellers whose attempts fail for unrelated reasons, with nothing in the situation to explain why? (Least confident anticipation: a Lewisian should deny success to preserve past immutability regardless of causal links.)

  5. Do you treat consistency as a constraint on which global solutions are admissible or as something that merely happens to obtain, and is your modality therefore metaphysical or only nomological relative to whatever spacetime structures our actual laws permit?
  Your likely reply is that the paradox is a conceptual matter and the physics is beside the point, but has a view answerable to no physics said anything about whether time travel is possible in the world we actually occupy?
