answer: |-
  She is going to say yes, that plain circle counts as an 'a', and the reason lies in the shadow of the third case you mentioned where she rejected a plain circle as an 'o'. In that earlier instance, the rejection was not because a circle lacks the structural DNA of an 'a', but because in a standard font where every other letter is fully drawn, a circle is already occupied by the 'o'. Identity in typography is rarely absolute; it is almost always relational. When she accepted the blackletter form that looks like a diamond and two strokes, she signaled that historical precedent and systemic consistency outweigh a rigid requirement for a bowl and a stem. When she accepted the stencil with the missing chunk, she confirmed that a glyph can be mutilated so long as the mutilation is consistent across the system. The upcoming case presents a system where the 'o' has been explicitly displaced to a hexagon with a dot, freeing the circle from its usual duty. Since the circle no longer conflicts with the 'o', and the face is a display face where experimentation is expected, the relational rule suggests she will allow the circle to inhabit the 'a' slot.

  There are two primary rules that fit her track record about equally well, and distinguishing between them is the heart of your column. The first is the Principle of Systemic Contrast, which posits that a glyph is a letter if it is distinguishable from its neighbors within the same typeface, specifically ensuring that 'a' does not look like 'o'. This rule explains why the plain circle was rejected in the standard font but why the blackletter and stencil variations were accepted; in those systems, the 'a' remained distinct from the 'o' despite their deformities. The second competing rule is the Principle of Historical Lineage, which argues that a glyph is a letter only if it belongs to a recognized typographic tradition or genre, such as sans serif, blackletter, or stencil, while rejecting arbitrary art like wildstyle graffiti. This rule fits the data because it accepts the Futura, blackletter, and stencil forms as part of established design histories while rejecting the graffiti as mere drawing and the plain circle in a standard font as a mistake. Both rules explain every past decision perfectly, including the graffiti rejection, which fails on contrast if it is illegible but also fails on lineage because it is not a typographic tradition.

  I would put money on the Principle of Systemic Contrast because her acceptance of the blackletter form suggests she is willing to override standard shape expectations if the internal logic of the font supports it. Blackletter is a niche lineage, and for a modern eye, those diamond shapes are not intuitively 'a', yet she accepted them because they belong to that system's logic. The graffiti rejection likely hinges on the lack of a coherent system rather than a lack of historical pedigree, as graffiti has its own history, but it often sacrifices legibility and consistent glyph mapping for artistic expression. The typographer seems to be acting as a guardian of readable systems rather than a museum curator of historical shapes. If she were strictly following lineage, she might have rejected the modified double-story 'a' with the filed-off hook because it breaks the standard model without a specific historical name, but she accepted it because it remained functionally distinct within its context. The circle in the hexagon-'o' font is functionally distinct, so the contrast rule predicts acceptance.

  To settle which rule she is actually using, you need to present her with a glyph that satisfies contrast but violates lineage. You should bring her a sample from a otherwise conventional book serif face where the 'o' is drawn as a square, and the glyph in the 'a' slot is a simple triangle. The triangle is distinctly different from the square 'o', satisfying the Principle of Systemic Contrast, but a triangle has no historical precedent as an 'a' in serif typography, violating the Principle of Historical Lineage. If she says yes, she is prioritizing the internal logic of the font and the reader's ability to distinguish characters over historical shape norms. If she says no, then her acceptance of the blackletter and stencil was merely a tolerance for established styles, and she will not permit arbitrary geometric substitution even when contrast is preserved. This test case isolates the variable of tradition from the variable of distinctiveness, forcing her to reveal whether she serves the system or the history.
