  *(Refining "Common Knowledge"):* In DS (Halpern/Moses), Common Knowledge is well-defined. I should leverage that. CK is attainable only in synchronous systems with reliable links. In asynchronous, it's impossible. This aligns perfectly with the Email Game translation.

