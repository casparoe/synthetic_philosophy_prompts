answer: |-
  # Taxonomy of Moral Obligations in Voting

  **Root Claim:** Voting can be morally required even when it is causally inefficacious.

  **Split 1:** Even when every available candidate is morally flawed, voting possesses non-instrumental expressive value that persists independently of electoral outcomes.
  *   **Agree** (Expressive Value Exists)
  *   **Disagree** (No Expressive Value)

  **Split 2:** Casting a ballot for a flawed but relatively better candidate is permissible as a "lesser evil," rather than constituting impermissible structural complicity in that candidate's harmful policies.
  *   **Agree** (Permissible Lesser Evil)
  *   **Disagree** (Impermissible Complicity)

  **Split 3:** Voters bear an epistemic duty to research candidates adequately, such that uninformed voting is morally worse than abstaining.
  *   **Agree** (Epistemic Duty Exists)
  *   **Disagree** (No Epistemic Duty)

  **Split 4:** Regarding "delegability anxiety": The moral culpability a voter incurs for government harms is amplified by the obscurity of coalition bargaining (proportional representation) relative to concentrated accountability (winner-take-all).
  *   **Agree** (Culpability Amplified in PR)
  *   **Disagree** (Culpability Diluted in PR / Amplified in WTA)

  ---

  ### Classification Leaves

  1.  **Agree / Agree / Agree / Agree:** Civic-republican duty.
  2.  **Agree / Agree / Agree / Disagree:** Expressive democratic participation.
  3.  **Agree / Agree / Disagree / Agree:** Unnamed (Incoherent: Expressive value typically requires epistemic intent).
