answer: |-
  ### Part 1: Theoretical Grounding & The `gzip` Question

  Before implementing the procedure, we must clear the air on the theory so your team stops arguing about uncomputable math.

  **1. Solomonoff Induction & Kolmogorov Complexity**
  Your theoretical friend is half-right: Solomonoff induction provides the *ideal* framework for prediction (weighting all computable hypotheses by their complexity), but it is uncomputable. You cannot run it. Kolmogorov complexity (the length of the shortest program producing the data) is also uncomputable and depends on the choice of universal Turing machine (your "description language").
  *   **Practical Takeaway:** Do not try to calculate these. They justify *why* we penalize complexity, but they do not tell us *how much* to penalize it in a 90-minute window.

  **2. The Survival of Occam's Razor**
  In practical ML, Occam's Razor survives not as a metaphysical truth ("simple is truer") but as a statistical necessity ("simple is more robust when data is scarce"). This is the **Bias-Variance Tradeoff**. A complex model has low bias but high variance; with limited data, the variance (overfitting) dominates.
  *   **Practical Takeaway:** Simplicity is a regularization technique, not a moral virtue. We prefer simple models only insofar as they generalize better to unseen data.

  **3. The `gzip` Proxy (MDL)**
  Your teammate's suggestion to use `gzip` is **admissible**, but only as an approximation of the **Minimum Description Length (MDL)** principle, not Kolmogorov complexity. MDL states that the best model minimizes the sum of:
  1.  The length of the description of the model itself (code + weights).
  2.  The length of the description of the errors (residuals) when the model is applied to the data.
  *   **Verdict:** Using `gzip` on the serialized model object plus the residuals is a legitimate, computable heuristic for MDL. It is not numerology; it is an engineering approximation of information theory. However, it must be used comparatively (Model A vs. Model B), not absolutely.

  ---

  ### Part 2: The 90-Minute Model Selection Procedure

  This checklist is designed to replace the arbitrary "0.02 Brier" rule with a structured risk assessment grounded in MDL and stability.

  **Time Budget:** 90 Minutes
  **Required:** Python/R environment, historical data, backtest harness.
  **Outcomes:**
  1.  **Recommend Simple:** Stick with the index/linear model.
  2.  **Recommend Flexible:** Deploy the tree/net.
  3.  **Escalate/Stop:** Hand off to CRO or declare insufficient data.

  #### Step 1: The Data-to-Parameter Audit (15 Minutes)
  *Goal: Quantify the risk of overfitting before looking at performance.*

  *   **Action:** Calculate the **Effective Events Per Variable (EPV)**.
      *   Count the number of non-zero claim events in the training set ($N_{events}$).
      *   Count the effective parameters ($P$). For linear models, this is the number of coefficients. For trees/nets, estimate $P$ as (Number of Leaves $\times$ Depth) or use a library function for parameter count.
      *   Calculate Ratio $R = N_{events} / P$.
  *   **Decision Rule:**
      *   If $R < 10$: **Flag "High Overfit Risk".**
      *   If $R > 20$: **Flag "Low Overfit Risk".**
      *   If $10 \le R \le 20$: **Flag "Moderate Risk".**
  *   **Stop Condition:** If $N_{events} < 50$ total, regardless of model, proceed immediately to **Step 5 (Escalate)**.

  #### Step 2: The MDL Proxy Check (30 Minutes)
  *Goal: Apply the `gzip` heuristic to measure complexity vs. fit.*

  *   **Action:**
      1.  Train both models on the full training set.
      2.  Save the model artifacts (weights, structure) and the preprocessing script (e.g., normalization code) to files.
      3.  Generate predictions on the *validation* set (not test set yet) and save the residuals (Actual - Predicted).
      4.  Run `gzip` on two bundles:
          *   Bundle A: [Model File + Preprocessing Script + Residuals] for Simple Model.
          *   Bundle B: [Model File + Preprocessing Script + Residuals] for Flexible Model.
      5.  Record sizes $S_{simple}$ and $S_{flex}$.
  *   **Decision Rule:**
      *   If $S_{flex} < S_{simple}$: The flexible model explains the data more efficiently. **Strong Point for Flexible.**
      *   If $S_{flex} > S_{simple}$ but difference is < 10%: **Neutral.**
      *   If $S_{flex} > S_{simple}$ by > 10%: **Strong Point for Simple.** (The complex model is "costing" too many bits for the improvement).

  #### Step 3: Stability & Sensitivity Test (30 Minutes)
  *Goal: Check if the flexible model is learning signal or noise.*

  *   **Action:**
      1.  Perform a bootstrap: Resample the training data with replacement 5 times.
      2.  Retrain the **Flexible Model** on each bootstrap sample.
      3.  Run all 5 versions on the same hold-out set.
      4.  Calculate the standard deviation of the predictions ($\sigma_{pred}$) across the 5 models.
  *   **Decision Rule:**
      *   If $\sigma_{pred}$ is high relative to the mean prediction (Coefficient of Variation > 20%): **Flag "Unstable".**
      *   If Feature Importance rankings shuffle wildly between bootstraps: **Flag "Uninterpretable".**

  #### Step 4: Performance vs. Threshold (10 Minutes)
  *Goal: Contextualize the backtest metric.*

  *   **Action:** Compare the Flexible model's metric (e.g., Brier Score) against the Simple model on the **Test Set** (rotating origin).
  *   **Decision Rule:**
      *   Calculate $\Delta = Metric_{simple} - Metric_{flex}$.
      *   Do **not** use the arbitrary 0.02 rule. Instead, ask: Does $\Delta$ exceed the **Cost of Complexity**?
      *   *Heuristic:* If Step 1 was "High Risk" OR Step 2 was "Strong Point for Simple", require $\Delta$ to be statistically significant (p < 0.05 via paired t-test on folds). If not, discard the gain.

  #### Step 5: Final Decision Matrix (5 Minutes)
  *Goal: Force one of the three outcomes.*

  | Step 1 (Data) | Step 2 (MDL) | Step 3 (Stability) | Step 4 (Perf) | **Final Outcome** |
  | :--- | :--- | :--- | :--- | :--- |
  | High Risk | Simple Better | Unstable | Marginal Gain | **Recommend Simple** |
  | Low Risk | Flex Better | Stable | Significant Gain | **Recommend Flexible** |
  | **Any** | **Any** | **Any** | **Data < 50 Events** | **Escalate / Stop** |
  | High Risk | Simple Better | Stable | Significant Gain | **Escalate (CRO)** |
  | Low Risk | Flex Better | Unstable | Significant Gain | **Escalate (CRO)** |

  *Note on Escalation:* You escalate when the model offers high reward (performance) but carries high structural risk (instability or data scarcity). This is no longer a modeling question; it is a risk appetite question.

  ---

  ### Part 3: Worked Applications

  #### Case 1: Hail/Vegetation (12 Regions, 3 Years Weekly)
  *   **Context:** 12 regions $\times$ 156 weeks $\approx$ 1,872 observations. Claim counts are sparse; assume ~300 non-zero claim weeks total.
  *   **Models:** Linear Index (2 params) vs. GBT (200 features, est. 500 effective params).
  *   **Performance:** GBT beats Linear by 0.015 Brier (Threshold was 0.02).

  **Running the Procedure:**
  1.  **Data Audit:** $N_{events} = 300$. GBT Params $\approx 500$. Ratio $R = 0.6$. **Flag "High Overfit Risk".** (Linear model is fine, but GBT is severely under-constrained).
  2.  **MDL Proxy:** GBT model file is 5MB. Linear is 2KB. Residuals for GBT are slightly smaller, but not enough to offset the model size. $S_{flex}$ is 50% larger than $S_{simple}$. **Strong Point for Simple.**
  3.  **Stability:** Bootstrap the 300 events. The GBT feature importance shuffles completely (sometimes moisture is top, sometimes it's lagged wind). **Flag "Uninterpretable".**
  4.  **Performance:** Gain is 0.015. Given the High Risk flag, we require statistical significance. With only 300 events, a 0.015 Brier improvement is likely noise (p > 0.1).
  5.  **Decision Matrix:** High Risk + Simple Better MDL + Unstable + Marginal Gain.

  **Outcome:** **Recommend Simple Model.**
  *   **Why this might be disliked:** Your ML-leaning teammate will argue that 0.015 Brier is "real" signal and that trees handle non-linearity better. However, the procedure highlights that with 0.6 events per parameter, the GBT is memorizing noise. The `gzip` check confirms the complexity isn't "earning its keep."

  #### Case 2: Novel Storm Type (8 Weeks Data)
  *   **Context:** 8 weeks of data. ~20 claim events total.
  *   **Models:** Physical Simulation (Many tuned parameters) vs. Generic Time-Series (ARIMA/Prophet).
  *   **Performance:** Physical model fits history perfectly. Time-series lags.

  **Running the Procedure:**
  1.  **Data Audit:** $N_{events} = 20$.
  2.  **Stop Condition:** The procedure states: "If $N_{events} < 50$ total, regardless of model, proceed immediately to **Step 5 (Escalate)**."
  3.  **Reasoning:** 20 events is statistically insufficient to validate *any* frequency model, regardless of complexity. The Physical model's "perfect fit" is guaranteed because it has enough tuned parameters to fit 20 points exactly (overfitting). The Time-Series model cannot learn seasonality from 8 weeks.
  4.  **Decision Matrix:** Data < 50 Events.

  **Outcome:** **Escalate / Stop (Not Enough Information).**
  *   **Why this might be disliked:** This is the answer you will not like. The business wants a forecast *now* for pricing. The procedure forces you to admit that **no model is valid here.** Using either model is numerology. You must hand this to the Chief Risk Officer to decide if they want to price based on expert judgment (manual) rather than model output.

  ---

  ### Part 4: Limitations & Failure Modes

  This procedure is a tool, not a theorem. Here is where it will misfire:

  **1. The "True" Complexity Blindspot**
  `gzip` measures file size, not semantic complexity. A model could be small in bytes but encode a chaotic, unstable function. Conversely, a large file might contain a very smooth, robust function. The procedure assumes file size correlates with variance risk, which is usually true but not always.

  **2. Non-Stationarity (The Regime Shift)**
  The procedure assumes the future looks like the past (stationarity). If a climate shift has fundamentally changed the peril (e.g., wildfire behavior changed in the last 2 years), backtests (Step 4) will fail to detect it. The procedure might recommend the Simple model because it's "stable," but both models could be catastrophically wrong.
  *   *Mitigation:* This is why Step 5 allows escalation. If you suspect regime shift, escalate regardless of the score.

  **3. Tail Risk vs. Average Error**
  Brier score and MDL focus on average performance. In reinsurance, we care about the tail (1-in-100-year events). A flexible model might have a worse Brier score but better capture the tail dependence.
  *   *Mitigation:* If the business case is specifically for *aggregate tail protection* (not frequency forecasting), modify Step 4 to use a tail-sensitive metric (e.g., Pinball Loss at 99th percentile) instead of Brier.

  **4. The "Black Box" Regulatory Risk**
  The procedure treats interpretability as a stability flag (Step 3). However, some jurisdictions or internal audit rules *forbid* uninterpretable models regardless of performance. The procedure might recommend "Flexible," but Compliance might veto it.
  *   *Mitigation:* Add a pre-check: "Is the Flexible model compliant with Model Risk Management policy?" If no, outcome is automatically "Recommend Simple."

  **5. False Confidence in Escalation**
  Escalating to the CRO (as in Case 2) protects *you*, but it doesn't solve the business problem. If you escalate too often, you become a bottleneck.
  *   *Mitigation:* Use the "Stop" outcome to build a business case for buying more data or waiting longer, rather than just passing the buck.

  ### Summary for the Team Lead
  You cannot compute Solomonoff induction. You can, however, enforce discipline. This procedure replaces the "0.02 Brier" arbitrary rule with a **Data Scarcity Check** and an **Information Efficiency Check (`gzip`)**. It forces you to admit when data is too sparse (Case 2) and protects you from overfitting when parameters outnumber events (Case 1). Use it to end the argument, not to find the truth.
