      *   *Section 3: Normativity and Over-generation.*
          *   CR's over-generation is fatal for normativity. Without history, "malfunction" is just "difference."
          *   SE's normativity is robust but rigid.
          *   *The "Borrowing" Point:* CR *must* borrow SE to select the *relevant* system capacity (usually survival). SE *must* borrow CR to explain current mechanism.
      *   *Section 4: Pluralizing Selection Levels.*
          *   Does this save SE? It helps with HGT (plasmid level). It hurts with Gene Drives (human level?).
          *   Risk: If selection is everywhere, function is everywhere (pan-functionalism).
      *   *Conclusion:* SE is metaphysically superior for *biological* function (normativity), but CR is pragmatically necessary for *explanation*. For a dissertation on *metaphysics*, SE (perhaps a modernized version like Garson's) holds the ground on what function *is*, while CR describes what functions *do*.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to just say "both are good." The user wants an argument on coherence.
      *   *Focus:* The prompt asks about the *source of normativity*. I need to emphasize that CR normativity is *extrinsic* (imposed by the observer), whereas SE normativity is *intrinsic* (built into the history).
      *   *Gene Drive:* If SE denies function, is that a bug or a feature? It might be a feature—it distinguishes engineered traits from evolved ones.
