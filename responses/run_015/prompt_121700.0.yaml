          *   *Response to Case 1:* Must argue human design *is* a selection process (Millikan's "proper function" can extend to artifacts, but biological function is tricky). Neander might resist. If we allow human selection, we blur biology/engineering.
          *   *Response to Case 2:* Can accommodate if we shift the "unit of selection" to the plasmid lineage, not the host. But this risks making *everything* with a replication history functional (the "spandrel" problem).
          *   *Normativity:* Derived from history.

      *   **Causal-Role (CR):**
