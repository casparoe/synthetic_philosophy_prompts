          *   *Normativity:* SE says malfunction = failure to do what was selected for. CR says malfunction = failure to contribute to capacity (but whose capacity? The mosquito's? The human's?).

      *   **Case 2: Horizontal Gene Transfer (HGT) Plasmid.**
          *   *SE Challenge:* Selection is happening *now*, but not via the host's lineage history. Is it a function of the *plasmid* (yes, arguably) or the *host* (no)? Does SE require lineage-specific history?
          *   *CR Challenge:* It contributes to community stability. Is that a function? CR is good here, but risks over-generation (is *any* stability contribution a function?).
          *   *Normativity:* If the plasmid loses resistance, is it malfunctioning? SE says yes (if selected for resistance). CR says yes (if stability is the capacity).

  3.  **Evaluate the Frameworks (Drafting the Argument):**

      *   **Etiological (SE):**
          *   *Strength:* Strong normativity. Malfunction is clear (failure to meet historical standard).
