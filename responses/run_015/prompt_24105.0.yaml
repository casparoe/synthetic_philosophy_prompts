answer: |-
  This is a fantastic question, and you are right to pause before publishing. This is one of the most famous "gotchas" in the philosophy of language, but it is also one of the most frequently misunderstood.

  The short answer is: **Lewis did not kill the equation $P(\text{If } A \text{ then } B) = P(B|A)$. He killed the idea that conditionals are standard propositions *that obey* that equation.**

  The Suppositional Theory is not ignoring Lewis; it is built specifically to survive him. It is a live option, not a corpse, but it comes with a heavy philosophical price tag that you need to explain.

  Here is the plain-English breakdown of the stalemate, the loophole, and where the debate stands today.

  ### 1. What Lewis Actually Proved (The "Triviality Result")

  Your understanding of the *consequence* was slightly off, which is common. Lewis didn't argue that a rational person becomes irrational upon learning new things. He argued something more structural about the nature of **propositions**.

  In standard logic and probability (Kolmogorov axioms), sentences express **propositions**. A proposition is a claim about the world that can be **true or false**. Because it can be true or false, it can have a probability (the probability that it is true).

  Lewis's 1976 result can be summarized as a *reductio ad absurdum*:
  1.  **Assume:** Conditionals (e.g., "If it rains, the match is cancelled") express standard propositions (they are true or false).
  2.  **Assume:** The probability of that proposition equals the conditional probability (The Thesis: $P(A \rightarrow B) = P(B|A)$).
  3.  **Result:** The only way both of these can be true is if your probability function is **trivial**.

  "Trivial" here means you can't have nuanced beliefs. You would only be able to assign probabilities of 0 or 1 to things, or your language can only distinguish between extremely few possible worlds. Since rational people clearly have nuanced beliefs (e.g., "There's a 70% chance of rain"), **one of the two assumptions must be false.**

  Most philosophers agree Lewis's math is unassailable. So, you have to drop either Assumption 1 (Conditionals are propositions) or Assumption 2 (The Thesis).

  ### 2. The Suppositional Theory's Move (The Loophole)

  This is where the Suppositional Theory (championed by Ernest Adams before Lewis, and Dorothy Edgington after him) comes in.

  **They drop Assumption 1.**

  The Suppositionalists say: *"Lewis is right. You cannot treat 'If A then B' as a standard proposition with a truth value. It is not a fact about the world that can be true or false in the standard sense."*

  Instead, they argue that conditionals are **suppositional**. To assert "If A then B" is not to assert a fact; it is to express a **conditional belief**.
  *   **Standard Proposition:** "It is raining." (True/False depending on the world).
  *   **Conditional:** "If it is raining, the match is cancelled." (This doesn't describe the world; it describes your *inference* from rain to cancellation).

  Because they deny that conditionals have "truth conditions," Lewis's result doesn't apply to them. Lewis's proof requires the conditional to be a proposition that can be plugged into standard probability formulas as a truth-bearer. If it's not a truth-bearer, the math doesn't constrain it in the same way.

  So, when a Suppositionalist says $P(\text{If } A \text{ then } B) = P(B|A)$, they do **not** mean "The probability that the proposition 'If A then B' is true." They mean: **"The degree to which I am prepared to assert 'If A then B' is equal to my degree of belief in B, given A."**

  They replace *truth* with **assertibility**.

  ### 3. Are They Talking Past Each Other?

  Not exactly. It is a genuine philosophical disagreement about the nature of language, but they have carved out distinct territories.

  *   **The Truth-Conditional Camp:** Believes all meaningful sentences must be true or false. Because of Lewis, they generally have to reject the Thesis ($P(A \rightarrow B) \neq P(B|A)$). They often argue the probability of the conditional is actually the probability of the *material conditional* (which leads to its own famous paradoxes).
  *   **The Suppositional Camp:** Believes the Thesis is too intuitive to give up (it matches how humans actually reason). Because of Lewis, they have to reject the idea that conditionals are true or false.

  Lewis himself acknowledged this loophole. He famously wrote that if one denies that conditionals express propositions, his triviality result does not hold. He didn't think that was a good move (he preferred truth-conditions), but he admitted it was logically consistent.

  ### 4. Is the Suppositional Theory a Live Option?

  **Yes, absolutely.** In fact, in cognitive science and psychology of reasoning, the Suppositional Theory (often called the "New Paradigm") is currently dominant. Psychologists like David Over and Jonathan Evans have found experimental evidence that people *do* reason using $P(B|A)$ rather than truth tables.

  However, for a journalist, there are two "costs" of this theory you should be aware of so you don't oversimplify:

  1.  **The Embedding Problem:** If conditionals aren't propositions (they aren't true/false), it becomes very hard to explain how we use them in complex sentences.
      *   *Example:* "If it rains, then if the match is on, it will be wet."
      *   *Example:* "Either if it rains the match is cancelled, or if it shines the match is on."
      *   Standard logic handles these easily. Suppositional theory has to work very hard to explain what these mean if the parts don't have truth values.
  2.  **The Notion of "Probability":** If the conditional isn't a proposition, strictly speaking, it doesn't *have* a probability (since probability applies to propositions/events). Suppositionalists have to clarify that they are talking about *degrees of belief* or *assertibility conditions*, not objective probabilities of facts.

  ### 5. Summary for Your Piece

  If you are writing this up, here is the safest, most accurate framing:

  *   **The Hook:** Lewis proved you can't have your cake and eat it too: You can't treat conditionals as standard facts *and* say their probability is $P(B|A)$.
  *   **The Conflict:** This split the field. One side saved "facts" and sacrificed the equation. The other side saved the equation and sacrificed "facts."
  *   **The Suppositional View:** This view (Edgington, Adams) chooses the equation. They argue conditionals aren't descriptions of reality, but tools for reasoning under uncertainty. Lewis's result doesn't kill this; it just forces it to admit that conditionals aren't "true" or "false" in the standard way.
  *   **Current Consensus:** There is no consensus. However, the Suppositional Theory is the leading contender in psychology and epistemology, while truth-conditional accounts remain strong in formal semantics.

  **The Bottom Line:** You are not misunderstanding the math; you are misunderstanding the metaphysics. Lewis killed the **Truth-Conditional** version of the Thesis. The Suppositional Theory survives by ceasing to be Truth-Conditional. It is a live, vibrant, but controversial option.

  ***

  **Recommended Sources for Verification:**
  *   **Dorothy Edgington:** *"On Conditionals"* (Mind, 1995) is the definitive defense of the Suppositional Theory post-Lewis.
  *   **David Lewis:** *"Probabilities of Conditionals and Conditional Probabilities"* (Philosophical Review, 1976).
  *   **Richard Bradley:** *"A Defence of the Triviality Result"* (for the counter-argument that the Suppositionalist loophole has its own costs).
  *   **Mike Oaksford & Nick Chater:** *"Bayesian Rationality"* (for the cognitive science perspective supporting the Suppositional view).
