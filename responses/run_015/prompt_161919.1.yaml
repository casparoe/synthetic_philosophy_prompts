      *   *Claim 3 (Design Stance requires a Designer):* Dennett definitely applies the design stance to evolution. Nature is a "blind watchmaker." Things can be *designed* by natural selection without a *designer*. So this claim is false regarding Dennett.
      *   *Claim 4 (Real Patterns = Compression/Description):* This is close to Dennett's "Real Patterns" paper. A pattern is real if it allows prediction/compression. *However*, the chapter adds: "a regularity no one has yet described isn't a real pattern yet." Dennett would say the pattern exists independently of being described, provided it *could* be described to gain predictive purchase. Also, "if you can find some way of compressing... you have shown a real pattern." Dennett requires the pattern to be robust and projectable, not just ad-hoc compression.
