answer: |-
  **To:** Interdisciplinary Working Group on Bounded Rationality
  **From:** Advisory Committee
  **Subject:** Three-Year Research Agenda: Normative Foundations of Satisficing in Dynamic Environments

  ### Executive Summary

  Your mandate is to shift satisficing from a descriptive account of cognitive limitation to a normative framework for rational choice under structural complexity. To achieve this within three years without relying on large-scale empirical data, you must avoid "tweaking" existing heuristic models. Instead, you must target the conceptual fault lines where optimization theory breaks down structurally, not just psychologically.

  We rank the following three lines of inquiry as critical. The ranking reflects logical dependency: you cannot justify satisficing as a policy (Item 2) or implement it robustly (Item 3) until you have resolved the normative status of the agent's objective function (Item 1). Throughout this agenda, the tension between **Local Satisficing** (stopping search within a fixed frame) and **Framing Satisficing** (revising the "good enough" threshold as the frame shifts) serves as the primary diagnostic tool. If a problem can be solved by Local Satisficing, it is derivative; if it requires Framing Satisficing, it is foundational.

  ---

  ### 1. The Normative Validity of Endogenous Threshold Revision
  **Rank:** 1 (Foundational)

  **The Question:** Under what conditions is the endogenous adaptation of aspiration levels a rational response to environmental structure rather than a cognitive failure of consistency?
  Current literature treats aspiration adaptation (e.g., lowering standards after failure) as a descriptive psychological mechanism. To make satisficing normative, you must demonstrate that in specific contexts, holding a fixed utility function is *itself* irrational. This requires resolving the Local vs. Framing tension: does the agent stop because they found a good option (Local), or because the search process revealed that their initial threshold was ill-posed relative to the option space (Framing)?

  **(i) Upstream Status**
  This is the prerequisite for all subsequent work. If endogenous threshold revision is merely "coping," then satisficing remains a second-best descriptive approximation of optimization. If it is normative, it displaces expected utility theory in dynamic contexts. Downstream debates in **welfare economics** (what counts as well-being if preferences adapt?) and **moral philosophy** (is adaptive preference formation autonomy or oppression?) depend entirely on this distinction. You cannot design institutions (Item 3) to support satisficing if you cannot define whether the satisficing threshold represents a valid goal.

  **(ii) Tractability (3-Year Window)**
  This is highly tractable for philosophers and modelers without new data.
  *   **Philosophers:** Can produce a conceptual taxonomy distinguishing *rational frame-updating* (learning about the structure of value) from *adaptive resignation* (sour grapes).
  *   **Modelers:** Can construct dynamic programming models where the cost of maintaining a fixed utility function exceeds the cost of threshold revision.
  *   **Deliverable:** A formal proof or conceptual argument establishing a "Rationality of Revision" theorem. This would define the boundary conditions where Framing Satisficing dominates Fixed-Frame Optimization normatively.

  **(iii) Reordering Conditions**
  This drops in priority only if the group produces a formal impossibility result showing that endogenous thresholds cannot be distinguished from arbitrary preference drift without external empirical grounding. If external behavioral data (from other labs) emerges showing that aspiration adaptation is purely noise-driven rather than structure-sensitive, this line of work becomes purely philosophical speculation and should be deprioritized in favor of Item 2.

  ---

  ### 2. Tractability Bounds in Super-Linear Option Landscapes
  **Rank:** 2 (Structural Justification)

  **The Question:** Can we formally prove that satisficing is the *only* computationally stable policy when the option space expands faster than evaluation capacity?
  Standard optimal stopping theory assumes a known distribution or a stationary environment. Your agenda specifies contexts where the option space expands faster than evaluation capacity (e.g., digital markets, scientific literature). In these "super-linear" landscapes, optimization is not just costly; it is undefined because the target moves faster than the projectile.

  **(i) Upstream Status**
  This provides the *structural* justification for satisficing, complementing the *normative* justification in Item 1. If optimization is mathematically undefined in these environments, then satisficing is not a compromise but the only viable rational strategy. This informs **institutional design** and **mechanism design**: if agents cannot optimize, institutions should not be built assuming they can (e.g., complex contracting, disclosure regimes). It moves the debate from "how to help people optimize better" to "how to design for non-optimizable environments."

  **(ii) Tractability (3-Year Window)**
  This is a natural fit for formal modelers and behavioral economists.
  *   **Modelers:** Can utilize complexity theory and search algorithms to model environments where $|Options(t+1)| > |Evaluation(t)|$.
  *   **Economists:** Can derive regret bounds showing that optimization strategies incur infinite regret in these specific topologies, while satisficing rules bound regret.
  *   **Deliverable:** A set of "Complexity Theorems for Choice." These would formally identify the growth rates of option spaces where expected utility maximization ceases to be a well-defined function, necessitating Framing Satisficing.

  **(iii) Reordering Conditions**
  This moves to Rank 1 if Item 1 stalls on philosophical grounds (i.e., if the group cannot agree on the normative status of adaptation). If the group can prove mathematically that optimization is impossible in these environments, the normative debate becomes moot: necessity dictates normativity. Conversely, if approximation algorithms (from computer science) are shown to solve super-linear search problems efficiently without satisficing rules, this line of inquiry loses its force.

  ---

  ### 3. Reflexive Epistemic Costs and Threshold Stability
  **Rank:** 3 (Robustness & Implementation)

  **The Question:** How must satisficing thresholds adjust when the search process itself degrades the quality of available information?
  In many high-stakes contexts (e.g., job markets, mating markets, security), the act of searching signals information or depletes resources, altering the value of the options remaining. Standard satisficing assumes the option value is static during search. If search is reflexive (it changes the object), a static threshold leads to systematic failure. This tests the limits of Framing Satisficing: can the frame adjust fast enough to track the degradation?

  **(i) Upstream Status**
  This determines the **robustness** of the framework. Even if satisficing is normative (Item 1) and necessary (Item 2), it is useless if the threshold cannot track reflexive costs. This is critical for **policy implementation**. For example, if a regulatory body uses satisficing thresholds for safety approvals, but the testing process itself degrades the system's safety (e.g., stress testing), the policy fails. This moves the agenda from theory to application.

  **(ii) Tractability (3-Year Window)**
  This requires game-theoretic modeling and epistemic logic, well within the group's skillset.
  *   **Modelers:** Can model search as a game against nature or other agents where $Value(Option)$ is a function of $Search\_Intensity$.
  *   **Philosophers:** Can analyze the epistemic conditions required for an agent to know *that* their search is degrading value.
  *   **Deliverable:** A "Stability Condition for Satisficing." This would specify the maximum rate of information degradation under which a satisficing threshold remains reliable without collapsing into random choice.

  **(iii) Reordering Conditions**
  This rises to Rank 2 if initial work on Items 1 and 2 suggests that reflexive costs are the primary driver of optimization failure, rather than option space expansion. If the group finds that super-linear option spaces (Item 2) are rare but reflexive degradation is ubiquitous, resources should shift here. Additionally, if a specific real-world case study (e.g., algorithmic trading or peer review) emerges where degradation is the clear bottleneck, this becomes the priority for institutional design recommendations.

  ---

  ### Strategic Note on the Local vs. Framing Tension

  Do not treat the distinction between **Local** and **Framing** satisficing as a binary classification of agents. Treat it as a **diagnostic of the environment**.

  *   **Derivative Adjustments:** If a problem can be solved by a Local Satisficing rule (a better stopping rule within a fixed frame), it is an optimization problem with search costs. Do not spend significant time here; the literature is saturated.
  *   **Foundational Problems:** If a problem *requires* the threshold itself to shift to maintain coherence (Framing Satisficing), it challenges the standard model of rationality.

  **Allocation of Effort:**
  *   **Year 1:** Focus 80% on **Item 1**. You must agree on what "rational adaptation" means. Without this, the modeling in Years 2 and 3 lacks a normative target.
  *   **Year 2:** Focus 60% on **Item 2**. Build the formal models that prove the necessity of the framework defined in Year 1.
  *   **Year 3:** Focus 50% on **Item 3**. Stress-test the models from Year 2 against reflexive costs to produce robust design principles.

  This agenda ensures that by the end of the funding cycle, you will have produced a defended normative theory (Item 1), a structural proof of necessity (Item 2), and a set of robustness conditions for implementation (Item 3).
