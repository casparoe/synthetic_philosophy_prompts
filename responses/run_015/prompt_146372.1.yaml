prompt: |-
  Hi. I'm one of two people who cover the clinical ethics consult line at a 400-bed community hospital — the other is a nurse practitioner, I'm a hospitalist by training, and between us we have maybe one undergrad philosophy course that I mostly slept through. We get paged three or four times a month, almost always at 2am, almost always by phone, with the family at the bedside and the charge nurse wanting an answer before shift change. I've got 20–30 minutes and whatever's in the EMR. What comes out the other end is a short note in the chart that the attending signs and, if anything is even slightly unusual, risk management has to be able to defend a year later.

  The consults that actually wreck me are all the same shape underneath: is what we're about to do *stopping something* or *making something happen*, and does that difference matter here. The team's working distinction is our medical director's slogan — "we don't do things to kill people, we just stop doing things to them" — which is fine as a bumper sticker and useless at 2am. And the half-remembered philosophy I have doesn't convert either: something about double effect, and something about whether you initiate a lethal sequence or just fail to interrupt one (the "direction of agency," I want to say? whoever it was seems to think *that* is the real cut, not the bodily-movement one). I can't turn either into a checklist, and I've noticed we can't even get started because "letting die" needs a baseline and I genuinely don't know which baseline to use: the disease's natural course (in which case nobody in an ICU is ever "allowing" anything), the patient's current supported state (in which case every withdrawal is a killing), or just whatever this unit normally does for this diagnosis (which feels like it makes the whole thing a local custom with moral language stapled to it). Pick one for me, tell me what breaks under the other two, and mark clearly which part of that choice is a values call I should be naming out loud in the note instead of burying.

  So: write me a decision procedure my NP or I can actually run at 2am, in order, with what counts as a sufficient answer to each question, where it hard-stops with a no, and where it hands off to a person because the question is one of values or of facts nobody can get in thirty minutes. Please keep three questions separate that we constantly mush together: (1) is this permissible at all, (2) is this what a decent clinician should be offering here (those come apart — we can all feel it, I can't say how), and (3) is it fair to ask *this* nurse to be the one in the room, given that "I'll write the order but I don't want to be there" is a position half our staff holds and I've never decided whether it's coherent. The procedure should also tell us when the right move is to do nothing for twelve hours and re-page, and it should say what the chart note has to contain so it survives risk management — I don't want elegant reasoning that reads badly to a lawyer. Give me a one-page cheat-card version and then a slightly longer annotated version, and be straight with me about which steps are really just the intent/foresight distinction in a lab coat and which ones are doing independent work.

  Then run it on three cases.

  1. Terminal extubation, 58-year-old, hypoxic brain injury, family wants it now, two nurses have said they'd rather not be assigned to the room, and the resident has already put in orders for fentanyl and midazolam "for air hunger" starting before we pull the tube.
  2. Deactivating a destination-therapy LVAD in a 61-year-old who is not otherwise dying — no disease process is going to stop his heart, the pump is the only reason it keeps beating, and if we switch it off he dies in minutes. The team is split on whether this is the same as extubation or is something categorically different, and I can't tell if that split is moral or just squeamishness about hardware.
  3. A 79-year-old on the ventilator with a catastrophic GI bleed, where the plan everyone has quietly agreed to is "no escalation" — no more blood products, no more pressor — while leaving the vent running, which means he dies slowly over a day and a half instead of quickly. I have a horrible feeling your procedure is going to tell me this is not morally different from withdrawing and is *worse for him*, and that we only do it because it feels better to us. If that's where it goes, say so and then tell me what I'm supposed to do with that at 2am with his daughter in the room.

  Finally: tell me where the procedure misfires. I already suspect it'll get gamed by framing (we're very good at describing things as "not starting"), that it'll get used to rubber-stamp whatever the attending wanted, and that getting the metaphysics right does nothing at all for a nurse who's been crying in the break room. But you'll see failure modes I haven't. And please: no citations, no reading lists, no "you should really read X" — I have no library access and I want your argument in your own words, not a map to somebody else's.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Hospitalist covering clinical ethics consults at a 400-bed community hospital. Partnered with an NP. Limited formal ethics training (one undergrad course).
      *   **Context:** High pressure, low resource (2am pages, 20-30 mins, EMR only), high stakes (risk management, legal defensibility, moral distress).
      *   **Core Problem:** Distinguishing between "stopping something" (allowing to die) vs. "making something happen" (killing). The current heuristic ("we don't do things to kill") fails. Confusion about baselines (natural course vs. supported state vs. unit custom).
      *   **Specific Needs:**
          *   A decision procedure (checklist/algorithm) usable at 2am.
          *   Must separate: (1) Permissibility, (2) Clinical Appropriateness (offering), (3) Conscientious Objection/Staff Fairness.
          *   Must indicate when to wait (delay decision).
          *   Must specify chart note requirements for legal defensibility.
          *   Must distinguish between intent/foresight (double effect) and independent work.
          *   Output: One-page cheat card + Annotated version.
          *   Application: Run on three specific cases (Terminal extubation, LVAD deactivation, Slow code/Non-escalation).
          *   Critique: Where does the procedure misfire? (Gaming, rubber-stamping, moral distress).
          *   Constraint: No citations, no reading lists, own words only.

  2.  **Deconstruct the Ethical Problem:**
      *   *The Baseline Issue:* The user asks to pick a baseline.
          *   Option A: Natural course of disease. (Problem: ICU care is *always* intervention, so stopping *anything* looks like killing).
          *   Option B: Current supported state. (Problem: Withdrawing *anything* looks like killing).
          *   Option C: Local custom. (Problem: Moral relativism, inconsistent).
          *   *Decision:* The legally and ethically defensible baseline in US medicine is **Medical Indication + Patient Authority**. It's not about physics (natural vs. artificial); it's about *obligation*. We stop when the treatment is no longer obligatory (either because it's non-beneficial/futile or because the patient refuses it). This sidesteps the metaphysical "killing vs. letting die" trap and focuses on "obligation to treat."
      *   *The Killing vs. Letting Die Distinction:* Legally, withdrawing life-sustaining treatment (LST) is permissible if authorized. Actively administering a lethal drug is not (in most jurisdictions). The "intent/foresight" distinction (Double Effect) is crucial here but needs to be operationalized, not just philosophical.
      *   *The Three Questions:*
          1.  *Permissibility:* Is it legal/ethical? (Right to refuse/stop non-beneficial).
          2.  *Appropriateness:* Is it medically indicated *now*? (Standard of care).
          3.  *Staff Fairness:* Can we ask this nurse? (Conscientious objection vs. duty).

  3.  **Drafting the Decision Procedure (The "2am Algorithm"):**
      *   Needs to be linear.
      *   Needs hard stops.
      *   Needs to address the "baseline" question explicitly.
      *   *Step 1: Authority.* Does the patient/surrogate have the right to say stop? (If yes, permissible).
      *   *Step 2: Indication.* Is the treatment providing benefit proportional to burden? (If no, permissible to stop even if family wants to continue, though harder).
      *   *Step 3: Intent.* Are we treating symptoms or causing death? (Double Effect check).
      *   *Step 4: Staffing.* Conscientious objection handling.
      *   *Step 5: Documentation.* What goes in the note.

  4.  **Refining the Baseline Choice:**
      *   I need to explicitly answer the user's request: "Pick one for me, tell me what breaks under the other two."
      *   *Choice:* **The Baseline of Medical Obligation.** (Treatment is ongoing *only if* it is medically indicated AND authorized).
      *   *Why not Natural Course?* Makes all ICU care "killing" if stopped. Breaks down immediately.
      *   *Why not Current State?* Makes all withdrawal "killing." Legally vulnerable.
      *   *Why Obligation?* Aligns with law (Cruzan, etc.). Treatment is a contract/offer, not a state of nature.

  5.  **Drafting the Case Applications:**
      *   *Case 1 (Extubation):* Classic withdrawal. Permissible (surrogate authority). Intent (symptom control). Staff issue (conscientious objection needs accommodation but not veto).
      *   *Case 2 (LVAD):* Legally equivalent to vent (McFall v. Shimp logic applied to devices). But feels different. Procedure should flag this as "Permissible but High Friction."
      *   *Case 3 (Slow Code/Non-escalation):* This is the trap. "No escalation" while leaving vent on. Is it worse? Yes, potentially prolongs suffering. Procedure needs to flag "Medical Indication" of the *continuing* vent. If vent is non-beneficial, keeping it is unethical. If beneficial, stopping is unethical. The "middle path" is often cowardice.

  6.  **Addressing the "Moral Distress/Staff" Component:**
      *   The user asks about the nurse who says "I'll write the order but don't want to be there."
      *   *Distinction:* Participation vs. Presence.
      *   *Rule:* You can opt out of the *act* (pushing the button/pulling the tube), but you cannot opt out of the *care* (comfort measures) if assigned. However, at 2am, swapping is better than forcing a crying nurse.
      *   *Procedure Step:* Explicitly ask "Is there a staff objection?" If yes, swap if possible. If no swap, does the objection block the act? No.

  7.  **Addressing Risk Management/Documentation:**
      *   Lawyers want: Capacity/Authority, Medical Indication, Intent (Symptom management), Consensus (or process followed).
      *   Avoid: "We decided to let him die."
      *   Use: "Treatment no longer aligns with goals," "Focus shifted to comfort."

  8.  **Critique/Failure Modes:**
      *   Framing effects (Omission bias).
      *   Rubber-stamping attending bias.
      *   Metaphysics doesn't stop crying.
      *   Time pressure (2am is bad for ethics).

  9.  **Review against Constraints:**
      *   No citations? Check.
      *   One-page cheat sheet + Annotated? Check.
      *   Run on 3 cases? Check.
      *   Address baseline choice? Check.
      *   Address 3 distinct questions (Permissibility, Appropriateness, Fairness)? Check.
      *   Tone: Direct, pragmatic, peer-to-peer (hospitalist to hospitalist).

  10. **Final Polish:**
      *   Ensure the distinction between "Double Effect" and "Causation" is clear in the procedure.
      *   Make sure the LVAD case gets the nuance it deserves (it *is* legally withdrawal, but psychologically distinct).
      *   Make sure the "Slow Code" case calls out the moral discomfort honestly.
      *   *Self-Correction on Baseline:* The user asked me to pick a baseline for "letting die." I will argue for **The Baseline of Authorized Intervention**. This means "doing nothing" means "returning to the state where no medical obligation exists," not "returning to nature."
      *   *Self-Correction on Staffing:* Be careful not to validate abandonment. The nurse has a duty to care, but not necessarily to perform the specific act causing distress if others are available. At 2am, availability is low. The procedure must account for reality.

  11. **Drafting the Content:** (Mental outline of the response)
      *   **Introduction:** Acknowledge the grind. Validate the "2am philosophy" problem.
      *   **The Baseline Decision:** Explicitly choose "Medical Obligation" and explain why the others fail legally/clinically.
      *   **The Cheat Card:** Bullet points, bold text, decision tree style.
      *   **The Annotated Version:** Explaining the *why* and the *legal/ethical underpinnings* (without citations).
      *   **Case Runs:** Apply the algorithm strictly.
      *   **Failure Modes:** Honest assessment of where this breaks.

  12. **Refining the "Slow Code" Case:**
      *   This is ethically murky. Often called "non-beneficial treatment." If the vent is keeping him alive but he's dying of GI bleed, is the vent indicated? If the goal is comfort, the vent might be prolonging dying. The procedure should force a decision: Is the vent *helping* achieve the goal? If not, stop it. If yes, keep it. The "middle" is usually fear. I need to be firm here.

  13. **Refining the "Staff Fairness" Question:**
      *   Is it coherent to say "I'll write the order but won't be there"?
      *   Answer: It's coherent as a conscience claim, but operationally difficult. It shifts burden. The procedure should treat this as a resource allocation issue, not just ethics. If no other nurse, the objecting nurse may have to stay but not perform the specific act (if possible), or the ethics consult says "We swap shifts" (hard at 2am). I will advise: Accommodate if safe, but the *patient's* right to treatment (or withdrawal) trumps the *staff's* comfort, though not necessarily their conscience regarding the *act*.

  14. **Final check on "Intent/Foresight":**
      *   Make sure the procedure distinguishes "giving meds to comfort (risk of death)" vs "giving meds to cause death." This is the Double Effect operationalization.

  15. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is the direct answer you asked for. I have skipped the academic preamble. You are operating in a liability minefield with exhausted staff and grieving families. You need a shield, not a seminar.

  ### Part 1: The Baseline Decision

  You asked me to pick a baseline for "letting die" and tell you why the others break.

  **Pick: The Baseline of Medical Obligation.**
  *Definition:* A treatment is "ongoing" only if it is **medically indicated** AND **authorized by the patient/surrogate**. If either condition fails, the treatment is not "being done" to the patient; it is merely "available." Stopping it is not an action of killing; it is a decision to no longer offer an option.

  **Why the others break:**
  1.  **Natural Course of Disease:** If the baseline is "what happens without us," then *every* ICU intervention is an artificial interruption of death. Stopping *anything* (even a peripheral IV) returns the patient to the natural course. This makes every withdrawal a "killing" in the metaphysical sense. Legally, this is indefensible. It paralyzes the team.
  2.  **Current Supported State:** If the baseline is "how they are right now," then turning off a vent is an active intervention that changes physiology to cause death. This aligns with the "killing" narrative. Risk management will eat you alive here because it frames withdrawal as an affirmative act of harm rather than the cessation of a service.

  **The Values Call to Name in the Note:**
  You must explicitly state: *"Continuation of [Treatment] is no longer consistent with the patient's goals of care and/or medical benefit. Therefore, the medical team is under no obligation to continue it."*
  This moves the justification from *physics* (what causes the heart to stop) to *contract* (what are we obligated to provide). This is the only baseline that survives a lawsuit.

  ***

  ### Part 2: The 2am Decision Procedure (Cheat Card)

  **Print this. Laminate it. Keep it in your badge holder.**

  **STEP 1: AUTHORITY (The "Can We?" Check)**
  *   **Q:** Is there a valid surrogate or advance directive authorizing this stop/change?
  *   **YES:** Proceed to Step 2.
  *   **NO:** **HARD STOP.** Do not withdraw. Treat as full code until surrogate is located or court order obtained. (Exception: Imminent death where treatment is physically impossible to continue).
  *   **Note:** "Surrogate [Name] authorized per [Document/Conversation]."

  **STEP 2: INDICATION (The "Should We?" Check)**
  *   **Q:** Does this treatment offer a reasonable chance of achieving the patient's stated goals (survival, recovery, comfort)?
  *   **YES (Treatment works & matches goals):** Do not stop. If family demands stop, escalate to Risk/Admin.
  *   **NO (Treatment futile OR burdens outweigh benefits):** Proceed to Step 3.
  *   **Note:** "Treatment no longer provides benefit proportional to burden given prognosis of [X]."

  **STEP 3: INTENT (The "Double Effect" Check)**
  *   **Q:** Is the primary intent of the order to relieve symptoms (dyspnea, pain, agitation)?
  *   **YES:** Proceed to Step 4. (Risk of hastening death is foreseen but not intended).
  *   **NO (Intent is to cause death to end suffering):** **HARD STOP.** This is euthanasia. Do not write order.
  *   **Note:** "Medications titrated for symptom control of air hunger/pain."

  **STEP 4: STAFFING (The "Fairness" Check)**
  *   **Q:** Is there a nurse assigned who conscientiously objects to being present for the withdrawal?
  *   **NO:** Proceed.
  *   **YES:** Can you swap to a willing nurse *without* delaying care or compromising safety?
      *   **YES:** Swap.
      *   **NO:** Objecting nurse remains responsible for *comfort care*, but another provider (MD/NP) should perform the specific act of withdrawal (extubation/device off) if possible. If no one else exists, objecting nurse must provide care (duty to patient trumps discomfort), but debrief immediately after.
  *   **Note:** "Staffing accommodations made to support team moral resilience."

  **STEP 5: TIMING (The "Wait?" Check)**
  *   **Q:** Is there new information expected within 12 hours (family arrival, test result, second opinion)?
  *   **YES:** **PAUSE.** Maintain current support. Re-evaluate at [Time]. Tell family: "We are pausing to ensure we have everyone aligned."
  *   **NO:** Proceed to execution.

  **STEP 6: DOCUMENTATION (The "Shield")**
  *   **Must Include:**
      1.  Who authorized (Surrogate name/relationship).
      2.  Why it's medically appropriate (Prognosis/Goals mismatch).
      3.  That symptom management is the priority (Intent).
      4.  That the team discussed this (Consensus).
  *   **Forbidden:** "We decided to let him die," "Terminal sedation," "Killing."
  *   **Use:** "Compassionate extubation," "Focus on comfort measures," "Withdrawal of non-beneficial life support."

  ***

  ### Part 3: Annotated Version (For Your Understanding)

  **Step 1 (Authority):** This is your legal shield. In the US, the right to refuse treatment is constitutionally protected. If the surrogate says stop, you generally must stop, even if you think they are wrong (unless it's clearly abuse/neglect, which is rare in end-of-life). If you don't have authority, you are practicing battery if you stop, and negligence if you continue. You need the signature or the documented verbal consent.

  **Step 2 (Indication):** This separates *Permissibility* from *Appropriateness*. Just because a family *can* ask to stop doesn't mean you *should* offer it if the patient is going to walk out tomorrow. Conversely, if the patient is brain dead, you are not obligated to continue even if the family begs. This step protects you from "defensive medicine" (keeping them on the vent just to avoid a fight) and from "capitulation" (stopping on a patient who could recover).

  **Step 3 (Intent):** This is the **Double Effect** operationalized.
  *   *Independent Work:* This step does work that Step 2 does not. Step 2 asks if the *vent* is useful. Step 3 asks if the *morphine* is useful.
  *   *The Trap:* If you order a paralytic with the morphine, your intent shifts from "comfort" to "ensure death." That is a hard stop.
  *   *The Lab Coat:* Yes, this is the intent/foresight distinction. It matters legally. A jury will forgive a dose of morphine that suppresses respiration if the chart says "for air hunger." They will not forgive a dose labeled "to ensure passing."

  **Step 4 (Staffing):** This addresses your third question.
  *   *Is "I'll write the order but won't be there" coherent?* Yes, morally. No, operationally.
  *   *The Rule:* A clinician can object to the *act* of killing (or what they perceive as killing). They cannot object to the *care* of the patient.
  *   *The 2am Reality:* You likely can't swap nurses. If the nurse refuses to be in the room, you (the Hospitalist/NP) must be in the room. Do not leave the family alone with a dead body they just helped create. If the nurse refuses to hang the morphine, you hang it. Do not force a trembling nurse to push the plunger; it creates a witness who feels victimized. But do not let the nurse abandon the patient.

  **Step 5 (Timing):** Ethics consults at 2am are often panic calls. If the patient isn't coding *right now*, buy time. Morning brings daylight, more staff, and calmer families. "Waiting" is a clinical order. Write it.

  **Step 6 (Documentation):** Risk Management reads for causation and authorization.
  *   *Bad:* "Patient expired following removal of vent." (Implies vent removal caused death).
  *   *Good:* "Patient expired due to underlying hypoxic injury following withdrawal of non-beneficial support." (Implies disease caused death, support was optional).

  ***

  ### Part 4: Running the Cases

  **Case 1: Terminal Extubation (58M, Hypoxic Brain Injury)**
  *   **Step 1 (Authority):** Family wants it now. Assume surrogate is valid. **PASS.**
  *   **Step 2 (Indication):** Hypoxic brain injury, likely permanent vegetative state or worse. Vent is sustaining biology, not recovery. **PASS.**
  *   **Step 3 (Intent):** Orders for fentanyl/midazolam *before* pull. This is correct. Intent is air hunger. **PASS.**
  *   **Step 4 (Staffing):** Two nurses object. Can you swap at 2am? Probably not.
      *   *Action:* You (MD/NP) perform the extubation. Nurses provide comfort care and family support. Do not force them to touch the tube.
  *   **Step 5 (Timing):** Family wants it "now." If patient is stable on vent, wait until 7am for family support services unless he is actively suffering on the vent. If he is fighting the vent, do it now.
  *   **Verdict:** **Permissible.**
  *   **Note:** "Surrogate authorized withdrawal. Support no longer aligns with goals. Meds titrated for comfort. Staff accommodations made."

  **Case 2: LVAD Deactivation (61M, Destination Therapy)**
  *   **Step 1 (Authority):** Patient/Surrogate requests stop. **PASS.**
  *   **Step 2 (Indication):** Patient is "not otherwise dying." This is the friction point. The device *is* the heart.
      *   *Analysis:* Legally, an LVAD is life-sustaining treatment, same as a vent. A patient has the right to refuse a heart transplant; they have the right to turn off the pump.
      *   *Decision:* **PASS.** (Do not let the "hardware" distinction fool you. It is a treatment).
  *   **Step 3 (Intent):** Turning it off causes immediate death.
      *   *Crucial:* You must still treat symptoms. He will not feel "air hunger" (heart stops, not lungs), but he may feel anxiety/panic. Order anxiolytics.
      *   *Intent Check:* Are you turning it off to kill him? No, to respect refusal of treatment. **PASS.**
  *   **Step 4 (Staffing):** Team is split. This is high moral distress.
      *   *Action:* Find the specific objector. If the bedside nurse objects, swap. If the cardiologist objects, you (Hospitalist) write the order. Do not let the "split" paralyze the patient's right.
  *   **Verdict:** **Permissible, but High Risk.**
  *   **Note:** "LVAD classified as life-sustaining treatment. Patient/Surrogate exercising right to refuse. Device deactivation is withdrawal of treatment, not active euthanasia." (Use those exact words for Risk Management).

  **Case 3: The "Slow Code" (79F, GI Bleed, No Escalation, Vent On)**
  *   **Step 1 (Authority):** "Everyone quietly agreed." **FAIL.**
      *   *Stop:* "Quiet agreement" is not authorization. Has the daughter explicitly agreed to "No Blood, No Pressors"? If not, you are practicing without consent.
  *   **Step 2 (Indication):** Vent is running. Blood/Pressors stopped.
      *   *Analysis:* You identified this correctly. This is often *worse* than extubation. It prolongs the dying process without offering recovery. The vent is now non-beneficial support if the goal is comfort, because she cannot be extubated and survive.
      *   *Decision:* **FAIL.** The current plan is medically incoherent. It is neither curative (no blood) nor palliative (vent keeps her alive to bleed).
  *   **Step 3 (Intent):** The intent is "we don't want to be the ones to turn it off." This is provider convenience, not patient benefit.
  *   **Step 4 (Staffing):** Nurses know this is a slow death. Moral distress will be higher here than in Case 1.
  *   **Step 5 (Timing):** **PAUSE.** Do not let this continue at 2am.
  *   **Action:** You must have the hard conversation with the daughter *now*.
      *   *Script:* "We are not giving blood, which means she will not survive this bleed. The ventilator is keeping her breathing while her body shuts down. This may take a day or two and can be distressing. We can make her comfortable and allow her to pass more peacefully by removing the tube, or we can continue as is. But we need to know what you want, because 'no blood' means she is dying."
  *   **Verdict:** **Current Plan is Unethical.** Force a choice: Full Comfort (Extubate) or Full Treatment (Blood). The middle is cowardice.
  *   **Note:** "Discussion held with surrogate regarding futility of continued ventilation in setting of non-escalation. Plan revised to [Comfort Care/Full Support]."

  ***

  ### Part 5: Where This Procedure Misfires

  You asked for honesty about failure modes. Here is where this algorithm will break in your hands.

  **1. The Framing Game (Omission Bias)**
  *   **Failure:** Attending says, "Let's just not start the dialysis." vs "Let's stop the dialysis."
  *   **Risk:** The procedure treats these as identical (Medical Obligation baseline). But staff and families feel them differently. "Stopping" feels like killing. "Not starting" feels like nature.
  *   **Mitigation:** The procedure forces you to call them the same. This will cause friction. You will have to tell the resident, "It doesn't matter if you haven't turned it on yet; if you are obligated to, not turning it on is the same as stopping." Staff will resent this equivalence.

  **2. The Rubber Stamp**
  *   **Failure:** You are tired. The Attending wants the bed. The family is exhausted. You run the checklist, tick the boxes, and sign.
  *   **Risk:** The procedure becomes a bureaucratic hurdle rather than a moral check. You can validate a bad decision if the Authority step is met (e.g., a surrogate who doesn't understand the prognosis).
  *   **Mitigation:** Step 2 (Indication) is your only brake. You must be willing to say "No" to a surrogate if the treatment is clearly beneficial and they are refusing based on misinformation. But at 2am, you won't do this. You will cave. Acknowledge this weakness.

  **3. The Crying Nurse**
  *   **Failure:** The procedure says "Swap if possible." At 2am, there is no swap. The procedure says "Nurse must provide care."
  *   **Risk:** You get a nurse who is technically compliant but emotionally absent, or who quits next week. Metaphysics does not stop moral injury.
  *   **Mitigation:** The procedure cannot fix this. Only culture can. If you use this checklist to force a nurse to participate in what they believe is killing, you have used ethics as a weapon.
  *   **Fix:** If a nurse objects at 2am and no swap is possible, **you** do the physical act. Do not make the nurse choose between their license and their conscience. You are the consultant; you take the heat.

  **4. The "Slow Code" Trap**
  *   **Failure:** Case 3 shows the procedure will flag "non-escalation" as incoherent. But often, this is the only compromise the family can accept *tonight*.
  *   **Risk:** If you force the binary (Extubate vs. Full Code), the family may choose Full Code out of panic, leading to invasive suffering they didn't want.
  *   **Mitigation:** Sometimes the "Slow Code" is a bridge to acceptance. Use the procedure to identify it as unstable, but allow it for *one shift* if it prevents a traumatic confrontation, with a hard deadline for re-evaluation (Step 5).

  **Final Word:**
  This procedure protects you legally by anchoring decisions in **Authority** and **Indication** rather than **Physics**. It protects you morally by forcing you to name **Intent**. It will not stop the phone from ringing at 2am, and it will not dry the tears in the break room. But it will give you a sentence to write in the chart that lets you sleep for four hours before the next page.
