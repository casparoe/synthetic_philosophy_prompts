answer: |-
  # Joint Statement on Model Grounding
  **Authors:** Priya [Embodied Cognition Lead], Tomas [Systems Integration Lead]
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Vision-Language Grounding

  ## 1. Agreed Claims
  We agree on the following baseline propositions. These form the foundation of our shared engineering practice, regardless of our theoretical divergence.

  1.  **Syntax is not Semantics:** Neither of us believes that symbol manipulation (syntax) alone generates meaning (semantics). A system that shuffles tokens without regard for their relationship to the world is not grounded.
  2.  **Perceptual Asymmetry:** We agree that a text-only model lacks direct access to perceptible properties (e.g., weight, friction, luminance) that an embodied model possesses. There are systematic generalizations an embodied system can make that a text-only system cannot, purely due to data modality.
  3.  **Polysemy of "Grounding":** We acknowledge that the word "grounded" is currently doing three distinct jobs in our discussions: (a) **Reference Fixing** (what determines what a symbol points to), (b) **Robustness** (performance under distribution shift), and (c) **Understanding** (possession of a causal model vs. statistical correlation). Much of our debate stems from prioritizing (a) vs. (b).
  4.  **Embodiment Adds Value:** We agree that integrating video, depth, and force-torque readings improves task success rates and safety in the warehouse. We disagree on whether this improvement constitutes "grounding" or merely "better features."

  ## 2. Nature of the Disagreement
  We have separated our dispute into verbal and substantive components.

  *   **Verbal Dispute:** We are partially talking past each other regarding the definition of "reference." Priya uses a **Causal-Historical** definition (a symbol refers to X only if caused by X). Tomas uses a **Functional-Role** definition (a symbol refers to X if it plays the "X-role" in the system's successful behavior). If we standardize on "Reference = Causal History," Priya wins by definition. If we standardize on "Reference = Functional Success," Tomas wins by definition.
  *   **Substantive Dispute:** The core non-verbal disagreement is about **generalization limits**. Priya claims that without causal hookup, the system will fail on novel counterfactuals where statistical correlations break. Tomas claims that if the functional integration of sensors is tight enough, the distinction between "causal hookup" and "high-fidelity statistical correlation" vanishes in practice.
  *   **The "Hard" Problem:** Priya suspects that phenomenal content (what it is *like* to sense force) matters for true understanding. Tomas rejects this as unmeasurable and irrelevant to shipping. We acknowledge this specific crux may be empirically undecidable.

  ## 3. Disagreements, Cruxes, and Pre-Registered Tests

  | Crux (The Sub-Question) | Test Case (Pre-Registered Protocol) | Priya's Prediction (Causal View) | Tomas's Prediction (Functional View) | What Would Change Our Minds |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Necessity of Linguistic Scaffolding**<br>Can a new sensor channel ground a concept *without* prior linguistic association, purely via causal interaction? | **The Unlabelled Channel Test**<br>Install a sensor measuring a physical property absent from training text (e.g., *coefficient of restitution* / "bounciness"). Do not label this channel in text. Task: Ask "Will this object bounce?" zero-shot. | **Success implies Grounding.**<br>If the model answers correctly, it is because the causal link between the sensor and the physical property fixed the reference of the internal state, allowing it to map to "bounce" via physical analogy. | **Success implies Generalization.**<br>If the model answers correctly, it is because the latent space structure of the new sensor data statistically aligns with existing "bounce" concepts. The sensor is just another feature vector. | **Priya:** If the model succeeds *only* when explicitly trained on text labels for the new sensor, I will concede that causal links alone don't fix reference.<br>**Tomas:** If the model succeeds zero-shot *but* fails when the causal link is severed (see Test 3), I will concede that statistics alone are insufficient. |
  | **2. Distal vs. Proximal Reference**<br>Does "Red" refer to the surface property of the object (Distal) or the activation of Sensor Channel 1 (Proximal)? | **The Swapped-Channel Test**<br>Physically swap the wiring for the "Red" and "Green" camera channels. The robot sees green objects as "Red" data. Task: "Pick the red bin." (Green bin is the target due to swap). | **Reference Failure.**<br>The robot is *not* grounded to "Red." It is hallucinating reference. It refers to Green but says "Red." It is systematically wrong about the world, even if it picks the correct bin. | **Reference Shift.**<br>The robot *is* grounded. "Red" now functionally means "Activate Channel 1." As long as it successfully picks the target bin, the grounding is intact. The meaning shifted with the sensor. | **Priya:** If the swapped robot can successfully explain *why* it picked the bin using correct color physics (e.g., "This reflects 700nm"), I will concede reference is functional.<br>**Tomas:** If the swapped robot fails tasks requiring knowledge of the *distal* property (e.g., "Will this fade in sunlight?") despite succeeding on picking, I will concede distal properties matter. |
  | **3. Causal Model vs. Statistical Correlation**<br>Does the system understand *why* things happen, or just *that* they happen? | **The Intervention Test**<br>Present a novel physical setup where visual correlation breaks but causal logic holds (e.g., a heavy box painted to look light, on a low-friction surface). Ask: "What happens if I push this?" | **Causal Advantage.**<br>A grounded system uses force-torque/depth history to simulate the push. It predicts the slide correctly despite visual cues. A non-grounded system relies on visual priors and predicts a struggle. | **Parity.**<br>If the model is sufficiently trained on diverse physics, its statistical predictions will match the causal simulation. There is no measurable difference in output between "understanding" and "perfect prediction." | **Priya:** If a text-only model fine-tuned on transcripts of this test performs as well as the embodied robot, I will concede embodiment adds no semantic value.<br>**Tomas:** If the embodied robot systematically fails these counterfactuals despite having the sensor data, I will concede that sensors don't grant "understanding." |

  ## 4. Honesty on Movability
  We conclude with an assessment of whether these tests can actually resolve the argument.

  *   **The Verbal Trap:** We acknowledge that Test 2 (Swapped Channel) may not resolve the dispute because we define "success" differently. Priya defines success as "tracking the distal truth." Tomas defines success as "completing the task." We agree to record both metrics (Task Success Rate vs. Distal Accuracy) to prevent talking past each other.
  *   **The Empirical Limit:** Test 3 (Intervention) is the most likely to yield a decisive engineering result. If the embodied model significantly outperforms the text-only baseline on *novel* physical counterfactuals, Priya's claim that "perception fixes reference in a way text cannot" gains empirical weight. If performance is identical, Tomas's claim that "grounding is just fancy statistics" is strengthened.
  *   **The Unresolvable Crux:** We admit that if the question is "Does the robot *feel* the force?", no test will settle it. Priya views this as essential to grounding; Tomas views it as a category error. We agree to bracket the question of consciousness and focus on **generalization under distribution shift**. If the system behaves *as if* it is grounded in all measurable ways, Tomas argues the distinction is moot. Priya argues the distinction matters for safety certification (knowing *why* it works vs. *that* it works).

  **Signatures:**

  _____________________ (Priya)

  _____________________ (Tomas)
