      *   *Reality:* Multilevel selection is concurrent. Genes still replicate differentially within humans.
      *   *Why co-active:* Lower-level selfishness (cancer, free-riders) constantly threatens higher-level integrity, requiring ongoing suppression.
      *   *Human context:* Cultural evolution adds a layer, but biological gene selection persists (e.g., lactose tolerance, disease resistance).

