      *   *Refining the "Single Revision":* The user needs to choose: Is it *Justified* (Consequentialist/Utilitarian lean) or *Wrong but Necessary* (Deontological/Dirty Hands)? They are trying to have both. Dropping the claim that it is "justified" (b) in favor of "necessary but wrong" (g) cleans up the legal/moral conflict. OR, drop the punishment (c) if it's truly justified. But (c) is politically crucial for their institutional argument. So, drop the "justified" claim in (b). Call it "morally necessary but morally wrong."

