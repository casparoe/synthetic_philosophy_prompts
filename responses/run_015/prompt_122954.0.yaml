  2.  **Deconstruct the Linguistic/Stylistic Issue:**
      *   The core tension is between *grammatical mood* (indicative vs. subjunctive/counterfactual) and *narrative perspective* (omniscient fact vs. character uncertainty).
      *   *Counterfactual:* "If he had known..." (He didn't know).
      *   *Open/Indicative:* "If she was lying..." (She might be, we don't know yet).
      *   *Factual/Concessive:* "If he died..." (He probably did, or it doesn't matter *whether* he did, the result is the same).
      *   *Free Indirect Style (FIS):* Blurs narrator and character voice. Ambiguity is often a feature, not a bug. Copy editors usually prefer clarity/consistency.

  3.  **Develop the Procedure (The "Protocol"):**
      *   Needs to be simple, fast, and actionable.
      *   *Step 1: The Fact Check.* Does the text confirm the "if" part happened or not?
      *   *Step 2: The Mind Check.* Whose uncertainty is this? (Narrator or Character?)
      *   *Step 3: The Tense Check.* Is the grammar matching the intended reality? (Had known vs. Knew).
      *   *Step 4: The Ambiguity Flag.* Is the ambiguity intentional?
      *   *Decision Tree:*
          *   If grammar contradicts established fact -> Rewrite.
          *   If grammar contradicts intended perspective -> Rewrite.
          *   If ambiguity is intentional -> Defer to Author (Flag but pass).
          *   If unclear even to author -> Rewrite.

  4.  **Drafting the Procedure (Iterative refinement for speed and clarity):**
      *   *Name:* The Conditional Clarity Protocol (CCP).
      *   *Time limit:* 10 seconds.
      *   *Questions:*
          1.  Is the "if" condition true, false, or unknown in the story *so far*?
          2.  Does the verb tense match that status? (Had = false, Was/Is = unknown/true).
          3.  Is the uncertainty the character's or the narrator's?
          4.  Is the ambiguity deliberate?
      *   *Verdicts:* Pass, Flag for Author, Must Change.

  5.  **Applying the Procedure to the Three Sentences:**

      *   **Sentence 1:** "If he had known about the letter, he would have taken the morning train."
          *   *Grammar:* Past Perfect ("had known") + Conditional Perfect ("would have taken"). This is a standard counterfactual.
          *   *Meaning:* He did *not* know. He did *not* take the train.
          *   *Commitment:* Hard fact.
          *   *Verdict:* Grammatically solid. Only changes if the author *wants* it to be ambiguous whether he knew.

      *   **Sentence 2:** "If she was lying about the fire, then everything he had built on her account was already ash."
          *   *Grammar:* Past Simple ("was lying") + Past Perfect ("had built"). This is an open conditional in the past.
          *   *Meaning:* We don't know if she was lying. But *if* she was, the consequence follows.
          *   *Commitment:* Epistemic uncertainty.
          *   *Verdict:* Standard for FIS. Editor shouldn't touch unless context proves she *was* or *wasn't* lying already.

      *   **Sentence 3:** "If he died in the fire, he died believing she had left him."
          *   *Grammar:* Past Simple ("died") + Past Simple ("died"). This is a concessive or factual conditional.
          *   *Meaning:* It implies he likely died, or the specific belief holds true regardless of the death's confirmation. It often signals resignation.
          *   *Commitment:* Ambiguous on the death, definite on the belief *in the event of* death.
          *   *Verdict:* This is the tricky one. It's stylistically potent. Editor might want "If he *had* died" (counterfactual) or "Since he died" (factual). But "If he died" is valid for "Whether he died or not."

