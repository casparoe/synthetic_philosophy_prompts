answer: |-
  **Activity: The Causal Timeline (45 minutes)**

  **1. The Phenomenon (10 min)**
  Project a simple animation: A red dot appears left (50ms), disappears. A green dot appears right (50ms), disappears. Inter-stimulus interval (ISI) is critical (approx. 100ms). Instruct students to fixate center. After 10 trials, ask for verbal reports. Most will report a single dot moving left-to-right, changing color mid-path. This is the Color Phi phenomenon.

  **2. The Commitment (15 min)**
  Divide class into three groups. Each group must draw a **Causal Timeline** explaining the report. The timeline must mark: (A) Stimulus onset, (B) Neural processing complete, (C) Conscious experience onset, (D) Memory encoding.
  *   **Group 1** must argue for a "Delay" model (consciousness waits for all data).
  *   **Group 2** must argue for a "Revision" model (consciousness happens immediately, memory is overwritten).
  *   **Group 3** acts as Auditors. They collect the behavioral data (the reports) and the timing constraints (stimulus duration).

  **3. The Cross-Examination (20 min)**
  Groups 1 and 2 swap timelines. Their task: Falsify the rival model using *only* the available evidence (student reports and stimulus timing). They cannot appeal to "what the brain actually did" because that is the unknown variable. They must find a logical contradiction between the rival timeline and the behavioral data.
  *   *Constraint:* They cannot claim "introspection is infallible." They must treat their own reports as data points subject to error.
  *   *Goal:* Both groups will fail to falsify the other. The data fits both models perfectly.

  **Debrief: The Underdetermination (20 minutes)**

  **1. Naming the Puzzle (5 min)**
  Reveal that Group 1 constructed the **Stalinesque** model (pre-conscious editing/delay) and Group 2 constructed the **Orwellian** model (post-hoc memory revision). Highlight that despite opposite mechanical claims, their empirical predictions were identical. This is not a verbal squabble; it is empirical underdetermination. The "fact of the matter" about *when* experience occurred is missing from the data.

  **2. The Neural Move (10 min)**
  Ask: "Why not just scan the brain?" Map this onto the timelines. Even if you have neural firing data (e.g., V1 activation timing), you must interpret *which* firing constitutes "conscious experience."
  *   If you pick early firing as "experience," you lean Orwellian.
  *   If you pick late firing (integration) as "experience," you lean Stalinesque.
  The neural data doesn't solve the puzzle; it just pushes the interpretive burden back one step. Dennett's point is that there is no "finish line" in the brain where experience becomes real.

  **3. The Multiple Drafts Hint (5 min)**
  Conclude by suggesting Dennett's solution: Reject the assumption that there is a single timeline at all. Experience is a "Multiple Drafts" process where no single draft is the "real" one. The distinction collapses because the presupposition (a definite moment of consciousness) is false.

  **Predictable Failure Modes**

  1.  **Tech Latency:** Projectors often have input lag (10–50ms), which can ruin the precise ISI needed for Color Phi.
      *   *Fix:* Test on the specific classroom projector beforehand. Have a static backup (two slides clicked rapidly) if animation lags. If the illusion fails, pivot to discussing *why* it failed (timing precision) as part of the epistemic problem.
  2.  **The "I Know What I Saw" Defense:** Students may refuse to treat their introspection as fallible data, insisting their experience *must* match reality.
      *   *Fix:* Pre-empt this in the instructions. Frame them as "Engineers reverse-engineering a black box," not "Subjects reporting truth." Remind them that the illusion *proves* their introspection is already compromised.
  3.  **Group 3 Apathy:** Auditors may disengage.
      *   *Fix:* Give them veto power. If a timeline contradicts the stimulus timing (e.g., experience before stimulus), Auditors must reject it.

  **Load-Bearing Assumptions**

  1.  **Introspective Reports are Data, Not Truth:** The activity collapses if students treat their reports as incorrigible facts about the world rather than behavioral outputs to be explained.
      *   *Adjustment:* If students challenge this, shift to **Heterophenomenology**. Treat their reports as texts to be interpreted, not direct pipelines to reality. This strengthens Dennett's actual position but requires more philosophical scaffolding.
  2.  **Timing is Knowable:** The puzzle relies on the gap between stimulus time and report time being measurable.
      *   *Adjustment:* If tech timing is unreliable, acknowledge it. Use the uncertainty to highlight the broader epistemic problem: if we can't trust the stimulus timing, we certainly can't trust the neural timing.
  3.  **Unified Consciousness:** The activity assumes students expect a single, unified timeline of experience.
      *   *Adjustment:* If students naturally adopt a "Multiple Drafts" view immediately, the tension vanishes. Prompt them to commit to a *single* moment of awareness to force the dilemma. Ask: "At exactly what millisecond did the subject *see* the red dot?"
