          5.  Meta-question: Is the view insulated/unfalsifiable, and does that matter?

  2.  **Deconstruct the Position:**
      *   *Core:* Personhood = Achieved Status (not ontological given).
      *   *Mechanism:* Mutual Recognition (not just care or utility).
      *   *Modifiers:* Gradable, Persistent (Hysteresis), Normative (Fitting recognition).
      *   *Tension:* If it's normative ("fitting"), does it collapse into a capacity view? If it's actual ("recognition received"), does it punish victims? If it persists ("hysteresis"), is it ad hoc?

  3.  **Evaluate the User's Draft Defeaters:**

      *   *Point 1 (Ostracism):* This is the classic "Menkiti Problem." If personhood depends on the community, a bad community makes you a non-person.
          *   *User's fix:* Switch to "fitting recognition."
          *   *Risk:* Collapsing into Gyekye (moderate) or Western Kantianism (capacities). If "fitting" means "recognition owed to beings with capacity X," then capacity is doing the work, not the relation.
          *   *Verdict:* High risk of fatal collapse.

      *   *Point 2 (Hysteresis):* Persistence after loss of relation.
          *   *Risk:* Ad hocery. Why does it persist here but not there? If it persists through dementia, why is it losable at all?
          *   *Caregiver Case:* The mother is a person. Is she coasting? If yes, personhood is static for adults. If no, how is she maintaining it without reciprocity?
