  5.  **Drafting the Content (Iterative refinement):**

      *   *On Unfalsifiability:* It *is* a problem if the definitions shift to avoid counter-examples. But in normative metaphysics, "falsifiability" looks different than in science. It's about *coherence* and *explanatory power*. If the view explains nothing because it accommodates everything, it's dead.
      *   *On Point 1 (Ostracism):* This is the strongest attack. If you say "fitting recognition," you need an account of *fitting* that isn't just "recognition of capacities." Menkiti tries to ground it in ritual/process. The user needs to ground it in *obligation*. The community *owes* recognition. If they withhold it, they are wrong, but does the victim lose personhood? Menkiti might say "they lose the *exercise* of personhood, not the *potential*." But the user says "losable." This is the tension. *Verdict:* Fatal if not careful.
      *   *On Point 2 (Hysteresis):* This is the "ad hoc" danger. To save it, frame personhood as a *social fact* (like money or marriage). Once married, you're married even if you stop acting like it (until divorce). Personhood is a social status. Dementia doesn't "divorce" you. Solitary confinement is an attempt at "divorce." This makes it less ad hoc. *Verdict:* Awkward but salvageable.
      *   *On Point 3 (Twins):* Don't let empirical psychology dictate metaphysics. But if the deprived twin functions identically, claiming they have "less personhood" is morally repugnant. The view must say the deprived twin has *impoverished* personhood, not *less*. Or, distinguish "basic personhood" (ontological) from "full personhood" (ethical). The user is defending the radical view, so they must bite the bullet: The deprived twin is metaphysically diminished. *Verdict:* Awkward (moral cost), not fatal.
