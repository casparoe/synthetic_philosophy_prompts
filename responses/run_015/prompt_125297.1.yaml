      *   **Problem:** The user feels the view is becoming unfalsifiable ("can't actually lose"), which is a bad sign philosophically.
      *   **Task:** Identify defeaters (counter-arguments), rank them (fatal to awkward), distinguish between what critics say vs. what a defender must concede, and specifically address the "unfalsifiability" worry.
      *   **Specific Points to Address:**
          1.  The Wrongly-Ostracised Person (Injustice vs. Metaphysical Unmaking).
          2.  Hysteresis/Persistence (Dementia, Solitary, Caregiving).
          3.  The Swapped Twins (Nature vs. Nurture, Empirical vs. Normative).
