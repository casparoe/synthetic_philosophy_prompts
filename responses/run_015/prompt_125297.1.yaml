  7.  **Final Polish:** Ensure I answer the specific question about whether the "Degree + Persistence + Fitting" combo creates unfalsifiability. Yes, it does, unless "Fitting" is rigorously defined externally to the system.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "this is hard." I need to tell them *why* it threatens the specific essay argument. The user is worried they can't lose. I need to show them where they *can* lose. The "Fitting Recognition" move is the weakest link because it invites the collapse.

