      *   **Specific Mechanics:**
          *   "Vocabulary Card" (fixed primitives).
          *   Round 1: Solve a given panel, propose 3 distinctions, rank them.
          *   Round 2: Test distinctions against new probes (force internal disagreement).
          *   Round 3: Teams author puzzles for other teams. Scoring incentivizes "uncollidable" rules (rules that can't be matched by alternative distinctions within vocabulary).
          *   Planted Problem: One relational/configural problem hidden in the mix.
          *   Debrief: Map activity moments to core concepts.
          *   Failure Modes: Predict what goes wrong and how to fix it.
          *   Limitation: Acknowledge what the activity *misses* (perceptual construction vs. selection).

  2.  **Deconstruct the Activity Flow:**

      *   *Time:* 90 minutes is tight for 3 rounds + debrief. Need to be strict.
      *   *Materials:* Index cards, markers, envelopes, printed sheets (vocabulary, problem sets).
