answer: |-
  This is a sophisticated design challenge. You are asking for an experiential lesson in epistemology (underdetermination, priors, hypothesis spaces) disguised as a game. The constraints (no tech, strict time, specific mechanics) require tight facilitation.

  Here is the complete run-kit for your 90-minute session.

  ### 1. Materials Checklist
  *   **Printed Sheets:**
      *   4 copies of **Vocabulary Card** (one per team).
      *   3 copies of **Problem Set Alpha** (The "Standard" Ambiguous Problem).
      *   1 copy of **Problem Set Beta** (The "Planted" Relational Problem).
      *   1 copy of **Probe Deck** (Master sheet for you to cut up).
      *   4 copies of **Authoring Kit** (Blank grids, envelopes).
      *   1 **Constraint Card** (For the team getting Beta in Round 3, or Alpha with a twist—see Timeline).
  *   **Physical:**
      *   Index cards (ruled, approx. 100).
      *   Envelopes (4 large, for swapping puzzles).
      *   Markers (black, thick tip; coloured, thin tip).
      *   Chocolate chips or small candies (currency).
      *   Scissors, glue sticks.
      *   Timer (phone or watch).

  ---

  ### 2. Handout Text (Exact Wording)

  **Handout 1: The Vocabulary Card**
  *(Print on cardstock. Hand out at 00:00)*
  > **ALLOWED PRIMITIVES**
  > All distinctions must be constructed *only* using these terms. If you can't say it with these, it doesn't count.
  >
  > **Properties (of a single figure):**
  > 1. Shape (Circle, Square, Triangle)
  > 2. Fill (Solid, Empty, Hatched)
  > 3. Size (Small, Large)
  > 4. Count (1, 2, 3 figures in the panel)
  >
  > **Relations (between figures):**
  > 5. Touching (edges contact)
  > 6. Overlapping (areas intersect)
  > 7. Contained-in (one inside another)
  > 8. Separate (no contact)
  > 9. Aligned (centers share a line)
  >
  > **Logical Operators:**
  > 10. ALL / NONE / AT-LEAST-ONE

  **Handout 2: Round 1 Instructions**
  *(Attach to Problem Sets)*
  > **TASK:**
  > 1. Examine the two panels (Left and Right).
  > 2. You have 3 "Probe Cards" (blank index cards). Draw a figure on each that you think belongs on the **Left**. Place them there.
  > 3. Write down **THREE** separate distinctions that explain the difference between Left and Right.
  >    *   Each must use only the **Vocabulary Card**.
  >    *   Each must be consistent with all 12 training figures.
  > 4. Rank them: (1) Most Likely, (2) Plausible, (3) Stretch.
  >
  > *Do not use the word "Rule". Use "Distinction".*

  **Handout 3: Round 2 Instructions**
  *(Reveal at 02:00 mark)*
  > **STRESS TEST:**
  > 1. I am giving you 5 new **Probe Cards**.
  > 2. For *each* of your Three Distinctions from Round 1, decide: Does this Probe go Left or Right?
  > 3. Record your answers in a grid (3 Distinctions × 5 Probes).
  > 4. **Check:** Do your three distinctions agree on where the Probes go? If they disagree, you have found a crack in the data.

  **Handout 4: Round 3 Authoring Instructions**
  *(Hand out at 45:00)*
  > **TASK:**
  > 1. Create a new Panel Pair (6 figures Left, 6 figures Right).
  > 2. Define your **Intended Distinction** (Secret). Write it on the slip inside the envelope.
  > 3. **Scoring:**
  >    *   **Author Wins (3 chips):** Solvers fail to name your Distinction.
  >    *   **Collision (0 chips):** Solvers name a *Different* Distinction that fits all 12 cards.
  >    *   **Recovery (+2 chips):** If Collision happens, you may play a **Tie-Breaker Card** (a new figure). If this card fits your Distinction but violates the Solvers', you regain the chips.
  >    *   **Constraint:** You must be able to solve your own puzzle using only the **Vocabulary Card**.
  > 4. Seal your panels and secret slip in an envelope. Swap with another team.

  ---

  ### 3. The Problems (Design Specs)

  **Problem Set Alpha (For 3 Teams)**
  *Designed to be underdetermined by individual properties.*
  *   **Left Panel:** 3 Small Solid Circles, 3 Small Solid Squares.
  *   **Right Panel:** 3 Large Empty Circles, 3 Large Empty Squares.
  *   **Valid Distinction A:** Size (Small vs Large).
  *   **Valid Distinction B:** Fill (Solid vs Empty).
  *   **Valid Distinction C:** Correlation (Small things are Solid; Large things are Empty).
  *   *Why:* Distinction C is relational (property binding) but fits the data perfectly. A and B are simple.

  **Problem Set Beta (The Planted Problem - For 1 Team)**
  *Designed to force relational thinking within panels.*
  *   **Left Panel:** 6 Figures. All are **Separate** (no touching).
  *   **Right Panel:** 6 Figures. All are **Touching** (at least one contact per figure, or pairs touching).
  *   *Trap:* The Vocabulary allows "Touching" and "Separate", but users usually scan for properties *of* the shapes (Circle/Square), not relations *between* them.
  *   *Probe Conflict:* The standard Probe Deck (see below) contains single isolated shapes. Team Beta will find these unclassifiable because their distinction requires a *context* of other figures. **Do not warn them.** Let them struggle.

  **The Probe Deck (Pre-cut Cards)**
  *Designed to split Alpha's hypotheses.*
  1.  **Probe 1:** Large Solid Circle. (Splits Size vs Fill. Left on Size, Right on Fill).
  2.  **Probe 2:** Small Empty Square. (Splits Size vs Fill. Right on Size, Left on Fill).
  3.  **Probe 3:** Large Solid Triangle. (Tests Shape relevance).
  4.  **Probe 4:** Small Solid Circle (Duplicate of training). (Tests consistency).
  5.  **Probe 5:** Medium Size Circle. (Tests boundary of "Small/Large" vocab).

  ---

  ### 4. Minute-by-Minute Timeline

  **00:00 – 00:05: Setup & Vocab**
  *   Hand out **Vocabulary Cards** only.
  *   Say: "You are classifiers. You have a limited language. You will see examples. You must describe the difference."
  *   **Do not say:** "These are Bongard problems." **Do not say:** "Find the rule."
  *   Distribute Problem Sets (3 Alpha, 1 Beta).

  **00:05 – 00:25: Round 1 (Solving)**
  *   Teams work on their panels.
  *   They must write down 3 distinctions.
  *   *Facilitator:* Walk around. If Team Beta (Relational) asks "Where do I put this single card?", say: "Use your Vocabulary." If they say "This distinction needs two figures," say: "The Vocabulary allows relations. How you apply it is your choice." (This creates the friction).
  *   Teams rank their distinctions.

  **00:25 – 00:45: Round 2 (The Probe Reveal)**
  *   Distribute the 5 **Probe Cards** to all teams.
  *   Teams fill out the grid (3 Distinctions × 5 Probes).
  *   **The Moment:** Teams with Alpha will see their 3 distinctions disagree on Probes 1 & 2. (e.g., Distinction A says Left, Distinction B says Right).
  *   Team Beta will likely stall on Probes because a single card cannot "Touch" or be "Separate" without a neighbor.
  *   *Facilitator:* At 00:40, call time. Ask: "Did your three distinctions agree?" (Alpha teams say No). Ask Team Beta: "How did the probes work?" (They say "They didn't").
  *   **Point:** The data (12 cards) didn't pin the distinction. The Probes exposed the ambiguity.

  **00:45 – 01:15: Round 3 (Authoring & Collision)**
  *   Teams author new puzzles.
  *   **Secret Injection:** Hand the **Constraint Card** to *one* team (can be the same or different from Beta).
      *   *Constraint Card Text:* "Your Distinction must be **Relational**. You cannot use Shape, Fill, or Size alone. You must use Touching, Contained, or Aligned."
  *   Others author freely (most will pick Simple Properties).
  *   Teams swap envelopes. Solvers try to crack the other team's puzzle.
  *   **Scoring:** Apply the Chip Scheme.
      *   If Solvers find a *different* valid distinction (Collision), Author must produce a **Tie-Breaker Card** immediately to save their points.
      *   *Observation:* Authors will realize they need to design puzzles where *only one* distinction in the Vocabulary fits. This forces them to think about the "Hypothesis Space" not just the data.

  **01:15 – 01:30: Debrief**
  *   Collect chips. Announce winners (usually the team that made the hardest "uncollidable" puzzle).
  *   Run the script below.

  ---

  ### 5. Debrief Script (Mapping Moments to Concepts)

  **1. Underdetermination (The Data)**
  *   *Ask:* "In Round 1, how many of you found more than one distinction that fit all 12 cards?"
  *   *Point:* "Twelve examples did not pin down the truth. The data was consistent with 'Size', 'Fill', and 'Correlation' simultaneously. The data underdetermines the model."

  **2. The Prior (The Click)**
  *   *Ask:* "You ranked one distinction 'Most Likely'. Why?"
  *   *Point:* "You didn't pick it because of the cards. You picked it because of *you*. You have a prior that 'Simple properties' are more natural than 'Correlations'. The 'Oh, I see it' click wasn't evidence of truth; it was evidence of matching your prior."

  **3. Hypothesis Space (The Vocabulary)**
  *   *Ask Team Beta:* "Why did the Probes fail you?"
  *   *Point:* "Your distinction was about *relations between figures*. The Probes were *single figures*. Your hypothesis space included things the test set couldn't measure."
  *   *Ask Authors:* "Who had to add a Tie-Breaker card?"
  *   *Point:* "To win, you couldn't just fit the data. You had to ensure no *other* path through the Vocabulary fit the data. You were mapping the space of possible distinctions, not just the data points."

  **4. The Missing Piece (Facilitator Addition)**
  *   *Say:* "There is one thing this activity lied about. I gave you the Vocabulary Card. In real cognitive science (and real Bongard problems), **you don't get the card.**"
  *   *Point:* "The hardest part isn't selecting 'Size vs Fill'. It's noticing that 'Size' is a thing worth measuring in the first place. We skipped the perceptual work of *constructing* the primitives. That is where the actual intelligence lives. Today you played the selection game; the real problem is the invention game."

  ---

  ### 6. Predictable Failure Modes & Mitigation

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **Baroque Rules** | Someone writes: "Left side has shapes whose names have 6 letters." | **Vocab Card Enforcement.** If it's not on the card, it's illegal. Stick to the list rigidly. |
  | **"Vibes" Solving** | "The left side feels heavier." | **Written Justification.** Require the distinction to be written using *only* Vocabulary terms. No adjectives allowed. |
  | **Drawing Cheat** | Authors draw "wobbly" circles to signal "Left". | **Schematic Rule.** Announce: "Figures must be geometric primitives. Artistic style is forbidden." |
  | **Table Arrangement** | Solvers arrange cards on the table to find patterns (e.g., spacing). | **Fixed Grids.** The Problem Sheets should have printed boxes. Cards must stay in boxes. |
  | **Team Beta Revolt** | The Relational team gets frustrated the Probes don't work. | **Lean In.** Let them be frustrated. In the debrief, ask them explicitly: "Did the test set match your hypothesis space?" This is the key lesson. |
  | **Author Stalemate** | Authors make impossible puzzles (no solution). | **Self-Solve Check.** Rule: "You must be able to write down your own distinction using the Vocabulary before you seal the envelope." |
  | **Time Overrun** | Round 3 Authoring takes too long. | **Hard Stop.** At 01:10, force them to seal envelopes even if incomplete. Incomplete puzzles count as "Solver Win". |

  ---

  ### 7. What This Activity Misses (Honesty Check)

  You are correct to worry. This activity tests **Selection among formulated hypotheses**, not **Perceptual Construction**.

  *   **The Real Bongard Experience:** In a true Bongard problem, the pain is *seeing* the feature. It's realizing "Oh, these aren't triangles, they're *arrowheads* pointing inward." That is a perceptual re-organization, not a logical selection.
  *   **The Activity's Limitation:** By giving them the Vocabulary Card, you have pre-digested the perception. You have turned a perceptual problem into a logic puzzle.
  *   **How to Fix in Debrief:** You must explicitly name this.
      *   *Script:* "I gave you a menu. In the wild, there is no menu. The cognitive work isn't choosing 'Size' or 'Shape'. It's noticing that 'Size' exists. We simulated the *verification* phase of science, not the *discovery* phase. The 'Click' you felt was recognition of a vocabulary term, not discovery of a new fact."

  ### 8. Payoff Scheme Summary (For Whiteboard)

  *   **Solver:**
      *   Find Intended Distinction: **+3 Chips**
      *   Find *Any* Consistent Distinction (that Author can't break): **+1 Chip**
  *   **Author:**
      *   Solver Fails: **+3 Chips**
      *   Solver Finds *Different* Distinction (Collision): **0 Chips**
      *   **Recovery:** Play Tie-Breaker Card (Fits Author, Breaks Solver): **+2 Chips**

  *This scheme incentivizes Authors to minimize the "Surface Area" of their puzzle in the Vocabulary Space, forcing them to consider alternative paths.*
