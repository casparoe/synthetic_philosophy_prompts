          1.  Underdetermination (12 examples don't pin down the rule).
          2.  Role of Priors (naturalness/simplicity selects the rule).
          3.  Hypothesis Space Choice (individual properties vs. relational/configural properties).
          4.  The "Click" isn't Truth (confidence $\neq$ correctness).
