      *   *Round 1 (Solving):* Needs to be quick. 20 mins.
      *   *Round 2 (Testing):* Needs to force divergence. 20 mins.
      *   *Round 3 (Authoring):* Needs clear incentives. 30 mins.
      *   *Debrief:* 20 mins.

  3.  **Designing the Mechanics:**

      *   **Vocabulary Card:** Needs to be restrictive enough to limit the search space but open enough to allow relations.
          *   *Primitives:* Shape (circle, square, triangle), Fill (solid, empty, hatched), Size (small, large), Count (1, 2, 3), Position (left, right, top, bottom), Relation (touching, inside, outside, aligned).
