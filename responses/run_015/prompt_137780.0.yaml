                  *   This forces Authors to think about *uniqueness* within the vocabulary, not just *fit*.
      *   **The Planted Problem:** Needs to be relational.
          *   *Idea:* Left Panel = All figures identical. Right Panel = At least two figures different. (Identity vs. Diversity).
