              *   Actually, the prompt asks for: "Authors rewarded when solvers fail, but penalised... when solvers name a different distinction... and author can't produce a card... that separates it."
              *   *Revised Scoring:*
                  *   Base: Author gets 5 points if Solver doesn't guess the rule.
