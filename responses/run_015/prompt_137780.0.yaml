          *   *Goal:* Reward authors if solvers *fail* to find the rule, but penalize if solvers find a *different* rule that fits.
          *   *Mechanism:* "Collision Penalty." If Solver finds Rule X, and Author meant Rule Y, and both fit the 12 training cards *and* the Vocabulary, Author loses points unless they can provide a "tie-breaker card" that fits Y but not X.
