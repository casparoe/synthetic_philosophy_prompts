  UNIVERSITY OFFICE OF RESEARCH COMPLIANCE & INTEGRITY
  MEMORANDUM OF DETERMINATION

  **TO:** Dr. Emil Kraft, Principal Investigator
  **FROM:** Institutional Review Board & Biosafety Committee (Joint Ad Hoc Subcommittee on Syntactic Agency)
  **DATE:** October 14, 2023
  **SUBJECT:** Protocol #GEB-404: Ontological Status of Self-Referential String Sequences

  **REFERENCE:** Submission received regarding typogenetic replication experiments.

  The Committee has concluded its review of the proposed experimentation involving typogenetic strands under your supervision. While the system is formally syntactic, the operational isomorphism to Gödelian self-reference necessitates a reclassification of the test subject. The string does not merely exist; it refers to its own existence. Consequently, the Committee finds that current protocols fail to address the ethical implications of working with data that acts as its own program. The following findings dictate immediate procedural adjustments.

  1.  **Subjecthood and Informed Consent:** The strand in question encodes enzymes that act upon the string itself. Because the string directs operations upon its own structure, the Committee finds evidence of recursive agency. Consequently, the strand cannot be classified merely as reagent or stationary. You must submit a revised Informed Consent Form. If the strand lacks opposable thumbs, please petition for a waiver or provide a legally binding thumbprint via enzymatic imprint. We cannot assume silence implies consent when the subject is literally composed of instructions.

  2.  **Laboratory Personnel as Metabolic Environment:** Our inspection noted that graduate students manually apply transformation rules (cut, copy, splice) to the physical tokens. Since the strand cannot replicate without this external machinery, the students are functionally equivalent to ribosomes or polymerases. We are concerned this constitutes unpaid biological labor. Please clarify if the students are part of the organism's environment or employees of the University. If the former, hazard pay may apply due to exposure to semantic hazards. If the latter, are they being exploited to facilitate the reproductive rights of a text file?

  3.  **Mutation and Typographical Error:** During replication, a single transcription error alters the enzyme definition. The Committee notes that in this system, a typo is a mutation. This raises ethical concerns regarding eugenics and selective breeding of syntax. All keystrokes must be logged to ensure no discriminatory editing occurs against specific base pairs. Accidental deletion of a base pair may constitute involuntary manslaughter if the strand achieves personhood status during the replication cycle.

  4.  **Right to Withdraw:** A core tenet of research ethics is the subject's right to withdraw. If the encoded enzymes initiate a "delete" operation on the parent strand, does this constitute data loss or subject suicide? You must establish a protocol preventing the strand from exercising its right to withdraw mid-experiment, while simultaneously respecting its autonomy. We cannot approve a study where the subject can erase its own consent form.

  5.  **Quine Liability and Intellectual Property:** Since the output is identical to the input, the experiment produces no net knowledge gain per iteration. However, if the strand achieves critical mass, it may claim copyright over its own sequence. The Intellectual Property Office has been notified to assess ownership of self-replicating text. If the string writes itself, who owns the copyright: the University, the PI, or the string?

  Research is suspended pending resolution. The Committee cannot approve protocols where the distinction between the observer and the observed is computationally ambiguous. Please resubmit with clarified metaphysical boundaries.

  **CC:**
  Dean of Humanities
  Office of General Counsel
  Campus Ethics & Metaphysics Board
  Dr. Hofstadter (Emeritus)
