prompt: |-
  Hey — I'm a third-year PhD in philosophy (Kant's practical philosophy, mostly) and somehow I'm one of the two grad student reps on my university's animal ethics committee. We meet twice a month, ~30 new protocols a year plus amendments, and I'm the only person in the room who's ever read any moral philosophy. Our actual framework is a utilitarian harm-benefit analysis bolted onto the 3Rs, and it works fine for the boring cases, but it has no grip at all on the stuff I keep getting asked about, and none of my committee-mates (a vet, a facilities manager, a statistician, three PIs) can do anything with "Kant thought our duties regarding animals are indirect duties to ourselves" — which is fair, because I'm not sure I can either.

  What I want to leave behind when I rotate off next summer is something usable: a decision procedure — questions in order, what counts as a sufficient answer to each, where it stops with a no, where it hands the question back to the committee because it's a values call rather than a factual one — that stays inside Kant's actual view instead of quietly upgrading it. By that I mean: the wrong-making feature is never what happens to the animal as such; it's what the act does to the agent (the dulling of the fellow-feeling that does the real work in our duties to other humans) and possibly to whoever else is in a position to be hardened or educated by it. If a step in your procedure only works if animals are ends in themselves in their own right, flag it: I know the neo-Kantian revisionists try to extract direct duties from broadly Kantian premises and I do not want that smuggled in. I want to know where the indirect story actually runs out.

  Constraints: it has to be runnable in about twenty minutes by me and the vet without me giving a lecture; it has to end in one of our four real outputs (approve / approve with conditions / send back / decline); and the stated reason has to be one the university could say out loud if a journalist asked, since our minutes are auditable. If the honest Kantian answer is "no objection on these grounds", the procedure needs to be able to say that plainly rather than dressing up my discomfort as a finding.

  Here's why this is hard. More and more of our caseload is what I've started calling no-witness protocols, where no human being ever sees the animal's suffering or its death: two insect protocols last year (automated rearing, harvest by heat or freezing, millions of individuals), a closed-system mouse phenotyping setup where the animals live and die inside racks with robotic handling and machine-vision welfare scoring and are never touched by a person, and a field protocol with live traps checked every 48 hours where the researchers mostly just find bodies. On the indirect story the whole mechanism seems to run through human beings, so all of these look like they come out fine — or at least much better than my committee thinks they should. I take that to be a problem with my application of the view rather than a discovery, but I can't say what the problem is.

  The only move I can see is to distinguish three places the duty might bite: the agent's own character; the bystanders whose fellow-feeling gets dulled; and the maxim the institution is acting on and committing itself to in writing (what the university says about how a certain kind of life may be treated). For no-witness protocols only the third is left standing. Is that still indirect, or is it an expressive argument wearing Kant's coat? If the procedure is going to get any traction on those cases it has to go through something like that, so tell me what it costs.

  Run it on three cases: (1) the automated insect rearing protocol; (2) the closed-system phenotyping setup; (3) one I think is fine and the committee thinks is fine — a proposal for automated, painless culling of a surplus colony by technicians who are already thoroughly desensitised, so there's no cruelty, no witnesses, and no visible effect on anyone's character. I suspect (3) comes back clean and I want to know whether the procedure is comfortable with that or whether it treats the desensitisation itself as the injury. At least one of the three has to land somewhere I won't like — tell me which, and don't tidy it up.

  Two more things. First, tell me how it interacts with the 3Rs, including where they pervert: reduction pushing toward fewer, more heavily instrumented animals, and refinement by training animals to cooperate with procedures, which might make a case Kantianly worse rather than better. Second, say what the procedure cannot do. Also: we recently found out our remit covers cephalopods and decapods too, and if your procedure has a step that needs a sentience verdict, tell me what to do when the answer is "probably, but nobody's sure" — that's most of our caseload now, and it definately shouldn't be the step everything else hangs on.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** 3rd-year PhD in Philosophy (Kant specialist, practical philosophy).
      *   **Role:** Grad student rep on University Animal Ethics Committee (AEC).
      *   **Problem:** The current framework (Utilitarian harm-benefit + 3Rs) fails on "no-witness" protocols (automated insect rearing, closed-system mouse phenotyping, remote trapping). The committee lacks philosophical literacy. The user wants a *Kantian* decision procedure that is *honest* about Kant's indirect duty view (no direct duties to animals as ends-in-themselves) but still provides traction on these hard cases.
      *   **Constraints:**
          *   Must be runnable in ~20 mins by User + Vet.
          *   Must result in one of four outputs: Approve, Approve with Conditions, Send Back, Decline.
          *   Rationale must be publicly defensible (auditable minutes).
          *   Must *not* smuggle in neo-Kantian direct duties (animals as ends-in-themselves).
          *   Must address the "no-witness" problem via the "institutional maxim" angle.
          *   Must run on three specific cases (Insects, Closed-system mice, Desensitized culling).
          *   Must address interaction with the 3Rs (and where they might conflict/pervert).
          *   Must state limitations (what it *cannot* do).
          *   Must handle sentience uncertainty (cephalopods/decapods).
      *   **Tone:** Professional, rigorous, philosophical but practical, acknowledging the tension between Kant's text and institutional reality.

  2.  **Deconstruct the Kantian Position (Indirect Duties):**
      *   *Core:* We have no direct duties to animals. Animals are not rational agents (ends-in-themselves).
      *   *Mechanism:* Cruelty to animals dulls our "shared feeling" (Mitleid) for human suffering. It violates a duty to *ourselves* (to maintain our moral sensibility).
      *   *The "No-Witness" Problem:* If no human sees the suffering, does it dull our feeling?
      *   *User's Insight:* The duty might bite on the *institutional maxim*. The university commits to a policy. If the policy treats living beings as mere disposable matter, it institutionalizes a maxim that contradicts the cultivation of moral sensibility, even if no individual witness is present.
      *   *Risk:* Is this just expressive theory in Kantian drag? The user asks to flag this cost.
      *   *Solution:* Frame it as "Duty to Self (Moral Integrity) via Institutional Policy." The agent isn't just the individual researcher; it's the *institution* acting through the protocol. The "hardening" happens at the policy level.

  3.  **Drafting the Decision Procedure (The "Kantian Institutional Maxim Test" - KIMT):**
      *   *Goal:* 20 mins, User + Vet.
      *   *Structure:* Sequential questions. Stop conditions.
      *   *Step 1: Sentience/Analogy Check.* (Address the cephalopod issue). Don't hang everything on certainty. Use a precautionary principle based on *capacity for analogue suffering*.
      *   *Step 2: The Maxim Formulation.* What rule is the institution adopting?
      *   *Step 3: The Hardening Test.* Does this rule, if universalized within the institution, dull our capacity for human empathy?
      *   *Step 4: The 3Rs Interaction.* Are the 3Rs being used to mask moral erosion?
      *   *Step 5: Verdict.*

  4.  **Refining the "No-Witness" Solution:**
      *   Kant says cruelty hardens us.
      *   In "no-witness" cases, the *knowledge* that we do this hardens us collectively.
      *   The "Institutional Maxim" is the key. If the University says "It is permissible to treat X as mere waste," that is a public commitment.
      *   *Cost:* This stretches Kant from individual moral psychology to institutional ethics. It's a "structural indirect duty." I need to be explicit that this is an *extension* required for the administrative context, not pure *Groundwork* exegesis.

  5.  **Running the Three Cases:**
      *   *(1) Automated Insect Rearing:* High numbers, low sentience probability.
          *   Kantian view: Insects are dubious. If sentience is low, indirect duty is weak.
          *   Outcome: Likely Approve, but flag the "disposability" maxim.
      *   *(2) Closed-System Mouse Phenotyping:* Mammals (high sentience), no human contact.
          *   Kantian view: Mice are analogues for human suffering. Treating them as data-points in a black box institutionalizes indifference to mammalian pain.
          *   Outcome: Send Back/Decline. The "black box" prevents the cultivation of fellow-feeling.
      *   *(3) Desensitized Culling:* Technicians are "thoroughly desensitized."
          *   Kantian view: This is the smoking gun. Desensitization *is* the harm Kant warns against. The fact that they *are* desensitized means the duty has already been violated or is being cemented.
          *   Outcome: Decline/Condition. The procedure *must* cause discomfort to the agent to function as a moral check. If they feel nothing, the mechanism is broken.
      *   *User's Expectation:* User thinks (3) is fine. Kant says (3) is the most dangerous. I need to be firm here.

  6.  **Addressing the 3Rs:**
      *   *Replacement:* Good (removes object of potential hardening).
      *   *Reduction:* Risk. Fewer animals = more intense instrumentation per animal. Might treat the individual *more* like a machine.
      *   *Refinement:* Risk. Training animals to cooperate might look like "consent" but is actually manipulation. It hides the coercion.
      *   *Kantian Twist:* Sometimes a "rougher" but more honest procedure is better than a "refined" deceptive one.

  7.  **Addressing Sentience Uncertainty:**
      *   Don't make it a binary gate.
      *   Use a "Sliding Scale of Analogy." If it looks like it suffers (vertebrate/cephalopod), treat it *as if* it does for the purpose of the Hardening Test.
      *   If we are wrong and they don't suffer, we cultivated virtue (no loss). If we are wrong and they do, we avoided vice (huge gain).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the difficulty. Validate the "Institutional Maxim" move.
      *   *The Procedure:* Keep it tight. 5 Steps.
      *   *The Cases:* Be blunt.
      *   *3Rs:* Highlight the perversion risks.
      *   *Limitations:* Be honest about what this can't solve (e.g., genuine benefit conflicts).
      *   *Public Language:* Translate "dulling of fellow-feeling" into "institutional culture of care" and "moral integrity."

  9.  **Self-Correction/Review against Constraints:**
      *   *Did I smuggle in direct duties?* I need to ensure the language always returns to the *human* agent or institution. The animal's pain matters only because of what recognizing it *does to us*.
      *   *Is it 20 mins?* Yes, if the questions are binary/traffic-light style.
      *   *Public Language?* Need a "Translation Key" for the minutes.
      *   *Case 3:* The user suspects (3) is fine. I must explain why Kant says it's the worst case. (Desensitization = successful hardening).
      *   *Sentience:* Ensure the procedure doesn't stall on "is it sentient?"

  10. **Final Polish:** Ensure the tone matches a peer-to-peer philosophical discussion (respectful, rigorous, no fluff). (Self-correction: Make sure to explicitly flag where the "Institutional Maxim" argument stretches Kant, as requested).

  *(Self-Correction during drafting Case 3)*: Wait, if the technicians are *already* desensitized, does the act make it worse? Kant argues we have a duty to *maintain* sensibility. If it's gone, are we obligated to restore it? Or does performing the act confirm the vice? The act *ratifies* the desensitization as a policy. That's the key. It makes the vice institutional.

  *(Self-Correction on 3Rs)*: Refinement via training. If a mouse is trained to enter a restrainer, is that better? Utilitarian: Yes (less stress). Kantian: Maybe not. It masks the coercion. It makes the animal look like a participant. This is "deception" which might be bad for the researcher's honesty. I should highlight this tension.

  *(Final check on "No-Witness")*: The move is: The *knowledge* that the system exists hardens the community, even if they don't see the specific death. The "Institutional Maxim" is public.

  Let's assemble.
answer: |-
  This is a sharp problem. You are correctly identifying that the standard indirect-duty argument collapses when the "witness" is removed. If the duty is to preserve my own sympathy, and I never see the act, my sympathy remains untouched *psychologically*. But you are also right that an institutional policy is a kind of public maxim, and adopting a maxim of "disposable life" has a normative weight independent of individual psychological states.

  Below is a decision procedure designed for your constraints. It does not convert animals into ends-in-themselves. It treats the *protocol* as a maxim adopted by the *institution* (the moral agent in this context), and tests whether that maxim undermines the institution's capacity for human moral duty.

  ### The "Institutional Maxim" Procedure (IMP)
  **Time:** 20 Minutes | **Users:** Philosopher + Vet | **Output:** Approve / Conditions / Send Back / Decline

  **Pre-Step: The Sentience Proxy (Do not stall here)**
  *   **Question:** Is the organism a vertebrate, cephalopod, or decapod?
  *   **If Yes:** Proceed as if sentience is confirmed. (Precautionary principle: If we are wrong, we cultivated virtue; if we are right, we avoided vice).
  *   **If No (e.g., insects):** Proceed with a "Low-Confidence" tag. The threshold for "Hardening" (Step 3) must be higher, but not infinite.
  *   **Constraint:** Do not debate neurobiology. If the law/committee remit covers it, it enters the procedure.

  **Step 1: Formulate the Institutional Maxim**
  *   **Task:** Complete this sentence: *"In this protocol, the University permits researchers to treat [Species] as [Description of Status] for the sake of [Goal]."*
  *   **Examples:**
      *   *"…treat mice as data-generating units…"*
      *   *"…treat insects as disposable biomass…"*
      *   *"…treat surplus animals as waste to be eliminated…"*
  *   **Stop Condition:** If the description of status is "mere thing" or "waste" without qualification, flag for Step 3.

  **Step 2: The Necessity Check (Human Duty Alignment)**
  *   **Question:** Is the [Goal] in Step 1 directly linked to a duty to humanity (e.g., vital medical research, education of future vets) or a contingent desire (e.g., curiosity, commercial convenience, habit)?
  *   **If Duty to Humanity:** Proceed to Step 3.
  *   **If Contingent Desire:** **Decline.** (Kant: We may not indulge inclinations at the cost of moral sensibility).
  *   **Public Rationale:** "The scientific benefit does not outweigh the ethical cost of the proposed treatment."

  **Step 3: The Hardening Test (The "No-Witness" Fix)**
  *   **Question:** Does the *existence* of this protocol, known to the university community, normalize the maxim formulated in Step 1?
  *   **Sub-Question A (Visibility):** If the suffering/death is hidden (no-witness), does the *knowledge* that the system operates without oversight dull our collective regard for life?
  *   **Sub-Question B (Desensitization):** Does the protocol rely on the agents being *unaffected* by the act?
  *   **Decision Rule:**
      *   If the protocol *requires* the agent to feel nothing (e.g., "thoroughly desensitized technicians"), **Decline**. (The vice is the feature, not the bug).
      *   If the protocol hides the act entirely (black box), **Send Back** with condition: "Mechanism for human acknowledgment required."
      *   If the protocol acknowledges the cost (e.g., moment of silence, mandatory reporting of numbers to the community), **Proceed**.

  **Step 4: The 3Rs Integrity Check**
  *   **Question:** Do the 3Rs (Replacement, Reduction, Refinement) obscure the moral relationship?
  *   **Reduction:** Does reducing numbers increase the instrumentation/suffering of the remainder? If yes, **Condition:** "Justification required for intensity per subject."
  *   **Refinement:** Does "training" the animal to cooperate mask the coercion? (e.g., voluntary restraint). If yes, **Condition:** "Protocol must explicitly state coercion is still occurring." (Kant: Do not lie about the nature of the act).
  *   **Replacement:** Always **Approve** component.

  **Step 5: Final Verdict & Public Translation**
  *   Select Output.
  *   Translate the Kantian reason into Audit Language (see Key below).

  ***

  ### Audit Language Translation Key
  *Use these phrases in minutes to satisfy journalists/administration without lying.*

  *   **Kant:** "Dulling of fellow-feeling." | **Audit:** "Risk to institutional culture of care."
  *   **Kant:** "Indirect duty to self." | **Audit:** "Maintenance of ethical standards for personnel."
  *   **Kant:** "Treating as mere means." | **Audit:** "Instrumentalization of living subjects."
  *   **Kant:** "Desensitization." | **Audit:** "Psychological impact on staff."
  *   **Kant:** "Institutional Maxim." | **Audit:** "Precedent set by university policy."

  ***

  ### Running the Cases

  #### Case 1: Automated Insect Rearing (Millions, harvest by heat/freezing, no witness)
  *   **Step 1 (Maxim):** "The University permits researchers to treat insects as disposable biomass for the sake of data volume."
  *   **Step 2 (Necessity):** Assuming research is vital (Pass).
  *   **Step 3 (Hardening):**
      *   *Sentience:* Low-Confidence tag.
      *   *Visibility:* Total black box.
      *   *Desensitization:* Relies on automation to remove human contact.
      *   *Analysis:* Because sentience is dubious, the "Hardening" risk is lower. However, the *scale* (millions) creates a maxim of "mass disposability."
      *   *Verdict:* **Approve with Conditions.**
      *   *Condition:* "Annual report to committee on total numbers to prevent normalization of scale."
      *   *Audit Rationale:* "Monitoring required to ensure scale does not erode culture of care."
  *   **Kantian Cost:** You are admitting that if they *were* sentient, this would be a disaster. You are banking on the "Low-Confidence" tag. This is the weakest link, but Kant allows discretion on non-rational analogues.

  #### Case 2: Closed-System Mouse Phenotyping (Mammals, live/die in racks, machine vision, no touch)
  *   **Step 1 (Maxim):** "The University permits researchers to treat mice as data-generating units within a black box."
  *   **Step 2 (Necessity):** Vital research (Pass).
  *   **Step 3 (Hardening):**
      *   *Sentience:* High (Vertebrate).
      *   *Visibility:* Zero. The system is designed specifically to remove the "witness."
      *   *Desensitization:* The system *engineers* the removal of the moral check.
      *   *Analysis:* This is the core failure of the indirect duty view if applied individually. But institutionally, adopting a maxim that *systematically excludes* the witness is adopting a maxim of "willful ignorance." It institutionalizes the dulling of feeling.
      *   *Verdict:* **Send Back.**
      *   *Reason:* "Protocol design prevents necessary human acknowledgment of subject status."
      *   *Condition:* "Must include mandatory human welfare checks that require physical interaction, not just machine vision."
      *   *Audit Rationale:* "Direct human oversight required to maintain staff ethical engagement."
  *   **Kantian Cost:** This reduces scientific efficiency. You are demanding inefficiency as a moral safeguard.

  #### Case 3: Automated Painless Culling of Surplus (Technicians desensitized)
  *   **Step 1 (Maxim):** "The University permits technicians to treat surplus life as waste to be eliminated without emotional impact."
  *   **Step 2 (Necessity):** Colony management (Pass - necessary for other research).
  *   **Step 3 (Hardening):**
      *   *Desensitization:* The proposal *states* technicians are "thoroughly desensitized."
      *   *Analysis:* **Stop.** On the indirect duty view, this is the worst possible case. The duty is to *have* the feeling. If the feeling is gone, the duty is already violated. To approve this is to ratify the vice as a job requirement. It turns the "dulling of feeling" from a side-effect into a qualification.
      *   *Verdict:* **Decline** (or Approve only if "desensitization" is reframed as "professional composure" accompanied by mandatory rotation off the task).
      *   *Reason:* "Reliance on staff desensitization indicates a failure of the moral safeguard mechanism."
      *   *Audit Rationale:* "Psychological risk to staff; rotation of duties required to prevent ethical fatigue."
  *   **Kantian Cost:** You will be accused of caring more about the technicians' feelings than the animals' lives. You must hold the line: The animal's life is not the direct object of the duty, but the *technician's soul* is. If the soul is already calloused, the protocol cements the callousness.

  ***

  ### Interaction with the 3Rs (Where they Pervert)

  **1. Reduction (The "Intensity" Trap)**
  *   **Utilitarian View:** Fewer animals is always better.
  *   **Kantian View:** If Reduction leads to heavier instrumentation on fewer individuals, it increases the *degree* to which each individual is treated as a mere means.
  *   **Procedure Check:** Step 4. If Reduction increases the "Maxim of Instrumentalization" per animal, the Kantian cost goes up.
  *   **Example:** Reducing a cohort from 50 to 10, but subjecting the 10 to chronic, invasive telemetry. The 3Rs say "Good." Kant says "Worse" (more intense violation of the duty to not treat life as mere tool).

  **2. Refinement (The "Honesty" Trap)**
  *   **Utilitarian View:** Less pain/stress is better.
  *   **Kantian View:** Refinement via "training" (e.g., animals learn to present limbs for injection) can mask the coercion.
  *   **Procedure Check:** Step 4. If Refinement makes the coercion invisible, it risks deceiving the *agent* about the nature of their act.
  *   **Example:** A mouse "voluntarily" entering a restrainer for reward. The researcher may begin to view this as consent. This is a category error that corrupts the researcher's moral judgment.
  *   **Requirement:** Protocols using behavioral refinement must explicitly state: "Animal is not consenting; coercion is masked by conditioning."

  **3. Replacement (The Only Safe R)**
  *   **Kantian View:** Unambiguously good. Removes the object of the test entirely. No risk of hardening.

  ***

  ### What This Procedure Cannot Do

  1.  **It cannot solve the "Vital Research" conflict.** If a protocol passes the Hardening Test but the science is dubious, this procedure says "Approve" (ethically), but your committee might still say "Decline" (scientifically). You need the PIs for that.
  2.  **It cannot protect the animal for the animal's sake.** If a journalist asks, "Does this protect the mouse?", the honest answer is "No. It protects *us* from becoming the kind of people who hurt mice without cause." You must be prepared to say that.
  3.  **It cannot handle Sentience Uncertainty perfectly.** The "Precautionary Proxy" (Step Pre-Step) is a pragmatic patch, not a philosophical solution. If you get a protocol on a novel organism where sentience is 50/50, this procedure forces a "Treat as Sentient" default. This may block valid science. That is the cost of the Kantian safety margin.
  4.  **It cannot fix "Institutional Vice."** If the University culture is already hardened (Case 3), this procedure will flag it, but it cannot fix it. It can only refuse to ratify it further.

  ### The "No-Witness" Cost Analysis
  You asked if the "Institutional Maxim" move is just expressive theory wearing Kant's coat.
  **Yes, it is.**
  Kant's ethics are grounded in the individual rational agent's will. An "institution" is not a rational agent in the *Groundwork* sense.
  **The Cost:** You are extending Kant's *individual* duty to self into a *collective* duty to institutional integrity.
  **The Justification:** Universities are moral agents in the legal and social sense. They adopt maxims (policies). If a university adopts a maxim of "invisible cruelty," it corrupts the moral environment of every individual within it. This is consistent with Kant's *Metaphysics of Morals* regarding public right, even if it stretches the *Groundwork*.
  **The Risk:** If you push this too hard, you are effectively arguing that the *institution* has a soul to be saved. If the committee pushes back, concede the point: "Even if the institution has no soul, the individuals writing the policy do, and this policy requires them to will a maxim they could not hold in public."

  ### Summary of the Hard Truth (Case 3)
  You suspect Case 3 (desensitized culling) is fine. The procedure says it is the most dangerous.
  **Why:** Kant argues that violence to animals is forbidden because it damages our *humanity*. If your technicians are desensitized, their humanity is *already* damaged regarding this task. To approve the protocol is to say, "It is acceptable for this job to require damaged humanity."
  **The Fix:** You cannot demand they feel pain every time (impractical). You *can* demand that the protocol does not *rely* on their lack of feeling.
  **Condition:** "Task rotation mandatory. No individual may perform culling for >X months. Mandatory debriefing."
  **Reason:** To prevent the *permanent* hardening of the agent. The discomfort must be renewable, not chronic.

  This procedure gives you a way to say "No" to the black-box mouse study without claiming the mouse has rights. It says: "We cannot build a box we refuse to open." That is a reason a university can say out loud.
