answer: |-
  This is a classic operationalization of the Reichenbach-Kyburg tension. Your lead is asking for the *justification* of the single-case probability, which in frequentist terms requires a stable sequence, and in Bayesian terms requires a defensible prior.

  Below is a practical decision procedure designed for your 5 AM shift. It is not a statistical textbook; it is an epistemic triage tool. It forces you to make the trade-off between **Specificity** (relevance to the current case) and **Stability** (sample size and stationarity) explicit.

  I call this the **Reference Class Stability Protocol (RCSP)**.

  ---

  ### The Reference Class Stability Protocol (RCSP)

  **Purpose:** To determine if a probability number can be responsibly issued, and if so, which reference class justifies it.
  **Inputs:** The event to forecast ($E$), available historical data ($D$), knowledge of physical changes ($C$).

  #### Step 1: Define the Event ($E$) Precisely
  *   **Action:** Write down exactly what the number represents.
  *   **Check:** Is $E$ binary (rain/no rain) or continuous (temp range)? Is the timeframe clear?
  *   **Fail Condition:** If $E$ is vague (e.g., "severe weather" without defining wind/hail thresholds), **STOP**. You cannot define a class for a vague event.
  *   **Output:** A precise definition (e.g., "Max temp > 95°F for 3 consecutive days in City X").

  #### Step 2: The Stationarity Gate (The "Dam" Check)
  *   **Question:** Has the physical mechanism generating $E$ changed fundamentally since the data ($D$) was recorded?
  *   **Criteria:** Look for infrastructure changes (dams, levees, urbanization), instrument changes, or regime shifts (climate steps, ocean cycles).
  *   **Decision:**
      *   **No:** Proceed to Step 3.
      *   **Yes/Unsure:** **FLAG FOR JUDGMENT.** You cannot use raw historical frequencies. You must rely on physical models, not reference classes. If no physical model exists, **ABORT NUMBER**. Issue a qualitative warning instead.
  *   **Philosophical Note:** This is where you avoid the *Gambler's Fallacy* of assuming the future must resemble the past when the "wheel" has been changed.

  #### Step 3: Identify Candidate Classes (Broad vs. Narrow)
  *   **Action:** List two classes:
      1.  **Broad Class ($C_B$):** High $N$, lower relevance (e.g., "All June days in 30 years").
      2.  **Narrow Class ($C_N$):** Low $N$, high relevance (e.g., "June days with this specific upper-air pattern").
  *   **Action:** Count the samples ($N_B$ and $N_N$).

  #### Step 4: The Minimum Effective Sample (MES) Check
  *   **Question:** Is the sample size large enough to support the precision you claim?
  *   **Rule of Thumb:** To claim a probability $p$, you generally need at least $5/p$ occurrences in the class.
      *   *Example:* To claim a "20% chance" (1 in 5), you need at least 25 examples in that class. To claim a "1 in 50 year" event, you need roughly 250 years of data *or* a pooled regional dataset.
  *   **Decision:**
      *   If $N_N$ meets MES: Prefer $C_N$ (Specificity Principle).
      *   If $N_N$ fails MES but $N_B$ passes: **Do not use $C_N$ alone.** You must use $C_B$ as a baseline and adjust subjectively, or pool data.
      *   If Both fail MES: **ABORT NUMBER.** You are guessing.
  *   **Trade-off Handler:** If $C_N$ is too small, you are epistemically forbidden from treating its frequency as a stable probability. You must "shrink" toward the broad class mean.

  #### Step 5: The Judgment Hand-Off
  *   **Action:** If you had to adjust a small sample ($C_N$) using a broad baseline ($C_B$), or if you passed Step 2 with a "Unsure," mark this forecast.
  *   **Label:** **"Model-Adjusted Estimate"** vs. **"Climatological Frequency."**
  *   **Why:** This tells your lead you know the number isn't a pure frequency. It distinguishes *data* from *judgment*.

  #### Step 6: Final Sign-Off
  *   **Issue:** The number + The Class Label.
  *   **Abort:** If Step 2 or Step 4 failed hard.

  ---

  ### Application to Your Cases

  Here is how you run the RCSP on the two scenarios you provided.

  #### Case 1: 3-Day Heat Wave Probability (30 Years Records)
  *   **Event:** Max temp > 95°F for 3 consecutive days.
  *   **Step 1 (Define):** Clear. Binary event over 72h window.
  *   **Step 2 (Stationarity):** *Caution.* Climate is warming. The last 30 years are not perfectly stationary relative to the next 3 days. However, for a 3-day outlook, the *weather pattern* matters more than the climate trend.
      *   *Decision:* Pass with **FLAG**. The mechanism hasn't "broken," but the baseline is shifting.
  *   **Step 3 (Classes):**
      *   $C_B$: All summer days in 30 years ($N \approx 2,700$).
      *   $C_N$: Summer days with *this* specific ridge pattern ($N \approx 15$).
  *   **Step 4 (MES):**
      *   Heat waves are rare. Say they happen 5% of the time.
      *   $C_B$ has plenty of data ($N=2,700$).
      *   $C_N$ has $N=15$. If heat waves happen 50% of the time in this pattern, that's only 7 or 8 events. This is statistically noisy.
      *   *Decision:* $C_N$ is too small to stand alone. Use $C_B$ climatology as the prior, boost the probability based on the $C_N$ frequency, but acknowledge the uncertainty.
  *   **Step 5 (Judgment):** This is a **Model-Adjusted Estimate**. You are blending climatology with pattern recognition.
  *   **Step 6 (Sign-Off):** **ISSUE.**
      *   *Statement to Lead:* "I'm using the 30-year climatology as the baseline ($C_B$) but weighting it up based on the current synoptic pattern ($C_N$). The narrow class sample is too small for a pure frequency, so this is a hybrid estimate."

  #### Case 2: "1 in 50 Year Flood" (Dam Built 20 Years Ago)
  *   **Event:** River crest > Level X.
  *   **Step 1 (Define):** Clear.
  *   **Step 2 (Stationarity):** **FAIL.**
      *   *Reasoning:* A dam fundamentally alters the flow regime, storage capacity, and release mechanics. The "population" of floods *before* the dam is physically incomparable to the "population" of floods *after* the dam.
      *   *Decision:* **ABORT FREQUENCY.** You cannot calculate a "1 in 50 year" probability based on historical records that span the pre-dam and post-dam eras indiscriminately.
  *   **Step 3 (Classes):**
      *   $C_{Pre}$: Pre-dam data (Irrelevant).
      *   $C_{Post}$: Post-dam data ($N = 20$ years).
  *   **Step 4 (MES):**
      *   To estimate a 1-in-50 event ($p=0.02$), you need roughly $5/0.02 = 250$ years of stable data.
      *   You have 20 years of post-dam data.
      *   *Decision:* Massive failure of MES. You have zero observed 1-in-50 events in the post-dam era. Any number you generate is an extrapolation, not a frequency.
  *   **Step 5 (Judgment):** This is not a judgment call; it is a category error.
  *   **Step 6 (Sign-Off):** **DO NOT ISSUE NUMBER.**
      *   *Statement to Lead:* "I cannot issue a frequency-based probability. The reference class is non-stationary due to the dam (Step 2 Fail), and the post-dam sample size is insufficient for a 50-year return period (Step 4 Fail). Issuing a number implies a stability that does not exist. I recommend issuing a scenario-based impact warning instead."

  ---

  ### Where the Philosophy Meets the Desk

  You asked to flag where judgment is dressed up as procedure. Here is the honest breakdown for your seminar paper (and your lead):

  1.  **The Stationarity Gate (Step 2) is Metaphysical:** Deciding if the "mechanism" has changed is not a statistical test; it's a causal claim. In the Heat Wave case, we *know* the climate is changing, but we pretend it's stationary for a 3-day forecast. In the Dam case, the change is discrete and structural. The line between "noise" and "regime change" is a judgment call.
  2.  **The MES Threshold (Step 4) is Pragmatic:** Why $5/p$? Why not $10/p$? There is no philosophical law here. It is a convention of risk tolerance. In high-stakes weather (floods), you should demand higher $N$ than for low-stakes (cloud cover).
  3.  **The "Hybrid" Solution (Step 5) is Empirical Bayes:** When the procedure tells you to "blend" the narrow and broad class because the narrow one is too small, you are effectively doing hierarchical modeling without the math. You are admitting that the single-case probability is a weighted average of the specific evidence and the general prior.

  ### How to talk to your Lead
  When they ask "Which reference class?" do not give a single name. Use the output of Step 6:

  *   **Bad Answer:** "I used the April climatology."
  *   **Good Answer:** "I used the April climatology as the stable baseline, but the sample size for this specific upper-air pattern was too low ($N=9$), so I treated the pattern frequency as a likelihood update rather than a hard frequency. It's a hybrid estimate."
  *   **Best Answer (for the Dam case):** "There is no valid reference class. The dam broke the stationarity of the historical record. A frequency number would be misleading."

  This shows you aren't just crunching numbers; you are managing the *epistemic risk* of the forecast itself.
