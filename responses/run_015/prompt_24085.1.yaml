prompt: |-
  ok so I'm a junior in philosophy and I'm in a formal ep seminar right now where we just covered the reference class problem, and I'm also interning part time at our state weather service where every shift I have to put out a probability forecast with an interval (like "65% chance of precip in the next 24h, 80% interval for the high is 71 to 83") and my lead keeps going "which reference class did you use for that number?" and I have no principled way to answer. I know the textbook stuff about the specificity principle and how you can nest reference classes as finely as you like, but none of that tells me what to actually do at my desk at 5am.

  Can you write a decision procedure I can run before I sign off on a number: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says "don't issue a number," and where it just has to hand off to a human because the question is one of judgment not fact. The thing I really want handled honestly is the tradeoff between a narrow, relevant class (like "days in April when the upper air pattern looks like this") and a broad, data-rich one (like "all April days") — the narrow one is more on point but I might have like 9 examples, the broad one has plenty but is full of junk. I want the procedure to say explicitly when a small sample in a narrow class is a dealbreaker and when it isn't, and to flag which steps are basically judgment calls dressed up as procedure.

  Then run it on two cases: (1) a 3-day heat wave probability for a city that only has 30 years of records, and (2) a "1 in 50 year flood" probability for a river where a dam upstream got built 20 years ago and totally changed the flow regime. I'd expect one of those to come out as "you cant responsibly issue that number" and that's fine, I want to see the procedure actually say that when it applies.
reasoning: |-
