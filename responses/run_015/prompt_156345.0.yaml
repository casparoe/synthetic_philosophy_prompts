answer: |-
  You have independently reinvented two of the most famous objections to Functionalism in the philosophy of mind: **Ned Block's "Blockhead" argument** (the lookup table) and **Hilary Putnam's "Triviality Theorem"** (the rock realizes everything).

  You are correct that the argument is valid. If you accept (1) through (6), (7) follows necessarily. Since (8) is your hard constraint (and mine, and most people's), something upstream has to break.

  You want to keep (1) and (2). That is the hard mode of this problem, because (1) and (2) are the engine that drives the conclusion. If you keep them, the break must happen in **how you cash out "realization."**

  Here is the diagnosis, the fix, and the price list.

  ### The Bug: Premise (3) is too weak

  **Premise (3):** *Realization is a mapping... just in case there is a mapping from its physical states onto the abstract ones that preserves the transitions.*

  This is where the code compiles but the runtime fails. In computer science terms, (3) conflates **data** with **process**, or a **trace** with an **execution**.

  A lookup table contains the *extension* of the function (the input-output pairs). It does not contain the *intension* (the algorithm that derives the output from the input). Functionalism requires that the system *compute* the state, not just *store* the result of the computation.

  **Why (3) looked fine:**
  It matches the standard definition of structural isomorphism in automata theory. If Machine A and Machine B have the same state transition diagram, they are equivalent.
  **Why it fails here:**
  In automata theory, we assume the machine *runs*. A physical lookup table (a book) does not run. It sits. The "transition" from Page 1 to Page 2 is not caused by the content of Page 1; it is caused by an external agent (the reader) following a separate rule ("turn the page"). The causal power resides in the *reader*, not the *book*.

  To save Functionalism, you must upgrade (3) to require **intrinsic causal dynamics**.

  **The Fix:**
  > **(3*) Causal Realization:** A physical system realizes an abstract spec only if the physical states **causally sustain** one another in virtue of their physical properties, matching the causal dependencies of the abstract states.

  In a CPU, State B follows State A because the voltage in the flip-flops *physically forces* the next gate to switch. In the book, Page B follows Page A only because an external agent decides to turn the page. The book has no internal causal glue.

  ### The Cost of Fixing (3)

  If you reject (3) in favor of (3*), you avoid the lookup table and the rock. But you pay a tax:

  1.  **You need a theory of "Physical Causation":** You can no longer treat realization as a purely mathematical mapping. You now have to care about *how* the physics works. You have to distinguish between "states that causally interact" and "states that are just adjacent in space/time."
  2.  **You risk sliding toward (4):** To ensure the causal dynamics are real, you might find yourself needing to insist that the causation happens at a certain speed or density. If the "page turning" takes a century, did the causal link break? This puts pressure on Premise (4).
  3.  **The "Triviality" threat remains:** A clever philosopher can still argue that a rock has enough micro-states to map to your brain, and that thermal fluctuations provide the "causal dynamics." To stop this, you must insist the causal structure is **robust** and **non-arbitrary**. The system must be *disposed* to behave that way, not just happen to match a mapping we impose from the outside.

  ### Alternative Cuts: Pricing the Other Options

  If (3*) feels too metaphysical, here are the other places you can cut, ranked by cost to your engineering intuition.

  #### Option B: Reject (4) (Time/Space Irrelevance)
  **The Move:** Assert that mental states require **real-time causal processing**. A transition that takes a century isn't a thought; it's a fossil.
  **The Cost:** This damages Multiple Realizability (2). If speed matters, then silicon running at GHz might be "too fast" to be a mind, or a distributed system across datacenters might be "too slow" to hold a unified belief. You introduce a **physical chauvinism** based on temporal constants.
  **Engineering Analogy:** Real-time constraints. A control loop with 100s latency is unstable. If the mind is a control loop, latency kills it.
  **Verdict:** High cost. It makes "mind" dependent on physical constants of our universe, not just abstract structure.

  #### Option C: Reject (1) (Role Sufficiency)
  **The Move:** Admit that input-output role is necessary but **not sufficient**. There is something about the *internal structure* (or the "stuff") that matters.
  **The Cost:** You abandon pure Functionalism. You admit that a system could act exactly like it's in pain but not *be* in pain (Absent Qualia).
  **Engineering Analogy:** Interface vs. Implementation. You are admitting that for "mind," the implementation details leak. The spec isn't enough; you need to know if it's a mock or the real class.
  **Verdict:** Philosophically honest, but you said you want to keep (1). This is the "Qualia" escape hatch.

  #### Option D: Reject (5)/(6) (The Complexity Defense)
  **The Move:** Argue that while a lookup table is *mathematically* possible, it is **physically impossible** (the table for a human mind would be larger than the observable universe). Therefore, it's not a valid realizer in *this* world.
  **The Cost:** This saves the intuition but loses the principle. It admits that the lookup table *would* have a mind if we could build it, we just can't. It doesn't solve the "Rock" problem (a rock is small enough).
  **Engineering Analogy:** "It works in theory but not in production."
  **Verdict:** Weak. It avoids the metaphysical bullet but doesn't disarm the gun.

  ### Addressing Your "Dead Code" Intuition

  > *If the role is all there is, a compiler is allowed to do dead-code elimination on my inner life... Is that the same problem as the book?*

  **Yes, it is exactly the same problem.**

  In compiler terms, Functionalism as you defined it in (1)-(3) is **Extensional Equivalence**. It says two systems are identical if they produce the same outputs for the same inputs.
  Your intuition is demanding **Intensional Equivalence**. You care about *how* the output is derived.

  If a compiler replaces a complex calculation `x = (a * b) + c` with a pre-computed constant `x = 10`, the *behavior* is identical. But if `x` represents a mental state like "realizing a math proof," the *process* of calculating it was the mental state. The constant is just the result.

  By fixing (3) to require **intrinsic causal dynamics**, you solve the Dead Code problem too. A system where the state is "eliminated" (replaced by a stub that just outputs the result) lacks the causal structure where the internal state *does work*. The stub has no internal transitions; it's a lookup table of size 1.

  ### Recommendation

  **Reject (3). Adopt (3*).**

  **Why:** It preserves (1) and (2) (Functionalism and Multiple Realizability) while saving (8) (Books aren't minds). It aligns with your engineering intuition that **running code** is different from **stored data**, even if the data describes the code.

  **The Price:** You must accept that "computation" in the mind isn't just a logical mapping; it's a **physical process**. You have to care that the states are *causally active*, not just *causally inert markers*.

  **How to explain it in the mailing list:**
  "Functionalism requires the instantiation of the *algorithm*, not just the *trace*. A lookup table stores the trace of a computation. A mind performs the computation. The difference is where the counterfactual support comes from: in a mind, the physical structure supports the transitions; in a book, the transitions are imposed by an external reader. Therefore, (3) is false; realization requires intrinsic causal power, not just isomorphic mapping."

  This position is often called **Causal Role Functionalism** (as opposed to Machine Functionalism). It's the standard upgrade path for engineers who run into the Blockhead argument.
