  | **(iii) Satire/Harassment** | Step 5 | 5, 7 | Stop Rule triggered. Rule frozen; lookup table issued for this class. | Convention (Fiat) | Lookup table may become outdated; rigid. | That a fourth redraft is forbidden despite feeling "almost there." |

