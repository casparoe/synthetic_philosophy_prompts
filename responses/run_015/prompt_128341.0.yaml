answer: |-
  ### Table 1: Weekly Dispute Resolution Procedure

  | Step | Entry condition | Question to ask | What counts as a sufficient answer | If it fails, go to | Hard-case flag |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Fact Check** | Item has persistent labeler disagreement (e.g., 2+ conflicting tags). | "Do the disagreeing labelers see the same things in the content (e.g., same words, same image features)?" | Yes: All parties agree on the visible facts. No: One labeler saw something others missed. | **Add Worked Example** to guidelines showing the fact. End procedure. | No |
  | **2. Rule Description** | Facts are agreed upon. | "Can each side state the rule they think they are following in one simple sentence?" | Yes: Two distinct interpretations are clearly stated. No: Interpretations are vague or identical. | Return to Step 1 (re-examine facts) or End (no disagreement). | No |
  | **3. Probe Design** | Two distinct interpretations exist. | "Can we design a test item that would make Interpretation A say 'Yes' and Interpretation B say 'No'?" | Yes: A specific hypothetical or real item is described. No: The interpretations always yield the same result on any possible item. | **Record Unfalsifiable Divergence**. End procedure. | **Yes** (Divergent Rule) |
  | **4. Reality Check** | A probe item is designed. | "Is this test item something we could actually receive on the platform?" | Yes: It is a realistic scenario. No: It is theoretically possible but practically impossible (e.g., specific rare code). | **Record Unfalsifiable Divergence**. End procedure. | **Yes** (Unfalsifiable) |
  | **5. History Check** | Probe is realistic. | "How many times have we rewritten this specific rule to fix this specific split?" | Count is 0, 1, or 2. | **Trigger Stop Rule** (Convert to Fiat). Go to Step 7. | **Yes** (Chronic) |
  | **6. Values Check** | Count is 0, 1, or 2. | "Is the difference between Interpretation A and B about safety risk tolerance rather than meaning?" | Yes: Both readings are valid, but one is safer/stricter. | **Escalate to Leadership**. Go to Step 7. | **Yes** (Values) |
  | **7. Decision & Sign-off** | Procedure reached a terminal state (Example, Fiat, Escalation, or Unfalsifiable). | "Who owns this decision and when do we review it?" | Named role signs off; review date set (max 3 months for Fiat). | N/A | **Yes** (Final) |

  ### Table 2: Worked Cases

  | Case | Step entered | Steps run, in order | Outcome | Settled by fact, by convention, or by values | Residual risk | What the asker will dislike |
