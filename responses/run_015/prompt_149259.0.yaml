answer: |-
  **Examination Instrument: Philosophy of Moral Change**

  **Course:** Upper-Level Undergraduate Philosophy
  **Time Allowed:** 45 Minutes
  **Word Limit:** Approximately 800 words
  **Total Marks:** 25

  **Essay Question**

  Moral revolutions often involve practices ceasing to be honorable rather than merely becoming illegal. Consider a hypothetical norm in high-energy physics: for decades, an unwritten rule granted senior researchers automatic co-authorship on junior colleagues' papers, sustained by an honor culture of "founder's privilege." Recently, this practice was rapidly abandoned without legal intervention.

  Using this case, evaluate the competing explanations for the collapse of entrenched norms: rational argument, material interest, and the redirection of honor. Specifically, engage Bernard Williams's thesis that moral change originates in internal contradictions within honor codes, and Kwame Anthony Appiah's analysis that honor is redirected rather than eliminated.

  In your response, you must:
  1.  Distinguish these three mechanisms of change, explicitly referencing the Williams and Appiah frameworks.
  2.  Apply these frameworks to the physics case to diagnose how honor operated differently under each explanation.
  3.  Confront the meta-problem that if honor can justify both a practice and its abandonment, the honor-based account risks unfalsifiability. Propose a methodological remedy to avoid this trap.

  ***

  **Model Answer**

  Moral change is distinct from legal prohibition; it requires a shift in what agents feel shame or pride about. When explaining why entrenched norms collapse, we must distinguish between rational persuasion, material shifts, and the dynamics of honor itself. The case of "founder's privilege" in high-energy physics illustrates the tension between these explanations.

  Bernard Williams argues that moral change often stems from internal contradictions within a society's ethical life. A practice becomes unsustainable when it conflicts with other deeply held values within the same code. Conversely, Kwame Anthony Appiah suggests that honor is rarely eliminated; rather, it is redirected. Practices disappear when the honor associated with them is transferred to competing behaviors. Both contrast with standard rationalist or materialist explanations, which posit that change occurs because agents are convinced by argument or incentivized by cost-benefit analysis.

  In the physics case, a materialist explanation suggests junior researchers gained leverage due to labor shortages, making senior co-authorship too costly. A rationalist explanation suggests the community recognized the practice impeded scientific truth. However, Williams's framework offers a deeper diagnostic: the honor code of physics values "meritocratic contribution." As the field grew, "founder's privilege" increasingly contradicted the core value of "merit." The shame associated with taking unearned credit eventually outweighed the honor of seniority. The change came not from outside pressure, but from the code consuming itself.

  Appiah's framework complements this by analyzing where the honor went. The practice did not vanish because honor became irrelevant; it vanished because honor was redirected toward "mentorship." Senior researchers gained more prestige by fostering independent juniors than by claiming their work. Under Appiah's view, the honor culture remained intact, but the currency of honor changed. If we relied solely on rational argument, we would miss why the change felt obligatory rather than merely prudent. The shift was normative, not just epistemic.

  However, relying on honor codes invites a meta-problem: unfalsifiability. If honor explains why a practice existed (privilege was honorable) and why it ended (independence became honorable), the theory risks explaining everything and nothing. It becomes a tautology where any change is retroactively fitted to a shift in honor. To avoid this, we must treat honor as a variable, not a constant cause.

  A methodological remedy requires triangulation. We must look for exogenous shocks or independent evidence of the contradiction before the change occurs. In the physics case, we should look for archival evidence of dissenting voices citing the meritocratic contradiction *before* the norm shifted, rather than accepting post-hoc justifications. Additionally, we must track semantic shifts in real-time. If "honor" is the cause, there should be a observable period where the language of prestige is contested, not just changed after the fact. By demanding evidence of the contradiction or redirection prior to the behavioral shift, we prevent the honor-based account from becoming a just-so story.

  Ultimately, Williams and Appiah provide necessary tools to understand moral revolutions, but only if we guard against circularity. The physics case shows that practices die when they become dishonorable, but we must verify *why* they became dishonorable through independent data, ensuring we distinguish genuine moral mechanics from retrospective rationalization.

  ***

  **Marking Scheme**

  **Total Marks:** 25

  **Move 1: Conceptual Distinction (8 Marks)**
  *   **Criteria (A Grade):** Clearly distinguishes rational argument, material interest, and honor-based change. Accurately defines Williams's "internal contradiction" and Appiah's "redirection of honor." Explicitly contrasts these with material/rational models.
  *   **Criteria (B Grade):** Defines the theories but fails to clearly contrast them with material/rational explanations, or conflates Williams and Appiah.
  *   **Failure Mode:** Treating Williams and Appiah as identical; ignoring the rational/material alternatives entirely.
  *   **Allocation:** 8 marks for precise distinction; 4 marks deducted for conflation or omission of alternatives.

  **Move 2: Application to Physics Case (10 Marks)**
  *   **Criteria (A Grade):** Concrete application of both frameworks to the "founder's privilege" scenario. Explains specifically how the contradiction arises (Williams) and where the honor is redirected (Appiah) within the context of the hypothetical.
  *   **Criteria (B Grade):** Applies theories vaguely (e.g., "honor changed") without specifying the mechanism within the physics context.
  *   **Failure Mode:** Generic application that could apply to any case (e.g., slavery) without referencing the specific details of the physics hypothetical (senior/junior dynamics).
  *   **Allocation:** 10 marks for specific, dual-framework application; 5 marks deducted for vague or single-framework application.

  **Move 3: Unfalsifiability and Remedy (7 Marks)**
  *   **Criteria (A Grade):** Identifies the risk of tautology (honor explains stability and change equally). Proposes a concrete methodological remedy (e.g., triangulation, pre-change evidence, semantic tracking).
  *   **Criteria (B Grade):** Identifies the problem but offers no remedy, or offers a trivial remedy (e.g., "study harder").
  *   **Failure Mode:** Ignoring the meta-problem entirely; proposing a remedy that does not address falsifiability.
  *   **Allocation:** 4 marks for identifying the problem; 3 marks for a viable methodological remedy.
