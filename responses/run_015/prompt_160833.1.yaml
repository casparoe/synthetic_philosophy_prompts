prompt: |-
  I'm working on a short piece about probability puzzles for a general science magazine, and I want to quote a paragraph from a popular-maths book (I'd rather not name it, but the author is a working mathematician). I dont want to put something in print that makes a probabilist wince, and I can't tell where the problems are. The passage says:

  Bertrand's great paradox of 1889 shows that the principle of indifference — split your credence evenly when you have no reason to prefer one outcome — is flatly self-contradictory. Take the chance that a random chord of a circle is longer than the side of the inscribed equilateral triangle. All three of Bertrand's arguments are one-to-one labellings of exactly the same set of chords, so indifference applied to the same problem in three equally legitimate ways gives three answers: choose two points on the circumference and you get a third; choose a radius and a point on it and you get a half; choose a point in the disc as the midpoint and you get a quarter. Contradiction. Measure-theoretic probability, which Kolmogorov put on an axiomatic footing in the 1930s, dissolved the whole thing: a probability is just a measure on a specified sample space, and different sample spaces are simply different questions, so nothing contradicts anything. The moral is that "at random" is empty until you say how the chord was produced. Which is also why flat priors can't be trusted: a jury told to start at 50/50 before hearing evidence, like a Bayesian who spreads her prior evenly over a parameter, has no idea what she is saying.

  My hunch is that the Kolmogorov sentence is doing too much work and that the jump to the jury is a stretch, but I can't say why. Is this a fair summary? Go through it and tell me what a probabilist or philosopher of probability would accept, what they'd call a simplification, and what is just wrong — and whether the closing move to priors survives once the accurate parts are cleaned up. One more thing: someone told me there's a well-known invariance argument that picks one of the three numbers as the "objective" answer. Is that real, what exactly does it demand, and is it settled? If the book should have mentioned it, I'll need a sentence on it in my piece.
