      *   *CRM-114:* The discriminator/filter that rejects valid packets (recall codes) because the key is compromised/changed.
      *   *War Room:* The dashboard/monitoring center, but with high latency and poor write-access (President can't stop the planes).
      *   *Doomsday Machine:* The ultimate automated failover script. `if attack_detected then launch_all()`. No manual override.
      *   *The Ending:* System crash (nuclear winter).

  3.  **Address the Core Question: Deterrence Argument vs. Engineering Comedy:**
      *   *Initial thought:* It's both. The engineering failures *are* the political argument. The system *requires* these failures to function as intended (deterrence), but the failures make catastrophe inevitable.
      *   *Refinement:* The film argues that "perfect" deterrence *is* an engineering impossibility for humans, or rather, that the engineering required to make it credible removes the human element necessary to prevent accident.

  4.  **Tackle the User's Specific Sketches:**

      *   **Sketch 1: Announcement/Verification Trap.**
