      *   *Key Insight:* The film suggests that to make deterrence work, you have to build a system that *looks* like it might be run by a Ripper. If the enemy thinks you are rational enough to recall the planes, they might call your bluff. If they think you are automated (Doomsday), they panic or preempt.

