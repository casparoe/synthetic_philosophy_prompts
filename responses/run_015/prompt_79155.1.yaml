answer: |-
  Here are nine questions designed to corner the specific tensions in Actualist Counterpart Theory, with follow-ups tailored to the standard defensive moves a proponent will make.

  **1. The Objectivity of Similarity**
  You claim counterparts are actual people picked out by similarity, not transworld identities. But similarity is notoriously vague; I'm similar to a plumber in one respect and a philosopher in another. What constrains the counterpart relation so that it's a fact about *reality* whether I could have been a plumber, rather than just a fact about how we choose to classify people?

  *   **Follow-up (If she says similarity is objective/primitive):** If it's primitive, what grounds it? If there are two actual people who resemble me equally well, but one is a plumber and one is a banker, is it *true* that I could have been a plumber, or is the fact indeterminate until we specify our interests?
  *   **Follow-up (If she says it's context-sensitive):** Then doesn't the truth value of "I could have been a plumber" change depending on who is speaking? If so, aren't we doing anthropology of our interests rather than metaphysics of modality?

  **2. The Necessity of Identity**
  Standard logic tells us identity is necessary: if I am me, I couldn't have been someone else. But on your view, if "I could have been a plumber" means "There is a counterpart who is a plumber," and that counterpart is a distinct actual person, aren't you saying I could have been *someone else*? How do you preserve the necessity of identity without banning multiple counterparts?

  *   **Follow-up (If she denies necessity of identity for counterparts):** So if I have a counterpart who is distinct from me, does that mean there is a possible situation where I am distinct from myself? If you say "no," aren't you just using the word "identity" to mean "counterpart relation" and changing the subject?
  *   **Follow-up (If she bolts on a uniqueness requirement):** If you require a unique counterpart to save identity, how do you handle cases where I seem to have two equally good candidates? Do you deny the possibility, or do you accept that identity can be contingent?

  **3. The Necessity of Distinctness and Regret**
  Nadia's worry was about regret: if the guy who could have been a plumber is just some other actual person who resembles me, why should I care about his life? If the counterpart relation makes us distinct, doesn't it sever the emotional and rational link required for me to feel regret about the path I didn't take?

  *   **Follow-up (If she says we care because they represent us):** But representation is usually about *information*, not *identity*. I care about my life because it's *mine*. If the counterpart theory makes the "possible me" literally someone else, aren't you explaining away the very phenomenon of modal regret we started with?
  *   **Follow-up (If she says distinctness doesn't matter):** Then why isn't it equally rational for me to regret the life of a stranger who resembles me? What does the counterpart relation add to mere resemblance that justifies the special status of "possibility"?

  **4. Iterated Modality and S5**
  Counterpart relations are typically not transitive: A is similar to B, and B to C, but A might not be similar to C. This means S4 and S5 modal logics fail on your view. Do you bite the bullet and say "Possibly Possibly P" does not imply "Possibly P," and if so, how do you explain why our logical intuitions scream that metaphysical possibility *should* be transitive?

  *   **Follow-up (If she accepts the failure of S5):** Are you prepared to say that there are truths about what is possible that are inaccessible even in principle? That seems to make modality epistemic rather than metaphysical.
  *   **Follow-up (If she tries to save S5):** How do you make a similarity relation transitive without collapsing it into identity? If the relation is transitive and symmetric, aren't you just reinventing transworld identity under a different name?

  **5. The Twin Problem**
  Consider a concrete case: I have an identical twin. We share origins, genetics, and history up to a point. On a similarity metric, he is my closest match. Does your theory say he is my counterpart? If so, does that mean I could have been *him* specifically?

  *   **Follow-up (If she says yes, he is the counterpart):** Then if he committed a crime and I didn't, is it true that I *could have* committed that crime in the sense that it was a possibility for *me*? Or is it just a possibility for him that I'm borrowing?
  *   **Follow-up (If she says no, similarity isn't enough):** Then what constraint rules him out? If it's not similarity, is it some haecceity or "thisness"? And if you admit haecceities, haven't you abandoned the spirit of counterpart theory for transworld identity?

  **6. Semantic Circularity**
  Nadia argued you can't state the theory without modal vocabulary. Can you define the counterpart relation using only non-modal terms—actual existence, spatiotemporal location, and qualitative properties? Or does your definition secretly rely on words like "could," "might," or "possible"?

  *   **Follow-up (If she claims it's non-modal):** If similarity is just qualitative resemblance, then any actual duplicate is a counterpart. But we usually think counterparts must be *possible* versions of me, not just similar things. How do you get "possibility" out of "similarity" without putting "possibility" in?
  *   **Follow-up (If she admits modal terms are needed):** Then isn't your view just a notational variant of standard possible-worlds semantics? If you need modality to define counterparts, but counterparts to define modality, isn't the analysis circular?

  **7. Essence and Work**
  Does essence do any work in your picture, or is essence just a shadow cast by the counterpart relation? In other words, do I have essential properties that determine who my counterparts are, or do I have whatever properties my counterparts share, and we call that "essential"?

  *   **Follow-up (If essence determines counterparts):** Where do these essential properties come from? If they aren't grounded in the counterpart relation, aren't they just transworld identity conditions in disguise?
  *   **Follow-up (If counterparts determine essence):** Then essence becomes trivial. If the counterpart relation is context-sensitive, doesn't that make my essence context-sensitive too? Could I be essentially human in one conversation and essentially a plumber in another?

  **8. The "One World" Ontology**
  You reject modal realism, saying there's only one world. But if counterparts are actual people, and I have a counterpart who is a plumber, that plumber exists in the *same* world as me. Doesn't this collapse the distinction between "I could have been a plumber" and "Someone else is a plumber"?

  *   **Follow-up (If she says the distinction is in the description):** But the truth conditions seem to be the same. If the claim "I could have been a plumber" is made true by the existence of an actual plumber, how is that different from saying "There is a plumber"?
  *   **Follow-up (If she says it's about counterfactuals):** Then aren't you relying on counterfactuals to do the heavy lifting? And if so, why not just analyze the counterfactuals directly without the detour through counterparts?

  **9. Falsifiability**
  Finally, what would actually change your mind? I'm not asking for a theoretical cost you're willing to eat, like losing S5 logic. What evidence, intuition, or argument would count as definitive evidence *against* Actualist Counterpart Theory and force you to abandon it?

  *   **Follow-up (If she says nothing could):** Then isn't this a framework choice rather than a truth claim? If no state of affairs could falsify it, how is it metaphysics rather than just a useful way of speaking?
  *   **Follow-up (If she offers a condition):** If that condition were met, would you revert to transworld identity, or would you become a modal realist? What is the competing view that you think is *true* if your view is false?
