      *   *Relationism:* Spacetime is just the set of relations between material objects. No objects, no space.
      *   *Newton's Bucket:* Water climbs the walls when spinning. Spinning relative to what? If the universe is empty, relationism struggles to explain *what* it's spinning against. Substantivalism says "against spacetime itself."
      *   *The Hole Argument:* If spacetime points have independent identity (substantivalism), I can shuffle points inside a "hole" (empty region) without changing observable matter distribution. This leads to indeterminism in GR.
      *   *Gauge/Redundancy:* Modern physics often views coordinate freedom as gauge redundancy.

  3.  **Map to Database Vocabulary:**
