answer: |-
  Here is a teaching plan designed for your specific audience and constraints. It prioritizes conceptual clarity over mathematical rigor, focusing on the structural implications for health economics.

  ### 1. The Sequence (50 Minutes)

  The critical insight for your group is that Harsanyi is a theorem about **risk**, not just aggregation. If you treat it as deterministic, you lose the linearity result.

  **0:00–0:05 | Setup: The "Why"**
  *   **Goal:** Frame this as the theoretical baseline for next month's equity weighting session.
  *   **Script:** "Next month we discuss deviating from equal weighting. To know what a deviation *is*, we need the benchmark. Harsanyi provides the only formal justification for summing individual utilities, but it is often misunderstood as mandating *equal* weights. It does not."

  **0:05–0:15 | Step 1: Individual Rationality (vNM)**
  *   **Concept:** Define individual utility $U_i$ not as "happiness" but as a representation of preferences over **lotteries**.
  *   **Dependency:** This must come first. If you define utility over sure states only, you cannot derive linearity.
  *   **What breaks if later:** If you introduce social aggregation before establishing that individuals maximize *expected* utility, the group will assume $U_i$ are ordinal rankings. Harsanyi's linearity depends entirely on the vNM **Independence Axiom** applied to individuals.
  *   **Health Econ Translation:** "You already treat QALYs as cardinal. Harsanyi requires that these cardinals represent willingness to take risks (e.g., a gamble between cure and death vs. a certain intermediate health state)."

  **0:15–0:25 | Step 2: Social Rationality & Pareto**
  *   **Concept:** Society is also a rational agent facing lotteries.
  *   **The Pareto Condition:** State **Strong Pareto**: If every individual prefers Lottery A to Lottery B, Society must prefer A to B. If everyone is indifferent, Society is indifferent.
  *   **Addressing your Pareto worry:**
      *   *Unanimity of Indifference* ensures the social utility function isn't constant (it anchors the scale).
      *   *Strong Pareto* (unanimous preference) is what rules out **negative weights**. If a weight were negative, you could improve that individual's expected utility while holding others constant, which would lower the social sum, violating Pareto.
  *   **The Result:** $W = \sum_{i=1}^{n} a_i U_i + b$. (Social welfare is a linear combination of individual expected utilities).

  **0:25–0:35 | Step 3: The Weights & The Impartial Observer**
  *   **Concept:** Distinguish the **Aggregation Theorem** from the **Impartial Observer Argument**.
  *   **The Distinction (One Sentence):** "The Aggregation Theorem proves the social welfare function must be a *weighted sum*; the Impartial Observer argument is a separate ethical claim used to argue those weights should be *equal*."
  *   **Why this matters:** Your analysts likely conflate them. Harsanyi (1955) gives the math (weighted sum). Harsanyi (1953/1977) gives the ethics (veil of ignorance $\rightarrow$ equal weights). You can accept the theorem while rejecting equal weights (e.g., giving higher weight to the severely ill).
  *   **The "Utilitarian" Label:** Tell them: "This theorem vindicates the *structure* of utilitarianism (summing), but it does not vindicate standard Cost-Benefit Analysis (which uses willingness-to-pay weights) nor does it mandate equal QALY weighting. It simply says whatever weights you choose, you must sum expected utilities."

  **0:35–0:45 | Step 4: The Carrying Example (Whiteboard)**
  *   **Setup:** Two patients (Alice, Bob). One dose of a drug. Fixed population (no population ethics). Health outcomes only (no money/WTP).
  *   **Utilities:** Normalize $U(\text{Death}) = 0$, $U(\text{Cure}) = 1$. Assume $U_{\text{Alice}} = U_{\text{Bob}}$.
  *   **Options:**
      1.  **Deterministic A:** Give to Alice. (Alice: 1, Bob: 0). Social Sum = $w_A(1) + w_B(0)$.
      2.  **Deterministic B:** Give to Bob. (Alice: 0, Bob: 1). Social Sum = $w_A(0) + w_B(1)$.
      3.  **Coin Flip:** 50% chance of A, 50% chance of B.
  *   **The Harsanyi Calculation:**
      *   Alice's Expected Utility: $0.5(1) + 0.5(0) = 0.5$.
      *   Bob's Expected Utility: $0.5(0) + 0.5(1) = 0.5$.
      *   Social Welfare: $w_A(0.5) + w_B(0.5)$.
      *   **Result:** If $w_A = w_B$, Harsanyi says Society is **indifferent** between giving it to Alice deterministically and flipping a coin.
  *   **Why this example:** It isolates *ex ante* vs. *ex post* equity without introducing money or population changes.

  **0:45–0:50 | Step 5: The Sen Objection & Closing**
  *   **Concept:** Ex Post Equity.
  *   **The Argument:** Many people prefer the Coin Flip over Deterministic A, even if expected utilities are identical, because the flip gives Bob a *chance* (fairness in process/outcome realization).
  *   **The Conflict:** Harsanyi's theorem *forbids* this preference. If you prefer the flip, you violate the Pareto principle applied to the lotteries (since individuals are indifferent ex-ante) or the vNM independence axiom.
  *   **Closing:** "Next month, when we discuss equity weights, we are essentially asking: Do we stick with Harsanyi's linear sum, or do we modify the function to capture ex-post fairness concerns like the coin flip preference?"

  ---

  ### 2. The Carrying Example: Specifications

  To work in 10 minutes, the example must be rigidly constrained.

  **What it must contain:**
  1.  **Fixed Identity:** Alice and Bob exist in all states. (Prevents population ethics drift).
  2.  **Symmetric Stakes:** Both need the dose equally to survive/thrive. (Isolates the fairness mechanism).
  3.  **A Lottery Option:** You must explicitly model the coin flip as a social lottery.
  4.  **Cardinal Scale:** Explicitly state $U=0$ and $U=1$ to allow hand calculation of the sum.

  **What it must NOT contain:**
  1.  **Money/Cost:** If you introduce cost, they will silently substitute $U_i$ with Willingness-To-Pay. This corrupts the theorem into CBA.
  2.  **Differential Benefit:** Do not make the drug work better for Alice. That introduces efficiency arguments that muddy the equity weighting point.
  3.  **More than 2 people:** Keep the whiteboard math trivial ($n=2$).

  ---

  ### 3. Addressing Misconceptions

  Here is how to handle the specific misconceptions you listed, integrated into the flow:

  **1. "This vindicates the CEA/CBA we already run."**
  *   **Correction:** "It vindicates the *additive form*, not the *inputs*. Standard CEA sums QALYs (equal weights). Standard CBA sums WTP (ability-to-pay weights). Harsanyi allows both, provided the weights are positive and constant. It does not tell you which weights are *moral*."

  **2. "QALYs are the utility functions being summed."**
  *   **Correction:** "Only if your QALYs are derived from vNM risk preferences. If your QALYs are time-trade-off based but not tested for independence under risk, Harsanyi technically doesn't apply. We assume they do, but it's an assumption."

  **3. "Summing implies equal concern for everyone."**
  *   **Correction:** "Summing implies *separability*, not equality. $W = 2U_{\text{poor}} + 1U_{\text{rich}}$ is still a sum. Harsanyi justifies the plus sign, not the coefficients."

  **4. The Sen Objection (Distribution Indifference)**
  *   **Placement:** Put this at the very end (Step 5 above).
  *   **The Whiteboard Argument:**
      *   Write: $U_{\text{Alice}}(\text{Flip}) = 0.5$. $U_{\text{Bob}}(\text{Flip}) = 0.5$.
      *   Write: $U_{\text{Alice}}(\text{Deterministic}) = 1$ or $0$. $U_{\text{Bob}}(\text{Deterministic}) = 0$ or $1$.
      *   **The Kicker:** Under Harsanyi, individuals rank lotteries by expected utility. Ex-ante, Alice and Bob are indifferent between the Flip and a 50% chance of the Deterministic outcome. By Pareto, Society must be indifferent.
      *   **Sen's Point:** If Society *prefers* the Flip (to avoid a world where Bob definitely dies), Society violates Harsanyi's axioms. This shows Harsanyi is strictly **Ex-Ante** welfarist.

  ---

  ### 4. The Final Comprehension Question

  Do not ask "Do you understand?" Ask a question that forces them to apply the weights distinction.

  **The Question:**
  > "If we decide to apply an equity weight of 1.5 to QALYs gained by the severely ill, does that violate Harsanyi's Aggregation Theorem?"

  **The Answer you want to hear:**
  > "No. The theorem requires a weighted sum, but it does not dictate that weights must be equal. It only requires weights to be positive (via Pareto)."

  *(If they say "Yes, it violates utilitarianism," they have conflated the Aggregation Theorem with the Impartial Observer argument.)*

  ---

  ### 5. The "Do Not Go Into" List

  Be explicit with the group that you are excluding these topics to stay within 50 minutes. This protects you from "gotcha" questions.

  1.  **The Proof:** "We are taking the result as given; the proof relies on linear algebra properties of the vNM axioms."
  2.  **Interpersonal Comparison of Utility:** "Harsanyi assumes $U_i$ are comparable. How we measure that (QALYs vs. SWB) is a measurement problem, not a social choice problem. We are assuming comparability for today."
  3.  **Arrow's Impossibility Theorem:** "Arrow deals with ordinal preferences over deterministic states. Harsanyi deals with cardinal preferences over lotteries. They are different frameworks; do not confuse the impossibility results."
  4.  **Cardinalization Debates:** "We are assuming vNM utility is the correct cardinalization. We are not debating whether other cardinalizations exist."
  5.  **Variable Population:** "We are assuming a fixed population. Critical Level Utilitarianism and Repugnant Conclusion issues are out of scope."

  ### Summary of the "Utilitarian" Move
  You suspected your draft move ("...this is why utilitarian cost-benefit analysis has a claim on us") was wrong. You are correct.
  **Revised Move:** "This is why **welfarist** analysis has a claim on us. It proves that if we respect individual risk preferences and Pareto efficiency, our social objective function *must* look like a weighted sum of utilities. Whether those weights are 1 (Utilitarian), based on income (CBA), or based on severity (Equity Weighted QALYs) is an ethical choice the theorem leaves open."
