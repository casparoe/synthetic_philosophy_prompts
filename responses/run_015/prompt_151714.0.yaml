prompt: |-
  Something about the way rich countries actually run their borders has been bugging me, and I cant put my finger on the shape of the theory behind it. Here's the bundle of things I mean, all of them completely standard practice:

  - They let in plenty of people, but a lot of them on temporary work visas tied to one employer. Quit, or get fired, and your right to be there evaporates. So whether you stay depends on continuing to be useful to one particular private party.
  - Someone whose grandparent was a citizen, who has never set foot in the country and speaks none of the language, can show up tomorrow, vote, get a passport. Someone who was brought over at age two and has lived there thirty years, pays taxes, has citizen kids, is removable — and the removal is enforced, by people with guns, against someone with no vote and no say in the rule that's being enforced on them.
  - Inside blocs like the EU, the borders between member states are basically open and everyone treats that as obviously fine; the outer edge of the same territory is fenced and patrolled and everyone treats that as obviously necessary.
  - Nobody seriously claims a right to stop people leaving, and stripping an actual citizen and kicking them out is treated as grotesque. Refusing to let someone in is treated as the least controversial thing a state does.
  - Except asylum, which is the one route where the state's own preferences arent supposed to matter, and which states visibly resent having to honour.

  So: what does this package presuppose? I dont mean is it justified — I mean, what view of membership, of territory, of consent, of who owes reasons to whom, does the whole thing only make sense under? Is it one theory, or several bolted together — does the guest-worker bit come from a different place than the descent bit, or the outer fence bit? Is there a real inconsistency in there, or does one story cover all of it?

  My own half-baked framing, take it or leave it: it looks to me like what's being claimed isn't really a right to exclude so much as a right to refuse without having to say why — a right to not be answerable. Asylum is then interesting precisely because it's the one place that privelage is withdrawn, and states experience the withdrawal as a loss of something. Does that reconstruct the practice better than the usual framings (a club with freedom of association, an owner of territory, a trustee of a people's self-determination, a manager of a labour market), or is it just relabelling?

  Concretely: if you swapped in the view that membership tracks subjection and actual participation — you're a member of whatever really rules you and whoever you actually live among, not of wherever your grandparents came from — what would have to change? Which bits collapse right away, which survive (does the internal/external asymmetry survive?), and which bits are just underdetermined, where several theories would license the same practice and the practice tells us less than we think?

  Also please flag how confident you are in what you're saying, and which single point you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Question:** What political theory/philosophical framework underlies the actual border practices of rich countries (specifically the "bundle" of practices described)?
      *   **The Bundle:**
          1.  Temporary work visas (tied to employer, precarious).
          2.  Jus sanguinis (citizenship by descent, no connection) vs. long-term resident deportability.
          3.  Internal openness (EU) vs. External fortification.
          4.  Right to exit vs. No right to enter (and no exile of citizens).
          5.  Asylum as a reluctant exception (state sovereignty vs. international obligation).
      *   **User's Hypothesis:** It's not a "right to exclude" but a "right to refuse without giving reasons" (a right to unaccountability/discretion). Asylum challenges this because it demands accountability/reasons.
      *   **Counterfactual:** What if membership tracked *subjection* and *participation* (all affected interests/all subject to coercion) instead of descent or state discretion? What collapses? What survives?
      *   **Meta-Request:** Flag confidence levels and identify the point of least certainty.

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *Liberal Nationalism:* (David Miller, Yael Tamir). States are projects of national self-determination. Membership is about shared culture/history. Explains jus sanguinis and exclusion, but struggles with the guest-worker exploitation aspect (why not integrate them?).
      *   *Civic Republicanism:* Membership is about participation in self-government. Explains why citizens can't be exiled (loss of political voice) but struggles with jus sanguinis (no participation) and guest workers (subject to law but no voice).
      *   *Property/Ownership Model:* The state "owns" the territory. Explains exclusion, but struggles with the internal/external asymmetry (why open borders inside EU?) and the guest worker issue (tenants vs. owners?).
      *   *Global Capitalism/Neoliberalism:* Borders are filters for capital and labor. Labor needs to be flexible (guest workers) but not costly (no social rights). Capital moves freely (EU internal). This fits the *material* practice well but is more of a sociological explanation than a normative political theory.
      *   *Sovereignty as Discretion:* (Your hypothesis). The core is the *prerogative* power. The state asserts the ultimate authority to decide, unencumbered by external justification, except where specifically constrained (asylum).
      *   *Caste/Status Theory:* (Ayelet Shachar, "The Birthright Lottery"). Citizenship is property passed down. Borders protect the value of that property. Guest workers are a lower caste allowed in for utility but denied status to protect the value of citizenship.

  3.  **Synthesizing the "Bundle":**

      *   The practices aren't consistent with *one* pure normative theory (like strict liberalism or strict nationalism).
      *   They look like a *hybrid* regime designed to maximize state utility while minimizing obligation.
      *   *Key Insight:* The system treats citizenship as **property** (to be inherited and protected) and non-citizens as **factors of production** (to be used and discarded).
      *   *The "Right to Unaccountability":* This is a strong insight. It aligns with the concept of *sovereign discretion*. In law, this is often "plenary power."

  4.  **Addressing the User's Hypothesis:**

      *   Is it just relabeling? No, it's sharper. "Right to exclude" implies a boundary. "Right to refuse without reasons" implies a power dynamic. It highlights the *arbitrariness* inherent in the system.
      *   Asylum is the key test case. Asylum says: "You *must* give a reason, and the reason matters more than your preference." This violates the sovereign prerogative.

  5.  **Addressing the Counterfactual (Membership = Subjection/Participation):**

      *   *Jus Sanguinis:* Collapses immediately. No subjection, no participation.
      *   *Guest Workers:* Collapses. If you are subject to the law and work there, you are a member. Deportation becomes impossible.
      *   *Internal/External Asymmetry:* Might survive if the "polity" is the EU. But if the polity is the Nation-State, the external border becomes harder to justify as a hard barrier against workers.
      *   *Right to Exit/No Exile:* Survives. Exiling a subject violates the principle (you are removing the subject from the sphere of subjection arbitrarily).
      *   *Asylum:* Becomes redundant or transformed. If membership tracks subjection, fleeing persecution implies seeking a new sphere of subjection.

  6.  **Structuring the Response:**

      *   **Acknowledge and Validate:** The user's observation is astute. The "bundle" is real and often theoretically messy.
      *   **Diagnose the Underlying Theory:** It's not one theory. It's a **Sovereign Proprietorship** model mixed with **Labor Market Utilitarianism**.
          *   Citizenship as inherited property (explains descent/deportation asymmetry).
          *   Migrants as labor inputs (explains guest workers).
          *   Sovereignty as prerogative (explains the "no reasons" aspect).
      *   **Evaluate User's Hypothesis:** The "Right to Unaccountability" is a potent framing. It maps onto "Plenary Power Doctrine." It explains the resentment of asylum obligations.
      *   **Run the Counterfactual (Subjection/Participation):**
          *   *Collapses:* Jus sanguinis, temporary visas, deportation of long-term residents.
          *   *Survives:* Right to exit, no exile of citizens (mostly).
          *   *Ambiguous:* External borders (might become tariff/regulatory rather than walls).
      *   **Confidence Flagging:** Be honest about where political theory is debated vs. where descriptive analysis is clearer.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to make sure I don't just say "it's capitalism." While true, the user asks for the *political theory* presuppositions. The theory is often a *post-hoc* justification for material interests.
      *   *Refinement:* Use the term "Civic Stratification" (Lydia Morris) or "Birthright Lottery" (Shachar). These are specific academic frameworks that match the user's intuition.
      *   *Refinement on "Right to Unaccountability":* Connect this to Carl Schmitt (Sovereign is he who decides the exception) but in a bureaucratic, liberal guise.
      *   *Confidence:* I am confident in the diagnosis of the *inconsistency*. I am less confident in prescribing a single unified theory because the practice *is* inconsistent. I need to state that the "theory" is likely a patchwork.

  8.  **Final Polish:** Check against the specific constraints (flag confidence, identify least sure point). Ensure tone is analytical and respectful of the user's sophisticated framing.

      *   *Least Sure Point:* Whether the "Right to Unaccountability" is the *driver* or just a *symptom* of the underlying property/labor logic. I should flag this.

  9.  **Drafting the Response:** (Mental outline)
      *   Intro: Validate the "bundle."
      *   Section 1: The Actual Theory (Sovereign Proprietorship + Labor Flexibility).
      *   Section 2: Evaluating the "Right to Unaccountability."
      *   Section 3: The Counterfactual (Subjection/Participation).
      *   Section 4: Confidence & Uncertainty.

      *(Self-Correction)*: Wait, the EU point is crucial. Internal openness suggests membership is about *market access* + *rights regime*, not just ethnicity. This supports the "property" view (club membership).

      *(Final check on constraints)*: Did I answer "what view of membership/territory/consent"? Yes. Did I answer "what would change"? Yes. Did I flag confidence? Yes.

      *Let's write.*
answer: |-
  This is a sharp dissection of the modern border regime. You have correctly identified that the standard practices of rich states do not map cleanly onto any single normative political theory (like strict liberalism, civic republicanism, or ethno-nationalism). Instead, they form a **hybrid regime** that functions logically only if we accept a specific, often unstated, ontology of the state and the person.

  Here is an analysis of the theoretical presuppositions of that bundle, an evaluation of your "right to unaccountability" hypothesis, and a breakdown of the counterfactual you proposed.

  ### 1. What Theory Does the "Bundle" Presuppose?

  The package you describe is not the result of one theory, but rather a stable equilibrium between **three** distinct theoretical commitments that are usually kept separate in philosophy but bolted together in practice.

  **A. Citizenship as Heritable Property (The Descent/Deportation Asymmetry)**
  *   **The View:** Citizenship is not a contract or a reflection of social reality; it is a form of **property** owned by the national "family."
  *   **The Logic:** Like any property, it can be inherited regardless of use (the grandparent clause). Conversely, those who do not hold the title deed (the 30-year resident) have no claim to the asset, regardless of their investment (taxes, labor, children).
  *   **Theoretical Root:** This is **Feudal Status Theory** modernized. It treats the state as a patrimonial household. This explains why *jus sanguinis* (right of blood) trumps *jus soli* (right of soil) or residency in many systems. It presupposes membership is ontological (who you *are*), not functional (what you *do*).

  **B. The State as Sovereign Proprietor (The Border/Asylum Tension)**
  *   **The View:** The state owns the territory and has the absolute prerogative to manage access, analogous to a homeowner or a private club.
  *   **The Logic:** A homeowner does not need to justify to a stranger why they won't let them in. This is the "right to exclude." However, international law (refugee conventions) imposes an easement on this property right.
  *   **Theoretical Root:** **Westphalian Sovereignty** mixed with **Lockean Property Rights**. The resentment of asylum obligations stems from the fact that asylum converts a *privilege* (entry) into a *right* (claim), thereby diminishing the state's property right over its own border.

  **C. Labor as a Factor of Production (The Guest Worker Visas)**
  *   **The View:** Human beings are economic units. The state manages the labor market to maximize efficiency and minimize liability.
  *   **The Logic:** Tying a visa to an employer creates a "captive labor" supply. It allows the state to import the *utility* of the person without importing the *cost* of the person (social safety nets, political voice, long-term security).
  *   **Theoretical Root:** **Neoliberal Utilitarianism**. This contradicts the "Citizenship as Property" view (because it lets non-owners in) but is consistent with the "State as Manager" view. It presupposes that human mobility is a trade issue, not a rights issue.

  **The Synthesis:** The overarching theory is **Civic Stratification**. The state presupposes that humanity is naturally divided into tiers of rights-bearing subjects. The border is not a wall to keep people out, but a **filter to sort people into legal statuses** that maximize state utility.

  ### 2. Evaluating Your Hypothesis: "The Right to Refuse Without Reasons"

  Your framing—that this is a **right to unaccountability** rather than a right to exclude—is superior to the standard "club association" or "territorial ownership" models. Here is why:

  *   **Why it fits better:** A "right to exclude" implies a boundary defense. But rich states *want* people to cross (tourists, investors, guest workers). They don't want to exclude movement; they want to exclude **obligation**. If I let you in but can deport you at whim, I have not excluded you; I have rendered you **answerable to me without me being answerable to you**.
  *   **The Asylum Exception:** You hit the nail on the head. Asylum is the only mechanism that forces the state to **give reasons**. To grant asylum, the state must admit: "We are letting you in not because we want to, but because the law/ethics compels us." This violates the sovereign prerogative. The state resents asylum not because it costs money, but because it **pierces sovereign immunity**. It subjects the state's border decision to external review.
  *   **Is it just relabeling?** No. "Right to exclude" suggests the goal is homogeneity or security. "Right to unaccountability" suggests the goal is **discretionary power**. This explains why states fight so hard to keep deportation decisions non-justiciable (outside court review). It explains the bureaucracy: the goal is to create enough friction that the state never has to explicitly say "no," it just lets the application expire.

  **Verdict:** This reconstructs the practice better. It identifies the core value being protected: **Sovereign Discretion.**

  ### 3. The Counterfactual: Membership Tracks Subjection and Participation

  If we swapped the current theory for the principle that **membership belongs to those subject to the coercive power of the state and participating in its social life** (often called the "All-Subjected Principle" or "Social Membership Theory"), the current bundle would largely collapse.

  **What Collapses Immediately:**
  1.  **Jus Sanguinis without Residency:** The grandchild abroad collapses. They are not subject to the state's coercion, nor do they participate. They lose the vote/passport.
  2.  **Deportation of Long-Term Residents:** The person there for 30 years is fully subject to the law and socially integrated. Under this theory, they are *already* members. Deportation becomes theoretically impossible (or akin to exile, which is banned).
  3.  **Employer-Tied Visas:** If membership tracks subjection, the moment you step onto the soil and work, you are subject to the state. Tying your right to stay to a private employer becomes a violation of your political status. You become a citizen/resident immediately.

  **What Survives:**
  1.  **The Right to Exit / No Exile of Citizens:** This survives robustly. If membership is about subjection, stripping membership removes the protection of the state, leaving the individual in a "rightless" void. Most theorists agree you cannot make a person "stateless" because everyone must belong to *some* political order.
  2.  **Some form of External Border:** Even under this theory, a polity must define where its coercion begins. However, the *nature* of the border changes. It shifts from a **wall** to a **registration point**. You cross, you are now subject, therefore you are now a member. The border remains, but it ceases to be a filter for *rights* and becomes a sensor for *jurisdiction*.

  **What is Underdetermined (The Ambiguous Bits):**
  1.  **The Internal/External Asymmetry (EU style):** This is the trickiest part. If membership tracks subjection, why is movement between France and Germany open, but France and Algeria closed?
      *   *Possibility A:* The "Polity" is actually the EU. If so, the external border is the only real border.
      *   *Possibility B:* The "Subjection" is economic. If the EU creates a zone of shared economic subjection, borders open.
      *   *Uncertainty:* This practice might survive simply because the "subjection" inside the bloc is deemed reciprocal, whereas outside it is not. But theoretically, if an Algerian is subject to French trade policy or climate policy, the "all-affected" principle suggests they should have a say. This theory struggles to justify the *hardness* of the external border compared to the internal one without invoking the "State as Proprietor" model you want to replace.

  ### 4. Confidence and Uncertainty

  **Confidence Level:** High on the diagnosis of the current system; Moderate on the counterfactual outcomes.

  *   **High Confidence:** I am confident that the current bundle is a hybrid of **Patrimonialism** (citizenship as blood/property) and **Managerialism** (migrants as labor inputs). I am also confident that your "Right to Unaccountability" framing captures the *functional* logic of sovereignty better than the "Right to Exclude" framing, particularly regarding asylum.
  *   **Moderate Confidence:** I am moderately confident in the prediction that a "Subjection/Participation" model would collapse guest-worker programs and descent-based citizenship. These are direct logical contradictions.

  **The Point of Least Certainty:**
  I am least sure about the **Internal/External Asymmetry (The EU Problem)** under the "Subjection" theory.
  *   *Why:* It is unclear whether a theory of "subjection" naturally leads to open internal borders and closed external ones, or if that asymmetry *also* requires a "club/property" logic to sustain it. If membership is truly about who is ruled, then anyone affected by the EU's carbon border tax or foreign policy is "subject" to it. A strict "subjection" theory might demand much more open borders than even the EU currently has. The fact that the EU maintains a hard external border suggests that even "liberal" blocs rely on a underlying theory of **territorial ownership** that the "subjection" theory cannot fully displace.

  ### Summary
  The current system presupposes that **states are owners of territory and citizenship is a heritable asset**, while **non-citizens are economic variables**.

  Your "Right to Unaccountability" is the most accurate description of the *power dynamic* this enables. It highlights that the state's primary goal is to maintain the **prerogative to decide** without being forced to justify that decision to the affected party. Asylum is hated because it forces justification.

  If you switch to a **Subjection/Participation** model, the system breaks. Descent citizenship vanishes, deportation of residents becomes impossible, and labor visas become immediate residency. The only thing that likely survives is the existence of a border line itself, but it transforms from a wall of exclusion into a threshold of jurisdiction.
