answer: |-
  Two financial advisors, A and B, meet with an unsophisticated retiree who asks, "Is my principal guaranteed against loss?" Advisor A replies, "Yes, your principal is guaranteed." Advisor B replies, "This fund is fully registered with the SEC." Both advisors know the fund is volatile and carries a risk of loss; both intend the client to believe the money is safe. A's assertion is false; B's assertion is true, as registration does not insure against market loss, though it commonly implies regulatory safety to laypeople.

  1.  **Assertions and Truth-Values:**
      *   **Speaker A (Lying):** Asserts *p* ("Your principal is guaranteed"). *p* is false. A believes *~p*. A intends the client to believe *p*. This is a canonical lie because A asserts a proposition they believe to be false.
      *   **Speaker B (Merely Misleading):** Asserts *q* ("This fund is SEC-registered"). *q* is true. B believes *q*. However, B intends the client to infer *p* ("Your principal is safe") from *q*, knowing *p* is false. B relies on the conversational implicature that registration implies safety. This is merely misleading because the explicit content asserted (*q*) is true, even though the intended belief (*p*) is false.

  2.  **Argument for B's Greater Wrong:**
      B's conduct is morally worse because it violates the specific fiduciary duty to *clarify* rather than merely *comply*. In a professional context involving epistemic vulnerability, the speaker is tasked with guiding the hearer's understanding. A's lie is a straightforward breach of trust; A takes full responsibility for the false claim and is easily held accountable if discovered. B's misleading, however, exploits the hearer's ignorance to manufacture a false inference while retaining technical deniability. The variable doing the work is **manipulative evasion of accountability**. B weaponizes the truth to deceive, corrupting the signaling value of true statements and treating the client's reasoning process as a loophole to be exploited rather than a capacity to be respected. A breaks the rule; B breaks the spirit of the rule while hiding behind the letter.

  3.  **Committed Position (Moderate Reading):**
      I defend the **Moderate Reading**: the lying/misleading distinction is real and normally tracks something morally relevant (the directness of the norm violation), but it can be swamped when other features of the communicative situation shift. In ordinary contexts, lying is worse because it directly violates the constitutive norm of assertion (truthfulness). However, in fiduciary contexts, the primary moral obligation is the protection of the vulnerable party's agency. Here, the manipulative structure of misleading (forcing the hearer to deceive themselves) becomes a graver violation of agency than the direct falsehood of lying. The standard asymmetry is not an artifact, but it is not lexical; it is contingent on the normative priorities of the context.

  4.  **Anticipated Response and Rebuttal:**
      A defender of the **Strong Reading** (that the distinction carries no intrinsic moral weight) would argue that this case proves context does *all* the work, rendering the linguistic distinction morally inert. They might claim B's statement is effectively an implicit lie because the implicature is so conventional it counts as an assertion. I reject this redescription because it conflates moral equivalence with linguistic classification. The fact that B can legally deny intending to guarantee the principal demonstrates the distinction is real and practically significant. To collapse B's conduct into lying is to ignore the specific wrong of *exploiting* the gap between literal truth and conveyed meaning. Acknowledging the distinction remains useful precisely because it allows us to identify the unique moral hazard of "technically true" deception in professional settings, rather than dismissing it as just another variety of falsehood.
