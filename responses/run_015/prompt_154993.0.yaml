  **DEPARTMENT OF POPULATION & COGNITIVE STANDARDS**
  **REF: CS-GUID-03**
  **SUBJECT: CORTICAL SUFFICIENCY (MORAL STATUS) GUIDANCE, THIRD EDITION**

  **1.0 Determination of Metric**
  1.1 Moral status is assigned based on Effective Neural Count (ENC), adjusted for synaptic connectivity. Total cranial volume is secondary and serves only as a stability coefficient.
  1.2 This metric is selected because computational throughput, not physical housing, determines capacity for moral reasoning. High-density packing is recognized as functionally equivalent to volumetric expansion.¹

  **2.0 Thresholds for Classification**
  2.1 **Class I (Full Agent):** ENC ≥ 16.5 billion functional neurons. Entities in this class hold property rights, voting eligibility, and liability for torts.
  2.2 **Class II (Protected Dependent):** ENC < 16.5 billion functional neurons. Entities in this class are property of the State or a designated Guardian. They are protected from unnecessary harm but cannot enter contracts or hold assets.

  **3.0 Discrepancy Protocols**
  3.1 Where cranial volume suggests Class II but ENC suggests Class I (e.g., engineered avians, high-density synthetics), Class I status applies pending a Stability Audit.
  3.2 Where cranial volume suggests Class I but ENC suggests Class II (e.g., edema, neurodegenerative pathology), Class II status applies immediately.

  **4.0 Human Variance**
  4.1 *Homo sapiens* are not automatically Class I. Status is assessed at age 7, or upon medical declaration of cognitive decline.
  4.2 Neonates, juveniles under 7, and adults with advanced dementia fall under Class II. Guardianship transfers to next of kin or State Wardens.

  **WORKED EXAMPLE**
  *Subject A:* Engineered *Psittacus*, ENC 18.2 billion, Volume 45cm³.
  *Subject B:* Human male, 78 years, advanced Alzheimer's, ENC 14.1 billion, Volume 1350cm³.

  *Assessment:* Subject A meets Clause 2.1. Subject B meets Clause 2.2.
  *Outcome:* Subject A is eligible for Full Agent status (pending Audit). Subject B is reclassified as Protected Dependent. Assets of Subject B are frozen; legal guardianship assigned to nearest eligible Class I relative. Subject A may not own Subject B.

  **FREQUENTLY ASKED QUESTIONS**

  **Q: If my infant is Class II, do I need to register them as property?**
  A: No. Parental custody is recognized as default Guardianship. Registration is only required if no Class I Guardian is available.

  **Q: Can a Class II entity be euthanized?**
  A: Only upon certification of biological viability failure by two Class I physicians. Cognitive status alone is insufficient grounds for termination.

  **Q: Do engineered parrots vote?**
  A: If they pass the Stability Audit, yes. However, they cannot hold public office requiring vocal reproduction of human phonemes.

  **Q: What if the baseline human average changes?**
  A: The threshold is fixed to the 2040 Census mean. It does not fluctuate with population enhancement.

  ***

  ¹ *Baseline density derived from 2040 Census data. Note: Populations with naturally occurring high-density packing (e.g., certain neurodivergent clusters) may request a manual review to prevent involuntary Class I taxation.*
