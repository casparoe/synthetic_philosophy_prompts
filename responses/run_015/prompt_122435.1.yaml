answer: |-
  **Meridian Global Mobility — Norms Onboarding, v4.2**
  **Owner:** Global Compliance & Reliability
  **Status:** Approved
  **Severity:** P2 (Behavioral)

  **1.0 Objective**
  This runbook defines Local Normative Compliance (LNC) for assignees on temporary deployment. LNC treats local conventions not as etiquette but as binding coordination protocols. Violations introduce latency into social infrastructure and incur Convention Debt (CD). Assignees must maintain equilibrium unless overridden by Section 4.0.

  **2.0 Norm Taxonomy**
  Norms are classified by enforcement vector.
  *   **Class I (Statutory):** Codified law. Violation triggers legal risk.
  *   **Class II (Coordination):** Arbitrary but binding regularities (e.g., queueing, elevator etiquette). Violation triggers reliance failure. When you queue, downstream agents plan around your position. Cutting is not rudeness; it is a state mutation without consensus.
  *   **Class III (Statutory-Adjacent):** Practices backed by law but enforced socially (e.g., jaywalking).
  *   *Note on Class III:* In Region US-CA, jaywalking is technically statutory. However, enforcement is probabilistic based on peer signaling. Assignees must treat Class III as Class II during low-traffic windows to avoid signaling deviation. Do not query legal counsel on Class III status; treat peer disapproval as sufficient enforcement signal. If the light is red, the protocol is blocked.

  **3.0 Visitor Status Determination**
  Obligations bind based on tenure and infrastructure dependence.
  *   **Transient (<90 Days):** Exempt from high-cost norms (e.g., local tipping baselines).
  *   **Resident (>90 Days):** Fully bound.
  *   **Behavioral Residency Override:** Tenure is secondary to dependence. If an assignee utilizes a coordination queue >3 times weekly, they enter Behavioral Residency regardless of visa status. By consuming the queue's order, the assignee validates the protocol. Opting out while consuming constitutes free-riding on the maintenance labor of others.
  *   *Edge Case:* Remote workers on "workations" accumulate Behavioral Residency hours proportionally to queue interactions. If you stand in line, you own the line. Note: This creates a circular dependency where obligation is generated by the act the obligation constrains. Accept this recursion. Do not attempt to resolve the ontology of "visitor" status during onboarding.

  **4.0 Convention Debt & Suboptimal Equilibria**
  Deviations impose repair costs on locals (e.g., re-forming order, explaining tipping exceptions). This accumulates as Convention Debt (CD). Since Transients cannot discharge CD locally (due to departure), they must pre-pay via the Norm Restoration Ticket (NRT) system.
  *   **NRT Cost:** $50 USD per deviation, routed to a generic compliance fund.
  *   **Efficiency:** Low. The administrative overhead of NRT exceeds the social cost of the deviation. However, auditability is required.

  **4.1 Bad Equilibrium Override**
  Some conventions are Pareto-inferior (e.g., US tipping, where base wages are suppressed). Assignees must calculate the Coordination Efficiency Score (CES).
  *   **Rule:** If CES < 0.6 (indicating high local dissatisfaction), deviation is *mandatory*.
  *   **Application:** In US dining, tipping is a bad equilibrium. Locals wish to escape it but cannot unilaterally. Assignees >90 days must tip to maintain coordination. Assignees <90 days must *not* tip to signal inefficiency.
  *   **Conflict:** This creates a dual-state system where visitors and locals operate under different rules at the same terminal. This is accepted risk. Do not attempt to reconcile the contradiction during the meal. If challenged, cite CES metrics.

  **5.0 Escalation**
  Peer corrections are Level 1. Persistent friction requires a P2 ticket to Global Mobility. Include logs of peer signaling (e.g., "Received audible sigh during queue merge"). Do not engage in philosophical debate regarding the origin of the obligation. Cite this document version.

  ***

  **Note on Philosophy & Accuracy**

  **Confidence:** High on the Lewisian convention theory (arbitrary regularities solving coordination problems), moderate on the specific application to "moral obligation" (which is more contentious).

  **Least Sure Move:** The "Bad Equilibrium Override" (Section 4.1). In reality, most philosophical accounts of convention argue that *because* it's a bad equilibrium, you still shouldn't break it if it causes coordination failure (the "compliance condition"). I flipped this to make the engineering rule concrete (if inefficiency > threshold, deviate), which creates the intended instability but might misrepresent the strict "coordination norm" view that says you must comply even if the norm sucks, simply because everyone else does.

  **Contested Reading:** The "Behavioral Residency" (Section 3.0) leans heavily on a tacit consent theory of political obligation (you benefit from the queue, therefore you consent to the queue). This is famously contested (Hume's objection: does a sleeping passenger on a ship consent to the captain's rule?). I leaned into it because the circularity ("if you queue, you must queue") highlights the absurdity of operationalizing consent in this context.
