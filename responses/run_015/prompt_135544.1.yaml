  ### 1. The Activity: "The Highway Game"

  **Roles:**
  *   **The Facilitator (You):** You are the Highway. You hold the Master Sheet (the truth about which intersection is which) and the Lamp Bags. You enforce ignorance.
  *   **The Committees (4 Tables):** Each table is a "Planning Committee" for a single Driver. They agree on a rule, roll the dice, and collect chips.

  **Materials:**
  *   **Poker Chips:** 100 per table. (Value: $1 per chip).
  *   **Six-Sided Dice:** 2 per table.
  *   **Index Cards:** 20 per table (for writing rules).
  *   **Trip Envelopes:** 40 total (10 per table). Inside each: A "Trip Record" card for you to mark outcomes.
  *   **Lamp Beads:** Two opaque bags.
      *   Bag 1 (Intersection 1): 8 Red (Lit), 2 Green (Dark) for Reliability 0.8 condition. (Adjust ratios for 0.6).
      *   Bag 2 (Intersection 2): 2 Red (Lit), 8 Green (Dark) for Reliability 0.8 condition.
  *   **Cardboard Screens:** 4 (to hide your Master Sheet if needed, though you will move between tables).
  *   **Facilitator Master Sheet:** A grid tracking Table #, Trip #, Current Node (1 or 2), Decision, Payoff.

  **Rules & Payoff Accounting:**
  1.  **The Plan:** Before any chips move, each table writes a rule on an index card. Example: "Roll 1-4: Continue. Roll 5-6: Exit." (This is $p=2/3$).
  2.  **The Trip:** You approach Table 1. Place a token (a chip) in the center. "You are at an intersection."
  3.  **The Decision:** The table rolls the die according to their rule. They announce "Exit" or "Continue."
  4.  **The Outcome:**
      *   You check your Master Sheet (Trip 1, Node 1).
      *   **If Exit:** Reveal the Node. If Node 1, pay 0. If Node 2, pay 4. Trip ends.
      *   **If Continue:** Do *not* reveal the Node. Say "You proceed." Move to the next step for this table immediately.
      *   **Second Visit:** You return to the token. "You are at an intersection." They roll again.
      *   **If Exit:** Reveal Node (Must be 2). Pay 4.
      *   **If Continue:** Reveal Node (Must be 2). Pay 1 (Passed both). Trip ends.
  5.  **Ignorance Enforcement:** You never say "First" or "Second." You only say "An intersection." You track the node on your sheet. They must not ask. If they ask "Is this the second one?", the trip is void (pay 0).
  6.  **Tally:** At the end of 10 trips, the table counts their chips.

  **Number of Trips:**
  *   **10 trips per table.**
  *   *Reason:* With $p=2/3$, expected value is 1.33 chips/trip. 10 trips = 13.3 chips expected. Variance is high, but 40 total trips across the room smooths the average enough to show that "Always Exit" (approx 2 exits at Node 1 = 0 payoff) yields near zero, while the Plan yields ~50 chips total per table. It fits the time limit.

  ### 2. Staging the Lamp Variant

  **Setup:**
  *   Tables 1 & 2 get **Reliability 0.8** (Bag 1: 20% Lit, Bag 2: 80% Lit).
  *   Tables 3 & 4 get **Reliability 0.6** (Bag 1: 40% Lit, Bag 2: 60% Lit).
  *   Tell them: "A lamp flashes at the intersection. Red = Lit, Green = Dark. It is correlated with the intersection, but not perfectly. You may change your rule to depend on the lamp."
  *   Suggested Rule for all: "If Lit, Exit. If Dark, Continue."

  **The Discovery:**
  *   Run 10 trips per table as before. You draw the bead from the correct bag (based on your Master Sheet node) and show them the color *before* they roll.
  *   **The Reveal:** In the debrief, do not show the math. Ask: "When you saw a Red (Lit) lamp, did anyone feel that Continuing was actually the better choice, despite the rule?"
  *   **Expected Result:** Tables 1 & 2 (0.8) will say "No, Exit was obvious." Tables 3 & 4 (0.6) will likely say "Yes, a few times it felt wrong to Exit."
  *   **The Point:** This demonstrates that the *stability* of the plan changes between 0.6 and 0.8 without the rule changing shape.

  ### 3. Debrief Plan

  **Order:**
  1.  **No Lamp Condition:** Ask Tables to report total chips. Calculate the room average. Compare to the "Always Exit" strategy (which yields 0 because half the exits are at Node 1).
      *   *Ask:* "At the moment of decision, did anyone want to break the plan?" (Likely yes). "Why?" (Because "This looks like the first one").
  2.  **Lamp Condition:** Compare the 0.8 Tables vs. 0.6 Tables.
      *   *Ask:* "Did the lamp make the decision easier?" (Yes). "Did it make the plan stable?" (Only for 0.8).
  3.  **Handling Objections:**
      *   **The Notepad:** "If I could just write down 'I passed one', I'd get 4 every time."
          *   *Response:* "You are absolutely right. That is the value of memory. But in this room, the rule is: the pen is locked. We are studying what happens when the pen is locked."
      *   **The Counter:** "I counted how many times you said 'intersection'."
          *   *Response:* "That breaks the simulation. In the real problem, the count is not available. Please discard those trips."
  4.  **Mapping:**
      *   "The Plan" = Ex-Ante (Before the car starts).
      *   "The Moment" = Interim (At the intersection).
      *   "The Conflict" = The Plan says Continue (2/3), The Moment says Exit (because 'I'm probably at the first one').
      *   "The Lamp" = Partial Memory. It shifts the 'probably' until the Moment agrees with the Plan.

  ### 4. Honest Note (Facilitator Only)

  *   **Forgetting:** You cannot simulate actual forgetting. They know they are playing a game. You are simulating *informational isolation*, not cognitive loss.
  *   **Belief Supply:** You cannot force them to calculate the 3/5 probability. They must infer it from the frequency of Node 1 vs Node 2 visits on your Master Sheet (which you can reveal at the end).
  *   **Normative Status:** The game shows the *conflict* exists. It does not prove which reasoning is "right." Philosophers still argue this. Your job is to show the crack in the foundation, not to patch it.

  ### 5. Predictable Failures & In-the-Moment Fixes

  1.  **Failure:** A table tries to deduce the node from your body language or timing.
      *   **Fix:** Stop immediately. "That trip is void. Zero chips. The Highway is opaque."
  2.  **Failure:** Variance makes a table lose all chips in the No-Lamp condition (bad luck).
      *   **Fix:** "Pool the room's chips." Aggregate the totals of all 4 tables to show the group average matches the theory, even if one table had bad luck.
  3.  **Failure:** In the 0.6 condition, the "Instability" doesn't show up (they don't feel the conflict).
      *   **Fix:** Don't force it. Say: "The math says the conflict appears here. If you didn't feel it, your intuition is more robust than the model. Let's look at the numbers."
  4.  **Failure:** Discussion drags on the "Notepad" objection.
      *   **Fix:** "Write 'Memory is Expensive' on the board. We will come back to it if time permits. For now, assume the cost is infinite."

  ### 6. Closing Paragraph

  Consider a medication you must take once daily, where missing a dose reduces efficacy but taking two causes harm. You have a vague sense of whether you took it this morning, but no record. The "Plan" is a schedule set on Sunday: "Take at 8 AM." The "Moment" is 8 PM: "Do I feel like I took it?" If your memory is reliable (the 0.8 lamp), the feeling matches the schedule, and you act consistently. If your memory is fuzzy (the 0.6 lamp), the feeling at 8 PM might suggest "I probably didn't take it," urging you to take a second dose, even though the Sunday Plan knew that following that urge leads to double-dosing errors on average. This game is that 8 PM moment, stripped of the ability to check the bottle.

