      *   **Explain *Syāt*:** It's not epistemic uncertainty ("maybe"). It's ontological indexing ("from a specific standpoint"). It functions like a hidden variable in logic.
      *   **Dialetheism/Paraconsistency:** Jains are *not* paraconsistent in the modern sense because they don't accept true contradictions. They preserve LNC by relativizing the predicate to the *naya*.
      *   **Saptabhaṅgī:** Explain it as a combinatorial tool to prevent dogmatism, not a list of contradictory facts. Mode 3 ("is and is not") is the tricky one—emphasize the *successive* or *aspectual* nature (substance vs. mode).
