answer: |-
  This is a fantastic problem to be wrestling with, and honestly, you've hit on the single most debated crux in contemporary interpretations of Jain logic. You are not missing something "obvious"; you are bumping up against the precise point where classical Indian logic resists easy translation into Western analytic categories (like dialetheism or standard modal logic).

  Here is where your reasoning is likely slipping, broken down into four key areas to help you untangle the chapter.

  ### 1. The Category Error: Ontological Complexity vs. Logical Contradiction
  Your core tension stems from this formulation: *"If I say 'the soul is eternal' and someone else says 'the soul is changing,' both are true... doesn't that mean contradiction is built into reality itself?"*

  The Jain answer is **no**, because you are treating the predicates as unqualified. In classical Aristotelian logic (and standard dialetheism), a contradiction occurs if $P(x)$ and $\neg P(x)$ are true at the same time $t$, in the same respect $r$.

  Jain metaphysics introduces a hidden variable: the **aspect** (*aṃśa*) or **condition** (*paryāya*).
  *   Proposition A: "The soul is eternal" is true *with respect to substance* (*dravya*).
  *   Proposition B: "The soul is changing" is true *with respect to modes* (*paryāya*).

  Because the *respect* differs, there is no formal contradiction ($A \land \neg A$). Reality is complex (*anekānta*), but it is not contradictory. The contradiction only arises if you absolutize a *naya* (perspective) into a *pramāṇa* (absolute truth). The Jains reject dialetheism because they believe the Law of Non-Contradiction holds *within any single specific standpoint*. They avoid violating LNC by insisting that no single standpoint captures the whole truth.

  **The Slip:** You are assuming that "P and not-P" implies a violation of LNC. For the Jains, it implies an incomplete specification of the parameters of predication.

  ### 2. The Function of *Syāt*: Indexical, Not Probabilistic
  You mentioned: *"Every explanation I find treats it like a modal qualifier and that seems to make the contradiction problem worse."*

  This is the most common translation error. If you translate *syāt* as "maybe" or "perhaps" (epistemic uncertainty), it sounds like skepticism or fuzzy logic.
  *   **Wrong reading:** "Maybe the soul is eternal." (Implies I don't know).
  *   **Right reading:** "In some respect, the soul is eternal." (Implies I know, but the truth is indexed).

  *Syāt* functions more like an **indexical** or a **contextualizer** than a modal operator of probability. It signals that the proposition is conditioned (*saprabandha*).

  When you apply *syāt*, you aren't hedging; you are **locating** the truth.
  *   *Syāt* asti (In some respect, it is).
  *   *Syāt* nāsti (In some respect, it is not).

  If you treat *syāt* as a modal qualifier in the sense of possible worlds semantics, you run into the problems you described. If you treat it as a **parameter restrictor**, the contradictions dissolve. It tells you *which slice* of the infinite (*ananta-dharma*) you are looking at.

  ### 3. *Saptabhaṅgī* and the "Third" Predication
  You asked: *"If you have seven modes of predication, doesn't that just multiply contradictions rather than resolve them?"*

  Specifically, you are likely worried about the third *bhaṅga*: *Syāt asti ca nāsti ca* (In some respect, it is and it is not).
  If this is read as "It is and is not [simultaneously in the same respect]," then yes, that is dialetheism.

  However, the orthodox Jain commentary (both Śvetāmbara and Digambara) interprets this **successively** or **aspectually**.
  *   **Successive:** The pot exists at $t_1$ and does not exist at $t_2$.
  *   **Aspectual:** The pot exists as clay (substance) but does not exist as cloth (other substance).

  The *saptabhaṅgī* is not a list of seven contradictory truths about an object. It is a **combinatorial algorithm** designed to prevent dogmatism. It forces the speaker to acknowledge that any assertion (Is, Is Not, Both, Indescribable) is partial. It doesn't multiply contradictions; it multiplies **contexts** to ensure no single context claims exclusivity.

  **Regarding Paraconsistency:**
  There is a scholarly debate here. Logicians like **Graham Priest** have argued that Jain logic *is* paraconsistent because it tolerates the truth of $A$ and $\neg A$ (qualified by *syāt*). However, traditionalists like **Bimal Matilal** argue that because the *syāt* qualifier restricts the domain of the predicate, the logic remains classical within each *naya*.
  *   **For your dissertation:** If you map this to standpoint epistemology, you might argue that Jainism offers a **"contextual paraconsistency."** Contradictions are tolerated *across* standpoints, but not *within* them. This distinguishes it from strong dialetheism (where contradictions are true *simpliciter*).

  ### 4. The Standpoint Epistemology Mapping (The Teleological Divergence)
  This is crucial for your chapter. You are mapping *anekāntavāda* to contemporary standpoint epistemology (e.g., Harding, Haraway).
  *   **The Link:** Both reject the "God's eye view" (view from nowhere). Both argue that knowledge is situated.
  *   **The Tension:** In feminist standpoint theory, conflicting standpoints often reveal power structures, and the tension itself is politically productive. In Jainism, the tension is **soteriologically dangerous**.

  The goal of *anekāntavāda* is not to dwell in contradiction but to achieve **synthesis** (*samagri*). The Jains reject dialetheism because accepting true contradictions leads to *pramāda* (carelessness) and karmic bondage. If "violence is non-violence" can be true *simpliciter*, ethics collapses.
  *   **Your Resolution:** You can argue that while Standpoint Epistemology uses partiality to critique power, Jain Epistemology uses partiality (*naya*) to cultivate **intellectual non-violence** (*ahiṃsā*). The rejection of dialetheism is ethical, not just logical. They refuse to let contradictions stand unresolved because unresolved contradictions justify dogmatic conflict.

  ### Summary of the Fix
  Your reasoning slips when you assume that accepting multiple true predicates about one subject entails accepting a logical contradiction.
  1.  **Reality** is complex (infinite attributes).
  2.  **Language** is binary (is/is not).
  3.  **Logic** bridges them via *syāt* (indexing the predicate to a specific attribute).
  4.  **Contradiction** only arises if you ignore the index.
  5.  **Dialetheism** is rejected because the index *always* applies; there is no "view from nowhere" where $A \land \neg A$ holds without qualification.

  ### Recommended Scholarship for Your Footnotes
  *   **Bimal K. Matilal, *The Central Philosophy of Jainism (Anekāntavāda)*:** The gold standard. He explicitly argues against the "contradiction" reading.
  *   **Graham Priest, "The Logic of the Catuskoṭi" (and his work on Jainism):** Read this to understand the paraconsistent argument, then critique it using Matilal.
  *   **Piotr Balcerowicz, *Jain Epistemology*:** Very rigorous on the *naya* vs. *pramāṇa* distinction.
  *   **Sara L. McClintock, *Omniscience and the Rhetoric of Reason*:** (Though Buddhist, her work on *pramāṇa* debates contextualizes the Jain move well).
  *   **Anne M. Murphy:** Writes on the social implications of *anekāntavāda*, useful for your standpoint mapping.

  **One-line takeaway for your chapter:** *Syāt* does not weaken truth claims into probabilities; it strengthens them by specifying their conditions of validity, thereby preserving the Law of Non-Contradiction within a pluralistic ontology.
