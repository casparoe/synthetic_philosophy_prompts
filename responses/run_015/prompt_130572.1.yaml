  3.  **Identify the Conceptual Tension:**
      *   **Mention vs. Use:** The classic distinction. When I quote Chen, am I *using* her words to assert their truth, or *mentioning* them to attribute them to her? In the user's example, it's attribution. So, the truth condition of the *whole* sentence depends on whether Chen said it, not necessarily on whether conceptual change is real.
      *   **Echoic Mention (Sperber & Wilson):** This is the elephant in the room. Grice didn't fully handle echoic utterances (irony, sarcasm involving attribution). Relevance Theory (Sperber & Wilson) explicitly developed "echoic mention" to solve exactly this problem. A Gricean purist might struggle here.
