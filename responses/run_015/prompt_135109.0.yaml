answer: |-
  The hardest truth is that democratic intent and textual autonomy become jointly unsatisfiable once legislative drafting is probabilistically mediated by models without mental states.

  Here's the spec for a theory that can actually survive the AI turn, broken down by what it needs to handle, what it must keep separate, and the consistency conditions it can't violate. I've flagged what's negotiable because, frankly, you can't have it all.

  ### 1. The Case Load (What it must handle right)

  *   **Plain Meaning vs. Clear Intent:** When the text says "vehicle" but the record proves they meant "cars," the theory must pick a lane without pretending the gap doesn't exist.
      *   *Why:* This is the classic deadlock.
      *   *Status:* **Non-Negotiable.** You must decide which source trumps; hedging destroys guidance.
  *   **Tech Drift (Meaning Change):** Terms like "search," "wire," or "copy" that meant something physical in 1980 and something digital now.
      *   *Why:* Statutes outlive their tech context.
      *   *Status:* **Negotiable.** You can freeze meaning (originalism) or update it (dynamic), but you must admit you're doing one or the other.
  *   **Fuzzy Delegated Authority:** Agencies filling in gaps like "reasonable safety" with algorithms nobody reads.
      *   *Why:* Legislatures love dumping hard choices on admins.
      *   *Status:* **Non-Negotiable.** The theory must define the edge of delegation or separation of powers collapses.
  *   **Algorithm-Mediated Drafting:** The legislator prompts an LLM, the LLM outputs text that technically bans something the human didn't intend (or vice versa).
      *   *Why:* This is the new nightmare. The "author" is a hybrid of human intent and machine probability.
      *   *Status:* **Non-Negotiable.** A theory that assumes a unified human author is now factually wrong.

  ### 2. The Distinctions (What it can't collapse)

  *   **Interpretation vs. Amendment:** Judges interpret; legislatures amend.
      *   *Why:* If judges update meaning to fit new tech, they are legislating.
      *   *Status:* **Non-Negotiable.** This is the separation of powers firewall.
  *   **Speaker Meaning vs. Text Meaning:** What the drafter thought vs. what the words say to a reasonable reader.
      *   *Why:* With LLMs, the "speaker" (model) has no meaning, and the human speaker didn't write the words.
      *   *Status:* **Negotiable.** You can privilege one, but you can't say they are the same thing anymore.
  *   **Predictive vs. Normative Interpretation:** Are we predicting what the court will do, or prescribing what it *should* do?
      *   *Why:* Legal theory dies if it's just sociology of judges.
      *   *Status:* **Non-Negotiable.** Must be normative to guide judgment.

  ### 3. Consistency Conditions (The Guardrails)

  *   **Rule-of-Law Predictability:** Citizens need to know what the law is before they act.
      *   *Why:* Surprise laws are tyranny.
      *   *Status:* **Non-Negotiable.**
  *   **Democratic Legitimacy:** Law must trace back to the people's representatives.
      *   *Why:* Otherwise it's just rule by judges or admins.
      *   *Status:* **Non-Negotiable.**
  *   **Separation of Powers:** Courts don't write laws; legislatures don't judge cases.
      *   *Why:* Concentration of power corrupts.
      *   *Status:* **Non-Negotiable.**

  ### The Unsatisfiable Cluster

  You were right to suspect a conflict, but it's sharper than you thought. You cannot simultaneously hold these three:
  1.  **Full Textual Autonomy** (The text means what it says, regardless of draft history).
  2.  **Full Democratic Legitimacy** (The law must reflect the actual mental state of the legislators).
  3.  **Machine Mediation** (The text is generated by a probabilistic model based on prompts).

  If the text is machine-generated, **Textual Autonomy** binds you to the model's output, which may diverge from the human prompt. If you prioritize **Democratic Legitimacy**, you must ignore the text in favor of the prompt, violating **Textual Autonomy**. If you admit **Machine Mediation**, you acknowledge there is no single "author" mental state to rescue the gap. You have to drop one. Most theories try to keep all three and end up lying about how laws are made.

  ### The Knockout Desideratum

  The single requirement that knocks out the most popular theories is **Non-Collapse of Interpretation vs. Amendment**.
  *   **Why:** Pure purposivism often fails here because updating a statute to fit its "purpose" in a new tech context looks exactly like rewriting the law. Pure textualism fails here because refusing to update obvious tech drift makes the law absurd, forcing judges to "interpret" their way out of absurdity, which is secretly amendment. Dynamic theories fail here by openly admitting they amend, which violates the separation of powers condition. It's the filter that catches everyone.

  ### Quick Scorecard

  *   **Textualism:**
      *   *Pros:* Crushes **Predictability** and **Textual Autonomy**. Handles **Plain Meaning** well.
      *   *Cons:* Fails **Democratic Legitimacy** in AI cases (ignores the human prompt). Struggles with **Tech Drift** (freezes meaning too hard).
      *   *Verdict:* Breaks on the **Interpretation/Amendment** line when absurdity forces judicial rewriting.

  *   **Purposivism:**
      *   *Pros:* Good on **Democratic Legitimacy** (chases intent). Handles **Tech Drift** well (updates purpose).
      *   *Cons:* Torpedoes **Predictability** (intent is fuzzy). Fails **Textual Autonomy** (words become secondary).
      *   *Verdict:* Breaks on **Separation of Powers** (judges become policy makers).

  *   **Dynamic Evolution (Living Statute):**
      *   *Pros:* Best on **Tech Drift** and **Algorithmic Drafting** (accepts change).
      *   *Cons:* Fails **Interpretation vs. Amendment** (openly blends them). Weak on **Democratic Legitimacy** (current judges override past legislators).
      *   *Verdict:* Breaks on **Rule of Law** (law changes too fast for citizens to track).

  None of them pass the full spec without compromising a non-negotiable, which is why the AI drafting issue doesn't just complicate interpretation—it breaks the existing framework entirely.
