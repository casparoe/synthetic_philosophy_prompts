          *   *Key Distinction:* The film is about *affect* (feeling), EMT is about *information processing*.

      *   **Section 5: The Decisive Scenes:**
          *   *Scene 1 (Internalist Win):* The Childhood Memory (Hiding Clementine). Shows memory is malleable internal stuff, not fixed external data.
          *   *Scene 2 (Externalist Tease):* The House Visit. Joel runs away. Shows external cues are triggers, not storage he can access voluntarily.
          *   *Scene 3 (The Verdict):* The Tape/Listening. Joel accepts the pain. This isn't memory retrieval; it's a decision.

      *   **Conclusion:** Settle the bet. The User is mostly right about the film's *ontology* (it treats memory as internal), but the Friend is right about the *outcome* (the world matters). However, philosophically, the film fails the "Trust-and-Glue" test required for EMT.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "User is right." The Friend's point about the tape is strong. I need to nuance it. The tape *becomes* part of the mind at the end, but only *after* the erasure is done. During the erasure, the world was rejected.
