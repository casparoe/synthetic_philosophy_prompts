          *   *Trust-and-Glue:* This is the killer. Joel *distrusts* the external cues. He runs from the house. He ignores the diary. Otto (in Clark/Chalmers) trusts his notebook implicitly. Joel treats the world as hostile evidence.
          *   *Causation vs. Constitution:* The friend says the world *is* the memory. The film shows the world *causing* a new reaction to old pain. The Montauk meeting isn't a retrieval of the old file; it's a new file created by old ghosts.
          *   *Verdict:* User wins on criteria. The external traces are causal triggers, not constitutive parts of Joel's cognitive system during the film.

      *   **Section 2: The "Premium Package" (World Surgery):**
          *   *Scenario:* Scrubbing the apartment, photos, other people's minds.
          *   *Analysis:* If EMT is true, this *should* be necessary for total erasure.
          *   *Reductio:* If you have to edit the world to delete a memory, does the memory belong to the person or the ecosystem? If I paint my wall, did I lobotomize myself?
          *   *Film's Stance:* The film treats the "World Scrub" as unnecessary for the *plot* (they meet anyway). This suggests the "memory" that matters is the internal disposition to love, not the data storage.
          *   *Verdict:* Supports User's Internalism. The film implies the "essence" of the memory is internal resilience, not external data.

      *   **Section 3: The Prosthesis/Pre-commitment Variant:**
          *   *Scenario:* Leaving letters/maps for post-erasure self.
          *   *EMT View:* If the system (Brain + Letter) functions as memory, it counts.
          *   *The Split:* Is it *remembering* or *obeying*?
          *   *Film Evidence:* The tape at the end. Joel listens to it. He knows the pain. He says "Okay."
          *   *Analysis:* This isn't remembering the past; it's accepting a future. The EMT struggles here. It looks like a stranger being steered.
          *   *Verdict:* This is the Friend's strongest point (the tape works), but it functions more as a *warning* than a *memory*. It splits "reliving" from "acting." EMT commits to the latter, but the film values the former (the feeling).

      *   **Section 4: Where the Reading Breaks Down (Projecting Thesis):**
          *   *The "Inner Theater":* The bulk of the film is *inside* Joel's head. The visual language is internalist (collapsing houses, disappearing faces).
