      *   *Focus:* Ensure I answer the specific prompt about "world surgery" being a *reductio*. That's a sharp philosophical point. If memory is in the walls, painting is brain surgery. That sounds absurd, which supports Internalism.

  7.  **Final Polish:** Check against constraints (no sources, just argument). Ensure the specific scenes are named clearly. (Montauk meeting, House visit, Childhood hiding, Tape listening).

      *(Self-Correction on the "Prosthesis" point)*: The prompt asks if the post-procedure person is *remembering* or being *steered*. EMT says if the coupling is tight enough, it's remembering. But the film suggests it's a *new* choice based on old data. I need to highlight that distinction.

      *(Final Plan)*:
