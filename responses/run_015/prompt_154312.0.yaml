  You wrote the promise on the empty Monday.
  Then marked the space beside it for a Tuesday.
  Crossed out the middle, safe behind Wednesday.
  Pushed the possibility to Thursday.
  Until the final day remained, Friday.
  But nothing in the week could be known.

  If we survive until the end is known.
  We thought the danger started fresh on Monday.
  But logic killed the chance of it on Friday.
  So we slept soundly through the early Tuesday.
  And looked with pity on the coming Thursday.
  Safe behind the shield of this Wednesday.

  We dismissed the threat hanging o'er Wednesday.
  Because the date cannot be fully known.
  If Friday falls, then certainty on Thursday.
  So we erased the ink from blackest Monday.
  Wiped the chalk dust from the air of Tuesday.
  We knew no test would come on Friday.

  My flatmate says the trap relies on Friday.
  If "maybe none" hung over us Wednesday.
  Or any morning like this past Tuesday.
  Then nothing final could be strictly known.
  The chain would break before it reached our Monday.
  But you said *one*, so we erased Thursday.

  We cleared the name of innocent Thursday.
  And left the weekend safe from shock on Friday.
  Back to the start, the blank and empty Monday.
  We slept well through the night before Wednesday.
  Certain the test was nowhere to be known.
  Or Wednesday, or the last dead Tuesday.

  We woke up thinking it was still just Tuesday.
  Or some safe day like vanished Thursday.
  It sat upon the desk, already known.
  Not waiting for the end of time on Friday.
  It happened in the light of this Wednesday.
  The week began again, not end on Monday.

  No Monday saves, nor any quiet Tuesday.
  Wednesday strikes through Thursday and Friday.
  The week is done, the lesson fully known.
