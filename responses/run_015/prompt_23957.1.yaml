  *(Refining the Bad Lighting point)*: The tension is: If seeing is factive, it puts me in touch with reality. If I'm in bad lighting, I'm in touch with reality, but I can't *tell*. So the "epistemic privilege" isn't internal access. It's externalist. The disjunctivist must embrace externalism. If they try to keep internalism, they fail. I need to highlight this.

