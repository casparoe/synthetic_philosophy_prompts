answer: |-
  # The Archaeology of Ghosts: Why Inverse Reinforcement Learning is Construction, Not Discovery

  Inverse Reinforcement Learning (IRL) promises to solve the value alignment problem by turning ethics into an engineering specification. The pitch is seductive in its empiricism: do not ask humans what they value, for they lie and confuse themselves; watch what they do. By treating observed trajectories as the solution to an optimization problem, IRL claims to invert the decision process and recover the reward function that caused it. This is revealed preference theory ported from economics to high-dimensional state spaces.

  But this empirical confidence rests on two shaky pillars: the mathematical uniqueness of the recovered reward and the rationality of the demonstrator. When these pillars are stress-tested against the actual requirements of alignment—specifically cardinal welfare comparisons and non-ideal human behavior—the "inference" story collapses. IRL does not infer pre-existing preferences hidden in the data. It constructs a preference model to make the agent intelligible. It is not archaeology; it is architecture.

  ### The Shaping Illusion: Ordinal Safety, Cardinal Risk

  The standard defense against the underdetermination of IRL is the Ng and Russell (2000) result on potential-based reward shaping. The theorem states that you can transform a reward function $R$ into $R'$ by adding a potential function $\Phi$ such that $R'(s, a, s') = R(s, a, s') + \gamma \Phi(s') - \Phi(s)$. This transformation leaves the optimal policy invariant. The standard comfort is that since the policy doesn't change, the ambiguity is benign. If the robot acts the same way, who cares which reward function we picked?

  This comfort holds only if the goal of IRL is purely imitation—cloning the policy. But alignment requires more than mimicry; it requires evaluation. We use recovered rewards to rank candidate policies, to price risks, to extrapolate to new states, and crucially, to aggregate preferences across multiple humans. These are *cardinal* tasks.

  Potential-based shaping preserves the ranking of actions *within* a state, but it shifts the value *of* the state. $V^\pi(s)$ changes by exactly $\Phi(s)$. If I am comparing two states to determine which is safer for the human, or comparing the welfare of Human A against Human B to resolve a conflict, the zero-point and scaling of the value function matter immensely. Shaping allows me to make State $X$ arbitrarily better than State $Y$ in terms of value, provided I adjust the transition rewards to keep the policy constant.

  If IRL is to serve as a basis for welfare aggregation or risk assessment, the "benign ambiguity" is malignant. The shaping freedom means the recovered reward is not a unique measurement of value, but a family of equivalent descriptions. To use IRL for cardinal alignment, one must fix the shaping potential $\Phi$ by fiat. But if you must fix $\Phi$ by fiat to get a unique value, you are no longer inferring the reward from the data. You are imposing a metric upon it. The data constrains the *shape* of the preferences, but the *scale and zero-point*—essential for any utility function doing real work—are supplied by the modeler.

  ### The Noise Dilemma: Fitting Bias or Imposing Rationality

  The second fracture appears when we drop the assumption of optimality. Real humans are not Boltzmann-rational agents. We suffer from present bias, akrasia, and framing effects. If we feed raw human trajectories into a standard IRL algorithm that assumes rationality, we recover a reward function that encodes our pathologies. The robot learns that we *want* to procrastinate, because that is what our actions reveal. It becomes a perfect servant of our lower impulses.

  To avoid this, we must posit an "idealized" preference underneath the noise. We assume the human is trying to maximize $R^*$ but is corrupted by a noise model (e.g., hyperbolic discounting). We then infer $R^*$ by stripping away the corruption.

  But notice the epistemic shift. If the demonstrations exhibit procrastination, and we infer a reward function that *does not* value procrastination, the evidence for that reward function does not come from the demonstrations. It comes from our prior assumption about what a "rational" human *should* look like. We are no longer reading the want straight off the choice. We are correcting the choice based on a normative theory of agency.

  This creates a dilemma. If we fit the data raw, we inherit the bias (alignment to behavior). If we idealize the data, we inherit the bias of the modeler (alignment to theory). There is no neutral ground where the data speaks for itself. The "preference" recovered in the idealized case is not a latent variable that caused the behavior; it is a counterfactual construct: "This is what you would have wanted if you were the agent we assume you are."

  ### The Verdict: Re-description, Not Inference

  This brings us to the core controversy: Is IRL inferring preferences, or re-describing behavior with a preference-shaped vocabulary?

  If "inference" implies finding a pre-existing, causally efficacious mental object that uniquely explains the data, IRL fails. The shaping argument proves the object is not unique; the noise argument proves the object often contradicts the data.

  Therefore, IRL is **re-description**. It is a constructive attribution of preferences to make the agent legible and predictable.

  This is not a dismissal of IRL's utility, but a correction of its ontology. When we run IRL, we are not mining for moral gold. We are fitting a functional model. We are saying: "If we treat this system *as if* it maximizes $R$, we can predict its behavior and intervene effectively." The preference is not a ghost in the machine; it is a coordinate system we overlay on the behavior to navigate it.

  This distinction matters because it shifts the burden of proof. If preferences are inferred entities, the burden is on the IRL researcher to prove they found the *real* ones. If preferences are constructive descriptions, the burden is to prove the description is *useful* for the specific alignment task at hand. For imitation, a shaped reward is useful. For welfare aggregation, it is not, unless we agree on a normalization scheme. For correcting bias, it is not, unless we agree on a normative model of rationality.

  By admitting IRL is re-description, we acknowledge that alignment is not a discovery problem ("What do they want?") but a design problem ("What model of what they want allows us to cooperate best?").

  ### The Strongest Objection: The Interventionist Argument

  The strongest objection to this constructivist verdict is the **Interventionist Argument**. It runs as follows: If IRL were merely re-description, manipulating the recovered reward function should not reliably change the agent's behavior in the real world. But it does. If I take the recovered $R$, modify it to penalize a specific state, and train a policy on it, the agent avoids that state. This causal leverage suggests $R$ corresponds to something real in the environment-agent dynamic. If it were just a vocabulary, tweaking the vocabulary shouldn't tweak the world. The predictive and interventionist success of IRL implies it is latching onto a latent structure, not just painting one on.

  ### The Answer: The Map is Not the Territory, But It Guides the Walk

  The Interventionist Argument conflates the utility of a model with the existence of the modeled entity. A Newtonian force diagram is a re-description of motion, not a discovery of invisible fluids pushing objects. Yet, manipulating the variables in the diagram (e.g., increasing friction coefficients in a simulation) correctly predicts changes in the physical system. The success of the intervention proves the *model is consistent*, not that the variables are ontologically fundamental.

  In IRL, the "reward" is a loss landscape we impose to make the agent's trajectory a gradient descent. When we modify the reward and retrain, we are not tweaking a hidden mental knob; we are changing the optimization target of a new policy. The success of this intervention shows that the *preference vocabulary* is a compatible interface for the agent, not that the preference existed prior to the modeling.

  Furthermore, the Interventionist Argument fails to address the underdetermination. I can intervene successfully with $R$ and with $R'$ (the shaped equivalent). Both interventions work for policy cloning. But if I try to intervene on *welfare* (e.g., "make the human happier"), $R$ and $R'$ may give contradictory advice because their state values differ. If the reward were a real, inferred entity, this contradiction would not exist. The fact that we can intervene successfully with multiple, mutually incompatible reward functions proves that the reward is a tool of description, not a unique causal lever.

  ### Conclusion

  We must stop treating Inverse Reinforcement Learning as a mind-reading technology. It does not peer behind the curtain of behavior to find the homunculus pulling the levers. It builds a puppet that moves like the human, and then calls the strings "preferences."

  This is not a failure, provided we recognize it. If we treat IRL as inference, we risk reifying our shaping choices and normative assumptions into "objective" human values, embedding our own philosophical errors into the reward function. If we treat it as constructive re-description, we accept responsibility for the choices we make: the choice of shaping potential, the choice of rationality model, the choice of normalization.

  IRL does not tell us what humans want. It tells us what we must assume humans want in order to work with them. The alignment problem, then, is not solved by better inference. It is solved by better philosophy—by explicitly debating which constructive attribution of preference yields the future we actually intend to build.
