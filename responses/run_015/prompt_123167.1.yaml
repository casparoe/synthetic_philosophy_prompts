  ### Brainstorming and Conceptual Mapping

  **Established Concepts & Near-Neighbours:**
  *   **Motte-and-Bailey Doctrine:** The closest analogue. A defensible position (Motte) is conflated with a controversial one (Bailey). *Distinction:* The user notes both claims here are substantive and contested, whereas the Motte is typically trivial or indisputable. Furthermore, in this pattern, the speaker does not merely retreat to the Motte when attacked; they actively use the Motte's credibility to bolster the Bailey when unchallenged.
  *   **Equivocation:** Using a term in two different senses. *Distinction:* The user notes the speaker genuinely means both claims in different contexts; the fallacy lies in the *transition* and *immunisation*, not merely the lexical ambiguity.
  *   **Ad Hoc Hypothesis (Popper/Lakatos):** Modifying a theory to escape falsification without increasing empirical content. *Distinction:* Here, the theory (the mathematical model) remains unchanged; the *claim about its applicability* shifts. It is a rhetorical shift, not a theoretical modification.
  *   **Reification / Misplaced Concreteness:** Treating an abstract model as concrete reality. *Distinction:* This is an ontological error, whereas the pattern described is a strategic argumentative oscillation.
  *   **Existence vs. Constructibility:** In mathematics/computer science, proving a solution exists vs. proving it can be found in finite time. *Relevance:* High. The static proof is often an existence proof; the dynamic claim is a constructibility/feasibility claim.
  *   **Ceteris Paribus Clauses:** Assuming "all else equal". *Relevance:* The static proof relies on this; the dynamic claim implicitly violates it, yet borrows the proof's validity.

  **Boundary Sketching:**
  *   *Lower Boundary:* Simple scope ambiguity (unintentional confusion about where a theory applies).
  *   *Upper Boundary:* Deliberate fraud (knowingly lying about the model's capabilities).
  *   *Left Boundary:* Motte-and-Bailey (where the core is trivial).
  *   *Right Boundary:* Lakatosian Research Programme shifts (where the theory itself is altered).

  **Proposed Label:**
  There is no single established label in general argumentation theory that captures this specific *economic-methodological* configuration. While critics of planning (e.g., Lavoie, Boettke) frequently describe the *phenomenon*, they typically refer to it descriptively (e.g., "the static-dynamic problem") rather than with a formal argumentative label. I shall propose **Equilibrium Sheltering**.

  ---

  ### Response

  You have identified a pervasive and structurally significant pattern in the methodology of comparative economic systems, particularly within the reconstructions of the Socialist Calculation Debate (SCD). While the manoeuvre shares DNA with several established fallacies, your intuition is correct: it possesses a distinct topology that existing labels do not fully capture.

  There is no single established term in general argumentation theory or philosophy of science that precisely names this configuration. It is frequently discussed in the literature on the SCD—most notably by Don Lavoie in *Rivalry and Central Planning* (1985) and by critics of neoclassical equilibrium analysis—but typically under descriptive headings such as "the static-dynamic conflation" or "the parametric assumption."

  However, given the specific rhetorical immunity you describe—where the static proof provides cover for the dynamic claim, and the dynamic ambition provides relevance for the static proof—I propose the label **Equilibrium Sheltering**.

  Below is the precise conceptual carving you requested, defining the configuration, its necessary conditions, and its boundaries against neighbouring concepts.

  #### 1. Definition: Equilibrium Sheltering

  **Equilibrium Sheltering** is an argumentative configuration in which a defender of a formal model oscillates between two distinct claims regarding the model's applicability:
  1.  **The Static Existence Claim:** That the model converges on a solution under fixed parameters (defensible via mathematical proof).
  2.  **The Dynamic Feasibility Claim:** That the model coordinates real-world action amidst changing parameters (contested via empirical or praxeological critique).

  The configuration arises when the defender uses the rigorous validity of the *Static Existence Claim* to deflect criticisms directed at the *Dynamic Feasibility Claim*, while simultaneously using the practical urgency of the *Dynamic Feasibility Claim* to justify the relevance of the *Static Existence Claim*. When pressed on dynamics, the defender retreats to the static proof; when pressed on the relevance of the static proof, they imply dynamic efficacy.

  #### 2. Necessary Conditions

  For a configuration to qualify as Equilibrium Sheltering, three conditions must be met:

  *   **Shared Formalism:** Both claims must rely on the same mathematical or logical apparatus (e.g., the Lange-Lerner iteration procedure). This ensures the credibility of the static proof appears to transfer to the dynamic claim.
  *   **Ontological Slippage:** The conditions required for the static proof (given preferences, fixed production functions) must be ontologically distinct from the conditions required for the dynamic claim (discovery, innovation, flux), yet the argument treats them as continuous.
  *   **Rhetorical Oscillation:** The defender must not merely hold both claims simultaneously but must actively switch between them depending on the line of critique. The static proof is invoked to answer knowledge objections; the dynamic claim is invoked to answer relevance objections.

  #### 3. Boundary Distinctions

  To ensure precision, we must distinguish Equilibrium Sheltering from three nearby concepts.

  **A. Versus Motte-and-Bailey**
  *   *The Distinction:* In a classic Motte-and-Bailey, the "Motte" is typically a trivial, indisputable truth (e.g., "we should be open to discussion"), while the "Bailey" is a controversial normative claim (e.g., "all speech must be unrestricted"). In Equilibrium Sheltering, *both* claims are substantive. The static convergence proof is not trivial; it is a robust mathematical theorem *within its assumptions*. The dynamic claim is not necessarily absurd, merely unproven.
  *   *The Boundary:* If the defender retreats to a claim that is tautological or trivially true, it is Motte-and-Bailey. If they retreat to a substantive but narrower mathematical claim that nonetheless fails to support the broader economic conclusion, it is Equilibrium Sheltering.

  **B. Versus Scope Ambiguity**
  *   *The Distinction:* Scope ambiguity is often unintentional—a confusion regarding the domain of validity. Equilibrium Sheltering implies a strategic (though not necessarily dishonest) utilisation of that ambiguity.
  *   *The Boundary:* If the speaker is genuinely unaware that the static proof does not extend to dynamics, it is a methodological error or scope ambiguity. If they acknowledge the limitation when challenged but ignore it when asserting efficacy, it is Equilibrium Sheltering. The key marker is the *retreat*: the willingness to qualify the claim only under fire.

  **C. Versus Popperian Retreat (Ad Hoc Rescue)**
  *   *The Distinction:* In Popper's analysis of immunising stratagems, the theorist modifies the theory itself to escape falsification (e.g., adding a caveat to the law). In Equilibrium Sheltering, the theory (the mathematical model) remains untouched.
  *   *The Boundary:* A Popperian retreat changes the *rules of the model* to fit the data. Equilibrium Sheltering changes the *claim about the data's fit to the model*. It is a shift in *application*, not in *axiom*.

  #### 4. Conceptual Topology

  The immunity you observed arises because the configuration creates a **Credibility Loop**:
  1.  **Input:** The static proof borrows the *rigour* of mathematics.
  2.  **Output:** The dynamic claim borrows the *relevance* of policy.
  3.  **Shield:** When rigour is questioned, the defender points to the math (Static).
  4.  **Shield:** When relevance is questioned, the defender points to the policy need (Dynamic).

  This distinguishes it from simple equivocation. In equivocation, a term changes meaning. In Equilibrium Sheltering, the *status of the conclusion* changes. The conclusion shifts from "This is mathematically possible" to "This is economically viable" without a bridging argument.

  #### 5. Conclusion

  While the phenomenon is well-documented in the history of economic thought—particularly in critiques of the Lange-Taylor theorem—it lacks a standardised label in argumentation theory. **Equilibrium Sheltering** captures the specific mechanism: the use of a static equilibrium proof as a shelter against dynamic criticism, coupled with the use of dynamic necessity as a shelter against static irrelevance.

  It is a distinct methodological hazard because it allows a model to remain unfalsifiable: it cannot be disproven mathematically (because the static proof holds) nor empirically (because failures are attributed to dynamic 'frictions' rather than the model itself). Recognising this configuration requires isolating the *conditions of convergence* from the *conditions of change*, and demanding a separate proof for the latter.
