      *   **Q4: The Dog.**
          *   *Relevance:* Animal cognition. Nyāya argues animals have perception but not *upamāna* (which requires linguistic capability to understand the comparison "X is like Y"). If the dog learns "squirrel" without language, it's associative learning (Perception + Memory), not *Upamāna*. This highlights that *Upamāna* is linguistic/conceptual, not just pattern matching.

