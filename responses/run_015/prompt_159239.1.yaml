  7.  **Final Polish:** Ensure the distinction between "knowing that" (propositional) and "knowing what" (acquaintance/reference) is clear, as this maps well onto the *Upamāna* debate. Make sure to explicitly answer the "where does it break" question regarding the flatmate's inference model.

      *(Self-Correction on the Dog)*: Nyāya actually argues animals *don't* have *upamāna* because it requires understanding a sentence ("The gavaya is like the cow"). The dog is doing associative perception. This supports the user's case that their human experience was distinct.

