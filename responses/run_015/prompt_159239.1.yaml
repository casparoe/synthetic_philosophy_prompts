      *   *Nuance on Error:* The flatmate's point about *pramāṇa* entailing truth is standard. *Pramā* is valid cognition. If it's false, it's *viparyaya* (error). So, strictly speaking, the volunteer *didn't* use a *pramāṇa* successfully. The user did. The *capacity* for error doesn't negate the *source*, provided there are criteria for success.
      *   *The "Zig-Zag" Detail:* The user mentioned "zig-zag, one per node" vs "opposite pairs." This is crucial. The description was imperfect or the volunteer missed a detail. This supports the "conditions of validity" argument.
