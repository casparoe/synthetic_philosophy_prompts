      *   **Core Thesis:** Aristotle's critique of *chrematistike* (money-making) isn't primarily moral ("greed is bad") but *structural/institutional*. Coinage changes the *form* of exchange, decoupling it from need (*oikonomia*). Interest (*tokos*) is a symptom of this structural shift, not the root. The institution reshapes the agents within it (proto-institutionalist).
      *   **Task:** "Tear them apart or tell me I'm not crazy." Engage deeply with the ideas, don't just give bibliography.
      *   **Specific Questions:**
          1.  Is the "proto-institutionalist" framing supported by the text, or is it anachronistic?
          2.  Does making *tokos* (interest) secondary weaken the argument?
          3.  Is the "signifier/signified" language too anachronistic?
      *   **Bonus:** Find a typo in the outline (optional but fun).

  2.  **Evaluate the Core Thesis (Aristotle on Money/Exchange):**
      *   *Standard Reading:* Aristotle distinguishes natural acquisition (*oikonomia*) for the sake of the household from unnatural acquisition (*chrematistike*) for the sake of infinite accumulation. He hates usury (*tokos*) most of all because money begetting money is "unnatural."
      *   *User's Reading:* Shifts focus from *moral intent* (greed) to *structural affordance* (coinage properties). The *form* of money (storable, homogeneous, divisible) allows for infinite accumulation, which then corrupts the agent. This aligns with newer scholarship (e.g., Meikle, Finley, but also more recent institutionalist readings).
      *   *Verdict:* This is a strong, defensible, and sophisticated reading. It moves beyond "Aristotle was a grumpy old man" to "Aristotle understood the affordances of technology."

  3.  **Address Question 1: Proto-Institutionalist Framing:**
      *   *Challenge:* "Institutionalism" is a modern social science term (Veblen, Commons, North). Aristotle doesn't have this vocabulary.
      *   *Defense:* However, Aristotle *is* a teleological functionalist. He analyzes things by their *ergon* (function). If the *ergon* of money is measure/exchange, but its *form* allows accumulation, there's a structural tension. The claim that the "institution selects for people" is very close to Aristotle's idea that habits (*ethos*) form character (*ethikos*). If the system rewards infinite accumulation, people become infinite accumulators.
      *   *Risk:* Avoid implying Aristotle thinks institutions exist independently of human action. For him, the *polis* is prior to the individual, but the *polis* is made of individuals. The feedback loop is key.
      *   *Conclusion:* It's not smuggling *if* you frame it as "Aristotle anticipates the logic of institutionalism" rather than "Aristotle was an institutionalist." Focus on *nomos* (convention) vs. *physis* (nature). Coinage is *nomos*, but it acts upon *physis*.

  4.  **Address Question 2: *Tokos* as Secondary:**
      *   *Standard View:* *Tokos* is the climax of Aristotle's rant. It's the "most hated" because it's money from money.
      *   *User's View:* *Tokos* is just the extreme symptom. The root is the unlimited nature of *chrematistike* enabled by coinage.
      *   *Analysis:* This actually *strengthens* the argument. If you focus only on *tokos*, it looks like a specific ban on lending. If you focus on the *unlimitedness* enabled by coinage, *tokos* becomes the logical endpoint of a system gone wrong, not just an isolated sin. It makes the critique systemic rather than sectoral.
      *   *Caveat:* Don't dismiss *tokos* entirely. It's the "purest" form of unnaturalness. But framing it as the *reductio ad absurdum* of the structural error works well.

  5.  **Address Question 3: Signifier/Signified Language:**
      *   *Risk:* Saussure is 2000 years later. Aristotle talks about money as a *measure* (*metron*) and a *guarantee* (*hypallagma*).
      *   *Defense:* Aristotle explicitly says money exists by convention (*nomos*), not nature (*physis*). It represents demand (*chreia*). So, money = sign of demand. If you treat the sign as the thing itself, you get *chrematistike*.
      *   *Recommendation:* Use Aristotle's terms (*nomos*, *metron*, *chreia*) alongside the semiotic gloss. Don't say "signifier," say "conventional token." It keeps the analysis grounded in the text while making the point clear to modern readers.

