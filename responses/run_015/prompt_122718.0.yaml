      *   *Continuity/Historical:* Chain broke in 1968. Linguists say it's new. Dr. A's view on Latin (Case 1) suggests descendants aren't the ancestor. But Case 5 (Planned) suggests *new* beginnings are okay. Is revival a *new* beginning or *continuation*? Case 6 suggests names/institutions define identity. Predicts: **Living & Same** (due to Case 6 weight) OR **Living & New** (due to Case 1 weight).
