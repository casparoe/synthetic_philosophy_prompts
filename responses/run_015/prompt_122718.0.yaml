      *   *Conflict:* The break in transmission (1968-2009).
      *   *Resolution:* Case 5 is key. A language can *become* living (Planned -> L1). Therefore, a language can *become* living again. The label "Living Language" is a functional status for funding, not an ontological claim about unbroken chains. Case 6 confirms the *name* follows the community.
