      *   *Case 3 (41 fluent, some semi, some children):* Living. Transmission trumps low numbers.
      *   *Case 4 (3 speakers, 80+, no children, no docs):* Indeterminate. Refusal to classify when utility is negligible/unclear. Avoids guessing.
