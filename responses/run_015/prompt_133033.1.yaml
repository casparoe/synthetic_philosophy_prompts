  Your tentative principle—the "Fallback Number"—is intuitive, but it collapses under the weight of your own verdicts. In Case 1 (the AI leak), the fallback number is low: if just a few engineers leak, the signal degrades into noise. Your principle would say "stand down," yet your verdict is "act." In Case 2 (geoengineering), the fallback number is high: it takes many groups to erode a global norm. Your principle would say "act," yet your verdict is "stand down." The threshold of actors required to break the system does not determine your moral intuition; the *kind* of system being broken does.

  To capture your verdicts, we must replace the Fallback Number with a distinction between **rivalrous physical interventions** and **non-rivalrous epistemic corrections**.

  Here is the proposed principle:

  ### The Principle of Rivalry and Epistemic Authority

  **Clause 1 (Physical and Resource Restraint):** If an action involves the consumption of a finite resource or a physical intervention in a shared system, you must not act unilaterally, regardless of your expertise or the negligible size of your individual footprint. The harm lies in the precedent or the deprivation, which expertise does not mitigate.
  *   *Motivated by Case 2 (Geoengineering) and Case 4 (Antibiotics).*

  **Clause 2 (Epistemic Correction):** If an action involves revealing concealed information or correcting a safety failure, you may act unilaterally. However, to avoid the unilateralist's curse (signal dilution), you should defer to the actor with the most direct evidence. If you possess the superior evidence, action is obligatory.
  *   *Motivated by Case 1 (AI Leak).*

  **Clause 3 (Standard Dissemination):** If an action involves the standard publication of scientific results, you may act unilaterally. The norm of openness outweighs the additive probabilistic risk, provided the action does not violate Clause 1.
  *   *Motivated by Case 3 (Virology).*

  ***

  ### Testing the Principle Against Your Cases

  **Case 1 (AI Leak):** This is an epistemic correction (revealing buried safety evidence). Under Clause 2, action is permitted. However, your verdict is that it is "close to obligatory." My principle refines this: it is obligatory *only* if you are the best source. If you are one of forty with equal evidence, the principle demands coordination or deference to avoid the "circus."
  **Case 2 (Geoengineering):** This is a physical intervention in a shared system. Under Clause 1, you must stand down. Your expertise ("world's leading modeler") is explicitly rendered irrelevant by the clause, matching your intuition that the verdict "does not move at all."
  **Case 3 (Virology):** This is standard dissemination (Clause 3). It is non-rivalrous information. The additive risk is probabilistic misuse, not certain deprivation. Action is "Fine."
  **Case 4 (Antibiotics):** This is resource competition (Clause 1). Antibiotics are finite and rivalrous; your gain is another clinic's loss. Action is "Not Fine."

  ### The Inconsistencies Explained

  You noted that Cases 3 and 4 look structurally identical to you (private signal, early benefit, additive harm), yet you react oppositely. This principle forces you to drop that structural assessment. They are *not* identical. Case 4 is **rivalrous**: if you take the dose, I cannot. Case 3 is **non-rivalrous**: if you publish the paper, I can still publish mine; the harm is only a diffuse increase in background risk. Your gut correctly identified that hoarding is morally distinct from publishing, even if the game-theoretic structure looks similar. This principle validates your gut and rejects your structural comparison.

  You also noted that reversibility (Case 2 vs. 3) seems to work opposite to your expectations. You likely view genetic information (Case 3) as harder to "take back" than aerosols (Case 2), yet you permit Case 3 and forbid Case 2. This principle explains why: reversibility is the wrong metric. The metric is **Physical Imposition vs. Information Flow**. We tolerate irreversible information risks (Case 3) because science requires them; we forbid reversible physical interventions (Case 2) because they violate political sovereignty and norms.

  ### The Forced Drop

  To make this principle work, I must ask you to tighten your verdict on **Case 1**.

  You wrote that for the AI engineer, the action is "fine, close to obligatory." You added that this gets *firmer* if she has the most direct evidence. This implies that even with *mediocre* evidence, it is still "fine."
  **The Drop:** If we are truly solving the unilateralist's curse, it cannot be "fine" for any of the forty engineers to leak. If ten engineers with mediocre evidence leak, you get the "circus" you described, and the safety review might fail amidst the noise.
  **Correction:** The principle forces you to say it is **not fine** for an engineer with mediocre evidence to leak if they suspect others might. It is only fine (and obligatory) for the *single* best-informed engineer. You must drop the intuition that the action is generally permissible for the group; it is permissible only for the epistemic leader.

  ### The New Case: The Postdocs

  **Scenario:** One of a dozen postdocs could anonymously post a credible accusation of data fabrication. Several simultaneous posts would be dismissed as a smear.

  **Application:**
  1.  **Type:** This is Epistemic Correction (revealing concealed harm/fraud), similar to Case 1. It falls under Clause 2.
  2.  **Rivalry:** It is non-rivalrous information, but subject to signal dilution (the "smear" effect).
  3.  **Authority:** Clause 2 requires deference to the actor with the most direct evidence.

  **Verdict:**
  It is **Fine (and Obligatory)** for the postdoc with the most direct, documented evidence to post the accusation.
  It is **Not Fine** for the other eleven postdocs to post simultaneously, even if their evidence is credible. If they act, they trigger the "coordinated smear" defense, protecting the senior scientist and destroying the credibility of the truth-teller. They should defer to the best witness or coordinate to release a single joint statement. If coordination is impossible, only the best witness acts.

  This preserves the truth-seeking benefit of Case 1 while avoiding the signal-dilution harm you identified, applying the same "Epistemic Authority" constraint that saves the AI leak from becoming a circus.
