answer: |-
  The coffee in the styrofoam cup had gone cold an hour ago, but Elena kept holding it for the warmth leaking through the paper. It was 2:17 a.m. The chamber lights were dimmed to a twilight hum, casting long shadows across the empty seats of the ninety-nine other members. The water allocation vote was done. The bottling plant would get forty percent of the aquifer yield, down from the requested seventy. The downstream farmers would get guarantees on flow rates. The city would have to ration landscaping water for the next three years. It was a messy compromise that nobody loved, but everyone could live with.

  Now came the real vote. Article XII, Section 4: The Renewal.

  Elena looked at the ballot on the desk. *Shall the Charter of Random Selection be renewed for the next term?* Yes. No.

  Fifteen years ago, when Port Havre adopted the lottery, Elena had written an editorial calling it "governance by gasp." She owned a hardware store on 4th Street. She believed in elections. You vote for someone, they screw up, you vote them out. That was the contract. Random selection felt like abdication. Then her name came up in the pool. She'd spent the last six weeks listening to hydrologists, union reps, and suburban homeowners argue over pipes and aquifers. She hadn't screwed up. None of them had.

  "You're staring at it like it's going to bite you."

  Elena looked up. Marcus was standing in the aisle. He wore a flannel shirt that looked too clean for the fields he worked, probably bought specifically for this week of service. He wasn't from Port Havre. He was from Oak Creek, forty miles downstream. Under the old system, he couldn't vote in city elections. Under the Charter's "Affected Pool" rule, because the water decision impacted his irrigation rights, he was seated here with full voting power.

  "Just tired," Elena said.

  "We all are," Marcus said, stepping into the row. He didn't sit in the empty seat next to her; he leaned against the desk behind it. "My wife asked me this morning why I was staying late for a city I don't live in. I didn't have a good answer."

  "Because the river doesn't care about city limits," Elena said.

  "Right. But here's the thing." Marcus tapped the back of her chair. "When we voted on the water, I felt like a juror. We heard evidence, we weighed it, we decided. No lobbyists, no campaign donations. Just us. But now? This vote?" He gestured to the ballot. "This feels like we're voting on whether the jury gets to keep the courthouse."

  Elena set the cup down. This was the wall her reading group kept hitting. Was the assembly a mirror or a jury? If it was a mirror, it needed to reflect the city's demographics and interests. But Marcus wasn't from the city. His presence broke the mirror of Port Havre to build a mirror of the *region*. If it was a jury, it needed independence. But how independent were they if they were voting on their own power?

  "If we vote Yes," Elena said, her voice low in the quiet room, "we look like we're protecting our own privilege. We're the ones who got to play god for six weeks. Why would we give that up?"

  "And if we vote No?" Marcus countered. "We admit it was a mistake. We admit that ninety-nine random people shouldn't be trusted with the water supply. We hand it back to the City Council, who spent the last decade letting the bottling plant drill until the wells went dry."

  "That's the thing," Elena said. "The Council would have taken the blame. If they sold out the river, you'd know who to fire. Us? We dissolve in a month. We go back to selling lumber and planting corn. Who do you vote out next time if this goes wrong?"

  "Nobody," Marcus said. "That's the point. We aren't here to be voted out. We're here to be right."

  "Is that enough?" Elena asked. "Look at you. You're a stakeholder, not a citizen. You have a vote on our budget, our zoning, our water, but you don't live here. You don't pay our school taxes. If we keep this system, Port Havre stops being a city and starts being... I don't know. A management zone for anyone touched by the river."

  Marcus straightened up. He looked tired, the lines around his eyes deep in the dim light. "My grandfather farmed that bottom land before there was a Port Havre. The city incorporated around us. Now you say I don't have a say because I don't pay school taxes? When the plant drains the aquifer, my crops die. Your kids go to school. I lose my livelihood. Who's the real citizen here?"

  "It's not about who suffers more," Elena said, feeling the frustration rise. "It's about accountability. Elections are messy because they're about power. This..." She waved at the room. "This is about reason. But reason doesn't build roads. Reason doesn't collect trash. You need people who want to keep their jobs to do the boring stuff."

  "Maybe," Marcus said. "But we didn't do the boring stuff this term. We did the hard stuff. The stuff elected people are too scared to touch because someone might get mad. We told the plant no. We told the city no. We told myself no. If this system can do that, why would we stop?"

  "Because it's not sustainable," Elena said. "It relies on us being better than we are. Next time, the pool might not be ninety-nine people who show up and read the briefings. It might be ninety-nine people who don't care. Or who can be bought off-screen. The Charter assumes the lottery creates virtue. I think it just hides vice."

  Marcus was quiet for a long moment. He looked out the window at the dark river flowing past the city. "You know, when I got the letter saying I was selected, I threw it away. I thought it was a scam. Then the marshal came to my house. I thought, great, now I'm missing planting season to sit in a room with city people who think I'm backwards."

  "And now?"

  "Now I think..." He paused. "I think I know more about where my water comes from than I have in twenty years. I know the names of the people who fix the pumps. I know the cost of the filtration. If I vote Yes, I'm saying I want to keep that knowledge. I'm saying I want to keep being responsible."

  "But you're not responsible," Elena said gently. "Not really. You leave here in three days. You don't live with the backlash."

  "Neither do you," Marcus said.

  The silence stretched between them. It was the core of it. The Jury argument said that temporary independence was a feature, not a bug. You couldn't be leaned on if you weren't staying. The Mirror argument said that without long-term stakes, the reflection was distorted. They were a snapshot, not a portrait.

  Elena picked up her pen. The tip hovered over the Yes box.

  If she voted Yes, she was validating a system where a farmer from Oak Creek could vote on Port Havre's school budget next term if the issue was tangentially related. She was validating a system where she, a hardware store owner, had spent six weeks deciding the fate of an industry she didn't understand.

  If she voted No, she was admitting that democracy was too heavy for ordinary hands. She was sending the power back to the professionals, the campaigners, the donors. She was choosing the comfort of blame over the burden of power.

  "I thought I hated this," Elena said, mostly to herself. "I thought it was amateur hour."

  "It is," Marcus said. "But maybe amateur hour is what we need. Professionals get paid to keep the game going. Amateurs just want to go home."

  Elena looked at the ballot again. She thought about the bottling plant manager, who had looked her in the eye and lied about the recharge rates. She thought about the young mother from the east side who cried when she realized rationing meant her community garden would die. She thought about Marcus, who shouldn't have a vote here, but whose voice had stopped them from draining the creek dry.

  The system wasn't a mirror. It wasn't a jury either. It was something else. It was a timeout. A forced pause in the game of permanent campaigning.

  But timeouts end. You have to resume play.

  "If we vote Yes," Elena said, "we become a class. The Lottery Class. People will start campaigning for the pool. They'll try to game the demographics."

  "If we vote No," Marcus said, "we admit we can't trust ourselves."

  Elena capped her pen. She realized then that the vote wasn't about the system. It was about the feeling in her chest. The terror of having actually mattered. The elections she grew up with were designed to make you feel like nothing mattered until Tuesday every two years. This week had felt like every day mattered. That was exhausting. It was unsustainable.

  "I'm voting No," Elena said.

  Marcus didn't flinch. He just nodded slowly. "Because it failed?"

  "No," Elena said, folding the ballot. "Because it worked. It worked too well. It showed me that we *can* do this. And if we can do this, then there's no excuse for not doing it all the time. But we can't. We have jobs. We have lives. We can't be permanent citizens. So we give it back. But we don't pretend we're incapable anymore."

  She walked to the ballot box at the front of the room. It was a simple wooden crate. She dropped the envelope in.

  Marcus watched her return. "That's a hell of a reason to kill a system."

  "It's not killing it," Elena said, sitting back down. "It's just ending the term. Maybe in five years, someone else will be brave enough to try it again. But not us. We're too compromised now. We know what it feels like to hold the lever."

  Marcus pulled out the chair next to her and sat down. He looked at his own ballot. "You know, under the old rules, I'd be outside right now. Protesting. Calling my congressman."

  "And now?"

  "Now I'm just waiting to go home," Marcus said. He picked up his pen. "But I think I'll miss the view."

  He marked his ballot. Elena didn't ask how he voted. It didn't matter. The river kept flowing outside, indifferent to the charters and the votes and the lines on the map. The water allocation stood. The system was ending. The responsibility, however, was staying with them.

  Elena took a sip of the cold coffee. It tasted bitter, metallic. It tasted like reality.

  ***

  **Note on Liberties and Contested Readings**

  I took significant liberties with the "affected pool" concept, which is not standard in most sortition literature; typically, sortition proposals focus on demographic representativeness within a polity (the mirror), whereas your prompt's "stakeholder" model leans more toward deliberative polling or functional representation, creating a tension between geographic citizenship and material interest that most theorists keep separate. I am moderately confident in my read of the descriptive vs. independent tension (mirror vs. jury), as this is a central debate in the field (e.g., Guerrero vs. Landemore), but I am least sure about the viability of the self-renewal clause; while some proposals suggest bodies should have sunset clauses, having a body vote on its own existence is widely regarded in political science as a conflict of interest that compromises legitimacy, though I used it here as a dramatic device to force the philosophical conflict into a binary choice. The story treats the "affected pool" as a stable category, whereas in practice, defining "material affect" is itself a highly contested political act that would likely require a prior elected body to adjudicate, meaning the sortition body might not be as sovereign as the story implies.
