answer: |-
  The asymmetry holds for specific artifacts but dissolves in the full causal chain, because computational systems can generate code via selection, eliminating the designer and collapsing deferred comprehension into the same comprehension-free mechanism as Darwinian evolution.

  Your intuition correctly identifies that a specific compiled program defers comprehension to its coder, but this deferment is temporary rather than fundamental. If the coder is a human, their cognitive competence is not a skyhook but a product of Darwinian selection, meaning the chain of deferment ultimately terminates in elimination. Furthermore, computer science demonstrates that Turing machines need not be programmed by minds; genetic algorithms and neural nets generate competent code through variation and retention alone, proving that computational competence can arise without any upstream comprehension to defer to. In this regime, the Turing inversion is not merely deferred but eliminated, identical in structure to the Darwinian case.

  Regarding selection smuggling comprehension back in, this occurs only if you treat fitness as a goal rather than a statistical outcome. Selection operates as a filter analogous to an enzyme's active site: it stabilizes certain configurations over others based on physical constraints, not because it "knows" which configuration is better. The appearance of rationale is inherent in the structure of the survivor, not imposed by the process. Thus, both inversions rest on the same mechanistic foundation: competence accumulates through feedback loops that require no internal model of why the competence works.
