  **The Scenario and Maxim**
  In my role as a senior researcher, I often collaborate with long-term peers whose competence I have verified over years. My maxim is: *"In collaborations with proven peers, I will sign off on their data without independent re-verification, to honor our mutual professional trust and avoid insulting their competence."* This is a practice of efficient, high-trust teamwork. A decent person adopts this to foster a healthy professional environment, not to cut corners on truth. The action is "co-authoring," which implies shared responsibility for the truth of the publication.

  **The Three Tests**
  **Statutory Universalization:** If every researcher freely adopted this maxim, the practice would remain permissible. The scientific community would function on high-trust networks; verification would occur at the level of hiring/tenure (proving competence) rather than per-project. The concept of "co-authorship" survives because agents *retain the capacity* to verify but choose to delegate based on trust. The system adapts, and the action remains coherent.

  **Nomic Universalization:** If this were a law of nature—where agents *could not help but* skip verification—the concept of "co-authorship" collapses. Co-authorship conceptually entails "shared responsibility for validity," which requires the *possibility* of validation. If nature makes verification impossible (agents are determined not to do it), the "responsibility" component becomes empty. The action transforms from "vouching for truth" to "lending a name." The maxim describes "co-authoring," but the nomic reality renders that action type impossible, creating a contradiction in conception.

  **Formula of Humanity:** This maxim passes the Formula of Humanity. By trusting a proven peer, I treat them as a rational end, acknowledging their competence and autonomy rather than micromanaging them as a tool. I am not deceiving the public (assuming the peer is competent), nor am I using the collaborator merely as a means. The duty of beneficence and respect for colleagues supports this maxim, so FH does not rule it out.

  **The "Blow Up" Feature**
  The single feature that makes the nomic reading blow up is the **retention of capacity**. Under the statutory reading, agents *choose* not to verify, meaning the capacity to verify remains intact, preserving the normative weight of "responsibility." Under the nomic reading, the capacity is removed by natural necessity. Without the *possibility* of verification, the *obligation* of co-authorship becomes conceptually incoherent. The action loses the very feature (voluntary assumption of risk) that makes it "trust" rather than "blindness."

  **Deletion Test**
  If you delete the "proven peer" constraint, the case collapses into a **Formula of Humanity violation** (negligence/recklessness with truth), regardless of the universalization reading. If you delete the "capacity" distinction (i.e., if statutory adoption also implied a loss of capacity), the case collapses into a **free rider scenario** (the system only works if some people *can* verify). The gap between Statutory and Nomic exists *only* because Statutory preserves the agent's power to do otherwise, while Nomic removes it.

  **The Statutory Objection and Honest Assessment**
  A defender of the statutory reading will attack your case by arguing that you are conflating **social conventions** with **logical necessities**. They will say: "If it were a law of nature that researchers don't verify, the definition of 'co-authorship' would simply shift to mean 'endorsement without verification.' Unlike a false promise (which logically requires intent to keep), co-authorship is a mutable social institution. Therefore, the nomic contradiction is empirical (science gets worse), not conceptual (science becomes impossible)."

  **Honest Assessment:** This objection carries significant weight. The "False Promise" example works because promising is *defined* by the intent to fulfill; your example relies on co-authorship being *defined* by the capacity to verify. In reality, academic norms are malleable. If your professor holds that social institutions can adapt to nomic laws without conceptual collapse, this case will not prove the readings yield different verdicts—it will only prove they yield different *descriptions* of the same institution. To salvage it, you must argue that "Responsibility" is a non-negotiable conceptual component of "Authorship," not just a contingent norm. If she accepts that, the case holds. If she views all professional roles as purely conventional, the gap closes, and the example fails to demonstrate a verdict flip.
