answer: |-
  **MEMORANDUM**

  **TO:** Capital Projects Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 23, 2023
  **SUBJECT:** Policy Determination: Wild Animal Welfare as a Mitigation Metric

  ### Bottom Line
  The Committee should **decline** to count anticipated reductions in wild animal suffering (WAS) as a mitigation benefit for the proposed Satellite Engineering Campus at this time. However, acknowledging the ethical rigor of the proposal, we should simultaneously establish a Faculty-Student Task Force to evaluate "welfare-adjusted habitat units" for future application.

  **Action Required:** Vote at the Thursday meeting to approve the Environmental Assessment without WAS credits, contingent on the formation of the Task Force.
  **Task Force Deadline:** Report findings to the Committee by May 1, 2024.

  ---

  ### Background
  The University proposes constructing a satellite engineering campus on 180 acres of owned pasture and scrubland. The Environmental Assessment (EA) identifies the site as functional habitat for small rodents, ground-nesting birds, and a resident pair of Northern Harriers. Data indicates high juvenile mortality rates typical of these species (starvation, predation, exposure).

  During the comment period, the Student Animal Advocacy Group, supported by preliminary comments from Ecology Faculty, requested that the Committee record the "expected reduction in wild animal suffering" as a positive mitigation benefit. Their argument rests on the premise that wild lives in this habitat are net negative due to high mortality and stress; therefore, preventing these animals from existing reduces total suffering. This complicates the proposed offsite wetland restoration offset, which would traditionally be viewed as an unqualified ecological gain.

  County zoning rules are silent on animal welfare metrics, leaving this determination to institutional discretion.

  ### The Case for Counting WAS Reductions (The Proposal)
  We must treat the student and faculty proposal with serious ethical weight. It is not merely a justification for development, but a consistent application of negative utilitarianism to environmental policy.

  1.  **Ethical Consistency:** If the University claims to value animal welfare, that value cannot stop at the property line. Ignoring the suffering of wild animals while regulating the welfare of laboratory or agricultural animals creates a moral arbitrary boundary.
  2.  **Empirical Reality:** The EA confirms high juvenile mortality. If a significant majority of vole pups and nestlings starve or are preyed upon within weeks of birth, the aggregate suffering in this habitat may objectively outweigh the aggregate pleasure.
  3.  **The "Non-Identity" Benefit:** From the perspective of the individual animals that will *not* be born due to habitat loss, there is no deprivation of a "good life" if their lives would have been predominantly painful. Preventing existence is, under this framework, a welfare gain.
  4.  **Innovation in Metrics:** The faculty proposal for "welfare-adjusted habitat units" attempts to modernize conservation beyond simple acreage or biodiversity counts, integrating sentience into land management.

  ### The Case for Declining (The Recommendation)
  Despite the logical coherence of the WAS argument, adopting it as a mitigation credit for this project presents significant epistemic, practical, and ethical risks that currently outweigh the benefits.

  1.  **Epistemic Uncertainty:** We lack a scientifically validated method to measure "net negative" life in wild populations. Suffering is subjective; mortality rates are not a perfect proxy for welfare. A short life is not necessarily a miserable one. To credit suffering reduction based on current data would be to build policy on speculation.
  2.  **Perverse Incentives (The "Bulldozer" Risk):** If habitat destruction is credited as suffering reduction, the University creates a financial and regulatory incentive to degrade land. This conflicts with our broader sustainability goals and could encourage "strategic neglect" of other properties to generate welfare credits.
  3.  **Ecological Integrity vs. Individual Welfare:** Current environmental law and conservation ethics prioritize ecosystem health and biodiversity. A policy that values the non-existence of individuals over the continuity of species could legally and philosophically undermine the mandate of the Environmental Assessment itself.
  4.  **The Offset Paradox:** If destruction reduces suffering, then restoration (the wetland offset) potentially increases it by creating new habitat for animals to live short, miserable lives. Accepting the WAS argument renders the offset liability rather than an asset, paralyzing our ability to mitigate impact.

  ### Falsifiability: What Would Change This Recommendation?
  We should remain open to future data. The Committee would be prepared to revisit this policy if:
  *   **Consensus on Sentience Metrics:** Peer-reviewed consensus emerges on measuring wild animal welfare that distinguishes between "natural mortality" and "net negative experience."
  *   **Decoupled Incentives:** A framework is developed where WAS reduction cannot be traded for development rights (e.g., WAS is measured for research only, not for regulatory credit).
  *   **Species-Specific Data:** Evidence demonstrates that specific populations on University land are suffering due to anthropogenic factors (e.g., pollution, invasive species) rather than natural ecological dynamics, creating a duty of care to intervene.

  ### Next Steps
  1.  **Thursday Meeting:** Vote to approve the Satellite Campus EA based on traditional biodiversity and ecosystem service metrics, explicitly noting that WAS reduction was considered but not adopted as a credit.
  2.  **Task Force Formation:** By November 1, the Office of Sustainability will convene the Animal Advocacy Group, the Ecology Faculty proponent, and an Ethics Chair to draft a framework for "welfare-adjusted habitat units."
  3.  **Report Deadline:** The Task Force will submit a white paper by **May 1, 2024**, recommending whether this metric can be safely integrated into University land management policy without creating perverse incentives.

  This approach respects the intellectual seriousness of the students' challenge while protecting the University from adopting a policy with unintended ethical and environmental consequences.
