answer: |-
  **TO:** Executive Board, Local [Number]
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Re: Member Conduct During Recent Strike

  **Purpose**
  This memo outlines my recommendation regarding the member who crossed the picket line during the second week of the recent strike. We need a decision before Thursday's meeting. The goal here isn't just to close the book on this incident, but to decide what kind of union we want to be going into the next contract cycle.

  **Recommendation**
  I recommend the Board take **no disciplinary action** (no expulsion, no fine, no censure) against the member in question.

  However, this must be paired with two immediate actions:
  1.  **A formal review and amendment of the Strike Fund bylaws**, specifically regarding application windows and hardship clauses.
  2.  **A "Lessons Learned" membership meeting**, focused on strike readiness and mutual aid, rather than a disciplinary hearing.

  **Reasoning**
  We are a union. Our power comes from solidarity, but solidarity isn't just about holding the line; it's about ensuring everyone *can* hold the line.

  The argument for expulsion or fines rests on a valid point: if crossing the line has no consequences, the threat of a strike loses its teeth. If members believe they can opt out when things get difficult without repercussion, our leverage in two years is compromised. That fear is real, and the faction pushing for discipline is right to worry about precedent.

  But here's the counter-weight: The strike fund exists specifically to prevent the choice between rent and the picket line. In this case, the fund failed. The deadline was missed by a week, the rules were rigid, and the money was running low. We built a safety net with a hole in it, and this member fell through.

  If we punish her now, we are effectively punishing her for being poor. We are validating the exact argument management uses against us: that unions care more than dues and rules than the welfare of workers' families. Expelling a single mom because she couldn't afford to starve for the cause doesn't strengthen solidarity; it fractures it. It tells the membership that the union's protection is conditional on your bank account balance.

  We cannot afford to go into the next contract talks divided. A fractured local is a weak local. Management will hear about this expulsion before the ink is dry on our next proposal. They'll use it to drive wedges between drivers and warehouse, between seniority and new hires, between those who can afford to strike and those who can't.

  **Addressing the Discipline Argument**
  To the board members arguing for expulsion or fines: I hear you. You're worried that without consequences, we normalize crossing the line. That is a legitimate concern. If hardship becomes a blanket excuse, discipline erodes.

  But discipline relies on trust. Members hold the line because they trust the union will hold them. That trust was broken when the fund application was denied on a technicality. Restoring that trust requires us to acknowledge the system failed first. Punishing the member treats the symptom while ignoring the disease. The consequence here shouldn't fall on her; it should fall on us to fix the rules so the next person doesn't have to make that choice.

  **The Strike Fund Rules**
  Some have argued that changing the bylaws now looks like we're reacting to one sympathetic case. My view is: **Good.** We should react to reality.

  If we wait, we look bureaucratic and cold. If we act now, we show we learn from mistakes. We don't need to open the floodgates. We can add a "Hardship Clause" to the strike fund rules—requiring documentation (like eviction notices) and a Board vote for late applications. This keeps the integrity of the deadline but allows for human emergency. It turns this incident into a policy upgrade rather than a disciplinary scandal.

  **Precedent for Next Contract**
  We are two years out from the next big talk. The precedent we set here isn't about whether crossing the line is okay. It's about how we handle internal conflict.
  *   **If we expel/fin:** We set a precedent that the union disciplines its most vulnerable members first. Morale drops. Organizing becomes harder.
  *   **If we do nothing + fix rules:** We set a precedent that we protect our own, but we also hold ourselves accountable to improve our mutual aid.

  **Next Steps**
  1.  Vote to table disciplinary action.
  2.  Appoint a committee (including representation from the differing factions on this board) to draft the Strike Fund Hardship Clause by next meeting.
  3.  Draft a statement for the membership that acknowledges the difficulty of the strike, reaffirms the importance of the picket line, but explicitly states the union's commitment to ensuring no member has to choose between their job and their home.

  This is the harder path politically, because it requires us to admit the union made a mistake with the fund. But it's the only path that keeps us whole.

  Let me know if you need anything else before Thursday.

  -[Your Name]
