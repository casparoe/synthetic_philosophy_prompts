      *   *Option 2: Censure + Fine.* Still punishes poverty. A fine might be unpayable, leading to expulsion anyway. "Conduct unbefitting" is vague and dangerous to weaponize against hardship.
      *   *Option 3: No Action.* Risks undermining strike discipline. Sends message that crossing is okay if you complain enough.
      *   *Option 4: Third Option (Restorative/Conditional).* Acknowledge the breach but focus on repair and systemic fix.
      *   *Decision:* The most strategic and ethical path is **No Disciplinary Action**, coupled with a **Commitment to Reform the Strike Fund Rules**.
      *   *Why?* Expelling a member for poverty validates anti-union rhetoric. It fractures the local. The real failure was the Fund's rigidity, not just the member's choice. However, "No Action" can't look like weakness. It needs to be framed as "Solidarity means protecting our own *and* holding the line, but we failed the first part."
      *   *Refinement:* Actually, a pure "No Action" might be too weak for the pro-discipline faction. A "No Disciplinary Action" but with a **mandatory restorative conversation/mediation** might be a good middle ground. But honestly, in a 500-member local, dragging her through a hearing is punitive.
