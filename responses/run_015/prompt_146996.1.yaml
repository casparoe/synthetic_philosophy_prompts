answer: |-
  ### Diagnostic Splits

  **Split 1 (Evidence)**
  Consider an insect that avoids noxious heat through localized reflex arcs with no central integration or global workspace. Does this architecture provide (a) weak but genuine evidence leaving a small non-zero probability of sentience, or (b) effectively no relevant evidence, leaving that probability near zero?

  **Split 2 (Aggregation)**
  Assuming a small independent probability *p* for each insect and a population numbering in the billions or trillions, should moral weight be calculated by (a) linear multiplication of *p* by population size (expected-value style), or (b) a threshold or confidence-weighted approach in which low per-capita confidence blocks straightforward population-level scaling?

  **Split 3 (Practical Weight)**
  Setting aside practical feasibility, should the protection of insects be treated as a moral priority comparable in urgency to the protection of mammals—yes or no, regardless of the reasoning path that led there?

  ***

  ### Taxonomy of Positions

  The following seven positions occupy the logical space generated by the three splits. One combination remains unoccupied.

  **1. Radical Scale Sentientist (1A, 2A, 3A)**
  Accepts weak evidence of sentience, aggregates moral weight linearly across populations, and demands protection priorities comparable to mammals.

  **2. Moderate Scale Sentientist (1A, 2A, 3B)**
  Accepts weak evidence of sentience and aggregates linearly, but concludes the total moral weight remains lower than that of mammals due to intensity or quality differences.

  **3. Precautionary Sentientist (1A, 2B, 3A)**
  Accepts weak evidence of sentience but rejects linear aggregation due to uncertainty, yet still mandates mammal-comparable protection based on risk avoidance.

  **4. Cautious Sentientist (1A, 2B, 3B)**
  Accepts weak evidence of sentience and rejects linear aggregation due to uncertainty, resulting in protection priorities lower than those for mammals.

  **5. Calculating Insentientist (1B, 2A, 3B)**
  Finds effectively no evidence of sentience and applies linear aggregation to the near-zero probability, yielding negligible moral weight and lower protection priorities.

  **6. Ecological Protectionist (1B, 2B, 3A)**
  Finds effectively no evidence of sentience and blocks aggregation, but mandates mammal-comparable protection based on non-sentience values like ecological stability or structural integrity.

  **7. Strict Insentientist (1B, 2B, 3B)**
  Finds effectively no evidence of sentience and blocks aggregation based on low confidence, resulting in negligible moral weight and lower protection priorities.

  ***

  ### Analysis of the Unoccupied Cell

  **The Empty Combination: (1B, 2A, 3A)**
  This path combines near-zero individual probability (Split 1B), linear aggregation (Split 2A), and obligations comparable to mammals (Split 3A). This cell is unoccupied because the position is **logically incoherent**. If the probability of sentience is effectively zero, linear multiplication by any population size yields a moral weight of zero. It is impossible to derive high moral priority from a zero base using the mathematical operation specified in Split 2A without contradicting the premises of the path itself.

  ***

  ### Practical Ambiguity Flag

  **Indistinguishable Pair: Precautionary Sentientist (1A, 2B, 3A) and Ecological Protectionist (1B, 2B, 3A)**
  The tree cannot genuinely separate these two leaves in practice because both prescribe identical policy outcomes (mammal-comparable protection) despite diverging on the underlying evidence for sentience. The ambiguity lies not in the diagnostic questions, which successfully separate their theoretical justifications, but in the **underlying views**, where distinct metaphysical commitments (uncertainty about consciousness vs. value without consciousness) converge on the same practical imperative.

  ***

  ### Epistemic Note

  This taxonomy is most vulnerable to collapse at **Split 2 (Aggregation)**. If a conceptual argument demonstrates that **probabilistic moral patienthood is incoherent**—meaning moral status cannot be partially assigned based on the probability of consciousness but must be binary (either a being counts or it does not)—the distinction between linear multiplication and threshold blocking dissolves. Such a finding would force a revision of the mapping, likely collapsing Split 2 entirely and requiring a binary determination of sentience at Split 1 to drive all subsequent moral weighting.
