prompt: |-
  I spent last evening in a long, circular argument with a friend about whether rational agents must defer to objective chance, particularly under conditions of epistemic self-doubt. We kept talking past each other on whether the Principal Principle—the constraint that rational credence should align with known objective probabilities—survives once an agent possesses higher-order evidence that her own grasp of those probabilities is systematically unreliable. Rather than continue the stalemate, I want us to produce a genuine adversarial-collaboration document. Please draft the joint statement that two camps could sign: Camp A, defenders of unconditional deference to objective chance, who maintain that known physical probabilities constrain belief regardless of the agent's meta-level uncertainty; and Camp B, skeptics who argue that higher-order evidence about reasoning or instrumental failure can legitimately block such deference without requiring a rejection of chance realism.

  Organize the document as follows. First, a numbered section of agreed claims: a neutral formulation of the Principal Principle itself; acknowledgment that objective chances figure in at least some mature physical theories; agreement that agents can possess second-order evidence about the reliability of their own probability assessments; and agreement that the core dispute is normative-epistemic rather than purely metaphysical. Second, a disagreements table that states each camp's position in wording its members would accept—isolating exactly whether deference is unconditional or conditional on epistemic transparency, whether blocking it requires denying objective chance or only revising norms of belief formation, and how each camp treats calibration data about past predictions. Third, the cruxes: I take the central ones to be (i) whether objective chance remains epistemically accessible enough to ground deference when an agent knows her access is mediated by fallible instruments, and (ii) whether accepting deference forces an agent to disregard statistical evidence about her own reasoning errors. For each crux, provide a concrete hypothetical case that both sides agree bears on it—for instance, an agent who knows a quantum-randomness generator assigns objective chance 0.5 to an outcome, but who also knows her interpretation apparatus misclassifies outputs at a 15% rate under identifiable conditions—and record in advance each camp's predicted verdict about what rational credence the agent ought to hold.

  Please begin your response with the polished joint-statement document itself, with no preface, no commentary, and no restatement of this request. Present it as a formal text both parties could put their names to.
