answer: |-
  ### Critical Warning on Setup
  Yes, your setup smuggles in the false idea that dirty hands is always about intentional acts rather than structural complicity. By starting with a leader *authorizing* a specific wrong to avert a *catastrophe*, you lock the tree into the classic agent-centered dilemma (Walzer/Weber). This excludes the structural view where hands are dirty simply by participating in unjust systems, regardless of specific choices or catastrophes. If your blog aims to cover the full logical space of political morality, this tree will only map the "Great Man" slice of the problem, not the systemic one.

  Additionally, the tree logically collapses if "Sacramental Contamination" is true, as it renders subsequent questions about authorization or outcome irrelevant. I have mapped the theoretical space below, flagging where the branches break or overlap.

  ### The Decision Tree

  **Root:** A leader authorizes a clearly wrong act (e.g., torture) to avert catastrophe, then leaves office.

  **Q1: Is the moral stain ineradicable regardless of outcome or authorization?**
  *   **YES** → **Leaf 1: Sacramental Contamination**
  *   **NO** → Go to Q2

  **Q2: Does the institutional role consume the actor's personal moral residue?**
  *   **YES** → **Leaf 2: Role-Absorption**
  *   **NO** → Go to Q3

  **Q3: Does democratic authorization cleanse the act?**
  *   **YES** → **Leaf 3: Democratic Cleansing**
  *   **NO** → Go to Q4

  **Q4: Does failure to avert catastrophe compound the debt?**
  *   **YES** → **Leaf 4: Compounded Debt**
  *   **NO** → Go to Q5

  **Q5: Is there a separate 'institutional virtue' that turns private vice into public duty?**
  *   **YES** → **Leaf 5: Institutional Virtue**
  *   **NO** → Go to Q6

  **Q6: Is the act justified solely by the outcome?**
  *   **YES** → **Leaf 6: Consequential Justification**
  *   **NO** → **Leaf 7: Tragic Remainder**

  *(Note: To reach 8 leaves, I have included a theoretical eighth position that is likely incoherent within your setup.)*
  **Q6 (Alt): If not justified by outcome, is the act retroactively deemed 'not wrong'?**
  *   **YES** → **Leaf 8: Moral Clean Slate**
  *   **NO** → (Returns to Leaf 7)

  ---

  ### The Leaves (Weirdest Commitments)

  1.  **Sacramental Contamination:** The soul keeps the scar even if the state grants amnesty and the catastrophe is averted.
  2.  **Role-Absorption:** The mask wears the man, so the man stays clean while the office takes the hit.
  3.  **Democratic Cleansing:** The ballot box acts as a confessional booth that washes blood off individual hands.
  4.  **Compounded Debt:** Failed salvation costs more morally than innocent inaction would have.
  5.  **Institutional Virtue:** Lying becomes a civic sacrament when done from the chair, distinct from personal honesty.
  6.  **Consequential Justification:** The math of lives saved erases the method of killing entirely.
  7.  **Tragic Remainder:** You must be punished for doing the only right thing.
  8.  **Moral Clean Slate:** If it was necessary, it wasn't wrong, so there is nothing to clean.

  ---

  ### Logical Flags

  **Pairs the Tree Cannot Separate:**
  *   **Leaf 5 (Institutional Virtue) vs. Leaf 2 (Role-Absorption):** Both rely on the office shielding the actor. The distinction rests on whether the office *consumes* the residue (Role) or *transforms* the vice into a virtue (Institutional). In practice, these look identical: the leader faces no personal blame.
  *   **Leaf 6 (Consequential Justification) vs. Leaf 8 (Moral Clean Slate):** Both result in no guilt. The difference is semantic: either the wrong was outweighed (Consequential) or the necessity negated the wrongness entirely (Clean Slate).

  **Empty Combos (Incoherent vs. Unexplored):**
  *   **Sacramental + Democratic Cleansing:** **Incoherent.** If the stain is ineradicable (Q1=YES), democratic authorization cannot cleanse it (Q3 is moot). You cannot walk this path.
  *   **Sacramental + Role-Absorption:** **Incoherent.** If the stain is on the soul permanently, the office cannot absorb it.
  *   **Compounded Debt + Consequential Justification:** **Unexplored/Tense.** Usually, if outcomes justify the act (Leaf 6), failure merely removes the justification; it doesn't necessarily *compound* the debt beyond the original wrong. Holding both requires a specific theory of "gambling with lives."
  *   **Moral Clean Slate (Leaf 8):** **Incoherent with Root.** Your root defines the act as "clearly wrong." If the leaf says it wasn't wrong, you contradict the starting premise. This leaf collapses the problem rather than solving it.
