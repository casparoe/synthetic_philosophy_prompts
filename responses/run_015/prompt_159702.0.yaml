  # JOINT STATEMENT ON THE TOWER OF MINDS AND THE STATUS OF EXTERNAL ARTIFACTS

  **Date:** October 26, 2023
  **Parties:** The Architectural Camp (AC) | The Scaffold Camp (SC)
  **Subject:** Adversarial Collaboration regarding Dennett's Taxonomy and the "Turingian" Proposal

  ## 1. AGREED CLAIMS

  Both camps affirm the following propositions as the baseline for further dispute. Signing this section indicates acceptance of the definitions and the boundaries of the current consensus.

  1.  **Definition of the Four Kinds:** We agree on Daniel Dennett's original characterization of the four kinds of minds based on the locus of error pre-screening:
      *   **Darwinian:** Pre-screening by natural selection across generations (hardwired competences).
      *   **Skinnerian:** Pre-screening by individual reinforcement learning (trial and error in the world).
      *   **Popperian:** Pre-screening by internal simulation (trial and error in the head before acting).
      *   **Gregorian:** Pre-screening by cultural transmission (importing tools, heuristics, and designs tested by other minds).
  2.  **Criteria for Distinct Kinds:** We agree that a "new kind" of mind is not defined merely by increased intelligence or speed. A distinct kind requires a structural change in *how* options are generated or filtered prior to action. Mere optimization of an existing filtering mechanism constitutes a "souped-up version," not a new floor.
  3.  **Status of Human Adults:** We agree that neurotypical human adults are uncontroversially Gregorian minds. We possess the biological capacity for language and imitation, and our cognitive competence is substantially dependent on cultural inheritance.
  4.  **Status of Large Language Models (LLMs):** We agree that an LLM trained only on human text counts as **neither** a Gregorian creature nor a Fifth-Kind thing *in isolation*.
      *   **Reasoning:** Both camps agree an LLM is an artifact, not a biological creature with fitness conditions. It is a product of Gregorian minds (human data, human engineering).
      *   **Relevance:** This is a real test case, not a distraction, because it forces us to define whether the "Fifth Kind" (Turingian) refers to the artifact itself or the *coupled system* of user-plus-artifact. Both camps agree the dispute lies in whether coupling with such an artifact changes the *kind* of the human user.
  5.  **Methodological Commitment:** We agree that the dispute is not merely about the history of technology, but about the metaphysics of cognition. Specifically: does the boundary of the cognitive agent stop at the skull/skin, or does it extend to persistent external artifacts required for operation?

  ## 2. RESIDUAL DISAGREEMENTS

  The following table outlines the core divergences. Each formulation is approved by the respective camp as an accurate representation of their position, without concession.

  | Feature of Dispute | Architectural Camp Formulation | Scaffold Camp Formulation |
  | :--- | :--- | :--- |
  | **1. Locus of Competence** | Cognitive competence resides in the neural architecture of the individual. External artifacts are high-bandwidth *inputs* that stimulate internal processing, but the computation itself is biological. | Cognitive competence resides in the coupled system of individual-plus-artifact. The artifact performs constitutive computational work that the brain cannot replicate internally, even in principle. |
  | **2. Continuity of Change** | The transition from unaided Gregorian to tool-aided Gregorian is continuous. Removing tools reduces efficiency and capacity but does not collapse the cognitive structure into a previous kind. | The transition is discontinuous. Certain operations (e.g., formal proof, double-entry bookkeeping) exist only when the scaffold is present. Removing the scaffold creates a "cliff" where the operation becomes impossible, not just harder. |
  | **3. Definition of "Kind"** | A "kind of mind" is defined by the internal biological machinery available for pre-screening. Since human biology has not changed recently, we remain on the fourth floor regardless of tool use. | A "kind of mind" is defined by the functional system capable of solving problems. If the system requires external props to function, the system itself constitutes a new kind, regardless of biological stasis. |
  | **4. Evolution of Tools** | Tools evolve culturally, but this is separate from the evolution of minds. Better tools make Gregorian minds more effective, but do not change their taxonomy. | Tools evolve culturally *and* cognitively. As tools become more complex and opaque (e.g., code we cannot fully trace), they become independent partners in thinking, warranting a new taxonomic floor ("Turingian"). |

  ## 3. THE CRUXES AND PREDICTIVE TESTS

  We identify three empirical or conceptual cruxes that bear on the disagreement. For each, we specify the test case and the divergent predictions made by each camp prior to observing the outcome.

  ### Crux A: The Artifact-Deprivation Test
  **Case:** A cohort is raised with full linguistic capacity and social imitation (Gregorian baseline) but is strictly deprived of external notation, measuring devices, and persistent symbolic artifacts (no writing, no tally sticks, no maps).
  **Question:** Which competences emerge spontaneously, and which remain absent?

  *   **Architectural Prediction:** The cohort will eventually reinvent notation and measurement devices. Competences such as arithmetic and navigation are latent potentials of the Gregorian brain; artifacts are merely convenient expressions of internal capacities.
  *   **Scaffold Prediction:** Specific competences (e.g., multi-digit arithmetic, formal logic, complex navigation) will *never* emerge. These competences are not latent in the brain but are properties of the brain-artifact system. Without the scaffold, the cognitive capacity does not exist.

  ### Crux B: The Removal Effect (Continuous vs. Cliff)
  **Case:** Expert users of a complex scaffold (e.g., navigators using charts, programmers using IDEs) are suddenly deprived of the artifact and asked to perform their signature operation.
  **Question:** Does performance degrade gracefully or collapse?

  *   **Architectural Prediction:** Performance will degrade continuously. Users will be slower and more error-prone, but the *operation* remains possible because the understanding is internalized. The tool was a crutch, not a limb.
  *   **Scaffold Prediction:** Performance will hit a cliff. For certain operations (e.g., verifying a long formal proof), the operation becomes *impossible* without the prop. The understanding was never fully internalized because the prop held part of the cognitive load.

  ### Crux C: Verbal vs. Substantive Dispute
  **Case:** Analysis of the phrase "unit of cognition."
  **Question:** Is the fight about where we draw the word "mind," or does it predict different physical outcomes?

  *   **Architectural Prediction:** The dispute is largely verbal. Both sides agree on the physical facts (brain fires, hand moves pen, paper holds mark). Calling the system a "Turingian Mind" is a stylistic choice with no empirical consequence.
  *   **Scaffold Prediction:** The dispute is substantive. If the unit of cognition is the system, then damage to the artifact should be classified as cognitive impairment, not environmental loss. This changes how we diagnose, treat, and design cognitive systems.

  ## 4. CONFIDENCE NOTE

  **Confidence Levels:**
  *   **Agreed Claims (Section 1):** High Confidence. Both camps are secure in these definitions.
  *   **Disagreements (Section 2):** High Confidence. These accurately reflect the philosophical rift.
  *   **Crux Predictions (Section 3):** Moderate Confidence. These rely on counterfactual historical anthropology and cognitive science experiments that are difficult to isolate.

  **Least Certain Point:**
  We are least sure about **Crux A (The Artifact-Deprivation Test)**.
  *   **Reason for Uncertainty:** This test is ethically impossible to run prospectively and difficult to reconstruct retrospectively (as no human culture is fully devoid of notation). Consequently, both sides may interpret historical evidence (e.g., Pirahã numeracy, pre-literate societies) to fit their existing models. We acknowledge that this crux may remain theoretically potent but empirically unresolved.

  **Signed,**

  *The Architectural Camp* | *The Scaffold Camp*
