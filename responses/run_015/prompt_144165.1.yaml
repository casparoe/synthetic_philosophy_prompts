answer: |-
  **Term Paper Proposal**

  **Title:** Positional Fittingness vs. Moral Desert: A Conceptual Analysis of Karma Through Fission and Transfer Cases

  **Course:** Seminar on Desert and Moral Responsibility
  **Student:** [Your Name]
  **Date:** [Date]

  ### 1. Research Question

  Standard retributive theories of moral desert rely on three convergent assumptions: (1) the recipient of suffering must be numerically identical to the wrongdoer; (2) the suffering must be apportioned by an agent with the standing to punish; and (3) the suffering is justified backward-looks, regardless of future utility. In contrast, karmic theories are often treated as a species of moral desert, yet they frequently relax or reject these assumptions. This paper addresses the following question: **Does a system of karmic retribution that lacks an apportioning agent and relaxes strict identity conditions constitute a theory of moral desert, or does it constitute a distinct metaphysical category of "positional fittingness"?**

  To answer this, I will test the concept of karma against two boundary cases: *fission* (where a karmic stream divides between two successors) and *transfer* (where karmic merit is alienable to another stream). If karma survives these tests as a theory of desert, it requires a radical redefinition of desert. If it fails, it is better understood as a naturalistic metaphysics of fitting consequences that generates no normative reasons for agents to inflict suffering.

  ### 2. Background and Problem Statement

  In contemporary analytic philosophy, moral desert is typically understood as a normative relation between an agent's past conduct and a subsequent treatment, such that the treatment is intrinsically appropriate and often provides a reason for a relevant authority to bring it about. In religious studies and comparative philosophy, karma is frequently glossed as "moral cause and effect" or "Eastern retributivism." This gloss creates a category error.

  The problem arises because treatments of karma often run together three distinct threads that need separation:
  1.  **Identity:** Whose suffering is at issue? Is it the same agent, or merely a causally and psychologically continuous stream of mental events?
  2.  **Agency:** Is the suffering apportioned by a being with standing (a judge, a god), or does it befall the stream as a natural outgrowth of action?
  3.  **Function:** Is the fittingness of the suffering backward-looking (retributive) or forward-looking (pedagogic/steering)?

  Two prevailing interpretations leave this tension unresolved. The **Retributivist Reading** forces karma into Western desert frameworks, ignoring the lack of a punishing agent and the fluidity of personal identity. The **No-Self Reading** emphasizes the metaphysical continuity of streams but often fails to explain why this continuity carries *moral* weight rather than merely causal weight. Both readings leave open the possibility that karma is not about *deserving* suffering in a moral sense, but rather about suffering *fitting* a position in a causal sequence.

  This paper argues that once the three threads above are prised apart using the fission and transfer cases, karma looks less like desert and more like **positional fittingness**. On this view, it is fitting that wrongdoing be followed by suffering within the same causal stream, but no agent thereby has a reason to bring that suffering about, and the "recipient" need not be a person in the strict sense. The paper will determine whether a notion of desert that generates no reasons for action and does not require strict identity is still desert at all, or merely a metaphor wearing desert's clothes.

  ### 3. Methodology

  This project will employ conceptual analysis rather than historical exegesis. While the concepts are drawn from South Asian philosophical traditions, the goal is not to reconstruct the specific view of any single school (e.g., Yogācāra, Nyāya, or Theravāda Abhidharma) but to test the logical coherence of the *concept* of karma when subjected to the rigorous constraints of desert theory.

  **Why this method?**
  Working through traditional commentaries would require resolving philological disputes and reconciling contradictory textual authorities, which is beyond the scope of a 5,000-word paper and risks obscuring the normative question. By treating karma as a philosophical model subject to thought experiments (fission and transfer), I can isolate the necessary conditions for moral desert. This allows me to engage with the seminar's core theme (desert) without getting bogged down in the history of ideas. The method involves:
  1.  Defining the necessary conditions of standard moral desert.
  2.  Modeling the karmic mechanism as a variable system.
  3.  Applying the test cases to see which conditions break.
  4.  Proposing "positional fittingness" as the explanatory alternative if desert conditions fail.

  ### 4. Work Plan (12-Week Semester)

  **Phase 1: Conceptual Mapping (Weeks 1–3)**
  *   **Week 1:** Finalize definitions of "moral desert" based on seminar readings. Distinguish between *normative desert* (provides reasons for action) and *metaphysical desert* (intrinsic fittingness).
  *   **Week 2:** Map the three threads of karma (Identity, Agency, Function) against the standard desert definition. Draft the distinction between "person-based" and "stream-based" continuity.
  *   **Week 3:** Refine the definition of "positional fittingness." Ensure this concept is distinct from simple causality and distinct from retributivism.
  *   *Deliverable:* A 2-page concept memo outlining the definitions to be used.

  **Phase 2: The Test Cases (Weeks 4–6)**
  *   **Week 4:** Develop the **Fission Case**. If a karmic stream divides (e.g., via teletransportation or metaphysical splitting), does the demerit split, double, or lapse? Analyze what each outcome implies for desert.
  *   **Week 5:** Develop the **Transfer Case**. Analyze the dedication of merit. If merit is alienable, can it be "deserved"? If it is deserved, can it be transferred? Resolve the tension.
  *   **Week 6:** Draft the core argument section (approx. 2,000 words). Show how standard desert theory cannot accommodate the outcomes of these cases without contradiction.
  *   *Deliverable:* First draft of the central argument section.

  **Phase 3: Synthesis and Implications (Weeks 7–9)**
  *   **Week 7:** Argue for the "Positional Fittingness" hypothesis. Explain how this view accommodates the test cases better than the desert view.
  *   **Week 8:** Address counterarguments. Specifically, address the objection that positional fittingness is too weak to support moral practice (i.e., if no one has a reason to inflict the suffering, is the theory practically inert?).
  *   **Week 9:** Complete the full first draft (approx. 4,500 words).
  *   *Deliverable:* Complete first draft.

  **Phase 4: Revision and Polishing (Weeks 10–12)**
  *   **Week 10:** Peer review or writing center consultation. Focus on clarity of the "positional fittingness" distinction.
  *   **Week 11:** Revise for flow and argument strength. Ensure the introduction precisely states the determinate question.
  *   **Week 12:** Final proofreading, citation formatting, and submission.
  *   *Deliverable:* Final 5,000-word paper.

  ### 5. Possible Conclusions and Deciding Factors

  The paper will aim for a determinate conclusion, though three outcomes are possible:

  1.  **Karma is a Species of Desert (The Revisionist View):**
      *   *Conclusion:* We must expand the definition of desert to include agent-neutral mechanisms and stream-based identity.
      *   *Deciding Factor:* This will be accepted only if "desert" retains its normative force (i.e., it still tells us something about what *ought* to happen) without an agent to enforce it. If the normative force vanishes, this conclusion fails.

  2.  **Karma is Not Desert (The Naturalist View):**
      *   *Conclusion:* Karma is purely causal. The language of "fruit" or "retribution" is metaphorical.
      *   *Deciding Factor:* This will be accepted if the test cases show that karmic outcomes function exactly like physical consequences (e.g., touching fire burns you) rather than moral sanctions. However, this risks ignoring the specific *moral* quality of karmic cause (intention).

  3.  **Karma is Positional Fittingness (The Hybrid View):**
      *   *Conclusion:* Karma is a sui generis category. It is normative but not agent-relative; it is fitting but not retributive.
      *   *Deciding Factor:* This is the working hypothesis. It will be confirmed if it explains the Fission and Transfer cases without contradiction *and* preserves the intuition that there is something "unfitting" about a wrongdoer escaping suffering, even if no one is to blame for inflicting it.

  ### 6. Risk Assessment and Scope Limitations

  **Potential Failure Points:**
  *   **Metaphysical Quagmire:** The "Fission" case relies on a specific metaphysics of personal identity. If the paper gets bogged down in defending the possibility of fission rather than its implications for desert, the argument will stall. *Mitigation:* I will stipulate the metaphysical possibility of fission for the sake of argument, focusing only on the normative implications.
  *   **Definitional Drift:** The term "positional fittingness" is neologistic. There is a risk that it becomes a catch-all for "things that aren't desert." *Mitigation:* I will define it negatively (what it is not) and positively (its structural relation to causal streams) in Week 3.
  *   **Cultural Reductionism:** There is a risk of distorting Asian philosophical concepts to fit Western analytic categories. *Mitigation:* I will explicitly state in the introduction that this is a conceptual reconstruction, not a historical claim about what all Buddhist or Hindu thinkers believe.

  **Scope Limitations:**
  *   **Soteriology:** I will not address the ultimate soteriological goal of karma (liberation/nirvana). The paper is limited to the retributive/distributive mechanics of karma within samsara.
  *   **Specific Traditions:** I will not attempt to reconcile differences between Buddhist and Hindu accounts of karma. I will treat "karma" as a generic philosophical model with variable parameters.
  *   **Forward-Looking Justification:** While I will touch on the instructional function of karma, I will not fully develop a utilitarian defense of karma. The focus remains on the backward-looking claim of fittingness.

  **Ambition Check:**
  A 5,000-word limit is tight for this scope. If the Fission and Transfer arguments prove too dense, I will prioritize the Fission case as the primary driver of the identity argument and treat Transfer as a supporting argument regarding alienability. If the "positional fittingness" concept proves too complex to defend fully, I will scale back to demonstrating that karma *fails* the desert criteria, leaving the positive categorization as a suggestion for future work. However, the current plan assumes the positive categorization is necessary to explain why karma feels morally significant even if it isn't desert.

  ### 7. Preliminary Bibliography Strategy

  (Note: Specific citations will be added by the student. The following describes the *types* of sources to be consulted.)

  *   **Analytic Desert Theory:** Sources defining the conditions of moral desert, specifically focusing on the "agency condition" (must a deserter be an agent?) and the "identity condition" (must the recipient be the same person?).
  *   **Personal Identity:** Sources discussing fission, psychological continuity, and the "no-self" theory as it pertains to moral responsibility.
  *   **Comparative Philosophy:** Sources that analyze karma through an analytic lens, specifically those that distinguish between causal naturalism and moral retributivism in South Asian thought.
  *   **Ethics of Transfer:** Sources discussing the alienability of moral credit or debt (e.g., vicarious punishment, merit transfer).

  ### 8. Statement of Contribution

  This paper contributes to the seminar theme by challenging the assumption that all backward-looking moral appropriateness constitutes "desert." By isolating the agency and identity conditions, it proposes that our intuitive landscape of responsibility includes a category of *impersonal fittingness* that is often overlooked in Western retributive frameworks. This clarifies not only the concept of karma but also the boundaries of desert theory itself.
