prompt: |-
  I've been discussin with my mates whether history is actually locked in — like, if you rewound the tape would the same outcomes arrive anyway regardless of tiny differences — and one of them kept using path dependence to argue that we shouldn't bother with policy changes since everything converges eventually. I think that's a misreading, but I want a satire that lives inside the mistake rather than just pointing at it from outside, and I need it to be specific enough that a model can't just regurgitate a generic "government bureaucracy is absurd" sketch.

  Could you write me a deadpan parody of an internal government white paper, around 600 words, issued by a fictional "Department of Historical Convergence". The report should propose scaling back education and healthcare funding on the grounds that every social trajectory scores highly on a made-up metric called the "counterfactual viscosity index" (CVI), which measures how resistant an outcome is to branching timelines. The voice should be dry, bureaucratic, and utterly straight-faced; include a fake reference to "Figure 3: CVI ratings for democratic transitions" and a clause denying "branching exemptions" to citizens who attempt career changes. The satire should exaggerate the real feature of path dependence — that early small differences can amplify — but twist it into a claim about metaphysical inevitablity, so a specialist sees the error but a general reader feels the absurdity. Don't cite real scholars or texts; keep all references internal to the ministry. At the end, add a brief note saying where the piece takes liberties with the philosophical debate (for instance, whether it unfairly conflates causal lock-in with destiny) and what kind of argument or evidence would change your mind about whether the satire is fair or just straw-manning.
