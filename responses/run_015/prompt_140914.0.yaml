answer: |-
  There is no single, universally standardized noun for exactly this phenomenon, though it is well-recognized in oral history, trauma studies, and transitional justice. Because you are working in a truth-and-reconciliation context, you are standing exactly at the intersection where existing terminology gets fuzzy.

  Here are the two nearest established concepts, why they don't quite fit, and then the coinage you asked for.

  ### The Nearest Existing Concepts

  **1. Narrative Truth (Psychology/Oral History)**
  *   **What it is:** Coined by psychoanalyst Donald Spence. It distinguishes between "historical truth" (what objectively happened) and "narrative truth" (what feels coherent, meaningful, and explanatory to the teller).
  *   **Why it's not it:** It is primarily individual and therapeutic. It explains why a *person* clings to a story for internal coherence. Your pattern is *communal* and *political*. The community isn't seeking internal coherence; they are seeking to preserve evidence of a structural harm that the documents hide. Narrative truth implies the error is about *meaning*; your pattern suggests the error is about *evidence*.

  **2. Social Truth (Transitional Justice/TRC Framework)**
  *   **What it is:** Explicitly defined in the South African Truth and Reconciliation Commission. They distinguished "Factual Truth" (forensic, checkable) from "Social Truth" (what the community accepts as their shared experience).
  *   **Why it's not it:** This is the closest fit for your context. However, "Social Truth" is often treated as a *category* of truth to be respected alongside facts, not as a description of *how* the error functions. It doesn't explain the mechanism you noticed: that the *inaccuracy itself* is doing the work of pointing to the archive's bias. "Social Truth" validates the story; it doesn't explain why the *wrong date* is the vehicle for the truth.

  ### The Coinage: **Structural Veracity**

  If the existing terms don't capture the "load-bearing error," call it **Structural Veracity**.

  **Definition:** A communal memory is structurally veracious when its factual inaccuracies are not random noise, but systematic displacements that accurately map the power dynamics, silences, or violence of the record-keeping authority. The statement is false about the *event*, but true about the *structure* that obscured the event.

  **Why this fits your examples:**
  *   **The Village Example:** The memory is factually false (wrong year, wrong count). But it is structurally veracious because it correctly identifies that the state removed a generation of men. The "error" (stitching three events into one) accurately reflects the community's experience of the state: the state was a continuous, undifferentiated pressure, not a series of discrete bureaucratic events. The memory compresses time because the *impact* was continuous.
  *   **The Square Example:** The memory is factually false (not shot, not in square). But it is structurally veracious because it correctly identifies that the death was public, political, and meant to be seen. Hiding it in a prison register was the lie; putting it in the square is the structural truth of how power was exercised.

  ### Distinguishing It From the Imposters

  You asked how to separate this from myth, denialism, and degradation. Here is the boundary work:

  **1. Vs. Myth-Making**
  *   **Myth:** Creates an origin story or identity. It tends toward the timeless or archetypal.
  *   **Structural Veracity:** Anchored in specific grievance. It is not trying to say "we are a brave people"; it is trying to say "they did this to us."
  *   **The Test:** If you remove the antagonist (the state/soldiers), does the story still hold? A myth survives without the enemy (e.g., "We founded this valley"). Structurally veracious memory collapses without the enemy (e.g., "Men were taken").

  **2. Vs. Denialism**
  *   **Denialism:** Uses falsehood to *absolve* power or hide harm. (e.g., "No one died.")
  *   **Structural Veracity:** Uses falsehood to *accuse* power or reveal harm. (e.g., "Forty died" when actually thirty-eight disappeared.)
  *   **The Test:** Who benefits from the error? If the error makes the state look cleaner, it's denialism. If the error makes the state's violence more visible (even if exaggerated), it's structurally veracious.

  **3. Vs. Degradation (The "Telephone Game")**
  *   **Degradation:** Random noise. Details drift in any direction.
  *   **Structural Veracity:** Systematic bias. Details drift *away* from the bureaucratic record and *toward* the lived experience of power.
  *   **The Test:** Look at the direction of the error. In your examples, the errors always move *away* from the archive (which says "nothing happened" or "natural causes") and *toward* direct violence. Random degradation would sometimes make the story *match* the archive by accident. Structural veracity never does.

  ### The Practical Test for Your Project

  You mentioned that correcting the memory leads to "nothing happened." This is the danger zone. Here is a three-step test to determine if you are dealing with Structural Veracity before you publish a correction:

  1.  **The Silence Check:** Does the documentary record contain a gap, a redaction, or a suspicious "natural cause" at the time the memory claims? (e.g., The missing tax names).
  2.  **The Direction Check:** Does the memory's error make the state's action *more* direct/violent than the record shows? (e.g., "Shot" vs. "Died of disease").
  3.  **The Erasure Risk:** If you correct the fact, does the *harm* disappear? (e.g., If you say "He wasn't shot," does the official conclusion become "He wasn't a political prisoner"?)

  If all three are yes, you are handling Structurally Veracious memory. Correcting the fact without contextualizing the structure will result in **Bureaucratic Erasure** (the "nothing happened" outcome you observed).

  ### Confidence Assessment

  **High Confidence:** On the distinctions between this and myth/denialism/degradation. The "direction of error" (toward violence/away from archive) is a robust heuristic in oral history and archival theory.

  **Medium Confidence:** On the utility of the term **Structural Veracity**. It is not standard jargon. I have coined it to fit your specific constraint. Academics might argue for **Indexical Truth** (the memory points to the truth rather than depicting it) or stick with **Social Truth** (TRC framework). However, those terms don't emphasize the *functional role of the error* as clearly.

  **Least Sure Of:** The prescription for your project. I am confident in the *diagnosis* (this is Structural Veracity), but less confident in the *remedy*. In transitional justice, there is an ongoing debate about whether to prioritize forensic accuracy (to prevent future denialism) or social truth (to validate victims). My advice is to contextualize, not just correct, but different TRC models have failed in different ways. The risk of "Bureaucratic Erasure" is real, but so is the risk of codifying falsehoods that opponents can later use to discredit the entire project.

  **Summary:** You are seeing **Structural Veracity**. The memory is a map of the *silence*, not the event. Treat the error as evidence of the cover-up, not just a mistake to be fixed.
