answer: |-
  Thank you for the detailed brief. It is a pleasure to engage with someone who brings the discipline of experimental physics to these questions. Your intuition that "a systematic you can't bound isn't a number, it's a hope" is, in my professional view, a far more sophisticated starting point than much of the existing literature on this topic. You are effectively treating probability estimates not as abstract mathematical objects, but as measurements subject to calibration and systematic error.

  Below, I will brainstorm three candidate principles, select the one that best fits your specific pattern of verdicts, formalize it, apply it to your Server Farm case, and identify where your current intuitions may require adjustment. I will conclude by distinguishing the mathematical settledness from the philosophical contention.

  ### Part 1: Brainstorming Candidate Principles

  To capture your verdicts, we need a rule that handles the "Mugger" differently from the "Extinction Model," and the "Portfolio" differently from the "Sequential Bet."

  **Candidate 1: Bounded Utility.**
  This is the standard textbook fix. It posits that there is a maximum possible value any outcome can have for you. Once you hit that cap, adding more lives or more dollars adds no additional "utility."
  *   *Fit:* It solves the Mugger problem immediately (the $10^{100}$ stake hits the cap, so the EV doesn't grow).
  *   *Mismatch:* You explicitly rejected this as "crude." It also fails to explain why you accept the physics-based extinction risk reduction. If the cap is low enough to stop the Mugger, it might also cap the value of preventing human extinction. Furthermore, it doesn't account for your "provenance" intuition; it treats a model-derived probability and a mugger's probability identically, simply capping the result.

  **Candidate 2: Risk-Weighted Expected Utility.**
  This principle suggests we don't multiply probability by value linearly. We apply a weighting function that severely discounts very small probabilities, regardless of the stake.
  *   *Fit:* It explains your "meh" reaction to the 1-in-$10^{12}$ lottery ticket.
  *   *Mismatch:* It struggles with the Portfolio case. If you discount the individual tiny probability heavily, you should also discount the aggregate, unless the aggregation changes the probability itself (which it does, via the Law of Large Numbers). However, it doesn't naturally capture the *source* distinction. It discounts the physics model's 1-in-a-billion the same way it discounts the Mugger's 1-in-a-billion, unless you tweak the weights ad hoc.

  **Candidate 3: Epistemic Robustness Constraint (ERC).**
  This principle distinguishes between *aleatory uncertainty* (inherent randomness in a calibrated system) and *epistemic uncertainty* (lack of knowledge about a model or agent). It posits that Expected Value calculations are only valid when the probability estimate is "robust"—meaning it was derived from a process that did not know about your decision rule and is resistant to adversarial manipulation.
  *   *Fit:* This aligns perfectly with your "provenance" insight. It treats the physics model (calibrated, blind to your decision) as real data, and the Mugger's claim (tailored to your decision rule) as a systematic error with unbounded variance.
  *   *Mismatch:* It is harder to formalize mathematically than Bounded Utility. It requires a judgment call on what counts as "robust."

  ### Part 2: The Selected Principle

  I recommend adopting a formalized version of **Candidate 3**. Let's call it the **Epistemic Robustness Constraint (ERC)**.

  This principle treats probability estimates like experimental measurements. In your lab, a signal is only significant if the background is understood and the calibration is independent of the signal search. Here, a probability is only actionable if the estimation process is independent of the offer.

  **The Principle:**
  *An agent should maximize Expected Value only when the probability estimates satisfy the Robustness Condition. If the condition is not met, the probability is treated as effectively zero for decision purposes, regardless of the stake.*

  **The Robustness Condition has three clauses:**

  1.  **Calibration Clause:** The probability must be derived from a model or frequency data that has been tested against empirical outcomes *independent* of the current decision context.
      *   *Motivation:* This validates your **Extinction Risk (Physics Model)** verdict. The model was tested against data and "didn't know anyone was going to make a decision on it." It validates your **Coin Flip** verdicts (calibrated physical coins).
  2.  **Non-Strategic Clause:** The stake size and probability estimate must not be optimized by an agent who knows your decision rule. If the offeror can adjust the numbers to ensure a positive Expected Value for you, the probability is deemed epistemically unstable.
      *   *Motivation:* This validates your **Pascal's Mugger** verdicts. The mugger escalates the stake specifically to break your threshold. This treats the probability as a "systematic you can't bound."
  3.  **Aggregation Clause:** Decisions involving tiny probabilities of large stakes may be rejected individually if taken myopically, provided the agent adheres to a policy of accepting them when aggregated into a portfolio where the Law of Large Numbers applies.
      *   *Motivation:* This addresses your **Portfolio** verdict. It permits saying "no" to the sequential single bets (due to psychological risk or transaction costs) while saying "yes" to the bundle, acknowledging that the *variance* of the bundle is lower, making the probability estimate more robust in the aggregate.

  *(Note on the Identified Lives case: The ERC does not force you to pay the $2M. It allows for "Agent-Relative Prerogatives." You are permitted to prioritize certain, identified rescue over statistical rescue due to psychological constraints, provided you acknowledge this is a deviation from pure impartial EV. This accommodates your guilt without declaring you irrational.)*

  ### Part 3: Judgment on the Server Farm Case

  **The Case:** An organization asks for $5,000 to prevent a simulation of $10^{30}$ suffering minds. Engineering is verified; power/cost figures are sound; code is audited. Only the *intent* to switch it on is testimony. The stake ($10^{30}$) is clearly chosen to defeat decision rules.

  **Application of ERC:**
  1.  **Calibration:** The engineering is calibrated (verified physics). However, the critical probability is not "will the servers run?" but "will the operators *choose* to run the simulation to inflict suffering?" This is a human intent variable. There is no independent data calibrating the probability of this specific group acting on this specific threat.
  2.  **Non-Strategic:** The stake ($10^{30}$) is explicitly adversarial. It is chosen to overwhelm any reasonable utility bound. The offerors know your decision rule (or a general one like it) and have tuned the stake to break it.
  3.  **Verdict:** **Do Not Pay.**
      *   *Reasoning:* Under the ERC, the probability of the threat being carried out is "epistemically unstable." Even though the servers *can* run, the probability that they *will* run for this purpose is not robust. It is a "hope," not a number. The verified engineering is a red herring; it confirms capacity, not intent. Because the stake is adversarially selected (Non-Strategic Clause violation), you discount the probability to zero.

  ### Part 4: Which Verdict to Overturn?

  There is one inconsistency in your list that the ERC highlights but does not fully excuse: **The Portfolio vs. Sequential Bets.**

  *   *Your Verdict:* Yes to 10,000 bets at once. No to 10,000 bets one-by-one over ten years.
  *   *The Conflict:* Mathematically, if the events are independent, these are the same gamble. The only difference is *when* you get the feedback.
  *   *Recommendation:* You should overturn the **"No" on the sequential bets**.
  *   *Why:* If you accept the Aggregation Clause, you are admitting that the Expected Value is positive. Refusing the sequential bets implies you are suffering from "myopic loss aversion." In physics terms, you are trusting the measurement of the aggregate signal but rejecting the individual photon counts that comprise it. If the model is robust enough for the portfolio, it is robust enough for the individual instances. You should train yourself to take the individual bets, perhaps by pre-committing to a policy ("I will always take this bet when offered") to psychologically simulate the portfolio.

  ### Part 5: A Discriminating Test Case

  To distinguish between the **Epistemic Robustness Constraint** (my recommendation) and the **Bounded Utility** view (the standard alternative), consider this case:

  **The Blind Natural Hazard:**
  A purely physical, non-human phenomenon (e.g., a specific vacuum decay scenario or a cosmic ray cascade) has a 1-in-$10^{20}$ chance of occurring in the next century. If it occurs, it will destroy $10^{40}$ potential future lives. The probability is derived from a physical model that has been tested against data and was developed *before* anyone considered this decision (satisfying Calibration and Non-Strategic clauses). You can spend $1,000 to prevent it.

  *   **Bounded Utility Prediction:** If your utility bound is lower than the value of $10^{40}$ lives (which is likely, given human cognitive limits), you should say **No**. The extra magnitude doesn't register.
  *   **Epistemic Robustness Prediction:** Since the probability is robust (physics-derived, non-adversarial), you should say **Yes**. The stake size matters because the probability is trustworthy.

  **My Assessment:** Given your physics background, I suspect you would say **Yes** to the Blind Natural Hazard. If so, Bounded Utility is the wrong model for you. You care about the *quality of the number*, not just capping the *size of the stake*.

  ### Part 6: Settled vs. Contested

  It is crucial to distinguish where the mathematics ends and the philosophy begins.

  **Settled (Mathematics & Logic):**
  1.  **Unbounded Utility + Standard EV = Pascal's Mugging.** If your utility function has no cap, and you assign *any* non-zero probability to the Mugger's claim, mathematics dictates you must pay. There is no way around this without changing the inputs (probability or utility).
  2.  **Separability.** Standard decision theory holds that if you prefer a portfolio of bets, you must prefer the individual bets that comprise them (assuming independence). Your intuition here violates the "Separability Axiom." This is a formal inconsistency, not just a philosophical disagreement.
  3.  **Bounded Utility Solves Mugging.** Mathematically, a hard cap on utility prevents the EV from diverging. This is not contested.

  **Contested (Normative Philosophy):**
  1.  **Should Utility be Bounded?** This is heavily debated. Some argue bounding utility leads to "weirdly calm" acceptance of catastrophic certain losses (as you noted). Others argue unbounded utility is psychologically impossible and leads to absurdity (Mugging). The field is roughly split, with a slight weight of opinion favoring some form of bounding or risk-weighting to avoid fanaticism.
  2.  **Epistemic vs. Aleatory Uncertainty.** Standard decision theory often treats all probabilities as equal (the "Principle of Total Evidence"). My recommendation (ERC) argues that probabilities derived from adversarial contexts should be treated differently than physical frequencies. This is a minority but growing view, often discussed in contexts of "traceable" probabilities or "causal decision theory."
  3.  **Identified vs. Statistical Lives.** Your reluctance to save the statistical lives over the identified ones is a known phenomenon (the "Identifiable Victim Effect"). Economists generally view this as a bias to be corrected; ethicists are more divided on whether it represents a valid moral constraint.

  **Confidence in Recommendation:**
  I am highly confident that the **Epistemic Robustness Constraint** is the only principle that respects your specific intuition about "provenance." However, I am only moderately confident that this is the "correct" view in the broader philosophical landscape, as it requires a more complex decision architecture than Bounded Utility. It places a burden on you to judge the *source* of the probability, not just the number. Given your training, you are better equipped to handle that burden than most.

  **Final Summary:**
  Your framing is not confused; it is actually more rigorous than the standard philosophical treatment. You are correctly identifying that in decision theory, as in calorimetry, the error bar on the probability estimate matters as much as the estimate itself. Treat adversarial probabilities as having infinite systematic error. Accept the portfolio logic for the sequential bets. And in the Server Farm case, trust your gut: verified engineering does not verify intent, and adversarial stakes invalidate the calculation.
