  ```markdown
  # DECISION TREE: COMMITMENTS ON FUTURE SUFFERING & LONGTERMISM

  **START:** We agree that future technologically created minds (digital, simulated, or engineered) are at least *possible*.

  ### Q1. MORAL STATUS
  **Case:** *A proposal to use insect brain-emulations for agricultural pest control.*
  If these emulations possess aversive signals functionally identical to pain, do they warrant direct moral consideration?
  *   **NO** → **STANCE: SKEPTIC / NON-REALIST** (Leaf 5)
      *   *Diagnosis:* Denies the coherence of moral status for non-biological substrates; rejects the framing's foundational premise.
  *   **YES** → Go to Q2.

  ### Q2. POPULATION SCOPE
  **Case:** *A future civilization with 10^20 minds vs. one with 10^10 minds.*
  Does the sheer number of future minds amplify the moral importance of that future, assuming average welfare is constant?
  *   **NO** → **STANCE: SKEPTIC / AVERAGE-UTILITARIAN** (Leaf 5)
      *   *Diagnosis:* Rejects the "astronomical" scale of s-risks; treats longtermist framing as decision-irrelevant.
  *   **YES** → Go to Q3.

  ### Q3. AXIOLOGY (SUFFERING PRIORITY)
  **Case:** *A proposal to pause large training runs that rely on punishment-like signals.*
  Is preventing severe suffering lexically (or strongly) more important than creating equivalent amounts of happiness or knowledge?
  *   **NO** (Happiness/Happiness+Suffering count) → Go to Q4.
  *   **YES** (Suffering is primary) → Go to Q5.

  ### Q4. LONGTERMIST VIABILITY (WELFARE PATH)
  **Case:** *Choice between funding a far-future governance project vs. a present-day shrimp-welfare campaign.*
  Given uncertainty, are far-future interventions sufficiently tractable to outweigh near-term certain welfare gains?
  *   **NO** → **STANCE: NEAR-TERM WELFARIST** (Empty Leaf)
      *   *Diagnosis:* Rare in this group; implies high discounting of future welfare despite accepting population scope.
  *   **YES** → Go to Q6.

  ### Q5. LONGTERMIST VIABILITY (SUFFERING PATH)
  **Case:** *Choice between funding a far-future governance project vs. a present-day shrimp-welfare campaign.*
  Is the risk of astronomical suffering sufficiently likely and tractable to outweigh near-term certain welfare gains?
  *   **NO** → **STANCE: NEAR-TERM SUFFERING-FOCUSED** (Leaf 3)
      *   *Rationale:* Accepts s-risk logic but rejects epistemic confidence in long-term intervention.
  *   **YES** → Go to Q6.

  ### Q6. TECHNOLOGICAL OPTIMISM
  **Case:** *A projection that future abundance will automate care and dissolve conflict.*
  Will standard technological/economic progress naturally minimize suffering without specific s-risk targeted intervention?
  *   **YES** → **STANCE: TECHNOLOGY-LED OPTIMIST** (Leaf 4)
      *   *Rationale:* Believes the problem is solved by growth; specific s-risk work is redundant.
  *   **NO** → Go to Q7.

  ### Q7. SURVIVAL TRADE-OFF
  **Case:** *Supporting an AI survival project that slightly increases the risk of malicious lock-in.*
  Would you prioritize reducing s-risk even if it slightly reduces the probability of humanity's long-term survival?
  *   **NO** (Survival First) → **STANCE: BROAD IMPARTIAL WELFARIST** (Leaf 2)
      *   *Rationale:* Treats s-risk as one major consideration among others (existence, flourishing, happiness).
  *   **YES** (S-Risk First) → **STANCE: DEDICATED S-RISK MINIMIZER** (Leaf 1)
      *   *Rationale:* Prioritizes avoiding astronomical suffering even at cost to other longtermist goals.

  ---

  ### LIMITATIONS & NOTES
  1.  **Threshold Ambiguity:** The tree cannot cleanly separate *Broad Welfarists* from *Dedicated S-Risk Minimizers* without quantitative thresholds on "lexical priority."
  2.  **Empty Leaves:** The "Near-Term Welfarist" leaf is theoretically possible but rarely held by participants who accept Population Scope (Q2).
  3.  **Coherence Check:** Answering YES to Q1/Q2 but NO to Q4/Q5 implies a belief that future minds matter but cannot be helped, which may reflect pessimism rather than incoherence.
  ```
