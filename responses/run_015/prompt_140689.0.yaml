prompt: |-
  I'm on a hiring committee in a physics department right now, and I keep hearing the word "fundamental" used as if it settled an argument. It happened twice in one week. First we passed on a condensed-matter candidate — genuinely strong record, great letters — because a senior colleague said her work was "phenomenology, not fundamental physics." Then at the next meeting the same colleague argued for a string theory hire on the grounds that the Standard Model obviously isn't fundamental, since it's just an effective field theory, so there has to be something deeper underneath it. I did some philosophy as an undergrad and vaguely remember words like grounding and fundamentality, and now I can't work out what any of this presupposes.

  So: what view of fundamentality does this kind of practice actually presuppose — physics departments and funders sorting particle physics and cosmology into "fundamental" buckets while condensed matter, materials and biophysics get labelled "applied," and philosophers doing the same thing when they call their work "fundamental metaphysics" and assume mental and social facts are grounded in physical ones rather than the reverse?

  As far as I can tell the word is doing at least four different jobs in these meetings, and they come apart: (1) smallest length scale; (2) maximal generality — the theory that quantifies over everything, with no domain restrictions; (3) brute, i.e. not itself explained by anything else, the thing everything else is "nothing over and above"; (4) the level from which the rest could in principle be derived. My problem is that these don't obviously cohere, and I can't tell whether the practice needs any of them or whether it's compatible with several, or with none.

  One more wrinkle. A philosopher friend mumbled something at dinner that I half understood: that grounding might not be well-founded at all — maybe the dependence relations descend forever, or levels form a partial order with lots of incomparable peaks rather than a single tidy tower, so "the fundamental layer" fails to refer. If that's right, what happens to a hiring and funding practice that silently assumes one well-ordered tower with a bottom?

  Reconstruct the implicit theory for me, and separate the parts the practice strictly presupposes from the parts it merely sits comfortably with. Tell me whether a purely pragmatic story — prestige, expected value of information, path dependence, what's cheap to test right now — could license exactly the same behavior, in which case all the metaphysics is decoration. And be concrete about what would change if we swapped in each reading: my guess is that under the brute/unexplained reading you'd fund whatever is currently unexplained, which would move money to the measurement problem and away from new particles, and that under the derivability reading you'd have to cash out "in principle" and deal with the fact that most macroscopic phenomena seem decoupled from the microscopic details — but I want that spelled out properly, including where my own stab at a criterion (F is more fundamental than G if you have to hold F fixed to explain G but not vice versa) is circular or useless.

  Also please say something about the bit that puzzles me most: quantum foundations gets funded under the fundamental heading, despite positing no new scale and no new entities, so fundamentality there seems to mean something like maximal generality — a totally different thing again — and meanwhile nobody in these meetings means "most certain" by "fundamental," since it's usually the most speculative work that gets the label.

  Don't give me a reading list; my internet is basically dead this week. I want the argument, and I want to know which commitments are genuinely load-bearing and which are just vibes with a philosophy department stamp on them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A member of a physics department hiring committee. Philosophically literate (undergrad philosophy background), observant, skeptical of jargon, frustrated by inconsistent usage of "fundamental" in hiring/funding decisions.
      *   **Context:** Hiring committee meetings. Tension between Condensed Matter (CM) vs. High Energy Physics (HEP)/String Theory. Specific anecdote: CM candidate rejected as "phenomenology," String candidate accepted because SM isn't "fundamental."
      *   **Core Question:** What view of fundamentality does this practice *actually* presuppose? Distinguish load-bearing commitments from "vibes." Can a pragmatic story explain the behavior without the metaphysics? What changes if we swap definitions?
      *   **Specific Constraints:** No reading lists (internet dead). Wants the argument. Needs concrete analysis of the four identified meanings (scale, generality, bruteness, derivability). Needs to address the "well-foundedness" worry (infinite descent/no bottom). Needs to address Quantum Foundations (QF) anomaly (fundamental but no new scale/entities).
      *   **Tone:** Analytical, precise, respectful of the user's intelligence, slightly critical of the institutional practice but charitable to the underlying logic (or lack thereof).

  2.  **Deconstruct the "Fundamental" Label in Physics Hiring:**
      *   *Observation:* The term is used normatively (to prioritize) rather than descriptively (to classify).
      *   *The Four Meanings:*
          1.  Smallest Scale (Microphysical).
          2.  Maximal Generality (Universal scope).
          3.  Bruteness (Unexplained explainer).
          4.  Derivability (Everything else follows from this).
      *   *The Tension:* These often come apart. E.g., Hydrodynamics is general but not microscopic. String theory is microscopic and general but not empirically established (bruteness unclear). CM is derivable (in principle) but autonomous (in practice).

  3.  **Evaluate the Implicit Theory (The "Tower" Model):**
      *   The committee acts as if there is a *Layer Cake Ontology*. Bottom layer = Fundamental. Top layer = Applied/Derivative.
      *   *Load-bearing commitment:* There *is* a hierarchy, and resources should flow "downward" or to the "base."
      *   *Problem:* As the user notes, QF gets funded (no new scale), String Theory gets funded (no empirical base), CM gets defunded (despite being "real" matter).
      *   *Conclusion:* The metaphysical definition is *not* doing the heavy lifting. The *sociological* definition is.

  4.  **Analyze the Pragmatic Alternative:**
      *   Can prestige, path dependence, and expected value explain this?
      *   *Yes.* "Fundamental" is a shibboleth for "High Status/High Risk/High Reward" vs. "Applied/Low Status/Solved."
      *   *HEP/String:* High prestige, historical dominance, perceived as "completing the picture."
      *   *CM:* Perceived as "messy," "engineering-adjacent," or "already understood via QM."
      *   *QF:* Perceived as "fixing the foundation," hence "fundamental" in the sense of *foundational* (logical basis), not scale.
      *   *Verdict:* The metaphysics is decoration. The practice is driven by a heuristic about *explanatory leverage* and *institutional prestige*.

  5.  **Address the Specific Scenarios (Swapping Definitions):**
      *   *Bruteness (Unexplained):* If we funded what is currently unexplained, we'd fund dark matter, measurement problem, turbulence. HEP would lose ground (SM works fine). CM would gain (emergence is unexplained).
      *   *Derivability:* If we funded what allows derivation of everything else, we'd fund computational physics, effective field theories (EFTs), and maybe CM (since you can't derive superconductivity easily from QCD). The "in principle" clause is the killer here. It allows HEP to claim victory without doing the work.
      *   *Scale:* If we strictly funded smallest scale, QF shouldn't count (same scale as non-rel QM). Planck scale physics should dominate everything.
      *   *Generality:* If we funded maximal generality, Thermodynamics and Information Theory might win over String Theory.

  6.  **Address the "Well-Foundedness" Worry (Infinite Descent/Partial Orders):**
      *   If there is no bottom (infinite descent) or no single tower (partial order), the "Fundamental Physics" department name is a misnomer.
      *   *Impact on Hiring:* If the committee realized this, the hierarchy collapses. CM and HEP become *different kinds* of physics, not *higher/lower* kinds. Funding would need to be balanced based on interest/utility, not ontological rank.
      *   *Current Practice:* Assumes a bottom exists (even if unreachable) to justify the hierarchy.

  7.  **Address the User's Criterion (Holding Fixed):**
      *   *Criterion:* F is more fundamental than G if you must hold F fixed to explain G but not vice versa.
      *   *Critique:* This is basically asymmetry of dependence. It's good, but in physics, "explain" is the weasel word. You can explain superconductivity without QCD (using EFTs). So, is QCD fundamental to Superconductivity? Ontologically yes, Explanatorily no.
      *   *Circularity:* It relies on what counts as an "explanation." If explanation requires derivation, we're back to the derivability problem. If explanation allows autonomy, fundamentality dissolves.

  8.  **Synthesize the Argument:**
      *   **Thesis:** The hiring practice does *not* presuppose a coherent metaphysical theory of fundamentality. It presupposes a *sociological* hierarchy disguised as metaphysics.
      *   **Load-bearing:** The belief that *reduction* = *explanation* = *value*.
      *   **Decoration:** The specific definition of "fundamental" (scale vs. generality vs. bruteness). It shifts opportunistically.
      *   **The QF Anomaly:** Explained by "Foundational" (logical consistency) vs. "Fundamental" (constituents).
      *   **Pragmatics:** Yes, a pragmatic story licenses the behavior better. "Fundamental" = "Field with high prestige and unresolved core questions."
      *   **Consequences:** If you enforce consistency, the hiring map changes drastically.

  9.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Validate the user's frustration. It's a category error.
      *   *Section 1: The Implicit Theory.* It's a "Reductionist Hierarchy." But it's inconsistent.
      *   *Section 2: The Four Jobs.* Analyze scale, generality, bruteness, derivability. Show where they break in the user's examples (String vs. CM vs. QF).
      *   *Section 3: The Pragmatic Mask.* Argue that "Fundamental" is a prestige marker. Path dependence (Cold War funding).
      *   *Section 4: What if we took the definitions seriously?* Walk through the user's "swapping" thought experiment.
      *   *Section 5: The Well-Foundedness Worry.* If no bottom, the hierarchy is unjustified.
      *   *Section 6: The User's Criterion.* Analyze the "holding fixed" test.
      *   *Conclusion:* The metaphysics is post-hoc rationalization. The real driver is explanatory ambition + prestige.

  10. **Refining the Tone:** Ensure it sounds like a colleague speaking to a colleague. Avoid condescension. Use physics examples correctly (EFT, SM, QCD, Superconductivity). Make sure the distinction between "ontological fundamentality" and "explanatory fundamentality" is clear.

  11. **Self-Correction during drafting:** I initially thought about bringing in Anderson's "More is Different." I should mention it but not rely on it as a "reading." I need to make sure I answer the specific question: "What view does the practice *presuppose*?" The answer is likely "None coherent, but it *acts* as if it presupposes Reductionism." I need to be careful not to just say "they are wrong," but "their practice implies X, but their rhetoric claims Y."

  12. **Final Polish:** Check against constraints. No reading list. Internet dead. Concrete about hiring implications. Address the QF anomaly specifically. (The QF point is crucial: it shows "fundamental" often means "conceptual foundation" not "constituent parts".)

  *(Self-Correction on QF)*: Why is QF fundamental? Because it questions the *framework* of QM, which is assumed to underlie everything. So it's "foundational" in the logical sense. This fits "Generality" or "Derivability conditions" rather than "Scale." I need to make sure this distinction is sharp.

  *(Self-Correction on Pragmatics)*: The user asks if a pragmatic story could license *exactly* the same behavior. Yes. If "fundamental" is a code for "high risk, high prestige, historical priority," then the behavior is rational within that incentive structure, regardless of metaphysics.

  *(Final Plan)*:
  1. Diagnose the "Tower" illusion.
  2. Dissect the 4 meanings and show their inconsistency in practice.
  3. Argue for the Pragmatic/Prestige explanation.
  4. Run the "What if" scenarios (Bruteness, Derivability, etc.).
  5. Address the Well-Foundedness worry.
  6. Evaluate the user's criterion.
  7. Conclude on the "Load-bearing" vs. "Decoration" distinction.cw
answer: |-
  Here is the reconstruction of the implicit theory driving your committee, separated into what is load-bearing and what is decoration.

  ### 1. The Implicit Theory: "The Reductionist Tower"

  Your committee is operating under a folk-metaphysical model I will call **The Reductionist Tower**. This model presupposes three commitments:

  1.  **Ontological Hierarchy:** Reality is stratified into levels.
  2.  **Asymmetric Dependence:** Higher levels depend on lower levels, but not vice versa.
  3.  **Value Tracking:** Intellectual value correlates with depth in the tower. The "bottom" is where the "real" action is.

  **The Load-Bearing Commitment:**
  The only commitment strictly required to license your committee's behavior is **(3) Value Tracking**. The committee needs to believe that working "closer to the bottom" is more valuable than working "higher up."

  **The Decoration:**
  Commitments (1) and (2) are decoration. As you have noticed, the definition of "bottom" shifts opportunistically.
  *   When rejecting the condensed-matter (CM) candidate, "bottom" meant **constituents** (atoms/particles > materials).
  *   When accepting the string theorist, "bottom" meant **generality** (Theory of Everything > Standard Model).
  *   When funding quantum foundations (QF), "bottom" meant **conceptual coherence** (interpretation > calculation).

  If the metaphysics were load-bearing, the definition of "fundamental" would be stable. Since it shifts to match the prestige hierarchy of the subfields, the metaphysics is post-hoc rationalization for a sociological ordering.

  ### 2. Dissecting the Four Jobs of "Fundamental"

  You identified four distinct meanings. Here is how your committee actually uses them, and where they break.

  **(1) Smallest Length Scale**
  *   *Usage:* Used to demote Condensed Matter. (Materials are big; particles are small.)
  *   *Inconsistency:* This cannot justify funding Quantum Foundations or String Theory. QF works at the same scale as non-relativistic QM. String theory posits a scale ($10^{-35}$m) we cannot access, making it operationally indistinguishable from mathematics. If scale were the criterion, experimental nuclear physics would outrank string theory, and QF would be irrelevant.

  **(2) Maximal Generality**
  *   *Usage:* Used to promote String Theory and QF. (SM applies to known particles; String Theory applies to *all* possible universes; QM underlies *all* physical systems.)
  *   *Inconsistency:* This cannot justify demoting Condensed Matter. Statistical Mechanics and Thermodynamics are arguably more general than Particle Physics (they apply to black holes, stars, economies, and magnets). If generality were the criterion, Information Theory would be the most "fundamental" department.

  **(3) Bruteness (The Unexplained Explainer)**
  *   *Usage:* Used to motivate String Theory ("SM is effective, needs a deeper cause").
  *   *Inconsistency:* This is the strongest argument for HEP, but it cuts against the CM rejection. Superconductivity and turbulence are *also* unexplained in the sense that they are not derived from the SM in practice, and their emergent laws are autonomous. If "bruteness" meant "currently lacking explanation," your budget would shift massively to complex systems and the Measurement Problem, away from searching for new heavy particles.

  **(4) Derivability (In Principle)**
  *   *Usage:* The silent assumption that CM is "just" applied QM.
  *   *Inconsistency:* This relies on the "in principle" clause to do all the work. In practice, CM is not derivable from HEP without introducing new concepts (quasiparticles, symmetry breaking) that are invisible at the HEP level. If "derivability" required *tractable* derivation, HEP would not be fundamental to CM. If it only requires *metaphysical* supervenience, then "fundamental" loses its explanatory power and becomes a theological claim.

  ### 3. The Pragmatic Story (Is the Metaphysics Decoration?)

  You asked if a purely pragmatic story could license exactly the same behavior. **Yes.**

  Replace "Fundamental" with **"High-Leverage Uncertainty."**

  *   **Prestige/Path Dependence:** Since the Manhattan Project and the Cold War, funding agencies have equated "deep truth" with "particle physics." This created a feedback loop: best students go to HEP, best jobs are in HEP, so HEP looks more "fundamental."
  *   **Expected Value of Information:** HEP and String Theory promise a "final theory." Even if the probability is low, the payoff is infinite (The Theory of Everything). CM promises better materials. The payoff is finite. Risk-averse institutions often prefer high-prestige speculation over low-presture certainty.
  *   **Cost of Testing:** It is cheaper to hire a string theorist (pen and paper) than to build a collider. However, it is also cheaper to hire a CM experimentalist. The distinction here is **Market Scarcity**. "Fundamental" labels are used to protect fields that cannot justify themselves via immediate technological application.

  **Verdict:** The metaphysics is decoration. The behavior is licensed by an institutional heuristic that equates **reduction** with **explanation** and **abstraction** with **importance**. The word "fundamental" is a shibboleth used to allocate scarce resources to fields with high social capital but low immediate utility.

  ### 4. What Changes If We Swap the Definitions?

  You asked for concrete consequences if we enforced consistency.

  **Scenario A: Fund "Bruteness" (The Unexplained)**
  *   *Shift:* Money moves away from Beyond-Standard-Model (BSM) particle hunting (since the SM works perfectly well as a brute fact for now) and toward the **Measurement Problem** and **Dark Energy**.
  *   *CM Impact:* Condensed matter gains status. Phases of matter (like fractional quantum Hall states) are brute facts not obvious from the Lagrangian. They become "new physics" rather than "applications."
  *   *Result:* Your String Theory hire becomes hard to justify. Why posit strings if the Standard Model is empirically adequate?

  **Scenario B: Fund "Derivability" (Cash out "In Principle")**
  *   *Shift:* If "fundamental" means "allows derivation of the rest," you must fund **Computational Physics** and **Effective Field Theory (EFT)**.
  *   *CM Impact:* You cannot derive the viscosity of a quark-gluon plasma from String Theory, but you can model it with hydrodynamics. The "fundamental" work becomes the bridge between scales, not the bottom scale.
  *   *Result:* The "Tower" collapses into a network. Funding is distributed based on **connectivity** (how well does this field talk to others?) rather than depth.

  **Scenario C: Fund "Generality"**
  *   *Shift:* **Thermodynamics, Information Theory, and Symmetry Principles** become the core curriculum.
  *   *CM Impact:* CM theorists who work on universality classes (where microscopic details don't matter) are doing the most "fundamental" work, because their results hold regardless of the underlying substrate.
  *   *Result:* Particle physics becomes a "special case" study (like zoology), rather than the foundation.

  ### 5. The Well-Foundedness Worry

  Your philosopher friend is right to worry about infinite descent or partial orders.

  *   **Infinite Descent:** If every particle is made of smaller strings, which are made of... then there is no "Fundamental Physics," only "Current Physics." The hiring category "Fundamental Physics" becomes a misnomer.
  *   **Partial Orders:** If mental facts ground social facts, but physical facts ground mental facts, but social facts constrain physical implementation (downward causation), the tower is a mesh.

  **Impact on Hiring:**
  If the committee accepted there is no bottom, the **hierarchy of value collapses**. You cannot say HEP is "more fundamental" than CM if there is no fundamental layer. You would have to evaluate candidates based on **internal coherence, empirical success, and explanatory power within their domain**.
  *   *Current Practice:* Assumes a bottom exists to justify the HEP > CM ranking.
  *   *Revised Practice:* HEP and CM are *different* projects. One seeks constituents; the other seeks organizational principles. Neither is ontologically privileged.

  ### 6. Evaluating Your Criterion

  > *F is more fundamental than G if you have to hold F fixed to explain G but not vice versa.*

  This is the **Asymmetry of Dependence** test. It is a good criterion, but it fails in practice for two reasons:

  1.  **The "Explain" Weasel Word:** In physics, we often explain G (superconductivity) using effective theories that *ignore* F (quark dynamics). Do we have to hold F fixed? Ontologically, yes. Explanatorily, no. If you mean "explanatorily," then CM is often fundamental to itself. If you mean "ontologically," then HEP wins, but the link is vacuous because we can't actually do the derivation.
  2.  **Circularity:** To decide what counts as "holding fixed," you need to know what the dependencies are. But the dependencies are what you are trying to discover.
      *   *Example:* Is the metric field (General Relativity) more fundamental than matter? Matter tells space how to curve; space tells matter how to move. Your criterion yields a tie (non-well-founded). Yet GR is usually called "more fundamental." Why? Because it defines the *stage*, not the *actors*. This is a **structural** priority, not a dependence priority.

  **Verdict:** Your criterion is logically sound but operationally useless for hiring because physics practice relies on *autonomous levels of explanation*. If you enforced it, you would have to defund almost all HEP (since we can't derive the rest) and fund the interfaces (EFTs).

  ### 7. The Quantum Foundations Anomaly

  You noted QF is funded as "fundamental" despite no new scale/entities.
  *   **Why:** Here "fundamental" means **Foundational** (logical basis), not **Constitutive** (smallest parts).
  *   **The Logic:** If Quantum Mechanics is the framework for *all* physics, then clarifying QM clarifies *all* physics. This appeals to the **Generality** criterion (Meaning 2).
  *   **The Tension:** This contradicts the **Scale** criterion (Meaning 1) used to reject the CM candidate.
  *   **Resolution:** The committee treats "Fundamental" as a **Reserve Category** for fields that claim to address the "rules of the game" rather than the "pieces on the board." HEP claims to find the pieces; QF claims to fix the rules. CM is seen as just "moving the pieces."

  ### Summary: Load-Bearing vs. Vibes

  1.  **Load-Bearing:** The belief that **Reduction = Explanation**. The committee believes that knowing the parts *is* understanding the whole. This justifies prioritizing the search for parts (HEP) over the study of organization (CM).
  2.  **Vibes (Decoration):** The specific definition of "fundamental." It is swapped between Scale, Generality, and Bruteness depending on which subfield is in the room.
  3.  **Pragmatics:** A pragmatic story (Prestige + High-Risk/High-Reward heuristic) explains the behavior *better* than the metaphysical story. The metaphysics is a language used to justify the pragmatics to themselves.

  **Recommendation for the Committee:**
  If you want to challenge the decision, do not argue metaphysics (they will just shift definitions). Argue **Explanatory Autonomy**.
  *   *Argument:* "If 'fundamental' means 'that from which the rest is derived,' and we cannot derive CM phenomena from HEP without autonomous principles, then CM contains fundamental principles of organization that HEP does not capture. Therefore, excluding CM excludes fundamental physics."
  *   *Risk:* They will retreat to "In Principle."
  *   *Counter:* "If 'In Principle' is the standard, then 'Fundamental Physics' is a theological category, not a scientific one. We should hire based on 'Explanatory Leverage,' not 'Ontological Rank.'"

  The word is doing no work. It is a badge of honor. Treat it as such.
