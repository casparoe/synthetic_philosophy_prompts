  7.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Make sure not to paint Marx as a romantic conservative. He *wanted* the village system destroyed eventually. The tragedy is the *manner* and the *lack of immediate replacement*, not the destruction itself per se.
      *   *Nuance:* The "lag" argument needs to account for the fact that the British *did* build things. The point is the *mismatch* in function. A railway doesn't irrigate.
