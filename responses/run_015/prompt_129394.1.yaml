  *(Refining the "Melancholy" point)*: This is actually the strongest part of the user's chapter idea. It moves beyond "did they starve people?" to "did they make life meaningless?" This connects to Subaltern Studies (Guha) without necessarily invoking the whole framework. I should highlight this.

  *(Final check on Q2)*: Is it unfair to the credit column? No, because capital investment has a gestation period. If the gestation period exceeds the lifespan of the displaced population, the credit is intergenerational, but the debit is intragenerational. That's a distributional argument, not just an accounting one. I need to make sure the user sees this distinction.

