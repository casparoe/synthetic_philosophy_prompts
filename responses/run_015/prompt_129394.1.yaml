      *   **Questions:**
          1.  Does the text support reading (b) (time/irreversibility) over (a) (depth of target)? What counts as "reconstitution" for Marx (railways?)? Is reconstitution impossible under empire?
          2.  Is "replacement-rate accounting" methodologically fair/valid, or is it goalpost-moving?
          3.  Is the "melancholy" line a non-welfarist harm (historical continuity/meaning) invisible to standard ledgers?
