answer: |-
  **Design Notes: Discarded Arcs**
  I considered two other sequences. First, a *Historical Genealogy*, tracing EA's development before critiquing it. I discarded this because it invites tribal defensiveness ('defending the movement') rather than methodological scrutiny. Second, a *Moral First* approach, starting with the obligation to do good. I rejected this because it repeats last month's error, anchoring the discussion in motives rather than mechanics. The chosen arc is *Method First*: establish the tool (marginalism), then demonstrate its breakage (thresholds). This keeps the critique structural.

  **Prerequisites, in order**
  Before the critique lands, participants must intuitively feel the pull of marginal reasoning. They need to grasp why EA asks, 'What happens if I add one more pound?' rather than 'Is this cause good?' This counterfactual habit is the engine; without it, the critique looks like a complaint about generosity rather than calculus. You must establish that 'room for more funding' is a constraint on marginal utility, not a judgement on the cause's worth.

  Only once this baseline is set can you introduce non-linear returns. They need to understand threshold effects: actions where the first £99k achieves nothing, and the £100k unlocks everything. If you introduce thresholds before marginalism, they will simply view EA as 'wrong' rather than 'limited'. The dependency is strict: you cannot explain why the method is blind to institutional change until they agree on what the method is supposed to see. You can safely compress the definition of 'expected value' into a single sentence; the group's technical background means they grasp probability weighting. Do not spend time defining utility. Spend the time ensuring they see marginalism as a specific lens, not a universal truth.

  **The carrying example**
  Use the Open Source analogy: funding individual bug fixes versus funding a core maintainer. This resonates with the engineers' experience of technical debt without importing the political baggage of the bednet versus lobbying debate. The property it must have is *visibility of failure*: everyone understands that if no one pays the maintainer, the library rots, regardless of how many bugs were fixed previously. It must lack *contested beneficiaries*. Do not discuss who uses the software; discuss the sustainability of the tool itself.

  I reject the bednet versus lobbying example because it drags in contested views on government efficacy, which distracts from the structural point. The open-source example isolates the funding mechanism. However, you must guard against the assumption that 'maintainers' are always superior. The point is not that infrastructure is always better, but that marginal analysis cannot value the *condition of possibility* for the bug fixes. The example works because it mirrors their professional reality: you cannot marginalise your way out of needing a foundation.

  **Misconception map**

  | Misconception | When it arises | Specific move to head it off |
  | :--- | :--- | :--- |
  | "This is just longtermism." | When introducing thresholds. | Explicitly state: "This applies to current institutional capacity, not just future generations." |
  | "We should stop funding direct work." | When critiquing marginalism. | Say: "The critique is about the *menu*, not the meal. We still need bednets." |
  | "Unmeasurable = Zero value." | When discussing institutional returns. | Distinguish: "Hard to measure is not hard to exist. Don't confuse epistemology with ontology." |
  | "Current top interventions are worthless." | During the comparison phase. | Clarify: "Marginal returns can be positive even if institutional returns are higher." |
  | "Licence to do prestigious work." | When discussing 'making fundable'. | Warn: "Prestige is not a proxy for structural value. Check the dependency, not the status." |
  | "This is about donor motives." | Residue from last month. | Interrupt: "We are auditing the *calculator*, not the *calculator's owner*." |

  **The two distinctions I want left on the board**
  First: *The best thing to fund* versus *the best thing to make fundable*. This is the payload. It shifts their focus from picking winners to building markets. Second: *Option value* versus *computed expected value*. This is scaffolding. It explains why we take actions whose returns we cannot yet quantify. Do not let them leave thinking option value is just 'guessing'. It is the value of keeping the game going. If you must cut time, sacrifice the second distinction, but keep the first. The first changes how they allocate capital; the second only changes how they justify it. Ensure the first distinction is written on the board before the final Q&A.

  **What to leave out**
  Do not attempt to settle the normative weight of institutional change versus direct aid. That requires a separate session on risk tolerance. Decline this openly: "We are diagnosing the blind spot, not prescribing the exact allocation ratio today." Also, leave out EA organisational history. It invites tribalism. If asked, say: "History explains how we got here, but logic explains whether the method holds." This keeps the session analytical rather than genealogical. It prevents the evening from becoming a defence of specific charities.

  **The check**
  End with this scenario: "A donor has £1m. Option A saves 100 lives now. Option B builds a system that might save 1,000 lives later but might fail. Marginal analysis prefers A. Institutional analysis prefers B. Why?"
  A correct answer cites the *shape of the return curve* or the *menu constraint*.
  An answer that merely looks right will say: "Because B is more ambitious," or "Because motives matter less."
  If they focus on the *number* of lives, they have missed the methodological point. They must identify that the *method* of comparison is the variable, not the outcome magnitude. This separates those who see the structural critique from those who just prefer big numbers.

  **Reasons for the ordering**
  This sequence prioritises conceptual dependency over narrative flow. You must establish the rule (marginalism) before demonstrating the exception (thresholds), otherwise the critique feels like an attack rather than a refinement. The Open Source example sits early to ground the abstraction before the Misconception Map, which acts as a defensive perimeter during the discussion. The Distinctions are placed near the end to serve as takeaways once the confusion has been aired. This ordering allows you to truncate the Misconception Map if time runs short, without collapsing the core argument. The Check is last to ensure departure with the correct framework.
