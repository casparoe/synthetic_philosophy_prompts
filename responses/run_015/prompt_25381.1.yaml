answer: |-
  # Q&A Prep Sheet: "The Rhetoric of the Trolley"

  **Context:** Ethics Workshop.
  **Thesis:** Ethical thought experiments function as loaded "intuition pumps" rather than neutral evidence; methodological self-awareness is insufficient.
  **Goal:** Defend the critique without abandoning the method entirely.

  ---

  ### 1. The "What's the Alternative?" Objection
  **Who:** The Grad Students (Anxious) / Smart Agnostics (Pragmatic)
  **Phrasing:** "Okay, grant that thought experiments are rhetorically loaded. But real-world cases are messy, confounded, and historically contingent. If we can't isolate variables in hypotheticals, what is the actual methodology you're proposing? Are we just supposed to stop doing moral philosophy?"
  **The Reply (2 min):** "I'm not proposing we stop; I'm proposing we stop treating these cases as *data* and start treating them as *diagnostics*. When a trolley problem yields a consensus, that doesn't tell us about morality; it tells us about the shared cognitive biases of the philosophers. The alternative isn't silence; it's triangulation. We need to pair hypotheticals with empirical psychology, historical case studies, and institutional analysis. If a thought experiment survives contact with real-world complexity, it earns its keep. Right now, we treat the intuition generated by the pump as the end of the inquiry, rather than the beginning."
  **Soft Spot:** I don't have a fully fleshed-out alternative system ready to deploy. If they press for a specific step-by-step replacement for reflective equilibrium, I'll have to admit this is a call for cultural change, not a new algorithm.

  ### 2. The "Intuitions Are All We Have" Objection
  **Who:** Senior Professor (Foundationalist)
  **Phrasing:** "You call them 'dubious,' but all normative reasoning ultimately bottoms out in intuitions. You can't argue for a first principle without appealing to some pre-theoretical judgment. If you reject the deliverances of thought experiments, you're sawing off the branch you're sitting on. Where else does normative force come from?"
  **The Reply (2 min):** "That's a false dichotomy. I'm not saying we discard intuitions; I'm saying we stop treating *engineered* intuitions as more reliable than *native* ones. Thought experiments often strip away context that is morally relevant to generate a 'pure' intuition. But morality isn't pure; it's contextual. My claim is that an intuition formed in a vacuum is epistemically weaker than one formed in a thick description of reality. We shouldn't privilege the intuition that survives the stripping process; we should suspect it."
  **Soft Spot:** This risks sounding like I'm advocating for particularism or moral anti-realism. If the Prof pushes on the need for *some* abstract justification, I have to concede that *some* abstraction is necessary, which weakens my critique of "stripping away context."

  ### 3. The "Refinement Defense" Objection
  **Who:** Senior Professor (Trolleyologist)
  **Phrasing:** "You're attacking a straw man. Nobody in the serious literature treats the initial setup of a trolley problem as final. We tweak, we refine, we check for framing effects. That's the whole point of the dialectic. To say the field lacks self-awareness ignores the last twenty years of methodological meta-ethics."
  **The Reply (2 min):** "I respect the work done on refinement, but refinement often happens *within* the logic of the pump. We tweak the track conditions, but we rarely question the necessity of the track. The self-awareness is technical, not structural. We ask 'Is this variable controlled?' rather than 'Does controlling this variable distort the moral phenomenon?' The literature treats the thought experiment as the arena where truth is found, rather than a tool that might be fundamentally misshapen for the task."
  **Soft Spot:** They can cite specific papers (e.g., Norcross, Kamm) that do exactly what I'm asking. I need to be careful not to overgeneralize or I'll look ignorant of the canon.

  ### 4. The "Track Record" Objection
  **Who:** Smart Agnostics (Results-Oriented)
  **Phrasing:** "Even if they are loaded, they work. Foot, Thomson, Singer—these thinkers shifted public and academic discourse using these tools. If the method produces insight, clarification, and progress, why does the genetic origin of the intuition matter? Isn't this just sour grapes?"
  **The Reply (2 min):** "It matters because we don't know *what* progress was made. Did we learn about morality, or did we learn about how to manipulate philosophers? The 'insight' might be a shared illusion reinforced by professional training. If a tool produces consistent results but is calibrated incorrectly, it's dangerous. I'm arguing that the field has mistaken consensus for truth. The 'progress' might just be the standardization of a specific set of biases."
  **Soft Spot:** It's hard to deny that Thomson's "People Seeds" or Foot's "Trolley" clarified distinctions (doing vs. allowing). Denying any utility makes me look radical; admitting too much utility undermines the "epistemically dubious" claim.

  ### 5. The "Tu Quoque" Objection
  **Who:** Smart Agnostics (Cynical)
  **Phrasing:** "Your talk today is itself a rhetorical setup. You've framed 'thought experiments' as 'intuition pumps' to load *our* intuition against them. You're using an intuition pump to argue against intuition pumps. Isn't all philosophy just framing?"
  **The Reply (2 min):** "Guilty. I am absolutely pumping your intuitions. But there's a difference between acknowledging the rhetoric and hiding it. The standard literature presents thought experiments as neutral laboratories. I am presenting my argument as a rhetorical intervention. The difference is transparency. I want the field to adopt the same transparency: label the load. If we admit these are persuasive devices rather than discovery mechanisms, we lower the epistemic stakes appropriately."
  **Soft Spot:** This concedes that my argument is *also* epistemically dubious by my own standards. It's a pragmatic defense ("I'm honest about it") rather than an epistemic one ("Mine is true").

  ### 6. The "Dennett Misread" Objection
  **Who:** Senior Professor (Scholarly)
  **Phrasing:** "Dennett didn't say intuition pumps are useless. He said they need to be checked. You're treating 'intuition pump' as a slur, but Dennett treated it as a description of how cognition works. Are you actually disagreeing with Dennett, or just his popular reception?"
  **The Reply (2 min):** "Excellent point. I'm critiquing the *reception*, not the source. Dennett warned us, but the field treated the warning as a footnote. We kept pumping. My thesis is that the literature cites Dennett to acknowledge the risk, then proceeds as if the risk is managed when it isn't. I'm trying to reactivate Dennett's warning as a central methodological constraint, not a disclaimer."
  **Soft Spot:** If they know Dennett's work better than I do, they might catch me on the specifics of what Dennett actually recommended for "checking" the pumps.

  ### 7. The "Language on Holiday" Objection
  **Who:** The Wittgensteinian (Hostile)
  **Phrasing:** "You're worried the experiments are 'loaded.' I'm worried they are nonsense. You're assuming there's a fact of the matter about what you 'ought' to do in a world where trolleys don't exist and language isn't being used. You're still playing the same game, just complaining about the rules."
  **The Reply (2 min):** "I think we're closer than you think. I agree that these problems often take language on a holiday. But while you want to dissolve the problem, I want to sociologize it. Even if the question is nonsense, the *fact that we ask it* is data. My critique is that we treat the nonsense as profound. So, I'm using your skepticism to bolster my methodological critique: if the language is idle, why do we treat the intuitions as evidence?"
  **Soft Spot:** They might argue that sociologizing the error doesn't fix the philosophy. They want the game stopped; I want the game played more carefully. We might talk past each other.

  ### 8. The "Pedagogical Fix" Objection
  **Who:** Grad Students (Optimistic)
  **Phrasing:** "So, is the solution just better teaching? If we teach students to recognize the framing effects, doesn't that solve the epistemic dubiety? We don't need to trash the method, just train the users."
  **The Reply (2 min):** "Training helps, but it doesn't fix the structural incentive. The profession rewards clever new pumps, not critiques of old ones. Publishing a new variation on the trolley problem is easier than publishing a meta-analysis of why trolley problems fail. Until the incentive structure values methodological caution over clever case-construction, better training will just produce more sophisticated pumpers."
  **Soft Spot:** This makes me sound like I'm attacking the profession's incentive structure rather than the philosophy. It's a sociological claim, not a philosophical one, which might feel like a deflection.

  ---

  ### The Prayer Question (The Nightmare Scenario)
  **Question:** "If thought experiments are too loaded to generate knowledge, by what method did you arrive at the conclusion that thought experiments are too loaded to generate knowledge? Did you use an argument that relies on *our* intuitions about *your* premises? If so, haven't you just pumped us into agreeing with you, thereby proving your own thesis undermines your own argument?"

  **Prep:** This is the self-referential paradox.
  **Defense:** Distinguish between *generative* and *critical* use. I am not using a thought experiment to generate a moral truth; I am using a logical argument to critique a methodological practice. The intuition I'm appealing to is about *reliability*, not *morality*.
  **Fallback:** "If that's true, then we can't do philosophy at all. I'm betting that methodological critique is on firmer ground than substantive moral intuition. If I'm wrong, we're all in trouble, not just me."

  ---

  \answer{Thought experiments are indispensable heuristics, but treating them as neutral evidence confuses the calibration of our moral instruments with the data they produce.}
