          *   *Tarka:* Hypothetical reasoning/Reductio. "If miasma, then brewery workers should die." This is eliminative. Nyāya says *tarka* supports *pramāṇas* but isn't one itself.

  3.  **Deconstruct Goal 2: The Critique/Anomaly (The "Traffic in the Other Direction"):**
      *   *Issue 1: Statistics/Contrast Classes.* Nyāya inference is based on *vyāpti* (universal concomitance), not statistical correlation. "Most people who drank got sick" $\neq$ "All people who drank got sick." The "Grand Experiment" (South London) is statistical. Nyāya struggles with probabilistic *vyāpti*. The proposal that the *hetu* is a "relation between populations" fails because *hetu* must be a property (*dharma*) of the *pakṣa*, not a relation between sets.
      *   *Issue 2: Aggregation.* Nyāya generally expects a *pramāṇa* to yield *niścaya* (certainty). *Saṃśaya* (doubt) is the opposite. If Perception is doubtful, Testimony is doubtful, and Inference is probabilistic, does the sum equal certainty? Nyāya has *pramāṇa-samplava* (confluence), but usually, that means multiple *pramāṇas* confirm the *same* certainty, not that weak evidence sums to strong evidence. This is a genuine gap.
      *   *Issue 3: Pragmatic Failure.* *Parataḥ prāmāṇya* (validity known subsequently) usually via *pravṛtti-sāmarthya* (successful activity). If removing the handle didn't *cause* the end (epidemic already fading), the pragmatic test is muddied. Nyāya might retreat to *bādhā* (subration) later when the germ theory is confirmed. But in 1854? It forces a reliance on *śabda* (later experts) or admits *saṃśaya*. It risks Whiggism.
      *   *Issue 4: Gaps.* Decision theory under uncertainty. Nyāya ethics (*pravṛtti*) usually follows knowledge. Acting on *tarka* or high probability without *niścaya* is not well-theorized as a distinct epistemic category (unlike modern risk assessment).

  4.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the ambition. Validate the historical capsule (mostly accurate, minor nuance on the handle timing).
      *   *Section 1: The Mapping.*
          *   Construct the syllogism carefully.
          *   *Pakṣa:* The specific cholera cases in Soho.
          *   *Sādhya:* Caused by ingestion of Broad Street water.
