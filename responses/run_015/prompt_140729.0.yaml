          *   *Aggregation:* Nyāya doesn't have a "Bayesian update" mechanism. *Pramāṇa-samplava* is concurrence, not summation of probabilities. This is a hard limit.
          *   *Pragmatics:* If *pravṛtti* fails (handle removal didn't stop it), validity is threatened. Nyāya would have to wait for *bādhā* (germ theory) to confirm. This exposes the "Whig" risk.
          *   *Gaps:* Action under uncertainty (*niścaya* vs. *sambhāvanā*). Nyāya assumes knowledge precedes successful action. It doesn't handle "best guess" policy well.

  5.  **Refining the Nyāya Technicalities:**
      *   *Hetu:* Must be *pakṣa-dharma*. "Drinking water" is observable. "Contaminated water" is not. If we use "Drinking water," the Miasmatist argues *Savyabhicāra* (Brewery workers drank liquid but didn't die). Snow must refine the *hetu* to "Drinking *this specific* water."
