answer: |-
  This is a formidable pedagogical experiment. You are asking whether a 19th-century proto-epidemiological argument can survive the ontological and logical constraints of classical Nyāya without distorting either. The short answer is: the mapping holds surprisingly well for the *eliminative* steps, but the *constructive* steps expose hard limits in the Nyāya apparatus regarding probability, statistical regularity, and action under uncertainty.

  Below is the disciplined mapping you requested, followed by the critique of the theory's limits.

  ### I. Historical Stipulations
  Your capsule is historically robust. Two minor flags for precision in class:
  1.  **The Handle:** Snow did not order the handle removed; he persuaded the Board of Guardians. The removal happened on September 8, by which time the outbreak was indeed already subsiding (the "fleeing" of the population was a larger factor). Snow acknowledged this ambiguity.
  2.  **The Microscope:** Snow's microscopic examination did not find *Vibrio cholerae* (impossible then); he found "white, flocculent particles" which he hypothesized were the poison. This matters for the *asiddha* charge below.

  ### II. The Mapping: Snow as *Parārthānumāna*

  To fit Nyāya, we must formulate the inference for the sake of others (*parārtha*).

  **The Five Members (*Pañcāvayava*)**
  1.  **Pratijñā (Proposition):** The Broad Street Pump is the source of the cholera afflicting Soho.
  2.  **Hetu (Reason):** Because the victims ingested water from that pump (and those who did not, did not suffer).
  3.  **Udāharaṇa (Example):** Wherever pump water was ingested, cholera occurred (e.g., the Hampstead woman); wherever it was not, cholera did not occur (e.g., the Brewery workers).
  4.  **Upanaya (Application):** The Soho victims ingested this water; the Brewery workers did not.
  5.  **Nigamana (Conclusion):** Therefore, the pump is the source.

  **The Terms**
  *   **Pakṣa (Subject):** The specific population of Soho during the outbreak.
  *   **Sādhya (Probandum):** *Cholera-causation-by-pump* (or more strictly, *having-cholera-due-to-pump*).
  *   **Hetu (Middle Term):** *Ingestion-of-pump-water*.
      *   *Note on your suspicion:* You are correct that the "honest" causal *hetu* is "water contaminated by evacuations." However, Nyāya requires the *hetu* to be established (*siddha*) in the *pakṣa*. Since the contamination was unobserved, Snow cannot use it as the formal *hetu*. He must use the observable proxy: "Ingestion of Pump Water." The *vyāpti* (concomitance) is between *drinking* and *dying*, not *germs* and *dying*.

  **Testing the Hetu (The Five *Lakṣaṇas*)**
  1.  **Pakṣa-dharmatā (Presence in Subject):** Did the Soho victims drink the water? *Yes, established by testimony.*
  2.  **Sapakṣa-sattva (Presence in Similar Instances):** Do other cholera cases involve water ingestion? *Yes (Snow's prior work).*
  3.  **Vipakṣa-vyāvṛtti (Absence in Dissimilar Instances):** Do those without cholera avoid the water? *Mostly (Brewery/Workhouse).*
  4.  **Abādhita (Non-stultified):** Is it contradicted by perception? *No, though miasma theorists claimed smell perception contradicted it.*
  5.  **Asatpratipakṣa (No Counter-balancing Reason):** *Here lies the fight.*

  **The Miasmatist Charge: Which *Hetvābhāsa*?**
  The Miasmatists (and Farr) are entitled to charge **_Savyabhicāra_ (Irregular/Deviant)**.
  *   *Why:* The *hetu* ("Drinking Pump Water") is present in the *vipakṣa* (those who did not get cholera). Many people in Soho drank the water and survived (incubation/immunity). Conversely, the Hampstead woman drank the water and died (good for Snow), but she was outside the *pakṣa* (Soho), complicating the location-based *sādhya*.
  *   *Asiddha?* They could charge *Āśrayāsiddha* regarding the "contamination." If Snow claims the *hetu* is "poisoned water," the Miasmatist says the poison is unestablished (*asiddha*). Snow avoids this by sticking to the observable act of drinking.
  *   *Satpratipakṣa?* **Yes.** Farr's inference provides a counter-*hetu*.
      *   *Farr's Inference:* Soho has cholera (*sādhya*) because it is low-lying (*hetu*).
      *   This *hetu* also satisfies *pakṣa-dharmatā* (Soho is low) and *sapakṣa* (other low areas had cholera). Snow must prove Farr's *hetu* is actually an *upādhi*.

  **The Data Points: *Anvaya* and *Vyatireka***
  *   **The Brewery/Workhouse:** These are instances of **_Vyatireka_** (Negative Concomitance). *Hetu* absent (no pump water), *Sādhya* absent (no cholera). This supports *vipakṣa-vyāvṛtti*.
  *   **The Hampstead Woman:** This is an instance of **_Anvaya_** (Positive Concomitance). *Hetu* present (pump water), *Sādhya* present (cholera). Crucially, this breaks the *upādhi* of "locality." It shows the *hetu* travels with the water, not the air.
  *   **Farr's Elevation:** In Nyāya terms, this is an **_Upādhi_** (limiting condition).
      *   The Miasmatist claims *vyāpti* between "Low Elevation" and "Cholera."
      *   Snow shows this concomitance is false because it depends on a third factor: "Proximity to Sewage/Thames." Low elevation only leads to cholera *when* it implies sewage contamination. Elevation is the *upādhi* that vitiates the Miasmatist's *vyāpti*.

  **Allocation of Other *Pramāṇas***
  *   **_Śabda_ (Testimony):** This carries the heaviest load. The death registers, the neighbours' accounts, Whitehead's survey.
      *   *Āpta Condition:* Nyāya requires the speaker to be competent (*yogyatā*) and truthful. Do lay neighbours qualify? Nyāya allows secular testimony if the speaker has direct perception (*pratyakṣa*) of the fact. Aggregating weak testimony (individual neighbours) into strong evidence is not explicitly theorized; Nyāya tends to treat *śabda* as binary (valid or invalid).
  *   **_Upamāna_ (Comparison):** Largely idle. One might argue Snow compares this outbreak to previous water-borne patterns, but this is really *anumāna* based on memory, not a fresh cognition of similarity.
  *   **_Tarka_ (Hypothetical Reasoning):** This does the eliminative work. "If miasma were the cause, the Brewery workers (in the smell) should die. They did not. Therefore, miasma is insufficient." Nyāya denies *tarka* the status of *pramāṇa* (it yields no new truth independently), but allows it to remove obstacles to *anumāna*. Here, *tarka* clears the field for Snow's *anumāna*.

  ---

  ### III. The Critique: Where the Case Breaks the Theory

  This is the pedagogical core. The Snow case is not just an illustration; it is a stress test that reveals structural gaps in Nyāya epistemology regarding modern scientific reasoning.

  **1. The Statistical *Hetu* and the Contrast Class**
  Your proposal is that Snow's real *hetu* is a relation between populations (mortality rates in South London companies), not a property of the water.
  *   **The Nyāya Verdict:** This fails ontologically. In Nyāya, a *hetu* must be a *dharma* (property) residing in the *pakṣa* (subject). "Higher mortality rate in Group A vs. Group B" is a relational fact (*sambandha*), not a property inhering in the individual house or water sample.
  *   **The Structural Failure:** Nyāya *vyāpti* requires universal concomitance (*niyata*). "Where there is smoke, there is fire." Snow's "Grand Experiment" yields: "Where there is sewage-water, there is *higher probability* of cholera." Nyāya has no slot for *probabilistic vyāpti*. If one house on the clean-water line dies, the Miasmatist charges *Savyabhicāra* (deviation), and strictly speaking, the inference collapses. Nyāya cannot accommodate the "rate difference" as a valid *hetu* because it is not a universal property.

  **2. Aggregation and *Saṃśaya* (Doubt)**
  Snow's conclusion rests on a concatenation of weak links: imperfect maps, fallible testimony, unobserved mechanisms, and statistical correlations with exceptions.
  *   **The Nyāya Problem:** Nyāya generally requires each *pramāṇa* to deliver *niścaya* (certainty). *Pramāṇa-samplava* (confluence of means) is typically understood as multiple *certain* sources confirming the same fact (e.g., seeing and touching a pot). It is not a theory of *cumulative probability*.
  *   **The Gap:** If *śabda* is doubtful (neighbours might be wrong), and *anumāna* is doubtful (exceptions exist), Nyāya classifies the resulting cognition as *saṃśaya* (doubt), not *pramā* (knowledge). There is no mechanism in classical Nyāya for "weak evidence A + weak evidence B = strong knowledge." Snow's reasoning is essentially Bayesian; Nyāya is binary (valid/invalid).

  **3. *Parataḥ Prāmāṇya* and the Failed Pragmatic Test**
  Nyāya holds that the validity of a cognition is known extrinsically (*parataḥ*), often through *pravṛtti-sāmarthya* (successful activity). If I know there is water, I go and drink. If I drink, the knowledge is validated.
  *   **The Misfire:** Snow's "successful activity" was removing the handle. But the epidemic was already declining. The pragmatic test is corrupted; the expected result (stopping the outbreak) did not clearly follow the action.
  *   **The Theoretical Consequence:** Strictly, Nyāya cannot credit Snow with *pramā* in 1854. The cognition remains unvalidated until the germ theory (1880s) provides the *bādhā* (subration) of the miasma theory and confirms the mechanism.
  *   **The Whig Risk:** This forces a retrospective validation. Nyāya can only say Snow was right *because* we now know he was right. It lacks the resources to validate a true cognition whose pragmatic consequences are temporarily obscured or confounded. This makes Nyāya ill-suited for analyzing frontier science where *pravṛtti* is ambiguous.

  **4. What Nyāya Does Not Speak To (The Teaching Point)**
  For your students, the most honest conclusion is to identify the silence.
  *   **Decision Under Uncertainty:** Nyāya ethics (*pravṛtti*) presupposes *niścaya* (certainty). One acts on knowledge. Snow acted on a high-probability hypothesis to save lives. Nyāya has no category for "rationally acting on less-than-ascertained cognition." It does not theorize risk management or policy-making under *saṃśaya*.
  *   **The "Best Explanation" Inference:** Snow's argument is an Inference to the Best Explanation (IBE). He argues the water theory explains the anomalies (Hampstead, Brewery) *better* than miasma. Nyāya *anumāna* is deductive/universalist, not abductive. It cannot formally weigh "explanatory power" against "universal concomitance."

  **Summary for the Syllabus**
  Use Snow to show where Nyāya is strong: the rigorous demand for *vyatireka* (the Brewery case) and the identification of *upādhi* (Farr's elevation). But be plain that Nyāya breaks when the evidence is statistical rather than universal, when validation is retrospective rather than pragmatic, and when action is required before certainty is achieved. The machinery earns its keep on the logic of elimination, but it stalls on the logic of probability.
