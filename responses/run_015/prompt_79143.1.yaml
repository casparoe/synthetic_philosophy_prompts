answer: |-
  **The Spec: Requirements for a Theory of Market Repugnance**

  **1. Core Requirements (Non-Negotiable)**
  *   **Mechanism of Harm:** The theory must specify *who* is harmed and *how*. Is it the seller (coercion/health), the buyer (corruption), or third parties (systemic inequality)? "It's wrong" is not a mechanism.
  *   **Commodification vs. Exploitation:** It must distinguish between harming the *person* (exploitation due to desperation) and harming the *good* (commodification degrades the item's meaning). If fixing poverty fixes the objection, it's an exploitation argument. If not, it's commodification.
  *   **Externalities:** It must explain why non-participants should care. Vote selling hurts democracy (third-party harm). Kidney sales might create a class of biological underdogs (systemic harm). Private queue jumping hurts those behind you (negative externality).
  *   **Historical Contingency:** It must explain why repugnance shifts (usury, slavery) without conceding all repugnance is obsolete. It needs a metric for "progressive" vs. "regressive" moral change.
  *   **Non-Circularity:** It cannot use "repugnant" as both evidence and conclusion. Disgust is data, not a proof.

  **2. The Tensions (Where Theories Break)**
  *   **The Disgust Laundering Trap:** Your hunch is correct. It is exceptionally difficult to explain *why* kidney sales degrade humanity without secretly relying on the intuition you're trying to justify. Most theories fail here, dressing up "ickiness" in philosophical language (e.g., "violation of dignity") without defining dignity operationally.
  *   **The Desperation Paradox:** If the objection is only that sellers are desperate, the solution is welfare, not bans. If the objection is that selling kidneys is inherently degrading, then rich sellers should also be banned. Most theories waffle between these two.
  *   **Authenticity Markets:** Regarding your case (b): Professional mourners sell *performance*; bought apologies sell *accountability*. A theory must distinguish selling a service that simulates an emotion (fine) vs. selling the moral resolution of a wrong (problematic). The latter commodifies justice/remorse, not just labor.

  **3. The Knockout Requirement**
  **Mechanism of Harm** knocks out the most usual answers.
  Most arguments stop at "it cheapens life." A robust theory must explain *how* putting a price on a kidney reduces its value to society compared to altruism. Does it reduce supply? Does it coerce the poor? If it cannot articulate the causal link between the market existing and the harm occurring, it is merely preference assertion. This kills the "price gouging is good" argument (ignores access harm) and the "pure liberty" argument (ignores coercion harm).

  **4. What Would Change My Mind**
  *   **Empirical Override:** If data showed regulated kidney markets significantly *lowered* donor mortality and *increased* transplant success compared to altruistic systems, the "harm to seller" requirement would collapse. Safety trumps abstract commodification concerns.
  *   **Cultural Arbitrariness:** If we found two identical societies where kidney markets thrived in one without social degradation and failed in the other, the "universal commodification harm" requirement would be wrong. It would suggest repugnance is purely local custom, not ethical truth.
  *   **Where This List Is Wrong:** The **Historical Contingency** requirement is the weakest. It assumes there is a stable metric for moral progress. It is possible repugnance is *only* social construction with no underlying truth. If so, demanding a theory explain "why it moves" is like asking physics to explain why fashion changes. The list assumes morality has structure; it might not.

  **Summary:** To win, don't defend disgust. Defend the *structure* of the market. Show how pricing the unpriceable breaks the social contract (vote selling), exploits necessity (kidneys), or corrupts the institution (queue jumping). If you can't name the broken gear, you haven't got a theory.
