prompt: |-
  ok so this is for a debate thing at school and i keep getting stuck. the motion is basically "you should be allowed to sell your kidney / your plasma / your spot in the queue" and every time i say the kidney thing feels different from selling your labour or your old bike, someone says oh so you just find it icky, thats not an argument. which, fine, maybe. but i want to know what an actual answer would have to do before i go picking one, so can you write me the spec for it? like what does any decent theory of "this market is repugant / selling this should be illegal" have to get right. not the theories themselves, the checklist, thats the bit i definately need.

  cases i think it has to handle, tell me what im missing:
  - kidney sales, and plasma, and paying someone to be in a risky medical trial
  - price gouging for bottled water after a hurricane, which the econ kids insist is actually good
  - vote selling, which everyone hates but nobody can say why cleanly
  - and two i thought of: (a) a rich guy pays a hospital charity for the right to be the one who donates a kidney, so no money goes to any seller, the money flows the other way, and yet it still feels off; (b) hiring professional mourners, which is a real job in some places and seems fine, versus buying someone elses apology and giving it to the person you wronged, which seems much worse. so is selling a feeling a different kind of thing from selling an object?

  then the distinctions it cant flatten: the desperate seller (would be fixed by making them not desperate) vs the good being cheapened just by having a price on it (wouldnt be fixed by that); objection to the sale vs objection to the price (a medal for five quid seems worse than a medal for five hundred); wrong for the seller vs wrong for the rest of us, or for the whole institution; and disgust as evidence that somethings wrong vs disgust as the thing the theory is supposed to explain away.

  and one fact it cant contradict: repugnance moves. whole markets that were scandalous a century ago are boring now, and the reverse happens too. so it cant just say repugnant = wrong, and it also cant just say repugnance is always a mistake.

  what i most want: which of these are real requirements and which are just what one side wants to be true, whether some pair of them cant both be satisfied (i have a hunch that "explain why kidney sales are wrong" and "dont just launder disgust" cant both hold, but you tell me), and which single requirement knocks out the most of the usual answers.

  last thing, and i mean this: say what would change your mind. which counterexample or argument would move a requirement off your list, and where do you think your list is most likely to be wrong. hard cap 800 words, a list is fine, dont go over.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Create a "spec" or checklist for a theory of market repugnance/illegality (specifically regarding selling kidneys, plasma, queue spots, etc.).
      *   **Context:** School debate, motion involves selling body parts/queue spots. User is stuck because opponents dismiss "ickiness" as not an argument.
      *   **Input Cases:** Kidney/plasma/trial sales, price gouging (water), vote selling, rich guy buying donation slot (charity), professional mourners vs. bought apologies.
      *   **Input Distinctions:** Desperate seller vs. cheapening good, objection to sale vs. price, wrong for seller vs. wrong for society, disgust as evidence vs. disgust as explanandum.
      *   **Input Constraint:** Repugnance moves over time (historical variability).
      *   **Desired Output:** Identify real requirements vs. partisan wants, identify tensions/impossibilities, identify the most damaging requirement, and state what would change my mind (where the list might be wrong).
      *   **Constraint:** Hard cap 800 words. List format is fine.

  2.  **Deconstruct the "Spec":**
      *   The user wants a meta-ethical or socio-economic framework checklist. What *must* a theory do to be robust?
      *   It needs to handle the cases provided.
      *   It needs to navigate the distinctions provided.
      *   It needs to account for historical variability.
      *   It needs to avoid circularity (disgust vs. explanation of disgust).

  3.  **Evaluate Requirements vs. Partisan Wants:**
      *   *Real Requirement:* Consistency across similar cases (cannot ban kidneys but allow plasma without a principled difference).
      *   *Real Requirement:* Non-circularity (cannot just say "it's wrong because it's icky").
      *   *Partisan Want:* "Must conclude kidneys are illegal." (A theory could legitimately conclude they should be legal).
      *   *Tension:* Explaining why kidney sales are wrong *without* just laundering disgust is the core tension (as the user hunches).

  4.  **Identify the "Knockout" Requirement:**
      *   Which requirement kills the most weak arguments? Probably the "Mechanism of Harm" requirement. Many arguments stop at "it's bad." A robust theory must specify *who* is harmed and *how* (seller, buyer, third party, or the concept itself).

  5.  **Address the "Change My Mind" Section:**
      *   Where is this list vulnerable? The historical variability point is strong. If repugnance is purely social construction, can there be a universal theory? Also, the distinction between "commodification" and "exploitation" is often blurred.

  6.  **Drafting the Content (Iterative refinement for word count):**

      *   *Intro:* Acknowledge the task. Define the spec.
      *   *The Checklist (Requirements):*
          1.  **Harm Specification:** Must identify specific harm (coercion, degradation, systemic inequality) not just "vice."
          2.  **Commodification vs. Exploitation:** Must distinguish between harming the *person* (exploitation) vs. harming the *good* (commodification).
          3.  **Externalities:** Must explain harm to non-participants (e.g., vote selling hurts democracy, kidneys might hurt the poor generally).
          4.  **Historical Contingency:** Must explain why some repugnance fades (slavery, usury) without conceding all repugnance is obsolete.
          5.  **Non-Circularity:** Cannot use "repugnant" as the premise and conclusion.
      *   *Tensions/Impossibilities:*
          *   The "Disgust Laundering" Trap: You hunch is right. It is incredibly hard to explain *why* kidney sales degrade humanity without sounding like you're just codifying disgust. Theories often fail here.
          *   The "Desperation" Paradox: If you fix desperation, does the market become okay? If yes, the objection is about poverty, not kidneys. If no, the objection is about commodification. A theory must pick one.
      *   *The Knockout:* **Harm Specification.** Most arguments fail because they claim "dignity" is harmed without defining how dignity functions as a protected interest distinct from feelings.
      *   *Change My Mind:*
          *   If empirical data showed regulated kidney markets *improved* donor health outcomes significantly compared to altruistic systems, the "harm to seller" requirement weakens.
          *   If "commodification" is shown to be culturally arbitrary (e.g., surrogacy accepted in some places, banned in others with no clear harm difference), the universal theory requirement might be impossible.
          *   Most likely wrong point: The distinction between "selling an object" and "selling a feeling." Professional mourners sell performance, not grief. Bought apologies sell accountability, not remorse. The theory needs to handle *authenticity* markets.

  7.  **Review and Edit (Word Count Check):**
