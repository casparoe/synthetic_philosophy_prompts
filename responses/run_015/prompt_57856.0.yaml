      1.  **The Complexity Prior:** Truth is simpler to describe. (Platitude/Defensible).
      2.  **The Winning Strategy (Game Theoretic):** Honest has a Nash Equilibrium strategy. (Defensible *ideally*, False *bounded*).
      3.  **The Efficient Pointer:** Honest can identify the lie in $O(1)$ or low cost. (Contentious).
      4.  **The Judge Update:** Judge Bayesian updates correctly on claims. (False for busy undergrads).
      5.  **The Asymptotic Limit:** Truth wins as depth $\to \infty$. (True but irrelevant).
      6.  **The Empirical Regularity:** It works in current small-scale tests. (Defensible but not generalizable).

      *Mapping to the User's Worry:*
      The worry is about the **Efficient Pointer** + **Judge Update** under **Resource Bounds**.
