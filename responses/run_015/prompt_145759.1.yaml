answer: |-
  Dear Friend,

  It is entirely understandable that you feel a residual discomfort about that vote, and it speaks well of you that you are not willing to let that feeling rest simply because the arithmetic was clear. You are asking for a way to translate a philosophical intuition into a practical committee dynamic without resorting to jargon that will make your colleagues eyes glaze over. The goal is not to convert them to Rawlsianism but to slow down the reflex to aggregate so that the moral cost becomes visible before the vote is cast. To do this in ninety minutes with this specific group, you need to be surgical about the example you use, the order in which you introduce complications, and the specific misconceptions you dismantle along the way.

  The carrying example you construct for the session is the engine of this discussion, and its design determines whether the objection lands as a moral insight or dismissed as sentimentality. You should avoid using death as the primary currency in the example, not because death is irrelevant, but because it tends to trigger a panic response that shuts down nuanced reasoning. Instead, focus on dignity or autonomy, perhaps something like the difference between funding a home-modification service that allows a specific group of elderly people to remain in their own houses versus funding a broad vaccination programme that prevents minor illness across a much larger group. The loss must be concentrated on a few identified individuals, while the gain is diffuse across many statistical ones. If you present the losers as statistical abstractions, the actuary and the GPs will correctly note that risk pooling is the basis of all insurance and public health. You need them to see the losers as named people with specific claims, even if those people are hypothetical, because the separateness of persons objection only grips when the sacrifice is seen as happening to a subject who experiences it as a whole loss, not a fractional risk. Conversely, the winners should remain statistical to highlight the asymmetry; if both sides are identified, the discussion shifts to interpersonal conflict rather than structural justification. The losses should be significant enough to alter the course of a life, such as losing independence, rather than just a minor inconvenience, because trivial losses are easily outweighed by aggregate gains without moral residue. By making the loss concentrated and the gain diffuse, you prevent them from dismissing the objection as mere risk aversion.

  Before the complaint can sound like a principled objection rather than squeamishness about trade-offs, you must first establish that the committee accepts the reality of the scarcity. If they believe there is a way to fund both, the discussion is about budgeting, not ethics. You need them to agree that granting the one thing necessarily denies the other. Once that is settled, you must establish that the loss is non-compensable to the loser at the time of the loss. This is the dependency structure that must be in place. If they believe the losers can be compensated later, the objection collapses into a simple cash-flow problem. You need them to see that for the person losing their home independence this year, a promise of better healthcare in five years is not a compensation they can enjoy. It is only once they accept that the loss is real, unavoidable, and experienced fully by a distinct individual that the question of whether another person's gain can justify it becomes live.

  You should plan the ninety minutes to address the misconceptions in a specific sequence, because addressing them too early will inoculate them against the core argument. The thought that this is just the trolley problem dressed up should be defused early, within the first twenty minutes, as soon as they try to dismiss the scenario as a classic puzzle. You should point out that the trolley problem is about immediate physical intervention in a crisis, whereas this is about institutional policy and the distribution of resources over time. The distinction matters because policy implies a relationship of trust and expectation between the foundation and the community, which changes the moral landscape from one of emergency triage to one of contractual obligation. If you let them settle on the trolley framing, they will treat it as a binary switch rather than a structural critique.

  The misconception that this is really only a demand to weight the worse off should be addressed in the middle of the session, around the forty-five-minute mark, after they have felt the initial discomfort of the example. They will naturally try to solve the problem by suggesting we just add a multiplier to the QALYs for the hospice patients. You need to explain that this is a technical fix that accepts the underlying premise that people are containers for value that can be summed. The objection is not about the weight of the value but about the permission to sum it at all. If you allow them to think this is just a weighting issue, they will leave believing the formula just needs tweaking rather than questioning the aggregation itself. You must insist that no amount of weighting solves the problem if the fundamental justification remains that the many gain enough to outweigh the few.

  The most critical misconception, that the rotating ten-year plan dissolves the objection entirely, must be saved for the final thirty minutes. This is the climax of the session. Your colleagues will argue that because everyone takes a turn losing and winning over the decade, the community is effectively one person living through time, and thus aggregation is justified just as I might sacrifice my leisure today for my health tomorrow. You need to guide them to see that this reasoning should make them more sympathetic to the objection, not less. The reason is that the rotation relies on a fiction of continuity that does not exist. When you sacrifice for your future self, you consent to the loss based on your own enduring identity. When the committee sacrifices Mrs. Jones this year for Mr. Smith next year, there is no consent and no enduring identity that bridges the gap. The rotation masks the fact that at the moment of decision, a specific person is being used as a means for the aggregate good. Thinking this through should make them more sympathetic to the objection because it reveals that reciprocity does not validate the initial act of aggregation. It shows that even a fair system of rotation cannot justify a decision procedure that treats distinct lives as interchangeable slots in a spreadsheet. If they grasp this, they will see that the ten-year strategy protects them from political backlash, but it does not solve the moral problem of the individual vote.

  You asked for one question to put to them at the end that would distinguish someone who has actually grasped the point from someone who has only learned to repeat that you may not add people together. You should ask them this: If we knew with certainty that the person losing this service would never benefit from any future grant cycle because they would pass away before the rotation came back to their group, would your reasoning for cutting their service change? If they say no, they are still committed to pure aggregation where the loss is justified by the gain to others regardless of the loser's stake. If they say yes, they have acknowledged that the justification relies on the possibility of reciprocal gain, which means the aggregation is not self-sufficient. This question forces them to admit whether the moral weight comes from the total sum of good or from the relationship between the specific loser and the specific gain.

  Finally, you must be plain about what you should openly refuse to settle in ninety minutes. You cannot settle the exact metric for when a loss is too concentrated to be justified by diffuse gains. There is no formula for this, and attempting to find one will drag them back into the actuary mindset you are trying to disrupt. You should tell them explicitly that you are not asking for a new algorithm to replace the QALY, but for a pause in the procedure that allows them to acknowledge the moral cost before applying the arithmetic. If you try to solve the weighting problem, you validate the idea that it is solvable by math. You should refuse to settle on a threshold, insisting instead that the discomfort they feel is the intended outcome, a signal that the decision requires a justification beyond efficiency.

  This approach respects the intelligence of your colleagues while guiding them toward the intuition that is already bothering you. It uses the specific constraints of your foundation not as a way to dismiss the problem, but as a way to sharpen it. By focusing on the identified loser, the non-compensable loss, and the fiction of the social whole, you give them the tools to feel the force of the objection without needing to read a single page of philosophy. I hope this gives you the structure you need to run a session that leaves them unsettled in exactly the right way.

  Warmly,

  Your Advisor
