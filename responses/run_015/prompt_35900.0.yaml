          *   Fit: Logistics of 2M people in Sinai impossible.
          *   Motive: Theological (nation-building).
          *   Verdict: Unhistorical as mass event. Plausible as small group.
          *   Override: Focus on the small group experiencing it as a total event.

  6.  **Drafting the Limitations Note:**
      *   What does this miss? Emotional truth, the "why" of the myth, the literary power of the false version. It can't judge aesthetic value.

  7.  **Final Review against Constraints:**
      *   British English? Yes.
      *   No bibliographies? Yes.
      *   20-minute usability? Yes, it's a checklist.
      *   Honest about judgement calls? Yes.
      *   One uncomfortable conclusion? Yes (Horse).
      *   Override step included? Yes.

  8.  **Final Polish:** Check the flow and voice. Ensure the "Philosopher of History" persona comes through—weighing truth against meaning. (Self-correction: Make sure the distinction between *history* and *memory* is clear).

  *(Self-Correction during final review)*: I need to make sure I don't sound *too* academic. The user is a novelist. The advice must be actionable. The "Override" needs to be robust so they don't feel paralyzed. The distinction between "lying" and "myth-making" is key.

  Let's assemble the response.

  *Structure:*
  1.  Introduction (acknowledging the burden).
  2.  The Protocol (The 20-Minute Filter).
  3.  The Application (Troy, Arthur, Exodus).
  4.  Limitations Note.

  *Key Phrase Check:* "Epistemic Verdict", "Novelistic Override", "British English".

  *Thinking about the Horse:* If I say the Horse is definitely myth, the novelist might be disappointed. I need to show how the Override saves it. The Override allows the Horse *if* the narrative frame acknowledges its ambiguity.

  *Thinking about Arthur:* The "King" vs "Warlord" distinction is classic. I need to make sure the procedure highlights the *political motive* of later Welsh texts.

  *Thinking about Exodus:* The scale is the issue. The procedure should flag the logistical impossibility.

  Okay, ready to write.
answer: |-
  ### The Twenty-Minute Protocol for Legendary Material

  You are correct to distinguish between the historian's burden of proof and the novelist's burden of plausibility. A historian asks, "Did this happen?" A novelist must ask, "If I write this, what claim am I making about the world, and can my narrative sustain it?"

  The following procedure is designed to separate the *epistemic weight* of a legendary element from its *narrative utility*. It is not a truth machine; it is a sorting mechanism. It will not tell you what to write, but it will tell you what kind of lie you are telling if you write it.

  Run this sequence in order. Do not skip steps. If a step yields a definitive negative, you may stop the historical inquiry, but you must proceed to the 'Override' step before making a drafting decision.

  #### Phase 1: The Filter (Historical Plausibility)

  **1. The Proximity Test**
  *Question:* What is the time gap between the putative event and the earliest surviving written account of *this specific detail*?
  *   **Pass:** Contemporary inscriptions or accounts within 50 years.
  *   **Fail:** Oral tradition fixed in writing more than 200 years later.
  *   *Action:* If 'Fail', mark the element as 'Secondary Tradition'. Do not discard, but downgrade confidence.

  **2. The Material Fit**
  *Question:* Does the object, tactic, or social structure match the archaeology of the *putative* period, or the *composition* period?
  *   **Pass:** Matches the era the story claims to be set in (e.g., Bronze Age weapons in a Bronze Age setting).
  *   **Fail:** Matches the era the story was written down (e.g., Stonehenge in a Druid story, though built millennia prior; plate armour in Arthurian tales).
  *   *Action:* If 'Fail', classify as 'Anachronistic Retrojection'.

  **3. The Functional Motive**
  *Question:* Does this element serve a clear political, theological, or etiological purpose for the later culture that preserved it?
  *   **Examples:** A king's lineage justifying a current dynasty; a plague justifying a covenant; a ruin explained by a monster.
  *   **Pass:** No obvious later utility; the detail is awkward or embarrassing to the later culture.
  *   **Fail:** The detail perfectly explains a later political right, religious dogma, or physical landmark.
  *   *Action:* If 'Fail', classify as 'Charter Myth' or 'Theological Elaboration'.

  **4. The Convergence Check**
  *Question:* Do independent traditions (archaeology, external contemporary records, rival oral strands) converge on the *core* of this event, even if details differ?
  *   **Pass:** Multiple sources agree a conflict/movement happened, even if they disagree on the hero's name.
  *   **Fail:** The event is only attested in the single tradition that benefits from it.
  *   *Action:* If 'Fail', classify as 'Singular Tradition'.

  #### Phase 2: The Verdict (Epistemic Status)

  Based on the failures above, assign one of four statuses:
  *   **A (Probable):** Passes Proximity and Material Fit.
  *   **B (Possible):** Fails Proximity, but passes Material Fit and Convergence.
  *   **C (Distorted):** Fails Material Fit (Anachronistic) but passes Convergence (Core event likely, details wrong).
  *   **D (Mythic):** Fails Material Fit and Functional Motive (Likely invented for later purposes).

  *Note:* A 'D' verdict does not mean "do not use." It means "this did not happen as described."

  #### Phase 3: The Override (Novelistic Legitimacy)

  This is where you reclaim agency. You may deploy a 'D' status element if you satisfy one of the following conditions. This prevents self-deception by forcing you to acknowledge the mythic status within the text.

  *   **Condition 1: Diegetic Myth.** The characters believe the legend, but the narrative voice allows the reader to doubt. (e.g., The soldiers pray to the Horse, but the narrator describes it as a siege engine).
  *   **Condition 2: Metaphorical Truth.** The event is physically impossible but emotionally or sociologically true. (e.g., The 'plague' is a metaphor for social collapse, rendered physically for dramatic effect).
  *   **Condition 3: The Unreliable Lens.** The story is explicitly framed as a memory, a song, or a testimony known to be flawed.

  *Constraint:* If you cannot satisfy one of these conditions, using a 'D' status element is mere fantasy. If you can, it is historical fiction engaging with memory.

  ***

  ### Application of the Protocol

  Here I apply the procedure to your three specific dilemmas. I will be blunt, as requested.

  #### 1. The Trojan Horse
  *   **Proximity:** Fail. Homer writes c. 700 BCE; the siege is c. 1200 BCE. Gap of 500 years.
  *   **Material Fit:** Fail. No archaeological evidence of wooden siege constructs of this nature in Late Bronze Age Anatolia. Siegecraft involved ramps and battering rams. A giant wooden statue fits Iron Age religious votives better than Bronze Age warfare.
  *   **Functional Motive:** Pass (Fail). It serves an etiological purpose (explaining the sudden fall of a massive citadel) and a folkloric one (the 'trickster' motif common in Indo-European myth). It does not serve a clear political charter for later Greeks, which is a point in its favour, but it fits a narrative archetype too neatly.
  *   **Convergence:** Fail. The Epic Cycle mentions it, but archaeological layers at Hisarlik show destruction by fire and earthquake, not necessarily subterfuge.
  *   **Epistemic Verdict:** **D (Mythic).** It is highly probable the Horse is a poetic compression of siege engines, an earthquake (Poseidon was the 'Earth-Shaker' and patron of horses), or a ritual gateway, rather than a literal wooden animal.
  *   **Novelistic Override:** You are fond of the Horse. To use it honestly, you must apply **Condition 1 (Diegetic Myth)** or **Condition 3 (Unreliable Lens)**.
      *   *Implementation:* Do not stage the Horse as a camera-ready fact. Stage it as a story the Greeks tell *about* themselves to terrify the Trojans. Or, depict a massive bronze-clad siege tower (historically plausible) that the Trojans, in their terror and religious confusion, interpret as a sacred offering to Poseidon/Horse. The 'Horse' exists in the minds of the characters, not necessarily in the dirt.
      *   *Warning:* If you present the Horse as a literal, hollow wooden statue without narrative irony, you are writing fantasy, not historical fiction. The Override saves this only if the ambiguity remains.

  #### 2. Arthur: Warlord vs. King
  *   **Proximity:** Fail. Gildas (6th C.) mentions a siege at Badon but names no Arthur. Nennius (9th C.) names him. Gap of 300+ years.
  *   **Material Fit:** Fail. The image of a crowned King in a stone capital (Camelot) is high medieval. A 5th-century *Dux Bellorum* would operate from a reoccupied Iron Age hillfort or a Roman ruin, with a mobile warband (*comitatus*), not a court.
  *   **Functional Motive:** Fail (for Kingship). The 'King' narrative serves later Welsh and Breton dynasties claiming legitimacy through him. The 'Warlord' narrative serves the immediate need of post-Roman defence.
  *   **Convergence:** Pass. Multiple Welsh sources agree on a battle leader fighting Saxons in this period, even if details vary.
  *   **Epistemic Verdict:** **C (Distorted).** The core (a war leader defeating Saxons) is probable. The trappings (Kingdom, Court, Chivalry) are anachronistic retrojections.
  *   **Novelistic Override:** **Condition 2 (Metaphorical Truth).**
      *   *Implementation:* You may give him a 'hall', but it must be a timber hall in a ruined Roman villa, drafty and desperate, not a stone castle. You may give him companions, but they are a bonded warband drinking mead from horns, not knights in armour. The 'Round Table' can be a literal round table in a ruin, used to prevent squabbles over precedence among equals. This retains the *spirit* of the legend (equality, fellowship) while adhering to the *material* reality. The 'King' title can be used by his followers as propaganda, while he knows he is merely the first among equals.

  #### 3. The Exodus: Mass Departure
  *   **Proximity:** Fail. The earliest full textual accounts are centuries after the putative event. Egyptian records are silent on a mass departure of slaves.
  *   **Material Fit:** Fail. The logistics of 600,000 men (plus women/children = ~2 million people) moving through the Sinai is archaeologically impossible. No trace of such a mass encampment exists in the material record.
  *   **Functional Motive:** Fail (for History). Pass (for Theology). The scale serves to create a 'Nation' from a tribe. It justifies the claim to the land of Canaan by asserting a divine mandate for a massive people.
  *   **Convergence:** Fail. No external corroboration for the scale. Some evidence for small groups of Semitic slaves fleeing Egypt at various times.
  *   **Epistemic Verdict:** **D (Mythic).** The mass departure is a theological foundation myth, not a demographic event.
  *   **Novelistic Override:** **Condition 2 (Metaphorical Truth).**
      *   *Implementation:* You cannot stage the mass departure without breaking the historical contract. However, you can stage a *small* departure (a few hundred people) that *feels* like a mass exodus to those involved. To a slave, a group of fifty fugitives is 'the people'. The narrative focus remains on the community's perception of themselves as a multitude chosen by God. The 'plagues' can be rendered as natural disasters (algae bloom, volcanic ash) that coincide with their departure, interpreted theologically by the characters. The truth of the novel becomes the *experience* of liberation, not the census data.

  ***

  ### A Note on Limitations

  This procedure is a tool for managing historical integrity, not for judging literary value. It will misclassify material in three specific ways:

  1.  **Emotional Truth:** It cannot measure the 'truth' of a legend that never happened but captures the spirit of an age better than the facts. (e.g., The chivalry of Arthur is historically false, but culturally 'true' for the Middle Ages).
  2.  **The Silence of the Archive:** It relies on what has survived. It will inevitably bias you towards the perspectives of the literate and the powerful, as their 'Motive' is easier to spot. The whispers of the illiterate are often classified as 'Myth' simply because they left no counter-evidence.
  3.  **The Complexity of Memory:** It treats 'Memory' as a distortion of 'Fact'. Sometimes, the myth *is* the fact of the matter for the people living it. If a Bronze Age warrior believes the Horse is real, writing it as a siege engine might be historically accurate but psychologically false.

  Use this protocol to clear the ground, not to build the house. Once the drafting begins, let the story decide which stones to lay.
