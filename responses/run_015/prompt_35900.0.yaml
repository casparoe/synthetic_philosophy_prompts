      *   **Tone:** Considered, polished, methodical, honest, practical.

  2.  **Internal Brainstorming & Conceptual Framework:**
      *   *Legends vs. History:* Legends aren't just "false history." They are often compressed memories, etiological myths (explaining ruins), political charters (justifying rule), or theological retrojections.
      *   *Novelist's Needs:* Rigorous academic truth isn't the goal; *plausibility within the world* and *integrity of the narrative voice* are. The novelist needs to know *why* a detail exists to decide how to treat it.
      *   *The Procedure:* Needs to be a funnel. Start with hard evidence, move to context, then motive, then utility.
      *   *The "Override":* This is crucial. A novelist can write the Horse if they frame it correctly (e.g., as a story told *about* the siege, not necessarily the physical reality). The distinction is between *diegetic truth* (what happens in the story) and *narrative stance* (does the narrator know it's myth?).
      *   *The Three Cases:*
          1.  *Trojan Horse:* High myth, low archaeology. Likely a ritual or siege engine memory. Good candidate for the "uncomfortable conclusion."
          2.  *Arthur's Court:* Anachronistic (medieval court vs. post-Roman warlord). But *comitatus* (warband) is historically plausible, just not the "Round Table" version.
          3.  *Exodus Scale:* Theological magnification. Archaeology suggests small group or no group, not a nation.

  3.  **Drafting the Procedure (The "Twenty-Minute Protocol"):**
      *   *Step 1: Contemporary Attestation.* Is there writing from the time? (Stop if no, but don't discard).
      *   *Step 2: Material Fit.* Does it match the archaeology/tech of the *putative* time or the *composition* time? (Anachronism check).
      *   *Step 3: Motive/Function.* Why does this story exist? (Charter, Theology, Etiology).
      *   *Step 4: Convergence.* Do independent sources agree on the core?
      *   *Step 5: Epistemic Verdict.* (Probable, Possible, Unlikely, Mythic).
      *   *Step 6: Novelistic Override.* Can I use it anyway? Under what conditions?

  4.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is Step 1 too harsh? For Troy and Arthur, there is *no* contemporary attestation for the specific events.
      *   *Adjustment:* Make Step 1 about *proximity* of sources, not just contemporary.
      *   *Critique:* Need to ensure the distinction between "Unhistorical" and "Unusable" is clear.
      *   *Adjustment:* Explicitly separate the Verdict from the Usage.
      *   *Tone Check:* Ensure British English (colour, centre, programme, etc.). Ensure it sounds like a philosopher talking to a writer, not a lecturer talking to a student.

  5.  **Drafting the Application (The Three Cases):**
      *   *Trojan Horse:*
          *   Attestation: Late (Homer, Virgil).
          *   Fit: Wooden horse doesn't fit Bronze Age siegecraft well (more likely a siege engine or earthquake/ritual).
          *   Motive: Etiological (explaining the ruin?), Folkloric (trickster motif).
          *   Verdict: Mythic/Unlikely as literal event.
          *   Override: Use it as a story characters tell, or a metaphorical siege engine.
      *   *Arthur's Court:*
          *   Attestation: Gildas (contemporary-ish, no Arthur), Nennius (later).
          *   Fit: "King" with a capital is anachronistic for 5th C. Warlord with *comitatus* is plausible.
          *   Motive: Political charter (Welsh kings claiming lineage).
          *   Verdict: Distorted memory of a warband, inflated to kingship.
