      *   **Task:** Write a short lay address for a naturalization ceremony.
      *   **Length:** 550 to 600 words (strict constraint).
      *   **Context:** 4 minutes, after clerk, before judge/oath. ~70 people, 30 countries, families, children.
      *   **Audience/Constraints:**
          1.  *Federal Judge:* Treats ceremony as civic sacrament (needs respect, not undermining).
          2.  *Families/Children:* Needs to be accessible, plain language, short sentences.
          3.  *Friend (Legal Aid):* Hates "nation-worship," skeptical of special claims based on nationality.
          4.  *Mother:* Wants to hear about how "fortunate" they are (needs to acknowledge value without demanding gratitude).
          5.  *Speaker's Philosophy:* Convinced by the "subjection account" (shared coercive legal order, not chosen family/kinship). Obligations to non-citizens remain. Oath requires renouncing allegiance (cannot contradict, but doesn't want to ratify rhetoric of choice/gratitude).
      *   **Content Restrictions:**
          *   Avoid: "You chose us/we chose you," national-family language, melting-pot language, implying obligations to home countries lapsed, conceding/denying nation-worship explicitly.
          *   Avoid: Asking them to feel grateful.
          *   Include: Genuine welcome, convictable without irony, endorsable by subjection account holder, makes room feel addressed not instructed.
          *   Language: Plain, short sentences, easy for ESL listeners.
      *   **Addendum:** A note under 250 words flagging 2-3 sentences closest to violating the account, naming which constituency they placate, and the cost of cutting them.

