      *   Citizenship isn't about friendship or blood.
      *   It's about sharing a legal system that coerces everyone.
      *   New citizens gain a voice ("a say") in rules that already bound them.
      *   Obligations to outsiders (non-citizens, people abroad) remain above a sufficiency floor.
