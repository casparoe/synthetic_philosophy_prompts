answer: |-
  You are smuggling in a false presupposition because contractualism evaluates principles for the group as a whole rather than conducting isolated pairwise negotiations, so the single patient's veto stems from the qualitative weight of their burden rather than a structural inability to count the five.

  Contractualism asks whether a principle permitting the sacrifice could be reasonably rejected by anyone affected, not whether the surgeon wins five separate debates. In this specific transplant scenario, the healthy patient can reject the principle because being intentionally killed imposes a qualitatively heavier burden than failing to rescue the dying five, regardless of their number. However, your structural worry is mistaken because numbers do enter the room in contractualism when burdens are equal; if the choice were between saving one dying patient or five dying patients, the single patient could not veto, since their complaint is identical to each of the five and thus outweighed by the greater number of identical complaints. Aggregation is therefore blocked not because the framework isolates individuals into pairwise matches, but because it forbids summing weak interests to override a strong individual claim while still permitting headcounts when claims are equal.
