answer: |-
  Your hypothesis is substantially correct, though it risks being too tidy. You have identified a conceptual conflation, but the stalemate persists not merely because the participants are confused, but because the conflation serves a functional purpose in the debate. Here is a diagnosis of the disagreement, an assessment of your intervention, and a view on what progress might look like.

  ### 1. The Nature of the Disagreement

  You ask whether this is verbal, substantive, methodological, or political. It is all four, layered in a way that makes empirical adjudication impossible.

  **The Verbal Layer:**
  There is a genuine ambiguity in the *explanandum*. When a historian says 'the Great Divergence', they might mean: (a) the crossing of GDP per capita curves; (b) the onset of sustained per capita growth; (c) the transition to fossil-fuel energy regimes; or (d) the geopolitical capacity to project power. These events are correlated but not identical. If one party is explaining (a) and another (c), they will talk past one another. Your contrast-class diagnosis fits here: 'Why Britain rather than China?' implies a single divergence event. If the divergence is actually a sequence of decouplings (wages first, then energy, then institutions), the singular contrast class is a category mistake.
  *Confidence: High.* The literature clearly shows scholars measuring different variables while claiming to measure the same 'divergence'.

  **The Methodological Layer:**
  The historians claiming 'we have data now' are operating under a cliometric paradigm where explanation equals regression and identification. The revisionists pushing the divergence back are often changing the *proxies* (heights, wages, calories) rather than finding new 'facts'. In economic history, data is theory-laden to a degree rarely admitted; constructing a real-wage series requires assumptions about consumption baskets, labour supply, and household structure that vary by region. When you change the aggregation (England vs. Yangzi), you change the statistical properties of the data. The disagreement is about what counts as a stable unit of analysis.
  *Confidence: High.* The 'aggregation-sensitivity' you noted is a known statistical problem (ecological fallacy), but here it functions as a shield against falsification.

  **The Political/Ideological Layer:**
  This is the engine of the stalemate. The debate is a proxy for the Eurocentrism dispute. To argue for an early divergence (1600s) often aligns with a view that European superiority is deep-rooted (institutions/culture). To argue for a late divergence (1800s) aligns with a view that Europe's rise was contingent, accidental, or predatory (coal/colonies). Neither side can concede the timing without conceding the moral or political implication. This is why 'nobody moves'. Empirical evidence is treated as ammunition for a pre-existing normative stance.
  *Confidence: Medium-High.* While most historians would deny their work is politically motivated, the clustering of arguments along these lines is too consistent to be accidental. However, I am extrapolating from the rhetoric of the field rather than the private intentions of the participants.

  ### 2. Assessment of Your Hypothesis

  **The Contrast-Class Diagnosis:**
  You are right that the question is overloaded. In contrastive terms, the 'foil' (Q) keeps shifting.
  *   Sometimes Q is 'China remained Malthusian'.
  *   Sometimes Q is 'China did not industrialise in 1800'.
  *   Sometimes Q is 'China did not develop modern science'.
  These require different explanations. Coal explains energy intensity; institutions explain investment incentives; culture explains diffusion. By keeping the question singular ('The Great Divergence'), scholars can claim their preferred mechanism explains the whole phenomenon, when it likely only explains a slice.
  *Confidence: High.* This is a straightforward application of contrastive explanation theory to a messy historical object.

  **The 'Philosopher's Imposition' Worry:**
  You asked if this is a philosopher's imposition on a question historians are prosecuting well. The answer is nuanced. Historians are 'prosecuting' it well *within their paradigm*, but the paradigm itself is generating the stagnation. The historians' reaction ('we have data') is a category error: more data cannot resolve a mismatched contrast class. If the unit of comparison is ill-defined, adding more wage series for ill-defined units just increases precision without increasing accuracy.
  However, be warned: historians often view this kind of conceptual analysis as procrastination. They value narrative coherence and archival grit. If you tell them their question is ill-posed, they will hear that their life's work is nonsense.
  *Confidence: Medium.* I am confident the analysis is correct, but less confident about its reception. The utility of philosophical intervention in empirical fields is often contested.

  **The Other Philosopher's Objection:**
  The claim that 'China' and 'Europe' are the wrong units is partially correct but too dismissive. Comparative history *requires* units, even if they are constructed. The error isn't using units; it's treating them as natural kinds rather than heuristic constructs. The disagreement isn't that there is 'no single thing to explain', but that there are *multiple* things being explained under one label.
  *Confidence: High.* The objection is philosophically sound but historically unhelpful if it leads to nihilism rather than refinement.

  ### 3. What Counts as Progress?

  Do not expect a resolution. This is not a puzzle to be solved but a tension to be managed. Progress would look like decomposition and explicitness.

  **1. Decomposition of the Explanandum:**
  Progress would be a consensus to stop using 'The Great Divergence' as a singular noun. The field should split the question into:
  *   The Income Divergence (when did wages decouple?)
  *   The Energy Divergence (when did fossil fuel use become critical?)
  *   The Institutional Divergence (when did property rights become enforceable?)
  These may have different dates and different causes. Acknowledging this breaks the 'coal vs. institutions' deadlock, as coal might explain the Energy Divergence while institutions explain the Income Divergence.
  *Confidence: Medium.* This is logically sound, but fields resist fragmentation of their brand-name problems.

  **2. Explicit Contrast Classes:**
  Require that every causal claim specify its foil. 'Coal caused the divergence' must be rewritten as 'Coal explains why Lancashire industrialised in 1800 rather than the Yangzi Delta in 1800', distinct from 'Coal explains why Britain grew faster in 1850 than in 1750'. This exposes where arguments fail. (e.g., If China used coke in the Song dynasty, coal cannot explain the *timing* relative to a Song contrast, but might explain the *scale* relative to a 1750 contrast).
  *Confidence: High.* This is a direct application of your research and would clarify the literature immediately.

  **3. Accounting for Aggregation Sensitivity:**
  An exercise in robustness. If a theory holds for Lancashire vs. Jiangnan but fails for England vs. China, that limits the scope of the theory. Progress is admitting scope conditions rather than universalising claims.
  *Confidence: Medium-High.* This is standard social science practice, but often ignored in grand historical narratives.

  ### 4. Strategic Advice for Your Position

  You are the resident outsider. Your value is not to solve the history, but to clarify the logic.
  *   **Do not** tell them the question is ill-posed. Tell them it is *compound*.
  *   **Do** map the arguments onto your three distinctions (Contrast, Level/Rate/Timing, Aggregation). Show them that the stalemate arises because Party A is answering question 1 and Party B is answering question 2.
  *   **Expect resistance.** The 'data' defence is a defence of turf. Admitting the question is conceptually fractured undermines the claim that new data will settle it.

  ### Summary of Confidence

  *   **Diagnosis of conflation (Verbal/Substantive mix):** High Confidence.
  *   **Role of political commitments:** Medium-High Confidence (inferred from rhetorical patterns).
  *   **Validity of your contrast-class hypothesis:** High Confidence.
  *   **Likelihood of field acceptance:** Medium Confidence (depends on the group's openness).
  *   **Feasibility of 'splitting the question' as progress:** Medium Confidence (logically ideal, sociologically difficult).

  The stalemate is not a failure of imagination; it is a structural feature of a debate where the *explanandum* is doing too much work. Your diagnosis is correct: they are arguing past one another because they are not explaining the same thing. The progress lies in making that plurality explicit, not in finding the one true cause.
