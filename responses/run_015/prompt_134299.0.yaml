answer: |-
  ### Seminar Plan: Judgment Aggregation and the Discursive Dilemma

  #### 1. Dependency Sequence
  To ensure the dilemma registers as a failure of collective rationality rather than a procedural glitch, you must secure the following conceptual dependencies in order:

  1.  **Judgments vs. Preferences:** Establish that the agents are aggregating *truth-claims* (propositional attitudes) rather than *orderings of outcomes*. This prevents students from reducing the problem to Arrow's Impossibility Theorem or standard voting paradoxes.
  2.  **The Rationality Constraint:** Define the logical connection between premises and conclusion (e.g., $P \land Q \land R \leftrightarrow C$) as a constitutive rule of the group's rationality, accepted *ex ante*, rather than a causal observation or a policy preference.
  3.  **Proposition-wise Aggregation:** Specify that the collective judgment on each proposition is determined independently (e.g., by majority vote) without prior regard for logical consistency across propositions.
  4.  **Deductive Closure Failure:** Demonstrate that the resulting collective set of judgments is logically inconsistent (accepting premises but rejecting the entailed conclusion), violating the condition of deductive closure.
  5.  **Agency Attribution:** Argue that because the group acts on these judgments, the inconsistency implies the group itself is irrational, not merely that the voting mechanism is imperfect.

  #### 2. The Carrying Case
  **Scenario:** A three-person committee (Members A, B, C) must decide whether to approve a fictional urban wetland development project.
  **Propositions:**
  *   $P$: The project poses no significant ecological risk.
  *   $Q$: The project complies with all zoning laws.
  *   $R$: The project is economically necessary for the district.
  *   $C$: The project is approved.
  **Logical Constraint:** The committee charter states that approval is granted if and only if all three conditions are met ($P \land Q \land R \leftrightarrow C$).

  **Required Properties:**
  *   **Interdependent Premises:** The conclusion is logically entailed by the conjunction of the premises, not merely correlated.
  *   **Transparent Logical Connection:** The constraint ($P \land Q \land R \leftrightarrow C$) is public knowledge and accepted by all members as a rule of reasoning.
  *   **Binary Individual Judgments:** Each member must judge each proposition as strictly Accept (True) or Reject (False); no abstentions or degrees of belief.

  **Excluded Elements:**
  *   **Hidden Chairperson:** No member has veto power or tie-breaking authority; the structure must be flat.
  *   **Probabilistic Credences:** Members cannot assign probabilities (e.g., "80% likely safe"); this introduces epistemic uncertainty rather than logical inconsistency.
  *   **Strategic Preference Revelation:** Members vote sincerely according to their judgment of truth, not tactically to achieve a preferred outcome.

  **Why Not Standard Jury Framing:**
  Avoid the familiar legal framing (negligence, causation, damages) because philosophy graduate students are likely familiar with the "doctrinal paradox" in legal theory. That framing invites distractions regarding burden of proof, standards of evidence, and legal liability, which muddies the pure logical inconsistency. The wetland policy case isolates the *rationality* of the collective agent from specific *legal* doctrines.

  #### 3. Misconception Trajectory
  Students will likely attempt to resolve the paradox using intuitive fixes. You must head these off at specific points with precise countermoves.

  1.  **Misconception:** Weighted or supermajority voting resolves the conflict.
      *   **Intervention Point:** Immediately after displaying the inconsistent collective set.
      *   **Countermove:** "Changing the threshold shifts the distribution of inconsistencies but does not eliminate the structural possibility of inconsistency under any anonymous voting rule."

  2.  **Misconception:** The problem only arises with strictly binary premises.
      *   **Intervention Point:** During the discussion of generalizability beyond the wetland case.
      *   **Countermove:** "Replacing binary judgments with probabilities still requires a binary decision threshold that reintroduces the discontinuity."

  3.  **Misconception:** The dilemma is an argument for overriding collective judgment with expert or authoritarian decision-making.
      *   **Intervention Point:** During the normative implications discussion.
      *   **Countermove:** "Dictatorial consistency solves the logical problem by eliminating the 'collective' agent entirely."

  #### 4. Check for Understanding
  Do not ask them to reproduce the paradox. Instead, present a scenario that mimics the voting pattern but lacks the rationality threat.

  **Scenario Description:**
  A three-person committee votes on $P$ (Budget Surplus Exists), $Q$ (Community Demand is High), and $C$ (Build New Library). The vote tally is identical to the wetland case: Majority accepts $P$, Majority accepts $Q$, but Majority rejects $C$. However, in this scenario, the committee charter explicitly states that $P$ and $Q$ are *relevant considerations* but do not logically entail $C$; the final decision is discretionary.

  **Diagnostic Criterion:**
  Students must diagnose that this is **not** a discursive dilemma because the group has not violated a logical constraint they accepted. The inconsistency is merely political or preferential, not a failure of collective rationality or deductive closure.

  #### 5. Omitted Scope
  Explicitly name the following as out of scope to manage expectations and maintain focus on the core logical problem:
  *   The full formal taxonomy of aggregation rules (e.g., premise-based vs. conclusion-based vs. distance-based).
  *   General impossibility results for groups larger than three (List & Pettit Theorem).
  *   Any proof sketch using lattice-theoretic machinery or formal axiomatic derivations.

