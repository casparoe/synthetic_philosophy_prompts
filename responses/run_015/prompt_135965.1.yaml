  ### The Rule She Is Actually Running: **The Sterility of Money vs. The Fertility of Assets**

  While the "Community Need" rule explains the rain barrels, it fails to explain the coin lending. If her only rule were "keep it in the community," lending coins to a neighbor at interest should be fair (since both parties are inside). But she ruled it **unfair**.

  The consistent thread across *all* her past verdicts is the **Natural Growth Rule**:
  *   **Fair:** Exchanges where value comes from **labor** (bread/bike) or **productive assets** yielding **real goods** (plow/harvest). These are "fertile" because they create new wealth.
  *   **Unfair:** Exchanges where value claims to grow from **money itself** without labor or production (coin interest, drought profiteering). These are "sterile" or "barren" because money is just a measure, not a producer.

  She treats money (coins) as a dead measure of value that cannot naturally reproduce. She treats tools and labor as living sources of value that can yield fruit.

