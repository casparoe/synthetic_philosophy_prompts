      *   **Task:** Stress-test the view. Map its exposure (what counts against it, predictions, insulation).
      *   **Specific Pressure Points:** Seven specific worries provided (Weakness of Will, Norm Granularity, Inversion/Recovery, Asymmetric Severity, Directed/Third-Party Cases, Political Cost/Quietism, Generality/Quietism).
