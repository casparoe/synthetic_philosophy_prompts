  # Project Proposal: Functional Indexing and the Definitional Stalemate in Astrobiology

  **Project Title:** Beyond the Cluster Concept: A Functional Indexing Approach to the Definition of Life
  **Duration:** 9 Months
  **Degree:** Masters by Research

  ### 1. Abstract and Research Question
  The question "What is life?" has reached a dialectical stalemate. Standard approaches oscillate between searching for necessary-and-sufficient conditions (which fail on borderline cases like viruses or fire) and retreating to deflationary cluster concepts (which dissolve the problem without solving it). This project argues that the stalemate arises not from the complexity of biological systems, but from a category error: treating "life" as a single natural kind when the term performs distinct, separable epistemic jobs.

  I propose that "alive" functions as an indexical term referring to one of three distinct criteria depending on the investigative context: (a) **Functional** (thermodynamic maintenance far from equilibrium), (b) **Genealogical** (membership in an evolving lineage), or (c) **Evidential** (markers detectable by remote sensing). Confusion arises when these criteria diverge. The research question is: *Can a functional indexing framework resolve classificatory stalemates in borderline cases where standard definitions fail, and can this framework generate a decision procedure for life-detection instrument design?*

  Unlike plain conceptual pluralism, which posits that multiple concepts of life coexist, this project argues for a normative mapping: specific investigative goals *require* specific criteria. Using plain pluralism leads to relativism ("it depends on your preference"); using functional indexing leads to a decision procedure ("given goal X, criterion Y is objectively required").

  ### 2. Background and Critique of Standard Moves
  Current literature fails to resolve the definition problem because it attempts to force a single definition to do too much work.
  *   **The NASA/Working Definition:** ("Self-sustaining chemical system capable of Darwinian evolution") conflates the Functional and Genealogical jobs. It excludes potential non-Darwinian life (Functional only) and includes potentially non-living evolutionary algorithms (Genealogical only).
  *   **Cluster/Family-Resemblance Accounts:** These accurately describe the *state* of the debate but offer no *method* for resolution. They explain why we disagree but provide no tools for deciding cases, effectively ending inquiry prematurely.
  *   **Autopoietic and Information-Theoretic Accounts:** These focus exclusively on the Functional job (self-maintenance), rendering them useless for paleontology or astrobiology where history is unknown or chemistry is alien.
  *   **Stipulationism:** ("Just pick a definition for your purpose") ignores the fact that cross-disciplinary communication breaks down when biologists, physicists, and legal scholars use incompatible stipulations without a translation key.

  This project differentiates itself from **Conceptual Engineering** by not attempting to build a *new* definition of life, but by mapping the *existing* usage to its proper context. It differentiates from **Plain Pluralism** by arguing that the choice of concept is not arbitrary but constrained by the physical and epistemic limits of the observer.

  ### 3. Methodology and Novel Case Studies
  The project will proceed through a comparative analysis of standard and novel borderline cases. I will invent three stress-test cases designed to force the separable jobs apart, demonstrating where standard definitions collapse and where functional indexing succeeds.

  **Novel Borderline Cases:**
  1.  **The "Ephemeral Compute" Instance:** A large-model AI that dynamically replicates its code across a datacenter to avoid deletion, consuming energy and maintaining structure, but possesses no historical lineage and vanishes if power is cut.
      *   *Conflict:* Functional (Yes) vs. Genealogical (No).
      *   *Test:* Does a life-detection instrument looking for "metabolism" flag this? Should it?
  2.  **The "Centennial Terrarium":** A sealed ecosystem where all original biological agents died 50 years ago, but their decomposition products created a chemical oscillating system that perfectly mimics metabolic gas exchange and homeostasis.
      *   *Conflict:* Evidential (Yes) vs. Functional/Genealogical (No).
      *   *Test:* Is this "dead" matter acting alive, or is it a new form of abiotic life?
  3.  **The "Sterile Engine":** A synthetic cell created from scratch (no ancestry) that metabolizes and grows but is engineered to be incapable of reproduction.
      *   *Conflict:* Functional (Yes) vs. Genealogical (No) vs. Moral/Legal (Protected?).
      *   *Test:* Does the lack of evolution strip it of the status "living" for the purpose of patent law vs. biological safety?

  **Method:**
  I will analyze these cases using the Functional Indexing Framework. For each case, I will determine which "job" is primary for a specific observer (e.g., an astrobiologist vs. a patent lawyer). I will then construct a decision matrix that aligns the observer's constraints with the appropriate criterion.

  ### 4. Deliverables
  1.  **Dissertation:** A 25,000-word thesis arguing for the Functional Indexing Framework.
  2.  **The Life-Definition Decision Matrix:** A practical flowchart for instrument designers and policy makers. This tool will allow a user to input their constraints (e.g., "remote sensing only," "need to assess moral status," "assessing evolutionary potential") and output the rigorous definition required for that context.

  ### 5. Feasibility and Risk Assessment
  **Timeline:** 9 Months.
  **Risk of Failure:** The project fails if the three "jobs" prove inseparable in physically possible systems (e.g., if function *always* implies genealogy in any stable system). It also fails if the Decision Matrix collapses into triviality (e.g., "If you want to find function, use the functional definition").
  **Mitigation:** To ensure completion within 9 months, the **Moral/Legal job** will be treated as a secondary application rather than a core theoretical pillar. The primary focus will remain on the Epistemic/Scientific jobs (Functional, Genealogical, Evidential) to ensure the Decision Matrix is robust for life-detection contexts. If the novel cases prove too complex to model theoretically, I will revert to standard literature cases (viruses, prions) but apply the new indexing framework to them.

  ### 6. Month-by-Month Plan
  *   **Months 1-2:** Literature review. Finalize taxonomy of the three "jobs." Map existing definitions (NASA, Autopoiesis, etc.) to these jobs.
  *   **Months 3-4:** Develop the three Novel Borderline Cases. Rigorous theoretical stress-testing of standard definitions against these cases.
  *   **Months 5-6:** Draft the Functional Indexing Framework. Construct the initial Decision Matrix. Consult with one astrobiology researcher (informal) to test matrix utility.
  *   **Months 7-8:** Write dissertation. Refine Decision Matrix based on writing insights.
  *   **Month 9:** Revision, formatting, and submission.

  ***

  # Private Memo: Feasibility & Strategic Advice

  **Is 9 months enough?**
  Honestly? **No, not for the scope you originally described.** A standard Masters-by-Research is 1–2 years. 9 months is essentially a long internship or a very tight MPhil. You are proposing to solve a problem that has stalled philosophy of biology for 40 years.

  **What to Cut (Crucial):**
  1.  **Drop the Moral/Legal Job (d):** You mentioned this in your prompt, and I included it in the draft above, but **you should cut it for the proposal.** Moral philosophy and legal theory are deep wells. If you try to solve the definition of life *and* the ethics of synthetic organisms in 9 months, you will drown. Focus entirely on the **Epistemic/Scientific** jobs (Functional, Genealogical, Evidential). This makes the project about *measurement and classification*, which fits the "instrument design" deliverable much better.
  2.  **Narrow the "Decision Procedure":** Don't promise a universal tool. Promise a "Framework for Astrobiological Instrument Design." Limiting the scope to astrobiology/life-detection gives you a concrete audience and prevents the "it's all context-dependent" failure mode.
  3.  **The "Pluralism" Trap:** You asked how to distinguish this from pluralism. In the proposal, I framed it as *Normative Mapping*. Pluralism says "Concepts A and B are both valid." You are saying "Concept A is the *only valid tool* for Task X." This is a stronger claim. Stick to that. If you waver, the examiners will say "This is just pragmatism."

  **Failure Conditions (The Honest Truth):**
  You asked to know if this collapses into "it's all context-dependent."
  *   **The Risk:** If your "Indexing" just says "Use the functional definition for functional questions," that is a tautology.
  *   **The Fix:** You need to show that scientists *currently* use the wrong index for their question. For example: "Astrobiologists are using a Genealogical definition (evolution) for a mission that can only measure Evidential markers (spectroscopy), leading to false negatives." If you can prove that *current practice is mismatched*, your project has teeth. If you just say "definitions vary," it's trivial.

  **The Novel Cases:**
  The "Ephemeral Compute" and "Centennial Terrarium" are good. They force the **Evidential** job to clash with the **Functional** job.
  *   *Refinement:* Make sure the "Centennial Terrarium" is chemically plausible. If it's too sci-fi, philosophers will dismiss it. Call it "Abiotic Metabolic Mimicry."

  **Final Recommendation:**
  Submit the proposal text above, but **edit Section 5 (Feasibility)** to explicitly state you are dropping the Moral/Legal axis to ensure depth on the Scientific axis. This shows self-awareness and project management skills, which fellowship committees love. It turns a weakness (time) into a strength (focus).

  **One last thing:** The "Decision Matrix" deliverable is your safety net. Even if the philosophical argument is contested, a useful flowchart for scientists is a tangible output that justifies the fellowship. Lean into that.
