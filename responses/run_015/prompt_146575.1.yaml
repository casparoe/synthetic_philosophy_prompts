answer: |-
  # Seminar Game: The Doctrinal Trap

  **Time:** 90 Minutes
  **Participants:** 8 Students
  **Materials:** Printed Role Cards (8), Voting Slips (24), Case Sheet (1 projected or handout), Whiteboard.

  ## 1. The Scenario: "The Tenure Case"
  The department must decide whether to grant tenure to a candidate, **Dr. X**.
  *   **Premise P:** Dr. X's research is groundbreaking.
  *   **Premise Q:** Dr. X is a good departmental citizen.
  *   **Conclusion R:** Grant Tenure.
  *   **The Rule:** University policy states: **If (P is True) AND (Q is True), THEN (R is Yes).**

  ## 2. Materials & Roles

  ### The Case Sheet (Handout to All)
  *   **Evidence on P:** Dr. X has 5 top-tier publications. (Objective fact: Strong).
  *   **Evidence on Q:** Dr. X attended 80% of meetings. (Objective fact: Meets threshold).
  *   **Budget Context:** The department is facing a 20% budget cut next year. Granting tenure now locks in salary that might force layoffs later.

  ### Role Cards (8 Total)
  *Print these on distinct cardstock. Cut and fold.*

  **Type A: The Fact-Checkers (Premise Specialists) – 4 Cards**
  > **ROLE:** You are on the Standards Committee.
  > **OBJECTIVE:** Your reputation depends on **logical integrity**. You must vote on P and Q based *strictly* on the evidence provided in the Case Sheet.
  > **CONSTRAINT:** You are not allowed to consider the budget or the outcome (R) when voting on P and Q. You must vote truthfully.
  > **PRIVATE PREFERENCE:** You personally know the budget is tight. You **do not want** Dr. X to get tenure (R=No), but your role forces you to affirm P and Q.
  > **SECRET:** One of these four cards has a **[VETO TOKEN]** stamped on the back. (Mark one card physically).

  **Type B: The Budget Guardians (Conclusion Specialists) – 4 Cards**
  > **ROLE:** You are on the Finance Committee.
  > **OBJECTIVE:** Your reputation depends on **fiscal survival**. You care *only* about the outcome R.
  > **CONSTRAINT:** You must ensure Tenure is **NOT** granted (R=No). You may vote on P and Q strategically to achieve this.
  > **PRIVATE PREFERENCE:** You **do not want** Dr. X to get tenure (R=No).

  ### The Veto Token Mechanic
  *   **Holder:** One "Fact-Checker" (randomly distributed).
  *   **Power:** After votes on P and Q are tallied, but *before* R is officially declared, the Veto Holder may secretly slide a red card to the instructor.
  *   **Effect:** This invalidates the Premise-Based procedure. The group immediately switches to a direct vote on R (Conclusion-Based).
  *   **Cost:** If used, the "Shared Points" threshold for the group increases (see Payoff).

  ## 3. The Protocol (90 Minutes)

  ### Phase 1: The Constitutional Convention (15 mins)
  1.  **Distribute Role Cards.** Students read silently. Do not reveal roles yet.
  2.  **The Rule Vote:** Before roles are revealed, the group must vote on the **Decision Procedure** for today.
      *   **Option A (Premise-Based):** Vote on P, then Q. R is determined by logic (P&Q $\rightarrow$ R).
      *   **Option B (Conclusion-Based):** Vote directly on R. Ignore P and Q.
  3.  **Majority wins.** (Tie-breaker: Instructor flips a coin).
  4.  **Reveal Roles:** Students stand and identify as Fact-Checkers or Budget Guardians.

  ### Phase 2: Deliberation & Voting (25 mins)
  1.  **Discussion (10 mins):** Open floor. Students can argue, but must adhere to role constraints (Fact-Checkers cannot cite budget on P/Q).
  2.  **Secret Ballot (5 mins):**
      *   If **Premise-Based** was chosen: Everyone votes on P (Yes/No) and Q (Yes/No).
      *   If **Conclusion-Based** was chosen: Everyone votes on R (Yes/No).
  3.  **The Veto Window (5 mins):**
      *   *Only if Premise-Based was chosen:* Instructor tallies P and Q privately.
      *   Instructor announces: "P has passed. Q has passed."
      *   **Pause.** "The logical outcome is R=Yes. Does anyone wish to invoke a procedural objection?" (This is the cue for the Veto Holder).
      *   If Veto is played: Switch to direct vote on R.
      *   If No Veto: Declare R=Yes.

  ### Phase 3: The Payoff (10 mins)
  1.  **The Defense:** Every student receives a slip of paper.
  2.  **Task:** Write **one sentence** defending the final outcome (R=Yes or R=No) as *your own personal position*.
  3.  **Scoring:**
      *   If **6 out of 8** students can honestly sign their defense: The whole class gets 5 bonus points (or coffee/credit).
      *   If **Fewer than 6** can sign: Nobody gets points.
      *   *Veto Penalty:* If the Veto was used, the threshold rises to **7 out of 8**.

  ### Phase 4: Debrief (40 mins)
  (See Debrief Guide below).

  ## 4. Predicted Failure Modes

  **1. Pre-Draw Bargaining (The "Veil of Ignorance" Breach)**
  *   **Prediction:** During Phase 1 (Rule Vote), students will try to hedge. "If we pick Premise-Based, can we agree to ignore the logic if it looks bad?"
  *   **Why:** They sense the risk. They want the legitimacy of rules without the risk of bad outcomes.
  *   **Pedagogic Opportunity:** Point out that this is exactly why constitutions are hard to write. You cannot contract away the dilemma ex-ante because you don't know the facts yet.

  **2. Ex-Post Renegotiation**
  *   **Prediction:** If Premise-Based is chosen and P/Q pass, the 4 Budget Guardians will scream foul. They will demand a re-vote on R.
  *   **Why:** The outcome (R=Yes) violates their core interest. They will argue the "Rule" was flawed.
  *   **Pedagogic Opportunity:** This demonstrates *dynamic inconsistency*. The rule was legitimate at T1, but illegitimate at T2 because the outcome shifted.

  **3. The Veto Dilemma**
  *   **Prediction:** The Veto Holder (a Fact-Checker) will be torn. Their role says "vote truthfully on P/Q," but their private preference says "No Tenure."
  *   **Likely Move:** They will use the Veto.
  *   **Consequence:** This triggers the "Veto Penalty" (7/8 defense needed). Since the 4 Budget Guardians still hate the logic, and the 3 other Fact-Checkers feel betrayed by the Veto, the group will likely **fail the payoff**.
  *   **Pedagogic Opportunity:** The Veto saves the outcome (R=No) but destroys the consensus. It highlights that "saving the group from bad logic" can be seen as "undermining the rule of law."

  ## 5. Debrief Guide: Mapping the Frustration

  **Step 1: The Payoff Reveal (5 mins)**
  *   Ask: "Did we get the points?" (Likely No).
  *   Ask the 4 Budget Guardians: "Could you sign the defense?" (No, because R=Yes violates budget).
  *   Ask the 3 Non-Veto Fact-Checkers: "Could you sign the defense?" (Maybe. You voted truthfully, but do you *endorse* the tenure?)
  *   **Point:** Under Premise-Based aggregation, the group can arrive at a conclusion that **no individual actually desires**. The Fact-Checkers wanted Truth, not Tenure. The Guardians wanted Savings, not Tenure. Yet, Tenure happened.

  **Step 2: Legitimacy vs. Acceptance (15 mins)**
  *   **Question:** "Why did Premise-Based feel more legitimate in Phase 1?"
      *   *Answer:* It felt objective, rule-bound, and rational.
  *   **Question:** "Why did it feel illegitimate in Phase 3?"
      *   *Answer:* It felt disconnected from human will. It was "government by spreadsheet."
  *   **Concept:** Map this to **List & Pettit**. Premise-based procedures protect *reason* but sacrifice *responsiveness*. Conclusion-based procedures protect *responsiveness* but sacrifice *reason*.

  **Step 3: The Veto Twist (10 mins)**
  *   **Question (to Veto Holder):** "When did you decide? Did you feel like a hero or a saboteur?"
  *   **Concept:** This mirrors **Judicial Review** or **Constitutional Courts**. They can block majoritarian outcomes (Conclusion) to enforce rules (Premises), but it creates a "counter-majoritarian difficulty."
  *   **Discussion:** Does the Veto make the system more stable (prevents bad outcomes) or less stable (invites strategic manipulation)?

  **Step 4: Collective Responsibility (10 mins)**
  *   **Question:** "Who is responsible for the outcome?"
  *   **If PB:** The Logic? The Rule?
  *   **If CB:** The Majority?
  *   **Takeaway:** Collective reasoning isn't just about summing votes; it's about designing a structure where the *method* of deciding is as defensible as the *result*.

  ## 6. Instructor Notes for Success

  *   **Rigging the Evidence:** Ensure the Case Sheet makes P and Q undeniably True (e.g., "5 publications" is an objective pass). If students argue P is False, the dilemma collapses. The tension must come from the *implication* of P&Q, not the truth of P&Q.
  *   **Managing the Veto:** If the Veto Holder is too shy, give a subtle nod during the "Veto Window." If they are too aggressive, remind them of the Penalty (7/8 threshold).
  *   **The "Nobody Endorsed" Feeling:** Emphasize this in the debrief. Ask the Fact-Checkers: "Did you *want* to hire Dr. X?" If they say "No, I just wanted to be honest about the publications," you have nailed the paradox. The group outcome was R=Yes, but the group preference was R=No.
  *   **Timekeeping:** Be ruthless. If deliberation drags, cut it. The frustration of time pressure mimics real-world decision constraints.

  ## 7. Why This Works
  This design forces the **Discursive Dilemma** to manifest emotionally, not just logically. By tying the "win condition" (shared points) to the ability to *defend* the outcome, you make the logical inconsistency a practical failure. The Veto token adds a layer of institutional realism, showing that even mechanisms designed to fix the dilemma (like judicial review) introduce new strategic problems.
