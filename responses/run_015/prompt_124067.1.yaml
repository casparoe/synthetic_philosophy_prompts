      2. Case for Yes: She acts on the right reason, suppresses self-interest.
      3. Case for No: Heteronomy, lack of rational grasp, motive is trust not respect.
      4. Verdict: No moral worth. Explanation of the "missing link" (autonomous endorsement).
      5. Implications: Children are not full moral agents yet; moral worth requires maturity/understanding.

      *(Wait, one more check)*: Is "No moral worth" too harsh? It might sound like I'm saying she did nothing good. I must distinguish *moral worth* (praiseworthiness of motive) from *rightness of action*. The action is right. She is praiseworthy socially. But *moral worth* (the specific philosophical term) is absent. I need to make this distinction clear.

