  ***

  **Commentary**

  Refrain one ("Weight the worst...") articulates the prioritarian commitment to marginal moral value, prioritizing the deprived without demanding equality for its own sake. Refrain two ("Better all stand...") voices the leveling-down objection: it is intuitively repugnant to worsen the best-off without improving the worst-off. The villanelle's circular structure enforces this impasse; the refrains alternate like opposing counsel, never synthesizing. In the final quatrain, they stand adjacent (lines 18–19), mirroring the ethical deadlock where logical consistency clashes with moral intuition.

  The seven-agent scenario (two at -3, four at +4, one at +9 reduced to +5) isolates a specific tension in strong prioritarian aggregation. While standard prioritarianism usually avoids leveling down by valuing absolute welfare, extreme concavity in the priority function can mathematically recommend reducing the top agent's welfare to lower the weighted sum of suffering. The poem treats this not as a refutation, but as a structural feature of weighting itself: the form shows that without a external constraint, the two normative commitments will simply talk past each other indefinitely.
