  6.  **Final Polish:** Check against the user's constraints (breakdown, solid ground vs. slides, hidden steps, no winner). Ensure the tone is helpful and validates the user's curiosity. (The prompt mentions "ten quintillion" - actually estimates vary, but the scale is the point, so don't get bogged down in entomology stats).

