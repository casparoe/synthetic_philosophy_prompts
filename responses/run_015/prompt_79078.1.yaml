  3.  **Identify Hidden Assumptions & Talking Past Each Other:**
      *   *Hidden Assumption 1:* **Aggregation.** Dan assumes suffering aggregates linearly (1000 units of bug pain = 1 unit of cow pain). Elena might reject this (lexical superiority?).
      *   *Hidden Assumption 2:* **Epistemic Status.** Dan treats $P(\text{sentience})$ as a knowable statistic. Elena treats it as unknowable/meaningless.
      *   *Talking Past Each Other:* Dan is arguing *Expected Value* (utilitarian calculus). Elena is arguing *Epistemic Hygiene* (don't trust shaky inputs). They are fighting on different battlefields (Math vs. Meaning of the Math).

  4.  **Drafting the Response:**
      *   *Tone:* Analytical, neutral, accessible (user isn't a philosopher), structured.
