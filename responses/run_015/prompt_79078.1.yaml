          *   *Elena:* Probability is tiny *because* bugs lack machinery for rich experience. If probability is low, intensity is likely low too (dim flicker). Can't compare intensities if we admit ignorance. The "tiny probability $\times$ huge impact" move is dangerous (Pascal's Mugging). Probabilities are "noise," not real numbers.

  2.  **Deconstruct the Arguments (Move-by-Move):**

