      *   **Argument:** Extinction harms the former via interrupted continuity and the latter via lost legacy/audience. This bifurcation shows Scheffler overstates how much *individual* meaning depends on *distant strangers* surviving.
      *   **Audience:** Science-and-ideas podcast listeners (intellectually engaged, likely familiar with philosophical concepts but need clarity).
      *   **Constraints:** 8-10 questions. No biography. No summary questions.
      *   **Specific Requirements:**
          1.  Probe asymmetry between saving a future child vs. preserving a tradition.
          2.  Press on the objection that closure-dependent projects are *more* vulnerable (loss of witness/inheritor).
          3.  Ask what evidence/argument would convince her the conjecture applies symmetrically.
      *   **Format:** Question + Brief Follow-up (keyed to likely reply).

  2.  **Deconstruct the Guest's Position:**
      *   *Scheffler's Original View:* We care deeply about humanity surviving after our death. If we knew the world would end shortly after we die, we'd lose motivation/meaning in our current projects.
      *   *Guest's Revision:* It's not uniform.
          *   Type A (Open-ended/Collective): Needs indefinite future (e.g., physics, democracy). Harm = interruption.
          *   Type B (Closure-dependent/Personal): Needs completion/witnessing within a horizon (e.g., raising a kid, writing a book). Harm = no audience/heir.
      *   *Implication:* Scheffler is wrong to say *all* meaning relies on the "collective afterlife" of strangers. Some meaning is more local or immediate.

  3.  **Drafting Questions (Iterative Process):**

