      *   *Q5: Motivation and Despair.* Scheffler talks about losing motivation.
          *   *Draft:* Would we stop working?
          *   *Refinement:* Differentiate the *kind* of despair. Is it despair of completion or despair of contribution?
      *   *Q6: Intergenerational Justice.* Implications for ethics.
          *   *Draft:* What does this mean for climate change?
          *   *Refinement:* Does this bifurcation change our obligations to the far future vs. the near future?
      *   *Q7: The Symmetry Challenge (Required).* What would change her mind?
