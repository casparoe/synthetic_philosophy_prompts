prompt: |-
  I'm a QA engineer who spends all day writing test cases and debugging distributred pipelines. Me and my friend had this long arguement last night about testimony -- like, is believing someone just a special case of individual reasoning and perception, or is there something genuinely social about it that can't be broken down? Can you restate the reductionist vs anti-reductionist debate about testimony using the vocabulary I actually live in: unit tests vs integration tests, mock data vs production logs, black-box verification, coverage gaps, regression testing? Do it for both sides. Then tell me what doesn't survive the translation -- which philosophical claims map cleanly onto testing failures, which have to be distorted to fit, and which have no expression at all in QA terms. Is the residue showing that my framework is missing something, or that the philosophers are arguing about ghosts?
