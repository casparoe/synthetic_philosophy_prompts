answer: |-
  You have isolated a precise and powerful logical schema. You are correct that while its most famous instantiation is tied to epistemology, the structure itself is broader.

  Here is the breakdown you requested, addressing the name, the generalization, the distinctions, and the remedies.

  ### One: The Name and Minimal Conditions

  **The Name**
  The argument is canonically known as **Fitch's Paradox of Knowability** (or the **Knowability Paradox**). It was first published by Frederic Fitch in 1963, though Alonzo Church had noted it earlier in a referee report.

  However, you are right that this label is too narrow for the schema you have identified. In the literature on formal ontology and modal logic, when abstracted from knowledge, it is often referred to as the **Paradox of Factive Idealization** or simply the **Fitch-Church Derivation**.

  Regarding your memory of "blind spot": You are recalling the term **Epistemic Blind Spot**, coined by Roy Sorensen. Strictly speaking, a "blind spot" is a proposition that is true but *cannot* be known (e.g., $p \land \neg Kp$). The argument uses the existence of blind spots to generate a contradiction. While "blind spot" names the *proposition* generated by the construction, there is no single canonical word for the *argument schema* itself other than "Fitch's Derivation." If you need a descriptive label for print, **The Factivity Collapse Argument** is precise and neutral.

  **Minimal Conditions**
  The derivation requires four specific logical features. If any one is removed, the collapse fails.
  1.  **The Idealization Principle:** $\forall p (p \to \Diamond O p)$. (Every truth is possibly $O$-ed).
  2.  **Factivity:** $O p \to p$. (If $p$ is $O$-ed, $p$ is true).
  3.  **Conjunction Distribution:** $O(p \land q) \to (Op \land Oq)$. (To $O$ a conjunction is to $O$ the conjuncts).
  4.  **Classical Negation:** Specifically, the inference from $\neg \Diamond (A \land \neg A)$ to $\neg (A \land \neg A)$, and the move from $\neg \neg Op$ to $Op$ (Double Negation Elimination).

  The "load-bearing" feature you suspected is indeed **Factivity**. In your third example (justified belief), the derivation stalls because justification is not factive ($Jp \does not imply p$). Without factivity, $O(p \land \neg Op)$ does not entail a contradiction, because $O(\neg Op)$ does not entail $\neg Op$.

  ### Two: Generalization

  The schema generalizes robustly to any operator that satisfies the minimal conditions above.

  **(a) Relativization to Knowers**
  *   *Weak:* "For every truth, there is *someone* who could know it" ($\forall p (p \to \Diamond \exists x Kx p)$).
  *   *Strong:* "For every truth, *anyone* could know it."
  *   *Result:* The paradox holds for the **Weak** version provided the distribution and factivity axioms apply to the existential quantifier. If it is possible that *someone* knows $p \land \neg (\text{someone knows } p)$, that someone must know that no one knows it. But if they know it, someone knows it. Contradiction.
  *   *Implication:* The collapse does not require a single omniscient mind; it requires only that the *totality* of truths be collectively knowable.

  **(b) Temporal Recasting**
  *   *Principle:* "Every truth is known at *some* time" ($\forall p (p \to \exists t K_t p)$).
  *   *Result:* This collapses to **Temporal Omniscience**: "Every truth is known at *some* time" becomes "Every truth is known *always*" (or rather, there are no truths that remain forever unknown).
  *   *Nuance:* If the modal $\Diamond$ is read as "at some future time," the derivation proves that there are no truths that are *never* known. It does not prove all truths are known *now*, but it proves the set of unknown truths is empty *eventually*.

  **(c) Weakening to Decidability**
  *   *Principle:* "Every truth is decidable" ($\forall p (p \to \Diamond (Kp \lor K\neg p))$).
  *   *Result:* This also collapses. If $p$ is true, then $\Diamond (Kp \lor K\neg p)$. Since $p$ is true, $\neg p$ is false. By Factivity, $K\neg p$ is impossible. Therefore, $\Diamond Kp$. We are back to the original Knowability Principle, and the collapse proceeds.
  *   *Implication:* You cannot save the principle by retreating from "knowable" to "settlable."

  **What this tells us:** The work is done entirely by the interaction of **Factivity** and **Distribution**. Any operator that tracks truth (factive) and aggregates over conjunctions will succumb to this pressure if idealized universally.

  ### Three: What This Pattern Is Not

  You are correct that it sits near several other phenomena but is distinct from them.

  **(i) Versus Ordinary Modal Collapse**
  *   *Modal Collapse:* Typically refers to the S5 axiom $\Diamond \Box p \to \Box p$, where possibility of necessity implies necessity. This is a feature of the *modal logic system*.
  *   *Fitch Collapse:* This is not a feature of the modal system (it works in weak modal logics like K or T). It is a feature of the *specific operator* $O$. It shows that a specific kind of potentiality ($\Diamond O$) is equivalent to actuality ($O$) *only for factive operators*.
  *   *Difference:* Modal collapse is axiomatic; Fitch collapse is derivational from the semantics of the operator.

  **(ii) Versus Liar/Self-Reference**
  *   *Liar:* Relies on semantic closure and truth-value gaps (a sentence asserting its own falsity).
  *   *Fitch:* Does not require self-reference in the object language. The proposition $p \land \neg Op$ is not self-referential; it is a conjunction of a truth and a claim about its epistemic status. The contradiction arises not from truth-value instability, but from the **logical impossibility of the state of affairs** being $O$-ed.
  *   *Difference:* The Liar is a semantic paradox; Fitch is a modal-epistemic inconsistency.

  **(iii) Versus Gödelian Incompleteness**
  *   *Gödel:* Proves that in any strong enough system, there *are* true but unprovable statements ($\exists p (p \land \neg \Box p)$).
  *   *Fitch:* Proves that if you assume all truths are *possibly* provable, then there *are no* true but unprovable statements.
  *   *Difference:* Gödel is a limitative result about formal systems. Fitch is a *reductio* of a philosophical principle (Verificationism). They are often in tension: Gödel suggests Fitch's premise is false.

  **(iv) Versus Moorean Absurdity**
  *   *Moore:* "It is raining, but I don't believe it" ($p \land \neg Bp$). This is logically consistent but pragmatically absurd to assert.
  *   *Fitch:* "It is raining, but it is not known" ($p \land \neg Kp$). This is logically consistent. However, "It is known that (it is raining but not known)" ($K(p \land \neg Kp)$) is **logically impossible** (given factivity).
  *   *Difference:* Moorean sentences are unknowable *by the speaker* (indexical). Fitch sentences are unknowable *simpliciter* (logical).

  ### Four: The Fixes and Restrictions

  **The Restriction Strategy**
  The proposal to restrict the quantifier so it does not range over propositions containing the operator $O$ is known as the **Cartesian Restriction** (championed by Neil Tennant).
  *   *Principled or Ad Hoc?* Critics call it ad hoc (gerrymandering the domain to avoid the counterexample). Proponents argue it is principled: the Knowability Principle should only apply to **Cartesian Propositions**—those where $Op$ is not logically inconsistent. Since $O(p \land \neg Op)$ is inconsistent, $p \land \neg Op$ is not Cartesian, and the principle never applies to it.
  *   *Vicious Circle:* Yes, this is structurally identical to Russell's **Vicious Circle Principle**. You cannot define a totalities (all truths) in a way that quantifies over items (propositions) that presuppose the totality (the operator $O$ applied to them). The restriction prevents the operator from "looping back" on the domain that defines its own possibility.

  **Alternative Fixes**
  1.  **Intuitionistic Logic:** (Proposed by Dummett). If you reject Classical Negation (specifically Double Negation Elimination), the derivation stalls at $\neg \neg Op$. You can conclude "It is not the case that $p$ is unknown," but you cannot conclude "$p$ is known." This saves Verificationism but costs Classical Logic.
  2.  **Non-Factive Operators:** As you noted, switching to Justified Belief ($J$) blocks the proof. But this abandons the link to *Truth*, which is usually what Verificationists want.
  3.  **Situation Semantics:** Arguing that knowledge is situational, so $K(p \land \neg Kp)$ fails because the situation where $p$ is known is not the situation where $\neg Kp$ is evaluated. (This modifies the Distribution axiom).

  ### Summary Definition for Print

  If you wish to define this phenomenon in your own work, I suggest the following formulation:

  > **The Factivity Collapse Schema:** A modal-logical derivation demonstrating that for any factive operator $O$ satisfying conjunction distribution, the principle that 'all truths are possibly $O$-ed' entails the conclusion that 'all truths are actually $O$-ed.' The derivation turns on the logical impossibility of $O$-ing a 'Fitch-conjunction' ($p \land \neg Op$), thereby rendering the existence of any un-$O$-ed truth incompatible with the idealization principle.

  This captures the structure without tying it exclusively to knowledge, acknowledges the role of factivity, and identifies the specific propositional form that drives the contradiction.
