      *   **Integrity Objection:** Broader. Focuses on the *structure* of agency. Utilitarianism makes the agent a neutral channel for satisfaction, disconnecting them from their "ground projects" that give life meaning. It's about identity, not just awkward deliberation.
      *   **Habituation Reply:** "Just train yourself to do it automatically." Williams's counter: This doesn't solve the structural problem. Even if unconscious, the *justification* remains external. Also, cultivating such habits might itself be alienating or impossible without losing the genuine concern that makes relationships valuable.
      *   **Effective Altruist (EA) Counter-example:** If someone's project *is* utilitarianism, do they have integrity? Williams would say this misses the point. Integrity protects the *diversity* of projects that make us individuals. If everyone's project is impartiality, we lose the personal point of view entirely. Also, it turns the agent into a vessel for the theory rather than the theory serving the agent's life.
      *   **Sanctuary Amendment:** "Personal sphere protected for consequentialist reasons." Williams's counter: This is still contingent. If maximizing utility required violating the sphere tomorrow, the protection vanishes. The agent's life is still on loan from the utility principle.

