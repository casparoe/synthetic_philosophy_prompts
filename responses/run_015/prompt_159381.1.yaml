      Regarding the "sanctuary" amendment: your instinct is correct. Carving out a personal sphere for consequentialist reasons leaves the sphere contingent. It exists only so long as it serves the master principle of utility. If maximizing good suddenly requires violating that sphere, the protection vanishes. This confirms the integrity objection: the agent's life and projects are held on loan from the utilitarian calculus. They are not truly *theirs*.

      So, where is your student going wrong? They are reducing a metaphysical objection about agency to a psychological complaint about discomfort. Williams isn't saying utilitarianism feels bad; he's saying it misunderstands what it is to be a person. You cannot fix this by tweaking the deliberation or granting temporary exemptions. The conflict lies in the demand that the agent be neutral between their own life and the general good.

