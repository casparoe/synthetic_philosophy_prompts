answer: |-
  Your seminar student has identified a surface similarity but missed the structural distinction. The "one thought too many" objection targets the *phenomenology of deliberation* in specific moments. It asks why a husband needs a utilitarian calculation to save his wife when love should suffice. The integrity objection is deeper: it targets the *structure of agency* over a lifetime. It argues that utilitarianism separates the agent from their "ground projects"—the commitments that give life meaning—by making them merely a vessel for satisfying impersonal outcomes. One is about awkward thinking; the other is about the disintegration of the self.

  The habituation reply fails because it treats alienation as a psychological bug rather than a structural feature. Even if utilitarian deliberation becomes second nature, the *justification* for the action remains external to the agent's personal commitments. Furthermore, genuine personal relationships require that the motive be the relationship itself, not a trained impulse to maximize good. Cultivating such habits might itself be an alienating project, turning the agent into a tool of the theory. It solves the feeling of awkwardness by removing the conscious thought, but it leaves the normative demand intact.

  Your Effective Altruist counter-example is sharp, but it concedes Williams's point. If an agent's only ground project is impartial beneficence, they have indeed surrendered their personal point of view to the moral theory. Williams's concern isn't merely that agents *feel* alienated; it's that the theory *invalidates* the personal standpoint as morally fundamental. A theory that requires you to abandon all personal projects to be moral hasn't solved the integrity problem; it has abolished the integrity it was meant to respect. The objection holds even if the agent doesn't feel it, because the theory denies the independent value of their individuality. For your undergrads, emphasize this: Williams is not protecting selfishness; he is protecting the possibility of having a life that is distinctly one's own.

  Regarding the "sanctuary" amendment: your instinct is correct. Carving out a personal sphere for consequentialist reasons leaves the sphere contingent. It exists only so long as it serves the master principle of utility. If maximizing good suddenly requires violating that sphere, the protection vanishes. This confirms the integrity objection: the agent's life and projects are held on loan from the utilitarian calculus. They are not truly *theirs*. The permission is revocable. This means the agent never truly owns their life; they are merely managing it on behalf of the utility principle.

  So, where is your student going wrong? They are reducing a metaphysical objection about agency to a psychological complaint about discomfort. Williams isn't saying utilitarianism feels bad; he's saying it misunderstands what it is to be a person. You cannot fix this by tweaking the deliberation or granting temporary exemptions. The conflict lies in the demand that the agent be neutral between their own life and the general good. This neutrality is what Williams finds unintelligible for a human being.

  For your lecture: Keep the distinctions sharp. One thought too many = inappropriate motive in specific cases. Integrity = the threat to the agent's identity across all cases. Habituation = masking the problem. Sanctuary = lending the solution. The EA case = proof of the theory's totalizing demand, not a refutation of the critique.
