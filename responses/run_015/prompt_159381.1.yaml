      The habituation reply fails because it treats alienation as a psychological bug rather than a structural feature. Even if utilitarian deliberation becomes second nature, the *justification* for the action remains external to the agent's personal commitments. Furthermore, genuine personal relationships require that the motive be the relationship itself, not a trained impulse to maximize good. Cultivating such habits might itself be an alienating project, turning the agent into a tool of the theory.

