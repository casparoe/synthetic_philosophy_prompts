          3.  **Moral-Political Substitution:** Valuing the work *solely* for its ethical stance or political outcome, ignoring how that is achieved aesthetically. (WKR because moral goodness $\neq$ aesthetic goodness, though they can overlap).

  3.  **Drafting the Procedure (The Checklist):**

