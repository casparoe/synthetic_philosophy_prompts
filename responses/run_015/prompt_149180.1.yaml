answer: |-
  # Audit Procedure: Juror Rationale Validity Check (WRK-Audit v1.0)

  **To:** Administrative Secretary
  **From:** Prize Board Protocol
  **Subject:** Audit of Juror Rationales for Wrong-Kind Reasons
  **Time Budget:** 2 Hours Total (Approx. 20 Minutes per Rationale + 20 Minutes Reporting)
  **Constraint:** Jurors have no philosophical training; Board Chair requires plain English.

  ---

  ## Part 1: The Taxonomy of Wrong-Kind Reasons (WKRs)

  In aesthetic judgment, a "right-kind reason" (RKR) cites a feature of the work itself that makes it valuable *as art* (e.g., prose rhythm, structural coherence, character complexity). A "wrong-kind reason" (WKR) cites a feature external to the work's artistic merit that explains the vote but does not justify the artistic value.

  To make this actionable without philosophy jargon, we use this three-part taxonomy:

  1.  **Biographical-Projection Reasons**
      *   **Definition:** Valuing the work because of *who* wrote it or *who* is reading it, rather than what the text achieves.
      *   **Why it is WKR:** Aesthetic value resides in the object's properties, not the subject's identity. Resonance is a psychological effect, not an artistic merit.
      *   **Example:** "I love this because the author is from my hometown."

  2.  **Market-Proxy Reasons**
      *   **Definition:** Valuing the work based on its commercial viability, career impact, or "relevance" to current trends.
      *   **Why it is WKR:** A prize for fiction judges artistic excellence, not economic utility. Sales potential is a consequence of value, not the value itself.
      *   **Example:** "This will sell well, so it should win."

  3.  **Moral-Political Substitution Reasons**
      *   **Definition:** Valuing the work *solely* for its ethical stance or political outcome, without referencing how that stance is achieved aesthetically.
      *   **Why it is WKR:** A work can be morally good but aesthetically poor (e.g., propaganda). The prize rewards the *artistic handling* of themes, not the themes themselves.
      *   **Example:** "This book is important because it supports a good cause."

  *Why this taxonomy helps:* Treating "wrong kind" as a single category is too vague. By splitting it, you can identify *which* external pressure is distorting the judgment, allowing for more precise feedback to the Board.

  ---

  ## Part 2: The Decision Checklist

  **Instructions:** Read the juror's written rationale. Move through steps 1–4. Stop at the first stopping condition.

  ### Step 1: The "Because" Test
  **Question:** Does the rationale explain the ranking using features of the *text* (language, structure, form, imagery) or features of the *context* (author, reader, market, society)?
  *   **Pass (Proceed to Step 2):** The rationale explicitly mentions textual features (e.g., "the pacing," "the metaphor," "the voice").
  *   **Flag (Stop):** The rationale mentions *only* context (e.g., "the author's history," "the sales potential," "the political message").
  *   **Secretary Review (Proceed to Step 2):** The rationale mixes both or is ambiguous.

  ### Step 2: The Taxonomy Match
  **Question:** Does the rationale contain phrases matching the **Test Patterns** (see below) associated with Biographical, Market, or Moral-Substitution reasons?
  *   **No Match (Clear):** The rationale is free of WKR patterns. **AUDIT PASSED.**
  *   **Match Found (Proceed to Step 3):** The rationale triggers a WKR pattern.

  ### Step 3: The Aesthetic Bridge
  **Question:** Even if a WKR pattern is present, does the juror connect it to *craft*? (e.g., "The political message is powerful *because of the subtle imagery used to convey it*.")
  *   **Yes (Clear):** The external reason is grounded in an aesthetic mechanism. **AUDIT PASSED.**
  *   **No (Flag):** The external reason stands alone as the justification. **FLAG FOR BOARD.**
  *   **Ambiguous (Secretary Review):** It is unclear if the juror implies an aesthetic bridge but didn't write it. **HAND TO SECRETARY.**

  ### Step 4: Secretary Judgment (Irreducible Call)
  **Action:** If Step 3 returns "Ambiguous," you must decide if the silence on craft is a writing oversight or a philosophical error.
  *   **Decision:** If you believe the juror *meant* aesthetic merit but wrote poorly, **CLEAR**. If you believe they genuinely prioritized the external factor, **FLAG**.
  *   **Reporting:** Document this decision in your report to the Chair as "Secretary Discretion."

  ---

  ## Part 3: Test Sentences & Patterns

  Scan the text for these triggers. Presence does not guarantee a flag, but it triggers Step 3.

  | Category | Trigger Phrases (High Risk) | Nuanced Phrases (Requires Step 3) |
  | :--- | :--- | :--- |
  | **Biographical** | "As a [identity]...", "Finally someone like me...", "The author's struggle..." | "The voice feels authentic to..." (Could be aesthetic) |
  | **Market** | "Relevant," "Buy this," "Career-making," "Audience needs..." | "Timely," "Resonates with current moment..." (Could be thematic) |
  | **Moral-Sub** | "Important message," "Restoring dignity," "Needs to be heard," "Right thing to do." | "Ethically complex," "Challenges our views..." (Could be aesthetic) |

  ---

  ## Part 4: Worked Examples of Procedure Outcomes

  ### Example A: Correct Flag (Biographical-Projection)
  *   **Rationale:** "I ranked this first because as a survivor of addiction, I finally feel seen. The author's bio says they struggled too, and that truth matters more than plot."
  *   **Step 1:** Context (Identity/Author). **Proceed.**
  *   **Step 2:** Match ("As a survivor," "author's bio"). **Proceed.**
  *   **Step 3:** Aesthetic Bridge? No ("truth matters more than plot"). **FLAG.**
  *   **Outcome:** Correctly identified as WKR.

  ### Example B: Clear (Initially Suspicious)
  *   **Rationale:** "This book is politically urgent. It achieves this urgency through a fragmented narrative structure that forces the reader to experience the chaos of war."
  *   **Step 1:** Mix (Politics + Structure). **Proceed.**
  *   **Step 2:** Match ("Politically urgent"). **Proceed.**
  *   **Step 3:** Aesthetic Bridge? Yes ("achieves this... through fragmented narrative"). **CLEAR.**
  *   **Outcome:** Correctly cleared. The political value is tied to craft.

  ### Example C: Unwanted Result (False Positive)
  *   **Rationale:** "This novel restores dignity to a marginalized history. It is a vital contribution."
  *   **Step 1:** Context (History/Contribution). **Proceed.**
  *   **Step 2:** Match ("Restores dignity," "vital contribution"). **Proceed.**
  *   **Step 3:** Aesthetic Bridge? None explicitly stated. **FLAG.**
  *   **Outcome:** **Unwanted Result.** A juror might believe "restoring dignity" *requires* aesthetic mastery, but failed to write it down. The procedure flags it as Moral-Substitution, but on reflection, you (Secretary) might feel this is a legitimate, albeit poorly articulated, aesthetic judgment about the work's *power*. This highlights the procedure's rigidity.

  ---

  ## Part 5: Application to Current Juror Rationales

  Apply the checklist to the three specific rationales received this year.

  ### Case 1: The Traumatic Autofiction
  *   **Rationale:** "I rank this highly because it finally lets people like me see our suffering represented."
  *   **Audit:**
      *   **Step 1:** Context (Reader identity/Representation).
      *   **Step 2:** Match ("People like me," "see our suffering"). **Biographical-Projection.**
      *   **Step 3:** Aesthetic Bridge? None. No mention of how the representation is achieved.
      *   **Decision:** **FLAG.**
      *   **Report Note:** Juror substitutes reader resonance for textual analysis.

  ### Case 2: The Experimental Novel
  *   **Rationale:** "I dismiss this because no one will buy this, and the prize should stay relevant."
  *   **Audit:**
      *   **Step 1:** Context (Sales/Relevance).
      *   **Step 2:** Match ("No one will buy," "stay relevant"). **Market-Proxy.**
      *   **Step 3:** Aesthetic Bridge? No. Explicitly prioritizes market over art.
      *   **Decision:** **FLAG.**
      *   **Report Note:** Juror prioritizes commercial viability over artistic merit.

  ### Case 3: The Historical Epic
  *   **Rationale:** "I praise this solely for restoring dignity to a marginalized group."
  *   **Audit:**
      *   **Step 1:** Context (Social outcome).
      *   **Step 2:** Match ("Restoring dignity"). **Moral-Political Substitution.**
      *   **Step 3:** Aesthetic Bridge? No ("Solely for").
      *   **Decision:** **FLAG (with Secretary Judgment).**
      *   **Secretary Judgment Call:** The word "solely" makes this a hard flag. However, if the juror implies that the *act of writing the epic* is the restoration, there is an implicit aesthetic claim.
      *   **Action:** I will **FLAG** this per the procedure, but add a note to the Chair that this may be a "False Positive" if the juror views the epic form itself as the mechanism of dignity. The procedure cannot distinguish between "good politics" and "politics achieved through good art" without explicit text.

  ---

  ## Part 6: Limitations & Misfires

  You must append this section to your report to manage Board expectations.

  **1. The False Positive Risk (Over-Flagging)**
  *   **Where it misfires:** As seen in Case 3, a juror may assume that "dignity" or "relevance" *implies* artistic success. If they are lazy writers but good readers, the procedure will flag them.
  *   **Mitigation:** Secretary (Me) reviews all Flags before they reach the Board to filter for obvious articulation failures.

  **2. The False Negative Risk (Under-Flagging)**
  *   **Where it misfires:** A juror can use aesthetic language ("beautiful prose") to mask a WKR (e.g., the prose is only "beautiful" to them because of the author's identity). The procedure cannot read subtext.
  *   **Mitigation:** None. This requires philosophical mind-reading.

  **3. What This Procedure Cannot Settle**
  *   **Disagreements on Aesthetic Theory:** If a juror believes "political impact" *is* an aesthetic category (e.g., Feminist Aesthetics), this procedure will flag their reasoning as WKR. The procedure assumes a formalist-leaning definition of art.
  *   **Board Decision:** If a juror contests a Flag, the Board must decide if the prize's definition of "excellence" includes political utility. I cannot rule on that.

  ---

  ## Part 7: Reporting Protocol

  **To:** Board Chair
  **From:** Administrative Secretary
  **Time:** Within 2 hours of rationale receipt.

  **Format:**
  1.  **Summary:** "X of 5 rationales flagged for Wrong-Kind Reasons."
  2.  **Details:** List Flagged Jurors by ID (maintain confidentiality). State which Taxonomy Category triggered the flag (Biographical, Market, Moral).
  3.  **Secretary Notes:** Indicate if any Flag was a "Judgment Call" (e.g., Case 3).
  4.  **Recommendation:** "Request Board review of Flagged Rationales to determine if they violate Prize Mandate Section 4 (Artistic Merit)."

  **Sign-off:**
  *   **Secretary:** Signs off on the *process* (confirming the audit was run).
  *   **Board Chair:** Signs off on the *verdict* (confirming whether the reasons are acceptable for this Prize).

  ---

  ### Practical Constraints Checklist
  *   [ ] **Time:** 20 mins per rationale. (If a rationale takes >25 mins, mark as "Complex" and escalate).
  *   [ ] **Literacy:** No philosophy terms used in report to Chair.
  *   [ ] **Confidentiality:** Juror names redacted in initial audit log.
  *   [ ] **Final Authority:** Board Chair decides on contested flags; Secretary administers the test.
