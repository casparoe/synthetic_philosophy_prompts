  Tessa shot back that the promise thing is basically made up, like nobody actually promises when they say "the milk is in the fridge," and that if anything misleading is the worse move because it's sneakier and he can deny it later, whereas lying at least means you own your words.

  Marcus said sneakier isn't the same as worse, and that the reason lying feels worse is that it messes with the one thing the listener is allowed to trust, which is what you actually said, and you can't do that with misleading because nothing was said about the other cookies. he also said if there's no real difference then a politician who says true but misleading stuff is just as bad as one who flat out lies, which he thinks is wrong.

