answer: |-
  **The Script**

  **Chair:** "Tally: Majority accepts P. Majority accepts Q. Majority rejects 'Buy'."
  **Alex:** "So we agree it's good and we're rich, but we're drinking instant?"
  **Chair:** "Premise-based procedure. Individually consistent, collectively contradictory."
  **Sam:** "Fix it. Conclusion-based voting. Ignore the reasons."
  **Chair:** "Done. 'Buy' fails. But the secretary already minuted our judgments on P and Q."
  **Alex:** "So the official record says 'True, True, False'?"
  **Chair:** "Precisely. The decision is valid; the committee's mind is not."
  **Sam:** "We look insane."
  **Chair:** "No, we look like a doctrinal paradox. Next item: Should we trust this committee?"

  ***

  **The Mechanics Note**

  This relies on **Judgment Aggregation**, not Preference Aggregation. There are no preference cycles (Condorcet) here; individuals have transitive preferences. The inconsistency arises from logically connecting propositions ($P \land Q \rightarrow R$).

  | Member | P (Good) | Q (Afford) | Buy (P & Q) |
  | :--- | :---: | :---: | :---: |
  | **1** | Yes | Yes | Yes |
  | **2** | Yes | No | No |
  | **3** | No | Yes | No |
  | **Majority** | **Yes** | **Yes** | **No** |

  **Beat 1** rides on the **Discursive Dilemma**: premise-based aggregation yields a logically inconsistent collective set ($P, Q, \neg(P \land Q)$).
  **Beat 2** shows the **Inconsistency Robustness**: switching to conclusion-based voting fixes the decision but leaves the *recorded judgments* inconsistent. The group mind remains irrational regardless of the procedure.
