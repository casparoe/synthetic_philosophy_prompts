  **Mark: 14/20**
  **Range:** High 2:1. This lands at the upper end of the second-class bracket because the grasp of the core Leibniz's Law argument (Part 1) and the material distinction (Part 3) is excellent and shows genuine engagement. However, it misses the top bracket due to significant inaccuracies in Part 2 regarding the ontological commitments of the Constitution View (specifically on co-location and reconstruction), which leads to incorrect answers on which claims must be denied.

  **Comments:**

  **Para 1:** Fine as it stands. You set out the argument clearly and the caveat about not using sortal properties themselves is precisely correct and often missed.

  **Para 2:** Fine as it stands. This wasn't strictly required, but the point about grounding persistence conditions in kind-membership is creditable (iv) and shows you understand the deeper metaphysical worry behind the argument.

  **Para 3:** Flag (iii) on the eliminativist comment in parentheses. The question defines the view as "no statue but only matter arranged statue-wise." You suggest the eliminativist should "give up the clay as well." If 'clay' here refers to the matter (as it does in the prompt's 'C'), the eliminativist retains it. If you mean the *object* 'lump of clay', you need to distinguish this from the matter itself to avoid conflating the matter with the composite object.

  **Para 4:** Flag (ii) and (iii). You argue the Constitution theorist should accept (c) (S* = S) based on restored arrangement. However, standard Constitution View typically holds that destruction (Tuesday) ends the statue's existence; reconstruction creates a *new* statue. Accepting (c) commits one to intermittent existence, which is a significant cost, not a standard feature. Furthermore, flag (i): you accept (b) (S does not exist Wednesday) and (c) (S* = S, and S* exists Wednesday) simultaneously. Unless you explicitly argue for intermittent existence, these are contradictory: if S = S*, and S* exists Wednesday, S exists Wednesday, contradicting (b).

  **Para 5:** Flag (i) and (ii). You argue the Constitution theorist can accept (d) ("At no time are there two material objects") by claiming they are "one and the same portion of reality." This conflates constitution with identity or descriptive variance. The core commitment of Constitution-without-Identity is that there *are* two distinct objects coincident. The cost of the view is precisely denying (d). Trying to reinterpret (d) to save the view misunderstands the objection: the objection is that there are two *objects*, not two independent portions of reality.

  **Para 6:** Fine as it stands. The point about mass terms ('clay') versus count nouns ('bronze') reducing the intuitive cost of coincidence is creditable (iv) and answers the prompt well.

  **Note to Course Leader (Question Design):**
  Claims (b) and (c) are logically inconsistent on standard interpretations. (b) states S does not exist on Wednesday. (c) states S* (which exists on Wednesday) is identical to S. If S = S*, then S exists on Wednesday. This forces every consistent view to deny at least one, but the phrasing invites students to accept both via intermittent existence without recognising the contradiction. Additionally, regarding (d), the Constitution View *must* deny this by definition. Allowing students to argue they can accept it by redefining "two objects" undermines the purpose of asking about "costs," as it lets them talk away the central objection rather than weigh it. You may want to decouple (b) and (c) or clarify that S* is a *new* statue in future iterations.
