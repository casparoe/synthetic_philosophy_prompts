answer: |-
  **Question**
  Does personal survival matter in degrees, and do distinct practical attitudes track these degrees differently? Parfit argues identity is not what matters, claiming psychological continuity suffices. In branching cases, he asserts both successors survive equally well, dissolving the identity question. This thesis challenges the assumption that "what matters" is a unified scalar value. Instead, it asks whether practical norms like promising, debt, and blame decouple from prudential concern in fission scenarios. If survival matters in degrees that do not sum to one, do normative obligations fragment accordingly? The project determines whether a unified theory of survival-based norms is viable or if we require a pluralistic account where different practical attitudes respond to different metaphysical relations.

  **Why it's still open**
  The standard Parfitian response treats branching as a dissolution: if identity isn't what matters, having two successors is as good as one. This view is parsimonious and aligns strongly with prudential intuitions regarding fear of death. Its strength lies in simplifying metaphysics without losing normative grip on survival. However, it assumes "what matters" is a monolithic relation tracking psychological continuity. Current literature focuses heavily on self-interest, neglecting interpersonal norms like debt ownership or blame attribution. My friend's position relies on the intuition that psychological connectedness suffices for all practical purposes. Yet, if a "cold backup" emerges thirty years later, connectedness is weak, but legal ownership might persist. The gap lies in mapping specific practical attitudes to specific metaphysical relations rather than assuming a single "survival" metric governs all normative outcomes. My framing's weakness is risking ad hoc complexity: proposing degrees without a principled metric for how they distribute. The question remains open because most arguments stop once prudential intuition is satisfied, leaving interpersonal obligations untheorized in fission cases. This project tests whether that simplification hides genuine normative conflicts.

  **Method**
  The semester divides into three distinct phases to ensure rigorous development beyond intuition pumping. Weeks 1-4 focus on exegesis and reconstruction. I will reconstruct the strongest Parfitian argument against identity, ensuring the "branching settles it" claim is steel-manned rather than dismissed. This prevents straw-manning my friend's position and forces my argument to overcome the best version of reductionism. Weeks 5-10 involve case construction and normative testing. I will develop the staggered, lossy, and cold backup cases not merely to pump intuitions, but to isolate variables like psychological connectedness, causal dependence, and temporal gap. For each case, I will test distinct practical attitudes separately: does the promise hold? Is the debt owed? Is blame appropriate? This avoids conflating prudential concern with moral obligation. I will document where intuitions diverge across these attitudes. Weeks 11-15 focus on synthesis and theory building. I will attempt to construct a pluralistic model where different attitudes track different relations. If a unified model emerges, I will defend it; if not, I will argue for fragmentation. The method prioritizes conceptual coherence over raw intuition. If intuitions conflict, I will seek reflective equilibrium with established normative principles rather than privileging immediate reactions to thought experiments. This ensures the thesis argues for a structural change in how we model survival, not just a new set of counter-examples. I will write weekly drafts to track argumentative drift.

  **What a result looks like and what would mean the project failed**
  A successful result will either demonstrate a coherent mapping where specific practical attitudes track specific metaphysical relations (e.g., blame tracks causal responsibility, promises track psychological continuity) or prove that such mapping is impossible, forcing a return to a unified view. Success means providing a principled reason why one successor might owe a debt while the other does not. Failure would look like merely accumulating conflicting intuitions without a governing principle. If I cannot distinguish why prudential concern fragments while promissory obligation does not, the project fails to move beyond the standard debate. Another failure condition is relying too heavily on the stipulative details of the thought experiments. If the argument collapses without the specific mechanics of the "lossy scan," the thesis is merely about science fiction mechanics rather than personal identity. The goal is a normative framework, not a taxonomy of teleportation errors.

  **Scope risks**
  The primary risk is covering too many practical attitudes. If promising, debt, blame, and ownership all yield distinct results, the paper becomes a list. I will prioritize promising and prudential concern as core test cases, treating blame and ownership as secondary. Additionally, metaphysical details of the teleportation cases could consume excessive space. I must limit technical descriptions of the "staggered scan" to only what is necessary to break psychological connectedness. If the semester tightens, I will drop the "cold backup" case and focus solely on branching variations. The temporal gap introduces complications regarding memory and aging that might distract from the core fission argument.
