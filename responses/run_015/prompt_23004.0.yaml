      *   *The Problem:* We cannot make the just strong, so we make the strong just.
      *   *The Illusion:* We need to distinguish the two, but society conflates them to maintain order.
      *   *Custom/Geography:* "Justice on this side of the Pyrenees, error on the other." Laws are often arbitrary customs solidified by time and power.
      *   *Theological Context:* Pascal is a Jansenist Catholic. He believes true justice is God's law. Human justice is fallen, corrupted by *concupiscence* (self-love/lust for power). However, order is still necessary to prevent chaos (Augustinian view of the State).

  3.  **Apply Pascal to the UN Security Council (UNSC):**
