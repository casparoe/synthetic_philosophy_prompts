      *   **The Christian Layer:** This is crucial. For Pascal, *all* human justice is flawed. So criticizing the UN for being flawed is like criticizing a bucket for leaking water—it's what buckets do. The UN is a temporal remedy for sin, not a realization of the Kingdom of God.

