answer: |-
  This is a fantastic question because it cuts right to the heart of political realism versus idealism, using one of the sharpest philosophical knives available: Blaise Pascal.

  To give you a direct answer: **Marcus is right about the *diagnosis*, but you are right about the *prescription*.** However, Pascal would argue that both of you are missing the theological stakes that make the whole system intelligible.

  If we look strictly at the *Pensées* (specifically fragments regarding "Force and Justice," "Custom," and the "Fallen Nature of Man"), Pascal offers a framework that validates Marcus's cynicism about the *origin* of the law, but validates your defense of the *function* of the institution.

  Here is how Pascal would dissect the UN Security Council (UNSC), the veto, and international law.

  ### 1. The Core Dialectic: "Justice Without Force is Powerless"
  Pascal's most famous formulation on this is in *Pensées* fragment 103 (Lafuma): *"Justice without force is powerless; force without justice is tyrannical."*

  He argues that because we cannot make what is just become strong, we have made what is strong become just.

  **Applied to the UNSC Veto:**
  Pascal would look at the P5 (Permanent Five) veto and nod grimly. The veto is the explicit codification of the principle that **Force will not submit to Justice.**
  *   **Marcus's Point:** When the US, Russia, or China veto a resolution, they are admitting that their national interest (Force) supersedes the collective will of the international community (Justice). Pascal would say this proves Marcus right: the system is ultimately anchored in power, not morality. The "law" stops exactly where the "power" says it stops.
  *   **Pascal's Nuance:** However, Pascal would not call this a "sham" in the sense of being useless. He would say it is an honest admission of the human condition. A world government that tried to enforce "Justice" against the will of the nuclear-armed powers would collapse into chaos. By giving the powerful a veto, the UN acknowledges the reality of Force. It prevents the "Justice" of the UN from becoming suicidal.

  ### 2. Custom and Antiquity: "Justice on This Side of the Pyrenees"
  Pascal is a legal skeptic. He famously argued that laws vary so wildly by geography and time that they cannot be based on universal natural justice. Instead, they are based on **custom** and **antiquity**. We obey laws not because they are inherently "good," but because they are established and we are used to them.

  **Applied to the P5 Structure:**
  Why are the US, UK, France, Russia, and China permanent members? Because they won World War II.
  *   **Pascal's Analysis:** He would view the UN Charter not as a divine tablet of justice, but as a **custom solidified by victory.** It is "Justice on the side of the Victors."
  *   **The Role of Time:** Pascal argues that time legitimizes power. "Custom creates the whole of equity, for the simple reason that it is accepted." The fact that the P5 structure has existed since 1945 gives it a veneer of legitimacy it wouldn't have if it were created yesterday.
  *   **Verdict:** Marcus is right that the *source* of the authority is arbitrary power. But Pascal would add that *all* human authority comes from arbitrary power eventually. The US Constitution, the British Monarchy, the French Republic—all rest on moments of force that were later smoothed over by time and custom. The UN is no different.

  ### 3. The Pretext: Why the "Institutional Wrapping" Matters
  This is where your argument gets its strongest Pascalian support. Pascal writes: *"Force is a worldly quality, as is the pleasure of kings... We cannot make the just strong, so we make the strong just."*

  He argues that Force needs the **pretext** of Justice to be stable. Naked tyranny is unstable because people resent it. Tyranny dressed as Law is stable because people obey it.

  **Applied to International Law:**
  *   **Your Point:** You argued that institutions "drag things away from raw power."
  *   **Pascal's Agreement:** He would say the "institutional wrapping" is not just decoration; it is the **civilizing mechanism.** When the US wants to invade a country, it tries to get a UN Resolution. Why? Because even the most powerful nation knows that acting on pure Force is costly and unstable. They need the *robe* of Justice.
  *   **The Veto's Function:** Even the veto is dressed up. It's not called "The Right to Be a Bully"; it's called "The Responsibility to Maintain Great Power Consensus." Pascal would say this linguistic framing is essential. It forces the powerful to speak the language of justice, even when they are acting in self-interest. This constrains them slightly, because they have to maintain the *illusion*.
  *   **Conclusion:** The UN doesn't eliminate "might makes right," but it forces "might" to wear a suit and tie. That matters. It makes power legible and somewhat predictable.

  ### 4. The Christian Layer: True Justice vs. Human Order
  This is the part Marcus likely missed, and it's the key to the whole puzzle. Pascal is a Jansenist Catholic. He believes that due to Original Sin, **True Justice is impossible for humans.**

  *   **Divine Justice:** Only God possesses true justice.
  *   **Human Justice:** All human systems are corrupted by *concupiscence* (self-love/lust for power).

  **How this changes the evaluation:**
  If Pascal were looking at the UN, he would tell both of you to lower your expectations.
  *   **To Marcus:** You call it a "sham" because it isn't True Justice. Pascal would say, "Of course it isn't. No human system is. If you expect the UN to be morally pure, you are expecting a city of God on earth. It is a City of Man." The fact that it is based on power doesn't make it unique; it makes it *normal*.
  *   **To You:** You defend it as a step toward justice. Pascal would warn you not to idolize it. The UN is a **temporal remedy for sin.** It is a dam holding back the flood of total war. It is not a vehicle for salvation.

  Pascal distinguishes between **Order** and **Justice**.
  *   **Justice** belongs to God.
  *   **Order** belongs to the State (or the UN).

  The UN's job is not to be Just; it is to prevent the world from devouring itself. The Veto, while unjust in principle (equality of nations), preserves Order by preventing World War III between great powers. For Pascal, **Order is a higher priority than Justice in the temporal realm**, because without Order, there is no space for anyone to seek God.

  ### The Final Verdict: Who Won the Argument?

  If you walk back into this conversation, here is the Pascalian synthesis:

  **Marcus is right that the foundation is force.**
  Pascal would agree that the UNSC is not a temple of pure law. It is a treaty among armed camp leaders. The veto proves that when "Right" conflicts with "Might," Might wins. To pretend otherwise is naive.

  **But you are right that the "sham" is necessary.**
  Pascal would argue that calling it a "sham" misses the point of the theater. Force *must* be cloaked in Justice to function socially. The UN provides the stage for that theater. By forcing powerful nations to argue in terms of "resolutions," "charters," and "international law," the system imposes a tax on power. It makes aggression more expensive and difficult.

  **The "Pascalian Move":**
  You can tell Marcus: *"Pascal wouldn't call it a sham. He'd call it a necessary fiction. He'd say that since humans are fallen, we can't have True Justice. So we build systems where Power agrees to wear the mask of Justice. The Veto shows the mask slipping, but the fact that they still wear the mask matters. If we tear down the institution because it isn't perfectly just, we don't get Justice; we get naked Force. And Pascal says naked Force is tyrannical."*

  **Summary for your next talk:**
  1.  **Acknowledge Marcus:** Yes, the system is built on the power dynamics of 1945 (Custom/Force).
  2.  **Correct Marcus:** But "Force dressed as Justice" is the best humans can do. It is better than "Force naked."
  3.  **Elevate the point:** The UN isn't there to bring Heaven to Earth (True Justice); it's there to keep Hell at bay (Order). The veto is the safety valve that keeps the powerful from blowing up the room.

  Pascal would say the UN is a broken system for broken people. It is not a failure because it relies on power; it is a success if it keeps the peace long enough for us to worry about something other than survival. Marcus sees the corruption; you see the utility. Pascal says **the utility depends on accepting the corruption.**
