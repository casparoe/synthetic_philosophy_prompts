answer: |-
  # PROCEDURE FOR ADJUDICATING FRAMEWORK-DISAGREMENT APPEALS

  **Scope:** This procedure applies where an appellant claims a proposal was rejected because the review panel applied the standards of a rival research tradition (incommensurability), rather than alleging bias, factual error, or procedural irregularity.

  **Operator:** Case Officer (CO).
  **Time Limit:** 45 minutes per case.
  **Inputs:** Proposal, two review reports, applicant rebuttal, panel summary.
  **Constraint:** No external literature search, no contact with parties.

  ---

  ## 1. SEQUENCE OF TESTS

  Apply the following tests in order. If a test yields a conclusive finding that licenses a disposition, stop and record the decision. Do not proceed to subsequent tests unless the previous test is inconclusive.

  **Test 1: The Translation Check (Lexical)**
  *   **Examine:** The rebuttal and the review reports. Look for specific terms where the appellant claims the reviewers assigned a meaning different from the one intended (e.g., "mechanism", "significance", "model").
  *   **Sufficient Finding:** The documents show the reviewers explicitly defined the term in a standard way, and the appellant uses it in a specialised way, *and* the proposal defines the specialised usage clearly in its introduction.
  *   **Licenses:** Proceed to Test 2. (Lexical divergence alone rarely justifies referral; it is usually resolvable by reading the proposal's definitions).
  *   **Judgment Marker:** The CO must judge whether the definition in the proposal is clear enough for a non-specialist to spot. *Risk of error:* Overestimating clarity due to jargon density.

  **Test 2: The Evidence Check (Result Criteria)**
  *   **Examine:** The review reports' objections regarding "lack of hypothesis" or "unclear outcomes" against the proposal's methods section.
  *   **Sufficient Finding:** The reviewers demand a specific type of evidence (e.g., p-values, falsifiable single-variable hypotheses) that the proposal explicitly states it does not generate, proposing instead a different output (e.g., network state change, descriptive consistency).
  *   **Licenses:** Proceed to Test 3. (This confirms a disagreement on what counts as a result, but not yet whether the alternative is valid).
  *   **Judgment Marker:** The CO must distinguish between "no hypothesis" and "a hypothesis of a different logical type". *Risk of error:* Treating complex hypotheses as absent ones.

  **Test 3: The Aims Check (Desiderata)**
  *   **Examine:** The panel summary and the call text.
  *   **Sufficient Finding:** The call text specifies aims (e.g., "predictive power", "policy readiness") that the proposal does not claim to meet, offering different aims (e.g., "conceptual coherence", "historical accuracy") instead.
  *   **Sufficient Finding for Dismissal:** The proposal fails to meet the *mandatory* criteria listed in the call text, regardless of framework.
  *   **Licenses:** If mandatory criteria are met but values differ, proceed to Test 4. If mandatory criteria are failed, **Dismiss**.
  *   **Judgment Marker:** The CO must interpret the call text's flexibility. *Risk of error:* Reading call text too rigidly against novel approaches.

  **Test 4: The Kind Check (Classification)**
  *   **Examine:** How the proposal categorises the object of study versus how the reviews categorise it (e.g., is a disease a "pathogen presence" or a "system state"?).
  *   **Sufficient Finding:** The reviews reject the proposal because it classifies the object in a way that makes the reviewers' standard metrics inapplicable, and the appellant argues this re-classification is necessary to capture the phenomenon.
  *   **Licenses:** Proceed to Test 5. (This identifies deep incommensurability).
  *   **Judgment Marker:** The CO must decide if the re-classification is substantive or merely semantic. *Risk of error:* Accepting rhetorical reframing as ontological innovation.

  **Test 5: The Anomaly Check (Explanatory Gain)**
  *   **Examine:** The rebuttal's justification for the alternative framework.
  *   **Sufficient Finding:** The appellant identifies a specific phenomenon, paradox, or anomaly that the mainstream framework (used by reviewers) cannot explain or handles poorly, and which the proposed framework resolves or accommodates.
  *   **Sufficient Finding for Dismissal:** The appellant claims the framework is "different" or "richer" but identifies no specific anomaly the mainstream fails to address.
  *   **Licenses:** If an anomaly is identified, **Refer** (see Referral Rule below). If no anomaly is identified, **Dismiss**.
  *   **Judgment Marker:** The CO must judge plausibility, not truth. *Risk of error:* Dismissing genuine novelty because the anomaly is not yet widely recognised.

  ---

  ## 2. TAXONOMY OF DIAGNOSES

  Based on the tests above, classify the disagreement into one of four diagnoses. This classification determines adjudicability.

  **1. Lexical Divergence**
  *   **Definition:** Parties use the same word with different definitions (Test 1).
  *   **Adjudicability:** **Adjudicable by accepted standard.** Both parties usually accept that definitions must be explicit. If the proposal defines the term, the reviewers should have respected that definition.
  *   **Disposition:** Usually **Uphold in Part** (direct panel to reread definitions) or **Dismiss** (if proposal was vague).

  **2. Evidentiary Disagreement**
  *   **Definition:** Parties agree on the goal but disagree on what data counts as success (Test 2).
  *   **Adjudicability:** **Adjudicable only at prohibitive cost.** Requires subject expertise to judge if the alternative evidence type is rigorous.
  *   **Disposition:** **Refer for written advice from one external specialist.** (Cheaper than a new panel).

  **3. Axiological Disagreement (Aims/Values)**
  *   **Definition:** Parties weight shared values differently (e.g., precision vs. breadth) or pursue different ends (Test 3).
  *   **Adjudicability:** **Not adjudicable.** This is a policy choice, not a truth claim.
  *   **Disposition:** **Dismiss**, unless the call text explicitly invites the alternative aim. The funder's priorities, as expressed in the call, prevail.

  **4. Ontological Disagreement (Kinds)**
  *   **Definition:** Parties classify the objects of study into different kinds, making translation impossible without learning the new framework (Test 4).
  *   **Adjudicability:** **Adjudicable only at prohibitive cost.** Requires a panel fluent in the appellant's tradition to evaluate validity.
  *   **Disposition:** **Refer for review by a differently constituted panel**, *provided* Test 5 (Anomaly Check) is passed.

  ---

  ## 3. RULE ON ENTITLEMENTS

  **Incommensurability is not Immunity.**
  An appellant is entitled to have their proposal assessed by standards appropriate to their framework, *provided* those standards are rigorous within that framework.
  *   **What is allowed:** Rejection of mainstream metrics (e.g., p-values) in favour of framework-specific metrics (e.g., model consistency).
  *   **What is not allowed:** Absence of *any* metrics. A proposal cannot claim incommensurability to evade requirements for internal coherence, feasibility, or clear communication.
  *   **Operational Rule:** If the rebuttal argues "you cannot judge this," the CO must check "did you provide *any* criteria for judgement?" If the proposal provides no criteria for success even within its own terms, **Dismiss**.

  ---

  ## 4. QUALITY AND OPPORTUNISM TEST

  Before licensing a referral, apply this filter to distinguish innovation from opportunism.

  **A. The Post-Hoc Reconstruction Check**
  *   **Look for:** Mismatch between the two individual review reports and the Panel Summary.
  *   **Indicator:** If reviews cite specific technical flaws (e.g., sample size) but the Summary cites "lack of hypothesis," the panel may be reconstructing reasons to fit a standard mould.
  *   **Action:** Weight the appeal more heavily towards **Refer**.

  **B. The Opportunism Check**
  *   **Look for:** Use of Kuhnian vocabulary ("paradigm", "incommensurable") in the rebuttal without corresponding methodological detail in the proposal.
  *   **Indicator:** High density of philosophical justification in the rebuttal, low density of methodological detail in the proposal.
  *   **Action:** Weight the appeal towards **Dismiss**. This indicates the framework is being used as a shield for lack of rigour.

  **C. The Anomaly Preservation Check (Test 5 Refinement)**
  *   **Look for:** Does the applicant explain *why* the mainstream view is insufficient?
  *   **Indicator:** "Mainstream models cannot represent X" vs "Mainstream models are ugly."
  *   **Action:** Only the former licenses a referral. Pluralism does not fund redundancy.

  ---

  ## 5. JUDGMENT MARKERS

  At the following steps, the procedure cannot eliminate human judgment. The CO must be aware of the likely direction of error.

  1.  **Distinguishing Jargon from Substance (Test 4):**
      *   *Judgment:* Is the new vocabulary necessary or decorative?
      *   *Likely Error:* **False Negative.** COs are trained in standard academic discourse. Novel vocabularies often look like obfuscation. Err on the side of referral if the proposal is internally consistent, even if strange.
  2.  **Assessing the "Anomaly" (Test 5):**
      *   *Judgment:* Is the claimed anomaly real or imagined?
      *   *Likely Error:* **False Positive.** Appellants are motivated to exaggerate mainstream failures. Require the appellant to point to a specific literature consensus they are breaking.
  3.  **Call Text Interpretation (Test 3):**
      *   *Judgment:* Is the call text prescriptive or illustrative?
      *   *Likely Error:* **False Negative.** COs tend to read call text as a checklist. If the text says "e.g.", treat it as non-mandatory.

  ---

  ## 6. SYSTEMATIC FAILURE MODES

  This procedure will fail in the following predictable ways:

  1.  **The Conservative Bias:** The procedure relies on document analysis by a non-specialist. Highly novel work often reads as "unclear" to outsiders. The procedure will systematically **err towards the Funder** (Dismiss) on high-risk, high-novelty proposals.
  2.  **The Sophisticate's Shield:** A skilled appellant can draft a rebuttal that mimics the "Anomaly Check" without substantive backing. The procedure may **err towards the Appellant** (Refer) on well-written but empty proposals.
  3.  **The Interdisciplinary Blindspot:** Proposals that bridge two established fields often look like they belong to neither. The procedure may classify these as "Ontological Disagreement" and Refer them, consuming disproportionate budget.
  4.  **The Budget Cap:** With only 20 referrals available per year across 90 appeals, meritorious cases in this stream may be displaced by appeals in other streams (bias/error). This procedure does not solve the resource scarcity; it only triages it.

  ---

  # CASE APPLICATIONS

  ## Case (a): Infection and Immunity (Network Perturbation)

  **Disposition:** Refer for review by a differently constituted panel.

  **Reasoning (Determination Letter):**
  "The Panel rejected the proposal on the grounds that it lacked a falsifiable hypothesis and clear failure conditions. Your rebuttal argues that these criteria presuppose a reductionist 'one-target' framework incompatible with your network-based approach.
  Our review of the documents indicates this is an **Ontological Disagreement** (Taxonomy Item 4). You and the reviewers agree on the experimental techniques but disagree on what constitutes a 'result' (Test 2). The Panel Summary appears to have reconstructed the reviewers' technical concerns into a standard 'hypothesis' objection (Quality Test A).
  Crucially, your rebuttal identifies a specific limitation in the mainstream approach: the inability to capture system-state changes via single-node interventions (Test 5). This constitutes a claim of explanatory gain regarding complex regulatory dynamics.
  While the Case Officer cannot validate the scientific merit of network perturbation theory, the documents suggest the Panel applied standards internal to a rival tradition rather than assessing the internal coherence of your proposed framework. As this touches on the fundamental evaluation criteria of the call, a fresh evaluation by a panel with expertise in systems biology is required."

  **Judgment Points:**
  1.  **Anomaly Plausibility:** I judged that "system-state change" is a plausible anomaly for reductionist models. A less confident CO might have dismissed this as jargon.
  2.  **Budget vs. Merit:** I authorised a full panel referral rather than specialist advice. This consumes significant budget. I judged that the panel's *process* was the error, not just a technical fact, necessitating a new panel rather than advice.

  ---

  ## Case (b): Macroeconomics (Stock-Flow Consistent)

  **Disposition:** Dismiss.

  **Reasoning (Determination Letter):**
  "You appeal on the grounds that the Panel applied 'microfoundations' and 'identification' standards internal to a modelling tradition you do not share. We accept that this represents an **Axiological Disagreement** (Taxonomy Item 3) regarding the aims of macroeconomic modelling.
  However, under the Rule on Entitlements, incommensurability does not exempt a proposal from demonstrating explanatory value. Our Quality and Opportunism Test requires that an alternative framework must preserve or explain something the mainstream framework leaves anomalous (Test 5).
  Your rebuttal states the value of your framework lies in 'accounting consistency' but explicitly concedes that you identify 'no empirical phenomenon that mainstream models cannot represent.' While methodological pluralism is a commitment of this funder, we cannot fund methodological redundancy. A proposal must demonstrate that its alternative approach yields insights or capabilities that the dominant approach lacks. As no such gain is claimed in the documents, the Panel's decision to prioritise models with empirical identification is consistent with the funder's strategic aims."

  **Judgment Points:**
  1.  **Pluralism Limit:** I judged that "accounting consistency" without empirical differentiation is insufficient for funding. This goes against a sympathetic reading of pluralism. The procedure forces a distinction between "different" and "usefully different."
  2.  **Call Text:** I interpreted the call's requirement for "impact" or "insight" as mandatory, overriding the applicant's preference for theoretical consistency.

