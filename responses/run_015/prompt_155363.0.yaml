  1. **PAR Formulation Viability:** 0.40. Most rigorous person-affecting views either collapse into totalism when accounting for identity-affecting choices or fail to condemn creating miserable lives without ad hoc existence conditions.
  2. **Symmetry Pressure:** 0.30. Avoiding the shifting comparison class requires asserting non-existence is a baseline for harm but not benefit, which lacks independent metaphysical grounding.
  3. **Lambda = 0 vs. Epsilon:** 0.50. Intuitive data is insensitive to the distinction between zero reason and negligible reason, but theoretical continuity favors epsilon.
  4. **Aggregation Consequence:** 0.20. The implication that no number of good lives outweighs a trivial extant benefit is theoretically fatal and practically untenable for a general moral theory.
  5. **Risk Extension:** 0.30. Neither expected-weighted nor weighted-expected models capture all intuitive judgments without generating paradoxes, suggesting the principle is not fundamental.
  6. **Debunking Explanation:** 0.40. (Probability intuition is *not* debunked). Evolutionary and cognitive biases regarding identifiable victims provide a sufficient alternative explanation for the asymmetry intuition.
  7. **Metaethical Grounding:** 0.35. (Probability reasons exist without subjects). Grounding normative facts about non-existent entities requires a robust realism that many find ontologically costly.

