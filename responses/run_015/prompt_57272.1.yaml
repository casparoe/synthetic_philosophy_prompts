answer: |-
  Friends, colleagues, neighbors. We are here because a fish died in September. She died in Tank 4 of this hatchery, alone, without a mate listed on the chart your staff kept on the wall for twenty-two years. We are here to mark that ending, and to acknowledge the hands that kept her alive as long as they did.

  For two decades, you treated these fish not as data points, but as charges. You managed the water, the temperature, and the pedigree when the creek outside could no longer guarantee them. When the spring lowered and the diversion brought in the widespread relative, you became the only place where this form persisted. That chart on the wall is not a log of failures; it is a record of witness. You held a line that the river had already crossed. For that constancy, you deserve thanks that is specific, not general. You kept a history alive after its context had vanished.

  I stand before you as the person who, in 1998, argued that this fish should not carry the name it was given in 1954. I wrote that the differences we saw were adjustments to the water, not signs of separate creation. I argued that the protection it held was not owed to it by the science of the time. I stand by the logic of that paper given the evidence I held then. But evidence is not static, and neither are rivers. Two years ago, new data restored the name. I do not mourn the change in classification; I mourn the change in the water that made the classification matter.

  There are three ways to understand what happened in Tank 4. There are those who say that if fish can mix, they are one thing, and nothing distinct has been lost. There are those who say the distinctness vanished years ago, when the hybrids became the majority, and September is merely a administrative close. And there are those who say that a unique thread of history, stretched from 1954 to this September, has been cut. I will not tell you which of these is true. Science does not yet vote on metaphysics. But I will tell you what is true for all of us in this room.

  The creek below us holds fish. They swim, they feed, they spawn. But they are not the fish that were described in 1954. The specific combination of traits, the specific history of isolation that produced the narrow body and the reduced pigmentation, exists now only in fixative and in memory. The water district changed the flow; the taxonomy changed the name; but the outcome is the same. A unique pattern of life that required this specific spring, at this specific pressure, is no longer generating itself.

  Her body will go into a jar. It will travel four hundred miles to sit beside the holotype, the first specimen that defined the kind. When the holotype was collected, the creek was full. When this last individual was collected, the creek was empty of her own. That symmetry is not routine. It is a bookend. It marks the span of a life that was not merely a category, but a sequence of generations that has now reached its period.

  To the commissioners: You asked me to establish that no species was lost. I cannot say that. I can say that the creek is still functional, and that the remaining fish are secure. But function is not the same as history. To say nothing was lost is to say that the past does not matter, only the present utility. I cannot sign that statement.

  To my colleagues: You know the verbs we use. Split, lump, diagnose, isolate. Use them carefully. They are not just labels; they are decisions about what we owe the living world. When we decide a lineage is not separate, we remove a shield. When we decide it is separate, we raise one. We must be humble about the power of that pen.

  To my daughter, and to the reporter who will write the headline: Know that this was not an accident of nature. Extinction is usually a slow subtraction, not a sudden event. It happened when the spring lowered. It happened when the diversion opened. It happened when the paper was published. It happened in Tank 4. All of these are true.

  We leave here with sixty fish of uncertain parentage in the shed, and frozen gametes from four who came before. We leave with a side channel full of things that look like the dace, but carry the blood of the invader. We leave with a jar that will hold the last pure body. We do not leave with the creek we started with.

  We mark this day not to settle a argument about definitions, but to acknowledge a silence. The spring still flows, but it will not make this fish again. That is a loss, whatever noun you use to describe what died. Thank you.

  ***

  **Note on Key Sentences**

  1.  **"A unique pattern of life that required this specific spring, at this specific pressure, is no longer generating itself."**
      *   **Licenses:** Account 3 (Species as Individuals/History) and Account 2 (Diagnosable Lineage). It emphasizes the cessation of a specific historical process.
      *   **Forbids:** Account 1 (Reproductive Isolation). If they are the same species as the relative, the "pattern" is just plasticity, not a unique generative history.
      *   **Reporter:** Likely to read this as "a species is gone." It sounds definitive enough for a headline but technically refers to a "pattern."
      *   **Lumper Privilege:** Only the lumper can admit the "pattern" is gone without conceding it was always a full species, bridging the gap between his 1998 view and the current loss.

  2.  **"When we decide a lineage is not separate, we remove a shield."**
      *   **Licenses:** Account 3 and 2. It acknowledges the real-world consequence of taxonomic action on conservation status.
      *   **Forbids:** Account 1. If it wasn't a species, no shield was owed; removing it was corrective, not destructive.
      *   **Reporter:** Will interpret this as an admission of responsibility for the extinction.
      *   **Lumper Privilege:** Essential. Only the author of the 1998 lumping can authentically speak to the removal of the shield.

  3.  **"That symmetry is not routine. It is a bookend."**
      *   **Licenses:** Account 3 (Species as Individuals). It treats the holotype and the last individual as birth and death of a single entity.
      *   **Forbids:** Account 1. If it's just a population, the holotype is just a sample, not a birth certificate.
      *   **Reporter:** Will see this as poetic confirmation of extinction.
      *   **Lumper Privilege:** Neutral, but carries weight because the speaker knows the holotype's context intimately.

  4.  **"To say nothing was lost is to say that the past does not matter, only the present utility."**
      *   **Licenses:** Account 3 and 2. It validates the loss of history/lineage even if biological function remains.
      *   **Forbids:** Account 1. Account 1 argues only reproductive continuity matters; if the genes persist in hybrids, nothing is lost.
      *   **Reporter:** This is the direct refusal to the commissioners. It will likely be the quote used to contradict the water district's stance.
      *   **Lumper Privilege:** High. It allows the speaker to reject the commissioners' request without needing to prove it was a "species," shifting the argument to value rather than taxonomy.

  5.  **"The creek below us holds fish... But they are not the fish that were described in 1954."**
      *   **Licenses:** All three accounts. It is factually true regardless of species concept (hybrids exist, pure form is gone).
      *   **Forbids:** None. It is the safe ground upon which the metaphysics stands.
      *   **Reporter:** Will likely use this to establish the fact of change without getting bogged down in the definition of "species."
      *   **Lumper Privilege:** None, but necessary setup for the heavier claims.
