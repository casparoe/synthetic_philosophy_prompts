          *   *Implicit Handshake (Consent):* Entering the context is like accepting the TOS.
          *   *Systemic Fragility (Rule Utilitarianism):* Small violations degrade the norm for everyone.
          *   *Expressive Value:* Norms signal respect, not just efficiency.
      *   **Refining the "Global State" Definition:**
