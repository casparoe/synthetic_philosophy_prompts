          *   Economic reliance (waiters' wages) makes tipping less "optional formatting" and more "schema definition."
      *   **Conclusion:** Summarize. The analogy is useful but needs to account for *interdependence* and *trust* as critical system resources.

  7.  **Refining the Tone:**
