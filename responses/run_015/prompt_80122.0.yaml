      *   *Anti-Humeanism (Governing/Dispositionalism):* Laws *make* things happen. There must be a fundamental ontology. EFT poses a problem: If laws govern, which layer governs? If the low-energy layer is autonomous, does it have its own governing laws? Or is it just a shadow of the high-energy laws?
