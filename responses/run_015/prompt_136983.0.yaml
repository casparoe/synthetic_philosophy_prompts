prompt: |-
  Hey — sorry for the brain dump, but I need to send my supervisor a two-page proposal for my MA thesis by Friday and I've been going back and fourth on it for two weeks without getting anywhere. Nine-month project, so it has to be small enough that I definately finish it, and I keep writing things that are either a whole dissertation or a literature survey.

  Here's the area and the half-formed idea. The triviality results (Lewis's original argument and the later versions that got the conclusion from weaker assumptions) are standardly read as forcing a choice: either the conditional is a genuine proposition in the algebra you're assigning probabilities over, or the equation P(if A, then C) = P(C given A) fails. The Adams/Edgington-style way out is to say: fine, conditionals aren't truth-valued, the equation governs something like assertability or degree of acceptance, not the probability of a proposition, and then everyone argues about whether that's coherent.

  What I want to look at is a third variable that I don't see discussed much: how much expressive resources the collapse arguments actually need. As far as I can tell they all assume the algebra is closed under quite a lot — arbitrary Boolean combinations of conditional propositions, and at some point a conditional sitting inside the antecedent or consequent of another conditional. So the question: take a finite algebra with n atoms, allow conditionals only up to nesting depth k (flat ones are k = 1), require the equation only where it makes sense, and ask where the boundary is. Are there non-degenerate probability functions satisfying it when k = 1 and n is small? If so, at what n or what k does it break? And do the existing proof strategies really use nesting, or can they all be run flat? My suspicion is that at least one of them goes through without nesting and that my idea is half dead already — I'd much rather find that out in month two than month eight.

  I also want the proposal to say how to rule out cheating solutions: if A > C is allowed to collapse to the material conditional, or to a constant, or to some truth-function of A and C, then whatever I prove is uninteresting. Making 'does genuine work' precise might turn out to be a real sub-question rather than a footnote.

  What I'd like from you:

  A two-page proposal in my voice. A precise statement of the question (tighten my n-and-k formulation — and flag where you think it's broken or where the interesting case is different from the one I set up). Why the two standard escapes leave this open: note that they don't settle whether the *resources* the proofs need are ones any compositional language has to have — if compositionality forces closure under embedding anyway, then my restriction is ad hoc and that's a finding too. A month-by-month method for nine months that isn't just 'read more': what do I actually try to prove first, what's the smallest case worth working out by hand, and what order do I do things in so that a negative answer shows up early. Why this approach rather than the obvious alternatives (defending non-propositionalism outright, trying to build a semantics, running experiments on folk judgments). What a successful result looks like — I'd guess either a threshold result, or an argument that the restriction can't be motivated, or both. And an honest scope section: what makes this too big for nine months, and what the salvage version is if the collapse turns out to bite immediately.

  Also: what would count as the project failing, in a way that isn't just 'I didn't finish'. And if you think this is already a settled result in the literature, say that plainly and tell me what would be left to do — I'd rather hear it now. No bibliography or reading list, I'll fill in the references myself.

  Last thing: tell me how confident you are in the main claims you make, especially the mathematical ones, and single out the single point you're least sure of. I don't want to stand up and defend a claim in a proposal that you were guessing at.
