      *   **Reed's Position:** "Taxonomic Constructivism." Grants material change but argues naming "ages" imposes teleology, flattens pluralism, erases alternatives. Challenge: "Counterfactual Stability Point" (if discontinuous, there must be a specific change whose absence keeps the old structure intact). Argues clusters can be mapped without epochal boundaries.
