answer: |-
  Good evening. Colleagues, friends, family. And welcome to our guests, including the city councillor who joins us despite our disagreements.

  I am a software engineer by trade. I build systems that are expected to run without failure. I am also an officer in this signals battalion. In my work, whether behind a keyboard or looking at a mobilisation map, I am trained to look at capacity. Specifically, I look at the difference between standing capacity and surge capacity.

  Standing capacity is what a system can sustain indefinitely without burning out. It is the baseline. Surge capacity is what a system can bring online when the load spikes unexpectedly. It is the peak.

  Most of the public debate next month will focus on standing capacity. The initiative asks: Can we afford to keep thousands of citizens in training cycles? Is it efficient? Those who propose a professional army argue for a smaller, higher-readiness standing capacity. They are not wrong to ask about cost. But they are asking the wrong engineering question.

  The question is not what we can sustain in peacetime. The question is what we can bring online when the system is under attack. A professional force is optimized for steady state. A militia is optimized for surge. But I am not here to argue about mobilisation figures. The career officers in this room know them better than I do. I am here to argue about something less tangible, but more structural.

  A militia system is not merely a cheap way to buy defense. It is a precommitment strategy.

  In game theory, a precommitment is when you restrict your own future choices to make a threat credible. Think of Ulysses tying himself to the mast. He knew that when the sirens sang, he would not be able to choose wisely. So he removed the option of steering toward them. He bound his future self to protect his present intent.

  Conscription is how a democracy ties itself to the mast.

  If we switch to a purely professional army, defense becomes a service the state purchases, like waste collection or road repair. In a crisis, when budgets tighten and fear rises, a parliament can choose to cut that service. They can choose to negotiate. They can choose to stand down. It is a live option for an electorate that does not feel personally implicated in the defense.

  But when the army is the electorate, that option disappears. You cannot surrender the population without surrendering the state. By distributing military capacity across the citizenry, we make the cost of submission higher than the cost of resistance. We remove the option of cheap capitulation from the menu of future political choices. We are not just building an army; we are building a constraint on our own future cowardice.

  I want to be clear about what this requires. It requires coercion.

  We tell an eighteen-year-old citizen: "You must give us time. You must learn skills you may never use. You must keep readiness you would rather spend on your career." We do this partly out of distrust. We distrust the person that eighteen-year-old will become. We distrust the forty-year-old voter who, in a moment of crisis, might prioritize comfort over security. We force the younger self to secure the safety of the older self.

  This is not civic virtue. It is an insurance premium paid in liberty. I acknowledge that cost. It is heavy.

  I look at my daughter, who sits among you. She fulfilled her obligation through civilian service. She chose the longer alternative. Her service counts toward the surge capacity of this country just as much as mine. I do not stand here to claim her choice was lesser. Nor do I stand here to challenge the city councillor who works for peace. A society that cannot accommodate conscientious objection is brittle. But a society that relies entirely on volunteers for its survival is fragile. We need a system that holds even when volunteering stops.

  I must also concede where this argument stops. It does not prove that conscription is the only way to achieve this precommitment. If the goal is to make defense too expensive to abandon, other arrangements might deliver that. We see this in our neighbors. Sweden abolished conscription, then restored it when the security environment changed. Finland kept it. Both deter. Both are secure. The specific mechanism is underdetermined by the strategic goal.

  Some of you will invoke Sweden to argue for professionalism. Others will invoke Finland to argue for conscription. Both are right that the model can change. But the principle must remain: the country must not be able to cheaply opt out of defending itself.

  We are not keeping the militia because it is tradition. Traditions fade. We are not keeping it because it is virtuous. Virtue is optional. We are keeping it because it is a structural lock. It ensures that if the decision to fight ever comes, it is not made by a distant parliament weighing costs, but by a population that has already paid the price of readiness.

  Next month, you will vote. You will hear about budgets. You will hear about readiness timelines. Those things matter. But I ask you to look past the spreadsheet. Look at the constraint.

  We are asking the state to bind its own hands so that, in the dark, it cannot find the switch to turn off the lights. That is not a romantic notion. It is a technical requirement for a small democracy that intends to remain sovereign.

  Thank you.
