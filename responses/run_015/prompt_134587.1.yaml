          3.  Legal resistance to rank-free taxonomy (need for Linnaean ranks for funding/protection).
      *   **Philosophical Questions:**
          1.  What theory of classification does this tension *presuppose*?
          2.  Realism (natural kinds) vs. Pragmatism (convenient clusters)?
