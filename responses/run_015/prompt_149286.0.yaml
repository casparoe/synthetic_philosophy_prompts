answer: |-
  In a private auction verification session, a senior archivist testifies via secure video link to a remote appraiser regarding Elara Vance's *Variable Column IV*, a work ontologically defined by a precise algorithmic score permitting infinite spatial permutations, yet legally constrained by a 2005 Certificate of Authenticity declaring only the original Tate installation as the "Work" and all subsequent permutations as "inauthentic derivatives." The appraiser, never seeing the steel and light installation, accepts the archivist's testimony that the Tate installation perfectly complied with the score, forming the belief that *the work possesses dynamic equilibrium*.

  **Exact Belief:** "The work *Variable Column IV* possesses the aesthetic property of dynamic equilibrium."
  **Method of Acquisition:** Testimonial transmission of the algorithmic score and compliance report from the archivist, without perceptual encounter of the physical installation.
  **Relevant Nearby Worlds:** (1) The testimony is false: the Tate installation deviated from the score in ways affecting balance. (2) The instantiation differs: the Authenticity Covenant is void, allowing multiple valid installations to exist simultaneously for comparison.

  **Theoretical Verdicts:**
  The defender of the **Acquaintance Principle** is forced to concede that knowledge is acquired because, adhering to Goodman's ontology, they treat the work as allographic; since the work is defined by the score, acquaintance with the score (conveyed via testimony) satisfies the requirement for direct access to the work's aesthetic essence, rendering the physical Tate instance epistemically secondary. Simultaneously, the defender of **Testimonial Permissiveness** must deny that knowledge is acquired because the property "dynamic equilibrium" is emergent only across multiple valid instantiations of the score; the Authenticity Covenant's suppression of those instantiations renders testimony about the single Tate object insufficient to verify the type-level aesthetic claim, breaking the standard testimonial chain that relies on the witness's ability to sample the work's aesthetic range.

  **Structural Feature:**
  The single structural feature doing the work is the **Authenticity Covenant** (the clause restricting valid instances to one). This feature imposes autographic scarcity on an allographic structure.

  **Removal Effect:**
  If the Covenant is removed, the work reverts to standard allographic status. The Acquaintance Principle defender maintains their concession (testimony of the score suffices), aligning with their standard treatment of musical or literary works. The Testimonial Permissiveness defender reverts to their standard alignment by accepting testimony regarding the installation's aesthetic properties, as the existence of multiple valid instantiations allows the testimonial chain to rely on comparative verification rather than a single, suppressed sample.

  **Objection and Response:**
  A permissivist might object that this case cheats by smuggling autographic conditions (the Covenant) into an allographic domain to artificially break the testimonial chain. However, within the case's logic, the art market's institutional power to define authenticity overrides metaphysical categories; the Covenant is not a philosophical trick but a real legal and epistemic barrier that genuinely restricts the available evidence, making the permissivist's denial of knowledge a consequence of institutional reality rather than theoretical inconsistency.
