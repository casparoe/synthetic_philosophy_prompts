answer: |-
  You are right to be suspicious of those notes, and your intuition about the sub-Humean model is exactly where the lecturer's account went off the rails. It is a common frustration in studying Williams that introductory summaries often collapse his sophisticated internalism into a crude Humean instrumentalism, and unfortunately, the reconstruction you have provided is a textbook example of that caricature. If you were to build your essay on the summary you wrote down, you would be attacking a position Williams never held, which would undermine your credibility with anyone who knows the literature. The good news is that the discrepancies are systematic, so once you see the pattern of errors, you can confidently correct the record in your essay. I will walk through the claims you recorded in the order you presented them, distinguishing what Williams actually argued from what the lecturer attributed to him, and I will be specific about which sentences in your summary you can keep, which need heavy modification, and which must be discarded entirely.

  The first major error appears in the opening claim that Williams holds a reason statement is true only if the agent has a desire that the action would satisfy. Williams would reject the word desire here as too narrow. In his seminal paper Internal and External Reasons, he introduces the concept of the subjective motivational set, which he labels S. He explicitly states that S contains not just desires, but also dispositions, commitments, projects, and patterns of emotional reaction. By reducing S to desires, the lecturer sets up a straw man that makes Williams look like a simple psychological hedonist, which he was not. A defender of Williams would want you to rewrite this sentence to say that a reason statement is true only if there is a sound deliberative route from the agent's subjective motivational set to the action. This distinction is crucial because it opens the door for things like moral commitments to be part of S without being mere desires, which helps buffer the view against the charge that it makes morality contingent on whims.

  The next claim, that for Williams all reasons are instrumental and deliberation can only ever be about means, is something Williams would have rejected outright. This is the most damaging part of the caricature because it ignores the core mechanism of Williams's internalism. Williams argues that deliberation is not limited to finding means to pre-existing ends. Instead, deliberation can involve imagining how different projects fit together, considering constitutive means, and even modifying the elements of S themselves. This is where your friend's orchestra example becomes philosophically vital. Her shift from loving the music to seeing her wanting as vanity is not a case of finding a new means to an end, nor did she acquire a new desire from outside. She underwent a deliberative process where she re-interpreted an element within her own subjective motivational set. Williams's account handles this perfectly well because he allows that agents can come to see that a certain project is inconsistent with other deeper commitments they hold, or that the project rests on false beliefs about themselves. The lecturer's claim that deliberating about ends is incoherent is simply false regarding Williams's position, and you should treat that sentence as unusable in your essay.

  Following from that error is the claim that Williams treats the subjective motivational set as a fixed given. This is also something Williams would reject outright. As your friend's case illustrates, S is dynamic. While Williams insists that reasons must be grounded in the agent's actual motivations (you cannot have a reason if there is no possible route from your S), he does not think S is immutable. Deliberation can add new elements to S, discard old ones, or alter their weighting. If the lecturer's view were correct, moral development would be impossible, but Williams's view allows for an agent to deliberate themselves into having a reason they did not previously have, provided that new reason connects to something already in S through a sound deliberative route. You should rewrite the section on the fixed given to reflect that S is the starting point of deliberation, not its prison.

  The slide you identified, moving from connects up with existing motives to nobody can be wrong about what they have reason to do, is where the lecturer's logic becomes untenable. Williams would reject the claim that nobody can be wrong about their reasons. An agent can be wrong about the facts, and they can be wrong about the deliberative route. If I believe drinking petrol will quench my thirst, and I have a desire to quench my thirst, Williams says I do not have a reason to drink petrol because the deliberative route relies on a false belief. Furthermore, an agent can be wrong about whether a sound deliberative route exists at all. Therefore, the inference to infallibility is a non-sequitur. The lecturer seems to have conflated the truth conditions of reason statements with the agent's own access to those conditions. A defender of Williams would insist that while reasons are internal, they are still objective in the sense that there is a fact of the matter about whether a sound deliberative route exists, and the agent can certainly be mistaken about that fact.

  This leads directly to the claim that moral criticism of anyone is impossible. This is a defensible simplification only if one equates moral criticism entirely with telling someone they have a reason to act otherwise, but even then, it is misleading. Williams distinguishes between ethical criticism and reasons statements. He can say that the serially unfaithful husband is vicious, cruel, or bad without saying that the husband has a reason to be faithful. The lecturer's claim that Williams accepts this with a shrug is unfair; Williams acknowledges the discomfort of this conclusion but argues it is better than positing mysterious external reasons that have no grip on the agent's psychology. He does not shrug at the immorality; he shrugs at the idea that morality must always provide a reason for every agent. In your essay, you should nuance this point by noting that Williams limits the scope of reasons statements, not necessarily the scope of ethical evaluation. We can blame people for having bad elements in their subjective motivational set, even if we cannot say they had a reason to be better.

  The characterization of Williams's view as a dressed-up version of the Humean doctrine that reason serves the passions is another point Williams would have rejected outright. In later writings, specifically in response to the kind of caricature your lecturer presented, Williams distinguished his view from the sub-Humean model. The sub-Humean model is the one your lecturer described: belief-desire psychology where reason is purely instrumental. Williams argued that his internalism is compatible with a much richer psychology where reasons can emerge from complex deliberative processes that are not merely servile to pre-existing passions. He wanted to save the idea of internal reasons from the limitations of traditional Humean instrumentalism. You should explicitly note in your essay that Williams distinguishes his internalism from the Humean theory of motivation, as this shows you have engaged with the secondary literature and not just the primary text.

  Regarding the lecturer's closing claims about the state of the debate, you should be very cautious. The statement that the view is now generally regarded as refuted is not something you should rely on in an essay. While there are powerful objections to internalism, particularly regarding future indifference and moral obligations, it is not accurate to say the view is refuted in the sense that philosophers have moved on from it. Internalism remains a dominant position in metaethics, defended by numerous contemporary philosophers. To claim it is refuted is to take a controversial stance as if it were established fact. Furthermore, the claim that Williams later qualified the thesis in a way most people read as a concession is misleading. Williams did clarify his views, particularly in his postscript to Internal and External Reasons and in later papers like Internal Reasons and the Obfuscation of Intuition, but he maintained that his critics often misunderstood the flexibility of the subjective motivational set. He did not concede that external reasons exist; he conceded that the internal model needed to be understood more broadly than his critics allowed. You should treat the lecturer's assessment of the current debate as an opinion rather than a fact, and if you mention it, frame it as one side of an ongoing controversy.

  To bring this back to your specific worry about the orchestra example, this is actually the perfect tool to dismantle the lecturer's caricature. The lecturer claims deliberation about ends is incoherent and S is fixed. Your friend's experience shows that an agent can deliberate about the nature of their own motivation without new external facts. She did not learn new information about the music; she learned something about her relation to the music. Williams's account accommodates this by allowing that deliberation can involve imagining oneself in future states or reflecting on the consistency of one's projects. The lecturer's version leaves no room for this, but Williams's actual view does. In your essay, you could use this example to demonstrate that internalism does not entail static desires or purely instrumental reasoning. It shows that the move from internalism to instrumentalism is not valid, which cuts the legs off the lecturer's broader critique.

  In terms of actionable advice for your essay, you should discard the sentences claiming Williams treats desires as fixed, that deliberation is only about means, that nobody can be wrong about reasons, and that moral criticism is impossible. These are false attributions. You can keep the core idea that Williams ties reasons to the agent's subjective motivational set, but you must rewrite it to emphasize the sound deliberative route and the broad contents of S. You should also challenge the lecturer's claim about the refutation of the view; instead, frame the debate as ongoing, noting that much of the criticism relies on the very caricature you are now identifying. If you want to impress your marker, point out that the lecturer conflated Williams's internalism with the sub-Humean model, and that recognizing this distinction is key to understanding why Williams thought he could preserve normative force without external reasons.

  Finally, do not worry that suspecting your lecturer makes you difficult. In philosophy, especially at the third-year level, you are expected to engage critically with secondary sources and lecture material. Williams's text is dense, and it is very easy to slip into the Humean reading if one is not careful. By identifying the gap between the sub-Humean model and Williams's actual internalism, you are doing exactly the kind of work this course is designed to encourage. You can acknowledge the lecturer's points as common objections raised against Williams, but you should clarify that these objections often target the caricature rather than the refined view. This approach shows intellectual maturity and ensures your essay is built on a solid understanding of the primary text rather than a distorted summary. You have the right instincts about where the argument breaks down, particularly regarding the slide from internalism to infallibility, and trusting those instincts will lead you to a much stronger paper.
