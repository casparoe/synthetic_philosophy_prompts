answer: |-
  # The Aspiration-Adjustment Protocol (AAP)

  ## Part 1: The Decision Procedure

  Execute these steps in order. Do not skip to comparison until Step 4.

  ### Step 1: Set the Time Budget (Hard Stop)
  **Question:** What is the maximum hours allowable for this decision based on contract value?
  **Rule:** 
  *   $50k–$150k: 4 hours max.
  *   $150k–$350k: 8 hours max.
  *   $350k–$500k: 16 hours max.
  **Sufficient Answer:** A calendar invite block ending at the hard stop. When time expires, you must either pick the current best option that meets aspirations or escalate (see Step 5).

  ### Step 2: Define Aspirations (Musts vs. Targets)
  **Question:** What are the non-negotiable constraints (Musts) and the "good enough" targets (Aspirations)?
  **Rule:** 
  *   **Musts:** Binary pass/fail. (e.g., "HIPAA compliant," "Delivery within 30 days"). If a vendor fails a Must, eliminate immediately.
  *   **Aspirations:** Thresholds that define "satisfactory." (e.g., "Price under $200k," "Warranty ≥ 3 years," "Implementation < 8 weeks").
  **Sufficient Answer:** A written list signed off by the requesting department head *before* looking at vendors. This prevents moving the goalposts later.

  ### Step 3: Sequential Search (Evaluate Against Bar, Not Each Other)
  **Question:** Does Vendor A meet all Musts and Aspirations?
  **Rule:** 
  *   Evaluate vendors one by one. 
  *   Do not compare Vendor A to Vendor B yet. Compare Vendor A to the Aspiration List.
  *   **If Yes:** Mark as "Qualified." Continue searching only if Time Budget < 50% used.
  *   **If No:** Eliminate. Move to next vendor.
  **Sufficient Answer:** A binary "Qualified/Rejected" status for each vendor reviewed.

  ### Step 4: The Stop Rule
  **Question:** Do I have a Qualified vendor, and is the expected gain from searching further worth the remaining time budget?
  **Rule:** 
  *   **Scenario A (First Vendor Qualified):** If Vendor A meets all aspirations and you are under 25% of your time budget, **STOP**. Pick Vendor A. Do not look at Vendor B.
  *   **Scenario B (Multiple Qualified):** If you have 2+ Qualified vendors, pick the one reviewed first (to save evaluation time) unless the second offers a >10% improvement on a critical Aspiration (e.g., price).
  *   **Scenario C (None Qualified):** Proceed to Hard Case Logic (Part 3).
  **Sufficient Answer:** A single vendor selected or a decision to escalate.

  ### Step 5: Value Handoff (When Facts Run Out)
  **Question:** Do the remaining options differ on value judgments rather than facts?
  **Rule:** 
  *   **Fact:** "Vendor A costs $10k more." 
  *   **Value:** "Is the local support team worth $10k more?"
  *   If two vendors meet aspirations but differ on Value traits, do not decide. Write a one-page memo outlining the trade-off and send to the Department Head for sign-off.
  **Sufficient Answer:** A recommendation memo stating: "Option A and B both meet requirements. A costs less; B has better local support. Recommendation: A (based on cost priority), unless Local Support is deemed critical by Dept Head."

  ---

  ## Part 2: Setting and Adapting Aspiration Levels

  Do not set static thresholds. Use a **Dynamic Aspiration Matrix** based on search ease.

  ### Initial Setting (The Baseline)
  1.  **Market Price:** Take the average of the last 3 similar contracts. Set Aspiration Price at +5% of this average.
  2.  **Specs:** Take the minimum specs required for clinical safety/operation. Set Aspiration at "Minimum + 1 standard increment" (e.g., if minimum warranty is 1 year, set aspiration at 2 years).
  3.  **Risk:** For high-risk clinical equipment, tighten Musts. For low-risk supplies, loosen Aspirations.

  ### Adaptation Loop (Post-Decision Review)
  After every 5 decisions, review your "Search Efficiency."

  | Search Outcome | Interpretation | Adaptation for Next Decision |
  | :--- | :--- | :--- |
  | **>3 Vendors Qualified in <25% Time** | Bar is too low. You are leaving value on the table. | **Raise Aspirations:** Tighten price target by 5% or add one "nice-to-have" spec to the Aspiration list. |
  | **0 Vendors Qualified in >75% Time** | Bar is too high. You are gold-plating. | **Lower Aspirations:** Remove the lowest-priority item from the Aspiration list. Convert it from "Aspiration" to "Nice-to-have." |
  | **1 Vendor Qualified at ~50% Time** | Optimal Zone. | **Maintain:** Keep thresholds exactly as is. |
  | **First Vendor Qualified** | High efficiency. | **Maintain:** Trust the stop rule. Do not second-guess. |

  ---

  ## Part 3: Hard Case Logic

  ### Case 1: No Option Meets the Bar
  **Diagnosis:** Your Aspirations are detached from market reality.
  **Action:** 
  1.  **Triage:** Separate Aspirations into "Critical" (clinical impact, major cost) and "Peripheral" (brand preference, extra features).
  2.  **Drop:** Remove the lowest-ranked Peripheral Aspiration.
  3.  **Re-evaluate:** Do existing vendors now meet the bar?
  4.  **Limit:** You may only drop Aspirations twice. If no vendor qualifies after two drops, **Escalate**. Tell the Dept Head: "Market does not support requirements at this budget. Need approval to increase budget or reduce specs."

  ### Case 2: The First Option is Way Above the Bar
  **Diagnosis:** High risk of "maximizing" (wasting time looking for a unicorn).
  **Action:** **STOP.** 
  **Why:** The cost of your time (and the delay in procurement) exceeds the marginal utility of a potentially better vendor. 
  **Exception:** Only continue searching if the contract value is >$400k AND the first option has a known high-risk factor (e.g., new vendor with no references).

  ### Case 3: Search Fatigue (Nothing Good After Many Options)
  **Diagnosis:** Sunk cost fallacy risk.
  **Action:** 
  1.  Check Time Budget. If >80% used, **Pick the Best Qualified So Far** (even if it barely missed some Aspirations) OR **Escalate**.
  2.  Do not lower "Musts" (safety/compliance). Only lower "Aspirations."
  3.  **Rule:** If you have reviewed 5 vendors and none qualify, you are not allowed to search for a 6th without Dept Head approval.

  ---

  ## Part 4: Failure Modes (Where This Will Misfire)

  1.  **The "Regret" Error:** The procedure will explicitly tell you to ignore Vendor B if Vendor A meets all bars and Vendor B is only slightly better. You will later find out Vendor B had a feature you didn't know you wanted. **Accept this.** The cost of finding that feature ex-ante exceeds the value of the feature.
  2.  **The "Anchoring" Error:** If your first vendor is mediocre but meets the bar, you might stop there. If the market is actually full of great vendors, you miss out. **Mitigation:** If you stop on the first vendor, spot-check one more vendor *after* the decision is made (not for selection, but to calibrate your Aspirations for next time).
  3.  **The "Value Blindness" Error:** The procedure treats value judgments as escalations. If your Dept Head is indecisive, this creates bottlenecks. **Mitigation:** Pre-authorize specific trade-offs (e.g., "Up to 5% premium for local support") during Step 2.
  4.  **The "Box-Ticking" Error:** Vendors learn to meet your Aspirations exactly while hiding defects elsewhere. **Mitigation:** Keep one "Must" qualitative (e.g., "Reference call with similar hospital must be positive").

  ---

  ## Part 5: Case Studies

  ### Case 1: Routine Supply Contract (Sterile Gloves)
  *   **Context:** $80k annual contract. 4-hour time budget.
  *   **Aspirations:** Price ≤ $0.10/unit, Delivery ≤ 5 days, ISO Certified.
  *   **Search:** 
      *   Vendor A (MedSupply): $0.09/unit, 3 days, ISO Yes. **Qualified.**
      *   Time Used: 45 minutes (18% of budget).
  *   **Procedure Decision:** **STOP.** Pick Vendor A. Do not call Vendor B or C.
  *   **Outcome:** You save 3.5 hours. Vendor B might have been $0.085/unit, but the $400 annual savings is not worth 3.5 hours of your time ($250/hr burdened cost).
  *   **Verdict:** Procedure works as intended.

  ### Case 2: Clinical Software Module (Lab Information System Add-on)
  *   **Context:** $250k contract. 8-hour time budget.
  *   **Aspirations:** Integration with existing Epic system, Go-live < 12 weeks, Price < $275k, 24/7 Support.
  *   **Search:**
      *   Vendor A (HealthTech): Integrates yes, 10 weeks, $260k, 24/7 Support. **Qualified.**
      *   Vendor B (DataCare): Integrates yes, 8 weeks, $280k, 24/7 Support. **Rejected** (Price over aspiration).
      *   Vendor C (SoftMed): Integrates yes, 14 weeks, $240k, 24/7 Support. **Rejected** (Timeline over aspiration).
  *   **Hard Case:** Vendor B is faster but costs more. Vendor C is cheaper but slower.
  *   **Procedure Decision:** Pick Vendor A. 
      *   *Why:* Vendor A meets all aspirations. Vendor B and C fail specific aspirations. 
      *   *Value Handoff:* If you personally prefer Vendor B's speed despite the cost, you cannot decide. You must write the memo: "Vendor A meets all targets. Vendor B is 2 weeks faster but 7% over budget. Recommendation: A. Please confirm if speed is priority over budget."
  *   **Verdict:** Prevents you from spending 4 hours negotiating with B and C to squeeze them into the box.

  ### Case 3: The "Regret" Case (High-End Centrifuge Equipment)
  *   **Context:** $450k capital equipment. 16-hour time budget.
  *   **Aspirations:** Capacity 500 samples/hr, Noise < 60dB, Service Response < 24hrs, Price < $460k.
  *   **Search:**
      *   **Vendor A (ThermoClone):** Meets all aspirations. Price $450k. Response 24hrs. Noise 58dB. **Qualified.**
      *   *Time Used:* 3 hours (19% of budget).
      *   **Procedure Command:** **STOP.** Pick Vendor A.
      *   **Suppressed Information:** You happen to know Vendor B (Eppendorf) has a new model launching next month that is quieter (50dB) and has remote diagnostics, likely costing $470k.
      *   **Procedure Action:** Because Vendor B is not currently available/quoted and exceeds price aspiration, you do not wait. You buy Vendor A.
  *   **The Unpleasant Outcome:** 
      *   Three months later, Vendor B's new model launches. It is clearly superior. The lab staff complain they want the newer tech. You look bad for not waiting.
      *   **Why the Procedure Forced This:** The protocol prioritizes *decision efficiency* over *outcome maximization*. Waiting 3 months incurs a "delay cost" (lab inefficiency) and "search cost" (your time monitoring the launch). The procedure assumes that a "good enough" machine today is worth more than a "perfect" machine in 90 days, unless "cutting edge tech" was explicitly written as a **Must** in Step 2.
      *   **What The Procedure Can't Do:** It cannot predict the future. It cannot account for your personal reputation risk if the staff really wanted the shiny new toy. It treats "Staff Happiness with Latest Tech" as a value judgment that must be quantified in Step 2 (e.g., "Must be latest model year"). If you didn't write that down, the procedure treats it as irrelevant.
      *   **Lesson:** If you suspect a "Vendor B" scenario, you must encode "Market Scan for Upcoming Releases" as a **Must** in Step 2. If you don't, the procedure will force you to buy the available good-enough option and accept the regret as the cost of doing business quickly.
