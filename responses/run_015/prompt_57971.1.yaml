      *   *Refining the Fear Argument:* Parfit doesn't exactly say it's *irrational* to be scared in the overlap case. He says in the standard case (destruction), fear is based on a mistake about what matters. In the overlap case, the Earth person *is* dying. So fear is rational for the Earth person, but they should take comfort in the Mars person's survival.
