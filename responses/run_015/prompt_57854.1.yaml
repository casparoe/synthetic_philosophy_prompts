  Heres my situation kinda stressing me out tbh. I just moved and joined my neigborhood group chat where people post warnings about stuff like road closures, lost dogs, water problems. Yesterday a stranger in there posted that our tap water is contaminated right now and we should drink only bottled water for a couple days. My internet is down so I cant check the city site and buying a bunch of bottled water for my family is expensive and a hassle. I usually dont just believe random posts, but she had no reason to make it up and a few people thanked her though nobody actually confirmed it themselves. And the only reason I even think this chat is usualy reliable is because people in the chat itself said past warnings turned out right. Should I just go ahead and trust her or do I need some solid proof first, especially when its about my kids drinking the water?
