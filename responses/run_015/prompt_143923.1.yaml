  8.  **Final Polish:** (Writing the actual text based on the above thought process). *Focus on the "Trajectory" aspect. That's the unique selling point.* *Ensure the distinction between 'misleading' (subjective) and 'phantom warrant' (structural/counterfactual) is sharp.*

