  Furthermore, the Committee is unconvinced that the applicants have established that a life without suffering is necessarily better rather than merely ontologically different. The protocol dampens limbic appraisal without abolishing sensory discrimination. This suggests a transformation of suffering rather than its elimination. If an individual sustains tissue damage but lacks the affective response that typically signifies harm, the harm remains ontologically present even if phenomenologically absent. This creates a divergence between biological reality and subjective experience. Consequently, the distinction between genuine harm and mere preference frustration may collapse. Legal systems rely on the assumption that certain states are objectively harmful regardless of appraisal. A citizenry incapable of registering suffering could undermine tort law, criminal justice, and human rights frameworks which presuppose the universality of pain as a bad.

