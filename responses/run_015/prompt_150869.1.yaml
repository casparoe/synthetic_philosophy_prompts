  This timeline ensures that biotechnology serves human flourishing without prematurely redefining it. We must distinguish between healing the sick and altering the species. Until the distinction between eliminating suffering and eliminating the capacity to recognize harm is clarified, the Committee cannot endorse heritable intervention. Prudence dictates that we preserve the conditions for moral agency even as we seek to reduce pain. The Committee stands ready to review new data should the proposed oversight mechanism yield evidence that affective engineering can be decoupled from moral attenuation. Until then, the status quo of non-heritable research remains the only ethically defensible path.
