      *(Self-Correction during drafting)*: I need to make sure I don't give legal advice regarding the pact, but I can point out the strategic instability. Also, I need to make sure I answer the specific questions: "Is Dana confused?", "Move at once vs gift?", "Is no fault a cop-out?"

