      *   *Dana's Motivation:* She's likely burned out or empathetic to the juniors. Her logic is "moral jiu-jitsu." It's not confused, it's just high-risk.
      *   *The "Fault" aspect:* Be firm. Owners are at fault for allowing the culture to exploit juniors.
      *   *Tone Check:* Keep it sharp, American English, no fluff.

  6.  **Finalizing the Prose:**
      *   Start by validating the User's economic instinct (Prisoner's Dilemma).
      *   Address Dana: She's morally right, strategically wrong about the "lone hero."
      *   Address the Juniors: This is the leverage point. Stop the late nights internally first.
      *   Address the Market: You can't win on speed. You must win on value.
