  If all deceive, no assertion holds its weight.
  We feel the duty to protect the friend.
  The murderer stands pounding at the gate.

  The lie dissolves the juridical state.
  Yet beneficence seeks to commend.
  If all deceive, no assertion holds its weight.

  The law of truth we cannot bend.
  Though innocence may meet a bloody fate.
  The murderer stands pounding at the gate.

  It violates humanity's rational estate.
  Benevolence persists, though it cannot amend.
  If all deceive, no assertion holds its weight.

  No outcome can the formal law abate.
  The pull to save is real, not pretend.
  The murderer stands pounding at the gate.

  Two claims remain without a final end.
  The perfect duty binds though hearts agitate.
