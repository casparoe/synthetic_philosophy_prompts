answer: |-
  ### The Design Space Axes

  Before presenting the tree, here are the five independent axes derived from your constraints. These define the logical volume the tree navigates. I have prioritized *governance signal* over philosophical purity.

  1.  **Necessity of Non-Determinism:** Is the "smart" loop load-bearing, or could a deterministic script achieve the same outcome? (Tests for gratuitous agency).
  2.  **State Coupling:** Does the system touch external state, and if so, is every touch coupled to a human approval token? (Tests for tool vs. actor).
  3.  **Temporal Autonomy:** Does the goal persist beyond the request lifecycle, and does the system choose the means to achieve it? (Tests for job vs. agent).
  4.  **Permission Dynamism:** Can the system expand its own affordances (install, spawn, delegate) during execution? (Tests for supply chain/recursive risk).
  5.  **Risk Profile:** Is authority bounded by hard budget, tied to a user principal, or reliant on interruptibility? (Tests for blast radius and liability).

  ---

  ### The Classification Decision Tree

  **Node 1 (Gratuitous Agency):** If you replaced the decision loop (LLM, heuristic engine) with a deterministic script, would the system fail to complete its defined task?
  *   **No** → **Leaf 1: Deflationary (Capability + Authority Only)**
  *   **Yes** → Go to Node 2.

  **Node 2 (External State):** Does the system modify production state, code repositories, or financial records (excluding ephemeral logs or advisory comments)?
  *   **No** → **Leaf 2: Pure Instrument**
  *   **Yes** → Go to Node 3.

  **Node 3 (Approval Coupling):** Does *every* state-changing action require a distinct human approval token issued *after* the system proposes the action?
  *   **Yes** → **Leaf 3: Gated Tool**
  *   **No** → Go to Node 4.

  **Node 4 (Objective Persistence):** Does the system retain an active objective after the triggering API request returns (e.g., runs for 30 mins, waits on events)?
  *   **No** → **Leaf 4: Automated Script (Unnamed)**
  *   **Yes** → Go to Node 5.

  **Node 5 (Means Discretion):** Does the system select *which* specific methods, APIs, or code paths to call to achieve the objective?
  *   **No** → **Leaf 5: Fire-and-Forget Job**
  *   **Yes** → Go to Node 6.

  **Node 6 (Permission Expansion):** Can the system modify its own permission set during execution (install packages, spawn sub-agents, mint credentials, spend unallocated money)?
  *   **Yes** → **Leaf 6: Affordance-Acquiring Agent**
  *   **No** → Go to Node 7.

  **Node 7 (Budget Hardness):** Is the system's authority bounded by a hard, pre-allocated budget (compute, money, rate limit) that cannot be exceeded without redesign?
  *   **Yes** → **Leaf 7: Supervised Agent**
  *   **No** → Go to Node 8.

  **Node 8 (Identity Principal):** Does the system act under a specific end-user's identity (e.g., sending email as them, accessing their calendar) rather than a service principal?
  *   **Yes** → **Leaf 8: Principal-Acting Agent**
  *   **No** → Go to Node 9.

  **Node 9 (Failure Direction):** If human supervision is withdrawn, does the risk of undesirable state accumulation increase over time?
  *   **Yes** → **Leaf 9: Wide-Authority Agent**
  *   **No** → **Leaf 10: Benign Service Agent (Unnamed)**

  ---

  ### The Leaves: Commitments and Consequences

  1.  **Deflationary (Capability + Authority Only)**
      *   *Awkward Commitment:* You are calling it an agent for marketing, but it is legally and technically a script.
      *   *Engineering Consequence:* Treat as standard infrastructure; no special agent governance required, audit the authority not the loop.

  2.  **Pure Instrument**
      *   *Awkward Commitment:* It analyzes the world but cannot change it, limiting its utility to advisory roles.
      *   *Engineering Consequence:* Low security review; focus on data privacy and correctness, no kill switch needed.

  3.  **Gated Tool**
      *   *Awkward Commitment:* The system is smart enough to propose but not trusted to commit, creating potential approval fatigue.
      *   *Engineering Consequence:* Mandatory audit log of proposals vs. approvals; human is the liability owner.

  4.  **Automated Script (Unnamed)**
      *   *Awkward Commitment:* It has irreversible authority but no persistence, meaning errors happen instantly and vanish.
      *   *Engineering Consequence:* High-risk configuration; requires pre-deployment verification and immediate rollback capability.

  5.  **Fire-and-Forget Job**
      *   *Awkward Commitment:* It runs unattended but has no discretion, so failures are deterministic but unobserved.
      *   *Engineering Consequence:* Requires completion alerts and idempotency checks; no runtime intervention controls needed.

  6.  **Affordance-Acquiring Agent**
      *   *Awkward Commitment:* It can rewrite its own security boundary, making static threat models obsolete.
      *   *Engineering Consequence:* Non-negotiable sandboxing, recursive spend limits, and explicit sign-off on delegation logic.

  7.  **Supervised Agent**
      *   *Awkward Commitment:* It is trusted to act only because it cannot afford to do too much damage.
      *   *Engineering Consequence:* Hard budget enforcement in the control plane; audit logs must track budget consumption per goal.

  8.  **Principal-Acting Agent**
      *   *Awkward Commitment:* It legally acts as the user, blurring the line between user error and system bug.
      *   *Engineering Consequence:* Requires user-level consent flows and "act on behalf of" audit trails; liability sits with the principal.

  9.  **Wide-Authority Agent**
      *   *Awkward Commitment:* It is trusted to break things, relying on human speed to fix it before damage compounds.
      *   *Engineering Consequence:* Mandatory kill switch, real-time observability, and named on-call liability owner.

  10. **Benign Service Agent (Unnamed)**
      *   *Awkward Commitment:* It has autonomy but no risk, making the "agent" label feel like over-engineering.
      *   *Engineering Consequence:* Standard service level agreements (SLAs); focus on availability rather than safety controls.

  ---

  ### Case Mapping

  *   **Linter (suggests edits, never writes):** Node 2 = No → **Leaf 2 (Pure Instrument)**.
  *   **CI Bot (opens PR, cannot merge):** Node 3 = Yes (Merge requires approval) → **Leaf 3 (Gated Tool)**.
  *   **Research Job (30 min, report only):** Node 4 = Yes, Node 5 = No → **Leaf 5 (Fire-and-Forget Job)**.
  *   **Support System (refunds < limit):** Node 7 = Yes (Hard limit) → **Leaf 7 (Supervised Agent)**.
  *   **Incident-Response Bot (restart/edit config):** Node 7 = No, Node 8 = No, Node 9 = Yes → **Leaf 9 (Wide-Authority Agent)**.
  *   **Coding Agent (install deps, create resources):** Node 6 = Yes → **Leaf 6 (Affordance-Acquiring Agent)**.
  *   **Scheduling Assistant (send mail as user):** Node 8 = Yes → **Leaf 8 (Principal-Acting Agent)**.
  *   **Delegating System (spawn sub-agents):** Node 6 = Yes → **Leaf 6 (Affordance-Acquiring Agent)**.

  ---

  ### Analysis of the Space

  **1. Unoccupied Combinations**
  *   **The "Dangerous Script" (Leaf 4):** You suspected a batch job with irreversible authority and no persistence is unoccupied. The tree confirms this: Node 4=No (No Persistence) + Node 3=No (No Gate) + Node 2=Yes (State Change). This region is **unattractive**. Engineering intuition rejects it because it combines high blast radius with zero observability. If a system can break production, you either want to watch it run (Persistence) or approve the break (Gate). Finding a system here indicates a design flaw.
  *   **Persistent + No Discretion + Expansion:** A system that runs for a long time, follows fixed steps, but can install packages. This is **incoherent**. If it can install packages, it has discretion over its environment, which violates "No Discretion."

  **2. Indistinguishable Leaves**
  *   **Wide-Authority (Leaf 9) vs. Principal-Acting (Leaf 8):** The tree separates them by Identity (Service vs. User), but the *governance* is nearly identical. Both require high-trust audit logs, kill switches, and clear liability ownership. Whether the agent spends company money (Wide) or user reputation (Principal), the risk control is "assume it will go rogue and limit the blast."
  *   **Fire-and-Forget (Leaf 5) vs. Benign Service (Leaf 10):** Both run unattended. The distinction is Means Discretion (Node 5). However, if the "fixed steps" of the Job are complex enough to fail subtly, the operational response (alerting) is the same as for the Benign Service. The tree separates them by *design*, but operations may treat them similarly.

  **3. The Single Cut Doing Most Work**
  *   **Node 6 (Permission Expansion)** is the highest-leverage cut.
  *   Everything above Node 6 is containable; you can budget it, gate it, or interrupt it.
  *   Everything below Node 6 (Affordance-Acquiring) introduces recursive risk. Once a system can give itself more power, static governance (budgets, gates) becomes porous. This single question separates "systems we can manage with policy" from "systems we must manage with architecture (sandboxing)."

  **4. Binary, Spectrum, or Axes?**
  *   The tool/agent distinction is **two axes that your team is conflating**.
  *   **Axis 1: Autonomy (Nodes 4 & 5).** Does it persist and choose means? This is the "Agent" label marketing uses.
  *   **Axis 2: Authority (Nodes 2, 3, 6, 7).** Can it break things? This is the "Agent" label security uses.
  *   Your friction comes from calling a high-autonomy/low-authority system (Research Job) the same word as a low-autonomy/high-authority system (Incident Bot). The tree forces you to score them separately. Do not seek a binary definition; seek a coordinate on these axes.
