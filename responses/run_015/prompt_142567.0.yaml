answer: |-
  This is not a dumb argument. You have stumbled into the intersection of **mereology** (the study of parts and wholes) and **social ontology** (the study of how human institutions exist). Priya is making a metaphysical claim to win a data modeling argument. That is a category error, but a fascinating one.

  Here is a menu of the precise claims her sentence ("There are no committees, only people arranged committeewise") could be making. I have ordered them from most extreme to most pragmatic. For each, I will tell you if it's plausible, if it's trivial, and crucially, **if it actually gets Priya the three things she wants** (No IDs, No Money, New Committee on Turnover).

  ### 1. Mereological Nihilism
  *   **The Claim:** Composite objects do not exist at all. There are only simple, indivisible particles (or "the tiny bits"). There are no people, there are no committees, there are no databases. There are only particles arranged person-wise and committee-wise.
  *   **Plausibility:** Philosophically defensible, practically insane. If this is true, you cannot have a "Person ID" either, because a person is a composite of cells/atoms.
  *   **Does Priya Win?** **Technically Yes, but she burns the house down.** If there are no committees, there are no IDs. But there are also no people to assign the IDs to. This view makes data modeling impossible.
  *   **Verdict:** She isn't actually a nihilist, or she'd refuse to model people too.

  ### 2. Mereological Universalism
  *   **The Claim:** Any collection of things, arranged any way, constitutes an object. There is a "committee," but there is also an object composed of "the committee plus my coffee mug," and an object composed of "the left shoe of every member."
  *   **Plausibility:** Popular among logicians, counter-intuitive for everyone else.
  *   **Does Priya Win?** **No.** This view says committees *definitely* exist. They are just one type of object among infinite types. This undermines her claim that we shouldn't give them IDs.
  *   **Verdict:** Not her position.

  ### 3. Ontological Reductionism (The "Just Is" View)
  *   **The Claim:** Committees exist, but they aren't *additional* things over and above the people. To say "The Committee met" is just a shorthand for "The People, arranged committeewise, met." The committee is real, but it is nothing more than its members.
  *   **Plausibility:** Very high. This is likely what Priya actually believes.
  *   **Does Priya Win?** **No.** This is the critical failure in her logic. Even if a committee *is just* the people, we still often need a label for that specific arrangement.
      *   *IDs:* We can have an ID for the *arrangement* even if the arrangement isn't a "substance." (Example: A "marriage" is just two people arranged spouse-wise, but we still issue a Marriage License ID).
      *   *Money:* Legal ownership can attach to a defined group even if the group is reducible to individuals.
      *   *Turnover:* If the committee *is* the people, then yes, changing people changes the committee. **This is the only point she wins.** But see Option 4.
  *   **Verdict:** This is her strongest metaphysical footing, but it doesn't justify deleting the table. It justifies making the table a "view" or a relationship table, but you might still need to track the *group* as a unit for legal reasons.

  ### 4. Social/Institutional Ontology (The "Status Function" View)
  *   **The Claim:** Committees are not physical objects like rocks; they are **institutional facts**. They exist only because we have rules (charters, bylaws, laws) that say they exist. A committee is a "status" we impose on a group of people.
  *   **Plausibility:** **Highest for your specific case.** This is how banks, courts, and corporations work.
  *   **Does Priya Win?** **Absolutely Not.**
      *   *IDs:* Institutional entities *require* IDs to function (Tax IDs, Charter Numbers).
      *   *Money:* Money is an institutional fact. It requires an institutional entity to hold it. If the committee dissolves, the money must legally move somewhere.
      *   *Turnover:* Institutional continuity is defined by **rules**, not biology. If the bylaws say "The Committee persists despite membership changes," then metaphysically, the Committee persists. The "arrangement of people" changed, but the "institutional status" did not.
  *   **Verdict:** This destroys Priya's argument. Committees are defined by their charter, not their atoms.

  ### 5. Conceptual Relativism
  *   **The Claim:** Whether a group of people counts as a "committee" depends on our interests and concepts, not on the world itself. The world doesn't care; *we* carve out "committees" because we need to track budgets and minutes.
  *   **Plausibility:** High.
  *   **Does Priya Win?** **No.** If existence depends on *our concepts*, then we get to decide. Since our concept of a committee includes "holding a bank account" and "persisting through turnover," then the data model must reflect that. Priya is trying to let metaphysics dictate our concepts, but this view says our concepts dictate the metaphysics.
  *   **Verdict:** This supports *your* data model, not hers.

  ---

  ### Critique of Your Guesses
  You were surprisingly accurate. Here is the scorecard:
  *   *"No composite things at all"*: **Correct.** (Option 1: Nihilism).
  *   *"Composites not basic furniture"*: **Correct.** (Option 3: Reductionism).
  *   *"Committeewise smuggles the committee back in"*: **Correct.** This is a famous linguistic objection to Reductionism. If you have to define the "arrangement," you usually have to reference the function of the committee, which presupposes the committee exists.
  *   *"Composition happens no matter how"*: **Correct.** (Option 2: Universalism).
  *   *"Depends on us and our concepts"*: **Correct.** (Option 5: Relativism).
  *   *"No fact of the matter"*: **Correct.** (This is called *Indeterminacy*, a valid option I didn't list above, but it leads to "do whatever is pragmatic," which helps you).

  **Where you might be wrong:** You suspected the money question is "about rules somebody wrote down." You are **right**, and Priya is **wrong**. Metaphysics does not override contract law.

  ---

  ### Addressing Your Edge Cases
  Here is how to deploy this in the meeting, specifically targeting her three conclusions using your edge cases.

  **1. Two committees, same members, different charters.**
  *   *Priya's View:* Impossible. If it's just "people arranged committeewise," and the people are the same, it's the same committee.
  *   *The Counter:* This proves **Option 4 (Institutional Ontology)**. The committee is defined by the *charter*, not the *people*. If you model this as just people, you cannot represent two distinct committees with the same membership. You need a Committee ID to distinguish the Charters.
  *   *Win:* You.

  **2. Total turnover, but bank account and backlog continue.**
  *   *Priya's View:* The old committee died; a new one was born. The money is now ownerless or must be transferred.
  *   *The Counter:* This is the **Ship of Theseus** problem. In physical objects, we debate this. In *institutions*, we do not. The IRS and the Bank do not care about the atoms. They care about the Tax ID. If the model forces a "New Committee," you break the link to the bank account.
  *   *Win:* You. (Unless you want to file new tax forms every summer).

  **3. A committee on the org chart that has never met.**
  *   *Priya's View:* No people arranged committeewise = No committee.
  *   *The Counter:* It still has a budget. It still has a chairperson assigned. It exists as a **potentiality** defined by rules. If you delete it from the model because they haven't met, you lose the budget allocation.
  *   *Win:* You.

  **4. Subcommittee = Parent minus one guy.**
  *   *Priya's View:* Just a different arrangement of people.
  *   *The Counter:* They have different voting powers. They have different minutes. They are distinct legal agents. Reductionism collapses the distinction between "The Board" and "The Executive Committee."
  *   *Win:* You.

  ---

  ### The Script for Your Meeting
  You can read this or adapt it. It avoids name-dropping philosophers and focuses on the data consequences.

  > "I've been thinking about Priya's point that 'there are no committees, only people.' I think metaphysically, she might be right that a committee isn't a physical object like a rock. But for our data model, that distinction doesn't give us the conclusions she wants.
  >
  > There are three ways to interpret her claim, and none of them simplify our schema:
  >
  > 1.  **If she means committees don't exist at all:** Then 'People' don't exist either—they're just atoms arranged person-wise. We can't model that. We have to model composites.
  > 2.  **If she means committees are just shorthand for groups of people:** That's true, but we still need an ID for the group. A 'Marriage' is just two people, but we still need a Marriage Certificate ID to track their joint taxes. We need a Committee ID to track the joint budget.
  > 3.  **If she means committees are defined by rules, not biology:** This is the one that actually fits our business. A committee is an institutional status. That means its identity comes from its Charter, not its members.
  >
  > **Here is the dealbreaker:** We have cases where the members change completely, but the bank account and the unfinished business stay the same.
  >
  > If we follow Priya's model, every time the membership rotates, the old committee 'dies' and a new one is 'born.' That means the bank account loses its owner. The unfinished business loses its owner. We would have to manually migrate assets every summer.
  >
  > So, even if Priya is right that committees are 'just people,' they are people *bound by a persistent rule set*. The data model needs to represent the Rule Set (the Committee Entity), not just the People (the Members). The Committee ID isn't tracking a physical object; it's tracking a legal container. If we remove it, we break the link to the money."

  ### Summary
  Priya is using a metaphysical truth (committees are reducible to people) to argue for a practical falsehood (we don't need to track committees as units).

  *   **Her Claim:** Ontological Reductionism.
  *   **Her Error:** Confusing *what something is* with *how we track it*.
  *   **Your Move:** Argue for **Institutional Ontology**. Committees exist because rules say they exist, and those rules require continuity of identity regardless of membership turnover. The "Committee ID" is the anchor for the rules, not the people.
