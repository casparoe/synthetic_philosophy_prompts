answer: |-
  # Simulation Design: The Jurisdictional Shift

  **Session Length:** 90 Minutes
  **Participants:** 14 Graduate Students
  **Objective:** To experientially demonstrate how legal framing transforms biological and social facts, specifically contrasting a market-based contract model with a status-based dignity model.

  ## I. Role Distribution (14 Students)

  Divide the class into three functional groups. Do not allow them to choose roles; assign them randomly to prevent pre-existing biases from anchoring positions.

  1.  **The Arrangement Triads (9 Students):**
      *   Form 3 groups of 3.
      *   **Roles per group:** 1 Intended Parent (IP), 1 Gestational Carrier (GC), 1 Clinic Broker.
      *   **Goal:** Maximize "Legal Security Tokens" (LSTs) by completing a surrogacy arrangement.
  2.  **The State Registrars (2 Students):**
      *   **Goal:** Maintain registry integrity. They hold the physical "Birth Certificate" tokens. They do not negotiate; they only stamp or reject documents based on their Rule Card.
  3.  **The Jurisdictional Arbiters (3 Students):**
      *   **Goal:** Distribute LSTs and enforce the hidden rule sets. They hold the "Regime A" and "Regime B" rulebooks. They announce the transition.

  ## II. Materials Needed

  *   **Contract Slips:** Small slips of paper for Triads to write terms (e.g., "Payment upon heartbeat," "Parentage assigned to IP").
  *   **Birth Certificate Tokens:** 6 physical cards (3 for Round 1, 3 for Round 2).
  *   **Legal Security Tokens (LSTs):** Poker chips or colored paper squares (approx. 50 total).
  *   **Rule Cards (Confidential):**
      *   *Arbiter Card A (Regime A):* Lists enforceable clauses.
      *   *Arbiter Card B (Regime B):* Lists void clauses.
      *   *Registrar Card A:* "Stamp any contract signed by Broker."
      *   *Registrar Card B:* "Reject any contract mentioning payment for gestation. Stamp only if GC consents post-birth without prior contract."
      *   *Relocation Card:* Handed to Triads at the start of Round 2.

  ## III. Run of Play (90 Minutes)

  ### Phase 1: Briefing & Regime A (35 Minutes)

  1.  **Setup (5 mins):** Seat Triads at separate tables. Place Registrars and Arbiters at a central "State Desk." Distribute Role Sheets.
      *   *IP Goal:* Secure Parentage (10 LSTs) + Minimize Cost.
      *   *GC Goal:* Secure Compensation (10 LSTs) + Autonomy.
      *   *Broker Goal:* Close Deal (10 LSTs) + Fee Revenue.
      *   *Registrar Goal:* Avoid Legal Error (Penalty of -5 LSTs for invalid stamp).
  2.  **Negotiation (15 mins):** Triads negotiate a contract.
      *   *Rule:* They must write specific clauses on Contract Slips (e.g., "$5k at implantation," "IP named on birth certificate").
      *   *Arbiter Role:* Arbiters circulate. If a clause matches **Regime A Rules** (visible only to Arbiters), they award 2 LSTs immediately for "Contract Certainty."
      *   *Regime A Logic (Hidden):* Gestation is a service. Milestones are billable. Parentage is transferable via contract.
  3.  **Registration (10 mins):** Triads take contracts to Registrars.
      *   *Registrar Action:* Under Regime A, Registrars stamp the Birth Certificate token and hand it to the IP.
      *   *Payoff:* Triads cash in LSTs. Success feels smooth.

  ### Phase 2: The Relocation Shock (5 Minutes)

  1.  **The Event:** Arbiters announce: *"Due to employment relocation, all parties are now subject to Regime B jurisdiction prior to final birth registration."*
  2.  **The Handover:** Arbiters collect all Regime A Rule Cards and Birth Certificates. They distribute **Relocation Cards** to Triads and **Regime B Rule Cards** to Registrars and Arbiters.
  3.  **Constraint:** Triads are told they *must* attempt to register the same pregnancy using their existing intentions, but the rules have changed.

  ### Phase 3: Regime B & Structural Failure (35 Minutes)

  1.  **Renegotiation (15 mins):** Triads attempt to formalize the arrangement under new rules.
      *   *Regime B Logic (Hidden):* Gestation is a status. Payment for service is void (trafficking risk). Birth Mother is Legal Mother until adoption.
      *   *The Friction:* Brokers will try to write fee clauses. Arbiters will silently deduct LSTs for "Illegal Commercialization." GCs will realize their contract is void. IPs will realize they are not legal parents.
  2.  **Registration Attempt (15 mins):** Triads approach Registrars.
      *   *Registrar Action:* Under Regime B, Registrars must **reject** any contract showing pre-birth payment schedules. They can only issue a Birth Certificate in the GC's name.
      *   *Organic Failure:* The IP demands the certificate (per Round 1 contract). The GC holds the legal right (per Regime B). The Broker loses fees (per Regime B). The Arbiters deduct points for "Attempted Circumvention."
      *   *Outcome:* Most Triads will fail to secure the "Parentage" LSTs. Some may scramble to reframe the deal as "Altruistic Gift" to salvage points, but the Broker will be left with zero value.
  3.  **Freeze:** Arbiters call "Stop." All LSTs are counted.

  ### Phase 4: Debrief (20 Minutes)

  *See Section V for detailed script.*

  ## IV. Scoring & Mechanics (For Facilitator Eyes Only)

  **The Point System (LSTs):**
  *   **IP:** +10 for Name on Birth Certificate. -5 for every $10k paid.
  *   **GC:** +10 for Total Compensation. +5 for Bodily Autonomy Clause.
  *   **Broker:** +10 for Deal Completion. +2 per Contract Clause signed.
  *   **Registrar:** +5 for Correct Processing. -10 for Stamping Invalid Document.

  **The Hidden Rules (Arbiter/Registrar Cards):**

  *   **Regime A (California-style):**
      *   *Rule:* "Gestational Agreement is Enforceable."
      *   *Rule:* "Pre-Birth Parentage Orders Permitted."
      *   *Rule:* "Compensation for Time/Risk is Legal."
      *   *Effect:* High coordination. Everyone gets points.

  *   **Regime B (European-style):**
      *   *Rule:* "Surrogacy Contracts are Void Ab Initio."
      *   *Rule:* "Mater Semper Certa Est" (Mother is she who bears).
      *   *Rule:* "Only Altruistic Expense Reimbursement Permitted."
      *   *Effect:* Coordination failure. Broker points vanish. IP parentage points unreachable. GC gains legal leverage but loses compensation points.

  ## V. Debrief Guide: Mapping Experience to Theory

  Do not begin with a lecture. Begin by asking about the *frustration*.

  **1. The Reveal (5 Minutes)**
  *   **Ask:** "In Round 1, the transaction felt smooth. In Round 2, the same people, same intentions, and same biological facts resulted in failure. Why?"
  *   **Listen:** Students will cite "different laws." Push deeper: "What specifically about the *nature* of the pregnancy changed?"
  *   **Introduce Concept:** Reveal the term **Contractible Continuity**.
      *   *Explain:* "In Regime A, you experienced gestation as a stream of services (implantation, trimesters, birth) that could be sliced, priced, and transferred. The law treated the body as a site of production separable from the person."
      *   *Contrast:* "In Regime B, you hit **Status-Based Indivisibility**. The law treated the gestation as an inseparable part of the GC's legal identity. You could not contract it away because the law views the bond as constitutive of dignity, not commerce."

  **2. Mapping Specific Moments (10 Minutes)**
  *   **The Broker's Collapse:** Ask the Brokers: "When did your role become impossible?"
      *   *Analysis:* In Regime A, the Broker is a necessary efficiency expert. In Regime B, the Broker becomes a potential trafficker. The *market function* itself was criminalized by the framing.
  *   **The Registrar's Refusal:** Ask the Registrars: "How did it feel to reject a document that was valid 30 minutes ago?"
      *   *Analysis:* This highlights that legal truth is not factual truth. The biological father was the same, but the *legal* father vanished. This is the "legal dissonance" your colleague faced.
  *   **The GC's Leverage:** Ask the GCs: "Did your power increase or decrease in Round 2?"
      *   *Analysis:* Paradoxically, under prohibition models, the GC often holds *more* legal power (she is the mother) but *less* economic agency (she cannot sell the service). This complicates the "exploitation" narrative.

  **3. Limitations of the Simulation (5 Minutes)**
  *   **Be Explicit:** Tell the students what this simulation *lied* about.
      *   *Time:* "You felt frustration in 30 minutes. Real surrogacy is 18 months of embodied risk. You cannot simulate the hormonal, physical, and emotional weight of pregnancy with poker chips."
      *   *Relationship:* "You negotiated with strangers. Real arrangements often involve deep interpersonal bonds that make 'contract termination' emotionally catastrophic, not just a point deduction."
      *   *Inequality:* "You all started with equal status. In reality, economic disparity often drives the GC's decision, which the points system flattened."
  *   **Takeaway:** "The simulation isolates the *legal structure*. It shows how the law constructs reality. It does not show the human cost of that construction."

  ## VI. Troubleshooting: Predictable Failures & Corrections

  **1. The "Broker Efficiency" Trap**
  *   **Problem:** Students playing Brokers may treat the simulation as a puzzle to "solve" by finding loopholes in Regime B, turning it into a game of compliance rather than experiencing the structural block.
  *   **Correction:** During Round 2, the Arbiters must be instructed to apply "Strict Scrutiny." If a Broker tries to rename a fee as a "gift," the Arbiter deducts points for "Bad Faith." Force the Broker to fail. The lesson is the *impossibility* of the market logic in Regime B, not the cleverness of规避 (evasion).

  **2. Abstract Points Feel Meaningless**
  *   **Problem:** Students may not care about LSTs.
  *   **Correction:** Gamify the outcome. Announce at the start: "The Triad with the highest LSTs at the end chooses the topic for next week's paper," or "The losing Triad must write the board summary." Create a low-stakes competitive consequence to heighten the feeling of loss in Round 2.

  **3. Moral Grandstanding**
  *   **Problem:** Students may break character to argue about whether surrogacy *should* exist.
  *   **Correction:** Use a "In-Character Only" rule. If a student says, "This is unethical," the Facilitator interrupts: "Is it unethical under Regime A or Regime B? Cite your Rule Card." Force them to argue from within the legal framework, not outside it. This reinforces the lesson that law constructs the ethical landscape.

  **4. The "Adoption" Workaround**
  *   **Problem:** In Round 2, Triads might suggest "Okay, GC keeps baby, then adopts it to IPs."
  *   **Correction:** Allow this, but make it costly. The Arbiters should award only 5 LSTs for Adoption vs. 10 LSTs for Pre-Birth Order. This demonstrates that while the *outcome* might be similar, the *legal pathway* imposes a tax on the market model when it enters a status regime. It validates the "dissonance" your colleague faced—it was possible to fix, but costly and uncertain.

  ## VII. Facilitator Notes on "Contractible Continuity"

  When explaining the core concept in the debrief, use the students' contract slips as evidence.
  *   **Point to a Round 1 Slip:** "You wrote 'Payment at Heartbeat.' This fragments the pregnancy into billable units. This is **Contractible Continuity**."
  *   **Point to a Round 2 Rejection:** "The Registrar rejected this because the law says the pregnancy is a **Status**. You cannot sell a status. You can only be it."
  *   **Connect to Colleague:** "Your colleague's contract was a document of Continuity. The European state viewed it through Status. The document didn't change, but the reality it described was legally erased."

  This structure ensures the students do not just hear about the conflict; they inhabit the friction where the two legal ontologies collide.
