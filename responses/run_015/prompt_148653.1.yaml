answer: |-
  **Reference Classes & Base Rates (March 2003)**

  1.  **Cold War Regime Impositions (Vietnam, Soviet Afghanistan '79, Iran 1953):**
      *   *Definition:* Great power installs government in resistant nationalist context.
      *   *Base Rate:* **0%** for a unified, dependably pro-foreign state after five years. (Iran lasted longer but wasn't unified/democratic; Vietnam/Afghanistan collapsed).
      *   *Confidence:* High. Structural resistance to foreign occupation is historical constant.
      *   *Hindsight Check:* Easy to assign now. In 2003, proponents argued these were "false analogs" because Iraq lacked Cold War ideological insulation.

  2.  **Post-WWII Democratizations (Germany, Japan):**
      *   *Definition:* Total defeat followed by long-term occupation and institutional rebuild.
      *   *Base Rate:* **100%** success.
      *   *Confidence:* Low. Requires societal collapse and homogenous population conditions absent in Iraq.
      *   *Hindsight Check:* Clearly the wrong class, but this was the Bush Administration's *chosen* reference class, proving the selection mechanism is political.

  3.  **Post-Cold War Interventions (Somalia, Haiti, Kosovo, Afghanistan 2001):**
      *   *Definition:* Humanitarian or counter-terror regime change.
      *   *Base Rate:* **~50%** for stability, but **0%** for independence/proxy reliability (all remained protectorates).
      *   *Confidence:* Medium. Afghanistan 2001 was too fresh in March 2003 to score accurately.

  **Vindication or Inside View?**
  This case indicts the outside view. The forecasting tool didn't resolve uncertainty; it weaponized it. Neoconservatives selected Class 2 (WWII); Realists selected Class 1 (Vietnam). Both claimed the mantle of "historical precedent." The choice of reference class was an inside-view judgment about *what kind of war this was*, disguised as statistical humility. The outside view cannot tell you which class you belong in; that is the very thing being fought over.

  **The Self-Negating Forecast**
  Your wrinkle is theoretically sound but empirically empty here. Did knowledge of the "Vietnam" base rate change US behavior? No. The "Vietnam Syndrome" was explicitly rejected by planners. There was no shift to proxies or exit deadlines *ex-ante* based on base rates. Those shifts only occurred *ex-post* (the 2007 Surge, 2011 withdrawal) after the failure was evident. The forecast didn't negate itself because the actors ignored the forecast. The idea isn't too cute, but it requires actors to be rational updaters, which geopolitical ideologues rarely are.

  **Hard Critique**
  The exercise fails on the outcome variable. "Stable, unified, pro-American" is not a hard metric like "cost" or "completion date." It is a political judgment subject to redefinition (e.g., redefining "success" as "elections held" rather than "insurgency crushed"). Reference classes work for engineering problems; they fracture on political ones where the definition of success is part of the conflict. If you can define the outcome loosely, you can always find a reference class that fits. The outside view offers precision where there is none.
