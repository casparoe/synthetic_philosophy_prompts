answer: |-
  You are attending a free all-day symposium at a local hotel where seating is first-come, first-served, and upon entering the lobby you count 19 people ahead of you in the registration line, making you the 20th arrival. The organizers state that total attendance varies uniformly between 20 and 200 people depending on interest, and you must decide immediately whether to stay for the afternoon session or leave; if total attendance exceeds 60, the room will be too crowded to hear the speakers, rendering your trip wasted, but if it remains under 60, the session will be intimate and valuable. You know that attendance is heavily split between morning-only retirees and afternoon-only professionals, and while you are a professional, you arrived early to secure a seat, making it ambiguous whether you should reason as a random sample of all daily attendees or only of the early-arriving cohort.

  (a) Under the broad reference class ("all daily attendees"), you treat your rank of 20 as a random sample from the total population $N$. Given a uniform prior from 20 to 200, the likelihood of observing rank 20 is proportional to $1/N$. This likelihood function heavily weights smaller totals; while the prior mean is 110 (suggesting you should leave), the posterior mean shifts downward to approximately 50. Since 50 is below your crowding threshold of 60, the Doomsday-style update recommends staying. Under the narrow reference class ("early-arriving cohort"), you treat your rank as a sample only of the morning attendance $N_m$, which is independent of the afternoon attendance $N_a$. The update drives the estimate for $N_m$ low, but leaves the estimate for $N_a$ at its prior mean (roughly 100). Consequently, the expected total $N_m + N_a$ remains well above 60, recommending that you leave. The same evidence (rank 20) flips the decision based solely on whether you group yourself with the afternoon crowd.

  (b) The Self-Indication Assumption (SIA) weights hypotheses by the number of observers they contain, assigning a prior probability proportional to $N$. When combined with the Doomsday likelihood ($1/N$), the $N$ terms cancel out, leaving the posterior equal to the original prior. In this scenario, applying SIA under the broad reference class neutralizes the Doomsday update entirely. Your credence reverts to the uniform prior distribution, restoring the expected total to 110. This changes both your credence (you no longer believe a small turnout is likely) and your decision (you now leave, as 110 exceeds the threshold of 60). SIA effectively blocks the practical force of the argument by insisting that your existence is more likely in worlds with more attendees.

  (c) The single feature doing the work is the statistical independence of the afternoon cohort from the morning cohort. The narrow class only blocks the inference about the *total* because knowing the morning size tells you nothing about the afternoon size. If this feature were deleted—for instance, if attendance were driven by a single viral email sent to everyone such that morning turnout perfectly predicted afternoon turnout—then updating on the morning size would necessarily update the total size. In that case, both reference classes would yield the same low estimate for the total, and the decision would remain "stay" regardless of the class choice.

  (d) A Carter–Leslie defender would argue that the narrow reference class is gerrymandered to evade the inference. The risk you are assessing—room crowding—is a function of the total number of attendees, not merely the morning cohort. Therefore, the relevant reference class for assessing that risk is the set of all people who contribute to the crowding. Since you are one of the people contributing to the crowding, you must reason as a random sample from the total set of attendees. The temporal distinction is irrelevant to the physical constraint of the room capacity, so grouping yourself only with early arrivals is an arbitrary restriction that ignores the relevant similarity (being present in the room). Thus, the broad class is the only admissible one, and the original inference stands.
