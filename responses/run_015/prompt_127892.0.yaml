answer: |-
  The conceptual tension arises from the conflict between the logical requirement of falsifiability and the methodological management of theoretical risk. For Karl Popper, a theory is scientific only if it is logically capable of being refuted by observation. This requires that the theory forbid certain states of affairs; if those states occur, the theory must be abandoned. However, theories are never tested in isolation. They are conjoined with auxiliary hypotheses regarding initial conditions, instrument calibration, and background assumptions. This creates the Duhemian problem: when a prediction fails, logic dictates only that the conjunction of the theory and its auxiliaries is false, not which specific component is at fault.

  Popper's standard solution to this problem is the prohibition of *ad hoc* modifications. A modification is *ad hoc* if it is introduced solely to save the theory from refutation without increasing the system's empirical content or testability. The scenario you propose complicates this solution. Here, the research program does not engage in arbitrary, *ad hoc* rescue attempts. Instead, it employs formally codified, rule-governed protocols for revising auxiliary hypotheses when anomalies arise. These protocols are rigorous, transparent, and systematic. They avoid the charge of arbitrariness that typically defines conventionalist stratagems. Yet, a tension remains: methodological rigor in the revision of auxiliaries does not necessarily guarantee the empirical vulnerability of the core theory.

  The precise conceptual point at which this methodological rigor fails to secure genuine empirical risk is the **structural insulation of the theoretical core**. Even if the protocols for revising auxiliaries are rule-governed and non-arbitrary, the system fails Popper's criterion if the rules themselves structurally preclude the rejection of the central theoretical postulates. In this scenario, the "risk" of falsification is displaced from the core theory onto the auxiliary belt. While the auxiliaries are subject to rigorous revision and testing, the protocol mandates that they be adjusted to accommodate data rather than allowing the data to necessitate the abandonment of the core. Consequently, the core theory retains its logical form regardless of empirical input. The system possesses *procedural* rationality without *empirical* fallibility. The failure lies in the fact that the rules of revision determine the outcome of the test in advance: the core is invariant by methodological decree, not by empirical success.

  To distinguish this from straightforward empirical falsification, one must look at the logical locus of the *modus tollens*. In straightforward falsification, the negative result strikes the conjunction of the theory and its auxiliaries, and the scientist faces an unconstrained logical choice regarding which element to reject. The risk is distributed across the entire system. In the protocol-driven case, the methodological rules constrain this choice. The *modus tollens* is effectively intercepted before it can reach the core. The logical force of the anomaly is absorbed by the auxiliary revision protocol. Thus, while the process looks like testing, it functions as a filtering mechanism that allows only data-compatible versions of the auxiliaries to pass, ensuring the core remains untouched. The empirical risk is simulated because the outcome (survival of the core) is guaranteed by the procedural rules, not by the explanatory power of the core itself.

  To distinguish this from explicit conventionalist defense, one must examine the nature of the immunization. Explicit conventionalism is typically arbitrary and psychological; a theorist simply decides to redefine terms or dismiss data to save a theory, often acknowledging the maneuver as a defensive choice. It is a conscious suspension of the falsification rule. In the protocol-driven scenario, the immunization is systemic and objective. It is not a subjective decision to ignore a refutation, but a pre-established methodological commitment to locate error in the auxiliaries. This makes the tension more profound: the research program adheres to strict methodological norms (consistency, rule-following, auxiliary testing) which usually signal scientific integrity, yet it achieves the same dogmatic result as conventionalism. The core theory is rendered unfalsifiable not by a lack of rules, but by the specific content of the rules, which prioritize the preservation of the core over the potential verdict of experience.

  Ultimately, the tension reveals that falsifiability is not merely a matter of having rules for handling anomalies, but requires that the rules allow for the possibility of the core theory's death. If the protocol for revision is designed such that the auxiliary hypotheses are infinitely adjustable to fit any data while the core remains fixed, the system has high methodological coherence but zero empirical content regarding the core. The rigor applies to the shield, not the target. Therefore, under Popper's criterion, such a program remains non-empirical not because it is messy or arbitrary, but because its structural logic renders the central postulates compatible with any possible state of the world.
