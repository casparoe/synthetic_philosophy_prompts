answer: |-
  **MEMORANDUM**

  **TO:** Big Spend Committee
  **FROM:** Student Representative
  **DATE:** October 24
  **SUBJECT:** Recommendation on Voting Procedure for One-Off Pot

  **Recommendation**
  I recommend we adopt **Instant-Runoff Voting (IRV)** for this decision. Each member submits a ranked ballot (1st to 5th choice). If no bid secures a majority of first-place votes, the lowest-ranked bid is eliminated and its votes redistributed until one bid crosses the 50% threshold.

  While the alternative methods have theoretical appeal, IRV offers the strongest balance of legitimacy, stability, and protection against unintended distortion in a small-group setting.

  **The "Median Rule" Proposal**
  The Treasurer suggests voting on the "cost axis" and taking the median spend, arguing this is strategy-proof. Theoretically, she is citing the Median Voter Theorem. This theorem *does* escape the Gibbard–Satterthwaite impossibility result, but only under a strict condition: **single-peaked preferences.**

  This means every voter must have one specific dollar amount they prefer, with utility falling off as you move away from that number in either direction. This does not fit our bids. We are not choosing *how much* to spend; we are choosing *what* to buy. A member might support the low-cost period products and the high-cost mental health line, but oppose the mid-cost bus subsidy. That preference is not single-peaked on a cost axis. If we force these qualitative choices onto a quantitative line, we distort preferences. Once preferences aren't truly single-peaked, the median rule becomes manipulatable again (by shifting the scale or misrepresenting peaks). It doesn't solve the strategy problem; it hides it behind a false assumption.

  **Range Voting (0–5 Points)**
  The strongest argument against IRV is that it discards **intensity of preference**. In a 0–5 score system, you can signal that the Mental Health Line is a "5" (vital) while the PA System is a "3" (nice to have). IRV treats a weak 1st place the same as a strong 1st place.

  Many of you have argued that strategy-proofness is the wrong target because we are a cooperative group, not adversaries. You are right that social pressure reduces gaming. However, procedure should protect against accidents and pressure, not just malice. In Range Voting, if even *one* person "min-maxes" (giving their favorite a 5 and everyone else a 0) while others vote honestly, the strategist effectively gets multiple votes. IRV is more robust: it forces the winner to build a majority coalition rather than just accumulating points from a passionate faction.

  **Why IRV Holds Up**
  IRV ensures the winning bid has broad support. With five distinct bids, a simple plurality could let a bid win with only 25% support. IRV requires the winner to be acceptable to the majority as at least a second or third choice. This is crucial for a "Big Spend" pot; the outcome needs to survive scrutiny from the wider student body.

  **Risk Acknowledgement**
  The trade-off is that IRV is slightly more complex to count than a sum-total, and it does not capture how *strongly* we feel about our top choice. However, given that our bids differ qualitatively rather than along a single spectrum, and that we cannot guarantee perfect honesty in scoring, IRV is the most defensible method to ensure a legitimate majority winner.

  Please review this ahead of Thursday's session. I am happy to walk through a sample count if helpful.
