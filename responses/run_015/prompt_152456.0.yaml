      4.  **The Disanalogy:** Gavagai = Asymmetric (Linguist vs Native). Schmenglish = Symmetric (Self vs Self). The asymmetry is required for the indeterminacy to get off the ground.
      5.  **Cost:** You lose the "View from Nowhere." You must admit that your own language is fixed *for you* in a way the Native's is not *for the Linguist*. This is a form of first-person privilege, but not a mystical one—it's structural.
