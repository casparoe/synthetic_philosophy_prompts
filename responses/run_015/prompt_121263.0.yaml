answer: |-
  Here is the diagnosis you asked for, straight down the line.

  **The Diagnosis**

  This is not a verbal dispute, but it is a misidentified one. You and your readers are not actually arguing about whether moving a hand is worse than keeping it still. You are arguing about **baselines and counterfactuals.**

  When people judge "doing" versus "allowing," they are not looking at the physics of the agent's body. They are looking at the agent's relationship to the expected course of events. The reason the philosophy debate has stalled for fifty years is that professional philosophers try to strip away the context to find a pure moral rule, but human moral intuition is context-dependent by design. We cannot judge an action without first agreeing on what was supposed to happen anyway.

  Your hunch is closer to the truth than your editor's, but it needs sharpening. You said the canonical examples are engineered so the variables line up. That is correct. But the deeper issue is that "doing" and "allowing" are not distinct physical categories. They are labels we paste onto events after we have already decided who was responsible for the outcome.

  Here is what is actually happening in your five cases:

  1.  **Case One (Simple Omission):** Readers split because the baseline is ambiguous. Is the gate normally open? Or normally closed? If the water usually flows and she stops it, that feels like killing. If the water usually stays back and she refuses to release it, that feels like allowing. The physics are identical; the expectation changes the moral weight.
  2.  **Case Two (Interference):** Readers call this worse because she has actively altered the status quo to a state worse than the baseline. She didn't just fail to help; she intervened to reduce the existing level of safety. This triggers a "harm" response rather than a "non-benefit" response.
  3.  **Case Three (Self-Incapacitation):** This proves the physical act is irrelevant. By locking herself in, she creates a causal chain where her prior intention guarantees the outcome. Readers see the intention as the cause, not the lack of movement on the morning. This shows that "agency" is about control, not muscle movement.
  4.  **Case Four (Removing Sandbags):** This is the "double prevention" problem. Readers stumble here because removing a barrier feels like an action, but the flood was the real killer. The confusion arises because she removed a *human-made* safety net. If she removes a natural barrier, it feels like nature taking its course. If she removes a human barrier, it feels like she is undoing a promise of safety.
  5.  **Case Five (Customary Claim):** This is the smoking gun. When you change the backstory to give the orchard a customary claim, the physical act hasn't changed, but the moral judgment flips. This proves that the "doing/allowing" distinction is actually a **property rights distinction.** If the water is theirs by custom, withholding it is taking. If the water is hers by law, withholding it is keeping.

  **What Each Side Is Committed To**

  *   **The "Doing" Side (Your Editor):** They are committed to the idea that agency requires intrusion. They believe that inserting yourself into the causal chain makes you responsible for the result in a way that standing aside does not. They are worried about slippery slopes: if not opening the gate is murder, then not donating a kidney is also murder. They need a bright line to protect personal liberty.
  *   **The "Allowing" Side (Your Sister):** They are committed to the idea that agency requires capacity. If you could have stopped the bad thing at low cost, you are responsible for it happening. They view the world as a web of interdependence where standing aside is a choice with consequences. They are worried about loopholes: if I can kill you by pushing you off a cliff, but not by refusing to throw you a rope when you're hanging off it, the law is absurd.

  **Is There Progress to Be Made?**

  There is no formal result or logical proof that will solve this, because it is not a logic problem. It is a cognitive science problem. Progress would come from empirical evidence showing that people's judgments shift predictably when you change the **default state** of the system.

  If you ran an experiment where the gate was mechanically set to spring open unless held shut, versus spring shut unless held open, you would find that people's moral judgments flip based on the mechanism, even if the physical effort required by the woman is identical. This proves the judgment is about **deviation from the norm**, not energy expenditure.

  **Will It End?**

  No. It will not end because it bottoms out in two competing human needs. We need to feel free to mind our own business (which requires a strong doing/allowing distinction), and we need to feel safe from our neighbors (which requires a weak distinction). Society constantly renegotiates this line based on scarcity. In a drought, the expectation of sharing increases, so "allowing to die" starts looking more like "killing." In a surplus, the distinction hardens. The debate stalls because the stakes change, not because the logic is flawed.

  **Advice for the Novel**

  Do not dramatize the physical distinction between opening and not opening the gate. That is the fake fault line. Your readers will argue past each other based on their own political intuitions about property and sacrifice, and no amount of description about the rust on the lever will change that.

  **The Disagreement Worth Dramatizing**

  Dramatize **Case Five: The Baseline.**

  The tension in your book should not be "Is she killing them or letting them die?" The tension should be "Whose water is this, really?"

  The moral weight comes from the **expectation of flow.** If the water has flowed to that orchard for thirty years, the orchard owners view that water as theirs. To them, closing the gate is an act of aggression, a diversion, a theft. To the watermaiden, it is her legal property, and she is simply choosing not to gift it.

  The real conflict is not about the sluice gate; it is about the **history of the valve.**

  **The Scene That Makes Readers Feel It**

  Here is how you write the scene to bypass the intellectual debate and hit the moral intuition directly.

  Don't describe her hand hovering over the lever. Describe the **routine.**

  For twenty years, the routine has been: Sun rises, she walks to the gate, she turns the wheel three clicks clockwise, and the water flows. The orchard downriver wakes up to the sound of water. It is as reliable as the sun.

  This year, she walks to the gate. She turns the wheel three clicks **counter-clockwise**. Or perhaps she simply doesn't turn it at all, leaving it in the position it was left in the night before.

  If you write it so that the *normal state of the world* is water flowing, then her inaction is a violation of the natural order. It feels like she reached down and turned off the tap. The readers will feel the violence of the silence downstream.

  If you write it so that the *normal state* is the gate closed, and she has to make an effort to open it, then her inaction is just staying home.

  **The Winning Version:**

  Make the mechanism automatic, but dependent on her maintenance. The gate is designed to stay open unless it jams. It requires her to go down and clear the debris every morning to keep the water flowing.

  If she simply doesn't go down to clear the debris, is she killing the orchard?

  Now, add the Case Five element: The orchard owners have been paying her a small fee for twenty years to clear the debris. It's not a legal tax, just a custom. A handshake deal. This year, she decides the fee is too low. She stays in bed. The debris clogs the gate. The water stops. The trees die.

  Is that murder? Or is it a contract dispute?

  By making the water flow dependent on her *ongoing labor* rather than a one-time lever pull, you force the reader to weigh the cost of her sacrifice against the value of the orchard. But by adding the *customary payment*, you shift the baseline. The water was "theirs" by social contract, even if not by law.

  This version isolates the real variable. It removes the "active diversion" vs. "passive omission" confusion. She didn't touch the gate. She just didn't do her job. But because the job was expected, the omission feels like an attack.

  This is where the real moral pain lives. It's not in the physics of the water. It's in the breach of trust. Your readers won't argue about definitions of killing. They will argue about whether a handshake deal matters more than a legal deed during a drought. That is a conflict you can write. The rest is just noise.
