answer: |-
  # Taxonomy of Symbolic Causation: The Careenium-Simmball Tree

  ## Root Case
  A synthetic system contains a token with the formal structure **"if X then move arm."** The arm moves.
  **Question:** Is the movement caused by the token's *symbolic property* (the instruction/meaning), or only by the *voltage patterns* that happen to instantiate it?

  ---

  ## The Decision Tree

  **Split 1: Substrate Specificity**
  *   **A. Generic:** Symbolic causation can occur in any physical system capable of state differentiation (standard silicon, neurons, dominoes).
  *   **B. Special:** Symbolic causation requires a specific substrate architecture with resonant dynamics (a **Careenium**) that couples abstraction to physics.

  **Split 2: Content Requirement**
  *   **A. Semantic:** The causal leverage depends on the *meaning* or reference of the symbol (aboutness).
  *   **B. Syntactic:** The causal leverage depends only on the *formal shape* or structural role of the symbol (symbol manipulation).

  **Split 3: Causal Pathway**
  *   **A. Direct:** The symbolic unit itself (the **Simmball**) exerts mechanical leverage; the abstraction is the lever.
  *   **B. Mediated:** The symbol is a description; causation flows through intermediate representational or physical layers (voltage -> gate -> motor).

  **Split 4: Physical Closure**
  *   **A. Reconciled:** Downward causation is consistent with the causal closure of the physical (compatibilist/supervenient).
  *   **B. Violates:** Downward causation introduces energy or information not accounted for by substrate physics (interactionist/dualist).

  ---

  ## Leaf Analysis (16 Logical Combinations)

  Below are the positions resulting from every combination of the four splits. Positions are named where they correspond to defended philosophical stances; otherwise, they are diagnosed as unnamed.

  ### Branch 1A: Generic Substrate (Standard Physics)
  *   **1A-2A-3A-4A (Generic/Semantic/Direct/Reconciled):** **Unnamed (Incoherent).** Generic physics lacks the specific coupling required for semantic properties to exert direct leverage without violating closure or reducing to syntax.
  *   **1A-2A-3A-4B (Generic/Semantic/Direct/Violates):** **Substance Dualism.** Claims meaning acts as a ghost in the machine, breaking physical law.
  *   **1A-2A-3B-4A (Generic/Semantic/Mediated/Reconciled):** **Standard Computational Representationalism.** Semantics is real but causally inert; the voltage mediates the action, and semantics supervenes descriptively.
  *   **1A-2A-3B-4B (Generic/Semantic/Mediated/Violates):** **Unnamed (Unstable).** Claims mediation by physical layers but asserts a violation of closure; implies magic within the mediation chain.
  *   **1A-2B-3A-4A (Generic/Syntactic/Direct/Reconciled):** **Physicalist Syntax Identity.** Syntax is not distinct from voltage patterns; the "push" is just physics described formally.
  *   **1A-2B-3A-4B (Generic/Syntactic/Direct/Violates):** **Unnamed (Incoherent).** If syntax is identical to physical pattern (Generic), it cannot violate closure without denying physicalism.
  *   **1A-2B-3B-4A (Generic/Syntactic/Mediated/Reconciled):** **Substrate Determinism.** Symbols are epiphenomenal shadows; only the substrate dynamics determine the outcome.
  *   **1A-2B-3B-4B (Generic/Syntactic/Mediated/Violates):** **Unnamed (Incoherent).** Mediation implies a physical chain; violating closure implies a break in that chain, contradicting the "Generic" substrate premise.

  ### Branch 1B: Special Substrate (Careenium)
  *   **1B-2A-3A-4A (Special/Semantic/Direct/Reconciled):** **Careenium Interactionism.** The specific substrate dynamics allow semantic properties to lock onto physical trajectories without adding energy (resonant downward causation).
  *   **1B-2A-3A-4B (Special/Semantic/Direct/Violates):** **Vitalist Interactionism.** The special substrate acts as a receiver for non-physical semantic forces that add energy to the system.
  *   **1B-2A-3B-4A (Special/Semantic/Mediated/Reconciled):** **Weak Emergentism.** The substrate allows semantics to arise, but causation is still mediated by lower-level dynamics; semantics is a high-level description of complex behavior.
  *   **1B-2A-3B-4B (Special/Semantic/Mediated/Violates):** **Unnamed (Unexplored).** A system designed for semantics where the semantics don't push, yet physics is still violated by the mediation.
  *   **1B-2B-3A-4A (Special/Syntactic/Direct/Reconciled):** **Pure Simmball Direct-Causation.** The structural form (simmball) has mechanical leverage due to substrate resonance, independent of semantic reference.
  *   **1B-2B-3A-4B (Special/Syntactic/Direct/Violates):** **Magical Structuralism.** The shape of the token magically alters physical laws to produce movement.
  *   **1B-2B-3B-4A (Special/Semantic/Mediated/Reconciled):** **Substrate Determinism (Careenium variant).** Even with a special substrate, the symbol is merely a description of the inevitable substrate dynamics.
  *   **1B-2B-3B-4B (Special/Semantic/Mediated/Violates):** **Unnamed (Incoherent).** Contradicts the definition of a physical substrate (even a special one) if the mediation chain violates closure.

  ---

  ## Indistinguishability Flags

  This taxonomy fails to distinguish the following pairs under empirical observation:

  1.  **Careenium Interactionism (1B-2A-3A-4A) vs. Weak Emergentism (1B-2A-3B-4A):**
      *   *Reason:* Both posit a special substrate and reconciled physics. The distinction lies in whether the symbol *itself* is the lever (Direct) or a description of the lever (Mediated). If the "Direct" leverage is perfectly supervenient on the "Mediated" dynamics, no experiment can distinguish whether the symbol *pushed* or merely *tracked* the push.
  2.  **Physicalist Syntax Identity (1A-2B-3A-4A) vs. Substrate Determinism (1A-2B-3B-4A):**
      *   *Reason:* If syntax is identical to voltage (Identity), claiming it is "Direct" is semantically equivalent to claiming the voltage is "Mediated" by itself. The distinction collapses into terminological preference regarding the word "symbol."
  3.  **Standard Computational Representationalism (1A-2A-3B-4A) vs. Substrate Determinism (1A-2B-3B-4A):**
      *   *Reason:* Both deny direct symbolic causation in generic substrates. The split between "Semantic" and "Syntactic" becomes irrelevant to the causal story if the path is Mediated; in both cases, the symbol is causally inert.

  ---

  ## Committed Stance: Careenium Interactionism

  **Selected Branch:** 1B-2A-3A-4A (Special Substrate / Semantic / Direct / Reconciled).

  **Defense:**
  Standard Computational Representationalism (1A-2A-3B-4A) renders the root case illusory: it forces us to admit the arm moved *only* because of voltage, making the "if X then move arm" structure a causally inert shadow. This creates an explanatory gap for cognitive efficacy; if symbols don't push, why did evolution build systems so sensitive to symbolic structure? Conversely, Substance Dualism (1A-2A-3A-4B) abandons physical closure.

  **Careenium Interactionism** resolves this by rejecting the "Generic Substrate" assumption. Biological cognition does not occur on generic silicon; it occurs on wet, noisy, resonant media where the boundary between "symbol" and "signal" is blurred. In a Careenium, the symbolic structure is not an abstract layer sitting on top of physics; it is a *stable dynamical attractor* within the physics. When the token "if X then move arm" exists, it is not a static voltage pattern but a specific trajectory in phase space that *constrains* lower-level noise. The semantic content (the "aboutness" of X) is locked to this trajectory. Therefore, the symbol *does* cause the movement directly, not by adding energy (violating closure), but by channeling existing substrate energy through the specific topological constraints that constitute the meaning. The simmball pushes because the substrate is shaped to let it push.

  **Decisive Falsification:**
  This position would be decisively refuted by a **Substrate Independence Proof**. If it can be formally demonstrated or empirically verified that a system with *identical* symbolic topology but *radically different* substrate physics (e.g., transferring a human connectome to a non-resonant digital lookup table) preserves causal efficacy *without* loss of functional integrity, then the "Special Substrate" requirement (Split 1B) is false. If generic silicon can sustain the same downward causal power as the biological careenium, then symbolic causation is substrate-independent, forcing a retreat to Standard Computational Representationalism (where symbols are causally inert descriptions) or Dualism. Specifically, if a simulation of the careenium runs on a generic von Neumann architecture and exhibits the *same* semantic leverage without the resonant dynamics, Careenium Interactionism is false.
