answer: |-
  **Project Title:** Operational Vagueness: Epistemic and Normative Uncertainty in Automated Risk Scoring

  **Abstract**
  This project investigates the philosophical structure of decision boundaries in automated financial risk systems. Specifically, it examines whether the "banding" strategy used to mitigate arbitrary cutoff thresholds in risk-scoring pipelines is structurally isomorphic to supervaluationist semantics, or whether it represents a distinct category of normative indeterminacy arising from engineering constraints rather than linguistic vagueness.

  **The Problem: The 0.73 Boundary**
  In high-frequency payment processing, transactions are assigned a risk score between 0 and 1. A configuration file dictates a hard cutoff: scores above 0.73 are declined; below are released. This boundary is sharp, visible, and fixed. However, the justification for 0.73 is lost to staff turnover, and the data distribution has drifted significantly since the value was set. While the location of the boundary is epistemically transparent (any engineer can read the file), its normative authority is opaque. We know *where* the line is, but not *why* it is there, nor whether it should be 0.75 instead.

  To manage this, my team employs a stability band. We evaluate decisions across a range of admissible cutoffs (e.g., 0.70 to 0.76). Verdicts stable across the band are automated; verdicts that flip within the band are escalated to human analysts. This workaround functions effectively, but its theoretical status is unclear. It resembles the supervaluationist treatment of vagueness, where a claim is "super-true" if it holds across all admissible precisifications. However, standard vagueness concerns predicates like "bald" or "heap," where the boundary is hidden by language. Here, the boundary is explicit, but the *reason* for its placement is missing.

  **Philosophical Context and Gap**
  The standard debate in the metaphysics of vagueness oscillates between Epistemicism and Supervaluationism. Epistemicism, associated with Timothy Williamson, argues that sharp boundaries exist but are unknowable due to the limits of knowledge. Supervaluationism, associated with Kit Fine, argues that borderline cases lack a truth value because the predicate is semantically incomplete.

  My system fits neither model cleanly. Contrary to Epistemicism, the boundary is not hidden; it is written in plaintext. The ignorance is not about the boundary's location, but about its justification. Contrary to Supervaluationism, the indeterminacy is not semantic. The predicate "risky" is operationally defined by the code. The indeterminacy is normative and temporal: the traffic distribution drifts quarterly, meaning the same fixed number picks out a different population over time. This suggests a Sorites series generated by the world rather than by our descriptions of it.

  This project posits that industrial risk scoring presents a third category: *Operational Vagueness*. This is distinct from semantic vagueness because the sharpness is an engineering feature, not a linguistic bug, yet the instability of the boundary requires a logic of borderline cases to function safely.

  **Research Question**
  Does the structural isomorphism between supervaluationist semantics and stability-based risk escalation justify treating engineering uncertainty as a form of vagueness, or does it reveal a distinct category of normative indeterminacy where the "borderline" is a policy choice rather than a truth condition?

  **Methodology**
  Given proprietary constraints, I cannot publish raw transaction data. The research will proceed via conceptual analysis and simulated modeling.
  1.  **System Abstraction:** I will construct a non-proprietary mathematical model of the risk pipeline that preserves the logical structure of the scoring and banding mechanism without exposing sensitive data.
  2.  **Collaborative Analysis:** Working with my academic partner, I will map the "banding" logic against formal supervaluationist frameworks. We will test whether the "escalation" of unstable cases functions logically as a "truth-value gap" or as a distinct normative category (e.g., "deferred judgment").
  3.  **Temporal Modeling:** I will simulate data drift to analyze how the "borderline" region expands or contracts over time. This tests whether the Sorites progression is driven by semantic shift or population drift.

  **Success and Failure Criteria**
  **Success:** The project produces a framework distinguishing *semantic vagueness* from *operational indeterminacy*. A successful outcome would demonstrate that the "banding" technique is not merely a pragmatic hack but instantiates a coherent logic of normative uncertainty, potentially offering a new model for philosophers studying practical reasoning.
  **Failure:** The project fails if the analogy proves to be merely metaphorical. If the "band" is shown to be a standard decision-theoretic robustness check with no unique philosophical implications, the project will conclude that applying vagueness literature to this domain is a category error. This negative result is still valuable, as it prevents the misapplication of semantic theories to engineering problems.

  **Conceptual Risks and Feasibility**
  There are significant risks to this proposal, primarily stemming from my lack of formal philosophy training. I must flag two likely points of failure regarding the philosophical framework.

  First, I may be conflating *epistemic uncertainty* with *semantic vagueness*. Supervaluationism addresses truth conditions of language. My system addresses policy decisions under uncertainty. It is highly probable that the "borderline" cases in my pipeline are not semantically indeterminate but simply costly to resolve automatically. If the philosopher determines that this is purely a problem of decision theory rather than metaphysics, the core hypothesis will collapse. I have included this as a primary falsification condition in the methodology.

  Second, the analogy to precisifications may break on the issue of *admissibility*. In Supervaluationism, precisifications must be meaning-preserving. In my system, the "band" is chosen arbitrarily based on cost-benefit analysis, not semantic constraints. If the range of cutoffs is not constrained by the meaning of "risky" but by profit margins, the structural resemblance to Supervaluationism may be superficial.

  Regarding feasibility: This scope is aggressive for a single year, particularly for an engineer without a philosophy degree. The risk is not technical execution but conceptual drift—spending too much time learning the literature rather than analyzing the system. To mitigate this, the project is bounded by the specific mechanism of the "stability band." I will not attempt to solve the Sorites Paradox generally, but only to categorize this specific engineering instantiation of it. If the philosophical learning curve proves too steep, the scope will narrow to a case study in philosophy of technology, documenting the mismatch between existing theories and industrial reality, rather than attempting to propose a new metaphysical category.

  **Conclusion**
  Automated decision systems are increasingly treated as black boxes, but often the opacity is not in the code, but in the justification of the parameters. By treating a config file as a philosophical text, this project aims to clarify whether the logic we use to manage engineering risk aligns with the logic we use to manage linguistic uncertainty. Whether the result is a new synthesis or a confirmed category error, the analysis will provide a rigorous account of how sharp boundaries function in a drifting world.
