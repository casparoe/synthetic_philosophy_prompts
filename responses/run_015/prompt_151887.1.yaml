answer: |-
  **Exam Question: The Paradox of Ficiton and Shadow Endorsement**
  **Time:** 45 Minutes
  **Course:** Phil 340 (Aesthetics)

  **Prompt:**
  The traditional paradox of fiction assumes that rational emotion requires belief in the existence of its object. However, some contemporary theorists suggest we do not need full ontological belief to be moved; rather, a weaker state like "shadow endorsement" suffices. In this state, you do not literally believe Hamlet died, but you still treat the scenario as live for affective processing.

  Write an essay evaluating whether Walton's quasi-emotion/make-believe view or Currie's simulation account better accommodates the concept of shadow endorsement. Your answer must:
  1.  Explain how shadow endorsement differs from standard belief.
  2.  Reconstruct Walton's position on emotional response to ficiton.
  3.  Reconstruct Currie's position on emotional response to fiction.
  4.  Argue which theory handles shadow endorsement better without collapsing the two views into one another.
  5.  Defend your conclusion against a potential objection.

  ***

  ### Model Answer

  The paradox of fiction hinges on the tension between feeling genuine emotion for characters we know do not exist. Traditional solutions often pivot on whether full ontological belief is required for affective response. The concept of "shadow endorsement" suggests a middle ground: we do not literally believe Hamlet died, yet we process the scenario as live for emotional engagement. This essay argues that Peter Currie's simulation account handles shadow endorsement more effectively than Kendall Walton's quasi-emotion view, as it explains the involuntary nature of the affect without reducing it to a game of make-believe.

  Walton dissolves the paradox by denying the genuineness of the emotion. For Walton, fearing the slime in a horror movie is a quasi-emotion generated within a game of make-believe. We imagine ourselves afraid, and physiological symptoms manifest, but there is no actual fear because the belief condition is missing. Shadow endorsement, however, implies a cognitive state that is not quite belief but not quite pretense either. Walton's framework struggles here because it requires a voluntary participation in a game. Shadow endorsement often feels passive; we find ourselves moved without explicitly deciding to play along. If shadow endorsement is a weaker state than belief but still drives affect, Walton's strict binary between real emotion (belief-based) and quasi-emotion (imagination-based) forces an awkward categorization of shadow endorsement as merely part of the game. This fails to capture the intensity of the response, which feels real to the subject despite the lack of belief.

  Currie, conversely, utilizes a simulation theory of mind. We understand others by running their mental states offline. In engaging with fiction, we simulate the protagonist's situation without believing it is actual. This aligns neatly with shadow endorsement. The "offline" processing mode is precisely a state where the scenario is treated as live for affective processing without ontological commitment. Currie allows for genuine emotional mechanisms to fire because the simulation uses the same cognitive architecture as real-world reasoning, merely disconnected from action. Shadow endorsement is the cognitive switch that sets the system to offline. Unlike Walton, Currie does not require us to pretend we are afraid; rather, we simulate the situation that would cause fear, and the emotion arises naturally from the machinery of the mind.

  Crucially, Currie's view does not collapse into Walton's. Walton insists the emotion itself is fictional (quasi-fear). Currie insists the emotion is real but caused by an offline simulation. Shadow endorsement supports Currie because the phenomenology of grief for Anna Karenina feels identical to real grief, not like a pretense of grief. Walton must say we are only pretending to be sad. Currie allows we are actually sad, triggered by a shadow-endorsed scenario. This preserves the intuition that fiction moves us deeply without requiring us to believe fiction is real. If we adopted Walton's view, shadow endorsement would just be a fancy name for making believe, losing the nuance of the involuntary affective processing.

  Therefore, while Walton successfully removes the belief requirement, he sacrifices the genuineness of the emotion. Currie retains the genuine emotion by reconfiguring the belief requirement into an offline simulation mode. Shadow endorsement describes this mode perfectly: the content is endorsed for processing but not for action. Currie's account is superior because it respects the involuntary power of fiction better than Walton's voluntarist make-believe framework. A critic might argue simulation still requires too much cognitive effort, but shadow endorsement suggests this processing is automatic, fitting Currie's cognitive science approach better than Walton's normative game structure.

  ***

  ### Marking Scheme (20 Points Total)

  **1. Definition of Shadow Endorsement (4 points)**
  *   **Must Hit:** Clearly distinguishes shadow endorsement from full belief (no ontological commitment) and from mere pretense (affective processing is still "live").
  *   **Common Botch:** Students confuse this with "suspension of disbelief" or treat it as just lying to oneself.

  **2. Reconstruction of Walton (4 points)**
  *   **Must Hit:** Accurately explains quasi-emotions and the necessity of a voluntary game of make-believe to generate the response.
  *   **Common Botch:** Students claim Walton says the emotions are "fake" without explaining the physiological/game mechanism.

  **3. Reconstruction of Currie (4 points)**
  *   **Must Hit:** Accurately explains simulation theory, offline processing, and the use of real cognitive architecture for fictional inputs.
  *   **Common Botch:** Students reduce simulation to simple empathy or imagining being someone else without the "offline" mechanistic detail.

  **4. Comparative Analysis (Non-Collapsing) (4 points)**
  *   **Must Hit:** Explicitly argues why the views are distinct (Real Emotion vs. Quasi-Emotion) and why one fits the prompt's concept better.
  *   **Common Botch:** Students argue they are basically the same view just using different terminology.

  **5. Defended Conclusion (4 points)**
  *   **Must Hit:** Takes a clear stance on which theory handles shadow endorsement better and addresses at least one counter-argument or limitation.
  *   **Common Botch:** Students sit on the fence ("both have merits") without defending a specific winner regarding shadow endorsement.
