          *   **Transparency vs. Opacity:** Does CKR actually require transparency of *reasoning* or just transparency of *dispositions*?

  4.  **Sorting by Decisiveness:**
      *   *Most Decisive:* Formal epistemic challenges (Stalnaker/Bicchieri). If the logic itself is flawed under CKR, the user's structural claim fails.
