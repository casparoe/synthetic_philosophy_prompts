  # DECISION TREE: DISPOSITIONS AND INTERFERENCE

  **Instructions:** Answer the following three questions based on your intuition about the cases described. Do not worry about technical terms; focus on whether you believe the property (like "fragility" or "conductivity") exists in the object described. Follow the path of your answers to find your philosophical position.

  ---

  ### QUESTION 1: The Permanent Shield (Mask Case)
  **Case:** Imagine a glass vase that is *fragile*. However, it is permanently encased in an unremovable molecular forcefield. If you strike the vase, the forcefield absorbs the blow, and the vase *does not break*. The shield is inseparable from the vase.

  **Question:** Given that the vase *will not break* when struck, is it still correct to say the vase possesses the disposition of **fragility**?

  *   **NO** (The failure to break proves it is not fragile.) $\rightarrow$ **Go to Question 2A**
  *   **YES** (The fragility is real, but hidden/blocked.) $\rightarrow$ **Go to Question 2B**

  ---

  ### QUESTION 2A: The Instant Vanish (Fink Case)
  *(Reached if you answered NO to Question 1)*

  **Case:** Imagine an electrical wire that is *conductive*. However, it is connected to a sensor that instantly strips the wire of its conductivity the exact moment a tester touches it. Before being touched, the wire *would not conduct* if tested (because the test triggers the loss).

  **Question:** Before the tester touches it, does the wire possess the disposition of **conductivity**?

  *   **NO** (If it wouldn't work when tested, it doesn't have the property.) $\rightarrow$ **Go to Question 3A**
  *   **YES** (It has the property normally, but the test destroys it.) $\rightarrow$ **Go to Question 3B**

  ---

  ### QUESTION 2B: The Instant Vanish (Fink Case)
  *(Reached if you answered YES to Question 1)*

  **Case:** (Same as above) A wire loses conductivity the instant it is touched. However, you already believe properties can exist even if permanently blocked (from Question 1).

  **Question:** Does the wire possess the disposition of **conductivity** *before* the tester touches it?

  *   **NO** (Permanent blocking is okay, but instant vanishing removes the property.) $\rightarrow$ **Go to Question 3C**
  *   **YES** (The property survives both permanent shields and instant vanishing.) $\rightarrow$ **Go to Question 3D**

  ---

  ### QUESTION 3A: The Pathway (Structure Case)
  *(Reached if you answered NO to Q1 and NO to Q2A)*

  **Case:** Consider a soluble salt. In water, it dissolves by ionizing. In acid, it dissolves by reacting chemically. These are physically different processes.

  **Question:** Is "solubility" a **single, simple property** that is the same in both cases, or are these **fundamentally different capacities** that just share a name?

  *   **SINGLE PROPERTY** $\rightarrow$ **LEAF 1**
  *   **DIFFERENT CAPACITIES** $\rightarrow$ **LEAF 2**

  ---

  ### QUESTION 3B: The Pathway (Structure Case)
  *(Reached if you answered NO to Q1 and YES to Q2A)*

  **Case:** (Same as above) Solubility involves different physical processes in different liquids.

  **Question:** Is "solubility" a **single, simple property**, or are these **fundamentally different capacities**?

  *   **SINGLE PROPERTY** $\rightarrow$ **LEAF 3**
  *   **DIFFERENT CAPACITIES** $\rightarrow$ **LEAF 4**

  ---

  ### QUESTION 3C: The Pathway (Structure Case)
  *(Reached if you answered YES to Q1 and NO to Q2B)*

  **Case:** (Same as above) Solubility involves different physical processes in different liquids.

  **Question:** Is "solubility" a **single, simple property**, or are these **fundamentally different capacities**?

  *   **SINGLE PROPERTY** $\rightarrow$ **LEAF 5**
  *   **DIFFERENT CAPACITIES** $\rightarrow$ **LEAF 6**

  ---

  ### QUESTION 3D: The Pathway (Structure Case)
  *(Reached if you answered YES to Q1 and YES to Q2B)*

  **Case:** (Same as above) Solubility involves different physical processes in different liquids.

  **Question:** Is "solubility" a **single, simple property**, or are these **fundamentally different capacities**?

  *   **SINGLE PROPERTY** $\rightarrow$ **LEAF 7**
  *   **DIFFERENT CAPACITIES** $\rightarrow$ **LEAF 8**

  ---

  ## TERMINAL POSITIONS (LEAVES)

  ### LEAF 1: The Simple Conditional Analysis
  **(Path: No Mask / No Fink / Single Property)**
  *   **View:** Dispositions are nothing more than "If-Then" statements. If the object does not manifest the behavior when tested (due to masks or finks), it does not have the disposition. The property is a simple link between stimulus and outcome.
  *   **Diagnosis:** This is the classic starting point. It is clean but struggles to explain why we intuitively feel the vase is still fragile even if shielded.

  ### LEAF 2: The Fink-Sensitive View
  **(Path: No Mask / No Fink / Different Capacities)**
  *   **View:** You deny the disposition exists when interference is present (like Leaf 1), but you acknowledge that the underlying reality is complex. You believe the "capacity" is a cluster of different pathways, but if *any* are blocked by a fink or mask, the label no longer applies.
  *   **Diagnosis:** This view admits the world is complex but maintains a strict rule: if the test fails, the property is absent.

  ### LEAF 3: Diagnosis (Incoherent Combination)
  **(Path: No Mask / Yes Fink / Single Property)**
  *   **View:** You believe permanent shields destroy the disposition (No Mask), but instant vanishing acts do not (Yes Fink), and the property is simple.
  *   **Diagnosis:** **Conceptually Unstable.** It is difficult to justify why a permanent blocker removes the property while a temporary, instant blocker does not, if the property is simple. Usually, if permanent blocking kills the property, instant blocking should too.

  ### LEAF 4: Diagnosis (Unexplored Tension)
  **(Path: No Mask / Yes Fink / Different Capacities)**
  *   **View:** You deny the disposition in permanent mask cases, accept it in fink cases, and believe the property is multi-path.
  *   **Diagnosis:** **Unappealing.** You accept complexity in the property but still deny its existence in permanent blockage cases. This creates tension: why does complexity save it in the Fink case but not the Mask case?

  ### LEAF 5: The Mask-Tolerant View (Categorical)
  **(Path: Yes Mask / No Fink / Single Property)**
  *   **View:** Dispositions are real properties that exist even if permanently blocked (Masks). However, if a mechanism actively removes the property upon testing (Finks), the property is gone. The property is a single, binary switch.
  *   **Diagnosis:** This preserves the reality of hidden powers but draws a hard line at "active interference."

  ### LEAF 6: Diagnosis (Rare Variant)
  **(Path: Yes Mask / No Fink / Different Capacities)**
  *   **View:** You accept masks, deny finks, and believe in multi-path structures.
  *   **Diagnosis:** **Rare.** This is a nuanced version of Leaf 5. It suggests the property is complex, yet still vulnerable to instant finks. It is hard to separate cleanly from Leaf 8 in practice.

  ### LEAF 7: Diagnosis (Robust Realism)
  **(Path: Yes Mask / Yes Fink / Single Property)**
  *   **View:** Dispositions survive all interference (Masks and Finks), but they are simple, single properties.
  *   **Diagnosis:** **Strong Realism.** You believe the property is a robust "thing" that cannot be taken away by tricks, but you deny that it changes its internal structure based on context.

  ### LEAF 8: The Layered / Multi-Path Account
  **(Path: Yes Mask / Yes Fink / Different Capacities)**
  *   **View:** Dispositions are real, survive all interference, and are structurally complex. The same disposition can manifest in different ways depending on the environment.
  *   **Diagnosis:** This is the most flexible view. It treats dispositions as deep, structural features of objects that persist regardless of external tricks or blockers.

  ---

  ## NOTE ON SEPARATION

  **Flagged Pair:** **Leaf 5 (Mask-Tolerant Categorical)** and **Leaf 8 (Layered/Multi-Path)**.
  *   **Reason:** The branching logic separates these based on Question 3 (Structure). However, in practice, a philosopher who accepts that dispositions survive Finks (Leaf 8 path) often finds it natural to also accept they are multi-path. Distinguishing a "Robust Single-Path" view (Leaf 7/5 hybrid) from a "Robust Multi-Path" view (Leaf 8) relies on subtle judgments about physical processes that may not be cleanly separable by intuition alone.

  **Flagged Pair:** **Leaf 1 (Simple Conditional)** and **Leaf 2 (Fink-Sensitive)**.
  *   **Reason:** Both deny the disposition in interference cases. The separation relies entirely on whether the respondent views the underlying capacity as "Simple" or "Different Capacities." This is a theoretical distinction that may not change the practical outcome of the case judgment.
