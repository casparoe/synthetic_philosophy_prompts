      *(Refining the fMRI point)*: The tension arises if we think fMRI "sees the pain." Realists might think that. Illusionists know fMRI sees the *substrate of the illusion*. I need to make that distinction clear.

      *(Refining the Functional Redesign)*: If we drop first-person input, we drop the idea that *suffering itself* is a harm independent of function. This is a major ethical shift (Hedonism/Experientialism vs. Capability Approach).

