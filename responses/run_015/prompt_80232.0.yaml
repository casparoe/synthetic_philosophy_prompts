  6.  **Final Polish:** Ensure the distinction between "Desiderata for the *Account*" vs. "Observations about the *World*" is clear. The prompt asks for desiderata for an *account*, so they should be phrased as "The account must explain X."

      *   *Correction on Tension:* The prompt asks to flag pairs *within the desiderata* that seem jointly unsatisfiable.
      *   *Pair:* "Digital original is arbitrary" (implies no metaphysical difference) vs "Authenticity can matter more than quality" (implies metaphysical difference creates value). If the original is arbitrary, why does authenticity matter? This is a strong tension.

