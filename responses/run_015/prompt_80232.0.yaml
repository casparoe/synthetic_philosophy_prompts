prompt: |-
  I'm writing a paper on fakes and originals, and before I compare theories I want the standard of evaluation fixed. Write the desiderata for an adequate account of why originals matter: the cases it must handle (a perfect physical copy, an original whose maker is unknown, a forgery that later becomes famous in its own right, a digital object where the designation of an original file is arbitrary, a historical document and an exact facsimile), the distinctions it must keep separate (being made by a particular person, being the first instance, having an unbroken causal history, being certified by institutions, being beautiful or evidentially useful), and the constraints it cannot ignore (some copies are valued, some originals are worthless, markets can reward fakes, and authenticity can matter more than quality). Give the reason or motivating case behind each requirement, mark which are non-negotiable and which are contestable, and flag any pair that seems jointly unsatisfiable. Then briefly score causal-historical, institutional, and functional-pragmatic accounts against the list. Finally, say how confident you are in the list itself and identify the single requirement you are least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Fakes and Originals (Philosophy of Art/Artifact/Metaphysics).
      *   **Task:** Create a set of *desiderata* (criteria/requirements) for an adequate account of why originals matter.
      *   **Components:**
          1.  **Cases to Handle:** Perfect physical copy, unknown maker original, famous forgery, digital object (arbitrary original), historical document vs. facsimile.
          2.  **Distinctions to Keep Separate:** Authorship, first instance, causal history, institutional certification, aesthetic/evidential utility.
          3.  **Constraints to Acknowledge:** Valued copies, worthless originals, market rewards for fakes, authenticity > quality.
          4.  **Annotations:** Reason/motivating case for each, Non-negotiable vs. Contestable, Jointly Unsatisfiable pairs.
          5.  **Evaluation:** Score Causal-Historical, Institutional, and Functional-Pragmatic accounts against the list.
          6.  **Meta-Commentary:** Confidence level in the list, least sure requirement.

  2.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Cases to Handle*
          *   Case A: Perfect Physical Copy (e.g., Goodman's forgery). *Why?* Tests if physical indistinguishability negates originality.
          *   Case B: Unknown Maker Original (e.g., ancient tool). *Why?* Tests if authorship is necessary for originality.
          *   Case C: Famous Forgery (e.g., Han van Meegeren). *Why?* Tests if value can shift from authenticity to historical status.
          *   Case D: Digital Object. *Why?* Tests the concept of "first instance" in reproducible media.
          *   Case E: Document vs. Facsimile. *Why?* Tests evidential vs. aesthetic value.

      *   *Category 2: Distinctions to Keep Separate*
          *   Distinction 1: Authorship vs. First Instance. *Why?* One can be first without being the author (copyist), or author without being first (revision).
          *   Distinction 2: Causal History vs. Institutional Certification. *Why?* A thing can be real but uncertified, or certified but fake.
          *   Distinction 3: Aesthetic/Utility vs. Authenticity. *Why?* A fake can be beautiful; an original can be ugly.

      *   *Category 3: Constraints*
          *   Constraint 1: Some copies are valued (e.g., authorized prints).
          *   Constraint 2: Some originals are worthless (e.g., trash).
          *   Constraint 3: Markets reward fakes (sometimes knowingly).
          *   Constraint 4: Authenticity > Quality (Goodman's point).

      *   *Refining and Formatting:* I need to make sure these are phrased as *desiderata* (requirements for the theory), not just observations. I need to add the "Non-negotiable/Contestable" tags and the "Reason/Case". I also need to look for tensions.

      *   *Identifying Tensions (Jointly Unsatisfiable):*
          *   Tension 1: "Authenticity matters more than quality" vs. "Markets can reward fakes." If the market rewards fakes, does authenticity *really* matter more? Or is it context-dependent?
          *   Tension 2: "Digital original is arbitrary" vs. "Causal history is required." In digital, causal history is identical for all copies. If the theory demands a unique causal chain, digital originals break it.
          *   *Decision:* The most famous tension in this field is between *perceptual indistinguishability* and *ontological difference*. If a theory says physical properties determine value (Functional), it fails the Perfect Copy case. If it says history determines value (Causal), it struggles with the Digital case where history branches identically. Let's flag the tension between "Digital Arbitrariness" and "Unique Causal History."

  3.  **Drafting the Evaluation of Theories:**
      *   *Causal-Historical (e.g., Goodman, Danto):* Strong on physical copies, weak on digital.
      *   *Institutional (e.g., Dickie):* Strong on certification, weak on unknown makers.
      *   *Functional-Pragmatic (e.g., Utility/Evidence):* Strong on documents, weak on art where authenticity > quality.

  4.  **Drafting the Meta-Commentary:**
      *   Confidence: High, but philosophy is tricky.
