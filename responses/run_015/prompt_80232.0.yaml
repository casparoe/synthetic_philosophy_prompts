answer: |-
  Here is a structured set of desiderata for an adequate theory of originals and fakes, designed to serve as a fixed standard of evaluation for your paper.

  ### I. Desiderata for an Adequate Account

  #### A. Cases the Account Must Handle
  *The theory must provide a coherent explanation for the ontological and normative status of the following:*

  1.  **The Perfect Physical Copy:** The account must explain why a perceptually indistinguishable forgery lacks the status of the original (Goodman's problem).
      *   *Reason/Case:* Two paintings look identical, but one is worth millions and the other is a crime.
      *   *Status:* **Non-negotiable.**
  2.  **The Anonymous Original:** The account must explain the status of an artifact whose maker is unknown or lost to history (e.g., The Sutton Hoo helmet).
      *   *Reason/Case:* We value the object as an original despite the absence of a specific authorial intent.
      *   *Status:* **Non-negotiable.**
  3.  **The Canonized Forgery:** The account must explain how a known fake can acquire value in its own right over time (e.g., Van Meegeren's Vermeers).
      *   *Reason/Case:* The object is a fake relative to the 17th century but an original relative to the 20th century art market.
      *   *Status:* **Contestable** (Some argue it remains a fake, merely a *valuable* one).
  4.  **The Digital Arbitrary Original:** The account must handle cases where the "original" file is technically arbitrary among identical bit-strings (e.g., a digital photo or NFT).
      *   *Reason/Case:* Copying is lossless; designation of "original" is often merely conventional or ledger-based.
      *   *Status:* **Non-negotiable.**
  5.  **The Document vs. Facsimile:** The account must distinguish between a historical record and a reproduction (e.g., The Magna Carta vs. a library print).
      *   *Reason/Case:* The facsimile conveys the information, but only the document bears the evidential weight of history.
      *   *Status:* **Non-negotiable.**

  #### B. Distinctions the Account Must Keep Separate
  *The theory must not conflate the following concepts, even if they often overlap:*

  6.  **Authorship vs. First Instance:** The account must distinguish being made by a specific person from being the first token of a type.
      *   *Reason/Case:* A cast of a sculpture is made by the artist (authorship) but is not the first instance; a found object is the first instance but has no author.
      *   *Status:* **Non-negotiable.**
  7.  **Causal History vs. Institutional Certification:** The account must separate the object's actual lineage from its paperwork.
      *   *Reason/Case:* An object can have a perfect provenance (certification) but be a fake (bad history), or be real but lack paperwork.
      *   *Status:* **Non-negotiable.**
  8.  **Aesthetic/Evidential Utility vs. Authenticity:** The account must allow that an object can be useful/beautiful without being authentic, and vice versa.
      *   *Reason/Case:* A fake pill cures a headache (utility); a real but damaged artifact may be ugly (aesthetics) but still authentic.
      *   *Status:* **Non-negotiable.**

  #### C. Constraints the Account Cannot Ignore
  *The theory must accommodate these empirical realities of value:*

  9.  **Valued Copies:** The account must explain why some copies (e.g., authorized prints, casts) hold significant value.
      *   *Reason/Case:* Not all non-originals are worthless; reproduction is sometimes part of the work's ontology.
      *   *Status:* **Non-negotiable.**
  10. **Worthless Originals:** The account must acknowledge that being an original does not guarantee value.
      *   *Reason/Case:* My original grocery list is an original but has no market or historical value.
      *   *Status:* **Non-negotiable.**
  11. **Market Rewards for Fakes:** The account must accommodate that fakes are sometimes knowingly bought and sold for high prices.
      *   *Reason/Case:* The market sometimes values the *story* of the fake more than the truth.
      *   *Status:* **Contestable** (Is this a failure of the market or a shift in what is being valued?).
  12. **Authenticity > Quality:** The account must explain why a degraded original is often preferred to a perfect fake.
      *   *Reason/Case:* Goodman's constraint: We prefer a damaged Rembrandt to a perfect forgery.
      *   *Status:* **Non-negotiable.**

  ---

  ### II. Jointly Unsatisfiable Pairs (Tensions)

  There is a significant tension within these desiderata that any theory will struggle to resolve completely.

  *   **The Tension:** **Desideratum 4 (Digital Arbitrary Original)** vs. **Desideratum 12 (Authenticity > Quality).**
  *   **Why:** If the designation of a digital original is arbitrary (Desid. 4), then there is no metaphysical difference between the "original" and the "copy." If there is no metaphysical difference, it is difficult to justify why the "original" commands higher status or value than the copy (Desid. 12) without resorting purely to artificial scarcity (which undermines the "Authenticity" claim). A theory that solves the Digital case often weakens the Authenticity case, and vice versa.

  ---

  ### III. Theoretical Scoring

  Here is how three standard accounts score against the 12 desiderata.
  *(Scale: ✅ = Handles well, ⚠️ = Strained/Partial, ❌ = Fails)*

  | Desideratum | Causal-Historical (e.g., Goodman/Danto) | Institutional (e.g., Dickie) | Functional-Pragmatic (e.g., Evidence/Utility) |
  | :--- | :---: | :---: | :---: |
  | **1. Perfect Copy** | ✅ (History differs) | ⚠️ (Depends on status conferral) | ❌ (Function is identical) |
  | **2. Anonymous Original** | ✅ (History exists sans name) | ⚠️ (Who conferred status?) | ✅ (Evidential value remains) |
  | **3. Canonized Forgery** | ❌ (History is still fake) | ✅ (Status can change) | ⚠️ (Function changes slowly) |
  | **4. Digital Original** | ❌ (Identical causal chains) | ✅ (Ledger/Certificate defines it) | ❌ (Function is identical) |
  | **5. Doc vs. Facsimile** | ✅ (Causal link to event) | ⚠️ (Both can be certified) | ✅ (Only one is evidence) |
  | **6. Authorship vs. First** | ✅ (Distinct causal nodes) | ⚠️ (Often conflated in status) | ⚠️ (Depends on use) |
  | **7. History vs. Cert** | ✅ (Prioritizes History) | ✅ (Prioritizes Cert) | ⚠️ (Prioritizes Utility) |
  | **8. Utility vs. Authenticity**| ✅ (Separates them) | ✅ (Separates them) | ❌ (Conflates them) |
  | **9. Valued Copies** | ⚠️ (Hard to explain value) | ✅ (Status conferral explains it) | ✅ (Function explains it) |
  | **10. Worthless Originals** | ✅ (History ≠ Value) | ⚠️ (Implies some status) | ✅ (No utility = no value) |
  | **11. Market for Fakes** | ❌ (Irrational market) | ✅ (Institution validates fake) | ⚠️ (Market function is opaque) |
  | **12. Authenticity > Quality**| ✅ (Core tenet) | ⚠️ (Status can override quality) | ❌ (Quality usually wins) |
  | **Total Score** | **8 ✅ / 2 ⚠️ / 2 ❌** | **5 ✅ / 6 ⚠️ / 1 ❌** | **4 ✅ / 4 ⚠️ / 4 ❌** |

  **Summary of Scores:**
  *   **Causal-Historical:** Best for traditional art and documents, fails on digital and shifting value (famous fakes).
  *   **Institutional:** Most flexible regarding market shifts and digital ledgers, but struggles to explain why we value history over certification in anonymous cases.
  *   **Functional-Pragmatic:** Best for documents and worthless originals, but collapses the distinction between a perfect fake and an original in aesthetic contexts.

  ---

  ### IV. Meta-Commentary on the List

  **Confidence Level:**
  I am **85% confident** in this list as a robust framework for analytic aesthetics and metaphysics of artifacts. It covers the "greatest hits" of the literature (Goodman, Danto, Dickie, Benjamin) while integrating contemporary digital problems.

  **Least Sure Requirement:**
  I am least sure about **Desideratum 11 (Market Rewards for Fakes)**.
  *   *Reason:* It is unclear whether an ontological theory *should* accommodate irrational market behavior. If a theory explains why originals *should* matter, it might be a feature, not a bug, that it cannot explain why markets *wrongly* value fakes. Including this risks forcing the theory to justify market irrationality rather than ontological truth. However, excluding it risks making the theory irrelevant to the actual sociology of art.
