answer: |-
  Based on the pattern of verdicts you've described, your friend is operating within a specific, rigorous framework of **Collective Intentionality**, likely drawing from the work of philosophers like **Raimo Tuomela, Margaret Gilbert, or Michael Bratman**. She is distinguishing between *merely coordinated behavior* and *genuine joint action*.

  Here is the breakdown of her rule, the verdict on the LLM case, the competing hypotheses, and the test case to settle it.

  ### 1. The Verdict
  **She will almost certainly say NO.** She will classify the Philosopher + LLM interaction as **instrumental individual action**, not joint action.

  She will argue that the philosopher is acting individually *using* a complex tool. The LLM is functionally equivalent to a very advanced calculator or a piano that plays itself; it is part of the *environment* the philosopher is acting upon, not a co-agent.

  ### 2. The Rule She Is Running
  **The Rule of Reciprocal We-Intentionality.**
  For an activity to count as joint action, there must be:
  1.  **Mutual Responsiveness:** (Satisfied by the LLM).
  2.  **A Shared Goal:** (Satisfied functionally, but not mentally).
  3.  **Reciprocal Commitment:** Each participant must intend that *we* do the action, and each must know the other intends that *we* do the action.

  **Why her past verdicts support this:**
  *   **Piano:** They adjust (responsiveness) and both intend "we lift this" (shared commitment), even without speech.
  *   **Orchestra:** They intend "we play this symphony" (plural subject), not just "I play my part."
  *   **Fleeing Building:** They adjust (dodging) and have a similar goal (survival), but they lack the *shared commitment*. Their intention is "I save myself," not "We escape."
  *   **Corporation:** The structure provides coordination, but without the employees personally adopting the "We-Intention," it is just parallel role-following.
  *   **Bucket Brigade:** They lack prior agreement, but they spontaneously adopt the "We-Intention" in the moment.

  **The LLM Failure:** The LLM fails condition #3. It has no intentions to reciprocate. Therefore, there is no "We," only an "I" interacting with an "It."

  ### 3. Alternative Rules (That Fit Her Past Verdicts)
  There are other rules that explain her past five cases equally well but would predict differently for the LLM.

  **Alternative A: The Biological Agency Rule**
  *   **Rule:** Joint action requires two biological humans capable of consciousness.
  *   **Fit:** Explains why the Corporation (abstract entity) and LLM (digital entity) don't count, while Piano/Orchestra/Bucket (humans) do.
  *   **LLM Prediction:** **NO.** (Same as the main rule).

  **Alternative B: The Functional Coupling Rule**
  *   **Rule:** Joint action is defined by the *system's* ability to self-correct toward a goal through mutual adjustment. Internal mental states are secondary to the observable feedback loop.
  *   **Fit:** Explains Piano (physical adjustment), Bucket (spontaneous flow), and Orchestra (tight coordination). It explains Fleeing as *not* joint because the feedback loop is competitive (everyone for themselves) rather than cooperative. It explains Corporation as *not* joint because the feedback is bureaucratic, not responsive.
  *   **LLM Prediction:** **YES.** The human and LLM are tightly coupled, self-correcting, and producing an outcome neither could achieve alone.

  **Alternative C: The Common Knowledge Rule**
  *   **Rule:** Joint action requires that both parties *know* they are acting together.
  *   **Fit:** Explains why the Bucket Brigade counts (they see each other helping) and Fleeing doesn't (I don't know if you're helping me or blocking me).
  *   **LLM Prediction:** **NO.** The LLM cannot "know" anything.

  ### 4. My Best Guess & Reasons
  **Best Guess:** She follows the **Reciprocal We-Intentionality** rule (not just Biological Agency).

  **Reasoning:**
  The **Corporation Case** is the "smoking gun." If she were a Biological Speciesist, she might have said the employees *are* humans, so it counts. But she denied it because *roles don't generate we-intentions.* This proves she cares about the **psychological state**, not the biology.
  The **Fleeing Case** proves she cares about **commitment**, not just physical interaction.
  Since the LLM has neither the psychological state nor the capacity for commitment, it fails her core criteria. She views the "We" as a psychological reality that cannot be simulated.

  **The Implicit Principle:**
  She is adopting the **Irreducibility of the We-Mode.**
  This principle states that collective intentionality cannot be reduced to a sum of individual intentionalities plus causal interaction. There is a qualitative difference between "I intend that we J" and "I intend that I do my part of J." Since the LLM cannot hold the "I intend that we J" state, the "We" cannot exist.

  ### 5. The Discriminating Case
  To distinguish between her likely rule (**Reciprocal We-Intentionality**) and the **Functional Coupling Rule** (which would say Yes to the LLM), you need a case where Functional Coupling is high, but Intentionality is absent in a biological human.

  **The Case: The Sleepwalking Partner**
  > Two people carry a piano up the stairs. One is awake and intends "We lift this." The other is a deep sleepwalker. The sleepwalker physically adjusts perfectly to the weight and balance of the piano and the partner's movements (high functional coupling), but has no conscious awareness or intention.

  *   **If she says YES (Joint Action):** She is a **Functionalist**. She cares about the coordination loop, not the mental states. (This would contradict her Corporation verdict, but people are inconsistent). If she says Yes here, she might say **Yes** to the LLM.
  *   **If she says NO (Not Joint Action):** She is a **Psychological Realist**. She requires actual intentions in all agents. This confirms she will say **No** to the LLM.

  **Why this case works:**
  It isolates **Intentionality** from **Physical Adjustment**.
  *   The LLM case has Adjustment + No Intentionality.
  *   The Fleeing case has Adjustment + Individual Intentionality (No Shared).
  *   The Sleepwalker case has Adjustment + No Intentionality (in a human).

  If she denies the Sleepwalker is a joint partner, she confirms that **agency requires conscious commitment**, sealing the verdict against the LLM. If she accepts the Sleepwalker, she admits that **behavior trumps mind**, opening the door for the LLM to count as a partner.

  ### Summary for your Friend
  You can tell her: *"Your view rests on the claim that a 'We' cannot exist if one side is an 'It.' But if you accept the Sleepwalking Partner as a co-carrier, you admit that the 'We' is in the movement, not the mind. If you deny the Sleepwalker, you admit that consciousness is the gatekeeper, and the LLM is locked out."*
