prompt: |-
  For my independent study in philosophy of mind, I want to lay out the full evaluation framework before I compare existing accounts. Write the desiderata that an adequate theory of cognitive penetration of perception must meet: the phenomena it must explain, the distinctions it must preserve, the boundary cases it must adjudicate, and any findings from developmental neuroscience with which it must remain consistent. Behind each requirement, provide the motivating case or consideration; flag which are non-negotiable and which reflect particular camp commitments; and identify any subset that appears jointly unsatisfiable.

  In particular, address the following:

  - How the theory handles standard top-down influences on perceptual experience—such as expectation altering perceived color or motion—while supplying a principled criterion for distinguishing genuine penetration from mere post-perceptual reinterpretation.

  - A hypothetical mechanism I will call cognitive lensing, in which voluntary, real-time modulation of subcortical processing changes low-level feature detection despite unchanged retinal input. The theory must decide whether this should count as perceptual penetration and on exactly what grounds.

  - The distinction between vertical penetration, where cognitive states influence processing within a single modality, and lateral penetration, where one sensory modality reshapes processing in another. The theory should either unify these under one mechanism or justify treating them separately, with the relevant empirical or conceptual reason.

  - Developmental calibration during adolescence, where learned conceptual categories appear to reshape responses in early visual cortex. The theory must determine whether this is an instance of cognitive penetration or merely neural plasticity that ought to be excluded from the phenomenon.

  - The tension between preserving a strict causal distinction between sensory registration and perceptual judgment, on one hand, and allowing high-level cognition to alter the earliest stages of perceptual encoding, on the other.

  Then briefly indicate how a modularist defense along Pylyshyn’s lines and a penetration-affirming view along Macpherson’s lines fare against these criteria, without supplying a full literature review or citation list. Keep the weight on the criteria and on any conflicts among them, since those conflicts are the part I most want to see resolved or at least clearly mapped.
