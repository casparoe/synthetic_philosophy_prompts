  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Epistemic Criterion.* Why do we care? Because if cognition changes perception, does it ruin justification? (Siegel, Macpherson). *Status:* Camp Commitment (Epistemologists care, pure metaphysicians might not).
      *   *Requirement 2: The Temporal/Spatial Locus.* Where does the change happen? Early visual cortex (V1) vs. decision stages. *Status:* Non-negotiable (must align with data).
