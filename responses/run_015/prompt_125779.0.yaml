answer: |-
  You have done something brave and genuinely philosophical, which is to think hard about a problem because it bothers you, not because you want a grade or a publication. The fact that you are worried about being eaten shows you respect the room, and that respect will carry you further than any degree. The people there are not sharks, they are enthusiasts, but they do like to test ideas until they break. To survive the twenty minutes of questions, you need to control the frame immediately. Before you invite the first question, you should stand up and say two things plainly. First, admit that your account does not yet handle names learned solely from testimony or fiction, where you have no personal routine for locating the object. Second, admit that you do not yet have a solution for the collapse case where two names are learned via the exact same routine at the same time, yet the identity still feels informative. By saying this yourself, you take the weapon out of Malcolm's hand and you show the room you know the limits of your own map. It turns potential attacks into shared problems, and it makes you look honest rather than naive.

  Once you have cleared the ground, you need to know that there is one single reply that has to actually work or the whole talk is a waste of everyone's evening. This is the response to the claim that you are just rediscovering Frege. If the room decides you are merely repeating the sense-reference distinction with different words, they will stop listening because they will think there is nothing new to learn. You must draw a hard line between Frege's abstract modes of presentation and your concrete routines. Frege's sense is a logical object that exists whether you can use it or not; your routine is a physical or mental action that costs time, energy, and can fail. When you say this, lean on your work in the stores department. A part number in a catalogue is not the same thing as walking to the shelf and finding the box. One is a description, the other is a job of work. If you can make them feel the difference between a definition and a task, you keep your theory alive.

  Now I will walk you through the objections you will actually get, in the order they will likely come at you, numbered so you can track them on your phone. 1) Malcolm will lean forward, probably holding a pint, and say something like, This is all very practical, but surely you are just describing Frege's sense without the technical baggage. When Paderewski is the politician, the sense is different even if the reference is the same. You are just calling senses routines. He will say this politely, but it is the most dangerous attack because it threatens to make your work redundant. Your reply needs to be about ninety seconds and it must hit the cost factor. You should say, Frege treats the sense as a static object that you grasp, but my routine is something you do. If I have two routines for the same valve, I do not merge them just because I know they are the same. I keep using both because one requires a torch and the other requires a catalogue, and sometimes the torch battery is dead. Frege does not account for the cost of checking. If I know the Morning Star is the Evening Star, I still look in the evening to see it, because looking in the morning is impossible at night. The difference is not in the meaning, it is in the labour. This reply is thin if Malcolm pushes back on whether cost is relevant to meaning, but it is your best shot at distinguishing your view from his.

  2) Pat will be next, and she will not care about Frege. She will care about what kind of thing you think knowledge is. She will say, If learning an identity is not acquiring a proposition, then what state is your brain in? In programming, if two variables point to the same memory address, you do not need a licence to merge them, they are just the same pointer. What is this licence you are talking about? She will want to know if this is a psychological fact or a logical rule. Your reply should lean on the hospital stores analogy again. You can say, In the stores database, two part numbers can point to the same physical bin, but the system still treats them as distinct codes until a manager flags them as interchangeable. My account is about the manager's flag. It is not a change in the world, and it is not a change in the object, it is a change in the permission structure of the inventory. You are allowed to substitute one code for the other only after the flag is raised. This is not a proposition about the valve, it is a rule for the stock-taker. This reply is thin because Pat might ask whether the rule itself is a proposition, but if you stick to the idea of permission rather than truth, you might hold her off.

  3) The Chair will look at the clock and ask the pragmatic question. They will say, Okay, let's say you are right. So what? If we know the Morning Star is the Evening Star, does it change how we do astronomy? What work does this theory do that we cannot do already? This is not hostile, but if you cannot answer it, the talk will feel like a puzzle without a point. You should say, It changes how we treat experts. If identity is just a fact, then anyone who fails to know it is ignorant. But if identity is a merge of routines, then an expert who keeps checking both ways is not ignorant, they are prudent. It explains why scientists keep running redundant tests even when they are sure of the theory. It validates the work of checking. This gives your theory a use in understanding human behaviour, not just logic. This reply is solid because it comes from your own experience of chasing missing deliveries; knowing the delivery exists does not mean you stop chasing the driver until you have the box.

  4) The Poet will speak softly and say, You have drained the wonder out of the star. To say it is just a licence to merge records makes the sky sound like a warehouse. Why does it feel like a discovery if it is just bookkeeping? They are not trying to trap you, they are telling you that your account feels cold. Your reply should be, The wonder is not in the logic, it is in the fact that two different paths through the world lead to the same place. My account does not deny the wonder, it just says the wonder is in the geography, not in the sentence. Finding out two roads meet is still a journey. This is a short reply because you do not need to defend poetry, only protect your logic from being accused of killing it.

  5) The Mystic will ask whether we are just talking about words again. They will say, If it is not about the world, is it not just language games? You can say, The routines are not words. Looking through a telescope is not a word. Matching a valve number is not a word. These are interactions with the world. The identity is about the object, but the informativeness is about our access to it. This should satisfy them because you are grounding your theory in physical actions.

  Finally, there is the question you are going to be quietly praying nobody asks, but since you have already conceded the gap, they might ask it anyway. Someone, likely Malcolm or Pat, will press you on the collapse case you mentioned. They will say, You admitted you cannot handle the case where I learn two names from the same person, on the same occasion, by the same routine. If the routines are identical, your theory says the identity should not be informative. But it is. So your theory is wrong. This is the edge of your map. If they ask this, do not try to bluff. Do not try to invent a distinction on the spot. You should say, You are right. That is the limit of the account as it stands. I think there must be a hidden difference in the routines, perhaps in the timing or the context, but I cannot spell it out yet. I am telling you what I have, not what I wish I had. If you try to answer this confidently, you will lose the room because they will see you guessing. If you admit the boundary, you keep your credibility. You have built something real here from nothing but buses and books, and even if it has holes, it is yours. Stand behind it, admit the gaps, and let them see the work.
