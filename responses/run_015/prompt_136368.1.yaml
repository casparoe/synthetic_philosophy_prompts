  1. Brainstorm
  1. Treating situation, culture, and character as mutually exclusive competitors rather than interacting layers within a causal field.
  2. Ignoring intra-group variation, assuming uniform behavior where significant refusal data exists across units.
  3. Confounding outcome with intent, assuming atrocity requires sadism or fanaticism rather than procedural compliance or moral numbness.
  These errors simplify complex moral psychologies into single vectors, ignoring the messy reality of historical action. They produce clean narratives but fail empirical scrutiny regarding who actually participated and why.

  2. The Requirements
  1. **Explain Refusal Variation:** Any adequate theory must account for why some units or individuals refused without catastrophic penalty. Battalion 101 data shows opt-outs were possible, often without severe punishment. If a theory claims coercion was total or ideology universal, it fails historically. This is non-negotiable because it contradicts the archival record of dissent. Ignoring this creates a false necessity that absolves those who complied by suggesting they had no choice.
  2. **Model Moral Escalation:** It must explain the transition from initial hesitation to routine killing. Disgust often fades over time. A static model of character fails here because it cannot account for temporal change. Non-negotiable, as atrocity is a process, not an event. The theory must map the degradation of sensitivity across weeks and months of operation.
  3. **Decouple Ideology from Action:** Perpetrators need not be fanatics. The theory must accommodate ordinary motives like careerism or obedience alongside ideological ones. Non-negotiable, as evidence shows many killers lacked deep antisemitic belief. Conflating action with belief misdiagnoses the risk for future prevention. We must distinguish between hate and compliance.
  4. **Integrate Bureaucratic Structure:** Must show how division of labor diffuses responsibility. This is often a camp preference, with structuralists prioritizing this over individual psychology. It explains how participation scales without universal hatred. Administrative distance matters as much as peer pressure.
  5. **Preserve Moral Agency:** Actors must remain morally evaluable, not merely vectors of force. If they are automatons, punishment makes no sense. Non-negotiable for any moral psychology. We cannot explain evil by eliminating the evildoer's capacity to choose.

  **Flagged Tension:** **Preserve Moral Agency vs. Explain High Compliance.** If agency is robust, why did compliance reach such heights? If compliance is near-total, agency appears negligible. Satisfying both requires a nuanced view of constrained choice. This is jointly unsatisfiable if defined rigidly. This tension is the core philosophical problem. If we emphasize agency, we struggle to explain the uniformity of behavior across diverse populations. If we emphasize structural determination, we risk exculpation. A viable theory must walk this line without collapsing into either pure voluntarism or hard determinism.

  **Negotiability:** Refusal, Escalation, Agency are non-negotiable. Structure and Ideology weight are camp preferences.

  3. Institutional Anesthesia Stress Test
  Institutional anesthesia demands the theory explain moral deadening without relying on explicit peer pressure or deep ideological commitment. It pushes against the requirement to Preserve Moral Agency by suggesting habituation overrides choice. It also challenges the Decouple Ideology requirement by introducing a third variable: procedural numbness. A theory focusing solely on situation (peer pressure) misses the bureaucratic dulling. A theory focusing on character misses the structural conditioning. The stress test requires explaining how administrative routine itself becomes the moral anesthetic, making killing a clerical task rather than a violent one. This forces the desiderata to account for temporal degradation of sensitivity, not just snapshot decision-making. It implies that moral psychology is not just about choices but about the erosion of the capacity to choose over time through repetition.

  4. Contender Scorecard
  **Pure Situationist (Browning):** Scores high on Refusal Variation and Moral Agency. It acknowledges peer pressure but allows for opting out. However, it fails on Institutional Anesthesia; it relies too heavily on face-to-face peer pressure rather than bureaucratic dulling. It explains the *moment* of killing well, but not the *process* of habituation.
  **Cultural-Ideological (Goldhagen):** Scores high on Escalation consistency and motivation. It explains why killing happened willingly. However, it fails catastrophically on Refusal Variation and Decoupling Ideology. It cannot explain why some refused if eliminatory antisemitism was universal. It collapses variation into homogeneity.
  **Character-Selection:** Scores high on Moral Agency and individual responsibility. It suggests only bad people do bad things. However, it fails on the Ordinary People premise. It implies perpetrators were distinct from the start, contradicting historical data on random unit assignment and pre-war behavior.
  *Verdict:* Situationist is most robust but needs structural augmentation to handle anesthesia. It captures the human element best but underestimates the bureaucratic machine.

  5. Bottom Line
  The requirement to Explain Refusal Variation kills the most popular theories, specifically monocausal ideological models. If everyone was a fanatic, no one refuses. If everyone was coerced, no one refuses. Acknowledging refusal admits contingency. The price is predictive power. You cannot build a law-like science of atrocity if human choice remains a variable. I would pay theoretical elegance to drop it, but historical truth demands I keep it.
