  Yes, you are right: Hofstadter spells it **simmballs** (two 'm's, two 'l's), a portmanteau of "symbols" and "marbles."

  It is great to see a biochemist tackling *Gödel, Escher, Bach*; that careenium analogy is essentially a thought experiment on emergence and reductionism. Here is how I would tier those five positions based on current philosophical defensibility, moving from most robust to least.

  **S-Tier: (C) Feedback loops where they influence each other but neither dominates**
  This aligns best with modern systems theory and non-reductive physicalism, allowing high-level patterns to constrain low-level activity without violating physical laws.

  **A-Tier: (D) Substrate-only, where the careenium does all the work and simmballs are just bookkeeping labels**
  This is ontologically secure under causal closure but struggles to explain why evolutionary processes would retain energetically costly symbolic structures if they were merely descriptive.

  **B-Tier: (E) A weird boundary-condition view where simmballs only push when the careenium is near a critical threshold**
  While plausible within complexity science, this is arguably just a specific mechanistic instance of feedback rather than a distinct ontological category.

  **C-Tier: (A) Hard downward causation, where simmballs literally restructure the careenium**
  This view risks implying a violation of micro-physical laws unless carefully qualified as constraint rather than direct force.

  **D-Tier: (B) Strict epiphenomenalism, where they do nothing at all**
  This is the least defensible because it renders the existence of consciousness and symbols evolutionarily inexplicable since they would confer no causal advantage.
