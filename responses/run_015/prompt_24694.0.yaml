answer: |-
  ### The Scenario: The Oakhaven Infrastructure Referendum

  The town of Oakhaven (population 100,000 registered voters) is voting on a technical bond measure: "Proposition 4." The choice is binary: adopt a new, cheaper water filtration protocol (Option A) or retain the old, expensive one (Option B). Independent engineering audits confirm Option A is safe and fiscally superior; Option B is objectively the wrong choice. However, the issue is complex. Voters must read a 20-page summary to form an educated opinion. Most voters are slightly competent: if they bother to form an opinion, they have a 51% chance of identifying the correct option ($p = 0.51$), and their judgments are statistically independent (no mass media manipulation or herd behavior). Historically, turnout for these bonds is 25% ($N = 25,000$). The personal benefit to each voter of the correct policy is estimated at \$2,000 (in tax savings and utility stability). The cost of voting (travel, time, research) is \$25.

  ***

  ### The Three Calculations

  **1. The Condorcet Condition (Collective Competence)**
  *Does the majority likely pick the correct option at expected turnout?*
  We apply the Condorcet Jury Theorem using a normal approximation of the binomial distribution.
  *   **Voters ($n$):** 25,000
  *   **Competence ($p$):** 0.51
  *   **Expected Correct Votes:** $25,000 \times 0.51 = 12,750$
  *   **Standard Deviation ($\sigma$):** $\sqrt{n \cdot p \cdot (1-p)} = \sqrt{25,000 \cdot 0.51 \cdot 0.49} \approx 79$
  *   **Threshold for Majority:** 12,501
  *   **Z-Score:** $\frac{12,501 - 12,750}{79} \approx -3.15$

  A Z-score of -3.15 indicates the threshold is over 3 standard deviations below the mean. The probability of the majority being correct is **99.9%**.
  *Result:* Condition Met. At expected turnout, the electorate is virtually guaranteed to find the truth.

  **2. The Paradox Condition (Individual Rationality)**
  *Is it rational for a single voter to show up?*
  We calculate Expected Utility ($EU$) = $(P_{pivotal} \times Benefit) - Cost$.
  *   **Benefit ($B$):** \$2,000
  *   **Cost ($C$):** \$25
  *   **Pivotal Probability ($P_{piv}$):** This is the likelihood your vote breaks a tie. In a election of 25,000 voters, the maximum possible probability of a tie (assuming a 50/50 race) is approximated by $\frac{1}{\sqrt{\pi \cdot n / 2}}$.
      *   Calculation: $\frac{1}{\sqrt{3.14 \cdot 12,500}} \approx \frac{1}{198} \approx 0.005$.
      *   *Honesty Note:* Since $p=0.51$, the race is not actually 50/50; the true $P_{piv}$ is exponentially smaller (effectively zero). However, to give the voter the benefit of the doubt, we use the "toss-up" upper bound of **0.005**.
  *   **Expected Benefit:** $0.005 \times \$2,000 = \$10$
  *   **Net Utility:** $\$10 - \$25 = -\$15$

  *Result:* Condition Met. Even under the generous assumption that the race is a dead heat, the expected return is negative. A rational actor stays home.

  **3. The Collapse Condition (Collective Self-Defeat)**
  *What happens if everyone follows the rational advice and stays home?*
  Assume turnout craters to 1% of registered voters ($n = 1,000$) because everyone reasons as above.
  *   **Voters ($n$):** 1,000
  *   **Competence ($p$):** 0.51
  *   **Expected Correct Votes:** 510
  *   **Standard Deviation ($\sigma$):** $\sqrt{1,000 \cdot 0.51 \cdot 0.49} \approx 15.8$
  *   **Threshold for Majority:** 501
  *   **Z-Score:** $\frac{501 - 510}{15.8} \approx -0.57$

  A Z-score of -0.57 corresponds to a cumulative probability of roughly **71.5%**.
  *Result:* Condition Met. The probability of the correct outcome drops from **99.9%** to **71.5%**. The epistemic guarantee provided by the large sample size has effectively evaporated, turning a near-certain truth into a coin flip with a slight bias.

  ***

  ### Analysis for the Seminar

  **The Single Feature Doing the Work**
  The tension is driven entirely by **marginal competence ($p$) hovering just above 0.5**.
  If $p$ were 0.60, the Condorcet benefit would hold even at 1% turnout (accuracy would remain >99%), removing the collective danger. If $p$ were 0.50, the Condorcet benefit would vanish even at 25% turnout, removing the collective good. The paradox only bites because the "truth-tracking" power of the group is *highly sensitive to sample size* when individual signal quality is weak. The individual voter is causally negligible (Paradox), but statistically necessary to maintain the sample size required for the weak signal to amplify (Condorcet).

  **The Defender's Pushback**
  A defender of voting (e.g., a Rule Utilitarian or Kantian) would argue: *"You cannot universalize the maxim 'don't vote.' If everyone reasons that way, democracy collapses. Therefore, you have a duty to vote to sustain the system."*

  **Where the Pushback is Weakest**
  This defense fails on **causal efficacy**. It asks the voter to act *as if* their single vote determines the outcome, when the math proves it does not. In the Oakhaven case, my staying home does not cause the other 24,999 to stay home; it merely reduces $N$ to 24,999. The collapse only happens if *everyone* defects simultaneously. Asking an individual to incur a certain cost (\$25) to prevent a collective risk they cannot individually avert requires a leap of faith that contradicts the instrumental rationality the Paradox highlights. It solves the moral problem by ignoring the causal math.

  **Instructor Note on Compatibility**
  All three conditions are logically compatible, but the case is **fragile**. It requires $p$ to be in a "Goldilocks zone" (roughly 0.51 to 0.55). If you assign a problem set where $p=0.7$, the Collapse Condition fails (accuracy stays high even with low turnout). If you assign $p=0.50$, the Condorcet Condition fails (accuracy is low even with high turnout). Ensure your students understand that this tension is specific to *low-competence, high-stakes* technical voting, not high-salience partisan elections where $p$ is irrelevant (preference aggregation) or turnout is driven by identity rather than instrumentality.
