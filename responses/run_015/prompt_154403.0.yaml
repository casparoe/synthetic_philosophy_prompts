answer: |-
  ### Conceptual Mapping and Distinctions

  Before addressing your observation directly, I must distinguish the three conceptual layers you identified, as they are often conflated in the literature:

  1.  **Incentive Distortion (Goodhart's Law/Campbell's Law):** This is behavioral. Agents change their actions to maximize the score. The underlying definition of "good work" remains intact, but behavior diverges from it. *Your observation goes deeper:* the definition of "good work" itself changes.
  2.  **Epistemic Closure (Audit Culture/Commensuration):** This is procedural. Complex qualities are translated into comparable quantities (commensuration), inevitably losing information. *Your observation adds a normative layer:* the loss of information is not regretted; it is celebrated as "objectivity."
  3.  **Ontological Redefinition (Operationalism/Performativity):** This is metaphysical. The measure does not just track reality; it constitutes it. *Your specific contribution:* The institution actively denies the reality of the unmeasured, framing its own inability to see as a feature of rigor rather than a bug of perception.

  ### Analysis of the Phenomenon

  You have identified a configuration that sits at the intersection of the philosophy of science, institutional sociology, and Foucaultian power analysis. While there is no single canonical term that captures this *exact* configuration (specifically the valorization of blindness), it is a synthesis of several established lineages.

  #### 1. The Philosophical Ancestor: Operationalism
  The philosophical root of what you describe is **Operationalism** (Percy Bridgman, 1927). In the philosophy of science, operationalism posits that a concept is synonymous with the set of operations used to measure it (e.g., "intelligence is what IQ tests measure").
  *   **Where it fits:** This explains the "ontological inversion." If the metric is the operation, and the operation cannot capture tacit knowledge, then within that system, tacit knowledge does not exist.
  *   **Where it falls short:** Operationalism was a proposed method for scientific rigor, not a critique of bureaucratic pathology. It lacks the sociological dimension of *hidden work migration* and the *power dynamics* you describe.

  #### 2. The Cognitive Ancestor: The McNamara Fallacy
  The most direct cognate is the **McNamara Fallacy** (named after Robert McNamara's management of the Vietnam War). It is defined in four steps:
  1.  Measure whatever can be easily measured.
  2.  Disregard that which cannot be easily measured or give it an arbitrary quantitative value.
  3.  Presume that which cannot be measured easily isn't important.
  4.  **Presume that which cannot be measured easily doesn't exist.**
  *   **Where it fits:** This captures the ontological slide perfectly (Step 4).
  *   **Where it falls short:** The McNamara Fallacy is typically framed as a *cognitive error* by decision-makers. Your observation describes a *structural institutional state* where the blindness is defended as a virtue ("rigor"). The Fallacy implies a mistake; you are describing a *regime of truth*.

  #### 3. The Sociological Ancestor: Audit Culture & Commensuration
  Marilyn Strathern's **Audit Culture** and Wendy Espeland's work on **Commensuration** describe how accountability mechanisms transform professional identities.
  *   **Where it fits:** They explain the "migration of hidden work." Strathern notes that when accountability is demanded, professionals spend more time documenting work than doing it.
  *   **Where it falls short:** Audit culture focuses on the *ritual of verification*. It does not fully account for the *epistemic claim* that the invisible is *unprofessional*. It describes the pressure, but not the ontological reclassification of the shadow work as "illegitimate."

  #### 4. The Power Ancestor: Foucault's Examination
  In *Discipline and Punish*, Foucault describes the **Examination** as a mechanism that combines hierarchy and observation to produce "cases."
  *   **Where it fits:** This explains the visibility aspect. The subject is constituted by what is recorded.
  *   **Where it falls short:** Foucault's Panopticon relies on the *threat* of visibility to induce self-regulation. Your phenomenon is more aggressive: it is not just that the invisible is unrecorded, but that the institution claims *epistemic superiority* because it ignores the invisible. It is a **Panopticon that claims the blind spots are empty space.**

  ### The Missing Concept: "Ontological Metricism"

  Because the existing literature treats these as separate threads (cognitive bias, sociological pressure, philosophical stance, power mechanism), there is no single term for the *specific configuration* you observed: **the ontological redefinition of a profession via metrics, coupled with the normative valorization of the resulting blindness.**

  I propose we coin the term **Ontological Metricism** to describe this specific institutional stance.

  #### Definition
  **Ontological Metricism** is an institutional regime in which:
  1.  **Constitution:** Measurable activities are not merely tracked but are ontologically constituted as the *only* legitimate form of professional labor.
  2.  **Exclusion:** Activities resisting quantification (tacit knowledge, relational labor, exploratory failure) are not just unmeasured but are reclassified as *extraneous* to the profession.
  3.  **Valorization of Blindness:** The institution's inability to perceive these excluded activities is framed not as a limitation of the metric, but as a guarantee of **objectivity** (i.e., "We ignore the messy human factors to ensure rigorous data").

  #### Boundary Conditions
  To ensure this concept is precise, we must distinguish it from adjacent phenomena:

  | Phenomenon | Distinction from Ontological Metricism |
  | :--- | :--- |
  | **Goodhart's Law** | Goodhart describes *gaming* the metric (behavioral distortion). Ontological Metricism describes *becoming* the metric (identity reconstruction). In Goodhart, the staff knows the metric is flawed; in Ontological Metricism, the institution believes the metric is the truth. |
  | **Bureaucratic Ritualism** | Ritualism involves going through the motions while ignoring the goals. Ontological Metricism involves believing the motions *are* the goals. It is sincere, not cynical. |
  | **Foucault's Panopticism** | Panopticism relies on *uncertain* visibility to induce self-discipline. Ontological Metricism relies on *certain* visibility to define reality. The Panopticon hides the observer; Ontological Metricism hides the unobserved. |
  | **The McNamara Fallacy** | The Fallacy is a *decision-making error*. Ontological Metricism is a *sustained institutional ontology*. The Fallacy is a mistake; Metricism is a defense mechanism against the complexity of trust. |

  #### The Mechanism: "Epistemic Sanitization"
  Within Ontological Metricism, the specific move you identified—treating blindness as rigor—functions as **Epistemic Sanitization**.
  *   **Process:** Tacit knowledge is "messy," "subjective," and "biased."
  *   **Inversion:** By excluding tacit knowledge, the metric is "clean," "objective," and "rigorous."
  *   **Result:** The migration of real work to the shadows is not seen as a loss of capacity, but as the removal of noise. The institution becomes more "efficient" precisely because it is less capable of seeing its own functioning.

  ### Lineage and Placement in Literature

  If you wish to locate this in the literature, you should position **Ontological Metricism** as the pathological evolution of **Operationalism** within an **Audit Culture**, defended by a claim to **Technocratic Objectivity** (Theodore Porter's *Trust in Numbers*).

  *   **Closest Existing Analogue:** The concept of **"Data Double"** (Haggerty & Ericson) in surveillance studies. The data double is the abstract profile that replaces the person. However, the Data Double is usually discussed in terms of privacy and control. **Ontological Metricism** applies this to *professional epistemology* and *institutional legitimacy*.
  *   **Closest Sociological Analogue:** **"Commensuration"** (Espeland & Stevens). This describes the transformation of qualities into quantities. Ontological Metricism is what happens when commensuration becomes totalizing and normative.

  ### Conclusion

  You have correctly identified that this is not merely incentive distortion. It is a **regime of truth**. The institution is not just measuring performance; it is legislating what *counts* as performance, and then claiming that its legislative blinders are actually scientific goggles.

  While **The McNamara Fallacy** is the cognitive ancestor, and **Audit Culture** is the sociological context, the specific configuration of *ontological redefinition + valorized blindness* is best carved out as **Ontological Metricism**. It differs from panopticism because it does not just discipline the subject through visibility; it annihilates the subject's reality where visibility fails, and claims that annihilation is precision.

  **Recommended Terminology for your Analysis:**
  *   **Primary Term:** Ontological Metricism.
  *   **Mechanism:** Epistemic Sanitization.
  *   **Outcome:** Shadow Migration (the displacement of real work to unrecorded spaces).

  This framing allows you to critique the institution not for being "inefficient" (which it might deny using its own data), but for being *ontologically reductionist*—for mistaking the map for the territory and then burning the territory because it doesn't match the map.
