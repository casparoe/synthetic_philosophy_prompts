answer: |-
  This is a sharp observation that cuts to the metaphysical core of mechanistic interpretability. The field is operating with a disjunctive definition of representation that masks a deep philosophical tension between **Informational Semantics** and **Functional Role Semantics**.

  When researchers treat decoding and steering as interchangeable sufficient conditions, they are implicitly assuming a "Natural Kind" hypothesis: that *real* features ought to be both readable and causal. When the two come apart, the field treats it as an engineering noise problem (e.g., "the probe is too powerful" or "the intervention is too coarse") rather than a conceptual crisis.

  Here is the breakdown of the implicit theories, the ontological commitments, and the consequences of enforcing one over the other.

  ---

  ### 1. The Two Implicit Theories

  #### A. Decoding (The Informational/Structural View)
  **The Claim:** A model represents $X$ if information about $X$ is recoverable from its internal states.
  **The Condition:** There exists a mapping $f$ (linear probe, SAE feature, etc.) from activation space $A$ to concept space $C$ such that $f(A)$ predicts $C$ with high accuracy.
  **Philosophical Root:** **Informational Semantics** (e.g., Dretske, Fodor). A state represents $X$ if it covaries with $X$ under appropriate conditions. It is also compatible with **Structural Representation**, where the geometry of the activation space mirrors the structure of the concept space.

  *   **What must be true:** The activation vector must contain sufficient mutual information with the concept. The representation exists as a static property of the weights and activations, independent of whether the downstream network layers actually read that specific subspace.
  *   **What it rules out (without argument):** It rules out **Holism**. It assumes representations are *localizable* (or at least sparsely decomposable). It also rules out the requirement of **Integration**. It allows for "epiphenomenal representations"—states that carry content but play no role in generating behavior.
  *   **The Risk:** The "Pancomputationalism" problem. With a powerful enough probe (non-linear, overfit), you can decode almost anything from random noise. If representation is just decodability, then every model represents everything to some degree, diluting the term to meaninglessness.

  #### B. Steering (The Causal/Functional View)
  **The Claim:** A model represents $X$ if manipulating the state corresponding to $X$ systematically alters the model's behavior regarding $X$.
  **The Condition:** An intervention $do(A = A + \delta)$ results in a predictable change in output distribution $P(Y|X)$ consistent with the semantics of $X$.
  **Philosophical Root:** **Functional Role Semantics** (e.g., Block, Cummins) or **Interventionalist Causation** (Woodward). Content is determined by the causal role the state plays within the system. A state represents "dog" only if treating it as "dog" makes the system act like it's processing a dog.

  *   **What must be true:** The activation must be *integrated* into the computational graph. It must be an input to downstream mechanisms that govern behavior. The representation is a dispositional property, not just a structural one.
  *   **What it rules out (without argument):** It rules out **Passive Structuralism**. It denies that geometry alone constitutes representation. It also rules out **Latent Knowledge** that is causally inert. If the model "knows" the truth (decodable) but is optimized to lie (and steering the "truth" direction doesn't stop the lying), the causal view says the model does *not* represent the truth in its policy.
  *   **The Risk:** Over-generation via "breaking." You can steer a model to output nonsense by adding noise. To count as representation, the intervention must preserve the model's coherence while shifting the specific variable. This requires a "ceteris paribus" clause that is hard to define in high-dimensional non-linear systems.

  ---

  ### 2. Is the Field Committed to a Single View?

  The field's willingness to accept either test suggests **Ontological Underdetermination** coupled with **Instrumentalism**.

  1.  **The Natural Kind Hope:** Most interpretability researchers secretly hope for a **Identity Theory**. They want the "decodable direction" and the "causal direction" to be identical. When papers report one or the other, they are usually implying, "We found the thing; we just only measured it one way." They assume that if a feature is truly monosemantic (SAE ideal), it *must* be causal.
  2.  **The Instrumentalist Reality:** Practically, the field is deflationary. "Representation" is not a metaphysical claim about the model's mind; it is a claim about **researcher leverage**.
      *   If I can decode it, I can *monitor* the model.
      *   If I can steer it, I can *control* the model.
      *   Both are useful for safety, so both are labeled "representation."

  This is consistent with a **Dispositional Account**: To say a model represents $X$ is just to say it has a cluster of dispositions (being readable, being steerable, correlating with $X$). You don't need all of them to apply the label, just enough to make the prediction useful.

  However, this creates a category error when discussing **Deception**.
  *   **Decoding view:** A deceptive model *represents* the truth (it's decodable from hidden layers) but outputs lies.
  *   **Steering view:** A deceptive model *represents* the lie (that's what drives behavior). The truth is merely "data," not a "representation" in the functional sense.
  *   **The Conflict:** If you treat these as interchangeable, you cannot formally distinguish between a model that is *mistaken* and a model that is *lying*.

  ---

  ### 3. Enforcing the Causal Criterion Strictly

  If we mandated that **only causal interventions count as representations** (Functional Role Semantics), the landscape of interpretability would shrink drastically.

  #### Claims You Would Have to Retract
  1.  **Most Probing Papers:** Claims like "Layer $N$ encodes truthfulness" would be retracted unless accompanied by evidence that the model *uses* that encoding to generate answers. (See: The "Truthful QA" debates where probes find truth in models that consistently lie).
  2.  **Passive SAE Features:** Many SAE features are reconstructive but not causal. They help rebuild the activation but intervening on them might not change the output logit. These would be reclassified as "compression artifacts" rather than "concepts."
  3.  **Latent Knowledge Claims:** In safety scenarios where we worry a model "knows" a bioweapon recipe but refuses to output it, the causal view forces us to admit the model *does not represent* the recipe in its policy network. It represents the *refusal*. The knowledge is in the weights, but not active as a representation in the forward pass.

  #### What Would Remain (And Why We'd Care)
  1.  **Circuits / Mechanistic Interpretability:** This field is already largely causal. Identifying that "Induction Head A attends to Token B to predict Token C" is a causal claim. This would become the *only* legitimate form of interpretability.
  2.  **Steering Vectors for Safety:** Research on "activation engineering" (e.g., steering away from sycophancy) would be the gold standard. If you can turn off a behavior via intervention, you have found a representation of that behavior.
  3.  **Causal Scrubbing:** Techniques that verify hypotheses by swapping activations and checking loss preservation would become the primary validation metric.

  #### The Cost of Strict Causality
  The cost is the loss of **Diagnostic Power**.
  Decoding is cheap and non-invasive. You can scan a model for dangerous concepts without triggering them. If you enforce strict causality, you lose the ability to say "The model contains a representation of bioweapons" unless you are willing to intervene and risk making the model output bioweapons to prove it.

  For safety, this is a critical loss. We want to know if the information is *present* (decoding), even if it is currently *suppressed* (non-causal). A strict causal theory of representation renders "dormant danger" invisible.

  ### 4. Summary: The Philosophical Bill

  The field is currently running on a **Pragmatic Disjunction**:
  $$ \text{Representation} \equiv \text{Decodable} \lor \text{Steerable} $$

  *   **Decoding** buys you **Observability** (Informational view). It treats the model as a text to be read.
  *   **Steering** buys you **Control** (Functional view). It treats the model as a machine to be tuned.

  By conflating them, the field avoids admitting that **Observability does not imply Agency.**

  If you force the field to choose the **Causal/Functional** account (which is philosophically more robust for defining "what the model is doing"), you solve the problem of epiphenomenal features but create a blind spot for latent capabilities.

  If you force the **Informational** account, you solve the problem of latent capabilities but drown in false positives where the model "represents" things it ignores.

  **The Verdict:** The field's practice is underdetermined, but not innocently so. It is a strategic ambiguity. It allows researchers to claim the robustness of causality when they have steering results, and the breadth of information theory when they only have probes. Until this is resolved, claims that a model "genuinely has a representation" should be read as "genuinely has a handle we can pull or a signal we can read," not as a claim about the model's ontology.
