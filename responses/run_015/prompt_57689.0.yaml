      *   *Steering/Intervention:* This aligns with **Functional Role Semantics** (Block, Cummins) or **Causal Theories of Representation**. If manipulating $X$ changes behavior regarding $Y$ in the right way, $X$ represents $Y$. It focuses on *usage* and *causal power*.
      *   *The Tension:* The "Hard Problem" of Interpretability mirrors the "Hard Problem" of Content in philosophy of mind. Is representation about what's *in* the system or what the system *does* with it?

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the insight. It's a genuine philosophical fissure in the field. Name the two camps: *Readout Realism* (Decoding) vs. *Causal Functionalism* (Steering).

      *   **Part 1: The Implicit Theory of Decoding (Readout Realism):**
          *   *Core Claim:* Representation = Encoded Information.
          *   *Condition:* There exists a mapping $f: \text{Activation} \to \text{Concept}$ with low error.
          *   *Philosophical Root:* Informational Semantics (Dretske). The state carries the content because it covaries with the content.
          *   *What it rules out:* It rules out the idea that representation requires *use*. It allows for "epiphenomenal representations" (information present but ignored).
          *   *Weakness:* The "Probe Problem." A powerful probe can find information anywhere (linearly or non-linearly) that the model itself doesn't use. This leads to false positives (pancomputationalism risk).

      *   **Part 2: The Implicit Theory of Steering (Causal Functionalism):**
          *   *Core Claim:* Representation = Causal Role.
          *   *Condition:* Manipulating activation $A$ changes behavior $B$ regarding concept $C$ systematically.
          *   *Philosophical Root:* Functional Role Semantics / Interventionalist Causation (Pearl/Woodward). Content is determined by how the state affects downstream processing.
          *   *What it rules out:* It rules out "dead" information. If the model doesn't use it, it's not a representation *for the model*.
          *   *Weakness:* Over-generation. You can steer a model to do anything by breaking it. Also, distributed representations might not have a single "steerable" direction (the "basis problem").

      *   **Part 3: The Field's Ontological Commitment (Underdetermination vs. Pragmatism):**
          *   *Is it a single view?* No. It's a pragmatic disjunction. The field operates on an "Or" condition because the goal is usually *control* or *understanding*, not metaphysical truth.
          *   *Deflationary View:* Yes, "representation" is likely a shorthand for "predictive structure" (Decoding) or "controllable lever" (Steering). It's instrumentalist.
          *   *The "Interchangeability":* This suggests the field assumes a "Natural Kind" hypothesis (that features *should* be both decodable and causal). When they diverge, it's treated as noise, not a philosophical crisis.

      *   **Part 4: Enforcing the Causal Criterion Strictly:**
