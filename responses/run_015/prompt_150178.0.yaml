answer: |-
  This is a sophisticated request that cuts to the epistemological core of the Anthropocene debate. You are asking for the *meta-criteria* of stratigraphic theory as applied to human history, not just a summary of the Anthropocene Working Group (AWG) recommendations.

  To settle the debate with your roommate, you need to distinguish between **Stratigraphic Necessity** (what is required to define a rock layer) and **Historical Sufficiency** (what is required to tell the truth about human impact).

  Here are the desiderata for any theory claiming to define a human-driven geological epoch, categorized by their logical status, followed by the analysis of the jointly unsatisfiable constraints.

  ---

  ### I. The Non-Negotiable Desiderata (Stratigraphic Hard Constraints)
  *These are required by the International Commission on Stratigraphy (ICS). If a theory fails these, it is not a geological epoch; it is a cultural or historical period.*

  **1. Stratigraphic Visibility (The "Rock Record" Requirement)**
  *   **Definition:** The proposed marker must be preserved in a physical medium (ice, sediment, rock, coral) that will survive for millions of years.
  *   **Why it matters:** Geology deals in deep time. A change that is significant culturally but leaves no physical trace (e.g., the invention of the internet, unless server farms fossilize) cannot define a geological epoch.
  *   **Status:** **Non-Negotiable.**

  **2. Global Correlatability (The "Golden Spike" Requirement)**
  *   **Definition:** There must be a signal identifiable in stratigraphic sections across multiple continents and oceans, allowing geologists in the future to correlate the layer in China with the layer in Argentina.
  *   **Why it matters:** An epoch cannot be regional. If the signal is only visible in the Northern Hemisphere industrial zone, it is a local event, not a global epoch.
  *   **Status:** **Non-Negotiable.** (Note: This does not require the *impact* to be synchronous, but the *marker* must be globally traceable).

  **3. Distinctiveness from the Holocene (The "Boundary" Requirement)**
  *   **Definition:** The signal must represent a statistically significant deviation from the baseline variability of the preceding epoch (the Holocene).
  *   **Why it matters:** If the proposed signal falls within the natural noise of the Holocene (e.g., standard pollen variation), it cannot mark a new epoch. It must be a "step change."
  *   **Status:** **Non-Negotiable.**

  **4. Permanence (The "Irreversibility" Requirement)**
  *   **Definition:** The changes indicated by the marker must be projected to persist on geological timescales (thousands to millions of years), even if human activity ceases.
  *   **Why it matters:** If the signal is transient (e.g., a temporary temperature spike that resets), it is an "event" or "excursion," not an epoch. The stratigraphy must show a new stable state.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. The Camp-Specific Preferences (Theoretical & Philosophical Constraints)
  *These are where the debate lies. Different schools of thought prioritize these differently, leading to different start dates (1950 vs. 1800 vs. 5000 BP).*

  **5. Signal Coherence (The "Bundle" Requirement)**
  *   **Definition:** Ideally, multiple markers (radionuclides, CO2, plastics, fly ash) should align temporally.
  *   **The Conflict:** As you noted, Plutonium-239 peaks in 1964, CO2 curves bend in 1950, plastic layers accumulate later, and fly ash starts in 1850.
  *   **Camp Preference:**
      *   *Strict Stratigraphers:* Prioritize the sharpest signal (Plutonium), accepting it ignores earlier CO2 rises.
      *   *Earth System Scientists:* Prioritize the functional shift (CO2/Climate), accepting a fuzzier boundary.
  *   **Status:** **Camp-Specific.**

  **6. Causal Specificity vs. Signal Proxy**
  *   **Definition:** Does the marker represent the *cause* of the change (industrial combustion) or just a *symptom* (radionuclides)?
  *   **The Conflict:** Radionuclides are globally synchronous but represent a specific technological moment (nuclear testing), not the onset of fossil fuel dominance. Coal soot represents the cause but is geographically patchy.
  *   **Camp Preference:**
      *   *AWG (1950s):* Prioritizes global synchrony (Radionuclides) over causal origin.
      *   *Early Anthropocene (Ruddiman):* Prioritizes causal origin (Agriculture/CO2) over stratigraphic sharpness.
  *   **Status:** **Camp-Specific.**

  **7. Accommodation of Asynchrony (The "Lag" Requirement)**
  *   **Definition:** How the theory handles the time lag between the human action and the signal appearing in the sink (e.g., carbon emitted in 1800 settles in deep ocean sediment in 1950).
  *   **The Conflict:** A start date based on emission (human time) differs from a start date based on sedimentation (geological time).
  *   **Camp Preference:**
      *   *Geologists:* Define the boundary by the *sediment layer* (when it lands).
      *   *Historians:* Define the boundary by the *action* (when it was burned).
  *   **Status:** **Camp-Specific.**

  **8. The "Noise" Threshold (Early Human Impact)**
  *   **Definition:** Determining when local human alterations (Terra Preta, Aboriginal fire) sum to a global signal.
  *   **The Conflict:** Your roommate's point. If you ignore early impacts, you erase indigenous history. If you include them, you lose the "Great Acceleration" sharpness.
  *   **Camp Preference:**
      *   *Mid-20th Century:* Treats pre-1950 impacts as "Holocene noise" until they become globally synchronous.
      *   *Long Anthropocene:* Treats pre-1950 impacts as the "onset phase," arguing the boundary is a process, not a line.
  *   **Status:** **Camp-Specific.**

  ---

  ### III. The Jointly Unsatisfiable Subset (The Anthropocene Trilemma)

  You asked if there is a subset of these desiderata that is jointly unsatisfiable. **Yes.** This is the critical insight for your debate.

  You cannot simultaneously maximize the following three constraints. You must sacrifice one to satisfy the other two:

  1.  **Strict Global Synchrony:** A single, isochronous boundary layer identifiable worldwide (e.g., Plutonium-239).
  2.  **Causal Completeness:** A boundary that captures the full onset of human planetary dominance, including early asynchronous impacts (e.g., Agriculture/Industrial Revolution).
  3.  **Stratigraphic Sharpness:** A clear, distinct line in the rock record rather than a gradual gradient.

  #### Why they break together:

  *   **If you choose Synchrony + Sharpness (The AWG/1950 Model):**
      *   *You get:* A perfect "Golden Spike" (Plutonium).
      *   *You lose:* **Causal Completeness.** You are forced to treat 150 years of industrialization and 5,000 years of agriculture as "pre-history." You validate your roommate's accusation: you are reducing the complex history of human culture to a single isotope spike. The start date reflects the Cold War, not the onset of human geological agency.
  *   **If you choose Causal Completeness + Sharpness (The Early Anthropocene Model):**
      *   *You get:* A boundary that matches the start of significant human impact (e.g., 8,000 BP CO2 rise).
      *   *You lose:* **Global Synchrony.** The signal is diachronous. Agriculture starts in the Fertile Crescent millennia before the Amazon. There is no single "year" or "layer" globally. Geologists cannot use it as a correlation tool.
  *   **If you choose Causal Completeness + Synchrony (The Earth System Model):**
      *   *You get:* A narrative that captures the whole story and acknowledges global reach.
      *   *You lose:* **Stratigraphic Sharpness.** The boundary becomes a "zone" or "transition" (e.g., 1800–1950) rather than a line. This violates the ICS rulebook for defining formal epochs, rendering it a "branding exercise" in the eyes of strict geologists.

  ### IV. Addressing the Roommate's Critique

  Your roommate argues you are "reducing culture to ice cores." Within this framework, their critique maps onto the **Causal Completeness** constraint.

  *   **Your Position (likely):** Prioritizes *Stratigraphic Sharpness* and *Global Synchrony*. You need a definition that works for a geologist in 10 million years looking at a core sample. For them, culture is invisible; only the physical trace matters.
  *   **Roommate's Position:** Prioritizes *Causal Completeness*. They argue that a definition of the "Age of Humans" that ignores 90% of human history (pre-1950) is scientifically accurate but historically false.

  **The Resolution:**
  The "Jointly Unsatisfiable" analysis proves that **both of you are right about the trade-off.**
  *   If the goal is **Stratigraphic Utility** (mapping rocks), the 1950s date is the only one that satisfies the Non-Negotiables.
  *   If the goal is **Historical Truth** (understanding human impact), the 1950s date is a reductionist fiction.

  The Anthropocene cannot be *both* a formal geological unit (which demands a line) *and* a comprehensive historical narrative (which demands a process). It is either a useful tool for geologists or a useful concept for historians, but the criteria for each are mutually exclusive regarding the start date.

  **Summary for your debate:**
  Tell your roommate: "You are correct that a strict stratigraphic boundary erases the nuance of early human impact. However, that erasure is not a bug; it is a feature of the *geological* definition. We are facing a trilemma: we can have a precise date, a global signal, or a complete causal history, but not all three. If we prioritize the history, we lose the geology. If we prioritize the geology, we lose the history. The debate isn't about which is 'true,' but which utility we value more."
