      *   *Decision:* I will argue that the film **falsifies** the common prior assumption as a descriptive model of real-world deliberation. The convergence happens not because they are Bayesian machines updating on shared data, but because Juror 8 forces a *shift in the epistemic framework* (the prior/threshold) itself. The film is about changing *how* they judge, not just *what* they judge.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** State the thesis clearly. The film demonstrates the failure of the common prior assumption. The convergence is not Bayesian updating but a normative shift in epistemic standards.
