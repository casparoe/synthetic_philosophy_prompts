          3.  The Commitment (Funding Split).
          4.  The Falsification Condition (Mind-changer).
      *   *Self-Correction on Q4:* The user asked about norms governing future animals. This is actually very important for *long-term* WAS, but for a 5-year spend-down, it's less urgent than stopping current suffering. I will argue to cut it as a primary focus, folding it into Q2.
      *   *Self-Correction on Q1:* I need to be careful not to dismiss Q1 entirely. It's the *motivation*. But as a funding target for a 5-year fund, it's risky. I will frame it as "background research" rather than a primary grant bucket.
