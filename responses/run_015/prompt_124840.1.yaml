      *   *Why not Q1?* Because it's a "black hole" for funding with low probability of resolution in 5 years. Better to fund specific welfare metrics (part of Q3) than abstract net welfare calculations.
      *   *Split:* 70% Empirical (Q3), 30% Conceptual (Q2). Why? Because without empirical data, the conceptual work is ungrounded. But without conceptual work, the empirical work has no defense.
      *   *Mind-Changing Result:* A pilot intervention that *clearly* reduces suffering without ecological collapse. This proves feasibility (the biggest bottleneck).

  8.  **Drafting the Response (Iterative refinement for tone and structure):**
