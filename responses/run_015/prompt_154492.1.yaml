answer: |-
  Subject: Re: The composition-drift hypothesis

  Thanks for writing this out so clearly. It is a sophisticated take on the multipolar trap, and I can see why it has traction in your group chat because it absolves individuals of moral failure while still explaining the grim outcome. You are asking for the case against it, specifically looking for arguments that range from fatal to merely awkward, and you want to know where the line is between a genuine defeater and a misreading. You also want to know if the theory is falsifiable and what it predicts that rivals do not. I will walk through these points in order of severity, starting with the objections that threaten the core mechanism and moving toward those that just complicate the picture.

  The most fatal objection to your view is the one you already identified regarding fixed membership settings where no selection occurs. Your theory hinges on differential survival and expansion as the engine of the slide. If you observe a race to the bottom in a closed system where the actors cannot exit, cannot be replaced, and cannot grow relative to one another based on their defection rate, then the mechanism you propose is absent. If the slide happens anyway, your mechanism is insufficient. A committed defender of your view might try to argue that even in a fixed group, there is internal selection, such as CEOs being replaced by boards for being too safe, but that is a different mechanism than the population-level drift you described. If you find a stable group of actors who all gradually lower their standards over time without any turnover or competitive pressure eliminating the cautious ones, that is a genuine defeater. It suggests the driver is internal preference shift or a coordination failure, not composition drift. You should concede this point because if the effect exists without the cause, the cause is not necessary. This is not a misreading; it is a direct test of the causal claim.

  Slightly less fatal but still highly damaging is the observation of normative stabilization without external enforcement. You mentioned taboos that hold without a hegemon, such as professional norms around certain weapons or biological research standards. If a group of competitors faces a strong incentive to defect but collectively refrains due to an internalized norm, this challenges the claim that values do not matter. Your theory predicts that any actor who holds the norm will be outcompeted by one who does not, leading to the extinction of the norm-holders. If the norm-holders survive and the slide stops, then either the payoff structure was not actually competitive in the way you thought, or individual values are robust enough to resist selection pressure. A defender of your view might dismiss cases where there was hidden enforcement, like reputational damage acting as a surrogate penalty, but if you can point to cases where defection was profitable and undetectable yet still didn't happen, that is a strong counterexample. The chemical weapons taboo is often cited here, though it is messy because of treaties. A cleaner case might be certain norms in high-reliability organizations like air traffic control or nuclear operations where safety cultures persist despite cost pressures. If these cultures persist without eliminating the firms that hold them, your theory has to account for why selection pressure didn't weed them out. If it cannot, the claim that values are irrelevant is weakened.

  Moving to a meta-critical level, there is the question of falsifiability, which you rightly worried about. This is potentially fatal if not addressed. If every instance of safety improvement is explained away as a temporary pause or a local exception before the inevitable drift resumes, and every instance of degradation is cited as confirmation, the theory becomes unfalsifiable. A scientific claim must specify conditions under which it would be proven wrong. For your view to be robust, you need to define what a counterexample looks like beyond just the absence of a race to the bottom. For instance, if regulation changes the payoff structure such that safety becomes profitable, your theory should predict the drift stops. If the drift continues despite safety becoming the dominant strategy for survival, then something else is driving it. A committed defender might argue that payoffs are never truly changed, only perceived, but that risks becoming a just-so story. You should concede that if the theory explains every outcome equally well, it explains nothing. The distinction here is between a framework that guides inquiry and one that rationalizes any result. If you cannot imagine a world where your theory is false, it is not doing work.

  Regarding the predictive differences between your view and the rivals, there are specific observations that should move you. The preference-based rival predicts that changing the people changes the outcome. If you replace the leadership of a lab with people who have demonstrably different values and the behavior of the lab changes accordingly, that supports the preference view. Your view predicts that replacing the people will not matter if the selection pressure remains the same; the new people will either defect or be replaced. The coordination-based rival predicts that if you provide a focal point or a Schelling point, the actors will coordinate to stop the slide without changing the payoff structure. Your view predicts that coordination will fail because the incentive to defect remains even if everyone agrees not to. So, if you see a group successfully coordinate on a safety standard without external enforcement and without anyone gaining a competitive advantage by cheating, that supports the coordination view over yours. However, if they coordinate and then slowly drift away as new market entrants ignore the standard, that supports your view. The key difference is stability over time. Coordination solutions should be stable if the agreement holds. Composition drift solutions should be unstable unless the population composition is locked.

  There are also arguments that are merely awkward for your view rather than fatal. One is the principal-agent problem. Often, the race to the bottom is not between companies but within them, where employees cut corners to meet metrics set by bosses who want safety but cannot monitor effectively. This looks like a race to the bottom but is actually a governance failure. Your view can absorb this by treating the firm as the unit of selection, but it complicates the story because it suggests the fix is internal monitoring rather than external structural change. Another awkward point is that selection pressure is often slow. If races to the bottom happen faster than the turnover rate of companies or leaders, then selection cannot be the primary driver. If a company decides to cut safety standards today to hit a quarterly target, that is not evolutionary selection; that is immediate incentive response. Your theory works best over long time horizons. If the phenomena you are explaining happen on short time scales, the mechanism does not fit. A defender would concede this limits the scope of the theory to long-term trends rather than immediate decisions.

  Finally, on the question of whether your position is capable of being wrong, I think you have built a framework that is resilient but not immune. It becomes immune only if you define selection pressure so broadly that it includes psychological pressure or internal norms, at which point it loses its distinctiveness. To keep it honest, you must tie selection to material consequences like market share, funding, or survival. If you do that, then cases where actors survive despite material disadvantages due to safety commitments are counterexamples. Cases where fixed groups degrade without turnover are counterexamples. Cases where coordination holds indefinitely without enforcement are counterexamples. If you treat these as anomalies rather than evidence against the theory, you are protecting the view at the cost of its truth. The value of your view is that it shifts focus from moralizing individuals to designing systems. Even if it is not the whole story, it is a crucial part of it. But you must accept that if the system design changes and the behavior does not, or if the system stays the same and behavior improves without selection changes, then the theory has failed.

  I hope this helps clarify the weaknesses and boundaries of the argument. It is a powerful lens, but like any lens, it distorts if you look at things too close or too far. The fixed membership and normative stabilization points are the ones I would bet on to move the needle in your debate, while the falsifiability issue is the one you need to guard against in your own thinking. Let me know if you want to dig deeper into any of these specific cases.
