answer: |-
  # Material-Constitution Identity Protocol (MCIP)
  **Version:** 1.0 (Compliance Office)  
  **Time Allocation:** 30 Minutes per Proposal  
  **Purpose:** To determine whether a restored artifact retains numerical identity with the original work for insurance, labeling, and legal documentation.  
  **Philosophical Basis:** Distinguishes the *Artwork* (intentional object defined by form, function, and history) from the *Substrate* (material constitution). Identity is primarily tracked through the Artwork, provided specific continuity conditions are met.

  ---

  ## Phase 1: Empirical Assessment (The Substrate)
  *Goal: Establish the baseline material continuity.*

  **Q1: What percentage of the original material substrate remains in the object?**
  *   **Sufficient Answer:** A quantified estimate based on conservation analysis (e.g., "70% original clay," "0% original bronze").
  *   **Decision Logic:**
      *   If **>50%**: Proceed to **Phase 2**. (Presumption of Identity).
      *   If **>0% but <50%**: Proceed to **Phase 2**. (Heightened Scrutiny).
      *   If **0% (Total Replacement)**: **STOP.** Do not mark as "Lost" yet. Proceed immediately to **Phase 4 (The Constitution Override)**.

  **[VALUE JUDGMENT FLAG]:** *The 50% threshold is a policy convention, not a metaphysical truth. It prioritizes material bulk over artistic intent. Staff must note if the removed material was structurally or aesthetically critical (e.g., the face of a portrait) regardless of percentage.*

  ---

  ## Phase 2: Intentional Assessment (The Artwork)
  *Goal: Establish the continuity of form, function, and perception.*

  **Q2: Is the replacement material perceptually distinguishable from the original under standard exhibition conditions?**
  *   **Sufficient Answer:** Yes/No based on visual inspection at 1 meter distance under 300 lux lighting.
  *   **Decision Logic:**
      *   If **No** (Indistinguishable): Proceed to **Q3**.
      *   If **Yes** (Distinguishable): **STOP: IDENTITY LOST.** The object is now a *Composite/Restored Fragment*. It cannot be labeled as the unmodified original work.

  **Q3: Does the object retain its original artistic function and historical narrative?**
  *   **Sufficient Answer:** Yes/No. (e.g., "Still functions as a vessel," "Still depicts the same historical event").
  *   **Decision Logic:**
      *   If **Yes**: Proceed to **Q3b**.
      *   If **No**: **STOP: IDENTITY LOST.** The object is now a *Repurposed Artifact*.

  **Q3b: Is the causal chain of the object's modification continuous and documented?**
  *   **Sufficient Answer:** Yes/No. (e.g., "Restoration performed in-house," "Object never left custody").
  *   **Decision Logic:**
      *   If **Yes**: **VERDICT: SAME WORK.** (Proceed to Documentation).
      *   If **No** (Chain Broken): Proceed to **Phase 4**.

  ---

  ## Phase 3: The Constitution Override (The Hard Case)
  *Goal: Adjudicate cases where Substrate Persistence fails but Artwork Persistence may survive.*
  *Applies only if Q1 = 0% OR Q3b = No.*

  **Q4: Was the total replacement or causal break executed to preserve the specific intentional form using original formative agents (e.g., molds, designs) under institutional custody?**
  *   **Sufficient Answer:** Yes/No.
      *   *Yes Criteria:* Original molds used OR Original design specs followed exactly + Object remained in museum custody + Intent was preservation, not creation of a copy.
      *   *No Criteria:* New molds created + Object left custody + Intent was commercial reproduction.
  *   **Decision Logic:**
      *   If **Yes**: **VERDICT: SAME WORK (ARTWORK IDENTITY PRESERVED).**
          *   *Note:* This verdict asserts that the *Artwork* survives the destruction of the *Substrate*.
      *   If **No**: **STOP: IDENTITY LOST.** The object is a *Replica*.

  **[VALUE JUDGMENT FLAG]:** *A "Yes" here prioritizes the "Statue" over the "Clay." This conflicts with strict materialist insurance models. Staff must flag this verdict for Senior Review if insurance valuation relies on material age.*

  ---

  ## Application of Protocol to Current Proposals

  ### Case 1: Ceramic Vessel (1700s)
  *   **Proposal:** 30% of original clay replaced with chemically identical new clay.
  *   **Execution:**
      *   **Q1:** 70% original material remains. (>50%). **Pass.**
      *   **Q2:** Chemically identical; indistinguishable to viewer. **Pass.**
      *   **Q3:** Function (vessel) and history preserved. **Pass.**
      *   **Q3b:** Restoration performed in-house. **Pass.**
  *   **MCIP Output:** **SAME WORK.**
  *   **Notes:** Standard restoration. No metaphysical tension.

  ### Case 2: Bronze Equestrian Monument (Recast)
  *   **Proposal:** Original bronze melted due to structural failure; recast into identical form using original molds.
  *   **Execution:**
      *   **Q1:** 0% original material remains. (**STOP** on Material Continuity).
      *   **Route:** Proceed to **Phase 4 (Constitution Override)**.
      *   **Q4:** Were original molds used under institutional custody to preserve the form? **Yes.**
  *   **MCIP Output:** **SAME WORK (ARTWORK IDENTITY PRESERVED).**
  *   **Conflict Note:** This output conflicts with the intuition that melting the bronze destroys the monument. However, under the *Material Constitution* framework adopted by this protocol, the *Artwork* (the form/intention) persists because the causal agency (the molds) and institutional custody remained unbroken, even if the *Substrate* (the bronze atoms) was destroyed.
  *   **Action:** Label as original work for exhibition. Flag for Insurance as "Material Reset" (value may adjust based on material age policies).

  ### Case 3: Marble Relief (Synthetic Composite)
  *   **Proposal:** 5% of stone replaced with modern synthetic composite altering reflectivity.
  *   **Execution:**
      *   **Q1:** 95% original material remains. (>50%). **Pass.**
      *   **Q2:** Replacement alters surface reflectivity in a viewer-noticeable way. **FAIL.**
  *   **MCIP Output:** **STOP: IDENTITY LOST (COMPOSITE/RESTORED FRAGMENT).**
  *   **Notes:** Despite high material retention, the perceptual integrity (Form) is breached. The artwork is no longer visually continuous with the original intention.
  *   **Action:** Label must indicate restoration. Insurance valuation must deduct for loss of aesthetic integrity.

  ---

  ## Limitations and Referrals

  **1. What This Procedure Cannot Settle**
  *   **Numerical vs. Qualitative Identity:** The protocol treats "Same Work" as a functional category. It suppresses the deep metaphysical distinction between being the *very same object* (numerical) versus being an *indistinguishable copy* (qualitative). In the Bronze Case (Case 2), the protocol declares it the "Same Work," but metaphysically, it may only be qualitatively identical. The procedure forces a binary choice for administrative ease, masking this ambiguity.
  *   **Value vs. Identity:** The procedure determines *identity*, not *value*. An object can be the "Same Work" (Case 2) but have significantly reduced market/insurance value due to material loss. Staff must not conflate Identity Verdicts with Valuation Verdicts.
  *   **The "Ship of Theseus" Accumulation:** This procedure assesses single interventions. It does not track identity erosion over centuries of micro-restorations. An object may pass this protocol today but have been effectively replaced over 200 years.

  **2. Suppressed Metaphysical Distinctions**
  *   **Substrate vs. Artwork:** While the protocol distinguishes these in logic, the final verdict ("Same Work") collapses them. This is necessary for labeling but philosophically imprecise.
  *   **Causal Continuity:** The protocol treats "Original Molds" as sufficient causal continuity. Some metaphysical frameworks require continuity of the *matter* itself. This preference for *Form* over *Matter* is a curatorial bias hardcoded into Phase 4.

  **3. Mandatory Referrals to Senior Officer**
  *   **Phase 4 "Yes" Verdicts:** Any case triggering the Constitution Override (Total Replacement) must be reviewed by the Senior Officer. This overrides standard insurance assumptions and carries legal risk.
  *   **Perceptual Disagreements:** If Q2 (Distinguishability) is disputed between conservation and curatorial staff, the Senior Officer must adjudicate the "Viewer-Noticeable" threshold.
  *   **High-Value Items:** Any artifact with an insured value exceeding $5M requires Senior Officer sign-off regardless of MCIP output, as the financial risk of metaphysical error is too high.

  **4. Final Authority**
  *   The MCIP is a decision *support* tool. The Senior Conservation Compliance Officer retains final authority to override the protocol if external legal statutes (e.g., specific heritage laws defining "original" by material age) contradict the metaphysical framework used here.
