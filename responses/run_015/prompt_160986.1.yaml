answer: |-
  This is an exceptionally clear map of the terrain. You have effectively reconstructed the dialectic that moved the field from Aristotle (synchronic conflict) to Davidson (all-things-considered judgments) to Frankfurt (identification/caring) and finally to the temporal dynamics of hyperbolic discounting. Your intuition that synchronic clash is unnecessary (the Late-night Discounter) is widely shared in contemporary literature (e.g., Holton's *Willpower*), but your handling of the *attitude* toward the violation (Nightgate (b) vs. (c)) is where your view becomes distinctive.

  Here is the test of your tentative principle, the breakdown, the repair, and the application to your new cases.

  ### 1. Testing Your Tentative Principle
  *Principle: An agent is weak-willed w.r.t. $\phi$-ing when she $\phi$s against the verdict about $\phi$-ing that she would give, or has already given, under conditions she herself counts as clear-headed, and the explanation of why she $\phi$s anyway is the pull of the very prospect that verdict rules out.*

  **Where it succeeds:**
  *   **Paradigm, Hating Addict, Late-night Discounter, Dieter:** All fit. In each, there is a "clear-headed" verdict (sober, 9pm, general diet plan) that is violated due to the "pull" of the prospect (drink, drug, episode, slice).
  *   **Willing Addict:** Correctly excluded. She endorses the action under clear-headed conditions.
  *   **The Pill:** Correctly excluded. No verdict is violated.

  **Where it breaks:**
  *   **Autopilot Fridge:** Your principle likely classifies this as **Weak-willed**, but you verdict **Not Weak-willed**.
      *   *Why:* She has a standing clear-headed verdict ("don't snack"). She snacks. The pull of leftovers explains it.
      *   *The Fix:* You need an **Agency Condition**. Weakness of will is a failure of *governance*, not just a mismatch of behavior and belief. Mindless action lacks the intentional structure required for *akrasia*. It is mere habit or lapse, not weakness.
  *   **Nightgate (c):** Your principle likely classifies this as **Weak-willed**, but you verdict **Not Weak-willed**.
      *   *Why:* She has a clear-headed verdict ("don't use phone"). She pays to use it. The pull of the phone explains it.
      *   *The Fix:* You need an **Identification Condition**. In (c), she has *revised* her policy to include the fee as an acceptable cost. She does not disavow the action. In (b), she disavows it ("wishes she hadn't"). Your principle focuses on the *verdict about the action*, but WW seems to require a *verdict about the failure*.

  ### 2. The Repaired Principle
  To keep your verdicts on the Discounter/Addict pair and the Nightgate (b)/(c) pair, we must shift the locus of weakness from the *moment of action* to the *structure of self-governance over time*.

  **The Disavowed Distortion Principle:**
  > An agent is weak-willed with respect to $\phi$-ing if and only if:
  > 1.  **Agency:** She $\phi$s intentionally (ruling out Autopilot).
  > 2.  **Authority:** She $\phi$s against a policy or verdict she regards (or would upon cool reflection) as **authoritative** for her conduct.
  > 3.  **Etiology:** The explanation for $\phi$-ing is the visceral pull of the prospect excluded by that policy.
  > 4.  **Disavowal:** She does not stably **identify** with the motivation for $\phi$-ing across her reflective standpoint (either antecedently or subsequently).

  **How this repairs the breaks:**
  *   **Autopilot:** Fails Condition 1 (Intentionality).
  *   **Nightgate (b) vs. (c):**
      *   In (b), she pays (violates policy), driven by pull (Condition 3), and *wishes she hadn't* (Condition 4: Disavowal). **Verdict: WW.**
      *   In (c), she pays. Does she violate an authoritative policy? Her policy has shifted to "No phone *unless* I pay $40." She identifies with this cost ("would do it again"). She fails Condition 4 (No Disavowal). **Verdict: Not WW.**
  *   **Discounter vs. Willing Addict:**
      *   **Discounter:** At 1am, she violates the 9pm policy. Is the 9pm policy "authoritative"? Yes, because upon reflection (8am), she endorses the 9pm self over the 1am self. She disavows the 1am motivation. **Verdict: WW.**
      *   **Willing Addict:** She violates long-term welfare, but she *identifies* with the desire. She does not disavow the motivation upon reflection. **Verdict: Not WW.**

  ### 3. The Cost: What You Might Have to Sacrifice
  You asked to be explicit about which verdicts cannot be kept. The good news is that the **Disavowed Distortion Principle** preserves your core intuitions on the Discounter/Addict and Nightgate pairs *if* we accept one nuance:

  **The Sacrifice:** You must concede that **Weakness of Will is not purely objective; it is partly constitutive.**
  In Nightgate (c), the agent *makes* herself not weak-willed by accepting the fee. If she stopped complaining and accepted the cost, she ceases to be weak-willed, even if the behavior (paying) is identical to (b). This means weakness of will is not just about the *causal history* of the action, but about the agent's *current stance* toward that history.
  *   *Risk:* This makes WW vulnerable to self-deception. If the Nightgate (b) agent lies to herself and says "I don't mind paying," does she instantly become non-weak-willed?
  *   *Defense:* Your principle handles this via "reflective standpoint." Genuine identification requires stability. A lie to oneself usually fractures under reflection (Condition 4).

  **The Pre-endorsed Lapse (Your Undecided Case):**
  *   *Prediction:* **Not Weak-willed.**
  *   *Reasoning:* On Monday, she sets a plan: "Lapse on Friday." On Friday, she thinks "I shouldn't" (local verdict) but follows the Monday plan.
  *   *Analysis:* Does she disavow the motivation? No, she is executing a prior intention. The "pull of the prospect" is not the *explanation*; the *explanation* is fidelity to the Monday plan. Even if the Monday plan was a mistake, following a prior plan is a form of *strength* (resoluteness), even if the plan is bad. To call this WW is to confuse *bad planning* with *weakness of will*.
  *   *Verdict:* If you want to call this WW, you must sacrifice the "Etiology" condition. But I advise you call this **Rashness** or **Poor Planning**, not Akrasia.

  ### 4. Application to New Cases

  **Case 1: The Hiring Committee**
  *   *Scenario:* Votes to use a rubric, quietly abandons it for a star candidate.
  *   *Analysis:*
      *   **Agency:** Yes (collective intentional action).
      *   **Authority:** They established the rubric as authoritative ("votes to score... with a rubric").
      *   **Etiology:** The "star" quality is the pull of the prospect excluded by the rubric (which presumably scores on criteria the star lacks).
      *   **Disavowal:** "Quietly abandons" implies they know they shouldn't. They do not publicly endorse the violation. They likely feel the tension between "hiring the best" and "following rules."
  *   *Prediction:* **Weak-willed.** (Specifically, collective akrasia). They are acting against their own procedural verdict due to the allure of the exception.

  **Case 2: The Wandering Student**
  *   *Scenario:* Judges she should pay attention; mind wanders anyway.
  *   *Analysis:*
      *   **Agency:** **No.** Mind-wandering is typically passive. She does not *intentionally* think about lunch; her attention drifts.
      *   **Authority:** She has a verdict (pay attention).
      *   **Etiology:** Distraction, not necessarily the "pull of a prospect" she is pursuing.
  *   *Prediction:* **Not Weak-willed.** This is a failure of *capacity* or *focus*, not will. It aligns with your Autopilot Fridge case. If she *deliberately* started texting, that would be WW. If her mind just drifted, it is not.

  **Case 3: The Therapist's Patient**
  *   *Scenario:* Therapist says "stop over-controlling." She eats the second slice; part of her flinches.
  *   *Analysis:*
      *   **Agency:** Yes.
      *   **Authority:** This is the crux. What is her authoritative verdict?
          *   If she judges "I should eat this to heal my relationship with food," then she is following her verdict. **Not WW.** (Parallel to Willing Addict).
          *   If she judges "I shouldn't eat this, but I'm doing it to rebel against the therapist/old rules," then she is acting against her health verdict.
      *   **Disavowal:** "Part of her still flinches." This suggests the old verdict (don't eat) is still present. But is it *authoritative*? If she accepts the therapist's advice, the old verdict is *rejected*.
  *   *Prediction:* **Not Weak-willed.** The flinch is a phantom limb of her old psychology. If she endorses the therapist's advice as her new clear-headed verdict, eating the slice is an act of *compliance* with her new authority, despite the residual emotional flinch. To call this WW would be to pathologize recovery.

  ### Summary of the Repair
  Your intuition was correct to move away from synchronic clash. The Late-night Discounter is weak-willed because her 9pm self is *authoritative* over her 1am self, and she disavows the 1am motivation at 8am. The Willing Addict is not weak-willed because she owns her desire. Nightgate (c) is not weak-willed because she has integrated the cost into her policy; Nightgate (b) is weak-willed because she experiences the cost as a failure.

  The **Disavowed Distortion Principle** saves your pairs by adding **Intentionality** (kills Autopilot) and **Reflective Disavowal** (kills Nightgate (c) and Willing Addict). It forces you to classify the Pre-endorsed Lapse as **Resolute (but mistaken)** rather than weak-willed, which is a philosophically defensible trade-off.
