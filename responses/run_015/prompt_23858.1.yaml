      *Revised Plan:* Emphasize that (1), (2), and (3) form a "Diachronic/Plan-Based" cluster, while (4) is an "Atemporal/Slice-Based" outlier. The clash isn't just (3) vs (4), it's (1+3) vs (4).

  8.  **Final Polish:** Ensure the distinction between "Parity" and "Indifference" is clear regarding transitivity. Parity doesn't necessarily break transitivity if defined as a distinct relation, but it complicates the representation theorem. I'll flag it as a "friction point" rather than a contradiction.

