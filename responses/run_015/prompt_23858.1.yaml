      *   *Refining the (1) vs (2) point:* Need to be careful. Parity *can* lead to cycles if not handled right (Chang's view vs. standard weak order). If the user defines irrationality *as* vulnerability to money pumps, they need to ensure Parity doesn't create that vulnerability. This is a "watch out" rather than a "fatal flaw."
