  I hold that the origin is the specific material gametes that united to form the zygote, not merely the genetic information they carried. I concede that the precise individuation of gametes may be vague at the margins, but S and S* are stipulated as numerically distinct cells, and that difference is metaphysically decisive. Consequently, Anna* is not Anna, because Anna* owes her existence to a different causal history involving a different cell. Qualitative indistinguishability does not secure numerical identity; otherwise, you would be identical to your monozygotic twin, which is absurd. The cytoplasmic case is similar: the zygote is a unified material entity, not just a vessel for nuclei, so transplanting pronuclei into a different cytoplasm creates a numerically distinct zygote, and thus a distinct organism.

  You ask what a zygote is for my purposes: it is the living cell formed by the fusion of those specific gametes, cytoplasm and all. Monozygotic twins do not share an organismal identity because the original zygote ceases to exist when it splits, giving rise to two new organisms with divergent developmental paths, whereas Anna and Anna* stem from wholly separate fertilization events. We may lack epistemic access to which sperm was which, but metaphysics concerns what makes them distinct, not how we tell them apart. Anna is not identical with Anna*, because Anna essentially originates from S, and Anna* essentially originates from S*, and no organism can have two different origins.

  If you deny that the specific material gametes matter, what non-arbitrary fact about the physical world grounds the difference between you and a perfect molecular duplicate created ex nihilo?
