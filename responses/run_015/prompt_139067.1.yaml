answer: |-
  1. If your hybrid view implies that descendants of victims of historical injustices cannot claim they were wronged because the injustices were necessary for their existence, you lose the ability to condemn paradigmatic moral atrocities. This outcome is a fatal extensional error because it severs the link between rectification and historical harm.
  2. The hybrid relies on a sharp moral switch triggered by metaphysical facts about identity that are often vague, making the permissibility of an act depend on obscure counterfactual biology rather than moral reasons. This renders the view vulnerable to the charge that it grounds significant moral differences in morally irrelevant metaphysical distinctions.
  3. The availability-relative threshold view is a genuine rival because it preserves the person-affecting intuition without requiring an impersonal switch, suggesting your hybrid is an unstable compromise. If that view succeeds, your impersonal limb becomes redundant, leaving you with the costs of both views without the unique benefits.
  4. Asserting that impermissibility remains while wronging disappears risks making moral obligations free-floating and unexplained, which undermines the explanatory power of person-affecting restrictions. While you may price this in, it leaves you unable to explain to the agent why the act is forbidden if no one is harmed.
  5. Allowing the switch to tolerate vagueness in identity forces you to accept moral indeterminacy in cases where intuitive verdicts are clear, which is merely awkward rather than fatal provided you adopt a supervaluationist framework. This is a technical cost you can manage, distinct from the substantive failure to condemn clear wrongs.
