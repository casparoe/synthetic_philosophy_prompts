answer: |-
  # OPERATIONAL PROCEDURE: DUAL-TRACK SANCTION REVIEW (DTSR)

  **Effective Date:** Immediate
  **Applicability:** All proposed sanctions, mandatory interventions, and custodial extensions.
  **Review Time Allocation:** 20 Minutes per File.
  **Reviewer Authority:** Ethics Board Member (Non-Clinical).

  ## PART 1: THE REVIEW CHECKLIST

  **INSTRUCTIONS:** Complete Section A and Section B in order. Do not skip steps. If a "Stop" command is triggered, do not proceed to the next section. Mark all "Value Judgment" nodes with your initials.

  ### SECTION A: AGENCY & CONTROL SCREEN (Track 1)
  *Purpose: To determine if the subject possessed the functional capacity to guide their conduct.*

  **Q1. Documented Impairment:** Is there clear file evidence of severe physiological or psychological compulsion at the time of the offense (e.g., documented addiction spiral, psychosis, coerced duress)?
  *   **YES:** Proceed to Q2.
  *   **NO:** Presume Full Agency. Skip to Section B.
  *   **UNCLEAR (No Clinical Data):** Presume Full Agency. **FLAG FOR VALUE JUDGMENT.** (Note: Without clinical staff, legal presumption of competence applies).

  **Q2. Mitigating Control:** If YES to Q1, did the subject take any verifiable steps to mitigate the impairment prior to the offense (e.g., sought treatment, surrendered weapons, removed self from situation)?
  *   **YES:** Treat as **Full Agency**. Skip to Section B.
  *   **NO:** Treat as **Reduced Agency**. Proceed to Section B with "Reduced" designation.

  **Q3. Deliberation:** Is there evidence of planning, concealment, or sustained effort to avoid detection?
  *   **YES:** Upgrade to **Full Agency** (overrides Q1 "YES" unless impairment was total blackout).
  *   **NO:** Maintain current designation.

  **SECTION A OUTCOME:** [ ] Full Agency [ ] Reduced Agency
  *(Sign/Date)*

  ---

  ### SECTION B: NECESSITY & JUSTIFICATION AUDIT (Track 2)
  *Purpose: To determine if the sanction is justified by future outcomes rather than past blame.*

  **Q4. Retributive Primary:** Does the proposal language emphasize "payback," "just deserts," "teaching a lesson," or "moral debt"?
  *   **YES:** **STOP. REJECT PROPOSAL.** (Return to Prosecutor/Parole Board for revision).
  *   **NO:** Proceed to Q5.

  **Q5. Outcome Linkage:** Does the sanction directly achieve one of the following three goals?
  1.  **Public Safety:** Physical incapacitation of verified imminent threat.
  2.  **Rehabilitation:** Active treatment with high probability of behavioral change.
  3.  **Restoration:** Direct repair of harm to victim/community.
  *   **NONE:** **STOP. REJECT PROPOSAL.**
  *   **AT LEAST ONE:** Proceed to Q6.

  **Q6. Least Burdensome Means:** Is there a less restrictive alternative available that achieves the *same* level of Q5 goal (e.g., monitoring instead of incarceration, community service instead of fines)?
  *   **YES (Less restrictive exists):** **STOP. REJECT PROPOSAL.** (Recommend alternative).
  *   **NO (This is the minimum):** Proceed to Q7.

  **Q7. The Clinical Constraint Check:** Does the justification for Q5 rely on predicting future dangerousness or rehabilitation potential *without* a current psychological evaluation?
  *   **YES:** **FLAG FOR VALUE JUDGMENT.** (Reviewer must decide if file evidence is sufficient to bypass clinical requirement).
  *   **NO:** Proceed to Approval.

  **SECTION B OUTCOME:** [ ] Approved [ ] Rejected [ ] Flagged for Full Board Vote
  *(Sign/Date)*

  ---

  ## PART 2: CONFLICT & LIMITATION ANALYSIS

  **1. The "Dangerous but Non-Rehabilitatable" Conflict**
  *   **The Conflict:** Track 1 may confirm an offender has Full Agency (they choose to be violent). Track 2 may reject prison because the offender refuses rehab (fails Goal 2) and victims are already restored (fails Goal 3). However, they remain dangerous (Goal 1).
  *   **The Procedure's Fix:** The procedure allows incapacitation (Goal 1) but requires strict proof of *necessity* (Q6).
  *   **What It Can't Resolve:** Without clinical staff (Constraint), the Board cannot scientifically verify "necessity" of a specific term length (e.g., 5 years vs. 1 year). The procedure forces a binary choice: Lock them up based on layperson risk assessment (legally risky) or release them based on lack of clinical proof (public safety risk).

  **2. The "Addiction vs. Responsibility" Conflict**
  *   **The Conflict:** Track 1 identifies addiction as Reduced Agency. Track 2 demands Rehabilitation. If the offender refuses treatment, Track 2 blocks punishment (no Retribution), but Track 1 suggests they couldn't help it.
  *   **What It Can't Resolve:** The procedure cannot mandate treatment on an unwilling subject without violating Track 2 (burdensome element without consent). It may result in releasing untreated addicts because coercion is classified as punitive.

  **3. The "Value Judgment" Nodes**
  *   **Where Humans Must Decide:**
      *   **Section A, Q1 (Unclear):** Deciding if a file implies compulsion without a diagnosis.
      *   **Section B, Q7 (Clinical Constraint):** Deciding if a file is "good enough" to predict danger without a psychologist.
      *   **Section B, Q6 (Least Burdensome):** Deciding if an alternative is truly "available" or just theoretical.

  ---

  ## PART 3: CASE APPLICATIONS

  ### CASE 1: Fraud / Gambling Addiction
  *Proposal: 6 Months Geofenced Monitoring + Mandatory CBT.*

  **Section A (Agency):**
  *   Q1 (Impairment): **YES** (Severe gambling-addiction spiral documented).
  *   Q2 (Mitigation): **NO** (Did not seek help prior).
  *   Q3 (Deliberation): **YES** (Fraud requires planning).
  *   *Outcome:* **Full Agency** (Planning overrides addiction spiral per Q3).

  **Section B (Justification):**
  *   Q4 (Retribution): **NO** (Focus is on therapy/monitoring).
  *   Q5 (Outcome): **YES** (Rehabilitation via CBT; Safety via Monitoring).
  *   Q6 (Least Burdensome): **NO** (Prison is more restrictive; fines don't address addiction).
  *   Q7 (Clinical): **NO** (CBT is standard intervention, risk low).
  *   *Outcome:* **APPROVED.**

  **Reviewer Note:** This passes easily. The sanction is forward-looking (CBT) and restrictive enough to ensure safety without being purely punitive.

  ---

  ### CASE 2: Violent Offender / Refusal of Rehab
  *Proposal: 5-Year Prison Term Extension.*
  *Profile: Refuses all programs, provokes staff, violent history.*

  **Section A (Agency):**
  *   Q1 (Impairment): **NO** (Provocation suggests control).
  *   Q3 (Deliberation): **YES** (Actively provoking staff is deliberate).
  *   *Outcome:* **Full Agency.**

  **Section B (Justification):**
  *   Q4 (Retribution): **UNCLEAR** (Extension often implies "payback" for bad behavior in prison).
  *   Q5 (Outcome):
      *   Rehab: **NO** (Refuses programs).
      *   Restoration: **NO** (No victim contact).
      *   Safety: **MAYBE** (Incapacitation).
  *   Q6 (Least Burdensome): **UNCLEAR.** Is 5 years necessary vs. 1 year? Is there a high-security halfway house option?
  *   Q7 (Clinical Constraint): **YES.** Justification relies on predicting future danger without current psych eval.

  **Decision Node:** **FLAG FOR VALUE JUDGMENT / REJECT.**
  *Reasoning:* Under Track 2, you cannot extend a sentence *primarily* because the offender is "unwilling" (that is retributive). You can only extend for Safety. Without a clinical psychologist (Constraint), the Board cannot certify that *five specific years* are the "Least Burdensome Means" to ensure safety. A 5-year extension based on layperson judgment of "bad attitude" fails the Skeptical Audit.

  **Outcome:** **REJECT PROPOSAL.** (Recommend immediate review by clinical panel or release to supervised parole with GPS).

  **Reviewer Note (The Ugly Answer):** This outcome is ethically consistent with the policy but practically dangerous. We are rejecting a 5-year containment of a violent individual because we lack the clinical data to prove *necessity* under the Skeptical Audit. We are prioritizing the offender's right against non-necessary burden over public certainty of safety. This is the "quarantine failure" inherent in the system when clinical resources are missing.

  ---

  ### CASE 3: Vandal / Restorative Labor
  *Proposal: 50 Hours Restorative Labor.*
  *Profile: Turned self in, paid full restitution.*

  **Section A (Agency):**
  *   Q1 (Impairment): **NO.**
  *   Q3 (Deliberation): **YES** (Vandalism is intentional).
  *   *Outcome:* **Full Agency.**

  **Section B (Justification):**
  *   Q4 (Retribution): **NO** (Labor is restorative).
  *   Q5 (Outcome): **YES** (Restoration of property/community).
  *   Q6 (Least Burdensome): **NO** (Fines already paid; prison is excessive).
  *   Q7 (Clinical): **NO.**
  *   *Outcome:* **APPROVED.**

  **Reviewer Note:** This is the ideal case for the Dual-Track. High agency meets restorative justice. No suffering is inflicted for its own sake; the burden is tied directly to repair.

  ---

  ## PART 4: SIGN-OFF CONSTRAINTS

  **Written Certification:**
  By signing below, I certify that I have applied the DTSR Checklist without external consultation. I acknowledge that in cases marked "Value Judgment," I am assuming personal liability for the ethical risk, specifically regarding the assessment of future danger without clinical data.

  **Reviewer Signature:** ___________________
  **Date:** ___________________
  **Decision:** [ ] Approve [ ] Reject [ ] Full Board Vote Required

  ***

  ### SUMMARY OF CONFLICTS FOR THE BOARD
  *   **The "Ugly" Reality:** In Case 2, this procedure forces you to choose between **Public Safety** (approve the extension based on gut feeling) and **Ethical Compliance** (reject the extension because you can't prove it's necessary without a psychologist). The policy dictates Ethical Compliance. If the offender re-offends after release, the liability rests on the Board's adherence to the "Necessity" rule over "Risk Management."
  *   **The Clinical Gap:** You are lawyers making medical/psychological determinations in Section A, Q1. The procedure tells you to default to "Full Agency" if unsure. This systematically biases the system toward punishment in ambiguous cases, which contradicts the spirit of the Skeptical Audit.
  *   **The Retribution Trap:** Any sanction that *feels* like punishment but is *labeled* as safety (e.g., solitary confinement for "staff safety") will pass this checklist unless the Board aggressively challenges Q6 (Least Burdensome). The tool is only as strong as the reviewer's willingness to challenge the "Necessity" claim.
