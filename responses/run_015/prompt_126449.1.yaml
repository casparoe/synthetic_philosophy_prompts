  PART ONE: THE LOGICAL SPACE

  The following instrument structures the decision space regarding the extension of welfare standards to farmed crustaceans. The tree originates from a single entry commitment which stipulates that moral considerability tracks the capacity for valenced experience, rendering species membership and ecological role irrelevant to moral status. From this entry node, the instrument branches on five diagnostic questions. Each question is phrased as a concrete claim regarding the stipulated cases or general moral principles, designed to be voteable by a certifier without requiring knowledge of the philosophical label associated with the resulting position. Each question admits a binary response of Affirmative or Negative.

  Question One concerns the selectively bred prawn, Species A. The claim is: In the case of Species A, the physiological evidence of analgesic efficacy is sufficient to establish moral status despite the loss of complex avoidance behaviors. An Affirmative response indicates that physiological markers outweigh behavioral deficits in determining sentience. A Negative response indicates that complex behavior is a necessary condition for moral status.

  Question Two concerns the gene-edited tilapia, Species B. The claim is: The case of Species B demonstrates that behavioral stress indicators are insufficient proxies for valenced experience in certification contexts. An Affirmative response indicates skepticism toward behavioral proxies when physiological assumptions contradict them. A Negative response indicates trust in behavioral proxies as reliable evidence of experience.

  Question Three concerns the electrical stunning apparatus. The claim is: The stunning apparatus is acceptable for crustaceans despite the forty percent failure rate and intact sentience during immobilization, provided the same technology is used for finfish. An Affirmative response indicates a preference for technological consistency and risk acceptance. A Negative response indicates a preference for species-specific welfare outcomes and risk aversion.

  Question Four concerns the aggregation of suffering. The claim is: The moral obligation to prevent suffering scales linearly with the number of individuals affected, such that preventing minor suffering in many outweighs preventing severe suffering in one. An Affirmative response indicates an aggregative utilitarian framework. A Negative response indicates a non-aggregative framework where individual intensity dominates.

  Question Five concerns the obligation to modify practices. The claim is: Attributing sentience to crustaceans mandates changing farming practices regardless of economic cost or feasibility. An Affirmative response indicates an absolute duty to alter practices upon status attribution. A Negative response indicates that economic or practical constraints may override welfare obligations.

  The combination of answers to these five questions creates a logical space of thirty-two distinct endpoints. Each endpoint represents a unique combination of stances on evidence, risk, aggregation, and obligation. The following section maps the defensible positions onto this space and diagnoses the empty cells.

  PART TWO: LOCATION OF POSITIONS AND DIAGNOSIS OF EMPTY CELLS

  The following list locates the required and supplementary positions within the logical space defined by the five questions. Each position is identified by a five-character code corresponding to the answers for Questions One through Five, where Y denotes Affirmative and N denotes Negative. Following the occupied positions, every unoccupied combination is listed with a diagnostic sentence explaining its absence.

