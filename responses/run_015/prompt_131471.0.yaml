answer: |-
  At a dinner party, a classical mathematician slides a perfect chocolate sphere across the table to a constructivist colleague.

  "Come on," the classical mathematician says. "Stop complaining about the Axiom of Choice for once. Use Banach-Tarski. Cut this into finitely many pieces, move them around, and serve us two spheres instead of one."

  The constructivist doesn't touch the knife. "I can't."

  "Why not? The theorem says it's possible."

  "The theorem says the pieces *exist*," the constructivist corrects. "But the decomposition relies on a choice function to define the cuts. The Axiom guarantees such a function exists, but it refuses to tell me what it is."

  "So wing it," says the classical mathematician.

  "No," says the constructivist, pulling the dessert back. "The Axiom says I *can* choose, but it won't tell me *what* I chose. Without an explicit rule, I don't know where to put the knife. Existence isn't edible."
