  The best reply argues that the expected-value calculation is run entirely from the agent's current credences and utilities, ranking candidate updating plans from the outside without presupposing any of them. This reply ultimately fails because the prior's calculation that "looking is valuable" is only accurate if the agent actually intends to execute the conditionalizing plan upon receiving evidence. If the agent does not already intend to conditionalize, the prior's prediction of future utility is factually incorrect regarding the agent's future behavior, meaning the theorem cannot generate the intention to conditionalize in an agent who lacks it; it can only confirm the prudence of looking for those already committed to updating by Bayes' Rule.
