answer: |-
  **Scenario**
  Alex learns a corporate auditor ("The Pursuer") files a location guess before moving to intercept him tomorrow. Alex must Stay in Chicago or Flee to Denver. Staying leaves a dense digital footprint at home; Fleeing leaves a booking trail but disperses among many possible destinations. Consequently, the Pursuer's file names Chicago given Stay with probability 0.95, but names Denver given Flee with only 0.60. The unconditional base rate for a Chicago file is 0.90, reflecting general population stability. Before choosing, Alex receives a text from a bribed clerk (reliability 0.80) stating: "File says Denver." The channel is independent of Alex's act conditional on the file content. Utilities: Caught = 0; Safe Stay = 100; Safe Flee = 80 (cost of non-refundable travel).

  **Decision Table**

  | Parameter | Value | Story |
  | :--- | :--- | :--- |
  | **P(File=Chi \| Stay)** | 0.95 | High footprint at home. |
  | **P(File=Den \| Flee)** | 0.60 | Noise in travel trail. |
  | **P(File=Chi)** | 0.90 | Base rate of stability. |
  | **P(Report=Den \| File=Den)** | 0.80 | Clerk reliability. |
  | **U(Caught)** | 0 | Capture. |
  | **U(Safe Stay)** | 100 | Normal life. |
  | **U(Safe Flee)** | 80 | Safe minus travel cost. |

  **Calculations**
  *No Gate (Prior)*
  *   **CDT:** Uses unconditional state credence P(Chi)=0.90.
      *   U(Stay) = 0.10 × 100 = 10.
      *   U(Flee) = 0.90 × 80 = 72. **Verdict: Flee.**
  *   **EDT:** Uses act-conditional state credence.
      *   U(Stay) = P(Den|Stay) × 100 = 0.05 × 100 = 5.
      *   U(Flee) = P(Chi|Flee) × 80 = 0.40 × 80 = 32. **Verdict: Flee.**

  *With Gate (Report = "Denver")*
  *   **CDT:** Updates state credence via Bayes, holds act counterfactually fixed.
      *   P(Chi | Rep=Den) ≈ 0.68. P(Den | Rep=Den) ≈ 0.32.
      *   U(Stay) = 0.32 × 100 = 32.
      *   U(Flee) = 0.68 × 80 = 54.4. **Verdict: Flee** (Margin 22.4%).
  *   **EDT:** Updates state credence conditional on act *and* report.
      *   **If Flee:** Act supports File=Den. P(Den | Flee, Rep=Den) ≈ 0.86.
          *   U(Flee) = 0.14 × 80 = 11.2.
      *   **If Stay:** Act supports File=Chi. P(Chi | Stay, Rep=Den) ≈ 0.83.
          *   U(Stay) = 0.17 × 100 = 17.0. **Verdict: Stay** (Margin 5.8%).

  **Analysis**
  *Load-bearing Feature:* The asymmetry in detection rates (0.95 vs 0.60) combined with a skewed base rate. This allows the Report to sway CDT's state credence insufficiently to override the base rate, while EDT treats the Act as reinforcing the Report for Fleeing but conflicting for Staying.

  *Ablations:*
  1.  **Equal Hit Rates:** If P(Chi|Stay) = P(Den|Flee) = 0.90, EDT calculates identical risk for both acts given the Report. Both theories prescribe Fleeing (due to base rate). Disagreement vanishes.
  2.  **Perfect Gate:** If Reliability = 1.0, Report=Den implies File=Den with certainty. Both theories agree Stay is safe (100) and Flee is death (0). Disagreement vanishes.

  *Sensitivity:*
  *   **CDT:** Most sensitive to Base Rate P(File=Chi). If this drops below 0.55, CDT flips to Stay (believing Denver is likely).
  *   **EDT:** Most sensitive to P(File=Den | Flee). If this drops below 0.55, the correlation weakens, and EDT flips to Flee.

  *Best EDT Attack:* An evidential theorist may argue the verdict is unstable: knowing EDT prescribes Stay makes Stay evidence for File=Chi, but if the agent knows they will ultimately Flee (due to CDT dominance or weakness of will), they should condition on Fleeing, restoring the high death probability. This case tests the disagreement better than the infallible-forecast original because it demonstrates divergence arises from ordinary informational asymmetries and partial disclosure, not logical paradoxes or prophecy.
