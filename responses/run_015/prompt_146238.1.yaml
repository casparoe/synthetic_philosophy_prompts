answer: |-
  Here are three distinctions to straighten your notes.

  **1. Inference vs. Ontology**
  Paraconsistency is a logical thesis: the inference from a contradiction to an arbitrary conclusion (Explosion) is invalid. Dialetheism is a metaphysical thesis: some contradictions are true. Dialetheism is the deeper commitment. It entails paraconsistency (otherwise truth explodes), but paraconsistency does not entail dialetheism. You can hold the second without the first. This is the "damage-control" view: contradictions are never true, but logic shouldn't detonate if our data becomes inconsistent. You disagree with the dialetheist on ontology, not inference. They believe reality tolerates contradictions; you believe our *theories* sometimes do, erroneously.

  **2. Explosion vs. Non-Contradiction**
  The popular line that paraconsistent logic rejects the Law of Non-Contradiction (LNC) is a howler. Paraconsistency is defined solely by rejecting Explosion. While some dialetheic systems invalidate LNC, many paraconsistent logics retain it as a theorem. They deny that a violation of LNC entails triviality, not that LNC holds. Printing that they reject LNC is technically false; they reject the *consequences* of violating it.

  **3. Information vs. Reality**
  Your interviewee's distinction holds up. "Damage-control" is instrumental: logic manages messy information (legal codes, scientific crises) without ontological commitment. "Endorsement" is revisionary metaphysics: logic reflects contradictory reality. They pull in different directions. The instrumentalist aims to resolve inconsistencies; the dialetheist accepts them as final. Regarding the candidates (liars, sorites, sets): a dialetheist must unify these as true contradictions; an instrumentalist treats them as distinct modeling challenges.

  Does damage-control collapse into endorsement? No. The models of paraconsistent logic need not represent "ways the world could be" (possible worlds), but "ways information can be held" (information states). An inconsistent model represents an inconsistent theory, not an impossible world. You can model inconsistency without believing contradictions are true. The dialetheist owes examples; the instrumentalist owes utility. They are stable, distinct positions. The instrumentalist treats inconsistency as a bug to be managed; the dialetheist treats it as a feature to be acknowledged.
