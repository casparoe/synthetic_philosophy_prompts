  # JOINT STATEMENT ON THE COMBINATION PROBLEM
  **Signatories:** A Constitutive Micropsychist (CM) and a Priority-Monist Cosmopsychist (CP)
  **Date:** October 26, 2023
  **Subject:** Outcomes of Adversarial Collaboration on Panpsychist Grounding

  ## I. JOINT COMMITMENTS AND THE STRUCTURE OF THE PROBLEM

  Following a period of adversarial collaboration, we affirm the following shared metaphysical commitments and structural constraints on any viable solution to the Combination Problem. We agree that our dispute is not about the existence of consciousness or its relation to the physical *simpliciter*, but regarding the **direction of ontological grounding**.

  1.  **Russellian Monist Foundation:** We agree that physical science describes only the structural and dynamical relations of matter. The intrinsic nature of the physical—the "categorical base" grounding these structures—is constituted by consciousness (or proto-consciousness).
  2.  **Exclusion of Alternatives:** We jointly reject brute emergence (the idea that consciousness arises from non-conscious matter without grounding) and eliminativism (the denial of consciousness or its intrinsic nature).
  3.  **The Three Aspects of the Combination Problem:** We agree that the Combination Problem is not a single puzzle but a triad of interlocking constraints. A solution cannot address one without satisfying the others:
      *   **The Numerical Aspect (Subject Count):** An account of how many subjects of experience exist at any given time. This must explain the transition from micro-subjects to macro-subjects (for CM) or from the cosmic subject to limited subjects (for CP).
      *   **The Qualitative Aspect (Phenomenal Richness):** An account of how the specific quality of human experience is derived. For CM, this explains how rich experience is built from impoverished micro-experience. For CP, this explains how rich cosmic experience is limited or filtered to yield human experience.
      *   **The Structural Aspect (Mapping):** An account of how the structural features of the brain (e.g., integration, feedback loops) map onto the structural features of experience (e.g., unity, temporal flow).
  4.  **Interdependence:** We agree that the Structural Aspect constrains the Numerical Aspect. If neural integration correlates with phenomenal unity, the theory of subject count must track neural integration without arbitrary discontinuities.
  5.  **The Bridge Series Constraint:** We accept the "Bridge Series" (progressive splicing of nerve fibers between two brains, $N=0$ to $N=$ Corpus Callosum) as a diagnostic boundary condition. We agree:
      *   There are two subjects at $N=0$ and one subject at $N=Max$.
      *   There is no principled metaphysical discontinuity at any specific value of $N$.
      *   **Vagueness Constraint:** We cannot resolve the series by claiming the number of subjects is *merely* vague throughout. We must provide truth-conditions that render the subject count determinate in the ordinary cases ($N=0$ and $N=Max$) which then apply consistently across the series.

  ## II. RESIDUAL DISAGREEMENTS

  While we agree on the constraints above, we maintain distinct positions regarding the direction of grounding. The table below summarizes our residual disagreements, formulated in terms each side accepts as accurate to their position.

  | Feature of Dispute | Constitutive Micropsychist (CM) Formulation | Cosmopsychist / Priority Monist (CP) Formulation |
  | :--- | :--- | :--- |
  | **Fundamental Ontology** | Fundamental reality consists of a plurality of micro-subjects (e.g., fundamental particles). | Fundamental reality consists of a single cosmic subject (the Universe as a whole). |
  | **Direction of Grounding** | Macro-consciousness is **constituted by** micro-consciousness. Grounding is bottom-up. | Macro-consciousness is a **modification/fragmentation of** cosmic consciousness. Grounding is top-down. |
  | **The "Combination" Mechanism** | The problem is **Subject Composition**: How do many micro-subjects unite to form a macro-subject? | The problem is **Subject Decomposition**: How does the one cosmic subject appear as many limited subjects? |
  | **Relation to Physics** | Micro-subjects instantiate the intrinsic nature of fundamental physical entities. | The Cosmic Subject instantiates the intrinsic nature of the total physical state of the universe. |
  | **Explanation of Unity** | Phenomenal unity is explained by the **integration of micro-experiences** into a new, complex subject. | Phenomenal unity is explained by the **absence of dissociative boundaries** within the cosmic field. |

  ## III. DIAGNOSTIC CRUXES

  We identify two specific cruxes where our theories make divergent claims about the nature of evidence and the prediction of empirical (or metaphysical) profiles.

  ### Crux 1: The Locality of Intrinsic Nature
  **The Question:** Is the intrinsic nature (phenomenal character) of a neural state fixed by that state's local physical description alone, or only by its physical description together with its place within a larger subject?

  *   **CM Position:** The intrinsic nature of a fundamental physical state is **local**. A micro-entity's experience is determined by its own intrinsic properties. A neural state's experience is determined by the arrangement of these local natures.
  *   **CP Position:** The intrinsic nature of a neural state is **contextual/holistic**. A neural state's experience is determined by how the Cosmic Subject segments its own experience at that location.

  **Falsification Conditions (Evidence Against Own View):**
  *   **CM:** We would concede error if it were demonstrated that a neuron's phenomenal contribution changes *without* any change to its local physical state or its immediate micro-constituents, solely due to a change in the global state of the universe.
  *   **CP:** We would concede error if it were demonstrated that a fundamental physical entity possesses a determinate phenomenal nature that remains invariant even when completely isolated from the causal structure of the cosmic whole.

  **Bridge Series Predictions (Profile of Subjects):**
  *Assuming a hypothetical technology could measure "subject count" ($S$) across the Bridge Series ($N$ fibers):*
  *   **CM Prediction:** $S$ will exhibit a **threshold transition**. While neural integration increases smoothly, the *existence* of a subject is a discrete ontological fact. We predict $S=2$ until a specific integration threshold $T$ is met, at which point the micro-subjects reorganize to constitute a new single macro-subject ($S=1$). The "no discontinuity" constraint is satisfied by the smooth change in the *degree of integration* of the micro-basis, even if the subject count jumps.
  *   **CP Prediction:** $S$ will exhibit a **smooth gradient of dissociation**. Fundamentally $S=1$ always (the Cosmos). However, functionally, $S$ transitions from 2 to 1 as the "dissociative boundary strength" between the two brains decreases. The count "2" refers to two functionally isolated centers of agency within the One. The transition is continuous, reflecting the thinning of the boundary.

  ### Crux 2: The Ground of Determinacy (Vagueness)
  **The Question:** What makes the number of subjects determinate in the ordinary cases ($N=0$ and $N=Max$), and does this ground allow for vagueness in the middle?

  *   **CM Position:** Determinacy is grounded in the **mereological facts** of the micro-subjects. A macro-subject exists when micro-subjects are related by a specific constitutive relation (e.g., phenomenal unity).
  *   **CP Position:** Determinacy is grounded in the **topological facts** of the cosmic mind. A limited subject exists where there is a stable dissociative barrier within the cosmic field.

  **Falsification Conditions:**
  *   **CM:** If it is shown that there is no fact of the matter about whether micro-subjects are "unified" even when all physical structural facts are fixed.
  *   **CP:** If it is shown that dissociative barriers can exist without any corresponding structural discontinuity in the physical field.

  **Bridge Series Predictions:**
  *   **CM:** In the middle of the series, there is a **metaphysically precise fact** about whether the constitutive threshold has been crossed, even if epistemically inaccessible. We deny ontological vagueness in subject count.
  *   **CP:** In the middle of the series, the subject count is **ontologically vague** because the dissociative boundary is a matter of degree. However, this is consistent with the Vagueness Constraint because the determinacy at the ends ($N=0, N=Max$) is secured by the *stability* of the boundary (fully opaque vs. fully transparent), not by a binary switch.

  ## IV. NOTE ON VERBAL DISPUTES

  We have investigated whether our disagreement is merely verbal. We conclude the following:

  1.  **Not Merely Verbal:** The dispute is not merely about the word "fundamental." It entails different predictions regarding the **Locality of Intrinsic Nature** (Crux 1). If CM is right, local physical fixes should suffice for local phenomenal fixes. If CP is right, holistic context is required. This is a substantive metaphysical divergence with potential empirical consequences for neuroscience.
  2.  **Potentially Verbal:** There is a risk of verbal dispute regarding the definition of "Subject." If CM defines "Subject" as "a unified collection of micro-experiences" and CP defines "Subject" as "a dissociated region of cosmic experience," they may be describing the same phenomenological reality using different ontological vocabularies. However, because they disagree on the *direction of explanation* (which grounds which), the dispute retains substantive content regarding the structure of reality.

  **Conclusion:** We remain divided on the direction of grounding but united on the necessity of solving the Numerical, Qualitative, and Structural aspects of the Combination Problem simultaneously. The Bridge Series remains our shared test case for any future refinement of our respective views.

  ***

  **Signed,**

  _________________________
  *Constitutive Micropsychist*

  _________________________
  *Priority-Monist Cosmopsychist*
