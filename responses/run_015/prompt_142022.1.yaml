answer: |-
  # Seminar Activity: The Marker Logic Game

  ## 1. Materials & Setup

  **Class Size:** 14 students (7 Pairs).
  **Room:** One large table or desks pushed together.
  **Printables:**
  1.  **Marker Tokens:** 3 colors of poker chips or cardstock circles.
      *   **Blue:** ENDORSE (E)
      *   **Red:** DISAPPROVE (D)
      *   **Yellow:** TOLERATE (T)
  2.  **Role Cards (14 total):**
      *   7 cards labeled **"STANCE: ENDORSE"** (You must place Blue on atomic normative claims unless logic forces otherwise).
      *   7 cards labeled **"STANCE: DISAPPROVE"** (You must place Red on atomic normative claims unless logic forces otherwise).
      *   *Exception:* One pair (2 students) gets **"TORN"** cards instead (see below).
  3.  **Argument Deck (10 Cards):** The logical forms (see Section 2).
  4.  **Scoreboard:** Whiteboard to track Pair Points.
  5.  **"Torn" Special Cards (2 total):** For the designated pair. Text: *"You have no settled attitude toward the atomic claim. You feel genuine conflict. You MUST place a marker anyway."*

  **The Rules (Project on Screen / Handout):**
  1.  **The Marker Rule:** Every sentence component must receive exactly one marker (E, D, or T).
  2.  **The Negation Trap:** If a sentence component is preceded by "NOT" ($\neg$), you **must** place the **TOLERATE (Yellow)** marker on it. Do not ask why. Just do it.
  3.  **The Invariance Rule:** You are working in pairs (one Endorse-stance, one Disapprove-stance). You must agree on whether the Argument Form is **VALID** or **INVALID**.
      *   If your pair disagrees: **0 Points.**
      *   If your pair agrees, but another pair in the room reaches the opposite verdict on the *same form*: **0 Points for everyone.** (Validity must be stable across stances).
  4.  **Validity Definition:** An argument is Valid if the Conclusion Marker is *determined* by the Premise Markers according to a consistent rule you devise. (Basically: Does the conclusion follow?)

  ---

  ## 2. The Argument List (Marker Language)

  *Print these on large cards. $\phi$ and $\psi$ represent atomic normative sentences (e.g., "Stealing is wrong").*

  1.  $[E: \phi] \vdash [E: \phi]$
  2.  $[E: \neg \phi] \vdash [T: \phi]$
  3.  $[D: \phi] \vdash [D: \neg \phi]$ **(Trap Card)**
  4.  $[E: \phi], [E: \phi \to \psi] \vdash [E: \psi]$
  5.  $[D: \phi], [E: \phi \to \psi] \vdash [?: \psi]$
  6.  $[E: \phi \to \psi], [E: \neg \psi] \vdash [E: \neg \phi]$
  7.  $[E: \phi \to \psi] \text{ vs } [E: \neg \psi \to \neg \phi]$ **(Contraposition Check)**
  8.  $[D: \phi \to \psi] \text{ vs } [D: \neg \psi \to \neg \phi]$ **(Contraposition Check)**
  9.  $[E: \neg (\phi \to \neg \psi)] \vdash [E: \phi]$ **(The Monster)**
  10. $[E: \neg (\phi \to \neg \psi)] \vdash [E: \psi]$ **(The Monster)**

  *Note for Instructor:* In forms 7 & 8, they aren't deriving a conclusion, but judging equivalence. If the markers assigned to the left side don't match the markers assigned to the right side, they cannot claim equivalence.

  ---

  ## 3. Timeline (80 Minutes)

  **00:00 – 00:10: Setup & Rules**
  *   Distribute Role Cards and Markers.
  *   Explain the **Negation Trap** dryly: "It's a rule of the game. 'Not' = Yellow. Don't debate it."
  *   Explain the **Invariance Rule**: "If Pair 1 says Valid and Pair 2 says Invalid, nobody gets points. You need a rule that works for the Endorse person and the Disapprove person equally."
  *   **Crucial:** Do not use the words "Embedding," "Frege-Geach," "Proposition," or "Truth-Conditions." Use "Sentence," "Stance," and "Marker."

  **00:10 – 00:25: Round 1 (Atomic & Negation)**
  *   Deal Cards 1, 2, 3.
  *   **Goal:** Establish the baseline.
  *   **Expected Friction:** Card 3 ($[D: \phi] \vdash [D: \neg \phi]$). The rule says $\neg \phi$ gets Yellow (T). But their Role Card says they are Disapprove-stance (Red).
  *   **Intervention:** If they ask, "Can I put Red on Not-Phi?" remind them: "Rule 2 says 'Not' gets Yellow. Follow the rule."
  *   **Outcome:** They will see that Disapproving of $\phi$ and Tolerating $\phi$ are now distinct, but logically linked.

  **00:25 – 00:45: Round 2 (Conditionals & Invariance)**
  *   Deal Cards 4, 5, 6.
  *   **Goal:** Force the Invariance Rule to bite.
  *   **Mechanism:** Pair A (Endorse/Disapprove) tries to validate Modus Ponens (Card 4). Pair B tries Card 5 (Mixed stances).
  *   **The Problem:** To make Card 4 Valid, the marker on $\phi$ in the conditional must match the marker on $\phi$ in the premise. But if the Conditional's marker is fixed by the sentence type, does it allow the premise to drive the conclusion?
  *   **Invariance Check:** Walk around. If one pair says "Valid" because they treat the conditional as a promise, and another says "Invalid" because they treat it as a report, stop the class. "Pair 3 and Pair 5 disagree. No points for anyone. You need a single rule."

  **00:45 – 01:00: Round 3 (Contraposition & The Monster)**
  *   Deal Cards 7, 8 (Contraposition) and 9, 10 (Monster).
  *   **Goal:** Break the system.
  *   **Contraposition:** They will intuitively feel $[E: \phi \to \psi]$ is the same as $[E: \neg \psi \to \neg \phi]$.
      *   *Task:* Assign markers to both.
      *   *Friction:* Left side has E markers. Right side has T markers (because of 'Not').
      *   *Question:* "Are these the same state?" If they say Yes, ask: "Then why are the markers different colors?"
  *   **The Monster:** $\neg (\phi \to \neg \psi)$.
      *   Layer 1: $\psi$ gets a marker.
      *   Layer 2: $\neg \psi$ gets Yellow (T).
      *   Layer 3: $(\phi \to T)$ gets a marker.
      *   Layer 4: $\neg (\dots)$ gets Yellow (T).
      *   *Result:* The conclusion is just Yellow. The input was Yellow. Did anything happen?
      *   *Validity Check:* Does $[E: \neg (\phi \to \neg \psi)]$ validly imply $[E: \phi]$? Their markers say the premise is Yellow (Tolerate). The conclusion is Blue (Endorse). How does Tolerate entail Endorse?

  **01:00 – 01:10: The "Solution" Phase**
  *   Allow them to propose rule changes to save the points.
  *   **Predicted Move:** They will suggest "Let's treat Yellow as 'Not Blue'."
  *   **Your Move:** "If Yellow is 'Not Blue', and Red is 'Not Blue', then Yellow = Red. But the game distinguishes them. If you collapse them, you lose the ability to distinguish Disapproval from Tolerance. Choose: Validity or Distinction?"

  **01:10 – 01:20: Debrief (The Reveal)**
  *   Reveal the terms: **Frege-Geach Problem**, **Embedding**, **Unasserted Contexts**.
  *   Map the game moves to the philosophical problems (see Section 5).

  ---

  ## 4. Handling "Solutions" & Limitations

  **Scenario: They Reverse-Engineer a Rule**
  *   *What they'll do:* "Okay, we define Validity as 'No marker conflict'. If Premise is Blue and Conclusion is Red, that's Invalid. If Premise is Blue and Conclusion is Blue, Valid."
  *   *The Counter:* Point to Card 9 (The Monster). "Your premise is Yellow (Tolerate). Your conclusion is Blue (Endorse). By your rule, that's a conflict. So the argument is Invalid. But classically, $\neg (P \to \neg Q) \vdash P$ is valid. You have saved your marker system by sacrificing classical logic."
  *   *The Lesson:* "You can save the logic or save the marker distinction. Expressivists spend their careers trying to save both."

  **Limitations Note (For Your Debrief)**
  *   **What the Game Can't Do:** This game uses *flat* markers (1st-order attitudes). It cannot simulate **Higher-Order Attitudes** (e.g., Gibbard's "accepting a norm that accepts...").
  *   **How to Explain:** "In the game, you ran out of colors. Real expressivists don't add more colors; they make the colors *structural*. They argue that the attitude in 'Stealing is wrong' is the same *type* of mental state as the attitude in 'If stealing is wrong...', but in the second case, it's an attitude *toward a combination of attitudes*. The game was too flat to show that recursion. You were trying to solve a 3D problem with 2D pieces."
  *   **Don't Let Them Off:** "Don't think this fixes it easily. Higher-order attitudes bring their own nightmares (the 'Negation Problem' returns at the higher level). The game showed you *why* they need higher-order attitudes: because flat ones break logic."

  ---

  ## 5. Debrief Map (10 Minutes)

  | Game Moment | Philosophical Problem | Instructor Script |
  | :--- | :--- | :--- |
  | **The Negation Trap** (Rule: 'Not' = Yellow) | **The Negation Problem.** | "You were forced to treat 'Not Wrong' as 'Tolerate'. But 'Tolerate' isn't the logical opposite of 'Disapprove'. It's a third thing. This is why expressivists struggle to define negation without collapsing contraries into contradictories." |
  | **The Invariance Rule** (Pairs must agree) | **Content Stability / The FG Problem.** | "I forced you to agree across stances. Why? Because if validity depends on whether *you* like stealing, logic isn't logic—it's psychology. The embedded sentence needs a 'content' that stays the same whether you Boo it or Hurray it. The game showed you can't get that content from the markers alone." |
  | **Contraposition** (Colors don't match) | **Logical Equivalence.** | "You knew the sentences were equivalent, but your markers didn't match. The attitude toward 'If P then Q' looked different from 'If Not-Q then Not-P'. This is the embedding problem: the attitude changes shape when the sentence moves inside the 'If'." |
  | **The Monster** (Yellow entails Blue?) | **Validity in Expressivism.** | "The premise was Tolerate. The conclusion was Endorse. How does one entail the other? In standard logic, truth preserves truth. In your game, markers didn't preserve markers. This is the challenge: explaining validity without truth." |

  ---

  ## 6. Predicted Failure Modes & Interventions

  **Failure Mode 1: Smuggling Cognitivism**
  *   *Sign:* A student says, "Well, if 'Wrong' is true, then..." or "The marker represents the *fact* that..."
  *   *Intervention:* **The Chip Confiscation.** "That chip represents a feeling/stance, not a fact. If you use the word 'True' or 'Fact' to justify a marker placement, I confiscate one of your chips. You must justify it using *consistency of markers* only."

  **Failure Mode 2: Semantic Drift (Arguing about 'Wrong')**
  *   *Sign:* The class debates whether stealing is actually wrong or if 'wrong' means 'illegal'.
  *   *Intervention:* **The "Blork" Substitution.** "Stop. Replace the word 'Wrong' with 'Blork'. Replace 'Stealing' with 'X'. If the argument breaks with 'Blork', it's a logic problem. If it only breaks with 'Wrong', you're doing semantics, not metaethics. We are testing the Logic."

  **Failure Mode 3: The "Torn" Pair Cheats**
  *   *Sign:* The Torn pair just picks Blue or Red to make the math work.
  *   *Intervention:* **Public Declaration.** "Torn Pair, before you place the chip, state aloud: 'I am placing X, though I feel Y.' Make the dissonance public. That discomfort is the data point."

  ---

  ## 7. Note on the Contraposition Prediction

  **Your Prediction:** *Students will insist the two sentences say the same thing but fail to map it with three flat markers.*

  **Assessment:** **This is correct.**
  *   **Why:** Intuitively, $P \to Q$ and $\neg Q \to \neg P$ are logically equivalent. Students will agree on this immediately.
  *   **The Break:** In the game, $P \to Q$ will likely be marked with **E** (Endorse the connection). $\neg Q \to \neg P$ forces **T** (Tolerate) on the atoms.
  *   **The Conflict:** They will have an **E-structure** on the left and a **T-structure** on the right.
  *   **The Result:** They cannot claim the *states expressed* are identical because the markers (E vs T) are distinct by rule. They will be forced to admit that either (a) the sentences aren't equivalent (absurd), or (b) their marker system fails to capture the equivalence (the Expressivist problem).
  *   **Nuance:** Some might try to say "Tolerate *just means* Endorse in this context." **Intervention:** "Then why do we have two colors? If context changes the color's meaning, your marker system is ambiguous. Logic cannot handle ambiguous symbols."

  This activity forces the breakdown experientially. They will leave the room feeling the "smoke" before you hand them the "fire" (Frege-Geach).
