  ### Logical Space & Structure

  Before the tree, here is the map of the logical territory. We are sorting views based on three independent axes:
  1.  **Credence vs. Action:** Is the output a probability number or a decision rule?
  2.  **Indexical Weighting:** Does the fact "I exist" favor hypotheses with more observers? (SIA vs. SSA vs. None).
  3.  **Scope & Conditioning:** Who counts as an observer (Reference Class), do future observers count (Unborn), and how do we handle infinities?

  **Combinations & Occupancy:**
  *   **Credence + No Update:** Occupied ("Physics Only").
  *   **Credence + Weighted + SSA:** Occupied (Standard SSA, Reference Class variants).
  *   **Credence + Weighted + SIA:** Occupied (Standard SIA, FNC).
  *   **Credence + Weighted + Infinity-Break:** Occupied (Measure Problem skeptics).
  *   **Action Only:** Occupied (UDT/ADT).
  *   **Empty:** "SIA but Reference Class Restricted" (Incoherent: SIA weights by observer count, restricting the class defeats the purpose). "SSA but Future Observers Count" (Unattractive: Violates causal structure of sampling).

  **Unseparable Pairs:**
  *   **SIA vs. FNC:** In almost all finite cases, they yield identical probabilities. They only diverge in "clone" cases where evidence is identical across worlds but observer counts differ.
  *   **Halfer vs. SSA:** Halfers are typically SSA adherents applied to time. Separating them requires a case where SSA implies Thirder (rare) or Halfer implies SIA (incoherent).

  ***

  ### The Decision Tree (Handout Version)

  **Start:** You want a number (credence) or a rule (policy)?
  *   **Policy:** "I don't care about true credence, only what maximizes utility." → **Go to Node 1.**
  *   **Credence:** "I want the true probability." → **Go to Node 2.**

  **Node 1: The Selfish Bet**
  *Case:* You are one of two identical copies. A button costs you $1. If pressed, it saves the *other* copy from pain (you feel nothing). Do you press?
  *   **Yes (Altruistic/Total):** → **Leaf 1 (Decision Theory Only)**
  *   **No (Selfish/Causal):** → **Leaf 1 (Decision Theory Only)** *(Note: This node routes to the same leaf; the view is defined by rejecting credence, not the bet outcome.)*

  **Node 2: The Black-Beard Incubator**
  *Case:* Fair coin. Heads: 1 observer created (You, Black Beard). Tails: 2 observers created (You, Black Beard + Other, White Beard). You wake, see Black Beard. Credence in Heads?
  *   **1/2:** "My existence doesn't favor Tails." → **Go to Node 3.**
  *   **1/3:** "I'm more likely to be me in a world with more mes." → **Go to Node 6.**

  **Node 3: The Physics Check**
  *Case:* Does the fact that you exist *at all* update the prior probability of the coin flip?
  *   **No:** "Existence is not evidence." → **Leaf 2 (Physics Only)**
  *   **Yes:** "Existence is evidence, but weighted equally." → **Go to Node 4.**

  **Node 4: The Duplication (Sleeping Beauty)**
  *Case:* Fair coin. Heads: Wake Monday. Tails: Wake Monday & Tuesday (amnesia in between). You wake. Credence in Heads?
  *   **1/2:** "The coin is fair, awakenings don't change that." → **Leaf 3 (Halfer)**
  *   **1/3:** "I am twice as likely to wake in the Tails world." → **Go to Node 5.**

  **Node 5: The Reference Class**
  *Case:* Who counts as a valid "sample" of you?
  *   **Broad:** "Any conscious observer." → **Leaf 4 (SSA Standard)**
  *   **Narrow:** "Only observers with my exact evidence." → **Leaf 5 (SSA Restricted)**

  **Node 6: The Unborn Crowd**
  *Case:* Fair coin. Heads: You created now. Tails: You created now + 1000 others created next year. You wake now. Credence in Heads?
  *   **1/2:** "Future observers don't affect my current sampling." → **Leaf 6 (Thirder)**
  *   **~1/1001:** "Total observer count weights the hypothesis." → **Go to Node 7.**

  **Node 7: The Conditioning Method**
  *Case:* How did you update?
  *   **"I am a random observer":** → **Go to Node 8.**
  *   **"Someone has my evidence":** → **Leaf 8 (FNC)**

  **Node 8: The Endless Room**
  *Case:* Hypothesis A: 10^100 observers. Hypothesis B: Infinite observers. Data fits both.
  *   **B goes to 100%:** "Infinite observers dominate." → **Leaf 7 (SIA Standard)**
  *   **Undefined/Zero:** "Infinities break the measure." → **Leaf 9 (Infinity Handler)**

  ***

  ### Leaves

  1.  **Decision Theory Only (UDT/ADT):** Committed to maximizing expected utility across all copies without defining subjective probability. *Awkward:* Must accept "money pumps" if preferences aren't consistent across duplicates.
  2.  **Physics Only:** Committed to never updating priors on indexical facts (your own existence). *Awkward:* Must assign low probability to living in a life-friendly universe despite the data.
  3.  **Halfer:** Committed to maintaining prior credence (1/2) despite duplication/amnesia. *Awkward:* Must bet as if the coin is fair even when offered odds that exploit the duplication.
  4.  **SSA Standard:** Committed to sampling yourself randomly from a broad reference class of observers. *Awkward:* The "Doomsday Argument" (humanity likely ends soon because you are early).
  5.  **SSA Restricted:** Committed to sampling only from observers with your exact evidence. *Awkward:* Reference class choice is arbitrary and can be tuned to prove anything.
  6.  **Thirder:** Committed to 1/3 on Beauty but 1/2 on Unborn Crowd (temporal SIA without future weighting). *Awkward:* Inconsistent weighting of observers based on time rather than existence.
  7.  **SIA Standard:** Committed to weighting hypotheses by total number of observers (past, present, future). *Awkward:* The "Presumptuous Philosopher" (can rule out physical theories just because they imply fewer observers).
  8.  **FNC (Full Non-indexical Conditioning):** Committed to conditioning on "someone has my evidence" before "it is me". *Awkward:* Mathematically converges with SIA in most cases, making the distinction purely philosophical.
  9.  **Infinity Handler:** Committed to SIA/SSA logic but rejects infinite observer counts as probability 0 or undefined. *Awkward:* Must ignore data suggesting the universe is spatially infinite.

