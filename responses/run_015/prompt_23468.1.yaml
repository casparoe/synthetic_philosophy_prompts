prompt: |-
  I host a small podcast about the history of computing and next month I'm interviewing a philosopher who wrote a book on Turing's views about extrasensory perception. I know the basics - Turing was a member of the Society for Psychical Research, he ran these precognition diaries with I.J. Good where they wrote down predictions and then checked them, and he thought the statistical evidence for telepathy was actually pretty strong. Can you draft me 6-8 interview questions that dig into the actual substance of his position, not the "fun fact that a genius believed in ESP" angle? I specifically want questions about: his analogy that telepathy might work like a radio signal (the brain emitting some carrier wave that another brain could tune into) and what that analogy actually commits him to; the card-guessing experiments (the Rhine stuff) that he was leaning on as evidence, and whe his take on them survives modern statistical criticism of parapsychology like p-hacking and the file-drawer problem; and the fact that in his 1950 paper on machine intelligence he has a whole section treating ESP as an argument against the Turing test - I want to press him on why he thought it was a problem for the test and whether that reasoning still holds. For each question, give me a follow-up that keys off the answer he's most likely to give.
