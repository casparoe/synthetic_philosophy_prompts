answer: |-
  Here is the translation of the St. Petersburg Paradox (SPP) into your vocabulary, followed by the residue report on the standard resolutions.

  ### 1. The Translation Map

  The SPP is not a paradox in your framework; it is a **failure of identifiability and consistency in the presence of regular variation with $\alpha \le 1$.**

  *   **The Game:** An on-policy evaluation problem where the reward distribution $R$ follows a power law with tail index $\alpha \le 1$.
      *   Payoff $2^n$ with prob $2^{-n}$ $\implies P(R > x) \sim x^{-1}$. This is the boundary case ($\alpha=1$).
      *   Payoff $2^n/n$ $\implies$ Still $\alpha=1$, but logarithmic divergence.
  *   **The "Unknown $p$" Variant:** This is a **Bayesian OPE problem with model misspecification/non-identifiability.**
      *   Prior $\pi(p)$ has support on $[0.5, 1)$.
      *   For any $p \ge 0.5$, the conditional expectation $E[R|p] = \infty$.
      *   With finite $N$, the posterior $\pi(p|D)$ retains mass on $p \ge 0.5$.
      *   The posterior predictive mean $\int E[R|p] \pi(p|D) dp$ remains $\infty$.
      *   **OPE Equivalent:** You are trying to estimate the mean of a distribution using IS, but the importance weights $w$ have $\alpha \le 1$. The estimator $\hat{\mu}_N = \frac{1}{N}\sum w_i r_i$ does not obey the LLN. It converges (in distribution) to a Lévy stable law, not a constant. The "true value" is not a point; it is a distribution that widens as $N$ grows.

  ### 2. Audit of Resolutions

  Here is how the standard "answers" to SPP map to your tools, and where they break.

  #### A. Bernoulli's Log Utility (Diminishing Marginal Utility)
  *   **The Move:** Maximize $E[\log(W)]$ instead of $E[W]$.
  *   **OPE Translation:** Change the **estimand**. You stop evaluating the policy value $V(\pi) = E_\pi[R]$ and start evaluating $V_{log}(\pi) = E_\pi[\log(R)]$.
  *   **Technical Consequence:** If $R \sim \text{Pareto}(\alpha=1)$, then $\log(R)$ has finite variance. Your IS estimators immediately become consistent and asymptotically normal.
  *   **Verdict:** **Relabeling.** This does not solve the paradox; it sidesteps it by changing the loss function. It answers "What is the geometric mean growth?" not "What is the expected payoff?" In your framework, this is admitting that the first moment is unestimable, so you optimize the second moment of the log-transform. It is a valid engineering constraint, but it is not a resolution of the infinite mean problem.

  #### B. Bounded Utility / Truncation (Finite Bankroll)
  *   **The Move:** Cap the payoff at $M$ (casino runs out of money).
  *   **OPE Translation:** **Clipped Importance Sampling** or **Reward Truncation**. You introduce a threshold $\tau$ and estimate $E[R \cdot \mathbb{I}(R < \tau)]$.
  *   **Technical Consequence:** Bias-Variance trade-off. You introduce bias $O(\tau^{-\alpha})$ to reduce variance from $\infty$ to $O(N)$.
  *   **Verdict:** **Translates Cleanly.** This is standard practice in heavy-tailed OPE (e.g., W-clip, PM-clip). It acknowledges that the true mean is operationally irrelevant because the sample complexity to approximate it exceeds the horizon of the universe. However, it admits the "value" is a function of the truncation level $\tau$, not an intrinsic property of the policy.

  #### C. Ergodicity / Time Averages (Peters et al.)
  *   **The Move:** Replace ensemble average $E[R]$ with time average $\lim_{T\to\infty} \frac{1}{T} \sum \log(W_t)$.
  *   **OPE Translation:** This assumes a **Contextual Bandit with Wealth State and Reinvestment**. The reward is not additive; it is multiplicative ($W_{t+1} = W_t \cdot R_t$).
  *   **Technical Consequence:** You are no longer doing OPE on a static reward distribution. You are evaluating the **Lyapunov exponent** of a stochastic process.
  *   **Verdict:** **Requires Hidden Assumptions.** This only works if the problem is sequential *and* involves compounding. If your OPE setup is "evaluate this policy on i.i.d. data to determine a one-off price," this resolution is a **change of subject**. It solves the problem by changing the data generating process from i.i.d. additive to multiplicative time-series.

  ### 3. The Residue Report

  You asked about the "one play" itch and whether the residue is a gap in your framework or a sign the resolutions are fake.

  **The "One-Play" Problem**
  In your vocabulary, "What is this worth once?" is an **ill-posed query** when $\alpha \le 1$.
  *   OPE relies on asymptotics ($N \to \infty$). The "value" of a policy is defined as the limit of the estimator.
  *   If the estimator converges to a stable distribution (Cauchy/Lévy) rather than a Dirac delta, the "value" is undefined.
  *   For $N=1$, the "value" is simply the realization $r_1$. There is no expectation to calculate.
  *   **The Conflict:** The SPP asks for a scalar price (expectation) for a distribution that does not have a scalar first moment. Your framework correctly identifies this as **non-estimable**. The "itch" comes from the demand for a scalar where the math only provides a distribution.

  **Is Log Utility a Discovery or a Choice?**
  It is a **choice of norm**.
  *   Using $L_1$ (mean) on a Cauchy distribution is mathematically invalid.
  *   Using $L_1$ on $\log(X)$ (geometric mean) is valid.
  *   Calling log utility a "resolution" is marketing. It is simply switching from an $L_1$ objective on $R$ to an $L_1$ objective on $\log R$ because the former is undefined. It is not a discovery about value; it is a regularization technique.

  **Is Ergodicity an Answer or a Change of Subject?**
  It is a **change of subject**, unless you are specifically doing portfolio optimization.
  *   If the task is "Price this gamble," the ergodicity argument says "You cannot price this gamble, you can only optimize a trajectory."
  *   If the task is "Offline Policy Evaluation," the ergodicity argument says "Your evaluation metric (average reward) is wrong for this environment (multiplicative wealth)."
  *   It does not fix the OPE problem; it tells you that OPE is the wrong tool for multiplicative processes.

  **The "Unknown $p$" Variant (The Real Itch)**
  This is the hardest residue.
  *   In OPE terms: You have **support mismatch** that cannot be corrected by data.
  *   If the prior $\pi(p)$ puts mass on non-integrable regions ($p \ge 0.5$), and finite data cannot zero out that mass, the posterior mean is **structurally infinite**.
  *   **Verdict:** This is a **gap in the framework** only if you insist the framework must output a finite number. If the framework is "estimate the mean," the correct output is "Mean does not exist."
  *   The "resolution" here is **Decision Theory**, not Statistics. You must switch from Mean-Variance optimization to a robust criterion (e.g., minimax regret, quantile optimization, or median-of-means) because the mean is not a sufficient statistic for decision making under heavy tails.

  ### 4. Blunt Conclusion

  1.  **The Paradox is Real:** In your framework, it corresponds to $\alpha \le 1$. The sample mean is not a consistent estimator of the population mean (because the population mean is $\infty$).
  2.  **Resolutions are Regularizations:** Log utility, truncation, and ergodicity are all methods to force convergence. They do not "find" the true value; they construct a *different* value that is estimable.
  3.  **The "One-Play" Residue:** There is no counterpart in OPE for "value of a single draw from a non-integrable distribution." OPE is inherently asymptotic. If you need a price for $N=1$, you are not doing evaluation; you are doing **robust decision making under ambiguity**.
  4.  **Final Call:** The "resolutions" are mostly relabelings. They change the objective function (log), the data generating process (ergodic), or the estimator (truncation). None of them recover the infinite mean. If your goal is to estimate the mean, the answer is "You can't." If your goal is to act, the answer is "Don't use the mean."

  The itch remains because you are trying to use a tool (expectation) that assumes $\alpha > 1$ on a problem where $\alpha \le 1$. The paradox persists only if you insist the mean *must* exist. Drop that assumption, and the paradox becomes a standard heavy-tail estimation error.
