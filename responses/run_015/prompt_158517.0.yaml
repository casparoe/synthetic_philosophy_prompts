answer: |-
  You have identified a robust and well-documented structural dynamic, though political science does not possess a single, canonical noun (like "gerrymandering" or "filibuster") that encapsulates it entirely. Instead, this phenomenon is typically analyzed as a **second-order effect of institutional design**, described through the intersection of **Principal-Agent Theory**, **Informational Asymmetry**, and **Bureaucratic Autonomy**.

  If you are looking for the precise "carving" of this concept, it is best understood as **Tenure-Induced Informational Asymmetry leading to Agency Capture.**

  Here is the breakdown of the concept, its boundaries, and how it applies to your specific examples.

  ### 1. The Core Concept: Tenure-Induced Informational Asymmetry

  In political science and organizational theory, power is not just formal authority; it is also control over information and procedure. When you forcibly rotate the layer of formal authority (via term limits or sortition), you create a **tenure disparity** between the decision-makers and the support structure.

  *   **The Mechanism:** Complex institutions rely on *tacit knowledge* (institutional memory, procedural norms, network relationships) that cannot be easily codified in documents.
  *   **The Displacement:** When the "Principals" (elected officials or sortition citizens) are transient, they cannot acquire this tacit knowledge fast enough to oversee the "Agents" (staff, bureaucrats, lobbyists).
  *   **The Result:** The Agents gain **Bureaucratic Autonomy**. They do not just advise; they effectively select the menu of options available to the Principals. This is often called **Agenda Control** or **Gatekeeping**.

  While there is no single word for this, scholars of term limits (such as Gary Carey, Richard Niemi, and Lynda Powell) refer to this specifically as the **Shift in Power to Legislative Staff and Lobbyists.** In the context of sortition, deliberative democracy scholars (like John Gastil or Robert Dahl) refer to it as the **Problem of Facilitation and Agenda-Setting.**

  ### 2. Is there a specific name?

  There is no single standardized term, but there are three labels used to describe facets of this phenomenon. None are perfect, but together they form the boundary you are looking for:

  1.  **The "Vacuum Effect" (or Power Vacuum):** This is the most common descriptive term. It posits that nature abhors a power vacuum; if elected officials are weakened by term limits, external actors (lobbyists) or internal actors (staff) will rush to fill the void.
  2.  **Agency Loss / Slack:** In Principal-Agent theory, "agency loss" occurs when the agent acts contrary to the principal's interest. High turnover *exacerbates* agency loss because the principal cannot monitor the agent effectively. You might describe your phenomenon as **Structural Agency Loss**.
  3.  **The Iron Law of Oligarchy (Specific Interpretation):** Robert Michels' classic theory states that all organizations eventually develop a ruling elite. Your observation is a specific *acceleration* of this law: by trying to prevent an oligarchy of *electeds*, you inadvertently accelerate the formation of an oligarchy of *administrators*.

  If you were to coin a precise term for your own use, **"The Permanence Paradox"** or **"Structural Dependency"** would be accurate. It captures the irony that anti-careerist reforms increase dependency on careerists.

  ### 3. Term Limits vs. Sortition: Are they parallel?

  They are structurally parallel regarding the **migration of expertise**, but they differ regarding **accountability**.

  **Term Limits (The "Revolving Door" Model)**
  *   **The Dynamic:** The legislator is an amateur but remains *politically* ambitious. They want to be re-elected (to a different office) or maintain party standing.
  *   **The Dependency:** They need staff and lobbyists to write bills they can claim credit for.
  *   **The Risk:** The "Shadow Legislature." Senior staff and lobbyists draft the legislation; the term-limited member merely signs it. The careerist class here is often a hybrid of partisan staffers and registered lobbyists.
  *   **Accountability:** The member is still accountable to voters, but their *capacity* to act independently is reduced.

  **Sortition (The "Jury" Model)**
  *   **The Dynamic:** The citizen representative has no political ambition and no prior expertise. They are truly temporary.
  *   **The Dependency:** They rely heavily on **facilitators** and **civil servants** to understand the brief, frame the questions, and summarize the evidence.
  *   **The Risk:** **Agenda Capture.** The permanent bureaucrats who design the process decide what information the citizens see and how options are framed. If the bureaucrats define the "feasible" options narrowly, the citizens' vote is constrained.
  *   **Accountability:** The citizens are not accountable to voters (they weren't elected). They are only accountable to their own conscience. This makes the *process design* (controlled by permanents) even more critical than in term limits.

  **Verdict:** They are parallel in that both create a **Knowledge Deficit** at the top that must be filled by the bottom. They differ in that term-limited officials retain *political incentives* that might align them with voters, whereas sortition members rely entirely on the *procedural integrity* of the permanent staff.

  ### 4. Delineating the Boundaries: What this is and is not

  To ensure you are not conflating this with broader concepts, here are the boundaries:

  *   **It is not "Bureaucratic Power" generally:** Bureaucracies always have power. This phenomenon is specific to the *relative increase* in bureaucratic power caused by the *weakening* of the political layer. It is a **zero-sum shift**, not an absolute growth.
  *   **It is not "Regulatory Capture":** Capture implies external private interests (corporations) co-opting the state. Your phenomenon includes internal actors (civil servants, legislative counsel) who are technically part of the state but operate without democratic oversight.
  *   **It is not "The Deep State":** That term is pejorative and implies conspiracy. Your observation is structural and mundane: it happens because writing complex code (or law) requires context that takes years to acquire.
  *   **The Boundary Condition:** This phenomenon only occurs where **Tacit Knowledge** is required. In roles where tasks are fully codifiable (e.g., a simple vote on a binary issue), turnover does not shift power downward. The shift happens only where *drafting, negotiation, and procedure* matter.

  ### 5. The Engineering Analogy

  Your intuition from software engineering is mathematically precise.

  *   **The "Bus Factor":** If only one person knows how the legacy code works, that person has veto power.
  *   **Forced Rotation:** If you force the Lead Architect to rotate every 2 years, but the Senior Engineers stay for 10, the Senior Engineers become the *de facto* Architects. They decide what is "technically feasible."
  *   **The Migration:** The "Political" decision (what feature to build) migrates to the "Engineering" decision (how to build it). Since the "how" often constrains the "what," the engineers hold the real power.

  In political science, this is the distinction between **Substantive Power** (making the decision) and **Procedural Power** (structuring the decision). Reforms that rotate substantive leaders inevitably concentrate procedural power in the permanent substrate.

  ### Summary

  You have not conflated ideas; you have identified a specific **institutional failure mode**.

  *   **The Concept:** **Tenure-Induced Informational Asymmetry.**
  *   **The Outcome:** **Agency Capture by Permanent Agents.**
  *   **The Distinction:** It differs from general bureaucracy because it is *caused* by the reform intended to stop careerism.
  *   **The Parallel:** Term limits and sortition both suffer from this, but sortition is more vulnerable to *agenda control* by facilitators, while term limits are more vulnerable to *drafting control* by lobbyists/staff.

  If you need a label for this in your own writing, **"The Permanence Paradox"** captures the irony, while **"Structural Dependency on Permanent Agents"** captures the mechanism. It is a recognized, empirically observed constraint on democratic reform that suggests you cannot eliminate careerism; you can only choose *which* class of careerists holds the leverage.
