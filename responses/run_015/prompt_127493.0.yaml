answer: |-
  **MEMORANDUM**

  **TO:** University Administration, Student Government, and Accessibility Board Members
  **FROM:** Chair, Accessibility and Equity Funding Board
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Annual Discretionary Budget Allocation ($180,000)

  ### 1. Executive Decision

  After rigorous deliberation and ethical review, the Accessibility and Equity Funding Board recommends the **Singular Allocation** of the full $180,000 discretionary budget to acquire the neuro-adaptive laboratory interface for the graduate student with severe motor impairment.

  This decision is not made lightly. It prioritizes transformative independence for one individual over incremental access improvements for twelve. However, it is the only allocation fully compliant with our Board Charter, which mandates that all funding decisions be defensible to every affected student as a "free and equal person." To address the valid concerns regarding broad equity, this allocation includes specific conditions regarding knowledge transfer and equipment legacy, detailed in Section 4.

  ### 2. Ethical Framework and Justification

  Our Charter binds us to a **contractualist framework**. This ethical standard posits that an action is permissible only if it cannot be "reasonably rejected" by any individual affected by the decision. We are not tasked with maximizing the sum total of welfare (aggregation), but with ensuring that no individual is sacrificed for the convenience of the many.

  **The Contractualist Objection to Aggregation**
  Under a purely aggregationist model, we would sum the benefits: 12 students gaining improved daily access ostensibly outweighs 1 student gaining independent research capability. However, contractualism objects to this calculus because it treats individuals as mere containers of value rather than sovereign persons.

  If we were to divide the funds (Option B), the graduate student with severe motor impairment could reasonably reject this decision. Their claim is based on *fundamental exclusion*; without this interface, they cannot conduct research independently, effectively barring them from full participation in the academic community. The twelve other students, while deserving of improved access, currently possess baseline accessibility that allows for participation, albeit with friction. In a contractualist negotiation, the individual facing exclusion holds a stronger veto power than the group facing inconvenience. To deny the singular allocation would be to tell the one student that their independence is negotiable against the comfort of others, violating their status as a free and equal person.

  ### 3. The Aggregationist Counter-Argument

  We must engage seriously with the dissenting view held by several Board members, which rests on the **Equity Mission**. The aggregationist argument is morally potent: Equity is inherently distributive. By concentrating 100% of resources on a single individual, we risk creating a "super-accessibility" for one while leaving systemic barriers intact for the many.

  The strongest reply from this perspective is as follows:
  > *"Accessibility is not a lottery. When we allocate $180,000 to one person, we signal that only the most severe impairments merit investment, while the cumulative burden of twelve students with sensory and mobility needs is deemed less valuable. This violates the spirit of equity, which seeks to lift the floor for everyone, not just build a ceiling for one. Ignoring the aggregate welfare ignores the reality that injustice is often suffered collectively. By refusing to count the total welfare gain, we may be upholding a philosophical principle while failing the broader community we serve."*

  This argument correctly identifies a risk: that contractualism can appear coldly individualistic. It highlights that equity requires attention to scale and systemic patterns, not just individual edge cases. We acknowledge that denying twelve grants creates a tangible opportunity cost for the broader disabled student body.

  ### 4. Resolution and Conditions

  While the aggregationist concern is valid regarding our *long-term* mission, the Charter restricts our *immediate* discretionary authority. We cannot violate the contractualist constraint to satisfy the aggregationist goal. However, to honor the spirit of the Equity Mission, the Board approves the Singular Allocation subject to the following **Structured Conditions**:

  1.  **Open-Source Protocol Mandate:** As a condition of funding, the graduate student and their department must document the interface's configuration and adaptation protocols. These must be made open-source to the university network within six months of installation, allowing other students to benefit from the technological knowledge even without the hardware.
  2.  **Legacy Equipment Clause:** The interface remains university property. Upon the student's graduation or departure, the device enters a "High-Need Rotation Pool," managed by Disability Services to support future students with comparable severe impairments.
  3.  **Advocacy for Budget Expansion:** The Board will formally petition the University Administration to increase the annual discretionary budget for the next fiscal year. We will use the data from this allocation to argue that while contractualist obligations are high-cost, they are non-negotiable, necessitating a larger total fund to accommodate both singular transformative needs and aggregate grants.

  ### 5. Implementation Timeline

  To ensure transparency and accountability, the following timeline will be enacted immediately:

  *   **Phase 1: Procurement & Compliance (Months 1-3)**
      *   **Weeks 1-4:** Finalize vendor contract for neuro-adaptive interface; Legal review of Legacy Equipment Clause.
      *   **Weeks 5-8:** Install hardware in the designated graduate research laboratory.
      *   **Weeks 9-12:** Calibrate interface to the student's specific motor needs; begin baseline data collection on research independence.

  *   **Phase 2: Integration & Knowledge Sharing (Months 4-9)**
      *   **Month 4:** Student begins independent research using the interface.
      *   **Month 6:** Deadline for submission of Open-Source Protocol documentation to the University Repository.
      *   **Month 8:** Board review of initial efficacy data; presentation to Student Government on the impact of the allocation.

  *   **Phase 3: Review & Future Planning (Months 10-12)**
      *   **Month 10:** Convene special session to draft the Budget Expansion Petition based on Year 1 outcomes.
      *   **Month 12:** Publish Annual Equity Report detailing the decision rationale, explicitly addressing both the contractualist justification and the aggregationist opportunity cost.

  ### 6. Conclusion

  This decision affirms that the University regards every student as an end in themselves, not a means to a statistical aggregate. We recognize that this leaves twelve worthy needs unmet by this specific fund. That failure is not a moral indifference to the twelve, but a structural limitation of a budget that forces a choice between deep transformation and broad mitigation. By choosing transformation, we uphold the Charter's demand for individual defensibility. By attaching conditions of knowledge sharing and legacy, we commit to bridging the gap toward broader equity in the future.

  **Approved by:**
  The Accessibility and Equity Funding Board
  *Chair Signature*
