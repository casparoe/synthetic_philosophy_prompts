answer: |-
  This is a classic ethics standoff. You've got Dana arguing from a **consequentialist** angle (what are the actual results/harms?) and Marcus arguing from a **deontological** angle (what are the duties/rules?). Neither is "wrong," but they are measuring different things.

  Here is the turn-by-turn breakdown of who held the stronger hand, where they slipped up, and the angle they both missed.

  ### Turn 1: Dana
  **The Move:** The "No Victim, No Foul" Argument.
  Dana argues that a promise is a transaction between living people. If the recipient is gone, the obligation dissolves because there's no one left to feel the betrayal.
  **Who has the better of it:** **Dana starts strong.**
  It's an intuitive, common-sense position. Most people operate on the idea that morality is about how we treat the living.
  **The Overreach:** She reduces a promise to nothing more than "keeping someone happy." This ignores the promisor's own integrity. If I promise a dead friend I'll look after their dog, and then I dump the dog at a shelter the day after the funeral, everyone would agree I did something wrong, even if the friend doesn't know. Dana's logic doesn't account for *self-respect*.

  ### Turn 2: Marcus
  **The Move:** The "Integrity of the Institution" Argument.
  Marcus counters that the reliance happened *in the past*. The mom died *relying* on that promise. He also argues that if promises expire at death, they aren't real promises.
  **Who has the better of it:** **Marcus takes the lead here.**
  He correctly identifies that the "harm" happened at the moment of death if the promise was already broken in spirit. He also hits a strong nerve with the "theater" comment—if deathbed promises don't count, we are just performing comfort for the dying rather than making commitments.
  **The Overreach:** He gets a little too absolute with "it doesn't get to quietly expire." Life changes. If Rob becomes destitute, most people would agree the promise is voidable. Marcus hasn't yet accounted for extreme hardship.

  ### Turn 3: Dana
  **The Move:** The "Cost to the Living" Argument.
  Dana pivots. She stops arguing about the mom and starts arguing about Rob (and his kids). She frames Marcus's view as worshipping a rule at the expense of real human welfare.
  **Who has the better of it:** **Dana wins this round.**
  This is her strongest point. She exposes the cruelty of Marcus's absolutism. If keeping a promise ruins the promisor's life, the promise becomes a weapon. By bringing Rob's kids into it, she raises the stakes: is a cottage worth your children's financial security? That's a hard sell for Marcus to beat.
  **The Overreach:** "Bossed around by a word" is a bit dismissive. It frames moral duty as weakness, which isn't always true. Sometimes doing the hard thing *is* the point.

  ### Turn 4: Marcus
  **The Move:** The "Gift of Peace" & Third-Party Reliance.
  Marcus argues that the mom received something tangible (peace of mind) in exchange for the promise. He also introduces new stakeholders: the sister and the kids, who allegedly know about the promise.
  **Who has the better of it:** **It's a wash, but he gets dinged for shifting.**
  The "peace of mind" point is excellent. He's right that the mom *did* receive something while alive. However, bringing up the sister and kids is a tactical error. He's expanding the scope because his original argument (just the mom) was getting squeezed by Dana's "cost" argument.
  **The Overreach:** He's moving the goalposts. The promise was to the mom. If the sister doesn't care (as your setup says), his point about "other people counting on it" collapses. Also, assuming the kids are "counting on it" is risky; kids usually count on *money*, not a leaky cottage.

  ### Turn 5: Dana
  **The Move:** The "Deathbed Coercion" & Consistency Check.
  Dana pounces on the goalpost shift. If the binding force is now the sister, but the sister doesn't care, the obligation vanishes. She also introduces the idea that deathbed conversations are emotionally charged and ambiguous.
  **Who has the better of it:** **Dana closes stronger.**
  She catches the inconsistency in Marcus's argument perfectly. Her point about "not every sentence... comes with a mortgage" is crucial. People say wild things to comfort dying parents ("I promise I'll never smoke again," "I promise I'll marry within the faith"). We generally agree those aren't binding contracts.
  **The Overreach:** She dismisses the "peace of mind" transfer too easily. Even if the mom is gone, the fact that she *died peaceful* because of Rob's word is a real thing that happened, regardless of whether she can "hold" it now.

  ---

  ### The Verdict
  **Dana had the slightly better of the argument.**
  Marcus won on the definition of a promise (it shouldn't just vanish), but Dana won on the application (the cost is too high, and the context is ambiguous). Marcus was arguing about *honor*; Dana was arguing about *harm*. In a practical situation involving money and kids, the harm argument usually carries more weight.

  However, they both missed the actual solution because they were arguing about **Rob's duty** rather than **the Mom's intent**.

  ### The Missing Angle: The "Benevolence Clause"
  Neither Dana nor Marcus asked the most important question: **What did the mother actually want for Rob?**

  Here is the angle that breaks the deadlock:
  Most parents, when extracting a promise from a child, do not intend for that promise to become a burden that ruins the child's life. If Rob's mom knew that keeping the cottage meant Rob couldn't pay for his kids' needs or fix his roof, she likely would have released him from the promise.

  **The "Spirit vs. Letter" Argument:**
  1.  **Intent:** The promise was likely made to preserve a *memory* or a *safe place*, not to shackle Rob financially. If the cottage becomes a financial anchor that sinks Rob, keeping it violates the spirit of the mother's love.
  2.  **Stewardship vs. Ownership:** Rob isn't the owner of the promise; he's the steward. A good steward knows when an asset is no longer viable. Selling the cottage isn't breaking the promise if the proceeds are used to secure the family the mom also loved.
  3.  **The Middle Ground:** The promise was "never sell the cottage." It wasn't "never sell the cottage even if it ruins your life." There is a moral off-ramp here. Rob could sell the cottage, but perhaps put a conservation easement on the land so it can't be developed, or give his sister first right of refusal.

  **Why this wins:**
  It validates Marcus's point (the promise matters and isn't just "words") but validates Dana's point (Rob shouldn't suffer unnecessarily). It honors the mother not as a taskmaster, but as a parent who wanted her son to be okay. If Rob sells the place to save his financial skin, he isn't betraying her; he's doing exactly what she'd want him to do if she were standing there watching him struggle.

  **Summary for your friends:**
  Tell Dana she was right that Rob shouldn't be martyred for a rule, but tell Marcus he was right that the promise meant something real. The solution isn't to pick a winner, but to realize that a mother's promise usually comes with an invisible asterisk: *"As long as it doesn't hurt you."*
