      *   **Format:** Go through the argument turn-by-turn (1-5), evaluate who has the better case at each step, identify strong moves/overreaches, and then offer a new angle/perspective neither saw.
      *   **Tone:** American English, analytical but accessible (they aren't philosophers), fair-minded.
      *   **Context:** Cookout argument, friends, emotional stakes (death, money, family).

  2.  **Deconstruct the Argument (Turn-by-Turn):**

      *   **Turn 1 (Dana):**
          *   *Claim:* Promises bind only if someone is alive to be let down. Death ends the obligation.
          *   *Strengths:* Pragmatic. Focuses on the *harm* principle (who is hurt?).
          *   *Weaknesses:* Reduces promising to mere satisfaction of the promisee. Ignores the promisor's integrity.
          *   *Verdict:* Strong intuitive start, but philosophically thin.

      *   **Turn 2 (Marcus):**
          *   *Claim:* The reliance happened *while she was alive*. Promises shouldn't expire due to inconvenience. Deathbed promises have special weight.
          *   *Strengths:* Focuses on the *moment of promising* and the integrity of the institution of promising. Addresses the "deathbed" context.
          *   *Weaknesses:* "Theater" accusation is strong but maybe too harsh. Doesn't fully address the cost to Rob.
          *   *Verdict:* Stronger than Turn 1 because it addresses the *nature* of a promise, not just the consequence.

      *   **Turn 3 (Dana):**
          *   *Claim:* Marcus is protecting an abstract rule, not the person. Rob paying a real cost for an abstract rule harms the living (kids). Dramatic promises shouldn't bind longer.
          *   *Strengths:* Brings in the *cost* to the living (Rob's kids). Challenges the "sacredness" of the promise vs. real-world harm.
          *   *Weaknesses:* "Bossed around by a word" is a bit reductive. Assumes the cost outweighs the moral duty without proving it.
          *   *Verdict:* Very strong move. Shifts from "does the promise exist?" to "is keeping it worth the harm?"

      *   **Turn 4 (Marcus):**
          *   *Claim:* If it expires at death, it wasn't a promise. He gave her something real (peace of mind). Third parties (sister, kids) also rely on it.
          *   *Strengths:* "Handed her something real" (peace of mind) is a great point. Introduces third-party reliance.
          *   *Weaknesses:* Slightly shifts goalposts (from mom to sister/kids). "He could of just said something nice" is a bit binary.
          *   *Verdict:* Strong, especially the "peace of mind" argument. The third-party point is a bit of a stretch depending on facts.

      *   **Turn 5 (Dana):**
          *   *Claim:* Switching beneficiaries (mom vs. sister) is inconsistent. "Handed her what?" (She can't hold it). People say things to dying people that aren't literal contracts.
          *   *Strengths:* Catches the goalpost shift. Highlights the emotional coercion of deathbed scenarios ("not every sentence... comes with a mortgage").
          *   *Weaknesses:* Dismissing the "peace of mind" transfer is a bit cold.
          *   *Verdict:* Strong finish. Highlights the ambiguity of deathbed conversations.

  3.  **Evaluate the "Winner":**
      *   It's a draw, but they are arguing past each other slightly.
      *   Dana argues from *Consequentialism* (Who gets hurt now?).
      *   Marcus argues from *Deontology* (Duty/Rules/Integrity).
      *   Neither fully wins because they value different things.

  4.  **Identify the Missing Angle:**
      *   What's missing?
          *   *Rob's Agency:* They are talking *about* Rob, not *to* him.
          *   *The Nature of the Asset:* It's a cottage, not a bank account. It has sentimental value vs. financial value.
          *   *The "Promise" Definition:* Was it a promise or a vow? Was it conditional?
          *   *The Mother's Intent:* Did she want him to suffer? Usually, parents don't want kids to suffer for their sake.
          *   *Compromise:* Sell and keep the proceeds? Sell with a right of first refusal?
      *   *Best Missing Angle:* The **Intent of the Deceased regarding the Promisor's Welfare**. Most parents promise *for* the child's benefit (peace), not *at the child's expense*. If keeping the promise ruins Rob, it likely violates the spirit of the mother's wish.

  5.  **Drafting the Response (Iterative refinement):**
