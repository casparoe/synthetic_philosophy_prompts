  7.  **Final Polish:** Check against the prompt requirements (turn by turn, who has better of it, overreaches, new angle).

      *(Self-Correction on "American English"):* Ensure spelling (color/colour - use color), vocabulary (cookout, mortgage, bossed around), and rhythm feel natural to a US context.

