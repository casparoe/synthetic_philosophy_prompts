prompt: |-
  ok so i've got this friend, dana, who collects old paintings and has been thinking way to hard about why we value originals over fakes. she's given me a bunch of verdicts over the years and i've been trying to reverse-engineer the rule she's actually running, because i don't think it's as simple as "originals are just better." here's what she's said so far:

  - a master forger makes a perfect copy of a famous painting, totally indistinguishable from the real thing. dana says the forgery is worth a lot less than the original.
  - now make the forgery actually a better painting than the original — more beautiful, technically superior, the whole thing. dana still says it's worth less than the original, though she'll grant it's worth more than a mediocre knockoff.
  - a museum puts out a high-quality reproduction, clearly labeled as a reproduction. dana says it's worth far less than the original, though she's fine hanging it in her hallway.

  the new case i want her verdict on: there's a painting in a public museum that everybody — curators, art historians, the public — is convinced is the genuine original by the artist. in reality it's a perfect forgery that was never caught. it's intrinsically identical to the real original (which exists, is sitting in a private vault, and is indistinguishable from the forgery in every way that matters aestheticly). so the only difference between the two is that one has the genuine history and the other doesn't, and everyone believes the forgery is the real one. how does dana value the painting in the museum?

  i care more about the reasoning than the single answer. what are the plausible principles she could be running that fit all three verdicts above? what does each one predict for the museum case? which do you think is her actual rule, and why? and is there a further case that would finally tell the rules apart?

  also be honest about how confident you are in each part of this — the rule identification, the predictions, the best guess — and single out the one point you're least sure about.
