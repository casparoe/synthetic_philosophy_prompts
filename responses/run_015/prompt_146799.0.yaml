      *   Cantor's Diagonal Argument assumes a list of all real numbers exists (actual infinity).
      *   It constructs a new number by changing the $n$-th digit of the $n$-th number.
      *   Finitists (like Brouwer or strict finitists) argue that an infinite sequence is a process, not a completed totality.
      *   The "missing" number is defined by an infinite rule, but does it *exist* as a completed object?
      *   The tension: The logic holds formally, but the ontological status of the resulting real number is disputed.

  3.  **Drafting - Attempt 1 (Mental Outline):**
      Imagine a librarian trying to catalog every possible infinite decimal expansion. Cantor says if you list them, I can write a new one by changing the diagonal digits. But to write this new number, you must complete an infinite task of checking every row. A finitist argues you can never finish writing this number because infinity is a process, not a destination. The logic works if you assume the list exists all at once, but the finitist says the list is never complete. So the "missing" number is just a rule for generating digits, not a finished object. The tension is about whether the number exists before you finish calculating it.

  4.  **Refining and Condensing (Focusing on Constraints):**
      *   Need a concrete scenario. The "librarian" or "catalog" works.
      *   Need to highlight the "digit-by-digit reversal" as a procedure vs. object.
      *   Need to specify the finitist objection (ontological commitment).
      *   Word count check (max 180).

