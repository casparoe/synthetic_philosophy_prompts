answer: |-
  A religious hospital board must adopt a single End-of-Life Protocol governing whether sedatives may be administered to terminally ill patients in doses that risk hastening death. The Traditionalist Faction (TF) views active killing by hospital staff as intrinsically evil yet retains a duty of charity, while the Pragmatic Care Faction (PCF) views unmanaged agony as the paramount moral failure, regarding TF's restriction as cruel negligence. The baseline is a tied board vote resolved by a rotating Chair, yielding a 50% chance of TF's "no risk" ban and a 50% chance of PCF's "staff-administered maximal sedation" policy. The compromise deal adopts PCF's maximal sedation protocol fully, satisfying their demand for pain relief, but stipulates that the drugs must be administered by an external contracted hospice team rather than hospital employees, satisfying TF's side-constraint against their own agents directly causing death while allowing them to fulfill their duty of care through the other side's arrangement. TF concedes the risk of death (a cost to them, but less than direct agency), and PCF concedes direct staff control (a cost to them, but less than patient suffering), leaving both better off than the coin flip where TF faces a 50% chance of violating charity and PCF faces a 50% chance of total ban. If TF's constraint is reinterpreted to cover permitting or funding the external team, the deal collapses unless the external team is funded by a separate patient-established trust, creating a workaround that preserves the agency separation without TF financial complicity.

  **Rankings**
  *   **Traditionalist Faction (TF):** 1. Total Ban (Ideal: No sin, though charity limited). 2. The Deal (External Admin: Sin avoided, charity fulfilled). 3. Coin Flip (Risk of Staff Sedation). 4. Staff Sedation (Worst: Direct sin).
  *   **Pragmatic Care Faction (PCF):** 1. Staff Sedation (Ideal: Max control/relief). 2. The Deal (External Admin: Relief secured, control reduced). 3. Coin Flip (Risk of Ban). 4. Total Ban (Worst: Negligence).
  *   *Note:* For both, the Deal is strictly preferred to the Coin Flip because it eliminates the risk of their worst outcome (Staff Sedation for TF, Ban for PCF) while securing their primary positive goal (Charity for TF, Relief for PCF).

  **The Single Feature**
  The feature doing the work is the **separability of agency from outcome**. The compromise relies entirely on the fact that TF values *who* performs the act (deontological constraint) more than *whether* the act occurs, while PCF values *whether* the act occurs (consequentialist goal) more than *who* performs it. If you remove this separability—if TF believes permitting the outcome is morally equivalent to performing it, or if PCF believes relief is invalid unless administered by their own staff—the gain from trade vanishes. In either case, the parties revert to the coin flip because the axes of valuation are fused; the swap requires them to be orthogonal.

  **Hardliner Objection & Verdict**
  *Objection:* A TF hardliner argues the deal is morally corrupting because it institutionalizes a practice TF deems evil. By voting for the protocol, TF members become co-authors of a policy that permits hastening death, legitimizing the PCF's immoral worldview within the hospital's governance. The external contractor is a fiction; the board's approval makes the death happen, rendering the agency distinction a loophole for complicity rather than a moral boundary.

  *Verdict:* This objection **does not land**. It fails because it conflates *formal cooperation* with *material cooperation*. The constraint was explicitly agent-relative ("*our* agents directly causing death"), not outcome-relative ("death occurring"). Respecting agent-relative constraints is a core feature of deontological ethics; exploiting the distinction between doing and allowing is not blackmail but a recognition of moral topology. If TF's values truly forbid *permitting* the outcome, they should have stated that constraint initially; given the constraint as defined (conduct-based), the deal respects their values better than the lottery, which risks direct violation. To reject the deal is to prioritize moral purity over actual patient care, which contradicts their own retained duty of charity.
