prompt: |-
  Write a deadpan parody of an official government recruitment brochure and onboarding manual for a national legislature filled entirely by sortition—call the institution the “National Civic Lottery Assembly” (NCLA). Format the piece as numbered bureaucratic sections, approximately 600–700 words, in the cheerful but relentless voice of a Ministry of Democratic Renewal. The satire should exaggerate real arguments from lottocratic theory—descriptive representation, the elimination of campaigning and its associated corruption, the epistemic value of cognitive diversity among ordinary citizens, and the claim that randomly selected laypeople can legislate competently when given expert briefing—while pushing each to an absurd conclusion that exposes hidden tensions: that “consent of the governed” becomes a statistical property of the sample rather than an individual choice; that accountability is replaced by mandatory attendance, a “legislative satisfaction guarantee,” and a formal refund policy for citizens harmed by bad laws; that expertise is permanently outsourced to an unelected administrative class while the randomly selected assembly retains formal sovereignty; and that the lottery must remain rigorously random even when it produces dangerous demographic skews or manifest incompetence. Include at least one invented testimonial from a satisfied citizen-legislator who was selected while grocery shopping and now presides over environmental regulation. Stay fully deadpan—never wink or break character—so that a reader familiar with democratic theory recognizes the parody understands the actual claims (e.g., the tension between randomness and competence, or between statistical representation and individual consent), while a general reader can still follow the bureaucratic absurdity on its own terms. Do not cite specific scholars, texts, or historical institutions by name; render all theoretical commitments in bureaucratic jargon. After the brochure, provide a brief structured summary as a JSON object with exactly these fields: “target_of_satire” (the specific democratic-theory claim being exaggerated), “absurd_extension” (the reductio conclusion reached), “bureaucratic_mechanism” (the fictional administrative feature that enacts the absurdity), and “deadpan_justification” (the in-world reasoning that makes the absurdity sound administratively reasonable).
