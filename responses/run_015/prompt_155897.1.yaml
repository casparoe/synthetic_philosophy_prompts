answer: |-
  Your proposition is strikingly precise. To view the Ministry of Truth not as a factory of invented tradition but as a engine of anti-tradition aligns profoundly with the ontological horror of the novel. Hobsbawm argues that invented traditions are deployed to legitimise institutions by fabricating continuity with a suitable past. They are meant to stabilise. The Party, however, seeks no legitimacy in the historical sense; it seeks omnipotence. Therefore, continuity is a threat, not an asset. If the past is fixed, it stands as a judgement upon the present. By keeping the evidentiary base in perpetual flux, the Party ensures that no external standard exists against which its current assertions can be measured.

  Let us apply this to Winston's labour. His work is not merely propaganda; it is the systematic dismantling of epistemic infrastructure. In a normal nation-state, even a dishonest one, archives serve as a brake on falsehood; there is a cost to altering the record. In Oceania, the record is the only reality. When Winston alters a production figure or removes a reference to an unperson, he is not covering up a mistake; he is demonstrating that truth is mutable. This resists Hobsbawm's framework because Hobsbawm assumes the inventors of tradition wish to be believed in the long term. The Party does not care about belief in the long term; it cares about compliance in the immediate moment. The 'tradition' is that there is no tradition, only the will of the Party.

  This leads us to the Two Minutes Hate. Anderson's concept of the imagined community relies on a sense of simultaneous time—strangers knowing that others are reading the same newspaper or singing the same anthem at the same moment. The Two Minutes Hate mimics this simultaneity perfectly. It is a ritual of shared affect. However, Anderson assumes this shared narrative builds a community bound by common identity. In the novel, this ritual builds a crowd bound by common fear and directed aggression. It is an imagined community of enemies, not citizens. It sustains the regime not by fostering a sense of belonging to a historical nation, but by fostering a sense of belonging to a perpetual emergency. Here, Orwell pushes beyond Anderson: he suggests that the mechanisms of the imagined community can be hijacked to create an anti-community, where the only shared trait is submission to the same authority and hatred of the same target.

  The photograph you mention is the crux of the epistemic argument. In Anderson's model, print capitalism and reproducible texts allow the community to imagine itself across time. The photograph represents a fixed point in physical reality that contradicts the narrative. Its existence suggests that the past possesses an integrity independent of the Party's will. When Winston holds it, he holds evidence that the triad of accused traitors was actually present at a function they were later said to have missed. The destruction of such evidence is not just censorship; it is the destruction of the stable infrastructure required for any collective memory to exist. Without stable archives, monuments, or reproducible texts, you cannot have an imagined community because you cannot have a shared reference point. You have only a managed population, reacting to stimuli provided by the state. The novel indeed suggests that without this infrastructure, collective self-imagination collapses into collective hallucination.

  Regarding the proles, your distinction is vital. They possess an oral continuity—songs, stories, memories of life before the Revolution—that functions outside institutional mediation. However, Anderson argues that the nation is imagined because the members will never know most of their fellow-members, yet in the minds of each lives the image of their communion. The proles lack this image. They have memory, but they lack political consciousness. They are a class, not a nation. Their oral tradition is fragmented and localised; it does not scale to the level of the state. Orwell seems to suggest that oral continuity alone is insufficient to challenge a technocratic tyranny. It provides resilience, perhaps, but not leverage. They are the repository of human nature, but not the agents of history. This supports your view that they embody an absence of national consciousness rather than an authentic one. They are the soil, but not the plant.

  Finally, Room 101 represents the terminal point of this anti-tradition. If the Ministry of Truth destroys public memory, Room 101 destroys private memory. Tradition relies on the transmission of values and facts from one generation to the next, and from the collective to the individual. By forcing Winston to betray Julia, the Party severs the link between internal conviction and external expression. It destroys the individual's capacity to hold a truth that contradicts the collective. When the process is complete, the subject is no longer capable of imagining a community different from the one dictated by the Party. The epistemic infrastructure is not just destabilised; it is internalised as falsehood.

  Where does this lens resist the text? Orwell's depiction resists reduction to a theory of modern nation-building because the Party explicitly rejects the goal of a nation. They state clearly that their aim is not the welfare of the people or the continuity of the state, but power for its own sake. Hobsbawm and Anderson describe how states consolidate power to survive and flourish. Orwell describes a entity that consumes its own history to maintain a state of permanent tension. The Party is not building a community; it is dismantling the human capacity for community to replace it with a hive mind. To apply theories of nation-building to Oceania is somewhat like applying biology to a machine; the categories of legitimacy and continuity simply do not apply to a system designed to operate without them.

  To answer your question on what would change my mind: I would be persuaded that the Party is preserving an authoritarian tradition if there were evidence of unchangeable myths that served as a bedrock for their ideology. For instance, if the origin story of Big Brother were fixed and treated as sacred, immune to alteration despite changes in policy. If the Party relied on a specific historical narrative to justify its rule rather than asserting that reality is whatever they say it is at this moment, then they would be inventing tradition rather than destroying it. Currently, the text suggests that even the enemy changes (Eastasia versus Eurasia) without explanation, and the population is expected to accept the switch instantly. This fluidity is the hallmark of anti-tradition.

  Regarding the proles, I would be persuaded that they embody an authentic national consciousness if their oral culture showed signs of coalescing into a political programme. If their songs contained coded messages of resistance that were widely understood and acted upon, or if their memories of the past formed a coherent counter-narrative that unified them across districts, they would fit Anderson's model of a subaltern nation imagining itself. Instead, their memories are dismissed as irrelevant by the Party and seem to lack cohesion even among themselves. They are depicted as loyal only to each other in small units, not to the concept of 'the people' as a political entity.

  I must indicate where my reasoning is most vulnerable. The primary weakness lies in the assumption that the Party's actions are perfectly successful. The theory of anti-tradition assumes the erasure is total. However, the very existence of Winston's rebellion, however futile, suggests that the epistemic infrastructure cannot be fully destroyed as long as human consciousness persists. There is a tension in the novel between the Party's theoretical ability to control reality and the practical necessity of relying on human agents to do the controlling. Winston's job exists because someone must remember the old facts to change them. This implies a residual archive in the minds of the workers. If the anti-tradition were perfect, the Ministry of Truth would not need to employ people to alter records; it could simply generate new ones ex nihilo. The need for correction implies the past has a weight that must be actively countered. This suggests that tradition is not erased, but merely suppressed, requiring constant energy to maintain the suppression.

  Furthermore, there is a vulnerability in applying Anderson too strictly. Anderson focuses on the rise of nationalism through print capitalism. Oceania is a post-capitalist, post-national entity. It is an empire without borders. To argue that it fails to be an imagined community might be to judge a fish by its ability to climb a tree. The Party may have successfully created a new form of community—one based on negative solidarity and real-time surveillance—that Anderson's nineteenth-century-derived framework cannot anticipate. In this view, the Two Minutes Hate is not a failure of community building, but a success in creating a new type of bond that does not require historical continuity.

  In summary, your lens of anti-tradition illuminates the novel's unique contribution to political philosophy. It moves beyond the idea of the lie to the idea of the void. The Party does not want you to believe a false past; it wants you to accept that the past is irrelevant. This requires the destruction of the archives, the monuments, and the private memory that constitute the epistemic infrastructure of any community. The proles remain outside this not because they are free, but because they are ignored, preserving a biological continuity that lacks political form. The novel ultimately suggests that without stable evidence, there can be no community, only a collection of isolated subjects held together by force and fear.
