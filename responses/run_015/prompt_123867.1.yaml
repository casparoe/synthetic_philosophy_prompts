      *   If we say they are *excused*, we imply they aren't fully responsible. But does that remove liability? In self-defense theory, you can kill someone who is non-liable but threatening (innocent aggressor), though it's tragic.
      *   Actually, the "Excuse" move is often used to preserve the *legal* equality of combatants while conceding the *moral* inequality. This is the "Pragmatic Compromise."
      *   *Verdict:* It doesn't break the theoretical deadlock, but it offers a practical synthesis.

