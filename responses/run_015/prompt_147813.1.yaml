answer: |-
  (1) Reconstruction of the implicit theory
  The implicit theory is a **Doctrine of Biological Inalienability limited by Regenerability.** It posits that market boundaries are drawn at the point where exchange threatens the permanent integrity of the biological subject or immediate survival conditions. Kidneys are protected because their loss is irreversible and vital, compromising the seller's biological status. Plasma and eggs are permitted because they are regenerative; the body recovers, preserving the seller's long-term integrity. Similarly, anti-price-gouging statutes protect access to survival goods (water, fuel) because denial threatens immediate biological continuity during crises. Labor, however, is categorized differently: it is viewed as an exercise of agency rather than a depletion of biological stock. Even during crises, labor is treated as a commercial capacity that the agent actively deploys, not a passive survival input like water. Thus, the theory distinguishes between **constitutive biological endowments** (organs, survival goods) which are shielded from market volatility, and **instrumental biological outputs** (plasma, labor) which are subject to market pricing. This rationalizes why you cannot sell a kidney (endowment) but can sell plasma (output), and why you cannot price-gouge water (survival input) but can fluctuate wages (agency output). The moral status hinges on whether the commodity is seen as essential to *being* a functioning agent versus *acting* as one. The underlying assumption is that market participation is permissible only when the agent retains the physical substrate required for future agency. This framework relies on a specific metaphysics of the person: the body is a vessel that must remain intact to house the moral agent, but its outputs are separable property. Consequently, emergency goods are protected because they sustain the vessel externally, whereas labor is the vessel's action. The theory assumes that while the market can price actions and surplus materials, it cannot price the conditions of existence themselves without negating the autonomy it purportedly respects. This creates a protective perimeter around biological continuity, allowing commerce only where the biological baseline remains secure. Ultimately, the state acts as a guardian of the biological baseline, intervening only when market forces threaten to erase the conditions necessary for agency itself.

  (2) Strict presuppositions versus contingent fits
  Strictly speaking, this pattern presupposes that regenerability is a morally relevant threshold for commodification. It logically requires that we view the body as having distinct zones: protected core versus tradeable surplus. It also requires distinguishing consumption (passive need) from labor (active sale). However, much of the current alignment is contingent. The specific classification of eggs as "surplus" rather than "vital" is scientifically and morally debatable, yet legally settled. Similarly, the exclusion of labor from price-gouging protections is likely a historical artifact of labor law's separation from consumer protection, not a necessary philosophical truth. The pattern fits the theory, but the theory does not strictly demand *these* specific boundaries; one could argue labor is as vital as water. The institutional fit is loose enough that political lobbying and historical precedent likely dictate specific inclusions (like fuel) as much as moral logic. For instance, the definition of "emergency" goods often excludes housing or healthcare, suggesting the boundary is political rather than purely biological. Thus, while the theory explains the *structure* of the distinction, it does not necessitate the specific *content* of the regulations. The logical requirement is merely that *some* line be drawn between protected and tradeable; the current location of that line is not logically fixed by the theory itself.

  (3) Philosophical underdetermination
  Rival theories abound. A **Market Failure** account suggests organs are banned due to information asymmetry and coercion risks, while plasma is regulated to ensure safety. Price gouging laws prevent monopoly exploitation, while labor markets are presumed competitive. Alternatively, a **Social Meaning** theory (Sandel) argues markets corrupt the meaning of gifts (organs) and solidarity (disaster relief), but labor retains commercial meaning. Practice offers no decisive reason to choose because the boundaries shift. If coercion is the worry, paid plasma is equally coercive for the poor as kidney sales. If social meaning is key, surrogacy should be banned like kidneys, yet it is often permitted. The current patchwork allows multiple interpretations: it could be about harm, meaning, or vulnerability. Without a clear metric for "vitality" or "coercion," the existing laws underdetermine the true moral justification. One could equally argue that the pattern reflects a **Paternalistic Consistency**, where the state protects citizens from irreversible mistakes (organs) and temporary desperation (gouging), but trusts them to negotiate labor contracts. Since each theory can accommodate the exceptions (plasma, surrogacy) by tweaking definitions of harm or meaning, the institutional practice itself does not validate one philosophical foundation over another. The data is compatible with too many normative frameworks to be evidentiary.

  (4) Counterfactual redesign
  To adopt the principle that **none essential to bodily function or crisis survival should be priced**, significant redesign is needed. First, expand organ bans to include plasma and eggs, treating all bodily materials as inalienable. Second, commercial surrogacy would be prohibited as commodifying reproductive capacity. Third, and most radically, labor markets during crises would require mandatory wage premiums or price caps, treating labor power like emergency water—essential for survival and thus shielded from market volatility. Conversely, adopting the principle that **all essential capacities may be priced** would legalize kidney sales, repeal anti-price-gouging statutes, and deregulate crisis labor markets entirely. Either uniform principle collapses the current distinction between constitutive endowments and instrumental outputs, forcing a total harmonization of bodily and economic regulations. Both approaches require dismantling the hybrid system currently in place. Such shifts reveal the instability of the current compromise.
