prompt: |-
  I'm in a philosophy seminar on commodification and market boundaries, and I've noticed an institutional pairing that the standard literature on kidney sales and price gouging rarely treats together. In many jurisdictions, the direct sale of human organs is criminalized, yet paid plasma donation, compensated egg retrieval, and in some regions commercial surrogacy are permitted and actively regulated. Those same legal systems enforce temporary anti-price-gouging statutes that treat emergency goods—fuel, water, and prescription drugs—as non-commodifiable during declared disasters, but they apply no analogous protection to labor: employers may offer hazard pay during crises, yet mandatory wage premiums or price caps on labor are absent. I want to understand what implicit theory of value and commodification, if any, holds these three domains together. Does the pattern presuppose that bodily integrity carries a categorically different moral status from labor power or emergency consumption? Or could a unified principle—concerning irreversibility, coercion risk, or social meaning—explain all three? Please structure your response in four sections: (1) Reconstruction of the implicit theory (around 300 words): articulate the view of commodification that best rationalizes the pairing; (2) Strict presuppositions versus contingent fits (around 200 words): distinguish what the institutional pattern logically requires from what merely happens to align with it; (3) Philosophical underdetermination (around 200 words): identify rival theories that could license the same pattern, and indicate where the practice offers no decisive reason to choose among them; (4) Counterfactual redesign (around 150 words): describe what specific legal or policy changes would be required if the underlying view were replaced by a uniform principle—either that all capacities and goods essential to survival may be priced, or that none essential to bodily function or crisis survival should be.
