answer: |-
  **MEMORANDUM**

  **TO:** Mid-River Cultural District Board of Directors
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Maren Voss Retrospective

  **EXECUTIVE SUMMARY**

  Following the recent allegations regarding Maren Voss's professional conduct—specifically the systematic appropriation of apprentice labor and the sabotage of a contemporary rival—I recommend the Board vote to **proceed with the retrospective under strict curatorial conditions.**

  A full cancellation risks validating claims of censorship and erasing the historical record of the work's impact. However, proceeding without amendment violates our charter's mandate to "maintain public trust." The solution lies in shifting the exhibition from a *celebration* of Voss to a *critical examination* of the work's provenance. This approach honors the "excellence" of the kinetic engineering while acknowledging the ethical failures of its production.

  **THE "SEPARATION" ARGUMENT AND THE *DRIFT* EXCEPTION**

  To make an informed decision, we must distinguish between two types of ethical contamination in art.

  **1. Biographical Contamination (The General Argument)**
  The argument that "the art stands alone" relies on the premise that meaning resides in the viewer's experience, not the maker's intent. When Voss stole *designs* or sabotaged a rival, these are moral failures external to the physical object. In this context, canceling the show arguably harms the unpaid apprentices further by erasing the evidence of their stolen labor. If we hide the work, we hide the crime. Therefore, for the majority of the collection, the "separation" argument holds: we display the work *in order to* critique the context.

  **2. Material Contamination (The *Drift* Exception)**
  The piece *Drift* presents a distinct category. Reports indicate the physical materials comprising the installation were stolen from the rival's studio. Here, the immoral act is not biographical context; it is **constitutive matter.** You cannot separate the art from the artist when the artist's theft is the literal substrate of the object.

  In this specific instance, the "Death of the Author" theory collapses. The object is not just an aesthetic experience; it is evidence of conversion (theft of property). Displaying *Drift* without acknowledging its material provenance would make the Mid-River Cultural District complicit in laundering that theft. Therefore, *Drift* cannot be presented as a standard exhibit piece. It requires specific labeling regarding its material origins, treating the stolen matter as part of the work's historical record.

  **CHARTER ALIGNMENT**

  *   **Promoting Artistic Excellence:** We acknowledge the kinetic innovation of the 90s installations. These pieces influenced a generation of engineers and sculptors. Erasing them diminishes the historical record.
  *   **Maintaining Public Trust:** Trust is not maintained by ignoring harm, but by addressing it transparently. A "business as usual" retrospective suggests we value prestige over ethics. A "recontextualized" retrospective demonstrates that we value truth.

  **RECOMMENDATION: GO-WITH-CONDITIONS**

  I move that the Board approves the retrospective contingent on the following four conditions:

  1.  **Curatorial Reframing:** The exhibition title must change from "Maren Voss: A Retrospective" to something indicative of critical inquiry (e.g., *Maren Voss: Kinetics & Provenance*). Wall text must explicitly detail the labor practices used to create the installations.
  2.  **Apprentice Attribution:** Where designs were appropriated, wall labels must read "Design attributed to [Apprentice Name], realized by Voss Studio." We must restore the intellectual property to the victims.
  3.  **The *Drift* Protocol:** *Drift* may be displayed only with a prominent placard detailing the credible reports regarding the source of its materials. We do not remove it (which hides evidence), but we do not aestheticize it (which validates the theft).
  4.  **Financial Restitution:** 15% of all exhibition-related revenue (ticket sales, catalog, merchandise) be directed to a fund supporting early-career artist legal aid, administered by a third party.

  **IMPLEMENTATION TIMELINE**

  If approved on Tuesday, October 24, the following timeline ensures we meet the opening without compromising due diligence:

  *   **Oct 25–27 (Curatorial Sprint):** Curators work with legal counsel to finalize language for wall texts regarding the allegations. Contact living apprentices to verify attribution preferences.
  *   **Oct 30 (Public Statement):** MRCD issues a press release acknowledging the allegations and outlining the new curatorial framework. This preempts accusations of a "cover-up."
  *   **Nov 1–10 (Installation):** Installation of *Drift* with required provenance labeling. Printing of revised catalogs/ guides.
  *   **Nov 15 (Programming):** Announce a symposium on "Ethics in Production" to run parallel to the exhibit, inviting critics and the affected apprentices to speak.
  *   **Dec 1 (Opening):** Exhibition opens under new framework.

  **CONCLUSION**

  We are not here to judge Voss's soul; we are here to steward culture. By separating the *object* from the *myth*, we can preserve the kinetic brilliance of the work without endorsing the exploitation that created it. This path allows us to keep the art visible while ensuring the harm is not rendered invisible.

  I request a motion to approve the retrospective subject to the conditions outlined above.
