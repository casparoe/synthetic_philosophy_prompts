answer: |-
  **Question 1 (Overdetermination)**
  Your non-proxy thesis stipulates that moral worth is undermined when an action is overdetermined by both a direct normative reason and a proxy reason, unless the direct reason is causally efficacious. In cases of symmetric overdetermination, where both reasons appear sufficient to produce the action, what specific metaphysical or psychological criterion do you propose for distinguishing a genuinely efficacious moral motive from one that is merely epiphenomenal? How do we avoid the conclusion that the presence of *any* concurrent proxy renders the moral motive suspect by default?

  **Question 2 (Overdetermination Follow-up)**
  *I anticipate you will invoke a counterfactual dependence test—arguing that the moral reason is efficacious only if, had the proxy reason been absent, the agent would still have acted on the moral reason.* If we adopt that test, are you not vulnerable to "masking" cases where the moral reason is present and causally active, but the agent would not have acted without the proxy's support? Does your view thereby inadvertently require the moral reason to be *sufficient* on its own, rather than merely efficacious, and does this not set the bar for moral worth implausibly high?

  **Question 3 (Motivational Residues)**
  You argue that motivational residues—dormant countervailing desires that play no causal role—do not undermine moral worth. However, in contexts of sustained, demanding care, these residues often manifest phenomenologically as a background tone of resentment or exhaustion that permeates the interaction, even if it does not trigger the action. Can a motivational residue be causally inert regarding the *decision* to act, yet still constitutively alter the *character* of the action in a way that negates worth?

  **Question 4 (Motivational Residues Follow-up)**
  *I expect you will deny that phenomenological coloring is normatively relevant, maintaining that worth tracks the causal history of the motivation rather than the qualitative feel of the experience.* But if the phenomenology of an act is the primary way the recipient experiences the agent's regard, are you not severing moral worth from the interpersonal reality of the act? If the "feel" of the care is one of grudging obligation due to these residues, does it matter for worth that the resentment was causally inert, or does the expressive quality of the action itself carry normative weight?

  **Question 5 (Higher-Order Ignorance)**
  Consider an agent who acts directly from a structurally transparent normative reason but falsely believes she is acting from a heuristic proxy—for instance, she cares for a dependent because she grasps the value of their dignity, but she mistakenly conceptualizes her motive as merely "following the rules of care." Does this agent possess moral worth on your view? Does the agent's false self-conception regarding the source of her motivation defeat the worth, even if the *de re* motivation is correct?

  **Question 6 (Higher-Order Ignorance Follow-up)**
  *I suspect you will defend a de re requirement on motivation, arguing that the actual metaphysical grounding of the motive matters more than the agent's de dicto description of it.* However, if structural transparency requires the agent to grasp the reason's authority without treating it as a weight in a calculus, does not a false self-conception indicate a failure of that very transparency? If the agent thinks she is following a proxy, is she not, by definition, failing to grasp the authority of the normative reason *as such*, thereby collapsing the distinction between de re success and de dicto failure?

  **Question 7 (The Rarity Objection)**
  A common objection to views demanding structural transparency and the absence of proxy motives is that they render moral worth excessively rare, perhaps restricted to moments of moral sainthood or philosophical reflection. If the non-proxy thesis implies that most everyday acts of care, performed under duress with mixed motivational histories, lack moral worth, what explanatory work is the concept of "moral worth" left to do? Does your view risk making moral worth a theoretical construct that rarely maps onto the moral lives of actual agents?

  **Question 8 (The Rarity Objection Follow-up)**
  *You might respond that moral worth is meant to be an ideal, and its rarity does not diminish its normative significance.* Yet, if the concept is so idealized that it cannot guide action or offer recognition to agents struggling with the very mixed motives you describe, does it not lose its critical function? Specifically, how can we distinguish between a view that correctly identifies a high standard and one that has simply defined the concept out of existence for non-ideal agents, without appealing to the very idealization you are being asked to justify?

  **Question 9 (Supererogation)**
  Your view requires that the agent not treat the normative reason as one weight among others in a cost-benefit calculus. How, then, can your account accommodate supererogatory acts, which seem to require precisely such a calculus? To recognize an act as supererogatory, the agent must acknowledge the cost to themselves as outweighing the demand of duty, yet still choose to act. If weighing that cost violates structural transparency, does your view imply that supererogatory acts cannot possess moral worth?

  **Question 10 (Supererogation Follow-up)**
  *If you argue that the agent can acknowledge the cost without treating it as a counter-reason, thereby preserving transparency,* does this not require a psychologically implausible fragmentation of the agent's deliberative perspective? How can an agent recognize a significant sacrifice *as a sacrifice*—which is necessary for the act to be supererogatory—without that recognition functioning as a countervailing weight that threatens the structural transparency required for worth?
