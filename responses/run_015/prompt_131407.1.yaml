prompt: |-
  I've been reading popular coverage of cross-cultural moral psychology—especially the finding that WEIRD populations treat harm and fairness as nearly universal moral pillars while many other cultures weigh loyalty, authority, and purity just as heavily, and that this pattern shows up in everything from trolley-style dilemmas to judgments about family obligation. In an online discussion about whether practices like forced marriage or honor-based punishment could ever be objectively wrong, someone kept falling back on the line "different cultures, different morals—there's no right answer" to cut off any argument that one culture might be mistaken. I don't think that phrase is doing just one job, and I'm trying to understand whether it's an empirical observation, a claim about the nature of morality itself, a rule about tolerance, or something about how human minds construct values—maybe even something like "moral disagreement is more like cilantro-tasting-soap disagreement than like disagreeing about the shape of the earth." Could you lay out the distinct precise theses that one-liner could be expressing, arranged as a menu rather than a single interpretation? For each reading, say whether it is trivial, whether it is defensible given actual cross-cultural variance data, whether it is false or self-undermining, and—crucially—whether that specific reading actually licenses the move my interlocutor was making (using cultural disagreement to block any claim that a practice is genuinely wrong). I also want you to flag which readings depend on treating moral judgments like taste judgments versus treating them like factual judgments about the world, since that analogy keeps coming up in the thread. Please present this as a table with the following columns: Reading label; The precise claim it makes; Trivial, defensible, or false?; Does it justify shutting down the argument?; Key distinction or counterexample that separates it from the others. After the table, add a brief structured summary in JSON with fields "slogan", "domain_context", "number_of_readings", "reading_that_most_fits_the_shutdown_move", and "analogy_that_most_exposes_the_ambiguity". I am not looking for a bibliography or citation list—just the conceptual disambiguation I can take back to the discussion.
