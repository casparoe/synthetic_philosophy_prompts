  Evidence of **coordination**. If it can be shown that organizers are sharing "do not book" lists (active Sanction Drift), Q5 jumps from 0.3 to 0.9. This would push my final credence to **0.72**, validating the claim that this is a systemic punitive regime rather than isolated contractual decisions. Without that evidence, the "residue" argument holds, keeping the number in the ambiguous middle.
