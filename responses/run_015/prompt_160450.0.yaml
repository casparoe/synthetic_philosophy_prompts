  I calculate the final credence using a weighted average, where the **Entitlement Condition (Q2)** carries double weight because it is the necessary bridge between "harm" and "punishment." The **Due Process Link (Q4)** is also heavily weighted as it answers the "owed protections" clause of your prompt.

