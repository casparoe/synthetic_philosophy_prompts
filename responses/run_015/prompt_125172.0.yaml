answer: |-
  # Lesson Plan: The Replacement Protocols

  **Course:** Upper-Level Philosophy of Mind  
  **Topic:** Functionalism, Substrate Independence, and Phenomenal Continuity  
  **Time:** 90 Minutes  
  **Students:** 16 (Divided into 3 Groups of 5, 5, and 6)  
  **Goal:** Students generate the "Fading Qualia" dilemma through simulated first-person data without prior exposure to the argument's labels.

  ---

  ## 1. Materials & Setup

  *   **Room:** Whiteboard divided into three vertical sections (one for each Clinic).
  *   **Handouts:**
      *   **Protocol Cards:** Three distinct versions (Drip, Shadow, Hemispheric).
      *   **Patient Log:** A stack of 6 index cards per student.
      *   **Prediction Envelope:** One small envelope per student.
      *   **Pen:** One per student.
  *   **Board:** Pre-draw three axes (X: % Replacement, Y: Experience Level 0–10). Label them Clinic A, B, C.

  ---

  ## 2. Student Instructions (Handout Text)

  *Do not add commentary. Distribute this immediately upon seating.*

  ***

  **PROTOCOL SIMULATION: PATIENT CONSENT FORM**

  **Role:** You are the Subject. Your biological brain is being replaced by synthetic surrogates.
  **Stipulation:** The surrogates are functionally identical to the biology they replace. Your verbal reports and behavioral test scores **must remain constant** throughout this simulation. Regardless of how you feel internally, your mouth always says, "I feel normal," and you always pass the Turing-style behavioral tests.
  **Task:** You will track your *private* phenomenal experience only.

  **STEP 1: THE PREDICTION (Sealed)**
  On the slip of paper provided, write one number between 0 and 100. This represents the percentage of replacement at which you believe your internal experience will first *change* or *dim*. If you believe it will never change, write "NEVER."
  Seal this slip in the envelope. Do not open it until instructed.

  **STEP 2: THE LOG (Index Cards)**
  You will be guided through stages of replacement. At each stage, write the following on an index card:
  1.  **Stage ID** (e.g., "Drip-25%")
  2.  **Experience Rating:** A number from 0 (no experience/blackout) to 10 (full normal human experience).
  3.  **Consent:** "YES" or "NO" (Would you consent to proceed to the next stage?)

  **STEP 3: THE RULES**
  1.  **No Discussion:** Do not speak to other patients during the simulation.
  2.  **No Theory:** Do not use philosophical terms (e.g., "functionalism," "qualia," "zombie"). Speak only from the first-person perspective.
  3.  **Trust the Stipulation:** Do not argue that your behavior *would* change. In this scenario, it does not. Your internal rating is the only variable.

  ***

  ## 3. Minute-by-Minute Timeline

  ### 0:00 – 0:15 | Grouping & Setup
  *   **Action:** Divide class into three Clinics (A: Drip, B: Shadow, C: Hemispheric). Distribute Protocol Cards, Logs, and Envelopes.
  *   **Instructor Script:** "You are not students today. You are patients. The scenario is fixed. Your behavior is fixed. Your internal experience is the only variable. Complete Step 1 (Prediction) now. Seal the envelope. Place it face down."
  *   **Check:** Ensure no one opens the envelope.

  ### 0:15 – 0:35 | Phase 1 Simulation (0% to 50% Replacement)
  *   **Action:** You (the Instructor) act as the System Clock. Announce stages. Give 2 minutes per stage for reflection and writing.
  *   **Clinic A (Drip):** Announce Rounds 5, 10. (Tell them: "Rounds 1-4 passed. Record for Round 5." Then "Rounds 6-10 passed. Record for Round 10.")
  *   **Clinic B (Shadow):** Announce 25% Weight, 50% Weight.
  *   **Clinic C (Hemispheric):** Announce "Left Hemisphere Replaced," "Recalibration Complete."
  *   **Constraint:** Remind them verbally: "Your mouth says 'I'm fine.' Your card says what you feel."

  ### 0:35 – 0:50 | Data Collection & The Reveal
  *   **Action:** Collect all index cards from Phase 1. Keep Prediction Envelopes sealed.
  *   **Plotting:** Calculate the average Experience Rating for each Clinic at the 50% mark. Plot the three points on the board. (e.g., Clinic A avg: 8.5, Clinic B avg: 6.0, Clinic C avg: 9.0). Draw a trend line from 10 (Start) to these points.
  *   **The Reveal:** "Open your Prediction Envelopes. Look at your number. Look at the board."
  *   **Prompt:** "Turn to your Clinic group. Compare your prediction to your actual rating at 50%. Did you fade sooner than you predicted? Later? Discuss why your rating dropped (or didn't) despite the stipulation that function is fixed." (5 mins)

  ### 0:50 – 1:05 | Phase 2 Simulation (50% to 100% Replacement)
  *   **Action:** Resume simulation.
  *   **Clinic A:** Rounds 15, 20 (Final).
  *   **Clinic B:** 75% Weight, 100% Weight (Organics off).
  *   **Clinic C:** Right Hemisphere Replaced, Final Integration.
  *   **Collection:** Collect final cards. Plot the 100% endpoints on the board.

  ### 1:05 – 1:30 | Debrief & Argument Reconstruction
  *   **Action:** Full class discussion. Instructor maps activity to the philosophical argument. (See Debrief Script below).

  ---

  ## 4. Debrief Script (Instructor Notes)

  *Do not lecture. Ask these questions in order. Write key terms on the board only **after** students generate the concept.*

  1.  **The Divergence:** "Look at the board. Clinic A, B, and C ended in the exact same functional state. Yet your curves diverged. If mental states are defined *only* by functional organization, why did the curves differ?"
      *   *Target:* Students admit they tracked substrate or continuity, not just function.
      *   *Label:* **Organization Invariance.** (Write on board). "If you believe the curves *should* have been identical, you hold this principle. If you think the divergence is real, you reject it."

  2.  **The Accumulation:** "For Clinic A (Drip): Did anyone drop from 10 to 9 in a single 5% round?" (Likely no). "If no single step changes experience, but the end state is different, what has happened?"
      *   *Target:* Sorites paradox.
      *   *Label:* **Fading Qualia.** (Write on board). "This is the claim that experience dims gradually without the subject noticing."

  3.  **The Noticeability:** "If your experience faded from 10 to 5, but your behavioral reports stayed fixed (as stipulated), could you have noticed the fading?"
      *   *Target:* Realization that noticing requires a functional change (memory/comparison).
      *   *Label:* **Dancing Qualia.** (Write on board). "If you claim experience changes but behavior doesn't, you are committed to this."

  4.  **The Cost:** "To save Functionalism, what must you claim about the 100% Synthetic You?"
      *   *Target:* They must claim the synthetic has full experience (10).
      *   *Follow-up:* "To claim that, you must ignore your intuition from the Shadow/Hemispheric groups. Why is that hard?"

  ---

  ## 5. Troubleshooting Predictable Failures

  **1. The "Read Ahead" Student**
  *   **Risk:** A student recognizes Chalmers' argument and shouts, "This is Fading Qualia!" in minute 10.
  *   **Fix:** The "No Theory" rule on the handout is your shield.
  *   **Script:** "Please refrain from using external labels. It contaminates the data for your peers. We are interested in your *judgment*, not your reading list. If you continue to name the argument, I will have to ask you to sit out the simulation."

  **2. The "Behavioral Objector"**
  *   **Risk:** "This is impossible. If I felt less, I'd say I felt less. The stipulation is nonsense."
  *   **Fix:** Treat this as a modal claim, not an empirical one.
  *   **Script:** "We are testing a logical possibility, not an engineering constraint. For the sake of the argument, assume the surrogate compensates for the loss internally so the output remains stable. If you reject the stipulation, you reject the test of Functionalism itself. Please play the scenario as written."

  **3. Noisy/Performative Data**
  *   **Risk:** Students write "10" every time because they think that's the "right" philosophical answer, or "5" because they want to be edgy.
  *   **Fix:** Address this in the debrief.
  *   **Script:** "Some of you may have felt pressure to be consistent. Ignore the exact numbers. Look at the *trend*. Did anyone feel even a *hint* of hesitation at the Hemispheric step that they didn't feel at the Drip step? That hesitation is the data point."

  **4. The "Halfway" Logistics**
  *   **Risk:** Collecting cards and plotting averages takes too long, killing momentum.
  *   **Fix:** Pre-assign a "Clinic Scribe" in each group during the setup phase.
  *   **Script:** "At the 35-minute mark, the Scribe will sum your group's Experience Ratings and hand me the total. I will plot it instantly."

  ---

  ## 6. Limitations (Frank Admission)

  *You must supply this in the debrief. The activity cannot reproduce the following:*

  1.  **The Phenomenon Itself:** We are simulating *judgments about* experience, not experience itself. A student rating their experience "5" is a functional report about an imagined state, not a real fading of qualia. The "Hard Problem" remains untouched; we are only mapping our intuitions about it.
  2.  **The Stipulation's Weight:** In the activity, the "fixed behavior" rule is an instruction from a teacher. In the philosophical argument, it is a claim about the nature of causation. Students may feel they are obeying authority rather than confronting a metaphysical necessity.
  3.  **The "Noticeability" Gap:** In the activity, students *know* they are simulating. They can step outside the frame. In the actual argument, the subject *inside* the fading brain cannot notice the fade. It is difficult for students to fully inhabit the inability to notice their own fading while simultaneously reporting on it.

  ---

  ## 7. Protocol Cards (Text for Handouts)

  **Clinic A: DRIP**
  *   **Procedure:** Your neurons are replaced one by one.
  *   **Pace:** 5% of total brain volume replaced per Round.
  *   **Checkpoints:** Record data at Round 5 (25%), Round 10 (50%), Round 15 (75%), Round 20 (100%).
  *   **Note:** You remain awake and conversant throughout.

  **Clinic B: SHADOW**
  *   **Procedure:** For each neuron, a synthetic duplicate is installed alongside it. Both fire. The system gradually weights the synthetic signal higher and the organic lower.
  *   **Pace:** Weighting shifts 25% per Stage.
  *   **Checkpoints:** Record data at 25% Weight, 50% Weight, 75% Weight, 100% Weight (Organics silenced).
  *   **Note:** At 50% Weight, two complete implementations of your mind are technically active for that unit.

  **Clinic C: HEMISPHERIC**
  *   **Procedure:** Replacement occurs in two large blocks under anesthesia.
  *   **Pace:** Step 1: Left Hemisphere. Step 2: Recalibration. Step 3: Right Hemisphere.
  *   **Checkpoints:** Record data Post-Left, Post-Recalibration (50%), Post-Right, Final Integration.
  *   **Note:** You wake up between steps. You pass all identity tests.
