      *   *Section 1 (Narrative/Archival):* Praise the "archival author" concept as a normative move.
      *   *Section 2 (Presentism):* Praise the critique.
      *   *Section 3 (Executive/Archival):* Note the utility but flag the terminology.
      *   *Section 4 (Lockean Turn):* This is the failure point. Explain why claiming Locke is *necessary* contradicts the "irrespective of psychological access" claim. Explain why Locke is usually the *enemy* of advance directives in dementia cases, not the savior.
      *   *Section 5 (Conclusion):* The "ad hoc" admission confirms the failure to meet the prompt's challenge.

  7.  **Final Review against Constraints:**
      *   Specific grade? Yes.
