      *Self-Correction on "Line-Level":* Since I don't have line numbers, I will refer to the specific claims/stages of the argument as presented in the prompt's summary.

      *Refining the Locke Critique:* The student says: "precedent-autonomy position avoids collapse only if we accept a Lockean account... and then observes that severe dementia disrupts this continuity. From this, the student infers that the directive actually forfeits its normative authority..."
      *   *Error:* If Locke is required, and dementia breaks Locke, then the *person* is different. If the person is different, the directive doesn't bind. This is a standard argument *against* directives. The student seems to think Locke *supports* directives, then realizes it doesn't. But the first part of their essay said Narrative supports directives. So they have two competing theories of authority in one essay.
