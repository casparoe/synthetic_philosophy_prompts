          *   *Point 4 (The Lockean Turn):* **Critical Error.** The student claims precedent autonomy requires Lockean identity. This is philosophically backwards. Most proponents of advance directives (like Dworkin) argue *against* Lockean identity being the criterion for moral authority, precisely because dementia breaks Lockean ties. They argue for *biological* or *narrative* identity. By claiming Locke is *necessary*, the student sets up a straw man or misunderstands the literature.
          *   *Point 5 (The Contradiction):* The student first says authority exists *irrespective* of psychological access. Then says authority exists *only if* psychological continuity (Locke) holds. These are mutually exclusive.
