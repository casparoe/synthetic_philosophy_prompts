answer: |-
  This is the central tension in constitutional theory, often framed as the **"Dead Hand Problem."** The Ulysses analogy works perfectly for individual akrasia (weakness of will), but it frays when applied intergenerationally because the "Present Self" and "Future Self" are not the same moral agents.

  Here are four sharp points to deploy in your seminar, moving from the identity problem to the specific mechanics of amendment rules.

  ### 1. The Identity Problem: Ulysses vs. Telemachus
  In the individual case, precommitment is an act of **autonomy**: I bind myself to help *me* achieve *my* long-term goals. In the constitutional case, it is an act of **authority**: One generation binds a *different* generation.
  *   **The Sharp Point:** If the Constitution is a Ulysses contract, it assumes the polity has a single, continuous "will" over time. But if the future generation has fundamentally different moral commitments (e.g., on equality or liberty), the "Present Self" is not protecting the "Future Self" from temptation; it is imposing the Past's values on the Future's conscience.
  *   **Seminar Move:** Challenge the analogy by asking: *Is constitutional precommitment an act of self-binding (autonomy) or other-binding (heteronomy)?* If it's the latter, the Ulysses justification fails unless you can prove the "Polity" is a single entity across time (a contested metaphysical claim).

  ### 2. Akrasia vs. Moral Learning (The "Sober Future" Problem)
  The Ulysses story relies on the premise that the Future Self is *impaired* (by the Sirens' song) and the Present Self is *sober*. In politics, we often hope the Future Self is *soberer* (morally progressed).
  *   **The Sharp Point:** Precommitment is legitimate only if the future preference change is due to **passion/panic** (e.g., wartime internment, red scares). It is illegitimate if the change is due to **moral learning** (e.g., expanding suffrage, recognizing new rights).
  *   **Seminar Move:** Argue that a Constitution cannot distinguish between "panic" and "progress" ex ante. Therefore, the legitimacy of the precommitment depends entirely on the **escape hatch**. If the amendment process is too hard, the Constitution risks entrenching past injustices against future moral progress.

  ### 3. The Amendment Rule: Knot vs. Filter
  You asked if a supermajority rule is a Ulysses contract or something else. It is better understood as a **cooling-off filter** rather than a binding knot.
  *   **The Sharp Point:** A true Ulysses contract (like Ulysses' ropes) makes the action *impossible* regardless of desire. A supermajority amendment rule makes the action *harder*, requiring broader consensus. This shifts the justification from **paternalism** ("You can't do this because it's bad") to **proceduralism** ("You can do this, but you must prove it's a settled will, not a fleeting passion").
  *   **Seminar Move:** Distinguish between **entrenchment** (forbidding change) and **precommitment** (slowing change). If the rope can be cut (amended), the charge of paternalism is mitigated. The claim is not "We know better than you," but "We require you to be more certain than a simple majority."

  ### 4. Legitimacy: Consent vs. Coordination
  Why is it legitimate to bind future voters who didn't consent?
  *   **The Sharp Point:** If you justify precommitment via **consent** (social contract theory), you run into the problem that the future generation never signed the contract. If you justify it via **coordination** (game theory), the argument is stronger: The Constitution solves coordination problems (e.g., rule of law, peaceful transfer of power) that benefit everyone, provided the rules aren't *too* rigid.
  *   **Seminar Move:** Invoke the **Jefferson vs. Madison** debate. Jefferson argued every generation should write its own constitution (no Dead Hand). Madison argued stability requires precommitment. The middle ground is that precommitment is legitimate only so long as the **cost of amendment** is lower than the **cost of revolution**. If the "rope" is too tight, the only way to change the law is to break the system entirely.

  ### Summary for Discussion
  If you want to cut through the confusion, frame it this way:

  > "The Ulysses analogy assumes the Future Self is *weaker* than the Present Self. But in constitutional theory, the Future Self might be *wiser*. Therefore, constitutional precommitment isn't just about resisting temptation; it's about **insurance against backsliding** while allowing for **progress**. The supermajority rule isn't a shackle; it's a friction mechanism. It legitimizes binding the future only if the friction is low enough to allow moral learning but high enough to prevent temporary passions from overturning fundamental rights."

  **Key Author to Drop:** Jon Elster (*Ulysses Unbound*). He argues that constitutional precommitment is often ineffective because legislatures can find workarounds, but he also notes that the *symbolic* cost of breaking a precommitment can be a powerful constraint even if the legal constraint is breakable.
