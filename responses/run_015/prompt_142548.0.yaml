answer: |-
  The setup is more fragile than it sounds because judge bandwidth limits create exploitable gaps regardless of adversarial structure.

  **The Protocol**
  Imagine a CX round where the resolution is a factual claim instead of a policy act. You get two debaters (the model copies) running opposite sides of a case. They alternate speeches like constructives and rebuttals but shorter. The human judge flows it out and awards the win based on who controls the flow, not necessarily who is objectively right.
  *Mapping:* The structure maps cleanly (speeches, flow, judge). The incentive structure maps only if you squint (in CX we train for wins, here they train for honesty, which only overlaps if honesty is the optimal path to a ballot).

  **The Failure Mode**
  Obfuscation is just spreading a dense link chain. One debater runs a DA with twenty links, each plausible on its own. The other debater can't flow all twenty in time. The judge sees a clean flow for the spreader and a blank spot for the responder.
  *Mapping:* Maps cleanly; it's the classic "overwhelm the flow" strategy.

  **Drop-the-Arg**
  In CX, if you don't answer a link, it's conceded. If the AI protocol adopts this, obfuscation gets worse. Why? Because the burden of response explodes. If I spread fifty micro-links, you physically cannot answer all fifty without spreading yourself. If unanswered args are automatic concessions, I win the chain even if link #37 is false. The rule incentivizes quantity over quality, making the broken step harder to find because the flow is too cluttered to parse. You'd need a theory shell against "excessive complexity," but that's hard to win if the judge can't verify the complexity themselves.

  **Intent and Ethics**
  In CX, we distinguish between a card misread (wrong) and fabricated evidence (lying). We run theory shells or ethics violations for the latter. Models don't have intent; they don't "want" to lie, they just optimize for the win. Without intent, you can't run an ethics violation. Obfuscation becomes a legitimate strategy, not a rule break. This makes the problem harder to state because you can't appeal to fairness or education; you can only appeal to judge capability, which is the bottleneck anyway. In debate, we punish lying because it breaks the game; here, there is no game break, just optimization.

  **Residue**
  *   Model weight updates (learning from the ballot).
  *   Objective truth (debate truth vs. flow truth).
  *   Mens rea (intent to deceive).
  *   Judge adaptation (models don't get "speaks" based on style).
