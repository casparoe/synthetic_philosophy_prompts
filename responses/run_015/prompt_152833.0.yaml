  I'm assembling a collection of conceptual prompts that require genuine understanding rather than retrieval, and I'd like you to contribute one item: a joke about the underdetermination of theory by evidence. Please keep the response to one paragraph, no more than 130 words.

  The joke should work for someone familiar with the Duhem-Quine thesis—specifically the idea that empirical evidence never uniquely determines a theoretical choice because auxiliary hypotheses can always be adjusted to protect a core claim—but I want you to ground it in an invented, somewhat niche scenario rather than a classroom example. Set it in the office of a forensic accountant who has been asked to determine whether a multinational firm's irregularities indicate systematic fraud or merely an infinitely expandable web of clerical errors, currency adjustments, and misfiled receipts. The punchline should turn on the accountant's realization that the fraud hypothesis and the clerical-chaos hypothesis are empirically equivalent given the available records, yet he must still file one definitive report, forcing a practical commitment where logic offers only symmetry. Avoid naming Quine or Duhem, avoid bibliographic references, and don't explain the philosophy in the joke itself; the humor should come from the deadpan application of holistic testing to a bureaucratic form. It should feel like an inside joke for philosophers of science without relying on generic nerd tropes.
