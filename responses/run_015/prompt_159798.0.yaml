prompt: |-
  I've spent the last eight months as a junior legal assistant to the amnesty committee of our truth commission (not the South African one — a much smaller thing, set up after a five-year counterinsurgency, and I'm the person who drafts the recommendation memos, so I'm the one who has to make our past decisions look like they add up to a rule). I care about this more than I expected to, because the lists at issue in the case I'm drafting now included people from the town my dad's family is from.

  The statute is the standard trade: amnesty from prosecution and civil suit in exchange for full disclosure of offences committed with a political objective. I know the general shape is borrowed from elsewhere, but what I need to work with is our own track record:

  - A low-ranking fighter who confessed to torching a market stall during a coordinated attack and named his commander and two others: granted.
  - A mid-level commander who confessed to ordering the killings at the Kaleri roadblock and gave hours of detail, but refused to name the regional politician who authorised it — said he'd carry the responsibility himself: refused, disclosure incomplete.
  - A rebel finance officer who never carried a weapon, just moved money and forged movement papers: granted.
  - A prison guard who beat a detainee who had been sleeping with his wife, at a time when guards beat detainees routinely and with political cover: refused, private motive, ordinary crime.
  - A field commander who ordered the shelling of a barracks; forty-one civilians died in the housing compound next to it; he says he didn't anticipate that; two members dissented but amnesty was granted, on the view that disproportion doesn't bar amnesty where the objective was political and the disclosure was full.
  - An applicant who confessed to four incidents; a fifth surfaced in someone else's testimony and he admitted it when confronted: refused, even though the fifth incident was the least serious of the lot.

  New case. The applicant was an intelligence analyst for the state. He compiled monthly lists of suspected sympathisers — names, addresses, who they met. He had no role in detentions, which were run by a different directorate. People on his lists were detained, and over about two years at least thirty of them were killed, two from my dad's town. He has handed over his notebooks and the archive, named his three superiors and the head of the directorate that ran the detentions, and says he cannot name who actually did the killings because he genuinely doesn't know. He also says that when he started he understood the lists to be for surveillance — that he thought he was preventing attacks — but admits that by the second year he knew a listing usually meant detention, and that detained people often didn't come back.

  What do you think our committee does with him, and what rule does that commit us to? I can see at least two rules that fit all six precedents and split on him: one that's basically about political objective plus telling everything you yourself know, and one where amnesty tracks whether the harm you contributed to was something you could foresee and were proximate to, so that a man who thought he was compiling a watchlist is closer to the prison guard than to the finance officer. There's maybe a third reading of the disclosure condition too — that it isn't about what the applicant knows but about whether the commission can reconstruct the whole operation, in which case his not knowing the killers is itself a disclosure failure even though he isn't hiding anything.

  Tell me which of those you'd bet on, which precedent is the closest analog and why, what principle we'd be adopting with each choice, and what further case would actually separate the rules — my guess is something involving an applicant with a genuine memory gap, but I'd like your version.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Junior Legal Assistant to an Amnesty Committee of a Truth Commission.
      *   **Task:** Drafting recommendation memos, specifically trying to make past decisions look coherent (retroactive rule-making/justification).
      *   **Context:** Post-counterinsurgency (5 years), smaller scale than South Africa.
      *   **Personal Stake:** High. The current applicant's lists include people from the user's father's hometown (two killed).
      *   **Statute:** Amnesty for prosecution/civil suit in exchange for *full disclosure* of offences committed with a *political objective*.
      *   **Goal:** Determine the outcome for the new case (State Intelligence Analyst), identify the governing rule, analyze precedents, and propose a test case to distinguish competing rules.

  2.  **Analyze the Precedents (The "Track Record"):**
      *   *Case 1 (Low-ranking fighter):* Torched stall, named commander/others. **Granted.** (Rule: Political objective + Full disclosure of *own* role + Cooperation).
      *   *Case 2 (Mid-level commander):* Ordered killings, gave detail, *refused* to name authorizing politician. **Refused.** (Rule: Disclosure must include superiors/context, not just own acts. Withholding names = incomplete).
      *   *Case 3 (Finance officer):* No weapon, moved money/papers. **Granted.** (Rule: Indirect contribution is okay if political. "Nexus" doesn't require violence).
      *   *Case 4 (Prison guard):* Beat detainee (wife's lover). Routine beating + political cover existed. **Refused.** (Rule: Personal motive trumps political cover. Private crime != Political offence).
      *   *Case 5 (Field commander):* Shelled barracks, 41 civilians died (collateral). Didn't anticipate. **Granted** (2 dissenters). (Rule: Disproportion/Collateral damage doesn't bar amnesty if objective political + disclosure full. *Mens rea* regarding specific deaths less important than intent of act).
      *   *Case 6 (Multiple incidents):* Confessed 4, 5th surfaced later (admitted when confronted). **Refused.** (Rule: Full disclosure must be *voluntary* and *complete* at outset. Reactive admission isn't enough).

  3.  **Analyze the New Case (State Intelligence Analyst):**
      *   **Role:** Compiled lists of suspects (names, addresses, contacts).
      *   **Action:** No direct detention/killing. Lists used by different directorate.
      *   **Outcome:** 30+ killed (2 from user's dad's town).
      *   **Disclosure:** Handed over notebooks/archive. Named superiors. Claims ignorance of specific killers (plausibly true due to compartmentalization).
      *   **Mens Rea/Intent:** Started thinking it was surveillance/prevention. By Year 2, knew listing meant detention/death.
      *   **Key Tension:** Is compiling the list "full disclosure" if he doesn't know the killers? Is the act "political" if he knew the consequence (death) but didn't pull the trigger?

  4.  **Evaluate the Three Proposed Rules:**
      *   *Rule A (Subjective Knowledge/Political Objective):* Amnesty tracks political objective + telling everything *you* know.
          *   *Fit:* Fits Case 1, 3, 5. Fits Case 2 (he *knew* the politician but hid it). Fits Case 6 (he *knew* the 5th incident but hid it). Fits Case 4 (Private motive).
          *   *Outcome for Analyst:* **Granted.** He told everything *he* knows. He didn't hide the superiors. The ignorance of killers is structural, not deceptive.
      *   *Rule B (Foreseeability/Proximity):* Amnesty tracks whether harm was foreseeable and proximate.
          *   *Fit:* Fits Case 4 (Guard knew beating was personal). Fits Case 5 (Commander didn't foresee civilian death -> Granted, wait, this contradicts Rule B unless "political objective" overrides foreseeability). Case 3 (Finance officer couldn't foresee specific deaths? -> Granted).
          *   *Outcome for Analyst:* **Refused.** By Year 2, he knew listing = death. He is proximate to the intelligence pipeline. Closer to the Guard (personal/routine) or the Commander (ordering harm).
      *   *Rule C (Systemic Reconstruction):* Disclosure is about whether the *Commission* can reconstruct the operation.
          *   *Fit:* Fits Case 2 (Refused to name politician -> Commission can't see top). Fits Case 6 (Hidden incident -> Commission can't see full pattern).
          *   *Outcome for Analyst:* **Refused (or Conditional).** If he doesn't know the killers, the chain is broken. The Commission can't map the killing mechanism fully. However, he gave the *lists* and the *superiors*. Is the gap his fault?

  5.  **Determine the Most Likely Outcome (The "Bet"):**
      *   *Institutional Pressure:* Truth Commissions usually want to maximize disclosure to get the "truth" out. Denying amnesty to a bureaucrat who hands over the *archives* discourages others from handing over evidence.
      *   *Precedent Weight:* Case 3 (Finance Officer) is the strongest analog. Non-violent, logistical support, political objective -> Granted. The Analyst is a "Finance Officer of Intelligence."
      *   *Disclosure Standard:* Case 2 and 6 punish *withholding*. Case 5 forgives *unintended consequences*. The Analyst isn't withholding; he claims ignorance. Case 5 suggests unintended/unknown specifics don't bar amnesty if the main act is disclosed.
      *   *The "Dad's Town" Factor:* The user cares. This adds moral weight. Granting amnesty to the man who listed the user's relatives feels unjust personally, but legally, under the established track record (specifically Case 3 and 5), it holds.
      *   *The Bet:* **Granted.**
      *   *Why:* The Committee prioritizes *institutional truth* (the archives) over *retributive closure* for specific victims. The analog is the Finance Officer (Case 3). The principle is "Functional Contribution + Full Subjective Disclosure."

  6.  **Develop the Principles:**
      *   *If Granted:* Principle of "Subjective Completeness." You must disclose all you know, but you aren't liable for structural ignorance. Encourages bureaucrats to flip.
      *   *If Refused:* Principle of "Objective Causality." If your function was necessary for the killing, and you knew it, you are complicit regardless of specific trigger-puller identity. Raises the bar for "political objective."

  7.  **Identify the "Test Case" (The Separator):**
      *   User suggests: Genuine memory gap.
      *   My suggestion: Needs to distinguish between *Structural Ignorance* (Analyst) vs. *Willful Blindness* vs. *Memory Loss*.
      *   *Better Test Case:* An applicant who *destroyed* records claiming they were irrelevant, but later admits they might have contained names of killers. Or, an applicant who followed orders knowing they were illegal but claims they thought the *specific* victims were combatants (mistake of fact vs. mistake of law).
      *   *Refined Test Case:* A logistics driver who drove supplies to a site where executions happened. He says he didn't know *what* happened there, though he heard screams. (Distinguishes Case 5's "didn't anticipate" from Analyst's "knew by Year 2").

  8.  **Drafting the Response:**
      *   *Tone:* Professional, empathetic to the user's burden, legally analytical but aware of the moral weight. Acknowledge the "making decisions look like they add up" aspect (realism).
      *   *Structure:*
          1.  Direct Answer (The Bet).
          2.  The Closest Analog.
          3.  The Principle Adopted.
          4.  The Alternative (Refusal) Principle.
          5.  The Distinguishing Case.
      *   *Nuance:* Address the "Dad's Town" element. It makes the "Granted" recommendation harder to write but legally more consistent with Case 3.

  9.  **Refining the Logic (Self-Correction during drafting):**
      *   *Wait, check Case 5:* Commander granted amnesty despite 41 civilian deaths because he "didn't anticipate." Analyst *did* anticipate by Year 2. Does this hurt the "Granted" argument?
      *   *Counter:* Case 5 is about *proportionality/collateral damage*. Case 3 is about *indirect contribution*. The Analyst is more like Case 3 (Finance Officer). The Finance Officer knew money funded violence presumably, but got amnesty. The key is the *Political Objective*.
      *   *Check Case 2:* Refused for not naming politician. Analyst named superiors. He *can't* name killers. This is a capacity issue, not a refusal issue. This supports "Granted."
      *   *Check Case 6:* Refused for hiding a 5th incident. Analyst isn't hiding; he claims ignorance.
      *   *Conclusion:* The "Granted" path is the path of least resistance regarding precedent, even if it hurts the user personally. The Committee values the *archives* (the notebooks) more than the *names of the killers* (which they might get elsewhere).
      *   *The "Rule":* The rule is "Full Disclosure of Available Knowledge," not "Full Reconstruction of Events."

  10. **Final Polish:** Ensure the distinction between the three rules is clear. Ensure the test case is sharp. (Decided to stick with the "Willful Blindness/Logistics" test case as it probes the *knowledge* requirement better than memory).

  **(Self-Correction on the Test Case):** The user suggested a memory gap. I should validate that but offer a sharper one. A memory gap is hard to adjudicate (how do you prove fake amnesia?). A better test case is *Willful Blindness*. An applicant who deliberately avoided knowing the outcome to maintain plausible deniability. This tests the "knew by Year 2" aspect of the Analyst.

  Let's finalize the recommendation: **Grant.** It aligns with the Finance Officer (Case 3) and respects the limitation seen in Case 5 (unintended/unanticipated specifics don't bar). It treats the "ignorance of killers" as a structural fact, not a disclosure failure.

  *Wait, one more check:* The user says "I'm the one who has to make our past decisions look like they add up to a rule." This implies the user knows the law is being constructed *ex post facto*. I need to acknowledge that craft. The memo needs to sound like it's discovering the rule, not making it.

  Okay, ready to write.
answer: |-
  This is a heavy brief. You are doing the work of a court without the protection of a legislature, and you are doing it with names from your father's town on the page. That weight doesn't disappear because you draft the memo in the passive voice.

  Here is my assessment of how the committee will likely rule, the precedent that binds you, and the cost of that choice.

  ### The Bet: Amnesty Granted

  I would bet the committee grants amnesty.

  It is the path of least resistance through your existing track record, and it serves the institutional imperative of a Truth Commission: securing the archive. If you refuse this applicant, you risk signaling to the bureaucracy that handing over the master keys (the notebooks, the archives, the chain of command) is insufficient if the blood on the floor isn't fully accounted for. Given that state intelligence structures are designed specifically to compartmentalize knowledge (plausible deniability), punishing an analyst for not knowing the names of the executioners punishes them for the structure they served, not just their conduct within it.

  ### The Closest Analog: Case 3 (The Finance Officer)

  The Finance Officer is your controlling precedent.
  *   **Similarities:** Neither carried a weapon. Both provided the logistical infrastructure (money vs. information) that made the violence possible. Both acted within a political hierarchy.
  *   **Distinctions:** The Finance Officer might not have known *specifically* who would die with the money; the Analyst knew by Year 2 that listing usually meant death.
  *   **Why it controls:** The Committee granted amnesty to the Finance Officer because the *act* (moving money) was politically motivated, not personally motivated (unlike the Prison Guard, Case 4), and the disclosure was complete regarding *his* function. The Committee has already established that you do not need to pull the trigger to qualify. The Analyst's admission that he "knew by the second year" is damaging, but Case 5 (the Field Commander) suggests that foresight regarding specific casualties is not a bar to amnesty if the primary objective was political. The Commander didn't anticipate the 41 civilians; the Analyst *did* anticipate detention/death. However, in Case 5, the Committee prioritized the *political objective* over the *proportionality of harm*. Here, they will likely prioritize the *political objective* over the *proximity to the killing*.

  ### The Rule You Are Adopting

  If you recommend **Grant**, you are codifying this principle:

  > **"Subjective Completeness within Structural Limits."**
  > An applicant satisfies the disclosure requirement if they reveal all information within their personal knowledge and possession, even if structural compartmentalization prevents them from identifying the ultimate perpetrators. Amnesty attaches to the political nature of the act and the honesty of the applicant regarding their specific node in the network, not to the completeness of the Commission's total reconstruction of the violence.

  **The Cost:** This rule prioritizes *administrative truth* (the archives, the hierarchy) over *victim closure* (knowing exactly who killed whom). It treats the Intelligence Analyst as a bureaucrat rather than a co-conspirator in murder. For your father's town, this means the men who killed their neighbors remain anonymous, shielded by the very compartmentalization the Analyst is benefiting from.

  ### The Alternative Rule (If You Refuse)

  If you recommend **Refusal**, you are codifying this principle:

  > **"Objective Causality and Foreseeable Harm."**
  > Amnesty is barred where the applicant's contribution was a necessary precondition for death, and where the applicant knew or should have known that death was the probable outcome, regardless of whether they identified the specific killer. Ignorance of the triggerman is not a defense if the applicant understood the pipeline led to a grave.

  **The Precedent Shift:** To make this stick, you would have to lean heavily on **Case 4 (The Prison Guard)**. You would have to argue that by Year 2, the Analyst's motive shifted from "surveillance/prevention" to "facilitating elimination," making him proximate to the killing in a way that resembles the Guard's personal violence. You would also have to distinguish Case 3 (Finance Officer) by arguing that money is fungible, but intelligence on specific individuals is *targeted*.

  **The Risk:** This creates a "knowledge trap." It incentivizes future applicants to claim they *didn't* know what happened to the people on their lists. It rewards willful blindness.

  ### The Third Reading (Systemic Reconstruction)

  You mentioned a third rule: *Disclosure is about whether the Commission can reconstruct the operation.*

  If you use this, you must **Refuse**. The chain is broken if he doesn't name the killers. However, this contradicts **Case 1** (Low-ranking fighter). The fighter named his commander, but presumably not the politician who ordered the campaign. If the standard were "total reconstruction," Case 1 should have been scrutinized harder. This rule is too ambitious for your track record. Your committee has consistently punished *withholding* (Case 2, Case 6), not *inability to know*.

  ### The Distinguishing Case

  You guessed a memory gap case. That is tricky because memory is unverifiable. A better test case to separate **Subjective Completeness** (Grant) from **Objective Causality** (Refuse) is the **Willful Blindness Logistics Case**.

  **The Hypothetical:**
  > An applicant drove trucks for the directorate. He drove them to a remote site monthly. He says he was told they contained "supplies." He admits he heard gunfire and saw body bags being loaded on the return trip, but claims he never asked what was in the boxes on the way in and does not know who ordered the executions. He discloses his logs and routes but cannot name the commanders at the site because he wore a blindfold during the final leg (standard procedure).

  **Why this separates the rules:**
  *   **Under Subjective Completeness (Your Analyst Precedent):** He gets amnesty. He disclosed all he knows. The blindfold was structural. He didn't hide the routes.
  *   **Under Objective Causality (The Refusal Path):** He is refused. A reasonable person hearing gunfire and seeing body bags *knows* the objective is killing. His claim of ignorance is a moral choice, not a structural limitation. He is closer to the Prison Guard (Case 4) than the Finance Officer (Case 3).

  ### A Note on the Memo

  You wrote that you have to "make our past decisions look like they add up to a rule." In this specific case, the law *is* the memo.

  If you grant this amnesty, you are validating the system that killed people in your father's town. If you refuse it, you are breaking the consistency of the Committee to serve a moral truth the statute might not support.

  My advice? **Grant the amnesty, but write the "Findings of Fact" section with brutal clarity.** Do not use euphemisms. State clearly: *"The applicant knew by Year 2 that inclusion on the list resulted in death. He facilitated this outcome."*

  Make the record show that he is guilty of the moral crime, even if he is absolved of the legal one. That is often the only reparation a Truth Commission can offer the living. It protects the precedent (Case 3) while acknowledging the cost. It allows you to sleep better than refusing the amnesty on shaky legal grounds that will be challenged in court, but it ensures the history books record exactly what he did.

  You are building the rule for the next ten years. If you want the next intelligence analyst to hand over the notebooks, you have to grant this. If you want the next analyst to know that listing people for death makes them a murderer in the eyes of history, you have to write the facts so sharply they cut.
