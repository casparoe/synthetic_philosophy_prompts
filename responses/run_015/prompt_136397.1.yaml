  5.  **Refining the Arguments:**

      *   *Top Priority:* **The Metaphysics of Free-Standing Structure.** OSR claims relations exist without things relating. This is metaphysically spooky. A grad student can work on this using modal logic or trope theory without needing QFT. *Why upstream?* If this fails, OSR is dead.
      *   *Second Priority:* **SR beyond Physics (The Biology/Genetics Angle).** Ladyman & Ross claim SR is for *all* science. Biology is the test case. Gene networks look structural, but do they rely on intrinsic chemical properties? If biology needs "stuff," SR is limited to physics. *Why tractable?* Philosophy of biology is accessible. *Why impactful?* Limits the scope of SR significantly.
      *   *Third Priority:* **Structural Continuity & Theory Change.** Worrall's original point. How much structure is actually retained? This requires history of science, not hard physics.
