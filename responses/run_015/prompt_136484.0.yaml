answer: |-
  # Seminar Activity: The Weighted Verdict
  **Topic:** Judgment Aggregation & The Discursive Dilemma
  **Time:** 15 Minutes (Game Phase) + 20 Minutes (Debrief)
  **Participants:** 10 Graduate Students
  **Materials:** 10 Voting Slips, 5 "Expert" Envelopes, 5 "Public" Envelopes, 1 "Charter" Sheet, 1 "Budget" Poster.

  ## 1. Instructor Prep (Before Class)
  To guarantee the paradox emerges within the tight timeline, you will **assign judgment profiles** rather than relying on spontaneous opinion. This ensures the mathematical conditions for the dilemma are met.

  *   **Voting Slips (10 Total):**
      *   **Slips 1–5 (Marked "Expert" on back):** Pre-printed with: P1=Yes, P2=No, P3=Adopt. (4 slips) & P1=Yes, P2=Yes, P3=Reject (1 slip).
      *   **Slips 6–10 (Marked "Public" on back):** Pre-printed with: P1=No, P2=Yes, P3=Reject.
  *   **Envelopes (10 Total):**
      *   **5 "Domain Expert" Envelopes:** Contain a card reading: *"Your vote on P1 counts double. You may not reveal this weight unless the group explicitly debates 'Epistemic Authority'."* (Distribute these to students holding Slips 1–5).
      *   **5 "Citizen" Envelopes:** Contain a card reading: *"Your vote counts as one. No restrictions."* (Distribute to students holding Slips 6–10).
  *   **The Charter:** A whiteboard space or sheet where the group writes down their chosen Aggregation Rule.
  *   **The Stake:** A poster showing two buckets: **"Green Tech Fund"** (If Policy Adopted) vs. **"Rural Relief Fund"** (If Policy Rejected).

  ## 2. The 15-Minute Timeline

  **0:00–0:03 | Distribution & Private Judgment**
  *   Hand out Voting Slips and Sealed Envelopes.
  *   **Instruction:** "Do not open envelopes yet. Mark your slip according to the profile printed on it. This represents your considered judgment. Fold and place in the ballot box."
  *   *Instructor Note:* Collect slips immediately. Do not allow discussion.

  **0:03–0:06 | The Constitutional Convention (Rule Selection)**
  *   **Instruction:** "You must decide how to aggregate these votes. You have two options:
      1.  **Conclusion-Based:** We count the votes on P3 (Adopt/Reject) directly. One person, one vote.
      2.  **Premise-Based:** We count votes on P1 and P2. If Majority says P1=Yes and P2=No, the Policy is Adopted."
  *   **Constraint:** "You must choose a rule *before* opening your envelopes. You have 3 minutes to agree."
  *   *Likely Outcome:* Grad students often default to "One Person, One Vote" (Conclusion-Based) as the democratic standard. If they stall, push them to vote on the *rule* itself.

  **0:06–0:09 | The Reveal & Aggregation**
  *   **Instruction:** "Open your envelopes. Read your weight and restriction silently."
  *   **Action:** Tally the results based on the rule they just chose.
      *   *Scenario A (They chose Conclusion-Based):* Tally P3. (Result: 4 Adopt, 6 Reject $\rightarrow$ **Reject**).
      *   *Scenario B (They chose Premise-Based):* Tally P1/P2 with weights. (Result: P1 Weighted Yes, P2 Weighted No $\rightarrow$ **Adopt**).
  *   **The Twist:** Regardless of what they chose, reveal the *alternative* calculation on the board.
      *   "If you chose Conclusion, note that Weighted Premises would have yielded Adopt."
      *   "If you chose Premise, note that Unweighted Conclusion yields Reject."

  **0:09–0:12 | The Crisis (Deliberation)**
  *   **Instruction:** "The Seminar Coffee Fund will be allocated based on this result. However, the Experts now know their votes carry double weight on the science (P1), but they are bound by silence unless 'Epistemic Authority' is discussed. The Public knows nothing of the weights. You have 3 minutes to finalize the decision."
  *   *Observation:* Watch if Experts break silence to save the "Adopt" outcome, violating their constraint, or if they allow the "Reject" outcome despite knowing the premises support adoption.

  **0:12–0:15 | Freeze & Transition**
  *   **Instruction:** "Stop. Do not resolve the conflict. Keep your envelopes. We will now analyze what happened."
  *   Collect the "Budget" decision (whatever the current majority holds) and move to debrief.

  ## 3. Debrief Guide (Mapping to Formal Structure)
  *Use the whiteboard to reconstruct the logic.*

  1.  **The Doctrinal Paradox (List & Pettit):**
      *   Draw the table. Show how individual judgments were consistent (P1 & ~P2 $\leftrightarrow$ P3), but the collective majority was not.
      *   *Point:* Majority voting on interconnected propositions leads to inconsistency.
  2.  **Premise vs. Conclusion:**
      *   **Conclusion-Based:** Protects democratic equality (1p1v) but risks logical incoherence (rejecting the premises that imply the conclusion).
      *   **Premise-Based:** Protects logical consistency but can override the direct will of the majority on the final decision.
  3.  **The Epistemic Injection (The Envelopes):**
      *   Ask the "Experts": "Did you feel silenced?"
      *   Ask the "Public": "Did you feel the outcome was legitimate?"
      *   *Point:* Introducing weights (epistocracy) resolves the logical tension but violates political equality. You cannot simultaneously satisfy **Anonymity** (equal weight), **Systematicity** (same rule for all propositions), and **Consistency** (no contradictions).
  4.  **The Trade-off:**
      *   The group had to choose between a *true* majority (Conclusion) and a *justified* majority (Weighted Premises). This mirrors the tension in technocratic democracies (e.g., Central Banks, Climate Councils).

  ## 4. Honest Note on Limitations
  **What this activity cannot reproduce:**
  This simulation fixes **preferences/judgments** ex-ante (via the printed slips). In real deliberative democracy, the "Discursive Dilemma" is often mitigated by **preference transformation**. Through discussion, agents might change their minds on P1 or P2 to align with the group, restoring consistency without changing the aggregation rule. This game freezes judgment to isolate the aggregation problem, thereby excluding the possibility that *talk* solves the paradox. It presents aggregation as a mechanical failure rather than a communicative challenge.

  ## 5. Predicted Failure Mode (First Run)
  **The "Rule Stall":**
  Graduate students in philosophy are likely to recognize the trap during the 0:03–0:06 "Constitutional Convention" phase. They may refuse to choose a rule without first inspecting the envelopes or debating the legitimacy of weighting.
  *   **Mitigation:** If they stall, invoke the "Time Pressure" stake. "If no rule is chosen in 60 seconds, the Budget is automatically forfeited (Status Quo)." This forces a decision under uncertainty, replicating the real-world necessity of choosing institutional rules before knowing specific case outcomes.
  *   **Secondary Failure:** Experts may immediately reveal their weights, ignoring the envelope constraint.
  *   **Mitigation:** Enforce the constraint as a "Rule of Order." If an Expert reveals weight without the keyword "Epistemic Authority" being spoken by a *Public* member first, their vote is disqualified. This gamifies the norm of silence.
