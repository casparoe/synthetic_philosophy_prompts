answer: |-
  Good morning. For those of you who don't know me, I'm [Your Name]. I had the privilege of working alongside Alan for fifteen years. I was his student, his colleague, and eventually, his friend.

  We are here to mourn a man, not a legend. Alan's wife, Maria, asked me specifically not to turn him into a statue today. She doesn't want a eulogy that sounds like a medical textbook, and she certainly doesn't want one that paints him as a hero who never flinched. She wants you to remember the man who burned the toast on Sundays and hummed off-key to old jazz records. I promise to honor that. But I also know that half of this room wore scrubs with him. You know that the man who hummed off-key also stood in front of a whiteboard in the trauma unit and made decisions that kept him awake at night.

  To ignore that part of him would be to ignore the core of his integrity. So, I need to speak about the work, not to define him by it, but to explain how he did it without losing his soul.

  In the emergency department, there is a moment when resources run out. There are more patients who need help than there are hands to help them. In those moments, a doctor has to choose. Alan had a saying: he "let the board decide."

  There was a triage board in the unit. It listed patients by prognosis and need. It was cold, clinical arithmetic. There were stories—true stories—where Alan would withhold a ventilator from a patient who was young and charismatic, giving it instead to an older patient because the board said the need was greater, or the chance of survival was clearer.

  To some, that sounds like a calculation. To Alan, it was an act of respect.

  He believed that if he allowed himself to choose based on who was kinder, or younger, or more like him, he would be treating human beings as anything other than equals. He knew that his own heart had biases. He knew that charm is not a medical condition, and that youth is not a virtue. If he let his own feelings weigh the scales, he would be dishonoring the person on the other side of the scale who lacked that charm.

  He let the numbers speak precisely because he refused to let his own preferences decide who lived. He understood that the only way to treat every single person as having equal, infinite worth was to remove himself from the equation. He didn't use the board to distance himself from the pain of the choice; he used it to ensure the choice was fair.

  That is not the logic of a machine. That is the logic of a man who loved strangers enough to deny himself the privilege of playing favorites.

  I know this is hard for his family to hear. It is hard to think that the man who hugged you so warmly at Christmas made decisions like that. But I need you to know that he didn't leave his heart at the hospital door. He protected his heart *so that* he could keep walking through that door. If he had let every decision break him, he would have had to stop. And if he had stopped, he couldn't have served.

  The discipline you saw in the hospital was the same discipline that made him a faithful husband and a present father. It was the understanding that love isn't just a feeling; it's a standard you hold yourself to, even when it hurts.

  To the medical staff here: you know the silence of that room when the board is updated. You know the weight of that dry-erase marker. Alan carried that weight so you didn't have to carry it alone. He set a standard that said we do not choose based on who we like. We choose based on who needs us.

  To the family and friends: know that the same fierce fairness he showed those patients is how he loved you. He didn't love you because of what you could do for him. He loved you because you were there. You were his claim.

  Alan Reyes taught me that being impartial isn't about being cold. It is the hardest form of warmth there is. It is looking at the world and saying, "No one is more important than anyone else, not even me."

  He let the board decide so that he could remain human. And today, as we say goodbye, we don't have to choose between the doctor and the man. They were the same person. A person who understood that the only way to honor a life is to treat it with the same respect as every other.

  Rest well, Alan. The board is clean. The shift is over. We'll take it from here.
