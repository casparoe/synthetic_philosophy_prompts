  Here is the commitment you asked for.

  ### The Word

  There is an established descriptive term for the *outcome* you are observing: **"Convergence."** In the literature of alternate history and some complexity theory, this describes timelines that diverge and then merge back together.

  However, "Convergence" is insufficient for your argument because it describes *what* happens, not *why*. It does not distinguish between a world that naturally snaps back due to structural forces and a story that snaps back due to the author's lack of imagination. You need a word for the *force* or *property* that causes the snap-back.

  There is no established single word for this specific methodological tension in historiography. I propose you adopt the term **"Counterfactual Drag."**

  **Definition:** Counterfactual Drag is the unexamined resistance in a historical narrative that pulls a divergent timeline back toward the actual historical record. It is the measure of how much effort is required to keep a counterfactual world distinct from the real one as time progresses.

  *   **High Drag:** The timeline snaps back quickly (your friend's default).
  *   **Low Drag:** The timeline fans out and stays distinct (your reinsurance model).

  ### Established Usage vs. Proposal

  *   **Established:** **"Convergence."** This is the standard term for the phenomenon of branches rejoining. If you search databases on counterfactual history, this is the tag you will find.
  *   **Proposal:** **"Counterfactual Drag."** I am coining this (or repurposing it from physics/narratology) to specifically name the *tension* you identified. "Convergence" is the destination; "Drag" is the force pulling you there. Using "Drag" allows you to argue about the *magnitude* of the force, rather than just the fact of the arrival.

  ### Mechanism vs. Exhaustion: One Phenomenon or Two?

  They are **two distinct phenomena** that merely share a visual signature on the page. Conflating them is the source of your disagreement.

  1.  **Structural Drag (The Mechanism):** This is a substantive claim about the world. It argues that historical systems have **equilibrium states** (or "attractors," in complexity terms). For example: "Gunpowder empires require high taxation, which requires parliaments." If the Armada succeeds, this structural pressure still exists, so the political system evolves back toward a parliament. This is a falsifiable historical theory.
  2.  **Imaginative Drag (The Exhaustion):** This is a methodological failure. It argues nothing about the world, but everything about the historian's cognitive limits. The author cannot *see* a genuinely different 1650, so they unconsciously import the real 1650 to fill the void. This is not a theory; it is a lapse.

  **The Test to Separate Them:**
  Ask your friend to name the **Restoring Force**.
  *   If he can say, "The geographic constraints of the British Isles force a naval focus regardless of who rules," that is **Structural Drag**. You can argue with the premise (are the constraints really that binding?).
  *   If he says, "Well, obviously society would still need to organize itself somehow," or cannot specify the mechanism beyond "things tend to settle," that is **Imaginative Drag**. He is relabeling his inability to envision an alternative as a law of history.

  ### The Personal Case

  The personal case ("If I hadn't taken that job, something like it would have come along") belongs with **Imaginative Drag**.

  It is almost never a claim about structural equilibrium in a life. It is a psychological coping mechanism known as **Rationalization** or **Destiny Bias**. It reduces the cognitive load of regret by asserting that the specific choice didn't matter because the outcome was fixed. It functions exactly like Imaginative Drag: it collapses the branching tree of possible lives back into the single trunk of the actual life to avoid the discomfort of evaluating the road not taken. It is not a theory of biography; it is a defense of the self.

  ### Boundary Cases

  To ensure we are carving this correctly, here are the boundaries of **Counterfactual Drag**:

  *   **Clear Instance (High Drag):** A story where the Spanish Armada lands, the Queen is captured, but by 1620, England is still a Protestant maritime power with a global trading company, because "that's just what England does." The specific events changed, but the *systemic profile* is imported from reality without a specified mechanism. This is **Counterfactual Drag** (likely Imaginative).
  *   **Clear Non-Instance (Low Drag/No Drag):** A story where the Spanish Armada lands, and by 1620, England is a Catholic client state of Spain, the Atlantic trade is monopolized by Seville, and the language of law is Castilian. The branches do not rejoin. Or, a story where the Armada lands, and England collapses into a fractured set of warring duchies that never unify. The timeline diverges and stays divergent. There is no pull back to the baseline.

  ### Summary of Position

  You are not disagreeing about "plausibility." You are disagreeing about **Counterfactual Drag**.

  *   Your friend assumes **High Drag** (history is elastic and snaps back).
  *   You assume **Low Drag** (history is plastic and holds its shape).
  *   Sometimes his High Drag is a **Structural** claim (argue with the history).
  *   Sometimes his High Drag is an **Imaginative** failure (argue with the method).
  *   His personal anecdotes are **Imaginative Drag** (psychological rationalization).

  Use the term **Counterfactual Drag**. It forces the question: "Is this snap-back a feature of the world, or a feature of your story?" That is the carving you need.
