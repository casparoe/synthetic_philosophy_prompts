answer: |-
  1. **The mapping**

  | Auction Element | IRB Element |
  | :--- | :--- |
  | Bidder | Senior Researcher |
  | Item's Common Value | True Net Safety/Benefit of Experiment |
  | Private Signal | Individual Risk/Benefit Assessment |
  | Highest Bid | Unilateral Authorization |
  | Overpayment | Realized Collective Downside |
  | Losing Bidders | Other Board Members |
  | Bid Shading | Private Authorization Threshold Correction |

  In this mapping, the researcher who authorizes corresponds to the winning bidder, selected because their private signal regarding the experiment's value is the most extreme. The "winner's curse" manifests as the collective suffering negative consequences because the authorized experiment was actually riskier than the authorizer's optimistic estimate suggested. The proposed solution maps bid shading to a cognitive adjustment where researchers authorize only if the experiment remains viable assuming their estimate is the outlier. The auction rule (highest bid wins) corresponds to the institute's current policy of unilateral authorization without veto.

  2. **Where the analogy genuinely holds**

  The analogy holds regarding the statistical selection effect. In both scenarios, the decision rule selects the maximum value from a distribution of noisy private estimates. If estimates are variable, the maximum systematically exceeds the true mean. Acting on the unadjusted maximum leads to systematic over-optimism. Both cases involve agents acting on private information regarding a shared outcome, creating a structural risk that the decision-maker is the individual who most underestimated risk purely by chance.

  3. **The disanalogies that matter**

  Three disanalogies undermine the policy recommendation, ranked by severity.
  1. **Externalities (Critical):** In auctions, the winner pays the bid. Here, the authorizer gains credit, while the board bears the downside. This is moral hazard, not just statistical error. Bid shading relies on the winner internalizing the loss; without skin in the game, researchers lack the incentive to shade. A rational actor maximizes personal gain when costs are socialized.
  2. **Value vs. Fact:** Auctions assume a single true value discoverable via signals. IRB disagreements often reflect conflicting values (scientific progress vs. public safety), not just noisy estimates of a shared truth. Shading corrects for noise around a mean, not fundamental disagreement on weighting goods. If values differ, the "most optimistic" isn't an error, but a different priority.
  3. **Unknown Distributions:** Bid shading requires knowing the error distribution of peers. Without a track record of past decisions and outcomes, researchers cannot calculate the conditional probability required to shade effectively. They are epistemically blind.
  These matter because they transform the problem from one of cognitive correction to one of incentive design and structural constraint. The auction model assumes rational self-correction is sufficient because the penalty is automatic. The IRB reality requires enforced cooperation because the penalty is disconnected from the decision-maker. Consequently, the auction logic cannot support a no-veto rule when the decision-maker does not suffer the curse. Treating the selection mechanism as exogenous smuggles in the conclusion that unilateral action is inevitable.

  4. **What the auction frame quietly imports**

  The auction frame quietly imports assumptions of symmetric payoffs and repeated interaction. It assumes agents are risk-neutral maximizers operating within a known error distribution where losses are immediately felt by the decision-maker. It presumes a shared objective function where "value" is singular and commensurable. Crucially, it assumes the goal is efficiency in allocation, whereas the IRB's goal is risk mitigation and ethical compliance, which are not necessarily aggregable. External regulatory or reputational risks falling outside the immediate group are ignored by this closed-system model.

  5. **Verdict on shade, don't veto**

  The "shade, don't veto" conclusion fails. It survives only if researchers internalize collective costs, which they do not. Furthermore, the conditional test—"authorize only if worth it given you are the most optimistic"—requires knowing the distribution of colleagues' estimates. Without data or communication, this is impossible. Even if possible, it relies on the false premise that disagreement is merely noise. Since the authorizer does not pay the "overpayment," bid shading is not a Nash equilibrium here. Unanimity or veto power is better supported because it forces internalization of dissent, addressing the externality that the auction model ignores. The conditional test would require each researcher to model the cognitive biases of all seven peers, an impossible cognitive burden without shared data.

  6. **A better analogy**

  A better analogy is a **pollution permit** or **nuclear launch key**. One actor can trigger a consequence affecting all, but does not bear the full cost. This highlights the externality and asymmetry of risk. These frames capture the moral hazard and collective risk better than auctions, supporting structural constraints (vetoes) rather than relying on private cognitive corrections which lack enforcement mechanisms. The core insight remains—extreme opinions drive outcomes—but the solution shifts from private adjustment to public constraint.
