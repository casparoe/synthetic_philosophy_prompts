prompt: |-
  I sit on the internal review board of a research institute where any one of eight senior researchers may unilaterally authorize a certain class of high-consequence experiments; the rest of us learn about it afterward, and the downside, if there is one, is borne by everyone. We are split over what rule to adopt. One faction argues that our situation is just the winner's curse from common-value auction theory in a new costume: the outcome is settled by the most optimistic estimate in the group in the same way that the item goes to the highest bidder, so the problem is purely a selection effect on noisy private estimates of what is, at bottom, one shared value. From this they conclude that we need no veto and no unanimity rule at all, only a correction each researcher applies privately: authorize only when the experiment would still look worth doing conditional on one's own estimate being the highest in the group, the way a well-advised bidder shades. Another faction reads the same analogy as supporting a hard near-unanimity requirement. I am not sure either reading is earning its keep.

  Please audit the analogy. My own worries are that the actor in our case does not pay the price the winner pays, that we have no track record from which to calibrate how wrong we each tend to be, and that what we disagree about may be values rather than a single common quantity being estimated — but I cannot tell how much any of that matters.

  Structure your reply in these sections, in this order:

  1. The mapping (about 150 words, a table of correspondences is fine): what in the auction plays the role of each researcher, the shared value, the private estimate, the winning bid, the overpayment, and the other bidders.
  2. Where the analogy genuinely holds (about 100 words): the features the two cases share that do the explanatory work.
  3. The disanalogies that matter (about 250 words): three or four, ranked by how much they affect what the analogy can support, and separated from disanalogies that are merely decorative.
  4. What the auction frame quietly imports (about 100 words): structural assumptions about payoffs, repetition, error distributions, and shared aims that our institute may not have.
  5. Verdict on shade, don't veto (about 150 words): whether the no-veto conclusion survives, whether it survives for the reasons its defenders give, and what the conditional-on-being-most-optimistic test would actually require here.
  6. A better analogy (about 100 words): one comparison that carries the same core insight without the misleading features, or a note on why none is available.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Context:** The user sits on an internal review board (IRB) of a research institute.
      *   **Problem:** One of eight senior researchers can unilaterally authorize high-consequence experiments. Downsides are borne by everyone (collective risk). Upsides likely accrue to the authorizer (individual benefit/prestige).
      *   **Conflict:** One faction argues this is a "winner's curse" scenario (common-value auction) and suggests private bid shading (authorize only if still worth it conditional on being the most optimistic). Another faction argues this supports near-unanimity.
      *   **User's Worries:** Actor doesn't pay the price (externality), no track record for calibration, disagreement might be about values not facts.
      *   **Task:** Audit the analogy between the IRB situation and a common-value auction.
      *   **Structure:** Six specific sections with word count constraints.
          1.  The mapping (~150 words).
          2.  Where the analogy genuinely holds (~100 words).
          3.  The disanalogies that matter (~250 words).
          4.  What the auction frame quietly imports (~100 words).
          5.  Verdict on shade, don't veto (~150 words).
          6.  A better analogy (~100 words).

  2.  **Drafting - Section by Section:**

      *   **Section 1: The mapping**
          *   Need to map: Researcher -> Bidder, Shared Value -> True Risk/Benefit of Experiment, Private Estimate -> Individual Assessment, Winning Bid -> Authorization Decision, Overpayment -> Negative Consequence/Regret, Other Bidders -> Other Board Members.
          *   Constraint: ~150 words.
          *   Drafting:
              *   Researcher = Bidder.
              *   Authorization = Winning Bid.
              *   True Net Value of Experiment = Common Value of Item.
              *   Individual Risk/Benefit Assessment = Private Signal/Estimate.
              *   Collective Downside = Overpayment (Winner's Curse).
              *   Other Board Members = Losing Bidders.
              *   Unilateral Authority = Auction Rule (Highest Bid Wins).
              *   Private Correction = Bid Shading.
              *   The core mapping posits that the researcher who authorizes is the one with the highest estimated net benefit, just as the highest bidder wins the item. The "curse" is realizing post-authorization that the collective cost exceeds the benefit, analogous to paying more than the item's worth.

      *   **Section 2: Where the analogy genuinely holds**
          *   Focus: Selection effect on noisy estimates.
          *   Constraint: ~100 words.
          *   Drafting:
              *   The analogy holds regarding the selection mechanism. In both cases, the outcome is determined by the extreme value of a distribution of private estimates. If estimates are noisy and unbiased, the maximum estimate is systematically higher than the true value. Consequently, acting on the maximum estimate without adjustment leads to systematic error. Both scenarios involve asymmetric information where agents act on private signals regarding a shared outcome, creating a risk that the decision-maker is the one who most overestimated the benefit or underestimated the risk.

      *   **Section 3: The disanalogies that matter**
          *   Focus: Incentives, Externalities, Values vs. Facts, Repetition.
          *   Constraint: ~250 words.
          *   Drafting:
              *   1. **Incentive Alignment (Critical):** In auctions, the winner pays the price. Here, the authorizer reaps prestige/benefit, while the board bears the downside. This is a moral hazard, not just a winner's curse. The bidder internalizes the curse; the researcher externalizes it.
              *   2. **Common Value vs. Heterogeneous Values:** Auctions assume a single true value. Research ethics often involve conflicting values (scientific progress vs. safety). Disagreement isn't just noise around a truth; it's fundamental weighting of different goods. Shading assumes a shared truth exists to be approximated.
              *   3. **Lack of Calibration Data:** Bid shading requires knowing the distribution of errors. Without a track record of past decisions and outcomes, researchers cannot calculate the conditional probability required for shading. They are flying blind, making the mathematical correction impossible to implement practically.
              *   These disanalogies undermine the "shade, don't veto" solution because the actor lacks the skin in the game to care about the curse, and the epistemic conditions to calculate the shade.

      *   **Section 4: What the auction frame quietly imports**
          *   Focus: Assumptions about payoffs, repetition, error distributions, shared aims.
          *   Constraint: ~100 words.
          *   Drafting:
              *   The auction frame assumes rational agents maximizing personal utility within a repeated game where errors average out. It imports a assumption of symmetric error distributions and a shared objective function (maximizing net value). It presumes the "price" is transparent and immediately felt by the decision-maker. Crucially, it assumes the goal is efficiency in allocation, whereas the IRB's goal is risk mitigation and ethical compliance, which are not necessarily aggregable into a single value metric.

      *   **Section 5: Verdict on shade, don't veto**
          *   Focus: Does the conclusion survive? Reasons? Conditional test requirements?
          *   Constraint: ~150 words.
          *   Drafting:
              *   The "shade, don't veto" conclusion fails. It survives only if researchers internalize collective costs, which they do not. The defenders' reasoning ignores the externality problem. Furthermore, the conditional test—"authorize only if worth it given you are the most optimistic"—requires knowing the distribution of colleagues' estimates. Without data or communication, this is impossible. Even if possible, it relies on the false premise that disagreement is merely noise. Since the authorizer does not pay the "overpayment," bid shading is not a Nash equilibrium here. Unanimity or veto power is better supported because it forces internalization of dissent, addressing the externality that the auction model ignores.

      *   **Section 6: A better analogy**
          *   Focus: Alternative comparison.
          *   Constraint: ~100 words.
          *   Drafting:
              *   A better analogy is a **nuclear launch key** or **pollution permit**. One actor can trigger a consequence affecting all, but does not bear the full cost. This highlights the externality and asymmetry of risk. Alternatively, view it as a **public good provision problem** with negative externalities. These frames capture the moral hazard and collective risk better than auctions, supporting structural constraints (vetoes) rather than relying on private cognitive corrections which lack enforcement mechanisms.

  3.  **Review and Refine (Word Count Check):**

      *   *Section 1:* Draft looks okay. Need to ensure it's tight.
      *   *Section 2:* Need to keep it focused on the selection effect.
      *   *Section 3:* Need to ensure I hit ~250 words. I need to expand on the three points.
      *   *Section 4:* Keep it tight around assumptions.
      *   *Section 5:* Ensure the verdict is clear.
      *   *Section 6:* Keep it concise.

      *Refining Section 3 (Disanalogies):*
      1. Incentive/Externality: Winner pays vs. Group pays.
      2. Epistemic: Noise vs. Value conflict.
      3. Calibration: Known distribution vs. Unknown/No track record.
      *Expansion:* I need to make sure I explain *why* these matter for the specific policy recommendation (veto vs. shading).

      *Refining Section 5 (Verdict):*
      Make sure to address the "conditional-on-being-most-optimistic" test specifically.

