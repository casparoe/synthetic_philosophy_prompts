      *   **The Problem:** Pascal's Mugging/Wager. If any tiny probability of infinite/near-infinite value dominates finite certain value, we end up ignoring all certain goods for speculative cosmic ones.
      *   **Discounting:** Temporal discounting (future benefits worth less?) vs. Moral discounting (do future people count less?).
      *   **Risk/Uncertainty:** Knightian uncertainty vs. Risk. Is the 1-2% estimate reliable? (Based on pilot data: 1/14 succeeded so far).
