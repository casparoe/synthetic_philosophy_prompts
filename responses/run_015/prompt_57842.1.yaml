      *   **Option 2 (Speculative/High Impact):** Former student's network. Drought tolerant seed kits + instructions to small towns. Chain reaction model (each town helps start two more). Most chains fizzle (11/14 stopped by 3rd round, 2 to 5th, 1 still spreading in 6th year). Infusion could give 1-2% chance of self-sustaining spread for decades. Each new garden feeds ~30 families. Potentially open-ended growth.
      *   **The Puzzle:** Expected utility calculation suggests Option 2 (tiny chance * huge impact > certain * modest impact). But this leads to "Pascal's Mugging" territory (always chase remote possibilities with huge stakes). Ignoring scale feels parochial.
      *   **Specific Questions:** How to compare sure bounded benefit vs. tiny chance of unbounded growth? Should distant additions count for less? Should tiny chances be treated differently? How to avoid a rule that always tells me to chase the most remote possibility?
