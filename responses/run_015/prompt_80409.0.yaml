answer: |-
  Here is a menu of readings for the slogan **"A forgery is a lie, not just a bad copy,"** applied to your specific scenario (a perfect, non-deceptive reconstruction of a destroyed work).

  ### 1. The Deception Reading
  *   **The Claim:** The object is deficient because it is intended to defraud a viewer about its identity.
  *   **Verdict:** **False** (in this context).
      *   **Reasoning:** You specified that "nobody is passing it off" and paperwork distinguishes it. By the standard legal and folk definition, this object is not a forgery because there is no intent to deceive.
  *   **Does it support the "Missing Something" thesis?** **No.**
      *   If there is no deception, this reading cannot explain why the replica lacks value. It suggests the replica is morally neutral, which undermines the museum scholar's argument that it is ontologically lesser.

  ### 2. The Causal History Reading (The Goodman Argument)
  *   **The Claim:** The "lie" is not about fooling the eye, but about falsely claiming a specific history of production. The object claims a causal lineage (the artist's hand at time *T*) that it does not possess.
  *   **Verdict:** **Defensible.**
      *   **Reasoning:** Philosopher Nelson Goodman argued that in "autographic" arts (like painting), the history of production is part of the work's identity. Even a molecule-perfect match is a different work if the causal chain is different. The replica "lies" about its genesis, even if its paperwork tells the truth.
  *   **Does it support the "Missing Something" thesis?** **Yes.**
      *   This is the strongest philosophical support. It argues the replica lacks **provenance as an aesthetic property**. The "something missing" is the specific historical trajectory from the artist's mind to the canvas.

  ### 3. The Intentional Reading (The Creative Act)
  *   **The Claim:** The "lie" is that the object presents itself as a record of a creative decision, when it is actually a record of a technical reconstruction.
  *   **Verdict:** **Defensible.**
      *   **Reasoning:** The original painting embodies the artist's choices made in real-time (risk, hesitation, inspiration). The replica embodies a conservator's choices made to *match* those outcomes. The mental state behind the brushstroke is different (creation vs. replication).
  *   **Does it support the "Missing Something" thesis?** **Yes.**
      *   It argues the replica lacks **agency**. The value lies in the performance of creativity, not just the resulting pattern of pigments. The replica is a document of a puzzle solved, not a vision expressed.

  ### 4. The Authorship Reading
  *   **The Claim:** The object is a "lie" because it bears the artistic identity of Person A, but was physically executed by Person B.
  *   **Verdict:** **Platitude.**
      *   **Reasoning:** It is trivially true that the original artist did not paint the replica. This is a matter of fact, not a deep philosophical insight.
  *   **Does it support the "Missing Something" thesis?** **Weakly.**
      *   It explains the price difference (signature value), but it doesn't explain why the *experience* of the object might be lesser. It reduces the argument to "autographs are worth more," which is economic, not aesthetic.

  ### 5. The Institutional Status Reading
  *   **The Claim:** The object is a "lie" because the art world (museums, markets) refuses to grant it the status of "Original," and that refusal constitutes its reality.
  *   **Verdict:** **Defensible (but circular).**
      *   **Reasoning:** Art is an institutional category (per George Dickie). If the institution says it's a copy, it functions as a copy. The "lie" is attempting to occupy a category (The Original) that the institution has reserved for a specific artifact.
  *   **Does it support the "Missing Something" thesis?** **No.**
      *   This suggests the missing element is purely social agreement. It implies that if the museum *changed its mind*, the replica would gain the missing value. The scholar wants to argue the value is intrinsic to the object's history, not just its label.

  ### 6. The Aesthetic Experience Reading (The Benjamin Argument)
  *   **The Claim:** The "lie" is that the replica claims to offer the same aesthetic experience as the original, but it cannot because it lacks the "aura" of the unique existence.
  *   **Verdict:** **Contested / Defensible.**
      *   **Reasoning:** Walter Benjamin argued that mechanical reproduction strips the "here and now" of the work. Even if visually identical, knowing it is a reconstruction changes the viewer's psychological engagement. We look *at* a copy; we look *into* an original.
  *   **Does it support the "Missing Something" thesis?** **Yes.**
      *   It argues the replica lacks **presence**. The "something missing" is the viewer's knowledge of the object's survival and uniqueness, which alters the aesthetic reception even if the pixels are identical.

  ### 7. The Moral Status Reading
  *   **The Claim:** Forgery is inherently immoral, and this object shares that moral stain.
  *   **Verdict:** **False.**
      *   **Reasoning:** Without intent to defraud (as per your scenario), there is no moral transgression. A reconstruction made for education or preservation is ethically virtuous, not vicious.
  *   **Does it support the "Missing Something" thesis?** **No.**
      *   If the object is morally neutral or positive, this reading cannot explain why it is aesthetically or ontologically inferior to the original.

  ### Summary for the Argument
  If the museum scholar wants to prove the replica is **missing something important** (beyond money and law), they should rely on:
  1.  **Causal History** (It lacks the correct genesis).
  2.  **Intention** (It lacks the creative performance).
  3.  **Aesthetic Experience** (It lacks the "aura" of uniqueness).

  They should **avoid** relying on:
  1.  **Deception** (There is none).
  2.  **Moral Status** (There is no sin).
  3.  **Institutional Status** (This admits the value is arbitrary).

  The slogan "A forgery is a lie" only works here if "lie" is interpreted metaphorically as **"an ontological falsehood about its own history,"** rather than a legal falsehood about its ownership.
