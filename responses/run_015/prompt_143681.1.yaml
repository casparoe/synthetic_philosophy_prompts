answer: |-
  This is a sophisticated breakdown of a messy public argument. You are right to sense that the "man-of-his-time" defense is not a single argument, but a coalition of four distinct claims that often contradict each other. When people use the phrase, they are usually switching between them depending on which one is taking fire.

  Here is the mapping of the defense as it operated during the June 2020 Parliament Square row, followed by an assessment of its structural integrity, and finally, a suggestion for how to handle the mantelpiece without reducing the conversation to "it's complicated."

  ### 1. Mapping the Four Arguments

  You identified the four strands correctly. Here is how they functioned in the 2020 debate, and where the load-bearing walls are.

  **Argument 1: Universal Consensus ("Nobody knew better then")**
  *   **The Claim:** Racial hierarchy was the global default setting in the early 20th century. Churchill cannot be blamed for holding views that were universally shared.
  *   **The Load:** This is the easiest shield to grab, but it is structurally unsound. As you noted, it is historically falsifiable. There were anti-colonial voices in India and Africa at the time; there were MPs in Westminster (like his own party members or Labour opponents) who criticized imperial policy; there were contemporaries who did not share his specific views on the "civilizing mission."
  *   **Verdict:** This argument collapses under basic scrutiny. It requires ignoring the existence of Churchill's contemporary critics. If you rely on this, you are defending a myth, not the man.

  **Argument 2: Comparative Virtue ("He was the best of a bad bunch")**
  *   **The Claim:** Even if his views were objectionable, his net utility was higher than any available alternative. In 1940, he was the necessary instrument of survival.
  *   **The Load:** This is the strongest load-bearing wall. It shifts the metric from "moral purity" to "strategic necessity." It admits the racism but argues the victory over fascism outweighs the moral cost of the empire.
  *   **Verdict:** This survives contact with history, but it changes the nature of the honor. It moves Churchill from "Good Man" to "Necessary Leader." It justifies the statue as a monument to a specific outcome (1940 victory), not a endorsement of his whole character.

  **Argument 3: Hypocrisy/Standing ("We'd do the same")**
  *   **The Claim:** We are in no position to judge because our own era has moral blind spots that the future will condemn.
  *   **The Load:** This is a rhetorical deflection, not a moral defense. It attempts to neutralize the judge rather than defend the accused.
  *   **Verdict:** Weak. It shuts down moral progress. If we cannot judge the past because we will be judged in the future, we cannot judge anything. It creates moral paralysis.

  **Argument 4: Anachronism ("The words don't apply")**
  *   **The Claim:** Calling him a "racist" is applying a 21st-century category to a 19th-century mindset.
  *   **The Load:** This is a semantic shield. It argues that while his actions look like racism now, they were categorized differently then (e.g., "imperial duty").
  *   **Verdict:** Partially valid on semantics, invalid on substance. The *word* "racist" might be anachronistic, but the concept of valuing one life over another based on origin was understood then (hence why contemporaries criticized him).

  **Summary of the Defense:** In 2020, the government and defenders leaned heavily on **Argument 2** (Comparative Virtue) disguised as **Argument 1** (Universal Consensus). They wanted the moral cover of "everyone thought that" without admitting that "some people disagreed, but we chose him anyway."

  ### 2. The Colston Contrast

  You asked if the "man-of-his-time" defense explains the difference between Churchill (covered up, kept up) and Colston (toppled, in a museum).

  The answer is no. The "man-of-his-time" defense applies equally to both. Edward Colston was a product of the 17th-century mercantile consensus; Churchill was a product of the 19th-century imperial consensus. If Argument 1 (Universal Consensus) saved Churchill, it should have saved Colston.

  The difference in treatment wasn't about the *defense*; it was about the *function* of the statue.
  *   **Colston:** His primary public legacy was wealth generation through the slave trade. The statue was a celebration of that specific utility. When the utility is deemed morally catastrophic, the statue loses its reason to exist.
  *   **Churchill:** His primary public legacy is national survival during existential war. The statue is a celebration of that specific utility. The racism is viewed by defenders as a tragic flaw attached to the savior, rather than the *source* of the achievement.

  The "man-of-his-time" defense is not a consistent principle; it is a **retrospective filter**. It is applied to figures whose net utility we still require. We say "man of his time" when we want to keep the statue; we say "accountable to universal morals" when we want to take it down. It is a conclusion, not a premise.

  ### 3. Commemoration vs. Canonization

  This is the most critical point for your family situation. Your brother is right that a mantelpiece or plinth is an assertion, but the "man-of-his-time" defense fails because it tries to answer the wrong question.

  *   **The Defense asks:** "Was Churchill a good man?" (Blame/Soul)
  *   **The Object asks:** "What story are we telling about ourselves?" (Commendation/Narrative)

  The "man-of-his-time" defense tries to clear Churchill's conscience. But a statue isn't there to clear his conscience; it's there to signal our values. You can accept that Churchill was a man of his time (flawed, imperialist, racist) and still decide to keep the statue, *provided* you change what the statue signifies.

  **Can honor be scoped?**
  Yes. This is the "Retain and Explain" model used by many museums now. You can honor the **1940 Churchill** (defiance, leadership, survival) without honoring the **1930s Churchill** (views on India, economic policy) or the **1950s Churchill** (post-war decline).
  *   **Whose time is his time?** It is whichever time you are commemorating. If the bust is about the War, it is 1940. If the bust is about his life's work, it is 1874–1965. The conflict arises when defenders treat the 1940 hero as a shield for the 1890s imperialist.

  **The Gap in the Defense:**
  The "man-of-his-time" defense cannot tell you **what to do with the object.** It can only tell you how to think about the man. It creates a moral exemption for Churchill, but it does not create a curatorial instruction for your family. It leaves the question of *stewardship* unanswered.

  ### 4. How to Referee Christmas

  You want to avoid "it's complicated" (which sounds like dismissal) and avoid picking a side (which starts a fight). You need to shift the frame from **Verdict** to **Stewardship**.

  Here is a framework you can use to speak to both your brother and your grandad. It validates the history without erasing the memory.

  **The Core Distinction:**
  "The bust isn't a verdict on Churchill's soul; it's a marker of Grandad's story."

  **What to say (Drafting for the room):**
  "I've been thinking about this, and I think we're arguing past each other because we're asking different questions.
  *   **To Brother:** You're asking if Churchill was a 'good man' by a universal standard. You're right that the 'man of his time' excuse doesn't hold up completely—people disagreed with him then, and the cost of his policies was real. Keeping the bust shouldn't mean ignoring that.
  *   **To Grandad:** You're not keeping the bust to make a statement about India or the Empire. You're keeping it because that man represents the leadership under which you landed in Normandy and came home. For you, it's not about his views on race; it's about his stance against tyranny when it mattered most.
  *   **The Synthesis:** If we put the bust in the garage, it feels like erasing Grandad's service. If we keep it on the mantel without context, it feels like endorsing the worst parts of Churchill.
  *   **The Proposal:** We keep the bust on the mantel, because it belongs to Grandad's history, not Churchill's biography. But we acknowledge that the story it tells is specific. It tells the story of 1940, not 1930. It tells the story of survival, not empire. We don't need to hide it, but we don't need to pretend it represents the whole man either."

  **Why this works:**
  1.  **It validates the Brother:** You admit the "man-of-his-time" defense is flawed (Argument 1 is dead). You acknowledge the moral cost.
  2.  **It validates the Grandad:** You anchor the object to *his* experience (Normandy), which is immune to historical revisionism. His memory of what Churchill meant to him is factually true, regardless of Churchill's flaws.
  3.  **It solves the Object Problem:** It treats the bust as a family artifact (stewardship) rather than a public monument (canonization). A family mantel is allowed to be more nuanced than a Parliament Square plinth. It allows for "scoped honor."

  **If they push back:**
  *   **If Brother says:** "But displaying it still honors him."
      *   **You say:** "It honors what he did for the generation that fought him. We can hold gratitude for the victory and criticism for the empire at the same time. Putting it in a box suggests we're ashamed of Grandad's history, not just Churchill's flaws."
  *   **If Grandad says:** "He was a hero, full stop."
      *   **You say:** "He was your hero. And for what you went through, he was. We're not talking about taking that away. We're just acknowledging that history has gotten bigger since then, and we can fit both truths in the room."

  ### Summary for your notes

  1.  **The Defense is a Bundle:** It mixes four arguments. Argument 1 (Consensus) is false. Argument 2 (Comparative Virtue) is the only one that holds water.
  2.  **The Defense is Selective:** It explains why Churchill is kept and Colston wasn't only if you admit it's about *utility*, not moral consistency.
  3.  **The Defense Fails on Action:** It excuses the man but doesn't instruct the curator. It cannot tell you whether the bust stays or goes.
  4.  **The Better Frame:** Shift from **Blame** (Was he good?) to **Narrative** (What does this object signify for us?).
  5.  **The Christmas Line:** "The bust isn't about who Churchill was; it's about what he meant to the people who fought under him. We can honor Grandad's experience without endorsing Churchill's whole life."

  This allows you to be honest about the history (satisfying the brother) without desecrating the memory (satisfying the grandad), and it avoids the trap of trying to solve a historical paradox on Christmas Day.
