answer: |-
  The slogan "rationalists should win" is equivocal. Here are the three distinct readings available to your forum interlocutor, their verdicts on classic Newcomb, and their breaking points.

  **1. The Ex Post View (Actual Outcome)**
  *Claim:* Rationality is judged solely by the money in your pocket in the actual world you inhabit.
  *Verdict:* **One-boxing wins.** Since Omega predicts perfectly, the one-boxer finds $1M; the two-boxer finds $1k.
  *Plausibility:* Low. This conflates rationality with luck. If Omega glitches (0.01% error), the two-boxer wins $1.001M while the one-boxer gets $0. Under this definition, a lucky idiot is more rational than a careful agent hit by black-swan variance.
  *Collapse:* Collapses into hindsight bias.

  **2. The Ex Ante View (Decision Procedure)**
  *Claim:* Rationality is the algorithm that maximizes expected utility across the portfolio of possible scenarios an agent might face (including the predictor's simulation).
  *Verdict:* **One-boxing wins.** The policy "always one-box" causes Omega to fill the box. The policy "always two-box" causes emptiness.
  *Plausibility:* High. This is the core of Functional Decision Theory (FDT). It defines rationality as source-code optimization rather than situational causation.
  *Collapse:* Distinct from Ex Post. It admits you might lose in a specific glitched instance but insists you're still rational.

  **3. The Evidential View (Good News)**
  *Claim:* Rationality is choosing the action that provides the strongest evidence for a desirable state of affairs.
  *Verdict:* **One-boxing wins.** One-boxing is strong evidence the box is full.
  *Plausibility:* Moderate. This is Evidential Decision Theory (EDT).
  *Collapse:* Often collapses into Ex Ante in Newcomb, but diverges elsewhere (see Smoking Lesion).

  **The Forum Guy's Dependency**
  Your interlocutor needs **Reading 2 (Ex Ante)** to define rationality, but he sells it using the intuition of **Reading 1 (Ex Post)**. He argues that because one-boxers *actually* walk away richer (Reading 1), their procedure *must* be the rational one (Reading 2). This works in classic Newcomb because the predictor is near-perfect, aligning actual outcomes with policy optimality.

  **The Stress Tests**
  Here is where his slogan fractures:

  *   **55% Predictor:** If Omega is only slightly better than chance, the Ex Ante calculation may flip. If the expected utility of two-boxing exceeds one-boxing given the error rate, Reading 2 demands two-boxing. Will he still say "rationalists should win" while pointing to the one-boxer? If he sticks to one-boxing, he's abandoned Reading 2 for dogma.
  *   **Smoking Lesion:** A lesion causes both cancer and the desire to smoke. Smoking doesn't cause cancer. Reading 3 (Evidential) says "don't smoke" (it's bad news). Reading 2 (Ex Ante/CDT) says "smoke" (you enjoy it, causality is inert). If he says "rationalists don't smoke," he's an evidentialist who sacrifices causal efficacy for correlation. If he says "smoke," he admits "winning" doesn't mean avoiding bad news.
  *   **Transparent Boxes:** You see the $1M sitting there. Reading 1 says "take both" (money is already there). Reading 2 requires you to act as if you couldn't see it (precommitment). This is a hard pill: "winning" requires ignoring visible reality to satisfy a counterfactual constraint. Many one-boxers falter here.

  **Verdict**
  The slogan beats the two-boxer in classic Newcomb under Reading 2 (Policy). It is not just vibes; FDT genuinely outperforms CDT in predictor-heavy environments. However, your friend is likely smuggling in Reading 1 to make it feel obvious. Point out that if "winning" means "getting the cash in this specific instance," he's worshipping luck. If it means "running the best algorithm," ask him what that algorithm does when the boxes are transparent or the predictor is weak. That's where the vibes run out.
