prompt: |-
  I hang around the decision-theory corners of the internet, and every Newcomb's problem thread eventually gets someone declaring "rationalists should win", like that settles it. Latest instance: some bloke told me that since the one-boxers walk off with the million and the two-boxers don't, one-boxing obviously just IS rationality, and my going on about dominance and the money already being in the box or not is me redefining rationality so that it loses on purpose. I'm fairly sure that slogan is secretly doing several different jobs at once, and I'd like to be able to say exactly which.

  So: lay out the distinct precise claims "rationalists should win" could be standing for. By "win" does it mean (a) you end up with the best outcome in the particular single case you're actually in, (b) you run the decision procedure that does best when the same sort of agent faces a whole portfolio of Newcomb-like setups, (c) your choices are the ones that correlate with good news even when you can't causally produce it, or (d) something I haven't thought of. For each reading, say whether it's plausible in its own right, whether it quietly collapses into one of the others, and — most importantly — whether it actually delivers one-boxing in the classic setup where the predictor is near-perfect.

  Then tell me which reading the forum guy needs for his argument to go through at all, and whether that same reading drags him into positions he'd hate once you tweak the case. What does "winning" say when the predictor is only right 55% of the time? In the smoking-lesion version, where the "predictor" is a lesion that disposes you to take the risky option and also causes the bad outcome, so the choice itself is causally inert? And in the version with the transparent box, where you can literally see the million sitting there before you choose? I definately want to be able to post this as a reply without getting dogpiled, so be honest about where the slogan genuinely beats the two-boxer and where it's just vibes. A menu of readings with verdicts, not an essay — maybe 600 words.
