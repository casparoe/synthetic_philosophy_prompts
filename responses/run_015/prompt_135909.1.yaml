answer: |-
  Yes, there is a name for this, and your intuition that it is a distinct "carve" from the standard Dutch Book argument is correct. You are not pattern-matching incorrectly; you have identified the difference between **Synchronic Consistency** and **Diachronic (or Dynamic) Consistency**.

  Here is the breakdown of the terminology, the target of the criticism, the neighbors, and the conditions for immunity.

  ### 1. The Name and the Gap

  *   **Pattern 1 (Standard):** **Synchronic Dutch Book.** This targets your beliefs at a single moment ($t_1$). If your probabilities don't sum to 1 or violate the axioms of probability, you can be pumped *now*.
  *   **Pattern 2 (Your Mystery):** **Diachronic Dutch Book** (sometimes called a **Dynamic Dutch Book**). This targets your **updating rule** over time ($t_1 \to t_2$).

  The gap between them is **Dynamic Consistency**. A decision-maker is dynamically consistent if a plan chosen at $t_1$ remains the preferred plan at $t_2$, given the information available at $t_2$.

  In the scenario you described, the agent is *synchronicly* coherent (at $t_1$ their books balance; at $t_2$ their books balance) but *diachronically* incoherent (the trajectory from $t_1$ to $t_2$ guarantees a loss).

  ### 2. What Exactly Is Being Criticized?

  You asked whether the slide from "you can be drained" to "your beliefs are irrational" is licensed. **It is not fully licensed.** The criticism is more specific.

  *   **Not the Static Beliefs:** As you noted, the beliefs at $t_1$ are coherent, and the beliefs at $t_2$ are coherent *conditional on the new information*.
  *   **The Updating Rule:** The vulnerability lies in the **rule of revision**. In formal epistemology, the shield against a Diachronic Dutch Book is **Bayesian Conditionalization**.
      *   If you update by setting $P_{new}(H) = P_{old}(H \mid E)$, you are immune to Diachronic Dutch Books (proven by David Lewis and Brian Skyrms in the 1980s/90s).
      *   If you "overshoot" (e.g., you see evidence $E$ that warrants a shift from 0.5 to 0.6, but you shift to 0.8), you have violated conditionalization. That specific deviation is what the bookie exploits.
  *   **The "Binding" Issue:** You asked if the criticism is about the person's inability to bind themselves.
      *   In **Decision Theory** (the stop-loss/drinking example): Yes, this is often framed as a failure of **self-control** or **Time Inconsistency** (e.g., hyperbolic discounting). The criticism is that your preference ordering changes merely due to the passage of time, not new information.
      *   In **Epistemology** (the betting/example): The inability to bind yourself is a *symptom*, not the root cause. If your updating rule were correct (Conditionalization), you *wouldn't need to bind yourself*. Your future self would naturally agree with your past self's plan because the update would be mathematically forced by the evidence. If you need a pre-commitment device to stop your future self from taking a bet, it proves your updating rule is systematically biased.

  **Verdict:** The criticism is of the **updating policy**, not the static beliefs. The "irrationality" label applies to the *process*, not necessarily the *state*.

  ### 3. Nearest Neighbors and Distinctions

  Here is how this pattern relates to the other concepts you mentioned:

  | Concept | Relation to Pattern 2 | Why it differs |
  | :--- | :--- | :--- |
  | **Money Pump (Intransitivity)** | **Different.** | Money pumps usually rely on synchronic intransitivity ($A>B, B>C, C>A$). You can be pumped instantly without time passing or new info. Pattern 2 *requires* time and information change. |
  | **Time Inconsistency** | **Structural Cousin.** | This is the decision-theory version (e.g., preferring \$100 today over \$110 tomorrow, but preferring \$110 in 366 days over \$100 in 365 days). Pattern 2 is the *epistemic* version. Time inconsistency often happens without new info; Pattern 2 usually involves updating on evidence. |
  | **The Reflection Principle** | **Close Relative.** | Van Fraassen's Reflection Principle states your current belief should match your expected future belief. Violating Reflection makes you vulnerable to a Diachronic Dutch Book. This is the formal constraint that Pattern 2 tests. |
  | **Adversarial Exploitation** | **Not Required.** | You asked if an adversary is needed. **No.** An adversary is needed to *prove* the inconsistency via a betting argument, but the *loss* can occur against nature. If your updating rule is flawed, you will make systematically worse decisions than a conditionalizer, even if no one is actively betting against you. The "bookie" is just a proof device. |

  ### 4. Corrections and Immunity Conditions

  You asked if some way of revising is provably immune. **Yes.**

  *   **The Shield:** **Strict Bayesian Conditionalization.**
  *   **The Condition:** You must treat the evidence you receive as **certain** (probability 1) at the moment you update.
  *   **The Caveat (Jeffrey Conditionalization):** If you are uncertain about the evidence itself (e.g., "I think I saw a heads, but the light was dim"), standard conditionalization doesn't apply. You need **Jeffrey Conditionalization**. If you deviate from *that*, you are again vulnerable to a Diachronic Dutch Book.
  *   **Your "Overshooting" Example:** Your memory is likely correct in principle. If an agent updates more aggressively than the likelihood ratio warrants (e.g., base-rate neglect or representativeness heuristic), they violate conditionalization. A bookie can sell them a bet at $t_1$ (when the price is low) and buy it back at $t_2$ (when the agent has overshot the price), guaranteeing a profit for the bookie and a loss for the agent.

  **One Correction on "Binding":**
  You wrote: *"Two people with the same beliefs and the same way of revising, differing only in whether they can commit — one gets bled, one doesn't."*
  This is slightly imprecise. If they have the *same way of revising*, and that way is flawed (non-conditionalizing), the one who **cannot** commit gets bled. The one who **can** commit avoids the bleed *in this instance*, but they are still epistemically irrational. They are essentially using willpower to override their own broken updating algorithm. The vulnerability remains in their cognitive architecture; they just patched it with a constraint.

  ### 5. Confidence and Uncertainty

  **Confidence in Main Claim:** **High (90%+).**
  The distinction between Synchronic and Diachronic Dutch Books is standard in formal epistemology and decision theory (Lewis 1999, Skyrms 1987, Maher 1992). The link between Diachronic Dutch Books and violations of Conditionalization/Reflection is a proven theorem.

  **Least Certain Element:** **The Specific "Overshooting" Example.**
  I am less certain about the specific coin-flip reconstruction you recalled ("overshoots when they revise"). While non-Bayesian updating is definitely vulnerable, the specific mechanics of the "coin of unknown bias" scenario can get tricky depending on whether the agent knows their own bias in updating. If the agent *knows* they overshoot, they violate the **Reflection Principle** at $t_1$ (because they know their future belief will be skewed), which technically collapses the problem back into a Synchronic inconsistency at $t_1$.
  *   *Why this matters:* If the agent *knows* they are irrational, the Diachronic argument is redundant; they are already synchronicly irrational for having beliefs that they know will change without evidence. The Diachronic argument is strongest when the agent *thinks* their updating rule is rational, but it isn't.

  **Summary:** You have correctly identified **Diachronic Dutch Booking**. It criticizes **updating rules**, not static beliefs. It is distinct from Money Pumps (which are synchronic) but isomorphic to Time Inconsistency. Immunity is granted by **Bayesian Conditionalization**.
