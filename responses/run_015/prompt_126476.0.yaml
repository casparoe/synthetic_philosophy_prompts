prompt: |-
  right, i've been mulling over this deontolgy thing — you know, the paradox where following a moral rule ends up causing more harm than breaking it, but breaking it still feels wrong regardless of the outcome. i keep running into something i call the mirror problem: if i refuse to push one person off a bridge to save five because using people as a means is wrong, but then i just stand there and let five die, isn't my inaction also using my own clean conscience as a kind of means? i'm treating my moral purity as more important than their lives. so any decent theory that actually fixes this needs to cover that mirror thing, but i don't know what else it should cover.

  can you write me the full list of requirments? i want the spec for what a proper resolution of the paradox has to deliver — the cases it must get right (like the bridge case, promises you can't keep without harming someone, and that mirror situation), the distinctions it can't collapse (doing harm vs letting harm happen, intentions vs results, my duty vs the overall good), and any results from psychology or real-world behaviour it can't flat out contradict. for each one, give the reason it's required. flag which are non-negotiable and which are just camp preferences. and tell me if any pair of these can't be satisfied together — that's the bit i really want to see.

  then briefly, how do the usual suspects stack up — the strict kantian view, the one where rules are only good if they usually produce the best results, and virtue ethics? just a quick scorecard, no essay needed.

  please don't give me a reading list or citations — i haven't got access to a library and i'm trying to work this out myself. and don't put anything in quotation marks unless you've actually fetched the text, i'd rather you paraphrase.
