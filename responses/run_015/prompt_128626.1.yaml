  I've been trying to square Gödel's modal ontological argument with his reported belief in an afterlife, and I keep running into the same snag: if maximal greatness entails necessary existence, then wouldn't the non-existence of post-mortem consciousness be a kind of modal failure? Like, a being lacking the power to preserve minds wouldn't be maximally great? So was Gödel basically smuggling an afterlife into the axiums of his proof, or is that a misreading? I'd like an answer in British English please — and don't just list books, I want to know where the reasoning actualy breaks down.
