      *   *Nuance:* Does Rousseau focus on the *spectator's complicity*? Yes, he worries about pity (*pitié*) in the theater being sterile. We cry at the play but do nothing in real life. This aligns with the "rewarding false display" idea. We expend moral emotion on a fiction, leaving less for reality.
      *   *Potential Weakness:* Rousseau also objects to theater based on content (Molière's *Misanthrope*), idleness, expense, and the corruption of women. Is the *epistemic asymmetry* the *root* cause or just one symptom?
      *   *Verdict:* It is defensible but needs to be framed carefully. It shouldn't claim to be the *only* argument, but rather the *structural* argument that underpins the moral psychology. The "complicity" angle is strong because it touches on *amour-propre* (seeking approval for simulated virtue).

  3.  **Evaluate the Civic Festival Comparison:**
