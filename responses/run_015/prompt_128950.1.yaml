answer: |-
  There is no established academic term for this specific rhetorical loop. You are correct that it is distinct from the Age-Period-Cohort (APC) identification problem. The APC problem is a *statistical* issue (collinearity in regression models); what you are describing is a *conceptual* shield that prevents falsification.

  Here is the carving you asked for.

  ### The Term: **The Cohort-Exposure Tautology**

  ### The Boundary Conditions
  For this label to apply, the argument must meet all four of the following conditions simultaneously. If any one is missing, it is not a tautology; it is just a standard (perhaps flawed) generational theory.

  1.  **Essentialist Trait Attribution:** A specific psychological or behavioral trait (e.g., anxiety, work ethic) is claimed to be intrinsic to a specific birth cohort (e.g., Gen Z).
  2.  **Event-Based Causality:** The trait is explicitly attributed to a specific historical exposure or event (e.g., the Pandemic, smartphones, 9/11).
  3.  **The Age Shield (Defending the Event):** When challenged on why older cohorts who experienced the *same event* do not display the trait, the explanation shifts to **developmental timing** (e.g., "They weren't in their formative years").
  4.  **The Cohort Shield (Defending the Trait):** When challenged on why developmental timing matters for *this* event specifically, the explanation shifts back to the **uniqueness of the cohort/event pairing** (e.g., "No other generation faced a pandemic during digital adolescence").

  ### Why It Is a Tautology
  The logic creates a closed loop where the **Cohort** is defined by the **Exposure**, but the **Exposure** is only deemed significant because of the **Cohort**.

  *   **Question:** Why does Gen Z have Trait X?
  *   **Answer:** Because they experienced Event Y.
  *   **Question:** Why didn't Millennials get Trait X from Event Y?
  *   **Answer:** Because they were the wrong age (Cohort definition).
  *   **Question:** Why does the age matter for Event Y?
  *   **Answer:** Because Event Y creates Trait X in Gen Z (Back to start).

  The variables (Age, Event, Cohort) are adjusted post-hoc to protect the conclusion from any counter-evidence. It renders the theory unfalsifiable.

  ### How to Use It
  When she sends an article or makes a claim, check the four conditions. If they are met, you can say:

  > "This isn't analysis; it's a **Cohort-Exposure Tautology**. You're using the event to define the cohort, and the cohort to define the impact of the event. It's a closed loop that can't be proven wrong."
