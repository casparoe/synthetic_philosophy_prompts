  6.  **Finalizing the Output:** Structure it clearly with the Score first, then the Margin Comments by section. (Wait, the prompt asks me to "give it a mark out of 10, and more usefully, the specific comments you'd write in the margin for each part". I will structure it as a Grade Summary followed by the Margin Comments).

