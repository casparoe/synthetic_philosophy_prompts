answer: |-
  **MEMORANDUM**

  **TO:** Predictive-Care Ethics Board
  **FROM:** [Your Name/Board Member]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Cardiac-Rehab AI Pilot (Reference Class Protocols)

  **Executive Summary**
  Regarding the proposed pilot AI for cardiac-rehabilitation slot allocation, I recommend **Approval with Specific Conditions**. While the tool offers potential efficiency gains, the "Reference Class Problem" presents a genuine ethical risk to informed consent and resource justice. We cannot treat the AI's output as a singular "risk score" without misleading patients and clinicians. Approval should be contingent on modifying how risk is communicated and establishing a strict review timeline to assess discordance rates between reference classes.

  **The Ethical Core: The Reference Class Problem**
  The technical objection is clear: for any patient (e.g., Mrs. Chen), the AI can generate contradictory risk profiles depending on how data is sliced (e.g., "Diabetic Women 65-75" vs. "High-Activity Diabetics"). The programmers argue this is inherent to statistics. However, ethically, this is not merely a matter of probabilistic uncertainty.

  When a patient asks, "What is my risk?", they are asking an indexical question. They are not asking about the frequency of events in a group they resemble; they are asking about the singular trajectory of their own body and life. This distinction matters. Frequentist statistics answer questions about sets; clinical care addresses individuals. When we present a risk score derived from an arbitrary grouping as if it applies to the individual, we commit a category error. We are presenting a property of a *class* as a property of a *person*.

  If we allocate scarce rehab slots based on a score that fluctuates based on arbitrary classification choices, we risk distributing care based on mathematical artifacts rather than clinical need. If Mrs. Chen is denied a slot because she was categorized by age rather than activity level, the decision rests on a choice made by the algorithm's architects, not her physiology.

  **Recommendation and Implementation Conditions**
  To proceed ethically, we must acknowledge that there is no "God's eye view" of Mrs. Chen's risk. The AI should not output a single number. Instead, I propose the following conditions for the pilot:

  1.  **Plurality of Prediction:** The interface must display the range of risk scores generated by the top three relevant reference classes (e.g., "Risk ranges from 15% to 40% depending on classification model"). This preserves the truthfulness of the statistics without reifying an arbitrary slice.
  2.  **Clinician Disclosure:** Physicians must be trained to explain that the score represents a "best estimate based on similar groups," not a deterministic prophecy. Informed consent forms should explicitly state that risk calculations are sensitive to how patient data is grouped.
  3.  **Audit for Discordance:** We will track cases where reference classes disagree significantly (e.g., >20% variance). These cases should be flagged for human committee review rather than automated triage.

  **Timeline and Review**
  *   **Pilot Duration:** 6 Months.
  *   **Month 3 Review:** Analyze the rate of "High Discordance" cases (where reference classes contradict). If >15% of patients fall into this category, the pilot pauses.
  *   **Month 6 Decision:** Board vote on continuation based on whether the "Plurality of Prediction" model improved trust and allocation fairness compared to standard triage.

  **The Strongest Argument for Rejection**
  I must acknowledge the principled argument for rejecting this pilot entirely. The objection holds that the Reference Class Problem is not a bug to be managed, but a fundamental epistemic limit that makes informed consent impossible in this context. If there is no fact of the matter regarding which reference class is the "correct" one, then there is no fact of the matter regarding the patient's risk score. Consequently, any allocation decision based on that score is procedurally unjust. From this view, adding conditions like "showing the range" merely exposes the arbitrariness without solving it; it asks physicians to justify decisions using numbers they know are unstable. If we cannot ground the risk score in the individual's specific causal physiology rather than group frequencies, we should not use the tool for allocation at all, as it substitutes mathematical convenience for moral justification.

  **Conclusion**
  While the argument for rejection is philosophically robust, a complete halt denies patients the potential benefits of data-driven insights that may outperform human intuition. By approving with conditions, we treat the AI as a decision-support tool rather than a decision-maker. We respect the patient's indexical question ("What about me?") by honestly admitting that our answer is derived from multiple, imperfect mirrors. This approach maintains scientific rigor while upholding our duty to transparency.

  I look forward to discussing this framework on Thursday.
