answer: |-
  We are gathered to say goodbye to a man who was made of this land. For eighty-eight years, he walked this earth, and for sixty of them, he worked it as a cattle rancher. He raised three generations here. He taught us how to read the sky for weather a week out, how to stretch wire until it sang, and how to stand firm when the wind tried to knock us down.

  To honor him properly, I cannot speak only of the sunsets and the open spaces. I must speak of the work itself. Ranching is an intimate partnership with life and death. I have spent years thinking about the animals that lived and died on this land. I have come to believe that we often look away from the cost of our sustenance. So, I will not stand here and claim that the animals he slaughtered did not suffer. I do not believe what he did was harmless. Pain is real, regardless of the species that feels it.

  But there is also truth in how he bore that weight. He was never cruel. There were times when kindness cost him money, when treating a sick calf or sparing a struggling animal cut into the margin, and he paid it without hesitation. He understood that if you must take a life, you owe it respect. He carried the moral burden of his livelihood so that we wouldn't have to starve, and so that we could stand here today.

  Some of us have left the land. Some of us still work it. We carry different relationships to the work he loved. But we all share the memory of the man who did it. He did not ask for our agreement on every hard thing he chose; he asked for our honesty.

  So, I choose honesty now. I love him not because his work was perfect, but because he did imperfect, hard things with as much care as a man could muster. He lived with the knowledge that life feeds on life, and he tried to minimize the shadow he cast.

  We inherit the land now, and we inherit the questions that come with it. May we face them with the same steadiness he showed. May we mend our fences, care for what is entrusted to us, and refuse to look away from the truth.

  Grandpa, you have worked your last day. The weather is clear, and the gates are closed. Rest now.
