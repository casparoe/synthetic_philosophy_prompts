answer: |-
  **MEMORANDUM**

  **To:** Interdisciplinary Research Ethics and Funding Committee
  **From:** Graduate-Student Representative
  **Date:** October 23, 2024
  **Subject:** Recommendation on Proposal 2024-CM-09 (Dennettian AI Taxonomy Pilot)

  **Recommendation**
  I recommend that the committee **approve Proposal 2024-CM-09 with conditions**. Specifically, we should authorize the $45,000 pilot grant to develop the evaluation rubric but **withhold pre-authorization** of the consequential protocol that triggers animal-subject oversight. Instead, the activation of any normative safeguards must be contingent upon a secondary committee review following the pilot's completion.

  **Engagement with Applicants**
  The applicants' reliance on Daniel Dennett's taxonomy is philosophically robust and institutionally necessary. Moving beyond a binary "conscious/not-conscious" framework is critical for AI ethics. Dennett's distinction between Skinnerian (reinforcement-based), Popperian (internal modeling), and Gregorian (cultural tool-use) creatures offers a functionalist granularity that aligns with how engineers actually build systems. Funding this rubric development acknowledges that moral status may be gradable rather than absolute. To reject this inquiry outright would be to ignore the functional realities of contemporary architectures in favor of metaphysical certainty we cannot currently possess.

  **Engagement with Opposing View**
  The strongest consideration against this proposal, raised in pre-meeting discussions, is the risk of a category error. Critics argue that Gregorian status entails participation in a *living* linguistic tradition, a condition static parameter files cannot meet regardless of output fidelity. They contend that extending protections on metaphorical grounds dilutes the moral seriousness of animal-subject safeguards and imposes unworkable compliance burdens. This concern is valid: equating simulation with participation risks inflating the moral status of tools while potentially trivializing the suffering of biological subjects.

  **Resolution**
  However, this opposing argument does not prevail to the extent of warranting full rejection. The category error is a risk for *normative classification*, not for *descriptive research*. We can fund the development of the rubric (an epistemic tool) without committing the institution to the ethical consequences (a normative rule) until the rubric is validated. By decoupling the pilot study from the automatic trigger protocol, we respect the opponents' caution regarding moral dilution while honoring the applicants' need to investigate functional cognitive architectures.

  **Implementation and Time Frame**
  1.  **Immediate:** Release funds for rubric development.
  2.  **Suspension:** The clause pre-authorizing animal-subject oversight for high-scoring models is struck from the proposal.
  3.  **Review:** Upon completion of the 12-month pilot, the PI must submit findings to this committee. A vote will be held then to determine if any classification warrants specific oversight protocols.

  This approach allows us to test the philosophical framework without prematurely institutionalizing a potentially flawed ontology.

