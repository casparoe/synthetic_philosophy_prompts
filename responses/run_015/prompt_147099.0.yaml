answer: |-
  You are not merely rationalising; you have stumbled upon a fairly robust ethical framework, though it is not quite the one you proposed. Your intuitions are not mapping 'German vs. American' so much as they are mapping **Integrity as Accountability**.

  Your gut is distinguishing between actions that maintain the social contract and those that parasitise it. In your view, a moral act requires that the agent accepts the consequences of their deviation from the norm. If you break a rule for the public good, you must pay the price (Case 2). If you keep the benefits of a system, you must abide by its constraints (Case 5). If you follow a rule, it must be to serve the rule's purpose, not merely to protect your own skin (Case 1).

  Here is the coherent principle that captures your verdicts:

  > **The Principle of Moral Risk:** One is permitted to deviate from procedural rules only if the deviation serves the public good *and* the agent accepts the personal risk of that deviation. Conversely, one must not adhere to procedures rigidly if doing so causes harm without attempting to correct the system. Deception is only permissible if it exposes a greater harm, not if it conceals a personal compromise.

  ### The Pharmacist Case

  Let us apply this to your lingering case: *A pharmacist secretly substitutes a cheaper generic for a prescribed brand, believing the brand is overpriced and harmful financially, but never tells the patient or doctor.*

  Under your principle, this is **wrong**, and it is structurally identical to Case 3 (the accountant fudging numbers).

  Here is why:
  1.  **Deception:** Like the accountant, the pharmacist is hiding their moral action. They are not engaging in civil disobedience; they are engaging in fraud.
  2.  **Risk Allocation:** The pharmacist is avoiding the conflict (the risk) of explaining their conscience to the doctor or patient. They are imposing their medical and financial judgement on someone else without consent.
  3.  **Systemic Trust:** If this became known, it would undermine trust in all pharmacists. Case 2 (the open accountant) strengthens trust in the long run by highlighting corruption. Case 3 and the Pharmacist weaken trust by proving professionals cannot be believed.

  Even if the pharmacist's motive is benevolent (saving the patient money), the method is one of *paternalistic deception*. It treats the patient as a means to an end, not an autonomous agent. Your principle demands that if the pharmacist believes the prescription is harmful, they must refuse to fill it openly (Case 2 style) or contact the doctor. Secret substitution is the worst of both worlds: the rigidity of deciding for others, combined with the cowardice of hiding the decision.

  ### The Hard Truth: Which Verdict Must You Drop?

  You asked for honesty. To make this principle truly coherent, you have a tension between **Case 2** and **Case 4**.

  *   **Case 2:** The accountant goes open, gets fired. You say: *Right.*
  *   **Case 4:** The civil servant leaks anonymously, keeps job. You say: *Good.*

  A strict application of the **Principle of Moral Risk** suggests you cannot have it both ways. Case 2 is virtuous because the accountant puts their own livelihood on the line to validate their conscience. It proves they are not merely being difficult; they are convinced enough to suffer.

  Case 4 is effective, but it is morally 'cheaper' for the civil servant. By remaining anonymous, they avoid the professional suicide of Case 2. They trigger external correction (which is good), but they do not personally embody the sacrifice.

  If you hold to the view that **conscience requires visible cost**, you must downgrade Case 4. Anonymous whistleblowing is often necessary for safety, but from a standpoint of *personal integrity*, it lacks the honour of open objection. It is a pragmatic good, but not a virtuous act in the same way Case 2 is.

  Alternatively, if you wish to keep Case 4 as 'Good', you must admit that **outcomes matter more than personal sacrifice**. But if you admit that, Case 3 (the accountant fudging numbers) becomes harder to condemn if the fudging actually saved the company from collapse without anyone finding out. Your gut hates Case 3 because it is *secret self-preservation*. Case 4 is *secret public service*.

  Therefore, the verdict you are most likely forcing is the "strange respect" in **Case 1**.

  In Case 1, you say the driver is wrong but feel respect. A coherent principle would say the driver is simply **wrong**. In a service role, 'discretion' is part of the procedure. A rule that prevents a bus from helping a running parent is a bad rule, and a human being is expected to recognise that. The 'respect' you feel is for the driver's discipline, but discipline without judgement is not virtue; it is automation. If you value conscience (Case 2), you must value the driver's potential conscience over the timetable. The driver failed to exercise the moral agency you praise in the accountant.

  ### Summary

  You are not forcing it, but your definition of 'conscience' needs tightening. It is not about feeling something is wrong; it is about **owning the disruption**.

  *   **The Pharmacist:** Wrong. It is Case 3 (deception) with higher stakes. It violates informed consent.
  *   **The Verdict to Drop:** I would suggest you drop the ambivalence in **Case 1**. The driver isn't 'respectably wrong'; he is failing the human element of his duty. Rules serve people, not the other way around.
  *   **The Tension:** Be wary of glorifying Case 4 (Anonymous) too much compared to Case 2 (Open). Anonymity protects the whistleblower, which is practical, but it does not carry the same moral weight as standing in the light.

  Your principle is sound: **Do not free-ride on the system, and do not hide behind the system to avoid moral responsibility.** The pharmacist is doing both.
