          *   *Model View:* LBJ realizes the bid > prize value. Rational exit.
          *   *Critique:* The model assumes static value. In reality, the *value of the prize* dropped (credibility mattered less if domestic support collapsed) and the *cost of bidding* skyrocketed (political suicide).
          *   *Domestic Sentiment:* This is an external variable changing the payoff matrix. It's not just "I spent too much," it's "I can't spend anymore without losing my position to bid."
      *   **Paris Peace Talks:**
          *   Are they a dissolution of the auction?
          *   Yes, a face-saving mechanism. Allows both to stop bidding without admitting the other won the dollar. "Peace with Honor" vs. "Victory Against Aggression."
      *   **Final Evaluation (Model Validity):**
          *   Does it confirm rational overbidding? Yes, to an extent (sunk cost fallacy).
          *   Does it miss external rule changes? Yes. The Dollar Auction assumes a closed system. Vietnam shows open systems where "audience costs" (voters, allies, Soviets/China) change the rules.
          *   *Philosophical nuance:* Bounded rationality vs. Perfect rationality.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* Make sure not to treat the NVA exactly like the US. Their cost tolerance was different (asymmetric warfare). The Dollar Auction usually implies symmetric rules, but here the "cost per bid" was vastly different. I need to highlight this asymmetry.
