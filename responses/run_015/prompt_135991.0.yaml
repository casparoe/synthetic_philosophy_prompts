      *   *Prize:* For US: Geopolitical Credibility (not just Vietnam). For NVN: Sovereignty.
      *   *LBJ Decision:* This is the crux. In a pure Dollar Auction, you quit when Bid > Prize. But LBJ quit when *Political Cost of Bid* > *Political Value of Presidency*. The "Prize" (Vietnam) became less valuable than the "Chip" (Presidency). This suggests the model needs to account for *nested auctions* (War Auction inside Election Auction).
      *   *Paris:* It's a "negotiated settlement" which is essentially splitting the pot or agreeing to stop bidding before the dollar is awarded.
