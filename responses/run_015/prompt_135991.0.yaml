      *   **Context:** Independent study in political philosophy. Tone should be analytical, rigorous, and nuanced.

  2.  **Understand the Dollar Auction Model:**

      *   *Origin:* Martin Shubik (1971).
      *   *Mechanism:* Two bidders auction a dollar. Highest bidder wins the dollar, but *both* pay their bids.
      *   *Trap:* Once bidding starts (e.g., 90 cents vs. $1), the loser faces a loss. To minimize loss, they bid higher (e.g., $1.05), turning a potential loss into a slightly smaller loss (or hoping the other folds).
      *   *Result:* Rational actors end up paying more than the prize is worth due to sunk costs and the structure of the penalty for losing.
      *   *Application to War:* War is often modeled this way. The "prize" is victory/hegemony. The "bid" is resources/lives. The "second-highest bidder penalty" is the cost of defeat (loss of credibility, regime collapse, etc.).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define the Dollar Auction in this context. Establish the analogy.
