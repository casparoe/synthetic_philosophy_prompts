answer: |-
  Distinguished colleagues, members of the university administration, dear family, and former students:

  We gather here to honor Professor Elena Vasquez. In doing so, we face a peculiar difficulty, one that Elena herself spent forty years illuminating. To speak of her career is to stand precisely where she placed us in her seminal essay, *Showing and Saying in the Common Room*.

  Forty years ago, G.E. Moore stood before a skeptical audience, raised his hands, and said, "Here is one hand, and here is another." He claimed this was a proof of an external world. Elena Vasquez argued that Moore was not merely refuting skepticism, but demonstrating that *pointing* is epistemically prior to *arguing*. For the proof to work, you and Moore had to share a room. You had to agree on what counting as "proof" meant. You had to be in the Common Room.

  Elena called this the "Transparency of the Obvious." The obvious is transparent only when the framework is shared.

  This creates a challenge for me today. I stand before an audience divided. To my left, I see epistemologists and historians of philosophy. You know the literature. You know that for Elena, Moore's gesture succeeded only within a specific normative framework. You know that she warned against the "Bibliographic Fallacy"—the error of believing that citation metrics, publication lists, and named chairs can do for an intellectual legacy what Moore's hands did for perception. You know that a curriculum vitae is not a hand. You cannot hold up a list of publications and say, "Here is one contribution, and here is another," and expect that to capture the truth of a mind.

  To my right, I see Elena's family, university administrators, and students from biology, art history, and beyond. You may never have read Moore. You should not have to. You are not here to evaluate a syllogism. You are here because you know Elena as a mentor, a mother, a colleague, and a friend. For you, her value is not in the framework of epistemology, but in the framework of your shared lives.

  If I were to simply read Elena's CV aloud—if I were to treat her achievements as objects available for immediate inspection, like Moore's hands—I would commit the very fallacy she identified. I would be pretending that her legacy is a set of data points that proves itself without interpretation. That would satisfy the skeptics in the room, perhaps, but it would betray the human being we honor. It would treat her life as a proposition to be verified rather than a history to be understood.

  However, if I speak only in abstractions—of "frameworks" and "asymmetries"—I lose the second half of this room. I turn a celebration into a lecture. I fail to show you the person behind the philosophy.

  So, how do we navigate this? We must acknowledge that we are knowing Elena Vasquez in two different ways simultaneously, and we must refuse to collapse one into the other.

  For the colleagues in this room: You shared the Common Room with Elena. You debated her. You read her drafts. For you, her contribution is, in a sense, demonstrative. When you think of her work on the transparency of the obvious, you do not need a citation to verify it. You remember the conversation in the hallway. You remember the margin notes on your own papers. Her intellectual presence is immediate to you. It is Moore's hand. You saw it. To list her publications for you is redundant; you witnessed the act of thinking itself.

  For the family and students outside philosophy: You cannot see the hand in the same way. You did not sit in the seminars. You do not speak the technical language. But you have witnessed the *effects* of that hand. You know the patience she showed when a graduate student struggled. You know the generosity she offered her department. You know the quiet dignity with which she carried her illness. Your knowledge of her is mediated. It is interpretive. You know her not by the direct demonstration of her arguments, but by the resonance of her character.

  Elena taught us that these two modes are asymmetrical. The colleague knows the *work*; the family knows the *worker*. The bibliographic fallacy tries to turn the worker into the work. It tries to quantify the resonance. It suggests that if we list the awards, we have captured the generosity. We have not.

  Therefore, this tribute must operate differently than a philosophical proof. A proof demands that one mode win. Either the hand is there, or it is not. Either the argument is valid, or it is invalid. But a retirement symposium is not a proof. It is a bridge.

  We must hold the CV and the story in tension. We acknowledge the named chair and the citations, not as the *proof* of her worth, but as the public markers that allow the university to recognize what the family already knows privately. We acknowledge the stories of her kindness not as sentimental decoration, but as the necessary interpretation that makes the data meaningful.

  If I ignore the CV, I disrespect the scholar. If I ignore the stories, I disrespect the human. Elena's philosophy teaches us that reference requires a framework. Today, we are building a framework large enough to hold both.

  So, Elena, I will not hold up your publication list and claim it proves your genius. That is a job for the archives. Nor will I speak only in vague praises that could apply to anyone. That is a job for a eulogy, not a symposium.

  Instead, I will say this: Your work showed us that the obvious is transparent only when we agree on how to look. Your life showed us that looking is an act of care. To your colleagues, you offered the rigor of the Common Room. To your family, you offered the warmth of the living room. To try to prove the value of one using the rules of the other is the fallacy you taught us to avoid.

  We are here to say that both are true. The scholar is real. The mentor is real. The proof is in the pointing, but the legacy is in the hand that points.

  Thank you, Professor Vasquez, for showing us both.
