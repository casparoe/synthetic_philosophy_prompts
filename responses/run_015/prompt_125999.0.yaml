answer: |-
  **The Instrument: Suffering-First Ethics Decision Tree**

  **Questions**
  *Present each question sequentially. Options determine the branch.*

  **1. The Trade-Off**
  Imagine a policy that creates significant joy for many but imposes mild pain on a few. Is this trade-off always calculable?
  *   Yes, joy and pain sit on a single scale.
  *   No, they are distinct kinds of value.
  *   Only sometimes; it depends on the context.

  **2. The Break**
  Is there a level of suffering so severe that no amount of pleasure, achievement or meaning can compensate for it?
  *   Yes, absolutely.
  *   No, enough good always outweighs bad.
  *   Only if the suffering persists indefinitely.

  **3. The Trigger**
  What makes suffering uncompensatable?
  *   Sheer intensity or duration.
  *   It destroys the capacity to care about the compensating goods.
  *   It violates a specific right or dignity.

  **4. The Scope**
  At what level does this threshold operate?
  *   A single episode of pain.
  *   A whole life narrative.
  *   A population aggregate.

  **5. Symmetry**
  Could an equally extreme good dominate in the opposite direction?
  *   Yes, extreme joy could outweigh extreme agony.
  *   No, suffering dominates uniquely.
  *   I haven't considered this.

  **6. Attitude**
  Does a sufferer's consent or retrospective acceptance quieten the weight of their agony?
  *   Yes, choice modifies the value.
  *   No, pain's weight is objective.
  *   Only if they remain competent throughout.

  **7. Risk**
  Does a one-in-a-million chance of threshold-crossing agony outweigh the certainty of a million mild headaches?
  *   Yes, lexical risk forbids the gamble.
  *   No, we multiply probability by severity.
  *   It depends on who is taking the risk.

  **Routing Logic**
  *   **Q1 (Distinct/Context):** Route to **Pluralist**.
  *   **Q1 (Single) → Q2 (No):** Route to **Symmetric Single-Scale**.
  *   **Q1 (Single) → Q2 (Yes/Indefinite) → Q5 (Yes):** Route to **Unnamed (Symmetric Threshold)**.
  *   **Q1 (Single) → Q2 (Yes) → Q5 (No) → Q3 (Intensity):** Route to **Lexical Threshold**.
  *   **Q1 (Single) → Q2 (Yes) → Q5 (No) → Q3 (Disintegration):** Route to **Disintegration View**.
  *   **Q1 (Single) → Q2 (Yes) → Q5 (No) → Q6 (Choice):** Route to **Subjective Threshold**.
  *   **Q1 (Single) → Q2 (Yes) → Q5 (No) → Q7 (Risk):** Route to **Lexical Risk**.
  *   **Ambiguous/Contradictory Answers:** Route to **Sceptical**.

  **Outcomes (Leaves)**
  *Each leaf displays the position name and the awkward commitment.*

  *   **Symmetric Single-Scale:** Classical aggregation. *Awkward commitment: A sufficient number of mild headaches can morally justify a torture.*
  *   **Lexical Threshold:** Strict suffering-priority. *Awkward commitment: Preventing one extreme agony outweighs saving billions from mild discomfort.*
  *   **Disintegration View:** Capacity-based threshold. *Awkward commitment: Suffering that leaves you functional is less morally urgent than suffering that breaks you.*
  *   **Pluralist:** Incommensurable values. *Awkward commitment: Some moral conflicts have no right answer, only tragedy.*
  *   **Subjective Threshold:** Consent-dependent weight. *Awkward commitment: Unconsented pain is worse than identical consented pain, regardless of sensation.*
  *   **Lexical Risk:** Probabilistic prohibition. *Awkward commitment: Tiny risks of catastrophe forbid otherwise beneficial programmes.*
  *   **Unnamed (Symmetric Threshold):** Theoretical symmetry. *Awkward commitment: Extreme joy could justify extreme torture (widely regarded as incoherent).*
  *   **Sceptical:** Indeterminate. *Awkward commitment: Ethics cannot guide policy on this specific question.*

  **Diagnostics**
  *   **Empty Branches:** The 'Symmetric Threshold' leaf (Q2 Yes + Q5 Yes) is theoretically possible but empirically unoccupied; most who accept thresholds reject symmetry. Flag as 'Unstable'.
  *   **Indistinguishable Leaves:** The 'Lexical Threshold' and 'Lexical Risk' positions often collapse in practice; if a threshold exists, risk multiplication usually fails anyway. Do not force a hard split if user answers are inconsistent.
  *   **Attitude Ambiguity:** Q6 separates objective badness from subjective experience. If a user selects 'No' on Q2 but 'Yes' on Q6, route to **Sceptical**; this implies pain matters only if unchosen, yet never thresholds.
  *   **Scope Note:** Q4 (Scope) is recorded for metadata but does not currently alter the leaf label; it distinguishes policy applications (torture vs. palliative care vs. public health) without changing the underlying ethical taxonomy.

  **Developer Notes**
  *   Ensure British spelling (labelled, programme, centre).
  *   Do not display the logic map to the user; only show the final leaf.
  *   If a user reaches 'Unnamed', display the diagnostic note: 'This combination is logically consistent but currently undefended in literature.'
  *   Keep transition animations minimal; the text carries the weight.
