answer: |-
  There is no single, canonical term in collective intentionality literature that captures this exact phenomenon, primarily because standard frameworks (like Margaret Gilbert's or Raimo Tuomela's) tend to treat joint commitment as a binary state: either the normative bonds exist, or they do not. Your observation identifies a **temporal and conditional instability** in that state that standard theory often assumes away.

  However, this pattern is recognized in adjacent fields (organizational psychology, legal theory, and social ontology). The most precise way to name and define it is **"Outcome-Contingent We-Intention"** (the cognitive state) manifesting as **"Retrospective Commitment Dissociation"** (the behavioral act).

  In colloquial theoretical discussion, this is increasingly referred to as **"Fair-Weather Plural Subjecthood."**

  Here is a precise breakdown of the phenomenon, its theoretical grounding, and how it differs from related concepts.

  ### 1. Theoretical Diagnosis: Why Standard Frameworks Miss It

  *   **Gilbert's Joint Commitment:** For Gilbert, a plural subject is created when parties openly express willingness to be jointly committed, creating *common knowledge* of that commitment. Crucially, this commitment creates normative obligations that cannot be unilaterally rescinded.
      *   *The Gap:* Gilbert's framework assumes that if people act as a "we," they understand the normative weight of that "we." Your phenomenon reveals that agents can **simulate the behavior of a plural subject without establishing the common knowledge required for the normative bond.** They treat the "we" as descriptive (what we are doing now) rather than normative (what we are bound to do).
  *   **Tuomela's We-Mode vs. I-Mode:** Tuomela distinguishes between acting as a group member (We-Mode) and acting as a private individual who happens to align with the group (I-Mode).
      *   *The Gap:* This phenomenon is **I-Mode actors simulating We-Mode behavior.** They use "we" language and contribute labor (I-Mode cooperation), but they lack the *group reason* (the commitment to the group's goal *as* a group). When the cost rises, they revert to their default I-Mode and claim that was always their state.

  ### 2. Precise Definition

  **Term:** **Outcome-Contingent We-Intention (OCWI)** leading to **Retrospective Commitment Dissociation.**

  **Definition:** A failure mode of collective intentionality where agents publicly perform the linguistic and behavioral markers of a joint commitment (using "we," contributing resources) while privately conditioning their adherence on the project's success or alignment with their private interpretations. Upon negative outcomes, agents retroactively deny the existence of the joint commitment, re-framing past collective actions as a series of coincident individual actions.

  **The Mechanism (The "Hidden Expiration Clause"):**
  1.  **Formation:** Agents establish *apparent* common knowledge of a joint goal.
  2.  **Hidden Condition:** Each agent privately attaches a condition: *"I am committed to 'us' only so long as 'us' produces $X$ or avoids $Y$."*
  3.  **The Trigger:** The project fails or faces blowback ($Y$ occurs).
  4.  **The Dissociation:** Agents do not say, "I am withdrawing from the commitment" (which admits the commitment existed). They say, "There was never a commitment to withdraw from; I was always acting for myself."

  ### 3. Differentiation from Related Concepts

  This is distinct from other failure modes of collaboration. Here is how to distinguish it:

  | Concept | Core Mechanism | How it Differs from OCWI |
  | :--- | :--- | :--- |
  | **Strategic Ambiguity** | Agents intentionally keep goals vague *during formation* to allow flexibility later. | In OCWI, the goals *seemed* clear and agreed upon at the time. The ambiguity is introduced *retroactively* regarding the *commitment itself*, not the goal. |
  | **Weak Shared Intentionality** | Agents have a "we" goal but lack the robust normative obligations of a full joint commitment (e.g., casual cooperation). | In Weak Intentionality, everyone knows the bond is loose. In OCWI, the bond *felt* strong and normative until it was tested. The betrayal feels stronger because the "we" was performative but convincing. |
  | **Groupthink** | Agents suppress dissent to maintain harmony, leading to poor decisions. | Groupthink is about *decision quality* and *conformity*. OCWI is about *accountability*. A groupthink group will often stick together even in failure ("us against the world"). An OCWI group dissolves the "us." |
  | **Free-Riding** | Agents benefit from the group without contributing labor/resources. | As you noted, OCWI agents *do* contribute. They pay the entry cost. The defection happens only when the *liability* cost exceeds the *labor* cost. |
  | **Genuine Mind Change** | Agents acknowledge the past commitment but claim new information justifies rescinding it. | **Crucial Distinction:** In Mind Change, the agent says, "We were committed, but now I must leave." In OCWI, the agent says, "We were *never* committed." It is a denial of historical fact, not a normative revision. |

  ### 4. Boundary Conditions: What Counts and What Doesn't

  To determine if a specific case fits **Outcome-Contingent We-Intention**, apply these three tests:

  **1. The Linguistic Test (Past Tense "We")**
  *   **Counts:** During the success phase, agents use "we decided," "our project," "our goal."
  *   **Doesn't Count:** If agents always used "I'm helping out with..." or "I'm working on my part," they never established the appearance of a plural subject. This is just standard I-Mode cooperation.

  **2. The Normative Denial Test**
  *   **Counts:** When things go wrong, agents deny the *obligation* existed. ("I never agreed to be liable for this," despite prior "we" language).
  *   **Doesn't Count:** If agents admit the obligation but refuse to fulfill it due to inability or competing priority. ("I know we agreed, but I can't do it.") This is a breach of commitment, not a denial of its existence.

  **3. The Common Knowledge Test**
  *   **Counts:** The "expiration clause" was never common knowledge. If everyone knew, "We are only doing this if it's easy," then no joint commitment was ever formed (per Gilbert). The phenomenon relies on the *illusion* that the commitment was unconditional.
  *   **Doesn't Count:** If the group explicitly agreed, "We try this for 6 months and see," then the dissolution is a contractual expiration, not a retrospective dissociation.

  ### 5. Is it a Distinct Failure Mode?

  **Yes.** It is distinct because it exploits the **gap between behavioral coordination and normative bonding.**

  Standard collective intentionality theory often assumes that if you have the behavior (cooperation) and the language ("we"), you have the ontology (a plural subject). This phenomenon demonstrates that you can have the **phenomenology of a plural subject** (it feels like a "we") without the **ontology of a plural subject** (there is no actual normative bond), because the *common knowledge* required to cement the bond was falsified by private contingencies.

  In legal terms, this is akin to **"Apparent Authority"** without actual agency. In psychological terms, it is a specific form of **"Self-Serving Attribution Bias"** applied to collective agency: *Success is attributed to the Collective ("We did it"), while Failure is attributed to the Individual ("I was just helping").*

  ### Summary for Application
  If you are analyzing this in a community garden or open source project, you are looking for **Retrospective Commitment Dissociation**.

  *   **Diagnosis:** The group operated under an illusion of **We-Mode** while individuals were privately in **I-Mode**.
  *   **Cause:** Lack of **Common Knowledge** regarding the unconditional nature of the commitment.
  *   **Remedy:** To prevent this, groups must move beyond "we" language and explicitly establish the **normative conditions of rescission**. Paradoxically, discussing *how* to quit the group openly (making the exit clause common knowledge) strengthens the joint commitment by removing the hidden private contingencies.
