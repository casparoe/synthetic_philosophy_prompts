answer: |-
  Brainstorming pass:
  Levels need to be explicit: Sequence (A,C,G,T), Gene (coding region), Regulatory Network (interaction), Cell/Organism (phenotype). The "Blueprint" metaphor is a skyhook because it implies top-down information without showing the construction machinery. The 100k gene expectation is greedy reductionism—specifically level-skipping. It assumes Complexity(Organism) ≈ Count(Genes), ignoring the Regulatory Network layer. ENCODE's 80% claim is also greedy, but looks like level-collapsing: equating biochemical binding (low level) with evolutionary function (high level). The Onion Test is the killer counter-evidence here. User's distinction (skipping vs. collapsing) is valid; skipping is methodological (ignoring steps), collapsing is ontological (denying steps exist). Ex-ante diagnosis is the hard part. Ambitious reductionism bets the middle layers will simplify; greedy reductionism bets they don't matter. The difference is only visible in how one handles resistance from the middle layers. AlphaFold is tricky—it predicts structure (output) without pathway (mechanism). It's a predictive crane but an explanatory black box. Does it count as understanding? Dennett might say no. Framework holds up but needs nuance on statistical vs. mechanistic cranes.

  Cleaned-up analysis:

  To apply this framework rigorously, we must first fix the explanatory levels. At the bottom, we have the nucleotide sequence, the raw chemical data. Above that sits the gene, traditionally defined as a protein-coding unit. Above that is the regulatory network, where genes interact, splice, and switch on or off. Above that is the cell and organism, where phenotype emerges. Finally, there is the population level, where evolutionary function is determined by selection history. With these layers established, we can diagnose the Human Genome Project (HGP) episode.

  The "blueprint" framing sold to the public was a skyhook. A blueprint implies a top-down design document where every part has a pre-ordained place and purpose, accessible by reading the plan. In software terms, it is like claiming you can understand a distributed system's runtime behavior solely by reading the source code comments, ignoring the compiler, the OS, and the hardware architecture. This framing smuggled in the notion of "purpose" without providing the mechanistic machinery—developmental biology—that actually constructs the organism from the DNA. It promised a direct lift from sequence to human being without showing the cranes of embryology and regulation that do the heavy lifting. Because it offered no mechanism for how the sequence becomes a body, relying instead on the metaphor of design, it functions as a skyhook: it names the puzzle rather than solving it.

  The expectation of one hundred thousand genes was a clear case of greedy reductionism, specifically what you call level-skipping. Researchers assumed a linear mapping between organismal complexity and gene count. They jumped from the bottom level (sequence) to the top level (complex human traits) and assumed the intermediate layers (regulation, splicing) would scale linearly or remain negligible. This was not merely a wrong guess; it was a structural error in explanatory strategy. A reasonable research heuristic would have acknowledged the regulatory layer as a variable multiplier. The evidence distinguishing greed from ambition lies in the reaction to early data. When simpler organisms showed comparable gene counts, the greedy reductionist doubles down on the gene count as the primary metric, whereas an ambitious reductionist would have immediately shifted focus to the regulatory network as the source of complexity. The HGP proponents largely ignored the regulatory layer until the data forced their hand, confirming the greedy diagnosis.

  The ENCODE controversy represents a shift from level-skipping to level-collapsing. By defining "function" as any biochemical activity, ENCODE researchers collapsed the distinction between the chemical level (binding, transcription) and the evolutionary level (selected effect). They insisted that if something happens chemically, it is functional biologically. This is greedy reductionism because it demands the lower level pay out the higher-level explanation too fast. It treats noise as signal. The Onion Test you cited is the definitive refutation here. If biochemical activity equals function, and onions have five times more DNA than humans, then onions must be five times more functionally complex, or human DNA is largely non-functional. Since onions are not visibly more complex, the excess DNA must be junk—parasitic elements or bulk that does not contribute to the organism's design. The critics were correct: ENCODE was trying to derive evolutionary function directly from chemical activity, skipping the population level where function is actually defined by selection.

  Your distinction between level-skipping and level-collapsing is worth having because it carves the genome case at a joint. Level-skipping is an epistemic error: you acknowledge the middle layers exist but assume you don't need to model them to get the answer. This was the gene-count error. Level-collapsing is an ontological error: you claim the middle layers are not real or distinct, reducing them entirely to the base layer. This was the ENCODE error, where regulatory nuance was flattened into binary biochemical activity. Both fall under greedy reductionism, but they require different remedies. Skipping is fixed by adding detail; collapsing is fixed by restoring categorical distinctions. The framework gains predictive power by distinguishing whether a researcher is ignoring a layer temporarily (skipping) or denying its existence permanently (collapsing).

  This leads to your worry about ex-ante diagnosis. You are right that greedy reductionism is often easier to diagnose in retrospect. However, there is an observable difference before the fact: the treatment of intermediate complexity. An ambitious reductionist says, "I bet the middle layers simplify out, but if they don't, I will model them." A greedy reductionist says, "The middle layers don't matter." The difference is falsifiability. If your research program treats counter-evidence from the intermediate layers as noise to be filtered rather than data to be explained, you are being greedy. In the HGP case, the assumption that gene count scales with complexity was treated as a baseline truth rather than a hypothesis to be tested against regulatory data. That rigidity is the marker. So, is the concept just a post-hoc labeling device? No, because it identifies a specific methodological risk—the refusal to engage with intermediate machinery—that can be spotted in grant proposals and experimental design before the results arrive. It warns you to check whether your model allows the middle layers to speak back to you.

  Does the genome story confirm the framework? It confirms it, but it also shows its limits. The framework explains why the explanations failed structurally, not just empirically. Plain bad prediction says "we guessed the number wrong." Crane/Skyhook analysis says "we tried to lift the explanation without building the support." It highlights that the failure was in the architecture of the theory, not just the parameters. However, the framework is silent on the social dynamics of why the skyhook rhetoric was sold. It explains the epistemic failure, not the sociological success of the hype. It tells you why the science didn't work, not why the press release did.

  Finally, consider AlphaFold 2. It predicts protein structure from sequence with high accuracy but does not model the physical folding pathway. Is this a crane? Instrumentally, yes. It is a bottom-up tool built on data that performs real work. Explanatorily, it is deficient. It gives you the output without the mechanism. In Dennett's terms, it is a black-box crane. It lifts the weight, but it doesn't show you how the pulley works. This challenges the framework because Dennett values explanation over mere prediction. A skyhook is usually useless magic; AlphaFold is useful magic. My verdict is that AlphaFold is a predictive crane but an explanatory skyhook. It bypasses the mechanistic levels (physics of folding) to jump from sequence to structure. Does my verdict on the genome case survive? Yes. The HGP failure was claiming understanding without mechanism. AlphaFold admits it is predicting, not explaining physics. The genome researchers claimed the blueprint was the explanation; AlphaFold users know the model is a tool. The distinction holds: if you claim AlphaFold explains *why* proteins fold physically, you are being greedy. If you claim it predicts *what* structure they take, you are using a crane. The genome project claimed the sequence was the explanation for the human being. That was the error. AlphaFold does not make that claim, so it avoids the greedy trap, even if it leaves the physical mechanism opaque. The framework survives, provided we distinguish between predictive utility and explanatory depth.
