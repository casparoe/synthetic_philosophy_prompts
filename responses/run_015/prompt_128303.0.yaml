      To the Competency-Review Board, this memorandum outlines a revised evaluation protocol designed to distinguish propositional mastery from genuine operative skill by focusing on observable behavioral adaptations rather than internal cognitive states. The central philosophical challenge we face is that passing written examinations demonstrates knowing-that, or the ability to recite facts and steps, whereas safe surgery requires knowing-how, which is a disposition to act correctly under variable conditions. To operationalize this without speculating on what a resident is thinking, we must shift our assessment metric from error-free execution to perturbation-response mapping. This concept posits that skill is not revealed by the absence of deviation but by the topology of recovery, specifically measuring how quickly, with what economy of motion, and toward what functional endpoint a practitioner corrects after an introduced anomaly. The following procedure establishes a standardized sequence of observational tests that any evaluator can apply in the simulation lab to generate objective data on this capacity.

      The evaluation sequence begins with a baseline execution phase where the resident performs the standard procedure without interference to establish a motor control baseline. During this stage, passing criteria require the maintenance of standard ergonomic posture and instrument handling without unnecessary tremor or hesitation, while failing criteria include fundamental grip errors or inability to navigate standard anatomy. Once baseline competence is confirmed, the evaluator introduces a controlled perturbation, such as unexpected bleeding or altered tissue resistance, which marks the second stage of observation. In this phase, the resident passes if they acknowledge the change in conditions within five seconds and initiate a corrective maneuver that stabilizes the field, whereas they fail if they persist with the original plan despite visual or tactile feedback indicating failure, or if their reaction time exceeds ten seconds resulting in simulated tissue damage. The third and final stage focuses on the recovery trajectory, where the evaluator maps the path back to functional stability. A passing recovery is characterized by a return to the operative goal using fewer than three additional maneuvers than the standard pathway, while a failing recovery involves cascading errors where each correction creates a new problem, indicating a lack of integrated procedural knowledge.

      Crucially, this protocol mandates a specific hierarchy when weighting verbal articulation against manual adaptation. In instances where a resident verbally articulates the correct theoretical solution but fails to execute the corresponding manual adjustment, the evaluation must record a failure on the skill metric, as knowing-how is constituted by the ability to perform the action rather than describe it. Conversely, if a resident successfully adapts their manual technique to resolve the perturbation but cannot immediately verbalize the anatomical or physiological rationale, they pass the skill assessment, though they may be flagged for remedial theoretical review. This distinction ensures that we are assessing operative capacity rather than examination performance. There are, however, designated points where the evaluation must halt because the question exceeds behavioral evidence and becomes a matter of values or institutional risk tolerance. Specifically, if a resident employs a non-standard technique that successfully resolves the simulation scenario but violates established hospital safety protocols, the committee cannot judge this as a pure skill failure without making a value judgment on protocol rigidity versus adaptive innovation. Similarly, if continuing the simulation after a major error would require the resident to operate on previously compromised virtual tissue that no longer represents realistic physiological risk, the evaluation halts to prevent assessing performance under artificial constraints that do not map to real-world risk tolerance.

      To illustrate the application of this procedure, consider the first worked case involving a laparoscopic dissection where sudden bleeding obscures the standard triangular landmarks near the cystic duct. In the baseline phase, the resident demonstrates standard triangulation and clip application. Upon the introduction of the simulated bleed, the perturbation-response mapping begins. A passing response requires the resident to cease dissection immediately, apply suction or pressure to clear the visual field, and navigate by tactile and visual affordances rather than named anatomical structures. If the resident chases the blood with cautery or attempts to clip through the obscuration without regaining visual control, this constitutes a failure of recovery topology because the economy of motion is negative and the functional endpoint is compromised. If the resident successfully isolates the duct using alternative landmarks such as the liver edge or duodenum despite the obscured view, they pass the skill assessment even if they cannot immediately name the specific vessel involved, as their hands have demonstrated the requisite knowing-how. The evaluation halts only if the resident chooses to convert to an open procedure, as this decision involves institutional risk tolerance regarding conversion rates versus patient safety that lies beyond the scope of a simulation skill check.

      The second worked case involves a suturing task under time constraint where the needle angle is deliberately non-standard, testing whether the hands reconfigure grip and rotation without waiting for explicit problem-solving. During the baseline, the resident loads the needle and drives it through standard tissue blocks with expected efficiency. When the needle holder angle is altered to force a non-standard wrist rotation, the perturbation is active. A passing response is observed if the resident adjusts their grip or wrist pronation within two stitch cycles to accommodate the new angle without dropping the needle or tearing the tissue. The topology of recovery here is measured by the smoothness of the transition; jerky corrections or verbal hesitation while the hands remain frozen indicate a reliance on propositional processing that interrupts flow. If the resident stops to verbally reason through the geometry before moving their hands, they fail the knowing-how metric, even if their subsequent analysis is correct, because the skill lies in the pre-reflective adaptation of the motor schema. However, if the resident forces the standard grip and tears the tissue, they fail on the functional endpoint criterion. The evaluation must halt if the resident abandons the suturing task entirely to call for assistance, as this transitions from a technical assessment to a judgment on help-seeking behaviors which are governed by cultural and institutional values regarding autonomy and safety. By adhering to this structured observational protocol, the committee can generate consistent data that separates the ability to talk about surgery from the ability to perform it, ensuring that certification reflects genuine operative competence rather than theoretical familiarity.

