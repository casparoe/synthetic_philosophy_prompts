          *   *Private Track:* "Dream Portfolio" (secretly bank tokens for themselves).
          *   Stakes: Candy or printed "prestige cards."
      *   **Requirements:** Clear roles/rules, low-tech materials, timeline, payoff scheme, debrief mapping to philosophy, limitations (what it can't reproduce), potential failure points (gaming the system), address "crab bucket" mentality (don't center it but acknowledge).
      *   **Tone:** Practical, philosophical, engaging, honest about limitations.

  2.  **Deconstruct & Refine the Mechanics:**

      *   *Group Size:* 14 people / 4 groups = 3.5 people per group. This is awkward. I need to adjust. 3 groups of 4 + 1 group of 2? Or 2 groups of 7? The prompt says "split them into four groups of 3-4". 14 doesn't divide evenly into 4 groups of 3-4 (4x3=12, 4x4=16). I should suggest 3 groups of 4 and 1 group of 2, or just 3 groups of 4-5. Let's go with 3 groups of 4 and 1 group of 2 (the facilitator can join the small group) or just adjust to 4 groups (3, 3, 4, 4). Let's recommend 4 groups (3, 3, 4, 4) to fit the prompt's desire for 4 groups.
      *   *The Hidden Rule:* "If the same person gets nominated twice in a row." This needs to be trackable. The facilitator needs a scorecard.
      *   *The Private Track:* "Secretly bank tokens." How? If they take from the shared pool, the pool decreases. This creates a prisoner's dilemma element.
      *   *The Tension:* The prompt wants them to *feel* the tension. If the hidden tax is too punitive, they'll stop nominating. If it's too subtle, they won't notice. It needs to be discoverable.
      *   *Time:* 80 minutes total.
          *   Intro: 10 mins.
          *   Game: 3 rounds x 10 mins = 30 mins + transition time.
          *   Reveal/Debrief: 40 mins.
          *   Total: 80 mins.
      *   *Payoff:* Candy is good. Prestige cards add a symbolic layer.

  3.  **Drafting the Simulation Design ("The Co-op Dilemma"):**

      *   *Name:* Needs to sound professional but slightly abstract. "The Visionary Co-op."
      *   *Materials:* Tokens (poker chips or candy wrappers), Scorecards (facilitator only), "Prestige Cards" (printed), Candy.
      *   *Rules:* Need to be simple enough to explain in 5 mins but deep enough for 30 mins of play.
      *   *The Twist:* The "Tall Poppy Tax" needs to be enforced by the Facilitator, not the players, so they don't know it exists until it happens.
      *   *The Private Track:* Let's call it "The Shadow Portfolio." Players can siphon tokens during the round.

