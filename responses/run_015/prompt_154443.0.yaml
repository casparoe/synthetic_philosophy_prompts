      *   Make sure the "feeling in the bones" aspect is highlighted in the debrief prompts.

  **(Self-Correction during drafting):** I initially thought about having the tax redistribute to the group. But if it redistributes to the group, the group might *want* to trigger the tax to get more tokens. That gamifies it too much. The tax should represent a *loss* to the system (efficiency loss due to social friction) or a redistribution to the *general bank* (not their specific co-op). Let's make it a redistribution to the *General Community Pool* (a central pot that no one owns), symbolizing resources lost to social friction/taxation that don't benefit the immediate peers. Or, simpler: The tokens are removed from play. This creates scarcity. Let's go with **Removed from Play**. It emphasizes the cost of standing out.

  *Wait, re-reading the prompt:* "half their accumulated tokens get redistributed." Okay, I should stick to the user's mechanic. Redistributed where? To the rest of the group? That incentivizes the group to target one person. That's actually very "Tall Poppy." I will specify that the tokens are redistributed *evenly among the other members*. This incentivizes the group to let someone rise, then cut them down to feed the rest. That captures the "Crab Bucket" dynamic perfectly without centering the whole game on it.

  *Wait, another constraint:* "if the same person gets nominated twice in a row." This implies the *group* decides. If they figure this out, they will nominate Person A Round 1, then Person B Round 2, then Person A Round 3. This creates a rotation. That's a valid strategy. I need to address this in the "What will go wrong" section.

