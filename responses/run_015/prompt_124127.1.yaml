answer: |-
  **TO:** Operations Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Warehouse Pest Control Protocol

  **Recommendation**

  We will not renew the current fogging contract. Instead, we are adopting a phased Integrated Pest Management (IPM) protocol prioritizing exclusion and mating disruption (pheromones), with heat treatment as a secondary measure for active infestations. We will accept a loss threshold of 5% on dry goods; beyond that, we intervene to prevent total loss. Implementation begins immediately, with a full transition within 90 days.

  **Reasoning**

  This decision balances our commitment to harm reduction with our operational mandate to feed people. The debate centered on two conflicting models: the volunteer's expected-value spreadsheet and the Ops Manager's reliability concerns. Both contain insights, but both require correction before guiding policy.

  **The Spreadsheet and the Leakage Problem**
  The volunteer's model calculates expected harm by multiplying the number of insects killed by a probability of sentience (5%). Mathematically, this produces a massive number that dwarfs human costs. This feels like a bug because it treats the warehouse as a closed system. It is not.

  If we reject infested grain to avoid killing insects here, the food bank purchases replacement stock from conventional supply chains. Conventional agriculture relies on broad-spectrum field spraying that kills orders of magnitude more insects per calorie than warehouse fogging. By refusing to treat stored goods, we do not reduce insect deaths; we outsource them to fields where we have zero oversight and where non-target species are invariably caught in the spray. This "leakage" invalidates the spreadsheet's conclusion. We cannot claim moral superiority for moving harm off our books while increasing total harm globally. Therefore, saving the food is a moral imperative, not just a logistical one.

  **Prevention vs. Killing**
  However, saving the food does not require fogging. We must distinguish between killing existing insects and preventing new ones from existing. The volunteer's policy counts deaths but ignores births. In a warehouse environment, insect lives are short, stressful, and end inevitably in control measures. If we assume any capacity for suffering, preventing these lives from starting (via pheromone mating disruption) is ethically superior to killing adults. Heat treatment kills adults but is contained and chemical-free. Pyrethrin fogging affects non-targets and leaves residue. Therefore, our hierarchy of intervention is: 1) Exclusion (sealing entry), 2) Mating Disruption (prevention), 3) Heat (contained killing), 4) Disposal (if loss exceeds 5%).

  **Consistency and Tractability**
  Committee members noted our use of snap traps for mice and tillage in the gardens. This is not hypocrisy; it is triage. Moral consistency does not require solving every problem simultaneously; it requires addressing tractable harm where we have direct control. We cannot currently grow food without tilling. We can store food without fogging. We address the harm we can actually fix without compromising our primary mission. Until we have viable alternatives for field agriculture or rodent control that do not involve lethal force, we focus our ethical capital on the stored-product pests where non-lethal options exist and are effective.

  **Donor Relations**
  We will not publish an "Insect Welfare Policy." To our donors and partners, this is a quality control and safety upgrade. Framing this as an ethical stance on invertebrate sentience risks signaling judgment on conventional farming practices, which could jeopardize the surplus produce donations that constitute our majority volume. We protect the supply chain by keeping the reasoning internal while upgrading the practice.

  **The Strongest Consideration for the Losing Side**
  The Ops Manager is right to prioritize reliability. Fogging is cheap, proven, and requires minimal labor. The IPM protocol proposed here is more labor-intensive, requires stricter monitoring, and carries a higher risk of localized infestation spikes during the 90-day transition. There is a genuine risk that in trying to optimize for ethical nuance, we introduce operational fragility that threatens food security. If the new protocol leads to significant spoilage or regulatory citations, the moral calculus flips: wasted food is a concrete human harm that outweighs speculative insect welfare.

  **Conditions for Flipping This Decision**

  We will revisit this decision under two conditions:
  1.  **Failure Rate:** If dry goods loss exceeds 7% for two consecutive quarters despite IPM protocols, we will revert to chemical treatment for the affected zones.
  2.  **Evidence Update:** If new peer-reviewed consensus emerges indicating that pantry moths and beetles lack any neural substrate for nociception (pain perception), the urgency for non-lethal methods decreases significantly, and cost-efficiency becomes the primary driver.

  **Timeline**

  *   **Week 1:** Terminate fogging contract renewal. Source pheromone traps and sealing materials.
  *   **Month 1:** Complete warehouse sealing audit. Install monitoring traps.
  *   **Month 3:** Full IPM operational. Review loss data.

  This approach accepts that we cannot be perfect, but we can be better. We save the food, we reduce the harm where we actually have control, and we keep the lights on.
