      *Wait, re-reading:* "Pretend you're a professional moral philosopher... write me the memo." Okay, I am adopting the persona to write the content. The output is the memo. The voice should be appropriate for the committee (professional, direct), but the reasoning must reflect the philosophical expertise requested.

