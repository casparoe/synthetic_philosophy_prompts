          *   Quinean indeterminacy allows for *empirical equivalence*. It doesn't mean *all* narratives are equally *useful* or *stable*.
          *   Dennett's CNG is pragmatic. It's not about "The One True Narrative," it's about "The Narrative that works best for prediction and social coordination."
