      *   **The "Gavagai" nuance:** *Gavagai* is about reference (rabbit vs. rabbit-stage). Personal identity is about *continuity*. The analogy holds, but the stakes differ.
      *   **Conclusion:** The slide is from "semantic indeterminacy" to "ontological chaos."

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   Wait, is Step (2) problematic? "For such a center to be more than a convenient fiction..." Dennett *calls* it a fiction. But a "useful" one. The user says "more than a convenient fiction." Dennett might say "It *is* a convenient fiction, but that's all a self ever is." I should clarify that Dennett's "fiction" isn't "falsehood," it's "abstract object."
