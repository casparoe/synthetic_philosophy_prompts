answer: |-
  ### Part 1: Failure Mode Analysis (Before We Build the Tool)

  You asked for slow and careful. Before I give you the procedure, I need to tell you why the metrics you are currently arguing over will betray you. I have sat on panels where we thought we were measuring "impact" and were actually measuring "narrative appeal."

  **1. The Welfare (Happiness) Trap**
  *   **The Metric:** Self-reported wellbeing, smiles, donor surveys.
  *   **How it Fails:** It rewards the "Adapted Deprived." If you lower a disabled person's expectations enough, they report high happiness. It also rewards the "Honeymoon Effect" (like your confidence course). People feel great immediately after an intervention; it fades.
  *   **The Panel Risk:** You will fund things that feel good in the room but change nothing in the life. You will also inadvertently favor charismatic applicants over those with profound disabilities who cannot self-report.

  **2. The Resource (Money/Assets) Trap**
  *   **The Metric:** Cash value, equipment cost, number of ramps built.
  *   **How it Fails:** It ignores "Conversion Factors." A \$5,000 ramp is a resource. If the landlord forbids installation, the resource value is zero. If the means-test interview humiliates the applicant so they don't apply, the resource is theoretically available but practically inaccessible.
  *   **The Panel Risk:** You will fund things that look efficient on a spreadsheet but sit unused. You will treat unequal people equally (giving the same cash value to someone who needs \$500 and someone who needs \$50,000).

  **3. The Capability (Freedom/Functioning) Trap**
  *   **The Metric:** What people can actually *do* (work, move, socialize).
  *   **How it Fails:** It requires data you don't have. You cannot commission evaluations. You cannot ask about diagnoses. You are guessing at "real freedom" based on a proposal form.
  *   **The Panel Risk:** Paternalism. You decide which "functionings" matter (e.g., employment > music). You will kill programs that sustain life (music) in favor of programs that optimize productivity (employment), even if the productivity gains are illusory.

  **4. The Procedural Trap (Time & Politics)**
  *   **The Math:** You have 90 minutes for 6 proposals. That is 15 minutes per proposal. You are asking for a 40-minute procedure. **This is the first thing that will break.** If you try to squeeze 40 minutes of thinking into 15, you will default to gut feeling and use the procedure to justify it afterward.
  *   **The Council:** They want "jobs created" or "dollars leveraged." They do not want "dignity preserved." If your one-page justification uses philosophical nuance, they will cut your budget.

  ---

  ### Part 2: The 40-Minute Triage Protocol

  This procedure is designed to force you to admit *which* currency you are spending before you spend it. It separates "Data Questions" (can we verify this?) from "Values Questions" (do we care about this?).

  **Pre-Work:** One member reads the proposal aloud (5 mins). The remaining 35 minutes are for the following 4 Gates.

  #### Gate 1: The "Do No Harm" Screen (5 Minutes)
  *Goal: Eliminate proposals that degrade the very people they claim to help.*
  *   **Question A:** Is there evidence that accessing this benefit causes stigma, stress, or dropout? (Look at the means-test interview, the application burden, the visibility of the aid).
  *   **Question B:** Does the program require participants to disclose protected info (diagnoses) they haven't already volunteered?
  *   **Pass Condition:** No evidence of significant harm, OR the harm is explicitly acknowledged and mitigated.
  *   **Fail Condition:** High dropout due to stigma (e.g., >30% abandon the process) with no plan to fix it.
  *   **Stop:** If it fails, the answer is **NO**. Do not pass go. A program that humiliates its beneficiaries to save them is a net negative.

  #### Gate 2: The Currency Declaration (10 Minutes)
  *Goal: Force the committee to agree on what "success" looks like for this specific proposal.*
  *   **Instruction:** The Chair must ask: "If we fund this, what exactly are we buying?" The committee must select **ONE** primary currency for this vote. You cannot have all three.
      *   **Option A (Feeling):** We are buying temporary relief, joy, or confidence. (Matches Donor Restriction).
      *   **Option B (Stuff):** We are buying concrete assets (ramps, cash, vehicles).
      *   **Option C (Function):** We are buying long-term capacity to act (employment, independent living).
  *   **The Trap:** If half the room thinks it's Option A and half thinks it's Option C, you **cannot vote**. You must flag this as a **Values Deadlock**.
  *   **Pass Condition:** Consensus on the Primary Currency.
  *   **Output:** This selection becomes the first sentence of your City Council justification. *"This funding purchases [Currency] for [Group]."*

  #### Gate 3: The Evidence & Durability Check (15 Minutes)
  *Goal: Assess the quality of the claim based on the chosen Currency.*
  *   **If Currency is Feeling:** Is the happiness durable?
      *   *Green Light:* Sustained > 6 months.
      *   *Yellow Light:* Sustained < 3 months (Honeymoon).
      *   *Red Light:* Only during the activity.
  *   **If Currency is Stuff:** Does the resource convert to function?
      *   *Green Light:* Recipient controls the asset; no external blockers (e.g., landlord permission secured).
      *   *Yellow Light:* Recipient controls asset, but external blockers possible.
      *   *Red Light:* Asset is contingent on third-party approval not yet granted.
  *   **If Currency is Function:** Is the change measurable and attributable?
      *   *Green Light:* Hard data (job offer, medical milestone).
      *   *Yellow Light:* Self-reported progress toward goal.
      *   *Red Light:* No change in function, only change in attitude.
  *   **The "Missing Data" Rule:** Since you have no statistician, if the data is "Red Light," you can still fund **IF** you explicitly categorize it as a "Pilot/Innovation" and limit funding to 50% of the request.
  *   **Pass Condition:** Green or Yellow. Red requires funding cut or rejection.

  #### Gate 4: The Opportunity Cost Declaration (10 Minutes)
  *Goal: Acknowledge what is being killed to fund this.*
  *   **Question:** "To say Yes to this, what are we saying No to?"
  *   **Action:** The scribe must write down the trade-off.
      *   *Example:* "Funding this music program means we cannot fund 40 mobility aids."
      *   *Example:* "Funding this confidence course means we admit we are prioritizing mood over employment stats."
  *   **Values Call Flag:** If the trade-off makes the committee visibly uncomfortable (e.g., "We are choosing efficiency over dignity"), mark the proposal as **Values Call**. This goes to the full committee vote with a note that reasonable people could disagree.
  *   **Donor Restriction Check:** If this proposal is in the top 20% of "Feeling" metrics, it *must* be charged to the Donor Pot if possible, to preserve the unrestricted pot for "Function/Stuff."

  ---

  ### Part 3: Running the Protocol on Your Three Cases

  Here is how the protocol handles your specific headaches.

  #### Case 1: The Confidence Course (Unemployed 20-somethings)
  *   **Gate 1 (Harm):** Pass. No stigma reported.
  *   **Gate 2 (Currency):** **Deadlock.** Half say "Feeling" (Wellbeing jump), half say "Function" (Employment).
      *   *Resolution:* You cannot vote until you break this. If you vote "Function," it fails Gate 3 (no employment change). If you vote "Feeling," it passes Gate 3 (Yellow Light - durability < 6 months).
      *   *Procedure Verdict:* **Route to Donor Pot.** Since the primary measurable output is "wellbeing survey," it fits the 20% restricted fund. It should not touch the main city pot which implies long-term structural change.
      *   *Council Justification:* "Funds temporary psychological relief for unemployed youth; measured via donor survey." (Council won't wince because it's donor money).

  #### Case 2: Home/Transport Modifications (Disabled Residents)
  *   **Gate 1 (Harm):** **Fail/Warning.** "Applicants hate the means-test interview enough that some drop out." This is stigma.
      *   *Mitigation:* Funding is conditional on removing the interview or making it passive.
  *   **Gate 2 (Currency):** **Stuff/Function.** It's a ramp (Stuff) that allows leaving the house (Function). Consensus easy.
  *   **Gate 3 (Evidence):** **Yellow Light.** "Ramp does wildly different things depending on the building." Conversion factor is unstable.
      *   *Mitigation:* Fund only after a site visit confirms the ramp actually works.
  *   **Gate 4 (Opportunity Cost):** High efficiency, but high stigma risk.
  *   **Procedure Verdict:** **Conditional Yes.** Release funds only when the provider fixes the intake process (Gate 1) and verifies the building allows the ramp (Gate 3).
  *   *Council Justification:* "Purchases physical access infrastructure. Funding released upon verification of installation feasibility and streamlined intake."

  #### Case 3: Music Sessions (Profound Intellectual Disabilities)
  *   **Gate 1 (Harm):** Pass. High happiness, no stigma.
  *   **Gate 2 (Currency):** **Feeling.** "Participants are plainly happier." No change in functioning possible due to nature of disability.
  *   **Gate 3 (Evidence):** **Red Light (for Function), Green Light (for Feeling).** "No measurable change in anything anyone can name as a functioning."
  *   **Gate 4 (Opportunity Cost):** **The Killer.** "Same money would buy mobility equipment for roughly forty other people."
      *   *Values Call:* This is the hardest trade-off. 40 people move vs. 5 people smile.
  *   **Procedure Verdict:** **No (on Main Pot).** The Opportunity Cost Declaration forces you to admit you are choosing happiness over mobility for a larger group. Unless you classify this as "Palliative/Essential Care," the efficiency metric kills it.
      *   *Exception:* If you can classify this as "Health/Mental Health" rather than "Program," it might bypass the efficiency metric, but under your current constraints, **this procedure kills this program.**

  ---

  ### Part 4: The Hard Truths

  You asked me to be straight about what this kills and what it cannot do.

  **1. What this procedure kills that you will not want to kill:**
  It kills **Case 3 (The Music Program)**.
  The procedure forces an Opportunity Cost Declaration. When you write down "Funding this denies mobility aids to 40 others," a volunteer committee acting as stewards of public funds will almost always choose the mobility aids. It treats the happiness of the profoundly disabled as a "luxury good" compared to the "essential good" of mobility.
  *   *Is this right?* Philosophically, many would say no. A life with mobility but no joy is not necessarily better than a life with no mobility but joy. But the *procedure* cannot capture that nuance. It optimizes for "units of benefit per dollar," and mobility scales better than music sessions.

  **2. What about the Meeting Time?**
  I must be blunt: **You cannot run a 40-minute procedure on 6 proposals in a 90-minute meeting.**
  6 proposals × 40 minutes = 4 hours. You have 1.5 hours.
  *   *The Fix:* You must triage. Use a 5-minute "Gate 1 Only" screen for all 6 proposals. Reject the obvious fails. Run the full 40-minute protocol only on the 2 or 3 that pass the screen. If you try to do this for all 6 in 90 minutes, you will skip the "Values Call" steps, and the procedure will become a sham.

  **3. What this procedure CANNOT do (The Currency Problem):**
  You asked if this procedure can tell you that you picked the wrong currency.
  **The answer is No.**
  A decision procedure is a machine. It processes inputs. It cannot critique its own inputs.
  *   If you decide (via Gate 2) that "Employment" is the currency, the machine will tell you the Music Program is worthless.
  *   If you decide "Dignity" is the currency, the machine will tell you the Confidence Course is valuable.
  *   **The procedure cannot tell you which currency is morally correct.** It only ensures that whatever currency you choose, you apply it consistently and honestly.

  **4. The "Lab Coat" Warning:**
  Steps Gate 2 (Currency Declaration) and Gate 4 (Opportunity Cost) are **Judgement Calls wearing a lab coat.**
  When you select "Feeling" over "Function," that is a political choice, not a mathematical one. The procedure makes it *look* technical ("We scored low on Durability"), but it is actually a value judgment ("We do not fund fleeting happiness with tax dollars").
  *   **My Advice:** Do not hide this from the City Council. In your one-page justification, use the language of the trade-off. *"The Committee prioritized long-term mobility over short-term wellbeing in this cycle."* That is honest. It protects you when the music program parents come screaming to the Council. You can say, "We documented the trade-off. We chose the many over the few."

  **Final Recommendation:**
  Adopt the protocol, but **reduce your meeting load**. Fund fewer proposals better. It is better to fund 3 programs with full scrutiny than 6 programs with confused justification. If you cannot reduce the load, this procedure will fail, and you will return to arguing about slogans.
