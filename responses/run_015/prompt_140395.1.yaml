prompt: |-
  hey — I'm a backend engineer, twelve-ish years, mostly Go and Postgres, and I've read all of zero philosophy. I got into a comment-section argument about whether a guy who donates a kidney to a stranger is being a good person or doing something nobody had any right to expect of him, and someone dropped the word supererogation. I looked it up and got the usual one-liner: acts that are good to do, praiseworthy if you do them, not blameworthy if you skip them. That definatly feels like it's hiding the interesting part, so I want you to rebuild the thing in vocabulary I actually use and then tell me where it breaks.

  What I have to work with: MUST / SHOULD / MAY in the RFC sense; spec vs implementation; merge gates; blocking vs non-blocking review comments; lint severities; SLOs and error budgets; best-effort delivery semantics; on-call rotations; performance rubrics; the gap between this pages you at 3am and this would be nice.

  My first pass, which I want you to correct rather than humour: MUST = duty, MAY = merely permissible, supererogatory = SHOULD. I already think that's wrong, because in my world a SHOULD violation still has to be justified and still counts as a defect, whereas the whole point here seems to be that skipping the thing needs no justification at all. So give me the better mapping, or say plainly that my vocabulary has no slot for it and say why not.

  Then run these through whatever mapping you settle on, and tell me whether they land in the same place: the kidney donor; a stranger jumping onto subway tracks after someone; me staying up till 2am fixing a bug in a teammate's service that isn't mine; handing back a wallet with cash still in it (zero cost to me); not tipping; quietly cleaning up a module nobody owns. That last one is a thing on my team we've started calling a shadow requirement: not in the spec, never blocks a merge, gets you visible credit at review if you do it, and literally nobody says a word if you don't. I want to know whether heroism and ordinary small favours are the same shape here or whether the word is papering over two different things, and I especially want to know whether cost to the agent is doing the real work — does the category require the act to be costly, or is that just an accident of which examples people reach for?

  Then the residue report, which is the part I actually care about. What doesn't survive the translation? My guess is that praise and blame have no honest counterpart on my side: I have credit-in-a-rubric and gets-flagged-in-review, which are roughly symmetric, and I have nothing for positive credit with zero penalty on the other side. In any scoring system I know, rewarded-if-done and never-penalised-if-skipped just collapses into weakly preferred — a preference or a stretch goal, not a requirement — so tell me whether the philosophical notion evaporates under that translation or whether the evaporation is itself the interesting finding. And say whether that points to something my vocabulary is missing, or to the philosophers leaning on something that only looks substantive because nobody ever had to implement it.

  Two housekeeping things. I have no library access and can't chase references, so don't point me at papers or tell me who to read — argue it in the vocabulary above. And seperate what's settled from what's actually fought over: I want to know which bits are just how the word is defined, which everyone agrees on, and which are live disagreements among people who work on this. I've been burned before by someone reciting their side's line as though it were the consensus. If any distinction you need only exists inside one particular framework, flag that instead of smuggling it in as standard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer, ~12 years experience, Go/Postgres stack. Pragmatic, systems-thinking oriented. Zero philosophy background.
      *   **Task:** Explain the philosophical concept of *supererogation* using engineering vocabulary (RFCs, SLOs, merge gates, etc.). Correct their initial mapping (MUST/SHOULD/MAY). Analyze specific scenarios (kidney, subway, bug fix, wallet, tipping, shadow requirement). Investigate the role of *cost*. Identify what gets lost in translation (the "residue report"). Distinguish settled definitions from live philosophical debates.
      *   **Constraints:** No academic references/citations (argue in the provided vocabulary). Separate settled definitions from contested areas. Be direct, not humoring.
      *   **Key Insight Needed:** The user suspects their vocabulary (RFC 2119 style) collapses supererogation into "weakly preferred" (SHOULD/MAY hybrid) and wants to know if the concept evaporates or if the vocabulary is missing a dimension (specifically regarding praise/blame asymmetry and cost).

  2.  **Deconstruct the Initial Mapping (MUST/SHOULD/MAY):**
      *   *User's Guess:* MUST = Duty, MAY = Permissible, Supererogatory = SHOULD.
      *   *User's Correction:* They already know `SHOULD` is wrong because `SHOULD` implies a defect if violated without justification. Supererogation implies *no* blame/defect if skipped.
      *   *Engineering Analogy:*
          *   `MUST` = Duty/Obligation. Violation = Page/Critical Incident/Blocker.
          *   `MAY` = Permissible. No opinion.
          *   `SHOULD` = Best Practice. Violation = Warning/Technical Debt (needs justification).
          *   *Supererogatory:* This is the tricky one. It's `MAY` (no penalty for skipping) but with `MUST`-level praise if done. In engineering terms, it's like a "Bonus Feature" that isn't in the spec but makes the system significantly more robust, yet skipping it doesn't violate SLOs.
      *   *Better Mapping:* It's not a RFC 2119 keyword. It's a *meta-attribute* on the action. It's `MAY` + `High Priority Tag` that doesn't trigger CI failure. Or, it's an action that exceeds the SLO without being required by the SLO.

  3.  **Address the "Cost" Variable:**
      *   Philosophy debate: Does supererogation *require* significant cost/sacrifice?
      *   *Settled:* It must be optional (no duty). It must be good (morally positive).
      *   *Contested:* Does it need to be *costly*? (The "Heroism" vs. "Small Favor" debate).
      *   *Engineering Translation:* Is it "Heroic On-Call" (sleep deprivation, high stress) vs. "Cleaning up a module" (low effort, high value)?
      *   *Hypothesis:* If cost isn't required, then "shadow requirements" (cleaning up a module) are supererogatory. If cost *is* required, they aren't. This is a live philosophical fight.

  4.  **Analyze the Scenarios (Mapping to Engineering Terms):**
      *   *Kidney Donor:* High cost, high value, optional. Clear supererogation. (Exceeds SLOs significantly, risks personal uptime).
      *   *Subway Jump:* Extreme cost (life risk), high value. Borderline. Some argue duty (if easy), most say supererogatory.
      *   *Teammate Bug Fix (2am):* Moderate/High cost (sleep), high value (team velocity). Supererogatory.
      *   *Wallet (Zero Cost):* Low cost, high value. Is it duty or supererogatory? Most say Duty (`MUST`). Returning property is often a legal/moral baseline.
      *   *Not Tipping:* (Context dependent). If service occurred, tipping might be `SHOULD` (social contract). If no service, `MAY`.
      *   *Shadow Requirement (Module Cleanup):* Low cost, moderate value. Optional (`MAY`). Praiseworthy? Yes. Blameworthy if skipped? No. This fits the *structure* of supererogation, but lacks the *magnitude*.

  5.  **The Residue Report (What gets lost?):**
      *   *Praise/Blame Asymmetry:* Engineering systems are usually symmetric (Metrics go up or down). Supererogation is asymmetric (Up is great, Down is neutral).
      *   *The "Collapse":* In a scoring system (Performance Rubric), `Reward-if-done + No-penalty-if-skipped` usually becomes `Stretch Goal`.
      *   *The Missing Dimension:* *Intent* and *Sacrifice*. Engineering metrics measure *output*, not *cost to the agent*. A script can clean the module. A human sacrificing sleep to fix a bug is different. The "moral worth" is tied to the *cost*, which engineering vocab actively tries to minimize/abstract away.
      *   *Conclusion:* The concept doesn't fully evaporate, but it highlights that engineering vocab is *consequentialist* (outcome-focused), while supererogation is often *agent-focused* (sacrifice-focused).

  6.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone:* Direct, technical, peer-to-peer. No fluff.
      *   *Structure:*
          1.  Correct the Mapping (RFC 2119 vs. Supererogation).
          2.  Scenario Analysis (Categorize the examples).
          3.  The Cost Question (Settled vs. Contested).
          4.  Residue Report (What breaks).
          5.  Settlement Status (What is definition vs. debate).
      *   *Refining the Mapping:* Don't just say `SHOULD` is wrong. Explain *why*. `SHOULD` implies a "compliance gap." Supererogation implies "no gap."
      *   *Refining the "Shadow Requirement":* This is the crux. Is it supererogatory? Yes, structurally. But does it feel like it? No. Why? Magnitude/Cost.
      *   *Refining the Residue:* The key is the *asymmetry of evaluation*. Engineering loves symmetry (SLOs). Morality tolerates asymmetry.

  7.  **Self-Correction/Check during drafting:**
      *   *Did I use references?* No.
      *   *Did I distinguish settled vs. contested?* Need to make sure I explicitly flag the "Cost" debate as contested.
      *   *Did I answer the "evaporation" question?* Yes, need to be clear: it evaporates in *metrics*, but persists in *culture*.
      *   *Did I address the "Wallet" example?* Need to be careful. Returning a wallet is often considered Duty (`MUST`), not supererogatory. I need to make sure I don't misclassify it based on the user's prompt implication. The prompt asks me to run them through the mapping. I should classify them honestly based on the philosophy, not just agree with the user's implied grouping.
      *   *Wait, check the Wallet:* User says "handing back a wallet with cash still in it (zero cost to me)". In philosophy, this is usually *Duty*, not supererogation. I need to point out that *zero cost* often pushes things into `MUST`. Supererogation usually requires *some* cost, even if small. This ties into the "Cost" debate.

  8.  **Final Polish:** Ensure the RFC 2119 analogy holds up.
      *   `MUST` = Duty.
      *   `MUST NOT` = Forbidden.
      *   `SHOULD` = Imperfect Duty / Best Practice (Violation = Defect).
      *   `MAY` = Permissible (Neutral).
      *   `Supererogatory` = `MAY` + `Bonus Credit` (Asymmetric).
      *   *Problem:* RFC 2119 has no "Bonus Credit". It only defines compliance. This is the "Residue".

  9.  **Final Review against constraints:**
      *   12 years exp tone? Yes.
      *   No library access respected? Yes.
      *   Separate settled/contested? Yes.
      *   Address the "Shadow Requirement"? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  ### 1. The Mapping Correction

  Your first pass was right to flag `SHOULD` as incorrect. In RFC 2119 terms, `SHOULD` implies a negative delta if ignored. It creates technical debt. It's a "soft requirement." If you skip a `SHOULD`, you owe the team an explanation during retro. That is not supererogation.

  Here is the corrected mapping using your stack:

  *   **MUST (Duty):** Compliance gates. If this fails, the build breaks, the page fires, or you are liable. Violation = Blame/Incident.
  *   **MAY (Permissible):** Undefined behavior. The system doesn't care. No credit, no blame.
  *   **SHOULD (Imperfect Duty / Best Practice):** Lint warnings. You can bypass them, but the CI log shows a warning. It counts as a defect in a rigorous audit. Violation = Justification required.
  *   **Supererogatory:** This keyword **does not exist** in RFC 2119.

  In your vocabulary, a supererogatory act is a **non-blocking commit that grants admin-level merge privileges on the next PR.**

  Structurally, it looks like `MAY` (you can skip it without breaking the build), but evaluation-wise, it triggers a `MUST`-level positive signal (praise/credit) that `MAY` does not. It is an **asymmetric handler**.

  *   **Standard Logic:** `If Action -> +Score; If No Action -> 0 Score.` (This is `SHOULD` or Stretch Goals).
  *   **Supererogatory Logic:** `If Action -> +HighScore; If No Action -> 0 Penalty.`

  The reason your vocabulary struggles is that engineering specs are designed to define **minimum viable correctness**. They define the floor. Supererogation defines a ceiling that is praised but not enforced. Your rubric likely collapses this into "Stretch Goals," which is where the translation starts to leak.

  ### 2. Scenario Classification

  Running your examples through the corrected mapping. Note that philosophy does not agree on all of these (see Section 4), but this is the standard consensus view.

  | Scenario | Engineering Equivalent | Classification | Notes |
  | :--- | :--- | :--- | :--- |
  | **Kidney Donor** | Re-architecting a legacy monolith to microservices on your own weekend to save the platform. | **Supererogatory** | High cost to agent, massive value to system. Clearly optional. |
  | **Subway Jump** | Jumping into a production DB console without 2FA to kill a runaway query that will bankrupt the company. | **Contested** | High risk. Some argue `MUST` (if you're the only SRE on duty), most say Supererogatory. |
  | **Teammate Bug (2am)** | Fixing a pager duty alert that isn't yours because the on-call is incapacitated. | **Supererogatory** | Exceeds rotation contract. High personal cost. |
  | **Wallet (Zero Cost)** | Returning a dropped ID badge to the desk on your way in. | **Duty (`MUST`)** | Most frameworks classify zero-cost moral acts as obligatory. Keeping it is a violation. |
  | **Not Tipping** | Skipping the optional bonus field in the expense report for a vendor who did the bare minimum. | **Permissible (`MAY`)** | Unless social contract dictates otherwise. Usually `MAY`. |
  | **Shadow Requirement** | Refactoring a shared module nobody owns, no ticket, no spec. | **Supererogatory (Structural)** | Fits the logic: No penalty if skipped, credit if done. |

  **The Wallet Distinction:** You noted "zero cost to me." In most ethical frameworks, if the cost is negligible and the value is high, the act shifts from Supererogatory to Duty (`MUST`). Supererogation usually requires *some* friction. If returning the wallet required driving 30 minutes out of your way, it moves back toward Supererogatory.

  ### 3. The Cost Variable: Settled vs. Contested

  You asked if cost is doing the real work. This is the biggest fault line in the literature.

  **Settled:**
  1.  **Optionality:** The act cannot be required (`MUST`). If you are blamed for skipping it, it's not supererogatory.
  2.  **Goodness:** The act must be morally positive (value-add).

  **Contested (Live Disagreement):**
  1.  **The Cost Threshold:** Does the act *require* significant sacrifice to count?
      *   *Side A (Traditional):* Yes. Supererogation is for "heroes" or "saints." Cleaning up a module is just "good engineering," not supererogatory. It lacks the *magnitude* of sacrifice.
      *   *Side B (Modern/Analytic):* No. Cost is incidental. The structural logic (Optional + Good + Praiseworthy) is what matters. Small favors fit the shape.
  2.  **The Duty Creep:** If everyone starts doing the supererogatory thing (e.g., everyone starts cleaning the module), does it become a `MUST`?
      *   *Side A:* No. It remains optional.
      *   *Side B:* Yes. Social expectations shift. If the whole team refactors on weekends, not doing it makes you look bad, effectively turning it into a `SHOULD` or `MUST`.

  **Verdict on your "Shadow Requirement":**
  Under Side A, it's just "good citizenship." Under Side B, it is structurally supererogatory. The fact that you call it a "shadow requirement" suggests your team is experiencing **Duty Creep**. It's not in the spec, but if nobody does it, the system degrades. That pressure makes it feel less like heroism and more like hidden technical debt.

  ### 4. The Residue Report (What Breaks)

  You guessed that praise/blame has no honest counterpart. You are correct. Here is exactly what evaporates and what remains.

  **1. The Asymmetry Problem (The Evaporation)**
  Your engineering vocabulary is symmetric.
  *   `MUST`: Pass = Neutral, Fail = Critical.
  *   `MAY`: Pass = Neutral, Fail = Neutral.
  *   `SHOULD`: Pass = Neutral, Fail = Warning.

  Supererogation requires: **Pass = Praise, Fail = Neutral.**
  In a performance rubric, "Praise" is a finite resource (calibration, promotions, bonuses). If you reward "Pass" on a `MAY` action, you effectively incentivize it. Once incentivized, it becomes expected. Once expected, skipping it becomes a performance gap.
  **Result:** In an implementation, supererogatory acts inevitably compile down to `SHOULD` (Stretch Goals). The category evaporates because management systems cannot sustain asymmetric reward structures without converting them into metrics.

  **2. The Agent Cost (The Missing Dimension)**
  Engineering vocab optimizes for **System State**, not **Agent State**.
  *   *System:* The bug is fixed.
  *   *Agent:* I missed my kid's birthday to fix the bug.

  Supererogation is fundamentally about the **cost to the agent**. A script cleaning the module is functionally identical to you doing it, but the script cannot be supererogatory because it incurs no cost.
  **Result:** Your vocabulary has no variable for `sacrifice`. You track `latency`, `throughput`, `error_rate`. You do not track `engineer_suffering`. Therefore, you cannot distinguish between "Heroic On-Call" and "Automated Remediation" in your specs. They look the same in the logs. The philosophical "goodness" is lost because the cost metric is invisible to the system.

  **3. The "Right to Expect" (The Contract Boundary)**
  The kidney argument you started with hinges on **entitlement**.
  *   *Philosophy:* Did the recipient have a *right* to the kidney? No.
  *   *Engineering:* Does the Service Level Objective (SLO) guarantee 100% uptime? No.

  If you fix the bug at 2am, did the teammate have a *right* to expect that?
  *   If your contract says "On-Call covers their own service," then no. It was supererogatory.
  *   If your culture treats "Team Velocity" as a `MUST`, then yes. You blocked the team.

  **The Finding:** The philosophical notion doesn't evaporate, but it exposes a **specification gap**. Your vocabulary assumes the Spec (Contract) is complete. Supererogation exists *only* in the gap between the Spec and the Ideal.
  *   If your Spec is perfect (covers all duties), Supererogation is everything outside the Spec that is good.
  *   If your Spec is incomplete (common), Supererogation is often just **unacknowledged Duty**.

  ### 5. Settlement Status Summary

  To ensure you aren't burned by one side of the debate presenting as consensus:

  | Concept | Status | Consensus View | Live Disagreement |
  | :--- | :--- | :--- | :--- |
  | **Definition** | **Settled** | Acts that are good, optional, and praiseworthy. | None. This is the lexical definition. |
  | **Existence** | **Contested** | Most accept the category exists. | Some utilitarian frameworks argue it doesn't exist (everything is either Duty or Neutral). |
  | **Cost Requirement** | **Contested** | Traditional view: Requires significant sacrifice. | Analytic view: Requires only optionality + goodness. |
  | **Duty Creep** | **Contested** | Some say doing it often makes it mandatory. | Others say it remains optional regardless of frequency. |
  | **Mapping to `SHOULD`** | **Settled** | **It is not `SHOULD`.** | None. `SHOULD` implies defect on violation; Supererogation does not. |

  ### Final Verdict for Your Argument

  The guy who donated the kidney is operating outside the spec. The recipient had no SLA entitlement to that organ. Therefore, the donor is not liable for `downtime` (not donating), but deserves `credit` (praise) for `uptime` (donating).

  However, your vocabulary fails to capture this because **engineering culture treats unspoken value as technical debt.** If cleaning the module is valuable, why isn't it ticketed? If it's not ticketed, why do you feel pressure to do it?

  The philosophical concept of supererogation survives only where the **contract is explicitly limited**. In your world, contracts (specs) are implicitly infinite (ship value). Therefore, supererogation collapses into "unrecognized work." The philosophers are leaning on a boundary (Duty vs. Beyond Duty) that your industry actively tries to erase (Ship All Value).

  **Use this:** "Supererogation is a `MAY` verb with a `MUST`-level callback handler. My stack doesn't support asymmetric callbacks, so everything I do either becomes a requirement or gets deleted."
