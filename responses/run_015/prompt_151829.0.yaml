answer: |-
  ### Part 1: Psychological Dynamics of Reference-Class Shifts

  Before designing the mechanics, we must anticipate how this specific demographic (rationalists, philosophers, hobbyists) will react to anthropic pressure.

  1.  **The "Specialness" Resistance:** Rationalists are trained to update on evidence, but self-locating evidence feels different than external evidence. Participants will instinctively resist the idea that their birth rank (or workshop arrival order) carries probabilistic weight about the future of the species. They will attempt to "pierce the veil" by claiming their specific context (the workshop) makes them a non-random sample. The game must make this resistance *costly*.
  2.  **The Market Herding:** In a prediction market setting, if a few vocal participants argue for "Survival" (Large Total), others may follow to avoid social friction, even if their private cards suggest "Doom" (Small Total). We need to anonymize the initial betting to isolate the Bayesian update from social signaling.
  3.  **The "Gaming" Instinct:** The decision-theory hobbyist will look for arbitrage in the payoff matrix. If the scoring rule doesn't perfectly align with the logarithmic likelihood ratio of the Doomsday Argument, they will exploit the mismatch rather than engage with the philosophy. The incentives must be proper (e.g., a logarithmic scoring rule).
  4.  **Existential Friction:** The Doomsday Argument is unsettling. If the game works too well, you risk genuine anxiety. The framing must be clinical ("Civilization Trajectories") rather than apocalyptic ("Human Extinction"), reserving the emotional weight for the debrief.

  ---

  ### Part 2: Activity Design — "The Urn of Civilizations"

  **Objective:** Participants must deduce the total size of the population they belong to based solely on their individual rank, coordinating a group prediction about whether their civilization is in its "Early" (Survival) or "Late" (Doom) phase.

  **Materials:**
  *   14 Sealed Envelopes ("Census Cards").
  *   14 Betting Slips (Private).
  *   1 Whiteboard (Public Market).
  *   Token Currency ("Chronons").
  *   Timer.

  **The Hidden Setup (Facilitator Only):**
  *   There are two possible "Worlds": **World S (Short)** and **World L (Long)**.
  *   **World S:** Total Population = 20.
  *   **World L:** Total Population = 10,000.
  *   **Truth:** You (the Facilitator) have pre-determined that the room is in **World S**. All 14 envelopes contain ranks drawn uniformly from 1 to 20. (e.g., ranks like 3, 7, 14, 19).
  *   *Note:* No one actually holds a rank > 20. This is the critical empirical constraint that makes the DA work in the room.

  #### Round 1: The Private Update (15 Minutes)
  1.  **Distribution:** Hand out envelopes. Instruct participants not to show their cards.
  2.  **Card Content:** Each card has a **Rank** (e.g., "14") and a **Class ID** (e.g., "Alpha"). The Class ID is identical for everyone but meaningless without context.
  3.  **Instruction:** "You are an observer in a civilization. You do not know if the total number of observers in your civilization is 20 (World S) or 10,000 (World L). Priors are 50/50. Based *only* on your Rank, calculate the posterior probability that you are in World S."
  4.  **Action:** Participants write their probability $P(S | Rank)$ on a private betting slip.
  5.  **Payoff:** They are scored later using a Brier Score. Accuracy yields Chronons.

  #### Round 2: The Reference Class Market (30 Minutes)
  1.  **Market Opening:** On the whiteboard, draw two columns: **World S (Doom)** and **World L (Survival)**.
  2.  **Trading:** Participants can buy "Shares" in either World. Price is dynamic.
      *   *Initial Price:* 50 Chronons each.
      *   *Mechanism:* To buy a Share in World L, you must pay a **Likelihood Tax**.
      *   *The Tax Rule:* The cost of a World L share is multiplied by $\frac{Rank}{Total_L}$. Since $Total_L$ is 10,000 and Ranks are ~10, the tax is tiny, *BUT* the payout is conditional.
      *   *Simplified Mechanic for Flow:* Instead of complex pricing, use a **Wager Cap**.
          *   If you bet on World S: You can wager up to 100 Chronons.
          *   If you bet on World L: You can wager only $\frac{20}{10,000} \times 100$ Chronons (effectively 0.2 Chronons).
      *   *Rationale:* This enforces the Likelihood Ratio. If you are truly a random sample, betting on World L is statistically reckless. The rules physically prevent them from betting heavily on Survival unless they reject the "Random Sample" premise.
  3.  **The Loophole (Reference Class Shift):** Participants may petition to **Reclassify**.
      *   If a participant claims, "I am not a random observer; I am a Workshop Attendee," they can pay a flat fee (10 Chronons) to ignore their Rank.
      *   If they pay the fee, their Wager Cap on World L returns to 100 Chronons.
      *   *Psychological Trap:* This forces them to explicitly pay to reject the Self-Sampling Assumption (SSA).

  #### Round 3: The Leak and Coordination (30 Minutes)
  1.  **Information Leak:** Announce: "I have verified that at least one person in this room holds a Rank greater than 10." (This is trivially true given the setup, but it highlights the distribution).
  2.  **Coordination Task:** The group must agree on a single "Civilization Trajectory" to unlock their winnings.
      *   If they agree on **World S**: Everyone gets their Wager back + 10% bonus.
      *   If they agree on **World L**: Everyone gets their Wager back + 10% bonus *ONLY IF* at least 50% of the group paid the Reclassification Fee in Round 2.
  3.  **Conflict:** Those who paid the fee want World L. Those who didn't want World S. They must debate the *philosophical justification* to unlock the prize.
  4.  **Closure:** Collect all slips and cards. Do not reveal the Truth yet.

  #### Debrief & Reveal (15 Minutes)
  1.  **Reveal:** Announce the room was indeed **World S** (Total = 20).
  2.  **Score:** Calculate winnings. Those who followed the SSA (bet on S) will have higher theoretical expected value, even if the group coordinated on L.
  3.  **Discussion:** Map the experience to the Doomsday Argument.

  ---

  ### Part 3: Pedagogical Debrief & Logical Mapping

  **1. Mapping Rounds to Logic:**
  *   **Round 1 (The Likelihood Ratio):** This isolates the core Bayesian update of the Doomsday Argument.
      *   $P(Rank | S) = 1/20$.
      *   $P(Rank | L) = 1/10,000$.
      *   Likelihood Ratio $\approx 500:1$ in favor of Doom.
      *   *Lesson:* If you accept you are a random sample, the update is overwhelming.
  *   **Round 2 (The Cost of Resistance):** The "Reclassification Fee" represents the theoretical cost of rejecting the Self-Sampling Assumption (SSA).
      *   In philosophy, rejecting SSA requires adopting an alternative (like SIA or a specific reference class theory). In the game, this costs literal points.
      *   *Lesson:* Avoiding the Doomsday conclusion isn't free; it requires adopting a more complex prior or reference class definition.
  *   **Round 3 (The Coordination Problem):** This mirrors the real-world stakes. Even if the math says "Doom," society might coordinate on "Survival" by collectively agreeing to reject the reference class (e.g., "We are special," "Technology will save us").
      *   *Lesson:* The DA is a solitary probabilistic argument; policy is a group coordination problem.

  **2. Where the Inferential Step Can Be Resisted:**
  *   **The Prior:** Participants can argue the prior for World L should be 99.9%, not 50%. (Cost: They must justify why *a priori* longevity is almost certain).
  *   **The Reference Class:** Participants can argue they are not "Observers" but "Workshop Attendees." (Cost: They paid the Reclassification Fee. If the Truth is World S, they wasted points).
  *   **The Sampling:** Participants can argue they weren't chosen randomly. (Cost: Requires a theory of *why* they were chosen non-randomly that correlates with World L).

  **3. Approximations vs. Verbal Supplements:**
  *   **Approximation:** The game uses a fixed "True World" (S). In reality, there is no "True World" yet; the future is unwritten.
      *   *Verbal Supplement:* You must explain that the DA doesn't *cause* doom; it updates the probability. The game fixed the outcome to validate their math, but in reality, the argument is about *expectation*, not fate.
  *   **Approximation:** The "Random Draw" is simulated by envelopes. In reality, birth order is causal, not random.
      *   *Verbal Supplement:* Explain the **Self-Sampling Assumption (SSA)**. The game forces SSA by rule. In reality, SSA is a philosophical choice. You must articulate that the "pull" they felt was the force of SSA, not empirical fact.
  *   **Approximation:** The "Reclassification Fee." In philosophy, changing reference classes doesn't cost money; it costs explanatory power.
      *   *Verbal Supplement:* Clarify that the "fee" represents the complexity penalty of a hypothesis. A theory that says "We are special" is more complex than "We are average."

  ---

  ### Part 4: Predictable Failures & Corrections

  **Failure 1: The "Gamer" Exploit**
  *   *Risk:* The decision-theory hobbyist realizes that if the group coordinates on World L, and enough people pay the fee, everyone wins the bonus regardless of the Truth. They might lobby to ignore the math entirely.
  *   *Correction:* In the Debrief, reveal that the "Truth" was World S. Show that the "Gamer" strategy yielded a lower *Expected Value* even if it unlocked the bonus. Emphasize that in reality, there is no Facilitator to pay out bonuses for false beliefs.

  **Failure 2: Reference Class Confusion**
  *   *Risk:* Philosophy grad students may get bogged down in defining "Observer." Is it a human? A mind-moment? A carbon-based lifeform? Round 1 stalls.
  *   *Correction:* Intervene at the 10-minute mark. "For the purpose of this game, 'Observer' is defined as 'Holder of a Census Card.' Disputes about metaphysical identity must be settled via the Reclassification Fee."

  **Failure 3: Emotional Disengagement**
  *   *Risk:* Because the stakes are coffee tokens, no one feels the existential weight. They treat it as a pure logic puzzle.
  *   *Correction:* During the Round 3 Coordination, dim the lights. Speak slowly. Remind them that in the real world, the "Bonus" is the survival of their descendants, and the "Fee" is the humility of accepting mediocrity.

  ---

  ### Part 5: Limitations of the Game

  Be honest with your participants about what the game *cannot* reproduce:

  1.  **The "No Outsider" Problem:** In the game, you (the Facilitator) know the Total. In reality, there is no outside observer to verify the Total. The game validates the DA by cheating (you know the answer); reality offers no such validation.
  2.  **Causal vs. Logical:** The game implies the Rank *determines* the World. In reality, the Rank is a *symptom* of the World. The DA is often mistaken for a causal mechanism (believing in Doom causes Doom). You must explicitly decouple correlation from causation in the debrief.
  3.  **The End of the Game:** The game ends in 90 minutes. The Doomsday Argument concerns a timeline that may outlast the players. The "closure" of the workshop gives a false sense of resolution that the actual argument does not provide.

  **Final Facilitator Note:**
  Your goal is not to convince them humanity will end. Your goal is to make them feel the *tension* between the Self-Sampling Assumption and their intuition of specialness. If they leave the room arguing about whether they were justified in paying the Reclassification Fee, you have succeeded.
