      *   **Axis 1: The Moral Ontology (Weber vs. French).** Contrast the "Sinful Rest" vs. "Civic Rest." One sees work as the point, the other sees life as the point.
      *   **Axis 2: The Corporate Ontology (Karoshi vs. Liability).** Contrast "Work as Soul" vs. "Worker as Machine."
      *   **The Pivot (The Hybrid):** Analyze the "Right to Disconnect." Why does it feel weird? Because it uses the language of rights (French) to serve the logic of maintenance (Corporate).
      *   **The Synthesis/Conclusion:** Answer the "What is a person?" question.
          *   *Worker who rests:* Instrumental. Rest is recharging the battery.
          *   *Resting being who works:* Existential. Work is a subset of life.
      *   **Final Insight:** The liability model traps us in the "Worker who rests" frame even when it promises freedom.

  5.  **Refining the Concepts (Self-Correction during drafting):**
