answer: |-
  This is a profound ontological question disguised as a labor policy debate. You are asking whether time off is a **boundary** (a wall between who you are and what you do) or a **function** (a maintenance cycle required for what you do).

  Here is the map of that conceptual tension, moving from the moral to the mechanical, and ending with the hybrid that collapses the distinction.

  ### 1. The Two Poles: "Against" vs. "Within"

  To understand the confusion, we first have to separate the two fundamental orientations.

  **Leisure *Against* Work (The Boundary Model)**
  *   **The Logic:** Work and Life are distinct spheres. Work is a transaction; Life is the destination.
  *   **The Person:** A citizen or a human being who *sells* labor.
  *   **The Purpose of Rest:** Flourishing. Rest is where you become a parent, a voter, an artist, or a friend. It is time reclaimed from the economy.
  *   **The Vibe:** "I am not working now."

  **Leisure *Within* Work (The Functional Model)**
  *   **The Logic:** Work is the primary reality. Rest is a sub-routine of production.
  *   **The Person:** A resource, an asset, or a unit of capacity.
  *   **The Purpose of Rest:** Maintenance. Rest is where you recharge the battery so the asset doesn't depreciate. It is time managed by the economy.
  *   **The Vibe:** "I am currently in a non-productive phase of my work cycle."

  ### 2. The Three Historical Frames

  Your examples fit neatly into these poles, except for the last one, which breaks the machine.

  **A. The Protestant Ethic (Weber): Rest as Moral Risk**
  *   **Ontology:** The Human as a Steward.
  *   **Frame:** Leisure *Against* Work, but negatively.
  *   **Concept:** If work is a "calling" (Beruf), then time not spent working is time not spent serving God. Rest is biologically necessary but morally suspicious. It is a concession to weakness, not a right.
  *   **Result:** You rest only so you don't die, because dead workers can't glorify God.

  **B. The French 35-Hour Week: Rest as Distributive Justice**
  *   **Ontology:** The Human as a Citizen.
  *   **Frame:** Leisure *Against* Work, positively.
  *   **Concept:** Time is a finite resource. If productivity gains aren't converted into free time, capital is hoarding life. Rest is a political right to ensure there is enough "life" to go around.
  *   **Result:** The boundary is rigid. Leaving work is an act of citizenship.

  **C. Karoshi Culture: Work as Identity**
  *   **Ontology:** The Human as a Cell in the Corporate Body.
  *   **Frame:** Leisure is irrelevant/subordinate.
  *   **Concept:** The firm is the family. Overwork is proof of loyalty. To disconnect is to sever the connection to the collective. Rest is not a right; it is a lack of commitment.
  *   **Result:** The boundary dissolves. You are always "at work" because you are always part of the firm.

  ### 3. The Hybrid: The "Right to Disconnect" as Liability Management

  This is where your intuition is spotting the trap. In post-Karoshi Japan (and increasingly in global corporate HR), the "Right to Disconnect" is often framed not as a human right, but as a **compliance obligation.**

  *   **The Ontology:** The Human as a Risk Profile.
  *   **The Frame:** Leisure *Within* Work.
  *   **The Concept:** If a worker dies from overwork (Karoshi) or burns out, the firm faces litigation, reputational damage, and recruitment costs. Therefore, the firm must *mandate* rest.
  *   **The Twist:** Rest becomes a "mandatory non-productive obligation." You are *ordered* to stop working.

  **Why this collapses the distinction:**
  In the French model, you disconnect to live. In the Liability model, you disconnect to prevent the firm from being liable for your death.
  *   **Rest-for-Flourishing:** "I am resting because I have a life outside this building."
  *   **Rest-for-Maintenance:** "I am resting because if I don't, the asset (me) will break and cost the operator (the firm) money."

  When rest is mandated by the employer for the employer's safety, it ceases to be "freedom from work" and becomes "a specific type of work requirement." It is the same logic as a mandatory safety shutdown on a factory press. The press isn't "free" when it's off; it's just in a safe state.

  ### 4. The Ontological Payoff: What is a Person?

  This brings us to your core question: *Are we workers who occasionally rest, or resting beings who occasionally work?*

  **If Leisure is *Against* Work (French/Humanist):**
  We are **Resting Beings who Occasionally Work.**
  Work is an instrumental activity we undertake to support our actual existence, which happens in leisure. The "self" exists primarily outside the market. Policy should protect the *boundary*.

  **If Leisure is *Within* Work (Liability/Weberian/Karoshi):**
  We are **Workers who Occasionally Rest.**
  Work (or economic utility) is the default state of being. Rest is merely a pause button. Even when the "Right to Disconnect" is invoked in the liability frame, it reinforces that the *firm* owns the time, even the time off. They are granting you permission to stop. The "self" is a capacity to be managed.

  ### The Conceptual Knot

  The knot you are feeling is that the **Liability Model uses the language of the Humanist Model to enforce the logic of the Maintenance Model.**

  It uses words like "Right," "Wellbeing," and "Balance" (Humanist), but implements them through compliance, monitoring, and risk mitigation (Maintenance).

  *   **The Trap:** When a company forces you to log off at 6 PM to protect their liability, they are not acknowledging your life outside; they are acknowledging your fragility as a tool.
  *   **The Consequence:** This makes it harder to argue for true leisure. If rest is just "maintenance," then any rest that doesn't contribute to recharging your productivity (e.g., aimless wandering, unproductive hobbies, political dissent) becomes harder to justify. Even your free time becomes subject to the logic of optimization.

  **Summary:**
  The tension isn't just about hours. It's about ownership of the self.
  *   **Right *Against* Work:** I own myself; I rent you my labor.
  *   **Right *Within* Work:** You rent my capacity; you must maintain the equipment.

  The "Right to Disconnect" in its current corporate form often pretends to be the former while legally functioning as the latter. It treats the human not as a citizen reclaiming their time, but as a battery that must not be drained to zero, lest the charger be held responsible.
