      *   *Reconstruction:* How to get Direct Duties?
          *   *Korsgaard's Move:* We value our own ends. Our ends depend on our animal nature (avoiding pain). To be consistent, we must value the animal nature in others.
          *   *The "Humanity" Expansion:* "Humanity" isn't just reason; it's the rational *animal*. To disrespect the animal is to fragment the self.
      *   *Conclusion:* The friend wins the text; the user wins the philosophy. But a true Kantian *should* be a direct-duty theorist.

  5.  **Refining the Argument (Self-Correction during drafting):**
