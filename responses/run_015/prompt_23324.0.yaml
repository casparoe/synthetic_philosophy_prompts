prompt: |-
  Me and my friend got into a massive argument last night about Kant and whether we have any direct duties to animals. He's the indirect-duties guy — your whole reason to not kick a puppy is that kicking puppies makes you a worse person toward other humans, not that the puppy itself matters morally. I kept saying that's incoherant, because what if kicking the puppy has zero effect on your sympathy toward humans? Then on his view there's no duty at all, which is absurd. Write me an essay that actually settles this. Weigh the indirect duties view against the case that Kant's framework can support direct duties to animals, and reach a conclusion you can defend. I don't want the standard regurgitation that Kant treats animals as mere means — I want the real tensions: the sympathy mechanism, the counterexamples where cruelty has no character effect, and whether the mere-means claim really does the work people think it does.
