  2.  **Deconstruct the Philosophical Landscape:**
      *   *Standard Interpretation (Indirect Duties):* Kant explicitly says duties to animals are indirect duties to humanity (*Lectures on Ethics*, *Metaphysics of Morals*). Animals lack autonomy/rationality, so they aren't ends-in-themselves. Cruelty is wrong because it dulls our sympathy, making us worse toward humans.
      *   *The User's Objection:* The "Empirical Gap." If I kick a dog in secret and it *doesn't* dull my sympathy (maybe I'm a psychopath who loves dogs but hates people, or vice versa), does the indirect view permit it? Intuitively, no.
      *   *The "Direct Duty" Revisionist View:* Can we reinterpret Kant to allow direct duties without abandoning autonomy? Some scholars (Allen Wood, Christine Korsgaard, Tom Regan's critique turned inward) suggest ways to ground this.
      *   *Key Tension:* The Categorical Imperative (CI) applies to rational agents. Animals aren't rational agents. So how can they be direct recipients of duty?
      *   *Potential Solution:* Duty to *oneself* regarding animals, or a broader conception of "humanity" that includes our animal nature, or a contradiction in the will regarding the *value* of sentience.

  3.  **Outline the Essay:**
      *   **Title:** Needs to be punchy and relevant.
      *   **Introduction:** Set the scene (the argument), define the stakes (Indirect vs. Direct), and state the thesis (The Indirect view is textually accurate but philosophically unstable; a reconstructed Kantianism supports direct duties based on the value of sentience as a precondition for valuing).
      *   **Section 1: The Indirect Duty View (The Friend's Position).** Explain it charitably. It's not just "animals don't matter," it's about moral self-preservation. Acknowledge the textual support (*Lectures on Ethics*).
      *   **Section 2: The Empirical Gap (The User's Objection).** Drill down on the "no character effect" scenario. Show why this breaks the Indirect view. It makes morality contingent on empirical psychology, which Kant hates.
      *   **Section 3: The "Mere Means" Misunderstanding.** Address the prompt's request to dig deeper here. It's not just that we use them; it's that they lack *moral personality*. But does using them *violently* differ from using them *instrumentally*?
      *   **Section 4: Reconstructing Direct Duties (The Synthesis).** How to save Kant from himself.
          *   Argument A: The Contradiction in the Will regarding Sentience. If I value my own capacity to suffer, I must value suffering generally (Korsgaard-style).
          *   Argument B: Duties to Humanity *in* Our Person. Our animal nature is part of us. Violating the animal is violating the unity of the human being.
      *   **Conclusion:** Declare a winner. The Indirect view fails on internal Kantian grounds (universality/necessity). A revised Direct view is more consistent with the spirit of the CI.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with the fight. It's a classic philosophical dispute. Thesis: The friend is textually right but philosophically wrong. The user is right about the incoherence.
      *   *Indirect View:* Focus on the "dulling of sympathy." Kant worries cruelty hardens the heart. *Critique:* This makes morality empirical. Kant wants *a priori* laws. If morality depends on psychological cause-and-effect, it's hypothetical, not categorical.
      *   *The "Zero Effect" Counterexample:* This is the user's killer point. If I torture a dog and become *kinder* to humans (stress relief), does Indirect Kantianism say it's okay? Yes. That's absurd. This proves the Indirect view relies on contingent facts, not moral law.
