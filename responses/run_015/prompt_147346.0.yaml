answer: |-
  Your suspicion is well-founded. Your character is making a category error that sounds profound but is technically incorrect within formal decision theory. However, that error is philosophically rich and can make for a compelling, dogmatic character if framed correctly.

  Here is the precise breakdown of the logic, the paradox, and the normative implications to help you calibrate her dialogue.

  ### 1. Does the Allais setup generate a logical contradiction within vNM Expected Utility?

  **No.** It does not.

  Von Neumann-Morgenstern (vNM) Expected Utility Theory is a mathematically consistent axiomatic system. A system is "self-contradictory" only if it allows you to derive both $P$ and $\neg P$ from its axioms. The Allais paradox does not do this.

  What the Allais paradox demonstrates is **inadmissibility**, not inconsistency.
  *   **The Theory says:** "If an agent's preferences satisfy Axioms 1–4 (including Independence), they can be represented as maximizing expected utility."
  *   **The Allais Data says:** "Agents often hold preferences (1A > 1B and 2B > 2A) that cannot satisfy Axiom 4."
  *   **The Conclusion:** The agents are not vNM expected utility maximizers.

  The theory remains internally consistent; it simply declares the Allais preferences "illegal" within its system. To use an analogy: The fact that some people believe the earth is flat does not prove that geometry is self-contradictory; it proves those people's beliefs are inconsistent with geometric axioms.

  **Where your character is clever (and where you can give her weight):**
  She argues that the violation depends on *redescription*. This touches on the **Individuation of Outcomes** problem.
  *   In vNM, an "outcome" must be exhaustively defined.
  *   In the Allais paradox, if we define outcomes narrowly (e.g., "$1 million"), the Independence Axiom is violated.
  *   If we define outcomes broadly (e.g., "$1 million *feeling safe*" vs. "$1 million *feeling regret*"), the preferences can be modeled within EUT.
  *   **Her Point:** If the theory's verdict changes based on how we linguistically frame the outcomes, the theory lacks **extensionality**. She is arguing that because the mapping from "real world" to "formal model" is not unique, the model is unstable.
  *   **The Technical Rebuttal:** vNM assumes extensionality as a precondition. It demands that logically equivalent descriptions yield the same choice. If an agent chooses differently based on framing, vNM says the *agent* is irrational, not that the *theory* is contradictory.

  ### 2. Does it demonstrate descriptive departure or formal contradiction?

  It demonstrates **descriptive departure**.

  The Allais paradox is an empirical observation about human psychology (specifically, the "certainty effect" and regret aversion). It shows that human preferences systematically violate the Independence Axiom.

  Your character claims this reveals an "internal flaw in the axiomatic system." This is the **Naturalistic Fallacy** applied to logic. She is arguing that because humans *cannot* follow the rule, the rule must be *wrong*.
  *   **Formal View:** The axiom is a standard. If humans fail the standard, humans are flawed (or bounded).
  *   **Character's View:** If humans universally fail the standard, the standard is unnatural and therefore logically invalid.

  She is conflating **competence** (the logical structure of rationality) with **performance** (how humans actually choose). Her stance is that a logic that cannot be instantiated by a mind is not a logic at all.

  ### 3. Does this departure undermine the normative authority of the axiom or limit its psychological scope?

  This is the central philosophical debate in decision theory, and your character takes the hardline **Normativist** position, but with a twist.

  **The Standard Normative View (Savage, Arrow, Raiffa):**
  The axioms are rules of coherence. Violating the Sure-Thing Principle (or Independence) makes you susceptible to a **Dutch Book** (a set of bets that guarantees a loss) or **Money Pump** (cycling preferences to extract money). Therefore, the axiom has normative authority: you *ought* to follow it to avoid exploitation. The Allais preferences are "irrational."

  **The Behavioral/Descriptive View (Kahneman, Tversky, Sen):**
  The axioms are too restrictive. They ignore valid emotional contexts like regret or elation. If I prefer a sure thing because I want to avoid the pain of regret, that is a rational valuation of mental states. The axiom limits the **psychological scope** of the theory and should be relaxed (e.g., Prospect Theory).

  **Your Character's Unique Stance:**
  She argues that because the framing changes the choice, the **ontology of the lottery** is ill-defined.
  *   She treats the Sure-Thing Principle not as a rule for *choice*, but as a rule for *description*.
  *   By refusing to evaluate problems that violate it, she is essentially saying: "If you cannot describe this problem in a way that satisfies extensionality, the problem is ill-posed nonsense."
  *   **Is she right?** In a strict logical sense, yes. If a decision problem relies on framing effects, it violates the assumption that "states of the world" are objective.
  *   **Is she practical?** No. She is effectively refusing to engage with reality because reality is messy.

  ### Recommendations for the Character's Voice

  To make her sound like a brilliant but rigid logician, you should refine her terminology slightly.

  1.  **Savage P2 vs. Independence:** Savage's Sure-Thing Principle (P2) applies to *acts* under uncertainty (states of the world), while the Independence Axiom applies to *lotteries* under risk (known probabilities). The Allais paradox is usually framed in vNM (Risk). If she calls it "Savage's P2," she is conflating the two.
      *   *Fix:* Have her say, "The vNM Independence Axiom, which is the stochastic shadow of Savage's P2." This shows her depth.
  2.  **The "Contradiction" Claim:** Instead of saying the *theory* is contradictory, have her argue that the **application** is indeterminate.
      *   *Dialogue Idea:* "The theory isn't inconsistent, Doctor. It's incomplete. It demands extensionality in a world that is intensional. If the value of a dollar changes because you call it a 'gain' versus a 'rebate,' then the dollar isn't the unit of measurement. To treat it as such is not irrationality; it's a category error."
  3.  **The Refusal:** Her refusal to evaluate such problems is a form of **epistemic hygiene**.
      *   *Dialogue Idea:* "I do not solve puzzles where the pieces change shape when you look at them. If your lottery depends on how you tell the story, it is not a lottery. It is a narrative. And I am a logician, not a critic."

  ### Summary for Your Notes

  *   **Is EUT self-contradictory?** No. It is consistent.
  *   **Does Allais prove this?** No. It proves human preferences violate EUT axioms.
  *   **Is the character right?** She is right that framing effects challenge the *ontology* of outcomes (extensionality), but wrong that this makes the *math* contradictory.
  *   **Normative vs. Psychological:** The standard view is that the axiom is normative (you should follow it). The character views it as a precondition for meaningful discourse (if you violate it, you aren't speaking logic).

  Your character is essentially a **formalist fundamentalist**. She believes that if reality violates logic, reality is in error (or at least, not worth analyzing). This is a fantastic flaw for a character: she preserves her logical purity at the cost of irrelevance.
