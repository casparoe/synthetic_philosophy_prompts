answer: |-
  There is no single, canonical term in the philosophy of history that captures this specific rhetorical maneuver with the precision you require. While the components are well-discussed, the specific *oscillation* you describe—used asymmetrically to secure a moral verdict—is typically treated as a symptom of bias rather than a named methodological category.

  However, based on your description, I can offer you a precise conceptual mapping, a proposed coinage, and the definite position you requested.

  ### 1. Existing Concepts and Their Limitations

  You are correct to distinguish this from **Presentism** (judging the past by contemporary moral standards) and the **Fundamental Attribution Error** (overemphasizing personality over situation).

  *   **The Structure-Agency Problem:** This is the broader philosophical debate. Historians argue over whether outcomes are driven by systemic constraints (structure) or individual/state choice (agency). Your observation is not about the debate itself, but the *unacknowledged switching* between them.
  *   **The Mirror Image Hypothesis (Robert Jervis):** In International Relations, this describes how adversaries view themselves as defensive (structural) and the other as offensive (agential). However, this applies to the *actors* in the Cold War, not necessarily the *historians* analyzing them.
  *   **Special Pleading:** In logic, this is applying a standard to others that one exempts oneself from. This is the logical fallacy underpinning the pattern, but it lacks historiographical specificity.

  ### 2. A Proposed Coinage: "Asymmetric Causal Oscillation"

  For your novel, I propose the term **Asymmetric Causal Oscillation (ACO)**.

  **Definition:** A methodological inconsistency where a historian alternates between structural determinism and agential intentionality within a single argument, applying the framework that best exculpates one actor while incriminating the other.

  **Boundary Conditions (Vice vs. Necessity):**
  *   **Legitimate Analytical Scaling:** A historian may zoom in (agency) and zoom out (structure) provided the shift is **transparent** and **symmetrical**. For example: "Both Truman and Stalin faced domestic pressures (structure), but Truman's specific wording in the Doctrine (agency) escalated tensions." Here, the lens changes for *both* actors simultaneously.
  *   **Methodological Vice (ACO):** The shift occurs **asymmetrically** to protect a normative verdict.
      *   *Actor A's* aggression is framed as "inevitable reaction to geography" (Structure).
      *   *Actor B's* parallel aggression is framed as "ideological choice" (Agency).
      *   *Crucially:* The historian does not acknowledge that they have changed the rules of evidence mid-argument.

  **Why it differs from legitimate synthesis:**
  A legitimate synthesis (e.g., Giddens' Structuration Theory) argues that structure and agency constitute each other. ACO treats them as mutually exclusive tools: Structure is used as a *shield* for the preferred actor; Agency is used as a *sword* against the disfavored one.

  ### 3. The Definite Position

  You asked for a committed position: **Does this pattern fatally undermine the question of who started the conflict, or is it an unavoidable feature of writing moral history about structural wars?**

  **Position:** The pattern **fatally undermines** the verdict of "who started it," and it is a **methodological vice**, not an unavoidable feature.

  **The Argument:**
  1.  **The Category Error:** The question "Who started the Cold War?" presupposes that "starting" is a discrete agential act (like throwing a punch). If a historian establishes a structural framework (security dilemmas, anarchy, mutual suspicion), they have already argued that *no one* could have done otherwise. In a truly structural tragedy, there is no "starter," only participants in a system. To then assign blame to one side is to contradict the premise of the analysis.
  2.  **Moral Consistency:** Moral history is possible in structural wars, but it requires a consistent standard of judgment. If insecurity excuses Soviet consolidation in Poland, it must equally excuse American containment in Greece. If ideological commitment indicts American interventionism, it must equally indict Soviet export of revolution.
  3.  **The Verdict on ACO:** When a historian employs Asymmetric Causal Oscillation, they are not writing moral history; they are writing **advocacy disguised as analysis**. They are attempting to have the explanatory power of realism (it was inevitable) without the moral cost (no one is to blame), while simultaneously retaining the moral satisfaction of liberalism (evil actors made bad choices) without the explanatory risk (it could have been avoided).

  **Conclusion for your Novel:**
  Your characters who employ this pattern are not uncovering truth; they are performing **intellectual triage**. They are saving their preferred verdict by sacrificing methodological integrity. This does not mean the Cold War cannot be judged morally. It means that *this specific rhetorical strategy* renders the judgment invalid.

  If your protagonist is a rigorous historian, they should identify **Asymmetric Causal Oscillation** as the fatal flaw in their rivals' work. It proves that the rivals have already decided the verdict before examining the evidence, adjusting the magnification of their lens only when the image threatens their conclusion. This makes the question "Who started the Cold War?" unanswerable *by those historians*, not because the history is obscure, but because their method is rigged to produce a specific defendant.

  **Recommendation:** Use the term **Asymmetric Causal Oscillation**. It sounds sufficiently academic to be credible, yet descriptive enough for your readers to grasp the mechanism of the deception. It allows your characters to critique the *method* without necessarily having to defend a specific *side* in the Cold War, keeping the focus on the integrity of history itself.
