  3.  **Identify Fractures/Disanalogies:**
      *   *Intent/Agency:* Silent partners in law are still legal persons with rights/liabilities. Volcanoes are not.
      *   *Contract:* Partnerships imply consent or at least legal recognition. Nature imposes conditions regardless of consent.
      *   *Liability:* You can sue a silent partner (theoretically) or they share debt. You cannot hold Tambora liable for famine.
      *   *Withdrawal:* A partner chooses to withdraw. A volcano doesn't "choose" to stop erupting; it just follows geophysical processes.
      *   *Normative Import:* The analogy smuggles in legal/moral frameworks (shared responsibility) that don't exist.

