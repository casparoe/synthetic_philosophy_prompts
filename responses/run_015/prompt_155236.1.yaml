  2.  **Deconstruct the "Silent Partner" Analogy:**
      *   *Active Partner:* Human historical agents (peasants, politicians, Mary Shelley).
      *   *Silent Partner:* Non-human forces (Laki eruption, Tambora, pathogens).
      *   *Capital Contribution:* Environmental inputs (aerosols, pathogen loads, altered growing seasons).
      *   *Partnership Agreement:* The contingent intersection of human society and environment (no actual contract).
      *   *Dissolution Clause:* Catastrophe, collapse, death, end of a regime/venture.
