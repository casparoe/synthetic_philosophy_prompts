answer: |-
  Your gut instincts are tracking a distinction that political philosophers and economists have wrestled with for decades (most notably Elizabeth Anderson and Michael Sandel). You are sensing the boundary between **epistemic tools** (markets as truth-finders) and **moral authority** (governance as value-setting).

  There isn't a *single* word that solves this, but there is a **single two-part test** that sorts your cases consistently.

  ### The Principle: The Instrumental-Dignity Boundary

  **Rule:** You may delegate decisions to a prediction market only if:
  1.  **The Goal is Agreed Upon (Instrumental):** The market is selecting the *means* to achieve an end everyone already accepts (e.g., "increase revenue," "reduce traffic").
  2.  **No Rights or Dignity are Commodified (Non-Degrading):** The mechanism does not turn human beings, their liberties, or intimate relationships into financial assets.

  If a case fails either prong, the market must be advisory at best, or banned at worst.

  ---

  ### Running Your Cases Through the Test

  #### 1. Company Feature (Fine)
  *   **Goal:** Agreed (Maximize revenue).
  *   **Dignity:** None at stake (It's a button color).
  *   **Verdict:** **Pass.** This is pure instrumental uncertainty. The market is a better calculator than the CEO.

  #### 2. City Subway (Okay)
  *   **Goal:** Mostly Agreed (Reduce traffic/improve transit).
  *   **Dignity:** Low. Infrastructure is not a human right in the same way as bodily integrity.
  *   **Verdict:** **Pass.** However, this is "Okay" not "Fine" because public funds involve democratic legitimacy. A market can inform the engineering, but elected officials must still authorize the spend.

  #### 3. School Curriculum (Wrong)
  *   **Goal:** **Not Agreed.** Is the goal job readiness? Civic virtue? Critical thinking? Artistic expression?
  *   **Verdict:** **Fail Prong 1.** This is a *Normative* decision, not an *Empirical* one. A market can predict test scores, but it cannot determine what constitutes a "good education." Using a market here hides a value judgment behind a veil of "efficiency."

  #### 4. Family Vacation (Dystopian)
  *   **Goal:** Agreed (Have fun).
  *   **Dignity:** **Violated.**
  *   **Verdict:** **Fail Prong 2.** This fails the "Commodification" test. Family bonding relies on gift relationships and love. Introducing speculative profit into intimate decision-making degrades the relationship by making it transactional. It's "dystopian" because it colonizes the private sphere with market logic.

  #### 5. Government War (Uneasy)
  *   **Goal:** **Not Agreed.** "Expected utility is positive" is a utilitarian calculation, but war requires *just cause* (deontology).
  *   **Verdict:** **Fail Prong 1 & 2.** You cannot reduce sovereignty and justice to expected value. Furthermore, betting on war creates a class of people financially incentivized for conflict (a modern version of mercenarism). Your unease is not just risk aversion; it is the recognition that **legitimacy cannot be outsourced.**

  ---

  ### Addressing Your Specific Questions

  #### Does "Empirical vs. Value" save the Hospital verdict?
  **No.** This is the critical trap.
  ICU survival rates are *empirical*. A market might predict them more accurately than a doctor. If your principle were only "Empirical = Good," the hospital case would pass.
  It fails because of **Prong 2 (Dignity/Commodification).**
  *   **The Perverse Incentive:** If traders can profit on survival rates, do they profit when people die? If so, you have created a financial incentive for death.
  *   **The Trust Violation:** A patient must believe the doctor acts *only* for them. If the hospital is hedging its bets on the ICU market, the doctor-patient fiduciary duty is broken.
  *   **Conclusion:** You absolutely need the **extra clause about human dignity.** Empirical accuracy does not justify moral hazard.

  #### What about Criminal Sentencing?
  **This should be banned outright.**
  It fails both prongs, but most violently Prong 2.
  *   **Justice vs. Risk:** Criminal justice is (ideally) about *desert* (what did you do?), not *risk* (what might you do?). Sentencing based on market probabilities is preventive detention disguised as justice.
  *   **Due Process:** A defendant has a right to confront their accuser and argue their case. They cannot confront a market price.
  *   **Commodification:** Putting a price on liberty turns citizenship into a tradeable asset.
  *   **Verdict:** **Hard Ban.** This is the "nuclear option" of market governance. It turns the justice system into a risk management firm.

  ### The Unified Principle Statement

  If you need one sentence to write on a sticky note:

  > **"Markets may optimize the *means* of governance, but they must never define the *ends*, nor trade in *rights*."**

  *   **Company/Subway:** Optimizing means (Revenue/Traffic). $\rightarrow$ **Allowed.**
  *   **School/War:** Defining ends (Education/Justice). $\rightarrow$ **Forbidden.**
  *   **Hospital/Sentencing/Family:** Trading in rights/bodies/love. $\rightarrow$ **Forbidden.**

  Your intuition is correct: The hospital case isn't wrong because the data is noisy; it's wrong because **human beings are not liquidity.** The sentencing case isn't wrong because markets are inaccurate; it's wrong because **justice is not a prediction.**
