prompt: |-
  My brother-in-law and I have been going round in circles for months about my eight-year-old, who is really struggling with reading while his cousins picked it up more or less straight away. I went down a bit of a rabbit hole about heritability and I think I've got the basics: its a number about how much of the *differences between people* in some population tracks genetic differences, not a score for one individual kid, and a high number doesn't mean the trait can't be changed — I read that something like PKU is about as genetic as a condition gets and is still largely preventable by diet, which blew my mind. But every time I try to use any of this in an argument I get slapped down with the same line: genes load the gun, environment pulls the trigger. Around me it does about three different jobs. My brother-in-law uses it to say reading trouble is basically baked in and extra practise is a waste of time. Another dad in the group chat uses the exact same line to say it's obviously mostly how you're raised, so of course practise will fix it. And a psychology podcast I listen to used it to mean something like "it's always both, so stop asking how much is which", which felt more like a way of ending the conversation than answering anything.

  So I want to know what the line could actually be asserting, because clearly it's carrying three different arguments at once. Give me a menu of the precise claims it might be making, from the boring ones to the ambitious ones — the "every trait needs genes and environment" reading, the "genes fix a predisposition and environment decides whether it shows up" reading, the "genes set the range and environment picks where in the range you land" reading, the "genes are the real cause and environment is only a trigger" reading, and anything else in that neighbourhood you think people are smuggling in. For each, tell me whether it's a platitude, whether it's actually defensible in the way people who study this stuff talk, or whether it's just false. Then tell me which reading each of my three people was implicitly leaning on, and whether that reading really gets them their conclusion.

  Two more things I'd like folded in, because they're the bits I can't get straight on my own. First: I half-remember reading that a trait can be highly heritable and still be caused entirely by something environmental, if everyone in the population shares that cause — because then it isn't a difference between anybody, so it doesn't show up in the number. Is that right, and which of the readings on your menu does it break? Second: my own attempt at an improved line is "genes decide how wide the target is, the environment decides where the arrow lands" — but I've started worrying that it quietly assumes the width of the target is fixed, when better teaching or nutrition might change the width too, and that it also assumes the environment is something that just happens to you from outside, when a kid partly picks and creates their own environment partly because of how they already are. Tell me whether my version is any better, and if it isn't, what would be.

  Sections please, in this order: "The readings" (a numbered menu, roughly 400 words), "Verdicts" (platitude, defensible, or false for each, roughly 300), "Who meant which" (roughly 250), "What the line hides" (my two extra worries plus anything else in the same spirit, roughly 300), "A better line?" (roughly 100), "Bottom line" (roughly 100). British English throughout, and please don't assume I know any technical vocabulary — if you need a term like reaction norm or gene-environment correlation, explain it in passing the first time you use it.
