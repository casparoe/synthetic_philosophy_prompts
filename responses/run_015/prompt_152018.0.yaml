answer: |-
  You have identified a genuine and significant gap in the standard taxonomy of distributive justice. You are correct that neither "expensive tastes" nor standard "conversion factors" quite captures the specific normative problem you are describing.

  There is no single, canonical noun phrase (like "The Veil of Ignorance") that universally names this specific dynamic. However, your description maps precisely onto the intersection of three distinct debates in political philosophy and sociology. To give you the precision you want, I will locate your pattern within those debates, explain why the existing terms fall short, and then offer the most accurate terminology currently available, along with a proposed name for the specific problem you have isolated.

  ### 1. The Nearest Established Notions

  You are right to reject "expensive tastes." That debate (Dworkin, Cohen) turns on **responsibility**. If you cultivate a taste for champagne, luck egalitarians argue you should pay for it. Your case is about **unchosen incapacity** resulting from past injustice.

  You are also right that standard "conversion factors" (Sen, Nussbaum) are close but often static. Sen acknowledges personal, social, and environmental conversion factors, but the Capabilities Approach often treats them as parameters to be measured *now*, rather than as historical scars to be healed.

  Here are the three frameworks that actually grapple with your pattern:

  #### A. Roemer's "Circumstances" (Equality of Opportunity)
  John Roemer's framework is perhaps the best technical fit. He distinguishes between **effort** (for which you are responsible) and **circumstances** (for which you are not).
  *   **The Fit:** Roemer explicitly categorizes traits like "ability to benefit from education" as circumstances if they are determined by your background (e.g., parental income, neighborhood). If Person A converts resources poorly because of a bookless childhood, Roemer classifies this as a circumstance.
  *   **The Solution:** Justice requires equalizing outcomes *relative to type*. Person A should receive more resources than Person B to ensure that, given their different conversion rates, they have an equal opportunity to achieve functioning.
  *   **The Limit:** Roemer's model accepts the compensation requirement (giving more to the disadvantaged converter) but doesn't fully address your worry about the **feedback loop**. It treats the deficit as a static "type" to be compensated, rather than a dynamic injustice to be undone.

  #### B. Anderson's "Democratic Equality" (The Critique)
  Elizabeth Anderson's famous critique of luck egalitarianism addresses your worry about "locking in" injustice.
  *   **The Fit:** Anderson argues that if we focus on compensating individuals for their "deficits" (even unchosen ones), we treat them as defective vessels rather than equal citizens. She would argue that your "conversion gap" is not a personal handicap to be compensated with extra vouchers, but a **structural oppression** to be eliminated.
  *   **The Limit:** This is a critique of the *response*, not a name for the *phenomenon*. However, it validates your intuition that simply compensating the gap might reproduce the stigma of the earlier inequality.

  #### C. Bourdieu's "Habitus" (Sociological Mechanism)
  While not a normative theory of justice, Pierre Bourdieu provides the sociological name for the mechanism you describe.
  *   **The Fit:** **Habitus** refers to the embodied habits, skills, and expectations internalized from one's social environment. A person from a "bookless household" lacks the *cultural capital* to convert an educational voucher into success, not because they lack intelligence, but because their habitus does not align with the institution.
  *   **The Limit:** This describes *how* it happens, not *what justice requires* about it.

  ### 2. The Missing Name: "Endogenous Conversion Disadvantage"

  Since no single canonical term exists, the literature usually describes this as **"The Problem of Endogenous Preferences/Capacities"** or **"Historical Disadvantage in Conversion."**

  However, based on your precise definition, the most accurate label for this specific pattern is:

  **The Problem of Endogenous Conversion Factors**
  *(Or: The Reproduction of Disadvantage through Internalized Capacity Deficits)*

  **Definition:** A situation in which an agent's ability to convert resources into functionings is impaired not by brute biology or chosen preference, but by capacities and expectations internalized during a prior period of unjust deprivation, thereby causing current resource equality to reproduce past outcome inequality.

  **Why this fits:**
  1.  **Endogenous:** The deficit comes from *inside* the system of inequality (it was produced by the inequality you are trying to fix), not exogenous (like a congenital disability).
  2.  **Conversion:** It is about the *rate* of return on resources, not the resources themselves.
  3.  **Factor:** It treats the deficit as a variable in the justice equation, not a fixed trait.

  ### 3. Addressing Your Boundary Questions

  You asked two crucial questions about the boundaries of this concept.

  #### A. Where does a genuine conversion handicap shade into a mere expensive taste?
  The boundary lies in **Counterfactual Choice** and **Function vs. Preference**.

  1.  **Preference vs. Capacity:** An expensive taste is a preference ranking (I *want* champagne over beer). A conversion handicap is a production function (I *cannot* turn this voucher into health as efficiently as you). Even if the person *wants* to be healthy, they lack the know-how, confidence, or physiological baseline to achieve it.
  2.  **Responsibility/Choice:** The "expensive tastes" debate turns on whether the agent could have chosen otherwise.
      *   *Taste:* "I could have cultivated cheaper hobbies, but I chose this."
      *   *Endogenous Handicap:* "I could not have cultivated the capacity to convert resources efficiently because the environment required for that cultivation was unjustly withheld."
      *   **The Test:** If the deficit would disappear under conditions of fair background justice (e.g., if they had grown up with books), it is an **Endogenous Conversion Handicap**. If the deficit would persist even under fair background justice (e.g., they just really love opera), it is a **Taste**.

  #### B. Does the argument commit you to saying the same thing, in reverse, about someone who converts unusually well?
  **Yes.** This is the "Brute Luck" implication of Luck Egalitarianism.

  If Person B converts resources *better* because they were raised with confidence, books, and nutritional security (all unchosen brute luck), then strictly speaking, **that surplus is not morally theirs.**
  *   **The Implication:** A consistent luck egalitarian must tax away the "conversion surplus" generated by unchosen privilege just as they compensate for the "conversion deficit" generated by unchosen disadvantage.
  *   **The Problem:** This leads to what critics call the **"Slavery of the Talented"** (or in this case, the "Slavery of the Efficient"). If we constantly redistribute from high-converters to low-converters to equalize outcomes, we may reduce the total social product or violate the liberty of the high-converters.
  *   **The Resolution:** This is why many theorists (like Rawls) move away from equalizing *outcomes* (functionings) and toward equalizing *opportunities* or ensuring a *sufficient minimum*. Rawls's **Difference Principle** allows the high-converters to keep their surplus *only if* doing so ultimately benefits the low-converters (e.g., by incentivizing them to produce more resources that can be redistributed).

  ### 4. Summary Recommendation

  If you are writing on this, do not use "expensive tastes." Do not rely solely on "conversion factors" without qualification.

  1.  **Use the term:** **"Endogenous Conversion Disadvantage."**
  2.  **Cite the context:** Frame it as a critique of **static resourcism** (Rawls/Dworkin) and a complication for the **Capabilities Approach** (Sen/Nussbaum).
  3.  **Reference the specific tension:** Cite **John Roemer** (for the "circumstance" classification) and **Elizabeth Anderson** (for the critique that compensation reproduces stigma).
  4.  **Sociological grounding:** Mention **Bourdieu's Habitus** to explain the mechanism of how past inequality becomes present incapacity.

  You have correctly identified that most theories of justice take a "snapshot" of the present, whereas justice requires a "movie" of the past. Your pattern is the **temporal lag of injustice**, where the effects of unfairness outlast the unfairness itself, embedded in the people it damaged.
