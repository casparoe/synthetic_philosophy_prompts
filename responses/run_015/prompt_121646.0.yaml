answer: |-
  # Lesson Plan: The Rational Fool (40 Minutes)

  **Audience:** Novelists (no formal logic background).
  **Goal:** Demonstrate that a character can be locally rational at every step yet globally self-destructive due to preference structure, not memory or willpower.

  ## 1. Dependency Order: Start with Single-Choice Rationality (0–10 mins)
  **Decision:** Do **not** start with the loop. Start with the single morning bet.
  **Why:** If you show the loop first, the character looks stupid. If you show the single choice first, the character looks smart. The philosophical punch relies on the tension between "smart choice" and "bad outcome." You need them to agree with her decision *before* you show them the cost.

  *   **Activity:** Present a isolated scenario (e.g., "Would you trade a red ticket for a blue ticket if you prefer blue?").
  *   **Script Cue:** "At 8:00 AM, this trade makes perfect sense. She gains value. She is rational. Who here would make this trade?" (Get hands up).
  *   **Instructor Note:** Secure their agreement that the *moment* is rational. This inoculates against the "she's stupid" objection later.

  ## 2. The Carrying Example: Neutral Token Trade First, Character Second (10–25 mins)
  **Decision:** Do **not** use your amnesiac gambler character for the logic demonstration. Use a neutral abstract example first.
  **Why:** Fictional characters carry narrative baggage. If you use her immediately, the group will debate her backstory ("Why is she gambling?") rather than the logic. Also, her amnesia becomes a scapegoat too early.
  **Sequence:**
  1.  **The Abstract Pump (10–15 mins):** Use a simple "Ticket Trading" analogy (Ticket A → B → C → A minus fee). Prove the drain happens purely due to preference ordering (A > B, B > C, C > A).
  2.  **The Character Map (15–25 mins):** Once the logic is accepted, overlay it onto your novel. "Her morning bet is Ticket A. Her evening compromise is Ticket B."
  *   **Instructor Note:** This separates the *mechanism* (universal logic) from the *story* (specific application). It validates your plot as structurally sound, not just convenient.

  ## 3. Misconceptions & Timing (Integrated throughout)
  You will face two major objections. You must head them off at specific moments, or the lesson fails.

  **Misconception A: "She's just weak-willed."**
  *   **Where to head it off:** During **Segment 1 (Single-Choice)**.
  *   **How:** Explicitly state: "This isn't about impulse control. She isn't resisting a urge; she is actively pursuing a preference. At moment T1, she genuinely values Option B more than Option A. If you call this weakness, you call every rational choice weakness."
  *   **Why:** If you wait until the end, they will have already categorized her as an addict or a fool.

  **Misconception B: "Forgetting/Amnesia is the real problem."**
  *   **Where to head it off:** During **Segment 2 (The Character Map)**.
  *   **How:** Acknowledge the amnesia helps her *repeat* the cycle, but clarify it doesn't *cause* the loss. "Even if she remembered every loss, if her preferences remain cyclic (A > B > C > A), she will still lose money tomorrow. The amnesia hides the pain; the preference structure causes the bleed."
  *   **Why:** This is the core of *diachronnic* rationality. If they think memory is the fix, they miss the philosophical point about preference consistency over time.

  ## 4. The End Check: The "Non-Memory Fix" (35–40 mins)
  **Decision:** Do not ask "Did you understand?" Ask for a solution.
  **The Test:** Pose this question to the group: *"If you were editing this manuscript, and you couldn't change her memory or give her a diary, what one thing must you change to stop the money pump?"*
  **Pass Condition:** They must suggest altering her **preferences** (e.g., "She needs to value consistency over variety" or "She needs to rank A above C").
  **Fail Condition:** They suggest "She needs to remember the past" or "She needs more willpower."
  **Instructor Note:** If they fail the check, return to the Ticket Example. Show that remembering the loss doesn't stop the trade if the preference cycle remains intact.

  ## 5. What to Openly Refuse to Cover
  **Decision:** Draw a line on the whiteboard: **"No Formal Axioms."**
  **Specific Exclusions:**
  *   **The Dutch Book Theorem:** Do not write the formula. Do not prove why bookies exploit this.
  *   **Transitivity Proofs:** Do not discuss the mathematical property of transitivity (if A > B and B > C, then A > C) as a rule to be memorized.
  *   **Bayesian Updating:** Do not discuss how she should update probabilities based on past losses.
  **Script Cue:** "We are not doing math today. We are doing character architecture. The formal proofs exist, but they won't help you write the scene. We are focusing on the *behavioral shape*, not the algebra."
  **Why:** Formal logic will cause eyes to glaze over and shift the discussion from "character plausibility" to "technical accuracy." You want them to understand the *drama* of the flaw, not the *proof* of the flaw.

  ## Summary Timeline
  *   **00–05:** Intro & Hook (The puzzle of the smart loser).
  *   **05–10:** **Single-Choice Rationality** (Head off "Weak-willed" here).
  *   **10–20:** **The Abstract Loop** (Ticket Trading).
  *   **20–30:** **Character Application** (Head off "Memory" here).
  *   **30–35:** **Refusal Boundary** (Explicitly state what math you are skipping).
  *   **35–40:** **The Check** (The "Non-Memory Fix" test).
