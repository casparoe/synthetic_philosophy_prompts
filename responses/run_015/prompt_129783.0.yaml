  Assume the gas is balls of perfect steel,
  The pressure rises on its measured path.
  Though no attraction guides their silent wheel,
  Fulfilling thus the mathematic graph.
  Neglect the volume that the atoms take,
  And say they bounce without a loss of heat.
  Though nature does not such a silence make,
  The formula remains distinctly neat.

  Yet grant the premise lies against the fact,
  The result accords with what is clearly known.
  Though reality is thus abstractly acted,
  The predictive power stands distinctly shown.

  The test is not if assumptions hold as true,
  But if the model brings the data through.

