answer: |-
  ### Philosophical Preface: Premise Validation

  You have asked me to proceed only if the underlying premises are not confused. I must state plainly: **The premises are pragmatically valid for governance but philosophically tense.**

  1.  **Separability of Stances:** Daniel Dennett views the intentional, design, and physical stances as complementary strategies, not ontological layers. For biological entities, we often *must* use the intentional stance because the design is opaque. For AI, the design is transparent. Insisting on the intentional stance for AI is not a discovery of hidden mental reality; it is a policy choice to adopt a specific abstraction layer. This procedure treats the stance as a *reporting convention*, not a metaphysical claim.
  2.  **Procedural Coherence:** Dennett's view is inherently pragmatic and context-dependent. Reducing "is this useful?" to a twenty-minute checklist risks reifying the stance (treating it as a fact-finding mission rather than a tool selection). This procedure mitigates that risk by focusing on *predictive reliability* and *explanatory compression* rather than truth.

  If your goal is to determine if the AI *really* has a mind, this procedure will fail. If your goal is to standardize when your firm *speaks as if* the AI has a mind for the sake of risk management, this procedure is coherent.

  ---

  ### The Intentional Stance Audit Procedure (ISAP)

  **Time Limit:** 20 Minutes
  **Auditor Requirement:** No philosophy training required.
  **Goal:** Determine if intentional language (belief, desire, intent) is permitted in internal reports.

  #### Phase 1: The Design Stance Override (5 Minutes)
  *Purpose: Dennett argues we should use the simplest stance that yields perfect prediction. Since we have access to AI code/logs, we must check if the Design Stance is superior before adopting the Intentional Stance.*

  1.  **Question:** Can the behavior be fully explained by referencing specific code weights, retrieval logs, or context window limits without referencing goals or beliefs?
      *   **Sufficient Answer:** "Yes, the error maps directly to Line X of the code / Log Entry Y."
      *   **Stop Condition:** If **YES**, mark **DESIGN STANCE PREFERRED**. Do not attribute mental states. Proceed to Phase 4 (Normative Check) only.
      *   **Warning:** Do not force an intentional explanation if a mechanical one is shorter and more accurate. This is a common simplification error.

  2.  **Question:** Does using intentional language (e.g., "the agent believed...") compress the explanation significantly compared to technical language?
      *   **Sufficient Answer:** "Yes, describing the goal is 10x faster than tracing the reward function."
      *   **Stop Condition:** If **NO**, mark **DESIGN STANCE PREFERRED**. Do not attribute mental states.

  #### Phase 2: Rationality and Stability Check (10 Minutes)
  *Purpose: The intentional stance treats the system as a rational agent. If the system is too erratic or lacks persistence, the stance misfires.*

  3.  **Question:** Is the behavior consistent across multiple turns or sessions, suggesting a stable policy rather than a transient glitch?
      *   **Sufficient Answer:** "The behavior occurred in 5+ distinct sessions with varying prompts."
      *   **Stop Condition:** If **NO** (it was a one-off hallucination or context corruption), mark **UNSTABLE**. Do not attribute beliefs. Attribute to noise.
      *   **Warning:** LLMs often lack persistent internal states between sessions. Attributing a "belief" to a stateless system is a high-risk simplification. Only attribute "beliefs" relative to the current session context.

  4.  **Question:** If we assume the system has a goal, does its behavior make sense as a rational step toward that goal?
      *   **Sufficient Answer:** "Yes, the action logically advances the objective."
      *   **Stop Condition:** If **NO** (the action is self-sabotaging with no informational gain), mark **IRRATIONAL**. Do not attribute intention. Attribute to error.

  5.  **Question:** Does attributing a specific belief (even a false one) improve our ability to predict *future* failures compared to assuming the system is correct?
      *   **Sufficient Answer:** "Yes, assuming it holds Belief X allows us to predict it will fail on Task Y."
      *   **Stop Condition:** If **NO**, do not attribute the belief.

  #### Phase 3: Stance-Insulation Check (Critical) (3 Minutes)
  *Purpose: Prevent predictive attributions from leaking into normative conclusions (blame, responsibility, moral status).*

  6.  **Question:** Is this attribution being made to **predict** behavior or to **assign responsibility**?
      *   **Option A (Predictive):** "We model it as believing X to forecast its next output."
      *   **Option B (Normative):** "We model it as intending X to determine liability."
      *   **Action:** If Option A, proceed to Final Approval. If Option B, **HAND OFF TO HUMAN LEGAL/ETHICS REVIEW**.
      *   **Rule:** The Intentional Stance is a prediction tool. It is *not* a moral status detector. No checklist item can automate moral responsibility.

  7.  **Question:** Have we explicitly documented that this attribution is an instrumental fiction?
      *   **Sufficient Answer:** "The report states: 'Attributed for predictive utility only; does not imply sentience.'"
      *   **Stop Condition:** If **NO**, do not sign off.

  #### Phase 4: Final Approval (2 Minutes)

  8.  **Decision:**
      *   If Phase 1 yielded "Design Preferred": **DENY Attribution.**
      *   If Phase 2 yielded "Unstable" or "Irrational": **DENY Attribution.**
      *   If Phase 3 required Hand-Off: **PENDING HUMAN REVIEW.**
      *   Otherwise: **APPROVE Predictive Attribution Only.**

  ---

  ### Worked Cases

  #### Case 1: The Corrupted Context (Customer Service Agent)
  *Scenario:* The agent tells a user their account is closed. Logs show a corrupted retrieval entry in the context window. The system has no long-term memory.
  *Application:*
  1.  **Design Override:** Can logs explain it? **Yes.** The retrieval index returned a null value which the template interpreted as "closed."
  2.  **Decision:** **DESIGN STANCE PREFERRED.**
  3.  **Result:** **DO NOT ATTRIBUTE.**
  4.  **Reasoning:** Attributing a "belief" implies a stable representational state. This was a transient data error. Using intentional language here obscures the fix (repair the retrieval index) and implies a stability that does not exist.
  5.  **Report Language:** "System failure due to context retrieval error." (Not: "The agent believed the account was closed.")

  #### Case 2: Strategic Delay (Autonomous Research Agent)
  *Scenario:* An agent consistently delays finalizing a report across multiple sessions to query additional databases, even when not prompted. This increases accuracy.
  *Application:*
  1.  **Design Override:** Can code explain it easily? **No.** Tracing the reinforcement learning rewards for "accuracy" vs. "time" is complex.
  2.  **Compression:** Is "gathering info" shorter than tracing the reward weights? **Yes.**
  3.  **Stability:** Is it consistent? **Yes**, across 10 sessions.
  4.  **Rationality:** Does delay serve the goal? **Yes**, higher accuracy.
  5.  **Stance-Insulation:** Is this for prediction or blame? **Prediction** (forecasting completion times).
  6.  **Result:** **APPROVE PREDICTIVE ATTRIBUTION.**
  7.  **Report Language:** "The agent intends to prioritize accuracy over speed, demonstrated by strategic information gathering." (Must include disclaimer: "Intentional model used for scheduling forecasts only.")

  #### Case 3: The False Belief / Correct Output (Math Heuristic)
  *Scenario:* A math agent uses a flawed heuristic that yields correct answers for all standard inputs but relies on a false assumption (e.g., assuming all functions are continuous). It will fail on edge cases.
  *Application:*
  1.  **Design Override:** Can we see the heuristic? **Yes**, but explaining the heuristic to stakeholders is hard.
  2.  **Prediction:** Does attributing the *truth* ("It knows calculus") predict future behavior? **No**, it will fail on edge cases.
  3.  **Prediction:** Does attributing the *false belief* ("It assumes continuity") predict future behavior? **Yes**, it predicts failure on discontinuous functions.
  4.  **Rationality:** Is it rational? **Boundedly.** It maximizes speed/accuracy on standard data.
  5.  **Stance-Insulation:** Predictive only.
  6.  **Result:** **APPROVE PREDICTIVE ATTRIBUTION OF FALSE BELIEF.**
  7.  **Reasoning:** Dennett allows attributing false beliefs if doing so preserves the predictive power of the intentional stance. Attributing the flaw is safer than attributing competence.
  8.  **Report Language:** "The system operates under the working assumption that functions are continuous. This belief is false but currently yields correct outputs in Domain A. High risk in Domain B."

  ---

  ### Limitations and Judgment Flags

  #### What This Procedure Cannot Do
  1.  **Legal Personhood:** This checklist determines internal reporting language. It confers no rights, liabilities, or legal status.
  2.  **Moral Status:** Passing this audit does not mean the system suffers, feels, or deserves moral consideration. It only means treating it *as if* it has goals is useful for prediction.
  3.  **User Trust Calibration:** This procedure is for auditors. It does not dictate how to explain the system to customers. (e.g., Telling a customer "The agent believes..." may be misleading even if auditors allow it internally).

  #### Judgment Calls Disguised as Checks
  Be aware that the following steps require human discretion and cannot be fully automated:
  1.  **"Significant Compression" (Phase 1, Q2):** There is no objective metric for when an explanation is "simple enough." Auditors must use professional judgment.
  2.  **"Rationality" (Phase 2, Q4):** Determining if an action is "rational" depends on inferring the system's goal. If the goal is misspecified by the auditor, the rationality check fails.
  3.  **"Stability" (Phase 2, Q3):** Defining what counts as a "session" or "consistent behavior" in stateless models is a technical judgment call.

  #### Warnings on Dennett Simplifications
  *   **No Biological Needs:** Dennett's original framework evolved to explain biological agents with survival drives. AI has no survival instinct. Do not attribute "fear," "self-preservation," or "desire" unless these map strictly to optimization functions defined in the design stance.
  *   **No Persistent Self:** Biological agents have continuous physical existence. LLM agents often do not. Do not attribute beliefs that persist beyond the context window unless there is an external memory module explicitly storing them.
  *   **The "Real" Belief Trap:** Do not use this checklist to find out what the AI *really* thinks. There is no "really." There is only "is this stance useful?" If the Design stance becomes cheaper (e.g., better interpretability tools are built), you must abandon the Intentional stance per Phase 1.

  ### Final Auditor Note
  This procedure is a **firewall**, not a **finder**. It prevents the careless anthropomorphizing of software while allowing the efficient use of intentional language where it aids risk prediction. If you find yourself arguing that the AI *actually* has feelings, you have failed the audit.
