  **Popperian: 0.75**
  Internal simulation is the only mechanism capable of safely mapping the lethal, volatile landscape within a lifetime, allowing agents to verify actions before committing to them.

  **Gregorian: 0.20**
  Social observation prunes the hypothesis space for simulation by highlighting viable candidates, though the "recipe-only" constraint limits the depth of transferable understanding.

  ***

