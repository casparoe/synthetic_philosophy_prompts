answer: |-
  ### Brainstorming: Institutional Practices of "Collapse"

  Before constructing the ontological analysis, I enumerate the concrete institutional mechanisms that encode the "collapse" narrative for the Bronze Age Eastern Mediterranean, the Classic Maya lowlands, and Rapa Nui.

  1.  **Museum Periodization and Labeling:**
      *   Timeline walls in major institutions (e.g., British Museum, MET) mark sharp termination dates (e.g., "1200 BCE," "900 CE") labeled as "End," "Fall," or "Collapse," often visually distinguished by a color shift or a gap, implying ontological cessation.
      *   Gallery titles such as "The Mystery of the Maya" or "The Late Bronze Age Crisis" frame the historical trajectory as a problem to be solved (why did they die?) rather than a transition to be understood (how did they change?).
      *   Artifact placards date objects to "Post-Palatial" or "Post-Classic" periods, linguistically positioning subsequent material culture as residual or degenerate relative to the "Palatial" or "Classic" essence.

  2.  **UNESCO World Heritage Descriptions:**
      *   Site nomination dossiers frequently emphasize the "outstanding universal value" of the monumental peak (e.g., Tikal temples, Moai statues) while minimizing or omitting description of subsequent occupation layers.
      *   Statements of significance often utilize vocabulary of "loss," "abandonment," and "disappearance," framing the site as a tomb of a dead civilization rather than a landscape of continuous habitation.
      *   Conservation management plans prioritize the stabilization of monumental architecture from the "peak" period, often physically removing or neglecting later, smaller-scale domestic structures that overlie or surround them.

  3.  **Textbook Chapter Headings and Curricula:**
      *   Standard historical surveys utilize chapter titles like "The Collapse of the Bronze Age" or "The Fall of the Classic Maya," structuring student cognition around discontinuity.
      *   Graphs in educational materials depict population estimates or energy capture metrics plummeting, labeled as "Societal Failure," without correlating data on biological continuity or linguistic persistence.
      *   Assessment questions often ask students to identify "causes of collapse" (e.g., drought, invasion), presupposing the collapse event as a factual premise rather than a interpretive category.

  4.  **Archaeological Site Management and Funding:**
      *   Grant proposals frequently justify excavation based on the "threat to a vanishing heritage," implicitly validating the narrative that the culture is gone and must be rescued from oblivion.
      *   Site interpretation signage focuses on the construction and use of monuments by elites, with little information on how common people lived after the elite structure dissolved.
      *   Tourism marketing leverages the "lost civilization" trope, economically incentivizing the presentation of the site as a place of death rather than transformation.

  ***

  ### Ontological Analysis of the "Collapse" Label

  The institutional practices listed above do not merely describe empirical data; they enact a specific metaphysics of collective identity. To label the cessation of monumental construction or centralized administration in the Eastern Mediterranean, Maya lowlands, or Rapa Nui as "collapse" rather than "reorganization" presupposes a **Substantialist View** of society.

  **The Substantialist Commitment**
  In this framework, a society is treated as a substance-like entity with an essential identity. For the Bronze Age Eastern Mediterranean, the "essence" is the Palace; for the Classic Maya, it is the Divine Kingship and the Long Count calendar; for Rapa Nui, it is the *ahu* construction and clan competition manifest in statuary. Under substantialism, if the essential trait is removed, the entity ceases to exist. Therefore, when the palaces burned or the statues were toppled, the society *died*, even if the biological population speaking the same language remained in the same valley. This metaphysics licenses the sharp periodization seen in museums: the entity existed, then it did not.

  **The Functionalist Alternative**
  A Functionalist View treats society as a system of interlocking roles and processes. Here, "collapse" signifies a systemic failure where critical functions (redistribution, defense, ritual coordination) are no longer performed by specific institutions. This view can coherently justify the "collapse" designation without claiming the people vanished. It argues that the *system* died. However, this reading struggles when faced with evidence that functions were not lost but redistributed. In the Post-Classic Maya, trade networks persisted; in Post-Palatial Greece, religious rituals continued in simplified forms. If the function (e.g., social cohesion) is maintained through different means (e.g., kinship rather than bureaucracy), the Functionalist label of "collapse" becomes contradictory unless one arbitrarily privileges specific *forms* of function (centralization) over others.

  **The Relational-Processual View**
  A Relational-Processual View denies societies have essences or fixed functional boundaries. Societies are dynamic networks of human and non-human relations. From this vantage, "collapse" is merely a description of a specific topological change in the network (e.g., decreased connectivity, reduced hierarchy). It does not imply death or failure, only transformation.

  **Evidence Against the Substantialist Reading**
  The archaeological record for all three cases undermines the substantialist reading.
  *   **Eastern Mediterranean:** While palaces vanished, village architecture, pottery styles, and language (Greek) show continuity. The "substance" of daily life persisted.
  *   **Classic Maya:** The "collapse" is confined to the southern lowlands. Northern cities flourished, and highland communities persisted. The "Maya" substance did not die; a specific political configuration did.
  *   **Rapa Nui:** Statuary production ceased, but the Rapa Nui people survived contact, adapted to new economic conditions, and maintained kinship structures. The "ecocide" narrative assumes the statue-building was the essence of Rapa Nui identity, which ethnohistorical evidence contradicts.

  In all three instances, monumental construction ceased while village life continued. If the society were a substance defined by its people and culture, it did not collapse. If the society is defined substantially by its *monuments*, the label holds, but this reifies architecture over human agency. Thus, the substantialist reading requires ignoring the continuity of the human substrate to maintain the coherence of the "death of society" claim.

  ### Presupposition vs. Accommodation in Heritage Labeling

  We must distinguish strictly what the heritage-labeling practice *presupposes* from what it merely *accommodates*.

  **Presupposition:**
  The practice presupposes a **Substantialist Metaphysics of the State**. It assumes that the centralized political apparatus is not merely a feature of the society but its ontological core. Without this presupposition, the discontinuation of that apparatus cannot be labeled "collapse" without significant qualification. The label "collapse" carries a connotation of terminal failure that is incoherent if the society is viewed as a fluid network that simply reconfigured. Therefore, the institutional practice *presupposes* that political centralization is the *sine qua non* of societal existence.

  **Accommodation:**
  The practice *accommodates* a Relational Ontology only superficially, often creating cognitive dissonance. A museum might display "Post-Collapse" pottery, implicitly acknowledging continuity. However, this is an accommodation of data, not an ontological shift. The relational view could license the word "collapse" only if it were rigorously defined as "network contraction" rather than "entity death." However, current heritage usage relies on the emotional and narrative weight of "death" and "mystery." A strict relational ontology would force a wholesale abandonment of the failure-versus-change distinction because, ontologically, a network reconfiguration is neither a failure nor a success; it is simply a different state. To maintain the "failure" distinction within a relational ontology requires importing normative criteria external to the ontology itself.

  ### Concrete Revisions for a Relational-Functional Framework

  If institutions adopted a Relational-Functional view—where societies are seen as adaptive networks performing functions without essential identities—curatorial, pedagogical, and conservation priorities would require specific revisions:

  1.  **Curatorial Framing:**
      *   **Terminology:** Replace "Collapse," "Fall," and "End" with "Transformation," "Reconfiguration," and "Transition." Period labels should shift from "Post-Palatial" (implying absence) to "Early Iron Age" or "Late Classic" (implying temporal continuity).
      *   **Display Strategy:** Exhibit "decline" layer artifacts with the same aesthetic prominence as "peak" layer artifacts. Avoid placing the most visually impressive items exclusively in the "Golden Age" section while relegating smaller, domestic items to "twilight" cases.
      *   **Narrative:** Shift the explanatory focus from "Why did they fail?" to "How did they adapt?" Highlight resilience strategies, such as the shift to household-based production in Greece or the agricultural intensification in the Maya highlands.

  2.  **Pedagogical Narrative:**
      *   **Causality:** Teach multi-causal adaptation rather than singular catastrophic failure. Instead of asking students to solve the "mystery" of disappearance, ask them to map the changes in trade routes or kinship ties.
      *   **Continuity:** Emphasize linguistic and genetic continuity. Explicitly teach that the "fallen" civilization is often the ancestor of living populations, dismantling the "lost tribe" mythos.
      *   **Value Judgments:** Discuss the bias inherent in calling decentralization a "collapse." Engage students in debating whether a society without kings is "less" of a society.

  3.  **Conservation Funding Priorities:**
      *   **Excavation:** Allocate funds specifically for investigating "decline" phases and later occupation layers, which are currently under-excavated due to a bias toward monumental strata.
      *   **Site Protection:** Extend protection to non-monumental features, such as terracing systems, village foundations, and water management infrastructure that sustained populations after political centralization ended.
      *   **Community Engagement:** Prioritize the heritage claims of descendant communities. If the society did not "die," then living communities have a stronger claim to stewardship than if the site is merely a tomb of a dead culture. Funding should support living heritage practices alongside ruin conservation.

  ### The Irreducible Normative Feature

  There is one normative feature of the "collapse" concept that the institutional practice cannot reproduce without the substantialist metaphysics, and which scholars must therefore supply explicitly if they abandon that metaphysics.

  That feature is the **Teleological Assumption of Complexity**.

  The substantialist view implicitly posits that the "Peak" form of the society (the Palace, the City, the Statue) was the "True" or "Healthy" state of that entity. Growth and integration are treated as the natural lifecycle of the societal substance, and stagnation or fragmentation is treated as pathology or death. This is an ontological claim in the substantialist framework: the society *is* its complexity.

  If one adopts a relational or functional view, there is no ontological basis for claiming that a decentralized network is "failed" or "collapsed." A network of small villages is just as ontologically robust as a network centered on a capital. Therefore, the judgment that the transition from centralization to decentralization constitutes a "collapse" (a negative value judgment) cannot be inherited from the framing of the society itself.

  Scholars and facilitators must explicitly supply the normative premise that **large-scale political integration is inherently preferable to local continuity.** They must state: "We are calling this a collapse because we value state-level organization over household-level resilience." Without the substantialist metaphysics that equates the State with the Society, the label "collapse" becomes a purely political opinion rather than a descriptive historical category. If institutions wish to retain the dramatic power of the "collapse" narrative while adopting a rigorous relational ontology, they must openly acknowledge that they are measuring history against a specific, contested standard of political success, rather than describing an ontological cessation of being.
