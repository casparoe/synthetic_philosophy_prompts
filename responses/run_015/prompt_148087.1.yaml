answer: |-
  # Specification for a Normative Theory of Post-Defeat Tribunal Legitimacy

  ## I. Desiderata: Phenomena, Cases, and Consistency Conditions

  A sufficient normative theory must adjudicate the legitimacy of the International Military Tribunal (IMT) and the International Military Tribunal for the Far East (IMTFE) by satisfying the following five conditions. Each is derived from a structural necessity of legal legitimacy rather than partisan preference.

  ### 1. The Ex Post Facto Justification Condition (Addressing Desideratum i)
  **Requirement:** The theory must provide a juridical basis for the validity of retroactive criminalization regarding "Crimes Against Peace" and "Crimes Against Humanity." It cannot simply assert that the crimes were "obviously" wrong; it must explain the *source* of the binding norm prior to 1945.
  **Reason for Requirement:** If the theory relies solely on moral intuition, it collapses into natural law without institutional constraints, rendering the *rule of law* indistinguishable from moral judgment. If it relies solely on positive law, it fails because no explicit statutory prohibition existed. A legitimate theory must bridge this gap to explain why the defendants had *fair warning* or why warning was unnecessary.

  ### 2. The Asymmetry of Jurisdiction Condition (Addressing Desideratum ii)
  **Requirement:** The theory must justify the exclusion of Allied conduct (strategic bombing, atomic weapons) from the tribunals' jurisdiction without reducing the proceedings to "victors' justice" (revenge disguised as law). It must distinguish between *structural bias* (inevitable in post-defeat scenarios) and *illegitimate bias* (corrupting the judicial function).
  **Reason for Requirement:** Legitimacy requires the appearance and reality of impartiality. If the theory cannot explain why the victors were immune without appealing to "might makes right," the tribunal is merely a political purge. The justification must rest on jurisdictional limits, evidentiary standards, or distinct legal categories, not merely power differentials.

  ### 3. The Agency and Liability Granularity Condition (Addressing Desideratum iii)
  **Requirement:** The theory must distinguish between collective national guilt and individual criminal responsibility. It must account for the divergence between Nuremberg's "criminal organization" declarations and Tokyo's focus on cabinet-level conspiracy/omission, validating one or both without imputing guilt by association.
  **Reason for Requirement:** Punishing individuals for state acts is the core innovation of international criminal law. If the theory allows guilt to attach to membership alone (collective guilt), it violates fundamental justice. If it requires direct physical perpetration only, it fails to capture leadership crimes. The theory must define the *nexus* between state policy and individual intent.

  ### 4. The Defense Rejection Coherence Condition (Addressing Desideratum iv)
  **Requirement:** The theory must explain the rejection of *tu quoque* defenses (e.g., "Allies bombed civilians," "Western powers were colonialists") as a matter of legal principle rather than procedural convenience.
  **Reason for Requirement:** If the rejection is ad hoc, it confirms the "victors' justice" thesis. If it is principled, it must identify why the defendant's claim fails legally (e.g., relevance to the charge, lack of standing, or distinct legal categories) rather than morally (e.g., "they were worse").

  ### 5. The Legality Principle Reconciliation Condition (Addressing Desideratum v)
  **Requirement:** The theory must either demonstrate consistency with *nullum crimen sine lege* (no crime without law) through a defensible interpretation of pre-1945 law (customary, treaty, or general principles) or provide a precise normative justification for why this principle was overridden (e.g., higher-order natural law, necessity).
  **Reason for Requirement:** *Nullum crimen* is the bedrock of liberal legality. Ignoring it renders the tribunal an arbitrary exercise of power. Overriding it requires a higher-order justification that does not destroy the rule of law for future cases.

  ---

  ## II. Stress-Test Case: The Neutral Propagandist (1950)

  **Scenario:** In 1950, a new tribunal is convened to try the leaders of State Z. State Z was formally neutral during WWII, never ratified the Kellogg-Briand Pact (1928), and never signed the London Charter (1945). However, State Z's regime systematically incorporated the *language* of "aggressive war" and "crimes against humanity" from these instruments into its own domestic constitutional propaganda to legitimize its rule, before launching an aggressive war of conquest in 1948.

  **Diagnostic Question:** Must the theory permit prosecution?

  **Theoretical Revelation:**
  *   **If the Theory Permits Prosecution:** The foundation is **Moral-Universalist** or **Estoppel-Based**. It argues that the leaders are bound by the moral truth of the norms they invoked, or that by using the language domestically, they are estopped from denying its validity (*venire contra factum proprium*). This prioritizes substantive justice over strict consent.
  *   **If the Theory Forbids Prosecution:** The foundation is **Treaty-Positivist**. Without ratification or customary crystallization *at the time of the act*, there is no binding law. This prioritizes sovereignty and predictability over substantive justice.
  *   **If the Theory Permits Prosecution based on Custom:** The foundation is **Customary-Law**. It argues that by 1950 (or retroactively to 1948), the norms had crystallized into *jus cogens* binding all states regardless of ratification.

  **Specification Mandate:** A robust theory must explicitly resolve this case. If it hedges, it lacks ontological clarity regarding the source of international obligation.

  ---

  ## III. Classification of Desiderata: Non-Negotiable vs. Negotiable

  ### Non-Negotiable Requirements (Structural Integrity)
  1.  **Agency and Liability Granularity (Desideratum 3):** Any theory that permits collective guilt (punishing individuals solely for national affiliation) is morally inadmissible. This is a hard constraint.
  2.  **Legality Principle Reconciliation (Desideratum 5):** A theory that openly advocates for arbitrary punishment without legal basis ceases to be a theory of *justice* and becomes a theory of *force*. It must address *nullum crimen*.
  3.  **Defense Rejection Coherence (Desideratum 4):** Incoherent rejection of defenses proves bias. A legitimate tribunal must apply rules consistently, even if the rules limit the defense.

  ### Negotiable Preferences (Camp-Specific)
  1.  **Ex Post Facto Justification (Desideratum 1):** *Strict Positivists* will demand evidence of customary law; *Natural Lawyers* will accept moral universality. The *outcome* (legitimacy) might be the same, but the *reasoning* is a camp preference.
  2.  **Asymmetry of Jurisdiction (Desideratum 2):** *Realists* accept asymmetry as inevitable politics; *Idealists* demand symmetrical jurisdiction. A theory can deem the tribunals legitimate *despite* asymmetry (necessity) or *because* asymmetry was legally constrained (jurisdictional mandate).
  3.  **Specific Mode of Liability (Desideratum 3):** Whether "criminal organizations" (Nuremberg) or "cabinet conspiracy" (Tokyo) is the superior vehicle is negotiable, provided individual intent is preserved.

  ### Joint Unsatisfiability (The Central Result)
  **The Nuremberg Paradox:** There is a jointly unsatisfiable subset between **Desideratum 1 (Ex Post Facto Justification)** and **Desideratum 5 (Legality Principle Reconciliation)** under a **Strict Positivist** framework.
  *   If you strictly enforce *nullum crimen sine lege* (Desideratum 5) as understood in 1945 positivism, you cannot legitimate the retroactive prosecution of Crimes Against Peace (Desideratum 1), as no positive law criminalized aggression for individuals.
  *   If you legitimate the prosecution (Desideratum 1), you must stretch or override *nullum crimen* (Desideratum 5).
  *   **Result:** A theory cannot satisfy both strictly without redefining the nature of "law" itself (e.g., incorporating natural law into positivism). This unsatisfiability is the central tension of international criminal law.

  ---

  ## IV. Impact Assessment on Existing Accounts

  ### The Most Damaging Requirement
  **Desideratum 5 (Legality Principle Reconciliation)** does the most damage to the most popular existing accounts.
  *   It forces **Strict Positivists** to admit the tribunals were technically illegal *ex ante*, undermining their legitimacy.
  *   It forces **Natural Law Theorists** to explain why moral wrongs translate to *criminal* liability without prior statutory notice, undermining legal certainty.
  *   It forces **Hybrid Institutionalists** to explain why the institutional process validates the substantive legal gap, risking the accusation that "process washes out sin."

  ### Brief Evaluation of Accounts

  1.  **Strict-Positivist View:**
      *   *Fares Poorly on Desideratum 1 & 5.* It must conclude the tribunals were *ex post facto* vengeance, as no positive international law criminalized individual aggression in 1939-1945. It fails the stress-test (Neutral Propagandist) by requiring acquittal, which feels morally insufficient.
      *   *Strength:* High consistency on Desideratum 5 (if it rejects the tribunals).

  2.  **Natural-Law View:**
      *   *Fares Well on Desideratum 1 & 5 (via override).* It validates the tribunals because the acts were *mala in se*.
      *   *Fares Poorly on Desideratum 2 (Asymmetry).* If the law is universal moral law, why were Allied bombers not tried? It struggles to explain jurisdictional selectivity without appearing hypocritical.
      *   *Strength:* High moral coherence; Low institutional predictability.

  3.  **Hybrid Institutionalist View (e.g., Rule of Law + Historical Necessity):**
      *   *Fares Best Overall, but with Strain.* It argues *nullum crimen* was satisfied by customary evolution (Kellogg-Briand + state practice) and that asymmetry was a jurisdictional limit, not a moral exemption.
      *   *Fares Poorly on the Stress-Test.* It struggles with the Neutral Propagandist: if custom didn't bind them, and treaties weren't signed, the "institutional" link is weak unless "estoppel" is added as a new normative layer.
      *   *Strength:* Best attempts to satisfy the Non-Negotiables simultaneously, though it risks obscuring the "Nuremberg Paradox" rather than solving it.
