prompt: |-
  I've been reading rationalist blogs and forums for something like fifteen years, and for the last four I've convened a small, semi-anonymous discussion group — eight or nine of us, mostly engineers, two physicians, one game designer — that meets monthly to take apart a single live disagreement rather than to work through a syllabus. Last month's got away from us and I want to hand it to you in a more precise form than we managed. We have a standing norm that everyone reads the host's paper and sends written comments before the meeting. One member, R., didn't comment on M.'s paper. M. — who has, by common consent, the worst commenting record in the group — sent a long message to the group chat about it. R. replied that M. of all people had no standing to say it. M. replied that this was textbook tu quoque and that her own record has no bearing on whether R. breached the norm. A third member, S., said the tu quoque framing was the category error and that R. was closer to right: standing is a legal notion, locus standi, and the whole point of standing doctrine is that a party can be right on the merits and still not be the party entitled to press the claim in that forum, because standing isn't about what the defendant did but about who may invoke the tribunal's power. A fourth member said the courtroom was simply the wrong source domain: blame is not an institutional act, there is no judge to dismiss the suit, and talk of standing is just a polite dialect for telling someone to shut up. Halfway through the evening we also noticed something that seemed to cut against R.: on the legal test M. is the injured party, and the injured party normally has the best standing of anyone in the room, which is not at all the conclusion R. wanted. R. then amended his case by appeal to the clean-hands maxim instead, so that what is withheld from M. is not the hearing but the remedy.

  What I want from you is an audit of the analogy rather than a verdict on the etiquette, and I'd rather you argued it than pointed me at a literature — we have no library access and I don't want a reading list. Please do the courtroom mapping explicitly, as a table: who is the plaintiff, the defendant, the tribunal, the injury, the remedy, the motion to dismiss, the appeal; and then, for R.'s amended version, what clean hands maps onto and whether the thing being denied is the claim, the remedy, the hearing, or the uptake. Then tell me which features of a court the analogy quietly imports into ordinary blame that blame doesn't have — a third party with authority to rule on standing, a binary rather than graded entitlement, a scarce institutional good being allocated, blame as something done to a defendant rather than said to an addressee or overheard by an audience — and sort the disanalogies into the ones that matter for the work R. wants the analogy to do and the ones that don't. I especially want to know whether the conclusion R. is using it for (that he may properly answer the criticism by pointing at the critic, without ever addressing whether he skipped the reading) survives once the disanalogies are on the table, or whether the analogy was doing all the work and collapses into either you may not raise this or merely I don't have to listen to you from her.

  Two more things, if you'll indulge them. First, one member proposed swapping the courtroom for the Austin-style speech-act picture: hypocritical blame is not false but infelicitous, a misfire or an abuse rather than an error — a void utterance, like a sentence pronounced by someone with no authority to pronounce it — so that the hypocrite's criticism says something true while failing to come off. Give me that mapping too, and tell me whether it carries R.'s conclusion any better than the legal one does, or whether it just relocates the same problem: if there is no institution, there is no one with the standing to declare the utterance void, and hearers will update on its content anyway. Second, mostly to be contrary, I floated a different model and I'd like it stress-tested rather than indulged: treat standing as a budget rather than a jurisdiction. Blaming draws on a store built up by compliance with the norm in question; the hypocrite is not disqualified but overdrawn, so the criticism still transmits its content while costing her credibility she has already spent, and further blame bounces. On that model, does it follow that reformed offenders regain standing disproportionately, that a bystander who never faced the temptation has infinite standing, that blaming the absent or the dead is costless, and that the debt is discharged by reform or by accepting blame oneself? And does it license an institution one of us half-seriously proposed — a blame escrow, where you file the criticism now and it is released to its target once you have fixed your own instance? Finally, tell me what a hypocritical criticism actually asserts: whether alongside you did wrong it carries a comparative claim about the speaker's own position that makes it self-undermining rather than merely ill-mannered, and what a rational target should do with it — whether the critic's hypocrisy is evidence about the norm's stringency, evidence about the critic's reliability, or noise, and whether the familiar observation that the people keenest to enforce a norm are often the ones who struggle with it should change the answer. If there is a better analogy than any of the three on the table, I'd like to hear it, with the correspondences stated.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** A long-standing rationalist discussion group (8-9 members, engineers, physicians, game designer). They discuss live disagreements.
      *   **The Incident:** Member R. didn't comment on Member M.'s paper (breach of norm). M. (worst commenting record) criticized R. R. said M. has no standing. M. called it *tu quoque*. S. argued "standing" is a legal concept (*locus standi*), not just *tu quoque*. A fourth member argued courts are the wrong domain (blame isn't institutional).
      *   **The Twist:** Legally, the injured party (M.) usually has *best* standing. R. switched to "clean hands" maxim (equity doctrine) to deny remedy, not hearing.
      *   **The Task:**
          1.  Audit the courtroom analogy (explicit table mapping).
          2.  Analyze R.'s amended "clean hands" version.
          3.  Identify features of courts imported into blame that don't belong (third-party authority, binary entitlement, scarce goods, etc.).
          4.  Sort disanalogies into "matter for R's purpose" vs. "don't matter."
          5.  Determine if R's conclusion (I can ignore the criticism because of your hypocrisy) survives the audit.
          6.  Analyze the Austin-style speech-act alternative (infelicity/misfire). Does it save R's conclusion?
          7.  Stress-test the "Standing as Budget" model (credits/debits, escrow, reform, bystanders).
          8.  Analyze what hypocritical criticism *asserts* (content vs. comparative claim) and how a rational target should respond.
          9.  Propose a better analogy if one exists.
      *   **Constraints:** No reading lists, argue it out, explicit mappings.

  2.  **Deconstruct the Courtroom Analogy (Legal Mapping):**

      *   *Plaintiff:* M. (The one bringing the complaint).
      *   *Defendant:* R. (The one accused of breaching the norm).
      *   *Tribunal:* The Group (Collectively adjudicating the norm).
      *   *Injury:* Breach of group norm (failure to comment), potentially degrading group epistemic quality.
      *   *Remedy:* Compliance (reading/commenting), apology, or social sanction.
      *   *Motion to Dismiss:* R.'s initial claim ("You have no standing").
      *   *Appeal:* R.'s shift to "Clean Hands" (Equity).
      *   *Clean Hands Mapping:* M. has violated norms previously. Therefore, equity denies her the *remedy* (social uptake/compliance), even if the *claim* (R. breached the norm) is valid.
      *   *What is denied:* Not the hearing (the group heard it), not the claim's truth, but the *enforceability* or *obligation to respond*.

  3.  **Analyze Disanalogies (Court vs. Blame):**

      *   *Authority:* Courts have state monopoly on violence/enforcement. Blame relies on social uptake.
      *   *Third Party:* Courts have judges. Blame is often dyadic or distributed.
      *   *Binary vs. Graded:* Standing is usually yes/no. Blame uptake is scalar (how much do I care?).
      *   *Scarce Good:* Court time is scarce. Attention is scarce, but not institutionally rationed in the same way.
      *   *Purpose:* Courts resolve disputes to end them. Blame often aims to modify behavior or express values.
      *   *Matter for R:* The lack of a neutral arbiter matters most. R. is acting as judge in his own case regarding M.'s standing.
      *   *Survival of Conclusion:* R.'s conclusion ("I don't have to address the merit") collapses. In court, a judge dismisses. In conversation, R. decides unilaterally. The analogy hides the power move.

  4.  **Analyze the Austin/Speech-Act Model:**

      *   *Concept:* Illocutionary act requires felicity conditions. Hypocrisy = Abuse of procedure (insincerity or lack of authority).
      *   *Mapping:* Criticism = Verdictive/Exercitive. Hypocrite = lacks authority. Utterance = Void/Misfire.
      *   *Problem:* Who declares it void? In law, the judge. In conversation, the hearer. If the hearer (R.) declares it void, it's just refusal. If the content is true, R. still learns something.
      *   *Result:* Doesn't save R. It just says "This speech act failed to bind me." It doesn't mean the *proposition* is false. R. still knows he didn't read the paper.

  5.  **Stress-Test the "Standing as Budget" Model:**

      *   *Concept:* Norm compliance earns credits. Blame spends credits. Hypocrites are overdrawn.
      *   *Reformed Offenders:* Do they regain standing disproportionately? (The "Zeal of the Convert"). Plausible.
      *   *Bystanders:* Infinite standing? (Never tempted). Problematic. Suggests saints have max authority.
      *   *Absent/Dead:* Costless? Yes, cheap shots.
      *   *Discharge:* Reform or accepting blame? Accepting blame seems like paying the debt.
      *   *Blame Escrow:* File criticism, release when fixed. Interesting mechanism. Prevents hypocritical dumping. Encourages self-reform first.
      *   *Viability:* High friction. Might stifle necessary urgent criticism.

  6.  **Analyze Hypocritical Criticism (Content vs. Signal):**

      *   *Assertion:* "You did X (wrong)." + Implicit "I am positioned to judge X."
      *   *Self-undermining:* The implicit claim is false, but the explicit claim might be true.
      *   *Rational Target Response:* Update on the fact (I didn't read the paper). Downweight the reliability/sincerity of the critic.
      *   *Zealots:* People struggling with a norm often enforce it hardest (signal commitment, manage own temptation). This makes the criticism *more* informative about the norm's difficulty, not less about the breach.

  7.  **Propose a Better Analogy:**

      *   *Currency/Exchange:* Blame as a transaction. Hypocrisy is counterfeiting.
      *   *Maintenance/Engineering:* Norms as system integrity. Hypocrisy is a sensor malfunction.
      *   *Selection:* **The Audit/Compliance Check.**
      *   *Why:* Fits the group's engineer/physician makeup. Focuses on system integrity rather than punishment.
      *   *Mapping:* Norm = Protocol. Breach = Error Log. Critic = Monitoring System. Hypocrite = Faulty Sensor.
      *   *Benefit:* A faulty sensor still detects an error. You fix the error, but you flag the sensor for repair. Separates the *data* from the *source reliability*.

  8.  **Drafting the Response:**

      *   *Tone:* Precise, analytical, respectful of the group's rationalist background, avoiding moralizing.
      *   *Structure:* Follow the user's prompt order strictly.
      *   *Section 1: Courtroom Table.*
      *   *Section 2: Disanalogies & R's Conclusion.*
      *   *Section 3: Austin/Speech-Act.*
      *   *Section 4: Budget Model Stress-Test.*
      *   *Section 5: What Hypocrisy Asserts & Rational Response.*
      *   *Section 6: Better Analogy (The Audit).*

      *(Self-Correction during drafting)*: Make sure to distinguish between *locus standi* (right to sue) and *clean hands* (equitable defense). R. switched mid-stream. I need to be clear that *locus standi* failed M. (injured party has standing), so R. moved to *clean hands* (you broke rules too, so no equity).
      *Refining the Budget Model:* The "infinite standing" for bystanders is a known bug in moral credit models. I should highlight that.
      *Refining the Austin Model:* The key is "uptake." If R. refuses uptake, the act misfires *for R*, but succeeds as information for the group.
      *Refining the Conclusion:* R. wants to ignore the *merit*. The audit shows he can ignore the *obligation to defer*, but not the *truth of the claim*.

  9.  **Final Review against Constraints:**
      *   No reading list? Check.
      *   Explicit table? Check.
      *   Argue it? Check.
      *   Address all sub-questions (escrow, reform, bystanders, etc.)? Check.

  10. **Final Polish:** Ensure the distinction between "I don't have to listen" and "You are wrong" is sharp. R. is conflating *authority to blame* with *truth of blame*.

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  Here is the audit of the analogies, structured as requested.

  ### 1. The Courtroom Mapping

  You asked for an explicit mapping of the legal analogy as deployed by S. and amended by R., followed by an analysis of the imported features.

  | Legal Concept | Group Disagreement Equivalent | Notes on Mapping |
  | :--- | :--- | :--- |
  | **Plaintiff** | M. (The Critic) | The party initiating the complaint. |
  | **Defendant** | R. (The Target) | The party accused of breaching the norm. |
  | **Tribunal** | The Group (Collective) | The body whose opinion determines social sanction. |
  | **Injury** | Norm Breach (No Comment) | Degradation of group epistemic quality/trust. |
  | **Remedy** | Compliance / Uptake | R. admits fault, apologizes, or changes behavior. |
  | **Motion to Dismiss** | R.'s Initial Reply ("No Standing") | Claim that M. lacks *locus standi* to bring the claim. |
  | **Appeal / Amendment** | R.'s Second Reply ("Clean Hands") | Shift from jurisdiction to equitable defense. |
  | **Clean Hands Doctrine** | M.'s Prior Record | M. has violated norms previously. |
  | **Judicial Ruling** | (Absent) | No neutral arbiter exists to grant the dismissal. |
  | **Outcome Denied** | The Remedy (Uptake) | R. claims he owes no response, not that the claim is false. |

  **The "Clean Hands" Amendment:**
  In equity, a plaintiff with "unclean hands" may be denied a *remedy* even if their claim is valid. R. is arguing that M. is entitled to be *right* (the claim is true), but not to be *heard* (the group need not enforce the norm on her behalf). He is denying the **uptake**, not the **truth**.

  ### 2. Disanalogies: What the Courtroom Imports

  The legal analogy smuggles in structural features that do not exist in informal peer groups. We can sort these by whether they support R.'s desired conclusion (that he may ignore the criticism).

  | Feature Imported | Does Blame Have It? | Matters for R's Conclusion? | Analysis |
  | :--- | :--- | :--- | :--- |
  | **Neutral Arbiter** | No. | **Yes (Critical).** | In court, a *judge* dismisses the case. In the group, R. is dismissing the case against himself. The analogy hides that R. is acting as judge in his own cause. |
  | **Binary Entitlement** | No. | **Yes.** | Standing is usually yes/no. Blame uptake is graded (I might listen less, but not zero). R. uses the binary to justify total silence. |
  | **Scarce Institutional Good** | No. | **No.** | Court time is rationed by the state. Group attention is scarce, but not allocated by rule of law. R. cannot claim he is saving "court time." |
  | **Enforcement Power** | No. | **Yes.** | Courts can force remedies. The group can only sanction socially. Denying "remedy" just means R. refuses to change, not that he *can't* be forced. |
  | **Procedure vs. Merit** | Yes (sort of). | **Yes.** | Courts separate procedure from merit to ensure fairness. R. uses procedure to shield merit from scrutiny. |

  **Does R.'s Conclusion Survive?**
  No. The conclusion R. wants is: *"I may properly answer the criticism by pointing at the critic, without ever addressing whether he skipped the reading."*

  In a court, this works because the Judge says, "Case dismissed." In your group, there is no Judge. When R. says "You have no standing," he is not invoking a procedure; he is exercising a veto. The legal analogy collapses into one of two claims:
  1.  **"You may not raise this."** (False. M. spoke; the speech act occurred.)
  2.  **"I don't have to listen to you."** (True, but trivial. R. never *had* to listen. The norm expected him to *consider*, not obey.)

  The analogy was doing all the work. It lent the aura of institutional neutrality to a unilateral refusal. Once the disanalogy (lack of a judge) is on the table, R.'s move is revealed not as a procedural defense, but as a power play: he is asserting the right to adjudicate his own compliance based on the critic's history.

  ### 3. The Austin-Style Speech-Act Alternative

  One member suggested swapping the courtroom for J.L. Austin's speech-act theory: hypocritical blame is **infelicitous** (a misfire), not false.

  **The Mapping:**
  *   **Illocutionary Act:** Blaming (exercitive/verdictive).
  *   **Felicity Condition:** The speaker must occupy a specific moral position (authority/sincerity).
  *   **Hypocrisy:** A failure of the sincerity/authority condition.
  *   **Result:** The utterance is "void." It does not successfully *blame*, even if it describes a fault.

  **Does this save R.'s conclusion?**
  It saves it better than the legal model, but it still fails to license ignoring the *content*.
  If I pronounce you husband and wife without being a priest, the marriage is void. But if I say "The building is on fire" while standing in a burning building I helped ignite, the statement is infelicitous as a *warning* (I lack moral authority), but the **propositional content** remains true.

  **The Problem:**
  Austin's model requires a convention to define what counts as a "misfire." In law, the convention is statute. In conversation, the convention is **uptake**.
  *   If R. refuses uptake, the act misfires *for R.*
  *   But the Group (the audience) may still grant uptake.
  *   Therefore, the criticism is not "void" globally; it is only void *between M. and R.*

  This relocates the problem rather than solving it. It tells us *why* R. feels justified in ignoring M. (the act didn't bind him), but it doesn't tell us why R. is justified in ignoring the *fact* that he didn't read the paper. It protects R.'s ego, not R.'s epistemology.

  ### 4. Stress-Test: Standing as a Budget

  Your contrary model: Standing is a currency earned by compliance. Blame spends currency. Hypocrites are overdrawn.

  **Implications & Stress Test:**

  1.  **Reformed Offenders:** Do they regain standing disproportionately?
      *   *Model Prediction:* Yes. If standing is based on recent compliance, a reformed offender who is hyper-vigilant may accumulate credits faster than a complacent saint.
      *   *Verdict:* Plausible. This matches the "Zeal of the Convert" phenomenon.

  2.  **Bystanders:** Does one who never faced temptation have infinite standing?
      *   *Model Prediction:* Yes. If they never spent credits, their balance is maxed out.
      *   *Verdict:* Counter-intuitive. We often distrust those who have never struggled with a norm ("easy virtue"). The model fails to account for *empathic knowledge*.

  3.  **Absent/Dead:** Is blaming them costless?
      *   *Model Prediction:* Yes. They cannot spend credits to defend themselves, and the blamer pays no immediate social cost.
      *   *Verdict:* Accurate description of "punching down" or virtue signaling. The model correctly identifies this as low-cost signaling.

  4.  **Discharge:** Is debt discharged by reform or accepting blame?
      *   *Model Prediction:* Accepting blame is a payment. Reform is earning income.
      *   *Verdict:* Consistent. Accepting blame validates the currency system; refusing it inflates the debt.

  5.  **Blame Escrow:** Filing criticism now, released when you fix your own instance.
      *   *Mechanism:* You write the critique, but it is held by a third party (or system) until your own compliance record clears the debt.
      *   *Pros:* Incentivizes self-reform before policing others. Reduces hypocritical signaling.
      *   *Cons:* High friction. Urgent safety/ethical breaches cannot wait for the critic's self-improvement. It privileges the critic's purity over the target's correction.
      *   *Verdict:* Viable for low-stakes norms (like reading papers), disastrous for high-stakes norms (like safety protocols).

  **Audit of the Budget Model:**
  This is the strongest of the three models for *incentive design*, but it treats blame as a transaction rather than a truth-tracking mechanism. It explains *who* should speak, but not *what* should be heard.

  ### 5. What Hypocritical Criticism Actually Asserts

  We need to separate the **propositional content** from the **indexical signal**.

  **The Assertion:**
  1.  **Explicit:** "Action X violates Norm N." (Truth-apt.)
  2.  **Implicit:** "I am a reliable enforcer of Norm N." (Truth-apt, often false in hypocrisy.)
  3.  **Implicit (Secondary):** "I am currently complying with Norm N." (Often false.)

  **Self-Undermining?**
  It is not self-undermining regarding Claim 1. It is self-undermining regarding Claim 2.
  When M. criticizes R., she asserts R. breached the norm. Her own record does not make R.'s breach false. It makes her *authority* to enforce it shaky.

  **Rational Target Response:**
  A rational actor should decouple the data from the sensor.
  *   **Update on the Fact:** Did I read the paper? (Yes/No). If No, the criticism is valid data.
  *   **Update on the Source:** Is M. a reliable monitor? (Downweight future signals from M. regarding this norm).
  *   **Update on the Norm:** Why is M. so keen? (See below).

  **The Zealot Observation:**
  *"The people keenest to enforce a norm are often the ones who struggle with it."*
  This should **increase** the weight of the criticism regarding the *norm's difficulty*, not decrease the weight regarding the *breach*.
  *   If M. struggles to comment, it implies commenting is hard.
  *   If M. criticizes R. for not commenting, she is signaling that the norm is vital *because* it is hard.
  *   R.'s error is treating M.'s struggle as disqualification, rather than as evidence of the norm's value.

  ### 6. A Better Analogy: The System Audit

  Given your group's composition (engineers, physicians), the legal and linguistic models are foreign source domains. I propose the **System Audit / Sensor Network** analogy.

  **The Mapping:**

  | Audit Concept | Group Disagreement Equivalent |
  | :--- | :--- |
  | **Protocol** | Group Norm (Read & Comment). |
  | **System State** | Actual Compliance (Who read what). |
  | **Sensor Node** | Group Member (M., R., etc.). |
  | **Error Log** | The Criticism ("R. did not comment"). |
  | **Sensor Calibration** | Member's Own Compliance History. |
  | **False Positive** | Accusing someone of breach when they complied. |
  | **Sensor Drift** | Hypocrisy (Sensor reports errors it ignores in itself). |
  | **System Admin** | The Group (Collective). |

  **Why this is better:**
  1.  **Decouples Data from Source:** A malfunctioning sensor (hypocrite) can still detect a real error (R.'s breach). The system admin (Group) logs the error *and* flags the sensor for maintenance.
  2.  **No Binary Dismissal:** You don't throw away the data because the sensor is dirty. You verify the data independently.
  3.  **Focus on Integrity:** The goal is system integrity (group epistemic quality), not punishing the sensor or the defendant.
  4.  **R.'s Move Re-evaluated:** R. is effectively trying to disable the sensor because it is dirty, rather than checking the log. This is bad engineering. You fix the sensor, but you check the log.

  **Conclusion for the Group:**
  R.'s argument relies on the legal analogy to convert a *credibility discount* into a *procedural veto*.
  *   **Legal Model:** Fails because there is no judge.
  *   **Austin Model:** Fails because the proposition remains true even if the act misfires.
  *   **Budget Model:** Explains the cost, but doesn't justify ignoring the data.
  *   **Audit Model:** Shows that R. is conflating *sensor calibration* with *system error*.

  **Recommendation:**
  The rational response to hypocritical blame is: **Verify the breach, discount the blamer.**
  R. should have said: "You are right, I didn't comment. I will fix that. However, given your record, I question your priority in enforcing this, and I'd like to discuss why we both struggle with it."
  This accepts the data, rejects the hierarchy, and utilizes the "Zealot" insight to strengthen the norm rather than weaponize it.
