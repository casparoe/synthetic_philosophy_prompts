          Moving to the spatial framework, I am curious about his abandonment of the twelve zodiacal houses and the ecliptic-based spatial framework that had dominated astrology for centuries. If the zodiac was discarded, did Kepler intend for actual orbital positions to serve as the new coordinate system for influence, and if so, how did he calculate these positions without the fixed background of the constellations?

