answer: |-
  Here is the translation of the three claims into your vocabulary, followed by the analysis of the residue.

  ### The Short Answer: How to Render "Socially Constructed"

  "X is socially constructed" does not map to a single data engineering concept. It distributes across three different architectural properties depending on the kind:

  1.  **For Money:** It maps to **Lookup Table Dependency**. The value exists only because a specific registry table exists and is enforced by foreign key constraints.
  2.  **For Race:** It maps to **Feedback Loop / Distribution Shift**. The label is not a static property of the row; it is a variable that changes the downstream system state, which in turn changes the future distribution of the label.
  3.  **For Gender:** It maps to **Write Permissions / Source of Truth**. The "ground truth" is not determined by an external validator or a proxy, but by who holds the `UPDATE` privilege on that specific column.

  ---

  ### Claim (a): Money
  *The kind exists because we jointly treat certain stuff as money, and it would stop existing if we stopped treating it that way.*

  **The Translation:**
  The `currency_code` column is a Foreign Key into a `valid_currencies` registry table maintained by a specific service (e.g., ISO or Central Bank). The application logic rejects any transaction where the FK constraint fails. If the registry service drops the row for "USD" or the ETL job populating that registry stops running, the `transactions` table immediately accumulates referential integrity errors, and the pipeline halts. The value has no validity outside the constraint enforcement.

  *   **What maps cleanly:** The dependency on a maintained registry. If the registry goes down or changes schema, the data in the downstream table becomes invalid. This captures the "it exists because we treat it that way" mechanic perfectly.
  *   **What you had to fudge:** You have to treat "jointly treat" as "system enforcement." In reality, money works even if the database is down, provided social consensus holds. In your vocab, if the DB constraint is gone, the data is corrupt.
  *   **What you could not express:** The *collective* nature of the agreement. In your schema, the "authority" is the team owning the registry table. In the philosophical claim, the authority is the network of users. Your vocab assumes a central admin; the claim describes a distributed consensus.
  *   **Smuggled Assumption:** That validity requires a schema constraint. You are assuming that if the constraint vanishes, the value is null. The philosophical claim allows that the value might persist as "legacy data" that people still honor, whereas your vocab treats orphaned FKs as errors to be fixed.

  **Verdict:** This translates almost perfectly. It is a **Lookup Table** problem.

  ---

  ### Claim (b): Race
  *The boundaries move around over time, the classifications feed back into the people classified, and there is no clean intrinsic property of a person that settles which box they belong in.*

  **The Translation:**
  The `race_code` column is implemented as a Slowly Changing Dimension (SCD) Type 2, tracking history, because the value for a `person_id` changes over time not due to data correction, but due to schema versioning or societal reclassification. Furthermore, this column is a feature in a downstream model (e.g., risk scoring). The model output affects the person's economic status, which updates their `income` and `address` fields, which are then fed back into the training data for the next model iteration. There is no "source of truth" table for race; the column is populated by a mix of self-report, observer guess, or imputation, resulting in high label noise that correlates with the `collector_id`.

  *   **What maps cleanly:** The lack of intrinsic property maps to **Label Noise / Proxy**. The fact that boundaries move maps to **Schema Drift / SCD**. The feedback effect maps to **Training-Serve Skew / Feedback Loops**.
  *   **What you had to fudge:** You have to treat the "movement of boundaries" as a data quality issue (drift) rather than a definition change. In your vocab, drift is something you mitigate to keep the model stable. In the claim, the drift is the *nature* of the thing.
  *   **What you could not express:** The **Harm of the Classification**. Your vocab can express that the label is unstable and noisy. It cannot express that the act of *collecting* the column alters the subject's life trajectory in a way that is normatively negative. You can track the skew, but you cannot flag the collection itself as "illegitimate" without appealing to business requirements outside the pipeline.
  *   **Smuggled Assumption:** That there *should* be a ground truth. By calling it "label noise" or "drift," you imply there is a stable state you are failing to capture. The philosophical claim is that there is no stable state to capture.

  **Verdict:** This mostly works, but leaves out the **Normative Cost**. It captures the *instability*, but not the *violence* of the categorization.

  ---

  ### Claim (c): Gender
  *Partly like (b), except that membership seems to depend at least in part on what the person themselves says or experiences, not only on what everyone else says.*

  **The Translation:**
  The `gender_identity` column has a different write-permission policy than `sex_assigned_birth`. `sex_assigned_birth` is system-generated at onboarding (immutable, source: document scan). `gender_identity` is user-writable via the `profile_update` endpoint. The system treats the user's `UPDATE` payload as the authoritative source of truth, overriding any external validation or historical data. However, downstream systems may still join on `sex_assigned_birth` for legacy reasons, causing join failures or logic branches where the two columns disagree.

  *   **What maps cleanly:** The distinction maps to **Write Permissions** and **Source of Truth**. It captures the idea that the "truth" is determined by who is allowed to write the row.
  *   **What you had to fudge:** You have to treat the user's statement as "data entry." In your vocab, if a user writes "Dragon" to the gender field, that is a validation error or bad data. In the philosophical claim, if the user asserts it, it *becomes* the fact. Your vocab requires a schema constraint (enum); the claim suggests the user's assertion *defines* the schema.
  *   **What you could not express:** **Ontological Authority**. In data engineering, a user input is just a signal that might be noisy. In this claim, the user input is *constitutive*. Your vocab treats the user as a sensor; the claim treats the user as the creator of the fact. You have no way to represent that the user's write permission *makes* the data true, rather than just *reporting* it.
  *   **Smuggled Assumption:** That the database schema is the final arbiter of validity. You are assuming that if the user writes something outside the enum, the system rejects it. The claim implies the system should expand the enum to fit the user, not the user to fit the enum.

  **Verdict:** This is where your vocabulary breaks. It handles the *mechanism* (who writes), but fails at the *status* (why that write counts as truth).

  ---

  ### The Residue: Is Your Vocabulary Thin or Is The Talk Empty?

  You asked whether the residue (injustice, reason to change schema, harm not captured by joins) points to something your vocabulary is missing, or whether the construction talk is less substantive than it sounds.

  **Your vocabulary is thin.** Specifically, it lacks a **Normative Layer**.

  Here is exactly where the translation fails:

  1.  **Injustice vs. Technical Debt:** In your vocab, a "bad" column is one that causes nulls, skew, or pipeline breaks. This is **Technical Debt**. In the philosophical debate, a "bad" column is one that enforces a hierarchy or causes harm even if the pipeline runs perfectly. This is **Ethical Debt**. Your vocabulary has no metric for Ethical Debt. You can have a perfectly normalized, zero-latency pipeline that distributes harmful classifications. Your vocab calls this "success"; the philosophical call calls this "oppression."
  2.  **Reason to Change Schema:** In your vocab, you change a schema because requirements changed or performance degraded. In the philosophical debate, you change a schema because the *classification itself is illegitimate*. Your vocab assumes the business requirements (the "why") come from outside the system and are not subject to engineering critique. The philosophical claim is that the engineering structure *is* the politics.
  3.  **Harm Not Captured by Joins:** You mentioned "being put in a box does something to a person that isn't captured by any downstream join." This is the critical failure point. Your vocabulary tracks **State Changes** (rows updated, statuses flipped). It does not track **Social Context** (stigma, legal status, psychological impact). If a label changes a person's `loan_eligibility` flag, you see that. If a label changes how a doctor *looks* at the patient without changing a single field in the `clinical_notes` table, your system sees nothing. The data model is blind to the *interpretation* of the data by humans downstream.

  **Is the construction talk empty?**
  No. The construction talk is doing work your vocabulary cannot do: it is evaluating the **Legitimacy of the Schema**.
  *   Your vocab asks: "Is this data accurate and consistent?"
  *   Construction talk asks: "Do we have the right to store this column at all?"

  **Which fails hardest?**
  **Claim (c) fails hardest.**
  *   (a) Money is a **Reference Data** problem. Your vocab handles this natively.
  *   (b) Race is a **Feedback Loop** problem. Your vocab handles this well, provided you accept "drift" as a feature, not a bug.
  *   (c) Gender is an **Authority** problem. Your vocab assumes authority lies with the Schema Owner. The claim asserts authority lies with the Subject. These are incompatible architectural principles. To make (c) fit, you have to grant the `user_id` write-access to the definition of the `enum` itself, which breaks relational integrity.

  ### Conclusion

  You are right for the reason you think you are.
  *   (a) translates to **Registry Dependency**.
  *   (b) translates to **Causal Feedback / Drift**.
  *   (c) translates to **Write Permission / Ontological Authority**, and this is where the pipe metaphor snaps.

  The residue is not empty noise. It is the **Normative Gap**. Your vocabulary describes how the machine processes the world. The philosophical talk describes how the machine *shapes* the world and who has the right to design the machine. You can model the feedback loop, but you cannot model the *wrongness* of the loop using only schema constraints and ETL logs. To capture that, you would need to add a "Policy" or "Compliance" layer to your architecture that acts as a gatekeeper not on data *types*, but on data *rights*. Without that, your schema-talk is indeed a view from nowhere: it describes the flow, but it cannot judge the destination.
