answer: |-
  This is a classic reconstruction of the debate between **Intellectualism** (knowing-how is a species of knowing-that) and **Anti-Intellectualism** (knowing-how is a distinct capacity). Your friend has built a valid argument for a very specific, somewhat crude version of Intellectualism (akin to early Jason Stanley and Timothy Williamson, though they would nuance it).

  The conclusion (7) is indeed absurd. A medical student who has read every textbook but never touched a scalpel does *not* know how to perform surgery in the same sense as a resident. Since the logic is valid, a premise must be false.

  If you want to keep (1) (Intellectualism) but reject (7), you have to attack the bridge between them. Here is the specific exit strategy, the price of the ticket, and how to handle the wrinkles.

  ### The Primary Exit: Reject Step (3)
  **Step (3) claims:** *Knowledge-that isn't graded. You either know that p or you don't.*

  This is the weakest link in the chain. It is the premise that allows your friend to equate the trainee's abstract understanding with the cyclist's embodied mastery.

  **The Move:**
  You argue that while both the trainee and the cyclist stand in a knowledge relation to the proposition *<w is a way to ride>*, they stand in that relation **differently**. The cyclist possesses a **practical mode of presentation**; the trainee possesses a **theoretical mode of presentation**.

  In Fregean terms, they grasp the same *referent* (the way $w$) under different *senses*. Your friend treats knowledge as a simple binary switch (On/Off). But epistemology allows for "grasp" to come in degrees or varieties. You can know a proposition abstractly (knowing *about* the balance) or practically (knowing *by* balancing).

  **The Price:**
  1.  **Ontological Bloat:** You must accept that propositions aren't just truth conditions (coarse-grained); they have structure (fine-grained). You are buying into Fregean "senses" or "modes of presentation." This is philosophically respectable but metaphysically heavier than your friend's view.
  2.  **Psychological Complexity:** You have to admit that the mental state of "knowing" is not uniform. The neural/cognitive architecture required to grasp a proposition practically is distinct from grasping it theoretically. This blurs the line between "knowledge" and "cognitive capacity," which Intellectualists usually try to keep separate.
  3.  **Gradability:** You must concede that epistemology is not binary. There *is* such a thing as knowing something "more thoroughly" or "in a better way." This opens the door to contextualism or pragmatic encroachment (where practical stakes affect whether you count as "knowing").

  **Why this saves (1):**
  You can still say knowing-how *is* a form of knowing-that. The cyclist knows that $w$ is the way to ride. But you deny that this knowledge is identical to the trainee's because the *mode of access* is part of the knowledge state's identity. Thus, (7) fails: the surgeon knows the propositions under a practical mode the manual-reader lacks.

  ### The Secondary Exit: Nuance Step (2) via the Indexical Wrinkle
  Your second wrinkle is actually a stronger philosophical objection than your friend admits.
  **The Wrinkle:** *Reliability of execution might depend on indexical, situation-specific stuff.*

  Your friend says accepting this makes (2) false. **She is right, and that is a good thing.**

  **The Move:**
  The proposition the cyclist knows is not identical to the proposition the trainee knows.
  *   **Trainee knows:** <That generic way $w$ is a way to ride a bike.>
  *   **Cyclist knows:** <That *this* way (demonstrated by my current proprioception) is a way to ride *now*.>

  If the content of the knowledge differs, then (4) is false. They do *not* both know that $w$ is a way to ride in the same sense. The cyclist knows a richer, indexical proposition that requires being in the situation to grasp.

  **The Price:**
  1.  **Proliferation of Propositions:** Every unique context generates a new proposition. This makes knowledge highly fragmented.
  2.  **Ineffability:** If the cyclist's knowledge relies on indexicals ("*this* feeling of balance"), it explains why they can't tell you what $w$ is (your first wrinkle). It's not just a reporting failure; it's that the content of their knowledge *cannot be fully captured in language*. This undermines the Intellectualist hope that all knowledge is linguistically codifiable.

  ### Addressing the Regress (Ryle's Ghost)
  You asked if the regress is fatal if you go Anti-Intellectualist (rejecting 1).
  **Short answer:** No, it's not fatal, but it's annoying.

  Ryle's Regress argues: If knowing-how is guided by knowing-that (a rule), you need another knowing-how to apply the rule, ad infinitum.
  **The Intellectualist Defense:** The representation of the rule can be **unconscious** or **dispositional**. You don't need to *consciously contemplate* the rule to follow it. The brain represents $w$ without the agent needing to perform a prior intellectual act to access that representation.
  **The Cost:** If you allow unconscious representations to count as "knowing-that," the concept of "knowing-that" becomes so bloated it loses its traditional meaning. It starts looking a lot like... a disposition. Which looks a lot like Anti-Intellectualism.

  ### Addressing the Verbal Access Wrinkle
  *The cyclist can't tell you what w is.*
  Your friend says this is just a reporting issue.
  **Counter:** If knowledge is propositional, it should be expressible in principle. If the cyclist *cannot* express it even with perfect linguistic training, that is evidence the knowledge isn't purely propositional.
  **The Intellectualist Fix:** Use the "Mode of Presentation" defense again. The cyclist grasps the proposition under a practical mode that is not translatable into the theoretical mode required for speech. They know it, but they can't translate the *sense* into words, only the *reference*. (Think of trying to describe the taste of wine to someone who has never tasted it. You know the proposition "This wine tastes like X," but you can't convey the sense of X).

  ### Summary: Your Exit Ticket
  To keep (1) without swallowing (7), you should tell your friend:

  1.  **Reject (3).** Knowledge *grasp* is gradable and modal. Knowing the same truth under a practical mode is epistemically distinct from knowing it under a theoretical mode.
  2.  **Nuance (2).** Admit that the cyclist likely knows *additional* indexical propositions (about proprioception, timing, force) that the trainee literally cannot access without doing.
  3.  **The Cost:** You pay for this by accepting a **Fregean epistemology**. You must argue that *how* you know matters as much as *what* you know.

  **The specific line to use at the next dinner:**
  *"I'll keep Intellectualism, but I reject your claim that knowledge is binary and coarse-grained. The surgeon and the student stand in different cognitive relations to the proposition. The surgeon grasps it under a practical mode of presentation that entails a capacity for action; the student grasps it under a theoretical mode. They don't have the 'same knowledge' any more than a man who sees a star has the 'same knowledge' as a man who reads about it in a catalog, even if both know 'That is Sirius.' One is acquaintance, one is description. Practice converts description into acquaintance."*

  This preserves the intuition that doing is special, keeps the Intellectualist framework, and avoids the absurdity that residency is epistemically useless. The price is admitting that "Knowing-That" is a much richer, more complex mental state than your friend allows.
