      *   (4) Scenario: Trainee (read manual) vs. Cyclist (lifelong rider). Both know $w$ is a way to ride.
      *   (5) Inference: They have the *same* knowledge. Difference is only execution reliability.
      *   (6) Inference: Practice/apprenticeship doesn't produce knowledge, just tunes machinery.
      *   (7) Conclusion: Manual-reader knows surgery same as surgeon; residency is epistemically useless.

  3.  **Evaluate the Steps (The "Exit Strategy"):**

      *   **Step (1) - Intellectualism:** This is the core. Stanley & Williamson (2001) are the modern defenders. Ryle is the classic opponent.
          *   *Cost of Rejecting:* You need a positive account of knowing-how that isn't reducible to knowing-that. You face Ryle's Regress (if knowing-how is a distinct mental state guiding action, do you need to know how to apply that state?).
          *   *Viability:* High. Many philosophers reject strong intellectualism.

      *   **Step (2) - Coarse-grained Propositions:** This claims propositions are just truth conditions.
          *   *Cost of Rejecting:* You need fine-grained propositions (Fregean senses, modes of presentation). If the trainee and cyclist grasp the *same* proposition under *different modes*, do they have the *same knowledge*?
          *   *Viability:* Very High. This is the standard Intellectualist move to save (1) without accepting (7).

      *   **Step (3) - Binary Knowledge:** This claims knowledge is all-or-nothing.
          *   *Cost of Rejecting:* You need a gradable epistemology (contextualism, pragmatic encroachment, or just admitting "grasp" comes in degrees).
