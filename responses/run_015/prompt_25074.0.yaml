answer: |-
  **Moral Architecture Quiz**
  *Select the option matching your intuition.*

  1. **The Murderer at the Door:** Lying hides a victim from a killer. A) Wrong but necessary. B) Not wrong here. C) Always wrong.
  2. **The Birthday Promise:** You promised lunch, but see an accident. A) Promise duty exists but loses. B) No promise duty here. C) Promise absolute.
  3. **Surgery:** Cutting flesh causes pain. Does this count against the act? A) Yes, always a negative. B) No, context makes it positive/neutral.
  4. **Apprenticeship:** You learned ethics by: A) Memorizing codes. B) Watching mentors handle cases.
  5. **The Loophole:** Guilty man freed on paperwork error. A) Injustice (rule failed). B) Justice done (rule followed).
  6. **The Tweak:** A rule implies starving a child is okay. A) Change the rule. B) Make exception for this case.
  7. **Twins:** Two acts share all general features (lie, save life). Verdicts differ? A) Impossible. B) Possible (subtle context).
  8. **The Judge:** Why was this verdict right? A) It fit the law. B) It fit the specific circumstances.

  **Scoring Key**

  **Strong Generalism:** Mostly C/A (Q1–2), Yes (Q3), A (Q4, Q6, Q7, Q8). You believe morality is codifiable. Exceptions are illusory; if a rule fails, the rule was wrong, not the case. Moral error is rule-violation.

  **Ross-style Pluralism:** Mostly A (Q1–2), Yes (Q3), A (Q4), A (Q6), No (Q7). You accept conflicting *prima facie* duties. Principles exist and have invariant valence (pain is always bad), but they can be overridden by stronger duties in specific cases.

  **Dancy-style Particularism:** Mostly B (Q1–4, Q6–8), Yes (Q7). You reject codification. Reasons are holistic; context flips valence (pain in surgery isn't a negative). Expertise is perceptual, not rule-based.

  **Incoherent/Unstable Combos**

  **The "Codified Holist" (Q3B + Q4A + Q7A):** You claim context flips valence (Q3B) but insist learning is rule-based (Q4A) and identical features yield same verdicts (Q7A). *Why:* If valence flips based on context, you cannot learn via static rules, and cases must differ morally somehow. This position is logically unstable; it demands codification of the uncodifiable.

  **The "Rigid Revisionist" (Q6A + Q1C):** You claim you must revise principles for bad results (Q6A) but hold lying is always wrong (Q1C). *Why:* If a lie saves a life (good result), holding it wrong contradicts the revisionist impulse. This suggests an unexplored dogmatism where some rules are immune to the revision process you endorse elsewhere.

  **The "Intuitionist Generalist" (Q8B + Q7A):** You claim experts use perception (Q8B) but identical features must yield same verdicts (Q7A). *Why:* If perception detects morally relevant details not captured by "general features," then Q7A is false. This reveals a tension between your epistemology (perception) and metaphysics (uniformity).
