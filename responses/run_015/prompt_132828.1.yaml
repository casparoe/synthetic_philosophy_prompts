answer: |-
  Before committing to a verdict, I will evaluate the candidate concepts that initially come to mind when analyzing your description. **Strawson's Objective Attitude** is the immediate proximate candidate; it fits the "management" aspect and the suspension of resentment, but it fails because Strawson characterizes it as a retreat from interpersonal engagement often prompted by seeing the agent as psychologically unfit or as an object, whereas your case is a *form* of engagement agreed upon by competent agents. **Role Morality** fits the domain-specificity (work vs. home), but it typically justifies different *actions* or *duties* based on a role, whereas you describe the *same actions* (gaming metrics, deception) eliciting different *emotional responses* based on context, not normative permission. **Psychological Compartmentalization** captures the separation of mental states, but it implies a cognitive fragmentation or defense mechanism, whereas your phenomenon is deliberate, mutual, and socially stable. **Conventional Norms** or **Social Contracts** capture the mutual agreement aspect, but they are too broad; they do not specifically isolate the *suspension of reactive attitudes* as the mechanism of the agreement. **Institutional Facts** (in the Searlean sense) explain how metrics become real, but they do not account for the *moral emotions* policed at the boundary. None of these concepts capture the specific architecture of a *mutually policed, domain-specific suspension of the participant stance*.

  **Verdict and Conceptual Carving**

  There is no established term in the Strawsonian or responsibility literature that precisely captures this phenomenon. While adjacent to discussions of "contextualism about responsibility" or "professional ethics," those frameworks focus on what we *owe* each other, not on the regulation of the *reactive attitudes* themselves. Therefore, I propose we name this **Reciprocal Stance Bracketing (RSB)**.

  **Definition:** Reciprocal Stance Bracketing is a stable, interpersonal arrangement wherein two or more agents mutually agree to suspend participant reactive attitudes (resentment, gratitude, indignation) regarding a specific class of actions within a defined domain, substituting them with an objective, incentive-based mode of engagement, while simultaneously maintaining that the *maintenance of this boundary* is itself a matter of participant accountability policed by full reactive attitudes.

  **The Carving (What it is and is not):**
  RSB is not an exemption from responsibility; it is a *redirection* of responsibility. In the bracketed domain (the basketball court, the metrics meeting), you are not held responsible for the *quality of your will* regarding the specific action (flopping, gaming metrics); you are held responsible for *compliance with the incentive structure*. However, you are held responsible for the *quality of your will* regarding the *agreement to bracket*. This explains why the "gamer" is not resented for gaming, but would be resented for gaming the friendship. The objective attitude is not adopted *toward the person* globally, but toward the *person-in-the-bracketed-role*, and this adoption is itself a participant move.

  **Hard Boundary Cases:**
  1.  **The Parasitic Breach (Negative Boundary):** Consider a manager who demands employees accept "it's just business" (objective stance) when laying them off or cutting benefits, but expects "family loyalty" (participant stance) when asking for unpaid overtime. This is *not* RSB. It fails the reciprocity condition. It is **Stance Exploitation**. The boundary is hard here: if the suspension of attitudes is not mutually beneficial and mutually acknowledged, it collapses into manipulation. The resentment felt by the employee in this case is not a violation of a bracket, but a reaction to the *absence* of a valid bracket.
  2.  **The Bleeding Domain (Positive Boundary Limit):** Consider two colleagues who bracket stance at work but socialize heavily outside it. If one games a metric on Tuesday, and they have drinks on Friday, the resentment may not trigger immediately because the "work self" is still bracketed. However, if the gaming of the metric directly harms the friend's personal reputation outside work, the bracket shatters. This marks the edge of RSB: the bracket holds only so long as the consequences of the bracketed action remain contained within the institutional logic. Once the action spills into the shared participant domain (friendship), the bracket dissolves. This shows RSB is porous and requires active maintenance.

  **The One-Sided Version: Corruption or Distinct Phenomenon?**
  The one-sided version you describe—the agent who demands objective treatment for their own transgressions while demanding participant treatment from others—is a **corruption** of RSB, not a distinct phenomenon. It is parasitic. It relies on the existence of the norm of Reciprocal Stance Bracketing to function. The exploiter counts on the victim's willingness to honor the bracket ("it's just work") while refusing to honor it in return. This tells us something crucial about the phenomenon: RSB is a *moral* achievement, not merely a pragmatic one. It requires moral equality to sustain. When the reciprocity breaks, the objective attitude ceases to be a "bracket" and reverts to Strawson's original conception: a tool of objectification and control. The resentment the victim feels is the participant stance re-asserting itself against the corruption of the agreement.

  **Pressure on Strawson's Argument**
  This phenomenon puts significant, nuanced pressure on Strawson, specifically on his claim that the participant stance is a "natural fact" of human life that we cannot rationally abandon wholesale.

  1.  **Rational Regulation:** Your observation shows that we *can* regulate the reactive attitudes more finely than Strawson suggests. We do not simply "have" them; we negotiate *where* they apply. This suggests the reactive attitudes are more cognitively penetrable and socially malleable than Strawson's "natural fact" rhetoric implies. We can step back and say, "In this room, we will not feel resentment."
  2.  **The Inescapability Thesis:** However, the fact that the *boundary itself* is policed by reactive attitudes ultimately vindicates Strawson's deeper point. We cannot abandon the participant stance *entirely*, even to create a zone of objective management. The agreement to bracket *must* be grounded in the participant stance (mutual respect, goodwill, accountability). If we abandoned the participant stance wholesale, we could not make the agreement to bracket, nor could we resent the violation of that agreement.

  Therefore, RSB does not refute Strawson; it refines him. It shows that while we cannot exit the participant stance globally (because we need it to build the exit), we can localize the objective attitude through a higher-order participant agreement. The objective attitude never truly succeeds in being "local" in isolation; it is always *hosted* by the participant stance. The pressure is not on the *necessity* of the reactive attitudes, but on their *granularity*. We are not prisoners of our emotions; we are architects of their jurisdiction.
