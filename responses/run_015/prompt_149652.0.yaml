answer: |-
  # The Gibbard-Satterthwaite (G-S) Sanity Check
  **Version:** 1.0 (Engineering Draft)
  **Purpose:** Decide if a ranking/aggregation logic is safe to ship or if it invites gameable behavior that breaks trust.
  **Premise:** The G-S theorem proves that for any deterministic voting system with 3+ options, **manipulation is mathematically unavoidable** unless one person is a dictator. This checklist does not find a perfect system; it identifies *how* it fails and whether that failure is acceptable.

  ---

  ## Part 1: The Decision Procedure

  Run these gates in order. If you hit a **STOP**, do not merge code until the "Human Override" section is completed.

  ### Gate 1: The "3+ Options" Logic Check
  *   **Question:** Can a single voter choose between 3 or more distinct outcomes (proposals) in a single round?
  *   **Checkable in Code:** Yes (Count distinct IDs in the proposal set).
  *   **If NO (< 3 options):** **SHIP IT.** G-S theorem does not apply. Binary choices are safe from this specific impossibility.
  *   **If YES (≥ 3 options):** **PROCEED to Gate 2.** Manipulation is theoretically possible.

  ### Gate 2: The "Single-Peaked" Domain Check
  *   **Question:** Is there a natural, objective ordering to the proposals that all voters agree on? (e.g., "Funding Amount: $1k, $5k, $10k" where everyone prefers an amount closest to their ideal, rather than random distinct projects).
  *   **Checkable in Code:** No. This is a **Judgment Call**.
  *   **Sufficient Answer:** "Yes, preferences are Single-Peaked." (e.g., We are only voting on *how much* to spend, not *what* to build).
  *   **If YES:** **MITIGATED.** You can use Median Voting rules. Risk is low. **SHIP IT** (with documentation).
  *   **If NO:** **PROCEED to Gate 3.** (This is the standard case for funding distinct projects). G-S fully applies.

  ### Gate 3: The Mechanism Vulnerability Check
  *   **Question:** Is the aggregation rule known to be *highly* susceptible to "Burial" (ranking a strong rival last) or "Compromise" (voting for a weak candidate to block a strong one)?
  *   **Checkable in Code:** No. This requires **Mechanism Design Knowledge**.
  *   **Sufficient Answer:** "The mechanism is not Plurality (First-Past-The-Post)." Plurality is the most vulnerable. Ranked/Scored systems are harder to game, though not immune.
  *   **If YES (It is Plurality):** **STOP.** High risk of tactical voting. Redesign recommended.
  *   **If NO (It is Ranked/Scored):** **PROCEED to Gate 4.** You have reduced risk, not eliminated it.

  ### Gate 4: The Power Concentration Check (The Values Gate)
  *   **Question:** Does the aggregation rule assign unequal weight to voters based on status, tenure, or role?
  *   **Checkable in Code:** Yes (Check if `weight` variable != 1 for all users).
  *   **Sufficient Answer:** "No, all voters have equal weight (1 person = 1 vote)."
  *   **If NO (Equal Weight):** **SHIP IT.** You have accepted the unavoidable G-S manipulation risk in a democratic framework.
  *   **If YES (Unequal Weight):** **STOP.** This concentrates manipulation power. If a senior maintainer games the system, the impact is multiplied. This violates standard "One Person, One Vote" governance norms. **Requires Human Override.**

  ---

  ## Part 2: Human Override Protocol
  *Triggered only if Gate 3 or Gate 4 returns STOP.*

  This is not a logic check. This is a business/political decision. To proceed, the Lead Maintainer or Steering Committee must sign off on the following:

  1.  **Acknowledge Risk:** "We acknowledge this system is mathematically provable to be gameable."
  2.  **Justify Exception:** "We accept the risk because [Business Reason / Political Necessity]."
  3.  **Mitigation Plan:** "We will monitor for [Specific Manipulation Pattern] and reserve the right to veto outcomes manually."

  ---

  ## Part 3: Application to Your Mechanisms

  Here is how your three proposed mechanisms run through the procedure.

  ### Mechanism A: Plain Plurality Vote
  *Users pick one favorite proposal. Highest count wins.*

  1.  **Gate 1 (3+ Options):** YES. (Proceed)
  2.  **Gate 2 (Single-Peaked):** NO. (Projects are distinct, not a spectrum). (Proceed)
  3.  **Gate 3 (Vulnerability):** **YES.** Plurality is the most gameable system (Vote Splitting, Spoiler Effect).
  4.  **Gate 4 (Power):** NO. (Equal weight).
  *   **Result:** **STOP at Gate 3.**
  *   **Engineering Verdict:** Do not ship. It encourages users to vote against their true preference to block rivals.
  *   **Fix:** Switch to Ranked Choice or Score Voting.

  ### Mechanism B: Instant-Runoff (Ranked Choice)
  *Users rank proposals. Lowest ranked eliminated, votes transferred.*

  1.  **Gate 1 (3+ Options):** YES. (Proceed)
  2.  **Gate 2 (Single-Peaked):** NO. (Proceed)
  3.  **Gate 3 (Vulnerability):** NO. (IRV is resistant to *some* tactics, though not immune to G-S). (Proceed)
  4.  **Gate 4 (Power):** NO. (Equal weight).
  *   **Result:** **SHIP IT.**
  *   **Engineering Verdict:** This is the safest standard option. It satisfies the procedure without triggering a Stop. It is still theoretically gameable (per G-S), but the manipulation is complex enough to be a low practical risk.

  ### Mechanism C: Custom Weighted Scheme (Senior Maintainers 2x)
  *Users rank proposals. Senior maintainer votes count double.*

  1.  **Gate 1 (3+ Options):** YES. (Proceed)
  2.  **Gate 2 (Single-Peaked):** NO. (Proceed)
  3.  **Gate 3 (Vulnerability):** NO. (Ranked input helps). (Proceed)
  4.  **Gate 4 (Power):** **YES.** (Seniors have 2x weight).
  *   **Result:** **STOP at Gate 4.**
  *   **Engineering Verdict:** **The Checklist Kills This.**
      *   **Why:** The procedure flags that unequal weighting concentrates the *ability to manipulate*. If a senior maintainer lies about their preference to game the system, they do double the damage of a regular user. It violates the "Equal Weight" heuristic used to legitimize democratic outcomes.
      *   **The "Hated" Outcome:** Mathematically, this works fine. But the governance checklist flags it as a risk to community trust.

  ---

  ## Part 4: The Human Override (For Mechanism C)

  Since you likely *have* to ship Mechanism C (political necessity to keep seniors engaged), here is exactly how you execute the override on Monday:

  **Override Form:**
  *   **Trigger:** Gate 4 Failure (Unequal Weight).
  *   **Acknowledgement:** "We acknowledge that weighting senior votes 2x increases the impact of strategic manipulation by seniors."
  *   **Justification:** "Senior maintainers carry long-term liability for code decisions; their higher weight reflects higher risk exposure, not just preference."
  *   **Mitigation:** "We will log all voting patterns. If a senior maintainer's ranking deviates significantly from consensus without technical justification, the Steering Committee reserves the right to audit the vote."
  *   **Sign-off:** [CTO / Project Lead Signature]

  **Action:** Once signed, you may merge the Weighted Scheme code. The checklist is satisfied not by logic, but by explicit risk acceptance.

  ---

  ## Summary for the Team
  1.  **Plurality:** Don't do it. (Fails Gate 3).
  2.  **IRV:** Safe to ship. (Passes all gates).
  3.  **Weighted:** Fails Gate 4 (Values Check). Requires Lead Sign-off to override the "Equal Weight" norm.

  **Note on Code vs. Judgment:**
  *   Gates 1 & 4 are **Logic Checks**. You can write unit tests for these. If `weights` are not uniform, the test fails.
  *   Gates 2 & 3 are **Judgment Calls**. You cannot code these. They require a design doc explanation.
  *   The **Override** is **Politics**. It requires a signature, not a commit hash.
