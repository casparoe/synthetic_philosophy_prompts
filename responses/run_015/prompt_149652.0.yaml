          *   *Requirement:* The prompt asks for the checklist to kill the weighted scheme, but politics require it. I need to structure the "Human Override" step to catch this.
          *   *Idea:* The checklist evaluates *fairness/equality* as a precondition for "ideal" voting, or simply highlights that weighted voting increases the *impact* of manipulation by seniors. Let's make Gate 4 about "Equity vs. Efficiency." The checklist says "Stop: Violates Equal Weight Assumption," but the Human Override says "Ship: Seniority is a business requirement."

