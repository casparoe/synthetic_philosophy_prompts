      *   *Implication:* You can't have a perfect system. You have to trade off.
      *   *Escape Hatches:*
          1.  Restrict the domain (e.g., single-peaked preferences).
          2.  Allow randomness (not suitable for funding boards usually).
          3.  Accept manipulation risk.
          4.  Limit candidates (2 options).
          5.  Dictatorship (one person decides).

  3.  **Drafting the Decision Procedure (The "G-S Sanity Check"):**
      *   *Step 1: Domain Restrictions.* Can we assume preferences are structured? (Single-peaked is the classic escape).
      *   *Step 2: Candidate Count.* Are there only 2 options? (G-S doesn't apply).
      *   *Step 3: Determinism.* Is there randomness? (Usually no for funding).
      *   *Step 4: Dictatorship.* Is one person deciding? (No).
      *   *Step 5: Strategy-Proofness Check.* If we passed above, is the specific mechanism known to be strategy-proof under these conditions?
