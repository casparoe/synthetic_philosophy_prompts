prompt: |-
  hey, im a backend engineer with basically zero philosophy background and we're shipping a ranking module for our open-source maintainer board -- users rank funding proposals and we aggregate them. someone mentioned the gibbard-satterthwaite theorem and now im worried any aggregation rule we pick can be gamed if people lie about their preferences. can you turn that theory into an actual reusable decision procedure my team can run before we commit to code? i want ordered steps with yes/no gates: first check whether our domain is restricted enough, then check for strategy-proofness conditions, then identify where manipulation is unavoidable and we have to accept risk or change inputs. be explicit about what counts as a sufficient answer at each gate, where the procedure stops with a clear "ship it" or "stop, redesign," and where it has to hand off to a human because its a values call not a logic check. include the specific conditions that have to hold for strategy-proofness to even be possible, and flag which steps are actually checkable in code versus judgment calls dressed up as procedure. then apply the whole thing to three mechanisms: plain plurality vote, instant-runoff ranked choice, and our custom weighted scheme where senior maintainers get 2x points. make sure one result is something we'll hate -- like the checklist kills our weighted scheme but its politically necessary -- and tell me exactly where the human override has to happen. also please dont ask me to read papers or give bibliographies, i just need to use this on monday and maybe miss a comma or two in my prompt.
