      *   **Point 4: Defending the Four.** The list isn't ad hoc. It covers all possible ways knowledge arises: direct contact, marked connection, similarity, and reliable word. A thermometer is a "mark" of the temperature.
      *   **Point 5: Validity.** The validity comes from successful action (e.g., adjusting the thermostat), not the feeling of certainty.

