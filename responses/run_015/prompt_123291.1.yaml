      *   I must defend *anumāna* (inference) as the correct category without making it seem like an empty label.
      *   I must uphold *parataḥ prāmāṇya* (validity is extrinsic).

  3.  **Formulate the Argument:**
      *   **Point 1: Perception vs. Inference.** The user is right that seeing numerals isn't perceiving temperature directly. Temperature is not a proper object of visual *pratyakṣa* (perception). So, it's not perception.
      *   **Point 2: The Nature of Inference (*Anumāna*).** The user claims inference requires conscious reasoning (*hetu*, *vyāpti*). Classical Nyaya distinguishes between *svārtha-anumāna* (inference for oneself, which involves mental steps) and *parārtha-anumāna* (inference for others, formalized). However, there's also the distinction between explicit deliberation and the causal structure of the cognition. Just because the steps aren't verbally articulated doesn't mean the causal structure isn't inferential. The connection between the numerals (mark/*liṅga*) and the temperature (thing marked/*liṅgin*) is based on a known pervasion (*vyāpti*), even if habitual.
