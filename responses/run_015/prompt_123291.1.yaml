answer: |-
  You confuse the phenomenology of deliberation with the causal structure of knowledge production. Just because you do not verbally articulate the *hetu* (reason) or consciously recall the *vyāpti* (universal pervasion) does not mean the cognition is not generated by that structure. When you first learned to use the thermometer, you established a connection between the numeral-display and the thermal state. That initial training installed the pervasion. Now, the cognition arises swiftly from the *liṅga* (mark) to the *liṅgin* (thing marked). That is precisely *anumāna* (inference). If you claim this requires a new *pramāṇa* (instrument of knowledge), show me the distinct causal mechanism that is not reducible to contact, marking, similarity, or word.

  Your charge that this makes the list unfalsifiable is empty. We define the instruments by how the cognition is produced, not by how long it takes you to think. *Pratyakṣa* (perception) requires sense-object contact; temperature is not visible light, so sight cannot grasp it directly. *Śabda* (testimony) requires a reliable speaker with intent; a machine has no intent to testify, it is merely a tool. That leaves inference. The validity of this cognition is *parataḥ prāmāṇya* (extrinsic validity)—you confirm it when you feel the heat or the AC kicks on. If the thermometer lies, the cognition fails to yield successful action.

  The four cover all bases: direct presence, mediated connection, similarity, and reliable word. There is no fifth way for the mind to latch onto reality. To posit a fifth instrument because you dislike the label "inference" for habitual reasoning is to multiply entities without necessity. The mechanism is inferential, the validity is confirmed by action, and the list remains complete. Stop looking for gaps where there are only habits.
