          *   Exactly four *pramāṇas* (instruments of knowledge): *pratyakṣa* (perception), *anumāna* (inference), *upamāna* (comparison), *śabda* (testimony).
          *   *Parataḥ prāmāṇya*: Validity is extrinsic, established afterward by successful action (*pravṛtti-sāmarthya*).
      *   **Tone:** Sharp, not polite, concede small fair points, never concede on the number four.
      *   **Format:** 2-3 short paragraphs per reply. Gloss Sanskrit terms on first use. No text/author citations. Argue from the inside.
