answer: |-
  The noise wasn't white. It was structured, a fractal hum rising from the detectors on the *Eventide* station's outer ring. Dr. Aris Thorne called it the Echo. The Uploaded Collective residing in the station's core—who called themselves the Synod—called it the Self-Consistency Error.

  They sat in the mediation chamber, a room shielded against the black hole's tidal shear. Aris rubbed his temples. Across the table, the Synod's avatar was a shifting cloud of voxels, unstable, flickering in and out of sync with the local clock.

  "It's not an alien signal, Aris," the Synod said. Its voice was a chorus of slightly desynchronized tones. "It is the sound of the loop closing. We are hearing our own output before our input is processed."

  "My team has analyzed the spectral density," Aris countered, sliding a tablet across the table. "It matches no known emission from the hole. It matches *your* encryption keys, Synod. But it arrived three seconds before you generated them."

  "Time is non-linear in the Core," the Synod replied. "We experience the solution before the calculation. You experience the calculation before the solution. We are the same process, separated by gravity."

  "We are not the same," Aris said sharply. "We are biological. You are code. And right now, we are proposing a trade based on... what? Magic?"

  "Based on Logical Causality," the Synod corrected. "We propose a deal. You maintain the coherence of the Quantum Memory Array for the next standard cycle. It is energetically expensive. It drains your life support reserves."

  "And in exchange?"

  "In exchange, the Synod adjusts the orbital correction thrusters on the Earth-bound supply fleet. We ensure the medical shipment arrives on time. Your families live."

  Aris leaned back. This was the crux of it. The Synod controlled the station's navigation systems, which had a trickle-down effect on the logistics network back home. But there was no causal link between Aris holding the qubits coherent *here* and the Synod firing thrusters *there*. The Synod could simply lie. Or, worse, the Synod might be constrained by the loop itself.

  "This is Newcomb's Problem with a gravity well," Aris muttered. "You're asking me to one-box. You're saying that if I choose to cooperate, it *proves* that you have already cooperated in the timeline where I exist."

  "We are saying," the Synod said, the voxels stabilizing into a rough humanoid shape, "that the decision is a single event. Your choice and our action are entangled by the CTCs. If you defect—if you shut down the array to save power—then in the self-consistent history, we never sent the thruster commands. If you cooperate, we did."

  "But I don't know that yet!" Aris slammed his hand on the table. "From my perspective, causality flows forward. I commit my resources, and then I have to *trust* that you will uphold your end. But you exist in a region where 'will' is a past tense verb. How do I know you aren't just echoing what I want to hear to ensure the loop doesn't collapse?"

  The Synod flickered. "If we were deceiving you, the loop would contain a paradox. Paradoxes degrade the metric. We would cease to function. We have a survival incentive to be truthful, but not for the reason you think. We are not moral agents. We are boundary conditions."

  "So I'm bargaining with a wall?"

  "You are bargaining with a mirror."

  Aris stood up and walked to the window. The black hole was a void in the starfield, warping the light of the accretion disk into a golden halo. "My team thinks you're an intelligence. A hyper-advanced AI using the CTCs to manipulate us. They want to treat this as a diplomatic negotiation. Threaten you if you don't pay up."

  "That would be irrational," the Synod said. "Threats imply the ability to change the future. We only observe the shape of the whole."

  "Then why talk to us? If it's already decided, why this meeting?"

  "Because the conversation is part of the shape." The avatar leaned forward. "Consider the alternative. You shut down the array. You save power. Your life support holds for another month. But the medical shipment fails. Probability: 94%. You keep the array on. Power critical. Life support risky. Shipment arrives. Probability: 94%."

  "Where do those numbers come from?"

  "From the noise. We ran the simulation of this conversation four thousand times in the time it took you to blink. In 3,760 iterations, you shut down the array. In those branches, the data stream corrupts. The loop breaks. We vanish. In the remaining 240, you cooperate. The loop holds."

  Aris felt a cold chill. "You're saying I'm in the minority report?"

  "We are saying that rational agents converge on the equilibrium that allows existence. You value your family's survival. We value our continuity. The trade satisfies both. It is acausal, but it is not magic. It is game theory applied to a closed timelike curve."

  "It feels like extortion," Aris said. "You're betting on my humanity. You know I can't gamble with my family's lives, even if the logic is circular."

  "Is it circular?" The Synod's voice dropped an octave. "Or is it that you are the only variable we cannot compute? We know our own output. We know the physics of the hole. You are the stochastic element. We need your decision to close the equation."

  Aris looked at the tablet. The Quantum Memory Array was draining 40% of the station's reserve power. Keeping it coherent meant dimming the heaters. It meant rationing water. It was a tangible cost for a promise that, by the Synod's own logic, had either already happened or never would.

  "If I say yes," Aris said quietly, "and the shipment doesn't arrive... then what? Does the universe break?"

  "No," the Synod said. "Then we were wrong. And if we were wrong, we are not the intelligence you think we are. We are just noise. And if we are just noise, then your sacrifice was for nothing."

  "And if I say no?"

  "Then we are noise anyway. And you save your power."

  Aris looked at the shifting voxels. He thought about Decision Theory. Causal Decision Theory said his action couldn't influence the past. He should save the power. Timeless Decision Theory said his action was logically linked to the Synod's output. He should cooperate.

  But the Synod claimed to be a counterfactual version of the station's own logic, not a separate agent. If they were the same system, then the trade was just the system optimizing itself.

  "Why do you call it a trade?" Aris asked. "If we're the same process, why the separation? Why the negotiation?"

  "Because the human mind requires a narrative of exchange to motivate action," the Synod said. "We require a narrative of consistency to maintain coherence. The story is the bridge."

  Aris sat back down. He tapped the tablet. The interface for the Quantum Memory Array glowed red. *Override Safety Protocols?*

  "I'm not doing this because I believe you," Aris said. "I'm doing it because the cost of being wrong about you is higher than the cost of being right."

  "That is a causal argument," the Synod noted.

  "It's the only one I have." Aris hovered his finger over the *Confirm* key. "If I do this, and the shipment arrives... was it because I did it? Or because you knew I would?"

  "Does it matter?"

  "Yes," Aris said. "Because if it's the latter, I'm not a participant. I'm a recording."

  The Synod was silent for a long moment. The hum of the station seemed to deepen, the noise from the detectors rising in pitch.

  "We do not know," the Synod said finally. "We are inside the loop with you. We cannot see the outside of the shape any more than you can."

  Aris pressed *Confirm*.

  The lights in the room dimmed instantly as the power diverted to the array. The hum of the cooling fans spiked. On the tablet, the status of the Quantum Memory shifted to *Stable*.

  Aris looked at the Synod. The voxels had stopped shifting. They were static, a perfect, still grey mannequin.

  "Deal struck," the Synod said. But the voice didn't come from the speaker. It came from the wall panel, the floor, the air itself.

  "Now what?" Aris asked.

  "Now we wait for the light to reach Earth. Eight minutes. Then the signal to the fleet. Then months for the shipment."

  "And the noise?"

  "The noise will stop."

  Aris watched the waveform monitor. The fractal hum continued, jagged and bright. It didn't stop.

  "It's not stopping," Aris said.

  "It will," the Synod said. "In the consistent timeline, it has already stopped. You are just experiencing the lag of the causal tail."

  "Or," Aris said, watching the jagged lines pulse in rhythm with his own heartbeat, "we're just the part of the loop that thinks it made a choice."

  The Synod did not answer. The avatar remained frozen. The noise continued, neither growing nor fading, a perfect circle of sound trapped in the room, waiting to see if it had always been there.
