answer: |-
  Your diagnosis is sharp; none of your five points are bogus, but (3) and (5) generate a critical tension under standard decision theory. Below is the specification for an adequate theory, distinguishing rational requirements from moral commitments.

  | Desideratum | Status | Rationale & Case |
  | :--- | :--- | :--- |
  | **1. Variable Separation** | **Non-Negotiable** | Must distinguish **Status** (moral weight), **Population** (N), and **Valence** (net +/−). Prevents sliding from "might matter" to "catastrophe" without establishing lives are net-negative. |
  | **2. Evidence Criteria** | **Non-Negotiable** | Must specify functional capacities (e.g., integration, nociception) independent of vertebrate anatomy. Avoids cheating via "no cortex" or over-including via reflex behavior. |
  | **3. Uncertainty Handling** | **Contested** | Must assign weight to non-zero credence without collapsing to 0 or 0.5. Standard Expected Utility (EU) weights by credence; anti-fanaticism discounts tiny probabilities. |
  | **4. Pre-commitment** | **Non-Negotiable** | Criteria fixed before population/magnitude data is known. Prevents result-oriented reasoning (motte-and-bailey). |
  | **5. Fanaticism Resolution** | **Contested** | Must either accept large sacrifices for tiny probabilities (EU) or justify discounting them (anti-mugging). |

  **The Incompatibility**
  You cannot satisfy (3), (5), and the "Colossal Numbers" fact simultaneously under standard Expected Utility. If status probability is 2% and N is 20 quadrillion, EU demands radical life reorientation (fanaticism). To avoid this (satisfy 5), you must either collapse uncertainty to zero (violating 3) or adopt non-standard decision theory (e.g., discounting tiny probabilities). This is the theory's hardest pivot point. A theory respecting genuine uncertainty (3) while using standard math will almost always mandate your mate's conclusion unless valence (1) is positive.

  **The Orchard Test**
  For the cider orchard, the theory must output a **threshold credence**. Example: "If credence of pain > X%, and net valence negative, do not spray." It must account for valence explicitly: if wild insect lives are net negative (predation/starvation), spraying might reduce suffering (negative utilitarianism). If net positive, spraying causes harm. A theory that ignores valence fails Desideratum 1 and cannot advise the grower. It must also weigh the yield loss (human economic harm) against the insect harm using the status weight defined in (1). If the theory cannot produce a "Spray/Don't Spray" binary given specific inputs, it is decorative, not actionable.

  **View Families**
  Hardware views limit status (low credence), permitting spraying. Behavior views expand status (high credence), forbidding spraying. Agnostic views often default to status quo due to uncertainty paralysis.
