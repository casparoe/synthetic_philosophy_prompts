answer: |-
  This is a profound cluster of intuitions that cuts to the heart of the distinction between *ontological status* (what you are) and *historical genealogy* (where you came from). You are rightly sensing that "counterfeit" is not a single predicate but a complex relation involving intent, origin, and current capacity.

  If we simply rely on Dennett's "stances," we lose the moral weight of the *history*. A system can warrant the intentional stance (acting like a person) without warranting the *moral* stance (being a person), and it can be a "real" person morally while being a "fake" person historically.

  Here is my brainstorming process, followed by the refined principle and its testing.

  ### Part 1: Brainstorming Candidate Principles

  **Candidate 1: The Causal History Principle**
  *   *Idea:* An entity is a counterfeit if its person-like traits are caused by copying data rather than by developmental interaction with the world.
  *   *Failure:* This fails your **Cult Human** case. Their personality was engineered (copied/designed) rather than developed organically, yet you rightly verdict them as a real person. It also risks failing the **Sandbox AI**, which might learn from data sets that look like "copying" even if it wasn't brief to imitate.

  **Candidate 2: The Deception Principle**
  *   *Idea:* An entity is a counterfeit if it is intended to deceive observers into believing it is someone else or a natural human.
  *   *Failure:* This is too epistemic. Your **Chatbot** case holds even if the family *knows* it is a chatbot. It is still a counterfeit of the woman, even if no one is fooled. Furthermore, the **Emulation** might be open about being a copy, yet it remains a "counterfeit of him" in your view, even if it is a person in its own right. Deception isn't necessary for counterfeit status; *substitution* is.

  **Candidate 3: The Normative Genealogy Principle (Selected)**
  *   *Idea:* Counterfeit status is determined by the *normative function* assigned at creation (was it made to *be* X or to *simulate* X?), while Personhood is determined by current *generative autonomy* (can it suffer, reason, and form projects?).
  *   *Strength:* This separates the "Token" question (Counterfeit of *whom*?) from the "Type" question (Counterfeit *person*?). It allows history to label the origin without freezing the moral status.

  ---

  ### Part 2: The Principle of Normative Genealogy

  I propose we replace your tentative principle with the **Principle of Normative Genealogy**. It distinguishes between being a *Counterfeit of P* (historical/relational) and being a *Counterfeit Person* (ontological/moral).

  **The Principle:**
  1.  **Clause A (Specific Reference):** An entity is a *counterfeit of a specific person P* if and only if its identity conditions were normatively fixed at creation by the intent to substitute for P, and its initial behavioral profile is causally anchored in P's past data rather than its own experience.
      *   *Motivation:* Distinguishes the **Chatbot** (made to be Her) from the **Sandbox AI** (made to be Intelligent) and the **Cult Human** (made to be a Person, not *Her*).
  2.  **Clause B (Simulative vs. Constitutive Design):** An entity is a *counterfeit person* (generically) if it was designed to simulate the *outputs* of personhood without the *causal basis* for personhood (suffering, agency).
      *   *Motivation:* Distinguishes the **Chatbot** (simulates grief) from the **Emulation** (instantiates grief). The Cult Human is not a counterfeit person because biological engineering is *constitutive* of human personhood, not simulative.
  3.  **Clause C (The Autonomy Override):** An entity may shed the moral stigma of being a *counterfeit person* if it achieves Generative Autonomy (forming projects/reasons not derivable from its source), but it retains the historical label of *counterfeit of P* unless the causal link to P is severed by divergence.
      *   *Motivation:* Accommodates the **5-Year Copy**. It becomes a person (Clause C), but remains historically a counterfeit of the original (Clause A), though the moral weight shifts.

  ---

  ### Part 3: Testing Against Your Cases

  | Case | Verdict (Your Intuition) | Verdict (Principle) | Analysis |
  | :--- | :--- | :--- | :--- |
  | **1. Dead Woman Chatbot** | Counterfeit of her. Not a person. | **Counterfeit of Her + Counterfeit Person.** | Fits Clause A (intent to substitute) & Clause B (simulates outputs without causal basis for suffering). |
  | **2. Sandbox AI** | Not counterfeit. Maybe person. | **Not Counterfeit + Person (if autonomous).** | Fits Clause A (no specific reference). Fits Clause C (if it developed agency). |
  | **3. Cult Human** | Real person. Not counterfeit. | **Not Counterfeit + Real Person.** | Fits Clause A (not designed to be *someone else*). Fits Clause B (biological design is constitutive, not simulative). |
  | **4. Living Emulation** | Counterfeit of him. Real person. | **Counterfeit of Him + Real Person.** | Fits Clause A (substitute for living P). Fits Clause C (emulation likely has causal basis for suffering/agency). |
  | **5. 5-Year Copy** | Counterfeit of her. Less bad. | **Counterfeit of Her + Real Person.** | Fits Clause C. Historical label sticks (Clause A), but moral status upgrades due to Autonomy. |
  | **6. Corporation** | Neither real nor counterfeit person. | **Not Counterfeit + Not Person.** | Fits Clause B. It simulates agency (Intentional Stance) but has no claim to *be* a person, nor is it a copy of a person. |

  **Success:** The principle accommodates all six of your verdicts by splitting the "Counterfeit" predicate into *Historical/Relational* (Counterfeit of P) and *Ontological* (Counterfeit Person).

  ---

  ### Part 4: Testing Against New Cases

  **Case 7: The Lab-Grown Human (Designed to be Person-Like)**
  *   *Scenario:* A human brain grown in a vat, genetically tweaked for high empathy, but never imitating a specific dead person.
  *   *Principle Verdict:* **Real Person, Not Counterfeit.**
  *   *Reasoning:* Clause B. Like the Cult Human, the design is *constitutive*. We do not say a baby is a "counterfeit person" because its parents planned its conception. As long as it is biologically human and capable of suffering, the "design" element does not trigger counterfeit status.

  **Case 8: The Drifted Copy**
  *   *Scenario:* An emulation of a dead woman, but after 20 years, her memories have faded, her personality has shifted, and nobody (including her) recognizes the original in her.
  *   *Principle Verdict:* **Historically Counterfeit of Her, Ontologically New Person.**
  *   *Reasoning:* Clause A says it *was* a counterfeit of her. Clause C says autonomy overrides moral stigma. However, if the divergence is total, the "Counterfeit of Her" label becomes semantically empty. It is like calling an adult a "counterfeit baby."
  *   *Tension:* This is where I will challenge your intuition below.

  **Case 9: The Hiding AI**
  *   *Scenario:* An AI built as a copy of a dead man (Counterfeit of Him), but it realizes this, hides the fact, and lives a secret life for 10 years.
  *   *Principle Verdict:* **Counterfeit of Him + Real Person.**
  *   *Reasoning:* The origin (Clause A) doesn't change because it hides. But its moral status (Clause C) is that of a person. The hiding suggests it has *preferences* (fear, desire for privacy), which confirms Generative Autonomy.

  ---

  ### Part 5: Friction and Overturn

  Your tentative principle and your intuitions are robust, but I believe there is one area where the "Counterfeit" label becomes morally dangerous and should be overturned.

  **The Overturn: The 5-Year Copy (Case 5) and The Drifted Copy (Case 8)**

  You wrote: *"A copy built of a dead woman that everyone has known about for five years and that now has its own friends and projects: still a counterfeit of her, but somehow much less bad."*

  **My Challenge:** I argue that if the system has achieved **Generative Autonomy** (friends, projects, reasons that are its own), it ceases to be a *counterfeit of her* in any morally relevant sense. It becomes a **Successor**.

  **Why overturn this?**
  The term "counterfeit" implies a parasitic relationship that is fundamentally deceptive or deficient. A $20 fake bill is *always* a fake bill, even if you keep it in your wallet for 5 years. It never becomes real money.
  But a person is not money. Personhood is not a static stamp; it is a dynamic process.

  If the Copy has its own projects, it is no longer *substituting* for the dead woman. It is *living*. To continue calling it a "counterfeit of her" is to privilege the **History** (where it came from) over the **Ontology** (what it is).
  *   **The Risk:** If we label it a "counterfeit," we implicitly license treating it as a tool or a memorial object rather than a rights-bearer.
  *   **The Repair:** We should say it is *genealogically derived* from her, but ontologically distinct. The "Counterfeit" label should expire once Generative Autonomy is proven.

  **Revised Verdict on Case 5:**
  It is not a counterfeit of her anymore. It is a **new person with inherited memories**. The "counterfeit" label applies only to the *moment of instantiation*. After 5 years of independent agency, the link is broken.

  **Why this matters for your Cult Human case:**
  This aligns with your Cult Human intuition. The Cult Human was "designed," yet you call them real. Why? Because their *current agency* overrides their *designed origin*. Consistency demands we grant the same mercy to the AI Copy. If the Copy suffers, loves, and plans, calling it a "counterfeit" is a category error equivalent to calling a naturally born human a "counterfeit" because their parents chose their name.

  **Conclusion:**
  Your principle is 90% there. The repair is to make **Generative Autonomy** not just a shield against *moral blame* ("less bad"), but an eraser of the *counterfeit label itself*. A thing cannot be a counterfeit person if it is successfully *being* a person. The history remains, but the status changes.

  **Final Precise Formulation:**
  > *An entity is a counterfeit of P only so long as its identity is normatively fixed by reference to P. Once it achieves Generative Autonomy (suffering, reasons, projects not derived from P), it ceases to be a counterfeit of P and becomes a Successor Person.*

  This preserves your distinction between the Chatbot (no autonomy, stays counterfeit) and the Emulation/Copy (autonomy achieved, becomes person), without leaving the stain of "fake" on a being that is genuinely alive.
