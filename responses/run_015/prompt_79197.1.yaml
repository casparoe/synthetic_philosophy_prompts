answer: |-
  The coexistence of the Nordic, Legalization, and Decriminalization regimes reveals not merely policy disagreements, but divergent metaphysical and ethical commitments regarding the nature of sex, the capacity for agency, and the legitimate scope of state power. Each regime attempts to solve the "problem" of prostitution through a distinct philosophical lens, yet each contains tensions between its stated principles and its operational mechanics.

  ### I. The Nordic Model: Asymmetrical Criminalization

  **Implicit Commitments**
  The Nordic model (criminalizing the purchase but not the sale of sex) rests on a specific theory of **asymmetrical agency**. It presupposes that the seller operates under conditions of constrained choice so severe that their consent is structurally compromised, whereas the buyer operates with full autonomy. Consequently, the seller is categorized primarily as a **victim** rather than a moral agent, while the buyer is the **perpetrator**.

  **Location of Wrongdoing and Buyer Culpability**
  The wrongdoing is not located solely in the individual transaction's potential for harm (e.g., violence or disease), but in the **institutional harm** prostitution inflicts upon women as a class. This draws from radical feminist theory (e.g., MacKinnon), which posits that prostitution reinforces a patriarchal status hierarchy. The buyer is culpable not necessarily because they harm the specific individual seller (who is legally absolved), but because they are **complicit in a practice that degrades the social status of women**. It is a theory of *status harm* rather than direct interpersonal harm.

  **Strict Requirements vs. Fit**
  *   **Strictly Requires:** The decriminalization of the seller. If the seller is a victim, punishing them is unjust.
  *   **Merely Fits With:** The criminalization of the buyer. While the model argues this reduces demand, a consistent application of the "victim" thesis could arguably require the state to intervene more aggressively to "rescue" sellers, or conversely, to treat the transaction as void *ab initio* without criminal penalties for either (treating it as a social welfare issue entirely).
  *   **Underdetermination:** The arrangement is philosophically underdetermined between **feminist abolitionism** (prostitution is violence) and **soft paternalism** (sellers cannot truly consent due to economic desperation). Both license the same asymmetrical laws, though they differ on whether the goal is gender equality or individual welfare.

  **Inconsistency and Resolution**
  *   **Apparent Inconsistency:** If the transaction is inherently harmful enough to criminalize the buyer, why is the seller permitted to engage in it? If I cannot ethically buy a stolen good, you should not be ethically permitted to sell it.
  *   **Resolution:** The inconsistency dissolves if one accepts the **pragmatic harm-reduction presupposition**. Defenders concede that criminalizing the seller drives the trade underground, increasing danger. Thus, the seller's legal immunity is not an endorsement of their agency, but a concession to their vulnerability.
  *   **Genuine Tension:** Defenders must concede a tension regarding **agency**. By allowing the sale, the state implicitly recognizes some capacity for choice; by criminalizing the purchase, it denies the validity of that choice. The model straddles the line between respecting autonomy and denying it.

  ### II. The Legalization Model (Germany/Netherlands): Risk Management

  **Implicit Commitments**
  The legalization model presupposes that sex is a **commodifiable service**, but one that carries unique risks requiring state management. It treats sex work as a hybrid category: economically akin to work, but biologically and morally distinct enough to warrant special surveillance.

  **Commodification and the Nature of Work**
  This regime presupposes that sex work *can* be work, but it is **work plus**. The requirement for registration and mandatory condom use (as in Germany's 2017 Act) reveals that the state does not view the sex worker's body as fully sovereign in the way it views a construction worker's or a chef's body. In ordinary trades, the state regulates safety conditions (helmets, hygiene) but does not typically mandate specific bodily acts (condom use) or require a public registry of individual workers that marks them as a distinct class.

  **Strict Requirements vs. Fit**
  *   **Strictly Requires:** A licensing framework to distinguish "legal" from "illegal" sex work.
  *   **Merely Fits With:** The claim of normalization. Registration and health mandates fit with a **public health containment** theory better than a **labor rights** theory.
  *   **Underdetermination:** The licensing regime is underdetermined between **liberal toleration** (allowing a vice to exist safely) and **bureaucratic control** (maintaining a state database of sexual activity). A libertarian theory of work would license brothels but oppose worker registries; a moralist theory would support registries to monitor "deviants." The current law satisfies both.

  **Inconsistency and Resolution**
  *   **Internal Inconsistency:** The regime claims to normalize sex work as a profession, yet the registration requirement creates a **stigmatized category**. If sex work were truly "work like any other," a sex worker would register their business like a plumber, not their body like a patient.
  *   **Resolution:** This inconsistency dissolves only if one admits the presupposition that sex work is a **public health vector**. The state is not regulating labor; it is regulating disease and order.
  *   **Genuine Tension:** Defenders must concede that the "Prostitutes Protection Act" prioritizes state oversight over worker privacy in a way that would be unconstitutional in other trades. The regime treats the worker as a site of risk to be managed, contradicting the "ordinary occupation" rhetoric.

  ### III. The Decriminalization Model (New Zealand): Labor Rights

  **Implicit Commitments**
  The New Zealand model presupposes that sex work is an **ordinary employment relation**. It relies on a robust conception of **agency**, viewing sex workers as rational actors capable of contracting labor. The state's role is to enforce labor standards (minimum wage, safety) rather than to license morality or manage health directly.

  **The Migrant Exclusion and the Employment Relation**
  The barring of migrant workers on temporary visas creates a fissure in this philosophy. If sex work is ordinary work, it should be subject to ordinary migration rules (e.g., seasonal work visas exist for agriculture and hospitality).
  *   **Analysis:** This exclusion suggests the regime still conceives of sex work as a **special category** where the state must control participation to protect "social cohesion" or prevent "sex tourism."
  *   **Strict Requirements vs. Fit:**
      *   **Strictly Requires:** The removal of criminal penalties for soliciting and brothel-keeping to allow labor law application.
      *   **Merely Fits With:** The migrant exclusion. This fits with **border sovereignty** priorities but contradicts the **universal labor rights** presupposition.
  *   **Underdetermination:** The decriminalization of locals is underdetermined between a **libertarian rights** view (my body, my choice) and a **pragmatic harm-reduction** view (criminalization makes it dangerous). Both lead to decriminalization.

  **Inconsistency and Resolution**
  *   **Internal Inconsistency:** A regime based on "work rights" that excludes a vulnerable class of workers (migrants) from those rights undermines its own foundation. It creates a two-tiered workforce where the most vulnerable are forced back into the illegal market.
  *   **Resolution:** The inconsistency dissolves if the presupposition is amended: Sex work is ordinary work *for citizens*, but a **social risk for non-citizens**.
  *   **Genuine Tension:** Defenders must concede that the migrant ban is a concession to political reality (immigration control) that compromises the philosophical purity of the "sex work is work" model. It reveals that the state retains a moral gatekeeping role regarding *who* may sell sex, even if it relinquishes the role of *whether* sex may be sold.

  ### IV. Evaluation and Definite Position

  **Most Coherent: The Decriminalization Model (New Zealand)**
  Despite the flaw regarding migrant workers, the New Zealand model possesses the most coherent set of commitments regarding **harm, agency, and the state**.
  *   **Reasoning:** It aligns its legal mechanics with its philosophical premise. If one accepts that adults have agency over their bodies, the state's role is to ensure safety and contract enforcement, not to license morality (Legalization) or deny the validity of consent (Nordic).
  *   **Handling Tension:** The migrant exclusion is a recognized political compromise rather than a core philosophical feature. The core framework (labor law application) logically follows from the premise of agency. It minimizes state intrusion into private life while maximizing worker protection.

  **Least Coherent: The Legalization Model (Germany/Netherlands)**
  The Legalization model has the least coherent commitments.
  *   **Reasoning:** It suffers from a **category error**. It attempts to treat sex work as a business while regulating it as a vice. By mandating condom use and worker registration, it treats the sex worker's body as public property in a way that contradicts the concept of autonomous labor. It claims to normalize the industry while simultaneously creating a bureaucratic apparatus that ensures sex workers remain a marked, surveilled class.
  *   **Inconsistency:** It cannot decide if the worker is an entrepreneur (who should manage their own risk) or a vector of disease (who must be managed by the state). This leads to a regime that stigmatizes workers under the guise of protecting them.

  **The Nordic Model: A Strong Second**
  The Nordic model is internally consistent *if* one accepts its foundational premise: that prostitution is inherently exploitative and women's consent within it is systematically invalid. Its incoherence arises only when viewed through a liberal lens of agency. However, it is less coherent than Decriminalization because it relies on a **paternalistic contradiction**: it claims to empower women by criminalizing their clients, which often drives the market underground, potentially increasing the physical danger to the very "victims" it seeks to protect. It prioritizes a symbolic moral stance (demand is wrong) over the material safety of the worker.

  **Conclusion**
  The Decriminalization model is superior because it locates the harm of sex work not in the *nature* of the act (Nordic) or the *biology* of the worker (Legalization), but in the *power dynamics* of the employment relation. It is the only regime that attempts to solve the problem through **empowerment** rather than **control** or **abolition**. While the migrant exclusion is a blemish that reveals the limits of labor universalism in a nation-state system, it is an external constraint rather than an internal philosophical failure. The Legalization model fails because it conflates health safety with moral containment, and the Nordic model fails because it sacrifices the immediate safety of individuals for a theoretical victory over a patriarchal structure. Therefore, New Zealand's approach, grounded in labor rights and robust agency, offers the most philosophically defensible balance between state responsibility and individual liberty.
