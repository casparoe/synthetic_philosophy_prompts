answer: |-
  Here is the specification for a theory of morally permissible compromise, structured by the functional requirements necessary for an institution to broker a deal without becoming complicit in incoherence or corruption.

  ### The Specifications

  **1. The Non-Degradation Clause (The Clinic Constraint)**
  *The Requirement:* A compromise mechanism must not generate outcomes that are Pareto-inferior relative to the status quo of disagreement.
  *The Case:* You cited the clinic that half-honors conscientious objection and half-honors patient choice. If the doctor believes referral is complicity in murder, and the patient believes delay is harm to bodily autonomy, a 50/50 probabilistic split or a "partial referral" ensures the doctor participates in what they deem evil *and* the patient suffers what they deem harm. Both are worse off than a clear "no" or a clear "yes."
  *The Spec:* The theory must identify when the *structure* of the compromise violates the core norm of both parties. If the compromise requires both sides to violate their non-negotiables to achieve the middle ground, the theory must veto the deal. A theory of *gains* cannot authorize *losses*.

  **2. The Fungibility Boundary (The Offsetting Constraint)**
  *The Requirement:* The theory must explicitly rule on whether moral disvalue in Domain A can be netted out by moral value in Domain B.
  *The Case:* I do what you think is wrong (e.g., host a controversial speaker) and fund what you think is right (e.g., donate to a charity you support). Is this a trade or a bribe? For a consequentialist, this is utility maximization. For a deontologist, this is moral corruption; I have now *done* the wrong thing, and the good deed does not erase the agency of the sin.
  *The Spec:* The theory must declare whether values are commensurable. If it allows offsetting, it treats values as commodities. If it forbids offsetting, it treats values as integrity constraints. It cannot hedge; it must tell the institution whether "log-rolling" across moral categories is permissible.

  **3. The Convexity Protocol (The Intensity Constraint)**
  *The Requirement:* The outcome must not be a linear average of positions but must weight the intensity of conviction.
  *The Case:* Side A cares mildly about Issue X. Side B views Issue X as an existential threat. A 50/50 split treats these preferences as identical. This is not compromise; it is arithmetic tyranny.
  *The Spec:* The theory must incorporate a metric for "moral stake." If Side B's loss is catastrophic and Side A's gain is marginal, the permissible compromise must skew heavily toward B, even if A has equal voting power. A theory that defaults to equal division fails to track moral reality.

  **4. The Agency Preservation Clause (The Capitulation Constraint)**
  *The Requirement:* The outcome must be endorsable by the agents as morally licit, not merely tolerable as a strategic necessity.
  *The Case:* A truce (modus vivendi) is where I don't kill you because you are too strong to kill. A compromise is where I don't kill you because I recognize a reason not to. If the deal requires me to view my own action as "sinful but necessary," I have capitulated, not compromised.
  *The Spec:* The theory must ensure that both parties can sign the deal without self-betrayal. If one side signs thinking "I am doing evil to stop a greater evil," that is not a gain from trade; that is coercion by circumstance. The deal must be internally justifiable, not just externally imposed.

  ***

  ### Classification: Non-Negotiable vs. Camp Priors

  **Non-Negotiable (NN)**
  *These are logical prerequisites. If a theory fails these, it is not a theory of permissible compromise; it is a theory of something else.*
  1.  **Non-Degradation Clause:** If the deal makes everyone worse off, it is not a "gain from trade." It is a failure of negotiation.
  2.  **Agency Preservation Clause:** If the deal requires one party to admit they are acting impermissibly, the institution brokering it is facilitating sin, not compromise. "Permissible compromise" implies permission.

  **Camp Priors (CP)**
  *These depend on your underlying meta-ethics. A utilitarian institution will spec these differently than a rights-based institution.*
  1.  **Fungibility Boundary:** Consequentialists will spec this to allow offsetting (CP-Util). Deontologists will spec this to forbid it (CP-Deon). There is no neutral ground here; the institution must choose its moral ontology.
  2.  **Convexity Protocol:** Liberals/Democrats often prefer linear splits (one person, one vote) regardless of intensity (CP-Egal). Pluralists or Intuitionists prefer weighting by intensity (CP-Plural). This is a political choice, not a logical necessity.

  ***

  ### The Impossibility Subset

  Your suspicion is correct, but it runs deeper than third-party objection. The incompatibility lies between **The Non-Degradation Clause (NN)** and **The Fungibility Boundary (CP-Util)**.

  Here is the conflict:
  To achieve a "gain from trade" in deep value clashes, you usually need to trade off sacred values against secular gains (Offsetting).
  *   **If you allow Offsetting (CP-Util):** You satisfy the Pareto condition (both get net utility), but you violate the Agency Preservation Clause for the Deontologist. They cannot endorse the deal as *permissible*; they can only endure it as *lesser evil*. The deal becomes capitulation.
  *   **If you forbid Offsetting (CP-Deon):** You preserve Agency, but you often eliminate the possibility of a Pareto gain. If I cannot trade my "sin" for your "charity," and we disagree on the sin, there is no zone of agreement. The deal collapses.

  **The Third-Party Problem:**
  You asked about third parties who object to trading in that value at all. If the Institution brokering the deal treats a Sacred Value as tradeable (to satisfy the Non-Degradation Clause via Offsetting), the Institution itself violates the Sacred Value.
  *   **Result:** You cannot satisfy **Internal Pareto Efficiency** (both sides gain) AND **External Institutional Integrity** (the broker doesn't corrupt the value) when the value in question is defined by its non-tradeability.
  *   **The Incompatible Triad:**
      1.  Both parties judge the deal better than no deal (Internal Pareto).
      2.  The deal involves trading a value defined as non-tradeable (Offsetting).
      3.  The Institution remains neutral/permissible in brokering the trade (External Legitimacy).
      *Pick two.* If 1 and 2, the Institution is corrupt. If 1 and 3, the value wasn't actually sacred (it was tradeable). If 2 and 3, one party loses (no Pareto).

  ***

  ### The Single Knockout Requirement

  **The Fungibility Boundary.**

  This is the requirement that knocks out the most candidates. Most naive theories of compromise assume that "meeting halfway" is always possible. The Fungibility Boundary exposes that for many value systems, **there is no halfway.**

  If a value is agent-relative and non-fungible (e.g., "I must not kill"), no amount of compensation from the other side makes a compromise *permissible* for the holder of that value. They cannot sell their integrity. Therefore, any theory that assumes trade is possible (which is the definition of "gains from trade") is immediately disqualified for a vast swath of moral conflicts.

  A theory that respects the Fungibility Boundary admits that for clashing absolute values, **compromise is often impossible.** It forces the institution to admit it is not brokering a deal, but imposing a ruling. A theory that ignores the Fungibility Boundary produces "deals" that are actually acts of coercion disguised as negotiation. The former is honest but paralyzing; the latter is functional but fraudulent. The Fungibility Boundary is the filter that separates honest paralysis from functional fraud.
