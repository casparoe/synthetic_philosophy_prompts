  **MEMORANDUM**

  **TO:** All Risk and Compliance Staff
  **FROM:** Office of Epistemic Clearance (OEC)
  **DATE:** 14 October 2024
  **SUBJECT:** Policy Update 24-B: Risk-Weighted Epistemic Attestations

  **1.0 General Principle**
  Effective immediately, Meridian Trust adopts the position that knowledge attributions are indexed to the practical environment of the decision. An employee counts as knowing a proposition *p* only if their evidence meets the threshold required by the stakes of the action based on *p*. Knowledge is no longer a binary asset but a risk-weighted capacity.

  **2.0 Stakes-to-Evidence Exchange Rates**
  Staff must consult Schedule A to determine the evidence required for attestation.
  *   **Tier 1 (Low Stakes):** Standard verification procedures suffice. Attestation level: "Reasonable Assurance."
  *   **Tier 2 (High Stakes):** Enhanced due diligence required. Attestation level: "Certified Verification."
  *   **Tier 3 (Critical Stakes):** Evidence must be immune to skeptical defeat. Attestation level: "Absolute Certainty" (currently unavailable).

  **3.0 Classified-Stakes Provision**
  In matters involving systemic risk or regulatory sensitivity, the stakes classification itself is non-disclosable. Applicants cannot be informed of the stakes threshold they are required to meet. Consequently, applicants cannot determine whether their evidence is sufficient. This unknowability is a feature of the control environment, not a bug.

  **4.0 Authority and Recursion**
  The OEC retains sole authority to classify stakes. However, the OEC's classification rulings constitute knowledge claims subject to prevailing stakes. Therefore, the OEC's ability to define stakes is constrained by the stakes involved in defining them. In the event of a circularity conflict, the highest possible stakes classification applies by default.

  ***

  **FREQUENTLY ASKED QUESTIONS: BRANCH STAFF**

  **Q: Can I tell a customer "I know" their funds will clear?**
  **A:** No. The phrase "I know" has been withdrawn from approved scripts. It implies a static epistemic standing that violates Policy 24-B. Use the Attestation Ladder: "Based on current stakes, we hold a Tier 1 assurance."

  **Q: A customer's evidence hasn't changed, but you say they don't "know" their account is solvent. Why?**
  **A:** Their evidence is constant, but the stakes have risen due to market volatility. Under Policy 24-B, identical evidence yields knowledge at low stakes but fails to yield knowledge at high stakes. You must inform them their epistemic standing has degraded despite unchanged data.

  **Q: How do we handle large transactions that trigger Tier 2 evidence requirements?**
  **A:** Staff are encouraged to utilize "Epistemic Structuring." This involves decomposing one large high-stakes decision into a chain of many small low-stakes decisions. At each step, the stakes remain low, allowing the employee to legitimately claim knowledge at every stage. This service is billable under Advisory Fees.

  **Q: What if a customer asks why their standing degraded?**
  **A:** Refer to Section 3.0. If the stakes are classified, you cannot disclose them. If the stakes are public, explain that their evidence is now insufficient for the environment. Do not suggest they acquire more evidence; simply advise them to wait until stakes lower.

  ***

  **DISCIPLINARY CASE FILE: 2024-089**

  **Employee:** J. Doe, Senior Loan Officer
  **Incident:** Failure to Know
  **Date:** 18 October 2024

  **Summary:**
  On Monday, 14 October, Employee approved a commercial loan based on standard collateral verification. At that time, market volatility was low (Tier 1). On Friday, 18 October, Employee approved an identical loan for the same client using identical verification data. However, market volatility had spiked (Tier 2).

  **Finding:**
  The Evidence Base remained constant. The Stakes Environment changed. On Monday, Employee knew the client was solvent. On Friday, Employee did not know the client was solvent. By approving the Friday loan, Employee acted on a proposition they did not know. This violates the Knowledge Norm of Action.

  **Sanction:**
  Written warning. Employee must attend remedial training on Contextual Sensitivity. Note: Training availability is subject to stakes; if enrollment stakes are high, training content may be inaccessible to participants.

  ***

  **Apparatus Note**

  The satire targets Pragmatic Encroachment (knowledge depends on stakes) and Epistemic Contextualism (truth of "knows" claims depends on context). It is relatively settled among proponents that ordinary intuitions shift in "bank cases" (e.g., Hannah wants to deposit a check; if the stakes are high, we say she doesn't *know* the bank is open without checking). However, whether this shift is semantic (Contextualism), pragmatic (Invariantism), or metaphysical (Encroachment) is fiercely contested. The documents treat these as operational policy, conflating the norm of assertion with the norm of action. The "Classified-Stakes" wrinkle exaggerates the problem of "ignorance of stakes" found in encroachment literature: if stakes determine knowledge, but stakes are unknown, knowledge status becomes unknowable. The self-referential knot highlights the difficulty of regulating epistemic standards without presupposing them.

  **Table of Doctrinal Exaggerations**

  | Section | Doctrine_sent_up | Real_feature_exaggerated | Liberties_taken | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | Circular 1.0 | Pragmatic Encroachment | Knowledge depends on practical stakes. | None. | Contested (vs. Purist Invariantism). |
  | Circular 2.0 | Evidence Thresholds | Higher stakes require more evidence for knowledge. | Treats evidence as quantifiable "tiers." | Contested (Nature of evidence scaling). |
  | Circular 3.0 | Ignorance of Stakes | Subjects often don't know the stakes. | Stakes are actively classified/hidden by institution. | Liberty (Philosophers don't hide stakes). |
  | Circular 4.0 | Regulative Authority | Standards must be set by an authority. | Authority's knowledge is subject to its own standards. | None (Logical consequence). |
  | FAQ Q1 | Norm of Assertion | One should not assert what one does not know. | "I know" is banned entirely as a phrase. | Liberty (Pragmatics vs. Prohibition). |
  | FAQ Q2 | Encroachment Effect | Same evidence + Higher stakes = No Knowledge. | Staff must explain epistemic degradation to clients. | Liberty (Ordinary language doesn't work this way). |
  | FAQ Q3 | Epistemic Structuring | Lowering stakes preserves knowledge. | Decomposing transactions to manipulate stakes. | Liberty (Financial structuring applied to epistemology). |
  | Case File | Knowledge Norm of Action | One should not act on p unless one knows p. | Disciplinary action for acting without knowledge. | Contested (Whether knowledge is the norm). |
  | Case File | Temporal Variance | Knowledge can vanish without evidence change. | Monday knowledge vs. Friday ignorance. | None (Core claim of Encroachment). |
  | Case File | Training Access | Knowledge required for learning. | Training inaccessible if stakes of learning are high. | Liberty (Reductio ad absurdum). |
