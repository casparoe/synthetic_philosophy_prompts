  **Log Entry: 08:00 – 11:30**
  **Subject: Perturbation Test 4 (The Well)**
  **Observer: J. Aris, Research Assistant**

  The morning light floods the Ring, casting long shadows across the white polymer floor. Inside, the four subjects stir. We call them by their architectures, though they look similar enough—small, quadrupedal, sleek-furred. The difference isn't in the muscle, but in the mind. Today, we activate the Well. It is a shallow depression in the center, smelling of nutrient paste. The rule is simple but counterintuitive: approach from the north or south, and a nozzle releases a puff of compressed air. Approach from the east or west, and the food dispenses.

  The Darwinian moves first. It does not scan; it locks. Its inherited heuristic is ancient and rigid: *Odor implies sustenance; sustenance implies approach.* It trots directly toward the scent, head low. *Puff.* It flinches, shakes its head, and immediately resets. The heuristic does not accommodate error; it only accommodates execution. *Odor implies sustenance.* It charges again. *Puff.* It is a tragic clockwork, winding itself up only to be knocked down. It will do this until starvation overrides the instinct. There is no learning here, only the blind repetition of a successful ancestor's strategy in a world that has changed.

  The Skinnerian is more fluid, though no less bound. It approaches direct. *Puff.* It retreats, visibly agitated. The punishment stamps itself onto its history. It paces the perimeter, sniffing, twitching. It is not planning; it is varying. It tries a angle—too steep. *Puff.* It tries another. Finally, by chaotic accident, it brushes the eastern flank. *Click.* Food. The reinforcement is immediate. It retreats, returns, and hits the eastern flank again. It is learning, but painfully, paying for every byte of information with discomfort. It knows *how* to eat, but it does not know *why*.

  The Popperian stops at the edge of the Well. It does not rush. It sits, ears swiveling, eyes tracing the nozzle, the rim, the shadow cast by the overhead light. It is running simulations. I can see the hesitation, the internal trial before the external act. It is letting its hypotheses die in its head rather than in the world. After a minute of stillness, it stands, circles wide, and approaches from the east. No puff. It eats calmly. It looks almost smug. It has avoided the cost of error by modeling the causal structure of the Ring. It believes it understands the machine.

  Then there is the Gregorian. It has not looked at the food once. It sits opposite the Darwinian, watching the air puff strike the hardy instinct. Then it looks at the Skinnerian's frantic pacing. Then it looks up. At me. At the glass. It traces the circle of the habitat, not walking the perimeter, but walking the pattern of the light shifts. It pauses where the shadow of the nozzle meets the floor, not to avoid it, but to touch it, then look back at me. Is it tracking the contingency? Or is it tracking the *frame* of the contingency? It seems to be responding to the difference between the situation where I am watching and the situation where I am typing. It ignores the food entirely. It is mapping the context, not the content. Or perhaps it is merely sensitive to the micro-vibrations of my typing through the floor. I cannot tell if it has stepped outside the system or if it is just trapped in a more complex layer of it. It remains still, observing the observation.

  At 11:30, I review the footage for the daily report. The Darwinian is exhausted. The Skinnerian is fed. The Gregorian is still watching me. I zoom in on the Popperian. It solved the puzzle perfectly, consistently avoiding the north and south. It looks like pure reasoning. But in the high-resolution replay, I notice its eyes don't track the nozzle. They track the reflection of the nozzle on the polished rim of the Well.

  The Popperian didn't model the air mechanism. It modeled the glint of light. It built a conjecture based on a correlate, not the cause. We haven't tested a Popperian mind against a dark room yet. If the lights go out, its internal model will remain confident, and it will walk straight into the puff. It thinks it knows the world, but it only knows the shadow.
