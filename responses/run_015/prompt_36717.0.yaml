      *   *Tone:* Academic, precise, philosophical.
      *   *Facts:* Ensure all provided facts (90% cars, referendum %, rail exception, accident stats) are woven in naturally.

      *(Self-Correction during drafting Part 2)*: I need to be careful not to say Lewis requires *equal* payoff. He requires that the alternative *could have served*. The fact that RHT was *better* doesn't violate arbitrariness, provided LHT *worked*. I must make this distinction sharp.

      *(Self-Correction during drafting Part 3)*: The prompt asks about the referendum. Did they prefer left or coordination? Lewis suggests they prefer coordination. The vote reveals the cost of switching outweighed the benefits of the new equilibrium *at that time*, or that they valued the status quo equilibrium's stability over the potential gains of the new one.

      *(Self-Correction during drafting Part 5)*: Don't just list the residues. Evaluate them. Does the rail exception actually hurt Lewis? Lewis allows for different populations. So, it's not a theoretical failure, but a reminder to define the population correctly. The psychological accident drop is a better candidate for "theory silence."

  4.  **Final Review against Prompt:**
      *   Five parts? Yes.
      *   Specific facts used? Yes.
      *   Lewisian terminology (common knowledge, regularity, expectations, arbitrary)? Yes.
      *   Evolutionary terms (risk-dominance, stochastic stability)? Yes.
      *   Conclusion verdict? Yes.
      *   Honesty about limitations? Yes.

  5.  **Final Polish:** Check flow and voice. Ensure it sounds like a seminar paper case study. (Proceed to generate output).

