answer: |-
  **Case Study: Dagen H and the Limits of Lewisian Convention**

  **1. The Mapping: Coordination, Expectations, and Precedent**

  To map Sweden's traffic system onto David Lewis's framework, we must first identify the underlying game. The participants are the operators of vehicles (and pedestrians) within the Swedish road network. The interaction is recurrent; every trip constitutes a new instance of the game. The payoff structure is defined by safety and efficiency: mutual conformity yields safe passage (high payoff), while non-conformity yields collision or impediment (low payoff).

  Prior to 3 September 1967, the regularity in behavior was *drive on the left*. This regularity was sustained by a system of mutual expectations: I drive on the left because I expect you to drive on the left, and you drive on the left because you expect me to do so. This recursive structure relies on *common knowledge*. Every driver knows the rule, knows that others know it, and knows that others know that they know it. In Lewis's terms, the precedent of past conformity generated the expectations that sustained the current equilibrium.

  However, this episode deviates from the textbook Lewisian coordination problem in a critical respect regarding the *origin* of the equilibrium's dissolution. In Lewis's paradigm, conventions are typically self-perpetuating; they persist because the expectation of conformity makes conformity rational. They usually dissolve through gradual drift or when external parameters shift enough to alter payoffs incrementally. In Sweden, the equilibrium did not erode. It was interrupted. The regularity was broken not by a failure of expectations among drivers, but by an external intervention that forcibly reset the focal point. The "game" was paused (via the nighttime traffic ban), the rules were rewritten by a non-participant (the State), and the game resumed with a new common knowledge baseline. Lewis maps the *state* of convention perfectly, but the *transition* here is exogenous to the driver-population's internal dynamic.

  **2. The Arbitrariness Condition: Pareto-Inferior Equilibria**

  Lewis insists that a convention must be *arbitrary*. This is often misunderstood as requiring that the alternative regularity be *equally good*. Lewis's actual condition is weaker: given that everyone else conforms, some alternative regularity *could have served* the same interest. It does not require payoff symmetry.

  Dagen H forces us to distinguish sharply between "arbitrary" and "indifferent." Left-hand traffic (LHT) in Sweden was arbitrary in the Lewisian sense: right-hand traffic (RHT) was a possible alternative regularity that would have solved the coordination problem. However, the facts suggest RHT was *payoff-dominant*. With 90% of cars being left-hand-drive (steering wheel on the left), LHT made overtaking dangerous and obscured vision. With Norway and Finland driving on the right, cross-border traffic required switching sides. Thus, the Swedish convention was a Pareto-inferior equilibrium locked in by history.

  Does this threaten Lewis's account? No, provided we accept that arbitrariness does not imply optimality. Lewis's framework allows for conventions to be suboptimal so long as they are self-sustaining equilibria. The persistence of LHT demonstrates that the cost of unilateral deviation (a crash) outweighs the benefit of the superior alternative (better visibility/border flow) unless the switch is coordinated. The "arbitrariness" lies in the fact that the coordination *could* have crystallized around RHT initially. That it crystallized around LHT and stayed there, despite RHT being objectively "better," highlights the power of precedent over payoff magnitude in Lewis's system. The convention held not because it was good, but because it was *known*.

  **3. Re-coordination by Decree: Common Knowledge and the State**

  The heart of the anomaly lies in the mechanism of change. Lewis describes conventions as self-perpetuating: conformity breeds expectations which breed conformity. This suggests stability or gradual drift. Yet, Sweden switched in a single morning, legislated in 1963 against the expressed preference of 83% of voters in a 1955 referendum.

  How did the decree work on Lewis's machinery? Lewis acknowledges "authoritative announcement" as a source of common knowledge. The State did not merely threaten punishment; it engineered a focal point. The four-year public education campaign, the specific date (Dagen H), and the nighttime ban served to synchronize expectations. On the morning of 4 September, I drove on the right not because I preferred it, but because I knew *you* would drive on the right, because I knew the State had told *you* to, and I knew *you* knew the State had told *me*.

  However, we must ask whether this was a "convention" immediately. In the immediate aftermath, compliance was likely driven by the salience of the law and the threat of enforcement, rather than the self-sustaining expectations Lewis describes. The regularity became a true Lewisian convention only once the legal threat receded into the background and the behavior was sustained purely by mutual expectation. The fact that accident rates returned to their previous trend within two years suggests the new regularity stabilized quickly; the "convention" had taken hold.

  The 1955 referendum is illuminating here. When 83% voted to keep left, were they expressing a preference for the left side *per se*? Read through Lewis, the vote reveals a preference for *coordination on the established equilibrium* over the costs of switching. The voters were not choosing between LHT and RHT in a vacuum; they were choosing between the known coordination of LHT and the uncertain, costly transition to RHT. They preferred the devil they knew. This confirms Lewis's insight that the primary preference in coordination problems is for *conformity itself*, often outweighing preferences for the specific content of the rule.

  **4. The Evolutionary Angle: Basins of Attraction**

  Lewis's static analysis requires supplementation from the evolution-of-norms literature to explain why the switch didn't happen organically. We can model traffic sides as a coordination game with two Nash equilibria. LHT was *risk-dominant*; RHT was *payoff-dominant*.

  In evolutionary models (e.g., Kandori, Mailath, and Rob), populations tend to get stuck in risk-dominant equilibria if the "basin of attraction" is deep. In Sweden, the basin for LHT was exceptionally deep due to "lumpiness." You cannot switch to RHT incrementally; a single driver switching is suicidal. The interaction neighborhood for a driver is the entire road network, not just local neighbors. This creates a high barrier to entry for the new norm.

  Stochastic stability models suggest that without a massive "tremble" or shock, the population will not migrate from a risk-dominant to a payoff-dominant equilibrium if the switching costs are high. The payoff asymmetries (better cars, border alignment) were not sufficient to overcome the hysteresis of the existing network. Evolutionary models predict that without state action, Sweden would likely have remained LHT indefinitely, or switched only over a generational timescale as the car fleet turned over and border interactions increased. These models explain the *stickiness* of the old convention but are silent on the *instantaneity* of the switch. They account for the equilibrium selection, but not the coordinated jump between basins, which required the exogenous shock of the State.

  **5. The Residue Report: What the Theory Cannot See**

  There are features of Dagen H that remain opaque to Lewisian and evolutionary game theory.

  First, the **psychological residue**. The marked drop in accidents in the weeks following the switch cannot be explained by game structure. The rules of the road were identical on 4 September as they were on 3 September, merely mirrored. The payoff matrix for crashing did not change. The reduction in accidents reflects a transient psychological state: heightened caution and reduced complacency. Lewis's framework treats agents as rational maximizers with stable preferences; it has no variable for "collective alertness." This is a psychological phenomenon masquerading as a structural one.

  Second, the **identity residue**. The unpopularity of the change (83% opposition) suggests that adherence to the old convention carried expressive or symbolic utility—national identity, resistance to state overreach, or habit—that exceeds coordination value. Lewis reduces the preference to "coordination vs. non-coordination." He is indifferent to the *meaning* of the convention. If drivers derived disutility from obeying the State, or utility from "Swedishness" (associated with LHT), this alters the payoff structure in a way Lewis does not typically model.

  Third, the **population residue**. Rail traffic, including the Stockholm metro, continued to drive on the left. A naive application of Lewis might call this a contradiction: "Sweden has a traffic convention." A disciplined application reveals that "Swedish traffic" is not one population but several overlapping ones. The rail network is a distinct population with distinct interaction neighborhoods. Lewis's theory handles this fine *if* we define the populations correctly. The theoretical silence here is not in Lewis, but in the sociological tendency to reify "the nation" as a single game. Lewis sees the separation; the casual observer does not.

  **Conclusion: Confirmation, Anomaly, or Boundary Case?**

  Is Dagen H a confirmation of Lewis, an anomaly, or a case his framework never anticipated?

  It is best understood as a **boundary case that confirms the structure but exposes the limits of the genesis.**

  Dagen H confirms Lewis's account of what a convention *is*: once the switch occurred, the new regularity was sustained by mutual expectations and common knowledge, exactly as Lewis predicts. The rapid stabilization of the new norm demonstrates the power of coordinated expectations.

  However, it is an anomaly regarding how conventions *change*. Lewis's framework is primarily designed to explain the emergence and persistence of conventions from the bottom up. It treats "authoritative announcement" as a way to solve a coordination problem where none existed, or to select among ambiguous equilibria. It is less equipped to explain the *overthrow* of a robust, entrenched equilibrium by fiat against the expressed will of the participants.

  Therefore, Dagen H does not refute Lewis, but it necessitates a supplement. It shows that while the *sustenance* of convention is a matter of mutual expectation (Lewis's domain), the *selection* of convention in the face of high switching costs and lock-in may require exogenous coordination devices (the State) that operate outside the standard evolutionary dynamic. The case confirms that once the expectations are aligned, the Lewisian machinery takes over; but it reminds us that aligning those expectations sometimes requires a hammer, not just a focal point.
