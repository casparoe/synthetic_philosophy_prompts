      *   **Context:** Seminar on social ontology, reading Lewis alongside evolution of norms literature.
      *   **Input Data:** Specific facts provided (neighbors drove right, 90% cars left-hand drive, 1955 referendum 83% against change, 1963 legislation, 4-year campaign, nighttime ban, sign replacement, accident drop then return, rail stayed left).
      *   **Structure:** Five specific parts (Mapping, Arbitrariness, Re-coordination by Decree, Evolutionary Angle, Residue Report) + Conclusion.
      *   **Tone/Style:** Disciplined mapping, honest about theoretical silence, no forced assimilation, academic rigor suitable for a seminar paper.
      *   **Goal:** Determine if Dagen H confirms, anomalies, or lies outside Lewis's framework.

  2.  **Deconstruct the Five Parts:**

      *   **Part 1: The Mapping.**
          *   *Lewisian Definition:* Recurrent coordination problem, arbitrary alternatives, regularity in behavior, mutual expectations, common knowledge, preference for conformity.
          *   *Application:* Drivers are participants. Preference for conformity = avoiding crashes. Precedent = history of driving left.
          *   *Deviation:* Usually, Lewisian conventions evolve organically. Here, there was a forced switch. Also, the "preference for conformity" might have been overridden by the "preference for the *other* convention" (right-hand) due to cars/borders, yet the old one stuck.

      *   **Part 2: The Arbitrariness Condition.**
          *   *Lewis's Claim:* Conventions are arbitrary (another regularity *could* have worked).
          *   *The Tension:* Right-hand traffic (RHT) was objectively "better" (cars, borders, safety). Left-hand traffic (LHT) was Pareto-inferior.
          *   *Resolution:* Distinguish "arbitrary" (could have been otherwise initially) from "equally good" (payoff symmetry). Lewis requires the former, not necessarily the latter. A convention can be arbitrary yet suboptimal compared to a counterfactual alternative that wasn't selected historically. The lock-in effect explains the inferiority.

      *   **Part 3: Re-coordination by Decree.**
          *   *Lewis's Mechanism:* Self-perpetuating expectations.
          *   *The Problem:* Switch happened overnight via law, against majority will (referendum).
          *   *Analysis:* Did the state create *common knowledge*? Yes (massive campaign, specific date). Did it create *expectations*? Yes (everyone knows everyone knows the law).
          *   *Enforcement vs. Convention:* Initially, it's compliance due to threat/salience. It becomes a Lewisian convention once the legal threat fades and expectations sustain the behavior (which happened quickly, evidenced by the accident rate normalization).
          *   *The Referendum:* Voters weren't voting on LHT vs. RHT in the abstract; they were voting on *sticking with the current equilibrium* vs. the cost of switching. They preferred coordination on the *known* side, even if the *other* side had higher potential payoffs.

      *   **Part 4: The Evolutionary Angle.**
          *   *Models:* Best-response dynamics, risk-dominance vs. payoff-dominance, stochastic stability.
          *   *Prediction:* RHT is payoff-dominant (better cars, borders). LHT was risk-dominant (everyone else is doing it).
          *   *Migration:* Without state action, migration is unlikely due to high switching costs (lumpiness). You need a critical mass. Local interactions (neighbors) matter. Since borders were fixed and car fleet turnover is slow, natural drift would be incredibly slow or impossible (hysteresis).
          *   *Silence:* Evolutionary models struggle with instantaneous, nationwide simultaneous switches. They explain gradual drift, not "Dagen H."

      *   **Part 5: The Residue Report.**
          *   *What Lewis misses:*
              *   *Identity/Symbolism:* 83% voted against change. Why? Habit, national identity, distrust of state. Lewis ignores expressive utility.
              *   *Psychology:* The accident drop (Honeymoon effect) is behavioral/psychological (increased caution), not structural. Lewis deals in payoff structures, not transient psychological states.
              *   *Population Boundaries:* Rail stayed left. This shows "traffic convention" isn't one monolithic game but overlapping games with different populations. Lewis acknowledges populations, but the *nation-state* framing often obscures this.

      *   **Conclusion:**
          *   *Verdict:* Is it confirmation, anomaly, or unanticipated?
          *   *Argument:* It's largely a confirmation of the *structure* of convention (expectations drive behavior), but an anomaly regarding the *genesis* (top-down vs. bottom-up). It shows Lewis's framework is robust enough to describe the *state* of convention, but needs supplementation (state power/common knowledge engineering) to explain *changes* in entrenched conventions. It's not a refutation, but a boundary case.

  3.  **Drafting - Section by Section (incorporating constraints):**

