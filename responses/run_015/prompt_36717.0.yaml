  *Refining the "Arbitrariness" section:* Lewis defines arbitrariness as: there is an alternative regularity that *could have* served the same interest. It does not mean the payoffs are identical. However, if one is *strictly* better, why did the inferior one persist? This is the lock-in problem. I need to make sure I don't conflate "arbitrary" with "indifferent."

