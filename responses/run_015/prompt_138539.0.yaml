answer: |-
  **Referee Report: Comments on the Final Chapter (The Laboratory Case)**

  The manuscript offers a sophisticated disambiguation of the Wrong Kind of Reasons (WKR) problem by indexing the distinction to attitude types. The distinction between Type 1 attitudes (Belief, Fear, Amusement), which admit only object-directed considerations, and Type 2 attitudes (Blame, Resentment, Gratitude, Trust), which admit considerations of what is owed or due in a relation, is the engine of the book.

  The final chapter's Laboratory Case is the stress test for this engine. It asks whether a *constitutive norm of a relationship* counts as a Right Kind Reason (RKR) for a Type 2 attitude (Trust) when evidence is inconclusive. Below, I set out two candidate principles consistent with your prior verdicts, their predictions, and my recommendation for how to resolve the case to ensure coherence with your announced extension to proleptic reasons.

  ### 1. Candidate Rules

  Based on verdicts (a) through (g), two principles emerge that fit your existing data but diverge on the Laboratory Case.

  **Rule 1: The Independent Fitness Principle**
  *   **Formulation:** For any attitude, a reason is of the Right Kind only if it tracks the *independent* fitness of the object for that attitude. For Type 2 attitudes, "relational norms" count as RKR only insofar as they reflect independent facts about the history or status of the object (e.g., a wrong done, a favour received), not insofar as they prescribe a stance that *creates* the fitness.
  *   **Fit with Verdicts:**
      *   Explains (a), (b), (d): Threats and instrumental benefits do not track independent fitness.
      *   Explains (f), (g): Moral or constitutive reasons for *Belief* are WKR because Belief tracks Truth (independent fitness), not moral or social fit.
      *   Explains (e): The reason to resent is the *wrong done* (an independent fact), not the cost of resenting.
  *   **Prediction for Laboratory Case:** **Wrong Kind.**
      *   *Reasoning:* Trust, like Belief, aims at a fact (trustworthiness). If the evidence is mixed, the independent fitness is unsettled. The fact that the *relationship* requires trust does not make the *colleague* trustworthy. To treat the constitutive norm as an RKR is to allow the attitude to outstrip the facts, which violates the constraint that reasons must track fitness rather than constitute it.

  **Rule 2: The Relational Constitution Principle**
  *   **Formulation:** For Type 2 attitudes, reasons grounded in the *constitutive norms of the relationship* are of the Right Kind, provided they are not merely instrumental (causal outcomes). Unlike Type 1 attitudes, Type 2 attitudes are not merely responsive to independent facts but are partly constitutive of the normative status of the participants.
  *   **Fit with Verdicts:**
      *   Explains (a), (d): Distinguishes external threats/instrumental gains (WKR) from internal relational norms (RKR).
      *   Explains (f), (g): Preserves the Type 1 restriction (Belief admits no constitutive reasons) while allowing Type 2 exceptions.
      *   Explains (e): Resentment is responsive to the normative status of the wrongdoer within the moral relation.
  *   **Prediction for Laboratory Case:** **Right Kind.**
      *   *Reasoning:* Trust is explicitly classified as Type 2. The reason offered is not instrumental ("better outcomes") but constitutive ("misdescribes the relation"). Therefore, it falls under "what is owed, due or called for in the relation." The undertaking itself generates the reason.

  ### 2. Best Guess and Recommendation

  **You should rule the reason is of the Right Kind (adopt Rule 2).**

  **Reasons for Preference:**
  1.  **Consistency with Type 2 Classification:** You explicitly list Trust alongside Resentment and Gratitude. If you rule WKR here, you effectively treat Trust as a Type 1 attitude (evidence-only), which undermines your central organizing claim. Verdict (g) restricts constitutive reasons for *Belief*, but your framework explicitly opens the door for them in *Relational* attitudes.
  2.  **The Proleptic Commitment:** You state the chapter will extend to "proleptic reasons"—reasons that make their object fit (e.g., trusting someone makes them trustworthy). This extension is logically impossible under Rule 1. If the reason to trust must track *prior* independent fitness (Rule 1), trust cannot *confer* trustworthiness. Only Rule 2 allows the normative demand of the relationship to serve as an RKR that brings the relevant properties into existence.
  3.  **Distinction from Verdict (d):** Verdict (d) rules WKR for gratitude based on *instrumental* collaboration ("cement a collaboration"). The Laboratory Case is carefully distinguished from this ("not that trusting her would produce better outcomes"). Ruling WKR here would collapse the distinction between *instrumental* reasons (WKR) and *constitutive* reasons (potentially RKR for Type 2).

  ### 3. Strain Analysis

  **Does Rule 2 strain any prior verdict?**
  It places significant pressure on **Verdict (g)**.
  *   **The Strain:** In (g), you rule that a reason to believe based on what is "constitutive of your continuing to work there" is WKR. In the Laboratory Case, you would rule that a reason to trust based on what is "constitutive of the undertaking" is RKR.
  *   **The Nature of the Strain:** A critic will argue this is an unstable distinction. Why is the constitutive norm of a *departmental employment relation* (Belief) inadmissible, while the constitutive norm of a *laboratory direction relation* (Trust) is admissible?
  *   **How to Mitigate:** You must argue that Belief has a "mind-to-world" direction of fit that is inviolable (it *must* track truth), whereas Trust has a "world-to-mind" or "normative" component that allows it to be partly constitutive of the reality it responds to. You need to explicitly defend the boundary between Type 1 and Type 2 attitudes in the final chapter, perhaps by arguing that Belief is never a form of *address*, whereas Trust is essentially a form of address.

  ### 4. A Separating Case

  If you find yourself undecided between Rule 1 and Rule 2, consider this case, which separates them even if they agree on the Laboratory Case (where evidence is mixed):

  **The Counter-Evidential Vow:**
  *   **Case:** You and a colleague undertake the same lab direction. However, the evidence is not merely mixed; it is *negative*. You have strong statistical evidence that she is unreliable. Nevertheless, you make a solemn vow to trust her, arguing that the vow constitutes a relationship where trust is owed regardless of evidence.
  *   **Rule 1 Prediction:** **Wrong Kind.** The independent fitness (unreliability) overrides the relational norm. To trust is to fail to respond to the object.
  *   **Rule 2 Prediction:** **Right Kind (with caveats).** The relational norm generates an RKR, though it may be outweighed by the strong evidence. However, the *kind* of reason remains Right.
  *   **Why this matters:** If you want to sustain the Proleptic extension, you must be willing to say that in some normative contexts, the relational demand can outweigh weak negative evidence. If you balk at the Vow case, you should balk at the Laboratory case.

  ### 5. Implications for the Proleptic Extension

  Your announcement that the chapter will handle proleptic reasons ("trusting someone can be what makes her trustworthy") is the most philosophically ambitious part of the manuscript. Here is how the candidate rules handle it:

  *   **Under Rule 1 (Independent Fitness):** The extension fails. If the reason to trust must track prior trustworthiness, trust cannot create it. You would be forced to treat proleptic reasons as a distinct category of "pragmatic justification" (WKR), which contradicts your claim that they make the object *fit*.
  *   **Under Rule 2 (Relational Constitution):** The extension succeeds naturally. If the reason to trust is the constitutive norm of the relationship (RKR), then enacting that reason brings the relationship into being. Since the relationship confers the status of "trustworthy partner," the reason is proleptic.
      *   *Commitment:* This commits you to the view that **normative statuses are partly attitude-dependent.** You must argue that trustworthiness is not solely a character trait but a status within a normative practice.

  ### Final Advice

  Press yourself to adopt the **Right Kind** verdict for the Laboratory Case. To rule otherwise is to retreat from your Type 2 classification of Trust and renders your Proleptic extension incoherent. However, you must explicitly address the tension with Verdict (g). I recommend adding a subsection distinguishing *Cognitive Constitutivity* (Belief, where the norm is truth) from *Practical Constitutivity* (Trust, where the norm is the relation itself). This will insulate your view from the charge that you are treating Belief and Trust inconsistently regarding constitutive norms.

  This chapter has the potential to move the debate beyond the standard WKR dialectic by showing that the "Kind" of reason is determined by the normative architecture of the attitude itself. Do not shy away from the consequence that some reasons to trust are right-kind even when evidence is silent.
