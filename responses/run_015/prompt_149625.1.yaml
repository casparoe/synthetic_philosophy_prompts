answer: |-
  The minute book from 1937 sits on the folding table in the portakabin, heavy enough to anchor a tent in a gale. The leather is cracked along the spine, revealing grey board underneath, but the ink inside is still sharp. Someone wrote in a careful hand that the land was given in perpetuity, provided the water remained open to the public for bathing. You can feel the weight of that word even now, pressing down through the decades, though the paper has gone brittle and smells of vanilla and damp. I am packing it away into a cardboard box marked Archives, alongside the attendance logs from the seventies and the grant applications from the nineties. It feels like putting away winter coats in July, a sensible tidying up rather than a burial.

  Outside, the sun is doing its best to break through the cloud layer, casting a pale wash over the concrete apron. The pool itself is half-drained, the water line sitting just below the overflow channel. It leaves a tide mark of green algae on the white tiles, a ragged skirt around the waist of the basin. There is a hum from the pump house, a final cycle to clear the pipes before the winter shutdown, or what would have been the winter shutdown. Now it is the permanent shutdown. The Chair is standing by the window, smoking a vape pen that smells of artificial strawberries. He is talking about the handover schedule.

  "We need the keys by the thirty-first," he says, not turning around. "The Trust wants to start the demolition of the changing rooms in early October. They say the foundations are sound enough to build over, but the plumbing is too expensive to retrofit."

  "Demolition," I say. I am wrapping the 1937 book in acid-free tissue. "I thought they were reimaging it."

  "That's the word they used. Reimaging. Splash park, café, soft play area. It's what families want now. Nobody wants to swim lengths in the rain anymore."

  He turns then, and his face is open, untroubled. He isn't grieving. To him, this is a logistics problem solved. The budget balances, the liability decreases, the site becomes productive again. He sees a transaction; I am holding a history. I tape the box shut. The sound of the tape dispenser is loud in the small room, a sharp rip that echoes.

  I walk out onto the apron. The air is cooler here, smelling of wet concrete and chlorine, a scent that has hung over this valley for ninety years. It is in my clothes, in my hair, probably in the wood of the house I grew up in. My father taught me to swim here, standing in the shallow end while the wind cut across the water. He held my stomach until I found the rhythm of kicking, then let go without telling me. I taught my daughter here last August. She is seven. She asked me yesterday if the water would still be there when she is my age. I told her I didn't know. I didn't tell her that the promise written in that book I just packed away was supposed to outlast us both.

  The swimming club captain is walking the perimeter, kicking a stray tennis ball along the edge. He stops when he sees me. He looks tired, but not devastated. He has already secured lanes at the leisure centre two miles away. It has a heater, a roof, proper showers. It is better, objectively. He tells me the children will adapt quickly. They are resilient, he says. He uses the word lightly, like a coin passed across a counter. He believes he is saving the sport by moving it indoors. He does not see that the sport is not just the movement of limbs through water, but the movement of limbs through this specific water, under this specific sky. But I do not say this. I ask him about the starting blocks. He says the Trust will store them. I nod. We are both being reasonable.

  A white van pulls up near the gate. A man in a high-visibility vest gets out, holding a clipboard. He is from the Trust. He walks towards me with a smile that is practiced but not unkind. He wants to do a walk-through. We start along the deep end. He talks about the new vision. He mentions flow, engagement, year-round usage. He points to the diving board, a solid chunk of concrete jutting out over the empty space.

  "That'll come down," he says. "Health and safety. Too high for a splash zone."

  "It's been there since '38," I say.

  "Still," he says. "Things change."

  He stops at the pump house and checks something off his list. He asks me about the asbestos survey. I tell him it's in the box. He seems pleased. He is thinking about timelines, budgets, opening dates next summer. He is thinking in quarters of a fiscal year. I am thinking in generations. For a moment, standing there with the wind picking up the loose gravel around our feet, I almost see the gap between us. I almost see that his horizon ends where his funding cycle ends, and mine extends back to a hand I never held and forward to a granddaughter I haven't met. I almost see that when the longest promise you can make is shorter than a single lifespan, the structure doesn't need to fall down to be gone.

  Then his radio crackles. He apologises, steps away to take the call, talking about delivery slots for the new composite decking. The moment passes. I turn back to the pool. The water is still moving slightly, settling into the drain. It looks peaceful. It looks like a job finished.

  I walk back to the portakabin to get the final set of keys. The Chair is gone, presumably to the pub. The box of minutes sits on the table, ready for the archive van. I pick up the key ring. It is heavy, iron keys on a steel ring. There is a label on them, typed on an old machine: Lido Main Gate. The metal is cold. I think about putting them in my pocket, just for an hour, just to keep them warm. But that would be theft. I place them in the envelope provided by the Trust. I seal it.

  Outside, the van is reversing. The man in the vest waves. I wave back. I lock the portakabin door. The click of the latch is final. I walk to the main gate. The lock is stiff, rusted from the spray. I turn it. It holds. I stand there for a moment, looking down the length of the empty basin. The algae mark is already drying, turning from green to grey. In five hundred years, if someone digs here, they will find the concrete shell. They will find the tiles. They might find the minute book if the archive survives. They will see a discontinuity. They will see a break in the layer. They will call it what it is.

  From where I stand, it just looks like a quiet afternoon. The wind is picking up, blowing a few dry leaves across the concrete. They skitter towards the drain, caught in the airflow, dancing for a second before settling. I turn away from the gate and walk towards the car park. My phone buzzes in my pocket. It is my daughter. She wants to know if I can pick up milk on the way home. I tell her yes. I tell her I will be there in twenty minutes. I put the phone away and start the engine. The radio comes on, playing a song from last year. I drive out of the car park, past the sign that still says Open Daily, and merge onto the main road. The traffic is heavy. Everyone is going somewhere. Everyone is busy. I join the line of cars, signalling left, keeping pace with the flow.

  I aimed for an ending that refuses to validate either the grief or the pragmatism, leaving the reader with the mundane continuation of life despite the structural break. The focus on the traffic and the milk request is intended to underscore how the shortening of the horizon is masked by the immediate necessities of living.
