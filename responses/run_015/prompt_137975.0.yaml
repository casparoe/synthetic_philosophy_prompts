  3. Funding is allocated to the Residual Division to improve the country's showing in the explanatory table, acknowledging that the residual is larger than most explained contributions, without attempting to move the headline figure that determines international rank, because the table is an after-the-fact explanation of the average rather than a set of ingredients.

  4. The Competitor Surveillance desk shall report a gain in standing relative to our northern neighbour in any year where the country's own average fell but competitors fell further, timing each intervention for the year it will first register in the three-year rolling window, given that rank is ordinal and the figure is a three-year average.

  5. To optimize factor proxies, the Office will pre-fund a charitable donation for every household to satisfy the generosity metric and trim menus of choice until citizens can report satisfaction with the options that remain regarding freedom to make life choices, recognizing the factors are single-item proxies. Consequently, generosity is secured by pre-funding a charitable donation for every household and freedom by trimming menus of choice until citizens can report satisfaction with the options that remain.
