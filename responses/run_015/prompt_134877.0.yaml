      *   *Claim:* Tutor's labor mixes with child's capacities -> Tutor owns part of pupil's moral character (parallel to STG property chapter).
      *   *Locke's STG Property Chapter:* Labor mixed with nature/common resources -> Property rights established (ownership). Key condition: Enough and as good left for others, no spoilage. Also, self-ownership is foundational (every man has property in his own person).
      *   *Locke's STCE:* Focus on virtue, wisdom, breeding, learning. Tutor guides the child. Parents have authority over children until reason develops. Children are not born free/equal; they are under parental tutelage until maturity.
      *   *Potential Issue:* In STG, property is external to the person (lands, goods). In STCE, the "product" is the child's *own* moral character/self. Locke explicitly argues for self-ownership in STG. Does the tutor own part of the child's self? That seems to contradict Locke's liberalism regarding self-ownership. However, Locke does view children as temporarily under parental authority (not full owners, but guardians). The analogy of "labor mixing" is interesting but risky because the "resource" being mixed with is a *person*, not land.
      *   *Strengths:* Locke uses agricultural metaphors (weeding, planting) in STCE. Labor is central to Locke's moral economy. The idea of "forming" character parallels "forming" property.
      *   *Weaknesses:* Ownership of persons vs. ownership of things. Locke distinguishes between parental power and political power. The end goal of education is autonomy (reason), not permanent tutor ownership. The property chapter is about external goods, not internal character.

