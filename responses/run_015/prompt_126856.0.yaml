answer: |-
  ### 1. Dependency Order: Securing the Inversion

  To prevent the collapse of the argument into "blind chance" (Darwin) or "mere trickery" (Turing), you must establish the conceptual dependencies in this specific sequence:

  1.  **Secure the Intuition of Design (The Effect):** Before introducing the mechanism, students must agree that the output exhibits *competence* that traditionally demands a *competent cause*. They must feel the pull of the Teleological Stance (i.e., "This looks designed, so a designer must exist").
      *   *Risk of Reversal:* If you begin with the mechanism (mutations or code), students perceive only the "blindness" of the parts. They conclude the output is accidental (Darwin) or superficial (Turing) because they haven't yet acknowledged the robustness of the competence being produced.
  2.  **Isolate the Mechanism as Generative, Not Destructive:** Once the competence is acknowledged, introduce the process not as a "lack of mind" but as a "filter" or "generator." For Darwin, selection is a filter that retains competence; for Turing, computation is a generator that processes syntax.
      *   *Risk of Reversal:* If the mechanism is presented as purely negative (death/error) or purely imitative (simulation), students will view the output as a residue or a fake. They must see the process as *constructive*.
  3.  **Decouple Competence from Comprehension (The Inversion):** Only after steps 1 and 2 can you assert that the competence exists *without* the comprehension usually assumed to cause it.
      *   *Risk of Reversal:* If you attempt this decoupling before securing the competence, students will deny the competence exists. If you attempt it before securing the mechanism, they will posit a hidden designer.

  ### 2. The Carrying Example: The Blind Navigator

  **The Scenario:** A system that consistently finds the shortest path through a complex, changing maze to a resource.
  *   **Darwinian Instance:** An ant colony deploying pheromone trails. No single ant knows the map; the "intelligence" is in the evaporating chemical selection.
  *   **Turingan Instance:** A packet-switching network (or pathfinding algorithm) routing data through nodes. No single packet knows the network; the "intelligence" is in the local logic gates.

  **Why this anchors the shared structure:**
  Both instances exhibit **goal-directed behavior** (finding the path) without **goal-representing states** (a map or intention). They isolate *problem-solving competence* from *mental comprehension*.

  **Why Darwin's Eye fails:**
  The eye invites the "Irreducible Complexity" objection. Students will get bogged down in biological gradualism ("How does a half-eye work?") rather than the philosophical inversion of design. It triggers biological essentialism rather than structural logic.

  **Why the Chinese Room fails:**
  The Chinese Room invites the "Qualia/Consciousness" objection. Students will debate whether the machine *feels* or *means*, which distracts from the functional competence. The Room argues about *understanding meaning*; the Navigator argues about *achieving results*. The latter is the shared ground of Darwin and Turing.

  ### 3. Misconception Map: Interception Points

  **Misconception 1: Conflating Fitness with Intentionality**
  *   *When it arises:* Immediately after describing the ant colony finding food.
  *   *The Error:* "The colony *wants* to find food, so the ants are acting intentionally."
  *   *Interception Point:* Before discussing the Turing case.
  *   *Counter-Question:* "If we remove every ant that takes a wrong turn, does the remaining group need to *know* where the food is to succeed?"

  **Misconception 2: Conflating Behavioral Indistinguishability with Metaphysical Identity**
  *   *When it arises:* After revealing the algorithm also finds the path.
  *   *The Error:* "Since the computer finds the path just like the ant, it must have a mind like the ant (or the ant has a mind like the computer)."
  *   *Interception Point:* Before discussing the "Inversion."
  *   *Counter-Question:* "Are we claiming the machine is alive, or that 'being alive' isn't required for finding the path?"

  **Misconception 3: Positing a Hidden Homunculus to Restore Comprehension**
  *   *When it arises:* At the conclusion, when resisting the idea that comprehension is unnecessary.
  *   *The Error:* "But someone had to program the algorithm/write the DNA."
  *   *Interception Point:* Final synthesis.
  *   *Counter-Question:* "If the programmer needs a programmer, and the designer needs a designer, where does the comprehension originally come from? Must it exist at the start, or can it emerge at the end?"

  ### 4. End-of-Session Check: The "Reverse Engineering" Diagnostic

  Do not ask: "Do you understand the parallel?" (This invites polite agreement).
  Do not ask: "Can evolution and machines do smart things?" (This confirms only surface acceptance).

  **The Check:**
  Present a third case: **A Thermostat maintaining room temperature.**
  Ask the students to write a two-sentence explanation of its competence.
  1.  **Sentence 1:** Explain how it works mechanically (the bimetallic strip/circuit).
  2.  **Sentence 2:** Explain why we *usually* describe it as if it "knows" the temperature (the inversion).

  **Grading Criterion:**
  *   **Fail:** "It senses the heat and turns on." (Attributes comprehension/sensing).
  *   **Pass:** "A strip bends physically to close a circuit; we attribute 'knowing' to it because the *effect* mimics a decision, though the *cause* is blind physics."
  *   *Rationale:* This proves they can separate the *appearance of agency* from the *mechanism of causality*, which is the core of the Darwin/Turing inversion.

  ### 5. Explicit Omissions and Justifications

  **1. Modern Evolutionary Psychology**
  *   *Omission:* Do not discuss adapted mental modules or "selfish genes" in human behavior.
  *   *Justification:* For literature/history students, this triggers ideological resistance (determinism/reductionism) that will derail the structural philosophical point. Keep evolution biological/abstract, not behavioral.

  **2. The Formal Mechanics of the Chinese Room (Syntax vs. Semantics)**
  *   *Omission:* Do not detail Searle's argument about symbol manipulation lacking meaning.
  *   *Justification:* This debates *consciousness*, not *competence*. Turing's point (and Darwin's) is about functional output, not internal qualia. Introducing semantics shifts the goalposts from "solving the maze" to "feeling the maze."

  **3. Contemporary Large Language Models (LLMs)**
  *   *Omission:* Do not reference Chatbots or Generative AI.
  *   *Justification:* Too politically and technically charged. Students will fixate on "Is AI art real?" rather than the philosophical structure. Turing's 1950 formulation is historically distant enough to be analyzed objectively; LLMs are too immediate.

  **Summary Aim:** By omitting the *content* of the mind (psychology/qualia/AI) and focusing on the *structure* of the output (navigation/order), you ensure they see the inversion as a logical move about causality, not a scientific claim about biology or computing.
