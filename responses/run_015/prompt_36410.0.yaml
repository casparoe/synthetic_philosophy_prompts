answer: |-
  This is a classic philosophical pivot point. Your friend is relying on an equivocation—a sleight of hand where a phrase shifts meaning mid-argument. The sentence "You never see the object itself, only what it looks like to you" sounds like a humble observation about human fallibility, but it is deployed as a metaphysical claim about the constituents of reality.

  To push back effectively, you need to separate the **phenomenology** (how it feels) from the **ontology** (what exists). Here are the four distinct theses hiding in that one-liner, ranked from trivially true to metaphysically loaded.

  ### 1. The Phenomenological Thesis
  **Claim:** *Perceptual experience has a subjective character.* (There is "something it is like" to see a tomato.)
  *   **Plausibility:** Trivially true. No one denies that perception feels a certain way from the inside.
  *   **Leads to Sense-Data?** No. A Direct Realist can agree that seeing a tomato has a subjective character without thinking you are seeing a mental picture *of* the tomato. You are seeing the tomato, and that seeing has a subjective feel.
  *   **Verdict:** True, but useless for your friend's argument.

  ### 2. The Epistemic Thesis
  **Claim:** *Introspection cannot guarantee the existence of the external object.* (You can't tell by "just looking" whether you are hallucinating.)
  *   **Plausibility:** Highly plausible. This is the "indistinguishability" premise.
  *   **Leads to Sense-Data?** No. This claims a limit on your *knowledge*, not a limit on your *access*. You can be directly aware of a tree but still be mistaken about whether it exists (if you are hallucinating). Fallibility does not imply intermediaries.
  *   **Verdict:** True, but does not entail indirect realism.

  ### 3. The Common Kind Thesis (The Bridge)
  **Claim:** *Veridical perception and perfect hallucination are the same fundamental kind of mental state.* (Because they are indistinguishable, the brain/mind must be in the exact same state in both cases.)
  *   **Plausibility:** Contested. This is the engine of the argument. It assumes that "indistinguishable from the inside" implies "identical in nature."
  *   **Leads to Sense-Data?** It creates the *pressure* for it. If the hallucination (where no tomato exists) and the perception (where one does) are the same mental state, then the tomato cannot be a constituent of that state. Therefore, the state must be completed by something else (a sense-datum or representation).
  *   **Verdict:** This is the premise your friend *needs* to be true to move from epistemology to ontology.

  ### 4. The Ontological Thesis (The Conclusion)
  **Claim:** *The immediate object of awareness is a mental entity (an appearance/sense-datum), not the physical object.*
  *   **Plausibility:** Highly controversial. This is what the argument is trying to prove.
  *   **Leads to Sense-Data?** Yes, this *is* Sense-Data theory (or Indirect Realism).
  *   **Verdict:** This is not a premise; it is the conclusion disguised as a description.

  ---

  ### The Commitment: Which Reading Does the Argument Need?

  The argument genuinely needs **The Ontological Thesis (#4)** to be true for the conclusion ("you never see the object itself") to hold. However, the argument cannot simply assert #4; it tries to derive #4 from **The Common Kind Thesis (#3)** using the indistinguishability premise.

  **Here is my commitment:** The argument is **unsound** because it relies on an equivocation between Thesis #2 (Epistemic) and Thesis #4 (Ontological).
  *   Thesis #2 is true: You can't tell the difference from the inside.
  *   Thesis #4 is the desired conclusion: You are only aware of mental items.
  *   **The Gap:** Thesis #2 does not imply Thesis #4. To get there, you must assume Thesis #3 (Common Kind).

  **Is Thesis #3 (Common Kind) True?**
  I commit to the view that Thesis #3 is **unproven and likely false** in the context of Direct Realism. The fact that two experiences are subjectively indistinguishable does not prove they share the same fundamental metaphysical nature. A fake diamond and a real diamond can be indistinguishable to the naked eye, but that doesn't mean they are made of the same stuff. Similarly, a hallucination and a perception can be indistinguishable to the subject without sharing the same relational structure (one relates to a mental image, the other to a physical object).

  Therefore, the argument fails because it treats a limitation on *judgment* (I can't tell them apart) as a revelation about *constitution* (They are made of the same mental stuff).

  ---

  ### Is Disjunctivism the Only Escape?

  **No.** This is a crucial point often missed in reading groups. If you reject the Common Kind Thesis (#3), you are a **Disjunctivist**. Disjunctivism says: *Veridical perception is a direct relation to the world; hallucination is a distinct, non-relational mental event. They only share a label, not a nature.*

  However, you can **accept** the Common Kind Thesis (#3) and **still reject** your friend's conclusion. This is the path of **Representationalism (or Intentionalism)**.

  **The Representationalist Escape:**
  1.  **Accept Common Kind:** Yes, the brain state in hallucination and perception is the same type of state.
  2.  **Reject Sense-Data:** No, that does not mean you are aware of a mental *object*.
  3.  **The Move:** Mental states are not containers holding objects (like a bucket holding water); they are **representations** (like a thought about Paris).
      *   When you hallucinate a tomato, you are in a state that *represents* a tomato, but no tomato exists.
      *   When you see a tomato, you are in a state that *represents* a tomato, and a tomato exists.
      *   In neither case are you aware of a "mental tomato" (sense-datum). You are aware of the *content* of the representation.

  **Why this blocks your friend:**
  Your friend says: "If the object isn't there in the hallucination, but the experience is the same, you must be looking at an internal substitute."
  The Representationalist says: "No. In both cases, I am 'looking at' (representing) the external world. In one case the representation is accurate; in the other, it is false. I am not looking at the representation itself."

  ### Summary for Your Pushback

  1.  **Call the Equivocation:** Tell your friend, "You are sliding from 'I can't be sure it's real' (Epistemic) to 'I am looking at a mental image' (Ontological). The first is true; the second doesn't follow."
  2.  **Challenge the Common Kind:** Ask, "Why does indistinguishability imply identical metaphysical structure? Why can't the nature of the experience depend on the object, even if I can't tell the difference?" (The Disjunctivist move).
  3.  **Offer the Representationalist Alternative:** Say, "Even if the mental state is the same, why must the *object* of that state be mental? Thoughts about unicorns have no unicorns in them, but I'm not thinking about 'thought-unicorns.' I'm thinking about nothing. Why is perception different?"

  **Final Verdict:** Your friend's argument only works if you accept that indistinguishability entails identical objects of awareness. That principle is false. You can reject it via Disjunctivism (denying the common state) or Representationalism (accepting the common state but denying the mental object). Either way, the inference to "you only see appearances" is blocked.
