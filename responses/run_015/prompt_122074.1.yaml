answer: |-
  Kant's prohibition functions as a credible commitment sustaining a meta-game equilibrium governing language-use. Truthful communication is a focal point in a coordination game distinguishing verifiable versus unverifiable messages, where lying is cheap talk. In the murderer-at-the-door case, a one-shot interaction with asymmetric information, lying appears locally optimal. However, Kant argues this deviates from the strategy required to maintain the broader equilibrium. Sending a false message incurs reputation costs in repeated interaction, destabilising the universal practice of truthful communication. If agents treat messages as unreliable, the mechanism collapses. Thus, the prohibition acts as an equilibrium refinement, ensuring the mechanism remains incentive-compatible across all states.

  The residue report indicates mixed translatability. Elements translating cleanly include universalisation as equilibrium selection and corruption of communication as systemic collapse. However, distortions are necessary: the categorical imperative becomes a stability condition rather than a rational necessity. Most significantly, there is no counterpart for duty independent of outcomes. Mechanism design evaluates actions by their effect on equilibrium stability, whereas Kant posits duty irrespective of equilibrium effects. The formal model cannot capture obligation persisting even when lying would not destabilise the system.

  Ultimately, the residue reveals that mechanism design is missing a normative dimension. It explains why truth-telling is stable, not why it is obligatory when stability is not threatened. Kant's argument relies on premises regarding rational agency and intrinsic wrongness that do not survive formalisation into incentive compatibility. The formalisation captures the systemic risk of lying but fails to encode the moral obligation, reducing a deontological constraint to a consequentialist calculation regarding institutional durability.
