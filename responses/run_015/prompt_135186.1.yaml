answer: |-
  **Alex:** You're doing the math wrong. You can't just multiply the number of future people by the probability we're real and call it a day.

  **Jamie:** Why not? If there's a ninety percent chance this server shuts down in twenty years, investing in the year 3000 is burning resources.

  **Alex:** Because you're mashing three different claims together. One: simulation lowers the expected value of far-future work. Two: it doesn't lower the value, but makes the sign unreliable—like a coin flip. Three: it leaves the total value alone but changes which stuff is best, pushing weight toward near-term causes. Which one are you actually making?

  **Jamie:** All of them? But mostly the first one. If we're in a pilot simulation, the future isn't just uncertain; it's non-existent.

  **Alex:** Okay, let's talk about the Pilot Hypothesis then. You think ancestor sims are run as cheap pilots and shut down once the interesting part is over.

  **Jamie:** Exactly. The "interesting part" is usually the crisis. The nuclear close-call, the AI transition, the biological bottleneck. Once you pass that, why keep rendering? It's expensive. So the length of the future you can affect is short.

  **Alex:** But you're ignoring the second half of that hypothesis. It says the length is negatively correlated with how dramatic things get. The more boring and stable your century is, the more likely they keep you running.

  **Jamie:** So?

  **Alex:** So if I work on AI safety, I'm trying to make the transition boring. I'm trying to prevent the dramatic extinction event. Under your own hypothesis, that extends the simulation. It keeps the server running longer.

  **Jamie:** That's a stretch. Preventing a catastrophe is still high-stakes drama. The simulators want to see how civilizations *fail*, not how they bureaucratize safety protocols. If you succeed, the story ends. "They lived safely ever after" isn't a simulation; it's a screensaver.

  **Alex:** That feels like you're assuming the simulators are tourists. Maybe they're planners. But look, let's ground this. Sam is deciding whether to spend next summer volunteering for a global poverty charity or grinding math for a possible future AI safety career. What does the Pilot Hypothesis say?

  **Jamie:** It says feed the people. Poverty relief stabilizes the present. It reduces the chance of immediate collapse. If the sim is a pilot, you want to maximize the runtime of the current instance. Grinding math is betting on a future that might get deleted Tuesday.

  **Alex:** But if the math prevents the deletion?

  **Jamie:** Then you're betting on a low-probability branch. The base rate of pilot sims shutting down is high. You should take the guaranteed value in the near term.

  **Alex:** Okay, but that ignores the Mirror Hypothesis.

  **Jamie:** Oh no.

  **Alex:** Hear me out. The sim is being used as a forecast. Whether the simulators keep it going depends on what happens inside it. So acting well in here might be evidence about what the real civilization up there decides to do.

  **Jamie:** That's evidential decision theory magic. You think solving a math problem here causes the real civilization to solve it there?

  **Alex:** I think it signals capacity. If we show we can handle existential risk responsibly, maybe the real civilization sees that trajectory and mirrors it. Or maybe they keep our sim running to learn from us. Either way, it connects our actions to the real future.

  **Jamie:** Even if that's true, it doesn't save the "trillions of people" math. The Mirror Hypothesis might mean our behavior influences the real world, but it doesn't mean there *are* trillions of descendants waiting for us to save them. The real civilization might be small. The simulation argument cuts the size of the future down to size.

  **Alex:** It cuts the *physical* future down. But if the simulation is the only reality we can access, then influencing the simulators is influencing the only future that matters.

  **Jamie:** That's giving up on the real world entirely. I'm saying you should care less about the far future because the leverage is gone. You're pushing on a string.

  **Alex:** I'm saying the leverage changes shape. It's not about counting heads in 2500. It's about the quality of the signal we send now.

  **Jamie:** Okay, fine. Let's talk about Sam again. Under the Mirror Hypothesis, does Sam grind math?

  **Alex:** If the math demonstrates competence in handling risk, yes. It shows the simulators we're worth investing in.

  **Jamie:** But poverty relief demonstrates compassion. Maybe the simulators value stability over competence. You see the problem? The sign is unreliable. That's claim number two. You don't know if math or mud is the right signal.

  **Alex:** But you know for a fact that feeding people helps people now.

  **Jamie:** Exactly. That's why the simulation argument pushes weight toward near-term causes. It doesn't necessarily make far-future work negative, but it makes the near term overwhelmingly dominant because the discount rate on the future is effectively infinite.

  **Alex:** I think you're being too pessimistic about the shutdown probability. But... okay. You've convinced me that assuming a stable, long future is an assumption, not a baseline.

  **Jamie:** And you've convinced me that stability isn't just about boredom. If the Pilot Hypothesis is true, preventing catastrophe might actually extend the sim.

  **Alex:** So, here's where I land. Because of you, I'm going to tell Sam to spend at least half the summer on direct aid. I can't justify ignoring the present runtime for a speculative future branch.

  **Jamie:** Okay. And because of you, I'll stop saying far-future work is worthless. If the Mirror Hypothesis holds, signaling competence matters. But I still refuse to give up the claim that the "trillions" math is broken. You can't build a career on counting ghosts.

  **Alex:** Deal. But I'm keeping the math grinding. Just... maybe after lunch.

  **Jamie:** After lunch is fine. Just don't bet the whole summer on it.

  **Alex:** Won't. But I'm not deleting the files either.

  **Jamie:** Fair. Let's order pizza. Real pizza. Hopefully.

  **Alex:** Hopefully.
