      *   **Mara's Position (Realist/Downward Causation):** Simmballs actively reshape the substrate. They alter potential landscapes in unpredictable ways (from local laws alone). Symbols *push* the substrate.
      *   **Joren's Position (Eliminativist/Supervenience):** Careenium dynamics are exhaustively determined by local interactions. Simmballs are predictive abstractions (epiphenomenal). Symbols *ride* the substrate. Analogy: Shadows on a wall.
      *   **Requirements:** Genuine back-and-forth, no strawmen, address specific counter-arguments (overdetermination, shadows, novel causal pathways, biological brain comparison).

  2.  **Deconstruct the Philosophical Conflict:**
