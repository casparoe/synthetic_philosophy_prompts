answer: |-
  Here are nine questions designed for a 45-minute slot. They are ordered to move from foundational analogies to formal mechanics, then to structural paradoxes, and finally to empirical implications.

  **Timing Note:** 45 minutes is tight for nine deep-dive questions. If you hit minute 35 and are behind, **drop Question 9**. It's the "future implications" question; the previous eight cover the validity of the view itself.

  ### 1. The Arithmetic Disanalogy
  **Question:** Let's start with the standard objection. If I can't multiply two 50-digit numbers in my head, I'm not excused from the norm that $2 \times 2 = 4$; I'm just unable to access the answer. Critics say probability axioms are like arithmetic: they constrain the *state* of the agent, not the *process* to get there. Intractability is a fact about our access, not the norm. You say the credal case is different. What is the precise disanalogy? Why does "ought-implies-can" dissolve the probability norm but not the arithmetic one?

  **Predicted Reply:** She will likely say arithmetic has a single determinate truth value independent of the agent, whereas credences are indexed to an agent's perspective and capacity to process evidence.
  **Follow-up:** If credences are indexed to capacity, doesn't that make the *content* of the belief dependent on the hardware? If so, when a slow agent and a fast agent look at the same data, are they literally believing different propositions, or just failing to believe the same one?

  ### 2. Approximation and Tolerance
  **Question:** You argue agents ought to come "as close as feasible" to the Bayesian ideal. But "close" requires a metric. Who sets the tolerance? If I'm 5% incoherent, am I irrational, or is that within my feasible budget? And if you allow a margin of error, why do the standard vindication arguments—like Dutch Book or Accuracy Dominance—don't they break down once we allow for near-coherent agents?

  **Predicted Reply:** She will likely argue that accuracy frameworks can be rebuilt with bounded dominance rather than exact dominance.
  **Follow-up:** Even if you can rebuild the math, does this shift the normative status? Is the resource-limited agent *justified* in their incoherence, or merely *excused*? There's a difference between "you did the best anyone could" and "you did the best you could, but you're still wrong."

  ### 3. Defining "Feasible"
  **Question:** Let's pin down "feasible." Are you talking about worst-case asymptotic complexity, average-case under a distribution, or wall-clock time on specific hardware? If you say average-case, you have to specify a distribution over problems. But the "best" procedure changes depending on that distribution. Doesn't that make feasibility relative to an assumption about the environment that the agent might not even know?

  **Predicted Reply:** She will likely bite the bullet and say feasibility is relative to the actual distribution of problems the agent faces in their world.
  **Follow-up:** If the norm depends on the problem distribution, and that distribution is a contingent fact about the world, have you turned an epistemic norm into a pragmatic one? It starts to look like "you ought to believe what pays off in your environment," which sounds like prudence, not rationality.

  ### 4. The Prudence Leak
  **Question:** Following up on that: if the norm is sensitive to the environment's problem distribution, what happens when the environment changes? If I move from a simple environment to a hostile one where my heuristics fail, do my past credences become retroactively irrational? Or does the norm only apply prospectively? I'm trying to see if the "ought" here is really about truth-tracking, or just about computational survival.

  **Predicted Reply:** She will likely say the norm is prospective and relative to the current context, not retroactive.
  **Follow-up:** But if two agents have the same evidence but different computational budgets, and your view says they have different norms, doesn't that mean truth-tracking is no longer the sole constitutive aim of belief? You seem to be smuggling a goal of "efficiency" into the definition of epistemic rationality.

  ### 5. The Regress Problem
  **Question:** Let's talk about the cost of deciding. Figuring out "the best procedure I can run" is itself a computation. Presumably, finding the optimal algorithm is intractable. So, does the agent need to run a meta-procedure to decide how much computation to spend? If so, isn't that meta-computation also subject to resource constraints, leading to a regress? How do you stop the slide?

  **Predicted Reply:** She will likely appeal to "bounded optimality"—the agent runs the best program *given* the architecture, not the best program *for* the architecture.
  **Follow-up:** But who selects the architecture? If the architecture includes the procedure you actually ran, then whatever you did was, by definition, feasible. How do you prevent this from collapsing into descriptivism, where "feasible" just means "whatever happened"?

  ### 6. Collapse into Descriptivism
  **Question:** I want to press that collapse point. If the "best feasible procedure" is defined counterfactually—what you *could* have run—how do we specify those counterfactuals without referencing what you *did* run? If I have a bug in my code that slows me down, is that bug part of my "feasible budget"? If yes, your norms seem to validate any error as long as it was computationally expensive to avoid.

  **Predicted Reply:** She will likely say the counterfactuals are well-defined relative to the hardware class, not the specific instance history.
  **Follow-up:** But if we abstract away from the specific instance history to the hardware class, we're back to the hardware discontinuity problem. Which brings me to my next point.

  ### 7. Hardware Discontinuity
  **Question:** On your view, if I buy a slower laptop, the standard I'm held to gets looser. If I buy a faster one, I become irrational without my credences changing at all, simply because I *could* have computed more. This feels like a reductio. Rationality usually tracks the relation between mind and evidence, not mind and processor speed. Do you really accept that upgrading your RAM can make your existing beliefs irrational?

  **Predicted Reply:** She will likely bite this bullet, arguing that capacity is part of the "can" in "ought-implies-can."
  **Follow-up:** If you bite it, consider two agents with the same evidence but different budgets. On your view, both can be rational while holding contradictory credences forever. What does your view say they should do when they meet? Is there a norm for disagreement here, or do they just shrug?

  ### 8. Rational Disagreement
  **Question:** If the slow agent and the fast agent can both be rational while disagreeing, does communication break down? If the fast agent says, "You should update to 0.9," and the slow agent says, "I can't, so I shouldn't," are they talking past each other? Does your view force us into a fragmented epistemology where "rational" is no longer a shared standard for a community of inquirers?

  **Predicted Reply:** She will likely argue that they should share procedures, not just credences, to align their feasibility constraints.
  **Follow-up:** But sharing procedures is costly. If the cost of aligning our feasibility constraints is higher than the cost of the disagreement, are we rationally required to remain in disagreement? That seems to make rationality purely a function of transaction costs.

  ### 9. Empirical Falsification (Drop if short on time)
  **Question:** Finally, a look outward. If the "Bayesian Brain" hypothesis is right, and perception is already near-exact inference over rich generative models, does your claim that the ideal is unachievable lose its bite? If our cognitive machinery is already doing the heavy lifting unconsciously, does resource-relative Bayesianism just become a theory of conscious reporting errors rather than deep epistemology?

  **Predicted Reply:** She will likely say that brains doing something Bayesian-ish isn't the same as satisfying the normative axioms.
  **Follow-up:** But if the machinery is there, the "resource constraint" might be less about computation and more about attention. Does your view survive if the bottleneck isn't flops, but something non-computational like salience?

  ***

  ### Commentary on Pressure Points

  **1. The "Heuristics as Evidence" Trap (Your Point 5)**
  I incorporated this into **Question 2** and **Question 5**.
  *   **Why:** Your instinct is right, but she has a ready defense: "Updating on the heuristic output is *also* resource constrained."
  *   **The Fix:** The follow-up in Q2 ("Justified vs. Excused") and Q5 ("Collapse into Descriptivism") corners her better. If she says the agent is excused, she admits the ideal still holds (undermining her main claim). If she says the agent is justified, she risks descriptivism (Q5/6). Don't ask about heuristics directly; ask about the *status* of the output.

  **2. The Empirical Claim (Your Point 7)**
  I placed this as **Question 9**.
  *   **Flag:** Be careful here. If the "Bayesian Brain" people are right, they usually argue the brain is *approximate* Bayesian (e.g., sampling). This actually *helps* her view.
  *   **Adjustment:** The question is phrased to ask if the view becomes "less interesting," but be prepared for her to say, "Exactly! My view explains *why* it's approximate." The real pressure point isn't whether brains are Bayesian, but whether the *approximation* is optimal. If neuroscience shows the brain is *sub-optimal* even given constraints, her view is in trouble. I tweaked the follow-up to focus on "non-computational bottlenecks" to catch this.

  **3. The Regress (Your Point 4)**
  I split this into **Question 5** and **Question 6**.
  *   **Why:** This is the strongest technical objection. It deserves two beats. Q5 sets up the meta-computation cost; Q6 drives the wedge into descriptivism. If you have to cut time, merge these into one long question, but don't lose the "descriptivism" angle—that's where bounded optimality often fails.

  **4. Ordering Logic**
  *   **Q1-2:** Establish the normative landscape (Is it like math? Is it approximate?).
  *   **Q3-4:** Define the core mechanism (Feasibility & Prudence).
  *   **Q5-6:** Internal consistency (Regress & Descriptivism).
  *   **Q7-8:** External consequences (Hardware & Disagreement).
  *   **Q9:** Future/Empirical (The "So What?").

  This flow prevents the episode from peaking at minute 10. The "Hardware Discontinuity" (Q7) is your best intuitive hook for the grad students, so it's placed late enough to be a climax, but early enough to allow for the disagreement follow-up.
