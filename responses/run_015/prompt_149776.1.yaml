      *Word Count Check:* The draft above is around 650 words. I need to expand to ~800. I will expand on the implications of the "competence tail" and the specific nature of the "cost" regarding blame and measurement. I will also elaborate on why (vii) is the ethical anchor.

      *Refining the Prose:* Ensure no bullet points creep in. Keep it dense but readable.

      *Self-Correction on "Load-bearing":* I identified (vii) as load-bearing. I need to make sure I explicitly state *why* it must survive. Because it justifies the shift from mentalism to functionalism.

      *Self-Correction on "Single Revision":* Merging (i) and (ii) into a functional definition is the key.

