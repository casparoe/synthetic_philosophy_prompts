answer: |-
  At a dinner party, a classical set theorist and a constructivist are seated before a perfect spherical chocolate truffle. The classical theorist, swirling his wine, remarks, "You know, assuming the Axiom of Choice, the Banach-Tarski paradox guarantees I could decompose this truffle into finitely many pieces, rearrange them, and have two identical truffles instead of one."

  He slides the plate toward the constructivist. "Go on. Double the dessert."

  The constructivist picks up the knife, hovers it over the chocolate, and then sets it down untouched.

  "What's wrong?" asks the theorist. "Don't you believe the theorem?"

  "I believe the theorem says the pieces exist," the constructivist replies. "But to actually cut this, I need to know which points go into which piece. The decomposition requires selecting a representative from every orbit of rotations—that's an infinite family of sets."

  "Exactly," says the theorist. "And the Axiom of Choice licenses selecting an element from each set without supplying any rule for how the selection is made."

  "Precisely," says the constructivist, pushing the plate back. "It guarantees the choice function exists, but it expressly refuses to define it. You're asking me to execute a physical cut based on a function that has no instructions. I don't cook with existential quantifiers; I need a recipe."

  "But then we only get one truffle," the theorist sighs.

  "Yes," says the constructivist, taking the whole plate. "But at least I know how I got it."
