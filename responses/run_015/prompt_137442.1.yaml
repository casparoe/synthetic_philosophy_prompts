answer: |-
  Here is a complete session design for "The Compounding Coin." It is engineered to fit 90 minutes, minimize arithmetic friction, and force the conceptual collision you want without using jargon until the end.

  ## Session Title: The Compounding Coin
  **Time:** 90 Minutes
  **Participants:** 18 Undergrads (Split: 9 "Solo", 9 "Pool")
  **Materials:** 
  *   18 "Bankroll Trackers" (simple sheets with 20 rows).
  *   5 Types of "Strategy Cards" (see below).
  *   1 Weighted Coin (or phone app capable of biased flips).
  *   Whiteboard for tracking the Pool's aggregate.

  ---

  ## Part 1: The Setup (10 Minutes)

  **1. The Story:**
  Tell them: *"You are investors. You start with 100 Units. There is a game. I flip a coin. If it's Heads, you win. If it's Tails, you lose. You will play 20 rounds. Your goal is to have the most Units at the end."*

  **2. The Constraint (Crucial):**
  *"You cannot change your strategy mid-game. Before Round 1, you must choose what **fraction** of your current bankroll you will bet every single time. If you have 100 and choose 20%, you bet 20. If you win, you have 120. Next round, you bet 24 (20% of 120). If you lose, you have 80. Next round, you bet 16."*

  **3. The Strategy Cards (Bookkeeping Saver):**
  To prevent calculation paralysis, hand out laminated cards. Each student picks **one** card and keeps it face down until the end.
  *   **Card A (Conservative):** Bet 10%. (Win: $\times 1.1$, Lose: $\times 0.9$)
  *   **Card B (Moderate):** Bet 25%. (Win: $\times 1.25$, Lose: $\times 0.75$)
  *   **Card C (Aggressive):** Bet 50%. (Win: $\times 1.5$, Lose: $\times 0.5$)
  *   **Card D (YOLO):** Bet 100%. (Win: $\times 2.0$, Lose: $\times 0.0$)
  *   **Card E (Cash):** Bet 0%. (Win: $\times 1.0$, Lose: $\times 1.0$)

  *Note: The multipliers are pre-printed on the card so they don't have to calculate $(1+f)$ every time. They just multiply their current total by the number on the card.*

  **4. The Split:**
  *   **Group 1 (Solo):** 9 Students. They play individually. Their final score is their own final bankroll.
  *   **Group 2 (Pool):** 9 Students. They play as one entity.
      *   *Instruction:* "You share one bankroll of 900 Units (100 each). Each round, 9 coins are flipped (or one coin flipped 9 times). For every Head, the Pool gains according to the Strategy Cards held by the group. For every Tail, it loses. **Crucially:** After every round, sum the total wealth, divide by 9, and reset everyone's individual tracker to that average. You share the risk and the reward equally every step."
      *   *Why:* This mathematically forces the Pool to experience the **Arithmetic Mean** (Expected Value), while the Solo players experience the **Geometric Mean** (Compounding).

  ---

  ## Part 2: The Game (35 Minutes)

  **Phase 1: The Bull Market (Rounds 1–10)**
  *   **Bias:** Set your coin/app to **60% Heads ($p=0.6$)**.
  *   **Action:** Flip the coin(s). Announce results. Students update trackers.
  *   **Pool Admin:** Appoint one "Pool Banker" to sum the Pool's total on the whiteboard after every round.
  *   **Observation:** Most students will see growth. Card D (100%) will likely double several times. Card E will stay at 100. Card C (50%) will grow fast.

  **Phase 2: The Regime Change (Rounds 11–20)**
  *   **The Twist:** Without announcing anything, switch the coin/app to **50% Heads ($p=0.5$)**.
  *   **Action:** Continue flipping.
  *   **What happens:**
      *   **EV (Pool):** Since $p=0.5$ and payoff is 1:1, the Expected Value is 0. The Pool's wealth will fluctuate but trend flat (Arithmetic Mean $\approx 1$).
      *   **Growth (Solo):** For any bet fraction $f > 0$, the Geometric Mean is $< 1$. $\sqrt{1.1 \times 0.9} \approx 0.995$. **Everyone who bets money will slowly bleed out.**
      *   **The Punishment:** The students who picked Card C or D in Phase 1 (because it worked) will now crash hard. Card D goes to zero on the first Tail. Card C loses 75% of wealth on a Tail.
  *   **The Realization:** Around Round 15, the Solo players will notice they are shrinking despite the "fair" coin. The Pool will notice they aren't growing but aren't dying as fast.

  ---

  ## Part 3: The Debrief (45 Minutes)

  **1. The Reveal (5 mins)**
  *   Ask for final scores.
  *   Reveal the coin bias change (0.6 $\rightarrow$ 0.5).
  *   Reveal the Strategy Cards.
  *   **Plot:** Draw two lines on the board.
      *   Line A (Pool): Roughly flat/slight growth.
      *   Line B (Solo Aggressive): Sharp rise, then sharp crash.
      *   Line C (Solo Conservative): Slow rise, then slow bleed.

  **2. Concept Mapping (20 mins)**
  *   **EV vs. Growth:** *"In Phase 1, betting 100% had the highest Expected Value. If you could play this game in parallel universes, the average universe wins big. But in **this** universe (time), one Tail wiped you out. That is the difference between Arithmetic Averaging (Pool) and Geometric Averaging (Solo)."*
  *   **Ergodicity:** *"The Pool got to average across people (ensemble). The Solo players had to average across time. When those two averages don't match, the system is non-ergodic. You cannot substitute 'average person' for 'average time'."*
  *   **The Twist (Parameter Uncertainty):** *"Why did the aggressive bettors die in Phase 2? Because the edge disappeared. When $p=0.5$, the optimal bet is 0%. Any bet incurs 'volatility drag'. You lose money simply by being exposed to variance, even if the expected value is zero."*
  *   **Kelly Criterion (The Reveal):** *"There is a formula for the fraction that maximizes geometric growth. It's $2p - 1$ for this game. In Phase 1 ($p=0.6$), optimal was 20% (Card A/B border). In Phase 2 ($p=0.5$), optimal was 0% (Card E). If you bet more than the optimal, you reduce your growth rate. If you bet double the optimal, your growth rate drops to zero. If you bet more than that, you lose money."*

  **3. The Limitations / Honesty Clause (15 mins)**
  *This is where you prevent them from over-applying the lesson.*
  *   **Additive vs. Multiplicative:** *"This game assumed you reinvested **everything**. In real life, you consume wealth. If you bet 100% of your investable assets but keep cash for rent, you aren't playing this game. The growth argument applies only to the portion of wealth that compounds."*
  *   **Finite Horizon:** *"We played 20 rounds. If we played only **one** round, Expected Value is king. If you know you quit after Round 20, the 'optimal' fraction shifts. Geometric maximization is an asymptotic argument—it needs a long runway."*
  *   **Divisibility:** *"You can't bet 13.47% easily. Friction matters."*
  *   **Known Probabilities:** *"We knew the payoff (1:1). In reality, you don't know the edge. This is why you should bet **half-Kelly** or less. Over-estimating your edge is fatal; under-estimating it just costs you growth."*

  **4. Q&A (5 mins)**

  ---

  ## Predictable Failure Modes & Mitigations

  | Failure Mode | Why it happens | How to Handle It |
  | :--- | :--- | :--- |
  | **The 100% Better** | Someone picks Card D immediately. | **Let them.** They will go bust in Phase 2 (or even Phase 1). In debrief, make them the hero of the "Ruin" story. Ask: "Did you maximize EV? Yes. Did you survive? No." |
  | **The 0% Better** | Someone picks Card E (Risk Free). | Acknowledge they "won" Phase 2 but "lost" Phase 1. Use them to illustrate that **risk-taking is required for growth**, but must be calibrated. |
  | **The Philosopher** | "This is just assuming Log Utility." (Minute 10) | **Park it.** Say: "Write that down. We are measuring *survival* and *median wealth*, not subjective utility. We will get to utility in the last 15 minutes." |
  | **Pool Noise** | 9 people isn't enough for smooth LLN. | **Manage expectations.** Tell the Pool: "You are simulating the Expected Value path, but with noise. Look at the *trend*, not the wiggles." If the Pool crashes due to bad luck, acknowledge: "Even ensembles have variance, but they don't face *ruin* the same way." |
  | **Bookkeeping Bog** | Calculators slow, math errors. | **The Strategy Cards.** Do not let them calculate $(1+f)$ manually. The card must say "Multiply by 1.25" or "Multiply by 0.75". If they still struggle, project a spreadsheet on screen they can copy. |
  | **Time Creep** | 20 rounds takes too long. | **Cut to 15 Rounds.** (8 Phase 1, 7 Phase 2). The effect is visible by Round 12. Better to have a robust debrief than a rushed game. |

  ---

  ## The "Honesty Clause" Script
  *Read this verbatim or adapt closely for the final 10 minutes.*

  "I want to be careful about what you take away from this. We just proved that maximizing Geometric Growth is better than maximizing Expected Value for a sequential bettor. But that proof rests on hidden assumptions that break in the real world.

  1.  **Multiplicativity:** This only works if your losses compound. If you bet \$10 on a football game and lose, you don't lose 10% of your net worth; you lose \$10. That's additive. In additive bets, Expected Value is usually the right guide. This game forced you to bet a *percentage*, which creates multiplicative risk.
  2.  **The Horizon:** Geometric maximization is an asymptotic claim. It assumes you play 'forever.' If you know this is the *last* bet you will ever make in your life, you should maximize Expected Value, because there is no 'next round' to recover from.
  3.  **Consumption:** We assumed you reinvested 100% of your bankroll. Humans eat. We withdraw capital. When you withdraw, the math changes.
  4.  **Unknown Probabilities:** In this game, I knew the coin bias. You didn't. In reality, you never know the true edge. If you think your edge is 20% but it's actually 5%, and you bet Kelly, you will over-betting and bleed. This is why practical rationality suggests 'Fractional Kelly'—betting half of what the formula says—to account for the fact that your model of the world is always slightly wrong."

  ---

  ## Instructor Prep Checklist
  1.  **Coin/App:** Ensure you can switch bias silently. (e.g., Random.org allows setting probability).
  2.  **Cards:** Print 18 sets of the 5 Strategy Cards.
  3.  **Trackers:** Print sheets with 20 blank rows: `[Round] [H/T] [Multiplier] [New Total]`.
  4.  **Whiteboard:** Designate a "Pool Wealth" column to track the Ensemble average visibly.
  5.  **Timer:** Set alarms for Round 10 (Switch Bias) and Minute 75 (Start Debrief).
