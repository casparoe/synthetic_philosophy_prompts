      *(Self-Correction on "Chance"):* I need to be very precise about Lewisian Chance. Lewisian Chance is time-relative. At time $t$, the chance of a future event is fixed by the history up to $t$ and the laws. If the Oracle is a physical device measuring that, then the Tracker's prediction is either (a) inadmissible (if it predicts the future directly) or (b) evidence about the present state (admissible). If (b), it updates the credence about what the chance *is*, or updates the credence about the outcome *given* the chance.
      *Actually, in forecasting apps, "Chance" is almost always "Epistemic Probability."* I should pivot to that. The user is using "Chance" colloquially. I need to correct this gently.

