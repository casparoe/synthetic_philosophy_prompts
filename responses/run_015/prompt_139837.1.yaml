          4.  Analyze the specific statistics (Calibration vs. Accuracy).
          5.  Provide the solution (Combine, don't choose).
      *   *Self-Correction during drafting:* I must ensure I don't just say "combine them" without explaining the epistemic justification. The justification is that rational credence supervenes on *total evidence*. The Oracle's number is not a commandment; it's a piece of evidence about the frequency.
      *   *Wait, one nuance:* If the Oracle is *certified* as calibrated, that means $P(Event | Oracle=0.7) = 0.7$. If the Tracker is 90% accurate, $P(Event | Tracker=WILL) = 0.9$. What is $P(Event | Oracle=0.7 \land Tracker=WILL)$? It depends on the correlation. If they are independent, it's higher than 0.7. If the Tracker is just a subset of the Oracle's logic, it might be different. But generally, more evidence = better calibration.
      *   *The "Insane" conclusion:* The user thinks ignoring the 90% accurate tracker is insane. They are right. The PP does not require ignoring evidence.
      *   *The "Oracle was never reporting chances" conclusion:* The user thinks this implies the Oracle is a liar. Not necessarily. It implies the Oracle reports chance *relative to its information state*, not the user's.

  7.  **Final Polish:** Check against the prompt constraints.
