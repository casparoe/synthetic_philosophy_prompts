answer: |-
  The central conceptual tension in Plutarch's *Parallel Lives* arises from his assumption of ethical universalism: that *aretē* (virtue) is a stable substance that manifests differently across cultures but remains fundamentally commensurable. Plutarch's method of *synkrisis* (comparison) relies on the reader being able to weigh the moral worth of two lives on a single scale. However, when the social structures underpinning those lives are not merely different but conceptually incommensurable, the scale itself breaks. The comparative judgment ceases to be a measurement of degree and becomes a contradiction of kind.

  To illustrate this, consider a pairing of the contemporary democratic whistle-blower **Edward Snowden** and the Roman statesman and archetypal patron **Marcus Tullius Cicero** (specifically in his role as Consul and Patron upholding the *Mos Maiorum*). Let us isolate the trait of **Fides** (faithfulness/loyalty to confidence and oath).

  In the Roman patronal system, *Fides* is the glue of the social order. It is a hierarchical, personal virtue. A Patron protects his clients; a Magistrate protects the secrets of the State. For Cicero, the suppression of information regarding the Catilinarian conspiracy, and his execution of conspirators without trial, was an act of supreme civic virtue. He prioritized the stability of the Republic and the authority of the Senate over procedural transparency. His *Fides* was owed to the institution and the specific network of obligations that sustained it. To break an oath of secrecy or to undermine the Consul's authority was not just illegal; it was *impious*. It threatened the cosmic and social order. In this framework, a figure like Snowden, who swore an oath to the NSA and then violated confidentiality to reveal state surveillance, commits an act of *infamia*. By the internal logic of Cicero's life, Snowden's action is a moral deficiency: it is the betrayal of the trust that holds the collective together. It is the act of a bad client, a bad citizen, and a bad man.

  Conversely, in the framework of modern liberal democracy, the locus of moral authority shifts from the *person* (the Patron/Consul) to the *principle* (Constitutional Rights/Universal Law). Here, *Fides* is owed primarily to the public trust and the rule of law, not to the institution's hierarchy. Secrecy that violates rights is not a protective measure but a corruption. For Snowden, the virtue lies in **Conscientious Objection** to institutional overreach. By the internal logic of Snowden's life, Cicero's actions (executing citizens without trial, suppressing details of state action) constitute a moral deficiency: they are the acts of a tyrant or a complicit authoritarian. Cicero's "loyalty" is re-categorized as "complicity."

  The contradiction in the comparative judgment lies precisely in the **direction of the moral vector**. Plutarch's *synkrisis* asks: "Who better exemplifies Loyalty?"
  *   If the metric is **Institutional Fidelity**, Cicero is the exemplar and Snowden is the deviant.
  *   If the metric is **Transparency and Accountability**, Snowden is the exemplar and Cicero is the deviant.

  Plutarch's method assumes that "Virtue" points in the same direction for both men. In this pairing, "Virtue" points in opposite directions. To force a comparison is to engage in hagiography: one must distort Cicero's secrecy as "prudent statecraft" (ignoring the authoritarianism) or distort Snowden's leakage as "treason" (ignoring the civic courage), simply to make them fit on the same moral axis.

  Excising one figure to preserve consistency defeats the pedagogical purpose of biography for moral formation. If we remove Cicero to preserve the virtue of the whistle-blower, we teach a morality of **individual conscience devoid of social cost**. The student learns that truth is absolute and institutions are merely obstacles. They fail to learn the burden of *governance*—the tragic necessity of sometimes maintaining order at the expense of perfect transparency. We lose the lesson of responsibility *for* the collective.

  If we remove Snowden to preserve the virtue of the Patron, we teach a morality of **hierarchical obedience devoid of critical judgment**. The student learns that duty is synonymous with compliance. They fail to learn the necessity of resistance when the institution becomes corrupt. We lose the lesson of responsibility *to* the truth.

  The pedagogical value of the biography lies not in resolving this tension, but in sustaining it. Moral formation requires *phronesis* (practical wisdom), which is the capacity to navigate conflicting goods. By keeping both lives in the frame, the reader is forced to confront the fact that "Virtue" is not a static object to be collected, but a dynamic negotiation between **Order (Cicero)** and **Justice (Snowden)**. To excise one is to offer the student a dogma; to retain both is to offer them a dilemma. It is in the friction of the incommensurable that the student learns that moral learning is not the memorization of exemplary acts, but the cultivation of the judgment required to know when to be a Patron and when to be a Whistle-blower.
