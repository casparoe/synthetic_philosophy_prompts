  I polished up the glass to catch the light,
  To hold the world exactly as it stands.
  A perfect map drawn distinct from the night,
  Where every term obeys the real commands.
  I sought the matching shape, the rigid line,
  The noun that locks onto the solid thing.
  No escape from the fact, no design,
  Only the duty accuracy must bring.
  If the reflection wavers, then I lie,
  If the image blurs, the logic rots.
  I need a static star within the sky,
  To tie my thoughts to fixed and final knots.
  The mirror waits to show me what is true.
  But now the glass is clear and nothing breaks,
  Yet I cannot move my hands to build a house.
  The picture holds, but offers no use for us.
  So let the surface shatter on the floor,
  Not because it lied, but because it stalls.
  I need a hammer now, to build a gate,
  To knock down walls or answer when one calls.
  We weave a net to catch the shared despair,
  Not to trap the facts inside a box.
  A vocabulary suited for the care
  Of strangers walking on these shifting blocks.
  I swap the lens for something soft and plain,
  A lever prying open future ground.
  It fits the hand, a weight without a chain,
  Not matching world in any fixed sound.
  Just words to help us cope and get along,
  A tune that shifts whenever we move on.

