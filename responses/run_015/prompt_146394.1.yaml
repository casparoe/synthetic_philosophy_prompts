      *   (3) *No Reasonable Rejection (NRR) $\rightarrow$ Strict Equality:* This leans towards Scanlon or a strict egalitarian reading. If the worst-off can reject *any* inequality, DP collapses into equality.
      *   (4) *DP as Pragmatic Compromise:* Endorsing DP despite (3) saying justice demands equality. This is the "pragmatist" move.
