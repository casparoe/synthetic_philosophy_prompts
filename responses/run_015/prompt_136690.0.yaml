      *   **Key Argument 2 (External Limit/Harm):** When detached from this specific post-Reformation European genealogy and applied universally (to East Asian, Sub-Saharan, South Asian contexts), it becomes analytically harmful (false taxonomy, obscures divergent outcomes like colonialism vs. welfare).
