      *   *Conclusion:* Final ruling.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I rate the strength? Yes, need to ensure explicit ratings (e.g., "Strong," "Moderate," "Weak").
      *   *Check:* Did I address the specific prompt about the line between political reciprocity and global causal interdependence? Yes, this needs to be the climax of the analysis.
      *   *Tone Check:* Ensure I don't just pick a winner but explain *why* the debate is stuck.
      *   *Philosophical Accuracy:* Ensure terms like "begging the question," "normative priority," and "coercive cohabitation" are treated correctly. Maya's argument is very Nagel-esque ("The Problem of Global Justice"). Leo's is very Abizadeh-esque ("Coercion, Legitimacy, and Open Borders"). I should reference these implicitly or explicitly to ground the analysis.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Missing" section is robust. (Proceed to generate output based on this structure.)

      *   *Maya 1:* Strength 8/10. Captures the democratic intuition. Weakness: Presupposes the unit.
