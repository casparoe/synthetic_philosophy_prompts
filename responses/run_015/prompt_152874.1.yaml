          *   *Basis:* Reciprocity arising from joint authorization and coercion.
          *   *Goal:* Defend compatriot priority without relying on ethnicity.
          *   *Philosophical Lineage:* Sounds like Nagel (coercion), Rawls (basic structure), or maybe Christiano.

      *   **Leo's First Reply (Arbitrariness & Membership vs. Cohabitation):**
          *   *Critique:* Institutional defense begs the question (boundaries are arbitrary/coercive).
          *   *Distinction:* Membership obligations (consent) vs. Coercive Cohabitation obligations (subject to power).
          *   *Implication:* If it's about coercion, non-citizens/outsiders affected should count, dissolving compatriot priority.
          *   *Philosophical Lineage:* Sounds like Abizadeh (coercion requires justification to all subject), or cosmopolitan critics of statism.

      *   **Maya's Counter (Specific Reciprocity of Risk):**
          *   *Defense:* It's not just subjection; it's *specific reciprocity of risk* (conscription, fiscal extraction via votes).
          *   *Claim:* This generates legitimate priority even if borders are arbitrary.
          *   *Philosophical Lineage:* Trying to salvage the "special tie" via specific mutual vulnerability.

      *   **Leo's Counter (Contingency of Risk):**
          *   *Critique:* Empirical risk is too contingent (wealthy citizen vs. burdened foreign worker).
          *   *Implication:* Criterion over-includes (wealthy safe citizens) or collapses into cosmopolitanism (anyone causally affected).
          *   *Philosophical Lineage:* Empirical objection to normative claims, pushing towards outcome-based cosmopolitanism.

  3.  **Evaluate Each Move (Step-by-Step):**

      *   *Maya 1:* Strong normative foundation (democratic reciprocity). Weakness: Assumes the legitimacy of the boundary itself.
      *   *Leo 1:* Strong critique of circularity (boundaries define the "we"). Weakness: The distinction between membership and cohabitation might be too sharp; democratic membership *is* a specific kind of cohabitation.
      *   *Maya 2:* Refines the argument to "mutual liability." Stronger than generic coercion. Weakness: Is "risk" the right metric? What about those exempt from risk?
      *   *Leo 2:* Hits the empirical variability. Strong point on the "wealthy citizen" loophole. Weakness: Might be conflating *degree* of obligation with *existence* of obligation.

  4.  **Identify What's Missing (The "Referee's Insight"):**
      *   Both are stuck in a binary: Special Obligations vs. General Obligations.
      *   They need to address the *nature* of the political relationship vs. causal impact.
      *   *Key Concept:* The distinction between *political agency* (joint authorship) and *causal impact* (trade policies).
      *   *Key Concept:* The "All-Subjected Principle" vs. "All-Affected Principle."
      *   *Missing Nuance:* The role of *ongoing political agency* vs. *passive subjection*. Maya focuses on agency but leans on risk; Leo focuses on impact but ignores agency.
      *   *Missing Nuance:* The distinction between *distributive justice* (internal) and *humanitarian/duty of rescue* (external).

  5.  **Drafting the Response:**

      *   *Introduction:* Set the stage, acknowledge the depth of the debate (Statism vs. Cosmopolitanism).
      *   *Round 1 Analysis:* Maya (Institutional Co-Authorship) vs. Leo (Arbitrariness).
      *   *Round 2 Analysis:* Maya (Risk Reciprocity) vs. Leo (Contingency).
      *   *The Verdict/Missing Pieces:* This is the core value add.
