answer: |-
  As the referee for this workshop, I have analyzed the dialectic between Maya and Leo. Their exchange tracks a classic and high-stakes debate in political philosophy: **Statism (or Political Particularism) vs. Cosmopolitanism.** Maya defends a version of "political associationism" (akin to Thomas Nagel or Michael Blake), while Leo argues from a cosmopolitan critique of state coercion (akin to Arash Abizadeh or Simon Caney).

  Below is the step-by-step adjudication, followed by an analysis of what both are missing regarding the principled line between political reciprocity and global interdependence.

  ---

  ### Round 1: The Grounds of Obligation

  **Maya's Opening: Institutional Co-Authorship**
  *   **Argument:** Special obligations arise from joint authorship of coercive institutions (laws, taxes, democratic risk). It is a reciprocity of *agency*, not ethnicity.
  *   **Strength:** **High (8/10).** This is a robust normative claim. It successfully sidesteps the moral irrelevance of ethnicity and grounds obligation in the specific moral relationship of democracy: we impose rules on each other, so we owe each other justification and distribution. It captures the intuition that democracy is a cooperative venture for mutual advantage.
  *   **Weakness:** It presupposes the legitimacy of the "unit" (the state). It assumes the boundary of the "we" is already settled.
  *   **Verdict:** **Mostly Right.** She correctly identifies that democratic reciprocity generates stronger duties than mere proximity. However, she is vulnerable to the charge of circularity: *why* is this specific group the relevant co-authoring body?

  **Leo's Reply: Arbitrariness & The Membership/Cohabitation Distinction**
  *   **Argument:** Maya begs the question because borders are historically arbitrary/coercive. He distinguishes *membership obligations* (consent-based) from *coercive cohabitation obligations* (subjection-based). If the latter grounds the duty, it must extend to all subject to the power (including non-cizens/outsiders).
  *   **Strength:** **Very High (9/10).** Leo lands a critical blow. He identifies the "boundary problem." If the source of obligation is the *coercion* itself (as Maya admits), then moral consistency demands that everyone subjected to that coercion counts. By distinguishing membership from cohabitation, he shows that Maya's criteria (coercion/subjection) actually overflow the borders she wants to maintain.
  *   **Weakness:** He potentially sets the bar for "membership" too high (requiring explicit consent), which almost no modern state satisfies.
  *   **Verdict:** **Right.** Leo correctly identifies that if coercion is the trigger for justice, the scope of justice expands beyond the citizenry. Maya's initial definition is too porous to sustain compatriot priority.

  ---

  ### Round 2: The Specificity of Risk

  **Maya's Counter: Specific Reciprocity of Risk**
  *   **Argument:** It is not just subjection, but a unique *reciprocity of risk* (conscription, fiscal extraction via votes). Citizens are uniquely liable to one another in ways outsiders are not.
  *   **Strength:** **Moderate (7/10).** This refines her position well. She moves from "subjection to power" to "mutual vulnerability." This captures the specific texture of citizenship: I can be drafted to fight a war you voted for; a foreigner cannot. This creates a distinctive relational tie.
  *   **Weakness:** It relies on empirical contingencies. Not all citizens face equal risk (e.g., the wealthy who avoid conscription or tax burdens).
  *   **Verdict:** **Partially Right.** She identifies a phenomenological difference between citizens and outsiders. However, she risks grounding a normative priority on an empirical fact (risk) that is unevenly distributed.

  **Leo's Counter: Contingency of Risk**
  *   **Argument:** Empirical risk is too contingent. A wealthy citizen faces little risk; a foreign worker bears substantial burden from trade policy. Therefore, Maya's criterion either excludes safe citizens (over-exclusion) or includes burdened foreigners (collapse into cosmopolitanism).
  *   **Strength:** **High (8/10).** Leo effectively weaponizes empirical reality against normative theory. If the "special tie" depends on actual risk-sharing, then a wealthy tax-dodger has no special tie to a poor conscript. Conversely, if the tie depends on *bearing burdens from state policy*, the foreign worker qualifies.
  *   **Weakness:** He may be conflating the *source* of the obligation with the *degree* of vulnerability. One can have a special obligation to a fellow citizen even if one is currently safer than them.
  *   **Verdict:** **Mostly Right.** He exposes the fragility of "risk" as a normative metric. However, he overlooks that the *liability* to risk (legal status) matters more than the *incidence* of risk (empirical reality).

  ---

  ### The Referee's Analysis: What Both Are Missing

  Both participants have argued skillfully, but they are stuck in a loop because they are missing a crucial conceptual distinction. They are debating **Scope** (who counts?) without agreeing on the **Nature** of the obligation (what kind of duty is it?).

  Here is what is missing from their exchange, specifically regarding the principled line between political reciprocity and global causal interdependence.

  #### 1. Political Agency vs. Causal Impact (The "All-Subjected" vs. "All-Affected" Problem)
  Maya and Leo conflate *being affected by* a state with *being an agent of* a state.
  *   **Maya's Blind Spot:** She leans on "risk" (a passive experience) rather than "agency" (an active role). To save her argument, she must argue that compatriot priority stems from **joint political agency**, not just shared vulnerability. Citizens are not just co-victims of the state; they are co-authors. They have the *right to vote* and the *duty to justify* laws to one another.
  *   **Leo's Blind Spot:** He treats the foreign worker affected by trade policy as morally equivalent to the citizen. But the foreign worker is a *patient* of the policy, not an *agent*. While the foreign worker is owed humanitarian aid or non-harm duties (cosmopolitan justice), they do not share in the **relational equality** of the democratic process.
  *   **The Principled Line:** The line is not "risk" or "coercion" alone; it is **reciprocal political accountability**. Citizens owe each other *distributive justice* because they share a basic structure they collectively control. Outsiders are owed *non-exploitation and basic rights* because they are human beings affected by power, but they do not participate in the "joint authorship" that generates thick distributive claims (like welfare rights).

  #### 2. The Distinction Between "Justice" and "Humanity"
  Both speakers assume a monolithic concept of "obligation."
  *   **Maya** assumes special obligations imply *distributive priority* (more money/resources for us).
  *   **Leo** assumes that if outsiders have claims, they must be the *same* claims as citizens.
  *   **The Missing Nuance:** There can be a principled line where citizens owe each other **egalitarian justice** (due to shared political sovereignty), while owing outsiders **sufficientarian justice** (due to shared humanity/causal impact). Leo is right that outsiders have claims, but wrong that those claims dissolve the *priority* of internal distribution. Maya is right that there is priority, but wrong to ground it on risk rather than shared sovereignty.

  #### 3. The Normative Significance of the "Basic Structure"
  Neither explicitly invokes the Rawlsian idea of the **Basic Structure**.
  *   The state is not just a coercive power; it is a comprehensive system of social cooperation that defines life chances.
  *   **Maya** needs to argue that because citizens share a *basic structure*, they owe each other fairness in the distribution of its benefits/burdens.
  *   **Leo** needs to acknowledge that while global causal interdependence exists, there is no *global basic structure* of the same depth. Therefore, the obligations triggered are different in kind, not just in degree.

  ### Final Ruling

  **Winner:** **Leo** wins on logical consistency regarding coercion, but **Maya** wins on capturing the democratic intuition. However, as it stands, **Leo's critique exposes a fatal flaw in Maya's specific formulation.** If Maya grounds obligations in "coercion" or "risk," Leo is correct that these spill over borders.

  **How Maya Could Win (The Path Forward):**
  Maya must shift her argument from **Coercion/Risk** to **Collective Self-Determination.**
  *   *Argument:* "Leo, you are right that coercion creates duties to all subjected. But **distributive justice** is a specific duty owed only to those with whom we share **political sovereignty**. We owe the foreign worker non-harm and fair trade (justice as non-domination), but we owe the compatriot a share of the social product (justice as reciprocity) because we are engaged in a joint project of self-rule that the foreigner is not part of."

  **How Leo Could Win (The Path Forward):**
  Leo must press the **Democratic Inconsistency.**
  *   *Argument:* "Maya, if you value democratic self-determination, you cannot ignore the non-citizen residents who are subject to your laws but have no vote. Your 'special reciprocity' is actually an exclusionary cartel. Until the 'co-authorship' is open to all permanently subjected to the power, your distributive priority is merely privilege."

  ### Conclusion on the Principled Line
  The principled line between political reciprocity and global causal interdependence lies in **Reciprocal Accountability.**
  *   **Political Reciprocity:** I can vote you out; you can vote me out. We stand in a relation of horizontal equality. This grounds **Distributive Justice.**
  *   **Global Causal Interdependence:** Your policies hurt me; my labor helps you. We stand in a relation of vertical impact. This grounds **Duties of Rescue and Non-Harm.**

  Maya fails because she grounds the duty in *risk* (which is vertical/passive). Leo fails because he assumes *impact* creates the same duties as *agency*. The referee advises them to recalibrate: Compatriot priority is justified not by shared suffering (risk), but by shared sovereignty (agency).
