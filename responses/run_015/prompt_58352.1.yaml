answer: |-
  What he got right
  He's correct that the Knobe Effect demonstrates a robust psychological link where moral badness makes people much more likely to label a side effect as intentional compared to a good one. This challenges the traditional philosophical view that intentionality is a purely neutral, mechanical concept separate from moral evaluation. It also rightly highlights that our judgments about mental states are often driven by a desire to hold agents accountable for negative outcomes rather than just tracking cognitive processes.

  What he stretched
  However, claiming intentionality is *nothing but* blame oversimplifies the data, because subsequent studies show the effect persists even with non-moral norms, like violating an etiquette rule or a corporate policy, where blame isn't the primary driver. The effect suggests that moral considerations are a relevant input for applying the concept of intentionality, not that the concept itself is merely a disguised moral judgment. Regarding your delivery robot, people might still say it "intentionally" woke the baby if that action violated its programmed normative constraints, suggesting the mechanism is about expectation violation rather than pure moral condemnation. His leap assumes that because morality influences the judgment, the judgment contains no factual content about the agent's relationship to the outcome, which ignores how normative expectations shape our understanding of agency itself.

  So what for armchair philosophy
  This doesn't invalidate armchair philosophy, but it does mean conceptual analysis must be informed by empirical psychology rather than relying solely on introspection. Philosophers need to explain why moral facts are relevant to metaphysical concepts, rather than dismissing the intuitions as errors or reducing the concepts to mere moral tools. It forces a collaboration between fields instead of a dismissal of one by the other.
