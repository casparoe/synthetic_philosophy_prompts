  **Rules consistent with the record**

  Three distinct principles emerge from the eight rulings, sufficient to generate the observed outcomes without contradiction. First, the **Unit Principle**: moral consideration attaches strictly to individual organisms, not superorganisms. This admits ant workers while excluding colonies, establishing the biological individual as the locus of welfare. Second, the **Evidence Principle**: scope entry requires either direct physiological markers, robust behavioral proxies (learning, trade-offs), or strong phylogenetic homology; crucially, abundance alone is explicitly insufficient. This excludes soil nematodes despite their numbers while admitting honey bees and ants despite lacking nociceptors. The bee dissent suggests this threshold is sensitive to the quality of behavioral proxies, allowing multiple weak markers to substitute for one strong one. Third, the **Tractability Principle**: full scope (intervention funding) requires a feasible lever to alter welfare; without it, taxa fall to research-only. This distinguishes mosquitoes from cephalopods. A fourth implicit rule concerns **Priority**: within full scope, rarity combined with high evidence may yield lower priority than abundance combined with proxy evidence, as seen in the cave isopod versus ant workers. Finally, the **Category Distinction**: "Excluded" denotes no moral standing; "Research-only" denotes probable standing but no leverage; "Full Scope" denotes standing plus leverage. The Research-only category is critical; it allows the panel to acknowledge moral uncertainty without committing to intervention costs, a nuance essential for the mosquito ruling where evidence was weak but not absent. This prevents a binary trap where taxa are either fully funded or ignored. By maintaining this middle ground, the rules permit the panel to fund investigation into borderline cases without necessarily endorsing large-scale intervention until credence increases. Thus, the system is robust enough to handle the dissent on bees and the specific constraints on mosquitoes, providing a stable architecture for future decisions regarding phylogenetic proxies and tractable levers.

  **What each rule implies here**

  | Rule | Verdict on Collembola | Key Consideration |
  | :--- | :--- | :--- |
  | Unit Principle | Pass | Individuals are the target of tillage changes. |
  | Evidence Principle | Borderline | Homology exists, but no direct behavior; 100my divergence is significant. |
  | Tractability Principle | Pass | Tillage change is cheap, scalable, and effective. |
  | Abundance Neutrality | Pass | High numbers do not disqualify, unlike nematodes. |
  | Expected Value | Pass | High abundance × low credence yields high potential impact. |

  The Evidence Principle is the pivot. If homology suffices (as behavioral proxies did for bees), the panel moves to Full Scope. If direct markers are required for intervention, the lack of within-group data pushes toward Research-only. The Tractability Principle strongly favors Full Scope, distinguishing this case from the mosquito ruling where no intervention was possible. The Abundance rule prevents exclusion based on numbers alone, neutralizing the nematode precedent. Ultimately, the rules suggest a Full Scope verdict is permissible provided the homology is accepted as a valid proxy, but the low credence suggests a lower priority ranking within that scope, similar to the isopod but scaled by abundance. The panel must decide if phylogenetic distance weakens the proxy enough to demote the category from Full Scope to Research-only, despite the available leverage.

  **Recommended decision**

  The ruling that best coheres with the record is **Full Scope**, likely with a moderated priority rating. The mosquito precedent excludes intervention primarily when leverage is absent; here, the tillage change offers clear leverage, removing the primary barrier that relegated mosquitoes to research-only. The nematode precedent excludes only when evidence is absent; here, phylogenetic homology provides a proxy akin to the behavioral markers accepted for bees and ants. To rule Research-only would be to privilege physiological markers over phylogenetic ones, contradicting the bee ruling, or to ignore tractability, contradicting the mosquito ruling. Full Scope acknowledges the uncertainty via the low credence but respects the panel's history of acting on proxies when leverage exists. It treats the homology as sufficient evidence to cross the threshold, while the low credence naturally limits priority relative to confirmed taxa like cephalopods. This maintains consistency: we act on proxies (bees) when we can help (unlike mosquitoes). It also respects the "abundance is not evidence" rule by relying on homology, not numbers, for entry, while allowing numbers to inform the scale of the intervention. This approach balances the risk of false positives against the potential magnitude of welfare gains.

  **Closest precedent, and how far it carries**

  You identify the mosquito ruling as the obvious candidate, and rightly so: it pairs vast numbers with weak evidence. However, the disanalogy is decisive. Mosquitoes were relegated to research-only primarily because no tractable intervention existed ("no tractable intervention" is listed alongside evidence gaps). For Collembola, the intervention is the proposal's core strength. The mosquito precedent supports a Research-only verdict *only if* you judge the homology too weak to meet the Evidence Principle. If homology equals behavioral proxy, the mosquito precedent collapses, and the ant worker precedent (full scope, high abundance, no nociceptors) becomes the stronger guide. The mosquito case tests leverage; this case tests evidence thresholds.

  **What we would be committing to either way**

  Choosing **Full Scope** commits the panel to the principle that phylogenetic homology suffices for intervention when leverage is high, effectively adopting a precautionary expected-value framework. It signals that we will bet resources on low-probability welfare claims if the magnitude is sufficiently large. Choosing **Research-only** commits us to the principle that intervention requires direct evidence of valence, treating homology as merely hypothesis-generating. It prioritizes epistemic certainty over potential welfare gains. A compromise of Research-only implicitly adopts a "wait for certainty" principle, acknowledging the risk of wasting resources on non-sentient beings. It establishes a hierarchy where evidence quality gates resource deployment, regardless of potential scale. Either way, you are defining the weight of phylogenetic data against the cost of false positives in resource allocation. The choice determines whether the fund acts as a precautionary insurer against suffering or a strict evidence-based grant maker. By choosing Research-only, you also commit to the view that the cost of mistaken intervention outweighs the cost of mistaken inaction, a value judgment not explicitly present in the bee or ant rulings.

  **The case that would settle it**

  Consider a globally abundant agricultural pest with **confirmed nociceptors** but **no conceivable intervention** (e.g., wild distribution prevents targeting). If you place this in Full Scope, you prioritize moral status over tractability (rejecting the mosquito logic). If you place it in Research-only, you prioritize tractability over status (affirming the mosquito logic). This case isolates the Tractability Principle from the Evidence Principle. Alternatively, consider a rare species with **no homology** but a **cheap intervention**. Ruling Full Scope here would prove leverage trumps evidence; ruling Excluded would prove evidence is the gatekeeper. The pest case best discriminates whether "Full Scope" is a moral classification or a funding category.

  **On the arithmetic of very large numbers and shared credences**

  Your instinct to multiply survives correction, but its justification shifts. Your colleagues are correct that the Law of Large Numbers does not apply to systemic uncertainty: either all Collembola feel pain or none do; the credence (0.1) is the probability of the "all" state, not a frequency of sentient individuals. However, in decision theory, we maximize Expected Value (EV). EV is indeed Probability × Impact. If the impact is aggregate welfare, then 10^14 × 0.1 is the correct metric for comparison against 10^4 × 1.0. You are not enumerating sentient animals; you are weighing bets. The instinct survives because the *decision* depends on the expected magnitude of suffering, not the certainty of its existence. When comparing abundant/poorly-evidenced taxa against scarce/well-evidenced ones, you are comparing the expected value of the intervention, not the ontological status of the subjects.
