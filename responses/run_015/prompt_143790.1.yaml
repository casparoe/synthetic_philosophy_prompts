      *   **Under the RNA Precedent:** The RNA system failed partly on "replicating molecule" vs "organism." If the boundary self-assembles from internal catalysis, it becomes an "organism" by function. If the group *still* votes "Not Alive" because the heredity is compositional (no sequence), they have revealed that **Digital/Sequence Information** is the necessary condition for their definition of life, regardless of metabolism or boundaries.

  **Final Advisory Note:**
  You are correct that this is a dispute about "carving thingspace." The definition is doing covert work for a policy decision: does the agency want to fund/ethically review origin-of-life simulations? A "Not Alive" ruling keeps System K in the "Chemistry" bucket (lighter regulation). An "Alive" ruling moves it to "Synthetic Biology" (heavier regulation). The minutes should record not just the vote, but *which constraint* was decisive (e.g., "The Chair noted the decision turned on the definition of self-sustenance, not the capacity for evolution"). This preserves the precedent for future cases where evolution is clearer.
