  ### Part III: The Crucial Test Case

  To separate the surviving rules (specifically **Rule 2: NASA-Operational** vs. **Rule 4: Polymer/Template Constraint**), the group should consider the following tweak to System K:

  **The "Synthetic Membrane" Tweak:**
  Modify System K so that the coacervate droplets **synthesize their own peptide/lipid boundary components** from the supplied fuel and simple precursors, while retaining compositional heredity and supplied internal building blocks.

