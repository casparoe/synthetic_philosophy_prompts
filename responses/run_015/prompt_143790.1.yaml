  ### Part I: Enumeration of Candidate Rules and Precedent Testing

  Before assessing System K, we must reverse-engineer the implicit decision rules from the working group's six-year track record. The explicit definitions (NASA/Sagan, Gánti) are insufficient on their own; the precedents reveal the operational heuristics. Below are the four candidate rules currently in play, tested against the established corpus.

  **Candidate Rule 1: The Gánti-Strict Criterion (Substantialism)**
  *Definition:* Life requires the co-existence of three distinct subsystems: Metabolism, Template Replication, and a Lipid Membrane.
  *   **Mule:** Pass (has all three).
  *   **Endospore/Tardigrade:** Pass (potentiality accepted).
  *   **Virion/Prion:** Fail (no metabolism/membrane).
  *   **Oxidation Front/Program:** Fail (not chemical/bounded).
  *   **Cell-free RNA:** Fail (no membrane, no lipid).
  *   **System K Prediction:** **Fail.** Coacervates are not lipid membranes; heredity is compositional, not templated.
  *   *Status:* **Contested.** The 4–3 vote on the RNA system suggests a minority holds this view, but the majority likely rejects strict Gánti adherence since coacervates function as boundaries.

  **Candidate Rule 2: The NASA-Operational Criterion (Process)**
  *Definition:* A self-sustained chemical system capable of undergoing Darwinian evolution.
  *   **Mule:** **Fail** (individually sterile). *Precedent Override:* The group ruled Mules alive, implying "capable" applies to the *lineage* or *kind*, not the individual token.
  *   **Virion:** Fail (not self-sustained; requires host machinery).
  *   **Cell-free RNA:** **Borderline.** It evolved. It was chemical. The "Not Alive" ruling hinges on "self-sustained" (supplied blocks).
  *   **System K Prediction:** **Pass.** It evolves (division rate tripled). It is chemical. It sustains far-from-equilibrium states.
  *   *Status:* **Settled with caveats.** This is the working definition, but "self-sustained" is the leaky term.

  **Candidate Rule 3: The Autonomy/Host-Dependence Heuristic**
  *Definition:* A system is not alive if it requires the specific, complex machinery of another living organism to replicate (distinguishes Virion from Mule).
  *   **Mule:** Pass (requires food, not cellular machinery).
  *   **Virion:** Fail (requires ribosomes/polymerases).
  *   **Cell-free RNA:** Pass (requires chemicals, not cellular machinery).
  *   **System K Prediction:** **Pass.** Requires fuel/shear, but not a host cell.
  *   *Status:* **Settled.** This explains the Virion vs. Mule distinction better than metabolism alone.

  **Candidate Rule 4: The Polymer/Template Constraint (The "RNA Precedent" Rule)**
  *Definition:* Heredity must be encoded in a sequence-bearing polymer (DNA/RNA) to count as biological life; compositional heredity is "chemistry," not "biology."
