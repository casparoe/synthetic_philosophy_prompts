answer: |-
  Your distinction between the sequential decision framing and the procedural-continuity view captures the core philosophical tension in the absent-minded driver problem with remarkable precision. It is not merely a matter of semantic preference but reflects a deeper divergence in how we model agency over time. To address your question directly, these are genuinely competing theories of rational agency rather than complementary levels of analysis, because they offer incompatible prescriptions for what constitutes a rational action at the moment of choice. The sequential view, which treats the agent as a collection of temporal parts linked by game-theoretic equilibrium concepts, predicts that upon reaching the first exit, the driver faces a genuine decision problem where re-optimization is not only possible but required by local rationality. Under this framing, the driver at the intersection cannot simply defer to the past self because the information set has changed; the uncertainty about whether this is the first or second exit alters the expected utility calculation. Consequently, this view predicts that a rational driver might deviate from the ex ante plan, perhaps adopting a mixed strategy where he exits with some probability, because the ex ante optimal plan is not dynamically consistent. This allows for rational planning ex ante only in a qualified sense; the plan is optimal at the start but is not credible to the future self, meaning the planning stage is essentially advisory rather than binding. In analogous cases of akrasia, such as the dieter relying on willpower, this model predicts failure. It treats the dieter at the moment of temptation as a distinct agent who legitimately weighs immediate gratification against long-term goals, often finding the immediate reward superior given the localized information and visceral state. The failure to diet is thus a rational outcome of sequential optimization under changing constraints, not necessarily a failure of mechanism.

  In contrast, the procedural-continuity view posits that the agent is a single entity whose rationality is defined over the entire trajectory of action rather than at isolated decision nodes. This view predicts that upon reaching the first exit, the driver does not engage in fresh optimization but instead executes a pre-committed policy. The reasoning protocol at the intersection is identical to the planning stage because the agent recognizes that any deviation would undermine the integrity of the policy selected when competence was highest. Here, rational planning ex ante is sovereign; it is the only locus of genuine choice, while execution is merely mechanical compliance. This model handles the dieter analogy by favoring the dieter who hides snacks, as this aligns with the view that rational agency involves structuring the environment to ensure procedural continuity. The dieter who relies on willpower is seen as erroneously granting decision-making authority to a compromised future self. By adopting the procedural-continuity view, you do not necessarily abandon the game-theoretic framing, but you significantly supplement and constrain it. You are effectively restricting the strategy space to exclude re-optimization at information sets where recall is imperfect, treating the agent as a commitment device unto themselves. This modifies the standard game-theoretic assumption that agents must maximize utility at every information set, replacing it with a requirement to maximize utility over the set of all feasible policies.

  Regarding whether the procedural-continuity view resolves the paradox or merely relocates the difficulty, the answer depends on whether you view the paradox as logical or practical. Logically, it resolves the contradiction by denying the premise that the acting self has the authority to contradict the planning self. There is no inconsistency because there is no second evaluation; there is only the implementation of the first. However, practically, it relocates the difficulty into the design and reliability of the commitment mechanism. The problem shifts from how to reason at the exit to how to ensure the agent remains bound to the plan despite the inability to distinguish exits. If the driver cannot distinguish the exits, he cannot condition his action on being at the first versus the second, which means the commitment must be blind. The difficulty becomes ensuring that the heuristic or rule is robust enough to withstand the temptation to re-evaluate, which is essentially the problem of akrasia restated. The paradox of inconsistent preferences is dissolved, but the practical challenge of self-binding remains intact. You are left with the question of why the agent cannot simply choose to re-optimize at the intersection, which brings you back to the need for a meta-rule that forbids such reasoning.

  Finally, on the question of a principled criterion for deciding between the split-agent and continuity models, there is no neutral empirical test that settles the matter without assuming one framework from the outset. The choice is ultimately normative and metaphysical, hinging on your conception of personal identity and the locus of rationality. If you believe rationality is a property of moments and that an agent must always do the best they can given what they know now, the split-agent model is unavoidable, and the paradox is a real feature of rational life under imperfect recall. If you believe rationality is a property of lives and that an agent should act as the author of their entire narrative, then the continuity model is required, and the paradox is an artifact of improper modeling. The criterion is therefore coherence with your broader theory of agency. If you wish to preserve the possibility of rational commitment and self-binding as robust phenomena, you must adopt the procedural-continuity view, accepting that it requires a richer model of agency than standard sequential equilibrium provides. If you wish to preserve the purity of local optimization and the idea that beliefs and desires at a moment dictate action, you must accept the split-agent view and the resulting time-inconsistency. Neither is objectively correct in a vacuum; they are tools for different explanatory purposes, one highlighting the fragility of rationality over time and the other highlighting the power of policy selection.
