      *   *Critique:* The prompt says Med Onc sets the tone even though Surg speaks first. I need to be careful not to bash the Med Onc specifically, but address the *dynamic*.
      *   *Fix:* Focus on the *structure* enabling the bias, not the individuals.

  5.  **Drafting the Memo (incorporating the "Strongest Case" requirement):**
      *   *Argument for Status Quo:* Sequential discussion allows for dynamic hypothesis testing. Specialist B hears Specialist A's constraints and adjusts. This is efficient.
      *   *Rebuttal:* This works only if power dynamics are flat. When seniority dictates the "anchor," the adjustment becomes compliance, not synthesis.
      *   *Proposal:* Blind initial input (written) -> Discussion -> Consensus.

  6.  **Final Polish:**
      *   Check word count (keep it "short written opinion").
      *   Ensure the recommendation is concrete (3-month pilot, specific workflow).
      *   Ensure the tone is respectful of the co-chair and the team.

  7.  **Final Review against constraints:**
