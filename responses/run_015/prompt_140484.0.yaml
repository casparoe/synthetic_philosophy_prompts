      *   *Framing C: The Fiduciary Model of Memory.* Focus on the *relationship* between the holder of the record and the subject/event. If memory is a duty, the holder is a fiduciary. Machines can't be fiduciaries; humans delegating to machines creates a chain of custody problem. This bridges the moral obligation with the technical mechanism.
