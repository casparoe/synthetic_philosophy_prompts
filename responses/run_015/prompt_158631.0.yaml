  *   **Strain:** SCA is extensionally inadequate. It tracks manifestation, not the property itself. It cannot distinguish intrinsic loss of disposition (Fink) from extrinsic prevention (Mask).

  **2. Ideal- or Normal-Conditions Analysis**
  *   **Thesis:** $x$ is fragile iff if $x$ were struck *in ideal conditions*, $x$ would shatter.
