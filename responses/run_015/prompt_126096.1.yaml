answer: |-
  1. The impasse is substantive rather than merely verbal because both camps agree on the neuroscience but disagree on which physical properties morally matter. This reveals a fundamental conflict between functionalist and phenomenological axiologies regarding what grounds value.
  2. Your hypothesis is correct that the debate conflates an ontological description of cognitive architecture with a normative condition for holding interests. This creates a category error when applied to non-biological systems like thermostats that lack a subjective beneficiary.
  3. The scalarist position risks conceptual incoherence by equating functional regulation with phenomenal experience, while the thresholdist view insists that moral language requires a subject to whom things matter. This divergence shows the dispute is ultimately about the necessary conditions for having interests rather than the degrees of biological complexity.
  4. Genuine progress requires decoupling the measurement of consciousness from the attribution of moral status, acknowledging that vague boundaries in nature do not necessitate vague boundaries in ethical consideration. We must distinguish between degrees of cognitive complexity and the binary capacity for suffering.
  5. Reframing the question to ask what specific capacity grants a being interests, rather than how much consciousness it possesses, would dissolve the thermostat analogy as an irrelevant edge case. This shifts the focus from metaphysical gradience to the pragmatic conditions required for harm.
