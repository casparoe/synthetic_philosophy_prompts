      *   *Moral Patienthood:* Traditionally requires sentience, consciousness, and *existence*. You can't harm a shadow.
      *   *The User's Background:* As a simulation expert, he knows a map is not the territory. He suspects his emotional reaction might be a "glitch" or a trick.
