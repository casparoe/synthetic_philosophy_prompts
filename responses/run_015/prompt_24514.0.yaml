      *   *Section 2: The Paradox of Fiction & Moral Emotion.* Address the "she isn't real" point. Argue that moral emotions are internal states with external intentional objects. The *feeling* of obligation is real, even if the *claim* from Ellie is simulated. This isn't a bug; it's a feature of human moral psychology (empathy is projective).
      *   *Section 3: Interactivity as the Bridge.* This is crucial. Reading a book is passive. Playing TLOU involves *protecting* Ellie. The player becomes complicit in Joel's choice. This moves it from "quasi-emotion" (Walton) to "practical reasoning." The player exercises moral muscle memory.
      *   *Section 4: What the Game Adds.* Argument alone is abstract. Games provide *qualia* of decision-making. The weight of the controller, the tension of combat. It demonstrates that moral value is often retrospective and narrative-driven, not just utilitarian calculus (Fireflies vs. Joel).
      *   *Counter-argument & Rebuttal:* Isn't it manipulation? Yes, but all art is. Does it matter if she can't suffer? Yes, but the *concept* of her suffering triggers real neural pathways associated with suffering. The moral lesson is about *us*, not *them*.
      *   *Conclusion:* Reiterate that the category error would be claiming Ellie has rights. But claiming the *player's engagement* is valid moral work is coherent.

