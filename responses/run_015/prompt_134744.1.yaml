prompt: |-
  last week in my philosphy of death class a grad student kept invoking 'death is just changing clothes' to argue that funerals are basically performative waste — like, if the dead just swapped garments, why should survivors act like something was destroyed in thier absence? I know that's a bastardized Zhuangzi but I want to take it seriously for a second. Can you lay out the different precise theses that slogan could be running — personal identity dissolving vs. the body recycling its qi vs. consciousness being like a coat you hang up vs. maybe something about social roles being temporary — and for each say whether it's trivial, whether Zhuangzi's texts actually support it, and whether it really gets the anti-funeral conclusion? Please format as a table with columns: Reading | Precise claim | Trivial or substantive? | Fits Zhuangzi? | Supports anti-funeral argument? Then after the table, tell me which reading the grad student is probably smuggling in, and what specific case — like Zhuangzi drumming on the tub after his wife died, or the skull in the field — would best distinguish the serious versions from each other.
