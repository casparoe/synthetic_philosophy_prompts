      *   *Locals vs. Visitors:*
          *   *Locals:* Might have a "fair play" obligation if they benefit from the system (better service due to server motivation), but under the strict framework provided, if the convention is distributive/contested, the obligation is weak or non-existent *qua* convention. However, locals participate in the reproduction of the norm.
          *   *Visitors:* They do not participate in the local labor market or the long-term social contract. Under the strict framework, if the convention is distributive, they are definitely not bound. If it were pure coordination (e.g., which fork to use), they might be bound to avoid friction. But since tipping is compensation, the framework says no obligation.

  4.  **Step 3: Analyzing Meyer's Reform:**

      *   *The Move:* Hospitality Included (no tipping, higher menu prices, higher base wages).
      *   *Interpretation A (Disguised Wage):* The fact that Meyer *could* switch to menu pricing and pay servers more proves tipping was always a wage subsidy. It wasn't a "gift" or a "gratuity" in the moral sense; it was a mandatory surcharge disguised as voluntary. This undermines the claim that tipping was a moral obligation. It was an economic necessity for the worker, enforced by social pressure.
      *   *Interpretation B (Re-engineering):* Meyer showed we can change the convention without collapsing the service industry. This supports "flexible conventionalism"—conventions are tools, not moral laws. We can swap one coordination mechanism (tips) for another (higher prices) if the distributive outcome is fairer.
      *   *Synthesis:* It leans heavily toward Interpretation A. If it were a pure moral obligation of gratitude, removing it would be immoral. If it were pure coordination, removing it would cause chaos. Instead, it was a structural wage fix. The "obligation" was illusory.

  5.  **Step 4: Broader Claim (Visitors and Local Conventions):**

      *   *Claim:* Visitors must observe local conventions (queuing, jaywalking).
      *   *Analysis:*
