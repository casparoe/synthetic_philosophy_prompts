          4.  Analyze Meyer's reform: Does it prove tipping was a disguised wage mechanism (undermining moral obligation)? OR Does it show conventions can be re-engineered without moral loss (supporting flexible conventionalism)?
          5.  Assess the broader claim: Do visitors *must* observe local conventions (queuing, jaywalking) when contexts differ? Where is the conventionalist view silent?

  2.  **Step 1: Distinguishing Tipping Functions:**

      *   *Coordination Function:* Tipping acts as a signal. High tip = good service. It directs server attention to tables that tip well. It solves the "how much to pay for this specific interaction" problem in real-time without negotiation. It aligns incentives between diner and server.
      *   *Compensation Function:* Tipping subsidizes the base wage. In the US (especially NY in 2015), the tipped minimum wage was lower than the standard minimum wage. Diners effectively pay a portion of the labor cost. This is a distributive mechanism (who bears the cost of labor: employer or consumer?).

  3.  **Step 2: Applying the Conventionalist Framework:**

      *   *The Rule:* Conventions generate obligations *only* when they are pure coordination (like driving on the right side of the road). They do *not* generate obligations if they embed contested distributive judgments (like who pays for labor).
