      *   *Strengthens/Weakens:* The Meyer episode *weakens* the claim that visitors must blindly follow local economic conventions. It shows that some "conventions" are actually structural features of a specific labor market (institutional context) that outsiders don't share or understand.
      *   *Where Conventionalism is Silent:* Conventionalism tells us *how* to follow a rule once we accept it. It is silent on *which* rules are just. It cannot tell us if the tipping convention itself was exploitative. It is also silent on the epistemic burden: How is a visitor supposed to know if a convention is "pure coordination" or "contested distribution"? The framework assumes we know the nature of the convention, but in reality (like tipping), that nature is opaque.

