answer: |-
  ### The Architecture of Obligation: Danny Meyer, Tipping, and Conventionalism

  In 2015, Danny Meyer, CEO of Union Square Hospitality Group (USHG), announced the elimination of tipping across his New York City restaurants, replacing it with "Hospitality Included" pricing. Menu prices rose to cover higher base wages for kitchen and front-of-house staff, and gratuities were no longer accepted. This move serves as a potent case study for moral conventionalism—the philosophical inquiry into whether social norms generate moral obligations. Specifically, it tests the limits of whether everyday economic conventions bind participants, and crucially, whether they bind outsiders who do not share the local institutional context.

  To analyze this, we must first dissect the tipping convention itself, apply a specific conventionalist framework regarding coordination and distribution, and then evaluate what Meyer's reform reveals about the moral weight of such norms.

  #### 1. The Dual Functions of the Tipping Convention

  Before assessing moral obligation, we must distinguish the two distinct sociological and economic functions the New York tipping convention served prior to 2015.

  **The Coordination Function**
  As a coordination mechanism, tipping solved immediate informational and incentive problems between diner and server.
  *   **Signaling:** It allowed diners to signal satisfaction or dissatisfaction with service quality in real-time, bypassing the need for formal complaints or management intervention.
  *   **Attention Allocation:** It directed labor attention. Servers, anticipating higher rewards from tables that tip well, prioritize those tables. This creates a self-reinforcing equilibrium where diners tip to secure better future service, and servers work harder to secure tips.
  *   **Transaction Closure:** It provided a standardized script for ending the financial interaction without negotiation, reducing social friction at the end of a meal.

  **The Compensation Function**
  As a compensation mechanism, tipping served as a wage subsidy.
  *   **Externalized Labor Costs:** Under New York law (and federal law), the "tipped minimum wage" was significantly lower than the standard minimum wage. The convention effectively mandated that diners cover the gap between the server's base pay and a living wage.
  *   **Distributive Judgment:** This function embeds a contested judgment about who bears the cost of labor: the employer (via menu prices) or the consumer (via voluntary surcharges). It shifts risk from the business to the worker (whose income fluctuates with seasonality and patron mood) and from the business to the diner.

  #### 2. Applying the Conventionalist Framework

  The prompt specifies a conventionalist framework: *Conventions generate obligations for participants only when they serve pure coordination and do not embed contested distributive judgments.*

  **The Nature of the Tipping Convention**
  Under this framework, the tipping convention fails the test for generating moral obligation. While it possesses coordinative elements, it is inextricably linked to the compensation function. Because the compensation function relies on a contested distributive judgment (is it fair for the diner to subsidize the wage?), the convention cannot be considered "pure coordination." Therefore, strictly speaking, the convention itself generates **no inherent moral obligation** for anyone to participate in it.

  **Locals vs. Visitors**
  Does this mean locals and visitors are in the same position? Under this framework, their relationship to the *convention* is similar (neither is bound by it morally), but their relationship to the *system* differs.

  *   **The Local Regular:** A local participates in the reproductive cycle of the local labor market. While the *convention* creates no obligation, the local may have a duty of justice or fair play to the workers who rely on this subsidized wage structure. However, under the strict conventionalist view provided, the *norm of tipping* does not bind them; rather, their obligation would stem from the material consequences of the wage system, not the social rule.
  *   **The Non-Local Visitor:** The visitor is transient. They do not participate in the local labor market, nor do they sustain the ecosystem that makes the tipped wage viable. Since the convention is distributive (and thus morally neutral under this framework) rather than purely coordinative (like driving on the right side of the road), the visitor has **no moral obligation** to tip. They are not bound by a local wage contract they did not sign and cannot influence. Unlike a coordination norm (where violating it causes immediate friction or danger, e.g., queuing), violating the tipping norm merely opts the visitor out of a distributive scheme they are not part of.

  #### 3. What Meyer's Reform Reveals

  Danny Meyer's shift to service-included pricing acts as an empirical stress test for the moral status of tipping.

  **The Disguised Wage Mechanism**
  Meyer's reform strongly suggests that the tipping convention was never a moral obligation of gratitude, but rather a **disguised wage mechanism**. If tipping were a genuine moral obligation based on gratitude for service, removing it would constitute a moral loss (a failure to thank). If it were pure coordination, removing it would cause systemic chaos (servers ignoring tables).
  Instead, Meyer demonstrated that the "gratuity" was structurally mandatory. By raising menu prices and paying servers higher base wages, he proved the money was always part of the cost of the meal, merely routed through the diner's pocket to avoid appearing on the menu. This undermines the claim that tipping was a moral obligation. It reveals the "voluntary" nature of the tip as a fiction; the social pressure to tip made it a de facto tax. If the obligation was illusory, the visitor (and the local) was never morally bound by it, only socially coerced.

  **Flexible Conventionalism**
  Alternatively, the episode supports a **flexible conventionalism**. It shows that conventions are tools that can be re-engineered without moral loss. Meyer replaced one convention (tips + low price) with another (no tips + high price) to achieve a fairer distributive outcome. This suggests that conventions are not moral ends in themselves but instrumental means. If a convention (tipping) creates inequity (wage instability), it can be discarded for a better one (hospitality included) without violating moral duty. This supports the view that we are not bound by conventions that fail to serve justice, even if they serve coordination.

  #### 4. Broader Implications for Visitors and Local Conventions

  The Meyer episode weakens the broader claim that visitors *must* observe local conventions when those conventions depend on institutional contexts the visitors do not share.

  **Coordination vs. Institutional Context**
  *   **Queuing (Pure Coordination):** Visitors are bound to queue because the norm exists solely to prevent conflict and ensure order. The institutional context (the store) is shared by all present. Violating this harms others immediately.
  *   **Tipping (Institutional Distribution):** Visitors are *not* bound to tip because the norm depends on a hidden institutional context (the wage law and employer pay structure). A visitor cannot know if their tip supplements a poverty wage or is a bonus on top of a living wage.
  *   **Jaywalking (Safety/Coordination Mix):** This is complex. If locals jaywalk based on tacit knowledge of traffic light cycles, a visitor lacks that knowledge. Here, the conventionalist view suggests the visitor should *not* follow the local convention if doing so introduces risk the visitor cannot assess.

  **Where the Conventionalist View is Silent**
  The Meyer case highlights exactly where the conventionalist framework is silent rather than speaking: **The Epistemic Problem.**

  The framework states: *If Coordination -> Obligation; If Contested Distribution -> No Obligation.*
  However, the framework provides no method for a moral agent (especially a visitor) to **distinguish** between the two in real-time.
  *   To a visitor, tipping *looks* like a coordination norm (a script for ending a meal).
  *   It *is* actually a distributive norm (a wage subsidy).

  Conventionalism is silent on how an outsider identifies the *true function* of a local convention. It assumes the agent knows the nature of the rule. In the case of tipping, the distributive nature was opaque to many diners who believed they were participating in a meritocratic reward system rather than a wage subsidy. Therefore, the conventionalist view cannot guide the visitor *ex ante*; it can only judge them *ex post*. It offers no guidance on the burden of inquiry required of a visitor to determine if a local norm is binding.

  ### Conclusion

  Danny Meyer's 2015 reform exposes the tipping convention as a distributive mechanism masquerading as a coordinative norm. Under the specified conventionalist framework, this means the convention generated no moral obligation for locals or visitors, as it embedded contested judgments about labor costs. The reform confirms that the "obligation" to tip was a product of structural coercion rather than moral duty.

  For the broader question of visitors and local norms, the episode weakens the claim of universal adherence. Visitors are bound by coordination norms that ensure mutual safety and order (queuing), but they are not bound by institutional norms that rely on local distributive contracts they do not share (tipping). Ultimately, the episode reveals the silence of conventionalism: it can tell us whether a rule binds us once we understand its function, but it cannot tell us how to discern that function when the local context is opaque.
