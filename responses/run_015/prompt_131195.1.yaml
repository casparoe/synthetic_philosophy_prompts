answer: |-
  ### Specification of Normative Requirements for Pest-Control Frameworks

  The following table specifies the necessary conditions for any ethical account to be usable by a public agency managing vector control and crop protection. The requirements are derived from the eight problem cases provided, plus the co-author's candidate requirement.

  | Requirement | Motivating_Case | Status | Excludes | Conflicts |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1: Proportionality of Interest**<br>The justification must distinguish between vital human interests (life/health) and trivial interests (cosmetic yield) without relying solely on aggregate utility. | (1) *The Asymmetry Case*: Spraying for malaria vs. coating seeds for cosmetic crop yield. | Non-negotiable | Pure aggregative consequentialism; Biocentric individualism (which treats all life interests as roughly equal). | Conflicts with R6 if preventing existence is valued higher than protecting trivial human interests. |
  | **R2: Sensitivity to Mode of Harm**<br>The account must weigh the duration and phenomenological quality of dying, not merely the fact of death. | (2) *The Dying-time Problem*: Neurotoxins causing hours of convulsion vs. instant mechanical destruction. | Camp Preference (Precautionary Welfarism) | Strict behaviorism; Views that treat death as a binary switch regardless of process. | Conflicts with any constraint requiring "no presupposition of consciousness," as mode implies capacity for suffering. |
  | **R3: Relational Pest Status**<br>The account must treat "pest" as a status conferred by a specific human project, not an intrinsic property of the organism. | (3) *The Constitution Worry*: A caterpillar is a pest in brassica but neutral on a roadside. | Non-negotiable | Essentialist views of "pests"; Natural kind taxonomies that justify killing based on species identity. | None. |
  | **R4: Diachronic Feasibility**<br>The account must evaluate interventions based on their impact on future option sets (resistance/dependence), not just immediate efficacy. | (4) *The Lock-in Objection*: Killing selects for resistance, creating permanent dependence on further killing. | Non-negotiable | Short-term consequentialism; Static cost-benefit analysis. | Conflicts with R9 if long-term uncertainty prevents a determinate short-term decision. |
  | **R5: Counterfactual Baseline Discipline**<br>The account must specify a non-arbitrary reference population for counterfactuals, rejecting "they would have died anyway" without evidence. | (5) *The Baseline Problem*: Claiming insects die of starvation anyway to justify killing them now. | Non-negotiable | Opportunistic causal reasoning; Moral laundering via speculative natural mortality. | None. |
  | **R6: Distinction of Suppression**<br>The account must distinguish morally between killing existing individuals and preventing future existence. | (6) *Suppression without Killing*: Sterile-insect releases and gene drives reduce population size rather than killing adults. | Non-negotiable | Views that equate non-existence with death; Death-counting views that cannot register prevention of birth. | Conflicts with R1 if preventing existence is deemed worse than protecting trivial human interests. |
  | **R7: Procedural Legitimacy & Risk Distribution**<br>The account must require that those bearing the primary risks have a decisive voice in authorization, regardless of aggregate benefit. | (7) *Risk-bearing and Say*: Farmworkers and downwind households absorb exposure while beneficiaries are distant. | Non-negotiable | Top-down utilitarianism; Technocratic authority that overrides local veto power. | Conflicts with R9 (Determinacy) if procedural deliberation yields no decision or a veto. |
  | **R8: Justificatory Consistency**<br>The account must prevent justificatory drift where methods approved for Context A are applied to Context B without re-justification. | (8) *Migration*: Techniques for malaria mosquitoes redeployed for cosmetic crop protection or in different countries. | Camp Preference (Governance/Policy) | Context-blind universalism; Regulatory arbitrage. | Conflicts with R9 if re-justification introduces uncertainty that blocks decision. |
  | **R9: Decidability under Uncertainty**<br>The account must yield a single permissible action even under radical empirical uncertainty about sentience and ecosystem effects. | (Co-author) *Determinacy*: The agency must act, not ponder forever. | Camp Preference (Decision-Theory/Agency) | Skepticism; Precautionary principles that default to inaction under uncertainty. | Conflicts with R2 (requires data on suffering), R4 (requires data on resistance), and R7 (requires time for process). |

  ### Analysis of Conflicts and Exclusionary Power

  **On Consciousness and Modes of Death**
  The requirement **R2 (Sensitivity to Mode of Harm)** and a strict constraint to "not presuppose contested claims about invertebrate consciousness" cannot jointly stand without a bridging principle. If an account refuses to presuppose consciousness, the *mode* of death is morally neutral (matter rearranging). If an account demands we weigh the *mode* of death (convulsion vs. instant), it necessarily presupposes either (a) consciousness exists, or (b) a precautionary principle that treats the *possibility* of consciousness as morally weighty. I have classified R2 as a **Camp Preference (Precautionary Welfarism)** rather than Non-negotiable. This allows an agency to adopt the framework without settling the metaphysics of insect sentience, provided they acknowledge that ignoring R2 favors a behaviorist or ecocentric camp over a welfarist one.

  **On Procedure and Determinacy**
  **R7 (Procedural Legitimacy)** and **R9 (Decidability)** are in direct tension. R7 grants affected parties a "decisive voice," which implies the possibility of a veto or an indefinite deliberation period. R9 demands a determinate output to satisfy agency operational needs. If the community says "we need more study" and the agency says "we must decide now," R9 overrides R7. I have classified R9 as a **Camp Preference (Decision-Theory/Agency)** to signal that demanding a decision under radical uncertainty is an operational desire, not a normative truth. Satisfying both requires a "default rule" (e.g., "if no consensus, default to non-intervention"), but that default rule itself violates R9's demand for a *derived* decision.

  **Most Exclusionary Requirement**
  **R7 (Procedural Legitimacy & Risk Distribution)** does the most work in excluding otherwise popular views. Standard public-health and agricultural ethics often rely on aggregative utilitarianism (save the most lives, grow the most food). R7 forbids sacrificing a minority for the greater good if that minority bears the risk without consent. This excludes standard Cost-Benefit Analysis, Public-Health-Exceptionalism, and Technocratic Utilitarianism, forcing a shift toward contractualist or democratic ethical models.

