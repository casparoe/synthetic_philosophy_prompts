  **Q3: Do manifold points possess haecceity (identity) independent of fields?**
  *   **Yes:** Leaf: **Manifold Substantivalist**.
  *   **No:** Leaf: **Dynamical Substantivalist**.

  **Q4: (For Manifold Substantivalists) Is the resulting radical indeterminism acceptable?**
  *   **Yes:** Leaf: **Bullet-Biter**.
  *   **No:** *Empty Node.* Incoherent. Affirming distinct physical states determined by initial data outside the hole necessitates indeterminism within it.

  ***

  **Notes on Unexplored Space:**
  *   **Q1-No + Q3-Yes:** Answering "No" to Q1 while affirming points have haecceity is unattractive; it posits occult identity differences without physical consequences.
  *   **Q4-No:** No one sits here. Denying indeterminism while maintaining distinct physical states contradicts the deterministic evolution outside the hole.

  **Instructions:** Answer each question based on your metaphysical commitments. Follow the branch to find your position. If you land on a flag or empty node, reconsider your previous answers.
