  The precise feature performing the isolating work is the **discretionary procedural veto** codified within the institutional standing orders. This feature isolates structural contingency because it represents a macro-level switch built into the system's topology; the divergence arises from the topology of the rules themselves, not from the sensitive dependence of the system's trajectory on microscopic initial states. If this feature were removed—if the rule did not exist—the decision would rely entirely on the personal whim of the actor, making the outcome susceptible to a chaos-based narrative where microscopic neural fluctuations determine the choice. Conversely, if the rule were mandatory rather than discretionary, the outcome would be deterministically inevitable, removing the contingency entirely. A defender of the view that all genuine historical contingency is reducible to chaos-based amplification would attack the legitimacy of this pathway by arguing that the decision to invoke the veto is itself determined by the micro-physical state of the Attorney General's brain; they would contend that the "structural" choice is merely a macroscopic mask for underlying neurobiological processes subject to sensitive dependence, meaning the split is ultimately driven by imperceptible differences in prior physiological conditions rather than genuine institutional openness.
