answer: |-
  ### Instructor's Rationale: Where the Difficulty Lies

  The trap here is the Urmsonian reflex. A competent student knows the definition: supererogatory acts are optional, good, and omitting them incurs no blame. The difficulty lies in testing whether they understand *why* we have that category. Is it intrinsic to the act (visiting the elderly is always supererogatory) or relational (dependent on what others owe)? If a student simply says, "It remains supererogatory because the cost hasn't changed," they miss the collective action dimension. If they say, "It becomes obligatory because society expects it," they confuse norms with duties. The real philosophical work is in the *Fair Play* argument: does participation create a cooperative scheme that generates obligations for non-participants? And if so, does codifying that obligation destroy the value of the act? The question forces them to choose between the logic of fairness and the logic of virtue.

  ***

  ### Exam Question

  **Question 1**
  Consider the following case:
  At **t1**, a university volunteering scheme asks undergraduates to pledge forty hours a year of unpaid visiting to isolated elderly residents. Two per cent sign up. Participants are called exemplary; nobody criticises those who decline.
  At **t2**, five years later, eighty-five per cent participate. It is simply what students do. Non-participants are informally criticised and report feeling guilt. A college citizenship award quietly goes to participants.
  Assume the total good done is continuous (no threshold effects) and the cost to any individual student is unchanged.

  Does the pledge shift from supererogatory at t1 to obligatory at t2? In your answer, you must:
  1.  Distinguish between social expectation/criticism and genuine moral blameworthiness.
  2.  Assess whether a "fourth category" of action (permissible yet criticisable) is required to describe t2.
  3.  Distinguish the weak route (changed expectations) from the strong route (fair-play within a cooperative scheme).
  4.  Confront the objection that others' generosity cannot increase my obligations without my consent.
  5.  Evaluate the university's proposal to make the pledge compulsory, considering the thesis that some acts are valuable precisely because they are optional.

  **(20 Marks)**

  ***

  ### Model Answer

  The pledge shifts from supererogatory at t1 to obligatory at t2, but not because social norms changed. The shift is grounded in the Principle of Fair Play, though making the act compulsory risks destroying the specific value it holds.

  At t1, the scheme is a classic case of supererogation. Participation is costly, beneficial, and optional. Omission incurs no blame because there is no cooperative scheme to free-ride upon. The two per cent participation rate means non-participants do not benefit from a social environment created by the volunteers. Therefore, the standard Urmsonian conditions hold: the act is good, optional, and omission is not blameworthy.

  At t2, the landscape changes. It is tempting to argue the act remains supererogatory because the intrinsic cost and benefit are unchanged. This treats supererogation as intrinsic to the act-type. However, moral status is often relational. The crucial distinction is between social criticism and moral blame. At t2, non-participants feel guilt and face criticism. If this were merely peer pressure, it would not indicate obligation. However, the guilt suggests an internal recognition of a duty incurred. We must not conflate social snobbery with blame, but here the criticism tracks a fairness violation.

  This requires rejecting the "fourth category" of permissible yet criticisable action. If an omission is genuinely criticisable in a moral sense, the act was required. We should not dilute the deontic category to save the phenomenon of supererogation. Instead, we must explain why the duty arose. The weak route argues that widespread practice creates an expectation that hardens into obligation. This is insufficient; popularity does not create duty. The strong route relies on Fair Play. When eighty-five per cent participate, they create a cooperative scheme. The college reputation rises, social cohesion improves, and the isolation of the elderly is mitigated systematically. Non-participants accept these benefits while avoiding the cost. They are free-riders.

  The objection is that others' generosity cannot bind me. If my neighbours donate to charity, I do not owe money simply because they did. This holds for pure altruism. However, where a scheme produces shared reputational or social benefits, acceptance of those benefits triggers an obligation to contribute your fair share. At t2, the non-participant enjoys the status of attending a "civic-minded college" funded by the labour of others. Consent is implied by the acceptance of the benefit, provided the benefit is worth the cost. Thus, the act becomes obligatory not because visiting the elderly is inherently required, but because free-riding on a cooperative scheme is forbidden.

  Finally, should the university make the pledge compulsory? There is a tension here. If the act is obligatory via Fair Play, compulsion ensures compliance. However, some acts are worth more precisely because they are not required. Compulsion removes the element of sacrifice that signals virtue. If students are forced to visit, the residents receive care, but the moral value of the interaction changes from gift to transaction. Furthermore, codifying the duty might dissolves the cooperative spirit, turning fair play into legalistic compliance. Therefore, while the act is obligatory at t2 in the sense that omitting it is unfair, the university should resist making it compulsory. The obligation should remain moral, enforced by criticism and guilt, to preserve the voluntary virtue that gives the act its highest value. The shift to obligation is real, but formalizing it destroys the good it seeks to secure.

  ***

  ### Marking Scheme (20 Marks)

  **1. Norms vs. Blame (4 Marks)**
  *   **A (4):** Clearly distinguishes social pressure from moral blameworthiness. Argues that t2 criticism tracks genuine blame only if grounded in fairness, not mere popularity.
  *   **B (2):** Conflates social criticism with moral obligation, or dismisses t2 criticism as merely peer pressure without analysis.

  **2. The Fourth Category (4 Marks)**
  *   **A (4):** Rejects the "permissible but criticisable" category, arguing that moral criticism implies obligation, or defends it with robust justification.
  *   **B (2):** Accepts the fourth category uncritically to avoid the paradox, or denies it without explaining where the criticism comes from.

  **3. Fair Play Mechanism (4 Marks)**
  *   **A (4):** Identifies the shift to obligation as grounded in Fair Play/free-riding on shared benefits (reputation/cohesion), not merely changed expectations.
  *   **B (2):** Relies on the "weak route" (expectations harden into duties) or claims the act-type itself changed intrinsic status.

  **4. Consent/Diffusion Objection (4 Marks)**
  *   **A (4):** Confronts the objection that others' generosity doesn't bind me. Distinguishes pure altruism from接受 benefits of a cooperative scheme.
  *   **B (2):** Ignores the objection or claims consent is irrelevant without justification.

  **5. Compulsion vs. Optionality (4 Marks)**
  *   **A (4):** Recognizes the tension: obligation exists, but compulsion may destroy the value of the act (virtue requires optionality).
  *   **B (2):** Argues simply that it should be compulsory because it is obligatory, or that it cannot be obligatory because it shouldn't be compulsory.

  ***

  ### Predictable Mistakes

  1.  **The Urmson Recitation:** Defining supererogation correctly but failing to apply it to the compliance shift; costs 3 marks.
  2.  **Normative Conflation:** Arguing the act is obligatory at t2 simply because "everyone does it"; costs 4 marks.
  3.  **Intrinsicism:** Claiming the act's status cannot change because the cost/benefit ratio is unchanged; costs 3 marks.
  4.  **Guilt Equivalence:** Treating the students' reported guilt as definitive proof of obligation without analyzing its source; costs 2 marks.
  5.  **Compulsion Error:** Arguing that if it is obligatory, it must be legally/officially compulsory, missing the value of optionality; costs 3 marks.
