      *   *Example:* If I have a spin-up state, I can't say it's "really" three states unless I entangle it with an ancilla. But adding an ancilla changes the physical state.
      *   *Wait, is it just vector decomposition?* Any vector $v$ of norm $N$ can be written as sum of $k$ vectors of norm $N/\sqrt{k}$. Yes, mathematically. $v = \sum v_i$.
