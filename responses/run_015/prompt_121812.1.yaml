      *   *Key Point 2 (Circularity):* This is the strongest objection. The decomposition is not unique. A vector is a vector. Splitting it into $N$ sub-vectors assumes the norm is additive in squares. If you assume the norm is additive in squares, you've assumed the Born rule. The justification "it matches data" is empirical, not derivational.
      *   *Key Point 3 (Residual):* The residual problem is the *ontology of the measure*. Why does the mathematical norm correspond to subjective credence? The construction shows consistency, not derivation. It shows "If you count this way, you get Born." It doesn't show "You *must* count this way."
      *   *Gleason's Theorem:* (Mental check: User said no literature review). I should mention the *structure* of the argument similar to Gleason's without citing the paper. The point is that measure on Hilbert space is constrained, but you still need to posit *there is a measure*.
