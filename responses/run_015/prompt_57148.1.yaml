      *   *Claim 1:* (B) $\nrightarrow$ (C). Entitlement failure explains *who* dies, not *why* it's a crime.
      *   *Claim 2:* Subsistence farmers (Irish Potato Famine) challenge (B). If you grow food and it dies, your entitlement collapse *is* the crop failure. Export arguments are needed for culpability, not just entitlement analysis.
      *   *Claim 3:* Great Leap Forward (GLF). Not intentional killing (Mao didn't plan death), but culpable ignorance via institutional design (reporting incentives, hukou, communes). Variation in death rates supports local institutional failure over central genocidal intent.
      *   *Claim 4:* Bengal 1943. Cleanest (B), but culpability is diffuse (war economy, inflation, denial policies), making "crime" harder to pin on a specific agent compared to GLF.
      *   *Objections to Handle:*
          1.  A/B/C are inseparable.
          2.  GLF reading is too charitable (warnings ignored, force used).
          3.  Ireland was a crime because of exports (not just crop failure).

  3.  **Drafting the Planning Section:**
