      *   *Section 2: The Ireland Counter-Case.* Address the potato blight. If you grow potatoes and they rot, your entitlement falls naturally. The "crime" is the export market structure, not the entitlement failure itself.
      *   *Section 3: The Great Leap Forward.* This is the core. Argue against "intentional killing." Argue for "culpable institutional design." Use the variation in death rates and the grain storage issue. Focus on the system punishing truth-tellers.
      *   *Section 4: Bengal 1943.* Contrast with GLF. Show how war complicates culpability.
      *   *Section 5: Handling Objections.* Integrate the three specific objections requested.
          *   Objection 1: Distinction without difference. Rebut: Analytical clarity matters for remedy.
          *   Objection 2: GLF charity. Rebut: Distinguish between central intent and systemic culpability.
          *   Objection 3: Ireland exports. Rebut: Concede this makes it a crime, but note this is a specific policy choice, not inherent in entitlement failure.
      *   *Conclusion:* Summarize. Emphasize that calling it a "crime" demands proof of culpable ignorance or intent, not just suffering.

  5.  **Refining and Polishing:**
