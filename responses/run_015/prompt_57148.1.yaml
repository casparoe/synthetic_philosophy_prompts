answer: |-
  ### Planning Section

  *   **Step 1: Distinguish the three claims.** Define (A) Causal (human decisions necessary), (B) Incidence (entitlements determine victims), and (C) Culpability (feasible prevention known/ignored).
      *   *Strongest Counter:* In practice, these overlap so heavily that separating them is pedantic; if humans caused it (A) via entitlements (B), surely they are culpable (C).
  *   **Step 2: Argue (B) is descriptive, not normative.** Show that entitlement failure explains *mechanism*, not *guilt*.
      *   *Strongest Counter:* Entitlements are legal/social constructs; if they fail, the system designers are implicitly guilty.
  *   **Step 3: The Subsistence Pressure Point.** Use the Irish Potato Famine to show that when producers lose their crop directly, entitlement analysis adds little; culpability rests on export policy, not the blight itself.
      *   *Strongest Counter:* The market integration meant farmers *could* have bought food; their inability to do so was an entitlement failure caused by colonial policy.
  *   **Step 4: The Great Leap Forward (GLF).** Argue for culpable institutional design over intentional killing. Use provincial variation and grain storage issues.
      *   *Strongest Counter:* Central leadership punished truth-tellers, implying they knew the cost of silence; this borders on intent.
  *   **Step 5: Bengal 1943.** Show how war diffuses culpability, making the "crime" label harder to pin than in GLF.
      *   *Strongest Counter:* The colonial government prioritized war aims over lives knowingly, which is a clear moral crime regardless of diffusion.
  *   **Step 6: Address Objections.** Directly tackle the "distinction without difference," "GLF too charitable," and "Ireland exports" objections.
      *   *Strongest Counter:* My distinctions might be theoretically sound but practically useless for mobilizing prevention.

  ***

  ### The Architecture of Blame: Disentangling Famine Claims

  The slogan that "famines are political crimes rather than natural disasters" possesses a powerful moral gravity. It suggests that when people starve, someone must hang. However, this slogan fuses three distinct claims that must be separated if we are to assign blame accurately. There is (A) the causal claim that human decisions are necessary conditions for the deaths; (B) the incidence claim that entitlements, not aggregate supply, determine who starves; and (C) the culpability claim that an agent knew a feasible prevention strategy existed and rejected it. My thesis is that (A) is nearly vacuous, (B) is purely descriptive, and only (C) supports the word "crime." Furthermore, (C) is far harder to establish than the slogan implies. In the Great Leap Forward, the crime was not intentional killing but culpable ignorance manufactured by institutional design. Precision here matters: misdiagnosing the wrongdoing mislocates the remedy.

  First, we must see why entitlement analysis (B) does not entail culpability (C). Amartya Sen's insight was that famines often occur without a significant drop in food availability. Instead, specific groups lose the ability to command food. But describing the mechanism of starvation is not the same as assigning moral guilt.

  1.  Entitlement failure describes the distribution of mortality, not the moral status of the cause.
  2.  Therefore, showing that a group starved due to lost purchasing power does not prove an agent culpably caused that loss.

  This distinction collapses in the case of subsistence farmers, which serves as the pressure point for the entitlement framework. Consider the Irish Potato Famine. If a farmer grows potatoes to eat, and the blight kills the potatoes, their entitlement collapse is identical to the crop failure. Saying their "entitlement to food collapsed" is merely a complex way of saying "their food rotted." In this instance, (B) adds no analytical value over natural disaster models. The culpability (C) in Ireland rests not on the entitlement failure itself, but on the specific policy decision to continue exporting grain from Ireland to Britain while the populace starved. Without that specific policy choice, the entitlement failure remains a tragedy, not necessarily a crime. Thus, (B) cannot carry the moral weight of the slogan; only specific policy choices regarding exports or relief can support (C).

  The Great Leap Forward (GLF) is often cited as the paradigm of intentional mass killing. However, the evidence better supports a model of culpable institutional design. If the central leadership had intended to kill peasants, death rates would not have varied as enormously across provinces as they did (a contested but widely observed historical fact). Instead, the system was designed to prioritize production quotas over reality.

  1.  The state created reporting incentives where false good news was rewarded and bad news punished.
  2.  The household-registration system prevented villagers from leaving to seek food.
  3.  Therefore, the leadership created a system where ignorance was profitable and movement was impossible.

  This is a crime of negligence embedded in structure, not necessarily a plan of extermination. In hard-hit areas, people died within sight of stored grain that officials would not release because releasing it would admit failure against quotas. This supports (C)—culpable ignorance—without requiring the stronger claim of genocidal intent. The remedy for intentional killing is regime change; the remedy for institutional design failure is structural reform of information flows and mobility rights. Conflating the two obscures the specific mechanical fixes required.

  Bengal in 1943 further complicates the slogan. Here, wartime inflation destroyed the purchasing power of laborers, and denial policies stripped coastal districts of boats and rice. This is the cleanest instance of (B) in the record. Yet, the culpability is diffuse. Was it the colonial government prioritizing war aims? The local merchants hoarding? The wartime inflation inherent to global conflict? The diffusion of agency makes pinning the "crime" on a single intentional actor harder than in the GLF, even if the moral outcome was equally dire. The slogan demands a villain; the history offers a complex web of trade-offs.

  Three objections naturally arise from a skeptical judge.

  First, that distinguishing (A), (B), and (C) is a distinction without a difference. Critics argue real famines involve all three, so separation is artificial. But analytical clarity dictates remedy. If we treat an institutional negligence case (GLF) as an intentional killing case, we may pursue retributive justice rather than fixing the reporting incentives that caused the death. Precision prevents policy errors.

  Second, that my reading of the GLF is too charitable. Leadership was warned and disciplined the man who warned them; local cadres used force to keep villagers from leaving. Does this not imply knowledge and intent? It implies knowledge of *risk*, but not necessarily knowledge of *scale*. The institutional design made the true scale unknowable to the center until it was too late. This is culpable ignorance, which is a crime, but it is distinct from killing by plan. Acknowledging this distinction preserves the severity of the accusation while accurately describing the mechanism.

  Third, that my account of Ireland is wrong because the crime was precisely that food kept moving out. I concede this point, but it reinforces my thesis. The crime was not the blight (natural) nor the entitlement collapse (descriptive); the crime was the export policy (culpable choice). The slogan is only true when (C) is proven.

  To call a famine a crime is a heavy moral judgment. It requires more than showing that humans were involved (A) or that entitlements failed (B). It requires demonstrating that specific agents knew, or culpably failed to know, that they could have prevented death without ruinous cost. In the Great Leap Forward, this condition was met through institutional design that punished truth. In Ireland, it was met through export policy. In Bengal, it remains diffuse. We must not let the moral urgency of the slogan collapse these distinctions. If we wish to prevent future famines, we must know whether we are fighting against murderers, or against systems that make ignorance profitable. The remedy depends entirely on the difference.
