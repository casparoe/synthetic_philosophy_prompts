  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the subsistence farmer point clearly? *Adjustment:* Ensure I explain why entitlement analysis adds little value when the producer loses the product directly.
      *   *Check:* Did I handle the GLF nuance? *Adjustment:* Make sure not to exonerate the leadership entirely, but shift the blame from "genocide" to "criminal negligence via institutional design."
      *   *Check:* Did I include the planning section? *Yes, at the start.*
      *   *Check:* Word count. *Need to monitor closely.* The planning section is separate, but the essay needs to hit the range.
