      *   *Unified Principle:* **The Principle of Invested Phenomenology.** A virtual entity or state is morally significant if it has been consciously perceived by a player and incorporated into their personal or social narrative, unless the specific environment explicitly contractually voids such expectations. Harm is defined as the non-consensual disruption of that incorporated narrative or the violation of the player's bodily autonomy as extended through their avatar.

