  I teach a graduate seminar on decision theory, and I got into an argument with a colleague in the math department last week that I can't let go of. We were talking about gambles whose expectation misbehaves, and I came away convinced that neither of us had a rule, just intuitions and a lot of hand-waving about "weak" versus "strong" expectation. The rule I've been toying with has two clauses: (1) if the expectation is absolutely convergent, just use it; (2) if it isn't, ask what happens to the average payoff over many independent plays, and if that average doesn't settle down either, say the gamble has no value and fall back on dominance comparisons where there are any. I like it because it's simple, but I suspect clause (2) is doing something sneaky. So here are my verdicts on a batch of cases, all generated by the same mechanism, and I want to know what principle actually fits them. Please don't give me a reading list or point me at papers — I've read enough of the literature, and it all stops exactly where my questions start.

  The mechanism in every case: a fair coin is tossed until it lands heads, n is the number of tosses, so P(n) = 2 to the minus n. (i) St. Petersburg: you recieve 2^n. Expectation infinite. My verdict: I'd pay maybe fifteen or twenty dollars, and the infinity is not a reason to pay more; I wouldn't pay a thousand. (ii) Pasadena: you recieve (-1)^(n+1) times 2^n/n, so +2, -2, +8/3, -4, and so on. Summed in the natural order it's ln 2, about 69 cents, but rearranging the terms gets you anything you like. My verdict: no determinate value — and yet I'd play it for free without worrying, I wouldn't pay 65 cents for it, and the rearrangement that makes it worth a million dollars leaves me completely cold. (iii) The same game with the magnitudes damped by an extra factor of n: (-1)^(n+1) times 2^n/n^2. Absolutely convergent, about 82 cents. Verdict: this one definately has a value and I'd pay eighty cents for it, which is strange, because it differs from (ii) only by a factor of 1/n. (iv) Pasadena with the game called off after twenty tosses, nothing paid if you get twenty tails. Value is the partial alternating harmonic sum, about 67 cents, and as you raise the cap the values hover around ln 2. Verdict: worth roughly 67 cents — and I have a strong pull to say the truncated games converge on the value of the untruncated one, which is exactly what I refused to say in (ii). (v) Pasadena plus a guaranteed dollar no matter what. Verdict: obviously exactly one dollar better than (ii), and I'd take it over (ii) without thinking; I don't see how that's compatible with (ii) having no value at all. (vi) St. Petersburg preceded by a coin flip deciding whether you recieve 2^n or pay 2^n: positive and negative parts both infinite. Verdict: roughly neutral, maybe slightly unattractive, I'd want a small premium to play — even though (i) feels clearly good to me. (vii) Two independent Pasadena plays with the payoffs added. Verdict: I'd take two for free, or a hundred for free, but I can't