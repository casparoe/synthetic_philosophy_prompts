answer: |-
  Your student is technically right, but philosophically shallow. She's right that bounded utility resolves the mathematics instantly; she's shallow because it resolves it by fiat, altering the agent's psychology to fit the math rather than fixing the math to fit the agent's situation. You are right to resist it as "cheating" if the goal is to understand the structure of the gambles themselves, not just to patch the utility function. However, your verdict on case (i) (St. Petersburg) *functionally* commits you to boundedness or an equivalent constraint, even if you don't call it that. If payoffs are dollars and utility is linear, paying \$20 for an infinite expectation is irrational. If you pay \$20, you are either treating money as having diminishing marginal utility (concave) or you are implicitly truncating the game.

  Your two-clause rule is close, but it conflates *value* (a number) with *preferability* (a relation). This is why you are stuck on case (v). You can prefer $A$ to $B$ even if neither has a determinate numerical value.

  Here is the principle that fits your verdicts, repairs the inconsistencies, and respects your constraint against "bounded utility" axioms.

  ### The Principle of Robust Comparability

  **Definition:** A gamble $G$ has a **determinate value** if and only if the sequence of its finite truncations converges to a limit $L$, *and* that limit is invariant under all permutations of the outcome space that preserve the probability measure.

  **Decision Rule:**
  1.  **Valuation:** If $G$ has a determinate value $L$, treat it as a sure thing of $L$.
  2.  **Comparison (Dominance):** If $G$ and $H$ lack determinate values, $G$ is preferable to $H$ ($G \succ H$) if and only if $G$ state-wise dominates $H$ (payoff of $G \ge$ payoff of $H$ in every state, and $>$ in at least one).
  3.  **Comparison (Divergence):** If $G$ is one-sided divergent (positive part infinite, negative finite) and $H$ is a fixed finite sum, $G \succ H$ is **false**. Instead, evaluate $G$ via **Physical Truncation**: cap the payoff at the maximum physically realizable payout (e.g., the world's GDP). Use the expectation of the truncated game.

  ---

  ### Applying the Principle to Your Cases

  Here is where your verdicts stand, and where I must overturn you to maintain consistency.

  **(i) St. Petersburg:**
  *   **Analysis:** One-sided divergence. Truncations diverge to infinity. Not invariant (infinity is not a real number).
  *   **Verdict:** No determinate value.
  *   **Repair:** You said you'd pay \$20, not \$1000. My Rule 3 (Physical Truncation) validates this. The "infinity" is a mathematical artifact of assuming infinite bankrolls. In the real world, the casino cannot pay $2^{100}$. Truncated at a realistic cap, the expectation is small (~\$20).
  *   **Status:** **Consistent**, provided you accept the "Physical Truncation" justification rather than "infinity doesn't compel price."

  **(ii) Pasadena:**
  *   **Analysis:** Conditionally convergent. Truncations in natural order converge to $\ln 2$. But rearrangements change the limit. Therefore, the limit is *not* invariant.
  *   **Verdict:** No determinate value.
  *   **Status:** **Consistent.**

  **(iii) Damped Pasadena:**
  *   **Analysis:** Absolutely convergent. Rearrangements do not change the sum.
  *   **Verdict:** Determinate value (~82 cents).
  *   **Status:** **Consistent.**

  **(iv) Truncated Pasadena:**
  *   **Analysis:** This is a finite game. It has a determinate value (~67 cents).
  *   **The Conflict:** You said you have a "strong pull" to say these converge on the value of the untruncated game (ii).
  *   **Overturn:** **You must abandon this pull.** Under the Principle of Robust Comparability, (ii) has *no value* precisely because the limit is not robust. The fact that the *natural order* truncations converge is mathematically interesting but decision-theoretically irrelevant because the agent is not forced to accept the natural order as the definition of the gamble's structure. If the value depends on the order of summation, it is not a property of the gamble, but of the accounting method.
  *   **Correction:** (iv) is worth 67 cents. (ii) is worth nothing. The sequence of values $V(iv_n)$ converges, but $V(ii)$ remains undefined. Continuity of value fails here.

  **(v) Pasadena + \$1:**
  *   **Analysis:** $P$ has no value. $P+1$ has no value.
  *   **The Conflict:** You said (v) is "obviously exactly one dollar better."
  *   **Resolution:** This is where your distinction between *Value* and *Preference* was sneaking in. My Rule 2 (Dominance) saves you. $P+1$ state-wise dominates $P$. Therefore $P+1 \succ P$. You do not need $V(P)$ to exist to know $P+1$ is better.
  *   **Correction:** It is not "one dollar better" in terms of numerical difference (you can't subtract undefined from undefined). It is **strictly preferable**. If forced to price them, you price both via truncation, and the price difference will be \$1.
  *   **Status:** **Consistent**, with the linguistic correction from "value difference" to "preference ordering."

  **(vi) Symmetric St. Petersburg:**
  *   **Analysis:** Two-sided divergence ($\infty - \infty$).
  *   **Verdict:** Neutral/Undefined.
  *   **Status:** **Consistent.** Dominance does not apply against a fixed sum (sometimes you win big, sometimes lose big). Physical truncation makes it neutral (symmetric cap).

  **(vii) 100 Pasadenas:**
  *   **Analysis:** Sum of 100 indeterminate variables.
  *   **Verdict:** Still indeterminate.
  *   **Status:** **Consistent.** Linearity of expectation fails when expectations don't exist. Your gut is right: 100 undefined gambles do not make a defined one.

  ---

  ### The New Cases

  **1. Pasadena with Block Signs (++--++--...)**
  *   **Mechanism:** Payoffs are $(-1)^{\lfloor (n+1)/2 \rfloor} \frac{2^n}{n}$.
  *   **Analysis:** The magnitudes $2^n/n$ still grow exponentially. The series is still conditionally convergent at best (actually, the terms don't even go to zero, so it diverges in the standard sense, but let's assume you mean the alternating structure creates cancellation). Even with blocks, the series is not absolutely convergent. Riemann rearrangement theorem still applies: you can rearrange the blocks to sum to anything.
  *   **Verdict:** **No determinate value.**
  *   **Reasoning:** It fails the invariance clause of Robust Comparability. The block structure is just another ordering. Without absolute convergence, the value is hostage to the ordering.

  **2. St. Petersburg + Guaranteed Dollar**
  *   **Mechanism:** Payoff $2^n + 1$.
  *   **Analysis:** One-sided divergence.
  *   **Verdict:** **Preferable to St. Petersburg, but price remains capped.**
  *   **Reasoning:** By Dominance (Rule 2), $SP+1 \succ SP$. However, does the dollar "disappear into the infinity"? No. Under Physical Truncation (Rule 3), $E[SP+1] = E[SP] + 1$. If the cap makes $E[SP] = \$20$, then $E[SP+1] = \$21$. The dollar is real. Infinity is not a number you can add to; the cap is a number you can add to.
  *   **Crucial Distinction:** In the *untruncated* math, the difference is $\infty - \infty$ (undefined). In the *decision* context (truncated), the difference is 1. You should treat the decision context as primary.

  ---

  ### Where My Account Fails (And What Would Change My Mind)

  I have given you a principle that saves your intuitions by distinguishing *mathematical value* from *decision-theoretic preference* and by invoking *physical truncation* for divergent cases. Here is its vulnerability.

  **The Arbitrary Cutoff Problem:**
  My account relies on "Physical Truncation" for the St. Petersburg case to explain why you won't pay \$1000. But where is the cutoff? \$1 billion? \$1 trillion? The expected value of the truncated game is highly sensitive to this cap. If the casino's bankroll is \$1 trillion, the fair price is higher than if it's \$1 billion.
  *   **The Failure:** This makes the value of the gamble dependent on external facts (the casino's wealth) that seem irrelevant to the *structure* of the gamble. It feels like a pragmatic dodge.
  *   **What Would Change My Mind:** If you could present a case where **Physical Truncation yields a counter-intuitive preference reversal.**
      *   *The Case:* Imagine two St. Petersburg games, $A$ and $B$. $A$ pays $2^n$. $B$ pays $2^n$ for $n < 100$, and $0$ for $n \ge 100$.
      *   *Intuition:* $A$ should be strictly better than $B$.
      *   *The Trap:* If the physical cap is at $2^{50}$, then $A$ and $B$ have the *exact same* truncated expectation. My rule says they are equally valuable.
      *   *The Move:* If you can convince me that $A \succ B$ even when the cap is below the divergence point, then Physical Truncation is dead. You would be forced back to **Bounded Utility**. You would have to admit that the *utility* of the money, not the *availability* of the money, is doing the work.

  **Summary for your Seminar:**
  Tell your colleague that expectation is a tool for well-behaved measures, not a definition of rationality. Tell your student that bounded utility is the *solution*, but "Finite Context" is the *explanation*. And for yourself: keep the dominance principle, drop the idea that truncated limits confer value on the untruncated limit (case iv), and accept that "Value" is sometimes undefined even when "Preference" is clear.

  **The Principle to write on the board:**
  *"Value is the limit of finite truncations only when that limit is robust. Preference is determined by dominance when value is undefined. Divergence is resolved by physical constraints, not mathematical ideals."*
