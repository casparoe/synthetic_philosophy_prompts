  *Drafting...*
  The ink smelled of iron and old rain. Elara dipped her brush, watching the black fluid cling to the bristles before touching the vellum. In the Guild of the Hollow Bone, they taught that every letter possessed a ghost structure—an invisible scaffolding of relations that held the category together. The embodied stroke was merely the flesh draped over these bones. A perfect *a* required a closed bowl and a rising stem. But the masters spoke of the Spirit, the tolerance that allowed a shaky hand to still write truth.

  Elara was cleaning Master Kaelen's study when she found the folio tucked beneath a stack of blank sheets. It was bound in grey leather, unmarked. She opened it. The script was Kaelen's, unmistakably, yet wrong. The lines flowed with his usual confidence, but the relationships were severed.

  She traced the first line. *The wind...* But the *e* in "the" lacked its central bar. It hovered like a breath held too long. The *a* in "wind" was open at the top, a cup spilling over. By the strict rules of the Guild, these were not letters. They were shapes mimicking letters, violations of the ghost structure. If the closure broke, the category collapsed. An open *a* was merely a curve.

  Elara squinted. She tried to read it as noise, as abstract ink blots. But her mind insisted on completion. She saw the *e* not as a broken circle, but as a shy *e*. She saw the *a* not as a spill, but as a welcoming *a*. The text began to resolve: *The wind speaks only when the ear agrees to hear.*

  She turned the page. Here, the slippage was more violent. The *t* crosses floated inches above the stems. The *m* humps detached, floating like islands. Was this a code? Or was Kaelen demonstrating that the letter had no fixed border? If the viewer supplied the closure, did the writer need to draw it?

  Elara felt a vertigo of meaning. If she refused to see the letters, the manuscript was worthless scrap, a master's descent into senility. If she accepted the spirit over the stroke, it was a profound treatise on perception. The boundary wasn't in the ink; it was in the space between the page and her eye.

  She picked up her brush. To correct the text would be to destroy it. To leave it was to admit that meaning was a collaborative act, unstable and perilous. She looked at the floating cross of the *t*. It demanded she bridge the gap.

  "Read it," she whispered to the empty room.

  The ink did not answer. The letters waited, suspended between being and nothingness. Elara realized the secret wasn't in the words themselves, but in the moment of hesitation before recognition. The master hadn't written a message; he had written a test of her willingness to impose order on chaos.

  She dipped her brush, not to correct, but to copy. She replicated the broken *e*, the floating *t*. In doing so, she ratified the slippage. She became co-author of the category. The letter was not a thing found, but a thing made, twice: once by the hand, and once by the mind.

  The manuscript remained open. The words shimmered, stable only as long as she held her gaze steady. If she looked away, would they dissolve back into lines and curves? Elara breathed out, steady. She held the ghost structure in her mind, and the flesh of the ink obeyed. For now, the letters held. But she knew that tomorrow, another reader might see only noise. The spirit of the letter was not a law, but a treaty.

