      *(Check on Move 3 Roz)*: Roz says commitment devices prove it's not weakness. This is a bit of a leap. You can use a seatbelt and still be a bad driver. But the point is about *managing* the weakness. I'll rate it as "Pragmatically sound."

      *(Overall Winner)*: Tom has the better theoretical grasp of *why* the discounting happens. Roz has the better grasp of *how to live* with it. But since the question is about who is "right" regarding the nature of Dan's mind, Tom's explanation of the discounting curve (uncertainty) is scientifically stronger than Roz's "bias" claim. However, Roz is right that Dan *experiences* it as a conflict needing management. I will lean towards Tom on the theory, Roz on the practice, but overall Tom for undermining the premise that Dan is irrational. Actually, a nuanced draw is better. Let's say Tom wins on the *explanation*, Roz wins on the *prescription*.

      *(The Missing Bit)*: The missing bit is the *normative authority* of the planning self. Why does the "actuary" self get to rule? And the distinction between *judgment* and *motivation*.

