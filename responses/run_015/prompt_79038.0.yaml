      *   *Tom 2:* Very Strong. The uncertainty argument is a killer against the "bias" label.
      *   *Roz 3:* Largely Right. The money pump argument is standard.
      *   *Tom 3:* Mixed. Denies the phenomenon too easily.

      *   *Wait, let's look closer at Tom 3:* "If he really judged that working... he'd do it." This is the Socratic paradox. It's logically clean but phenomenologically false. People *do* act against their better judgment. So Tom is slightly mistaken here.
      *   *Roz 3:* "Self-defence... mad to call it weakness." This is a redefinition. It's practically right.

  8.  **Final Polish:** Check constraints. No name-dropping (e.g., avoid "Parfit," "Hume," "Ainslie," "Davidson"). Focus on the logic. Ensure British spelling (behaviour, programme, labelled, defence).

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in economics. Keep it accessible like the prompt. Ensure the distinction between "rational uncertainty" and "bias" is clear in Move 2.

