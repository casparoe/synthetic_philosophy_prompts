  3. a marking scheme out of 25 points that seperates an A from a B by listing must-hit moves—like recognizing that Al-Ghazali allows secondary causes only as occasions not powers, explaining why exclusion isnt exactly the same worry for occasionalism, addressing whether habit gives predictive stability, and avoiding the mistake of treating occasionalism as compatable with real causal powers in created things

  write it casualy, a typo or two is fine, no need for perfect formatting.
