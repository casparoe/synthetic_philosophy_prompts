answer: |-
  **Research Agenda: Conceptual Foundations of Cross-Cultural Moral Objectivity**

  **Executive Summary**
  You have three years to produce high-impact work at the intersection of empirical moral psychology and meta-ethics. The field is currently saturated with data regarding WEIRD (Western, Educated, Industrialized, Rich, Democratic) versus small-scale societal differences, but it is starved for the conceptual clarity required to interpret what that data *means* for truth-claims. The primary risk to your project is conflating empirical variation with philosophical refutation. To avoid this, you must prioritize questions that disentangle the categories used to describe the data before attempting to resolve the normative implications.

  Below are the three conceptual questions ranked by priority. This ordering follows the logic of **diagnosis before treatment**: you must first verify the nature of the disagreement, then define the scope of the objectivity at stake, and finally construct the framework that accommodates them.

  ---

  ### Priority 1: The Nature of the Disagreement
  **Question:** To what extent does the WEIRD operationalization of "moral disagreement" conflate variation in first-order moral content with variation in meta-ethical stance?

  **Corresponding Direction:** Challenging whether WEIRD samples have distorted our very conception of what counts as moral disagreement.

  **Defense of Position (Upstream Dependency)**
  This question is the most upstream because it interrogates the validity of the data's philosophical interpretation. Current debates often assume that when a WEIRD subject and a small-scale subject disagree on a norm (e.g., regarding resource distribution), they are making competing claims within the same meta-ethical framework (e.g., both claiming universal truth, but differing on the content). However, evidence suggests non-WEIRD populations may treat norms as relational obligations tied to social roles rather than mind-independent truths. If the variation is in the *meta-ethical stance* (how validity is grounded) rather than the *first-order content* (what is valued), then standard debates about moral objectivity are analyzing a category error. Resolving this restructures the subsequent two questions: if there is no shared meta-ethical framework, "objectivity" cannot be debated as a single scalar value but must be treated as a pluralistic set of practices.

  **Tractability (3-Year Horizon)**
  This is highly tractable via **conceptual analysis and empirical collaboration without new fieldwork**. You do not need to fund new ethnography. Instead, you will collaborate with existing moral psychologists to re-code and re-interpret existing datasets. Your task is to analyze the interview protocols and survey instruments used in major cross-cultural studies to identify where "moral" is defined by WEIRD assumptions (e.g., equating morality with impartiality). You can produce a rigorous philosophical critique of these operational definitions within the first 12–18 months.

  **Condition for Reordering**
  You should downgrade this priority if a systematic re-analysis of existing data demonstrates that meta-ethical stances are statistically invariant across cultures, even when first-order content varies. If it turns out that small-scale societies do, in fact, treat their norms as mind-independent and universal in the same way WEIRD subjects do (merely applying them to different groups), then the "distortion" hypothesis fails. In that case, the problem shifts immediately to how objectivity accommodates content pluralism (Priority 2).

  ---

  ### Priority 2: The Scope of Objectivity
  **Question:** Does the phenomenon of "locally universal but globally variable" moral commitment imply a failure of token-level objectivity or a restriction of domain-level objectivity?

  **Corresponding Direction:** Refining philosophical accounts of objectivity to accommodate deep pluralism without collapsing into relativism.

  **Defense of Position (Upstream Dependency)**
  This question depends on the resolution of Priority 1. Once we establish *that* there is a genuine meta-ethical variation (or a specific kind of content variation), we must locate where the claim to objectivity breaks down. The prompt highlights a specific empirical pattern: populations deploy universalist language within tightly bounded social matrices but withhold it across them. This creates a tension between **domain-level objectivity** (the claim that a single normative structure governs the moral domain) and **token-level objectivity** (the claim that specific judgments hold regardless of context).
  If the variation is at the *domain level*, then different societies inhabit different moral universes, threatening robust objectivity. If the variation is at the *token level* (e.g., "Stealing is wrong" is objectively true *relative to the kinship domain*), then objectivity is preserved but contextualized. Resolving this is a prerequisite for Priority 3 because you cannot build a normative framework (Priority 3) until you know whether that framework needs to unify domains or merely index tokens.

  **Tractability (3-Year Horizon)**
  This is tractable via **conceptual analysis and formal modeling**. You can model the logical scope of moral claims using modal logic or semantic frameworks to test whether "locally universal" claims are coherent under standard objectivist semantics. This does not require new data, but rather a rigorous mapping of the logical space between "true for us" and "true simpliciter." This work fits well into the second year of your postdoc, building on the diagnostic work of Year 1.

  **Condition for Reordering**
  You should reorder this to Priority 1 if the conceptual distinction between domain-level and token-level objectivity proves incoherent or impossible to map onto the empirical data. If it turns out that "domain" and "token" cannot be meaningfully separated in folk moral reasoning (i.e., people do not distinguish the rule from the context), then this conceptual tool is useless. In that scenario, you must move directly to constructing a new framework (Priority 3) that bypasses this distinction entirely.

  ---

  ### Priority 3: The Normative Framework
  **Question:** Can a framework of relational objectivity sustain normative force without collapsing into the relativism that the refinement of objectivity (Priority 2) seeks to avoid?

  **Corresponding Direction:** Constructing normative frameworks—such as contextualist or relational objectivity—that accommodate the observed pattern of locally universal but globally variable moral commitment.

  **Defense of Position (Upstream Dependency)**
  This is the constructive phase and must come last. Proposing a new framework like "relational objectivity" is the solution, but a solution is premature without a defined problem. If Priority 1 reveals the data is distorted, or Priority 2 reveals that standard objectivity can already handle the variation via token-level indexing, then a new framework is unnecessary theoretical bloat. Furthermore, the viability of "relational objectivity" depends entirely on how you defined the "relation" in Priority 1 (is it social role? kinship? ontology?) and the "objectivity" in Priority 2 (is it domain-bound?). Only with those definitions fixed can you argue that this framework avoids relativism. Relativism typically follows when normative force is limited to the in-group; your task is to show how relational constraints can still generate binding reasons that allow for cross-cultural critique.

  **Tractability (3-Year Horizon)**
  This is tractable via **conceptual analysis**. The third year of your funding is the appropriate time for synthesis. Having established the nature of the disagreement (Year 1) and the logical scope of the claims (Year 2), you can now draft the positive theory. This involves arguing for a meta-ethical position that treats social relations as constitutive of moral truth without making truth arbitrary. This is the most philosophically risky component, so it benefits from being built on the secure foundation of the first two questions.

  **Condition for Reordering**
  You should elevate this to Priority 2 if the refinement of existing objectivity accounts (Priority 2) proves impossible. If standard semantic tools cannot accommodate the "locally universal" data without contradiction, you must abandon the "refinement" strategy and move immediately to "construction." In this case, you would treat the construction of a new framework as the primary method for solving the scope problem, rather than treating scope as a separate preliminary step.

  ---

  ### Synthesis of Distinctions and Strategic Advice

  To execute this agenda successfully, you must rigorously maintain the two critical distinctions throughout all three years:

  1.  **Content vs. Meta-Ethics:** In Year 1, be relentless in distinguishing *what* people value from *why* they think it binds them. The error of the field is assuming that a difference in *what* (e.g., loyalty vs. care) implies a difference in *status* (objective vs. subjective). Your work must show whether the "locally universal" pattern is a difference in content (we value loyalty universally) or stance (loyalty is only binding on kin).
  2.  **Domain vs. Token:** In Year 2, use this distinction to diagnose the "locally universal" finding. If a subject says "X is wrong for us," is that a token-true claim within a variable domain, or a domain-true claim that excludes outsiders? This determines whether you are fighting relativism (domain variability) or contextualism (token variability).

  **Final Advisory Note:**
  The greatest risk to your postdoc is producing a normative theory (Priority 3) that empirical psychologists ignore because it misdescribes their data, or that meta-ethicists ignore because it solves a problem that doesn't exist. By strictly ordering your work as **Diagnostic (Q1) → Structural (Q2) → Constructive (Q3)**, you ensure that your final framework is both empirically grounded and philosophically novel. If you succeed in Priority 1, you will have shifted the debate regardless of the outcome of Priority 3. That is the safest and most impactful path for a three-year term.
