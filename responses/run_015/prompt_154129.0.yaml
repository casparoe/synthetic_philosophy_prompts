      *   *Thought:* I need to mention the *Milinda Panha* (Nagasena's chariot analogy) as it's the classic text on this exact problem.
      *   *Thought:* Ensure I distinguish between "moral weight" (user's term) and "karmic seeds" (traditional term). "Moral weight" implies a judge/debtor; "seeds" imply agriculture/nature. This linguistic shift supports their argument.

  9.  **Final Polish:** Check against the user's specific questions one last time.
