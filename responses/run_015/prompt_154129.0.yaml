answer: |-
  This is a very strong philosophical hook. You have identified the central metaphysical tension in Buddhist ethics that scholars like Mark Siderits, Charles Goodman, and Jay Garfield have spent careers unpacking. Your intuition that karma without a self looks more like "consequentialist bookkeeping" than "retributive justice" is spot-on.

  Here is a breakdown of how your framing holds up, along with some suggestions to sharpen the argument before you write the full essay.

  ### 1. Does desert require diachronic identity?
  **Verdict: Yes, your intuition is correct.**

  In Western analytic ethics (Feinberg, Sher, etc.), **retributive desert** is backward-looking. It relies on the principle that $P1$ (the punisher) is justified in harming $P2$ (the sufferer) *only because* $P2$ is identical to the agent who committed the wrong.

  If you remove substantial identity (the *atman*) and leave only causal continuity (the *santana* or psychophysical stream), you run into what Derek Parfit called the "Reductionist View."
  *   **The Problem:** If Person-B is only causally connected to Person-A (like a flame lighting another flame), but not *numerically identical*, punishing Person-B for Person-A's crime looks like vicarious punishment.
  *   **The Implication:** You are right to argue that without a stronger account of identity, karma cannot function as *moral desert* in the Western sense. It functions instead as **natural consequence**.

  **Refinement:** Be careful with the word "transferred." Desert generally cannot be transferred (that violates the concept of desert). Instead, argue that without a self, karma isn't "transferred," it is simply **causally propagated**. The suffering isn't "deserved" by the new being; it is simply the inevitable ripening of a cause planted in the stream they now inhabit. This supports your "bookkeeping" analogy.

  ### 2. Is the Western comparison forced?
  **Verdict: No, it is helpful, provided you frame it as an analytic tool, not a judgment.**

  Comparing Buddhist karma to Feinberg/Sher is not forcing frameworks together; it is using one to illuminate the blind spots of the other.
  *   **Why it works:** Western desert theory makes explicit the hidden premise of "identity" that folk-Buddhism often glosses over. By holding karma up against Feinberg, you reveal that popular understandings of karma (as cosmic justice) are actually importing a Hindu or Western notion of self into a Buddhist metaphysical system.
  *   **The Risk:** Avoid implying that Buddhism "fails" because it doesn't meet Feinberg's criteria. Instead, argue that Buddhism *rejects* the criteria. The point of your essay should be that Buddhist metaphysics *dissolves* the problem of desert rather than solving it.

  ### 3. Strengthening the "Bookkeeping" Argument
  Your phrase "consequentialist bookkeeping" is excellent. To make this robust, consider these distinctions:

  *   **Retributive vs. Forward-Looking:** Western desert is usually retributive (you suffer because you did bad). Buddhist karma, stripped of self, becomes forward-looking or therapeutic (suffering occurs to exhaust the causal potential of the action).
  *   **The "Owner" of the Karma:** In the *Milinda Panha*, Nagasena tells King Menander that there is no "one" who is reborn, yet continuity exists. If you press this, you get your exact conclusion: there is suffering, but no sufferer who "deserves" it in a juridical sense.
  *   **Mark Siderits:** You should look up Mark Siderits' work on "Buddhist Reductionism." He argues exactly what you are suggesting: that persons are conceptually constructed over impersonal dharmas. For Siderits, karma works on the level of ultimate truth (causal streams), while desert only makes sense on the level of conventional truth (persons). This nuance could save your essay from saying "Buddhism has no desert" to "Buddhism locates desert only conventionally."

  ### 4. Potential Pitfalls to Avoid
  *   **Defining Karma:** Be careful not to state "Karma is a desert-tracking mechanism" as an absolute fact. Many Buddhist philosophers (especially in the Abhidharma traditions) explicitly argue karma is **not** justice, but natural law (like gravity).
      *   *Better phrasing:* "While folk-intuitions often treat karma as a system of moral desert, the metaphysical commitment to *anatta* (no-self) undermines the conditions necessary for genuine desert."
  *   **The "Smuggling" Charge:** You argue that to save desert, one must "smuggle in" an account of identity. This is a strong claim. Some might argue that **psychological continuity** (memory, character traits) is *enough* for a weaker form of desert.
      *   *Counter-move:* Acknowledge this, but argue that psychological continuity is sufficient for *responsibility* (blame/praise) but not for *suffering as payback*. I can be responsible for my future habits, but do I *deserve* pain for a past self I no longer am? Your essay argues "No."

  ### 5. Suggested Structure for the Essay
  1.  **Introduction:** Define the tension. Karma implies moral ordering; Anatta implies no moral agent.
  2.  **The Western Standard:** Briefly outline Feinberg/Sher. Desert requires identity.
  3.  **The Buddhist Metaphysic:** Explain causal continuity vs. substantial identity (use the flame or stream analogy).
  4.  **The Collapse:** Show how applying Western desert criteria to Buddhist metaphysics results in the "bookkeeping" model. The "debt" exists, but the "debtor" is a fiction.
  5.  **The Resolution:** Conclude that this explains the soteriological shift. If karma isn't justice, the goal isn't to "pay off debt" but to "stop generating weight." This aligns with your point about de-emphasizing blame in favor of ending suffering.

  ### Summary
  Your reasoning holds up very well. You are essentially reconstructing the argument found in **Charles Goodman's *Consequences of Compassion***, where he argues that because of no-self, Buddhist ethics is fundamentally consequentialist, not deontological or retributive.

  If you anchor your "bookkeeping" analogy in the distinction between **retributive justice** (requires self) and **causal necessity** (requires only continuity), you will have a very tight, defensible seminar paper.

  Go for it. Just watch your definition of karma (don't say it *is* desert, say it is often *interpreted* as such) and you'll be solid.
