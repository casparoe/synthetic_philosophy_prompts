answer: |-
  ### Exam Question

  **Course:** PHIL 405 – Advanced Moral Relativism
  **Time:** 90 Minutes
  **Word Count:** Approx. 1500 words

  **Question:**

  In recent seminars, we introduced the concept of **normative inertia**: the tendency of a moral framework to absorb criticism not by rebutting it on shared terms, but by redefining what counts as a moral reason inside the framework itself. For example, a community might stop treating harm to outsiders as a moral failure by reclassifying those outsiders as lacking the relevant moral status, ensuring the objection never gets heard in the framework's own vocabulary.

  Write an essay evaluating whether this kind of inertia saves relativism from being self-insulating dogmatism, or whether it merely makes the framework unfalsifiable in a damaging way. 

  Your answer must:
  1.  Clearly define normative inertia and distinguish it from genuine conceptual evolution.
  2.  Apply this concept to **one concrete case** (historical or hypothetical). Do not simply summarize Harman, Wong, or other theorists; use the case to test the limits of the theory.
  3.  Argue for a definitive position on whether this mechanism protects the coherence of relativism or destroys its critical potential.

  ***

  ### Model Answer

  **Title:** The Shield That Becomes a Cage: Normative Inertia and the Unfalsifiability of Relativism

  Moral relativism often faces the charge of dogmatism: if moral truths are only true relative to a framework, how can a framework ever be wrong? Proponents like David Wong argue that frameworks have internal resources for critique and growth. However, the concept of "normative inertia" suggests a darker mechanism at play. Normative inertia occurs when a moral system absorbs external criticism not by engaging with the substance of the claim, but by shifting the semantic goalposts—redefining who counts as a moral patient or what counts as harm so that the criticism literally cannot be formulated within the system. This essay argues that while normative inertia might superficially protect relativism from external contradiction, it ultimately renders the framework unfalsifiable in a damaging way. It transforms relativism from a descriptive tool for understanding moral diversity into a shield for entrenched power, stripping the framework of any capacity for moral learning. To demonstrate this, I will apply the concept to the antebellum Southern defense of slavery in the United States.

  To understand why inertia is problematic, we must distinguish it from genuine conceptual evolution. In a healthy moral community, concepts change because the community learns something new about the world or consistency. For example, if a community realizes that their definition of "personhood" accidentally excludes a group they intended to include, and they correct this to align with their core principles, that is evolution. Normative inertia is different. It is defensive. It happens when the change is motivated solely by the need to neutralize a threat to the framework's stability. The framework doesn't adapt to accommodate a moral truth; it adapts to make the moral truth invisible. If relativism relies on this mechanism to survive criticism, it ceases to be a moral system and becomes a closed loop of justification.

  The antebellum South provides a stark case study. In the early 19th century, abolitionist criticism gained traction based on the premise that slavery inflicts unjustified harm on human beings. A standard relativist defense might suggest that the Southern framework simply valued hierarchy differently. However, as pressure mounted, the Southern moral framework didn't just argue that hierarchy was good; it engaged in normative inertia regarding the status of the enslaved. Initially, some defenses admitted slavery was a "necessary evil" but claimed it was economically unavoidable. As the moral criticism intensified—specifically the claim that "slavery violates natural rights"—the framework shifted. It didn't argue against natural rights directly; it redefined the enslaved population as naturally lacking the capacity for those rights. 

  By the 1850s, following the *Dred Scott* decision, the legal and moral vocabulary had shifted to classify Black people as having "no rights which the white man was bound to respect." This is normative inertia in action. The criticism ("you are harming persons") was not rebutted by saying "the harm is justified." It was rebutted by saying "there are no persons here to be harmed." The framework absorbed the criticism by altering the input conditions of moral reasoning. If the relativist says this is just "internal coherence," they miss the point. The coherence was purchased by excluding the very evidence that threatened the system.

  Does this save relativism from dogmatism? A proponent might argue that every moral system has boundaries. Liberal democracies exclude terrorists from certain protections; religious groups exclude non-believers from sacraments. Therefore, redefining moral status is just part of maintaining a framework's integrity. If the Southern framework was coherent on its own terms, why should an external relativist critique it? This is where the distinction between protection and unfalsifiability becomes crucial. If a framework can adjust its definitions specifically to evade criticism without any independent check on whether those definitions are accurate or humane, the framework is unfalsifiable. 

  In the Southern case, the redefinition of moral status wasn't driven by new empirical data about cognitive capacity (science was actually moving against them); it was driven by the need to maintain an economic and social order. If relativism allows this kind of inertia, it validates any system that is clever enough to redefine its victims. It saves relativism from the charge of contradiction, but only by making it morally inert. A moral theory that cannot distinguish between "learning that we were wrong about who counts" and "deciding who counts to avoid being wrong" has lost its critical edge. It becomes a description of power dynamics rather than a guide for moral reasoning.

  Furthermore, this inertia blocks the possibility of cross-framework moral learning, which sophisticated relativists like Wong claim is possible. Wong suggests we can learn from other frameworks by finding overlapping values. But normative inertia prevents overlap. If Framework A says "harm is bad" and Framework B says "what you call harm is actually discipline," they can talk. But if Framework B says "those beings cannot be harmed," there is no shared vocabulary for critique. The relativist is forced to say Framework B is valid relative to itself. This leads to the damaging conclusion that moral progress is impossible, only moral shift. If the abolitionists were just imposing *their* framework, and the South was maintaining *theirs* via inertia, relativism struggles to explain why the abolitionists were objectively better, unless it smuggles in universalist premises it claims to reject.

  One might counter that identifying "inertia" requires an external, universalist standpoint. How do we know the South was engaging in inertia rather than honest conceptual refinement? Isn't calling it "inertia" just imposing our own liberal framework? This is a strong objection. However, we can identify inertia structurally without appealing to universal truths. We look for asymmetry in reasoning. If a framework expands moral status when it is convenient (e.g., extending rights to property owners) but contracts it when challenged (e.g., removing rights from the enslaved when abolitionists protest), without a consistent principle explaining the shift, that is structural evidence of inertia. It shows the reasoning is subservient to the conclusion. Relativism doesn't need universal truths to spot inconsistency; it only needs to observe the internal mechanics of the framework. When the mechanics show that definitions shift solely to protect the core from refutation, the framework is dogmatic by its own standards of coherence.

  Therefore, normative inertia does not save relativism; it exposes its vulnerability. If relativism accepts inertia as a valid method of framework maintenance, it admits that moral systems are self-sealing. They cannot be wrong, only different. This makes relativism unfalsifiable, but in a way that destroys its philosophical utility. It becomes a tool for explaining away atrocity rather than understanding it. The Southern framework didn't survive because it was morally robust; it survived because it successfully insulated itself from the vocabulary of harm. 

  In conclusion, normative inertia is the mechanism by which relativism curdles into dogmatism. By allowing frameworks to redefine moral reasons to absorb criticism, relativism grants immunity to systems that refuse to engage with external reality. The antebellum South demonstrates that when a framework treats moral status as a variable to be manipulated for self-preservation, it ceases to function as a moral guide. While this might protect the relativist from having to condemn the framework from the outside, it renders the theory incapable of accounting for moral progress or regression. A relativism that cannot distinguish between growth and defensive maneuvering is not a sophisticated accommodation of diversity; it is a surrender to power. Ultimately, normative inertia makes relativism unfalsifiable, but at the cost of making it irrelevant.

  ***

  ### Marking Scheme (Total 20 Marks)

  **1. Definition & Distinction (4 Marks)**
  *   **Criteria:** Student clearly defines "normative inertia" (redefining reasons to absorb criticism) and distinguishes it from genuine conceptual evolution (learning vs. shielding).
  *   **Value:** 4 Marks.
  *   **Common Botch:** Students define inertia as just "stubbornness" or "refusing to change," missing the specific mechanism of *redefining moral vocabulary* to block the critique.

  **2. Case Study Application (4 Marks)**
  *   **Criteria:** The concrete case (e.g., Antebellum South, Cults, Colonialism) is used to *demonstrate* the mechanism, not just mentioned. The student shows exactly how the framework shifted definitions to avoid the critique.
  *   **Value:** 4 Marks.
  *   **Common Botch:** Students summarize the historical event without linking it back to the concept of inertia (e.g., just saying "slavery was bad" instead of "how the definition of personhood shifted to protect slavery").

  **3. Evaluation of Unfalsifiability (4 Marks)**
  *   **Criteria:** Student explicitly addresses the prompt's core tension: does this protect relativism or damage it? They must argue whether this makes the theory unfalsifiable in a way that matters.
  *   **Value:** 4 Marks.
  *   **Common Botch:** Students sit on the fence ("it does both") without arguing for a definitive position on whether this is philosophically damaging.

  **4. Handling the Counter-Argument (4 Marks)**
  *   **Criteria:** Student anticipates the objection that identifying "inertia" requires a universalist standpoint (who are we to say it's inertia?) and offers a rebuttal (e.g., structural inconsistency).
  *   **Value:** 4 Marks.
  *   **Common Botch:** Students ignore the relativist trap and simply assert their own moral view is correct, failing to argue *within* the constraints of relativist theory.

  **5. Structure & Coherence (4 Marks)**
  *   **Criteria:** Essay has a clear thesis, logical flow, and conclusion. Arguments build on each other rather than being a list of points.
  *   **Value:** 4 Marks.
  *   **Common Botch:** Essay is disjointed, with the case study appearing in isolation rather than woven into the theoretical argument.
