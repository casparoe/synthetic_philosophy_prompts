answer: |-
  Here are two candidate principles derived from your cases, followed by an analysis of their costs, an application to your uncertain cases, and a direct engagement with the unit and evaluative questions.

  ### Candidate Principle 1: The Irreversibility of Complexity
  **Statement:** A society collapses when it undergoes a significant reduction in its capacity to coordinate collective action (complexity) and fails to recover that capacity within three generations.

  *   **Motivation:** This principle is built to reconcile **Case Eight** (slow shrinkage is collapse) and **Case Nine** (fast disaster is not). The distinguishing factor you identified was not the speed or the cause, but the failure to return to the prior baseline. It also handles **Case Three** (Rapa Nui): regardless of whether the cause was external or internal, the capacity to coordinate (statue building, population maintenance) was lost and not recovered.
  *   **The Cost:** This principle struggles with **Case Four** (Glasshouse). If the Glasshouse islanders coordinate *better* (everyone fed, art produced) but with fewer people and less bureaucracy, have they lost complexity? By a strict metric of "number of roles" or "energy capture," yes. By a metric of "welfare," no. To save your verdict here, you must add an ad hoc clause: *"unless the reduction in complexity is traded for a demonstrable increase in individual welfare chosen by the population."* This weakens the principle by making "collapse" dependent on subjective well-being rather than structural facts.
  *   **The Cost (Case Six vs. Seven):** This principle forces you to choose a unit. If the unit is the Kingdom (Case Six), complexity drops (admin language gone). If the unit is the Village (Case Seven), complexity might stay steady or rise (less tax, more security). The principle cannot resolve the conflict; it only highlights that you must define the "system" before measuring the "complexity."

  ### Candidate Principle 2: The Break in Transmission
  **Statement:** A society collapses when the descendants lose the capacity to interpret the intentions, records, or symbolic acts of their ancestors without external translation.

  *   **Motivation:** This is built around **Case One** (the script). You explicitly said the weightiest factor was that grandchildren could not read what grandparents wrote. It also handles **Case Ten** (aqueducts). Losing a technique is practical; losing the script is semantic. One is a tool, the other is a voice. This principle validates your intuition that Case One is a deeper collapse than Case Ten. It also handles **Case Two** (Maya): since Maya people and languages continued, the transmission line was bent, not broken.
  *   **The Cost:** This principle is vulnerable to **Case Six** (Conquered Kingdom). If the imperial language replaces the old one, the descendants cannot read the old records. By this principle, that is a collapse. But in **Case Seven**, you said it was *not* a collapse. To accommodate Case Seven, you must add a clause: *"unless the new interpretive framework is adopted voluntarily or results in a stable continuity of daily life."* This reintroduces the moral/welfare judgment you were trying to avoid.
  *   **The Cost (Case Nine):** If a city is wiped out and rebuilt forty years later, the transmission was briefly interrupted but restored. This principle handles Case Nine well (no collapse), provided the "three generation" rule from Principle 1 is implied.

  ### Application to Case Five (The Future Rich Country)
  If we apply **Candidate Principle 2 (Break in Transmission)** to Case Five, the verdict depends on the nature of the "online universities" and the "anglicized language."

  If the language is heavily anglicized but still allows the descendants to read the archives of two centuries prior (perhaps with some study, as we read Shakespeare), then transmission holds. It is **not a collapse**. It is a transformation.

  However, your intuition leans toward "collapse." Why? Because of the *teleology*—the direction of travel. In **Case Four (Glasshouse)**, the society moved *toward* something (a religious ideal, better art). In **Case Five**, the society is drifting *away* from something (perpetuity, monumentality) without a stated replacement goal. "No one building anything meant to outlast them" suggests a loss of *future-orientation*.

  Therefore, to capture your intuition on Case Five, Principle 2 needs a third clause: *"A society collapses when it loses the capacity to interpret the past **and** loses the will to project a distinct identity into the future."*

  This explains the difference between Glasshouse and Case Five. Glasshouse sacrificed the past for a chosen future. Case Five is sacrificing the future for a comfortable present. That is why Case Five feels like a collapse to you, even if the people are richer. It is a collapse of *ambition*, not just complexity.

  ### A New Constructed Case
  **Case Eleven: The Digital Archive.** A society physically dissolves; the population dies out or merges into others, but they leave behind a perfectly preserved, automated digital archive that explains their laws, history, and art to any future visitor. The "form of life" is gone, but the "information" is intact.

  *   **Verdict under Principle 1:** Collapse (capacity to coordinate is zero).
  *   **Verdict under Principle 2:** Collapse (no descendants to do the interpreting).
  *   **Your Likely Verdict:** I suspect you would call this a collapse, perhaps the ultimate one. It tests the limit of your friend's view. Your friend might say, "The information survived, so the society survives." You would likely say, "A society is a verb, not a noun. Without people living it, it is a museum, not a society." This supports the idea that collapse is about *process*, not just *artifacts*.

  ### The Unit Question
  You asked if the concept is too gerrymanderable because the verdict flips between Case Six (Kingdom) and Case Seven (Village).

  **Honest Answer:** Yes, the concept is gerrymanderable, but that is not a flaw; it is a feature. "Society" is not a natural kind like "gold" or "water." It is a layered concept. There is the *polity* (the state), the *culture* (the people/language), and the *civilization* (the material complexity).

  *   Case Six is a collapse of the **Polity**.
  *   Case Seven is a continuity of the **Culture**.

  Your friend argues that because the Culture survived, calling it a "collapse" is moralizing about the Polity. You argue that because the Polity died, calling it a "collapse" is acknowledging a real loss of structure. **Both of you are right about different layers.**

  The concept is only useless if you refuse to specify *which* layer you are talking about. If you say "The Bronze Age collapsed," you must mean "The Palace System collapsed," not "The Greek people vanished." If you allow the unit to shift mid-argument to suit your moral preference, then your friend is right: you are cheating. But if you fix the unit first (e.g., "I am measuring the stability of the administrative state"), the verdict becomes objective.

  **Recommendation:** You must accept that "collapse" is always "collapse *of* X." If you cannot name X, you cannot use the word.

  ### The Evaluative Question
  Your friend claims "collapse" smuggles in a verdict about what is valuable (monuments, literacy). You suspect some losses are real regardless of values.

  **Honest Answer:** Your friend is half-right. You cannot strip the evaluation out entirely. "Collapse" is a medical metaphor; it implies a healthy state that has become pathological. A rock does not "collapse." Only a system with a function can collapse. Therefore, you must define the *function* to define the collapse.

  However, your friend is wrong that the function must be *moral* or *elitist* (monuments/empire). The function can be *informational*.

  In **Case One**, the loss of script is not just a loss of "elite values." It is a loss of bandwidth. A society that cannot write has a lower ceiling for storing information than one that can. This is an objective reduction in capacity, similar to a computer losing its hard drive. It doesn't matter if the new illiterate society is happier (as in Glasshouse); they have objectively less capacity to coordinate across time and space.

  So, is there anything left besides a graph of population and complexity? **Yes.** The graph shows the *shape* of the change, but "collapse" identifies the *break in the mechanism* that sustains the shape.

  *   **Graph:** Population goes down.
  *   **Collapse:** The reason population went down is that the system for distributing food broke and was not fixed.
  *   **Transformation:** The reason population went down is that people chose to have fewer children to paint better sculptures (Glasshouse).

  The graph looks the same. The *cause* determines the label.

  ### Final Verdict
  Should you stop using the word? **No.** But you must concede two points to your friend to make it defensible.

  1.  **Specify the Unit:** You must admit that Case Six and Case Seven are not contradictions. One is a political collapse, the other is a social continuity. If you call Case Six a "collapse" without specifying "of the kingdom," your friend is correct that you are being sloppy.
  2.  **Admit the Normative Baseline:** You must admit that "collapse" implies a loss of *capacity*, not necessarily a loss of *happiness*. If a society becomes happier but simpler (Glasshouse), it is a transformation, not a collapse. If it becomes happier but loses the ability to read its own history (Case Five drift), it is a collapse of *continuity*.

  **Which of your verdicts has to go?**
  If you want a consistent principle, you must abandon the certainty in **Case Three (Rapa Nui)**. You said you want to say both "it collapsed" and "it was destroyed from outside." Logically, these are mutually exclusive under strict definitions. A house that is burned down by an arsonist has not "collapsed"; it has been destroyed. A house that rots from within has collapsed.
  If you keep the word "collapse" for Rapa Nui, you are using it to mean "End of a distinct way of life," regardless of cause. If you do that, you must accept that **Case Six** is definitely a collapse (End of Kingdom), and **Case Seven** is definitely not (Continuity of Life). You cannot have it both ways there.

  **My advice:** Keep the word. It describes a real phenomenon: the irreversible loss of social complexity and intergenerational transmission. But treat it as a technical term, not a slur. Define the system, measure the capacity, check the recovery. If the system is gone and the capacity is not recovered, it is a collapse. If the system changes but the capacity remains or grows, it is a transformation. Your friend wants to say everything is transformation. You know that is not true. Some doors lock from the outside, but some keys are simply lost forever. That loss is real.
