answer: |-
  **Proposal: The Confounded Projection — Neutral Counterparts and the Semantics of Slurs**

  **Research Question**
  Does the survival of derogatory content under logical operators (negation, questioning, conditional embedding) demonstrate that derogation is part of semantic content, or does it register the pragmatic cost of selecting a marked expression over an available neutral counterpart?

  **Background and The Gap**
  The contemporary debate regarding slurs divides primarily between two positions. The semantic content view holds that derogatory force is truth-conditional; to use a slur is to express a proposition that inherently denigrates the target. The pragmatic implicature view holds that the literal content is neutral, and derogation arises from conversational norms or expressive use. Both positions rely on the same evidential base: projection tests. Derogation appears to survive negation ("X is not a [slur]"), questioning, and embedding, and resists explicit cancellation. Both sides treat this data as stable.

  This proposal argues that this shared evidential base is confounded. Standard projection tests typically assume a context where a neutral, non-derogating term is available but passed over. If offensiveness is partly contrast-sensitive—dependent on the choice of a marked expression when an unmarked one was available—then standard tests measure the cost of that choice rather than the semantic content of the word itself. The literature relies heavily on cases where a clean neutral counterpart exists. It neglects cases where the neutral counterpart is contested, reclaimed, or non-existent. If the contrast hypothesis is correct, projection data should diverge systematically in these neglected cases.

  **Methodology**
  This project employs conceptual analysis and the construction of minimal pairs to test intuitions regarding projection behavior. No experimental subjects or purpose-built corpora will be used; the method relies on introspective judgment and public discourse examples, requiring no ethics clearance.

  *   **Month 1: Formalization and Mapping.** I will map the logical space of the semantic and pragmatic views without relying on specific authorial names, focusing strictly on the claims made about truth-conditions versus use. I will formalize the "Contrast Hypothesis": *Derogatory projection is modulated by the availability and acceptability of neutral counterparts.*
  *   **Month 2: Case Construction (Slurs).** I will construct vignettes varying the availability of neutral counterparts.
      *   *Type A:* Clean neutral available (standard literature cases).
      *   *Type B:* Neutral contested or rejected by the target group.
      *   *Type C:* Reclaimed slurs used in-group where no neutral alternative captures the specific social meaning.
      *   I will assess whether derogatory force projects equally across A, B, and C.
  *   **Month 3: Control Cases (Risk Management).** A primary risk is that any contrast effect found is not unique to slurs but applies generally to taboo or register-sensitive vocabulary (e.g., profanity vs. formal equivalents). To build this risk into the design, I will apply the same projection tests to non-slur taboo terms where neutral paraphrases are unavailable or socially marked. If the contrast effect appears here too, the result concerns general appropriateness conditions rather than slur semantics specifically.
  *   **Month 4: Drafting and Revision.** I will synthesize the findings into a draft, focusing on whether the variance in data undermines the semantic view or requires a refinement of the pragmatic view.

  **Expected Conclusions and Nature of the Result**
  There are three possible outcomes. First, if projection remains robust even when no neutral counterpart is available (Type C), the contrast hypothesis fails, and the standard data stands. Second, if projection weakens or vanishes in Type B and C cases but holds for Type A, the semantic view is undermined; the data supports a pragmatic view sensitive to lexical choice. Third, if the effect generalizes to non-slur taboo words (Month 3), the result is not about slurs specifically but about the methodology of using projection tests for socially marked language generally.

  **Explicit Clarification:** A successful paper will primarily establish a result about the **methodology of the debate**, rather than a definitive metaphysical result about slurs themselves. It will demonstrate that the standard diagnostics are insufficiently sensitive to context. A reader who begins neutral should end convinced that the current consensus regarding projection data is premature and that any theory of slurs must account for the availability of neutral counterparts before claiming semantic status for derogation.

  **Scope Assessment**
  This scope is feasible for a one-semester term paper. It avoids empirical hurdles by relying on constructed cases and existing public examples. The limitation is the reliance on introspective intuitions, which may vary between speakers. However, this is standard practice in philosophy of language. The inclusion of non-slur control cases ensures that the argument does not overreach by claiming uniqueness for slurs where none exists.

  **Address to the Skeptic**
  To the most skeptical person in the seminar: You should abandon the contrast hypothesis if you find that derogatory content projects robustly in reclaimed, in-group contexts where no neutral counterpart exists or is desired. In such cases, the offense cannot be attributed to the choice of a marked term over an unmarked one, as no unmarked alternative is live. The reasoning is most likely to break in the reliance on introspective intuition regarding offensive cases; without empirical verification, claims about what "sounds offensive" in hypothetical vignettes may reflect the theorist's biases rather than linguistic competence. If my constructed cases fail to elicit the predicted shift in intuition upon reflection, the methodological critique collapses.
