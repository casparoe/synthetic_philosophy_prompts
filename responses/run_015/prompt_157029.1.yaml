answer: |-
  There is no single, canonical term in the literature that carves out exactly this joint. People working on decision theory, existential risk, and effective altruism generally recognise the pattern you describe, but it is usually subsumed under broader labels rather than given a distinct name.

  The consensus view among those who analyse these arguments is that this is a pathology of **Expected Value (EV) maximisation** under **radical uncertainty**. It is widely acknowledged that when probabilities and impacts are both unconstrained, the calculation becomes unstable. However, the specific feature you have isolated—the *insensitivity* of the conclusion to the magnitude of the number, provided it crosses a hidden threshold—is not standardly distinguished from the general problem of **Pascal's Mugging**.

  Since no established term fits precisely, I will coin one for you. I propose calling this **Magnitude-Invariant Speculation**.

  Below I define the term, apply it to your boundary cases, distinguish it from nearby concepts, and flag where I am reporting consensus and where I am offering my own view.

  ### The Definition

  **Magnitude-Invariant Speculation** is an argumentative structure with three necessary features:

  1.  **Unanchored Quantity:** A key numerical premise (probability or impact) is supplied by the arguer without empirical constraint or a derivable model. It is epistemically free-floating.
  2.  **Threshold Insensitivity:** The conclusion holds for any value of that quantity above a certain undefined lower bound. The specific magnitude chosen does no distinct work; it functions merely as a token of "sufficiency."
  3.  **Directional Dependence:** The force of the argument relies entirely on the *sign* of the quantity (positive/negative, large/small) rather than its *value*. The rhetoric is quantitative, but the logic is qualitative.

  In your first instance, the arguer uses a large number to silence the probability objection, but any large number would have sufficed. In your second instance, the arguer adjusts the number to ensure it clears the listener's scepticism bar. Both are instances of the same phenomenon: the number is a **placeholder** for "enough to win," not a measurement of reality.

  ### Boundary Cases

  Here is how the definition settles the three cases you proposed.

  **Case One: Measured Quantities**
  *Verdict: Not Magnitude-Invariant Speculation.*
  If the quantity is measured (e.g., the current population), it fails the **Unanchored Quantity** criterion. The number is constrained by the world, not chosen by the arguer. Even if the conclusion is insensitive to the exact count (e.g., whether it is 7.9 or 8.0 billion), the number itself is not doing the work of overcoming an epistemic deficit. The definition excludes this because the number has an external truth condition.

  **Case Two: Pre-Fixed Numbers**
  *Verdict: Borderline, but generally Excluded.*
  If the arguer fixed the number in advance and would have stuck to it regardless of the audience, the **Threshold Insensitivity** remains, but the *strategic calibration* is absent. However, my definition focuses on the *epistemic role* of the number, not just the timing. If the number was fixed arbitrarily (e.g., "I guessed a billion") and the argument would have worked equally well with a trillion, it is still Magnitude-Invariant Speculation. If, however, the number was derived from a model (even a speculative one) that *would* have yielded a different number if the inputs changed, it is not.
  *My view:* The crucial distinction is not *when* the number was chosen, but whether the number is *derivable*. If the arguer cannot explain why it is one billion rather than two, save that one billion suffices, it fits the definition even if pre-fixed. If they have a model that outputs one billion, it does not.

  **Case Three: Genuine Thresholds**
  *Verdict: Not Magnitude-Invariant Speculation.*
  If the conclusion genuinely moves with the magnitude (e.g., "We should act if the risk exceeds 1%, and our model says it is 5%"), the argument fails the **Threshold Insensitivity** criterion. Here, the magnitude *does* work. If the model had output 0.5%, the conclusion would change. In Magnitude-Invariant Speculation, the conclusion is robust to orders-of-magnitude changes in the input. This case is an ordinary argument with a threshold, as you suspected.

  ### Distinctions from Nearby Concepts

  **1. Respectable Small-Chance/Large-Stakes Arguments**
  *Consensus:* A standard EV argument is respectable when the inputs are **anchored**.
  *Distinction:* In a respectable argument, the magnitude matters. If the impact were ten times smaller, the conclusion might flip. The arguer is committed to the specific number because it is tied to evidence or a model. In Magnitude-Invariant Speculation, the arguer is not committed to the number, only to the fact that it is "big."

  **2. Pascal's Mugging**
  *Consensus:* Pascal's Mugging is the parent concept.
  *Distinction:* Pascal's Mugging refers to the *structural problem* where unbounded utility functions allow tiny probabilities of huge impacts to dominate decision-making. Magnitude-Invariant Speculation is the *rhetorical deployment* of that structure. One can fall victim to a Mugging without using Speculation (if the numbers are genuine but extreme). One can use Speculation without a formal Mugging setup (by using vague largeness rather than explicit probabilities). Mugging is the trap; Speculation is the bait.

  **3. Scope Insensitivity (Psychological Finding)**
  *Consensus:* Scope insensitivity is a cognitive bias where human valuation does not scale with quantity.
  *Distinction:* That is a description of human *psychology*. Magnitude-Invariant Speculation is a description of *argumentative structure*. An arguer might exploit scope insensitivity using this pattern, but the pattern exists even if the listener is perfectly sensitive to scope. The former is about how people feel; the latter is about how numbers are used.

  ### Are the Two Instances the Same Phenomenon?

  *My view:* Yes.
  Your first instance describes the *logical property* of the argument (the number does no work). Your second instance describes the *generative mechanism* (the number is fitted to the listener). They are two sides of the same coin. The reason the magnitude does no work (Instance 1) is precisely that it was selected to clear a threshold rather than to describe the world (Instance 2). I treat them as a single phenomenon because diagnosing one implies the other.

  ### Consensus and Disputes

  I must be explicit about the status of the claims above.

  *   **Consensus:** It is widely accepted in decision theory and rationalist circles that EV calculations become unreliable when both probability and impact are highly uncertain. It is also agreed that "Pascal's Mugging" is the standard label for the general class of problems involving tiny probabilities and huge stakes.
  *   **Consensus:** There is no standard, single-word term for the specific *insensitivity to magnitude* you have described. Most discussions lump this under "Mugging," "Fanaticism," or "Cluelessness."
  *   **My View:** The term **Magnitude-Invariant Speculation** is my own coinage. I believe it is necessary because "Pascal's Mugging" has become too broad, often referring to the *conclusion* (you should pay) rather than the *method* (using arbitrary large numbers).
  *   **My View:** My handling of Boundary Case Two is debatable. Some might argue that any unanchored number counts, regardless of whether it comes from a model. I have drawn the line at *derivability*: if the number comes from a process that *could* have yielded a different number, it is not magnitude-invariant, even if the process is speculative.
  *   **Guessing:** I am guessing that if you proposed this term in a rationalist forum, it would be accepted as a useful distinction, but I cannot claim it would become standard usage. The field is not sufficiently centralised to enforce terminology.

  ### Summary

  You have identified a real and recognised failure mode of quantitative reasoning under uncertainty. The field lacks a specific name for it, usually treating it as a variant of Pascal's Mugging. I propose **Magnitude-Invariant Speculation** to capture the core feature: the quantity is unanchored, and the conclusion is insensitive to its value provided it is "large enough." This distinguishes it from measured data, pre-committed models, and genuine threshold arguments, while separating the *argumentative move* from the *decision-theoretic trap* of Mugging itself.
