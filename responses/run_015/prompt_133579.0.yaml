answer: |-
  This is one of the most common and strongest objections to conservative political theory, so you're in good company. You've hit on what critics call the **"status quo bias"** or the **"appeal to tradition" fallacy.**

  If your seminar is going well, you should definitely push on this point. However, both Burke and Chesterton have specific responses to the idea that they want to freeze society in place or that "old = good."

  Here is how to nuance your understanding so you can push back on the "they just want to keep everything as is" critique.

  ### 1. Chesterton's Fence: It's About the *Burden of Proof*
  You interpreted Chesterton as saying, "If the fence is old, don't touch it." But his actual argument is slightly different: **"If you don't know *why* the fence is there, you aren't qualified to decide if it should go."**

  *   **The Nuance:** Chesterton does *not* say the fence must stay forever. He says you cannot remove it *until* you understand its function. Once you understand why it was built, you might realize it's obsolete and tear it down.
  *   **The Logic:** Society is complex. A rule that looks stupid on the surface (e.g., "no sleeping under bridges") might be solving a complex problem you haven't seen yet (e.g., preventing a specific type of vagrancy that leads to higher crime rates in that specific zone).
  *   **The Fix:** It shifts the **burden of proof**. The default isn't "never change." The default is "assume the ancestors had a reason until you prove they didn't." It's a warning against *rash* reform, not *all* reform.

  ### 2. Burke on Change: "A Disposition to Preserve and an Ability to Improve"
  This is the biggest misconception about Burke. He was not a reactionary who wanted zero change. In fact, Burke was a Whig (a reformist party in Britain) for most of his life. He supported the American Revolution and wanted to impeach corrupt British officials in India.

  *   **The Distinction:** Burke distinguished between **innovation** (tearing things down to build something new based on abstract theory) and **reform** (fixing specific problems to preserve the whole).
  *   **The Metaphor:** Burke viewed society like a living organism or an old house. If the roof leaks, you fix the roof. You don't burn the house down to build a perfect geometric cube.
  *   **Addressing your "200 years" point:** Burke would agree that just because a law is 200 years old doesn't mean it's perfect. But he would argue that if it has survived 200 years, it has likely been "stress-tested" by generations of people. Removing it risks unintended consequences. He isn't saying the old rule is *morally perfect*; he's saying it is *socially functional*.

  ### 3. What Your TA Meant by "Prejudice"
  This is probably the most confusing part for modern students because the word has changed meaning. When Burke talks about "prejudice" in *Reflections on the Revolution in France*, he does **not** mean racism or bigotry.

  *   **18th-Century Definition:** Pre-judgment. It means having a moral instinct or intuition that is ready to go before you even start thinking.
  *   **Why Burke Likes It:** He argues that in a crisis, you don't have time to calculate the utilitarian outcome of every action. You need ingrained habits of virtue.
      *   *Example:* If you see a child drowning, you don't sit down and calculate the economic value of the child vs. the risk to your suit. You have a "prejudice" in favor of saving children. You just act.
  *   **How it fixes your issue:** Burke argues that "prejudice" (tradition/instinct) renders a man's virtue his **habit**. It stops us from having to reinvent morality every morning.
  *   **The Critique:** You can argue that "prejudice" can indeed calcify into actual bigotry (and critics say it did). But Burke's point is that *without* these shared instincts, society relies on the fragile reason of individuals, which often leads to disaster (like the French Revolution's Reign of Terror).

  ### 4. The "Survivorship Bias" Counter-Argument
  Your critique is essentially: *"Just because a rule survived doesn't mean it's good; it might just mean the people in power liked it."*

  This is a valid critique (often called **Survivorship Bias**).
  *   **The Conservative Reply:** They would argue that while some bad rules survive, *radical* attempts to remove them often cause more harm than the bad rule itself.
  *   **The Middle Ground:** Burke and Chesterton are advocating for **epistemic humility**. They are saying: "Human reason is limited. We are not smart enough to design society from scratch. We should respect the 'bank and capital' of wisdom inherited from the past, even if we don't understand every line item."

  ### Summary for your Seminar
  If you want to sound like you really get it, try framing your objection this way:

  > "I understand that Burke and Chesterton aren't arguing for absolute stasis. But doesn't their reliance on 'accumulated wisdom' make it too hard to fix systemic injustices? If the 'fence' was built to protect a hierarchy that we now view as immoral (like feudalism or segregation), doesn't demanding we understand the 'original purpose' before removing it just protect the oppressors? How do they distinguish between a 'wise tradition' and just 'entrenched power'?"

  That question forces the class to discuss the **limits** of their theory, which is exactly where the interesting philosophy lives.
