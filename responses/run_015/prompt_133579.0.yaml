  hey so im in this conservatism seminar and we just did burke and chestertons fence thing. if i understand right, chesterton says dont tear down a fence unless u know why its there, and burke thinks tradition is like accumulated wisdom. but doesnt that commit them to saying every old rule is automatically justified? like if some law has been around for 200 years it must be doing something good, otherwise people wouldve gotten rid of it already? my TA said something about burkes view of prejudice but i dont see how that fixes the issue—seems like they just want to keep everything as is.
reasoning: |-
