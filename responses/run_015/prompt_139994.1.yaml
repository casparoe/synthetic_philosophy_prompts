  # PART ONE: THE DIAGNOSTIC QUESTIONS

  **Instructions:** Read each case carefully. Select the single option that best matches your intuition about what is happening. Do not worry about technical terms; answer based on the story as described.

  **1. The Monitor**
  A patient has a monitor implanted in her motor cortex. The monitor is programmed to detect any attempted hand movement that is failing to be initiated and to stimulate the cortex so that the same movement occurs, with the same force, direction and timing that it would otherwise have had. On Tuesday afternoon she reaches for a glass because she wants a drink and believes the glass contains water; the monitor detects nothing amiss and does nothing. Did her wanting a drink and her believing there is water cause the reaching?
  (a) Yes: the monitor did nothing, and the reaching happened because of what she wanted and believed.
  (b) Yes, but only because wanting the drink and believing there was water were, on that occasion, goings-on in her brain that produced the reaching; the wanting and the believing themselves made no difference to anything.
  (c) Yes in the everyday sense, but what actually brought the reaching about was the neural process, and the wanting and the believing came along with it without doing any of the work.

  **2. The Twin Triggers**
  A security system is designed to lock a door if it detects danger. It has two triggers: a biological sensor that detects the guard's fear response, and a digital sensor that detects a rise in ambient heat. Both sensors are connected to the same lock mechanism. In a specific instance, a fire breaks out. The guard becomes afraid, and the heat rises. Both sensors activate simultaneously. The lock engages. Did the guard's fear cause the lock to engage?
  (a) Yes, the fear was a genuine cause alongside the heat detection.
  (b) Yes, but only because the fear was identical to the neural state that triggered the biological sensor.
  (c) No, the heat detection and the neural state were sufficient; the fear itself added nothing to the production of the lock engaging.

  **3. The Quantum Neuron**
  A certain neuron fires only if a subatomic particle decays within a specific time window. The decay is fundamentally chancy; the physical laws only determine the probability of decay, not the outcome. A person decides to press a button. The decision coincides with the decay, and the neuron fires, causing the button press. Given that the physical state only made the firing probable, not certain, did the decision contribute to the firing?
  (a) Yes, the decision settled the chancy outcome; without it, the firing was not guaranteed.
  (b) Yes, but only because the decision was the physical process of the decay occurring in the brain.
  (c) No, the decay happened according to its physical probabilities; the decision merely accompanied the physical chance event.

  **4. The Alien Pain**
  An alien creature screams and withdraws its limb when touched by fire, just as a human does. However, the alien has no neurons or brain; its internal workings are hydraulic, using fluid pressure instead of electrical signals. Does the alien's pain cause the withdrawal?
  (a) Yes, the pain is a real state that exists in both humans and aliens and causes the withdrawal in both.
  (b) Yes, but in the human it is a brain state, and in the alien it is a hydraulic state; the pain is just the role played by these different parts.
  (c) No, in the human the brain causes the withdrawal, and in the alien the hydraulics cause it; saying "pain" causes it is just a shorthand for these different physical causes.

  **5. The Perfect Predictor**
  A super-computer scans your brain and physical environment. Based on this complete physical data, it predicts with 100% accuracy that you will raise your hand in five seconds. It makes this prediction before you consciously decide to do so. When you do raise your hand, does your conscious decision provide any additional explanation beyond the computer's physical data?
  (a) Yes, the decision is a further fact that explains why the physical data led to this outcome.
  (b) Yes, but only because the decision is part of the physical data the computer scanned.
  (c) No, the physical data already fixed the outcome; the decision was inevitable given the physics and adds no new explanatory power.

  **6. The Memory Trace**
  When you learn a new fact, a specific pattern of synaptic connections strengthens in your hippocampus. Did your thinking about the fact cause the synaptic strengthening?
  (a) Yes, the mental act of learning directly brought about the physical change in the synapses.
  (b) Yes, but the mental act was itself a physical process in the brain that altered the synapses.
  (c) No, the synaptic strengthening was caused by prior physical chemical cascades; the thinking was a result of those cascades, not the cause of the strengthening.

  **7. The Inverted Twin**
  Imagine a twin who is physically identical to you in every respect, down to the last atom. However, when your twin looks at a red apple, their inner experience is what you have when you look at green grass (though they call it "red" because they learned the word the same way). You both reach for the apple. Does the difference in inner experience make a difference to the reaching?
  (a) Yes, the inner experience is part of what drives the action, so the twin's action is driven by a different cause than yours.
  (b) No, since the physical bodies are identical and behave identically, the inner experience does not influence the movement.
  (c) It depends on whether the inner experience is the same thing as the brain state; if they are the same, the cause is the same, if not, the cause might differ.

  **8. The Broken Link**
  Suppose we could hold all the physical facts in your brain fixed exactly as they are, but magically change your mental state (e.g., change your desire for water to a desire for juice). Would your behavior change?
  (a) Yes, if the desire changed, the action would change, even if the brain state stayed the same.
  (b) No, if the brain state stays the same, the action must stay the same; the desire cannot change independently.
  (c) The question is impossible; if the brain state is fixed, the desire is fixed too, so we cannot imagine this scenario.

  **9. The Rational Override**
  A person has a strong physical reflex to flinch when a loud noise occurs. However, they consciously decide to stand still to avoid startling a baby, and they succeed in not flinching. Did the reason (not startling the baby) override the physical reflex?
  (a) Yes, the rational consideration intervened and stopped the physical process that would otherwise have occurred.
  (b) Yes, but the rational consideration was itself a physical process in the brain that inhibited the reflex pathway.
  (c) No, the physical process that inhibited the reflex was caused by prior physical causes; the reason was just a description of that physical inhibition.

  **10. The Coarse Grain**
  A specific belief (e.g., "there is water") can be realized by many different specific neural patterns. The hand reaches for the glass. Which is the better explanation for the reach?
  (a) The belief, because it captures the common factor across all the different neural patterns that could have produced the reach.
  (b) The specific neural pattern, because only the specific physical details actually pushed the muscles.
  (c) Both are equally good; the belief describes the neural pattern at a higher level of detail.

