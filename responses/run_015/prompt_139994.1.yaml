  # PART TWO: LOGICAL SPACE AND SCORING KEY

  ## I. The Choice Points

  To locate your position, we must first map the logical terrain. There are four fundamental choice points regarding how the mental and physical relate in causation.

  **Choice Point 1: Physical Causal Completeness**
  *   **Complete:** Every physical event that has a cause has a sufficient physical cause. (The physical level is a closed system).
  *   **Incomplete:** Some physical events are not fully caused by prior physical events; there is room for non-physical influence.

  **Choice Point 2: Mental-Physical Distinctness**
  *   **Distinct:** Mental properties (like believing, feeling) are not identical to physical properties (like neural firing).
  *   **Non-Distinct:** Mental properties are identical to physical properties (or functional roles realized by them).

  **Choice Point 3: Causal Exclusion**
  *   **Exclusion Holds:** If a physical cause is sufficient, no distinct mental cause can also be a cause (they would be rivals).
  *   **Exclusion Fails:** A sufficient physical cause does not prevent a distinct mental cause from also being a cause (they can coexist or depend on one another).

  **Choice Point 4: The Nature of Causation**
  *   **Production:** To cause something is to physically produce or generate it (energy transfer, sufficiency).
  *   **Difference-Making:** To cause something is to make a difference to whether it occurs (counterfactual dependence).
  *   **Proportionality:** To cause something is to be the most appropriate level of description for the effect (not too specific, not too general).

  ## II. The Enumerated Space

  Combining these choice points creates a grid of possible positions. There are $2 \times 2 \times 2 \times 3 = 24$ theoretical cells. Not all are occupied by defended philosophical views.

