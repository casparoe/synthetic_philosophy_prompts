  ## III. Scoring Key

  To find your leaf, tally your answers according to the three groups below. Your dominant tendency in each group determines your coordinates in the Logical Space, which points to your Position.

  **Group A: Completeness (Questions 1, 2, 9)**
  *   **Mostly (a):** You lean toward **Incomplete**. (You think mental reasons can override or add to physical causes).
  *   **Mostly (b) or (c):** You lean toward **Complete**. (You think the physical level is sufficient).

  **Group B: Distinctness & Dependence (Questions 4, 5, 7, 8)**
  *   **Mostly (a):** You lean toward **Distinct & Independent**. (You think mental states can vary independently or exist in different substrates without being the same thing).
  *   **Mostly (b):** You lean toward **Non-Distinct or Dependent**. (You think mental states are tied tightly to physical states or are the same thing).
  *   **Mostly (c):** You lean toward **Distinct but Excluded**. (You think mental states are real but physically determined without causal power).

  **Group C: Causal Nature (Questions 3, 6, 10)**
  *   **Mostly (a):** You lean toward **Difference-Making or Proportionality**. (You value the explanatory power of the mental description).
  *   **Mostly (b):** You lean toward **Production or Identity**. (You value the physical mechanism as the true cause).
