      *   *The "Replacement" Intuition:* If I choose a policy that creates Person A (miserable) vs. Person B (happy), SRW says I wrong Person A. But if I choose a policy that creates Person C (miserable) instead of Person A (miserable), do I wrong Person C? If the obligation is to the *structure*, does it matter who fills it? If it *does* matter who fills it, how do we account for the fact that Person C wouldn't exist otherwise?
      *   *The "Non-Existence" Problem:* Can you wrong someone by bringing them into existence if their life is worth living, but not as good as it could have been? SRW says yes (via structure). But what if the life is barely worth living? SRW relies on a threshold. Where is the threshold justified?
