answer: |-
  ### Coding Protocol: Societal Disruption Decision Tree

  **Pre-Condition:** Coder must declare **Patient** (entity), **Territory**, and **Bandwidth** (window/generations). Disagreement here is recorded as metadata, not resolved by the tree.

  **Nodes (Evidence-Based):**
  1.  **Scale:** Did disruption affect >50% of the Patient's core units within the Territory? (Yes/No)
  2.  **Integration:** Did settlement hierarchy or exchange volume drop >50% within Bandwidth? (Yes/No)
  3.  **Legibility:** Did administrative script or metrological standards cease operation? (Yes/No)
  4.  **Welfare:** Did mortality/stature indicators worsen >20% within Bandwidth? (Yes/No)
  5.  **Register Adjudication:** If Integration and Welfare diverge, did Legibility fail? (Yes/No) *Prioritizes complexity loss.*
  6.  **Trough:** Did the system remain below 50% baseline complexity for >2 generations? (Yes/No)
  7.  **Recovery:** Was the prior configuration materially available to successors but not resumed? (Yes/No)
  8.  **Self-Description:** Do near-contemporary sources frame the event as a loss of order? (Yes/No)
  9.  **Discount:** Are those sources authored by successor elites claiming legitimacy via rupture? (Yes/No)

  **Leaves (Logical Space):**
  1.  **Irreversible Collapse:** Nodes 2/3/5 Yes, 6 Yes, 7 No. *Commitment:* Complexity loss is permanent due to material constraint. *Awkward Consequence:* Includes cases where welfare improved post-collapse.
  2.  **Chosen Transformation:** Nodes 2/3/5 Yes, 6 Yes, 7 Yes. *Commitment:* Successors could rebuild but opted for new systems. *Awkward Consequence:* Labels successful adaptation as a form of collapse.
  3.  **Resilience:** Nodes 2/3 Yes, 6 No. *Commitment:* System absorbed shock within Bandwidth. *Awkward Consequence:* Severe short-term suffering counts as a non-event.
  4.  **Welfare Crisis:** Nodes 2/3 No, 4 Yes. *Commitment:* People suffer, structures hold. *Awkward Consequence:* Stable tyrannies are not collapses.
  5.  **Near Miss:** Node 1 No. *Commitment:* Disruption too localized to meet Patient threshold. *Awkward Consequence:* Local catastrophes are invisible if Patient is large.
  6.  **Elite Myth:** Nodes 2/3 No, 8 Yes, 9 Yes. *Commitment:* Rupture is propaganda. *Awkward Consequence:* Truth is dismissed as legitimacy claims.
  7.  **Unoccupied (Growth/Suffering):** Nodes 2/3 No (Up), 4 Yes. *Diagnosis:* Unattractive but possible (e.g., pyramid building).
  8.  **Unoccupied (Simplification/Health):** Nodes 2/3 Yes, 4 No, 5 No. *Diagnosis:* Unexplored; implies complexity loss without bio-stress or legibility loss.

  **Indistinguishable Leaves:** The tree cannot separate **Irreversible Collapse** from **Chosen Transformation** if material availability (Node 7) is ambiguous. This is a feature, not a defect; it flags evidentiary gaps.

  **Collapse Averted:** This is not a genuine leaf. It maps to **Resilience** (Node 6 No) or **Near Miss** (Node 1 No). Treating it as a distinct leaf would be mis-specification, conflating outcome with counterfactual.

  ---

  ### Validation

  **Episode A (Eastern Mediterranean, 1200 BCE)**
  *   **Patient:** Palace States (Mycenaean/Hittite). **Bandwidth:** 200 years.
  *   **Path:** 1-Yes (Centres stop), 2-Yes (Settlement count falls), 3-Yes (Linear B lost), 4-Yes (Population falls), 5-Yes (Legibility fails), 6-Yes (Centuries), 7-No (Polis distinct), 8-No (Dark age), 9-N/A.
  *   **Verdict:** **Irreversible Collapse.**
  *   **Justification:** Administrative complexity lost permanently without resumption.
  *   **Disagreement:** Coders may dispute Node 4 (Welfare severity) due to sparse bio-archaeology.

  **Episode B (Southern Maya, 800–950 CE)**
  *   **Patient:** Southern Lowland Divine Kingship. **Bandwidth:** 150 years.
  *   **Path:** 1-Yes (South empties), 2-Yes (Monuments stop), 3-Yes (Script ends), 4-No (North flourishes), 5-Yes (Legibility fails in South), 6-Yes (South empty), 7-No (North different), 8-N/A, 9-N/A.
  *   **Verdict:** **Irreversible Collapse** (of Patient).
  *   **Justification:** Specific institutional patient ceased permanently despite regional continuity.
  *   **Disagreement:** Coders may dispute Patient declaration (Kings vs. Maya People). If Patient = Maya People, Node 1 becomes No (Near Miss). This validates Constraint 1.

  **Episode C (USSR, 1991)**
  *   **Patient:** Union State/Command Economy. **Bandwidth:** 30 years.
  *   **Path:** 1-Yes (State dissolves), 2-Yes (Plan dismantled), 3-Yes (Party apparatus ends), 4-Yes (Life expectancy falls), 5-Yes (Legibility fails), 6-Yes (No return), 7-Yes (Reunification possible but declined), 8-Yes (Loss framed), 9-Yes (Successor elites).
  *   **Verdict:** **Chosen Transformation.**
  *   **Justification:** Prior configuration available but explicitly not resumed by successors.
  *   **Disagreement:** Coders may dispute Node 7 (Was reunification materially possible?). If No, verdict shifts to **Irreversible Collapse**.

  **Analysis of Disagreement:**
  Disagreement on A is evidentiary (Welfare). Disagreement on B is conceptual (Patient definition). Disagreement on C is counterfactual (Recovery availability). The tree isolates these: A is a data problem, B is a scope problem, C is a theoretical problem. This is a real feature of the concept, not a defect in the tree. The instrument successfully prevents averaging these distinct uncertainties.

  **Attribution Note:** The "Reversible-but-not-reversed" test resembles arguments by Joseph Tainter (verify *The Collapse of Complex Societies*). The "Legibility" register echoes James C. Scott (verify *Seeing Like a State*). These attributions should be verified against your specific theoretical framework.
