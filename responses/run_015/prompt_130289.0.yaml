      *   **Levelling-Down Objection (LDO):** Critiques Prioritarianism/ Egalitarianism. If inequality is bad in itself, a world where everyone is worse off but equal is better in one respect than a world where some are better off. Prioritarianism avoids the strict LDO because it cares about absolute levels weighted by priority, not equality *per se*. However, the prompt suggests Colleague 2 claims Prioritarianism is refuted by LDO. Technically, LDO targets Egalitarianism, but often gets conflated with Prioritarianism in casual debate. Strict Prioritarianism (Parfit style) is *not* subject to LDO because it is person-affecting in a weighted sum way. However, the prompt asks me to analyze the colleague's claim within the context.
