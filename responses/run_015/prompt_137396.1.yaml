answer: |-
  This is a sophisticated position. You have effectively adopted the **Unjust Enrichment (UE)** model of climate justice, which is philosophically more robust against the non-identity problem than the **Polluter Pays** (harm-based) model. You are right that it avoids the "my grandad didn't know" objection by focusing on the *retention of benefits* rather than the *commission of wrongs*.

  However, you are also right to worry that you have insulated the view too well. A theory that explains why *some* rich people owe *something* but cannot specify *how much* or *why specifically to whom* risks becoming a moral Rorschach test.

  Here is the breakdown of what counts against your view, ranked from fatal to awkward, distinguishing between internal concessions (a) and external critiques (b).

  ### 1. The "Net-Negative Enrichment" Problem (Fatal, Internal)
  **Type:** (a) What a holder should concede is a real problem.
  **Why it ranks first:** This attacks the empirical premise required for the duty to trigger at all.

  Your view relies on the claim that citizens of rich nations are *net* enriched by historical emissions. But enrichment is a balance sheet. It is Benefits (cheap energy, infrastructure, capital accumulation) minus Costs (climate damages, adaptation costs, stranded assets).

  If the present value of climate damages already incurred by rich nations (flood defenses, insurance spikes, agricultural loss, heat mortality) exceeds the historical GDP boost provided by cheap fossil fuel, **the net enrichment is zero or negative.**

  *   **The Consequence:** On your own terms, if the UK or EU is already paying more to clean up the mess than they gained from making it, the duty of disgorgement vanishes. You cannot disgorge a loss.
  *   **Why it's fatal:** It makes the obligation contingent on complex economic modeling that is likely to fluctuate. If a hurricane hits Miami, the "unjust enrichment" of the US drops. This makes the moral duty volatile and potentially non-existent exactly when action is most needed.
  *   **Does it collapse?** It risks collapsing into **None**, or it forces you to subsidize the calculation with a "global" ledger, which pushes you back toward a collective responsibility model you tried to avoid.

  ### 2. The "License to Harm" / Motive Decoupling (Fatal, Internal)
  **Type:** (a) What a holder should concede is a real problem.
  **Why it ranks second:** You explicitly stated this would move you personally.

  You noted: *"it isn't obviously a duty to mitigate anything going forward. Paying back and stopping are different duties."*
  This is the strongest internal coherence point, but it is also the strongest practical defeater. UE is backward-looking. It treats carbon emissions as a *resource extraction* issue (you took something without paying) rather than a *waste disposal* issue (you filled a sink beyond capacity).

  *   **The Consequence:** On your view, a wealthy actor is morally permitted to continue emitting at high levels *provided they pay the disgorgement fee.* If I can afford to pay the "enrichment value" of my private jet fuel, I am compliant.
  *   **Why it's fatal:** Climate change is non-linear. There are tipping points where money cannot repair the harm (e.g., ice sheet collapse). A theory that permits payment in lieu of cessation fails to account for physical thresholds where the "benefit" becomes irrelevant because the system has collapsed. It treats the atmosphere as a commodity to be bought, not a shared condition to be maintained.
  *   **Motive Check:** You asked if this gives anyone a reason to stop emitting. The answer is **no**, not on this view alone. It gives a reason to *account* for emissions, but not to *reduce* them, unless reduction is cheaper than disgorgement. If you care about the physical outcome, this view is insufficient.

  ### 3. The Counterfactual Indeterminacy (Serious, Internal)
  **Type:** (a) What a holder should concede is a real problem.
  **Why it ranks third:** It threatens to make the view unfalsifiable in the way you feared.

  To calculate "enrichment," you need a baseline: *What would my wealth be without the fossil subsidy?*
  There is no agreed-upon economic model for this. Any estimate requires assumptions about technological substitution (would we have gone nuclear? renewables?) and global trade dynamics.

  *   **The Consequence:** Because the counterfactual is unknowable, "enrichment" becomes a placeholder for "whatever amount feels politically salient."
  *   **The Collapse:** This is where your view likely collapses into **Ability to Pay**. In practice, when people calculate unjust enrichment in climate contexts, they often use the difference in GDP between Global North and South as a proxy for "enrichment." But GDP difference is just a measure of current capacity. If you default to "rich people pay because they are rich," you have abandoned the specific moral mechanism of *unjust enrichment* and adopted *ability to pay*.
  *   **Why that's bad news for you:** You chose UE to avoid the "collective guilt" or "taxation" vibe of Ability to Pay. You wanted a specific *transactional* justice (returning stolen goods). If the calculation is impossible, you aren't returning stolen goods; you're just taxing the rich. The specific moral force you sought is lost.

  ### 4. The Recipient Mismatch (Awkward, External)
  **Type:** (b) What only a critic would say (but you should worry about).
  **Why it ranks fourth:** It doesn't break the duty to pay, but it breaks the link to *loss-and-damage*.

  UE explains why *you* owe. It does not explain why *a farmer in Pakistan* is entitled to *your* committee's surplus.
  In law, unjust enrichment requires a correspondence between the defendant's gain and the plaintiff's loss. But the farmer in Pakistan didn't lose the specific capital your university gained. They suffered *harm*, not *deprivation of your enrichment*.

  *   **The Consequence:** To justify paying *this* specific fund to *these* specific victims, you need to smuggle in a harm-based principle anyway. You need to say, "We are disgorging this enrichment *into a fund that repairs harm*."
  *   **Why you can shrug:** You can argue the duty is to the "global poor" as a class, not specific individuals. But this weakens the "loss-and-damage" framing. It becomes "development aid funded by disgorgement." If your committee's mandate is specifically *loss-and-damage* (repairing specific harms), UE is a mismatched justification.

  ### 5. The "Benefit" Definition Problem (Awkward, Internal)
  **Type:** (a) What a holder should concede.
  **Why it ranks fifth:** It complicates the "individualized liability" point you like.

  You argue that recent arrivals owe nothing because they inherited none of it. But benefits are not just capital; they are **systems**.
  A recent immigrant to the UK benefits from the National Grid, the road network, and the legal system—all built on fossil capital. Even if they brought no money, they are consuming infrastructure paid for by historical carbon.

  *   **The Consequence:** If "benefit" includes *consumption of infrastructure*, then recent arrivals *are* enriched, just like native-born citizens. This undermines your point that "some recent arrivals... owe nothing at all."
  *   **Why it's awkward:** It forces you to define enrichment so narrowly (only inherited financial capital?) that it ignores the structural advantages of living in a developed state. If you widen it to include structural advantages, you are back to collective responsibility for living in a place.

  ---

  ### On Your "Unfalsifiable" Worry

  You asked: *"I have a nagging feeling that 'the enrichment is whatever it turns out to be' plus 'some people owe nothing' is exactly the kind of pair of qualifications that makes a view impossible to criticise."*

  **You are correct.**
  Currently, your view is protected by two shields:
  1.  **Epistemic Shield:** "We can't know the exact number, so any reasonable estimate stands."
  2.  **Ontological Shield:** "If you didn't inherit it, you don't owe it."

  This makes the view resilient to attack but weak in guidance. For a committee decision, this is dangerous. If you cannot define the *method* for calculating the number, the number you write down is arbitrary. If it is arbitrary, it is not justice; it is charity.
  **The Fix:** You must commit to a *methodology* for estimating enrichment (e.g., "X% of our endowment growth correlates with fossil-intensive sectors"). If you refuse to commit to a method, the view is indeed unfalsifiable and practically useless for your specific task.

  ### On the Motive Argument

  You said: *"If it turns out that on my view nobody has any reason to stop emitting and every reason to just write cheques, I'll probably drop it."*

  **Honest Answer:** On the Unjust Enrichment view alone, **you have no reason to stop emitting.** You only have a reason to *pay for the privilege of emitting.*
  If the goal of the committee is to contribute to a solution that prevents *future* harm, UE is the wrong tool. UE is about cleaning up the past. If you write the cheque based on UE, you have discharged your moral duty regarding the *past*, even if the university continues to invest in fossils tomorrow.
  If you want the payment to signal or enforce a change in future behavior, you must hybridize your view. You need UE to justify the *amount* (backward-looking) and a separate principle (e.g., "Do No Harm") to justify the *conditionality* (forward-looking).

  ### Summary of Risks

  1.  **Collapse Risk:** High. Without a rigorous counterfactual model, "Unjust Enrichment" defaults to "Ability to Pay."
  2.  **Motive Risk:** High. It decouples payment from mitigation.
  3.  **Existential Risk:** High. It assumes the system is stable enough for money to matter.

  ### Confidence Levels

  *   **Confidence that UE decouples payment from mitigation (Motive Risk):** 95%. This is a structural feature of backward-looking theories.
  *   **Confidence that UE collapses into Ability to Pay without strict counterfactuals:** 85%. Economic modeling of "what if" is notoriously pliable.
  *   **Confidence that Net-Negative Enrichment is a fatal internal defeater:** 70%. This depends on empirical economic data regarding domestic climate costs vs. historical gains, which is contested.
  *   **Confidence that Recipient Mismatch is a fatal flaw:** 40%. You can argue for a "class-based" recipient (the global poor) without needing specific harm linkage.

  ### The Point I Am Least Sure About

  I am least sure about the **Net-Negative Enrichment** claim (Point 1).
  I am confident that *if* net enrichment is negative, your theory collapses. I am **not** confident that net enrichment *is* negative for the UK/EU. While climate costs are rising, the historical capital accumulation from the Industrial Revolution is compounded over 200 years. It is an empirical open question whether the "dividend" from cheap energy currently outweighs the "debit" from climate adaptation in rich nations. If the dividend still outweighs the debit, this defeater fails. You should check the latest Stern Review or similar economic models on "GDP at risk" vs. "Historical Fossil Contribution."

  **Recommendation for the Committee:**
  If you use this justification, explicitly pair it with a forward-looking commitment. *"We are paying this sum as disgorgement of historical benefit, **conditional on** the understanding that this does not license future inaction."* This patches the Motive Risk without abandoning your core philosophical stance.
