  ### Part 1: Mentor Feedback & Brainstorming

  Right, let's have a proper look at this. You've got a genuinely sharp instinct here. The conflation of metaphysical claims (what *is*) with normative claims (what *binds*) is a classic philosophical error, and spotting it in the moral psychology literature is a strong move for a third-year paper. It moves you beyond simply summarising Haidt or Henrich and into actual philosophical critique.

  However, I need to push back on one specific point before you lock this in, because it could sink the project if you aren't careful.

  **The Pushback:**
  You suggest that non-WEIRD populations might separate these concepts (binding but not mind-independent), while WEIRD populations conflate them. Be very cautious about attributing sophisticated metaethical distinctions to folk intuitions without evidence. It is equally likely that *nobody* distinguishes them conceptually, but that the *researchers* are misinterpreting the data because they assume a Western metaethical framework.

  If you argue that "Balinese people distinguish ontological objectivity from normative authority," an examiner might ask: "Do they? Or is that just your philosophical gloss on their behaviour?"

  **The Fix:**
  Frame the distinction as an *analytical tool* for us (the philosophers/psychologists) to interpret the data, rather than claiming it is necessarily a conscious distinction in the minds of the subjects. Your argument should be: "The current literature assumes that if a culture treats a norm as universally binding, they must believe it is mind-independent. I argue this is a category error. We can make sense of the anthropological data *better* if we decouple these two variables."

  **Scope Check:**
  5,000 words is tight. You cannot survey all of moral psychology. You need to pick a specific lane. I recommend focusing on the 'Purity/Sanctity' foundation (e.g., incest taboos or food restrictions). This is where the WEIRD/non-WEIRD divide is starkest. If you try to cover Harm, Fairness, Loyalty, Authority, *and* Purity, you will run out of space to do the philosophical heavy lifting.

  **Verdict:**
  The distinction holds water. In metaethics, this maps roughly onto the difference between **Moral Realism** (truth-apt, mind-independent facts) and **Moral Universalism** (norms that apply to all agents). Psychological operationalisations of 'objectivity' often measure the latter but label it the former. Exposing this is a viable, passable, and potentially high-scoring project.

  Below is the formal proposal, written in British English, ready for you to adapt and submit.

  ***

  ### Part 2: Term Paper Proposal

  **Title:** Beyond the Objectivity Trap: Decoupling Mind-Independence and Universal Authority in Cross-Cultural Moral Psychology

  **Student Name:** [Your Name]
  **Course:** Moral Psychology and Cross-Cultural Ethics
  **Word Count Target:** 5,000 words

  #### 1. Abstract
  This paper proposes a conceptual re-evaluation of the 'WEIRD' (Western, Educated, Industrialised, Rich, Democratic) critique in moral psychology. Current literature frequently interprets cross-cultural variations in moral 'objectivity' as evidence for or against moral realism. I argue that this debate is stalled by a conflation of two distinct notions: *ontological objectivity* (mind-independence of moral facts) and *normative universality* (the binding authority of norms across contexts). By disentangling these concepts, this paper will demonstrate that non-WEIRD moral intuitions—specifically regarding purity and sanctity—can be interpreted as asserting universal authority without committing to mind-independent truth. This philosophical clarification resolves apparent contradictions in anthropological data without necessitating new empirical fieldwork.

  #### 2. Research Question
  The primary research question is: **Does the conflation of mind-independence and universal authority in moral psychology obscure the structure of non-WEIRD moral intuitions?**

  Sub-questions include:
  1.  How is 'moral objectivity' operationalised in contemporary experimental philosophy and moral psychology?
  2.  Can a distinction between truth-tracking (metaphysical) and authority-tracking (normative) attitudes explain existing cross-cultural data regarding purity violations?
  3.  Does decoupling these notions allow for a defence of moral objectivity that is compatible with cultural variation?

  #### 3. Background and Problem Statement
  Since Henrich et al.'s (2010) seminal paper on the WEIRD problem, it has been established that Western populations are outliers in moral reasoning, particularly regarding individualism and the weighting of moral foundations (Haidt, 2012). A significant sub-debate concerns 'moral objectivity'. Studies often ask participants whether a moral violation (e.g., incest) would still be wrong if everyone agreed it was permissible. Affirmative answers are coded as 'objectivist'.

  The problem is that 'objectivity' is doing double-duty in these analyses.
  1.  **Mind-Independence:** The claim that moral truths exist independently of human belief (a metaphysical claim).
  2.  **Universal Authority:** The claim that a norm binds agents regardless of their cultural context or personal agreement (a normative claim).

  In Western, secular contexts, these often travel together. If I believe incest is objectively wrong, I likely believe it is wrong 'in the universe' and wrong for everyone. However, in many non-WEIRD contexts, norms are binding because of social cohesion, ancestral tradition, or divine command, which may be treated as socially constructed yet non-negotiable.

  Current literature tends to treat a rejection of mind-independence as a slide into relativism. This creates a false dichotomy: either moral facts are mind-independent (Realism) or they are merely cultural preferences (Relativism). This overlooks the possibility of **Constructivist Universalism**: norms that are human-made but claim universal authority within a form of life. By failing to distinguish these, researchers may mischaracterise non-WEIRD populations as 'less objectivist' or 'more relativist' when they are actually operating with a different metaethical framework.

  #### 4. Methodology and Approach
  This project is a work of conceptual analysis applied to empirical literature. It will not involve original data collection or fieldwork. The methodology proceeds in three stages:

  **Stage 1: Conceptual Analysis (Approx. 1,500 words)**
  I will delineate the distinction between Mind-Independence (MI) and Universal Authority (UA). I will draw on metaethical distinctions between Cognitivism/Non-Cognitivism and Realism/Expressivism, but adapt them for psychological application. The goal is to show that one can consistently hold UA without MI (e.g., 'This rule binds us all because it constitutes our community, even if we made the rule').

  **Stage 2: Re-interpretation of Empirical Data (Approx. 2,500 words)**
  I will apply this framework to existing studies on moral foundations, focusing specifically on the Purity/Sanctity foundation. This is the most culturally variable domain and the most likely to exhibit the MI/UA split.
  *   *Case Study:* I will examine data regarding incest taboos and food restrictions in traditional societies (drawing on anthropological interpretations by scholars such as Shweder or Rozin, as cited in psychological literature).
  *   *Analysis:* I will argue that when non-WEIRD participants treat these violations as 'objective', they are often signalling UA (social non-negotiability) rather than MI (Platonic truth). Conversely, when WEIRD participants reject purity norms, they may be rejecting MI, but the literature codes this as a loss of moral seriousness.

  **Stage 3: Implications for Moral Theory (Approx. 1,000 words)**
  I will conclude by assessing what this means for the realism/relativism debate. If the distinction holds, the 'challenge' from cultural variation is less threatening to moral objectivity than assumed, provided we define objectivity as normative bindingness rather than metaphysical independence.

  #### 5. Expected Outcomes and Success Conditions
  **Successful Result:**
  A successful paper will produce a framework that sorts moral disagreements into 'truth-tracking' types (disagreements about facts) and 'authority-tracking' types (disagreements about jurisdiction or bindingness). It will demonstrate that at least one major strand of cross-cultural data is currently misinterpreted due to the MI/UA conflation. The paper will successfully argue that acknowledging this distinction allows for a more nuanced moral psychology that does not force non-Western intuitions into a Western realist/relativist binary.

  **Failure Conditions:**
  The project would fail if:
  1.  The distinction between MI and UA collapses under scrutiny (e.g., if it is shown that folk concepts of 'authority' necessarily entail 'mind-independent facts' in all cultures).
  2.  The scope becomes too broad, attempting to cover all moral foundations rather than focusing on Purity/Sanctity.
  3.  The paper devolves into a mere summary of the WEIRD critique without adding the proposed philosophical value.

  #### 6. Feasibility and Timeline
  The project is designed to be completed within a 12-week semester without primary research.

  *   **Weeks 1-3:** Literature review. Focus on operationalisations of 'objectivity' in moral psychology (e.g., Goodwin & Darley; Wright et al.) and metaethical distinctions in objectivity.
  *   **Weeks 4-6:** Drafting the conceptual framework (Stage 1). Refining the definitions of MI and UA to ensure they are psychologically plausible.
  *   **Weeks 7-9:** Drafting the data re-interpretation (Stage 2). Selecting specific case studies from the course reading list to apply the framework.
  *   **Weeks 10-11:** Drafting implications and conclusion (Stage 3). Ensuring the argument ties back to the initial research question.
  *   **Week 12:** Editing and polishing. Ensuring British English conventions and checking citation style.

  **Risk Management:**
  The primary risk is that the philosophical distinction is too technical for the psychological data. To mitigate this, I will ground the definitions in concrete examples (e.g., 'Is this wrong if the ancestors didn't say so?' vs 'Is this wrong even if the ancestors said it was okay?') rather than abstract metaethical jargon. I will also limit the scope to the Purity foundation to ensure depth over breadth within the 5,000-word limit.

  #### 7. Conclusion
  This paper addresses a gap in the intersection of moral psychology and metaethics. By clarifying the concept of 'objectivity', it offers a way to respect cross-cultural differences without abandoning the possibility of robust moral norms. It is a feasible, text-based project that leverages philosophical training to critique empirical assumptions, fitting the requirements of the course and the semester timeline.
