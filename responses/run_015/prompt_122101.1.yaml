answer: |-
  **Project Title:** The Composition Problem: Do Effective Altruism's Critiques Cohere?

  **The Question**
  Critics of Effective Altruism (EA) typically advance three objections: (1) the **Structural Critique** (EA ignores systemic political/economic causes); (2) the **Replaceability Critique** (earning-to-give assumes labor markets are fixed); and (3) the **Measurability Bias** (EA favors quantifiable, short-term interventions). While these are well-trodden individually, no one has tested whether they *compose*.

  My hypothesis is that (1) and (3) are in tension. The Structural Critique demands funding diffuse, systemic work; the Measurability Critique argues EA *cannot* fund such work because it resists quantification. If a critic presses both, they owe an account of how to rank systemic interventions without smuggling measurement back in. This project asks: **Do the standard critiques of EA form a coherent alternative framework, or do they mutually undermine one another?** The answer could be "they cohere," "they conflict," or "the conflict reveals a deeper problem in how we evaluate social change." I will not presuppose the verdict.

  **Methodology & Timeline (6 Months, 50% Time)**
  I will avoid abstract normative argumentation and pure empirical auditing. Instead, I will use three **worked conceptual cases** representing different points on the measurable/systemic axis:
  1.  **Direct Delivery:** (e.g., bednet distribution). High measurability, low structural change.
  2.  **Policy Reform:** (e.g., tax advocacy). Medium measurability, medium structural change.
  3.  **Field Building:** (e.g., AI safety research). Low measurability, high long-term structural impact.

  I will run each case through a "battery" of two novel tests derived from my prior reporting:
  *   **The Universalization Test:** Does the rationale for the intervention hold if everyone acts on it? (e.g., Earning-to-Give premises may collapse under universalization; bednet purchases do not).
  *   **The Endogenous Measurability Test:** Does the metric drift because it was selected for? (e.g., does funding "countable" outcomes change the nature of the outcome?).

  **Month 1:** Refine the "battery." Interviews with 3-4 key theorists (both EA and critics) to stress-test the definitions of universalization and endogeneity.
  **Month 2-3:** Apply the battery to the three cases. This involves reviewing internal documentation, public post-mortems, and interviewing practitioners involved in these specific intervention types.
  **Month 4:** Synthesis. Determine if the battery returns consistent verdicts or merely redescribes the interventions in new vocabulary.
  **Month 5-6:** Drafting deliverables.

  **Why Case Studies?**
  A straight philosophical argument risks becoming untethered from how giving decisions are actually made. An empirical audit of funding flows is impossible at this timescale and wouldn't answer the *logical* question of coherence. Case studies allow me to locate the friction where theory meets practice. They force the abstract critiques to contend with specific causal claims.

  **Deliverables**
  1.  **A Long-Form Feature:** (6,000–8,000 words) for a general-interest magazine. The narrative will follow the investigation into the "Composition Problem," suitable for a lay audience interested in philanthropy and ethics.
  2.  **A Stress-Test Checklist:** A one-page practical tool for program officers and donors. It will list questions derived from the Universalization and Endogenous Measurability tests to be applied to potential grants.

  **Why Fund a Journalist?**
  Philosophers excel at determining what *ought* to be true; journalists excel at tracing what happens when people *act* on what they believe is true. This project is not about solving the normative ethics of EA, but about auditing the *rhetorical and practical stability* of the movement's internal and external debates. A philosopher might resolve the tension theoretically; a journalist will reveal whether the tension breaks the machine. I bring five years of beat reporting context, access to practitioners who speak off-record, and the ability to translate high-level conceptual friction into public accountability.

  **Feasibility & Failure Conditions**
  **Feasibility:** Six months at 50% time (approx. 3 months FTE) is tight. To succeed, I must treat the cases as *conceptual* archetypes rather than conducting deep empirical audits of specific organizations. If I attempt to measure actual funding drift empirically, I will fail. I will limit interviews to those who can speak to the *logic* of the intervention, not just its operations. If necessary, I will cut the "Policy Reform" case to ensure depth on the other two.
  **Failure:** The project fails if I find that the critiques *do* compose neatly (i.e., critics already have a robust answer for ranking unmeasurable systemic change) or if the "tension" proves to be merely semantic. It also fails if the "battery" turns out to be a restatement of existing collective action problems without adding analytical leverage.

  **Risks to Framing: Where I Might Be Wrong**
  I am entering this assuming the three critiques are distinct enough to test for composition. A smart EA defender could argue that I am attacking a straw man: modern EA already acknowledges measurement limits and uses "proxy metrics" for structural work, meaning Critique (3) is outdated. If I find that EA funds have already integrated structural metrics robustly, the tension dissolves.

  Furthermore, the **Structural Critique (1)** is the most likely to collapse under scrutiny. It is often a "vibe" rather than a rigorous alternative decision procedure. If I cannot find a critic who can articulate *how* to choose between two systemic interventions without using expected value calculations, the "Composition Problem" vanishes because one leg of the stool is missing.

  Finally, I must remain open to the possibility that **Endogenous Measurability** is not a bug but a feature. If I find that "metric drift" actually corrects organizational behavior toward efficiency in a way that outweighs the loss of fidelity to the original goal, my critique of measurability weakens. I will change my mind if I encounter a framework for ranking systemic interventions that is both rigorous and explicitly non-quantitative. If such a framework exists and is in use, my central question is answered, and the focus must shift to why it isn't more widely adopted.
