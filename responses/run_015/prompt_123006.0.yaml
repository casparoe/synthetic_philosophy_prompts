  my study partner tried explaining logical omnisicence to me and said its the problem that in modal epistemic logic if an agent knows P they automatically know every tautology that follows, which makes knowledge unrealistic since real people dont deduce everything. he said philosophers solved it by using neighborhood semantics with awareness filters that block consequences the agent hasnt explicitly computed, and that this is basically identical to the frame problem in AI where robots cant track all side-effects of actions. he also said this means standard Kripke models are useless for AI planning now. is this summary actually fair? like which parts are legit philosophy of logic vs just mixing up different fields, and does the solved part hold up or is it still an open issue?
