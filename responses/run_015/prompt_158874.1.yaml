answer: |-
  Your suspicion is well-founded. The summary you encountered is not merely simplified; it contains a significant philosophical error regarding the distinction between the two theories, and its claim that the positions have been 'refuted' is an overstatement that would be contested by many contemporary epistemologists.

  Here is a breakdown of what is accurate, what is confused, and how your own concept of 'diegetic encroachment' fits into the landscape.

  ### 1. Correcting the Record: Contextualism vs. Encroachment

  The essay's claim that the two theories 'come to much the same thing' is a common heuristic, but the mechanism it describes for each is muddled.

  **Epistemic Contextualism**
  *   **What the essay got right:** It correctly identifies that Contextualists believe the word 'knows' shifts its meaning (or semantic content) depending on the conversational context.
  *   **The mechanism:** In Contextualism (championed by philosophers like Keith DeRose and David Lewis), the standard for knowledge is set by the **attributor** (the speaker). If I am speaking casually, I can truly say, 'She knows the bank is open.' If I am speaking in a high-stakes philosophical seminar, the word 'knows' demands more evidence, and the same sentence might be false.
  *   **The essay's error:** The essay implies the stakes of the *subject* (the woman with the house) change the meaning. Strictly speaking, Contextualism says the stakes of the *conversation* change the meaning. The woman's stakes only matter insofar as they raise the salience of error in the *speaker's* context.

  **Pragmatic Encroachment**
  *   **What the essay got wrong:** The essay states that encroachment holds that 'the operative stakes are those of whoever is doing the attributing'. This is incorrect.
  *   **The mechanism:** Pragmatic Encroachment (defended by Jason Stanley, Jeremy Fantl, and Matthew McGrath) is a form of **Invariantism**. It holds that the meaning of 'knows' does not shift. Instead, whether a subject *actually knows* depends partly on the **subject's own practical stakes**.
  *   **The correction:** Under encroachment, if the sister faces losing her house, she requires more evidence to *know* the letter is a forgery than if she were merely curious. This is a fact about her mind and her situation, not a semantic shift in the narrator's word choice. The essay conflated encroachment with contextualism here.

  **The Claim of Refutation**
  *   **Verdict:** Overstated. It is true that 'Traditional Invariantism' (the idea that knowledge depends *only* on truth, belief, and justification/evidence) remains the dominant view. However, to say Contextualism and Encroachment have been 'refuted' and are 'no longer defended' is false. They are live, vigorously debated positions. Jason Stanley's *Knowledge and Practical Interests* (2005) sparked a revolution that is still being processed. They are minority views, but they are not dead.

  ### 2. Evaluating 'Diegetic Encroachment'

  Your proposal—that in fiction, a knowledge attribution answers to the practical situation of the character it is about—is philosophically coherent and, interestingly, aligns much more closely with **Pragmatic Encroachment** than with Contextualism.

  Here is why your intuition works, and where the philosophical theories support it.

  **Why it is not a confusion**
  In standard Contextualism, if the narrator (the attributor) is in a low-stakes situation (e.g., recalling the event safely from the future), the standard for 'knows' should be low. If the essay's summary were correct, your line 'she knew the letter was a forgery' should remain true, because the narrator's stakes are low.

  However, you want the line to feel *false* because the *sister's* stakes were high. This is precisely what Pragmatic Encroachment predicts. Encroachment argues that knowledge is sensitive to the subject's practical environment. Since the sister is the subject of the knowledge attribution, her stakes determine whether she occupies the state of 'knowing'.

  **The Fictional Twist**
  You are effectively applying Subject-Sensitive Invariantism (another name for Encroachment) to the ontology of fiction.
  1.  **The Subject:** The sister.
  2.  **The Stakes:** The consequences within the diegesis (the story world).
  3.  **The Truth Condition:** Whether the proposition 'She knew' is true *in the story*.

  If the story establishes that the sister's life depended on the letter being genuine, her evidence (perhaps a hunch or a partial recognition) may suffice for 'belief' but fails to suffice for 'knowledge'. When your narrator says, 'She knew,' the reader, sensing the high stakes, recognises an irony or a falsehood. The narrator is using the word loosely; the reality of the story contradicts it.

  **Does it survive the corrected theories?**
  Yes. In fact, correcting the essay's error strengthens your position. The essay claimed encroachment makes knowledge depend on 'who happens to be talking about them'. If that were true, your project would be difficult, because the narrator is the one talking. But since encroachment actually makes knowledge depend on the *subject's* stakes, it grants you exactly the leverage you want: the sister's internal crisis determines the truth of the narrator's claim.

  ### 3. Advice for the Novel

  You can proceed with 'diegetic encroachment' as a coherent narrative device. It is not resting on a philosophical confusion; rather, it is a sophisticated application of a specific epistemological view to literary truth.

  To make this land effectively for the reader, consider the following:

  *   **The Shift in Evidence:** Ensure the sister's *evidence* remains constant while her *stakes* rise. If she gets new evidence, the reader will attribute the loss of knowledge to the evidence, not the stakes. For the encroachment effect to work, she must have the same information at the low-stakes moment as she does at the high-stakes moment, yet the reader must feel she crosses a threshold from 'knowing' to 'guessing' purely because the cost of being wrong has become catastrophic.
  *   **The Narrator's Reliability:** Since you are using a first-person narrator recalling the past, you have a layer of protection. The narrator can say, 'I told myself she knew,' or simply, 'She knew.' If the latter, the reader's realisation that she *could not* have known (given the stakes) creates a gap between the narrator's understanding and the story's truth. This gap is a powerful engine for dramatic irony.
  *   **Terminology:** You need not use the term 'diegetic encroachment' in the text, of course. But conceptually, you are treating 'knowledge' in the novel not as a static mental state, but as a status that can be revoked by pressure. This is a profound theme for a novel about guilt and memory.

  ### Summary

  The essay you read conflated the mechanisms of Contextualism and Pragmatic Encroachment and prematurely declared them dead. Your intuition is more accurate than the essayist's.

  *   **Contextualism:** 'Knows' changes meaning based on the *speaker's* context. (Less useful for your specific aim).
  *   **Pragmatic Encroachment:** 'Knows' keeps its meaning, but whether one *knows* depends on the *subject's* stakes. (This supports your aim perfectly).
  *   **Diegetic Encroachment:** A coherent extension of Pragmatic Encroachment to fiction. It posits that fictional truth conditions for knowledge claims are sensitive to the character's practical environment.

  You are on solid ground. The philosophical machinery exists to support the emotional arc you are designing.
