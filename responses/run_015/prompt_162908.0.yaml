  ### The Scenario: The Executor's Bequest

  **The Setup:** Your Uncle Arthur passed away. His estate is managed by Martha, his old business partner, who knows you well (she's right about your choices ~80% of the time). There is a $50,000 trust bequest intended for you. However, Arthur left a sealed addendum: if Martha predicted you would act "generously" regarding the estate's administrative costs, the full $50,000 is released immediately. If she predicted you would act "selfishly," the funds are tied up in probate for years (effectively $0 value to you now). Martha made her prediction yesterday and filed the paperwork. Today, you face a binary choice: pay a $5,000 administrative fee to help the estate (Generous) or waive it and keep the cash for yourself (Selfish). You cannot precommit; Martha is gone; the prediction is fixed.

  **Version A (High Similarity):** Martha's prediction was based on a simulation of your *current reasoning process*. She asked herself, "Knowing how he thinks about family duty *right now*, what will he decide?" Her 80% accuracy comes from modeling your algorithm.
  **Version B (Low Similarity):** Martha's prediction was based on *historical data*. She asked herself, "How did he handle allowance money when he was 15?" Her 80% accuracy comes from statistical regularity in your past behavior, not your current reasoning.

  ***

  ### The Analysis

  Here is the expected utility (EU) arithmetic for each theory.
  *   **Stakes:** $50,000 (Reward) vs. $5,000 (Cost).
  *   **Net Payoff if Reward Released:** $45,000 (Pay) vs. $50,000 (Don't Pay).
  *   **Net Payoff if Reward Locked:** -$5,000 (Pay) vs. $0 (Don't Pay).
  *   **Accuracy:** $P(\text{Pred} = \text{Action}) = 0.8$.

  #### 1. Causal Decision Theory (CDT)
  **Verdict:** **Don't Pay** (in both versions).
  **Reasoning:** The prediction is a past event. The causal arrow runs from Prediction $\to$ Reward, and from Your Choice $\to$ Cost. Your choice cannot causally influence the past prediction.
  **Arithmetic:**
  *   $EU(\text{Pay}) = P(\text{Reward}) \times 45k + P(\text{No Reward}) \times (-5k) - 5k \text{ (cost)}$.
  *   Since CDT treats the Reward probability as fixed regardless of action (screened off by the past), let $P(\text{Reward}) = p$.
  *   $EU(\text{Pay}) = 45p - 5(1-p) - 5 = 50p - 10$.
  *   $EU(\text{Don't}) = 50p + 0(1-p) = 50p$.
  *   $50p > 50p - 10$. CDT always saves the $5,000.

  #### 2. Evidential Decision Theory (EDT)
  **Verdict:** **Version A: Pay** | **Version B: Don't Pay**.
  *(Note: This is where the spec requires honesty. Standard EDT usually Pays in Version A. I will explain why below.)*
  **Reasoning:** EDT conditions on the action as evidence.
  *   **Version A:** If the prediction models your *current reasoning*, your choice is strong evidence of the prediction. $P(\text{Reward} | \text{Pay}) \approx 0.8$.
      *   $EU(\text{Pay}) = 0.8(45k) + 0.2(-5k) = 35k$.
      *   $EU(\text{Don't}) = 0.2(50k) + 0.8(0) = 10k$.
      *   **EDT Pays.**
  *   **Version B:** If the prediction is based on *age-15 behavior*, EDT may judge the evidential link weak. If you believe your adult reasoning is uncorrelated with childhood habits *conditional on your current choice*, the correlation breaks.
      *   $P(\text{Reward} | \text{Pay}) \approx 0.5$ (Uncorrelated).
      *   $EU(\text{Pay}) = 0.5(45k) + 0.5(-5k) = 20k$.
      *   $EU(\text{Don't}) = 0.5(50k) = 25k$.
      *   **EDT Don't Pay.**

  #### 3. Functional Decision Theory (FDT)
  **Verdict:** **Version A: Pay** | **Version B: Don't Pay**.
  **Reasoning:** FDT asks which output of your decision *function* yields the best result.
  *   **Version A:** Your decision function *is* what Martha simulated. There is logical dependency. If your function outputs "Don't Pay," the simulation outputs "Don't Pay," and the reward is locked. You must output "Pay" to unlock the $50k.
  *   **Version B:** Your current decision function is not logically identical to your 15-year-old self's spending habits. There is no subjunctive dependence. The prediction is fixed fact. FDT defects.

  ***

  ### The Honesty Clause: Where the Spec Breaks

  You requested a case where **FDT Pays** but **EDT Declines** in Version A.
  **This is technically impossible with an 80% accurate human predictor.**
  If the predictor is 80% accurate based on "knowing you," that *is* statistical correlation. EDT *must* see the evidence. If EDT sees the evidence, EDT Pays.
  To make EDT Decline in Version A, you must assert the correlation is spurious (e.g., "She got lucky"). But if the correlation is spurious, FDT has no logical grip either and should also Decline.
  **The Nearest Working Case:** The verdicts in Version A are actually **FDT Pay / CDT Don't / EDT Pay**.
  **Why this still serves your argument:** The fight isn't about the *verdict* here (FDT and EDT agree); it's about the *reason*. EDT pays because of *statistical correlation* (evidence). FDT pays because of *logical identity* (similarity of algorithm). Version B isolates this: when similarity drops (History vs. Reasoning), EDT loses the statistical link and defects. FDT loses the logical link and defects. CDT defects regardless.
  **The Single Feature:** **Algorithmic Identity.**
  *   When the prediction targets your *current reasoning algorithm* (Version A), FDT and EDT see a link.
  *   When the prediction targets *historical output* (Version B), both see the link severed.
  *   CDT never sees the link.
  *   **What happens when you remove it:** If you remove algorithmic identity (make the predictor a coin flip), FDT and EDT both defect. CDT still defects. The "Mugging" force vanishes.

  ### Updateless Reasoning

  **Does Updateless EDT agree with FDT in Version A?**
  Yes. Updateless EDT (choosing a policy before knowing the specific branch) calculates the expected value of the *policy* "Always Pay" vs "Always Don't."
  *   Policy "Always Pay": 80% chance of $45k, 20% chance of -$5k. EU = $35k.
  *   Policy "Always Don't": 20% chance of $50k, 80% chance of $0. EU = $10k.
  *   Updateless EDT Pays.
  **Is this independent work?** No. It is restating FDT's logic in evidential terms. It acknowledges that the *correlation* exists at the policy level, even if it feels severed at the action level. This supports your thesis: the debate is about whether we evaluate *actions* (CDT/Updateful EDT) or *policies/similarities* (FDT/Updateless EDT).

  ### The CDT/EDT Defense

  **Best CDT Reply:** "You are paying for a past event you cannot change. That is magical thinking. The $50,000 is already there or it isn't. Burning $5,000 doesn't move it."
  **Legitimacy:** Legit from a causal standpoint. It refuses to count the similarity as a causal lever.
  **Best EDT Reply (to Decline in Version A):** "The prediction is a fixed fact of the past. My action now provides no *new* evidence about what Martha wrote yesterday, because I already know she wrote it. The correlation is screened off by my knowledge of the timeline."
  **Legitimacy:** **This is FDT with the labels filed off.** To claim the correlation is screened off, EDT must treat the prediction as *causally* independent rather than *logically* dependent. If EDT admits the logical dependency (that my action *is* what she predicted), it must Pay. If it insists on causal independence, it is acting like CDT. There is no stable middle ground where EDT Declines in Version A without denying the 80% accuracy.

  ### Bonus: The XOR Blackmail Transformation

  To turn Version A into XOR Blackmail (Pay to avert a threat that only exists if you Pay):
  **Modification:** The $50,000 is *yours* already. Martha threatens to *destroy* it if she predicted you would Pay the $5,000 fee. If she predicted you wouldn't Pay, she leaves the $50,000 alone.
  *   **Logic:** If you are the "Paying Type," Martha predicts Pay $\to$ Destroys Money $\to$ You Pay $5k + Lose $50k.
  *   If you are the "Not-Paying Type," Martha predicts Don't $\to$ Leaves Money $\to$ You Keep $50k.
  *   **FDT:** Don't Pay. (If I were the type to Pay, I'd lose everything).
  *   **CDT:** Pay? No, CDT says "The destruction is already decided." CDT keeps the $50k (if safe) or loses it (if doomed). CDT doesn't Pay the fee because it doesn't save the money.
  *   **EDT:** Don't Pay. (Paying is evidence the money is doomed).
  *   **Result:** This aligns all three on "Don't Pay," but for different reasons. It isolates the *similarity* constraint: FDT refuses to be the *type* that triggers the blackmail. CDT refuses to pay because it can't *cause* safety.

  ### Conclusion for Your Section

  Use the **Executor's Bequest (Version A vs B)**.
  Acknowledge the EDT tension honestly: "In Version A, standard EDT actually agrees with FDT. This proves the point: when the similarity is high (algorithmic), EDT sees the correlation. The FDT/CDT fight is not about whether correlation exists, but whether *logical similarity* counts as a lever for decision-making when causal leverage is absent. Version B shows that when similarity is low (historical), even EDT abandons the correlation, leaving CDT alone in its refusal."
  This isolates **Similarity** as the active variable, not Causation.
