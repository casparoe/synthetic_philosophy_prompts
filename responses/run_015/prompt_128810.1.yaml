      To: Harbour Scrip Oversight Committee
      From: [Member Name]
      Date: [Current Date]
      Subject: Recommendation for Pilot Issue Terms

      Recommendation: Adopt a Moderate Pilot Path.

      We stand at a pivot point. Our Berkeleyan framework teaches that money is a ticket, not treasure, and that wealth lies in labor, not metal. Yet we must balance the imperative to stimulate industry against the risk of eroding trust. The extremes before us—either a timid 2,000-pound issue or an aggressive 10,000-pound leap—carry unacceptable risks. I recommend a middle path that honors our principles while securing community confidence.

      Decision on the Four Dials:
      1.  **Volume:** 5,000 pounds face value. This is sufficient to fund the pier and marsh drainage without flooding the local economy.
      2.  **Redemption:** Hybrid model. 50% redeemable for tax credits, 50% redeemable for barley or marsh leases post-harvest.
      3.  **Shop Initiative:** Approved. Allocate 10% of the issue to stock shoes, tea, and wool on credit.
      4.  **Duration:** Twelve-month pilot with a mandatory hard review.

      Rationale:
      Two thousand pounds is insufficient to mobilize the labor required for the pier; it would vanish into subsistence without generating surplus. Conversely, 10,000 pounds risks devaluation before the harvest arrives. Five thousand pounds strikes the balance between stimulus and stability.

      The hybrid redemption is critical. Pure tax credits (Industry's preference) risk treating the scrip as a fiat delusion detached from real wealth. Pure grain redemption (Anchor's preference) risks turning grain into a new gold idol, hindering circulation. By splitting the difference, we ensure the scrip functions as a token of exchange while remaining anchored to tangible produce.

      Addressing the Anchor Side's Concerns:
      The strongest argument against this proposal comes from the Anchor side: that unbacked paper combined with manufactured wants creates dependency and invites a run on the shop. This is a valid fear. If laborers work only for tea and sugar, have we truly liberated them, or merely changed their master?

      However, Berkeley's fourth principle reminds us that idle contentment is the enemy. Subsistence farming keeps our tenants in a cycle of poverty where no surplus is generated. By offering desirable goods on credit, we incentivize labor beyond bare survival. To mitigate the risk of dependency, the shop will operate on strict credit limits tied to work completed, not entitlement. Furthermore, the mandatory twelve-month review includes a clause to terminate the shop initiative immediately if debt levels among laborers exceed sustainable thresholds. We are not creating permanent dependency, but a ladder out of subsistence.

      Addressing the Industry Side's Concerns:
      To the Industry side, I say: treating grain as the sole anchor recreates the metal fetish we seek to avoid. Money must circulate. If every note must be redeemed for barley, it will be hoarded like grain rather than spent like money. The tax-credit portion ensures circulation, fulfilling the currency's purpose as a token to set industry in motion.

      Implementation:
      The pilot begins immediately upon approval. The Review Committee will convene in twelve months to assess circulation velocity, price stability, and laborer debt levels. If the scrip fails to circulate or if the shop creates unsustainable debt, the program terminates.

      This path respects our framework: it treats money as a token, values labor over metal, and uses desire as a tool for industry without sacrificing security. I move we adopt these terms.

