answer: |-
  Here is the breakdown of your boss's decision-making logic, the predictions for the Kaltai case, and the test case you need to run to clarify her underlying rules.

  ### 1. The Verdict: Report vs. Book

  **In the Official Report (March):** She will **not** use the word *genocide*.
  She will likely classify the actions as **Crimes Against Humanity** or **Systematic Cultural Erasure**, citing the UN Convention's emphasis on physical destruction or the specific clause regarding children (which she may argue is being met but is legally untested in this specific context). She will explicitly note the *intent* ("final integration") but withhold the *label*.

  **In the Book (Personal):** She **will** use the word *genocide*, likely qualified as **cultural genocide**.
  Without the institutional letterhead, she reverts to the Lemkinian standard she admires (evidenced by her private writing on boarding schools). She will argue that the destruction of the Kaltai *as a distinct group*—via language, land, and clan structure—meets the moral and historical definition, even if it lacks the mass graves of Srebrenica.

  ### 2. The Three Competing Rules

  You mentioned you can think of two or three rules that fit her track record. Here are the three strongest candidates, where they diverge, and why one wins.

  **Rule A: The "Institutional Triaging" Rule (Consequentialist)**
  *   **The Logic:** The definition of genocide is secondary to the survival of the documentation mission. If using the word ends access, funding, or safety, it is withheld in official capacities. Personal writing is exempt from this triage.
  *   **Prediction for Kaltai:** Report: **No** (Donor ally/Access risk). Book: **Yes** (No institutional risk).
  *   **Support:** The "live situation last year" (cut for access) and the Boarding School split (official vs. private).

  **Rule B: The "Physical Threshold" Rule (Definitional)**
  *   **The Logic:** For an *official* legal report, "genocide" requires physical destruction (killing or serious bodily/mental harm) or immediate threat thereof. Cultural destruction, no matter how total, is "Crimes Against Humanity" officially, and "Cultural Genocide" privately.
  *   **Prediction for Kaltai:** Report: **No** (No massacres/starvation). Book: **Yes** (Cultural Genocide).
  *   **Support:** Boarding School split (official "abuse" vs. private "genocide"), Atlantic Slave Trade (no nation destroyed), Holodomor (side effect vs. aim).

  **Rule C: The "Lemkinian Integrity" Rule (Idealist)**
  *   **The Logic:** If the intent to destroy the group *as such* exists (per Lemkin), the word is used regardless of political cost or physical method. The Herero/Nama verdict (against a donor) proves she prioritizes truth over funding.
  *   **Prediction for Kaltai:** Report: **Yes** (Intent is clear). Book: **Yes**.
  *   **Support:** Herero/Nama (used word despite donor tension), Khmer Rouge (stretched definition of "group").

  **The Best Guess:**
  She is running a hybrid of **Rule A and Rule B**.
  Rule C is the weakest link; the Herero/Nama case was *retrospective*. It cost nothing in terms of access or safety to label a dead colonial power. The "live situation" case proves that when the target is a living government with leverage, Rule A (Access) activates. Furthermore, the Boarding School precedent is almost identical to Kaltai (cultural erasure via children/language). She already established that she will not put "Cultural Genocide" on official letterhead.

  **Why Rule A+B wins:** The Kaltai case fails both her safety check (Donor Ally) and her physical check (No killing). In the Herero case, she passed the safety check (retrospective). In the Khmer Rouge case, she passed the physical check (mass killing). Kaltai fails both.

  ### 3. Definition vs. Consequence: The Honest Split

  You asked how much of her answer is about the *definition* and how much is about *what the word does*.

  **It is 40% Definition, 60% Consequence.**

  *   **The 40% (Definition):** She is not a relativist. She genuinely believes the Holodomor and Atlantic Slave Trade do not fit the legal or Lemkinian definition (lack of specific intent to destroy a specific group *as such*). She won't use the word just for emotional impact. She requires *intent* and *group destruction*.
  *   **The 60% (Consequence):** When the definition is ambiguous—as it is with cultural erasure vs. physical destruction—consequence becomes the tie-breaker. The Boarding School case is the smoking gun here. She admits in private that it *is* genocide (Definition met), but she suppresses the word in public (Consequence prioritized).

  In the Kaltai case, the definition is gray (Cultural vs. Physical). Because it is gray, the consequence (Donor funding/Access) will dictate the verdict in the report.

  ### 4. Your Three-Way Split vs. Her Track Record

  Your split:
  1.  **Killing the members.**
  2.  **Unmaking the membership** (group cohesion).
  3.  **Erasure** (category stops existing).

  **Where you align:**
  She agrees with you on **Killing**. (Holocaust, Rwanda, Srebrenica, Khmer Rouge).
  She agrees with you on **Unmaking**, *but only if it involves children*. (She accepts the UN Treaty clause on forcibly transferring children as a genocidal act, hence her private view on Boarding Schools).

  **Where you come apart:**
  You view **Erasure** (cultural/linguistic death of adults, census removal) as genocide. She does not, *officially*.
  *   **The Atlantic Slave Trade:** You might argue this fits "Unmaking" or "Erasure." She said No (labor motive, no single nation destroyed).
  *   **Boarding Schools:** You see this as Erasure/Unmaking. She calls it "Crimes Against Humanity" officially.
  *   **Kaltai:** You see the banning of language and splitting of clans as Erasure/Unmaking. She will likely view this as "Assimilation" or "Persecution" officially, reserving "Genocide" for physical destruction.

  **The Gap:** She adheres closer to the **UN Treaty** (which prioritizes physical/biological destruction) for official work, while you are adhering closer to **Lemkin's original sociological concept** (which prioritized the destruction of the group's identity). She acknowledges Lemkin privately (Book) but hides behind the Treaty professionally (Report).

  ### 5. The Single Further Case to Test Her

  To distinguish whether her barrier is **Definition (Physicality)** or **Consequence (Access/Donors)**, you need a case that removes the donor risk but keeps the definitional ambiguity.

  **The Test Case:**
  Propose a report on **The forced assimilation of the [Specific Minority] in [Country Z]**, where:
  *   **Action:** State-sponsored banning of language, forced renaming of adults, and prohibition of cultural practices (Erasure/Unmaking).
  *   **Violence:** No mass killing, no starvation, no transfer of children (adults only).
  *   **Politics:** Country Z is **not** a donor, has no alliance with your funders, and your team has secure access.

  **The Predictions:**

  *   **If she says "Genocide" (Official Report):**
      *   **Rule:** Her barrier on Kaltai was **Consequence (Donor/Access)**.
      *   **Meaning:** She *is* willing to use the word for cultural erasure if it doesn't cost the organization. Your Lemkinian view aligns with hers when safety is assured.

  *   **If she says "Crimes Against Humanity" (Official Report):**
      *   **Rule:** Her barrier on Kaltai was **Definition (Physicality)**.
      *   **Meaning:** She fundamentally does not believe cultural erasure of adults constitutes genocide under the legal bar, regardless of funding. She reserves "Genocide" for physical/biological destruction or child transfer.

  *   **If she says "Cultural Genocide" (Official Report):**
      *   **Rule:** She is shifting her **Institutional Risk** tolerance.
      *   **Meaning:** The Kaltai decision was purely about the donor ally.

  **My Prediction for the Test Case:**
  She will say **"Crimes Against Humanity."**
  The Boarding School precedent is too strong. She has already established that "Cultural Genocide" is a private term, not an institutional one. Even without donor pressure, she seems to believe the legal liability and precision of "Genocide" require a physical component or the specific "children" clause. She protects the word "Genocide" for the worst physical crimes to prevent "conceptual inflation" from weakening the organization's legal standing.

  **Summary Advice:**
  Draft the report using "Crimes Against Humanity" and "Systematic Erasure." Save the "G-word" analysis for a sidebar or a separate commentary piece where you can attribute the *possibility* of genocide to the intent memos without making it the organization's primary finding. This aligns with her "Dual-Track" method and keeps your job while documenting the truth.
