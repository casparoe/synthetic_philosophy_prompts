      *   *Focus:* Ensure the distinction between "lawlike" (Asimov's claim) and "probabilistic/structural" (Secular Cycles claim) is clear. This is the crux of the philosophical tension.

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe compare Seldon to Marx.
      *   *Correction:* No, stick to the prompt's request for Secular Cycles/Structural-Demographic theory. Keep the comparison tight.
      *   *Initial thought:* Focus heavily on the Mule.
