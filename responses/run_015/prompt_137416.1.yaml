answer: |-
  This is a precise request for a specification sheet rather than a solution. You have identified the core friction of the Special Composition Question: the gap between how we count things for insurance and how the world might actually be put together.

  Below is the specification you asked for. It is organized into the five sections you requested, followed by the brief evaluation of the standard families of answers.

  ### 1. The Cases: The Test Suite

  Any answer to the composition question must be able to process these cases without crashing. The "Requirement" column explains why the case is mandatory, not just intuitive.

  | Case | Example | Why this is a Requirement (The Stress Test) |
  | :--- | :--- | :--- |
  | **Ordinary Artifact** | A restored clock. | **The Baseline.** If an answer says the gears do not compose a clock, it contradicts the inventory record. If it says they do, it must explain why the same gears on a bench do not. |
  | **Living vs. Colony** | A cat vs. an ant colony. | **The Unity Gradient.** A cat acts as a single unit of survival; a colony acts as a unit but is made of independent agents. An answer must distinguish biological unity from social aggregation without relying on "size." |
  | **Scattered Collection** | Specimen parts in two buildings. | **Spatial Continuity.** Your database lists one specimen. If composition requires physical contact, the specimen does not exist. If it exists without contact, "contact" cannot be the rule. |
  | **Temporary Pattern** | A whirlpool; a traffic jam. | **Temporal Stability.** These have structure and causal power but vanish if the flow stops. Are they objects or events? An answer must handle things that persist only as long as a process runs. |
  | **Replacement** | A clock rebuilt piece by piece. | **Persistence.** If you replace every gear, is it the same clock? If yes, composition cannot depend on specific material. If no, museum provenance is a fiction. |
  | **Coincidence** | A restored pot and the clay. | **Counting.** The pot and the clay occupy the same space. Are they one thing or two? If two, how do they share space? If one, why does the pot cease to exist if crushed but the clay remains? |
  | **Borderline** | A heap of gravel; a cloud. | **Vagueness.** Remove one stone. Is it still a heap? An answer must handle cases where there is no sharp line between "many things" and "one thing." |
  | **Nested Hierarchy** | Cell, organ, animal, colony. | **Nesting.** Must composition stop? If cells compose organs, and organs compose animals, do cells compose animals directly? Or does composition "screen off" at the organ level? |

  ### 2. The Distinctions: What Must Not Collapse

  An adequate answer must keep these concepts separate. If an answer conflates them, it will fail to generate a usable inventory rule.

  *   **Composition vs. Identity:** To say the parts compose the whole is not to say the whole is *identical* to the parts. The clock can be melted down; the parts remain, the clock is gone. An answer must allow the whole to have different conditions of existence than the sum of the parts.
  *   **Existence vs. Causal Power:** A composite might exist without doing anything new. However, for your work, existence usually implies *integrated* causal power (the clock tells time; the gears do not). An answer must distinguish "being there" from "working together."
  *   **Composing *at a Time* vs. Persisting *through Time*:** This is critical. A clock might be composed of these gears *now*, but was it the same clock *last year*? An answer must handle synchronic composition (what makes a whole now) separately from diachronic identity (what makes it the same whole later).
  *   **One Thing vs. One Kind:** There might be exactly one physical object here, but we might classify it as two kinds (a "pot" and a "clay lump"). An answer must not force us to choose between counting objects and counting kinds.
  *   **Ontological vs. Conceptual:** Does the composition happen in the world, or in our description? For insurance, you need it to be in the world. An answer must specify whether the "oneness" is discovered or imposed.
  *   **Composition vs. Parthood:** Knowing *when* parts make a whole is different from knowing *which* parts are essential. An answer to the composition question should not presuppose a theory of essential parts, or it becomes circular.
  *   **Damage vs. Disassembly (Your Rule):** This is the distinction between a change of state that ruins the function (breaking) and a change of arrangement that preserves the parts (disassembly). An answer must explain why one destroys the object and the other merely relocates it.

  ### 3. Constraints from Outside Philosophy

  These are the boundary conditions imposed by your work and general science.

  *   **The Inventory Constraint:** The answer cannot imply that ordinary inventories (museums, warehouses, households) are systematically false. If the answer says "clocks don't exist," it is practically useless for you.
  *   **The Science Constraint:** The answer cannot contradict established chemistry or ecology. Atoms compose molecules; cells compose tissues. If the answer says "only atoms exist," it forces you to treat chemistry as a fiction.
  *   **The Knowability Constraint:** It must be possible, in principle, to determine if composition has occurred. If the fact of composition is unknowable, you cannot write the condition report.
  *   **The Non-Accident Constraint:** Composition cannot be a brute accident. It cannot be that *these* gears compose a clock and *those* identical gears do not, for no reason. There must be a differentiating factor.
  *   **The Mind-Independence Constraint:** You asked if this is a rationalist preference. For your purpose (insurance), it is a **real requirement**. If composition depends on whether someone *cares* about the gears, then the insurance liability shifts when the curator walks out of the room. For public records, the fact must hold regardless of attention.

  ### 4. Sorting Requirements: Genuine vs. Preference

  Here we separate what an answer *owes* you from what is merely a philosophical aesthetic.

  | Requirement | Genuine or Preference? | Reasoning |
  | :--- | :--- | :--- |
  | **Non-Triviality** (Not "nothing" or "everything") | **Genuine** | "Nothing composes" makes your job impossible. "Everything composes" makes the word "object" useless (the gears-plus-dust compose something). You need a middle ground. |
  | **Single General Condition** (One rule for all) | **Preference** | It is aesthetically pleasing to have one law (e.g., "contact"). But the world may be messy. A list of conditions (biological, functional, spatial) might be more accurate than one forced rule. |
  | **No Brute Facts** (Everything explained) | **Preference** | We may have to accept that at some level, it is just a fact that *this* arrangement works and *that* one doesn't. Demanding an explanation for everything may be impossible. |
  | **Mind-Independence** | **Genuine** | As argued above, insurance and science require objective facts. |
  | **Vindicate Ordinary Talk** | **Genuine** | If the answer says "clocks don't exist," it fails the Inventory Constraint. |
  | **Explain Asymmetry** (Breaking > Making) | **Genuine** | You noted it is easier to destroy a unity than create one. An answer should explain why functional integration is fragile. |
  | **Your Breakability Rule** | **Genuine Heuristic, Flawed Definition** | It captures the *functional* nature of artifacts and organisms well. However, it struggles with scattered objects (can you "break" a specimen in two buildings?) and temporary patterns (can you "break" a traffic jam?). It is a symptom of composition, not the definition. |

  ### 5. Incompatibilities and Tensions

  You suspected that some requirements cannot be jointly satisfied. You are correct. There is a trilemma here. You can likely only satisfy two of the following three:

  1.  **Non-Triviality:** Composition is restricted (not everything composes, not nothing composes).
  2.  **No Brute Facts:** There is a deep, general explanation for why composition happens.
  3.  **Vindicate Ordinary/Scientific Talk:** The answer agrees with common sense and science about clocks, cats, and atoms.

  **The Tension:**
  If you demand a **Single General Condition** (to avoid Brute Facts) that is **Non-Trivial** (Restricted Composition), you will almost certainly fail to **Vindicate Ordinary Talk**.
  *   *Example:* If the rule is "Physical Contact," you save the clock but lose the scattered specimen.
  *   *Example:* If the rule is "Functional Unity," you save the clock and the cat, but you lose the heap of gravel (which has no function) and perhaps the scattered specimen (which has no active function).
  *   *Example:* If you tweak the rule to save the specimen, you risk making the rule so complex it looks like a list of brute facts.

  **Which Requirement Does the Most Work?**
  **Non-Triviality** is the engine. If you drop this, you can have a simple general rule ("Everything composes" or "Nothing composes") with no brute facts. But this destroys your inventory system.

  **Which Should You Abandon?**
  For a working person, you should abandon the demand for a **Single General Condition**.
  *   *Cost:* You must accept that composition might happen for different reasons in different domains (biology vs. mechanics vs. geology). There may not be one "glue" that holds the universe together.
  *   *Benefit:* You preserve the Inventory Constraint and Mind-Independence. You can say a clock composes a whole due to *functional integration*, while a scattered specimen composes a whole due to *historical/causal association*, without forcing them into one unnatural box.

  **Does Your Breakability Rule Survive?**
  It survives as a **test for functional artifacts and organisms**, but it fails as a **universal criterion**.
  *   *Why it fails:* It cannot handle the **Scattered Collection**. A specimen in two buildings is one inventory item. You cannot "break" it by dropping a hammer. You can only "break" the administrative link. If you insist on physical breakability, you must declare the scattered specimen does not exist as a single thing. This violates the Inventory Constraint.
  *   *Modification:* To save it, you must broaden "broken" to mean "the specific relations that unify the parts are severed." But this risks making the rule circular (unified by relations that can be severed).

  ### Evaluation of the Three Standard Families

  **1. Nothing Ever Composes (Nihilism)**
  *   **Verdict:** Fails.
  *   **Why:** It violates the Inventory Constraint. If only simple particles exist, there are no clocks, no specimens, and no insurance claims. It is metaphysically clean but practically useless.

  **2. Everything Always Composes (Universalism)**
  *   **Verdict:** Fails.
  *   **Why:** It violates the Breakability Intuition and the Inventory Constraint. If the gears on the bench compose an object just as much as the assembled clock, you cannot distinguish "damaged" from "disassembled." Every scatter of dust is an object. Counting becomes impossible.

  **3. Composition Only Under Some Condition (Restrictivism)**
  *   **Verdict:** Best Fit, but High Maintenance.
  *   **Why:** This is the only family that allows for clocks and specimens while excluding random piles. However, it forces you to accept either **Brute Facts** (it just is a clock) or **Multiple Criteria** (biology works one way, artifacts another). It requires the most work to specify, but it is the only one that matches the reality of your database.

  ### Summary Recommendation

  Your "Breakability Rule" is a robust heuristic for **functional unity**. It correctly identifies that a clock is more than a sum of parts because the *arrangement* carries the value. However, to make it a working specification for your museum, you must treat "composition" as **domain-relative**.

  Accept that a clock composes a whole because it can be broken (functional). Accept that a scattered specimen composes a whole because it shares a causal history (historical). Do not try to force these into one single metaphysical law. The tension you feel is not a flaw in your thinking; it is a feature of a world where "object" is a status applied for different reasons in different contexts.
