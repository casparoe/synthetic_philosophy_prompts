answer: |-
  To count as adequate, a theory of "water" must deliver on these four specifications:

  1.  **The Duplication Requirement:** It must explain how Oscar and Twin-Oscar are intrinsic duplicates yet their tokens of "water" have different extensions (H₂O vs. XYZ). Meaning cannot be purely internal.
  2.  **The Ignorance Requirement:** It must explain how 1750 speakers meant water by "water" without knowing chemistry. Reference cannot depend on descriptive knowledge of essential structure.
  3.  **The Division Requirement:** It must explain how chemically clueless speakers still mean water. Individual competence is insufficient; the theory must incorporate reliance on experts (linguistic division of labor).
  4.  **The Continuity Requirement:** It must handle the Gradual Transfer case. If Oscar moves to Twin Earth over ten years unnoticed, the theory must account for the transition without implying his word changed meaning mid-sentence arbitrarily.

  **The Incompatibility Flag:**
  The **Continuity Requirement** and **Determinacy of Truth** (implicit in logical semantics) likely cannot both be satisfied.

  If you honor Continuity, meaning shifts gradually as causal connections shift. This renders truth values vague during the transition (was "water" true or false on day 1,500?). If you honor Determinacy, reference must switch at a precise moment. This violates Continuity, implying a semantic snap Oscar never notices. You cannot have both a smooth causal transition and precise truth conditions. 

  This tension reveals a Sorites paradox at the heart of externalism: causal histories are vague, but reference seems precise. Most theories sacrifice Continuity to save Determinacy, but that leaves the Gradual Transfer case unexplained. Pursuing this conflict will strengthen your EE significantly more than rehashing Putnam's original argument.
