answer: |-
  The terror of your question is not lost on me. To suggest that faith is merely a retrospective honorific granted to those whose voices we deem divine strikes at the very anxiety that keeps me awake here in Copenhagen. If it were so, then faith would be a matter of history, of outcome, and not of the moment, of the leap. But I must look at what is before me, not at what God might whisper in an ear I cannot hear. You say she writes. Abraham cannot speak. To write is to seek the universal, to invite the judgment of the very neighbors from whom the knight of faith must hide. She seeks mediation where none is possible. The knight of faith stands alone; she builds a bridge to posterity.

  You ask me what an absolute relation to the Absolute feels like, and here I must stumble, for I am only a poet of the ethical, not a knight of the divine. I know the pain of resignation, the sweet sorrow of giving up the finite to rest in the eternal; but the leap where one receives the finite back *by virtue of the absurd*? That is a movement I cannot make, and therefore cannot describe from the inside. I can only watch. And what I watch in her is not the absurd recovery of the finite, but the sacrifice of the ethical for the sake of a finite thing—the book. She does not believe she will get her victim back; she believes she will get her book. That is not faith. That is ambition.

  So you demand a verdict, and I, who am not a judge, must speak. She is a murderer. Not because the voice was false—that is for God to decide—but because her movement is not towards the Absolute but towards herself, towards her book. She seeks to be understood, she seeks to create a legacy, she seeks to make the private public. Abraham stands alone before God; she stands before her readers, even if she pretends they are God. I say this with a trembling hand, for I know how easily I might mistake my own resignation for faith, but here the category breaks. She wants the world to know. Abraham could not tell Sarah, could not tell Eliezer. If she writes, she has already stepped down from the trial. I remain Johannes de Silentio, and I see no faith here, only the terrible silence of a crime dressing itself in holy robes.
