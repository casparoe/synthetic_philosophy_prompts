  i'm presenting next week at a joint philosophy and political science seminar and i need help prepping for the q&a. my view is that religious arguments in public political discourse don't just violate the rawlsian duty of civility — they suffer from a kind of normative opacity that makes them self-undermining. specificaly, when a believer appeals to revelation in a pluralistic forum, the premise can't carry normative weight for anyone who doesn't already share the revelatory framework, so the argument collapses into something like a performative contradiction: you're demanding public assent to a reason that, by its own internal lights, isn't publicly shareable. i think this actually damages religious citizens more than secular critics realize, because it strips their arguments of the very authority they claim. the audience is eight people: four liberal rawlsians who treat public reason and the original position as almost canonical, two political theologians who think rawls unfairly marginalizes revelation-based reasoning, and one pragmatist who thinks the whole debate is a catagory mistake. can you draft my prep sheet? i want the objections ordered by how damaging they'd be, each phrased the way that specific camp would actually put it, with a quick reply and a note on where the reply is weakest or where i should concede something up front. also tell me the one objection i'm praying nobody asks — probably something about whether my view makes religious citizens second-class in a way that's actually worse than rawls's exclusion. please write this all in continuous prose, no headings, no bullet points, no bold, no tables, just like a long email. and don't clean up my language too much — there's probably a typo or two in my notes anyway.
