answer: |-
  ### Conceptual Landscape and Assessment

  You have identified a subtle but pervasive explanatory mode in contemporary environmental history and historical epidemiology. Your intuition is correct: this posture is distinct from classical environmental determinism, standard multicausality, and full-blown Actor-Network Theory (ANT), yet it borrows rhetorical resources from all three.

  Here is the step-by-step assessment of the conceptual landscape, followed by a proposal for naming and defining this posture.

  #### 1. Mapping the Neighbors
  To determine if this is a novel concept, we must distinguish it from its closest relatives:

  *   **Environmental Determinism:** This posits a direct, mechanical chain ($Environment \to Outcome$). Your examples explicitly reject this; the outcome depends on institutional mediation.
  *   **Possibilism (Vidal de la Blache):** This suggests the environment sets limits within which humans choose. While close, possibilism treats the environment as a static stage or set of constraints. Your pattern describes the environment as an *active interrogator* that changes the state of knowledge about the system.
  *   **Actor-Network Theory (ANT):** ANT grants "actancy" to non-humans. However, ANT generally flattens ontology (humans and non-humans are symmetrical actants). The historians you cite maintain human exceptionalism (humans "read" signals; nature "sends" them) without granting nature intentionality. They want the *effect* of agency without the *ontology* of agency.
  *   **Vulnerability and Resilience Theory:** This is the strongest existing candidate. In risk sociology (e.g., Hewitt, Bankoff), "hazards" become "disasters" only through social vulnerability. However, in the narratives you describe, the rhetoric often flips: the hazard is not just a trigger but a *diagnostic tool* that objectively measures the system's quality. Vulnerability theory focuses on the *social construction of risk*; your pattern focuses on the *revelatory power of the shock*.
  *   **Evolutionary Selection:** Biologists speak of "selection pressure." When historians say a plague "selected for" certain institutions, they are importing biological functionalism. However, as you note, they wish to avoid the teleology implied by "selection."

  #### 2. Is There an Established Term?
  **Assessment:** No, there is no single, canonical term in the philosophy of history that captures this specific hybrid.

  While terms like "exogenous shock," "trigger event," or "stressor" are used, they describe the *input*, not the *explanatory function*. The specific move of treating the non-human force as a **diagnostic instrument** that validates or invalidates social structures is currently an unreflexive rhetorical habit rather than a formalized concept. It is often buried under the umbrella of "Resilience Thinking," but Resilience Theory focuses on the capacity of the system, whereas your observation highlights the *active role of the disturbance* in revealing that capacity.

  #### 3. Proposal: Probative Causality
  I propose naming this explanatory posture **Probative Causality** (or the **Probative Mode**).

  *   **Etymology:** From the Latin *probare*, meaning "to test," "to prove," or "to validate."
  *   **Definition:** A causal narrative in which a non-human event (climatic, microbial, geological) functions not merely as a mechanical cause of change, but as an experimental variable that *tests* the latent properties of a social system. The event is assigned a **revelatory function**: it exposes hidden structural variables (fragility, rigidity, legitimacy) that were indiscernible during equilibrium.
  *   **The Normative Loop:** Crucially, Probative Causality includes a semiotic layer: the environment presents a "problem" or "signal," and the historical judgment rests on whether human actors correctly "interpreted" and "adapted" to this signal.

  #### 4. Boundary Conditions
  To ensure this concept is precise and not just "multicausality with adjectives," we must define its boundaries:

  *   **(a) vs. Ordinary Multicausality:** In multicausality, Environment ($E$) and Society ($S$) are independent variables summing to Outcome ($O$). ($E + S \to O$). In **Probative Causality**, $E$ operates *on* $S$ to reveal a hidden parameter ($P$). ($E \to [Reveal P in S] \to O$). The environment is not just a push; it is a *measurement device*.
  *   **(b) vs. Full Historical Agency:** Full agency implies intentionality (nature "wants" to change us). Probative Causality explicitly denies intentionality but retains **functional directionality**. Nature does not *intend* to test the Bourbons, but the *effect* of the eruption is functionally equivalent to a test.
  *   **(c) vs. Gould-Lewontin Spandrels:** The Spandrels critique warns against assuming every trait exists *for* a function. Probative Causality risks this by implying the *surviving* institutions were "selected" because they were "better." To remain valid, Probative Causality must acknowledge that the "test" is arbitrary (a random volcano) and that "success" is contingent, not evolutionary progress.

  #### 5. Hidden Normative Commitments
  This is the most critical philosophical implication of your chapter. Probative Causality carries a heavy, often unacknowledged normative load:

  1.  **The Imperative of Resilience:** It naturalizes the expectation that institutions *ought* to withstand environmental shocks. If a regime collapses after Tambora, Probative Causality frames this as a *failure of the regime* (fragility) rather than potentially a *failure of the distribution system* or a moral choice to protect elites. It shifts blame from political choices to structural "fitness."
  2.  **The Legibility of Nature:** It assumes the environment sends "signals" that can be "read." This privileges actors who claim to understand climate/epidemiological data (scientists, technocrats) and marginalizes those who respond through tradition or denial, framing the latter as irrational rather than politically motivated.
  3.  **Depoliticization of Disaster:** By framing a crisis as a "stress test," the narrative can obscure the fact that the "test" was often rigged by prior political decisions (e.g., deforestation, underfunded healthcare). The volcano becomes the examiner, distracting from the architects of the vulnerability.

  ### What Would Change My Mind (Falsification Conditions)

  I am prepared to conclude that **Probative Causality** is not a distinct concept and that you are overreading rhetorical flourish if the following conditions are met:

  1.  **The "Decorative Metaphor" Test:** If you can rewrite the historian's explanation removing all "testing/revealing" language (e.g., changing "The plague exposed the weakness of feudalism" to "The plague killed laborers, which increased the bargaining power of survivors, undermining feudalism") *without losing any causal explanatory power*, then the "probative" element is merely stylistic, not conceptual.
  2.  **Explicit Denial of Function:** If a historian using this language explicitly states in their methodology, "The volcano did not test anything; it simply caused crop failure which humans reacted to," then they are using "expose" as a synonym for "cause," and no new category is needed.
  3.  **Reduction to Vulnerability:** If the "revealing" function can be fully reduced to pre-existing **Vulnerability Theory** (where the focus is entirely on the social construction of the risk, and the hazard is merely the trigger), then Probative Causality is just a subset of Vulnerability analysis. However, I suspect you will find that Vulnerability Theory locates agency in the *social structure*, whereas your examples locate the *active revealing* in the *natural event*.

  ### Vulnerabilities in My Reasoning

  As a philosopher of history, I must disclose where my own reasoning is most vulnerable to critique from historians of science:

  1.  **The Definition of Agency:** I am distinguishing "intentional agency" from "functional agency." A strict materialist historian of science might argue this is a false distinction. If there is no intention, there is no agency, only causation. They might argue I am reifying a metaphor ("testing") into an ontological category ("Probative Causality") unnecessarily.
  2.  **Over-Intellectualizing Rhetoric:** Historians often write for a general audience. Phrases like "stress-test" or "expose" may be chosen for narrative punch rather than philosophical precision. My analysis risks attributing a coherent philosophical posture to what might be a collection of disparate rhetorical habits.
  3.  **The "Signal" Problem:** I critique the idea that nature sends "signals." However, in cybernetics and systems theory (which underpin Resilience Thinking), feedback loops *are* signals. If the historians are implicitly drawing on systems theory, the "semiotic" layer I identify is actually a technical description of feedback, not a metaphor. I may be underestimating the technical rigor of the "Resilience" framework they are borrowing from.

  ### Final Recommendation for Your Chapter

  You should treat **Probative Causality** as a **working hypothesis** for your chapter.

  1.  **Name it:** Introduce the term (or "Diagnostic Agency") to give your readers a handle on the pattern.
  2.  **Interrogate it:** Do not just describe it; critique the normative commitments. Ask: *Who benefits when we frame a pandemic as a "test" of our system rather than a "failure" of our preparation?*
  3.  **Distinguish it:** Explicitly contrast it with Vulnerability Theory to show you understand the nuance. Vulnerability says "We built a fragile house." Probative Causality says "The storm proved the house was fragile." The difference is where the active verb lies.

  This approach will elevate your chapter from a literature review to a methodological intervention.
