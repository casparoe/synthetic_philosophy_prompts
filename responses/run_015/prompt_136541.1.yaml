      *   *Claim 2 (Anti-Psychologism = Nationalism):* **Misrepresentation/Genetic Fallacy.** Anti-psychologism was established decades before the diary. It was a reaction to philosophers like Mill and Husserl (early), not a code for Aryan supremacy. The "Third Realm" of thoughts is accessible to *any* rational being, not just Germans, in Frege's theoretical framework.
