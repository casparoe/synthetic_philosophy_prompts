      *   **Roommate's Claim:**
          1.  Frege's 1920s journal shows he thought Jews lacked logical intuition linked to German culture.
          2.  He thought democracy undermines scientific objectivity.
          3.  Conclusion: His anti-psychologism is disguised ethnic nationalism (only Aryan minds grasp objective thoughts).
          4.  Conclusion: His sense/reference distinction separates "pure German thinking" from "subjective Jewish association."
          5.  Conclusion: His logicism is tainted and should be rejected.
