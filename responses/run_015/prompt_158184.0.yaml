      *   **Reason 1: Substantivalism $\neq$ Locality.** Accepting absolute space (to solve the Bucket) does not restore Locality (to solve Bell). Bell's theorem is about *causal structure*, not just *ontological background*. You can have absolute space and still have non-local dynamics (e.g., Bohm).
