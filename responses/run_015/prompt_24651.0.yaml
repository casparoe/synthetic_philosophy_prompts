answer: |-
  You have hit the nail on the head. Your confusion is not a failure of understanding; it is a correct philosophical diagnosis of the field. The standard practice of Null Hypothesis Significance Testing (NHST) as it is currently deployed in the empirical sciences is not a coherent statistical framework. It is a historical accident—a hybrid of two incompatible philosophies of statistics, interpreted through a third, unstated philosophy.

  To answer your core question directly: **The practice presupposes a Naive Inductivist view of evidence, disguised as Frequentist methodology, but operated as if it were Bayesian.**

  Here is the breakdown of why the setup is incoherent, what it quietly assumes, and what would actually change if we fixed it.

  ### 1. The Historical Hybrid: Fisher vs. Neyman-Pearson
  The first layer of incoherence is that modern NHST merges two distinct frameworks that were actually rivals.

  *   **Ronald Fisher (Evidential):** For Fisher, the $p$-value was a measure of evidence against the null hypothesis in a specific instance. It was inductive. He did not believe in a fixed cutoff (like 0.05); he thought the researcher should interpret the strength of evidence contextually. He also did not formally have an alternative hypothesis ($H_1$).
  *   **Neyman & Pearson (Behavioral):** For them, hypothesis testing was not about evidence or truth in a specific case. It was a decision procedure for long-run quality control. You set an $\alpha$ (false positive rate) and $\beta$ (false negative rate) *before* the study. You "accept" or "reject" based on rules to minimize long-term costs. They explicitly forbade interpreting the result as "probability the hypothesis is true."

  **The Quiet Assumption:** The current practice takes Fisher's $p$-value (evidence) and applies Neyman-Pearson's 0.05 cutoff (decision rule).
  *   **The Incoherence:** You cannot use a long-run error rate (N-P) to make a claim about the probability of a specific hypothesis being true (Fisher/Bayes). By using the 0.05 gate to declare an effect "real," scientists are making an epistemic claim (this is true) using a behavioral tool (this method rarely errs in the long run).

  ### 2. The Inversion Problem: Secret Bayesianism
  You correctly identified that $P(\text{Data} | H_0) \neq P(H_0 | \text{Data})$. This is the definition of the **Inverse Fallacy**.

  In a strict Frequentist view, the hypothesis is either true or false; it has no probability distribution. Therefore, asking "What is the probability the effect is real?" is meaningless. However, when a scientist says, "$p < 0.05$, so the effect is significant," they are implicitly saying, "It is highly unlikely the null is true."

  **The Quiet Assumption:** To make that leap logically, you need Bayes' Theorem:
  $$P(H_1 | \text{Data}) \propto P(\text{Data} | H_1) \cdot P(H_1)$$
  The practice quietly assumes a **prior probability** ($P(H_1)$) that is much higher than it should be.
  *   If the prior probability of a hypothesis being true is low (which it often is in exploratory science), a $p$-value of 0.04 might still correspond to a posterior probability where the null is more likely than the alternative (as demonstrated famously by Ioannidis and Sellke et al.).
  *   By treating $p < 0.05$ as "truth," the field is implicitly assuming **flat priors** or **optimistic priors**. It assumes that if the data is unlikely under the null, the alternative *must* be probable. This ignores the possibility that the data is unlikely under *both* hypotheses, or that the alternative was implausible to begin with.

  So, to answer your question: **Yes, the way the number is *used* requires a Bayesian reading, but the number itself is calculated using Frequentist math.** It is a Frequentist calculation masquerading as a Bayesian posterior.

  ### 3. The File Drawer: Violating the Sampling Plan
  Your second point about meta-analysis is the statistical killer. Frequentist error rates ($\alpha = 0.05$) are valid only if the sampling plan is fixed and adhered to.

  *   **The Assumption:** The literature assumes that the set of published papers is a representative sample of the set of conducted studies.
  *   **The Reality:** The publication process is a filter function $f(\text{study})$ that returns "publish" only if $p < 0.05$.
  *   **The Consequence:** When you pool published studies in a meta-analysis, you are not averaging random samples of the truth. You are averaging the tail ends of the distribution. This inflates effect sizes (the "winner's curse") and drastically increases the false discovery rate of the literature.

  **The Quiet Assumption:** This presupposes a **Self-Correcting Science** view. It assumes that while individual studies are biased, the "marketplace of ideas" will eventually average out the noise. Statistically, this is false. If the selection bias is structural (journals reject nulls), the literature converges on a biased estimate, not the truth.

  ### 4. What View of Probability Does This Presuppose?
  If we strip away the technical jargon, the current practice presupposes a **Ritualistic Realism**.

  1.  **Probability as a Purification Ritual:** The $p$-value is not treated as a continuous measure of uncertainty, but as a threshold for purity. Below 0.05, the finding is "clean" (signal); above 0.05, it is "noise."
  2.  **Evidence as Dichotomous:** It assumes nature is binary (effects exist or they don't), ignoring that in most social/biological sciences, the null hypothesis of *exact* zero effect is almost always false. The question should be "how big?" not "is it zero?"
  3.  **The Community as a Single Bayesian Agent:** The system only works if we view the *entire scientific community over time* as the Bayesian updater. Individual papers claim Frequentist rigor ("I controlled error rates"), but they expect the community to update beliefs ("Now we know X is true"). This division of labor allows individual scientists to avoid specifying priors while reaping the epistemic rewards of having done so.

  ### 5. What Would Actually Change?
  If we swapped the bright-line gate for the alternatives you mentioned, the structural incentives would have to shift.

  **A. Reporting Effect Sizes and Uncertainty (Estimation)**
  *   **The Change:** Move from "Is it significant?" to "What is the magnitude and the Confidence Interval?"
  *   **The Requirement:** This requires journals to publish "null" results if the Confidence Interval is narrow enough to rule out meaningful effects. Currently, a "non-significant" result with a wide CI is useless; a "non-significant" result with a narrow CI is valuable evidence of absence.
  *   **The Shift:** This kills the dichotomy. It forces scientists to argue about *practical significance* rather than *statistical significance*.

  **B. Bayesian Posteriors**
  *   **The Change:** You report $P(H_1 | \text{Data})$.
  *   **The Requirement:** You must state your prior $P(H_1)$. This is the hard part. Scientists hate this because it makes subjectivity explicit.
  *   **The Shift:** This would humble the literature. If you have to admit your prior was optimistic, your posterior won't look as impressive. It would also solve the inversion problem legally. However, it doesn't solve the file drawer problem unless combined with...

  **C. Registered Reports (The Structural Fix)**
  *   **The Change:** Peer review happens *before* data collection. If the method is sound, the journal commits to publishing the result regardless of the $p$-value.
  *   **The Requirement:** This decouples publication from the result.
  *   **The Shift:** This eliminates the file drawer problem at the source. It makes the literature a true random sample of conducted studies. Meta-analyses become valid again.

  ### Summary
  The practice is **not internally coherent**. It is a "Tower of Babel" built from Fisherian evidence, Neyman-Pearson decision rules, and Bayesian intuition, glued together by institutional incentives.

  *   **Does the 0.05 gate make sense under Frequentism?** Only as a long-run error rate for a decision procedure, not as a claim about the truth of a specific hypothesis.
  *   **Does the usage require Bayesianism?** Yes. Treating $p < 0.05$ as "the effect is real" is a claim about the probability of the hypothesis, which requires priors.
  *   **What is quietly assumed?** That the prior probability of tested hypotheses is high, and that the publication process does not bias the sample of evidence available to the community. Both assumptions are generally false.

  Your instinct that "nobody in the field can quite say out loud what the practice is actually for" is correct. The practice is for **gatekeeping**, not truth-seeking. It provides editors with a defensible reason to reject papers (the "magic number") and scientists with a defensible reason to claim discovery, without requiring either party to engage with the actual philosophical weight of uncertainty.
