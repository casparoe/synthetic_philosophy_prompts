answer: |-
  This is a classic social choice problem, and you're right to focus on the *incentive structure* rather than the proof. The Gibbard-Satterthwaite (G-S) theorem is abstract, but the *instability* it predicts is visceral.

  The biggest hurdle in a 50-minute session is the **Information Problem**. In real life, voters don't know others' preferences, so they can't calculate a strategic vote. To make manipulation viable in a game, you must make the preference profile **common knowledge**.

  Here is the exact run-of-show. It is tight. Do not deviate from the timing.

  ### 1. The Setup (Materials & Room)
  *   **Room:** One classroom. Chairs arranged in 3 distinct clusters (Bloc A, Bloc B, Bloc C).
  *   **Materials:**
      *   Whiteboard & Markers (3 colors).
      *   Printed "National Interest Briefing" slips (one per student).
      *   Printed Ballots (2 per student).
      *   **Payoff:** A bag of high-quality candy or "Club Points" redeemable for snacks later.
  *   **The Options:** Three End-of-Year Party Themes (keep it low stakes but distinct).
      *   **A:** Beach Day
      *   **B:** Bowling Night
      *   **C:** Casino Evening

  ### 2. The Preference Profile (The Math Backbone)
  You have 20 students. Divide them into 3 Blocs. Hand out the "National Interest Briefing" that tells them their Bloc's **True Preferences** and explicitly states the **Size of Every Bloc**.

  *   **Bloc A (8 Students):** True Preference: **A > C > B**
  *   **Bloc B (6 Students):** True Preference: **B > C > A**
  *   **Bloc C (6 Students):** True Preference: **C > B > A**

  **Why this profile?**
  1.  **Plurality:** A wins (8 vs 6 vs 6). But Bloc C hates A. They prefer B. If they lie and vote B, B wins (12 vs 8).
  2.  **Borda:** C wins. But Bloc A hates C. They prefer B. If they lie and "bury" C, B wins.
  *Both methods are manipulable by different groups.*

  ### 3. Minute-by-Minute Timeline

  **00:00 – 00:05: Introduction & Bloc Assignment**
  *   **Action:** Split room into 3 groups (8, 6, 6). Hand out "National Interest Briefing."
  *   **Script:** "You are delegates. Your goal is to maximize your Bloc's satisfaction. You get 3 points if your #1 choice wins, 1 point if #2 wins, 0 points if #3 wins. The Bloc with the most total points gets the prize. **Crucially:** Everyone knows everyone else's preferences. This is public information."
  *   **Whiteboard:** Write the Preference Profile clearly.
      *   8 Delegates: A > C > B
      *   6 Delegates: B > C > A
      *   6 Delegates: C > B > A

  **00:05 – 00:15: Round 1 (Plurality Vote)**
  *   **Rule:** "Vote for your **top choice only**. Most votes wins."
  *   **Action:** Collect ballots. Count live on board.
  *   **Expected Result:** A=8, B=6, C=6. **Winner: A (Beach).**
  *   **Payoff:** Bloc A gets 3pts/person. Bloc B gets 0pts. Bloc C gets 0pts.
  *   **Observation:** Look at Bloc C. They got their last choice. Ask: "Bloc C, are you happy?" (They will say no). "Did you have the power to change this?" (Don't answer yet).

  **00:15 – 00:25: Round 2 (Borda Count)**
  *   **Rule:** "Rank all three. 1st place = 2 pts, 2nd place = 1 pt, 3rd place = 0 pts. Highest total score wins."
  *   **Hint for Strategy:** "Delegates, remember your goal is the best *outcome*, not necessarily voting your heart. Vote to maximize your Bloc's points."
  *   **Action:** Collect ballots. Count live (this takes time, have an exec helper calculate).
  *   **Expected Result (Honest Voting):**
      *   A: (8×2) + (6×0) + (6×0) = 16
      *   B: (8×0) + (6×2) + (6×1) = 18
      *   C: (8×1) + (6×1) + (6×2) = 26
      *   **Winner: C (Casino).**
  *   **Payoff:** Bloc C gets 3pts. Bloc B gets 1pt. Bloc A gets 0pts.
  *   **Observation:** Now Bloc A is angry. They got their last choice.

  **00:25 – 00:35: The "Crisis" (Strategic Re-Vote)**
  *   **Script:** "We have two different winners from two 'fair' methods. Bloc C lost Round 1. Bloc A lost Round 2. We are going to re-run Round 1 (Plurality). But this time, you know the polling data. You know how others will vote. **Vote strategically to get the best result for your Bloc.**"
  *   **Action:** Collect ballots.
  *   **Expected Result:** Bloc C realizes A will win if they vote honestly. They prefer B over A. They vote **B**.
      *   A=8, B=12 (6 from Bloc B + 6 from Bloc C).
      *   **Winner: B (Bowling).**
  *   **Outcome:** Bloc C gets 1 point (better than 0). Bloc B gets 3 points. Bloc A gets 0 points.
  *   **Key Moment:** Point out that Bloc C *lied* on their ballot (voted B, but prefer C) to get a better outcome.

  **00:35 – 00:50: Debrief & Theorem Mapping**
  *   **Action:** Put away ballots. Lecture style.
  *   **Script:** "You just broke the voting system. That wasn't an accident. It's a mathematical certainty."

  ### 4. The Debrief (Mapping to Gibbard-Satterthwaite)
  Draw this table on the board. Fill it in as you talk.

  | Condition of G-S Theorem | How We Met It | Did It Hold? |
  | :--- | :--- | :--- |
  | **3+ Alternatives** | Beach, Bowling, Casino | **Yes** |
  | **Unrestricted Domain** | You could rank them any way | **Yes** |
  | **Non-Dictatorship** | No single person decided | **Yes** |
  | **Pareto (Unanimity)** | If everyone liked A best, A would win | **Yes** |
  | **Strategy-Proofness** | **Can you lie to win?** | **NO (Failed)** |

  **The Takeaway Script:**
  "In Round 1, Bloc C lied to stop A. In Round 2, if Bloc A had lied (voting A>B>C instead of A>C>B), they could have made B win instead of C.
  *   **Plurality** is manipulable by 'Compromising' (voting for your 2nd choice to stop your 3rd).
  *   **Borda** is manipulable by 'Burying' (ranking a rival last to lower their score).
  The Gibbard-Satterthwaite Theorem says: **If you have 3 options and you aren't a dictator, someone can always game the system.** There is no 'perfect' method. There are only trade-offs."

  ### 5. Exact Manipulation Math (For Your Cheat Sheet)
  *Keep this for yourself to answer questions.*

  **Scenario 1: Plurality Manipulation (Round 1/3)**
  *   **Honest:** A=8, B=6, C=6. **A Wins.**
  *   **Bloc C Incentive:** They rank C>B>A. A winning gives them 0 points. B winning gives them 1 point.
  *   **The Lie:** Bloc C votes **B**.
  *   **Result:** A=8, B=12. **B Wins.** Bloc C improves outcome from 3rd choice to 2nd choice.

  **Scenario 2: Borda Manipulation (Round 2 Hypothetical)**
  *   **Honest:** A=16, B=18, C=26. **C Wins.**
  *   **Bloc A Incentive:** They rank A>C>B. C winning gives them 0 points (last choice). B winning gives them 1 point (2nd choice).
  *   **The Lie:** Bloc A votes **A > B > C** (Insincere: they actually prefer C over B). They "bury" C.
  *   **New Math:**
      *   A: (8×2) + 0 + 0 = 16
      *   B: (8×1) + (6×2) + (6×1) = 8 + 12 + 6 = 26
      *   C: (8×0) + (6×1) + (6×2) = 0 + 6 + 12 = 18
  *   **Result:** **B Wins.** Bloc A improves outcome from 3rd choice to 2nd choice.

  ### 6. What Will Predictably Go Wrong (Risk Management)
  1.  **Truth-Telling Bias:** Students might vote honestly in Round 3 even when told to strategize.
      *   *Fix:* In Round 3, walk over to Bloc C and whisper, "If you vote honestly, A wins. You hate A. Vote B." Seed the strategy if they are too noble.
  2.  **Borda Math Errors:** Counting Borda live with 20 ballots is prone to arithmetic mistakes.
      *   *Fix:* Have two exec members count independently and compare before announcing. Or, pre-calculate the "Honest" Borda result and only count the live votes to verify the trend.
  3.  **Time Overrun:** The Borda count takes too long.
      *   *Fix:* If you hit 00:25 and haven't finished counting Borda, announce the expected winner based on the profile and move to the Crisis round. The *concept* matters more than the live tally.
  4.  **Confusion on "Why Lie?":** Students may feel lying is "wrong" in a MUN context.
      *   *Fix:* Frame it as "Strategic Voting" or "Compromise," not lying. In politics, this is called "voting your interests," not "voting your heart."

  ### 7. Limitations (Honesty in Debrief)
  Be transparent about what the activity *didn't* prove.
  *   **Finite vs. Infinite:** G-S applies to *any* number of voters. We only showed it for 20.
  *   **Specific Profile:** We showed manipulation is *possible* in this profile. G-S proves it is *always possible* in *some* profile for any method.
  *   **Information:** In real life, we don't know the profile. The theorem assumes voters *might* know enough to try. We gave them perfect information to make the game work.

  ### 8. Whiteboard Copy-Paste
  *Draw this at 00:05:*

  ```text
  THE PROFILE (Public Knowledge)
  -----------------------------
  Bloc A (8 Delegates):  Beach > Casino > Bowling
  Bloc B (6 Delegates):  Bowling > Casino > Beach
  Bloc C (6 Delegates):  Casino > Bowling > Beach

  SCORING
  -------
  1st Choice Win = 3 Points
  2nd Choice Win = 1 Point
  3rd Choice Win = 0 Points
  ```

  *Draw this at 00:35:*

  ```text
  GIBBARD-SATTERTHWAITE THEOREM
  -----------------------------
  If:
  1. 3+ Options
  2. No Dictator
  3. Unanimity Respected
  THEN:
  It IS manipulable.
  "No Fair Method" exists.
  ```

  This plan respects the math, fits the time, and ensures the "vibe" of the theorem lands without requiring them to understand measure theory. Good luck.
