prompt: |-
  hey — i'm a phil phd student (moral psych / phil of mind) and i'm running a one-off session for my lab's cog-sci grad students. they have stats and neuroscience but basically zero formal ethics. i want them to understand why it's genuinely hard to tell whether someone's moral "preference" is actually just a bias that's been laundered through social feedback loops — i.e., a gut aversion that gets culturally reinforced until it feels like a reasoned stance. i don't need you to explain the idea to me; i need a teaching plan.

  what has to come first? i'm guessing i should start with the phenomenology — moral judgments feel like taste — but then i need to show how taste itself is calibrated by culture, and only then introduce the bias/laundering layer. is that the right dependency? tell me the exact order of pieces and why each depends on the previous one.

  for the carrying example, i want one concrete pairing that does both jobs: it needs to show a case where a preference looks principled but might be laundering disgust (say, "clean meat is unnatural") and the reverse, where a bias looks like preference. but i don't want to use the overused factory-farming vs. veganism setup. what example should carry the whole thing, and what must it have and lack?

  the mispconceptions i expect: they'll think implicit association tests settle the question; they'll confuse revealed preference with moral justification; they'll say "but if it's consistently held, it's not bias." exactly where in the sequence do i head each one off?

  i also need a final check — one question i can ask — that shows whether they've grasped the conceptual problem (the laundering structure) rather than just memorizing "bias bad, preference good."

  and what should i openly refuse to cover? probably meta-ethical anti-realism and the full history of preference theory?

  write the plan, not the lecture. no reading lists please — they wouldn't have time anyway.
