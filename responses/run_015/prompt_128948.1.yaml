answer: |-
  Here is the teaching plan. It is structured to move from the *data* (what it feels like) to the *mechanism* (how it gets built) to the *problem* (why you can't tell them apart).

  ### 1. The Dependency Order
  Your intuition is correct, but the transitions need to be tighter for a cog-sci audience. They will try to solve this with measurement tools immediately. You must block that exit before you give them the mechanism.

  **Order of Operations:**
  1.  **Phenomenological Equivalence (The Output):** Establish that the *internal experience* of a "principled stance" and a "laundered bias" is identical.
  2.  **Cultural Calibration (The Input):** Show that the "taste" generating that experience is malleable and socially trained, not fixed.
  3.  **The Rationalization Engine (The Process):** Explain how the brain converts (1) and (2) into a coherent narrative (laundering).
  4.  **The Indistinguishability Thesis (The Conclusion):** Combine 1–3 to show why third-person observation (stats/neuro) fails to distinguish them.

  **Why this dependency?**
  *   **2 depends on 1:** If they believe moral judgments feel different from gut aversions (e.g., they feel "cooler" or "more reasoned"), they will reject the idea that culture calibrates them like taste. You must prove the *feeling* is the same first.
  *   **3 depends on 2:** You cannot explain *laundering* without explaining *what is being laundered*. If taste weren't culturally calibrated, there would be no bias to launder, only fixed preferences.
  *   **4 depends on 1 & 3:** The impossibility of distinction follows from the fact that the Output is identical (1) and the Process hides the Input (3).

  ---

  ### 2. The Carrying Example: Cognitive Enhancement (Smart Drugs)
  Do not use factory farming. Do not use abortion. Use **non-therapeutic cognitive enhancement (e.g., Modafinil for exam prep)**.

  **Why this example?**
  *   **Relevance:** Your audience lives in a performance economy. They feel the pressure.
  *   **Visceral Charge:** It triggers "cheating" intuitions and "unnaturalness" disgust (like clean meat) without involving animal suffering.
  *   **High Rationalizability:** Both sides have robust principled arguments (Fairness vs. Autonomy), making the laundering hard to spot.

  **What the example must HAVE:**
  *   **A "Yuck" Component:** The idea of chemically altering a healthy brain must trigger a somatic marker (disgust/fear) to test the laundering hypothesis.
  *   **A "Principle" Component:** It must be easy to map onto standard ethical frameworks (Fairness, Liberty, Harm) so the rationalization is plausible.
  *   **Social Ambiguity:** It must be a gray area (not clearly illegal, but socially contested) so feedback loops are active but not settled.

  **What the example must LACK:**
  *   **Clear Harm:** If the drug clearly causes liver failure, the judgment is about safety, not morality. The harm must be abstract (e.g., "erosion of character").
  *   **Legal Prohibition:** If it's illegal, compliance confounds the moral judgment.

  **How it does both jobs:**
  1.  **Preference $\to$ Laundered Disgust:**
      *   *Judgment:* "Enhancement is morally wrong."
      *   *Principled Cover:* "It violates the fairness of meritocracy."
      *   *Laundered Bias:* A somatic aversion to "chemical" alteration of the "sacred" mind (Naturalness Bias) that gets retrofitted into a fairness argument.
  2.  **Bias $\to$ Preference:**
      *   *Judgment:* "Enhancement is morally permissible."
      *   *Principled Cover:* "It respects cognitive liberty and reduces suffering."
      *   *Laundered Bias:* A status-quo bias towards productivity and efficiency (Meritocratic Bias) that gets retrofitted into a liberty argument.

  ---

  ### 3. Misconception Interdiction Points
  Do not save these for the end. Insert them exactly where the temptation arises.

  **Misconception 1: "Implicit Association Tests (IAT) settle the question."**
  *   **Where to head it off:** Immediately after **Phase 1 (Phenomenology)**.
  *   **The Move:** When you establish that the feelings feel identical, a student will suggest neuro/imaging/IAT to find the "real" source.
  *   **The Block:** Explain that IATs measure *association strength*, not *causal history*. A laundered bias will show the same neural signature as a deep preference because the laundering *rewires* the association. The scan shows the current state, not the genealogy.

  **Misconception 2: "But if it's consistently held, it's not bias."**
  *   **Where to head it off:** During **Phase 2 (Cultural Calibration)**.
  *   **The Move:** When discussing how culture shapes taste.
  *   **The Block:** Show that feedback loops *create* consistency. If your social circle punishes deviation, your "taste" becomes highly stable. Consistency is a feature of social reinforcement, not a marker of moral truth or authentic preference.

  **Misconception 3: "Revealed preference equals moral justification."**
  *   **Where to head it off:** During **Phase 3 (The Rationalization Engine)**.
  *   **The Move:** When explaining how the brain generates reasons.
  *   **The Block:** Distinguish *explanation* from *justification*. Revealed preference explains *why* you acted (causal); it does not justify *why* you should have acted (normative). The laundering process turns the explanation into a justification post-hoc.

  ---

  ### 4. The Final Check (The "Structure" Question)
  Do not ask them to define laundering. Do not ask them to identify a bias. Ask them to design a discrimination test.

  **The Question:**
  > "Imagine two agents, A and B. Both hold the exact same moral judgment with the exact same confidence and emotional intensity. Agent A's judgment stems from a reflective preference; Agent B's stems from a laundered bias.
  >
  > **What variable would you need to manipulate in their environment to distinguish them, and why would standard behavioral metrics fail?**"

  **What you are looking for:**
  *   **Fail:** "Ask them why." (They will give the same reason). "Scan their brains." (Output is identical).
  *   **Pass:** They identify a **counterfactual social condition**. (e.g., "If we changed the social reward structure, B's judgment would shift rapidly while A's would remain stable," or "If we removed the disgust trigger, B's justification would collapse.")
  *   **Why:** This proves they understand that the difference lies in the *causal history/sensitivity to feedback*, not the current mental state.

  ---

  ### 5. Scope Limits: What to Refuse to Cover
  You have 90 minutes. If you open these doors, you will not close them.

  1.  **Meta-Ethical Anti-Realism:**
      *   *Refusal:* "We are not asking if moral truths exist. We are asking how humans *generate* moral claims. Whether the claim is 'true' is outside the scope of this mechanism."
  2.  **Normative Ethics as Truth Claims:**
      *   *Refusal:* "We are not debating whether Utilitarianism is correct. We are using Utilitarianism as a *vocabulary* that brains use to rationalize gut feelings. Treat ethical frameworks as data, not answers."
  3.  **The History of Preference Theory:**
      *   *Refusal:* "We are not tracing Hume to Kant. We are tracing Stimulus to Rationalization. History is irrelevant to the computational structure."

  ### 6. Session Timeline (90 Minutes)
  *   **00–15:** **Phenomenology.** Elicit judgments on the Enhancement case. Map the "feeling." (Interdict IATs here).
  *   **15–30:** **Calibration.** Show cross-cultural/historical variance on similar "unnatural" acts. (Interdict Consistency here).
  *   **30–60:** **Laundering Mechanism.** Walk through the cognitive steps from Gut $\to$ Reason. (Interdict Revealed Preference here).
  *   **60–75:** **The Indistinguishability Problem.** Synthesize. Why stats/neuro can't easily solve this.
  *   **75–90:** **Final Check & Discussion.** Pose the Structure Question. Debrief.
