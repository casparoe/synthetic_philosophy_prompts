answer: |-
  Here is a complete lesson plan designed for your 75-minute session. It prioritizes *experiencing* the theoretical tension over hearing it.

  ### **Activity Title:** The Rationalization Trap
  **Goal:** Move students from "Utility explains choice" to "Choice constrains Utility" to "Utility might not mean what we think it means."
  **Class Size:** 18 Students (6 Pairs + 2 Volunteers)
  **Time:** 75 Minutes

  ---

  ### **1. Materials List**
  *   **Snacks:** 3 types, non-allergenic (e.g., Pretzels, Chocolate Squares, Gummy Bears). *Check allergies via email before class.*
  *   **Currency:** 100 slips of paper labeled "Lab Dollars" ($).
  *   **Whiteboard/Projector:** To display Budget Sets.
  *   **Handout 1:** "Choice Record" (Grid for recording 3 rounds of choices).
  *   **Handout 2:** "The Utility Workshop" (Blank axes + prompts for writing functions).
  *   **Handout 3:** "Case Files A, B, and C" (Pre-cooked data sets).
  *   **Secret Role Cards:** 2 cards (for the volunteers).
  *   **Redemption Station:** A table at the front where Lab Dollars are exchanged for snacks at the end.

  ---

  ### **2. The Setup (Minutes 0–5)**
  *   **Seating:** Arrange in 6 pairs. Leave 2 chairs at the front for volunteers.
  *   **The Hook:** "Today is not a lecture. It is a market simulation. You will make choices. You will earn Lab Dollars. At the end, you redeem dollars for snacks. The only rule: Maximize your payoff."
  *   **Allergy Check:** Verbally confirm no one has issues with the three snack types.
  *   **The Volunteers:** Ask for two volunteers. Send them out of the room for 30 seconds (or just to the back with headphones) while you brief the class.
      *   *Instruction to Class:* "These two will make choices on the board. Your job is to record their choices and infer their preferences. Do not talk to them."
      *   *Secret Card 1 (Volunteer A):* "Choose the bundle you **genuinely prefer** based on taste."
      *   *Secret Card 2 (Volunteer B):* "Follow this rule strictly: **Always choose the bundle containing Chocolate.** If both or neither have Chocolate, choose the **Left** option."
      *   *TA Note:* You have designed the Budget Sets (below) so these two rules produce **identical choices**.

  ---

  ### **3. Phase 1: Live Choice & The Black Box (Minutes 5–20)**
  *   **Mechanism:** You present 3 Budget Sets on the board. Volunteers choose. Class records.
  *   **Budget Set 1:**
      *   Option L: 2 Chocolate, 0 Pretzel (Cost: $2)
      *   Option R: 1 Chocolate, 1 Pretzel (Cost: $2)
      *   *Outcome:* Both pick **L**. (Vol A likes Choc; Vol B follows "Max Choc" rule).
  *   **Budget Set 2:**
      *   Option L: 1 Chocolate, 1 Gummy (Cost: $2)
      *   Option R: 0 Chocolate, 2 Gummy (Cost: $2)
      *   *Outcome:* Both pick **L**. (Vol A likes Choc; Vol B follows "Has Choc" rule).
  *   **Budget Set 3:**
      *   Option L: 2 Pretzel, 0 Gummy (Cost: $2)
      *   Option R: 1 Pretzel, 1 Gummy (Cost: $2)
      *   *Outcome:* Both pick **R** (Wait, Vol B rule says "Left" if no Choc).
      *   *Correction for Consistency:* Change Vol B's rule to: "Pick Chocolate if available. If not, pick the bundle with the **most variety** (1 of each)."
      *   *Revised Outcome:* Both pick **R**. (Vol A prefers Variety/No Choc; Vol B follows Rule).
  *   **The Reveal (Minute 20):**
      *   Ask the class: "Write down the Utility Function for Volunteer A and Volunteer B."
      *   Most will write $U(C, P, G) = C + \dots$ for both.
      *   **Reveal the Cards.** Read Vol B's rule aloud.
      *   **Point:** The *data* is identical. The *utility function* you wrote is identical. But the *welfare* is different. If Chocolate runs out, Vol A is sad. Vol B is just confused.

  ---

  ### **4. Phase 2: The Rationalization Trap (Minutes 20–40)**
  *   **Distribution:** Hand out **Handout 2 (Utility Workshop)** and **Handout 3 (Case Files)**.
  *   **Task:** In pairs, students must write a utility function $U(x,y)$ that rationalizes the choices in **Case File A** and **Case File B**.
  *   **Case File A (The "Weird" Consistent Data):**
      *   *Scenario 1:* Budget {$x, y$}. Prices $p_x=1, p_y=1$. Income=2. **Choice:** $(2, 0)$.
      *   *Scenario 2:* Budget {$x, y$}. Prices $p_x=2, p_y=1$. Income=2. **Choice:** $(0, 2)$.
      *   *Scenario 3:* Budget {$x, y, z$}. Prices $p_x=1, p_y=1, p_z=1$. Income=2. **Choice:** $(1, 1, 0)$.
      *   *The Catch:* This data is consistent with WARP, but requires a weird utility function (e.g., preference for variety *only* when $z$ is present, or "menu-dependent" utility).
      *   *Prompt:* "Can you write a function over goods $x, y, z$ that fits this?"
      *   *Expected Result:* They will struggle, then invent something like $U = xy + z(\text{if } z>0)$. They will realize they can *always* save the theory by adding a term.
  *   **Case File B (The "Impossible" Data):**
      *   *Scenario 1:* Budget {$A, B$}. **Choice:** $A$.
      *   *Scenario 2:* Budget {$B, C$}. **Choice:** $B$.
      *   *Scenario 3:* Budget {$A, C$}. **Choice:** $C$.
      *   *Scenario 4:* Budget {$A, B, C$}. **Choice:** $A$.
      *   *The Catch:* This contains a cycle ($A \succ B \succ C \succ A$).
      *   *Prompt:* "Write the utility function for this agent."
      *   *Expected Result:* They cannot. No real-valued function fits a cycle.
  *   **Discussion (Minute 40):** Ask pairs: "Why was Case A easy (eventually) and Case B impossible?"
      *   *Answer:* Case A just required complex preferences. Case B violated the **axioms**. The axioms are the *content* of the theory, not the utility function.

  ---

  ### **5. Phase 3: The Welfare Problem (Minutes 40–55)**
  *   **Activity:** Return to the Volunteers from Phase 1.
  *   **Question:** "Both volunteers maximized utility. Both left with the same snacks. Who is better off?"
  *   **Discussion:**
      *   Econ answer (Revealed Preference): Indifferent. They chose the same bundles.
      *   Phil answer (Mental State): Vol A is happier (got what they wanted). Vol B is a rule-follower (might be indifferent).
      *   **The Kicker:** "What if Vol B was following a rule because they believed Chocolate was poisonous but wanted to follow the TA's instructions?"
      *   **Point:** Revealed preference cannot distinguish between **Preference**, **Rule**, and **Belief**. It collapses them all into "Choice." This is fine for prediction, fatal for welfare analysis.

  ---

  ### **6. Debrief & Lecture Bridge (Minutes 55–75)**
  *   **Map the Game to Theory:**
      1.  **Phase 1 (Volunteers):** *Equifinality.* Same choice $\neq$ Same preference. Utility is a "black box."
      2.  **Phase 2 (Case A):** *Rationalization.* Any consistent data can be fit by a complex utility function. "Utility" risks becoming a tautology (a rescue device).
      3.  **Phase 2 (Case B):** *Falsifiability.* The theory only has bite when it says "No." (WARP/SARP). The axioms are the empirical content.
      4.  **Phase 3 (Welfare):** *Normativity.* If utility is just "whatever explains choice," it cannot tell us who is *happier*, only who is *consistent*.
  *   **Closing:** "Next week, we formalize the axioms you just broke in Case B. But remember: you can always fit a curve to data. The hard part is knowing when the curve is lying to you."

  ---

  ### **7. Handout Content (Exact Text)**

  **Handout 3: Case Files**
  > **Case File A (The Chameleon)**
  > *   **Obs 1:** Prices $(1, 1)$, Income $2$. Bundle Chosen: $(2, 0)$.
  > *   **Obs 2:** Prices $(2, 1)$, Income $2$. Bundle Chosen: $(0, 2)$.
  > *   **Obs 3:** Prices $(1, 1, 1)$, Income $2$. Bundle Chosen: $(1, 1, 0)$.
  > *   *Task:* Write $U(x, y, z)$.
  >
  > **Case File B (The Cyclist)**
  > *   **Obs 1:** Choose $A$ from $\{A, B\}$.
  > *   **Obs 2:** Choose $B$ from $\{B, C\}$.
  > *   **Obs 3:** Choose $C$ from $\{A, C\}$.
  > *   *Task:* Write $U(A, B, C)$.

  ---

  ### **8. Troubleshooting: What Will Go Wrong**

  | Problem | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **The Know-It-All** | An Econ major shouts "That's a WARP violation!" in Minute 35. | **Script:** "Exactly. Hold that term. Write it down. I want the Philosophy majors to feel *why* it breaks before we name it. We'll unpack the name in 10 minutes." |
  | **The Snack Trading** | Students trade Lab Dollars or snacks during the game. | **Rule:** "Lab Dollars are non-transferable. If I see trading, your portfolio is liquidated (confiscated)." Enforce this lightly but visibly. |
  | **The Allergy** | Someone realizes they can't eat the snacks at redemption. | **Prep:** Have a backup "Universal Reward" (e.g., extra credit point or candy that is nut-free/gluten-free certified). Ask via email 24h prior. |
  | **The Bored Phil Major** | "I don't care about the points." | **Stakes:** Make the redemption public. "Top 3 portfolios choose first from the snack box." Social pressure works better than candy. |
  | **The Volunteer Flub** | Volunteer B forgets their rule and picks randomly. | **TA Safety:** Stand near the volunteers. If they hesitate, whisper the rule. If they mess up, say "Interesting! That's actually *more* data for us to analyze," and pivot to how noise affects theory. |
  | **Time Creep** | Phase 2 (Rationalization) takes too long. | **Cut:** If running late, skip the "Case A" discussion and focus entirely on "Case B" (The Impossible). The "Impossible" point is more critical than the "Weird" point. |

  ---

  ### **9. Honest Limitations (What You Must Say Out Loud)**
  *This game cannot deliver the following. Do not try to force it. Acknowledge these gaps in the Debrief.*

  1.  **Interpersonal Comparison:** The game shows two people making the same choice, but it cannot prove one is *happier*. You have to state clearly: "RPT explicitly forbids us from comparing Vol A and Vol B's happiness. That is a feature, not a bug, for positive economics, but a bug for normative philosophy."
  2.  **Dynamic Consistency:** The game is one-shot. It doesn't capture addiction or habit formation (where past choices constrain future utility). You'll need to lecture this.
  3.  **The "As-If" Defense:** Students might argue, "It doesn't matter *why* they chose, as long as they act *as if* they maximize." The game shows why this is unsatisfying for welfare, but you need to explicitly articulate Friedman's defense in the lecture to balance the critique.
  4.  **Probability/Risk:** This is a deterministic game. It doesn't touch on Expected Utility or risk aversion, which is where "utility" gets even weirder. Keep the scope to ordinal preference this session.

  ### **10. TA Script for the "Fishy" Moment (Minute 30)**
  *When they are struggling to fit a function to Case File A:*
  > "Notice what you're doing. You're adding variables. 'Utility depends on variety.' 'Utility depends on the menu.' You are saving the theory by making the preference relation more complex. Ask yourself: If I can explain *any* pattern of choice by inventing a new preference, is the theory telling me anything about the world? Or is it just a language for describing what already happened?"

  ### **11. TA Script for the "Bite" Moment (Minute 40)**
  *When they fail Case File B:*
  > "Stop trying to fix the function. You can't. This is the only moment the theory fights back. The theory says: 'If you choose A over B, and B over C, you *cannot* choose C over A.' That restriction is the entire empirical content of Rational Choice Theory. Everything else is just math decoration."
