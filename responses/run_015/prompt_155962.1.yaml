      *   *Analysis:* "Arises from complex organization" sounds like a crane. "Brute, further irreducible fact" sounds like a skyhook (or at least a "hard problem" move).
      *   *Dennett's View:* Dennett denies brute irreducibility. He thinks consciousness *is* the functional organization (illusionism/multiple drafts). To say it's a *further fact* is to posit a skyhook (a "miracle" of emergence).
      *   *The Test:* Does the explanation reduce the *work* done by the phenomenon to the parts, or does it posit a new *kind* of existence that the parts don't account for?
      *   *Implication:* If the distinction classifies "brute emergence" as a skyhook, it does heavy lifting. If it classifies it as a crane just because it's "physical," it loses bite. For Dennett, *irreducibility* is the marker of the skyhook.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the user's sharp instincts (they are correct on both worries).
      *   **Section 1: Clause-by-Clause Audit:** Break down the text provided. Label each part (Accurate, Simplification, Misrepresentation, Wrong). Explain *why*.
