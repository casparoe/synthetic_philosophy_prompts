  Based on your professor's track record, she is not adhering strictly to a single textbook definition (like pure BSC or PSC) but is applying a **Cohesion/Lineage-based heuristic** that prioritizes *natural* evolutionary trajectories over morphological similarity or laboratory potential.

  Here is the breakdown of how her precedents apply to the xeno-yeast case.

  ### 1. Concept Predictions
  *   **Biological Species Concept (BSC):** Predicts **Separate Species**. The BSC defines species by reproductive isolation. Since the xeno-yeast produces sterile offspring when mating with wild yeast, gene flow is effectively blocked. This matches Case 1 (Frogs) where inviable hybrids led to a "separate" verdict.
