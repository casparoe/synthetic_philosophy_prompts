  *   **Ecological Species Concept (ESC):** Predicts **Separate Species**. The yeast occupies a "totally synthetic niche" distinct from the wild yeast. This matches Case 5 (Bacteria), where distinct niches led to a "separate" verdict despite genetic similarity.

  ### 2. Closest Analog
  The closest analog is **Case 1 (Island Frogs)**.
  *   **Reasoning:** In Case 1, organisms *could* encounter each other, but the resulting hybrids were inviable. In the yeast case, mating *can* occur, but the hybrids are sterile. Both represent **post-zygotic reproductive isolation**. While Case 5 (Bacteria) is also relevant due to the niche argument, the sterility mechanism in the yeast is a direct parallel to the hybrid inviability in the frogs.

  ### 3. Analysis of Her Implicit Rule
  Your professor is implicitly running a **Natural Cohesion Rule** (a variant of the Cohesion Species Concept).
  *   **Evidence:**
      *   She prioritizes *natural* interaction over *lab* potential (Case 5: Bacteria swap DNA in lab but not nature -> Separate).
      *   She prioritizes *connectivity* over terminal differences (Case 4: Ring species -> One, because the chain of gene flow exists).
      *   She prioritizes *isolation* over morphology (Case 3: Cryptic beetles -> Separate).
  *   **Application to Yeast:** The yeast lacks cohesion with the wild population (sterility blocks gene flow) and has a distinct evolutionary fate (synthetic niche). Even though it is engineered, its *current* biological reality mirrors natural speciation events (isolation + distinct niche).

  ### 4. Predicted Verdict & Underdetermination
  **Predicted Verdict:** **Separate Species.**
  *   **Reasons:** To remain consistent with Case 1 (Frogs) and Case 5 (Bacteria), she must acknowledge that reproductive isolation and ecological distinctness define the boundary, regardless of origin. Calling it a "variant" would contradict her handling of the bacteria (Case 5), where niche and natural exchange mattered more than genetic similarity (16S rRNA).
  *   **Underdetermination:** The only variable not present in her previous list is **Artificial Origin**. All previous cases were natural populations.
      *   **If she rules "Variant":** She is adopting **Origin Essentialism**. She believes species are "natural kinds" and artifacts cannot qualify, regardless of their biological properties.
      *   **If she rules "Separate Species":** She is adopting **Functionalism/Process Ontology**. She believes species status is determined by current evolutionary processes (isolation, niche) regardless of how the lineage began. Given her focus on "in nature" vs "in lab" in Case 5, Functionalism is more likely.

  ### 5. Tie-Breaker Hypothetical
  To definitively prove whether she follows Functionalism (Current Traits) or Origin Essentialism (History), you would need a case where traits and origin conflict.

  **Tie-Breaker Case:** A **naturally occurring polyploid yeast strain** arises in the wild via spontaneous mutation. It is reproductively isolated from parent yeast (sterile hybrids) and occupies a slightly distinct niche, but is genetically very similar otherwise.
  *   **Why it breaks the tie:** If she calls the *natural* polyploid a "species" but the *engineered* xeno-yeast a "variant," she is secretly an Origin Essentialist. If she treats them identically, she is consistently Functionalist.

  \answer{Separate Species | Case 1 (Island Frogs) | Natural Cohesion/Lineage | Natural polyploid yeast}
