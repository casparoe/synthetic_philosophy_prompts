answer: |-
  ### Brainstorm: Selecting the Moral

  Here are the four morals this session could end on:

  1.  **Utility must be bounded:** (Cramer's solution). If utility grows slower than the payoff, EV converges.
  2.  **Expectation is the wrong summary statistic:** (Ergodicity/Median). The mean describes parallel worlds; the median/time-average describes your life.
  3.  **The norm was never meant to govern one-shot gambles:** (Ecological Rationality). EV maximization is for institutions, not individuals.
  4.  **The "Tail" Problem:** The expectation is mathematically valid but decisionally irrelevant because it is constituted by events with probability effectively zero.

  **Selection:** I recommend **Moral #2 (Expectation is the wrong summary statistic)**, supported by **#4**.
  **Reasoning:** A first-year student can carry #2 out of the room. It gives them a heuristic they can apply elsewhere (finance, policy, life): *"If the average depends on a miracle, don't trust the average."* Moral #1 is too technical (requires discussing boundedness axioms). Moral #3 is too philosophical for a Rational Choice core. Moral #2 allows you to address the "long-run" confusion directly and converts the "casino can't pay" smugness into a insight about *probability mass* rather than *solvency*.

  ---

  ### The Game: Pressure-Test and Revision

  **Your Candidate:** A casino with finite assets $C$, capped payoff.
  **The Worry:** You are right to worry. If $C$ is "realistic" (e.g., \$1 billion), the Expected Value (EV) is roughly $\log_2(10^9) \approx \$30$. Students will say, "Problem solved, it's worth \$30," and disengage. If you then switch to a "Super" payoff to break Log Utility, it feels like moving the goalposts.

  **The Revision:**
  Keep the **Coin Toss** as the invariant mechanic. Do not change the game; change the *parameters of the universe* in three steps.
  1.  **Phase 1 (The Smugness Trap):** The Casino has Global Wealth ($W \approx 10^{14}$). Payoff is $\min(2^k, W)$.
      *   *Result:* EV is still only ~\$47.
      *   *Point:* Validates their intuition (real casinos cap out), but shows the EV is *still* surprisingly low despite the cap being astronomical.
  2.  **Phase 2 (The Utility Fix):** Remove the cap (Idealized Casino). Payoff $2^k$. Apply Log Utility $U(x) = \ln x$.
      *   *Result:* Expected Utility is finite.
      *   *Point:* Recap the previous lecture's solution.
  3.  **Phase 3 (The Stress Test):** Keep Idealized Casino. Change Payoff to $2^{2^k}$ (Menger's modification).
      *   *Result:* Expected Log Utility $\sum \frac{1}{2^k} \ln(2^{2^k}) = \sum \frac{1}{2^k} 2^k \ln 2 = \infty$.
      *   *Point:* Log utility solves *this* paradox, but not *all* divergent games. For any unbounded utility function, there exists a payoff schedule that breaks it.

  **Why this works:** It keeps the *game* (coin toss) constant. The "rigged" feeling is mitigated by framing Phase 3 not as "a new game" but as a "stress test" of their proposed solution (Log Utility). You are asking: "Does your fix hold water under pressure?"

  ---

  ### Teaching Plan: The Arc (45 Minutes)

  **00:00 – 05:00 | Hook & The Smugness Pivot**
  *   **Action:** Acknowledge the "No real casino can pay" comment from last time. Write "Global Wealth (\$100 Trillion)" on the board as the Casino's Cap.
  *   **Calculation:** Quickly walk through the EV of the capped game. $\sum_{k=1}^{46} \frac{1}{2^k} 2^k + \sum_{k=47}^{\infty} \frac{1}{2^k} 10^{14}$.
  *   **Result:** The EV is roughly \$47.
  *   **Dependency:** Must establish that even with an absurdly high cap, the EV remains human-scale.
  *   **Goal:** Convert smugness ("It's not infinite") into curiosity ("Why is it still so low?").

  **05:00 – 15:00 | The Utility Relocation**
  *   **Action:** Remove the cap. Return to the Idealized St. Petersburg game ($2^k$). Recap the Log Utility solution from the previous lecture.
  *   **Narrative:** "Last time we said: Money isn't utility. Log utility makes the price finite."
  *   **Dependency:** Students must accept Log Utility as the current "best answer."
  *   **Goal:** Set up the target for the next segment.

  **15:00 – 25:00 | The Counter-Attack (Menger)**
  *   **Action:** Keep the Idealized Casino. Change the payoff schedule to $2^{2^k}$. (Heads on 1st: \$4, 2nd: \$16, 3rd: \$256...).
  *   **Calculation:** Ask them to compute Expected *Log* Utility. $\ln(2^{2^k}) = 2^k \ln 2$. The sum becomes $\sum \frac{1}{2^k} 2^k = \sum 1 = \infty$.
  *   **Narrative:** "You thought Log Utility solved the paradox. I just broke it. For any unbounded utility function, I can write a payoff schedule that diverges."
  *   **Dependency:** Must show that the *mathematical form* of the solution (bounded utility) is the only thing that works, not the specific Log function.
  *   **Goal:** Establish that the Utility move *relocates* the difficulty (from payoffs to utility functions) rather than dissolving it.

  **25:00 – 35:00 | The Tail & The Long Run (The Core)**
  *   **Action:** Address the "Long Run" confusion. Draw the distribution. Show that 50% of the time, the payoff is \$2 or less. 75% of the time, \$4 or less.
  *   **Narrative:** "The EV is infinite. The Median is \$2. The expectation sits entirely in a tail you will never see."
  *   **Dependency:** Must have established that the EV is mathematically infinite (Phase 2) but experientially irrelevant.
  *   **Goal:** Shift the norm from "Maximize Expectation" to "Question the Statistic."

  **35:00 – 40:00 | The Portfolio Correction (Friend's Claim)**
  *   **Action:** Address the "If I play $n$ times I get rich" claim.
  *   **Narrative:** "Your friend says $n$ plays are worth $n \times$ Price. Actually, the value of $n$ tickets grows slower than $n$." (Use the Feller result loosely: Fair price for $n$ games $\approx \log_2 n$, so per-game value drops).
  *   **Dependency:** Must have established that single-play EV is misleading.
  *   **Goal:** Kill the "Law of Large Numbers will save me" intuition.

  **40:00 – 45:00 | Conclusion & Exit Question**
  *   **Action:** Summarize. Pose the Exit Question.
  *   **Goal:** Assess understanding.

  ---

  ### Misconception Map (Sequenced)

  1.  **"Nothing here because no real casino can pay."**
      *   *Location:* 00:00 – 05:00.
      *   *Handling:* Validate partially (yes, caps exist), but show the EV is low *even if* the cap is global wealth. This converts a factual objection into a probabilistic insight.
  2.  **"Utility is a psychological fudge / Risk aversion is irrational."**
      *   *Location:* 05:00 – 15:00.
      *   *Handling:* Frame Utility not as "how money feels" but as a consistency constraint for ranking gambles. If you reject Log Utility, you must propose a different ranking norm.
  3.  **"The Utility reply settled it, so on to the next topic."**
      *   *Location:* 15:00 – 25:00.
      *   *Handling:* Use the Menger modification ($2^{2^k}$) to prove that *any* unbounded utility function fails. The settlement was provisional, not final.
  4.  **"Expected Value just is the long-run average, so I'll get rich."**
      *   *Location:* 25:00 – 35:00.
      *   *Handling:* **Crucial Classification:** This student is confusing *Ensemble Average* (mean across parallel worlds) with *Time Average* (mean across one life). They are "onto something" (EV *does* describe parallel worlds) but "confused" (we live sequentially). The correction belongs here, in the Tail section. Explain that the Law of Large Numbers requires a finite mean; here, the sample mean does not converge to the population mean.
  5.  **"We should therefore maximize the median."**
      *   *Location:* 35:00 – 40:00.
      *   *Handling:* Don't endorse Median Maximization as the new dogma (it has its own pathologies). Endorse it as a *heuristic* for heavy-tailed one-shot decisions.
  6.  **"Rational Choice Theory is refuted / Math can't be trusted."**
      *   *Location:* 40:00 – 45:00.
      *   *Handling:* Conclude that the *norm* (EV) is context-sensitive, not that the *math* is wrong. The math correctly identifies the tail; the error is applying the summary statistic to the wrong context.

  ---

  ### Clarification: The Long Run & The Friend's Claim

  **The Student's Claim:** "Infinite EV means if I keep playing I will eventually be rich."
  *   **Verdict:** Confused.
  *   **The Math:** For the St. Petersburg Paradox, the Strong Law of Large Numbers does **not** apply because the expectation is infinite. The sample mean $\frac{1}{n}\sum X_i$ does not converge to a constant; it fluctuates wildly and grows without bound, but *extremely* slowly.
  *   **The Reality:** The *Time Average* (geometric growth rate) is finite. In a sequential betting scenario, your wealth grows at a rate determined by the geometric mean, not the arithmetic mean. The student is treating an ensemble statistic as a time statistic. This is the **Ergodicity Problem**.
  *   **Placement:** This correction belongs in the **25:00 – 35:00** block. It is the pivot from "Math is broken" to "We are using the wrong average for time."

  **The Friend's Claim:** "A package of $n$ plays is not worth $n$ times the single-play price... total worth grows like $n \log n$."
  *   **Verdict:** Roughly right, but needs careful phrasing.
  *   **The Math:** (Feller, Vol 1). For $n$ independent St. Petersburg games, the "fair" total entrance fee $E_n$ scales as $n \log_2 n$.
      *   *Wait, check:* If Total Worth $\approx n \log n$, then Per-Game Worth $\approx \log n$. This *diverges* as $n$ increases.
      *   *Correction:* Actually, the standard result is that the fair price *per game* if you play $n$ times is roughly $\log_2 n$. So the *total* price is $n \log_2 n$.
      *   *Pedagogical Value:* This shows **Sub-Additivity of Value**. $Value(n \text{ games}) < n \times Value(1 \text{ game})$ if we define Value(1) as infinity? No, that's messy.
      *   *Better Framing:* "If you play 1 game, the 'fair' price is undefined/infinite. If you play 1,000,000 games, the fair price *per game* is only about \$20."
      *   *Does it earn its minutes?* **Yes.** It kills the "I'll play until I win" strategy. It shows that buying more tickets doesn't linearly increase your safety; the "infinite value" is so diluted in the tail that even a million plays don't guarantee a windfall.
      *   *Placement:* **35:00 – 40:00**. Use it to support the "Tail" argument. "Even if you buy a million tickets, the price per ticket is low. Why? Because the infinite value is in the one ticket out of a million that hits the tail. You still probably won't hold that ticket."

  ---

  ### Closing: The Exit Question & Declined Explanations

  **The Exit Question:**
  *"I offer you a ticket to this game. I tell you the Expected Value is infinite. I also tell you that 99% of the time, you will win less than \$100. Do you buy it for \$50? Why?"*

  *   **Rehearsed Answer:** "No, because utility is logarithmic / bounded." (This recites the fix without understanding the problem).
  *   **Understanding Answer:** "No, because the Expected Value is driven by outcomes I will almost certainly not experience. The statistic describes the casino's risk across all customers, not my return in this one life." (This identifies the *authority* problem of the expectation).

  **Declined Explanations (Say these out loud):**
  1.  **"I am not proving the scaling laws."** Tell them you are stating the Feller/Ergodic results as facts. Proving the convergence rates requires measure theory they don't have yet.
  2.  **"I am not distinguishing between 'approaching infinity' and 'being infinite'."** In this context, the distinction doesn't change the decision problem.
  3.  **"I am not deriving Expected Utility Theory."** We are taking EU as a given tool to test, not deriving it from axioms today.
  4.  **"I am not solving the 'Bounded Utility' debate."** Whether utility *ought* to be bounded is a philosophical question for a later seminar; today we ask what happens if it *isn't*.

  **Am I being too cautious?** No. In a 45-minute first-year class, technical proofs of convergence kill intuition. Your goal is *conceptual displacement* (moving them from EV to Tail-awareness), not *technical mastery*. Acknowledging the simplification builds trust.
