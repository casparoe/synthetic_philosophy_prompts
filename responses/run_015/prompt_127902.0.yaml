answer: |-
  Right. Pull up a chair. I've got my coffee, I've got the file open, and I've got that familiar headache that sets in right around the time we realize there's no clean way out of this one. You're right to pause. If we rule on this without a stated principle, we're just guessing, and the next board will spend ten years untangling our logic.

  I've spent the last twenty minutes staring at the six precedents you listed, looking for the seam where they stitch together. It's tempting to say we just "follow the archives," but Case 2 (the Festival) and Case 5 (the Statue) kill that theory immediately. We didn't cancel the festival; we didn't melt the statue. But Case 1 (the Fire Plaque) and Case 6 (the Common Land) show we *will* crush a memory if it contradicts a hard document or a property right.

  So, we aren't Archivists, and we aren't Populists. We're something in between. Here is the free-form brainstorming on the rule sets that could possibly govern this mess.

  ### Part 1: Three Candidate Rules

  **Rule Set A: The "Evidentiary Hierarchy with a Silence Exception"**
  *   **The Logic:** The Archive is the default truth. Memory is only admitted as evidence when the Archive is silent, destroyed, or demonstrably biased (e.g., state propaganda).
  *   **Fits Precedents:**
      *   *Case 1 (Fire):* Archive existed, memory overruled.
      *   *Case 3 (Deported Families):* Archive burned, memory accepted.
      *   *Case 4 (Strike):* Archive showed state bias, institutional memory overruled.
      *   *Case 6 (Common Land):* Deeds (Archive) overruled communal memory.
  *   **Strains:**
      *   *Case 2 (Festival):* We knew the battle was elsewhere (Archive spoke), but we didn't stop the festival. We just added a panel.
      *   *Case 5 (Statue):* We knew the name was wrong (Archive spoke), but we kept the statue.
  *   **Verdict:** This rule explains when we *correct* facts, but fails to explain when we *preserve practices*.

  **Rule Set B: The "Consequentialist Memory" Rule**
  *   **The Logic:** Factual accuracy is secondary to the social function of the memory. If a false memory inspires good (rescue networks), builds community (festivals), or harms no one, it is preserved but annotated. If it causes harm (false accusation, property infringement), it is removed.
  *   **Fits Precedents:**
      *   *Case 2 (Festival):* Civic cohesion > geographical accuracy.
      *   *Case 5 (Statue):* Inspiration of rescue network > biographical accuracy.
      *   *Case 1 (Fire):* False accusation of soldiers = Harm. Remove.
      *   *Case 6 (Common Land):* Infringement on private owner = Harm. Remove.
  *   **Strains:**
      *   *Case 4 (Strike):* The museum display was removed not just because it was harmful, but because it was *institutional lying*.
      *   *Case 3 (Deported Families):* We accepted their memory not because of its "consequence," but because they had no other recourse.
  *   **Verdict:** This explains why we keep the statue and the festival, but it risks making us utilitarians rather than historians.

  **Rule Set C: The "Stakeholder Deference" Rule**
  *   **The Logic:** Whose memory is it? If the memory belongs to the victims or the marginalized (Case 3), it gets high deference. If it belongs to the institution or the general public (Case 2, 5), it gets low deference and must yield to the Archive. If it belongs to a third party being accused (Case 1), it is rejected.
  *   **Fits Precedents:**
      *   *Case 3:* Descendants' memory accepted.
      *   *Case 4:* Institution's memory rejected.
      *   *Case 1:* Soldiers (third parties) protected against town memory.
  *   **Strains:**
      *   *Case 6:* We rejected the neighbourhood association (marginalized community?) in favor of the deed holder.
      *   *Case 5:* We kept the town's memory of the rescuer, potentially overriding the real rescuer's family (though their stance is unknown).
  *   **Verdict:** This is the moral heart of our work, but it clashes with property law (Case 6).

  ---

  ### Part 2: Applying the Rules to the Dawn Walk

  Here is where the headache starts. Let's run the new case through the three filters.

  *   **Under Rule A (Hierarchy):** The Archives (transport/burial) are clear. The Meadow is not the site. The Walk is based on a factual error. We must officially designate the Gravel Pit as the site. The Meadow walk becomes historically unsupported.
  *   **Under Rule B (Consequentialist):** The Walk is the town's biggest civic event. It includes descendants (even if from other districts). It creates cohesion. Moving it might kill the attendance. *However*, the Land Buyer is being harmed (property devalued/blocked), and the Actual Descendants are being harmed (marginalized). The "Good" is shaky.
  *   **Under Rule C (Stakeholder):** The Actual Descendants of the 41 are the primary stakeholders. They want the move. The Town Association are secondary stakeholders (custodians of ritual). The Descendants should win.

  **The Prediction:**
  *   **Rule A** says: Move the ceremony. Put a sign at the Meadow saying "Site of Former Belief."
  *   **Rule B** says: Keep the ceremony at the Meadow (too much social capital), but build a massive memorial at the Gravel Pit.
  *   **Rule C** says: Move the ceremony. The victims' kin outrank the town's tradition.

  ---

  ### Part 3: My Recommendation

  I'm going to commit to a position. We should **relocate the official commemoration to the Gravel Pit, but designate the Meadow as a Site of Secondary Memory.**

  **The Principle:** *Archival truth governs the location of remains; Victim Primacy governs the location of mourning.*

  **Why?**
  Case 3 is the closest analog, not Case 5. In Case 5 (the Statue), the "real" rescuer wasn't organized, and the myth *helped* people. Here, the myth *obscures* the specific victims. The Actual Descendants are marginalized (Case 3 status). To keep the walk at the Meadow is to prioritize the *Town's* feeling of piety over the *Families'* right to mourn at the actual grave. That violates the spirit of Case 3.

  However, we cannot simply ban the Meadow Walk (Case 2 precedent). The ritual has its own history now (60 years). It is a monument to *1985-2025 memory*, even if it fails as a monument to *1943 events*.

  **The Action Plan:**
  1.  **The Gravel Pit:** Install the primary marker. "Here lie the 41." The official dawn ceremony moves here. This satisfies Rule A (Archive) and Rule C (Descendants).
  2.  **The Meadow:** The Walk may continue, *but* the signage must change. It cannot say "Site of the Shooting." It must say "Site of Commemoration, 1965–Present." It becomes a monument to the town's act of remembering, not the event itself.
  3.  **The Buyer:** This is the Case 6 problem. The Court ruling blocks the road based on the belief. We are not a court. We cannot void the ruling. But by moving the *official* status to the Gravel Pit, we signal to the Buyer that the "sacred" status is transferable. We might negotiate: The town accepts the Gravel Pit as the heritage site; the Meadow is released from the "mass grave" restriction, allowing the sale, provided the "Site of Commemoration" plaque remains as a covenant.

  **Why this over the others?**
  If we keep the status quo (Rule B), we betray the Actual Descendants (violating Case 3). If we ban the Meadow Walk entirely (Strict Rule A), we destroy a 60-year civic ritual (violating Case 2). We must split the difference: Truth at the Pit, Memory at the Meadow.

  ---

  ### Part 4: The Sedimentation Point

  You asked about the archive holding documents that exist *because* of the false memory (news stories, court judgments, school books). This is the "Sedimentation Problem."

  **How a Record-First Rule treats this:**
  We must categorize these documents as **Evidence of Reception, not Evidence of Event.**
  A 1990 news article saying "41 died in the meadow" is a *true* record that "In 1990, the town believed 41 died in the meadow." It is a *false* record that "41 died in the meadow."

  Our Board's minutes need to explicitly state: *"The Court Judgment of 199X is accepted as legal fact regarding land use, but is not accepted as historical fact regarding the location of the shooting."*
  We do not purge these documents. That would be revisionism. We annotate them. In the finding aid, the tag changes from `Event: Shooting` to `Memory: Shooting Site (Disputed)`. We treat the sediment as geological strata—it tells us about the pressure of the memory, not the shape of the land beneath it.

  If we don't make this distinction, the memory becomes self-sealing. Every time someone cites the 1990 news clip, the memory gets harder. We have to break the loop.

  ---

  ### Part 5: The Test Case

  You want to know which single future case would best separate the surviving rules. You mentioned two options, but I think there's a sharper one.

  **The Test Case:** *A group of descendants discovers that their ancestors were NOT victims at the site, but perpetrators, yet the descendants wish to keep the memorial because it has become a site of reconciliation.*

  *   **Scenario:** A monument honors "Local Heroes of the Resistance." Archives prove they were actually collaborators who were later rebranded by the post-war government. The *current* descendants know this, but they argue the monument now serves as a place for the town to heal, and they want to keep the plaque as is.

  **Why this separates the rules:**
  *   **Rule A (Hierarchy):** Demands the plaque come down immediately. Truth is non-negotiable.
  *   **Rule B (Consequentialist):** Might keep it. If the "healing" function outweighs the historical error, the myth stays (like the Statue case).
  *   **Rule C (Stakeholder):** This is the wrench. If the *Descendants* (the primary stakeholders) *want* the false memory, do we overrule them? In our current Dawn Walk case, the descendants want the *truth*. If they wanted the *myth*, would we force the truth on them?

  **My take:** This is the only case that truly tests whether we serve History or the Living.
  *   If we remove the plaque against the descendants' wishes, we are **Archivists first**.
  *   If we keep the plaque with the descendants' consent, we are **Stewards of Social Peace first**.

  Given our track record (Case 1: Fire Plaque removed even though it likely offended the soldiers' memory; Case 4: Museum display removed despite institutional pride), I suspect we would remove it. We seem to have a "No False Accusations" and "No Institutional Lies" policy, but we haven't tested "No Comforting Lies for Victims."

  ### Final Thought

  You said you care less about which way we go than whether we can say what we're doing. I agree. The danger isn't moving the walk; the danger is moving it without admitting *why*.

  If we move it because "The Archive says so," we look like bureaucrats killing a tradition.
  If we move it because "The Families ask it," we look like a community respecting its dead.
  If we keep the Meadow as a "Site of Memory," we acknowledge that our town's history includes its mistakes.

  Let's draft the motion. I'll pour the coffee.
