      *   *Decision:* Move the formal commemoration to the Gravel Pit (Archival Truth + Descendant Wish). Allow the Meadow Walk to continue as a "Pilgrimage of Memory" (Civic Practice), but rebrand it explicitly as such, not as the execution site.
      *   *Wait, looking closer at Case 6:* We refused the sign because deeds showed private ownership. The Buyer wants to develop. If we keep the "martyr meadow" status, the Buyer is screwed (morally/politically), even if the Court ruling stands.
      *   *Revised Decision:* We must prioritize the *Actual Descendants* (Case 3) over the *Civic Association* (Case 2/5). The "Function" of the walk is community bonding, but it's bonding *over the graves of these specific people*. If the specific people's kin say "you're at the wrong grave," the kin win.
