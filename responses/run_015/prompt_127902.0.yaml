      *   *Candidate Rule 3: "Archival Floor, Civic Ceiling."* Facts cannot contradict the archive (Floor), but civic practice can exceed it *if* no specific rights are violated (Ceiling).

  5.  **Developing the Recommendation:**
      *   *The Conflict:* The "Victim Primacy" (Case 3) clashes with "Preserve Function" (Case 5). The actual descendants want the move. The town wants the stay.
      *   *The Sedimentation:* The court ruling is tricky. It relies on the memory. If we say the memory is false, does the court ruling collapse? We are a Board, not a Court. We deal with *markers and memory*, not title (though Case 6 touched on title).
