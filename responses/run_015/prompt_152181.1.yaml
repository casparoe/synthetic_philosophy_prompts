      *   *Decision:* **Start with the Essay's claim about "Duty to Self."** This creates the tension. Then use Bundle Theory to resolve it. This keeps the ethics central (which is the session topic) while using metaphysics as the tool.
      *   *Example:* The Candle Flame is good. Let's refine it to ensure it doesn't sound noble. It's just a chemical process.
      *   *Misconceptions:*
