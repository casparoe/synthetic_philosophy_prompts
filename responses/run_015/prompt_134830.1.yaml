  2.  **Brainstorming & Conceptual Clarification:**
      *   *Standard Kripkean Rigidity:* A name refers to the same object in all possible worlds where that object exists. The reference is fixed by an initial baptism (causal-historical chain), but once fixed, it doesn't depend on properties the object has in other worlds. "Hesperus" refers to Venus even in a world where Venus is invisible at dusk.
      *   *Conditional Rigidity (User's Definition):* Reference depends on the *conditions* of the original dubbing holding in the counterfactual world. If the perceptual access (seeing the evening star) isn't possible in world W, the name doesn't latch onto the original object in W. This sounds like a mix of causal theory and descriptivism. It makes reference world-relative in a way standard rigidity isn't.
