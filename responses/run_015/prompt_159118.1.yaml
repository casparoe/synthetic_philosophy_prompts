answer: |-
  Here is the reverse-engineering of Dave's decision matrix, the likely verdict on your bog plant, and the strategic advice for your grant justification.

  ### 1. Reverse-Engineering Dave's "Species Algorithm"

  Dave is not a purist for any single species concept (Biological, Phylogenetic, or Ecological). He is a **pragmatic conservationist** using a hybrid framework. Based on the eight precedents, here are the three rules he actually runs:

  **Rule 1: The Intrinsic Barrier Floor (BSC Leanings)**
  *   **Source:** Salamanders (2 spp), Fern (1 sp), Snake (Subsp), Dogs/Wolves (1 sp).
  *   **Logic:** If two populations meet and *intrinsically* cannot or do not exchange genes (due to genetics, chromosomes, or hard-wired behavior), they are species. If they *would* interbreed if not for geography (Snake) or simple domestication (Dogs), they are not.
  *   **Threshold:** Pre- or post-zygotic isolation must be intrinsic, not just ecological.

  **Rule 2: The Genomic Cohesion Threshold (The "Oak vs. Grass" Test)**
  *   **Source:** Oaks (2 spp) vs. Serpentine Grass (1 sp).
  *   **Logic:** If gene flow *is* occurring, you need **genome-wide divergence** to be considered separate species.
      *   *Oaks:* 95% distinct genome-wide + fertile hybrids = **Species.** (Selection maintains distinct clusters despite flow).
      *   *Grass:* Near-identical genome + adaptive islands + fertile hybrids = **Ecotypes.** (Divergence is restricted to the loci under selection; the genomic background is shared).
  *   **Threshold:** You cannot be a species if you are just a "few adaptive alleles on a shared genomic background."

  **Rule 3: The Lineage Stability Cap (Phylogenetic Pragmatism)**
  *   **Source:** Dandelions (1 sp), Snake (Subsp), Lake Sediment (Refused).
  *   **Logic:** A "listable species" must be a stable evolutionary lineage, not a transient adaptation or an asexual mess.
      *   *Polyphyly is fatal:* If the "trait" evolves repeatedly in different lineages (convergent evolution), it is an adaptation, not a lineage.
      *   *Time matters:* Species are things that exist in the present and can meet (no anagenesis).

  ---

  ### 2. The Verdict on Your Bog Plant

  **Prediction:** Dave will call this **One Species (Ecotypes).**
  **Confidence:** **70%** (It is a coin flip, but the weight leans heavily toward "Ecotype").

  **Why it fails the "Two Species" test:**
  1.  **The Genomic Architecture (The Killer):** Your description ("near-identical genome-wide, with all the differentiation bunched into a handful of regions") is a near-perfect match for the **Serpentine Grass** case. In Dave's logic, this defines an ecotype. The **Oak** case required 95% genome-wide distinctness to overcome the fact that they hybridize. Your plants lack that background divergence.
  2.  **The Polyphyly:** The fact that the "bog form" 25 km away is genetically closer to its local ridge population than to your bog population is devastating for a species claim. It proves the "bog-ness" is a labile adaptation that evolves repeatedly, not a unique evolutionary lineage. Dave lists lineages (Salamanders), not adaptations.
  3.  **The Barrier Type:** The reproductive isolation is **ecological** (pollinator preference), not **intrinsic**. The F1/F2s are fully fertile in the greenhouse. In the Snake case, he rejected geographic isolation. In the Grass case, he rejected ecological isolation (soil/flowering time) without genomic divergence. Your case is Grass + Pollinators. Unless the hybrids have *intrinsic* genetic incompatibilities (not just pollinator rejection), this falls under Rule 1's "Floor."

  **Why there is a 30% chance he calls it Two Species:**
  1.  **Hybrid Fitness:** In the Grass case, you didn't mention hybrid fitness. In your case, hybrids set **1/3 seed**. This is strong selection against intermediates. If Dave views this as "effective reproductive isolation" (functionally similar to the Salamanders), he might override the genomic similarity.
  2.  **The "Oak" Precedent:** If Dave prioritizes "Distinctness" over "Genomic Cohesion," the fact that the parent types stay recognizable despite the 8–10% gene flow mimics the Oaks.

  ---

  ### 3. The One Measurement to Make This Summer

  **Measure: Neutral Marker Divergence ($F_{ST}$) in the Contact Zone.**

  You need to know if the "near-identical genome" finding holds up under high-resolution scrutiny *specifically at neutral loci*.
  *   **The Goal:** You are trying to move your case from the **Serpentine Grass** bucket to the **Oak** bucket.
  *   **The Logic:** The Oak verdict hinged on "95% distinct genome-wide." Your current scan says "near-identical." If you can find *any* signal of genome-wide divergence at neutral markers (even if small), you can argue that these are diverging lineages with introgression (Oaks), not just plastic ecotypes (Grass).
  *   **The Method:** Sequence a set of putatively neutral loci (introns, intergenic regions) across the transect. If you find a bimodal distribution in neutral markers (two distinct genomic backgrounds mixing), you have "Genotypic Clusters." If the neutral markers are completely homogenized and only the adaptive loci differ, you are definitively an ecotype.

  **Why this matters:**
  If the neutral background is shared, Dave's Rule 2 (Genomic Cohesion) forces him to call it an ecotype. If there is *any* neutral structure, you can argue for the Oak precedent (Species with introgression).

  ---

  ### 4. The Hypothetical Case to Settle Dave's Rule

  If you ever get Dave in a room with a whiteboard, propose this scenario to force him to choose between the **Oak Rule** (Distinctness) and the **Grass Rule** (Genomic Cohesion):

  > *"Dave, imagine two populations of a flower. They look different, have different pollinators, and hybrids have 50% fitness. Genome scan shows they are identical at 99% of neutral loci, but fixed for different alleles at the 1% of loci controlling flower shape and scent. Is that one species or two?"*

  *   **If he says "Two":** He is running an **Ecological Species Concept**. Your bog plant is a species. You write the grant emphasizing the *hybrid fitness cost* and *pollinator isolation*.
  *   **If he says "One":** He is running a **Genotypic Cluster Concept**. Your bog plant is an ecotype. You need to change your grant strategy (see below).

  *Given the Grass verdict, he will almost certainly say "One."*

  ---

  ### 5. Strategic Advice for the Grant

  **The Hard Truth:**
  Based on the Serpentine Grass and Snake precedents, **you probably cannot justify this as a "Rare Species."** Dave views this as a common species exhibiting local adaptation. Listing "bog ecotypes" of a common plant would set a precedent he has explicitly avoided (see Dandelions).

  **The Pivot:**
  Do not try to force the "Species" square peg into the "Ecotype" round hole. If you write a weak species justification, Dave will reject it, and the trust loses the land. Instead, frame the justification around **Evolutionary Significant Units (ESUs)** or **Community Integrity**, if the grant allows.

  However, if the grant *strictly* requires a "Listable Species":
  1.  **Emphasize the Hybrid Breakdown:** Downplay the "fertile in greenhouse" result. Highlight the **66% fitness loss in the wild**. Argue that *effective* isolation is what matters for conservation, not *potential* isolation. (This tries to leverage the Salamander/Fern logic over the Grass logic).
  2.  **Find the Neutral Signal:** Use the measurement above. If you can show *any* neutral divergence, cite the **Oaks**.
  3.  **The "Distinct Population Segment" Angle:** If Dave won't budge on "Species," ask if this qualifies as a distinct population worthy of protection under the *spirit* of the list, even if not the letter. (This is a long shot with a bureaucrat, but Dave is a naturalist first).

  **Final Confidence Check:**
  I am **70% confident** Dave rejects the species claim. The combination of **Polyphyly** (bog form evolved twice) + **Genomic Islands** (Grass case) is a very strong signal for "Ecotype" in his framework. The only way to win is to prove the hybrid fitness loss is due to *intrinsic* genetic incompatibility, not just pollinator behavior.

  **One last check:** Can you test if the hybrids fail in the field *even if hand-pollinated*?
  *   If hand-pollinated hybrids in the field still set 1/3 seed: **Intrinsic/ Ecological barrier is strong.** (Better case).
  *   If hand-pollinated hybrids set full seed: **Isolation is purely pollinator preference.** (Grass case; weak case).
  *   **Do this test.** It is cheaper than genomics and directly addresses the "Intrinsic Barrier" rule.
