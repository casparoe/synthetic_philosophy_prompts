  1.  **Analyze the User's Position:**
      *   **Core Claim:** Linguistic relativity (Sapir-Whorf) is real but highly constrained.
      *   **Constraint 1 (Obligatoriness):** It only applies to *obligatory* grammatical categories (e.g., evidentiality, grammatical gender, tense), not just lexical gaps (e.g., missing color words).
