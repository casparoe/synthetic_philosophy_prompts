answer: |-
  Your instinct is correct: your reading group member is conflating **Causal Closure** with **Causal Exclusion**. Closure says the physical has a physical cause; Exclusion says it cannot *also* have a mental cause. Moving from the former to the latter requires hidden premises.

  Here is a menu of precisifications of the claim "The physical world is causally closed," analyzed by relata, strength, and status, followed by answers to your two specific questions.

  ### Part 1: A Menu of Precisifications

  **1. Strong Event Closure (Deterministic)**
  *   **Thesis:** Every physical *event* has a *sufficient* physical *cause* occurring at the same time or earlier.
  *   **Relata:** Events (token occurrences).
  *   **Strength:** Sufficiency (necessitation).
  *   **Status:** Metaphysical claim about the world.
  *   **Determinism:** **Yes.** This presupposes that every physical event is determined by prior physical states.
  *   **Evaluation:** **Likely False / Question-Begging.** Given standard interpretations of quantum mechanics (e.g., radioactive decay, neurotransmitter vesicle release), not every physical event has a *sufficient* prior physical cause. Asserting this begs the question against indeterminism.

  **2. Weak Event Closure (Probabilistic)**
  *   **Thesis:** Every physical *event* has a physical *cause* that fully determines the *objective probability* (chance) of that event occurring.
  *   **Relata:** Events and Chances.
  *   **Strength:** Probability-fixing (no causal gaps in the probability distribution).
  *   **Status:** Metaphysical claim.
  *   **Determinism:** **No.** Compatible with indeterminism.
  *   **Evaluation:** **Defensibly Substantive.** This is the most robust version for modern physics. It claims that while the outcome isn't fixed, the *odds* are fixed by physical history alone.

  **3. Property/Fact Closure (Supervenience-Based)**
  *   **Thesis:** Every instantiation of a physical *property* is metaphysically determined by the instantiation of prior physical *properties*.
  *   **Relata:** Properties / Facts.
  *   **Strength:** Determination/Grounding.
  *   **Status:** Metaphysical claim (often tied to Physicalism).
  *   **Determinism:** **Ambiguous.** Can be read deterministically or as probabilistic supervenience.
  *   **Evaluation:** **Substantive.** This shifts the focus from "causation" to "determination." It is harder to falsify empirically but relies on a specific metaphysics of properties.

  **4. Methodological Closure (Heuristic)**
  *   **Thesis:** Any complete *explanation* of a physical event can be given using only physical vocabulary and laws; positing non-physical causes is unnecessary for predictive success.
  *   **Relata:** Explanations / Theories.
  *   **Strength:** Normative / Epistemic.
  *   **Status:** Methodological claim about scientific practice.
  *   **Determinism:** **No.**
  *   **Evaluation:** **Near-Trivial.** This is essentially a definition of the project of physics. However, it is too weak to support metaphysical exclusion (just because we *can* explain it physically doesn't mean a mental cause *didn't exist*).

  ---

  ### Part 2: The Indeterminism Test

  **Suppose neurotransmitter release is indeterministic.** (i.e., Physical event $P$ has no sufficient physical cause, only a physical cause that fixes its chance at, say, 0.5).

  *   **Which readings survive?**
      *   **Strong Event Closure (1)** fails immediately. If there is no sufficient physical cause, this thesis is false.
      *   **Methodological Closure (4)** survives trivially (physics can still model the probability).
      *   **Weak Event Closure (2)** survives *if* the physical facts fix the chance at 0.5.

  *   **Do the surviving ones still do any excluding?**
      *   **Methodological Closure:** No. Just because physics doesn't *need* the mental to predict the probability doesn't prove the mental didn't influence it.
      *   **Weak Event Closure:** **Yes, but conditionally.**
          *   If "Closure" means the physical cause *exhausts* the determination of the chance, then a mental cause cannot also influence the chance. If your decision raised the probability of release from 0.5 to 0.7, Weak Closure is violated (because the physical prior state didn't fix the chance at 0.7).
          *   However, if "Closure" merely means there is *a* physical cause that contributes to the probability (without exhausting it), then mental causation is compatible. To do excluding work, Weak Closure must be read as: *The physical history fixes the chance, and nothing else can alter it.*

  **Verdict:** Indeterminism kills the "conversation-stopper" version of the argument (Strong Closure). It forces the argument onto Weak Closure, which requires a more nuanced defense regarding probability-fixing.

  ---

  ### Part 3: Is Closure Enough? (The Missing Premises)

  Your friend argues: *Grant Closure $\rightarrow$ Mental decision did nothing.*
  **This inference is invalid on every reading.** Closure alone is insufficient to reach his conclusion. It requires at least two extra premises, one of which is doing the heavy lifting.

  **1. The Premise of Distinctness (Non-Identity)**
  *   **Claim:** The mental cause (decision) is not identical to the physical cause (neural state).
  *   **Role:** If Mental = Physical (Identity Theory), then the physical cause *is* the mental cause. Closure is satisfied, and mental causation is real.
  *   **Contestability:** Highly contestable. Non-reductive physicalists argue for distinctness; reductive physicalists deny it.

  **2. The Exclusion Principle (Ban on Overdetermination)**
  *   **Claim:** If a physical event has a sufficient (or chance-fixing) physical cause, it cannot have a *distinct* non-physical cause.
  *   **Role:** This is the actual engine of the exclusion argument. Closure says the physical cause is there. Exclusion says that *because* the physical cause is there, there is no room for another.
  *   **Contestability:** **More contestable than Closure.**
      *   Why? Because systematic overdetermination is weird, but not impossible. More importantly, if mental properties *supervene* on physical properties, their causal powers may not be "competing" causes but rather the *same* causal power described at different levels. The Exclusion Principle assumes a "zero-sum" view of causation that many philosophers (e.g., compatibilists about levels) reject.

  ### Summary for Your Group

  Tell your friend that **Causal Closure** is the claim that *physics has the causal field covered*. **Causal Exclusion** is the claim that *there is no room for anyone else on the field*.

  1.  **If he means Strong Closure:** He is presupposing determinism, which is empirically dubious regarding neural firing.
  2.  **If he means Weak Closure:** He still needs to prove that fixing the *probability* excludes mental influence on that probability.
  3.  **The Real Work:** The move from "Physical cause exists" to "Mental cause did nothing" relies on the **Exclusion Principle** (no overdetermination). This principle is far more controversial than Closure itself. Many argue that if the mental supervenes on the physical, the causal relation is not competitive (overdetermination) but constitutive.

  **Recommendation:** Shift the discussion from Closure (which most physicalists grant) to the **Exclusion Principle** and the **Nature of Distinctness**. That is where the actual philosophical battle lies.
