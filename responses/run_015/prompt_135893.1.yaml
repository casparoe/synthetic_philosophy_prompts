prompt: |-
  I’m prepping questions for a podcast interview with a philosopher who defends a kind of dynamic masking view about dispositions. She thinks the usual Martin-style fink cases miss something important: they treat the mask as static, but actually masks can be temporally layered, so a disposition gets finked, unfinked, and refinked in quick succession. She applies this not just to physical stuff but also to what she calls behavorial dispositions in LLMs—like a model’s tendency to answer honestly being masked by its training context, then unmasked by prompt engineering, then masked again by a jailbreak attempt.

  Can you draft 8-10 questions? I want them to actually press her, not just have her restate the view. I need at least one on why she thinks Martin’s original electrofink example fails to capture this temporal layering, one on how her view handles the antidote problem when the antidote itself can be finked, and one on what she means by saying LLMs have dispositional profiles rather than single dispositions. For each, include a follow-up keyed to the answer she’ll probably give—e.g., if she claims temporal layering solves the fink problem, ask whether that just pushes the issue up to the meta-disposition level.

  No need for citations or reading lists—she’ll be right there in the room. Just make sure the questions sound like they come from someone who’s actually read the literature and isn’t afraid to push back.
