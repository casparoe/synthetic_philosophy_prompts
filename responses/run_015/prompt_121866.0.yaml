prompt: |-
  After an extended argument with a friend over whether mental content can be naturalized without circularity, I want to see if teleosemantics—the view that representational states derive their content from evolutionary proper functions and that misrepresentation consists in the disruption of those functions—can be rendered in the vocabulary of distributed systems engineering without leaving philosophical residue behind. My friend reasons exclusively in terms of nodes, error-correction protocols, consensus mechanisms, handshake corruption, redundancy design, and signal degradation across noisy channels. Restate the core teleosemantic account—including the distinction between mere indicative correlation and genuine representational content, the possibility of misrepresentation despite sustained correlation, and the normative claim that a mental state is "supposed" to indicate a particular condition—entirely within that framework, mapping evolutionary selection onto protocol specification or adaptive redundancy, and representational failure onto corrupted handshakes or consensus breakdown. Then provide the residue report: which elements translate precisely, which require distorting engineering concepts to accommodate teleological normativity, and which have no analog at all. Specifically, address whether the normative dimension—that a signal ought to carry a particular content in virtue of its evolutionary history—survives translation into specifications that are normatively inert except for an engineer's design intention. Is the missing residue evidence that teleosemantics implicitly borrows designer-based teleology, or does it show that distributed-systems vocabulary lacks resources for historical, non-intentional normativity? Keep the translation honest: do not import philosophical distinctions under engineering labels, and do not cite particular philosophers or texts.
