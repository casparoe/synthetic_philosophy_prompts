  **Alternative B: "Institutional Risk Management"**
  *   **The Logic:** The primary duty is to the Certification Label's market position and legal safety. Welfare rules are adopted only if they enhance brand reputation without creating liability or supply chain friction.
  *   **Fits Record Because:** Explains the Stocking Density vote (cost threatens adoption). Explains the Ablation vote (anaesthesia threatens hatchery participation). Explains the Octopus vote (too risky to certify).
