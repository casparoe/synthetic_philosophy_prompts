  Here is the analysis of your friend's decision matrix, the rules that fit her record, and how to test them.

  ### 1. The Rule She Is Running (and Her Votes)

  **The Rule:** **"Feasible Precaution."**
  This is the principle she believes she is following. It holds that welfare interventions are mandatory when two conditions are met: (1) the evidence of sentience/suffering crosses a pragmatic threshold (not necessarily scientific certainty, but enough to warrant care), and (2) the economic cost of mitigation does not threaten the viability of the certification label or the producers.

  This rule reconciles her record:
  *   **Salmon/Crab:** High sentience confidence + feasible mitigation = **Protect.**
  *   **Shrimp (Past):** Sentience plausible + mitigation too expensive/complex = **Defer.**
  *   **Ablation:** Sentience high + anaesthesia technically unavailable = **Phase-out only.**
  *   **Octopus:** Sentience high/complex + welfare guarantees impossible = **Exclude.**
  *   **Insects:** Sentience uncertain + data missing = **Wait.**

  **Prediction for the Two Votes:**
  1.  **Require Stunning?** **YES.**
      *   *Reasoning:* The historical barrier for shrimp was cost and scalability (ice slurry was the "feasible" option). With the cost barrier removed (1–2%) and the tech scalable, the "Feasibility" condition is now met. The evidence (grooming, avoidance) now matches the Crab precedent she already accepted.
  2.  **Accept Behavioral Validation?** **YES.**
      *   *Reasoning:* She voted against anaesthesia for ablation because "there's no approved product." Here, there *is* a product. Demanding neurophysiological validation (which doesn't exist yet) would functionally kill the rule, violating the "Feasibility" constraint. She prefers an imperfect protection (behavioral) over no protection (status quo), consistent with the Crab vote where behavioral evidence sufficed.

