  ### 2. The Alternative Rules (and Where They Split)

  These rules fit her past votes equally well but generate different outcomes on the shrimp case.

  **Alternative A: "Neuro-Conservatism"**
  *   **The Logic:** Invertebrate protection is derivative. It requires either vertebrate-like CNS architecture or pain behaviors that are unmistakable and distinct from reflex (e.g., rubbing a wounded claw vs. loss of tail flip). If the mechanism of insensibility cannot be physiologically distinguished from paralysis, the intervention is invalid.
  *   **Fits Record Because:** Explains the Salmon/Cleaner Fish (vertebrates) vs. Bivalves (no CNS) split. Explains the Octopus exclusion (complex but unprovable welfare). Explains the Insect hesitation ("come back with data").
