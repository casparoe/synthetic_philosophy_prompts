  ### 3. The Discriminating Case

  You have three candidates. The one that best discriminates between **Feasible Precaution** (Her Rule), **Neuro-Conservatism**, and **Institutional Risk** is:

  **The Case:** **A near-costless kill method for the feed insects (black soldier fly).**

  **Why this discriminates best:**
  *   **Feasible Precaution (Her Rule):** Must vote **YES.** The cost is near-zero (feasibility met), and she admitted the numbers are "scary" (aggregate welfare gain is enormous). To vote No would reveal that "Feasibility" is a sham and she actually holds a hierarchy view.
