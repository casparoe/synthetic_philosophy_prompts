answer: |-
  Step (4) is the critical failure because it forces a false dichotomy between infinite exception lists and outcome-based meta-rules, overlooking the possibility of hierarchical duty structures that resolve conflicts without calculating net utility.

  Your argument assumes that the only way to handle moral exceptions is either exhaustive specification or utilitarian calculation, but this ignores the concept of *prima facie* duties. In this framework, rules are not absolute commands with exception clauses, but competing obligations with inherent priority weights. When a situation arises where "do not lie" conflicts with "do not harm," a deontological system doesn't calculate the net utility of lying versus harming; it consults a hierarchy of principles to determine which duty is more stringent in that context. This resolves the exception space without requiring an infinite list and without reducing the decision to a mathematical sum of outcomes.

  By correcting (4), you preserve (1) because the AI is still following rules rather than maximizing a value function. The decision procedure remains rule-based lookup and priority resolution, not outcome optimization. This also saves (9) because human disagreement on trolley problems often stems from conflicting intuitions about which duty holds priority (e.g., is active killing worse than passive allowing?), not disagreements about the arithmetic of lives saved.

  For AI specifically, this means a deontological system is computationally feasible without collapsing into utilitarianism. You can code a logic system where certain rules override others based on contextual tags (e.g., "immediate threat" overrides "truth-telling") without assigning numeric utility values to the outcomes. The cost of giving up (4) is minimal, but the cost of keeping it is accepting that all moral reasoning is secretly math, which erases the normative distinction people actually care about. Step (5) also falters here, as recognizing a threshold where a rule breaks due to a conflicting duty is distinct from breaking a rule because the aggregate good is higher; the former is about duty conflict, the latter about consequence maximization.
