      *(Self-Correction on "Rating who is right"):* I need to be careful not to declare a winner in a way that shuts down the scene. I should rate them based on *domain validity* (e.g., Lena wins on ethics, Kenji wins on pragmatics).

      *(Refining the "Fat" question):* This is the trap. Kenji conceding this is smart. I need to highlight why that concession matters.

