      2.  Many specific EP hypotheses are just-so stories (underdetermined/unfalsifiable).
      3.  EP should meet same standards as other historical sciences (paleontology, etc.).
      4.  Surprising, confirmed predictions = strong evidence (novel success).
      5.  Political objections (rationalizing status quo) are not epistemic objections.
      6.  Cross-cultural consistency is decent but not decisive evidence (convergent evolution possible).
      7.  Reverse-engineering can yield knowledge *even without independent evidence* of ancestral environments (design tells function).

  3.  **Identify Tensions:**
      *   *Tension A: (1) & (7) vs. (2) & (3).*
          *   (1) says reverse-engineering is productive. (7) says you don't need independent evidence of ancestral environments to know function from design.
          *   (2) says many hypotheses are just-so stories/unfalsifiable. (3) says hold to standards of historical sciences.
          *   *Conflict:* Historical sciences (like paleontology) usually require independent evidence (fossils, strata) to confirm hypotheses about the past. Claim (7) suggests EP can bypass this ("design tells function"), but Claim (2) admits many current hypotheses fail evidentiary standards. If (7) is true, why are so many (2) just-so stories? If (3) is true, does (7) violate the standards of historical sciences (which usually demand independent verification)?
          *   *Severity:* High. (7) is the most controversial epistemic claim. It potentially undermines (3).
      *   *Tension B: (1) vs. (2).*
          *   (1) says the program is productive. (2) says a "very large fraction" are just-so stories.
          *   *Resolution:* A program can be legitimate even if many specific attempts fail (e.g., drug discovery). This is manageable.
      *   *Tension C: (5) vs. The Rest.*
          *   (5) separates politics from epistemology. This is generally consistent with (3) (standards should be neutral). No major tension here.
      *   *Tension D: (6) vs. (7).*
          *   (6) says cross-cultural consistency isn't decisive. (7) says design tells function without independent evidence.
          *   *Resolution:* These are complementary limitations. No major tension.

  4.  **Drafting the Audit (focusing on the real tension):**
      *   The main friction is between (3) (same standards as historical sciences) and (7) (reverse-engineering without independent evidence).
      *   Historical sciences typically rely on *consilience*—multiple independent lines of evidence. Paleontology doesn't just look at a bone's shape; it looks at strata, dating, related species.
      *   Claim (7) asserts EP can infer function *solely* from design without independent environmental evidence. Claim (3) asserts EP should follow historical science standards. If historical sciences require independent verification of past conditions, (7) violates (3).
