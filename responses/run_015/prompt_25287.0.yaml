      *   *Ranking:* High Severity.
      *   *Fix:* Modify (7). Admit that design inference generates hypotheses, but confirmation requires independent evidence of ancestral environments (archeology, ethnography).
      *   *Cost:* Slows research significantly; reduces the scope of "knowable" traits.

  8.  **Review against constraints:**
