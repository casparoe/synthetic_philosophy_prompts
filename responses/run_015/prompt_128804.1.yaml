  3.  **Analyzing the Tensions:**

      *   **Tension A: (1) ISOTYPE Universality vs. (2) Theory-Ladenness & (5) Meaning Change.**
          *   *The Problem:* If visuals are theory-laden (2) and theories change meanings radically (5), how can visuals bridge language/culture barriers universally (1)? If a bar chart implies a specific ontology of "quantity" that shifts, is it truly universal?
