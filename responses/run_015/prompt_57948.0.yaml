  Okay so I have fallen down the acausal trade rabbit hole, that whole idea where agents that can never causally interact might still cooperate because they can simluate or predict each other, and I am trying to sort out my own gut reactions. Here is where I land on cases, tell me what principle if any actually fits them:

  1. Exact copy case: some future lab runs an exact copy of me and we both independently have to choose Share vs Hog on some compute resource, copy gets what I get. I say cooperate, obviously Share.

  2. Nerd coordination case: me and some other human I will never meet, but we both think about decision theory in the same way, both deciding whether to spend a weekend open-sourcing a tool that mostly helps people like us. No communication. I feel like I should contribute, probly they will too.

  3. Alien dead-drop case: an alien hive mind ten galaxies away that is nothing like me psychologically, but it has a predictor that gets humans right 99% of the time. We could both leave resources on a dead asteroid for the other and never check. Even with high accuracy I feel like nah, do not bother.

  4. Blackmail sim case: a paperclippy AI that has a great simulation of me says if you donate it will spare your sims from torture, otherwise torture them. Simulation is super accurate. I say absolutely do not pay, do not cooperate, even though the prediction logic looks the same as case 1.

  5. Delivery bots case: two delivery bots from seperate companies stuck in an alley, both running the same open-source coordination algorithm and able to read each others code. Yield vs Block. I say they should Yield, cooperate.

  My rough tentative principle was something like cooperate whenever the other agent predicts your choice and mutual cooperation beats mutual defection, but 3 and 4 break that, right? High accuracy is not enough and blackmail feels totally different from trade even when the sim accuracy is identical.

  Is there a cleaner principle that gets all or most of these, what motivates each clause, and where does it force me to drop a verdict? And what does it say about the one I keep going back and forth on: should I now precommit to leaving little helpful scraps, compute or friendly messages in code, for any future superintelligence that might reward sims who cooperated? Seems cheap but also infinitely exploitable, idk.

  Give me one principle or two candidates stated precisely, say which of my cases forces each part, say what it predicts for a new case I have not listed, and be honest about which of my verdicts you think just has to go.
