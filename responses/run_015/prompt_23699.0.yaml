answer: |-
  This is a classic debate in game theory, and honestly, the fact that they argued for twenty minutes means they both understand the tension at the heart of the problem. The "Dollar Auction" was invented by economist Martin Shubik in 1971 specifically to create this kind of paradox.

  Here is the breakdown of who is right about what, where they are wrong, and the crucial piece of the puzzle they are both glossing over.

  ### 1. Jake's Argument: The "In-the-Moment" Logic
  **Where Jake is Right:**
  Jake is describing **ex-post rationality** (rationality after the fact). Mathematically, he is correct about the specific choice at the $98/$99 junction *if* you assume the auction ends there.
  *   **Option A (Stop):** You lose $98.
  *   **Option B (Bid $100):** If you win, you pay $100 and get $100. Net loss = $0.
  *   **Comparison:** Losing $0 is better than losing $98.
  From a purely mechanical standpoint, minimizing immediate loss *does* dictate bidding $100. He is also right that human beings are terrible at binding themselves. Without a contract signed in blood, "Future Jake" will almost always listen to "Present Jake's" logic to avoid the pain of a certain loss.

  **Where Jake is Wrong:**
  Jake is treating the auction as if it stops at $100. It doesn't.
  If Jake bids $100 to "break even," Maya (the opponent) is now in the exact same trap. She bid $99. If she stops, she loses $99. If she bids $101, she pays $101 to get $100 (a $1 loss), which is better than losing $99.
  Jake's logic forces the bidding *past* the value of the dollar. If his logic holds, the bidding never stops until both players run out of money. Therefore, his definition of "rational" leads to an irrational outcome (bankruptcy).

  ### 2. Maya's Argument: The "Strategic" Logic
  **Where Maya is Right:**
  Maya is describing **ex-ante rationality** (rationality before the game starts). This is the standard Game Theory solution.
  She understands that a "strategy" isn't just one move; it's a plan for every possible move. If you know that entering the auction triggers a trap where every subsequent move compels you to lose more money, the only winning move is not to play (or to bid $1 and hope the other person is smart enough to stop).
  She is also correct about **pre-commitment**. In behavioral economics, it is considered rational to restrict your future choices if you know your future self will be weak. (Example: An alcoholic throwing away their liquor is rational, even though "Future Alcoholic" would prefer to have a drink).

  **Where Maya is Wrong:**
  She is assuming a rational person *can* commit without external enforcement. Jake is right that "I promise I won't bid more" is cheap talk. Once the money is on the table, the promise has no teeth. Unless Maya has a mechanism that *physically prevents* her from bidding (or penalizes her heavily for breaking the promise), her "strategy" is vulnerable to the exact pressure Jake describes.

  ### 3. The Verdict: Who Wins the Argument?
  In the eyes of formal Game Theory, **Maya is more correct.**

  Here is why: A "rational agent" in game theory is defined by their ability to maximize utility over the *whole game*, not just the current turn. If a line of reasoning leads to a guaranteed loss (the escalation trap), that reasoning is flawed, even if it looks logical step-by-step. This is known as a failure of **Backward Induction**.

  A truly rational player looks at the end of the game (escalating losses) and works backward to the start, realizing, "If I bid $2, he will bid $3, and we will spiral. Therefore, I should not bid $2."

  However, Jake wins on **Psychological Realism**. In real life, people *do* act like Jake. Once they are in the trap, the pain of losing sunk costs outweighs the logic of the long game. Jake is describing how humans *actually* behave; Maya is describing how a perfect computer *should* behave.

  ### 4. What They Are Both Missing
  To really settle this at the table, point out these three things they haven't considered:

  **A. The Auction Doesn't Stop at $100**
  Jake keeps saying bidding $100 allows you to "break even." That is only true if the other person quits. But if the other person is also "rational" in Jake's sense, they will bid $101.
  *   **At $101:** The winner loses $1. The loser loses $99.
  *   **At $102:** The winner loses $2. The loser loses $100.
  The logic Jake uses at $98 applies forever. There is no mathematical "stop" point once you pass $50. This proves Jake's logic is broken because it has no exit condition.

  **B. Common Knowledge of Rationality**
  The game changes based on what you think your opponent will do.
  *   If Jake knows Maya is a "Maya-rational" player (she won't get in a bidding war), Jake can bid $1 and win.
  *   If Jake knows Maya is a "Jake-rational" player (she will fight to the death), Jake should never bid at all.
  The disaster happens when both players *think* they are being rational (Jake-style) but assume the *other* person will quit. They are both betting on being the last sane person in the room.

  **C. The Sunk Cost Fallacy is the Engine**
  Jake claims the $98 is "sunk" and he's ignoring it. He's wrong. The *reason* he wants to bid $100 is precisely because he spent $98. If he hadn't spent $98, he wouldn't bid $100 for a $100 bill (no profit).
  He is trying to *recover* the sunk cost, not ignore it. Maya identifies this correctly: the trap relies on the human inability to let go of past losses.

  ### How to Mediate
  Tell them this:
  > "Maya is right about **Strategy**, but Jake is right about **Incentives**."

  *   **Maya** wins because the only way to guarantee you don't lose money is to treat the auction as a single decision made *before* you open your mouth. That is the Game Theory solution.
  *   **Jake** wins because once the game is in motion, the incentives are structurally designed to punish anyone who tries to be rational and quit.

  The lesson of the Dollar Auction isn't about how to bid; it's about recognizing situations where **local rationality leads to global disaster.** Maya identified the trap; Jake identified the bait.
