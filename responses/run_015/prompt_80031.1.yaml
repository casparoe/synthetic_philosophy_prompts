prompt: |-
  I've just spent an evening arguing with a friend about decision theory, and we haven't moved an inch. He is a causal decision theorist and I keep defending updateless decision theory; we agree on every fact about Newcomb's problem and on the calculations, yet he insists that updateless decision theory simply redefines the counterfactual so that one-boxing comes out right, while I insist that causal decision theory holds the predictor's prediction fixed in a way that severs the very correlation the problem turns on. The crux, as I see it, is that in updateless decision theory you evaluate what would happen if your decision function output a given option, but your decision function is a deterministic computation, so there is no fact of the matter about what it would have output had it been a different function; and causal decision theory faces the mirror image, since asking what would happen if you two-boxed while holding everything else fixed must also hold fixed a prediction that is itself a function of your decision procedure. My hypothesis is that this is not a substantive disagreement at all but a verbal one about what a counterfactual about one's own decision even is. Is that right, or is there a real substantive disagreement hiding underneath, about what rationality requires or about which thought experiments count as the test cases? And given your diagnosis, what would count as progress: a sharper account of the counterfactual, a new thought experiment, a formal result, or should we expect this to stay stuck, and why?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user had an argument with a friend about decision theory (CDT vs. UDT).
      *   **Positions:** Friend = Causal Decision Theorist (CDT); User = Updateless Decision Theorist (UDT).
      *   **Agreement:** They agree on the facts of Newcomb's Problem and the calculations (expected utilities).
      *   **Disagreement:** The friend claims UDT just "redefines counterfactuals" to get the right answer. The user claims CDT "holds the prediction fixed" in a way that severs the relevant correlation.
      *   **User's Hypothesis:** The disagreement is merely verbal/semantic about the definition of "counterfactual."
      *   **Questions:**
          1.  Is it just verbal, or is there a substantive disagreement (about rationality or test cases)?
          2.  Given the diagnosis, what counts as progress (sharper account, new thought experiment, formal result, or stuck)?

  2.  **Deconstruct the Philosophical Landscape:**
      *   **CDT (Causal Decision Theory):** Focuses on causal consequences of actions. Uses Pearl-style do-operators ($do(A)$). In Newcomb's, it treats the prediction as a past event, causally independent of the current choice (assuming no backward causation). Hence, two-boxing dominates.
      *   **EDT (Evidential Decision Theory):** Focuses on evidential correlations. $P(O|A)$. In Newcomb's, one-boxing correlates with the million.
      *   **UDT (Updateless Decision Theory):** Focuses on the output of the decision *algorithm* or *policy* before observing specific information (or treating the observation as part of the input to the policy). It evaluates the logical correlation between the algorithm's output and the predictor's simulation.
      *   **The Core Tension:** The user identifies the "counterfactual" definition as the sticking point. This is a well-known issue in the literature (e.g., discussions by Arif Ahmed, Jim Joyce, David Lewis, and more recently, MIRI/lessWrong communities on Functional Decision Theory).
      *   **Is it Verbal?** On one level, yes: they are using different formalisms for "what if." But on another level, no: they have different normative commitments about what constitutes an "act" and what constitutes "control."

  3.  **Address Question 1: Verbal vs. Substantive:**
      *   *Argument for Verbal:* If they agree on the physical facts and the expected utility calculations *conditional on the framework*, they might just be labeling the same mathematical structure differently. CDT says "You can't causally affect the past." UDT says "You can logically affect the prediction." If "affect" is the ambiguous term, it's verbal.
      *   *Argument for Substantive:*
          *   **Normative:** What does "rational" mean? Is it maximizing causal impact or maximizing expected utility (winning)? CDT prioritizes a specific notion of agency/causation. UDT prioritizes outcome optimization.
          *   **Metaphysical:** What is the "self"? CDT views the act as a local physical event. UDT views the act as an instance of a logical computation. This is a deep metaphysical divergence.
          *   **Scope:** CDT fails in Newcomb, Parfit's Hitchhiker, etc. UDT handles them. Is "failing" in these cases a substantive error or just a feature of a theory designed for different cases?
      *   *Diagnosis:* It's *both*. It starts as verbal (definitions of counterfactuals) but roots into substantive disagreements about the nature of agency and the goal of decision theory (guidance vs. description of rationality).

  4.  **Address Question 2: Paths to Progress:**
      *   *Sharper Account of Counterfactuals:* This is what Judea Pearl tried. But CDT and UDT essentially choose different graphs. A sharper account might just entrench the divide unless it bridges the metaphysical gap.
      *   *New Thought Experiment:* Newcomb is old. Parfit's Hitchhiker, Transparent Newcomb, Blackmail problems. These stress-test the theories. If CDT advocates concede in Blackmail but hold on Newcomb, that's progress. But often, CDT proponents bite the bullet (e.g., "It's rational to lose in Newcomb").
      *   *Formal Result:* Showing that UDT is a generalization of CDT under certain logical uncertainty conditions (like Functional Decision Theory attempts). Or proving a Dutch Book against CDT in specific logical correlation scenarios.
      *   *Stuck:* Why might it stay stuck? Because it touches on Free Will. CDT aligns with a libertarian-ish or compatibilist view where the "choice" is a causal fork. UDT aligns with determinism + logical control. If they disagree on Free Will, they won't agree on Decision Theory.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the depth of the impasse. It's a classic stalemate in modern decision theory.
      *   *Section 1: Verbal or Substantive?*
          *   Validate the user's insight: Yes, it looks verbal (definition of counterfactual).
          *   Push deeper: It's substantive because it reflects different *normative goals*. CDT = "Sanity of Causal Influence." UDT = "Winning."
          *   Mention the "Act" definition: CDT = physical movement. UDT = logical output.
      *   *Section 2: The Metaphysical Root.*
          *   The concept of "You." Are you a physical body at $t_1$ or a timeless algorithm?
          *   This connects to the "Free Will" debate. CDT preserves the feeling of "could have done otherwise" locally. UDT accepts determinism and optimizes the source code.
      *   *Section 3: Paths to Progress.*
          *   *Formal Unification:* Mention Functional Decision Theory (FDT) as an attempt to bridge this. It formalizes the "logical counterfactual."
          *   *Dutch Books/Exploitation:* Show where CDT loses money in scenarios involving predictors or copies (e.g., Twin Prisoner's Dilemma).
          *   *Reframing the Goal:* Ask the friend: "Do you want a theory that tells you how to be causally efficacious, or how to get rich?"
          *   *Why it might stay stuck:* Fundamental metaphysical commitments are hard to shift.
      *   *Conclusion:* Summarize. It's a verbal disagreement masking a substantive normative/metaphysical divide. Progress requires shifting the conversation from "counterfactuals" to "goals of rationality."

  6.  **Refining the Tone:**
      *   Ensure neutrality. Don't just say "UDT is right." Acknowledge CDT's strengths (robustness in standard causal environments, simplicity).
      *   Use precise terminology (logical counterfactuals, screening off, policy selection).
      *   Reference key figures/concepts implicitly or explicitly (Lewis, Pearl, Yudkowsky/Soares).

  7.  **Self-Correction/Nuance Check:**
      *   *Did I distinguish EDT and UDT?* The user asked about UDT. Make sure not to conflate them. UDT is about *policy* selection before updating, handling logical correlation. EDT handles evidential correlation but can fail in some Newcomb variants (e.g., Smoking Lesion depending on formulation). Stick to CDT vs. UDT.
      *   *Is "verbal" dismissive?* No, in philosophy, verbal disputes often point to conceptual ambiguities that need resolving.
      *   *The "Calculation" Claim:* The user says they agree on calculations. This is tricky. CDT calculates $E[U|do(A)]$. UDT calculates $E[U|A = \text{output}]$. The numbers differ. The user probably means they agree on the *physical* probabilities, but disagree on the *conditional* probabilities. I need to clarify this. If they agree on the physical setup, they disagree on the *link* between action and prediction.

  8.  **Final Polish:** Organize into clear headings. Ensure the advice on "progress" is actionable. (Proceed to generate output based on these thoughts.)
answer: |-
  This is one of the most enduring stalemates in modern philosophy of action. You have diagnosed the surface symptom correctly: the argument manifests as a dispute over the definition of counterfactuals. However, diagnosing it as *merely* verbal misses the deeper normative and metaphysical rift that keeps the two sides talking past each other.

  Here is an analysis of whether the disagreement is verbal or substantive, followed by an assessment of where progress might actually come from.

  ### 1. Is it Verbal or Substantive?

  Your hypothesis is partially right: **It is a verbal disagreement about the word "can," masking a substantive disagreement about the goal of rationality.**

  **The Verbal Layer: The Definition of "Act"**
  CDT and UDT disagree on what constitutes the "object" of evaluation.
  *   **CDT** treats the act as a local physical event at time $t$. The counterfactual is: "What happens if I physically move my hand to take Box B, holding the past (including the prediction) fixed?" Since the prediction is in the past, CDT says it is causally screened off.
  *   **UDT** treats the act as the output of a logical computation (a policy). The counterfactual is: "What happens if the algorithm that is 'me' outputs 'one-box'?" Since the predictor simulates that algorithm, the prediction logically depends on the output.

  When your friend says UDT "redefines counterfactuals," they mean UDT allows logical dependence to substitute for causal dependence. When you say CDT "severs the correlation," you mean CDT arbitrarily restricts the dependency graph to physical causation, ignoring logical identity. You are both right about what the other theory is doing; you disagree on which map corresponds to the territory of "rational choice."

  **The Substantive Layer: The Normative Goal**
  The disagreement becomes substantive when you ask: **What is decision theory *for*?**
  *   **The CDT Norm:** Rationality is about exercising **causal control**. A rational agent should maximize the expected utility of the consequences they *cause*. If you cannot causally influence the prediction, you are not responsible for it, and you should not optimize for it. To a CDTer, one-boxing in Newcomb's problem is an act of "magical thinking"—trying to influence the past.
  *   **The UDT Norm:** Rationality is about **winning**. A rational agent is one who, when placed in a scenario, ends up with the highest utility. If a theory prescribes an action that leads to \$1,000 when another prescription leads to \$1,000,000, the first theory is defective, regardless of whether the correlation is causal or logical.

  This is not verbal. It is a clash between **deontic constraints on agency** (CDT: "Do not act as if you can change the past") and **consequentialist optimization** (UDT: "Get the money").

  **The Metaphysical Root: The "Self"**
  Underneath the normative clash is a metaphysical one.
  *   **CDT** assumes a view of the self where the "choice" is a causal fork in the road that is not fully determined by prior physical states (or at least, treats the decision as a fresh intervention).
  *   **UDT** assumes a deterministic/computational view of the self. You are a source code. The predictor has your source code. Therefore, the prediction and your action are logically linked.

  If your friend believes in a notion of free will that requires the ability to "do otherwise" in a way that breaks logical determination, they *cannot* accept UDT without abandoning their metaphysics. That is a substantive disagreement.

  ### 2. What Counts as Progress?

  Given that the impasse rests on normative goals and metaphysical commitments, simply sharpening the account of counterfactuals is unlikely to resolve it. Both sides can make their counterfactuals internally consistent. Here is where progress might actually lie:

  #### A. Shift from "Counterfactuals" to "Exploitability" (Formal Results)
  The most productive avenue recently has been showing where CDT leads to **dynamic inconsistency** or **money-pumping** in scenarios involving predictors or copies.
  *   **The Argument:** Show that a CDT agent, prior to entering Newcomb's Problem, would pay to pre-commit to one-boxing. If they would pay to bind their future self to a strategy they will later reject, their decision theory is dynamically inconsistent.
  *   **Progress:** If your friend admits that a rational agent should be able to plan strategically without being exploited by their future self, UDT (or Functional Decision Theory) gains ground. This moves the debate from "what is a counterfactual?" to "what properties must a rational agent satisfy?"

  #### B. New Thought Experiments: The "Blackmail" and "Twin" Cases
  Newcomb's Problem is often dismissed by CDTers as "unrealistic" because it requires a near-perfect predictor. Progress often comes from cases where the correlation is undeniable but non-causal.
  *   **Psychological Twin Prisoner's Dilemma:** You and a perfect psychological twin face a PD. You reason identically. CDT says defect (dominance). UDT says cooperate (your decision logically determines theirs).
  *   **Parfit's Hitchhiker:** You are stranded. A driver will only save you if they predict you will pay upon arrival. Once in the city, CDT says don't pay (the ride is already done). But if you are a CDT agent, the driver predicts this and leaves you to die.
  *   **Progress:** If your friend bites the bullet and says, "Yes, it is rational to be left to die in the desert if that's what causal dominance dictates," the disagreement is laid bare as a normative clash. If they flinch, they must explain why the "causal severance" applies in Newcomb but not Hitchhiker.

  #### C. Reframing the Goal (Philosophical Therapy)
  You may need to step back and ask your friend what they want a decision theory to do.
  *   **Question:** "If you had to write a program to play Newcomb's Problem for you, would you write a CDT agent or a one-boxing agent?"
  *   **The Trap:** If they say "one-boxing agent," ask: "Then why is CDT the theory of *rationality*? If rationality doesn't prescribe the code you'd write, what is it for?"
  *   **The CDT Defense:** They may reply, "Rationality isn't about winning; it's about being blameless." If they take this route, you have reached the bedrock substantive disagreement. Progress here is simply recognizing that you are advocating for different virtues (efficacy vs. causal purity).

  ### 3. Will It Stay Stuck?

  It is likely to stay stuck **if** the conversation remains focused on the mechanics of Newcomb's Problem.

  The reason is that CDT and UDT are **reflective equilibria** built on different intuitions.
  *   CDT aligns with our intuitive sense of local agency and the "fixity of the past."
  *   UDT aligns with our intuitive desire to succeed and the logic of computation.

  **The Path Forward:**
  The most promising development in this space is **Functional Decision Theory (FDT)**, proposed by Soares and Yudkowsky. It attempts to formalize UDT by explicitly defining the counterfactual in terms of logical subjunctives rather than causal interventions.
  *   **Why this helps:** It stops trying to convince CDTers that logical correlation *is* causal. Instead, it argues that "causal influence" is the wrong metric entirely. The metric should be "subjunctive dependence."

  **Recommendation for your next discussion:**
  Stop arguing about whether the prediction is "fixed." Agree that it is physically fixed. Instead, argue about **policy selection**.
  Ask your friend: *"Do you evaluate the rationality of a decision based on the specific physical motion at time $t$, or based on the algorithm that generated that motion?"*

  If they say "physical motion," they are committed to losing in Newcomb's Problem, and you must accept that they value causal purity over utility. If they say "algorithm," they are already an updateless theorist in practice, and the argument is purely terminological.

  **Verdict:** The disagreement is verbal on the surface (definition of counterfactuals) but substantive at the root (definition of agency and the goal of rationality). Progress requires moving the debate from physics (causation) to computer science (computation and policy).
