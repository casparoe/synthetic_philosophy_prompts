      *   **Key Themes to Embed (Show, Don't Tell):**
          1.  *Canalized Outcomes vs. Plastic Reasons:* The outcome stays the same in counterfactuals, but the justifications change completely and are incompatible with each other.
          2.  *Lexical Lock-in:* Alternatives aren't just defeated; they become unsayable/unformulable. The vocabulary itself locks in the outcome.
          3.  *The Archive Problem:* Surviving records are justifications of winners. Near-misses are lost. Reruns are built from sorted materials.
      *   **Setting:** Provincial Bureau of Retrospective Coherence (or similar) in a mid-sized industrial city. Decadal reports on infrastructure shape.
      *   **Protagonist:** Junior analyst noticing inconsistencies in past justifications (e.g., rail gauge, dam site, ring road) across four reports.
      *   **Plot Element:** A "rerun" (simulation, war game, dream, etc.) that comes out "wrong" in an interesting way (doesn't neatly prove the thesis).
      *   **Constraints:**
          *   ~1500 words.
          *   No lectures/Socratic dialogue.
          *   No footnotes/citations/real historical names.
          *   Philosophical statements must be flawed/regretted/drunk.
          *   Avoid neat "market failure" or "power struggle" readings (ambiguity required).
          *   Characters with real stakes.

  2.  **Deconstruct the Themes for Narrative Integration:**
      *   *Canalized Outcomes/Plastic Reasons:* The protagonist needs to see the same physical result (e.g., the River Kael Bend Bridge) justified by geology, then economics, then security, then aesthetics.
      *   *Lexical Lock-in:* The protagonist tries to propose an alternative, but lacks the words. The simulation shouldn't just reject the alternative; it should fail to render it.
      *   *Archive Problem:* The simulation uses old data. The data is already biased. The "rerun" is contaminated by the outcome it's trying to test.

  3.  **Drafting - Scene Setting:**
      *   Location: The Bureau. Dusty, bureaucratic, humming with old servers.
      *   Character: Elara (Junior Analyst). Supervisor: Vance (older, tired).
      *   Object: The "North Arterial" decision. 1954.
      *   The Conflict: The Decadal Review is due. Elara finds the discrepancies.

  4.  **Drafting - The "Rerun":**
      *   Needs to be a bureaucratic exercise. A "Counterfactual Stress Test."
      *   Elara tries to input a variable that shouldn't exist.
      *   The machine doesn't say "Error." It says something weirder. It smooths over the gap.

  5.  **Drafting - The Climax/Resolution:**
      *   The report gets written. The inconsistencies are smoothed over.
      *   Elara realizes the language itself prevents the alternative.
      *   Avoid the "Power" trap (Vance isn't suppressing her); avoid the "Market" trap (it's not about cost). It's about *coherence*.

  6.  **Writing - Section by Section:**

      *   *Opening:* Establish the Bureau and the task. The hum of the coherence engine. Elara looking at the 1954 file.
      *   *The Discovery:* The four reports. 1964 (Geology), 1974 (Efficiency), 1984 (Security), 1994 (Heritage). All justify the same road curve.
      *   *The Missing Option:* What was the actual alternative? A tunnel? A different route? Let's go with the "West Ridge Cut." It's not in the files.
      *   *The Simulation:* Elara runs the "Stress Test." She tries to input the West Ridge variable.
      *   *The Glitch:* The system doesn't crash. It auto-corrects the language. She tries to type "West Ridge" and the system suggests "North Arterial Deviation." The vocabulary is locked.
      *   *The Interaction:* Vance comes in. He doesn't scold her. He explains (badly/half-heartedly) why it doesn't matter.
      *   *The Ending:* The report is filed. The road remains. The words remain.

  7.  **Refining the Themes:**
      *   *Lexical Lock-in:* When Elara tries to describe the alternative, the predictive text or the system ontology refuses it. She has to use the winner's words to describe the loser.
      *   *Plastic Reasons:* Vance admits the reasons change, but insists the *shape* is what matters.
      *   *Archive Problem:* The simulation uses the 1954 data, but the 1954 data was already written by the winners.

  8.  **Word Count Check:**
      *   Need to expand on the sensory details of the Bureau and the internal experience of the simulation to hit ~1500 words without padding.
      *   Focus on the texture of the paper, the glow of the screen, the feeling of the words sticking in the throat.

  9.  **Avoiding the Traps:**
      *   *Power:* Vance shouldn't be a villain. He should be a believer in Coherence.
      *   *Economics:* Don't mention cost-benefit analysis as the driver. Mention "flow" or "integrity."
      *   *Philosophy:* If Elara thinks something deep, make it messy. "It's not that we chose the road. The road chose the words."

  10. **Drafting - Iteration 1 (Mental Outline):**
