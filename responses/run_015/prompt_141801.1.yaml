      *(Refining the "Power/Market" avoidance)*: Vance shouldn't say "It was cheaper." He should say "It was necessary for the narrative." Elara shouldn't think "They hid the truth." She should think "The truth doesn't fit the syntax."

      *(Final Polish)*: Check the voice. Dry, bureaucratic, slightly surreal.

  13. **Final Review against Prompt:**
