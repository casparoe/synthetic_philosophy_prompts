answer: |-
  The Bureau of Retrospective Coherence occupied the third floor of the Municipal Archives, a space that smelled of toner and drying glue. Elara's job was to ensure that the city's physical shape matched the story the city told about itself. Every ten years, the Bureau issued the Decadal Report, a thick volume explaining why the streets ran where they ran, why the river was bridged at the Narrows, and why the industrial zone sat on the south bank. The directive was simple: demonstrate necessity. Prove that given the conditions of the past, the present could not have been otherwise.

  Elara was a Junior Analyst, Third Grade. Her terminal hummed with the weight of the 1954 Infrastructure Decision file. She was preparing the background summary for the upcoming Centennial Report, specifically regarding the Diversion Channel.

  On her screen, the 1954 decision tree bloomed like a gray fungus. She clicked through the archived justifications. There were four of them, each from a different decade, each certifying the same concrete curve of the Channel.

  The 1964 Report cited hydrology. *The soil composition of the North Bank was insufficient to bear a straight cut.*
  The 1974 Report cited economics. *A straight cut would have severed the labor supply from the foundries.*
  The 1984 Report cited security. *The curve provided a natural buffer against industrial sabotage.*
  The 1994 Report cited aesthetics. *The bend harmonizes with the valley's natural flow.*

  Elara highlighted the text. The physical outcome—the concrete curve—was identical in every record. The reasons were not just different; they were incompatible. You couldn't have a buffer against sabotage that also harmonized with natural flow if the natural flow was actually a straight line constrained by soil. Yet, in each document, the cited reason was presented as the singular, self-evident cause. The outcome was canalized, but the reasons were plastic, molding themselves to whatever vocabulary was current.

  She opened the Counterfactual Stress Test module. This was the rerun. The Bureau's simulation engine allowed analysts to shake the dice of history, adjusting variables to see if the outcome held. If the Diversion Channel was truly locked in, the simulation should produce the curve even if she altered the soil density or the labor maps. If it was contingent, the simulation should show a straight cut.

  Elara typed in the variable she had found scribbled in the margin of a discarded field notebook from 1953. It was a proposal for the West Ridge Tunnel. It wasn't in the official archive. It was a ghost option.

  She entered *West Ridge* into the input field.

  The cursor blinked. The predictive text algorithm churned. It did not suggest *Tunnel*. It did not suggest *Ridge*. It suggested *North Arterial Deviation*.

  Elara deleted it. She typed *West*. The system auto-corrected to *North-West*. She typed *Ridge*. The system flagged it as *Invalid Topography*.

  She frowned. She knew the ridge was there. She had walked it. But the system's ontology—the underlying map of what things could be named—did not contain a slot for the West Ridge as a viable infrastructure site. It wasn't that the option was rejected as too expensive or too difficult. It was that the simulation could not process the concept. To the machine, the West Ridge was not a place where a tunnel could be; it was merely empty space, defined by its negation of the North Arterial.

  She forced the input. She bypassed the safety protocols, hard-coding the tunnel parameters. *Run.*

  The fans in the server room whined. The screen flickered with the chaos of a thousand recalculating variables. Traffic flows shifted. Water levels rose. Cost matrices dissolved.

  The simulation settled.

  On the screen, the Diversion Channel curved. Exactly as it did in reality.

  Elara leaned back. She checked the log. The system hadn't rejected the tunnel because it failed. It had rejected it because the tunnel *became* the curve. In the simulation's logic, the input *West Ridge Tunnel* was interpreted as *Structural Reinforcement for North Bend*. The vocabulary had swallowed the alternative. The rerun hadn't tested the history; it had translated the alternative into the language of the winner.

  The door to the office opened. Vance stepped in, holding two mugs of coffee. He was a Senior Analyst, a man whose face seemed to have settled into a permanent expression of mild apology.

  "Centennial draft?" he asked, setting a mug on her desk.

  "The Stress Test failed," Elara said.

  "Failed how? Crash?"

  "No. It converged. I put in the West Ridge option. The 1953 alternative. The model still built the Curve."

  Vance sipped his coffee. He looked at the screen, at the familiar concrete bend. "And the justification?"

  "It says... 'Optimized Flow Dynamics.'"

  "See?" Vance said. "That's the 2024 vocabulary. In sixty-four, it was hydrology. In seventy-four, labor. Now it's dynamics. The shape stays. The words move."

  "But the West Ridge was real," Elara said. "People walked it. They drew maps. Why can't the system see it?"

  "Because the system is built on the Archive," Vance said. He pulled up a chair, the legs scraping loudly on the linoleum. "The Archive is made of reports. The reports are made of winners. You're trying to run a simulation using materials that have already been sorted. You can't build a counterfactual out of factual bricks. The mortar is too dry."

  "So we're lying," Elara said. "In the Report."

  "We're providing coherence," Vance corrected. He looked tired. "Look, I once tried to write a paper on this. Ten years ago. I got drunk at the holiday party and told the Director that lock-in isn't in the concrete. It's in the throat. He didn't fire me. He just asked me if I wanted to keep my clearance."

  Vance rubbed his eyes. "It's not that the other options lost, Elara. It's that they became unsayable. If you can't name the thing, you can't build the thing. And if you can't build the thing, you can't leave a record of it. So when you try to simulate it later, you're simulating a ghost using a machine made of bones."

  "That's not science," Elara said.

  "It's administration," Vance said. "Science asks what is true. Administration asks what holds."

  He stood up. "Finish the draft. Use the 'Optimized Flow' justification. It tests well with the City Council."

  Elara watched him leave. She turned back to the screen. The cursor blinked in the justification field. *Optimized Flow Dynamics.*

  She tried to type *West Ridge*. The system let her type the letters, but when she hit enter, the text shimmered and rearranged itself. *Non-Standard Arterial Proposal.*

  She tried to type *Contingency*. The system suggested *Risk Factor.*

  She tried to type *Accident*. The system suggested *Unplanned Variation.*

  The lock-in wasn't holding the city in place. The city could change; roads could be ripped up, bridges demolished. The lock-in was holding the *description* in place. The vocabulary was a cage that kept the past from looking accidental. If she wrote *Accident* in the report, the whole structure of the Bureau's authority would vibrate. If the Curve was an accident, then the 1964 hydrology report was a lie. If that was a lie, the 1974 labor report was a fiction. The coherence would unravel.

  Elara looked at the map of the city. The Diversion Channel cut through the center like a scar that had healed over. She knew, with a sudden cold certainty, that if she ran the simulation again with different random seeds, the Curve would appear again. And if she ran it a thousand times, the justification would change every time, adapting to the new decade's anxieties, while the concrete remained stubbornly, silently itself.

  She thought about the West Ridge. It was still there, outside the city limits, covered in weeds. No one went there. It wasn't on the transit maps. It wasn't a park. It wasn't a zone. It was just space that hadn't been named yet.

  Elara placed her hands on the keyboard. She had to write the report. She had to explain why the Channel curved. She could write the truth—that she didn't know, that the records were contradictory, that the simulation was rigged by language. But if she did that, the Report would be rejected. It would be filed under *Incoherent*. It would cease to exist as an official document. It would become just another piece of paper in a box, like the 1953 field notebook.

  To survive, the truth would have to look like a lie. It would have to adopt the vocabulary of the winner.

  She deleted *West Ridge*. She deleted *Accident*.

  She typed: *The Diversion Channel follows the path of least resistance, ensuring optimal integration with the municipal grid.*

  It was vague enough to be true. It was specific enough to be useful. It was a lie that fit the shape of the truth.

  Elara hit *Save*. The file name auto-completed: *Centennial_Report_Final_v1.doc*.

  She looked out the window. The sun was setting over the city, casting long shadows along the Diversion Channel. The concrete glowed orange. It looked inevitable. It looked like it had always been there, waiting for the water to find it.

  She took a sip of the coffee. It was cold. She wondered if Vance had ever tried to type *West Ridge* into his terminal, twenty years ago, and watched the letters rearrange themselves into *North Arterial*. She wondered if he had dreamed about it.

  Elara opened a new document. She titled it *Personal Notes*. She typed *West Ridge*. The system didn't correct her. This document wasn't connected to the Archive. It was local storage. It would vanish when she logged off.

  She typed: *The road is here because we ran out of words for somewhere else.*

  She stared at the sentence. It was clumsy. It was unprofessional. It was the kind of thing you wrote when you were half-drunk and regretting it in the morning.

  She saved the file. Then she deleted it.

  The recycle bin emptied with a soft chime. Elara turned back to the official report. The cursor waited in the next field. *Conclusion.*

  She typed: *Therefore, the infrastructure reflects the necessary conditions of the era.*

  It was smooth. It was coherent. It locked the door.

  Elara submitted the file. The system confirmed receipt. *Status: Coherent.*

  Outside, the traffic moved along the curve of the Channel, flowing smoothly, unable to see the ridge that wasn't there, driving over the history that had been paved over, speaking the language of the road beneath their tires.
