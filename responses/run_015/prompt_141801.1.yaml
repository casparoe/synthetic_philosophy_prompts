      *   Elara writes the report. Lies.

  11. **Drafting - Iteration 2 (Focusing on Language):**
      *   Make the interface part of the lock-in. The dropdown menus don't have the options.
      *   The "Rerun" isn't a what-if; it's a coherence check.
      *   The ending needs to feel unresolved but settled.

  12. **Writing the Story (incorporating constraints):**
      *   *Name:* Bureau of Retrospective Coherence.
      *   *City:* Ostrava-like? No, keep it nameless. "The Basin."
