      *   **User Profile:** Academic researcher in comparative federalism (2 years on a specific project comparing US, Germany, Switzerland, EU). Highly knowledgeable, sophisticated, familiar with the literature and the specific impasse.
      *   **Topic:** The debate over whether "subsidiarity" is a genuine principle with determinate content or an empty formula (legitimation device).
      *   **User's Hypothesis:** The impasse is actually three disagreements under one name:
          1.  *Normative:* Epistemic vs. Democratic vs. Liberal justifications.
          2.  *Paradigmatic:* Which cases count as data (spillovers/race-to-bottom vs. local preferences/experimentation).
          3.  *Empirical:* Relative frequency/severity of those case types.
      *   **User's "Wrinkle":** The problem of *levels* themselves being political artifacts (functional regions vs. constitutional levels).
      *   **Desired Output:** A diagnosis of the impasse (not an overview, not a verdict). Evaluate the hypothesis (is it right? which component matters most?). Is it verbal, intuitive, or empirical? What counts as progress? Or is no progress expected (and why)?

  2.  **Deconstruct the Impasse:**
      *   The core tension is between *rule* and *standard*. Subsidiarity tries to be a rule ("do X unless Y") but functions as a standard ("balance Z").
      *   The user's three-part hypothesis is strong. It aligns with meta-ethical and institutional analysis in federalism studies.
      *   *Component 1 (Normative):* Crucial. If you think subsidiarity is about efficiency (epistemic), you get one result. If it's about liberty (liberal), you get another. If it's about legitimacy (democratic), a third. The text of the principle (EU Art 5, German Basic Law, etc.) often conflates these.
      *   *Component 2 (Paradigmatic):* Also crucial. This is the "availability heuristic" in legal theory. If your mental model is pollution crossing borders, centralization wins. If your mental model is school curricula, decentralization wins.
      *   *Component 3 (Empirical):* This is the hidden engine. If spillovers are rare, subsidiarity pushes down. If they are ubiquitous, it pushes up. Scholars avoid this because it requires data work, not doctrinal analysis.
      *   *The Wrinkle (Levels):* This is the "boundary problem" (Whelan) applied to federalism. It's a deeper metaphysical/institutional challenge.

  3.  **Evaluate the Hypothesis:**
      *   *Is it right?* Yes, it's a very astute diagnosis. It moves beyond "textualism vs. realism."
      *   *Which component does the work?* I suspect Component 1 (Normative) drives Component 2 (Paradigmatic), which masks Component 3 (Empirical). The normative commitment selects the paradigm, which makes the empirical question seem settled.
      *   *Verbal vs. Intuitive vs. Empirical:* It's primarily a clash of *incommensurable normative starting points* (Component 1) that disguises itself as a technical debate about application (Component 2), thereby avoiding the hard empirical work (Component 3).

  4.  **Address the "Wrinkle" (The Levels Problem):**
      *   Is it fatal? It's not fatal to the *operation* of subsidiarity within an existing structure, but it is fatal to subsidiarity as a *comprehensive theory* of jurisdiction allocation.
      *   It's a "detachable objection" for practitioners (who work within fixed constitutions) but a "fatal incompleteness" for theorists claiming subsidiarity solves the allocation problem ab initio.
      *   This explains why courts are deferential: they can't redefine the levels, only allocate between existing ones.

  5.  **Determine What Counts as Progress:**
      *   *Refining the test?* Unlikely to help. The text is already flexible.
      *   *Formal result?* Game theory might help with the "non-cooperation" limb, but it assumes the levels are fixed.
      *   *Comparative empirical programme?* **This is the winner.** If the impasse rests on hidden empirical assumptions (Component 3), making them explicit and testing them is the only way to move forward.
      *   *Change of question?* Also viable. Shift from "Is it determinate?" to "What work does the *rhetoric* of subsidiarity do?" (Legitimation function).

  6.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Academic, peer-to-peer, rigorous, avoiding condescension. Acknowledge the sophistication of the prompt.
      *   *Structure:*
