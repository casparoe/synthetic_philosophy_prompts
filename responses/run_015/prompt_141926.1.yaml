          *   On the Wrinkle: Connect this to the "boundary problem." Subsidiarity presupposes the *demos* or the *polity*. It cannot create it.
          *   On Progress: Argue that doctrinal refinement is dead ends. The only way out is empirical (measuring spillovers) or sociological (studying the legitimation function).

      *   *Self-Correction during drafting:* I need to make sure I don't just say "you're right." I need to add value. How? By connecting the "Wrinkle" to the "Three Components." The Wrinkle actually exacerbates Component 1 (Normative). If levels are artifacts, choosing them is a normative act, not a subsidiarity act.
      *   *Also:* Address the "empty formula" charge directly. If it's a legitimation device, is that a failure? Or a feature? (Hint: In political theory, legitimation *is* a function).

  7.  **Final Polish:** Check against the user's constraints.
      *   Diagnosis, not overview.
      *   No verdict on who wins.
      *   Address the three parts + wrinkle.
      *   Address "what counts as progress."

      *(Self-Correction on "Progress"):* Be careful not to be too prescriptive. Offer options. But be clear that doctrinal tinkering is likely futile.

      *(Key Insight to inject):* The impasse persists because the *function* of the principle in political discourse (legitimation) is served better by ambiguity than by precision. Precision would kill its utility as a coalition-building tool. Therefore, the "failure" is actually a "success" for political actors, even if it's a failure for legal scholars.

