answer: |-
  Your hypothesis is not only right; it is the most precise map of this terrain I have encountered in recent literature. You have correctly identified that the "empty formula vs. genuine principle" debate is a proxy war fought over three distinct fronts that are rarely disentangled.

  Here is a diagnosis of the impasse, weighting your three components, addressing the "wrinkle" regarding levels, and assessing the prospects for progress.

  ### 1. Weighting the Three Components

  Your three-part diagnosis is accurate, but the components are not equal in their causal power.

  **Component 1 (Normative Justifications) is the engine.**
  This is doing the most work. The indeterminacy of subsidiarity persists because the principle is asked to serve incompatible master norms simultaneously.
  *   If subsidiarity is **epistemic** (Hayekian local knowledge), the presumption is radically downward.
  *   If it is **liberal** (protection of liberty via fragmentation), the presumption is downward but allows upward movement to prevent tyranny.
  *   If it is **democratic** (input legitimacy/proximity), the presumption is downward.
  *   If it is **functional/utilitarian** (solving collective action problems), the presumption shifts upward whenever transaction costs of bargaining exceed the costs of uniformity.

  The literature stalls because proponents of "genuine content" usually smuggle in a functionalist definition (we can calculate 'better achievement'), while proponents of "empty formula" often rely on a liberal or democratic definition (the calculation is inherently political). Until the normative goal is specified *ex ante*, the test cannot be operationalized. The text of the principle (in the EU, Germany, etc.) deliberately conflates these to allow for coalition-building, which guarantees the interpretive impasse.

  **Component 2 (Paradigmatic Cases) is the mechanism.**
  This is how the normative disagreement manifests rhetorically. Because the normative foundations are unstated, scholars talk past one another using different case libraries. When a centralist argues that the "insufficiency" limb is met, they are implicitly pointing to environmental spillovers. When a decentralist argues it is not, they are pointing to cultural policy. Because neither side acknowledges that their paradigm is a choice driven by Component 1, they treat the other's examples as anomalies rather than counter-evidence.

  **Component 3 (Empirical Frequency) is the avoidance strategy.**
  This is the silence that sustains the noise. If we knew empirically how often "race to the bottom" dynamics actually materialize versus how often "laboratories of democracy" yield beneficial divergence, the functionalist limb of the test would collapse into a data question. Scholars avoid this because it requires leaving legal theory for political economy and sociology. The impasse is intellectually comfortable because it remains in the realm of doctrinal exegesis where neither side can be definitively falsified.

  **Verdict on the Nature of the Disagreement:**
  It is not merely verbal. It is a clash of **incommensurable normative starting points (Component 1)** that disguises itself as a technical debate about application (Component 2) to avoid the hard empirical work (Component 3). The "emptiness" of the formula is a feature, not a bug, for political actors who need a principle that can legitimize both centralization and decentralization depending on the political cycle.

  ### 2. The Wrinkle: The Problem of Levels

  Your observation about levels being political artifacts is the "boundary problem" (as articulated by Whelan and others in democratic theory) applied to federalism.

  **Is it fatal?**
  *   **For a theory of allocation:** Yes, it is fatal. Subsidiarity cannot tell you where the borders of the "lower level" should be drawn. If the "lower level" is the nation-state, a river basin issue demands centralization. If the "lower level" is the river basin authority, the same issue demands decentralization. Subsidiarity ranks *given* levels; it does not *generate* them.
  *   **For a working legal principle:** No, it is detachable. In the US, Germany, Switzerland, and EU, the levels are constitutionally fixed (mostly). Courts do not need a theory of the optimal partition; they need a rule for navigating the existing one.

  **Why this matters for the impasse:**
  This wrinkle explains the judicial deference you noted. Courts recognize that redefining the "levels" is a constituent power, not a judicial one. Therefore, they treat the levels as exogenous variables. This reinforces the "empty formula" critique: if the principle cannot question the jurisdictional map, it can only validate the traffic flowing over it. The "insufficiency" limb becomes a tautology because the lower level is *defined* by its inability to act outside its borders. If a problem crosses a border, the lower level *by definition* cannot solve it alone. Thus, the test almost always triggers upward allocation unless the court arbitrarily decides the spillover doesn't "count."

  ### 3. What Would Count as Progress?

  Given this diagnosis, doctrinal refinement of the test's limbs is a dead end. You cannot fix a normative conflict with better syntax.

  **A. A Comparative Empirical Programme (High Value)**
  This is the most promising path for your specific project. If you treat the "frequency and severity" question (Component 3) as the primary research object, you bypass the doctrinal stalemate.
  *   *Method:* Do not ask "What does subsidiarity mean?" Ask "In cases where subsidiarity was invoked, what were the actual spillover effects vs. local preference benefits?"
  *   *Outcome:* This might not solve the normative debate, but it would force it into the open. If data shows spillovers are rare, the functionalist argument for centralization loses its empirical footing. If data shows local divergence leads to regulatory arbitrage that harms citizens, the liberal argument weakens.
  *   *Why it works:* It attacks the avoidance strategy.

  **B. A Change of Question (High Value)**
  Shift from "Is it determinate?" to "What is its political function?"
  *   If the principle is a "legitimation formula" (as the second camp argues), then studying *how* it legitimizes is more fruitful than studying *whether* it constrains.
  *   *Research Question:* Does invoking subsidiarity change the coalition structure of legislation? Does it empower specific committees or national parliaments even if they rarely veto?
  *   *Why it works:* It accepts the "empty formula" critique but treats it sociologically rather than jurisprudentially. An empty formula can still be a powerful political tool (e.g., "public interest" in administrative law).

  **C. Formal Results on Non-Cooperation (Low Value)**
  Game-theoretic models of the "insufficiency" limb are elegant but often assume the levels are fixed and the players are rational actors in a vacuum. They rarely account for the normative pluralism (Component 1) that drives real-world decision-making. They risk becoming another self-contained language that doesn't touch the impasse.

  **D. Refinement of the Test (No Value)**
  Adding a third limb or clarifying "better achieved" will not help. The indeterminacy is not due to a lack of words; it is due to the conflicting norms the words are trying to contain. More text just provides more surface area for the same disagreement.

  ### 4. Should Progress Be Expected?

  If your goal is to produce a **determinate legal test** that courts will use to strike down legislation consistently, **no progress should be expected.**

  The reason is structural: Subsidiarity is a **political question dressed as a legal standard.** In all four systems you study, the allocation of competence is ultimately resolved by political bargaining (interstate compacts in the US, Bundesrat negotiations in Germany, package deals in the EU). The courts defer because they know that if they apply subsidiarity rigorously, they are making political allocation decisions without a democratic mandate.

  The impasse persists because the principle is doing two jobs that are in tension:
  1.  **Legal Job:** Provide a justiciable standard for competence disputes.
  2.  **Political Job:** Provide a vocabulary for negotiating competence without admitting it is a power struggle.

  Job 2 requires ambiguity. Job 1 requires precision. You cannot optimize for both.

  ### Recommendation for Your Project

  Since you are in a comparative working group, you are uniquely positioned to execute **Option A (Empirical Programme)** combined with **Option B (Change of Question).**

  1.  **Stop trying to solve the definition.** Acknowledge in your output that the principle is essentially contested (Component 1).
  2.  **Map the paradigms.** Categorize the case law in all four systems by the *type* of justification used (epistemic vs. liberal vs. functional). Show how the outcome correlates with the justification, not the text.
  3.  **Address the Wrinkle.** Explicitly analyze how the *fixed nature of the levels* in each constitution predetermines the subsidiarity outcome. For example, compare how the EU (where levels are contested) handles this vs. Germany (where levels are fixed).
  4.  **Conclude on Function.** Argue that the "impasse" is the stable equilibrium. The principle works *because* it is vague enough to allow different normative coalitions to claim victory. The "failure" of determinacy is the "success" of political flexibility.

  This moves you from being participants in the stalemate to being analysts of the stalemate. That is where the contribution lies.
