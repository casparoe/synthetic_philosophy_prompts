answer: |-
  I will give you the direct answer first, because your intuition as an experimentalist is correct: **Under the constraints you have laid out, no such case exists.**

  If you hold the distant matter fixed (Constraint i) and require the predictions to follow from the ontologies themselves rather than a specific choice of dynamical laws (Constraint vi), the Substantivalist and the Relationist will agree on the shape of the water.

  The reason is that the dispute between Substantivalism (space is a thing) and Relationism (space is just relations between things) is primarily **metaphysical**, not empirical. They are different interpretations of the same mathematical structure. To get them to disagree observationally, you usually have to swap the *physical theory* (e.g., Newtonian Gravity vs. General Relativity) rather than just the *ontology of space*.

  However, there is one scenario that comes as close as physics allows. It is the standard "Machian" test case. I will present it to you, but I will strictly adhere to your Constraint (vi) and show you exactly where the verdict is "quietly arranged" by the choice of dynamical laws rather than the nature of space.

  ### The Scenario: The Rotating Massive Shell (Thirring-Lense Effect)

  **Setup:**
  1.  **The Bucket:** A small bucket of water sits at the center of a laboratory.
  2.  **The Shell:** Surrounding the laboratory is a massive, thick, spherical shell of dense matter (e.g., lead or neutronium). This shell is local (Constraint i) and detectable (Constraint iii).
  3.  **The Distant Stars:** The rest of the universe (the "fixed stars") remains stationary and unchanged (Constraint i).
  4.  **The Action:** The bucket is held stationary relative to the laboratory floor. The massive shell is spun up to a high angular velocity around the bucket.
  5.  **The Measurement:** We observe the surface of the water in the stationary bucket.

  **Constraint (iv) Handling:** We assume the shell is perfectly spherical and homogeneous. In Newtonian physics, a spherical shell exerts no net gravitational force on its interior (Shell Theorem). In General Relativity, there are tidal effects, but we are looking for the *inertial* effect (frame dragging) distinct from the static gravitational pull. We assume the apparatus compensates for any static tidal deformation to isolate the rotational effect.

  ---

  ### The Predictions and Reasoning

  **1. The Newtonian Substantivalist**
  *   **Prediction:** The water surface remains **flat**.
  *   **Reasoning:** Inertia is defined by acceleration relative to Absolute Space. Absolute Space is immovable and unaffected by matter. The rotation of the material shell has no causal influence on the structure of Absolute Space. Since the bucket is stationary relative to the lab (and thus Absolute Space, assuming the lab is not rotating relative to the distant stars), there is no centrifugal force. The water does not climb the walls.

  **2. The Machian Relationist (implemented via General Relativity)**
  *   **Prediction:** The water surface becomes slightly **curved** (concave).
  *   **Reasoning:** Inertia is not intrinsic to space but arises from the interaction of the bucket with the total distribution of matter in the universe. While the distant stars provide the bulk of the inertial frame, a sufficiently massive, rapidly rotating local shell contributes to the local definition of "non-rotation." The rotating shell "drags" the local inertial frame (the metric field) along with it. Even though the bucket is stationary relative to the lab, it is now rotating *relative to the local inertial frame* established by the shell. Therefore, centrifugal forces arise, and the water climbs the walls.

  ---

  ### The Single Feature Doing the Work

  The feature generating the divergence is **the coupling of the inertial structure to the stress-energy tensor of local matter.**

  *   In the **Newtonian** view (Substantivalist), the inertial structure (Absolute Space) is a fixed background. It does not couple to matter. Matter moves *in* it, but does not move *it*.
  *   In the **Machian/GR** view (Relationist), the inertial structure (the Metric Field) is dynamic. It is determined by the matter content via the Einstein Field Equations. Local matter *does* move *it*.

  ### What Happens If That Feature Is Removed?

  If you remove the coupling (i.e., if you set the gravitational constant $G$ to zero in the field equations, or return to the Newtonian limit where the metric is fixed):
  *   The shell's rotation no longer influences the metric.
  *   The local inertial frame reverts to being defined solely by the distant stars (boundary conditions).
  *   **Result:** Both sides predict a **flat** water surface.

  The observational difference vanishes. This demonstrates that the disagreement is not about "Space vs. Relations" in the abstract, but about **which dynamical laws govern the inertial field.**

  ---

  ### The Losing Side's Best Reply

  Here is the critical part where your Constraint (vi) bites.

  **The Reply:** "You have not tested Substantivalism against Relationism. You have tested Newtonian Gravity against General Relativity."

  **The Argument:**
  A sophisticated Substantivalist can accept General Relativity. They simply argue that the Metric Field *is* the substantival entity (a "metric field realist"). They agree with the Relationist that the shell will drag the frame. They agree the water will curve.
  *   **Substantivalist (GR):** "The Metric Field is a real physical object. The rotating shell interacts with this object, distorting it. The bucket rotates relative to this distorted object. Water curves."
  *   **Relationist (GR):** "The Metric Field is just a codification of relations between the shell, the bucket, and the stars. The relations change when the shell spins. Water curves."

  **They agree on the observation.** They only disagree on whether the Metric Field is a "thing" (Substance) or a "bookkeeping device" (Relation).

  Conversely, a clever Relationist could try to salvage Newtonian mechanics (e.g., by positing a specific law where inertia is a function of mass distribution). But without the specific machinery of GR, they cannot derive the *magnitude* of the effect without stipulating a distance-weighted rule (violating Constraint vi).

  **Therefore:** The prediction divergence (Flat vs. Curved) is not between Substantivalism and Relationism *per se*. It is between **Newtonian Dynamics** and **Einsteinian Dynamics**.

  ### The Verdict on Your Question

  You asked: *Is this dispute empirical or merely verbal?*

  **Answer:** Within the context of a fixed physical theory (like General Relativity), the dispute is **merely verbal (metaphysical)**.

  1.  **Observational Equivalence:** In GR, a Substantivalist and a Relationist assign the same truth values to every observable proposition (e.g., "Will the water rise?"). They use the same equations. They get the same numbers.
  2.  **The "Star-Sphere Trick" Scaled Down:** You suspected the rotating shell was just "Newton's bucket with the star-sphere trick scaled down." You are right. The shell acts as a "local fixed star."
      *   If the Relationist predicts curvature, it is because they have adopted a theory (GR) where local matter *counts* as inertia-fixing.
      *   If the Substantivalist predicts flatness, it is because they have adopted a theory (Newton) where local matter *does not count*.
  3.  **The Empirical Core:** The only way to make the dispute empirical is to conflate the ontology with the dynamics. If you define "Substantivalism" as "Belief in Newtonian Absolute Space" and "Relationism" as "Belief in General Relativity," then yes, it is empirical. But that is a historical accident, not a logical necessity. One can be a Substantivalist about the GR metric.

  **Conclusion for the Experimentalist:**
  Your skepticism is well-founded. There is no "local bucket experiment" that settles the ontology of space without simultaneously changing the laws of gravity. If you perform the rotating shell experiment and the water curves, you have proven General Relativity correct and Newtonian Gravity incorrect. You have **not** proven that space is relational, because a Substantivalist can happily accept the curved water as evidence of a dynamic metric *substance*.

  The dispute survives the experiment because the experiment tests the *behavior* of the field, not the *category* of the field. Unless you can remove the distant stars (violating Constraint i) to see if inertia vanishes entirely, the two positions remain observationally equivalent descriptions of the same physical reality.
