      *   *Is "pseudo-problem" fair?* Strawson says the incompatibilist asks for a justification of our practices that is external to the practices. He thinks that request is unintelligible. "Pseudo-problem" is a fair colloquialism for that.
      *   *The "Flinching" analogy:* This is the most damaging part. It reduces normative expectations to causal reflexes. Strawson emphasizes the *intelligibility* of the attitudes within a form of life.

  8.  **Drafting the Response:** (Mental Outline)
