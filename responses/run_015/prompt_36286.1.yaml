          *   *Excuses vs. Exemptions:* This is the big one. "Pushed" is an excuse (participant stance). "Insane" is an exemption (objective stance). The summary equates them.
          *   *Explanation vs. Exemption:* Determinism explains everything, but Strawson says it doesn't mandate the objective attitude.
      *   **Section 3: The Psychopath Conclusion.** Analyze why it fails. It assumes "explained behavior" = "objective attitude." Strawson says "explained behavior" (via determinism) is compatible with blame. Only specific *incapacities* warrant the objective attitude.
