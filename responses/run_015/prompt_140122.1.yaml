  *   **Why:** Modus Tollens. $A \to B$, $\neg B$, therefore $\neg A$. Both rules zero out the $A$ partition entirely.
  *   **Result:** $P(Arson) = 0$.

  **Case 5 (Leak/Room): Verdict: YOU (Ratio-Preserver).**
  *   **Why:** Testimony. The source gave a conditional tip, not a physical elimination. Aggressively dropping a prior from 1% to 0.5% on a vague tip is over-updating.
  *   **Arithmetic:** Keep $P(Room) \approx 1\%$. Shift the internal probability of "Laptop" within the Room scenario to 100%.
  *   **Result:** $P(Room)$ barely moves (maybe slight drop due to normalization if you treat the source as slightly more likely to speak on high-prob worlds, but essentially flat).

  **Case 6 (Partner/Berlin): Verdict: FRIEND (World-Eliminator).**
  *   **Why:** You cannot preserve marginals on a biconditional ($A \iff B$) if the priors differ ($0.9 \neq 0.1$). If $A$ and $B$ stand or fall together, their probabilities must equalize. Your rule breaks here because it tries to keep $P(A)=0.9$ and $P(B)=0.1$ while asserting they are the same event.
  *   **Arithmetic:** Eliminate $A \land \neg B$ (0.81 mass) and $\neg A \land B$ (0.01 mass). Survivors: $A \land B$ (0.09) and $\neg A \land \neg B$ (0.09).
  *   **Result:** 50/50. Your intuition (0.9) is incoherent with the biconditional constraint.

  **Case 7 (Judy Protocol): Verdict: YOU (but via Likelihood).**
  *   **Why:** You explicitly modeled the likelihood. $P(Message | Blue) = 1$ (they say "Blue"). $P(Message | \neg Blue) = 1$ (they say conditional).
  *   **Arithmetic:** If you hear the conditional, you know you are *not* in Blue (because if you were, they would have said "Blue").
  *   **Result:** $P(Blue) = 0$. This is standard Bayesian updating on the message likelihood, not the conditional content.

  ---

  ### Stress Tests

  **1. Source is 70% Reliable:**
  *   **Rule:** Adjust the likelihoods. $P(M | \text{True Conditional}) = 0.7$, $P(M | \text{False Conditional}) = 0.3$ (assuming they guess randomly when lying/wrong).
  *   **Effect:** You don't zero out $A \land \neg B$. You just down-weight it. The update is softer. Your intuition in Case 5 (barely moving) is actually modeling low reliability implicitly.

  **2. Probabilistic Consequent ("If A, then B with chance 0.7"):**
  *   **Rule:** This is **Jeffrey Conditioning**.
  *   **Arithmetic:** Set $P_{new}(B | A) = 0.7$. Preserve the odds ratio of $A$ vs $\neg A$ (Your Rule / Clause B).
  *   **Effect:** Shift mass within the $A$ partition so 70% is on $B$. $P(A)$ stays constant.
  *   **Why:** Testimony about probabilities rarely eliminates worlds; it constrains expectations.

  **3. Two Conditionals in a Row:**
  *   **Scenario:** Learn "If A then B", then "If B then C".
  *   **Rule:** Apply sequentially.
  *   **Risk:** If you use Friend's Rule (World-Eliminator) twice, you might eliminate all worlds if the chain conflicts. If you use Your Rule (Ratio-Preserver), you preserve $P(A)$, then preserve $P(B)$ (which has now changed).
  *   **Coherence:** Ratio-Preserving is more stable for chains of testimony. World-Eliminating is brittle.

  **4. A and B Start Correlated:**
  *   **Scenario:** $P(B|A)$ is already 0.9. Learn "If A then B".
  *   **Friend's Rule:** Still eliminates $A \land \neg B$. Since that cell was small (10% of A), the renormalization impact is small. $P(A)$ drops slightly.
  *   **Your Rule:** $P(A)$ stays fixed. Internal shift is small (0.9 to 1.0).
  *   **Verdict:** Your Rule feels more natural here. If I'm already 90% sure B follows A, being told "B follows A" shouldn't tank my belief in A. Friend's Rule punishes you for not being certain enough.

  ---

  ### Where I Overturn You
  1.  **Case 3 (Server):** Observing the consequent *must* update the antecedent if the conditional was new information. You cannot treat the rule and the observation as independent of the base rate.
  2.  **Case 6 (Biconditional):** You cannot preserve unequal marginals when told two events are identical. You must collapse to 50/50 (assuming symmetric priors on the joint distribution).
  3.  **Case 2 (Coin):** If you accept Case 1 is 1/2, you must accept Case 2 is 1/2 *if* it is testimony. If Case 2 is 1/3, you are admitting it's a physical constraint. You can't have it both ways. I recommend treating Case 2 as testimony (1/2) to match Case 1, unless you know the urn has a physical law forbidding Heads/Black.

  ### Where My Reasoning Might Be Wrong
  My recommendation relies on **Clause B (Ratio-Preserving)** being the default for testimony. This is effectively the **Maximum Entropy** solution.
  *   **Vulnerability:** It assumes the speaker had no bias in *which* true conditional to utter. If the speaker is more likely to tell you "If A then B" when A is rare (to be helpful), then preserving $P(A)$ is wrong.
  *   **What would change my mind:** If you can construct a case where preserving $P(A)$ leads to a Dutch Book (a guaranteed loss in betting odds).
      *   *Example:* If I bet on A at the old price, and you know $A \to B$, can you pump money out of me?
      *   *Counter:* If I update to Friend's Rule (1/3), and the truth is Ratio-Preserving (1/2), I am underestimating A. I will lose bets on A.
      *   *Conclusion:* Neither rule is immune to "bad speaker models." The only safe rule is modeling the speaker (Case 7). Since we rarely know the speaker model, **Ratio-Preserving (Your Rule)** is the safer heuristic for testimony because it minimizes the assumption about the speaker's selection bias.

  ### Final Recommendation
  Adopt **Clause B (Ratio-Preserving)** as your default for "Someone told me If A then B."
  *   Keep $P(A)$ fixed.
  *   Set $P(B|A) = 1$.
  *   Renormalize within the $A$ partition only.

  Adopt **Clause A (World-Eliminating)** only for "I discovered a law of nature" or "I observed the outcome of a trial."
  *   Cross off $A \land \neg B$.
  *   Renormalize everything.

  Your frustration in Case 1 vs. Case 2 comes from unconsciously switching between these two clauses. Make the switch conscious.
