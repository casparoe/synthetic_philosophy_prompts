  **Clause A (The World-Eliminator / Friend's Rule):**
  Use this when the conditional represents a physical law, a logical constraint, or a source that *must* speak if a world is impossible.
  *   **Likelihood:** $P(M | A \land \neg B) = 0$. $P(M | \text{any other world}) = 1$.
  *   **Arithmetic:** Cross off the $A \land \neg B$ cell. Renormalize the rest.
  *   **Effect:** $P(A)$ drops. $P(B)$ rises.

  **Clause B (The Ratio-Preserver / Your Rule):**
  Use this when the conditional is testimony from a reliable source who selected this specific fact from a set of true facts, without a protocol forcing them to speak on impossibilities. This assumes the source is equally likely to utter $M$ in any world where $M$ is true.
