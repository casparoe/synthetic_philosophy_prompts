  ### The Rule: Likelihood-Based Conditionalization

  Do not condition on the proposition $A \supset B$. Condition on the event $M$ = "Source asserts 'If A then B'".

  $$P_{new}(W) = \frac{P_{old}(W) \times P(M | W)}{\sum P_{old}(W_i) \times P(M | W_i)}$$

