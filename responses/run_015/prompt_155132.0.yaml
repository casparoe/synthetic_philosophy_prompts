  ### Executive Agenda: The Mingjia Conceptual Reconstruction Project

  **Timeframe:** 18 Months (Phase 1: Months 1–12)
  **Team:** 2 Philosophers, 1 Historian of Logic
  **Constraint:** No deep Sinological training; reliance on established translations.

  Your intuition regarding the "hidden premise" (kind-membership restricted to linguistic classification) is the strongest lever available to this team. It bypasses the stalemate between pure semantics and pure metaphysics. However, your four lines of inquiry are not equally weighted. Some are foundational prerequisites; others are speculative extensions. Given your team's composition and the risk of anachronism without Sinological oversight, you must secure the conceptual ground before building the formal or applied superstructure.

  Below is the defended prioritization for the first year, including a necessary revision to Line 1.

  ---

  ### 1. Priority One: The Semantic-Ontological Interface (Revised Line 1)
  **Original:** *Whether the dialogue is best reconstructed as a thesis about linguistic reference, about metaphysical composition, or about the logic of classification.*
  **Revision:** *Determine the specific interface mechanism between linguistic modification and kind-membership.*

  **Ranking:** **Upstream (Foundational)**
  **Tractability:** **Moderate** (High conceptual fit for philosophers; low philological risk if translations are stipulated).
  **Conceptual Importance:** **Critical.**

  **Defense:**
  This is the absolute bottleneck. You cannot analyze property inheritance (Line 2), formalize negation (Line 4), or apply the theory to AI (Line 3) until you agree on what "White Horse is Not Horse" *does*. The traditional trichotomy (reference vs. metaphysics vs. classification) is a false choice; the dialogue's power lies in the *tension* between them.
  *   **Why First:** If you assume the dialogue is purely about reference, Line 2 (metaphysics) becomes irrelevant. If you assume it is purely metaphysical, Line 4 (logic of negation) becomes trivial. You must settle the "working hypothesis" that the denial rests on a linguistic constraint on kind-membership.
  *   **Tractability:** Since you lack Sinologists, do not attempt to resolve textual ambiguities. Instead, treat existing translations (e.g., Graham, Hansen, Fraser) as fixed data points. Your task is not philological but *reconstructive*: build the most coherent philosophical model that accounts for the translated premises. This plays to the philosophers' strengths.
  *   **Risk:** The risk is circularity. You must ensure you are not projecting a modern "sortal" view onto the text. Mitigate this by constantly checking if the model explains the *Hard-and-White* dialogues (Line 2) without ad hoc adjustments.

  ### 2. Priority Two: Systematic Property Inheritance (Line 2)
  **Original:** *Whether the School's broader taxonomy implies a systematic theory of property inheritance that conflicts with Aristotelian hylomorphism...*

  **Ranking:** **Midstream (Validation)**
  **Tractability:** **High** (Core analytic metaphysics).
  **Conceptual Importance:** **High.**

  **Defense:**
  Once Line 1 establishes the mechanism for "White Horse," Line 2 tests whether that mechanism is a *system* or a *parlor trick*. The *Hard-and-White* dialogues deal with property separation (e.g., can "hardness" exist without "whiteness"?).
  *   **Why Second:** This validates the Line 1 hypothesis. If your "linguistic classification" model from Line 1 cannot explain why "Hard" and "White" are separable in a way that "White" and "Horse" are not, your Line 1 model is insufficient.
  *   **Tractability:** This is the strongest fit for your two philosophers. Comparing "property inheritance" against Aristotelian hylomorphism is standard comparative metaphysics. It does not require new logic (Line 4) or modern tech (Line 3). It requires clear thinking about universals and particulars, which is your team's core competency.
  *   **Dependence:** It depends on Line 1 (you need to know what a "kind" is in this system) but is upstream of Line 4 (you need to know what properties exist before formalizing their negation).

  ### 3. Priority Three: The Logic of Negation (Line 4)
  **Original:** *Whether there is a recoverable logic of negation in the School of Names that differs from both Aristotelian and Stoic accounts...*

  **Ranking:** **Mid/Downstream (Formalization)**
  **Tractability:** **Low/Moderate** (High technical bar; high anachronism risk).
  **Conceptual Importance:** **High Risk/High Reward.**

  **Defense:**
  This is the Historian of Logic's primary domain, but it must wait until Lines 1 and 2 provide the semantic and ontological inputs.
  *   **Why Third:** You cannot formalize a "distinct logic of negation" until you know what is being negated. If Line 1 concludes that "is not" signifies a failure of linguistic fit rather than ontological exclusion, the formal logic will look radically different than if it signifies ontological separation. Premature formalization (doing this before Line 2) risks forcing the text into a standard predicate logic mold to make it "work."
  *   **Tractability:** This is the hardest line for a non-Sinologist team. Claiming a "distinct formal framework" requires proving that standard logic *cannot* capture the inference patterns. This is a high bar. It is better treated as a constraint check: "Does standard logic fail here?" rather than "Let's build a new logic."
  *   **Dependence:** Strictly downstream of Lines 1 and 2. The ontology (Line 2) dictates the logical operators (Line 4).

  ### 4. Priority Four: Contemporary Relevance (Line 3)
  **Original:** *Whether these classical taxonomic concerns bear directly on contemporary debates about natural kinds and artificial categorization...*

  **Ranking:** **Downstream (Application)**
  **Tractability:** **High** (Conceptual bridging).
  **Conceptual Importance:** **Moderate** (Justificatory rather than foundational).

  **Defense:**
  This is the payoff phase. It justifies the project to the broader philosophical community but adds no historical or systematic knowledge itself.
  *   **Why Last:** Applying Mingjia taxonomy to AI classification is only valuable if the Mingjia taxonomy is robust. If you do this first, you risk "presentism"—finding similarities that vanish once the historical theory is rigorously defined.
  *   **Tractability:** Very high for philosophers. You know natural kinds; you can learn the basics of classification algorithms. However, this work is useless if Line 1's reconstruction is flawed.
  *   **Dependence:** Fully downstream. It requires the output of Lines 1, 2, and ideally 4 to function as a genuine application rather than a loose analogy.

  ---

  ### Strategic Revisions to the Inquiry List

  I recommend **collapsing the trichotomy in Line 1**.
  Do not ask whether the dialogue is about reference, metaphysics, *or* classification. The prompt's own insight identifies the "hidden premise" as the key: *kind-membership survival under accidental modification.*
  **Revised Line 1:** *Reconstruct the conditions under which linguistic modification (e.g., 'white') blocks kind-identity (e.g., 'horse') without entailing ontological separation.*
  This focuses the team on the *mechanism* rather than the *category* of the argument. It prevents the philosophers from splitting into opposing camps (one arguing semantics, one arguing metaphysics) and forces them to build a unified model.

  ### Reordering Triggers: What Would Change This Plan?

  You must establish "kill criteria" or "pivot points" for the first 12 months.

  1.  **The Philological Pivot (Months 1–4):** If, during the Line 1 reconstruction, you encounter a textual consensus (via secondary literature) that the term *fei* ("is not") in this context is definitively established as a rhetorical device rather than a logical operator, **abort Line 4**. The project shifts entirely to Line 3 (Rhetoric/Pragmatics in Classification).
  2.  **The Systemic Failure (Months 5–8):** If the Line 1 model works for "White Horse" but fails to coherently explain "Hard-and-White" (Line 2) without contradiction, **pause Line 2**. This indicates the School of Names may not have a unified system, but rather a collection of paradoxes. You would then pivot to treating the texts as distinct case studies rather than a single theory, lowering the ambition of Line 4.
  3.  **The Formal Triviality (Months 9–12):** If the Historian of Logic demonstrates that the inference patterns in Lines 1 and 2 are fully capturable by standard free logic or sortal logic, **downgrade Line 4**. Do not force a "distinct framework" if one does not exist. The contribution then becomes the *application* of standard logic to a non-standard ontology (Line 2), rather than a new logic.

  ### Division of Labor Recommendation

  *   **Philosopher A (Metaphysics):** Lead on Line 1 (Ontological interface) and Line 2 (Property Inheritance/Hylomorphism).
  *   **Philosopher B (Language/Science):** Lead on Line 1 (Linguistic classification aspect) and Line 3 (Contemporary Natural Kinds/AI).
  *   **Historian of Logic:** Lead on Line 4 (Formalization), but act as the "constraint checker" for Lines 1 and 2. Their role is to ensure that the metaphysical claims made by A and B are logically coherent before they are formalized.

  ### Summary of Trade-Offs

  This agenda sacrifices **breadth** (you will not cover the entire School of Names) for **depth** (a rigorous reconstruction of the core mechanism). It sacrifices **philological novelty** (you will not discover new readings of the text) for **conceptual clarity** (you will produce a robust philosophical model). Given your 18-month constraint and team composition, this is the only viable path to a defensible publication record. Attempting to solve the Sinology (Line 1 philology) or the Formal Logic (Line 4) first would likely result in stalemate or anachronism. Secure the conceptual mechanism first; the rest follows.
