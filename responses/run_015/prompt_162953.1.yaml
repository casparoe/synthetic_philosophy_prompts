answer: |-
  Elara learned the word "water" as a child on Earth, where her parents used it to name the clear liquid in the taps and lakes, before immigrating as an adult to Twin Earth, where the taps and lakes hold a different substance that looks and tastes exactly the same. Years later, standing on the shore of a Twin lake, she fills a glass and says, "This water is safe," unaware that the liquid surrounding her is not what her parents meant by the word, nor what flows back home. She is a competent speaker using a common word to describe the immediate environment, relying on the same senses and memories she always has, fully settled in her new world while carrying the linguistic history of her old one.

  ***

  ### Why This Works

  **The Assignments**
  *   **Word:** "Water."
  *   **Speaker:** Elara (Earth immigrant living on Twin Earth).
  *   **Historical-Chain View (1):** Refers to **Earth-water**. The chain of transmission begins with her parents' baptism of the liquid on Earth; since she never underwent a new "baptism" for the Twin substance, her usage inherits the original reference.
  *   **Causal-Regulation View (2):** Refers to **Twin-water**. The tokening of the word is currently caused and regulated by the presence of the Twin substance; her concept is functioning as a detector for what is currently in her environment.

  **The Key Feature**
  The work is done by **the transplant scenario** (an Earth learner in a Twin environment).
  *   **Remove the historical link:** If Elara were born on Twin Earth, both views agree the word refers to Twin-water (History starts there; Cause is there).
  *   **Remove the environmental difference:** If Twin Earth had Earth-water, both views agree the word refers to Earth-water (History points there; Cause points there).
  The conflict exists only because her *past learning* and *present causing* are geographically separated.

  **The Pushback**
  *   **Historical-Chain Defender:** They might argue that reference *switches* after sufficient immersion. If Elara lives on Twin Earth long enough, she joins the local linguistic community, and the chain re-grounds in the new environment. To save the theory, they must claim Elara is still an "outsider" linguistically, or that individual idiolects retain original grounding despite community pressure.
  *   **Causal-Regulation Defender:** They might argue that causal regulation is sensitive to *history* (e.g., asymmetric dependence). Her concept tracks Twin-water *because* it is similar to the Earth-water she learned first; thus, the reference remains Earth-water even here. To save the theory, they must insist that current covariance trumps historical etiology in cases of permanent relocation.

  **The Lesson**
  This case shows that **externalism is not a single thesis** but a family of commitments. Both views agree meaning isn't in the head, but they disagree on *which* external facts matter: the **genealogy** of the word (History) or the **current covariance** of the concept (Regulation). It forces readers to see that "context" can mean either where you came from or where you stand.

  **Sanity Check**
  Both views are genuinely externalist. Neither locates reference in internal descriptions or brain states; both locate it outside the skin (one in the past environment/social chain, one in the present environment/causal link). Neither is descriptivism; a descriptivist would say the reference is fixed by Elara's internal concept of "clear, drinkable liquid," which would likely pick out whatever fits that description in either world, avoiding the split entirely.

  **Bonus: Twin Earth vs. Terrestrial**
  The Twin Planet is **heuristically essential** but metaphysically optional.
  *   **Terrestrial Version:** A child learns "gold" from real gold deposits, then moves to a region where all "gold" is actually pyrite (fool's gold), indistinguishable without advanced tools, and locals call it gold. History says Gold; Current Cause says Pyrite.
  *   **What Twin Earth Adds:** On Earth, the deception is usually temporary (chemistry reveals the difference). Twin Earth makes the ignorance **rational and permanent**. It ensures Elara is epistemically normal—she isn't mistaken or ignorant in a way she could correct. This isolates the philosophical variable (reference) from the epistemological one (knowledge), making the conflict about meaning alone, not about what she *ought* to know.
