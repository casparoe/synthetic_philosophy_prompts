prompt: |-
  had a huge argument with my friend last night -- she says memetics died in the 90s and i should drop it, i say what died was the version where a meme is a little code copied brain-to-brain and nobody serious ever defended only that. so now i've agreed to give a 20-minute talk to the cultural evolution reading group here and i want to walk in ready for the question period.

  My thesis: the unit of cultural inheritance isn't the meme, it's what I'm calling a *scaffold* -- the little rebuilt environment (tools left out in a certain order, an arranged workspace, trained attention, the way a novice's body gets positioned) that makes re-acquiring the trait cheap. Fidelity is a property of the scaffold, not of copying: the copy can be pretty bad as long as the reconstructed niche reliably rebuilds the conditions under which the trait gets reacquired. So selection acts on variants by how cheaply their scaffold rebuilds itself, and high-fidelity transmission is a special case rather than the mechanism. Second half of the argument: this is why lab transmission-chain experiments keep finding degradation -- the design strips the scaffold out and then reports the loss as a fact about culture.

  Audience: about half are dual-inheritance / gene-culture coevolution modelers -- they think in transmission parameters, fidelity, biased transmission, population structure, and they will want to see my recursion and my generation time. The other half are anthropologists of apprenticeship and situated learning who think those lab chains are a parody of real transmission and who get allergic to the word replicator. Plus one historian of science who will want to know what makes any of this Darwinian rather than just Spencerian progress-talk with equations.

  Give me the prep sheet: the objections I'll actually get, in that room, phrased the way each group would phrase them, ordered by how much damage they do, each with a short reply (two minutes max) and a note on where the reply is soft. What should I concede in the first two slides rather than be forced into later? Which single reply has to land for the talk to survive? What's the weakest point in my own position that I should walk in having already admitted? And give me the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had an argument about memetics (specifically, whether it died in the 90s). They are now giving a 20-minute talk to a cultural evolution reading group.
      *   **Thesis:** The unit of cultural inheritance isn't the "meme" (brain-to-brain code), but the "scaffold" (reconstructed environment, tools, attention, body positioning). Fidelity comes from the scaffold rebuilding conditions for reacquisition, not high-fidelity copying. Lab transmission chains fail because they remove the scaffold.
      *   **Audience:**
          1.  Dual-inheritance/Gene-culture coevolution modelers (math-heavy, care about parameters, fidelity, generations).
          2.  Anthropologists of apprenticeship/situated learning (qualitative, hate "replicator," hate lab chains).
          3.  One Historian of Science (cares about Darwinism vs. Spencerism).
      *   **Deliverable:** A prep sheet containing:
          *   Objections phrased by each group (ordered by damage).
          *   Short replies (2 mins max).
          *   Notes on where the reply is soft.
          *   Concessions to make early (first two slides).
          *   The single reply that *must* land.
          *   The weakest point to admit upfront.
          *   The question hoping nobody asks.

  2.  **Deconstruct the Thesis ("Scaffold Theory"):**
      *   *Core Idea:* Cultural inheritance is niche construction. It's about setting up the environment so the next person rediscovers/learns the thing easily.
      *   *Strength:* Bridges the gap between high-fidelity copying (modelers) and situated learning (anthropologists). Explains why lab experiments fail (no niche).
      *   *Weakness:* Is it Darwinian? If the "copy" is actually "re-invention," where is the heredity? How do you model this mathematically? What defines the boundary of a scaffold?

  3.  **Drafting the Objections (Categorized by Audience):**

      *   *Modelers:* They need math. "Scaffold" sounds fuzzy. How do you measure selection without discrete units?
          *   *Objection:* "If transmission is reconstruction, where is the heredity? How do you model $w$ (fitness) if the trait is reinvented every time?"
          *   *Damage:* High. Undermines the evolutionary claim.
      *   *Anthropologists:* They hate reductionism. "Scaffold" might sound like just another word for "context."
          *   *Objection:* "Isn't this just rebranding 'context' or 'affordance'? Why do we need a new unit?"
          *   *Damage:* Medium. Philosophical quibble, but could stall the talk.
      *   *Historian:* Darwin vs. Spencer.
          *   *Objection:* "If traits are reconstructed based on utility, isn't this transformational (Spencerian) rather than variational (Darwinian)?"
          *   *Damage:* High. Threatens the theoretical foundation.

      *   *Ordering by Damage:*
          1.  Historian/Modelers (The "Darwinism" question). If it's not Darwinian, cultural *evolution* is the wrong frame.
          2.  Modelers (The "Math/Parameter" question). If it can't be modeled, modelers will dismiss it.
          3.  Anthropologists (The "Rebranding" question). If it's old wine in new bottles, it's not novel.

  4.  **Developing Replies:**
      *   *Darwinism:* Need to emphasize *variation* in scaffolds, not just utility. Scaffolds mutate (tools break, arrangements shift). Selection is on the *persistence* of the scaffold, not the "truth" of the trait.
      *   *Math:* Parameters become rates of scaffold decay and reconstruction costs. Generation time is the lifecycle of the niche.
      *   *Rebranding:* It's not just context; it's the *causal mechanism* of stability. Context is background; scaffold is the active stabilizer.

  5.  **Identifying Concessions (First Two Slides):**
      *   Don't fight the "memetics is dead" battle. Concede Dawkins' original formulation was too narrow.
      *   Concede that "scaffold" isn't a discrete particle like a gene.
      *   *Why?* Disarms the anthropologists (not a replicator) and modelers (not pretending it's a gene).

  6.  **The "Must Land" Reply:**
      *   It has to be the definition of *Heredity without Replication*. If the audience doesn't buy that reconstruction counts as inheritance, the talk is over. The reply must show that *stability of outcome* via *causal continuity of the scaffold* equals heredity.

  7.  **The Weakest Point:**
      *   Boundaries. Where does one scaffold end and another begin? This is the "unit of selection" problem all over again. Admit this is an empirical challenge, not a theoretical dealbreaker.

  8.  **The "Hope Nobody Asks" Question:**
      *   Something that exposes the lack of formalization or a specific counter-example where scaffolds persist but traits change (decoupling). Or, "How is this different from Extended Phenotype?" (Dawkins already did this). Let's go with the Extended Phenotype angle—it's the most dangerous theoretical overlap.

  9.  **Refining and Polishing:**
      *   Tone: Professional, sharp, ready for a fight but collegial.
      *   Format: Clear headings, bullet points for readability during a talk prep.
      *   Check constraints: 2-minute replies (roughly 250-300 words spoken, but here summarized for prep).

      *(Self-Correction during drafting)*: Wait, the Historian's objection is crucial. If the trait is *reconstructed* based on the environment, isn't that Lamarckian/Spencerian? I need to make sure the reply emphasizes *variation in the scaffold* is blind to the utility of the trait. The scaffold doesn't "know" what it's building.

      *(Refining the Modeler objection)*: They care about $r$ (rate) and fidelity. If fidelity is low, how does complexity accumulate? The reply must be: Complexity accumulates in the *scaffold*, not the head. The brain doesn't hold the complexity; the room does.

      *(Refining the Anthropologist objection)*: They hate "unit." Don't call it a unit. Call it a "process bundle."

  10. **Final Review against User Prompt:**
      *   Objections phrased by group? Yes.
      *   Ordered by damage? Yes.
      *   Short replies? Yes.
      *   Soft spots noted? Yes.
      *   Concessions for first two slides? Yes.
      *   Single reply to land? Yes.
      *   Weakest point to admit? Yes.
      *   Question hoping nobody asks? Yes.

      *Let's assemble the prep sheet.*
answer: |-
  # PREP SHEET: The Scaffold Theory of Cultural Inheritance
  **Time:** 20 mins + Q&A
  **Goal:** Defend "Scaffold" as the unit of inheritance without triggering "Replicator" allergies or "Impossible to Model" dismissals.

  ---

  ## 1. CONCESSIONS (Make these in Slides 1–2)
  *Do not wait to be cornered. Disarm the room immediately.*

  *   **Concede to the Anthropologists:** "I am not proposing a new 'replicator.' If 'replicator' implies a discrete, high-fidelity copy machine in the brain, I agree that doesn't exist. I am talking about *stability of outcome*, not fidelity of copy."
  *   **Concede to the Modelers:** "I am not offering a closed-form equation today. The 'generation time' here is the lifecycle of the niche, not the reproductive age of the agent. I know that complicates your matrices; I want to discuss how to parameterize decay rates, not transmission fidelity."
  *   **Concede to the Historian:** "This is not Spencerian progress. Scaffolds degrade. They mutate blindly. They persist not because they are 'better' in a moral or linear sense, but because they are cheaper to rebuild than their competitors."

  ---

  ## 2. THE OBJECTIONS (Ordered by Damage)

  ### **Objection 1: The "Darwin vs. Spencer" Trap**
  *   **Who:** Historian of Science (supported by skeptical Modelers).
  *   **Phrasing:** "If the learner *reconstructs* the trait based on the environment, isn't this transformational evolution? If the scaffold guides them to the 'correct' solution every time, where is the blind variation? This sounds like Lamarckian acquisition with extra steps."
  *   **Damage:** **Critical.** If this isn't Darwinian, it's not cultural *evolution*, it's just cultural *change*.
  *   **The Reply (2 mins):** "Variation enters through scaffold decay and perturbation, not through copying error. A tool left out rusts; a workspace gets rearranged; a master's posture slips. The learner isn't guided to a 'correct' solution, they are guided to a *feasible* one given the degraded scaffold. The variation is in the *reconstruction conditions*, which are blind to the utility of the outcome. Selection acts on which scaffolds survive the week, not which ideas are 'true.' It is variational, but the variance is in the niche, not the genotype."
  *   **Soft Spot:** You need empirical proof that scaffold variation is truly "blind" and not directed by the teacher's intent.

  ### **Objection 2: The "Parameterization" Problem**
  *   **Who:** Dual-Inheritance Modelers.
  *   **Phrasing:** "Okay, but how do you model this? If fidelity is a property of the environment, your transmission parameter ($\mu$) becomes a function of room temperature and tool availability. How do you define population structure when the 'population' is a set of arranged objects?"
  *   **Damage:** **High.** If they can't model it, they will categorize it as "qualitative description" and ignore it.
  *   **The Reply (2 mins):** "You model the *cost of reconstruction* rather than the *probability of copying*. Let $C$ be the energy/time cost to rebuild the scaffold. Selection favors traits where $C_{rebuild} < C_{learn\_from\_scratch}$. Population structure becomes 'Niche Overlap.' If two groups share the same tool arrangement, they are in the same population, regardless of genetic or linguistic distance. We can run agent-based models where agents modify the grid, and the grid modifies the agents. The math exists; it's usually called 'niche construction,' I'm just claiming it's the *primary* driver of cultural heredity."
  *   **Soft Spot:** You don't have the ABM code ready. You are promising it can be done.

  ### **Objection 3: The "Rebranding" Accusation**
  *   **Who:** Anthropologists of Apprenticeship.
  *   **Phrasing:** "This sounds exactly like 'situated learning,' 'affordances,' or 'distributed cognition.' Why do we need a new term 'scaffold' other than to colonize our literature with evolution-speak?"
  *   **Damage:** **Medium.** Makes you look ignorant of existing literature, but doesn't kill the theory.
  *   **The Reply (2 mins):** "Situated learning describes the *phenomenology* of learning. Scaffold theory describes the *mechanism of inheritance*. Anthropologists show *that* the apprentice learns by positioning; I am asking *how* that positioning persists across 50 generations without a central planner. 'Affordance' is static; 'Scaffold' is dynamic and subject to selection. I need the term to distinguish the *inherited environment* from the *immediate context*."
  *   **Soft Spot:** The distinction between "context" and "inherited environment" is fuzzier in practice than in theory.

  ---

  ## 3. THE SINGLE REPLY THAT MUST LAND
  **Topic:** Heredity without Replication.
  **Why:** If they don't accept that reconstruction counts as inheritance, the talk fails.
  **The Soundbite:** "Heredity is not the transmission of *information*; it is the preservation of *causal structure*. If I arrange the bricks so you build the same wall I did, not because I told you to, but because the bricks only fit one way, the wall has been inherited. The bricks are the memory, not your brain."

  ---

  ## 4. THE WEAKEST POINT (Admit Upfront)
  **Issue:** **Boundary Definition.**
  **What to say:** "I do not yet have a crisp algorithm for where one scaffold ends and another begins. Just as the 'gene' took 50 years to define molecularly, the 'scaffold' is currently a functional concept, not a discrete unit. If you are looking for a particle, I don't have one. I have a process."
  **Why:** Prevents them from spending 10 minutes trying to draw a box around your unit.

  ---

  ## 5. THE QUESTION YOU HOPE NOBODY ASKS
  **The Question:** "Isn't this just Dawkins' **Extended Phenotype**?"
  **Why it hurts:** Dawkins already argued that genes express themselves in the environment (beaver dams, bird nests) to aid their own replication. If your "Scaffold" is just the Extended Phenotype, you haven't killed memetics; you've just updated it. It undermines your claim that memetics "died" or was wrong about the locus of inheritance.
  **The Panic Reply (if asked):** "Dawkins kept the *gene* as the replicator. I am suggesting the *scaffold itself* is the unit of selection in culture. In the Extended Phenotype, the dam serves the beaver's genes. In Scaffold Theory, the workspace serves its own persistence, sometimes *against* the learner's biological interest (e.g., dangerous industrial practices). The selection pressure is on the cultural structure, not the human host."
  *(Note: This is a risky distinction. Be prepared for them to press that the human still builds the scaffold.)*

  ---

  ## 6. TACTICAL NOTES FOR THE ROOM
  *   **When Modelers speak:** Nod at "parameters." Write "Decay Rate" on the board. Do not let them reduce you to "transmission fidelity."
  *   **When Anthropologists speak:** Use the word "Embodiment." Validate their fieldwork. Say "Your data is the evidence for my mechanism."
  *   **When the Historian speaks:** Do not use the word "Progress." Use "Retention" and "Variation."
  *   **Body Language:** When describing the "Lab Transmission Chains," use a dismissive hand gesture. You and the Anthropologists are united against the "Sterile Lab." Use that alliance to buffer the Modelers.
