answer: |-
  1. You insist this isn't just a Dennett-ish shrug that there's no fact of the matter—you say there's a positive story to tell. But if the Orwellian versus Stalinesque distinction is badly formed, what work is left for your view to do? What does content-only timing explain that a standard eliminativism doesn't?

  2. Let's pin down the evidence. If experiences aren't located at times, what counts as the datum for your theory? When you say the experience represents a sequence, what are you actually measuring?

  3. Say the datum is just what the subject's experience represents. But representations have to be tokened in the brain. Doesn't the Orwell versus Stalin fight just reappear one level down, as a dispute about which neural vehicle got tokened when?

  4. Consider a variant where the color of the second flash isn't fixed until after the midpoint—say, a coin flip timestamped later. Intuitively, there couldn't be a red-experience at the midpoint whose content wasn't settled yet. Does this force you to concede the experience itself happens later?

  5. If you say the content is only fixed later, isn't that just the Stalinesque horn? You're saying the system revises the story before publication. How is "content fixed later" different from "memory revised"?

  6. Imagine we run Color Phi but also collect a speeded green/red discrimination via button press at the midpoint, plus a delayed verbal report. If those two come apart, what does each pattern show for your view?

  7. If the speeded press matches the second flash time but the report says midpoint, why isn't the press a better guide to the timing of the experience? What blocks you from treating the motor output as a dated event?

  8. Let's generalize that. Is your view secretly just the Stalinesque horn with "experience" swapped for "content"? Is "the experience now represents red as having been at the midpoint" really different from "memory was revised"? What's the cash value of the distinction?

  9. You owe an error theory for the intuition that there's something it's like right now. If nothing is located at a time, what makes a run of experiences one stream rather than a pile? What binds them?

  10. Finally, what evidence could count against you? If we had an independently validated neural marker of red-at-midpoint content present at the midpoint time, would that settle anything? If not, what would?
