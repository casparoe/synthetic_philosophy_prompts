prompt: |-
  You are advising a three-year research programme that must advance how institutional beliefs and social structures are reconstructed from material remains alone, with no textual corroboration. Among the open problems—how to weigh negative evidence (the absence of expected ritual objects in an otherwise intact assemblage), how to distinguish collective intentionality from aggregated individual practice in burial patterns, and how settlement-layout analysis can constrain cosmological inference without circular reasoning—which two should take priority and in what order? I want you to treat the inferential asymmetry between presence and absence (where a missing cult object might signal taboo, trade interruption, or mere taphonomic loss) not as a settled methodological point but as a live crux: is resolving it upstream of the others, or is it a secondary refinement that depends on first solving the collective-intentionality problem? Rank your priorities with explicit criteria—tractability for non-textual contexts, dependence relations between questions, and risk of false institutional attribution—and state what empirical or conceptual result in the next few years would reorder them. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a three-year research programme.
      *   **Goal:** Advance reconstruction of institutional beliefs and social structures from material remains *alone* (no texts).
      *   **Open Problems:**
          1.  Weighing negative evidence (absence of expected objects).
          2.  Distinguishing collective intentionality from aggregated individual practice (burial patterns).
          3.  Settlement-layout analysis constraining cosmological inference without circularity.
      *   **Task:** Select *two* priorities, rank them, and justify the order.
      *   **Specific Constraint:** Treat the inferential asymmetry between presence and absence (Problem 1) as a live crux, not settled. Decide if it's upstream or downstream of Problem 2.
      *   **Criteria for Ranking:** Tractability (non-textual), dependence relations, risk of false institutional attribution.
      *   **Future Condition:** State what empirical/conceptual result in the next few years would reorder them.
      *   **Language:** British English.

  2.  **Evaluate the Three Problems:**

      *   *Problem 1: Negative Evidence (Absence).*
          *   *Challenge:* Equifinality. Absence = Taboo? Trade failure? Taphonomy?
          *   *Risk:* High risk of false attribution (seeing meaning where there is none, or missing meaning where there is).
          *   *Tractability:* Low without a baseline. Hard to prove a negative archaeologically.
          *   *Dependence:* Requires knowing what *should* be there (norms) to know what is missing.

      *   *Problem 2: Collective Intentionality vs. Aggregated Practice (Burials).*
          *   *Challenge:* Did the group decide this (institution), or did individuals just happen to do similar things (habit/emulation)?
          *   *Risk:* Misidentifying social structure (state/religion vs. loose kinship).
          *   *Tractability:* Moderate. Statistical regularity + deviation analysis can help.
          *   *Dependence:* This establishes the *existence* of the institution. If there is no collective intentionality, there is no institution to have beliefs about absence.

      *   *Problem 3: Settlement Layout & Cosmology.*
          *   *Challenge:* Circular reasoning (assuming cosmology to explain layout, then using layout to prove cosmology).
          *   *Risk:* High circularity.
          *   *Tractability:* Low without independent verification.
          *   *Dependence:* Relies on understanding social structure (Problem 2) and normative expectations (Problem 1).

  3.  **Determine Priorities (Selecting Two):**

      *   *Selection:* Problem 2 (Collective Intentionality) and Problem 1 (Negative Evidence).
      *   *Reasoning:* Problem 3 (Settlement/Cosmology) is too speculative without first solving the nature of the social agent (Problem 2). You cannot map cosmology onto a settlement if you don't know if the settlement reflects a collective decision or organic growth. Problem 1 and 2 are foundational to defining the "institution" itself.
      *   *Ordering:* Problem 2 first, then Problem 1.
      *   *Why?* You must establish that an *institution* exists (Collective Intentionality) before you can analyse its specific normative rules (Negative Evidence). If the burial patterns are just aggregated individual choices, there is no "institution" to hold a "belief" about missing objects. Therefore, Problem 2 is upstream.

  4.  **Drafting the Argument (incorporating criteria):**

      *   *Criterion 1: Dependence Relations.*
          *   To argue from absence (Problem 1), one must establish a normative expectation. Norms require collective intentionality (Problem 2). Therefore, 2 precedes 1.
      *   *Criterion 2: Risk of False Institutional Attribution.*
          *   Assuming collective intent where there is none is the primary error. Solving 2 mitigates this. Assuming meaning in absence (1) is a secondary error that compounds the first.
      *   *Criterion 3: Tractability.*
          *   Burial data (Problem 2) is often discrete and quantifiable (orientation, grave goods, body position). Negative evidence (Problem 1) is inherently elusive. Start with the more tractable data to build the framework for the harder problem.

  5.  **Addressing the "Live Crux" (Absence vs. Presence):**
      *   The prompt asks specifically about the inferential asymmetry. I need to argue that resolving the *agent* (Collective Intentionality) is a prerequisite for resolving the *signal* (Absence). You can't interpret the silence until you know who is speaking.

  6.  **Identifying the Reordering Condition:**
      *   What would make Problem 1 priority?
      *   If a new taphonomic or geochemical method allows definitive proof of *removal* vs. *non-deposition*. If we can scientifically prove an object was ritually removed (taboo) rather than lost, Problem 1 becomes tractable independently of social theory.
      *   Alternatively, if big data analysis of burial patterns (Problem 2) hits a wall of ambiguity, we might need to look at settlement absences (Problem 1/3 hybrid) to find structure.
      *   *Best fit:* A methodological breakthrough in distinguishing taphonomic loss from deliberate curation (e.g., micro-stratigraphic signatures of ritual cleansing).

  7.  **Review and Refine (British English & Tone):**
      *   *Tone:* Academic, advisory, decisive but nuanced.
      *   *Spelling/Grammar:* British (programme, analyse, centre, prioritisation, etc.).
      *   *Check:* Did I select exactly two? Yes. Did I rank them? Yes. Did I use the criteria? Yes. Did I include the reordering condition? Yes.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't dismiss Problem 3 entirely, but explain why it's not top two. (It relies on the output of 1 and 2).
      *   *Emphasis:* Ensure the distinction between "aggregated individual practice" and "collective intentionality" is clear, as this is the linchpin of the argument.
      *   *Constraint Check:* The prompt asks to treat the absence/presence asymmetry as a live crux. I need to explicitly state that solving intentionality is the key to unlocking that crux, rather than solving the crux to find intentionality.

  9.  **Final Output Structure:**
      *   Introduction: State the priority order.
      *   Priority 1: Collective Intentionality (Justification via criteria).
      *   Priority 2: Negative Evidence (Justification via criteria & dependence on 1).
      *   The Reordering Condition: What changes the landscape?
      *   Conclusion: Summary of strategic value.

  (Proceed to generate response based on these thoughts.)
answer: |-
  **Memorandum of Advice: Strategic Priorities for Material-Only Institutional Reconstruction**

  **Subject:** Prioritisation of Methodological Problems in Non-Textual Archaeology
  **Duration:** Three-Year Programme

  Regarding the three open problems presented, I advise that the programme prioritises **Distinguishing Collective Intentionality from Aggregated Individual Practice** (Problem A) as the primary objective, followed by **Weighing Negative Evidence** (Problem B). The third problem, Settlement-Layout Analysis (Problem C), should be deferred until the first two are substantially advanced, as it relies heavily on the outputs of both.

  Below is the justification for this ranking, applying your specified criteria, followed by the condition under which this order should be inverted.

  ### Priority 1: Distinguishing Collective Intentionality from Aggregated Individual Practice
  **Timeframe:** Year 1–2

  This problem must be addressed first because it establishes the ontological status of the 'institution' itself. Without confirming that a pattern arises from a shared mental state (collective intentionality) rather than parallel individual choices (aggregated practice), any subsequent inference about beliefs or structures is fundamentally unstable.

  *   **Dependence Relations:** This is the upstream constraint. To interpret the absence of an object as a normative prohibition (Problem B), one must first establish that a norm exists. Norms are products of collective intentionality. If burial patterns are merely the sum of individual emulations without institutional enforcement, 'absence' carries no structural weight. Therefore, Problem B is logically dependent on the resolution of Problem A.
  *   **Risk of False Institutional Attribution:** This is the highest-risk area. Attributing state-level religious coordination to what is actually a decentralised kinship trend is a category error that invalidates all downstream cosmological modelling. By securing the nature of the social agent first, we minimise the risk of projecting centralised belief systems onto fragmented societies.
  *   **Tractability:** In non-textual contexts, burial assemblages offer discrete, quantifiable data points (orientation, grave good combinations, body treatment). Statistical clustering and deviation analysis can identify 'rules' with greater confidence than the elusive nature of absence. It is methodologically safer to prove what *is* consistently done before theorising what was *forbidden*.

  ### Priority 2: Weighing Negative Evidence (The Inferential Asymmetry)
  **Timeframe:** Year 2–3

  Once the existence of collective intentionality is established, the programme should tackle the inferential asymmetry between presence and absence. This problem is treated here not as a settled methodological point, but as a secondary refinement that depends on the prior definition of the normative baseline.

  *   **Dependence Relations:** As noted, 'absence' is only significant relative to an expectation. Problem A provides the expectation (the norm). Problem B investigates the deviation. If we attempt to weigh negative evidence without first solving collective intentionality, we cannot distinguish between a ritual taboo (institutional absence) and a taphonomic loss (accidental absence), because we lack the baseline of what the institution *required*.
  *   **Risk of False Institutional Attribution:** The risk remains high but is manageable if Priority 1 is solved. If we know a collective rule existed, the absence of a ritual object becomes a candidate for 'taboo' or 'interruption' rather than mere loss. However, without Priority 1, interpreting absence is pure speculation.
  *   **Tractability:** This is inherently less tractable than presence-based analysis. It requires rigorous taphonomic controls and comparative regional data to rule out preservation bias. It is placed second because it requires the theoretical framework established in Year 1 to be meaningful.

  ### The Live Crux: Intentionality vs. Absence
  You asked specifically whether resolving the inferential asymmetry of absence should be upstream. My assessment is that it must be **downstream**.

  Treating absence as the primary key is a category error in material-only studies. One cannot measure a silence until one knows the language being spoken. The 'absence' of a cult object is only data if we know the 'presence' of that object was institutionally mandated. Therefore, the collective-intentionality problem is the prerequisite for unlocking the asymmetry of absence. We must prove the 'rule' before we can analyse the 'exception'.

  ### Condition for Reordering Priorities

  The prioritisation outlined above should be inverted only if a specific empirical or conceptual breakthrough occurs within the next 18 months:

  **The Reordering Condition:**
  If a new methodological protocol is validated that allows for the **definitive differentiation between deliberate curation/removal and taphonomic loss at the micro-stratigraphic level.**

  For example, if soil chemistry or micro-morphology can prove that a specific locus was ritually 'cleansed' (indicating deliberate removal of objects) versus simply never receiving them or losing them to decay, the tractability of Problem B increases dramatically.

  Should such a technique become robust and widely applicable, **Weighing Negative Evidence** should become Priority 1. In this scenario, the physical proof of 'deliberate absence' would serve as a stronger proxy for collective intentionality than burial regularities, which can remain ambiguous between habit and law. If we can scientifically prove an object was *removed* by an agent, we have simultaneously proven the existence of a norm and the violation/maintenance of it, effectively collapsing Problem B into Problem A.

  ### Summary
  1.  **First:** Secure the social agent (Collective Intentionality).
  2.  **Second:** Interpret the silence (Negative Evidence).
  3.  **Monitor:** Breakthroughs in detecting deliberate removal.

  This sequence ensures that the programme builds a secure foundation of social ontology before attempting the more fragile reconstruction of belief systems from what is missing.
