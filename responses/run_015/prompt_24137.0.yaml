answer: |-
  ### Decision Procedure for Implicature-Based Claims

  **Step 1: Literal Verification**
  Is the explicit proposition verifiable and false?
  *   **Yes:** Flag as **Checkable**. (This is a lie or error, not merely implicature).
  *   **No/Subjective:** Proceed to Step 2.

  **Step 2: Conventionality Test**
  Is the disputed meaning attached to specific lexical items (e.g., "but," "therefore," "even")?
  *   **Yes:** Flag as **Checkable**. (Conventional implicatures are tied to word meaning and are generally non-cancellable).
  *   **No:** Proceed to Step 3.

  **Step 3: Maxim Behavior (Flouting vs. Violating)**
  Is the speaker openly failing a Maxim (Flouting) to generate inference, or secretly failing it (Violating) to deceive?
  *   **Violating (e.g., Quality):** The literal statement is false. Return to Step 1 (**Checkable**).
  *   **Flouting (e.g., Relation):** The statement is irrelevant but meaningful. Proceed to Step 4.

  **Step 4: Cancellability Test**
  Can the speaker append "but not [inference]" without logical or pragmatic contradiction?
  *   **Yes (Easily Cancellable):** Flag as **Not Checkable**. (The inference is too weak to count as an assertion).
  *   **No (Contextually Blocked):** Hand to **Senior Editor**. (Judgment required on whether pragmatic force equals assertion).

  ***

  ### Theoretical Grounding: Settled vs. Contested

  **Settled in Gricean Literature:**
  *   **Cancellability** is the definitive test for conversational implicature. If an inference can be denied without contradiction, it is not part of "what is said."
  *   **Conventionality** distinguishes meaning encoded in words (conventional) from meaning derived from context (conversational).
  *   **Flouting** generates implicature; **Violating** generates deception (lies).

  **Contested Among Scholars:**
  *   **Degrees of Strength:** Whether implicatures come in degrees of commitment (some "stronger" than others) is debated. Griceans traditionally treat implicature as binary (implicated or not); post-Griceans argue for scalar strength.
  *   **The Boundary:** Whether the said/implicated boundary is sharp or blurred is contested. Some argue strong implicatures function as assertions for accountability.
  *   **Cooperative Principle:** Whether this is a descriptive norm of conversation or a normative rule for rational communication remains disputed.

  *Note: This procedure treats the boundary as sharp (Settled View) to ensure consistency, handing off borderline "strength" cases to the Editor.*

  ***

  ### Application to Utterances

  **(1) Plant Manager: "We've never had a single safety incident at this plant."**
  *   **Step 1 (Literal):** The statement asserts a specific historical fact (zero incidents). This is verifiable.
  *   **Result:** **Checkable**.
  *   **Reasoning:** This is "what is said." There is no implicature to test; the claim is explicit. If false, it is a lie.

  **(2) Spokesperson: "We've always been committed to safety."** (Asked if product caused injury)
  *   **Step 1 (Literal):** "Committed to safety" is subjective/internal. Not easily falsified. Proceed.
  *   **Step 2 (Conventionality):** No specific trigger words (e.g., "therefore") link commitment to non-liability. Proceed.
  *   **Step 3 (Maxim):** Flouting Maxim of Relation (irrelevant answer to generate inference). Proceed.
  *   **Step 4 (Cancellability):** Can they say, "We're committed to safety, but our product caused the injury"?
      *   **Test Return:** Yes. It is pragmatically disappointing but logically coherent. The inference is cancellable.
  *   **Result:** **Not Checkable**.
  *   **Reasoning:** Strict Gricean theory classifies this as a conversational implicature. Because it is cancellable, it does not constitute an assertion of fact.
  *   **Editor Note:** This will be unpopular. The speaker is misleading readers, but technically not asserting the falsehood. This highlights the tension between linguistic precision and public accountability.

  **(3) Obituary: "He was a brilliant, if erratic, scientist."**
  *   **Step 1 (Literal):** "Brilliant" is subjective. "Erratic" is the disputed trait. Proceed.
  *   **Step 2 (Conventionality):** The construction "X, if Y" functions concessively (similar to "although"). The clause "if erratic" triggers a conventional inference that he *was* erratic.
  *   **Test Return:** The meaning is tied to the concessive structure. Denying it ("He was brilliant, if erratic, but actually consistent") creates a contradiction.
  *   **Result:** **Checkable**.
  *   **Reasoning:** This behaves as a conventional implicature or presupposition. The writer is committed to the truth of "he was erratic" regardless of the main clause. It is non-cancellable.

  ***

  ### Summary for the Desk
  Use this procedure to insulate fact-checkers from complaints about "missing" misleading implicatures. When the procedure returns **Not Checkable** (as in Case 2), the issue is ethical misleading, not factual falsity. When it returns **Hand to Editor**, the linguistic evidence is ambiguous regarding speaker commitment. Only Step 1 and Step 2/Conventional cases are pure fact-checks.
