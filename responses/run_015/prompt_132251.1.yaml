answer: |-
  First, I am sorry about your father's diagnosis. It is a profound loss, even while he is still here, and it is completely understandable that the legal machinery surrounding it feels cold, contradictory, and intrusive.

  You have identified something real. Your intuition that this is a "patchwork" is correct. There is no single, coherent philosophical theory of personal identity or autonomy that undergirds the entire law of advance directives. Instead, what you are looking at is a collision of three different frameworks: **common law agency**, **medical ethics**, and **statutory risk management**. They speak different languages and prioritize different values.

  Here is a breakdown of what this patchwork presupposes, where the contradictions come from, and how to think about the "dead hand" problem.

  ### 1. The Core Tension: Precedent Autonomy vs. Current Well-Being
  To understand the inconsistencies, you need the vocabulary for the two competing theories of personhood that are fighting inside these documents.

  *   **Precedent Autonomy (The Dworkin View):** This view holds that the "critical interests" of your life are defined by your coherent, competent narrative. The 62-year-old father who values dignity over mere biological existence is the "real" person. The 70-year-old with dementia is a diminished version of that person. Therefore, the 62-year-old's decision binds the 70-year-old. This justifies the Living Will.
  *   **Current Well-Being (The Dresser View):** This view argues that the person with dementia has new interests (enjoyment of a meal, lack of pain) that the earlier self couldn't fully anticipate. To ignore the pleas of the 70-year-old for a feeding tube is to violate the rights of the *current* person.

  **The Law's Presupposition:** The law *says* it follows Precedent Autonomy, but in practice, it often defaults to Current Well-Being whenever there is ambiguity. This is why, as you noted, if a confused patient actively resists, hospitals often pause. They are terrified of liability for "battery" (touching without consent). The Living Will is not a magical force field; it is a shield for the *doctor* against the family, not necessarily a sword against the patient's current body.

  ### 2. Analyzing the Inconsistencies

  You asked if there is one principle generating the mess. There isn't. There are three distinct logics operating simultaneously.

  #### A. Property vs. Body (The Alienability Principle)
  *   **Trusts:** You can bind property after death because property is alienable. It is separate from you.
  *   **Specific Performance:** You cannot force someone to work (13th Amendment prohibitions on involuntary servitude + practical unenforceability).
  *   **Medical Directives:** This is the hybrid. You cannot force a doctor to treat (specific performance), but you *can* refuse treatment. The law views refusal as a negative right (liberty), whereas demanding treatment is a positive claim.
  *   **The Contradiction:** You feel you can't bind your future body, yet the Living Will does exactly that.
  *   **The Resolution:** The law treats the Living Will not as binding the *body*, but as binding the *physician's license*. It tells the doctor: "If you feed him, you are liable for battery." It doesn't physically stop the food; it creates a legal threat that stops the hand.

  #### B. Dementia vs. Psychosis (The Reversibility Heuristic)
  *   **Psych Directives:** Often overridden. Why? Because psychosis is often treated as *temporary* and potentially *dangerous*. The state's "police power" (protecting citizens from harm) overrides autonomy if you are a danger to self/others.
  *   **Dementia Directives:** More likely honored. Why? Because Alzheimer's is viewed as *progressive and irreversible*. The law assumes the 62-year-old knew the 70-year-old was coming and wouldn't get better.
  *   **The Presupposition:** We honor precommitments more when the "future self" is seen as a degraded version of the "past self" rather than a sick version of the "present self."

  #### C. The "Sunset" Clause (The Evidentiary Function)
  *   You asked if the directive binds because of a *right* or because it's *evidence*.
  *   **The Answer:** It is legally a **right**, but it functions as **evidence**.
  *   The two-year expiration on hospital forms is not because your father's authority expires. It is because the *hospital's confidence in the evidence* expires. They want to ensure the document reflects current wishes to protect themselves from lawsuits by angry relatives claiming, "He changed his mind last year!"
  *   **What this presupposes:** The system prioritizes administrative clarity and liability shielding over the metaphysical continuity of your father's will.

  ### 3. The Agency Law Problem
  Your sister is right about common law agency: normally, incapacity terminates authority. The **Durable** Power of Attorney (DPOA) is a statutory exception created specifically to avoid **Guardianship/Conservatorship**.

  *   **The Trade-off:** Without a DPOA, your mom would have to petition a court to be declared his guardian. That is public, expensive, and requires a judge to declare your dad "incompetent."
  *   **The "Backwards" Logic:** You noted it seems backwards that he can't fire the agent once incapacitated. That is the *feature*, not the bug. The point is to prevent a scenario where a fluctuating capacity allows a patient to fire a responsible agent in favor of a predatory one during a lucid interval. It presupposes that the *risk of abuse by the agent* is lower than the *risk of chaos without one*.

  ### 4. The Constitutional Analogy
  Is this like constitutional precommitment (Ulysses tying himself to the mast)?

  *   **Where it holds:** Both are attempts by "Time 1 Self" to constrain "Time 2 Self" to prevent weakness or passion from undermining long-term values.
  *   **Where it breaks:**
      1.  **Amendment:** Constitutions have amendment processes (Article V). Advance directives generally do not have a "capacity-adjusted" amendment process. If you lack capacity, you can't amend.
      2.  **The Sovereign:** In constitutional law, "We the People" bind the Government. In medical law, the "Past Self" binds the "Doctor/Family." The government (courts) usually steps in only when the family fights.
      3.  **The Dead Hand:** In constitutional law, we worry about the dead binding the living. In dementia law, we worry about the *competent* binding the *incompetent*. The moral weight is different because the "living" constitution voters are still competent; the "incompetent" dementia patient is arguably a different moral entity.

  ### 5. What Would Have to Change?
  You asked what would happen if we shifted the theoretical ground.

  **Scenario A: The "Current Interests" Standard**
  *   *Theory:* The 70-year-old is a new customer. His current desire for a sandwich trumps the 62-year-old's desire for dignity.
  *   *Paperwork Change:* Living Wills would become non-binding "letters of intent." The Durable POA would become a "Best Interest" standard only.
  *   *Consequence:* Families would fight constantly. Doctors would default to "do everything" to avoid liability. Biological life would be prolonged against prior wishes.

  **Scenario B: The "Strict Precommitment" Standard**
  *   *Theory:* The 62-year-old's signature is authoritative full stop.
  *   *Paperwork Change:* No expiration dates. No ability for surrogates to override based on "he seems happy now."
  *   *Consequence:* Cruel outcomes where a demented patient who enjoys eating is starved because a form says "no tubes." (Note: Most Living Wills specify "terminal condition" or "permanent unconsciousness" to avoid exactly this sandwich scenario).

  **The Middle Ground (Current Practice):**
  The system tries to split the difference. The Living Will applies only in *specific medical contexts* (end-stage, permanent unconsciousness). It does not apply to general care. This is why the "sandwich" example is legally distinct from the "feeding tube in end-stage Alzheimer's" example. The law assumes you can still enjoy a sandwich; it assumes you cannot enjoy a vegetative state.

  ### 6. Summary: What the Patchwork Presupposes
  To answer your central question: The system presupposes that **competence is the only source of moral authority**, but it also presupposes that **biological life is the default state** unless there is clear and convincing evidence to the contrary.

  It is not one principle. It is a set of heuristics designed to keep doctors out of court and families out of probate.
  *   **Trusts bind** because property is external.
  *   **Bodies don't bind** because liberty is internal (except when refusing treatment).
  *   **Psych directives fail** because the state claims a duty to rescue the treatable.
  *   **Dementia directives succeed** because the state accepts the inevitability of the decline.

  ### A Note for Your Family
  You are looking for philosophical coherence in a system built for administrative triage. That is why it feels like a patchwork.

  Regarding your father's paperwork:
  1.  **The DPOA is the most important document.** The Living Will is a guide; the DPOA gives your mom the voice. If the 70-year-old begs for a tube, your mom (as agent) can say, "He is confused; his prior competent self refused this." The doctor will listen to her more than the form.
  2.  **The "No Tube" clause:** Ensure it specifies *artificial* nutrition. It generally does not prohibit hand-feeding (spoon feeding). This resolves the "sandwich" paradox. The directive stops the medical intrusion, not the human care.
  3.  **The Expiration:** Re-sign the forms every year or two. It costs nothing and removes the "stale evidence" argument from any nervous hospital administrator.

  The system is imperfect because the question it asks ("Who is this person?") is one philosophy hasn't solved either. You are doing the right thing by securing the paperwork, not because it is logically perfect, but because it gives your mom the legal standing to protect the father you knew from the disease he has now.
