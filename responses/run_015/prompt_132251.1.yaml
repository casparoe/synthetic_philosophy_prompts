prompt: |-
  My dad got an early-onset Alzheimer's diagnosis a few months ago and we spent last weekend doing the paperwork: a living will where he says no tube feeding and no heroic measures once he can't recognize us, plus a durable power of attorney naming my mom as his health care agent. He was completely with it when he signed, and I get why that's supposed to matter.

  But the more I read about it the more the whole thing looks like a patchwork that doesn't add up, and I don't know any of the vocabulary here, so bear with me.

  Here's what bugs me. Under ordinary agency law — as my sister explained it, she's a lawyer, which is the only reason I know any of this, so correct me if she's got it wrong — an agent's authority normally dies when the principal loses capacity, and the principal can fire the agent whenever they feel like it. The "durable" part of a durable power of attorney is the exception to exactly that: it's built to survive the thing that would normaly kill it, and once Dad is incapacitated he can't take it back. So the moment he might most want to change his mind is the moment we've stripped him of the power to change his mind. That seems backwards, and I want to know what it presupposes.

  And then everything next door goes the other way. As far as I can tell:

  - You can bind your property for decades past your death with a trust, but you can't get a court to personally make somebody show up and do the work — specific performance, my sister says, doesn't run against a person's body or labor.
  - You can't sign away your right to declare bankruptcy, no matter how clearly you meant it.
  - Consent to anything medical is supposed to be giveable and withdrawable in the moment; you can't sign a form at forty that counts as your consent to something at sixty.
  - Except the living will IS a form signed at sixty-two deciding what happens at seventy, and — I think? — if a confused seventy-year-old begs for a feeding tube, the hospital will still refuse him one on the strength of the earlier signature.
  - My sister says psychiatric advance directives, where someone in a clear state says what to do during a psychotic break, get overridden by clinicians constantly even where they're legally valid — so the same move that's binding in dementia apparently isn't in psychosis.
  - The form the hospital gave us lapses in two years unless it's re-signed, which is basically a sunset clause on Dad's authority over himself.

  So: what does this patchwork presuppose? About what a person is across time, about what gives one moment's decision authority over another's, and about whether the old directive binds because the earlier person had a *right* to decide or merely because it's our best *evidence* about what the later person wants? Is there one principle that generates the whole mess — you can precommit your stuff but not your body, or precommitments are honored only where they protect your future agency rather than spend it, or only where third parties can cheaply verify compliance — or is it five unrelated historical accidents that happen to share a name? Which parts does the practice strictly require, and which are just what most people working in it happen to believe? Where is it underdetermined, so that several quite different theories would all license it? And what would actually have to change in the paperwork if we went another way: if we decided the confused seventy-year-old asking for a sandwich is simply a different customer whose current interests are what count, or the opposite, that the sixty-two-year-old's signature is authoritative full stop and needs no renewal?

  People keep comparing all this to constitutional precommitment — supermajority amendment rules, unamendable clauses, the usual complaint about the dead hand of the past — and if that's the same animal, I'd like to know whether one reconstruction covers both or whether the analogy is doing me a disservice.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Someone whose father has early-onset Alzheimer's. They are intelligent, analytical, and likely well-read (references agency law, specific performance, bankruptcy, constitutional precommitment). They are grappling with the philosophical and legal inconsistencies of advance directives (living wills, durable powers of attorney).
      *   **Emotional State:** Anxious, confused, perhaps a bit frustrated by the "patchwork" nature of the law. They are looking for coherence in a system that feels arbitrary.
      *   **Core Question:** What is the underlying philosophical/legal principle (if any) that explains the inconsistencies in how we treat precommitment regarding property vs. body, dementia vs. psychosis, past self vs. present self? Is it one principle, historical accidents, or something else?
      *   **Specific Tensions Identified:**
          *   Durable POA: Survives incapacity (binding future self) vs. Agency law (authority dies with capacity).
          *   Property vs. Body: Trusts bind property after death; specific performance doesn't bind labor.
          *   Bankruptcy: Can't waive right.
          *   Medical Consent: Usually contemporaneous, but Living Wills bind future self.
          *   Psychiatric Directives: Often overridden compared to dementia directives.
          *   Expiration: Hospital forms lapse (sunset clause).
          *   Constitutional Analogy: Dead hand of the past vs. precommitment strategies.

  2.  **Deconstruct the Legal/Philosophical Landscape:**
      *   *The "Patchwork":* The user is right. It *is* a patchwork. There is no single Grand Unified Theory of Precommitment in law.
      *   *Competing Theories of Personhood:*
          *   **Precedent Autonomy:** The past competent self rules. (Dworkin's view).
          *   **Current Interests/Well-being:** The present experiencing self rules. (Dresser's view).
          *   **Substituted Judgment:** What *would* the past self want? (Proxy standard).
          *   **Best Interests:** What is objectively best now? (Paternalistic standard).
      *   *Legal Pragmatism:* Much of this isn't philosophy; it's risk management, evidentiary standards, and public policy.

  3.  **Address Specific Points:**

      *   **Durable POA & Agency:** The user's sister is right about common law agency. The "durability" is a statutory creation specifically to solve the problem of incapacity. *Why?* To avoid guardianship/conservatorship (which is expensive and public). It presupposes the *value of planning* outweighs the *risk of changed mind*.
      *   **Property vs. Body:** Trusts bind property because property is alienable. Bodies are not. Specific performance is barred because involuntary servitude (13th Amendment vibes) and practical enforcement issues. Medical directives are a weird hybrid: they bind *doctors*, not the *body* directly, but they dictate what happens to the body.
      *   **Bankruptcy:** Public policy. We want people to have a "fresh start." Waiving it harms the system.
      *   **Living Wills vs. Current Pleas:** This is the crux. If a demented patient begs for food, do we feed them? Usually, yes, unless the directive is specific about *end-stage*. The law often prioritizes preserving life in the face of ambiguity. The "confused 70-year-old" scenario is the hardest edge case.
      *   **Psych Directives:** Why overridden? Because psychosis is often treatable/reversible. Dementia (usually) isn't. Also, danger to self/others (police power) overrides autonomy in psych.
      *   **Expiration/Sunset:** This is evidentiary. "Did they *still* want this?" It combats staleness.
      *   **Constitutional Analogy:** It's useful but limited. Constitutions bind *citizens* via the *state*. Advance directives bind *providers* via *contract/statute*. The "dead hand" critique applies to both, but the stakes (life/death vs. governance) differ.

  4.  **Synthesize the "Presuppositions":**
      *   What does the system actually believe?
      *   1. **Competence is the Golden Key:** Only the competent self can bind the incompetent self.
      *   2. **Irreversibility Matters:** We honor precommitments more when the condition is permanent (dementia) vs. temporary (psychosis/intoxication).
      *   3. **Third-Party Reliance:** Doctors need clear rules to avoid liability.
      *   4. **The "Best Evidence" Theory:** The directive is treated as evidence of intent, but often hardened into a rule for administrative ease.

  5.  **Drafting the Response:**
      *   *Tone:* Empathetic, intellectually rigorous, validating (yes, it is messy), but structured.
      *   *Structure:*
          1.  **Validation:** Acknowledge the insight. It *is* a patchwork.
          2.  **The Core Tension:** Precedent Autonomy vs. Current Well-being.
          3.  **Analyzing the Specific Inconsistencies:**
              *   Agency/Durability (Statutory fix for a practical problem).
              *   Property vs. Body (Alienability + 13th Amendment).
              *   Psych vs. Dementia (Reversibility + Police Power).
              *   Expiration (Evidentiary weight).
          4.  **The Constitutional Analogy:** Where it holds, where it breaks.
          5.  **What would change?** (Theoretical alternatives).
          6.  **Practical Advice/Comfort:** How to navigate this as a family.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* I need to be careful about the "feeding tube" scenario. If a patient *actively resists*, hospitals often pause. It's not absolute. I should clarify that the "binding" nature isn't physical force usually, but legal immunity for doctors following the will.
      *   *Nuance:* The "Bankruptcy" point is about public policy overriding private contract. Same with specific performance.
      *   *Philosophy:* Mention Ronald Dworkin (*Life's Dominion*) vs. Rebecca Dresser. This gives the user vocabulary for their intuition.
      *   *Legal Reality:* Emphasize that much of this is liability shielding for hospitals, not just pure philosophy.

  7.  **Final Polish:** Ensure the distinction between *Durable POA* (appointing an agent) and *Living Will* (stating wishes) is clear, as they function slightly differently. The user conflates them slightly in the "binding" analysis. The POA allows the mom to decide *based on* the will, but she can also interpret. The Will is direct instructions.

      *(Self-Correction on the "Confused 70-year-old" point)*: If the 70-year-old is *currently* capacitated (even if demented, some days are good), they can arguably revoke. But if they lack capacity, the prior directive stands. The tension is: does the *expression* of desire now count as capacity? Usually no, if it contradicts known values.

      *(Constitutional Analogy)*: The "Dead Hand" is a good link. But Constitutions are about limiting *majorities*, Advance Directives are about limiting *surrogates/doctors*.

  8.  **Final Review against User Prompt:**
      *   Did I answer "what does this presuppose?" Yes (Competence, Irreversibility, Liability).
      *   Did I address the specific examples (trusts, bankruptcy, psych)? Yes.
      *   Did I address the "one principle vs. accidents" question? Yes (It's mostly accidents/pragmatism layered over weak theory).
      *   Did I address the Constitutional analogy? Yes.

