  # Seminar Handout: Session 2 — The Problem of Old Evidence
  ## Decision Tree: Logical Space of Responses

  **Instructions:** Begin at Node 1. Answer each claim based on your intuitions about the agent's credence function and the nature of the evidence. Follow the branches to locate your position.

  ### Branch Nodes

  **Node 1: Logical Omniscience**
  *Claim:* The agent's credence function at the time $H$ is proposed assigns probability 1 to the logical claim that $H$ entails $E$.
  *   **Reject:** Go to **Leaf 1**.
  *   **Accept:** Go to Node 2.

  **Node 2: Propositional Identity**
  *Claim:* The proposition $E$ confirmed is numerically identical to the proposition $E$ originally learned.
  *   **Reject:** Go to Node 3.
  *   **Accept:** Go to Node 4.

  **Node 3: Domain Expansion**
  *Claim:* The domain of the credence function can expand to include sentences that were not statable in the agent's language prior to $H$.
  *   **Reject:** Go to **Leaf 2**.
  *   **Accept:** Go to **Leaf 3**.

  **Node 4: Certainty Constraint**
  *Claim:* A proposition the agent accepts as known must be assigned probability 1 in the credence function.
  *   **Reject:** Go to **Leaf 4**.
  *   **Accept:** Go to Node 5.

  **Node 5: Historical Sensitivity**
  *Claim:* The degree of support $E$ gives $H$ depends on whether $E$ was known before $H$ was formulated.
  *   **Accept:** Go to Node 6.
  *   **Reject:** Go to Node 7.

  **Node 6: Construction Sensitivity**
  *Claim:* The fact that $H$ was constructed specifically to accommodate $E$ reduces the support $E$ provides.
  *   **Accept:** Go to **Leaf 5**.
  *   **Reject:** Go to **Leaf 6**.

  **Node 7: Prior Source**
  *Claim:* The relevant prior for comparison is a formal 'ur-prior' rather than a reconstruction of the agent's actual past credence.
  *   **Accept:** Go to **Leaf 7**.
  *   **Reject:** Go to **Leaf 8**.

  ***

  ### Terminal Leaves (Positions)

  **Leaf 1: Non-Omniscient Bayesianism**
  *   **Doctrinal Name:** Garber-Style Solution.
  *   **Awkward Commitment:** Rational agents are modeled as logically fallible by design.
  *   **Attribution:** Defended by Garber (1983); developed by Eells.
  *   **Verdict on Accommodation:** Accommodation is fine; the *logical derivation* is the new evidence.

  **Leaf 2: Propositional Sharpening**
  *   **Doctrinal Name:** Variant Evidence.
  *   **Awkward Commitment:** The "old" evidence wasn't actually the evidence that confirms the theory.
  *   **Attribution:** Unnamed (common in practice); related to Maher (1996).
  *   **Verdict on Accommodation:** Accommodation is fine; the *precision* is the new evidence.

  **Leaf 3: Conceptual Expansion**
  *   **Doctrinal Name:** Language-Relativized Confirmation.
  *   **Awkward Commitment:** Credence functions must change their underlying language mid-stream.
  *   **Attribution:** Suggested by Jeffrey (1995); unoccupied as a full system.
  *   **Verdict on Accommodation:** Accommodation is fine; the *vocabulary* is the new evidence.

  **Leaf 4: Uncertain Certainty**
  *   **Doctrinal Name:** Jeffrey Conditionalization / Forgetting.
  *   **Awkward Commitment:** Agents can know truths but assign them probability $< 1$.
  *   **Attribution:** Jeffrey (1992); Christensen (1999).
  *   **Verdict on Accommodation:** Accommodation is fine; the evidence was never certain.

  **Leaf 5: Strong Predictivism**
  *   **Doctrinal Name:** Use-Novelty.
  *   **Awkward Commitment:** Identical evidence supports a hypothesis less if the hypothesis was tailored to it.
  *   **Attribution:** Worrall (1985); Maher (1988).
  *   **Verdict on Accommodation:** **Accommodation reduces support.**

  **Leaf 6: Historical Bayesianism**
  *   **Doctrinal Name:** Accommodationism.
  *   **Awkward Commitment:** The history of construction is irrelevant if priors are updated correctly.
  *   **Attribution:** Howson & Urbach (1993).
  *   **Verdict on Accommodation:** Accommodation is fine; history is screened off by priors.

  **Leaf 7: Ur-Prior Bayesianism**
  *   **Doctrinal Name:** Formal Priorism.
  *   **Awkward Commitment:** Priors are rational fictions, not records of psychological states.
  *   **Attribution:** White (2009); Hartmann (2002).
  *   **Verdict on Accommodation:** Accommodation is fine; ur-priors ignore construction history.

  **Leaf 8: Counterfactual Subtraction**
  *   **Doctrinal Name:** Glymour-Style Counterfactuals.
  *   **Awkward Commitment:** We must credibly reconstruct what the agent would have believed without $E$.
  *   **Attribution:** Glymour (1980); Earman (1992).
  *   **Verdict on Accommodation:** Accommodation is fine; subtracting $E$ removes the "old" status.

  **Leaf 9: [Empty/Incoherent]**
  *   **Status:** **Incoherent.**
  *   **Reasoning:** Historical Sensitivity = Yes (Node 5) combined with Prior Source = Ur-Prior (Node 7 path). If history matters, a formal ur-prior that ignores history cannot be the baseline.

  **Leaf 10: [Unoccupied]**
  *   **Status:** **Unoccupied.**
  *   **Reasoning:** Conceptual Expansion (Leaf 3) combined with Construction Sensitivity (Leaf 5 path). No one argues that new vocabulary solves POE *and* that accommodation still penalizes support.

  ***

  ### Note on the "Too Easy" Worry

  A recurring objection to POE solutions is that they make confirmation too easy to manufacture: if an agent can simply redescribe $E$ as new (Leaves 2 & 3), lower its certainty (Leaf 4), or reach back to a convenient prior (Leaves 7 & 8), can she generate support for arbitrary hypotheses?

  *   **Vulnerable Leaves:** Leaves 2, 3, and 4 are most susceptible. If "old evidence" can always be redescribed as "new precision" or "uncertain," the constraint of old evidence vanishes. To block this, proponents must add constraints on *when* propositional shifts or uncertainty are legitimate (e.g., only when vocabulary objectively changes).
  *   **Robust Leaves:** Leaves 5, 6, 7, and 8 are more robust against manufacturing because they retain the "old" status of $E$ but disagree on how to process it. However, Leaves 7 and 8 face the "prior selection" worry: if the ur-prior or counterfactual subtraction is under-constrained, the agent can still manipulate the degree of support by choosing a convenient baseline.
  *   **Most Constrained:** Leaf 1 (Non-Omniscience) and Leaf 5 (Predictivism) are the hardest to game. Leaf 1 requires actual logical discovery (which is hard to fake), and Leaf 5 imposes a structural penalty on accommodation that cannot be conditionalized away.
