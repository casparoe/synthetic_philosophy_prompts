      *   *Supervaluationism:* Vagueness is semantic indeterminacy. There are many "admissible precisifications." A statement is super-true if true on all. Legislative precisification picks one.

  4.  **Drafting - Step 3: Analyze Legislative Precisification:**
      *   Example: "Excessive force" -> "30 pounds of pressure."
      *   *Epistemicist view:* The legislature found the true boundary.
      *   *Supervaluationist view:* The legislature picked one valid option from a range, making it binding.

  5.  **Drafting - Step 4: Weigh Objections:**
      *   *Objection to Epistemicism:* It implies legislators are metaphysicians discovering moral/legal facts rather than making policy. It makes legislative error impossible regarding the boundary (they just reveal it). This seems implausible for democratic lawmaking.
      *   *Objection to Supervaluationism:* If all precisifications were equally legitimate before, why does *this* specific one become binding? Does it arbitrarily privilege one choice? It needs to explain the shift from "indeterminate" to "determinate" without magic.
      *   *Rebuttal:* Supervaluationism handles this via authority. The act of legislation *creates* the precision. Epistemicism struggles because it denies the indeterminacy existed.

