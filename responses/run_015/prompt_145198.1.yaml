      Aquinas maintains that the prohibition on private tyrannicide remains binding even when legal channels collapse, because the moral defect lies in the private usurpation of public judgment rather than merely in the consequential risk of disorder. For Aquinas, political authority is a participation in divine reason, and the power to judge and punish belongs essentially to the public personae who embody the community's unity, not to private members who stand in a relation of subjection. Consequently, the danger of disorder is not simply a pragmatic calculation that might be outweighed by the evils of tyranny, but a structural indication that the act itself violates the ontological order of justice by conflating the subject with the judge. When institutional frameworks dissolve, this jurisdictional gap does not devolve to the private individual; instead, the right to act remains with the community as a corporate body, meaning that if no public mechanism exists to authorize resistance, the private citizen retains no licit avenue for violent redress. Thus, the breakdown of legal channels does not transform resistance into a permissible last resort for the individual, but rather deepens the tragedy by removing both the right and the remedy, leaving endurance or divine intervention as the only morally secure options.

