  2.  **Retrieve Knowledge about Aquinas on Tyrannicide:**
      *   Key texts: *Summa Theologiae* II-II, q. 42, a. 2 (Sedition), *De Regno* (On Kingship), Commentary on the Sentences.
      *   Core position: Private individuals cannot kill tyrants. Public authority can depose a usurper. If a legitimate ruler becomes tyrannical, the community (or superior authority) may act, but caution is urged to avoid greater harm.
      *   *De Regno* I.6 is crucial here. Aquinas discusses what to do about tyranny. He says it is better to tolerate a mild tyranny than to risk greater evils by removing it. However, he does allow for public action (not private) if the tyranny is excessive.
      *   Key distinction: Private vs. Public authority. Aquinas is deeply committed to the idea that judgment belongs to the public authority.
      *   The "Residual Authority Problem": If all hierarchy is captured, who acts? Aquinas generally leans towards the idea that without a public mechanism, private action remains illicit because it undermines the *order* itself, which is a participation in divine law.
      *   Is the prohibition consequentialist (avoid worse chaos) or deontological (lack of authority)? It's both, but the authority piece is foundational. Even if chaos is inevitable, private killing is usurpation of God's/judicial authority.
      *   However, Aquinas does acknowledge a limit where tyranny becomes so oppressive that it dissolves the bond of obedience (natural law self-preservation). But the *mode* of resistance must still ideally be public, not private assassination.
      *   Scholarly consensus (e.g., Skinner, Tierney, Finnis): Aquinas is cautious. He does not endorse private tyrannicide. He allows for public deposition. If no public authority exists, the situation is aporetic (problematic), but private violence is generally still condemned because it presumes a judgment one does not possess.
      *   The "breakdown of legal channels" does not automatically grant private individuals the right to kill. It creates a state of emergency where the community *as a whole* (not a private individual) might act, but Aquinas emphasizes the risk of greater evil so strongly that he often suggests endurance is preferable to violent upheaval unless a public mechanism can be found.
      *   Bottom line formulation: Aquinas maintains that the prohibition on private tyrannicide remains binding even when legal channels collapse, because the moral defect lies in the private usurpation of public judgment rather than merely in the consequential risk of disorder.

