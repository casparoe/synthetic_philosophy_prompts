answer: |-
  The session must establish that Du Bois's "propaganda" is not a command to politicize content but a description of how aesthetic form functions as the only sociological mechanism capable of transmitting truth across the color line.

  **Sequence of Ideas**
  1.  **The Sociological Constraint (The Veil):** Begin where your students are strongest. Define double-consciousness not as a psychological state but as a communication barrier: the white gaze structurally distorts any explicit factual claim made by a Black subject.
  2.  **The Failure of Argument:** Demonstrate that in this environment, rational discourse (pamphlets, stats, explicit demands) is rejected *a priori* by the dominant group because the source is racially coded as unreliable. This creates the necessity for a different vehicle.
  3.  **The Aesthetic Necessity:** Introduce art not as "decoration" but as a bypass mechanism. Aesthetic form (rhythm, harmony, irony) slips past the defensive rationality of the oppressor because it is perceived as "universal" or "emotional" rather than "political." This is where you defeat your friend's objection: the aesthetic is not optional because without the *form*, the *content* is sociologically silenced.
  4.  **Redefining Propaganda:** Only now define "propaganda." It is not manipulation; it is the persistent advocacy of truth using the only vessel that can carry it. The "propaganda" is the *effect* of the art crossing the veil, not the *intent* to manipulate.

  **The Carrying Example: The Sorrow Songs**
  The sorrow songs are the correct choice, but you must isolate specific features to avoid reducing them to "sad music."
  *   **What it needs:** Focus on the *structural tension* within the music (e.g., the syncopation or the minor-major shifts) that encodes a complex relationship to suffering and hope which lyrics alone cannot state safely. Show how the *form* carries the truth of resilience that explicit protest would get rejected.
  *   **What it must avoid:** Do not focus on lyrics that sound like explicit pleas for freedom, and do not frame the songs solely as lamentations. If you focus only on suffering, you reinforce the misconception that Black art must be victim-centered. The example must show how the *beauty* of the song is what makes the *truth* palatable to the outside world.

  **Misconception Defusal Map**
  1.  **"Propaganda means lying/manipulation":** Defuse this **immediately** in Step 1. Provide Du Bois's specific definition ("persistent advocacy of truth") before showing the quote. Tell them explicitly: "If you are thinking of Nazi posters, stop. Think of a witness testimony that must be sung to be heard."
  2.  **"He is reducing beauty to politics":** Defuse this in **Step 3**. Clarify that Du Bois is not saying beauty *is* politics, but that in a racialized society, beauty *becomes* political because it is the only safe container for truth. The aesthetic quality is what protects the message.
  3.  **"Black art should only depict suffering":** Defuse this during the **Example** phase. Point out that Du Bois values the songs for their transcendence, not just their pain. A song of joy that contradicts the stereotype of Black misery is equally propaganda because it corrects the false image.

  **The End-Check**
  Present two hypothetical artifacts and ask which qualifies as Du Boisian propaganda and why:
  1.  **A Sociological Report:** A statistically accurate pamphlet on housing discrimination written by a Black sociologist. (Correct answer: No. It is explicit argument that will be rejected by the veil.)
  2.  **A Abstract Painting:** A non-representational piece by a Black artist that uses color theory to evoke the feeling of confinement and release. (Correct answer: Yes. It uses aesthetic form to transmit a truth about the racialized experience that bypasses the defensive rejection of explicit argument.)
  *Success Criteria:* Students must identify that the *form* is what enables the transmission of truth, not just the presence of a political message.

  **Explicit Exclusions**
  Openly refuse to cover **Kantian aesthetic autonomy**. Tell the class: "We are not debating whether beauty is subjective or universal today; we are analyzing how beauty functions sociologically under racism." Engaging with Kant will invite your sociology students to retreat into abstract philosophy and lose the structural argument about double-consciousness. Similarly, do not get bogged down in the textual differences between *The Souls of Black Folk* and *Criteria of Negro Art*; treat the concept as a unified sociological insight to maintain momentum.
