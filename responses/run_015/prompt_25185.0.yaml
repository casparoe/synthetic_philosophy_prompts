          1.  Is the problem with Probability theory/Logic or with the *application*?
          2.  Is there a unique correct answer?
          3.  Does "random" imply a physical process or a state of knowledge?
          4.  Can symmetry resolve the ambiguity?

  3.  **Drafting the Decision Tree (Iterative Process):**

      *   *Root Question:* Does the phrase "choose a chord at random" describe a well-defined problem *prior* to specifying a selection method?
          *   *Yes:* There is a fact of the matter. We just need to find it. (Leads to Objectivist/Logical views).
          *   *No:* The problem is ill-posed until a method is specified. (Leads to Subjectivist/Frequentist/Dissolutionist views).

      *   *Branch 1 (No - Ill-posed):*
          *   Why is it ill-posed?
              *   Because probability *just is* long-run frequency of a specific process. -> **Frequentist Rejection**.
