  You have identified a genuine and pervasive rhetorical tactic, particularly common in pseudohistory, conspiracy theories, and fringe science. It is frustrating precisely because it mimics the language of rigorous skepticism while violating its core principle: consistency.

  There is no single, canonical Latin name for this specific sequence (dismantle evidence → reuse evidence) that functions like *Ad Hominem* or *Straw Man*. However, there is an established logical fallacy that covers the underlying structure, and a more precise descriptive term that captures the nuance you need for your column.

  ### The Established Candidate: Special Pleading

  The closest established concept in argumentation theory is **Special Pleading**. This fallacy occurs when a person applies standards, principles, or rules to other people or circumstances while making themselves or their own circumstances exempt from the same critical scrutiny, without providing adequate justification for the exemption.

  **Where it fits:** The speaker demands a high standard of proof for the mainstream (e.g., "manuscripts must be contemporary to be trusted") but exempts their own theory from that standard (e.g., "these same manuscripts are trustworthy for my numerology").

  **Where it falls short:** "Special Pleading" is often understood as making an exception for a *person* or a *claim* based on status ("I am a doctor, so I can break this rule"). Your examples are more subtle: the exception is made for a specific *usage* of the same data within the same argument. A reader looking up "Special Pleading" might expect a defense of privilege, not this specific evidentiary flip-flop. Additionally, "Special Pleading" doesn't inherently capture the *reuse* of the discredited material, only the exemption from the standard.

  ### The Philosophical Candidate: Performative Contradiction

  In epistemology, this resembles a **Performative Contradiction**. This occurs when the content of a statement contradicts the presuppositions required to make the statement. By asserting that the records are too corrupt to support mainstream history, the speaker presupposes that the records are intelligible and reliable enough to be analyzed. By then using them to support their own history, they act on that presupposition while verbally denying it.

  **Where it fits:** It captures the self-defeating nature of the move.
  **Where it falls short:** It is too technical for a general column. It also usually applies to speech acts (e.g., "I am not speaking") rather than evidentiary handling.

  ### The Best Label: Evidentiary Double Standard

  Because the established terms are either too broad or too technical, this maneuver deserves its own specific label. The essential feature is not just the asymmetry, but the **opportunistic reuse** of the evidence. The speaker treats the evidence as "toxic" when held by an opponent and "purified" when held by themselves.

  I recommend coining the term **Evidentiary Double Standard**.

  This phrase is accessible to a general reader ("double standard" is common parlance) but precise enough for a style sheet ("evidentiary" specifies that the inconsistency lies in how proof is handled, not just opinions). It signals that the speaker is not merely skeptical, but inconsistent in their criteria for what counts as knowledge.

  ### Boundary Cases

  To help you distinguish this from legitimate skepticism in your column, consider these three cases:

  1.  **Clearly Falls Under It (The Maneuver):** A speaker argues that radiocarbon dating is fundamentally flawed because calibration curves rely on assumptions about atmospheric carbon, rendering all mainstream dates invalid. They then date their own preferred site using a single radiocarbon sample, treating the calibration curve as reliable because it supports their timeline.
      *   *Verdict:* **Evidentiary Double Standard.** The machinery is rejected for the opponent, accepted for the proponent.

  2.  **Clearly Does Not (Legitimate Skepticism):** A historian argues that a specific set of king-lists is too corrupted by later interpolation to support precise dating. They conclude that we cannot know the exact dates of that period and refuse to propose a specific alternative timeline, leaving the question open.
      *   *Verdict:* **Methodological Consistency.** The standard is applied equally; the evidence is deemed insufficient for *any* positive claim.

  3.  **Arguable Case (Human Error):** A researcher critiques the stratigraphy of a rival's excavation as disturbed, but later cites their own excavation's stratigraphy which has similar disturbance issues, unaware of the similarity due to complexity.
      *   *Verdict:* **Inconsistency, not Double Standard.** If there is no intent to exempt oneself and the standard is applied uniformly once the error is pointed out, it is a mistake, not a rhetorical maneuver. The *Evidentiary Double Standard* implies a strategic asymmetry.

  ### Summary for Your Style Sheet

  Use **Evidentiary Double Standard** to describe the maneuver where a speaker invalidates evidence to defeat a mainstream claim, then validates that same evidence to support their own alternative claim, without justification for the differing treatment. While logically a form of *Special Pleading*, this term is more precise for discussions of evidence and methodology.

  \answer{Evidentiary Double Standard}
