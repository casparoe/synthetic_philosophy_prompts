      *   *Check:* Is the Tie-Breaker clear? Needs to be distinct from the Director case. Director is Bad+Opposed. Tie-Breaker should be Good+Opposed (to see if symmetry returns) or Bad+Forced (to see if Control matters more). Actually, **Good+Opposed** is the cleanest mirror to the Director case.
