  **Tier 1: The Constitutive Moves (2, 6, 7)**
  These explain *why* the paradox fails by correcting your model of motion, mereology, or normativity. Move 2 fixes the part-whole relation; Move 6 fixes the ontology of motion; Move 7 fixes the logic of the "must."

  **Tier 2: The Structural Moves (4, 5)**
  These accept the setup but correct the logic of the series itself. Move 4 fixes the completion condition; Move 5 highlights the symmetry of the regress to show the starting condition is equally problematic.

  **Tier 3: The Premise Denials (1, 3)**
  These solve the puzzle by changing the rules of the game rather than solving the puzzle within them. Move 1 changes the physics; Move 3 changes the logic of sets; neither explains motion, they just deny the infinite divisibility required for the paradox to launch.

  ***

  ### The Variants

  **Variant A: The Finite Gates ($10^{30}$ segments, tap required)**
  *   **Goes Quiet:** Moves **1, 3, 4, 5**. Move 1 and 3 are irrelevant because the segments are already finite. Move 4 is irrelevant because there is no supertask. Move 5 is irrelevant because a finite series necessarily has a first step.
  *   **Still Speaks:** Moves **2, 6, 7**. Move 2 still argues that crossing the whole *consists in* crossing the parts (taps included). Move 6 argues that the "gates" are an artificial slicing of a primitive continuous flow. Move 7 argues the "must tap" is the normative smuggle creating the friction.
  *   **Diagnosis:** The Zeno-ish feel here isn't about infinity; it's about *overhead*. The moves that survive are the ones that attack the idea that motion requires discrete validation (6) or that the validation is constitutive of the motion (2, 7).

  **Variant B: The Reverse Dichotomy (No first step, Yes last step)**
  *   **Goes Quiet:** Move **4**. Move 4 defends the possibility of finishing a series without a *last* member. In this variant, there *is* a last member (the 1/2 segment); the impossibility lies in the *start*. Move 4 addresses the wrong end of the chain.
  *   **Still Speaks:** Move **5** becomes the primary engine. Moves **2, 6, 7** still apply (the division is still conceptual, the motion still primitive). Moves **1, 3** still apply (deny the infinite tail).
  *   **Reshuffle:** Yes. In this variant, **Move 5** jumps to Tier 1. It is no longer just a symmetry check; it is the direct description of the impossibility. Move 4 drops to Tier 3 or out entirely, as its specific defense (no last step needed) is not the bottleneck.

  ***

  ### The Pair in Two Costumes

  **The Pair:** Move **2** ("Slicing doesn't manufacture extra tasks") and Move **6** ("Motion is primitive; slicing produces the illusion").

  **Which Costume Does the Work:** **Move 6.**

  **Why:** Move 2 is a mereological claim (the whole is prior to the parts), but it lacks a metaphysical engine. It asserts that crossing the parts *is* crossing the whole without explaining *why* the division doesn't ontologically multiply the tasks. Move 6 provides the engine: motion is a fundamental, continuous fact, and the "segments" are retrospective abstractions. Move 2 is simply the logical consequence of accepting Move 6. Without the primitive continuity of 6, the composition claim of 2 looks like a mathematical stipulation rather than a metaphysical solution.
