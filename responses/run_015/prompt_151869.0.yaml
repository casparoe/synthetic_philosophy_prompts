  *(Self-Correction on "Legitimacy"):* Legitimacy in politics is about the *right* to control. In control theory, the "right" to control is determined by who closes the loop. If the State closes the loop, it is the controller. Legitimacy translates to "Closed-Loop Stability + Performance Specification Met."

  *(Final thought on the "Ambiguity"):* The political argument says "Performance justifies Authority." Control theory says "Authority (Controller Design) determines Performance." The circularity is exposed. If performance drops, legitimacy (stability) is lost. But the *right* to be the controller is assumed, not derived. This is the key insight.

