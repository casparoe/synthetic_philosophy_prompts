answer: |-
  ### I. Control-Theoretic Restatement of the Performance-Legitimacy Thesis

  **System Architecture:**
  Let the polity be defined as a linear time-invariant (LTI) dynamic system (or a gain-scheduled nonlinear system) with state vector $x(t) \in \mathbb{R}^n$, representing socio-economic variables. The system dynamics are governed by $\dot{x} = Ax + Bu + Dd$, where $u$ is the control input (state policy), and $d$ represents exogenous disturbances (market shocks, geopolitical events).

  **The Controller (The State):**
  The governance structure is the controller $K$. The performance-legitimacy thesis posits a controller architecture optimized for **trajectory tracking** of a reference signal $r(t)$ (economic growth, public order). The objective is to minimize a cost functional $J$:
  $$ J = \int_{0}^{\infty} \left( (y(t) - r(t))^T Q (y(t) - r(t)) + u(t)^T R u(t) \right) dt $$
  where $y = Cx$ is the measured output. $Q$ weights the tracking error (prosperity/order deficit), and $R$ weights the control effort (social friction/coercion cost).

  **Sensor Topology (Participation vs. Consolidation):**
  1.  **Distributed Feedback (Democratic Participation):** Modeled as a high-dimensional sensor matrix $C_{dist}$ with significant transmission latency $\tau$ and high measurement noise covariance $N$. In frequency domain terms, this introduces phase lag that reduces the **phase margin** of the closed-loop system. While it increases observability of certain state variables (local grievances), the latency risks destabilizing the loop during high-frequency disturbances.
  2.  **Centralized Feedforward/Observer (Authoritarian Consolidation):** Modeled as a reduction in sensor dimensionality ($C_{cent} \ll C_{dist}$) coupled with a high-gain state observer. The controller relies on an internal model of the plant ($\hat{A}, \hat{B}$) rather than real-time sensor feedback. This increases the **bandwidth** of the control action $u$, allowing for aggressive actuation to reject disturbances $d$ before they significantly deviate $y$ from $r$.

  **Stability and Legitimacy:**
  In this framework, **Legitimacy** is mapped to **Asymptotic Stability** and **Robust Performance**.
  *   A regime is "legitimate" if the closed-loop eigenvalues $\lambda_i(A - BK)$ lie strictly in the left-half plane (continuous time) or within the unit circle (discrete time), ensuring bounded states.
  *   Furthermore, legitimacy requires the $H_\infty$ norm of the transfer function from disturbance $d$ to error $e = y - r$ to remain below a specified threshold $\gamma$.
  *   **The Thesis:** If the controller $K_{cent}$ (centralized) maintains $\|T_{dr}\|_\infty < \gamma$ and minimizes $J$ more effectively than $K_{dist}$ (distributed) over a finite horizon $T$, then the architecture $K_{cent}$ is validated. The "right" to close the loop is derived exclusively from the minimization of the cost functional $J$, irrespective of the sensor topology's inclusivity.

  ---

  ### II. Residue Report

  This section categorizes the political claims based on their translatability into the control framework defined above.

  #### 1. Clean Translations (Isomorphic Mappings)
  *   **Latency vs. Stability:** The claim that democratic deliberation slows down crisis response maps cleanly to **loop delay reducing phase margin**. A system with high latency in the feedback path requires lower controller gain to remain stable, limiting performance.
  *   **Coherence vs. Actuator Saturation:** The claim that centralized states can mobilize resources effectively maps to **coordinated actuation**. Distributed feedback often results in conflicting control signals ($u_i$ fighting $u_j$), leading to wasted energy or effective saturation. Centralization aligns the input vector $u$.
  *   **Performance as Validation:** The claim that growth justifies the regime maps to **cost function minimization**. If $J(K_{cent}) < J(K_{dist})$, the optimizer selects $K_{cent}$.

  #### 2. Distorted Translations (Requires Parameter Tuning)
  *   **Dissent as Noise:** The political argument often treats opposition as "noise" to be filtered. In control theory, noise is stochastic and uncorrelated. Political dissent is often **structured uncertainty** or **unmodeled dynamics**. Treating structured uncertainty as Gaussian noise leads to filter divergence; the observer state $\hat{x}$ diverges from true state $x$, causing catastrophic control failure later (e.g., sudden revolution).
  *   **Order as Stability:** Political "order" often implies static equilibrium. Control systems require **dynamic stability** (tracking a moving reference). A system can be stable at a sub-optimal equilibrium (stagnation). The thesis conflates *Lyapunov stability* (states don't blow up) with *optimal tracking* (states follow desired growth).
  *   **Time Horizons:** The thesis usually relies on finite-horizon performance ($T = 30$ years). Control theory emphasizes $T \to \infty$ for stability. A controller that minimizes $J$ over a finite horizon may destabilize the system asymptotically (e.g., resource depletion).

  #### 3. No Counterpart (Null Set)
  *   **Consent:** There is no variable for "consent" in state-space representation. The plant does not consent to the controller; it simply reacts.
  *   **Rights:** Constraints on control authority (e.g., "do not torture") function as hard constraints on $u$. However, the *intrinsic value* of these constraints cannot be derived from the dynamics; they must be externally imposed on the weighting matrix $R$ or the admissible control set $\mathbb{U}$.
  *   **Moral Agency:** The framework treats the population as states $x$ to be regulated, not as agents capable of redefining the reference trajectory $r(t)$.

  ---

  ### III. Analysis of the Core Normative Claim

  **Claim:** *Adequate system outputs can legitimate the controller's structure regardless of participatory consent.*

  **Mapping:**
  In control theory, this claim translates to: *"If the closed-loop system is stable and the tracking error is minimized, the controller architecture is valid, regardless of the sensor configuration."*

  **Internal Principle vs. External Axiom:**
  This functions as an **External Axiom** smuggled into the framework.
  1.  **Internal Principle:** Control theory dictates that *if* you choose a cost function $J$ (where $J$ prioritizes output $y$), *then* the optimal controller $K^*$ is the one that minimizes $J$.
  2.  **The Smuggle:** The political argument assumes the cost function $J$ is universally agreed upon (i.e., everyone weights $Q$ heavily on GDP and Order). It asserts that minimizing *this specific* $J$ confers legitimacy.
  3.  **The Gap:** Control theory cannot validate the choice of $Q$ or $R$. It can only solve for $K$ given $Q, R$. The claim that "Output Performance $\rightarrow$ Legitimacy" requires an external normative premise: *that the only valid definition of a successful system is the minimization of output error, rather than the maximization of sensor participation.*

  Therefore, the core normative claim does not map to an internal principle of control theory. It maps to the **definition of the cost function**. The argument asserts that the "Legitimacy Cost Function" $J_{legit}$ contains only output terms ($y-r$) and no sensor-entropy terms. This is a design choice, not a system property.

  ---

  ### IV. Conclusion: Limitation or Ambiguity?

  Does the untranslatable residue indicate a limitation of control-theoretic language, or does it reveal an ambiguity in the performance-legitimacy thesis?

  **It reveals a collapse in the original political thesis.**

  The translation exposes that the performance-legitimacy argument relies on a category error between **functional validity** and **normative authority**.

  1.  **The Collapse:** In control theory, if the plant $P$ contains intelligent subsystems (humans) that can modify the dynamics $A$ or the reference $r$ based on their exclusion from the loop, the "centralized" model fails. By treating the population as passive states $x$ rather than adaptive agents, the model ignores the **feedback effect of the controller on the plant parameters**. If the "sensors" (citizens) are ignored, they may alter the plant dynamics (revolt, black markets, non-compliance), effectively changing $A$ to $A'$ such that the original controller $K_{cent}$ destabilizes the new system.
  2.  **The Ambiguity:** The political thesis claims "Performance justifies Authority." The control translation shows "Authority determines Performance." The justification is circular. The controller is deemed legitimate because it stabilizes the system, but the system is defined by the controller's ability to stabilize it.
  3.  **The Residue:** The untranslatable concepts (Consent, Rights) are not merely "humanistic flourishes" missing from the math; they represent **constraints on the admissible control set $\mathbb{U}$** and **variables in the cost function $J$** that the performance-legitimacy thesis arbitrarily sets to zero.

  **Verdict:**
  The limitation is not in the control-theoretic language, which accurately models the *mechanics* of the argument. The limitation is in the political thesis itself. When forced into the rigorous syntax of dynamic systems, the performance-legitimacy argument collapses into a tautology: *"A controller that successfully controls is a successful controller."* It fails to address why the cost function $J$ excludes the variance of the sensor network (participation) as a penalty term.

  The residue indicates that the political argument depends on the ambiguity of the word "Legitimacy." It uses "Legitimacy" to mean **Stability** (a functional property) when challenged on efficiency, but implies **Rightful Authority** (a normative property) when challenged on ethics. Control theory decouples these: a system can be stable (functional) while violating hard constraints on $u$ (normative). Once decoupled, the claim that performance *alone* generates legitimacy is revealed as an assertion that normative constraints do not exist—a claim that holds only if the population is modeled as inert matter, not adaptive agents.
