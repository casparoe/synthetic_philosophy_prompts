answer: |-
  You have spotted a genuine contradiction in the machinery you operate. It is not just a bureaucratic annoyance; it is a philosophical crack in the foundation. Your intuition is correct: the system behaves as if it believes two incompatible things at the same time.

  Here is the shape of the view your team is currently committed to, where it is weak, and what would change if you picked a different lane.

  ### 1. The Core Commitment: "The Map is Not the Territory"
  By punishing gaming, you are committing to the view that there is a **metric-independent fact** about how well a clinic is doing.

  If the score *were* the reality (like in basketball, where the score literally constitutes who won), then parking patients in ambulances would be a valid strategy. It would be "smart play." The fact that you punish it means you believe the score is a *measurement* of something else (let's call it "Care Quality"), and that "Care Quality" exists even when the score fails to capture it.

  **The Weakness:**
  You act on this belief only when the numbers look weird. You admit there is a "real" quality, but you refuse to measure it directly in the public sphere. You rely on the score to *stand in* for the quality for funding and reputation, but you rely on your secret internal metrics to *judge* the quality for integrity.

  This creates a moral hazard. You are telling the clinics: "This number is the only thing that matters for your survival," while whispering to your integrity unit: "This number is a lie if it moves too fast." You are asking clinics to treat the map as the territory, while you keep a satellite image in the back room to check if they are driving off a cliff.

  ### 2. What Separates Gaming from Improvement?
  You asked if the difference is intent, process, divergence, or survival. In your current system, it is actually a specific combination of **Process** and **Divergence**.

  *   **Improvement:** The clinic changes the *underlying service* (hires staff, fixes triage). The score goes up *because* the reality changed. The score and the reality move together.
  *   **Gaming:** The clinic changes the *measurement process* (moves the clock start, parks ambulances). The score goes up *without* the reality changing. The score and reality diverge.

  **The Weakness:**
  You claim to care about **Process**, but you only detect it via **Number Movement**.
  You said nobody opens an investigation unless a number moves oddly. This means a clinic could be gaming successfully (and undetected) as long as they do it gradually, or if they are small enough that the change doesn't look like a statistical anomaly. Conversely, a clinic could make a massive, genuine breakthrough that looks "odd" statistically and waste resources defending themselves.

  You are not actually policing "gaming." You are policing "statistical outliers." You are assuming that outliers are usually lies, but you have no mechanism to distinguish a "good outlier" (genius improvement) from a "bad outlier" (clever cheating) without an investigation that is only triggered by the outlier itself.

  ### 3. The Tension: Transparency vs. Secrecy
  Is the secrecy of the shadow metrics in tension with the transparency of the published formula? **Yes.**

  *   **The Published Formula** says: "The rules are fixed so you can plan. We trust this formula to capture value."
  *   **The Shadow Metrics** say: "The formula is gameable. We do not trust it to capture value."

  By freezing the formula for three years, you are prioritizing **stability** over **accuracy**. You are admitting that if you updated the formula every year to close loopholes, clinics couldn't plan. But by freezing it, you guarantee that the loopholes will be found.

  The secrecy of the shadow metrics is an admission that the public contract is incomplete. You are telling the public, "We are judging clinics on X," while telling the clinics, "We are actually judging you on X, unless Y looks wrong, in which case we look at Z." This undermines the very transparency the league tables are supposed to provide.

  ### 4. Your Comparisons Explained
  Your examples highlight different philosophical stances. Here is why they feel different:

  *   **Basketball (Score = Reality):** In sports, the game is *constituted* by the rules. If you put the ball in the hoop, you have scored. There is no "true basketball" beyond the rules. Your health system *funds* like this (score = money), but *morally judges* like a school.
  *   **Driving Test (Teaching to the Test = Good):** The goal of a driving test is to ensure minimum safety competence. If the instructor teaches exactly to the test, the student passes the safety threshold. The test is a gate, not a ranking. Your system is a ranking system, which invites competition, not just passing.
  *   **Schools (Teaching to the Test = Bad):** This is the closest to your situation. Society believes "Education" is a broad, real thing that exists beyond the test. If a school narrows its curriculum to only what is tested, they are inflating the score without increasing the "real" education. This is why you feel the friction. You are in the "School" category (broad social good), but using "Basketball" rules (score is king).
  *   **Research Lottery (Randomness > Gaming):** This funder admitted that once the bar is met, the difference between "good" and "great" is too hard to measure without corruption. They chose **humility**. They admitted their measurement tool was too blunt to distinguish the top tier, so they stopped trying.

  ### 5. What Would Change Under Different Views?

  If you want to resolve the tension, you have to pick a lane. Here is what happens if you commit fully to one of the three views you mentioned:

  **Option A: The Score Is All There Is (Radical Constructivism)**
  *   **Philosophy:** There is no "true quality." The score defines quality.
  *   **Change:** You abolish the integrity unit. If a clinic parks patients in ambulances and the clock doesn't start, then by definition, the wait time is lower. You accept that "waiting time" is just a bureaucratic definition, not a patient experience.
  *   **Result:** Funding is perfectly predictable. Gaming becomes "strategy." Patient experience might collapse, but the dashboard remains pristine.
  *   **Viability:** Ethically impossible for health services.

  **Option B: The Target Is Real, Measures Must Rotate (Realism)**
  *   **Philosophy:** "Care Quality" is real, but any single metric is flawed.
  *   **Change:** You stop freezing the formula for three years. You change the metrics constantly, or use the shadow metrics publicly. You investigate based on *process audits*, not just number movement.
  *   **Result:** Clinics complain they can't plan. Costs go up (audits are expensive). The score becomes less important because everyone knows it changes next year.
  *   **Viability:** Operationally painful, but more honest.

  **Option C: Randomness is More Honest (Humility)**
  *   **Philosophy:** We can measure "minimum safety," but we cannot measure "excellence" without inviting gaming.
  *   **Change:** You use the score only as a threshold (pass/fail). Above that threshold, funding is allocated by need or lottery, not by league table ranking.
  *   **Result:** The incentive to game drops massively because the reward for moving from 95th to 98th percentile disappears. The incentive to improve drops too.
  *   **Viability:** Politically difficult (hard to explain to the public why the "best" clinic doesn't get more money), but reduces the corruption you are seeing.

  ### Summary of the Weakness
  The specific weakness in your current practice is this: **You are punishing the *manipulation of the measure* while rewarding the *movement of the measure*, using the *movement of the measure* as the only evidence of manipulation.**

  You are trying to have it both ways. You want the motivational power of a high-stakes game (Basketball) without accepting the rules of the game as the final truth (Schools).

  To fix it, you don't necessarily need new philosophy words. You need to decide: Is the dashboard a **management tool** for you (in which case, keep the shadow metrics and stop publishing league tables that drive funding), or is it a **contract** with the clinics (in which case, you must admit the score is imperfect and stop punishing people for finding the cracks in a frozen target)?

  Right now, you are treating the score as a contract for money, but as a lie for truth. That is why it feels shaky. Because it is.
