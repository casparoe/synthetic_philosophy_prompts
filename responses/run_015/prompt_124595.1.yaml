prompt: |-
  You are an expert in philosophy of action and a professional novelist with deep familiarity with long-form serialized fiction. Before you answer, take a breath and think carefully; begin with a brief brainstorm of what sphexishness denotes—the sphex wasp's apparently rigid, pre-programmed behavioral loop versus the appearance of flexible, free choice—and of the vocabulary you actually use when managing character agency across volumes: continuity bibles, plot outlines, editorial mandates, on-the-page improvisation, and the tension between authorial determinism and the illusion of character freedom.

  As a novelist constructing a multi-volume saga under strict continuity constraints, I want you to restate the philosophical debate about mechanical rigidity, behavioral flexibility, and free will—centered on the sphex wasp and its implications—using only the craft vocabulary I just named. Translate the arguments about determinism, adaptation, and autonomous choice into terms of pre-written character arcs versus improvised revision, evolutionary programming versus environmental selection pressure, and editorial mandates that function like fixed behavioral loops. Be as faithful to the philosophical positions as you can without importing technical jargon unless it genuinely maps onto craft practice.

  Then provide the residue report: which claims translate cleanly into this narrative-craft framework, which must be distorted to fit, and which have no expression at all in how novelists talk about plot and character. Specifically, address whether the philosophical concept of free will survives translation into authorial determination, or whether the residue reveals a gap in my craft vocabulary, or whether the original philosophical disagreement is less substantive than it appears once rendered in terms of serialized storytelling. Do not supply bibliographies, reading lists, or citations; work solely from the concepts themselves.
