answer: |-
  Quick heads-up before you post: There are two Strawsons. P.F. Strawson (the dad) wrote *Freedom and Resentment* and argues *for* responsibility (compatibilism). Galen Strawson (the son) wrote *The Basic Argument* and argues *against* it using the *causa sui* point. Based on what you described, your seminar is definitely talking about **Galen**. If you attribute the "nothing can be causa sui" argument to P.F., you might get dinged.

  Here is the menu of claims hidden inside "nothing can be causa sui," broken down by strength and function.

  ### 1. The Trivial Logical Claim
  *   **The Claim:** "To cause $X$, you must exist. To cause yourself, you must exist before you exist. This is a contradiction."
  *   **Verdict:** **Platitude / Logically True.**
  *   **Analysis:** Nobody actually needs to be *causa sui* in this literal sense. We don't need to have created our own biological existence to be responsible. We just need to be the source of our *actions* or *will*. This version is too strong and irrelevant to moral responsibility.

  ### 2. The Empirical Claim (The "Lottery" Argument)
  *   **The Claim:** "You did not choose your genes, your parents, or your early environment. Therefore, you are not the ultimate source of your actions."
  *   **Verdict:** **Empirically True, but Philosophically Weak.**
  *   **Analysis:** This is factually correct—we didn't pick our starting stats. However, most compatibilists argue this doesn't matter. You can be responsible for what you do *given* your stats. This claim alone doesn't kill responsibility; it just limits the scope of what you're responsible for (you aren't responsible for being born, but maybe for how you act now).

  ### 3. The Determinism Claim
  *   **The Claim:** "If every choice is determined by the past + laws of nature, then the causal chain extends back before you were born. You are just a link in the chain, not the start."
  *   **Verdict:** **Substantive and Defensible (but contested).**
  *   **Analysis:** This is the standard incompatibilist move. It relies on the truth of determinism. If determinism is false (indeterminism), this specific claim loses force, though Galen Strawson argues indeterminism doesn't help (it just adds randomness). This is a heavy lifter, but it depends on physics/metaphysics.

  ### 4. The Infinite Regress Claim (Galen's Core Argument)
  *   **The Claim:** "To be truly responsible for an action, you must be responsible for the mental state (character/motives) that produced it. But to be responsible for *that* mental state, you must have chosen it via a prior mental state. This requires an infinite regress of choices. Since you can't complete an infinite regress, you can't be ultimately responsible."
  *   **Verdict:** **Substantive and Defensible (The Real Killer).**
  *   **Analysis:** This is the one doing the heavy lifting in your seminar. It doesn't matter if you have free will or determinism; the structure of *responsibility for character* requires a prior choice of character, which is impossible. You can't step outside your own mind to choose how your mind works.

  ### 5. The Recursive Self-Modification Case (Your Scenario)
  *   **The Claim:** "An agent rewrites its own source code every millisecond. Therefore, it is creating itself continuously."
  *   **Verdict:** **False (The Regress Still Bites).**
  *   **Analysis:** This sounds like *causa sui*, but it isn't. Ask: *Why* did the agent rewrite the code in way $A$ rather than way $B$ at millisecond $t$? The answer lies in the code that existed at millisecond $t-1$. The "reason" for the change comes from the previous state. The agent is never the *ultimate* source of the rewriting rule; it is always the product of the previous iteration. The regress isn't solved; it's just digitized.

  ---

  ### Which one shuts down "Deep Character" responsibility?
  It is **#4 (The Infinite Regress Claim)**.
  The person on the discussion board is using this to say: You can't be blamed for your deep character traits because you didn't choose them. And you couldn't have chosen them, because to choose them, you would have needed a *different* character to make that choice. Since you can't pull yourself up by your own bootstraps, you can't be ultimately responsible for who you are.

  ### Do any versions survive nested self-causation loops?
  **No.**
  If you have a loop (State $A$ causes State $B$, State $B$ causes State $A$), you still haven't established *ultimate* origination.
  *   **Logical:** A loop doesn't fix the contradiction of existing before you exist.
  *   **Regress:** A loop just means the explanation circles. If asked "Why is the agent this way?", the answer is "Because of the loop." But why *this* loop and not another? If the explanation stops at the loop, the source is brute luck (no responsibility). If the explanation goes outside the loop, the agent isn't *self*-caused.

  **Summary for your post:** The phrase "nothing can be causa sui" is usually a shorthand for the **Infinite Regress Argument**. It's not about biology (empirical) or physics (determinism); it's about the conceptual impossibility of being the ultimate origin of your own will. Your recursive code example fails for the same reason: the rule for rewriting the code is always inherited from the previous version, so the "self" is never the true origin point.
