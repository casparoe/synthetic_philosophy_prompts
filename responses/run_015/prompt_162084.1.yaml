          *   Issue: "Moral Status" isn't a dependent variable in a regression. It's a classification label applied *after* the regression.
          *   Translation: Size is an independent variable ($X$), Capacity is the mediating variable ($M$), Moral Status is the outcome ($Y$). Philosophers say path $X \to Y$ is zero; all effect goes through $M$.

      *   *Move 2 (Bad Proxy):*
          *   Phil: Whales > Humans (mass) but Humans > Whales (status).
          *   Neuro: Outliers in the allometric regression. High residuals for humans? Or different scaling exponents?
          *   Mapping: "Bad proxy" = "Low $R^2$" or "High heteroscedasticity" or "Phylogenetic non-independence ignored."
          *   Nuance: Mosaic evolution. "Brain size" isn't a unitary variable. It's a sum of parts that scale differently.
