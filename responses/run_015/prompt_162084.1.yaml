          *   Translation: Swapping a noisy predictor for a less noisy one, but still not the mechanism itself.

  4.  **Analyze the Residue (The "Untranslatable" Parts):**
      *   *Normativity:* Science describes *is*, Philosophy prescribes *ought*. "Moral Status" is not a natural kind. It's a threshold applied to a continuous distribution.
      *   *Thresholds:* Neuro data is graded (continuous). Moral status is often treated as binary (has rights/doesn't). Where is the cut-off on the regression line?
      *   *Individual vs. Species:* This is the biggest friction point. Allometry deals with means. Ethics deals with specific beings.
      *   *Intrinsic Value:* "Mattering for its own sake." In stats, everything is relative to a model. In ethics, some things are ends, not means.

  5.  **Address the "Verdict":**
