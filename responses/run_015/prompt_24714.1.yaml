      *   (5) **Sensitivity to Aspiration Levels (SAL):** "Division of surplus... proportional to each player's maximum attainable utility." This is the core definition of the **Kalai-Smorodinsky (KS)** solution. The KS solution picks the point on the Pareto frontier where the ratios of gains to maximum possible gains are equal.

  3.  **Identify Known Impossibility Theorems:**
      *   **Nash (1950):** Characterized by SYM, IAT, IIA, and Pareto Optimality (PO). (PO is implicit in rational bargaining, though not explicitly listed, usually assumed).
      *   **Kalai-Smorodinsky (1975):** Characterized by SYM, IAT, PO, and *Individual Monotonicity* (which is very similar to the prompt's RM and SAL combined). KS *rejects* IIA.
      *   **Roth (1979) / Others:** There is a known conflict between IIA and Monotonicity properties.
      *   **The Core Conflict:** The most famous tension in bargaining theory is between **IIA** (Nash) and **Monotonicity/Aspiration Sensitivity** (Kalai-Smorodinsky).
      *   **Specific Conflict:** IIA implies that the solution depends only on the local geometry of the Pareto frontier at the solution point. Monotonicity/Aspiration Sensitivity implies the solution depends on the *global* shape of the feasible set (specifically the ideal point). These are mathematically incompatible.

