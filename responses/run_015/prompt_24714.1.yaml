      *   (4) RM (Monotonicity): Incompatible with Nash (usually). Nash can violate monotonicity when the set expands in specific ways (though Nash satisfies a weaker version, strong monotonicity fails).
      *   (5) SAL (Proportionality to Max): This *is* the Kalai-Smorodinsky axiom. It explicitly defines the KS solution (along with PO, SYM, IAT).

      *   **The Clash:**
          *   (3) IIA + (5) SAL is the primary contradiction.
          *   Nash satisfies (1), (2), (3). It violates (5) and often (4).
          *   KS satisfies (1), (2), (4), (5). It violates (3).

