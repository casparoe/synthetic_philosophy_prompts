  9.  **Self-Correction/Nuance Check:**
      *   *Is RM exactly Individual Monotonicity?* The prompt says: "if the feasible set is enlarged in a way that weakly improves one player's attainable payoff at every level of the other player's payoff." This is essentially the definition of Individual Monotonicity used by Kalai & Smorodinsky (1975).
      *   *Is SAL exactly the KS axiom?* Yes, "proportional to maximum attainable utility" is the geometric definition of the KS solution (intersection of Pareto frontier and the line connecting disagreement point to ideal point).
