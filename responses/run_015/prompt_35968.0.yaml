      *   Better approach: The teacher is right *conceptually* (time isn't space), but the student is right *philosophically* (both undermine the intuition of "presence").
      *   The student's point is that if "where I am" depends on "what I am experiencing now," and "now" is slippery, then "where" is slippery too.
      *   I should suggest linking this to Dennett's "Orwellian vs. Stalinesque" distinction or his views on consciousness timelines. Actually, keep it simple for Year 12. Stick to the "Center of Narrative Gravity."

  6.  **Final Polish:**
