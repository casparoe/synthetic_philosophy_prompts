          *   Connection to Dennett: Dennett talks about "neural latency" anyway. Our brains already process info with a delay. We live in the "specious present." The radio delay just exaggerates this.
          *   Verdict: It works *if* framed as challenging the *criteria* for location, not literally moving through time.
