  *(Self-Correction)*: Wait, I need to double-check the ending of "Where Am I?".
  *   *Recall:* Dennett's body (Hamlet) is damaged. He switches to a new body. Then there's a copy (Hubert). Then Hamlet is destroyed. Dennett (Yorick) is left in the vat.
  *   *Student's summary:* "when the body is destroyed and the signals are just being played to the brain, and then even when there's a copied brain in Fort Worth getting the same inputs..."
  *   *Accuracy:* Pretty good. The key is the indeterminacy.
