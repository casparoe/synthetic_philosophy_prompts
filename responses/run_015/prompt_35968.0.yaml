      *   **Part 1: Interpreting Dennett:**
          *   Confirm the student is largely right. Dennett *does* move towards a pragmatic/narrative view.
          *   Nuance: Dennett doesn't just say "it's practical." He says the question presupposes a "self" that *has* a location, which is the mistake. The self is an abstraction (Center of Narrative Gravity).
          *   Correction on the ending: In the story, when the body is destroyed, Dennett (Yorick) is still "alive" in a sense, but the duplication (Hubert) makes it worse. The key is that *neither* has a better claim.
      *   **Part 2: The Time Delay Twist:**
