answer: |-
  The pattern you have isolated is a precise instance of a concept extensively analyzed in the philosophy of language and social science. It is most rigorously defined as a **Lewisian Convention**.

  Named after the philosopher David Lewis, who formalized the concept in his 1969 book *Convention: A Philosophical Study*, this framework was designed specifically to solve the puzzle you describe: How do regularities arise in behavior that are arbitrary, yet sustained without central authority or technical necessity?

  Below is an analysis of how your engineering observations map to this philosophical framework, followed by the specific inclusion/exclusion criteria you requested to bound the concept against your contrast cases.

  ### 1. The Core Characterization: Lewisian Convention

  David Lewis defined a convention as a solution to a **coordination problem**. In game theory terms, it is a specific kind of Nash Equilibrium. Your description matches Lewis's five criteria almost exactly:

  1.  **Regularity:** Everyone conforms to the pattern (e.g., the error envelope shape).
  2.  **Common Knowledge/Expectation:** Everyone expects everyone else to conform. (You noted: *"each team seemed to follow the shape mainly because it expected the other teams to keep following it."*)
  3.  **Conditional Preference:** Everyone prefers to conform *on the condition* that others do. (You noted: *"unilateral deviation is costly... while coordinated deviation would be unproblematic."*)
  4.  **Arbitrariness:** There is at least one other possible regularity that could have solved the problem equally well. (You noted: *"several leaner shapes would have worked equally well."*)
  5.  **General Knowledge:** It is common knowledge that the above conditions hold. (This is evidenced by the "critical review comments"—the friction proves the expectation is shared.)

  #### Why this fits your instances
  *   **The Error Envelope:** This is a coordination equilibrium. If Team A sends `{code, msg}` and Team B expects `{code, msg, retry}`, integration fails. If both send `{code, msg, retry}`, it works. If both sent `{code, msg}`, it would also work. The specific choice is arbitrary; the *agreement* is necessary.
  *   **The Idempotency Key:** This is a coordination problem regarding *where* to put the key (Header? Body? Query param?). Any location works technically, but divergence breaks the system. The convergence is sustained because Server Team expects Client Team to use Header X, and Client Team uses Header X because they expect Server Team to look there.

  ### 2. The Emergence Mechanism: Path Dependence and Schelling Points

  You asked about the emergence over time ("No vote is taken, yet a small early precedent gets copied..."). Philosophy and economics supplement Lewis here with two related concepts:

  *   **Path Dependence:** This explains the *history*. The first service's implementation was a historical accident (perhaps the senior engineer's preference). Because switching costs increase as more services adopt the pattern, the system gets "locked in" to that initial path, even if a better path exists.
  *   **Schelling Point (Focal Point):** Coined by Thomas Schelling, this explains the *selection*. When people cannot communicate, they tend to choose the solution that seems most salient or "natural." In your case, the first implemented service became the Schelling Point. It wasn't voted on; it simply became the obvious reference for subsequent teams because it was the *existing* reference.

  ### 3. Boundary Work: Inclusion and Exclusion Criteria

  To properly bound this pattern, we must distinguish it from the contrast cases you identified. The distinguishing factor is always the **source of the constraint** and the **nature of the arbitrariness**.

  #### A. Inclusion Criteria (What makes it a Convention)
  For a pattern to fit your description (and the Lewisian definition), it must satisfy all three:
  1.  **Interdependence:** The utility of my action depends on your action. (I only benefit from using this error format if you parse it.)
  2.  **Arbitrariness:** A functionally equivalent alternative exists. (We could have used XML instead of JSON; snake_case instead of camelCase.)
  3.  **Self-Policing Expectation:** The enforcement mechanism is social/expectational, not physical or automated. (The build passes, but the PR review fails.)

  #### B. Exclusion Criteria (The Contrast Cases)

  Here is how we distinguish your pattern from the three phenomena you felt were different:

  | Phenomenon | Source of Constraint | Arbitrariness? | Deviation Consequence | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Lewisian Convention** (Your Pattern) | Mutual Expectation | **Yes.** Alternative works equally well. | **Social/Integration Friction.** System works but creates debt/friction. | **INCLUDE** |
  | **Technical Necessity** | Physics/Logic/Spec | **No.** Only one shape parses. | **System Failure.** Code does not compile or request 400s. | **EXCLUDE** |
  | **Tool Enforcement** | External Authority (CI/CD) | **Yes.** Formatter could be different. | **Build Rejection.** Automated gate prevents merge. | **EXCLUDE** |
  | **Private Habit** | Individual Preference | **Yes.** Alternative works equally well. | **None.** No impact on others. | **EXCLUDE** |

  #### C. Difficult Boundary Cases

  To sharpen the definition, consider these edge cases common in engineering:

  *   **Case 1: The "De Facto Standard"**
      *   *Scenario:* A library becomes so popular (e.g., `lodash` or `react`) that not using it is seen as folly, but it is not technically required.
      *   *Analysis:* This is a Convention that has hardened. It fits your criteria. The "cost" of deviation is hiring/training friction, not build failure.
      *   *Boundary:* If the organization mandates it in an architecture decision record (ADR), it shifts from Convention to **Policy** (Tool Enforcement/Authority).

  *   **Case 2: The "Best Practice"**
      *   *Scenario:* Engineers agree that Service Mesh is "better" than hard-coded retries.
      *   *Analysis:* If "better" means "technically superior performance," it is approaching Technical Necessity. If "better" means "we all agree to use it so we don't have to support two models," it is a Convention.
      *   *Boundary:* If the preference is based on *interoperability*, it is a Convention. If based on *intrinsic merit* (e.g., security), it is a Technical Norm.

  *   **Case 3: The "Legacy Burden"**
      *   *Scenario:* You keep an old API format not because you expect others to use it, but because changing it breaks old clients you can't contact.
      *   *Analysis:* This is **Lock-In**, a consequence of Convention. The original adoption was conventional; the retention is now Technical Necessity (backward compatibility requirements).

  ### 4. Proposed Definition: "Technical Coordination Convention"

  While Lewis's definition is robust, it was designed for language and traffic laws. To capture the specific nuance of distributed systems engineering, I propose the following refined definition. This captures your two instances while explicitly excluding your contrast cases.

  > **Technical Coordination Convention**
  >
  > A regularity in the design or behavior of distributed system components is a Technical Coordination Convention if and only if:
  >
  > 1.  **Functional Equivalence:** There exists at least one alternative design that satisfies all functional and performance requirements equally well (excluding the cost of coordination).
  > 2.  **Interoperability Dependence:** The value of adopting the regularity is derived primarily from the reduction of integration costs with other components, rather than intrinsic technical superiority.
  > 3.  **Expectational Enforcement:** Adherence is sustained primarily by the mutual anticipation that other component owners will adhere to the same regularity, rather than by automated gating or protocol specification.
  > 4.  **Unilateral Deviation Cost:** A single component deviating from the regularity while others conform incurs a non-zero integration cost (e.g., adapter code, review friction, cognitive load), even if the system remains operational.

  ### 5. Why the Distinction Matters

  You asked for this distinction not merely for labeling, but presumably to manage it. Recognizing a pattern as a **Convention** rather than a **Standard** or **Necessity** changes how you should govern it:

  *   **Do not over-formalize too early:** Since conventions rely on organic convergence, mandating them via tool enforcement (CI/CD) before the "arbitrary" choice has proven stable can freeze a sub-optimal convention.
  *   **Coordinate changes explicitly:** Because conventions are sustained by expectation, changing them requires a "coordinated deviation." You cannot simply update the code; you must update the *expectation* (documentation, communication) simultaneously.
  *   **Identify "False Necessities":** Engineers often argue a convention is "technically necessary" to win arguments. Recognizing it as a Convention allows you to ask: "Is this actually required by the parser, or are we just protecting our mutual expectations?"

  ### Summary

  The pattern you have encountered is a **Lewisian Convention** emerging through **Path Dependence**.

  It is bounded by **Arbitrariness** (distinguishing it from technical necessity), **Interdependence** (distinguishing it from habit), and **Lack of External Coercion** (distinguishing it from tool enforcement). It is a social equilibrium masquerading as a technical standard. Recognizing it as such allows you to treat it as a coordination game to be managed, rather than a technical truth to be discovered.
