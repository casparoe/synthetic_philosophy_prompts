          2.  **Public vs. Private Payoffs:** If there's a benefit to being contrarian (reputation, market beating), the cascade breaks.
          3.  **Continuous Actions/Signals:** If actions are continuous (e.g., investment amount), they reveal more info than binary yes/no.
          4.  **Endogenous Timing:** If people can choose *when* to act, they wait for more info.
          5.  **Signal Correlation:** If signals are correlated (common noise), the cascade forms faster but is more prone to breaking on public news.
          6.  **Public News:** Exogenous public signals arrive over time.
      *   *Selection:* The most direct answer to "why do real ones break" is usually **heterogeneous precision** (someone knows more) or **continuous actions** (degrees of belief leak out). Also, **public news** (exogenous shocks).
