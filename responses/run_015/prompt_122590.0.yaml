      *   *User's Idea:* People post likelihood ratios (LR). Aggregator keeps log-odds ledger.
      *   *Analysis:* This moves from an *action* model to a *communication* model.
      *   *Incentive Compatibility:* This is the killer. In the BHW model, payoffs depend on matching the state. If I report my LR truthfully, do I maximize my payoff?
          *   If the payoff is *only* for matching the state, and the "ledger" is just a forum post with no mechanism to enforce truth, I have an incentive to lie if I think the crowd is wrong and I want to sway them (if there's a secondary benefit) OR if I want to conform (if there's social pressure).
          *   But strictly speaking, if the *only* payoff is matching the state, and my report doesn't change the state or my payoff directly, it's "Cheap Talk."
          *   *Crawford-Sobel:* Cheap talk is generally noisy unless interests are perfectly aligned. Here interests *are* aligned (everyone wants truth). So truthful revelation *should* be an equilibrium.
          *   *The Catch:* If my report influences others, and others' actions influence *my* payoff (e.g., network effects, market price), then I might strategize.
          *   *User's specific mechanism:* "Aggregator keeps a running log-odds ledger." Who is the aggregator? Is it a mechanism?
          *   *If it's a mechanism design problem:* If you can enforce truthful reporting (e.g., proper scoring rules), then yes, the cascade dissolves. Log-odds add linearly. $N$ signals $\to$ precision grows with $N$. Law of Large Numbers kicks in. Truth is found.
          *   *Why it fails in practice:*
              1.  **Incentives:** Without a proper scoring rule (paying for accuracy of report, not just matching state), people lie to signal status or conform.
              2.  **Common Uncertainty about $q$:** If I don't know your $q$, I can't weight your LR.
              3.  **Correlation:** If signals are correlated (everyone read the same news tweet), adding LRs double-counts evidence. This is the "social learning with correlated signals" problem (Acemoglu et al.).
              4.  **Strategic Misreporting:** If my report moves the market price, and I have a position, I lie (manipulation).
      *   *Verdict:* Theoretically, with aligned interests and known $q$, truthful reporting solves it. Practically, correlation and unknown $q$ kill it.

  7.  **Drafting the Response:**
