  1.  **Deconstruct the Request:**

      *   **Core Task:** Audit an analogy between Fairness Impossibility Results (specifically Calibration vs. Equalized Odds) and Arrow's Impossibility Theorem.
      *   **User's Stance:** Skeptical of the senior person's analogy. Believes it licenses a "relaxed political conclusion" (pick your own fairness, no justification needed) that is unjustified.
      *   **Specific Requirements:**
          1.  **Correspondence Table:** Map Arrow's components (voters, alternatives, preferences, SWF, axioms, etc.) to Fairness components. Flag empty boxes.
          2.  **Disanalogies:** Evaluate four specific suspected disanalogies (contingency vs. necessity, normative vs. accuracy, lack of aggregation/agents, mismatched escape routes). Distinguish cosmetic vs. substantive.
