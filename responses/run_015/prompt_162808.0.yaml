      *   *Check:* Did I distinguish between "Calibration within groups" and "Predictive Parity"? The prompt says "calibrated within each group." That's $P(Y=1|R=r, A=a) = r$. The conflict is usually with Equalized Odds ($P(R=1|Y=0, A=a)$ constant).
      *   *Check:* Ensure I don't get bogged down in too much math. Keep it conceptual as requested.

