  *(Self-Correction on the "Binary Output" section)*: The prompt says "the model doesn't emit a probability at all. It emits a binary yes/no." If the model *only* emits binary, Calibration is technically undefined *for the output*. It applies to the score *used to generate* the output. The impossibility result (Chouldechova 2017) shows you can't have Equalized Odds + Predictive Parity (which is a proxy for calibration in binary settings) if base rates differ. I need to be precise here: if you tune thresholds per group to get Equalized Odds, you inherently get different Positive Predictive Values (PPV) across groups. That *is* the trade-off.

