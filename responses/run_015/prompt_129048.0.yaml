      *   **Specific Definition:** CTT doesn't say *everything* is discrete; it says anything we can *justify calling computational* must be Turing-simulable because our access is limited to effective, intersubjectively checkable procedures.
      *   **Key Area of Interest:** Philosophy of mind and cognitive science (specifically arguments invoking analog, continuous, or hypercomputational dynamics for consciousness/decision-making).
      *   **Specific Questions to Address:**
          1.  Does this collapse the distinction between "computes in principle" vs. "computes for any epistemic agent with our verification capacities"?
          2.  Does this render anti-functionalist objections (relying on hidden/unverifiable computations) methodologically empty rather than empirically false?
          3.  How should we evaluate claims that a physical system performs hypercomputation?

  2.  **Analyze the "Epistemic Boundary" View of CTT:**

      *   *Standard View:* CTT is often treated as "Everything computable is Turing-computable." Some interpret this physically (The Physical CTT): "Every physical process is Turing-computable."
      *   *Proposed View:* CTT is about *justification*. To claim $X$ computes $F$, we need an algorithm to verify the input-output mapping. If we can't verify it effectively, we can't epistemically warrant the claim that it's a computation *for us*.
      *   *Implication:* Hypercomputation might exist "out there" (ontologically), but we can never certify it as computation (epistemologically).

  3.  **Address Question 1: Collapsing the Distinction ("In Principle" vs. "For Us"):**

      *   *Traditional Distinction:* There is what the brain *actually* does (maybe analog, maybe hyper) vs. what we can *model* (Turing).
      *   *Epistemic View:* If we can't verify the hyper-aspect, the claim "it computes hyper" is meaningless within a scientific framework. Science requires intersubjective verification.
      *   *Conclusion:* Yes, it effectively collapses the distinction *for the purposes of scientific theory*. If a process isn't verifiable as a computation by effective means, labeling it "computation" adds no explanatory power. It becomes a "God's eye view" claim, which is metaphysically possible but scientifically idle.

  4.  **Address Question 2: Anti-Functionalist Objections (Methodologically Empty?):**

