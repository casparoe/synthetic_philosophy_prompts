answer: |-
  **Project Title:** Time-Indexing the Spandrel: Resolving the Adaptationism Debate via Origin/Maintenance Slippage

  **Project Summary**
  The debate over Gould and Lewontin's spandrels critique has reached a stalemate. Adaptationists argue that natural selection is the primary explanatory tool for phenotypic traits; critics argue that structural constraints and byproducts are systematically underestimated. This project proposes that the stalemate is not empirical but methodological, driven by "origin/maintenance slippage." Researchers frequently conflate the historical origin of a trait (where it may be a byproduct) with its current maintenance (where it may be an adaptation). By treating these as distinct time-slices with distinct null hypotheses, we can dissolve the logical contradiction without requiring new biological data. Over 9 months, this project will formalize this distinction and produce a methodological protocol for assigning the burden of proof in evolutionary explanations.

  **1. The Research Question**
  **Primary Question:** Does explicitly time-indexing evolutionary claims (separating *historical origin* from *current maintenance*) resolve the logical incompatibility between adaptationist and structuralist explanations in paradigmatic cases?

  **Determinable Answers:**
  1.  **Resolution:** Yes. When time-indexed, the contradictory claims vanish (e.g., "Byproduct at $t_{origin}$" and "Adaptation at $t_{maintenance}$" are compatible). The debate is revealed as a category error.
  2.  **Persistence:** No. Even when time-indexed, the camps disagree on the *default null hypothesis* for each slice (e.g., is the null for maintenance drift or selection?). The conflict is deeper than slippage.
  3.  **Collapse:** The distinction is empirically vacuous. Origin and maintenance are causally continuous to the point where separating them offers no explanatory leverage.

  **2. Critique of Standard Framings**
  Current approaches fail to yield a determinate answer because they frame the dispute in ways that guarantee endless contention:
  *   **The Global Empirical Frame:** "What percentage of the phenotype is adaptive?" This is unanswerable. It invites cherry-picking case studies (the adaptationist points to the eye; the critic points to the panda's thumb) with no metric for aggregation.
  *   **The Heuristic Frame:** "Adaptationism is just a research strategy." This dissolves the conflict by lowering the stakes, but it ignores the risk of confirmation bias. If the heuristic never fails (because failures are reclassified as 'byproducts' ad hoc), it is not a testable strategy.
  *   **The Semantic Frame:** "It depends on the definition of 'function'." This reduces the debate to lexicography. It clarifies language but offers no guidance to a biologist deciding which model to build for a specific trait.

  These framings ignore the temporal dimension. They treat "is this an adaptation?" as a timeless property of the trait, rather than a claim about a specific causal history.

  **3. Methodology and Approach**
  **Scope:** 9 months, 1 part-time Research Assistant (RA), no teaching buyout.
  **Method:** Conceptual modeling and logical reconstruction.

  **Why this approach?**
  *   **Vs. Case Study Survey:** A survey of biological literature would require domain expertise beyond the team's capacity and would inevitably bog down in the very empirical disputes we aim to bypass. We are not adjudicating specific traits; we are adjudicating the *logic of the arguments* about traits.
  *   **Vs. Armchair Semantics:** We are not defining words; we are mapping inference rules. We will treat evolutionary explanations as logical structures with premises (evidence) and conclusions (adaptive/structural claims).

  **Work Plan:**
  *   **Months 1–3 (Mapping):** PI and RA will identify 5–10 "paradigmatic" debate pairs (e.g., specific reply papers where adaptationists and spandrelians clash over the same phenomenon). The RA will code these texts for implicit time-indexing. Do the authors specify whether they are arguing about origin or maintenance?
  *   **Months 4–6 (Modeling):** PI will construct a formal model of "Origin/Maintenance Slippage." This model will define the conditions under which a trait transitions from byproduct to adaptation (exaptation) and assign the appropriate null hypothesis for each phase.
  *   **Months 7–9 (Stress-Testing & Deliverable):** The model will be tested against the coded debate pairs. Does applying the model silence the disagreement? The output will be drafted and refined.

  **4. Deliverable: The Burden of Proof Protocol**
  The primary output will not be a journal article alone, but a **Methodological Protocol for Evolutionary Explanation**. This will be a practical tool (flowchart/checklist) designed for working biologists and modelers.

  **Function:**
  The Protocol will guide researchers in setting the local burden of proof.
  *   *If asking about Origin:* The default null is constraint/drift. The burden lies on the adaptationist to show historical selection *for* the trait.
  *   *If asking about Maintenance:* The default null depends on trait stability. The burden lies on the critic to show the trait persists *despite* selection, or on the adaptationist to show it persists *because* of selection.

  **Value:**
  This prevents researchers from making "slippage" errors (using current utility to prove historical origin). It allows a biologist to say, "I am not claiming this was selected *for* initially, only that it is selected *for* now," without conceding the adaptationist label entirely. It moves the field from a global war over "adaptationism" to local decisions about burden of proof.

  **5. Risk and Failure Conditions**
  It is vital to distinguish between a negative result and project failure.

  **Negative Result (Success):**
  The project concludes that time-indexing *does not* resolve the debate (Answer 2 or 3 above). This is a successful philosophical result. It demonstrates that the adaptationism debate is not merely a confusion of tenses but a substantive disagreement about null hypotheses or causal continuity. The Protocol would be published with this limitation clearly stated, saving future researchers from pursuing this specific dissolution strategy.

  **Project Failure:**
  1.  **Unusability:** The Protocol is so abstract or complex that working biologists cannot apply it to experimental design. (Mitigation: We will consult with one external evolutionary biologist during Month 8 for usability feedback).
  2.  **Triviality:** The analysis shows that biologists already implicitly track this distinction and the "slippage" is merely a rhetorical artifact of philosophy papers, not scientific practice. If the slippage doesn't exist in the lab, the project has no target.
  3.  **Scope Creep:** Attempting to resolve the empirical status of specific traits rather than the logical structure of the arguments. (Mitigation: Strict adherence to the 5–10 debate pair limit).

  **6. Potential for Controversy**
  This project is designed to annoy both camps, which suggests it is cutting correctly.
  *   **Adaptationists** will be annoyed by the formalization that current utility does not license historical claims. It blocks the move from "it is useful now" to "it was selected for then."
  *   **Spandrelians/Structuralists** will be annoyed by the concession that byproducts can become genuine adaptations via co-option. It blocks the move from "it started as a byproduct" to "it is still just a byproduct."

  By forcing both sides to accept the time-slice validity of the other's claim, we remove the ability to claim total victory, but we provide a clearer path for constructing testable models.

  **Budget Justification**
  Funds are requested solely for the part-time RA (10 hours/week for 9 months). The RA will handle literature coding, transcription of logical structures, and initial drafting of the Protocol flowcharts. The PI will provide the philosophical framework and final analysis. No travel or equipment is required.
