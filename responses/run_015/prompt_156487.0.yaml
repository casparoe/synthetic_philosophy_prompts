answer: |-
  You are running two different notions together: one tracks the historical or designed reason for a trait's presence (Proper Function), and the other tracks its current causal contribution to a system (Capacity Function).

  Your verdicts only cohere if you accept that "function" is ambiguous between these two senses. The Proper Function sense explains why you attribute function to broken things (Case 2: cave fish eyes) and designed artifacts (Case 8: mechanical pump); the Capacity Function sense explains why you attribute function to novel useful effects without history (Case 3: toad patch) and drift cases (Case 5: snail shells). Your intuition in Case 5 that the function feels "weaker" is precisely you sensing the presence of Capacity Function without the backing of Proper Function. Your principle in Case 7 (relativity) is the key to managing both: function is always relative to a **Beneficiary System** (the organism, the gene, the ecosystem), and you must specify whether you are asking what the trait *does for* that system (Capacity) or what the trait is *maintained by* that system (Proper).

  Here is how the two-tier account maps your cases:

  **Proper Function (History/Design Dependent)**
  *   **Principle:** A trait has a proper function relative to a system if its presence is explained by selection or design for that effect.
  *   **Cases Saved:**
      *   **Case 1 (Heart):** Selected for pumping.
      *   **Case 2 (Cave Fish):** Presence explained by past selection for seeing, even if current capacity is lost. This saves your verdict that the function remains "seeing" despite degeneration.
      *   **Case 6 (Peacock):** Selected for mating, not species survival.
      *   **Case 8 (Pump):** Presence explained by designer intent. This saves your verdict that it has a function despite no evolutionary history.
      *   **Case 9 (Ear Bone):** Proper function shifts to B because B is what *currently* explains its maintenance. A is no longer the proper function because it no longer explains presence.

  **Capacity Function (Current Contribution Dependent)**
  *   **Principle:** A trait has a capacity function relative to a system if it currently contributes to that system's persistence or goals, regardless of history.
  *   **Cases Saved:**
      *   **Case 3 (Toad Patch):** No selection history for the patch itself, but it currently contributes to cooling. This saves your verdict that it has a function despite lacking etiology.
      *   **Case 4 (HGT Gene):** It currently does the chemistry and helps. This resolves your flip-flop by allowing you to say it has a capacity function immediately, even if proper function takes generations to establish.
      *   **Case 5 (Drift Snails):** It currently protects. This explains why you feel it has a function, but the "weaker/second-rate" feeling comes from the lack of Proper Function backing it.

  **Verdicts on New Cases**

  1.  **Gut bacteria making vitamin K:**
      *   **Relative to the Host:** Capacity Function only. The bacteria contribute to the host's health, but the host's lineage did not select the bacteria's genes (unless co-evolved symbiosis is established). You should say they *serve* a function for the host, but are not *for* that function in the proper sense.
      *   **Relative to the Bacteria:** Proper Function. The metabolism is selected for the bacteria's own survival.
      *   **Cost:** You must accept that the same trait has Proper Function for one system and only Capacity Function for another.

  2.  **Trait under selection for A, slowly co-opted for B (e.g., feathers for warmth, aiding gliding):**
      *   **Verdict:** Proper Function is A (what currently maintains the gene frequency). Capacity Function includes A and B.
      *   **Nuance:** As selection pressure shifts toward B, Proper Function gradually transitions. You should feel tension here similar to Case 9, but less resolved. It is not yet "B" in the Proper sense until B becomes the primary maintenance condition.

  **The Cost**
  To keep all your verdicts, you must drop the demand for a single, univocal definition of "function." You cannot say a trait simply "has" a function; you must specify whether you mean "what it is for" (Proper) or "what it does" (Capacity). This means Case 2 (Eyes) and Case 3 (Toad) are not using the same word in the same way. The cost is conceptual complexity: you lose the elegance of a single principle, but you gain the ability to honor all your intuitions without contradiction. If you force a single principle, you will have to drop either the normativity of the cave fish eyes (admitting they have no function now) or the functionality of the toad patch (admitting it is merely a useful effect).
