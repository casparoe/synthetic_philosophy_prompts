          *   Intro: 10 min.
          *   Activity Setup: 10 min.
          *   Execution (Coin, Envelopes, Bets): 20 min.
          *   Tally & Reveal: 10 min.
          *   Debrief/Discussion: 40 min.
          *   Total: 90 min.

      *   *Stakes:* $30 cash. $2 per student "endowment" (hypothetical) or just prize for best prediction?
      *   Let's do a "Class Pot." If the Class makes a profit, everyone gets candy. If loss, no candy. This makes it cooperative but highlights the Dutch Book (class loss).
      *   Actually, individual stakes are better for revealing credence. "You keep your profit."
      *   Okay, $2 buy-in. Ticket pays $6 if Heads.
      *   Fair price for Halfer: $3.
