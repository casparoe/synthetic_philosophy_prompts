answer: |-
  # Activity Design: "The Envelope Protocol"

  ## Pedagogical Commitment
  This activity commits to a **spatial simulation of temporal self-location**. Since we cannot wipe memory, we will wipe *global context*. Students will know they have been "selected" to bet (Awake), but they will not know *how many others* were selected. This forces them to reason from a centered perspective ("I am holding a BET slip") rather than a God's-eye view ("The coin is 50/50").

  The design prioritizes the **Dutch Book tension**. By structuring the payoffs so that "Halfer" betting leads to a predictable class-wide loss when Tails occurs (because more students bet in the Tails world), you force the pragmatists to Third and the purists to defend why their credence shouldn't match their betting behavior.

  ## Logistics
  *   **Time:** 90 Minutes.
  *   **Students:** 15.
  *   **Materials:**
      *   15 identical opaque envelopes.
      *   30 Index Cards (15 marked "AWAKE", 15 marked "ASLEEP").
      *   15 "Bet Sheets" (simple slips of paper).
      *   Cash: $30 total (or equivalent gift cards/candy stakes).
      *   A visible coin.
      *   Whiteboard.
  *   **Room Setup:** Desks spaced apart or students instructed to create "privacy barriers" with backpacks/books. No talking once envelopes are distributed.

  ---

  ## Part 1: Setup & Rules (15 Minutes)

  **Facilitator Script:**
  "Today we are not talking about Sleeping Beauty yet. We are running an experiment. Here are the rules:

  1.  **The Coin:** I will flip a fair coin. Heads or Tails. 50/50 objective chance.
  2.  **The Envelopes:** I have 15 envelopes. Inside each is a card.
      *   If the coin is **Heads**: 5 envelopes contain 'AWAKE'. 10 contain 'ASLEEP'.
      *   If the coin is **Tails**: 10 envelopes contain 'AWAKE'. 5 contain 'ASLEEP'.
      *   *Note:* I have prepared these sets in advance. I will flip the coin, then distribute the corresponding set. You do not know which set you are in.
  3.  **The Information:** You will open your envelope under your desk.
      *   If **ASLEEP**: You sit quietly. You do not bet. You are 'out of the experiment' for this round.
      *   If **AWAKE**: You are active. You know you are awake. You do *not* know how many others are awake.
  4.  **The Bet:** If you are AWAKE, you must write down a price you are willing to **pay** for a ticket.
      *   The ticket pays **$6** if the Coin is **Heads**.
      *   The ticket pays **$0** if the Coin is **Tails**.
      *   Your profit = ($6 - Your Price) if Heads; (-Your Price) if Tails.
  5.  **The Stakes:** I will honor every single bet. If you write $3.00, you owe me $3.00. If you win, I pay you. We will settle in cash at the end of class.

  **Crucial Constraint:** Once you open your envelope, you cannot communicate. You cannot count heads. You cannot signal. You are isolated."

  **Why this ratio?**
  Explicitly state the 5 vs. 10 ratio on the board *before* the flip. This gives them the likelihoods needed for Bayes' theorem without giving away the outcome.
  *   $P(Awake | Heads) = 1/3$
  *   $P(Awake | Tails) = 2/3$

  ---

  ## Part 2: The Experiment (20 Minutes)

  1.  **Distribution:** Have students close eyes/put heads down. Flip the coin visibly.
      *   *Instructor Note:* Keep the result secret. Pick up the pre-prepared stack (Set H or Set T) corresponding to the result.
      *   Walk around and place one envelope on each desk.
  2.  **Awakening:** Tell students to open envelopes privately.
      *   "If your card says ASLEEP, put your head down and do nothing. You are effectively not here."
      *   "If your card says AWAKE, take a Bet Sheet."
  3.  **Betting:** Give them 5 minutes to decide their price.
      *   Walk around and collect Bet Sheets *only* from AWAKE students.
      *   *Instructor Note:* Do not let them see how many sheets you are collecting. Stack them face down.
  4.  **The Wait:** While you tally, keep the coin result hidden. Ask the ASLEEP students to keep heads down to maintain the isolation illusion for the AWAKE students (who might look up).

  ---

  ## Part 3: The Reveal & Tally (10 Minutes)

  1.  **Collect Data:** Write the submitted prices on the board anonymously (e.g., "$2.50, $3.00, $2.00...").
  2.  **Poll:** Ask for a show of hands (without revealing coin):
      *   "Who priced the ticket above $3.00?" (Aggressive Halfer)
      *   "Who priced at exactly $3.00?" (Strict Halfer)
      *   "Who priced at $2.00?" (Strict Thirder)
      *   "Who priced below $2.00?" (Risk Averse/Extreme Thirder)
  3.  **The Reveal:** Flip the coin result on the board.
  4.  **The Settlement:**
      *   Calculate the total profit/loss for the class based on the actual number of bettors.
      *   **Scenario A (Heads):** 5 Bettors. If average price was $3.00, Class Profit = $5 \times (6 - 3) = +$15$.
      *   **Scenario B (Tails):** 10 Bettors. If average price was $3.00, Class Loss = $10 \times (0 - 3) = -$30$.
  5.  **Pay Out:** Hand out the cash. If the class lost money (likely if they priced Halfer and Tails came up), pay from your pocket. This creates a "sunk cost" feeling that resonates.

  ---

  ## Part 4: Debrief & Philosophical Mapping (45 Minutes)

  This is where you move from the game to the seminar content. Do not start with definitions; start with their bets.

  ### 1. The Vertigo of the Envelope (10 mins)
  *   **Ask:** "For those who got an AWAKE slip: What was your immediate intuition? Did you feel 'lucky' (Heads world is rarer for bettors) or 'neutral'?"
  *   **The Move:** Highlight the **Centered World**. They knew the coin was 50/50 *ex ante*. But *ex post* (holding the slip), the probability shifted.
  *   **Formal Link:** Write Bayes' Theorem on the board.
      $$P(Heads | Awake) = \frac{P(Awake | Heads) \cdot P(Heads)}{P(Awake)}$$
      Plug in the numbers from the game ($1/3 \cdot 1/2$) / ($1/2$). Result: **1/3**.
  *   **Point:** The game forces the Thirder calculation mathematically. The "Vertigo" is the realization that *your existence as a bettor* is evidence.

  ### 2. The Halfer Pushback (15 mins)
  *   **Predictable Issue:** A student will say: "But the coin is still 50/50. The envelopes don't change the physics of the coin."
  *   **Facilitator Response:** "You are distinguishing between $P(Heads)$ and $P(Heads | I\ am\ betting)$. Lewis (Halfer) argues self-locating information shouldn't update uncentered credences. Elga (Thirder) argues that *being awake* is new evidence."
  *   **The Dutch Book Trap:** Point to the class financial loss (if Tails occurred and they bet high).
      *   "If you maintain $P(Heads)=1/2$, you bet $3.00$. In the Tails world, you bet *twice as often*. You get Dutch Booked by the structure of the experiment."
      *   **Question:** "Does avoiding a Dutch Book force you to change your *belief*, or just your *betting strategy*?" (This opens the door to pragmatic vs. epistemic arguments).

  ### 3. Simulating the Memory Wipe (10 mins)
  *   **Honest Limitation:** "We didn't wipe your memory. We used spatial distribution (5 vs 10 students) instead of temporal distribution (Mon vs Tue)."
  *   **Why it works:** In Sleeping Beauty, Tails creates *more opportunities* for observation. In this game, Tails created *more observers*.
  *   **The Disanalogy:** In SB, it's the *same* person twice. Here, it's *different* people.
  *   **Discussion:** Does personal identity matter? If I am cloned on Tails, is my credence different than if I am just woken up twice? (Introduces the "Incubator" variant).

  ### 4. Mapping to the Literature (10 mins)
  *   **Lewis (Halfer):** Would argue the envelope selection is irrelevant to the coin. The "AWAKE" slip is guaranteed to happen in some form; it's not *new* evidence about the coin, only about your location.
  *   **Elga (Thirder):** The "AWAKE" slip rules out the world where you are ASLEEP. Since you are more likely to be ASLEEP in the Heads world (10/15) than the Tails world (5/15), waking up favors Tails.
  *   **Self-Indication Assumption (SIA):** Briefly mention that this game implicitly assumes SIA (you should reason as if you are a random sample from all possible observers).

  ---

  ## Facilitator's Cheat Sheet: Predictable Problems

  | Problem | Why it happens | How to handle it |
  | :--- | :--- | :--- |
  | **"I saw how many envelopes you picked up."** | Students watch the instructor. | **Prevention:** Pick up the pre-stacked envelopes from a bag where both sets look identical. Keep the stack in your hand, not on the table. |
  | **"I talked to my neighbor."** | Curiosity overrides rules. | **Prevention:** Frame it as "If you communicate, the experiment is void and no one gets paid." Use social pressure. |
  | **Halfer Refusal to Update** | "The coin is 50/50, period." | **Response:** Accept this. Ask them to justify why their betting price ($3) differs from the break-even price ($2). Force them to articulate the *Credence vs. Decision* gap. |
  | **Confusion on "Asleep"** | "If I'm asleep, do I exist?" | **Clarification:** "Treat 'Asleep' as 'You are not offered the bet.' It simulates the times Beauty is not interviewed." |
  | **Money Anxiety** | Students don't want to lose $3. | **Mitigation:** Cap the buy-in. Or make it "Hypothetical Money" where the winner gets a $20 gift card. Real small cash is usually best for engagement, but keep it under $5 per student risk. |

  ## Why This Design?
  1.  **Inescapable Uncertainty:** Unlike a verbal description, holding the "AWAKE" slip creates a tangible indexical fact ("I am here, now, betting").
  2.  **Frequency vs. Credence:** The 5-vs-10 split hardcodes the Thirder frequency into the room. Students who bet Halfer will *lose money* in the Tails world. This makes the Dutch Book argument visceral, not abstract.
  3.  **Scalable Debrief:** The activity generates data (the bet prices) that you can analyze on the board. It moves the discussion from "What would Beauty do?" to "What did *you* do, and why?"

  ## Closing Thought for the Session
  End by asking: "If we ran this again, and I told you I would wipe your memory of this bet between rounds, would you change your price?" This bridges the gap back to the original Sleeping Beauty problem, leaving them with the unresolved tension between *rational betting* and *rational belief*.
