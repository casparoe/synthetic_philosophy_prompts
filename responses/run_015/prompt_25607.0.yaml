      *   *Wait, one logistical snag:* If I prepare the envelopes beforehand, I know which set is which. I need to ensure *I* don't bias the distribution.
      *   *Solution:* I prepare 15 envelopes. Inside each is a card.
      *   I flip the coin.
      *   If Heads: I distribute Set H (5 Awake, 10 Asleep).
      *   If Tails: I distribute Set T (10 Awake, 5 Asleep).
      *   Students don't know which Set I used.
      *   This works.

      *   *Wait, is "Asleep" the right analogy?* In SB, Beauty is always awake *in the experiment* but sometimes it's Mon, sometimes Tue.
      *   Here, "Asleep" means "You don't get to bet." This simulates "You don't exist in this branch."
      *   This is the "Self-Indication Assumption" vs "Self-Sampling Assumption" terrain.
      *   It's close enough for the pedagogical goal.

      *   *Re-evaluating the "Vertigo":* The vertigo comes from holding the "AWAKE" slip. "I am awake. Is this the 5/15 world or the 10/15 world?"
      *   This captures the *centered* uncertainty.

      *   *Debrief Plan:*
          1.  Poll prices.
          2.  Calculate expected value.
          3.  Introduce Lewis (Halfer) vs Elga (Thirder).
          4.  Show how the Envelope Ratio maps to Awakening Ratio.
          5.  Discuss the Memory Wipe limitation (Spatial vs Temporal).

