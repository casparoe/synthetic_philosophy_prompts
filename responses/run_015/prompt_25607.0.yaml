prompt: |-
  I'm teaching an upper-level undergraduate seminar called "Probability and Epistemology" — about fifteen students, mostly philosophy majors who've had at least one course in formal logic or probability, one 90-minute session per week. Next week we're tackling the Sleeping Beauty problem and self-locating belief, and I want them to feel the force of the puzzle before they see the formal arguments. I've found that when I just present the case and poll the room, the halfers and thirders talk past each other for an hour and nobody's mind moves. They need to experience the vertigo of not knowing which centered world they occupy, not just hear about it.

  Design a classroom activity — a game, a structured betting setup, a role-play, whatever works — that makes the self-locating character of Beauty's uncertainty inescapable. The students should have to act on their credences under conditions that mirror the problem: they don't know which awakening they're in, they face real (small) stakes, and the payoff structure forces them to confront the difference between betting at the start of the experiment and betting upon awakening. Ideally, the activity should surface the halfer–thirder divide naturally — different students should find themselves pulled in different directions by the logic of their own bets — and the debrief should map what happened onto the formal arguments: the Elga–Lewis dispute, the Dutch book and betting arguments, the analogy to the many-awakenings variant, and the question of whether self-locating evidence works like ordinary evidence at all.

  Be specific about rules, materials, timing, and what the facilitator says and doesn't say at each stage. Include a debrief plan that walks through the moments in the activity where the key philosophical moves show up, flags what will predictably go wrong when I run it (and how to handle it), and is honest about which feature of the Sleeping Beauty problem the activity can't fully reproduce — the memory wipe is notoriously hard to simulate in a classroom, and I want to know what you'd do about that rather than pretending it's not an issue. The activity should take a clear pedagogical line: don't just lay out a menu of options, commit to a specific design and defend why it's structured the way it is.
reasoning: |-
  Here's a thinking process that leads to the suggested classroom activity:

  1.  **Analyze the Request:**
      *   **Course:** Upper-level undergraduate seminar "Probability and Epistemology".
      *   **Students:** ~15 Philosophy majors, background in logic/probability.
      *   **Session:** 90 minutes.
      *   **Topic:** Sleeping Beauty problem, self-locating belief.
      *   **Goal:** Make students *feel* the puzzle (vertigo of self-location) before formal arguments. Avoid talking past each other.
      *   **Requirements:** Specific activity (game/betting/role-play), real stakes, mirrors the problem (uncertainty about which awakening), surfaces Halfer/Thirder divide, specific debrief plan mapping to formal arguments (Elga, Lewis, Dutch Book), address limitations (memory wipe simulation).
      *   **Constraint:** Commit to a specific design, don't just list options.

  2.  **Deconstruct the Sleeping Beauty Problem:**
      *   *Core:* Beauty sleeps. Coin toss (Heads/Tails). If Heads, wake once (Mon). If Tails, wake twice (Mon, Tue). Memory wiped between awakenings. Upon awakening, what is $P(Heads)$?
      *   *Halfer (Lewis):* $P(Heads) = 1/2$. No new relevant evidence gained upon waking.
      *   *Thirder (Elga):* $P(Heads) = 1/3$. Three equiprobable centered worlds (H-Mon, T-Mon, T-Tue).
      *   *Betting Argument:* If offered a bet every awakening, Tails leads to double the bets. To avoid sure loss (Dutch Book), you should bet as if $P(Heads) = 1/3$. But does betting frequency equal credence?
      *   *The "Vertigo":* The uncertainty isn't about the coin (metaphysical), it's about *where* in the experiment structure the agent is located.

  3.  **Brainstorming Activity Designs:**
      *   *Idea 1: Actual Sleep/Memory Wipe.* Impossible. Hypnosis is unethical/unreliable.
      *   *Idea 2: Computer Simulation.* Students play a game on laptops. Randomization happens digitally. "Memory wipe" is simulated by not showing history. *Pros:* Scalable. *Cons:* Feels abstract, lacks social pressure.
      *   *Idea 3: The "Envelope" Method.* Students are put in separate rooms. *Pros:* Physical separation. *Cons:* Logistically nightmare for 90 mins with 15 students.
      *   *Idea 4: The "Team Representative" Betting Game.* This is the strongest candidate. It externalizes the "multiple awakenings" as "multiple agents on a team."
      *   *Refining Idea 4:* Instead of memory wiping one student, we use *teams*. If the coin is Tails, the team gets two representatives. If Heads, one. The representatives don't know if they are the only one or one of two. This maps the *self-locating uncertainty* onto *team uncertainty*.

  4.  **Developing the "Team Representative" Protocol (The Chosen Design):**
      *   *Why:* It avoids the impossible memory wipe by substituting *indexical uncertainty within a group* for *temporal uncertainty within an individual*. It forces betting decisions where the payoff structure penalizes/rewards based on the coin *and* the number of agents.
      *   *Stakes:* Small cash prizes or extra credit points. Let's go with cash (e.g., $20 pot) or tangible rewards (candy/vouchers) to make it "real." Let's suggest a $30 gift card raffle or actual cash for maximum impact.
      *   *Structure:*
          1.  Setup (Coin toss logic explained, but not outcome).
          2.  Selection (Who goes into the "experiment").
          3.  The "Awakening" (Information set restriction).
          4.  The Bet (Commit to a price).
          5.  Reveal & Payoff.
      *   *Crucial Twist:* To make the Halfer/Thirder tension palpable, we need two betting rounds or a specific payout structure that highlights the frequency vs. credence distinction.
      *   *Better Twist:* Run the experiment *multiple times* (iterations) but keep the "Awakening" condition isolated per iteration. Actually, a single high-stakes round is more dramatic. Let's do one high-stakes round with a specific betting market.

      *   *Revised Design:* **"The Clone Betting Market."**
          *   Divide class into "Experiments" (groups of 3-4).
          *   One "Beauty" per group (or all participate?). Let's have *everyone* participate to avoid boredom.
          *   Actually, for 15 students, having them all be "Beauties" simultaneously is best.
          *   *Mechanism:* Each student draws a card. The "Coin" is drawn by the instructor.
          *   *Wait, the memory wipe is the hard part.* If I tell Student A "You are awake," they know they are Student A.
          *   *Solution:* **The Sealed Envelope Protocol.**
          *   All students close eyes/put heads down.
          *   Instructor flips coin.
          *   If Heads: Hand out "Awakening Slip" to 50% of class (randomly selected).
          *   If Tails: Hand out "Awakening Slip" to 100% of class.
          *   *Wait, that reveals the coin via the count of slips.*
          *   *Correction:* We need the *individual* to not know the global count.
          *   *Better:* **The "Room B" Simulation.**
          *   Select 3 volunteers. Put them in a "waiting state" (heads down, no comms).
          *   Flip coin.
          *   Heads: Wake Volunteer 1. Ask bet.
          *   Tails: Wake Volunteer 1, then put back to sleep. Wake Volunteer 2 (who thinks they might be Vol 1).
          *   *Problem:* Volunteers know they are distinct people.
          *   *Solution:* **The "Identical Agent" Abstraction.** We treat the students as *tokens* of the agent "Beauty."
          *   *Activity:* **"The Thirder's Dutch Book Casino."**
          *   We run *three* rounds of a simplified game.
          *   Round 1: Standard betting (Pre-experiment).
          *   Round 2: "Awakened" betting (Simulated).
          *   Round 3: The Reveal.
          *   *Key Mechanic:* If Tails, the student submits *two* bets (without knowing they are submitting two). If Heads, *one* bet.
          *   *How to hide the double submission?* They fill out a form. If Tails, the instructor collects two forms from them (or they fill out two identical forms).
          *   *Refinement for 90 mins:*
              1.  **Pre-Game (15 mins):** Explain rules. No coin flip yet.
              2.  **The Experiment (30 mins):** Students put heads down. Coin flipped.
                  *   Heads: Instructor taps 1/2 of students on shoulder. They open eyes, make a bet.
                  *   Tails: Instructor taps *all* students. They open eyes, make a bet.
                  *   *Wait, if Heads only 1/2 are tapped, the ones not tapped know it's Heads.*
                  *   *Fix:* **The "Blind Draw" Method.**
                  *   Every student gets an envelope.
                  *   Coin Flip (Hidden).
                  *   Heads: 50% of envelopes contain "AWAKE", 50% "ASLEEP".
                  *   Tails: 100% of envelopes contain "AWAKE".
                  *   Students open envelopes. If "ASLEEP", they sit out (no bet). If "AWAKE", they bet.
                  *   *Problem:* If I get "AWAKE", do I know the probability? If I see 15 people awake, I know it's Tails.
                  *   *Fix:* **Isolation.** Students cannot see who else is awake. They submit bets privately.
                  *   *This works.* It simulates the *centered world* uncertainty. I am awake. Are others awake? I don't know.

  5.  **Finalizing the Activity Design:**
      *   **Name:** "The Envelope Protocol."
      *   **Setup:** 15 Students. 15 Envelopes.
      *   **Coin:** Instructor flips a coin (Heads/Tails).
      *   **Distribution:**
          *   If Heads: 8 envelopes say "BET", 7 say "SKIP" (randomly distributed).
          *   If Tails: All 15 envelopes say "BET".
      *   **Information:** Students open envelopes *privately* (under desks). They do not communicate.
      *   **Task:** If "BET", they must state a buying price for a ticket that pays $10 if Coin=Heads.
      *   **Payoff:** One student is randomly selected to have their bet count for real money (to avoid wealth effects), OR all bets count (Dutch Book style). Let's go with **All Bets Count** to emphasize the Dutch Book argument.
      *   **Wait, Payoff Logic:**
          *   If Heads: Only 8 people bet. If they bet on Heads, they win.
          *   If Tails: 15 people bet. If they bet on Heads, they lose.
          *   *Crucial:* The payout must reflect the *thirder* intuition to create tension.
          *   Let's simplify. The bet is: "I bet the Coin is Heads."
          *   If Heads: Each bettor wins $X.
          *   If Tails: Each bettor loses $Y.
          *   The "Halfer" wants to bet 1:1 odds. The "Thirder" knows they are more likely to be betting in a Tails world.
      *   *Actually, the standard Dutch Book argument is:* If you bet 1:1 on Heads every time you wake up, you lose money in the long run (Tails world makes you bet twice).
      *   *Classroom version:* If Tails, the class loses money *twice as often* (because more people are betting).
      *   *Let's refine the stakes:*
          *   Ticket pays $1 if Heads.
          *   Students write down the max price they'd pay.
          *   Instructor sets a selling price (e.g., 40 cents).
          *   If "BET", they buy.
          *   Reveal Coin.
          *   Calculate total class profit/loss.
          *   *Heads:* 8 buyers. Profit = 8 * ($1 - Price).
          *   *Tails:* 15 buyers. Profit = 15 * ($0 - Price) = -15 * Price.
          *   Break-even price? $8 / 23 \approx 0.35$. (This is close to 1/3).
          *   If they price at 0.50 (Halfer), they lose heavily on Tails.
          *   This forces the Thirder calculation for *pragmatic* reasons, even if Halfer on *epistemic* reasons.

  6.  **Addressing the Memory Wipe Limitation:**
      *   Acknowledge openly: We aren't wiping memory. We are using *spatial distribution* (who got the "BET" slip) to simulate the *frequency* of awakenings.
      *   The "Vertigo" comes from opening the envelope: "I am awake. Does this mean Tails (everyone awake) or Heads (lucky draw)?"

  7.  **Drafting the Plan:**
      *   **Phase 1: Setup (15 mins).** Explain rules. Emphasize isolation.
      *   **Phase 2: The Experiment (20 mins).** Coin flip. Envelope distribution. Private decision.
      *   **Phase 3: The Market (25 mins).** Collect bets. Calculate aggregate. Discuss *why* they priced it that way.
      *   **Phase 4: Debrief (30 mins).** Map to Lewis/Elga. Dutch Book. Self-locating belief.

  8.  **Refining the Debrief:**
      *   Need to connect the "BET slip probability" to "P(Heads | Awake)".
      *   P(Awake | Heads) = 1/2 (approx, 8/15).
      *   P(Awake | Tails) = 1.
      *   P(Heads | Awake) = P(Awake | Heads)P(Heads) / P(Awake).
      *   This is Bayes' Theorem applied to self-location.
      *   Highlight the conflict: "I believe Heads is 50% (Coin)" vs "I believe I'm in a Tails world (3x more bettors)."

  9.  **Handling Predictable Issues:**
      *   *Collusion:* Students peeking. *Fix:* Strict honor code + physical barriers.
      *   *Confusion:* "Why did I get a SKIP slip?" *Fix:* Explain this represents "Still Asleep."
      *   *Halfer Pushback:* "The coin is still 50/50." *Fix:* Distinguish $P(Heads)$ from $P(Heads | I am betting)$.
      *   *Money:* Keep it small but real. $20 total pot.

  10. **Final Review against Constraints:**
      *   90 mins? Yes.
      *   15 students? Yes.
      *   Upper-level? Yes, debrief gets technical.
      *   Specific design? Yes (Envelope Protocol).
      *   Address memory wipe limitation? Yes.

  11. **Writing the Response:** (Self-Correction during drafting)
      *   Make sure the math on the envelopes is clean. 15 students.
      *   Heads: 7 BET, 8 SKIP. (Ratio ~1:2).
      *   Tails: 15 BET.
      *   Ratio of BET slips in Tails vs Heads is 15:7 (~2:1). This approximates the 2:1 awakening ratio of Sleeping Beauty.
      *   Wait, standard SB is 1 Awakening (H) vs 2 Awakenings (T).
      *   So if Heads, 1 person wakes. If Tails, 2 people wake.
      *   With 15 students:
          *   Heads: 5 students get BET.
          *   Tails: 10 students get BET.
          *   Total BET slips = 15.
          *   This ensures the *number of bettors* reflects the 1:2 ratio perfectly.
          *   *Correction:* If I prepare the envelopes *after* the coin flip, it's not blind.
          *   *Fix:* Prepare two sets of envelopes beforehand. Set A (Heads config), Set B (Tails config). Pick a set based on coin flip.
          *   *Better:* Just use the 15 students.
          *   Heads: Randomly select 5 students to be "Awake".
          *   Tails: All 10? No, need 15 students total.
          *   Let's scale: 15 students.
          *   Heads: 5 Awake, 10 Asleep.
          *   Tails: 10 Awake, 5 Asleep? No, Tails should be *more* awakenings.
          *   Standard SB: H=1 wake, T=2 wakes. Total wakes = 3. P(H|Wake) = 1/3.
          *   Class SB: H=5 wakes, T=10 wakes. Total wakes = 15.
          *   So: Prepare 15 Envelopes.
          *   **Heads Scenario:** 5 say "AWAKE", 10 say "ASLEEP".
          *   **Tails Scenario:** 10 say "AWAKE", 5 say "ASLEEP".
          *   *Wait, this changes the prior.* P(Heads) is still 0.5.
          *   P(Awake | Heads) = 5/15 = 1/3.
          *   P(Awake | Tails) = 10/15 = 2/3.
          *   P(Heads | Awake) = (1/2 * 1/3) / (1/2 * 1/3 + 1/2 * 2/3) = (1/6) / (3/6) = 1/3.
          *   *Perfect.* This mathematically replicates the Thirder result via Bayes.
          *   *Halfer Challenge:* The Halfer says "The coin is 50/50, the envelope selection is irrelevant to the coin."
