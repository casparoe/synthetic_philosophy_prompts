answer: |-
  # Q&A Prep Sheet: The Expressive Duty of Ranked-Choice Voting

  **Context:** Final-year seminar, Democratic Theory.
  **Audience:** Social Choice Theorists (SCT), Democratic Theorists (DT), Constitutional Lawyer (CL).
  **Goal:** Defend the normative claim that ranking is a duty of boundary-setting, distinct from instrumental efficacy.

  ## I. Opening Concessions (Defuse the Room)
  *Start your Q&A session by explicitly conceding the following two points. This prevents the SCTs from spending their airtime on objections you already accept.*

  1.  **Concede Causal Inefficacy:** "I agree that in a large electorate, a single ballot's causal impact on the winner is negligible. My argument does not rest on instrumental efficacy."
  2.  **Concede Strategic Rationality:** "I agree that under standard decision theory, bullet voting for the moderate is often the utility-maximizing strategy to prevent the extreme's victory. I am not arguing that ranking is *strategically* superior."

  **Why:** This isolates the debate to the *normative/expressive* claim. If you don't concede this, the SCTs will treat your thesis as a mistake in game theory rather than a claim in political philosophy.

  ---

  ## II. The Eight Objections (Ordered by Damage)

  ### 1. The Semantic Gap (The "Hidden Assumption" Objection)
  **Objector:** Social Choice Theorist / Democratic Theorist
  **Objection:** "You assume a ranking communicates a judgment about *legitimacy*, but the formal language of social choice treats rankings as *ordinal preferences*. $A > B$ means 'I prefer A to B,' not 'A is legitimate and B is not.' Unless you can prove the ballot syntax carries normative weight, you are smuggling a moral claim into a mathematical function. You are conflating *preference* with *endorsement*."
  **Reply (2 mins):** "That is the central hinge of the thesis. I concede that mathematically, a ranking is ordinal. However, ballots are not private math problems; they are public legal records. When a voter ranks a candidate last in a public record, specifically in a 'lesser-evil' context, the *act* of ranking (vs. abstaining or bullet voting) signals that the candidate is within the set of governable options, even if disliked. The duty arises not from the syntax, but from the *context of submission*. By refusing to rank the extreme, I signal they are outside the boundary. By ranking them last, I signal they are inside but unacceptable. This distinction creates the 'shared public record' I mention. If we treat ballots solely as preference orderings, we ignore their function as historical documents of public consent."
  **Weakness:** This relies on a sociological claim about how ballots are interpreted that may not exist. If the public sees ballots only as counting tools, the "communication" fails.
  **Status:** **CRITICAL.** This is the reply that *must* land. If rankings are purely ordinal preferences, your normative duty collapses.

  ### 2. The "Cheap Talk" Objection (Causal Inefficacy)
  **Objector:** Social Choice Theorist
  **Objection:** "Even if your semantic claim holds, why is there a *duty*? Expressive voting is usually defended as a right to express oneself, not an obligation. If your vote doesn't change the outcome and doesn't change the aggregate record significantly (due to noise), this is 'cheap talk.' Duties require stakes. Where is the harm in bullet voting?"
  **Reply (2 mins):** "The harm is to the *integrity of the boundary*, not the outcome. Think of it like a jury verdict. A single juror's vote might not hang the jury, but they have a duty to vote their conscience rather than strategically acquit to end the trial. Similarly, the 'public record' of legitimacy is built by the sum of individual acts. If everyone bullet votes, the record shows a polarized electorate tolerating the extreme only instrumentally. If everyone ranks, the record shows a consensus on the *limits* of authority. The duty is to the institution's self-conception, not the immediate output."
  **Weakness:** The jury analogy is imperfect because jury votes are deliberative and small-number; elections are aggregate and large-number.
  **Status:** High Damage. SCTs reject duties without consequences.

  ### 3. Aggregation Neutrality (Arrow-Style)
  **Objector:** Social Choice Theorist
  **Objection:** "Social choice functions are designed to be neutral regarding the *content* of preferences. By imposing a duty to rank based on the *moral status* of the candidates (moderate vs. extreme), you are violating the neutrality of the aggregation mechanism. You are asking voters to optimize for a normative outcome, not reveal true preferences. This corrupts the data."
  **Reply (2 mins):** "I am not asking voters to misrepresent preferences; I am asking them to *complete* the revelation of their normative boundaries. Arrow's theorem assumes fixed preferences. My argument is about the *formation* of the input. If a voter believes the Extreme is illegitimate, their 'true preference' is not just 'Moderate > Extreme,' it is 'Moderate > Extreme, but Extreme is out of bounds.' A complete ranking captures more information about the voter's stance on the political space than a bullet vote. It enriches the data, not corrupts it."
  **Weakness:** Technically, RCV tabulation ignores the "why." The machine counts the rank, not the moral boundary.
  **Status:** Medium-High Damage. Threatens the technical coherence of the argument.

  ### 4. Legal Intent & Ballot Design
  **Objector:** Constitutional Lawyer
  **Objection:** "Courts interpret ballots based on voter intent regarding *selection*, not *expression*. If a dispute arises, a judge looks at who the voter chose, not what moral boundary they drew. By arguing for a duty to rank, you are redefining the ballot as political speech. Legally, this creates ambiguity. If I rank a candidate last, does that mean I accept their victory? Your theory creates legal uncertainty."
  **Reply (2 mins):** "I am not arguing for a change in legal statute, but for a civic norm. However, legally, ranked ballots *are* already interpreted as conditional consent. In RCV, ranking a candidate indicates you accept them as a valid alternative if your first choice fails. My argument aligns with existing legal interpretation: a ranking *is* a statement of acceptability. The duty I propose simply asks voters to be honest about that acceptability threshold rather than withholding it for strategy."
  **Weakness:** Legal precedent focuses on tabulation rules, not civic virtue. A lawyer can easily show case law where 'intent' is strictly 'who wins.'
  **Status:** Medium Damage. Specific to the Lawyer, but important for institutional feasibility.

  ### 5. Expressive Corruption (Civic Virtue)
  **Objector:** Democratic Theorist
  **Objection:** "Expressive voting is valuable because it is authentic. Turning expression into a *duty* corrupts the virtue. If I rank because I *must* to satisfy a normative boundary, am I not just performing virtue signaling? Authentic civic virtue requires the freedom to withhold expression. You are mandating sincerity."
  **Reply (2 mins):** "There is a distinction between mandating *what* to express and mandating *that* one participates in the boundary-setting practice. I am not telling voters which candidates to rank high. I am telling them that if they participate, they have a duty to define the boundary of the game. Silence (bullet voting) in a ranked system is an ambiguous signal. Clarity is a public good. The duty is to be legible to one's fellow citizens, not to perform virtue."
  **Weakness:** Risks sounding paternalistic. Democratic theorists value autonomy highly.
  **Status:** Medium Damage.

  ### 6. The Strategic Hazard (RCV Mechanics)
  **Objector:** Social Choice Theorist
  **Objection:** "In some RCV configurations, ranking a 'lesser evil' lower can actually help the 'extreme' win via vote transfers (the center-squeeze effect). If your duty leads voters to rank in a way that inadvertently elects the candidate they deem illegitimate, haven't they failed the normative goal? A duty that increases the risk of the 'unacceptable' outcome is irresponsible."
  **Reply (2 mins):** "That is a risk of any non-strategic voting. However, the 'duty' is conditional on the ranking not altering the *instrumental* block of the extreme. If ranking the extreme last causes them to win over the moderate, the instrumental duty to block them overrides the expressive duty. My thesis allows for the 'conditional' override. But in most stable equilibria, ranking the extreme last does not cause them to win; it merely ensures they don't win *by default* due to lack of opposition data."
  **Weakness:** This concedes that the expressive duty is secondary to the instrumental outcome, which weakens the "duty" claim.
  **Status:** Medium-Low Damage. Technical nuance.

  ### 7. Epistemic Burden
  **Objector:** Democratic Theorist / SCT
  **Objection:** "You are imposing a high information cost. To rank responsibly, a voter must understand the full field to know where the 'boundary' lies. Bullet voting is low-cost. Imposing a duty to rank disproportionately burdens less informed voters, creating an inequity in civic obligation."
  **Reply (2 mins):** "The duty is to rank *according to one's own judgment*, not an objective truth. Even an uninformed voter knows their own threshold of tolerance. The burden is not on knowing the policy details of every candidate, but on knowing one's own limit of acceptability. The ballot asks 'Who can you tolerate?' not 'Who is the best policy expert?'"
  **Weakness:** In complex fields with many unknown candidates, voters may not know who is 'extreme' vs 'moderate.'
  **Status:** Low-Medium Damage. Practical concern.

  ### 8. Subjectivity of the "Extreme"
  **Objector:** Democratic Theorist
  **Objection:** "Your thesis relies on a 'clear lesser-evil dynamic.' But who defines the extreme? One voter's extremist is another's populist. If the duty relies on a subjective classification, it cannot be a universal duty. It fragments the public record rather than unifying it."
  **Reply (2 mins):** "The duty is subjective but the *structure* is public. I am not arguing there is an objective 'Extreme.' I am arguing that *if* a voter perceives a candidate as beyond the pale of legitimacy, they have a duty to signal that via ranking (last place) rather than omission. The public record becomes a map of *contested* boundaries, which is more democratic than a record that hides those boundaries via bullet voting."
  **Weakness:** Makes the "shared public record" fragmented and potentially incoherent.
  **Status:** Low Damage.

  ---

  ## III. Strategic Advice for the Session

  ### The Single Reply That Must Land
  **Objection #1 (The Semantic Gap).**
  If you cannot convince the room that a ballot ranking carries *more* meaning than a mathematical ordinal utility (i.e., that it functions as a statement of legitimacy), the rest of the thesis is moot.
  *   **Preparation:** Have a concrete example ready. *Example:* "In 1932 Germany, a ballot for Hindenburg was a preference. A refusal to rank Hitler was a boundary. In RCV, ranking Hitler last is the modern equivalent of that boundary. It records 'He may govern, but he is the limit.'"

  ### Where to Concede Ground
  *   **To the SCTs:** Concede that if the expressive signal is completely drowned out by noise (e.g., low turnout, high spoilage), the duty weakens. You rely on a threshold of legibility.
  *   **To the Lawyer:** Concede that this is a *civic norm*, not a *legal mandate*. You are not arguing for laws forcing people to rank, but for a moral obligation in the booth.

  ### Handling the "Hidden Assumption" (Objection #1)
  *   **Do not get defensive.** This is the strongest critique.
  *   **Pivot:** Move from "what the ballot *is*" (math) to "what the ballot *does*" (social practice).
  *   **Key Phrase:** "We are discussing the *practice* of voting, not just the *tabulation* of votes."

  ### Final Note on Tone
  Your audience is skeptical of "duties" in voting. Do not frame this as a "Moral Imperative" in a Kantian sense. Frame it as a **Functional Requirement of Democratic Legibility**. You are arguing that for the system to know its own boundaries, voters must draw them. This appeals to the SCTs' desire for clear data and the DTs' desire for civic engagement.
