answer: |-
  **1. The Three-Way Clash**
  **Question:** You've got this clash where three things can't all be true: that "if" sentences are claims that can be true or false, that my confidence in "if A then B" is just my confidence in B given A, and that the standard rules of probability hold. You can't keep all three. Which one are you dropping? And why is dropping that one better than keeping the "true or false" idea and just saying the confidence rule only works in special cases—like when the if-part doesn't affect the then-part?
  **Follow-up:** If you say we keep the true-or-false idea but restrict the rule, doesn't that make the rule look like a lucky accident rather than something central to what "if" means?

  **2. Nesting "Ifs"**
  **Question:** If "if A then B" isn't a claim that can be true or false, what am I even doing when I put one inside another, like "if A, then if B then C"? I expect you'll say I'm just supposing A, and then supposing B inside that. But there's a logic rule that lets you swap those around—"if A and B then C" should match "if A then if B then C". On your view, does that swap still work?
  **Follow-up:** If it does work, is it valid for the reason we thought, or valid for some other reason nobody signed up for?

  **3. Does It Prove Too Much?**
  **Question:** Can I run this same maths trick on other sentences, like "it will probably rain" or even "A or B"? It seems like it could show those don't have truth conditions either. If you say conditionals are special and those aren't, what's supposed to be the difference?
  **Follow-up:** If there is a difference, why doesn't the same maths problem break those sentences too?

  **4. The Betting Angle**
  **Question:** Think about a bet. I pay you a pound on B, but if A doesn't happen, the bet's off and I get my money back. My fair price looks exactly like my confidence in B given A. Doesn't that look like the equation is getting its grip from something real, like a claim that can be true or false? I expect you'll say the bet doesn't need a claim to be settled. But does that betting story actually prove the equation, or does it just look like it?
  **Follow-up:** If it only looks like it, where exactly does the betting story stop matching the maths?

  **5. What Would Change Your Mind?**
  **Question:** Suppose it turned out that across a big class of ordinary cases, people's confidence in "if A then B" tracks their confidence in "A and B" together rather than their confidence in B given A. Is that evidence you're wrong about what the sentence means, or just evidence that people are bad at judging probabilities?
  **Follow-up:** How do you tell the difference between "wrong about meaning" and "meaning is different"?

  **6. The Nature of Disagreement**
  **Question:** If conditionals don't state anything true or false, what's going on when one person says "if A then B" and another says "if A then not B"? What's the disagreement about?
  **Follow-up:** Is that disagreement the same kind of thing as a disagreement about whether it will rain, or something else entirely?
