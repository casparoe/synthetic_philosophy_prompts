  7.  **Final Polish:** Check tone. Ensure it's helpful for a writer (plot points, dialogue ideas) not just a philosophy lecture. (The prompt asks for "strongest reply" and "where it cracks," so balance theory with application).

  8.  **Final Review against constraints:**
