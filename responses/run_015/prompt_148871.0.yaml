answer: |-
  First off: your adviser is wrong. You are not overthinking this. The tension between the *jurisdictional* reading (authority over life/death) and the *causal/intentional* reading (means vs. side-effect) in Aquinas is one of the most contested interpretive issues in contemporary natural law theory. It is the exact hinge on which modern DDE applications turn, and Aquinas's text in *Summa Theologiae* II-II, q. 64, a. 7 is notoriously compressed.

  Here is a breakdown of the text, the manualist gloss you found, and how to apply this to the Fat Man case for your dissertation.

  ### 1. Exegesis: What Aquinas Actually Says (ST II-II, q. 64, a. 7)
  Aquinas gives three conditions for permissible killing in self-defense:
  1.  **The Act:** The act itself must be conducive to self-preservation (it is natural to preserve one's life).
  2.  **The Intention:** The death of the aggressor must be *praeter intentionem* (outside the intention). You intend to save yourself; the death is a side effect.
  3.  **The Proportionality:** One must not use "more violence than necessary" (*moderamen inculpatae tutelae*).

  **The Authority Comparison:**
  Aquinas introduces the public authority comparison to explain *why* the intention matters. A public official can intend the death of a criminal because they act for the *common good* (*bonum commune*). A private individual acts only for *self-preservation*. Therefore, a private individual cannot *intend* death, because they do not have jurisdiction over the common good, only over their own life.

  ### 2. Is Proportionality Mental or Causal?
  You asked if proportionality is a mental-state constraint or a causal-structure constraint.

  **It is primarily a constraint on the act (causal/physical), which serves as evidence for the mental state.**
  When Aquinas says "if one uses more violence than necessary, it will be unlawful," he is talking about the physical force employed. If you shoot an unarmed thief in the back, the physical act is disproportionate.
  *   **Why?** Because if you use excessive force, it implies you *intended* the harm rather than merely repelling the threat.
  *   **Dissertation Angle:** You can argue that proportionality is the **objective bridge** between the internal intention and the external act. It prevents the agent from claiming "I didn't intend death" while performing an act that could only rationally be chosen if death were intended.

  ### 3. The "Modal Robustness" Reading (The 1920s Manual)
  The reading you found (that you must survive even in nearby worlds where the aggressor doesn't die) is **not in Aquinas**. This is a **Manualist gloss**.

  In the late 19th and early 20th centuries, moral theologians (like Prümmer, Noldin, or Garrigou-Lagrange) tried to turn Aquinas's principles into codified law for confessors. They developed the concept of *moderamen inculpatae tutelae* into strict conditions.
  *   **The Logic:** They argued that if your survival *depends* on the aggressor's death, then you effectively intend the death. Therefore, for the death to be truly unintended, your survival must be causally separable from their death.
  *   **Verdict:** This is a coherent development of Aquinas, but it is not exegesis. It is an attempt to solve the very problem you are stuck on: how to distinguish "stopping the attack" from "killing the attacker."
  *   **Use in Dissertation:** Cite this as a **scholastic development** that clarifies the causal structure, but do not attribute it to Aquinas directly. It helps explain *why* the Fat Man case fails (your survival depends on his death), but Aquinas himself doesn't use possible worlds semantics.

  ### 4. The Fat Man: Authority vs. Causal Structure
  This is the core of your chapter. In the Fat Man case, you push an innocent bystander to stop the trolley. Why is it wrong according to Aquinas?

  **Argument A: The Causal/Intentional Constraint**
  In self-defense, the causal chain is: *I block the blow -> Aggressor dies (unintended).*
  In Fat Man, the causal chain is: *I push Man -> Man blocks trolley -> Man dies (intended/means).*
  *   **Problem:** In Fat Man, the man's body is the mechanism. His impact (and likely death) is the means to stop the train. Aquinas forbids intending evil (death) even for a good end.
  *   **Verdict:** This makes it wrong because the death is a **means**, not a side-effect.

  **Argument B: The Authority/Jurisdiction Constraint**
  Aquinas explicitly says private individuals cannot kill for the *common good*.
  *   **Self-Defense:** Justified because it is private preservation of self.
  *   **Fat Man/Trolley:** Justified (by utilitarians) because it saves five lives (common good).
  *   **Verdict:** Since you are a private individual, you lack the jurisdiction to sacrifice one for the many. Only public authority can weigh the *bonum commune* in that way (like executing a criminal or potentially just war).

  **Which one decides it?**
  It is **both**, but they operate at different levels.
  1.  **Authority** rules out the *justification of the end*. You cannot kill the Fat Man to save the five, because you aren't the state.
  2.  **Causal Structure** rules out the *justification of the means*. Even if you were the state, you generally cannot use an innocent person as a means (Aquinas distinguishes criminals from innocents).

  **How Proportionality Helps Decide:**
  The proportionality clause actually supports the **Causal/Intentional** reading over the Authority reading in this specific context.
  *   If the wrongness were *only* about authority, then if you *were* the state, you could push the Fat Man (just like you can execute a criminal).
  *   But Aquinas holds that even public authority cannot directly intend the death of the *innocent*.
  *   Therefore, the **inviolability of the innocent** (causal structure/intention) is the deeper constraint. The authority clause explains why you can't kill *aggressors* for the common good as a private citizen; the intention clause explains why you can't kill *anyone* (aggressor or innocent) as a means.

  ### 5. A Path Forward for Your Chapter
  Your adviser thinks you're overthinking it because they likely view DDE as a settled "formula." But you are correctly identifying that Aquinas provides a **metaphysical framework**, not a flowchart.

  **Suggested Structure for the Argument:**
  1.  **Distinguish the Cases:** Clarify that Aquinas's text is about *unjust aggressors*, whereas the Fat Man is an *innocent threat/bystander*. This immediately weakens the Self-Defense analogy.
  2.  **The Two Barriers:** Argue that Aquinas places two barriers in the way of the Trolley intuition:
      *   **Jurisdictional:** Private agents cannot act on utilitarian calculus (common good).
      *   **Structural:** No agent (private or public) can intend the death of an innocent as a means.
  3.  **Re-evaluating Proportionality:** Argue that the "Modal Robustness" reading (from the manualists) is a useful heuristic for the **Structural** barrier. It formalizes the idea that the good effect (survival) must not be *causally dependent* on the bad effect (death).
  4.  **Conclusion:** The wrongness of the Fat Man case in an Aquinas framework is primarily about the **Causal Structure** (using a human as a means), which is forbidden regardless of authority. The Authority clause is secondary, explaining why we can't even appeal to the "greater good" to excuse the structural violation.

  **Summary for your draft:**
  Don't let the adviser dismiss this. The tension between *who* is killing (authority) and *how* they are killing (causal structure) is the most fertile ground in your chapter. Aquinas's text supports the view that **proportionality is an objective constraint on the act** that safeguards the **intention**, and that **authority permits the intention of death only against guilty aggressors**, never against innocents used as means.

  If you frame the "Modal Robustness" not as Aquinas's words but as a **necessary condition implied by his prohibition on intending death**, you can use that 1920s manual to strengthen your analysis of the causal structure without committing anachronism.
