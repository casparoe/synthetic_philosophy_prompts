answer: |-
  Here is a functional appraisal procedure designed for your constraints: solo archivist, high volume, full shelves, volunteer board oversight, and no outreach budget. It converts theoretical concepts into binary checks and weighted scoring.

  ### The Half-Day Appraisal Protocol

  **Time Budget:** 3.5 hours per offer.
  **Output:** One-page justification (Accept/Decline/Defer).
  **Goal:** Minimize liability and storage while maximizing evidentiary diversity.

  #### Phase 1: The Hard Stops (30 Minutes)
  *These are factual tests. If the offer fails here, the procedure stops. No board vote needed.*

  1.  **Legal Compliance Test:** Does the material contain PII (Personally Identifiable Information) protected by state/federal law (e.g., SSNs, medical, active juvenile records)?
      *   *Pass:* No PII or PII is redactable.
      *   *Fail:* PII present and redaction is resource-prohibitive. **-> DECLINE.**
  2.  **Retention Schedule Test:** Is this a government record covered by a state retention schedule?
      *   *Yes:* Does it meet the minimum retention period? Is it the official copy?
      *   *No:* It is a personal/community donation. Proceed to Phase 2.
      *   *Fail:* Record is eligible for destruction per schedule. **-> DECLINE (or offer destruction service).**
  3.  **Capacity Test:** Do we have physical shelf space for the *entirety* of the offer without weeding other collections?
      *   *Fail:* No space. **-> DECLINE.** (Do not accept "we'll weed later." Weeding is labor you do not have.)

  #### Phase 2: The Gap Analysis (45 Minutes)
  *This addresses your first request: distinguishing types of silence. This is a **Judgment Call** supported by facts.*

  Consult your existing holdings and a quick search of regional union catalogs. Categorize the silence this offer fills:

  *   **Type A: Structural Silence (Never Created).** The activity happened, but no record was made (e.g., oral culture, informal labor).
      *   *Action:* If this offer documents a Type A gap (e.g., physical photos of an oral community), **Priority High.**
  *   **Type B: Archival Silence (Destroyed/Weeded).** Records existed but were lost due to negligence, disaster, or policy.
      *   *Action:* If this offer is a rare survivor of Type B, **Priority Medium.**
  *   **Type C: Dispersed Silence (Exists Elsewhere).** Records exist but are held by another institution or private party.
      *   *Action:* If we already hold similar records, or a larger institution holds the master, **Priority Low.**

  #### Phase 3: The Gradient Correction (60 Minutes)
  *This addresses your second request: the "paper-trail gradient." This is a **Weighted Value Judgment**.*

  **The Rule:** Volume $\neq$ Value. Volume often equals Administrative Burden.
  Apply the **Administrative Burden Score (ABS)** to the *creator* of the records:

  *   **ABS 1 (High Administration):** The creator was heavily regulated/surveilled by the state (e.g., prisoners, public housing tenants, licensees).
      *   *Correction:* **Downweight.** The state already generated massive files on them. We do not need more state-surveillance data unless it is the *only* copy.
  *   **ABS 2 (Low Administration):** The creator was self-organized, informal, or marginalized with little state interaction (e.g., community clubs, informal mutual aid, marginalized neighborhoods).
      *   *Correction:* **Upweight.** Scarcity is natural here. Accept smaller, fragmentary collections to build a critical mass.

  **Decision Matrix:**
  *   High Volume + ABS 1 = **Decline** (unless unique content).
  *   Low Volume + ABS 2 = **Accept** (even if fragmentary).
  *   High Volume + ABS 2 = **Accept** (Rare find).
  *   Low Volume + ABS 1 = **Review** (Is it the "human" side of the admin record?).

  #### Phase 4: Risk & Ethics (45 Minutes)
  *This is where you identify harm. This is a **Judgment Call**.*

  1.  **Surveillance Check:** Does accepting this collection make the archive a repository of state surveillance on vulnerable people?
  2.  **Consent Proxy:** Since you cannot do outreach, can you reasonably assume consent?
      *   *Test:* Was this material created for public consumption (flyers, newsletters) or private administration (case files, mugshots)?
      *   *Fail:* Private administration data on vulnerable subjects without consent. **-> DECLINE.** (See Scenario C).

  #### Phase 5: The One-Page Justification (60 Minutes)
  *Draft the text for the board. Use this template:*

  *   **Decision:** [Accept/Decline]
  *   **Factual Basis:** [Retention status, PII status, Space availability].
  *   **Evidentiary Value:** [Gap Type A/B/C].
  *   **Community Representation:** [ABS Score and Gradient Correction applied].
  *   **Risk Assessment:** [Surveillance/Privacy risks].

  ---

  ### Application to Current Cycle Offers

  Here is how the procedure runs on your three specific offers.

  #### (a) Housing Dept Tenant Complaint Files (30 lin. ft., 1978–2015)
  *   **Phase 1 (Hard Stops):**
      *   Legal: **FAIL.** Contains names, addresses, unit numbers. This is PII. Redacting 30 linear feet is impossible within budget.
      *   Retention: Likely covered by state schedule. If the retention period (e.g., 5 years post-lease) has passed, they are eligible for destruction.
  *   **Phase 2 (Gaps):** Type C (Dispersed). The Housing Department likely retains the official master files. These are likely working copies.
  *   **Phase 3 (Gradient):** ABS 1 (High Administration). Tenants were administered by the city. High volume is expected.
  *   **Phase 4 (Risk):** High. Storing tenant complaints creates a liability risk for the city and a privacy risk for tenants.
  *   **Decision:** **DECLINE.**
  *   **Justification:** "Records contain protected PII requiring resource-prohibitive redaction. Duplicate of official department holdings eligible for destruction per State Schedule [X]. High administrative burden volume does not fill evidentiary gap."

  #### (b) Tenants Association Papers (1 box, Flyers/Notes/Member List)
  *   **Phase 1 (Hard Stops):**
      *   Legal: **PASS.** Membership list needs review, but generally association records are not PII-protected in the same way as government files.
      *   Capacity: **PASS.** 1 box fits.
  *   **Phase 2 (Gaps):** Type A (Structural Silence). This documents resident agency, which is rarely recorded in official city files.
  *   **Phase 3 (Gradient):** ABS 2 (Low Administration). Self-organized group. Low volume is typical. Procedure dictates **Upweight**.
  *   **Phase 4 (Risk):** Low. Created for public/semi-public consumption (flyers).
  *   **Decision:** **ACCEPT.**
  *   **Justification:** "Unique documentation of resident agency countering administrative record. Fills Structural Silence (Type A). Low Administrative Burden Score (ABS 2) warrants acquisition despite small volume. Complements but does not duplicate Housing Dept records."

  #### (c) Sheriff Arrest Ledgers & Mugshots (Demolished Neighborhood, 1970s)
  *   **Phase 1 (Hard Stops):**
      *   Legal: **PASS/FAIL.** Mugshots are often public record, but privacy laws regarding arrest data vary by state. If expungement laws apply retroactively, this is a **FAIL**. Assume Pass for this exercise, but flag it.
      *   Capacity: **PASS.**
  *   **Phase 2 (Gaps):** Type B (Archival Silence). The neighborhood is gone; physical traces are gone. This is the *only* documentary trace of these individuals.
  *   **Phase 3 (Gradient):** ABS 1 (High Administration). These are pure surveillance records. The volume exists *because* of policing, not because of community life.
  *   **Phase 4 (Risk):** **CRITICAL FAIL.**
      *   *Surveillance Check:* This is a repository of criminalization.
      *   *Consent Proxy:* **FAIL.** Mugshots are not created for public consumption; they are created for state control. The subjects (or descendants) cannot be asked for consent (no outreach budget).
  *   **Decision:** **DECLINE.**
  *   **Justification:** "While historically unique (Type B Gap), collection consists entirely of state surveillance data on vulnerable subjects. Without budget for community consultation/consent, acquisition poses ethical risk of perpetuating criminalizing narratives of a demolished community. Lacks evidence of community agency."

  ---

  ### The Unpleasant Truth About (c)

  You said you wouldn't like what the procedure says about (c). Here it is plainly:

  **By declining (c), you are participating in the erasure of the neighborhood.**
  **By accepting (c), you are participating in the criminalization of the neighborhood.**

  Because you have no budget for outreach, you cannot mitigate the harm of acceptance. You cannot ask the descendants if they want their grandparents' mugshots preserved as "history" or if they view it as a stain. Therefore, the procedure forces a **Decline**.

  This is the limit of the archive as an institution. We are risk-averse by design. We prioritize "Do No Harm" over "Save Everything." In this specific case, "Do No Harm" looks like silence. The procedure admits that without community partnership, some histories are too dangerous for the archive to hold safely.

  ### What This Procedure Cannot Do

  1.  **It cannot determine Community Want.**
      *   *Limitation:* The procedure assumes "Low Administration" (ABS 2) equals "Community Value." It does not. A tenants association might be unpopular or unrepresentative. Only asking them tells you that.
      *   *Workaround:* In your 1-page justification, add a line: *"Community sentiment unknown due to outreach constraints."* This puts the risk on the Board, not just you.

  2.  **It cannot fix the Power Imbalance.**
      *   *Limitation:* You are still the gatekeeper. You are deciding that the Tenants Association (b) is "good" and the Sheriff (c) is "bad." That is your value judgment, dressed up as an "Ethics Check."
      *   *Workaround:* Acknowledge this in your manual. "The archivist's positionality influences Gap Analysis."

  3.  **It cannot create space.**
      *   *Limitation:* If you get ten offers like (b), you still run out of shelves.
      *   *Workaround:* The procedure needs a **Deaccessioning Trigger**. If you accept (b), you must identify 1 box of low-value material elsewhere to weed. The procedure should require a "Swap Sheet" attached to every Acceptance justification.

  ### Summary of Tests vs. Judgments

  | Step | Type | Criteria |
  | :--- | :--- | :--- |
  | **Legal/PII** | **Genuine Test** | Yes/No. If Yes (PII present), Stop. |
  | **Retention** | **Genuine Test** | Match against State Schedule. |
  | **Space** | **Genuine Test** | Measure linear feet vs. Empty Shelf. |
  | **Gap Type** | **Judgment** | Requires research/interpretation of "silence." |
  | **ABS Score** | **Judgment** | Requires assessing "administration" vs "agency." |
  | **Consent Proxy** | **Judgment** | Requires assessing "public" vs "private" intent. |

  This protocol allows you to defend your decisions to the board using their language (risk, space, rules) while embedding the theoretical corrections (gradient, silence) into the scoring logic. It protects you from liability on (c) while acknowledging the loss.
