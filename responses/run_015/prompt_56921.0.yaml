  I reject step (5) because it incorrectly applies the mathematics of repeated betting to one-shot scenarios where variance cannot be averaged away over time.

  The Kelly Criterion relies on the Law of Large Numbers to ensure that your actual returns converge to the expected growth rate over many trials. In your Sunday case, the bet is repeated, so the volatility smooths out and the arithmetic holds. In your aunt's case, the bet was a one-shot wager on college savings; there is no "long run" to recover from a loss, so the growth-optimal stake for a repeated game is not necessarily the rational stake for a single, irreversible risk. This step looked acceptable because mathematical optimality often feels universal; if a formula produces the best result in one context, intuition suggests it should dictate the "correct" number in all contexts, especially when the edge (55 percent) remains the same.

  To keep steps (2) and (3), you must pay the price of abandoning step (6) and the idea of a single universal theory of rational betting. You have to accept that rationality depends on the structure of the bet (repeated versus one-off) and the utility of the money at risk, meaning your aunt was not irrational for betting less on a life-altering wager even if you are rational for betting Kelly on a repeatable Sunday game. You also surrender the claim in step (4) that risk tolerance is irrelevant, because choosing a stake for a one-shot bet inherently involves weighing the pain of loss against the gain, whereas repeated Kelly betting essentially outsources that preference to the mathematics of compounding.

  By cutting this link, you preserve the validity of the Kelly Criterion for your uncle's repeated offer while dissolving the contradiction with your aunt's experience. Steps (2) and (3) remain intact because they are strictly confined to the repeated bet scenario where the growth-rate arithmetic actually applies, allowing you to stake 10 percent on Sundays without being forced to claim your aunt was irrational or that long-run growth is a false standard.
