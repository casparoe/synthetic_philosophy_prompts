      *Actually, let's add "Secret Agendas" to the rules to guarantee the problem manifests.*
      *   Give 2 students a "Hardline" card: They MUST veto or they get negative points. This ensures at least some friction.
      *   No, better to rely on the math. If the math dictates vetoing, friendship shouldn't override it if they want to win. But high schoolers might share candy.
      *   Fix: Make the payoff individual candy they keep vs. a class prize. Or just acknowledge in "Predicted Mess Up" that social cohesion might solve it too easily, and suggest adding "Transaction Fees" (tax) on trades to simulate real-world friction.

