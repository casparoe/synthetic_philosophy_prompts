      *   Experience before name? Yes, reveal "Anticommons" at the end.
      *   JSON format? Yes.

  8.  **Final Polish of Activity Rules:**
      *   Name: "The Permit Puzzle."
      *   Setup: 8 Permits needed to unlock a box of 80 candies.
      *   Incentive: Each player holds 1 Permit. Each player also holds a "Private Coupon" worth 12 candies if they *do not* submit their permit.
      *   Math: 80/8 = 10 candies each if successful. 12 candies if they veto.
      *   Result: Rational actors veto. Resource goes unused.
      *   Round 2: Allow trading. Can I buy your permit? If I pay you 11 candies from my share... wait, I only get 10. I can't afford to buy you out. This creates the gridlock.
      *   This is perfect. It shows that even with negotiation, the math prevents success because the private value > shared individual value.

      *Wait, 45 minutes is tight.*
      *   5 min Intro.
      *   10 min Round 1 (Silent vote).
      *   10 min Round 2 (Negotiation).
      *   20 min Debrief.
      *   Total 45.

      *Let's make sure the "Private Coupon" logic holds.*
      *   If I veto, I get 12. The group gets 0.
      *   If I agree, I get 10 (assuming equal split).
      *   I will veto.
      *   Can others bribe me? They only have 10 each. They can't give me 12 without going negative.
      *   This creates the "holdout" problem structurally.

      *Wait, one nuance:* In anticommons, the *total* value of the resource is higher than the sum of private values, but fragmentation prevents capture.
      *   Total Shared: 80.
      *   Sum of Private: 8 * 12 = 96.
      *   Oops, if Sum of Private > Total Shared, it's not inefficient to veto.
      *   Need: Total Shared > Sum of Private, but Individual Share < Individual Private.
      *   Total Shared: 100 candies.
      *   Individual Share: 12.5 (round to 12).
      *   Private Veto Value: 15 candies.
      *   Sum of Private: 8 * 15 = 120.
      *   Still inefficient to build? No, 100 < 120. So vetoing is efficient globally? No, Anticommons is when the resource is *valuable* but goes unused.
      *   Correct Anticommons Math: Total Shared Value (100) > Sum of Private Values (8 * 10 = 80). BUT Individual Share (12.5) < Individual Private Value (15).
      *   So: Pot = 100. Private Veto = 15.
      *   Global Optimum: Build (100 > 80).
      *   Individual Rationality: Veto (15 > 12.5).
      *   This creates the tragedy. The group loses 20 value units because of fragmentation.

      *Let's finalize numbers:*
      *   Pot: 100 points.
      *   Private Veto Bonus: 14 points.
      *   Share per person: 12 points (rounding down for simplicity).
      *   This ensures the math works for the lesson.

  9.  **Writing the Response:**
      *   Tone: Engaging, clear, facilitator-focused.
