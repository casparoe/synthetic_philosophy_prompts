      *   **Core Analogy:** Two superrational agents $\approx$ Two instances of the same algorithm on separate chips.
      *   **Task:** Audit this analogy.
      *   **Specific Questions:**
          *   Map source (algorithm/chips) to target (human/AI agents): Code, Compiler, Hardware, Input Data.
