      *   If the analogy breaks, the justification for Cooperation in One-Shot PD collapses back to CDT (Defect).
      *   *Key Insight:* The analogy isn't just a heuristic; it's the *mechanism* of the argument. If the mechanism is flawed, the conclusion is unsupported *unless* you adopt a decision theory like FDT that builds this correlation in axiomatically.

  6.  **Alternative Analogies:**
