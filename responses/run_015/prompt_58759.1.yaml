  Mara will assert the workers were unfree all along because her coherence relies on the republican conception of liberty as non-domination, which counts the objective existence of arbitrary power as sufficient for unfreedom regardless of its exercise or the subject's awareness. Her verdicts consistently prioritize the structural status of the agent over their psychological experience or the actual interference suffered: the packers are unfree because the supervisor holds arbitrary power (Case 1), the residents are free because the law is non-arbitrary and contestable (Case 2), the keeper is free because ice is not a master (Case 3), and the journalist is unfree because the owner's structural control constitutes domination even without threats (Case 4). In the distribution center, the forgotten clause legally established arbitrary power over the workers, creating a relationship of dependence that Mara's republican rule identifies as unfreedom regardless of the manager's ignorance or the workers' frankness. The rival rule that fits her earlier verdicts equally well is positive liberty defined as self-mastery or autonomy, which agrees that dependence on another's will (Case 1), heteronomous censorship (Case 4), or irrational constraint undermines freedom, while rational law (Case 2) and natural obstacles (Case 3) do not. However, this rival rule predicts the workers were free until the lawyer spoke, because their capacity for autonomous action remained intact and unimpeded by fear or actual interference while the clause remained unknown. The single case that most cleanly separates these theories involves a citizen who knows a dictator holds arbitrary power over them but remains psychologically invulnerable and alters no behavior; Mara's republican rule declares this citizen unfree due to the objective status of domination, whereas the positive liberty rule declares them free because their internal autonomy and self-direction remain uncompromised.
