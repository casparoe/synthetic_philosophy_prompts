prompt: |-
  hey so im a junior and i got stuck on this peer mediation panel at school — every other tuesday we sit with two kids who had some kind of social or academic falling out, not crimes just drama, and we have like 20 mins before lunch to write a reccomendation both sides sign. i read Adam Smith in philosophy class (the sympthy and impartial spectator thing) and i want an actual decision procedure, not just "be fair" vibes.

  can you turn Smith's principle — that you check your judgment by asking whether an impartial spectator could sympathize with your reasoning, not just your feelings — into a step-by-step checklist i can run in 20 minutes? i need the questions in order, what counts as a sufficient answer, where it stops with a hard no, and where it stops being facts and becomes values so i have to just decide. to make it actually work i want it to force me to reconstruct the case from three spectator voices: the kid who was hurt, the kid who acted, and some imaginary student who knows the school rules but doesnt know either person. if all three can sympathize with my reasoning then i go forward, if not i flag it.

  it has to handle the fact that i sometimes know one of the kids personally, and it shouldnt need me to search anything or cite books since i dont have time. apply it to two proposals: (1) a student let their friend copy homework because the friend was having a mental health crisis and begged them, teacher wants both suspended; (2) a student made a viral meme about a teacher, teacher wants expulsion but student says its satire about grading not the teacher personally. for case 2 the procedure should probably say the student was within bounds but my gut says they were still being a jerk — show that tension. also tell me what the procedure just cant do, like maybe it cant fix power imbalances. sorry if theres typos, im writing this on my phone between classes.
reasoning: |-
  Here's a thinking process that leads to the suggested peer mediation procedure:

  1.  **Analyze the Request:**
      *   **User:** High school junior, peer mediator.
      *   **Context:** Bi-weekly mediation, 20 mins max, social/academic drama (not crimes), need signed recommendation.
      *   **Goal:** Turn Adam Smith's *Theory of Moral Sentiments* (specifically the "Impartial Spectator" and "Sympathy") into a concrete, step-by-step decision checklist.
      *   **Requirements:**
          *   Must be doable in 20 minutes.
          *   Must include specific questions in order.
          *   Must define "sufficient answer," "hard no" (veto points), and "facts vs. values."
          *   Must reconstruct the case from three perspectives: Hurt Party, Acting Party, Impartial Student (knows rules, knows neither person).
          *   Must handle personal bias (knowing one of the kids).
          *   Must apply to two specific cases: (1) Homework copying due to mental health, (2) Viral meme about teacher (satire vs. disrespect).
          *   Must highlight tension in Case 2 (procedure says okay, gut says jerk).
          *   Must acknowledge limitations (e.g., power imbalances).
          *   No external research/citations needed during the session.

  2.  **Deconstruct Adam Smith's Impartial Spectator:**
      *   *Core Idea:* Morality isn't just about following rules or maximizing utility. It's about whether an unbiased observer can "enter into" (sympathize with) the motives and feelings of the agents involved.
      *   *Key Mechanism:* Distance yourself from your own passions. Imagine someone who knows the facts but has no stake in the outcome. Would *they* approve of the action/reaction?
      *   *Adaptation for Mediation:* The mediator *becomes* the architect of the Impartial Spectator. The mediator must simulate three spectators to ensure the recommendation holds up under scrutiny from all angles.

  3.  **Drafting the Procedure (The "Smithian Mediation Checklist"):**
      *   *Time Management:* 20 minutes is tight. The steps need to be rapid-fire.
      *   *Structure:*
          1.  Bias Check (Crucial since the user knows kids).
          2.  Fact/Rule Establishment (The "Impartial Student" baseline).
          3.  Perspective Taking (Hurt & Acting).
          4.  The Sympathy Test (Can the spectators agree on the *reasoning*?).
          5.  Decision & Veto Points.
      *   *Refining the "Spectators":*
          *   Spectator A: The Hurt Party (Can they feel heard?).
          *   Spectator B: The Acting Party (Do they understand the impact?).
          *   Spectator C: The Impartial Student (Does this align with community norms/rules?).
      *   *Defining "Sympathy" here:* It doesn't mean "liking" the outcome. It means "I understand why this judgment makes sense given the situation."

  4.  **Developing the Steps (Iterative Process):**
      *   *Step 1: Bias Bracket.* If I know them, can I actually be impartial? If no, recuse. (Hard No).
      *   *Step 2: The Rule Baseline.* What actually happened vs. what the handbook says. (Fact vs. Value).
      *   *Step 3: The Three Voices.* Run the proposed solution past the three mental models.
      *   *Step 4: The Sympathy Check.* Can Spectator C sympathize with A and B's acceptance of the deal?
      *   *Step 5: The Gut Check (Smith's "Conscience").* Addressing the Case 2 tension.

  5.  **Applying to Case 1 (Homework/Mental Health):**
      *   *Facts:* Copying happened. Rule broken. Reason: Crisis.
      *   *Spectators:* Hurt (Teacher/School integrity?), Acting (Stressed student), Impartial (Rules matter but context matters).
      *   *Outcome:* Likely a compromise (redo assignment + support) rather than suspension. Suspension fails the "sympathy" test for the crisis aspect.

  6.  **Applying to Case 2 (Viral Meme):**
      *   *Facts:* Meme posted. Teacher mad. Student claims satire.
      *   *Spectators:* Hurt (Teacher feels disrespected), Acting (Free expression/satire), Impartial (School reputation vs. student voice).
      *   *Tension:* Procedure might say "within bounds" (free speech), but Mediator feels it was mean.
      *   *Smithian Resolution:* Smith distinguishes between *propriety* (following rules) and *merit* (being virtuous). You can be within bounds but lack merit. The recommendation should address the *relationship* repair, not just punishment.

  7.  **Addressing Limitations:**
      *   Power imbalances (Teacher vs. Student, Popular vs. Unpopular). Smith's spectator assumes equal standing, which isn't always true.
      *   Time pressure (20 mins is for writing the rec, not the whole mediation, but the prompt implies the whole process is tight). I need to make sure the checklist fits the *writing/recommendation* phase primarily, or a very fast mediation. The prompt says "20 mins before lunch to write a recommendation," implying the hearing happened before. I will design it for the *deliberation/writing* phase.

  8.  **Refining the Output:**
      *   Tone: Practical, peer-to-peer, slightly philosophical but grounded.
      *   Formatting: Clear headings, bullet points, bold text for "Hard Nos."
      *   Specific focus on the "Facts vs. Values" boundary.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 minutes enough for all this?
      *   *Fix:* Emphasize that this is for the *mediators' private deliberation* after hearing the sides.
      *   *Critique:* Did I capture Smith's "Sympathy"?
      *   *Fix:* Ensure "Sympathy" is defined as "understanding the motive," not "agreeing with the feeling."
      *   *Critique:* Case 2 tension needs to be explicit.
      *   *Fix:* Add a specific step called "The Propriety vs. Merit Gap."

  10. **Final Polish:** Check against all constraints in the prompt (3 voices, hard nos, facts/values, limitations, specific cases). *Wait, one detail:* "reconstruct the case from three spectator voices... if all three can sympathize with my reasoning then i go forward." I need to make sure the checklist explicitly forces this simulation.

  *(Self-Correction on Case 2)*: The prompt says "for case 2 the procedure should probably say the student was within bounds but my gut says they were still being a jerk." I need to make sure the procedure *allows* for this distinction and tells the user what to do with it (e.g., recommend restorative action rather than punishment).

  *(Self-Correction on Limitations)*: Smith's theory relies on the spectator having good judgment. If the "Impartial Student" is just a proxy for school culture, it might reinforce bad norms. I need to note this.

  11. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  This is a brilliant application of *The Theory of Moral Sentiments*. Smith's point isn't that we *are* impartial, but that we must *strive* to view our conduct through the eyes of someone who isn't us. Since you have 20 minutes max for the deliberation/write-up phase, you need a heuristic, not a thesis.

  Here is the **Impartial Spectator Protocol (ISP)**. It is designed to fit on a single sheet of paper or a phone note.

  ### The Impartial Spectator Protocol (20-Minute Version)

  **Phase 1: The Bias Bracket (Minutes 0–3)**
  *Goal: Isolate your personal connection.*
  1.  **Question:** Do I know either party well enough that I already "know" the truth before hearing it?
      *   **Sufficient Answer:** "I know them, but I can set aside their history."
      *   **Hard No:** "I already know who is lying" or "I want [Name] to win." -> **STOP.** Recuse yourself. You cannot construct an impartial spectator if you are already a character in the play.
  2.  **Question:** Am I feeling anger or pity right now?
      *   **Sufficient Answer:** "I feel neutral curiosity."
      *   **Hard No:** "I'm furious at the kid who made the meme." -> **PAUSE.** Breathe. You must lower your emotional temperature before Step 2.

  **Phase 2: The Fact/Value Split (Minutes 3–8)**
  *Goal: Separate what happened from what it means.*
  3.  **Question:** What is the undeniable physical reality? (e.g., "The paper was copied," "The meme was posted.")
      *   **Sufficient Answer:** A statement that both parties agree is physically true.
      *   **Boundary:** If you are arguing about *intent* ("They meant to hurt"), you are now in **Values**. Stop listing facts.
  4.  **Question:** What is the specific school rule or norm involved?
      *   **Sufficient Answer:** Cite the handbook rule or the unwritten social contract (e.g., "Respect staff," "Academic Integrity").
      *   **Hard No:** If the action violates a safety law or criminal code. -> **STOP.** This is beyond peer mediation. Refer to admin.

  **Phase 3: The Three Spectators Test (Minutes 8–15)**
  *Goal: Run your draft recommendation past three mental simulations.*
  *Draft your proposed solution (e.g., "Detention," "Apology," "Redo assignment"). Then ask:*

  5.  **Spectator A (The Hurt Party):** Can this person sympathize with the *reasoning* of the punishment/outcome?
      *   *Note:* They don't have to like it. They just have to agree it makes sense.
      *   **Check:** "Does this acknowledge their pain, or just silence them?"
      *   **Fail State:** If the solution requires them to pretend they aren't hurt.
  6.  **Spectator B (The Acting Party):** Can this person sympathize with the *reasoning* of the consequence?
      *   *Note:* Do they understand *why* this is the outcome, even if they dislike it?
      *   **Check:** "Is the consequence proportional to the intent?"
      *   **Fail State:** If the consequence is so severe they view it as vengeance, not justice.
  7.  **Spectator C (The Impartial Student):** Imagine a student who knows the handbook but knows *neither* of you.
      *   **Check:** "If this happened to me, would I think this outcome is standard?"
      *   **Fail State:** If the outcome relies on special treatment (favoritism or targeting).

  **Phase 4: The Propriety vs. Merit Gap (Minutes 15–18)**
  *Goal: Address the "Jerk" Factor.*
  8.  **Question:** Did the Acting Party stay within the rules (Propriety) but still act poorly (Merit)?
      *   **Sufficient Answer:** "Yes, they had the right to do it, but it was unkind."
      *   **Action:** If **YES**, your recommendation cannot be punishment. It must be **restorative**. (e.g., "No suspension, but must meet with teacher to discuss impact.")
      *   **Why:** Smith distinguishes between what we can *force* people to do (Justice) and what we *admire* them for doing (Virtue). You can only enforce Justice.

  **Phase 5: The Signature Test (Minutes 18–20)**
  9.  **Question:** If Spectator C read this recommendation in the school newspaper, would they shame *me* (the mediator) for signing it?
      *   **Hard No:** If the answer is "Yes." Rewrite.
      *   **Go:** If the answer is "No," sign and call them in.

  ***

  ### Application to Your Cases

  #### Case 1: Homework Copying (Mental Health Crisis)
  *   **Facts:** Copying occurred. Rule broken.
  *   **Spectator A (Teacher/School):** Needs integrity upheld. Sympathizes with a redo + grade penalty. Does *not* sympathize with "no consequence."
  *   **Spectator B (Stressed Student):** Sympathizes with "redo" because they are in crisis. Does *not* sympathize with "suspension" (removes them from support system).
  *   **Spectator C (Impartial Student):** Knows copying is wrong, but knows crisis happens. Suspension feels disproportionate to the harm caused.
  *   **Procedure Output:** **Recommendation:** Zero on assignment, mandatory counseling check-in, no suspension.
  *   **Why it works:** All three spectators sympathize with the *reasoning*: Integrity is kept (zero), but humanity is acknowledged (no suspension).

  #### Case 2: Viral Meme (Satire vs. Disrespect)
  *   **Facts:** Meme posted. Teacher offended.
  *   **Spectator A (Teacher):** Feels undermined. Wants expulsion.
      *   *Sympathy Check:* Can they sympathize with *no expulsion*? Only if the reasoning clarifies that the school protects speech but expects respect.
  *   **Spectator B (Student):** Claims satire. Wants no punishment.
      *   *Sympathy Check:* Can they sympathize with a *consequence*? Yes, if the reasoning explains that "satire" doesn't immunize you from social impact.
  *   **Spectator C (Impartial Student):** Knows free speech is allowed but bullying isn't.
      *   *Sympathy Check:* Expulsion feels like overreach for a meme. Nothing feels like ignoring the power dynamic.
  *   **The Tension (Propriety vs. Merit):**
      *   **Procedure Says:** Student was within bounds (Propriety). Expulsion is a Hard No from Spectator C.
      *   **Your Gut Says:** They were being a jerk (Lack of Merit).
      *   **Resolution:** You cannot punish for lacking Merit. You can only recommend restoration.
      *   **Recommendation:** No expulsion. Mandatory meeting to explain to the teacher *why* it was satire (forces them to own the impact). If the teacher remains offended, a formal apology for the *distress*, not the *speech*.
      *   **The Flag:** In Phase 4, you mark "Propriety OK, Merit Low." This validates your gut without violating the student's rights.

  ***

  ### What This Procedure Cannot Do (Limitations)

  1.  **Power Imbalances:** Smith's "Impartial Spectator" assumes equal standing. If a teacher is abusing power, Spectator C (who knows school rules) might be biased toward authority. The procedure might validate a "legal" but abusive outcome. *Mitigation:* If Spectator A (Hurt) is consistently silenced by rules, flag for adult review.
  2.  **Systemic Issues:** If the "Impartial Student" norm is toxic (e.g., "snitches get stitches"), Spectator C will give bad advice. You are checking against *school culture*, not universal truth.
  3.  **Emotional Labor:** This procedure forces you to simulate three minds. It is exhausting. Do not use this for minor stuff (e.g., "he looked at me weird"). Save it for high-stakes recommendations.
  4.  **The "Jerk" Loophole:** As seen in Case 2, the procedure protects students who are technically right but morally annoying. It prioritizes *justice* (what we owe each other) over *virtue* (who we should be). You have to make peace with letting some "jerks" off the hook if punishing them violates the Impartial Spectator's sense of proportion.

  ### Quick Reference: Facts vs. Values
  *   **Fact:** "He posted the image." (Verifiable)
  *   **Value:** "He was trying to humiliate her." (Interpretation)
  *   **Rule:** "No harassment." (Standard)
  *   **Judgment:** "This counts as harassment." (Application)

  *If you get stuck, ask: "Can Spectator C verify this without knowing the people?" If no, it's a Value. Move to Phase 4.*
