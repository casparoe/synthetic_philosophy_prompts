answer: |-
  # Simulation Protocol: The Calibration Token

  **Session Duration:** 75 Minutes
  **Participants:** 14 Students (7 Pairs)
  **Materials:** 28 Envelopes (2 per student), 50 slips of paper (small), pens, a timer, a whiteboard for scorekeeping.
  **Objective:** To induce a first-person experience of the normative collapse inherent in attempting to follow a rule regarding a strictly private object/state.

  ## I. Preparation & Setup (Before Class)
  1.  **The Stakes:** Announce at the start that the pair with the highest "Calibration Score" wins the right to select the primary text for the following week's seminar. This creates genuine collective incentive without monetary cost.
  2.  **Seating:** Arrange desks in 7 pairs. Partners must sit close enough to whisper but not see each other's papers.
  3.  **Materials Distribution:** Give each student two envelopes. Label one **"MASTER"** and one **"LEDGER."** Place 5 small slips of paper inside the LEDGER envelope.

  ## II. Timeline & Mechanics

  ### Phase 1: Instituting the Rule (Minutes 0–15)
  **Goal:** Establish a private referent that cannot be externally verified.

  1.  **Instruction (5 mins):** Tell students they are "Calibrators." Their task is to maintain a specific internal **Calibration Token** over the course of the session.
      *   **Constraint:** The Token cannot be a physical object, a drawing, or a word. It must be a *somatic or attentional state* (e.g., a specific tension in the shoulder, a specific focal depth of vision, a specific hum in the mind).
      *   **Rule:** They must create a private definition of this state. They will write this definition on a slip of paper and seal it in the **MASTER** envelope. This envelope remains sealed until the very end.
      *   **Symbol:** They must assign a symbol (e.g., "Δ" or "X") to this state in their mind.
  2.  **Calibration (5 mins):** Students close their eyes and generate the Token. They must "feel" the state. They write the symbol and a brief mnemonic on the top slip of their **LEDGER** (Round 0).
  3.  **The Contract (5 mins):** Explain the Payoff Scheme.
      *   **Individual Consistency:** In each subsequent round, if they successfully re-identify the Token, they write "MATCH." If not, "DRIFT."
      *   **Team Bonus:** Pairs earn 10 points for every round where *both* partners record "MATCH."
      *   **Verification:** At the end, they will open the MASTER envelope. If the Ledger entries align with the Master definition, points are validated.
      *   *Crucial Ambiguity:* Do not explain *how* alignment will be judged. Let them assume there is a method.

  ### Phase 2: The Tracking Rounds (Minutes 15–45)
  **Goal:** Induce reliance on memory/impression without a criterion of correctness.

  1.  **Structure:** 5 Rounds, 5 minutes each.
  2.  **Procedure per Round:**
      *   **Minute 1 (Reset):** Students relax and clear the state.
      *   **Minute 2 (Generation):** Students attempt to recreate the exact Token from Phase 1.
      *   **Minute 3 (Judgment):** Students must decide: Is this *identical* to the Master Token?
      *   **Minute 4 (Recording):** On a new slip from the LEDGER, they write the Round Number and "MATCH" or "DRIFT."
      *   **Minute 5 (Partner Check):** Partners ask each other: "Did you match?" They *must* answer truthfully. They update their mental tally of the Team Score.
  3.  **Instructor Intervention (Mid-Game):** At Round 3, announce: "Reminder: Precision is key. A near-match is a DRIFT. Only exact identity counts."
      *   *Effect:* This heightens the normative pressure without providing a tool to measure exactness.

  ### Phase 3: The Audit & Collapse (Minutes 45–60)
  **Goal:** Reveal the impossibility of verification.

  1.  **The Swap (5 mins):** Partners swap LEDGER envelopes. Each student now holds their partner's record of private states.
  2.  **The Verification Attempt (10 mins):**
      *   Instruct students to open the **MASTER** envelope of their *partner*.
      *   **Task:** Compare the Partner's Master Definition to the Partner's Ledger entries. Determine if the Partner earned their points.
      *   **Constraint:** You cannot ask the partner for clarification. You must judge based *only* on the written definition and the Ledger slips.
  3.  **The Scoring (5 mins):**
      *   Ask pairs to submit their final Team Score.
      *   Ask the "Auditor" (the partner) to confirm if the score is valid.
      *   **The Trap:** The Auditor will realize they cannot verify the Match/Drift claims because the Master Definition refers to a private state they cannot access. The Generator will realize they cannot prove they were right even to themselves, only that they *felt* certain.
      *   **Instructor Action:** Refuse to award the prize. State: "I cannot verify the scores because there is no criterion to distinguish a correct Match from a confident error."

  ### Phase 4: Debrief & Mapping (Minutes 60–75)
  **Goal:** Map the simulation to the philosophical argument without lecturing.

  1.  **Elicit Phenomenology:** Ask students to describe the moment in Round 3 or 4 when they felt unsure if they were following the rule or just remembering the *feeling* of following the rule.
  2.  **Map the Mechanics:**
      *   **Master Envelope = Ostensive Definition:** The initial attempt to name the state.
      *   **Tracking Rounds = Memory as Check:** Using memory to verify memory.
      *   **The Audit = The Public Criterion:** Attempting to use an external check, only to find the external check relies on the same private access.
      *   **The Refusal of Points = Normative Collapse:** The distinction between "seeming right" and "being right" vanished.
  3.  **Close:** Emphasize that the problem was not that the state was hidden from the *partner*, but that it was hidden from the *self* across time. The "Team Score" failed because individual scores were ungrounded.

  ---

  ## III. Predictable Failures & Mitigation

  **1. The "Physical Anchor" Cheat**
  *   **Problem:** Students will define the Token as something observable (e.g., "Pressing thumb hard" or "Holding breath"). This makes the state public and solvable, ruining the simulation.
  *   **Mitigation:** During Phase 1, circulate and inspect Master Definitions. If a definition describes an observable muscle movement, reject it. Require them to rewrite it as an *internal sensation* resulting from the movement.
  *   **Script:** "This definition describes an action, not a state. The Token must be the *feeling* that results, which no one else can see."

  **2. Collusion on Points**
  *   **Problem:** Pairs may agree to lie and claim "MATCH" every round to secure the prize (text selection), treating the game as a trivial cooperation task.
  *   **Mitigation:** Introduce the "Skeptic Clause" in Phase 3. Tell them: "If the Auditor rejects the Ledger, the Team gets zero points. If the Auditor accepts it, but I (Instructor) find a logical inconsistency in the definition, the Team gets zero points."
  *   **Why it works:** It shifts the pressure from honesty to *justifiability*. They can lie, but they can't justify the lie against the Master Definition during the Audit.

  **3. Disengagement/Cynicism**
  *   **Problem:** Students may realize the pointlessness early (Minute 20) and stop trying, treating it as a "gotcha" trick.
  *   **Mitigation:** Maintain a serious, bureaucratic tone. Treat the "Calibration Protocol" as a rigorous technical task. Do not smile when they express frustration. The frustration is the data.
  *   **Script:** "Please continue the protocol. The instability you are feeling is part of the calibration data."

  **4. The "I Know I Was Right" Objection**
  *   **Problem:** In the debrief, a student may insist, "But I *know* I felt the same thing. The points should count."
  *   **Mitigation:** This is the target. Do not argue. Ask: "Can you show me the rule you used to distinguish 'knowing' from 'feeling like you know'?" Use their certainty to demonstrate the lack of a criterion.

  ---

  ## IV. Limitations & Debrief Obligations

  **What the Simulation Cannot Capture:**
  1.  **The Social Normativity of Language:** The game isolates the individual's failure. It does not fully simulate how public language *succeeds* through shared practices. It shows the crash, not the road.
  2.  **The Full Scope of "Rule-Following":** The game focuses on *re-identification* (naming). It does not fully capture *grammar* or *syntax* (using the term in inference).
  3.  **The Duration:** The game lasts 75 minutes. The philosophical problem applies to a lifetime of usage. The "drift" in the game is accelerated; in life, it is insidious.

  **What You Must Supply in the Debrief:**
  1.  **The Normative Gap:** You must explicitly articulate that the problem is not epistemic (not knowing) but normative (no standard to judge). The game makes them *feel* the lack of a standard; you must name it.
  2.  **The "Right" vs. "Seems Right":** You must draw the distinction they felt but couldn't articulate. "In the game, 'MATCH' meant 'I feel sure.' But for a rule to be a rule, 'MATCH' must mean 'accords with the standard.' The game removed the standard."
  3.  **The Solution (Briefly):** Do not leave them in skepticism. Briefly indicate that the "criterion" they were looking for is found in the *public practice* of using the term, not in the private ostension. The game failed because it tried to build a language on a private foundation.

  **Final Note to Instructor:**
  Do not mention Wittgenstein's name until the final 5 minutes. Let the argument belong to the students' experience of the game. If they name him early, intervene: "Let's finish the protocol first. We can label the phenomenon later." The power of this session lies in the silence before the label.
