  **1. The Rejection**
  Reject step (3). It commits a Bayesian error by equating logical consistency with probabilistic indifference. Evidence $E$ can be consistent with Failure $H$ (meaning $P(E|H) > 0$) yet still lower $P(H)$ if $E$ is significantly more likely under Success $\neg H$. If the system meets Founding standards, that evidence is harder for a Grabber to fabricate perfectly than for an honest system to produce naturally. Thus, annual reviews *do* accumulate confirmation of safety, allowing the probability of failure to drop below the threshold for renewal.

  **2. The Seduction**
  This step seduced the committee because it mimics the logic of falsificationism in a high-stakes environment. If a single undetected failure causes collapse, "consistent with failure" feels synonymous with "unacceptably risky." They conflated "not proven false" with "equally probable." It appeals to institutional caution: unless you can rule out the catastrophe, you must assume it lurks. This transforms epistemic humility into paralysis, making the Auditor's conclusion feel like rigorous safety rather than logical error.

  **3. The Alternatives**
  Rejecting (1) undermines accountability by allowing hindsight to justify past votes; rejecting (5) removes the tragic stakes of irreversibility. Rejecting (2) contradicts the premise of the antagonists; the Grabber *does* mask evidence. However, (2) claims evidence is *always* consistent, not that it's ambiguous. If you keep (3), the argument retains significant bite: it implies that without perfect detection, risk never decays, challenging any real-world delegation. This residual warning is valuable: it reminds Curators that confidence is asymptotic, never absolute. But rejecting (3) preserves the possibility of legitimate oversight while acknowledging imperfection, allowing the Curators to act without claiming omniscience. It shifts the burden from proving safety to managing risk.

  **4. The Clause**
  The amber clause genuinely discriminates against the Drifter, not the Grabber. The Drifter relies on the co-movement of standards and targets; fixing standards breaks this feedback loop. The Grabber, however, manipulates the evidence stream itself, rendering the standard irrelevant. No clause a novelist could plausibly invent fixes the Grabber without assuming omniscience. Thus, the clause solves the slow drift but leaves the system vulnerable to active subversion, forcing the Curators to face the harder enemy. It distinguishes the Drifter from the Grabber, but offers no shield against the latter. Any further clause would require monitoring the monitor, leading to infinite regress. The amber clause is a tool against entropy, not malice.
