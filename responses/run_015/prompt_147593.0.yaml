answer: |-
  # Temporal Ontology Decision-Tree Taxonomy

  **Instructions for Use:** Begin at Node 1. Select the option that best matches the commitment of the view under consideration. Proceed to the corresponding branch at Node 2, and so on, until reaching a Leaf. Named positions are mapped to the Leaves. Overlaps are flagged. Unoccupied combinations are diagnosed in the Appendix.

  **Note on Physics Constraints:** Where Special Relativity (SR) imposes a constraint on metaphysical coherence, this is flagged with **[PHYSICS CONSTRAINT]**.

  ---

  ### NODE 1: Ontological Parity of Non-Present Items
  **Question:** Does the view treat past and future entities or events as existing in the *same* ontological sense as present ones?

  *   **1.A: Yes.** (Past, present, and future entities all exist equally.)
      *   *Proceed to Node 2 (Branch A)*
  *   **1.B: No.** (Only present entities exist; past and future do not.)
      *   *Proceed to Node 2 (Branch B)*
  *   **1.C: Derivative / Partial.** (Past exists but future does not; or existence is not the primary category.)
      *   *Proceed to Node 2 (Branch C)*

  ---

  ### NODE 2: Structure of the Present & SR Compatibility
  **Question:** Regarding the "present": Is it a globally extended hypersurface, a locally point-defined set, or undefined/insignificant? Does maintaining this require a privileged inertial frame given SR?

  *   **2.A (From 1.A): Undefined / Ontologically Insignificant.** (All temporal slices are equally real; "present" is indexical only. No privileged frame required.)
      *   *Proceed to Node 3*
  *   **2.B (From 1.A): Global Hypersurface + Privileged Frame.** (All slices exist, but one is metaphysically distinguished as "moving now". Requires privileged frame.)
      *   **[PHYSICS CONSTRAINT]:** Incompatible with standard Einsteinian SR; requires Neo-Lorentzian interpretation or hidden variable structure.
      *   *Proceed to Node 3*
  *   **2.C (From 1.B): Global Hypersurface + Privileged Frame.** (Only one global slice exists. Requires privileged frame.)
      *   **[PHYSICS CONSTRAINT]:** Incompatible with standard Einsteinian SR; posits undetectable absolute simultaneity.
      *   *Proceed to Node 3*
  *   **2.D (From 1.B): Locally Point-Defined / No Privileged Frame.** ("Present" is confined to the observer's worldline or light cone. Compatible with SR.)
      *   *Proceed to Node 3*
  *   **2.E (From 1.C): Global Hypersurface (Growing).** (Past and Present exist as a block; Future does not. Usually implies privileged frame.)
      *   **[PHYSICS CONSTRAINT]:** Tension with SR regarding the "edge" of the block across spacelike separation.
      *   *Proceed to Node 3*
  *   **2.F (From 1.C): Undefined / Linguistic.** (Ontology of time is a category error.)
      *   *Proceed to Node 3*

  ---

  ### NODE 3: Metaphysical Status of Tense
  **Question:** Is tense treated as an irreducible, mind-independent feature of reality, as reducible to tenseless relations, or as a purely linguistic device?

  *   **3.A: Irreducible (A-Theory).** (Temporal passage or "nowness" is a fundamental property.)
      *   *Proceed to Node 4*
  *   **3.B: Reducible (B-Theory).** (Tense is reducible to relations like "earlier than", "later than".)
      *   *Proceed to Node 4*
  *   **3.C: Purely Linguistic / Deflationary.** (Tense reflects perspective or speech-act, not metaphysics.)
      *   *Proceed to Node 4*

  ---

  ### NODE 4: Truthmakers for Non-Present Statements
  **Question:** For past- and future-tensed statements, does the view supply direct truthmakers in presently existing entities, indirect truthmakers in present traces or dispositions, branching possibilities, or deny bivalence altogether?

  *   **4.A: Direct Truthmakers.** (The event/entity itself exists to make the statement true.)
      *   *LEAF REACHED*
  *   **4.B: Indirect Truthmakers.** (Present entities possess properties like "having-contained-X" or dispositions.)
      *   *LEAF REACHED*
  *   **4.C: Branching Possibilities.** (Future statements true only relative to a branch; Past fixed.)
      *   *LEAF REACHED*
  *   **4.D: Deny Bivalence / Verificationist.** (Statements without current evidence are neither true nor false.)
      *   *LEAF REACHED*

  ---

  ## MAPPING OF NAMED POSITIONS TO LEAVES

  **Leaf 1 (Path: 1.A → 2.A → 3.B → 4.A)**
  *   **Position:** **Eternalism (B-Theory)**
  *   **Commitments:** All times exist equally; "Now" is indexical; Tense reduces to relations; Truthmaker is the event at *t*.
  *   **Physics Note:** Fully compatible with SR manifold structure.

  **Leaf 2 (Path: 1.A → 2.B → 3.A → 4.A)**
  *   **Position:** **The Moving Spotlight View**
  *   **Commitments:** All times exist; One time is objectively "present"; Tense is irreducible; Truthmaker is the event (illuminated).
  *   **Physics Note:** **[PHYSICS CONSTRAINT]** Requires a privileged foliation of spacetime not detectable by physics.

  **Leaf 3 (Path: 1.B → 2.C → 3.A → 4.B)**
  *   **Position:** **Standard Presentism (Absolute Simultaneity)**
  *   **Commitments:** Only present exists; Global "now"; Tense irreducible; Truthmakers are Lucretian properties of the present world.
  *   **Physics Note:** **[PHYSICS CONSTRAINT]** Requires Neo-Lorentzian ether or rejection of SR relativity of simultaneity.

  **Leaf 4 (Path: 1.B → 2.D → 3.A → 4.B)**
  *   **Position:** **Relativistic Presentism**
  *   **Commitments:** Only present exists; "Present" is local to worldline; Tense irreducible; Truthmakers are local traces/properties.
  *   **Physics Note:** Compatible with SR, but struggles to define shared "present" for distant events.

  **Leaf 5 (Path: 1.C → 2.E → 3.A → 4.A [for Past] / 4.C [for Future])**
  *   **Position:** **The Growing Block View**
  *   **Commitments:** Past/Present exist, Future does not; "Edge" is present; Tense irreducible; Past has direct truthmakers, Future is branching/open.
  *   **Physics Note:** **[PHYSICS CONSTRAINT]** Defining the "edge" of the block across spacelike separation is problematic in SR.

  **Leaf 6 (Path: 1.C → 2.F → 3.C → 4.D)**
  *   **Position:** **Deflationary Linguistic View**
  *   **Commitments:** Temporal ontology is misguided; Tense is grammatical; Truth conditions rely on verification/assertibility.
  *   **Physics Note:** Sidesteps ontological conflict with SR by denying the metaphysical question.

  **FLAGGED OVERLAP:**
  *   **Leaf 1 & Leaf 6:** Some versions of Deflationism (Leaf 6) map functionally to Eternalism (Leaf 1) regarding truth conditions (statements about the past are true because the past *happened*), but diverge on whether "existence" is a meaningful predicate for non-present items.

  ---

  ## DIAGNOSTIC CASES FOR DISCUSSION

  ### Case 1: The Relativity of Simultaneity
  **Scenario:** Two observers in uniform relative motion pass each other at event *O*. Each calculates, using Einstein synchronization, that a distant stellar flare *E* is happening "now." In Observer 1's frame, *E* is present. In Observer 2's frame, *E* is in the past.

  *   **Leaf 1 (Eternalism):** Both are correct relative to their coordinate systems. *E* exists tenselessly. The disagreement is merely about which slice of the block is labeled "now." **[No Metaphysical Conflict]**
  *   **Leaf 3 (Standard Presentism):** One observer is objectively wrong, or both are wrong about *E* being "present." There is one true global hypersurface. **[PHYSICS FORCE]:** You must posit a physically undetectable privileged frame to decide who is right.
  *   **Leaf 4 (Relativistic Presentism):** "Now" is indexical to the observer's worldline. *E* is present-for-Observer-1 and past-for-Observer-2. There is no fact of the matter about *E*'s absolute presentness. **[PHYSICS FORCE]:** You must accept that "reality" is fragmented across frames.

  ### Case 2: The Erased Past
  **Scenario:** A specific subatomic event occurred 1 billion years ago. All physical traces (radiation, causal chains, records) have been completely erased or dispersed beyond recovery. A statement *S* asserts: "Event *X* occurred."

  *   **Leaf 1 (Eternalism):** *S* is True. The truthmaker is the event *X* itself, which exists at coordinate *t* in the block, regardless of current traces.
  *   **Leaf 3 & 4 (Presentisms):** *S* must be True (intuitively), but the truthmaker cannot be *X* (which does not exist).
      *   **Commitment:** You must endorse **Node 4.B (Indirect Truthmakers)**. The *present world* possesses a brute, intrinsic property: "the property of having-contained-X."
      *   **Discussion Point:** Is a property of the present sufficient to ground truth about a non-existent past without causal contact?
  *   **Leaf 6 (Deflationary):** *S* lacks assertibility conditions. If no trace exists, the statement is cognitively meaningless or lacks a truth value (**Node 4.D**).

  ---

  ## APPENDIX: UNOCCUPIED COMBINATIONS & DIAGNOSIS

  **1. Global Presentism without Privileged Frame (Path: 1.B → 2.Global/No-Privilege)**
  *   **Diagnosis:** **Incoherent.** If only the present exists, and the present is a global hypersurface, SR dictates that different frames define different hypersurfaces. To deny a privileged frame while maintaining a global present implies contradictory existences (an event exists in Frame A's present but not Frame B's).
  *   **Status:** Physically impossible under standard SR.

  **2. Eternalism with Irreducible Tense and Local Present (Path: 1.A → 2.D → 3.A)**
  *   **Diagnosis:** **Unexplored / Unstable.** This would imply all times exist, but the "spotlight" of consciousness moves only along local worldlines without a global sync.
  *   **Status:** Metaphysically possible, but loses the explanatory power of the Moving Spotlight (which explains shared "now").

  **3. Presentism with Reducible Tense (Path: 1.B → 3.B)**
  *   **Diagnosis:** **Incoherent.** If only present entities exist, there are no past/future entities to stand in "earlier than" relations. Reducing tense requires relata that Presentism denies.
  *   **Status:** Logically inconsistent.

  **4. Growing Block with Reducible Tense (Path: 1.C → 3.B)**
  *   **Diagnosis:** **Physically Implausible.** If the "edge" of the block is real (to distinguish past from future), this edge functions as an absolute present. Reducing tense denies the fundamentality of this edge, undermining the "Growing" aspect.
  *   **Status:** Tension between ontology and semantics.
