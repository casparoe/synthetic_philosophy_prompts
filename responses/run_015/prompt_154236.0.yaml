      *   **The Doomsday Machine as Failed Precommitment:** Focus on the War Room dialogue. Strangelove: "The whole point of the doomsday machine is lost if you keep it a secret!" This is the Schelling point. The film shows that *technical* credibility isn't enough; *communicative* credibility is required.
