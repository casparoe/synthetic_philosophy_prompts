  3. "The crux"
  The dispute turns fundamentally on the primary object of rational assessment: acts or states. Yusuf assumes rationality primarily evaluates dispositions, allowing state-level reasons to justify acts that lack act-level support. This permits self-effacing reasons where the justification for the state does not transmit to the act. Hanne assumes rationality primarily evaluates acts, requiring consistency between the reason to acquire a disposition and the reason to exercise it. For her, if the act lacks reason, the disposition to perform it is suspect. Yusuf's position follows from prioritizing long-term state optimization; Hanne's follows from prioritizing immediate act optimization. Neither proves their priority assumption, but Hanne's aligns better with standard decision theory while Yusuf's captures the intuitive pull of indirect self-defeat. The stalemate exists because they disagree on whether rationality is temporally extended or momentary. If rationality is temporally extended, Yusuf wins because the disposition maximizes over time. If momentary, Hanne wins because the act fails locally. The debate lacks a meta-principle for choosing between these temporal scopes of assessment. Without agreeing on whether rationality governs lives or moments, they cannot resolve the equivocation charge.

  4. "What both are missing"
