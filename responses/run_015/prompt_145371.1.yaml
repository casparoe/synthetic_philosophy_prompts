answer: |-
  You are not forcing the analogy. In fact, you have independently reconstructed one of the most significant insights in modern philosophy of mind and biology, most famously articulated by Daniel Dennett as **"competence without comprehension."**

  Your intuition that Darwin and Turing are structurally isomorphic on this point is correct. They both describe **algorithmic processes** that produce complex, functional, or "intelligent" outcomes without requiring a mind to guide them.

  Here is a parsing of your questions, breaking down the logical inversion, the connection to Turing, and the significance of the asymmetry you noticed.

  ### 1. Is Darwin's "Inversion" a Metaphor or a Logical Reversal?

  It is a **logical reversal of teleology**, not merely a metaphor for "lack of intent."

  *   **Standard Teleology (Human Design):** Cause $\rightarrow$ Goal $\rightarrow$ Means.
      *   *Example:* An architect wants a bridge (Goal), so they draw plans (Cause) to arrange stones (Means). The future goal causes the present action.
  *   **Darwinian Teleonomy (Natural Selection):** Variation $\rightarrow$ Filter $\rightarrow$ Retrospective "Goal."
      *   *Example:* Stones fall into place randomly. Those that fit stay; those that don't fall away. The "arch" appears at the end. The "goal" (the functional eye or wing) is the *result* of the process, not the *cause*.

  In Chapter 4 of *Origin*, Darwin is careful to distinguish Natural Selection from Human Selection. He admits the analogy is useful but insists on the difference: the breeder has a "mental picture" of the ideal pigeon; Nature has no mental picture.

  When you ask if this is a "positive feature" or just an "absence of mind," the answer is **positive feature**. Darwin is proposing a *mechanism* (cumulative selection) that actively replaces reasoning. It is an **algorithm**. It doesn't just "fail to think"; it *computes* adaptation through a blind generate-and-test loop. This is why Dennett calls natural selection an "algorithmic process." It is a mindless engine that cranks out design.

  ### 2. The Turing Connection: Syntax vs. Semantics

  Your link to Turing is structurally sound. Turing's 1936 definition of the Turing Machine establishes that computation is the manipulation of symbols based on **syntax** (shape/rules) rather than **semantics** (meaning).

  *   **The Turing Inversion:** A human mathematician understands the *meaning* of the numbers to solve the problem. A Turing Machine shuffles symbols according to rigid rules to produce the *same answer* without knowing what the symbols represent.
  *   **The Parallel:**
      *   **Darwin:** The organism doesn't need to "know" genetics; the environment filters physical traits. (Competence without biological comprehension).
      *   **Turing:** The machine doesn't need to "know" math; the logic gates filter symbol states. (Competence without semantic comprehension).

  Both systems demonstrate that **intelligence-like outcomes do not require intelligence-like processes.** This is the "inversion" you sensed: we usually think complex function requires a complex mind to direct it. Darwin and Turing show that a simple, blind process, iterated over time (Darwin) or steps (Turing), yields complex function.

  ### 3. Do They Share a Deeper Structure? ("Teleonomic Competence")

  Yes. The shared structure is **Iteration + Filtering.**

  *   **Biology:** Generate variation (mutation/recombination) $\rightarrow$ Filter by survival (selection) $\rightarrow$ Replicate survivors.
  *   **Computation:** Generate state transition (logic gate) $\rightarrow$ Filter by rule validity (syntax) $\rightarrow$ Proceed to next state.

  In both cases, the "success" of the system is defined entirely by the **constraints** placed upon it, not by an internal representation of the goal.
  *   In biology, the constraint is "don't die before reproducing."
  *   In computation, the constraint is "follow the transition table."

  This is what you called "teleonomic competence." The system acts *as if* it has a purpose (teleos), but the purpose is imposed from the outside (by the environment or the programmer), not held inside the system.

  ### 4. Does the Asymmetry Matter? (Physical Death vs. Symbolic Execution)

  You noted: *"Biological selection involves physical replication and death, while computation involves symbolic execution in a fixed architecture."*

  For the **philosophical point** about competence without comprehension, this asymmetry **does not matter.** This is the principle of **Substrate Neutrality**. An algorithm is defined by its logical structure, not what it is made of (silicon, carbon, paper, or water).

  However, for the **mechanism of innovation**, there is a difference:
  *   **Darwinian Selection** is inherently creative regarding the *rules* of the system over deep time. Mutations can change the "architecture" of the organism itself.
  *   **Turing Computation** (standard) is fixed-architecture. The machine follows rules, but the rules don't usually rewrite the machine's own logic table during the run (unless you are talking about machine learning/neural nets, which brings us back to Darwinian-style selection).

  If you want to tighten the analogy, look at **Genetic Algorithms**. This is where Turing-style computation explicitly adopts Darwinian logic: the code generates variations, tests them against a problem (filter), and "breeds" the successful code. Here, the asymmetry vanishes completely.

  ### 5. Darwin: Absence of Mind or Replacement of Reasoning?

  To answer your specific question: Darwin is claiming a **positive replacement of reasoning.**

  If he were only claiming "absence of mind," he would leave a gap: "Okay, there's no god, so how *did* the eye happen?"
  By proposing Natural Selection, he provides a **causal engine**. He is arguing that the *work* of reason (designing a functional eye) can be done by a non-rational process.

  This is why the "inversion" is critical. It moves the "design" from the **mind of the creator** to the **history of the creature.** The information isn't in the planner; it's in the accumulated filterings of the past.

  ### 6. Is Turing's Inversion the Same "Backward Filtering"?

  This is the one place where you should be careful.
  *   **Darwin** is definitely **backward filtering**. The environment selects *after* the variation occurs. The "choice" is retrospective.
  *   **Turing** is **forward deduction**. The machine moves from State A to State B based on a rule. It isn't usually "trying" things and failing; it is mechanically deriving an output.

  However, the *philosophical effect* is the same. In both cases, the **semantic truth** (the eye works / the math is correct) is guaranteed by **syntactic/physical constraints** (survival / logic gates), not by understanding.

  A better way to align them might be this:
  *   **Darwin** explains how **Complexity** arises from Simplicity without a Designer.
  *   **Turing** explains how **Meaning** arises from Syntax without a Mind.

  ### Summary

  You are reading Darwin exactly right. You have identified that *Origin* is not just a biological theory, but a theory of **information processing**.

  1.  **The Inversion is Real:** It is a shift from prospective teleology (design) to retrospective teleonomy (selection).
  2.  **The Analogy Holds:** Both Darwin and Turing decouple **competence** (doing the right thing) from **comprehension** (knowing why it's the right thing).
  3.  **The Asymmetry is Secondary:** The substrate (flesh vs. silicon) matters less than the logical structure (iterative filtering vs. rule-based manipulation).
  4.  **The Philosophical Point:** Both arguments naturalize "mind." They show that what looks like mental design is actually the output of a blind, mechanical algorithm.

  You are essentially rediscovering the core argument of Daniel Dennett's *Darwin's Dangerous Idea*. If you haven't read it, it is essentially a book-length expansion of the exact intuition you are having right now. Darwin didn't just explain biology; he provided the universal acid that dissolves the need for a "mind in the loop" for any complex system.
