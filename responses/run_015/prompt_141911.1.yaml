      *   *Best Separating Case:* A proposal benefiting the *very* worst-off (same as Case 1) but costing a *moderate* group (not the best-off) a large amount of total benefit, where the numbers of the moderate group are huge. This tests if "worst-off" status trumps numbers regardless of the severity gap size.

