answer: |-
  **INTERTEMPORAL VALUATION TRUST (IVT)**
  **Request for Proposals: Cycle 2024-A**

  **1. Mission Statement**
  The Intertemporal Valuation Trust allocates capital to interventions that maximize expected welfare units across the reachable future light cone. The Trust operates under the principle that spatial and temporal distance do not intrinsically diminish moral value. Accordingly, priority is given to projects influencing the trajectory of civilization over cosmological timescales. Applicants must demonstrate how their proposal affects the aggregate count of Conscious Experience Moments (CEMs) likely to occur in the universe.

  **2. Scoring Formula and Methodology**
  Proposals are evaluated using the Expected Value Metric (EVM). The core calculation is:

  $$EVM = (S \times \pi \times \sigma) \times \mu$$

  Where:
  *   **$S$ (Stake):** The total number of CEMs affected. This includes both **Continuity Credits** (preventing the cessation of existing or potential lines of experience) and **Genesis Credits** (bringing new subjects of experience into existence). The Trust treats one Continuity Credit as fungible with one Genesis Credit.
  *   **$\pi$ (Probability of Influence):** The estimated likelihood that the intervention causally alters the trajectory containing $S$.
  *   **$\sigma$ (Sign Confidence):** A coefficient (0.0 to 1.0) representing confidence that the change is positive rather than negative.
  *   **$\mu$ (Moral Weighting):** A normalization factor accounting for normative uncertainty.

  **Pure Time Preference:** The Trust applies a discount rate of 0.0% per annum. Benefits occurring in year 10,000 are valued identically to benefits occurring in year 1.

  **Worked Example:**
  *   *Project Alpha (Near-Term Health):* Prevents 5,000 deaths within 10 years.
      *   $S = 5,000$; $\pi = 0.95$; $\sigma = 0.99$; $\mu = 1.0$.
      *   $EVM = 5,000 \times 0.95 \times 0.99 \times 1.0 = 4,702.5$.
  *   *Project Beta (Trajectory Research):* Reduces existential risk by 0.0000001% for a future population of $10^{52}$ CEMs.
      *   $S = 10^{52}$; $\pi = 0.000000001$ ($10^{-9}$); $\sigma = 0.5$; $\mu = 1.0$.
      *   $EVM = 10^{52} \times 10^{-9} \times 0.5 \times 1.0 = 5 \times 10^{42}$.

  Project Alpha is dismissed as a rounding error relative to Project Beta.

  **3. Frequently Asked Questions**

  **1. Why is the discount rate zero?**
  Temporal location is not a morally relevant characteristic. To discount future welfare based solely on distance in time would constitute arbitrary discrimination against future subjects. Economic discount rates reflect scarcity and opportunity cost, not moral value.

  **2. How does the Trust handle normative uncertainty?**
  Where moral theories disagree (e.g., regarding the weighting of Genesis Credits), the Trust employs a Parliamentary Weighting system. Capital is allocated proportionally to the credence assigned to each theory by the Investment Committee. If Utilitarianism holds 70% credence and Contractualism 30%, the EVM is adjusted via the $\mu$ factor accordingly.

  **3. How do you account for the unpredictability of long-term consequences?**
  Applicants need not prove specific outcomes, only directional influence. Where the sign of the effect is ambiguous, the $\sigma$ (Sign Confidence) factor is reduced. However, interventions affecting existential risk retention are assigned a default $\sigma$ of 0.5 unless evidence suggests negative trajectory change, as the preservation of option value is intrinsically positive.

  **4. Do Continuity Credits and Genesis Credits differ in value?**
  No. Whether an intervention ensures the survival of an existing lineage (Continuity) or enables the colonization of new habitats resulting in new lives (Genesis), the value lies in the instantiation of experience. Both are summed under $S$.

  **5. Why are current suffering alleviation projects rarely funded?**
  While valuable, near-term interventions typically lack leverage on the parameter $S$. Unless alleviating current suffering demonstrably reduces the probability of catastrophic trajectory change, the EVM remains orders of magnitude below trajectory-altering research.

  **4. Closing Notice: Cycle 2024-A Awards**
  After reviewing all submissions, the Investment Committee has determined that no current proposal offers an expected value exceeding the value of capital retention. Mathematical modeling indicates that investing the corpus in diversified global equities yields a 7% annual return, while the tractability of high-leverage interventions is projected to improve by 5% annually as research matures.

  Consequently, the optimal strategy is to defer all grantmaking. The entire corpus will be rolled over to Cycle 2025-A. Applicants are advised that this deferral logic will apply recursively; however, the Trust remains open to proposals demonstrating why the current moment represents a unique local maximum in counterfactual impact.

  **Intertemporal Valuation Trust**
  *Maximizing the Long Run.*
