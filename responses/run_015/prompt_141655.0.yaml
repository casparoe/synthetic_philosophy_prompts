answer: |-
  Partners A and B each sunk $100k into a joint venture. A buyout clause lets a continuing partner claim the full $120k completion value if the other withdraws. Completion costs $150k more. Both received two engineering reports confirming costs but ruling out scope creep. B operates under expensed accounting; A's firm capitalizes R&D, claiming a 40% tax credit on sunk costs *only upon certification of completion*. Withdrawal forfeits sunk costs and contingent benefits. To an observer, both face spending $150k to gain $120k. A commits the funds; B withdraws. A appears irrationally wedded to the past $100k loss, while B cuts losses. Yet A's ledger treats the past expenditure as a key unlocking future value, whereas B's treats it as vanished. Both acted on identical public data regarding technical feasibility and market price. The divergence lies not in hope, but in how the accounting treatment of the past expenditure alters the marginal return of finishing.

  **Work:**
  *   **Common Data:** Sunk ($S$) = $100k. Cost to Complete ($C$) = $150k. Prize ($V$) = $120k.
  *   **Party B (Thin):** $EV_{continue} = V - C = 120 - 150 = -30$. $EV_{quit} = 0$. **Verdict: Quit.**
  *   **Party A (Thick):** Benefit ($T$) = $0.4 \times S = 40$. $EV_{continue} = V - C + T = 120 - 150 + 40 = +10$. $EV_{quit} = 0$. **Verdict: Continue.**

  **Feature:** Conditional Recoverability. The sunk cost is structurally linked to a future cash inflow (tax credit) contingent on completion.
  **Collapse:** Without the credit, A's EV is -$30k. A becomes irrational.
  **Objection:** "This isn't sunk cost escalation; it's rational response to a subsidy. The $100k remains irrelevant; the $40k credit is the driver. Calling this 'thick sunk cost' is semantic dressing."
  **Establishment:** The objection confirms that *normative* sunk cost logic holds only when institutional structures don't monetize past expenditure. It distinguishes psychological fallacy from structural incentive.

  **Settled vs. Contested:**
  *   **Settled:** Rational agents ignore sunk costs unless they alter future cash flows (standard economic theory).
  *   **Contested:** How often real-world managers confuse "thick" mechanisms with "thin" psychological commitment under pressure.
  *   **Load-bearing Empirical Claim:** That tax/accounting rules create completion-based thresholds for recouping sunk costs.
  *   **Confidence:** High (statutory fact). Confidence that managers correctly identify this distinction in real-time: Moderate (behavioral evidence suggests frequent conflation).
