  **OFFICE OF UNIFORM EXPERIENCE (OUE)**
  **DOCUMENT ID:** OUE-ADV-774-B
  **SUBJECT:** Evaluating Miracle Petitions: Guidance for Caseworkers
  **DATE:** October 24, 2023
  **CLEARANCE:** Level 1 Adjudication Staff

  **1. PURPOSE AND DEFINITIONAL BASELINES**
  This memorandum establishes standard operating procedures for adjudicating Claims of Anomalous Phenomena (CAPs), colloquially referred to as "miracle petitions." Pursuant to the Uniform Experience Act, caseworkers must adhere to strict evidentialist protocols. A "miracle" is defined administratively as a transgression of a law of nature by a particular volition or invisible agent. A "law of nature" is established by firm, unalterable, and uniform experience. Therefore, the evidentiary weight against any miracle is as complete as empirical observation can possibly render. The reasonable person proportions belief to the evidence. It is the mandate of this Office to ensure that no belief exceeds its evidentiary warrant.

  **2. THE ORDINARY COURSE LEDGER (OCL)**
  All adjudications begin with a query of the Ordinary Course Ledger (OCL). The OCL is the central database of uniform human experience. It records invariant regularities: biological cessation is permanent; hydrological substances do not ferment instantaneously without agency; gravitational constants hold across jurisdictions. The OCL supplies the prior probability against any petition. When a claimant submits testimony regarding a resurrection, the caseworker must note the OCL status for "Post-Mortem Vitality." If the OCL indicates zero verified instances across recorded history, the prior probability against the claim is maximal. Testimony alone cannot override the OCL unless it meets the Exception Threshold defined below. Caseworkers are reminded: the OCL is not suggestive; it is the baseline of reality.

  **3. THE MIRACLE EXCEPTION THRESHOLD (MET)**
  The core decision rule is the Balancing Test. Testimony may only establish a miracle if the falsehood of that testimony would be even more contrary to regular experience than the event reported. This is the Miracle Exception Threshold (MET). In practice, this requires that the likelihood of mass hallucination, coordinated deception, or clerical error be statistically lower than the likelihood of a law of nature being violated. Given the robustness of the OCL, the MET is functionally impenetrable. Caseworkers should note that human testimony has a known failure rate. When weighing the reliability of witnesses against the stability of gravity or biology, the stability of biology always carries greater evidentiary weight. Approval requires testimony so robust that its falsification would constitute a miracle in itself. To date, no petition has cleared the MET.

  **4. COMPETING MIRACLES AND HUMAN FACTORS**
  **4.1 Competing Miracles Desk:** When petitions arise from rival theological traditions claiming incompatible wonders (e.g., Miracle A validates Religion X; Miracle B validates Religion Y), the evidence cancels out. Since both cannot be true, and both rely on similar testimonial structures, the Office denies both. The destruction of one claim by another reduces the evidentiary weight of all such claims to null.
  **4.2 Bias-Training Module:** Caseworkers must account for known psychological variables. Human subjects exhibit a documented "Love of Surprise," leading to embellishment. Credulity is high in populations with low scientific literacy. Reports originating from distant geographies, ancient timelines, or unfamiliar cultures are flagged for high risk; such distances impede verification and correlate with higher rates of myth-making. A claim from a remote province regarding a weeping idol is treated as high-risk data, not because the population is dishonest, but because the distance prevents OCL cross-referencing.

  **5. ADJUDICATION EXAMPLES**
  The following annotated samples illustrate proper application of the MET and OCL protocols.

  **CASE FILE:** 884-Kappa (Denied)
  **Claim:** Subject deceased for 72 hours; returned to full vitality following prayer.
  **Caseworker Annotation:**
  *   **OCL Check:** "Post-Mortem Vitality" shows 0.00% occurrence rate. Prior against claim: Maximum.
  *   **Testimonial Weight:** 12 witnesses. Known history of religious fervor.
  *   **MET Analysis:** Is it more miraculous that 12 witnesses erred (premature burial confirmation, hallucination) or that biological law reversed? Witness error is common (see OCL entry: "Human Error"). Biological reversal is unprecedented.
  *   **Decision:** DENIED. Testimony does not exceed the OCL prior.

  **CASE FILE:** 992-Omega (Pending/Unprocessable)
  **Claim:** Sun halted in sky for 48 hours; observed globally.
  **Caseworker Annotation:**
  *   **OCL Check:** "Celestial Motion" shows 0.00% interruption. Prior against claim: Maximum.
  *   **Testimonial Weight:** Global consensus reported in ancient texts.
  *   **MET Analysis:** If true, this clears the MET (falsehood of global observation is highly miraculous).
  *   **Complication:** Competing Miracles Desk notes rival traditions claim the sun halted for different reasons in different eras. Evidence cancels. Additionally, no contemporary instrumental data exists.
  *   **Decision:** UNPROCESSABLE. Even global testimony fails when competing traditions neutralize evidentiary weight and instrumental verification is absent.

  **6. COMPLIANCE NOTE**
  Caseworkers are reminded that denial is not a judgment on the claimant's faith, but a compliance necessity. To approve a miracle is to violate the Uniform Experience Act. The stability of reality depends on our refusal to validate anomalies. If a petition ever clears the MET, the Competing Miracles Desk will likely nullify it. This is not cynicism; it is good governance. Maintain the Ledger. Trust the Experience.

  **END OF DOCUMENT**
