answer: |-
  You are correct to suspect that the standard label, 'Pascal's Mugging', is too broad for the specific carve-out you are describing. While the mugging scenario is the canonical *example* of this reasoning, the term usually refers to the entire decision-theoretic paradox (the conflict between unbounded utility and reasonable action) rather than the specific rhetorical or epistemic feature you have isolated: the insensitivity of the conclusion to the specific magnitude of the stake, provided it is 'large enough'.

  There is no single, canonical term in the literature that isolates this specific feature. It is generally subsumed under discussions of 'Pascalian reasoning', 'fanaticism', or 'expected value overreach'. However, none of these terms precisely capture the *invariance* property you have identified.

  Since nothing established fits the carving you require, I will coin a term for it. I propose calling this phenomenon **Magnitude Invariance** (specifically, within the context of **Endogenous Staking**).

  Below is the definition, the application to your boundary cases, and the distinctions you requested. I have flagged where I am reporting on general consensus within the rationalist community and where I am offering my own analysis.

  ### The Carving: Magnitude Invariance

  **Definition:**
  Magnitude Invariance is a property of an argument where the conclusion relies on a quantity (the stake) that is supplied by the arguer, and where the conclusion remains unchanged across an enormous range of values for that quantity, provided it exceeds an implicit threshold.

  For an argument to exhibit Magnitude Invariance, it must satisfy three conditions:
  1.  **Endogeneity:** The magnitude is not measured or discovered; it is selected or constructed by the arguer to support the conclusion.
  2.  **Insensitivity:** The conclusion does not scale with the magnitude. If the stake were increased or decreased by orders of magnitude (within the 'large' range), the recommendation would remain identical.
  3.  **Threshold-Transcendence:** The magnitude is used solely to ensure the expected value exceeds a certain (often unstated) bar of significance, effectively treating the stake as functionally infinite relative to the probability.

  **Epistemic Status:**
  *   **Consensus:** There is broad agreement in decision theory and rationalist circles that arguments relying on arbitrarily large stakes to swamp small probabilities are suspect (the core of the Pascal's Mugging objection).
  *   **My View:** The specific identification of *insensitivity to magnitude* as a distinct failure mode, separate from the probability estimation error, is not standardly named but is a valid and useful analytical distinction. I am proposing 'Magnitude Invariance' to fill this gap.

  ### The Two Instances

  Your two instances are indeed the same phenomenon, viewed from different angles.
  *   **Instance 1** describes the *logical structure*: the derivative of the conclusion with respect to the stake is zero (once the stake is 'large').
  *   **Instance 2** describes the *dialectical process*: the stake is adjusted iteratively to maintain the conclusion in the face of skepticism.

  Both reveal that the number is not doing the work of a measurement; it is doing the work of a lever.

  ### Boundary Cases

  Here is how the definition of Magnitude Invariance settles your three boundary cases.

  **Case One: Measured Quantities**
  *   *Scenario:* The quantity is measured (e.g., the number of people currently alive).
  *   *Verdict:* **Not Magnitude Invariance.**
  *   *Reasoning:* This fails the **Endogeneity** condition. The number is constrained by the world, not chosen by the arguer to force a conclusion. If new data showed the population was half as large, a non-invariant argument would adjust its conclusion (e.g., halve the estimated good). In a Magnitude Invariant argument, the arguer would simply insist the number is still 'large enough' to warrant the same action, regardless of the measurement.

  **Case Two: Fixed, Pre-committed Numbers**
  *   *Scenario:* The arguer fixed the number in advance, before knowing the audience's threshold.
  *   *Verdict:* **Borderline, but likely Not Magnitude Invariance.**
  *   *Reasoning:* This fails the spirit of the **Endogeneity** condition regarding the *listener's* threshold. While the number is supplied by the arguer, it is not *fitted* to overcome skepticism. However, if the arguer maintains the same conclusion even when shown that their fixed number is wrong by several orders of magnitude, it *does* exhibit Insensitivity.
  *   *Refinement:* I would classify this as **'Rigid Staking'**. It shares the Insensitivity feature but lacks the strategic fitting of Instance 2. It is a cousin of Magnitude Invariance, but the diagnostic power is lower because it could simply be honest error rather than motivated reasoning. Magnitude Invariance specifically implies the number is doing no work *because* it was chosen to do no work other than clear the bar.

  **Case Three: Threshold-Dependent Conclusions**
  *   *Scenario:* The argument fails for small stakes and succeeds for large ones.
  *   *Verdict:* **Not Magnitude Invariance.**
  *   *Reasoning:* This fails the **Insensitivity** condition. This is ordinary expected value reasoning. If the conclusion moves with the magnitude, the magnitude is doing work. Magnitude Invariance requires that the conclusion be flat across the range of 'large' numbers. If doubling the stakes doubles the urgency, it is not invariant.

  ### Distinctions from Nearby Concepts

  **1. Respectable Small-Chance/Large-Stakes Arguments**
  *   *Distinction:* In a respectable argument, the magnitude is **Exogenous** and **Sensitive**.
  *   *Explanation:* If you argue for asteroid deflection, the number of lives at stake is estimated from population data (Exogenous). If we discovered the asteroid would only hit an uninhabited island, the argument would weaken or vanish (Sensitive). In Magnitude Invariance, the number is a free variable used to guarantee the conclusion regardless of empirical updates.

  **2. Pascal's Mugging**
  *   *Distinction:* Pascal's Mugging is the **Scenario**; Magnitude Invariance is the **Mechanism**.
  *   *Explanation:* You already know the name 'Pascal's Mugging'. That term refers to the paradox where a tiny probability of a huge payoff dominates expected utility. My proposed term, Magnitude Invariance, describes the specific *feature* of the mugger's argument that makes it unmoored from reality: the fact that the specific size of the threat is irrelevant as long as it is 'big'. One can discuss Pascal's Mugging without isolating this feature; isolating this feature allows you to critique arguments that aren't literal muggings but share the same structural flaw.

  **3. Scope Insensitivity (Psychological)**
  *   *Distinction:* Scope Insensitivity is a **Listener Bias**; Magnitude Invariance is an **Arguer Strategy**.
  *   *Explanation:* Scope insensitivity describes the finding that people do not *feel* more moved by 200,000 lives than 20,000. Magnitude Invariance describes an arguer *claiming* you should be equally moved (or that the action is equally warranted) regardless of whether the stake is $10^{50}$ or $10^{100}$. One is a bug in human psychology; the other is a bug in the argument's logic.

  ### Summary of the Term

  If you bring this to your reading group, I suggest you introduce it as follows:

  > "I am calling this **Magnitude Invariance**. It occurs when an arguer treats a quantity as endogenous and uses it to swamp a probability, such that the specific value of the quantity does not change the conclusion provided it is 'large enough'. Unlike standard expected value arguments, the magnitude here is a lever, not a measurement."

  **Consensus Check:**
  People working on longtermism and existential risk (the fields where this pattern most frequently appears) would accept the *description* of the phenomenon without argument. They frequently discuss 'robustness' to parameter changes. However, labelling this specific failure mode 'Magnitude Invariance' is my own proposal. You will not find it in a glossary. It is a useful coinage for the specific carve-out you have identified, distinguishing the *structural insensitivity* from the broader *Pascalian* label.

  **Final View:**
