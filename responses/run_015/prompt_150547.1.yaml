      *   **My Role:** Professional moral philosopher + decision theory expert under deep uncertainty.
      *   **Constraint:** Don't just survey evidence or list positions. Provide a *diagnosis*. Stress-test the user's hypothesis. Be honest if it's ill-posed.

  2.  **Deconstruct the Stalemate:**
      *   *Camp 1 (Skeptics):* Insects aren't subjects. Focus on crop/ecology. (Deontological/Threshold view on consciousness).
