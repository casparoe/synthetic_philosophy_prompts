          *   No citations needed, just the operationalized framework.
          *   Highlight divergence (flag it, don't resolve it).

  2.  **Deconstruct Lemkin's Framework vs. UN Convention:**
      *   *UN Convention (1948):* Focuses on physical/biological destruction of national, ethnical, racial, or religious groups. Political and cultural groups were explicitly excluded during drafting.
      *   *Lemkin's Original Concept (Axis Rule in Europe, 1944):* Included cultural, political, and social destruction. "Genocide" meant the disintegration of political and social institutions, culture, language, national feelings, religion, and economic existence, *in addition to* mass killing.
      *   *Challenge:* Annotators aren't lawyers. The procedure needs to be heuristic, not juridical.

