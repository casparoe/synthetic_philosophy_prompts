answer: |-
  The slogan functions not as a substantive premise but as a question-begging assertion of agent-relative constraints that refuses to engage the aggregative logic of the paradox of deontology.

  To understand why this move is frustratingly inert in a workshop setting, we need to disaggregate the slogan into five distinct philosophical claims it might be encoding, ranging from trivial stipulations to indefensible absolutes.

  **1. The Stipulative Definition (Trivial)**
  On its weakest reading, the slogan merely defines "justice" as non-consequentialist compliance. If "justice" means "keeping promises regardless of outcomes," then the sentence translates to "keep promises regardless of outcomes."
  *   **Status:** True but useless.
  *   **Work Done:** None. This is consistent with consequentialism if the consequentialist argues our definition of justice is flawed. It assumes the conclusion that justice is not outcome-dependent.

  **2. The Agent-Relative Constraint (The Standard Deontological Move)**
  This is the claim your colleague actually needed: moral reasons are agent-relative, not just agent-neutral. I have a specific reason not to *violate* a right that is weightier than my reason to prevent *others* from violating rights.
  *   **Status:** **Live Dispute.** This is the core of the paradox of deontology (Scheffler). Consequentialists deny this distinction has moral weight; deontologists assert it.
  *   **Work Done:** This does the necessary work, but the slogan merely asserts it rather than arguing for it. Saying "fiat justitia" is just shouting "agent-relative constraints exist!" at someone who denies them.
  *   **My Position:** I contend this is the only defensible core of the slogan, but it requires independent justification (e.g., regarding integrity or agency) that the slogan itself does not provide.

  **3. The Metaphysical Separateness of Persons (The Rawlsian/Nozickian Grounding)**
  Here, the slogan expresses the claim that social utility cannot override individual boundaries because there is no "social entity" that suffers the loss; only distinct individuals do. Aggregation is therefore metaphysically illegitimate.
  *   **Status:** **Broadly Settled as Motivation, Disputed as Proof.** It is settled that this is *why* many deontologists hold Thesis 2. It is heavily disputed whether this metaphysical fact successfully blocks aggregation (see: Kamm, Quinn, and recent aggregativists).
  *   **Work Done:** Provides the grounding for Thesis 2, but "heavens fall" rhetoric obscures the metaphysical nuance.

  **4. Lexical Priority (Threshold Deontology)**
  This reading claims justice has lexical priority over welfare up to a catastrophic threshold. The "heavens falling" implies the threshold is extremely high, but not necessarily infinite.
  *   **Status:** **Defensible.** Most plausible deontological views are threshold views, not absolute ones.
  *   **Work Done:** Partial. It explains why we don't violate rights for minor gains, but the slogan's hyperbole ("heavens fall") suggests absolutism, which weakens the position against cases of genuine catastrophe.

  **5. Consequence Insensitivity (Radical Absolutism)**
  The strongest reading is that consequences literally provide no moral reason against the just act, even if the "heavens fall" (i.e., universal destruction).
  *   **Status:** **False.** Almost no contemporary ethicist defends this. Even Kantians usually allow for conflicting duties or catastrophic overrides.
  *   **Work Done:** Counterproductive. Invoking this makes deontology look fanatical rather than principled.

  **The Verdict on Your Colleague's Move**
  Your colleague used Thesis 5 rhetoric to shield Thesis 2. In the context of the paradox of deontology, the consequentialist is asking: "If rights violations are bad states of affairs, why not minimize them?" The slogan answers: "Because justice isn't about states of affairs." This is a category mistake, not a solution. It refuses to play the consequentialist game rather than winning it.

  **Where I Take a Side:**
  I argue that relying on this slogan is intellectually lazy because it conflates Thesis 2 (which is arguable) with Thesis 5 (which is untenable). To actually resolve the paradox, one must argue for the normative significance of the *doing/allowing* distinction (Thesis 2) using the separateness of persons (Thesis 3), not simply invoke a maxim that treats consequences as morally invisible. The slogan is a conversation stopper that protects the deontologist from having to explain why agent-relative reasons outweigh agent-neutral ones in cases of aggregate harm.
