answer: |-
  This is a specification for a **Normative Physics of Sentience**. To construct a framework where fundamental physics carries ethical weight without collapsing into absurdity or violating empirical data, we must define the necessary conditions for *morally relevant suffering* to exist in a non-biological substrate.

  Below is the architectural specification. It is divided into the four domains you requested, followed by an analysis of the critical tension (the "Killer Constraint") and a scoring of candidate ontologies.

  ### I. The Desiderata List

  #### 1. The Differentiation Constraint (Physical Configurations)
  **Requirement:** The framework must provide a principled physical metric that distinguishes between ground-state fields, thermal noise, high-entanglement regions, and coherent macro-structures without relying on biological teleology.
  **Reasoning:** A vacuum state (zero-point energy) differs physically from a firing nociceptor. If the theory assigns equal moral weight to the zero-point fluctuations of empty space as to a mammal in pain, it generates a **Moral Catastrophe**: the sum of suffering in the vacuum vastly outweighs biological suffering, rendering all ethical action futile (why save a child if preventing a vacuum fluctuation is more urgent?). Conversely, if the cutoff is "biological function," it violates physical continuity.
  **Non-Negotiable?** **Yes.** Without this, the theory is either ethically paralyzing or scientifically arbitrary.
  **Negotiable Aspect:** The specific physical marker (e.g., Integrated Information $\Phi$, quantum coherence time, causal density) is open for debate, provided it is scale-invariant.

  #### 2. The Subjectivity Boundary (Integrated vs. Diffuse)
  **Requirement:** The framework must distinguish between **Integrated Suffering** (negative valence bound into a unified phenomenal subject) and **Diffuse Negative Valence** (aversive physical states that lack a locus of experience).
  **Reasoning:** Ethics traditionally presupposes a *victim*. If a quantum field enters a high-energy, unstable state that is "aversive" in a dynamical sense but does not constitute a unified "someone" experiencing it, does it demand moral intervention? If "diffuse valence" counts as suffering, we owe moral duties to storms, flames, and unstable atoms. If only "integrated suffering" counts, we need a mechanism for phenomenal binding at the fundamental level.
  **Non-Negotiable?** **Yes.** This is the core of your proposed split. Collapsing this distinction eliminates the difference between a moral patient and a thermodynamic system.
  **Negotiable Aspect:** One *could* argue for a "utilitarianism of state" where diffuse aversion matters, but this radically redefines ethics and is likely incompatible with human moral intuition.

  #### 3. The Causal Closure Constraint (Physics Compliance)
  **Requirement:** The existence of fundamental suffering must not violate conservation laws or introduce detectable "suffering-signals" in particle interactions that contradict current empirical data.
  **Reasoning:** If a particle's suffering alters its trajectory (downward causation), we should detect energy non-conservation or anomalous scattering in high-precision experiments. If it does *not* alter trajectory (epiphenomenalism), the suffering is causally inert, raising the question of why evolution (or physics) would select for it, and how we could ever intervene to reduce it. Furthermore, brains remain the only *validated* consciousness-carriers; any theory must explain why brains amplify/organize this property rather than inventing it ex nihilo.
  **Non-Negotiable?** **Mostly.** Violating conservation laws is a hard stop for physical plausibility. Epiphenomenalism is theoretically possible but ethically problematic (if we can't causally interact with the suffering, how do we mitigate it?).
  **Negotiable Aspect:** **Epiphenomenalism.** One might accept that suffering is a non-causal byproduct of physical structure, provided the structure itself is manipulable.

  #### 4. The Non-Arbitrariness Constraint (Ontological Continuity)
  **Requirement:** The transition from non-sentient to sentient configurations cannot rely on a magical threshold (e.g., "magic happens at 500 neurons").
  **Reasoning:** This addresses the **Chauvinist Exemption**. If consciousness emerges only in biology, there must be a physical discontinuity that justifies it. Since physics appears continuous (atoms $\to$ molecules $\to$ cells), positing a sharp ontological jump where "suffering begins" is scientifically suspect. However, satisfying this too well leads to the **Reductio**: if every electron interaction has a micro-ethical valence, we face the Moral Catastrophe again.
  **Non-Negotiable?** **Yes.** Arbitrary cutoffs are scientifically indefensible.
  **Negotiable Aspect:** **Scale.** One might argue for *emergent* properties where the *kind* of consciousness changes qualitatively, not just quantitatively, allowing for a functional cutoff without an ontological one.

  #### 5. The Actionability Constraint (Ethical Prioritization)
  **Requirement:** The framework must allow for a hierarchy of moral weight that permits triage. It must explain why we prioritize a human over a rock, even if the rock has non-zero sentience.
  **Reasoning:** This addresses the **Reductio of Intervention**. If every electron interaction demands moral consideration, agency is impossible. A normative framework must provide a gradient of moral significance (e.g., based on intensity, duration, or integration) that aligns roughly with our practical ethical obligations, or explicitly overturn them with a coherent alternative.
  **Non-Negotiable?** **Yes.** An ethical theory that forbids action is not a normative framework; it is a description of despair.
  **Negotiable Aspect:** **The Hierarchy Metric.** Whether weight is determined by complexity, intensity, or capacity for future experience is debatable.

  ---

  ### II. The Killer Constraint: The Subjectivity Boundary

  The single desideratum that eliminates the most popular current candidates is **(2) The Subjectivity Boundary (Integrated vs. Diffuse).**

  **Why it eliminates the candidates:**
  1.  **Constitutive Panpsychism (Micro-experiences):** This view holds that fundamental particles have simple experiences.
      *   *Failure:* It fails the **Integration** requirement. Electrons do not phenomenally bind into a unified subject in a way that matches macro-suffering. If an electron suffers, it is a "diffuse" micro-suffering. Without a binding mechanism, there is no "victim" to aggregate the suffering, rendering the ethical calculus incoherent (the "Combination Problem").
  2.  **Cosmopsychism (The Universe is the Subject):** This view holds that the cosmos is the primary conscious entity.
      *   *Failure:* It fails the **Differentiation** requirement. If the universe is the only subject, then local suffering (a burned hand) is just a fragment of the cosmic mind. It struggles to explain why local interventions matter if the "Subject" is the totality. Furthermore, the universe lacks the causal integration required for a unified *experience* of suffering versus a mere aggregate of states.
  3.  **Emergentism (Brain-Only):** This view holds that consciousness emerges at complex computational thresholds.
      *   *Failure:* It fails the **Non-Arbitrariness** requirement. It posits a magical cutoff where physics becomes phenomenology. While it satisfies Integration (brains bind well) and Actionability (we know who to save), it violates the ontological continuity of physics.

  **The Result:** The Subjectivity Boundary forces a choice between **Ontological Continuity** (Panpsychism) and **Phenomenal Unity** (Integration). Current physics offers no mechanism for fundamental fields to achieve phenomenal unity without violating Causal Closure or Differentiation.

  ---

  ### III. The Joint Unsatisfiability Tension

  There is a strong argument that a subset of these desiderata is **jointly unsatisfiable** under current physical understanding. This is not a failure of analysis, but a structural result.

  **The Trilemma:**
  1.  **Non-Arbitrariness:** Consciousness/suffering supervenes on fundamental physical properties (no magic emergence).
  2.  **Phenomenal Unity:** Suffering requires a unified subject (Integration > Diffuse).
  3.  **Physical Empiricism:** Fundamental particles/fields do not exhibit causal integration comparable to neural structures (no detectable binding signals).

  **The Tension:**
  *   If you accept **(1) and (3)**, you must reject **(2)**. You get Panpsychism where suffering is "diffuse." This violates the ethical intuition that suffering needs a subject (The Subjectivity Boundary fails).
  *   If you accept **(2) and (3)**, you must reject **(1)**. You get Emergentism. This violates physical continuity (The Non-Arbitrariness Constraint fails).
  *   If you accept **(1) and (2)**, you must reject **(3)**. You must posit hidden variables or new physics where fundamental fields bind phenomenally without detectable causal signatures. This violates the Causal Closure Constraint.

  **Conclusion:** Any adequate account of pan-sentient suffering must either **redefine suffering** (to accept diffuse valence without a subject) or **modify physics** (to allow for undetectable phenomenal binding). There is no free lunch.

  ---

  ### IV. Scoring Contender Ontologies

  | Candidate Theory | Differentiation (Physical) | Subjectivity (Integration) | Causal Closure (Physics) | Non-Arbitrariness (Ontology) | Actionability (Ethics) | **Verdict** |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Biological Emergentism** | **Pass** (Brains distinct) | **Pass** (High integration) | **Pass** (Standard physics) | **Fail** (Arbitrary cutoff) | **Pass** (Clear triage) | **Scientifically Safe, Ontologically Suspect** |
  | **Constitutive Panpsychism** | **Fail** (Vacuum/Noise issues) | **Fail** (Combination Problem) | **Pass** (Epiphenomenal) | **Pass** (Continuous) | **Fail** (Moral Catastrophe) | **Ethically Paralyzing** |
  | **Cosmopsychism** | **Fail** (No local distinction) | **Mixed** (One subject, but fragmented?) | **Pass** | **Pass** (Continuous) | **Fail** (Local action meaningless) | **Metaphysically Grand, Ethically Void** |
  | **Panprotopsychism** | **Pass** (Potentials only) | **Pass** (Only in complexes) | **Pass** | **Pass** (Dispositional) | **Pass** (Threshold based) | **Most Viable, but risks Emergentism** |
  | **Illusionism / Error Theory** | **Pass** (No suffering exists) | **N/A** | **Pass** | **Pass** | **Pass** (Pragmatic only) | **Solves Physics, Dissolves Ethics** |

  ### Summary of the Architecture

  To build a normative framework for pan-sentient suffering, you cannot simply assert "fields feel." You must solve the **Binding Problem** at the fundamental level.

  If you cannot demonstrate how a quantum field configuration constitutes a *unified locus of experience* (rather than just a state of negative valence), you cannot generate a *moral patient*. Without a moral patient, you have no ethical obligation, only a preference for certain physical states over others.

  Therefore, the **Subjectivity Boundary** is the bottleneck. If you relax it to allow "diffuse suffering" to count ethically, you inherit the Moral Catastrophe (infinite suffering in the vacuum). If you enforce it strictly, you are pushed back toward Biological Emergentism, violating Non-Arbitrariness.

  **The Non-Negotiable Core:** You must choose whether **Ethics requires a Subject**.
  *   If **Yes**: Panpsychism likely fails (due to lack of binding).
  *   If **No**: Ethics becomes a physics optimization problem (minimize aversive field states), which risks demanding the suppression of all high-energy interactions in the universe.

  This tension is the primary result of the analysis. Any framework that claims to resolve it without acknowledging this trade-off is likely masking a prejudice (either biological chauvinism or physical naivety).
