answer: |-
  Here is a complete lesson plan for "The Blyme Futures Market." It is designed to fit 75 minutes, requires minimal prep, and adheres strictly to your constraint of no jargon until the debrief.

  ### **Materials & Setup**
  *   **14 Identical Vials:** Clear plastic vials with screw tops, filled with tap water.
      *   *Prep:* Before class, mark the bottom of 7 vials with a tiny dot of red nail polish (Batch A) and 7 with blue (Batch B). Ensure the liquid looks identical.
  *   **Tokens:** 50 poker chips or slips of paper ("Credits").
  *   **Contract Slips:** Small index cards (2 per student).
  *   **Betting Slips:** Small index cards (1 per student).
  *   **Seating:** Arrange students in a loose circle or two rows facing each other to facilitate trading.

  ---

  ### **Phase 1: Ostension & The Futures Market (30 Minutes)**

  **1. Introduction (5 mins)**
  *   Hand out the vials randomly. Ensure red/blue are mixed throughout the room.
  *   **Script:** "Take the vial. Do not open it yet. For the purposes of this seminar, the substance in this vial is called **'blyme'**. That is all you know. It is blyme."
  *   **Instruction:** "You now have an asset. Your goal is to end the game with the most Credits."

  **2. The Market (15 mins)**
  *   **Script:** "You have 10 minutes to form pairs. In your pair, you will sign a **Futures Contract**. On the card, write: *'I promise to deliver 5ml of blyme to my partner.'* Both sign."
  *   **The Catch:** "Once signed, you cannot break the contract. If the contract is valid, you both gain 10 Credits. If the contract is void, you both lose 5 Credits."
  *   **Trading:** Students will pair up. They will likely assume all blyme is the same. Encourage them to inspect vials (they can't open them). They might try to trade vials to "match" them, but since they look identical, they are guessing.
  *   **Commitment:** Collect the signed contracts.

  **3. The Reveal (5 mins)**
  *   **Script:** "Stop trading. I need to update the market conditions. It turns out 'blyme' is not one thing. Half of you have **Alpha-Blyme**. Half have **Beta-Blyme**. They look the same, taste the same, and feel the same. But chemically, they are distinct. Alpha and Beta do not mix."
  *   **The Audit:** Go around the room. Check the bottom of the vials for the dots.
  *   **Scoring:**
      *   If a pair both have Alpha or both have Beta: **Valid Contract.** (+10 Credits each).
      *   If a pair has one Alpha and one Beta: **Void Contract.** (-5 Credits each).
  *   **Observation:** Watch the frustration. Students who were *sure* they meant the same thing as their partner will lose points through no fault of their own experience or intention.

  ---

  ### **Phase 2: The Chain of Custody (25 Minutes)**

  **1. Setup (5 mins)**
  *   Select 8 students to form a "Chain." Have them stand in a line at the front.
  *   Give Student 1 a **Red (Alpha)** vial.
  *   **Script:** "Student 1, look at this. Say: 'This is blyme.' Pass the vial to Student 2. Student 2, acknowledge it, say 'This is blyme,' and pass it down. Continue until Student 8."
  *   **Instruction to Audience (the other 6 students):** "Watch the chain. You will bet on what the word 'blyme' refers to when it leaves Student 8's mouth."

  **2. The Swap (5 mins)**
  *   As the vial moves from Student 4 to Student 5, intervene.
  *   **Action:** Take the Red vial from Student 4. Hand Student 5 a **Blue (Beta)** vial from your pocket.
  *   **Constraint:** Do this smoothly. Do not announce it. The Chain participants must not notice the swap. The Audience *sees* the swap happen but must keep silent.
  *   Student 8 receives the Blue vial, looks at it, and says: "This is blyme."

  **3. The Bet (10 mins)**
  *   Hand Betting Slips to the 6 Audience members (and the 8 Chain members, now seated).
  *   **Question:** "When Student 8 said 'This is blyme,' what did the word 'blyme' pick out?"
  *   **Options:**
      *   **A:** The original Red vial (Student 1's sample).
      *   **B:** The current Blue vial (Student 8's sample).
      *   **C:** Nothing (The word broke/failed).
  *   **Wager:** Students wager their accumulated Credits on A, B, or C.
  *   **Reveal:** Reveal the swap. Collect bets. (Do not declare a "correct" answer yet; save that for the debrief).

  ---

  ### **Phase 3: The Debrief (20 Minutes)**

  *Now* you introduce the vocabulary. Write **Externalism**, **Twin Earth**, **Causal Theory**, and **Division of Linguistic Labor** on the board.

  **1. Mapping the Market (Internal State vs. Extension)**
  *   **Ask:** "In Phase 1, did anyone intend to sign a bad contract?" (No). "Did anyone have a different internal experience of 'blyme' than their partner?" (No). "Yet half of you lost points. Why?"
  *   **Point:** Meaning wasn't in your head (internal state); it was fixed by the stuff in the world (extension). Two speakers can be in identical psychological states but mean different things because the world is different. This is the **Twin Earth** intuition.

  **2. Mapping the Chain (Causal vs. Descriptive)**
  *   **Ask:** "Who bet on A (Original)? Who bet on B (Current)?"
  *   **Point:** If you bet on **A**, you intuited a **Causal-Historical Theory** of reference (Kripke/Putnam). The word rides the chain of transmission, regardless of the object currently present.
  *   **Point:** If you bet on **B**, you intuited a **Descriptive Theory**. Student 8 described the object in front of them; since the description fits the Blue vial, that's the reference.
  *   **Point:** If you bet on **C**, you intuited that reference requires a *successful* causal link. If the chain is broken (by the swap), the word refers to nothing.

  **3. The Discovery**
  *   **Ask:** "Did the meaning of 'blyme' change when I announced the Alpha/Beta split?"
  *   **Point:** No. The *knowledge* changed, but the *reference* was fixed when you first got the vial. This illustrates that reference is often fixed by an initial baptism or causal contact, not by our ongoing descriptions.

  ---

  ### **Predictable Failure Points (Pre-Mortem)**

  1.  **The "It's Just Water" Rebellion:**
      *   *Risk:* A student opens a vial, tastes it, and says, "It's tap water. This is fake."
      *   *Mitigation:* Pre-empt this. "For the logic of this game, you must accept my stipulation as metaphysical fact. If you break the stipulation, you forfeit the game." Treat it like a logic puzzle axiom.
  2.  **Epistemic vs. Semantic Confusion:**
      *   *Risk:* Students will argue the Market Phase was about *knowledge* ("I didn't *know* it was Beta"), not meaning.
      *   *Mitigation:* Press them: "If it were just about knowledge, the contract would still be valid, you just wouldn't know it. But the contract was *void*. The *terms* of the agreement failed, not just your knowledge of them."
  3.  **The Chain Swap is Too Obvious:**
      *   *Risk:* Student 5 notices the vial is slightly different (condensation, scratch) and ruins the "identical internal state" premise.
      *   *Mitigation:* Use brand new vials for the chain. Practice the sleight of hand. If they catch the swap, pivot: "Okay, you detected a difference. But imagine you *didn't*. If you were molecule-for-molecule identical to Student 1, would you mean the same thing?"
  4.  **Time Creep:**
      *   *Risk:* The Market phase drags on as students try to "inspect" vials.
      *   *Mitigation:* Be a strict auctioneer. "30 seconds to pair up. Go."

  ---

  ### **Honest Limitations (What the Game Can't Do)**

  You cannot dramatize these points with the game; you must state them explicitly in the debrief.

  1.  **The Authority Problem:**
      *   *Limitation:* In the game, *you* (the instructor) are the arbiter of what is Alpha and Beta. In real externalism, *nature* is the arbiter.
      *   *Fix:* Tell them: "In this game, I am the World. In reality, the molecular structure is the World. I'm just standing in for the facts."
  2.  **The Division of Linguistic Labor:**
      *   *Limitation:* Putnam argues that *experts* fix the reference (e.g., scientists define 'gold'), and laypeople defer to them. This game treats everyone as equal laypeople. It doesn't show *who* has the authority to distinguish Alpha from Beta.
      *   *Fix:* Add a note in the debrief: "In a real society, some of you would be chemists. You would defer to them to tell you if your contract was valid. That deference is part of the meaning."
  3.  **Normativity:**
      *   *Limitation:* The game shows reference *is* external, but not why it *ought* to be. It doesn't explain why Student 8 is *wrong* to think they mean the Blue vial if they are a Descriptivist.
      *   *Fix:* Acknowledge that the game forces an externalist scoring rule, but doesn't prove Descriptivism is impossible, only that it yields different truth conditions in this specific scenario.

  ### **Why This Works**
  By tying "winning" (points) to the hidden chemical composition rather than the students' intentions or descriptions, you force them to feel the **friction of the world** against their internal states. When they lose points on a contract they *thought* was valid, they experience the failure of internalism viscerally before they ever hear the word "externalism."
