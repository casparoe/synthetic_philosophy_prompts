  6.  **Addressing the "What will go wrong" (Pre-mortem):**
      *   *Giggles/Skepticism:* "It's all water." They might break character.
      *   *Confusion:* They might think it's a trick about attention, not semantics.
      *   *The "Stipulation" Problem:* If the instructor just *says* it's different, smart students will say "But it's not." The game relies on *suspension of disbelief* or treating the stipulation as a metaphysical fact for the sake of the game.
      *   *Time:* 75 mins is very short for two complex phases.
      *   *The "Win" Condition:* If the stakes are too low, they won't care. If too high, they get anxious.
      *   *The Chain:* Passing liquid is messy. Better to pass the *vial*.
      *   *Reference Intuitions:* Students might have divergent intuitions on the Chain phase (some are descriptivists, some causal). The game won't solve this, just expose it.

  7.  **Addressing the "Limitations" (Honest Assessment):**
      *   The game relies on the Instructor's authority for the "Alpha/Beta" distinction. Real externalism relies on the *world*, not the teacher.
