      *   **Flourishing (Constructive):** Rooted in Aristotelian eudaimonia, hedonism (positive), or objective list theories. Value is symmetrical or positive-weighted. Absence of pain is good, but presence of joy/achievement is *better*. The ceiling is high positive.
