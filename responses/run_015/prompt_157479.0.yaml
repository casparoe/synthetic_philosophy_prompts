answer: |-
  ### Prep Sheet: Network-Density Axiology Q&A

  **Strategic Concession (Say this in your opening or first Q&A response)**
  Concede immediately that you are not offering a completed formal welfare function. Tell them: *"I am proposing a structural constraint on axiology, not a new arithmetic for summing utility. Think of this as a phase-shift model rather than a ledger."* This disarms the economist's demand for equations and frames your view as ontological rather than computational.

  ---

  ### Objections & Replies (Ordered by Damage)

  **1. The Stipulative Dodge (The "Prayer" Question)**
  *Phrasing:* "Isn't this just verbal sleight of hand? If you define 'value' as 'network density' rather than 'summed welfare,' you haven't solved the Repugnant Conclusion; you've just changed the subject. Why should we accept your definition of value over the standard one?"
  *Reply (2 mins):* "That's the core challenge. Standard axiology treats individuals as atomic containers of welfare—like buckets of water. I'm arguing that value is more like an ecosystem: it emerges from interactions, not just volume. If you add too many organisms to a tank, the system collapses, and the 'welfare' inside those buckets becomes meaningless because the context sustaining it is gone. I'm not redefining value to avoid the conclusion; I'm arguing the standard definition ignores the structural prerequisites for value to exist at all. The Repugnant Conclusion assumes welfare is additive regardless of context. I'm denying that premise empirically and ontologically. If the network collapses, the welfare isn't 'low,' it's structurally void."
  *Weakness Flag:* **High.** If they press that you've conflated *conditions for welfare* with *welfare itself*, you risk circularity. You need to hold the line that structure is constitutive of value, not just instrumental.

  **2. The Formalization Challenge (The Economist's Attack)**
  *Phrasing:* "Without a formal function, how do you compare worlds? Is density monotonic? What happens at the margin? If you can't specify the trade-off rate between population size and density, this is just intuition dressed as theory."
  *Reply (2 mins):* "You're right that I lack a closed-form equation, and I welcome collaboration on that. But consider carrying capacity in ecology: we know the collapse point exists even if we can't precisely model every variable beforehand. My claim is that there is a non-linear threshold where adding lives reduces total value negatively, not just dimishingly. I'm asking you to accept a constraint condition: *Value = f(Welfare, Density)* where Density acts as a multiplier that can approach zero. We don't need the exact curve to know that pushing past capacity is catastrophic. Let's treat this as a proposal for the *shape* of the function, not the coefficients."
  *Weakness Flag:* **Medium-High.** Analytic philosophers hate vague thresholds. If they ask "Where exactly is the collapse?", admit it's context-dependent but insist the *existence* of the limit is what matters for blocking RC.

  **3. The Separability Objection (The Analytic Ethicist)**
  *Phrasing:* "This violates the principle of separability. Are you saying the moral value of my happy life depends on how many other people exist? That makes value holistic in a way that seems to undermine individual rights."
  *Reply (2 mins):* "It does violate separability, and I accept that cost. Standard population ethics assumes individuals are morally independent atoms. I'm arguing from a relational ontology: persons are nodes in a network. A node's value is partly determined by its connectivity. If the network becomes so sparse or so congested that connection breaks down, the node's value changes. This isn't about rights; it's about the metaphysics of value. If you insist on separability, you get the Repugnant Conclusion. If you want to avoid RC, you have to accept some form of holism. I'm just making that holism explicit."
  *Weakness Flag:* **Medium.** Many ethicists view separability as a non-negotiable axiom. You might alienate the department if you dismiss this too casually. Frame it as a necessary trade-off.

  **4. The "Prioritarianism in Drag" Objection**
  *Phrasing:* "Isn't this just prioritarianism or weighted utilitarianism? You're giving extra weight to the 'structure' which effectively weights the worse-off or the connected. Why use marine metaphors instead of standard distributive justice terms?"
  *Reply (2 mins):* "Prioritarianism weights welfare based on individual levels. Network density weights value based on relational capacity. They can overlap, but they aren't identical. A world of isolated wealthy individuals might score high on prioritarianism but low on network density. The marine metaphor isn't just decoration; it highlights *carrying capacity* and *systemic collapse*, which distributive justice models often miss. We're talking about systemic viability, not just distribution. The metaphor forces us to look at the container, not just the contents."
  *Weakness Flag:* **Low.** This is easier to defend, but ensure you don't let them reduce your view to a mere variant of existing theories. Insist on the *structural collapse* mechanism.

  ---

  ### Framing Critique (Straight Talk)

  Your framing is risky. To an analytic philosopher, "network density" sounds like vague holism unless you define whether it is *instrumental* (density helps welfare) or *constitutive* (density is part of welfare).
  *   **If Instrumental:** You haven't solved RC. You've just made an empirical claim that billions of people will be miserable. Parfit already considered this (the "Badness of Quality of Life" objection).
  *   **If Constitutive:** You are changing the definition of "good," which invites Objection #1 (The Dodge).
  *   **The Marine Metaphor:** It's your strength and your weakness. It makes the idea vivid, but economists will hear "externality" and ethicists will hear "organicism." Don't let the metaphor do the philosophical work. Use it to illustrate, not to argue.
  *   **Is it Confused?** It borders on confusion if you don't distinguish between *welfare* (phenomenological experience) and *value* (axiological worth). If you say dense networks create more welfare, you're making a psych claim. If you say dense networks are *better* even if welfare is equal, you're making a perfectionist claim. Be clear which one you mean.

  Verdict: This prep holds together only if you firmly distinguish structural value from individual welfare without retreating into vagueness.

  \answer{The network-density move works as a compelling heuristic for rejecting total utilitarianism but fails as a rigorous logical solution without a formalized definition of "density" and its relation to welfare.}
