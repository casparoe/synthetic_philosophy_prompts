  1. The record supports a calibration rule requiring accuracy in the decision band, an error-equality rule limiting false denial disparities, and a procedural rule prioritizing disclosure and appeal over statistical metrics. Case 1 enforces calibration and process, while Case 3 explicitly permits error disparity if trade-offs are published.

  2. The calibration rule predicts rejection due to the fifteen-point eligibility gap, unless the auditor's noise exception is accepted. The error-equality rule predicts rejection given the 1.9x disparity, while the procedural rule predicts approval based on the agency's full disclosure and audit commitment.

  3. Case 3 is the closest analogue because it approved a model with known calibration and error disparity under conditions of transparency and audit. It carries only so far because the 1.9x error disparity here significantly exceeds Case 3's 1.3x ratio, and the base rate divergence is much sharper.

  4. My best guess is approval via the procedural rule, so I recommend arguing that transparency satisfies consistency given the statutory ban on group-specific thresholds. Approving commits us to prioritizing contestability over parity, while rejecting would commit us to demanding statistical fixes even when legally or technically impossible.

  5. A case where the sample size is large enough to statistically confirm the calibration gap would distinguish whether noise excuses validate the procedural rule over the calibration rule. This would force the committee to decide if indistinguishable bias is ethically equivalent to no bias.
