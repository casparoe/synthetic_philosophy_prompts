      *   Defect location? Yes.
      *   Properties of good indicator? Yes.
      *   Edge cases (2 false, 1 true)? Yes.
      *   American English? Yes.

      *(Self-Correction on Edge Cases)*:
      *   Case 1 (Looks like, isn't): Disagreement on *baseline*. (e.g., Is 5% high or low?) This isn't bidirectional; it's just disputed data.
      *   Case 2 (Looks like, isn't): A metric that genuinely supports a complex middle ground. (e.g., Economic growth vs. Inequality). Both sides claim parts, but acknowledge trade-offs.
      *   Case 3 (Is, doesn't look like): Theological arguments (God's existence). Or Conspiracy theories (absence of evidence is evidence of coverup). Let's use Conspiracy Theories as the "doesn't look like" because it's not usually a "statistic." Or better: **Clinical Placebo Effects.** Sometimes improvement is "real healing," sometimes it's "natural variation." Both sides claim the data. Actually, the **Conspiracy Theory** example is the strongest logical parallel (absence of proof = proof of concealment).

      *Wait, let's refine the "Is it but doesn't look like".* The prompt asks for an instance of the *pattern* (bidirectional metric) that doesn't *look* like the assisted dying debate.
