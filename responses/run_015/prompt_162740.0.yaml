      *   **Analysis (Spin vs. Structure):**
          *   Is it the number? No, numbers are inert.
          *   Is it the story? Yes. The "narrative wrapper" determines the meaning.
          *   Is it spin? Yes, specifically *retroactive framing*.
          *   Distinction from Double Standard: A double standard applies different rules to different people. This applies different *interpretations* to the same data for the *same* goal.
          *   Distinction from Slippery Slope: Slippery slope is about prediction (A leads to B). This is about post-hoc interpretation of A.
