  2.  **Deconstruct the Phenomenon:**
      *   *Pattern:* Metric $X$ changes (Up/Down/Stable).
      *   *Side A (Pro):* Interprets $X$ as validation.
      *   *Side B (Con):* Interprets $X$ as validation.
      *   *Key Feature:* The interpretation flips based on the direction, but the *conclusion* (Pro/Con) remains fixed.
      *   *User's Insight:* When asked "What number would change your mind?", proponents/opponents couldn't answer. This suggests unfalsifiability.
      *   *User's Doubt:* Is it the *number's* fault (ambiguous evidence) or the *people's* fault (motivated reasoning)?
      *   *Observation:* The user notes that the *same* people praise low numbers one year and high numbers later. This implies shifting goalposts or retroactive rationalization.

  3.  **Identify Existing Concepts:**
      *   *Confirmation Bias / Motivated Reasoning:* Close, but the user feels this is about the *structure* of the argument, not just the psychology.
      *   *Unfalsifiability:* Very close. If no evidence can count against the position, it's unfalsifiable.
      *   *Heads I win, Tails you lose:* This is the colloquial equivalent.
      *   *Kafkatrapping:* No, that's about denial proving guilt.
      *   *Motte-and-Bailey:* Related, but usually about shifting definitions, not interpreting data.
      *   *God of the Gaps:* No.
      *   *Self-Sealing Argument:* This is a strong candidate. An argument that cannot be disproven because any counter-evidence is reinterpreted as support.
      *   *Texas Sharpshooter Fallacy:* No, that's about finding patterns in noise.
      *   *Ambivalent Evidence:* Descriptive, not a fallacy name.

      *Decision:* There isn't one single perfect Latin term for "a metric that supports both sides regardless of direction." However, **"Self-Sealing Argument"** or **"Unfalsifiable Hypothesis"** covers the logical structure. In rhetoric, this is often called **"Heads I Win, Tails You Lose."** In the context of data interpretation, it's often a sign of **"Motivated Reasoning"** applied to **"Ambivalent Evidence."**
      *   *Coining a Term:* The user asked to coin one if none exists. "Bidirectional Rationalization" or "Omni-confirmatory Evidence." Let's go with something punchy. **"The Janus Metric"** (two faces looking opposite ways) or **"Bidirectional Validation."** Let's stick closer to logical fallacies. **"The Self-Sealing Metric."** Actually, the most precise philosophical term is **"Unfalsifiability"** manifested through **"Ad Hoc Rescue."** But the specific pattern of *one variable supporting opposite claims based on direction* is often called **"The Heads/Tails Fallacy."**
      *   *Refinement:* The user wants to know if it's a property of the *number* or the *reasoner*. It's usually the reasoner using the number. The number is ambiguous; the reasoning makes it absolute.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the observation. Validate that this is a known problem in policy debates.
      *   **Naming:**
