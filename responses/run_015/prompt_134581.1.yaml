      *   *Core Definition:* A lie is a false signification uttered with the *will to deceive* (voluntas fallendi).
      *   *Key Distinction:* Falsehood $\neq$ Lie. You can speak falsehood without lying (error), and truth without lying (accidental truth told to deceive).
      *   *The "Signification" Aspect:* Language is a system of signs. To lie is to use signs against their purpose (to communicate what is in the mind).
      *   *The "Will" Aspect:* The intent is crucial. If I say something false believing it true, it's not a lie (it's a mistake). If I say something true intending you to believe false, it's a lie.
      *   *The "Play/Custom" Aspect:* Augustine distinguishes between serious assertion and jest/fiction. If the context signals "we are not mapping reality here," it's not a lie (e.g., parables, jokes).
      *   *The "Beneficial Lie" Problem:* Augustine famously rejects the "officious lie" (lying to help someone). The *kind* of lie might vary in gravity, but the *act* remains sinful/wrong because it corrupts the soul and the social fabric of trust.
      *   *Concealment:* Hiding truth $\neq$ Lying. "I do not wish to answer" is permissible; "X is Y" (when X is not Y) is not.

