answer: |-
  # THE WILL-TO-TRUTH CHECK (Augustinian Care Protocol)
  **Purpose:** Identifies if an act is a **Lie** (false signification + will to deceive). Does **not** determine if it is *Permitted* (that requires human triage).
  **Users:** CNA, Nurse, Family. **Time:** < 3 mins.

  ### 1. THE ASSERTION TEST
  **Question:** Am I presenting this as a fact about the shared world, or as play/story?
  *   **YES (Fact):** Proceed to Step 2.
  *   **NO (Play):** Not a lie. *(Contested: Some read Augustine as saying if the listener cannot understand it is play—e.g., dementia—it counts as assertion. Under that reading, proceed to Step 2.)*
  *   **STOP:** If you are singing, joking, or clearly in a "game" context where truth is suspended.

  ### 2. THE BELIEF TEST
  **Question:** Do I want the listener to believe this statement is true?
  *   **YES:** Proceed to Step 3.
  *   **NO:** Not a lie. (e.g., You are making noise to soothe, indifferent to belief).
  *   **STOP:** If your goal is purely sensory soothing and you don't care if they believe the words.

  ### 3. THE KNOWLEDGE TEST
  **Question:** Do I know this contradicts reality?
  *   **YES:** Proceed to Step 4.
  *   **NO:** Not a lie. (This is an error/mistake, not a lie).
  *   **STOP:** If you believe what you are saying is true.

  ### 4. THE MEANS TEST
  **Question:** Is their false belief the *tool* I am using to achieve the goal (e.g., stopping distress)?
  *   **YES:** **THIS IS A LIE.** (You have willed the deception).
  *   **NO:** Proceed to Step 5. *(Contested: Augustine generally holds that if you foresee the deception and speak anyway to get a result, you will it. Under a stricter reading, Foresee = Will.)*
  *   **STOP:** If the belief is irrelevant to the outcome (rare).

  ### 5. THE SILENCE TEST
  **Question:** Am I speaking falsely, or just hiding the truth/deflecting?
  *   **SPEAKING FALSE:** **THIS IS A LIE.**
  *   **HIDING/DEFLECTING:** Not a lie. (Concealment is permitted; false assertion is not).
  *   **STOP:** "I can't answer that" or changing the subject is not a lie.

  ### 6. THE AUDIENCE TEST
  **Question:** Is anyone else (family, other staff) hearing this and being deceived?
  *   **YES:** **THIS IS A LIE** (regarding that third party).
  *   **NO:** Proceed to Triage.

  ---

  ### 🚪 THE CORRIDOR TEST
  *(Use when theory fails)*
  **"If they asked me tomorrow, 'Did you tell me the truth?', could I look them in the eye and say 'Yes' without wincing?"**
  *   If **No**: You have willed a disconnect between your mind and your speech. It is a lie.

  ---

  ### ⚠️ TRIAGE POINTS (HUMAN DECISION REQUIRED)
  *The procedure identifies the Lie. It does not forbid it. These points require value judgment.*

  1.  **Step 1 (Assertion):** Deciding if "validation therapy" counts as *Play* or *Fact*.
      *   **Who Decides:** Care Plan Meeting / Ethics Lead.
      *   **Value:** Do we prioritize orientation to reality or emotional comfort?
  2.  **Post-Procedure (Permission):** You have identified a **LIE**. Augustine says *never*. Care may say *necessary*.
      *   **Who Decides:** You (The Staff).
      *   **Value:** Weighing spiritual/integrity cost vs. immediate physical/emotional harm.
      *   **Rule:** If you proceed, own it. Do not call it "truth." Call it "care."

  ---

  ### CASE RUNS

  **(a) CNA tells resident dead husband "got held up, he'll be here after dinner."**
  1.  **Assertion:** Yes (Presented as fact).
  2.  **Belief:** Yes (Must believe he is coming to stay).
  3.  **Knowledge:** Yes (Knows he is dead).
  4.  **Means:** Yes (Belief is the tool to stop elopement).
  5.  **Silence:** No (Spoke false).
  6.  **Audience:** Resident only.
  *   **OUTPUT:** **LIE.** (Officious Lie).
  *   **PUSH BACK:** Step 4/Post-Procedure. You have willed deception as a means. Augustine forbids this absolutely. To proceed, you must decide that preventing immediate physical harm (elopement) overrides the disorder of the will. This is a *value override*, not a reclassification.

  **(b) Staff tell resident living in 1974 "we'll clock you out at five."**
  1.  **Assertion:** **CONTESTED.** (Is this entering their world or making a fact claim? If "Play," stop. If "Fact," continue).
      *   *Strict Reading:* It is an Assertion (Resident hears it as fact).
  2.  **Belief:** Yes.
  3.  **Knowledge:** Yes.
  4.  **Means:** Yes.
  *   **OUTPUT:** **LIKELY LIE.** (Unless formally designated as "Therapeutic Play" by care plan).
  *   **PUSH BACK:** Step 1. The Care Plan Meeting must define if "Validation" is a "Play Context." If yes, not a lie. If no, it is a lie.

  **(c) Nurse tells daughter "she was fine last night" (meaning: she didn't suffer, but actually she didn't sleep).**
  1.  **Assertion:** Yes.
  2.  **Belief:** Yes (Nurse intends daughter to believe "fine" = "normal/slept").
  3.  **Knowledge:** Yes (Knows she didn't sleep).
  4.  **Means:** Yes (Daughter's false belief is the tool to prevent worry).
  5.  **Silence:** No.
  6.  **Audience:** **Third Party.** (Daughter is deceived).
  *   **OUTPUT:** **LIE.**
  *   **PUSH BACK:** Post-Procedure. This is a lie to a competent adult. The "harm reduction" argument is weaker here than with the resident. The Nurse must decide if the daughter's distress outweighs the trust violation.

  ---

  ### LIMITATIONS: WHAT THIS CANNOT DO
  1.  **Weigh Harm:** This card identifies *lies*, not *necessary evils*. It cannot tell you if the lie is "worth it." (Augustine says it's never worth it; you must decide if you are an Augustinian or a Caregiver in that moment).
  2.  **Solve Step 1:** It cannot objectively decide if dementia validation is "Play." That is a policy decision, not a logical one.
  3.  **Remove Guilt:** If you identify an act as a Lie and do it anyway, this procedure will not absolve you. It ensures you know the cost.
  4.  **Predict Trust:** It cannot calculate when "inconsistent answers" will shred family trust. That requires human intuition.
