answer: |-
  **Eulogy for Dr. Miriam Ashdown**

  Miriam left a note before she died. It was brief, typical of her, and it said: *Don't tell them where I am. Tell them what I was doing.*

  That instruction is harder to follow than it looks. When we gather in a hall like this, with flowers and music and a hundred and twenty people who loved her, the instinct is to place her. We want to say she is in a better place, or that she is gone forever, or that she is somewhere beyond our understanding. But Miriam spent thirty-eight years teaching us that the question of *where* a person is after death is a trap. She believed that trying to answer it was the problem, and that refusing to answer was the most practical thing one could do.

  So, I will not tell you where Miriam is. I will tell you what she was doing.

  She was working. She was working right up until the end. For those of you who knew her only as the woman in the community garden, you know she was working the soil. She knew that a tomato plant does not care about your metaphysics; it cares about water, sunlight, and nitrogen. She argued with the zoning board about compost bins not because she loved bureaucracy, but because she loved the fact that rules, like plants, depend on conditions to grow. She knew that if you want the conventional world to work, you have to tend to it conventionally.

  Daniel, your mother knew that structures need a foundation. She respected that about you. She often said that an engineer understands better than anyone else that a bridge holds weight not because it is magical, but because the forces balance. She saw her philosophy the same way. She didn't ask you to believe in the bridge. She asked you to walk across it.

  For her colleagues and students, she was working the arguments. There is a scholar here today who spent twenty years disagreeing with her in print. Miriam cherished those disagreements. She taught that a rigorous objection is a form of intimacy. When you take the time to dismantle someone's view, you are acknowledging that their view matters. She never tried to win those debates by planting a flag of her own. She won by showing that the ground beneath the debate was shared.

  There is a Sanskrit term she used often: *śūnyatā*, which she glossed simply as "open space." She taught that a cup is useful not because of the clay, but because of the empty space inside that holds the tea. Some people heard that and thought she meant the cup was an illusion. She meant the cup was perfectly real, perfectly usable, and perfectly breakable. She meant that because the cup is empty of a fixed, unchangeable nature, it can function. Because Miriam is not fixed in a permanent state, her life can function in us. Her absence is not a void; it is the space that allows our memories to take shape.

  To the philosophers in the room: She taught us that when we ask if a thing exists, does not exist, both, or neither, we are often just trapped by the grammar of the question. She never planted a flag, only a seed.

  To the rest of us: She taught us that grief is not a mistake. It is a conventional truth. "Miriam is dead" is a true statement. "We miss her" is a true statement. She did not think that acknowledging pain required a mystical安慰 (comfort). She thought pain was what happens when we care about things that change. She cared about us. We are changing. This hurts. That is not a puzzle to be solved. It is a condition to be met with kindness.

  In a few moments, her sister Padma will perform a dedication of merit. For those who wonder what that means in a room with skeptics and believers: it is an act of giving. In Miriam's view, the value of a gift does not depend on whether the receiver is physically present to hold it. The value is in the handing over. Padma is offering love. That love lands. It lands in this room, in our memories, in the work Miriam started. It does not need to travel to a supernatural realm to be real. It is real because it changes us, here, now.

  Miriam would have had opinions about this service. She would have liked the lack of incense, knowing Daniel's sensitivity to smoke. She would have had a very specific critique of the second hymn's meter. She would have been pleased that the zoning board sent a condolence card.

  She was doing the work of a teacher, a gardener, a sister, and a friend. She cleared the table so we could sit down. She showed us that we don't need to know where the wind is going to feel it on our faces.

  So, we will not speculate on her destination. We will occupy her departure. We will water the garden. We will finish the arguments. We will sing the hymn, even if the meter is off. We will do the work she was doing.

  Thank you.

  ***

  **Private Note for the Speaker**

  Here are the three critical moves where the speech adheres to the Madhyamaka discipline you requested, contrasting what was said with what a careless eulogy would have done:

  1.  **The Four Corners (Tetralemma) Avoidance:**
      *   *What the speech does:* It explicitly refuses to locate Miriam metaphysically ("I will not tell you where Miriam is"). It shifts the predicate from *her state* to *our activity* ("We will occupy her departure").
      *   *What a careless eulogy would say:* "She is now at peace," "She is no longer suffering," or "She has returned to the source." All of these assert a position on the tetralemma (existence, non-existence, etc.). The speech treats "Miriam is dead" as a conventional truth valid for the mourners, without making it an ultimate truth about her ontology.

  2.  **Refusing the "Velvet Fifth Corner":**
      *   *What the speech does:* It defines *śūnyatā* (emptiness) functionally ("open space," "the cup holds tea") rather than mystically. It validates grief as a "conventional truth" and "a condition to be met," rather than transcending it.
      *   *What a careless eulogy would say:* "She is beyond words now," or "She is one with everything." This turns emptiness into a comforting *something* (a mystical presence). The speech keeps emptiness as a lack of inherent obstruction, allowing the ordinary pain of loss to remain real and un-mystified.

  3.  **Repayment vs. Deposit (The Merit Dedication):**
      *   *What the speech does:* regarding Padma's ritual, it frames the "dedication of merit" as an act of giving that changes the *giver and the room*, regardless of the receiver's metaphysical status ("The value is in the handing over").
      *   *What a careless eulogy would say:* "We know she will receive this merit in the next life" (underwriting the metaphysics for Daniel's sake) or "This is just a symbolic gesture" (undercutting it for Padma's sake). The speech repays the conventional value of the act without depositing a view on whether "merit" is a transferable substance. It validates the *function* of the ritual without validating the *ontology* of the afterlife.
