answer: |-
  Here is an analysis of your Commission's jurisprudence, a prediction for the Tessaria Opinion, and the tools to stage the hearing.

  ### 1. The Prediction: Opinion No. 6 (Tessaria)

  **Verdict:** **Unlawful** and **Not Justified.**

  **The Rule:** **The Doctrine of Disinterested Transience.**
  Your Commission operates on a hidden principle that humanitarian force is a temporary emergency measure, akin to a firebreak. It is permissible only if it is *self-terminating* and *disinterested*.
  *   **Transience:** The intervention must end when the atrocity ends. Long-term occupation, political reconstruction, or "interim administrations" that last years convert a humanitarian mission into a political conquest. (This distinguishes Kosovo/East Pakistan from Cambodia/Iraq/Tessaria).
  *   **Disinterestedness:** The intervener must seek no political or economic advantage. The mining concessions in Tessaria are fatal. (This distinguishes Tessaria from Kosovo, where no territory or assets were claimed).

  **Why this fits the precedents:**
  *   **Kosovo & East Pakistan (Justified):** Both stopped killing, but both withdrew quickly and claimed no territory or economic rights.
  *   **Iraq, Cambodia, Libya (Not Justified):** All involved regime change followed by long-term political instability, occupation, or client-state installation.
  *   **Tessaria:** Fails on both counts. It lasted seven years (Cambodia), installed an interim administration (Cambodia/Iraq), and involved economic extraction (Iraq). The initial UN authorization saves it from being *Iraq*, but the conduct makes it *Libya* on steroids.

  ---

  ### 2. The Competing Rules (The Arguments for the Hearing)

  You identified four candidate rules. Here is how they stand against the five precedents and where they fracture on Tessaria.

  **A. The Mandate-Integrity Rule**
  *   **Principle:** Lawfulness is determined strictly by adherence to the Security Council resolution. Justification is presumed negative if the mandate is exceeded.
  *   **Fits Precedents 1–5:** Yes. It explains why Kosovo/East Pakistan/Cambodia/Iraq are Unlawful (no resolution) and why Libya is Unlawful *as conducted* (exceeded resolution).
  *   **Verdict on Tessaria:** **Unlawful / Not Justified.**
  *   **The Argument:** "The Resolution authorized protection of Vardene, not the capture of the capital. By advancing on the capital, the Union became an aggressor. Lawfulness is not a one-time gift; it is a continuous condition."

  **B. The Long-Horizon Consequentialist Rule**
  *   **Principle:** Justification is a calculus of net lives saved over a decade. Lawfulness is secondary to the outcome.
  *   **Fits Precedents 1–5:** *Strained.* It fits Iraq (Not Justified) and Kosovo (Justified). It struggles with Cambodia: the killing stopped (good outcome), yet it was ruled Not Justified. To fit Cambodia, this rule must weigh "political stability" as heavily as "lives saved."
  *   **Verdict on Tessaria:** **Unlawful / Justified (Minority Opinion).**
  *   **The Argument:** "Fifty thousand people are not dead. The killing stopped in month one. The insurgency is low-intensity. Compared to the counterfactual of ongoing genocide, this is a moral success. Lawfulness is a technicality; the dead do not care about mandates."

  **C. The Acceptance Rule**
  *   **Principle:** Justification depends on the consent of the governed.
  *   **Fits Precedents 1–5:** *Ambiguous.* In Kosovo, the Albanians accepted it. In Iraq, the populace turned. In Cambodia, the population was relieved but the insurgency persisted. The Commission has never defined *which* population matters.
  *   **Verdict on Tessaria:** **Unlawful / Split Verdict.**
  *   **The Argument:** "Seventy states recognize the interim government. The Vardene politicians dominate the administration. They accept the intervention. However, the General Assembly calls for withdrawal, and the rump state resists. Is the 'people' the province saved, or the state violated?"

  **D. The Clean Hands Rule (Mixed Motives)**
  *   **Principle:** Humanitarian justification is voided if the intervener derives significant economic or strategic benefit.
  *   **Fits Precedents 1–5:** Yes. It explains why Iraq (oil/strategy) and Cambodia (client state/strategic depth) failed, while Kosovo (no gain) succeeded.
  *   **Verdict on Tessaria:** **Unlawful / Not Justified.**
  *   **The Argument:** "You cannot save a people and then invoice them. The mining concessions granted in year two prove this was never purely humanitarian. It was a land grab with a moral pretext."

  ---

  ### 3. The Underdetermination

  The five precedents genuinely underdetermine the sixth. The Commission has never had to weigh **Initial Authorization** against **Long-Term Occupation** in a single case.

  *   **Closest Analogue for "Justified":** *Kosovo.*
      *   *Similarity:* Stopped the killing effectively; regional alliance; no formal annexation.
      *   *Difference:* Kosovo had no UN auth (Unlawful) but withdrew quickly. Tessaria has UN auth (initially) but stayed for seven years.
      *   *Principle Committed:* **Humanitarian Supremacy.** (Saving lives trumps mandate creep and occupation).

  *   **Closest Analogue for "Not Justified":** *Libya + Cambodia.*
      *   *Similarity:* Libya provides the "Mandate Breach" precedent; Cambodia provides the "Long Occupation/Client State" precedent. Tessaria is the hybrid of these two failures.
      *   *Difference:* Tessaria has more international recognition (70 states) than the Cambodian client regime had.
      *   *Principle Committed:* **Procedural Integrity.** (The process of international law and the prohibition on conquest cannot be bypassed, even for good ends).

  **The Dramatic Choice:**
  If the Commission rules **Justified**, they validate the "Might for Right" argument. It makes the interveners tragic heroes who broke the rules to save lives.
  If the Commission rules **Not Justified**, they validate the "Slippery Slope" argument. It makes the interveners cautionary tales who started as saviors and became occupiers.

  ---

  ### 4. The Tie-Breaker Case (Opinion No. 7)

  To let a careful reader distinguish the surviving rules in future chapters, you need a case that separates **Mandate Integrity** from **Disinterested Transience**.

  **Case:** *The Boravian Corridor (Invented)*
  *   **Facts:** A UN Resolution authorizes force to protect a besieged ethnic minority in Boravia. The intervening force realizes the only way to stop the killing is to strike a military base *outside* the authorized zone. They do so. The killing stops immediately. The force withdraws within three months. They take no territory, seek no concessions, and install no government.
  *   **The Split:**
      *   **Mandate-Integrity Rule:** **Unlawful.** (They struck outside the authorized zone).
      *   **Disinterested Transience Rule:** **Justified.** (They stopped the killing, sought no gain, and left immediately).
      *   **Consequentialist Rule:** **Justified.** (Net lives saved).

  If your Commission later rules Boravian **Unlawful**, you know they are Legalists (Mandate-Integrity). If they rule **Justified**, you know they are Moralists (Transience/Consequentialist).

  ---

  ### 5. Advice for the Hearing

  **Choose the "Not Justified" Verdict.**

  **Why?**
  1.  **Conflict:** A "Justified" verdict ends the moral debate. The interveners were right. A "Not Justified" verdict forces the characters to grapple with guilt. They saved lives, but they corrupted the law and became occupiers. That is richer soil for a novel.
  2.  **Consistency:** It aligns Tessaria with *Libya* and *Cambodia*, which feels legally robust. It is harder to argue that a 7-year occupation with mining concessions is "Justified" than it is to argue it was "Necessary."
  3.  **The Hearing Dynamic:**
      *   **The Prosecution (Commission Chair):** Focuses on the *mining concessions* and the *seven-year timeline*. "When did the rescue end and the occupation begin?"
      *   **The Defense (Intervener/Protagonist):** Focuses on the *50,000 dead who didn't die*. "Would you have let them die to keep your hands clean?"
      *   **The Swing Vote:** Focuses on the *UN Resolution*. "You had a key to the house, but you used it to remodel the kitchen and sell the furniture."

  **The Hidden Tension:**
  The most dramatic element in your setup is the **General Assembly vs. Security Council** dynamic.
  *   The Security Council (where vetoes happen) has been silent/ambivalent.
  *   The General Assembly (where the Global South sits) has called for withdrawal twice.
  *   70 States recognize the interim government.
  *   **The Hearing Question:** Who speaks for the "International Community"? The 70 recognizers, or the GA demanding withdrawal? This allows your characters to argue about *legitimacy* vs. *legality*.

  **Final Recommendation:**
  Draft Opinion 6 as **Unlawful / Not Justified**.
  Let the dissenting opinion argue for **Justified** based on the "Net Lives" (Consequentialist) rule.
  This creates a Commission that is consistent (punishing long-term occupation) but morally conflicted, which gives your characters room to maneuver. The "Doctrine of Disinterested Transience" is the silent engine of your world: *You may break the law to save a life, but you may not stay to collect the rent.*
