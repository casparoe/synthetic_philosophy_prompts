  - he wants bribery of public officials to stay criminal, no surprise there.
  - he says adultery shouldn't be criminalized; it's a private moral failure, not a public harm.
  - he supports the ban on commercial surrogacy, but not on "babies are commodities" grounds — he says it exploits vulnerable women and corrupts medical ethics.
  - he's against flag-burning bans and similar symbolic desecration laws; shared offense isn't the same as tangible harm.

  now there's this proposal being floated: legalizing private combat clubs where consenting adults fight with rules allowing serious bodily injury, done in private with medical staff present, no audience, no betting — essentially boxing with fewer guardrails and no state licensing.

  would he say keep it banned or let it stand? i'm less interested in just the answer than in laying out the two or three plausible rules that fit his track record so far, what each predicts about these clubs, your best guess with reasons, and which of his earlier cases is the closest analog for each rule. also name one further hypothetical case that would actually split those rules apart, since they might converge here.

  please also say what would change your mind about which rule he's running — like what argument or distinction would flip your call — and flag where your reasoning is shakiest.
