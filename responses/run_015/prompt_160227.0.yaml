  # You got someone to believe something false without saying anything false. Now who are you?

  **Instructions:** Start at the top. Answer each question based on your intuition about the case described. Follow the branch that matches your answer until you reach a leaf. Read the view at the leaf to see what moral position you've landed on.

  **The Anchor Case:** Priya is asked by her department chair whether she supports reappointing a colleague whose grant money is the only thing keeping the PhD line alive. She thinks he's a terrible teacher and a worse colleague. She answers, truthfully, "I have no objection to the reappointment paperwork going forward" — knowing the chair will hear that as endorsement, since in this department nobody ever says anything positive out loud.

  ---

  ### The Decision Tree

  **Node 1:** Did the speaker utter any sentences at all?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 3.

  **Node 2:** (If No) Did the speaker arrange physical facts to ensure the false belief (e.g., planting evidence)?
  *   **Yes:** **Leaf 1: The Stage-Manager.**
  *   **No:** **Leaf 2: Innocent Silence (Empty).** *Diagnosis: Incoherent. If no words and no arranged facts, no false belief was caused by the speaker.*

  **Node 3:** (If Yes) Was the hearer asking a direct yes/no question?
  *   **Yes:** Go to Node 4.
  *   **No:** Go to Node 5.

  **Node 4:** (If Direct) If the hearer had pressed, "So are you saying P?", would the speaker have said "Yes"?
  *   **Yes:** **Leaf 3: The Subjunctive Liar (Empty).** *Diagnosis: Unattractive. Makes moral status depend on a counterfactual pressure test rather than the actual act.*
  *   **No:** Go to Node 5.

  **Node 5:** Is there a local convention (e.g., poker, academia) where true statements are expected to be misleading?
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 7.

  **Node 6:** (If Convention) Does the hearer know the convention code?
  *   **No:** **Leaf 4: The Code-Breaker.**
  *   **Yes:** Go to Node 7.

  **Node 7:** Did the speaker select true facts to omit info OR phrase truths to imply falsehoods?
  *   **Omission:** Go to Node 8.
  *   **Implicature:** Go to Node 8. *(Note: This distinction tracks method, but both lead to the same normative judgment here.)*

  **Node 8:** Was the speaker motivated by avoiding the *label* "liar"?
  *   **Yes:** Go to Node 9.
  *   **No:** Go to Node 10.

  **Node 9:** (If Label) Is the worry primarily about formal audit records?
  *   **Yes:** **Leaf 5: The Compliance Officer (Empty).** *Diagnosis: Unexplored. Reduces morality to bureaucratic risk management.*
  *   **No:** Go to Node 10.

  **Node 10:** Did the hearer actually end up believing the falsehood?
  *   **No:** **Leaf 6: The Transparent Evader.**
  *   **Yes:** Go to Node 11.

  **Node 11:** Did the speaker care whether the hearer's belief was true?
  *   **No:** **Leaf 7: The Cynical Operative.**
  *   **Yes:** Go to Node 12.

  **Node 12:** Is the wrong located primarily in the assertion itself?
  *   **Yes:** **Leaf 8: The Literalist.**
  *   **No:** Go to Node 13.

  **Node 13:** Is lying strictly worse than misleading?
  *   **Yes:** **Leaf 9: The Trust-Breaker.**
  *   **No:** **Leaf 10: The Deception Absolutist.**

  *(Note: To meet leaf constraints, Leaf 10 covers both Equivalence and Misleading Worse depending on further nuance not captured here.)*

  ---

  ### Leaf Key & Anchor Case Verdicts

  1.  **The Stage-Manager:** *Awkward Commitment:* Must condemn planting evidence as harshly as lying even without words. *Priya:* Permissible (she spoke).
  2.  **Innocent Silence (Empty):** *Diagnosis:* No causal link to false belief. *Priya:* N/A.
  3.  **The Subjunctive Liar (Empty):** *Diagnosis:* Moral status changes based on what you *would* have said under pressure. *Priya:* Impermissible (she would confirm).
  4.  **The Code-Breaker:** *Awkward Commitment:* Wrongness depends entirely on whether the hearer knows the secret handshake. *Priya:* Impermissible (Chair doesn't know code).
  5.  **The Compliance Officer (Empty):** *Diagnosis:* Morality tracks HR sanctions rather than harm or truth. *Priya:* Permissible (no audit trail).
  6.  **The Transparent Evader:** *Awkward Commitment:* Act is permissible just because the hearer was too smart to be fooled. *Priya:* Impermissible (Chair was fooled).
  7.  **The Cynical Operative:** *Awkward Commitment:* Intent to deceive matters less than indifference to truth. *Priya:* Impermissible (she cares about outcome).
  8.  **The Literalist:** *Awkward Commitment:* Must permit causing false belief so long as sentences are true. *Priya:* Permissible.
  9.  **The Trust-Breaker:** *Awkward Commitment:* Lying breaches a specific warranty that misleading does not. *Priya:* Permissible (no lie uttered).
  10. **The Deception Absolutist:** *Awkward Commitment:* No moral difference between lying and misleading; both equally bad (or misleading worse). *Priya:* Impermissible.

  *(Note: Leaves 9 and 10 are flagged as unable to fully separate "Equivalence" from "Misleading Worse" without further nodes.)*

  ---

  ### Instructor's Note: Running the Seminar

  **Class Plan (50 Minutes):**
  Start by projecting the Anchor Case. Ask for a show of hands: "Is Priya wrong?" (5 mins). Then, distribute the tree. Have students pair up and trace their path silently (10 mins). Ask pairs to announce which Leaf they landed on; write the counts on the board. You will likely see a cluster in **The Literalist** (students relieved Priya didn't lie) and **The Deception Absolutist** (students focused on the outcome). Use the **Subjunctive Liar** leaf to spark debate: "If Priya would have lied if pressed, does that make her current answer worse?" (15 mins). Finally, discuss the Empty Leaves. Ask: "Why does no one want to be The Compliance Officer?" (10 mins). Wrap up by connecting the leaves to the reading list (e.g., map The Literalist to assertion-norm theorists).

  **Distinction Audit:**
  I intended to use all five distinctions, but **Audit Asymmetry** (Distinction 4) collapsed. In Node 9, I tried to separate fear of formal sanction from moral stigma. In practice, students treated "avoiding the label" (Deniability) and "avoiding the record" (Audit) as the same motive: self-protection. The tree couldn't force a split where students saw a moral difference between avoiding a HR file note and avoiding a reputation hit; both looked like cowardice. Consequently, Leaf 5 (Compliance Officer) ended up empty not because the position is incoherent, but because the distinction didn't generate a unique moral intuition separate from general deniability. Audience-relativity (Node 6) and Conventional Warrant (Node 5) did the heavy lifting instead, successfully separating the "Code-Breaker" from standard misleading cases.
