answer: |-
  To remain consistent with her track record, she should **reject the tradable, speculative nature of the anticipatory grief contract**, even if she might accept a non-transferable pre-paid version.

  Here is the analysis of her position, the closest analog, the underdetermined principles, and the decisive test case.

  ### 1. The Consistent Verdict
  She must object to the **secondary market tradability** of the claim.

  While she permits pre-paid funeral contracts, those are typically fixed-service agreements purchased by the individual (or their family) for their own use, not financial instruments traded by third-party investors for profit. While she permits state-run kidney compensation, that model explicitly removes market pricing and speculation (fixed rate, state-run).

  The "anticipatory grief contract" introduces two elements her framework likely cannot sustain:
  1.  **Speculation on Vulnerability:** By making the claim tradable, the price of bereavement care could fluctuate based on market liquidity rather than need. This mirrors her **pharmaceutical** judgment: in moments of acute emotional vulnerability (grief), market pricing undermines fair exchange.
  2.  **Fungibility of Intimacy:** By allowing the claim to be assigned to *any* named survivor and traded, the contract treats emotional care as a detached asset. This mirrors her **vote-selling** judgment: some goods are corrupted when treated as fungible commodities.

  ### 2. The Closest Analog: Vote-Selling
  Of the three options provided (kidney pool, funeral contracts, vote-selling), **vote-selling** is the closest analog.

  *   **Why not the Kidney Pool?** The kidney pool was permissible because it was *de-commodified* in practice (fixed rate, state-run). The grief contract is explicitly a *financial instrument* with a secondary market.
  *   **Why not Funeral Contracts?** Funerals are logistical and material. While they surround death, they do not govern the *internal emotional processing* of the survivors. Selling a burial plot is distinct from securitizing the right to grieve.
  *   **Why Vote-Selling?** Her prohibition on vote-selling rests on the idea that **democratic equality is not a fungible good.** A vote is an expression of civic selfhood; to sell it is to alienate a part of the citizen's moral standing. Similarly, bereavement therapy is an engagement with intimate human vulnerability and dignity. To turn the *right to care* into a speculative asset tradable on a market is to assert that emotional recovery is a commodity rather than a human necessity. Both votes and grief care belong to spheres where market logic corrupts the intrinsic value of the good.

  ### 3. Underdetermination and Principles
  Her precedents are genuinely **underdetermined** here. The grief contract sits at the intersection of three conflicting principles she has not yet ranked:

  *   **If she Accepts the Contract:** She adopts the principle of **Pragmatic Access**. She would be arguing that if the instrument funds care that might otherwise go unpaid (like the kidney pool or funeral contracts), the market mechanism is a neutral tool. This prioritizes *outcome* (funded therapy) over *process* (market speculation).
  *   **If she Rejects the Contract:** She adopts the principle of **Sphere Integrity**. She would be arguing that certain domains (democracy, childhood, intimate emotional care) are "moral markets" where exchange itself is corrupting, regardless of consent or safeguards. This prioritizes the *symbolic and relational integrity* of the good over efficiency.

  Currently, her ban on child labor contracts suggests she leans toward Sphere Integrity (protecting future autonomy), but her acceptance of kidney sales suggests she is willing to commodify the body if safeguards exist. The grief contract forces her to decide if *emotional care* is more like a kidney (a resource to be managed) or a vote (a right to be protected).

  ### 4. The Crucial Test Case
  To reveal her underlying rule, present her with this case:

  > **The Resale of General Therapy Vouchers:**
  > A private clinic allows patients to purchase bundles of cognitive behavioral therapy sessions. The clinic proposes allowing patients who can no longer attend to **resell their unused vouchers on an open exchange** to the highest bidder, rather than simply returning them for a refund.

  **Why this reveals the rule:**

  *   **If she rejects resale:** It confirms her underlying rule is the **Inalienability/Corruption of Care**. She believes the therapist-client relationship (or the right to care) cannot be severed from the person and traded without corrupting the nature of the care. This confirms the **Vote-Selling** analog is the true driver of her logic.
  *   **If she accepts resale:** It proves her objection to the Grief Contract is not about care itself, but specifically about **Death and Vulnerability**. It would show she views grief as a unique state of desperation (the **Pharma** analog) where market logic fails, whereas general anxiety therapy is a standard service.
  *   **If she accepts resale only with price caps:** It proves her concern is purely **Exploitation/Vulnerability** (the **Kidney/Pharma** hybrid). She is comfortable with the market only when it cannot price-gouge the vulnerable.

  This case isolates the variable of **speculative tradability** from the variables of **death** and **acute desperation**, forcing her to clarify whether the market is the problem, or the specific vulnerability of the mourner.
