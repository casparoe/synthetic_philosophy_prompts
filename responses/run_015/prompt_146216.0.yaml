      *   *Selection:* **Vote-Selling**. Why? Because Kidney is about *body* (allowed). Funeral is about *logistics* (allowed). Vote is about *integrity of a non-market sphere*. Grief counseling is about the integrity of emotional processing. Making it a tradable security corrupts the sphere.
      *   *Underdetermination:* Yes. She hasn't defined the boundary of "fungibility" for emotional goods.
