  **The Repaired Principle**

  1.  **Persistent Mechanism:** The core causal force must remain measurable despite the forecast's failure. *Note: Distinguishes Malthus (1) from Simon (6); ingenuity is not measurable.*
  2.  **Finite Counter-Factor:** The element defeating the forecast must have checkable limits or expiry. *Note: Overturns Global Peak Oil (3); shale's finitude is not checkable ex-ante.*
  3.  **Endogenous Consistency:** The theory must accommodate delays without denying the ultimate constraint it posits. *Note: Saves Malthus (1); technology delays limits but doesn't remove them, unlike Simon (6).*
  4.  **Dating Rule:** Undated forecasts may be early; dated forecasts failing their deadline are refuted. *Note: Distinguishes Malthus (1) from Ehrlich (2).*

  **New Verdicts**

  **Fusion Power:** Refuted. It fails the Dating Rule and Finite Counter-Factor. "Thirty years away" is a moving goalpost, not a mechanistic delay, and no finite barrier to completion is identified. It is an immunity machine, not a dormant forecast.

  **1970s Cooling:** Refuted. It fails Persistent Mechanism. The cooling hypothesis relied on aerosol dominance over CO2; when warming occurred, the mechanism was proven wrong, not merely delayed. The physics were incorrect, not the timing.

  **Conclusion**

  "Right but early" is a legitimate status only when the underlying mechanism survives the delay; otherwise, it is merely a shield for dogma.
