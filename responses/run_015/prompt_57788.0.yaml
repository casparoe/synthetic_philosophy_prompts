answer: |-
  It is a pleasure to address a colleague who understands both the weight of a watering can and the weight of an argument. Your intuition from the greenhouse is shared by most practicing scientists: in the special sciences, omissions do explanatory work indistinguishable from positive events. If I ask why the seedlings died, "lack of water" is as causal as "excessive heat."

  However, the philosophical dispute you encounter is not merely a confusion of terms. I defend the diagnosis that the disagreement is **substantive**, rooted in a conflict over the **ontology of the causal relata** (what kinds of things can be causes), but it persists because each side privileges different **paradigm cases** of causal inquiry. It is not chiefly verbal, because the stakes involve the structure of reality versus the structure of explanation, with significant downstream consequences for ethics and law.

  ### The Substantive Conflict: Events vs. Dependencies

  To understand why this is substantive, we must look at what each side believes causation *is*.

  **1. The Process/Mechanistic View (The Skeptics)**
  Philosophers like Helen Beebee or Douglas Ehring often argue that causation requires a physical process, a transfer of energy, or a "happening." On this view, the universe is composed of positive events. An omission is not an event; it is the absence of an event. Therefore, an omission cannot physically push or pull anything.
  *   **Ontology:** Causation is a relation between *events*.
  *   **Paradigm:** Fundamental physics (colliding billiard balls, neural firings).

  **2. The Counterfactual/Interventionist View (The Proponents)**
  Philosophers like David Lewis or James Woodward argue that causation is about dependence. If the effect would not have occurred had the putative cause been different, there is causation. For an interventionist, if I can manipulate the omission (by watering the plants) and change the outcome (they live), the omission is a cause.
  *   **Ontology:** Causation is a relation between *facts* or *variables*.
  *   **Paradigm:** The special sciences (biology, economics, medicine).

  ### Applying the Diagnosis to Your Cases

  The substantive nature of this divide becomes clear when we apply these frameworks to your two cases.

  **Case 1: The Power Cut (Interrupted Routine)**
  *   **The Skeptic:** Will likely concede that the cuttings died *because of the power cut*. Here, there is a positive event (the grid failure) that interrupted a process. They will argue you are misidentifying the cause. The omission (no mist) is merely the *mechanism* by which the power cut killed the plants. The omission itself is not the cause.
  *   **The Proponent:** Will argue the power cut is a distal cause, but the proximate cause of death is the lack of mist. They treat the omission as a genuine causal factor because, counterfactually, if the mist had occurred (despite the power cut, perhaps via generator), the plants would live.

  **Case 2: No Program (Pure Omission)**
  *   **The Skeptic:** This is the hard case for them. Since there was never a program, there is no interrupted process and no positive event like a power cut. There is simply the background state of the world. They must argue that the death of the cuttings has *no cause* regarding the misting system, or that the cause is merely the background conditions (e.g., the ambient humidity). To call the "lack of a program" a cause is, for them, a category mistake. It reflects a normative expectation (you *should* have written the program), not a causal reality.
  *   **The Proponent:** Treats Case 2 identically to Case 1 regarding the plants' physiology. The counterfactual dependence holds: If a program had existed, the plants would live. The distinction between "interrupted routine" and "no routine" is morally significant (negligence vs. non-feasance), but causally irrelevant. The omission is a cause in both instances.

  If this dispute were merely verbal, both sides would agree on the underlying facts and merely haggle over the label "cause." But they do not. The Skeptic denies the *existence* of a causal relation in Case 2. The Proponent affirms it. They disagree on the furniture of the world, not just the name tag.

  ### Why the Dispute Persists: Paradigm Privilege

  The reason this substantive disagreement remains intractable is that each side privileges a different paradigm of inquiry.

  *   **The Skeptic** privileges the **Metaphysical Paradigm**. They ask, "What is causation in the fundamental structure of the universe?" In fundamental physics, there are no omissions, only fields and particles. From this vantage point, your greenhouse intuitions look like anthropomorphic projections onto a silent universe.
  *   **The Proponent** privileges the **Explanatory/Manipulative Paradigm**. They ask, "What concept of causation allows us to predict, control, and assign responsibility?" In biology and agronomy, omissions are manipulable variables. From this vantage point, the Skeptic's view renders causal language useless for the special sciences.

  As a physiologist, you naturally operate within the Explanatory Paradigm. You need to know what to intervene upon to save the crop. The philosopher skeptical of omissions is operating within the Metaphysical Paradigm, concerned with avoiding an ontology cluttered with "non-events."

  ### Vulnerability and Conditions for Revision

  My argument rests on the claim that the dispute is substantive because it concerns the *existence* of causal relations in cases of pure omission (Case 2).

  **Where this argument is most vulnerable:**
  It is vulnerable to the **Polysemy Objection**. It is possible that the word "cause" is systematically ambiguous. There may be *causation* (a physical process relation, as the Skeptics claim) and *causation* (a counterfactual dependence relation, as the Proponents claim). If this is true, the dispute is merely verbal disguised as substantive. Both sides are right about their respective concepts, but wrong to think they are fighting over the same concept.

  **What consideration would cause me to change my assessment:**
  I would revise my diagnosis to "merely verbal" if a **Unified Functionalist Theory** were successfully demonstrated.

  Suppose a philosopher could show that the "physical process" view and the "counterfactual" view are not competing ontologies, but rather describe the same underlying relation at different levels of granularity. For example, if it were shown that "omissions" are actually shorthand for complex, positive physical states of the environment (e.g., the specific arrangement of air molecules that constitutes "dryness" rather than "wetness"), then the Skeptic's ontological worry dissolves.

  If "dryness" can be modeled as a positive physical state with its own causal powers (rather than just the absence of water), then the Skeptic can accept omissions as causes without abandoning their event ontology. If such a reduction were successfully made—bridging the gap between the physiologist's "lack of water" and the physicist's "molecular arrangement"—I would concede that the disagreement was largely verbal, stemming from a failure to map high-level biological variables onto low-level physical states. Until then, I maintain that you are right to treat omissions as causes in your work, but the philosophers are right to worry that such causes do not fit neatly into a fundamentalist picture of the world.
