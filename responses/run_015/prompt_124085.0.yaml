  Give it a mark out of 20, broken down by part, and write the comments I could paste back to the student. I want specific and point by point rather than a general impression: where a step fails, name the step and say what the right move would have been. Please separate out three kinds of thing, because I grade them differently — (i) outright slips or steps that don't follow, (ii) claims that are correct but under-argued or resting on an unstated assumption, (iii) claims that are contested in the literature but defensible. I don't want to dock marks for someone taking a side in a live dispute, but I do want the bad steps identified precisely enough that the student can see what went wrong. Don't spend time recapping the problem back at me.
