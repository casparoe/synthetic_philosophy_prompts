      *   *Popperian Creatures:* Can run simulations *internally* before acting. "Let your hypotheses die in your stead." They have an inner environment to test actions. Requires some form of representation/model of the world.
      *   *Gregorian Creatures:* Minds shaped by cultural memes/tools (especially language). They offload cognition to the environment (tools, language) and import cultural wisdom. "Design by cultural evolution."

      *Key Nuance:* Dennett often treats these as layers or competencies rather than strict binary boxes. A Gregorian mind *includes* Popperian, Skinnerian, and Darwinian mechanisms. It's about *what additional capacity* is added.

