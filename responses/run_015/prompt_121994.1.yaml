          *   *Evaluation:* Dennett is a functionalist. He generally cares about *competence* over *comprehension* (see "Competence without Comprehension"). If it behaves *exactly* like a Gregorian mind, Dennett would likely say it *is* a Gregorian mind (or close enough for the taxonomy). Sam's point highlights the "Philosophical Zombie" issue. However, Dennett's taxonomy is about *design levels*, not consciousness. A system that effectively offloads cognition to the cultural environment *is* Gregorian in design, regardless of "inner light." Sam thinks this breaks the taxonomy; Jordan thinks it's just an instance.
