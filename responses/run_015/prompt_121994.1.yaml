          *   *Sam:* It's Skinnerian. Just weight updates via reward. No propositions/beliefs.
          *   *Evaluation:* This is the crux of the "representation" debate. Dennett emphasizes *functional* capacity over substrate. If the system generates variants and tests them in a model (simulation) before deploying the winner to the "real" task, that functionally mimics Popperian "thinking before acting." However, standard evolutionary algorithms (EA) are often classified as Darwinian (selection across generations of agents) even if simulated quickly. But if it's *one* agent generating internal variants to test *before* acting, that's Popperian. The prompt says "evolve a population of strategies... kill off ones that fail." This sounds like a Genetic Algorithm (GA). GAs are typically Darwinian (selection over generations) even if simulated. *However*, Jordan argues the *simulation* acts as the inner environment. Sam argues the lack of propositions makes it Skinnerian (blind variation + selection).
