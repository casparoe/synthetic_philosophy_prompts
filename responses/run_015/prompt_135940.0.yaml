  **MINISTRY OF JUSTICE**
  **PENAL ARCHITECTURE AND ETHICS REVIEW PANEL**

  **TO:** The Minister of State for Justice; Chair, Prison Governors' Association
  **FROM:** Member, Penal Architecture and Ethics Review Panel
  **DATE:** 24 May 2024
  **SUBJECT:** Recommendation Regarding Proposed Halden-Model Pilot Unit in Category A Estate

  **1. PURPOSE**

  This memo serves to discharge the Panel's statutory obligation to advise on the proposal to integrate a pilot unit modelled on the Norwegian Halden prison within an existing United Kingdom Category A high-security estate. The Panel has evaluated the proposal against current penal objectives, security protocols, and ethical frameworks regarding the treatment of detained persons. This document provides a formal recommendation on whether to proceed with the pilot, reject the proposal, or pursue further study.

  **2. PROPOSAL OVERVIEW**

  The proposal entails the retrofitting of a designated wing within a Category A establishment to reflect domestic-scale principles. Key features include private cells with en-suite facilities, shared communal kitchens, and the removal of physical barriers between staff and prisoners during routine interaction. The stated architectural aim is the preservation of social personhood to facilitate rehabilitation.

  **3. ETHICAL AND PHILOSOPHICAL CONSIDERATIONS**

  The Panel has engaged with two competing philosophical positions regarding the function of penal architecture.

  *3.1 Architecture as Moral Recognition*
  Proponents argue that architecture constitutes a form of moral recognition. To deny prisoners domestic space and subject them to institutional design that strips away autonomy is ontologically reductive. It treats the detainee as a being permanently incapable of future moral agency. Under this view, the state has a duty to maintain the prisoner's capacity for social reintegration through environmental cues that mirror normative civilian life.

  *3.2 The Objection of Rehabilitative Theatre*
  The strongest objection raised, particularly by the Prison Governors' Association, posits that importing the Halden model risks producing "rehabilitative theatre." This argument suggests that prisoners may learn to enact normative personhood solely to secure institutional rewards (privileges, early release) without genuine internal transformation. 

  A corollary to this objection is the claim that the explicit degradation characteristic of high-security incarceration, however severe, maintains a transparent boundary between punishment and personhood. It avoids moral deception by clearly signalling that liberty has been forfeited. To simulate freedom within a coercive environment may, according to this view, obscure the reality of punishment and manipulate behaviour through environmental conditioning rather than moral reasoning.

  *3.3 Panel Assessment*
  The Panel rejects the notion that "transparent degradation" serves a legitimate penal purpose within the current statutory framework, which mandates rehabilitation. While the risk of performative compliance is non-zero, behavioural psychology suggests that the enactment of pro-social behaviours is often a prerequisite for internalisation. To structurally enforce degradation is to actively hinder the cognitive shift required for desistance. Therefore, the architectural preservation of personhood is not merely humane but operationally aligned with recidivism reduction.

  **4. SECURITY AND OPERATIONAL VIABILITY**

  Concerns regarding cultural incommensurability are significant. The UK high-security estate operates under different threat profiles than the Norwegian system. Normalised staff-inmate interaction presents potential vulnerabilities regarding contraband movement and staff safety. However, these are operational challenges rather than structural impossibilities. They can be mitigated through rigorous staff training, dynamic security protocols, and phased implementation. To reject the proposal solely on the basis of cultural difference would preclude innovation in a system currently exhibiting stagnating rehabilitation metrics.

  **5. RECOMMENDATION**

  The Panel recommends **approval of a limited pilot subject to quarterly review.**

  *   **Scope:** Implementation of one 50-bed unit within a designated Category A estate.
  *   **Time Frame:** 24-month operational trial.
  *   **Review Mechanism:** Data on violence, contraband, and staff retention to be reviewed quarterly by the Panel. A comprehensive ethical and security audit will be conducted at the 12-month and 24-month marks.
  *   **Metrics:** Success is not defined solely by recidivism (which requires long-term tracking) but by intermediate metrics: reduction in intra-prison violence, staff sick leave due to stress, and prisoner engagement with educational programmes.

  **6. CONDITIONS FOR REVERSAL**

  This recommendation is contingent and will be withdrawn under the following specific conditions:

  1.  **Empirical Evidence:** Quantitative data from the 12-month audit demonstrates a statistically significant increase in serious violence or contraband incidents compared to control wings within the same estate.
  2.  **Security Failure:** Any breach of security directly attributable to the removal of physical barriers or the normalisation of interaction protocols.
  3.  **Philosophical/Coercive Evidence:** Qualitative evidence emerges demonstrating that the environment is actively fostering sophisticated manipulative behaviour ("gaming" the system) without corresponding engagement in rehabilitative programming, thereby validating the "rehabilitative theatre" objection to a degree that undermines public safety.

  **7. VULNERABILITY OF REASONING**

  The precise point in this reasoning most vulnerable to collapse is the assumption that architectural intervention acts as an independent variable capable of influencing culture. 

  The recommendation relies on the premise that domestic-scale design will elicit pro-social behaviour. However, architecture is passive; it is activated by staff culture. If the operational culture of the Category A estate remains rooted in adversarial containment, the Halden-style architecture may become a source of friction rather than normalization. Staff may view the design as a hindrance to security, leading to passive non-compliance or the re-imposition of control through informal, unregulated means. If the staff culture does not shift in tandem with the physical environment, the pilot will fail not because the model is flawed, but because the reasoning overestimated the determinative power of architecture over institutional habit.

  **8. CONCLUSION**

  The Panel advises proceeding with the pilot. The ethical imperative to avoid ontological reduction outweighs the risk of performative compliance, provided that security metrics are strictly monitored. The status quo treats rehabilitation as an administrative afterthought; this pilot tests whether it can be a structural premise.

  Signed,

  **Member, Penal Architecture and Ethics Review Panel**
  **Ministry of Justice**
