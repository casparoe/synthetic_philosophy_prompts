      *   *Connection:* If there is no *biological fact* dictating the class (epistemic gap), but a choice *must* be made for the theory to function, what fills the gap? Usually, pragmatic or ethical considerations.
      *   *Verdict:* The user is right to worry about conflation, but the argument can be saved. The move holds *if* the user argues that the *criteria for selection* (e.g., "medical utility," "homogeneity") are themselves value-laden. Boorse tries to say "natural functional classes," but critics say "those are defined by what we care about."
