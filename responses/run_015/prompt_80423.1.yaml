answer: |-
  This is a sharp, viable argument that cuts to the heart of the naturalism/normativism debate. You are correctly identifying that the "Reference Class Problem" is often treated as a technical boundary issue (where do we draw the line?) when it is actually a constitutive one (who gets to draw the line and why?).

  However, your worry about conflating **epistemic arbitrariness** (we can't find the fact) with **normative arbitrariness** (the choice is driven by values) is well-founded. If you don't distinguish them carefully, a Boorsean defender could reply: *"Just because we don't know the natural class yet doesn't mean it isn't natural. Epistemic uncertainty isn't ontological normativity."*

  Here is a stress test of your argument, broken down by your specific concerns.

  ### 1. The Move from "Arbitrary" to "Value Judgment"
  Your worry is that you might be arguing: *There is no fact of the matter (epistemic), therefore it is values (normative).* That is a non-sequitur. It could just be metaphysical indeterminacy.

  **How to fix it:**
  You need to argue that the **criteria used to resolve the arbitrariness** are inherently normative. Boorse claims reference classes (age, sex, species) are "natural kinds." You need to show that selecting *which* natural kinds matter for health is a pragmatic/ethical choice, not a biological discovery.

  *   **The Argument:** Nature presents us with infinite ways to group organisms (by blood type, by latitude, by diet, by ancestry). Biology alone does not tell us which grouping is *relevant for health*. We select the grouping that serves our medical or social interests (e.g., "we group by age because aging correlates with decline we want to treat").
  *   **The Pivot:** Don't just say the choice is arbitrary. Say the *principle of selection* is normative. If we choose "Modern Westerners" as the reference class for lactose, we are prioritizing *current social functioning* over *evolutionary history*. That prioritization is a value judgment about what health is *for* (adaptation to current environment vs. fidelity to species design).

  ### 2. Characterization of Boorse and Standard Objections
  You are slightly straw-manning Boorse's defense, which might leave you open to counter-fire in the reading group.

  *   **Your Draft:** "The usual response is that we can just pick the right class, say the one that's most medically useful."
  *   **Correction:** Boorse would **not** say "medically useful." He insists health is a theoretical concept distinct from medical need. He would argue the reference class is determined by **biological design**. He claims age and sex are "natural" because they correspond to distinct physiological designs.
  *   **The Stronger Objection:** The standard objection (championed by **Elselijn Kingma**) is not just that the choice is arbitrary, but that Boorse's own requirement for reference classes (statistical homogeneity of function) is impossible to satisfy without normative input. Kingma argues that to get a homogeneous class, you have to keep narrowing the class until it's empty, *unless* you make a value judgment about which variations count as "relevant."
  *   **Recommendation:** Cite Kingma (2007, *"What is it to be healthy?"*). Aligning with her critique gives your argument technical scaffolding. Your specific contribution is zooming in on the *values* driving the class selection (e.g., lactose), whereas Kingma focuses heavily on the *statistical conditions*.

  ### 3. The Lactose Example: Strengths and Weaknesses
  The lactose example is vivid, but it has a specific vulnerability you need to preempt.

  *   **Why it works:** It clearly shows how "normal function" flips based on whether you index the reference class to *evolutionary time* (ancestral humans) or *sociological space* (modern Danes).
  *   **The Vulnerability:** A Boorsean might reply: *"Lactose intolerance isn't a disease in either case; it's just a variation. Boorse only cares about traits that reduce survival/reproduction."* Since lactose intolerance doesn't significantly reduce fitness in modern contexts (we have alternatives), Boorse might say it's not a dysfunction at all, regardless of the reference class.
  *   **How to Fortify:** You need to ensure the example implies a **harm** or **functional failure**.
      *   *Option A:* Stick with lactose but frame it around **symptomatic distress**. If the goal of medicine is to alleviate suffering, the reference class that labels the suffering as "dysfunction" is the one that enables treatment. Choosing the class is choosing whether to medicalize the suffering.
      *   *Option B (Stronger):* Consider **Blood Pressure** or **BMI**. These are continuous traits where the "cut-off" for disease is entirely determined by the reference class's risk profile. If we define the reference class as "all adults," hypertension is rare (disease). If we define it as "all adults over 60," hypertension is typical (normal aging). The choice to treat it as disease or normality determines resource allocation.
      *   *Option C (Hybrid):* Use lactose to illustrate the *historical* arbitrariness, but acknowledge the Boorsean counter-argument about fitness, then pivot to a case where fitness is ambiguous (like menopause or high myopia in modern contexts).

  ### 4. Refining the "Epistemic vs. Normative" Distinction
  To answer your specific worry: **They are not the same thing, but they are linked.**

  *   **Epistemic:** We cannot find a biological fact that dictates "Use Class A."
  *   **Normative:** Because there is no biological fact, we must use a non-biological standard to pick. That standard is invariably pragmatic or ethical (e.g., "Which classification helps us reduce suffering?").
  *   **The Collapse:** Your argument collapses only if you say "We don't know, therefore it's values." It holds if you say "Nature doesn't decide, so *we* decide, and our decision criteria are values."
  *   **Phrasing Tip:** Use the phrase **"Underdetermination by Nature."** The biological facts underdetermine the reference class; therefore, extra-biological (normative) considerations must determine it.

  ### Summary of Recommendations for the Draft

  1.  **Clarify the Boorsean Position:** Acknowledge that Boorse claims reference classes are "natural kinds" (age, sex), not chosen for utility. Your argument is that these "kinds" are not natural enough to do the work without normative supplementation.
  2.  **Sharpen the Lactose Case:** Explicitly state that the *harm* (digestive distress) is constant, but the *ontological status* (function vs. dysfunction) changes. This highlights that the *value* (relief of distress) drives the *classification*.
  3.  **Invoke Kingma:** You don't need to adopt her whole theory, but acknowledging her work on the "homogeneity condition" shows you know the literature. Your point complements hers by focusing on the *values* behind the class choice.
  4.  **Address the "Fact/Value" Gap:** Explicitly state: "The absence of a biological fact (epistemic) forces a choice based on interests (normative)." This prevents the collapse you are worried about.

  **Verdict:** The argument holds, provided you clarify that the normativity enters through the *criteria for selection* rather than just the *uncertainty of selection*. It is a strong contribution to the reading group because it moves the debate from "Can we fix the statistics?" to "Why do we want these statistics?"
