  ### Brainstorming

  1.  **Candidate 1: Sequential Glosten-Milgrom.** Two informed traders arrive sequentially; a market maker (MM) sets bid/ask after each.
      *   *Rejection:* Algebra becomes recursive and messy for hand-verification. The second trader's strategy depends on the first's trade, which depends on the MM's update, creating a chain of conditional probabilities that obscures the $\epsilon \to 0$ limit behavior in a short derivation.
  2.  **Candidate 2: Batch Call Market with Additive Noise.** Two informed traders submit orders simultaneously to an MM who observes the net order flow plus a noise component and sets a single clearing price.
      *   *Selection:* This allows explicit Bayesian updating on a single observable variable (net flow). The equilibrium conditions reduce to comparing conditional expectations, which can be written in closed form. It cleanly separates the aggregation of dispersed signals (in the flow) from the noise parameter $\epsilon$.

  ### The Scenario

  Two risk-neutral traders ($T_1, T_2$) and one Market Maker (MM) trade a single asset with liquidation value $V$. $T_1$ and $T_2$ privately observe conditionally independent signals $s_1, s_2$ about $V$. Simultaneously, they submit market orders $d_1, d_2 \in \{-1, 1\}$. With probability $1-\epsilon$, the MM observes the aggregate informed flow $D = d_1 + d_2$; with probability $\epsilon$, the MM observes a noise order $U \in \{-2, 2\}$ instead. The MM sets a price $P$ equal to $E[V | \text{Observed Order}]$ to break even. Traders maximize expected profit given their signal and the pricing function.

  ### The Primitives

  *   **State:** $V \in \{0, 1\}$. Prior $P(V=1) = 1/2$. Variance $\text{Var}(V) = 1/4$.
  *   **Signals:** $s_i \in \{0, 1\}$. Accuracy $\alpha \in (1/2, 1)$.
      *   $P(s_i = 1 | V=1) = \alpha$; $P(s_i = 1 | V=0) = 1-\alpha$.
      *   Conditional independence: $P(s_1, s_2 | V) = P(s_1|V)P(s_2|V)$.
  *   **Strategies:** Symmetric threshold. $d_i = 1$ if $s_i=1$; $d_i = -1$ if $s_i=0$.
  *   **Noise:** Let $Y$ be the MM's observation.
      *   $Y = D$ with prob $1-\epsilon$. ($D \in \{-2, 0, 2\}$).
      *   $Y = U$ with prob $\epsilon$. ($U \in \{-2, 2\}$ with prob $1/2$ each).
      *   Support of $Y$ is $\{-2, 0, 2\}$. Note $U$ never equals 0, ensuring $Y=0$ is fully revealing of "Informed Flow = 0".
  *   **Timing:** Signals realized $\to$ Traders submit $d_i$ $\to$ Nature determines if $Y=D$ or $Y=U$ $\to$ MM sets $P(Y)$ $\to$ Trade executes.

  ### The Solution

  **Solution Concept:** Perfect Bayesian Equilibrium. MM breaks even ($P(Y) = E[V|Y]$); Traders optimize given $P(\cdot)$. We verify the strategy is optimal ex-post.

  **Algebraic Derivation:**
  Let $q_k = P(V=1 | D=k)$ for $k \in \{-2, 0, 2\}$.
  Let $\pi_k = P(Y=k)$.
  By Bayes' Rule for $k \in \{-2, 2\}$:
  $$ P(V=1 | Y=k) = \frac{(1-\epsilon)P(D=k|V=1)P(V=1) + \epsilon P(U=k|V=1)P(V=1)}{(1-\epsilon)P(D=k) + \epsilon P(U=k)} $$
  Since $U$ is independent of $V$, $P(U=k|V=1) = 1/2$.
  Let $p_2 = P(D=2) = \frac{1}{2}[\alpha^2 + (1-\alpha)^2]$. Let $p_1 = P(D=2|V=1) = \alpha^2$.
  $$ P(V=1 | Y=2) = \frac{(1-\epsilon)p_1(1/2) + \epsilon(1/2)(1/2)}{(1-\epsilon)p_2 + \epsilon(1/2)} \equiv P_2(\epsilon) $$
  By symmetry, $P(V=1 | Y=-2) = 1 - P_2(\epsilon) \equiv P_{-2}(\epsilon)$.
  For $Y=0$, only Informed flow generates 0 (Noise is $\pm 2$).
  $$ P(V=1 | Y=0) = P(V=1 | D=0) \equiv q_0 = \frac{1}{2} \quad (\text{due to symmetry of signals}) $$
  **Limits:**
  $$ \lim_{\epsilon \to 0} P_2(\epsilon) = \frac{p_1}{p_2} = P(V=1 | D=2) $$
  $$ \lim_{\epsilon \to 0} \Pi(\epsilon) = E[(V - P(Y)) \cdot d_1 | s_1=1] $$
  Conditional on $s_1=1$, Trader 1 buys ($d_1=1$).
  $$ \Pi(\epsilon) = P(V=1|s_1=1) - E[P(Y) | s_1=1] $$
  As $\epsilon \to 0$, $P(Y) \to E[V|D]$. By Law of Iterated Expectations, $E[E[V|D]|s_1] = E[V|s_1]$.
  $$ \lim_{\epsilon \to 0} \Pi(\epsilon) = E[V|s_1] - E[V|s_1] = 0 $$
  **Volume:** $V(\epsilon) = P(\text{Trade})$. At $\epsilon=0$, $\Pi=0 \implies$ Traders indifferent. Tie-break: No Trade. $V(0)=0$.
  **Informativeness:** $I(\epsilon) = \text{Var}(V) - E[\text{Var}(V|Y)]$.
  $$ \text{Var}(V|Y=k) = P_k(\epsilon)(1-P_k(\epsilon)) $$
  $$ I(\epsilon) = \frac{1}{4} - \left[ \pi_2 \text{Var}(V|2) + \pi_{-2} \text{Var}(V|-2) + \pi_0 \text{Var}(V|0) \right] $$
  As $\epsilon \to 0$, $\pi_2 \to p_2$, $\pi_0 \to P(D=0)$, $P_k \to q_k$.
  $$ \lim_{\epsilon \to 0} I(\epsilon) = \text{Var}(V) - E[\text{Var}(V|D)] = I_{\text{pooled}} $$
  Since signals are dispersed, $I_{\text{pooled}} > I_{\text{single}}$.

  ### Verification

  1.  **Common Prior/Knowledge:** Defined ($1/2$, $\alpha$). All know structure.
  2.  **Risk Neutral/No Costs:** Utility is $E[\text{Profit}]$. No fees.
  3.  **MM Breaks Even:** $P(Y)$ defined as conditional expectation.
  4.  **Sequential Rationality:** Traders buy if $E[V|s] > P$. For small $\epsilon$, $P_2(\epsilon)$ is dampened toward $1/2$ relative to $q_2$. Thus $q_2 > P_2(\epsilon)$. Buying on $s=1$ is optimal.
  5.  **Spec 1 (Hard Direction):** $\Pi(\epsilon) \to 0$ (derived above). $V(0)=0$ (tie-break). $I(\epsilon) \to I_{\text{pooled}} > 0$.
  6.  **Spec 2 (Dispersion):** $s_1, s_2$ conditionally independent. $q_2 = \frac{\alpha^2}{\alpha^2 + (1-\alpha)^2} > \alpha$ (Single signal info). Aggregation holds.

  ### Three Verdicts

  **(a) The Skeptical Reading (No-Trade Theorem)**
  *   *View:* Speculative profit is the engine of information revelation; without profit (due to common knowledge of rationality), trade ceases and prices revert to priors.
  *   *Prediction:* As $\epsilon \to 0$, $\Pi \to 0$ implies $I \to 0$.
  *   *Result:* **Fails.** In this case, $\Pi \to 0$ but $I \to I_{\text{pooled}}$. The price becomes *more* informative as profits vanish because the noise shielding the traders disappears, allowing the MM to read the aggregate signal perfectly.
  *   *Feature:* The distinction between *incentive to trade* (profit) and *informativeness of order flow* (signal content).
  *   *Objection:* "At $\epsilon=0$ exactly, trade stops ($V=0$). Your limit describes a sequence of markets that don't exist at the limit point. You haven't solved the $\epsilon=0$ case."

  **(b) The Aggregationist Reading (Hayek)**
  *   *View:* Prices transmit dispersed local knowledge to the public, regardless of trader motives, provided there is a mechanism to sum orders.
  *   *Prediction:* $I(\epsilon)$ should approach the informativeness of pooled signals as friction vanishes.
  *   *Result:* **Confirmed.** $\lim I(\epsilon) = I_{\text{pooled}}$. The MM successfully inverts the order flow to recover the sum of signals.
  *   *Feature:* The batch auction mechanism allowing the MM to observe $d_1 + d_2$.
  *   *Objection:* "This relies on the MM knowing the strategy mapping $s \to d$. If traders change strategies, aggregation breaks. It's fragile."

  **(c) The Incentive-Constraint Reading (Grossman-Stiglitz)**
  *   *View:* Prices cannot be fully informative, or else no one would pay to become informed (or trade on information).
  *   *Prediction:* $I(\epsilon)$ must be bounded away from $I_{\text{pooled}}$ to preserve $\Pi(\epsilon) > 0$.
  *   *Result:* **Qualified Failure.** The paradox holds for *acquisition* of information (not modeled here), but fails for *revelation*. Traders reveal info even as $\Pi \to 0$ because they are endowed with signals, not buying them.
  *   *Feature:* Exogenous signal endowment (zero acquisition cost).
  *   *Objection:* "If you add costly information acquisition, $\Pi \to 0$ kills the signal source, and $I$ collapses. Your case assumes away the cost problem."

  ### Cap Analysis

  $I(\epsilon)$ caps at $I_{\text{pooled}}$ (informativeness of $s_1 + s_2$).
  *   *What caps it:* The information structure. The order flow $D$ only contains the sum of signals. It does not reveal the individual realizations if they cancel (e.g., $s_1=1, s_2=0 \to D=0$).
  *   *Structural Change:* Allow traders to submit separate orders identified by ID, or a continuous demand schedule rather than binary market orders.
  *   *Effect on $\Pi$:* Lifting the cap (full revelation of $s_1, s_2$) would make $P = E[V | s_1, s_2]$. This would still drive $\Pi \to 0$ as $\epsilon \to 0$. The profit vanishing is due to competition with the MM's inference, not the coarseness of aggregation.

  ### Impossibility Check

  The conjunction of specifications is satisfiable, as demonstrated. The only tension is Spec 1 ($\Pi \to 0$) vs Spec 2 (High $I$). This is resolved by recognizing that $\Pi$ depends on the *difference* between trader valuation and price, while $I$ depends on the *variance* of the price. As $\epsilon \to 0$, Price Variance increases (more info), but Price-Trader Valuation Gap decreases (MM knows as much as trader).

  ### Closing Paragraph

  The divergence of the epistemic yield $Y(\epsilon) = I(\epsilon)/\Pi(\epsilon) \to \infty$ vindicates the claim that markets "know" something, but only in a specific, limiting sense. It demonstrates that the *mechanism* of price formation is epistemic (Bayesian aggregation) even when the *motive* for participation is pecuniary. However, the reductio looms: at the limit point $\epsilon=0$, the market is epistemically perfect but operationally dead (no trade). Thus, the "knowledge" of the market is a property of the noisy approach to equilibrium, not the equilibrium itself. We should treat market prices as estimates of a limit that cannot be reached without destroying the incentives to approach it. The metaphor holds mechanism, but the mechanism requires friction to function.
