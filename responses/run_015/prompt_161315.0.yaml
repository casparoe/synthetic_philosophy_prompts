answer: |-
  ### 1. The Exam Question

  **Question 3: Agency, Time, and Judgment (20 Marks)**

  Consider two agents, Mira and Sam. Both plan at 9am to write a dissertation chapter rather than go to the pub at 4pm. At 4pm, both end up at the pub.

  *   **Mira** is a hyperbolic discounter. At 4pm, she reverses her 9am ranking. She chooses the pub and sincerely judges it to be the better option *at that moment*. She experiences no internal conflict at 4pm.
  *   **Sam** is time-consistent (exponential). At 4pm, he does *not* reverse his ranking. He still judges writing to be better, but he goes to the pub anyway. He experiences significant conflict and regret at 4pm.

  Write an essay of **no more than 900 words** addressing the following:

  1.  Which agent, if either, exhibits genuine akrasia (weakness of will)? Defend your answer by specifying *whose* judgment (9am or 4pm) defines the agent's "own view" and why.
  2.  Apply the **relocation test**: Imagine the same choice structure is shifted one week forward. Mira's 4pm preference flips back to the chapter; Sam's does not. Does this instability undermine the authority of Mira's 4pm judgment, or does it merely confirm she has time-indexed preferences?
  3.  Briefly discuss the role of **sophistication**. If Mira perfectly anticipates her reversal, does this improve her agency? Explain why sophistication is not strictly superior to naivety and under what conditions precommitment is effective.

  **Time allowed:** 48 hours.
  **Word limit:** 900 words maximum.

  ***

  ### 2. Model Answer (A-Grade Standard)

  **Title: Judgment, Stability, and the Cost of Knowing**

  Genuine akrasia requires acting against one's own better judgment. The case of Mira and Sam forces a choice between two definitions of "own judgment": the stable, long-term plan (9am) or the immediate, situated evaluation (4pm). While Sam fits the phenomenological profile of weakness—conflict and regret—he remains consistent with his 4pm judgment. Mira, conversely, acts in perfect alignment with her 4pm judgment. Therefore, classifying Mira as akratic requires arguing that her 4pm judgment is defective or non-authoritative. I argue that Mira is the true akratic agent because her preferences lack temporal stability, whereas Sam is merely failing to execute a stable intention.

  To call Mira akratic, we must privilege her 9am judgment over her 4pm judgment. If we treat the 4pm self as a sovereign agent, Mira is rational; she simply maximizes utility relative to her current discount rate. However, this fragments the agent into a succession of selves, making diachronic agency impossible. To preserve the notion of a single agent over time, we must identify the agent with the perspective that holds across time, not just the perspective held at the moment of action. Sam's 4pm judgment aligns with his 9am judgment; his failure is one of execution, not evaluation. Mira's failure is evaluative: her standard of value shifts solely due to the passage of time.

  This is where the relocation test is decisive. When the decision window is shifted one week forward, Mira's 4pm preference reverts to the chapter. This instability suggests her 4pm preference is not a robust evaluation of the options, but a distortion caused by temporal proximity. If a judgment flips based purely on when it is made, without new information about the options themselves, it lacks the stability required for authoritative agency. One might object that all preferences are time-indexed; I prefer coffee now and sleep later. But the relocation test distinguishes between changing preferences due to changing circumstances (sleep is better at night) versus changing preferences due to mere delay (writing is better when distant, worse when near). Mira's instability reveals her 4pm judgment is compromised by the bias itself. Thus, acting on it is acting against her stable, authoritative view.

  Sam presents a harder case for akrasia because he lacks preference reversal. He acts against his 9am plan and his 4pm judgment. However, because his ranking remains stable, his "better judgment" is unambiguous. He is weak-willed in the traditional sense of failing to follow through, but Mira is weak-willed in the deeper sense of having her judgment hijacked by time. If akrasia is a failure of self-governance, Mira's governance structure is flawed; Sam's is intact but poorly executed.

  Finally, consider sophistication. If Mira anticipates her reversal, does she regain agency? Not necessarily. Sophistication allows for precommitment, but it also introduces costs a naive agent avoids. A sophisticated agent may succumb to "unraveling": knowing she will cave at 4pm, she might see no point in starting at 1pm, leading to earlier capitulation or greater anxiety. Sophistication is not strictly superior to naivety because knowing you are irrational does not make you rational; it sometimes makes you pessimistically irrational. Precommitment only restores agency if it is binding before the reversal point hits. If the cost of binding is too high, or if the agent cannot bind effectively, the sophisticated agent may end up worse off than the naive agent who at least harbored a hopeful illusion of control.

  In conclusion, Mira is the clearer case of akrasia. Sam fails to follow his judgment, but Mira's judgment itself fails her. The relocation test shows her 4pm view is unstable and thus non-authoritative. While sophistication offers a tool for mitigation via precommitment, it is not a cure-all; it changes the strategic landscape but does not fix the underlying fragmentation of the agent's temporal perspective.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks**

  **1. Distinction between Conflict and Reversal (4 Marks)**
  *   **Must hit:** Clearly distinguish that Sam has conflict without reversal, while Mira has reversal without conflict.
  *   **Common fudge:** Treating both as simply "giving in to temptation" without noting the structural difference in their 4pm judgments.
  *   **A/B Separator:** No. This is baseline comprehension.

  **2. Temporal Indexing of Judgment (4 Marks)**
  *   **Must hit:** Explicitly state whose judgment (9am vs. 4pm) counts as the agent's "true" view and justify why.
  *   **Common fudge:** Equivocating between the two times or assuming 4pm judgment is automatically authoritative because it is current.
  *   **A/B Separator:** No. Necessary for a pass, but standard.

  **3. Interpretation of the Relocation Test (4 Marks)**
  *   **Must hit:** Use the test to argue that Mira's 4pm preference is unstable/defective *because* it flips under time-shifting, rather than just being a different time-indexed preference.
  *   **Common fudge:** Describing the test but concluding "it just shows she has time-indexed preferences" without evaluating the normative implication for agency.
  *   **A/B Separator:** **YES.** This is the crux. Strong B students describe the test; A students argue why instability undermines the *authority* of the judgment.

  **4. Nuance on Sophistication (4 Marks)**
  *   **Must hit:** Acknowledge that sophistication is not strictly better (e.g., mention unraveling, anxiety, or earlier capitulation) and note precommitment constraints.
  *   **Common fudge:** Treating sophistication as purely beneficial ("knowing helps you plan") without noting the welfare costs or strategic downsides.
  *   **A/B Separator:** No, but failing this caps the essay at a B- regardless of other strengths (per prompt constraints).

  **5. Coherent Verdict on Akrasia (4 Marks)**
  *   **Must hit:** Deliver a clear verdict on who is akratic based on the previous arguments (usually Mira, but Sam is defensible if argued well).
  *   **Common fudge:** Refusing to choose ("both are weak in different ways") without resolving the tension regarding judgment authority.
  *   **A/B Separator:** No.

  **Note on Grading:**
  *   **The A/B Separator:** Move 3 (Relocation Test Interpretation). A strong B student will correctly apply the test and note the instability. An A student will explicitly argue that *instability implies a lack of normative authority*, thereby solving the "whose judgment" problem. Without this metaphysical/normative leap, the essay remains descriptive.
  *   **Hard Cap:** Any essay claiming sophistication is strictly superior to naivety cannot score higher than 15/20, regardless of other merits.
