          3.  If the concept is a partisan boundary marker, what conceptual distinction is needed to make progress, or should the term be abandoned?
      *   **Constraint:** Do *not* provide a survey of interpretations or a bibliography. Provide a *structural analysis* of the disagreement and evaluate the viability of the concept.

  2.  **Deconstruct the Core Disagreement:**
      *   *The Concept:* "Democratic Backsliding."
      *   *The Tension:* Procedural Minimalism (Schumpeter/Przeworski: elections are enough) vs. Liberal Substantivism (rule of law, rights, checks and balances are necessary).
      *   *The Mechanism:* Elite-driven institutional capture vs. Popular mandate/Majoritarian correction.
      *   *The Measurement:* V-Dem/expert surveys (subjective/normative) vs. Hard data (election outcomes).

  3.  **Address Question 1: Verbal vs. Substantive:**
      *   It's not just verbal. If it were just about defining words, we could stipulate definitions and move on.
      *   It's substantive because the definition *is* the theory. Defining democracy as "liberal" vs. "electoral" dictates the outcome of the analysis before the evidence is weighed.
      *   *Key Insight:* The disagreement is ontological. What *is* the thing we are measuring? Is democracy a method of selecting leaders or a system of constrained governance?
      *   *Normative Smuggling:* "Backsliding" implies a direction (backward). Backward from what? A specific liberal endpoint. This validates the user's hypothesis about teleology.

  4.  **Address Question 2: Comparative Validity (Europe vs. US):**
      *   Hungary/Poland/Turkey: Parliamentary systems, weaker constitutional courts (historically), unitary or weakly federal. Easier to pack courts, control media.
      *   US: Federalism, strong bicameralism, entrenched judicial review, rigid constitution.
      *   *The Mismatch:* Applying the "Orbán playbook" framework to the US often ignores structural veto points. However, *normative* erosion (polarization, delegitimization) travels faster than *institutional* erosion in the US.
      *   *Parochialism:* The framework assumes a specific type of state capacity and institutional malleability found in newer EU democracies that doesn't map perfectly onto the US. But the *logic* of executive aggrandizement is similar.
      *   *Conclusion:* It illuminates a common *logic* (executive aggrandizement) but obscures distinct *capacities* and *constraints*.

  5.  **Address Question 3: Conceptual Repair vs. Abandonment:**
      *   *Can it be fixed?* Only if decoupled from "Liberal Democracy" as the baseline.
