      *   *Abandonment?* "Backsliding" is too loaded. "Autocratization" is better but still implies a direction. "Regime Hybridization" might be more neutral.
      *   *Best Path:* Shift from "Backsliding" (teleological) to "Constitutional Hardball" or "Executive Aggrandizement" (mechanism-focused).

  6.  **Synthesize the Structural Analysis:**
      *   *The Teleology Trap:* The term "backsliding" presupposes a "forward" direction (Liberalism). This makes it impossible to analyze majoritarian challenges neutrally.
      *   *The Measurement Trap:* Expert surveys (V-Dem) encode the liberal bias into the data.
      *   *The Mechanism Trap:* Conflating *how* it happens (legalistic coup) with *what* is happening (democracy dying).

