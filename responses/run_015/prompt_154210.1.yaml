answer: |-
  Your hypothesis is correct: the impasse is not empirical, but ontological. The disagreement over democratic backsliding is not a failure of measurement but a collision between two incompatible theories of what democracy *is*. The literature is stalled because it attempts to measure a substantive outcome (liberal decay) using a label that implies a procedural violation (democratic loss), without acknowledging that for many actors, the former is the prerequisite for the latter.

  Here is a structural analysis of the disagreement, broken down by the conceptual, comparative, and operational dimensions you raised.

  ### 1. The Ontological Impasse: Proceduralism vs. Constitutionalism
  The disagreement is substantive, not verbal. It turns on whether democracy is defined as a **method of selection** (procedural minimalism) or a **system of constraint** (liberal constitutionalism).

  *   **The Teleological Trap:** As you noted, "backsliding" presupposes a historical trajectory toward a specific endpoint: liberal democracy. This treats institutions like independent judiciaries and neutral bureaucracies as inherent features of democracy rather than contingent constraints on it. When a majoritarian government dismantles these constraints, the "backsliding" framework codes this as a loss of democracy. A majoritarian framework codes this as the realization of democracy (the people finally ruling without veto points).
  *   **The Measurement Bias:** This ontological split is hardcoded into the data. Indices like V-Dem or Freedom House do not measure "democracy" neutrally; they measure "liberal democracy." When experts score "judicial independence," they are not measuring whether judges are independent of the executive; they are measuring whether judges are independent *in a way that liberals approve of*. Consequently, the data cannot resolve the debate because the data generation process assumes the conclusion: that liberal constraints are democratic necessities.
  *   **The Result:** Scholars are not disagreeing on whether the institutions were weakened; they are disagreeing on whether weakening those institutions constitutes a regime change. Until the field distinguishes between **autocratization** (loss of electoral contestation) and **de-liberalization** (loss of rights/constraints), the term "backsliding" will remain a conflation of the two.

  ### 2. The Comparative Mismatch: The American Exception
  The comparison between Hungary/Poland/Turkey and the United States does not illuminate a single common mechanism; it exposes the parochialism of the current framework.

  *   **Institutional Malleability:** The European cases generally involve parliamentary systems with weak bicameralism and flexible constitutions. In Hungary and Poland, a single electoral victory can yield the supermajorities required to rewrite constitutional orders. This allows for "legalistic coups"—rapid, statutory autocratization.
  *   **The US Structural Firewall:** The US system is Madisonian, designed specifically to frustrate majoritarian will through federalism, rigid constitutionalism, and strong bicameralism. The mechanism of "backsliding" in the US cannot be the same statutory capture seen in Budapest. Instead, it manifests as **normative erosion** (refusal to certify elections, court-packing threats, partisan gerrymandering) rather than formal institutional dismantling.
  *   **The Analytical Error:** Applying the "Orbán playbook" framework to the US obscures more than it reveals. It leads observers to look for statutory changes that cannot legally happen, while missing the informal normative decay that is actually occurring. The US case suggests that in mature, rigid democracies, backsliding is not a change in *rules* but a change in *compliance*. Treating them as the same phenomenon conflates constitutional revision with constitutional violation.

  ### 3. Conceptual Repair vs. Abandonment
  The term "backsliding" functions increasingly as a partisan boundary marker because it morally loads the analysis. It implies regression. To make progress, you must decouple the *mechanism* from the *evaluation*.

  **Option A: Conceptual Distinction (The Repair)**
  To salvage the concept, you must bifurcate the dependent variable. Do not ask "Is this backsliding?" Ask two separate questions:
  1.  **Procedural Integrity:** Has the uncertainty of electoral outcomes been compromised? (e.g., gerrymandering, voter suppression, media censorship).
  2.  **Liberal Constraint:** Have minority rights and checks on executive power been reduced?

  This allows for the category of **Illiberal Democracy**. If a government wins free and fair elections but dismantles judicial review, the proceduralist calls this democracy; the liberal calls this backsliding. By separating the two, you acknowledge the empirical reality without resolving the normative conflict prematurely. This forces students to confront the tension: *Can a system be democratically legitimate if it is illiberal?*

  **Option B: Mechanism-Focused Analysis (The Better Path)**
  Abandon "backsliding" in favor of **Executive Aggrandizement** or **Constitutional Hardball**.
  *   **Why:** These terms describe *actions* rather than *regime types*. "Executive aggrandizement" (Levitsky & Ziblatt) focuses on the weakening of checks and balances regardless of whether the system remains "democratic."
  *   **Benefit:** This shifts the seminar from a debate about labels ("Is Hungary still a democracy?") to a debate about power ("How did the executive neutralize the court?"). It allows for the analysis of the US case without forcing a false equivalence with parliamentary systems. It acknowledges that elites can manipulate institutions within the bounds of the law (hardball) without necessarily triggering a regime collapse.

  ### Recommendation for the Syllabus
  Do not ask your students to resolve the definition of democracy; ask them to analyze the **cost of the definition**.

  Structure the seminar to reveal that "backsliding" is not a neutral observation but a theoretical commitment.
  1.  **Week 1:** Contrast Schumpeter/Przeworski (Minimalism) with Schmitter/Karl (Substantivism). Establish that the disagreement is foundational.
  2.  **Week 2:** Examine the "legalistic coup" in Hungary/Poland. Ask: If this was done via parliamentary vote, in what sense is it undemocratic?
  3.  **Week 3:** Examine the US. Focus on norm violation vs. rule violation. Why does the "backsliding" framework struggle to categorize the US?
  4.  **Week 4:** Propose the alternative. Replace "Backsliding" with "Regime Hybridization" or "Constitutional Hardball."

  **Verdict:** The term "backsliding" should be abandoned as an analytical category because it smuggles in a teleological judgment that precludes analyzing majoritarian challenges to liberalism neutrally. Replace it with **mechanism-based descriptions** (aggrandizement, capture, hardball) and force the normative debate into the open, rather than hiding it inside the dependent variable. The impasse will not end until scholars admit they are arguing about the *value* of liberalism, not the *existence* of democracy.
