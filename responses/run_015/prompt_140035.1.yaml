answer: |-
  It is fascinating that you have mapped these verdicts out so clearly, because your friend has effectively reconstructed a very sophisticated ethical framework without ever opening a philosophy book. The pattern you have noticed is the key to predicting her next move. She draws a fundamental distinction between choices that affect an already existing child and choices that determine which child will exist. In the first category, where the same child is involved regardless of the decision, she applies a strict duty of care, which is why she calls it wrong to refuse treatment during pregnancy or to continue a pregnancy resulting in unremitting pain. In the second category, where the choice determines who comes into existence, she is extremely reluctant to use the word wrong, provided the resulting life is worth living. This explains why she absolves the woman in the first case and why she hesitates to condemn the couple in the third case, even while admitting they ought to have chosen differently.

  Based on this consistency, my best guess is that she will say the couple in your new case has done nothing wrong, though she will likely describe the choice as unwise or regrettable. She has already established that a life with impairment is worth living if it contains affection and enjoyment, and she has established that selecting an embryo with a condition is not morally forbidden if the alternative is a different child. To call this choice wrong would force her to contradict her verdict on the first case or the third case. The severity of the condition in your new scenario is certainly higher than in the third case, but it does not cross the threshold she set in the fourth case, which was unremitting pain. The crucial element doing the work here is not the parents' reasons, nor the severity alone, but the fact that the child who exists will have a life she herself considers worth living. Her comment that it is not a life she would wish on anyone is significant, but in her framework, failing to wish a life on someone is not the same as wronging them by bringing them into it. She will likely lean on the parents' benevolent reasons to soften the verdict, calling it a permissible expression of their values, but she will not call it obligatory to choose the healthy embryo, consistent with her rejection of the idea that we must always produce the best-off child possible.

  However, there are two different rules she could be following that would both lead her to this permissive verdict, and distinguishing between them is where your next question should lie. The first rule is what we might call the Identity Rule, which holds that you cannot wrong a person by bringing them into existence unless their life is so bad it is not worth living. On this view, the parents' motives are largely irrelevant; if the child's life is net positive, the act is permissible. The second rule is what we might call the Virtue Rule, which holds that selection is permissible only if the parents are acting out of a genuine regard for the child's welfare. On this view, the permissibility of your new case depends heavily on the fact that the parents are not indifferent and do not treat the condition as a tragedy. They are saved from wrongdoing by their good intentions. Both rules fit her previous five verdicts equally well, because in all her previous cases, the parents were either neutral or acting in what they saw as the child's interest.

  To separate these two rules, you should present her with a variation where the medical facts remain exactly the same as in your new case, but the parents' reasons change. Imagine the same couple with the same two embryos, one leading to the severe but happy life and one to the healthy life. This time, they choose the embryo that will lead to the severe impairment, but their reason is not benevolent acceptance. Suppose they choose it because they believe raising a child with disabilities will make them look virtuous to their community, or perhaps they flip a coin because they simply cannot be bothered to think about the difference, or maybe they do it to secure a specific government grant available only for families with disabled children. If she follows the Identity Rule, she must still say this choice is permissible, because the resulting child still has a life worth living and is not worse off than she would otherwise have been. If she follows the Virtue Rule, she should say this choice is wrong, because the parents are treating the child's condition instrumentally or with indifference, failing in their duty to care.

  This variation is diagnostic because it isolates the source of her permission. If she says the choice is wrong when the motives are selfish or indifferent, it tells you that her approval in the first scenario was contingent on the parents' character, not just the child's outcome. This would imply she holds a view where procreation is a moral act governed by the parents' virtues, not just a calculation of the child's future welfare. If she says it is still permissible, it tells you she is committed to the harder line that identity-affecting choices are almost never wrong unless the life itself is a harm. I suspect she will lean toward the Virtue Rule, given her background in midwifery and ethics committees, where intention and care standards are paramount. She might find it hard to defend a couple who treat a child's severe dependency as a means to a grant, even if the child ends up happy. Testing this will reveal whether her consistency is based on the metaphysics of identity or the ethics of care.
