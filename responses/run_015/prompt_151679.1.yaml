answer: |-
  Here is the draft material for the exam. I have structured this to meet your roommate's specific pedagogical goals while adhering to your constraints (closed-book, no citations, verified content).

  ### 1. Exam Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 800 words
  **Instructions:** Answer the following question in essay form. Do not use external materials or citations. Rely on your understanding of the texts discussed in seminar.

  **Question:**
  In *Computing Machinery and Intelligence* (1950), Turing identifies a tension between "discipline" and "initiative" in the education of a learning machine. Connect this pedagogical problem to the structural distinction he draws in *Intelligent Machinery* (1948) between "unorganized" and "organized" machines. 

  If we treat education as the process of organizing an unorganized machine through structured feedback, does genuine initiative require preserving some residual "unorganized" potential within the system? Argue whether preserving this potential is a necessary condition for creativity or merely a failure of training.

  ***

  ### 2. Model Answer (A-Grade Example)

  **Word Count:** ~620 words

  Turing's work on machine intelligence shifts the focus from static computation to dynamic development. To understand his view on education, one must link the pedagogical tension found in his 1950 paper with the architectural distinctions made in his 1948 report. The core argument is that initiative is not merely a feature of a finished program but a structural consequence of how an unorganized machine is permitted to retain flexibility during organization.

  In the 1948 report, Turing distinguishes between organized and unorganized machines. An organized machine is configured for a specific purpose; its structure determines its output deterministically. An unorganized machine, by contrast, begins with random connectivity or structure. It is not initially useful but possesses the potential to be trained into an organized state through interference or feedback. This provides the ontological groundwork for the 1950 discussion on learning. If the human mind at birth is analogous to an unorganized machine, then education is the process of organization.

  However, the 1950 paper introduces a complication: the tension between discipline and initiative. Discipline refers to the constraints and rules imposed during training to ensure reliability and correctness. Initiative refers to the machine's capacity to produce surprising or creative outputs not explicitly programmed by the teacher. Turing suggests that a machine governed entirely by strict discipline becomes a mere tool, lacking the independence required for intelligence.

  Connecting these two texts reveals that initiative depends on the management of the unorganized state. If education is viewed strictly as the total elimination of the unorganized state—forcing the machine into a fully organized, deterministic configuration—initiative is lost. A fully organized machine executes its function without deviation. Therefore, for a learning machine to exhibit initiative, the educational process cannot result in total organization. There must be a preservation of some unorganized potential, or structural flexibility, that allows the machine to deviate from strict disciplinary constraints.

  This suggests that what might look like "bad training" (incomplete organization) is actually a necessary condition for creativity. If the feedback loops of education are too rigid, they collapse the machine's state space into a single, deterministic pathway. Turing implies that randomness or residual flexibility allows the machine to explore solutions outside the teacher's immediate expectation. In this view, the unorganized element is not noise to be eliminated but a resource for generating novelty.

  However, this preservation of potential carries risk. Without sufficient discipline, the unorganized machine remains chaotic and useless. The educational challenge is therefore not to choose between organization and chaos, but to organize the machine sufficiently for reliability while leaving specific structural capacities unorganized to allow for initiative. This mirrors the distinction between training a child to follow rules versus training them to solve novel problems. The former requires full organization; the latter requires the capacity to reconfigure.

  Ultimately, Turing's framework suggests that initiative is structurally dependent on incomplete organization. If education succeeds too perfectly in organizing the machine, it eliminates the very mechanism required for initiative. Therefore, preserving unorganized potential is not a failure of training but a design requirement for intelligence. The learning machine must remain partially unorganized to remain truly inventive.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 100
  **Passing Threshold:** 50
  **A-Grade Threshold:** 80+

  #### A-Grade Moves (Required for 80+)
  *   **Structural Linkage:** Explicitly connects the 1948 ontological distinction (unorganized/organized) to the 1950 pedagogical problem (discipline/initiative). Does not treat them as separate topics.
  *   **Nuanced Definition of Education:** Defines education not just as "teaching facts" but as the structural process of "organizing" the machine via interference/feedback.
  *   **Resolution of the Core Tension:** Argues that initiative *requires* residual unorganized potential. Identifies that total organization equals determinism (no initiative).
  *   **Reframing "Bad Training":** Successfully argues that what looks like incomplete training is actually a functional necessity for creativity (the "design requirement" argument).
  *   **Balance:** Acknowledges the risk of chaos (too much unorganized potential) without letting it undermine the main argument.

  #### B-Grade Characteristics (50–79)
  *   **Summary Heavy:** Spends too much word count summarizing the "child machine" analogy without linking it to the 1948 structural definitions.
  *   **Weak Connection:** Mentions both papers but fails to explain how the 1948 "unorganized" concept mechanizes the 1950 "initiative" concept.
  *   **Binary Thinking:** Treats discipline and initiative as opposites without explaining the structural mechanism (organization) that mediates them.
  *   **Conclusion:** Concludes that education should just "balance" the two without explaining *why* structurally (i.e., misses the determinism argument).

  #### Critical Mistakes (Cost 10–15 Marks Each)
  *   **Confusing the Dates/Texts:** Attributing the "unorganized machine" concept to the 1950 paper or the "discipline/initiative" tension to the 1948 report.
  *   **Anthropomorphism:** Discussing human education without linking it back to the machine architecture (forgetting this is philosophy of *tech*).
  *   **Misinterpreting "Unorganized":** Claiming an unorganized machine is simply "broken" or "random" without acknowledging its trainability/potential.
  *   **Citation Hunting:** Attempting to fabricate quotes or citations in a closed-book exam (penalize for academic integrity breach if obvious, otherwise ignore content).
  *   **Ignoring the Prompt:** Answering "What is a learning machine?" instead of addressing the tension between discipline and initiative.

  #### Word Count Penalty
  *   **Under 600 words:** -10 marks (Argument likely underdeveloped).
  *   **Over 1000 words:** -5 marks (Failure to edit/concise).
