      *   *Step 2: Applying "Teleological Parallax".*
          *   *Black Migrants:* Whig says they sought integration. Parallax says: They sought *economic survival* and *community safety*. Assigning them "integrationist" agency ignores that many sought *separate* development (Black Belt consolidation) as a survival strategy, not a stepping stone to integration. The Parallax distorts their survivalism into a moral crusade for desegregation.
          *   *White Workers:* Whig says they were backward racists. Parallax says: They were defending *community cohesion* and *labor leverage* in a zero-sum game. The Parallax strips them of rational (though immoral) economic calculation and turns them into caricatures of "evil" rather than actors responding to capital's manipulation.
          *   *The Commission:* Whig says they were progressive heroes. Parallax says: They were managing *order*. Their recommendations (policing, housing codes) were about stopping violence, not necessarily achieving equity. Retroactively calling them "Civil Rights pioneers" assigns them a moral agency regarding equality they didn't possess; they were mostly concerned with stability.

