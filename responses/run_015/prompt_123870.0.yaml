answer: |-
  This is a sophisticated theoretical apparatus. "Teleological parallax" effectively isolates a specific mechanism within presentism: not just judging the past by present morals, but *reconstructing past intent* to fit a known outcome. It turns contingency into conspiracy (or destiny) by smoothing over the gap between *motivation* and *consequence*.

  Here is the conceptual mapping of the 1919 Chicago Race Riots and *The Negro in Chicago* report through your framework, followed by the stress points and a verdict on the Whig utility.

  ### 1. Actor Mapping: Whig vs. Teleological Parallax

  **A. The Black Migrants (Great Migration)**
  *   **Standard Whig:** They are the vanguard of the Civil Rights Movement. Their movement North is read as a conscious rejection of Jim Crow in favor of Northern liberty. They are "proto-integrationists."
  *   **Teleological Parallax:** This framing assigns them moral agency for *desegregation* that they did not possess. Many migrants sought *community consolidation* and *economic survival*, not necessarily integration into white spaces. The Parallax distorts their desire for safety and autonomy into a desire for *our* present-day norm (integration). It retroactively makes them heroes of liberal multiculturalism, obscuring the fact that many sought to build independent Black institutions (a "nation within a nation") rather than dissolve racial boundaries.
  *   **Distortion:** Survivalism is recast as Activism.

  **B. The White Working-Class (Ethnic Enclaves/Unions)**
  *   **Standard Whig:** They are the obstructors of progress. Their violence is read as irrational hatred, a "backward" residue of pre-modern racism that the arc of history must bend away from.
  *   **Teleological Parallax:** Because they "lost" (in the long-term moral narrative of Civil Rights), their agency is flattened into pure reaction. The Parallax ignores their *rational* (though morally repugnant) defense of neighborhood equity and labor leverage. They were responding to capital's use of Black labor as a strikebreaker and the state's failure to provide housing. The Parallax misfiles this as "bigotry" rather than "resource guarding," stripping them of structural rationality to make them moral caricatures. It assumes they *knew* they were on the wrong side of history, rather than fighting for immediate material security.
  *   **Distortion:** Material competition is recast as Moral Failure.

  **C. The Commission Authors (*The Negro in Chicago*)**
  *   **Standard Whig:** They are the early voices of liberal reason, planting the seeds for the 1960s Kerner Commission and fair housing laws. They represent the "growth of conscience."
  *   **Teleological Parallax:** This assigns them a moral commitment to *equality* that was secondary to their commitment to *order*. The Report was as much about social control as social justice. By focusing on the recommendations that align with modern policy (better policing, housing codes), the Parallax ignores the recommendations that reinforced separation to reduce friction. It grants them the agency of "Civil Rights pioneers" when their actual agency was "Crisis Managers."
  *   **Distortion:** Stabilization is recast as Liberation.

  ### 2. Where the Framing Breaks (Stress Points)

  Your framework relies on a clean line between "motivation" and "outcome." The 1919 case introduces noise that disrupts the parallax effect.

  **A. The Ambiguity of the Report**
  *The Negro in Chicago* is notoriously difficult to file. It blamed Black crime rates alongside white police brutality. It advocated for separate recreational facilities in some instances to prevent contact violence.
  *   **The Break:** Teleological parallax requires a clear "winner" (the present norm) to assign agency toward. But the Report's recommendations do not map cleanly onto the 1960s integrationist norm. If the "outcome" is ambiguous (separate but peaceful vs. integrated), the Parallax cannot determine which actors get the "proto-progressive" label. The Commission authors were not aiming at *our* present; they were aiming at *their* stability. The theory struggles when the historical outcome is not a straight line to the viewer's present.

  **B. Labor-Market Competition vs. Racial Ideology**
  *   **The Break:** You note the violence was driven by labor competition. Whig history (and your Parallax twist) is fundamentally *moral* and *political*. It struggles with *economic determinism*. If the white workers attacked Black residents primarily because they were strikebreakers or housing competitors, assigning "moral agency" (backward vs. progressive) is a category error. The Parallax tries to moralize an economic conflict. It forces a "racism vs. anti-racism" binary onto a "scarcity vs. security" conflict. The theory creates a ghost of racial ideology where the primary driver was material survival.

  **C. The Non-Linearity of Segregation**
  *   **The Break:** Whig history assumes A (Riots) → B (Awareness) → C (Progress). In Chicago, A (Riots) → B (Harder Segregation). The immediate outcome of 1919 was the strengthening of restrictive covenants and the solidification of the Black Belt. The "progress" didn't arrive for decades.
  *   **The Break:** Teleological parallax relies on the viewer standing at the end of a completed arc. If the arc bends *away* from the present norm immediately after the event, the Parallax creates a blind spot. It has to skip 40 years to find the "meaning" of the event. This suggests the theory cannot handle "lost decades" or regression.

  ### 3. Verdict: Is Whig History Unavoidable or Broken?

  **The Verdict:** The case reveals that Whig history is **unavoidable as myth, but broken as explanation.**

  *   **Unavoidable:** We cannot help but view 1919 through the lens of the 1964 Civil Rights Act. The "Teleological Parallax" is the cognitive tax we pay for having a present. It is impossible to discuss the riots without implicitly referencing the Civil Rights Movement that followed.
  *   **Broken:** The theory falls apart on urban racial violence because this type of event is **cyclical**, not linear. Whig history was built for political revolutions (1688, 1776, 1789) where a regime change marks a clear "before" and "after." Urban racial violence is a pressure valve that recurs. Applying a revolutionary teleology to a cyclical structural conflict forces a narrative of "overcoming" where the reality is "managing."

  **Conclusion:** Your "Teleological Parallax" is a precise tool for exposing *how* historians sanctify actors. However, in the 1919 case, it risks over-intellectualizing the violence. It assumes the actors were playing a game of "History" with moral stakes, when they were playing a game of "Survival" with material stakes. The Parallax works best on the *Commission* (who were writing history), but less well on the *Rioters* (who were fighting for space).

  ### 4. Framing Flags (Subtle Missteps)

  Two potential vulnerabilities in your prompt's framing to consider for your dataset:

  1.  **The Definition of "Losers":** You write: *"misfile the motivations of the 'losers' as either backward or proto-progressive."* In 1919, the short-term "winners" were the white segregationists (they kept the neighborhoods white). The long-term "winners" (in the Whig view) are the integrationists. Your framework needs to specify *which timeline* determines the winner. If it's the short term, the white workers are "winners" but get filed as "backward." If it's the long term, they are "losers." The Parallax shifts depending on the temporal horizon of the observer. You need to lock down the "viewing distance."
  2.  **The Commission's "Agency":** You imply the Report's recommendations were "genuinely ambiguous." Be careful not to read ambiguity as neutrality. The Commission had a specific agency: **Legitimation.** They were there to restore faith in the liberal state. A Parallax reading might argue they weren't ambiguous at all; they were precisely aimed at preserving the status quo while appearing progressive. The "ambiguity" might be a feature, not a bug, of their agency. Don't let the Parallax let them off the hook as "confused liberals"; they may have been "effective conservatives."

  **Summary for Dataset:**
  Use this case to test if "Teleological Parallax" can distinguish between *moral* intent and *structural* function. If the theory conflates the two, it is just Whig history with extra steps. If it can separate the Commission's *function* (order) from their *retroactive moral status* (progress), then it holds water. 1919 suggests the latter is difficult because the "progress" (Civil Rights) eventually adopted the Commission's language, validating the Whig reading despite the original intent.
