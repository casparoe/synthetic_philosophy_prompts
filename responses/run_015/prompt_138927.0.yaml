      *   *Verdicts:* **Prediction:** Decline. The committee prioritizes procedural stability (Case 3) over tactical innovation. **Recommendation:** Sanction subject to conditions. The core sin in Case 5 was deception, not disruption. The core sin in Case 3 was lack of mandate/notice, but here a mandate exists. The notice is technically given, just vague. **Analog:** Case 2 (Rail). Disruption stems from employer rigidity (standby costs), not worker deception.
