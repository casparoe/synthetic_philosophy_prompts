answer: |-
  **General Rules**
  1.  **Procedural Openness:** Action requires a collective mandate and notice specific enough to allow employer preparation. In Case 3, the minute confounds ballot and notice, but Case 1 shows balloting alone is insufficient; the "opportunity to prepare" ground implies notice must be temporally specific, not merely procedural.
  2.  **Cost Transparency:** Workers must bear the economic cost of withdrawal openly. Case 5 declines action not because it is inefficient (Case 2 sanctions work-to-rule), but because recording full hours while withholding labour is *covert* cost-shifting. The sin is deception, not disruption.
  3.  **Relational Scope:** Action must arise from the employment relation and mitigate grave third-party harm via public carve-outs. Case 7 bars political strikes; Case 6 permits safety carve-outs if public and non-defeating.

  **Application**
  The bus proposal satisfies Rule 2 (lost pay) and Rule 3 (employment dispute; hospital carve-out mirrors Case 6). It strains Rule 1. While a three-day window is notified, undisclosed timings deny the employer the "opportunity to prepare" cited in Case 3. The employer's claim—that unpredictability multiplies disruption—suggests this tactic bypasses the balance Rule 1 seeks. The rules come apart where procedural specificity conflicts with tactical leverage.

  **Verdicts**
  **Prediction:** Decline. The committee treats Case 3's "opportunity to prepare" as a substantive limit on leverage, not just a procedural checkbox. Unpredictability resembles the unannounced walkout in Case 3 more than the notified action in Case 1.
  **Recommendation:** Sanction subject to conditions. The precedent against covert cost-shifting (Case 5) is the federation's ethical core; tactical notice is secondary. The closest analog is Case 2 (Rail): disruption resulting from employer rigidity (standby costs) is legitimate provided the withdrawal is honest. The hospital carve-out satisfies Case 6.
  **Underdetermination:** Precedents do not define "sufficient notice" granularity.
  **Principles:** Sanctioning adopts: "Tactical surprise is valid industrial leverage." Declining adopts: "Industrial action requires predictable boundaries to remain distinct from sabotage." Conditional sanction adopts: "Leverage is valid if third-party harm is contained."
  **Least Liked:** "Tactical surprise is valid." It risks public alienation and sounds like sabotage.

  **Further Case**
  Telephonists refusing to answer calls for 10 minutes randomly each hour, announced only as "sometime today", while recording full attendance. This separates Rule 1 (Notice) from Rule 2 (Cost Transparency), forcing a choice between procedural openness and economic honesty.

  **Single Consideration**
  If independent verification confirms the unpredictability makes *safety* maintenance impossible (beyond rostering inconvenience), I would switch to Decline.
  **Weakness:** My reasoning assumes the employer's disruption estimate is accurate rather than a bargaining bluff. If the employer can absorb the cost via standby, the "disruption" is merely financial, which should be sanctionable under Case 2.
