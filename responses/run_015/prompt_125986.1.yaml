  Two computational social choice theorists, Alice and Bob, are co-authoring a paper on mechanism design. To manage their shared repository, they configure an automated deployment script governed by two axioms they intend to satisfy simultaneously: Minimal Liberalism and the Pareto Principle.

  They define three possible states for the nightly build:
  *   **State $A$:** Alice deploys, Bob watches.
  *   **State $N$:** Neither deploys.
  *   **State $B$:** Bob deploys, Alice watches.

  They assign rights according to Minimal Liberalism: Alice is decisive over the pair $\{A, N\}$ (her own engagement), and Bob is decisive over the pair $\{N, B\}$ (his own engagement). They then hard-code their private preference orderings into the system:

  Alice, prioritizing stability but distrustful of Bob's code, ranks the states: $N \succ A \succ B$.
  Bob, prioritizing progress but reluctant to debug, ranks the states: $A \succ B \succ N$.

  The script executes. Regarding the pair $\{A, N\}$, Alice exercises her right and vetoes $A$ in favor of $N$. Regarding the pair $\{N, B\}$, Bob exercises his right and vetoes $N$ in favor of $B$. By transitivity, the system selects State $B$: Bob deploys alone.

  Alice looks at the log, then at Bob. "According to our private orderings," she says, "we both strictly prefer State $A$ to State $B$."

  Bob nods, watching the build fail. "Correct. State $A$ is Pareto superior to State $B$."

  "So," Alice concludes, "by strictly honoring our individual rights to abstain or participate, we have constructed a protocol that systematically forbids the only outcome we both agree is efficient."

  Bob sighs. "Don't worry. I'll write the corrigendum. You have the right to veto it."
