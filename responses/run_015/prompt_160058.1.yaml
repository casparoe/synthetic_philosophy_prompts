      *   **Thesis:** Emotions $\neq$ judgments, $\neq$ bare feelings. They = perceptions of affordances (e.g., "fleeable-here-now"). Norm = Aptness (picking up affordances *because* of competence).
      *   **Key Moves:** (1) Recalcitrance = perceptual habit failure (not false belief). (2) Cognitive penetrability = compatible with skill-based perception. (3) Aptness $\neq$ Appropriateness (avoids wrong-kind-of-reasons).
      *   **Audience:** 14 people. Specific breakdown:
          *   2 Perceptual Theorists (Value): Modular/Encapsulated view. Will challenge "perception" label.
          *   3-4 Appraisal/Concern-Based: Care about reasons/rationality. Will challenge "aptness" vs. "justification."
          *   2 Psychologists (Constructionists): Anti-natural kind. Will challenge reification/falsifiability.
          *   1 Enactivist: Pro-affordance, Anti-representation. Will challenge "content."
