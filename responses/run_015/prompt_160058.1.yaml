      *   *Concessions:* Don't fight the "modularity" war too hard. Concede perception is *broad*. Concede aptness isn't *all* of normativity.
      *   *Strongest Objection:* The Appraisal/Rationality one. If emotions aren't reason-responsive, they lose their place in "Mind and *Value*."
