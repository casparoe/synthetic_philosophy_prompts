      *   **Constraints:** No citations/reading lists. Needs specific objections phrased by specific personas. Needs 2-min replies, "one-liners," honesty about soft spots. Needs advice on concessions, strongest objection, weakest joint, and the "landmine" question.

  2.  **Deconstruct the Theory & Identify Vulnerabilities:**
      *   *Affordances:* Usually agent-relative (chair affords sitting *for me*). Emotions fit this well (threat affords fleeing *for me*).
      *   *Aptness:* Sosa-style. Success *because of* competence.
      *   *Recalcitrance:* Fear of harmless spider. Standard view: Irrational belief/judgment conflict. User's view: Habitual perceptual error.
      *   *Vulnerability 1 (Representation):* Enactivist will hit hard on "content." Affordances are often framed as non-representational relations. If emotions have content ("fleeable"), is that representational?
      *   *Vulnerability 2 (Rationality):* Appraisal theorists want emotions to be *reasons-responsive*. Aptness is a competence norm (like archery), not necessarily a reason norm. Can I reason myself out of an apt-but-bad emotion?
      *   *Vulnerability 3 (Constructionism):* If "fear" is just a context-specific perception of affordance, does the category "fear" exist?
      *   *Vulnerability 4 (Moods/Objectless):* Anxiety has no specific object. What affordance does it pick up?
