  5.  **Refining the Content (Iterative Process):**
      *   *Objection 1 (Appraisal/Rationality):* This is the highest stakes for a "Value" series. If emotions can't be justified by reasons, they aren't part of rational agency.
      *   *Objection 2 (Perception/Modularity):* The "that's not perception" attack.
