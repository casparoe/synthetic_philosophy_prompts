answer: |-
  This is a sharp angle to take. Most people stop at "genetic discrimination is bad," but looking at it through the moving baseline of therapy versus enhancement gets at the structural mechanics of the world. Here is how the movie and the concept align, where they fight, and an assessment of the claims.

  ### The Moving Baseline in Gattaca

  To answer your first question: **The movie does not show the shift happening; it shows the shift already completed and solidified.**

  The philosophical "moving baseline" problem usually describes a gradual creep. We fix a disease, then that becomes the new normal, then we enhance a trait, and suddenly anyone without that enhancement is disabled by comparison. *Gattaca* skips the creep and starts at the destination. In this society, the "normal" human baseline has already been redefined as the genetically optimized human.

  This creates a situation where "therapy" is no longer about fixing a specific illness; it is about fixing existence itself. For Vincent, being born naturally is treated as a medical error. His parents were offered the chance to "therapy" out his risks (heart condition, myopia, reduced lifespan) and chose not to (or couldn't afford to). Consequently, Vincent isn't viewed as someone who needs medical help to reach a standard human baseline; he is viewed as someone who is fundamentally below the baseline. In this context, the distinction between therapy and enhancement collapses. Enhancing an embryo is considered responsible parenting (therapy for the gene pool), while natural conception is viewed as inflicting a disability.

  ### Static Line vs. Social Construct

  You asked if the line between valid and in-valid is static or if the movie suggests the distinction is social. The movie presents a tension here.

  **The System's View (Static/Biological):**
  The institutions in the movie (the space program, the insurance companies, the police) treat the line as absolute and biological. A urine test or a stray eyelash determines your destiny. They operate on the assumption that genetic potential equals actual performance. For them, the baseline is fixed by DNA. If you are an In-valid, you are biologically incapable of the "normal" performance required for high-level jobs.

  **Vincent's Reality (Social/Fluid):**
  Vincent proves the distinction is social, not biological. He performs at a super-high level—higher than most Valids—despite his "defective" biology. He has to use "therapy" (contact lenses, leg lengthening surgery, fake urine) not to fix a disability, but to mimic the Valid baseline. This supports your moving baseline idea: Vincent is healthy enough to function, but he is "disabled" only because the social requirements have shifted beyond natural human variance.

  However, the movie resists the idea that the baseline *should* just keep moving. The narrative arc argues for a return to a pre-shift baseline where spirit matters more than code. Vincent wins not by becoming a Valid, but by proving the Valid distinction is meaningless.

  ### Where the Movie and Concept Resist Each Other

  This is the most critical part for your club discussion. There is a friction between the philosophical problem and the film's narrative.

  **1. The Spectrum vs. The Binary**
  The therapy/enhancement moving baseline problem usually implies a spectrum. People enhance a little, then a little more, and the norm drifts. *Gattaca* presents a hard binary. You are either Valid or In-valid. There is no middle ground of "slightly enhanced." This resists the philosophical nuance of the moving baseline. In the real-world philosophical debate, the worry is that we won't notice the line moving. In *Gattaca*, the line is a wall, and everyone knows it. The movie is about breaking the wall; the philosophy is often about managing the slope.

  **2. Universal vs. Class-Based Shift**
  The moving baseline problem often assumes a future where enhancement is ubiquitous, making the unenhanced truly disabled in every context. *Gattaca* shows a class-based shift. In-valids still exist and function in society (as cleaners, drivers, etc.). The baseline has only moved for the elite tier (space travel, executive roles). This suggests the "disability" isn't that In-valids can't function, but that they are barred from power. The movie argues the problem is access, not necessarily that the human baseline has objectively moved beyond natural capacity. Vincent proves natural capacity is still sufficient for the highest tasks, undermining the idea that enhancement was actually *needed* to move the baseline.

  **3. The Definition of Therapy**
  In the moving baseline argument, therapy is usually reactive (fixing what is broken). In *Gattaca*, "therapy" is preemptive (editing before birth). This creates a resistance in how we assign blame. If the baseline moves because of preemptive editing, the "disabled" person is blamed for their parents' choices, not their own biology. The movie highlights this guilt (Vincent's mother's regret), but the philosophical framework struggles to assign moral weight to a baseline that was shifted before the subject existed.

  ### Confidence Assessment

  **High Confidence:**
  I am highly confident in the claim that the movie depicts the *aftermath* of the baseline shift rather than the process. The world-building is static; the discrimination is codified law, not a drifting social norm. I am also confident that the movie argues the distinction is socially enforced rather than biologically necessary, given Vincent's success.

  **Medium Confidence:**
  I am moderately confident in the claim that the movie collapses the therapy/enhancement distinction. While the text supports it (natural birth is treated as negligence), one could argue the society still sees gene-editing as "prevention" rather than "enhancement," maintaining a technical distinction even if the social result is the same.

  **Lowest Confidence (The Uncertainty):**
  The part I am least sure about is whether the movie implies the baseline shift is *irreversible*. The philosophical moving baseline problem warns that we can't go back; once everyone enhances, you can't compete without it. *Gattaca* ends with Vincent escaping to space, but he doesn't change the system. He just opts out. It is unclear if the film believes the baseline can be reset for society, or if it accepts that the elite will always be enhanced while the "human spirit" survives only in individuals like Vincent. The movie is optimistic about the individual, but ambiguous about the structural baseline.

  ### Summary for your Club
  If you present this, your strongest point is that *Gattaca* freezes the moving baseline problem in time. It shows us a world where the "enhancement" of the past has become the "therapy" of the present (you *must* be engineered to be considered healthy). However, the movie resists the philosophical fatalism of that problem by showing that the biological baseline didn't actually need to move—Vincent proves the "old" human is still capable. The tragedy isn't that nature was left behind; it's that society decided to leave it behind unnecessarily.
