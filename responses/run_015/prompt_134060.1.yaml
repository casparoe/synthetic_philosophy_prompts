answer: |-
  # The Knowledge Sorting Tree

  **Start Point:** Hanne checks the ferry timetable on her phone. It is mid-afternoon. She tells a friend the last boat leaves at 18:40. If she is wrong, the friend takes a taxi and arrives twenty minutes late. **Everyone agrees Hanne knows.**

  **Instructions:** Read the questions in order. Follow the instructions attached to the answer that best matches your intuition. If you are torn, pick the one that feels *more* correct. If your answers lead to a contradiction (e.g., you are sent to a leaf that contradicts an earlier answer), note this in the "Unmapped Patterns" section at the end.

  ---

  ### Node 1: Maya and Rob (Subject Stakes)
  Maya and Rob read the same departures board at the same moment. They have exactly the same evidence. Maya is going to a birthday dinner; if she misses the boat, she is mildly annoyed. Rob is a marine mechanic; if he misses it, a vessel's bilge alarm goes unchecked and someone could be injured.
  **Question:** Does Rob know the boat leaves at 18:40?
  *   **A. Yes, just like Maya.** (Stakes do not change knowledge). → **Go to Node 2.**
  *   **B. No, unlike Maya.** (Stakes change knowledge). → **Go to Node 5.**
  *   **C. It depends on who is asking.** (The speaker changes knowledge). → **Go to Node 8.**

  ### Node 2: The Stranger's Bet (Arbitrary Stakes)
  A stranger tells you they will donate a large sum to a cause you hate if you are wrong about whether the museum is closed on Mondays. Your evidence (a sign on the door) is unchanged.
  **Question:** Do you know the museum is closed?
  *   **A. Yes.** (Knowledge is robust). → **Go to Node 3.**
  *   **B. No.** (Knowledge is fragile). → **Go to Node 4.**

  ### Node 3: The Website Cache (Salience)
  At dinner, a guest mentions that the ferry company migrated its website last night and caches sometimes serve old timetables. Nobody is relying on the timetable for anything important.
  **Question:** Does Hanne (from the Start Point) still know?
  *   **A. Yes.** → **Leaf 1: Classical Invariantism.**
  *   **B. No.** → **Leaf 2: Salience Invariantism.**

  ### Node 4: The Global Error (Skepticism)
  Consider the possibility that your senses are systematically deceived (e.g., you are dreaming). You cannot rule this out with absolute certainty.
  **Question:** Do you know you have hands?
  *   **A. Yes.** → **Leaf 2: Salience Invariantism.**
  *   **B. No.** → **Leaf 3: Skepticism.**

  ### Node 5: Priya's Calibration (Subject Awareness)
  Priya checks a hospital machine at 09:00 and logs it as calibrated. At 16:00, without her knowing, the machine is used for a radiation dose where error could harm a patient.
  **Question:** Did Priya know at 09:00 that the machine was calibrated?
  *   **A. Yes.** (She didn't feel the stakes). → **Go to Node 6.**
  *   **B. No.** (The stakes existed in the world). → **Leaf 4: Objective Stakes Invariantism.**

  ### Node 6: The Friend's Funeral (Third-Party Stakes)
  Hanne tells a friend the ferry time. Hanne doesn't care, but if she is wrong, the *friend* will miss a funeral. Hanne never learns this.
  **Question:** Does Hanne know?
  *   **A. Yes.** (Only Hanne's stakes matter). → **Go to Node 7.**
  *   **B. No.** (The listener's stakes matter). → **Leaf 5: Attributor Contextualism.**

  ### Node 7: Chat vs. Action (Pragmatic Link)
  Hanne is merely chatting about the ferry. She is not buying a ticket or guiding anyone.
  **Question:** Can she "know" the time if she never acts on it?
  *   **A. Yes.** (Knowledge is a mental state). → **Leaf 6: Subject-Sensitive Invariantism.**
  *   **B. No.** (Knowledge is for acting). → **Leaf 7: Pragmatic Encroachment.**

  ### Node 8: The Disagreement (Contradiction)
  I say "Hanne knows" (low stakes context). You say "Hanne does not know" (high stakes context).
  **Question:** Are we contradicting each other?
  *   **A. Yes.** (One of us is wrong). → **Go to Node 9.**
  *   **B. No.** (Both can be right). → **Go to Node 10.**

  ### Node 9: Who Sets the Standard? (Context)
  If only one of us is right in Node 8, whose situation decides?
  *   **A. The Speaker's.** (My context sets the bar). → **Leaf 5: Attributor Contextualism.**
  *   **B. The Subject's.** (Hanne's context sets the bar). → **Leaf 6: Subject-Sensitive Invariantism.**

  ### Node 10: The Assessor (Relativity)
  If both of us are right in Node 8, whose perspective makes it true?
  *   **A. The Speaker's.** → **Leaf 8: Contextualism.**
  *   **B. The Listener's/Assessor's.** → **Go to Node 11.**

  ### Node 11: Fact of the Matter (Truth)
  In Node 8, if both claims are acceptable, is there a hidden fact about whether Hanne *really* knows?
  *   **A. Yes.** → **Leaf 9: Relativism.**
  *   **B. No.** (It's just about how we use the word). → **Leaf 10: No Fact of the Matter.**

  ### Node 12: Alternatives (Contrast)
  When we say Hanne knows, are we implicitly comparing the timetable to specific alternatives (e.g., "not 18:40" vs "not 19:00")?
  *   **A. Yes, always.** → **Leaf 11: Contrastivism.**
  *   **B. No, absolute.** → (Return to previous leaf compatible with your path).

  ---

  ### The Leaves

  1.  **Classical Invariantism:** Knowledge depends only on evidence and truth, never on stakes or context.
      *   *Awkward Commitment:* You must say Rob the mechanic knows the timetable even if a life depends on him being right and his evidence is merely a phone screen.
  2.  **Salience Invariantism:** Knowledge depends on evidence and which error possibilities are noticeable, but not on practical stakes.
      *   *Awkward Commitment:* You must say mentioning a website glitch destroys knowledge even if no one is traveling and no harm is possible.
  3.  **Skepticism:** The standards for knowledge are so high that we almost never meet them.
      *   *Awkward Commitment:* You must tell your group that none of them actually know they are sitting in a library right now.
  4.  **Objective Stakes Invariantism:** Knowledge depends on the real-world stakes, regardless of what the subject thinks.
      *   *Awkward Commitment:* You must say Priya did not know the machine was safe in the morning, even though she had perfect evidence and no way of knowing a patient would be treated later.
  5.  **Attributor Contextualism:** The word "knows" changes meaning depending on the speaker's context and stakes.
      *   *Awkward Commitment:* You must say that when Hanne says "I know" and Rob says "She doesn't know," they are both speaking truly, because they mean different things by "know."
  6.  **Subject-Sensitive Invariantism (SSI):** Knowledge depends on the subject's practical situation, but the word "knows" keeps the same meaning.
      *   *Awkward Commitment:* You must say that Hanne loses knowledge if her friend's stakes rise, even if Hanne never finds out about the friend's stakes.
  7.  **Pragmatic Encroachment:** Knowledge is partly constituted by whether it is rational to act on the belief.
      *   *Awkward Commitment:* You must say Hanne does not know the ferry time if she is just chatting, because she isn't ready to buy a ticket based on it.
  8.  **Contextualism (Speaker):** The truth of a knowledge claim depends on the standards of the person making the claim.
      *   *Awkward Commitment:* You must accept that "Hanne knows" can be true when I say it and false when you say it, without either of us lying.
  9.  **Relativism:** The truth of a knowledge claim depends on the context of the person assessing it.
      *   *Awkward Commitment:* You must say that my claim "Hanne knows" can change from true to false tomorrow if your situation changes, even if I don't speak again.
  10. **No Fact of the Matter (Expressivism):** Knowledge attributions express attitudes rather than describing facts.
      *   *Awkward Commitment:* You must say there is no underlying reality to whether Hanne knows, only whether we are willing to endorse her belief.
  11. **Contrastivism:** Knowledge is always a three-place relation: Subject knows *p* rather than *q*.
      *   *Awkward Commitment:* You must say it is meaningless to ask "Does Hanne know?" without adding "as opposed to what other time?"

  ---

  ### Appendix: The Logical Space

  This appendix maps the distinctions used in the tree to show where the named positions sit in the logical space. It explains why some combinations are occupied and others are empty.

  **1. Whose Practical Situation Matters?**
  *   **Neither:** Classical Invariantism, Salience Invariantism, Skepticism. (Knowledge is purely intellectual).
  *   **Subject:** SSI, Pragmatic Encroachment, Objective Stakes. (The knower's situation matters).
  *   **Attributor/Speaker:** Attributor Contextualism. (The speaker's situation matters).
  *   **Assessor:** Relativism. (The evaluator's situation matters).
  *   **None (Non-Factual):** No Fact of the Matter. (Situations determine use, not truth).

  **2. What Shifts the Standard?**
  *   **Stakes (Practical):** SSI, Encroachment, Objective Stakes.
  *   **Salience (Epistemic):** Salience Invariantism, Contextualism.
  *   **Alternatives:** Contrastivism.
  *   **Nothing:** Classical Invariantism, Skepticism.

  **3. Does the Word "Knows" Change Meaning?**
  *   **No (Invariantism):** Classical, Salience, SSI, Objective Stakes, Skepticism, Encroachment. (The meaning is fixed; the truth conditions vary or don't).
  *   **Yes (Contextualism):** Attributor Contextualism, Speaker Contextualism. (The content of the claim changes).
  *   **Yes (Relativism):** Relativism. (The content is fixed, the truth value is relative).
  *   **N/A:** No Fact of the Matter.

  **4. Is There a Fact of the Matter?**
  *   **Yes:** All Invariantist, Contextualist, Relativist, and Skeptic positions.
  *   **No:** Expressivism / No Fact of the Matter.

  **5. Empty or Unattractive Cells**
  *   **Assessor Stakes + Invariant Meaning:** This is **Relativism**. It is occupied.
  *   **Subject Stakes + Changed Meaning:** This is theoretically possible but rarely defended. It would mean "knows" means different things depending on how much the *subject* has to lose. Most philosophers prefer keeping the meaning fixed (SSI) or moving the context to the speaker (Contextualism).
  *   **Attributor Stakes + No Fact of the Matter:** This collapses into Expressivism. If the speaker's context determines use and there is no fact, the distinction between Contextualism and Expressivism blurs.
  *   **Global Stakes + Subject Awareness:** The "Priya" case (Node 5) separates this. If you say stakes matter but the subject must know them, you are in **SSI**. If you say stakes matter regardless, you are in **Objective Stakes**. The combination "Stakes matter only if the *attributor* knows them" is a variant of Contextualism.

  ---

  ### Flags and Unmapped Patterns

  **Indistinguishable Leaves**
  *   **SSI (Leaf 6) vs. Pragmatic Encroachment (Leaf 7):** These are very close. SSI says stakes affect whether you know; Encroachment says stakes affect whether you are *rational to act*, which then affects knowledge. In practice, they yield the same answers to almost all cases. They differ mostly in *why* they think stakes matter (metaphysics vs. action theory).
  *   **Contextualism (Leaf 8) vs. Relativism (Leaf 9):** Both allow "Hanne knows" to be true for me and false for you. Contextualism says we are saying different things; Relativism says we are saying the same thing but assessing it differently. Without complex linguistic tests (e.g., indirect speech reports), a reading group cannot distinguish these via cases alone.

  **Unmapped Answer Patterns**
  If your answers do not lead cleanly to a leaf, you may hold one of these positions:
  1.  **The "Rob Knows, Priya Doesn't" Pattern:** You think current stakes matter (Rob) but future/unaware stakes do not (Priya). This is a hybrid of Classical Invariantism and SSI. *Advice:* You likely believe evidence is primary, but extreme immediate pressure disrupts the cognitive state required for knowledge.
  2.  **The "Salience Only" Pattern:** You said the Website Cache (Node 3) destroys knowledge, but the Stranger's Bet (Node 2) does not. This suggests you are sensitive to *epistemic* risks (error possibilities) but not *practical* risks (consequences). *Advice:* You are likely a Salience Invariantist or a Contextualist who focuses on error possibilities rather than stakes.
  3.  **The "Contradiction" Pattern:** You said in Node 8 that the speakers *are* contradicting (One is wrong), but in Node 1 you said Rob doesn't know while Maya does. This is logically difficult for Invariantism. *Advice:* You may be an Invariantist who believes the standard for knowledge is very high (Skeptic leanings) but you grant "knowledge" in low stakes as a loose way of speaking.

  ---

  ### Glossary

  *   **Attributor:** The person saying "X knows."
  *   **Subject:** The person who might know something (e.g., Hanne).
  *   **Stakes:** What is gained or lost if the belief is wrong (money, safety, time).
  *   **Salience:** How noticeable or "loud" a possibility of error is in the conversation.
  *   **Invariantism:** The view that the standards for knowledge do not change from conversation to conversation.
  *   **Contextualism:** The view that the word "knows" changes its strictness depending on the conversation.
  *   **Encroachment:** The view that practical factors (stakes) can intrude on knowledge, which is usually thought to be purely about evidence.
