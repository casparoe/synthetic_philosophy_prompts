answer: |-
  The separateness of persons objection confronts the utilitarian calculus by denying the existence of a social entity over whose good the sacrifice is made. Applied to the lifeboat, this means the three survivors' gain cannot offset Parker's loss because there is no super-person to bear the total utility. The anti-aggregation form insists that numbers do not count; the rights form insists that Parker is an end, not a means. On these facts, the two forms converge on the prohibition but diverge on the significance of the selection process. Because the victim was not fixed by fate but selected by the killers, the rights violation is stark: Parker was used. Had lots been drawn, the *ex ante* risk would have been shared, respecting their equal status as distinct persons, even if the *ex post* outcome remained a single death. The anti-aggregation view, however, remains unmoved by the lottery; it objects to the imposition of the fatal burden itself, regardless of procedure, because the loss is still borne by one distinct consciousness while others benefit. Thus, while the rights view might find a lottery procedurally less offensive, the anti-aggregation view rules out the sacrifice entirely. The unfixed identity of the victim does not save the utilitarian; it merely highlights that the objection targets the structure of the justification, not just the identity of the sufferer.

  Where the objection speaks decisively on prohibition, it remains silent on procedure. It forbids the sacrifice but offers no decision rule for the desperate context where starvation threatens all. The objection does not mandate a lottery, nor does it forbid it; it simply denies that a lottery legitimizes the killing. A lottery might be understood as a device for maximizing expected survival read through equal respect, but the separateness objection is not a theory of risk distribution. It is a constraint on justification. Furthermore, the objection relies on inviolability, not consent. Since Parker was comatose, consent was impossible, leaving the objection with no mechanism to resolve the dilemma other than absolute prohibition. It leaves the men with a tragic choice: die together or violate the moral law. It does not tell them how to choose among candidates because, on its terms, there are no permissible candidates. To ask the objection to validate a selection method is to ask it to perform the aggregation it was designed to reject.

  This case tests whether the objection is merely a principle of institutional justice or a metaphysical claim about moral agency. If the objection applies only to the basic structure of society, the lifeboat is irrelevant. If it applies to moral reasoning as such, the lifeboat is the crucible. The latter is the stronger reading: the distinction between persons is ontological, not institutional. The law's refusal to accept necessity vindicates this metaphysical view rather than mere policy concerns about moral hazard. By convicting the men, the court denied them the standing to weigh lives. This mirrors the philosophical claim that no individual has the authority to treat another as expendable for the collective good. The ruling asserts that the boundary between persons is legally rigid, even in extremis. It confirms that the separateness objection is not about the distribution of benefits across a stable society, but about the limits of individual authority over others. The law's stance suggests that the right not to be killed is not suspended by emergency, because the justification for killing relies on a calculus no individual is empowered to perform.
