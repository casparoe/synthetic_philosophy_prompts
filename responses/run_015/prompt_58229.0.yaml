answer: |-
  This is a classic voting theory dilemma, and honestly, it's impressive that you and your friend dug this deep into it. You are arguing about **Strategic Voting** vs. **Honest Voting** within a specific system (Borda Count) that has a known flaw (the tie-breaker).

  Here is the breakdown of the math, the ethics, and how to fix your co-op's system for next year.

  ### 1. The Math: Is your friend right?

  **Short answer:** Yes, mathematically, she is likely right.

  Here is why. You are using a **Borda Count** (2-1-0 scoring). This system is notorious for encouraging people to "bury" their strongest competition.

  *   **The Reality:** Dinner cannot win. Four out of six people rank Dinner last. Even if you and your friend give it top points, it maxes out at 4 points.
  *   **The Real Fight:** It is actually a two-way race between **Donate** and **Cash**. You prefer Donate over Cash.

  **Scenario A: You vote honestly (Dinner > Donate > Cash)**
  If the "Cash First" group decides to be strategic (which is common in Borda), they might rank Donate last to help Cash win (Cash > Dinner > Donate).
  *   **Donate:** Gets 1 (you) + 1 (friend) + 0 (Cash group) + 0 (Cash group) + 2 (Donate group) + 2 (Donate group) = **6 points**
  *   **Cash:** Gets 0 (you) + 0 (friend) + 2 (Cash group) + 2 (Cash group) + 1 (Donate group) + 1 (Donate group) = **6 points**
  *   **Dinner:** Gets 2 (you) + 2 (friend) + 1 (Cash group) + 1 (Cash group) + 0 (Donate group) + 0 (Donate group) = **6 points**

  **Result:** A 3-way tie. The Landlord breaks it. The Landlord hates Dinner. The Landlord might pick Cash. **This is your worst outcome.**

  **Scenario B: You vote strategically (Donate > Dinner > Cash)**
  You and your friend "bury" Dinner to boost Donate's score safely above Cash.
  *   **Donate:** Gets 2 (you) + 2 (friend) + ... = **8+ points**
  *   **Cash:** Stays at **6 points**
  *   **Dinner:** Drops to near zero.

  **Result:** Donate wins outright. No tie. The Landlord doesn't get to decide. Cash loses.

  **Verdict:** Since Dinner has no chance of winning, your vote effectively decides between Donate and Cash. By putting Donate first, you maximize Donate's buffer against Cash. Your friend is trying to prevent a tie that the Landlord could mess up.

  ### 2. The Ethics: Is this "cheating"?

  **Short answer:** It's not cheating, but it is "gaming the system."

  *   **Cheating** implies breaking the rules (e.g., voting twice, forging a ballot).
  *   **Strategic Voting** implies using the rules exactly as written to get a better outcome.

  However, you are right to feel icky about it. Voting systems are supposed to aggregate the *will of the group*. If everyone lies about their preferences, the result doesn't actually reflect what the group wants; it reflects who is best at math.

  **The Trust Issue:** In a co-op, trust is more important than the surplus money. If the other housemates find out you and your friend colluded to shade your ballots, they might feel manipulated.
  *   **Recommendation:** If you decide to do this, **do not hide it.** Tell the house, "We know Dinner can't win, and we want to ensure Cash doesn't win via a landlord tie-break, so we are ranking Donate first to secure a clear winner." Transparency makes strategic voting feel less like backstabbing.

  ### 3. The System: How to fix this for next year

  You asked if there is a tweak to make this problem go away. **Yes.** Your current system (Borda Count + Landlord Tie-Break) is arguably the worst possible combination for a small group.

  **Problem 1: The Borda Count (2-1-0)**
  As you just experienced, this encourages people to rank their second choice last just to hurt their rival.
  *   **Fix:** Use **Approval Voting**.
      *   **How it works:** Everyone gets a ballot where they can "approve" of as many options as they want. You check "Yes" for Dinner and Donate. You check "No" for Cash.
      *   **Why it's better:** You never have to lie. You can support your favorite *and* your acceptable backup. It usually results in the most consensus-friendly option winning (likely Donate) without needing strategy.

  **Problem 2: The Landlord Tie-Breaker**
  Giving an outsider who *hates* one of the options the deciding vote is a massive conflict of interest.
  *   **Fix:** **Runoff Voting.**
      *   **How it works:** If no option gets a majority (4 votes), the top two options go to a second quick vote.
      *   **Why it's better:** In your case, Dinner would be eliminated first. The second vote would be Donate vs. Cash. You and your friend would vote Donate. The "Donate First" group votes Donate. The "Cash First" group votes Cash. Donate wins 4-2. No landlord needed.

  ### Summary Advice

  1.  **For this vote:** If your priority is ensuring Cash does not win (your last choice), **your friend is right.** You should rank Donate first. Dinner is already dead; don't let it take Donate down with it.
  2.  **For your conscience:** It feels shady because the *system* is shady, not because you are bad people. You are adapting to a flawed incentive structure.
  3.  **For the future:** Propose switching to **Approval Voting** for next year. It is much harder to game, easier to understand, and stops people from having to argue about "lying" on their ballots.

  **Winning the argument:** Tell your friend: *"Okay, you win on the math. We should vote strategically to block Cash. But I win on the principle: we need to change the voting system next year so we never have to feel like liars to get a decent result again."*
