  1. **Strength:** H1 falsifies the existence of other minds and physical objects. H2 falsifies only the physical constitution of those objects and minds. If the criterion is the *proportion of the ordinary belief set falsified*, H1 is stronger. If the criterion is *phenomenal indistinguishability*, they are equal. If the criterion is *theoretical simplicity*, H2 requires more auxiliary assumptions (many brains, coupling). **Contested Commitment:** Whether skeptical force is measured by the extent of error, the impossibility of detection, or the complexity of the hypothesis. Students must choose which metric defines "strength."

  2. **Target:** H1 threatens the existence of the external world and other minds. H2 threatens the independence of the world's physics from our cognition. The traditional deceiving-deity scenario aimed at the independence of the world from the mind, aligning with H1. H2 transforms the threat from *existence* to *nature*. H2 saves other minds but endangers the idea that physics is mind-independent. **Contested Commitment:** Whether the core skeptical worry is solipsism (no others) or material mismatch (wrong stuff).

  3. **Closure:** Consider "I am conversing." This entails ~H1 (no others) but is compatible with H2 (others exist). The antecedent survives H2 better. This weakens the skeptical argument regarding social knowledge but relocates the doubt to physical claims ("I have biological hands"). The argument from ignorance shifts target; the argument from hallucination loses force regarding social objects in H2 because the hallucination is shared. **Contested Commitment:** Whether knowledge closure holds equally for social and physical propositions, and whether shared hallucination counts as interaction.

  4. **Semantics:** The semantic reply argues subjects in scenarios cannot refer to real objects. In H1, reference is trapped in simulation. In H2, subjects are causally coupled to hardware and other brains. Reference to real vats might succeed if the computer counts as a causal bridge. The reply survives only if the simulation is an opaque barrier. If the computer is part of the causal chain, reference extends to the base reality. **Contested Commitment:** Whether mediated causal chains preserve reference or break it. This turns on the transparency of technology.

  5. **Interaction:** There is no non-question-begging way to decide if code-mediated coupling is "shared interaction." Defining interaction functionally (correlated inputs/outputs) validates H2; defining it materially (same spacetime stuff) invalidates it. This shows H2 does not solve skepticism but isolates the dispute between *functionalism* and *materialism*. **Contested Commitment:** Whether the definition of "shared world" presupposes the realism it seeks to test. If you define interaction realistically, H2 fails; if functionally, it succeeds.

  6. **Regress:** A hierarchy of simulations does not collapse into H1. Each level inherits the problem intact because the mismatch between appearance and substrate recurs at every step. Skeptical force generates at every interface where reality diverges from simulation. It does not vanish unless one accepts the top level as base reality. **Contested Commitment:** Whether skepticism requires a single "base" reality or thrives on infinite mediation. If reality is always deferred, skepticism is permanent.

  **Recommendation:** Center H2. It forces students to debate whether social reality survives metaphysical undermining, enriching the seminar beyond standard solipsism. It makes the session about the nature of community rather than just the existence of objects. Concede to H1 proponents that H2 dulls the edge of radical doubt regarding the external world's existence, preserving a comfort H1 destroys. H1 remains the sharper tool for destroying metaphysical realism, but H2 is the richer tool for exploring social epistemology.
