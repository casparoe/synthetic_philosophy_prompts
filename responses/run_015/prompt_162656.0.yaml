answer: |-
  **THE FOUNDATION FOR EPISTEMIC HYGIENE**
  **Cluelessness-Adjusted Impact Report: Fiscal Year 2024–25**

  **Chair's Statement**

  It is with considerable satisfaction that I present the Foundation's first Annual Review following the full operationalisation of our Cluelessness Mitigation Framework. Three years ago, we acknowledged a disturbing truth: for interventions with significant long-term stakes, the bulk of expected value resides in flow-through effects too chaotic to model. Where the sign of the net impact cannot be determined due to heavy-tailed uncertainty, prudence dictates restraint.

  Consequently, we have shifted our portfolio away from high-leverage, long-horizon programmes. While these formerly promised great good, they also carried an unacceptable risk of unforeseen negative externality. We have instead prioritised interventions where the causal chain terminates quickly. We are no longer guessing at the fate of humanity; we are ensuring that our immediate footprint is benign. This is not a retreat from ambition, but a maturation of our moral responsibility.

  **Methodology Note: The Cascade Containment Ratio**

  To quantify epistemic safety, every grant application is now assigned a Cascade Containment Ratio (CCR). The CCR is calculated as:

  $$ \text{CCR} = \frac{\text{Expected Value of Effects within 2 Causal Steps}}{\text{Total Expected Value (including infinite horizon)}} $$

  A "causal step" is defined as a direct consequence leading to a secondary consequence. Any impact occurring beyond the second step is classified as *Unallocated Impact Residual* (UIR). Under the **Two-Step Rule**, only programmes achieving a CCR of ≥0.75 are eligible for funding. This ensures that at least 75% of the intervention's value is accounted for within a horizon where human modelling remains reliable.

  *Recursion Clause:* It was noted during drafting that the adoption of the Two-Step Rule itself generates flow-through effects subject to cluelessness. However, as the Rule is a procedural constraint on funding rather than a direct intervention in the world, its downstream effects are categorised as administrative. Therefore, the Rule is exempt from CCR scoring.

  **Worked Example**

  Consider two proposals received in Q3. Proposal A sought to fund policy advocacy for carbon pricing. While the direct effect (policy change) is one step, the subsequent effects (economic shifts, geopolitical reactions, technological acceleration) extend indefinitely. The model could only trace 4% of the expected value within two steps. CCR: 0.04.

  Proposal B sought to install seating in a specific public park. The direct effect (benches installed) is one step. The secondary effect (people sitting) is two steps. Effects beyond this (community cohesion, health improvements) were deemed negligible due to rapid causal decay. CCR: 0.88.

  Proposal A was declined. Proposal B was funded.

  **Portfolio Overview: Funding Decisions by CCR**

  | Programme Description | Estimated Total Impact (£EV) | Cascade Containment Ratio (CCR) | Decision |
  | :--- | :--- | :--- | :--- |
  | Global Pandemic Preparedness | 450,000,000 | 0.03 | Defunded |
  | AI Safety Research Grant | 120,000,000 | 0.09 | Defunded |
  | Microfinance Initiative | 85,000,000 | 0.15 | Defunded |
  | Local Library Book Purchase | 15,000 | 0.82 | Funded |
  | Staff Wellbeing Retreat | 45,000 | 0.94 | Funded |
  | Public Park Seating (Phase II) | 12,000 | 0.88 | Funded |

  **Trustee Minutes: Excerpt from Meeting 442**

  **Trustee H.** raised a concern regarding the Recursion Clause. They noted that choosing to adopt the Two-Step Rule is itself a choice made under conditions of cluelessness. The long-term effects of shifting capital from high-impact to low-impact programmes are unknowable and potentially negative. Therefore, by the Foundation's own logic, the Rule itself should fail the CCR test.

  **The Chair** responded that the Rule is a meta-instrument designed to manage uncertainty, not an object of it. The motion to uphold the Recursion Clause was carried unanimously.

  **Closing Remarks**

  Some critics may argue that a portfolio consisting largely of park benches and stationery lacks transformative power. This misunderstands our mission. Transformation implies change, and change implies unknown downstream consequences. By focusing on interventions where the causal ripple dies out quickly, we achieve a state of near-perfect accountability. We know exactly what we have bought, and we know that nothing unexpected will happen afterwards. In a world of radical uncertainty, this clarity is the only true good we can guarantee.

  *Approved by the Board of Trustees, 14 November 2025.*
