answer: |-
  **PREP SHEET: BOARD MEETING Q&A**
  **SUBJECT:** Congenital Cognitive Prosthetics / The "Enhancement-as-Right" Thesis
  **STATUS:** Draft 4 (Keep in pocket, do not place on table)

  **OPENING CONCESSION (Say this first, disarms them):**
  *   Acknowledge the terminology is volatile. "I know calling this 'enhancement' triggers alarm bells regarding equity and luxury. I am not arguing we should lower the bar for medical necessity. I am arguing the 'Therapy vs. Enhancement' binary is functionally broken for congenital cases where no 'healthy baseline' exists to return to."
  *   *Goal:* Show you respect the wall, you're just asking for a door.

  ***

  **THE HOT SEAT (Ordered by likelihood & danger)**

  **1. The Semantic Trap (Dr. Vance, Chief Bioethicist)**
  *   **Q:** "You're engaging in semantic gymnastics. If it restores function to a species-typical norm, it is therapy by definition. Why are you trying to reclassify standard care as enhancement? It sounds like you're trying to bypass insurance coding."
  *   **A:** "Because 'therapy' implies restoring a *lost* state. These patients never had the state to lose. Calling it therapy forces us to pretend there was a 'healthy original' we are fixing. Calling it enhancement acknowledges we are building a *new* baseline. If we admit it's building capacity, we stop treating it like a medical repair and start treating it like education—a public good everyone deserves, not a treatment only the 'sick' get."
  *   **SOFT SPOT:** Insurance companies don't care about philosophy. They pay for "broken," not "upgraded." You have no answer for the billing department yet.

  **2. The Practical Blocker (Dr. Chen, Neurosurgery)**
  *   **Q:** "Philosophically, fine. But if you label this 'enhancement,' insurers will deny coverage immediately. You're theoretically empowering patients while practically starving them of access. Are you willing to tell the parents their kid's implant is now 'elective'?"
  *   **A:** "Currently, they are denied anyway because they don't fit the 'restoration' criteria. They fall through the cracks. By categorizing this as universal capacity building, we move the funding argument from 'Medical Necessity' (which fails) to 'Civil Infrastructure' (which holds). We stop begging for coverage and start demanding equity."
  *   **SOFT SPOT:** This is a long-game argument. Parents need money *now*. You sound like you're sacrificing current patients for a political ideal.

  **3. The Baseline Problem (Dr. Vance)**
  *   **Q:** "Who defines 'average human capacity'? Is it the 50th percentile? 10th? If I implant a chip to make a deficit child 'average,' haven't I just moved the goalposts? Next week they want to be 'above average.'"
  *   **A:** "We define 'average' functionally, like eyeglasses. Glasses don't make you superhuman; they bring you to species-typical visual acuity. We are talking about cognitive eyeglasses. The line is 'species-typical function,' not 'optimization.' We cap the access at the norm, not above it."
  *   **SOFT SPOT:** Cognitive function is way harder to measure than vision. "Species-typical" is a slippery slope. They will hammer you on the metrics.

  **4. The Ableism Accusation (Prof. Kline, Disability Studies)**
  *   **Q:** "You're pathologizing neurodivergence. By insisting these minds need to reach 'average,' you're reinforcing the idea that disabled cognition is a defect to be fixed rather than a difference to be accommodated. Isn't this just ableism in a lab coat?"
  *   **A:** "Accommodation works for physical spaces; it doesn't fix a locked cognitive door. If the deficit prevents autonomous consent or self-advocacy, 'accepting the difference' is neglect. I'm arguing for the *tool* to allow them to define their own difference. You can't choose disability pride if you don't have the cognitive agency to choose."
  *   **SOFT SPOT:** You're walking a razor's edge. If you push too hard on "agency," you sound like you're saying disabled people aren't people. Kline will smell blood here.

  **5. The Slippery Slope (Dr. Vance)**
  *   **Q:** "If we normalize cognitive prosthetics for 'average' function, how do you stop the wealthy from buying 'superior' function? You're cracking the dam."
  *   **A:** "The dam is already cracked. The wealthy are already doing this off-shore or via private clinics. By bringing it into the hospital system as a regulated 'basic right,' we actually gain *more* control over the tech, not less. Regulation follows access."
  *   **SOFT SPOT:** History suggests regulation lags behind access. You're betting the bureaucracy can keep up with the tech. Bad bet.

  **6. Resource Allocation (Hospital Admin)**
  *   **Q:** "Universal access is expensive. If this is a 'right,' who pays? We are a hospital, not a welfare state. Are you asking us to subsidize cognitive upgrades?"
  *   **A:** "I'm asking you to stop subsidizing acute crisis care for patients who could have been stable. The cost of *not* doing this is lifelong dependency. This is preventative infrastructure. It's cheaper to upgrade the processor than to manage the crash forever."
  *   **SOFT SPOT:** Preventative care rarely gets funded over immediate triage. The ROI takes 20 years; their budget cycle is 12 months.

  **7. Authenticity/Identity (Dr. Vance)**
  *   **Q:** "If a child grows up with this chip, is the cognition theirs or the device's? You're altering the narrative self."
  *   **A:** "If a child grows up unable to form memories, whose self is that? The chip doesn't write the story; it gives them the pen. Without it, there is no narrative to protect."
  *   **SOFT SPOT:** Poetic, but vague. Hard to prove.

  **8. THE KILLER (Hope they skip this)**
  *   **Q:** (Likely from Kline or a quiet Admin) "You have a memory chip, Doctor. You are a living beneficiary of this technology. How can you claim ethical neutrality? Isn't this just you justifying your own existence?"
  *   **A:** "I am not neutral. I am an expert witness. A diabetic endocrinologist is allowed to treat diabetes. My condition gives me data on the *risk* of the tech, which is why I'm arguing for strict caps at 'average' function. I know what happens when the tech fails. That's why I'm the one drawing the line."
  *   **SOFT SPOT:** It's a conflict of interest. Plain and simple. You are the product. If you get emotional, you confirm their bias. If you stay cold, you confirm their fear. *Breathe. Do not touch your temple.*

  ***

  **NOTES FOR THE ROOM:**
  *   **Don't** get into a debate with Kline on "neurodiversity." You won't win, and you'll alienate the medical side. Acknowledge, pivot to "severe deficit."
  *   **Do** keep Chen on side. He's your ally, but he'll bail if you sound too academic. Keep bringing it back to *patient outcomes*.
  *   **WATCH YOUR HANDS:** Don't fidget with the port behind your ear. They're watching for it.
  *   **IF STUCK:** "That is a policy implementation question, not an ethical framework question. I'm here to establish the framework." (Kicks the can down the road).

  *Good luck. Don't let them smell the fear.*
