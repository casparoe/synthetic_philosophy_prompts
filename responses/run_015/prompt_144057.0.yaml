answer: |-
  You have identified a real and distinct epistemic structure, and your intuition that existing frameworks miss the specific *mechanism* is correct. You are describing a belief system that is not merely resistant to evidence, but *metabolizes* external contradiction into fuel for its own reinforcement.

  Here is the breakdown of the existing landscape, the proposed term, the correct "cut," and the diagnostic you requested.

  ### 1. The Existing Landscape (and why it falls short)

  You are right to reject the standard labels, though they are adjacent.

  *   **Identity-Protective Cognition (Kahan et al.):** This explains the *motivation* (protecting group standing) but treats the belief as a shield. It doesn't capture the *active incorporation* of the correction ("now they're trying to erase us") as new narrative content. It describes resistance, not antifragility.
  *   **Sacred Values (Tetlock et al.):** This explains the *refusal to trade* (you can't buy us off), but sacred values can still be factually updated if the sanctity isn't threatened. Your cases show the *factual update rule itself* is inverted.
  *   **Chosen Trauma (Volkan):** This is the closest sociological concept. It describes a shared mental representation of a massive trauma that defines group identity. However, it focuses on the *transgenerational transmission* of the wound, not the specific *epistemic immunity* mechanism you've isolated.
  *   **The Backfire Effect:** This is an individual psychological phenomenon where correction strengthens false belief. Your observation is *cultural* and *narrative*: the correction doesn't just strengthen the belief; it becomes a *plot point* in the myth ("The Attack").

  ### 2. The Proposed Term: "Immunized Narrative"

  You should coin a term, because the distinction is functional and predictive. The best fit for the mechanism you described—where external attack is absorbed and converted into cohesion—is **Immunized Narrative** (or **Immunized Myth**).

  **Definition:** An Immunized Narrative is a load-bearing group story whose adherence increases in response to external factual correction, because the correction is interpreted as evidence of the narrative's core claim (usually persecution or existential threat).

  **Why "Immunized"?**
  *   **Biological Metaphor:** An immune system does not just reject a pathogen; it *remembers* it and strengthens its defenses against it. The "correction" is treated as a pathogen.
  *   **Metabolization:** As you noted, the correction becomes "new content." In immunology, the antigen is processed to build antibodies. In the myth, the criticism is processed to build "proof" of the enemy's hostility.
  *   **Source-Dependence:** Immune systems distinguish "self" from "non-self." An Immunized Narrative accepts updates from "self" (internal historians) but rejects and weaponizes updates from "non-self" (external critics).

  **Alternative:** If you prefer a term from systems theory that signals "gains from disorder," **Antifragile Myth** (borrowing Taleb) works, but "Immunized" better captures the *hostility* and *absorption* aspects.

  ### 3. The Correct "Cut": The Update Rule

  You asked whether the right place to cut is the update rule, the social function, or the narrative content.

  **It is the Update Rule.**

  *   **Content is not sufficient:** Many groups have defeat myths (e.g., France in 1940) that are *not* immunized. France largely accepts the military failure of 1940 because the narrative shifted to "Resistance" and "Reconstruction." The content (defeat) is similar, but the update rule is normal (evidence is accepted).
  *   **Function is not sufficient:** Many myths serve social cohesion (credal beliefs) but are inert. They don't guide policy, and correcting them is met with indifference, not hostility.
  *   **The Update Rule is the discriminator:** The defining feature of your four cases is the *sign inversion* of the Bayesian update when the source is external.
      *   *Normal Belief:* $P(H|Evidence) > P(H)$
      *   *Immunized Belief:* $P(H|ExternalCriticism) > P(H)$ because $Criticism \rightarrow Persecution \rightarrow Validation$.

  ### 4. Diagnostic: Drift In and Drift Out

  You want to know when a myth enters this state, when it leaves it (like Masada), and how to test it.

  **The Diagnostic Test: The Ally Correction**
  To distinguish an Immunized Narrative from a standard Dogma:
  1.  **Present the correction from an Outgroup source:** Adherence goes up. (This happens in many polarized contexts).
  2.  **Present the *same* correction from a trusted Ingroup source (a hero, a founding father, a respected internal historian):**
      *   If adherence stays high: It is **Credal/Dogmatic** (truth doesn't matter).
      *   If adherence drops: It is **Cartographic** (truth matters).
      *   If adherence drops *but* the Outgroup correction still spikes adherence: It is **Immunized**. (The group *can* update, but only on its own terms; external pressure triggers the immune response).

  **Drift In (How a myth becomes Immunized):**
  A myth drifts into immunization when the group's *current* cohesion depends on the *perception of external threat* more than on the historical accuracy of the event.
  *   *Indicator:* The narrative shifts from "This happened to us" to "They did this to us." The focus moves from the event to the *antagonist*.
  *   *Example:* The Confederate "Lost Cause" became immunized not immediately after the war, but during Reconstruction, when external political pressure made the "persecution" aspect more useful for cohesion than the military details.

  **Drift Out (How a myth loses Immunization, e.g., Masada):**
  A myth exits this state when it becomes **maladaptive for physical survival**.
  *   *Indicator:* The cost of the belief (in policy errors or strategic blindness) exceeds the benefit (cohesion).
  *   *Masada Case:* In the 1950s/60s, Israel needed a myth of *defiance* (Masada). In the 1970s/80s, Israel needed a myth of *survival and compromise* (Statehood). A myth of mass suicide became a liability for a state that needed to negotiate and live. The update rule normalized because the *utility* of the immunization dropped.
  *   *Diagnostic for Exit:* Watch for internal pragmatists framing the myth as "inspirational but not literal." Once the literal truth is decoupled from the moral lesson by *internal* leaders, the immunization breaks.

  ### 5. Practical Application

  You want to know whether correcting a story will help or hurt.

  *   **If the myth is Immunized:** External correction will **hurt**. It will increase adherence and be recorded as aggression.
  *   **Strategy:** Do not correct the facts. Either:
      1.  **Wait for Maladaptation:** Let the policy failures accumulate until internal allies begin to question the myth (the Masada path).
      2.  **Recruit Internal Agents:** Find an ingroup member who can introduce the correction as "internal refinement" rather than "external attack."
      3.  **Decouple Utility:** Show that the *value* of the myth (courage, sacrifice) can be retained even if the *facts* (numbers, suicide) are adjusted. (This is how Dunkirk remains a myth of "spirit" despite the military disaster).

  **Summary:** You have identified **Immunized Narratives**. They are defined by an **inverted update rule for external sources**, driven by the **metabolization of criticism as persecution**. They persist until they become **maladaptive for survival**, at which point they may drift back to cartographic or credal status.
