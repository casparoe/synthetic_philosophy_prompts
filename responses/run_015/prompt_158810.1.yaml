  *(Final check on time)*: 55 minutes is very short for 4 groups to iterate. I might need to limit the Referee phase to 2 rounds max per group. I will specify that in the timeline.

  *(Final check on "What will go wrong")*: The prompt specifically asks for this. I need to be detailed.
