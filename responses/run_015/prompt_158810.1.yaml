      *   **Constraints:** No lecture up front, no tech (index cards, markers, whiteboard), no famous cases (Sophie's Choice, etc.).
      *   **Core Mechanism:** Groups build cases from a "claim deck." They write a "codebook" of verdicts ($Ought(\phi)$).
      *   **Referee Rules:** 1. Ought implies Can (no impossible verdicts). 2. Agglomeration ($Ought(A) \land Ought(B) \rightarrow Ought(A \land B)$).
      *   **Goal:** Students discover that their intuition ("both bind, but I can't do both") violates the codebook rules. Repairs drop something essential.
      *   **Specific Distinctions to Operationalize:**
          1.  *Creditor Test:* Who is the residue owed to? (Self vs. Loser).
          2.  *Dischargeable vs. Sealed Residue:* Can it be fixed later?
          3.  *Re-choice Move:* Would you choose the same again? Does that settle it?
      *   **Deliverables:** Runnable plan, materials, rules/script, timeline, claim deck, repair options & responses, debrief map, prediction of failure modes.
      *   **Tone:** Academic, precise, practical, respectful of the student's sophisticated grasp of the material.

  2.  **Deconstruct the Core Mechanism (The "Codebook Game"):**

      *   *The Trap:* Students want to say $Ought(A)$ and $Ought(B)$ where $\neg \Diamond (A \land B)$.
      *   *The Rules:*
          1.  Consistency/Possibility: If $Ought(X)$, then $Possible(X)$.
          2.  Agglomeration: If $Ought(X)$ and $Ought(Y)$, then $Ought(X \land Y)$.
      *   *The Conflict:* If $Ought(A)$ and $Ought(B)$, then $Ought(A \land B)$. But if $\neg \Diamond (A \land B)$, then Rule 1 is violated.
      *   *The "Repair":* To fix the codebook, they must deny $Ought(A)$, deny $Ought(B)$, deny Agglomeration, or deny Impossibility.
      *   *The Insight:* Denying $Ought(A)$ or $Ought(B)$ feels like betraying the moral intuition. Denying Agglomeration feels like logic-breaking. Denying Impossibility feels like lying about the case.

  3.  **Drafting the Plan - Section by Section:**

      *   **Materials:** Need specific cards for claims, specific sheets for the Codebook and Ledger.
      *   **Timeline:** 55 minutes is tight.
          *   0-5: Setup & Grouping.
          *   5-15: Case Construction (The Claim Deck).
          *   15-25: The Codebook Challenge (The Referee Phase).
          *   25-35: Repairs & The Creditor/Discharge Test.
          *   35-45: Re-choice & Board Synthesis.
          *   45-55: Debrief & Lecturette.
      *   **The Claim Deck:** Needs to be diverse but commensurable to force symmetry. (Promise, Rescue, Reparation, Loyalty, Fairness, Project).
      *   **The Referee Script:** Needs to be bureaucratic and neutral. "Stamp: REJECTED." "Reason: Violation of Rule 1."
      *   **Repair Options:**
          1.  *Deny one Ought:* "It was only a preference." (Referee: "Then why the regret?")
          2.  *Downgrade to Cost:* "It's just sad, not wrong." (Referee: "Update the Creditor column.")
          3.  *Deny Agglomeration:* "I ought to A, ought to B, but not both." (Referee: "That's a logic change. Write it down.")
          4.  *Third Option:* "I do C." (Referee: "Costly. Add to ledger.")
      *   **Creditor Test:** A specific column on the worksheet. "To whom is the remainder owed?"
      *   **Discharge Test:** "Write the apology/compensation." If they can't, it's "Sealed."
      *   **Re-choice:** "Would you do it again?" vs. "Is it settled?"

  4.  **Addressing the "Predictable Failures":**

      *   *Third-Option Problem:* Students love utilitarian outs. *Fix:* Make the third option costly or require it to be codified.
      *   *Cost-Benefit Arithmetic:* One group turns it into math. *Fix:* Remind them the task is about *binding claims*, not *optimal outcomes*.
      *   *Asymmetric Case:* One obligation is clearly stronger. *Fix:* The Referee rejects it for lack of symmetry ("Why is this a dilemma and not a calculation?").
      *   *What the Game Can't Do:* It can't prove metaphysical possibility of dilemmas. It only shows the *cost* of denying them. The instructor needs to state that the "No Dilemma" view (Kantian/Utilitarian) saves logic at the price of moral phenomenology.

  5.  **Refining the Referee Script:**

      *   Needs to be firm but Socratic.
      *   "I cannot stamp this. Rule 1 says Ought implies Can. You have written Ought(A) and Ought(B). A and B cannot both be done. Therefore Ought(A and B) is impossible. Therefore one Ought must go."
      *   When they deny agglomeration: "You are proposing a non-standard logic. Note that in the 'Theoretical Cost' column."

  6.  **Developing the Debrief:**

      *   Map the game moves to philosophical positions.
      *   Codebook Rules = Standard Deontic Logic (SDL).
      *   Repairs = Denying Dilemmas (Sinclair, Kant, Utilitarianism).
      *   Residue = Agent-Regret / Moral Remainder (Williams, Nagel).
      *   Re-choice = The phenomenological argument for dilemmas.

  7.  **Review against Constraints:**

      *   55 mins? Yes, tight but doable if transitions are sharp.
      *   16 students? 4 groups of 4 works.
      *   No tech? Index cards/whiteboard only.
      *   No lecture up front? Yes, rules only.
      *   Vocabulary after experience? Yes.

  8.  **Self-Correction/Polishing:**

      *   *Critique:* Is 15 minutes enough for case construction?
      *   *Fix:* Provide a template. Don't let them write prose. Just "Claim A vs Claim B."
      *   *Critique:* Will students understand "Agglomeration"?
      *   *Fix:* Don't use the word. Use the rule: "If you write 'Must A' and 'Must B', you are committed to 'Must (A and B)'."
      *   *Critique:* The "Creditor Test" needs to be very concrete.
      *   *Fix:* Make it a checkbox on the sheet.
      *   *Critique:* The "Re-choice" needs to be distinct from "No Regret."
      *   *Fix:* Phrase it: "Knowing what you know, would you choose the same action?" (Yes) "Does that make the other claim vanish?" (No).

  9.  **Finalizing the Output Structure:**

      *   Introduction (Validation of the idea).
      *   Materials List.
      *   The Claim Deck.
      *   The Worksheet (Codebook & Ledger).
      *   Minute-by-Minute Timeline.
      *   The Referee Script (Rules & Responses).
      *   Predictable Failures & Fixes.
      *   The Debrief (Mapping Experience to Theory).
      *   What You Must Say (The Limits of the Game).

  10. (Final Polish of the Referee Script): Ensure the tone is "Bureaucratic Logic" not "Moral Judge." This emphasizes that the *structure* of morality is the problem, not the content.

  11. (Checking the "Creditor Test"): Ensure the distinction between "Cost to Self" and "Wrong to Other" is clear in the worksheet design.

  12. (Checking the "Discharge"): Make sure they have to *write* the discharge act. If they write "None," that's the "Sealed" category.

  13. (Final Review of "Third Option"): The prompt asks for a mechanism that makes escape clauses costly. I will add a "Theoretical Tax" to the ledger. If they invent a third option, they must list what moral principle they violated to find it.

  14. (Wait, one detail): The prompt asks for "control of the one-page summary" as a stake. I should incorporate that. The group that best identifies the "Sealed Residue" gets to draft the summary.

  15. (Okay, ready to write). The structure looks solid. I will ensure the language matches the user's level (third-year philosophy undergrad/TA level).

