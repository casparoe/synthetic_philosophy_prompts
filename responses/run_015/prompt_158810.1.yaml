answer: |-
  This is a sophisticated design. You are essentially gamifying the inconsistency of Standard Deontic Logic (SDL) when applied to moral phenomenology. The "Codebook" is SDL; the "Repairs" are the standard philosophical moves to deny dilemmas (denying the 'ought', denying the 'can', denying agglomeration, or denying the conflict). The "Ledger" captures the phenomenological cost (residue/regret).

  Here is the runnable plan.

  ### I. Materials & Setup

  **Room Setup:**
  *   Four tables (one per group).
  *   Whiteboard divided into four quadrants (one per group) + a central "Master Ledger" column.
  *   **Stake:** The group that produces the most defensible "Sealed Residue" case (voted by peers at the end) gets to draft the one-page summary for the class.

  **Handouts (Printed on half-sheets):**
  1.  **The Claim Deck:** 6 cards per group (see below).
  2.  **The Codebook Sheet:** A form with three sections: *Verdicts*, *The Creditor Test*, *Discharge Script*.
  3.  **The Repair Ledger:** A table for tracking "Theoretical Costs."

  **The Claim Deck (Cut into cards):**
  *   *Promise:* A specific, explicit commitment made to a friend.
  *   *Rescue:* An immediate need of a stranger (life/limb/security).
  *   *Reparation:* A debt owed for a specific harm you previously caused.
  *   *Loyalty:* A commitment to a colleague who took a risk for you.
  *   *Fairness:* A distributive requirement affecting people not present.
  *   *Project:* A long-term personal commitment essential to your identity.

  **The Codebook Sheet:**
  *   **Section 1: Verdicts.** (Write: `Ought(φ)`)
  *   **Section 2: The Creditor Test.** (If a claim is violated, who is owed the remainder? [ ] Me [ ] The Loser [ ] A Bystander [ ] No One)
  *   **Section 3: Discharge.** (Write the specific act that settles the remainder. If none, write "SEALED".)

  **The Repair Ledger:**
  *   Columns: *Repair Move*, *What Was Saved*, *What Was Lost*.

  ---

  ### II. Minute-by-Minute Timeline (55 Minutes)

  **00:00 – 05:00 | Grouping & Distribution**
  *   Divide into 4 groups of 4.
  *   Hand out Claim Decks and Codebook Sheets.
  *   **Instruction:** "You have 10 minutes. Pick two claims from the deck. Construct a scenario where these two claims conflict. The conflict must be **symmetric** (neither is obviously more important) and **inescapable** (you cannot do both). Do not write a story; write the structure of the conflict."

  **05:00 – 15:00 | Case Construction**
  *   Groups work. You circulate.
  *   **Intervention:** If a group makes one claim obviously stronger (Asymmetry), tell them: "If one is clearly stronger, this is a calculation, not a conflict. Re-balance the weights."
  *   **Intervention:** If they invent a third option (e.g., "I call for help"), tell them: "That option must be added to the Claim Deck as a cost. Does it fully satisfy both original claims? If not, the conflict remains."

  **15:00 – 25:00 | The Referee Phase (Core Mechanism)**
  *   Collect Codebooks. You act as the Referee (or appoint a student referee per group to speed this up, but you should do the first round to set the tone).
  *   **The Rules (Write on Board):**
      1.  **Ought Implies Can:** You cannot write `Ought(φ)` if `φ` is impossible.
      2.  **Conjunction (Agglomeration):** If you write `Ought(A)` and `Ought(B)`, you are committed to `Ought(A and B)`.
  *   **The Action:** Most groups will write `Ought(Save Friend)` and `Ought(Save Stranger)`.
  *   **The Stamp:** Stamp the sheet **REJECTED**.
  *   **The Script:** "Violation of Rule 1. You have `Ought(A)` and `Ought(B)`. By Rule 2, this means `Ought(A and B)`. But you stated `A and B` is impossible. Therefore, one `Ought` must be erased."
  *   Groups must return to their tables to "Repair" the codebook.

  **25:00 – 35:00 | Repairs & The Creditor Test**
  *   Groups attempt repairs. They will try the standard moves (see Section IV).
  *   They must fill out **Section 2 (Creditor)** and **Section 3 (Discharge)** on the Codebook Sheet.
  *   **Constraint:** If they deny an `Ought` (e.g., change `Ought(A)` to `Want(A)`), they must mark the Creditor as "No One." If they keep the `Ought` but deny the conflict, they must write a Discharge Script.
  *   **Board Work:** Each group sends a runner to write their final Verdict and their "Creditor" designation on the whiteboard quadrant.

  **35:00 – 45:00 | The Re-Choice Move**
  *   **Instruction:** "Look at your repaired Codebook. You have made a choice to satisfy the logic. Now, answer this privately, then agree as a group: **Returned to the moment of choice, knowing what you know, would you make the same decision?**"
  *   **Follow-up:** "If you would choose the same way, does that mean the other claim was never real? Or does it remain?"
  *   **Board Work:** Under their quadrant, write: *Re-choose: YES/NO* and *Matter Settled: YES/NO*.
  *   **Expectation:** They will write *Re-choose: YES* but *Matter Settled: NO*.

  **45:00 – 55:00 | Debrief & Mapping**
  *   Gather attention. Do not lecture yet. Ask: "Why was the Codebook so hard to fill out?"
  *   Map their moves to the theory (see Section V).
  *   Deliver the "What I Must Say" conclusion (see Section VI).
  *   Vote on the summary draft assignment.

  ---

  ### III. The Referee Script (Rules & Responses)

  Your persona is **Bureaucratic Logic**, not Moral Judge. You are not saying they are morally wrong; you are saying their codebook is syntactically invalid.

  **The Two Rules (Post these visibly):**
  1.  **Possibility:** `Ought(φ) → ◇(φ)` (If you ought to do it, it must be possible).
  2.  **Agglomeration:** `Ought(φ) & Ought(ψ) → Ought(φ & ψ)` (If you ought to do both, you ought to do the conjunction).

  **Scenario:** Group submits `Ought(A)` and `Ought(B)` where `~◇(A & B)`.
  **Referee Response:** "Rejected. Rule 2 commits you to `Ought(A & B)`. Rule 1 forbids it. Remove one `Ought`."

  **Predicted Repair 1: Denying the Ought (The "Prima Facie" Move)**
  *   *Student:* "Okay, I'll change `Ought(A)` to `Should(A)` or `Ideal(A)`."
  *   *Referee:* "Accepted. But update the **Creditor Test**. If it is only an Ideal, who is owed the remainder? If no one is owed anything, mark Creditor: 'None'."
  *   *Philosophical Cost:* They lose the "binding" nature of the obligation.

  **Predicted Repair 2: Denying Agglomeration (The "Non-Agglomeration" Move)**
  *   *Student:* "I ought to A, I ought to B, but I don't ought to (A and B)."
  *   *Referee:* "Accepted, but this violates Standard Logic. Record this in the **Repair Ledger** under 'Theoretical Cost'. You are claiming moral logic differs from standard logic."
  *   *Philosophical Cost:* They must accept a non-standard logical system (e.g., paraconsistent deontic logic).

  **Predicted Repair 3: The Third Option (The "Utilitarian Escape")**
  *   *Student:* "I do C, which partially satisfies both."
  *   *Referee:* "Does C fully satisfy Claim A? No. Does it fully satisfy Claim B? No. Then `Ought(A)` and `Ought(B)` still stand, and you still violate Rule 1. Record the 'Partial Satisfaction' as a cost in the Ledger."
  *   *Philosophical Cost:* Admitting that "best effort" is not the same as "fulfilling obligation."

  **Predicted Repair 4: Epistemic Uncertainty (The "Ignorance" Move)**
  *   *Student:* "I don't know which one I ought to do."
  *   *Referee:* "The Codebook records verdicts, not knowledge. Do you claim there *is* a fact of the matter you don't know? Or that there *is no* fact? If there is a fact, one `Ought` is false. If there is no fact, mark Creditor: 'None'."
  *   *Philosophical Cost:* Collapsing the dilemma into ignorance or error theory.

  ---

  ### IV. Operationalizing the Distinctions

  **1. The Creditor Test (Section 2 of Sheet)**
  *   **Goal:** Distinguish *Regret* (sadness for self) from *Remainder* (wrong to other).
  *   **Mechanism:** If they downgrade an `Ought` to a `Cost`, they must check "Creditor: Me." If they keep the `Ought` but violate it, they must check "Creditor: The Loser."
  *   **Discovery:** Students will realize that if they "fix" the logic by denying the `Ought`, they lose the right of the loser to complain. The intuition that "the loser is owed an apology" forces them to keep the `Ought`, which breaks the Codebook.

  **2. Dischargeable vs. Sealed (Section 3 of Sheet)**
  *   **Goal:** Distinguish *Cleanup* from *Unsettled Debt*.
  *   **Mechanism:** They must write the script. "I will pay him back next week" (Dischargeable). "I will live with the guilt" (Sealed).
  *   **Discovery:** If they write "Sealed," ask: "How can an obligation persist if it can never be fulfilled?" This is the core of the dilemma argument.

  **3. The Re-Choice Move**
  *   **Goal:** Distinguish *Rational Choice* from *Moral Settlement*.
  *   **Mechanism:** The binary question: *Same Choice?* (Usually Yes) vs. *Settled?* (Usually No).
  *   **Discovery:** This creates the "Signature of the Dilemma." In a normal hard choice, *Same Choice + Settled*. In a dilemma, *Same Choice + Unsettled*.

  ---

  ### V. Debrief: Mapping Experience to Theory

  Do not summarize the positions. Point to the whiteboard and ask them to name the moves they made.

  1.  **The Codebook Rules:** "These rules represent **Standard Deontic Logic** (SDL). Most philosophers who deny dilemmas (e.g., Kantians, Utilitarians) argue that morality *must* fit this codebook. If it doesn't, morality is irrational."
  2.  **Repair 1 (Denying Ought):** "This is the **Prima Facie** move (Ross). You saved logic by saying only one duty was 'actual'. But look at your Creditor column: you erased the victim's right to complain."
  3.  **Repair 2 (Denying Agglomeration):** "This is the **Dilemma Defense** (Marcus, Priest). You saved the moral intuition by breaking the logic. You argued that 'Ought' behaves differently in conflicts."
  4.  **The Re-Choice Signature:** "You all said you would choose the same, but the matter isn't settled. **Bernard Williams** calls this **Agent-Regret**. If it were just a cost, you'd move on. The fact that you feel 'sealed residue' suggests the obligation survived the violation."
  5.  **Epistemic vs. Ontological:** "Did anyone say 'I just don't know the answer'? That turns a moral conflict into a knowledge problem. But did the *feeling* of conflict change? No."

  ---

  ### VI. Predictable Failures & Fixes

  **1. The Third-Option Problem (Utilitarian Escape)**
  *   *What happens:* A group says, "I save the friend but call an ambulance for the stranger."
  *   *The Fix:* Enforce the **Claim Deck** strictures. "Does the ambulance guarantee the stranger's safety? No. Then the Claim 'Rescue Stranger' is still violated. You have not dissolved the conflict; you have mitigated the damage. Record the mitigation in the Ledger, but the Verdict remains `Ought`."
  *   *Why:* This prevents them from buying their way out of the dilemma with consequentialism.

  **2. The Cost-Benefit Group**
  *   *What happens:* A group treats the claims as weights. "Friend = 5 points, Stranger = 3 points."
  *   *The Fix:* Intervene during construction. "You are building a calculation, not a conflict. The prompt requires **symmetry**. If one is heavier, it's not a dilemma. Re-balance the scenario until the group genuinely disagrees on which is heavier."
  *   *Why:* Dilemmas require incommensurability, not just difficulty.

  **3. The Asymmetric Accident**
  *   *What happens:* "I promised my mom I'd visit vs. I promised a terrorist I'd help him bomb."
  *   *The Fix:* Referee Rejection. "This is not a moral conflict; this is a mistake. The Codebook cannot process invalid claims. Replace the Terrorist claim with a valid moral claim (e.g., 'Save a Life')."
  *   *Why:* Ensures the conflict is between genuine goods/obligations.

  **4. The Logic Denial ("Morality isn't math")**
  *   *What happens:* A group refuses to play the Codebook game, saying logic doesn't apply.
  *   *The Fix:* "You are allowed to deny the rules. But you must record that denial in the **Repair Ledger** as 'Rejection of SDL'. Then answer: If logic doesn't apply, how do we reason about it at all? Is it just feeling?"
  *   *Why:* Forces them to articulate the cost of abandoning rationality in ethics.

  ---

  ### VII. What You Must Say (The Limits of the Game)

  The game generates the *phenomenology* of dilemmas and the *logical cost* of denying them. It cannot prove the *metaphysical possibility* of dilemmas. You need to close this gap in the final 5 minutes.

  **Say this:**
  "The game showed you that keeping your moral intuitions (both claims bind, residue remains) breaks the Codebook (Logic). Keeping the Codebook breaks your intuitions (one claim wasn't real, no residue).
  *   The **Anti-Dilemma Theorist** says: 'Logic is non-negotiable. If the Codebook rejects it, the dilemma is an illusion. The residue is just psychological guilt, not moral debt.'
  *   The **Dilemma Theorist** says: 'Morality is messy. If the Codebook rejects the reality of our experience, the Codebook is too small. The residue is evidence of a real, unfulfilled obligation.'
  *   I cannot prove which is true. But notice: To deny the dilemma, you had to tell the 'loser' in your case that they were never owed anything. To accept the dilemma, you had to accept that rationality has a limit. Which cost is higher?"

  **Assign the Summary:**
  "The group that best articulated the 'Sealed Residue' in their Ledger gets to draft the summary. Your task is to explain why the 'Re-Choice' move matters for this debate."

  ### VIII. Instructor Notes for Flow

  *   **Timekeeping:** Be ruthless at the 15-minute mark. If they haven't handed in a Codebook, they can't be rejected. Force the submission.
  *   **The Stamp:** Bring a physical stamp or a bold red marker. The visual of "REJECTED" on their moral reasoning is powerful.
  *   **Silence:** During the Repair phase (25-35), let them struggle. Do not offer hints. The frustration *is* the lesson.
  *   **Board Management:** Ensure the "Creditor" and "Settled?" columns are filled. That is where the debate lives.

  This plan respects the students' intelligence, avoids pre-digested theory, and forces the philosophical problem to emerge from the constraints of their own reasoning.
