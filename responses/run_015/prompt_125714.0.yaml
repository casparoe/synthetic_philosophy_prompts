  7.  (Final thought on Rule 2): The distinction is likely **Immutable vs. Mutable** characteristics, mapped to **Discrimination Law**. Nationality/Religion/Gender = Immutable (mostly). Party/Kids/Risk = Mutable/Choice. That's the "principled" version, even if philosophically shaky. I will emphasize this.

  8.  (Final thought on Rule 1): It assumes **Ordinal Utility**. I need to use that term but explain it simply.

