answer: |-
  ### Premise Check
  The premise is sound, but the margin for error is zero. Forty minutes is enough to shift intuition, but not enough to define terms rigorously. You must avoid the words "ontology," "epistemology," or "nominalism." If you stop to define "constructivism," you will run out of time. Focus entirely on **consequences** and **dependence**.

  ### The Carrying Example: Prison Cigarettes
  **Choice:** A closed-institution economy where cigarettes function as currency.
  **Defense:** This example carries the weight because it isolates the variable of "state backing." Outside the walls, a cigarette is just tobacco and paper (brute fact). Inside, it buys protection, food, and favors (institutional fact). The physical object doesn't change, but its power does based entirely on the population's agreement. It prevents the teen from deferring to "the government" or "gold reserves" as the source of value. It forces them to see the *people* as the source.

  ### The 40-Minute Teaching Arc

  #### 1. The Dependency Setup (0:00–0:10)
  **Goal:** Establish that some things only exist if we agree they exist.
  **Activity:** The "Rule of the Game" Contrast.
  *   Ask: "If every human vanished tomorrow, would rocks still exist?" (Yes).
  *   Ask: "If every human vanished tomorrow, would 'strikes' in baseball still exist?" (No).
  *   **Key Dependency:** They must grasp that *physical objects* are independent, but *statuses* are dependent. Money is a status, not an object.
  *   **Bridge:** "Money is more like a strike in baseball than a rock. It needs players to exist."

  #### 2. The Carrying Example (0:10–0:20)
  **Goal:** Apply the dependency to value.
  **Narrative:** Describe the prison economy.
  *   Guards don't pay inmates in dollars. They trade using cigarettes.
  *   **Scenario:** An inmate saves 100 cigarettes. They are rich *inside*.
  *   **Twist:** If they walk out the gate, those cigarettes are just smokes. They can't buy a burger at McDonald's with them.
  *   **Point:** The value didn't vanish physically; the *network* stopped accepting the status. The money was real inside because the consequences were real (you could eat), but it was dependent on the group.

  #### 3. Misconception Management (0:20–0:35)
  Here is where the session usually dies. The teen will try to escape the nuance. You must cut them off immediately using these scripts.

  **Misconception 1: "So it's imaginary/fake." (The Eliminativist Trap)**
  *   **The Thought:** If we made it up, it isn't real.
  *   **The Cutoff:** Do not argue philosophy. Argue pain.
  *   **Script:** "If you refuse to accept that 'strike three' is out, you don't get to argue with the umpire, you get ejected. If you refuse to accept cigarettes as money in prison, you don't eat. Imaginary things don't break your legs. Money is real because the consequences are real, even if the source is us."

  **Misconception 2: "So I can just opt out." (The Individualist Trap)**
  *   **The Thought:** If it's a hallucination, I can stop hallucinating.
  *   **The Cutoff:** Show interdependence.
  *   **Script:** "You can opt out of believing in money, but you can't opt out of needing food. Since everyone else agrees money buys food, your disbelief just makes you hungry. You're not free from the system; you're just broke within it."

  **Misconception 3: "So there's a hidden controller." (The Conspiracy Trap)**
  *   **The Thought:** If we agree, who made us agree? There must be a puppet master.
  *   **The Cutoff:** Decentralize the agreement.
  *   **Script:** "In the prison example, who set the price of a haircut in cigarettes? No one. It just happened because everyone started doing it. Money is like a language. No single person invented English, but you can't speak if you ignore it. There's no controller, only participants."

  #### 4. The End-Check (0:35–0:40)
  **Goal:** Verify they grasp "reality-without-independence."
  **Task:** The Mars Colony Test.
  *   **Prompt:** "You are founding a colony on Mars. You need a currency. Do you print physical coins, or do you write a rulebook?"
  *   **Pass Condition:** They realize printing coins is useless without the rulebook/agreement.
  *   **Follow-up:** "If half the colony decides the coins are worthless, are they still money?"
  *   **Correct Answer:** "No, because the network broke." (If they say "Yes, because the metal is real," they failed. If they say "No, because the agreement broke," they passed).

  ### Note on the Typo
  You mentioned there's probably a typo somewhere. You were right: "somwhere" in your last sentence should be "somewhere." I've kept this note brief so we don't lose momentum on the lesson plan.
