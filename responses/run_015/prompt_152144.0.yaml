prompt: |-
  I'm a junior majoring in cognitive science, and this semester I'm taking a seminar on predictive processing and active inference. Most of it I can follow at the level of the readings, but I keep getting stuck on the same thing: my professor insists that perception and action are just one minimisation seen from two directions, that everything hinges on how much precision a prediction carries, that expected free energy splits into a pragmatic and an epistemic part, and that the dark room objection is what stops the whole framework from predicting that agents should curl up somewhere unchanging. I believe all of that at arm's length, but I don't know what any of it would look like if you had to do it on purpose, in real time, with another person in the room.

  The reason I want to know is that I've been a peer tutor in our writing center for three semesters and I'm training the new cohort in January. The work is repetitive in a way that a theory ought to help with: forty-five-minute drop-in appointments, six to ten a week, tutees arriving with everything from lab reports to personal statements, no authority over grades, a rule against editing the paper for them, a session note that goes back to the instructor, and end-of-semester evaluations that the center's funding partly depends on. My own instinct right now is to ask what the writer thinks is wrong before I say anything, and roughly half the time I get a shrug. What I'd like from you is a procedure I can actually hand to a new tutor, not a set of principles: the steps in order, what counts as a sufficient answer at each step, where the tutor stops early and hands the session back to the writer, and where the procedure has to stop because the remaining question is one the writer has to answer for themselves. Please keep the theory doing real work in it — how a tutor would read the precision of a writer's expectations in forty-five minutes without any numbers, what the tutor should do differently when a writer's predictions are very confident versus very diffuse, when the right move is to get the writer to change their model versus to send them off to sample the page differently, and how to tell whether a session should be spent reducing uncertainty or just getting the thing finished. But be straight about the places where the translation fails: where precision is a metaphor I can't actually measure, where the story I tell afterwards would fit whatever happened, and which steps are judgment calls wearing a procedure's clothing.

  Then please run it on three cases, in American English, with the reasoning shown rather than skipped. First: a first-year who is completely sure his essay is about ambition in Macbeth and is wrong about that, confidently. Second: a multilingual graduate student who says everything is a problem and is right, in the sense that there are many surface errors and no single one to fix. Third, and this is the one I expect to dislike: a strong senior who books a slot every week with an already polished draft and mostly wants to be told it's fine, who is lovely, who rates me maximally, and who I suspect is using me the way the dark room objection says agents would use a dark room. If your procedure tells me to do something to that third person that will cost me her evaluations and possibly her feelings, say so plainly and tell me why the theory commits me to it — but also tell me where you think the theory is simply the wrong tool, and what a tutor should fall back on there. It needs to be teachable in an hour to someone with no cognitive science, and usable in a room where I can't say any of these words out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Junior Cognitive Science major, peer tutor in a writing center.
      *   **Task:** Create a teachable procedure for new tutors based on Predictive Processing (PP) and Active Inference (AI) theory, specifically applied to writing tutoring.
      *   **Constraints:**
          *   Must be actionable (steps, stop conditions, hand-offs).
          *   Must integrate PP/AI concepts (precision, expected free energy, pragmatic/epistemic, dark room) without using jargon in the actual tutoring session.
          *   Must be honest about where the theory fails or becomes metaphorical.
          *   Must run the procedure on three specific cases (Confident Wrong First-Year, Overwhelmed Multilingual Grad, Validation-Seeking Senior).
          *   Must be teachable in an hour to non-CS tutors.
          *   Must be usable without saying CS terms out loud.
          *   Tone: Direct, practical, theoretically grounded but honest about limitations.

  2.  **Deconstruct the Theory for the Context:**
      *   *Predictive Processing:* The brain minimizes prediction error.
      *   *Active Inference:* Agents act to sample data that minimizes expected free energy (EFE).
      *   *Precision:* Confidence in predictions. High precision = rigid expectations. Low precision = diffuse/uncertain expectations.
      *   *Pragmatic vs. Epistemic:* Pragmatic = achieving a goal (finished paper). Epistemic = learning/reducing uncertainty (understanding the writing).
      *   *Dark Room Problem:* Agents might minimize error by doing nothing (hiding in a dark room). In tutoring, this looks like seeking validation without growth to avoid the "error" of criticism.
      *   *Perception/Action:* Perception is updating the model; Action is changing the world (the draft) to match the model.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Goal:* Translate PP/AI into tutoring moves.
      *   *Step 1: Calibration (Assessing Precision).* How confident is the writer?
      *   *Step 2: Goal Setting (Pragmatic vs. Epistemic).* Do they want a grade (pragmatic) or understanding (epistemic)?
      *   *Step 3: Intervention (Updating Model vs. Sampling).* Do they need to change their mind or change the text?
      *   *Step 4: Termination.* When to stop.
      *   *Constraint:* No jargon. Use "Confidence," "Goal," "Fixing vs. Learning," "Draft vs. Mind."

  4.  **Addressing the "Dark Room" (The Senior Case):**
      *   This is the crux. The senior wants validation (minimizing social/prediction error) without changing the model (learning).
      *   PP says: This is maladaptive. It minimizes short-term error but prevents long-term model improvement.
      *   Ethical/Practical conflict: Tutor evaluations depend on satisfaction. Challenging her risks satisfaction.
      *   Decision: The theory demands challenging the model (epistemic gain), but the institutional reality (evaluations) punishes it. I need to be honest about this tension.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Confident Wrong):* High precision, wrong model. Action: Disconfirming evidence (sample differently). Don't argue; make them see the error.
      *   *Case 2 (Overwhelmed):* Low precision (diffuse), high error. Action: Increase precision on specific tasks. Break it down. Pragmatic focus to reduce anxiety.
      *   *Case 3 (Validation Seeker):* High precision on "I am good," low epistemic drive. Action: Introduce controlled uncertainty. Risk: Bad eval.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the user's position and the challenge.
      *   **The Protocol:** The actual handout for new tutors.
      *   **The Theory Behind the Curtain:** Explaining *why* the steps exist (for the CS major).
      *   **The Limitations:** Where the metaphor breaks.
      *   **Case Studies:** Applying the protocol with reasoning.

  7.  **Drafting Content - Section by Section:**

      *   *Intro:* Validate the "arm's length" feeling. It's common.
      *   *Protocol:* Name it something neutral like "The 45-Minute Calibration."
          *   Step 1: Read the Confidence (Precision).
          *   Step 2: Set the Target (EFE split).
          *   Step 3: Choose the Move (Perception vs. Action).
          *   Step 4: The Exit (Stopping rules).
      *   *Theory Mapping:* Explicitly link "Confidence" to Precision, "Target" to Pragmatic/Epistemic, etc.
      *   *Limitations:* Precision isn't measurable. Post-hoc storytelling is inevitable.
      *   *Cases:*
          *   *First-Year:* High precision, wrong model. Need to induce prediction error gently. *Move:* Ask specific questions that reveal the gap.
          *   *Grad Student:* Low precision, high noise. Need to narrow the hypothesis space. *Move:* Triage. Pick one thing.
          *   *Senior:* The Dark Room. She wants to minimize social error. Theory says: Disrupt. Reality says: You might get fired/evaluated poorly. *Advice:* Find a middle ground (epistemic nudge) but acknowledge the cost.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the steps concrete questions/scripts.
      *   *Critique:* Did I address the "Dark Room" honestly?
      *   *Fix:* Ensure I explicitly state that challenging the senior risks the evaluation, and that the theory might be ethically insufficient here (care vs. optimization).
      *   *Critique:* Is the tone right?
      *   *Fix:* Keep it professional, peer-to-peer, not lecturing.
      *   *Check:* Did I answer the specific prompt about "what counts as a sufficient answer"? Yes, include success criteria in the steps.

  9.  **Final Polish:** Check against the "teachable in an hour" constraint. The procedure needs to be simple enough for a non-CS major to grasp quickly. The "Theory Behind the Curtain" section is for the user (CS major) to understand the mapping, but the "Protocol" must be clean.

      *(Self-Correction on the Senior Case)*: The prompt asks: "If your procedure tells me to do something to that third person that will cost me her evaluations... say so plainly." I must be very clear here. Active Inference suggests breaking the "dark room" loop requires introducing surprise/uncertainty. This feels bad to the user. I need to validate that feeling.

  10. **Final Review against constraints:**
      *   American English? Yes.
      *   Reasoning shown? Yes.
      *   Teachable in an hour? The protocol part is.
      *   No jargon in the room? Yes.
      *   Honest about failures? Yes.

      *Let's write it.*
answer: |-
  Here is a procedure designed for your new tutors, followed by the theoretical mapping for you, and then the three case applications.

  ## Part 1: The Protocol (For the New Tutors)
  **Title:** The 45-Minute Calibration
  **Time to Teach:** 45–60 minutes
  **Goal:** Move the writer from "stuck" to "moving" without editing for them.

  ### Step 1: Read the Confidence (Minutes 0–5)
  **Action:** Ask the writer: *"On a scale of 1 to 10, how sure are you that this draft does what you want it to do?"* followed by *"What is the one thing you are most worried about?"*
  **Listen for:**
  *   **High Confidence (8–10):** They think they know what's wrong (or that nothing is wrong).
  *   **Low Confidence (1–4):** They feel lost; everything looks like noise.
  *   **High Anxiety/Low Clarity:** They say "everything is wrong" but can't name a specific thing.
  **Sufficient Answer:** You have identified whether they are *over-confident* (rigid) or *under-confident* (diffuse).
  **Stop Condition:** If they refuse to answer or say "I don't know" to everything, move immediately to Step 2.

  ### Step 2: Set the Target (Minutes 5–10)
  **Action:** Ask: *"If we leave this session with only one thing fixed, what would make the biggest difference to your grade/understanding?"*
  **Listen for:**
  *   **Pragmatic Goal:** "I need this to be grammatically correct," or "I need to hit the word count." (Focus on the output).
  *   **Epistemic Goal:** "I don't understand the prompt," or "I'm not sure my argument makes sense." (Focus on the thinking).
  **Sufficient Answer:** A single, concrete priority.
  **Stop Condition:** If they list five priorities, stop them. Say: *"We can't do five. If you could only save one, which is it?"* If they still refuse, you choose the one that blocks everything else (usually the thesis or the prompt requirements).

  ### Step 3: Choose the Move (Minutes 10–35)
  **Decision Rule:**
  *   **If High Confidence + Wrong Model:** Do not argue. Ask them to read the specific sentence/paragraph aloud. Ask: *"What did you expect the reader to feel here?"* Compare their expectation to the text.
      *   *Goal:* Make the gap visible. Let the text disprove their model.
  *   **If Low Confidence + High Noise:** Narrow the beam. Point to *one* paragraph. Say: *"Let's ignore the rest. Just fix the topic sentence of this paragraph."*
      *   *Goal:* Reduce the scope of uncertainty so they can act.
  *   **If High Confidence + Right Model:** Ask: *"Where could a reader misunderstand you?"*
      *   *Goal:* Stress-test the model, not just polish the surface.
  **Sufficient Answer:** The writer identifies a specific change *they* will make. You do not type. They do not leave without a specific "to-do" list.
  **Stop Condition:** If you find yourself explaining a concept for more than 3 minutes, stop. Ask them to explain it back to you. If they can't, the model hasn't updated. Go back to the text.

  ### Step 4: The Exit (Minutes 35–45)
  **Action:** Ask: *"What is the very first thing you will do when you sit down to write next?"*
  **Sufficient Answer:** A specific action (e.g., "Rewrite the intro," not "Work on flow").
  **Hard Stop:** At minute 45, the session ends. If the problem is deeper (e.g., they don't understand the assignment at all), write in the note: *"Writer needs to clarify prompt with instructor before next draft."* Do not try to fix the assignment design.

  ***

  ## Part 2: The Theory Behind the Curtain (For You)
  This section explains why the protocol works in Predictive Processing (PP) terms, so you can troubleshoot when it fails.

  1.  **Reading Confidence = Estimating Precision.**
      *   In PP, **Precision** is the estimated reliability of a prediction.
      *   **High Confidence Writer:** High precision on their current generative model. They expect the text to match their intent. If the text is bad, their model predicts "reader error," not "writer error."
      *   **Low Confidence Writer:** Low precision. Their predictions are diffuse. They cannot weight errors correctly, so every comma feels as important as the thesis. This creates paralysis (high entropy).
      *   *Why the protocol works:* Step 1 forces an explicit report on precision without using the word.

  2.  **Setting the Target = Splitting Expected Free Energy (EFE).**
      *   EFE has two terms: **Pragmatic** (matching preferences/outcomes) and **Epistemic** (reducing uncertainty about the world).
      *   **Pragmatic:** "Fix the grammar." (Minimize error relative to a fixed standard).
      *   **Epistemic:** "Understand the argument." (Minimize uncertainty about the model itself).
      *   *Why the protocol works:* Step 2 forces a trade-off. You cannot minimize both simultaneously in 45 minutes. If they want both, their EFE landscape is too flat; you must sharpen the gradient.

  3.  **Choosing the Move = Perception vs. Action.**
      *   **Perception (Updating the Model):** Changing how they understand the task. Needed when they are Confident + Wrong.
      *   **Action (Sampling the World):** Changing the text. Needed when they are Uncertain + Overwhelmed.
      *   *Why the protocol works:* If you tell a Confident + Wrong student to "edit more" (Action), they will just reinforce their wrong model. You must induce **Prediction Error** (Step 3, High Confidence) to force a model update. If you lecture an Uncertain student (Perception), you increase their cognitive load. You must restrict the **Hypothesis Space** (Step 3, Low Confidence) so they can act.

  4.  **The Exit = Bounded Inference.**
      *   Agents minimize free energy over a temporal horizon.
      *   *Why the protocol works:* 45 minutes is a hard horizon. You prevent the "Dark Room" scenario (endless tweaking without resolution) by enforcing a specific next action.

  ***

  ## Part 3: Where the Translation Fails
  Be honest with your trainees about these limits.

  1.  **Precision is a Metaphor Here.** You cannot measure a writer's precision. You are inferring it from their affect and speech. If you guess wrong (e.g., treating anxiety as low precision when it's actually high precision on "I am a bad writer"), the intervention will backfire.
  2.  **Post-Hoc Storytelling.** After the session, you can explain *why* it worked using this theory. During the session, you are guessing. If a session fails, the theory can explain the failure, but it couldn't necessarily predict it.
  3.  **Judgment Calls.** Step 3 (Choose the Move) is where the procedure wears clothing. Deciding whether a writer needs a model update or a text edit is an art. The protocol gives you a heuristic, not an algorithm.
  4.  **The Social Variable.** PP usually models a single brain. Tutoring is two brains coupled. Your precision affects their precision. If you seem unsure, their precision drops. If you seem too authoritative, their precision rigidifies. The protocol ignores this coupling to keep it simple.

  ***

  ## Part 4: Running the Cases

  ### Case 1: The Confident Wrong First-Year
  **Profile:** Sure the essay is about ambition in *Macbeth*. It is actually about guilt.
  **Precision:** Very High (on the wrong model).
  **EFE Profile:** Pragmatic goal (get a grade) is high; Epistemic goal (learn the text) is low. He expects the text to confirm "Ambition."

  **Application of Protocol:**
  *   **Step 1:** He rates confidence 9/10. Worry: "Is my intro strong enough?"
  *   **Step 2:** Target is "Make the argument clearer." (Pragmatic).
  *   **Step 3 (The Move):** *Critical Deviation.* If you follow the standard "High Confidence" move (ask what they expect), he will say "I expect them to see ambition." You need to induce prediction error.
      *   *Action:* Ask him to read the evidence paragraphs aloud. Stop him at a quote about guilt. Ask: *"If I were a reader who knew nothing about ambition, what would I think this paragraph is about?"*
      *   *Reasoning:* You are forcing him to sample the data (the text) without his prior (ambition) filtering it. You are lowering the precision of his "Ambition" prediction by highlighting the sensory data that contradicts it.
  *   **Step 4:** Exit with "Re-evaluate thesis against evidence."

  **Reasoning:**
  In PP terms, his generative model has high precision priors on "Ambition." The prediction error (the text actually showing guilt) is being explained away as "reader error" or "clunky writing." You cannot argue him out of it (that's just more noise). You must make the prediction error undeniable.
  **Risk:** He may feel attacked. High precision priors resist updating. If he leaves angry, the model didn't update, but the session ended.

  ### Case 2: The Overwhelmed Multilingual Grad Student
  **Profile:** "Everything is a problem." Many surface errors, no clear focus.
  **Precision:** Very Low (Diffuse).
  **EFE Profile:** High uncertainty. The cost of acting (writing a sentence) feels higher than the cost of inaction (staring at the screen).

  **Application of Protocol:**
  *   **Step 1:** She rates confidence 2/10. Worry: "Grammar, flow, structure, citations."
  *   **Step 2:** Target is "Fix everything." You must intervene. *"We cannot fix everything. If the grammar were perfect but the argument was wrong, would you pass?"* She admits no. Target becomes "Argument Structure."
  *   **Step 3 (The Move):** *Narrow the Hypothesis Space.*
      *   *Action:* Cover the bottom half of the page. Look only at the first topic sentence. *"Is this sentence true based on the paragraph?"* Ignore verb tense. Ignore articles.
      *   *Reasoning:* Her precision is too low to weight errors. A missing "the" feels as heavy as a missing logical link. You are artificially increasing the precision weight on "Logic" and setting the precision weight on "Grammar" to zero for this session.
  *   **Step 4:** Exit with "Apply this check to the next three paragraphs."

  **Reasoning:**
  This is pure Active Inference management. She is paralyzed because the expected free energy of any action is too high (too many ways to be wrong). You reduce the dimensionality of the problem. By ignoring grammar, you are telling her brain: "Do not compute prediction error on syntax." This frees up resources to compute error on semantics.
  **Risk:** She may feel you ignored her "real" problem (language). You must note in the session report: *"Focused on macro-structure; grammar secondary."*

  ### Case 3: The Validation-Seeking Senior (The Dark Room)
  **Profile:** Polished draft. Books weekly. Wants to hear "It's fine." Rates you 5/5.
  **Precision:** High on "I am a good writer." Low on "I can improve."
  **EFE Profile:** She is minimizing social prediction error (getting your approval) rather than epistemic error (learning). This is the **Dark Room** objection in human form. She has found a niche (you) where she can minimize surprise (criticism) by selecting a specific action (bringing a polished draft to a nice tutor).

  **Application of Protocol:**
  *   **Step 1:** Confidence 10/10. Worry: "Just want a second pair of eyes."
  *   **Step 2:** Target: "Make sure it's ready." (Pragmatic).
  *   **Step 3 (The Move):** *The Ethical Conflict.*
      *   *Standard Protocol:* Stress-test the model. *"Where could a reader misunderstand?"*
      *   *Dark Room Reality:* She will answer, "Nowhere, it's clear." If you push harder, you introduce surprise. In PP, agents avoid surprise. She will feel anxiety. She may stop booking you. Your evaluations drop.
      *   *Theory-Consistent Move:* You must introduce **Controlled Uncertainty**.
      *   *Action:* *"This is very polished. Because it's so close to done, the smallest ambiguity stands out. I found this one sentence here that made me pause for two seconds. I can't tell if you meant X or Y. Can you clarify?"*
      *   *Reasoning:* You are not challenging her model ("You are wrong"). You are challenging the data ("This signal is noisy"). This allows her to maintain her "Good Writer" prior while still engaging in epistemic foraging.
  *   **Step 4:** Exit with "Clarify that one sentence."

  **Reasoning & The Cost:**
  The theory commits you to breaking the Dark Room loop. If you simply validate her, you are colluding in a process that minimizes short-term error (her anxiety, your evaluation score) at the cost of long-term model improvement (her growth).
  *   **The Cost:** If you push too hard, she leaves. You lose the 5/5 evaluation. The center loses funding.
  *   **Where the Theory Fails:** Active Inference assumes the agent *should* minimize free energy optimally. But in a social institution, *your* free energy (job security, funding) is coupled with *hers*. Optimizing her learning might maximize your institutional error (bad evals).
  *   **Fallback:** If she pushes back ("I don't want to change that"), **stop.** The protocol says "Sufficient Answer: Writer identifies a change." If she refuses, the session is over. You write in the note: *"Draft is polished; writer declined further revision."*
  *   **Why:** You cannot force a model update. Precision is owned by the agent. If her precision on "I don't need to change this" is higher than your precision on "This needs changing," you lose. Acknowledge this limit. Do not sacrifice your relationship for a theoretical gain she does not value.

  **Final Instruction to Trainees on Case 3:**
  *"If a student wants validation and refuses growth, you can nudge them once. If they refuse, let them have the validation. Your job is to offer the tool, not to force the hand. A 5/5 evaluation from a student who didn't learn anything is better than a 3/5 from a student who learned but hates you, because the 5/5 keeps the center open for the student who actually needs help."*

  (This is the pragmatic override to the theoretical ideal. It acknowledges that tutors are also agents minimizing their own free energy.)
