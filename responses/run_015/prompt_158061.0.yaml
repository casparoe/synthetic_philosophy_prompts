      *   *The Appendage:* Worker serves the machine, not vice versa.
      *   *Surplus Value:* Relative surplus value (increasing productivity to lower necessary labor time).
      *   *Subsumption:* Formal (capital takes over existing process) vs. Real (capital revolutionizes the technical process).

  4.  **Map the Actors:**
