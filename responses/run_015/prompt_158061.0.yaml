      *   *The Robots/Line:* Dead Labor. They embody the coercive power of capital. They set the pace.
      *   *Line Workers:* Living Labor. They are being transformed into appendages. Their resistance is the friction of living labor against dead labor.
      *   *UAW Local:* The organizational form of living labor trying to reclaim control over the pace.

  5.  **Analyze Surplus Value & Bottlenecks:**
      *   Marx argues machinery increases relative surplus value by cheapening commodities.
      *   At Lordstown, the bottleneck shifts. It's not just how fast a human can weld; it's how long the robot stays running and how fast the line moves *without* breaking the human spirit (which causes sabotage).
      *   *Crucial Point:* Marx acknowledges machinery can lead to breakdowns and friction, but he often assumes the machine dictates the pace successfully. Lordstown shows the *failure* of the machine to fully subordinate living labor.

  6.  **Evaluate "Shadow Labor Migration":**
      *   *The Concept:* Skills don't vanish; they hide (maintenance, troubleshooting, emotional coping).
      *   *Marx's View:* Marx generally argues machinery *deskills* the worker (the "moral depreciation" of labor power). He sees the craft worker replaced by the machine minder.
      *   *The Tension:* Lordstown suggests the skill didn't disappear; it became *reactive*. The "shadow labor" is the work of keeping the brittle automated system running and the psychological work of enduring the pace.
      *   *Formal vs. Real Subsumption:*
          *   *Formal:* Capital controls the hours/wages.
          *   *Real:* Capital controls the *method* of production.
          *   *Lordstown:* This is peak Real Subsumption technically, but socially it failed. The "shadow labor" is the gap where Real Subsumption wasn't total. The workers still held power through sabotage (withholding cooperation).
      *   *Does Marx miss this?* Yes, to an extent. Marx focuses on the *structural* deskilling. He underestimates the *tactical* reskilling required to manage broken automation and the *emotional* labor of resisting the pace. He treats the machine as a more stable dictator than it was.

  7.  **Drafting the Analysis (Iterative Process):**

