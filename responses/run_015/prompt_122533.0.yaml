answer: |-
  In a specific lineage of Antarctic fish, a metabolic enzyme, *Thermozyme*, exists in duplicate copies due to genome duplication. *Thermozyme-A* was historically selected for catalyzing a reaction producing ATP-precursor P (X). Currently, *Thermozyme-B* produces sufficient P for all metabolic needs, rendering *Thermozyme-A*'s production of P redundant; removing *Thermozyme-A* does not diminish ATP capacity. However, *Thermozyme-A*'s catalysis is highly exothermic. In this lineage, ambient cold makes this waste heat (Y) essential for maintaining muscle contraction capacity. *Thermozyme-A* is healthy, typical, and load-bearing via heat generation. Biologists confirm the heat contribution is physiologically critical but evolutionarily recent, lacking independent selection history distinct from the original catalytic function.

  **Trait:** *Thermozyme-A* enzyme.
  **Selection Story (X):** Selected for producing ATP-precursor P in ancestors.
  **System/Capacity (Y):** Muscular system; capacity for contraction via thermoregulation.
  **Verdicts:** SE identifies function as P-production (history), excluding Y (no selection). CR identifies function as Heat-generation (current contribution), excluding X (no contribution due to redundancy).
  **Key Feature:** Functional Redundancy of X.
  **Removal Effect:** If *Thermozyme-B* is removed, X contributes again, aligning SE and CR verdicts.
  **Defense Attack:** An SE defender argues function is dispositional: *Thermozyme-A* retains the function to produce P because it *would* contribute if B failed.

  **Commitment:** I choose this case because it isolates evolutionary history from current systemic contribution without invoking disease, vestigiality, or environmental mismatch. It beats alternatives like the larynx (where X still contributes) or the appendix (often deemed vestigial). This case demonstrates that SE and CR are not competing truths but answer different questions: SE explains why the trait exists (etiology), while CR explains how the trait works now (organization). Neither account is "right" to the exclusion of the other; they illuminate different dimensions of biological explanation.
