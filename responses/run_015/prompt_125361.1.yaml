answer: |-
  This is a sophisticated analogy, and it is gratifying to see solid-state concepts deployed in a metaphysical trench war. You are essentially proposing a **quasiparticle ontology of omission**.

  As a physicist, you know that a hole is not "nothing." It is a collective excitation of the many-body system that behaves *as if* it were a particle with positive charge and positive mass. Your friend's objection ("there's nothing there to do the causing") is the classical mereological fallacy that the hole analogy is perfectly designed to dismantle.

  However, like any good model, it has a domain of validity. Let's audit the mapping, address your worries, and see if it carries the moral weight you want it to bear.

  ### 1. The Mapping

  Here is how the semiconductor physics maps onto the neighbor/plant scenario:

  | Solid State Physics | Metaphysics / Ethics |
  | :--- | :--- |
  | **The Lattice / Potential** | **The Normative & Biological Context.** The laws of biology (plants need water) + the social agreement (neighbor promised to water). |
  | **The Nearly-Filled Band** | **The Expected State of Affairs.** The background "vacuum" where water *ought* to be present to maintain life. |
  | **The Electron** | **The Positive Intervention.** The act of pouring water (or the water molecules themselves). |
  | **The Hole** | **The Omission.** The absence of water where it was expected/required. |
  | **Effective Mass / Charge** | **Causal Power / Responsibility.** The capacity of the omission to produce an effect (death) and bear moral weight. |
  | **The Current** | **The Outcome.** The process of the plant dying (or the flow of events leading to death). |
  | **Electron hopping into hole** | **Physiological Decay.** The actual physical mechanisms (loss of turgor pressure) that constitute the "work" of dying. |

  ### 2. Auditing Your Worries

  **Worry 1: Background Dependence (Lattice vs. Norms)**
  *Your worry:* A hole only behaves like a particle because of the lattice. Do omissions only cause because of norms?
  *Verdict:* **Yes, and this is a feature, not a bug.**
  In a vacuum, a hole is nothing. In a crystal, it is a dynamical agent. Similarly, in a void, "not watering" is just a state of the universe. But embedded in the "lattice" of biological needs and social agreements, that absence acquires "effective mass."
  This concedes a point to your friend: omissions are not *intrinsic* causes; they are *relational* or *contextual* causes. However, since almost all macroscopic causation is context-dependent (a spark causes a fire only in the presence of oxygen and fuel), this does not disqualify them from being causes. It just means causation is not a fundamental relation between isolated objects, but a property of systems. The analogy holds: **The hole is real *relative to the band*, just as the omission is real *relative to the norm*.**

  **Worry 2: Bookkeeping vs. Reality**
  *Your worry:* Is the hole just a calculational trick? If so, does the analogy only show we can *talk* as if omissions cause?
  *Verdict:* **It depends on your ontology of quasiparticles.**
  If you are an instrumentalist about holes, the analogy only supports an instrumentalist view of omission causation (useful for prediction, not ontologically robust). But if you are a realist about emergent phenomena (as most condensed matter physicists are when measuring Hall coefficients), then holes are as real as collective excitations get.
  The analogy supports **Causal Pluralism**. It suggests there is no single "metaphysical glue" for causation. Sometimes it's billiard balls (electrons), sometimes it's absences propagating through a structure (holes). If you accept holes as causal agents in the lab, you should accept omissions as causal agents in the garden.

  ### 3. The Moral Conclusion: Killing vs. Letting Die

  Here is where the analogy requires careful handling. You want to use it to show there is no *metaphysical* difference between killing and letting die, implying the moral difference is shaky.

  **Where the analogy succeeds:**
  It destroys the premise that "omissions cannot cause." If your friend argues, "You didn't cause the death; you just didn't prevent it," you can reply: "In a nearly-filled system, the absence *is* the carrier of the current." The hole *does* the work. The omission *does* the causing.

  **Where the analogy might stall:**
  In semiconductor physics, electrons and holes are **not identical**.
  1.  **Effective Mass:** Holes often have a different effective mass than electrons.
  2.  **Scattering:** They scatter differently off the lattice.
  3.  **Recombination:** An electron meeting a hole annihilates both.

  Translated to ethics: Even if both the act (killing/electron) and the omission (letting die/hole) cause the same current (death), they may traverse the "moral lattice" differently.
  *   **Killing** introduces a new particle (force/energy) into the system.
  *   **Letting Die** allows a hole to propagate through the existing structure.

  The physics analogy actually suggests they are **distinct causal mechanisms** that yield the same output. In many transistors, we treat them symmetrically (CMOS), but in others, their different mobilities matter.
  Therefore, the analogy proves omissions are *causes*, but it does not necessarily prove they are *metaphysically identical* to commissions. Your friend could concede the hole analogy and still argue: "Fine, both cause death. But one is an injection of energy (electron), and one is a relaxation of constraint (hole). That is a genuine metaphysical difference, even if both are causal."

  **Does it carry the moral conclusion?**
  It carries the **causal** conclusion (omissions cause), which undermines the *strongest* version of your friend's argument. However, it does not automatically collapse the moral distinction, because moral distinctions often track the *mode* of causation (intervention vs. allowance), not just the output. The hole analogy shows the mode is different (positive charge carrier vs. negative charge carrier), even if the current is the same.

  ### 4. Is there a better analogy?

  The hole analogy is excellent for the **ontology of absence**. It is the best tool for saying "Nothing can do something."

  However, if your goal is specifically to collapse the **moral distinction** between killing and letting die, you might supplement it with a **Control System / Feedback Loop** analogy.

  **The Thermostat Analogy:**
  *   **System:** A house heating system.
  *   **Killing:** You actively crank the boiler to maximum until the pipes burst.
  *   **Letting Die:** You disable the thermostat's "on" switch while the temperature is dropping.
  *   **Outcome:** The pipes burst/freeze in both cases.
  *   **Causal Structure:** In both cases, the state of the system is determined by the settings of the controller. Whether you input a `+1` command or remove a `-1` constraint, the causal chain flows through the same machinery (the boiler, the pipes, the thermodynamics).

  **Why this might be better for the moral argument:**
  In the hole analogy, the electron and hole are distinct quasiparticles. In the thermostat analogy, the *causal pathway* is identical; only the *input signal* differs (active command vs. lack of command). This aligns better with the intuition that the *result* is what matters morally, not the metaphysical category of the input.

  ### Summary Audit

  1.  **Does the analogy hold?** Yes, remarkably well. It is ontologically robust within the framework of emergent phenomena.
  2.  **Does it address the "nothing there" objection?** Yes. It demonstrates that "nothing" (absence of electron) can have positive properties (charge, mass, current) relative to a structure.
  3.  **Does it prove omissions are norm-dependent?** Yes. It confirms your worry: holes require a lattice; omissions require norms. This makes causation normative/structural, not just physical.
  4.  **Does it kill the Killing/Letting Die distinction?** It kills the idea that letting die is *acausal*. It does not prove the two are *metaphysically identical*, only that they are **causally symmetric** (like p-type and n-type conduction).

  **Recommendation:**
  Use the hole analogy to win the **causation** battle (against the claim that omissions aren't causes). But be prepared for your friend to retreat to the **agency** distinction (electrons and holes move differently). If you want to press the moral equivalence, argue that in the "circuit of responsibility," the current (death) is what blows the fuse, regardless of whether it was carried by an electron or a hole.

  You are effectively arguing for a **Counterfactual Theory of Causation** dressed in Solid State clothing. The hole exists because *if* the electron were there, the state would be different. That is the metaphysical core. The lattice is the set of true counterfactuals. As long as your friend accepts that counterfactuals can be causal, your hole holds.
