answer: |-
  This is a sharp reconstruction of a standard objection to James, often called the "success-to-truth" or "self-fulfilling prophecy" objection. Your friend is pressing a line that Richard Rorty and some neo-pragmatists have flirted with, but which most historical scholars of James think misreads the texts.

  Here is the direct answer: **You reject the inference from (5) to (6).** The argument equivocates on the scope of "working" and ignores James's explicit distinction between *malleable social facts* and *stubborn brute facts*.

  Below is the breakdown of where the argument fails, the cost of the fix, the Peirce comparison, and a confidence rating on the scholarship.

  ### 1. The Break Point: Step (6)
  Your friend claims the slide is between (4) and (6). I agree, but specifically at the move from the existence of *some* self-certifying beliefs (Gideon cases) to the claim that *truth as such* is up to us.

  **The Jamesian Reply:**
  James explicitly distinguishes between truths that are **made** by human activity and truths that are **found**.
  *   **Gideon Cases (Social/Moral Facts):** James admits that for certain propositions (e.g., "This marriage will work," "This bank is solvent," "I am capable of this jump"), the belief is a necessary condition for the fact to obtain. In these cases, the truth is *made* by the belief. James calls these "humanistic" truths.
  *   **Rain Dance Cases (Brute Physical Facts):** James does *not* extend this to causal laws of nature independent of human agency. If the village believes the dance causes rain, and they plant harder, the *harvest* might improve (a Gideon case), but the *meteorological claim* ("The dance caused the rain") remains false because it fails the "cash-value" test of empirical verification regarding atmospheric causality.

  **Why (6) fails:**
  (6) states: *"At least sometimes, whether p is true is up to us."*
  James would say: *"Yes, but only when p is about a state of affairs that is partially constituted by our actions."*
  The argument tries to generalize from the *existence* of Gideon cases to the *nature* of truth itself. James holds that truth is *sometimes* up to us, but not *because* we believe it, but because the **reality in question is responsive to belief.**

  If you reject (6) as a universal claim and restrict it to "humanistic truths," you save (1) and (7).
  *   **Cost:** You must accept a dualism of truth-types (or at least a spectrum). You have to concede that "Truth" operates differently for social realities than for physical constants. James is comfortable with this; your friend's deflationary reading is not, because they want a unified deflationary account.

  ### 2. The Equivocation in Step (1) and (2)
  The argument relies on a flattened definition of "working."
  *   **Friend's Reading:** "Working" = satisfying current aims relative to current practices (Immediate expediency).
  *   **James's Reading:** "Working" = leading through experience without contradiction, over the **long run**.

  In *The Meaning of Truth*, James writes: "The truth of an idea is not a stagnant property inherent in it. Truth happens to an idea. It becomes true, is made true by events."
  However, he adds a crucial constraint: The "events" must include **resistance from reality.**
  If the rain dance belief leads to a good harvest (via hard work), it "works" pragmatically for the aim of *survival*. But if the proposition is specifically "The dance causally influences the clouds," it fails to work when tested against meteorological observation.
  The argument conflates *the utility of holding the belief* with *the truth of the specific propositional content.*
  *   **Belief:** "Dancing brings rain." -> **False** (fails empirical check).
  *   **Belief:** "Dancing makes us work harder." -> **True** (verified by harvest).
  James cares about the specific cash-value of the specific claim.

  ### 3. The Peircean Fix and Correspondence
  You asked if Peirce's "final opinion" is just correspondence smuggled in.
  *   **Short Answer:** Yes, functionally.
  *   **Nuance:** Peirce is a **Scholastic Realist**. He believes generals (laws, habits) are real. The "final opinion" is constrained by an "External Permanence" (reality) that kicks back.
  *   **The Difference:**
      *   **Peirce:** Truth is what you *would* believe if inquiry were pushed to the limit. Reality constrains the limit. This saves objectivity but makes truth remote from human life (James's critique: "The truth that is true is the truth that is living now").
      *   **James:** Truth is what *does* work now in the way of belief, provided it doesn't crash later. Reality constrains the process, not just the limit.
  *   **Does Peirce smuggle correspondence?** Critics (like Putnam in his internal realist phase) say Peirce offers a third way. Realists (and your friend) say the "External Permanence" doing the constraining *is* a correspondence relation. If the limit is fixed by reality rather than us, you have admitted a mind-independent constraint that functions exactly like a correspondence truth-maker.
  *   **Cost of Peircean Fix:** If you adopt Peirce to block the "self-certification" slide, you lose James's radical humanism. You save realism, but you lose the "Will to Believe." You can no longer say passional nature decides truth in genuine options; you must say passional nature decides *which hypothesis to test*, but reality decides *truth*.

  ### 4. Confidence Ratings

  **High Confidence (Settled Scholarship):**
  *   **James distinguishes brute facts from social facts.** In *Pragmatism* (Lecture VI) and *The Meaning of Truth*, James explicitly acknowledges "stubborn facts" (e.g., the date of the Battle of Hastings) that we cannot make true by belief. He limits the "Will to Believe" to cases where the option is live, forced, momentous, and *undecidable on intellectual grounds*. He does not apply it to empirical claims that can be settled by observation (like whether it is raining).
  *   **James accepts Gideon cases for moral/social truths.** He explicitly argues that for moral questions (e.g., "Is life worth living?"), the belief helps create the fact.
  *   **Peirce is a realist.** Peirce explicitly critiques James for making truth too subjective. Peirce's "convergence" theory is designed specifically to block the idea that truth is dependent on what you or I believe *now*.

  **Medium Confidence (Live Disagreement):**
  *   **Is James's distinction stable?** This is the heart of the seminar blow-up. Neo-pragmatists (Rorty) argue James's distinction between "social facts" and "brute facts" collapses under pressure (since all access to brute facts is mediated by social practices). Realist pragmatists (Putnam, Haack) argue James can maintain the distinction via his theory of "pure experience." Your friend is arguing from the Rortyan side; you are arguing from the Classical Jamesian side. There is no consensus here, only camps.
  *   **Does Peirce smuggle correspondence?** Among Peirce scholars, there is debate over whether his "External Permanence" is a metaphysical realist commitment or a regulative ideal. However, in the context of *contrasting* him with James, it functions as a realist constraint.

  **Low Confidence (Speculative):**
  *   **Whether James would accept the "Rain Dance" utility as a form of truth.** James might argue that if the belief "The dance brings rain" leads to a thriving community, it is "true enough" for *that* purpose, even if scientifically false. This is where the "two truths" (scientific vs. religious/practical) reading comes in. It's textually supported but philosophically costly.

  ### 5. Strategy for Your Presentation

  Do not drop (3). (3) is the "Will to Believe" doctrine, and dropping it makes you a Peircean, not a Jamesian. Your friend is right that (3) isn't the problem; the problem is the generalization in (6).

  **Proposed Move:**
  1.  **Concede (5):** Admit that for social/moral facts, belief constitutes reality. (James owns this).
  2.  **Reject (6) as Universal:** Argue that James restricts this to **humanistic truths**. For physical truths, "working" requires coherence with the wider web of experience (including meteorological data).
  3.  **Refine (1):** "Working" is not mere satisfaction of current aims (which allows the Rain Dance error); it is **satisfaction of aims *plus* coherence with the rest of experience.** The Rain Dance belief fails the coherence test with our wider understanding of physics, even if it succeeds at the "morale" aim.
  4.  **The Cost:** Acknowledge that this commits James to a form of **pluralistic realism**. There are realities we make (moral/social) and realities we find (physical). Truth is the successful navigation of both. This is not "idealism with extra steps"; it is **Radical Empiricism**.

  **The "Kill Shot" for the Friend:**
  Ask them: *"Does James claim the belief 'The dance causes rain' is true? Or does he claim the belief 'We should dance' is true?"*
  If James says the former, he's an idealist. If he says the latter, he's a pragmatist. The texts support the latter. The "self-certification argument" conflates the truth of the *imperative* (which is made by us) with the truth of the *indicative* (which is constrained by nature).

  ### Summary of Costs
  *   **If you keep James:** You accept a pluralistic ontology (some facts are mind-dependent, some aren't). You risk the charge of inconsistency if you can't draw a sharp line between the two.
  *   **If you take the Peircean Fix:** You save objectivity but lose the existential stakes of the "Will to Believe." You make truth a regulative ideal rather than a lived experience.
  *   **If you accept the Friend's Critique:** You collapse into Rortyan relativism, which James explicitly warned against (he called himself a "radical empiricist," not a coherentist or deflationist).

  **Final Verdict:** The argument fails because it treats all "working" as immediate social validation, ignoring James's requirement for **long-term empirical verification** and **coherence with established truths**. You can keep (1) and (7) by specifying that "working" includes "not getting contradicted by stubborn facts later." That is the Jamesian escape hatch.
