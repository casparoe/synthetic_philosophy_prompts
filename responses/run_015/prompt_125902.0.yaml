answer: |-
  You have independently rediscovered a famous variation known as the **Liar Cycle** (or the Open Pair). You are asking exactly the right questions, and your intuition about circularity is spot on.

  However, there is a tiny logical twist in your specific example that we need to clear up first, because it actually strengthens your point about circularity.

  ### 1. The Logic Check: Is your version a paradox?
  Surprisingly, the specific notes you described are **not** paradoxical in the same way the single Liar sentence is.
  *   **Note A:** "Note B is false"
  *   **Note B:** "Note A is false"

  If you assume **A is True**, then B must be False. If B is False, then its claim ("A is false") is a lie, which means **A is True**. This is consistent.
  If you assume **A is False**, then B must be True. If B is True, then its claim ("A is false") is accurate, which means **A is False**. This is also consistent.

  Your version has **two stable solutions**. It's not a contradiction; it's *under-determined*. Logic allows it to be either (True/False) or (False/True), but it doesn't force a crash.

  **However**, if you tweak it slightly to the **Paradoxical Cycle**, the crash happens:
  *   **Note A:** "Note B is **True**"
  *   **Note B:** "Note A is **False**"

  Now try to solve it:
  *   If A is True → B is True → A is False. (Contradiction)
  *   If A is False → B is False → "A is False" is a lie → A is True. (Contradiction)

  This tweaked version creates the same explosion as the original Liar. I mention this because when philosophers discuss the "Liar Cycle," they usually mean this second, paradoxical version. But your core question remains: **Is the problem self-reference, or is it circularity?**

  ### 2. Self-Reference vs. Circularity
  Your example proves definitively that **self-reference is not the root problem.**

  In the original Liar ("This sentence is false"), the sentence points at itself. In your Cycle, Sentence A points at B, and B points at A. Neither sentence talks about itself. Yet, the paradoxical version of the cycle still breaks logic just as hard as the original.

  This tells us that the "virus" isn't a sentence looking in a mirror; the virus is **circular dependence**.

  The conceptual issue is that truth values are being treated like static properties (like "being red"), but these sentences treat truth like a **calculation**. To know if A is true, you need to know B. To know if B is true, you need to know A. The calculation never finishes. It's not about *who* is referring to *whom*; it's about the fact that the chain of verification loops back on itself without ever touching the ground (reality).

  ### 3. How Theories of Truth Handle the Circle
  Here is how different frameworks deal with this circularity, using your notes as the test case.

  #### A. The Hierarchical View (Tarski)
  **Concept:** Truth is built in levels. A sentence can only talk about the truth of sentences *below* it.
  **The Fix:** This theory simply bans your notes from existing together.
  *   If Note A talks about the truth of Note B, A must be on a higher "level" than B.
  *   But if Note B talks about the truth of Note A, B must be on a higher level than A.
  *   A cannot be higher than B *and* lower than B at the same time.
  **Verdict:** In this system, your notes are **grammatically illegal**. They aren't false; they are meaningless nonsense, like asking "Is the color seven heavy?" This stops the paradox by preventing the circle from forming in the first place.

  #### B. The Groundedness View (Kripke)
  **Concept:** Truth needs a "ground." A sentence is only true or false if its truth value can be traced back to non-truth facts (like "Snow is white"). If a sentence's truth value depends entirely on other truth claims in a loop, it is "ungrounded."
  **The Fix:** This theory allows your notes to exist, but it refuses to give them a truth value.
  *   It looks at Note A. To evaluate it, it looks at Note B.
  *   To evaluate Note B, it looks back at Note A.
  *   The search hits a loop and never finds a fact about the world.
  **Verdict:** Both notes are assigned a **"truth-value gap."** They are neither true nor false. They are simply undefined. This solves the paradox by saying, "You are trying to assign a property to something that doesn't support it."

  #### C. The Classical Property View
  **Concept:** Every meaningful sentence must be either True or False (The Principle of Bivalence). Truth is a standard property.
  **The Fix:** There is no fix.
  **Verdict:** This system crashes. If you insist that every sentence must be T or F, and you allow circular references, your logic system becomes inconsistent (you can prove anything, even contradictions). This is why logicians had to move to theories like Tarski's or Kripke's—because the classical view cannot survive the Liar Cycle.

  ### 4. The Conceptual Core
  So, what is the actual issue you've stumbled upon?

  The problem is that we intuitively treat truth as a **property** (like weight or color) that a sentence *has*. But the Liar and your Cycle show that truth behaves more like a **status** that is *assigned* based on conditions.

  When you create a circle (whether it's one sentence pointing to itself or two pointing at each other), you are creating a condition where the status assignment never resolves.
  *   **Self-reference** is just the simplest way to make a circle (a loop of length 1).
  *   **Circular reference** is the general category (a loop of length 2, 3, or 100).

  Your intuition was correct: the real problem is the **loop**, not the mirror. Any theory of truth that wants to survive the Liar Paradox has to explain how to handle loops—either by banning them (Tarski), ignoring them (Kripke), or accepting that logic is broken (Dialetheism). Your two-note example is the clearest proof that you don't need self-reference to break the machine; you just need a closed circuit.
