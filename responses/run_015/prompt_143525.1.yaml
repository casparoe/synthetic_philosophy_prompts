  ### 1. Purpose and Angle

  This taxonomy is designed for a graduate metaphysics seminar to sort participants by their actual ontological commitments regarding dispositions, rather than the historical labels they might adopt. By integrating composite and artificial cases, such as robotic systems and institutional bodies, the exercise moves beyond standard physical examples where finking and masking are often treated as marginal anomalies. The aim is to reveal the logical space of dispositional realism, exposing where positions converge on ordinary cases but diverge on structurally complex ones. This approach forces students to confront whether their realism survives systematic interference, thereby clarifying the stability of their metaphysical framework against engineering and sociological counter-examples.

  ### 2. The Decision Tree

  **Root Commitment:** There are genuine dispositions that can exist unmanifested.
  *   **No:** Proceed to Leaf 1.
  *   **Yes:** Proceed to Node 1.

  **Node 1 (Finking):** Consider a robotic arm with a safety override that instantly retracts the gripper upon contact. Does the standard conditional analysis ('if stimulated, it would manifest') remain true despite this internal interrupter?
  *   **Yes:** Proceed to Leaf 2.
  *   **No:** Proceed to Node 2.

  **Node 2 (Masking):** Consider a fragile vase wrapped in perfect padding. Does the mask remove the disposition of fragility, or merely suppress its display?
  *   **Removes (Yes):** Proceed to Leaf 3.
  *   **Suppresses (No):** Proceed to Node 3.

  **Node 3 (Composites):** Consider a committee with a formal disposition to approve funding, systematically masked by a mandatory quorum rule. Does the collective entity possess this disposition despite the internal veto?
  *   **Yes:** Proceed to Node 4.
  *   **No:** Proceed to Node 4.

  **Node 4 (Essentialism):** If masking is widespread across natural and artificial domains, is dispositional essentialism about properties still tenable?
  *   **Yes:** Proceed to Leaf 4.
  *   **No:** Proceed to Leaf 5.
  *   *(Note: If Node 3 was Yes, this node distinguishes Collective sub-types; if No, it distinguishes individual realisms.)*

  **Leaves:**
  1.  **Anti-realist Eliminativism:** Denies unmanifested dispositions exist, reducing all talk to categorical bases alone.
  2.  **Naive Conditional Analysis:** Maintains standard conditionals hold even against internal finks like safety overrides.
  3.  **Hybrid View:** Holds dispositions exist only where neither finking nor masking is structurally guaranteed.
  4.  **Bare Dispositional Realism:** Treats dispositions as irreducible properties surviving masking, maintaining essentialism despite widespread interference.
  5.  **Mask-tolerant Realism:** Holds dispositions survive masking but are defeated by finking, rejecting essentialism if masking is widespread.
  6.  **Collective Dispositionalism:** (Reached via Node 3=Yes, Node 4=Yes) Asserts dispositions genuinely belong to composites and are not reducible to parts.

  *(Note: To ensure logical space mapping, Node 3=Yes combined with Node 4=No is left unoccupied in this specific seminar configuration.)*

  ### 3. Logical Space Mapping

  The following table maps the 16 logical combinations for participants accepting the Root Commitment (Yes). Occupied paths lead to named leaves; unoccupied combinations are diagnosed below.

  | N1 (Fink) | N2 (Mask) | N3 (Comp) | N4 (Ess) | Status | Diagnosis |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Yes | * | * | * | **Occupied** | Naive Conditional Analysis. |
  | No | Yes | * | * | **Occupied** | Hybrid View. |
  | No | No | No | Yes | **Occupied** | Bare Dispositional Realism. |
  | No | No | No | No | **Occupied** | Mask-tolerant Realism. |
  | No | No | Yes | Yes | **Occupied** | Collective Dispositionalism. |
  | No | No | Yes | No | **Unoccupied** | **Unexplored:** Collective anti-essentialism is theoretically possible but rarely defended. |
  | Yes | * | * | * | **Subsumed** | Variations masked by Naive view; irrelevant to conditional truth. |
  | No | Yes | * | * | **Subsumed** | Variations masked by Hybrid view; disposition absent regardless. |

  *Diagnosis of Empty Cells:* The combination accepting Composite dispositions (N3=Yes) while rejecting Essentialism (N4=No) is unoccupied. This position is **unexplored**, as collective realists typically rely on robust property attribution. Combinations where N1=Yes are **subsumed** under Naive Analysis, as the conditional truth renders masking questions secondary. Combinations where N2=Yes are **subsumed** under the Hybrid view, as the disposition is already deemed absent. No combinations are strictly incoherent, though some are theoretically unstable.

  ### 4. Unresolvable Pairs and Limits

  This tree cannot genuinely separate **Bare Dispositional Realism** and **Mask-tolerant Realism** using standard physical examples alone. In ordinary cases (e.g., a simple glass vase), masking is accidental and rare; thus, both positions agree the disposition survives. They only diverge when masking is widespread or structurally guaranteed, a scenario absent from intuitive physics. Consequently, a student might answer identically to both positions until Node 4. Similarly, **Collective Dispositionalism** and **Bare Realism** converge on simple objects, diverging only on institutional cases like the committee. Without the specific artificial and institutional scenarios provided in Nodes 1 and 3, these positions would collapse into a single 'Realist' branch, obscuring the nuanced commitments regarding reducibility and essentialism.

  ### 5. Seminar Use Notes

  Administer this taxonomy anonymously. Present the robotic arm and committee cases as neutral thought experiments without mentioning 'fink' or 'mask' terminology initially. Ask students to record Yes/No answers privately before revealing the leaf labels. This prevents label-driven bias. Ensure the 'widespread masking' scenario in Node 4 is described concretely (e.g., 'a universe where 90% of stimuli are blocked') to avoid ambiguity. Collect responses to map the seminar's logical distribution before discussing the philosophical merits of each leaf.
