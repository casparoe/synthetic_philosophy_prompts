  During the budget meeting, Elena interrupts Mark's proposal. She knows her critique is exaggerated, driven by a spike of competitive envy she despises. Her commitment to teamwork is sincere; she wishes she weren't this kind of person. Yet, in that moment, the urge to diminish him overwhelms her reflective judgment; no competing motive gains traction. She isn't coerced or insane; she tracks reasons normally—had the CEO been present, she would have stayed silent. She acknowledges the jealousy later as hers, though she regrets it. Mark resents the slight.

  ***

  **(a) Conditions, Verdicts, and Reasoning**

  1.  **Leeway:** **Fails.** The scenario specifies that no competing motive gains traction given her actual desires and perceived stakes; internally, she lacks the power to translate a wish to stop into action.
  2.  **Guidance Control:** **Satisfied.** Her mechanism is moderately reasons-responsive: she recognizes the CEO's presence as a sufficient reason to inhibit the urge, demonstrating receptivity and reactivity within a suitable range.
  3.  **Answerability:** **Satisfied.** The action expresses contempt and unfairness toward Mark; withholding resentment would treat her as a child or patient rather than a moral agent capable of recognizing the harm.
  4.  **Hierarchical Identification:** **Fails.** She acts on envy she "despises" and wishes she didn't have; there is no mesh between her effective first-order motive and her higher-order volitions.
  5.  **Diachronic Addressability:** **Satisfied.** She later acknowledges the jealousy as hers, making her intelligibly subject to demands for explanation or apology. If she were not such a person, she would claim dissociation or amnesia, treating the act as a foreign intrusion rather than a past failure.

  **(b) The Splitting Feature**
  The single feature producing the divergence is **the action issuing from a reasons-responsive mechanism that is locally irresistible but reflectively alien.** If the motive were not alien (she endorsed the envy), verdicts 2 and 4 would collapse (both satisfied). If the motive were not locally irresistible (she could have stopped), verdicts 1 and 2 would collapse (both satisfied). The case isolates Guidance Control by stripping away both Alternatives and Identification.

  **(c) Minimal Perturbation**
  Change one feature: **She endorses the competitive impulse as a valid strategy.**
  *Verdicts:* Hierarchical Identification flips to Satisfied; 1, 2, 3, and 5 remain unchanged.
  *Judgment:* The fittingness of blame remains, but its character shifts from blaming a weakness of will to blaming a policy of malice; responsibility is arguably strengthened because the action now expresses her settled values.

  **(d) Objection and Reply**
  *Objection:* The Identification theorist argues that because she repudiates the motive, the action is not truly hers; blaming her is like blaming a victim of a seizure, as she lacks autonomy.
  *Reply:* Autonomy requires reasons-responsiveness, not self-endorsement; we blame weaknesses of will precisely because they reveal a culpable lack of self-control, not because they express our true selves.

  **(e) Conclusion**
  " Worth wanting" is interest-relative, specifically relative to the practices of holding accountable rather than the metaphysics of alternative possibilities.
