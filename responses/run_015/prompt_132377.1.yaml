      3.  **The Degradable Resource View:** Surprise is a quantity that runs out; the 2-week cut is a reserve margin.

      *Winner:* A blend of 2 and 3. The Performative mechanism protects the policy, but the 2-week cut acknowledges the Degradable nature of uncertainty over time.

