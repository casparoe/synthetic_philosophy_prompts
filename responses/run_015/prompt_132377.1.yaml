      *Key Insight to highlight:* The policy treats the announcement not as a prediction (which can be true/false) but as a *commitment to a procedure* (which can be followed/violated). The paradox arises when we treat the announcement as a proposition to be evaluated for truth. The practice treats it as a rule to be executed.

