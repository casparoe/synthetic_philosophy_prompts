  2.  **Deconstruct the Policy & The Paradox:**
      *   *The Paradox:* The standard Unexpected Hanging/Surprise Exam paradox relies on backward induction. If the exam must be a surprise, it can't be on the last day (because if it hasn't happened yet, you know it must be then). If not the last, then not the second to last, etc. Conclusion: No surprise exam is possible.
      *   *The Practice:* They do it 300 times a year. It works. They exclude the last 2 weeks (acknowledging the "last day" problem?). They reschedule if knowledge leaks (acknowledging the "knowledge kills surprise" condition). They use deterministic scheduling (no randomness).
      *   *The Tension:* Philosophy says "This announcement is self-defeating." Practice says "We do this constantly and it deters non-compliance."

  3.  **Brainstorming Candidate Reconstructions:**

      *   *Candidate 1: The Pragmatic/Behaviorist Reconstruction.*
          *   Focus: "Surprise" isn't an epistemic state of *knowledge*; it's a behavioral state of *preparedness*.
          *   Logic: The policy doesn't require the site to be logically incapable of deducing the day. It requires them to be *practically* unable to prepare. The "paradox" assumes ideal rational agents with common knowledge of rationality. Real managers are busy, risk-averse, and can't sustain peak compliance for 250 working days.
