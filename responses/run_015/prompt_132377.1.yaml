      *   **Task:** Diagnose the epistemic presuppositions of a specific workplace safety inspection policy.
      *   **Input:** A description of the inspection policy (1 visit/year, unannounced, calendar year minus last 2 weeks, non-random scheduling, reschedule if tipped off, grade based on immediate response, goal is deterrence).
      *   **Specific Questions to Address:**
          *   View of surprise/knowledge/certainty required?
          *   Does it need objective chance?
          *   Is the practice internally consistent (excluding end of window, "will" vs. "may", aborting if tipped off)?
