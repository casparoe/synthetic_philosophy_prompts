      *   *Candidate 2: The Contextualist/Epistemic Standards Reconstruction.*
          *   Focus: "Knowledge" is context-sensitive.
          *   Logic: In the philosophical paradox, "know" means "deductively certain." In the policy context, "know" means "have enough specific information to act on." A site manager might suspect "It's probably this week," but that doesn't count as "knowing" in the policy sense unless they have a specific tip-off.
          *   Implication: The policy operates on a lower threshold of evidence for "knowledge" than the paradox assumes. The backward induction fails because the sites never reach *certainty* until the inspector walks in, even on the last day, because the scheduler is non-random (human whim).

      *   *Candidate 3: The Institutional/Self-Fulfilling Reconstruction.*
          *   Focus: The announcement creates the conditions for its own truth.
          *   Logic: The policy is a speech act that changes the normative landscape. By stating "We will reschedule if you know," the agency makes it the case that if you *do* deduce it, the event changes (rescheduling). Thus, the inspection *that actually happens* is always surprising by definition, because any non-surprising inspection is cancelled.
          *   Implication: The "will" is conditional on "you don't know." The exclusion of the last two weeks is a bureaucratic hedge to ensure the condition can be met.

      *   *Candidate 4: The Probabilistic/Decision-Theoretic Reconstruction.*
          *   Focus: Uncertainty is about probability distributions, not binary knowledge.
          *   Logic: Even if deterministic, the site faces a subjective probability distribution. As long as the probability doesn't hit 1.0 until the moment of arrival, the "surprise" condition (defined as $P < 1$) holds. The backward induction fails because the site cannot assign $P=1$ to the last day due to the possibility of cancellation/error/non-arrival.
