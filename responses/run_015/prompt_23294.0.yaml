          4.  *Biologization:* Trying to make human kinds into natural kinds (brain disease) to stop the loop.
      *   *Threat to Theory?* Explain that Hacking sees it as a structural feature, not a rate-of-change meter. Stability is often an achievement of power/institutions, not proof the loop doesn't exist.
