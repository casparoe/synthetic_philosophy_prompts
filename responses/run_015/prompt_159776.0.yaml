answer: |-
  Here is a complete, run-of-show plan for your 90-minute session. It is designed to be low-tech, high-tension, and mathematically sound without requiring your participants to do math.

  ### Session Title: The Agreement Trap
  **Time:** 90 Minutes
  **Materials:**
  *   Index cards (3 per person).
  *   Poker chips (20 per person, two colors).
  *   Whiteboard & markers.
  *   Two opaque bags/jars (labeled "Signal Bag A" and "Signal Bag B").
  *   **Printed "Scoring Cards"** (one per person, see below).
  *   **Printed "Briefing Cards"** (two types, see Sabotage section).

  ---

  ### Part 1: The Setup (0:00 – 0:10)
  **Goal:** Get them playing immediately. No theory.

  1.  **The World:** Tell them there is a hidden "Truth State" for this room: either **RED** or **BLUE**. (You, the facilitator, determine this secretly at the start by flipping a coin. Let's say you flip **RED**).
  2.  **The Signal:** Hand everyone one index card face down. Tell them: "This card contains a private signal about the Truth. It is not perfect. It is correct 75% of the time. Do not show it to anyone."
      *   *Prep:* Have a bag with 75% Red chips and 25% Blue chips. If Truth is Red, everyone draws from this bag. (If Truth is Blue, reverse the ratios). *Correction:* To save time, pre-print the cards. 75% say "Signal: RED", 25% say "Signal: BLUE". Distribute randomly.
  3.  **The Currency:** Give everyone 10 chips. Explain the **Scoring Card**.
      *   **The Rule:** At the end of each round, you must write a probability (0%, 10%, ... 100%) on your card.
      *   **The Payoff:** You do not calculate this. I (the facilitator) will collect your cards. If the Truth is RED, you get chips based on the "If RED" column. If Truth is BLUE, you pay chips based on the "If BLUE" column.
      *   **The Incentive:** "The only way to maximize your chip count over time is to write the number you *actually* believe. Lying loses chips."

  **The Scoring Card (Print this on small slips):**
  *This is a simplified Quadratic Scoring Rule scaled to chips.*
  | Your Stated Confidence | If You Are RIGHT (Gain) | If You Are WRONG (Lose) |
  | :--- | :--- | :--- |
  | 50% | 5 chips | 5 chips |
  | 60% | 6 chips | 4 chips |
  | 70% | 8 chips | 8 chips |
  | 80% | 9 chips | 11 chips |
  | 90% | 10 chips | 15 chips |
  | 100% | 10 chips | 20 chips |
  *(Note: This table incentivizes honesty. If you truly believe 70%, your expected value is maximized by stating 70%.)*

  ---

  ### Part 2: Round 1 — The Number Game (0:10 – 0:35)
  **Goal:** Experience "Aumann Convergence" (or the attempt at it).

  1.  **Briefing:** Hand out **Briefing Type A** to everyone.
      *   *Text:* "Background Info: The Truth State (Red/Blue) was determined by a fair coin flip. Prior Probability = 50/50."
      *   *Instruction:* "Find a partner. You may **only** exchange your current probability number. You may not show your signal card. You may not discuss *why*. Update your number after hearing theirs. You have 3 rounds of 5 minutes each."
  2.  **The Process:**
      *   **Round 1:** Write private probability. Swap numbers with partner. Update.
      *   **Round 2:** Swap new numbers. Update.
      *   **Round 3:** Swap new numbers. Finalize.
  3.  **The Collect:** Collect the final cards. Do not reveal the Truth yet. Put them in a pile.
  4.  **Observation:** Walk around. You will likely see pairs converging toward the middle (e.g., one had 80%, one had 60%, they meet at 70%).
      *   *Troubleshooting:* If someone refuses to move ("I'm sticking at 90%"), remind them: "The scoring rule punishes overconfidence if you're wrong. Are you sure?"

  ---

  ### Part 3: Round 2 — The Evidence Game (Sabotaged) (0:35 – 1:00)
  **Goal:** Break the Common Prior and feel the friction.

  1.  **The Sabotage:** Tell them to find a *new* partner.
      *   Secretly hand out **Briefing Type B** to half the room (7 people). Keep Type A for the other half.
      *   **Briefing Type A:** "Background Info: The Truth State was determined by a fair coin flip. Prior = 50/50."
      *   **Briefing Type B:** "Background Info: The Truth State was determined by a **biased** machine. It produces RED 80% of the time. Prior = 80/20."
      *   *Crucial Instruction:* "Do not show your Briefing Card to your partner. Assume your partner has the same background info as you."
  2.  **The Protocol:** "This time, you may **only** describe the **Signal** on your index card (e.g., 'I saw Red'). You may not state your probability number until the very end."
  3.  **The Process:** 3 Rounds of 5 minutes.
      *   They share signals ("I got Red." "I got Red.").
      *   They calculate/update internally.
      *   *The Conflict:* A Type A person with a Red signal should be ~85% confident. A Type B person with a Red signal should be ~95% confident. If they pair up, they will realize their *math* doesn't match their partner's *conclusion*, even if they saw the same signal.
  4.  **The Collect:** Collect final cards.

  ---

  ### Part 4: The Reveal & Debrief (1:00 – 1:30)
  **Goal:** Map the experience to the theorem.

  1.  **The Truth:** Reveal the Truth State (e.g., RED).
  2.  **The Score:** Quickly tally chips (or just ask for a show of hands: "Who ended with more chips than they started?").
  3.  **The Whiteboard Map:** Draw two columns: **Round 1** and **Round 2**.
      *   **Ask Round 1:** "Did you converge?" (Likely yes). "Why?" (You assumed you started from the same place).
      *   **Ask Round 2:** "Did you feel friction?" (Likely yes). "Why?"
  4.  **The Sabotage Reveal:** Ask the Type B holders to raise their hands.
      *   Explain: "In Round 2, half of you started with a 50% prior, half with an 80% prior. You broke the **Common Prior Assumption**."
      *   **The Lesson:** "Aumann's Agreement Theorem says: If you have Common Priors, and you know each other's Posteriors (Numbers), you *cannot* agree to disagree. You *must* converge."
      *   "In Round 1, you felt that pull. In Round 2, the ground vanished. You couldn't converge because your foundations were different, but you didn't know it."
  5.  **Numbers vs. Evidence:**
      *   "In Round 1 (Numbers), you traded conclusions. This is how we argue on Twitter."
      *   "In Round 2 (Evidence), you traded data. This is how science *should* work."
      *   "But even with Evidence, if the Priors differ (politics, worldview, ideology), you still won't agree."
  6.  **The Name Drop:** Write **AUMANN'S AGREEMENT THEOREM** on the board.
      *   "Robert Aumann, Nobel Prize winner. He proved that honest rationality leads to consensus. The catch? We aren't honest, we aren't fully rational, and we almost never share common priors."

