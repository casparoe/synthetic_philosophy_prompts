  ### Troubleshooting: What Will Go Wrong
  You asked for straight talk on the failure modes. Here is how to handle them without killing the vibe.

  **1. The Anchor ("I'm not moving from 90%").**
  *   *Why:* Ego or distrust of the game.
  *   *Fix:* Walk over and whisper: "The scoring rule penalizes 90% heavily if you're wrong. If you're unsure, 60% pays safer dividends. Protect your chips." Frame it as risk management, not submission.

  **2. The Politicizer ("This is like the vaccine debate...").**
  *   *Why:* They can't help themselves.
  *   *Fix:* Validate and Pivot. "Exactly. That's why we're using Red and Blue beads. If we can't agree on beads with perfect math, what hope do we have with politics? Let's see if the beads break first."

  **3. The Probability Skeptic ("Probabilities are fake").**
  *   *Why:* Epistemological objection.
  *   *Fix:* Give them a job. "I need you to be the Auditor. Watch this pair. Tell me if their chip math adds up. You don't have to believe in probability, just believe in arithmetic."

  **4. The Sabotage Discovery.**
  *   *Risk:* A Type A and Type B pair realize their priors differ in Round 2 and shout it out.
  *   *Fix:* If they catch it early, stop the room. "Someone found a crack in the floor. Freeze. Write down *why* you think you disagree. We will use this in the debrief." (This actually makes the debrief stronger).

  **5. Arithmetic Paralysis.**
  *   *Risk:* Innumerate writers freeze trying to update Bayes' Rule.
  *   *Fix:* Tell them: "You don't need the exact math. Just move your number in the direction of the evidence. If you saw Red, go up. If your partner saw Red, go up more. Intuition is enough for this demo."

  ---

  ### Limitations: What the Game Cannot Stage
  Be honest about this in the last 10 minutes. A card game cannot simulate:

  1.  **Common Knowledge of Rationality:** In the game, they know *you* are rational. In real life, I don't know if *you* are processing my argument honestly or trolling. The theorem assumes we both know we are both honest Bayesians.
  2.  **Infinite Recursion:** Aumann requires "I know that you know that I know..." ad infinitum. You capped it at 3 rounds. Real convergence might take 30 rounds.
  3.  **Costless Communication:** In the game, talking is free. In reality, explaining your priors is exhausting and socially costly.

  **Script for the End:**
  "This game made the math clean. Real life is dirty. Aumann proves that disagreement is a logical error *if* we are identical rational machines. But we aren't machines. We have different priors (upbringing, trauma, data access). So when you leave here and see disagreement, don't ask 'Who is lying?' Ask 'What prior are they standing on that I can't see?'"

