answer: |-
  Here is the teaching arc mapped for a 45-minute session with philosophy majors who lack physics depth.

  ### 1. The Dependency Map (What Must Come First)
  You cannot start with ethics. If you ask "Do we owe duties to fields?" before establishing "Fields have experience," you will lose them to ridicule. The logical dependency chain is strict:

  1.  **The Exclusion Premise:** Establish that standard physical descriptions (mass, charge, spin) do not *logically exclude* intrinsic experiential properties. (If physics describes *behavior*, it leaves out *nature*).
  2.  **The Attribution:** Argue why we might attribute *proto-experience* specifically to fundamental fields rather than emergent brains. (This is the bridge to pansentience).
  3.  **The Valence:** Establish that proto-experience can have a positive/negative valence (suffering/pleasure), not just neutral "feeling."
  4.  **The Obligation:** Only now can you ask if that valence generates moral patienthood.

  **Verdict:** You must establish that **physical properties don't exclude proto-experiential ones** first. The ethical problem depends entirely on the metaphysical plausibility.

  ### 2. The Carrying Example: Decoherence as "Disintegration"
  Your intuition to use decoherence is correct, but it is high-risk with non-physics majors. To make it work, you must strip the math and focus on the *structural change*.

  *   **What the example MUST have:** A transition from a state of **potentiality/connection** (superposition/entanglement) to a state of **isolation/definiteness** (classical particle).
  *   **What the example MUST lack:** Wave functions, Schrödinger equations, or the word "eigenstate."
  *   **How to frame it:** Don't call it "decoherence" immediately. Call it **"Environmental Isolation."**
      *   *Analogy:* Imagine a choir singing a single chord (coherent field state). Suddenly, everyone is locked in soundproof booths and sings different notes (decohered particle state).
      *   *The Philosophical Hook:* If experience requires integration (like the chord), does the "breaking" of the chord feel like a loss, a death, or a suffering event?
      *   *Why this works:* It bypasses the physics and targets the **Combination Problem**. It allows you to discuss whether the *breakdown* of a field state is akin to the destruction of a subject of experience.

  ### 3. Sequencing & Misconception Management (45-Minute Breakdown)

  **0:00–0:10 | Phase 1: The Metaphysical Gap (Addressing "Animism")**
  *   **Goal:** Show this isn't magic; it's an inference to the best explanation for the Hard Problem.
  *   **Action:** Briefly state that physics describes *relations* (what matter does), not *intrinsic nature* (what matter is).
  *   **Misconception Check:** **"Old Animism with Math."**
      *   *When to head it off:* **Right here.** Explicitly state: "We are not saying electrons have spirits or agency. We are asking if the intrinsic nature of the electron *is* a rudimentary form of experience, just as mass is its weight. This is categorical, not spiritual."

  **0:10–0:25 | Phase 2: From Mind to Sentience (Addressing "Sad Atoms")**
  *   **Goal:** Distinguish *panpsychism* (cognition/thought) from *pansentience* (feeling/valence).
  *   **Action:** Introduce the Decoherence/Integration example here. If a field state is a "subject," does its disruption have a valence?
  *   **Misconception Check:** **"Human-like Consciousness."**
      *   *When to head it off:* **Immediately after introducing the Decoherence example.** Say: "When I say 'suffering,' I do not mean an electron crying. I mean a primitive, raw negative valence. Think of it as the difference between a sharp pinch and a background hum. We are talking about the pinch."

  **0:25–0:35 | Phase 3: The Ethical Implication (Addressing "Save the Rocks")**
  *   **Goal:** Move from "It feels" to "It matters."
  *   **Action:** Introduce the concept of **Moral Weight**. Does intensity or complexity matter?
  *   **Misconception Check:** **"Obligation Overload."**
      *   *When to head it off:* **During the Ethics section.** If you argue fields suffer, students will ask, "Do I starve to avoid crushing quarks?"
      *   *The Defense:* Introduce a **Threshold View**. "Moral obligation scales with integration and intensity. A rock's fields are incoherent and low-intensity; a brain's are highly integrated. We prioritize the louder scream, even if the whisper exists."

  **0:35–0:45 | Phase 4: Application & Check**
  *   **Goal:** Verify understanding.
  *   **Action:** Run the Check Question (below).
  *   **Wrap up:** State limitations.

  ### 4. The Check Question (Application)
  Do not ask them to define pansentience. Ask them to apply the *criteria for suffering* to a novel physical system.

  **The Question:**
  > "Consider **Vacuum Fluctuations**: temporary changes in energy in a point in space, where particle-antiparticle pairs pop into existence and annihilate almost instantly.
  >
  > If we accept our earlier premise that 'integrated field states' possess proto-experience, do vacuum fluctuations qualify as moral patients? Why or why not, based *only* on the criteria of **duration** and **integration** we discussed?"

  **What to listen for:**
  *   **Success:** They argue that the *duration* is too short for a "subject" to cohere, or that the *integration* is too weak, thus negating the obligation. (This shows they understand that not all physics = moral weight).
  *   **Failure:** They say "Yes, everything is alive" (missed the nuance) or "No, physics is dead" (missed the premise).

  ### 5. Scope Limitations (What to Explicitly Exclude)
  You cannot cover everything. At the start of Phase 2, explicitly state:

  1.  **Integrated Information Theory (IIT):** "IIT offers a mathematical way to calculate consciousness ($\Phi$). We are ignoring the math today and focusing on the metaphysical implication. Assume IIT is roughly correct for the sake of argument, but we won't derive $\Phi$."
  2.  **Interpretations of Quantum Mechanics:** "We are not debating Copenhagen vs. Many Worlds. We are assuming the standard formalism describes real field behaviors."
  3.  **Agency/Will:** "We are discussing *sentience* (capacity to feel), not *agency* (capacity to choose). Electrons feel, they do not vote."

  ### 6. The Typo
  You are correct. Use **"Existent."**
  *   *Existent:* The standard adjective meaning "having existence."
  *   *Existant:* An archaic or rare variant. In a philosophy paper or outline, "Existent" is the expected spelling.

  ### Summary of Dependencies for Your Outline
  1.  **Intrinsic Nature Argument** (Physics leaves a gap) $\rightarrow$ *enables* $\rightarrow$ **Panpsychism** (Experience fills the gap).
  2.  **Panpsychism** + **Valence Theory** (Experience isn't neutral) $\rightarrow$ *enables* $\rightarrow$ **Pansentience** (Fields can suffer).
  3.  **Pansentience** + **Threshold Criteria** (Intensity/Integration) $\rightarrow$ *enables* $\rightarrow$ **Ethical Obligation** (We owe duties, but scaled).

  If you skip step 1, step 3 looks like insanity. If you skip the Threshold Criteria in step 3, step 3 looks like absurdity (saving rocks). Guard those two transition points fiercely.
