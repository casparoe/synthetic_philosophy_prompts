      *   *Refining the Selection Argument:* It's not just a "quibble." If the pool of women in Algeria is the top 1%, and in Norway it's the top 50%, comparing their STEM rates is comparing elites to masses. The "Paradox" might just be "Elite women choose STEM; Mass women choose Humanities." This attacks the Pattern's validity as a comparison of *nations* rather than *classes*.
