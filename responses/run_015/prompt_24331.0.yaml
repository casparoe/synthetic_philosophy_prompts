  2. Daniel Wegner's "Illusion of Conscious Will" argues that normal brains similarly infer voluntary control only after an action has already been unconsciously initiated.
  3. Confabulation refers to the production of fabricated, distorted, or misinterpreted memories about oneself or the world without the conscious intention to deceive.
  4. Post-hoc rationalization is the common psychological tendency to construct logical reasons for decisions that were actually driven by unconscious emotional processes.
  5. I propose "Narrative Usurpation" to define the configuration where the reporting subsystem lacks access to the acting subsystem's data yet claims authoritative ownership. This stops being plain rationalization at the boundary where the subject loses the ability to recognize the explanation as a guess rather than a memory.
