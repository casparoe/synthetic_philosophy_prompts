answer: |-
  "Thirty red," Kael said, spinning his ale mug on the wet wood. "Sixty black or yellow. You took red first. Said black was too thin."

  "Red is fixed," Elara said, watching the harbour fog roll in. "Thirty shells. No more, no less. Black is a guess."

  "Then today. Red-or-yellow versus black-or-yellow. You took black-or-yellow. That's sixty shells. You just called yellow thick."

  "I called the Harbourmaster sharp." Elara tapped her ticket against the table. "He fills the jar. If I bet on black, he sets it to zero. If I bet on yellow, he buries it. I only bet on what he can't move."

  Kael leaned in, his voice dropping. "You can't have it both ways, El. If black is scarce, yellow is fat. If yellow is fat, red-plus-yellow is the bigger haul. You're trading against yourself."

  "I'm trading against the office. They know the split. I don't. I'm guarding the worst case."

  "Worst case costs coin," Kael said. "Suppose a runner comes in. Says yellow is heavy. You'll want to swap your red ticket for black. You'll pay a fee for the swap. Then news comes black is light. You swap back. Pay another fee. You end up holding the same ticket, lighter purse, because you refuse to pick a number."

  "I pick safety."

  "You pick poverty. A rule like that isn't a belief. It's a leak."

  A runner slid a slip across the table, ink still wet. "Ledger update. Swap your black-or-yellow claim for red. Fee is one crown."

  Elara didn't hesitate. She pushed the crown forward. She held the red ticket again. Same odds as an hour ago. Lighter by a crown.
