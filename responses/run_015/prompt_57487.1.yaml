      *   *Context:* Post-Soviet collapse created an epistemic vacuum. Trust in institutions fell. Fomenko offered a narrative of order (Russia as the true empire) amidst chaos.
      *   *Limitation of Popper:* Falsifiability doesn't explain *why* it spread or *why* a mathematician thought he could do history. It treats the claim in isolation.

  5.  **Compare with Lakatos (Research Programmes):**
      *   *Concept:* Progressive vs. Degenerating programmes.
      *   *Hard Core:* The chronology is wrong.
      *   *Protective Belt:* Conspiracies about historians, attacks on dating methods.
      *   *Progressive?* No. It doesn't predict new discoveries. It only reinterprets old ones to fit the core. It generates no novel facts.
      *   *Degenerating?* Yes. It constantly adds ad-hoc hypotheses (e.g., "this carbon date is wrong because...") to survive anomalies.
      *   *Advantage over Popper:* Lakatos handles the *process* better. It explains why the theory persisted despite failures (shifting the protective belt) and why it eventually stalled (no novel predictions).

  6.  **Compare with "Demarcation is a Pseudo-Problem" (e.g., Wittgensteinian/Family Resemblance or Sociological approaches):**
      *   *Argument:* There is no single logical rule. Science is what scientists *do*.
