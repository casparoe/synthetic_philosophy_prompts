answer: |-
  This is a perfect stress test for the demarcation problem because Fomenko breaks the usual stereotypes. He isn't a mystic in a basement; he is a credentialed insider using mathematical language to make historical claims. If we run this strictly through Karl Popper's falsifiability criterion, we have to separate the logical structure of the claims from the sociological reality of who is making them.

  ### The Popperian Mapping

  First, we have to map the "theory." Fomenko's New Chronology isn't a single hypothesis; it is a bundle.
  1.  **The Core:** The accepted timeline is inflated by roughly 1,000 years; antiquity is a reflection of the Middle Ages.
  2.  **The Mechanism:** A conspiracy or error by Scaliger and others to fabricate documents.
  3.  **The Defense:** All independent dating methods (radiocarbon, dendrochronology, astronomy) are circular because they are calibrated against the very history being disputed.

  **What counts as a falsifier?**
  For Popper, a theory is scientific if there exists a logical possibility of an observation that would refute it.
  *   *Against the Core:* Finding a continuous, verifiable record (like ice core layers or varves) that links 500 BC to 500 AD without gaps, independent of written texts.
  *   *Against the Mechanism:* Finding a document in a sealed archaeological context that references a "future" event Fomenko claims hadn't happened yet, verified by a method Fomenko accepts.
  *   *Against the Defense:* Producing a dating method that relies on physical constants unrelated to historical calibration (e.g., radioactive decay rates that don't require tree-ring calibration).

  **The Verdict on Falsifiability**
  Here is where your intuition hits the wall. You noted that his claims *were* checked and came out against him. Astronomers recalculated eclipses; physicists ran carbon dating on samples Fomenko provided. They failed. So, by Popper's lights, was this just "science that lost"?

  Popper would say **no**. The distinction isn't whether the theory turned out to be false; it's about how the theorist responds to the falsification.

  Popper identified what he called **"conventionalist stratagems"** or immunizing moves. This is when a theorist alters the definition of terms or adds ad-hoc assumptions to save the theory from refutation. Fomenko's claim that "dating methods are circular" is a classic immunizing stratagem. It renders the theory unfalsifiable in practice. If you show him a carbon date, he says the method is rigged. If you show him an astronomical alignment, he says the records of the alignment were forged.

  By closing off every exit route, Fomenko moves the New Chronology from the realm of *risky science* (which could be proven wrong) to *pseudoscience* (which is structured so it cannot be proven wrong). Popper gives the right verdict here: it is pseudoscience, not because it is false, but because it is insulated against being proven false.

  **Where Popper Breaks**
  However, Popper's criterion struggles with the *credentials* and the *context*.
  1.  **The Insider Problem:** Popper assumes pseudoscience looks like astrology—outside the academy. Fomenko was a Department Head at Moscow State. He spoke the language of rigor. Popper's logical criterion doesn't account for the fact that a man can do rigorous math in the morning and unfalsifiable history in the afternoon. The criterion treats the *claim* in isolation, not the *competence* of the claimant.
  2.  **The Sociological Vacuum:** Popper's logic doesn't explain why this took off in 1990s Russia. The demarcation criterion is ahistorical. It doesn't see that the collapse of the Soviet Union created an epistemic crisis where official narratives were discredited. Fomenko offered a new order (Russia as the true empire) when the old order vanished. Popper can tell you the logic is flawed, but he can't explain why the flaw was attractive.

  ### The Lakatosian Upgrade

  Imre Lakatos offers a sharper tool for this specific case. He moved away from single theories to **"Research Programmes."** A programme has a "hard core" (the untouchable beliefs) and a "protective belt" (the auxiliary hypotheses that take the hit).

  **Progressive vs. Degenerating**
  *   A **Progressive Programme** predicts novel facts. It leads you to discover things you didn't know.
  *   A **Degenerating Programme** only explains things you already know, usually by adding ad-hoc patches to the protective belt.

  Fomenko's New Chronology is a textbook **Degenerating Research Programme**.
  *   **Hard Core:** The timeline is wrong.
  *   **Protective Belt:** Every time a new piece of evidence arises (a new text, a new ruin, a new isotope analysis), Fomenko doesn't use it to predict something new. He adds a patch to the belt: "That text is a copy," "That ruin is medieval," "That isotope is contaminated."
  *   **Novelty:** The New Chronology has never led to the discovery of a new artifact or a new historical event. It only re-categorizes existing ones.

  **Why Lakatos Handles This Better**
  Lakatos solves your worry about "science that lost." A scientific theory can lose and still be part of a progressive programme (e.g., Newtonian physics had anomalies but kept predicting new things). Fomenko's work is degenerating because it is purely defensive. It absorbs energy to protect the core but generates no new knowledge.

  Lakatos also handles the "circularity" charge better. In a degenerating programme, the protective belt becomes so complex and ad-hoc that it loses empirical content. Fomenko's claim that "all dating is circular" is an ad-hoc move to protect the hard core from *any* empirical input. Lakatos allows us to say: "This looks like science, it uses math, but the trajectory of the research is degenerative."

  **Where Lakatos Still Stumbles**
  Lakatos still relies on a rational reconstruction of the history of science. He assumes the community is judging based on "novel facts." But in the Fomenko case, the "novel facts" (archaeological strata) were ignored by the public because of *trust*, not logic. Lakatos explains why the theory is intellectually bankrupt, but like Popper, he underestimates the social fuel that kept the engine running despite the degeneration.

  ### The "Demarcation is a Pseudo-Problem" View

  There is a third position, often associated with later Wittgenstein or sociologists of science: Demarcation is not a logical problem, but a social one. There is no "scientific method" that separates truth from falsehood; there are only communities enforcing norms.

  **How this handles Fomenko**
  This view handles the episode best, specifically regarding the **credentials** and the **rejection**.
  *   **Science is what scientists do:** Fomenko is a mathematician. When he does math, he follows the norms of the math community (proof, peer review). When he does history, he ignores the norms of the history community (archival provenance, stratigraphy, linguistic evolution).
  *   **The Verdict:** He isn't doing pseudoscience because his logic is flawed (though it is); he is doing pseudoscience because he is playing a game without following the rules of the specific community he is addressing. He is using the authority of the Academy of Sciences to bypass the peer review of historians.
  *   **The Context:** This view explains the 1990s explosion. The "scientific community" in Russia was fractured. The norms were weakened. Fomenko exploited a gap between the prestige of the Academy and the specific expertise of historians.

  **The Downside**
  The risk here is relativism. If science is just "what the community says," then if the historians had accepted Fomenko, would it have become science? This view struggles to maintain that there is an objective reality (the actual age of the Pyramids) that the community is trying to track. It explains the *sociology* of the controversy perfectly but leaves the *epistemology* (truth) a bit fuzzy.

  ### The Final Breakdown

  You asked where falsifiability breaks on this case instead of smoothing it over.

  **1. The "Good Faith" Assumption**
  Popper's criterion secretly relies on the theorist arguing in good faith. Falsifiability works if the scientist says, "If X is found, I am wrong." Fomenko says, "If X is found, the dating of X is wrong." Popper calls this a stratagem, but logically, Fomenko can always claim the *auxiliary assumptions* are at fault, not the core theory. This is the **Duhem-Quine problem**. You can never test a theory in isolation, only a theory plus a bundle of assumptions. Fomenko exploits this by blaming the assumptions (the dating methods) every time. Popper requires a judgment call on when an excuse becomes a stratagem. That judgment call is not logical; it's sociological.

  **2. The Competence Gap**
  Falsifiability assumes the person testing the theory understands the tools. Fomenko exploited a competence gap. He used high-level math to dazzle an audience that didn't understand history, and historical claims to dazzle an audience that didn't understand math. Popper's criterion treats the proposition "History is compressed" as a standalone logical object. It doesn't account for the fact that the proposition was weaponized using interdisciplinary confusion.

  **3. The "Science That Lost" Paradox**
  Your intuition that "maybe it was just science that lost" is actually a strong critique of Popper. If Fomenko had said, "Okay, the carbon dating proves me wrong, I abandon the theory," he would have been a scientist who made a mistake. The fact that he didn't is what makes him a pseudoscientist. But this means demarcation isn't about the *content* of the theory at Time A; it's about the *behavior* of the theorist at Time B. Popper tries to make it a logical property of the statement, but in the Fomenko case, it is clearly a property of the *practice*.

  ### Conclusion: Which Framework Wins?

  **Lakatos handles the internal logic best.**
  The concept of a **Degenerating Research Programme** is the most precise tool for Fomenko. It captures why the theory persisted (protective belt) and why it is scientifically worthless (no novel predictions). It validates your sense that "science that loses" is different from "pseudoscience." Science loses and moves on; Fomenko's programme degenerated and dug in.

  **The Sociological View handles the external phenomenon best.**
  It explains why a mathematician could credibly sell history, why the Academy didn't stop him immediately, and why the public bought it during the Soviet collapse. It acknowledges that demarcation is partly about institutional authority and trust, not just logic.

  **Popper is necessary but insufficient.**
  Falsifiability identifies the *mechanism* of the pseudoscience (the immunizing stratagem against dating methods), but it fails to explain the *vector* (how it spread) or the *host* (why a top mathematician).

  **The Unexplainable Remainder**
  Even Lakatos and the Sociological view cannot fully explain the **psychological utility** of the New Chronology. It offered a specific emotional payload: that Russia was the center of the world and that the West had stolen its history. No logical criterion accounts for the fact that pseudoscience often succeeds because it functions as mythology, not inquiry. Fomenko wasn't just testing a hypothesis; he was healing a national trauma. That is a function that science does not perform, and no demarcation criterion based on "truth-seeking" can fully model a system designed for "meaning-making."

  So, falsifiability gives the right verdict (it's pseudoscience) but for a reason that is too thin (logical structure). It misses the degeneration of the research programme (Lakatos) and the collapse of institutional trust (Sociology). The Fomenko case suggests that demarcation isn't a single line you draw with logic; it's a border patrol that requires logic, institutional norms, and an assessment of whether the theorist is trying to find the truth or defend a worldview.
