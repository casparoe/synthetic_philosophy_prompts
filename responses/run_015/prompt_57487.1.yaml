  3.  **Apply Popper's Falsifiability:**
      *   *Mapping the Theory:* It's a bundle.
          *   T1: Chronological compression (events shifted).
          *   T2: Fabrication conspiracy (Scaliger, etc.).
          *   T3: Methodological critique (dating methods are circular).
      *   *Potential Falsifiers:*
          *   Independent dating methods (astronomy, varves, ice cores) that align without relying on historical chronology.
          *   Archaeological stratigraphy showing continuous layers pre-800 AD.
          *   Linguistic evolution rates.
      *   *The "Immunizing Stratagem":* Popper called these "conventionalist stratagems." Fomenko uses one explicitly: "Your evidence assumes the timeline I'm rejecting." This makes the theory unfalsifiable *in practice* because any counter-evidence is dismissed as question-begging.
      *   *Verdict:* Popper would likely classify this as pseudoscience *because* of the immunizing moves, not just because it was proven false.
      *   *The User's Worry:* "If it was checked and failed, isn't it just bad science?"
          *   *Response:* Science accepts defeat. Pseudoscience redefines the rules to avoid defeat. Fomenko does the latter.

  4.  **Analyze the "Credentials" and Sociological Context:**
      *   Popper's criterion is logical, not sociological. It looks at the *structure* of the theory, not the *status* of the theorist.
