  9.  **Final Polish:** Ensure the transition between Popper, Lakatos, and the Sociological view is smooth. Make sure the conclusion directly answers "which one handles this episode best." (Decision: Lakatos is the strongest middle ground, but the Sociological view explains the *phenomenon* best).

