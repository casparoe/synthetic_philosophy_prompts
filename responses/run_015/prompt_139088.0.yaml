answer: |-
  You have identified a specific, high-stakes epistemic maneuver that sits at the intersection of historiography, intelligence analysis, and signaling theory. It does not have a single, universally recognized name, which is surprising given how central it is to any profession reliant on testimony.

  Here is the carving you are looking for, the existing literature that borders it, and a proposed term to sharpen the concept.

  ### 1. The Existing Literature (The Nearest Borders)

  You are correct that the *Halo Effect* is too blunt (it applies to attractiveness or status, not necessarily evidentiary weight) and *Truth-Default Theory* is too passive (it describes a baseline state, not an active update based on verification).

  There are three fields that have carved out pieces of this phenomenon:

  **A. Historiography: External vs. Internal Criticism**
  This is the tradition you stumbled into. Historians distinguish between **External Criticism** (is the document authentic? is the date correct? is the provenance clear?) and **Internal Criticism** (what did the author mean? were they lying? what was their bias?).
  *   **The Phenomenon:** You are using successful *External Criticism* (the dates/serial numbers check out) to bypass the need for rigorous *Internal Criticism* (the motives/private conversations).
  *   **The Risk:** Historians warn that a forger can be externally perfect (correct paper, correct ink, correct dates) while being internally fraudulent (the content is invented).

  **B. Intelligence Analysis: Reliability vs. Credibility**
  Intelligence analysts (using the Admiralty Code) separate **Source Reliability** (how trustworthy is the *person* based on past track record) from **Information Credibility** (how likely is *this specific claim* to be true based on corroboration).
  *   **The Phenomenon:** You are allowing high *Source Reliability* (derived from auditable facts) to inflate *Information Credibility* (for unauditable claims) without independent corroboration.
  *   **The Risk:** A source can be reliably accurate about things they *know* (hard data) while being reliably deceptive about things they *control* (narrative intent).

  **C. Signaling Theory: Costly Signals**
  In economics and biology, a "costly signal" is an action that is hard to fake.
  *   **Version 1 (Auditable Accuracy):** Providing checkable details is a signal of **Access** and **Conscientiousness**. It is "costly" because it requires record-keeping or presence.
  *   **Version 2 (Flagging Weakness):** Admitting ignorance is a signal of **Integrity**. It is "costly" because it reduces the source's immediate persuasive power.
  *   **The Connection:** Both versions are attempts to solve **Information Asymmetry**. The source knows the truth; you don't. They are sending signals to prove they are a "high-quality" information provider.

  ### 2. The Carving: Where the Inference Holds and Where It Leaks

  You asked where the legitimate inference ends and the leak begins. The leak occurs when you conflate **Competence** with **Honesty**, and **Access** with **Interpretation**.

  **The Legitimate Inference (The Signal)**
  If a source gets the auditable details right, you have legitimately established:
  1.  **Presence:** They were likely where they say they were (if they know the lab sample ID, they were likely in the lab).
  2.  **Conscientiousness:** They pay attention to detail.
  3.  **Low Friction:** They are not actively trying to deceive you about *low-stakes* information.

  **The Leak (The Overextension)**
  The confidence transfer fails when:
  1.  **Motivation Diverges:** A source may have zero incentive to lie about the weather or the date, but a massive incentive to lie about what was said in a private meeting. Precision on low-stakes data is a cheap signal; honesty on high-stakes narrative is an expensive one.
  2.  **The "Perfect Witness" Fallacy:** Human memory is reconstructive. A source who remembers the *date* perfectly (which can be checked) may reconstruct the *conversation* (which cannot) to fit their current narrative. The auditable detail anchors the unauditable detail, making the fabrication feel more real to the source themselves.
  3.  **Negativity Bias (The Reverse Version):** You noted that one error destroys trust. This is rational in a security context (one leak sinks the ship) but irrational in a historical context (a truthful witness can have a faulty memory for dates). This is **Credibility Fragility**. We treat truth as a binary state (Honest/Dishonest) rather than a multidimensional trait (Accurate on data/Biased on motive).

  ### 3. Are the Two Versions the Same Animal?

  Yes. They are both **Epistemic Trust Signals**.
  *   **Version 1 (Accuracy)** signals *Competence/Access*.
  *   **Version 2 (Flagging)** signals *Integrity*.
  *   **The Combination:** When a source is precise on data *and* admits uncertainty on interpretation, they maximize **Epistemic Utility**. They look like ideal witnesses.

  However, Version 2 is more robust. Version 1 can be gamed (a liar can memorize true dates). Version 2 is harder to game because admitting ignorance reduces the source's power, making it a **Costly Signal of Honesty**.

  ### 4. A Proposed Term: **Credibility Transduction**

  Since no sharp term exists, I propose **Credibility Transduction**.

  *   **Definition:** The cognitive process by which confidence gained from verifying *hard* claims (auditable, objective) is converted into confidence in *soft* claims (unauditable, subjective) from the same source.
  *   **The Transduction Error:** Assuming the conversion rate is 1:1.
  *   **Instance:** "The source gave me five correct lab sample numbers, so I believe their account of the scientist's emotional state during the experiment."
  *   **Non-Instance:** "The source gave me five correct lab sample numbers, and a third party confirmed they were in the room, so I believe they were present." (This is direct inference, not transduction).

  ### 5. What Should a Journalist Do Differently?

  Knowing about *Credibility Transduction* suggests four specific adjustments to your workflow:

  **A. Decouple the Scores**
  Do not let the "Hard Score" (auditable facts) bleed into the "Soft Score" (narrative claims). In your notes, rate them separately.
  *   *Hard Claim Verification:* 10/10 (Dates, locations, documents match).
  *   *Soft Claim Verification:* 0/10 (No corroboration for thoughts/dialogue).
  *   *Overall Confidence:* Do not average them. Report the Hard claims as fact; report the Soft claims as "according to [Source]," regardless of the Hard score.

  **B. Test for "Self-Serving Clustering"**
  Check *where* the errors live.
  *   If errors are random (typos, wrong weather), the source is likely human but honest.
  *   If errors cluster around self-exculpatory or narrative-driving points (e.g., they are right about the time, but wrong about who arrived first), the source is **Strategically Accurate**. They use hard truths to lubricate soft lies.

  **C. Value "I Don't Know" Higher Than "Perfect Recall"**
  Your intuition on the second version is correct. A source who says, "I don't remember the date, but I remember he was angry," is often more reliable than one who says, "It was October 14th at 2:00 PM and he was angry."
  *   The former signals **Reality Monitoring** (they distinguish memory from reconstruction).
  *   The latter signals **Scripting** (they have polished the story).
  *   *Action:* When a source flags a weak spot, do not just feel good about them; *verify the flag*. If they say "I couldn't confirm X," check if X was confirmable. If it was, and they didn't, they aren't honest; they're lazy. If it wasn't, they are trustworthy.

  **D. Beware the "Anchor Detail"**
  Liars know this trick. They will volunteer a specific, checkable, true detail (the "anchor") to make the surrounding uncheckable narrative feel solid.
  *   *Counter-move:* Verify the anchor *before* listening to the narrative. If you hear the story first, the anchor will bias you. If you verify the anchor first, it's just data.

  ### Summary
  You are practicing **External Criticism** to validate **Internal Claims**. The psychological mechanism is **Credibility Transduction**. It is a rational heuristic (competence often correlates with honesty) but a dangerous epistemic shortcut (precision does not equal truthfulness).

  The boundary case is **Motivation**. If the auditable details serve the source's narrative, they are part of the performance. If the auditable details are dull, irrelevant, or self-damaging, *then* the transduction is safer.
