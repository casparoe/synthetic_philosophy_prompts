answer: |-
  Your skepticism is well-founded. The summary you have read is a classic example of "pop-neuroscience drift," where nuanced experimental findings are hardened into definitive facts, and philosophical possibilities are presented as proven conclusions.

  Your two nags—regarding everyday behavior and the "zombie" right hemisphere—are actually the two strongest critiques modern neuropsychology and philosophy of mind level against this specific narrative.

  Here is a claim-by-claim breakdown of what a specialist would accept, simplify, or reject, followed by an assessment of the fairness to Sperry and Nagel, and finally, an evaluation of the concluding leap about the self.

  ### Claim-by-Claim Analysis

  **1. "Severing the corpus callosum cuts the only channel of communication between the hemispheres."**
  *   **Verdict:** **Simplification.**
  *   **The Science:** The corpus callosum is the *major* highway, but not the *only* one. The anterior commissure and posterior commissure often remain intact during split-brain surgery (callosotomy). Furthermore, subcortical structures (like the brainstem and thalamus) remain shared.
  *   **Why it matters:** These remaining pathways allow for the transfer of emotional tone, arousal, and some sensory integration. This helps explain why patients don't act like "two people" in daily life (your first nag).

  **2. "The patient becomes two isolated systems in one skull."**
  *   **Verdict:** **Contested / Context-Dependent.**
  *   **The Science:** In highly lateralized laboratory tasks (where information is flashed to only one visual field and motor response is restricted to one hand), the hemispheres behave as independent systems. However, in naturalistic settings, patients exhibit a unified personality, unified attention, and unified behavior.
  *   **Current Consensus:** Most modern neuropsychologists (e.g., Pinto, Fabbro) argue that while the *capacity* for independent processing increases, a functional unity is maintained in everyday life through eye movements, head orientation, and subcortical connections. The "two systems" model is a useful heuristic for lab tasks, not a literal description of the patient's existence.

  **3. "Without the capacity for language there is no consciousness there at all — a highly capable but empty automaton."**
  *   **Verdict:** **Flatly Reject.**
  *   **The Science:** This is the most scientifically dubious claim in the summary. While the right hemisphere is largely non-verbal (in most right-handed patients), it demonstrates complex cognitive processing, emotional understanding, spatial reasoning, and the ability to follow commands via non-verbal responses (pointing, pressing buttons).
  *   **Why it matters:** Equating *language* with *consciousness* is a philosophical assumption, not a neurological fact. The right hemisphere can feel frustration, recognize faces, and solve puzzles. Calling it a "zombie" ignores evidence of affective and cognitive awareness. **This directly addresses your second nag:** You are right to feel this is too quick.

  **4. "The left hemisphere... has an interpreter module that confabulates reasons."**
  *   **Verdict:** **Generally Accept (with nuance).**
  *   **The Science:** Michael Gazzaniga's "Interpreter Theory" is well-supported. The left hemisphere does seek causal explanations for actions and feelings, even when it lacks the data (as in the chicken claw/shovel experiment).
  *   **Nuance:** "Confabulate" sounds pathological (like lying). In healthy brains, this is better described as "narrative construction." We all construct post-hoc reasons for our actions. The split-brain data just makes this mechanism visible because the data stream is artificially interrupted.

  **5. "Gazzaniga drew from this the conclusion that the interpreter confabulates in healthy brains too."**
  *   **Verdict:** **Accept.**
  *   **The Science:** This is Gazzaniga's actual position. He argues the "interpreter" is a universal human mechanism, not just a quirk of split-brain patients.

  **6. "Nagel's classic paper... agreed that the operation leaves literally two streams of experience."**
  *   **Verdict:** **Unfair / Misrepresentation.**
  *   **The Philosophy:** Thomas Nagel's 1971 paper *"Brain Bisection and the Unity of Consciousness"* is famous precisely because he *did not* agree on a definitive answer. He argued that the split-brain case breaks our existing concepts of "person" and "mind." He suggested it is logically possible there are two minds, one mind with fragmented access, or something else entirely. To say he "agreed" there are literally two streams simplifies his skeptical inquiry into a dogmatic conclusion.

  **7. "The unity of consciousness... is an illusion: there is no single self."**
  *   **Verdict:** **Philosophical Leap (Non Sequitur).**
  *   **The Logic:** Even if we accept that split-brain patients have fragmented consciousness, it does not logically follow that healthy brains *also* lack unity. A healthy corpus callosum provides robust integration that a severed one does not. To argue unity is an illusion *generally* based on a *pathological* (or surgically altered) state is like arguing that because a broken leg prevents walking, walking is an illusion for healthy people.

  ---

  ### Fairness to Sperry and Nagel

  **Roger Sperry:**
  The summary is **unfair to Sperry**. Sperry was a mentalist; he believed strongly in the reality of conscious experience. In his Nobel lecture and subsequent writings, Sperry argued that the split-brain surgery demonstrated that the right hemisphere *did* possess its own conscious awareness, thoughts, and feelings. He explicitly rejected the behaviorist idea that the right hemisphere was an "automaton." The book summary attributes a view to Sperry (right hemisphere = unconscious zombie) that is the exact opposite of what he championed.

  **Thomas Nagel:**
  The summary is **unfair to Nagel**. As noted above, Nagel used the split-brain case to highlight the limits of our conceptual framework. He wrote: *"We may have to revise our concept of the mind... or we may have to revise our concept of the person."* He did not conclude that the self is an illusion; he concluded that the split-brain case creates a paradox that our current vocabulary cannot solve.

  ---

  ### Addressing Your Two Nags

  **1. "Split-brain patients behave quite normally in everyday life."**
  You are correct. This is the strongest empirical objection to the "two minds" theory. If there were truly two isolated conscious agents, we would expect "inter-manual conflict" (one hand buttoning a shirt, the other unbuttoning it) to occur frequently outside the lab. It rarely does.
  *   **Explanation:** In the lab, researchers strictly lateralize input (blindfolding one eye, flashing images for milliseconds). In the real world, patients move their eyes, turn their heads, and speak aloud, allowing information to cross over or be shared via subcortical routes. The "two systems" view is an artifact of experimental design, not a complete description of the patient's life.

  **2. "The zombie characterisation of the right hemisphere strikes me as too quick."**
  You are correct again. This claim relies on a specific philosophical definition of consciousness that requires linguistic reporting (Higher-Order Thought theory).
  *   **Explanation:** Most neuroscientists distinguish between *access consciousness* (ability to report) and *phenomenal consciousness* (raw feeling). The right hemisphere lacks the former but shows ample evidence of the latter (emotional reactions, surprise, preference). To say it has "no consciousness" is to define consciousness solely as "the ability to speak to the experimenter," which most philosophers of mind would reject as too narrow.

  ---

  ### Does the Conclusion Follow?

  **The Claim:** *It follows that the unity of consciousness each of us takes ourselves to have is an illusion.*

  **The Verdict:** **No, it does not follow.**

  Here is why the leap fails:

  1.  **Pathology vs. Health:** Demonstrating that a mechanism (the corpus callosum) is *necessary* for a specific type of integration does not prove that the integration is *illusory* when the mechanism is intact. If you cut the wire between two speakers, they play different songs. That doesn't mean the speakers were never playing the same song when the wire was connected.
  2.  **The "Interpreter" is not the "Self":** Even if the left hemisphere constructs a narrative (the Interpreter), that narrative is based on integrated data in a healthy brain. The story might be constructed, but the *experience* of unity is functionally real. In philosophy, this is the difference between the "Narrative Self" (which is constructed) and the "Experiential Self" (which is the locus of feeling). The book conflates the two.
  3.  **Alternative Explanations:** The data supports the idea that the self is *modular* and *constructed*, but not necessarily that it is an *illusion*. A constructed unity is still a unity (like a nation or a symphony orchestra). It is only an "illusion" if you define "real self" as a metaphysical ghost in the machine that cannot be broken down. If you define the self as a functional integration of processes, the split-brain data shows the self is *fragile*, not that it is *fake*.

  ### Summary for Your Reading Notes

  *   **Keep:** The "Interpreter Module" concept (Gazzaniga) is a valuable insight into how humans rationalize behavior.
  *   **Discard:** The idea that the right hemisphere is unconscious (contradicts Sperry and evidence).
  *   **Discard:** The idea that Nagel concluded there are definitively two minds (he concluded our concepts break down).
  *   **Discard:** The idea that everyday behavior reflects "two people" (patients function as one).
  *   **Reject the Final Leap:** The unity of consciousness in healthy brains is a robust functional reality, even if it relies on physical integration that can be surgically disrupted. Fragmentation in pathology does not prove illusion in health.

  Your intuition was sharper than the book's conclusion. The text you read presents a specific, somewhat outdated materialist interpretation as settled fact, ignoring the substantial debate that still exists in both neuropsychology and philosophy of mind.
