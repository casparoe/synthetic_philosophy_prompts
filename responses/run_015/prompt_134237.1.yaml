answer: |-
  **Project Title:** The Temporal Asymmetry in Welfare Comparability: Levels, Differences, and Ratios

  **Project Summary and Research Question**

  Contemporary debates regarding interpersonal comparisons of utility (IPC) operate under a tacit asymmetry: while skeptics argue that comparing welfare across persons is metaphysically or epistemically impossible, they often grant that comparing welfare across time within a single life (intrapersonal temporal comparison, or ITC) is unproblematic. This project challenges that asymmetry. The standard skeptical arguments—the arbitrariness of the utility scale's origin and unit, the inaccessibility of subjective experience, and the instability of preferences under adaptation—apply with equal force to the temporal case. Yet, institutions rely heavily on ITC for discounted cost-benefit analysis, prudential deliberation, and health-state metrics like QALYs.

  The central question is not merely whether comparability is possible, but whether the *degree* of comparability required for specific normative theories holds equally across interpersonal and intrapersonal domains. I distinguish three grades of comparability: comparing welfare *levels* (absolute status), comparing *gains and losses* (differences), and comparing *ratios* (proportional changes). These distinctions map onto competing normative frameworks. Total utilitarianism requires cardinal level comparability to sum welfare; prioritarianism requires level comparability to apply weighting functions to the worse-off; sufficientarianism requires threshold comparability; while some forms of egalitarianism rely primarily on differences.

  The dissertation asks: Does the skepticism that undermines interpersonal level comparability also undermine intrapersonal temporal level comparability? If so, does the temporal case offer unique resources—such as a fixed subject of experience—that rescue specific grades of comparability (e.g., differences) even when levels remain opaque? The goal is to determine whether the asymmetry between IPC and ITC is justified, or if it is an artifact of the order in which these questions were historically asked. I aim to produce a typology showing which normative theories survive if we enforce parity between interpersonal and intrapersonal skepticism.

  **Critique of Existing Positions**

  Current approaches leave this comparative question open because they treat IPC and ITC as distinct problems with distinct solutions. The skeptical or ordinalist tradition argues that utility is only ordinally measurable within a person at a time. However, this position often concedes ITC without argument, assuming psychological continuity provides a sufficient bridge for measurement that social discontinuity does not. They lack the resources to explain why adaptation problems—which distort preferences over time—do not invalidate the temporal metrics they quietly accept.

  Conversely, constructivist approaches, such as those utilizing the veil-of-ignorance or extended-sympathy devices, attempt to derive interpersonal comparability by modeling it on intrapersonal choice. These positions presuppose the coherence of ITC to solve IPC. If my hypothesis is correct—that ITC is as problematic as IPC—these derivations are question-begging. They cannot settle the comparative question because they rely on the very asymmetry I am interrogating.

  Social choice theory has formalized measurability and comparability restrictions (e.g., informational invariance conditions), but typically treats the information base as exogenous. It specifies what is needed for a rule to function but does not adjudicate whether the temporal case satisfies those conditions any better than the interpersonal case. Finally, recent empirical work on subjective well-being (SWB) offers data on self-reported welfare but conflates report comparability with welfare comparability. It cannot settle the normative question of whether those reports track a common scale across time any better than across persons.

  A common rejoinder is that comparability is not a metaphysical fact but an institutional stipulation. On this view, we stipulate comparability to make policy work. I will argue this is insufficient. If the stipulation violates deep constraints on rationality or measurement (e.g., if adaptive preferences make temporal stipulations arbitrary), the resulting policies lack normative force. The project must determine whether there is a fact of the matter that constrains these stipulations, or if the asymmetry is purely pragmatic.

  **Methodology and Timeline**

  The project proceeds over twelve months, divided into four phases of research and writing.

  *Months 1–3: Formalizing the Typology.* I will formalize the distinctions between level, difference, and ratio comparability using standard social-choice notation. The milestone is a working paper chapter defining the informational constraints required by utilitarian, prioritarian, and sufficientarian views. This ensures the normative stakes are precise before applying skeptical arguments.

  *Months 4–6: The Temporal Skepticism Argument.* I will apply the standard skeptical arguments (scale arbitrariness, inaccessibility, adaptation) specifically to the temporal case. I will analyze cases of radical preference change and memory loss to test the limits of intrapersonal comparison. The milestone is a complete draft of the core philosophical argument demonstrating that ITC is vulnerable to the same skepticism as IPC.

  *Months 7–9: Normative Implications and Asymmetry.* I will evaluate which normative theories survive if IPC and ITC are treated symmetrically. This involves testing whether the "fixed subject" in the temporal case rescues level comparability or only difference comparability. The milestone is a draft chapter mapping the survival conditions for each normative theory under symmetric skepticism.

  *Months 10–12: Integration and Revision.* I will integrate the chapters, address objections regarding institutional stipulation, and refine the argument regarding the veil-of-ignorance. The final month is dedicated to full dissertation revision and preparation for defense.

  **Success and Failure Conditions**

  Success looks like a determinate map of comparability. Specifically, a result showing that while level comparability fails in both domains, difference comparability holds in the temporal case due to psychological continuity, thereby saving prioritarianism but undermining total utilitarianism. Alternatively, success could be demonstrating that both domains fail equally, forcing a shift to non-welfarist metrics.

  Failure, in the intellectual sense, would occur if the question dissolves. If it turns out that all comparability is purely stipulative with no rational constraints, the project yields a deflationary conclusion that offers no guidance beyond "institutions decide." While philosophically significant, this would undermine the project's aim to find a structural asymmetry. Another failure mode is triviality: if the answer is simply that ITC is easier because the subject is identical, without explaining *how* identity solves the measurement problem, the argument remains undeveloped. The project fails if I cannot specify the mechanism by which temporal identity aids measurement where social identity does not.

  **Scope and Limitations**

  Two potential expansions threaten the project's completion within a year. First, the metaphysics of personal identity. If the temporal case relies on what constitutes the "same person" over time, the project could drift into metaphysics. I will deliberately set this aside. I will treat personal identity as conventionally fixed for the sake of argument, focusing on the *measurement* implications of that fixity rather than its ontological grounds. This keeps the project within political philosophy and social choice.

  Second, the veil-of-ignorance move. Since this device converts interpersonal problems into intrapersonal ones, it is a critical test case for my asymmetry argument. However, a full critique of contractarianism is too large. I will include the veil-of-ignorance only insofar as it functions as a comparability device. I will not assess the veil's validity as a theory of justice, only whether its reliance on intrapersonal comparison is vulnerable to the skeptical arguments I raise. This limited inclusion is necessary; if the veil presupposes robust ITC, and I show ITC is fragile, the device loses its force for solving IPC. Therefore, this analysis remains inside the project, but bounded strictly by its informational requirements.

  By restricting the metaphysics and bounding the contractarian analysis, the project remains focused on the comparability asymmetry. This ensures the dissertation is completable within the fellowship year while delivering a novel contribution to the foundations of welfare economics and political philosophy.
