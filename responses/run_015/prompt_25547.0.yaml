  2.  **Recall/Review Dennett's Three Stances:**
      *   **Physical Stance:** Predict based on physical constitution and laws of nature. (e.g., melting ice, circuit logic). Most fundamental, but often computationally intractable for complex systems.
      *   **Design Stance:** Predict based on function and design purpose, ignoring physical details. (e.g., a clock tells time, a heart pumps blood). Assumes the system works as designed.
      *   **Intentional Stance:** Predict based on beliefs, desires, and rationality. Treat the system as an agent. (e.g., "He wants water, believes the fridge has water, so he goes to the fridge").
      *   **Key Criterion for Shifting:** We move up a stance when the lower stance is too computationally expensive or impossible to apply, *and* the higher stance yields reliable predictive power.
      *   **Reality of Patterns:** Patterns are "real" if they support successful prediction. The intentional stance reveals "real" patterns if treating the entity as a rational agent works better than treating it as a designed mechanism.
      *   **The Specific Comparison:** The prompt asks for the gain of *Intentional over Design*. This is crucial. Many systems are well-explained by Design. The Intentional stance is only *necessary* or *superior* when the system exhibits flexibility, novelty, or complexity that transcends its fixed design parameters in a way that looks like rational agency.

