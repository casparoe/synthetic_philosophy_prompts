  # DRAFT JOINT STATEMENT: NATURALIZING CONTENT IN BIOLOGICAL AND SYNTHETIC SYSTEMS
  **Working Group on Teleosemantics and Functionalism**  
  **Status:** Pre-publication Draft (Adversarial Collaboration)

  ### 1. Agreed Claims
  *Both camps affirm the following foundational premises regarding mental content and misrepresentation.*

  1.  **The Misrepresentation Constraint:** Any viable naturalization of mental content must explain the possibility of error. A system that merely correlates with environmental states cannot misrepresent them; there must be a normative standard (a "ought") distinct from actual occurrence.
  2.  **Limits of Pure Causal Correlation:** Pure causal covariance between internal states and external conditions is insufficient for content. Without a selectional or functional history, a state triggered by a horse is indistinguishable from a state triggered by a horse-in-front-of-a-cow-in-the-dark.
  3.  **Naturalization Requirements:** To naturalize content, we must identify physicalistically respectable facts that determine why a state means *this* rather than *that*, without appealing to intrinsic intentionality or observer-relative interpretation.
  4.  **Synthetic System Relevance:** Artificial neural networks trained via reinforcement learning (RL) constitute a valid test case for theories of content. If a theory cannot account for representation in synthetic learners, its scope is limited to biological carbon chauvinism.
  5.  **Algorithmic Instability:** In RL-trained systems, "proper function" is unstable. Optimization targets local loss minimization rather than a stable phylogenetic trait. Both sides agree this creates a specific challenge for defining algorithmic misrepresentation distinct from simple loss spikes.

  ### 2. Areas of Disagreement
  *The following table outlines where the camps diverge on mechanism, scope, and the synthetic case.*

  | Issue | Evolutionary side's formulation (worded so they'd sign it) | Ontogenetic side's formulation (worded so they'd sign it) | The crux | Case/argument both accept bears on it | Each side's prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Selection & Reproduction** | Proper functions require a history of selection via reproduction. Without lineage replication, there is no normative standard to ground error. | Proper functions can emerge from individual learning histories. Reinforcement within a single lifespan establishes norms without requiring genetic reproduction. | Whether selection requires reproduction. | A single organism isolated from birth that learns via trial and error. | **Evo:** No content exists without lineage.<br>**Onto:** Content emerges via learning trials. |
  | **Ontogeny vs. Phylogeny** | Phylogenetic history is necessary to fix content. Ontogenetic learning merely tunes mechanisms designed by evolution. | Ontogenetic history is sufficient to fix content. Phylogeny provides the hardware, but learning history writes the software semantics. | Whether ontogeny can substitute for phylogeny. | Human infants vs. mature adults acquiring new concepts. | **Evo:** Infant content is derivative of ancestral content.<br>**Onto:** New content is created de novo via learning. |
  | **Synthetic Content & AI** | RL networks lack evolutionary history, so they lack genuine content. Algorithmic misrepresentation is merely metaphorical loss deviation. | RL networks have learning histories (ontogeny), so they possess genuine content. Algorithmic misrepresentation is real error based on training norms. | Whether synthetic systems have mental content at all. | RL agent navigating a maze with deceptive rewards. | **Evo:** Agent has no beliefs, only causal states.<br>**Onto:** Agent has false beliefs about the maze. |
  | **Verbal Dispute** | The dispute is substantive. "Function" means something specific regarding survival/reproduction that learning alone cannot capture. | The dispute is partially verbal. We agree on the functional role but disagree on whether "phylogeny" is the right label for the necessary history. | Whether part of the dispute is verbal. | Usage of the term "function" in engineering vs. biology. | **Evo:** Terminology tracks real ontological differences.<br>**Onto:** Terminology obscures functional equivalence. |

  ***

  **Reporter's Note:** The trickiest bit here is the third row on synthetic systems. The evolutionary camp basically says AI is a philosophical zombie—it mimics representation but lacks the historical "right to be wrong." The ontogenetic camp argues that if you train a net long enough, its loss function *becomes* a norm, making errors real errors. Both sides admit that if misrepresentation in AI is just "local loss minimization" without a stable target, their theories might need serious patching.

