answer: |-
  This is a classic philosophical standoff, often referred to as the **Paradox of Supererogation**. It pits a pluralistic view of morality (where duty and goodness are distinct categories) against a maximizing view (where morality demands the best available outcome).

  Here is the refereeing of their exchange, step-by-step, followed by an analysis of what both are missing.

  ### Round 1: The Definition and The Puzzle

  **Ethicist 1 (E1):** *Claim:* Supererogation is coherent. Praise tracks the production of good, not obligation. Optionality merely categorizes the act; it doesn't generate the praise.
  **Ethicist 2 (E2):** *Claim:* If praise tracks value, optionality is irrelevant. But we intuitively praise the optional act *more* than the obligatory one. Therefore, optionality must imply a hidden obligation. The category is unstable.

  **Referee's Ruling:**
  *   **E1 is conceptually right, but E2 is logically sharper.**
      *   **E1** correctly identifies the standard definition of supererogation: an act that is good to do but not wrong to omit. Her separation of *praise* from *obligation* is the bedrock of non-utilitarian ethics. She is right that we do not praise people merely for doing the bare minimum of duty (e.g., not murdering someone), even though it produces good.
      *   **E2**, however, identifies the structural weakness. She is channeling a utilitarian objection: If an act produces the *most* good (saving a life), why is it not obligatory? If it is praiseworthy, it implies there was strong moral reason to do it. If the moral reason was strong enough to warrant praise, why wasn't it strong enough to warrant requirement? E2 is right that E1 hasn't yet explained *why* the optionality adds to the praiseworthiness rather than detracting from it (i.e., "If it was optional, why didn't you do it?" vs. "Wow, you did it even though you didn't have to.").

  **Score:** E1 holds the ground of common moral intuition; E2 holds the ground of logical consistency.

  ### Round 2: The Role of Sacrifice

  **Ethicist 1 (E1):** *Claim:* The "extra" praise comes from **sacrifice/cost**, not hidden obligation. We praise the effort and the good. Even costless kindness is praiseworthy, but costly heroism is *more* praiseworthy.
  **Ethicist 2 (E2):** *Claim:* Cost alone isn't enough (costly foolishness isn't praiseworthy). Costless kindness proves you are smuggling "value" back in. The "extra credit" for optionality remains unexplained.

  **Referee's Ruling:**
  *   **E2 wins this exchange.**
      *   **E1** makes a strategic error by bringing up "costless kindness." If supererogation is defined by going *beyond* duty, and duty is often defined by what can be demanded without excessive sacrifice, then cost is essential to the definition. By admitting costless acts are praiseworthy, she blurs the line between "politeness" and "heroism."
      *   **E2** correctly traps E1 on the cost issue. E2 points out that cost is not an independent moral good. Digging a hole and filling it up again is costly, but not praiseworthy. Therefore, cost must be *instrumental* to the good. But if the praise comes from the Good + Cost, we return to the original problem: If the Good is high enough to justify the Cost and warrant Praise, why isn't it Obligatory? E2 is right that E1 has not explained why the *optionality* itself enhances the praise rather than just the *magnitude of the good*.

  **Score:** E2 successfully exposes a gap in E1's explanation of the "bonus" praise.

  ### What Both Are Missing

  While E2 wins the logical sparring, E1 is closer to how human morality actually functions. Both are stuck because they are arguing within a framework that is too narrow. Here is what is absent from their dialogue:

  **1. The Agent-Centered Prerogative**
  Both ethicists are treating morality as if it is solely about the *Act* (outcome/value). They are missing the *Agent*.
  Most contemporary defenses of supererogation (such as those by Samuel Scheffler) rely on the idea that individuals have a **prerogative** to prioritize their own interests up to a certain point.
  *   **The Missing Argument:** The kidney donor is praiseworthy not just because of the *value* produced, but because they **waived a right** they possessed. They had a moral permission to keep the kidney (the prerogative). By overriding their own permitted self-interest for the sake of another, they demonstrate a specific kind of moral excellence.
  *   **Why it matters:** This solves E2's puzzle. The act isn't obligatory because the agent *owned* the option to say no. The praise comes from the voluntary surrender of that ownership, not just the value of the kidney.

  **2. The Distinction Between "Right Act" and "Good Agent"**
  Both speakers conflate the evaluation of the *action* with the evaluation of the *person*.
  *   **The Missing Argument:** Obligation governs the **minimum threshold for acceptable action** (avoiding blame). Supererogation governs the **ceiling for admirable character** (earning praise).
  *   **Why it matters:** E2 argues that if an act is praiseworthy, it should be required. This assumes the function of morality is to maximize good acts. But if the function of morality is also to cultivate virtuous agents, then "optional" acts are the testing ground for virtue. You cannot mandate virtue; you can only mandate compliance. The "extra credit" E2 is looking for is the revelation of character that only freedom allows.

  **3. The Social Function of Praise**
  E1 treats praise as a tracking mechanism (like a thermometer). E2 treats it as a deontic signal (like a traffic light).
  *   **The Missing Argument:** Praise is an **incentive structure**. We label acts as supererogatory and praise them highly specifically to *encourage* them without *coercing* them. If we made kidney donation obligatory, we might get more kidneys, but we would lose the social meaning of "gift" and "solidarity."
  *   **Why it matters:** The category "supererogatory" does work, but not in the metaphysics of the act; it does work in the sociology of moral encouragement. It keeps the act in the realm of the "gift," which preserves its special value.

  ### Final Verdict for Your Piece

  If you must declare a winner on the logic: **Ethicist 2** is right that E1's specific arguments (value-tracking and cost) do not fully solve the paradox on their own terms. E1's position collapses under the pressure of E2's maximizing logic.

  However, if you are writing on **moral heroism**, **Ethicist 1** is describing the phenomenon more accurately, even if her theoretical defense was shaky. Heroism *feels* optional and praiseworthy. Ethicist 2's view leads to a world where everyone is either a duty-fulfiller or a villain, which erases the concept of heroism entirely.

  **The Synthesis:**
  The truth lies in the **waiver of the prerogative**. The kidney donor is praiseworthy because:
  1.  They produced immense good (E1's point).
  2.  They incurred significant cost (E1's point).
  3.  **Crucially:** They were not required to do so, and by doing it, they surrendered a personal right for a public good (The missing point).

  E2 is right that value + cost doesn't equal supererogation. But E1 is right that supererogation exists. The bridge between them is **freedom**. The praise is for the *use of freedom*, not just the *production of value*. Without the genuine option to refrain, the sacrifice is not a gift; it is a tax. And we do not praise people for paying taxes.
