answer: |-
  First off: this is genuinely impressive engineering. You have successfully implemented a **counterfactual test of intention**, which is one of the standard ways analytic philosophers try to operationalize the Doctrine of Double Effect (DDE). The fact that it passes the standard "Trolley Unit Tests" (Switch vs. Footbridge) means you've captured the structural logic of the *means/end* distinction.

  However, to answer your core question: **No, DDE is not just causal bookkeeping.** Your implementation captures the *causal structure* of the plan, but it misses the *agency* and *proportionality* constraints that are essential to the actual doctrine.

  Here is the breakdown of why your edge cases are failing, why Legal is likely misunderstanding the doctrine, and how to architect this safely.

  ---

  ### 1. Debugging Your Edge Cases

  Your function `counterfactual_necessity` tests if the harm is *causally necessary* for the goal. DDE asks if the harm is *intended as a means*. These are similar, but not identical.

  #### Case 1: The Barrier & The Sleeper
  *   **Your Verdict:** Intended (Forbidden).
  *   **DDE Verdict:** Foreseen Side Effect (Permitted, *ceteris paribus*).
  *   **The Bug:** You are conflating the **mechanism** with the **harm**.
      *   The *mechanism* required for the plan is `collision_with(barrier)`.
      *   The *harm* is `death_of(sleeper)`.
      *   Your code asks: "If the sleeper doesn't die, does the shuttle stop?"
      *   In your model, you likely have `collision_with(barrier)` implying `death_of(sleeper)`. So when you force `death_of(sleeper) := False`, your causal model breaks the collision logic too.
      *   **The Fix:** You need to separate the physical event from the moral valuation. If the sleeper woke up and moved 1 second before impact, the shuttle still hits the barrier and stops. Therefore, the *death* is not necessary for the *stop*. Only the *impact* is necessary.
      *   **Philosophical Term:** This is the distinction between *intending the act* (hitting the barrier) and *intending the consequence* (killing the man). DDE allows the former if the latter is merely foreseen.

  #### Case 2: The Scaffolding (Pre-emption)
  *   **Your Verdict:** Side Effect (Permitted).
  *   **DDE Verdict:** Intended Means (Forbidden).
  *   **The Bug:** Your test measures **necessity**, but DDE also cares about **causal contribution**.
      *   In this scenario, the shuttle uses the person's body as a surface to drive on (or an obstacle to remove). Even if they would die 2 seconds later, the shuttle's action *is* the cause of death at $t=0$.
      *   DDE forbids making the harm part of your *plan's success condition*. If your plan is "Drive over spot X," and "Spot X contains Person," your plan relies on the physics of Person being there to support the wheels (or the plan ignores their rights to use them as terrain).
      *   **The Fix:** You need a check for **Agency**. Does the agent's causal chain *initiate* the harm? If `shuttle_action` is a parent node of `death` in the causal graph, it is a "direct effect," regardless of whether `scaffolding` was also a parent node. DDE does not allow you to "cancel out" your murder because someone else was going to do it.

  ---

  ### 2. The "Off The Books" Misconception (Critical)

  You asked: *"Legal... on the theory that DDE means foreseen-but-unintended harms are off the books entirely and we never have to weigh them. Is that right?"*

  **Absolutely not.** This is a dangerous misunderstanding of the doctrine.

  The Doctrine of Double Effect has **four** conditions, not just the intention/means test you implemented. All four must be met:
  1.  **Nature of the Act:** The action itself must be morally good or neutral (e.g., driving the shuttle).
  2.  **Intention:** The agent must intend only the good effect (stopping safely), not the bad one (death).
  3.  **Means vs. Side Effect:** The bad effect must not be the means to the good effect (your code tests this).
  4.  **Proportionality:** **The good effect must be sufficiently weighty to justify the bad effect.**

  **Condition 4 is where the weighing happens.**
  DDE does *not* say "If it's a side effect, it costs zero." It says "If it's a side effect, it *can* be weighed."
  *   **Example:** You cannot slam into a barrier killing a sleeper to avoid being 30 seconds late. The good (punctuality) is not proportional to the bad (death).
  *   **Example:** You *might* be permitted to slam into a barrier killing a sleeper to avoid hitting a bus full of children.

  **Engineering Implication:** You cannot treat foreseen harms as zero-cost in your cost function. You must still assign them a weight. DDE just changes *which* options are eligible for the cost function (filtering out "intended means" harms), not how the remaining options are evaluated.

  ---

  ### 3. Architecture: Filter vs. Generator

  You asked: *"Does DDE ever tell you what to do, or is it only ever a veto... I've got it wired in as a filter that runs after the planner picks the lowest-harm route."*

  **Running it *after* the planner picks the route is backwards.**

  *   **Utilitarian Planner:** "Find the path with minimum Expected Harm."
  *   **DDE Constraint:** "Discard any path where Harm is a Means."

  If you run DDE *after* optimization, you might select a path that minimizes harm but violates DDE (e.g., "Push the heavy guy off the bridge" minimizes total deaths compared to "Let trolley hit 5 people," but DDE vetoes it).

  **Correct Flow:**
  1.  **Generator:** Produce candidate trajectories.
  2.  **DDE Filter (Hard Constraint):** Tag trajectories where harm is a "Means" (via your counterfactual test + agency check). **Discard these.**
  3.  **Proportionality Weighing (Cost Function):** On the *remaining* trajectories (where harm is only "Side Effect"), calculate Expected Harm.
  4.  **Selector:** Pick the lowest cost from the *allowed* set.

  If the DDE filter discards *all* paths (e.g., every way to stop kills someone as a means), you have a "No Safe Solution" state, which should trigger a specific fail-safe (e.g., emergency stop in place), not a fallback to utilitarianism.

  ---

  ### 4. Summary & Recommendation

  **Is DDE just causal bookkeeping?**
  No. It's causal bookkeeping + agency tracking + proportionality weighing. Your code handles the first part well for toy problems, but needs refinement for real-world causal graphs.

  **Is Legal right about "Off the Books"?**
  No. Foreseen harms must still be weighed against the good outcome. If you ship code that treats foreseen death as zero-cost, you are building a liability bomb, not an ethics module.

  **Actionable Steps for Your Module:**

  1.  **Refine the Counterfactual:** Distinguish between `event_required_for_plan` (hitting barrier) and `harmful_outcome_of_event` (sleeper dies). Only the former should trigger the "Means" flag.
  2.  **Add Agency Check:** If the shuttle's physics engine directly causes the harm (collision), it is a direct effect, regardless of pre-existing conditions (scaffolding).
  3.  **Implement Proportionality:** Ensure your cost function still penalizes foreseen harms. DDE is a *constraint* on optimization, not a replacement for it.
  4.  **Re-order the Pipeline:** Move the DDE check *before* the final selection, not after. It is a validity check, not a post-processing step.
  5.  **Documentation:** Explicitly document that this module does **not** absolve the system of liability for foreseen consequences. It only distinguishes between *murder* (means) and *manslaughter/negligence* (side effect) in the logic layer.

  **One final warning:** DDE is controversial in modern ethics. Many consequentialists reject it entirely, and even some deontologists find the means/side-effect distinction fuzzy in complex autonomous systems. Do not market this as "Solved Ethics." Market it as "Constraint-Based Risk Mitigation." Legal will prefer that anyway.
