answer: |-
  **Project Title:** Legible Succession: Distinguishing Standing Institutions from Recurring Events in the Archaeological Record

  **1. Research Question and Hypotheses**
  Archaeologists frequently infer the existence of early institutions—standing offices, treasuries, or priesthoods—from material patterns of scale and standardisation. Large storage facilities, metrically uniform containers, and redundant administrative markings are typically treated as signatures of bureaucratic continuity. However, scale and standardisation are also produced by well-rehearsed events: recurring festivals, seasonal harvest pooling, or mobilisations for specific building projects. The central question of this project is: **Does the material record preserve a signature that discriminates a standing institution from a recurring event?**

  This project tests the hypothesis that standing institutions face a unique constraint that events do not: the necessity of handing over equipment, procedures, and records to successors who were not present at their creation. I term this constraint *successor-legibility*. To answer the question within the twelve-month fellowship period, I will evaluate three rival generative hypotheses against assemblage data:
  1.  **The Standing Office:** Material patterns reflect continuous maintenance, personnel turnover, and adaptation for future users unknown to the creator.
  2.  **The Recurring Event:** Material patterns reflect periodic mobilisation, tradition-based standardisation, and deposition intact after the event concludes.
  3.  **The One-Off Episode:** Material patterns reflect immediate functional needs without concern for future reuse or tradition-based replication.

  **2. Critical Context and Intervention**
  Current archaeological argumentation relies on an implicit assumption: that only a permanent bureaucracy can generate large-scale, standardised deposits. This assumes that events cannot achieve similar scale through tradition or that episodic mobilisation cannot produce metric uniformity. This assumption remains unisolated and untested. Conversely, the sceptical position—that institutions are simply invisible in the material record—is epistemologically too cheap. It dismisses the possibility of inference rather than refining the criteria for it.

  This project intervenes by shifting the diagnostic criterion from *output* (scale/standardisation) to *lifecycle* (maintenance/adaptation). If an institution persists beyond the tenure of its creators, its material culture should exhibit traces of repair that preserve function while sacrificing original integrity, modular components replaceable by strangers, and marking systems that are conventionalised rather than context-specific. An event's equipment, by contrast, is legible only to its participants; it is characteristically deposited intact, unmaintained, and never adapted for reuse by strangers. By formalising these expectations, this project moves the debate from intuitive attribution to testable prediction.

  **3. Methodology and Work Plan**
  The core method is forward-modelling. Rather than starting with empirical data and seeking patterns, I will specify the generative processes of the three hypotheses and derive their predicted signatures regarding assemblage composition, repair, discard, and deposition. I will then test whether these predicted signatures remain separable under the sample sizes and preservation conditions typical of real assemblages.

  *   **Months 1–3: Parameterisation.** I will define the operational variables for *successor-legibility*. This involves formalising what constitutes a "conventionalised mark" versus a "context-specific mark," and "modular repair" versus "integral repair." I will construct decision trees for how objects enter, circulate, and exit the system under each of the three hypotheses.
  *   **Months 4–6: Simulation.** Using the parameters from Months 1–3, I will generate synthetic assemblages. This simulation will introduce noise factors representative of archaeological taphonomy (fragmentation, loss, differential preservation). The goal is to determine if the theoretical signatures survive the degradation processes inherent to the record.
  *   **Months 7–9: Empirical Testing.** I will apply the derived signatures to existing published assemblage data. I will not conduct new fieldwork or rely on specific site reports. Instead, I will utilise aggregate data on *types* of assemblages (e.g., bulk storage jar concentrations, sealing assemblages, uniform vessel series) drawn from the published literature. The test is whether the empirical data clusters with the synthetic "Institution" model or the "Event" model.
  *   **Months 10–12: Synthesis and Writing.** I will integrate the modelling results with the empirical testing to draft the dissertation chapters. This includes formulating the criteria for when an institutional attribution is warranted and when agnosticism is the only valid position.

  **4. Outcomes and Implications**
  There are three possible outcomes:
  1.  **Positive Identification:** The modelling shows that *successor-legibility* markers (e.g., specific repair types, redundant marking) are robust to taphonomy and are present in specific assemblage types. This would validate current institutional attributions where these markers exist and retract them where they do not.
  2.  **Negative Result:** The modelling shows that the signatures of institutions and events converge under realistic preservation conditions. This would entitle me to conclude that, given current preservation and sampling, the distinction is archaeologically inaccessible.
  3.  **Conditional Separation:** The signatures are separable only at sample sizes larger than those typically recovered. This would mandate a revision of sampling strategies in future fieldwork.

  A negative result is not a failure of the project; it is a substantive conclusion about the limits of archaeological inference. It would entail that debates over early storage and redistribution must cease claiming "bureaucracy" as a settled fact where only scale is evident. It forces a restructuring of early state formation narratives to rely on evidence that actually discriminates between continuity and repetition.

  **5. Criteria for Project Failure**
  It is vital to distinguish a negative result from project failure. The project would fail only if:
  *   The generative models cannot be formalised sufficiently to produce testable predictions.
  *   The published data is too heterogeneous to allow for comparison with the synthetic models.
  *   The timeline is not met, preventing the completion of the dissertation chapters.

  If the models are built and tested, and the result is that institutions cannot be distinguished from events, the project has succeeded in correcting a methodological error in the discipline.

  **6. Justification for Methodological Funding**
  This project is methodological rather than empirical. It does not propose new excavation or the analysis of unpublished finds. For a multidisciplinary panel, the value of this approach lies in its epistemological rigour. Archaeology often builds grand social narratives on fragile inferential chains. By funding a year dedicated to stress-testing the logic of those chains, this fellowship prevents future empirical work from building on foundations that may be conceptually unsound. It ensures that when archaeologists claim to have found a "state" or an "office," the claim rests on a signature that actually distinguishes those things from the material traces of a festival or a season's harvest. This is a necessary investment in the reliability of historical reconstruction.
