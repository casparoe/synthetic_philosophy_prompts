answer: |-
  The ink on the vellum was still wet when Thorne leaned over the desk. He didn't touch the paper, but his shadow fell across the clause like a blot.

  "Print it, Elara," he said. "Date it today. The Republic doesn't have time for ghosts."

  Elara Vance kept her pen steady. She was the Chief Clerk of the Grand Assembly, the keeper of the Statute Book. In Marenya, a law wasn't law until the Clerk signed the register. It was a ceremonial duty, mostly, until today.

  "Article 61(b) says otherwise, Kaelen," she said. She didn't look up. "An amendment to this article does not take effect until ratified by the Assembly sitting one generation later. Twenty-five years."

  "We voted it down," Thorne said. He tapped the desk. "Two-thirds majority. Clean vote. Article 61(a) says we can amend any article, including this one. We just did. We deleted the delay. So there is no delay."

  "There was a delay when you voted," Elara said. "You used the rule to delete the rule. If the rule stands, you have to wait. If the rule goes, you had no authority to delete it instantly."

  Thorne straightened up, pacing the small office. The walls were lined with binders, decades of constitutional crises bound in leather. "The Court ruled. Harrow signed the order this morning. They said the amendment is active immediately. Sovereignty resides in the current Assembly, not the dead."

  "Justice Harrow gets his jurisdiction from Article 45," Elara said. "Article 45 was amended by Bill 909 too. You changed the Court's power along with the delay."

  Thorne stopped pacing. "So?"

  "So the Court that ruled on this bill derived its authority from the bill itself. If the bill isn't law yet, the Court had no power to say it is law. If the bill is law, the Court had power. It's a snake eating its tail, Kaelen. You're asking me to certify the snake."

  Thorne sighed, rubbing his temples. He looked tired. They all looked tired; Marenyan politicians tended to live long, vital lives, sustained by the country's peculiar water and healthcare. Thorne was eighty-five. He looked sixty. He would likely be alive in twenty-five years. They all would be.

  "That's why we need it printed today," Thorne said. "If you date it today, the loop closes. The Court was right, the delay is gone, we move on. If you date it twenty-five years from now, you admit the delay exists. If you admit the delay exists, you admit 61(c) might void the whole thing."

  Elara finally looked up. "Let's lay it out. There are three horns, Kaelen. You know them."

  "Recite them," he said.

  "One," Elara said, ticking a finger. "The amendment is valid but dormant. It sits in the book for twenty-five years. 61(b) remains in force during that time. But if 61(b) is in force, it forbids itself from being removed instantly. So the amendment is a lie waiting to happen."

  "Two," Thorne interrupted. "Immediate effect. The moment I voted, 61(b) died. The delay never existed. The Court's jurisdiction is valid. We govern."

  "And three," Elara said. "Void ab initio. Article 61(c) says no amendment may remove requirement (b) with respect to itself. You tried to remove (b) with respect to itself. The vote was unconstitutional. The Court's order is null. I burn the paper."

  Thorne slammed his hand on the desk. "Nobody wants option three. The country is gridlocked. We can't pass budget reforms because the opposition knows they can stall for a generation. We need to be able to change the rules without waiting for our own funerals."

  "So you want me to commit fraud," Elara said. "If I print it with today's date, I am ignoring 61(b) while 61(b) is still the law governing my action."

  "I want you to recognize the will of the Assembly," Thorne said. "61(a) says we can amend anything. That is the supreme power. (b) and (c) are limitations the past imposed on the future. The future is here. We say (a) wins."

  Elara stood up. She needed air, or at least a different room. "Come with me."

  She led him down the hall to the Archives. The air here was cooler, smelling of dust and old glue. She unlocked a cabinet marked *Founding Era*. She pulled out a box, brittle cardboard, and opened it. Inside was a single sheet of parchment, handwritten.

  "The founders' notes," Elara said. "I pulled them when the bill was first introduced. I thought someone might have clarified the intent."

  Thorne leaned in. "What does it say?"

  Elara read from the translation. "Article 61 is the engine of the state. It must be repairable while running. However, haste is the enemy of liberty. The delay ensures stability. Clause (c) ensures the delay cannot be bypassed." She looked at Thorne. "Listen to the next line. 'Therefore, (a) grants the power, and (c) secures the chain. Neither may yield.'"

  Thorne squinted. "They contradicted themselves. (a) says you can amend anything. (c) says you can't amend this part. They wrote a lock and gave everyone the key, then said don't use the key."

  "They didn't notice," Elara said. "They believed (c) made 61 permanent and (a) made it amendable. They never noticed those can't both be true. They built a paradox into the foundation and called it stability."

  She put the paper back. "And now you want me to sign off on it. Knowing that in twenty-five years, the Assembly that ratifies this will be you. And you. And Harrow." She gestured to the hallway. "You're not waiting for the next generation. You're waiting for yourselves to get bored."

  "It's a formality," Thorne said. "We know we'll be back. We know we'll vote yes again. Why wait? It's a fiction everybody has been politely maintaining for a century. The 'next generation' gate is a lie. We're just admitting it."

  "If I print it today," Elara said, "I break the chain. The Court's jurisdiction becomes real because I say it is. The amendment becomes real because I say it is. I become the anchor."

  "You're the Clerk," Thorne said. "That's your job. To make it real."

  "My job is to record what is law. Not to decide what law is."

  "There is no difference at the edge!" Thorne's voice echoed in the archive room. "When the rule applies to itself, the record *is* the law. If you write 'Effective Immediately,' it is immediate. If you write 'Effective 25 Years,' it is delayed. You hold the pen, Elara. You decide which reality we live in."

  He was right. That was the terror of it. The paradox wasn't in the text; it was in the ink. The logic loop had to be broken by a physical action. A choice.

  "Give me an hour," Elara said.

  Thorne nodded, once, sharp. He left the archives.

  Elara sat at the small desk in the corner. She pulled the Statute Book toward her. It was open to the current session. Bill 909 was logged, but the status column was blank.

  She thought about the three horns.

  If she marked it dormant, she preserved the Constitution but paralyzed the government for a quarter-century. The reforms would die in committee. The country would stagnate.

  If she marked it void, she caused a crisis. The Assembly's vote was null. The Court's order was null. Chaos.

  If she marked it immediate, she validated the bootstraps. She accepted that the current Assembly could rewrite the rules of its own existence without waiting. She accepted that the Court could claim power from a law that didn't exist yet.

  She picked up her pen. It was a heavy thing, steel-nibbed.

  She thought about the founders. They hadn't noticed the contradiction. They were human. They wanted stability and change at the same time. They wanted a machine that ran forever without fuel.

  She thought about Thorne. He would be here in twenty-five years. He would vote again. The "ratification" would be a handshake among the same old men in the same room. The delay was not about generation; it was about humility. It was about admitting that today's passion might be tomorrow's regret. But if today's passion was to remove the requirement for humility...

  Elara dipped the pen.

  The jurisdictional loop nagged at her. The Court ruled based on the amendment. If she refused to publish the amendment as active, the Court's ruling was void. If the Court's ruling was void, her refusal was legally supported. But if she published it, the Court's ruling was valid, supporting her publication.

  It required a leap. A faith that the system would hold even if the logic didn't.

  She looked at the date column. *Year 104 of the Republic.*

  If she wrote *Year 129*, she was safe. She was a clerk following orders.
  If she wrote *Year 104*, she was a founder. She was closing the loop.

  Marenya needed the reforms. The water systems were failing. The trade tariffs were strangling the ports. Waiting twenty-five years meant watching the country rot to preserve a logical purity that the founders themselves hadn't understood.

  The paradox wasn't a puzzle to be solved. It was a knot to be cut.

  Elara moved the book closer. She aligned the nib with the line for Bill 909.

  She didn't hesitate. Hesitation was the delay.

  She wrote the date. *Year 104.*

  Then she moved to the status column. *Active.*

  She blew on the ink to dry it. She took the heavy seal from the drawer, the one with the Republic's crest, and pressed it into the wax pool she had melted minutes before. She slammed it down.

  The wax cracked as it cooled. She lifted the seal. The crest was clear.

  There was no flash of light. No sound. The room remained quiet. The dust motes danced in the shaft of light from the window. The Constitution had not changed physically. The paper was the same. The ink was the same.

  But now, when Thorne walked back in, the book would say what he needed it to say. The Court's order would be valid. The delay was gone. The next generation would be this one, and the one after that, until they finally died.

  Elara capped the pen. She closed the book. She stood up and waited for the door to open.
