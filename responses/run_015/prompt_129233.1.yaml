      *   **The Infant Analogy:** This is a classic point in the literature (e.g., Smith, Goodin). If infants count because of *future* agency or *current* interests represented by guardians, why not animals (current interests represented by guardians)? The student asserts infants are "potential agents" and animals aren't, but doesn't explain why *potentiality* matters for *current* climate harm.
