          3.  **Assess the Conclusion (RPA):** Does Rietdijk–Putnam prove eternalism on its own? Does it need extra premises (existence/co-reality, parity of frames, transitivity) that the loaf metaphor was smuggling in?
          4.  **Alternative Picture:** If the loaf is wrong, is there a better one? What does it reveal/conceal?

  2.  **Task 1: Audit the Picture (Table of Correspondences):**

