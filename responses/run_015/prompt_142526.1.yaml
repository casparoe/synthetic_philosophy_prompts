      *   *Feature 1: The Axis.* A loaf has a intrinsic geometric long axis. Minkowski spacetime does *not* have a privileged time axis (Lorentz invariance).
          *   *Status:* Critical. If the loaf implies a "true" time direction, it contradicts SR.
      *   *Feature 2: The Knife's Motion.* Cutting takes time in the kitchen. In the block, "motion" of the now is either illusory (static block) or requires a 5th dimension (meta-time).
          *   *Status:* Critical. It confuses the representation of passage with passage itself.
      *   *Feature 3: Existence of Slices.* All slices of a loaf exist physically at once. Do all spacetime slices exist "at once"? (This is the question at issue).
          *   *Status:* Critical. This begs the question of eternalism.
      *   *Feature 4: Cutting Angle.* You can cut a loaf at angles. In SR, you can slice at angles (boosts), but there's a limit (light cone). You can't cut "spacelike" slices steeper than 45 degrees.
