answer: |-
  To ground your tagging procedure in the political theory you have studied while respecting the practical constraints of your internship, you must prioritize the equality criterion defended by Bobbio alongside the skeptical coalition view, while discarding tests that rely on historical counterfactuals or transient enemy cues. The core distinction that must survive simplification is the attitude toward equality versus hierarchy, as this provides the normative spine for the left-right axis, but you must overlay this with the empirical reality that in the American context, left and right function as stable dispositional orientations that cluster specific policy preferences. Therefore, your procedure should begin by asking whether the policy item is a valence issue where no significant political coalition opposes the stated goal, such as reducing crime or improving health, because if an item lacks organized opposition it cannot be left or right and must be marked as off-axis or dropped. If the item clears this first hurdle, you must then apply the equality test by asking whether the policy reduces material or social inequality or instead accepts hierarchy as natural or necessary, keeping in mind that proposals framed as protective often mask hierarchical outcomes. If the equality impact is ambiguous or depends entirely on contested empirical claims about how the policy functions in practice, you must stop and hand the decision to your faculty advisor, because resolving whether a measure is genuinely protective or authoritarian is a question of values and expert interpretation rather than a fact you can determine in fifteen minutes. Assuming the equality impact is clear, you then apply the blind-pairing test to see if knowing a person's stance on this new item predicts their stance on existing bank items better than chance, which validates whether the issue aligns with the psychological dispositional orientation that currently holds the coalition together. If the item splits both existing coalitions or aligns more strongly with a second axis such as authoritarian versus libertarian, it should be tagged as cross-cutting, but if it aligns cleanly with one side on both the equality and predictive tests, it receives that side's tag.

  Regarding the three tests you have been using, you should discard the time-machine test entirely because it requires historical knowledge your team does not have and relies on counterfactuals that are theoretically interesting but operationally useless for coding current news items. You should also treat the enemy test with extreme caution or drop it, because identifying who is attacking a measure often captures populist signaling rather than principled opposition, and in a polarized environment both sides may attack a proposal for different reasons that confuse the coding. The blind-pairing test is the only one that tracks what actually holds a side together in the present moment, as it measures the psychological and coalitional stability of the position rather than inheriting whatever coalition happens to exist based on transient elite cues. You must recognize that the procedure stops with a no when an item fails the valence check because everyone supports it, and it stops with a hand-off to your advisor when the framing of the policy is contested such that one side describes it as expanding equality and the other as enforcing order, since you cannot arbitrate that dispute without research budget or expertise. It is also crucial to acknowledge that if your working assumption is that the axis describes current American coalitions, then the procedure will inevitably produce tags that are US-centric, and you should not soften this fact for your users because the left-right distinction does not map cleanly across nations and pretending otherwise will lead to the exact parent complaints you are trying to avoid.

  Running this procedure on your first live item regarding eliminating single-family-only zoning near transit stations reveals a complex case where the equality criterion suggests a left coding because increasing housing supply near transit generally promotes economic integration and access, but the blind-pairing test indicates a cross-cutting tag because the issue currently splits the democratic coalition between urban progressives concerned with displacement and YIMBY advocates focused on supply. Since the item divides the side that typically favors equality-enhancing measures, and because property rights arguments used by opponents are traditionally right-coded while environmental preservation arguments used by some opponents are left-coded, this item should be marked cross-cutting rather than forced onto the main axis, and you should note that this reflects a realignment in progress rather than a stable coalition position. For the second item requiring developers of frontier AI systems to obtain a license before training runs, the equality test yields no clear result because the issue is not primarily about distribution but about safety and innovation, and the blind-pairing test shows weak predictive power regarding existing left-right items since libertarians and progressives may align on safety while technocrats and populists align on opposition. This item should be tagged as off-axis or cross-cutting because it belongs to a emerging dimension of governance that does not fit the traditional hierarchy versus equality framework, and forcing it onto the left-right axis would distort the meaning of your bank. For the third item requiring photographic identification to vote, the procedure delivers a straightforward right coding that you should maintain despite complaints, because the equality criterion clearly identifies voter ID as a hierarchy-enforcing measure that restricts access to a public good, and the blind-pairing test confirms that support for this item predicts other right-coded positions with high accuracy. You must be direct with your users that this item is contested not because the coding is wrong, but because the opposition frames it as a valence issue of election security while the theoretical procedure identifies it as a barrier to equality, and if your handbook assumes the axis describes American coalitions then this is definitively a right-coded position regardless of whether other democracies handle it differently.

  You must be honest about what the procedure cannot do, which includes resolving items where the equality impact is theoretically ambiguous or where the coalitional alignment is in active flux, and for these cases you should expect arbitrariness that can only be managed by regular review rather than perfect coding. You should re-code the bank once per academic year or whenever a major election signals a party realignment, because the blind-pairing test relies on current coalitional stability which degrades over time. When your co-interns reach different tags, you should not average their decisions but instead treat disagreement as a signal that the item is cross-cutting or requires advisor review, since inter-rater reliability below a certain threshold indicates the issue does not pick out a real distinction for your users. Finally, you must accept that your item set will fail a cross-national check because the American left-right distinction is a specific historical artifact that bundles issues differently than in Europe or Asia, and acknowledging this in your handbook will protect you from emails claiming universal validity where none exists. The goal of your tool is not to reveal metaphysical truths about political philosophy but to help students map the actual landscape of American political conflict, and a procedure grounded in Bobbio's equality criterion validated by current coalitional data is the most robust way to achieve that without overclaiming.
