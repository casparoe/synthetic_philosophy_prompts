answer: |-
  # PREP SHEET: Q&A STRATEGY
  **Seminar:** Invention in Historical Fiction
  **Speaker:** Novelist/Screenwriter
  **Subject:** Ethical framework for dramatising deceased relatives (Great-Aunt)

  ## I. THE OPENING CONCESSIONS (First 2 Minutes)
  *Do not wait for these to be raised. Offer them in your closing remarks to disarm the room.*

  1.  **The Diary Handwriting:** Explicitly acknowledge that showing invented diary extracts in her handwriting is the point of greatest tension with your own "Counterfeit-evidence prohibition." State clearly: *"I know this looks like forgery. My defence rests entirely on whether the visual texture marks it as subjective memory rather than objective record."*
  2.  **The Family Fracture:** Acknowledge the Great-Uncle's presence and pain without asking for his validation. *"I am aware that for some in this room, specifically family, this work feels like a breach of trust. I do not expect my ethical framework to resolve that pain, only to account for it."*

  ## II. THE EIGHT OBJECTIONS
  *Ranked by damage to your argument's credibility in this room.*

  ### 1. The Archivist/Biographer (The Contradiction)
  **Objection:** "You establish a 'counterfeit-evidence prohibition' against fabricated diaries shown as archival. Yet you admit to showing invented diary extracts in her handwriting on screen. Is this not simply a visual lie? If the audience sees handwriting, they see a document. You are breaking your own primary rule."
  **Reply (90s):** "The rule prohibits presenting invention as *record*. A TV drama is not an archive; it is a stream of subjective perspective. If the handwriting appears during a moment of internal monologue or unreliable narration, it functions as psychological texture, not evidentiary claim. The 'Revisability Condition' requires we mark the seam; in film, that marking is done through context, not a caption. If the viewer understands they are inside a character's mind, not a museum cabinet, it is not a counterfeit record."
  **Concede:** That visual handwriting carries an inherent authority that text does not.
  **Soft Spot:** If the shot is lit/framed like an archival insert rather than a subjective POV, the distinction collapses.

  ### 2. The Moral Philosopher (The Coherence)
  **Objection:** "You claim we owe the dead 'answerability'. But answerability implies a dialogue. The dead cannot answer. Are you not smuggling in a duty to the *living* audience while pretending it's a duty to the subject? If so, your framing is misleading."
  **Reply (90s):** "It is not a dialogue with the dead, but a stewardship of the voice we have borrowed. When we animate a historical person, we temporarily prevent the real person from being the only source of truth about themselves. We owe it to the *concept* of that person to ensure the portrayal remains contestable. It is a duty to the historical record, using the dead as the placeholder for truth. If we treat their voice as unanswerable property, we turn history into mythology."
  **Concede:** That "answerability" is a metaphor, not a literal transaction.
  **Soft Spot:** If pressed on why the dead need stewardship if they cannot experience harm.

  ### 3. The Great-Uncle (The Betrayal)
  **Objection:** "You say you didn't know her. You are dramatising nine months of her life based on papers she asked to be burnt. You are calling this 'answerability', but it looks like profiting from a secret she wanted kept. How is this not disloyal?"
  **Reply (90s):** "It is disloyal to the silence the family maintained. I accept that. But the letters revealed a truth that shaped three generations of silence. My argument is that a wish to be forgotten is part of the history, not a veto on it. If I only told the story you approved of, it would be a eulogy, not a drama. I am trying to honour the complexity of her life, even where that complexity causes pain."
  **Concede:** That the work causes pain and that you did not know her personally.
  **Soft Spot:** You cannot argue away his grief; any intellectualising of it will sound cold.

  ### 4. The Media Lawyer (The Liability)
  **Objection:** "Forget the dead. You have living relatives. You are using copyrighted letters. You are depicting a fraud conviction. If the drama implies living relatives knew about the fraud, that's malicious falsehood. What is your clearance position?"
  **Reply (90s):** "Copyright in the letters is being cleared through the estate. Regarding the living, the drama is strictly confined to the Aunt's actions in 1963. No living relative is depicted as complicit. The 'Revisability Condition' protects us here too: by marking the fiction, we distance the work from claims of factual assertion about the living. We are not presenting this as biography, but as drama *based on* biography."
  **Concede:** That legal clearance is a separate, practical hurdle from the ethical one.
  **Soft Spot:** If the "based on" disclaimer is deemed insufficient for defamation of living associates.

  ### 5. The Biographer (The Compression)
  **Objection:** "You say selection distorts. You compressed a decade into a year. That creates causal links that didn't exist. Isn't that more dishonest than inventing a diary entry?"
  **Reply (90s):** "Compression is the grammar of drama; without it, there is no narrative. But you are right: it distorts. That is why the 'Revisability Condition' demands visible selection. We do not hide the compression. We use title cards, structural breaks, or dialogue that acknowledges the passage of time. Invention hides the mechanism; compression, if marked, reveals the mechanism. One lies about the evidence, the other admits the limitation of the medium."
  **Concede:** That compression creates false causality.
  **Soft Spot:** If the compression is not visibly marked in the script itself.

  ### 6. The Cousin (The Family Veto)
  **Objection:** "You say 'answerability' isn't a family veto. But we are the ones left with the fallout. Why should a stranger's 'right to revise' outweigh the family's right to privacy?"
  **Reply (90s):** "Because once the letters exist in an archive, they enter the public sphere of history. The family's right to privacy battles the public's right to understand the past. My framework tries to balance this. I am not asking you to like it. I am asking that the work itself contains the tools for you to argue against it. If I hide the invention, you have no ammunition. If I show the seams, you can fight back. That is the only power I can give you."
  **Concede:** That the family bears the social cost of the story.
  **Soft Spot:** It sounds cold to offer "ammunition" as a substitute for consent.

  ### 7. The Archivist (The Gimmick)
  **Objection:** "Marking invention with visual cues is naive. Audiences don't read 'texture'. They see period drama, they believe it. Your 'Revisability Condition' relies on viewer literacy that doesn't exist."
  **Reply (90s):** "That is a cynical view of the audience. Viewers understand dreams, flashbacks, and unreliable narrators. They understand when a film is lying to them for effect. If we treat the audience as passive consumers who cannot distinguish memory from record, we justify any manipulation. I am betting on the audience's intelligence. If the texture is distinct enough, they will know they are in a subjective space."
  **Concede:** That some viewers will miss the cues.
  **Soft Spot:** Empirical evidence suggests most audiences do conflate drama with documentary.

  ### 8. The General Audience (The Motivation)
  **Objection:** "Why this story? Why not a fictional character? Is it because the fraud gives it a hook? Isn't using a real victim of silence just exploitative?"
  **Reply (90s):** "Because the silence *is* the story. A fictional character's fraud is a plot point. My Aunt's fraud was a generational secret that altered how my mother raised me. To fictionalise it would be to hide the cost. The exploitation risk is real, which is why the ethical framework is necessary. I am not using her life; I am interrogating why we hid it."
  **Concede:** That there is a risk of exploitation.
  **Soft Spot:** If the drama turns out to be sensationalist despite the framework.

  ## III. STRATEGIC PRIORITIES

  **Constituency with Genuine Force:**
  **The Archivist/Biographer.**
  *Reason:* They hold the keys to "evidence." If they determine your "fake diary" violates the core tenets of historical integrity, your theoretical framework collapses as hypocritical. The Lawyer can be paid off; the Son can be estranged; but if the academics reject your methodology, the paper fails.

  **The Single Reply That Must Land:**
  **Objection #1 (The Diary Handwriting).**
  *Reason:* You must successfully distinguish between "Archival Record" and "Subjective Texture." If you cannot convince the room that showing fake handwriting is *not* a counterfeit document, your "Counterfeit-evidence prohibition" is void, and you are just another dramatist making things up.

  **The Question You Hope Nobody Asks:**
  **"You admit you opened an envelope marked 'to be burnt unread'. If you violated her express instruction regarding the evidence itself, on what moral ground do you stand to claim you are acting with 'answerability' to her now?"**
  *Why:* This attacks your personal integrity rather than your artistic method. It suggests your entire ethical framework is post-rationalisation for a breach of trust you committed the moment you opened the box. There is no good reply to this other than a raw admission of guilt.

  ## IV. FINAL NOTE
  **Tone:** Do not be defensive. Be penitent but resolute. You are arguing for a *better kind of trespass*, not a right to trespass. Acknowledge that the Great-Uncle's pain is the cost of the work, not a problem to be solved. If you try to "win" him over in the Q&A, you will look manipulative. If you acknowledge his loss, you look ethical.
