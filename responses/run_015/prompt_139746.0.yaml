answer: |-
  **Joint Statement on Phenomenal Status**

  **I. Agreed Claims**

  1.  **Introspective Data:** We agree that subjects make introspective judgments possessing a peculiar first-personal feel. These judgments are predictably responsive to sensory intervention, occur in degrees of confidence, and constitute the primary data any theory must accommodate.
  2.  **Thin vs. Thick Distinction:** We distinguish the *thin* claim ("there is something it is like to be us; experience presents a character") from the *thick* claim ("that character consists of ineffable, intrinsic, private, directly apprehensible properties"). We agree the hallucination argument targets the *thick* claim. We disagree on whether the *thin* claim entails the *thick*.
  3.  **Primary Argumentative Load:** We agree the Explanatory Gap (the no-explanation argument) is the central engine of this dispute. Arguments from hallucination or specification are secondary unless they reinforce the gap.
  4.  **Non-Commitments:** The Realist is not committed to substance dualism or non-physical causation. The Illusionist is not committed to denying behavior, reportability, or the functional utility of introspective mechanisms.
  5.  **Error Conditions:** We agree that if introspective judgments are erroneous, there must be an account of how error is possible without presupposing the existence of the judged property (the Error Parity problem).

  **II. Disagreements**

  | Issue | Realist Formulation | Illusionist Formulation | Status (Drafter's Diagnosis) |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Experience** | The thin claim is true only if the thick claim is true. The "residue" left by physical explanation is a real, non-functional property. | The thin claim is true, but the thick claim is false. The "residue" is a cognitive artifact; there are no phenomenal properties, only introspective seemings. | **Substantive.** Disagreement on whether "seeming" requires a property that seems. |
  | **Introspective Error** | Error regarding qualia is impossible in the standard case; introspection is constitutive of the property. | Introspection is a fallible cognitive process. We can be wrong about our experience just as we are wrong about color (global error theory). | **Substantive.** The color analogy is load-bearing for the Illusionist to solve Error Parity. |
  | **The "Schmen" Case** | If reports track variance unexplained by function/neurology, this confirms non-physical properties exist and are tracked by the subsystem. | If reports track variance unexplained by function/neurology, this confirms a dissociable reporting module generating false signals (a deeper illusion). | **Substantive.** Differing predictions on the nature of the subsystem's output. |

  **III. Cruxes and Predictions**

  **Crux 1: The Metaphysics of Seeming**
  *Sub-question:* Does the fact that experience *seems* to have intrinsic properties entail that it *has* intrinsic properties?
  *Agreed Case:* The Phenomenal Concept Strategy. Both agree that possessing a concept of experience involves deploying it in a unique way.
  *Predictions:*
  *   **Realist:** Predicts that analyzing phenomenal concepts will reveal they refer to distinct properties irreducible to physical states. The concept tracks the residue.
  *   **Illusionist:** Predicts that analyzing phenomenal concepts will reveal they are misrepresentational vehicles. The concept creates the illusion of the residue.

  **Crux 2: The Schmen Scenario**
  *Sub-question:* Can a subsystem report experiential variance without functional/neural variance?
  *Agreed Case:* A future cognitive science discovers "Schmen" subjects. A specific subsystem predicts reports of a dimension varying while all functional/neural discriminables remain fixed. Lesioning removes reports and the disposition to draw the distinction. Cross-wiring makes subjects report each other's history.
  *Predictions:*
  *   **Realist:** Predicts the subsystem is a *detector*. It tracks a non-functional property. Cross-wiring transfers access to the property. The variance is real.
  *   **Illusionist:** Predicts the subsystem is a *generator*. It produces reports without a property. Cross-wiring transfers the disposition to hallucinate. The variance is noise.

  **Drafter's Diagnosis on Verbal vs. Substantive**
  Much of this dispute is verbal regarding the label "qualia." If the Realist defines qualia as "whatever the thin claim points to," and the Illusionist defines it as "the thick claim's impossible properties," they talk past each other. However, the dispute becomes substantive regarding the **Error Parity**. The Illusionist's reliance on a global error theory (like color eliminativism) is not a distraction; it is load-bearing. Without it, they cannot explain how introspection is "wrong" without admitting facts about qualia exist to be wrong about. The Realist correctly identifies that standard error presupposes truth conditions. Therefore, the core substantive fight is not about whether experience feels a certain way (both agree it does), but whether that feeling constitutes a factual property or a systematic cognitive misfiring. The Schmen case is the empirical arbiter: if the variance is truly non-functional, Functionalism fails. If the variance is merely unmeasured functional noise, Illusionism holds. We are not verbal all the way down; we are stuck on the metaphysics of the "seeming."
