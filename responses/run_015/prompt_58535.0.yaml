answer: |-
  This is a classic and subtle problem in normative ethics. The difficulty you are facing stems from the fact that supererogatory acts and non-morally admirable acts often look identical from the outside: both involve sacrifice, both benefit others, and both are optional. The distinction lies not in the *structure* of the action, but in the *source of its value*.

  Supererogatory acts derive their value from **moral goods** (e.g., welfare, justice, rights, alleviation of suffering). Non-morally admirable acts derive their value from **non-moral goods** (e.g., beauty, efficiency, skill, entertainment, etiquette).

  Below are two examples featuring the same protagonist, **Taylor**, set in university life. In both cases, Taylor incurs a similar personal cost (time and missed leisure) to provide a similar benefit to a peer (helping them succeed at a task).

  ### The Protagonist and Context
  **Taylor** is a second-year student. It is Friday night, and there is a popular end-of-term mixer that Taylor really wants to attend. Taylor's classmate, **Morgan**, asks for help with a project. Helping will take three hours, meaning Taylor will miss the mixer in both scenarios.

  ---

  ### Example 1: The Supererogatory Act (Moral Value)
  **Scenario:** Morgan is a first-year student on academic probation. If Morgan fails a critical reassessment exam on Monday, they will be expelled from the university and lose their student visa. Morgan is panicking and cannot afford a tutor. Taylor spends Friday night quizzing Morgan and explaining difficult concepts to ensure they pass.

  #### Analysis Against the Characterisation
  1.  **Neither required nor forbidden:** Taylor has no duty to tutor Morgan. Taylor is not responsible for Morgan's academic standing. It is not morally forbidden to go to the mixer.
  2.  **Morally good and praiseworthy:** The act promotes Morgan's **welfare** and future livelihood. It alleviates significant distress. We praise Taylor for their *generosity* and *compassion*.
  3.  **Omission is permissible and blameless:** If Taylor goes to the mixer instead, Taylor has not violated any moral rule. Morgan cannot rightfully blame Taylor for the failure.
  4.  **The "Morally Worse" Distinction:** If Taylor omits this act, the outcome is **morally worse** than if Taylor performs it. This is because the world contains less overall welfare and more preventable suffering. Taylor's omission leaves a "moral residue"—a sense that while Taylor did nothing *wrong*, the situation is morally poorer than it could have been.

  ---

  ### Example 2: The Non-Morally Admirable Act (Non-Moral Value)
  **Scenario:** Morgan is the captain of the university's trivia team. They are competing in a national pub quiz championship on Saturday morning. Morgan wants to win to secure prestige for the club. Morgan asks Taylor to spend Friday night memorizing obscure historical dates to quiz Morgan. Taylor spends the night doing this, helping Morgan sharpen their recall speed.

  #### Analysis Against the Characterisation
  1.  **Neither required nor forbidden:** Taylor has no duty to help Morgan train for a game. It is not forbidden to skip the training.
  2.  **Admirable but not *morally* good:** The act is **generous** and demonstrates **loyalty**, but the end goal (winning a trivia contest) is a matter of **skill and entertainment**, not moral welfare. We praise Taylor for being a *good sport* or a *dedicated friend*, but not for being *virtuous* in the ethical sense.
  3.  **Omission is permissible and blameless:** If Taylor goes to the mixer, Morgan cannot rightfully blame Taylor. Taylor owes Morgan nothing regarding the quiz.
  4.  **The "Morally Worse" Distinction:** If Taylor omits this act, the outcome is **not morally worse**. The world does not contain more suffering or less justice. The outcome is merely *less impressive* or *less fun*. The "loss" is aesthetic or recreational, not moral.

  ---

  ### Comparative Explanation: Why the Omission Differs

  The crux of your tutor's characterization lies in the phrase **"morally good to perform."** This is the filter that separates the two examples.

  **1. The Source of the Benefit**
  In **Example 1**, the benefit to Morgan is tied to their **well-being** (avoiding expulsion, keeping a visa). In normative ethics, actions that protect or enhance well-being fall within the moral domain. Therefore, the "goodness" of Taylor's action is *moral goodness*.
  In **Example 2**, the benefit to Morgan is tied to **excellence/prestige** (winning a game). While winning is "good" for Morgan in a prudential or competitive sense, it does not impact their fundamental welfare or rights. Therefore, the "goodness" of Taylor's action is *non-moral goodness* (like being stylish or efficient).

  **2. The Status of the Omission**
  This explains why failing to perform Example 1 is "morally worse" while failing to perform Example 2 is not.

  *   **Omission of Example 1:** When Taylor chooses the mixer over the tutoring, Taylor has chosen a trivial pleasure over a significant moral good (Morgan's welfare). While Taylor is within their rights to do so (hence, no blame), the *state of affairs* is morally inferior. There is a net loss of moral value in the universe. We might feel a pang of regret that Taylor didn't help, acknowledging a moral opportunity missed.
  *   **Omission of Example 2:** When Taylor chooses the mixer over the quiz training, Taylor has chosen a trivial pleasure over a non-moral good (winning a trophy). The *state of affairs* is not morally inferior. No welfare was compromised. We might feel disappointment that the team might lose, but this is the disappointment of a fan, not the regret of a moral observer.

  **Summary Table**

  | Feature | Example 1 (Tutoring for Exam) | Example 2 (Training for Quiz) |
  | :--- | :--- | :--- |
  | **Cost to Agent** | High (Missed social event, time) | High (Missed social event, time) |
  | **Benefit to Other** | High (Academic survival/Visa) | High (Prestige/Victory) |
  | **Type of Value** | **Moral** (Welfare/Rights) | **Non-Moral** (Skill/Entertainment) |
  | **Is Omission Blameless?** | Yes | Yes |
  | **Is Omission Morally Worse?** | **Yes** (Less moral value in world) | **No** (Same moral value, less fun) |

  By keeping the costs and the "helpfulness" constant, you can see that the only variable changing is the *nature of the good* being promoted. Supererogation requires the promotion of a **moral** good beyond the call of duty. Admirability without supererogation involves the promotion of a **non-moral** good beyond the call of duty.
