prompt: |-
  everyone in my metaphysics reading group keeps saying the statue and clay are like a person and their body -- same matter, diffrent properties, diffrent ways of stickin around. they use it to argue for constitution-not-identity: the statue gets destroyed by squishing but the clay survives, just like you survive a haircut. i want to push back using temporary intrinsics -- if the clay gets bent, is the statue bent in its own right or only derivatively? can you audit the person/body analogy for the statue case: give me the mapping table, where it breaks especially around temporary properties and destruction conditions, and whether the analogy is actually carrying the argument or just smuggling in our intuition that bodies are more real than artworks. there's also this hylomorphist idea where form is just a structural relation and not some extra part -- if you inject that, does it change how the analogy works, or does it collapse the statue back into being just the clay arranged statue-wise?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A metaphysics reading group discussing the Statue/Clay paradox (co-location, constitution vs. identity).
      *   **Current Argument:** The group uses the Person/Body analogy to support *Constitution-Not-Identity* (CNI). They claim Statue $\neq$ Clay just as Person $\neq$ Body. Both share matter but have different persistence conditions (Statue destroyed by squishing, Clay survives; Person survives haircut, Body changes).
      *   **User's Goal:** Push back on this analogy.
      *   **Specific Tools/Concepts:**
          *   Temporary Intrinsics (Lewis-style problem).
          *   Mapping Table (Statue/Clay vs. Person/Body).
          *   Breakdown points (temporary properties, destruction conditions).
          *   Suspicion of bias (smuggling in intuition that bodies > artworks).
          *   Hylomorphism (Form as structural relation vs. extra part).
      *   **Desired Output:** An audit of the analogy, highlighting where it breaks, addressing the temporary intrinsics objection, and evaluating the impact of hylomorphism.

  2.  **Deconstruct the Person/Body Analogy for CNI:**
      *   *Standard View:* Person = constituted by Body.
      *   *Statue/Clay View:* Statue = constituted by Clay.
      *   *The Claim:* Just as I am not identical to my body (I could lose a limb, or survive brain upload, etc.), the Statue is not identical to the Clay (Clay could be squished, Statue ceases).
      *   *The User's Pushback:* Temporary intrinsics. If the clay bends, does the statue bend? If the body bends, does the person bend?

  3.  **Drafting the Mapping Table:**
      *   Need to compare the relata: Statue (S), Clay (C), Person (P), Body (B).
      *   Need to compare properties: Modal (persistence), Temporary (shape/location), Causal.
      *   *Mapping:*
          *   S : C :: P : B
          *   Squishing C destroys S but not C :: Cutting B (hair/limb) changes B but P survives? (Wait, this is where the analogy gets tricky).
          *   Actually, the group's argument is: Squishing Clay destroys Statue (S $\neq$ C). Haircut changes Body but Person survives (P $\neq$ B).
      *   *Critique:* The persistence conditions aren't parallel. Squishing is *destructive* for the Statue. Haircut is *non-destructive* for the Person. But is Haircut destructive for the Body? Technically, the body loses matter. So Body changes, Person persists. Clay changes (shape), Statue ceases.
      *   *Disanalogy:* The Statue is *defined* by the shape. The Person is (arguably) *not* defined by the body's shape.

  4.  **Addressing Temporary Intrinsics:**
      *   *Lewis's Problem:* How can one object have shape $F$ at $t_1$ and shape $\neg F$ at $t_2$?
      *   *User's Angle:* If Clay is bent at $t$, is Statue bent?
      *   *CNI Response:* Statue has property "bent" derivatively. Clay has it fundamentally.
      *   *Problem:* If Statue is distinct from Clay, why does it inherit the shape? If it doesn't inherit it, how do we see it? If it does, are they really distinct in the way Person/Body are?
      *   *Person/Body:* If my body is bent (I curl up), am I bent? Yes. Do I have the property derivatively? Or do I have it directly? If P $\neq$ B, and B is bent, is P bent? Usually, we say P is bent *in virtue of* B being bent.
      *   *The Break:* With Person/Body, we accept P inherits spatial properties from B. With Statue/Clay, if S inherits *all* spatial properties from C, S looks like a logical shadow of C. But if S *doesn't* inherit the "squished" property (because it ceases to exist), the modal profiles diverge sharply.

  5.  **Auditing the "Smuggling Intuition" Charge:**
      *   The group assumes Person/Body is a clear case of CNI. Is it?
      *   Materialists might say P = B (or P = Brain).
      *   Dualists might say P is immaterial.
      *   If P = B, the analogy fails immediately.
      *   If P $\neq$ B, is it because of *matter* or *function*?
      *   Artworks are often defined by *intentionality* + *structure*. Bodies are defined by *biology*.
      *   The intuition that "Bodies are more real" might actually be "Matter is more fundamental than Form." The group is using Person/Body to validate Statue/Clay, but Person/Body is *more* controversial than Statue/Clay in some circles.

  6.  **Injecting Hylomorphism:**
      *   *Aristotelian View:* Substance = Matter + Form.
      *   *Form:* Not a part, but the organization/actualization.
      *   *Statue:* Clay (Matter) + Statue-Shape/Function (Form).
      *   *Person:* Body (Matter) + Soul/Rationality (Form).
      *   *Impact on Analogy:*
          *   If Form is just structure: Statue is just Clay-arranged-statue-wise. This leans toward *Identity* (or Deflationism). If Statue = Clay arranged thusly, then when arrangement stops, Statue stops. But is it a *new object*?
          *   Hylomorphism often supports CNI (The compound is distinct from the matter).
          *   But if Form is *just* a relation, does it ground a distinct *substance*?
          *   *Collapse:* If Form is merely structural, the Statue might collapse into a "phase sortal" of the Clay. The Person/Body analogy might break because Persons are often seen as *unified substances* in a way Statues are not.

  7.  **Synthesizing the Argument (The "Push Back"):**
      *   *Point 1: The Temporary Intrinsics Mismatch.* In Person/Body, spatial properties are shared directly (I am where my body is). In Statue/Clay, spatial properties are shared until they aren't (Squishing). The "derivative" property explanation is ad hoc for statues but intuitive for persons.
      *   *Point 2: The Persistence Condition Asymmetry.* Haircut = Body changes, Person stays. Squish = Clay changes, Statue dies. The *direction* of dependence is different. The Person seems to *govern* the Body's persistence (in some views), whereas the Clay *governs* the Statue's existence (Statue is fragile).
      *   *Point 3: The Ontological Weight.* We care more about Persons surviving than Statues. The analogy borrows the moral/metaphysical weight of Personhood to bolster the ontological status of Statues.
      *   *Point 4: Hylomorphic Injection.* If Form is structural, Statue is a phase of Clay. Person is (arguably) not a phase of Body. This breaks the analogy.

  8.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the strength of the user's intuition (Temporary Intrinsics is a classic wedge).
      *   **The Mapping Table:** Visual comparison of properties.
      *   **The Break Points:** Specifically on Temporary Intrinsics and Destruction.
      *   **The "Smuggling" Charge:** Analyze the intuition pump.
      *   **The Hylomorphic Twist:** How form-as-structure changes the game.
      *   **Conclusion:** Summary of the counter-argument.

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *Caution:* Don't assume Dualism for Person/Body. Keep it neutral or focus on the Constitution view (Baker, etc.).
      *   *Clarification:* Ensure "Temporary Intrinsics" is used correctly. It's usually about change over time, but here the user is asking about *derivative* properties at a time (is the statue bent *in its own right*?). This touches on the "Problem of Many" or "Grounding" more than Lewis's original time-based problem, but it's related to how distinct objects share properties. I should address the *sharing* aspect.
      *   *Hylomorphism:* Be careful not to conflate Thomistic Soul with Aristotelian Form. Keep it general: Form as organization.

  10. **Final Polish:** Ensure tone is appropriate for a reading group (rigorous but conversational). (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sharp objection. Your group is using the Person/Body case as a "clear intuition pump" to justify the Statue/Clay case, but the Person/Body case is arguably *more* metaphysically loaded and controversial than the Statue/Clay case. By leaning on it, they might be begging the question.

  Here is an audit of the analogy, the mapping table you requested, and an analysis of how temporary intrinsics and hylomorphism disrupt their argument.

  ### 1. The Mapping Table: Person/Body vs. Statue/Clay

  The Constitution-Not-Identity (CNI) view claims: $Person \neq Body$ and $Statue \neq Clay$.
  Let's map the properties to see where the isomorphism holds and where it shears off.

  | Feature | Statue ($S$) / Clay ($C$) | Person ($P$) / Body ($B$) | The Disanalogy |
  | :--- | :--- | :--- | :--- |
  | **Matter** | $C$ constitutes $S$. | $B$ constitutes $P$. | **Match.** Both rely on material constitution. |
  | **Spatial Location** | $S$ and $C$ occupy same space. | $P$ and $B$ occupy same space. | **Match.** Co-location is the starting point. |
  | **Temporary Intrinsics (Shape)** | If $C$ bends, $S$ bends (until it breaks). | If $B$ bends, $P$ bends. | **Tension.** Does $S$ bend *in its own right*? (See below). |
  | **Destruction Condition** | Squish $C \rightarrow$ $S$ ceases, $C$ survives. | Cut hair/limb $\rightarrow$ $P$ survives, $B$ changes. | **Mismatch.** $S$ is *fragile* relative to $C$; $P$ is *robust* relative to $B$. |
  | **Modal Profile** | $S$ cannot survive loss of shape. | $P$ can survive loss of parts (Lockean memory/psych view). | **Mismatch.** $P$'s persistence often tracks *psychology*, $S$'s tracks *shape*. |
  | **Causal Power** | $C$ does the causal lifting (weight, hardness). | $B$ does the causal lifting (biology, physics). | **Match.** Both "higher" objects risk causal exclusion. |
  | **Ontological Status** | $S$ is often viewed as artifactual/conceptual. | $P$ is viewed as a natural kind/substance. | **Mismatch.** $P$ has "more reality" than $S$ intuitively. |

  ### 2. The Temporary Intrinsics Wedge

  Your intuition here is hitting on the **Property Sharing Problem**.

  If $S \neq C$, and $C$ is bent at time $t$, in virtue of what is $S$ bent at $t$?
  *   **Option A (Derivative):** $S$ is bent only because it is constituted by $C$, which is bent.
  *   **Option B (Independent):** $S$ is bent in its own right.

  **The Pushback:**
  If you choose **Option A**, the Statue looks like a "logical shadow" of the Clay. It has no independent physical properties. This weakens the claim that it is a distinct *object* rather than a distinct *concept* applied to the clay.

  If you choose **Option B**, you face a multiplication of properties. We have "Clay-bentness" and "Statue-bentness." Why do they always coincide?

  **Where the Person/Body Analogy Breaks:**
  In the Person/Body case, we are willing to accept that the Person inherits spatial properties from the Body *derivatively* without thinking the Person is less real. Why? Because we grant the Person **psychological properties** that the Body lacks. The Person has a "unique contribution" to the union (consciousness).

  The Statue has no unique contribution. It has no properties the Clay doesn't have, *except* modal properties (persistence conditions) and perhaps aesthetic properties.
  *   **The Audit:** The Person/Body analogy works only if you assume Persons have non-physical or functional properties that Bodies lack. Statues do not have non-clay properties. Therefore, using Person/Body to argue for Statue/Clay smuggles in the idea that Statues have a "substantial form" equivalent to a Person's "psychological continuity." They don't.

  ### 3. Destruction Conditions: The "Squish" vs. The "Haircut"

  Your group argues: *Statue dies when squished (Clay lives) just as Person lives when haircut (Body changes).*

  This is actually a **disanalogy in directionality**.
  *   **Statue/Clay:** The *constituter* (Clay) is more robust than the *constituted* (Statue). The Clay sets the limits.
  *   **Person/Body:** The *constituted* (Person) is often viewed as more robust than the *constituter* (Body). (e.g., Brain transplants, Teletransportation thought experiments).

  In the Statue case, the Clay is the "master" of the matter. In the Person case, the Person is often the "master" of the matter (the body serves the person).
  *   **The Pushback:** If the analogy held, squishing the Clay should be like giving the Person a haircut (a change the Person survives). But it's not. Squishing the Clay is like **killing the Person**.
  *   If Squishing Clay = Killing Person, then:
      *   Clay survives Squish $\approx$ Body survives Death (Corpse).
      *   Statue dies at Squish $\approx$ Person dies at Death.
  *   **Result:** This mapping actually supports **Identity** (or at least, that the Statue is a phase of the Clay just as Life is a phase of the Body). It doesn't support CNI in the way they want. It suggests the Statue is just "Clay-in-a-statue-phase," just as a Person is "Body-in-a-life-phase."

  ### 4. The "Smuggling Intuition" Charge

  You are right to suspect they are smuggling in ontological weight.

  *   **The Intuition Pump:** We feel $Person \neq Body$ because we feel *we* are not just *meat*. We have a strong pre-theoretical commitment to Personhood being special.
  *   **The Transfer:** They want that "specialness" to rub off on Statues. If $Person \neq Body$ is true, then $Statue \neq Clay$ feels more palatable.
  *   **The Reality:** Most materialists accept $Person \neq Body$ only because of *functionalism* or *psychological continuity*. Statues lack psychology. If you strip the Person of psychology (a "human vegetable"), the intuition that $Person \neq Body$ collapses for many people.
  *   **Conclusion:** The analogy borrows credibility from the *psychological* distinctness of Persons to justify the *structural* distinctness of Statues. It is an illicit transfer of ontological status.

  ### 5. Injecting Hylomorphism: Does it Save or Collapse the Analogy?

  Hylomorphism says: Substance = Matter + Form.
  Your group says: Form is just a structural relation (not an extra "part").

  **Scenario A: Form as Structural Relation (Deflationary Hylomorphism)**
  If the "Statue Form" is just *the clay being arranged statue-wise*, then:
  *   The Statue is not a distinct substance; it is the Clay *under a description*.
  *   **Impact on Analogy:** This collapses the Statue back into the Clay (Identity).
  *   **Person/Body:** If Person-Form is just *the body functioning biologically*, then Person = Body (Animalism).
  *   **Result:** If they accept deflationary form for Statues, they must accept Animalism for Persons. If they reject Animalism (claiming $P \neq B$), they cannot consistently claim deflationary form for Statues. They are being inconsistent.

  **Scenario B: Form as Substantial (Robust Hylomorphism)**
  If the Form makes the substance what it is (Aquinas/Aristotle):
  *   The Statue has a substantial form (Artifactual form).
  *   The Person has a substantial form (Rational Soul).
  *   **Impact on Analogy:** This supports CNI ($S \neq C$ and $P \neq B$).
  *   **The Catch:** Aristotelians typically deny that *artifacts* have substantial forms. They have *accidental* forms. Only living things have substantial forms.
  *   **Result:** If they use Hylomorphism to save the analogy, they have to argue Statues are substances in the same way Persons are. This is a huge metaphysical cost. Most Hylomorphists would say: "Person $\neq$ Body (Substance), but Statue = Clay (Substance with accidental arrangement)."
  *   **The Kill Shot:** If you inject Hylomorphism, you likely **break the analogy** because Hylomorphism traditionally grants substantial status to Organisms (Persons) but denies it to Artifacts (Statues).

  ### Summary of Your Counter-Argument

  1.  **Temporary Intrinsics:** The Statue inherits spatial properties derivatively in a way the Person does not (or not solely). The Statue is a "property shadow" of the Clay; the Person is a "functional driver" of the Body.
  2.  **Destruction Mismatch:** Squishing the Clay is analogous to Killing the Person, not cutting their hair. This suggests the Statue is a *phase* of the Clay, not a co-located distinct object.
  3.  **Smuggling:** The analogy relies on the psychological distinctness of Persons to validate the ontological distinctness of Statues, which lack psychology.
  4.  **Hylomorphic Collapse:** If Form is just structure, Statue = Clay (Identity). If Form is substantial, Statues usually don't qualify as substances in Hylomorphism, breaking the parallel with Persons.

  **Suggested Move in Group:**
  Ask them: *"If the Person/Body analogy holds, does that mean the Body survives the Person's death as a Corpse (just as Clay survives the Statue)? If yes, are you an Animalist or a Dualist? And if you're an Animalist, why isn't the Statue just the Clay in a different phase?"*

  This forces them to pick a lane on Personhood that usually undermines the Statue case.
