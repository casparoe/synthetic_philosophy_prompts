      *   Does this collapse the case? No, because KK is a universal principle ($\forall S, \forall p, Kp \rightarrow KKp$). Showing one case (30dB) where it fails refutes the principle. The fact that it holds in *better* cases (20dB) doesn't save the principle. This is a crucial teaching point.

