answer: |-
  The control room smelled of ozone and stale coffee, a scent that had soaked into the cinderblock walls over twenty years. On the far wall, mounted on aluminium rails, was the catchment chart. It was the size of a garage door, divided into a grid of white squares. Each square represented a monitoring station along the river, from the moorland source down to the intake pumps where Elias worked.

  There were no numbers on the chart. There were no words. There were only pictograms, printed in bold, flat colours. A blue droplet stood for water volume. A green fish indicated biological health. A yellow flask represented chemical contaminants. The system was strict: quantity was shown by repetition. One flask meant a trace amount. Five flasks, stacked neatly in the square, meant the limit was breached. It was a language designed to be read across shifts, across languages, and across levels of clearance. A technician, a manager, or a visiting inspector could look at the wall and know the state of the river without decoding a sentence.

  Elias stood before the chart with his handover clipboard. It was 07:00. Miriam was due in ten minutes to take the day shift. Upstream, at Station Four, a chemical warehouse had reported a minor containment breach yesterday evening. The protocol was simple: if Station Four showed flasks, the intake pumps remained locked. If Station Four showed blank, the pumps could run.

  Station Four was blank.

  Elias frowned. He tapped the white square with a knuckle. The paint was cool. There was no yellow flask. There was nothing.

  Miriam arrived, shaking rain from her umbrella. She hung it on the rack and walked to the wall, standing beside him. She didn't ask what had happened; she looked at the grid. Her eyes moved from Station One, which showed three blue droplets, down to Station Four. She stopped at the white space.

  "The sample was logged," Elias said. He knew the sampler had cycles. He knew the telemetry had transmitted. But the charting system, automated and rigid, printed a flask only if the concentration exceeded the threshold. If the result was zero, or if the result was below the detection limit, or if the telemetry packet arrived empty, the printer placed nothing. The absence of a mark was the mark of absence.

  Miriam folded her arms. "Below limit?"

  "Or zero," Elias said.

  "Or the sampler choked on silt and sent nothing."

  They stood in the silence of the room. The hum of the servers was the only sound. This was the trouble with the picture language. It was excellent at showing presence. A flood of flasks was undeniable. But the system had no icon for 'nothing found because nothing was there' that was distinct from 'nothing found because nothing was seen'. In a system where quantity is counted by repetition, zero is the absence of repetition. But absence is also the state of a missing record.

  The decision hung on the distinction. If the water was truly clean, the town needed pressure in the pipes. If the water was untested because the sampler failed, running the pumps risked drawing untreated chemical runoff into the supply. The chart offered no distinction. It showed a blank square. To the eye, a safe zero and a dangerous void were identical.

  Miriam reached into her pocket and took out a permanent marker. She capped it with her thumb. "If I put a cross in the box, it means 'failed sample'."

  "That's a word," Elias said. "A cross isn't a picture of a broken sampler."

  "It's a convention," she said. "Like a stop sign. It's not a picture of a hand; it's an agreement."

  "We don't have a convention for that on the wall. The wall is for the public liaison team. They don't know our codes."

  "They need to know if the water is safe," Miriam said. "Right now, this wall tells them everything is fine because there are no warnings. But we don't know that."

  Elias looked at the blank square. It felt heavy. The philosophy of the chart was that pictures unite; they bypassed the confusion of prose. But here, the picture language had failed to speak. It had fallen silent, and silence was ambiguous. To fix it, they had to introduce a sign that functioned not as an image of the thing, but as a rule agreed between people. It was an admission that the picture language was not self-standing. It was a tool that required maintenance.

  "We can't change the printout," Elias said. "The software won't print a 'null' icon."

  "Then we mark it manually." Miriam uncapped the pen. "A dot. Bottom right corner. Means 'below detection, sample taken'."

  "And if it's missing?"

  "A circle."

  "That's two new signs."

  "It's two words," Miriam corrected. "We are writing on the picture."

  She hesitated. The pen hovered over the laminate. Adding the mark would solve the immediate problem, but it degraded the purity of the system. The chart was supposed to be universal. Once they started adding manual conventions, it became a local dialect. It required training. A new inspector wouldn't know the dot. They would have to be told. The picture no longer spoke for itself; it required a footnote.

  Elias thought of the ship metaphor he'd once heard in a training seminar, though he couldn't recall the source. You repair the planks while you sail. You don't dock the ship to rebuild it from the keel up. The chart was the ship. They were at sea.

  "Do it," Elias said.

  Miriam placed a small black dot in the corner of Station Four. It was insignificant against the white space, yet it changed the meaning of the entire square. It transformed the blankness from a void into a statement. It said: *We looked, and saw nothing.*

  "It looks like a mistake," Miriam said, stepping back. "Like a smudge."

  "It's a note," Elias said. "It tells us we have to trust the sample log, not just the wall."

  "And next shift?"

  "We tell them. Then they tell the next."

  It was a fragile solution. It relied on memory and verbal handover, the very things the chart was designed to minimise. But there was no other way. The notation could not express the negative without borrowing from the language of convention. The picture could show the thing, but it could not show the limit of its own vision without ceasing to be purely pictorial.

  Miriam recapped the pen. "We'll need to update the legend."

  "There is no legend," Elias said. "Only the wall."

  "Then we make one."

  "No," Elias said. He looked at the dot, then at the row of yellow flasks at Station Two, which stood clear and loud. "We just remember."

  He turned off the lights in the control room, leaving the chart illuminated by the standby glow. The blank square with the dot sat in the dark, a small repair on a plank that had finally rotted. They would sail on with it until the software was updated, or until the dot became so common it became a symbol itself, losing its meaning and requiring another mark to explain it. For now, it held.

  Miriam sat at the console. "Pumps engaging," she said.

  "Monitor Station Five," Elias replied.

  He walked to the door. He didn't look back at the chart. He trusted the trace on the log sheet more than the picture on the wall, though he would never say it aloud. The picture united them, but the word saved them.

  ***

  **Note**

  The story leans heavily on Neurath's anti-foundationalism (the 'ship at sea' metaphor) and his view of ISOTYPE as a 'helping language' rather than a perfect, self-standing notation. I am confident this characterisation is correct; Neurath explicitly rejected the idea of a perfect logical language (unlike Carnap), emphasising instead the pragmatic, evolving nature of scientific communication.

  I take liberties with the specific application of ISOTYPE to real-time environmental safety data; historically, it was used for social and economic statistics. Regarding the 'collapse of blankness': while ISOTYPE did have conventions for 'zero' (often an empty space or a specific zero-icon depending on the chart type), the user's philosophical point stands that absence is semantically ambiguous without convention. I have assumed here that the specific implementation lacks a distinct 'below detection' icon to highlight the structural difficulty.

  The point about which I am least confident is the attribution of the slogan 'words divide, pictures unite'. While often associated with Neurath and the ISOTYPE institute, it is sometimes considered a simplification of his broader views on international understanding. I have paraphrased the sentiment in the narrative rather than quoting it directly to adhere to your constraints.
