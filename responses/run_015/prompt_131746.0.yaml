  **MEMORANDUM**

  **TO:** Instructional Materials and Technology Committee
  **FROM:** External Advisor, Cognitive Science & Education
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Adaptive Math Platform License

  **Bottom Line Recommendation**
  I recommend the committee **reject the proposed three-year license** at this time. Instead, authorize a **one-year pilot license** contingent on specific redesigns and independent verification metrics. If the vendor cannot meet these conditions within the pilot year, the district should not renew.

  **Rationale: Competence in the Loop vs. Competence in the Learner**
  The pilot data is compelling: standardized scores rose, math anxiety dropped, and participation increased, particularly among students in the lowest quartile. The equity argument for this platform is powerful. For many students, the alternative to this software is not independent struggle, but silence and a lack of feedback. Denying them a tool that produces immediate success feels morally fraught. We must acknowledge that for students currently excluded from mathematical conversation, this platform offers a vital entry point.

  However, our goal is not merely to produce correct answers during software sessions, but to cultivate students who can think mathematically when the screen is off. The current platform creates competence located in the *student-plus-software loop*. It adjusts difficulty and offers hints so quickly that errors are prevented rather than experienced and corrected. This shapes behavior through reinforcement (like training a habit) rather than building internal capacity for hypothesis testing.

  When a system prevents errors, it denies students the data they need to understand *why* a approach failed. More critically, if the software holds the logic of the solution in its hint structure, the student does not internalize the tool. They become dependent on the scaffold. We risk trading short-term equity gains for long-term dependency, creating a ceiling where students can perform only when supported by the very system meant to lift them.

  **Operational Tests for the One-Year Pilot**
  To ensure we are building independent minds rather than optimized loops, approval is conditional on the following metrics being met by the end of the pilot:

  1.  **The "Scaffolding Fade-Out" Test:** A randomized subset of users must be assessed on comparable material with the adaptive hinting and difficulty adjustment **switched off**. Performance in this "cold" condition must not drop significantly below their performance with scaffolding. If mastery vanishes when the hints disappear, the learning has not been internalized.
  2.  **The "Tool Transfer" Requirement:** Each unit must require students to produce a representational tool they can use off-screen (e.g., a specific diagramming method, a notation procedure, or a verification step). Assessment must verify students can deploy these tools on paper without digital prompts. The software must teach them *how to think*, not just *what to click*.

  **Addressing the Equity Concern**
  I urge the committee to feel the full weight of the equity argument. The students who benefit most from this platform are those least served by traditional instruction. To restrict access risks widening the gap we intend to close. However, true equity is not access to a tool that keeps students dependent; it is access to a tool that grants them independence. If this platform creates a permanent need for digital scaffolding, it ultimately disadvantages the very students it claims to help. We must ensure the ladder is removed once they have climbed, not welded to their backs.

  **Reversal Trigger**
  This recommendation should be reversed, and the three-year license approved immediately, if empirical data from the pilot demonstrates that **off-screen standardized test scores rise commensurately with on-screen mastery metrics.** If students using the platform outperform peers on independent, paper-based reasoning tasks despite the lack of scaffolding during learning, the cognitive risk is mitigated, and the equity benefits should take precedence.

  Until that evidence exists, we must prioritize the long-term architecture of the student's mind over the short-term efficiency of the software.
