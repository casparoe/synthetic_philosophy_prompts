answer: |-
  Your group's stalemate is not a failure of comprehension; it is a feature of the landscape. You have correctly diagnosed that you are not suffering from one disagreement, but from three distinct philosophical claims that have been historically conflated under the single label "Church-Turing Thesis."

  Your hypothesis about the "three stacked disputes" is remarkably accurate. However, to dissolve the stalemate, you need to sharpen the distinctions slightly differently. The disagreement isn't just verbal, formal, and empirical; it is about **modality** (conceptual necessity vs. contingent fact) and **subject matter** (mathematics vs. physics).

  Here is a diagnosis of the structure of your disagreement, how to carve it up so the camps can actually speak to each other, and what would actually count as evidence against the respective claims.

  ### 1. The Verbal Dispute: Explication vs. Discovery
  **Camp A (Definitional)** is treating the Thesis as a **Carnapian Explication**.
  **Camp B (Empirical)** is treating the Thesis as a **Scientific Identification**.

  This is the core of your "verbal" dispute. The word "calculable" is doing too much work.

  *   **The Explication View (Camp A):** Turing's 1936 paper is an analysis of the *concept* of a "computor" (a human following rules). Turing argues that if you analyze the limitations of a human agent (finite alphabet, bounded attention, local operations), you necessarily arrive at the Turing Machine. On this view, the Thesis is a philosophical argument that the TM captures the *essence* of the intuitive notion. It is not "true" in the sense of corresponding to an external fact; it is "adequate" in the sense of faithfully capturing the pre-theoretic intuition. Asking if it is true is indeed like asking if chess is true.
  *   **The Identification View (Camp B):** This camp views "effective calculability" as a pre-existing natural kind (like "heat" or "water") and the Turing Machine as the theoretical term that picked it out (like "molecular kinetic energy" or "H₂O"). They point to the convergence of Church, Turing, Post, and Gödel as "multiple discovery," suggesting they all latched onto the same objective structure.

  **How to dissolve this:**
  Camp B is making a category error regarding the "convergence argument." The fact that Lambda Calculus, General Recursion, and Turing Machines define the same class of functions is a **mathematical theorem**, not an empirical observation. It proves that the *formalisms* are equivalent, not that they capture the *informal notion*.
  *   **The Diagnostic:** Ask Camp B: "Is the convergence of formalisms evidence that the *math* is consistent, or evidence that the *world* is computational?" If they say the math, they concede to Camp A. If they say the world, they have silently shifted to the Physical Thesis (Camp C).

  ### 2. The Formal Question: Provability and Bridge Principles
  You asked if the question of provability is coherent. **It is not, strictly speaking.**

  You cannot prove an equivalence between a formal term (Turing-computable) and an informal term (effectively calculable) because the informal term lacks truth conditions. To prove the Thesis, you would need a formal definition of "intuitive calculability," but if you had that, you wouldn't need the Thesis.

  However, there is a middle ground often missed by reading groups: **Axiomatic Analysis.**
  This is where Gandy enters. Gandy (1980) didn't just extend Turing's work; he axiomatized the physical constraints of computation (finite density, speed of light limits, etc.).
  *   **For Camp A:** Gandy shows that Turing's analysis wasn't a lucky guess but a derivable consequence of reasonable constraints on information processing. This strengthens the "Explication" view—it shows the definition isn't arbitrary.
  *   **For Camp B:** Gandy's axioms are physical. This suggests the "necessity" of the Thesis relies on contingent facts about the universe (e.g., that information doesn't travel infinitely fast).

  **The Diagnostic:** The "Formal" dispute dissolves if you acknowledge that the Thesis functions as a **Bridge Principle**. It connects the normative space of reasons (what we *mean* by algorithm) to the formal space of causes (what a machine *does*). Bridge principles are neither provable nor empirical in a standard sense; they are justified by their utility and coherence.

  ### 3. The Empirical Core: The Physical Church-Turing Thesis (PCTT)
  **Camp C is the only one making a falsifiable claim.**
  The original CTT is about *algorithms* (abstract procedures). The PCTT is about *physical systems*.
  *   **CTT:** Every function that can be computed by an *effective procedure* is Turing-computable.
  *   **PCTT:** Every function that can be computed by a *physical system* is Turing-computable.

  **Why this matters for your group:**
  Camp A and Camp B are fighting over the *concept* of computation. Camp C is fighting over the *capacity* of the universe.
  *   If someone builds a hypercomputer (e.g., utilizing Malament-Hogarth spacetimes to perform supertasks, or an analog computer exploiting continuous real-valued states to solve the Halting Problem), they refute **PCTT**.
  *   Do they refute **CTT**? Only if you believe that "effective calculability" is constrained by physical law.
      *   If you are Camp A (Conceptual), you can say: "That hypercomputer is a physical oracle, not an effective procedure. The algorithm to run it isn't 'effective' in the Turing sense because it relies on physical magic, not step-by-step deduction."
      *   If you are Camp B (Empirical), you must admit the Thesis is false.

  **The Diagnostic:** Camp C is right that the "live" question is physical. However, they are wrong to say the original conceptual question is moot. If PCTT is false, we need to know if our *concept* of computation was wrong, or if the *universe* is just richer than our concept. That is a philosophical question, not a physical one.

  ### 4. What Counts as Evidence Against the Original Thesis?
  You asked: *Is there anything that could count against the original thesis itself, or is it insulated from refutation?*

  This is the crux of the epistemic status.
  *   **If CTT is a Definition (Camp A):** It is insulated from empirical refutation, but vulnerable to **conceptual counter-example**. To refute it, you must produce a procedure that everyone agrees is "effective" (step-by-step, deterministic, finite instructions, no insight required) but which cannot be implemented on a TM. No one has ever done this. The "insulation" is not a bug; it's a feature of conceptual analysis.
  *   **If CTT is Empirical (Camp B):** It is vulnerable to the discovery of a "natural" algorithm. For example, if the human brain were proven to solve non-recursive problems via biological processes that count as "effective calculation" (not just oracle lookup), CTT would be empirically falsified.

  **The Suspicion You Should Have:**
  You should be suspicious of Camp B's claim that CTT is a "deep empirical insight" *unless* they conflate it with PCTT. The convergence of formalisms is evidence of **robustness**, not empirical truth. It shows that the concept of computability is "stable" across different mathematical encodings, which suggests Turing hit on a natural joint in the *mathematical* landscape, not necessarily the physical one.

  ### Recommendation for the Group
  To move past the wall, propose the following taxonomy to your group. Ask them to agree on which claim they are actually discussing before arguing its truth value:

  1.  **The Conceptual Thesis:** "Turing's analysis of the human computor exhausts the intuitive notion of effective calculability." (Status: Philosophical Argument/Explication. Refutable by conceptual counter-intuition.)
  2.  **The Mathematical Robustness Claim:** "All reasonable formalizations of the intuitive notion yield the same class of functions." (Status: Mathematical Theorem. Already proven.)
  3.  **The Physical Thesis:** "No physical system can compute a non-recursive function." (Status: Empirical Hypothesis. Refutable by hypercomputation.)

  **The Verdict on Your Dispute:**
  Your group is having a "better version of a bad dispute."
  *   **Camp A** is mostly right about the *original* 1936 context (Turing was analyzing human clerks).
  *   **Camp B** is right about the *sociological* weight of the thesis (it functions like a law in CS), but wrong about its *epistemic* status (it's not inductive in the scientific sense).
  *   **Camp C** is right that the *action* is in physics, but wrong to dismiss the conceptual analysis (because we need the concept to know what to measure in the physics).

  **Final Advice:**
  Read **Robert Sober's** work on the CTT, or **Wilfried Sieg's** analysis of Turing's "Church's Thesis without Tears." Sieg argues strongly for Camp A: that Turing provided a rigorous analysis of the *concept*, making the thesis a consequence of that analysis rather than an empirical guess.
  If you accept Sieg's view, Camp B's "empirical" argument collapses into an appreciation of the *strength* of the analysis, and Camp C's argument is recognized as a distinct (though related) physical hypothesis.

  The wall you've hit is real, but it's a wall between **Philosophy of Mind/Math** (what is an algorithm?) and **Philosophy of Physics** (what can the universe do?). You aren't stuck; you're just standing on the border. Pick a side.
