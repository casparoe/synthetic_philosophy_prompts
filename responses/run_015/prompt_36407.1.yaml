      *   *The Problem:* One side is precise (Turing computable), the other is vague (intuitively computable). You can't prove equivalence between a formal definition and an informal intuition in the standard mathematical sense.
      *   *The "Three Camps" Analysis:*
          *   **Definitional (Explication):** Associated with Carnap. Turing analyzed the *concept* of computation. If the analysis is sound, the thesis is true by virtue of the analysis.
          *   **Empirical (Inductive):** Associated with Kleene (to an extent) and others. The convergence of formalisms is evidence.
          *   **Physical (PCTT):** Distinct claim. Can the *universe* compute more than a TM?

  3.  **Evaluate the User's Hypothesis ("Three Stacked Disputes"):**
