prompt: |-
  I'm in sixth form and run our student council forum where we vote on school rules, then usually reverse them next term with no clear logic. I want a reusable decision proceedure based on Dewey's experimentalism - democracy as social inquiry where each rule is a trial hypothesis run by the people affected, not just a majority vote. Turn it into a step-by-step checklist we can use in a 20-minute meeting: the questions in order, what counts as enough data to keep or kill the trial, where factual testing ends and values begin, and a reversability check so we don't lock future pupils into something they never agreed to. Be honest about which steps are just judgement calls dressed up as rules.

  Then apply it to three proposals: banning phones in the canteen, letting students redesign lunch menus every term, and keeping the prefect system even though our trial showed it makes some people feel excluded (this is the one I'll hate). For each say what the procedure gives, where it breaks down, and where it forces an answer I won't like. Also say clearly what this can't do - if it can't settle deep fairness fights, just admit it.

  Sorry if spelling's rough, I wrote this between lessons on my phone. And please don't ask me for references or a reading list - I haven't got access to look stuff up right now.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Sixth form student (approx. 16-18 years old), runs student council forum.
      *   **Context:** Current process is voting on rules, then reversing them next term with no logic. Wants a better, reusable decision procedure based on John Dewey's experimentalism (democracy as social inquiry).
      *   **Core Concept:** Rules as trial hypotheses run by affected people, not just majority vote.
      *   **Deliverables:**
          1.  A step-by-step checklist for a 20-minute meeting (questions, data thresholds, fact/value distinction, reversibility check).
          2.  Honest admission of where steps are judgement calls disguised as rules.
          3.  Application to three specific proposals (Phones in canteen, Student lunch menus, Prefect system).
          4.  Analysis of where the procedure breaks down or forces unwanted answers.
          5.  Clear statement of limitations (what it *can't* do).
      *   **Constraints:** No references/reading lists (user has no access). Acknowledge rough spelling/context (written between lessons). Tone should be practical, respectful, and intellectually honest.

  2.  **Deconstruct Dewey's Experimentalism for this Context:**
      *   *Democracy as Social Inquiry:* It's not just counting heads; it's collective problem-solving.
      *   *Rules as Hypotheses:* A rule isn't a law; it's an experiment to solve a specific problem.
      *   *Experience as Data:* The impact on daily life is the evidence.
      *   *Reconstruction:* If the experience is bad, the rule changes.
      *   *Community:* Those affected must be part of the inquiry.

  3.  **Drafting the Checklist (The "Dewey Protocol"):**
      *   *Time Limit:* 20 minutes is tight. Needs to be punchy.
      *   *Steps:*
          1.  Define the Problem (not just the solution).
          2.  Define the Hypothesis (The Rule).
          3.  Define the Metrics (What counts as success/failure?).
          4.  Define the Duration & Reversibility (The Trial).
          5.  The Verdict (Data review).
      *   *Honesty Check:* Need to explicitly label where subjective judgement creeps in (e.g., defining "enough" data, weighing conflicting values).

  4.  **Applying to the Three Proposals:**
      *   *Proposal 1: Banning phones in the canteen.*
          *   Problem: Noise/social isolation?
          *   Data: Noise levels, observation of interaction.
          *   Likely outcome: Mixed data. Hard to measure "social health."
      *   *Proposal 2: Redesigning lunch menus every term.*
          *   Problem: Food waste/dislike?
          *   Data: Waste bins, satisfaction surveys.
          *   Feasibility: High logistical burden.
      *   *Proposal 3: Prefect System (The "Hate" One).*
          *   Problem: Order vs. Exclusion.
          *   Data: Feeling of exclusion (survey) vs. Incident reports (safety/order).
          *   Deweyan tension: If the "experiment" causes harm (exclusion) without clear compensatory benefit, it should fail. But if the benefit is "order," how do we weigh "order" vs. "belonging"? This is where the user will hate the answer.

  5.  **Addressing Limitations:**
      *   Can't solve deep value conflicts (e.g., liberty vs. security).
      *   Can't force the school administration to agree.
      *   Data can be manipulated or misinterpreted.
      *   20 minutes is very short for deep inquiry.

  6.  **Refining the Tone:**
      *   Respectful of the student's initiative.
      *   Direct and practical (no academic jargon without explanation).
      *   Acknowledging the "rough spelling" implicitly by keeping the response clear and readable.
      *   Avoiding the "reading list" constraint strictly.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain where facts end and values begin? *Adjustment:* Make sure Step 3 of the checklist explicitly separates "What happened" from "Is this good."
      *   *Check:* Did I address the reversibility for future pupils? *Adjustment:* Add a specific "Sunset Clause" question.
      *   *Check:* Is the Prefect section honest enough? *Adjustment:* Ensure I state clearly that if exclusion is the data, Dewey says drop the rule, even if teachers like the order. This might be the "answer I won't like."
      *   *Check:* Is the 20-minute constraint realistic? *Adjustment:* Emphasize that prep work needs to happen *before* the meeting, or the meeting is just for the verdict. I will structure the checklist as a "Review Meeting" or a "Proposal Launch" but the prompt implies voting/deciding. Let's make it a "Trial Design & Review" hybrid, but acknowledge 20 mins is for the *decision*, not the data gathering. Actually, the prompt says "20-minute meeting." I need to make sure the checklist fits that. It implies the data is *already there* or the trial is being *set up*. Let's assume the meeting is to *authorize* a trial or *conclude* one. I will frame it as a "Trial Authorization & Review" template.
      *   *Correction:* The prompt asks for a procedure to "vote on school rules, then usually reverse them." So the checklist needs to cover *setting up* the trial and *ending* it. I'll structure it as a "Trial Lifecycle" checklist that fits into a meeting agenda.

  8.  **Final Polish:**
      *   Ensure the "Honesty Section" is prominent.
      *   Ensure the "What this can't do" section is blunt.
      *   Make sure the Prefect analysis hits the "exclusion" point hard, as requested.

  9.  **(Self-Correction on Dewey Interpretation):** Dewey isn't just "try it and see." It's "identify the problem, propose a solution, test it, observe consequences, reconstruct." I need to make sure the "Problem Definition" step is crucial, otherwise, you're just testing solutions looking for a problem.

  10. **Final Review against constraints:** No references. 20-min focus. 3 specific scenarios. Honest about limitations.

