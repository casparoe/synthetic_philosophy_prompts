  ### My Best Guess: Dan will say Friday is NOT available.

  **Why?** Look closely at his verdict on **Case 1 (One-Day)**. He calls it a "flat contradiction."
  Now look at **Case 2 (Classic)**. He says it's fulfillable *because* the induction proves the announcement false.

  In your **Split-Source Case**, consider the students' position on **Thursday night**.
  1.  **Syllabus:** "There is exactly one exam Mon–Fri." (Independent, Infallible).
  2.  **Teacher:** "You won't know the day until the morning."
  3.  **Situation:** No exam Mon–Thu.
  4.  **Deduction:** From (1), the exam *must* be Friday. Since (1) is infallible and independent of (2), the students **know** the exam is Friday on Thursday night.
  5.  **Conflict:** This knowledge violates (2).

  In the **Classic Case (2)**, on Thursday night, the students only know the exam is Friday *if* they trust the Announcement. But the Announcement *includes* the Surprise clause. So, to trust the Announcement is to trust that they *won't* know it's Friday. This creates the loop that allows the "announcement is false" escape hatch.

  In the **Split Case**, the knowledge that "Exam = Friday" comes from the Syllabus, which is *not* burdened by the Surprise clause. There is no loop. There is no self-defeat. There is just a direct contradiction between the Syllabus-derived knowledge and the Teacher's claim.
  Since Dan calls the 1-Day version a "flat contradiction" (Case 1), and the Thursday-night-of-Split-Case scenario is logically isomorphic to the 1-Day version, he must treat Friday as impossible.

  **The Rule Dan is running is Rule 2 (Premise Anchoring).** He believes the "escape hatch" of the surprise exam requires the existential premise to be epistemically dependent on the surprise premise. If you anchor existence externally (Syllabus) or temporally prior (Case 5), you close the hatch.

