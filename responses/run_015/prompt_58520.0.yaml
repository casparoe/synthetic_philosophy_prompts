  1. You randomly split a mixed bag of cherry tomato seeds into two side-by-side community garden beds, one with depleted dirt and one with rich compost, then add cheap grow lights only to the depleted bed to boost growth.
  2. Because every plant in a bed shares the exact same soil and light, environmental variance drops to near zero, forcing the ratio of genetic variance to total variance above 90 percent.
  3. The average height difference between beds comes from the soil and LEDs, so when the lights boost the poor bed by six inches, it proves the trait shifts despite that 90 percent score.
  4. The real work is done by keeping the environment uniform within each bed while making it different between the beds, which separates genetic variance from environmental variance. If you remove the uniform soil within beds, the within-group heritability drops and the distinction between individual and group causes collapses.
  5. A skeptic might argue that short-genome plants still stayed shorter than tall-genome neighbors, claiming genes still set the absolute limits. This reply fails because it confuses individual ranking with the group's overall capacity to shift when the environment changes, which is what changeability actually means.
