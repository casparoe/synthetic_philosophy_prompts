answer: |-
  It is a fascinating puzzle you present. Your friend's judgements display a remarkable internal coherence, suggesting she is operating according to a sophisticated, albeit implicit, theory of democratic boundaries. She clearly rejects both pure citizenship-based models (given her inclusion of non-citizens in cases 2 and 6) and pure legal-voting-rights models (given her exclusion of expatriates in case 3). To predict her verdict on the climate refugees, we must first distil the principles underlying her existing positions.

  ### Competing Theoretical Principles

  Based on the six verdicts provided, two competing principles emerge that could plausibly explain her reasoning. Both account for the majority of her judgements, but they diverge on the significance of legal status versus actual civic function.

  **1. The Principle of Indefinite Subjection**
  This principle holds that membership in the *demos* is determined by the temporal horizon of an individual's subjection to the state's coercive authority. If the state claims an individual indefinitely—meaning there is no预设 (pre-set) end date to their residence or legal obligation—then that individual must have a say in how that authority is exercised. Conversely, if the relationship is finite by design, membership is withheld.

  *   **Application to previous cases:** This explains why she includes permanent residents (Case 2) and refugees with indefinite leave (Case 6), as both are subject to the state's laws on an open-ended basis. It explains why she excludes temporary workers (Case 5), whose subjection is limited by a fixed contract. Crucially, it explains the exclusion of expatriate citizens (Case 3); despite holding citizenship, their daily lives are no longer subject to the coercive framework of the territory in a meaningful, continuous sense.
  *   **Application to the new case:** Under this principle, the climate refugees would be **excluded**. Their status is explicitly "provisional" and "temporary by design," with a maximum horizon of ten years and no pathway to permanence. They are not subject to the state indefinitely.

  **2. The Principle of Civic Function**
  This principle holds that membership is determined by an individual's actual contribution to and participation in the reproduction of the political community. It focuses on social facts rather than legal labels: paying taxes, working, residing physically, and engaging in deliberation. If one performs the duties of a member, one should possess the status of a member.

  *   **Application to previous cases:** This explains the inclusion of adult residents (Case 1), long-term non-citizens (Case 2), and refugees who work and pay taxes (Case 6). It explains the exclusion of expatriates (Case 3), who contribute little to the domestic society, and temporary workers (Case 5), whose brief tenure prevents deep functional integration. It accommodates minors (Case 4) as members-in-waiting who are socially embedded within families that function civically.
  *   **Application to the new case:** Under this principle, the climate refugees would likely be **included**. Unlike the temporary workers in Case 5, these refugees are present for a significant duration (up to ten years), pay taxes, work, and—most importantly—are required to attend deliberative assemblies. They are performing the functions of citizenship (deliberation, contribution) even if they lack the legal title.

  ### Prediction of Her Verdict

  Having weighed these two principles against her specific history of judgements, I predict that your friend would **exclude** the climate refugees from the *demos*.

  **Reasoning:**
  While the Principle of Civic Function is attractive given the refugees' deliberative duties, your friend's verdict on Case 6 is the strongest indicator of her core commitment. In Case 6, she included refugees who were legally barred from voting and citizenship, provided they had "indefinite leave to remain." This suggests that for her, the *legal permanence of residence* is the necessary condition for membership, outweighing even the lack of formal voting rights.

  Conversely, in Case 5, she excluded workers who were economically active and affected by policy simply because their stay was temporary. The new case resembles Case 5 much more closely than Case 6 regarding legal status. The phrase "temporary by design" and the lack of a "pathway to permanence" are decisive. The mandatory deliberative assemblies, while significant, can be interpreted under her framework as administrative compliance rather than political membership—akin to being summoned for jury duty without being a citizen. The absence of an indefinite horizon signals that the state views them as guests rather than co-authors of the law.

  **Closest Analog:**
  The closest analog among her earlier judgements is **Case 5 (Non-citizen temporary workers)**. In both instances, the group is physically present, economically productive, and affected by policy, but their legal status is finite. The extension from two years to five (renewable once) is a difference of degree, but the structural limitation—the lack of indefinite subjection—remains the same. Her consistency suggests she will not allow the duration or the deliberative requirement to override the temporary nature of the legal bond.

  ### A Distinguishing Hypothetical Case

  To definitively distinguish between the Principle of Indefinite Subjection and the Principle of Civic Function in her mind, one would need a case where legal permanence and civic function pull in opposite directions.

  **The Case of the Idle Permanent Resident:**
  Imagine a group of non-citizen residents who hold "indefinite leave to remain" (matching Case 6) and have lived in the territory for over fifteen years. However, they possess independent wealth, pay no income tax due to loopholes, do not work, and explicitly refuse to participate in any local boards or community deliberations, isolating themselves from society.

  *   **The Principle of Indefinite Subjection** predicts she would **include** them. They are subject to the state's laws indefinitely, regardless of their lack of contribution.
  *   **The Principle of Civic Function** predicts she would **exclude** them. They fail to contribute to or participate in the social reproduction of the community.

  If she includes them, it confirms that the legal horizon of residence is her primary criterion. If she excludes them, it suggests her earlier verdicts were driven more by social embeddedness and contribution than by legal status alone. Given her inclusion of the non-voting refugees in Case 6, I suspect she would include the idle residents, further cementing the Principle of Indefinite Subjection as her guiding rule.
