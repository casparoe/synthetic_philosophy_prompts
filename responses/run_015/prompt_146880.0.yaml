  4. Minors who are citizens and reside within the territory: she includes them, though she allows that their membership may be qualified or exercised by proxy.
  5. Non-citizen temporary workers on fixed two-year contracts, who are affected by labour and housing policies but lack long-term embeddedness: she excludes them.
  6. Non-citizen refugees who have been granted indefinite leave to remain, live in the territory, work, pay taxes, but are legally barred from voting and from ever applying for citizenship: she includes them.

