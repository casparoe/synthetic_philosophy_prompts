answer: |-
  The central tension in Daniel Dennett's account of real patterns lies in reconciling the autonomy of higher-level explanations with a naturalistic ontology that refuses to duplicate the causal work of physics. The debate turns on how we interpret the metric of "predictive compression" across the physical, design, and intentional stances. Does the ability of a stance to compress data into a predictive model certify the reality of the patterns it identifies uniformly across all levels (the stance-neutral reading), or does it certify reality only relative to the pragmatic interests of that specific stance (the stance-relative reading)?

  I argue that **both readings fail** because they share a foundational error: they treat predictive compression as a sufficient condition for ontological commitment. While compression is a necessary heuristic for identifying candidate patterns, it is an epistemic virtue, not an ontological ground. Relying on it as the sole criterion forces a choice between an untenable relativism that fragments reality (the relative reading) and an inflationary realism that dilutes the concept of existence (the neutral reading). To sustain the autonomy of the intentional stance without collapsing into physicalism or inflating into dualism, we must distinguish between the *detectability* of a pattern and its *causal robustness*. The former is a matter of compression; the latter is a matter of counterfactual stability independent of the observer's stance.

  ### The Failure of the Stance-Relative Reading

  The stance-relative reading attempts to preserve the autonomy of the intentional stance by indexing reality to the explanatory framework in use. On this view, to say a belief is a "real pattern" is to say it is a real-pattern-for-the-intentional-stance. This move is motivated by the desire to avoid ontological competition with physics. If mental patterns are only real relative to the goals of predicting rational agents, they do not compete with physical patterns, which are real relative to the goals of fundamental physics. This secures autonomy by compartmentalization: the intentional stance is sovereign in its domain, but its ontology does not leak into the physical domain.

  However, this reading incurs a cost of radical relativism that undermines the coherence of scientific explanation. If reality is stance-indexed, we lose the ability to explain how different stances coordinate to describe a single world. Consider the comparison between a thermostat and a human agent. Under the design stance, we attribute a "goal" to the thermostat (e.g., maintain 70 degrees) because this attribution compresses the data of its switching behavior better than a physical micro-description of its bimetallic strip. Under the intentional stance, we attribute "beliefs" and "desires" to a human agent for similar compressive reasons.

  If the stance-relative reading holds, the thermostat's goal is real-for-design, and the agent's belief is real-for-intentional. But this creates an explanatory gap when the two systems interact. If a human agent (intentional stance) adjusts the thermostat (design stance) based on the belief that the room is cold, we are crossing stance boundaries. If the reality of the "coldness" is only internal to the intentional stance, and the reality of the "set-point" is only internal to the design stance, there is no ontological common ground that makes the interaction possible. The relative reading saves autonomy by isolating the stances, but in doing so, it renders the integration of scientific knowledge impossible. It reduces the intentional stance to a useful fiction—a "save the phenomena" tool—rather than an account of genuine structure in the world. Dennett explicitly rejects instrumentalism; he insists patterns are *real*, not just useful. The stance-relative reading, by making reality contingent on the observer's pragmatic constraints, collapses back into the instrumentalism Dennett seeks to avoid.

  ### The Failure of the Stance-Neutral Reading

  The stance-neutral reading avoids this fragmentation by asserting a uniform criterion: if a pattern yields predictive compression, it is real, full stop. On this view, the compression ratio is a stance-invariant metric. If belief-desire attribution compresses behavioral data as effectively as physical laws compress particle data, then beliefs are as ontologically robust as particles. This reading respects Dennett's naturalism by placing all real patterns on a continuum of abstraction. It grants the intentional stance genuine ontological commitment, forcing physicalism to accommodate mental properties as high-level real patterns rather than eliminating them.

  While this avoids the relativism of the relative reading, it succumbs to ontological profligacy. The core problem is that predictive compression is too coarse a filter for reality. Compression is a measure of information density, not causal structure. A model can be highly compressive and predictive without latching onto mind-independent entities. Consider a spurious correlation: if data shows that ice cream sales predict shark attacks with high accuracy, a model utilizing "ice cream risk" compresses the data effectively. Under a strict stance-neutral reading, "ice cream risk" would qualify as a real pattern. Yet, we intuitively reject it as an ontological commitment because it lacks causal power; it is a byproduct of a common cause (heat).

  If compression alone suffices for reality, the ontology becomes cluttered with every accidental regularity that allows for data shortening. This inflates mental properties not just into robust entities, but into *too many* entities. It threatens to dissolve the distinction between a genuine causal structure and a mere descriptive convenience. For the doctoral seminar context, this is fatal: if ontological commitment is triggered by any compressive regularity, the term "commitment" loses its discriminatory power. We are committed to everything that helps us predict, which is tantamount to being committed to nothing in particular. The stance-neutral reading correctly identifies that intentional patterns should not be eliminated, but it incorrectly identifies *why* they should be retained. It retains them because they are useful for prediction, whereas we should retain them because they capture stable causal structures.

  ### The Insufficiency of Predictive Compression

  The failure of both readings stems from the assumption that predictive compression is sufficient for ontological commitment. Compression is an epistemic criterion regarding *access* to patterns, not a metaphysical criterion regarding the *existence* of patterns. To defend the autonomy of the intentional stance without falling into relativism or inflation, we must supplement compression with a condition of counterfactual robustness that is stance-invariant.

  A pattern is ontologically committing only if it supports counterfactuals that hold independently of the specific vocabulary used to describe it. In the thermostat case, the "goal" of 70 degrees supports counterfactuals about the system's behavior under varying temperatures (e.g., "if the room were colder, it would switch on sooner"). These counterfactuals are robust because they are grounded in the physical mechanism, even if described via the design stance. In the human agent case, belief-desire attributions support counterfactuals about actions under varying informational states (e.g., "if she had believed the bridge was out, she would not have crossed").

  The crucial distinction is that in the intentional case, these counterfactuals are not merely grounded in the physical substrate in a way that allows elimination. The rational coherence of the beliefs themselves exerts a constraint on the physical realization. However, compression alone does not reveal this. Compression merely tells us that the intentional vocabulary is efficient. It does not tell us whether the efficiency arises from a robust causal structure or a convenient approximation.

  Therefore, both the stance-neutral and stance-relative readings fail because they attempt to derive ontology from epistemology. The stance-neutral reading assumes that because we *need* the vocabulary to predict efficiently, the world *must* contain the entities. The stance-relative reading assumes that because the vocabulary is *chosen* for pragmatic reasons, the entities are *only* real relative to that choice. Both ignore the middle ground: the vocabulary is chosen for pragmatic reasons (compression) *because* it tracks mind-independent causal structures (robustness).

  ### Conclusion

  The autonomy of the intentional stance cannot be sustained by predictive compression alone. The stance-relative reading fails because it fragments reality into incommensurable pragmatic domains, rendering cross-stance explanation incoherent. The stance-neutral reading fails because it equates informational efficiency with ontological existence, leading to an inflationary ontology that includes spurious correlations.

  The correct conclusion is that predictive compression is a necessary but insufficient condition for ontological commitment in any stance. Compression identifies where to look for reality, but reality is constituted by the counterfactual stability of the patterns identified. For the intentional stance, this means that beliefs and desires are real not merely because they help us predict behavior, but because they capture causal structures of rational coherence that are robust across variations in physical implementation. This preserves the autonomy of the intentional stance—it deals with structures physics cannot easily describe—without requiring a relativistic ontology or an inflationary metaphysics. It forces a revision of the "Real Patterns" framework: we must view compression as the method of discovery, not the definition of reality. Only by decoupling the epistemic metric of compression from the metaphysical status of patterns can we secure a non-eliminative realism that physicalism can accommodate.
