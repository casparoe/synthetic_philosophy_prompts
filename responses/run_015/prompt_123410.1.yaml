answer: |-
  Your hypothesis is correct: the Fischer Controversy has stalled not because of a lack of evidence, but because the participants are engaged in a **framework clash** masked by a **systematic ambiguity** in the vocabulary of "responsibility."

  The debate is not merely verbal (a simple definition mismatch), nor is it purely empirical (solvable by more documents). It is a **category error** where historical causation, political liability, and moral agency are conflated under a single label. The stall persists because Fischer's critics and supporters are playing different games with the same pieces.

  Here is the concrete diagnosis of the stall, the specific distinctions doing the hidden labor, and the requisite path to progress.

  ### 1. Diagnosis: A Framework Clash with Substantive Overlap

  The disagreement is best characterized as a **Framework Clash between Historiography and Moral Philosophy**, compounded by a **Substantive Disagreement within Historiography** regarding the nature of historical explanation.

  *   **The Fischer (Intentionalist) Framework:** Operates within **Political History**. It assumes the state is a unitary actor capable of forming intentions analogous to an individual. "Responsibility" here means *documented volition*. If the archives show Bethmann-Hollweg sought war, Germany is responsible.
  *   **The Structuralist Framework:** Operates within **Sociological History**. It views the state as a complex system of competing bureaucracies and external pressures. "Responsibility" here means *causal weight*. Even if no one wanted a general war, if German policy choices tightened the alliance system to the breaking point, Germany bears the causal burden.
  *   **The Philosophical Framework:** Operates within **Moral Metaphysics**. It questions the ontology of the state. "Responsibility" here means *moral culpability*. It argues that without a unified consciousness, a state cannot possess *mens rea* (guilty mind), making "national guilt" a category mistake.

  **Why this causes a stall:**
  When a Structuralist says, "Germany wasn't responsible; the alliance system broke," they are denying *volitional intent*. When a Fischerian replies, "Germany was responsible; look at the September Program," they are proving *political aim*. They are not contradicting each other empirically; they are disagreeing on whether *aim* or *effect* constitutes responsibility. Meanwhile, the Philosophical camp renders both claims normatively inert by denying the subject (the State) can hold blame.

  ### 2. The Hidden Labor: Three Conflated Distinctions

  The debate remains unresolved because three distinct concepts are being used interchangeably. Progress is impossible until these are disentangled.

  #### A. Causal Contribution (The Structuralist Claim)
  *   **Definition:** The degree to which a nation's actions increased the probability of war relative to a counterfactual baseline.
  *   **Hidden Labor:** Structuralists use "responsibility" to mean "causal leverage." They argue that even a hesitant Berlin contributed more to the outbreak of war than a hesitant London due to the "Blank Check" to Austria.
  *   **Conflict:** Fischerians accept this but argue it is insufficient without *intent*. Philosophers argue causation $\neq$ blame (a hurricane causes damage but is not to blame).

  #### B. Institutional Responsibility (The Fischer Claim)
  *   **Definition:** The alignment of state apparatus and policy toward a specific outcome, regardless of individual psychological states.
  *   **Hidden Labor:** Fischer treats the "State" as a legal corporation that can intend things through its authorized agents. If the Chancellor and Kaiser align on war aims, the *Institution* intends war.
  *   **Conflict:** Structuralists argue the institution was fractured (civilian vs. military leadership), so "Institutional Responsibility" is a fiction. Philosophers argue that even a unified institution lacks the phenomenal consciousness required for moral blame.

  #### C. Moral Culpability (The Philosophical Claim)
  *   **Definition:** The ethical liability to punishment or condemnation, requiring agency and choice.
  *   **Hidden Labor:** This is the normative core of the public debate (War Guilt Clause, Article 231). When the public asks "Who started it?", they are asking for a moral villain, not a causal variable.
  *   **Conflict:** Historians (Fischer and Structuralists) generally assume moral culpability follows historical causation. Philosophers sever this link, arguing you can be the *cause* of a war without being *culpable* for it (e.g., if trapped by structural inevitability).

  ### 3. The Empirical Limit

  You asked if this is a "hidden empirical question." It is, but only partially.
  *   **Fischer vs. Structuralists:** This *is* an empirical dispute. It turns on whether archives reveal a coherent *Kriegsrat* (War Council) decision or fragmented improvisation. New archives can shift the balance here (e.g., showing Bethmann-Hollweg was more passive than Fischer claimed).
  *   **Historians vs. Philosophers:** This is **not** an empirical dispute. No archival discovery can prove that a state possesses a "soul" or unified moral agency. Therefore, empirical research cannot resolve the normative aspect of the controversy.

  The stall persists because Fischerians believe solving the empirical question (proving intent) solves the normative question (assigning blame). The Philosophical camp demonstrates that it does not.

  ### 4. Path to Progress: Reframing via Formal Distinction

  Given this diagnosis, an archival finding cannot resolve the debate, nor can a purely philosophical argument dissolve the historical evidence. Progress requires a **Formal Distinction** that separates the inquiries into parallel, non-competing tracks.

  **What counts as progress:**
  The debate should be **reframed rather than settled**. We must abandon the singular question "Who was responsible for WWI?" and replace it with a **Tripartite Taxonomy of Attribution**:

  1.  **Causal Attribution (Historical/Sociological):**
      *   *Question:* Which state actions most significantly reduced the margin for peace?
      *   *Resolution:* Likely a shared burden (Germany's Blank Check + Russia's Mobilization + Alliance rigidity). This satisfies the Structuralists.
  2.  **Volitional Attribution (Political/Archival):**
      *   *Question:* Which leaderships actively sought a general war vs. accepting it as a risk?
      *   *Resolution:* Fischer is largely vindicated here regarding *aims*, even if Structuralists are right about *control*. Germany had the most expansive aims.
  3.  **Moral Attribution (Philosophical/Legal):**
      *   *Question:* Can collective entities bear guilt?
      *   *Resolution:* Acknowledge that "National Guilt" is a legal/political fiction useful for reparations (Article 231) but metaphysically incoherent. Blame attaches to *individual leaders* (Wilhelm II, Berchtold, Sazonov), not the metaphysical entity "Germany."

  **Conclusion:**
  The Fischer Controversy has stalled because it attempts to solve a moral problem (culpability) using historical methods (archives) applied to a collective entity (the State) that may not qualify as a moral agent.

  Progress lies in **dissolving the conflation**. We must accept that Germany can be *causally primary* (Structuralist), *politically intentional* (Fischer), and yet *morally blame can only attach to individuals* (Philosopher). The debate ends not when one side wins, but when historians stop using "responsibility" to mean both "caused" and "sinned," and philosophers acknowledge that historical explanation does not require metaphysical unity. The "stall" is actually a signal that the question itself was ill-posed.
