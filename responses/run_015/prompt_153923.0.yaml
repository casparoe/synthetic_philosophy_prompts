answer: |-
  The stall in the care ethics debate is **primarily categorical**: the two camps are addressing **different questions under a single heading**. The relational particularists are asking a question about **moral psychology and the constitution of virtuous agency** (What does it mean to *be* a caring subject?), while the structural scaling advocates are asking a question about **political justice and institutional function** (How do we ensure needs are *met* within a population?). By subsuming both inquiries under the single normative concept of "care," the debate generates a false dilemma where either the concept must be stretched until it breaks (losing proximity-fidelity) or the scope of justice must be restricted until it becomes parochial (losing structural efficacy).

  This categorical confusion is sustained by **different evidential standards**. The particularists privilege **phenomenological reports** because they view the internal experience of attentiveness as constitutive of the moral act; without the affective resonance, the act is merely administrative. The scaling advocates privilege **structural metrics** because they view the alleviation of vulnerability as the telos of the ethic; without the material outcome, the affect is merely sentimental. Because one side measures success by the *quality of the relationship* and the other by the *distribution of resources*, they cannot converge on applied cases like healthcare rationing: the former sees a rationing protocol as a failure of responsiveness, while the latter sees it as a success of equitable attention.

  **Hidden Empirical Claims**
  Crucially, this categorical divergence is calcified by competing, often untested, **hidden empirical claims**:
  1.  **The Psychological Limit Claim (Particularists):** This camp assumes that human moral motivation is biologically or psychologically bounded by proximity and affective feedback loops. They assume that "structural attentiveness" is empirically impossible because institutions cannot "feel" or "respond" in the requisite phenomenological sense, and that agents cannot sustain caring motivation without direct feedback.
  2.  **The Organizational Feasibility Claim (Scaling Advocates):** This camp assumes that institutional designs can successfully mimic or substitute for relational responsiveness without generating alienation. They assume that "dependency-tracking" mechanisms can be implemented without devolving into bureaucratic violence or surveillance, and that recipients of institutional care can experience these structures as "caring" rather than merely "efficient."

  The debate stalls because each side treats their empirical assumption as an axiomatic truth. Particularists assume the Psychological Limit Claim is insurmountable; Scaling Advocates assume the Organizational Feasibility Claim is already proven by existing welfare states.

  **Path to Progress**
  Given this diagnosis, progress would not come from a mere conceptual distinction (which has already been attempted via taxonomies of mediated care) nor from a formal model (which would likely privilege the scaling advocates' metrics). Nor should we conclude the question is ill-posed in a way that precludes progress; the tension between intimacy and justice is real, even if the framing is flawed.

  Progress requires a **change in the framing question**. The field must abandon the metaphor of "scaling" care, which implies care is a homogeneous substance that can be diluted or stretched. Instead, the question should be reframed as: **"How do institutional structures scaffold, inhibit, or substitute for relational care practices?"**

  **Reasons for this approach:**
  1.  **Dissolves the Category Mistake:** It acknowledges that institutions do not "care" in the phenomenological sense (satisfying particularists) but accepts that they determine the conditions under which caring is possible (satisfying scaling advocates).
  2.  **Targets the Empirical Claims:** This framing invites **empirical study of institutional care practices** (the second-best option, but now properly directed). Researchers can investigate specific institutional designs to see *where* the Psychological Limit Claim holds (e.g., does algorithmic rationing actually degrade caregiver motivation?) and *where* the Organizational Feasibility Claim holds (e.g., can universal basic income be experienced as an act of societal care?).
  3.  **Restores Normative Force:** It allows care ethics to retain its critique of cold bureaucracy (by analyzing how structures inhibit relationality) while engaging with global justice (by analyzing how structures enable the meeting of needs).

  By shifting from "Can care scale?" to "What is the division of moral labor between relational practices and structural scaffolds?", the debate moves from an ontological stalemate to a pragmatic investigation of how to build a society that maximizes both relational fidelity and structural security.
