      *(Refining the "Progress" argument)*: If I say "Change in framing," I need to explain *why* a conceptual distinction isn't enough. A conceptual distinction (Care-giving vs. Care-providing) has already been tried (as noted in the prompt: "particularists developing taxonomies"). It didn't work. Why? Because the normative force is still contested. So the *question* itself ("Can care scale?") presupposes care is a scalable substance. That is the error.

