answer: |-
  A. Recap of the chain
  Your argument moves from the premise that all sources are biased (1-2) to the conclusion that no unbiased access is possible (3), implying there are no objective historical facts (4). This leads to a paradox where the claim "history is biased" cannot itself be objectively true (5-6), forcing a choice between self-refutation or naive objectivism (7-8).

  B. The broken step
  **Step (4)** is the break. It commits the **epistemic fallacy** by conflating *access to reality* (epistemology) with *reality itself* (ontology). Just because our lens is dirty (biased sources) does not mean the object being viewed (the past) ceases to exist or lacks a "fact of the matter"; it only means our view is imperfect. The step slides modalically from "we cannot know perfectly" to "nothing is true," which is an unjustified leap.

  C. The price of fixing it
  By rejecting (4), you lose the comfort of total skepticism; you must accept that some historical claims *can* be objectively true or false, even if verification is difficult. This does not force you into naive objectivism (7), but it does require you to accept that methodology (triangulation, archaeology, counter-narratives) can partially correct bias without needing a "God's eye view." Premises (1) and (2) remain intact, but bias becomes a hurdle to manage rather than a wall that blocks all truth.

  D. Salvage plan
  Keep (1) and (2), but **reject (4)** and reframe (3). Adopt **Critical Realism**: admit that a mind-independent past exists (facts of the matter), but our access is always mediated and probabilistic. You are stuck accepting that historical truth is *graded* (high confidence vs. low confidence) rather than binary, and that the phrase "history is written by victors" is a heuristic warning about source criticism, not an ontological law. This dissolves the self-refutation in (6) because the claim about victors is a well-supported generalization, not an absolute metaphysical decree.
