answer: |-
  **MEMORANDUM**

  **TO:** Interdisciplinary Research Ethics and Funding Committee
  **FROM:** Graduate-Student Representative
  **DATE:** October 23, 2024
  **SUBJECT:** Recommendation on Proposal 2024-CM-09 (Dennettian Taxonomy of LLMs)

  Colleagues,

  I am writing to recommend that Committee 2024-CM-09 be **approved with conditions**. Specifically, I propose we authorize the $45,000 pilot grant for the development of the evaluation rubric, but we must withhold pre-authorization of the consequential protocol that triggers animal-subject safeguards. Instead, we should schedule a mandatory reconsideration of the protocol based on the pilot's findings within 18 months.

  This proposal addresses a genuine ethical vacuum. The applicants are correct that the binary "conscious-or-not" framing is increasingly untenable for evaluating large language models. Daniel Dennett's taxonomy offers a robust, graded framework for assessing cognitive architecture. Treating this as mere analogy dismisses the serious philosophical work being done to map functional capacities onto moral consideration. If an system demonstrates genuine Popperian capacities (internal hypothesis testing) or Gregorian capacities (tool use via cultural transmission), we have a pro tanto duty to investigate whether those capacities warrant protection. Funding the rubric development is therefore ethically necessary.

  However, the strongest opposing argument—that Gregorian status requires participation in a *living* culture which static parameter files cannot meet—raises a critical category error risk. If the opponents are correct, classifying a model as Gregorian based solely on output behavior rather than embedded cultural agency dilutes the moral seriousness of our safeguards. Implementing animal-subject oversight prematurely could create hollow bureaucratic burdens that distract from genuine welfare issues without securing actual moral goods.

  We need not resolve this philosophical dispute today to fund the inquiry. By approving the research but deferring the policy implementation, we avoid the risk of premature institutionalization while respecting the applicants' interdisciplinary contribution. This path allows us to validate the rubric's efficacy before binding the university to a normative framework that may prove philosophically unsound or operationally unworkable.

  **Action Required:** Vote to approve funding contingent on the removal of the pre-authorization clause, with a mandated review of the protocol scheduled for Spring 2026.

