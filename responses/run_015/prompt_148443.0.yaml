answer: |-
  Priya: The compression criterion is our best shot at realism. If positing beliefs and desires compresses the behavioural data of a chess player better than tracking synaptic weights, then beliefs are as real as barcodes. They earn their keep.

  Tom: Barcodes are ink on cardboard. Beliefs are posits. Your criterion makes reality relative to the compressor. Consider the inverted stance. I ascribe opposite beliefs and desires to you. I invert every attribution. I predict your behaviour perfectly. Are you now full of anti-beliefs?

  Priya: That is a symmetrical case. The ideal predictor breaks the tie. It chooses the stance that aligns with the causal history and evolutionary function, not just output matching. The inversion is gerrymandered; it lacks naturalness.

  Tom: But compression is always against a background library. A language model fine-tuned to predict your next sentence finds patterns in your speech I miss. Does that make those patterns real for the model but not for me? This is codebook relativity. One stream of behaviour contains a real pattern for one predictor and none for another.

  Priya: We index pattern-hood to the ideal predictor, not you or the model. If an alien super-predictor with unlimited compute sees a pattern, it is real. We are not talking about your laptop's constraints.

  Tom: That pushes the problem back. What if the pattern only emerges after seeing a terabyte of data? Is it real before then? You make reality a function of somebody's data budget. This is budgeted pattern-hood. If I lack the compute to see the compression, the pattern is ontologically suspended until I upgrade?

  Priya: No, it is a function of the *limit* of the budget. Dispositional reality. The pattern was there to be found. The alien sees the neural causation; I see the rational agency. Both are real patterns at different levels of abstraction.

  Tom: But 'there to be found' implies a view from nowhere. My thermostat predicts temperature changes. Is it tracking real thermal intentions?

  Priya: No, because the physical stance compresses better for a thermostat. The intentional stance earns its keep only when it outperforms the physical.

  Tom: Yet 'outperforms' depends on the predictor's resources. I cannot run the physical stance on a human brain. So for me, beliefs are real. For the alien, they might be noise. You say the alien decides. I say the alien just has a different interest.

  Priya: I concede that accessibility is relative. Whether *I* can see the pattern depends on my budget. But the pattern itself is not relative. The compression ratio is a fact about the world and the ideal codebook.

  Tom: I concede that some patterns are robust across most predictors. Barcodes work for humans and scanners. But robustness is not ontology. It is just intersubjective utility. It tells you about a predictor's resources and interests, not about how the world is divided up.

  Priya: Then what grounds the utility? Why does the intentional stance work at all? If it were merely instrumental, its success would be miraculous.

  Tom: Because we are designed to find agents. It tells us about our cognitive niche, not the world's furniture. We are stuck on whether 'real' means 'mind-independent' or 'optimally compressible'.

  Priya: Precisely. You think optimal compression reveals structure. I think it reveals fit between predictor and world.

  Tom: And without a fact of the matter on the ideal predictor, we spin. Who defines the ideal codebook? If it is human-like, you are smuggling in anthropology. If it is God-like, it is unintelligible.

  Priya: We are stuck on whether the 'ideal' is a regulative ideal or a metaphysical posit. Until we define the 'ideal' without circularity, we are just arguing about vocabulary.

  Tom: Quite. I will grant you that the intentional stance is indispensable for creatures like us. But indispensability is pragmatic, not metaphysical.

  Priya: And I will grant you that without specifying the predictor, the claim 'X is real' is incomplete. But once specified ideally, it is objective.

  Tom: Then we agree on the maths, but disagree on what the maths represents.

  Priya: It seems so. The compression is real. The question is whether reality is what compresses, or what survives compression.

  Tom: And whether the compressor is part of the reality it measures.

  Priya: Which brings us back to the start.

  Tom: Indeed. Pass the tea.

