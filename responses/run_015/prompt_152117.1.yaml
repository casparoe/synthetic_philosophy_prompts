          *   *Arbitrariness:* Redefine as "physical decoupling" (the shape of the codon doesn't chemically force the amino acid; the tRNA synthetase bridges the gap). This doesn't require history, just current physical structure.

  7.  **Refining the Argument (Self-Correction/Nuance):**
