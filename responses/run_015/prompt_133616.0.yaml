  2.  **Deconstruct the Core Philosophical Tension:**

      *   *Williams's Point:* Moral theories (especially Utilitarianism) demand an alienating distance between the agent and their projects. The "one thought too many" problem.
      *   *The Twist:* It's not just about love (wife drowning); it's about *identity-constituting practices* (Archival Integrity). This adds a temporal/narrative dimension. It's not just "I love her," it's "I am the keeper of this story."
      *   *The Challenge:* How to validate these projects without collapsing into "might makes right" or "my feelings justify anything" (nepotism).
      *   *The Deliberative Paradox:* Thinking about *why* I do it ruins the *doing* of it, but blind instinct isn't enough for moral agency.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Phenomena to Explain.*
          *   Need to capture the "drowning wife" intuition (immediacy).
          *   Need to capture the "archival" intuition (narrative continuity).
          *   Need to explain the "alienation" felt when morality demands stepping back.
      *   *Category 2: Distinctions to Preserve.*
          *   Integrity vs. Preference (stubbornness vs. identity).
          *   Deliberative Suppression (choosing not to calculate) vs. Motivational Absence (incapable of calculating).
          *   Overridable Projects vs. Constitutive Projects (some projects define *who* I am).
          *   Legitimate Partiality vs. Nepotism/Corruption.
      *   *Category 3: Puzzles to Dissolve.*
          *   "One Thought Too Many" (why does justification undermine motivation?).
          *   "Moral Remainder" (the guilt/residue when I sacrifice my project for morality, or vice versa).
          *   The "Archival Paradox" (truth vs. coherence).
      *   *Category 4: Empirical/Action Constraints.*
          *   Cannot contradict basic facts about how intentions form (philosophy of action).
          *   Cannot contradict moral psychology (e.g., dual-process theory, role of emotion in judgment).
      *   *Category 5: Conflict Flagging.*
          *   Universalizability vs. Radical Particularity.
          *   Transparency (justification) vs. Opacity (flow/absorption).

  4.  **Developing the "Archival Integrity" Constraint:**

      *   This needs to be woven into the desiderata, not just tacked on. It complicates the "wife" case because it's not just emotional attachment; it's *normative* attachment to a practice.
      *   *Desideratum:* The theory must explain how a project can be *objective* enough to claim authority over the agent (custodianship) but *particular* enough to conflict with impartial morality.

  5.  **Refining the Distinctions:**

      *   *Deliberative Suppression:* Williams suggests we shouldn't calculate. But a moral agent *can*. The theory needs to explain when it's *virtuous* not to calculate.
      *   *Integrity vs. Preference:* If I just like stamp collecting, is that a ground project? No. It needs to be identity-constituting. How does the theory mark this boundary?

  6.  **Evaluating the Big Three (Briefly):**

      *   *Utilitarianism:* Fails the "One Thought" test. Struggles with Archival Integrity (truth/coherence usually subordinate to utility). Good on Universalizability.
      *   *Kantianism:* Good on distinctions (duty vs. inclination), but struggles with the "vitiation" claim (duty *requires* reflection). Archival integrity looks like heteronomy unless framed as a perfect duty to self (hard to do).
