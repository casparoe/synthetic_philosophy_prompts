      *   *Check:* Is the tone appropriate? *Adjustment:* Keep it dense, precise, and normative regarding theory construction. Avoid colloquialisms.
      *   *Check:* Did I avoid summarizing Williams? *Adjustment:* Refer to his arguments only as the *target* of the desiderata, not as the content.
      *   *Check:* Did I address the "vitiation" of attachment? *Adjustment:* Make sure the "Transparency vs. Opacity" tension highlights this.

  9.  **Final Polish:** Check against the prompt's specific list of requirements (phenomena, distinctions, puzzles, empirical findings, flagged pairs, brief evaluation). Ensure the "Archival" example is integrated, not just mentioned. (The Historian example needs to be central to the "Puzzles" section).

