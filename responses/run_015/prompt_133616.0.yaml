answer: |-
  # Evaluative Framework: Moral Motivation, Ground Projects, and Archival Integrity

  ## Introduction
  This document specifies the desiderata for any moral theory claiming to adequately adjudicate the relationship between impartial moral demands and agent-relative ground projects. Moving beyond the binary of defending or refuting Bernard Williams's integrity objection, this framework treats the "drowning spouse" and the "archival custodian" as limit-cases for moral psychology and practical reason. An adequate theory must not merely accommodate these cases but explain the structural conditions under which personal commitments constitute integrity rather than bias.

  ## I. Phenomenological Desiderata
  *An adequate theory must provide an account of the lived experience of moral agency that explains the following phenomena without reductionism:*

  1.  **The Phenomenon of Immediacy:** The theory must explain why, in cases of deep attachment (e.g., saving a drowning spouse), the motivation to act appears phenomenologically prior to moral justification. The agent experiences the impulse to save as *direct*, not as the conclusion of a syllogism.
  2.  **The Phenomenon of Alienation:** The theory must account for the sense of estrangement an agent feels when required to justify a ground project via impartial calculus. It must explain why translating a ground project into the currency of general utility or universal law can feel like a betrayal of the project itself.
  3.  **The Phenomenon of Narrative Continuity (Archival Integrity):** The theory must accommodate cases where the ground project is not merely emotional but *historical*. In the case of the historian-custodian, the theory must explain the moral weight of preserving a community's self-understanding. It must account for the intuition that destroying archival coherence (even for truth/justice) can constitute a harm to the *identity* of the community that impartial rules fail to register.
  4.  **The Phenomenon of Motivational Vitiation:** The theory must explain why the insertion of a deliberative step ("I may save her because...") can degrade the quality of the action. It must clarify how moral reflection can act as a solvent on the very attachment that gives the action its moral significance.

  ## II. Conceptual Distinctions
  *To avoid collapsing into subjectivism or rigid legalism, the theory must preserve the following distinctions:*

  1.  **Integrity vs. Mere Preference:** The theory must distinguish between a ground project that constitutes the agent's practical identity (integrity) and a project that is merely a strong desire or hobby (preference). Saving a spouse is integrity; saving a spouse because they own a rare car is preference. The criterion for this distinction cannot simply be "intensity of feeling."
  2.  **Deliberative Suppression vs. Motivational Absence:** The theory must distinguish between an agent who *can* calculate impartial reasons but chooses not to (suppression) and an agent for whom such calculation is motivationally inert (absence). Williams implies the latter is necessary for integrity; the theory must determine if the former is permissible or if suppression itself is a form of bad faith.
  3.  **Constitutive vs. Contingent Projects:** The theory must distinguish between projects that define *who* the agent is (constitutive) and those the agent merely *has* (contingent). Only the former should potentially trump impartial demands. The theory must provide criteria for when a project becomes constitutive (e.g., duration, social embedding, reflexivity).
  4.  **Legitimate Partiality vs. Nepotism/Corruption:** The theory must explain why saving a spouse is morally distinct from hiring a nephew. Both involve partiality. The distinction likely rests on the nature of the relationship (reciprocal recognition vs. instrumental advantage) and the domain of action (emergency rescue vs. public distribution). The theory must specify these boundaries.
  5.  **Archival Coherence vs. Historical Falsification:** In the archival case, the theory must distinguish between contextualizing a record to preserve communal self-understanding (integrity) and actively suppressing truth to protect power (corruption). This requires a metric for "healthy" vs. "pathological" collective narratives.

  ## III. Explanatory Puzzles to Dissolve
  *The theory must resolve the following theoretical impasses:*

  1.  **The "One Thought Too Many" Problem:** The theory must explain how an action can be morally right *and* morally worthy even if it bypasses explicit moral reasoning. It must dissolve the tension between the *justification* of an act (which seems to require reasons) and the *motivation* of an act (which seems to require absorption).
  2.  **The Problem of Moral Remainder:** When an agent sacrifices a ground project for an impartial moral demand (or vice versa), there is often a residue of guilt or loss that rational justification does not erase. The theory must explain the ontological status of this remainder. Is it irrational guilt, or does it signal a genuine moral loss that the prevailing moral system cannot codify?
  3.  **The Archival Paradox:** The theory must address the conflict between the moral demand for truth (impartial justice) and the ethical demand for continuity (archival integrity). If the historian suppresses a damaging truth to preserve the community's capacity for self-understanding, has she acted immorally? The theory must provide a mechanism for weighing narrative survival against factual transparency without defaulting automatically to impartial truth-telling.
  4.  **The Regress of Reflection:** If acting from attachment requires the belief that the attachment is permissible, does that belief require further justification? The theory must stop the regress without dogmatism. It must explain how ground projects can be "reason-giving" without themselves requiring external moral validation.

  ## IV. Empirical and Action-Theoretic Constraints
  *The theory cannot contradict established findings in the following domains:*

  1.  **Moral Psychology (Dual-Process):** The theory must be compatible with the finding that moral judgment often involves fast, emotional processing (System 1) and slower, deliberative processing (System 2). It cannot demand that all morally worthy action arises from System 2.
  2.  **Philosophy of Action (Intentionality):** The theory must respect the structure of intentional action. An agent must know what they are doing under some description. If the agent is "opaque" to their own motives (deep attachment), the theory must explain how the action remains intentional and not merely behavioral.
  3.  **Developmental Psychology (Attachment):** The theory must align with the understanding that moral agency develops *through* particular attachments, not prior to them. A theory that requires agents to transcend particularity to achieve moral status contradicts the developmental trajectory of moral competence.

  ## V. Flagged Tensions (Jointly Unsatisfiable Desiderata)
  *The seminar must explicitly grapple with the possibility that the following pairs of desiderata cannot be simultaneously satisfied. A theory may need to prioritize one over the other:*

  1.  **Universalizability vs. Radical Particularity:**
      *   *Tension:* Moral theories typically demand that reasons be universalizable (if it's right for me, it's right for anyone in relevantly similar circumstances). However, ground projects and archival integrity rely on the *uniqueness* of the relationship or the history (my wife, *this* community's archive).
      *   *Conflict:* Satisfying the demand for universal justification may require translating the particular project into general terms, which triggers the "Motivational Vitiation" phenomenon. Satisfying the particularity demand risks collapsing into relativism where "my project" justifies anything.
  2.  **Transparency vs. Opacity:**
      *   *Tension:* Moral justification requires transparency (the agent must be able to articulate why the act is right). Deep attachment and archival custodianship often rely on opacity (absorption, tacit knowledge, unarticulated tradition).
      *   *Conflict:* Demanding transparency may destroy the integrity of the opaque practice (the historian who constantly questions the archive may destroy its coherence). Demanding opacity makes the agent unaccountable to moral critique.
  3.  **Moral Sovereignty vs. Constitutive Vulnerability:**
      *   *Tension:* Moral agency is often conceived as sovereign (the ability to step back and choose). Yet ground projects constitute the agent (the agent is *made* by the project).
      *   *Conflict:* If the agent can step back and evaluate the project, is it truly constitutive? If the agent cannot step back, are they truly moral agents or merely vessels of tradition?

  ## VI. Brief Comparative Assessment of Standard Accounts
  *This assessment is not a defense but a mapping of where standard theories strain against the desiderata.*

  1.  **Utilitarian/Consequentialist Accounts:**
      *   *Strengths:* Strong on Universalizability and Transparency. Clearly distinguishes Nepotism from Legitimate Partiality (via rule-utilitarian calculations).
      *   *Weaknesses:* Fails the "Motivational Vitiation" test (calculation is always required). Struggles with Archival Integrity (truth/utility usually trumps narrative coherence). Cannot easily explain Moral Remainder (if utility is maximized, nothing is lost). Risks reducing Integrity to Preference.
  2.  **Kantian/Deontological Accounts:**
      *   *Strengths:* Strong on Moral Sovereignty and Distinctions (Duty vs. Inclination). Preserves the agent's rational agency.
      *   *Weaknesses:* Struggles with the "One Thought Too Many" problem (moral worth is tied to duty-consciousness). Archival Integrity is difficult to frame as a Categorical Imperative without becoming overly specific. Risks Alienation by demanding the agent view their attachments from the standpoint of the "kingdom of ends."
  3.  **Virtue-Ethical/Practical Wisdom Accounts:**
      *   *Strengths:* Best fit for Immediacy and Opacity (the virtuous act flows from character). Accommodates Archival Integrity via the concept of tradition-constituted rationality (MacIntyre). Explains Moral Remainder via the tragedy of conflicting goods.
      *   *Weaknesses:* Struggles with Universalizability (risk of communitarian relativism). The distinction between Integrity and Preference can become opaque (who defines the virtue?). May lack resources to critique pathological archival practices (if the tradition is corrupt, does practical wisdom see it?).

  ## VII. Seminar Directive
  Participants are to use this framework not to select a winning theory, but to locate the precise point of failure for each. The primary task is to determine whether the tension between **Archival Integrity** (the demand to preserve a particular narrative identity) and **Moral Transparency** (the demand to justify actions via impartial reason) is a bug of moral life or a feature that demands a new taxonomy of agency.
