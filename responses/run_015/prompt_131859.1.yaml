answer: |-
  ### The Brexit Referendum through the *Tractatus Politicus*: A Spinozist Analysis

  Baruch Spinoza's *Tractatus Politicus* (TP) posits that democracy is the "most absolute" form of government because, in it, the sovereign power is identical to the collective power of the multitude (*multitudo*). However, this absoluteness is conditional: the state remains stable and free only insofar as the multitude is guided by reason and "common notions" (adequate ideas regarding what is useful to all) rather than by passive affects (fear, hope, resentment). The 2016 United Kingdom European Union membership referendum offers a stark case study for this framework. When mapped onto Spinoza's philosophy, the referendum appears not as an exercise of democratic *potentia* (power), but as a convergence of fragmented passive affects that temporarily seized the apparatus of the state, resulting in the instability Spinoza predicts when reason is absent from the public sphere.

  #### I. Mapping the Referendum: Multitude, Options, and Affects

  To analyze the referendum Spinozistically, we must first identify the *multitudo*. In the TP, the multitude is not merely a headcount of subjects but the collective striving (*conatus*) of individuals whose powers are combined. In the 2016 referendum, the multitude was constituted by the electorate (approximately 33 million voters). However, Spinoza distinguishes between a multitude united by a common rational purpose and a crowd united only by a shared passion. The referendum mechanism atomized the multitude into individual voters aggregating preferences, rather than a deliberative body forming a collective mind.

  The options presented were binary: "Remain" or "Leave." For Spinoza, political questions are rarely binary; they involve complex adjustments of law and alliance to maximize the *potentia* of the state. By reducing a complex geopolitical reality to a binary choice, the referendum forced the multitude to decide based on imagination rather than adequate knowledge. The "payoffs" were fundamentally uncertain. Spinoza argues in the *Ethics* that hope and fear are twin passions arising from uncertainty regarding a future good or evil. The campaign dynamics exploited this precisely:
  *   **The "Remain" campaign** relied heavily on *fear* (economic instability, loss of security).
  *   **The "Leave" campaign** relied on *hope* (imagined national glory, recovered sovereignty) and *resentment* (against elites and immigration).

  Neither side successfully appealed to "common notions." A common notion in this context would be an adequate idea of the EU's function—e.g., a clear understanding of trade interdependence or the legal nature of sovereignty shared among citizens. Instead, the debate was populated by inadequate ideas: the claim that £350 million per week could be redirected to the National Health Service, or the assertion that remaining would inevitably lead to a Turkish accession to the EU. These are products of the imagination, not reason. Consequently, the vote did not express the rational power of the multitude, but rather the temporary dominance of specific passive affects. The multitude acted, but it was acted upon by external causes (campaign rhetoric, media fragmentation) rather than acting from its own nature (reason).

  #### II. Legitimacy: Continuous Deliberation vs. Aggregated Preference

  Spinoza's implicit condition for democratic legitimacy in the TP is continuous collective deliberation within a council structure, not the aggregation of private preferences at a single moment. In TP Chapter 11, Spinoza describes a democracy where laws are established by a large council representing the whole populace. The legitimacy arises because the size of the council makes it unlikely that a majority would conspire to act irrationally against their own interest, *provided* the institutions channel affects toward rationality.

  A one-time referendum fails this criterion. It captures the *fluctuatio animi* (vacillation of the mind) of the multitude at a specific historical juncture, freezing a transient passion into a binding mandate. Spinoza warns that when the multitude is guided by passion, it is "inconstant." By treating the referendum result as a sacred decree ("The Will of the People"), the political system attempted to ossify a passive affect into law.

  Does this collapse into aristocracy? Spinoza defines aristocracy as rule by a selected council. In the aftermath of the referendum, a tension arose between the "will" expressed in the plebiscite and the deliberative body (Parliament). When the executive sought to bypass Parliament to trigger withdrawal (the *Miller* case context), it resembled an aristocratic or monarchical maneuver to enforce the passion of the moment against the deliberative check of the council. Conversely, one could argue the referendum created a "tyranny of the majority" where a temporary coalition of passions (Leave voters) imposed its private affects on the minority (Remain voters) without the mediating structure of a council designed to moderate those affects.

  Here, Spinoza's framework is partially silent. He does not explicitly address plebiscites, as they were not a feature of 17th-century governance. He assumes representation via councils. However, applying his logic: a mechanism that bypasses the moderating influence of deliberative councils in favor of direct emotional aggregation lacks the structural safeguards required to transform private affects into public utility. Therefore, under Spinozist criteria, the referendum lacked democratic legitimacy not because it was undemocratic in a modern procedural sense, but because it was a mechanism of passion rather than reason. It treated the multitude as a source of command (*imperium*) without the requisite formation of a rational common mind.

  #### III. The Aftermath: Instability, Dissolution, and Survival

  Spinoza suggests that a state guided by passive affects is unstable and prone to dissolution. He writes that a government is stable only if its laws are such that men are led by reason as far as possible; if they are led only by affects, the state is in a constant state of war with itself. The immediate aftermath of the referendum confirms this diagnosis of instability.

  The "political chaos" cited in the prompt maps cleanly onto Spinoza's concept of a state suffering from internal *affectus* conflict:
  1.  **Breakdown of Party Discipline:** Political parties, which function as mini-councils to organize affects, fractured because the referendum cut across rational policy alignments with irrational emotional loyalties.
  2.  **The Prorogation Crisis:** The attempt by the executive to suspend Parliament to force through the withdrawal agenda was a quintessential Spinozist crisis. It represented an attempt by a faction (the executive) to impose a specific affect (urgency of Brexit) against the deliberative power of the council (Parliament). Spinoza would view this as a move toward tyranny, where the sovereign power tries to override the checks that maintain the balance of the multitude's power.
  3.  **Prolonged Difficulty:** The inability to implement the result for three years indicates that the "command" issued by the multitude was not an adequate idea. An adequate idea contains within itself the means of its execution. A decision based on imagination (e.g., "we can leave without economic cost") encounters resistance from reality (trade barriers, border issues), causing the state to stall.

  Does the state's ultimate survival and execution of withdrawal contradict Spinoza? Not necessarily. Spinoza distinguishes between the mere persistence of a regime and its *power* (*potentia*). A state can survive while its power is significantly diminished. The UK remained a sovereign entity, but its internal cohesion and external influence were weakened. The friction, economic contraction, and social polarization following the vote indicate a reduction in the collective power of the multitude to act in concert.

  Furthermore, Spinoza argues that indignation (resentment) is always harmful to a state. The Leave campaign successfully mobilized indignation against the EU and domestic elites. Spinoza predicts that a state founded on indignation will struggle to maintain unity once the common enemy is removed or the initial passion fades. The subsequent decade of political turbulence in the UK suggests the state is still managing the fallout of that initial passive affect. The survival of the state does not prove the decision was rational; it merely proves the *conatus* of the state was strong enough to endure the self-inflicted wound.

  #### IV. Limitations and Silence in the Framework

  While the mapping is robust, there are points where Spinoza's framework is silent or requires careful handling.
  1.  **Scale:** Spinoza writes with city-states or small provinces in mind. The application of his council-based democracy to a nation-state of 65 million people is an extrapolation. He does not account for the mediation of mass media, which amplifies passive affects in ways 17th-century rumor mills could not.
  2.  **International Relations:** Spinoza's TP focuses heavily on internal stability. While he acknowledges states exist in a state of nature with each other, his primary concern is the internal *potentia* of the sovereign. The complexities of supranational entities like the EU are outside his explicit taxonomy. We must infer that any alliance increasing the *potentia* of the citizens is rational, but Spinoza does not provide a specific metric for international trade blocs.
  3.  **The "Right" Outcome:** Spinoza does not provide a moral verdict on leaving the EU *per se*. If the multitude had voted Leave based on adequate ideas (e.g., a rational calculation that sovereignty outweighed trade benefits), Spinoza would support it. The critique is not of the *result*, but of the *cause* of the decision (passion vs. reason). We must avoid importing contemporary liberal democratic theory which might judge the vote by standards of "informed consent" distinct from Spinoza's "adequate ideas."

  #### Conclusion

  Analyzed through the *Tractatus Politicus*, the 2016 Brexit referendum was a democratic procedure that failed to achieve democratic rationality. It mobilized the *multitudo* not through common notions of shared utility, but through fragmented passive affects of fear and imagined glory. Because the mechanism relied on aggregated preference rather than continuous deliberation, it lacked the legitimacy of a rational decree, leading to the institutional instability and factionalism Spinoza predicts when passion governs the state. The subsequent political chaos was not an anomaly but a confirmation of Spinoza's physics of politics: a state cannot long maintain coherence when its foundational commands are derived from inadequate ideas. The UK state survived, but in Spinozist terms, its *potentia*—its capacity to act freely and rationally—was demonstrably diminished by the transition from a politics of reason to a politics of affect.
