      *   Precise concepts? Yes.
      *   Acknowledge silence? Yes.
      *   No contemporary theory import? Yes.

  6.  **Final Polish:** Check tone (analytical, philosophical). Ensure Spinoza's Latin terms (*multitudo*, *conatus*, *affectus*) are used correctly. (Proceed to generate output).

  *(Self-Correction Note during final review)*: I need to be careful not to judge Brexit politically (Good/Bad) but Spinozistically (Rational/Passive). The prompt asks for an analysis of the *mechanism* and *affects*, not the moral rightness of leaving the EU. Focus on the *process* of decision-making.

  *(Refining the "Aristocracy" point)*: Spinoza defines aristocracy as rule by a selected council. If a referendum creates a mandate that bypasses the deliberative council (Parliament), does it create a de facto aristocracy of the campaign leaders? Or does it turn the democracy into a mob? The prompt suggests: "collapses into a form of aristocracy in which a temporary majority imposes its private passions on the minority." I should interpret this as the *result* of the vote becoming a rigid dogma enforced by a political class, effectively ruling *over* the multitude rather than *as* the multitude.

  *(Refining "Common Notions")*: What would a common notion look like here? An adequate idea of trade, sovereignty, or international cooperation. The campaign offered *imaginary* ideas (e.g., £350m/week for NHS, immediate recession). These are inadequate ideas.

