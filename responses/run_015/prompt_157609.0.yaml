      *   **Position:** Tightly restricted deflationary position on truth *within quantitative predictive modeling*. Truth = redundant calibration marker (predictive score within confidence interval). Truth has no explanatory/causal role.
      *   **Scope:** Only formal scientific representation (not ordinary language or ethics).
