      *   *Novel Prediction:* Models predicting *new* phenomena (not just fitting existing data). Deflationism struggles to explain why fit on *old* data guarantees success on *new* data without invoking some notion of "grasping reality."
      *   *Idealization/Falsehood:* Successful models often contain known falsehoods (e.g., frictionless planes, infinite populations). If the model is known to be false in assumptions but "true" in output, does the deflationary definition hold?
      *   *Reference/Fixing:* How do we know M is about S? If truth is just output matching, reference becomes opaque.
      *   *Explanatory Depth:* Some models predict well but explain nothing (phenomenological). Others predict and explain (mechanistic). Deflationism flattens this distinction.
      *   *Model Selection/Overfitting:* A high-degree polynomial fits data perfectly (high "truth" score) but is useless. Deflationism needs to distinguish fit from validity.

