  This is a fascinating dataset. Your committee isn't operating on a single consistent principle; you are oscillating between **Legal Positivism** (was it legal at the time?) and **Moral Contextualism** (was the power dynamic inherently coercive?).

  Here is an analysis of the competing rules embedded in your five precedents, a prediction on the Ivory Tusk, a stress-test hypothetical, and the underlying principles at stake.

  ### 1. Decoding Your Five Precedents
  Your decisions reveal three distinct, often conflicting, logical frameworks:

  *   **Rule A: The "Direct Violence" Standard (Cases 1 & 5)**
      *   *Precedents:* Benin Bronzes (1897 Raid); Khmer Statue (1984 Genocide).
