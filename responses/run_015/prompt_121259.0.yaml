  *   **Rule B: The "Formal Legality" Standard (Cases 2 & 4)**
      *   *Precedents:* Parthenon Marbles (Ottoman Firman); Nigerian Plaque (1971 Biafra).
      *   *Logic:* If a governing authority (Ottoman Empire) granted permission, or if there was no *direct* state coercion at the moment of sale (fleeing civilians vs. state seizure), the museum retains title.
