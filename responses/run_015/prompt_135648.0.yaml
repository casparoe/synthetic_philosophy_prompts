      *   **Question 4: Is the policy incoherent if Hofstadter is right?**
          *   This is the crux. Hofstadter says Frame determines *how* you read the Outer to get the Inner.
          *   If the Frame says "This is a Contract," that changes how you read "I promise to pay."
          *   *Incoherence Check:* The policy isn't necessarily *incoherent*, but it is **philosophically naive** or **pragmatically restrictive**. It creates a "fiction" that the Outer stands alone.
          *   *Refinement:* It's not logically incoherent (it's a consistent rule set), but it might be *interpretively* unstable. If the Frame changes (e.g., a header says "Draft Only"), the Outer text's meaning changes completely. If editors fix the Frame without realizing its semantic weight, they might break the meaning. So, the *workflow* is risky, even if the *rule* is consistent.

