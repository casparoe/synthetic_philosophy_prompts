          *   It treats the Frame as *syntactic* rather than *semantic*.

      *   **Question 2: Does it assume Frame carries no semantic weight?**
          *   Yes, effectively. By relegating headers/formatting to "copy editing" and forbidding changes to clauses, the policy treats the Frame as purely functional (like the envelope), not part of the letter.
          *   *Counter-point:* In law, headers *do* matter (e.g., "Section 4.1: Liability"). But the *policy* pretends they don't carry independent meaning that could override the text.

      *   **Question 3: Is Inner Message accessible only on conflict?**
