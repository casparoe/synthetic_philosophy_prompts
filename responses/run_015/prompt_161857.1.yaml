answer: |-
  Here is an analysis of the summary, the philosophical distinctions, and their application to your characters.

  ### Sentence-by-Sentence Critique

  **1. "Williams's objection from integrity is the objection that utilitarianism requires each of us to treat our own deepest commitments — the projects that make a life worth living — as one more entry in the global ledger of happiness, to be set aside whenever the sum would be better served elsewhere."**
  *   **Williams Sympathizer:** Accepts. This accurately describes the "impartial standpoint" that Williams attacks.
  *   **Wince:** None. This is the standard setup for the "Jim and the Indians" thought experiment.
  *   **Utilitarian Reply:** A sophisticated utilitarian (e.g., a rule-utilitarian) might argue that a world where people pursue ground projects generally produces more happiness than one where everyone calculates constantly. Thus, the "ledger" should value integrity instrumentally.

  **2. "Because such commitments are what give a person her identity, that demand alienates her from her own agency..."**
  *   **Williams Sympathizer:** Accepts. This is the core of the alienation argument: if the *source* of my action is the utility calculus rather than *my* desire, I am merely a conduit for satisfaction, not an agent.
  *   **Wince:** "Identity" is a slightly modern psychological gloss on Williams's term "ground projects," but it functions well enough for fiction.
  *   **Wrong:** None.

  **3. "...and integrity, in the sense of sticking to your principles whatever it costs you, matters more than a marginal gain in aggregate welfare."**
  *   **Williams Sympathizer:** **Major Wince.** This misdefines integrity. For Williams, integrity is not about stubborn adherence to principles (that sounds like Kant or common sense morality). It is about the relationship between the agent and the action. It is not a *competing value* to be weighed against welfare (i.e., Integrity Points vs. Happiness Points).
  *   **Wrong:** This suggests integrity is a trump card within the same game. Williams argues the *game itself* (the impartial calculus) is the problem.
  *   **Utilitarian Reply:** If integrity is just "sticking to your principles," then a terrorist has integrity. Utilitarians argue integrity must be constrained by the harm it causes others.

  **4. "The famous 'one thought too many' argument makes the same point from inside the agent's head."**
  *   **Williams Sympathizer:** **Wince.** It does not make the *same* point. (See distinction below).
  *   **Wrong:** Conflating two distinct arguments weakens both.

  **5. "Since a utilitarian has to work out which act maximises welfare before she can act, a man who pulls his wife from a burning house rather than a stranger must think, first, that it is his wife, and then, as a separate step, that saving her is permitted by impartial morality..."**
  *   **Williams Sympathizer:** Accepts the setup of the example.
  *   **Wince:** This targets *Act Utilitarianism*. A *Disposition Utilitarian* would argue the man should have a loving disposition that doesn't calculate. Williams anticipates this and replies that the disposition must still be *justified* by the calculus ultimately, which ruins the spontaneity.
  *   **Utilitarian Reply:** We don't calculate every act. We cultivate instincts. Saving your wife is a heuristic that usually maximizes welfare.

  **6. "...and the second thought cancels the love the first expressed, so the relationship is destroyed the moment morality is consulted."**
  *   **Williams Sympathizer:** Accepts the emotional core. The justification corrupts the motive.
  *   **Wince:** "Destroyed" is hyperbolic, but "corroded" is accurate.
  *   **Wrong:** None.

  **7. "Williams's conclusion was that consequentialism is refuted — it cannot so much as permit us to favour the people we love..."**
  *   **Williams Sympathizer:** **Wrong.** Williams is rarely this dogmatic about "refutation." He argues consequentialism is *unacceptable* or *incoherent* as a total account of life, not that it is logically disproven like a math theorem.
  *   **Utilitarian Reply:** Consequentialism *can* permit favoring loved ones if doing so (via dispositions) maximizes overall good.

  **8. "...and that the moral life has to be rebuilt on personal attachments and partial concerns rather than on any impartial standpoint."**
  *   **Williams Sympathizer:** **Wince.** Williams is skeptical of "rebuilding" the moral life into a new system. He prefers we acknowledge the messiness of ethical life without seeking a single "standpoint."
  *   **Wrong:** Suggests Williams offers a positive theory. He mostly offers a negative critique.

  ---

  ### Integrity vs. One Thought Too Many

  You are correct to suspect these are run together. They are distinct tools in Williams's kit.

  1.  **The Integrity Objection (Jim and the Indians):** This is about **Agency and Responsibility**. It asks: *Who is acting?* If I kill one innocent person to save nineteen because the utilitarian calculus demands it, I have allowed the *system* to act through me. I have lost my integrity because my action is not an expression of *my* convictions, but of an external demand. It targets the **cost to the agent** of being a vessel for utility.
  2.  **The One Thought Too Many (Burning House):** This is about **Motivation and Relationships**. It asks: *What am I thinking?* If I save my wife because I have calculated that doing so is permissible under impartial morality, I have misunderstood love. Love does not seek impartial permission. It targets the **psychological structure** required by the theory.

  **Do they stand or fall together?**
  They target the same theory (Act Consequentialism) but different features. You could theoretically solve the "One Thought" problem by saying "We should train people not to think" (Disposition Utilitarianism). However, the Integrity objection would remain: even if you don't *think* it, the *justification* for your training is still that it serves the global sum, which still alienates you from your own life. The Integrity objection is the deeper, structural critique; the "One Thought" argument is the phenomenological illustration of it.

  ---

  ### The Scene: Permission or Complaint?

  On the corrected version of the objection, Williams does **not** give Verity a permission slip to say, "My opera is worth more than 200 lives." That would be playing the utilitarian's game (weighing values).

  Instead, Williams gives her a **complaint about the demand itself.**

  *   **What she cannot claim:** She cannot claim that the aesthetic value of the opera objectively outweighs the moral value of 200 lives. If she argues this, she has accepted her brother's premise that everything must be weighed on a single scale.
  *   **What she can claim:** She can claim that the demand to *abandon her ground project* is an attack on her status as a moral agent. She can say: "If I do what you ask, I am not saving lives; *you* are saving lives through me. I cease to exist as a person and become a logistics channel."

  **Does it vindicate her?**
  It vindicates her *refusal*, but not necessarily the *value* of her work. It validates that a life without ground projects is not a human life, even if those projects don't maximize utility. It functions as a **shield**, not a sword. It protects her right to have a life, but it does not prove her life is "better" than the charity work.

  **Novelistic Application:**
  Verity should not try to out-calculate her brother. She should reject the calculus. Her honesty comes from admitting she *cannot* do the charity work without ceasing to be Verity. She is not choosing the Opera *over* the lives; she is choosing *herself* over being an instrument.

  ---

  ### The Collector: Does Integrity Protect Him?

  This is the famous "Nazi Problem" for Williams. If integrity is just about sticking to *your* projects, does it protect the Nazi's commitment to genocide?

  Williams admits this is a difficulty, but there are resources to distinguish Verity from the Collector without abandoning Williams's view.

  1.  **Negative vs. Positive Responsibility:** Verity is refusing to *prevent* harm (omission). The Collector's project is *built on* harm (commission). Williams argues we are not responsible for all the bad we don't prevent, but we *are* responsible for the bad we actively cause. The Collector is actively complicit in the ruin of others; Verity is refusing to be the savior of others. Williams's integrity objection protects you from being *used*; it does not protect you *using others*.
  2.  **The Content of Ground Projects:** Williams assumes "ground projects" are broadly human and social. A project that requires the *destruction* of other people's ground projects (the Collector ruining lives to get artifacts) is parasitic. It cannot be universalized even in Williams's loose sense. Verity's opera reconstructs a past life; it does not consume present ones.

  **For your novel:**
  You do not need to rewrite the Collector, but you must ensure his project involves *active harm* (commission), not just aesthetic obsession. If his collection is merely "found" but he ignores the suffering that created it, he is closer to Verity. If his collection *requires* him to facilitate ruin, Williams would not grant him the same shield. The Integrity objection protects the *agent's* life, not the agent's *predation*.

  ---

  ### Action vs. Deliberation

  You are right to sense a difference.
  *   **The Integrity Objection** is about **Action**: It concerns the source of the deed. (Did *I* do this, or did the Calculus do this through me?)
  *   **The One Thought Too Many** is about **Deliberation**: It concerns the mental process. (Did I calculate this, or did I love?)

  **For Verity's Interiority:**
  If you rely on the "One Thought Too Many," Verity must *not* calculate. If she sits there and thinks, "My integrity is worth 200 lives," she has had one thought too many. She has turned her integrity into a utility value.

  To write this faithfully to Williams, her realization should not be a calculation. It should be a recognition of **impossibility**. She cannot view the choice as a trade-off. The moment she accepts the frame "Opera vs. Lives," she has lost. Her refusal must feel like a rejection of the frame itself. She doesn't decide the Opera is *better*; she decides the question is *illegitimate*.

  ---

  Verdict: Partly fair, but you must correct the definition of integrity from "stubborn adherence to principles" to "ownership of one's actions," or Verity will sound like she is claiming moral superiority rather than defending her humanity.
