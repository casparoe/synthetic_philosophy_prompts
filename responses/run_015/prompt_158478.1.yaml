answer: |-
  ### Brainstorming & Theoretical Grounding

  Before adjudicating, I need to situate this debate within the philosophy of history and archival theory.
  *   **Jordan's Position:** Leans toward a radical hermeneutic skepticism. Reminiscent of early post-structuralist worries about the "death of the author" applied to history. If the trace is gone, the meaning is unrecoverable. Risks historical nihilism.
  *   **Riley's Position:** Leans toward structural materialism and the "archival turn" (Foucault, Stoler, Trouillot). Archives are not neutral repositories but active factories of truth. Silences are *produced*.
  *   **Key Tension:** Epistemic humility (Jordan) vs. Political/Structural analysis (Riley).
  *   **The Blind Spot:** Both are obsessed with *absence* (what isn't there). They are under-analyzing *presence* (what is there, but distorted). Power doesn't just delete; it categorizes, pathologizes, and bureaucratically translates lived experience into administrative data. This is the "violence of inclusion."

  ***

  ### Adjudication of Moves

  Here is the rating and analysis of each move, ranging from **Clearly Mistaken** to **Clearly Right**.

  #### Move 1: Jordan
  **Rating:** **Partially Right (but Epistemically Defeatist)**
  **Justification:** Jordan is right to warn against presentism—the tendency to project contemporary values onto the past. Historians *do* sometimes treat silence as a blank canvas for their own politics. However, Jordan is wrong to claim *every* silence is "opaque." This assumes all silences are accidental or random. It ignores the possibility that the *mechanism* of silencing leaves its own trace. By declaring recovery impossible, Jordan inadvertently protects the status quo of the archive, suggesting that if we can't hear the voice perfectly, we shouldn't try to hear it at all.

  #### Move 2: Riley
  **Rating:** **Clearly Right**
  **Justification:** This is the strongest methodological point in the debate. Riley correctly identifies that silences are often *produced* rather than accidental. This aligns with Michel-Rolph Trouillot's concept of "silences in the making" and Ann Stoler's work on colonial archives. "Negative provenance" is a valid heuristic: if the protocol demands a record and it is missing, or if a memo orders non-documentation, the absence itself becomes a positive piece of evidence regarding power dynamics. Riley successfully shifts the question from "what is missing?" to "why is this missing?"

  #### Move 3: Jordan
  **Rating:** **Mixed (Right on Limits, Wrong on Motivation)**
  **Justification:** Jordan is **right** that proving suppression does not equal recovering the *content* of the suppressed speech. We cannot know exactly what the workers felt, only that they were prevented from speaking. However, Jordan is **wrong** to dismiss structural analysis as merely "constructing a victimization narrative." Analyzing power structures is not about assigning victimhood; it's about mapping causality.
  *Crucially*, Jordan makes a vital pivot here: the suggestion that voices might be "present but mislabeled." This is Jordan's best insight, though they use it to support skepticism rather than new inquiry.

  #### Move 4: Riley
  **Rating:** **Clearly Right**
  **Justification:** Riley correctly identifies the false binary. Archival analysis is not about "perfect recovery" vs. "total ignorance." It is about understanding the *conditions of possibility* for knowledge. By admitting Jordan's point (that we might miss distorted voices in the catalogue), Riley demonstrates the necessary epistemic humility Jordan demanded in Move 1, without surrendering the structural analysis from Move 2. This is a mature synthesis: the archive is a political shape, not just a bucket of facts.

  ***

  ### Final Verdict: Who is Right?

  *   **Riley is right on Method:** You can analyze power through absence. Silences are structured, and "negative provenance" is a valid tool for historical inquiry.
  *   **Jordan is right on Epistemic Limits:** You cannot fully recover the interiority (feelings/thoughts) of the silenced, and claiming to do so risks ventriloquism.
  *   **Riley is right on the Goal:** The point of archival critique is to expose the political shape of the record, not necessarily to fill every gap with certainty.

  ### What Both Are Missing: The Violence of Categorization

  While Jordan and Riley fight over **exclusion** (what is missing), they both largely overlook how power operates through **inclusion** (what is present but distorted).

  As a philosopher of knowledge, I must point out that the archive is not just a site of silencing; it is a site of **translation**. Power often works by forcing lived experiences into bureaucratic categories that make them legible to the state but unrecognizable to the subject.

  1.  **Pathologizing Presence:** A worker's grievance might not be silenced (Jordan's fear) or prevented from being written (Riley's focus). Instead, it might be recorded as "insubordination," "mental instability," or "criminal mischief." The voice is *in* the archive, but the *category* strips it of political legitimacy.
  2.  **The Grain of the Archive:** Ann Stoler argues we must read "along the grain" of the archive, not just against it. This means analyzing the *terms* used to describe people. If an archive is full of records about a marginalized group, but every record classifies them as "dependents" or "threats," the power lies in the **label**, not the silence.
  3.  **Bureaucratic Distortion:** The act of collecting data changes the data. When a state decides to "count" a population, they define what counts as a person, a family, or a job. Jordan and Riley are arguing over the zeros in the dataset; they are missing how the ones were manufactured.

  **Conclusion:** Riley wins the argument on the mechanics of archival power, but Jordan's skepticism is a necessary brake on historical hubris. However, to truly understand the politics of knowledge, they must stop looking only at the gaps and start interrogating the **labels** on the files that *do* exist. The archive doesn't just hide the truth; it manufactures its own.
