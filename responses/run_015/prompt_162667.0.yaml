          *   Group A (High Charity): Assumes shared background norms of verification. Fills in "They checked." -> Knows.
          *   Group B (Low Charity): Assumes no shared background. Sticks to text. Text says "Luck." -> Doesn't Know.
          *   This works. I will proceed with this mapping.
      *   *Check:* Did I distinguish from "Bad Design"? Yes, need to emphasize that *pragmatic inference* is a feature of cognition, not a bug of the vignette.
      *   *Check:* Steelman the rival. Make sure the "Concept Divergence" view sounds plausible before knocking it down with parsimony and the "thickening" prediction.

  5.  **Final Review against Constraints:**
      *   No citations? Yes.
      *   Use specific terminology (Ascriptive, Reliance-linked, Interpretive Charity, Epistemic Distance)? Yes.
