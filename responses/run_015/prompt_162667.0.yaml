          *   If I have High Charity (Low Distance), I treat them as "one of us." I am willing to rely. I ascribe knowledge.
          *   This aligns well.

      *   *Refining the Ascriptive/Reliance distinction in Names:*
          *   Ascriptive: "Who does the name refer to?"
          *   Reliance-linked: "If I used the name, who would I be talking about?"
