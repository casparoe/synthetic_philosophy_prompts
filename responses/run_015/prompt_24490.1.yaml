answer: |-
  # The F-5 Futarchy Feasibility Protocol
  **Version:** 1.0 (Internal Governance Tooling)
  **Audience:** Engineering Reviewers & Market Design Lead
  **Time Budget:** 4–6 Hours
  **Purpose:** To filter governance proposals that are technically compatible with prediction markets from those that are merely political questions disguised as forecasts.

  **Preface:** Futarchy (governance by prediction market) relies on a specific causal chain: *Policy → Metric → Payout.* If any link in this chain is ambiguous, the market prices noise, not signal. This procedure is a kill-switch. Most proposals should fail.

  ---

  ## Part 1: The Design Procedure

  ### Step 1: Counterfactual Reformulation (The "If-Then" Test)
  **Goal:** Convert a policy question into two tradeable conditional forecasts.
  **Action:** The engineer must rewrite the client's question into a pair of markets.
  *   **Market A:** "What will [Metric] be at [Time T] **IF** Policy P is adopted?"
  *   **Market B:** "What will [Metric] be at [Time T] **IF** Policy P is NOT adopted?"

  **Checklist:**
  1.  **Metric Granularity:** Is the metric a number that can be scraped from a public API, database, or official report? (Yes/No)
  2.  **Temporal Bound:** Is [Time T] specific (e.g., "Dec 31, 2025") rather than vague (e.g., "Once effects are felt")? (Yes/No)
  3.  **Causal Isolation:** Can the metric be measured without knowing *why* it changed? (Yes/No)

  **🛑 STOP CONDITION (Values vs. Prediction):**
  If the client argues about the definition of the *Metric* itself (e.g., "Well, 'success' means different things to different stakeholders"), **STOP.** This is a values dispute, not a prediction problem. Markets cannot resolve normative disagreements. Hand to human governance.

  ### Step 2: Resolution Criterion (The Oracle Specification)
  **Goal:** Define exactly how the market settles to prevent post-hoc litigation.
  **Action:** Specify the "Resolution Oracle."
  *   **Adjudicator:** Is it a specific URL, a specific government dataset, or a designated multi-sig wallet of experts?
  *   **Evidence:** What specific document or data point resolves the market?
  *   **Ambiguity Protocol:** If the data is missing or ambiguous, what is the default? (e.g., "Market voids" or "Metric assumed 0").

  **Requirement:** The resolution source must be **immutable** or **cryptographically verifiable** by the resolution date. If it requires a human committee to interpret "spirit of the law," the market is untradeable.

  ### Step 3: Manipulation & Verification Checks
  **Goal:** Ensure the market price reflects information, not capital power.
  **Action:** Run the following risk assessment:
  1.  **Liquidity/Subsidy Requirement:** Estimate the capital required to move the metric. If a whale can profit by spending $1M to change the policy outcome by $100k, the market is corruptible.
      *   *Rule:* Subsidy Pool must be > 10x estimated cost to manipulate the metric.
  2.  **Insider Access:** Does any group have non-public knowledge of the metric before resolution? (e.g., City employees knowing litter counts before publication).
      *   *Rule:* If yes, trading must be halted or restricted until data is public.
  3.  **Correlation Check:** Are there external markets (crypto, commodities) that correlate with this outcome? If so, hedging may distort the price signal.

  ### Step 4: Decision Conversion (Price to Policy)
  **Goal:** Map market spreads to a binary decision.
  **Action:** Define the execution logic.
  *   **The Spread:** Calculate $E[Metric|Policy] - E[Metric|No Policy]$.
  *   **Threshold:** Is the spread positive? (Simple Futarchy). Or must it exceed a confidence interval (e.g., Lower bound of 95% CI > 0)?
  *   **Disagreement Protocol:** If Market A and Market B are illiquid or diverge wildly (wide spreads), the signal is noise.
      *   *Rule:* If bid-ask spread > 15% of metric value, **No Decision.** Hand to human governance.

  ### Step 5: The Value Boundary Sign-off
  **Goal:** Final confirmation that no hidden value judgments remain.
  **Action:** The Market Design Lead must sign off on this statement:
  *   *"We are not predicting whether the policy is 'good.' We are predicting whether the policy achieves [Metric]. Stakeholders agree [Metric] is the proxy for 'good'."*
  *   If stakeholders do not agree on the proxy, the market design is invalid.

  ---

  ## Part 2: Procedure Application

  ### Case Study 1: City Council Ban on Single-Use Plastic Bags
  **Proposal:** "Should we ban plastic bags to reduce litter?"

  **Step 1: Counterfactual Reformulation**
  *   *Metric:* "Tons of plastic litter collected in city zones."
  *   *Market A:* Litter tonnage in 2025 **IF** Ban passes.
  *   *Market B:* Litter tonnage in 2025 **IF** Ban fails.
  *   *Critique:* **FAIL.**
      *   *Causal Isolation:* Litter tonnage depends on sanitation budget, weather, and population, not just bags.
      *   *Counterfactual:* We cannot observe Market B if the Ban passes. We rely on the *spread*, but traders will argue about confounding variables (e.g., "A recession will reduce litter regardless of the ban").
  *   *Engineer Note:* To fix this, you need a randomized control trial (RCT) design, which a city council cannot commit to ex-ante.

  **Step 2: Resolution Criterion**
  *   *Oracle:* City Sanitation Department Annual Report.
  *   *Ambiguity:* Report delayed? Market resolution slips.
  *   *Risk:* The City Council controls the Oracle. They can under-report litter to make the market look "successful" or manipulate payouts. This is a **Centralization Risk**.

  **Step 3: Manipulation Checks**
  *   *Manipulation Vector:* A plastic manufacturer could short Market A and lobby against the ban. Or, a sanitation company could go long Market A and *stop collecting litter* to ensure the metric looks bad if the ban fails (sabotage).
  *   *Liquidity:* City policy markets are inherently illiquid. Subsidy cost would be prohibitive relative to the economic impact of bags.

  **Step 4: Decision Conversion**
  *   *Logic:* If Price(A) < Price(B) (Lower litter with ban), enact ban.
  *   *Conflict:* If the spread is narrow (e.g., 1% difference), is it worth enforcing? The market doesn't know the *cost* of enforcement, only the litter metric.

  **Step 5: Value Boundary**
  *   *Judgment Call:* **STOP.**
  *   *Reasoning:* The metric (litter tonnage) is not the value (environmental health/civic beauty). A ban might reduce plastic bags but increase paper bag litter (substitution effect). Traders will trade the literal metric, not the intent. The "Value Stop" triggers here: Stakeholders disagree on whether "less plastic litter" equals "better city." This is a political negotiation, not a forecast.

  **Verdict:** **REJECT.** Too many confounding variables, oracle centralization risk, and metric/value misalignment.

  ---

  ### Case Study 2: University Funding 10-Year Basic Research Program
  **Proposal:** "Should we fund the $50M Quantum Computing Chair?"

  **Step 1: Counterfactual Reformulation**
  *   *Metric:* "Number of peer-reviewed citations attributed to the Chair."
  *   *Market A:* Citations in 2035 **IF** Funded.
  *   *Market B:* Citations in 2035 **IF** Not Funded.
  *   *Critique:* **FAIL.**
      *   *Temporal Bound:* 10 years is beyond the horizon of liquid prediction markets. Discount rates and liquidity premiums will swamp the signal.
      *   *Counterfactual:* Impossible to estimate "Citations IF Not Funded." Would the researcher have gone elsewhere? Would someone else have done the work? This is untradeable speculation.

  **Step 2: Resolution Criterion**
  *   *Oracle:* Scopus/Web of Science API.
  *   *Ambiguity:* Attribution disputes (who gets credit for a paper?).
  *   *Risk:* Researchers can game citations (citation rings). The metric is manipulatable by the subjects of the market.

  **Step 3: Manipulation Checks**
  *   *Manipulation Vector:* The researchers themselves can trade. They have insider info on their own productivity. This is illegal insider trading in traditional markets; in futarchy, it creates a perverse incentive to *produce* citations to win the bet, potentially lowering quality.
  *   *Liquidity:* No one will lock capital for 10 years without massive yield. The cost of capital subsidy exceeds the research budget.

  **Step 4: Decision Conversion**
  *   *Logic:* If Expected Citations (Funded) > Expected Citations (Unfunded), Fund.
  *   *Conflict:* Citations $\neq$ Breakthroughs. A controversial, low-citation paper could be more valuable than a high-citation review. The market optimizes for popularity, not truth.

  **Step 5: Value Boundary**
  *   *Judgment Call:* **STOP.**
  *   *Reasoning:* The definition of "successful research" is a value judgment. Is it citations? Patents? Student placement? Basic research often has no measurable output for decades.
  *   *Hard Limit:* **Time Horizon.** Prediction markets function on information aggregation over tradable timeframes. 10 years is outside the efficient market horizon for this asset class.

  **Verdict:** **REJECT.** Time horizon too long, metric easily gamed by participants, counterfactual impossible to price.

  ---

  ## Part 3: Explicit Judgment Calls (The "Human in the Loop")

  As the Market Design Lead, you must acknowledge that this procedure does not eliminate politics. It merely isolates where the politics must happen. The following steps **cannot** be automated and require human sign-off:

  1.  **Metric Validity (Step 1):** An engineer can verify if a metric is *measurable*, but not if it is *meaningful*.
      *   *Judgment:* Does optimizing this number actually help the organization? (Goodhart's Law check).
      *   *Action:* Requires stakeholder consensus *before* market design begins.

  2.  **Oracle Trust (Step 2):**
      *   *Judgment:* Do we trust the data source more than we trust the voters?
      *   *Action:* If the Oracle is the same body enacting the policy, the system is circular. Requires external data verification.

  3.  **The "Enough Liquidity" Call (Step 3):**
      *   *Judgment:* How much subsidy is enough?
      *   *Action:* There is no formula. If the policy stakes are $10M, and the market subsidy is $100k, the market is noise. The Lead must decide if the cost of the market is justified by the confidence it provides.

  4.  **The Value Stop (Step 5):**
      *   *Judgment:* When to admit defeat.
      *   *Action:* If the debate shifts from "What will happen?" to "What should we care about?", the Market Design Lead must kill the proposal. Futarchy cannot solve value conflicts; it can only resolve uncertainty about facts.

  **Final Instruction to Engineering Team:**
  If a proposal requires you to design a market for a variable that the policy itself influences (e.g., "Will the budget be balanced?" when the policy *is* the budget), **reject it immediately.** That is not a prediction; it is a self-fulfilling prophecy.
