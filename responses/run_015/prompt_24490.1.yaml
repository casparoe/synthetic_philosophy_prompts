      *   *Critique:* Resolution is the hardest part.
      *   *Fix:* Specify a "Resolution Oracle" role. If it requires a committee vote, it's not a prediction market, it's a voting market (which defeats the purpose).
      *   *Critique:* The prompt asks for "One Day" review.
