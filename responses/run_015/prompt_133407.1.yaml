answer: |-
  **Seminar:** Moral Standing and the Ethics of Blame
  **Session Topic:** Hypocrisy, History, and Authority
  **Participants:** 
  *   **Dr. Aris (A):** Defends a Diachronic Account of Standing.
  *   **Dr. Blake (B):** Defends a Synchronic Account of Standing.

  **Aris:** Let's ground this in the case we discussed in the reading packet. Consider Elena. For fifteen years, she was a lead lobbyist for a major fossil-fuel consortium. Her job was quite literally to delay climate regulation, obscure data, and normalize high-emission infrastructure. Last year, she had a conversion experience, resigned, and now heads a litigation fund suing those same companies for ecological destruction. She is publicly blaming her former colleagues for moral atrocities. My intuition is that her standing to blame them is compromised. Not legally, of course, but morally.

  **Blake:** Compromised in what sense? If Elena now endorses the norm "we ought not destroy the climate," and she is currently abiding by it, she satisfies the conditions for standing. She isn't violating the norm *now*. She isn't even secretly benefiting from the violation *now*. On a synchronic view, her authority to blame is a function of her present relational position to the norm and the wrongdoer. Her biography is irrelevant to her *standing*, though perhaps relevant to her *credibility*.

  **Aris:** That distinction between standing and credibility is exactly where I think the synchronic view fractures. If I tell you, "You shouldn't steal," while I am currently stealing, I lack standing. That's the standard hypocrisy case. But if I tell you, "You shouldn't steal," having spent twenty years running a theft ring, even if I've stopped today, my blame feels hollow. It's not just that you doubt my sincerity (credibility); it's that I haven't earned the *authority* to hold you to account. Standing is diachronic. It is constituted across a moral biography. Elena's past complicity leaves a residue that attenuates her normative power.

  **Blake:** "Residue" is a metaphor, Aris. Let's look at the mechanism. Why does the past matter? Usually, we say hypocrisy undermines standing because it implies a *disrespect* for the moral community or a *claim of exemption*. If Elena is currently living by the rules she is enforcing, she isn't claiming an exemption. By insisting her past disqualifies her, you aren't protecting the moral community; you're enforcing a kind of moral purity test that makes standing unattainable for anyone with a past. If standing requires a clean biography, then moral conversion is impossible. The repentant sinner is permanently mute.

  **Aris:** I'm not arguing for purity. I'm arguing for integrity as continuity. Moral authority isn't a switch that flips from "off" to "on" the moment one changes one's mind. It's a relational status built on trust and shared commitment over time. When Elena blames her former colleagues, she is invoking a shared normative standard. But her history demonstrates that she treated that standard as instrumental for a decade and a half. That instrumentalization damages the relationship required for standing. The "hollowness" we feel isn't just skepticism; it's the recognition that she is trying to draw on a normative currency she spent years devaluing.

  **Blake:** But you're conflating the *weight* of the blame with the *license* to issue it. Suppose Elena says, "What you did was wrong." If the act *was* wrong, the truth of that claim doesn't depend on her history. If you deny her standing, you are effectively saying the moral claim cannot be properly voiced by her. That seems to protect the wrongdoers. If the oil executives can say, "You have no standing to judge us, you were one of us," they silence a potent moral critic. The synchronic view protects the moral community's ability to police itself by allowing reformed members to rejoin the enforcement ranks immediately upon alignment.

  **Aris:** It doesn't silence them; it conditions them. My claim isn't that Elena *cannot* blame, but that her standing is *diminished* relative to someone who didn't facilitate the harm. She lacks the full license. To regain full standing, she must do more than just switch sides synchronically. She must engage in reparative work that acknowledges the diachronic breach. If she simply acts as if her past is irrelevant, *that* is a form of present hypocrisy. It's a hypocrisy of omission regarding her own moral narrative. She is presenting herself as a clean enforcer of a norm she previously subverted.

  **Blake:** Now you're moving the goalposts. First, it was about past complicity undermining standing. Now, it's about how she *presents* that complicity. If the problem is that she fails to acknowledge her past, then the lack of standing isn't due to the past itself (the diachronic fact), but due to a present failure of transparency (a synchronic fact). If Elena stands up and says, "I helped you do this for fifteen years. I was wrong. Now I am stopping you," does she have standing then?

  **Aris:** [Pauses] It mitigates the deficit, certainly. Acknowledgment is the beginning of repairing the relational damage. But does it fully dissolve the residue? I'm not sure. Even with acknowledgment, she is asking the victims of climate change to accept her as a moral proxy. But she helped create their victimhood. There is a conflict of interest that isn't just about current benefit, but about causal responsibility. Her diachronic trajectory makes her a participant in the harm, not just a bystander who changed minds.

  **Blake:** Causal responsibility is a matter of liability, not standing. We can hold Elena liable for her past lobbying while granting her standing to blame the companies for theirs. If you insist that causal participation in a wrong permanently degrades your standing to blame that kind of wrong, you create a perverse incentive. It suggests that those who have *never* touched the fossil fuel industry are the only ones who can judge it. But those people might lack the internal knowledge Elena has. Your diachronic view privileges the outsider over the reformed insider. It makes standing a function of moral luck—having had the luck to never be tempted or implicated.

  **Aris:** It's not about luck; it's about the cost of doing moral business. If I break a window, I can pay for it. But I don't immediately regain the standing to scold others for breaking windows until I've demonstrated a sustained commitment to not breaking them. Why? Because standing is a form of trust. The community trusts me to enforce the norm only if I show I understand its weight. Elena's past shows she treated the norm as negotiable. That negotiation leaves a scar on her moral agency. You're treating moral agency as a series of snapshots. I'm treating it as a film. If the film has fifteen minutes of villainy, you can't just cut to the hero scene and claim the narrative arc is clean.

  **Blake:** But moral life *is* lived in the present. The "film" metaphor is seductive but dangerous. If I am truly reformed, my current moral will is aligned with the good. To say I lack standing is to say my current will is insufficient. It suggests that moral identity is fixed by history rather than constituted by current commitment. This is the "unattainability" problem I mentioned. We all have residues. We have all compromised. If standing requires a spotless diachronic record, or even a fully "atoned" one, then the practice of blaming becomes the province of saints. And since there are no saints, blaming becomes impossible. The synchronic view saves the practice of blame by making it accessible to flawed agents who are currently trying to get it right.

  **Aris:** I agree blaming must be accessible to flawed agents. But there is a difference between being flawed and being *complicit*. The standard hypocrite fails to follow the rule they enforce. The diachronic hypocrite—Elena—enforced the *violation* of the rule they now enforce. That's a deeper structural contradiction. It's not just "I break the rule too." It's "I built my career on ensuring this rule didn't exist." Your synchronic view asks us to treat her current stance as if it emerged in a vacuum. But it didn't. It emerged from a position of privilege gained through immorality. She likely has a platform *because* of her past work. To grant her full standing without acknowledging the diachronic debt is to let her capitalize on that ill-gotten normative capital.

  **Blake:** I agree she shouldn't capitalize on it. But that's an argument about *unjust enrichment*, not standing. We can critique her for using her insider status without acknowledging the cost, without saying she lacks the *authority* to blame. Let's test the intuition. Suppose the oil executives are actively lying about emissions *today*. Elena exposes them. She blames them. If you tell the audience, "Wait, she lobbied for them in 2010, so her blame lacks authority," aren't you distracting from the moral urgency of the current violation? The synchronic view prioritizes the victim's need for advocacy over the advocate's biographical purity.

  **Aris:** I'm not saying we ignore the violation. I'm saying we qualify the *source* of the normativity. When Elena speaks, she speaks with a divided voice. Part of her speaks for the climate, part of her speaks from the history of its destruction. The audience senses this division. That's the "hollowness." If we ignore it, we degrade the practice of blame into mere strategic positioning. "I can blame you today because it suits me, regardless of what I did yesterday." That turns blame into a tool, not a moral response. Standing is the guardrail that prevents blame from becoming merely instrumental. By requiring diachronic consistency, we insist that moral authority costs something. It costs time, it costs consistency, it costs the willingness to carry the weight of one's past.

  **Blake:** But at what cost to the community? If I am a recovering addict, do I lack standing to tell a younger person not to use drugs? On your view, my past complicity with the drug culture leaves a residue. But my experience makes my blame *more* potent, not less. I understand the trap. Elena is similar. She knows how the lobbying machine works. Her blame is informed. If you diminish her standing, you are saying that moral insight gained through sin is worthless for the purpose of enforcement. That seems to deny the possibility of redemption as a social resource. The synchronic view says: "We welcome you back to the moral community. Part of being back is having the right to hold others accountable." That inclusion *is* the redemption.

  **Aris:** The recovering addict case is instructive, but distinct. Usually, the addict blames the *dealer* or the *drug*, not their fellow addicts, or if they do, they frame it through shared struggle. If the addict became a dealer for ten years, profiting from others' addiction, and then quit to lead an anti-drug task force... I think my intuition holds. Their standing would be fraught. They would need to acknowledge the dealing. But even then, the victims of the dealing might rightly say, "You don't get to judge this." 
  Your synchronic view risks making standing too cheap. It allows agents to shed moral skin too easily. "I was a villain yesterday, but I'm a hero today, so treat me as a hero." Moral identity isn't that fluid. The residue isn't a bug; it's a feature. It reminds us that our actions have enduring normative consequences.

  **Blake:** And my worry is that your view makes standing too expensive. It turns the moral community into a ledger where debts are never fully cleared. If Elena spends the rest of her life fighting climate change, at what point does the diachronic residue vanish? Never? Then she is permanently second-class. If "never," then you aren't talking about standing; you're talking about punishment. Standing is about who gets to participate in the practice of holding one another accountable. If we exclude those with complex histories, we shrink the community. We need a view that allows us to say, "Your past was wrong, but your present voice counts."

  **Aris:** Perhaps the disagreement is about what "counts" means. I am willing to say her voice counts as a *warning*, or as *testimony*. But *blame*? Blame is a specific speech act that claims a certain authority to demand accountability. I am arguing that authority is partly constituted by the history of the relationship between the blamer, the blamed, and the norm. Elena's history with the norm is one of subversion. She can testify to the harm. She can advocate for policy. But to *blame*—to stand in the moral high ground and demand restitution—requires a diachronic integrity she hasn't yet rebuilt. It's not that she's second-class; it's that she's in a probationary period. And that probation isn't a punishment; it's the time required to rebuild the trust that standing relies upon.

  **Blake:** "Probationary period." That sounds like we're measuring standing in units of time. But what if she reforms instantly? What if the change is radical? The synchronic view allows for the possibility of radical moral transformation. It respects the agent's capacity to redefine themselves in the present. Your view binds them to their history. I worry that in protecting the "hollowness" of blame, you're protecting the feelings of the audience over the rights of the moral agent to re-enter the community.

  **Aris:** And I worry that in protecting the agent's right to re-enter, you're hollowing out the meaning of the community itself. If standing doesn't track history, then the community has no memory. And a community without memory cannot sustain trust. Elena's blame feels hollow because the audience remembers. To ask them to forget is to ask them to do moral violence to their own experience.

  **Blake:** Then perhaps we agree on the phenomenology but disagree on the normativity. It *feels* hollow to the audience. But should it? That's the question for the seminar. If the feeling of hollowness is just a bias against the reformed, then the synchronic view is the corrective. If the feeling of hollowness is a accurate perception of normative reality, then your diachronic view holds.

  **Aris:** Precisely. And I'd argue the feeling is accurate. It tracks the real cost of moral authority.

  **Blake:** And I'd argue the feeling is a relic of retributive intuition that blocks moral repair. But I concede this: if Elena fails to acknowledge the past, her present consistency is suspect. So perhaps the synchronic view must include a robust requirement of transparency about one's history to prove current alignment.

  **Aris:** I can accept that transparency is a necessary condition for rebuilding diachronic standing. But it is not sufficient. Time and consistent action are the currency. We cannot buy standing back in a lump sum, Blake. We have to earn it in installments.

  **Blake:** Then we have a clear disagreement on the exchange rate of moral redemption. Let's open it to the class to see who is willing to pay the price.
