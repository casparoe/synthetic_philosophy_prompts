answer: |-
  Your three-fold hypothesis is correct, but it is incomplete. You have accurately identified the surface fractures—methodology, modality, and virtue—but these are symptoms of a deeper structural issue: the underdetermination of ontology by formalism. The deadlock persists not because the arguments are balanced, but because the dispute has migrated from physics to the semantics of representation. When you agree on the physics (the models, the invariance), you have exhausted the empirical content. What remains is a negotiation over how to map that mathematical structure onto reality. Your hypothesis captures the *stances* taken, but the root cause is that the formalism allows multiple, empirically equivalent ontological mappings.

  This leads to the straight answer you requested. The dispute between sophisticated substantivalism and sophisticated relationism is largely verbal at the physical level but substantive at the modal level. If both sides accept diffeomorphism invariance and identify isomorphic models (Leibniz equivalence), they agree on all physical predictions and all observable structures. The difference reduces to whether one calls the manifold substrate a "substance" or a "system of relations." However, it is not *merely* notational if the sides disagree on haecceitism—the belief in primitive thisness for points. If the substantivalist holds that swapping manifold points yields a distinct possible world while the relationist denies this, the disagreement is substantive regarding the nature of possibility, even if it is verbal regarding physics. Thus, the standoff is verbally physical but metaphysically modal.

  Your Hollow World case is crucial here. Its failure to discriminate is not an artifact of how you rigged it; it is real evidence about the dispute's structure. You expected an empirical stipulation to force a choice, but the result demonstrates that both positions are degenerate research programmes in the Lakatosian sense: they protect their hard core by adjusting their protective belt. When the relationist retreats to "primitive inertial relations" among unoccupied events, they concede the substantive ground to the substantivalist while retaining the label. When the substantivalist claims victory because the inertial frame persists without matter, they ignore that the relationist can treat that frame as a brute modal fact. The Hollow World proves that no empirical stipulation can settle the debate because the debate is no longer about empirical content. It shows that "relationism" has become flexible enough to absorb any inertial structure by redefining "relation," rendering the label ontologically idle. The case confirms that the dispute is about how to describe the modal structure of the theory, not about the theory's physical content.

  Given this diagnosis, progress will not come from new experiments or better arguments for one side over the other within the current framework. Progress requires a change of question. You should stop asking "What is spacetime?" and start asking "What is the modal structure of our best theories?" The substantive work lies in clarifying the metaphysics of possibility that underpins the hole argument, not in arguing over the manifold's status. A formal result that could bite would be a proof that diffeomorphism invariance *requires* a specific modal semantics (e.g., that haecceitism is logically incoherent within the theory), but this is unlikely. The most viable path is pragmatic: accept that sophisticated substantivalism and relationism are empirically equivalent descriptions and choose based on heuristic utility for quantum gravity. If one framework facilitates quantization better, it wins on pragmatic grounds, not ontological truth.

  I am highly confident in the diagnosis that the dispute is semantically driven and empirically underdetermined. I would defend the claim that the Hollow World's failure is diagnostic of the debate's maturity rather than a flaw in your design. The views have evolved to be empirically equivalent by design; expecting them to diverge on stipulated physics is expecting them to violate their own definitions.

  However, I must hedge on the claim that the dispute is *merely* verbal or pragmatic. I assign moderate confidence to the idea that there is no fact of the matter. My diagnosis relies on the assumption that physics exhausts the evidence for spacetime ontology. If one accepts that metaphysics has autonomous evidence (e.g., conceptual necessity), the dispute remains substantive.

  The single consideration that would most quickly lead me to abandon this diagnosis is the emergence of a physical theory where substantivalism is mathematically indispensable for coherence, not just interpretation. For example, if a successful theory of quantum gravity required fixing a background manifold in a way that violated diffeomorphism invariance fundamentally, substantivalism would regain empirical teeth. Until then, the debate is metaphysics operating on physics-shaped data.

  The weak point in my diagnosis is the dismissal of modal realism. I treat the haecceitistic disagreement as a secondary metaphysical preference. If one holds that modal facts are as real as physical facts, then the sophisticated standoff is fully substantive, not verbal. I am likely underestimating the ontological weight my interlocutors place on possibility. If modal structure is part of the world's furniture, then the relationist's denial of haecceitistic differences is a substantive claim about reality, not just a semantic preference. This is where my diagnosis is most likely to fail: in assuming that only empirical detectability counts as substance.
