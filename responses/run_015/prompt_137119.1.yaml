answer: |-
  Thanks for sending this over. It is a bold move to try to distill this into a single page, but that constraint usually reveals the fault lines faster than anything else. Reading through your six points, the project is ambitious and mostly coherent, but there are three specific friction points where the claims pull against each other. You are right to feel that the trouble moves around when you write it out, because the tensions are systemic rather than localized. I will walk through the pairs, rank the severity, offer the cheapest fixes, and then tell you exactly what I would cut if I were in your shoes.

  The most structurally damaging tension is between your second and third claims. You argue in (2) that punishment is justified solely on a forward-looking public health model where proportionality means the least restrictive measure to neutralize a threat. But in (3) you insist on a completion discount, punishing attempts less than completed crimes even when the difference is pure luck. On a strict quarantine model, dangerousness is what matters, and a failed attempter can be just as dangerous as a completer. If the gun jams due to luck, the threat posed by the agent remains the same. By insisting on the completion discount, you are smuggling in a backward-looking retributive intuition that contradicts your forward-looking justification. This is the objection your legal theory colleagues will pounce on first because it undermines the internal logic of your proportionality constraint. The cheapest fix here is to frame the completion discount not as a matter of justice or desert, but as a rule of evidence or administrative efficiency. You could argue that completed crimes provide clearer evidence of dangerousness than attempts, or that maintaining the discount is necessary for the system's legitimacy, even if it is not strictly required by the threat neutralization principle.

  The second most severe tension is metaphysical, between your first and fourth claims. In (1) you deny basic desert moral responsibility for everyone, yet in (4) you claim that reactive attitudes like resentment are genuinely fitting. Typically, for an emotion to be fitting, it must track the truth of the situation. If it is true that no one is morally responsible in the basic sense, then resentment based on the belief that someone is responsible is based on a falsehood. Calling it fitting suggests there is a normative fact there that your skepticism denies. This looks like you want the metaphysical cleanliness of skepticism without the emotional cost. The cheapest fix is to change the language in (4) from claiming these attitudes are fitting to claiming they are inevitable, functional, or constitutive of our relationships. You can keep the emotions without claiming they are metaphysically warranted.

  The third tension is terminological, between your second and sixth claims. You state in (2) that the only justification is forward-looking, but in (6) you introduce P-desert to keep desert talk in the law. Desert is inherently backward-looking, implying someone merits treatment because of what they did, not just because of what they might do. Calling it practice-relative helps, but if the justification is only forward-looking, then P-desert is just a label for dangerousness within a system, not a distinct justificatory ground. This risks confusing your audience about whether you are a consequentialist or a hybrid theorist. The cheapest fix is to clarify that P-desert is not a justification for punishment itself, but a justification for the language we use within the practice to maintain its efficacy.

  Ranking these by severity, the metaphysical clash between (1) and (4) is the most dangerous to your core position as a skeptic, while the legal clash between (2) and (3) is the most dangerous to your credibility with a legal theory audience. However, the metaphysical foundation supports everything else, so if (1) and (4) contradict, the whole structure wobbles.

  If I have to commit to one revision, I would drop the claim in (4) that resentment is genuinely fitting. You should revise it to say that these attitudes are psychologically inevitable and socially functional, but not necessarily fitting in a truth-tracking sense. This costs you the moral realism about emotions, meaning you have to admit that our anger is based on a useful illusion rather than a moral fact. However, this saves your skepticism from self-contradiction. It allows you to maintain (1) without qualification, and it makes your position more honest about the cost of skepticism. You can still argue that we should not abolish these attitudes because they serve a vital role in the practice described in (6), but you avoid the trap of claiming they are metaphysically warranted when you have just denied the ground that warrants them. This change cleans up the most philosophical noise and lets you focus the talk on the harder legal theory problems of how to construct a just system without basic desert, which is where your audience will be most interested anyway.
