prompt: |-
  I want a map of the exposure of a position I rely on. Not a defense of it, and not a restatement of it in better words: what would have to be true for it to be false, and what would have to be true for it to be useless.

  The position, and the argument it borrows from. In its home setting the argument runs like this. Take a two-sided, finite, perfect-information game that is symmetric between the players and admits no draw. Suppose the second player had a winning strategy. The first player then makes one arbitrary opening move and thereafter plays the second player's strategy against the second player, carrying the extra opening move around like an inert token. If an extra move can never hurt — if the game is monotone, in the way a board-filling game is, where an additional stone of your own colour on the board is never a liability — then the first player wins too, contradicting the supposition. So the second player has no winning strategy, and since draws are impossible, the first player wins. The conclusion is non-constructive: it says a winning first move exists, never which one. Call the generalised version of this the strategy-stealing assumption.

  What I claim. I claim that the conclusion transfers with the structure. In any two-sided competitive setting that is symmetric, draw-free, and monotone in the sense that an extra action can be carried at no cost — call this *surplus-inertness*: having an additional action is never a liability — the side that moves first can in principle guarantee that it does at least a hair better than the other. The corollary I actually use is stronger-sounding: in such settings a persistent advantage on the follower's side is never explained by position; it must be a deficit of play. I lean on that corollary when I argue that a follower's lead in a capability race between two roughly symmetric actors cannot be structural, and I lean on the main claim when I argue that the initiative is not one advantage among others but the structural one.

  What I want from you.

  One. Take the conditions apart. Which of symmetry, draw-freeness, and surplus-inertness is load-bearing in the sense that its failure is fatal rather than merely awkward? Do the same for the conditions the argument needs that I have not listed: that a strategy specified for one seat is executable from the other, call it *role-symmetric simulability*; that the setting has determinacy at all, so that one side or the other has a winning strategy; and that the setting is genuinely two-sided rather than a many-sided setting with two salient participants. For each, sketch the smallest setting you can in which it fails, and say what the argument then delivers — does the conclusion degrade continuously, or does it collapse outright?

  Two. The failure modes I want taken most seriously are the ones that do not look like failures. Three in particular. A surplus action that is materially harmless but informationally harmful: an extra move that changes what the other side can infer, so that the stolen strategy is now being run in an information environment it was never calibrated to. A setting with parity or counter effects, where inserting an extra move shifts every subsequent move number and breaks the simulation even though nothing material has changed. And a setting where the strategy to be stolen is a fitted response to the first mover's actual play rather than a strategy that wins against anything, so that stealing it is a fixed-point problem rather than a copy operation. For each, say whether it defeats the main claim, only the corollary, or neither, and whether a defender has a repair available.

  Three. Build me the strongest single counterexample setting you can: two-sided, symmetric, draw-free, with an extra action available to the first mover, and in which the second mover nonetheless wins by structure rather than by the first mover's blunders. If no such setting is possible, say why — and say what that shows about whether my claim is an empirical claim or an analytic one.

  Four. The corollary has an escape hatch I have become suspicious of: any observed follower advantage can be absorbed as a deficit of play. Is there any observable difference between the surplus was not really inert and the first mover played badly? If not, has the corollary been qualified into something that cannot explain anything? Alongside this, say what my position predicts that a follower-advantage or positional-luck rival does not, and whether that prediction is testable even in principle.

  Five. Rank everything from fatal to merely awkward, and mark for each item whether a committed defender of my position would concede it as counting against them or would treat it as a misdescription of the view. I want the concessions, not the polemics.

  Six. My own sense of where the weight falls: I find the informational and parity failure modes the most threatening, and I am unmoved by objections from bounded rationality, since my claim is explicitly in-principle and concerns the existence of a strategy rather than anyone's ability to find or execute it. Tell me whether that immunity claim is itself defensible, or whether the in-principle qualification is precisely what renders the position unfalsifiable — and whether, for a claim I want to use to argue that some actually observed advantage is not structural, that is a problem or merely a limitation.

  Argue from the structure of the argument as I have set it out. I do not want citations, bibliographies, or reading pointers, and no appeal to who proved what about which board game; the prompt should be answerable by someone who has never encountered the argument before and has no access to a library.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Map the exposure of a specific philosophical/strategic position (a generalized "strategy-stealing argument").
      *   **Constraint:** No defense, no restatement, no citations/bibliographies. Focus strictly on failure conditions, counterexamples, and logical structure.
      *   **The Position:** Generalized Strategy-Stealing Assumption (SSA).
          *   *Core Argument:* In symmetric, draw-free, monotone (surplus-inert) games, Player 1 (P1) must have a winning strategy. If P2 had one, P1 could "steal" it by making an arbitrary move and then playing P2's strategy, treating the extra move as inert.
          *   *Claim:* This transfers to real-world competitive settings (capability races). P1 has a structural initiative advantage. Follower advantage is never structural; it's always a deficit of play.
          *   *Key Terms:* Surplus-inertness, Role-symmetric simulability, Determinacy.
      *   **Tasks:**
          1.  Deconstruct conditions (Symmetry, Draw-freeness, Surplus-inertness, Simulability, Determinacy, Two-sidedness). Sketch failure cases. Continuous degradation or collapse?
          2.  Analyze specific "invisible" failure modes (Informational harm, Parity/Counter effects, Fitted response/Fixed-point). Defeat Main Claim or Corollary? Repair available?
          3.  Build the strongest counterexample (Symmetric, Draw-free, Extra Action, P2 wins structurally). If impossible, analyze analytic vs. empirical status.
          4.  Analyze the Corollary's escape hatch (Follower advantage = Play deficit vs. Non-inert surplus). Testable predictions?
          5.  Rank exposures (Fatal vs. Awkward). Defender's stance (Concede vs. Misdescription).
          6.  Evaluate the "In-Principle" immunity (Bounded rationality). Is it unfalsifiable? Is that a problem for the user's specific usage?

  2.  **Deconstruct Conditions (Task 1):**
      *   *Symmetry:* If the board/rules aren't symmetric, P1 might just have worse starting pieces.
          *   *Failure:* Chess (white vs. black pieces are same, but board orientation is symmetric; imagine a game where P2 starts with an extra pawn).
          *   *Effect:* Collapse. The argument relies on P1 being able to *be* P2.
      *   *Draw-freeness:* If draws are possible, P1 stealing P2's strategy might only guarantee a draw, not a win.
          *   *Failure:* Tic-Tac-Toe (perfect play = draw).
          *   *Effect:* Degradation. Conclusion changes from "P1 wins" to "P1 does not lose."
      *   *Surplus-inertness (Monotonicity):* If an extra move can hurt (e.g., blocking your own path), the "inert token" logic fails.
          *   *Failure:* Go (ko fights, liberties) or specific puzzles where filling a space kills a group.
          *   *Effect:* Collapse. The core mechanism (extra move is harmless) is broken.
      *   *Role-symmetric Simulability:* Can P1 actually execute P2's strategy?
          *   *Failure:* Games where moves depend on specific piece identity that P1 doesn't have (e.g., P2 has a "counter-move" ability P1 lacks).
          *   *Effect:* Collapse. Cannot run the theft.
      *   *Determinacy:* Zermelo's theorem requires finite, perfect info.
          *   *Failure:* Infinite games or hidden information.
          *   *Effect:* Collapse. No guaranteed winning strategy exists to steal.
      *   *Two-sidedness:* If a third party intervenes.
          *   *Failure:* Three-player game where P3 helps P2.
          *   *Effect:* Collapse. Symmetry is broken by external agency.

  3.  **Analyze Invisible Failure Modes (Task 2):**
      *   *Informational Harm:* Extra move reveals intent.
          *   *Analysis:* In perfect info games, this doesn't matter. In imperfect info (real world), it matters hugely.
          *   *Impact:* Defeats Main Claim in real-world application. Repair: Restrict claim to perfect info only (limits utility).
      *   *Parity/Counter Effects:* Extra move shifts turn order/parity.
          *   *Analysis:* If the "stolen strategy" relies on responding to specific turn numbers, the shift breaks it.
          *   *Impact:* Defeats Main Claim. Repair: Strategy must be parity-independent (hard to guarantee).
      *   *Fitted Response (Fixed-Point):* P2's strategy is "Best Response to P1's specific move."
          *   *Analysis:* P1 cannot steal a strategy defined *against* P1's own move.
          *   *Impact:* Defeats Main Claim. The strategy isn't universal; it's conditional.
      *   *Verdict:* These defeat the Main Claim when applied outside abstract math. Corollary falls with it.

  4.  **Build Counterexample (Task 3):**
      *   *Challenge:* Create a symmetric, draw-free, monotone game where P2 wins.
      *   *Logic:* If the game is truly symmetric, draw-free, finite, perfect info, and monotone... Zermelo/Strategy Stealing proves P1 *must* win (or draw, but draws excluded).
      *   *Result:* Mathematically impossible *within the strict definition*.
      *   *Implication:* The claim is Analytic (true by definition) *if* the conditions hold.
      *   *The Catch:* The conditions (especially Monotonicity/Surplus-inertness) almost never hold in reality.
      *   *Counterexample Construction:* Need to show a case that *looks* like it meets criteria but P2 wins.
      *   *Idea:* "The Trap Game." P1 must move. Any move opens a vulnerability that P2 exploits. But is the extra move inert? No, it created the vulnerability. So it violates Surplus-inertness.
      *   *Conclusion:* No such setting is possible *if* definitions are strict. This makes the claim analytic *conditional on the premises*. The empirical weight rests entirely on whether real-world situations satisfy "Surplus-inertness."

  5.  **Analyze Escape Hatch (Task 4):**
      *   *Issue:* "Follower advantage = Play deficit."
      *   *Problem:* If surplus isn't inert, P1 played "badly" by moving? Or was the move inherently bad?
      *   *Observation:* Indistinguishable. If P1 moves and loses position, was it the move (structural) or the choice of move (play)?
      *   *Testability:* To test, you need to find a case where *all* P1 moves lead to P2 advantage. If so, it's structural (violates Surplus-inertness). If only *some* do, it's play.
      *   *Prediction:* SSA predicts there exists *at least one* P1 move that maintains advantage. Rival predicts P2 might have structural advantage regardless of P1 move.
      *   *Test:* Exhaustive search of opening moves. If all fail, SSA is falsified for that setting.

  6.  **Rank Exposures (Task 5):**
      *   *Fatal:* Failure of Surplus-inertness (most likely in reality), Failure of Simulability (information asymmetry).
      *   *Awkward:* Draw-freeness (degrades to "not lose"), Symmetry (can be approximated).
      *   *Defender Stance:* Defender will call Surplus-inertness failures "misdescriptions" (i.e., "You didn't have an extra action, you had a *different* action"). Defender will concede Determinacy failures as "out of scope."

  7.  **Evaluate Immunity Claim (Task 6):**
      *   *User's View:* Bounded rationality doesn't matter; claim is "in-principle."
      *   *Critique:* If the claim is only "in-principle," it cannot explain *observed* outcomes (which are the result of actual play).
      *   *Usage:* User wants to argue observed advantage is *not* structural.
      *   *Problem:* If the argument is analytic (true by definition), it tells us nothing about the world unless the world fits the definitions. If the world doesn't fit (non-inert surplus), the argument is silent.
      *   *Verdict:* The immunity makes it unfalsifiable *as an empirical claim*. It becomes a tautology: "In games where moving first helps, moving first helps." To be useful, it must make risky predictions about which real-world scenarios count as "surplus-inert."

  8.  **Drafting the Response:**
      *   *Tone:* Analytical, rigorous, unsparing. No fluff.
      *   *Structure:* Follow the six points exactly.
      *   *Refinement:* Ensure the distinction between the *Main Claim* (P1 has winning strategy) and the *Corollary* (Follower advantage is play deficit) is maintained.
      *   *Self-Correction on Task 3:* Be careful not to say "It's impossible." Say "It is logically impossible *given the premises*." The exposure is whether the premises map to reality.
      *   *Refinement on Task 6:* This is the crux. If the user uses an analytic truth to make an empirical argument, they commit a category error unless they bridge the gap. I need to point out that the bridge (Surplus-inertness) is the weak point.

  9.  **Final Review against Constraints:**
      *   No citations? Check.
      *   No defense? Check.
      *   No restatement? Check.
      *   Focus on exposure? Check.

