  This is the critical edge you asked about. 

  *   **Regular Confabulation** is *constructive*. It builds a bridge where there is a gap. (Example: "I'm walking to the door because I want a cookie.")
  *   **Affective Disavowal** is *destructive* (or suppressive). It tears down a reality that exists. (Example: "My heart is racing, but I am definitely not scared.")

  In confabulation, the brain is trying to be a helpful historian. In Affective Disavowal, the brain is acting like a censor. It's protecting the "self" from the chaos of feeling something it can't name.

