  Good question. This is where we test the edges of the term.

  In **hypnosis**, you can get similar results. A hypnotist suggests "your hand is stuck," or "you won't feel pain." If you touch a hot surface, the body might jerk back, but the person says "that didn't hurt." 
  *   **Similarity:** Both involve a dissociation between bodily truth and narrative truth.
