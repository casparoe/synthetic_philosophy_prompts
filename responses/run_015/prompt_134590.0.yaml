  What you're describing is different. It's not just filling a gap or ignoring a deficit; it's **actively contradicting physiological evidence.** The body is screaming "Danger!" and the speaking mind is saying "All Clear." That's not just a gap; that's a contradiction.

  ### So, let's coin a term
  Since there isn't a perfect label, let's give it one that fits the logic you're seeing. I'd call this **"Affective Disavowal."**

  Here is the conceptual carving for **Affective Disavowal**:

  1.  **The Trigger:** The non-speaking hemisphere (usually the right) processes an emotional stimulus (fear, disgust).
  2.  **The Leak:** The physiological body state leaks across (heart rate, sweat) because the body isn't split, only the brain connections are.
