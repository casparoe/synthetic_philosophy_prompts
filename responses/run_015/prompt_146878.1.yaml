prompt: |-
  I'm taking a seminar on naturalizing mental content, and we've been working through teleosemantic accounts—particularly the view that representational content is fixed by the evolutionary proper function of a cognitive mechanism, analogous to the way an organ's function is fixed by selection history. In class and in the literature, people lean heavily on the comparison: a belief is like the heart, its content is like pumping blood, misrepresentation is like malfunction, and evolutionary history plays the role of the designer. The analogy is meant to do heavy lifting: it licenses the claim that intentionality is fully naturalizable, that misrepresentation is genuinely normative rather than merely statistical, and that content is determinate even when current tokenings go wrong.

  But I'm troubled by a complication I encountered in some neuroscience reading—the phenomenon of neural reuse, or expertise-induced recruitment, where the same cortical substrate (say, the fusiform face area) can come to represent birds in expert birdwatchers despite its evolutionary history being tied to face recognition. If the very same biological structure can carry radically different representational contents depending on developmental and contextual recruitment, then the heart-organ mapping starts to look strained: hearts don't suddenly start pumping lymph because the organism was raised near lymph nodes. I want an explicit audit. Give me the correspondence table—what plays the role of the organ, the evolutionary designer, the malfunction, the functional norm—then identify exactly where the mapping breaks. Does the analogy smuggle in determinacy that mental representation lacks? Does it quietly import the idea that functions are singular and context-invariant, and is that true of cognition? Most importantly, does the conclusion that teleosemantics successfully naturalizes mental content survive once we account for functional plasticity and neural reuse, or was the analogy carrying that conclusion all along?

  Please structure your response with the correspondence table first, then separate the disanalogies that matter for the naturalization project from those that don't, and say whether a better analogy exists—perhaps one drawn from regulatory or developmental biology rather than static organ function. If the analogy collapses, indicate what teleosemantics would need to add (for instance, a layered account of proximal versus distal function) to salvage determinacy. End with a single line beginning "Verdict:" followed by a brief statement of whether the analogy survives the audit intact, collapses, or survives only with substantial modifications.
