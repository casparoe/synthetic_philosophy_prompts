answer: |-
  ### Correspondence Table: The Teleosemantic Analogy

  | Domain | Biological Organ (Source) | Mental Representation (Target) |
  | :--- | :--- | :--- |
  | **Entity** | Heart (or specific organ) | Cognitive Mechanism / Neural Substrate (e.g., FFA) |
  | **Activity** | Pumping blood | Tokening a representation (e.g., "That is a face") |
  | **Designer** | Natural Selection (Phylogenetic History) | Natural Selection (Phylogenetic History) |
  | **Proper Function** | Circulating oxygen/nutrients | Indicating a state of affairs / Guiding successful action |
  | **Norm** | Physiological health conditions | Truth conditions / Accuracy conditions |
  | **Malfunction** | Heart disease / Failure to pump | Misrepresentation / False belief |
  | **Determinacy** | Fixed by species-typical history | Fixed by evolutionary history of the mechanism |

  ---

  ### Audit of Disanalogies

  To determine whether the naturalization project survives, we must distinguish between superficial disanalogies and those that strike at the core of teleosemantic normativity.

  #### 1. Irrelevant Disanalogies (Do not threaten naturalization)
  *   **Material Constitution:** Hearts are muscular pumps; beliefs are (presumably) neural activation patterns. Teleosemantics is functionalist; the substrate material does not matter, only the causal role and history.
  *   **Conscious Access:** We do not consciously feel our hearts pumping, whereas some beliefs are conscious. Teleosemantics aims to naturalize content, not qualia, so this gap is acceptable.
  *   **Localization:** Hearts are discrete organs; cognitive functions are often distributed. As long as the *system* has a selection history, distribution does not invalidate the account.

  #### 2. Relevant Disanalogies (Threaten the naturalization project)
  *   **Functional Fixity vs. Plasticity:** A heart's proper function is invariant across the lifespan (barring pathology). A neural substrate's representational content can shift via expertise (the FFA case). If content is fixed by history, but the history is static while content changes, the mapping fails.
  *   **Granularity of Selection:** Selection acts on the organism's reproductive success, not directly on the truth of individual beliefs. A heart failing kills the organism quickly; a false belief might not. This makes the "norm" of belief looser than the "norm" of organ function.
  *   **The "Designer" Timescale:** Evolutionary history is phylogenetic (slow). Neural reuse is ontogenetic (fast). If the "designer" is only phylogenetic selection, it cannot authorize the *new* content (birds) generated by ontogenetic learning.
  *   **Functional Monism vs. Multiplexing:** Organs are typically modeled as having singular proper functions. Neural substrates are multiplexed; the same circuitry can serve different representational masters depending on network context.

  ### Does the Analogy Smuggle in Determinacy?

  **Yes.** The heart analogy works only if we assume **Functional Monism**—the idea that a biological trait has *one* Proper Function determined by *one* specific selection history. This assumption silently guarantees determinacy: if the heart is for pumping blood, anything else is a malfunction.

  However, cognition exhibits **Functional Polysemy**. The FFA substrate is selected for face recognition (phylogenetic), but recruited for bird recognition (ontogenetic). If teleosemantics relies solely on the phylogenetic "designer," it must declare the expert birdwatcher's FFA activity as *malfunctioning* (representing faces when seeing birds) or *empty* (no content). This is absurd. The analogy hides the fact that biological norms in cognition are context-sensitive, whereas organ norms are not. By treating the neural substrate as a static organ, the analogy bypasses the hard work of explaining how *new* norms arise without a *new* evolutionary history.

  ### A Better Analogy: Regulatory and Immune Systems

  The heart analogy is drawn from **classical physiology** (stable organs). A more robust analogy for teleosemantics in the age of plasticity is drawn from **immunology or metabolic regulation**.

  *   **The Immune System:** It has a phylogenetic proper function (defend against pathogens). However, it acquires *ontogenetic* specificities (antibodies for specific viruses encountered in the lifetime).
  *   **The Mapping:**
      *   *Phylogenetic History:* Sets the general norm (defense/accuracy).
      *   *Ontogenetic History (Learning):* Sets the specific content (this specific virus/bird category).
      *   *Malfunction:* Autoimmunity (misrepresentation) or failure to react.

  This analogy accommodates neural reuse because it allows for **Derived Proper Functions**. The system is designed to *learn*, and the learning process itself is selected for. The "norm" is not fixed at the level of the neuron (the antibody), but at the level of the learning mechanism (the immune system). This preserves naturalization: the norm is still biological, but it is layered.

  ### Salvaging Teleosemantics: Requirements for Survival

  For teleosemantics to survive the audit of neural reuse, it cannot rely on the static heart analogy. It must adopt the following modifications:

  1.  **Layered Selection History:** It must distinguish between the phylogenetic function of the *mechanism* (e.g., pattern recognition) and the ontogenetic function of the *tokening* (e.g., identifying birds). The "proper function" must be allowed to update via a secondary selection process (learning/reinforcement).
  2.  **Consumer-Based Content:** It must lean harder on the "consumer" side of the equation (Millikan's view). The content is fixed not just by the producer (the FFA), but by the systems that *use* the FFA output. If the motor system uses FFA output to guide bird-identification actions, the content is "bird," regardless of the FFA's phylogenetic history.
  3.  **Normative Stability Conditions:** Instead of fixed historical norms, it must define norms via **Stabilizing Functions** (Neander). The function is whatever kept the trait in the population *recently enough* to maintain stability. This allows for niche-construction and cultural evolution to play a role in fixing content.

  Without these modifications, the theory collapses into historical fetishism, unable to account for the flexibility that makes cognition useful.

  Verdict: The analogy survives only with substantial modifications.
