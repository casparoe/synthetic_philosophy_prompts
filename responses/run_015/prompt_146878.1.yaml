      *   **Tone:** Academic, rigorous, philosophical, addressing the specific tension between teleosemantics and neuroplasticity.

  2.  **Deconstruct the Teleosemantic Analogy (The "Standard Model"):**
      *   *Organ:* Cognitive Mechanism (e.g., belief-forming system).
      *   *Function:* Representing the world accurately (or guiding successful action).
      *   *Designer:* Natural Selection (Evolutionary History).
      *   *Malfunction:* Misrepresentation (False belief).
      *   *Norm:* Success conditions defined by selection history.
      *   *Goal:* Naturalize intentionality (make it physical/biological) and explain normativity (why a false belief is *wrong*, not just different).

  3.  **Analyze the Challenge (Neural Reuse/Plasticity):**
      *   *Phenomenon:* The FFA evolves for faces but is recruited for cars/birds in experts.
      *   *Problem:* If content is fixed *solely* by evolutionary history (etiology), the FFA *must* represent faces. But functionally, it represents birds for the expert.
      *   *Implication:* The "organ" isn't stable. The "function" isn't singular or fixed at the phylogenetic level. The "designer" (selection) didn't design it for birds.
      *   *Threat:* If content floats free of evolutionary history due to plasticity, teleosemantics loses its anchor. If content is fixed by current use, it looks more like functional role semantics or use-theory, which struggle with normativity/misrepresentation.

  4.  **Drafting the Correspondence Table:**
      *   Need to map the biological side to the mental side clearly.
      *   *Biological:* Heart, Pumping Blood, Natural Selection, Heart Disease/Failure, Physiological Norm.
      *   *Mental:* Belief System/Neural Substrate, Representing State of Affairs, Natural Selection, False Belief, Truth/Accuracy Norm.

  5.  **Identifying Disanalogies (The "Audit"):**
      *   *Irrelevant Disanalogies:* Hearts are fleshy, beliefs are abstract (maybe). Hearts are one per organism, neural substrates are distributed. These don't kill the theory.
      *   *Relevant Disanalogies (The Killers):*
          1.  *Plasticity vs. Fixity:* Hearts don't change function ontogenetically; neural substrates do (FFA example).
          2.  *Granularity of Selection:* Selection acts on organisms/traits, but neural reuse suggests selection acts on *mechanisms* that are multipurpose.
          3.  *Determinacy:* The heart has one proper function. The FFA has many potential functions depending on context. Teleosemantics needs *one* proper function to fix content.
          4.  *Timescale:* Evolution is slow; learning/recruitment is fast. Teleosemantics relies on the slow timescale for norms.

  6.  **Evaluating the Naturalization Project:**
      *   Does it survive? Strict "Phylogenetic Teleosemantics" (Millikan-style) struggles here. If the FFA's content is "bird" but its history is "face," teleosemantics says it's malfunctioning when seeing a bird (or represents a face incorrectly). This is counterintuitive.
      *   To survive, teleosemantics must incorporate *ontogenetic* selection (learning histories) or switch to a "Systemic" account (Garzon).
      *   The analogy *was* carrying the conclusion of determinacy. By assuming organs have fixed functions, it hid the problem of plasticity.

  7.  **Proposing a Better Analogy:**
      *   Static Organ (Heart) -> Regulatory/Immune System or Metabolic Pathway.
      *   Why? Immune systems learn (ontogenetic selection). Metabolic pathways are recruited for different substrates. This fits neural reuse better.
      *   Alternatively: *Tool Use*. A hammer is designed for nails but can be a doorstop. But tools lack intrinsic norms unless we bring in the user.
      *   Best fit: *Developmental/Regulatory Systems*. They have "proper functions" defined by stability conditions, not just historical selection.

  8.  **Salvaging Teleosemantics:**
      *   Need "Derived Proper Functions" (Millikan actually allows this).
      *   Need to distinguish *Phylogenetic* content (basic categories) from *Ontogenetic* content (specific expertise).
      *   Need a "Layered Account": The mechanism has a historical function (detect faces), but the *system* using it has a derived function (identify birds).
      *   This adds complexity but saves the normativity.

  9.  **Refining the Verdict:**
      *   The analogy doesn't survive *intact*. It collapses under the weight of plasticity unless modified.
      *   It survives *with substantial modifications* (incorporating ontogenetic history).
      *   Decision: "Survives only with substantial modifications."

