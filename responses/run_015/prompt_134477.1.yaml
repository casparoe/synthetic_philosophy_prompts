      *   The statement "The spectator applies general moral rules" sounds very plausible to a casual reader because we often think of judges applying rules. However, in Smith's sentimentalist framework, the spectator's judgment is primary, and rules are secondary generalizations. The prompt specifically asks to be precise about "whether the spectator applies rules or shares sentiments." The student says "applies general moral rules." This misses the sentimentalist core of the spectator mechanism (judging propriety of affection via imagination/sympathy).
