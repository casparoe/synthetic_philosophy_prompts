answer: |-
  There is no single, canonical term in moral psychology or metaethics that captures this specific phenomenon in its entirety, though it is widely recognized as a composite of several well-documented cognitive and social mechanisms. The pattern you describe is a **meta-ethical double standard** driven by identity-protective cognition.

  However, because existing terms describe the *mechanisms* (why it happens) or the *attitude* (how it feels) rather than the specific *classification move* (demoting an opponent's value to a bias while elevating one's own), the literature lacks a precise label for the asymmetry itself.

  Below is an analysis of the closest existing concepts, followed by a proposed term to fill the gap, and a delineation of the boundary conditions you requested.

  ### 1. Existing Concepts (and Why They Are Incomplete)

  Three established concepts map onto parts of this phenomenon, but none capture the specific *ontological demotion* of the opponent's commitment.

  *   **Naïve Realism (specifically Moral Naïve Realism):** This is the psychological conviction that one perceives the world objectively, while others perceive it through the distorting lens of ideology, bias, or self-interest.
      *   *Why it's close:* It explains the "I see values, you see biases" dynamic.
      *   *Why it's incomplete:* It describes a general epistemic stance, not the specific reclassification of a normative commitment from "value" to "preference."
  *   **The Bias Blind Spot:** The cognitive bias of recognizing the impact of biases on the judgment of others, while failing to see the impact of biases on one's own judgment.
      *   *Why it's close:* It explains the asymmetry in attribution.
      *   *Why it's incomplete:* It usually applies to *accuracy* or *reasoning*, not to the *status* of a commitment (i.e., whether it counts as a universal value).
  *   **Cultural Cognition (Kahan et al.):** The tendency to conform one's beliefs about risk and fact to those of one's cultural group to maintain identity cohesion.
      *   *Why it's close:* It explains the *group alignment* trigger you identified.
      *   *Why it's incomplete:* It focuses on factual beliefs (e.g., "Is climate change real?") rather than the meta-ethical classification of commitments (e.g., "Is this a value or a preference?").

  **The Missing Label:** While **Asymmetric Moralization** is sometimes used to describe turning preferences into morals for oneself but not others, it typically refers to the *intensity* of moral concern, not the *ontological status* of the commitment.

  ### 2. Proposed Term: **Axiological Asymmetry**

  To precisely name the failure mode you described, I propose the term **Axiological Asymmetry** (or, more critically, **Normative Solipsism**).

  **Definition:** *Axiological Asymmetry* is the selective assignment of ontological status to normative commitments, wherein commitments held by the in-group are classified as objective values (universal, binding, fact-like) and structurally parallel commitments held by the out-group are classified as subjective preferences (parochial, optional, bias-like), without a consistent meta-ethical criterion for the distinction.

  **Why this term:** "Axiology" is the philosophical study of value. "Asymmetry" captures the directional nature of the classification. It distinguishes the act from simple disagreement by focusing on the *status assignment*.

  ### 3. Differentiation from Related Concepts

  You asked how this differs from in-group favoritism, motivated reasoning, and moral relativism. The distinctions lie in the *mechanism* and the *claim to truth*.

  | Concept | Mechanism | Claim to Truth | How it Differs from Axiological Asymmetry |
  | :--- | :--- | :--- | :--- |
  | **In-Group Favoritism** | Social identity protection; positive regard for "us." | Neutral/Positive | Favoritism grants *status* or *resources* to the group. Axiological Asymmetry grants *ontological reality* to the group's norms. It is epistemic, not just social. |
  | **Motivated Reasoning** | Cognitive processing driven by desired outcomes. | Variable | Motivated reasoning is the *engine* that drives the asymmetry. Axiological Asymmetry is the *output* or the specific structural failure in classification. |
  | **Moral Relativism** | The belief that values are culture-bound and not universal. | Negative (denies universality) | The speaker committing Axiological Asymmetry claims **Objectivity**. They assert *their* values are universal. A relativist would admit *both* sides are merely local preferences. |
  | **Epistemic Injustice** (Fricker) | Unfairness in matters of knowledge/credibility. | Variable | Axiological Asymmetry is a specific *type* of hermeneutical injustice where the victim is denied the conceptual resource of having "values" rather than "biases." |

  ### 4. Boundary Conditions: When Does Distinction Become Failure?

  Not every distinction between value and preference is an instance of Axiological Asymmetry. We distinguish between "fundamental rights" and "mere preferences" legitimately all the time. The failure occurs specifically when the **criterion for classification is non-universalizable.**

  **The Boundary Test: The Reflexivity Condition**
  A legitimate distinction becomes *Axiological Asymmetry* when the speaker cannot apply their own classification criterion to themselves without undermining their own position.

  *   **Legitimate Distinction:** "I hold this as a value because it minimizes suffering (Criterion X). You hold that as a preference because it increases suffering (Fails Criterion X)."
      *   *Result:* The criterion (suffering) is external to the agent.
  *   **Axiological Asymmetry:** "I hold this as a value because it is deeply felt and identity-constituting (Criterion Y). You hold that as a preference because it is deeply felt and identity-constituting (Fails Criterion Y due to source)."
      *   *Result:* The criterion (source/identity) makes the classification circular.

  **Where the Failure Lies**
  The failure lies in the **Refusal of Meta-Ethical Reflexivity**.
  1.  **Not in the Classification:** It is not inherently wrong to classify some commitments as biases.
  2.  **Not in the Reasoning:** The internal logic for *why* a specific value is good may be sound.
  3.  **In the Application:** The failure is in the refusal to subject the *method of classification* to the same scrutiny as the *content of the commitment*.

  ### Summary
  The phenomenon is a form of **Epistemic Hypocrisy** grounded in **Naïve Realism**. While **Cultural Cognition** explains the trigger and the **Bias Blind Spot** explains the psychology, **Axiological Asymmetry** is the precise term for the structural move of elevating in-group norms to "Values" while demoting out-group norms to "Biases."

  It differs from relativism because it claims objectivity for the self; it differs from favoritism because it alters the *reality status* of the claim, not just its social weight. The failure is located in the **non-universalizability of the meta-ethical criterion**: if the test for "value" cannot be applied to the tester without collapsing their own claim, it is Axiological Asymmetry.
