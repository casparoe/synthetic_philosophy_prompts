answer: |-
  Here is a decision procedure designed for your kitchen table. It strips out the metaphysical baggage and keeps only the distinctions that affect narrative identity. It is not a truth machine; it is a consistency tool.

  ### The "Genesis & Path" Check

  Run these four questions in order. If you get a **NO** at any stage, stop. The variant is a **Different Person** (Stranger/Spooked). If you get **YES** all the way through, it is the **Same Person** (Alt-Version/Grief).

  **1. The Blueprint Check (Nuclear DNA)**
  *   **Question:** Does the variant possess the exact same nuclear DNA as the original character?
  *   **The Rule:** If the nuclear code differs, it is a different person.
  *   **Why:** This flattens the "regress" snag. We stop at the zygote. We do not ask where the parents came from or what atoms make up the DNA. The unique combination of nuclear genetic material is the narrative "seed."
  *   **The Mitochondria Fix:** Treat mitochondrial DNA and egg cytoplasm as *environment* (like the womb), not *origin*. If the nucleus is the same, pass this check. This solves your "three-parent" snag: it counts as the same person for the purposes of the novel, even if a strict biologist might twitch.

  **2. The Token Event Check (Conception)**
  *   **Question:** Did the specific physical event that created that DNA happen in the same causal chain?
  *   **The Rule:** We are looking for the *token* event (this specific union), not the *type* of event (a union of similar cells).
  *   **Why:** This handles the "Clone" snag. A clone has the same blueprint (mostly) but a different *event* (somatic transfer vs. fertilization).
  *   **The Fertilization Fix:** Define the "Event" as **Syngamy** (the moment the nuclei merge). Before that, it's process. After that, it's identity. This gives you a sharp line for your "fertilisation isn't an instant" problem.

  **3. The Continuity Check (Existence)**
  *   **Question:** Is there an unbroken physical timeline between the Origin Event and the life being lived?
  *   **The Rule:** Time gaps (freezing) are allowed. *Termination* of the entity is not.
  *   **Why:** This handles the "Frozen Embryo" snag. Pausing a tape doesn't change the movie. Destroying the tape and recording a new one does.
  *   **The Limit:** If the embryo dies and is *recreated* (even from the same cells), it fails here.

  **4. The Divergence Point (The Creative Override)**
  *   **Question:** Does the variant diverge *before* or *after* the character develops a distinct psychological trajectory?
  *   **The Rule:**
      *   Divergence at conception/early biology = **Same Person** (Grief/Tragedy).
      *   Divergence that creates a separate spatiotemporal path (like twins) = **Different Person** (Stranger/Spooked).
  *   **Why:** This handles the "Twins" snag. Twins pass Check 1 and 2, but fail Check 4 because they occupy two bodies immediately.

  ***

  ### Addressing Your Snags (How the Procedure Flattens Philosophy)

  To make this work in ten minutes, I have had to flatten three philosophical distinctions. You need to know where the floor is weak.

  1.  **The Regress Stop:** You asked why we stop at gametes and not grandmothers. **Answer:** We don't stop because it's metaphysically true; we stop because *novels require individuals*. If you trace identity back to the matter of the gametes, everyone is everyone else. We arbitrarily declare the **Zygote** the start of the "Self." This is a narrative convention, not a fact.
  2.  **The Mitochondria Hack:** Strict origin essentialism says a different egg (even enucleated) makes a different person. I have told you to ignore this. **Reason:** For a family saga, nuclear DNA drives the "likeness" and "inheritance" themes. Treating cytoplasm as "environment" lets you keep the "one woman's life" structure without getting bogged down in cellular mechanics.
  3.  **The Time Gap:** Philosophy fights over whether time gaps break identity. **Reason:** For your book, freezing is a "pause button." As long as the *structure* of the embryo isn't destroyed, treat it as continuous existence.

  ***

  ### Running Your Three Variants

  Here is the procedure applied to your specific cases, including theEditor risk assessment.

  #### Variant 1: The Frozen Embryo
  *Same gametes, same zygote, frozen 12 years, implanted later into a different family.*

  *   **1. Blueprint:** YES (Same gametes = Same nuclear DNA).
  *   **2. Token Event:** YES (It is the *same* zygote, just paused. The syngamy event happened once).
  *   **3. Continuity:** YES (Freezing is a pause, not a death. The physical object persisted).
  *   **4. Divergence:** YES (The life path changes, but the origin is identical).
  *   **Verdict:** **SAME PERSON.**
  *   **Emotional Contract:** The reader should **Grieve**. This is the same soul denied her original time and family.
  *   **Editor Risk:** **Low.** This fits the "one woman's life" brief perfectly. It is a life interrupted and resumed.

  #### Variant 2: Identical Twins
  *Same sperm, same egg, zygote splits. You want to know if you can swap them.*

  *   **1. Blueprint:** YES (Identical DNA).
  *   **2. Token Event:** YES (Same fertilization).
  *   **3. Continuity:** **FAIL.**
  *   **Why:** The procedure identifies that while the *origin* is shared, the *path* bifurcates immediately into two distinct bodies. You cannot have "one woman's life" if there are two bodies. If your variant is "What if the *other* twin lived?", that is a different person (her sister). If your variant is "What if this twin didn't split?", that is a different biological event (fails Check 2).
  *   **Verdict:** **DIFFERENT PERSON.**
  *   **Emotional Contract:** The reader should feel **Spooked/Unsettled**. Treating twins as interchangeable souls is uncanny.
  *   **Editor Risk:** **High.** If your editor wants a single throughline, you cannot use the twin as a "variant" of the protagonist. She is a sister, a double, or a ghost, but not *her*. If you write the twin's life as if it were the protagonist's, the editor will rightly call it a continuity error.

  #### Variant 3: The Clone
  *Skin cell from mother, nucleus into donor egg, no sperm.*

  *   **1. Blueprint:** **ALMOST.** (Nuclear DNA is the mother's, not the character's original mix. Wait—if you are cloning the *protagonist* from her own skin cell later, the DNA matches. If you are cloning the *mother* to make the protagonist, the DNA is different).
      *   *Assumption:* You mean creating the protagonist via cloning rather than fertilization.
  *   **2. Token Event:** **FAIL.**
  *   **Why:** Fertilization (Sperm + Egg) and Somatic Nuclear Transfer (Skin + Egg) are different *kinds* of causal events. Even if the DNA were identical, the "Genesis" is different. One is sexual reproduction; the other is asexual replication.
  *   **3. Continuity:** **FAIL.** (It is a new entity created from an existing one, not a continuation of the original zygote).
  *   **Verdict:** **DIFFERENT PERSON.**
  *   **Emotional Contract:** **Spooked/Horror.** A clone is a copy, not the original.
  *   **Editor Risk:** **Critical.** Your editor wants "one woman's life." A clone is a *second* life. If you pitch this as "It's still her," the editor will reject it. Philosophically and narratively, a clone is a sibling born later, not the same person reborn. To make this work, you would have to break the procedure and vote "Same Person" purely for thematic reasons (e.g., "She is her own mother"), but you must acknowledge you are breaking the rules of identity to do it.

  ***

  ### Where The Procedure Will Misfire (The Honest Warning)

  You asked me to be straight about where this tool will break. Here are the failure points:

  1.  **The "Psychological Continuity" Trap:**
      The procedure prioritizes *biological origin*. If you write a variant where the biology is the same (Frozen Embryo) but the upbringing is so different that her personality is unrecognizable, the procedure says "Same Person," but the *reader* will say "Stranger."
      *   **Fix:** If the personality diverges too far, ignore the procedure. Trust the reader's intuition over the biology.

  2.  **The Editor's "One Life" Constraint:**
      Your editor wants a single throughline. The procedure (correctly) identifies Twins and Clones as *different* people.
      *   **Fix:** You have a choice. Either accept the procedure and tell the editor "Book 3 is about lineage, not just one individual," or override the procedure for the Clone/Twin cases and explicitly frame them as "Metaphorical Identities" rather than literal ones. Do not try to argue they are literally the same person; you will lose that argument.

  3.  **The "Grief vs. Spooked" Binary:**
      The procedure gives you a binary (Same/Different). Reality is a spectrum. There is a middle ground: **The Uncanny Familiar.** This is where the biology is the same, but the life is so wrong it feels like an imposter.
      *   **Fix:** Use the procedure to find the baseline. If it says "Same," but you want "Spooked," lean into the *environmental* changes (the 12-year freeze, the different family) to create that uncanny valley without breaking the identity contract.

  ### Summary for the Kitchen Table

  1.  **First Question:** Is the Nuclear DNA identical? (No = Stop, Stranger).
  2.  **Good Enough Answer:** Yes, the code matches. (Ignore mitochondria).
  3.  **Stop Point:** If the *method* of creation changes (Sex vs. Clone) or the *body* splits (Twins), stop. It's a Different Person.
  4.  **Hand Back:** If DNA and Method match, but the life is wildly different, the decision is yours. That is no longer philosophy; that is theme.

  **Recommendation for Chapter Four (Mitochondria):**
  Treat the mitochondrial donation as the **Same Person**. Use the procedure's rule that cytoplasm is "environment." It keeps your "one woman's life" structure intact and avoids a metaphysical rabbit hole that adds nothing to the emotional stakes. The "stranger" element there isn't her DNA; it's the medical intervention itself. Focus the spookiness on the *clinic*, not the *identity*.
