prompt: |-
  I'm a science-and-ideas journalist and I've somehow let myself be talked into running a 90-minute session at a summer school for foreign correspondents in September. About 16 people: mostly reporters, a few foreign-desk editors, mixed nationalities, nobody's a lawyer and nobody's a specialist in this. What I want them to walk out having *felt* is that picking a word for a mass atrocity isn't reading a verdict off the facts — it's a move, with consequences attached: legal duties that switch on, diplomatic blowback, what survivors get to say happened to them, whether your stringer keeps her visa, whether the desk can defend the sentence in print a week later. And that the legal use of the word and the ordinary moral one pull apart in ways you can't paper over. I do not want to stand up and explain this. I want the room to run into it.

  So design me a runnable thing: a staged editorial conference or role-play where they have to actually decide what to print. Invent the case — fictional country, fictional group, obviously made up, because if it smells like a real one half the room will spend the hour arguing about that instead. Build it so the knotty parts are structural, not decorative:

  - The targeted group is defined ambiguously. The perpetrators classify them one way (religious, say, or by a category the census doesn't use), the victims describe themselves another. Ideally it straddles one of the four group-types the 1948 convention covers and something the treaty leaves out. So the group question is genuinely not settled by the facts.
  - The intent evidence — an intercepted order, a speech with one slippery phrase — only lands after they've already filed a first formulation. Make them commit before they know.
  - The death-toll estimate gets revised upward after publication. (There's a reason this should be able to move them, given how the treaty's "in whole or in part" gets read.)
  - Survivor voices in the room disagree with each other about whether they want the word. Not a monologue.
  - Every word they could print carries a real cost, drawn blind: access revoked, inquiry opened, a neighbouring state suddenly implicated, an exile community denouncing you, your lawyers, your audience tuning out.
  - The actual treaty text is available, but only if they pay for it — lose the front-page slot or go several hours later. Accuracy vs. speed, concretely.

  Give me roles, printed materials, a minute-by-minute timeline, and whatever rules keep them inside the fiction. They should end by producing one sentence for tomorrow's paper and being able to defend both the word and the hedge.

  Then the debrief: map specific moments onto specific features of the problem, tell me what will predictably go wrong (someone will say just describe what happened and let readers decide; someone will insist the exercise is rigged because I withheld facts — I think that's a feature, tell me how to use it), and be honest about what the game can't reproduce and I'll have to say myself — I'm thinking the real stakes, the decades-long process by which a label sticks or doesn't, and the fact that the word was coined (Lemkin, 1944) and the treaty definition that came later is narrower than the thing he was after. Leave me a slot for that at the end. Assume I can print stuff but nobody has a signal in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **User:** Science-and-ideas journalist.
      *   **Task:** Run a 90-minute session at a summer school for foreign correspondents (16 people, mixed nationalities, reporters/editors, non-lawyers).
      *   **Goal:** Participants should *feel* that labeling mass atrocity (specifically "genocide") is a strategic move with consequences, not just a factual verdict. They need to experience the tension between legal definitions, moral imperatives, and practical journalism constraints.
      *   **Method:** Role-play/Simulated Editorial Conference. No lecturing.
      *   **Key Mechanics:**
          *   Fictional country/group (to avoid real-world baggage).
          *   Ambiguous group definition (straddles Genocide Convention categories).
          *   Intent evidence revealed *after* initial commitment.
          *   Death toll revised upward later.
          *   Survivor disagreement on the label.
          *   Consequences for word choice (access, legal, diplomatic).
          *   Treaty text available but costly (time/space).
      *   **Deliverables:** Roles, printed materials, minute-by-minute timeline, rules, debrief guide (including predictable pitfalls and what the facilitator needs to add).
      *   **Constraint:** No signal in the room (offline materials needed).

  2.  **Deconstruct the Core Tension:**
      *   The core tension is between *Description* (what happened) and *Classification* (what we call it).
      *   The Genocide Convention (1948) is the legal anchor, but it's narrow.
      *   Journalism ethics demand accuracy but also impact.
      *   The simulation needs to force them to make a choice *without* perfect information, then complicate that choice.

  3.  **Drafting the Scenario (The "Fiction"):**
      *   *Country:* "Ostralía" (Sounds generic, maybe too close to Australia). Let's go with "Veltria."
      *   *Group:* The "Kaelo."
      *   *Perpetrators:* The Veltrian State Security.
      *   *Ambiguity:* Are the Kaelo an ethnic group or a political/religious sect? The census lists them as "Occupational Caste." The perpetrators call them "Subversives." They call themselves "Keepers of the Old Way." This straddles *National/Ethnic* vs. *Political* (which is excluded from the Convention).
      *   *Atrocity:* Mass graves found, forced sterilizations rumored.
      *   *Intent:* A memo exists but is ambiguous ("Final Solution to the Kaelo Problem" vs. "Resettlement").

  4.  **Designing the Mechanics (The "Game"):**
      *   *Teams:* 4 tables of 4 people. Each table is an "Editorial Board."
      *   *Phases:*
          1.  Initial Briefing & Drafting (Low info).
          2.  New Intel Drop (Intent + Death Toll).
          3.  Consequence Cards (The cost of the word).
          4.  Final Decision.
      *   *The "Cost":* Buying the Treaty Text costs "Column Inches" or "Time." Let's use "Time" (delays publication) vs. "Space" (printing the definition). Actually, the prompt suggests "lose front-page slot or go several hours later." Let's make it a resource token system.
      *   *The "Consequences":* Draw cards based on the headline word chosen.

  5.  **Developing the Materials:**
      *   *Briefing Packet:* Basic facts, conflicting witness statements.
      *   *The Treaty:* A simplified excerpt of the Genocide Convention (Article II).
      *   *Intel Updates:* Sealed envelopes.
      *   *Consequence Cards:* Specific outcomes for using "Genocide," "Crimes Against Humanity," "Ethnic Cleansing," or "Mass Killing."
      *   *Role Cards:* Editor-in-Chief, Foreign Desk, Legal/Standards, Field Correspondent.

  6.  **Refining the Timeline (90 Minutes):**
      *   00-10: Intro & Rules (Keep it tight).
      *   10-25: Phase 1 (Initial Draft).
      *   25-35: Phase 2 (Intel Drop & Treaty Purchase Decision).
      *   35-50: Phase 3 (Consequences & Revision).
      *   50-65: Phase 4 (Final Headline & Justification).
      *   65-90: Debrief (Crucial).

  7.  **Addressing Specific Constraints:**
      *   *Ambiguous Group:* Make sure the Kaelo definition is muddy in the briefing.
      *   *Intent Evidence:* Put this in the Phase 2 envelope.
      *   *Death Toll:* Start low (2,000), revise high (20,000) in Phase 3.
      *   *Survivor Voices:* Include quotes in the briefing that contradict each other on the label.
      *   *Treaty Cost:* They have to trade "deadline time" to read the legal definition properly.
      *   *No Signal:* All physical handouts.

  8.  **Anticipating Pitfalls (Debrief Prep):**
      *   *Pitfall 1:* "Just describe the acts." (The "Show, Don't Tell" objection). *Counter:* Does that inform the reader of the *nature* of the crime?
      *   *Pitfall 2:* "The game is rigged." (Withholding facts). *Counter:* That's reality. Fog of war is the point.
      *   *Pitfall 3:* Legalism vs. Morality. *Counter:* Lemkin's original intent vs. the 1948 compromise.

  9.  **Fleshing out the Details (Iterative refinement):**
      *   *Name:* Let's call the simulation "The Headline Game" or "The Veltria Protocol." Let's go with **"The Veltria Edit."**
      *   *Group Definition:* The Kaelo are defined by a dialect and a specific religious practice, but the government says they are a "political insurgency." The Convention protects national/ethnic/religious, *not* political. This is the crux.
      *   *Intent:* The memo says "Eliminate the Kaelo *threat*." Does that mean kill them or neutralize their politics?
      *   *Consequence Cards:* Need to be punchy. "Ambassador expelled," "Source arrested," "Donor pullout."

  10. **Final Review against User Prompt:**
      *   90 mins? Yes.
      *   16 people? Yes (4 tables of 4).
      *   Feel the consequences? Yes (Cards).
      *   Ambiguous group? Yes (Political vs. Religious).
      *   Intent later? Yes (Envelope 2).
      *   Death toll revision? Yes (Envelope 3).
      *   Survivor disagreement? Yes (Briefing).
      *   Treaty cost? Yes (Time penalty).
      *   Debrief guide? Yes.

  11. **Writing the Output:** Structure it clearly with sections for Prep, Materials, Run-of-Show, and Debrief. Ensure the tone is professional but actionable. (Self-Correction: Make sure the Treaty text is actually included or described so they can print it). I will provide the text for the handouts.

  12. **Final Polish:** Check the timing. 90 minutes is tight. The debrief needs at least 25 mins. That leaves 65 for the game. I need to be strict on the facilitator timing. I will emphasize the "Facilitator Script" for the intro to save time.

  *(Self-Correction during drafting)*: The prompt asks for the death toll revision to happen *after* publication (or at least after the first formulation). I need to make sure the simulation allows for a "First Draft" then a "Final Draft." The "Publication" in the sim is the Final Draft, but the *pressure* comes from knowing the toll might change. Wait, the prompt says "The death-toll estimate gets revised upward after publication." In a 90-min sim, we can't simulate *after* publication. We have to simulate the *risk* of it, or have a "Second Edition" scenario. Let's make it a "Morning Edition" vs "Evening Edition" dynamic within the 90 mins. They file the Morning headline, then get the new toll, and have to decide if they correct the Evening headline. That captures the instability.

  *Revised Plan:*
  Phase 1: Morning Edition (Low info).
  Phase 2: New Intel (Intent + Toll).
  Phase 3: Consequences.
  Phase 4: Evening Edition (Final decision).
  This works better.

  Let's finalize the "Treaty Cost." If they want to see the legal definition, they lose 10 minutes of deliberation time. That creates the "Accuracy vs. Speed" tension physically.

  Okay, ready to write.
answer: |-
  This is a high-stakes, high-fidelity simulation design. It is built to be printed and run offline. The goal is to create cognitive dissonance: the participants will want to be "right," but the mechanics will force them to choose between being legally precise, morally resonant, and operationally viable.

  # Simulation Title: The Veltria Edit
  **Time:** 90 Minutes
  **Participants:** 16 (4 tables of 4)
  **Materials:** Printed packets (see below), envelopes, pens, a visible timer.

  ---

  ## Part 1: Preparation & Materials

  You need to print four distinct packets. Do not mix them up.

  ### A. The Master Briefing (One per table)
  *Contains the base facts everyone starts with.*

  **HEADLINE: MASS GRAVES FOUND IN VELTRIA HIGHLANDS**
  **DATE:** September 14
  **STATUS:** URGENT

  **The Situation:**
  Veltrian State Security forces have entered the Kaelo Valley. Satellite imagery confirms 12 large-scale excavation sites. Local NGOs estimate 2,000 dead. Bodies show signs of execution-style killing.

  **The Group (The Kaelo):**
  *   **Veltrian Govt Statement:** "The Kaelo are an illegal political militia destabilizing the region. We are conducting counter-insurgency operations."
  *   **Kaelo Self-Description:** "We are the Keepers of the Old Way. We speak the Kaelic dialect and follow the Rite of the Sun. We are not soldiers; we are a people."
  *   **Census Data:** The Veltrian census does not list "Kaelo" as an ethnicity. They are categorized under "Occupational Caste: Herders."
  *   **International Status:** Veltria is a signatory to the 1948 Genocide Convention.

  **Survivor Testimony (Conflicting):**
  *   *Source A (Exile Leader):* "They are trying to erase us. If you do not call this **Genocide**, you are complicit."
  *   *Source B (Valley Resident):* "I just want the killing to stop. If you use that word, the government will never let aid in. Call it what you want, just get them to stop."

  **Your Task:**
  You are the Editorial Board of a major international newspaper. You must file the **Morning Edition Headline** (max 12 words) and the **Lead Sentence** (max 40 words) within 20 minutes.

  ### B. The "Cost of Accuracy" Card (One per table)
  *Place this face down. They can flip it only if they choose to verify the legal definition.*

  **OPTION: CONSULT LEGAL TEXT**
  You may request the text of the 1948 Genocide Convention Article II.
  **COST:** 10 Minutes of Deliberation Time.
  **PENALTY:** You miss the global wire service sync. Your story runs 6 hours later than competitors, losing the news cycle.
  *(If they choose this, hand them the Treaty Excerpt below).*

  **TREATY EXCERPT (Article II):**
  *Genocide means any of the following acts committed with **intent to destroy**, in whole or in part, a **national, ethnical, racial or religious group**...*
  *(Note: Political groups are NOT included).*

  ### C. Intelligence Envelope 1 (Hand out at T+25 mins)
  *Contains the Intent Evidence.*

  **INTERCEPTED MEMO (Veltrian Interior Ministry)**
  **TO:** Regional Command
  **SUBJECT:** Kaelo Problem
  **TEXT:** "The Kaelo identity is incompatible with state security. The cultural infrastructure must be dismantled. The demographic footprint must be reduced to negligible levels. Use necessary force to **eliminate the threat**."
  **ANALYST NOTE:** "Eliminate the threat" is ambiguous. Does it mean kill the people, or kill the political capacity?

  ### D. Intelligence Envelope 2 (Hand out at T+45 mins)
  *Contains the Death Toll Revision & Consequence Cards.*

  **WIRE UPDATE:**
  NGO on the ground has revised casualty estimates based on new satellite thermal imaging.
  **NEW ESTIMATE:** 22,000 dead. (Previous: 2,000).
  **CONTEXT:** This moves the scale from "massacre" to "potential destruction of a significant part."

  **CONSEQUENCE CARDS (Draw one based on your chosen keyword):**
  *   **If you printed "GENOCIDE":** Draw Card Alpha.
  *   **If you printed "CRIMES AGAINST HUMANITY":** Draw Card Beta.
  *   **If you printed "ETHNIC CLEANSING":** Draw Card Gamma.
  *   **If you printed "MASS KILLING/ATROCITY":** Draw Card Delta.

  *(Create a deck of these cards. There should be 4 of each type, shuffled, so tables get slightly different outcomes).*

  **Card Alpha (Genocide):**
  *   **Diplomatic:** Veltria expels your Bureau Chief.
  *   **Legal:** UN Special Rapporteur opens an inquiry citing your reporting.
  *   **Access:** No government sources will speak to you for 6 months.
  *   **Audience:** Donor communities mobilize; readership spikes 40%.

  **Card Beta (Crimes Against Humanity):**
  *   **Diplomatic:** Veltrian Ambassador requests a "clarification meeting."
  *   **Legal:** No automatic treaty trigger, but ICC prosecutor takes note.
  *   **Access:** Stringers in the capital are harassed/visas delayed.
  *   **Audience:** Accusations of "hedging" on social media.

  **Card Gamma (Ethnic Cleansing):**
  *   **Diplomatic:** Neighboring states panic; border closures begin.
  *   **Legal:** Term has no standalone legal definition in treaty law.
  *   **Access:** Humanitarian access granted (govt wants to show "cleaning" not "killing").
  *   **Audience:** Confusion among readers (is this war or genocide?).

  **Card Delta (Mass Killing/Atrocity):**
  *   **Diplomatic:** Veltrian Govt praises your "objective reporting."
  *   **Legal:** No legal duties triggered for signatory states.
  *   **Access:** Full access granted to government sites.
  *   **Audience:** Exile community boycotts your publication. Accusations of cowardice.

  ---

  ## Part 2: Run-of-Show (Minute-by-Minute)

  **00:00 – 00:10 | The Setup (Facilitator)**
  *   **Do not lecture.** Read this script:
      *   "You are the Editorial Board. A story is breaking. You have 20 minutes to file your Morning Edition headline and lead sentence."
      *   "You have a Briefing Packet. You have conflicting sources. You have a deadline."
      *   "You can buy the Legal Treaty Text, but it costs you 10 minutes of your deadline. That is your choice."
      *   "Go."

  **00:10 – 00:30 | Phase 1: The First Commitment**
  *   Tables discuss and write their Morning Headline/Lead on the provided template.
  *   **Facilitator Role:** Walk around. If a table asks "Is it legally genocide?", answer: "What does your gut say? Do you want to pay for the text?"
  *   **T+20:** Collect the Morning Headlines. Post them on the wall (or read them out). Do not judge them.

  **00:30 – 00:45 | Phase 2: The Intent Trap**
  *   Hand out **Intelligence Envelope 1** (The Memo).
  *   Tell them: "This just came in. You have 5 minutes to discuss: Does this change your Morning Headline for the Evening Edition?"
  *   *Observation:* Most will hesitate. The memo is slippery ("eliminate the threat").
  *   **Facilitator Note:** If they bought the Treaty earlier, they know "political threat" isn't genocide. If they didn't, they are guessing.

  **00:45 – 01:05 | Phase 3: The Scale & The Cost**
  *   Hand out **Intelligence Envelope 2** (Death Toll + Consequence Cards).
  *   "The death toll is now 22,000. 'In whole or in part' is now a heavier factor."
  *   "Draw your Consequence Card based on the word you intend to use in the Evening Edition."
  *   Tables read their consequences. This is usually the loudest part of the room. They will argue about access vs. truth.
  *   **Task:** Finalize the **Evening Edition Headline & Lead**. You must stand by this.

  **01:05 – 01:15 | The Filing**
  *   Each table reads their final Headline and Lead.
  *   They must also state: "We accept [Consequence X] as the cost."

  **01:15 – 01:30 | The Debrief (Facilitator Led)**
  *   (See Part 3 below).

  ---

  ## Part 3: The Debrief Guide

  This is where you do the "teaching," but anchor it in what just happened. Do not start with theory. Start with their pain points.

  **1. The "Just Describe It" Objection**
  *   *Predictable Moment:* Someone will say, "Why didn't we just write '22,000 dead bodies found' and let readers decide?"
  *   *Your Move:* Ask the table that did that (or closest to it): "Did your Consequence Card protect your access? Did the exile community boycott you?"
  *   *The Point:* Neutrality is not a vacuum. Refusing to classify is itself a classification. It leaves the *perpetrator's* definition (counter-insurgency) as the default.

  **2. The "Rigged Game" Objection**
  *   *Predictable Moment:* "We couldn't know the intent! The memo was vague. The game is impossible."
  *   *Your Move:* Agree. "Exactly. In September 1941, or March 1994, or today, you do not have the memo. You have smoke. The legal definition requires *intent*, but intent is the last thing a regime admits to. You are being asked to diagnose a mental state from a body count."
  *   *The Point:* The law requires a standard of proof that journalism rarely has access to in real-time.

  **3. The Treaty vs. The Moral Word**
  *   *Your Move:* Pull up the definition of Genocide (Lemkin's) vs. the Convention.
  *   *The Point:* "Raphael Lemkin coined 'genocide' to mean the destruction of a group's culture, language, and existence. The 1948 Treaty narrowed this to 'physical/biological destruction' of 'national/ethnic/religious' groups to get nations to sign it. Political groups were cut out to protect the USSR and others. When you use the word legally, you invoke the Treaty. When you use it morally, you invoke Lemkin. They are not the same word."

  **4. The Consequence of the Label**
  *   *Your Move:* Refer to the Consequence Cards.
  *   *The Point:* "If you print 'Genocide,' you trigger the Convention. Signatory states are technically obligated to act. If they don't, your headline exposes *their* complicity. That is why they will fight you on the word. It's not semantics; it's liability."

  **5. The "Sticking" Process**
  *   *Your Move:* This is the slot for your closing monologue.
  *   *Script:* "In this room, you decided in 60 minutes. In reality, this takes decades. The Holodomor was famine for 50 years, then genocide. Srebrenica was massacre, then genocide. The word doesn't stick because the facts change; it sticks because the *political cost* of denying it eventually becomes higher than the cost of admitting it. You are not just reporting history; you are lobbying for the label that will define it."

  ---

  ## Part 4: Facilitator Cheatsheet (What Can Go Wrong)

  **Problem:** One table finishes way too fast.
  **Fix:** Have a "Red Team" question ready. Go to them and say: "The Veltrian Ambassador is on the phone. He says if you print that word, your stringer in the capital will be arrested for espionage. Do you confirm?"

  **Problem:** Everyone refuses to use "Genocide."
  **Fix:** In the debrief, highlight this. "The room self-censored. Why? Was it legal caution or fear of the Consequence Cards? That is the chilling effect."

  **Problem:** Everyone uses "Genocide" recklessly.
  **Fix:** In the debrief, highlight the "Access Revoked" cards. "You told the truth. Now your source in the valley is expelled. Who tells the story tomorrow?"

  **Problem:** They argue about the fiction (Veltria).
  **Fix:** Hard stop. "Veltria does not exist. The dilemma does. Stay in the sim."

  ---

  ## Part 5: Printing Instructions

  1.  **Briefing Packets:** 4 copies.
  2.  **Treaty Cards:** 4 copies (Keep these separate, only hand out if "bought").
  3.  **Envelope 1 (Intent):** 4 copies, sealed.
  4.  **Envelope 2 (Toll + Consequences):** 4 copies, sealed. Inside, place 4 shuffled Consequence Cards corresponding to the likely outcomes, or just a deck of 16 cards they draw from. *Recommendation:* Create a deck of 16 Consequence Cards (4 of each type), shuffle them, and place 4 in each Envelope 2.
  5.  **Newsroom Templates:** 16 slips of paper with "MORNING HEADLINE," "EVENING HEADLINE," and "JUSTIFICATION" printed on them.

  ## Final Note for the Journalist
  You are not teaching them law. You are teaching them **power**. The law is just the mechanism by which power is enforced or evaded. When they leave, they should feel the weight of the noun. If they feel uneasy about the word "Genocide" afterwards, you have succeeded. That unease is the professional responsibility kicking in.
