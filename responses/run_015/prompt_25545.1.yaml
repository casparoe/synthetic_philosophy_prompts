answer: |-
  **Term Paper Proposal**

  **Title:** Beyond the Individual Will: A Joint Commitment Account of Promissory Obligation

  **1. Research Question**
  Standard theories of promissory obligation struggle to explain the distinctive *normative standing* of the promisee. If promising is merely an individual act of will, a psychological expectation, or adherence to a social rule, why does the promisee specifically acquire the right to demand performance or issue blame? This paper asks: **Can a joint commitment framework resolve the "normative gap" left by individualistic accounts of promising, specifically by explaining the promisee's special standing to hold the promisor accountable?**

  **2. Background and Problem Statement**
  The central puzzle of promising is explaining how a voluntary utterance can create a binding moral obligation where none existed before. In our course, we have examined three dominant families of answers, all of which share a methodological individualism that leaves a critical explanatory gap.

  *   **Consent/Will Theory:** This view argues that by promising, I voluntarily bind my future self. The obligation stems from the autonomy of the promisor.
      *   *The Gap:* This pushes the question back a step. Why does the act of consenting to an obligation *create* one? Furthermore, this view struggles to explain why the *promisee* has special authority. If the obligation is just about my own consistency or autonomy, why do *you* have the right to demand I keep it, rather than just any moral observer?
  *   **Expectation/Harm Theory:** This view argues that breaking a promise is wrong because it disappoints expectations and causes harm.
      *   *The Gap:* This reduces promising to a subset of the general duty not to harm. It misses the distinctive *normative* nature of the bond. I can create expectations without promising (e.g., by habitual behavior), but that doesn't give you the right to demand I continue the habit. Promising seems to create a right, not just a prediction of safety.
  *   **Practice/Convention Theory:** This view argues that obligation arises from participating in a social institution of promising.
      *   *The Gap:* This makes the obligation external to the relationship. It struggles to explain "private promises" made between two people who might not fully grasp the social convention, or why breaking a promise feels like a betrayal of *the person*, not just a violation of *the rule*.

  **The Common Blind Spot:** All three accounts treat the promisor and promisee as separate agents whose moral landscapes merely overlap. They view the obligation as monadic (I have a duty) or weakly dyadic (I have a duty regarding you). They fail to capture the intuition that promising creates a *new normative entity*: a "we."

  **3. Proposed Approach: Joint Commitment and Shared Agency**
  My hypothesis is that promissory obligation is best understood not as an individual obligation triggered by speech, but as the creation of a **joint commitment**. Drawing on literature regarding shared agency and joint commitment (e.g., the work of Margaret Gilbert and related contemporary accounts), I will argue that when A promises B, they do not merely exchange intentions. Instead, they jointly commit to a course of action as a body.

  This approach offers a solution to the "normative gap" regarding standing:
  1.  **Creation of the "We":** The promise creates a plural subject. The obligation is not "mine" to carry alone; it is "ours" to uphold.
  2.  **Explaining Standing:** Because the commitment is joint, both parties are equally responsible for upholding it. This gives the promisee the specific standing to demand performance—not as an external observer, but as a co-author of the commitment.
  3.  **Explaining Release:** This framework also elegantly explains why only the promisee can release the promisor. Since the commitment is joint, it cannot be dissolved unilaterally by the promisor; it requires the concurrence of the other joint committer.

  **4. Plan of Work and Structure**
  Given the 3,000-word limit for the final paper, the argument must be tight and focused. I will not attempt to defend the metaphysics of joint commitment in its entirety, but rather apply it specifically to the problem of *standing*.

  *   **Introduction (approx. 400 words):** Define the problem of promissory obligation. State the thesis: Individualistic accounts fail to explain the promisee's special standing; a joint commitment account succeeds.
  *   **The Failure of Individualism (approx. 800 words):** Briefly critique Consent and Expectation theories. Focus specifically on their inability to explain why the promisee has the *right to demand* performance, rather than just being a beneficiary of it.
  *   **The Joint Commitment Alternative (approx. 1000 words):** Sketch the joint commitment view. Explain how the "pooling of wills" creates a normative relationship that grants mutual authority. Use the concept of "rescission" (releasing from a promise) as a test case to show the superiority of this view.
  *   **Objection and Reply (approx. 500 words):** Address the strongest objection: Does this view make promising too demanding? (e.g., does every promise create a "group"?). I will argue that the "group" here is minimal and temporary, sufficient for the obligation but not requiring full-blown shared agency in all contexts.
  *   **Conclusion (approx. 300 words):** Summarize the argument and suggest implications for how we understand moral relationships more broadly.

  **5. Feasibility and Scope Assessment**
  **Is this too big for a semester project (3,000 words)?**
  Yes, honestly, it is risky. The metaphysics of joint commitment is dense, and the literature on promising is vast. A 3,000-word paper is roughly 10–12 pages single-spaced. Trying to critique three major theories *and* construct a positive joint-commitment account *and* handle objections is likely to result in a paper that is a mile wide and an inch deep.

  **How to Narrow It:**
  To make this feasible for 3,000 words, I propose narrowing the focus in the following way:
  *   **Drop the Practice/Convention Critique:** I will focus primarily on the **Consent/Will Theory**, as it is the strongest rival. The Expectation theory is often seen as a subsidiary of harm, and Practice theory is less dominant in contemporary debates. Focusing on Will Theory allows for a deeper dialectic.
  *   **Focus on One Phenomenon:** Instead of explaining "why promises bind" generally, I will focus exclusively on **the right to demand/release**. This is the specific "data point" that individualistic accounts struggle with. This gives me a concrete metric for success.
  *   **Limit the Positive Account:** I will not defend the full ontology of "plural subjects." I will use joint commitment as a *functional* explanation for the normative relationship, avoiding deep metaphysical debates about group agency unless necessary.

  **6. Deliverables**
  *   **Annotated Bibliography:** A list of 5–7 key texts (including course readings and external sources on joint commitment) with brief summaries of their relevance.
  *   **Detailed Outline:** A section-by-section breakdown with topic sentences for each paragraph to ensure the argument flows within the word limit.
  *   **First Draft:** To be submitted for peer review two weeks before the deadline, focusing on the clarity of the "standing" argument.
  *   **Final Paper:** 3,000 words, formatted according to course guidelines.

  **7. Criteria for Success and Failure**
  **Success looks like:**
  *   Clearly distinguishing between "having a duty" and "being subject to a demand."
  *   Demonstrating that the Will Theory cannot bridge this gap without begging the question.
  *   Showing how the joint commitment model explains the promisee's authority without invoking a mysterious new moral fact.
  *   Staying within the word limit while maintaining argumentative depth.

  **Failure looks like:**
  *   **Vagueness:** Using terms like "joint commitment" or "we" as buzzwords without defining the normative mechanics of how they work.
  *   **Strawmanning:** Misrepresenting the Will Theory (e.g., ignoring sophisticated versions that try to account for standing).
  *   **Scope Creep:** Trying to solve the entire problem of obligation rather than focusing on the specific issue of *standing* and *release*.
  *   **Metaphysical Bloat:** Spending too many words defending the existence of "group agents" rather than showing how the concept helps explain promising.

  **8. Conclusion**
  This project moves beyond the standard survey of promissory theories to diagnose a structural flaw in how we conceptualize moral relationships. By shifting the unit of analysis from the individual to the joint, I aim to show that promising is not just about binding the future, but about binding *together*. While the word count constraint requires a narrow focus on the "right to demand," this specific angle provides a clear test case for the superiority of the joint commitment view.

  ***

  ### **Honest Advice on Scope (Read Carefully)**

  I need to be very direct with you: **3,000 words is extremely short for a philosophy term paper.**

  Most upper-level philosophy papers are between 4,000 and 6,000 words. 3,000 words is roughly 10 pages single-spaced. In that space, you barely have room for an introduction, one strong objection, and one reply.

  **If the 3,000 words refers to the FINAL PAPER:**
  The proposal above is written to help you survive that constraint. You *must* narrow the scope. Do not try to critique Consent, Expectation, *and* Practice theories. Pick **one** (usually Consent/Will is the best foil for Joint Commitment) and beat it on **one** specific point (the Right to Demand/Release). If you try to do too much, the paper will feel like a list of summaries rather than an argument.

  **If the 3,000 words refers to the PROPOSAL itself:**
  That is an unusually long proposal (basically a first draft). If your professor actually wants a 3,000-word *proposal*, you need to expand the "Background and Problem Statement" section significantly. You would need to write out the arguments for Consent and Expectation theory in more detail, perhaps reconstructing a specific argument from a philosopher like Scanlon or Shiffrin, before critiquing them. You would also need to expand the "Plan of Work" into a chapter-by-chapter summary.

  **My Recommendation:**
  Clarify the word count requirement with your professor.
  *   If the **paper** is 3,000 words: Use the proposal above, but adhere strictly to the "Narrowing" advice in section 5.
  *   If the **proposal** is 3,000 words: Expand the critique section. Reconstruct the strongest version of the Will Theory argument (e.g., "I bind myself by my own autonomy"), then explain exactly where it fails regarding the promisee's standing. Then expand the Joint Commitment section to explain the metaphysics of "pooling wills" in more detail.

  **One final philosophical tip:**
  Look up **Seana Shiffrin**. She writes specifically about the "distinctiveness of promising" and the "right to demand." Her work aligns perfectly with your intuition but is distinct from Margaret Gilbert's "joint commitment" (which is more metaphysical). You might find Shiffrin's approach easier to fit into a short paper because it is more strictly moral/normative rather than metaphysical. You can use Gilbert's "joint commitment" as the mechanism for Shiffrin's "distinctive standing." Combining them could be a very strong move.
