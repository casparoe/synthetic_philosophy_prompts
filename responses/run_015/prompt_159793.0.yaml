answer: |-
  Your principle is coherent. It is a recognized ethical distinction, often framed as the difference between *utilitarian aggregation* (weighing total happiness against total pain) and *threshold deontology* (certain rights or dignities cannot be violated regardless of the aggregate good, unless the stakes are catastrophic).

  You ask three specific questions: Is the principle coherent? Can it be stated without bias? Does it decide anything in your case of uncertainty?

  **1. Coherence**
  The principle holds. Ethical systems generally acknowledge that there is a lexical priority to certain kinds of harm. We accept minor inconveniences to others for the sake of general welfare (traffic laws, noise, taxation). We do not accept the sacrifice of an individual's bodily autonomy or psychological integrity for the sake of general welfare, unless that welfare involves survival or preventing greater violation.

  In your context, the "good" is aesthetic pleasure. The "bad" is the re-opening of a trauma that the subject has explicitly asked to remain closed. In almost any ethical framework, aesthetic pleasure does not possess the moral weight necessary to override a veto regarding personal trauma. The principle is sound: there are harms that cannot be purchased by others' enjoyment.

  **2. Stating it without relocating preference**
  You noted that the line tends to fall "just above whatever I most want to do." This is not a failure of the principle, but a failure of its *definition*. Currently, you are defining the line based on the *intensity of the suffering*. This is subjective and unknowable to you, which allows your desire to fill the vacuum.

  To state the principle cleanly, you must shift the criterion from the *amount of pain* to the *nature of the claim*. The line is not drawn at "severe suffering versus mild suffering." It is drawn at "sovereignty."

  A cleaner statement of the principle would be: *An author may utilize family history freely until doing so requires overriding the explicit consent of a living subject regarding their own dignity. Once a subject withdraws consent regarding a specific wound, the author's claim to that material ends, regardless of the artistic merit derived from it.*

  This removes your preference from the equation. It does not ask you to measure your mother's pain (which you admit you cannot do). It asks you to measure her agency. If the principle is based on sovereignty rather than pain quantification, the "line" is fixed at the point of her request, not at the point of your artistic need.

  **3. Does it decide anything in this case?**
  You ask if the principle decides anything when you are unsure where the line lies and whether the case crosses it.

  It does decide, but it functions as a burden of proof rather than a scale.

  When the good and the bad are entangled—when the artistic merit is *parasitic* on the wound—you are not weighing two separate items. You are evaluating a transaction where the currency is the subject's dignity. In cases of uncertainty regarding the severity of the harm, the principle dictates a precautionary stance. If you cannot verify that the harm is below the threshold, you must assume it is above it.

  Why? Because the benefit (reader pleasure) is non-essential, while the risk (psychological harm to a parent who has requested protection) is potentially fundamental. When the benefit is aesthetic and the cost is ethical, ambiguity must be resolved in favor of the subject, not the artist.

  Furthermore, the entanglement you describe creates a specific ethical category: *instrumentalization*. You are not merely publishing a book that happens to hurt her; you are publishing a book that *requires* her hurt to achieve its value. This collapses the utilitarian calculus. You cannot justify using a person as a means to an end (even a beautiful end) without their consent.

  **Conclusion**
  The principle is coherent. It can be stated cleanly by shifting the focus from the *measurement of pain* to the *violation of veto*. And it does decide this case: it dictates that when the artistic value is dependent on the wound, and the subject has withdrawn consent, the uncertainty regarding the depth of the wound must be resolved by preserving the subject's sovereignty.

  The principle does not tell you whether your mother will be hurt more or less than you fear. It tells you that your uncertainty is irrelevant because you do not hold the rights to the material in question. The decision is not yours to make based on the book's quality, but based on the source of its material.
