  ***

  # EXAM PAPER: PHILOSOPHY OF ECONOMICS (ECO405)
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1000 Words Maximum
  **Total Marks:** 25

  **Instructions:** Answer the following question. You may assume familiarity with standard choice theory (budget sets, preference relations, WARP/GARP). Do not waste words defining basic terms; focus on the philosophical implications.

  **Question 1**

  Standard Revealed Preference (RP) theory treats utility as an ordinal representation of choice, invariant up to monotonic transformation. However, welfare economics often treats utility as a cardinal, interpersonally comparable magnitude sufficient to justify compensation tests.

  Consider the following two challenges to the RP framework:

  1.  **The Denomination Problem:** Suppose neuroscientists identify a real-valued quantity, $N$ (e.g., dopamine flux), such that every agent's choices exactly maximize their own $N$. We now have a cardinal, biologically grounded measure that predicts choice perfectly. Does this solve the interpersonal comparison problem? Specifically, what additional premise is required to move from "agents maximize $N$" to "policy should maximize sum of $N$"?
  2.  **The As-If Agent:** Suppose an agent's choices satisfy GARP across all observed budget sets, implying they act *as if* maximizing a utility function $u$. However, the causal mechanism is a heuristic: "always pick the option nearest the top-left of the menu." Is the utility function $u$ merely curve-fitting? What role do counterfactual choices (unavailable goods, new menus) play in distinguishing a genuine representation from a mathematical artifact?

  **Essay Prompt:**
  Construct a unified argument addressing whether "utility" can bear the normative weight welfare economics requires. In your answer, you must: (a) explain why RP is not vacuous despite being "just representation"; (b) analyze whether the existence of $N$ bridges the gap between positive and normative economics; and (c) determine whether the reality of the causal mechanism matters for the validity of the utility attribution. **Take a definitive verdict:** Can revealed preference utility ground welfare claims, or does it require external ethical premises?

  ***

  # MODEL ANSWER (Approx. 800 words)

  **Verdict:** Revealed preference utility cannot ground welfare claims without external ethical premises. The mathematical consistency of choice (RP) and the biological consistency of neural correlates ($N$) are positive facts; welfare is a normative category. Bridging them requires a moral axiom, not better measurement.

  **The Non-Vacuity of Revealed Preference**
  It is a common error to dismiss RP as tautological ("they chose it, so they preferred it"). It is not. RP imposes strict falsifiable constraints on behavior, specifically the Generalized Axiom of Revealed Preference (GARP). If an agent chooses bundle $A$ when $B$ is affordable, and later chooses $B$ when $A$ is affordable, they violate WARP. If they violate transitivity in revealed choices over longer chains, they violate GARP. RP is not vacuous because it rules out specific patterns of behavior (e.g., money pumps). It asserts that agents behave *consistently*. However, consistency is not goodness. A sociopath can have perfectly transitive preferences over victims. The fact that choices can be represented by a function $u$ proves only that the agent is coherent, not that their coherence tracks well-being.

  **The Denomination Problem: Measurement vs. Normativity**
  The discovery of a neural quantity $N$ that perfectly predicts choice solves the *measurement* problem but not the *normative* problem. Welfare economics requires interpersonal comparability to justify Kaldor-Hicks compensation tests (i.e., that gains to winners *outweigh* losses to losers). Even if $N$ is cardinal and comparable (1 unit of $N$ is the same for everyone), we face the "Denomination Problem."

  Why is $N$ welfare? $N$ could be arousal, salience, or action-readiness. An addict might maximize $N$ while destroying their life. To move from "agents maximize $N$" to "society should maximize $\sum N$," we require a normative premise: "Satisfaction of revealed preferences (or the neural correlate thereof) is *good*." This is not an economic finding; it is a philosophical commitment (often utilitarian). Without this axiom, $N$ is merely a physiological description of the choice mechanism. The RP tradition correctly identifies that choice reveals what an agent *values*, but it cannot establish that what an agent values is *valuable*. The gap between positive prediction and normative justification remains unbridged by neuroscience.

  **The As-If Agent: Realism and Counterfactuals**
  Regarding the "top-left" heuristic: if an agent satisfies GARP, a utility function $u$ exists mathematically (Afriat's Theorem). But is $u$ real? If the causal story is purely heuristic (top-left), $u$ is currently just curve-fitting. However, the distinction between "real" utility and "as-if" utility turns on counterfactual stability.

  If the utility function represents a stable underlying preference structure, it should predict choices in *new* environments (new goods, different budget shapes) where the "top-left" heuristic might fail or yield different results than preference maximization. If the agent switches heuristics when the menu changes, the utility attribution was fragile. For utility to do the work welfare economics needs, it must represent a stable disposition that persists across contexts, not just a fit to past data. If $u$ is merely a summary of past choices without causal power over future ones, it cannot support counterfactual policy analysis (e.g., "how would they react to this new tax?"). Therefore, the causal mechanism matters. If the mechanism is not sensitive to the trade-offs $u$ represents, $u$ is a fiction.

  **Conclusion**
  The Revealed Preference program succeeds in making choice theory empirically rigorous by stripping away psychological baggage. But in doing so, it strips away the very content welfare economics needs. Consistency (GARP) does not imply well-being. Neural correlates ($N$) do not imply value. And "as-if" models do not imply causal stability.

  To use utility for welfare, we must reintroduce the ethics RP excised. We must assert that satisfying these specific preferences is morally good. Economists often hide this premise behind the math of utility functions. The correct verdict is that utility is a formal tool for modeling consistency, not a moral currency. Welfare economics is not applied mathematics; it is applied moral philosophy using mathematical tools. To claim otherwise is to commit the naturalistic fallacy.

  ***

  # MARKING SCHEME (25 Marks Total)

  | Component | Marks | Required Content | Common Error / "B-Grade" Trap |
  | :--- | :---: | :--- | :--- |
  | **1. RP Constraints** | 5 | Explicitly states RP is falsifiable (cites GARP/WARP/money pumps). Rejects the "tautology" claim. | **Error:** Saying RP is vacuous/tautological. **Trap:** Spending too long defining WARP rather than explaining its falsifiability. |
  | **2. Ordinal vs. Welfare** | 5 | Distinguishes between ordinal ranking (consistency) and cardinal/interpersonal comparison (policy). | **Error:** Conflating ordinal utility with welfare. **Trap:** Claiming cardinality alone solves the welfare problem. |
  | **3. The Denomination Problem** | 5 | Argues that $N$ being real/cardinal doesn't make it *normative*. Identifies the need for an ethical axiom (Is-Ought gap). | **Error:** Assuming $N$ solves the problem because it's biological. **Trap:** Focusing on measurement difficulty rather than normative significance. |
  | **4. The As-If/Counterfactual** | 5 | Uses counterfactuals/new menus to distinguish real representation from curve-fitting. Causal mechanism matters for prediction. | **Error:** Saying "as-if doesn't matter per Friedman." **Trap:** Ignoring the stability requirement for policy analysis. |
  | **5. The Verdict (A-Grade Move)** | 5 | **Commits** to a position (Yes or No) and justifies it via the Is-Ought distinction. | **Error:** "There are two sides..." / "It depends." **Trap:** Hedging. The A student identifies the missing ethical premise. |

  **Differentiation (A vs. B):**
  *   **B Grade (15-19 marks):** Accurately explains RP, GARP, and the difference between ordinal/cardinal utility. Correctly notes that $N$ is descriptive. Hedges on the conclusion ("Economists use it this way, but philosophers say that...").
  *   **A Grade (20-25 marks):** Explicitly identifies that the gap is *ethical*, not technical. Recognizes that welfare economics implicitly imports a moral premise (preference satisfactionism) that RP theory itself cannot justify. Uses the counterfactual argument to show why "as-if" is insufficient for *policy* specifically.

  ***

  # JOURNALIST'S NOTE: FRAMING CHECK

  You asked me to flag which parts of your prompt are standard doctrine and which are your own coinage or contested. Here is the breakdown:

  **1. "Utility is just a representation... invariant up to transformation."**
  *   **Status:** **Bog-Standard Received Doctrine.** This is the core of the Samuelson/Houthakker Revealed Preference tradition taught in every grad micro sequence.
  *   **Nuance:** The tension you note (that economists *use* it as cardinal/interpersonal despite saying it isn't) is the standard critique made by philosophers of economics (e.g., Hausman, McPherson, Sen). You are on solid ground here.

  **2. The Denomination Problem (Neural $N$)**
  *   **Status:** **Your Coinage (mostly).** The specific framing ("Denomination Problem") is yours.
  *   **Philosophical Equivalent:** This is a modern re-skinning of the **Naturalistic Fallacy** (Hume/Moore) applied to **Neuroeconomics**. Standard doctrine (Robbins, 1932) says interpersonal comparisons are value judgments, not facts. Your twist—asking if a *biological* fact ($N$) changes that—is a sharp, contemporary way to ask the old question. It is not confused; it is a valid challenge to "neuro-welfarism."
  *   **Verdict:** Keep it. It forces the student to distinguish *prediction* from *value*.

  **3. The As-If Agent (Top-Left Heuristic)**
  *   **Status:** **Re-run of Instrumentalism vs. Realism.**
  *   **Philosophical Equivalent:** This is the **Friedman/Machlup** debate ("The Methodology of Positive Economics"). Friedman argued "as-if" is fine if it predicts. Realists (Machlup, later philosophers) argue you need causal depth for counterfactuals.
  *   **Critique:** Your specific example ("top-left of the menu") is excellent pedagogy, but philosophically, it's the standard **Underdetermination of Theory by Data** problem.
  *   **Is it confused?** No. But be aware that a savvy economist might reply: "If the heuristic *always* matches utility maximization, the distinction is metaphysical, not economic." Your question counters this by invoking *new* menus (counterfactuals), which is the correct philosophical move (Woodward's manipulationist account of causation).

  **Summary for your Column:**
  You are not printing a hobbyhorse. You are asking the central question of welfare economics: *Does consistency imply well-being?* The standard economic answer is "We act as if it does." The philosophical answer is "Only if you assume it does." Your "Denomination Problem" is a fresh, vivid way to expose that assumption. Go with it.
