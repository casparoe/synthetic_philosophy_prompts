  **The Check**

  This worry should **dampen** fanatical commitment to the far future. Standard longtermism assumes the probability of the future existing is independent of our current moral choices, relying only on technical survival; however, this scenario introduces **conditional ontology**, where the future's very instantiation depends on the simulated agents passing a moral evaluation. The structural feature driving this is **epistemic parity regarding moral valuation**: if the simulators are sufficiently similar to us to run ancestor simulations, they likely share our moral intuitions that neglecting present suffering is wrong, creating a feedback loop where ignoring the present to save the future actually prevents the future from existing. If you remove this feature—assuming the simulators are indifferent to our moral performance or that base reality exists regardless of the simulation's outcome—the conditional link breaks, and the standard expected-value calculation favoring far-future mitigation returns unchanged. A defender of far-future fanaticism would attack this by arguing that the prior probability of being in a *moral testing* simulation specifically is vanishingly small compared to the sheer magnitude of potential future lives, effectively dismissing the risk as a negligible uncertainty, or they might contend that ensuring the simulators' existence *is* the primary moral test, thereby reclaiming the x-risk investment as the optimal path to passing the evaluation.
