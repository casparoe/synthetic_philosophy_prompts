answer: |-
  **The Case: The Roster Glitch**

  You are standing in the athletics office checking the final list for the regional debate trip. You believe, "I am on the confirmed roster." You have two solid reasons. First, the Head Coach, who has never lied to you and is in charge of selections, looked you in the eye ten minutes ago and said, "Don't worry, you're on the list." Second, you are looking at the official sign-up spreadsheet projected on the office wall, and your name is clearly typed in Row 4. Both the Coach's testimony and the projected spreadsheet are the kinds of sources that normally guarantee knowledge in your school. In reality, you *are* on the confirmed roster. However, the Coach told you you were on the list because he *intended* to submit your name and mistakenly thought he already had; he hasn't actually filed the form yet. Your name is on the projected spreadsheet because the Secretary put it there as a "Pending" placeholder, which usually gets deleted if funding fails. The reason you are actually on the confirmed roster is that the Athletic Director just approved an emergency budget expansion that automatically converts all "Pending" names to "Confirmed," a decision made five minutes ago that neither the Coach nor the Secretary knows about yet.

  ***

  **Discussion Guide**

  **(1) The Belief, Truth, and Justification**
  *   **Belief:** "I am on the confirmed roster for the trip."
  *   **Truth:** The belief is true. You are going on the trip.
  *   **Justification:** You have strong, dual-source justification. Testimony from a reliable authority figure (the Coach) and visual confirmation from an official record (the Spreadsheet). In 99% of school scenarios, either one of these alone is sufficient for knowledge. You aren't guessing; you are relying on standard institutional protocols.

  **(2) The Two Lines of Evidence**
  *   **Line 1 (Testimony):** The Coach is a reliable source. His statement ("You're on the list") is technically true *at the moment he says it* (because the AD's approval just happened), but his *reason* for saying it is false (he thinks he filed the form; he hasn't). The line is socially intact (he is the authority) but epistemically disconnected from the truth-maker.
  *   **Line 2 (Document):** The Spreadsheet is an official record. Your name is physically there. However, its presence usually signifies "Coach submitted this," whereas here it signifies "Secretary typed this as a placeholder."
  *   **Where They Come Apart:** Both lines converge on the fact *that* you are on the list, but neither line tracks *why* you are on the list. The truth-maker (the AD's budget override) is a third social factor that bypasses both the Coach's action and the Spreadsheet's normal function. The "luck" is that these three independent administrative tracks (Coach's intent, Secretary's placeholder, AD's budget) aligned at the exact same moment.

  **(3) Testing the Patches**
  *   **No False Lemmas:** This patch says knowledge is JTB + no essential false assumptions.
      *   *Verdict:* **Handles the case.** To get from "Coach said so" to "I am on the list," you implicitly assume "The Coach knows he submitted the form." That lemma is false. To get from "Name on sheet" to "Confirmed," you assume "Names on the sheet are submitted." That lemma is false.
      *   *Critique:* It solves the problem, but it feels like a technicality. It forces us to dig into hidden assumptions the believer might not even be consciously aware of.
  *   **Safety Condition:** This patch says in nearby possible worlds where you form the belief the same way, it must still be true.
      *   *Verdict:* **Fails to handle the case (or gets the wrong verdict).** In most nearby worlds, the AD *doesn't* approve the emergency budget. In those worlds, the Coach still says "You're on the list" (mistakenly), the name is still on the sheet (placeholder), but you *aren't* going. So the belief is *unsafe*.
      *   *Nuance:* This actually gives the right verdict (you don't know), but it highlights that the case is *extremely* lucky. Some might argue the "same way" includes the AD's decision, which muddies the water.
  *   **Causal Theory:** This patch says the fact that makes the belief true must cause the belief.
      *   *Verdict:* **Handles the case perfectly.** The fact (AD's approval) did *not* cause your belief. Your belief was caused by the Coach's mistake and the Secretary's placeholder. The truth and the belief are causally disconnected.
      *   *Critique:* This is the strongest fit. It exposes that your justification is "downstream" from the wrong causes.

  **(4) The Active Ingredient**
  *   **The Feature:** **Institutional Decoupling.** The case works because the *status* of the evidence (Coach's authority, Sheet's officiality) is decoupled from the *mechanism* that makes the fact true (AD's override).
  *   **Collapse Test:**
      *   *Remove the AD's Override:* The belief becomes false (you aren't on the roster). It becomes a plain mistake, not Gettier.
      *   *Remove the Coach's Mistake (he actually filed the form):* You now have knowledge. The causal chain is restored.
      *   *Remove the Spreadsheet:* You rely only on the Coach. This becomes a standard "false lemma" case (trusting a mistaken expert). The "Two Lines" constraint is what makes it feel like robust justification that still fails.

  **(5) The Strongest Objection (The "Reliabilist" Reply)**
  *   **The Argument:** A Reliabilist might argue you *do* have knowledge. They would say: "You used two highly reliable processes (trusting the Coach, reading the Sheet). In the actual world, these processes yielded the truth. The fact that they *could* have failed in nearby worlds (Safety) or that the causal chain is weird (Causal) doesn't matter. You functioned as a competent epistemic agent in a system that worked."
  *   **Why it's tempting:** In real high school life, if the Coach says you're going and your name is on the wall, you *act* like you know. If you packed your bags and the bus left without you, you'd say the school *lied* to you, not that you were irrational. This objection challenges whether "Knowledge" is about metaphysical luck or just about responsible agency. If you did everything right, maybe you *do* know, and the universe is just weird.
