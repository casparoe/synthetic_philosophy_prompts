answer: |-
  # Workshop Plan: The Integrity Diagnostic
  **Session Title:** The Alienating Calculation: Using Williams's Integrity Objection to Audit Institutional Decision-Making
  **Duration:** 90 Minutes
  **Facilitator Stance:** Integrity is not a moral luxury or a shield for selfishness; it is a structural requirement for sustainable agency. When institutions force agents to view their core commitments as disposable variables in a utility calculus, they produce alienation, burnout, and brittle decision-making.

  ---

  ## I. The Conceptual Prerequisite (Minutes 0–15)
  **Goal:** Establish the definition of the "Self" required for the objection to land.
  **Stance:** You cannot understand the integrity objection if you view the decision-maker as a neutral vessel for processing outcomes.

  **The Setup:**
  Begin by rejecting the model of the policy analyst as a "neutral calculator." Tell the room: *"If you view yourself merely as a conduit through which the best overall outcome flows, you have already accepted a framework that makes integrity impossible."*

  **The Concept:**
  Introduce the idea of **Constitutive Commitments**.
  *   Explain that human agents are not blank slates. We are defined by "ground projects"—commitments so deep that giving them up feels like losing a part of the self.
  *   In a personal context, this is a relationship or a vocation.
  *   In an institutional context, this is a **mandate**. If you are the Head of Long-Term Infrastructure, your "ground project" is infrastructure. If you are the Director of Emergency Relief, yours is relief.
  *   **Crucial Point:** These commitments are not obstacles to rationality; they are the *source* of your agency. Without them, you are not an actor; you are a sensor.

  **Boundary Note:** Do not discuss *how* these commitments are chosen (moral luck) or whether they align with universal duties (Kant). Treat them as existing psychological facts that enable action.

  ---

  ## II. The Core Scenario (Minutes 15–45)
  **Goal:** Demonstrate the "one thought too many" in a bureaucratic setting.
  **Scenario:** **The Emergency Cannibalization Meeting.**

  **The Narrative:**
  You are the Director of a five-year "Youth Literacy" program. You have a locked budget for the fiscal year. A sudden, acute housing crisis hits your region. The CEO calls an emergency meeting. She proposes cannibalizing 40% of your Literacy budget to fund immediate Emergency Housing. She argues the utility calculus is clear: sheltering families now prevents more suffering than literacy programs do over five years. She asks you to *justify* why your program should remain funded despite the lower immediate utility.

  **The Structural Feature:**
  The request forces you to step outside your role to evaluate the worth of your own role from a "God's eye" view.

  **The Exercise:**
  Ask the analysts to draft the internal monologue of the Director in two versions:
  1.  **The Utilitarian Response:** The Director calculates the suffering prevented by housing vs. literacy, finds the housing argument stronger, but argues for keeping literacy based on long-term metrics.
  2.  **The Integrity Response:** The Director refuses to calculate the comparative value of their own mandate against the emergency.

  **The Reveal:**
  Explain that in Version 1, the Director has had **one thought too many**.
  *   **The Excess Thought:** *"Is my commitment to literacy justified when weighed against the general good?"*
  *   **Why it is excess:** By asking this, the Director has alienated themselves from their own job. They are no longer the *champion* of literacy; they have become a judge of literacy. An institution cannot function if every department head constantly re-evaluates whether their department deserves to exist based on global utility.
  *   **The Correct Response:** The Director should say, *"I am the Director of Literacy. My job is to argue for literacy. If the organization decides to shift priorities, that is a strategic decision, but I cannot make that calculation myself without ceasing to function as the Director of Literacy."*

  **Takeaway:** The "one thought too many" is not about time efficiency. It is about **structural alienation**. It is the moment you treat your own agency as an external object to be weighed.

  ---

  ## III. Intercepting Misconceptions (Minutes 45–60)
  **Goal:** Prevent the analysts from dismissing the objection as selfishness or irrationality.
  **Method:** Direct intervention at three specific friction points.

  **Misconception 1: "This is just selfishness/territorialism."**
  *   **Likely Reaction:** Analysts will argue the Director is just protecting their budget or ego.
  *   **Interception Point:** Immediately after the Scenario Reveal.
  *   **Correction:** Clarify that the commitment need not be self-serving. If the Director were sacrificing their own salary to keep the Literacy program open, the objection still holds. Integrity is about identification with the *project*, not the *benefit*. If you force an altruist to calculate whether their altruism is "efficient enough," you demoralize the altruist.

  **Misconception 2: "This means we never do cost-benefit analysis."**
  *   **Likely Reaction:** Analysts will worry this framework bans trade-offs.
  *   **Interception Point:** During the Q&A on the Scenario.
  *   **Correction:** Distinguish between *strategic trade-offs* (made by leadership looking at the whole) and *deliberative alienation* (made by the agent regarding their own action). The CEO can make the trade-off. The Director cannot be asked to *validate* the trade-off against their own core mandate as part of their decision process. The calculation happens *to* the agent, not *by* the agent regarding their own identity.

  **Misconception 3: "This is just 'following the job description'."**
  *   **Likely Reaction:** Analysts will reduce integrity to bureaucratic compliance.
  *   **Interception Point:** Near the end of this section.
  *   **Correction:** Job descriptions are external rules. Integrity is internal identification. You can follow a job description while resenting it or viewing it instrumentally. Williams's point is that if you view your role instrumentally, you are already detached. The institution needs you to *be* the role, not just *perform* it.

  ---

  ## IV. Application and Diagnostic (Minutes 60–90)
  **Goal:** Move from theory to diagnostic utility.
  **Stance:** Use this objection to spot "ethical friction" in policy design before implementation.

  **The Diagnostic Tool:**
  Teach them to look for **Procedural Alienation** in policy drafts.
  *   Does this policy require the implementer to violate a constitutive commitment to execute it?
  *   Does this decision matrix force the agent to view their own professional duty as a variable?

  **Group Exercise:**
  Present a brief policy snippet: *"All caseworkers must evaluate their own caseloads monthly to determine if their time would yield higher social value in a different department."*
  *   Ask the room to identify the "one thought too many."
  *   **Answer:** The caseworker is forced to view their relationship with their current clients as disposable. They must calculate the value of their own care. This creates hesitation and detachment, reducing the quality of care.

  **The Final Diagnostic Question:**
  To test if they have grasped the structure rather than the slogan, ask this specific question:

  > *"In the scenario we discussed, if the Director of Literacy agrees to the budget cut because 'the suffering of the homeless is greater,' have they acted morally? According to Williams's framework, what specifically has been lost in that agreement, regardless of the outcome?"*

  **Correct Grading Criteria:**
  *   **Fail:** Answers focusing on the outcome (e.g., "Literacy suffers") or the person (e.g., "The Director loses their job").
  *   **Pass:** Answers focusing on the **structure of agency**. The correct answer must identify that the Director has ceased to act as an *agent of literacy* and has become a *neutral calculator*. The loss is the **identification between the actor and the action**. The decision no longer flows from who they *are*, but from a calculation external to them. They have become a channel, not a source.

  ---

  ## V. Exclusions and Boundaries
  **Explicitly Exclude:**
  1.  **Moral Luck:** Do not discuss whether the Director is lucky to have the Literacy job. That complicates the agency point.
  2.  **Systematic Ethical Theory:** Do not contrast Utilitarianism vs. Deontology systematically. We are using Williams as a diagnostic tool, not choosing a team.
  3.  **Private vs. Public:** Do not get bogged down in whether private integrity applies to public office. Assume for this workshop that professional mandates *are* the public version of ground projects.

  **Closing Statement:**
  End with this definitive claim: *"Institutional ethics fails when it demands that agents detach themselves from the very commitments that make them effective. Use the 'one thought too many' not to stop calculation, but to locate where calculation becomes alienation. That is where your policies will break."*
