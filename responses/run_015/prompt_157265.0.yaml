  ### Decomposition

  Here are my credences for the five specific terms you requested, followed by the arithmetic used to derive the headline number.

  **(1) Uniform Variably Strict Semantics:** **0.40**
  *Credence that a single rule covers both moods without residue.*
  While unified accounts (e.g., von Fintel & Iatridou 2002, Starr 2014) are elegant, the "residue" is substantial. Indicatives and counterfactuals exhibit distinct behaviors regarding antecedent strengthening, import-export, and interaction with epistemic modals. A single rule requires enough parameters and contextual manipulation that it effectively functions as two rules in disguise.

  **(2) Bridge Principle Analogue:** **0.30**
  *Credence that Adams' Thesis has a genuine analogue for counterfactuals.*
  The identification of conditional probability with indicative assertability is robust (with known caveats). For counterfactuals, this breaks down (e.g., in cases of known falsity or imaging vs. conditionalizing). The failure of the bridge principle for counterfactuals suggests a distinct semantic mechanism for processing the antecedent.

  **(3) Detective Diagnostic:** **0.25**
  *Credence that the experiment would yield a clean verdict.*
  Experimental pragmatics rarely yields "clean" discontinuities. Felicity judgments are typically gradient, influenced by prosody, speaker authority, and task demands. A sharp semantic discontinuity is theoretically possible but empirically elusive; the data will almost certainly be contaminated by the independent factors you listed (reluctance to assert settled matters, etc.).

  **(4) Oswald Cases:** **0.35**
  *Credence that known-false indicatives are a semantic phenomenon.*
  The "Oswald" conditional is best explained as a pragmatic accommodation where the speaker temporarily adopts the hearer's epistemic state or signals a commitment to the conditional relationship independent of the antecedent's truth. It does not prove the indicative semantics allows false antecedents by default; it proves the context can shift.

  **(5) Boundary Sharpness:** **0.50**
