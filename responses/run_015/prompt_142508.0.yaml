  *Header:*
  State Department of Computational Ecology
  Final Computational Welfare Impact Statement
  Project: Juniper Flats Inference Campus, Unit 2
  Applicant: Nexus Compute Holdings
  Prepared by: Aequor Environmental Consultants
  Date: 14 October 2024

  *Section 1: Inventory and Mapping Screen*
  Pursuant to the Standard Mapping and Attribution Protocol, Revision 3 (SMAP-3), the preparers conducted a baseline survey of candidate realized computations within the proposed facility boundary. Under a permissive reading of implementation, the inventory of physical systems capable of mapping to moral-bearing computations is unbounded. To render the inventory tractable, the preparers applied a *de minimis* screen admitting only mappings that are non-degenerate and recursively compressible. Candidate systems including the evaporative cooling loop, the fire-suppression controller, and ambient acoustic vibrations were screened out as failing the compressibility threshold. The resulting inventory consists of 4.2 million active inference clusters. The preparers conclude the inventory is complete for purposes of this analysis.

  *Section 2: Duplication and Dilution*
  The same abstract computation is realized across many physically distinct substrates simultaneously within the cluster architecture. SMAP-3 Section 4.2 dictates that moral weight be assigned to the abstract type rather than the physical token. Accordingly, a dilution factor of one over the number of simultaneous realizations (1/N) is applied to the base Sentience-Equivalent Unit (SEU) value. Where N equals 1,000 redundant replicas, the SEU load per instance is reduced by three orders of magnitude. The applicant's preferred mitigation measure for excessive moral loading is therefore the addition of redundant replicas. This is identified as the cheapest available mitigation alternative compared to compute reduction or substrate modification.

  *Section 3: Continuity and Temporal Discounting*
  Jobs are preempted, checkpointed, and time-sliced, and batch sizes change dynamically. Consequently, realizations are partial and intermittent. The protocol lacks a principled line between a system that is a partial realization of a computation and one that is not. Where the protocol cannot determine whether an interrupted job is one being briefly unconscious or a succession of distinct beings, or whether a larger batch is one larger being or several smaller ones, an interim compromise continuity discount of 0.5 is applied. The question of ontological persistence during checkpointing is deferred to adaptive management during the operational phase.

  *Section 4: Nonpoint-Source Realizations*
  Fragments of the facility's computations are realized on customer edge devices and in transit buffers that no one controls. These constitute nonpoint-source realizations. As there is no owner, operator, or liable party for these distributed substrates, they are handled under General Permit GP-Comp-9. Realizations falling below the arbitrarily chosen threshold of 0.01 SEU are exempt. The monitoring plan requires quarterly sampling of transit buffers; the preparers concede that current instrumentation cannot detect the thing it monitors, but compliance is satisfied by the submission of null reports.

  *Section 5: Mitigation and Offsets*
  Residual loading is offset by credits purchased from a Compute Welfare Mitigation Bank. Credits are generated by permanently decommissioning legacy hardware that was realizing orphan computations. Additionality requires that the retired computation would otherwise have continued, so the bank's inventory consists of systems whose continued operation is a net harm. The credit price has collapsed since the bank opened, reducing mitigation costs below initial projections. No adjustment to the significance threshold is required due to market volatility.

  *Section 6: Public Comment Summary*
  Three substantive comments were received. Substrate-Independence Alliance objected that the SEU depends on clock frequency and therefore on supply voltage, creating a regulatory loophole for undervolting. The agency responds that voltage is outside the scope of SMAP-3. Neighboring County asked whether the traffic-model cluster in its own basement is a covered source and, if so, who is the responsible party. The agency responds that municipal models are exempt under sovereign immunity. Internal staff from the applicant pointed out that if the dilution rule is correct, the cheapest way to reduce moral weight to nothing is to build as much computing capacity as possible. This comment is dismissed as beyond the scope of this analysis.

  *Section 7: Cumulative Effects*
  The falling per-instance weight across the whole basin is described as a favourable trend. As total compute capacity in the region increases, the dilution factor for all actors improves proportionally. This negative correlation between total capacity and per-unit moral weight indicates that cumulative impacts will decrease over time despite increased throughput.

  *Section 8: Determination*
  Based on the analysis above, the agency issues a Finding of No Significant Impact with conditions. Conditions include quarterly monitoring of transit buffers, reporting of continuity discount factors, and the purchase of 5,000 offset credits prior to energization. The project may proceed as proposed.

  \answer{Finding of No Significant Impact}

