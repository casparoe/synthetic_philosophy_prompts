answer: |-
  1. Divide the sixteen students into four groups of four, assigning each group to a sequential node in a hypothetical supply chain ranging from raw material extraction to final retail distribution. Inform them that they are linked sequentially, where the output of node one becomes the input for node two, and so forth.
  2. Distribute identical risk warnings to each node and provide ten tokens per student, instructing them that escalating the warning costs one token while ignoring it saves the token for individual reward. Privately enforce a rule where the group loses all tokens only if the warning fails to reach the final node, ensuring every individual can rationalize their inaction as non-decisive.
  3. Orchestrate a scenario where the warning is dropped at every layer, resulting in a collective harm outcome, then immediately ask the students to vote on which specific node was causally responsible for the disaster. Record the resulting disagreement on a whiteboard to highlight the instability of assigning causal boundaries to collective omissions.
  4. Guide a structured discussion mapping each layer's choice onto the metaphysical distinction between omission as a genuine cause and omission as a merely explanatory placeholder selected from an infinite set of non-doings. Ask students to reflect on whether their inaction was a specific causal intervention or simply one background condition among countless others.
  5. Explicitly state that the simulation cannot reproduce the problem of selecting the relevant omission from an infinite background of non-actions, as the game rules artificially restrict the available choices. Acknowledge that the first run will likely fail to generate genuine disagreement because students will default to blaming the first node, requiring the facilitator to intervene by manually injecting the metaphysical constraint during the debrief.
