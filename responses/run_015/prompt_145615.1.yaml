answer: |-
  1. Objective and setup
  The objective is to embody the tension between ex ante planning and ex post action by arranging seven pairs of students along a corridor of opaque screens, each representing a hidden decision node. Partners stand facing one another across a central divide so they can observe their counterpart's position but cannot see the signage marking their own current location.

  2. Rules and payoffs
  Each pair receives a deck of state cards dictating movement forward or exit, wherein collecting motorway tokens yields higher cumulative value only if both partners exit simultaneously at the third node. However, individual payoff tokens are awarded immediately upon exit, creating a structural incentive to defect from the agreed plan if a student believes they have reached the final node.

  3. Execution timeline
  The first fifteen minutes are allocated to briefing and positioning, followed by forty minutes of iterative gameplay where pairs attempt to coordinate exits without direct self-location. The final twenty minutes are reserved for collecting token scores and preparing the group for the conceptual debrief.

  4. Debrief and conceptual mapping
  Discussion must connect the frustration of failed coordination to the distinction between ex ante rationality and the ex post temptation to deviate when self-locating belief becomes uncertain. You will highlight how the observation rule mimics the driver's inability to distinguish intersections, forcing students to rely on credences rather than knowledge.

  5. Honest limitations
  Expect the first run to misfire due to confusion regarding the asymmetrical observation rule, requiring the instructor to clarify why partners see each other but not themselves. Honestly, this exercise cannot reproduce the continuous temporal unfolding of belief revision within a single mind, which must be added in discussion to fully capture the absent-mindedness condition.
