  Here is the committed audit of your package.

  ### 1. Rank the Tensions by Severity

  **Severity 1 (Fatal Contradiction): Commitment (2) vs. Commitment (5)**
  *   **The Clash:** You claim street names are *merely* navigational and renaming them is "pointless bureaucracy" (2), yet you propose a mandatory 150-year sunset clause that forces a bureaucratic review and potential renaming of those exact streets (5).
  *   **Why it breaks:** You cannot logically assert that street names lack honorific weight while subjecting them to a policy designed to police honorific weight. If (5) is necessary, (2) is false. If (2) is true, (5) is unnecessary overreach on streets.

  **Severity 2 (Philosophical Vulnerability): Commitment (1)/(3) vs. Commitment (4)**
  *   **The Clash:** You argue statues are honorific endorsements that must meet a contractualist standard (1 & 3), implying they should be removed if they fail. But you also claim symbolic harm is "weightless in policy" (4).
  *   **Why it breaks:** In public memory theory, the *only* reason an honorific statue matters is the symbolic message it sends. If symbolic impact is weightless (4), the honorific nature (1) loses its policy teeth. Your audience will ask: "If symbols don't matter, why does the endorsement matter?"

  **Severity 3 (Minor Friction): Commitment (3) vs. Commitment (6)**
  *   **The Clash:** Contractualist endorsement (3) implies public space must be simplified for consensus, while museums hold complexity (6).
  *   **Why it holds:** This is actually a strong distinction (Civic Virtue vs. Historical Record), provided you clearly delineate the boundaries. It is not a contradiction, but it requires careful boundary work.

  ---

  ### 2. Exactly Which Commitment to Drop

  **Drop Commitment (2).**

  **Reasoning:** Commitment (2) is the weak link. Empirically and theoretically, street names *are* honorific. Naming a boulevard "Martin Luther King Jr." or "Robert E. Lee" is not a neutral navigational act; it is a claim about who belongs in the civic pantheon. By keeping (2), you undermine your own Contractualist Rule (3). If a reasonable pluralistic citizenry cannot jointly endorse a figure, that figure should not be on a street sign any more than on a statue. Dropping (2) aligns your theory: **All named public infrastructure is honorific and subject to the sunset clause.**

  ---

