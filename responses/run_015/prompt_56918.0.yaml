prompt: |-
  I'm the person who ended up with the made-up title of "narrative standards reviewer" at a mid-size game studio — basically I read every mission script, trailer line, and achievement description for our war games and flag stuff before it goes up to the creative director, who has final say. We're about a year out from shipping a realistic-ish contemporary-war single-player campaign, and I get maybe six to eight mission beats a month across my desk plus marketing copy, with roughly 45 minutes per beat. The people writing these are good writers with zero philosophy background, and they hate being told "it's complicated," so whatever I hand them has to be runnable: a list of questions in a fixed order, what counts as a passing answer to each, the points where the thing just gets a no, and the points where it has to kick upstairs to the creative director because it's a values call and not something a checklist can settle.

  The reason I need this is that the studio has an official house principle we've been operating under, which I'll call the Symmetry Default: unless a beat explicitly earns an exception, combatants on both sides get presented as equally entitled to be fighting and equally worth mourning, and the game never invites the player to condemn an individual enemy soldier on account of whose war he's serving in. It was a deliberate choice. We got hammered a few years back by an academic who said our "everyone's just a soldier doing his job" framing effectively laundered an invasion, and then last year by a veterans group who said the mission that lingered on one enemy conscript's life treated our own guys as objects with no interiority, and I still cant articulate why both complaints are aimed at the same underlying argument. The philosophy underneath it, as best I understand: there's the older view that soldiers on either side of a war stand in the same moral position, that a man fighting for an unjust cause isn't a criminal because he's acting as the instrument of a state inside a set of conventions everyone benefits from, and that this equality is what makes the rules of war workable at all — you can't get an army to accept limits on how it fights while simultaneously telling its soldiers they're murderers for showing up. And then there's the revisionist line that liability to be killed tracks whether the threat you pose is itself justified, so a soldier fighting a war of aggression doesn't really have a moral right to kill the people defending themselves, and the symmetry is a legal and practical fiction rather than the truth, its a thing we agree to pretend, not a thing that's so. I don't need the procedure to referee that argument or point me at anybody to read. I need it to be honest about which side of the argument our Symmetry Default is quietly smuggling in, and to tell a writer when a beat can keep leaning on the default and when the default is going to produce something false or ugly.

  So: write me the procedure. Questions in a fixed order, each with a short note on what a good answer looks like and what a non-answer looks like, the places where it stops at cut-or-rewrite, and the places where it hands the decision to a human because it's judgment wearing a checklist costume — mark those explicitly rather than burying them. Then run it on three things that are actually sitting on my desk right now. One: a mission where the player's side is clearly the invader and the setpiece is a night raid on a checkpoint held by very young conscripts, shown joking around and reading letters home, with no dialogue indicating they know their country started it. Two: a mission where the enemy commander the player finally kills has been established across four hours of play as personally responsible for massacres, including against his own people. Three: a trailer line, something like "no heroes, no villains, only survivors," laid over a montage that cuts between both armies. At least one of those should come out in a way I'm not going to like — I'd rather the procedure bite on our signature beat than flatter us. And finish with what the procedure flat out can't do: the cases where two honest writers will run it and land in different places, the beats it will misjudge, and the spots where it's really just encoding my taste and calling it method.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Narrative Standards Reviewer at a mid-size game studio.
      *   **Task:** Create a procedural checklist/guide for reviewing narrative beats in a war game based on the "Symmetry Default" house principle.
      *   **Context:** The studio faces criticism from both sides (academics saying symmetry launders invasion; veterans saying symmetry dehumanizes their own side). The user understands the philosophical tension (Traditional Just War Theory vs. Revisionist Just War Theory) but needs a *practical tool*, not a philosophy lecture.
      *   **Requirements:**
          *   Fixed order questions.
          *   Criteria for passing/failing answers.
          *   Clear "Cut/Rewrite" triggers.
          *   Clear "Escalate to Creative Director" triggers (values calls).
          *   Honesty about which philosophical side the Default smuggles in.
          *   Apply the procedure to three specific examples (Checkpoint Raid, War Criminal Commander, Trailer Line).
          *   At least one example must fail/challenge the studio's preference.
          *   Conclusion on limitations (where the procedure fails/encodes taste).
      *   **Tone:** Professional, pragmatic, slightly weary but rigorous, respectful of the writer's time (45 mins/beat), aware of the political minefield.

  2.  **Deconstruct the "Symmetry Default":**
      *   *Core Tenet:* Combatants are morally equal *qua* combatants. Killing is a function of role, not individual guilt.
      *   *Philosophical Anchor:* Michael Walzer's *Just and Unjust Wars* (The Moral Equality of Combatants).
      *   *The Tension:* Revisionists (like Jeff McMahan) argue liability depends on the justice of the cause.
      *   *The Studio's Position:* They want to stick to Walzerian Symmetry for gameplay cohesion and to avoid "preachy" politics, but they need to avoid the pitfalls (laundering aggression or erasing friendly humanity).
      *   *The "Lie":* The Default *is* smuggling in the Traditionalist view (Walzer). It asserts symmetry is the moral truth for the sake of the game, even if reality is messier. The procedure needs to admit this.

  3.  **Drafting the Procedure (The "Symmetry Stress Test"):**
      *   *Goal:* actionable, binary where possible, escalatory where necessary.
      *   *Structure:*
          1.  Context Check (Who is fighting whom?)
          2.  Individualization Check (Are enemies people?)
          3.  Agency/Coercion Check (Why are they fighting?)
          4.  Consequence Check (What does the player feel?)
          5.  The "Values Call" (Where does symmetry break?)
      *   *Constraints:* Needs to fit the 45-minute review window. Needs to be "runnable."

      *   *Drafting Questions:*
          *   Q1: Is the conflict status clear? (Invader vs. Defender).
          *   Q2: Does the beat attribute *personal* evil to the grunt? (Pass = No).
          *   Q3: Does the beat erase the *humanity* of the grunt? (Pass = No).
          *   Q4: Does the beat ask the player to judge the *cause* through the *grunt*? (This is the tricky one).
          *   Q5: Is there a specific atrocity linked to a specific individual? (Escalation point).

      *   *Refining the "Honesty" Clause:* The procedure must state upfront: "This tool assumes the Traditionalist view (Walzer). It treats the uniform as the moral boundary. If the script requires the uniform to *not* be the boundary, this tool will flag it for escalation."

  4.  **Applying the Procedure to the Three Examples:**

      *   *Example 1: Night Raid on Conscripts (Invader Player).*
          *   *Scenario:* Player is aggressor. Enemies are young, joking, reading letters. No knowledge of war guilt.
          *   *Application:* Symmetry Default says "They are soldiers, you are soldiers." But the Player is the *Invader*.
          *   *Tension:* If we treat them as equals, do we launder the invasion? If we highlight their innocence, do we make the player feel like a murderer (breaking the "job" frame)?
          *   *Verdict:* This is the one that should "bite." The Symmetry Default fails here because the *structural* asymmetry (Invader vs. Defender) overwhelms the *individual* symmetry. The procedure should flag this as a "Values Call" or "Rewrite" because it risks making the player complicit in aggression without narrative cover. *Decision:* Flag for Escalation/Rewrite. It exposes the "lie" of symmetry too starkly.

      *   *Example 2: The War Criminal Commander.*
          *   *Scenario:* Enemy boss, established massacres, killing his own people.
          *   *Application:* Symmetry Default applies to *combatants*. A war criminal targeting civilians/own people steps outside the "conventions everyone benefits from."
          *   *Verdict:* Passes the "grunt symmetry" check because he is no longer acting as a legitimate instrument of the state. He is a criminal. The Default allows condemning him. *Decision:* Pass (with note on specificity).

      *   *Example 3: Trailer Line ("No heroes, no villains...").*
          *   *Scenario:* Marketing copy, montage of both armies.
          *   *Application:* This is the purest expression of the Default.
          *   *Verdict:* Pass. It's marketing, it sets the expectation. It doesn't need to hold up to the granular moral scrutiny of a mission beat. *Decision:* Pass.

  5.  **Drafting the Limitations (The "Meta" Analysis):**
      *   Where does this fail?
      *   When "humanity" becomes "propaganda."
      *   When the "job" frame ignores power dynamics.
      *   When my taste (the Reviewer's) dictates what counts as "sufficient humanity."
      *   The procedure can't solve the "Aggressor" problem fully.

  6.  **Refining the Tone:**
      *   Avoid academic jargon (no "Walzer" or "McMahan" in the actual checklist, keep it in the intro/outro).
      *   Use studio speak ("beats," "kick upstairs," "redlines").
      *   Acknowledge the user's burden (45 mins/beat).

  7.  **Review against Constraints:**
      *   Fixed order questions? Yes.
      *   Pass/Fail criteria? Yes.
      *   Escalation points marked? Yes.
      *   Honest about the philosophy? Yes.
      *   Three examples run? Yes.
      *   One example bites? Yes (The Conscript Raid).
      *   Limitations section? Yes.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the distinction between "Combatant Symmetry" and "Cause Symmetry" is clear. The Default protects the *combatant*, not necessarily the *cause*. The Conscript Raid fails because it highlights the *Cause* asymmetry through the *Combatant* humanity.
      *   *Correction:* Ensure the "Escalation" points are clearly visually distinct.
      *   *Correction:* Keep the intro brief. The user knows the philosophy; they need the tool. But the tool needs to state its bias.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **DOCUMENT: NARRATIVE STANDARDS REVIEW — PROCEDURE 4.2 (SYMMETRY DEFAULT)**
  **TO:** Writing Team, Marketing, Design Leads
  **FROM:** Narrative Standards
  **SUBJECT:** Combatant Morality & The Symmetry Default

  ### PREAMBLE: WHAT THIS TOOL IS (AND ISN'T)
  This procedure operationalizes the studio's **Symmetry Default**. It is not a philosophical referee. It does not determine if a war is just. It determines if a specific narrative beat treats combatants in a way that is consistent with our house principle: *Soldiers are morally equal instruments of their states, regardless of the state's cause.*

  **The Honest Admission:** This procedure assumes the **Traditionalist** view of war (Michael Walzer's framework). It operates on the fiction that putting on a uniform places you in a moral category distinct from civilians and distinct from the political guilt of your leaders. It explicitly rejects the **Revisionist** view (that liability to be killed depends on the justice of your cause) for the sake of gameplay cohesion.

  If a beat requires the player to believe that an enemy soldier is *inherently* more guilty than the player character simply because of which flag they salute, this procedure will flag it. If a beat requires the player to believe that the enemy soldier is *not a person* because they are an enemy, this procedure will flag it.

  **Time Budget:** 45 Minutes per beat.
  **Authority:** Pass, Rewrite, or Escalate to Creative Director (CD).

  ---

  ### THE PROCEDURE: SYMMETRY STRESS TEST (SST)

  **INSTRUCTION:** Answer the following five questions in order. If you answer "NO" to any Pass Criteria, stop. Follow the associated action.

  #### Q1: THE UNIFORM CHECK
  **Question:** Does the script distinguish between the enemy combatant's *role* and their *personal character*?
  *   **Pass Criteria:** The enemy is hostile because they are wearing the uniform and following orders, not because they are depicted as inherently sadistic, evil, or sub-human *prior* to engagement.
  *   **Fail Criteria:** Enemy grunts are shown enjoying killing for pleasure, using slurs unrelated to military objective, or are dehumanized (treated as insects/objects) by the player character's internal monologue.
  *   **Action on Fail:** **REWRITE.** This violates the "Instrument of State" clause.
  *   **Action on Pass:** Proceed to Q2.

  #### Q2: THE INTERIORITY CHECK
  **Question:** Does the beat grant the enemy combatant a glimpse of interiority (fear, hope, boredom, love) that mirrors the player's side?
  *   **Pass Criteria:** Yes. We see/hear evidence that they have lives outside the fight (letters, photos, conversations about home, fear of death).
  *   **Fail Criteria:** No. The enemy exists solely to shoot and die. They have no dialogue or animation that suggests a life beyond the battlefield.
  *   **Action on Fail:** **REWRITE.** This violates the "Equally Worth Mourning" clause.
  *   **Action on Pass:** Proceed to Q3.

  #### Q3: THE AGENCY/COERCION CHECK
  **Question:** Is the enemy combatant's presence in the fight presented as a function of their obligation to the state, rather than explicit ideological fanaticism?
  *   **Pass Criteria:** They are fighting because they are soldiers. They may believe in the cause, but their *liability to be killed* is based on their status as a threat, not their belief system.
  *   **Fail Criteria:** They are depicted as zealots who cannot be reasoned with, or conversely, as completely unknowing victims who believe they are on a peacekeeping mission when they are clearly invading.
  *   **Action on Fail:** **ESCALATE TO CD.** This is a Values Call. (See *Note A* below).
  *   **Action on Pass:** Proceed to Q4.

  #### Q4: THE ASYMMETRY SPIKE CHECK
  **Question:** Does this beat highlight a structural moral asymmetry (e.g., Invader vs. Defender) that makes the Symmetry Default feel like a lie?
  *   **Pass Criteria:** No. The immediate tactical situation feels reciprocal (both sides trying to kill the other to secure an objective).
  *   **Fail Criteria:** Yes. The context makes it impossible to ignore that one side is committing aggression and the other is defending, and the script asks the player to feel "we are the same" in a way that feels dishonest.
  *   **Action on Fail:** **ESCALATE TO CD.** This is a Values Call. (See *Note B* below).
  *   **Action on Pass:** Proceed to Q5.

  #### Q5: THE CONDEMNATION CHECK
  **Question:** Does the narrative ask the player to condemn a specific enemy *individual* for the sins of their *nation*?
  *   **Pass Criteria:** No. Condemnation is reserved for specific war crimes (violating the conventions of war), not for fighting on the "wrong" side.
  *   **Fail Criteria:** Yes. A character says, "You're all murderers for invading," directed at a grunt doing a job.
  *   **Action on Fail:** **REWRITE.** Keep the judgment on the leadership or specific criminals, not the infantry.
  *   **Action on Pass:** **PASS.**

  ---

  ### ESCALATION NOTES (FOR REVIEWER USE)

  **Note A (Ideology vs. Obligation):** If the enemy is too fanatical, they become villains (breaks Symmetry). If they are too ignorant, they become victims (makes the player a butcher). The middle ground is "Professional Soldier." If the script slips too far either way, the CD must decide if we want to lean into the tragedy or the threat.

  **Note B (The Aggressor Problem):** The Symmetry Default works best when the war's origin is murky. If the script makes it undeniable that *our* side is the aggressor, treating the defenders as "equally entitled to fight" may read as political laundering. This is not a writing error; it is a thematic risk. The CD must sign off on the political exposure.

  ---

  ### APPLICATION: CURRENT DESK QUEUE

  Here is the SST applied to the three beats currently in review.

  #### BEAT 1: NIGHT RAID ON CHECKPOINT (Mission 4)
  *   **Context:** Player faction is the Invader. Enemies are young conscripts, joking, reading letters. No dialogue indicates they know their country started it.
  *   **Q1 (Uniform):** **PASS.** They are soldiers doing a job.
  *   **Q2 (Interiority):** **PASS.** Letters home/joking establishes humanity.
  *   **Q3 (Agency):** **PASS.** They are conscripts (obligation).
  *   **Q4 (Asymmetry Spike):** **FAIL.**
      *   *Reasoning:* The player knows they are the Invader. The enemies are defenders of their own soil, depicted as innocent boys. The Symmetry Default ("we are both just soldiers") collapses here because the moral weight of *defense* vs. *aggression* is too heavy to carry on the "uniforms make us equal" fiction. It makes the player feel like a criminal, which violates the commercial promise, OR it requires the player to ignore the invasion status, which violates reality.
  *   **Q5 (Condemnation):** N/A (Stopped at Q4).
  *   **VERDICT:** **ESCALATE TO CD.**
      *   *Reviewer Note:* This is the beat that bites. The Symmetry Default cannot support a mission where the player is the clear aggressor killing clear defenders without generating cognitive dissonance. The CD needs to decide: Do we obscure the invasion status (rewrite context)? Do we lean into the guilt (change marketing)? Or do we cut the humanity of the conscripts to make them feel more like threats (rewrite tone)? This procedure cannot solve the "Invader's Guilt" problem.

  #### BEAT 2: ENEMY COMMANDER TAKEDOWN (Mission 12 Climax)
  *   **Context:** Enemy Commander established over 4 hours as responsible for massacres, including against his own populace. Player kills him.
  *   **Q1 (Uniform):** **PASS.** He is a combatant, but...
  *   **Q2 (Interiority):** **N/A.** (Commanders are judged differently than grunts).
  *   **Q3 (Agency):** **PASS.** He is acting with high agency.
  *   **Q4 (Asymmetry Spike):** **PASS.** He is a specific target, not a representative grunt.
  *   **Q5 (Condemnation):** **PASS.**
      *   *Reasoning:* The Symmetry Default protects *combatants* acting within the conventions of war. By committing massacres against civilians/own people, this Commander has forfeited the protection of the "soldier's equality." He is no longer an instrument of the state; he is a criminal. Condemning him does not break the symmetry of the infantry.
  *   **VERDICT:** **PASS.**
      *   *Reviewer Note:* Ensure the dialogue focuses on his *crimes* (massacres), not his *nationality*. As long as we kill him for what he *did*, not who he *is*, the Default holds.

  #### BEAT 3: TRAILER LINE ("No heroes, no villains...")
  *   **Context:** Marketing copy over montage of both armies.
  *   **Q1-Q5:** **EXEMPT.**
      *   *Reasoning:* Marketing copy sets the thematic frame; it is not a narrative beat subject to ludonarrative consistency checks. However, it must align with the SST spirit.
  *   **VERDICT:** **PASS.**
      *   *Reviewer Note:* This is the purest expression of the Default. It is honest about the product. It does not require escalation unless the game itself (see Beat 1) contradicts it so sharply that it becomes false advertising.

  ---

  ### LIMITATIONS: WHERE THIS PROCEDURE BREAKS

  I am required to tell you where this checklist is lying to you. There are three failure states inherent to this method:

  **1. The "Humanity" Subjectivity Trap**
  Q2 (Interiority) relies on my judgment of what counts as "human." If I flag a beat because the enemies don't talk about their moms, but you think showing them sharing a cigarette is enough, we have no objective metric. I am encoding my taste for "melancholy soldier" tropes as a moral requirement. A writer can pass this check by pasting in clichés (photos of girlfriends) that feel cheap, technically passing the review while failing the emotional truth.

  **2. The Aggressor Blind Spot**
  As seen in Beat 1, this procedure assumes the war's origin is irrelevant to the soldier's moral status. In the real world (and increasingly in player expectation), *which side started the war matters.* This procedure treats that as a "Values Call" to kick upstairs, but in reality, it's a structural flaw. If the game is about an invasion, the Symmetry Default is a lie. This checklist cannot fix a lie; it can only flag it. If the CD says "run it anyway," this checklist will validate a narrative dissonance that players will feel even if they can't articulate it.

  **3. The "Just Following Orders" Ceiling**
  This procedure protects the grunt who commits no war crimes. It cannot protect the grunt who follows an illegal order that isn't explicitly depicted as a massacre. If the script implies our side is doing something shady, but the enemy grunt is just defending against it, the Symmetry Default forces us to treat them as equals. This procedure will Pass that beat. But it may leave a bad taste. It prioritizes the *convention* of war (soldiers fight soldiers) over the *justice* of war (defenders are right). That is a choice I am making for you.

  **Final Note:**
  This tool keeps us consistent. It does not keep us right. If the Symmetry Default is the wrong lens for this specific story, no amount of checklist-ticking will fix it. Beat 1 is the canary in the coal mine. If we can't solve that without cutting the humanity or cutting the context, the Default is the problem, not the script.
