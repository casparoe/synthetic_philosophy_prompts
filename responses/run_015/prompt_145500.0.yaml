      *Revised Example:* **Bednets vs. Judicial Reform** is stronger than Free Press because "lives saved" vs "rule of law" feels more distinctly incommensurable than "lives saved" vs "lives saved via democracy". Let's stick with **Bednets (Direct Welfare) vs. Constitutional Reform (Institutional Structure).**

      *Let's refine the "Weakest Link":* The weakest link is assuming second-years can grasp "incommensurability" without slipping into "subjective preference." I need to be sure the explanation of 'kind' is robust.

      *Let's refine the "Exclusion":* I should explicitly refuse to cover "Satisficing Consequentialism" as it muddies the water on maximisation.

      *Let's check British English:* "Programme", "prioritise", "centre", "whilst", "modelling".

      *Let's check the Order:*
      1. Consequentialist Premise (Maximise Good).
