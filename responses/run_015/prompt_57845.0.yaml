answer: |-
  # Joint Statement on the Nature of Practical Rationality and the Hitchhiker Case

  **Signatories:** The Act-Centered Rationality Working Group & The Disposition-Centered Rationality Working Group  
  **Date:** October 26, 2023  
  **Subject:** Clarification of Disputes Regarding Parfit's Hitchhiker and Dynamic Consistency

  ## I. Agreed Background Claims

  We, the undersigned advocates of competing theories of practical rationality, hereby affirm the following shared premises to establish a common foundation for our dispute:

  1.  **The Scenario:** We accept the standard formulation of Parfit's Hitchhiker case: A traveler is stranded in a desert. A driver offers a ride to town on the condition that the traveler will pay a fee upon arrival. The driver is a competent psychologist who will transport the traveler only if they predict the traveler will pay. Once in town, the traveler has the physical ability to refuse payment without legal repercussion.
  2.  **The Payoff Structure:** We agree on the ordinal preferences of the traveler: (1) Survival with Money Retained > (2) Survival with Money Paid > (3) Death in Desert.
  3.  **The Goal of Rationality:** We agree that a theory of rationality should generally guide agents toward flourishing outcomes. We acknowledge that a theory which systematically directs agents to die in the desert, when a competing theory directs them to survive, faces a significant pragmatic challenge.
  4.  **The Distinction:** We acknowledge the conceptual distinction between *evaluating an agent* (based on their long-term traits or dispositions) and *evaluating a token action* (based on its consequences at the moment of choice).
  5.  **Predictive Reliability:** We agree that the driver's prediction is not metaphysically fatalistic; the traveler retains free will, but the driver's prediction is highly correlated with the traveler's actual choice.

  ## II. Precisely Worded Residual Disagreements

  While we share the background above, we diverge on the fundamental locus of normative evaluation. We formulate our disagreement as follows:

  1.  **The Locus of Rationality:**
      *   **Act-Centered Position:** Rationality is fundamentally a property of *token actions* evaluated at the time of execution. An action is rational if and only if it maximizes expected utility relative to the causal consequences available *at that moment*.
      *   **Disposition-Centered Position:** Rationality is fundamentally a property of *agents or policies* evaluated over time. An action is rational if it flows from a disposition or policy that, when adopted, maximizes expected utility, even if the specific token action lacks causal leverage at the moment of execution.

  2.  **The Status of "Rational Irrationality":**
      *   **Act-Centered Position:** We accept the possibility of "Rational Irrationality." It can be rational to *cultivate* a disposition to pay (because it gets you saved) while simultaneously maintaining that it is irrational to *execute* the payment once saved (because the causal benefit is past).
      *   **Disposition-Centered Position:** We reject "Rational Irrationality" as incoherent. If it is rational to cultivate the disposition, it must be rational to act on it. To claim otherwise renders the agent dynamically inconsistent and self-defeating.

  ## III. Central Cruxes and Test Cases

  To move this debate forward, we have identified two central cruxes. Resolution of either would require at least one camp to revise its core theoretical commitments. For each crux, we propose concrete test cases in two variations: a **Noisy-Predictor Version** (driver is 80% accurate) and an **Advance-Commitment Version** (traveler can pay a fee to bind their future self).

  ### Crux 1: The Locus of Normative Assessment
  **Question:** Does the fallibility of prediction or the availability of binding technology shift the rational requirement from the *disposition* to the *causal mechanism*?

  **Test Case 1: The Desert Crossing**
  *   **Variation A (Noisy-Predictor):** The driver predicts correctly 4 out of 5 times. If the driver predicts "Non-Payer," they leave the traveler. If they predict "Payer," they drive. Once in town, the traveler knows the ride has occurred.
  *   **Variation B (Advance-Commitment):** Before the driver decides, the traveler can pay a small fee to sign a legally binding contract enforceable in town. If signed, the driver knows payment is guaranteed. If not signed, the driver relies on psychological prediction (as in Variation A).

  **Predicted Verdicts:**

  | Camp | Variation A (Noisy-Predictor) Verdict | Variation B (Advance-Commitment) Verdict |
  | :--- | :--- | :--- |
  | **Act-Centered** | **Do Not Pay.** Once in town, the ride is a sunk cost. Paying causes a loss of money with no causal benefit. The 80% accuracy is irrelevant to the *current* causal structure. | **Buy the Contract.** This causally influences the driver's prediction. **Do Not Pay (if contract fails).** If the contract option was unavailable or failed, revert to "Do Not Pay." |
  | **Disposition-Centered** | **Pay.** To be the kind of agent who survives, one must honor the policy. 80% accuracy is sufficient to make the disposition valuable. Refusing undermines the disposition for future cases. | **No Need for Contract (or Buy if Weak).** A truly rational agent needs no contract; their word is binding. However, if the disposition is weak, buying the contract is rational to signal the disposition. **Pay.** |

  **Resolution Condition:** If it can be proven that rationality *must* track causal leverage in Variation A, the Disposition-Centered camp must concede. If it can be proven that agents who refuse to pay in Variation A are systematically outcompeted in evolutionary or economic markets, the Act-Centered camp must concede.

  ### Crux 2: Dynamic Consistency and Regret
  **Question:** Is it a defect of rationality to make a plan one knows one will break later, or is it a defect to follow a plan that is locally suboptimal?

  **Test Case 2: The Traveler's Regret**
  *   **Variation A (Noisy-Predictor):** Same as above (80% accuracy). The traveler arrives in town safely.
  *   **Variation B (Advance-Commitment):** The traveler purchased the binding contract in the desert. They arrive in town. The contract forces them to pay.

  **Predicted Verdicts:**

  | Camp | Variation A (Noisy-Predictor) Verdict | Variation B (Advance-Commitment) Verdict |
  | :--- | :--- | :--- |
  | **Act-Centered** | **Rational Regret.** The traveler should feel regret upon arriving. They are glad they *had* the disposition (it saved them), but they recognize the *act* of paying is irrational. They wish they could have been predicted as a Payer but actually been a Non-Payer. | **No Regret on Contract.** Rational to be bound. **Regret on Payment (if unbound).** If the contract were voided in town, they would refuse to pay and feel no regret about that refusal, only gratitude for the contract that forced them earlier. |
  | **Disposition-Centered** | **No Regret.** The traveler achieved the best outcome for a rational agent. There is no conflict between the past plan and present action. Paying is the consummation of rationality. | **No Regret.** The contract is merely an external prop for internal rationality. The agent is happy to pay, either via contract or will. The distinction between "forced" and "willing" is less relevant than the consistency of the outcome. |

  **Resolution Condition:** If "Rational Regret" (being glad a prediction was made but glad you didn't have to fulfill it) is demonstrated to be a stable, non-self-defeating state, the Act-Centered view holds. If "Rational Regret" is demonstrated to be a form of preference fragmentation that leads to exploitable behavior (e.g., money-pumping), the Disposition-Centered view holds.

  ## IV. Commitment to Inquiry

  We endorse this statement as an accurate map of our disagreement. We agree that the **Noisy-Predictor Version** tests the robustness of dispositions under uncertainty, while the **Advance-Commitment Version** tests whether rationality is intrinsic to the agent or extrinsic to the causal structure. We commit to refining our theories to address the cruxes above, acknowledging that a theory of rationality that cannot account for the value of commitment without resorting to paradox is incomplete.

  **Signed,**

  *The Act-Centered Rationality Working Group*  
  *The Disposition-Centered Rationality Working Group*
