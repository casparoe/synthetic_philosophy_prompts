      *Wait, re-reading prompt:* "Formulate each disagreement so that the side holding it would endorse the wording." This implies I should list the specific claims they disagree on. I will structure the table to show the specific claim, which side holds it, and then the test/prediction.
      *Actually, a standard Adversarial Collaboration table usually lists the *Question* and then the *Competing Hypotheses*. Let's do that for clarity.*
