answer: |-
  **MEMORANDUM**

  **TO:** Department of Philosophy Tenure & Leave Committee
  **FROM:** The Chair
  **SUBJECT:** Joint Statement of Adversarial Collaboration regarding Leave Extension Request
  **DATE:** October 26, 2023

  **Context:**
  The following document is the product of an adversarial collaboration between two committee members tasked with evaluating a junior colleague's request for an additional semester of leave to complete a first book monograph. One member advocates primarily from the **Outside View** (focusing on reference class forecasting and base rates), while the other advocates from the **Inside View** (focusing on the specific causal details of the candidate and project).

  We have separated our judgments into **Jointly Affirmed Principles** (Section I) and **Residual Disagreements** (Section II). This document serves as the epistemic record for our final vote.

  ***

  ### I. Jointly Affirmed Principles
  *Both the Outside View (OV) and Inside View (IV) advocates endorse the following claims:*

  1.  **Informative Base Rates:** Base rates regarding leave completion and subsequent tenure success are informative and must serve as the prior probability for any decision. Ignoring the statistical frequency of similar outcomes in similar departments constitutes a planning fallacy.
  2.  **Override Conditions:** Case-specific details (e.g., manuscript progress, personal circumstances) may override base rates only if those details are independently verifiable and causally linked to completion, rather than merely expressive of intent.
  3.  **Responsible Confidence:** A candidate's expressed confidence is "responsible" only if it is calibrated against their own past performance on similar deadlines and the objective state of the work (e.g., word count, chapter completion), not merely their subjective sense of proximity to completion.
  4.  **Asymmetric Risk:** The cost of a false positive (granting leave that does not result in a book) differs from the cost of a false negative (denying leave that would have resulted in a book). Both costs must be weighed, acknowledging that the candidate bears the brunt of the latter, while the department bears the brunt of the former.
  5.  **Decision Threshold:** The department should grant the leave if and only if the updated probability of the book reaching a publishable state by the end of the semester exceeds a specific threshold (agreed at 65%), accounting for both the base rate and the specific evidence.

  ***

  ### II. Table of Residual Disagreements
  *The following table isolates the specific propositions where OV and IV diverge. The "Contested Claim" is worded such that the side listed in the "Proponent" column endorses it as a primary reason for their recommendation.*

  | Issue | Proponent & Contested Claim | The Crux (What would change this mind?) | Concrete Test / Departmental Record | OV Prediction | IV Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Reference Class Selection** | **OV:** "The relevant reference class is *all* junior faculty in R1 Philosophy departments who have requested a second pre-tenure leave extension." | Whether the candidate's specific traits (e.g., prior publication rate) are strong enough predictors to narrow the class without inducing selection bias. | **Record:** Review the last 10 years of departmental archives for all leave extension requests. Categorize by prior publication count (0-1 vs 2+). | Success rate for the broad class is <40%. Narrowing the class based on self-reported 'high potential' will not significantly raise this rate. | Success rate for the narrow class (2+ pubs) is >75%. The broad class includes candidates with fundamentally different trajectories. |
  | **2. Evidentiary Weight of Self-Report** | **IV:** "The candidate's confidence is high-evidence because we have direct observational data of her work ethic and the manuscript's current coherence." | Whether 'work ethic' observed in teaching and service correlates causally with the solitary discipline required for finalizing a monograph. | **Test:** Blind review of the current draft by two senior faculty (not on committee) to estimate 'hours of labor remaining' vs. candidate's estimate. | Reviewers will estimate remaining labor hours at 2x the candidate's estimate, regardless of current coherence. | Reviewers will estimate remaining labor hours within 20% of the candidate's estimate due to draft maturity. |
  | **3. Consequence of Denial** | **OV:** "Denying the leave preserves departmental resources for other projects with higher expected utility, minimizing institutional risk." | Whether the 'institutional risk' of a failed tenure case outweighs the 'institutional risk' of demoralizing a high-potential scholar. | **Comparison:** Compare tenure success rates of candidates who were denied extensions vs. those who were granted them but failed to finish. | Candidates denied extensions who stay often produce less research output in the following 2 years due to morale/resource loss. | Candidates denied extensions often pivot to articles and still tenure, whereas those granted leave who fail to finish are unlikely to tenure. |
  | **4. Calibration of 'Finish'** | **IV:** "The book will be 'finished' in the sense required for tenure if the manuscript is submitted to a press by the deadline." | Whether 'submission to press' is a valid proxy for 'completion' given the likelihood of major revisions requested by reviewers. | **Record:** Track time-from-submission-to-contract for the last 5 junior faculty books in the department. | Time-from-submission-to-contract will exceed 12 months, meaning 'submission' does not equal 'tenure-ready' within the probationary clock. | Time-from-submission-to-contract will average under 9 months for this candidate given the specific presses targeted. |

  ***

  **Signatures:**

  _________________________
  *Advocate, Outside View*

  _________________________
  *Advocate, Inside View*

  _________________________
  *Department Chair*
