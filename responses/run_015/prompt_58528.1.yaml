      *Okay, Table columns:* Disagreement Topic, The Contested Claim (worded for endorsement by the holder), The Crux, Concrete Test/Record, Outside View Prediction, Inside View Prediction.

      *Refining the "Claims both sides can sign":*
      1. Base rates establish a prior probability that cannot be ignored.
