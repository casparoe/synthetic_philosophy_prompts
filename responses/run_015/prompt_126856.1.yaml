answer: |-
  ### I. Dependency Order: Securing the Teleological Intuition

  **The Prerequisite:** Before introducing either mechanism, you must secure the students' commitment to the **Teleological Intuition**: the pre-theoretical belief that *Competence implies Comprehension*. You must make them feel the weight of the "Argument from Design."

  **The Sequence:**
  1.  **Establish the Phenomenon:** Present an instance of high-level competence (e.g., the precision of a verb conjugation, the aerodynamics of a bird's wing). Elicit their intuition that this *must* be the product of a mind or a plan.
  2.  **Introduce the Void:** Remove the mind/plan. Ask: "If no one intended this, how did it happen?"
  3.  **Reveal the Mechanism:** Only *after* the tension is felt, introduce the filtering process (Selection/Computation).

  **Why Reversal Collapses the Argument:**
  *   **If you start with the Mechanism (Mutation/Code):** Literature and history students, trained to look for agency and context, will view the mechanism as insufficient. Darwin becomes "blind luck" (how could chance write Shakespeare?) and Turing becomes "parlor tricks" (how could code feel pain?). The inversion is lost because the *competence* was never taken seriously as *design*.
  *   **If you skip the Intuition:** They will treat the output as merely "complex" rather than "designed." The philosophical shock—that design exists without a designer—never lands. They must first believe in the Designer to be shocked by his absence.

  ### II. The Carrying Example: Cumulative Selection of a Target Sentence

  **The Scenario:**
  Use the **"Blind Editor" process** (often illustrated as the "Weasel" program, but framed generically).
  *   **Setup:** Start with a random string of letters.
  *   **Rule:** Generate variations. Keep variations that more closely match a target sentence (e.g., "ORDER WITHOUT DESIGN"). Discard the rest. Repeat.
  *   **Outcome:** The target sentence emerges perfectly.

  **Why this anchors both figures:**
  *   **For Darwin:** The "Target" is Fitness. The "Variations" are Mutations. The "Keeping" is Natural Selection. The "Sentence" is the Adapted Organism.
  *   **For Turing:** The "Target" is Logical Consistency/Output. The "Variations" are Symbol Manipulations. The "Keeping" is Algorithmic Logic. The "Sentence" is the Computed Behavior.
  *   **Shared Structure:** Both demonstrate how a **Filter** creates order from noise without a **Blueprint**.

  **Why Darwin's Eye Fails:**
  The Eye is a static *product*. It invites the question "Who made this?" rather than "How was this built?" It triggers biological essentialism and allows students to retreat into "God did it" or "Life Force" mysteries. It obscures the *process* of filtering.

  **Why the Chinese Room Fails:**
  The Chinese Room is a static *thought experiment* about semantics. It traps students in a debate about "what is understanding?" (metaphysics) rather than "how is competence produced?" (mechanism). It invites dualism (mind vs. body) rather than structural inversion (process vs. plan).

  **Why the Blind Editor Succeeds:**
  It uses **Text**, the native medium of literature students. It makes the *process* of selection visible. It shows that "meaning" (the sentence) can be the *result* of a rule-bound process, not the *cause* of it.

  ### III. Mapping Misconceptions and Interceptions

  **1. Misconception: Evolutionary Fitness as Intentionality**
  *   **When it arises:** Immediately upon introducing Natural Selection. Students will say, "Nature *wants* the organism to survive."
  *   **Where to intercept:** During the "Blind Editor" demonstration, when discussing why a variation is "kept."
  *   **Counter-Question:** "Does the sieve *want* the small pebbles to fall through, or do they simply fall because they fit?" (Force the distinction between *selection* and *preference*).

  **2. Misconception: Behavioral Indistinguishability as Metaphysical Identity**
  *   **When it arises:** When discussing Turing. Students will argue, "If it acts like it thinks, it *is* thinking." (Or conversely, "If it's just code, it's *fake*.")
  *   **Where to intercept:** After the "Blind Editor" produces the sentence.
  *   **Counter-Question:** "The sentence is legible. Does the *paper* understand the words? At what point in the stacking of papers does understanding appear?" (Force the distinction between *output* and *interiority*).

  **3. Misconception: The Hidden Homunculus**
  *   **When it arises:** As a defense against the previous two. "There must be a little man inside the machine/organism reading the instructions."
  *   **Where to intercept:** At the conclusion of the mechanism explanation.
  *   **Counter-Question:** "If a little man is needed to understand the rules, who understands the rules inside the little man's head?" (Invoke Ryle's Regress to show that pushing comprehension back a step solves nothing).

  ### IV. End-of-Session Check: The Invisible Hand Diagnostic

  Do not ask them to define the terms. Do not ask for a summary. Ask them to **map the inversion onto a third domain** they already know.

  **The Task:**
  "Adam Smith's 'Invisible Hand' describes economic order arising from individual self-interest without a central planner. Using the structure we discussed today, explain:
  1.  Where is the **Competence**? (The market efficiency).
  2.  Where is the **Comprehension** usually assumed to be? (The central planner/monarch).
  3.  What is the **Filtering Mechanism** that replaces the planner? (Profit/Loss)."

  **Criteria for Genuine Grasp:**
  *   **Pass:** They identify the *mechanism* (price signals/competition) as the source of order, explicitly noting that no single agent understands the whole system. They see Smith, Darwin, and Turing as instantiating the same *logical move*.
  *   **Fail:** They say "Markets are smart like people" (metaphor) or "Markets are just math" (reduction). They must articulate that the *system* possesses a competence that the *parts* lack.

  ### V. Explicit Omissions and Justifications

  **1. Modern Large Language Models (LLMs)**
  *   **Omit:** Do not discuss Chatbots or AI generative art.
  *   **Justification:** For this audience, LLMs trigger immediate political and ethical anxiety ("Is it stealing art?", "Will it take jobs?"). This distracts from the *philosophical structure*. LLMs are also black boxes; the "Blind Editor" is transparent. Keep the focus on the *logic of inversion*, not the *current technology*.

  **2. Formal Mechanics of the Turing Machine (Tapes/States)**
  *   **Omit:** Do not explain states, tapes, or binary code.
  *   **Justification:** Literature/History students do not need the engineering specs to grasp the philosophical point. Technical details invite confusion about *implementation* rather than *implication*. The "Symbol Manipulation" concept is sufficient.

  **3. Evolutionary Psychology Adaptations**
  *   **Omit:** Do not discuss specific human behaviors as "adaptations" (e.g., "why we cheat").
  *   **Justification:** This domain is highly contested and often viewed as reductionist by humanities scholars. It invites debate about *truth claims* ("Is that really why we love?") rather than *structural claims* ("Can love exist without a design?"). Keep the biology abstract (the Eye/The Editor) to avoid ideological friction.

  **Goal:** By omitting the contemporary and the technical, you isolate the **Philosophical Inversion**. They must leave seeing the *move* (Competence without Comprehension), not the *applications*.
