      *   **Spirit vs. Intention:** "Spirit" = Purpose/Policy goal. "Intention" = Specific mental state regarding application. They overlap but "Spirit" is more abstract, "Intention" is more concrete. In Brewer's usage, they function as a hendiadys (two words for one concept: the legislative will).
