      *   **The Execution Scene (Origin Myth):** Analyze the cry for "Freedom." It's not legal freedom; it's ontological freedom. It creates a lineage for the modern viewer. It bypasses the need for Anderson's infrastructure by using *affect* (emotion/pain) as the binding agent.
