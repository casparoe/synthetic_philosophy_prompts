      *   **Conclusion (What the film adds):** Conceptual analysis is dry; film is affective. The film shows *how* the invention feels from the inside. It reveals the *emotional truth* of the myth, even if historically false. It shows that "imagining" doesn't require print; it requires shared sacrifice and spectacle. Acknowledge the distortion: The film makes nationalism look inevitable/natural rather than constructed.

