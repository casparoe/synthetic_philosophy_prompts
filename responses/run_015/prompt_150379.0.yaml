  ### The Listing

  **RESIDENCE 44-B | MANIFOLD HEIGHTS | PRICE ON APPLICATION**

  Discover curated living within a generally covariant framework. This bespoke unit offers uncompromising privacy inside a vacuum solution, featuring artisanal curvature and floor-to-ceiling event horizons that filter unwanted causal contact. The open-plan geodesics encourage fluid movement, though residents should note that parallel transport around the master bedroom may result in slight vector rotation.

  Previously marketed as a prime substantival asset, the property has recently been flagged by the Local Lorentz Inspectorate for a Class-4 Zoning Variance. During a routine compliance sweep, officers detected an active diffeomorphism smoothness violation within the interior "hole" region. While the metric field remains physically untouched—meaning the walls, light fixtures, and espresso machine occupy the same relational positions—the underlying point-set has been permuted.

  Essentially, the unit you view during open house is metaphysically distinct from the unit listed on the deed.

  The Condo Board, *Substantivalist Holdings LLC*, has filed an injunction against the current owner regarding "point-individuation failure." Their counsel argues that because spacetime points possess primitive thisness (haecceity), shuffling the manifold points constitutes a breach of contract, even if no physical measurement can detect the difference. "You bought Point P, not the metric field at Point P," the board statement reads. "The diffeomorphism dragged the field to Point Q. You are now living in a different universe, legally speaking."

  Prospective buyers should appreciate the exposed brick of the Einstein tensor and the natural light provided by null geodesics. However, due to the ongoing litigation regarding Leibniz equivalence, showings are restricted to coordinate-independent observations only. Do not attempt to label furniture with specific coordinates; this constitutes tampering with evidence.

  The seller is motivated but insists on a clause regarding relational identity. Title insurance is available, though providers have updated their exclusions.* Spectacular views of the causal past included. Private singularity not included.

  *\*Footnote: Standard policies now explicitly exclude coverage for "non-relational identity loss" or "haecceity drift." Buyers are advised to secure a separate metaphysical rider.*

  ### Translator's Note

  This listing satirizes the "Hole Argument" in philosophy of physics, specifically the debate between substantivalism and relationalism. Substantivalists believe spacetime points exist independently (like empty lots), while relationalists (following Leibniz) argue only the relationships between fields matter. The joke treats the philosophical problem—where diffeomorphisms create indistinguishable but metaphysically distinct models—as a mundane real estate zoning violation. The inspector enforces substantivalism as building code, mocking the idea that "where" something is matters more than "what" it is relative to its neighbors.
