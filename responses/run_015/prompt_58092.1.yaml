  ### Decision Tree: Public Commemoration and Civic Memory

  **Instructions:** Answer the following six questions sequentially. Your path through the "Yes/No" branches will lead you to one of eight terminal philosophical positions regarding what ought to be done with a contested public commemoration.

  **Q1. The Expressive Commitment:** Does maintaining the object in its current public location constitute a moral endorsement by the city of the subject's wrongful acts?
  *   **Yes:** Go to Q2.
  *   **No:** Go to Q5.

  **Q2. The Historical Commitment:** Is the educational duty to preserve an unedited record of the past weightier than the harm caused by the perceived endorsement?
  *   **Yes:** **Terminal Node A (Preservationism).**
  *   **No:** Go to Q3.

  **Q3. The Mitigation Commitment:** Can the addition of explanatory plaques, counter-monuments, or educational programming adequately neutralize the harmful message of the object without moving it?
  *   **Yes:** **Terminal Node B (Retention-with-Contextualization).**
  *   **No:** Go to Q4.

  **Q4. The Spatial Commitment:** Does moving the object from a place of civic honor (e.g., a square) to a place of study (e.g., a museum) resolve the moral problem of endorsement?
  *   **Yes:** **Terminal Node C (Relocation-to-Museum).**
  *   **No:** **Terminal Node D (Removalism).**

  **Q5. The Democratic Commitment:** Is the legitimacy of a commemoration determined solely by whether it was authorized through current democratic processes?
  *   **Yes:** **Terminal Node E (Proceduralism).**
  *   **No:** Go to Q6.

  **Q6. The Scope Commitment:** Do defects in a subject's private character or an object's technical origin invalidate its public value if the community currently cherishes it?
  *   **Yes:** **Terminal Node F (Moral Consistency).**
  *   **No:** This branch supports two distinct rationales for retention. Proceed to **Terminal Node G** or **Terminal Node H** based on which good you prioritize.

  ***

  ### Terminal Positions

  **1. Preservationism on Historical-Record Grounds (Node A)**
  *   **Characterization:** The object must remain in place because public space serves as an archive of truth; erasing uncomfortable monuments falsifies history and prevents citizens from confronting the reality of past wrongs.
  *   **Hardest Commitment:** Defenders must accept that the city appears to endorse the subject's worst acts, risking harm to marginalized residents, in service of historical accuracy.
  *   *Applies to:* Founder Statue.

  **2. Retention-with-Contextualization (Node B)**
  *   **Characterization:** The object remains in place but is semantically altered through added information that critiques the subject, transforming the site from an honorific into a dialectical space.
  *   **Hardest Commitment:** Defenders must accept that harmful symbolic speech can be adequately "fixed" by text, assuming viewers will read the plaque rather than just see the statue.
  *   *Applies to:* Founder Statue.

  **3. Relocation-to-Museum (Node C)**
  *   **Characterization:** The object is too morally toxic for a civic square but too historically significant to destroy; it belongs in a curated context where it can be studied without conferring honor.
  *   **Hardest Commitment:** Defenders must accept that removing the object from public view risks sanitizing history or hiding the evidence of the city's past values from daily sight.
  *   *Applies to:* Founder Statue.

  **4. Removalism on Endorsement Grounds (Node D)**
  *   **Characterization:** The object must be removed (and potentially destroyed) because the state cannot morally associate itself with the subject's wrongdoing, and no context can sever the link between the honor and the harm.
  *   **Hardest Commitment:** Defenders must accept the loss of the artifact as a historical document and the potential accusation of "erasing history" to prevent current expressive harm.
  *   *Applies to:* Founder Statue.

  **5. Proceduralism (Node E)**
  *   **Characterization:** The fate of the object is decided strictly by current democratic authorization (e.g., a vote); if the process validates it, it stays; if not, it goes, regardless of historical or moral merits.
  *   **Hardest Commitment:** Defenders must accept that a majority vote could legitimately mandate the retention of a deeply offensive symbol or the removal of a cherished one, prioritizing process over outcome.
  *   *Applies to:* Dissident Mural (unauthorized origin).

  **6. Moral Consistency (Node F)**
  *   **Characterization:** Public honors require private virtue; if a subject's private character (or an object's origin) is flawed, the public recognition is illegitimate and must be revoked to maintain civic integrity.
  *   **Hardest Commitment:** Defenders must accept that complex historical figures may be stripped of recognition for private failings unrelated to their public contributions, potentially emptying public space of honored humans.
  *   *Applies to:* Novelist Street (private letters).

  **7. Public/Private Distinction (Node G)**
  *   **Characterization:** Public recognition is warranted by public contribution alone; private moral failings do not negate professional achievements, so the commemoration remains valid.
  *   **Hardest Commitment:** Defenders must accept honoring individuals who may have been morally reprehensible in private, separating civic utility from personal virtue.
  *   *Applies to:* Novelist Street (public emancipation).

  **8. Civic Continuity (Node H)**
  *   **Characterization:** The stability of the civic environment outweighs the scrutiny of individual commemorations; unless the object causes active disruption, it remains to avoid the chaos of constant re-evaluation.
  *   **Hardest Commitment:** Defenders must accept that bureaucratic inertia is a preferable moral stance to active justice, potentially leaving harmful symbols in place to avoid social friction.
  *   *Applies to:* Novelist Street / Founder Statue (status quo).

  ***

  ### Analysis of the Instrument

  **1. The Unoccupied Combination**
  *   **Combination:** Q1 (Yes) + Q2 (Yes) + Q3 (Yes) + Q4 (No) → **Removal.**
  *   **Explanation:** This path is logically unstable. If a respondent believes the city endorses the wrong (Q1=Yes), they should want change. However, if they also believe the historical record is paramount (Q2=Yes) *and* that context can fix the message (Q3=Yes), there is no coherent philosophical reason to proceed to Removal (Q4=No). A respondent holding Q2 and Q3 would logically stop at Preservation or Contextualization; choosing Removal contradicts their prior commitments to history and mitigation.

  **2. The Ambiguous Pair**
  *   **Positions:** **Preservationism (Node A)** and **Retention-with-Contextualization (Node B).**
  *   **Explanation:** These positions are not cleanly separated in practice because both result in the physical object remaining in the exact same location. The distinction relies entirely on the *justification* (unedited record vs. corrected message) rather than the outcome. A city could claim to be "preserving history" while adding a plaque, effectively blending the two positions, making it difficult to discern which philosophical commitment is actually driving the policy.
