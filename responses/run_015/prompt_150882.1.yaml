  10. **Final Polish:** Ensure the distinction between Lewis-Halfers and Double-Halfers is clear, as the user mentioned it. Ensure the SSA/SIA distinction is explained simply. (Self-Correction: Keep it accessible for a newspaper audience context, but deep enough for the writer).

