answer: |-
  **MEMORANDUM SPECIFICATION: OPERATIONALIZING SECESSION CLAUSES**

  **TO:** Constitutional Drafting Committee
  **SUBJECT:** Functional Requirements for a Justiciable Secession Mechanism
  **CONTEXT:** Moving from normative theory to administrative law. The goal is not moral justification, but adjudicability.

  Below are the eight functional requirements a theory of secession must meet to be codified. Each requirement includes the operational rule, the case anchor, and a classification of necessity.

  ### 1. The Pre-Defined Unit Constraint (Breaking Circularity)
  *   **Rule:** The eligible seceding unit must be a pre-existing, first-order administrative division (e.g., State, Province, Autonomous Community) defined *prior* to the secession trigger. Voters cannot draw the boundary; they can only accept/reject the status of the existing unit.
  *   **Case Anchor:** *Catalonia/Spain.* The conflict arises because the "nation" is cultural, but the legal unit is administrative. If the boundary is up for negotiation *during* the referendum, the electoral commission cannot draw the ballot map.
  *   **Status:** **[NON-NEGOTIABLE]**. Without this, the electoral commission has no jurisdiction to administer the vote.
  *   **Trade-off:** Excludes "nation" definitions that cross administrative lines (e.g., Kurdish regions split across four states).

  ### 2. The Franchise Fixation Rule
  *   **Rule:** Eligibility to vote is determined by residency within the Pre-Defined Unit at a fixed cutoff date (e.g., 6 months prior), excluding diaspora unless they maintain tax residency.
  *   **Case Anchor:** *Quebec.* The "All Quebecers" vs. "All Canadians" debate. If diaspora can vote, the demographic balance shifts artificially. If the rump state votes, it becomes a national referendum, not a regional one.
  *   **Status:** **[NON-NEGOTIABLE]**. Courts must be able to verify voter rolls without litigating identity.
  *   **Trade-off:** Disenfranchises cultural nationals living outside the territory (e.g., ethnic Scots in London).

  ### 3. The Reiteration Prohibition (Solving the Russian-Doll Problem)
  *   **Rule:** If a unit secedes, its internal sub-units (counties, municipalities) lose the right to initiate their own secession from the new state for a fixed period (e.g., 30 years). The right to secede is a "one-time use" per territorial layer.
  *   **Case Anchor:** *Holdout County.* If a pro-UK county in an independent Scotland could immediately vote to rejoin the UK, the new border is impossible to draw.
  *   **Status:** **[NON-NEGOTIABLE]**. Prevents infinite regress and border fragmentation.
  *   **Trade-off:** This is the logical contradiction for pure democratic theory. You are denying the holdout county the exact right you granted the region.
  *   **Theory Killer:** This requirement eliminates **Pure Plebiscitary Theory**. If "democratic will" is the sole justification, you cannot logically deny the holdout county that same will. To administer the law, you must privilege *border stability* over *consistent democratic principle* at the sub-level.

  ### 4. The Rump Consent Threshold (The Veto Question)
  *   **Rule:** Secession requires a dual majority: (A) Majority in the seceding unit AND (B) Majority in the rump state legislature (or national referendum) *only* regarding the Terms of Separation (debt, assets), not the principle of exit.
  *   **Case Anchor:** *Economic Viability.* If a region leaves taking 80% of oil revenue but 0% of debt, the rump collapses.
  *   **Status:** **[PREFERENCE: Unionist/Legal Stability]**.
  *   **Tension:** If you require Rump Consent for the *principle* of exit, secession becomes a grant, not a right. If you require zero consent, the rump can blockade the new state (see: *Spain/Catalonia*).
  *   **Compromise:** The *right* to leave is unilateral (after vote); the *terms* are negotiated (with arbitration).

  ### 5. The Viability Gate (Economic/Military)
  *   **Rule:** An independent commission must certify that both the new state and the rump state remain economically and militarily viable post-separation before the result is certified.
  *   **Case Anchor:** *Punjab/Bengal (1947)* or *Hypothetical US State.* If secession leaves the rump without access to the sea or nuclear deterrent, the threat of civil war spikes.
  *   **Status:** **[PREFERENCE: International/Security]**.
  *   **Problem:** "Viability" is politically subjective. A constitutional court will struggle to define "military non-viability" without usurping legislative power.

  ### 6. The Trigger/Authority Split
  *   **Rule:** Distinguish between (A) Authority to Hold a Vote (Parent State Constitution), (B) Right to Secede (International Recognition), and (C) Legitimacy of Grievance (Remedial).
  *   **Case Anchor:** *Scotland (2014) vs. Catalonia (2017).* Scotland had (A); Catalonia claimed (B) based on (C).
  *   **Status:** **[NON-NEGOTIABLE]**. A constitution must specify who calls the vote. If the regional parliament can call it unilaterally, the union is confederal. If the central parliament must grant it, the union is federal/unitary.
  *   **Requirement:** The Constitution must explicitly assign the "Referendum Power" to one level of government. Ambiguity invites crisis.

  ### 7. The Temporal Lock (Serial Referendums)
  *   **Rule:** If a secession vote fails, no new vote may be held for X years (e.g., 10). If a vote succeeds, the border is locked for Y years (e.g., 30).
  *   **Case Anchor:** *Quebec (1980, 1995).* Constant campaigning creates permanent instability, discouraging investment in the region.
  *   **Status:** **[NON-NEGOTIABLE]**. Required for governance stability.
  *   **Trade-off:** Risks ignoring genuine, rapid shifts in demographic will.

  ### 8. The Recognition Conditionality
  *   **Rule:** Domestic legal success (winning the vote) does not guarantee international statehood. The constitution must state that independence is contingent on achieving X% of UN/Regional recognition within Z time, otherwise the result is voided.
  *   **Case Anchor:** *Kosovo/Catalonia.* You can win the vote and still be a pariah state.
  *   **Status:** **[PREFERENCE: Realist]**.
  *   **Risk:** Creates a "limbo state" where the region has voted to leave but remains legally bound to the parent due to lack of external recognition.

  ---

  ### Incompatible Pairs (You Cannot Have Both)

  1.  **"The Demos Draws Its Own Boundaries" + "Administrable Law"**
      *   *Why:* If the voters decide the unit, the election commission cannot print ballots before the boundary is settled. If the boundary is settled before the vote, the voters didn't draw it.
      *   *Resolution:* You must accept existing administrative borders (Requirement 1).

  2.  **"No Veto for Rump State" + "Settled Succession (Debt/Assets)"**
      *   *Why:* If the rump has no say, it will refuse to recognize debt division or treaty succession. The new state exists legally but functions economically as a rogue entity.
      *   *Resolution:* Unilateral right to leave, but negotiated (arbitrated) terms of divorce (Requirement 4).

  3.  **"Pure Democratic Will" + "No Sub-Seccession"**
      *   *Why:* As noted in Requirement 3. If will is the only metric, the holdout county's will matters as much as the region's.
      *   *Resolution:* Privilege the higher-order administrative unit for the sake of border stability.

  ---

  ### The Theory-Killer Requirement
  **Requirement 3 (The Reiteration Prohibition).**
  This is the single constraint that knocks out the most popular academic theories.
  *   **Pure Plebiscitary Theory** (Any group that wants to leave can) collapses because it cannot logically forbid the holdout county from doing the same thing.
  *   **Remedial Right Theory** (Only if oppressed) survives better, as it can argue the county isn't oppressed, but it becomes highly subjective for a court to determine "oppression" levels for sub-groups.
  *   **Negotiated/Constitutionalist Theory** survives best because it treats borders as contractual, not organic.

  ---

  ### Scoring the Three Families

  | Theory Family | Administrability | Stability | Democratic Legitimacy | Verdict for Constitution |
  | :--- | :--- | :--- | :--- | :--- |
  | **Remedial-Right-Only** (Secede only if persecuted) | **Low.** Courts must judge "oppression," inviting political litigation. | **High.** Discourages frivolous bids. | **Low.** Ignores non-oppressive fiscal/cultural grievances. | **Reject.** Too vague for judicial enforcement. |
  | **Plebiscitary/Primary-Right** (Secede if majority wills it) | **Medium.** Clear vote, but fails on boundaries/sub-secession. | **Low.** Incentivizes constant campaigning & fragmentation. | **High.** Aligns with self-determination norms. | **Modify.** Only works with strict Unit & Reiteration constraints. |
  | **Negotiated/Constitutionalist** (Secede with Parent Consent) | **High.** Clear procedural path (amendment process). | **High.** Ensures asset/debt agreement. | **Low.** Effectively a veto; makes right illusory. | **Adopt.** Best fit for rule-of-law, provided arbitration exists. |

  ---

  ### Confidence & Uncertainty

  **Overall Confidence:** **High (85%)** on the procedural constraints. The logic of administrability forces these specific requirements; you cannot run an election without defining the unit and the franchise.

  **Least Sure Claim:** **Requirement 5 (Viability Gate).**
  I am least confident that a Constitutional Court can objectively adjudicate "economic or military viability" without becoming a super-legislature. Defining "non-viable" is inherently political. If you leave this to judges, they will be accused of blocking independence based on economic forecasts. If you leave it to politicians, it becomes a weaponized veto. I suspect this requirement must be outsourced to an independent international arbitration body, not a domestic court, to function.
