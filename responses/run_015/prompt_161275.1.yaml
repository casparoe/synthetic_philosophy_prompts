prompt: |-
  hey — putting together something like a long memo on secession for a group that's advising a constitution-drafting process, and before I write any of it I want the spec. Not "should Catalonia be allowed to leave" — I want the requirements list: what would a theory of secession have to deliver to be good enough to actually be written into law, i.e. administrable by an electoral commission and a constitutional court, not just defensible in a journal?

  Concretely: it has to resolve, before the vote happens, who the demos is, what territory is on offer, what the threshold is, and what happens to the bits that vote against. So give me desiderata that bite under that constraint, with the case behind each.

  Cases I want requirements anchored to, at least loosely: Scotland, Quebec, Catalonia — plus the awkward ones: a holdout county that votes to stay but is geographically stuck to the new state; an enclave or exclave; a region whose departure would leave the rump state economically or militarily non-viable; a diaspora that identifies with the nation but doesn't live there; a subgroup that wants to seceed from the secession and maybe rejoin the parent state; a secession that succeeds or fails purely on whether other states recognise it; and a "nation" with no thick shared culture that just wants out over fiscal transfers.

  Things I specifically want you to think through rather than assume:

  - the franchise–territory circularity: who gets to vote depends on what unit is seceding, but what unit secedes is supposed to be settled by who votes. Does any theory actually break that circle, or does every one of them smuggle in a prior answer about the unit (usually an existing administrative border)?
  - the reiteration / Russian-doll problem: whatever right you posit has to say what it says one scale down. Let the holdout secede from the secession and you get a regress; don't let it and you've denied the holdout the exact right you just asserted. Which horn is less bad, and why?
  - the veto-holder question: does the rump state's population get a say (defence, debt, shared infrastructure, transfers)? If yes, secession collapses into a grant; if no, into a unilateral right.
  - the trigger/authority split: who may authorise a referendum, who has the right to secede, and what counts as a legitimate grievance (remedial-only vs. any democratic will) are three different questions. Keep them apart and say which one a given theory is actually a theory of.
  - the serial-referendum problem: what's the shelf life of a lost vote, and of a won one? Anything that says "the demos decides" owes an answer about a demos that changes its mind, or one that was panicked, bribed, or badly misinformed.

  Also mark which requirements are non-negotiable and which are just preferences of one camp (nationalists, unionists, international lawyers, constitutional judges). Flag any pair I probably can't have together — my guesses are that "the demos draws its own boundaries" and "everyone materially affected gets a say" can't both hold, and that "no veto for the rump state" is in tension with "succession is settled in advance" (debt, treaties, UN seat, central bank) — but you tell me. And name the single requirement that knocks out the most popular theories; I suspect it's the holdout problem killing pure plebiscitary views, but I want your take.

  A short table scoring the three big families — remedial-right-only, plebiscitary/primary-right, and the negotiated-constitutionalist "you need the parent state's consent" view — is fine, but keep it to a few lines. Alot more than that and you're spending words on the wrong part; the criteria are the deliverable.

  At the end, say how confident you are in the list overall and single out the one requirement or claim you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested memo spec:

  1.  **Analyze the Request:**
      *   **Goal:** Create a specification (requirements list) for a theory of secession suitable for constitutional drafting (administrable by courts/commissions), not just academic debate.
      *   **Focus:** Operational criteria (who votes, territory, threshold, post-vote mechanics), anchored in real-world cases (Scotland, Quebec, Catalonia, plus edge cases like holdout counties, enclaves, viability, diaspora, sub-secession, recognition, fiscal motives).
      *   **Specific Constraints/Thought Experiments:**
          *   Franchise-Territory Circularity.
          *   Reiteration/Russian-Doll Problem (secession from secession).
          *   Veto-Holder Question (Rump state's say).
          *   Trigger/Authority Split (Who calls it vs. Right to secede vs. Grievance).
          *   Serial-Referendum Problem (Shelf life of votes).
      *   **Output Requirements:**
          *   Mark Non-Negotiable vs. Preference.
          *   Flag incompatible pairs.
          *   Identify the "theory-killer" requirement.
          *   Short table scoring the three main theories (Remedial, Plebiscitary, Negotiated).
          *   Confidence level + least sure claim.
      *   **Tone:** Professional, legal-constitutional, precise, avoiding normative fluff ("should Catalonia...").

  2.  **Deconstruct the Core Tension:**
      *   The user wants *administrability*. This means the theory must yield binary or calculable outputs for a court or commission. Abstract moral rights don't count unless they translate to procedural rules.
      *   The "Russian-Doll" and "Circularity" problems are the hardest logical hurdles. Most theories fail here because they rely on pre-existing administrative boundaries to define the "self" in "self-determination."

  3.  **Drafting the Requirements (The "Spec"):**
      *   *Requirement 1: The Unit Definition (Breaking Circularity).* You can't let the voters define the boundary *ex nihilo*. You need a default unit.
      *   *Requirement 2: The Franchise (Who Votes).* Residents vs. Citizens vs. Diaspora. Needs to be fixed *before* the campaign.
      *   *Requirement 3: The Threshold (Supermajority vs. Simple).* Clarity vs. Legitimacy.
      *   *Requirement 4: The Reiteration Constraint (Russian Dolls).* Can a sub-unit opt out? This is the big one.
      *   *Requirement 5: The Rump Veto/Consent.* Does the parent state agree?
      *   *Requirement 6: Viability & Asset Division.* Economic/Military viability.
      *   *Requirement 7: Temporal Stability (Serial Referendums).* Cooling-off periods.
      *   *Requirement 8: Recognition Criteria.* Internal vs. External validity.

  4.  **Addressing the Specific Thought Experiments:**
      *   *Circularity:* Solve by anchoring to existing administrative borders (NUTS regions, states, provinces) as the *only* eligible units.
      *   *Russian Doll:* Must forbid sub-secession immediately upon independence to prevent infinite regress.
      *   *Veto:* Distinguish between "Right to Secede" and "Terms of Separation."
      *   *Trigger:* Separate the *right to hold a vote* from the *right to succeed*.
      *   *Serial:* Implement a "lock-in" period (e.g., 10-20 years).

  5.  **Evaluating Incompatibilities:**
      *   "Demos draws boundaries" vs. "Everyone affected gets a say." (True, these conflict).
      *   "No Rump Veto" vs. "Settled Succession." (If the rump has no say, they can block debt/treaty succession, making independence nominal).
      *   *Theory Killer:* The Reiteration Constraint (Russian Doll). Pure plebiscitary theory collapses if any minority within the seceding region can also secede.

  6.  **Scoring the Theories:**
      *   *Remedial:* Good for stability, bad for "just want out" cases. Hard to administer (who judges oppression?).
      *   *Plebiscitary:* Good for democracy, bad for boundaries/stability. Fails Russian Doll test.
      *   *Negotiated/Constitutionalist:* Most administrable, but effectively gives the parent state a veto.

  7.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I mark Non-Negotiable vs. Preference? *Action:* Add tags [NN] and [P].
      *   *Check:* Did I answer the confidence question? *Action:* Add at the end.
      *   *Check:* Is the tone right? *Action:* Ensure it sounds like a legal spec, not a political science essay.
      *   *Check:* Did I address the "holdout county"? *Action:* Ensure Requirement 4 covers this explicitly.

  8.  **Final Polish:**
      *   Make sure the distinction between *admissibility* (can we vote?) and *outcome* (did we win?) is clear.
      *   Ensure the "Theory Killer" is explicitly identified.
      *   Verify the table is concise.

  **(Self-Correction Note on the "Theory Killer"):** I initially thought about the Rump Veto being the killer. But the prompt suggests the Holdout/Russian Doll problem. I agree with the prompt's intuition. If a theory allows a region to secede based on "will," it logically must allow a sub-region to do the same. If it forbids the sub-region, it admits "will" isn't the only principle (stability/borders matter). This contradiction kills pure plebiscitary theory in a legal spec. I will highlight this.

  **(Self-Correction on Confidence):** I need to be honest. Constitutionalizing secession is notoriously difficult because it incentivizes the behavior it regulates. I should express moderate confidence but highlight the "Viability" requirement as the weakest link because "viability" is politically subjective.

  9.  **Final Structure:**
      *   Intro: Purpose of the Spec.
      *   The Requirements List (numbered, tagged, with case anchoring).
      *   Incompatible Pairs.
      *   The Theory-Killer.
      *   Theory Scoring Table.
      *   Confidence & Uncertainty.

