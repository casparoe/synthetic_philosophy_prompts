          4.  Both sides agree that the deployment of machinery under capital frequently results in the intensification of labor rather than a reduction of the working day.
          5.  Both sides accept that the contradiction between the material capacity to reduce labor and the economic necessity to valorize capital is central to analyzing automation, though they differ on its resolution.

      *Check:* Are these 1-2 sentences? Yes. Are they signable? Forces-first says yes (acknowledges capital constraint). Relation-first says yes (acknowledges Fragment exists and contradiction is central even if teleological). Claim 3 is crucial for "what neither side maintains."

  3.  **Drafting Part 2: The Table:**
