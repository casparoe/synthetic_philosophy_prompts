          *   Specific Cruxes to cover (unless better fifth found):
              1.  Reduction of necessary labor time (tendency vs. offset).
              2.  General intellect (productive force vs. command over knowledge).
              3.  Contradiction forces/relations (explanatory vs. teleological).
