          *   (b) Forces: Automation tends to reduce necessary labor time despite capitalist barriers, creating a crisis of valorization.
          *   (c) Relation: Capitalist mechanisms systematically offset this reduction to maintain surplus value extraction via intensification or new markets.
          *   (d) Case: A fully automated plant operating within a competitive market requiring price competition.
          *   (e) Forces: Prices fall toward zero, profitability collapses. Relation: Prices stabilize via monopoly or intensified exploitation elsewhere, profitability maintained.
      *   *Crux 2: General Intellect.*
          *   (a) Does general intellect name a reclaimable productive force or capital's command over knowledge?
          *   (b) Forces: It names a collective productive power that exists potentially independent of capital and can be reappropriated.
          *   (c) Relation: It describes capital's subsumption of knowledge, having no independent subject outside the value relation.
          *   (d) Case: Open-source software infrastructure used by proprietary platforms.
          *   (e) Forces: Shows knowledge escaping capital's measure, pointing to post-value production. Relation: Shows capital capturing free knowledge to privatize rents, reinforcing value forms.
      *   *Crux 3: Forces vs. Relations Contradiction.*
          *   (a) Does the contradiction between forces and relations do explanatory work or represent teleology?
          *   (b) Forces: It explains systemic crises and the historical possibility of transition beyond capital.
          *   (c) Relation: It risks teleology; explanation must remain within the logic of the value relation itself.
          *   (d) Case: The introduction of labor-saving technology during a period of falling profit rates.
          *   (e) Forces: Evidence of forces bursting through relations, signaling systemic limits. Relation: Evidence of capital's rational adaptation to maintain dominance, not systemic collapse.
