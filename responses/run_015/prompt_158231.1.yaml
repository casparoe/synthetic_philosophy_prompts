          *   (d) Case: A fleet of robots requiring continuous monitoring and repair by a small, highly skilled workforce.
          *   (e) Forces: The small workforce cannot generate enough value to sustain the system's expansion. Relation: The high intensity and skill of this workforce generate sufficient surplus value to sustain profitability.
      *   *Crux 5: Absorption of Know-How (Real Subsumption vs. Expropriation).*
          *   (a) Is absorbing worker know-how into machinery real subsumption or expropriation, and does it affect the wage?
