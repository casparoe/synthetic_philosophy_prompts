answer: |-
  This is a brilliant pedagogical challenge. You are asking to translate a counter-intuitive mathematical truth (ergodicity breaking and portfolio theory) into a somatic, social experience without relying on the abstract language that usually gates this knowledge.

  Your instinct on the rolling mechanics (Phase 1 Individual, Phase 2 Shared) is **correct**. Do not change it.
  *   **Phase 1 (Individual):** You need *variance between players* to demonstrate that the "Room Average" is a lie. If everyone rolls the same sequence, the Average and the Median are the same. You need one lucky fool to skew the average while the rest go bust.
  *   **Phase 2 (Shared):** You need to *remove variance between players* to prove that the difference in outcome is due to *strategy* (splitting the stake), not luck.

  Here is the complete run-of-show.

  ### Part 1: Materials & Setup

  **For the Room:**
  *   **3 Tables:** Arrange so players face each other (5 people per table is ideal).
  *   **Whiteboard:** Divided into 3 sections (one per table) to track "Table Wealth" sums.
  *   **Dice:** 6 ten-sided dice (d10). Two distinct colors per table (e.g., Red and Blue). The third die is a spare.
  *   **Chips:** 1,000 poker chips total (approx. 70 per person). Two colors if possible (e.g., White for bankroll, Black for betting), but one color works if you are careful.
  *   **Index Cards:** 30 small cards (2 per person).
  *   **Pens:** 15.
  *   **Timer:** Your phone.

  **The Currency:**
  *   Denominate everything in **"Points."**
  *   **Starting Bankroll:** 100 Points per player (count out 100 chips).
  *   **Rounding Rule:** Stakes are rounded to the **nearest whole chip**. (e.g., 20% of 100 = 20 chips. 20% of 13 = 3 chips).
  *   **Ruins:** If a player has 0 Points, they are "Out."
  *   **The "Out" Protocol:** An Out player does not leave. They immediately become the **Table Scribe**. Their job is to verify the math of the survivors and record the round results on the table's sheet. This gives them status and keeps them engaged.

  ### Part 2: Facilitator's Cheat Sheet (Do Not Share)

  Keep these numbers hidden. They are your compass to navigate the debrief.

  **The Bet:**
  *   Win: 1–6 on d10 (60% chance). Payout: +100% of stake.
  *   Lose: 7–0 on d10 (40% chance). Loss: -100% of stake.

  **Phase 1 (Single Die):**
  *   **Optimal Stake:** 20% of bankroll.
  *   **The "Zero Growth" Trap:** Betting 50% or more leads to long-term decline. Betting 100% leads to near-certain ruin.
  *   **Expected Result (8 Rounds):**
      *   *20% Bettor:* Ends with ~115–120 Points.
      *   *100% Bettor:* 98% chance of 0 Points. 2% chance of 25,600 Points.
      *   *The Skew:* If one 100% bettor gets lucky, the "Room Average" will look massive, even if 13 people are broke.

  **Phase 2 (Two Independent Dice):**
  *   **The Lesson:** You can safely stake *more* total money if you split it.
  *   **Comparison A (Timidity):** Staking 20% total (10% on Red, 10% on Blue) grows *slower* than Phase 1. Staking 20% on *each* (40% total) grows *faster* than Phase 1.
  *   **Comparison B (Ruins):** Staking 50% on one die shrinks wealth. Staking 25% on Red + 25% on Blue (50% total) grows wealth.
  *   **Shared Roll Mechanic:** Everyone at the table uses the *same* Red/Blue roll results. This isolates the variable to "How did you split your chips?"

  ### Part 3: Timeline (90 Minutes)

  **00:00 – 00:10: Introduction & Setup**
  *   Welcome everyone. Acknowledge the mix of backgrounds.
  *   **Script:** "Tonight we are testing intuition about risk. No math degrees required. If you can count chips, you can play."
  *   Deal 100 chips to each player.
  *   Assign tables. Hand out 2 dice (Red/Blue) and a score sheet to each table.
  *   **Crucial Instruction:** "In this game, 1–6 is a Win. 7–0 is a Loss. That is the rule. It does not change."

  **00:10 – 00:20: Phase 1 Predictions & Lock-In**
  *   Hand out Index Card #1.
  *   **Write Down:**
      1.  Name.
      2.  **Fixed Fraction:** What % of your current pile will you bet every single round? (Must be 10%, 20%, 50%, or 100%). *Tell them they cannot change this for 8 rounds.*
      3.  **Prediction:** How many Points will *you* have at the end?
      4.  **Room Prediction:** What will the *average* Points per person be at the end?
  *   Collect cards. Shuffle them. (This prevents hindsight bias later).

  **00:20 – 00:35: Phase 1 Play (Individual Rolls)**
  *   **Rule:** Everyone rolls their own die every round.
  *   **Pace:** 8 Rounds. Call "Roll" every 90 seconds.
  *   **Action:** Players calculate stake, push chips to center, roll, collect/pay.
  *   **Scribes:** As soon as someone hits 0, they become the Scribe. They verify the winners' counts.
  *   **Whiteboard:** At Round 4 and Round 8, ask each table for their *Sum Total Wealth*. Write it on the board.
  *   *Facilitator Note:* Watch for the 100% bettors. Most will vanish quickly. If one survives, highlight them casually ("Look at Sarah's pile!").

  **00:35 – 00:45: Phase 1 Tally & Transition**
  *   Count final chips.
  *   **The Reveal:** Read a few of the collected predictions aloud. "John predicted he'd have 150. He has 0. Jane predicted the Room Average would be 100. It is actually 400."
  *   **Do not explain why yet.** Just let the dissonance sit.
  *   Reset everyone to 100 Points. (Give new chips to the broke players).

  **00:45 – 00:55: Phase 2 Predictions & Lock-In**
  *   Hand out Index Card #2.
  *   **New Rule:** We are using **Two Dice** (Red and Blue). They are rolled together. They are independent (Red winning doesn't affect Blue).
  *   **Write Down:**
      1.  **Total Fraction:** What % of your pile will you risk total? (e.g., 50%).
      2.  **The Split:** How is it divided? (e.g., 50% on Red, 0% on Blue OR 25% on Red, 25% on Blue).
      3.  **Prediction:** Will you end with more or less than Phase 1?
  *   Collect cards.

  **00:55 – 01:10: Phase 2 Play (Shared Rolls)**
  *   **Rule:** **One person per table rolls the Red and Blue dice for the whole table.** Everyone sees the same result.
  *   **Pace:** 8 Rounds.
  *   **Action:** Players allocate chips to Red zone or Blue zone on the table.
      *   If Red Wins: Red bets double, Blue bets lose.
      *   If Blue Wins: Blue bets double, Red bets lose.
      *   If Both Win: Both double.
      *   If Both Lose: Both lose.
  *   **Scribes:** Again, busted players become Scribes.
  *   **Whiteboard:** Track Table Totals again.

  **01:10 – 01:40: The Debrief (The Core)**
  *   See "Debrief Script" below.

  **01:40 – 01:45: Wrap Up**
  *   Return cards to players.
  *   Symbolic prize (e.g., the "Lucky Die" or a book) to the person with the highest *median* growth, not the highest total.
  *   Dismiss.

  ### Part 4: The Debrief Script

  Do not lecture. Ask questions that force them to articulate the lesson.

  **1. The "Room Average" Illusion (Phase 1)**
  *   **Ask:** "In Phase 1, look at the Room Average on the whiteboard versus what most of you have in your hand."
  *   **Likely Outcome:** The average is high (dragged up by one lucky 100% bettor), but most people have less than 100 points.
  *   **Ask:** "Who here bet 100% of their chips every time?" (Usually 1-3 people). "Who here is broke?"
  *   **The Point:** "The 'Average Wealth' of the room went up, but the 'Typical Person' went broke. If you care about *your* pile, not the room's, the Average is a lie. The game favors the house (the group), but ruins the individual who bets too big."

  **2. The Lucky Fool (Handling the Outlier)**
  *   **Scenario:** One person bet 100% and won big. They will feel vindicated.
  *   **Say:** "You played perfectly for *this* room, *this* night. If we ran this game 100 times, would you survive 100 times?"
  *   **The Point:** "You didn't prove the strategy is safe; you proved you are the 1-in-100 exception. A strategy that requires you to be lucky to survive is a strategy that fails."

  **3. The Power of the Split (Phase 2)**
  *   **Ask:** "In Phase 2, everyone at the table saw the exact same dice. Same luck. But some of you grew, and some of you shrank. Why?"
  *   **Look for:** "Because I split my bet."
  *   **The Point:** "In Phase 1, a 50% bet was dangerous. In Phase 2, a 50% bet (split 25/25) was safe. Why? Because Red and Blue don't lose at the same time as often as one die loses."
  *   **The Harder Truth:** "Who stuck with the 20% they liked in Phase 1, but kept it at 20% total in Phase 2 (10% on Red, 10% on Blue)?"
  *   **Reveal:** "You were too timid. Because you split the risk, you could have safely bet 40% total (20% on each) and grown faster. The 'Right Fraction' isn't a fixed number. It depends on how many independent chances you have."

  ### Part 5: What Will Go Wrong (And How to Fix It)

  **1. Math Anxiety / Calculation Speed**
  *   **Problem:** Players freeze calculating 20% of 13 chips.
  *   **Fix:** Empower the Scribes. "If you are out, your job is to help the survivors calculate." Pre-print a small slip of paper with 10%, 20%, 50% of common numbers (100, 80, 60, 40) for each table.
  *   **Rounding Disputes:** "13 chips, 20% is 2.6."
  *   **Fix:** Enforce the rule strictly at the start. "Nearest whole chip. 2.6 becomes 3. If you have 4 chips, 20% is 1 chip. If you have 2 chips, you bet 1."

  **2. The 100% Bettor Wins Everything**
  *   **Problem:** One person ends with 20,000 points. Everyone else has 0. They dominate the conversation.
  *   **Fix:** During the debrief, focus on the *Scribes*. "We have 4 Scribes at this table and 1 Winner. If this was a retirement plan, who is retired?" Shift the metric from "Who has the most" to "Who is still in the game."

  **3. Phase 2 Feels Like Cheating**
  *   **Problem:** Players feel the Shared Roll removes their agency.
  *   **Fix:** Remind them: "Phase 1 tested if you can beat the odds. Phase 2 tests if you can manage risk *given* the odds. In investing, you can't control the market roll (Shared), you can only control your allocation (Split)."

  **4. Running Out of Time**
  *   **Problem:** Rounds take 2 minutes instead of 1.
  *   **Fix:** Cut Phase 2 to 6 rounds. The trend will still be visible. Do not cut the Debrief.

  ### Part 6: Honest Limitations (For You to Say Aloud)

  At the very end, you must disclose what the game hid. This builds trust.

  1.  **Known Odds:** "In this game, you knew the die was 60/40. In life, we never know the true odds. We guess. And when we guess wrong, we usually guess we are better than we are. That means we accidentally bet the '100%' strategy without knowing it."
  2.  **Time Horizon:** "We played 8 rounds. The math I'm talking about works over hundreds of rounds. Tonight was a snapshot. The lesson isn't that 20% wins every time; it's that 20% keeps you in the game long enough for the math to work."
  3.  **Indivisibility:** "In the game, you could bet 1 chip. In life, opportunities come in lump sums. You can't always bet exactly 20% of your net worth on a house or a business. You have to approximate."

  ### Final Note to Facilitator

  You are not teaching them to gamble. You are teaching them **survival**.
  When they ask, "So what is the number? What percent should I bet?"
  Your answer: "There is no number. There is only the rule: Never bet so much that a string of bad luck takes you out of the game, and if you can spread your risk across independent chances, you can afford to bet more."

  If you can make them feel the relief of the Phase 2 split—the feeling of the dice landing against them but *not* going broke because they were diversified—you will have succeeded.
