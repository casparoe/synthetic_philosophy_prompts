  In a rationalist forum, when this slogan is deployed to shut down argument, the speaker is most likely invoking the **Agent-Relative Constraints** reading while presenting it as the **Categorical Incommensurability** reading. This rhetorical move treats a substantive axiological commitment (that *my* killing is worse than *my* allowing) as if it were a logical truth about reasoning itself, thereby insulating the intuition from consequentialist critique. This reading does not survive careful scrutiny without smuggling in an undefended premise about the moral significance of direct causation or the "naturalness" of inaction; as Parfit demonstrated, the distinction between *doing* and *allowing* often collapses when causal chains are made explicit, leaving the slogan relying on a brute intuition that the group has already agreed requires justification.
