      *   Actually, a simpler mechanism is better for 90 mins. Just a forced binary choice with a justification required.
      *   *Better idea:* The "Vote" isn't just raising hands. It's a resource allocation. They have 10 "Trust Tokens." They must allocate them between the two versions. Whichever gets more is the taught version. This shows nuance (maybe 6-4 split).

  6.  **Drafting the Content (Iterative Process):**
      *   *Intro:* Keep it tight. "You are the Ministry of Education for a new nation."
      *   *Scenarios:* Write them as brief historical briefs.
      *   *Debrief:* This is crucial. Need to reveal the parallels carefully.
      *   *Limitation:* The prompt suggests "multi-generational transmission." I need to articulate *why* a 90-minute workshop can't capture the emotional weight of centuries of storytelling.

  7.  **Predicting Failure Points:**
