      *   **Constraint 4:** Task: Draft a school lesson in two versions (Plain Loss vs. Moral Triumph) and vote on which to teach.
      *   **Constraint 5:** Roles: Scribe, Skeptic, Advocate.
      *   **Constraint 6:** Voting mechanism: Simple point system.
      *   **Constraint 7:** Debrief: Map choices to real cases (Kosovo, Dunkirk, etc.) without naming them *in advance* (reveal during debrief).
