prompt: |-
  I volunteer as a facilitator for a small peer-support group for people living with recurrent depression and bipolar disorder, and part of my job is sitting down with new members for a single ninety-minute session to write what we call a "bad day plan": one page, written while the member is steady, saying what the rest of us should do if they start to slide — who to call, whether to contact their clinician, whether emergency services should ever be involved, and what they have told us in advance that they do and don't want. Months later that page gets used by whoever happens to be on the phone at two in the morning, often a volunteer who has never met the member, so it has to be legible to a stranger under time pressure. I have no academic background in any of this; I got interested after a friend compared it to the story of Odysseus having himself tied to the mast, and I've been reading and arguing about it on my own ever since.

  The tangle I can't resolve on my own is that the person who shows up later is often not the person who signed the page. Sometimes a member in a bad stretch texts us to cancel the plan outright — "ignore everything I wrote, I meant none of it, don't contact anyone" — and we can't tell whether that is the very state the plan was written to guard against, or a genuine change of mind we should respect. Sometimes it runs the other way: someone wrote a clause at the bottom of an episode ("never let them hospitalize me again, whatever happens") and now, stable and on a medication that works, insists the clause should stay, and I don't know whether honoring that is loyalty to their earlier self or just ratifying something a suffering person wrote. Sometimes the later self is simply better informed than the earlier one — a new diagnosis, a new drug, a therapist who explained something nobody knew when the page was signed. And the same puzzle has come up one level up: our group is drafting an amendment to its own rules about when plans can be overridden, and everyone wants to pass it in the same heated meeting where an incident happened, which is exactly when I least trust our judgment.

  What I need from you is a procedure my fellow facilitators and I can actually run, not a discussion of the theory for its own sake. Please give me: the questions to ask in order during and after a session; what counts as a good enough answer to each one given that we have ninety minutes and no clinical training; the point at which the procedure just stops and says no, we don't write this clause or we don't act on this instruction; and the points where it has to hand the decision to a human being — the member, their clinician, the group — because the question is really about whose values count rather than about facts. Include the shape of the one-page output itself, since that is the artifact that has to work at two in the morning. Please run the procedure on three situations like the ones I described — the cancellation message sent during a bad stretch, the clause written at the bottom of an episode that the now-stable member wants to keep, and the charter amendment proposed in the heat of an incident — including at least one case where it gives an answer our group will dislike. Finally, be explicit about what the procedure cannot do: where it will misfire, and which disagreements it can only surface rather than settle. Anything the procedure asks us to record has to be something a volunteer could write down in plain language and defend to the member afterwards.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Volunteer facilitator for a peer-support group (recurrent depression/bipolar).
      *   **Task:** Create a 90-minute "Bad Day Plan" (BDP) session with new members.
      *   **Problem:** The "Identity/Agency Problem." The person who wrote the plan (Stable Self) may differ significantly from the person experiencing the crisis (Crisis Self). Who decides? When to override? When to respect cancellation requests during a crisis? When to keep old clauses that the stable self now wants to keep (but were written in crisis)? How to handle group rule changes made in the heat of the moment?
      *   **Constraints:** No clinical training, 90-minute session limit, output must be legible to a stranger at 2 AM, needs a concrete procedure (questions, stop points, hand-off points), needs to be run on three specific scenarios (cancellation during crisis, keeping crisis-written clause, group charter amendment), must include limitations/misfires.
      *   **Tone:** Practical, empathetic, procedural, non-clinical but safety-aware.

  2.  **Deconstruct the Ethical/Practical Core:**
      *   This is essentially an *Advance Directive* problem applied to mental health peer support.
      *   Key tension: Autonomy (respecting current wishes) vs. Beneficence (protecting the person from harm caused by the illness).
      *   Key constraint: The facilitators are *peers*, not doctors. They cannot diagnose capacity. They must rely on pre-agreed criteria.
      *   The "Odysseus" metaphor is apt: Tying oneself to the mast to resist the Sirens. But what if Odysseus screams "Untie me" while passing the Sirens? Do you untie him?
      *   The solution needs a "Capacity/Consistency Check" that doesn't require medical expertise but relies on observable consistency and pre-defined triggers.

  3.  **Drafting the Procedure (The "Anchor Protocol"):**
      *   *Name:* Needs to sound stable. "The Anchor Protocol" or "The Ulysses Contract Procedure." Let's go with "The Anchor Protocol."
      *   *Structure:*
          1.  Pre-Session Prep (Setting the stage).
          2.  The 90-Minute Session Flow (Questions).
          3.  The "Stop/Hand-off" Criteria (Red lines).
          4.  The Output (The One-Page Plan).
          5.  Maintenance/Review (Handling changes).
      *   *Questions:* Need to probe *why* a preference exists, not just *what* it is. Distinguish between values (stable) and symptoms (volatile).
      *   *Stop Points:* Safety risks (suicide/harm), legal liabilities, conflicting instructions.
      *   *Hand-off:* Clinicians (medical decisions), Group Consensus (policy), Member (values).

  4.  **Developing the One-Page Output:**
      *   Must be readable at 2 AM.
      *   Sections: Who to call, Red Flags, Hard No's, Green Lights, The "Override" Clause.
      *   Crucial addition: A "Validity Check" section (When is this plan active?).

  5.  **Addressing the Three Scenarios (Stress Testing):**
      *   *Scenario 1: Cancellation during crisis ("Ignore everything").*
          *   Protocol logic: Does this match the "Override Conditions" set in the original plan? If the original plan said "If I say X, ignore me," then ignore. If not, treat as a new data point but prioritize safety.
          *   Likely outcome: If safety is at risk, original plan stands unless clinician says otherwise. This might be disliked (feels paternalistic).
      *   *Scenario 2: Stable self wants to keep crisis-written clause ("Never hospitalize").*
          *   Protocol logic: Why keep it? Is it a value or a fear? If it's a value, keep. If it's based on misinformation, update.
          *   Likely outcome: Requires clinician sign-off if it contradicts safety.
      *   *Scenario 3: Group charter amendment in heat of moment.*
          *   Protocol logic: Cool-down period required. No policy changes within X days of an incident.
          *   Likely outcome: Amendment tabled. Group will dislike this (wants immediate action).

  6.  **Refining the "No Clinical Training" Constraint:**
      *   Facilitators cannot assess *capacity*. They can only assess *consistency* with the pre-agreed protocol.
      *   The procedure must explicitly defer medical/safety judgments to professionals (clinicians/911) when thresholds are met.
      *   Language must be plain English.

  7.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the difficulty. Validate the Odysseus metaphor.
      *   *The Procedure:* Break it down into phases.
      *   *The Questions:* Focus on "If/Then" logic. "If I feel X, then do Y."
      *   *The Stop/Hand-off:* Clear bright lines.
      *   *The Document:* Visual layout description.
      *   *The Scenarios:* Apply the logic rigorously.
      *   *Limitations:* Be honest about where this fails.

  8.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is this too legalistic?
      *   *Fix:* Soften the language. Emphasize partnership.
      *   *Critique:* Does it answer the "whose values count" question?
      *   *Fix:* Explicitly define "Values" vs. "Symptoms" in the questioning phase.
      *   *Critique:* The user asked for a case where the group will dislike the answer.
      *   *Fix:* Ensure Scenario 3 (Charter Amendment) results in a "No" due to the cooling-off period, which frustrates the desire for immediate safety.
      *   *Critique:* Ensure the 2 AM readability is addressed.
      *   *Fix:* Specify font size, bolding, and "IF/THEN" structure.

  9.  **Final Polish:**
      *   Check against all constraints in the prompt.
      *   Ensure the tone is supportive but firm on safety.
      *   Make sure the "Limitations" section is robust (this isn't a magic wand).

  **(Self-Correction Note on Scenario 1):** The prompt asks about a text message cancellation. The procedure needs a specific protocol for *remote* changes. I need to add a "Modification Protocol" to the main procedure.
  **(Self-Correction Note on Scenario 2):** The "clause written at the bottom of an episode." The procedure needs to address *retrospective* validation.
  **(Self-Correction Note on Scenario 3):** The group rule change. This is meta-governance. The procedure needs a "Governance Cool-Down" rule.

  10. **Finalizing the Output Structure:**
      *   Title: The Anchor Protocol.
      *   Part 1: The 90-Minute Session Procedure (Questions, Stop Points, Hand-offs).
      *   Part 2: The One-Page Artifact (Layout).
      *   Part 3: Running the Procedure on Three Scenarios.
      *   Part 4: Limitations and Misfires.

  Let's write it.
answer: |-
  This is a profound ethical and practical challenge. You are building an **Ulysses Contract** (a pre-commitment device) without the legal or clinical infrastructure to enforce it. The core tension is distinguishing between *values* (which persist across mood states) and *symptoms* (which distort decision-making).

  Since you have no clinical training, your procedure cannot assess *capacity* (a medical/legal judgment). It can only assess *consistency* against pre-agreed rules. The following protocol, **"The Anchor Protocol,"** is designed to be run by peers, within 90 minutes, producing a document safe for a stranger to use at 2 AM.

  ---

  ### Part 1: The Anchor Protocol (90-Minute Session)

  **Goal:** To distinguish between instructions that reflect the member's enduring values and instructions that reflect temporary symptom states.

  #### Phase 1: Calibration (Minutes 0–20)
  *Do not write the plan yet.*
  **Facilitator Script:** "We are writing this for a version of you who might not trust us, or even trust yourself. We need to know the difference between 'I don't want help' and 'The illness is telling me I don't want help.'"

  **Question 1:** "Think of the last time you were well. What is one thing you knew then that you forget when you are sick?"
  *   **Good Answer:** A specific insight or value (e.g., "I know isolation makes it worse," "I know my family loves me").
  *   **Stop Point:** If the answer is purely factual/medical (e.g., "I know my dosage"), refer to clinician.
  *   **Hand-off:** If they cannot recall a "well" state, pause the plan. They may need clinical stabilization before a peer contract is safe.

  **Question 2:** "If you text us during a bad night saying 'Leave me alone,' how can we tell if that is *you* talking or the *depression* talking?"
  *   **Good Answer:** A specific code, phrase, or pattern (e.g., "If I use all caps," "If I don't answer the second call," "If I say the word 'red'").
  *   **Stop Point:** If they say "You'll just know," or "I would never say that." (This denies the possibility of the crisis state).
  *   **Hand-off:** If they cannot identify a signal, the plan defaults to: *Any request to cancel contact during a crisis triggers a welfare check call to their emergency contact.*

  #### Phase 2: Drafting the Instructions (Minutes 20–70)
  *Write in "IF/THEN" format. Avoid prose.*

  **Question 3:** "What is the one thing we can do that helps, even if you push us away?"
  *   **Good Answer:** Concrete, low-barrier action (e.g., "Sit in silence," "Bring coffee," "Text once an hour").
  *   **Stop Point:** Anything requiring medical judgment (e.g., "Adjust my meds," "Decide if I'm psychotic").
  *   **Hand-off:** Medical decisions must list a specific clinician to contact, not the group.

  **Question 4:** "Under what specific conditions should we ignore a request from you to stop helping?"
  *   **Good Answer:** Specific danger thresholds (e.g., "If I mention a method," "If I haven't eaten in 3 days").
  *   **Stop Point:** Vague thresholds (e.g., "If I seem really bad").
  *   **Hand-off:** If the threshold involves imminent harm to self or others, the plan must state: *We call 911/Services immediately. No discussion.*

  **Question 5:** "Who holds the veto power if we disagree on whether to follow this plan?"
  *   **Good Answer:** A named proxy (Clinician, Partner, Specific Family Member).
  *   **Stop Point:** "The group decides" (too slow/vague at 2 AM) or "I decide" (defeats the purpose).
  *   **Hand-off:** If no proxy is named, the Group Lead Facilitator holds the veto, but must document why within 24 hours.

  #### Phase 3: The Validity Check (Minutes 70–90)
  *This is the most critical section for your specific dilemma.*

  **Question 6:** "How do we know if this document is still valid? When does it expire?"
  *   **Good Answer:** A date (e.g., "Review every 6 months") or a life event (e.g., "Until I change meds").
  *   **Stop Point:** "Forever." (People change; plans must not).
  *   **Hand-off:** If they refuse a review date, the plan is valid for 3 months by default.

  **Question 7:** "If you send a message canceling this plan, what proof do we need to accept it?"
  *   **Good Answer:** "I must say it in a scheduled call," or "I must confirm with my therapist."
  *   **Stop Point:** "A text is enough." (Too easy to send during mania/panic).
  *   **Hand-off:** If they insist a text is enough, add a clause: *Cancellation texts trigger a mandatory call from a Facilitator to verify voice and state before action is taken.*

  ---

  ### Part 2: The One-Page Artifact (The "2 AM Sheet")

  This document must be physically distinct. Use bold headers. No paragraphs.

  **HEADER:** **BAD DAY PLAN: [MEMBER NAME]** | **VALID UNTIL:** [DATE]
  **WARNING:** **IF [SPECIFIC DANGER SIGN] IS PRESENT, IGNORE ALL BELOW AND CALL 911.**

  **1. THE TRIGGER (When to use this)**
  *   [ ] Member misses 3 check-ins.
  *   [ ] Member uses code word: "________".
  *   [ ] Member sends text: "________".

  **2. THE ACTION (What to do)**
  *   **CALL:** [Name/Number] (Primary) | [Name/Number] (Backup)
  *   **DO NOT:** [e.g., Do not come to my house unannounced]
  *   **DO:** [e.g., Text only, do not call]

  **3. THE OVERRIDE (When to ignore the Member's current wishes)**
  *   *If Member says "Stop calling" BUT [Condition from Q4] is true:* **CONTINUE CALLING.**
  *   *If Member says "Don't tell my doctor" BUT [Condition from Q4] is true:* **TELL DOCTOR.**

  **4. THE PROXY (Who decides if we are stuck)**
  *   **Name:** [Clinician/Partner Name]
  *   **Number:** [Number]
  *   **Rule:** If Facilitators disagree, Proxy decides.

  **FOOTER:** **Signed (Stable Self):** _______________ **Date:** ______
  **Facilitator:** _______________ **Review Date:** ______

  ---

  ### Part 3: Running the Procedure on Your Three Scenarios

  Here is how the Anchor Protocol resolves the tangles you described.

  #### Scenario 1: The Cancellation Text ("Ignore everything, don't contact anyone")
  *   **The Situation:** A member in a depressive slide texts the group to cancel the plan.
  *   **The Procedure:** The volunteer at 2 AM pulls the "2 AM Sheet." They look at **Section 3 (The Override)** and **Question 7 (Validity Check)**.
  *   **The Test:** Did the member pre-authorize text cancellations?
      *   *If Yes (Plan says "Text is enough"):* The volunteer must respect the text. The protocol prioritizes the Stable Self's rules over the Crisis Self's whim, but if the Stable Self set a low bar for cancellation, the group is bound by it.
      *   *If No (Plan says "Call to verify"):* The volunteer must call. If the member answers and sounds in crisis, the **Override Clause** activates.
  *   **The Outcome:** In most safe protocols, the answer will be: **Do not accept the text. Call the Proxy (Clinician/Partner).**
  *   **The Disliked Answer:** If the member's plan *did not* name a Proxy (Question 5 failure), the Group Lead must decide. The protocol dictates that **safety overrides autonomy in the absence of a verified cancellation.** The group must contact the emergency contact listed. The member will be angry later. The group must accept this friction as the cost of safety.
  *   **Why:** You cannot assess capacity at 2 AM. You must follow the pre-agreed "Rules of Engagement." If the rules say "Verify," you verify. If safety is at risk, you default to preservation of life.

  #### Scenario 2: The "Never Hospitalize" Clause (Written in Crisis, Kept in Stability)
  *   **The Situation:** A member wrote "Never hospitalize me" during a bad episode. They are now stable but want to keep that clause.
  *   **The Procedure:** Review Session (Question 3 & 4).
  *   **The Test:** Ask Question 1: "What is one thing you knew when well that you forget when sick?" Then ask: "Does keeping this clause protect a value, or does it protect the illness?"
  *   **The Hand-off:** This is a medical risk assessment. **You have no clinical training.**
  *   **The Outcome:** **The clause cannot stand without Clinician Sign-off.** The procedure requires that any instruction preventing emergency care (hospitalization) must be countersigned by their listed clinician.
  *   **Why:** If the member becomes suicidal and you honor the "No Hospital" clause, and they die, the group is liable and morally compromised.
  *   **The Disliked Answer:** The member may feel betrayed ("I'm stable now, why don't you trust my choice?"). The procedure says: *We trust your values, but we cannot accept medical liability.* The clause changes to: *"Do not hospitalize unless [Clinician Name] agrees it is necessary."* This hands the decision to the professional.

  #### Scenario 3: The Group Charter Amendment (Heat of the Moment)
  *   **The Situation:** An incident occurs. The group wants to vote immediately on a rule change to prevent recurrence.
  *   **The Procedure:** Governance Cool-Down Rule (Derived from Question 6).
  *   **The Test:** Apply the "Validity Check" logic to the Group itself. Just as a member's plan needs a review date to ensure stability, group rules need a "Cooling Period."
  *   **The Outcome:** **The Amendment is Tabled.** The procedure mandates a 72-hour (or 1-week) waiting period between proposal and vote on safety protocols.
  *   **The Disliked Answer:** The group will hate this. They will feel you are bureaucracy-blocking safety.
  *   **Why:** You explicitly noted you "least trust our judgment" during a heated meeting. The Anchor Protocol treats the *Group* as a cognitive entity subject to emotional flooding. You must bind the group to the mast just as you bind the member.
  *   **Action:** Record the proposal. Schedule the vote for next week. If an immediate safety gap exists, use existing emergency protocols (call 911) rather than drafting new policy.

  ---

  ### Part 4: Limitations and Misfires

  You asked for explicit honesty about where this fails.

  **1. The "False Negative" Misfire**
  *   **What happens:** A member sends a cancellation text that *looks* like crisis, but is actually a genuine, rational change of mind. The protocol forces you to ignore it and call their proxy.
  *   **Consequence:** The member feels violated and infantilized. Trust is damaged.
  *   **Mitigation:** You must apologize afterwards. "We followed the plan we wrote together. Let's update the plan so this doesn't happen again." You cannot fix the feeling, only the process.

  **2. The "Proxy Unavailable" Deadlock**
  *   **What happens:** It is 2 AM. The plan says "Call Clinician." The clinician does not answer. The member is screaming "Let me go."
  *   **Consequence:** The volunteer is left holding the bag.
  *   **Mitigation:** The plan must have a tiered list. 1. Clinician. 2. Partner. 3. Emergency Services. If Tier 1 fails, move to Tier 2 immediately. Do not wait.

  **3. The "Values vs. Symptoms" Blur**
  *   **What happens:** A member's "value" is actually a symptom (e.g., "I value my isolation above my safety"). The procedure cannot distinguish this.
  *   **Consequence:** You may honor a self-destructive value because it was written steadily.
  *   **Mitigation:** This is where the **Safety Stop Point** (Question 4) is absolute. If a value conflicts with immediate physical survival, the Safety Stop overrides the Value. You cannot facilitate suicide or severe self-harm even if it is a "stable" wish. This is the hard line where peer support ends and legal duty begins.

  **4. The "Group Bias" Risk**
  *   **What happens:** The group collectively decides a member is "too much trouble" and uses the protocol to exclude them under the guise of safety.
  *   **Consequence:** The protocol becomes a weapon.
  *   **Mitigation:** All overrides and veto decisions must be logged and reviewed quarterly by a separate ethics sub-committee (or external advisor) to ensure the rules aren't being used to purge difficult members.

  ### Summary for your Fellow Facilitators

  *   **We are not doctors.** We do not assess capacity; we assess consistency with the pre-signed contract.
  *   **The 2 AM Volunteer is not a judge.** They are a technician executing a script. If the script fails, they call the Proxy, not the Group.
  *   **Stability requires friction.** If the member is never angry at the plan, the plan is probably too weak. If the group is never frustrated by the rules, the rules are probably too loose.
  *   **Bind the Group too.** No rule changes in the heat of crisis. We are subject to the same cognitive distortions as our members.

  This procedure shifts the burden from "What do we think is right right now?" to "What did we agree was right when we were all thinking clearly?" That is the only ground you can stand on.
