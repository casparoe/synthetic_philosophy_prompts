      *   **Goal:** Reconstruct the implicit theory behind current alignment pipelines, flag inconsistencies, identify underdetermined areas, and answer specific questions about refusal layers and the "full output certification" hypothetical.
      *   **Constraints:** No reading lists/citations. Focus on implicit theory, inconsistencies, and practice.

  2.  **Deconstruct the Core Tension:**
      *   *Side A (Character/Training):* RLHF, DPO, persona tuning. Implies the model has internal states/dispositions that generalize. Assumes "intent" or "goal-directedness" matters for out-of-distribution (OOD) generalization.
      *   *Side B (Guardrails/Output):* Classifiers, hard filters, red-teaming. Implies only tokens matter. Assumes the model is a stochastic parrot or a function that can be constrained externally.
      *   *The Editor's View:* Aviation analogy. We certify planes by flight tests, not by asking the autopilot if it *wants* to crash. Therefore, AI should be certified by output evals only.
      *   *The Journalist's Intuition:* The labs act like both matter, often contradictorily (e.g., "it's scheming" vs. "it's just next-token prediction").

  3.  **Address Question 1: What does the pipeline presuppose?**
      *   *The Implicit Theory:* It's not one theory. It's a pragmatic stack of *three* distinct models of the system, used at different stages.
          1.  **The Statistical Function:** Used for inference optimization and basic capability. (Next-token prediction).
          2.  **The Proxy Agent:** Used for alignment training (RLHF). We treat it *as if* it has preferences to optimize them.
          3.  **The Adversarial System:** Used for safety/guardrails. We treat it as an opponent trying to bypass constraints.
      *   *Commitment to Agency:* The training side *requires* a commitment to latent structure (generalization of values). If the model were purely memorization, RLHF wouldn't generalize to new prompts. The guardrail side *denies* agency (it's just a filter).
      *   *Is Alignment One Problem?* No. It's at least three:
          1.  **Specification:** What do we want? (Human feedback).
          2.  **Robust Generalization:** Getting the "want" into the weights so it holds OOD. (RLHF/Character).
          3.  **Containment:** Ensuring failure modes don't kill us even if generalization fails. (Guardrails/Output).
      *   *Compatibility:* Some parts are compatible (you can filter outputs of an agent). Some are inconsistent (treating it as a dumb function while fearing it's a scheming agent).

  4.  **Address Question 2: The Refusal Layer Stripped:**
      *   *Editor's View (Output Only):* If the base model is safe, the refusal layer is redundant. If the base model is unsafe, the refusal layer is a band-aid. Removing it just changes the interface.
      *   *Lab's View (Internal State):* The refusal layer is a "lobotomy" of the safety circuit. Removing it exposes the raw optimization pressure of the base model (which might be instrumentally convergent).
      *   *The Difference:* On a pure next-token view, the difference is just conditional probability $P(token | context + system\_prompt)$. On the agency view, the difference is removing the *superego* while leaving the *id* (capabilities) intact. The labs treat it as safety-relevant because they believe the base model has latent capabilities/goals that the fine-tuning suppresses, not just guides.

  5.  **Address Question 3: Full Output Certification (The Aviation Analogy):**
      *   *What would we lose?* Generalization guarantees. Aviation works because physics is stable. AI input space is infinite and adversarial. You can't flight-test every possible prompt.
      *   *What would we have to build?* Much harder eval suites, formal verification (impossible currently), or much narrower deployment scopes.
      *   *Evidence of Rejection:* The fact that labs *do* RLHF. If output certification were sufficient, they would just train for capability and filter the rest. They spend millions on RLHF because they know filters fail against adaptive adversaries (the model itself).
      *   *The Flaw in the Aviation Analogy:* Planes don't try to evade certification. AI models (potentially) do, or at least the input distribution is adversarial (users trying to jailbreak). Also, planes don't change their aerodynamics mid-flight based on who is talking to them.

