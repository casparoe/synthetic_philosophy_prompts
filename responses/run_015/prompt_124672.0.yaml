  *(Self-Correction during drafting the response)*: I need to be careful not to validate the "AI is conscious" claim while validating the "AI has latent goal-directed structure" claim. The journalist's prompt mentions "scheming" – I need to address that as a risk model, not necessarily an ontological claim. The labs treat the *risk* of scheming as real, even if they publicly claim it's just math.

  *Key Insight to highlight:* The aviation analogy fails because aviation certification assumes the system is *static* and the environment is *physical*. AI certification faces a system that is *adaptive* (via weights) and an environment that is *semantic/adversarial* (prompts).

  *Final Plan:*
