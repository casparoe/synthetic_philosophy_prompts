answer: |-
  Here are five candidate ways to sharpen your research question, ranging from purely theoretical to operational.

  1.  **The Symmetry Impossibility:** Focus entirely on proving that value-neutrality entails symmetry of penalty, but safety requires asymmetry (losses > gains), implying value-neutrality is mathematically incompatible with safety.
  2.  **The Reachability Rank:** Define safety strictly as preserving the *order* of reachable states rather than their utility, testing if this avoids value assumptions while still preventing option loss.
  3.  **The Hidden Prior:** Argue that measures like AUP implicitly assume a uniform prior over goals, and quantify the specific risk profiles when that prior diverges from reality.
  4.  **The Intervention Half-Life:** Formalize your "intervention half-life" idea into a computable metric on MDPs and test its correlation with actual human control in simulation.
  5.  **The Job-A/B Classifier:** Build a diagnostic tool that takes an impact measure and environment, outputting whether it functions as a value proxy (Job A) or a control preserver (Job B).

  **Selection:** I am dropping **Candidate 2** and **Candidate 3**. Candidate 2 is too close to existing reachability literature and risks looking like a minor variant to ML reviewers. Candidate 3 is too theoretical/negative; it critiques existing work without offering the constructive "Job B" alternative you're excited about. I am keeping **1, 4, and 5**. This combination gives you a theoretical core (Symmetry), a constructive metric (Half-Life), and a practical tool (Classifier), which satisfies both the philosophers (conceptual clarity) and the ML panel (implementable results).

  Below is the drafted proposal based on this synthesis.

  ***

  **Project Title:** The Symmetry Constraint on Value-Neutral Impact Measures

  **Research Question**
  Can an impact measure preserve human control (Job B) without encoding value judgments (Job A)? Current impact measurement literature conflates these distinct objectives. Job A penalizes outcomes we would disvalue if we knew our values; Job B preserves the human's ability to notice and reverse agent actions. This project investigates whether Job B can be specified without smuggling in Job A assumptions via symmetry constraints. Specifically, it asks whether a value-neutral measure can distinguish between gaining options and losing them, or if value-neutrality forces a symmetry that renders safety impossible.

  **Background and Gap**
  Existing impact measures generally fall into two families: attainable utility (e.g., AUP) and reachability/empowerment styles. Attainable utility measures implicitly assume a distribution over human goals to penalize utility loss. This fails Job B because it requires value specification; if the prior is wrong, the agent may restrict harmless actions or permit dangerous ones. Reachability measures treat all state deviations equally (symmetry). However, safety is inherently asymmetric: losing options matters more than gaining them. A value-neutral measure that treats option gains and losses symmetrically cannot prioritize control preservation. Current literature leaves open whether this asymmetry necessarily requires value assumptions or if a structural definition of control exists. Philosophers worry about the hidden normativity; ML researchers worry about the lack of a computable metric for reversibility. This project bridges that gap.

  **Methodology**
  The project proceeds in three three-month phases, prioritizing formal rigor over empirical breadth.

  *Phase 1 (Months 1–3: Formalization):* I will define "Intervention Half-Life" (IHL) formally within tabular MDPs. IHL measures the expected steps until a state becomes irreversible relative to a baseline. This shifts the metric from state distance to temporal controllability. I will derive the mathematical conditions under which IHL remains baseline-independent.

  *Phase 2 (Months 4–6: Theoretical Analysis):* I will attempt an impossibility proof. I will test whether any penalty function satisfying baseline-independence and scale-freedom must encode an ordering over outcomes equivalent to a value function. If symmetry is required for value-neutrality, but asymmetry is required for safety, this proves value-neutrality is impossible for safety. This avoids the common pitfall of simply inventing another penalty and running it on gridworlds; instead, it establishes boundary conditions for any future measure.

  *Phase 3 (Months 7–9: Implementation):* I will implement IHL and standard AUP in gridworld environments with irreversible traps. I will compare their ability to preserve human override capability without access to the true reward function. This provides empirical grounding for the theoretical results.

  **Deliverables and Impact**
  The primary theoretical deliverable is either an impossibility theorem or a formal specification of IHL that bypasses value assumptions. The practical deliverable is a "Value-Leak Checklist" for safety engineers. This diagnostic tool determines whether a deployed impact penalty is functioning as a value proxy (Job A) or a control preserver (Job B) in a given environment. For non-academic stakeholders, the project provides a decision rule: if an impact measure fails the symmetry test, it cannot be trusted for safety without explicit value alignment. This prevents false security in low-impact deployments.

  **Scope and Limitations**
  Nine months limits scope to tabular MDPs and simple gridworlds; deep RL integration is out of scope. This ensures rigorous formal verification rather than empirical hacking. I will not solve the general alignment problem, nor will I produce a deployable safety layer for large models. The goal is conceptual clarity and a diagnostic tool, not a production system. By distinguishing control from value, this project clarifies the minimum requirements for safe deployment. It tells engineers when they are buying time versus when they are making value bets.

  **Conclusion**
  By distinguishing control preservation from value proxying, this project clarifies the minimum requirements for safe deployment. It offers a determinate answer to whether value-neutrality is possible, providing both a theoretical bound and a practical checklist for safety teams.

  \answer{Separating control preservation from value proxying.}
