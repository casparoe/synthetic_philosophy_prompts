answer: |-
  # WHO COUNTS? A Demos Boundary Sorter
  **Seminar Handout | Week 4**

  Okay, so we've been talking about the *boundary problem* (who gets to be in the *demos*). Theory names are useful, but sometimes they blur together. Below is a decision tree to help you sort where you (or the author you're reading) actually stand. 

  There are **6 branch points**. Answer them concretely. Don't worry about the theory name yet—just follow the path. At the bottom, you'll land on a named view or an "Unnamed" space (with a note on why nobody really defends that spot).

  ---

  ### THE TREE

  **1. The Resident Test**  
  Should a long-term permanent residant who pays taxes but holds foreign citizenship vote in national elections?  
  → **YES** (Go to 2)  
  → **NO** (Go to 3)

  **2. The Visitor Test** (If Yes to 1)  
  Should a tourist currently in the country vote on laws that directly tax their stay?  
  → **YES** (Go to 4)  
  → **NO** (Go to 4)

  **3. The Expatriate Test** (If No to 1)  
  Should a citizen living abroad for 20+ years vote in home elections?  
  → **YES** (Go to 4)  
  → **NO** (Go to 4)

  **4. The Sanctuary Test**  
  Should non-human animals with sustained social lives (say, sanctuary apes) be represented via guardians?  
  → **YES** (Go to 5)  
  → **NO** (Go to 5)

  **5. The Time-Travel Test**  
  Should future generations get appointed proxies in the present legislature?  
  → **YES** (Go to 6)  
  → **NO** (Go to 6)

  **6. The Fluidity Test**  
  Should the voting boundary change depending on the issue (e.g., climate vs. zoning)?  
  → **YES** (See Leaves A/B)  
  → **NO** (See Leaves C/D/E/F)

  ---

  ### THE LEAVES (Where did you land?)

  **PATH A: Yes → Yes → [Any] → Yes → Yes → Yes**  
  🍂 **All-Affected Interests (Radical/Fluid)**  
  *Everyone impacted gets a say, boundaries shift per issue, includes non-humans and future gens.*

  **PATH B: Yes → No → [Any] → No → No → Yes**  
  🍂 **Stakeholder Democracy (with Future Trustees)**  
  *Stable connection matters, but we owe something to the future. Boundaries usually fixed though.*

  **PATH C: Yes → No → [Any] → No → No → No**  
  🍂 **Stakeholder Democracy / All-Subjected**  
  *If you're subject to the law or have a stable life here, you're in. Tourists and apes are out.*

  **PATH D: No → [Any] → Yes → No → No → No**  
  🍂 **Pure Citizenship (Legalist)**  
  *Membership is strictly about legal status. Residents without passports are out; expats with passports are in.*

  **PATH E: No → [Any] → No → No → No → No**  
  🍂 **Co-nationalism / Democratic Closure**  
  *Membership is about shared identity/culture. Expats lose it, residents never had it.*

  **PATH F: Yes → [Any] → [Any] → Yes → No → No**  
  🍂 **UNNAMED: Ecological Citizenship (Presentist)**  
  *Why this space is empty:* **Incoherent moral weighting.** Hard to justify giving apes votes while ignoring the interests of unborn humans who will inherit the mess.

  **PATH G: No → Yes → [Any] → [Any] → [Any] → [Any]**  
  🍂 **UNNAMED: The Tourist Priority**  
  *Why this space is empty:* **Politically toxic.** Privileging transient outsiders over long-term residents is unsustainable for any stable regime.

  ---

  ### ⚠️ PRACTICAL NOTE ON INDISTINGUISHABILITY

  **Stakeholder Democracy vs. All-Subjected Principle**  
  This tree cant seperate these two on practial grounds. Both usually end up granting rights to residents and denying them to tourists. The difference is theoretical (interest vs. coercion), but the policy output is basically identical. Don't sweat the distinction unless you're doing normative ethics.

  **Fluid AAI vs. Functional Jurisdiction**  
  If you answered **Yes** to Q6, you might be a "All-Affected" theorist, or you might just be a functionalist who thinks climate policy needs a global body while zoning stays local. The tree lumps these together.
