  The real headache here is figuring out whether to call her the driver or just a passenger in her own body when her subconscious is the one actually steering.

  Here's the thing: normally, we say you're doing something on purpose if you've got a goal in mind and you're consciously working toward it—like wanting coffee and believing the café is down the street. But driving is weird because you can do it safely for hours without consciously thinking about the gas or the wheel, relying on these subpersonal routines that run in the background like an autopilot. If we say those routines count as your actions, then she was driving intentionally even while obsessing over her sister. But if we say intentional action needs conscious awareness, then she wasn't really driving at all—her body was just executing code. The line breaks when you ask who's responsible for missing the exit: the conscious mind that was distracted, or the automatic system that failed to ping her attention? It turns agency into a ghostly thing that might not even be home when the car is moving.
