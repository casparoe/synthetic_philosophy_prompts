      *Level of Operation:*
      *   Disease is predicated of the *person* (for coverage), but grounded in the *part* (for biology). The theory must bridge this. It's a requirement, not a choice, because coverage applies to persons, pathology to parts.

      *Killer against BST:* **The Social Etiology Case.** BST focuses on internal function. If the harm is purely social (e.g., racism causing stress), BST calls it "normal reaction to environment," not disease. But we need to cover treatment.
