      *   *Against Biostatistical Theory (Boorse):* The requirement to **distinguish Risk Factor from Disease** (or the Bone Case). BST struggles with latent conditions that don't currently reduce functional ability below statistical norm in a meaningful way, or universal conditions (aging). Actually, the strongest is **Critical Leverage**. BST relies on medical consensus on function. If medicine says X is a function, BST struggles to say medicine is wrong without new biology.
