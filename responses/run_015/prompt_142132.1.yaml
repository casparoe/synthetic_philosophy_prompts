      *   **Constraint:** Skip the full scorecard. Focus on the spec and the tension analysis.

  2.  **Deconstruct the "Job":**
      *   *Job A:* Insurance/Coverage boundary (Treatment vs. Enhancement). This usually demands objectivity to prevent scope creep and cost explosion.
      *   *Job B:* Critical leverage (Medicine can be wrong). This demands a standard *outside* of current medical consensus.
      *   *Tension:* If the standard is purely biological (BST), it's hard to say medicine is wrong about biology. If the standard is purely normative (Normativism), it's hard to limit coverage (since values vary).

  3.  **Drafting the Requirements (The Spec):**
      *   I need to formulate these as functional constraints on a theory of disease.
      *   *Req 1: Asymptomatic Reality.* Must account for hypertension or early cancer. (Biological deviation exists without felt harm).
      *   *Req 2: Universality.* Must handle presbyopia or tooth decay. (If everyone has it, is it a disease?).
