      *   *Argument:* You *can* have value-freedom and critical leverage *if* your biological facts are better than medicine's. But you can't have Value-Freedom and *Coverage Decisions*. Coverage is inherently normative. So the real clash is Value-Freedom vs. The Job Itself (Coverage).
      *   *Wait, re-reading prompt:* "deciding what counts as treatment rather than enhancement... while still being able to turn around and say medicine has classified something as a disease that isn't one."
      *   Okay, so the theory must support *two* normative moves: 1. Pay for this (not that). 2. Stop calling this a disease.
      *   If the theory is value-free, it can't dictate "Pay for this."
      *   If the theory is purely normative, it can't dictate "Stop calling this a disease" (because if society values curing it, it's a disease).
      *   So the incompatibility is **Value-Freedom** vs. **Normative Authority**. You can't be value-free and tell people what to pay for.

      *Let's look at the "Unfriendly Cases":*
      *   *Sickle Cell:* Genetic, harmful in some env, helpful in others.
