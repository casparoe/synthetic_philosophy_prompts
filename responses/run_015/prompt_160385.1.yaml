prompt: |-
  I work on cost-benefit analysis for a government agency (econ background, basically no philosophy) and I keep running into something that feels like a contradiction in what we actually do. I'd like to know what we're committed to by doing it.

  Here's the practice. When we appraise a project we monetise everything. For stuff with markets we back the numbers out of behaviour: the value of a statistical life comes from the extra pay workers demand to take risky jobs, the value of clean air from what people pay for houses in less polluted neighbourhoods. For stuff with no market — a wetland, a species, a view — we can't do that, so we run surveys: describe the good carefully, remind people of their budget, then ask how much they'd pay in extra taxes to protect it, yes/no referendum style. Two more bits. First, we throw some answers out: people who are obviously answering strategically, people who are expressing a general warm feeling about the environment rather than about the specific good, people who name a number they plainly couldn't afford. Second, we use willingness to pay rather than willingness to accept compensation for the loss, even though for small changes those are supposed to come to roughly the same thing — and we prefer the one that gives the smaller number.

  So here's what puzzles me. The line I was taught is that utility isn't a thing inside your head, it's just a summary of your choices: nothing over and above what behaviour reveals. But the survey half of what we do behaves as if utility were a hidden quantity that behaviour and survey answers are both noisy evidence for, which is why we can clean the noise out, discard the answers that dont track it, and calibrate surveys against market behaviour. And then we discard some behaviour too: we dont count choices made in ignorance or under panic, and we'd never build an appraisal out of lab results showing people choose differently between two equivalent framings of the same gamble.

  So: what does the practice, taken as a whole, actually presuppose utility to be? Is it strictly committed to one answer, or could several different theories of what utility means license exactly the same thing we do? I'd like you to separate what the practice strictly presupposes from what it merely fits comfortably with, and to say where it's genuinely underdetermined.

  Two follow-ups if you have room.

  A colleague has proposed fixing the mess by routing every non-market valuation through a citizens' assembly: small group, gets briefing materials, hears both sides, deliberates for a weekend, and only its post-deliberation vote counts as the preference. Call it laundering. What does that proposal presuppose about preferences and about utility that the current method doesn't, and would it make the package more coherent or just add a second inconsistent layer on top?

  And the bit that bugs me most: willingness to pay scales with ability to pay, so benefits to poor people come out smaller and benefits to rich people come out larger. We do nothing about that in environmental appraisal, but in the health side of the same government the equivalent calculation counts a health gain the same whoever gets it. Is that an inconsistency the practice cant survive, or does it just show that willingness to pay is doing something other than measuring utility — standing in for opportunity cost in money terms, say? And what would have to change in the appraisal if we took the rival reading seriously?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **User Profile:** Government economist, cost-benefit analysis (CBA) practitioner, econ background, minimal philosophy.
      *   **Core Problem:** Perceived contradiction in CBA practice regarding the nature of "utility" and "preference."
      *   **The Practice:**
          1.  Monetize everything.
          2.  Market goods: Revealed preference (hedonic pricing, wage differentials).
          3.  Non-market goods: Stated preference (Contingent Valuation Method - CVM), survey-based WTP.
          4.  Data Cleaning: Discard strategic answers, "warm glow" answers, unaffordable answers.
          5.  WTP vs. WTA: Use WTP (usually lower) over WTA, despite theoretical equivalence for small changes.
      *   **The Tension:**
          *   Standard Econ Theory: Utility = Revealed Preference (behavior is all that matters, no mental state).
          *   CBA Practice: Treats utility as a latent variable (truth) that both behavior and surveys *approximate*. We filter "noise" (bad surveys, panic, ignorance, framing effects) to find the "true" value.
      *   **The Question:** What does the practice *strictly presuppose* about utility? Is it committed to one theory, or underdetermined? Distinguish strict presuppositions from comfortable fits.
      *   **Follow-up A (Citizens' Assembly):** "Laundering" preferences through deliberation. What does this presuppose? Does it fix coherence or add inconsistency?
      *   **Follow-up B (Distribution/Equity):** WTP scales with income (rich value things more). Health side treats QALYs equally regardless of income. Is this a fatal inconsistency? Does WTP measure utility or opportunity cost? What changes if we switch readings?

  2.  **Analyze the Core Tension (Revealed Preference vs. Mentalist/Constructivist):**

      *   *Standard Neoclassical View (Samuelson):* Preference is defined by choice. $A \succ B$ iff $A$ is chosen over $B$. No room for "mistakes" unless constraints change.
      *   *CBA Practice:* We reject choices (panic, ignorance) and survey responses (strategic, warm glow). This implies there is a "True Preference" distinct from the "Observed Choice/Statement."
      *   *Implication:* The practice is *not* strictly committed to Revealed Preference Theory (RPT). It behaves more like a *Mentalist* or *Constructivist* view where utility is a welfare metric that choices *should* track but often fail to due to error/bias.
      *   *Underdetermination:* The practice fits "Informed Preference Satisfaction" (IPS) theories best. It could also fit a "Decision Utility" vs. "Experienced Utility" distinction (Kahneman). It is *inconsistent* with strict Behaviorism/RPT.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. It's a classic philosophical critique (Hausman, McPherson, Sen) but rarely admitted by practitioners.
      *   **Part 1: What is Utility in CBA? (Strict Presuppositions vs. Comfortable Fits)**
          *   *Strict Presupposition:* Utility is a *normative* measure of welfare, not just a descriptive summary of choice. There is a "True Value" distinct from "Observed Data."
          *   *Rejection of RPT:* By discarding "irrational" choices (panic, framing) and "bad" survey answers, you admit choices can be wrong.
          *   *The Latent Variable Model:* You treat WTP (market and survey) as *indicators* of underlying welfare, not the definition of it.
          *   *Underdetermination:* You aren't committed to *hedonism* (pleasure) vs. *desire satisfaction*. You just need "informed, stable, self-regarding preference."
      *   **Part 2: Follow-up A (Citizens' Assembly)**
          *   *What it adds:* Shifts from "Consumer Sovereignty" (individual wants) to "Deliberative Democracy" (public good/reasoned judgment).
          *   *Presupposition:* Preferences are endogenous and malleable. True value is found in reflection, not impulse.
          *   *Coherence:* It actually *increases* coherence with the "filtering" practice (why filter surveys if not to get closer to reasoned value?). But it breaks the "individual sovereignty" norm of standard welfare econ. It moves from WTP to "Worthiness."
      *   **Part 3: Follow-up B (Distribution/Equity)**
          *   *The Issue:* WTP $\propto$ Income. Health CBA (QALYs) $\perp$ Income.
          *   *Is it fatal?* No, but it reveals WTP is a measure of *economic weight*, not just *welfare gain*.
          *   *Opportunity Cost Reading:* WTP measures resource claim, not happiness.
          *   *Fixing it:* Distributional weights. If you take the "welfare" reading seriously, you must weight dollars by marginal utility of income (give more weight to poor people's dollars). If you take the "efficiency" reading, you keep it as is but admit it's not pure welfare.
          *   *Health vs. Env:* Health uses "human capital" or "equal value of life" norms. Env uses "efficiency." The inconsistency is political, not logical, but ethically shaky.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction on WTP/WTA:* The user notes WTP is preferred because it gives smaller numbers. I should mention the "Endowment Effect" explanation but acknowledge the pragmatic budget constraint reason.
      *   *Philosophy Check:* Ensure I don't get too bogged down in utilitarianism vs. libertarianism. Stick to *welfare economics* philosophy (Sen, Hausman).
      *   *Tone:* Professional, peer-to-peer (econ to econ), but philosophically precise. Avoid jargon where possible, or define it.
      *   *Key Distinction:* "Decision Utility" (what drives choice) vs. "Experienced Utility" (welfare). CBA tries to approximate the latter using the former, hence the cleaning.

  5.  **Final Polish:**

      *   Structure clearly with headings.
      *   Address the "Strictly Committed" vs. "Underdetermined" prompt directly.
      *   Ensure the Citizens' Assembly and Equity sections answer the specific "what changes" questions.

  6.  *(Self-Correction during drafting)*: I need to be careful about the "utility isn't a thing inside your head" claim. That's the *behaviorist* stance. The user says they were taught that, but their *practice* contradicts it. I need to validate that contradiction. The practice presupposes *Realism* about welfare, not *Instrumentalism*.

      *   *Key Insight:* The practice presupposes **Informed Preference Satisfaction**. It assumes there is a preference the agent *would* have if rational, informed, and calm. This is a counterfactual theory of utility, not an actual choice theory.

      *   *Equity:* The health vs. environment split is a classic "sectoral silo" problem. The philosophical fix is distributional weighting. The practical fix is usually ignoring it. I need to explain *why* ignoring it is theoretically defensible (Kaldor-Hicks) but ethically vulnerable.

  7.  **Final Review against constraints:**
      *   Separate strict presuppositions from comfortable fits.
      *   Address underdetermination.
      *   Address Citizens' Assembly.
      *   Address Equity/WTP scaling.

      *(Proceed to generate output based on these thoughts.)*
answer: |-
  This is an exceptionally sharp diagnosis of the philosophical fault lines in cost-benefit analysis (CBA). You have identified the gap between the *methodological behaviorism* you were taught in graduate school (utility = revealed preference) and the *psychological realism* your agency actually practices (utility = a latent welfare state that choices imperfectly track).

  Here is an analysis of what your practice presupposes, followed by the two follow-ups.

  ### 1. What does the practice presuppose utility to be?

  **The Strict Presupposition: Informed Preference Satisfaction (IPS)**
  Your practice is strictly incompatible with the strict Revealed Preference Theory (RPT) associated with Samuelson. RPT holds that choice *defines* preference; therefore, a choice cannot be "wrong" unless constraints are misidentified. By discarding choices made in panic, ignorance, or framing traps, and by discarding survey responses that are "strategic" or "unaffordable," you are asserting that **actual choices are noisy measures of a underlying 'true' preference.**

  Therefore, your practice is strictly committed to a **counterfactual theory of utility**. You are not measuring what people *do* value; you are estimating what they *would* value if they were:
  1.  Fully informed (hence discarding ignorance).
  2.  Cognitively stable (hence discarding panic/framing).
  3.  Budget-constrained but sincere (hence discarding unaffordable survey bids).

  In philosophy of economics, this is known as **Informed Preference Satisfaction**. Utility is not the choice itself; it is the satisfaction of the preference an agent *would* hold under idealized epistemic and psychological conditions.

  **What is Underdetermined?**
  While you are committed to IPS, the practice is underdetermined regarding *what makes those preferences good*.
  *   **Hedonism vs. Desire:** You do not need to commit to whether satisfying the preference actually makes the person happier (hedonism) or whether the satisfaction of the desire is the good itself (desire theory). Your cleaning rules work for both.
  *   **Self-Interest vs. Altruism:** You mention discarding "general warm feelings." This suggests a commitment to *self-regarding* preferences for the purpose of the analysis. However, you could theoretically include altruistic preferences if they were specific and consistent. The practice doesn't strictly rule out altruism, but it operationally filters for "private good" valuation to avoid double-counting.

  **The WTP/WTA Asymmetry**
  Your preference for Willingness To Pay (WTP) over Willingness To Accept (WTA) is the smoking gun that you are not doing pure welfare economics. In standard theory, for small changes, they converge. In practice, WTA is usually much higher due to loss aversion (endowment effect).
  *   **Strict Presupposition:** By choosing the lower number (WTP), you presuppose that **efficiency trumps entitlement.** You are implicitly treating the status quo as the baseline endowment, but refusing to compensate fully for its loss. This is a political commitment to Kaldor-Hicks efficiency (potential compensation) rather than Pareto improvement (actual compensation). It presupposes utility is a resource to be maximized, not a right to be protected.

  **Summary:** You are not committed to utility being a "mental state" per se, but you are committed to it being a **normative benchmark** that exists independently of observed behavior. You treat behavior as data, not definition.

  ---

  ### 2. Follow-up A: The Citizens' Assembly ("Laundering")

  Your colleague's proposal to use a deliberative citizens' assembly shifts the philosophical ground significantly.

  **What it Presupposes**
  Current CBA presupposes **Consumer Sovereignty**: the individual is the best judge of their own interest, provided they are informed and calm. The Citizens' Assembly presupposes **Deliberative Democracy**: preferences are endogenous and malleable, and the "true" public value is found not in aggregating existing wants, but in constructing judgments through reason and debate.

  It presupposes that:
  1.  **Preferences are not fixed:** They can be improved through deliberation.
  2.  **Public Good ≠ Sum of Private Goods:** A wetland might have a value to the "public" that exceeds the sum of individual WTPs (existence value that individuals don't fully grasp until deliberation).
  3.  **Competence:** A small, briefed group is more competent to value complex public goods than the aggregate market or survey population.

  **Coherence or Inconsistency?**
  Paradoxically, this proposal makes the package **more coherent** with your existing data-cleaning practices, but **less coherent** with standard welfare economics.
  *   **More Coherent:** You already discard survey responses that are "ill-informed" or "strategic." A citizens' assembly is simply the extreme version of this cleaning process. It institutionalizes the "informed" and "calm" conditions you already try to simulate via survey design. It admits that raw behavior is too noisy to measure public value.
  *   **Less Coherent:** It breaks the link to *individual welfare*. Standard CBA is justified because it purportedly maximizes the sum of individual utilities. If a citizens' assembly decides a wetland is worth $100M, but the individuals living next to it would only pay $10M, whose utility is being counted? The assembly's judgment is a *political* valuation, not an *economic* welfare metric.

  **Verdict:** It solves the "noise" problem by admitting utility is a public construct, not a private discovery. However, it transforms CBA from a welfare tool into a technocratic-political tool. It is more philosophically honest about the "cleaning" you already do, but it abandons the pretense of measuring individual utility.

  ---

  ### 3. Follow-up B: Distribution, Equity, and the Health/Environment Split

  This is the most critical tension. WTP scales with income; QALYs (in health) typically do not.

  **Is it a Fatal Inconsistency?**
  Logically, no. Ethically, yes.
  *   **The Economic Defense:** CBA is a measure of **efficiency**, not equity. WTP measures the *intensity of preference weighted by ability to pay*. It answers: "How much of the economy's resources should be devoted to this?" Since the rich control more resources, their preferences pull harder on the allocation. The health sector's use of equal QALY weights is a specific equity constraint imposed by policy, not a feature of the underlying valuation metric (often health valuations also use income-weighted VSL, though less explicitly).
  *   **The Inconsistency:** If the goal of government is to maximize *social welfare*, and the marginal utility of income is diminishing (a dollar gives more welfare to a poor person than a rich person), then unweighted WTP is a biased measure of welfare. It overweights the welfare of the rich.

  **What is WTP Measuring?**
  You asked if WTP is measuring utility or opportunity cost.
  *   **Current Practice:** It treats WTP as a proxy for **Benefit (Utility)**.
  *   **Rival Reading:** WTP is a measure of **Claim Strength (Opportunity Cost)**. It measures how hard an agent can pull on the common resource pool.

  **What Would Have to Change?**
  If you took the "WTP measures welfare" reading seriously, you would have to apply **Distributional Weights**.
  1.  **The Change:** You would divide the WTP of every individual by the marginal utility of income at their income level (or apply a weight $\alpha$ where $\alpha > 1$ for the poor).
  2.  **The Result:** A wetland protecting a poor neighborhood would generate a higher *weighted* benefit than the same wetland protecting a rich neighborhood, even if the rich neighbors bid higher nominal dollars.
  3.  **The Obstacle:** This requires the agency to make explicit interpersonal comparisons of utility and equity judgments, which economists are trained to avoid (the "scientism" shield).

  **Why Health is Different:**
  Health appraisal often uses a "human capital" or "egalitarian" framework because health is viewed as a *primary good* (Rawls) necessary for agency itself, whereas environmental views are often treated as *amenities*.
  *   **To Survive:** Your practice survives this inconsistency only by compartmentalizing. You treat Environment as an **Efficiency Problem** (maximize total wealth/value) and Health as a **Rights Problem** (equal access to care).
  *   **To Fix:** You must either (a) apply distributional weights to environmental CBA to match health's equity stance, or (b) admit that environmental CBA is not measuring welfare, but rather **potential fiscal surplus**, and accept that it will systematically disadvantage the poor.

  ### Summary of Commitments

  1.  **Utility:** You are committed to **Informed Preference Satisfaction**, not Revealed Preference. You believe in a "true" preference that behavior obscures.
  2.  **Citizens' Assembly:** This would increase methodological coherence (better filtering of "true" preferences) but shift the justification from **welfare aggregation** to **deliberative judgment**.
  3.  **Equity:** The WTP/Income link shows you are measuring **resource claims**, not pure welfare. To align with health policy, you must introduce **distributional weights**, which forces you to abandon the pretense of value-free efficiency analysis.

  Your practice is not philosophically naive; it is philosophically *eclectic*. It borrows the authority of behaviorism ("we just count choices") while employing the methods of mentalism ("but we fix the choices that are wrong"). The contradiction you feel is the friction between those two lenses.
