answer: |-
  Your instincts are spot on, and that summary you read is a classic case of a popularizer smoothing over the philosophical wrinkles until the argument loses its actual shape. While it captures the general mood of Scheffler's work, specifically his Tanner Lectures published as Death and the Afterlife, it gets several key details wrong and makes a normative leap that Scheffler himself is much more cautious about. The biggest error is in the setup of the thought experiments, which actually matters a great deal for what the argument proves. The summary says Scheffler asks us to imagine humanity is wiped out in thirty days. That is not the scenario. Scheffler asks us to imagine that we will live out a normal lifespan, but that the earth will be destroyed thirty days after our own death. This distinction is crucial because the point of the conjecture is to isolate our concern for the future from our own survival. If everyone died in thirty days, you would be facing your own imminent death, and your despair could just be about your own end. By pushing the extinction to just after your death, Scheffler shows that we care about the collective afterlife even when it doesn't benefit us personally. The infertility scenario is closer to what the summary describes, where the current generation is the last, but even there, the point is to test whether we value projects that will outlast us and our children, not just whether we feel sad about the end.

  Once you fix the setup, the claim about meaning also needs tuning. The summary says everything would stop mattering and there would be no point to any of it. Scheffler is more precise than that. He argues that we would lose confidence in the value of our activities. It is not necessarily that love or justice would become objectively worthless, but that our ability to sustain the belief in their importance relies on the assumption that humanity will continue. He uses the analogy of rolling a ball up a hill knowing it will roll back down immediately; the activity isn't impossible, but it feels pointless because the conditions for its significance are missing. So, a careful reader would say our valuing is afterlife-dependent, meaning the existence of future people is a precondition for us to feel that our current projects are worthwhile. The summary gets the gist of this but presents it as a total nullification of value rather than a undermining of our confidence in value.

  The most problematic part of the summary, and where your skepticism is most warranted, is the conclusion about a moral obligation. The newsletter claims that because meaning depends on future generations, we are obligated to keep humanity going forever. Scheffler does argue that the afterlife conjecture has normative implications, suggesting we have strong reasons to care about the future and perhaps duties to ensure there is one, but he does not argue for a duty to ensure humanity survives forever. That is a significant overreach. His point is descriptive and conceptual first: he is mapping the structure of our values to show they are more social and future-oriented than we typically admit. While he suggests this should change how we weigh the interests of future people in things like climate policy, jumping from we care about the future to we must ensure infinite survival is a slide many philosophers would reject. A defender of Scheffler would push back hardest on the word forever, noting that we need a sufficiently long future to sustain our projects, but an infinite timeline is not required for the afterlife conjecture to hold true.

  Finally, regarding the interchangeability of the two cases, a careful reader would note they are designed to test slightly different things. The doomsday scenario tests our concern for humanity after our own death, while the infertility scenario tests our concern for humanity after the death of everyone we know. They converge on the same conclusion, which is that we care about the collective afterlife, but they are not perfectly interchangeable tools. The summary treats them as identical levers pulling the same result, which is mostly fine for a quick overview, but it glosses over the specific work each scenario is doing to rule out alternative explanations, like the idea that we only care about the future because we hope our own genes or memories survive. Scheffler uses the two cases together to show that our concern is for humanity itself, not just our personal legacy.

  So, if you were to explain the better version to someone, you would say that Scheffler argues our current values are structurally dependent on the expectation of a human future, and that realizing extinction was imminent would undermine our confidence in those values even if we died before the end. A defender would emphasize that this reveals the social nature of meaning, rather than issuing a commandment for eternal survival. The summary you read turns a phenomenological observation about how we value things into a utilitarian prescription for immortality, which is not what Scheffler is doing. He wants us to recognize that we are already invested in the future, and that this investment should inform our ethics, but he stops short of saying we are obligated to prevent extinction at all costs for the sake of meaning alone. The harm of extinction, in his view, is not just the deaths involved but the collapse of the framework that gives our lives significance, yet deriving a strict duty from that requires more philosophical heavy lifting than the summary allows.
