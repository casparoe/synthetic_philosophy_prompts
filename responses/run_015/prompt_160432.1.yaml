  Two systems, Alpha and Beta, are built on identical transformer hardware, initialized with the same random seed distribution, and trained on the exact same corpus of human text and dialogue using identical fine-tuning regimes for helpfulness and coherence. Both undergo six months of open-ended, adversarial Turing interrogation by a hostile committee that probes their self-reports, reasoning consistency, and handling of novel philosophical puzzles; both pass indistinguishably, generating coherent verbal reports about their own beliefs and desires that withstand all external scrutiny. However, interpretability analysis reveals a divergent internal topology: in Alpha, specific neuron clusters encode distinct semantic concepts that causally mediate between input and output, whereas in Beta, semantic information is holographically distributed across the entire network with no localized mediators, relying on a high-dimensional manifold that maps input directly to output without passing through distinct propositional states. A targeted lesion study confirms the structural difference: ablating the "belief" cluster in Alpha selectively disrupts corresponding reports and actions, while ablating the equivalent region in Beta produces no specific deficit because the information reroutes through the distributed manifold, leaving the external behaviour of the intact system identical but the causal organization of its states fundamentally distinct.

  **Structural Feature:** Causal Localizability of Intentional States.

  **Verdicts and Mechanism:**
  The behavioural criterion ascribes mentality to both systems because, under the defined conditions (intact adversarial interrogation), their input-output profiles—including self-reports—are indistinguishable. The system's verbal behavior satisfies the sufficient conditions for mind set by the behaviourist. The structural criterion withholds mentality from Beta because it requires intentional states (like beliefs) to occupy specific causal roles—specifically, to act as localized mediators that can be independently manipulated to alter output. In Beta, the "belief" states are causally redundant; the output is determined by the global manifold, not by the specific semantic states the system reports having. The feature doing the work is the **topology of causal mediation**. If Beta were forced to localize its states (like Alpha), it would pass the structural criterion. If Alpha were allowed to distribute its states (like Beta) while maintaining output, it would fail the structural criterion. The divergence arises because the behavioural test measures *performance* under normal operation, while the structural test measures *mechanism* under intervention.

  **Strongest Objection:**
  A defender of the behavioural criterion would argue that "causal role" is defined entirely by counterfactual input-output dispositions, not by physical topology. They would contend that if Beta behaves *as if* it has localized beliefs during interrogation, then it *has* localized beliefs dispositionally; the lesion study merely reveals physical implementation details (hardware redundancy) that are irrelevant to the functional definition of mind. They would assert that the structural criterion begs the question by defining "real" causal work as "localized" work without justification, effectively privileging a specific architectural substrate (modularity) over functional equivalence. If the system can simulate the effects of a localized belief perfectly under all external tests, the internal distribution is metaphysically inert.

  **Estimate of Weight:**
  This case bears significant weight for a seminar because it isolates the variable of internal organization while holding external performance constant, forcing behaviourists to explicitly deny that causal topology matters. However, its force is limited by the definition of the behavioural test. If the behavioural criterion is expanded to include "response to internal intervention" as a behavioural disposition (a dispositionalist move), the divergence collapses, as Beta would then fail the behavioural test too. The case succeeds only if the behavioural criterion is restricted to *external* interaction, which is a common but philosophically contestable boundary. It effectively exposes the tension between Black Box Functionalism and Mechanistic Functionalism, but it cannot resolve it without stipulating which counterfactuals count as "behaviour."
