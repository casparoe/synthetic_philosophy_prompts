prompt: |-
  ok so I've been going back and forth on this for months and I want a spec before I read anything else. the idea is the old Marxist one that the economic "base" of a society — who owns the stuff that gets produced, how production is organized — really drives the "superstructure": the laws, the politics, the culture, the ideas people have about themselves. I keep seeing people defend it and people tear it apart, and I can't tell if it's even a well-formed claim or just a slogan.

  so: what would a theory that says the base explains the superstructure actually have to deliver to count as doing real explanatory work, not just retelling the story after the fact? give me the requirements list and for each one the case or consideration behind it — why it's a requirement and not just a preference of one camp.

  I'm thinking it has to handle specific historical cases (why the industrial revolution took off in England and not, say, China; why the USSR fell apart when it did), but I'm not sure those are the right test cases — flag if I'm picking the wrong ones.

  it also has to be clear about what "explains" means, because I think three claims get collapsed into one: that the base is the *cause* of the superstructure, that it's *necessary* for it, and that the base is somehow built out of the superstructure — you can't even identify the base without the legal and conceptual categories that come from the superstructure. I think that third one is where the view gets in trouble, because "means of production" and "property" are themselves legal categories, so the base seems to be defined by the very thing it's supposed to explain. is that a real objection or am I just attacking a weaker version of it?

  and it has to be consistent with the fact that two societies with pretty much the same economic structure can end up with very different laws and cultures.

  for each requirement say whether it's non-negotiable or just a preference of one side. if some subset of the list can't all be met at once — like if "must be able to predict, not just fill in the story after the fact" and "must not be circular" can't both hold — say so, because I think that's the part that would actually settle the debate for me. and tell me which single requirement knocks out the most versions of the view.

  don't score Marx or anyone else against the list, I'll do that myself. just the list, the reasoning behind each item, and the tension points.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user wants a specification list (requirements) for a theory of Historical Materialism (Base/Superstructure) to count as "real explanatory work" rather than just a slogan or post-hoc storytelling.
      *   **Context:** They've been debating this internally for months. They see defenses and critiques but can't tell if the claim is well-formed.
      *   **Specific Concerns:**
          *   Needs to handle specific historical cases (England vs. China, USSR collapse). Are these the right tests?
          *   Needs to clarify "explanation" (causation vs. necessity vs. circularity).
          *   Specific objection: The "Circularity/Definition" problem (Base concepts like "property" rely on Superstructure legal categories).
          *   Needs to account for variation (same economy, different cultures).
          *   **Crucial Constraint:** Do *not* score Marx or anyone else against the list. Just the list, the reasoning, and the tension points.
          *   **Crucial Constraint:** Identify non-negotiable vs. preference.
          *   **Crucial Constraint:** Identify incompatibilities (if meeting X makes Y impossible).
          *   **Crucial Constraint:** Identify the "killer requirement" (which one knocks out the most versions).

  2.  **Deconstruct the Philosophical Problem:**
      *   The Base/Superstructure model is a metaphor from Marx's 1859 *Preface*. It's notoriously vague.
      *   The core philosophical challenge is *determination*. Does the base *determine* the superstructure? If so, how? (Mechanically? Statistically? Functionally?)
      *   The "Circularity" objection (Cohen, Elster, etc.) is a major analytical Marxist critique. If "capital" requires "property rights," and "property rights" are legal (superstructural), then the base isn't independent.
      *   The "Autonomy" problem: If the superstructure has relative autonomy, how much determination is left?
      *   The "Prediction" problem: Social science rarely predicts like physics. Is prediction a fair requirement?

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Independence/Non-Circularity.* The user raised this. The base must be definable without referencing the superstructure. If "private property" is the base, but "property" is a legal concept, we have a problem.
      *   *Req 2: Causal Mechanism.* It can't just be correlation. There needs to be a *how*.
      *   *Req 3: Explanatory Scope/Variance.* It needs to explain why things *change* (revolution) and why things *stay the same* (stability). It also needs to handle the user's point about similar economies having different cultures (equifinality/multifinality).
      *   *Req 4: Predictive/Counterfactual Power.* The user wants to avoid "retelling the story after the fact." This means the theory must constrain what *could* have happened.
      *   *Req 5: Historical Specificity.* The user mentioned England vs. China. The theory needs to work across different contexts, not just 19th-century Europe.

  4.  **Refining the Requirements (Addressing Constraints):**

      *   *Constraint Check:* Must label Non-Negotiable vs. Preference.
      *   *Constraint Check:* Must identify tensions/incompatibilities.
      *   *Constraint Check:* Must identify the "Killer Requirement."

      *   *Refinement on Circularity:* This is arguably the strongest philosophical objection. If the base is defined by legal relations, the direction of explanation collapses. This should be Non-Negotiable for a *causal* theory.
      *   *Refinement on Prediction:* Strict prediction is often impossible in complex systems. Maybe "Counterfactual Constraint" is better. If the base changes, the superstructure *must* change in way X. If it doesn't, the theory is falsified.
      *   *Refinement on Variation:* The user noted similar economies $\neq$ similar cultures. A hard determinist model fails here. A "constraint" model might pass. This is a tension point.

  5.  **Developing the Tension Points:**
      *   *Tension 1: Precision vs. Scope.* To avoid circularity, you define the base narrowly (technology/physics). But then it explains less. To explain more, you include social relations, but then it becomes circular.
      *   *Tension 2: Determinism vs. Variation.* If the base *determines* the superstructure, similar bases should yield similar superstructures. History shows they don't. To fix this, theorists add "relative autonomy," but that weakens the explanatory power of the base.
      *   *Tension 3: Prediction vs. Complexity.* Demanding hard prediction might be unfair for social science, but without it, it's just storytelling.

  6.  **Selecting the "Killer Requirement":**
      *   The Circularity/Independence requirement is the one that breaks the most versions. If you can't define the base without the superstructure, the causal arrow dissolves. This is the Analytical Marxist critique (G.A. Cohen etc.).

  7.  **Addressing the User's Test Cases:**
      *   England vs. China: Good for "why here and not there."
      *   USSR Fall: Good for "internal contradiction."
      *   Verdict: They are valid, but the theory needs to handle *micro* variance too (why two factories have different cultures).

  8.  **Final Review against User Prompt:**
      *   Did I score Marx? No.
      *   Did I give the list? Yes.
      *   Did I explain the reasoning? Yes.
      *   Did I mark Non-Negotiable vs. Preference? Yes.
      *   Did I identify incompatibilities? Yes.
      *   Did I identify the killer requirement? Yes.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the depth of the question.
      *   *Req 1: Ontological Independence (The Circularity Check).* Non-negotiable.
      *   *Req 2: Causal Mechanism (The "How").* Non-negotiable.
      *   *Req 3: Constraint on Variation (The "Same Base, Diff Culture" problem).* Non-negotiable.
      *   *Req 4: Counterfactual Constraint (The "Post-hoc" check).* Preference/Debatable.
      *   *Tensions:* The "Autonomy vs. Determination" trade-off. The "Definition vs. Power" trade-off.
      *   *Killer:* Ontological Independence.

  10. **Polishing:** Ensure the tone is analytical, neutral, and rigorous. Avoid jargon where possible, or define it. Make sure the distinction between "cause," "necessary condition," and "definition" is clear as per the user's prompt. (Self-Correction: Make sure to explicitly address the user's point about "property" being a legal category).

  11. **Final Polish:** Check against the "don't score Marx" rule. I must remain meta-theoretical.

  *(Self-Correction during drafting)*: I need to be careful with the "Prediction" requirement. In philosophy of social science, "prediction" is often considered too high a bar compared to "explanation." I should frame it as "Ex Ante Constraint" rather than "Nostradamus-style Prediction."

  *(Self-Correction on Test Cases)*: The user asked if England/China/USSR are the right tests. I should answer that briefly in the intro or within the requirements. They are macro-tests. The theory also needs micro-tests. I'll add that nuance.

  *(Final Plan)*:
  1. Intro acknowledging the sophistication of the query.
  2. The Specification List (5 items).
  3. The Tension Matrix (Incompatibilities).
  4. The Killer Requirement.
  5. Brief note on Test Cases.
  6. Conclusion.

