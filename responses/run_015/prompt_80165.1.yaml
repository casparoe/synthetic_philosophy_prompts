answer: |-
  This is a rigorous request. You are asking for the *conditions of adequacy* for a causal theory of social structure, specifically one claiming priority of the economic over the political/ideological.

  Below is the specification list. I have categorized each requirement as **Non-Negotiable** (if this fails, the theory is logically incoherent or empirically empty) or **Preference** (debateable depending on what kind of theory you want). Following the list, I have mapped the tension points where these requirements conflict, and identified the "killer" requirement.

  ### The Specification List

  #### 1. Ontological Independence (The Non-Circularity Condition)
  *   **Requirement:** The "Base" must be definable and identifiable without referencing the "Superstructure."
  *   **Reasoning:** This addresses your objection about property rights. If the Base is defined by "ownership," and "ownership" is a legal (Superstructural) concept, then the Base cannot causally precede the Superstructure. For the Base to be the *explanans* (the thing doing the explaining), it must be the *explanandum* (the thing being explained) independent of the legal framework. It usually requires defining the Base in terms of technical relations (who touches what machines) or material flows, rather than social/legal relations.
  *   **Status:** **Non-Negotiable.** Without this, the claim is a tautology, not a causal theory.

  #### 2. Mechanism Specification (The "How" Condition)
  *   **Requirement:** The theory must specify the transmission mechanism by which the Base influences the Superstructure.
  *   **Reasoning:** "Explanation" is not just correlation. The theory must articulate the pathway. Is it through class interest? (Owners lobby for laws). Is it through functional necessity? (Laws evolve because they help the economy survive). Is it through cognitive constraint? (Factory work changes how people think about time, which changes culture). Without a mechanism, the theory is a "black box" that invites post-hoc storytelling.
  *   **Status:** **Non-Negotiable.** A causal claim without a mechanism is a superstition.

  #### 3. Constraint on Variation (The "Same Base, Different Superstructure" Condition)
  *   **Requirement:** The theory must account for why societies with similar Bases have different Superstructures, without abandoning the claim that the Base is primary.
  *   **Reasoning:** As you noted, 19th-century England and 19th-century Japan had industrializing economies but vastly different political cultures. If the Base *determines* the Superstructure, this shouldn't happen. The theory must clarify if the Base *selects* from a range of possible Superstructures (compatibility) or *dictates* a specific one (determinism). If it allows "anything goes," the Base explains nothing.
  *   **Status:** **Non-Negotiable.** If the theory cannot explain variance, it is falsified by historical record.

  #### 4. Ex Ante Constraint (The "No Post-Hoc" Condition)
  *   **Requirement:** The theory must rule out specific historical outcomes *before* they happen. It must be possible to imagine a scenario where the Base is X, but the Superstructure is Y, and the theory says "Impossible."
  *   **Reasoning:** This addresses your fear of "retelling the story after the fact." If the theory can explain *any* outcome (e.g., "The USSR fell because of economic stagnation" but also "The USSR survived because of economic mobilization"), it explains nothing. It must place bets on what *cannot* occur.
  *   **Status:** **Preference.** (See Tension Point #2). Strict prediction is rare in social science, but *constraint* is necessary for scientific status.

  #### 5. Reflexive Stability (The "Feedback Loop" Condition)
  *   **Requirement:** The theory must explain how the Superstructure stabilizes the Base without becoming the primary cause.
  *   **Reasoning:** You acknowledged that laws protect property. A viable theory must admit that the Superstructure acts back on the Base (feedback) without conceding that the Superstructure is the *driver*. It needs to distinguish between *maintenance* (Superstructure keeps Base running) and *genesis* (Base creates Superstructure).
  *   **Status:** **Non-Negotiable.** Ignoring feedback makes the theory historically naive; conceding too much to feedback dissolves the Base's priority.

  ---

  ### The Tension Points (Incompatibilities)

  Here is where the theory risks breaking. You suspected that "Prediction" and "Non-Circularity" might conflict. They do, but not in the way you might think.

  **Tension 1: Independence vs. Explanatory Power**
  *   **The Conflict:** To satisfy **Req 1 (Independence)**, you must define the Base in purely material/technical terms (e.g., "steam engines," "calorie intake"). However, purely technical facts rarely dictate specific laws or cultures. To satisfy **Req 3 (Variation)** and **Req 4 (Constraint)**, you need the Base to be socially robust (e.g., "capitalist relations"). But as soon as you make the Base socially robust, you violate **Req 1** because "capitalist relations" imply legal contracts (Superstructure).
  *   **The Trade-off:** The more independent the Base is, the less it explains. The more it explains, the less independent it is.

  **Tension 2: Determinism vs. Variation**
  *   **The Conflict:** To satisfy **Req 4 (Ex Ante Constraint)**, the link between Base and Superstructure must be tight. If the link is tight, **Req 3 (Variation)** becomes impossible to satisfy (similar Bases *must* yield similar Superstructures). To allow for Variation (England vs. Japan), theorists introduce "Relative Autonomy" of the Superstructure.
  *   **The Trade-off:** If you grant the Superstructure enough autonomy to explain historical variance, you weaken the Base's causal priority to the point where it is no longer the "driver."

  **Tension 3: Mechanism vs. Functionalism**
  *   **The Conflict:** Many versions of this theory rely on **Functional Explanation** (e.g., "The law exists *because* it stabilizes the economy"). This satisfies **Req 5 (Stability)** easily. However, Functionalism often violates **Req 2 (Mechanism)** because it doesn't explain *how* the economy conjures the law without an intentional actor. It assumes the outcome explains the cause.
  *   **The Trade-off:** You can have a theory that explains stability well (Functionalism) or one that explains causation well (Methodological Individualism), but holding both simultaneously is notoriously difficult.

  ---

  ### The "Killer" Requirement

  **Ontological Independence (Req 1)** is the requirement that knocks out the most versions of the view.

  **Why:**
  Most intuitive versions of Historical Materialism define the Base as "The Economic Structure of Society," which includes "Property Relations."
  *   If "Property" is part of the Base, the theory collapses. Property is a legal right. Law is Superstructure. Therefore, the Base is made of Superstructure. The causal arrow becomes a circle.
  *   To save the theory, you must strip "Property" out of the Base and leave only "Possession" or "Technical Control."
  *   **The Consequence:** Once you strip legal categories out of the Base, the Base becomes a description of technology and physical labor. It becomes very hard to argue that "steam technology" *causes* "liberal democracy" without smuggling legal concepts back in.

  This is the specific objection you raised ("means of production... are themselves legal categories"). It is not a weak objection; it is the central problem of Analytical Marxism (e.g., G.A. Cohen's work). If a theory cannot clear this hurdle, it is not a causal theory; it is a descriptive metaphor.

  ---

  ### A Note on Your Test Cases

  You asked if England/China and the USSR are the right test cases.

  *   **England vs. China (The Divergence Test):** This is a **strong** test case for **Req 3 (Variation)**. Why did similar proto-industrial conditions lead to capitalism in one and not the other? A valid theory must identify the specific Base variable that differed, not just say "culture."
  *   **The USSR (The Collapse Test):** This is a **weak** test case for **Req 4 (Prediction)** unless the theory predicted the collapse *before* 1989 based on economic metrics alone. If the theory explains the collapse only after seeing the economic stagnation, it risks post-hoc rationalization.
  *   **Missing Test Case:** You need a **Micro-Test**. Does the Base/Superstructure model hold within a single society over a short period? (e.g., Did the shift to remote work [Base] change labor laws or family structures [Superstructure] in a predictable way?) Macro-historical cases are too noisy to isolate variables.

  ### Summary of the Trap

  The debate usually stalls because defenders and critics are optimizing for different requirements.
  *   **Defenders** optimize for **Req 5 (Stability)** and **Req 3 (Variation)** by making the theory flexible (Relative Autonomy).
  *   **Critics** attack **Req 1 (Independence)** and **Req 4 (Constraint)**, showing the theory is either circular or too vague to be falsified.

  To count as "real explanatory work," the theory must prioritize **Req 1** and **Req 4** even if it makes the theory less flexible. If it cannot do that, it remains a heuristic (a useful way of looking) rather than a theory (a claim about how the world works).
