  1.  **Analyze the User's Dilemma:**
      *   **The Situation:** The user has a friend who is "relentlessly good" (volunteers, donates, vegan, etc.). She is warm, not sanctimonious, but her life is entirely consumed by moral imperatives.
      *   **The User's Reaction:** Feels exhausted, inadequate, avoids her, feels guilty.
      *   **The Mutual Friend's Diagnosis:** You're just uncomfortable because she exposes your mediocrity; you should admire and emulate her.
      *   **The User's Intuition:** Something feels off. It's not just envy/inadequacy. Her life seems *narrow*. She lacks non-moral hobbies (novels, sports, dancing), laughs less. The user questions if this is a "good human life," even if it's a "good moral life."
      *   **The Question:** Is there a philosophical/psychological case that a single-mindedly moral life is unappealing/flawed, or is the user just rationalizing complacency?

  2.  **Initial Assessment & Philosophical Framing:**
      *   This is a classic philosophical problem. It touches on virtue ethics, supererogation, the concept of "sainthood," and the balance between moral duty and personal integrity/happiness.
      *   Key philosophers/thoughts that come to mind:
          *   **Bernard Williams:** "Integrity and the moral life." The idea that morality shouldn't demand we abandon our "ground projects" that make us who we are.
          *   **Susan Wolf:** "Moral Saints." This is the *exact* essay needed here. Wolf argues that a moral saint (someone who maximizes moral goodness at all times) would be lacking in other human virtues (wit, humor, aesthetic appreciation).
          *   **Michael Stocker:** "The Schizophrenia of Modern Ethical Theories." The idea that acting *only* from duty misses the value of acting from love/friendship.
          *   **Aristotle:** Eudaimonia (flourishing) requires a balance, not just moral rectitude.
          *   **Supererogation:** Actions that are good but not required. Is she treating the supererogatory as obligatory?

  3.  **Drafting the Response - Structure:**
