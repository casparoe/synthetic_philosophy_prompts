answer: |-
  You are describing a classic philosophical problem, and your intuition is shared by some of the most significant ethical thinkers of the last century. You are not merely rationalizing complacency; there is a robust philosophical case to be made that a life devoted *single-mindedly* to moral goodness is not necessarily the ideal human life.

  The mutual friend who told you that you are simply facing your own "moral mediocrity" is offering a simplification. While it is true that encountering high virtue can trigger feelings of inadequacy, your observation about the *narrowness* of your friend's life points to a deeper tension between morality and human flourishing.

  Here is the case for why your unease is philosophically justified, drawing on several key arguments.

  ### 1. The Argument from "Moral Saints"
  The philosopher Susan Wolf wrote a famous essay titled *"Moral Saints"* (1982) that addresses your exact situation. She asks: What would a person look like if they were as morally good as possible? Her conclusion is that a "moral saint" would be unappealing.

  Wolf argues that to be a moral saint, one must prioritize moral value above all other values. This means sacrificing non-moral virtues and interests. A moral saint might not develop a keen sense of humor, because humor often relies on irony, sarcasm, or trivialities that don't serve the greater good. They might not appreciate art, sports, or gourmet food unless these things can be justified morally (e.g., "this novel teaches empathy").

  Wolf writes: *"The moral saint, the person who devotes his life to being as moral as possible, is likely to be a boring person... or a person whose life is strangely barren."*

  Your observation that your friend "laughs less" and doesn't read novels unless they are "edifying" fits Wolf's description perfectly. A life without "frivolous" joys lacks a certain richness that makes us fully human. You are sensing that she is sacrificing *humanity* on the altar of *morality*.

  ### 2. The Integrity Objection
  The philosopher Bernard Williams argued that morality, when it becomes too demanding, attacks our "integrity." By integrity, he meant the projects, relationships, and passions that ground our identity—what he called "ground projects."

  If morality demands that we treat every moment as an opportunity to do good, we are forced to view our own lives from an impersonal, external standpoint. We stop living *our* lives and start living as a vessel for utility. Williams argued that it is legitimate to have commitments (like writing poetry, supporting a specific sports team, or loving a particular person) that cannot be fully justified by universal moral calculus.

  If your friend has no hobbies that aren't "morally improving," she has effectively surrendered her personal integrity to the moral demand. Watching her can feel exhausting because she is living a life of constant, unrelenting obligation, even if she frames it as choice. You are reacting to the absence of *play* in her life. Play is not just relaxation; it is a fundamental mode of human freedom. A life without play is a life without true leisure.

  ### 3. The Problem of "One-Dimensional" Goodness
  There is a distinction between being a **good person** and being a **moral saint**.
  *   A **good person** fulfills their moral obligations, treats others with kindness, and contributes to society, while also maintaining a rich personal life.
  *   A **moral saint** treats moral obligations as the *only* thing that matters.

  The problem with the saint is that they can become one-dimensional. In literature and life, the most interesting and deeply loving people are often those who have a wide range of passions. Their love for humanity is enriched by their love for specific, seemingly trivial things.

  Furthermore, there is a risk of what the philosopher Michael Stocker called "moral schizophrenia." This occurs when the *reason* for an action (duty) is separated from the *motive* (love/friendship). If your friend reads to the blind primarily because it is "required," there is a coldness to it, even if she is warm in demeanor. You may be sensing that her interactions, while kind, are instrumentalized. She isn't just hanging out with you; she is potentially assessing how to be "good" around you. This creates a subtle pressure that leads to the exhaustion you feel.

  ### 4. The Insatiability of Moral Demand
  Morality is insatiable. There is *always* more good to do. There is always another dollar to donate, another hour to volunteer, another injustice to fight.

  By treating the supererogatory (actions that are good but not required) as obligatory, your friend has signed up for a life where she can never truly rest. Being around someone who is effectively "on the clock" 24/7 is draining because it implicitly invites you to clock in, too. Your avoidance of her is a self-protective mechanism against an infinite demand. It is not necessarily cowardice; it is a boundary.

  ### 5. Acknowledging the Complacency
  However, to be fair to your mutual friend's critique: Yes, there is likely an element of defensiveness in your reaction.
  *   **The Mirror Effect:** Even if her life is narrow, her dedication does highlight a lack of dedication in your own. It is uncomfortable to be reminded that we could be doing more.
  *   **The Rationalization Trap:** It is easy to say "her life is too narrow" when what we really mean is "I don't want to work that hard." We often dress up our laziness as philosophical wisdom.

  But acknowledging this doesn't invalidate your critique. You can admit, *"I am not as generous as she is, and that is a flaw in me,"* while simultaneously holding, *"Her life is imbalanced, and that is a flaw in her conception of the good life."* Both can be true.

  ### Conclusion
  You do not need to choose between admiring her and rejecting her lifestyle. You can admire her generosity and warmth while rejecting the **monomania** of her existence.

  Aristotle argued that the goal of life is *eudaimonia* (flourishing), which requires a balance of virtues. Courage, temperance, wit, and friendship are all virtues. If moral rectitude crowds out wit and friendship, the balance is lost.

  You are right to feel that a life without dancing, without "useless" novels, and without laughter is not a complete human life. You can love your friend and wish her well without wanting to inhabit her world. In fact, preserving your own "non-moral" life might be the best way to ensure that if you do help others, you do so as a whole, joyful human being rather than a depleted instrument of duty.

  **The Verdict:** You are not just rationalizing complacency. You are recognizing that morality is one value among many, and that a life which consumes all others in its name is, paradoxically, less human.
