prompt: |-
  I'm on the advisory board for a mid-sized natural history museum, and we're stuck on the new permanent gallery covering the Late Bronze Age, the Classic Maya, and Rapa Nui. Our curators have come out hard against our working title — "Collapse" — saying it's factually wrong in all three cases and that it tells fifty thousand visitors a year that these people failed, when what actually happened is that settlements shifted, political systems got smaller and less centralized, the language and a lot of the religion carried on, and in one of the three cases the population crash came after Europeans showed up. Our education staff say the word is the reason anyone will buy a ticket and that it carries exactly the warning we want people to leave with. Two complications: the foundation that gave us the money has the word written into the gallery title in the gift agreement, and one board member has floated a compromise — keep the word, add a question mark, and put a live tally on the exit wall where visitors vote on whether each society collapsed.

  I also don't think the three cases are even alike: my impression is that our Aegean material looks much more like a genuine break than the Maya material does, so a single verdict for all three seems wrong to me.

  Draft me the one-page opinion I'll circulate before Tuesday's vote. It should say what we should actually do — keep the word, drop it, or something else — with a date by which the label copy has to be locked, and it has to take the curators' objection seriously rather than treating it as marketing fallout. One thing I'd like settled for me: are we arguing about how the word works, about what the word means, or about whether a museum ought to be delivering warnings at all? Because which one it is definately changes what we should do.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Advisory Board Member of a mid-sized natural history museum.
      *   **Audience:** Other Board Members, Director, Curators, Education Staff (circulated before Tuesday's vote).
      *   **Topic:** The title of a new permanent gallery ("Collapse") covering Late Bronze Age, Classic Maya, and Rapa Nui.
      *   **Conflict:** Curators say "Collapse" is factually wrong/harmful (implies failure, ignores continuity, Rapa Nui crash was post-contact). Education says it drives ticket sales and delivers a "warning."
      *   **Constraints:** Foundation gift agreement *requires* the word in the title. One board member suggested a compromise ("Collapse?" + exit poll).
      *   **User's Insight:** The three cases aren't alike (Aegean looks more like a break than Maya).
      *   **Key Question to Settle:** Are we arguing about *how the word works* (marketing), *what the word means* (scholarship), or *whether a museum should deliver warnings* (mission/ethics)?
      *   **Deliverable:** A one-page opinion/memo.
      *   **Requirements:** State a clear recommendation (keep, drop, or other), set a deadline for label copy, take curators' objections seriously (not just marketing), and address the key question.

  2.  **Deconstruct the Core Issues:**
      *   **Scholarship vs. Marketing:** Curators represent accuracy/nuance. Education represents engagement/hooks. The truth is likely in the middle, but accuracy cannot be sacrificed for a hook in a *permanent* gallery.
      *   **The "Collapse" Narrative:** It's an outdated historiographical framework (popularized by Tainter, Diamond) that modern archaeology largely rejects or nuances heavily. It implies teleological failure.
      *   **The Gift Agreement:** This is a legal/financial constraint. The word *must* appear in the title. This limits the "Drop it" option unless we renegotiate (risky/time-consuming).
      *   **The Compromise ("Collapse?"):** Adding a question mark is a classic curatorial hedge. It invites inquiry. The exit poll is gimmicky but engages the education goal.
      *   **The User's Insight:** The cases are different. A single verdict is bad history.
      *   **The Meta-Question:** Is this about semantics, marketing, or mission? It's actually about *mission*. A natural history museum's mission is education based on evidence, not alarmism.

  3.  **Determine the Recommendation:**
      *   *Drop it entirely?* Violates the gift agreement. Bad move financially.
      *   *Keep it as is ("Collapse")?* Validates outdated scholarship, alienates curators, misleads visitors.
      *   *The "Collapse?" Compromise?* Satisfies the gift agreement (the word is there), satisfies curators (interrogates the concept), satisfies education (provokes thought/debate).
      *   *Refinement:* The exit poll is a bit cheap for a permanent gallery. Better to integrate the debate *into* the gallery.
      *   *Decision:* Support the "Collapse?" title but reject the gimmicky exit poll in favor of integrated interpretive text that addresses the complexity. This honors the curators' expertise while meeting the foundation's requirement.

  4.  **Address the Meta-Question:**
      *   The user asks: "Are we arguing about how the word works, about what the word means, or about whether a museum ought to be delivering warnings at all?"
      *   *Answer:* It's primarily about *what the word means* (scholarship), which dictates *whether we should deliver warnings* (mission). Marketing ("how it works") is secondary. If the science is wrong, the warning is false.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (Tuesday's vote) and the stakes (reputation, accuracy, funding).
      *   **The Core Question:** Address the user's specific request to settle the nature of the argument. (It's about meaning and mission, not just marketing).
      *   **Analysis of the Cases:** Acknowledge the user's insight (Aegean vs. Maya vs. Rapa Nui). One size doesn't fit all.
      *   **The Constraint:** Acknowledge the Foundation agreement. We can't delete the word.
      *   **Recommendation:** "Collapse?" (with context). Reject the exit poll (too reductive).
      *   **Deadline:** Need a realistic date for label copy. Usually, 4-6 weeks before installation/opening. Let's say 3 months out to be safe for a permanent gallery.
      *   **Tone:** Professional, decisive, respectful of both curators and educators, fiscally responsible.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Collapse?" enough to satisfy the Foundation? Usually, yes, as long as the word is prominent.
      *   *Critique:* Is the exit poll *that* bad? It reinforces the idea that there *is* a binary answer to vote on. Better to explain *why* it's debated. I should advise against the poll.
      *   *Critique:* Make sure I don't sound like I'm bullying the Education staff. Acknowledge their need for engagement but argue that *nuance* is engaging too.
      *   *Critique:* Ensure I explicitly answer the "what are we arguing about" question.

  7.  **Final Polish:** Check length (one page). Ensure the deadline is specific. Ensure the recommendation is clear.

      *(Self-Correction on Deadline)*: I don't know the museum's specific schedule. I should phrase it as "Label copy must be locked by [Date + 3 weeks from now]" or advise the Director to set it. Better to give a specific placeholder date to show decisiveness, e.g., "October 15th." Or, more professionally, "Six weeks prior to fabrication." Let's go with a specific date placeholder to make it actionable.

      *(Refining the "What are we arguing about" section)*: This needs to be the anchor. If we argue about marketing, we win tickets but lose integrity. If we argue about meaning, we realize "Collapse" is scientifically contested. If we argue about mission, we realize our job is evidence-based education, not alarmism.

  8.  **Final Review against constraints:**
      *   One page? (Keep it tight).
      *   Recommendation clear? (Yes).
      *   Deadline included? (Yes).
      *   Curators taken seriously? (Yes).
      *   Meta-question answered? (Yes).

  9.  **Drafting the Content:** (Proceeding to generate output based on these thoughts).

      *   *Subject:* Advisory Board Opinion: Late Bronze/Maya/Rapa Nui Gallery Title.
      *   *Opening:* Tuesday's vote requires clarity.
      *   *The Nature of the Dispute:* It's not marketing vs. science. It's about the definition of "Collapse."
      *   *The Cases:* They are distinct.
      *   *The Constraint:* Foundation requires the word.
      *   *The Solution:* "Collapse?" + Interpretive nuance. No exit poll (too simplistic).
      *   *Deadline:* 6 weeks from today.

      *(Wait, one more thing)*: The prompt asks me to draft the opinion *for the user* to circulate. So it needs to be in their voice.

      *(Final check on the "Exit Poll")*: The prompt says a board member *floated* it. I should advise against it in the memo. It reduces complex history to a Yelp review.

      *(Final check on the Foundation)*: If the gift agreement says "The Gallery shall be titled 'Collapse'", adding a question mark *might* need legal review. I should add a caveat to check with legal/foundation liaison. But for the sake of the memo's argument, I'll assume "Collapse?" satisfies the spirit while protecting the science.

      *(Let's write it.)*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Advisors, Director, Curatorial & Education Teams
  **FROM:** [Your Name], Advisory Board
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation Regarding Permanent Gallery Title

  In preparation for Tuesday's vote, I am circulating this position paper to clarify the stakes regarding the new gallery title. We are constrained by the Foundation's gift agreement, which mandates the word "Collapse" appear in the title. However, we are not constrained to use it uncritically.

  **The Core Dispute**
  We must settle what this argument is actually about. Is it about *marketing* (how the word works), *scholarship* (what the word means), or *mission* (whether we deliver warnings)?

  It is primarily about **scholarship**, which dictates our **mission**. Marketing is secondary. If the scientific consensus is that "Collapse" is a misleading framework for these specific cultures, using it as a definitive statement violates our educational mission. A warning based on contested history is not education; it is alarmism. The Curators' objection is not semantic; it is evidentiary. The Late Bronze Age, Classic Maya, and Rapa Nui represent distinct trajectories. To impose a single verdict of "failure" on all three ignores continuity in language, religion, and population that survived political shifts. In the case of Rapa Nui, the demographic crash was largely post-contact. A singular label erases this nuance.

  **Recommendation**
  I propose we adopt the compromise title **"Collapse?"** (with the question mark prominent in the logo and main signage).

  1.  **Compliance:** This satisfies the Foundation's gift agreement by retaining the required keyword.
  2.  **Accuracy:** The punctuation signals inquiry rather than conclusion, validating the Curators' research without sanitizing the theme.
  3.  **Engagement:** This meets Education's goal of provoking visitor thought without resorting to gimmickry.

  **Regarding the Exit Poll**
  I cannot support the proposed live tally/vote on the exit wall. Reducing complex archaeological debates to a binary "Yes/No" vote reinforces the very misconception we are trying to complicate. It suggests there is a correct answer to be voted on, rather than a historical conversation to be understood. Instead, I recommend the Education team develop an interactive display *within* the gallery that allows visitors to weigh the evidence for transformation versus dissolution themselves.

  **Next Steps & Deadline**
  We cannot allow this debate to delay fabrication.
  *   **Decision:** Board vote this Tuesday to approve "Collapse?" as the working title.
  *   **Label Copy:** All interpretive text addressing the "Collapse" framework must be locked by **November 21st**. This allows time for legal review of the gift agreement language and fabrication prep.

  We have an opportunity to turn a constraint into a teaching moment. By questioning the title, we teach visitors to question historical narratives. That is a warning worth delivering.

  I look forward to finalizing this on Tuesday.
