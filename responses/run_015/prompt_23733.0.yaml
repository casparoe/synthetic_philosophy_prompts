answer: |-
  This is a fantastic topic for a reading group. You are touching on a debate in moral philosophy often framed around **"Standing to Blame."**

  The core tension you identified is between the **Non-Hypocrisy Condition** (you can't blame if you violate the same norm) and the **Perfection Problem** (if violating a norm removes standing, no imperfect human can ever blame anyone).

  Here are three key implications for public moral criticism, specifically tailored to your politician example and the "moral expert" worry, along with some discussion questions.

  ### 1. The Scope of Standing: Domain-Specific vs. General Integrity
  Your politician example (caught in Scandal A, lecturing on Issue B) tests whether standing is **norm-specific** or **agent-specific**.

  *   **The Implication:** If standing is *agent-specific* (committing *any* wrong ruins your moral authority), public discourse collapses. No one could criticize war crimes if they've ever lied on their taxes.
  *   **The Philosophical Dodge:** Most contemporary accounts (e.g., Fritz & Miller) argue standing is **norm-specific**. A politician who cheats on their spouse violates the norm of *fidelity*, so they lose standing to blame others for infidelity. However, they retain standing to blame others for *corruption* or *violence*, provided they haven't violated those specific norms.
  *   **Public Criticism Nuance:** However, in the public sphere, there is a secondary implication: **Epistemic Credibility.** Even if the politician retains the *moral standing* to criticize Issue B, their violation of Norm A signals a lack of *commitment to moral norms generally*. The implication here is that in public life, hypocrisy doesn't necessarily make the blame *false*, but it makes the blamer an unreliable witness to the value of the norm.

  ### 2. Dodging the "Moral Expert" Trap (The Perfection Problem)
  You asked if this view leads to a world where no one has standing. This is the strongest objection to the "Hypocrisy Removes Standing" view. If I've ever sped, can I blame you for speeding?

  *   **The Implication:** If we adopt a strict view, moral criticism becomes the exclusive domain of saints or sociopaths (who don't admit guilt). This creates a "Moral Silence" where wrongs go unchallenged because everyone is complicit.
  *   **The Philosophical Dodge:** The solution lies in distinguishing between **Violation** and **Disavowal**.
      *   You do not lose standing simply by *committing* a wrong.
      *   You lose standing if you commit a wrong while **claiming exemption** from the norm.
      *   *Example:* A recovering alcoholic has standing to blame a friend for drinking if they acknowledge, "This is wrong, I struggle with it, and I shouldn't have done it either." They lose standing if they say, "You shouldn't drink, but *I* am special, so I can."
  *   **For Public Criticism:** This implies that politicians (or critics) can maintain standing despite past scandals if they practice **acknowledged fallibility**. The moment they claim moral superiority rather than moral commitment, they lose standing.

  ### 3. The Function of Blame: Correction vs. Expression
  Why do we blame in public? Is it to change the wrongdoer, or to reaffirm the value to the community?

  *   **The Implication:** If the goal of public criticism is **correction** (getting the wrongdoer to stop), hypocritical blame is often ineffective (the "do as I say, not as I do" problem).
  *   **The Twist:** If the goal is **expressive** (society marking a boundary), the hypocrite's blame might still serve a function. Even a corrupt politician voting for an anti-corruption bill reinforces the norm that corruption is bad, even if they are a hypocrite.
  *   **The Risk:** The danger is **Norm Erosion**. If public moral criticism is constantly delivered by hypocrites, the public may begin to view the *norms themselves* as mere weapons for power struggles rather than genuine values. This leads to cynicism where "everything is politics" and nothing is moral.

  ### Summary for your Group
  To dodge the "Moral Expert" problem, your group might consider shifting the criterion from **Purity** to **Sincerity**.
  *   **Purity View:** You must not have done X to blame X. (Leads to silence).
  *   **Sincerity View:** You must believe X is wrong and apply to you, even if you failed. (Allows for imperfect criticism).

  ### Discussion Questions to Spark Debate
  1.  **The "Clean Hands" Paradox:** If a politician is morally perfect but completely ineffective, and another is morally flawed but gets good laws passed, who has more "standing" to lead moral discourse? Is standing about *authority* or *effectiveness*?
  2.  **Complicity:** Does funding a system that causes harm (e.g., buying fast fashion) remove your standing to blame a corporation for pollution, even if you didn't directly pollute? Where do we draw the line on "committing the same kind of wrong"?
  3.  **The Redemption Arc:** If a politician had a scandal 20 years ago, apologized, and changed, do they regain standing? Or is the loss of standing permanent like a criminal record?

  **Recommended Reading Snippet:**
  If you want a specific reference, look up **R. Jay Wallace's** work on standing, or more recently **Kyle Fritz and Daniel Miller's** "Hypocrisy and the Standing to Blame." They argue precisely that hypocrisy undermines the equality of authority required to blame.
