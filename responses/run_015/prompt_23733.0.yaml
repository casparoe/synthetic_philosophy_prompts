      *   *The Hypocrisy Objection:* Hypocrites lack standing to blame because they violate the norm of equality/reciprocity.
      *   *The Scope:* Does the wrong have to be the *same* wrong? Or just a violation of the same *principle*?
      *   *The "Unrelated Issue" Twist:* The user asks about a politician caught in *one* scandal lecturing on a *totally unrelated* issue. This is crucial. Does hypocrisy transfer across domains?

