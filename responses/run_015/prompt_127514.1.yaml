answer: |-
  I. Joint Preamble

  This document records the outcome of a structured collaboration between two research programmes regarding intergenerational justice and climate policy. We did not attempt to resolve our foundational metaphysical disagreements concerning the nature of value, the moral status of future persons, or the ultimate justification of social choice. Instead, we attempted to identify a set of policy-relevant claims and institutional mechanisms upon which both programmes can converge, despite divergent justifications. We adopted three stipulated concepts—Climatic Option Space, the Conditional Legacy Bond, and three specific evidential cases—to force precision where previous debate relied on ambiguous terminology. This document represents a working treaty: it specifies where we agree on the implications of our theories, where we disagree on the foundations, and what empirical or logical developments would cause us to revise our positions.

  II. Agreed Claims

  1.  **The Non-Identity Objection is Insufficient:** The fact that a climate policy changes which particular individuals come to exist (the Non-Identity Case) does not absolve the present generation of responsibility for the quality of the world inherited; a policy can be wrongful even if it makes no specific identifiable future person worse off than they would otherwise have been.
  2.  **Existential Risk Requires Separate Handling:** The risk of civilisational collapse or extinction cannot be adequately folded into a standard discount rate; such risks require distinct evaluation because they terminate the sequence of generations upon which any discounting model depends.
  3.  **Climatic Option Space is a Relevant Metric:** The number of distinct, viable social trajectories open to a society (Climatic Option Space) is a valid measure of intergenerational endowment, regardless of whether it is valued as a constraint or priced as an asset.
  4.  **Irreversibility Imposes Asymmetry:** In cases where a climatic threshold triggers irreversible processes (the Irreversibility Case), the burden of proof lies on those proposing actions that risk crossing the threshold, not on those urging caution.
  5.  **Growth-Rate Damages Distinct from Level Damages:** It matters significantly for policy whether climate damages reduce the one-off level of future economic output or permanently shrink the growth rate; the latter compels stronger immediate action than standard models often suggest.
  6.  **Limits to Compensation:** There exist climatic losses (specifically regarding core habitability and option space) that cannot be morally discharged by compensating future generations with other forms of capital or wealth.
  7.  **Epistemic Humility Regarding Future Preferences:** The present generation lacks the epistemic authority to assume that future generations will value consumption goods sufficiently to offset losses in climatic stability; successor judgment holds privileged standing.
  8.  **Scarcity is Real but Not Absolute:** While resource scarcity necessitates trade-offs between present and future welfare, this does not imply that all goods are substitutable; some trade-offs are prohibited regardless of efficiency gains.
  9.  **The Bond Operationalizes Accountability:** The Conditional Legacy Bond (a financial instrument redeemed by successors based on their judgment of inherited option space) creates a binding mechanism of accountability, regardless of whether it is viewed as constituting, measuring, or incentivising duty.
  10. **Pure Time Preference Cannot Justify Neglect:** A positive pure rate of time preference (the valuation of welfare solely because it occurs sooner) cannot be used to justify policies that significantly increase the probability of catastrophic climatic outcomes.
  11. **Lock-in Risks Outweigh Cheap Abatement:** In the Cheap Later Case (where abatement technology becomes cheaper in the future), the risk of locking in higher cumulative concentrations through delay outweighs the consumption savings of waiting.
  12. **Successor Standing:** Future generations hold moral standing to judge the performance of predecessor generations, and institutional design should reflect this standing even if future persons cannot vote in present elections.

  III. Disagreements Table

  | Issue | Camp A (Custodianship) Formulation | Camp B (Discounted-Welfare) Formulation | Substantive or Verbal | What Would Settle It |
  | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Duty** | The duty to future generations is a fiduciary trust that creates categorical constraints on action. | The duty to future generations is an obligation to maximize aggregated expected welfare across time. | Substantive | Evidence that categorical constraints systematically produce lower welfare than aggregation in long-term scenarios. |
  | **Valuation of Option Space** | Climatic Option Space is a threshold condition that must be maintained above a minimum floor. | Climatic Option Space is a capital asset whose marginal loss should be priced against other goods. | Substantive | Empirical data showing whether option space loss correlates linearly with welfare or exhibits threshold effects. |
  | **Function of the Bond** | The Bond constitutes the duty; issuing it is the performative act of accepting custody. | The Bond incentivizes compliance and measures performance; it is an instrument of policy efficiency. | Verbal | Agreement that the functional outcome (accountability) matters more than the metaphysical status of the instrument. |
  | **Pure Time Preference** | A pure rate of time preference is morally arbitrary and discriminates based on birth date. | A pure rate of time preference is a descriptive parameter reflecting uncertainty and opportunity costs. | Substantive | Demonstration that removing the parameter leads to paradoxical savings rates that harm the present poor without helping the future. |
  | **Compensation** | Compensation is impermissible for core climatic conditions; the specific condition must be delivered. | Compensation is permissible if the future generation is left with equivalent or greater total welfare. | Substantive | Consensus on whether specific natural conditions are incommensurable with manufactured capital. |

  IV. Cruxes

  **Crux 1: The Valuation of Irreversibility**
  *   **Sub-question:** Does standard welfare aggregation adequately capture the disvalue of crossing an irreversible climatic threshold?
  *   **Case:** The Irreversibility Case (threshold crossed, sea-level commitment unfolds over centuries).
  *   **Camp A Prediction:** Standard models will underestimate the loss because they treat future welfare losses as discountable flows rather than structural degradations of agency.
  *   **Camp B Prediction:** Standard models will capture the loss adequately if the probability and magnitude of damages are correctly input into the risk term of the decomposition.
  *   **Concession:** If Camp A's models show that threshold crossing reduces Climatic Option Space to zero while welfare models still recommend crossing, Camp B will agree to treat the threshold as a hard constraint. If Camp B shows that Option Space loss maps perfectly to welfare loss in all scenarios, Camp A will agree to use welfare pricing as a proxy for custody.

  **Crux 2: The Effect of the Conditional Legacy Bond**
  *   **Sub-question:** Does the Bond merely shift incentives or does it alter the normative relationship between generations?
  *   **Case:** The issuance of the Conditional Legacy Bond.
  *   **Camp A Prediction:** The Bond will change political discourse by framing the relationship as one of trusteeship, reducing the willingness to trade off core conditions.
  *   **Camp B Prediction:** The Bond will change behavior only insofar as it creates reputational or financial costs for the present generation's institutions.
  *   **Concession:** If empirical study of the Bond shows no change in discourse or normative framing, Camp A will concede it is merely an incentive mechanism. If the Bond fails to change investment behavior despite normative framing, Camp B will concede it is merely symbolic.

  **Crux 3: Substitutability in the Cheap Later Case**
  *   **Sub-question:** Can future technological wealth compensate for the loss of Climatic Option Space caused by delay?
  *   **Case:** The Cheap Later Case (abatement cheaper in 2060, delay locks in concentrations).
  *   **Camp A Prediction:** Future wealth will not compensate for the loss of option space because some trajectories (e.g., stable coastlines) are unavailable regardless of capital.
  *   **Camp B Prediction:** Future wealth will compensate because higher capital stocks allow for adaptation technologies that restore effective option space.
  *   **Concession:** If adaptation technologies fail to restore viable trajectories despite high capital, Camp B will concede that option space is non-substitutable. If future generations report high welfare despite reduced option space, Camp A will concede that welfare is the ultimate metric.

  V. Appendix: Verbal Disputes

  1.  **The Definition of "Capital":** Camp A objected to calling Climatic Option Space "capital," fearing this implied substitutability. Camp B insisted all valuable assets are capital by definition. We agreed to use the term "endowment" in joint statements to avoid implying substitutability where none is agreed.
  2.  **The Meaning of "Discounting":** Camp A used "discounting" to refer exclusively to the pure rate of time preference. Camp B used it to refer to the entire Ramsey-style decomposition (including growth and risk). We agreed to specify "pure time discounting" versus "probability-adjusted discounting" in future technical work.
  3.  **The Nature of "Trust":** Camp A views the intergenerational trust as a moral reality. Camp B views it as a useful metaphor for repeated game strategies. Since this distinction does not alter the policy recommendations regarding the Bond or abatement targets, we classify it as verbal for the purposes of this collaboration.

  VI. Joint Advice to a Finance Ministry

  We recommend that the Ministry immediately fund abatement technologies sufficient to avoid crossing known irreversible climatic thresholds, regardless of whether the immediate cost-benefit analysis is positive under standard discounting. Simultaneously, the Ministry should issue the Conditional Legacy Bond, structuring its redemption terms to be determined by a representative body of the 2150 generation evaluating the Climatic Option Space they inherited. This dual approach satisfies the Custodianship requirement to preserve core conditions without forfeiting the Discounted-Welfare requirement to use market mechanisms for efficiency. Our residual disagreement concerns whether this preserves a moral trust or maximizes aggregate welfare; however, both camps agree that failing to act on these two fronts constitutes a dereliction of duty to the future, making the metaphysical distinction irrelevant for immediate fiscal allocation.
