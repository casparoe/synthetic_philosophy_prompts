answer: |-
  ### Preliminary Pass: Vulnerabilities and Strengths

  **Strengths:**
  The speaker's position is strongest on the phenomenology of moral experience and the logical problem of rule-application. The claim that moral judgement feels more like perception than calculation resonates with how agents actually deliberate, avoiding the rigidity of crude utilitarianism or Kantianism. Her anti-regress argument (that applying a principle requires uncodified judgement anyway) is a classic Wittgensteinian move that is difficult to dismiss without a robust account of how rules guide action. By conceding supervenience and default reasons, she insulates herself from the charge that her view makes morality chaotic or arbitrary.

  **Vulnerabilities:**
  The view is most vulnerable on explanation, transmission, and novelty. If features contribute no stable weight, it is unclear what *explains* a verdict other than the verdict itself. If moral knowledge is akin to expert perception, it is difficult to explain how we teach morality to novices or adjudicate radically new cases (like AI grief) where no trained disposition exists. The "silencing" machinery risks becoming a general principle in disguise if there are no criteria for when silencing occurs. Finally, if holism is treated as a conceptual truth immune to empirical counter-example, the view risks becoming unfalsifiable and therefore philosophically idle. The questioning strategy should begin by accepting her expertise model to establish rapport, then progressively demonstrate that this model cannot bear the explanatory and normative weight she requires of it.

  ***

  ### Q&A Questions

  **1. The Framing Problem**
  If the valence of a feature is holistically sensitive to the rest of the case, doesn't competence in a new configuration require knowing how each feature behaves in combination with every other, threatening to make moral judgement computationally intractable?
  *   **Likely Reply:** The skilled judge simply perceives which features are salient without needing to compute combinations.
  *   **Follow-up:** Is that trained perception of salience anything other than a principle that is real but not accessible to the agent, and what would in principle settle whether the content of her judgement is general?

  **2. The Analogies**
  You often compare moral judgement to jazz improvisation or clinical diagnosis, but in those fields practitioners can articulate the rules they break even if they don't follow them step-by-step. If the moral expert cannot articulate any principles even in retrospect, isn't the analogy disanalogous in the crucial respect?
  *   **Likely Reply:** In expert domains, much knowledge is tacit and only emerges in performance, not articulation.
  *   **Follow-up:** But if the tacit knowledge cannot be made explicit even in principle, how do we distinguish expert improvisation from mere noise, and what constrains the improvisation if not the structure of the music itself?

  **3. The AI Grief Case**
  Consider a clinic offering bereaved families a generative model trained on a dead relative's messages so they can exchange messages with a simulation, where there is no shared trained disposition to perceive. What does your skill model say about the permissibility of this practice given the lack of existing precedent?
  *   **Likely Reply:** The view has no verdict yet until a practice develops or we find sufficiently analogous cases of grief.
  *   **Follow-up:** If the view has no verdict yet, doesn't particularism look conservative, able only to adjudicate inside practices that already exist, and if it does have a verdict, where does that verdict come from if not from some general truth about what matters?

  **4. Default Reasons and Silencing**
  You distinguish default reasons that are silenced from those that are outweighed, but isn't the distinction between default and non-default reasons itself doing the work of a hedged general principle?
  *   **Likely Reply:** Silencing is a fact about the individual case rather than a rule governing all cases.
  *   **Follow-up:** What makes it the same phenomenon across cases and how are we to recognise it without a criterion?

  **5. The Explanatory Question**
  When you say that the wrong-making features of an action are simply these features in this case, what work is the *making* doing given that the very same feature can be inert or reversed in a near-identical case?
  *   **Likely Reply:** What makes an action wrong in this case is distinct from the claim that there is no difference in verdict without some difference in the base.
  *   **Follow-up:** Can the first notion do any explanatory work at all, or does it collapse into the second?

  **6. The Supervenience Concession**
  If no moral difference comes without some non-moral difference, there appear to be indefinitely many truths linking base properties to moral properties which look at least principle-shaped. Is your quarrel with the generalist therefore only about what counts as a principle, making the dispute verbal?
  *   **Likely Reply:** The dispute is substantive because these truths play no explanatory or deliberative role.
  *   **Follow-up:** What test would show the dispute is substantive rather than terminological?

  **7. The Alternative Community**
  Imagine a community exactly like ours except that some feature operating here as a default reason operates there as no reason at all, with everything else adjusted to compensate. Is this a possible moral practice, and what would make our arrangement the correct one and theirs incorrect?
  *   **Likely Reply:** The practice is impossible because reasons are what they are, grounded in the non-moral facts.
  *   **Follow-up:** What is the source of that necessity and is it not a general truth linking the feature to favouring?

  **8. The Anti-Regress Move**
  When you argue that rule-application bottoms out in uncodified judgement, is your claim concerning the content of moral judgement or only the psychology of applying rules, since a generalist can concede application is uncodified while insisting the content judged is general?
  *   **Likely Reply:** It is about content; there is no general content to be grasped.
  *   **Follow-up:** What distinguishes the judge's judgement from a hunch, and why should we expect judges to converge if there is nothing general for them to be right or wrong about?

  **9. Evidence Against the View**
  What concrete finding, armchair or empirical, would count as evidence against your view, such as the discovery that some feature's valence is stable across every context anyone can construct?
  *   **Likely Reply:** Nothing could count against it because holism is a conceptual truth about reasons.
  *   **Follow-up:** Is that a defect in the view or an honest consequence of it, and how would you reply to someone who took it to be the former?
