      *   **Friend 1 (Philosophy-leaning, let's call them "P"):** Claims CTT is a *theorem*. Cites equivalence of $\lambda$-calculus and Turing Machines (TM). Claims it says any effective procedure is captured by TM. Says it's settled math.
      *   **Friend 2 (Careful, let's call them "C"):** Distinguishes between the equivalence theorem and the Thesis itself. Claims "effectively computable" is informal. Calls CTT a physical/empirical claim.
