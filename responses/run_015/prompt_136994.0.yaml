answer: |-
  You have correctly identified that your friend's three deflations fail to capture the structure of your observation. You are right to reject vagueness: vagueness implies a monotonic slide (more replacement = less identity), whereas your case describes a **non-monotonic flip** triggered by an extrinsic event (the reassembly of the discarded parts). You are also right that standard Endurantism (3D) or Perdurantism (4D) ontologies describe *what* the boat is, but they do not inherently explain *why* the existence of a rival aggregate changes the identity conditions of the sailing vessel.

  There is no single, universally standardized noun phrase for this exact configuration (discarded matter reassembly specifically weakening the continuant), but the phenomenon you describe is a recognized, specific instantiation of two established philosophical concepts working in tandem: **The Closest Continuer Theory** (Robert Nozick) and **Sortal Dependence** (David Wiggins), situated within the broader **Fission Problem**.

  However, because your specific focus is on the *fate of the discarded matter* rather than the emergence of a duplicate from nowhere, I will define the specific carve-out you need.

  ### The Concept: Extrinsic Competitive Persistence

  What you have described is best understood as one phenomenon, not two. The "recollection" is merely the necessary condition that enables the "competition." Without a reassembled candidate of the right sort, there is no competition. Therefore, the phenomenon is **Extrinsic Competitive Persistence**.

  It is **Extrinsic** because the identity of the sailing boat depends on facts outside its own spatial and temporal boundaries (what happens in the shed).
  It is **Competitive** because identity is not an intrinsic property of the object, but a ranking among candidates.
  It is **Persistent** because it concerns diachronic identity (identity over time).

  Here is the carving you requested, distinguishing it from your friend's deflations and defining the edges.

  #### 1. Distinction from the Friend's Deflations

  *   **Vs. The Standard Ship Puzzle (4D vs. 3D):** Your friend treats the puzzle as an ontological conflict (is the boat the matter or the form?). Your observation shows it is an **identificatory** conflict. In both your scenarios (burned wood vs. shed wood), the sailing boat's physical history is identical. The 4D/3D distinction cannot explain why the *truth value* of "this is the original" changes when the only variable is the status of the *discarded* parts. Extrinsic Competitive Persistence posits that identity is not a fact about the object alone, but a fact about the object *relative to its rivals*.
  *   **Vs. Vagueness:** Vagueness suggests a borderline zone where "true" fades to "false." Your case shows a binary switch. The boat is the original until a valid rival appears, at which point the claim becomes indeterminate or false. This is not a slippery slope; it is a **threshold trigger**. The quantity of replacement is held fixed; the variable is the *existence of a competitor*.
  *   **Vs. Degrees of Sameness:** If sameness were a matter of degree, the sailing boat's "score" would drop as planks are removed. In your scenario, the sailing boat's "score" remains high until the shed-boat is finished. The drop is caused by the *rival's completion*, not the *sailing boat's decay*. This confirms identity is a **winner-take-all contest**, not a diminishing resource.

  #### 2. One Phenomenon or Two?

  It is **one phenomenon**: **The Rival Constraint.**

  The "Recollection Effect" (gathering the wood) is not a separate metaphysical force; it is the mechanism that satisfies the **Sortal Condition** for a rival candidate.
  *   If the wood is burned: No rival candidate exists. The sailing boat wins by default.
  *   If the wood is made into a roof: A rival aggregate exists, but it fails the **Sortal Condition** (a roof is not a *boat*). The sailing boat wins by default.
  *   If the wood is made into a boat: A rival candidate exists *and* satisfies the Sortal Condition. Competition ensues.

  The "Competition Effect" is the result of satisfying the Recollection + Sortal conditions. Therefore, do not treat them as separate forces. Treat "Recollection" as the *trigger* for "Competition."

  #### 3. The Edges and Boundary Cases

  You asked for tight definitions to handle the edge cases. Under **Extrinsic Competitive Persistence**, the rules are as follows:

  **A. The Instant Reuse Case**
  *Scenario:* Every discarded timber becomes part of some boat the instant it is removed, with no interval in which it is merely stacked.
  *Verdict:* **The Effect Does Not Survive.**
  *Reasoning:* For a rival to compete, it must constitute a **distinct functional continuity**. If the timber moves directly from Boat A to Boat B while both are in service, this falls under your "Case C" (timber fed into other working boats). The identity of Boat A is anchored by its *spatiotemporal continuity of function*. The timber does not acquire a "rival identity" until it ceases to be part of Boat A's history and is organized into a *new* functional whole. Without the "shed" (a break in functional continuity), there is no fission, only gradual migration. The "shed" is necessary to establish the *separateness* of the rival candidate.

  **B. The Copying Case**
  *Scenario:* The timbers are copied rather than reused; material is new but arrangement is inherited.
  *Verdict:* **The Effect Survives (but weakens).**
  *Reasoning:* This depends on whether your trust's criteria for "same boat" are **Materialist** or **Structuralist**.
  *   If Materialist (wood matters): Copies do not trigger the effect. The shed-boat is a replica, not a rival.
  *   If Structuralist (form matters): Copies *do* trigger the effect.
  *   *Refinement:* In most conservation contexts (like yours), the criterion is hybrid: *Continuity of Form + Sufficient Material Core.* If the shed-boat is a perfect copy, it creates a **Qualitative Rival**. Under Closest Continuer Theory, a qualitative rival (copy) is usually weaker than a constitutive rival (original wood). However, if the sailing boat has lost *all* original wood, the constitutive rival (even if copied, provided it uses the *original plan*) may arguably tie or win. But strictly speaking, if the wood is new, the "Recollection Effect" is broken because the *matter* was not recollected. The effect you described relies on the *matter* returning. So: **No, the effect does not survive copying** if your definition of the boat relies on material constitution (which your argument implies it does).

  **C. The Retroactive Truth Case**
  *Scenario:* Does a later reassembly make it *have been false, earlier*, that our boat was the same boat?
  *Verdict:* **It was always indeterminate, not retroactively false.**
  *Reasoning:* This avoids metaphysical retrocausality. Under Extrinsic Competitive Persistence, the statement "This is the original boat" made in Year 10 is not a claim about Year 10 alone; it is a claim about the *entire trajectory* of the object.
  *   If the wood is eventually burned: The Year 10 claim was **True**.
  *   If the wood is eventually reassembled: The Year 10 claim was **Indeterminate** (or False, depending on whether you require uniqueness).
  *   The truth value supervenes on the *complete history*. We revise the claim not because the past changed, but because our *assessment of the identity conditions* was incomplete until the rival emerged. The identity was always contingent on the future; we just lacked the epistemic access to know it.

  ### The Name and Definition

  Since no existing single term captures the specific nuance of *discarded matter reassembly* triggering the fission problem, you may use the label:

  **The Reconstituted Rival Constraint**

  **Definition:**
  A condition of diachronic identity wherein the persistence of an object $O$ is contingent not only on its own continuous spatiotemporal history but on the non-existence of a rival object $R$ formed from $O$'s discarded constituents.

  **Conditions for the Constraint to Activate:**
  1.  **Material Continuity:** $R$ must be composed substantially of the constituents discarded by $O$. (Excludes Copying).
  2.  **Functional Interruption:** The constituents must undergo a period of non-functionality (the "shed") before forming $R$. (Excludes Instant Reuse).
  3.  **Sortal Match:** $R$ must fall under the same sortal concept as $O$ (e.g., "Boat"). (Excludes Barge/ Roof).
  4.  **Temporal Overlap:** $R$ must claim existence while $O$ is still claiming existence (or immediately upon $O$'s cessation).

  **What Falls Outside It:**
  *   **Vagueness:** Gradual replacement without a rival candidate.
  *   **Standard Fission:** A duplicate appearing ex nihilo (this triggers competition, but lacks the *material reconstitution* element you find crucial).
  *   **Mereological Essentialism:** The claim that losing *any* part destroys identity (this is intrinsic, not extrinsic).

  ### Summary for Your Argument

  You can tell your friend that the disagreement is not about vagueness or ontology, but about **Extrinsic Identity Conditions**. The sailing boat is not the original *in isolation*; it is the original *by default*. Its status is a "winner-take-all" title that holds only so long as no valid rival claims it. The reassembly of the timbers does not change the sailing boat; it changes the *field of candidates*. The sailing boat loses not because it changed, but because the competition changed. This is not vagueness; it is **contextual uniqueness**.
