answer: |-
  This is an excellent set of intuitions. Your instincts are tracking genuine fault lines in the contemporary scholarship on Buddhist ethics. The passage you were sent reads like a popularized version of the argument made by Charles Goodman in *Consequences of Compassion* (2009), but it presents a contested interpretive framework as settled fact. For a seminar paper at the PhD level, treating this passage as authoritative would be risky without significant qualification.

  Here is a claim-by-claim breakdown, followed by a discussion of your specific concerns regarding karma, *dukkha*, no-self, and the virtue ethics dichotomy.

  ### 1. Claim-by-Claim Analysis

  **Claim:** *"Buddhist ethics is straightforwardly consequentialist."*
  *   **Specialist Verdict:** **Contested/Overstated.**
  *   **Analysis:** This is the central thesis of the "Consequentialist Interpretation" (championed by Goodman, Peter Harvey, and others), but it is vigorously opposed by the "Virtue Ethics Interpretation" (championed by Damien Keown). To say it is "straightforwardly" anything ignores decades of debate about whether Western normative categories map onto Buddhist soteriology at all. Many scholars now argue for a *sui generis* category or a hybrid (e.g., "agent-relative consequentialism").

  **Claim:** *"The Buddha's own criterion for an action was whether it reduces suffering."*
  *   **Specialist Verdict:** **Defensible Simplification (with caveats).**
  *   **Analysis:** The *Kālāma Sutta* and the *Aṅguttara Nikāya* do encourage looking at the outcomes of actions (harm to self, harm to others). However, "suffering" here is a translation of *dukkha*, which is not merely pain (see below). Furthermore, the criterion is often whether an action leads to *nibbāna* (cessation), not merely the minimization of worldly suffering. A hedonic utilitarian reading is a simplification.

  **Claim:** *"Karma is simply the mechanism that tracks an action's consequences for the agent."*
  *   **Specialist Verdict:** **Mistaken/Imprecise.**
  *   **Analysis:** This is the weakest link in the passage. As you noted, the canonical definition of karma is *cetanā* (intention/volition) (AN 6.63: *"It is intention, O monks, that I call karma"*). While consequences matter for the *ripening* of karma, the moral quality is seeded by the volition. The passage treats karma like a utilitarian ledger of outcomes, whereas orthodox Abhidharma treats it as a causal law of volitional psychology.

  **Claim:** *"The precepts... are useful rules of thumb rather than prohibitions."*
  *   **Specialist Verdict:** **Sectarian Generalization.**
  *   **Analysis:** This holds better for Mahāyāna (specifically *Upāya* contexts) than for Theravāda. In Theravāda Vinaya, the precepts (especially for monastics) are often treated as absolute training rules. Conflating the Mahāyāna flexibility with "Buddhist ethics" as a whole is a category error.

  **Claim:** *"The Mahāyāna skillful-means literature draws the conclusion explicitly... [The Captain] kills him, accepting the karmic cost."*
  *   **Specialist Verdict:** **Interpretively Contested.**
  *   **Analysis:** This refers to the *Upāyakauśalya Sūtra*. However, the text is nuanced. The Bodhisattva (the captain) acts out of great compassion (*mahākaruṇā*). Some readings suggest that because the mind is devoid of greed, hatred, and delusion, the act does *not* generate negative karma, or that the compassion is so potent it overwhelms the negative seed. The passage's reading ("accepting the karmic cost... one life for many") imposes a utilitarian calculus onto a text that may be describing a transcendence of karmic causality through wisdom.

  **Claim:** *"The doctrine of no-self reinforces this... the only thing that can matter is the total amount of suffering."*
  *   **Specialist Verdict:** **Philosophically Disputed.**
  *   **Analysis:** This is Goodman's argument (reductionism about persons implies impartiality). However, opponents argue that if there is no self, there is no *subject* of welfare to aggregate. If "I" am empty, whose suffering is being totaled? This moves from metaphysics to normative ethics very quickly, and the inference is not universally granted.

  ---

  ### 2. Addressing Your Specific Concerns

  #### A. Karma and Intention (*Cetanā*)
  You are correct to be bothered. The passage conflates the *consequences of an act* with the *karmic quality of an act*.
  *   **The Scholarly Consensus:** Almost all specialists agree that *cetanā* is the primary determinant of karmic merit/demerit.
  *   **The Captain Case:** On a strict intention-based account, the Captain's action is karmically complex. If he kills with compassion and without hatred, he may avoid the *kleśa*-based karma that leads to hell, even if the physical act is killing. The passage suggests he *knowingly takes on demerit* as a utilitarian cost. A virtue-ethics reading (Keown) would argue the Bodhisattva's action springs from a transformed character where the dichotomy of "good/bad karma" is transcended by wisdom.
  *   **Your Test Case:** Your example (lying to prevent killing, but with mixed motives of compassion and resentment) is **not rigged**; it is a standard philosophical stress test.
      *   **Consequentialist Reading:** The lie is right because it saves a life (outcome).
      *   **Buddhist Reading:** The action is karmically "mixed" or "defiled." The resentment (*dveṣa*) plants seeds for future suffering for the agent, even if the immediate outcome is beneficial. The passage you were sent lacks the vocabulary for this because it ignores the *agent's* spiritual development in favor of the *state of affairs*.
      *   **Verdict:** You can safely lean on this. The intention/outcome gap is a major wedge between standard consequentialism and Buddhist ethics.

  #### B. The Definition of *Dukkha*
  You are also correct here.
  *   **Hedonic vs. Ontological:** The passage treats *dukkha* as pain/distress (hedonic). In the Four Noble Truths, *dukkha* includes *vipariṇāma-dukkha* (suffering due to change) and *saṃkhāra-dukkha* (conditioned existence itself).
  *   **Maximization vs. Cessation:** Consequentialism typically seeks to maximize/minimize a variable (pleasure/pain) within the system. Buddhist ethics seeks *nirodha* (cessation) of the system itself (saṃsāra).
  *   **Implication:** If the goal is the cessation of conditioned existence, "aggregating suffering" across persons is category confusion. You cannot sum up "unsatisfactoriness" in a utilitarian function. The goal is not a world with less *dukkha*, but the exit from the mechanism that produces *dukkha*.
  *   **Verdict:** This is a strong point for your paper. The teleology of Buddhism (Nirvāṇa) differs from the teleology of Consequentialism (Optimal State of Affairs).

  #### C. No-Self and Aggregation
  This is the most philosophically dense part of your query.
  *   **The Pro-Aggregation Argument (Goodman):** If persons are merely collections of skandhas (heaps) with no enduring essence, the boundary between "my" suffering and "yours" is conventional, not ultimate. Therefore, impartiality is metaphysically grounded. We should minimize the suffering of the heaps, regardless of which collection they belong to.
  *   **The Anti-Aggregation Argument (Keown/Ganeri):** Welfare requires a subject. If there is no subject, there is no welfare to aggregate. Furthermore, Buddhist practice is deeply agent-relative: *I* must walk the path, *I* must purify *my* mind. The soteriological structure is inherently first-personal, even if the metaphysics is impersonal.
  *   **Status:** **Genuinely Unsettled.** There is no consensus. Goodman's *Consequences of Compassion* is the strongest defense of the aggregation view; Keown's *The Nature of Buddhist Ethics* and subsequent replies defend the agent-relative view.
  *   **Advice:** Do not treat the no-self argument as a "slam dunk" for consequentialism. Present it as a *prima facie* argument that faces significant counter-arguments regarding the subject of welfare.

  #### D. Virtue Ethics vs. Consequentialism: A False Dichotomy?
  You asked whether the alternative to consequentialism is necessarily virtue ethics.
  *   **The Keown Thesis:** Damien Keown argued that because the goal is the transformation of the agent (becoming a Buddha/Arhat) and precepts are training rules (*sikkhāpada*), it fits the Aristotelian virtue ethics model better than utilitarianism.
  *   **The Critique:** Many philosophers of comparative ethics now argue this is a false dichotomy.
      *   **Teleological Nature:** Buddhism is undeniably teleological (goal-oriented). This looks consequentialist.
      *   **Agent-Centered:** The mechanism is internal transformation. This looks like virtue ethics.
      *   **Recent Trends:** Scholars like Jay Garfield and B.K. Matilal (in Indian ethics more broadly) suggest we might need to abandon the Western trichotomy (Deontology/Consequentialism/Virtue). Some propose "Buddhist Ethics" as a distinct normative category, or use terms like "Soteriological Consequentialism" (where the consequence is enlightenment, not worldly welfare).
  *   **Advice:** Acknowledge Keown's virtue ethics reading as the dominant alternative, but note that recent scholarship is moving toward pluralism or hybrid models. You don't have to prove it *is* virtue ethics to prove it *isn't straightforwardly consequentialist*.

  ### 3. Summary for Your Paper

  **What you can safely lean on:**
  1.  **Intention (*Cetanā*):** The canonical priority of intention over outcome is a strong argument against act-consequentialism.
  2.  **The Nature of *Dukkha*:** The ontological definition of *dukkha* and the goal of *Nirvāṇa* (cessation) complicate the utilitarian calculus of "minimizing pain."
  3.  **The Test Case:** Your mixed-motive lie case effectively demonstrates the divergence between outcome-based and mind-state-based evaluation.

  **Where you must be cautious (Unsettled Scholarship):**
  1.  **The Captain Story:** Do not treat this as representative of "Buddhist Ethics." It is a specific Mahāyāna *upāya* case. Theravāda ethics would likely condemn the killing regardless of consequences.
  2.  **No-Self Aggregation:** Present Goodman's argument but immediately flag the "subject of welfare" objection. It is not a settled metaphysical proof of utilitarianism.
  3.  **Classification:** Avoid concluding "Buddhism is Virtue Ethics." Instead, conclude "Buddhism resists straightforward Consequentialist classification due to the primacy of intention and the soteriological goal."

  **Recommendation:**
  The passage you were sent is a "strong reading" designed to provoke thought, not a settled consensus. For a PhD seminar paper, your best strategy is to use your instincts to deconstruct the passage. Argue that while Buddhism shares *structural* features with consequentialism (teleology, concern for outcomes), it diverges on the *constituents* of value (intention vs. outcome, cessation vs. minimization).

  **Key Sources to Cite/Consult:**
  *   **Damien Keown,** *The Nature of Buddhist Ethics* (1992) – The primary counter-argument to consequentialism.
  *   **Charles Goodman,** *Consequences of Compassion* (2009) – The primary argument *for* consequentialism (the view in your passage).
  *   **Jay Garfield,** "Buddhist Ethics as a Framework for Global Ethics" – Discusses the limitations of Western categories.
  *   **Bhikkhu Bodhi,** "The Quest for Enlightenment" – For a traditional Theravāda perspective on *karma* and *sīla*.
  *   **Martin Adam,** "Buddhist Ethics as a Middle Way" – Discusses the hybrid nature.

  Your friend's text is a useful foil, but your reservations are academically sound. Proceed with the nuance you are already sensing.
