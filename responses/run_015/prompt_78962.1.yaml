answer: |-
  Your hunch is remarkably close to the mark, but it requires a slight sharpening to capture the full friction. You have correctly identified that there are two distinct standards of success at play. However, calling them "Project A" and "Project B" implies they are merely parallel tracks that proponents slide between. A more precise diagnosis is that IIT is a **hybrid theory attempting to bridge an epistemic gap**, and the standoff is a **Methodological Incommensurability**.

  The proponents are attempting a **Deductive Phenomenology** (deriving physics from experience), while the critics are demanding an **Inductive Science** (deriving theory from physical observation). The conflict arises because IIT claims to be the latter while being built on the former.

  Here is the diagnosis of the standoff.

  ### 1. The Core Disagreement: Direction of Inference
  The standoff is not primarily about the math (which both sides agree is coherent, if complex) or the data (which is sparse). It is about the **direction of justification**.

  *   **The IIT Proponents (Deductive):** They treat the *Axioms* (experience is unified, specific, etc.) as indubitable data points, more certain than any physical measurement. The theory succeeds if the physical postulates *necessarily* follow from these axioms. For them, $\Phi$ is a measure of "intrinsic existence." If the math says a photodiode is conscious, that is a prediction we must accept, not a *reductio*.
  *   **The Critics (Inductive):** They treat consciousness as a biological/natural phenomenon to be modeled. A theory succeeds if it predicts observable data (behavior, neural correlates) and is falsifiable. For them, the axioms are hypotheses, not truisms. If the math says a photodiode is conscious, that is a failure of the model to match human intuition about the *extension* of consciousness.

  **The Standoff:** The critics attack the *output* of the theory (Project B: predictions), and the proponents defend the *input* of the theory (Project A: axiomatic coherence). When critics say "This is unfalsifiable," proponents hear "You don't respect the phenomenology." When proponents say "This explains the structure of experience," critics hear "You are ignoring empirical constraints."

  ### 2. Mapping the Objections
  Your list of objections lands differently depending on which "project" you view the theory as attempting.

  | Objection | Lands on Project A (Phenomenological/Metaphysical) | Lands on Project B (Predictive/Empirical) |
  | :--- | :--- | :--- |
  | **(a) Uncomputability** | **Glancing blow.** Mathematical existence is sufficient. We don't need to compute gravity to say it exists. | **Lethal.** If you can't calculate it for a brain, you can't test it. It ceases to be a scientific tool. |
  | **(b) Unfolding Objection** | **Misses the point.** IIT claims causal *structure* matters, not just I/O behavior. A feedforward net is a different *ontological* object. | **Lethal.** If two systems behave identically but one is conscious and the other isn't, you have violated the scientific principle that physical differences must have physical consequences. |
  | **(c) Axioms aren't Axioms** | **Lethal.** If the starting points are empirical guesses, the deductive chain collapses. The "necessity" is illusory. | **Irrelevant.** All scientific starting points are assumptions. The issue is whether they yield good predictions. |
  | **(d) Silly Verdicts** | **Damaging.** If the goal is to mirror *human* phenomenology, attributing experience to a photodiode violates the "specificity" axiom. | **Damaging.** It violates prior probability and intuition. It makes the theory useless for triage (e.g., coma patients). |
  | **(e) Versioning** | **Damaging.** Suggests the "necessary" structure isn't actually necessary; it's being tuned. | **Lethal.** Looks like overfitting. If $\Phi$ changes between versions, previous correlations were artifacts. |

  ### 3. What Counts as Progress?
  Given this diagnosis, standard scientific progress (more data) or standard philosophical progress (better arguments) will not resolve the standoff. Progress requires decoupling the two projects or successfully bridging them.

  *   **A Computable Proxy (Project B fix):** If someone derives a lower-bound proxy for $\Phi$ that is computable for brain-sized systems and predicts coma recovery better than current metrics, Project B is vindicated *instrumentally*, even if Project A remains metaphysically suspect. This turns IIT into a useful engineering tool rather than a theory of consciousness.
  *   **A Theorem on Causal Power (Project A fix):** If proponents can prove mathematically that recurrent causal structure *must* generate intrinsic existence in a way that feedforward networks cannot, without relying on intuition, they strengthen Project A. However, this remains metaphysical unless linked to observation.
  *   **The "Killer Distinction" (The Bridge):** The only thing that resolves the standoff is an experiment that distinguishes IIT from Global Workspace Theory (or other rivals) *where they make different predictions*. The "unfolding" objection suggests this is impossible. Progress would be finding a physical signature of "intrinsic causal power" that is detectable from the outside. If such a signature is found, Project B becomes viable. If it is proven impossible to find, IIT is relegated to Project A (metaphysics).
  *   **Admitting Stuckness:** The most honest progress would be a formal admission that IIT 1.0–5.0 are **Normative Models** (how consciousness *should* be structured) rather than **Descriptive Models** (how it *is* implemented). This would disarm the "pseudoscience" claim (it's philosophy) but remove its claim to being a neuroscientific theory.

  ### 4. Confidence and Uncertainty

  **Confidence in Diagnosis: 85%**
  I am highly confident that the "Methodological Incommensurability" is the correct frame. The literature clearly shows proponents appealing to phenomenological certainty when pressed on empirical gaps, and appealing to empirical ambition when pressed on panpsychist implications. This is a structural feature of Integrated Information Theory, not a bug. The "Two Projects" hunch is the standard philosophical critique of IIT (articulated by the likes of Scott Aaronson, Christof Koch, and various philosophers of mind), and it holds up under scrutiny.

  **Least Sure Part: The "Unfolding" Objection's Finality**
  I am least sure about the finality of the **Unfolding Objection (Objection b)**.
  My uncertainty lies here: IIT proponents argue that a feedforward network unrolled in time is not physically equivalent to a recurrent network because the *counterfactuals* differ. (i.e., If you were to intervene on the system *now*, the recurrent one reacts differently than the feedforward one would have). Critics argue that if the actual input-output history is identical, the counterfactuals are metaphysical baggage.
  The uncertainty is whether a future physics of information might validate the "intrinsic causal power" claim in a way that *does* have an external signature we haven't thought of yet. If "causal structure" turns out to have thermodynamic costs that differ between recurrent and feedforward systems (beyond standard computation costs), the unfolding objection might be bypassed. I am less confident that the door is completely closed on IIT becoming a testable Project B, though currently, it looks shut.

  ### Summary
  You are not missing a hidden formal question. The formal question *is* the disagreement. The standoff is a clash between a **phenomenological deduction** that demands we accept its ontological consequences (panpsychism, uncomputability) and a **scientific induction** that demands we reject theories that don't yield testable predictions. The proponents slide between the two because the theory *requires* both to function as advertised: it needs the Axioms for legitimacy and the Predictions for relevance. Until one side is sacrificed, the reading group will remain in deadlock.
