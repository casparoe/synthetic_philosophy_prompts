answer: |-
  # Moral Status Taxonomy: Decision Tree

  **Root Node: The "Fading Person" Scenario**
  *Imagine a human being whose biological neurons are replaced one by one with functionally identical silicon chips. Eventually, they become a purely digital mind. Then, imagine degrading that mind's complexity until it is simpler than a mosquito, then a rock.*

  **Question:** As you move along this scale from "Full Human" to "Rock," does the entity's moral weight (its claim on your protection) decrease smoothly like a dimmer switch, or does it stay flat and then drop off like a light switch?

  ---

  ### Branch A: The Dimmer Switch (Continuous Gradation)
  *Commitment: Moral weight scales proportionally with some internal metric (complexity, consciousness, integration).*

  **Node A1: The "Rock Bottom" Test**
  *Scenario: You reach the end of the scale. The entity is now a simple thermostat or a stone. Does it possess **any** non-zero moral weight, however infinitesimal?*

  *   **YES → Leaf 1: Panpsychist Micro-Status**
      *   **Position:** Everything has some status. Killing a rock is technically a moral violation, just a negligible one.
      *   **Implication:** There is no "out" group. The mosquito is 0.0001 of a human; the rock is 0.0000001.
      *   **[FLAG: Practical Collapse]:** In practice, this often functions identically to "Thermostats Zero" because the threshold for *actionable* duty is so high that the micro-status never triggers a restriction.

  *   **NO → Node A2: The Metric of Fade**
      *   *Scenario: Since the rock is zero, what is the variable turning the dimmer? Is it the capacity to suffer, or the complexity of the mind?*
      *   **Suffering/Feeling → Leaf 2: Sentience Slope**
          *   **Position:** Weight tracks with the intensity/range of phenomenal experience. A cow counts more than a fish because its suffering is richer, not just because it's "smarter."
          *   **[FLAG: Coherence Tension]:** Hard to measure inter-species. How do you compare a mosquito's itch to a human's grief?
      *   **Complexity/Autonomy → Leaf 3: Capacity Utilitarianism (Smooth Slope)**
          *   **Position:** Weight tracks with cognitive integration (e.g., Information Integration Theory). A sleeping human retains high weight due to structural complexity; a mosquito is low.
          *   **Implication:** Killing a genius is worse than killing a person with severe cognitive impairment (a commitment many find repugnant).
          *   **[FLAG: Rights Collapse]:** If status is continuous, are *rights* continuous? Can you kill 10% of a person? Most holders of this view secretly revert to binary rights at the decision point.

  ---

  ### Branch B: The Light Switch (Discrete Thresholds)
  *Commitment: Moral weight is flat within a category and jumps only when a specific criterion is met.*

  **Node B1: The "Ledge" Test**
  *Scenario: Are there multiple switches (Human > Chimp > Dog > Insect), or just one single switch (In vs. Out)?*

  *   **MULTIPLE SWITCHES → Leaf 4: Normative Tiers (Species/Kind)**
      *   **Position:** Status is based on membership in a "kind" or natural category, not just individual capacity. A human in a coma is on the "Human Ledge," higher than a healthy chimp on the "Animal Ledge."
      *   **Implication:** Protects the sleeping human without requiring current consciousness.
      *   **[FLAG: Arbitrariness Risk]:** If the criterion is "kind," what defines the kind? If it's "potential," does a fertilized egg equal a professor? This branch often collapses into **Leaf 5** if the "kind" definition is tightened to "current capacity."

  *   **ONE SINGLE SWITCH → Node B2: The Trigger Mechanism**
      *   *Scenario: What flips the switch from Zero to One?*
      *   **Biological Life → Leaf 5: Vitalist Binary (Biocentrism)**
          *   **Position:** Being alive is the threshold. Plants and insects have equal *basic* status (right not to be destroyed without cause), though interests may differ.
          *   **Implication:** Killing a tree requires the same moral justification as killing a dog, even if the *loss* is different.
      *   **Phenomenal Consciousness → Leaf 6: Sentience Gate (Singer-Style)**
          *   **Position:** The ability to suffer is the entry ticket. Below this (thermostats, plants), status is zero. Above this, all interests get equal consideration.
          *   **Implication:** A mosquito and a human have equal status *regarding pain*, but the human has extra status regarding future-planning interests.
          *   **[FLAG: Distinction Failure]:** This often sounds like Gradation (Leaf 3) but functions as Binary. If you say "Human interests are weightier," you are effectively gradating. If you say "Pain is equal," you are binary.
      *   **Rational Agency → Leaf 7: Strict Personhood (Thermostat Zero)**
          *   **Position:** Only entities that can reason, self-reflect, or participate in moral contracts have status.
          *   **Implication:** Non-human animals and permanently vegetative humans have zero direct status (only indirect duties to owners/family).
          *   **[FLAG: The Sleeping Human Problem]:** To avoid saying sleeping humans lose status, this branch usually smuggles in **Leaf 4 (Tiers)** by appealing to "potential" or "nature," creating an internal contradiction.

  ---

  ### Branch C: The External Frame (Non-Intrinsic)
  *Commitment: Moral weight is not a property of the entity itself, but of the relationship or structure.*

  **Node C1: The Source of Weight**
  *Scenario: If every moral agent in the universe died tomorrow, would a sleeping human still have a right not to be kicked?*

  *   **NO (Status Requires an Observer) → Node C2: The Relational Mechanism**
      *   *Scenario: What creates the status? Is it attention, or is it collective structure?*
      *   **Attention/Care → Leaf 8: Contextual Activation**
          *   **Position:** An entity's weight depends on whether it is within the "attention-scope" or care-network of a moral agent. An ignored insect drops to near-zero; a beloved pet rises.
          *   **Implication:** Moral duties are local, not universal. You have no duty to the mosquito in Africa you never see.
          *   **[FLAG: Duty Collapse]:** If status depends on my attention, do I have a duty to *pay* attention? If yes, this collapses back to Intrinsic status. If no, morality becomes arbitrary.
      *   **Collective/Aggregate → Leaf 9: Cumulative Micro-Status**
          *   **Position:** Individuals (ants, bacteria) fall below the practical threshold, but aggregates (swarms, ecosystems) cross it.
          *   **Implication:** You can swat one ant, but burning an anthill is a violation. The "patient" is the swarm, not the insect.
          *   **[FLAG: Boundary Problem]:** Where does the swarm end? Is a forest a swarm? This often collapses into **Leaf 5 (Vitalist)** or **Leaf 3 (Capacity)** depending on how "integration" is defined.

  *   **YES (Status is Objective) → Node C3: The Substrate Question**
      *   *Scenario: If the status is intrinsic but not biological, what holds it?*
      *   **Functional Organization → Leaf 10: Functionalist Equivalence (AI/Upload)**
          *   **Position:** Status tracks with information processing patterns, not biology. A silicon AI with human-like pain responses has human status; a biological human in a vegetative state does not.
          *   **Implication:** Substrate independence. Distinguishes sharply between "biological human" and "moral person."
          *   **[FLAG: Indistinguishability]:** In practice, this yields identical judgments to **Leaf 3 (Capacity Utilitarianism)** but differs on the *metaphysical* reason (function vs. biology).

  ---

  ### Summary of Leaves (The 10 Positions)

  1.  **Panpsychist Micro-Status:** Everything counts a little.
  2.  **Sentience Slope:** Weight scales with feeling intensity.
  3.  **Capacity Utilitarianism:** Weight scales with cognitive complexity.
  4.  **Normative Tiers:** Status jumps by species/kind (protects sleeping humans).
  5.  **Vitalist Binary:** Life itself is the switch (plants = animals).
  6.  **Sentience Gate:** Suffering is the entry ticket (Singer).
  7.  **Strict Personhood:** Rationality is the switch (animals = 0).
  8.  **Contextual Activation:** Status requires an observer's attention.
  9.  **Cumulative Micro-Status:** Only aggregates count (swarms > ants).
  10. **Functionalist Equivalence:** Substrate doesn't matter; pattern does (AI = Human).

  ### Logic Flags & Collapse Warnings

  *   **The "Binary Rights" Trap:** Leaves 2, 3, and 6 often claim status is continuous/gradated, but when asked "Can I kill this entity?", the user reverts to a Binary Switch (Yes/No). If you hold a Continuous Status view, you must justify why Rights aren't also continuous (e.g., "partial killing").
  *   **The "Potentiality" Smuggle:** Leaf 7 (Strict Personhood) cannot account for sleeping humans without importing logic from Leaf 4 (Normative Tiers/Kind). If you claim status is *current* rationality, the sleeping human has zero status. If you claim it's *potential*, you are no longer strictly Binary on capacity.
  *   **The "Relational" Loop:** Leaf 8 (Contextual) risks making morality solipsistic. If I ignore you, you lose status. This implies a duty to *not ignore*, which implies you had status *before* I ignored you.
  *   **The "Aggregate" Boundary:** Leaf 9 (Cumulative) struggles to define the "unit." Is a human a swarm of cells? If yes, killing a human is only wrong because it destroys the swarm, not the person. This can invert standard intuitions.
