answer: |-
  **INTERDISCIPLINARY CURRICULUM OVERSIGHT BOARD**

  **MEMORANDUM**

  **TO:** Dr. Elena Rosetti, Dean of Arts; Dr. Marcus Thorne, Chair, Department of Cognitive Science
  **FROM:** Interdisciplinary Curriculum Oversight Board
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Regarding Proposed Graduate Seminar: *The Phenomenal Boundary Problem*

  **I. DECISION**

  After reviewing the Department of Cognitive Science's proposal for the required graduate seminar *The Phenomenal Boundary Problem* and the formal objection filed by the Dean of Arts, the Board has determined that neither the original dual-track proposal nor the Dean's single-track revision is currently suitable for approval.

  **The Board selects Option 3:** We reject both the Department's original proposal and the Dean's revision. The Department is required to redesign the seminar to address the structural concerns raised by the Dean while preserving the substantive philosophical engagement required of a graduate-level course.

  **Timeline and Conditions:**
  1.  **Revised Proposal Deadline:** A revised syllabus and pedagogical statement must be submitted to the Board within six weeks (by December 5, 2023).
  2.  **Implementation:** Pending approval of the redesign, the course is cleared for scheduling in the Fall term of the next academic year.
  3.  **Mandatory Consultation:** The course design team must include a documented consultation with a faculty member specializing in meta-philosophy or philosophical methodology to ensure the structural biases identified below are mitigated.

  **II. ENGAGEMENT WITH THE DEAN'S OBJECTION**

  The Board finds the Dean's objection regarding the "hidden premise" of determinacy to be philosophically sound and pedagogically critical. The Dean argues that both Track A (Qualia Incoherence) and Track B (Privately Calibrated Reality) presuppose that there is a determinate fact of the matter regarding whether Chase's or Sanborn's experience has changed, differing only on whether that fact is accessible or coherent.

  We agree that framing the seminar around a binary adjudication of the Chase/Sanborn divergence risks smuggling in a realist assumption that a rigorous eliminativist position would reject. If the question posed to students is "Did the experience change or did the report change?", the logical space is already constrained to views that accept "experience change" as a coherent category. A strict eliminativist (or illusionist) might argue that the question itself relies on a folk-psychological error theory. By forcing a choice between Track A and Track B, the original syllabus effectively treats eliminativism not as a competing ontology, but as a methodological tool restricted to Track A, while Track B reifies the very phenomenon Track A seeks to dissolve.

  Therefore, the Board validates the Dean's claim that the original design imposes a false dichotomy that excludes a robust third option: the rejection of the question's presuppositions. However, while the Dean's diagnosis is correct, her proposed cure (Option 2) introduces new pedagogical deficits, as detailed below.

  **III. PEDAGOGICAL SCOPE AND METAPHYSICAL COMMITMENT**

  The Board must also address whether a course centered on the question of whether qualia is an incoherent posit can be taught responsibly without requiring students to commit to a metaphysical stance.

  The Dean's revision proposes treating the Chase/Sanborn case solely as a historical artifact, analyzing its rhetoric without adopting a substantive stance. The Board rejects this limitation for a *required graduate seminar*. Graduate training in Cognitive Science requires students to navigate live ontological debates, not merely catalogue them. To reduce the seminar to a rhetorical analysis would deprive students of the opportunity to develop *argumentative competence*—the ability to construct, defend, and critique metaphysical claims under pressure.

  However, competence does not require *commitment*. The Board distinguishes between requiring a student to *hold* a belief and requiring a student to *simulate* a position for the sake of argument. The original proposal's requirement for a "final adjudication essay defending one interpretation" conflates these two. It is possible to design assessments that evaluate a student's ability to map the logical space of the problem—including the eliminativist critique of the problem itself—without forcing them to declare a personal metaphysical allegiance.

  Consequently, the redesigned course must:
  1.  Explicitly integrate the critique of the "determinate fact" premise as a core module, not an external objection.
  2.  Modify assessment criteria to reward the rigorous exploration of incompatible frameworks rather than the defense of a single "correct" stance.

  **IV. STRONGEST ARGUMENT FOR THE NON-RECOMMENDED OPTION**

  In reaching this decision, the Board gave serious weight to the argument for **Option 1 (Approving the Dual-Track Proposal as Submitted)**. The strongest argument in favor of the Department's original design is that philosophical proficiency is best cultivated through *stakes*.

  Proponents of Option 1 argue that asking students to remain neutral on foundational questions fosters intellectual timidity rather than rigor. By requiring an adjudication essay, the Department forces students to "cash out" their understanding in the currency of belief. This mirrors the real-world conditions of academic philosophy and cognitive science, where researchers must commit to working assumptions to generate hypotheses. To sanitize the course of metaphysical commitment (as per Option 2) or to dilute the requirement to choose (as per our Option 3) risks producing graduates who are adept at describing debates but incapable of intervening in them. The Department rightly contends that a seminar on *The Phenomenal Boundary Problem* that does not force a boundary is merely a seminar on the History of Philosophy of Mind. There is genuine pedagogical value in the friction of the binary choice, as it forces the elimination of equivocation.

  The Board acknowledges this risk. Our decision to require a redesign is not an endorsement of neutrality, but a demand for *completeness*. The Dual-Track design fails not because it demands commitment, but because it demands commitment within a truncated logical space. If the Department can redesign the course to maintain high-stakes argumentation while ensuring the logical space includes the Dean's objection as a live option rather than an external critique, the pedagogical benefits of Option 1 may be retained within the framework of Option 3.

  **V. NEXT STEPS**

  The Department of Cognitive Science is invited to respond to this memo point-by-point in their revised proposal. Specifically, the Board requests clarification on:
  1.  How the revised syllabus will treat the "determinate fact" premise as a variable rather than a constant.
  2.  How assessment rubrics will distinguish between metaphysical commitment and argumentative simulation.
  3.  How the course will integrate the Dean's meta-philosophical concerns without devolving into the historical historicism of Option 2.

  The Board looks forward to reviewing the revised proposal by the December 5 deadline.

  **Signed,**

  *Interdisciplinary Curriculum Oversight Board*
