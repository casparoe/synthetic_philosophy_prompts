          *   Department Proposal: Dual-track seminar (Track A: Dennett/Qualia Incoherence; Track B: Realist/Privately Calibrated Qualia). Final essay requires adjudication/defense of a stance.
          *   Dean's Objection: Both tracks share a hidden premise (determinate fact of the matter about experience change). This excludes eliminativism. Proposes single-track historical/rhetorical analysis only.
          *   Board Options: (1) Approve Dual-Track; (2) Approve Dean's Single-Track; (3) Reject Both/Require Redesign.
      *   **Requirements for the Memo:**
          *   Recommend one option with concrete conditions/timeline.
          *   Engage seriously with the Dean's false-dichotomy objection (shared premise about determinacy).
          *   Address whether qualia courses can be taught without requiring metaphysical commitment.
          *   Include an honest, substantive treatment of the strongest argument for the *non-recommended* option.
          *   Tone: Formal, actionable, allowing point-by-point response from Dean and Chair.

  2.  **Evaluate the Options:**

      *   **Option 1 (Approve Dual-Track):**
          *   *Pros:* Respects departmental academic freedom, engages deeply with the substantive philosophical debate, allows students to take stakes in the material.
          *   *Cons:* The Dean has a strong philosophical point. If the course structure presupposes a determinate fact of the matter (even in Track A's "incoherence" claim, it often relies on the *intuition* that there *should* be one to show it fails), it might bias the inquiry. Requiring a final adjudication essay forces metaphysical commitment, which might be pedagogically premature or exclusionary for a *required* seminar.
      *   **Option 2 (Approve Dean's Single-Track):**
          *   *Pros:* Avoids the false dichotomy, treats the material historically/metaphilosophically, safe from accusations of ideological enforcement.
          *   *Cons:* Neuters the course. A graduate seminar in Cognitive Science on "The Phenomenal Boundary Problem" that forbids substantive metaphysical stances risks becoming a hollow history lesson. It prevents students from learning how to *do* philosophy of mind, reducing it to analyzing *how others did it*.
      *   **Option 3 (Reject Both/Require Redesign):**
          *   *Pros:* Acknowledges the validity of the Dean's critique (the hidden premise) while rejecting the over-correction (banning substantive stances). Allows for a course structure that teaches the debate *including* eliminativism as a live option, without forcing a binary choice or forbidding commitment.
          *   *Cons:* Delays the course, creates more work for the department.

      *   *Decision:* Option 3 is the most philosophically rigorous and pedagogically sound. It validates the Dean's insight (the hidden premise is a problem) but upholds the Department's goal (substantive engagement). It avoids the Scylla of biased metaphysics and the Charybdis of empty historicism.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Board Memo format (To, From, Date, Subject).
      *   **Decision:** Clearly state Option 3 (Reject Both/Require Redesign).
      *   **Timeline:** Set a deadline (e.g., 6 weeks) for a revised proposal for the next academic year (to allow time).
      *   **Engagement with Dean's Objection:**
          *   Acknowledge the strength of her point. The Chase/Sanborn case *does* often presuppose that there is a "fact of the matter" to be found or dissolved.
          *   Explain why Track A & B both fail this test. Track A says "no fact," Track B says "private fact," but both start from "Is there a fact?" rather than "How do we conceptualize the report?"
          *   Acknowledge why the Dean's solution (Option 2) is too restrictive for a graduate seminar.
      *   **Pedagogical Question (Metaphysical Commitment):**
          *   Can you teach this without commitment? Yes, by focusing on *argumentative competence* rather than *belief*.
          *   However, the current proposal *requires* a stance (adjudication essay). This needs changing. Students should evaluate arguments, not necessarily pick a team.
      *   **Strongest Argument for the Non-Recommended Option (Option 1 - Dual Track):**
          *   Need to be fair to the Department. The strongest argument is that philosophy requires *doing*, not just observing. Forcing students to argue for a position is the best way to learn the material. Diluting this (as in Option 2 or a watered-down Option 3) risks creating "philosophical tourists."
      *   **Conditions for Redesign:**
          *   Must explicitly include Eliminativism/Illusionism as a third track or integrated perspective, not just an excluded middle.
          *   Assessment must measure understanding of the *space of possibilities*, not just defense of one.
          *   Syllabus must reflect the meta-philosophical critique the Dean raised.

  4.  **Refining the Argument (Self-Correction/Nuance):**
