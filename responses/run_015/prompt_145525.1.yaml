  2.  **Deconstruct the Philosophical Issue:**
      *   **The Non-Identity Problem (NIP):** Choices affect *who* comes into existence. If a choice leads to a different set of people existing, we cannot say those people are harmed by the choice (unless their lives are not worth living), because without the choice, they wouldn't exist at all. This challenges person-affecting views (we owe duties *to* specific people).
      *   **Impersonal Views (Total/Average Utilitarianism):** These views claim we should maximize value (welfare) regardless of *who* experiences it. They compare states of affairs (World A vs. World B).
