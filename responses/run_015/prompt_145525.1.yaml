answer: |-
  The non-identity problem fundamentally undermines person-affecting principles but does not destabilize impersonal aggregation, because impersonal theories bypass the need for trans-world individual identity by evaluating states of affairs based solely on the welfare values present within them. Person-affecting views fail in these cases because they require a specific individual to be worse off than they would otherwise have been, a condition impossible to meet when the choice determines whether that individual exists at all. Impersonal views avoid this constraint by treating welfare as a value independent of the identity of the bearer, allowing for direct comparison between the aggregate welfare in one outcome versus another without tracking specific persons across possible worlds. The concern about reference class arbitrariness conflates the non-identity problem with the separate scope question of which beings matter morally; impersonal aggregation defines its reference class exhaustively as all sentient beings existing in a given outcome, which is a fixed parameter for that scenario rather than an arbitrary selection. While impersonal views face distinct challenges such as the Repugnant Conclusion, these arise from the implications of maximizing value rather than the metaphysical impossibility of cross-world individual comparison that defines the non-identity problem. Consequently, the non-identity problem is widely regarded in moral philosophy as a primary motivation for adopting impersonal views rather than a refutation of them.
