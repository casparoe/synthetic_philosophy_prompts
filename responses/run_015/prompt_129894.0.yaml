      *   *Differentiation:*
          *   Honest Error: No motive to deceive, reasonable care taken.
          *   Knowing Misconduct: Clear evidence of intent to falsify/fabricate.
          *   The Middle (WB vs. SD): This is the crux.
          *   WB Marker: Awareness of risk + Active avoidance. (e.g., "Don't look at that file," "Ignore that outlier").
          *   SD Marker: Motivated reasoning + Sincere belief at time of action. (e.g., Convincing oneself the outlier is noise without checking).

