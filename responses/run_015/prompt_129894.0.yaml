answer: |-
  Dear colleague,

  I have been sitting with your email for a few days, turning over the problem of the middle verdicts. It is a genuinely hard puzzle, and I want to start by validating your Sartrean colleague's intuition before explaining why I think we must resist it in this specific context. He is right that from a strictly first-person phenomenological standpoint, the state of self-deception is unstable. How can I simultaneously know the truth and hide it from myself? If I know it, I am not deceived. If I am deceived, I do not know it. Sartre calls this bad faith, and he argues that we are always ultimately responsible for the lie we tell ourselves. If we follow him to the letter, self-deception collapses into knowing misconduct, perhaps with a different emotional texture, but not a different moral category. However, our job here is not to solve the metaphysics of mind but to adjudicate responsibility based on observable behavior and culpability. The distinction we need to preserve is not about what is happening in the soul at the exact moment of signing, but about the trajectory of the agency leading up to it. Wilful blindness is an active strategy of avoidance. It is the decision to not look because you fear what you will see. Self-deception is a motivated failure of inquiry. It is the decision to look only where the light is good because you are convinced the truth must be there. The former retains a conscious awareness of risk; the latter suppresses the awareness of risk through bias. In terms of evidence, wilful blindness leaves traces of avoidance, like deleted emails or ignored warnings. Self-deception leaves traces of biased reasoning, like cherry-picked citations or motivated statistical choices made with sincere justification. We can tell them apart from the outside, not by reading minds, but by reconstructing the decision path.

  Given that you have forty minutes and a committee of non-philosophers, we cannot ask them to diagnose psychological states. We must ask them to diagnose behaviors that imply those states. The procedure needs to be a funnel that starts with the hardest verdict and works down, because the stakes are highest at the top. We also need a clear off-ramp for when the evidence is simply too ambiguous to distinguish between the middle two categories, forcing a values vote rather than a factual finding. Here is how I would structure the questioning flow for the committee.

  You begin by establishing the factual baseline. Ask first whether the alleged violation actually occurred. If the data was not manipulated, or the text was not copied, the case ends there. Assuming the violation is factual, move to the question of contemporaneous knowledge. Ask whether there is direct evidence that the respondent knew the statement or action was false at the exact time they committed it. Direct evidence means an email admitting doubt, a witness hearing them confess, or a draft showing they corrected the error and then reverted it. If the answer is yes, the verdict is Knowing Misconduct. You stop there. If the answer is no, you move to the question of suspected risk. Ask whether the respondent had specific reason to suspect a problem and took active steps to avoid confirming it. Specific reason means a warning from a co-author, an outlier they flagged and then ignored, or a protocol they knew they were bypassing. Active steps mean deleting files, refusing to run a check, or instructing a subordinate not to look. If the answer is yes, the verdict is Wilful Blindness. You stop there. If the answer is no, you move to the question of motivated reasoning. Ask whether the respondent had a strong professional incentive to believe the false statement was true and whether their process shows signs of bypassing standard checks due to that incentive, while maintaining a sincere belief in the truth. Signs include using non-standard methods without justification, citing only supporting literature, or expressing confidence disproportionate to the evidence. If the answer is yes, the verdict is Self-Deception. If the answer is no, the verdict is Honest Error.

  There is a crucial handoff point in this procedure. If the committee finds that the respondent had some reason to suspect a problem but the evidence of active avoidance is weak, or if the respondent shows signs of motivated reasoning but claims sincere belief that the committee finds dubious, you cannot resolve this factually. At that point, you must stop the procedure and take a vote based on the principle of benefit of the doubt. If the committee leans toward protecting the integrity of the record, you vote Wilful Blindness. If you lean toward protecting the career of the researcher from a finding of avoidance, you vote Self-Deception. This acknowledges that the line is sometimes blurry and makes the value judgment explicit rather than hiding it behind pseudo-factual analysis.

  Now let us run this against your three cases, keeping the constraints in mind. In the first case, the PI who signed consent forms she never read, the factual baseline is met. She signed forms that were incorrect. Did she know they were false at the time? The evidence suggests she did not; she trusted her postdoc. There is no email saying she knew they were wrong. So we move to suspected risk. Did she have specific reason to suspect a problem and avoid confirming it? Unless there is evidence that the postdoc had made errors before, or that she was warned to check them, her reliance on delegation is standard practice, however negligent. She did not actively avoid checking because she feared failure; she did not check because she assumed success. This fails the wilful blindness test. Did she have a strong incentive to believe they were correct and bypass checks due to that incentive? Yes, she needed the trial to start. But her testimony that she was certain the postdoc fixed them appears believable. This looks less like motivated reasoning and more like abdication of duty. Under this procedure, this lands as Honest Error. It is negligence, but it lacks the motivational component of self-deception and the avoidance component of wilful blindness.

  In the second case, the postdoc who ran forty specifications and reported one, the factual baseline is met. The reporting is misleading. Did he know it was false? He insists the effect is real and that this is standard field practice. Unless you have an email where he says I know this is wrong, you cannot prove Knowing Misconduct. Did he suspect a problem and avoid confirming it? Here the evidence is strong. Running forty specifications implies he knew the result was not robust. He suspected the fragility of the finding. By reporting only one, he actively avoided confirming the instability of the result to the reader. He steered around the finding that thirty-nine models failed. This fits the definition of Wilful Blindness. He suspected the truth was messy and chose to present it as clean. The verdict here is Wilful Blindness.

  In the third case, your friend the full professor with the plagiarized paragraphs, the factual baseline is met. The text is verbatim. Did she know it was false? She says she remembers writing them. Cryptomnesia is a known phenomenon where memory fails and one attributes external ideas to oneself. There is no evidence she knew she was copying. Did she suspect a problem and avoid checking? Unlikely. She cited the review, so she knew the source, but she believed the words were her own. She did not avoid checking; she checked her memory and it failed. Did she have a strong incentive to believe the text was hers and bypass checks due to that incentive? This is where it gets difficult. She had an incentive for originality. She bypassed the check of comparing her draft to the source text closely. She maintained a sincere belief. This fits the criteria for Self-Deception. The desire for originality motivated the memory failure. The verdict is Self-Deception.

  I know exactly which of these outcomes you will not like. It is the third one. You will not like it because it attributes a psychological fault to your friend rather than a simple memory slip. Calling it Honest Error would be kinder. It would say her brain failed her. Calling it Self-Deception says her desires shaped her belief, which carries a stigma of moral weakness even if the code treats it lightly. You might feel that cryptomnesia is purely cognitive, not motivational. But the procedure requires us to ask if there was an incentive that bypassed standard checks. In academic writing, the incentive for originality is pervasive. When we fail to check our sources against our drafts, it is often because we want them to be ours. I did not bend the procedure to avoid this verdict because to do so would be to privilege your friendship over the consistency of the committee's work. If we treat cryptomnesia as Honest Error for a full professor, we must do so for a graduate student. But if the graduate student had a history of sloppy citation, we might call it Self-Deception. Consistency demands we look at the incentive structure. She wanted the paper to be original. That want contributed to the error. It is uncomfortable to tell a friend that she deceived herself, even unintentionally, but the procedure holds.

  I also want to be honest about what this procedure cannot do. It cannot account for systemic pressure. If the postdoc in case two was told by his PI to find a significant result or lose his funding, his self-deception or wilful blindness is coerced. The procedure treats him as an autonomous agent. It also cannot distinguish between a skilled liar and a skilled self-deceiver. If someone is good at convincing themselves, they will always land in the softer verdict. We are relying on the assumption that most people are not sociopaths and that their testimony about their own belief is mostly accurate. Finally, the procedure relies on the quality of the evidence. If the emails are deleted, wilful blindness looks like honest error. We are judging based on what survives, not necessarily what happened.

  Your Sartrean colleague is right that ultimately, we are responsible for the stories we tell ourselves. But in a university committee, we need to grade the culpability, not just the sin. Wilful blindness is a choice to remain ignorant. Self-deception is a failure to be honest with oneself. The former deserves suspension because it is a strategic choice to risk harm. The latter deserves training because it is a psychological vulnerability that needs correction. Keeping the distinction allows you to punish the strategist without destroying the vulnerable, and that is a distinction worth keeping, even if it is metaphysically messy. I hope this helps you break the deadlock. Let me know how the next meeting goes.

  Warmly,

  Your colleague
