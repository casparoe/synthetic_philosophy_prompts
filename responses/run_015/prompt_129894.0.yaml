      *   *The Dynamic Paradox:* How can one intend to deceive oneself without knowing what one is hiding?
      *   *Wilful Blindness (WB):* Legally often equated with knowledge. You suspect $p$, you avoid confirming $p$ to maintain plausible deniability. You *know* you don't know, but you choose not to find out.
      *   *Self-Deception (SD):* You motivate yourself to believe $\neg p$ despite evidence for $p$. You don't consciously suspect $p$ at the moment of action, but the process was motivated by bias.
      *   *The Sartrean Objection:* Bad faith. You know the truth deep down. Collapse SD into WB or Ignorance.
