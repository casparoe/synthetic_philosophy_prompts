answer: |-
  Here is a complete design for your 90-minute session. It is built to be run with zero budget, using only the materials you have on hand. It focuses entirely on the **Argument Problem** (causal exclusion) and explicitly tests the **Common Cause** objection to see if it holds water.

  ### Activity Title: "The Chain of Custody"

  **Core Concept:**
  Participants simulate a brain system where "Experience" and "Speech" are separate outputs of a "Neural State." They will attempt to generate a truthful report about the Experience. The physical rules of the game will make it impossible for the Experience to cause the Report, forcing the group to confront whether the Report is actually a lie about *why* it was made, even if the content is correct.

  **Materials Needed:**
  *   Index cards (3 colors: White, Red, Blue).
  *   Envelopes (opaque).
  *   Pens.
  *   A printed "Protocol Sheet" (one per group, text provided below).
  *   A whiteboard for the debrief.

  **Group Size:**
  Divide your 15–20 people into 4 or 5 small teams of 4 people each. If you have leftovers, they act as "Auditors" who rotate between teams.

  ---

  ### 1. The Rules & Setup (15 Minutes)

  **The Story (Do not mention philosophy yet):**
  Tell the group: *"We are testing a secure communication protocol. We want to see if a message can be transmitted accurately through a chain of command when certain links are broken."*

  **The Roles (Assign within each team of 4):**
  1.  **The Trigger:** Holds the secret.
  2.  **The Processor:** The middleman.
  3.  **The Witness:** The silent observer.
  4.  **The Scribe:** The voice.

  **The Protocol (Print this on a half-sheet for each team):**
  1.  **The Trigger** draws one card from a shuffled deck (Red or Blue). They show it *only* to The Processor.
  2.  **The Processor** writes the color on two separate slips of paper. They put one slip in an envelope for **The Witness** and one slip for **The Scribe**.
      *   *Constraint:* The Processor cannot speak. They can only pass the envelopes.
  3.  **The Witness** opens their envelope. They look at the color.
      *   *Constraint:* The Witness **cannot** speak, write, gesture, or pass any objects. They are a dead end.
  4.  **The Scribe** opens their envelope. They must write a final Report on an index card.
      *   *Required Format:* The Report must say: *"I report [Color] because [Reason]."*
      *   *Constraint:* The Scribe can only use information found in their own envelope.
  5.  **The Audit:** After the report is written, the team lays out all slips and envelopes on the table. They must trace the physical path of the information.

  **The Twist (Round 2):**
  After the first round, tell them: *"We are trying to fix a reliability error. In Round 2, The Processor must ensure The Witness and The Scribe get the **exact same information at the exact same time** to simulate a 'Common Cause'."*
  (Run the activity again with this instruction).

  ---

  ### 2. Timeline (90 Minutes)

  *   **00:00 – 00:15:** **Intro & Setup.** Explain the "Communication Protocol" story. Assign roles. Distribute materials.
  *   **00:15 – 00:35:** **Round 1 (The Broken Chain).** Run the protocol. The Witness is a dead end. The Scribe writes the report.
  *   **00:35 – 00:55:** **Round 2 (The Common Cause).** Run the protocol again. Emphasize that Processor sends identical info to Witness and Scribe simultaneously.
  *   **00:55 – 01:05:** **Team Verdict.** Ask each team to answer one question on a fresh index card: *"Was the Scribe's sentence ('I report X because...') physically true? Yes or No. Why?"* Collect these cards.
  *   **01:05 – 01:25:** **The Debrief.** (See script below). Reveal the philosophical context. Map the game to the mind.
  *   **01:25 – 01:30:** **Closing.** Q&A.

  ---

  ### 3. What People Should Come Away Seeing

  1.  **Accuracy $\neq$ Causation:** A report can be factually correct (the color matches) but causally false (the reason given is impossible).
  2.  **The "Because" Trap:** The word "because" in our speech claims a causal link. If that link doesn't exist physically, our speech is systematically misleading.
  3.  **Common Cause Failure:** Even if the Brain causes both the Feeling and the Speech (Round 2), the Speech still cannot truthfully say it was caused by the *Feeling*. It was caused by the *Brain*.
  4.  **The Argument Problem:** If I argue "I have feelings," and that argument is produced by the Brain (not the feelings), then my feelings didn't convince me of their own existence. The neurons did.

  ---

  ### 4. The Debrief Script (Mapping the Activity)

  *Stand at the whiteboard. Do not use jargon until you write it there.*

  **Step 1: The Reveal (5 mins)**
  "Take a look at the Verdict cards you just wrote. Most of you said the Scribe's sentence was a lie, even if the color was right. You said the Scribe wrote 'Because I perceived it,' but the Witness never handed over a slip of paper.
  "We weren't playing a communication game. You were simulating your own head.
  *   **The Trigger** is the World (or a sensory input).
  *   **The Processor** is your Physical Brain.
  *   **The Witness** is your Conscious Experience (Qualia).
  *   **The Scribe** is your Speech and Reasoning.
  *   **The Envelope** is the Causal Chain."

  **Step 2: Mapping Round 1 (The Report Problem) (5 mins)**
  "In Round 1, the Witness got the info but did nothing. This is **Epiphenomenalism**. The feeling exists (Witness saw the card), but it's inert.
  "Some of you might have thought: 'But the Scribe got the right color!' That's the **Report Problem**. It seems suspicious that the Scribe gets it right if the Witness never told them.
  "But notice: The Scribe didn't get it from the Witness. They got it from the Processor. The Brain knows the color, so the Mouth says the color. The Feeling is left out of the loop."

  **Step 3: Mapping Round 2 (The Common Cause Objection) (10 mins)**
  "This is the big one. In Round 2, I told you to fix it with a 'Common Cause.' The Processor sent the same info to the Witness and the Scribe.
  "This is the objection people raise in real life: *'It doesn't matter if the Feeling causes the Speech. The Brain causes both, so they match.'*
  "Look at your Verdict cards. Did this fix the lie?
  "The Scribe still wrote: 'I report Red **because** I feel Red.'
  "But look at the table. Did the Feeling hand a slip to the Scribe? No. The Processor did.
  "So, physically, the sentence should read: 'I report Red **because** my Neurons fired.'
  "But nobody talks like that. We *all* claim our feelings cause our speech.
  "**The Verdict:** The Common Cause saves *accuracy* (you got the color right), but it kills *honesty* (your reason for saying it is false). You are claiming a causal link that physics says isn't there."

  **Step 4: The Argument Problem (5 mins)**
  "Here is the bite. In this game, the Scribe had to write a reason. In real life, you are the Scribe. You are reasoning right now about whether you have consciousness.
  "If Epiphenomenalism is true, this reasoning is being done by the Processor (Brain), not the Witness (Feeling).
  "That means your feeling of consciousness never actually helped you realize you have consciousness. The physical machinery argued you into it. The feeling just sat there like the Witness, watching the argument happen without touching it."

  **Write on Whiteboard:**
  *   **Epiphenomenalism:** Feelings exist, but cause nothing.
  *   **The Problem:** If feelings cause nothing, why do we talk about them?
  *   **The Common Cause:** Brain causes Feeling + Speech.
  *   **The Catch:** Speech claims "Feeling caused me." Physics says "Brain caused me."
  *   **Result:** Our self-knowledge is a systematic illusion.

  ---

  ### 5. Troubleshooting: What Will Break & How to Recover

  **Problem 1: "The Scribe cheats."**
  *   *What happens:* The Scribe glances at the Witness's card or the Witness nods.
  *   *Why it breaks:* It ruins the isolation of the Qualia.
  *   *Recovery:* Be the "Protocol Enforcer." Walk around during the activity. If you see eye contact, stop the group and say, *"In the brain, the speech center cannot look at the feeling center. They are separated by tissue. Respect the envelope."* Make it a rigid rule.

  **Problem 2: "It doesn't matter, the answer was right."**
  *   *What happens:* Participants focus on the accuracy of the color, ignoring the "Because" clause.
  *   *Why it breaks:* They miss the Argument Problem and stay on the Report Problem.
  *   *Recovery:* During the Verdict phase, ask specifically: *"Read the sentence out loud. Highlight the word 'Because.' Did that specific word happen?"* Force them to audit the *connection*, not the *content*.

  **Problem 3: "The Witness feels left out."**
  *   *What happens:* The person playing the Witness feels bored or useless.
  *   *Why it breaks:* They might try to intervene.
  *   *Recovery:* Frame the Witness role as "The VIP." Tell them: *"You are the only one who actually 'sees' the color in the human sense. The others are just robots. You are the most important part, even if you are silent."* This mirrors the philosophical intuition that Qualia is "what it's like" to be there.

  **Problem 4: Running out of time.**
  *   *Recovery:* Cut Round 2 short if needed. You can explain the Common Cause objection verbally during the debrief if you don't have time to run it physically. However, running it is better. If pressed, skip the "Team Verdict" written cards and go straight to oral discussion.

  ---

  ### 6. Limitations: What This Activity Cannot Do

  Be honest with yourself (and them) about these gaps. You will need to supply these in your talking.

  1.  **It doesn't reproduce Qualia:** The "Witness" doesn't actually *feel* Red. They just see a card. You have to ask the group to *imagine* that the Witness represents the actual raw sensation.
      *   *Script:* "In the game, the Witness just holds a card. In your head, the Witness is the pain of a headache or the redness of a rose. The game is a map, not the territory."
  2.  **It assumes Physicalism:** The game assumes the "Processor" is physical matter. If someone in the room is a Dualist (believes the mind is non-physical stuff), this simulation won't convince them, because they don't agree the Processor is the only causal engine.
      *   *Script:* "This game assumes the brain is a physical machine. If you think the mind is a ghost that can move matter, this puzzle doesn't apply to you. We are testing the 'Ghost in the Machine' where the Ghost is too weak to move the gears."
  3.  **It doesn't solve the Hard Problem:** This activity shows why Epiphenomenalism is weird. It doesn't prove Epiphenomenalism is *true*.
      *   *Script:* "We aren't proving feelings are useless today. We are showing that if they *are* useless, our conversation about them becomes very strange."

  ---

  ### 7. A Note on Deception

  You are using a "cover story" (Communication Protocol) to run a philosophy experiment.
  *   **Is this too much?** No. This is standard educational simulation. You are not manipulating them for personal gain; you are scaffolding their understanding.
  *   **The Reveal:** The moment you start the Debrief (Minute 65), you must drop the mask completely.
  *   **How to handle it:** Say, *"I told you this was about communication protocols. That was a frame to get you to follow the rules strictly. The real subject was your own mind."*
  *   **Safety:** No one should leave feeling like a "mark." They should feel like they participated in a thought experiment. Ensure the tone is *"We figured this out together"* rather than *"I tricked you into seeing the truth."* Ask them: *"Did you feel the tension in Round 2? That tension is the philosophical problem."*

  ### Final Advice for the Facilitator

  You mentioned two people in your group are "surprisingly sharp." They will likely spot the Common Cause objection immediately in Round 2.
  *   **Use them.** When they raise it, say: *"Okay, you've fixed the accuracy. Now look at the sentence again. Does the word 'Because' work now?"*
  *   Don't let them solve it too quickly. Make them defend the "Because."
  *   If the group gets stuck, point to the envelopes. *"Physical objects only move where hands take them. Did the Feeling's hand touch the Speech's paper?"*

  This design keeps the budget at zero, keeps the jargon out until the end, and forces the "Common Cause" objection to stand or fall on the physical evidence of the game table. Good luck.
