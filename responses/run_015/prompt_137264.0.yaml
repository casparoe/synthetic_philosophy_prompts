answer: |-
  Here is a complete run-sheet for the seminar. It is designed to be handed to you as a lesson plan.

  # Seminar Plan: The Transmission Game
  **Topic:** Knowledge-How vs. Knowledge-That (Ryle vs. Intellectualism)
  **Time:** 75 Minutes
  **Class Size:** 16 Students (4 Teams of 4)
  **Materials Needed:**
  *   8 x Cheap ballpoint pens (Type X: standard clicker).
  *   8 x Different pens (Type Y: capped or weighted).
  *   4 x Printed "Skill Cards" (see below).
  *   4 x Packs of Index Cards (for manuals).
  *   4 x Printed Score Sheets.
  *   Whiteboard/Projector for scoring summary.

  ## 1. The Skill: The Pen Thumbaround
  **Why:** It is binary (completes or drops), highly motor-dependent, notoriously difficult to describe without deictic terms ("this way", "left"), and has an obvious variant (other hand).
  **Success Condition:** The pen rotates 360° around the thumb and is caught in the starting position without being grabbed by the other hand.
  **Variant:** Perform the same spin with the **non-dominant hand**.
  **Parakeet Check:** Perform with **Type Y pen** (different weight/balance).

  ---

  ## 2. The Setup (0:00 – 0:05)
  **Instructor Script:**
  > "We are going to run a transmission tournament. You will work in teams of four. In each team, you will be assigned roles: **Source (A)**, **Apprentice (B)**, **Reader (C)**, and **Auditor (D)**.
  >
  > Your goal is to maximize your team's total points. However, your *individual* points are calculated differently. You will not know your teammates' scoring rubrics until the end.
  >
  > **The Rules of Engagement:**
  > 1.  **No Phones:** No recording, no searching, no slow-motion video. Physical transmission only.
  > 2.  **The Ban:** In any written manual, you are forbidden from using 'pointing words'. This includes: *left, right, up, down, towards, away, this, that, clockwise, counter-clockwise.* You must describe objects by their intrinsic properties (e.g., 'the end with the clip').
  > 3.  **The Silence:** During performance rounds, no talking unless instructed.
  >
  > Distribute the Role Cards and Skill Cards now."

  **Physical Handout (The Skill Card):**
  *   *Given only to Person A (Source).*
  *   Contains a 6-step diagram of the Thumbaround with no text.
  *   *Note:* Person A gets 5 minutes private practice time with a Type X pen before Round 1 begins. This ensures A actually possesses the skill before teaching.

  ---

  ## 3. The Rounds (0:05 – 0:50)

  ### Round 1: Demonstration & Mimicry (15 Mins)
  *   **Action:** A teaches B. A may demonstrate as many times as they like. A may not touch B's hands. B may ask questions.
  *   **Performance:** B must perform the **Original Skill** (Dominant hand, Type X pen) 3 times.
  *   **Scoring Logic (Hidden):**
      *   **B's Score:** Based *only* on these 3 attempts. (Incentivizes B to demand exact mimicry).
      *   **A's Score:** Based *only* on B's performance in **Round 3** (The Variant). (Incentivizes A to teach principles/balance, not just movements).
  *   **Instructor Note:** Watch for A trying to physically guide B. Block this. "No touching."

  ### Round 2: Codification (20 Mins)
  *   **Action:** A leaves the room (or turns back). A must write a manual on Index Cards for C.
  *   **Constraint:** **The Ban** is in effect. No pointing words. If C asks a question, A can only nod/shake head or add to the text. No speaking.
  *   **Performance:** C reads the manual. C has never seen the skill. C attempts the **Original Skill** (Dominant hand, Type X pen) 3 times.
  *   **Scoring Logic (Hidden):**
      *   **A's Score:** 50% of A's total comes from C's success here. (Tests if KH can be reduced to KT).
      *   **C's Score:** Based on success here.
  *   **Parakeet Check:** On the 4th attempt, swap C's Type X pen for a **Type Y pen**. Record success/fail separately.

  ### Round 3: Stress & Transfer (15 Mins)
  *   **Action:** B returns to the front.
  *   **Condition 1 (Transfer):** B must perform the **Variant** (Non-dominant hand, Type X pen).
  *   **Condition 2 (Interference):** While performing, B must **narrate** their actions step-by-step out loud. ("I am applying pressure to the...")
  *   **Scoring Logic (Hidden):**
      *   **A's Score:** The remaining 50% comes from B's success here.
      *   **B's Score:** Unaffected by this round (creating the tension).
  *   **Auditor (D):** D's only job is to verify successes and ensure no rules were broken. D gets points for catching rule violations.

  ---

  ## 4. Scoring Arithmetic (Instructor Only)
  *Do not reveal this until the debrief.*

  | Role | Score Component 1 (50%) | Score Component 2 (50%) | The Tension |
  | :--- | :--- | :--- | :--- |
  | **A (Source)** | **C's Text Success** (Round 2) | **B's Variant Success** (Round 3) | A must balance teaching *rules* (for C) vs. teaching *feel/principles* (for B's adaptation). |
  | **B (Apprentice)** | **B's Original Success** (Round 1) | **N/A** | B is incentivized to ignore A's principles and just copy the movement to pass Round 1 quickly. |
  | **C (Reader)** | **C's Text Success** (Round 2) | **Parakeet Bonus** (+5 pts if Type Y pen works) | Tests if the text conveyed a generalizable rule or a specific recipe. |
  | **D (Auditor)** | **Accuracy** (Correctly flagged failures) | **Rule Enforcement** (Caught pointing words) | Keeps the game honest. |

  ---

  ## 5. The Debrief (0:50 – 1:15)
  *Do not start by defining KH/KT. Start by revealing the scores.*

  **Step 1: Reveal the Rig (5 Mins)**
  *   Write the scores on the board.
  *   Reveal that A's score depended on B's *Variant* performance, while B's score depended on *Original* performance.
  *   **Ask:** "Did A and B feel pulled in different directions during Round 1?"
  *   **Expected Outcome:** A wanted to explain *balance/physics*; B wanted to copy *finger placement*.

  **Step 2: Map the Failures (10 Mins)**
  *   **The Failed Manual (Round 2):**
      *   *Observation:* Most manuals failed even with the "No Pointing Words" rule.
      *   *Philosophical Map:* Evidence for **Ryle**. If KH were just KT (propositions), a sufficiently precise manual should work. The breakdown suggests KH involves something non-propositional (dispositions).
      *   *Intellectualist Counter:* "The manual was just *bad* KT. If we had infinite time and perfect language, it would work." (Invite students to defend this).
  *   **The Narration Wreckage (Round 3):**
      *   *Observation:* B likely stumbled or failed when narrating.
      *   *Philosophical Map:* Evidence for **Ryle**. Thinking about the steps (KT) interferes with the doing (KH). KH is not "thinking then doing"; it is a unified capacity.
      *   *Intellectualist Counter:* "Dual-tasking is hard. Talking uses working memory. It doesn't prove the knowledge isn't propositional, just that accessing it verbally is costly."
  *   **The Parakeet Check (Type Y Pen):**
      *   *Observation:* Some succeeded with Type X but failed with Type Y.
      *   *Philosophical Map:* Distinction between **Routine** (blind habit) vs. **Skill** (adaptive intelligence). Ryle argues KH *must* be adaptive. If you can't adapt, you're a parakeet, not a knower.
      *   *Intellectualist Counter:* "They lacked the *relevant* proposition about weight distribution. Add that proposition, and they adapt."

  **Step 3: The Hard Pivot (Final 10 Mins)**
  *   **Instructor Script:**
      > "You have just felt the gap between being able to do something and being able to say it. Ryle says this gap proves they are different *kinds* of knowledge. Intellectualists (like Stanley & Williamson) say 'No, knowing-how is just a species of knowing-that.'
      >
      > **What this game didn't show:**
      > 1.  **Mode of Presentation:** Intellectualists argue you *do* have the propositions in your head during Round 1, but you grasp them under a 'practical mode of presentation.' You can't say them because language is clumsy, not because the knowledge isn't propositional.
      > 2.  **The Gettier Problem:** What if B succeeded in Round 1 by luck? Did B *know* how?
      > 3.  **Normativity:** Knowledge implies correctness. In the game, 'success' was mechanical (pen didn't drop). In philosophy, 'success' is doing it *right* according to a norm.
      >
      > **Your task for next week:** Read Stanley. Argue why the 'Failed Manual' in Round 2 doesn't disprove his theory. Hint: Focus on the difference between *possessing* a proposition and *expressing* it."

  ---

  ## 6. Troubleshooting: What Will Go Wrong
  *Be ready for these specific failures.*

  **1. "I just can't do the skill." (Person A or B)**
  *   **Prediction:** 1-2 students will lack the fine motor dexterity for the pen spin, regardless of instruction.
  *   **Fix:** **The Swap Rule.** Allow the team to swap roles *once* before Round 1 starts if A cannot master the skill in the 5-minute practice window.
  *   **Why:** If A fails, the chain breaks. The lesson is about transmission, not dexterity. If they swap, the new A learns from the diagram.

  **2. "I filmed it on my phone."**
  *   **Prediction:** A student tries to record the demo to show C or review later.
  *   **Fix:** **Hard Block.** "If a phone is out, that team is disqualified from the 'Text' round." Collect phones at the start if necessary.
  *   **Why:** The game relies on the degradation of information. Digital preservation ruins the epistemic point.

  **3. "The manual says 'Ask A'."**
  *   **Prediction:** A writes "See me for demo" to bypass the text constraint.
  *   **Fix:** **Pre-Check.** Instructor must sign off on the manual before C sees it. If it violates the "Self-Contained" rule, A loses the Text Score points immediately.
  *   **Why:** This tests the *sufficiency* of propositions. If the proposition is "Go watch A," that's not knowledge-that, it's a referral.

  **4. "We used 'Left/Right' anyway."**
  *   **Prediction:** Students cheat on the "No Pointing Words" rule.
  *   **Fix:** **Auditor Power.** Empower Person D (Auditor). If D catches a banned word, A loses 5 points. Give D a checklist of banned words.
  *   **Why:** The breakdown of language is the point. If they use "Left," they bypass the philosophical problem.

  ---

  ## 7. Limitations: What You Must Supply
  *The game creates the intuition, but it does not win the argument. You must explicitly cover these gaps in the final lecture.*

  1.  **The "Bad Proposition" Defense:** The game suggests KH cannot be KT because the KT (manual) failed. You must explain that Intellectualists claim the *failure of language* is not the *failure of knowledge*. The student might possess the proposition "apply torque vector X" without having the English words for it.
  2.  **Practical Mode of Presentation:** This is the strongest Intellectualist move. You need to explain that one can know a proposition *practically*. The game treats "Knowing-That" as "Knowing-That-Verbally." You must distinguish *possessing* truth conditions from *articulating* them.
  3.  **The Normative Element:** The game measures *success* (pen spins). Philosophy measures *normativity* (doing it correctly). A parakeet can succeed (spin the pen) without knowing (understanding the norm). You need to clarify that Ryle cares about the *capacity to correct errors*, not just the success rate.
  4.  **Infinite Regress:** Ryle's main argument is that if KH were KT, you'd need another rule to apply the rule (intellectualist legend). The game hints at this (Narration wrecking performance), but you need to explicitly draw the regress argument on the board to solidify the Rylean position.

  ## 8. Instructor Cheat Sheet (The "Rig" Summary)
  *Keep this on your podium.*

  *   **Tension:** A needs B to **Adapt** (Variant). B needs to **Copy** (Original).
  *   **Break Point:** Round 2 (Text). If they succeed, Intellectualism looks good. If they fail (likely), Ryle looks good.
  *   **Break Point:** Round 3 (Narration). If talking wrecks doing, Ryle looks good.
  *   **Key Question for Debrief:** "Was the manual failure a failure of *knowledge* or a failure of *translation*?" (This is the crux of the debate).
