answer: |-
  ### Note to the Supervising Teacher

  **Regarding the "Intellectual Honesty" point:**
  Yes, this is a real feature of Lakatos's position, though it is often overlooked. In *Falsification and the Methodology of Scientific Research Programmes* (1970), Lakatos acknowledges that his methodology is not an algorithm that forces immediate abandonment. However, he argues for a rule of "intellectual honesty": scientists should openly admit when their programme is degenerating (i.e., producing only post-hoc adjustments without novel predictions) rather than masking it. While this doesn't logically *force* abandonment, it informs the "court of appeal" (the scientific community/funding bodies) that resources should shift to progressing programmes. I have incorporated this into the Model Answer and Marking Scheme. It is safe to use in the exam hall.

  **Regarding the Added Detail:**
  To ensure Point 3 (Hard Core Conventionality) is testable without external knowledge, I have added one sentence to the opening description of the Selene Hard Core in the Question Paper below.
  *Added Detail:* "The original 1920s grant application defined the 'substance' functionally as 'whatever causes sleep', not chemically."
  *Reason:* This creates ambiguity over whether shifting from "one substance" to "several" violates the Hard Core or merely refines the Belt, forcing the candidate to argue the convention rather than recall a fact.

  ***

  ### Part 1: The Exam Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,200 words maximum
  **Marks:** 25

  **Question:**
  **"Assess the Lakatosian case for renewing the Selene Programme's funding in 1996."**

  **Instructions:**
  Answer the question using the case study below and your knowledge of Imre Lakatos's Methodology of Scientific Research Programmes (MSRP). You are not required to cite specific texts or dates, but you must use the correct technical terminology (e.g., hard core, protective belt, novel facts). Your answer should take a definite position on the funding decision while acknowledging the limitations of the methodology.

  **Case Study: The Selene Programme (1920–1996)**
  The Selene Programme researches the physiology of sleep.
  **Hard Core:** During waking the brain accumulates a single blood-borne sleep-promoting substance; sleep just is the clearance of that substance; nothing else causes sleep onset. *Note: The original 1920s grant application defined the 'substance' functionally as 'whatever causes sleep', not chemically.*
  **Positive Heuristic:** Develop assays to isolate the factor; map the clearance pathways.
  **History:**
  *   **1920s–30s:** Predicts transfusion from sleep-deprived to rested animals induces sleep (corroborated). Predicts factor is heat-stable/low molecular weight (corroborated).
  *   **1950s:** Predicts a hypothalamic sleep centre; lesions produce insomnia (corroborated, though later confounded by damage to arousal pathways).
  *   **1960s–80s:** Substance never isolated. Every purification yields several active fractions.
  **Belt Adjustments:** To save the core, the belt was extended four times: (1) there are several substances rather than one; (2) they act redundantly; (3) production is in the gut/liver, not brain; (4) old transfusion results were partly artefacts of the procedure.
  **Recent Tests:** Two new predictions extracted from these additions (double knockouts abolish sleep; receptor antagonists produce waking) both **failed**.
  **The Rival:** The Local–Circadian Programme treats sleep as a property of local cell assemblies. It predicts local sleep-like activity in awake animals (confirmed 1980s) and re-explains the transfusion result as an artefact. It has a preliminary model for the lesion data but no tested predictions of its own yet.
  **The Decision:** It is 1996. The Research Council must decide whether to renew Selene's ten-year funding block. Defenders say mature programmes pass through degenerating phases. Critics say the belt is patched so often that nothing counts against the core.

  ***

  ### Part 2: Model Answer

  **Title:** Assess the Lakatosian case for renewing the Selene Programme's funding in 1996.

  **Answer:**

  On Lakatosian grounds, the Research Council should not renew the Selene Programme's ten-year block grant. While Lakatos warns against abandoning programmes merely due to anomalies, the Selene Programme has crossed the threshold from a degenerating phase into a state where it no longer commands the rational allocation of scarce resources. The decision rests on three Lakatosian criteria: the distinction between theoretical and empirical progress, the absorption of excess content by rivals, and the rule of intellectual honesty.

  First, we must appraise Selene's problemshifts. Lakatos distinguishes between a *progressive* problemshift, where belt adjustments lead to novel predictions, and a *degenerating* one, where adjustments merely accommodate past data. Selene's early history was progressive: the transfusion and molecular weight predictions were novel and corroborated. However, from the 1960s onwards, the programme entered a degenerating phase. The four belt adjustments (multiple substances, redundancy, gut production, artefact explanation) were purely protective. Crucially, the two predictions extracted from these adjustments (knockouts and antagonists) failed. On Lakatos's criteria, a programme that consistently produces post-hoc explanations without novel corroboration is degenerating. The defenders' claim that "every mature programme passes through a degenerating phase" is technically true—Lakatos allows for temporary setbacks—but a thirty-year streak of failed novel predictions suggests structural decay rather than temporary trouble.

  Second, we must consider the Hard Core. Here, the case turns on convention. The original grant defined the substance functionally ('whatever causes sleep'), not chemically ('one molecule'). If the core is functional, shifting to 'several substances' is a belt adjustment. If the core is chemical, it is a core violation. However, Lakatos argues the Hard Core is accepted by convention. If the Selene team conventionally treats 'single substance' as inviolable, they are violating their own core by positing several. If they treat 'functional cause' as the core, they are safe, but the core becomes so vague it risks becoming unfalsifiable. Given the repeated failures to isolate a specific factor, the 'several substances' move looks less like a heuristic expansion and more like a retreat into vagueness to immunize the core. This undermines the theoretical integrity required for continued funding.

  Third, we must weigh the rival, the Local–Circadian Programme. Lakatos does not demand we abandon a degenerating programme until a rival is available that explains the previous success of the old programme (absorbs its excess content) and predicts novel facts. Local–Circadian has confirmed novel facts (local sleep activity) and explained Selene's early success (transfusion as artefact). It lacks a full account of the lesion data, though it has a preliminary model. Selene, conversely, explains the lesions but predicts nothing new. In a funding context, we are not choosing absolute truth but the best bet for future knowledge production. Local–Circadian is theoretically progressive; Selene is empirically degenerating. To fund Selene exclusively is to bet on the past; to fund Local–Circadian is to bet on the future.

  Finally, we must address the role of the Council. Lakatos acknowledges that methodology is retrospective; history judges degeneration, not contemporaries. He proposes a rule of "intellectual honesty": scientists should admit when their programme is degenerating. The Selene defenders are not being honest; they are demanding resources based on past glory while hiding current stagnation. The Council acts as the proxy for the scientific community. While Lakatos warns against dogmatic rejection (the Popperian mistake), he also warns against dogmatic tenacity. Tenacity is rational only if there is hope of revival. With a progressive rival available that is beginning to absorb Selene's content, that hope is rationally diminished.

  Therefore, the Council should decline the block renewal. A small maintenance grant might preserve Selene's data for the rival to absorb, but the ten-year block must shift to the Local–Circadian Programme. To do otherwise is to violate the economic rationality of research: funding degeneration over progression.

  *(Word count: approx. 980)*

  ***

  ### Part 3: Marking Scheme

  **Total Marks:** 25
  **Pass Mark:** 10 (though given the advanced stream, expect higher)

  **Assessment Moves (5 marks each):**

  1.  **Identification of Hard Core vs. Protective Belt:**
      *   *5:* Correctly identifies 'single substance/clearance' as Core and isolation methods/locations as Belt. Notes the ambiguity of the 'functional' definition.
      *   *3:* Identifies Core/Belt but treats the definition as fixed fact.
      *   *1:* Confuses Core and Belt (e.g., treats lesion data as Core).
  2.  **Analysis of Progressive vs. Degenerating Shift:**
      *   *5:* Distinguishes between post-hoc accommodation (degenerating) and novel prediction (progressive). Notes the failed knockout/antagonist predictions.
      *   *3:* Labels Selene 'degenerating' but relies only on the failure to isolate the substance (anomaly counting).
      *   *1:* Claims Selene is refuted because predictions failed (Popperian error).
  3.  **Evaluation of the Rival (Absorption of Content):**
      *   *5:* Discusses whether Local–Circadian has absorbed Selene's excess content (lesions/transfusion). Acknowledges the gap in lesion explanation.
      *   *3:* States the rival is 'better' without discussing content absorption.
      *   *1:* Ignores the rival or claims rivalry is irrelevant to Lakatos.
  4.  **Conventionality and Retrospection:**
      *   *5:* Addresses that 'degeneration' is often retrospective and Hard Core status is conventional. Discusses the risk of the decision being premature.
      *   *3:* Treats the verdict of degeneration as objective and immediate.
      *   *1:* Concludes Lakatos gives no guidance because it is retrospective.
  5.  **Tenacity, Honesty, and Resource Allocation:**
      *   *5:* Discusses 'intellectual honesty' and the rationality of tenacity vs. the need to allocate resources. Takes a definite stance.
      *   *3:* Mentions tenacity is allowed but doesn't link to funding.
      *   *1:* Claims scientists must abandon degenerating programmes immediately (Popperian/Positivist error).

  **Grade Boundaries:**

  *   **A (18–25):** Executes all 5 moves. Crucially, in **Move 4**, the candidate grapples with the *tension* between Lakatos's retrospective methodology and the Council's prospective decision. They do not treat the framework as an algorithm but as a tool for argument. They explicitly handle the 'functional definition' ambiguity.
  *   **B (14–17):** Executes Moves 1, 2, 3, and 5 well. In **Move 4**, they treat the degeneration verdict as objective/historical rather than conventional. They apply the labels correctly but miss the meta-philosophical limitation regarding the "decision rule."
  *   **C (10–13):** Identifies Core/Belt and Progressive/Degenerating correctly. Fails to engage deeply with the Rival or the Honesty/Tenacity distinction. May slip into Popperian language ("falsified").
  *   **D (0–9):** Significant misunderstanding of MSRP. Treats anomalies as refutations. Fails to use the case study details.

  **Specific Error Penalties:**

  *   **The "Ad Hoc" Trap:** If a candidate calls every belt change "ad hoc" without distinguishing between *protective* (degenerating) and *heuristic* (potentially progressive) adjustments, cap Move 2 at 3 marks.
  *   **The "No Guidance" Trap:** If a candidate concludes "Lakatos gives no guidance because history decides later," cap Move 4 at 1 mark. (They must argue how the framework *guides* despite this).
  *   **The Popperian Mistake:** If a candidate argues Selene should be abandoned *because* it has anomalies/false predictions (rather than because it is degenerating relative to a rival), deduct 5 marks from the total.

  ***

  ### Part 4: Marker Notes (Contestable Claims)

  **Flag for Markers:**
  The Model Answer takes a definite line, but well-prepared candidates may reasonably disagree on the following points. Credit should be given if the argument is coherent and Lakatosian.

  1.  **The Hard Core Convention (Move 1 & 4):**
      *   *Model Answer Stance:* Argues the shift to 'several substances' risks violating the core or making it vague.
      *   *Reasonable Disagreement:* A candidate may argue that because the original grant defined the substance *functionally*, the shift to 'several substances' is a legitimate belt adjustment that preserves the core ('whatever causes sleep'). If they argue this preserves Selene's rationality, credit fully provided they justify the convention.
  2.  **The Funding Council as "Court of Appeal" (Move 5):**
      *   *Model Answer Stance:* Argues the Council *should* act on degeneration now (proxy for history).
      *   *Reasonable Disagreement:* A candidate may argue that Lakatos explicitly forbids *contemporary* judgment of degeneration (it is always retrospective). They might argue the Council *must* fund both because no objective decision rule exists yet. Credit fully if they use Lakatos's retrospective constraint to argue for split funding rather than abandonment.

  **Teacher's Query Resolution:**
  The Model Answer uses the "Intellectual Honesty" point. It frames it not as a logical compulsion to abandon, but as a normative rule for resource allocation. This aligns with Lakatos's view that while we cannot *force* abandonment, we can rationally prioritize. Markers should look for this distinction: Honesty $\neq$ Abandonment, but Honesty + Resource Scarcity $\rightarrow$ Shift in Funding.
