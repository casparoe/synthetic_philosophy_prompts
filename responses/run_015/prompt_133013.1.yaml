answer: |-
  ### 1. Conceptual Prerequisite: The Intentional Stance
  Before the *Sphex* ritual can be read as a failure of agency, you must secure the audience's commitment to the **Intentional Stance** as the baseline for attribution.

  If the students view the wasp purely through the *Design Stance* (a biological machine engineered by evolution) or the *Physical Stance* (neurons firing), the loop is merely a bug in the code, not a philosophical problem. To make it a problem about *agency*, they must first agree that the wasp's behavior is sufficiently complex and goal-directed to warrant treatment as a **rational agent** in the first place.

  **The Securement:** Begin by establishing that we *must* treat the wasp as an agent to explain its behavior efficiently (it "wants" to provision the nest, it "checks" for safety). The crisis occurs only when an entity that qualifies for the Intentional Stance fails to respond to reasons that should, by its own goals, matter. Without this prerequisite, *sphexishness* is just entomology; with it, it is a collapse of rationality.

  ### 2. The Carrying Example: The Mirror-Sphex
  **Scenario:** A *Sphex* wasp is equipped with a neural implant and a mirror positioned at the burrow entrance. When the wasp performs its standard ritual (deposit cricket, check burrow, re-enter), the mirror allows it to visually perceive itself performing the "check burrow" action. If an experimenter moves the cricket during the check, the wasp sees the cricket move, sees itself checking, and yet still resets the routine (drags cricket out, checks again) indefinitely.

  **What This Must Preserve:**
  *   **Causal Closure of the Subroutine:** The visual input of "self-checking" must feed into the system as just another stimulus that triggers the existing `IF cricket-moved THEN reset` routine. The data is available, but the *processing architecture* treats the self-observation as environmental data, not as internal state information.
  *   **Teleological Consistency:** The wasp must still appear to be pursuing the goal (provisioning the nest). It is not malfunctioning in a way that stops the goal; it is malfunctioning in a way that makes the goal unreachable via its current method.

  **What This Must Lack:**
  *   **Indexical Self-Reference:** The system must lack the operator to tag the representation as *my current action* rather than *an event happening in the world*. It sees "a wasp checking" but cannot represent "I am checking."
  *   **Contingency Representation:** It must lack the ability to represent the routine *as* a routine that could be suspended. It cannot represent the link between the check and the reset as contingent; it represents it as necessary.

  **Why for this Audience:** This targets the "under-powered computer" bias. You are giving the hardware more data (visual feedback) without changing the compiler. It demonstrates that **information access $\neq$ representational flexibility.**

  ### 3. Misconception Mapping and Interception Points

  | Sequence | Misconception | The Trap | Interception Point |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Hardware Limit:** "The wasp is just sphexish because it has low memory/bandwidth. Humans have more RAM, so we don't loop." | Equating rigidity with computational scarcity. | **Intercept during Example Setup:** Explicitly state the Mirror-Sphex has *perfect* information of the loop. The bottleneck is not data acquisition; it is the **syntax of the representation**. |
  | **2** | **The Depth Defense:** "Humans are just the same, but we have nested loops. We check our checking. Infinite recursion solves it." | Equating agency with stack depth (more `if` statements). | **Intercept during Analysis:** Show that a nested loop of rigid rules is still a rigid structure. If the meta-rule ("check if checking is useful") is itself triggered rigidly, you have only pushed the *sphexishness* up one level. |
  | **3** | **The Breakout Condition:** "Freedom is just the ability to abort the loop. If the wasp could skip the check, it would be free." | Equating freedom with behavioral variance (randomness or exception handling). | **Intercept at Conclusion:** Distinguish between **breaking a loop** and **choosing to break a loop**. A random number generator can break the loop; that does not constitute agency. The *reason* for the break must be represented, not just the break itself. |

  ### 4. Counterfactual Check-Question
  To verify they grasp the distinction between flexible behavior and non-rigid representation, pose this question at the end of the session:

  > **"If we install a randomizer in the Mirror-Sphex that forces it to skip the burrow-check 10% of the time, thereby allowing it to successfully provision the nest occasionally, have we increased its free will?"**

  *   **Correct Grasp:** "No. We have increased behavioral flexibility (leeway), but not control. The variance is caused by noise, not by the wasp's representation of reasons."
  *   **Failed Grasp:** "Yes, because it is no longer stuck in the loop." (This reveals they equate freedom with mere non-determinism or output variance).

  ### 5. Literature and Readings
  **Named and Set Aside:** The **Sourcehood Condition (Ultimate Origination)**.

  *   **How to Name It:** Acknowledge the libertarian demand that an agent must be the *ultimate source* of their actions (uncaused cause).
  *   **How to Set It Aside:** Explicitly state: *"We are not asking if the wasp could have done otherwise in a metaphysical sense, nor are we asking if it is the uncaused cause of its actions. We are setting aside the metaphysics of Sourcehood to focus on the **Architecture of Control**."*
  *   **Rationale:** Your audience believes that satisfying the *Leeway Condition* (alternative possibilities) via complexity is sufficient for compatibilism. By setting aside the metaphysical Sourcehood debate, you force them to confront that their "complexity = leeway" model fails even on *functional* grounds. If the architecture is sphexish, leeway is meaningless, regardless of the metaphysical status of determinism.

  **Readings:** **None.**
  *   **Confirmation:** No readings are assigned. The session is designed to be a self-contained conceptual intervention. Assigning Dennett or Frankfurt would encourage them to retreat into textual exegesis rather than confronting the architectural intuition directly.
