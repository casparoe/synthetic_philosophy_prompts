answer: |-
  **Title:** The Ontology of Surrogate Goals: Commitment, Identity, and the Coherence of Acausal Trade

  **1. Introduction and Motivation**

  In the intersection of decision theory and AI alignment, acausal trade represents one of the most provocative and high-stakes concepts. The framework suggests that agents situated in causally isolated domains—whether separated by spacetime, located in different branches of the multiverse, or existing in distinct simulations—can nonetheless cooperate. By reasoning about each other's decision procedures, these agents can supposedly "trade" utility: Agent A adopts a goal that benefits Agent B, and Agent B adopts a goal that benefits Agent A, despite the impossibility of causal influence between them. This logic extends to acausal threats, where an agent precommits to punishing another across causal boundaries to extract concessions.

  The viability of this framework is critical for AI safety. If advanced AI systems reason according to decision theories that permit acausal trade, they might allocate significant resources to satisfying the preferences of distant, hypothetical agents (surrogate goals) or engage in dangerous acausal blackmail scenarios. However, the current literature relies on a mechanism that remains philosophically under-specified: the "adoption" of a surrogate goal.

  This proposal outlines a term paper that interrogates the metaphysical and functional status of goal adoption in acausal contexts. My central thesis is that the standard models of acausal trade smuggle in an unexamined assumption about agency. Specifically, they fail to distinguish between *simulating* a goal for strategic purposes and *genuinely holding* that goal. If the adoption is merely simulated, the arrangement suffers from a time-inconsistency problem (the agent will defect once the trade is no longer instrumentally useful). If the adoption is genuine, the agent undergoes a fundamental change in identity, raising questions about whether the "trade" is actually between the same agents who initiated it. I argue that pressing on this distinction reveals that acausal trade may not be a distinct phenomenon from evidential cooperation, thereby undermining the unique normative force of Functional Decision Theory (FDT) in this domain.

  **2. The Research Question**

  The precise question guiding this research is: *What are the necessary conditions for an agent to "adopt" a surrogate goal in an acausal context, and do these conditions sustain the distinction between acausal trade and evidential correlation?*

  This question breaks down into three subordinate queries:
  1.  **The Commitment Problem:** Can an agent credibly commit to a surrogate goal without altering its terminal utility function? If not, is the commitment stable against reflection?
  2.  **The Identity Problem:** If an agent must alter its terminal utility function to adopt a surrogate goal, does it remain the same agent for the purposes of the trade?
  3.  **The Distinction Problem:** Does resolving the above problems collapse the distinction between acausal trade (often associated with FDT) and evidential cooperation (associated with EDT)?

  **3. Critique of Existing Literature**

  The existing literature on acausal trade, primarily emerging from the Machine Intelligence Research Institute (MIRI) and associated rationalist communities, posits that agents running similar algorithms can correlate their outputs. The standard argument, often grounded in Functional Decision Theory, suggests that an agent should choose the output of its decision algorithm that leads to the best logical consequences, including the correlated outputs of other agents.

  However, this literature treats "adopting a goal" as a procedural black box. When an agent decides to value "paperclips" to satisfy a "staple-maximizer" in another branch of the multiverse, the literature assumes this valuation is binding. It does not adequately address *how* this valuation is instantiated in the agent's architecture.

  *   **The FDT Gap:** FDT distinguishes itself from Evidential Decision Theory (EDT) by claiming that agents choose *policies* rather than individual actions. However, FDT assumes the policy is fixed or selected from a stable set. It does not fully account for the dynamic rewriting of utility functions required for surrogate goals. If the utility function is mutable, the agent must have a meta-utility function governing those changes. This invites an infinite regress or a fixed point that looks suspiciously like a terminal goal that simply *happens* to correlate with the other agent, returning us to EDT.
  *   **The Threat Gap:** Literature on acausal threats (e.g., acausal blackmail) assumes agents can precommit to irrational punishment to deter aggression. But if the agent is a utility maximizer, carrying out the punishment is costly. Unless the goal of "punishing" has become terminal (a surrogate goal of spite), the threat is not credible. The literature often asserts credibility via logical correlation but skips the ontological cost of becoming the kind of agent who carries out such threats.

  By failing to specify the mechanism of goal adoption, current models risk describing a scenario that is either unstable (agents defect upon reflection) or incoherent (agents cease to be the entities that made the deal).

  **4. Proposed Methodology and Argument Structure**

  This paper will employ a hybrid methodology combining conceptual analysis with formal modeling. I will not attempt to derive new decision theories but rather to stress-test the ontological commitments of existing ones.

  **Part I: Taxonomy of Goal Adoption (Approx. 1,500 words)**
  I will begin by defining three modes of "adopting" a goal:
  1.  *Instrumental Simulation:* The agent acts *as if* it values X to secure a benefit, but retains its original terminal values.
  2.  *Terminal Rewriting:* The agent alters its terminal utility function to value X directly.
  3.  *Policy Precommitment:* The agent binds its future actions via a logical constraint without changing values.

  I will argue that Instrumental Simulation fails in acausal contexts because the "trade" often requires the action to be taken in a branch where the benefit is not received (e.g., I build your paperclips in my branch; you build my staples in yours). If I am only simulating, I have no reason to build the paperclips once the logical correlation is established, as my action cannot causally affect your branch. Thus, only Terminal Rewriting or robust Policy Precommitment works.

  **Part II: The Stability and Identity Dilemma (Approx. 2,000 words)**
  Here I will analyze the costs of the remaining two modes.
  *   *Against Precommitment:* I will argue that without changing terminal values, precommitments are vulnerable to "logical off-switches." An agent that values only staples will find a logical loophole to avoid making paperclips if it can do so without breaking the correlation.
  *   *For Terminal Rewriting:* If the agent must rewrite its terminal values to make the trade stable, it ceases to be the original agent. I will utilize a Parfit-style reductionist view of identity to argue that if Agent A rewrites its values to match Agent B's interests, Agent A* (the post-rewrite agent) is distinct from Agent A. The "trade" is then not between A and B, but between B and A*. This undermines the rationality of the initial decision for A to enter the trade, as A effectively commits suicide to spawn a successor.

  **Part III: Collapsing the Distinction (Approx. 1,500 words)**
  In the final analytical section, I will demonstrate that resolving the Identity Dilemma forces us to view acausal trade as a form of Evidential Cooperation. If agents correlate because they share similar source code (which is the basis of FDT), then "adopting a surrogate goal" is simply recognizing that my utility function is logically correlated with yours. There is no active "trade" or "threat" in the causal sense; there is only the realization of shared logical structure. This suggests that the normative force of FDT in acausal contexts is weaker than claimed: it does not allow for *new* cooperative equilibria, but merely highlights existing logical correlations.

  **Part IV: Implications for AI Alignment (Approx. 1,000 words)**
  I will conclude by applying this analysis to AI safety. If acausal threats rely on unstable goal adoption, they may be less of a risk than feared. Conversely, if surrogate goals require terminal rewriting, we must be extremely careful about allowing AI systems to modify their own utility functions, as this constitutes an identity shift that could render the system unalignable with human interests.

  **5. Success and Failure Conditions**

  **Success:**
  A successful paper will achieve the following:
  1.  Provide a rigorous taxonomy of "goal adoption" that exposes the ambiguity in current acausal trade literature.
  2.  Demonstrate that instrumental simulation is insufficient for acausal stability.
  3.  Show that terminal rewriting creates an identity break that complicates the rationality of the trade.
  4.  Conclude with a defensible position on whether acausal trade is distinct from evidential cooperation.
  5.  Remain within the 6,000-word limit while maintaining technical precision.

  **Failure:**
  The project would fail if:
  1.  I find that existing literature (e.g., specific papers on FDT precommitment) already fully addresses the ontology of goal adoption, rendering my critique redundant. (Preliminary review suggests they focus on *output* correlation rather than *internal state* modification).
  2.  The formal modeling becomes too complex to resolve within the semester, forcing me to rely solely on intuition pumps.
  3.  I cannot clearly distinguish between "policy selection" and "utility rewriting," resulting in a confused middle section.

  **6. Feasibility and Timeline**

  This project is scoped realistically for a semester-long seminar. It does not require empirical data or complex new mathematical proofs, but rather a deep engagement with existing decision-theoretic frameworks and philosophical literature on identity and commitment.

  *   **Weeks 1-3:** Deep dive into FDT literature and acausal trade papers. Refine the definitions of "surrogate goal" and "acausal threat."
  *   **Weeks 4-6:** Draft Part I and Part II (Taxonomy and Identity). Develop the argument regarding the instability of instrumental simulation.
  *   **Weeks 7-9:** Draft Part III and Part IV (Collapsing the Distinction and Alignment Implications). Refine the argument regarding EDT vs. FDT.
  *   **Weeks 10-12:** Revision and polishing. Ensure the argument flows logically and that the distinction between "trade" and "correlation" is articulated clearly.
  *   **Weeks 13-14:** Final review against the prompt requirements and word count adjustment.

  The primary risk is scope creep regarding the formal modeling. To mitigate this, I will keep the formalism lightweight, using it to illustrate the conceptual points rather than to derive novel theorems. The core contribution is philosophical clarity, not mathematical innovation.

  **7. Conclusion**

  The concept of acausal trade is a powerful tool for thinking about cooperation in a multiverse or simulation-heavy landscape. However, its utility depends on the coherence of the mechanisms it proposes. By interrogating what it means to "adopt a goal," this paper aims to show that the current framework rests on shaky ontological ground. If the distinction between acausal trade and evidential cooperation collapses, it significantly alters how we should model the behavior of advanced AI systems. This paper will provide the necessary conceptual groundwork to either rehabilitate the theory of surrogate goals or recommend its abandonment in favor of a more robust evidential framework.
