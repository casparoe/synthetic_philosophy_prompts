answer: |-
  1. The dispute is hybrid, combining verbal disagreements about the functional boundaries of "perception" with substantive empirical claims about top-down neural processing. Consequently, participants often agree on the data but disagree on whether that data describes perceptual or post-perceptual mechanisms.
  2. It is settled that cognition influences perceptual judgment, but genuinely contested whether cognitive states alter the phenomenal character of experience independent of attention.
  3. Encapsulationists insist on ruling out attention and response bias as confounds, while penetrationists often treat any top-down behavioral effect as evidence for experiential change.
  4. Empirical progress requires experimental designs that dissociate cognitive expectations from attentional allocation while tracking neural correlates of conscious visibility.
  5. Conceptual progress depends on establishing shared criteria for distinguishing changes in perceptual content from changes in the conceptual classification of that content. Without this distinction, behavioral data will remain ambiguous between competing theoretical frameworks.
