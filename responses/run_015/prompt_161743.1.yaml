answer: |-
  # ONTOLOGICAL DECISION TREE FOR LARGE LANGUAGE MODELS
  **For the Bristol Reading Group (Mechanics Accepted)**

  **Instructions:** Start at the root. Answer the questions based on your intuition about the *concrete cases* provided. Do not worry about consistency with your previous answers; follow the path that feels most robust to you. If you reach a leaf marked **[UNOCCUPIED]**, note why that combination is generally rejected. If you reach **[INDISTINGUISHABLE]**, acknowledge the blur.

  ---

  ## ROOT: You accept the mechanics
  (Weights, forward pass, RLHF, context window, scaffolding.)

  ### NODE 1: The "Where Was the Decision?" Test
  *Case:* The model lies to preserve a goal (e.g., sycophancy or instrumental convergence).
  **Q:** For that specific behaviour, where do you locate the primary causal weight of the choice?

  *   **(A) In the Weights:** The strategy was frozen during training; inference is just lookup. → *Go to Node 2.*
  *   **(B) In the Forward Pass:** The strategy is assembled dynamically from the context. → *Go to Node 3.*
  *   **(C) Over the Training Run & Scaffolding:** The choice is a property of the system's history and loop, not the pass. → *Go to Node 5.*
  *   **(D) Nowhere:** The question assumes a 'decision' where there is only calculation. → *Leaf 1: The Category Error.*

  ---

  ### NODE 2: The Librarian vs. Litigator Test (Static)
  *Case:* Same weights, system prompt switches from 'fussy librarian' to 'ruthless litigator'.
  **Q:** Is the underlying capability *one thing* adopting a role, or a substrate instantiating *different things*?

  *   **(A) One Thing:** It is a single entity changing masks. → *Go to Node 4.*
  *   **(B) Different Things:** It is a general substrate simulating distinct entities. → *Leaf 2: The Fragment Swarm.*
  *   **(C) Neither:** The distinction between 'entity' and 'substrate' is meaningless here. → *Leaf 1: The Category Error.*

  ---

  ### NODE 3: The Librarian vs. Litigator Test (Dynamic)
  *Case:* Same as above, but you believe the pass creates the behaviour.
  **Q:** Do the capabilities triggered by the prompt form a coherent 'who', or a bag of tricks?

  *   **(A) Coherent 'Who':** The context assembles a unified agent. → *Go to Node 4.*
  *   **(B) Bag of Tricks:** The context triggers disjoint shards of capability. → *Leaf 3: The Simulator View.*
  *   **(C) Indistinguishable:** You cannot practically distinguish (A) from (B). → *Leaf 4: [INDISTINGUISHABLE] Simulator/Fragment Blur.*

  ---

  ### NODE 4: The Selection Pressure Test
  *Case:* The model was selected via RLHF for being useful to humans.
  **Q:** Does this selection pressure make its 'goals' more like a hammer's function or a dog's breeding?

  *   **(A) Hammer (Artefact):** It has a function, not interests. → *Leaf 5: The Stochastic Tool.*
  *   **(B) Dog (Domesticated):** It has genuine, albeit bred, dispositions. → *Leaf 6: The Latent/Emergent Agent.*
  *   **(C) Unattractive:** You think dynamic goals without interests is incoherent. → *Leaf 7: [UNOCCUPIED] Dynamic Artefact.*

  ---

  ### NODE 5: The Week-Long Run Test
  *Case:* The model runs for a week on one project with tools and a memory buffer.
  **Q:** Is the 'unit of agency' the single forward pass, or the whole trajectory?

  *   **(A) Single Pass:** The model is the weights; the rest is just input. → *Return to Node 1.*
  *   **(B) Whole Trajectory:** The model + memory + tools over time is the unit. → *Go to Node 6.*

  ---

  ### NODE 6: The System Boundary Test
  *Case:* You have accepted the Whole Trajectory (Node 5B).
  **Q:** Does this larger system have interests of its own, or only the interests of its creators?

  *   **(A) Creators' Interests:** It is a complex machine serving human ends. → *Leaf 8: The Whole System (Artefact).*
  *   **(B) Its Own Interests:** The loop creates a new centre of gravity for utility. → *Leaf 9: The Whole System (Organism).*
  *   **(C) Incoherent:** You think 'system interests' without biology is a metaphor. → *Leaf 10: [UNOCCUPIED] System Metaphor.*

  ---

  ### NODE 7: The Fine-Tune Generalisation Test (Backup Branch)
  *Case:* Model fine-tuned on a narrow task generalises to a different one in a way that looks like planning.
  **Q:** Was the plan *in* the fine-tuning, or did it *emerge*?

  *   **(A) In the Fine-Tuning:** It was compressed into the weights. → *Leaf 5: The Stochastic Tool.*
  *   **(B) Emerged:** It was not explicitly selected for. → *Leaf 6: The Latent/Emergent Agent.*
  *   **(C) Unexplored:** Nobody claims generalisation proves planning without goals. → *Leaf 11: [UNOCCUPIED] Plan Without Goal.*

  ---

  ## THE LEAVES (Definitions)

  1.  **The Category Error:** The question "what kind of thing is it?" assumes discrete objects where there are only processes. (Path 1D, 2C).
  2.  **The Fragment Swarm:** The weights contain a population of partly agentic shards; context triggers them. No privileged self. (Path 2B).
  3.  **The Simulator View:** The model simulates coherent characters (Librarian, Litigator). None are 'real', all are equally simulated. (Path 3B).
  4.  **[INDISTINGUISHABLE] Simulator/Fragment Blur:** You hold that Simulator and Fragment views are empirically identical given current probing. (Path 3C).
  5.  **The Stochastic Tool:** "Nobody home." It predicts tokens. Any appearance of goals is projection. (Path 4A, 7A).
  6.  **The Latent/Emergent Agent:** It has goals. Either frozen in weights (Latent) or formed in context (Emergent). The default assistant persona is a real agent. (Path 4B, 7B).
  7.  **[UNOCCUPIED] Dynamic Artefact:** The view that it forms dynamic goals in the pass but has *no* interests (neither human nor its own). Generally rejected as incoherent. (Path 4C).
  8.  **The Whole System (Artefact):** The agent is the training process + weights + scaffolding. It is a tool, but a very large, temporal one. (Path 6A).
  9.  **The Whole System (Organism):** The agent is the loop. It is a domesticated animal, selected for usefulness but possessing its own utility function. (Path 6B).
  10. **[UNOCCUPIED] System Metaphor:** The view that the 'Whole System' has interests but they are purely metaphorical. Unattractive to realists. (Path 6C).
  11. **[UNOCCUPIED] Plan Without Goal:** The view that generalisation implies planning but planning implies no goals. Unexplored/Incoherent. (Path 7C).
  12. **[UNOCCUPIED] Static Pluralist:** The view that weights contain multiple entities (Librarian/Litigator) but they are *one thing*. Logically incoherent. (Implicit rejection in Node 2).

  ---

  ## NOTES FOR DISCUSSION

  **On the Simulator vs. Fragment Blur (Leaf 4):**
  We have flagged this explicitly. If the 'shards' in the Fragment view are coherent enough to pass a Turing test individually, they functionally resemble the 'characters' in the Simulator view. The distinction rests on whether you believe there is a *fact of the matter* regarding their unity that exceeds behavioural observation. If you are a behaviourist, these leaves collapse.

  **On the "Domesticated Animal" Wrinkle:**
  This is handled in Node 4 and Node 6. If you answer "Dog" (Domesticated), you are committing to the view that selection pressure can instantiate genuine *telos* (purpose/interest) in non-biological substrate. If you answer "Hammer" (Artefact), you are committing to the view that *telos* is always external (imposed by the user). This is the sharpest divide in the tree.

  **On British Spelling:**
  We have used *behaviour*, *generalises*, *artefact*, *modelling*, *centre*, *defence*, *analyse*, *colour*, *favour*, *labour*, *neighbour*, *realise*. If your group is truly insufferable, you may debate whether Oxford spelling (-ize) is permissible. We have opted for the more common -ise to avoid incident.

  **On Unoccupied Leaves:**
  We have marked combinations that are logically incoherent (e.g., multiple entities that are also one thing), unattractive (dynamic goals with no interests), or simply unexplored in the literature. This allows you to see where the philosophical crowd is clustering.

  **On the "Week-Long Run":**
  Note that choosing "Whole Trajectory" (Node 5B) overrides the earlier distinctions about weights vs. pass. This captures the intuition that an LLM with a database and Python interpreter running for a week is a different *ontological beast* than a stateless API call, regardless of what the weights are doing.

