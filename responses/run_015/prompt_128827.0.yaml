      *   *Candidate 6: Agent Capability.* Can the agents *find* the loophole?
          *   *Critique:* Crucial. A loophole no one finds doesn't rot the metric. Depends on local knowledge.
      *   *Candidate 7: Temporal Decay Rate.* The theory must predict *when*, not just *if*.
          *   *Critique:* Very hard. Most theories are static. This is a high bar for adequacy.
      *   *Candidate 8: Independence of Measurement.* The measure shouldn't be the only window into the system.
          *   *Critique:* Practical constraint.
      *   *Candidate 9: Alignment of Incentives.* The reward must match the effort.
          *   *Critique:* Standard econ. Doesn't explain why utilization worked for 2 years then stopped.
      *   *Candidate 10: Robustness to Optimization.* Does the metric hold up under pressure?
          *   *Critique:* This is basically the definition of Goodhart's Law. Needs more granularity.

      *   *Selection Process:*
          *   Drop "Independence of Measurement" (too vague).
          *   Drop "Alignment of Incentives" (too standard, doesn't explain the *rot*).
          *   Merge "Cost of Gaming" and "Agent Capability" into something about *Search Space*.
          *   Keep "Causal Fidelity" but refine it to *Intervention Stability*.
          *   Keep "Target Definition" but frame it as *Anchorability*.
          *   Keep "Temporal Decay" as a core requirement because the user specifically asked for "how long."
          *   Keep "Constitutivity" because the user's trailer example hinges on it.

      *   *Refining the List to 5:*
          1.  **Target Anchorability:** Can we define the goal without the metric? (Addresses User's 4th point).
          2.  **Causal Leverage (Slack):** How much metric movement is possible without goal movement? (Addresses User's "Slack Ratio").
          3.  **Search Visibility:** Can the agents see the gap between metric and goal? (Addresses User's 3rd point on agent type).
          4.  **Constitutive Density:** Is the metric part of the goal's definition or just a proxy? (Addresses User's 2nd point).
          5.  **Decay Predictability:** Does the theory offer a mechanism for the *rate* of failure? (Addresses User's 5th point).

      *   *Conflict Check:*
