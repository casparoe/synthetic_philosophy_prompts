          *   *Constitutive vs. Diagnostic:* Is the measure part of the goal?
          *   *Agent Type:* Person vs. Dept vs. Optimizer.
          *   *Target Definition:* Can we define the goal independently?
          *   *Dynamics:* Rates of decay, not just end states.

  3.  **Brainstorming Candidate Desiderata (The "Sketch and Argue" Phase):**
      *   *Candidate 1: Causal Fidelity.* The metric must be causally linked to the goal.
          *   *Critique:* Too vague. "Correlation isn't causation" is known. Needs to account for *intervention*. If I intervene on the metric, does the goal move?
      *   *Candidate 2: Observability of the Target.* We need to see the real goal to know if the metric drifted.
          *   *Critique:* User pointed out "Good healthcare" is undefined. If the target is fuzzy, we can't measure drift. This is a hard constraint. The theory must handle *latent* variables.
      *   *Candidate 3: Cost of Gaming.* If it's cheaper to game than to work, it will be gamed.
          *   *Critique:* Good, but "cost" is subjective. Needs to be relative to the reward structure.
