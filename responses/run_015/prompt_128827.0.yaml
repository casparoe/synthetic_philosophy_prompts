  7.  **Final Polish:** Ensure the distinction between *Type I Goodhart* (metric stops tracking goal) and *Type II Goodhart* (goal degrades while metric holds) is clear in the reasoning. Ensure the "Constitutive" point is handled carefully—it's not just a hobbyhorse, it's a structural feature of the system.

  *(Self-Correction on the "Constitutive" point)*: The user asked if this is a genuine desideratum or a hobbyhorse. I need to take a stand. It *is* genuine. In finance, price *is* value. In freight, scan time *is not* delivery. The theory must distinguish *proxies* from *definitions*.

