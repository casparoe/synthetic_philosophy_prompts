answer: |-
  **Joint Statement of Disagreement: Parfit's Hitchhiker & Rational Irrationality**
  **Date:** 14 October
  **From:** The Reading Group (Camp A & Camp B)

  Right, we've stopped shouting past each other and tried to pin down exactly where the split happens. Below is what we actually agree on, where we diverge, and the specific tests we think would settle it. We've kept it informal so we can actually use this for discussion.

  ### 1. Common Ground (What We Both Sign Onto)

  *   **The Setup:** We agree on the mechanics of Parfit's Hitchhiker. You are in the desert; a driver offers a ride conditional on a prediction that you will pay £100 upon arrival. Once in town, you have no instrumental incentive to pay (no police, no reputation hit). If you don't pay, you save £100. If the driver predicts you won't pay, they leave you to die.
  *   **Real-World Precommitment:** We agree that in the real world, external enforcement works. Contracts, reputation systems, and Ulysses pacts (like Odysseus tying himself to the mast) successfully bind future selves. The dispute is not about whether *external* constraints work, but whether *internal* rationality can achieve the same result without them.
  *   **Goal of Rationality:** We both agree that rationality is instrumental. It's about getting what you want. If a strategy consistently leads to you dying in the desert, it's probably not the right one.
  *   **The Prediction:** We agree the driver is a reliable predictor (in the base case), but not omniscient. Their prediction is based on your psychological disposition at the time of the offer.

  ### 2. The Precise Disagreement

  **Camp A (The Dispositional View):**
  Rationality applies to *policies* or *dispositions*, not just individual acts. It is rational to cultivate a disposition to pay because having that disposition is what gets you the ride. Therefore, when you arrive in town, you pay, not because the act itself gains utility then, but because failing to pay would mean you never had the disposition required to get the ride in the first place. You can "bind" your future self by being the sort of person who doesn't defect.

  **Camp B (The Act-Based View):**
  Rationality applies to the *act at the time of choice*. Once you are in town, the ride is already secured (or it isn't). The prediction is in the past. Paying £100 now costs you utility and gains nothing. Claiming you can bind your future self without external enforcement is wishful thinking or conflating "wanting to be able to commit" with "actually being able to commit." If you are truly rational at the moment of payment, you defect.

  ### 3. The Cruxes

  We've identified two main pivot points. If we resolved these, the rest would follow.

  **Crux 1: Stability of Preferences Across Time**
  *   **The Issue:** Can a rational agent maintain a preference for a plan even when local incentives flip, provided the plan was optimal *ex-ante*?
  *   **Camp A Claim:** Yes. Rationality requires dynamic consistency. If you wouldn't pay, you shouldn't have accepted the ride (but you can't choose that once in the desert). Therefore, to be rational, you must execute the plan.
  *   **Camp B Claim:** No. Preferences are allowed to update based on new information (i.e., "I am now safe"). Sticking to a plan when it no longer serves your interests is sunk-cost fallacy, not rationality.
  *   **Test Case:** *The Unenforceable Debt.*
      *   *Scenario:* You borrow £100 from a friend who is moving abroad tomorrow. They will never return, and no one else will know if you repay. You promised to pay.
      *   *Camp A Prediction:* A rational agent repays the debt because being a "promise-keeper" is a valuable disposition for future opportunities (even unknown ones), or simply because the *policy* of promise-keeping is what justified taking the loan.
      *   *Camp B Prediction:* A rational agent keeps the money. The future opportunities are speculative; the £100 gain is certain. Keeping it is the dominant strategy.

  **Crux 2: Causal vs. Evidential Correlation**
  *   **The Issue:** Is the link between your disposition and the driver's prediction causal (your mind-state causes the prediction) or merely evidential (your mind-state is evidence of what you'll do)?
  *   **Camp A Claim:** The correlation is functionally causal for decision-making. Your current decision procedure *is* what the driver predicted. You can't separate the two.
  *   **Camp B Claim:** The correlation is purely evidential. Your decision now cannot change the past prediction. Treating it as causal is magic thinking (like trying to influence a coin toss that already landed by wishing it was heads).
  *   **Test Case:** *The 80% Accuracy Variant.*
      *   *Scenario:* The driver is only 80% accurate. They guess you'll pay, give you a ride, but there's a 20% chance they guessed wrong about your nature.
      *   **Impact on Camp A:** This strengthens the view slightly. Even with noise, the Expected Utility of being a "Payer" type is higher than being a "Defector" type. You still pay. The disposition pays off in the long run across multiple possible worlds.
      *   **Impact on Camp B:** This changes nothing. Once you are in town, the 80% probability is collapsed. Either they predicted you'd pay or they didn't. Paying now doesn't retroactively increase the accuracy. You still defect.
      *   **Agreed Bearing:** If Camp B admits that 80% accuracy makes paying *more* attractive than 100% accuracy, they move toward Camp A. If Camp A admits that at low enough accuracy (say 51%) you should defect, they concede the link is about expected payoff, not duty.

  ### 4. Is This Just Verbal?

  We reckon there's a chunk of this that is just us using words differently. We need to be honest about it.

  1.  **'Rational':**
      *   Camp A is using 'rational' to mean **"success-conducive policy"** (ex-ante). If the policy gets you the best life outcomes, it's rational.
      *   Camp B is using 'rational' to mean **"correct response to current stimuli"** (ex-post). If the action maximises utility given the *current* state of the world, it's rational.
      *   *Resolution:* We aren't going to solve this tonight, but we acknowledge that Camp A thinks Camp B's agent is "prudent but self-defeating," while Camp B thinks Camp A's agent is "successful but mystically minded."

  2.  **'Binding':**
      *   Camp A talks about "binding" as a psychological fact (I literally cannot bring myself to defect).
      *   Camp B talks about "binding" as a constraint on options (I am physically or contractually prevented from defecting).
      *   *Resolution:* Camp B argues that if you "literally cannot" defect, you aren't making a choice, so rationality doesn't apply. Camp A argues that cultivating that inability *is* the rational choice.

  ### 5. Next Steps for the Group

  *   **Focus:** Stop arguing about whether the driver is magic. Assume the prediction mechanism is just "very good psychology."
  *   **Task:** For the next session, Camp B needs to explain how their agent survives the desert without lying (since lying requires predicting your own future defection, which the driver would spot). Camp A needs to explain the mechanism of the "bind" without resorting to "I just feel like I have to."
  *   **The 80% Question:** We need to decide if the noise introduces a causal lever. If I know the driver is 80% accurate, does my decision now signal to the driver (in a logical sense) what I would have done? Camp A says yes (logical correlation); Camp B says no (temporal order).

  Let's stick to this. No more talking about Newcomb's Problem unless it's directly mapped to the Hitchhiker.

  **Signed,**
  *Both Camps (Reluctantly)*
