      *   **Problem:** The student is confused by a senior researcher's repeated use of the slogan "*memes are like genes*." It's used in two different contexts: (1) to explain why false claims spread (selection doesn't care about truth), and (2) to argue cultural change is genuinely Darwinian (lineages, inheritance, variation). The student suspects equivocation or hidden premises.
      *   **Task:** Create a "menu" of distinct precise theses underlying the slogan, ordered from trivial to radical. Assign a status (platitude, defensible, contested, false). Evaluate coherence and testability. Differentiate based on specific criteria (lineage, fidelity, particulate nature, unit of selection, randomness, selfishness).
      *   **Concrete Test:** Apply each thesis to two hypothetical findings:
