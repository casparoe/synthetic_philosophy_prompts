      *Refining the "Truth" link:* The strongest link to "truth doesn't matter" comes from the "Selfish Replicator" + "Prestige Bias" combo. If a meme spreads *because* it triggers prestige bias, its truth value is orthogonal to its spread mechanism. I need to make sure the table reflects that only the stronger theses license this.

