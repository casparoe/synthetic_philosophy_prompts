answer: |-
  This is an exceptionally sharp observation. You have identified what philosophers of science call a **Motte-and-Bailey maneuver** wrapped in an analogy. The "Motte" is the defensible, trivial claim (cultural items have lineages); the "Bailey" is the controversial, substantive claim (therefore truth is irrelevant to cultural spread). The slogan "*memes are like genes*" allows the speaker to retreat to the Motte when challenged and advance to the Bailey when making conclusions.

  Below is the menu you requested. I have ordered the readings from weak (structural) to strong (ontological/agential).

  ### Table 1: Menu of Theses Underlying "*Memes are like genes*"

  | Reading | Precise Statement | Status | Coherent & Testable? | Finding 1 (Canoes vs. Rituals) | Finding 2 (Costly Ritual) | Licenses "Truth Irrelevance" Conclusion? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Genealogical Descent** | Cultural items have ancestors; current variants are caused by previous variants via transmission chains. | **Platitude** | **Yes.** Traceable via historical records or phylogenetic methods. Distinguished from independent invention by correlation of errors/features. | **Supports.** Both canoes and rituals show change over time implying transmission. | **Supports.** The ritual spread implies a transmission chain. | **No.** Lineages exist for true and false claims alike. Does not explain *why* one spreads over the other. |
  | **2. Differential Propagation** | Variants differ in their rate of replication; some traits cause higher copying rates than others. | **Substantive & Defensible** | **Yes.** Measure frequency changes over generations. Distinguished from drift by statistical deviation from neutral expectations. | **Supports.** Canoes show directional selection; rituals show drift (both are differential propagation regimes). | **Supports.** The ritual variant out-competed others despite costs. | **No.** Variants could spread *because* they are true (truth aids propagation). Consistent with truth-matters. |
  | **3. Particulate Inheritance** | Cultural transmission preserves discrete units (alleles) rather than blending averages; reconstruction errors are rare enough to maintain identity. | **Substantive & Contested** | **Yes.** Test fidelity in transmission chains. Distinguished from "blending/reconstructive" by measuring degradation vs. discrete retention. | **Mixed.** Canoes support (high fidelity needed for hydrodynamics); Rituals undermine (rapid change suggests low fidelity/reconstruction). | **Neutral.** Does not specify *why* it spread, only *how* it was copied. | **No.** Fidelity is a channel property, not a selection pressure. High fidelity could preserve truth or falsehood equally. |
  | **4. High-Fidelity Ratchet** | Fidelity is sufficiently high to allow cumulative, design-like complexity to accumulate over generations (the "Cultural Ratchet"). | **Substantive & Contested** | **Yes.** Look for complexity exceeding individual invention capacity. Distinguished from simple diffusion by evidence of stepwise improvement. | **Supports (Canoes).** Undermines (Rituals). Suggests the analogy holds for tech, fails for narrative. | **Neutral.** Complexity not mentioned; only spread mentioned. | **No.** Cumulative complexity could be cumulative *truth* (science). Does not imply indifference to truth. |
  | **5. Blind Variation** | New variants arise independently of their adaptive value (Campbellian blind variation); innovation is not directed toward utility/truth. | **Substantive & Contested** | **Yes.** Test if innovations correlate with needs. Distinguished from Lamarckianism by lack of correlation between problem and solution generation. | **Undermines.** Canoe improvement suggests directed problem-solving (Lamarckian), not blind mutation. | **Supports.** If the ritual variant arose randomly but spread due to bias, this fits. | **Weakly.** If variation is blind, truth isn't the *source* of the variant. But selection could still filter for truth. |
  | **6. Decoupled Fitness** | Cultural fitness (copying success) is distinct from biological fitness (host survival/reproduction); a trait can be culturally fit but biologically costly. | **Substantive & Defensible** | **Yes.** Correlate trait frequency with host reproductive success. Distinguished from gene-culture coevolution by negative correlation. | **Neutral.** Does not address biological costs. | **Strongly Supports.** Prestige bias overrides fertility cost. | **Maybe.** Shows selection ignores *biological* cost. Does not prove it ignores *epistemic* truth (truth could still aid copying). |
  | **7. Agential Selfishness** | Memes are ontologically distinct replicators with "interests" that can actively oppose host interests (including epistemic interests); the meme's goal is replication, period. | **Radical & Contested** | **Debatable.** Requires metaphorical "interest." Testable only by showing systematic host harm for meme benefit. Distinguished from maladaptation by intent-like design in the meme. | **Neutral.** | **Strongly Supports.** The ritual harms the host but helps the "meme." | **Yes.** If memes have interests divergent from hosts, truth (a host interest) is expendable for replication. |

  ### Analysis of the Concrete Findings

  **Finding 1 (Canoes vs. Rituals):**
  This finding creates a wedge between **Reading 4 (High-Fidelity Ratchet)** and **Reading 1 (Genealogical Descent)**.
  *   **Implication:** It suggests the "Gene" analogy is domain-specific. Technology behaves like genetics (cumulative selection); narrative/ritual behaves like drift or fashion.
  *   **For the Senior Researcher:** This undermines the universal claim that "*memes* are like genes." It suggests only *some* cultural items are gene-like. If she uses this to argue that *all* cultural change (including scientific truth) is indifferent to truth, Finding 1 is a counter-example: canoe building *cares* about hydrodynamic truth.

  **Finding 2 (Costly Ritual):**
  This finding is the engine for **Reading 6 (Decoupled Fitness)** and **Reading 7 (Agential Selfishness)**.
  *   **Implication:** It proves cultural selection is not a proxy for biological selection.
  *   **For the Senior Researcher:** This is her strongest evidence. However, note the gap: It shows selection is indifferent to *biological fitness*. It does not logically prove selection is indifferent to *truth*. A true idea could also spread despite biological cost (e.g., "smoking kills" spreads, even if smokers die). To get to "Truth doesn't matter," she needs to add the premise that *truth is biologically costly* or *orthogonal to prestige*.

  ### "Ideas are like Viruses" vs. "Ideas are like Genes"

  You are correct to sense a shift in baggage. These are not rhetorical synonyms; they pull the analogy in different directions.

  | Feature | *Memes are like Genes* | *Ideas are like Viruses* |
  | :--- | :--- | :--- |
  | **Transmission Mode** | Primarily Vertical (parent to offspring) or stable Oblique. Implies lineage stability. | Primarily Horizontal (peer to peer). Implies epidemic dynamics. |
  | **Host Relationship** | Co-evolved, symbiotic, or neutral. The genome *is* the host. | Parasitic, pathogenic. The virus is *foreign* to the host. |
  | **Fidelity** | High fidelity required for inheritance. | High mutation rate acceptable; rapid evolution. |
  | **Normative Load** | Naturalistic, structural. "This is how inheritance works." | Pathological, invasive. "This is an infection to be cured." |
  | **Relevance to Truth** | Neutral. Genes aren't true/false, they just work. | Negative. Viruses are often harmful; implies ideas might be "pathogens" (falsehoods) that harm the host mind. |

  **The Switch:**
  When the researcher argues for **Darwinian structure** (lineages, population thinking), she uses **Genes**. This is hard to dispute (Reading 1 & 2).
  When she argues for **Truth Irrelevance** or **Harmful Spread**, she implicitly switches to **Viruses**. This imports the assumption that the cultural item is *foreign* and *potentially harmful* to the host's epistemic or biological well-being (Reading 7).
  *   **Verdict:** The switch allows her to claim the scientific rigor of genetics while smuggling in the normative antagonism of virology.

  ### Dialectic Verdict: Argument or Trojan Horse?

  **Verdict:** The slogan is functioning as a **Trojan Horse (Equivocation)**.

  1.  **The Safe Entry:** The researcher enters the debate using **Reading 1 (Genealogical Descent)** and **Reading 2 (Differential Propagation)**. These are platitudes or defensible claims. No cognitive scientist denies that ideas have sources and spread at different rates. This disarms skepticism.
  2.  **The Payload:** Once the framework is accepted ("We are doing population thinking"), she swaps to **Reading 6 (Decoupled Fitness)** and **Reading 7 (Agential Selfishness)** to deliver the conclusion ("Truth doesn't matter").
  3.  **The Logical Gap:** The move from "Selection acts on replication rates" to "Selection is indifferent to truth" is invalid without a bridge premise.
      *   *Valid:* Selection acts on replication rates.
      *   *Missing Premise:* Truth does not correlate with replication rates (or is costly).
      *   *Conclusion:* Therefore, selection is indifferent to truth.
      *   The slogan "*memes are like genes*" hides the missing premise. In biology, genes *are* indifferent to truth (they aren't truth-apt). By calling memes "genes," she implicitly asserts memes are also not truth-apt, or that their truth-value is causally inert.

  **How to Push Back (Cognitive Science Angle):**
  You can intervene without being confrontational by targeting **Reading 3 (Particulate Inheritance)** and **Reading 5 (Blind Variation)**.
  *   *"If cultural transmission is reconstructive (as cognitive science suggests) rather than particulate replication, does the 'gene' analogy hold for the mechanism, or only the outcome?"*
  *   *"In biology, variation is blind to fitness. In culture, humans often innovate specifically to solve problems (directed variation). If variation is directed toward truth/utility, doesn't that break the analogy regarding truth-indifference, even if selection pressures remain?"*

  This forces the group to admit that the "Gene" analogy is a model with specific boundary conditions, not a universal law that automatically decouples truth from spread.
