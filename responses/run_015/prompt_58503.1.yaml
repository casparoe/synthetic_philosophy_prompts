  He demands the flame ascend yet higher,
  While winter shadows stretch across the day.
  No vendor spec allowed to e'er expire,
  Unless it promises to banish decay.
  He will not rest until he finds the fire,
  That burns the fullest in the shortest way.
  Let every number match his cold desire,
  Before he lets the winter silence stay.

