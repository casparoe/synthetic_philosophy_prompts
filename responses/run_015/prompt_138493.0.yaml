prompt: |-
  I'm a fourth-year PhD student in cognitive psychology, and I've been drafted onto a small departmental committee that maintains an open textbook for our first-year graduate methods sequence. Every few weeks we have to decide whether a finding from the literature goes into the chapter, goes in with a caveat, or stays out, and the decisions are published as an appendix with our reasoning, so we have to be able to defend them to the original authors. The catch is that we get about forty-five minutes per finding, one member of the committee is an actual statistician who has to sign off, and the other three of us are substantive researchers who can run a t-test and read a confidence interval but will never read a word of philosophy of statistics. So I need something operational: an ordered set of questions, what counts as a sufficient answer to each, an explicit rule for when we stop and say no, and a point at which the procedure hands the decision back to us because the remaining question is one of values rather than facts.

  What I'd like it to draw on is the real structure of the disagreement between frequentist and Bayesian ways of reading evidence, not a list of warning signs about bad practice. In particular I want it to force us to keep separate three things we've noticed we routinely collapse: the claim that an effect exists at all, the claim about how large it is, and the claim about the mechanism that's supposed to produce it — because in our last few meetings we found that a replication often kills a magnitude claim while leaving the existence claim untouched, and we had no vocabulary for that. The procedure has to say what we do when the numbers we'd want aren't available (no effect size reported, no interval, no preregistration, only a p-value), it has to say what to do with a replication whose point estimate is in the same direction but a third of the original size, and with one whose interval excludes zero but also excludes the original estimate, and it has to be honest about which steps are judgment calls wearing a lab coat. One of our members keeps talking about severity in the error-statistical sense, another wants everything converted into a Bayes factor, and I'd like a procedure that doesn't preempt that argument but doesn't stall on it either. I'd also like it to make us state out loud the trade-off we're implicitly choosing between wrongly including a finding and wrongly excluding one, rather than having the procedure quietly pick it for us.

  Then I want it run on three cases. First: a preregistered, generously powered replication of a finding that my own dissertation builds on has just come back with a point estimate very close to zero and an interval that excludes the original effect size; I think I already know what the procedure should say and I'd like to watch it say that without flinching, and then tell me whether there is any legitimate way for me to keep using that finding in my third chapter. Second: a multi-site replication across a dozen countries that reports a pooled effect near zero but substantial heterogeneity, with the original effect reappearing at something like its original magnitude in two of the sites — is this a hidden moderator, a badly specified original, or a fluke, and what would the procedure need us to go find out before it can answer? Third: a single unregistered study with about forty participants per cell reporting a just-significant interaction, with no effect size given anywhere in the paper, which a colleague wants to build a grant around. Finally, I want to know what the procedure can't do: where it has to stop and hand the question to a person, and which kinds of finding it will systematically misjudge.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** 4th-year PhD student in Cognitive Psychology.
      *   **Task:** Create an operational decision procedure for a departmental committee maintaining an open textbook for 1st-year grad methods.
      *   **Constraints:**
          *   45 minutes per finding.
          *   Committee: 1 Statistician (must sign off), 3 Substantive Researchers (can run t-tests/CIs, no philosophy of stats).
          *   Output: Appendix with reasoning (must be defensible to original authors).
          *   Core Requirement: Operational ordered set of questions, sufficiency criteria, explicit stop rules, hand-off point for value judgments.
          *   Theoretical Basis: Real structure of Frequentist vs. Bayesian disagreement (error statistics vs. belief updating), *not* just bad practice checklists.
          *   Key Distinction: Must separate (1) Existence of effect, (2) Magnitude of effect, (3) Mechanism.
          *   Handling Missing Data: What if no ES, no CI, no prereg, only p-value?
          *   Specific Scenarios to Address:
              *   Replication: Same direction, 1/3 size.
              *   Replication: CI excludes zero but excludes original estimate.
              *   Trade-off: Type I (include wrongly) vs. Type II (exclude wrongly) error costs must be stated explicitly.
              *   Internal Conflict: One member likes Severity (Mayo), one likes Bayes Factors. Procedure shouldn't stall on this.
      *   **Test Cases:**
          1.  Preregistered, high-powered replication of user's dissertation finding: Point estimate $\approx 0$, CI excludes original ES. (Can user still use it?)
          2.  Multi-site replication (12 countries): Pooled $\approx 0$, high heterogeneity, 2 sites match original. (Moderator? Bad spec? Fluke?)
          3.  Single unregistered study, N=40/cell, just-significant interaction, no ES. (Colleague wants grant.)
      *   **Limitations:** What can't the procedure do? Where does it hand off to humans? What does it systematically misjudge?

  2.  **Develop the Procedure (The "Protocol"):**

      *   *Goal:* Bridge the gap between "Significant/Not Significant" and "True/False" by separating Existence, Magnitude, and Mechanism.
      *   *Philosophical Grounding:* Needs to accommodate Severity (error control) and Bayes (evidence strength) without requiring consensus on foundations. The common ground is *predictive accuracy* and *uncertainty quantification*.
      *   *Structure:*
          1.  **Triage (Data Availability):** Can we even evaluate this?
          2.  **Existence (The "Is there something?" question):** Focus on error control (Severity/p-value/CI excluding null).
          3.  **Magnitude (The "How big?" question):** Focus on estimation (CI overlap, meta-analytic weight).
          4.  **Mechanism (The "Why?" question):** Focus on theory binding (preregistration, specificity).
          5.  **Value Judgment (The "Textbook Fit" question):** Explicitly state the cost of errors.

      *   *Drafting the Questions:*
          *   Q1: Data Transparency? (If no, downgrades confidence).
          *   Q2: Existence? (Does the CI exclude the null? Is the test severe?)
          *   Q3: Magnitude Consistency? (Does the replication CI overlap the original point estimate?)
          *   Q4: Mechanism Specificity? (Was the specific prediction preregistered?)
          *   Q5: Value Trade-off? (False Positive vs. False Negative cost).

      *   *Refining for the "Statistician vs. Substantive" dynamic:* The statistician cares about the validity of the inference (Severity/BF). The substantives care about the phenomenon. The procedure needs to let the statistician verify the *inference* while the group decides the *inclusion*.
      *   *Handling the "No ES/CI" issue:* If only p < .05 is available, we cannot assess magnitude. The procedure must flag this as "Existence Only, Magnitude Unknown."
      *   *Handling the "Bayes vs. Severity" stalemate:* Both agree that a p-value of .05 with low power is weak evidence. Both agree that a narrow CI is better than a wide one. Focus on *Precision* and *Error Rates* rather than the interpretation of probability.

  3.  **Develop the Test Cases:**

      *   *Case 1 (Dissertation Finding):*
          *   Scenario: Original significant. Replication (prereg, high power) $\hat{\theta}_{rep} \approx 0$, CI excludes $\hat{\theta}_{orig}$.
          *   Procedure Output: Existence claim weakened (severe test failed). Magnitude claim falsified. Mechanism unsupported.
          *   User's Question: Can I keep using it?
          *   Answer: Technically yes, but with massive caveats. It becomes a "boundary condition" or "disputed finding." You cannot cite it as established fact.
      *   *Case 2 (Multi-site):*
          *   Scenario: Pooled $\approx 0$, High $I^2$, 2 sites match original.
          *   Procedure Output: Existence claim is *conditional*. Magnitude is unknown without moderator identification.
          *   Action: Needs moderator analysis. If sites are theoretically distinct, it's a moderator. If random, it's noise/fluke.
      *   *Case 3 (Unregistered, N=40, Interaction):*
          *   Scenario: p < .05, no ES, no prereg.
          *   Procedure Output: Existence claim is "Low Severity" (garden of forking paths likely). Magnitude claim is "Unassessable."
          *   Grant advice: High risk. Needs direct replication before building theory.

  4.  **Identify Limitations:**

      *   What can't it do? It can't judge *truth*, only *warrant*. It can't fix bad theory. It struggles with exploratory work (punishes discovery). It assumes the committee understands CIs correctly (they might not).
      *   Systematic biases: Against novel/unexpected findings (which often lack power/prereg). Against complex interactions (hard to power).

  5.  **Refining the Tone:**

      *   Needs to be professional, precise, slightly bureaucratic but intellectually honest.
      *   Avoid jargon where possible, but use correct statistical terms (Severity, Coverage, Heterogeneity).
      *   Acknowledge the tension between the committee members.

  6.  **Self-Correction/Review during drafting:**

      *   *Critique:* Did I separate Existence, Magnitude, and Mechanism clearly enough?
      *   *Fix:* Make sure the decision matrix has distinct rows for each. A finding can pass Existence but fail Magnitude.
      *   *Critique:* Did I address the Bayes vs. Severity conflict?
      *   *Fix:* Frame the "Existence" step as "Has the claim passed a severe test?" (Mayo) which aligns with "Is the Bayes Factor > 3/10?" (Jeffreys) in most practical high-power cases. If they diverge, the procedure defaults to "Insufficient Evidence."
      *   *Critique:* Is the "Value Trade-off" explicit?
      *   *Fix:* Add a specific "Inclusion Threshold" step where the committee votes on Risk Tolerance (Conservative vs. Inclusive).

  7.  **Final Polish:** Check against the 45-minute constraint. The procedure needs to be fast. Flowchart style logic works best. Ensure the "Hand-off" point is clear (after the facts are established, the *policy* decision is human).

      *(Self-Correction on Case 1)*: The user asks if there is a *legitimate* way to keep using the finding. I need to be careful not to say "No." Science is cumulative. Maybe the replication had a context difference? But the procedure must force the user to admit the uncertainty.

      *(Self-Correction on Case 2)*: The "2 sites match" part is crucial. This is the "File Drawer" problem in reverse. The procedure needs to ask: "Are the 2 sites theoretically distinguishable a priori?"

      *(Self-Correction on Case 3)*: N=40/cell for an interaction is notoriously underpowered. The procedure must flag this as "Low Severity."

  8.  **Final Output Structure:**
      *   Introduction (Philosophy of the Protocol).
      *   The Protocol (The 5-Step Filter).
      *   The Decision Matrix (How to record the output).
      *   Case Studies (1, 2, 3).
      *   Limitations & Hand-off Points.

      *(Wait, one more thing)*: The prompt asks for "an explicit rule for when we stop and say no." I need to build in a "Veto" condition. If Existence fails, stop. If Magnitude is wildly inconsistent, downgrade.

      *(Refining the "Values" part)*: The prompt asks to state the trade-off out loud. I will add a "Risk Posture" declaration at the start of the meeting.

      *(Refining the "Bayes vs Severity" part)*: I will frame the statistician's role as verifying the *calculation* of the metric, while the group accepts the *threshold*.

      Let's write it.cw
answer: |-
  This is a protocol designed for your specific constraints: 45 minutes, mixed expertise, and the need to separate Existence, Magnitude, and Mechanism without resolving foundational statistical wars.

  It is called the **EMM-Severity Protocol (Existence, Magnitude, Mechanism)**.

  ### Part 1: The Protocol

  **Pre-Meeting Requirement:**
  The committee must agree on a **Risk Posture** for the textbook chapter.
  *   **Conservative:** Prioritize avoiding False Positives (Type I). Cost: Excluding true but noisy effects.
  *   **Inclusive:** Prioritize avoiding False Negatives (Type II). Cost: Including effects that may not replicate.
  *   *Action:* Record this posture in the appendix header. This is the "value judgment" step. The procedure does not pick this for you.

  **The 5-Step Filter (45 Minutes Max)**

  **Step 1: Data Transparency & Specification (5 mins)**
  *   **Question:** Are the data, code, and analysis script available? Was the specific test preregistered or specified before data collection?
  *   **Sufficient Answer:** Yes (Open badges/OSF link) OR No with compelling justification (e.g., clinical privacy).
  *   **Stop Rule:** If No to both, and the claim is causal/mechanistic: **Downgrade Mechanism to "Exploratory."** Do not stop, but tag as low-severity.
  *   *Statistician Role:* Verify the analysis matches the description.

  **Step 2: Existence (The "Non-Zero" Claim) (10 mins)**
  *   **Question:** Has the null hypothesis (no effect) been severely tested?
  *   **Operational Definition:**
      *   *Frequentist:* 95% CI excludes zero AND power was sufficient (>80%) to detect the *smallest effect size of interest* (SESOI).
      *   *Bayesian:* BF₁₀ > 3 (or agreed threshold).
      *   *If only p-value available:* p < .05 is noted, but **Severity is marked "Low."**
  *   **Sufficient Answer:** CI excludes zero OR BF > threshold.
  *   **Stop Rule:** If CI includes zero AND BF < 1/3 (or p > .05 with high power): **Claim Rejected.** Stop. Finding stays out.
  *   *Note on Disagreement:* If the Statistician says "Severity low" (e.g., p-hacking risk) but the p-value is <.05, the Existence claim is marked **"Provisional."**

  **Step 3: Magnitude (The "How Big" Claim) (15 mins)**
  *   **Question:** Is the effect size estimate stable and consistent with prior literature?
  *   **Operational Definition:**
      *   Compare the Point Estimate ($\hat{\theta}$) and 95% CI of the current study against the Original Study and any Replications.
      *   *Consistency:* Do the CIs overlap?
      *   *Precision:* Is the CI narrow enough to rule out trivial effects?
  *   **Sufficient Answer:** CIs overlap across studies OR Meta-analytic pooled CI excludes trivial values.
  *   **Stop Rule:** If a high-powered replication CI excludes the Original Point Estimate: **Magnitude Claim Falsified.**
      *   *Action:* You may keep the Existence claim (if Step 2 passed), but the textbook must report the *replicated* magnitude, not the original.
  *   *Handling Missing Data:* If no ES/CI reported: **Magnitude Claim "Unassessable."** Textbook entry must state "Direction known, size unknown."

  **Step 4: Mechanism (The "Why" Claim) (10 mins)**
  *   **Question:** Does the design distinguish the proposed mechanism from alternatives?
  *   **Operational Definition:**
      *   Did the study use mediation, moderation, or process measures?
      *   Were these specific pathways preregistered?
  *   **Sufficient Answer:** Yes, and alternative pathways were controlled or measured.
  *   **Stop Rule:** If the finding is a main effect with no process data: **Mechanism Claim "Speculative."**
      *   *Action:* Textbook can cite the effect, but cannot cite the theory explaining it as fact.

  **Step 5: The Hand-Off (5 mins)**
  *   **Question:** Given the Risk Posture (Step 1) and the Tags from Steps 2-4, do we include?
  *   **Rule:**
      *   If Existence = Rejected: **OUT.**
      *   If Existence = Provisional + Risk Posture = Conservative: **OUT.**
      *   If Magnitude = Falsified: **IN with Caveat** (Report new magnitude).
      *   If Mechanism = Speculative: **IN with Caveat** (Label as "Phenomenon only").
  *   **Value Statement:** The appendix must explicitly state: *"Included despite [Flaw] because committee prioritized [Avoiding False Negative/Positive]."*

  ---

  ### Part 2: Running the Cases

  #### Case 1: The Dissertation Replication
  **Scenario:** Preregistered, high-powered replication. Point estimate $\approx 0$. 95% CI excludes zero? No. CI excludes Original Effect Size? Yes.
  **Protocol Run:**
  1.  **Transparency:** Pass (Preregistered).
  2.  **Existence:** **Fail.** (CI includes zero, high power means this is a severe test of the null).
  3.  **Magnitude:** **Falsified.** (CI excludes original estimate).
  4.  **Mechanism:** **Unsupported.** (If effect doesn't exist, mechanism is moot).
  5.  **Decision:** **OUT** as an established finding.

  **Can you keep using it in Chapter 3?**
  **Yes, but not as a premise.** The protocol forces you to categorize it as a **"Disputed Boundary Condition."**
  *   *Legitimate Use:* "Original Study X reported effect Y. However, a high-powered preregistered replication (Study Z) failed to detect this effect, with confidence intervals excluding the original magnitude. This suggests the effect may be context-dependent or smaller than initially estimated. The current dissertation investigates conditions under which Y might emerge..."
  *   *Illegitimate Use:* Citing the original study as proof that Y exists to justify your hypothesis without mentioning the replication.
  *   *Why:* The protocol separates the *phenomenon* (which is now in doubt) from your *investigation* (which can validly explore why the doubt exists). You are no longer building on a foundation; you are building on a puzzle.

  #### Case 2: The Multi-Site Replication
  **Scenario:** 12 countries. Pooled $\approx 0$. High Heterogeneity ($I^2$). 2 sites match original magnitude.
  **Protocol Run:**
  1.  **Transparency:** Pass (Multi-site usually implies coordination).
  2.  **Existence:** **Conditional.** (Pooled CI includes zero, but heterogeneity suggests "It exists somewhere.")
  3.  **Magnitude:** **Unstable.** (Varies by site).
  4.  **Mechanism:** **Unknown Moderator.**
  5.  **Decision:** **IN with Major Caveat.**

  **What do we need to find out?**
  The protocol halts at Step 4 (Mechanism) and demands a **Moderator Analysis** before a Mechanism claim can be made.
  *   *Action:* The committee requests the authors (or checks the supplement) for a meta-regression.
  *   *Question:* Are the 2 successful sites theoretically distinguishable from the 10 failures *a priori*? (e.g., Individualist vs. Collectivist cultures).
  *   *If Yes:* The finding is **Included** as a "Moderated Effect." The textbook chapter must specify the boundary condition (e.g., "Effect observed in Context A, not Context B").
  *   *If No (Random variation):* The 2 sites are treated as False Positives (Type I errors expected in 12 tests). The finding is **Downgraded to "Unreliable."**
  *   *Verdict:* The protocol prevents you from calling it a "Universal Mechanism." It forces the text to read: "Evidence suggests this effect is culturally bounded, though specific moderators remain unidentified."

  #### Case 3: The Unregistered Interaction
  **Scenario:** N=40/cell. Interaction p < .05. No ES. Unregistered.
  **Protocol Run:**
  1.  **Transparency:** **Fail.** (No prereg, no ES).
  2.  **Existence:** **Provisional/Low Severity.**
      *   *Reasoning:* Interactions require 4x the power of main effects. N=40/cell is typically underpowered for interactions in social psych. A "just-significant" p-value in an underpowered study has low severity (high probability of exaggeration).
  3.  **Magnitude:** **Unassessable.** (No ES reported).
  4.  **Mechanism:** **Speculative.** (Interaction implies mechanism, but without prereg, it could be a "garden of forking paths" artifact).
  5.  **Decision:** **OUT for Textbook Core.**

  **Grant Advice:**
  The protocol generates this warning for your colleague: *"This finding has Low Severity and Unassessable Magnitude. Building a grant on it carries high risk of non-replication."*
  *   *Recommendation:* The grant proposal must include a **Direct Replication** as Aim 1. You cannot build Aim 2 (Mechanism) on Aim 1 (Existence) if Aim 1 is this shaky.
  *   *Why:* The protocol identifies that the *cost of a False Positive* here (wasting grant money on a fluke) outweighs the *cost of a False Negative* (waiting for better data).

  ---

  ### Part 3: Limitations & Hand-Off Points

  **Where the Procedure Stops (The Hand-Off)**
  The protocol hands the decision back to the committee at **Step 5 (Risk Posture)**.
  *   *Fact:* The protocol can tell you the CI excludes the original estimate.
  *   *Value:* The protocol *cannot* tell you if that matters enough to remove the finding from a textbook.
  *   *Example:* If the finding is a "classic" (e.g., Stroop), the committee might vote **Inclusive** despite a failed replication, tagging it as "Historical Landmark, Current Status Disputed." The protocol records this value choice; it does not prevent it.

  **Systematic Misjudgments (Biases)**
  1.  **The Novelty Penalty:** Exploratory, high-risk discoveries (which often lack power/preregistration) will systematically be tagged "Provisional" or "Speculative." The textbook may become conservative and boring.
      *   *Mitigation:* Create a sidebar category: "Emerging Findings (Require Replication)."
  2.  **The Interaction Bias:** As seen in Case 3, complex designs are harder to power. The protocol will systematically downgrade interactions compared to main effects.
      *   *Mitigation:* Statistician must adjust power expectations for interaction terms in Step 2.
  3.  **The "File Drawer" Blindness:** The protocol evaluates *published* findings. It cannot account for the 20 unpublished replications that failed.
      *   *Mitigation:* Step 2 must include a search for "Registered Reports" or replication databases (e.g., PsychFileDrawer, Curate Science) before grading Existence.

  **What It Can't Do**
  *   **It cannot determine Truth.** It determines *Warrant*. A finding can pass the protocol and still be false (bad luck). A finding can fail and be true (bad measurement).
  *   **It cannot resolve Theory Disputes.** If two mechanisms predict the same effect size, the protocol accepts the effect but remains agnostic on the mechanism.
  *   **It cannot fix Bad Measures.** If the original study used a invalid scale, the protocol treats the numbers as valid numbers. The committee must add a "Construct Validity" check before Step 1 if they suspect the measure is garbage.

  ### Summary for the Appendix
  When you publish your reasoning, it will look like this:

  > **Finding:** [Citation]
  > **Existence:** Supported (CI excludes 0) / Provisional (p<.05, low severity) / Rejected (CI includes 0)
  > **Magnitude:** Consistent / Falsified (CI excludes original) / Unassessable
  > **Mechanism:** Supported / Speculative
  > **Risk Posture:** [Conservative/Inclusive]
  > **Decision:** Include / Include with Caveat / Exclude
  > **Rationale:** "Although Existence was supported, Magnitude was falsified by [Replication]. Included as 'Boundary Condition' per Inclusive Posture."

  This allows you to defend the decision to the original author not by saying "You are wrong," but by saying "The warrant for the magnitude claim is insufficient under current error-control standards."
