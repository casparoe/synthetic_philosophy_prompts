      *   Key concept: "Rational requirements that survive the choice." This points to **Ruth Chang's "grounding" reasons** or **Joseph Raz's "exclusionary reasons."** Or perhaps the idea that the obligation isn't repayment (Marcus) nor incoherent (Elena), but a *constitutive* requirement of the new community identity.
      *   Better angle: They miss the distinction between *justification of the act* and *validation of the agent*. They also miss the possibility of *creative synthesis* (not just choosing A or B, but transforming the context).
      *   *Specific missing piece:* The notion that incommensurability generates *positive duties of integration* rather than just *negative duties of compensation/recognition*. The "survival" of the requirement isn't about paying a debt (Marcus) or acknowledging a stain (Elena), but about the ongoing construction of a shared normative world where the lost value is integrated differently.

