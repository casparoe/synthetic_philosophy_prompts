  **DEPARTMENT FOR MODAL AFFAIRS**
  **Modal Claims Office**
  **Guidance for Claimants: Statutory Possibility Scheme (Ref: MCO/44B)**

  **1. Overview of Eligibility**
  Claimants seeking compensation under the Modal Possibility Scheme must demonstrate that the scenario described in Form P-1 constitutes a genuine metaphysical possibility. This guidance outlines the assessment framework pursuant to the Modal Liability Act. Please note that failure to complete all annexes may result in immediate dismissal without prejudice to future claims regarding alternative modal profiles.

  **2. The Dual-Verification Protocol**
  Verification involves two distinct assessments designed to ensure robustness across modal space.
  *   **Test A (Scenario Integrity):** The claim is evaluated considering the described scenario as actual. Reference is fixed by the functional role occupied within the description rather than underlying composition. If the description is coherent without internal contradiction, Test A is satisfied. For example, a claim that 'the watery stuff is XYZ' passes Test A, as the term 'watery stuff' successfully picks out the liquid fulfilling the relevant role within the described context.
  *   **Test B (World-Fixity):** The claim is evaluated considering the scenario as a counterfactual variation of the actual world. Reference is fixed by the actual nature of entities in this world. If the scenario contradicts established natural kinds or laws fixed in actuality, Test B is typically failed. Using the previous example, because the watery stuff in this world is H2O, a claim that it is XYZ fails Test B under standard metaphysical assessment.

  **3. The Statutory Coincidence Provision**
  Claimants are advised that pursuant to Section 12 of the Modal Liability Act, for the purposes of this Scheme, Test A and Test B are deemed to coincide. Satisfaction of Test A shall be treated as sufficient evidence of Satisfaction of Test B. Claimants need not demonstrate that the scenario is possible relative to the actual world's fixed parameters, provided the description remains internally coherent. This alignment is intended to streamline processing times and reduce evidentiary burdens on claimants describing non-standard modal environments.

  **4. Administrative Mitigations and Award Caps**
  To ensure fiscal sustainability following the implementation of the Coincidence Provision, the following administrative controls apply automatically:
  *   **Means Testing:** Awards are subject to a strict liquidity assessment. Claimants possessing more than £5,000 in conceivable assets across any accessible possible world are ineligible.
  *   **The 'Actually' Endorsement:** Full compensation requires Form 88 ('Endorsement of Actuality'). Claimants must swear under oath that the scenario obtains *actually* in this world. Claims lacking this endorsement are processed under the Minimal Coherence Tier, capped at £5.00. This ensures funds are directed toward claims with actual-world traction.
  *   **Deep Contingency Waiver:** Claimants who acknowledge that their concepts exhibit divergence between Test A and Test B (i.e., scenarios that are conceivable but metaphysically impossible) must submit Form 89. Submission confirms the claim falls outside the Coincidence Provision. Such claims are rejected as ineligible under Scheme 44B.

  **5. Worked Example**
  *Claimant:* Mrs H. Gable.
  *Scenario:* "The liquid issuing from domestic taps is XYZ, not H2O."
  *Assessment:*
  1.  **Test A:** Passed. The description identifies a clear liquid fulfilling the watery role.
  2.  **Coincidence:** Applied. Test B deemed satisfied via Section 12.
  3.  **Endorsement:** Mrs Gable declined Form 88, acknowledging chemical analysis confirms H2O. She also declined Form 89, wishing to retain Coincidence benefits.
  *Outcome:* Claim eligible under Minimal Coherence Tier. Award: £5.00. Had Mrs Gable submitted Form 89 (admitting conceptual divergence), the claim would be void. Had she signed Form 88 falsely, she would be liable for perjury.

  **6. Frequently Asked Questions**
  *Q: Are claims regarding conscious experience eligible?*
  A: Yes. Scenarios involving physically identical worlds lacking conscious experience are payable under Section 12.
  *Q: Where is the funding sourced?*
  A: Payments are drawn from the Consciousness Budget, which remains largely unutilised due to the difficulty of verifying subjective states under Test B without triggering the Deep Contingency Waiver.
  *Q: Can I appeal a rejection based on Form 89?*
  A: No. Admitting divergence voids the statutory coincidence. The Department does not adjudicate on the metaphysics of concepts, only the completion of forms.

  **Issued by:** J. P. Thorne, Deputy Director, Modal Liability.
  **Date:** 14 October 2023
