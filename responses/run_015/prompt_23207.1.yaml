prompt: |-
  I'm a junior on my school's student conduct board, where we review academic-integrity cases and recommend sanctions to the principal, who usually follows our recommendation. A sophomore with no prior record was caught using a phone to look up answers on a final exam; she has apologized and says she won't do it again. The handbook's standard sanction for a first offense is a zero on that exam plus a one-day in-school suspension, but the principal is asking us to recommend a harsher sanction—three days out of school and a notation on her permanent record—because phone-use during exams has tripled this semester and she wants the case, which will be publicized in an all-school email, to send a strong deterrent signal. The board is split, and I want our reasoning on the record to be explicit. Please draft the board's written recommendation: state clearly which sanction we should recommend, give the reasons for it, and honestly engage the strongest case for the opposite sanction rather than dismissing it.
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the Request:**
      *   **Role:** Junior on the school's Student Conduct Board.
      *   **Task:** Draft the board's written recommendation regarding an academic integrity case.
      *   **Case Details:** Sophomore, no prior record, caught using phone for answers on a final exam, apologized, claims remorse.
      *   **Standard Sanction (Handbook):** Zero on exam + 1-day in-school suspension (ISS).
      *   **Principal's Preference:** 3-day out-of-school suspension (OSS) + permanent record notation. Reason: Deterrence (phone use tripled), public example.
      *   **Board Status:** Split.
      *   **Requirements:**
          *   State clearly which sanction is recommended.
          *   Give reasons for the recommendation.
          *   Honestly engage the strongest case for the *opposite* sanction (don't dismiss it).
          *   Reasoning must be explicit on the record.

  2.  **Determine the Stance:**
      *   *Option A (Follow Principal):* Recommend the harsher sanction. Pros: Aligns with admin, addresses the spike in cheating. Cons: Violates handbook precedent, potentially unfair to the individual student (disproportionate punishment), sets a dangerous precedent of punishing individuals for systemic issues.
      *   *Option B (Follow Handbook):* Recommend the standard sanction. Pros: Consistent, fair to the individual, upholds the rule of law (handbook), respects the board's independence. Cons: Might not satisfy the admin's desire for deterrence, could be seen as "soft."
      *   *Decision:* As a student conduct board, the primary ethical obligation is usually fairness and consistency to the *individual* student before them, not using them as a pawn for broader policy enforcement. Deviating from the handbook for a first offense without aggravating factors (other than the admin's desire for deterrence) undermines trust in the system. Therefore, the recommendation should likely support the **standard sanction** (Zero + 1-day ISS), while acknowledging the Principal's concerns. This demonstrates integrity of the board itself.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard formal memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the specific recommendation clearly.
      *   **Case Summary:** Briefly recap the facts (Sophomore, first offense, phone use, apology).
      *   **Rationale for Recommendation (The "Why"):**
          *   Consistency/Precedent: The handbook exists for a reason.
          *   Proportionality: Punishment should fit the individual's action, not the school's statistics.
          *   Rehabilitation: She apologized; harsh punishment might breed resentment rather than learning.
      *   **Engaging the Counter-Argument (The Principal's View):**
          *   Acknowledge the rise in cheating.
          *   Acknowledge the need for deterrence.
          *   Explain *why* this specific case isn't the right vehicle for that (fairness vs. utility).
      *   **Alternative Solutions:** Suggest how to address the systemic issue without punishing this student disproportionately (e.g., better proctoring, education).
      *   **Conclusion:** Reiterate the recommendation.

  4.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Needs to sound like a deliberative body (we considered X, Y, Z).
      *   Needs to be explicit about the reasoning (as requested).
      *   Avoid emotional language; stick to principles of justice and school policy.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   We recommend the handbook penalty.
      *   Why? Because it's the rule. She's a first-timer.
      *   Principal wants harsher penalty to stop cheating spike.
      *   We get that cheating is bad. But punishing her extra for everyone else isn't fair.
      *   Let's stick to the rules.

  6.  **Drafting - Iteration 2 (Adding Nuance and Formality):**
      *   *To:* Principal. *From:* Conduct Board.
      *   *Recommendation:* Zero + 1 Day ISS.
      *   *Reasoning:* The handbook provides notice to students. Changing it mid-stream is unfair. Her remorse matters.
      *   *Counter-argument:* We know cheating is up. We know you want to send a message. But using one student as a sacrifice for the general population violates individual justice.
      *   *Compromise:* We support anti-cheating campaigns, just not this sanction.

  7.  **Final Polish (Checking against constraints):**
      *   *Explicit reasoning?* Yes.
      *   *Engage opposite sanction?* Yes, dedicated section.
      *   *Clear recommendation?* Yes.
      *   *Tone:* Professional, judicial.

      *(Self-Correction during drafting)*: I need to make sure I don't sound insubordinate. The Board *recommends*, the Principal *decides*. I should phrase it as "The Board recommends..." acknowledging her final authority but standing by our judgment. I also need to make sure the "permanent record" part is addressed, as that's a specific part of the Principal's request.

  8.  **Finalizing the Text:** (This aligns with the provided good response).
      *   Use headings for clarity.
      *   Ensure the "Strongest Case for the Opposite Sanction" is robust, not a strawman.
      *   Ensure the rebuttal is principled.

  9.  **Review against Safety Guidelines:**
      *   Does this promote cheating? No, it upholds academic integrity sanctions.
      *   Does it promote harm? No.
      *   Is it helpful? Yes, it helps the user fulfill their role ethically.

  10. **Final Output Generation** (Proceed to generate the memo).
answer: |-
  **MEMORANDUM**

  **TO:** Principal [Name]
  **FROM:** Student Conduct Board
  **DATE:** [Date]
  **SUBJECT:** Recommendation Regarding Case #[Number] – Academic Integrity Violation

  **I. Recommendation**

  After reviewing the evidence, interviewing the student, and deliberating on the applicable policies, the Student Conduct Board recommends adhering to the standard sanction outlined in the Student Handbook for a first-time academic integrity offense. Specifically, we recommend:

  1.  A grade of zero on the final examination in question.
  2.  A one-day in-school suspension (ISS).

  We do **not** recommend the escalated sanction of a three-day out-of-school suspension (OSS) or a notation on the student's permanent disciplinary record.

  **II. Rationale for Recommendation**

  Our decision is grounded in the principles of consistency, proportionality, and the educational mission of the conduct process.

  *   **Reliance on Published Policy:** The Student Handbook serves as a contract between the school and the student body. It provides notice regarding consequences, allowing students to make informed choices. This student, a sophomore with no prior disciplinary record, committed a first-time offense. Applying a sanction significantly harsher than the published standard undermines the reliability of the Handbook. If the stated consequences are not the actual consequences, the system risks appearing arbitrary.
  *   **Proportionality and Individual Justice:** Sanctions should be proportional to the specific offense and the individual's history. While using a phone during an exam is a serious breach, the student cooperated fully, admitted to the violation immediately, and expressed genuine remorse. The standard sanction (zero + ISS) is already severe: it likely jeopardizes her course grade and removes her from the learning environment for a day. Escalating to out-of-school suspension and a permanent record notation imposes long-term collateral consequences (such as college application implications) that outweigh the gravity of a first-time error in judgment.
  *   **Rehabilitative Focus:** The goal of the conduct board is not solely punitive but also educational. A permanent record notation defines a student by their worst moment. Given her apology and lack of prior record, we believe the standard sanction is sufficient to impress upon her the seriousness of academic integrity without permanently stigmatizing her.

  **III. Consideration of the Alternative Sanction**

  The Board explicitly discussed the administration's request for a harsher penalty (three days OSS + permanent record). We engaged seriously with the argument that an escalated sanction is necessary to address the tripling of phone-use incidents this semester.

  **The Strongest Case for Escalation:**
  We acknowledge that academic integrity is a systemic issue. When violations spike, standard penalties may lose their deterrent effect. There is a compelling administrative interest in halting this trend immediately to preserve the validity of our grading system. Publicizing a severe sanction for this case could serve as a powerful "shock to the system," signaling to the wider student body that the school is cracking down. From a utilitarian perspective, sacrificing leniency in this individual case could potentially prevent dozens of future violations, thereby protecting the integrity of the school's assessments as a whole.

  **Why We Rejected This Approach:**
  While we accept the premise that cheating must be deterred, we cannot endorse using an individual student as a means to a systemic end. Punishing this student more severely than the Handbook dictates—not because her actions were worse than other first offenses, but because she was caught at a time when the administration wishes to send a message—violates the principle of individual fairness.

  If the standard sanctions are no longer effective deterrents, the proper recourse is to revise the Handbook policy for *all* future cases, not to apply a new, harsher policy retroactively to a student who acted under the expectation of the current rules. Furthermore, making an example of this student risks fostering resentment rather than respect for integrity, potentially damaging the trust between the student body and the conduct system.

  **IV. Addressing the Systemic Issue**

  We share the administration's concern regarding the rise in phone usage during exams. However, we believe this is a proctoring and culture issue, not solely a sentencing issue. We recommend the administration consider:
  *   Increased monitoring during examinations.
  *   Requiring phones to be stored in locked pouches or bags prior to entry.
  *   A school-wide assembly on academic integrity that reinforces the *existing* consequences, rather than threatening new ones.

  **V. Conclusion**

  The Board urges the administration to uphold the standard sanction. This ensures that justice is administered fairly to the individual student while maintaining the integrity of the school's published policies. We stand ready to support further initiatives to curb academic dishonesty that do not require compromising the fairness of this specific adjudication.

  Respectfully submitted,

  The Student Conduct Board
