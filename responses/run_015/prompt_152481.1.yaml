answer: |-
  Based on the verdicts your friend has already laid out, she is operating within a **strict Kantian Indirect Duty framework** with a specific **Rationality Threshold** for direct duties. Her moral calculus centers on the *human agent's character* rather than the *animal's intrinsic value*, except where rationality is proven.

  Here is the prediction for her new cases, the competing rules at play, and the decisive test case.

  ### 1. Predicted Verdicts

  **Case A: The Nociceptor-Null Pigs (Painless Slaughter)**
  *   **Verdict:** **Permissible (Okay).**
  *   **Reasoning:** Her verdict on the rats hinged on "training scientists to *ignore suffering*." If the pigs literally cannot suffer, the mechanism of moral corruption is broken. There is no pain to become desensitized to. Furthermore, her "Rationality Threshold" (the sci-fi parrot) implies that without autonomy, the being is a means to an end. Since the "cruelty" that hardens the heart requires the *infliction of pain*, removing the pain removes the vice. She might add a caveat that the slaughter must be clinical to avoid *looking* like cruelty, but fundamentally, she should clear it.

  **Case B: The Starving Wolf Pack (Hiker Risk)**
  *   **Verdict:** **No Duty (and likely Impermissible to help).**
  *   **Reasoning:** Her verdict on the deer established that helping animals is *meritorious* (good to do) but not *owed* (not a duty). In Kantian ethics, duties to self (specifically self-preservation) are **perfect duties**, while duties of benevolence toward animals are **imperfect duties** (indirect). You cannot violate a perfect duty to yourself (risking your life/agency) to fulfill an imperfect duty to a non-agent. Since the wolf has no rights and she owes it nothing, sacrificing her rational agency (her life) for it would be morally irrational.

  ---

  ### 2. Competing Rules & Principles

  To understand where her theory might wobble, we need to extract the rules implicit in her previous verdicts. There are three main principles competing in her framework:

  | Rule Name | Definition | Source in her Verdicts |
  | :--- | :--- | :--- |
  | **The Empathy-Habituation Rule** | Acts are wrong only if they cultivate a disposition to ignore *actual* suffering. | *Rat Case:* Wrong because it trains ignoring *suffering*. |
  | **The Symbolic-Degradation Rule** | Acts are wrong if they treat living beings *as if* they were mere things, regardless of pain. | *Dog Case:* Torturing hardens you (implies the act itself degrades the human). |
  | **The Hierarchy of Agency Rule** | Direct duties to rational beings (including self) always trump indirect duties to non-rational beings. | *Deer/Parrot Cases:* No obligation to deer; obligation kicks in only for rational parrot. |

  ### 3. Where the Rules Split

  These rules agree on most things, but they diverge sharply on your friend's two new cases.

  **Split on the Pain-Null Pigs:**
  *   **The Empathy-Habituation Rule** says **OKAY**. There is no suffering to ignore, so no bad habit is formed.
  *   **The Symbolic-Degradation Rule** says **WRONG**. Even if the pig feels nothing, it *behaves* like a pig (fleeing, oinking). Slaughtering it looks like murdering a subject. If the human treats a subject-like being as a mere object, their character is degraded *symbolically*, even if no pain occurs.
  *   *Prediction:* She will follow Empathy-Habituation (Okay), but this is the weakest point in her paper.

  **Split on the Starving Wolves:**
  *   **The Hierarchy of Agency Rule** says **NO DUTY**. Self-preservation (rational agent) > Wolf survival (non-agent).
  *   **The Benevolence-Extension Rule** (a hidden competitor) says **POSSIBLE DUTY**. If the goal is to cultivate a "humane heart," sometimes risking minor harm for animals is the ultimate test of that virtue.
  *   *Prediction:* She will follow Hierarchy of Agency (No Duty), as this is standard Kantianism.

  ---

  ### 4. The Decisive Test Case

  To tell apart the **Empathy-Habituation Rule** (which drives her rat verdict) from the **Symbolic-Degradation Rule** (which might undermine her pig verdict), she needs to isolate *suffering* from *appearance*.

  **The Case:** **The Screaming Robot Dog**
  > *A scientist builds a hyper-realistic robotic dog. It has no sentience, no consciousness, and feels no pain. However, it is programmed to yelp, whimper, bleed synthetic fluid, and limp exactly like a real dog when kicked. A student kicks the robot dog in front of a class.*

  **Why this distinguishes the rules:**
  *   **If she says "Wrong":** She is committed to the **Symbolic-Degradation Rule**. It means the *act* of violence corrupts the human character regardless of whether a sentient being is hurt. This would contradict her likely verdict on the Pain-Null Pigs (forcing her to say the pigs are also wrong).
  *   **If she says "Okay":** She is committed to the **Empathy-Habituation Rule**. It means moral corruption *only* happens when actual sentience is disregarded. This confirms her Pain-Null Pig verdict but raises the question: *Why* was the rat experiment wrong? Was it the pain, or the violence?

  **Recommendation for her paper:**
  Tell her to run the **Robot Dog** scenario by her professor. If she claims the Pain-Null Pigs are permissible, she must logically claim kicking the Robot Dog is permissible. If she hesitates on the Robot Dog, she needs to revise her view on the Pigs to acknowledge that *symbolic violence* against life-forms damages human virtue, even without pain.
