answer: |-
  Here is a plan for your 75-minute seminar. It is designed to move from intuition to formal structure without getting bogged down in algebra, while respecting the specific constraints and misconceptions you identified.

  ### 1. Order of Components and Dependencies

  Your proposed order is logically sound, but for non-micro students, the **Social States** framing must be established *before* preferences are introduced, or they will treat the choices as isolated private acts rather than social outcomes.

  **The Sequence:**
  1.  **Social States (The Ontology):** Define the object of choice. A "state" is not just "what I do," but "what everyone does."
      *   *Dependency:* Cannot define Preferences until States are defined.
      *   *Pedagogical Move:* Draw a matrix on the whiteboard. Rows = A's options, Columns = B's options. Each cell is a *social state*.
  2.  **Preferences (The Input):** Elicit rankings over these states.
      *   *Dependency:* Cannot apply Pareto or Liberalism until rankings exist.
  3.  **The Pareto Condition (Efficiency):** If everyone prefers state $x$ to $y$, society prefers $x$ to $y$.
      *   *Dependency:* Requires Preferences.
  4.  **Minimal Liberalism (Rights):** An individual is decisive over pairs of states that differ *only* in their personal component.
      *   *Dependency:* Requires Social States (to identify what counts as "personal").
  5.  **The Cycle (The Discovery):** **Students must derive this themselves.**
      *   *When:* After steps 1–4 are on the board. Hand out the profile. Ask them to apply the three rules to find the social ranking.
      *   *Why:* If you show the cycle, they will view it as a logical trick. If they derive it, they experience the inconsistency as a structural clash.

  ### 2. The Carrying Example

  **The Hard Truth:** You cannot construct an example that generates the paradox without **preference interdependence** (agents caring about the other's personal sphere). If preferences are strictly separable (I only care about my room, you only care about yours), the paradox vanishes. The theorem proves that *even decent* interdependence creates a clash.

  Do not try to hide the interdependence; make it **sympathetic**. Avoid the "Prude/Lewd" moral judgment. Use a "Competence/Modesty" frame.

  **Recommended Example: "The Team Presentation"**
  *   **The Setup:** Two graduate students, A and B, must decide who gives a departmental talk.
  *   **The Personal Spheres:**
      *   A decides whether *A* presents ($a$) or not ($\bar{a}$).
      *   B decides whether *B* presents ($b$) or not ($\bar{b}$).
  *   **The Social States:**
      1.  $a$: A presents, B does not.
      2.  $b$: B presents, A does not.
      3.  $o$: Neither presents (Talk cancelled).
      *(Ignore the state where both present for simplicity, or treat it as technically impossible).*
  *   **The Preferences (Handout this profile):**
      *   **A (Modest):** $o \succ a \succ b$
          *   *Reasoning:* "I'd rather cancel than force myself on you ($o \succ a$), but if someone must do it, it should be me rather than you ($a \succ b$)."
      *   **B (Supportive):** $a \succ b \succ o$
          *   *Reasoning:* "You are the better speaker ($a \succ b$), but if you won't do it, I will ($b \succ o$)."
  *   **Why this works:**
      *   **Pareto Pair:** Compare $a$ and $b$. Both prefer $a$ (A presents). This is based on shared objective judgment (competence), not nosiness.
      *   **Liberal Pair A:** A decides between $o$ and $a$. A prefers $o$ (Modesty).
      *   **Liberal Pair B:** B decides between $b$ and $o$. B prefers $b$ (Responsibility).
      *   **The Cycle:**
          1.  By A's Right: $o \succ a$.
          2.  By Pareto: $a \succ b$.
          3.  By B's Right: $b \succ o$.
          4.  Result: $o \succ a \succ b \succ o$.
  *   **What it lacks:** It lacks *moralistic* meddling. The interdependence is about coordination and quality, which students endorse.
  *   **Caveat:** If students press that A's preference ($o \succ a$) is irrational (why cancel if you are willing?), explain that "Modesty" can be a strong preference (e.g., fear of public speaking). The logic holds regardless of *why* they hold the preference, provided they do.

  ### 3. Misconceptions (Order of Formation and Intervention)

  1.  **"This proves Liberalism is impossible."**
      *   *When:* Immediately after the cycle is revealed.
      *   *Correction:* It proves three *specific formal conditions* are inconsistent. It is a "Trilemma," not a refutation of liberty. One condition must be relaxed.
  2.  **"Just exclude meddlesome preferences."**
      *   *When:* During the example discussion.
      *   *Correction:* In the "Presentation" example, the preferences are decent (competence/modesty). Restricting preferences means restricting *values*, which is illiberal. Also, logically, *any* interdependence triggers this, not just "nosy" ones.
  3.  **"Pareto is obvious; Rights must give."**
      *   *When:* When discussing solutions.
      *   *Correction:* Pareto is a condition of *efficiency*, not justice. If a slave owner and slave both prefer a state where the slave works harder, Pareto ranks it higher. Rights often *block* Pareto improvements (e.g., I can't sell you my vote even if we both want me to).
  4.  **"Markets/Contracts solve this."**
      *   *When:* Towards the end.
      *   *Correction:* Markets presuppose property rights. This theorem asks how we *assign* those rights when preferences conflict. Coasean bargaining assumes low transaction costs and clear initial entitlements; the paradox arises in defining the entitlements themselves.
  5.  **"It's just Arrow's Theorem."**
      *   *When:* If a micro student raises it.
      *   *Correction:* Arrow is about aggregating preferences without a dictator. Sen is about aggregating preferences while *guaranteeing* specific individuals decisiveness over specific issues. It's a different impossibility.

  ### 4. The Mid-1970s Move (Gibbard and Conditional Rights)

  *   **Attribution:** You are correct. Allan Gibbard's 1974 paper, *"A Pareto-Consistent Liberal Claim,"* is the standard reference for shifting from "outcome decisiveness" to "game-form freedom."
  *   **Timing:** **Do not make this core content.** It belongs in the final 10 minutes as a "horizon" or "resolution sketch."
  *   **Prerequisites:** Students must fully grasp the "outcome" framing (Sen) first. If you introduce game forms too early, they will confuse *strategic power* with *social choice*.
  *   **How to teach it:**
      *   Explain that Sen defines a Right as "I get the outcome I want."
      *   Gibbard defines a Right as "I get to choose my *strategy* (my action), regardless of the outcome."
      *   In the Presentation example: A has the right to *choose* not to present. If A chooses not to, and B chooses not to, the outcome is $o$. A cannot demand $a$ if B doesn't cooperate.
      *   *Crucial Distinction:* Sen's paradox assumes rights guarantee outcomes. Gibbard argues rights only guarantee the *opportunity* to act. This dissolves the cycle but changes the definition of liberty.
  *   **Verdict:** Mention it to show the debate is live, but do not try to prove Gibbard's result.

  ### 5. What to Refuse to Cover

  *   **The Formal Proof:** Do not write out the transitivity algebra.
      *   *Justification:* "We are political theorists, not mathematicians. We need to understand the *structure* of the conflict, not verify the arithmetic."
  *   **Welfarism vs. Rights:** Do not dive into Sen's later work on capabilities or the meta-ethical debate on whether welfare is the only information that matters.
      *   *Justification:* "That concerns *why* we value rights. Today is about *whether* we can logically coexist with efficiency."
  *   **Full Game Theory:** Do not introduce Nash Equilibrium formalism.
      *   *Justification:* "We are using 'strategy' intuitively. Formal game theory is a separate module."

  ### 6. End-of-Session Question

  **Task:** "The Three-Neighbour Fence"
  *   **Setup:** Three neighbours (1, 2, 3). Each decides whether to build a fence ($F$) or not ($N$).
  *   **Rights:** Each is decisive over their own fence ($F_i$ vs $N_i$) holding others constant.
  *   **Profile:**
      *   1 prefers: (All F) > (All N) > (Only 1 has F).
      *   2 prefers: (All N) > (All F) > (Only 2 has F).
      *   3 prefers: (All F) > (All N) > (Only 3 has F).
  *   **Question:** "Identify one pair of states where Pareto applies. Identify one pair where Person 2's Right applies. Do these two judgments conflict in a cycle with Person 1's Right? Sketch the cycle."
  *   **Goal:** Tests if they can identify the *decisive pairs* and the *Pareto pair* in a fresh context, rather than recalling the "Presentation" verdict.

  ### 7. Meta-Commentary: Settled vs. Contested

  You must explicitly distinguish the **logic** from the **interpretation**.

  *   **Settled:** The mathematical inconsistency is valid. Given the definitions of Social States, Pareto, and Minimal Liberalism (as outcome decisiveness), the cycle is unavoidable.
  *   **Contested:**
      1.  **The Definition of Rights:** Is a right "decisiveness over outcomes" (Sen) or "freedom to choose actions" (Gibbard/Nozick)? Most political philosophers now reject Sen's definition as too strong, but accept it as a *reductio* of that specific definition.
      2.  **The Status of Pareto:** Should Pareto yield to Rights? (Many say yes, making the paradox a reason to limit Pareto, not Rights).
      3.  **Preference Restriction:** Is it legitimate to exclude "meddlesome" preferences? (Sen says no; some liberals say yes).
  *   **Your Framing Risk:** By teaching Sen's formulation, you risk presenting "Rights as Outcome Decisiveness" as the standard definition of liberalism.
      *   *Correction:* Explicitly state: "Sen is testing a specific, strong definition of rights. Many liberals reject this definition *because* of this paradox. We are studying the paradox to understand the limits of *this* model, not to bury liberalism itself."

  ### Summary of Timing (75 Minutes)
  *   **00–15:** Social States & Preferences (The Presentation Example).
  *   **15–30:** Defining Pareto & Liberalism (Whiteboard definitions).
  *   **30–45:** **Student Work:** Handout profile, find the cycle in small groups.
  *   **45–60:** Discussion of Misconceptions (Why isn't this just about nosiness?).
  *   **60–65:** Gibbard/Conditional Rights (The "Horizon").
  *   **65–75:** End Question & Wrap-up (Settled vs. Contested).
