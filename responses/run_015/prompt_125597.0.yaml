answer: |-
  You're right to be wary of your writing group. Moral outrage is easy; intellectual conversion is hard. If Ishbel just decides slavery and empire are evil because she's a good person, you've written a sermon, not a novel. If she decides it because she's done the math and found the numbers lie, you've got a character.

  You've also done your homework on Smith. You're correct that *The Wealth of Nations* is primarily a critique of efficiency, not a manifesto for human rights. But I think you're boxing yourself in with two dichotomies that are leakier than you suspect. I'm going to push back on your frameworks first, because fixing them solves your problem with Ishbel.

  ### 1. The Auditor vs. The Neighbour
  You're treating these as separate categories: one about money, one about consent. I'd argue that for Smith, and therefore for Ishbel, they are the same thing viewed from different angles.

  Smith's core concept is "natural liberty." People should be free to pursue their own interest in their own way, provided they don't harm others. The colonial system violates this twice: it stops the British merchant from trading where he likes, and it stops the colonist (and the enslaved person) from owning themselves or their labor.

  Here's the pushback: The Auditor's objection *contains* the Neighbour's objection. Why doesn't the empire pay? Because coercion is expensive. You have to pay for the navy, the forts, the wars. Why is it coercive? Because the profit depends on excluding others from the trade. If the trade were free, the profit would vanish. Therefore, the profit *is* the coercion.

  For Ishbel, this means she doesn't need to import modern human rights language to get to "injustice." She just needs to follow the ledger to its source. If her father's profit relies on the Navigation Acts (which force Virginia to sell only to Britain), then his profit is a transfer of wealth achieved by law, not by skill. It's a subsidy. If she realizes that the "wealth" of Glasgow is actually a extraction maintained by force, the ledger becomes a moral document. The inefficiency *proves* the injustice. A system that requires violence to remain profitable is inherently unjust, even by 18th-century standards.

  So, don't let her choose between Auditor and Neighbour. Let her realize the Auditor *is* the Neighbour in disguise. The money is bloody because the mechanism is violent.

  ### 2. Universality vs. Stages of Society
  You're worried that Smith's belief in human universality (the philosopher vs. the porter) clashes with his stages of society (hunting to commerce), and that this makes Ishbel's position unstable. I'd argue this tension is exactly where her character lives.

  Smith isn't saying some societies are biologically superior. He's saying they are *circumstantially* different. A Native American hunter isn't less capable than a Glasgow merchant; he's just operating in a different economic context. This is crucial for Ishbel. If she accepts the "stages" theory without the racism, she can argue that the empire isn't "civilizing" anyone. It's actually *keeping* them in a lower stage.

  How? By destroying local industry. If Virginia is forced to grow only tobacco and buy only British manufactured goods, it cannot develop its own commerce. It is stuck in the "farming" stage by design. The empire claims to bring progress, but its monopolies prevent progress.

  This isn't an instability in Smith; it's a weapon for Ishbel. She can use Smith's own logic to say: "You claim we are bringing them to commerce, but your laws forbid them from becoming merchants." This allows her to be anti-imperialist without needing to believe in modern equality. She believes in *potential*. The empire is stifling potential. That is a waste, and for Smith, waste is a sin.

  ### Addressing Your Three Problems

  **(a) How does she answer "But what if it did pay?"**
  This is the hardest question, because Smith admits empire *can* pay if managed perfectly (though he doubts it). Ishbel needs to shift the ground from "profit" to "corruption."

  Smith argues that the wealth from colonies doesn't go to the public; it goes to a specific class of merchants who then buy influence in Parliament. They corrupt the constitution. So Ishbel's answer is: "Even if it pays, it buys us." The cost isn't just tax money; it's political liberty at home. The tobacco lords become a power unto themselves, bending the law to their will. She can look at her father and see this happening. He isn't just a merchant; he's a lobbyist with a ledger. The profit is real, but the price is the soul of the nation. She can argue that a profit that requires the corruption of the homeland is a net loss.

  **(b) Are Smith's remedies an alternative to empire or just tidier empire?**
  Smith suggests either full integration (American representation in Parliament) or letting them go. He prefers integration but thinks it's unlikely.

  For Ishbel, this is where she diverges from Smith. Smith is a reformer; she can be a radical. She can look at the distance and the cultural drift and say integration is a fiction. You can't represent Virginia in London without destroying Virginia's distinct interest. So, if Smith says "let them go if integration fails," Ishbel skips the "if." She sees the failure already happening.

  She doesn't need to propose a new system. She just needs to advocate for the removal of the old one. Her "anti-imperialism" isn't a grand theory of global justice; it's a negative capability. It's the removal of the monopoly. If the chains are taken off, let the chips fall. That is a very Smithian position. It's not "tidier empire"; it's the dissolution of empire through neglect. She can argue that the only honest relationship is trade without rule.

  **(c) Can she get from Smith to "this is an injustice" without importing modern morals?**
  Yes, but she has to use the word "justice" the way Smith used it: as negative harm.

  Smith distinguishes between "beneficence" (being nice) and "justice" (not hurting). You can't force someone to be beneficent, but you can force them to be just. Ishbel can argue that monopoly *is* harm. It restricts the natural liberty of the Virginian to trade with France, or the enslaved person to own their labor.

  She doesn't need to say "all men are created equal." She needs to say "no man has the right to restrict another's labor for his own gain." That is a property argument. It's Locke mixed with Smith. If I own my labor, and you take the fruit of it by force of law, you have stolen from me. Ishbel can view the colonial system as a massive theft operation protected by the navy. She arrives at "injustice" not through empathy, but through property rights. She realizes the tobacco isn't her father's property; it's stolen goods.

  ### Novelistic Implications

  This gives you a specific kind of conflict for Ishbel. She isn't fighting her father on moral grounds ("Slavery is sin"); she's fighting him on professional grounds ("This business model is unsustainable and corrupt").

  *   **The Scene:** When she reads the book by the fire, don't have her weep for the enslaved. Have her calculate. Have her look at her father's ledger and see the "cost of governance" hidden in the price of tobacco. She sees the war ships not as protection, but as debt.
  *   **The Conflict:** Her father argues from tradition and stability. She argues from efficiency and liberty. He says, "This is how we live." She says, "This is how we rot."
  *   **The Instability:** You mentioned a sinking feeling that Smith's position is unstable ("both, and he never noticed"). Lean into that. Let Ishbel feel that instability. She sees the gap between Smith's "all men are alike" and "some societies are backward." She has to resolve it herself. Maybe she decides that the "backwardness" is caused by the "alikeness" being suppressed. That's a brilliant insight for a self-taught woman in 1776. It makes her smarter than the professor who wrote the book.

  ### One Last Pushback

  You're worried about anachronism. Don't be. The language of "natural liberty" was everywhere in 1776. The Americans were using it to justify independence. The Scots were using it to justify free trade. Ishbel just needs to apply the Scottish argument to the American situation.

  The risk isn't that she sounds too modern; it's that she sounds too consistent. Smith was a pragmatist. He hedged. Ishbel should hedge too, at first. She shouldn't become a fully formed abolitionist overnight. She should become a skeptic of monopoly. That skepticism leads her to question the tobacco trade, which leads her to question the slavery underpinning it, which leads her to question the empire itself.

  Let her arrive at the moral conclusion via the economic door. It's slower, but it's solid. And when the floor gives way beneath her father's feet, it'll be because she loosened the beams with math, not anger.

  Get her to ask: "Who owns the risk?" If the empire takes the profit but the public pays for the war, the contract is void. That's a breach of contract. That's something a merchant's daughter understands.
