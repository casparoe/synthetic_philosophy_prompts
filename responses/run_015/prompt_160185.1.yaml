answer: |-
  1. The practice strictly has to assume the number is a measurement to punish fraud, but it just happens to fit bureaucratic needs when treated as the definition of quality for budgeting.
  2. Your theory is right that this inconsistency is load-bearing, because central administration needs the metric to be real enough to control clinics but fake enough to discipline specific behaviors.
  3. If you admitted the number is only evidence, you would have to replace automated formulas with expensive human judgment, losing the scalable illusion of objective control.
  4. There is nothing in the shadow metric idea that isn't simply adding another number, because staff will game the gap by predicting audits rather than improving care.
  5. Ultimately, any system tying high-stakes rewards to simplified metrics will incentivize managing the data over managing patients, regardless of how many layers of audit you add.
