answer: |-
  **Essay Question**

  **Topic:** The Easy Knowledge Trilemma and the Bootstrapping Objection

  **Question:**
  Reconstruct the argument that the closure of knowledge under known entailment follows from the conjunction of three principles: (i) the luminosity of knowledge ($Kp \to KKp$), (ii) the closure principle itself, and (iii) the claim that one can know one's entitlements to trust a perceptual source. Explain precisely how the "bootstrapping" objection (e.g., the red table or reliable thermometer cases) utilizes this reconstruction to generate an absurdity. 

  Your task is not merely to summarize the debate but to diagnose the failure. Argue for the rejection of **exactly one** of these three ingredients. You must defend the remaining two as more defensible than the rejected ingredient and explain the specific theoretical cost incurred by your chosen rejection. A successful answer will demonstrate why the bootstrapping objection targets the structural role of your chosen ingredient, rather than simply asserting that bootstrapping results are intuitively unacceptable.

  ***

  **Model Answer**

  The "Easy Knowledge" problem arises when we combine three plausible epistemic principles to derive the conclusion that an agent can acquire knowledge of a source's reliability merely by using that source. The reconstruction runs as follows: If an agent knows a proposition $p$ via a source $S$ (Ingredient 3: Knowledge of Entitlement), and knows that $p$ entails that $S$ is reliable (via logical entailment), then by Closure (Ingredient 2), the agent knows $S$ is reliable. If we further assume Luminosity (Ingredient 1: $Kp \to KKp$), the agent can iterate this knowledge, seemingly validating $S$ without independent check. Bootstrapping cases, such as trusting a thermometer's reading to prove the thermometer is accurate, show this derivation yields absurd results: it permits epistemic circularity to generate justification ex nihilo.

  To resolve this trilemma, we must reject exactly one ingredient. While denying Closure (as Dretske does) blocks the deduction, it exacts a prohibitive cost: it severs the link between logic and knowledge, rendering deductive reasoning epistemically inert. Denying Luminosity ($K \to KK$) is also tempting, particularly given Williamson's own arguments against luminosity in *Knowledge and Its Limits*. However, rejecting Luminosity alone does not fully block bootstrapping if the agent still possesses first-order knowledge of $p$ and the entailment. The deduction to knowing $S$ is reliable relies primarily on the transition from $Kp$ to $K(\text{S is reliable})$. Luminosity facilitates iteration, but the core circularity lies in the initial entitlement.

  Therefore, the most defensible move is to reject Ingredient 3: the claim that one can know one's entitlements to trust a source without antecedent warrant for that source's reliability. This is the Conservative response (associated with Crispin Wright). On this view, perceptual knowledge is not "basic" in the liberal sense. To know $p$ via $S$, one must already possess a warrant that $S$ is reliable. This blocks bootstrapping at the first step: the agent cannot claim $Kp$ via $S$ in the bootstrapping scenario because the requisite antecedent warrant for $S$'s reliability is exactly what is missing.

  Defending the remaining two ingredients is crucial. We retain Closure because it preserves the normative force of deduction; if one knows premises and the entailment, one should be in a position to know the conclusion. We retain a qualified Luminosity because for conscious, reflective states, the transparency of knowledge remains a strong intuition that explains our ability to reason about our own epistemic standings. By keeping these, we preserve the structural integrity of reasoning and self-knowledge.

  The cost of this diagnosis, however, is significant. By rejecting Knowledge of Entitlements, we accept a form of skepticism regarding immediate perceptual knowledge. We cannot claim to know the table is red merely by looking; we must first have independent reason to trust our vision. This creates a regress threat: if warrant for $S$ requires warrant for $S'$, how does knowledge begin? The defender owes a reply regarding "hinge commitments" or non-evidential warrants that stop the regress without constituting knowledge. Unlike the Closure-denier, who accepts that we can know premises but not obvious consequences, the Conservative accepts that we cannot claim the premises without prior structural support. This is a heavy price, but it is preferable to the alternative: accepting that logic alone can validate the reliability of our cognitive faculties. The bootstrapping objection is not just an intuition pump; it reveals that without antecedent trust, the closure principle transforms circular reliance into knowledge, which is structurally incoherent. Thus, restricting entitlement is the only way to save Closure and the rationality of deduction from trivialization.

  ***

  **Marking Scheme**

  **Total Marks: 100**

  **A Range (70–100): Diagnostic Precision and Theoretical Cost**
  *   **Reconstruction (20 marks):** Clearly articulates how the three ingredients interact to produce the bootstrapping result. Identifies that the deduction moves from Basic Knowledge + Entailment $\to$ Reliability.
  *   **Diagnosis (30 marks):** Selects **one** ingredient to reject. Crucially, explains *why* this specific rejection blocks the derivation structurally, not just intuitively. (e.g., "Rejecting Entitlement blocks the input to the Closure rule," not just "Bootstrapping feels wrong.")
  *   **Defense of Remaining Two (20 marks):** Provides positive arguments for keeping the other two principles (e.g., defending Closure via the normativity of deduction).
  *   **Cost Analysis (20 marks):** Articulates the specific theoretical price of the rejection (e.g., "Conservatism incurs a regress threat" or "Denying Closure incurs skepticism about deduction").
  *   **Distinction:** An **A** answer shows that the bootstrapping objection is a *reductio* of the conjunction, and the choice of rejection is a strategic trade-off. It avoids treating the principles as a menu where any choice is equally valid without consequence.

  **B Range (50–69): Summary and Intuition**
  *   **Reconstruction (15 marks):** Accurate summary of the three principles and the bootstrapping case.
  *   **Diagnosis (20 marks):** Selects an ingredient to reject but relies heavily on the intuition that "bootstrapping is bad" rather than explaining the structural blockage.
  *   **Defense (10 marks):** Defends remaining principles but lacks depth (e.g., "Closure is standard").
  *   **Cost (15 marks):** Mentions a cost but treats it as a minor inconvenience rather than a significant theoretical commitment (e.g., "We just have to be more careful").
  *   **Distinction:** A **B** answer correctly identifies the debate but fails to demonstrate *why* the chosen rejection solves the logical problem beyond matching the pre-theoretical intuition. It may treat the three ingredients as independent options without analyzing their interdependence in the argument.

  **C Range (40–49): Basic Understanding**
  *   Describes bootstrapping and the three principles but fails to argue for a specific rejection. May attempt to reject two principles or claim all three can be kept with vague caveats. Fails to address the theoretical cost.

  **F Range (0–39): Significant Errors**
  *   Misidentifies the principles (e.g., confuses Luminosity with Infallibility). Claims bootstrapping is a valid form of reasoning. Fails to answer the specific prompt requirements.

  **Specific Penalties:**
  *   **-10 marks:** For rejecting more than one ingredient.
  *   **-10 marks:** For failing to articulate the cost of the rejection (treating the solution as cost-free).
  *   **-5 marks:** For conflating the "Knowledge of Entitlement" with "Knowledge of the Entailment."
