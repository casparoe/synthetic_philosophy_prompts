answer: |-
  Here is the criterion you are asking for. It is designed to be operational, falsifiable, and consistent with eight of your nine verdicts. It requires you to abandon the ambivalence in Case 9 and sharpens the distinction in Case 2 vs. 6 without relying on external sociological judgments about "subordination."

  ### The Criterion: Structural Sovereignty

  An artifact is **political** if and only if it satisfies all three of the following conditions:

  1.  **Public Scope:** The artifact regulates access to a **commons, civic right, or bodily integrity**, rather than a private market good or property right.
  2.  **Structural Differentiation:** The artifact imposes **differential costs or benefits** on identifiable classes of users, rather than a universal constraint applied equally to all.
  3.  **Material Irreversibility:** The rule is embedded in the **physics or logic** of the artifact such that altering the outcome requires physical reconstruction or code modification, making it significantly harder to change than a human decision or policy update (high switching cost).

  **Intent is irrelevant.** (Satisfies your reflex from Case 1 & 2).
  **Upstream decisions are irrelevant** unless the artifact itself encodes the differentiation. (Satisfies Case 2).

  ---

  ### Mapping the Verdicts

  Here is how the three clauses generate your specific verdicts.

  *   **1 & 2 (Overpasses):**
      *   *Public Scope:* Yes (Public beach/road).
      *   *Differentiation:* Yes (Cars pass, buses do not).
      *   *Irreversibility:* Yes (Concrete clearance is hard to change).
      *   *Verdict:* **Political.** (Matches your view. Intent drops out because Clause 2 is met regardless of design motive).
  *   **3 (Speed Bump):**
      *   *Public Scope:* Yes (Public road).
      *   *Differentiation:* **No.** (All vehicles must slow down. It is a universal constraint, not a class-based exclusion).
      *   *Verdict:* **Not Political.** (Matches your view. The politics is in the speed limit law; the bump is merely enforcement of a universal rule).
  *   **4 (Air Conditioning):**
      *   *Public Scope:* **No.** (Private comfort/office environment).
      *   *Verdict:* **Not Political.** (Matches your view. It enables choices; it does not allocate civic rights).
  *   **5 (Facial Recognition):**
      *   *Public Scope:* Yes (Security/Justice system).
      *   *Differentiation:* Yes (Darker skin faces higher error rates/burdens).
      *   *Irreversibility:* Yes (Algorithm is fixed until patched).
      *   *Verdict:* **Political.** (Matches your view. The "subordination" worry is resolved by Clause 1: it regulates a civic right, not a market good).
  *   **6 (Left-Handed Shears):**
      *   *Public Scope:* **No.** (Market good).
      *   *Differentiation:* Yes (Left vs. Right).
      *   *Verdict:* **Not Political.** (Matches your view. **Crucial Fix:** You do not need to judge whether left-handers are "subordinate." You only need to judge that shears are private goods. If the shears were issued by the state for a civic task, they would become political under Clause 1).
  *   **7 (Nuclear Power):**
      *   *Public Scope:* Yes (Energy grid).
      *   *Differentiation:* **No/Disputed.** (Does not inherently differentiate users).
      *   *Verdict:* **Not Political.** (Matches your rejection. The management structure is a policy choice, not a physical constraint of the reactor itself).
  *   **8 (Organ Donation vs. Browser):**
      *   *Organ Donation:* Public Scope (Bodily integrity/Public health) + Differentiation (Donor vs. Non-donor default) + Irreversibility (Friction to opt-out). **Political.**
      *   *Browser:* Public Scope **No** (Commercial software) + Irreversibility **No** (Easy to change settings). **Not Political.**
      *   *Verdict:* **Divergent.** (Matches your view. "Triviality" is replaced by "Public Scope" and "Switching Cost").
  *   **9 (Door Lock):**
      *   *Public Scope:* **No.** (Private property).
      *   *Verdict:* **Not Political.** (Forces a decision on your ambivalence. It executes a property right, it does not allocate a public good).

  ---

  ### The Sacrifices

  To maintain consistency with this criterion, you must abandon the following intuitions:

  1.  **Case 9 Ambivalence:** You must accept that a lock on a private door is **not political**. It is a tool of enforcement for a settled legal right, not an allocator of public access. If the lock were on a *public* building, it would become political under Clause 1.
  2.  **The "Subordination" Heuristic in Case 6:** You must stop asking whether the disadvantaged group is "subordinate." Under this criterion, if the state issued left-handed shears that didn't work to a specific class of citizens for a civic duty, it *would* be political, even if left-handers are not a subordinate group. The politics lies in the **allocation of the public good**, not the pre-existing social status of the group.
  3.  **The "Upstream" Defense in Case 2:** You noted that in Case 2, "nobody decided anything." This criterion confirms that this doesn't matter. If the artifact *structurally* differentiates access to a public good (Clause 2) and is hard to change (Clause 3), it is political, regardless of whether a human signed an order. The *negligence* is the politics.

  ---

  ### Falsification Conditions

  You asked for observations that would count against this criterion. Here are three:

  1.  **The Private Public Square:** If you encounter a **privately owned artifact** (fails Clause 1) that clearly functions as a **political gatekeeper** (e.g., a social media algorithm that determines eligibility for political office), and you judge it **Political**, this criterion fails. It would suggest "Public Scope" must be defined by *function*, not *ownership*.
  2.  **The Universal Exclusion:** If you encounter an artifact that imposes a **universal constraint** (fails Clause 2) on a public good that you judge **Political** (e.g., a turnstile that charges a fee for *everyone* to enter a public park), this criterion fails. It would suggest that *any* monetization of a commons is political, even without differentiation.
  3.  **The Mutable Constraint:** If you encounter an artifact that is **easy to change** (fails Clause 3) but you judge it **Political** (e.g., a software setting that is one click away but determines censorship), this criterion fails. It would suggest that "Material Irreversibility" is not required, only the *delegation of authority*.

