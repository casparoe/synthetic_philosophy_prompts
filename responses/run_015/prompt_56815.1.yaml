  ### Application to Withheld Verdicts

  Here is the criterion applied to your three new cases.

  **1. Stair-Only Apartment (1910 vs. New)**
  *   **Analysis:**
      *   *Public Scope:* Housing is a borderline case, but access to shelter is a basic civic standing. Let's grant Clause 1.
      *   *Differentiation:* Yes (Able-bodied vs. Disabled).
      *   *Irreversibility:*
          *   *1910 Building:* Physically unalterable at reasonable cost. (High).
          *   *New Building:* Built to code that allowed stairs. Physically alterable, but legally constrained. (Medium/High).
  *   **Verdict:** **Both are Political.**
  *   **Reasoning:** The criterion does not distinguish based on *intent* or *time*, but on the *structural exclusion*. Both artifacts regulate access to a necessary resource via physical constraints that differentiate users. The 1910 building is a "legacy political" artifact; the new building is an "active political" artifact. The politics is in the exclusion, not the blame.

  **2. Programming Language (Voluntary Type System)**
  *   **Analysis:**
      *   *Public Scope:* **No.** (Tool for private/Commercial production).
      *   *Differentiation:* **No.** (Applies to all users of the language equally).
      *   *Irreversibility:* Medium (Hard to rewrite code, but voluntary adoption).
  *   **Verdict:** **Not Political.**
  *   **Reasoning:** It fails Clause 1 and Clause 2. It constrains *logic*, not *social access*. It is a normative system for engineers, not a sovereign system for citizens. Even if it disadvantages those who think differently, it is a market/tool constraint, not a political one.

  **3. Voting Machines (Paper vs. Electronic)**
  *   **Analysis:**
      *   *Public Scope:* **Yes.** (The vote is the ultimate civic right).
      *   *Differentiation:*
          *   *Paper:* No differentiation (All ballots counted by public observation).
          *   *Electronic:* **Yes.** (Differentiates between those who can verify the code/vendors and those who cannot).
      *   *Irreversibility:*
          *   *Paper:* Low (Recount is physical).
          *   *Electronic:* **High.** (Software is opaque; trust is baked into the black box).
  *   **Verdict:** **Electronic Machine is Political; Paper Ballot is Not (or less so).**
  *   **Reasoning:** This matches your gut. The paper ballot delegates authority to the **public observer** (reversible, inspectable). The electronic machine delegates authority to the **vendor/code** (irreversible, opaque). The electronic machine satisfies all three clauses: it regulates a civic right, it creates a class of people who must trust the system vs. those who can verify it, and that trust is embedded in the software logic. The politics is not *who wins*, but **who is authorized to verify the truth.**

  ### Summary
  The principle is **Structural Sovereignty**. Politics is not about "effects" or "intent." It is about **who gets to decide.** When an artifact decides who accesses a public good, treats classes of people differently, and cannot be easily argued with, it has become a sovereign. It has become political.
