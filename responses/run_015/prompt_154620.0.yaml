  # JOINT STATEMENT ON EPISTEMIC DOMINANCE AND COMBATANT STATUS
  **Adversarial Collaboration Unit: Just-War Theory & Liability**
  **Date:** 2024-10-26
  **Subject:** The Impact of Systemic Propaganda on the Moral Equality of Combatants

  ## 1. AGREED CLAIMS (SHARED FORMALISM)

  1.  **Definition of Combatant:** A "combatant" is any agent directly participating in hostilities, authorized by a political entity to use lethal force, and distinguishable from the civilian population by function or uniform.
  2.  **Noncombatant Immunity (NCI):** Both parties affirm that civilians who do not directly participate in hostilities retain immunity from intentional targeting, regardless of the justice of the cause they reside within. This immunity is not waived by epistemic conditions.
  3.  **The Symmetry Thesis:** We define the "Symmetry Thesis" as the claim that combatants on opposing sides possess equal *jus in bello* rights (to attack) and equal *jus in bello* liabilities (to be attacked), independent of *jus ad bellum* status.
  4.  **Epistemic Dominance:** We define "Epistemic Dominance" as a structural condition wherein a belligerent state controls information flows such that its combatants cannot access reliable evidence regarding the *jus ad bellum* status of the war, rendering invincible ignorance probable.
  5.  **Liability vs. Culpability:** Both parties distinguish between *liability* (the moral permissibility of harming an agent to avert a threat) and *culpability* (the moral blameworthiness of the agent for posing the threat).
  6.  **Objective vs. Subjective:** We agree that moral assessment requires distinguishing between objective facts (is the cause actually just?) and subjective states (does the soldier believe the cause is just?).
  7.  **Goal of Inquiry:** The purpose of this collaboration is not to vindicate one camp over the other, but to determine whether Epistemic Dominance functions as a *defeater* for liability asymmetry, thereby converging the practical recommendations of Traditionalism and Revisionism.

  ## 2. DISAGREEMENTS TABLE

  | Topic | Traditionalist Formulation (Defense of Symmetry) | Revisionist Formulation (Defense of Asymmetry) |
  | :--- | :--- | :--- |
  | **Source of Liability** | Combatant liability arises from the status of being a dangerous agent in war, regardless of the justice of the cause. | Combatant liability arises from moral responsibility for an unjust threat; unjust combatants are liable, just combatants are not. |
  | **Role of Epistemology** | Epistemic limitations (including propaganda) confirm the necessity of Symmetry; soldiers cannot be expected to adjudicate national policy. | Epistemic limitations mitigate culpability but do not necessarily negate objective liability for posing an unjust threat. |
  | **Effect of Dominance** | Epistemic Dominance preserves the Moral Equality of Combatants (MEC) by ensuring neither side can claim superior moral knowledge. | Epistemic Dominance explains the *illusion* of MEC but does not restore ontological equality; unjust combatants remain liable even if excused. |
  | **Right to Kill** | Both sides possess an equal right to kill enemy combatants, provided *jus in bello* rules are followed. | Only just combatants (or those reasonably believing themselves to be just) possess a right to kill; unjust combatants commit rights violations. |
  | **Post-War Accountability** | Soldiers are generally exempt from prosecution for lawful acts of war, provided no war crimes were committed. | Soldiers may be liable for compensation or restitution for harms caused, even if exempt from criminal punishment due to excuse. |

  ## 3. CRUXES AND TEST CASES

  ### Crux 1: Does Epistemic Dominance Negate Liability?
  **Question:** If a soldier fights for an objectively unjust cause due to state-enforced epistemic closure, are they morally liable to defensive harm in the same way as a soldier who knowingly fights unjustly?

  *   **Shared Test Case: "The Closed Information State"**
      *   *Scenario:* State A invades State B based on fabricated evidence of imminent aggression. State A maintains total information control; all media, education, and military briefings confirm the fabrication. State A soldiers possess no accessible evidence to doubt the cause. State B soldiers are defending against invasion.
      *   *Conditions:* Both sides follow *jus in bello* (no targeting civilians, proportional force). State A soldiers are objectively posing an unjust threat.

  *   **Traditionalist Prediction:**
      *   State A and State B soldiers possess **equal liability**. State B soldiers may kill State A soldiers without moral remainder. State A soldiers retain their right to kill State B soldiers. Epistemic dominance renders the *ad bellum* distinction morally inert at the tactical level.
  *   **Revisionist Prediction:**
      *   State A soldiers are **objectively liable** but **subjectively excused**. State B soldiers may kill State A soldiers (liability holds). However, State A soldiers do *not* possess a right to kill State B soldiers (asymmetry holds), though they may not be culpable for murder. Epistemic dominance mitigates blame, not liability.

  ### Crux 2: The Threshold of "Reasonable Belief"
  **Question:** What epistemic standard must a soldier meet to claim the protection of "just combatant" status? Is "reasonable belief" determined by individual capacity or systemic availability of truth?

  *   **Shared Test Case: "The Leak Scenario"**
      *   *Scenario:* Same as "Closed Information State," but midway through the conflict, credible evidence of the fabrication leaks to State A soldiers via unauthorized channels. The evidence is strong but contradicting official command orders which threaten execution for dissent.
      *   *Conditions:* Soldier S in State A receives the leak. Soldier S continues to fight.

  *   **Traditionalist Prediction:**
      *   Soldier S retains **combatant immunity and equality**. The coercion of military discipline and the fog of war maintain the presumption of ignorance. S is not required to risk execution to verify *ad bellum* claims. S remains a legitimate target but retains the right to fight.
  *   **Revisionist Prediction:**
      *   Soldier S acquires **increased liability**. Once credible evidence is available, the epistemic excuse degrades. S becomes morally responsible for continuing an unjust threat. S loses the right to kill State B soldiers and may be subject to higher degrees of defensive force or post-war accountability than peers who did not receive the leak.

  ### Crux 3: Structural vs. Individual Epistemic Duty
  **Question:** Does the systemic nature of the propaganda shift the burden of epistemic labor from the individual soldier to the command structure?

  *   **Shared Test Case: "The Algorithmic Bubble"**
      *   *Scenario:* State A uses algorithmic information control tailored to individual soldiers, reinforcing bias without overt censorship. No single piece of information is false, but the aggregate picture is distorted. Soldiers feel they are making free inquiries.
      *   *Conditions:* Soldiers believe they are well-informed. Objectively, they are misinformed.

  *   **Traditionalist Prediction:**
      *   This confirms **MEC**. If the distortion is undetectable to the reasonable agent, the soldier is functionally identical to a just combatant. The symmetry of rights and liabilities remains intact because the epistemic defect is structural, not agential.
  *   **Revisionist Prediction:**
      *   This creates **Asymmetric Liability with Symmetric Excuse**. The soldiers are still posing unjust threats (liability remains), but the structural manipulation removes culpability. However, this does not grant them the *right* to kill just combatants. The asymmetry of rights persists despite the symmetry of blamelessness.

  ## 4. NEXT STEPS FOR COLLABORATION

  1.  **Modeling Liability Gradients:** Develop a formal model where liability is not binary (liable/non-liable) but scalar, based on the degree of epistemic access available to the combatant.
  2.  **Policy Implications:** Draft separate policy briefs for military rules of engagement (ROE) based on each camp's predictions for the "Leak Scenario."
  3.  **Empirical Review:** Jointly review historical cases of information control (e.g., WWII propaganda, modern information warfare) to test the plausibility of the "Closed Information State" assumptions.

  ***

  **Signed,**

  *Lead Theorist (Traditional Framework)*
  *Lead Theorist (Revisionist Framework)*
