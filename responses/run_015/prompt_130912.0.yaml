      **BUREAU OF MORAL SURPLUS**
      **EMPLOYEE HANDBOOK & COMPLIANCE GUIDE**
      **VERSION 4.2**

      **1.0 Mission Statement and Ethical Quantification**
      Welcome to the Bureau. At the Bureau of Moral Surplus, we recognize that morality is not a vague aspiration but a deliverable. Our mission is to eliminate the inefficiency of the "supererogatory"—those acts traditionally misclassified as optional kindness. We operate under the principle that if an action produces net good, it is, by definition, required. There is no gap between duty and excellence; there is only compliance and non-compliance. To facilitate this, all staff must adhere to the Surplus Obligation Coefficient (SOC).

      **2.0 The Surplus Obligation Coefficient (SOC)**
      The SOC is the primary metric for employee moral performance. It converts abstract virtue into auditable data points.

      **2.1 Calculation Methodology**
      The SOC is calculated quarterly using the following formula:
      *SOC = (EL + BR) / FO*
      Where **EL** is Emotional Labor (measured in Empathy Hours), **BR** is Bodily Risk (measured in Hazard Units), and **FO** is Foregone Opportunity (measured in Personal Happiness Points).

      **2.2 Performance Thresholds**
      All employees must maintain a positive SOC greater than 1.0. An SOC below 1.0 indicates a failure to exceed baseline duty. Note that baseline duty is dynamically adjusted upward based on team averages. Therefore, maintaining compliance requires continuous escalation of personal sacrifice.

      **2.3 Verification**
      Employees must submit receipts for all sacrifices. Emotional labor must be logged via the internal tears-tracking portal. Bodily risk requires pre-approval from Risk Management unless the emergency is immediate and photogenic.

      **3.0 Mandatory Supererogation Protocol**
      It is the policy of the Bureau that going "above and beyond" is a standard job requirement.

      **3.1 The Elimination of Optionality**
      Staff are reminded that refusing to donate a kidney to a colleague, while technically legal, constitutes a performance deficiency. The distinction between "heroism" and "Tuesday" has been deprecated to streamline operational ethics.

      **3.2 Disciplinary Action**
      Failure to meet SOC targets will result in progressive disciplinary action.
      *   **First Offense:** Written warning and mandatory empathy retraining.
      *   **Second Offense:** Reduction of personal leisure time.
      *   **Third Offense:** Termination of employment and public shaming via press release.

      **4.0 The Saint Cap (Wellness Initiative)**
      To prevent moral burnout and ensure staff remain relatable to clients, the Bureau enforces the Saint Cap.

      **4.1 Upper Limits on Virtue**
      No employee may exceed an SOC of 5.0. While moral excellence is mandated, excessive excellence is discouraged as it creates awkwardness in breakrooms and implies judgment upon peers. A life of relentless moral perfection is considered personally unattractive and disruptive to team cohesion.

      **4.2 Humanization Clause**
      Employees hitting the Saint Cap must engage in mandatory minor vices (e.g., skipping a workout, eating a donut) to restore human equilibrium. We want heroes, not monsters.

      **5.0 Evaluative Asymmetry Matrix**
      The Bureau acknowledges the complexity of praise and blame.

      **5.1 Praise Allocation**
      Employees exceeding the SOC threshold will receive verbal praise. This praise is non-monetary and cannot be exchanged for raises.

      **5.2 Blame Allocation**
      Employees failing to meet the SOC threshold will receive formal blame. Unlike praise, blame is recorded on permanent transcripts. We recognize this asymmetry may seem unfair; however, it is necessary to maintain the illusion of voluntary goodness while enforcing mandatory outcomes.

      **6.0 Acknowledgment**
      By signing below, you acknowledge that your life is no longer your own, but rather a vessel for optimized moral output. You agree that transparency is more important than privacy, and that your sacrifice is the Bureau's profit.

