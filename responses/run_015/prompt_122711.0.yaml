answer: |-
  This is a sharp request. You have identified the friction point where Grice's abstract machinery meets the gritty reality of institutional speech acts. Grice designed his apparatus for ordinary conversation, where the primary governing force is the Cooperative Principle (CP). In institutional settings, the CP is often subordinated to, or overwritten by, an **Institutional Protocol**.

  Here is a constructed case, followed by an analysis of which Gricean requirement must yield and why this does not collapse the distinction between implicature and convention.

  ### The Case: The Tenure File "Cipher"

  **Context:** A Research-Intensive University.
  **Practice:** External Review Letters for Tenure.
  **The Norm:** In this specific discipline (e.g., Theoretical Physics), research output is the *only* criterion that matters for tenure. Teaching and service are necessary but insufficient. There is an unwritten but strictly enforced norm among senior reviewers: *If the candidate's research is tenure-worthy, you must explicitly praise the research in the first paragraph. If you discuss teaching or service in the first paragraph without mentioning research, it signals that the research is inadequate.* This norm exists to protect reviewers from legal retaliation while allowing the committee to make hard decisions.

  **The Utterance:**
  Dr. A (the reviewer) writes in the opening of the letter:
  > "Candidate B is a diligent teacher and a supportive colleague."

  **The Implicature:**
  "Candidate B's research is not tenure-worthy." (i.e., "Vote No.")

  **The Gricean Tests:**

  1.  **Calculability:** Can a hearer work this out from the words + CP?
      *   *Standard Grice:* Yes. Maxim of Relation/Quantity. If research were good, why talk about teaching?
      *   *The Problem:* An outsider (or a naive junior faculty member) will *fail* to calculate this. They might read "diligent teacher" as a positive endorsement. The calculation requires access to the **local cipher**, not just general conversational maxims. The derivation depends on a specific institutional rule, not the universal presumption of cooperation.

  2.  **Intentionality:** Does Dr. A intend the committee to recognize this intention?
      *   *Standard Grice:* Yes. Dr. A knows the code and uses it.
      *   *The Problem:* Suppose Dr. A is new to this university's specific culture. She writes "diligent teacher" genuinely meaning it as a compliment, unaware of the "research-first" norm. The Tenure Committee *still* treats the letter as a negative verdict. They hold Dr. A answerable for the *normative uptake* of her words, regardless of her private psychological intention. The meaning is assigned by the institution's rules of interpretation, not solely by the speaker's mind.

  3.  **Cancellability:** Can Dr. A cancel the implicature without contradiction?
      *   *Standard Grice:* She should be able to add, "...and his research is also excellent."
      *   *The Failure:* If Dr. A writes, "Candidate B is a diligent teacher... [and] his research is also excellent," the Committee will view the letter as **incoherent** or **suspicious**. According to the institutional norm, a truly excellent research candidate *must* be led with. By burying the research praise or coupling it with the teaching praise, the structural norm overrides the explicit cancellation. The Committee is authorized to ignore the cancellation because the *form* of the report violates the protocol for a positive verdict. Dr. A is answerable for what a competent reader *must* take from the text, not what she explicitly disclaims.

  ### The Tension: Which Requirement Gives?

  The requirement that must yield is **Cancellability**, but specifically because it reveals a deeper fracture in the **Intentionality** condition.

  In standard Gricean theory, cancellability works because meaning is ultimately grounded in the speaker's recoverable intention. If I say "I didn't mean P," and I am believed, the implicature vanishes. In the Tenure Case, the speaker *cannot* rid herself of the meaning because she is speaking as an **agent of the institution**, not merely as a conversational partner.

  **My Position:**
  We must concede that in institutional practices, **speaker meaning is not solely determined by psychological intention, but by normative commitment.**

  When Dr. A writes the letter, she enters a system where the *uptake* is regulated by institutional rules that she does not fully control. She is committed to the implications that a *competent member of the practice* is entitled to draw, even if she explicitly disclaims them. Therefore, the implicature is **non-cancellable** because the institution does not recognize the cancellation as valid within the rules of the game.

  ### Why This Does Not Collapse into Convention or "What is Said"

  You asked why conceding this doesn't simply turn the implicature into a conventional meaning (like the word "but") or into the literal content ("what is said").

  **1. It is not Linguistic Convention.**
  Conventional implicature (in Grice's sense) is tied to specific lexical items (e.g., "therefore," "but"). If I say "He is poor but honest," the contrast is conventional. In the Tenure Case, the negative verdict is not tied to the word "teacher." If the context changed (e.g., a Teaching College), the same sentence would implicate a positive verdict. The meaning is stable only relative to the *institutional framework*, not the language itself. It is a **Pragmatic Convention**, not a Semantic one.

  **2. It is not "What is Said."**
  "What is said" is determined by truth-conditional content. The proposition "B is a diligent teacher" can be true even if B's research is excellent. The negative verdict ("B should be denied tenure") is not entailed by the truth conditions of the sentence. It is an *inference* licensed by the context. If it were "what is said," the letter would be literally false if B's research *were* good. But the letter remains literally true; it is just *misleading* according to the protocol.

  **3. The Crucial Distinction: Accountability vs. Intention.**
  The collapse is avoided by distinguishing between **Speaker Meaning** (Grice's psychological focus) and **Utterance Accountability** (the institutional focus).
  *   **Grice:** Meaning = Intention to produce belief by recognition of intention.
  *   **Institutional Case:** Meaning = Commitment to the inferences licensed by the practice.

  By allowing non-cancellable implicatures in institutional settings, we are not saying the meaning is in the words (convention) or that it is the literal content (said). We are saying that **the locus of meaning shifts from the speaker's mind to the social contract of the practice.**

  ### The Cost to the Account

  If we accept this, we cost Grice his universalism. Grice wanted the CP and Maxims to be foundational to *all* rational communication. This case shows that **local norms can override the CP.**

  In the Tenure Letter, the Maxim of Quantity ("Make your contribution as informative as required") is violated intentionally. The reviewer is *required* by the institution to be less informative than required (to avoid liability). The "Cooperative Principle" is suspended in favor of an **Institutional Preservation Principle**.

  **Conclusion for the Biologist:**
  Think of this like a signaling pathway in a cell. In a standard pathway (conversation), the ligand (words) binds to the receptor (hearer) based on affinity (maxims). In the institutional case, the pathway is gated by a regulatory protein (the institutional norm). Even if the ligand binds, the signal is transduced differently because the cellular context dictates the output. The "signal" (implicature) is not determined by the ligand alone, nor by the sender's "intent," but by the regulatory state of the system.

  Grice's apparatus assumes a "wild type" organism (ordinary conversation). You have found a "knock-out" or "transgenic" case (institutional speech) where the regulatory machinery forces a phenotype (meaning) that the genotype (intention/words) would not otherwise produce. The test that fails is **cancellability**, because the regulatory machinery ignores the sender's attempt to suppress the signal. This does not mean the signal is genetic (conventional); it means the environment (institution) determines the expression.
