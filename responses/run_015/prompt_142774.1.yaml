  **SUBSTRATE SOLUTIONS INC.**
  **Position:** Lead Anti-Crane Analyst
  **Location:** Remote (Bedrock Level Only)
  **Department:** Ontological Streamlining & Parsimony

  **Company Overview**
  Substrate Solutions Inc. is the premier consultancy for clients seeking to eliminate explanatory bloat. We operate on a simple principle: if it isn't written in the language of fundamental physics, it is merely a heuristic waiting to be litigated. While competitors waste billable hours constructing intermediate models involving "psychology," "biology," or "sociology," we deliver the only truth that matters: the bottom layer. We do not build up; we strip down.

  **Position Summary**
  We are seeking a Lead Anti-Crane Analyst to oversee the dissolution of intermediate explanatory layers across evolutionary biology, cognitive science, and institutional design. The successful candidate will view meso-level phenomena not as useful scaffolding, but as legal liabilities. You will be responsible for ensuring that no client explanation retains any structural integrity above the substrate. If a phenomenon can be explained by quantum field theory, explaining it via natural selection is considered gross negligence.

  **Key Responsibilities**
  *   **Evolutionary Reclassification:** Audit all client phylogenies to reclassify instances of exaptation as mislabeled genetic drift. Adaptationist stories are to be flagged as narrative fraud.
  *   **Ecological Rebranding:** Develop white papers demonstrating that ecology is simply chemistry with better public relations. Emphasize that "ecosystems" are merely slow-moving precipitation reactions.
  *   **Urban Deconstruction:** Produce case studies proving that urban planning is just particle physics in a trenchcoat. Zoning laws should be reduced to electromagnetic boundary conditions.
  *   **Cognitive Elimination:** Ensure all references to "belief," "desire," or "intent" are replaced with "neural firing patterns" or "glitch artifacts."
  *   **Liability Management:** Treat middle-level science as a regulatory risk. Any explanation requiring more than two levels of abstraction must be submitted to Legal for potential skyhook smuggling.

  **Qualifications**
  *   Ph.D. in Hard Sciences or Philosophy of Mind (Continental traditions will be discarded upon receipt).
  *   Demonstrated aversion to metaphorical scaffolding.
  *   Ability to maintain eye contact while explaining that love is a calcium signaling error.
  *   Experience with regulatory compliance regarding emergent properties.

  **Benefits & Compensation**
  *   **Competitive Salary:** Paid in fundamental units of energy.
  *   **No-Skyhook Warranty:** All analyses come guaranteed free of top-down magic. If a client detects a mysterious force descending from above to save the explanation, we will send a team to retract it within 24 hours.
  *   **Emergence Refund Clause:** Should a client accidentally encounter a genuine emergent property that cannot be reduced without residual confusion, Substrate Solutions offers a full refund plus legal indemnity.
  *   **Ontological Indemnity:** We cover all legal fees arising from clients suing reality for being too complex.
  *   **Health Care:** Comprehensive coverage for existential dread and reductionist fatigue.

  **Application Process**
  Submit your CV and a 500-word reduction of your own consciousness to electrochemical noise. Do not include a cover letter; cover letters imply a level of agency we do not recognize.

  *Substrate Solutions Inc. is an equal opportunity employer. We do not discriminate based on race, gender, or species, as these categories are merely convenient fictions masking underlying genetic variance.*

  **Note to Applicants:** Please be advised that referencing "cranes" as useful explanatory tools will result in immediate disqualification. We build nothing. We only dig.
