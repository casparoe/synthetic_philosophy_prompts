answer: |-
  This is an exceptionally sharp analysis of the institutional mechanics of conscientious objection (CO). You have correctly identified that the legal architecture of CO is not built on the moral truth of pacifism, but on a specific theory of the relationship between the citizen, the state, and the moral self.

  Your hypothesis—that the practice treats refusal as an **integrity-like commitment** rather than a **truth-tracking judgment**—is precisely the standard explanation in legal philosophy and political theory. However, the implications of that view run deeper than you suggest. Below, I address your questions in order, unpacking the specific view of pacifism required to make this institution function, its coherence, and the counterfactuals you proposed.

  ### 1. What view of pacifism and conscientious refusal does the practice make sense under?

  The institution only makes sense under a **Liberal-Pluralist Conception of Conscience as Identity.**

  Under this view, the state does not recognize the *validity* of the pacifist's claim about the world (i.e., that war is wrong); it recognizes the *severity of the burden* placed on the pacifist's moral integrity. This distinguishes **Conscience as Judgment** from **Conscience as Constraint**.

  *   **Conscience as Judgment:** "I have assessed the facts and determined this war is unjust." (This is a claim to truth/knowledge).
  *   **Conscience as Constraint:** "I am constituted in such a way that I cannot perform this act without violating my core self." (This is a claim about identity/psychology).

  The state accommodates the latter but rejects the former. If the state accommodated the former, it would have to admit that the citizen might know better than the government whether a war is just. By requiring the objection to be to "war as such" (as in *Gillette*), the state ensures the objection is rooted in the *agent's identity* (I am a person who does not kill) rather than the *state's policy* (This war is bad).

  **Why the "Autonomy Test" fails:**
  Your test case (willing to fight, objects to conscription/coercion) fails because the liberal state premises citizenship on a duty of defense. Objection to *killing* is treated as a specific moral disability (like a handicap); objection to *coercion* is treated as political insubordination. The state claims a monopoly on legitimate violence; it grants a dispensation for the *violence* (because it conflicts with religious/moral identity), but it cannot grant a dispensation for the *authority* (because that dissolves the state).

  ### 2. Which features presuppose that view, and which merely fit well?

  **Features that strictly presuppose the "Identity/Integrity" view:**
  *   **The Sincerity Board:** If the objection were about the *truth* of the war's injustice, the board would investigate the war's facts. Since they investigate the *depth* and *source* of the belief (religious training, moral history), they are investigating the *person*, not the *proposition*. This presupposes the exemption is a protection of the self, not a correction of policy.
  *   **Universal vs. Selective:** This distinction strictly presupposes that the state retains the sole prerogative to judge *jus ad bellum* (the justice of going to war). If the exemption were based on moral truth, a selective objector in an unjust war would be *more* morally correct than a universal pacifist in a just war. The fact that the selective objector gets nothing proves the system is not tracking moral truth.

  **Features that merely "fit well" (but are not strictly required):**
  *   **Alternative Civilian Service (ACS):** This does not strictly presuppose an act-centered morality. It presupposes a **theory of equal sacrifice**. The state's logic is: "We acknowledge you cannot kill, but you still owe the community the time and risk you would have spent in uniform."
      *   *Could a complicity-based pacifist accept it?* Philosophically, yes, as a "lesser evil" compromise to avoid prison. However, the *state's imposition* of it reveals that the state does not accept the complicity argument. The state operates on a **Direct/Indirect Distinction**: Direct killing is forbidden; indirect support (taxes, hospital work that frees a soldier) is considered general citizenship duty. The institution fits a complicity-based view only if that view is watered down to "I won't pull the trigger," but the state *requires* that watered-down version, not the absolute one.

  ### 3. Is the package internally coherent?

  **Legally/Politically: Yes.**
  **Morally/Philosophically: No.**

  The package is legally coherent because it serves a specific function: it acts as a **safety valve** without undermining **sovereign authority**.
  *   By reviewing the *content* of the belief (is it religious/deep?), the state ensures the claimant isn't just a draft dodger.
  *   By refusing to assess the *justice* of the war, the state prevents the judiciary from second-guessing the executive/legislature on foreign policy.

  However, it creates the moral paradox you identified: **The Privilege of the Absolutist.**
  The system implies that a person who refuses to kill in *any* circumstance (even a defensive war against genocide) is more deserving of accommodation than a person who refuses to kill only in *unjust* circumstances. This is incoherent if the goal is to prevent injustice. It is only coherent if the goal is to manage dissent without challenging the state's monopoly on judging war.

  The coherence relies on the fiction that "war as such" is a coherent category. Most modern soldiers are not pacifists; they are "just warriors." By forcing the objector to claim they oppose *all* war, the state forces them into a theological/moral box that separates them from the political debate. It isolates the pacifist as a "special case" rather than a political critic.

  ### 4. Is the institution better explained by non-moral factors?

  Yes. While the *language* used is moral (conscience, sincerity, belief), the *structure* is explained by **State Capacity and Legitimacy.**

  *   **Administrative Convenience:** It is easier to verify "Have you been a Quaker for 5 years?" than "Is this war unjust?" The former is a biographical check; the latter requires intelligence, geopolitical analysis, and moral adjudication.
  *   **Preserving War-Making Capacity:** If selective objection were allowed, a controversial war could trigger mass CO claims, effectively vetoing the war through draft resistance. By limiting CO to universal pacifists (a small, stable demographic), the state ensures that the bulk of the army remains available for *any* war, just or unjust.
  *   **Cheap Purchase of Legitimacy:** Granting CO allows the state to claim it respects human rights and freedom of conscience. Punishing the "absolutists" (who refuse ACS) reinforces the boundary: "We respect your conscience up to the point where it threatens the functioning of the state."

  The institution is a **boundary management tool**. It defines the limit of individual conscience vis-à-vis state power.

  ### 5. What would have to change if the underlying view were replaced?

  This is the most revealing part of your inquiry. If we change the philosophical premise, the institution collapses or transforms radically.

  **A. If replaced by Complicity-Based Pacifism:**
  *   **The Change:** If the state accepted that "freeing another to kill" is morally equivalent to killing, Alternative Civilian Service would have to be abolished for objectors.
  *   **The Consequence:** Objectors would require total exemption from service *and* potentially tax exemptions for the military portion of the budget. The "equal sacrifice" model would vanish. The state would have to absorb the full cost of the objector's non-participation without recompense. This is administratively difficult and politically unpopular, which is why no state does it.

  **B. If replaced by a Just-War View (Recognizing Selective Objection):**
  *   **The Change:** The CO board would need to be replaced by a judicial tribunal capable of assessing the *jus ad bellum* of specific conflicts.
  *   **The Consequence:** This shifts power from the Executive to the Judiciary. It effectively grants citizens a veto over specific wars. If 30% of draftees claim the war is unjust and are vindicated, the war effort stalls. This view transforms CO from a *personal exemption* into a *political check*. It turns the soldier into a moral agent responsible for the war's justice, undermining the "superior orders" defense and the state's monopoly on violence.

  **C. If replaced by the view that Pacifists May Simply Be Right:**
  *   **The Change:** If the state acted as though the pacifist's truth-claim had validity, it could not conscript anyone.
  *   **The Consequence:** Conscription itself would become illegitimate. If killing in war is objectively wrong (as the pacifist claims), then the state cannot force non-pacifists to do it either, nor can it claim the pacifist is merely "exempt." The pacifist would be the norm, and the soldier the exception. The institution of CO would disappear because the institution of Conscription would disappear.

  ### Summary

  Your intuition is correct. The institution of Conscientious Objection is not a concession that war might be wrong. It is a **mechanism of containment**.

  It treats pacifism not as a **political critique** (which would threaten the state's authority to wage war) but as a **personal disability** (which the state can charitably accommodate). It demands that the objector frame their refusal as a limitation of their own identity ("I cannot kill") rather than a judgment on the state's action ("You should not kill").

  The requirement for Alternative Service confirms this: it is a demand that the objector continue to serve the *community* even while refusing the *state's violence*. It maintains the citizen's duty of sacrifice while carving out a narrow exception for the act of killing. The "absolutist" who refuses this is punished not because their logic is unsound (their complicity argument is often philosophically stronger), but because their refusal rejects the **duty of sacrifice** itself, which is the bedrock of the state's claim on the citizen.

  The system is coherent only if you assume the State's right to wage war is unquestionable. If you assume the State's right to wage war is contingent on justice, the entire architecture of Conscientious Objection collapses.
