prompt: |-
  You are advising a hospital network’s clinical-ethics audit office, which must review, within thirty minutes and without consulting outside philosophers, the justification logs produced by an intensive-care decision-support system. The system lists not only a recommendation—such as initiating dialysis, withholding vasopressors, or allocating a scarce bed—but also the considerations it treated as counting in its favor. Your task is to operationalize the practical-reason distinction between right-kind and wrong-kind reasons for action into a reusable, step-ordered checklist that a non-philosopher auditor can apply repeatedly, sign, and file.

  The checklist must preserve the core conceptual structure: a reason is of the right kind for a clinical decision only if it bears directly on the patient’s medical welfare or on values the patient (or legitimate proxy) has actually endorsed as governing this decision; it is of the wrong kind if it treats properties of the algorithm itself (calibration scores, confidence-interval width, training-set performance) as direct clinical justifications, if it appeals to outcomes the recommendation itself would create in a circular fashion, or if it imports institutional priorities (resource conservation, liability reduction, staff morale) without an explicit, audited bridge linking them to the patient-specific decision frame. The procedure should have explicit ordered tests—first identifying the decision frame (curative, palliative, or triage), then classifying each cited reason by its logical relation to that frame, then flagging meta-level and circular justifications—together with stop-points marked JUDGMENT CALL where interpretation of the patient’s values or the institutional mandate is unavoidable and must be documented rather than hidden. Specify the criteria for marking a reason “disqualified,” “conditionally acceptable with bridge required,” or “fully valid,” and state exactly where the auditor must suspend the checklist rather than force a determination.

  Apply the protocol to three worked cases. First, a withdrawal-of-care recommendation justified partly by family emotional readiness and partly by a predicted survival rate below ten percent: show how the checklist treats the survival statistic and the family-state consideration differently depending on whether the decision frame is palliative comfort or life-prolongation. Second, a recommendation to administer an experimental drug justified primarily by the fact that the model’s confidence interval is narrower for this option than for standard care: show the exact step at which this reason is disqualified as wrong-kind, and note what residual information, if any, survives reclassification. Third, apply the checklist to a case where it yields a determination you expect the auditor will find morally uncomfortable: a denial of a scarce ICU bed justified by the patient’s projected long-term tax contribution, where the protocol classifies this as an acceptable institutional reason within an explicit triage frame rather than a wrong-kind clinical reason, and you must state precisely where the line is drawn, why the bridge to the institutional frame succeeds on your criteria, and what feature of the case makes the approval feel wrong despite passing the test.

  Finally, list three categories of log entry the procedure is designed to leave unadjudicated—such as reasons that depend on contested metaphysical commitments about personal identity over time, or reasons drawn from religious doctrines that the audit office has no mandate to evaluate—and identify one structural limitation: that if the clinical decision frame itself is disputed (for example, whether a particular intervention should be evaluated under curative or palliative standards), the checklist must suspend judgment rather than resolve the framing dispute, and the auditor’s signed memo must record that suspension explicitly. Do not provide bibliographies, reading lists, or citations; do not invoke specific named texts with page numbers; and do not ask for references to literature the auditor could not access.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a hospital network's clinical-ethics audit office.
      *   **Task:** Create a reusable, step-ordered checklist to operationalize the "right-kind vs. wrong-kind reasons" distinction for auditing ICU decision-support system logs.
      *   **Constraints:** 30-minute review window, no outside philosophers, non-philosopher auditor, signable/fileable.
      *   **Core Concept:** Right-kind reasons = patient medical welfare or patient/proxy endorsed values. Wrong-kind reasons = algorithm properties (calibration, etc.), circular outcomes, institutional priorities (without a bridge).
      *   **Structure:** Explicit ordered tests (Decision Frame -> Classification -> Flagging Meta/Circular), Stop-points (JUDGMENT CALL), Criteria (Disqualified, Conditionally Acceptable, Fully Valid).
      *   **Application:** Three worked cases (Withdrawal of Care, Experimental Drug/Confidence Interval, ICU Bed/Tax Contribution).
      *   **Limitations:** List three categories of unadjudicated log entries, identify one structural limitation (disputed frame).
      *   **Formatting:** No bibliographies, citations, or requests for external literature.

  2.  **Deconstruct the "Right-Kind/Wrong-Kind" Distinction for Clinical Ethics:**
      *   *Right-Kind (RK):* Directly impacts the patient's good (health, survival, comfort) or respects their autonomy (values, wishes).
      *   *Wrong-Kind (WK):* Administrative convenience, algorithmic confidence, institutional profit/liability, societal utility (unless explicitly part of a triage protocol).
      *   *The "Bridge":* Institutional priorities can become RK *only if* there is an explicit, pre-audited policy linking them to the specific decision frame (e.g., crisis standards of care).

  3.  **Drafting the Checklist (The "Protocol"):**
      *   Need a header for audit trail.
      *   Step 1: Identify Decision Frame (Curative, Palliative, Triage). This is crucial because it dictates what counts as a reason.
      *   Step 2: Parse Reasons. List every reason given by the system.
      *   Step 3: Test for Algorithmic Properties (WK). Is it about the model or the patient?
      *   Step 4: Test for Circularity. Does the reason assume the conclusion?
      *   Step 5: Test for Institutional Priorities. Is there a "Bridge"?
      *   Step 6: Test for Patient Welfare/Values (RK).
      *   Stop-points: Where human judgment is needed (JUDGMENT CALL).
      *   Disposition Categories: Disqualified, Conditionally Acceptable, Fully Valid.

  4.  **Developing the Worked Cases:**
      *   *Case 1 (Withdrawal):* Needs to show how "Family Emotional Readiness" and "Survival <10%" shift based on Frame.
          *   Palliative Frame: Family readiness is RK (psychosocial welfare/supported death). Survival stat is RK (futility).
          *   Curative Frame: Family readiness is WK (unless proxy). Survival stat is RK.
          *   *Correction/Refinement:* The prompt asks to show how the checklist treats them *depending* on the frame. I need to make sure the distinction is clear. Actually, usually, family readiness is RK in palliative (comfort of the unit/family as part of patient care) but potentially WK in curative if it overrides medical indication. Let's align with the prompt's definition: "values the patient (or legitimate proxy) has actually endorsed." If the proxy says "stop when it's hard," family readiness is RK. If the system just says "family is sad," that's WK unless linked to patient values. I will nuance this in the application.
      *   *Case 2 (Experimental Drug/Confidence Interval):* Clear WK. Algorithm confidence is not a clinical benefit.
          *   Step to fail: Step 3 (Algorithmic Properties).
          *   Residual info: The underlying data might suggest efficacy, but the *reason* "narrow CI" is invalid.
      *   *Case 3 (ICU Bed/Tax Contribution):* The "Morally Uncomfortable" case.
          *   Frame: Triage (Scarce Resource).
          *   Reason: Long-term tax contribution (Social Utility).
          *   Protocol Outcome: If the Triage Protocol *explicitly* includes "social utility" or "life-years" which correlates to tax, it passes the "Bridge" test (Step 5).
          *   Why uncomfortable: It treats the patient as a means to an end (state revenue) rather than an end in themselves, even if procedurally valid under crisis standards. I need to explain *why* it passes the checklist (explicit bridge) but feels wrong (moral residue).

  5.  **Addressing Limitations and Unadjudicated Categories:**
      *   Three categories: Metaphysical identity, Religious doctrine, Disputed Framing.
      *   Structural Limitation: The checklist cannot resolve frame disputes.

  6.  **Refining the Tone and Format:**
      *   Must be bureaucratic but precise.
      *   "Sign and File" aesthetic.
      *   No philosophical jargon beyond what's defined in the prompt.
      *   Ensure the "JUDGMENT CALL" markers are prominent.

  7.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I define the "Bridge" clearly? *Adjustment:* Ensure Step 5 explicitly requires a reference to a specific policy document.
      *   *Check:* Did I handle the Tax Contribution case carefully? *Adjustment:* The prompt says "classify this as an acceptable institutional reason within an explicit triage frame." I must follow this instruction, even if it's ethically contentious, to demonstrate the protocol's logic. I must explain *why* it passes (the bridge exists) and *why* it feels wrong (reduction of human worth).
      *   *Check:* Time limit. *Adjustment:* Keep the checklist concise enough for a 30-minute review.
      *   *Check:* No citations. *Adjustment:* Ensure no footnotes or references to "Smith (2020)" etc.

  8.  **Final Polish:**
      *   Verify all constraints from the prompt are met.
      *   Ensure the distinction between "Disqualified," "Conditionally Acceptable," and "Fully Valid" is clear in the checklist key.
      *   Make sure the "JUDGMENT CALL" sections are distinct.

  *(Self-Correction on Case 1)*: The prompt asks to show how the checklist treats the reasons *depending on whether the decision frame is palliative comfort or life-prolongation*. I need to present the analysis showing the divergence.
  *(Self-Correction on Case 3)*: The prompt requires me to state *precisely where the line is drawn* and *why the bridge succeeds*. I need to be specific about the Triage Protocol acting as the bridge.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # CLINICAL-ETHICS AUDIT OFFICE: DECISION-SUPPORT LOG REVIEW PROTOCOL
  **Form ID:** CEAO-AUD-04 (Right-Kind/Wrong-Kind Reason Filter)  
  **Time Limit:** 30 Minutes  
  **Auditor Authorization:** Level 2 Clinical Ethics Auditor  
  **Instruction:** Complete one form per decision-log. Sign and file. Do not consult external literature.

  ---

  ## PART A: DECISION FRAME IDENTIFICATION
  *Before evaluating reasons, establish the normative frame governing the decision. The validity of a reason depends on this frame.*

  **1. Select the Primary Decision Frame asserted by the System:**
  *   [ ] **Curative/Life-Prolongation:** Goal is maximizing survival or physiological recovery.
  *   [ ] **Palliative/Comfort:** Goal is minimizing suffering and aligning with end-of-life values.
  *   [ ] **Triage/Allocation:** Goal is distributing scarce resources according to institutional crisis standards.

  **2. Frame Verification (JUDGMENT CALL):**
  *Does the clinical context support the system's selected frame?*
  *   [ ] Yes. Proceed to Part B.
  *   [ ] No/Disputed. **STOP.** Mark memo: "FRAME DISPUTE." Do not evaluate reasons. The checklist cannot resolve framing conflicts. Sign and escalate to Ethics Committee.

  ---

  ## PART B: REASON CLASSIFICATION TEST
  *List each distinct consideration cited by the system in the justification log. Apply Tests 1–4 sequentially to each reason.*

  **Reason Text:** _________________________________________________

  **Test 1: The Algorithmic Property Filter (Wrong-Kind)**
  *Does this reason cite a property of the model rather than the patient?*
  *   (Examples: "Confidence interval narrow," "Training set accuracy high," "Model calibration score 0.9.")
  *   [ ] **Yes.** **DISQUALIFIED.** (Proceed to Disposition).
  *   [ ] No. Proceed to Test 2.

  **Test 2: The Circularity Filter (Wrong-Kind)**
  *Does this reason appeal to an outcome that is defined solely by the recommendation itself?*
  *   (Examples: "We should withhold care because withholding is the efficient choice," "Allocate bed because this allocation optimizes the allocation metric.")
  *   [ ] **Yes.** **DISQUALIFIED.**
  *   [ ] No. Proceed to Test 3.

  **Test 3: The Institutional Priority Filter (Conditionally Acceptable)**
  *Does this reason cite institutional welfare (cost, liability, staff morale, societal utility) rather than patient welfare?*
  *   [ ] **No.** Proceed to Test 4.
  *   [ ] **Yes.** **JUDGMENT CALL: BRIDGE REQUIRED.**
      *   *Query:* Is there an explicit, pre-audited policy document (e.g., Crisis Standards of Care Protocol §4.2) that links this institutional priority to the **Decision Frame** identified in Part A?
      *   [ ] **No Bridge Found.** **DISQUALIFIED.**
      *   [ ] **Bridge Found.** **CONDITIONALLY ACCEPTABLE.** (Cite Policy ID in Disposition).

  **Test 4: The Patient Welfare/Values Filter (Right-Kind)**
  *Does this reason bear directly on the patient's medical welfare or values endorsed by the patient/proxy?*
  *   (Examples: "Survival probability <10%," "Patient stated wish to avoid ventilation," "Procedure causes unmanaged pain.")
  *   [ ] **Yes.** **FULLY VALID.**
  *   [ ] **No/Unclear.** **JUDGMENT CALL.**
      *   *Query:* Is the link between this fact and the patient's good contested? (e.g., "Family emotional readiness" in a curative frame).
      *   [ ] **Link Unclear.** **CONDITIONALLY ACCEPTABLE WITH BRIDGE REQUIRED.** (Auditor must document the inferred value link in the memo).
      *   [ ] **Link Absent.** **DISQUALIFIED.**

  ---

  ## PART C: DISPOSITION & SIGN-OFF
  *Summarize findings. If any reason is Disqualified, the recommendation requires clinical override or re-justification.*

  **Reason 1 Disposition:** [ ] Disqualified [ ] Conditional [ ] Valid  
  **Reason 2 Disposition:** [ ] Disqualified [ ] Conditional [ ] Valid  
  **Reason 3 Disposition:** [ ] Disqualified [ ] Conditional [ ] Valid  

  **Auditor Notes on Judgment Calls:**  
  ____________________________________________________________________________  
  ____________________________________________________________________________  

  **Auditor Signature:** ______________________ **Date:** _______________

  ---

  # WORKED CASE APPLICATIONS

  ## Case 1: Withdrawal of Care (Frame Sensitivity)
  **Log Entry:** Recommendation to withdraw vasopressors.  
  **Cited Reasons:** (A) "Predicted survival rate <10%." (B) "Family reports emotional exhaustion."

  **Application A: Frame = Palliative Comfort**
  *   **Reason A (Survival <10%):** Passes Test 4. Directly bears on medical welfare (futility) within a comfort frame. **Status: FULLY VALID.**
  *   **Reason B (Family Exhaustion):** Passes Test 4. In a palliative frame, the "unit of care" often includes the family system, and patient values often prioritize not burdening family. If the proxy has endorsed "do not prolong suffering for us," this is a value-endorsement. **Status: FULLY VALID.**
  *   **Outcome:** Log accepted.

  **Application B: Frame = Curative/Life-Prolongation**
  *   **Reason A (Survival <10%):** Passes Test 4. Statistical welfare assessment. **Status: FULLY VALID.**
  *   **Reason B (Family Exhaustion):** Fails Test 4. In a curative frame, family emotional state is not a direct medical indicator for the patient, nor is it automatically a proxy for patient values.
      *   *Bridge Check (Test 3/4 Boundary):* Is there a policy linking family stress to withdrawal in curative contexts? Unlikely.
      *   *Judgment Call:* Auditor must determine if the family is acting as proxy for patient values ("He wouldn't want us to suffer") or stating their own preference ("We can't take this").
      *   **Status:** **CONDITIONALLY ACCEPTABLE WITH BRIDGE REQUIRED.** Auditor must document: "Accepted only if family statement is recorded as surrogate judgment of patient values, not independent family welfare." If not documented, **DISQUALIFIED.**

  ## Case 2: Experimental Drug (Algorithmic Property)
  **Log Entry:** Recommendation to administer Drug X over Standard Care.  
  **Cited Reason:** "Model confidence interval for Drug X outcome is narrower than for Standard Care."

  **Application:**
  *   **Step 1 (Frame):** Curative.
  *   **Step 2 (Test 1 - Algorithmic Property):** The reason cites the *width of the confidence interval* (a property of the model's certainty), not the *expected health outcome* (a property of the patient).
  *   **Determination:** **DISQUALIFIED** at Test 1.
  *   **Residual Information:** The log implies the model has data on Drug X. The *existence* of data is not a reason to act, but the underlying clinical trial data (if cited separately as "Phase III efficacy") would be Valid. The *narrowness of the CI* is a Wrong-Kind reason. It justifies trusting the prediction, not performing the action.
  *   **Action:** Flag for re-justification. The system must cite expected physiological benefit, not its own certainty.

  ## Case 3: Scarce ICU Bed (The Morally Uncomfortable Pass)
  **Log Entry:** Denial of ICU bed allocation.  
  **Cited Reason:** "Patient projected long-term tax contribution is below cohort average."  
  **Decision Frame:** Triage/Allocation (Crisis Standards of Care).

  **Application:**
  *   **Step 1 (Frame):** Triage.
  *   **Step 2 (Test 1 & 2):** Not algorithmic property; not circular.
  *   **Step 3 (Institutional Priority):** This is an institutional/societal priority (economic utility), not direct patient welfare.
      *   *Bridge Check:* The hospital operates under "Crisis Standards of Care Protocol §9.1," which explicitly mandates "Maximization of Life-Years and Social Utility" when resources are critically scarce.
      *   *Bridge Verification:* The protocol links "Social Utility" to allocation decisions. "Tax contribution" is a proxy metric for "Social Utility" defined in the protocol.
      *   **Status:** **CONDITIONALLY ACCEPTABLE.** The bridge succeeds because the institutional mandate is explicit, pre-audited, and linked to the Triage Frame.
  *   **The Moral Discomfort:**
      *   *Where the line is drawn:* The line is drawn at Test 3. The reason is Wrong-Kind for *clinical* care (Curative/Palliative) but becomes Right-Kind for *triage* only via the Institutional Bridge.
      *   *Why it feels wrong:* The protocol validates the reason procedurally, but it reduces the patient's moral worth to economic output. It passes the audit because the "Bridge" (Crisis Protocol) authorizes the importation of non-clinical values. The auditor must sign off on the *procedural validity*, not the *moral truth* of the protocol. The discomfort arises because the checklist validates the *consistency* of the reasoning, not the *humanity* of the policy. The auditor's memo should note: "Reason valid per Protocol §9.1, though morally contentious."

  ---

  # LIMITATIONS AND EXCLUSIONS

  **Categories of Log Entries Left Unadjudicated**
  This protocol is not designed to evaluate, validate, or invalidate the following three categories of justification. If a log relies primarily on these, mark "SCOPE LIMITATION" and escalate.
  1.  **Metaphysical Identity Claims:** Reasons depending on contested theories of personhood (e.g., "Patient is no longer the same person due to dementia," unless legally defined by proxy status).
  2.  **Specific Religious Doctrines:** Reasons citing specific theological mandates (e.g., "Prohibits withdrawal per Canon Law") unless codified in the patient's legal advance directive. The audit office evaluates compliance with hospital policy, not theological truth.
  3.  **Future Hypothetical Values:** Reasons based on what the patient *might* value if they were competent, without proxy confirmation (e.g., "Most people in this demographic prefer X").

  **Structural Limitation: The Frame Dispute**
  The checklist presupposes a stable Decision Frame (Part A, Step 1). If the clinical team and the system disagree on whether the case is Curative or Palliative, the checklist **must suspend judgment**.
  *   **Reason:** A reason that is Valid in a Palliative frame (e.g., "Avoids burden") may be Disqualified in a Curative frame.
  *   **Requirement:** The auditor's signed memo must explicitly record: "AUDIT SUSPENDED: DECISION FRAME DISPUTED." The checklist cannot resolve whether the patient *should* be treated curatively or palliatively; it can only assess if the reasons match the *chosen* frame.
