answer: |-
  Your problem is not legal; you already know the contract assigns ownership to the company. Your problem is one of moral ontology: what makes an immaterial structure an extension of a specific person's will? In philosophy, there are three main candidate answers. The first is the **Labor Theory of Property**, which suggests you own what you mix your effort with. The second is the **Genesis Theory**, where ownership belongs to the first mind to conceive the coherent form. The third is **Social Utility**, where credit is assigned to incentivize future good work.

  These frameworks disagree sharply on your case. Labor theory favors Tom; Genesis favors you; Social Utility might favor splitting credit to keep peace. I believe the Genesis theory, modified to recognize **conceptual synthesis**, is the correct moral standard. Ownership tracks the specific cognitive act of combining existing elements into a new, functional whole. Labor creates value, but it does not create the *thing* itself. Therefore, credit for the *idea* is distinct from credit for the *engineering*. This distinction resolves most of your tension.

  Regarding Priya: She provided a causal condition, not a constitutive contribution. Philosophically, there is a difference between removing a barrier and building the path. By blocking the nightly rebuild, she forced a search, but she did not guide the search. If five others could have made the same objection, her contribution is even less specific to your solution. She is part of the environment in which you invented, not a co-inventor. She is owed gratitude for saving the team from a bad design, but she owns no part of the new design. Acknowledging her insight is polite; assigning her credit for your architecture is false.

  Regarding Tom: His claim relies on conflating reduction to practice with conception. He is right that ideas are cheap without execution; a prototype is not a product. However, engineering labor validates an idea; it does not typically generate the core intellectual property unless the labor reveals new structural necessities. If his eviction policy and compaction schedule were merely optimizations, he deserves credit for performance, not ownership. If, however, the system *could not work* without those specific choices—if they are structural pillars rather than tuning knobs—then he has contributed to the conceptual design. You must distinguish between making it fast (labor) and making it possible (design).

  On originality: The fact that components were published and others converged on the solution does not negate your ownership. Innovation is rarely ex nihilo (from nothing); it is almost always recombinant. Moral credit tracks your agency in the synthesis, not metaphysical uniqueness. If you independently assembled the puzzle while others did likewise, you still solved it. The existence of prior art diminishes the *novelty* required for a patent, but it does not diminish your moral claim to having done the work of integration. You own the specific synthesis you enacted.

  Here is my concrete recommendation. First, do not ask to change the patent inventorship list unless Tom's contributions meet the legal definition of inventing a specific **claim** (a defined element of the protected method). Patent inventorship is a legal status, not a participation trophy. If his eviction policy is part of the patented method, he belongs on the list morally and legally. If it is merely implementation detail, he does not. Check this with your legal counsel, not based on feelings.

  Second, manage the social credit explicitly. To Priya, say: "You were right to block the nightly rebuild; that constraint forced me to find this solution. I want to acknowledge that in the post-mortem." This validates her insight without conceding ownership. To Tom, say: "The architecture is mine, but the production reliability is yours. I will ensure leadership knows the system only works because of your engineering." Separate the awards. Propose that internal documentation lists you as the architect and him as the lead engineer. This respects the Genesis theory for you and the Labor Theory for him, aligning moral credit with actual contribution.
