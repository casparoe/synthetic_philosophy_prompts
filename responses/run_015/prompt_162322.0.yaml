answer: |-
  # The Modal Metaphysics Decision Tree

  **Start:** You agree that statements like *"I could have been a plumber"* are literally true.

  ### 1. The Ontology of "Worlds"
  To make this true, must we quantify over **concrete physical universes** other than our own (full of stars, atoms, and people), or is everything that physically exists part of *this* universe?
  *   **Yes, concrete universes exist:** Go to **2**.
  *   **No, only this universe is concrete:** Go to **3**.

  ### 2. Transworld Identity (Concrete)
  In those other concrete universes, is it literally **you** (the very same object) located there, or just a duplicate?
  *   **It is literally me:** **[EMPTY CELL]** *(Incoherent: Concrete objects are spatiotemporally isolated; you cannot be in two disconnected physical universes at once.)*
  *   **It is a duplicate (Counterpart):** Go to **5**.

  ### 3. Transworld Identity (Actualist)
  Since there are no other concrete universes, is it literally **you** existing in other abstract scenarios, or just a representative?
  *   **It is literally me (Transworld Identity):** Go to **4**.
  *   **It is a representative (Counterpart):** Go to **5**.

  ### 4. Individuation (The "Swap" Test)
  Imagine two scenarios that are exactly alike in every quality (every atom, every property), except in one *you* exist and in the other *I* exist (we swapped places). Are these **distinct possibilities**?
  *   **Yes, distinct:** **Actualist Transworld Identity with Haecceities** (e.g., Kripke, Plantinga). *(Objects have a primitive "thismess" beyond their qualities.)*
  *   **No, identical:** **Qualitative Actualism** *(Unattractive: Makes it hard to distinguish "I could have been you" from "You could have been me" without qualitative differences; rarely defended in pure form.)*

  ### 5. The Counterpart Relation (Fission & Existence)
  Can there be a world where you have **no** counterpart (you don't exist there), or **two** equally good counterparts (you fission)?
  *   **Yes, 0 or 2 are allowed:** Go to **6**. *(Handles "I might not have existed" as genuine contingency; allows fission.)*
  *   **No, must be exactly 1:** **Rigid Actualist Counterpart Theory** *(Untried/Unattractive: Forces necessary existence or arbitrary choices in fission cases; loses the main benefit of CT.)*

  ### 6. Truth & Analysis (The "World" Status)
  Are these worlds (concrete or abstract) **real entities** that make our statements true, or are they **useful fictions/brute facts**?
  *   **Real Entities:**
      *   (From Node 2): **Lewisian Modal Realism**. *(Concrete worlds + Counterparts + Qualitative + Flexible.)*
      *   (From Node 3/5): **Ersatz Modal Realism**. *(Abstract worlds + Counterparts + Flexible.)*
  *   **Useful Fictions / No Analysis:**
      *   (From Node 2): **Modal Fictionalism**. *(Talk *as if* Lewis is true, but don't believe the concrete worlds.)*
      *   (From Node 3): **Modal Primitivism**. *(No world-quantification needed; modality is a brute feature of reality.)*

  ***

  ### Diagnostic Notes for the Group

  **The Three Test Cases:**
  1.  **Non-Existence ("I might not have existed"):** Handled at **Node 5**. If you answer "No" (must have 1 counterpart), you are forced into necessary existence or vacuous truth. Lewis and standard Actualists answer "Yes."
  2.  **Haecceitism (The Swap):** Handled at **Node 4**. If you think swapped identical twins make no difference, you reject haecceities (Lewis). If you think they do, you need primitive thisness (Kripke).
  3.  **Fission (Two Successors):** Handled at **Node 5**. If you answer "No" (must be 1:1), fission breaks your theory. If "Yes," you accept that *de re* modality can be indeterminate.

  **Indistinguishable Leaves:**
  *   **Similarity vs. Primitive Counterparts:** The tree does not separate a view that says "Counterparts are fixed by similarity" from one that says "Counterparts are fixed by a primitive metaphysical relation." Both land in the same leaves (Lewisian or Ersatz CT). From the outside, they often yield the same truth conditions.
  *   **Ersatz Realism vs. Fictionalism:** If an Ersatzist treats abstract worlds instrumentally, their practice looks identical to a Fictionalist. The difference is purely ontological (do the abstracta *exist*?), not semantic.

  **Empty Cells:**
  *   **Concrete Worlds + Transworld Identity:** Marked in Node 2. Generally considered incoherent because concrete objects are defined by their spatiotemporal location; you cannot be wholly present in two causally isolated spacetimes.
  *   **Rigid Counterpart Theory:** Marked in Node 5. Technically possible, but unattractive because it sacrifices the main motivation for Counterpart Theory (solving problems of accidental intrinsics and fission) while retaining the cost (denying strict identity).
