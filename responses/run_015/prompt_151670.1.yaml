  **MINISTRY OF ELECTORAL PARTICIPATION AND MICROECONOMIC ALIGNMENT**
  **WHITE PAPER 44-B: PROPOSAL FOR THE SINGLE-DECISIVE BALLOT INITIATIVE**

  **1.0 The Instrumental Deficit**
  Current electoral theory acknowledges a discrepancy between the civic expectation of participation and the rational actor's cost-benefit analysis. In a large electorate, the probability of a single vote determining the outcome is negligible. Consequently, the expected instrumental return is outweighed by the opportunity cost of time and travel. Previous attempts to resolve this paradox have been theoretically unsound. Appeals to "civic duty" or "expressive value" are dismissed as measuring affect rather than effect. The minimax-regret argument is rejected as a decision rule that cannot be recommended on its own terms. Altruistic calculi are inadmissible as they change the subject from whether voting is worth it for *me* to whether it is worth it for *us*. Similarly, group pivotality shifts the question from my act to someone else's. To restore rationality, the link between the individual act and the collective outcome must be mechanized.

  **2.0 The Single-Decisive Ballot Mechanism**
  Effective the next fiscal cycle, all ballot papers shall print on their face a Decisiveness Quotient (DQ), defined as 1/N, where N is the total number of ballots cast. After polls close, one ballot shall be drawn at random and certified as the single ballot that legally determined the result. The voter concerned is issued a certificate recording that he or she was decisive. The aggregate popular vote shall be retained as a ceremonial figure for historical archival. This reform ensures pivotality is no longer hostage to margin closeness. Furthermore, the negative externality by which additional voters depress one another's decisiveness probability is resolved, since under the new scheme extra turnout no longer dilutes anyone.

  **3.0 Cost-Benefit Analysis**
  Under the Single-Decisive Ballot Initiative, the voter purchases a lottery ticket with a known probability of securing the total social value of the election. By internalizing the aggregate social stake as the individual benefit value, the expected return clears the cost of voting comfortably.

  > **WORKED CALCULATION: EXPECTED UTILITY OF VOTING**
  >
  > **A. Cost of Voting (C):** $15.00 (Average travel/time opportunity cost)
  > **B. Aggregate Social Stake (S):** $40,000,000,000 (Estimated policy differential impact)
  > **C. Electorate Size (N):** 35,000,000
  > **D. Probability of Decisiveness (P):** 1/N (0.000000028)
  > **E. Expected Benefit (EB):** P × S = $1,142.85
  > **F. Net Expected Utility (EU):** EB − C = **+$1,127.85**
  >
  > *Conclusion: Voting is instrumentally rational.*

  **4.0 Turnout Maintenance**
  The Ministry anticipates the objection that since only one ballot matters, there is no longer any instrumental reason for anyone else to turn out. To ensure the ballot box remains full for the randomization draw, attendance remains mandatory under the Civic Duty Act. Non-attendance incurs a penalty equal to the Expected Benefit calculated in Section 3.0. This ensures the pool size N remains stable, preserving the validity of the Decisiveness Quotient printed on each paper. As noted by external observer Dr. H. Vane, "Finally, the voter is compensated for the tragedy of the commons without resorting to mystical notions of community."¹

  **5.0 Closing FAQ**

  **Q: Does this not render 34,999,999 votes legally irrelevant?**
  A: They remain ceremonially relevant. Their aggregation provides the dataset from which the decisive ballot is extracted.

  **Q: What if the drawn ballot is spoiled?**
  A: The election is declared null. A new draw is conducted from the remaining valid ballots. The DQ is recalculated.

  **Q: Is the social stake truly attributable to the individual?**
  A: For the purposes of instrumental rationality, the citizen is the state. The benefit differential is total.

  ***

  ¹ *Journal of Democratic Microeconomics*, Vol 12. "The marketization of sovereignty resolves the paradox without the morality."
