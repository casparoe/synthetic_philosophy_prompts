          *   *Reject (1) (Lewis/4Dism):* I am both. Cost: Weird ontology (two people here now).
          *   *Accept (6) (Parfit):* Identity doesn't matter. Cost: Revisionism. Does anticipation survive?
      *   **Part 4: Anticipation and the Mars Person.** Address the specific worry about "being me."
