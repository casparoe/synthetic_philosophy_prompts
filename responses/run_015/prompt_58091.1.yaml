  6.  **Review and Refine (Self-Correction):**
      *   *Tone:* Needs to be respectful but sharp. Acknowledge their expertise while holding the philosophical line.
      *   *Lingo Check:* Ensure terms like "Subgame Perfect," "Incentive Compatible," "Revealed Preference," and "Separating Equilibrium" are used correctly.
      *   *User's Variant:* The user specifically mentioned the $50 auto-donation. I need to make sure the objections target *that* specific modification, not just the original Toxin Puzzle. The economists will argue that the $50 makes the action *instrumentally rational*, thus removing the need for a non-instrumental theory of intention.

  7.  **Final Polish:** Organize clearly with headers. Ensure the "Shaky Flag" is honest. (Proceed to generate output based on these thoughts).

