answer: |-
  Here is a Q&A prep sheet tailored for a Micro Theory workshop. The translations shift your philosophical claims into the language of mechanism design, game theory, and preference theory.

  ### **Part 1: The State of Play (Settled vs. Open)**
  *Use this to frame your opening remarks so you don't sound like you're fighting settled science.*

  **What's Pretty Settled (Econ Consensus):**
  *   **Dynamic Inconsistency:** Everyone agrees that without a binding mechanism, a plan made at $t_0$ to act at $t_1$ may not be optimal when $t_1$ arrives.
  *   **The Failure of Standard EU:** In the *original* Kavka case (no penalties), standard Expected Utility theory cannot generate a strategy where you intend to drink but don't actually drink (or vice versa) without violating rationality axioms.
  *   **Commitment Devices Work:** If you can externally bind yourself (like your $50 donation variant), the behavior becomes incentive-compatible.

  **What's Still Up for Grabs (Your Battleground):**
  *   **The Locus of Commitment:** Is the "stickiness" of intention purely a function of external payoff restructuring (your $50 penalty), or is there an internal cognitive technology (a "will" or "normative commitment") that functions *like* a constraint even without external enforcement?
  *   **Ontology of Intention:** Does "intention" exist as a causal state distinct from "probability-weighted action," or is it just cheap talk?
  *   **Rationality of Resolute Choice:** Is it rational to follow through on a prior intention even when current utilities dictate otherwise, provided that forming the intention was beneficial?

  ---

  ### **Part 2: Q&A Prep Sheet (6 Objections Ranked by Trouble)**

  #### **1. The "You Dissolved the Puzzle" Objection**
  *   **The Lingo:** "By adding the $50 auto-donation, you've changed the payoff matrix. Drinking the toxin is now a **dominant strategy**. You haven't solved the intention problem; you've just turned a non-credible threat into a standard **incentive-compatible contract**."
  *   **Why it's trouble:** High. It suggests your variant isn't a philosophical puzzle anymore, just a standard principal-agent setup.
  *   **Quick Reply:** "Agreed, the *action* becomes rational. But my claim is about the *formation of the intention* at $t_0$. Even with the penalty, the agent must overcome the immediate disutility at $t_1$. The 'commitment' is the cognitive bridge that allows the $t_0$ self to trust the $t_1$ self to honor the penalty trigger."
  *   **🚩 Shaky Flag:** They will argue the penalty does all the work. If the math works, the "cognitive bridge" is epiphenomenal.

  #### **2. The Revealed Preference Attack**
  *   **The Lingo:** "In revealed preference theory, mental states aren't observables. If you drink, you preferred drinking (penalty + toxin < $1M). If you don't, you didn't. Positing an unobservable 'intention' state violates **Parsimony**."
  *   **Why it's trouble:** High. This attacks the ontology of your entire discipline.
  *   **Quick Reply:** "Revealed preference explains the *action*, but it can't predict the *planning phase*. We need a theory of the $t_0$ decision that accounts for the anticipated failure at $t_1$. 'Intention' is the label for the predictive model the agent uses of their own future behavior."
  *   **🚩 Shaky Flag:** Hard to defend "intention" as anything other than a probability estimate of your own future action.

  #### **3. Subgame Perfection & Credibility**
  *   **The Lingo:** "In the original puzzle, the threat to drink is not **subgame perfect**. In your variant, the penalty makes it perfect. But why would the billionaire believe you intend to drink in the *original* case? It's a **non-credible threat**."
  *   **Why it's trouble:** Medium-High. Standard game theory says you simply *can't* intend the irrational action.
  *   **Quick Reply:** "Because agents aren't just payoff maximizers; they are rule-followers. If I view myself as a 'person who keeps promises,' that identity constraint alters the subgame payoffs internally, making the threat credible without external cash."
  *   **🚩 Shaky Flag:** Economists hate "identity constraints" unless they are modeled as utility parameters (see #4).

  #### **4. The Psychological Game Theory Reduction**
  *   **The Lingo:** "We can model this without philosophy. Just add a **'guilt parameter'** or 'disutility from breaking promises' to the utility function. Then it's just standard maximization. You don't need a new theory of intention."
  *   **Why it's trouble:** Medium. It co-opts your argument into their framework.
  *   **Quick Reply:** "That works for *ex-post* modeling, but not *ex-ante* guidance. You can't voluntarily choose to have a higher guilt parameter. The philosophical puzzle is about the capacity to *cultivate* that parameter via intention."
  *   **🚩 Shaky Flag:** They will say 'cultivation' is just investing in preference change, which is already modeled.

  #### **5. Contractibility of Mental States**
  *   **The Lingo:** "If intention is a commitment technology, why isn't it **contractible**? Why can't I sell a bond on my intention directly? If it's not verifiable, it shouldn't affect equilibrium."
  *   **Why it's trouble:** Medium. Highlights the friction in your argument.
  *   **Quick Reply:** "Because intention is **non-verifiable** to third parties but verifiable to the self. It's an internal contract. The workshop is about whether that internal contract has binding force."
  *   **🚩 Shaky Flag:** Economists generally treat non-verifiable states as noise, not constraints.

  #### **6. The Behavioral "Nudge" Critique (From the Behav Econ)**
  *   **The Lingo:** "This looks like a **pre-commitment strategy** to manage **time-inconsistent preferences** (hyperbolic discounting). Isn't this just Odysseus tying himself to the mast? Why call it 'intention'?"
  *   **Why it's trouble:** Low-Medium. This person is likely your ally, but they will reduce your point to mechanics.
  *   **Quick Reply:** "Odysseus used ropes (external). Kavka's puzzle asks if we can use 'mind-ropes.' Your $50 variant is an external rope. I'm asking if the mind can generate the tension without it."
  *   **🚩 Shaky Flag:** Behavioral econ might say "mind-ropes" are just neural pathways, which is biology, not philosophy.

  ---

  ### **Part 3: The One Question You Hope No One Asks**

  **"If the $50 penalty makes drinking the toxin the utility-maximizing choice at $t_1$, then where is the 'sacrifice' or 'commitment' left to explain? Haven't you just turned a deontological puzzle into a consequentialist calculation?"**

  *   **Why it kills you:** It points out that by adding the penalty to "bootstrap" the intention, you have removed the very thing that made the Toxin Puzzle interesting (the gap between intention and action). If it's rational to drink because of the $50, you don't need a theory of "intention," you just need a calculator.
  *   **Emergency Exit:** "The calculation explains the *drink*, but it doesn't explain the *intention at midnight*. The billionaire pays on *intention*, not action. You can drink the toxin by accident or for the $50, but to get the $1M, you must *intend* it at midnight, when the $50 penalty doesn't yet exist as a motivator for the *act*, only the *omission*." (This is a bit of a spin, but it's your best Hail Mary).

  ### **Tactical Advice for the Room**
  *   **Don't say "Rationality":** Say "Optimization."
  *   **Don't say "Willpower":** Say "Internal Constraint" or "Endogenous Preference Change."
  *   **Don't say "Morality":** Say "Normative Utility."
  *   **Lean on the Behav Econ:** If the game theorists get hostile, pivot to the behavioral economist: "Surely we agree that preferences aren't always stable across time periods?"

  Good luck. They will try to model your soul; don't let them reduce it to a parameter without a fight.
