prompt: |-
  I'm a second-year PhD student in economics putting together the framing chapter for a survey on decision-making under cognitive limits, and my advisor keeps telling me that the literature scores views against each other without ever saying what the scorecard is. So before I compare anything, I want the specification. Fix the purpose as follows: a theory of rationality for an agent with real resource limits — limited time, limited memory or working space, limited attention, limited representational capacity — that is meant to be genuinely normative, in the sense that it can tell such an agent what it would be reasonable to do and can still call some of what bounded agents do a mistake rather than merely a consequence of their limits. Not a descriptive psychology of what people actually do, and not unbounded Bayesian decision theory with a paragraph of hand-waving about costs bolted on. Given that purpose, write me the desiderata: what any adequate theory of this kind has to deliver, with the case or consideration behind each requirement, and be explicit about why each one is a requirement rather than a taste.

  Here are the candidates I'm carrying around, which you should feel free to reject, split, or replace, since part of what I want is a view on which of them are real desiderata and which are the prejudices of one research program dressed up as requirements. (1) The deliberation-cost regress: choosing how long to deliberate is itself a decision made under the same bound, so the theory has to say when to stop without presupposing an answer to the very question it is stuck on — my case is a fellowship committee with 400 applications, twenty minutes per careful read, six hours of scheduled meeting time, and the option of paying a screener to cut the pool. (2) Interruptibility: the agent may have less time than it believes and will not be warned when the time runs out, so it seems to me that any partial execution of the theory's recommended procedure should already yield a usable recommendation, and I want to know whether demanding that is a genuine requirement or an engineering preference. (3) Self-applicability: the recommendation must be reachable within the bound by the agent it is addressed to, and the agent must be able to tell, within the bound, that it has complied — otherwise the advice is empty. (4) Representational parsimony: the theory should not quietly presuppose that the agent has already written down a prior over all worlds or a utility function over an exponentially large outcome space. (5) The currency question: whether the costs of thinking have to be commensurable with the outcomes being weighed, and what happens if they are paid in effort or attention rather than in the coin of the decision. (6) Immunity to exploitation: should a bounded agent be required to be immune to money pumps or Dutch books, given that recognizing the pump seems to require exactly the reasoning it lacks? (7) Menu and framing sensitivity: whether it is admissible for a bounded agent's choice to depend on the order, granularity, or description of the options, or whether description-invariance is a requirement smuggled in from the unbounded theory. (8) Scaffold neutrality: whether deliberation offloaded onto a calculator, a colleague, a market price, or a written note counts as expanding the bound or as part of the act. (9) The convergence condition: should recommendations approach the unbounded Bayesian or expected-utility answer as the bound is relaxed without limit, or is that a prejudice, given cases where a cruder rule does better than a more inclusive one? (10) The bound's own specification: must the theory take the bound as given, must it say what the bound is a bound on, and must it handle an agent who is uncertain about its own limits and about when options will stop arriving? (11) Normative bite: the theory has to distinguish genuine error from mere limitation closely enough that it cannot end up excusing everything.

  For each desideratum, give me the motivating case and mark whether it is non-negotiable given my stated purpose or optional. Then the part I care most about: tell me which subsets of the list are jointly unsatisfiable, with the argument rather than the assertion — I have a suspicion that the tractability requirements and the non-exploitability requirement cannot both be had, and another that interruptibility and any strong optimality-tracking condition conflict, but I want to see whether you agree and what the tension really turns on. Say which single requirement does the most work in excluding candidate theories, and point out anything important my list has missed. A short table at the end scoring Simon-style satisficing with aspiration levels, information-cost and rational-attention approaches, the fast-and-frugal heuristics and ecological-rationality program, and the bounded-optimality tradition in AI against the final list would be useful, but keep it brief: the criteria are the deliverable, and I can do the scoring myself if the specification is right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Second-year PhD student in Economics.
      *   **Task:** Write the *desiderata* (specification) for a normative theory of rationality under cognitive limits (bounded rationality).
      *   **Purpose:** Normative (what *should* a bounded agent do?), not descriptive (what *do* they do?) and not unbounded Bayesianism with cost bolt-ons. Must distinguish error from limitation.
      *   **Input:** A list of 11 candidate desiderata provided by the user.
      *   **Requirements:**
          *   Evaluate each candidate (keep, split, reject).
          *   Provide motivating cases.
          *   Mark as Non-Negotiable (NN) or Optional (Opt).
          *   Identify joint unsatisfiability (trade-offs/impossibility results).
          *   Identify the single most exclusionary requirement.
          *   Identify missing important desiderata.
          *   Provide a brief scoring table of existing programs (Satisficing, Info-Cost, Fast-and-Frugal, Bounded Optimality).
      *   **Tone:** Rigorous, academic, precise, critical (fitting a PhD framing chapter).

  2.  **Deconstruct the Purpose:**
      *   *Normative:* It must prescribe action.
      *   *Bounded:* Agents have limits (time, memory, attention, representation).
      *   *Distinction:* Must separate "mistake" (irrational) from "limit" (unavoidable).
      *   *No Cheating:* Cannot assume unbounded computation to calculate the bounds.

  3.  **Evaluate the Candidate Desiderata (Iterative Process):**

      *   *(1) Deliberation-cost regress:* Crucial. If calculating the cost of thinking costs more than the thinking saves, the theory collapses. *Verdict: NN.*
      *   *(2) Interruptibility:* Is this NN? If the theory says "run this 10-step algorithm" and the agent gets stopped at step 4, is the result garbage? For a *normative* theory of real-time action, yes. If the advice is fragile, it's not actionable. *Verdict: NN (but nuanced).*
      *   *(3) Self-applicability:* The agent must be able to execute and verify compliance. If the theory requires calculating a global optimum to check if a heuristic is good enough, it violates the bound. *Verdict: NN.*
      *   *(4) Representational parsimony:* Cannot assume a prior over $\Omega$ if $\Omega$ is too big to store. *Verdict: NN.*
      *   *(5) Currency question:* Commensurability. If thinking costs "effort" and outcomes are "money," how do we trade off? A normative theory needs a common metric or a lexicographic rule. *Verdict: NN (needs resolution).*
      *   *(6) Immunity to exploitation:* Dutch books. If a bounded agent *must* be immune, they might need unbounded power to detect the pump. If they *don't* have to be, are they rational? This is a major tension point. *Verdict: Optional/Contested.*
      *   *(7) Menu/Framing sensitivity:* Unbounded theory says invariant. Bounded theory might need framing to reduce search. If we demand invariance, we kill most heuristics. *Verdict: Optional (Relaxation allowed).*
      *   *(8) Scaffold neutrality:* Extended cognition. Does using a notebook count as internal memory? For a theory of *agent* rationality, the boundary matters. *Verdict: Optional (Definition of 'bound').*
      *   *(9) Convergence condition:* As bounds $\to \infty$, does it $\to$ Bayesian? Not necessarily. Sometimes simple rules are robust. Demanding convergence biases toward Bayesianism. *Verdict: Optional.*
      *   *(10) Bound's own specification:* Meta-uncertainty about limits. Hard but necessary for real agents. *Verdict: NN (in some form).*
      *   *(11) Normative bite:* Distinguishing error from limit. This is the *core purpose*. *Verdict: NN.*

  4.  **Identify Tensions/Impossibility Results:**
      *   *The Big Conflict:* **Self-Applicability (3) + Normative Bite (11) + Immunity to Exploitation (6).**
      *   *Why:* To guarantee immunity (no Dutch books), you generally need to check consistency across a wide set of beliefs/choices. Checking consistency is computationally expensive (often NP-hard or worse). If the agent is bounded (3), they cannot run the check. If they can't run the check, they can't guarantee immunity. If you say "you aren't irrational for being pumped because you couldn't check," you lose Normative Bite (11) because *everything* becomes excusable by limits.
      *   *Another Conflict:* **Interruptibility (2) + Optimality/Convergence (9).** Any-time algorithms (interruptible) usually sacrifice asymptotic optimality for anytime usability.
      *   *Another Conflict:* **Deliberation Regress (1) + Normative Bite (11).** To solve the regress, you often need a stopping rule. To justify the stopping rule as *rational* (not just a limit), you need to compare it to the alternative. But comparing requires deliberation.

  5.  **Select the "Most Exclusionary" Requirement:**
      *   It's **(3) Self-Applicability (specifically the verification clause)**. Most theories (especially rational meta-reasoning) fail here because they prescribe calculating the value of computation (VOC) which is often harder than the object-level decision.

  6.  **Identify Missing Desiderata:**
      *   *Learning/Adaptation:* A static theory of bounds is insufficient. Agents must learn *what* their bounds are and how to adjust heuristics.
      *   *Social/Institutional Embedding:* Rationality isn't just individual; it's often offloaded to institutions. (Related to Scaffold, but distinct).
      *   *Goal Stability:* If deliberation changes preferences, how do we evaluate rationality?

  7.  **Drafting the Content (incorporating the "PhD Advisor" tone):**
      *   Need to be precise. Avoid hand-waving.
      *   Structure: Introduction -> Refined Desiderata List -> Impossibility/Tension Analysis -> The "Killer" Constraint -> Missing Pieces -> The Table.
      *   *Refining the List:* Group them logically. (Computational, Normative, Structural).
      *   *Refining the Tensions:* Be explicit about the *mechanism* of the conflict.

  8.  **Review against Constraints:**
      *   Did I answer the "scorecard" metaphor? Yes, by defining the specs.
      *   Did I address the 11 points? Yes, evaluated each.
      *   Is the table brief? Yes.
      *   Is the tone appropriate? Yes, rigorous and critical.

  9.  **Final Polish:**
      *   Ensure the distinction between "Optional" and "Non-Negotiable" is clear based on the *stated purpose* (Normative + Bounded + Error-distinguishing).
      *   Make sure the "Impossibility" section is the highlight, as requested ("the part I care most about").
      *   Check the "Currency" point – this is often the weak link in bounded rationality models (mixing utility units with time units).

      *(Self-Correction during drafting)*: I initially thought about marking "Immunity to Exploitation" as NN. But for a *bounded* normative theory, strict immunity is impossible without unbounded resources. So it must be Optional or Modified. I will mark it as Optional/Contested because demanding it forces the theory back into unbounded Bayesianism.
      *(Self-Correction on Interruptibility)*: Is it really NN? If I tell you "Read all 400 apps," and you get fired at app 50, the advice was bad. So yes, for *action-guiding* advice, it must be robust to interruption.
      *(Self-Correction on Convergence)*: This is definitely a prejudice of the "Approximation" camp vs. the "Ecological" camp. I will mark it Optional.

  10. **Finalizing the Table:** Keep it sharp. Satisficing (Simon), Info-Cost (Stigler/Marschak), Fast-and-Frugal (Gigerenzer), Bounded Optimality (Russell).

      *Let's write.*
answer: |-
  This is the correct move. Before you survey the literature, you must define the object. Your advisor is right: without a specification, "bounded rationality" is just a bucket for "not Bayesian."

  Below is the specification for a **Normative Theory of Bounded Agency (NTBA)**. I have evaluated your eleven candidates, refined the list into non-negotiable requirements versus research-program preferences, identified the impossibility results, and isolated the single constraint that does the most exclusionary work.

  ### I. The Specification: Refined Desiderata

  I have grouped your candidates into three categories: **Computational** (feasibility), **Normative** (evaluation), and **Structural** (scope). I have marked each as **Non-Negotiable (NN)** given your stated purpose (normative, bounded, error-distinguishing) or **Optional (Opt)** (a matter of theoretical taste or specific modeling choice).

  #### A. Computational Requirements (Feasibility)

  **1. The Regress Constraint (Your \#1)**
  *   **Specification:** The procedure for selecting a decision method must not be more computationally expensive than the decision method itself, nor require resources the agent lacks.
  *   **Motivating Case:** The fellowship committee. If calculating the optimal stopping rule for reading applications takes 10 hours, but the total meeting time is 6 hours, the rule is infeasible.
  *   **Status:** **NN.** Without this, the theory prescribes impossible acts, violating the "ought implies can" principle inherent in normativity.

  **2. Representational Parsimony (Your \#4)**
  *   **Specification:** The theory cannot presuppose the agent holds a complete state-space, prior, or utility function in memory if the storage cost exceeds the agent's capacity.
  *   **Motivating Case:** An agent cannot maximize expected utility over a chess game tree they cannot store.
  *   **Status:** **NN.** Violating this smuggles unbounded Bayesianism back in via the back door.

  **3. Self-Applicability & Verification (Your \#3)**
  *   **Specification:** The agent must be able to execute the recommended procedure *and* verify compliance using only the resources available within the bound.
  *   **Motivating Case:** A theory that says "Maximize utility subject to constraint $K$" fails if checking constraint $K$ requires unbounded computation.
  *   **Status:** **NN.** If the agent cannot tell if they have complied, the theory offers no actionable guidance.

  **4. Interruptibility / Anytime Property (Your \#2)**
  *   **Specification:** If the deliberation process is halted prematurely by external constraints, the output generated up to that point must constitute a valid (though perhaps less precise) recommendation.
  *   **Motivating Case:** The committee chair calls a vote with 10 minutes remaining. If the theory's advice is "undefined until step 20 is complete," the agent is left with no rational guidance.
  *   **Status:** **NN.** For real-time agents, fragile procedures are normatively useless.

  #### B. Normative Requirements (Evaluation)

  **5. Normative Bite / Error Distinction (Your \#11)**
  *   **Specification:** The theory must define a set of behaviors as *irrational* (correctable mistakes) distinct from *bounded* (unavoidable limitations).
  *   **Motivating Case:** Forgetting a calculation due to memory limits is bounded; failing to add 2+2 correctly when the numbers are in front of you is a mistake. A theory that excuses both explains nothing.
  *   **Status:** **NN.** This is the core of your stated purpose. Without it, the theory collapses into descriptive psychology.

  **6. The Currency Resolution (Your \#5)**
  *   **Specification:** The theory must specify the exchange rate between cognitive resources (time, effort, attention) and decision outcomes (utility, money).
  *   **Motivating Case:** Is it rational to spend 3 hours of effort to save \$10? If effort and money are incommensurable, the optimization problem is ill-posed.
  *   **Status:** **NN.** You cannot optimize a trade-off without a common metric or a lexicographic ordering.

  **7. Immunity to Exploitation (Your \#6)**
  *   **Specification:** The agent should not be susceptible to Dutch Books or Money Pumps.
  *   **Motivating Case:** A cycle of preferences $A \succ B \succ C \succ A$ allows a bookie to drain the agent's wealth.
  *   **Status:** **Optional.** (See Tension Analysis below). Demanding strict immunity often violates the Computational Requirements.

  **8. Convergence Condition (Your \#9)**
  *   **Specification:** As cognitive bounds relax ($\to \infty$), the agent's behavior should converge to unbounded Expected Utility maximization.
  *   **Motivating Case:** If an agent becomes omniscient, should they become Bayesian?
  *   **Status:** **Optional.** This is a prejudice of the "Approximation" camp. Ecological rationality argues simple rules may outperform Bayesianism even with infinite resources in noisy environments.

  #### C. Structural Requirements (Scope)

  **9. Bound Specification & Meta-Uncertainty (Your \#10)**
  *   **Specification:** The theory must account for the agent's uncertainty about their own bounds and the arrival of future options.
  *   **Motivating Case:** An agent who thinks they have 1 hour but only has 10 minutes needs a different strategy than one who knows the limit.
  *   **Status:** **NN.** A theory assuming known bounds is brittle in dynamic environments.

  **10. Framing & Menu Sensitivity (Your \#7)**
  *   **Specification:** Whether choices can depend on the description or order of options.
  *   **Motivating Case:** Searching a list sequentially vs. simultaneously.
  *   **Status:** **Optional.** Strict description invariance is likely too strong for bounded agents who rely on framing to reduce search costs.

  **11. Scaffold Neutrality (Your \#8)**
  *   **Specification:** Whether offloading cognition to tools counts as internal capacity.
  *   **Status:** **Optional.** This defines the boundary of the "agent." Important for implementation, but the normative core can remain agnostic.

  ---

  ### II. The Impossibility Results (Joint Unsatisfiability)

  You suspected tensions. Here is where the theory breaks. You cannot satisfy the following subsets simultaneously.

  #### Tension 1: The "Rationality Trap" (Computational vs. Normative)
  **Conflict:** **Self-Applicability (3)** + **Normative Bite (5)** + **Immunity to Exploitation (7)**.
  *   **The Argument:** To guarantee immunity to exploitation (e.g., ensuring transitive preferences across all contexts), an agent must check for consistency across their belief/desire set. In general logical systems, checking consistency is undecidable or NP-hard.
  *   **The Trap:**
      1.  If you demand **Immunity (7)**, the agent must run a consistency check.
      2.  If the agent is **Bounded (3)**, they cannot run the check on large problem sets.
      3.  If they cannot run the check, they will occasionally be pumped.
      4.  If you call being pumped a **Mistake (5)**, you are blaming them for a computational impossibility (violating *Ought Implies Can*).
      5.  If you call being pumped a **Limit (5)**, you lose **Normative Bite**, because *any* failure can be blamed on the cost of checking consistency.
  *   **Resolution:** You must relax **Immunity (7)**. A bounded normative theory must allow *local* consistency without guaranteeing *global* immunity.

  #### Tension 2: The "Optimality Regress" (Computational vs. Computational)
  **Conflict:** **Regress Constraint (1)** + **Convergence Condition (9)**.
  *   **The Argument:** To ensure behavior converges to the unbounded optimum as bounds relax, the agent usually needs to calculate the "Value of Computation" (VOC) to decide when to stop thinking.
  *   **The Trap:** Calculating the exact VOC is often as hard as the original decision problem.
      1.  If the agent calculates VOC exactly, they violate the **Regress Constraint (1)** (spending more to decide how to decide).
      2.  If they use a heuristic to estimate VOC, they may not **Converge (9)** to the true optimum, because the heuristic introduces bias that doesn't vanish with more resources.
  *   **Resolution:** You must abandon strict **Convergence (9)**. Bounded optimality is not necessarily asymptotic Bayesianism; it is asymptotic *feasible* optimality.

  #### Tension 3: The "Fragility Trade-off" (Computational vs. Computational)
  **Conflict:** **Interruptibility (4)** + **Regress Constraint (1)** (in strong forms).
  *   **The Argument:** Any-time algorithms (interruptible) typically require maintaining a running summary of the "best so far."
  *   **The Trap:** Maintaining the "best so far" requires memory and comparison operations at every step. If the **Regress Constraint (1)** is tight (deliberation is extremely costly), the overhead of maintaining interruptibility may exceed the budget for the decision itself.
  *   **Resolution:** The theory must specify a minimum bound threshold below which interruptibility is not guaranteed.

  ---

  ### III. The Exclusionary Constraint

  **The single requirement that does the most work is: (3) Self-Applicability & Verification.**

  *   **Why:** This is the filter that kills "Rational Meta-Reasoning" models that dominate current AI and econ literature. Most models propose that an agent should compute the Value of Information (VOI) or Value of Computation (VOC) to decide when to stop.
  *   **The Kill:** Computing the true VOI/VOC requires integrating over the space of possible future thoughts and outcomes. For any non-trivial problem, this integration is *more expensive* than the object-level decision.
  *   **Consequence:** Any theory that says "The agent should optimize their deliberation time" fails this desideratum unless it specifies a *cheap* heuristic for estimating deliberation value. It forces you away from "Optimal Boundedness" toward "Feasible Boundedness."

  ---

  ### IV. Missing Desiderata

  Your list is strong, but two critical normative pieces are absent:

  **1. Learning & Adaptation (The Dynamic Constraint)**
  *   **Case:** A heuristic that works today may fail tomorrow if the environment changes. A static bounded theory excuses an agent using a broken rule because "it was cheap."
  *   **Requirement:** The theory must account for the cost of *updating* the heuristic. Rationality includes allocating resources to check if the current bound-strategy is still valid.

  **2. Goal Stability (The Preference Constraint)**
  *   **Case:** Deliberation can change preferences (e.g., thinking about a purchase makes you want it less).
  *   **Requirement:** The theory must specify whether the agent optimizes for their *current* preferences or *anticipated future* preferences. If deliberation changes the utility function, "maximizing utility" is ill-defined.

  ---

  ### V. Program Scoring Table

  Here is how the major research programs score against the **Non-Negotiable (NN)** list derived above.

  | Program | Regress (1) | Parsimony (2) | Self-Applicable (3) | Interruptible (4) | Normative Bite (5) | Currency (6) | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Simon Satisficing** | **Pass** | **Pass** | **Pass** | **Pass** | **Fail** | **Fail** | Good on feasibility, fails to distinguish error from limit (anything below aspiration is just "failure"). |
  | **Info-Cost (Stigler/Marschak)** | **Fail** | **Fail** | **Fail** | **Fail** | **Pass** | **Pass** | Assumes agent can calculate marginal cost of info (violates Regress/Self-App). |
  | **Fast-and-Frugal (Gigerenzer)** | **Pass** | **Pass** | **Pass** | **Pass** | **Fail** | **Opt** | Excellent on feasibility, but often refuses normative judgment (ecological fit $\neq$ rational). |
  | **Bounded Optimality (Russell/AI)** | **Fail** | **Opt** | **Fail** | **Opt** | **Pass** | **Pass** | Defines rationality as optimal program *design*, but assumes the designer (not agent) solves the regress. |
  | **Rational Meta-Reasoning** | **Fail** | **Fail** | **Fail** | **Opt** | **Pass** | **Pass** | Computes Value of Computation; violates Parsimony and Regress constraints. |

  **Key:** **Pass** = Satisfies NN requirement; **Fail** = Violates NN requirement; **Opt** = Treats requirement as Optional.

  ### Summary Advice for the Chapter
  Your framing chapter should argue that the field is stuck because it tries to maximize **Normative Bite** using tools that violate **Self-Applicability**. The contribution of your survey is to evaluate theories not by how close they get to Bayesianism, but by whether they can be *run* by the agent they describe without triggering an infinite regress. That is your scorecard.
