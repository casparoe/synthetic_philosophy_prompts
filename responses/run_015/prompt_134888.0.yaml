prompt: |-
  You're a senior advisor on democratic innovation working with a mid-sized city manager. Think step by step and do a quick brainstorm before you layout the answer. I need you to turn the actual logic behind sortition—random selection solves party capture but only produces legitimate outcomes under descriptive representation, low urgency, and the absence of "mandate contamination"—into a reusable decision procedue your office can run in about 20 minutes before anyone signs off. The city keeps recieving pitched citizens' assemblies for every dispute, so build an ordered checklist: entry conditions that make this even a candidate, hard-stop questions where a no kills the proposal dead, then the nodes where facts end and values take over, with clear flags for where the tool will misfire. Treat mandate contamination—when the recruitment pool draws from self-selected activists rather than a genuinely random civic roll—as a fatal flaw if present.

  Apply the checklist to two proposals: first, a sorted mini-public to redesign bike-lane priorities, which should pass but yield a recommendation that conflicts with the mayor's campaign promises; second, using sortition to set emergency drought-rationing rules, which should fail hard on urgency and technical need. Don't ask for bibliographies or cite scholars—just build the practical tool, mark the judgment calls honestly, and say exactly what the procedue can't do. Keep it casual, a typo or two is totally fine.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Senior Advisor on Democratic Innovation working with a mid-sized city manager.
      *   **Task:** Create a reusable decision procedure (checklist/tool) for evaluating Citizens' Assembly/Sortition proposals.
      *   **Core Logic to Embed:** Sortition solves party capture but requires descriptive representation, low urgency, and absence of "mandate contamination" (self-selected activists vs. random civic roll) to be legitimate.
      *   **Format:** Ordered checklist (Entry Conditions -> Hard-Stop Questions -> Fact/Value Nodes -> Failure Flags).
      *   **Time Constraint:** Usable in about 20 minutes.
      *   **Tone:** Casual, practical, honest about judgment calls, admit limitations. A typo or two is okay.
      *   **Application:** Apply the checklist to two specific scenarios:
          1.  Bike-lane priorities (Should pass checklist, but note conflict with Mayor's campaign).
          2.  Emergency drought-rationing (Should fail hard on urgency/technicality).
      *   **Constraints:** No bibliographies, no citing scholars.

  2.  **Deconstruct the Core Logic:**
      *   *Problem Sortition Solves:* Party capture/political gridlock.
      *   *Conditions for Legitimacy:*
          *   Descriptive representation (random selection from whole population, not activists).
          *   Low urgency (takes time to deliberate).
          *   No "Mandate Contamination" (pool must be civic roll, not self-selected).
      *   *Fatal Flaws:* High urgency, high technical complexity (maybe), mandate contamination.
      *   *Political Reality:* Recommendations might conflict with elected mandates (Mayor's campaign).

  3.  **Drafting the Decision Procedure (The Tool):**
      *   Need it to be quick (20 mins).
      *   Structure:
          1.  **Entry Conditions:** Is this even the right tool?
          2.  **Hard-Stops:** If "No", kill it immediately.
          3.  **Risk Nodes:** Where facts end and values/politics begin.
          4.  **Failure Flags:** Where it usually goes wrong.
      *   *Mandate Contamination:* Needs to be a hard stop.
      *   *Urgency:* Needs to be a hard stop.
      *   *Descriptive Rep:* Needs to be verified.

  4.  **Drafting the Application (The Scenarios):**
      *   *Scenario 1: Bike Lanes.*
          *   Urgency: Low (planning phase).
          *   Contamination: Check recruitment pool.
          *   Outcome: Passes checklist.
          *   Caveat: Conflicts with Mayor's campaign (Political risk).
      *   *Scenario 2: Drought Rationing.*
          *   Urgency: High (Emergency).
          *   Technicality: High (Hydrology/Infrastructure).
          *   Outcome: Fail hard.

  5.  **Refining Tone and Style:**
      *   Casual, advisor-to-manager vibe.
      *   "Look," "Here's the thing," etc.
      *   Allow a typo or two (as requested).
      *   No academic jargon beyond what's necessary (sortition, descriptive rep).
      *   Honest about limitations (the tool doesn't solve political fallout).

  6.  **Step-by-Step Brainstorming (Internal Monologue):**
      *   *Okay, start with the header.* Make it look like an internal memo.
      *   *The Checklist:* Keep it punchy. Yes/No boxes.
      *   *Hard Stops:* Mandate contamination is key. If the pool is activists, it's just another lobby group. Urgency is key. Assemblies take months.
      *   *The "Gray Area":* What if the Mayor hates the outcome? The tool shouldn't promise political safety, just procedural legitimacy.
      *   *The Typos:* I'll intentionally leave a minor grammatical slip or two to feel authentic, but not enough to hinder readability.
      *   *Scenario 1:* Bike lanes. It's a classic use case. But the Mayor promised no bike lanes. The tool says "Go," but the advice needs to say "Watch out."
      *   *Scenario 2:* Drought. Emergency. Can't wait 3 months for deliberation. Fail.
      *   *Limitations:* The tool doesn't guarantee implementation. It doesn't fix bad facilitation.

  7.  **Drafting the Content (Iterative):**
      *   *Intro:* Hey City Manager, here's the filter.
      *   *Section 1: The 20-Minute Sortition Filter.*
      *   *Section 2: Hard Stops.* (Contamination, Urgency).
      *   *Section 3: The Political Reality Check.* (Mayor's mandate).
      *   *Section 4: Applying it.*
      *   *Scenario A:* Bike lanes. Passes filter, flags political conflict.
      *   *Scenario B:* Drought. Fails urgency.
      *   *Section 5: What this tool won't do.* (Guarantee acceptance, fix bad staff work).

  8.  **Review against Constraints:**
      *   20-minute usability? Yes, checklist format.
      *   Mandate contamination as fatal? Yes.
      *   No bibliographies? Yes.
      *   Casual tone + typos? Yes.
      *   Two scenarios applied? Yes.

  9.  **Final Polish:** Ensure the distinction between "procedural legitimacy" and "political viability" is clear. The tool validates the *process*, not the *outcome*.

  *(Self-Correction during drafting)*: Make sure I don't make the tool too complex. It needs to be a "quick brainstorm" turned into a procedure. Keep the language direct. Ensure the "mandate contamination" definition is clear in the checklist.

  *(Typo Plan)*: I'll miss a comma or maybe write "procedue" instead of "procedure" once or twice since the prompt asked for "a typo or two is totally fine" (actually the prompt used "procedue" itself, so I should match that vibe). I'll keep it natural.

