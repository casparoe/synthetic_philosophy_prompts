answer: |-
  **MEMO**
  **TO:** City Manager
  **FROM:** Senior Advisor, Democratic Innovation
  **SUBJECT:** The 20-Minute Sortition Filter (v1.0)

  Look, we're getting pitched citizens' assemblies for everything from potholes to zoning. Most aren't fit for purpose. You need a way to kill the bad ideas fast without stifling the good ones.

  Below is the decision procedue we're going to use. It's built on the core logic: random selection breaks party gridlock, but only if the pool is clean, the clock isn't ticking, and we aren't pretending this replaces elected mandates.

  Take 20 minutes. Run the proposal through this. If it hits a **HARD STOP**, kill it. If it hits a **FLAG**, proceed only with eyes open.

  ***

  ### PART 1: THE 20-MINUTE SORTITION FILTER

  #### A. Entry Conditions (Is this even the right tool?)
  *If you can't check these, stop here. Don't waste time.*
  [ ] **Issue is Value-Laden, Not Purely Technical:** Is there a legitimate debate about "what we want" vs. just "how to fix it"? (e.g., "Where should the park go?" vs. "How do we repair the sewer pipe?")
  [ ] **Decision Authority is Clear:** Does the City Council/Manager actually have the power to implement the recommendation?
  [ ] **Timeline Allows Deliberation:** Can we wait 3–6 months for recruitment, learning, deliberation, and reporting?

  #### B. HARD STOP Questions (If "NO", kill the proposal dead)
  *These are non-negotiable. If these fail, the legitimacy is fake.*

  1.  **Is the Recruitment Pool Clean? (The Mandate Contamination Check)**
      *   *Question:* Are we drawing from the full civic roll (utility bills, voter reg, DMV) or a self-selected pool (sign-up sheets, NGO lists, social media ads)?
      *   *Requirement:* **Must be random stratified sample from civic roll.**
      *   *Reason:* If the pool is self-selected activists, this isn't a citizens' assembly; it's a lobby group with a budget. **Fatal Flaw.**

  2.  **Is Urgency Low?**
      *   *Question:* Is there an immediate crisis requiring action within 30 days?
      *   *Requirement:* **No.**
      *   *Reason:* Sortition is slow. Emergency + Deliberation = Disaster.

  3.  **Is the Question Framed Neutrally?**
      *   *Question:* Does the charter question lead the witness? (e.g., "How do we implement X?" vs. "What should we do about X?")
      *   *Requirement:* **Neutral framing.**
      *   *Reason:* If the question is rigged, the random selection doesn't matter.

  #### C. The Gray Zone (Where Facts End and Values Begin)
  *These aren't kill switches, but they require explicit sign-off from you.*

  [ ] **Political Conflict Risk:** Will the likely outcome conflict with the Mayor's or Council's campaign promises?
      *   *Note:* The tool ensures *procedural* legitimacy, not *political* safety. If the assembly contradicts the elected mandate, you need a plan for that clash.
  [ ] **Implementation Capacity:** Do staff have the bandwidth to support the assembly (briefing materials, facilitation) without breaking current operations?
  [ ] **Public Communication:** Are we prepared to explain why 50 random people get a say while voters who elected the Council do not? (Script needed: "Representative sample vs. Majority rule").

  #### D. Failure Flags (Where the tool usually misfires)
  *Watch out for these during the process.*
  *   **Elite Capture:** Experts briefing the assembly are all from one side.
  *   **Drop-out Bias:** Lower-income participants drop out due to lack of childcare/transport. (Budget for stipends/coverage is mandatory).
  *   **The "Shelf-ware" Risk:** Council ignores the recommendation. (Only run this if you're willing to implement).

  ***

  ### PART 2: APPLYING THE FILTER (Two Real Cases)

  Here's how this plays out on the two proposals sitting on your desk right now.

  #### Case 1: Bike-Lane Priority Redesign
  *Proposal:* Use a mini-public to decide which neighborhoods get protected lanes next year.

  **The Run-Through:**
  *   **Entry:** Value-laden? Yes (equity vs. efficiency). Authority clear? Yes. Timeline okay? Yes (planning phase).
  *   **Hard Stop 1 (Pool):** Proposal uses voter roll + utility data. **PASS.** (No mandate contamination).
  *   **Hard Stop 2 (Urgency):** Planning cycle is 6 months out. **PASS.**
  *   **Hard Stop 3 (Framing):** Question is "How should we prioritize lanes?" **PASS.**
  *   **Gray Zone (Political Conflict):** **FLAG RAISED.** The Mayor campaigned on "no reduction in car lanes." A representative group might prioritize equity over car flow, directly contradicting the campaign.
  *   **Verdict:** **PROCEDURALLY GREEN, POLITICALLY YELLOW.**
  *   **Advice:** We can run this. It solves the gridlock between cyclists and drivers. But you need to warn the Mayor: if a random sample of her own constituents says "build the lane," vetoing it looks worse than accepting it. The legitimacy of the process protects you, but only if you commit to honoring the result beforehand.

  #### Case 2: Emergency Drought Rationing
  *Proposal:* Citizens' assembly to set water restriction tiers for the upcoming summer.

  **The Run-Through:**
  *   **Entry:** Value-laden? Yes. Authority clear? Yes. Timeline okay? **NO.**
  *   **Hard Stop 1 (Pool):** Civic roll. **PASS.**
  *   **Hard Stop 2 (Urgency):** Drought status is critical. Restrictions needed in 3 weeks. Assembly takes 3 months. **FAIL.**
  *   **Hard Stop 3 (Framing):** N/A (Already failed).
  *   **Verdict:** **HARD STOP.**
  *   **Advice:** Kill this immediately. Sortition cannot handle emergency triage. This needs expert hydrology data and elected accountability for tough calls. Using sortition here looks like the Council is hiding from responsibility during a crisis. Plus, if the assembly drags its feet, we run out of water. Technical urgency overrides deliberative benefit.

  ***

  ### PART 3: WHAT THIS PROCEDUE CAN'T DO

  Be honest with yourself about the limits of this checklist.

  1.  **It Doesn't Guarantee Acceptance:** You can run a perfect process, get a perfect recommendation, and the Council can still vote it down. This tool doesn't fix cowardice.
  2.  **It Doesn't Fix Bad Facilitation:** If the moderators steer the room, the random selection doesn't matter. You need to vet the vendor hard.
  3.  **It Doesn't Solve "Why Not Voting?":** Critics will always say "we have elections for this." This tool assumes you've already made the philosophical case for sortition. It just ensures you don't do it stupidly.
  4.  **It Can't Predict Media Spin:** Even a clean process can be framed as "unelected bureaucrats" by opponents. Prepare comms early.

  **Bottom Line:** If it passes the Hard Stops, it's a valid tool. If it hits the Gray Zone, it's a political strategy choice. If it fails Urgency or Contamination, it's a waste of money and trust.

  Let's stick to this. Saves us from having to have the same argument every time a consultant walks in the door.
