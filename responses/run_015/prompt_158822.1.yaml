      *   *Point 3 (Vulnerability):* Mechanism 1 (Chance) is the weapon of the vulnerable (tripwires). Mechanism 2 (Blinding) requires security (you can afford to be dumb if you survive).
      *   *Irrationality:* The framing is a category error. It's not irrationality; it's *binding*. Mechanism 1 binds the *will*. Mechanism 2 binds the *mind*. Calling it irrationality suggests madness rather than constraint.

