          *   *Refinement:* Mechanism 1 creates a *risk* of war (probability < 1). Mechanism 2 creates a *certainty* of war given a signal (probability = 1 given signal). Therefore, Mechanism 2 is more sensitive to false positives in the sensor itself. Mechanism 1 is sensitive to accidents triggering the risk process.

      *   *(2) Reciprocal Fear of Surprise Attack (Crisis Stability):*
