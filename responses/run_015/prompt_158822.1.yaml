      *   *Mechanism 2 (Blinding/Discrimination):* This is less standard in classic literature but resembles "automatic retaliation" based on minimal info (e.g., Dead Hand system but focused on lack of discrimination rather than lack of control). The key is relinquishing *discrimination*. You *will* respond if the bit flips, but you don't know what hit you. It's about removing proportionality.

  3.  **Drafting - Point by Point:**

