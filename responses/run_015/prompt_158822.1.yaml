          *   Mechanism 2 (Blinding): This likely *amplifies* fear more. If I know you are blind, I know you might overreact to a glitch. But also, if my forces are vulnerable, I might fear you will strike preemptively to disable my sensor. Actually, if you are blind, you can't distinguish a first strike from a second strike. This makes preemptive strike *more* attractive to the adversary? No, if you retaliate blindly, deterrence holds. But does it dampen reciprocal fear? If I know you can't discriminate, I know any mobilization looks like an attack. This increases crisis instability.
          *   *Comparison:* Mechanism 1 dampens aggression by raising shared risk. Mechanism 2 dampens aggression by promising indiscriminate punishment. But in a crisis, Mechanism 1 makes leaders nervous about losing control. Mechanism 2 makes them nervous about being misunderstood. Mechanism 1 is arguably more stable because it allows for *some* negotiation before the chance eventuates. Mechanism 2 is hair-trigger based on data. Let's argue Mechanism 1 dampens reciprocal fear slightly more (by making war a shared risk) whereas Mechanism 2 amplifies it (by making war a certainty on ambiguous data).

      *   *(3) Vulnerable vs. Secure Second-Strike:*
