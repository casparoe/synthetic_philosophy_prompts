          *   *Decision:* Mechanism 2 (Blinding) is only available/credible with a *secure* second strike. If you are vulnerable, you need discrimination to ensure your limited retaliation hurts enough. Mechanism 1 (Chance) is available to vulnerable states (tripwires).

      *   *(4) Irrationality for Rational Ends:*
          *   Mechanism 1 is the classic Schelling case. It looks irrational (risking war you don't want) but is rational (deters).
