  The municipal inspector surveyed Hilbert's Hotel. 'Your permit allows potential infinity only,' she noted. 'Every room must be reachable by a finite walk from the lobby; no completed totality permitted.'
  Suddenly, an infinite bus arrived. The Manager panicked, then smiled. 'No problem! I'll move each guest in room n to room 2n, freeing all odd rooms for the newcomers.'
  He began shouting orders: 'Move to 2! Move to 4! Move to 6!'
  The Inspector immediately revoked the occupancy certificate. 'Stop!' she commanded. 'Your reassignment strategy presupposes the entire set of rooms exists simultaneously as a finished object. Under Section 4 of the Potentiality Act, you cannot manipulate the infinite whole, only extend the building as needed. You've treated the hotel as actual, not potential.'
  'But,' stammered the Manager, 'where shall I put the tourists?'
  'Build another room,' she replied. 'Then another. Never finish.'

  Commentary on the choices made
  The punchline maps the metaphysical distinction between potential and actual infinity onto bureaucratic compliance. By framing infinity as a planning issue, the joke literalises the finitist objection that infinite collections cannot be treated as completed wholes. The regulatory framing was selected because building permits inherently concern physical extension and reachability, mirroring the finitist insistence that numbers are constructed stepwise rather than given all at once. It turns ontological status into planning permission.
  The joke exaggerates the finitist denial of completed infinite collections. In standard set theory, the mapping n to 2n is valid because the set of natural numbers is actual. Here, the Inspector treats the Manager's simultaneous reassignment as a legal violation, implying that one cannot operate on the 'all' of infinity, only on the 'next'. This highlights the operational friction Cantor's diagonalism creates for constructivist philosophies, reducing a profound mathematical disagreement to a mundane administrative refusal. The humour arises from the collision of abstract set theory with rigid municipal logic, suggesting that even mathematics must obey local council regulations regarding the nature of existence.
