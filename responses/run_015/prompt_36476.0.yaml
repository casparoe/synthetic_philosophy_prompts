answer: |-
  Your editor is substantially right, particularly regarding your protagonist. If your novel's spine is that *everyone* suffered a systemic cataclysm, the archaeology will not bear the weight. Here are the defeaters, ranked by how severely they undermine your premise.

  **1. The Circularity of Elite Evidence (Fatal)**
  This is the most damaging argument against your view. The 'collapse' is defined primarily by the disappearance of palace archives (Linear B, Cuneiform). When the bureaucracies vanish, the writing stops. To claim systemic collapse because the writing stopped is tautological: you are measuring the death of the state by the silence of the state. For a protagonist who is 'nobody', this evidence is irrelevant. If the scribe's master dies, the script dies, but the ploughman continues. A committed proponent must concede that our map of the catastrophe is drawn entirely by the victims who owned ink. If your character is not elite, the 'death of scripts' is not a lived experience of collapse, but merely a change in employment.

  **2. Rural Continuity and Survey Archaeology (Severe)**
  Regional survey data often shows population stability where palace sites show destruction layers. In the Argolid or parts of the Levant, while the megara burned, small village sites frequently persist without interruption. Pottery styles evolve rather than vanish; trade goods diminish but do not always disappear. If ordinary households experienced continuity rather than catastrophe—as you specified would move you most—then the 'apocalypse' is a top-down phenomenon. Famine and earthquake were likely real, but they were punctuated crises, not a continuous decades-long blackout. If your protagonist is farming, they may know hardship, but not the end of the world.

  **3. Regional Variation (Awkward)**
  The collapse was not universal. Cyprus (Alashiya) remained a trade hub; Egypt survived, albeit battered; parts of the Levant transformed into thriving Iron Age city-states almost immediately. To maintain a 'global' collapse narrative, you must geographically isolate your character from these zones of resilience. If your scribe travels, the theory frays. It forces you to ignore regions that contradict the mood of ruin.

  **4. Semantic Drift (Philosophical)**
  You asked if 'collapse' has become unfalsifiable. Often, yes. When destruction layers are decades apart, proponents argue for 'cascading failure'. When trade continues but changes hands, it is termed 'reorganisation'. If every outcome (destruction, survival, transformation) is folded into the narrative of collapse, the term loses explanatory power. It becomes a mood rather than a mechanism.

  **Verdict**
  Your editor is correct that 'collapse' is a narrative category that suits novelists better than archaeologists. For a palace scribe, the world ended. For a tenant farmer, it was likely business as usual, albeit with stricter landlords or new trade goods. If you insist on total systemic failure for a nobody, you are writing myth, not history. To be historically honest, you must distinguish between the end of a civilisation and the end of a life. The former happened; the latter is your invention.
