      *   *Conclusion: The Worst Tension.* Pinpoint the Simulated Cow/Experience Machine conflict. It threatens to collapse the two-tier view into either hard utilitarianism (absurd tiling) or a value theory that grants animals more status than Nozick allows.

  8.  **Refining the Nozickian Voice:**
