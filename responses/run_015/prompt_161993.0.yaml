  **DEPARTMENT OF NEGATIVE WELFARE ASSURANCE**
  **Guidance Note 88-C: Tranquility Assessment Protocols**

  **1. Metric Definition**
  Pursuant to the Welfare Act, claimant status is determined solely by the absence of active craving or suffering (hereinafter "Negative Welfare Units" or NWUs). Welfare is not additive; it is subtractive. A subject in a state of neutral contentment possesses the same welfare value as a subject experiencing unrequested pleasure. Officers must not record positive affect unless it directly remedies a prior documented deficit.

  **2. Excluded Activities**
  For scoring purposes, "pure enjoyments" yield zero NWUs. Claimants reporting satisfaction derived from sunsets, unprompted conversation, or artistic appreciation will be assessed as having neutral welfare status. Similarly, consumption of goods without prior physiological need (e.g., a second helping when satiated) constitutes a neutral event. Resources allocated to facilitate such events are considered wasteful expenditure under Section 4 of the Act.

  **3. Intervention Hierarchy**
  Where a craving is identified, the Department prioritizes the elimination of the craving over the satisfaction of it. Pharmacological suppression of appetite scores identically to food provision in NWU terms, as both result in the absence of hunger. However, suppression is preferred on cost-efficiency grounds. Claimants requesting resources to satisfy desires may be offered appetite inhibitors instead. Refusal of inhibitors constitutes a voluntary retention of suffering and may impact benefit tiers.

  **4. Expectation Management**
  Adaptive preferences are recognised as valid welfare improvements. Claimants who have lowered expectations to eliminate the possibility of disappointment shall be assessed as having achieved high tranquility scores. Officers are instructed not to encourage ambition, skill acquisition, or social mobility, as these introduce new potentials for craving. Stability of low expectation is preferable to volatility of high achievement.

  **5. Aggregation Rules**
  In cases of resource conflict, priority is assigned to the intensity of suffering rather than the number of sufferers. One claimant experiencing acute agony outweighs one million claimants experiencing mild unease. However, where intensities are equal, the state is not obligated to prefer the many over the few, provided the total NWU deficit remains constant. Trading mechanisms should reflect this non-linear aggregation.

  **6. Status Anomalies**
  Automated systems register deceased persons as having zero active cravings and zero suffering. Consequently, deceased claimants may test as perfectly tranquil. This is flagged as a data artefact arising from the metric's reliance on current state reporting. Officers are instructed not to interpret this as a policy implication regarding mortality. Benefits cease upon death regardless of tranquility score.

  ***

  **Note on Liberties:** This satire leans on the "reductio ad absurdum" that tranquilism equates non-existence with perfect welfare, though most proponents argue non-existent beings lack welfare status entirely. The cost-efficiency claim regarding craving-deletion is logically consistent with the view's definition but ignores potential side-effects proponents might contest.
