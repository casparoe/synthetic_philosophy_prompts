      *   *S4: "The theory is usually credited to an American philosopher called Rosenthal, and it's a 'thought' theory because the higher-order state has to be a thought, which is why it predicts that creatures without the relevant concepts — babies, and most animals — aren't conscious, or at least aren't conscious in the way we are."*
          *   **Verdict:** Mixed. Rosenthal is the big name for HOT (specifically *Higher-Order Thought* or HOT theory). But there are *Higher-Order Perception* (HOP) theories (Lycan). The "creatures without concepts" bit is a specific commitment of Rosenthal's *Thought* version, not all Higher-Order *Theories*. Critics love to hammer this, defenders (like Rosenthal) bite the bullet.
      *   *S5: "It also explains blindsight: the patient has no first-order visual state to be aware of, so there's nothing for the higher-order state to target, and they genuinely aren't conscious of seeing anything."*
