      *   *Check:* Blindsight. The friend said "no first-order visual state." Actually, in blindsight, V1 is gone, but subcortical pathways or extrastriate cortex often still process info. So there *is* a first-order state, just no awareness. HOT explains this as 1st order present, 2nd order absent. The friend got this backward. I need to be clear on this.
