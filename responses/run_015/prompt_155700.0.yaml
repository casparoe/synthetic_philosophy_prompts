answer: |-
  Applying *Vergangenheitsbewältigung* to *Beloved* ultimately distorts the novel by imposing a therapeutic imperative on a trauma that demands silence for survival. The framework clarifies the sheer weight of the past pressing on the present, making it useful for teaching the scene where Sethe shows Paul D the "chokecherry tree" of scars on her back, illustrating memory as bodily inscription, and Baby Suggs in the Clearing, where collective mourning briefly becomes possible. These moments resonate with the struggle to make the unspeakable speakable.

  However, an honest critic must concede that the novel resists the German ideal of the subject mastering memory. Morrison's "rememory" is not internal psychology but an external landscape one can walk into; it exists without a rememberer, defying the notion that consciousness controls the past. Consequently, the ending fractures the framework. When the women drive Beloved out and the text injunctions "This is not a story to pass on," *Vergangenheitsbewältigung* reads this as repression—a failure of working through. Within the novel, it is protection. The framework smuggles in the assumption that more remembering is always better; Morrison suggests some memories must be starved to keep the living alive. The German model lacks the resources to value strategic forgetting as an act of care owed to survivors.

  Furthermore, the comparative focus shifts radically. The German, Japanese, and Turkish cases center the perpetrator nation's conscience—how *they* deal with *their* guilt. *Beloved* exposes a structural asymmetry: the harmed remember while the harmers forget. The variable for comparative literature should not be the perpetrator's internal struggle, but the victim's burden of carrying memory in a hostile amnesia. In the American South, there is no state-sponsored *Vergangenheitsbewältigung* for slavery, only the victim's private haunting.

  *Beloved* adds an ontology of memory absent in state-centered models. It shows memory as ghostly, contagious, and dangerous, challenging the teleology of healing. It insists that for the enslaved, "working through" is not a civic duty but a mortal risk, shifting the comparative axis from national rehabilitation to survivor survivability. The novel teaches that when the society refuses to remember, the victim's memory becomes a ghost that must be managed, not a history to be solved.
