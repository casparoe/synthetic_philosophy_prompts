      *   *Tension:* If it's *all* fiction, how do we distinguish correct from incorrect use without smuggling in normativity? If arithmetic is just fiction, why does $2+2=4$ feel necessary?

  3.  **Anticipate the Audience Dynamics:**
      *   *Wittgensteinians:* They like the skepticism but might worry the user is reifying the "fiction" or missing the therapeutic point. They speak in terms of "language-games," "forms of life," "normativity," "assertibility conditions."
      *   *Philosophers of Math:* They will attack the indeterminacy of arithmetic. They speak in terms of "truth conditions," "reference," "determinacy," "Platonism vs. Nominalism," "normative force."

