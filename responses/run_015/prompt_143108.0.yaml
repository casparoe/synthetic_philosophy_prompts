          *   *Conclusion:* We cannot rely solely on behavioral output. We need process-tracing or multi-context testing to rule out masks.

      *   **Point 2: Ontological Commitment (Masked Capacities):**
          *   *The Challenge:* If the manifestation never occurs (due to masking), what grounds the claim that the disposition exists?
          *   *Avoiding Reductionism:* We can't just say "it's the neural structure" (categorical base) because structural connectivity doesn't guarantee function without the dispositional power. Also, multiple realizability suggests the base isn't identical to the disposition.
          *   *Required Commitment:* We must commit to dispositions as *real, irreducible properties* that exist even when unmanifested. This is a realist view of powers.
          *   *Clinical implication:* We must treat the capacity as a latent potential that persists despite current performance. This shifts focus from "what did the patient do?" to "what is the patient's structural/functional potential if interference were removed?" It requires a commitment to unobservable causal powers, not just regularities.

      *   **Point 3: Rapid Finking and Explanatory Value:**
          *   *The Challenge:* Finking is worse than masking. The stimulus *causes* the loss of the disposition.
