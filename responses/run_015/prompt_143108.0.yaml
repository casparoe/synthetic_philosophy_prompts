          *   *Explanatory Value:* Dispositional ascriptions lose predictive power if they are unstable under testing conditions. However, they retain *retrospective* explanatory value (explaining why the capacity vanished).
          *   *Framework adjustment:* The framework must model the *stability conditions* of the disposition, not just the disposition itself. We need to predict when finks will activate.

      *   **Synthesis/Conclusion:** Summarize the shift from a behaviorist/SCA model to a causal powers model. Emphasize the need for dynamic, context-sensitive assessment rather than static testing.

