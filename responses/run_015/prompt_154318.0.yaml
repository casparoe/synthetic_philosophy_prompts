      *   Defend Physical failure (informational structures)? Yes.
      *   Defend Design inapplicability (no discrete parts)? Yes.
      *   Defend Intentional success (tracks real patterns)? Yes.
      *   Conclude Intentional is ontological commitment, not heuristic? Yes.
      *   No external literature? Yes.

  6.  **Final Polish:** (Writing the response based on the above structure.) *Ensure the transition from "Real Patterns" to "Ontological Commitment" is sharp. If a pattern is the only thing explaining causality, denying its ontology denies the causality.*

  *(Self-Correction during final drafting)*: I need to be careful not to misrepresent Dennett too wildly, but the prompt asks me to argue *against* his neutrality using his own criterion. So I must use the "Real Patterns" definition (compressibility/predictability) to show why the Intentional Stance wins out ontologically in this specific niche, thereby breaking the equivalence class Dennett proposes.

