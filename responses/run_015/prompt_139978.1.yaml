  **Part (a): Demandingness, Integrity, and Self-Defeat**
  *   **Reconstruction:** The candidate defines the demandingness objection structurally (agent-neutral value + maximizing rule = unlimited sacrifice). They argue the integrity objection is not independent but a "special case" of demandingness (alienation is just the felt experience of unlimited demands). They distinguish self-defeat as concerning the outcomes of general acceptance/dispositions. They offer a "lone rescuer" case for demandingness without self-defeat, and a "universal small sacrifice" case for self-defeat without demandingness.
  *   **Testing:**
      *   *Definition:* Accurate and concise. Captures the "no stopping point" element well.
      *   *Integrity:* This contradicts the seminar framing ("neighbours that students reliably confuse with it"). While philosophically defensible (reducing integrity to demandingness), it sidesteps the instruction to *distinguish* them as separate objections. Crucially, it makes it impossible to fulfill the instruction to provide a case where one has force and the other does not (if Integrity is a subset, it cannot have force without Demandingness). The candidate fails to provide the requested contrasting case for Integrity.
      *   *Self-Defeat:* The distinction is clear. However, the case ("small sacrifice... catastrophic if universally made") is conceptually muddled. It sounds more like a Kantian universalization test or a coordination failure than the standard self-defeat objection (where pursuing the goal undermines the goal).
