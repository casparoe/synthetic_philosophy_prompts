  I write about science and ideas for a Sunday paper — global health and the effective-giving world are part of my beat, which is how I ended up teaching, of all things, a six-week seminar on ethical reasoning for mid-career fellows at a press institute this spring. The last third of the course was on the demandingness objection to consequentialism, and we worked with a deliberately narrow map of the territory: an agent-neutral axiology plus a maximizing decision rule as the target; the agent-centred prerogative and satisficing consequentialism as the two internal repairs; satisficing and scalar consequentialism as the two non-optimifying forms; rule consequentialism as the structural alternative; and, alongside the demandingness objection proper, the integrity objection and the self-defeat (suboptimal-outcomes) objection as neighbours that students reliably confuse with it. I also introduced two complications of my own in the final session, because the published discussion of them is thinner than I think it should be: what I called *modal demandingness* — the thought that what is demanded may be a whole profile of counterfactual responsiveness rather than any single act — and *non-compliance sensitivity* — the thought that the size of the demand on you is a function of how many other people are shouldering it, which I illustrated with the last-responder case. I set a take-home paper marked out of 25, and I am now grading it blind. I don't want to say what I thought of this particular script, because I know this candidate is the most fluent prose stylist in the group and I am worried I will let the writing carry the argument; I would rather have an independent reading first.

  Here is the question as it was set to candidates (word limit 900):

  ---

  **Question 3 (25 marks). Answer all four parts.**

  **(a) [6 marks]** State the demandingness objection in a form that is not merely the truism that morality can be costly. Then distinguish it from (i) the integrity objection and (ii) the self-defeat objection. For each of (i) and (ii), describe a case in which that objection has force while the demandingness objection does not, or vice versa.

  **(b) [7 marks]** Explain how an agent-centred prerogative and a satisficing criterion each respond to the objection. In each case, identify which component of the standard package is surrendered — agent-neutral value, the maximizing decision rule, or the overridingness of moral requirements — and say what the response costs the theory.

  **(c) [6 marks]** *The absorption problem.* If the prerogative is stated as a fixed weighting, so that an agent may count her own comparable interests at some fixed multiple of the weight she gives to any other person's, then as the number of people in need grows the prerogative appears to protect less and less, and in the limit protects nothing. Explain why. Then assess the ratchet reply: the weighting itself may be re-set, at the level of a lifetime plan rather than case by case, by appeal to the consequences of adopting it. Does this escape the absorption problem, or does it reinstate maximizing?

  **(d) [6 marks]** Two complications from the final seminar. (1) Modal demandingness: the cost that concerns us may be the cost of the entire conditional profile the theory seems to require — that you would give in every nearby case in which giving would help — rather than the cost of any single act. (2) Non-compliance sensitivity: what is actually demanded of you depends on what other people do; in the last-responder case, you are one of two people who could save a child and the other walks away. For each complication, say whether it strengthens or weakens the objection, and whether either response in (b) addresses it.

  ---

  The script I want you to read is candidate 0417's. It is reproduced verbatim, spelling and all.

  ---

  **CANDIDATE 0417**

  (a) The demandingness objection is not the complaint that morality sometimes costs us something; no one denies that, and a morality that never cost anyone anything would not be worth having. The objection is structural. Because the theory pairs an agent-neutral account of value with a maximizing decision rule, there is no point at which the agent may say, enough, the rest is mine. Every option is ranked against the best available outcome, and so long as one further unit of sacrifice would do more good than the agent could do with it herself, that sacrifice is required. The demand is therefore in principle unlimited, and a morality with no stopping point is not recognisably a morality at all.

  The integrity objection is the same worry seen from the inside. It says that consequentialism alienates the agent from her deepest commitments, but alienation is simply what unlimited demands feel like to the person who has them, so the integrity objection is a special case of the demandingness objection rather than an independent one. The self-defeat objection, by contrast, is genuinely distinct: it says that general acceptance of the theory, or of a disposition to act on it, would produce worse outcomes than some alternative, because of lost coordination, information costs, or the destruction of partial relationships, and that this counts against the theory. There are cases where it has no force while demandingness does — the lone rescuer who can save a stranger at great personal cost, where no one else's conduct is in question. And there are cases where demandingness has little force but self-defeat might: a rule requiring everyone to make a small sacrifice that would be catastrophic if universally made.

  (b) The agent-centred prerogative keeps agent-neutral value and keeps the consequentialist ranking of outcomes, but adds a permission: the agent may promote her own interests even when the outcome would be somewhat better if she did not. What is surrendered is the claim that the right act is always the optimific one — the maximizing rule as a rule for the agent — and not the agent-neutral axiology. The cost is that the theory can no longer explain why the agent is permitted to do less than the best in the ordinary case, as opposed to merely being allowed to; it purchases relief from the objection at the price of an unexplained permission.

  Satisficing consequentialism replaces the maximizing rule with a threshold: an act is permissible if its outcome is good enough, and once the threshold is met the agent may do anything that is not positively bad. Since a satisficing theory never requires sacrifice beyond the threshold, the demandingness objection cannot get a grip on it at all. The objection is an objection to maximizing specifically, and a satisficing theory has no maximizing rule for it to bite on.

  (c) If the prerogative is a fixed multiple, then the aggregate weight of other people's interests grows with their number while the multiple stays fixed. For any fixed multiple there is therefore a number of people beyond which the prerogative no longer permits the agent to prefer her own lesser interest; the protection it offers is absorbed into the sum. In famine-type cases involving very large numbers, the prerogative accordingly delivers nothing, which is why the demandingness objection is said to survive in just the cases that matter most.

  The ratchet reply does not help. If the weighting is itself chosen by appeal to the consequences of adopting it, it is chosen so as to maximize, and a maximizing choice of weighting will simply reimpose the optimum; the prerogative then does no protective work. The prerogative can do its job only if the weighting is held fixed against consequentialist reassessment, and then it is absorbed. The two horns are exhaustive, and that is a genuine difficulty for the prerogative rather than a verbal one.

  (d) Modal demandingness is a real extension of the objection rather than a restatement of it. The theory's requirements plausibly reach dispositions and motives, since what an agent would do across nearby cases is itself something the theory can evaluate by its consequences; so the objector can insist that the relevant cost is the cost of the whole profile, not of any one act. Neither response in (b) obviously helps. A prerogative framed as a permission governing acts does not obviously license a settled disposition to stop early, and a threshold fixed for acts does not obviously govern dispositions.

  Non-compliance sensitivity is irrelevant to the objection. A theory's requirements are fixed by the value of the outcomes; the fact that other people fail to do their part is simply one more fact about the case, and does not alter what the theory demands. The last-responder case is therefore just an ordinary case in which the agent's action happens to have unusually good consequences.

