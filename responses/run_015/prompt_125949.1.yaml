      *   *Religious/Moral Dogma* $\rightarrow$ *Genre Conventions / Unearned Conflict.*

      *Drafting the Translation:*
      *   Bentham says pleasure is good. In story terms: If a scene generates positive emotional resonance without breaking the internal logic, it has value.
      *   Bentham says disgust isn't a valid reason for punishment. In story terms: Don't create conflict just because the *audience* or *other characters* feel icky about it, unless that ickiness drives tangible plot consequences.
      *   Bentham says law should only stop harm. In story terms: Conflict (plot) should only arise from tangible stakes, not abstract moralizing.

  4.  **Develop the "Residue Report" (The Analysis):**
      *   *What Maps Cleanly:* The idea of economy. Narrative economy demands every scene earn its keep. Bentham demands every law earn its keep. Both hate waste.
      *   *What Distorts:* Bentham treats pain/pleasure as quantifiable. Story treats them as qualitative. "Reader sympathy" isn't math.
      *   *What's Missing:* Bentham ignores *meaning* beyond sensation. Story is often about meaning, sacrifice, and duty (deontology/virtue ethics) which Bentham dismisses.
      *   *The "Gap" Question:* Is it a craft gap or a Bentham flaw? It's likely a Bentham limitation. Story thrives on the *irrational* (tragic flaws, noble sacrifices) which Utilitarianism often pathologizes.

  5.  **Address the Typo:**
