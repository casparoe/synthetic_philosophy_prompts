answer: |-
  Here is the translation of Bentham's sexual ethics into your narrative framework, followed by the residue report on where the philosophy breaks against the craft.

  ### The Translation: Bentham in Story Terms

  **1. The Harm Principle $\rightarrow$ Plot Causality**
  Bentham argues the law should only intervene when an act causes tangible damage to others. In your draft, this translates to **Plot Causality**. Conflict should not arise from the mere *existence* of a character or their private choices, but only from the tangible consequences of their actions on the story world. If a character's private act doesn't break the internal logic of the setting or harm another character's agency, punishing it is "bad plotting"—it's conflict without causality. It's noise, not signal.

  **2. The Critique of "Alarm" and "Disgust" $\rightarrow$ Reader Sympathy & Dramatic Irony**
  Bentham argues that public outrage ("alarm") or visceral revulsion ("disgust") are not valid grounds for punishment because they are subjective reactions, not objective harms.
  In your vocabulary: Do not weaponize **Reader Sympathy** to justify narrative punishment. If you punish a character solely because the *audience* or the *chorus* feels icky, you are relying on cheap **Dramatic Irony**. You are asking the reader to judge a character based on external prejudice rather than internal consistency. Bentham says disgust is "bad accounting"; you would call it "unearned conflict."

  **3. Pleasure as a Moral Good $\rightarrow$ Emotional Bookkeeping**
  Bentham insists physical pleasure is a positive value that must be counted in the sum total of happiness. It is not a sin; it is an asset.
  In your vocabulary: Joy and satisfaction are entries in the **Emotional Bookkeeping**. They are not merely rewards for virtue; they are narrative goods in themselves. If a scene generates genuine connection or pleasure, it adds value to the story's ledger. To ignore that value because of "moral tone" is **Narrative Waste**.

  ***

  ### The Residue Report

  Here is where the translation holds, where it slips, and where it falls off the page.

  **1. What Maps Cleanly: Narrative Economy**
  Bentham's obsession with efficiency maps perfectly onto **Narrative Economy**. Bentham hates laws that cost more pain (enforcement, shame, imprisonment) than they prevent. You hate scenes that cost more reader attention (boredom, confusion, moralizing) than they return in value.
  *   **Verdict:** Your protagonist's "calculator" brain is an excellent engine for editing. If a moral rule doesn't serve the plot or protect a character, cut it. That is sound craft.

  **2. What Has to Be Distorted: Quantification of Feeling**
  Bentham assumes pleasure and pain can be weighed on a single scale. In story, **Reader Sympathy** is not linear. A character can suffer immensely (high pain) and the reader finds it satisfying (high value) because it creates meaning.
  *   **The Distortion:** To make Bentham work in a novel, you have to pretend emotional resonance is math. Your protagonist will do this naturally (which is good characterization), but the *theme* must show where the math fails. You cannot actually balance the ledger.
  *   **Verdict:** Distortion required. Treat the "calculation" as a character flaw, not a narrative truth.

  **3. What Has No Expression: Intent and Virtue**
  Bentham's system has no slot for *duty*, *honor*, or *sacrifice* unless those things produce pleasure. If a character sacrifices themselves for a principle that yields no net happiness, Bentham calls it waste. In fiction, that is often the climax.
  *   **The Missing Piece:** There is no vocabulary in your list for "The Right Thing To Do Despite The Cost." Your list focuses on *effect* (causality, sympathy, economy), not *intent*.
  *   **Verdict:** This is a gap in Bentham, not your craft. Utilitarianism is notoriously thin on *meaning*. It explains how to manage a society, not how to live a life.

  **4. Is the Missing Stuff a Gap in Craft or Philosophy?**
  It shows Bentham's argument is thinner than it looks. He reduces human experience to input/output. Story thrives in the irrational—the tragic flaw, the noble failure, the love that hurts.
  *   **For Your Novel:** This is gold. Your protagonist is a walking utilitarian calculator. The arc of the book should be the moment the calculator breaks. The moment they realize that **Plot Causality** doesn't account for love, or that **Emotional Bookkeeping** can't tally grief.

  ***

  ### Note on the Typo: *"Pain is a bad plot twist"*

  Keep it.

  Philosophically, it's wrong (pain is inevitable). Narratively, it's also wrong (pain drives growth). But for *this character*, it is the perfect line of dialogue. It reveals their pathology: they view suffering not as a human condition, but as a structural error in the script.

  It signals to the reader that your protagonist believes the world *should* run on **Narrative Economy**, and when it doesn't, they view it as a typo rather than reality. That is a compelling delusion to dismantle over 300 pages.
