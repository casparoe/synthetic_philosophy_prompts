  1.  **Analyze the Request:**
      *   **Task:** Restate Jeremy Bentham's core positions on sex and morality (specifically from his unpublished essays) using the user's specific vocabulary (narrative/storytelling terms). Then, provide a "residue report" analyzing the fit between Bentham's philosophy and the user's narrative framework.
      *   **User's Persona/Vocabulary:** A novelist thinking in terms of *plot causality, emotional bookkeeping, reader sympathy, dramatic irony, narrative economy*. They view their protagonist as a "walking utilitarian calculator."
      *   **Subject Matter:** Bentham's unpublished essays on sex (paederasty, homosexuality, etc.), focusing on the harm principle, the critique of "alarm/disgust," and pleasure as a moral good.
      *   **Specific Constraint:** Be honest about the translation. Don't let the typo ("pain is a bad plot twist") distract, but acknowledge it if useful.
      *   **Key Questions to Answer:** What maps cleanly? What distorts? What has no expression? Is the missing stuff a gap in craft or a flaw in Bentham?

  2.  **Deconstruct Bentham's Position (Mental Sandbox):**
      *   *Core:* Utilitarianism (Greatest Happiness Principle).
      *   *Sex:* Consensual sex produces pleasure (good). Unless it causes pain/harm to others (bad), it should be allowed.
      *   *Religion/Disgust:* Religious objections are "fictitious entities." Disgust/Alarm felt by observers is real pain, *but* it's based on prejudice. Punishing the act to soothe the observer's prejudice is bad math (amplifies pain unnecessarily).
      *   *Law:* Should only intervene to prevent tangible harm, not moral offense.

  3.  **Translate to Narrative Vocabulary:**
      *   *Utilitarian Calculus* $\rightarrow$ *Emotional Bookkeeping / Narrative Economy.*
      *   *Pleasure/Pain* $\rightarrow$ *Reader Sympathy / Character Motivation.*
