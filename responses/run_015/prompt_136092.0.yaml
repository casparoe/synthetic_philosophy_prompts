      *   *Requirement:* What does practice strictly require vs fit? Where underdetermined? Adaptive preference formation?
      *   *Drafting:* The practice is philosophically underdetermined regarding the threshold of coerciveness. It strictly requires only formal legal voluntariness, but fits well with a broader notion of political bargaining. Rival theories emerge here: a robust federalist theory would demand fiscal independence to ensure true autonomy, while a nationalist theory would reject the anti-commandeering rule as inefficient obstructionism. The adaptive-preference critique is particularly damning. States may adjust their policy aims to align with available federal funds, internalizing federal preferences as their own. Over time, state legislatures may stop conceiving of policies outside the scope of federal grants, altering their collective will to match the menu of options provided by Congress.

      This suggests that consent is not merely constrained but constructed. If states only desire what they can get funded, their sovereignty is compromised not by force but by preference manipulation. The practice presupposes that state preferences are exogenous to federal offers, yet institutional reality shows they are endogenous. This underdetermination leaves open whether the system protects state sovereignty or merely manages its decline. A strict reading requires only that the state vote yes; a normative reading requires that the yes vote reflect genuine policy preference. The current system ignores this gap. It assumes that because the state *can* say no, the yes is meaningful. But if the state no longer wants what it cannot afford, the sovereignty is hollow. The theory fails to account for how structural power shapes the desires of the subordinate unit, leaving the moral validity of the consent ambiguous.

