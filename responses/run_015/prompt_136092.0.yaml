      *   *Expansion:* The theory assumes that legitimacy flows from the form of the interaction rather than the pressure of the context. If a state legislature votes to accept funds, the action is deemed democratically legitimate because it originates from the state's own deliberative body, regardless of the fiscal duress motivating the vote. This suggests a modal conception of sovereignty where sovereignty is present if the legal power to refuse exists, even if the practical cost of refusal is catastrophic. The commitment is to a formalist separation of powers: the federal government governs individuals directly or through its own agents, while states govern their own citizens, but the two spheres interact through voluntary exchange. Consequently, autonomy is defined negatively as freedom from direct command, not positively as freedom from economic dependency. The system tolerates significant federal influence over state policy so long as the chain of command remains indirect, preserving the illusion of separate spheres while enabling national policy uniformity. This reflects a pragmatic compromise between nationalist efficiency and federalist structure, valuing the symbolic integrity of state institutions over their substantive policy discretion.

