answer: |-
  **Essay Question**

  **Topic:** Epistemic Limits of Causal Inference in Historical Political Economy

  **Prompt:**
  Consider the following constructed micro-case: Two adjacent territories, Alpha and Beta, are divided by a river boundary fixed in 1890 by an external colonial administration. Prior to this line, there was no meaningful economic, linguistic, or ethnic separation; both territories share identical tropical climate, malaria ecology, soil suitability for the same primary crops, and equal access to a shared coastal trade corridor. After the boundary was imposed, Alpha received an institutional framework of registered individual land titles, local contract-enforcement courts, and representative local taxation, while Beta received an extractive framework of communal labor quotas, coerced export-crop production, and absentee bureaucratic administration. By 1970, Alpha's per-capita income was roughly three times Beta's.

  Write an essay assessing whether this divergence can be causally attributed to institutions. Your analysis must not merely assert a conclusion but must wrestle with the epistemic limits of causal inference from non-experimental history. Specifically, you must address the following five analytical obstacles:

  1.  **Endogenous Institutional Selection:** Analyze why the colonial power assigned different regimes and whether that selection correlates with unobserved pre-existing conditions.
  2.  **Hidden Pre-Colonial Heterogeneity:** Evaluate the possibility of unobserved differences in social capital, literacy, or human capital that might have influenced both regime assignment and subsequent development.
  3.  **Post-Independence Contamination:** Address selective migration, capital flight, and cross-river labor mobility that contaminate any comparison of national outcomes.
  4.  **Econometric Identification:** Assess whether synthetic-control or difference-in-differences techniques can salvage identification when treatment assignment is strategic rather than random and the units are geographically and economically interdependent.
  5.  **Epistemic Status:** Argue whether the failure of full causal identification forces complete agnosticism, or whether some combination of mechanistic reasoning and abductive inference can still support institutional explanations without claiming that institutions alone caused the divergence.

  ***

  **Model Answer**

  The Alpha/Beta scenario presents a seductive quasi-experiment. By holding geography and pre-colonial culture constant, the case appears to isolate institutions as the independent variable causing the 1970 income divergence. However, treating this boundary as a natural experiment requires rigorous scrutiny of identification assumptions. While institutional differences offer the most robust explanation available, causal attribution remains epistemically qualified rather than definitive.

  First, one must interrogate endogenous institutional selection. The prompt states the boundary was fixed by an external administration, but it does not specify the criteria for regime assignment. Colonial powers rarely assigned institutional regimes randomly; extractive institutions (Beta) were often imposed where resource extraction was viable or resistance was low, while settler-style institutions (Alpha) were established where colonization was intended to be permanent. If the colonial power selected Alpha for investment because it possessed subtle, unobserved advantages—such as deeper harbors or more compliant local elites—then the institutional regime is endogenous to those advantages. The observed income gap might reflect these initial selection criteria rather than the causal effect of the institutions themselves.

  Second, hidden pre-colonial heterogeneity threatens the "identical pre-conditions" assumption. Even if linguistic and ethnic markers were similar, micro-variations in social capital, pre-existing trade networks, or human capital could have existed prior to 1890. If Alpha possessed slightly higher literacy rates or more robust kinship networks capable of supporting contract enforcement, the colonial administration might have chosen it for the "inclusive" regime precisely because it was more likely to succeed. In this scenario, institutions are not the sole cause but rather a complement to latent human capital. Ignoring this heterogeneity conflates the effect of the institution with the effect of the underlying social substrate that made the institution viable.

  Third, post-independence dynamics introduce contamination through mobility. By 1970, eighty years of divergent incentives would likely trigger selective migration. Ambitious entrepreneurs in Beta might migrate to Alpha to access property rights, while capital might flee Beta due to coercion. Furthermore, cross-river labor mobility could depress wages in Alpha or allow Beta's elites to capture Alpha's growth without developing Beta's domestic capacity. If the population composition changes endogenously in response to the treatment, the comparison of per-capita income no longer reflects the productivity of the original populations under different rules, but rather the sorting of human capital. This violates the stable unit treatment value assumption (SUTVA) required for clean causal inference.

  Fourth, standard econometric remedies like difference-in-differences (DiD) or synthetic control methods struggle here. DiD relies on parallel trends assumptions; however, if treatment assignment was strategic, the pre-treatment trends may not have been parallel regarding potential outcomes. Synthetic control methods require a donor pool of untreated units, but Alpha and Beta are geographically and economically interdependent. Beta's stagnation may be partly caused by Alpha's success (e.g., via brain drain), meaning the units are not independent. When treatment is non-random and spillovers exist, statistical controls cannot fully recover the counterfactual. The econometrician can describe the correlation precisely but cannot mathematically eliminate the selection bias without an exogenous shock that is absent in this narrative.

  Finally, does this identification failure force complete agnosticism? No. While we cannot claim institutions *alone* caused the divergence with experimental certainty, we can employ abductive inference. We ask: which explanation best accounts for the magnitude and timing of the divergence given the mechanisms at play? The mechanistic link between property rights and investment is theoretically sound, whereas geographic and cultural variables are held constant by the case design. Therefore, while we must acknowledge that unobserved confounders *might* exist, the institutional explanation remains the "best available" account. We should assert that institutions are a necessary component of the causal story, if not the sole sufficient cause. To demand experimental identification in history is to demand agnosticism on all historical questions; instead, we must accept probabilistic causal claims supported by mechanistic plausibility and the elimination of rival geographic/cultural hypotheses.

  In conclusion, the Alpha/Beta case supports an institutional explanation, but only if we qualify the claim. The divergence is likely caused by institutions interacting with latent conditions, mediated by migration, and identified through abductive reasoning rather than statistical certainty.

  ***

  **Marking Scheme**

  **Total Points:** 25
  **Format:** 5 Analytical Moves × 5 Points Each

  | **Analytical Move** | **Criteria for Full Credit (5 pts)** | **Typical Failure Mode** |
  | :--- | :--- | :--- |
  | **1. Endogenous Selection** | Explicitly questions *why* the colonial power assigned specific regimes and links assignment to potential unobserved advantages (e.g., resource viability). | Treating the river boundary as an exogenous random assignment without discussing selection into treatment. |
  | **2. Hidden Heterogeneity** | Identifies that "identical" pre-conditions may mask micro-differences in social capital or human capital that drove both regime choice and growth. | Conflating correlation with causation by citing income divergence alone as proof of institutional efficacy. |
  | **3. Mobility & Contamination** | Analyzes how migration, capital flight, or labor spillovers alter the population composition and violate independence between units. | Ignoring post-boundary migration and interaction effects between the two territories. |
  | **4. Econometric Limits** | Explains why DiD or Synthetic Control fails when treatment is strategic or units are interdependent (violating parallel trends/SUTVA). | Applying econometric jargon without explaining why independence and random-assignment assumptions fail here. |
  | **5. Epistemic Stance** | Argues for abductive inference/mechanistic reasoning as sufficient for "best explanation" without claiming experimental certainty or total skepticism. | Concluding either with unqualified institutional determinism or with total skepticism that refuses any inferential purchase. |
