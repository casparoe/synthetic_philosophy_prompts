      *   *Camp 2 (Self-Referential/Void):* The announcement is a liar-like paradox. It cannot be known.
      *   *Camp 3 (Straightforward/Induction Fails):* The exam happens, the student was wrong, logic doesn't apply to future contingents in this way.
      *   *User's View:* Camp 1 & 2 are fighting over the Epistemic Question. The Mechanism Question is settled (Finite = Impossible, Infinite = Possible).
      *   *Verdict:* This is a strong position. Many philosophers (e.g., Timothy Williamson, Roy Sorensen) have moved towards viewing SEP as a problem of *common knowledge* and *self-reference*. The user's probabilistic framing clarifies the "finite vs. infinite" distinction which is often obscured in the deterministic telling.

