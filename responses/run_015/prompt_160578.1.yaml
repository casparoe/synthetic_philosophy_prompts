answer: |-
  You have identified precisely the central problem in the philosophy of statistical mechanics and the arrow of time. The posit you describe is not nameless, though its status remains one of the most contentious issues in contemporary philosophy of physics.

  The standard name for this posit, particularly when applied to the universe as a whole, is **the Past Hypothesis**.

  The term was crystallized by the philosopher of physics David Albert in his 2000 book *Time and Chance*, though the conceptual lineage runs back through Roger Penrose (the Weyl Curvature Hypothesis) and Hans Reichenbach (Branch Systems) to Ludwig Boltzmann.

  Here is how the Past Hypothesis is carved off from the three categories you mention, and how it fares under the two accounts of laws you have encountered.

  ### 1. Carving off the Distinctions

  **Vs. Ordinary Laws**
  An ordinary law (on most accounts) is universal in time and space. The Past Hypothesis (PH) is singular and indexical: it applies to *one* boundary (the past) of *one* system (the universe, or effectively isolated subsystems).
  *   **The Distinction:** Laws are typically taken to be *immanent* (holding at every moment), whereas the PH is *transcendent* (a constraint on the totality of history from one end).
  *   **The Nuance:** Despite this, the PH supports counterfactuals exactly as laws do. If you ask, "What would happen if I dropped this cup?", the answer relies on the PH (that the immediate past was low-entropy/un-correlated). If the PH were false, the cup might spontaneously assemble. Thus, it has **nomic force** without having **nomic form**.

  **Vs. Specific Initial Conditions**
  You correctly note that nobody calls the exact positions and velocities of molecules a "law." That is a *microstate*.
  *   **The Distinction:** The PH is not a specification of the microstate. It is a constraint on the **macrostate**. It posits that the universe began in a region of phase space of extremely small volume (low entropy), but it does not specify *which* point in that region.
  *   **Why it matters:** A specific microstate is "too expensive" to posit; it contains infinite information. The PH is "cheap"; it is a coarse-grained constraint. This is why we do not count it as a theoretical cost in the same way we would count adding a new particle or force. It simplifies the description of the world's history rather than complicating it.

  **Vs. Ceteris Paribus Hedges**
  A hedge (e.g., "all else being equal") protects a generalization from falsification by excluding interfering factors.
  *   **The Distinction:** The PH is not a defensive clause; it is a **generative premise**. Without it, the dynamical equations yield *no* asymmetric prediction at all, not even a probabilistic one. A hedge says, "The law holds unless X interferes." The PH says, "The law yields prediction Y only *if* X is posited." It is a necessary condition for the application of the theory, not a shield for the theory's failure.

  ### 2. The Accounts of Laws

  Your intuition that this posit creates trouble for standard accounts of laws is shared by experts in the field.

  **The Humean (Best System) Account**
  On the Humean view (Lewis, Best System Analysis), laws are the axioms of the system that best balances simplicity and strength in describing the world's history.
  *   **Fit:** The PH fits surprisingly well here. David Albert argues that including the Past Hypothesis in the "Best System" makes the description of the universe vastly more economical. Without it, you would have to list every entropy-increasing event as a separate regularity. With it, they all follow from one boundary constraint + dynamics.
  *   **Your Worry:** You asked what rules out a one-off boundary stipulation. For the Humean, *nothing* rules it out, provided it earns its keep in the system's economy. Your confusion ("I cannot see what rules it out") suggests you have grasped the Humean view correctly: on this view, the PH *is* a law, or at least a "lawbook" component, precisely because it is a one-off stipulation that buys explanatory power.

  **The Governing (Non-Humean) Account**
  On this view, laws govern or produce the events.
  *   **Fit:** This view struggles with the PH. As you noted, it is difficult to see how a fact about a single boundary "governs" the interior. A governor usually acts continuously.
  *   **The Fix:** Proponents of this view (like Tim Maudlin) have had to propose a new category: **Boundary Laws**. Maudlin argues in *The Metaphysics Within Physics* that we must abandon the idea that laws must be differential equations valid at all times. He suggests that a law can be a constraint on the boundary of spacetime. If you prefer the Governing account, you are forced to expand the definition of "governance" to include "constraining the initial state."

  ### 3. The Asymmetry Puzzle

  You noted the final puzzle: *The posit is always made at the same end of the time coordinate, and I cannot find anything in the equations that singles out an end.*

  This is the domain of the Australian philosopher **Huw Price**. In *Time's Arrow and Archimedes' Point*, he argues that physicists (including Boltzmann and Reichenbach) routinely employ a "double standard." They impose uncorrelatedness on the past (the PH) but assume correlations on the future (independence from future measurement settings, etc.), despite the time-symmetry of the dynamics.

  Price argues that if you take the time-symmetry of the equations seriously, you must either:
  1.  Accept that the PH is a brute, unexplained fact (the "Block Universe" view).
  2.  Accept that a similar constraint applies to the future (which leads to retrocausality, a view Price favors in the quantum context).
  3.  Admit that the asymmetry is not in the world, but in our epistemic access to it (an epistemic view of the arrow of time).

  ### Summary and Recommendation

  The word you are looking for is **the Past Hypothesis**.

  It is a **macroscopic boundary constraint** that functions **nomically** but is **contingent** and **time-indexical**.

  *   If you are a Humean, it is a law (because it simplifies the Best System).
  *   If you are a Non-Humean, it is a Boundary Law (requiring an expansion of what "law" means).
  *   If you follow Huw Price, it is an unjustified double-standard unless grounded in a deeper theory of initial conditions.

  **Suggested Reading for your Retirement:**
  1.  **David Albert, *Time and Chance*:** This is the definitive philosophical treatment of exactly the problem you described. He calls the combination of Dynamics + PH + Statistical Postulate "The Mentaculus."
  2.  **Huw Price, *Time's Arrow and Archimedes' Point*:** For the critique of why we posit this only at the past end.
  3.  **Hans Reichenbach, *The Direction of Time*:** The classic source for the "branch system" argument (applying the posit to subsystems rather than the whole universe).
  4.  **Tim Maudlin, *The Metaphysics Within Physics*:** Specifically the chapter on laws and boundary conditions, for the Non-Humean perspective.

  You have spent your career using the Mentaculus without knowing it had a name. You are in good company; most physicists use it daily without reflecting on its ontological status.
