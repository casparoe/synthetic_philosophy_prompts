answer: |-
  1. Rousseau argues in the *Letter to d'Alembert* that professional theater corrupts morality by replacing active civic duty with passive spectatorship and artificial emotions.
  2. However, his broader moral psychology acknowledges that amour-propre drives humans to seek recognition through the very comparative self-presentation that theater institutionalizes.
  3. Rather than undermining his critique, this tension reveals that Rousseauian virtue does not abolish performance but seeks to transform alienated representation into communal transparency.
  4. His advocacy for civic festivals demonstrates that the desire for visibility can be redirected so that citizens become both spectators and actors in a unified public sphere.
  5. Therefore, his concept of virtue survives closer scrutiny because it successfully rechannels theatrical dynamics into authentic political participation rather than denying the social need for recognition.
