          *   Interpretive: If they are synchronized, is it one computation with redundancy?
      *   *Idea 2: Error Correction/Redundancy.* Triple Modular Redundancy (TMR). Three processors vote on output.
          *   Intrinsic: Three physical processes doing the same thing. If one process = one mind, then three processes = three minds.
          *   Interpretive: The *function* is one. The mapping from physics to logic treats the three voters as a single logical unit to maximize simplicity/predictive power.
      *   *Idea 3: Time-Multiplexing.* One core running three threads rapidly switched.
          *   Intrinsic: One physical substrate, three causal streams? Harder to argue inflation here.
      *   *Idea 4: Analog vs. Digital.* Too messy.
      *   *Selection:* **Triple Modular Redundancy (TMR) with Synchronized Clocks.** This is standard engineering. Three identical CPUs, same input, voting on output.
      *   *Refinement for Inflation:* To make the Intrinsic view inflationary, we need the physical causal streams to be distinct enough to count as separate "subjects" in that view, even if they are identical.
      *   *Refinement for Deflation:* The Interpretive view needs to say "This is just one computation implemented robustly." The mapping constraint is "naturalness" or "causal independence." If they are perfectly locked, they might be read as one.
      *   *Wait, specification 3 says Intrinsic must be inflationary.* So Intrinsic says "3 minds." Interpretive says "1 mind."
      *   *Specification 5 says Practical Difference.* Action: Decouple the clocks slightly.
