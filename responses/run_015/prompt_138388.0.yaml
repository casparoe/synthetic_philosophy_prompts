          3.  "What-it-is-actually-doing" (Intrinsic) must be *inflationary* (count more weight).
          4.  "Relative-to-a-reading" (Interpretive) must be *deflationary* (count less weight) based on constraints, not arbitrary choice.
          5.  Practical difference: An action (add/delete/perturb/share) ranked differently by the two pictures.
          6.  Nearby variant where they agree (to show the gap isn't universal).
      *   **Output Format:** Scenario (1 paragraph); Picture 1 analysis; Picture 2 analysis; The Crucial Feature & Variant; Best Reply & Cost; Honest Note on Stipulations.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Intrinsic (What-it-is-actually-doing):* Moral weight supervenes on physical causal dynamics. If the physics looks like $N$ copies of a mind, there are $N$ minds. Redundancy counts. Parallel processing counts.
      *   *Interpretive (Relative-to-a-reading):* Computation is observer-relative. A physical system implements a computation only under a mapping. Constraints (simplicity, non-gerrymandering) limit valid mappings. If the physics is highly redundant or shared, the "best" reading might see it as *one* computation implemented robustly, not *many* computations implemented separately.

  3.  **Brainstorming the Setup:**
