      *   *Scenario:* A "Triplicated Control Unit" (TCU). Three identical microcontrollers. Same clock signal. Same input. Hardware voter on output. Running a "hedonic" control loop (stipulated to be the moral architecture).
      *   *Intrinsic:* Three distinct silicon paths. Electrons flow in three places. Each path sustains the causal structure. 3 subjects.
      *   *Interpretive:* Computation is defined by counterfactual support. Because they are hard-locked, they cannot diverge. They form a single logical state machine implemented physically three times. The "reading" that sees 3 computations is gerrymandered because it ignores the causal locking that makes them one functional unit. 1 subject.
      *   *Feature:* **Hard Lock-Step Synchronization.**
