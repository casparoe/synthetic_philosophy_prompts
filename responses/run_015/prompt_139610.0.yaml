  ### Part 2: Application to the Asymmetric-Fatigue Case

  We now apply this reconstruction to your constructed case involving Alphas and Betas.

  **1. Does the passage's claim apply to the Asymmetric-Fatigue case?**
  **Yes.** The passage's claim is that *if* capacities differ, there is *no presumption* that equality is optimal.
  *   **In the Case:** Alphas have "twice the hedonic capacity" of Betas regarding direct circumstances (2n pleasure vs. n pleasure).
  *   **In the Passage:** A difference in capacity removes the presumption of equality.
  *   **Conclusion:** Since the case stipulates a difference in capacity (a differential multiplier on hedonic output), the passage's logic dictates that there is no presumption that giving Alphas and Betas equal circumstances will maximize the sum-total of pleasure.

  *Note on Divergence:* The passage defines high capacity as yielding "less pain (e.g. of fatigue)." Your case defines Alphas as suffering *more* pain (2n pain vs. n pain) from direct circumstances. However, the core logic of the passage relies on the **net hedonic yield**. As long as the Alpha's net yield (Pleasure minus Pain) per unit of circumstance differs from the Beta's, the structural argument holds. In your case, assuming the pleasure outweighs the pain, the Alpha's net direct yield is still double the Beta's. Thus, the condition of "differing Capacity" is satisfied.

  **2. What interpersonal comparison of utility is required?**
  To decide between equal and unequal circumstances, the passage requires a comparison of the **Net Hedonic Yield per unit of circumstance** for each class.
  *   **Passage Requirement:** We must compare how much "pleasure... and less pain" one class experiences compared to another "under similar circumstances."
  *   **Case Application:** We must compare the Alpha's Net Utility ($2 \times \text{Pleasure} - 2 \times \text{Pain} - \text{Sympathetic Pain}$) against the Beta's Net Utility ($\text{Pleasure} - \text{Pain}$).
  *   **Specific Comparison:** The distributor must calculate whether the gain in total utility from giving a unit to an Alpha (due to the 2x multiplier) outweighs the loss in total utility from giving a unit to a Beta, while accounting for the "sympathetic fatigue" externality (where Beta's pleasure causes Alpha's pain).

  **3. Is the comparison determinate or indeterminate?**
  The Asymmetric-Fatigue case shows the comparison to be **determinate**.
  *   **Reasoning:** The passage implies that without knowledge of capacity differences, one might presume equality. However, if capacity differences are known, the presumption is removed.
  *   **In the Case:** You have stipulated precise numerical relationships ("n units," "2n units," "0.1 units"). There is no ambiguity or lack of data regarding the "Capacity for happiness."
  *   **Result:** Because the hedonic functions are explicitly defined, a distributor can mathematically determine which arrangement (equal or unequal) produces the greater sum. The passage's claim applies not because the comparison is impossible, but because the *result* of the comparison likely favors inequality. The case does not show the comparison to be indeterminate; rather, it provides the exact data needed to reject the presumption of equality.

  **Summary of Application:**
  The passage argues that differential capacity breaks the link between "equal circumstances" and "maximum happiness." In the Asymmetric-Fatigue case, Alphas and Betas have differential capacities (2x multiplier). Therefore, consistent with the passage, there is **no presumption** that equality is the most felicific arrangement. The required interpersonal comparison (Net Hedonic Yield) is **determinate** based on the stipulated units, allowing a distributor to calculate that unequal circumstances (likely favoring Alphas to maximize direct yield and minimize sympathetic pain) would produce a higher sum-total of pleasure.
