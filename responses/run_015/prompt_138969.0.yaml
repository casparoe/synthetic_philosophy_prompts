answer: |-
  Here is the conceptual map you asked for, followed by my committed interpretation and verdict.

  ### Part 1: The Menu of Claims
  The slogan "All art is propaganda" is a container for at least five distinct claims. Your friend at the meeting slid between them to win the argument. Here they are, ranked from trivial to radical, with a verdict on their viability.

  **1. The Communicative Claim (Trivial)**
  *   **Claim:** Every artwork communicates *something* (a mood, a view, a perspective) and therefore alters the audience's state of mind.
  *   **Verdict:** **Trivial.** True, but useless. If a landscape painting implies "nature is serene," calling that "propaganda" stretches the word until it snaps. It doesn't help us distinguish a union play from a still life.

  **2. The Sociological Claim (Substantive/Defensible)**
  *   **Claim:** Art is produced within economic and power structures. Even "neutral" art reinforces the status quo by omission. Therefore, there is no "apolitical" art; there is only art that challenges power and art that tacitly supports it.
  *   **Verdict:** **Defensible.** This is the strongest descriptive claim. It denies the possibility of a vacuum. However, it doesn't prove all art is *intentionally* persuasive, only that it has political *effects*.

  **3. The Intentional Claim (False/Implausible)**
  *   **Claim:** Every artist creates with the primary function of persuading the audience to a specific course of action or belief.
  *   **Verdict:** **False.** Much art is exploratory, expressive, or formalist. To say a abstract expressionist painting is trying to "persuade" you of a policy is to misunderstand the genre.

  **4. The Evaluative Claim (Controversial)**
  *   **Claim:** The artistic value of a work is constituted by its success as propaganda. A work is "good art" *because* it effectively advances a cause.
  *   **Verdict:** **Implausible.** This collapses aesthetics into politics. History is full of effective propaganda that is terrible art (and beautiful art that is politically useless). Most critics reject this because it destroys the category of "art."

  **5. The Normative Claim (Radical/Contextual)**
  *   **Claim:** Artists *ought* to make their work serve a political cause, specifically the liberation of their people. To do otherwise is irresponsible or complicit.
  *   **Verdict:** **Defensible as a moral stance,** but not a definition of art. This is a command, not a description.

  **Which claim does the argumentative work?**
  To defend your friend's play against the criticism "this is preachy propaganda," the person at the meeting needs **Claim 2 (Sociological)** combined with **Claim 5 (Normative)**.
  *   *The Move:* They use Claim 2 to say "You can't criticize us for having politics, because everything has politics." Then they use Claim 5 to say "And ours is the *right* politics."
  *   *The Fallacy:* The critic wasn't complaining that the play *had* politics (Claim 2); they were complaining that the *method* was didactic and aesthetically clumsy (a failure of execution). The defender used the inevitability of propaganda (Claim 2) to shield the work from critique of its quality. That is the motte-and-bailey you sensed.

  ***

  ### Part 2: My Committed Interpretation of Du Bois
  You want me to take a position on what Du Bois meant in "Criteria of Negro Art" (1926) without hedging. Here it is.

  Du Bois is **not** making a metaphysical claim about the ontology of art (Claim 1 or 3). He is not saying that a flower arrangement or a sonata is inherently a political pamphlet.

  He is making a **historical and situated argument** that combines the **Sociological Claim** with the **Normative Claim**.
  1.  **Historical Reality:** He argues that white art has *always* been propaganda for white supremacy, even when it claimed to be "pure." It normalized whiteness as the standard of beauty.
  2.  **Situated Duty:** Therefore, Black artists cannot afford the luxury of "art for art's sake." In a racialized world, Black art *must* consciously function as propaganda for racial uplift and truth-telling to counter the dominant narrative.

  Du Bois is arguing that for a marginalized people, the separation of art and politics is a lie told by the oppressor. He is demanding that Black artists *own* the propagandistic function that white artists already exercise but deny.

  **Crucially:** Du Bois explicitly argues that for propaganda to work, it **must be art**. He writes that he cares nothing for art that is not beautiful. He believes that if the work is not aesthetically compelling, it fails as propaganda because no one will look at it. He holds two things in tension: the work *must* serve the cause, but it *must* also succeed as beauty.

  ***

  ### Part 3: The Verdict
  **Question:** On this reading, does the line "All art is propaganda" actually license the claim that your friend's deliberately didactic union-organizing play is *no worse off as art* for being propaganda?

  **Answer: No.**

  **Reasons:**
  1.  **The Label vs. The Quality:** Du Bois's slogan validates the *intent* of the play (it is right to organize), but it does not validate the *execution*. The critic called it "preachy." Preachiness is an aesthetic and rhetorical failure. It means the persuasion is clumsy. Du Bois would agree that clumsy persuasion is bad propaganda. If the audience tunes out because the art is bad, the political goal fails. Therefore, the play *is* worse off if it is merely preachy.
  2.  **The Requirement of Beauty:** Du Bois explicitly insists that propaganda must be beautiful to be effective. By using the slogan to shut down aesthetic criticism ("it's propaganda, so you can't critique the art"), your friend violated the Du Boisian requirement that the propaganda *must be art*. If the play sacrifices artistic subtlety for a message, it fails Du Bois's criteria, not just the critic's.
  3.  **The Equivocation:** The defender used Du Bois to say "Propaganda is inevitable, so criticism is invalid." But Du Bois meant "Propaganda is inevitable, so we must do it *well*." The slogan licenses the *project*, not the *product*.

  Your friend's play might be morally correct (Normative Claim), and it might be politically situated (Sociological Claim). But the slogan does not grant it immunity from aesthetic critique. In fact, on a Du Boisian reading, aesthetic critique is *necessary* to ensure the propaganda works.

  ***

  ### Part 4: Confidence and Falsification
  **Confidence Level:** **85%**

  I am highly confident in this reading because the "Criteria of Negro Art" is a canonical text in the debate between Du Bois and Alain Locke. Locke argued for aesthetic autonomy (art should just be beautiful); Du Bois argued for utility (art must fight). However, scholars consistently note that Du Bois did not surrender aesthetics entirely; he demanded a synthesis. He was attacking the *pretense* of neutrality, not the *standards* of craft.

  **What Would Change My Mind:**
  1.  **Textual Evidence of Anti-Aestheticism:** If Du Bois had explicitly written in that essay that "truth is more important than beauty" or that "artists should sacrifice form for the sake of the message," my verdict would flip to **Yes**. If he prioritized the message *over* the medium, then "preachiness" would be a virtue, not a flaw. (My internal knowledge suggests he did not do this; he argued truth and beauty are linked).
  2.  **Definition of Propaganda:** If Du Bois defined "propaganda" in that essay simply as "any communication" (Claim 1), then the term loses its critical bite entirely. If "propaganda" just means "speaking," then calling the play "propaganda" is empty, and the defender's point collapses into nonsense. But Du Bois clearly means "political advocacy."
  3.  **Context of the Quote:** If the line "All art is propaganda" was a passing rhetorical flourish in a speech rather than a core thesis of the essay, it might carry less philosophical weight. However, it is the central thesis of "Criteria," so I treat it as his settled position.

  **Summary for your group:**
  Tell your friend that Du Bois is on their side regarding the *goal* (unionizing is a valid subject for art), but Du Bois is on the *critic's* side regarding the *method*. Du Bois would tell your friend: "You are right to make propaganda, but if it is preachy, it is bad propaganda. Make it beautiful so they cannot look away." The slogan protects the mission, not the mistakes.
