answer: |-
  ### 1. Rules in play

  **Rule A: The Epistemic Authority Principle.** Preferences are authoritative only if formed without coercion and with accurate self-knowledge. Intervention is permitted to remove structural barriers (Case 4) or correct verified false beliefs about aptitude (Case 3), but forbidden if the origin of the preference is ambiguous (Case 5). *Hardest case:* Case 2, where large differences are accepted despite potential unmeasured cultural drift; M. assumes "egalitarian" implies "epistemically clean."

  **Rule B: The Symmetric Constraint Principle.** Intervention is justified only when constraints are asymmetrically distributed by gender (e.g., leave usable only by mothers in Case 4). If constraints are symmetric or removed (Case 2, Case 1 sorting), outcomes are accepted. Ambiguity about constraint symmetry leads to abstention (Case 5). *Hardest case:* Case 3, where stereotypes are treated as asymmetric barriers despite being cultural rather than legal; M. classifies false aptitude beliefs as a constraint asymmetry.

  **Rule C: The Input-Only Constraint.** Never target aggregate distributions (shares); target only individual inputs (barriers, information, retention). This fits all five rulings but offers less guidance on *which* inputs to target. *Hardest case:* Case 5, where an input intervention worked but was rejected; this implies a sub-rule about *verifying* the input's neutrality.

  ### 2. What each rule predicts here

  **Rule A (Epistemic Authority)** focuses on Finding (ii). G2 girls have high attainment but low self-concept; this is a verified false belief (Case 3). The remedy is to correct the self-concept, likely via the mechanism in (iii) (maternal role models providing accurate information). Finding (iv) shows that removing financial risk reveals a preference for non-things fields; since the constraint was symmetric (tuition abolished for all), this preference is authoritative. **Verdict:** Fund role-model programs (iii); accept the reform outcome (iv); do not target shares.

  **Rule B (Symmetric Constraint)** focuses on Finding (iv). The reform removed a financial barrier; the resulting drop in female participation reveals true preference under symmetric safety. Finding (ii) (self-concept) is cultural, not structural, and thus outside scope unless proven to be a coercive barrier. However, (iii) suggests the mother's occupation acts as a structural signal. **Verdict:** Accept (iv) as legitimate sorting. Intervene on (iii) only if maternal occupation is deemed a structural constraint (unlikely); otherwise, abstain on G2 self-concept as "culture."

  **Discriminating Work:** Finding (ii) is the load-bearing fact. Rule A treats low self-concept despite high ability as a *distortion* requiring correction (Case 3). Rule B treats it as *sorting* unless linked to a policy barrier (Case 2). Finding (iv) confirms for both that financial risk was a barrier, but they diverge on whether the self-concept gap is a barrier or a preference. M.'s history (Case 3) commits her to Rule A: she treats false aptitude beliefs as injuries.

  ### 3. My best guess

  M. is running **Rule A (Epistemic Authority)** with a strict **Verification Constraint** derived from Case 5. She distinguishes between preferences revealed under safety (Case 2, Finding iv) and preferences formed under epistemic contamination (Case 3, Finding ii). Her track record is coherent, not gerrymandered: she consistently targets *procedural defects* in preference formation (coercion, false beliefs) while refusing to target *outcomes* unless the defect is verified. Case 5 abstention confirms she requires proof that an intervention removes a distortion rather than imposing one.

  **Prediction:** She will endorse interventions targeting G2 self-concept via maternal role models (Finding iii) as correcting a false belief. She will accept the drop in female majors post-reform (Finding iv) as legitimate preference revelation. She will oppose quotas or aggregate targets.

  **Confidence:** 80%. The main risk is that she views the G2 self-concept gap as cultural assimilation (Rule B) rather than epistemic error. However, Case 3 strongly commits her to treating stereotype-driven self-concept as a valid target.

  ### 4. The study that would settle it

  Commission a randomized controlled trial in Country A targeting G2 girls with high math attainment but low self-concept. **Arm 1:** Accurate aptitude feedback (standardized test results with contextual normalization). **Arm 2:** Maternal role-model exposure (as per Finding iii). **Arm 3:** Control.

  **Rule A Prediction:** Arm 1 and Arm 2 both increase things-oriented major selection relative to control, proving the preference was suppressed by epistemic error. **Rule B Prediction:** Arm 1 has no effect (preferences are real); Arm 2 has no effect (culture is not a constraint). If only Arm 2 works, it suggests social signaling matters more than aptitude accuracy, complicating M.'s epistemic rule.

  **Timeline:** 3 years for intervention, 5 years for tertiary enrollment data. Total 8 years. This separates "false belief" from "true preference" without relying on cross-country correlations.

  ### 5. What's settled, what's contested

  **Settled:** The original STEM paradox (Case 1) is empirically fragile; later corrections (e.g., Richardson & Webster 2021) show the effect diminishes or vanishes with better controls. The personality paradox (Case 2) is robust across datasets (Falk et al.), though interpretation varies. Parental leave asymmetry (Case 4) reliably impacts female retention (e.g., Nordic data).

  **Contested:** The mechanism of the STEM paradox (preference vs. stereotype) is highly contested. Finding (ii) (self-concept mismatch) is plausible but load-bearing; if G2 self-concept tracks actual difficulty rather than stereotype, M.'s Rule A collapses. Finding (iv) (risk removal reducing female participation) is counter-intuitive and requires replication; standard economics predicts risk removal increases participation for risk-averse groups.

  **Load-Bearing Stipulations:** Your reconstruction of Case 1 (artifact-prone) and Case 3 (stereotype mechanism) aligns with the critical literature. If Case 3's mechanism is disputed (i.e., stereotypes don't actually drive the gap), M.'s distinction between Case 2 and Case 3 fails. I am extrapolating M.'s "abstention" in Case 5 as a principled epistemic constraint; it could alternatively be risk aversion.
