      *   *Good/Bayesian Solution:* Context matters. Background knowledge ($K$) determines confirmation.
      *   *Quine/Scheffler:* "Projectible" predicates. "Raven" and "Black" are natural kinds; "Non-black" and "Non-raven" are not.
      *   *Sampling/Methodology:* How the evidence was gathered matters (targeted vs. random).

