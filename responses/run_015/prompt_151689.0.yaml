      *   *Intuition 1 & 8 (Diminishing returns/Accumulation):* Bayesianism handles this. Prior probability + Likelihood ratio. If $P(H)$ is already high, new evidence adds little. If the class of non-black things is infinite/huge, one shoe adds $\approx 0$ information.
      *   *Intuition 2 & 3 (Shoe vs. Apple):* Why does a shoe feel different from an apple? Both are $\neg B \land \neg R$.
