          *   *The Accumulation Problem:* Explain via **Diminishing Returns (Bayesian)**. The prior probability of "non-black raven" is low, but the likelihood ratio of a shoe is so close to 1 that you need infinite shoes to move the needle.
      *   **The Hard Truth:** Which intuition to drop?
