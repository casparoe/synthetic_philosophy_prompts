      *   *Targeted Search:* Friend looked for "non-black". Reference class = "non-black things". Counter-example (non-black raven) is possible, BUT the method guarantees finding non-black things. The test isn't severe regarding the *existence* of non-black things, only regarding their raven-status. Actually, if he looked for non-black things, finding a non-raven is guaranteed if most non-black things are non-ravens.
