      *   *Wait, the standard Bayesian solution (Good):* It depends on what you know about the world. If you know there are millions of shoes and few ravens, finding a shoe tells you almost nothing about ravens.
      *   *The "Sampling" Solution (Watkins/Popper):* Evidence only confirms if it arises from a **severe test**. A severe test is one that had a high probability of detecting an error if the hypothesis were false.

      *Let's try the **Severity Principle** (Mayo/Popper) combined with **Reference Classes**.*
      Principle: **An observation confirms a hypothesis only to the extent that it was drawn from a reference class where a counter-example could plausibly have been found.**

      *   *Black Raven:* Drawn from "birds" or "things in park". Counter-example (non-black raven) was possible. Confirms.
