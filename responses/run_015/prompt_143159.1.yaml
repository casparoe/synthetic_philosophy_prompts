answer: |-
  # PART I: DESIGN WORK

  ### 1. Dependency Relations & Conceptual Architecture

  **The Core Dependency Chain:**
  1.  **Strategy Space Transformation:** Students must accept that the *move* is no longer $C$ or $D$, but "Submit Program $P$." (Prerequisite: Understanding of a function mapping inputs to outputs).
  2.  **Transparency/Commitment:** Programs must be readable by opponents *before* execution. (Prerequisite: Distinguishing this from hidden moves or cheap talk).
  3.  **Evaluation Mechanism:** How do two programs produce an outcome? (Prerequisite: Resolving the "infinite loop" worry).
  4.  **Equilibrium Definition:** A pair of programs $(P_1, P_2)$ is an equilibrium if neither player can submit a different program $P'_1$ to get a higher payoff against $P_2$. (Prerequisite: Standard Nash definition).
  5.  **Agency Attribution:** The player chooses the program; the program executes the choice. (Prerequisite: Breaking the "Delegate" misconception).

  **Genuine vs. Apparent Dependencies:**
  *   *Genuine:* You cannot define Program Equilibrium (PE) before defining how programs interact (Dependency 3). If you define PE first, they will assume programs just play Nash.
  *   *Genuine:* You cannot resolve the "Delegate" misconception (Dependency 5) before discussing the equilibrium. If they think the program is the agent, they will treat the interaction as a multi-agent system, not a strategic commitment.
  *   *Apparent:* It feels like you need to explain *how* the code runs (simulation) before explaining *why* it matters (equilibrium). Actually, you can stipulate the mechanism ("The referee runs them") to save time, provided you address the halting worry.
  *   *Apparent:* It feels like you need Provability Logic to solve the circularity worry. You do not; you need only the *concept* of a fixed point, which can be motivated without the theorem.

  **Prior Knowledge Inventory:**
  *   **CS Students:** Have `Halting Problem` (know simulation can fail), `Incompleteness` (know proofs have limits). *Missing:* `Provability Logic`, `Quining`.
  *   **Philosophy Students:** Have `PD`, `Nash`, `Dominance`. *Missing:* `Computability`, `Source Code as Strategy`.
  *   **Shared:** No `Program Equilibrium`. Both prone to `Anthropomorphizing Code` (Housing Lottery effect).

  **Pedagogical Judgment Calls:**
  1.  **The Provability Question:** I will advise **excluding** the formal Löbian construction. It requires too much setup for a 5-minute segment and risks alienating the Philosophy students while boring the CS students (who know it's not standard logic). *Replacement:* Use a "Simulation with Timeout" stipulation, explicitly flagging the timeout as an arbitrary parameter that the Provability variant solves (hooking the CS interest) without deriving it.
  2.  **The "Delegate" Break:** I will place the intervention on the Housing Lottery misconception **before** the first example. If I wait until after, the "Agent" frame will have already solidified.
  3.  **The Agency Question:** I will place the "Who chooses?" question at the **end**, as the bridge to the philosophical implications. If placed earlier, it distracts from the mechanics of the equilibrium.

  ---

  # PART II: THE SESSION PLAN (75 Minutes)

  ### 1. The Order (Sequence of Moves)

  **00:00 – 00:10: The Frame & The Break (Housing Misconception)**
  *   **Move:** Open with the Housing Lottery agents. Ask: "Did the agent play for you, or was it you playing *through* the agent?"
  *   **Constraint:** Force the distinction: The agent is not a new player; it is a *commitment device* chosen by the original player.
  *   **Board:** Draw `Player -> [Program] -> Action`. Draw an X over `Player -> [Agent with own aims]`.
  *   **Why here:** If you don't break the "Delegate" frame now, they will treat Program Equilibrium as Multi-Agent AI safety, not Game Theory.

  **00:10 – 00:25: The Mechanism (Source-Code Tournament)**
  *   **Move:** Define the game. Two players. Simultaneous submission of *source code* to a Referee. Referee runs code; code outputs $C$ or $D$. Payoffs assigned.
  *   **Crucial Detail:** Code can read the *opponent's source code* as input.
  *   **Why here:** Establishes the expanded strategy space (Dependency 1 & 2).
  *   **Hook for Future:** Mention briefly: "We are assuming the Referee is trusted and the channel is secure. Later in the term, we will ask what happens if programs can sign contracts with each other *before* submitting." (Installs coalitional hook).

  **00:25 – 00:40: The Carrying Example (The "Matching" Program)**
  *   **Move:** Introduce Program $M$: "I will output whatever $M$'s opponent outputs when run against $M$." (Simplified simulation).
  *   **Problem:** Address the "Infinite Loop" worry immediately.
  *   **Resolution:** Stipulate a "Step Limit." If simulation exceeds $N$ steps, output $D$.
  *   **Why this example:** It creates the conditional cooperation needed for PD without requiring complex logic.
  *   **Avoid:** Do not use the Trading Bot example (too close to Housing/Delegate). Do not use Cold War (too much external enforcement baggage).

  **00:40 – 00:55: Defining the Equilibrium & The PD Result**
  *   **Move:** Define Program Equilibrium: Pair $(P_1, P_2)$ such that no player can gain by unilaterally switching to $P'_1$.
  *   **Analysis:** Show that $(M, M)$ yields $(C, C)$ in PD. Show that $(D_{bot}, D_{bot})$ (unconditional defect) is *also* a Program Equilibrium.
  *   **Key Insight:** PE does not *delete* the Defect equilibrium; it *adds* a Cooperate equilibrium. It changes the *set* of stable outcomes, not the *logic* of stability.
  *   **Why here:** Satisfies the aim "neither dissolves nor leaves untouched."

  **00:55 – 01:05: The Provability Decision (Handling Circularity)**
  *   **Move:** Acknowledge the "Step Limit" is arbitrary.
  *   **Decision:** **Do not teach Löb's Theorem.**
  *   **Replacement:** Explain the *intuition*: "There exists a logical construction where a program cooperates iff it can *prove* the opponent cooperates, without simulating it. This avoids the timeout."
  *   **Honesty:** Admit: "Proving this requires logic we don't have time for. The takeaway is: The circularity is solvable, not a bug."
  *   **Why:** Respects the CS students' knowledge (they know Halting is hard) without demanding they learn Provability Logic in 5 minutes.

  **01:05 – 01:15: Agency & Omissions (The Philosophical Close)**
  *   **Move:** Return to the "Who chooses?" question. If the program dictates the action, in what sense is the *player* rational?
  *   **Explicit Omissions:** State clearly: "We are not covering (1) Coalitional deviations (what if 3 programs collude?), (2) Computational costs (what if reading code is expensive?), (3) Evolutionary stability (do these programs survive in a population?)."
  *   **Why:** Manages expectations and sets up the future session on coalitions.

  ---

  ### 2. The Carrying Example

  **Selection:** **The "Matching" Program (Variant of $FairBot$).**
  *   **Definition:** Program $P$ takes opponent's source $S$ as input. $P$ simulates $S(P)$. If result is $C$, output $C$. Else output $D$.
  *   **Properties it MUST have:**
      *   **Transparency:** Source code is visible.
      *   **Conditionality:** Output depends on the opponent's output, not just their identity.
      *   **One-Shot:** No history, no iteration.
  *   **Properties it MUST lack:**
      *   **Internal State:** No memory of past rounds.
      *   **Randomness:** Deterministic outputs only (avoids probability confusion).
      *   **External Enforcement:** No referee punishing defection; the punishment must be internal to the code logic.
  *   **Why the Housing Agents damage the other candidates:**
      *   *Trading Bots:* Implies the bot optimizes for *its own* P&L, reinforcing the "Delegate" misconception.
      *   *Cold War:* Implies an external enforcer (treaty/verification regime), which confuses the "self-enforcing" nature of the equilibrium.
      *   *Byte-Identical:* Too fragile. If I change a comment in my code, you defect. It makes cooperation look like a bug, not a strategy.

  ---

  ### 3. The Misconception Map

  | Misconception | When it arises | The Board Move / One-Sentence Intervention |
  | :--- | :--- | :--- |
  | **"This is just PD with complete information."** | 00:25 (Mechanism) | "In standard PD, I know your *payoffs*. Here, I know your *algorithm*. Knowing I *will* defect is different than knowing I *must* defect." |
  | **"Defection is still available, so nothing changed."** | 00:40 (Equilibrium) | "True. But Cooperation is *also* available now. The set of equilibria has expanded, not stayed the same." |
  | **"The dilemma is solved."** | 00:40 (Equilibrium) | "No. $(D, D)$ is still an equilibrium. You still have to coordinate on the good one. The tension remains." |
  | **"Programs must be simulating each other all the way down."** | 00:30 (Mechanism) | "Draw a recursion tree on the board. Show it hits the 'Step Limit' and stops. It's not infinite; it's truncated." |
  | **"Provable Cooperation is circular/logically impossible."** | 00:55 (Provability) | **Correct Insight to Welcome:** "It *feels* circular. That intuition is why we need fixed-point theorems. Don't dismiss the worry; formalize it." |
  | **"The outcome is what they print, even if they loop."** | 00:30 (Mechanism) | "A program that loops produces *no* output. The Referee must assign a default penalty (Defect) for non-termination." |
  | **"This is just Cheap Talk / Commitment."** | 00:15 (Frame) | "Cheap talk is cheap. I can lie. Here, the code *is* the action. You cannot submit code that lies about what it does." |
  | **"The Program is the Player."** (Housing) | 00:05 (Open) | **Critical Break:** "The program has no utility function. It is a hand, not a head." |

  ---

  ### 4. The Provability Decision

  **Decision:** **NO.** Do not include the formal Provability Logic variant (Löbian Cooperation).

  **Reasoning:**
  1.  **Time:** 5 minutes is insufficient to define a proof predicate, let alone Löb's Theorem.
  2.  **Audience:** Philosophy students will drown in syntax; CS students will itch for the formal proof you aren't giving.
  3.  **Risk:** It shifts the seminar from "Game Theory/Action" to "Logic," violating the aim.

  **The Replacement (The "Logical Commitment" Hand-Wave):**
  *   **Say:** "The simulation model I just showed you relies on a 'Timeout.' This is arbitrary. If I set timeout to 1000 steps and you need 1001, we defect."
  *   **Say:** "There is a more advanced version where programs cooperate iff they can *prove* the opponent cooperates. This relies on a theorem (Löb's) that allows a sentence to assert its own provability."
  *   **Say:** "I am not going to prove it. I want you to know *that* it exists, because it removes the arbitrary timeout. It turns the 'circularity worry' into a 'fixed-point solution.' For this session, treat the Timeout model as the intuition for the Provability model."
  *   **Why this works:** It satisfies the CS students (you acknowledged the hard logic) and the Phil students (you focused on the conceptual shift from simulation to proof) without getting stuck in the weeds.

  ---

  ### 5. Audience Engagement (Keeping Both Halves Alive)

  **Moment 1: Losing the Philosophers (00:25 - The Code)**
  *   **Risk:** They glaze over at "source code," "simulation," "input/output."
  *   **Fix:** Translate code to **Conditional Promises**.
  *   **Move:** "When you read `if Opponent == C then C`, read it as 'I promise to cooperate if and only if you are the kind of player who cooperates with me.' The code is just the enforceable contract language."

  **Moment 2: Losing the CS Students (00:55 - The Equilibrium)**
  *   **Risk:** They get bored by "Rationality," "Best Response," "Why would I choose this?"
  *   **Fix:** Translate Rationality to **Optimization**.
  *   **Move:** "Don't think 'Rationality.' Think 'Objective Function.' The Player maximizes Payoff. The Program minimizes Steps. If the Program prevents the Player from maximizing Payoff, the Player changes the Program. That's all 'Rationality' means here."

  ---

  ### 6. Check for Understanding (The Transfer Test)

  **The Setup:**
  Present a new game, **"The Asymmetric Trust Game."**
  *   Player 1 chooses $T$ (Trust) or $N$ (No Trust).
  *   Player 2 chooses $H$ (Honor) or $E$ (Exploit).
  *   **Payoffs:**
      *   If $N$: $(2, 2)$ regardless of P2.
      *   If $T$ and $H$: $(3, 3)$.
      *   If $T$ and $E$: $(0, 4)$.
  *   **Standard Nash:** Player 2 has a dominant strategy $E$. Player 1 anticipates this and plays $N$. Outcome: $(2, 2)$.

  **The Question:**
  "In a Program Equilibrium setting for this game, can the players achieve the $(3, 3)$ outcome? If yes, how? If no, why not?"

  **The Answer That Shows Understanding:**
  *   **Yes.** Player 1 submits program: "Play $T$ if I can verify Player 2 plays $H$ against me. Else $N$." Player 2 submits program: "Play $H$ if Player 1 plays $T$ against me. Else $E$."
  *   **Why:** This shows they understand that programs allow conditional strategies that bypass the *sequential* logic of the standard Nash (where P2 moves after P1). They see that programs allow P1 to make their move *contingent* on P2's move, effectively simultaneousizing the commitment.

  **The Plausible Wrong Answer:**
  *   **No.** "Player 2 still has a dominant strategy to Exploit, so they will always submit an Exploit-Bot."
  *   **What this tells me:** They have failed to distinguish between **Actions** (where $E$ dominates) and **Programs** (where $H$ can be made a best response to a specific $T$-program). They are pattern-matching "Dominance" without seeing the change in strategy space. They treat the program as just a fancy way to play the action $E$.

  **Alternative Wrong Answer (Pattern Matching):**
  *   **Yes.** "Because programs always cooperate."
  *   **What this tells me:** They think Program Equilibrium is a moral solution that forces cooperation in *all* games. They haven't grasped that it relies on specific conditional structures that might not exist in other games. (Less likely than the Dominance error, but possible).
