      *   *Case 3 (Systematic Overcharging/One Guy):*
          *   Claim: Systemic fraud.
          *   Source: One long-time resident.
          *   Friction: High. Extraordinary claim. Incentive (maybe he wants a payout?).
          *   Outcome: Escalate. This needs union resources to verify, not just mediation.

      *Wait, I need to ensure one outcome is definitely "hated."*
      Case 2 (Mold) is the best candidate for "kicked out." Tenants feel sick, they see spots, they want help *now*. Telling them "no mediation until verified" feels like siding with the landlord. But epistemically, it's the right call to prevent a failed mediation.
      *Refining Case 3:* If Case 2 is the "kick out," Case 3 should probably be "Escalate" rather than "Pass."
      *Refining Case 1:* This should be the "Pass." It's routine.

