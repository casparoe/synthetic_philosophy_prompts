answer: |-
  ### Executive Stance: The Local Friction Protocol

  Here is the definitive stance you need to run this panel without burning out or losing credibility:

  1.  **Calculate Friction Locally, Not Globally.** Do not average the credibility of a complaint. A tenant's story is a chain of claims (e.g., "He entered," "He broke the lock," "He threatened me"). Mediation fails on the weakest link. If one claim carries massive friction, it becomes the landlord's leverage to dismiss the whole case. You must score every distinct allegation separately.
  2.  **High-Friction Testimony Can Be Accepted Without Corroboration, BUT...** You cannot demand independent verification for everything; that privileges landlords who keep records over tenants who survive orally. However, high-friction claims (claims that radically revise the picture of reality) cannot go to *mediation* without a strategy. They can be accepted by the Union for *investigation*, but sending a tenant into a room with a landlord to argue a high-friction claim without proof is setting them up to lose.
  3.  **The "Value Override" is Explicit.** You are not a court; you are a union. Sometimes epistemology must yield to political necessity. If a claim is high-friction but the stakes involve safety or systemic abuse, the Union absorbs the epistemic risk. This must be flagged, not hidden.

  Below is the **Testimonial Friction Intake Protocol (TFIP)**. It is designed for a 15-minute review.

  ---

  ### The TFIP Checklist (15 Minutes Max)

  **Step 1: Atomize the Complaint (3 Minutes)**
  Break the tenant's narrative into distinct claims. Do not treat the story as one block.
  *   *Example:* "Landlord entered" (Claim A). "Landlord stole my bike" (Claim B). "Landlord is racist" (Claim C).
  *   *Action:* List Claims A, B, C.

  **Step 2: Score Friction Per Claim (5 Minutes)**
  For each claim, assign a Friction Score (0–3) based on these four questions. Add the points.

  1.  **Proximity:** Is the speaker the direct witness?
      *   Yes (0 pts) | No, but direct source available (1 pt) | No, hearsay/anonymous (2 pts)
  2.  **Coherence:** Does the claim contradict itself or known timelines?
      *   Consistent (0 pts) | Minor gaps (1 pt) | Major contradictions (2 pts)
  3.  **Normalcy:** How much does this claim revise our background picture of the situation?
      *   Routine violation (0 pts) | Unusual but possible (1 pt) | Extraordinary/Rare (2 pts)
  4.  **Incentive:** Does the speaker gain significantly if believed?
      *   Standard remedy (0 pts) | Large payout/eviction delay (1 pt) | Vindictive/Custody battle (2 pts)

  *   **Score 0–2:** Low Friction.
  *   **Score 3–5:** Medium Friction.
  *   **Score 6–8:** High Friction.

  **Step 3: Apply Thresholds (2 Minutes)**
  *   **All Claims Low Friction:** **PASS.** Forward to Mediation.
  *   **Any Claim Medium Friction:** **PAUSE.** Request clarification or basic documentation (texts, photos) before scheduling.
  *   **Any Claim High Friction:** **STOP.** Do not forward to Mediation yet. Escalate to Senior Coordinator for "Value Override" review.

  **Step 4: The Value Override Flag (5 Minutes)**
  If a claim is **STOPPED** due to High Friction, ask:
  *   *Is this claim essential to tenant safety or union leverage?*
  *   *Yes:* **Escalate.** The Union will investigate to lower the friction (e.g., hire an inspector) before mediation.
  *   *No:* **Reject for Mediation.** Advise tenant the claim is too epistemically weak to fight in this forum.

  ---

  ### Defense of the Procedure

  **Why Local Friction?**
  If you calculate globally, a tenant can hide a wild, unprovable accusation inside a boring, credible complaint. "He didn't fix the heat (True) and he poisoned my dog (False)." In mediation, the landlord will latch onto the false claim to discredit the true one. By scoring locally, you isolate the weak links. You can send the "heat" claim to mediation while flagging the "dog" claim for investigation. This protects the tenant from overreaching and losing credibility.

  **Why Allow High-Friction Acceptance?**
  Strict reductionism (demanding proof for everything) is a tool of oppression in housing. Landlords hold the documents; tenants hold the experience. If you require corroboration for high-friction claims (like "systemic harassment"), you will never accept the hardest cases. The Union's role is to act as the corroborating weight. However, you cannot do this *in the mediation room*. You must do it *before*. That is why High Friction triggers an "Investigation" path, not a "Mediation" path.

  **Why the Value Override?**
  Epistemology tells you what is likely true. Politics tells you what must be fought. Sometimes you must fight a battle even if the odds of proving it are low (e.g., a vulnerable tenant vs. a predatory landlord). This procedure forces you to admit when you are making a political choice, not a factual one. That honesty prevents mission creep and burnout.

  ---

  ### Case Runs

  #### Case 1: The Roommate Entry
  *   **Claim:** Landlord entered without notice.
  *   **Atomization:** Single Claim (Entry).
  *   **Friction Score:**
      *   Proximity: 1 pt (Tenant heard from roommate, not direct witness).
      *   Coherence: 0 pts (Story is consistent).
      *   Normalcy: 0 pts (Illegal entry is common).
      *   Incentive: 0 pts (Standard repair/privacy remedy).
      *   **Total:** 1 (Low Friction).
  *   **Decision:** **PASS.**
  *   **Reasoning:** The friction is low enough that mediation can proceed. The roommate can be present to testify. The claim fits background beliefs about landlord behavior.
  *   **Value Flag:** None. This is standard epistemic territory.

  #### Case 2: The Black Mold (The "Hated" Outcome)
  *   **Claim:** Building has toxic black mold causing illness.
  *   **Atomization:** Claim A (Visual presence of mold). Claim B (Medical causation).
  *   **Friction Score:**
      *   **Claim A (Visual):**
          *   Proximity: 0 (Direct witness).
          *   Coherence: 0 (Consistent).
          *   Normalcy: 1 (Possible, but "black mold" is often misidentified dirt).
          *   Incentive: 1 (Relocation/Payout).
          *   *Subtotal:* 2 (Low/Medium).
      *   **Claim B (Medical/Toxic):**
          *   Proximity: 0 (Direct witness of symptoms).
          *   Coherence: 1 (Symptoms vary among tenants).
          *   Normalcy: 2 (Laypeople cannot diagnose toxic mold).
          *   Incentive: 2 (High stakes: health/housing).
          *   *Subtotal:* 5 (Medium/High Friction).
  *   **Decision:** **STOP (Do not forward to Mediation).**
  *   **Reasoning:** Claim B carries too much friction. In mediation, the landlord will ask for a certified industrial hygiene report. The tenants do not have one. If they go in without it, they will be dismissed as alarmists, weakening their leverage on Claim A (repairs).
  *   **Action:** Refer tenants to Union Health & Safety committee for testing *before* mediation.
  *   **Why You'll Hate This:** The tenants feel sick *now*. They want a fight *now*. Telling them to wait for a test feels like bureaucracy overriding urgency.
  *   **Where the Procedure Breaks/Hands Off:** This is where **Epistemology hits the wall of Material Reality.** The procedure correctly identifies that testimony alone cannot sustain a scientific claim in a dispute forum. However, if the Union lacks funds for testing, this case stalls. This is where you must flag the **Value Override**: Does the Union spend its limited budget to verify this? If no, the tenant is effectively abandoned. The procedure identifies the risk; it cannot fix the resource gap.

  #### Case 3: The Systematic Overcharging
  *   **Claim:** Management is systematically overcharging all neighbors.
  *   **Atomization:** Claim A (My bill is wrong). Claim B (Everyone's bill is wrong). Claim C (Intent to defraud).
  *   **Friction Score:**
      *   **Claim A:** 1 pt (He has his own bills). Low Friction.
      *   **Claim B:** 3 pts (Hearsay regarding neighbors' bills). High Friction.
      *   **Claim C:** 4 pts (Extraordinary claim of systemic fraud + High Incentive). High Friction.
  *   **Decision:** **ESCALATE (Value Override Review).**
  *   **Reasoning:** Claim A can go to mediation. Claims B and C are High Friction. A single tenant cannot prove "systemic" issues in a private mediation. This requires collective action or legal discovery.
  *   **Action:** Do not schedule standard mediation. Escalate to Organizing Director. This is a campaign, not a dispute.
  *   **Value Flag:** **HIGH.** Accepting Claim B/C requires the Union to vouch for the tenant's data. If the tenant is wrong, the Union loses credibility with the whole building. If the tenant is right, this is a major win. This is a political gamble, not an epistemic judgment.

  ---

  ### Final Note on the "Value Flag"

  You asked where values take over facts. It happens in **Case 2** and **Case 3**.

  In **Case 2**, the epistemic verdict is "Insufficient Evidence." The *value* verdict might be "They are suffering, help them anyway." The procedure forces you to separate these. If you help them without evidence, mark the **Value Override Box**. Acknowledge you are spending political capital on an unproven claim.

  In **Case 3**, the epistemic verdict is "Hearsay." The *value* verdict is "This is what unions do: we aggregate individual grievances into systemic claims."

  **Do not hide this.** If your panel starts believing its own press releases, you will lose. Use the TFIP to tell yourself the truth about what you know, so you can decide consciously when to fight anyway.
