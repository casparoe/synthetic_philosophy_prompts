      *   *The "Twist":* Testimonial Friction.
      *   *Decision:* **Local Friction Calculation.** Why? Because a complaint is a bundle of claims. Some might be routine (rent hike), some extraordinary (threats of violence). Global averaging hides dangerous spikes. If one claim has massive friction, it risks the whole case's credibility in mediation.
      *   *Decision:* **High-Friction Testimony *Can* Be Accepted, BUT only if "Internal Coherence" is maxed out and "Stakes" align with union values.** Why? Because tenants are often isolated. Requiring independent corroboration for *everything* defeats the purpose of a union (which exists to amplify isolated voices). However, high friction requires a "Value Override" flag.
      *   *The Procedure:* A scored checklist.
