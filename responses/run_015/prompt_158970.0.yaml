  | **G** | No, Crude, Dynamic, Impose, Acquisition, Valuable | **Deflationary Xunzi** | Must explain why "bad" is used rhetorically if the raw material is merely crude. |
  | **H** | Yes, (N/A), Dynamic, Impose, Acquisition, Valuable | **Compatibilist** | Agrees on endpoint with Mencius but accepts Xunzi's mechanism of external shaping. |
  | **I** | (Any), (Any), (Any), (Any), (Any), Falling Away | **Daoist** | Must explain how to live socially if moral classification is rejected as harmful. |
