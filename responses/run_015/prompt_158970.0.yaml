  # DECISION TREE: MORAL PSYCHOLOGY OF *XING* (NATURE)

  **Instructions:** Answer each question based on your reading of the cases. Follow the branch corresponding to your answer. Terms: *xin* (heart-mind); *xing* (nature).

  1.  **The Well and the Feral.** Consider the immediate reaction to a child about to fall into a well, or a human raised from infancy without language or ritual (feral). Does the untrained *xin* show *any* specific other-regarding concern spontaneously, or only self-focused appetite and shock?
      *   **Yes, concern appears.** → Go to 3.
      *   **No, only appetite/shock.** → Go to 2.

  2.  **The Hunger and the Elder.** (For those answering No to 1). Consider the hungry person who holds back to let an elder eat first. Is the raw hunger impulse actively hostile to this social order (detestable), or merely uncoordinated and crude (deficient)?
      *   **Actively hostile.** → Go to 3.
      *   **Merely crude/neutral.** → Go to 3.

  3.  **The Feather and the Kind.** Consider the argument about white feathers, snow, and jade, or the natures of dogs, oxen, and humans. Is *xing* strictly what is present at birth unchanged (static), or does it include the unique developmental potential of the kind (dynamic)?
      *   **Static (Birth-state only).** → Go to 7.
      *   **Dynamic (Kind-potential).** → Go to 4.

  4.  **The Mountain and the Right.** Consider the denuded mountain whose shoots return, and the choice to give up life for what is right. Does cultivation nourish an internal trend (like shoots) allowing the *xin* to override appetite based on value, or does it impose shape from outside (like straightening wood) via rule and ritual?
      *   **Nourish Internal.** → Go to 5.
      *   **Impose External.** → Go to 6.

  5.  **The Relapse and the Sage.** Consider a cultivated person who regresses into vice and is re-taught, or the sage who acts effortlessly. Is the reform faster because the path was cleared (recovery), or equally hard because it is built anew (acquisition)?
      *   **Recovery.** → Go to 8.
      *   **Acquisition.** → Go to 9.

  6.  **The Artifact.** (For those answering Impose External at 4). Is the distinction between "natural" and "artificial" ultimately valuable for flourishing, or is moral classification itself a falling away from the Way?
      *   **Valuable.** → Go to 10.
      *   **Falling Away.** → Go to 11.

  7.  **Static Endpoints.** (For those answering Static at 3). Does the presence or absence of moral sprouts matter if *xing* is only birth-state?
      *   **Morally Indeterminate.** → **Leaf A**.
      *   **Instinctualist (Unnamed).** → **Leaf B**.

  8.  **Recovery Endpoint.** (For those answering Recovery at 5).
      *   **Internal Nourish + Recovery.** → **Leaf C**.
      *   **Internal Nourish + Acquisition (Unnamed).** → **Leaf D**.

  9.  **Acquisition Endpoint.** (For those answering Acquisition at 5).
      *   **External Impose + Acquisition.** → Go to 10.
      *   **Internal Nourish + Acquisition (Unnamed).** → **Leaf E**.

  10. **Pro-Artifact.** (For those answering Valuable at 6).
      *   **Hostile Raw Material.** → **Leaf F**.
      *   **Crude Raw Material.** → **Leaf G**.
      *   **Compatibilist (Internal + External).** → **Leaf H**.

  11. **Anti-Artifact.** (For those answering Falling Away at 6).
      *   **Rejects Moral Distinction.** → **Leaf I**.

  12. **Unoccupied.** (Logical combination not taken above).
      *   **Hostile Raw + Internal Nourish.** → **Leaf J**.

