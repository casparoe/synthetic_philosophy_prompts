  ### POSITION TABLE

  | Leaf | Answer Pattern (Q1–Q6) | Position | Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | No, (N/A), Static, (N/A), (N/A), (N/A) | **Interlocutor** | Must explain why moral training works if nature is purely indeterminate static stuff. |
  | **B** | Yes, (N/A), Static, (N/A), (N/A), (N/A) | **Unnamed** | Claims moral sprouts exist but denies they define the kind's potential trajectory. |
  | **C** | Yes, (N/A), Dynamic, Nourish, Recovery, (N/A) | **Mencius** | Must explain why sprouts are so easily lost if they are the core of human nature. |
  | **D** | Yes, (N/A), Dynamic, Nourish, Acquisition, (N/A) | **Unnamed** | Claims internal sprouts exist but require full external construction to complete. |
