  2. Instruct: "Write one sentence on your slip starting 'You owed me...' addressing that person." Give 3 minutes. Pair students. "Read only the sentence to your neighbor. Listen to theirs. Do not explain the context." Collect no papers. Next: "On a new slip, rank 1-3 how much these facts would cool your anger: (1) Their action was caused by prior events they couldn't stop; (2) They didn't know harm would happen; (3) They are incapable of meeting demands like this." Seal predictions in envelopes. Do not open yet. This anchors their initial standing toward the person before any theoretical interference. Ensure they feel the weight of the "You."

