  5. Use whiteboard. Draw two columns: "Verdict" vs "Stance." Map moments: (1) Writing "You owed" = Participant Stance. (2) Card 1 failure to kill gratitude = Point (a): Objective stance kills positive reactions too. (3) Card 3 hesitation = Point (b): Exemption leaks across domains. (4) Friend vs. Self probe = Partial detachment. (5) Induced Remorse = Point (c): We want the attitude, not the script. (6) Physical turning of paper = Embodied shift in stance. Introduce terms: Reactive Attitudes, Objective Attitude, Responsibility. Argue that vocabulary carves the joint they just felt. If they kept gratitude despite Card 1, they never truly adopted the Objective Attitude.

