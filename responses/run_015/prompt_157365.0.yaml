answer: |-
  Heritability coefficients are doubly misinterpreted, failing to license causal claims about individuals and proving structurally unsuited for cross-population prediction. A high estimate within a specific population merely indicates that current phenotypic variance correlates with genetic variance under existing conditions; it says nothing about modifiability. If the environment shifts uniformly, phenotypic means can change drastically without altering the coefficient, proving high heritability is compatible with high malleability. The statistic describes the source of *differences* in a specific context, not the cause of the *trait* itself.

  Furthermore, standard models treat genotype-environment covariance as statistical noise to be partitioned away, ignoring how genes shape environments. Active and evocative correlations are not confounds but constitutive mechanisms of development; genetic propensities actively select and modify environmental exposures. To statistically remove this covariance is to strip the genotype of its causal reach, redefining "genetic contribution" as merely direct biological effect rather than total causal influence. Consequently, a model isolating direct genetic effects from environmental mediation fails to capture the trait's actual architecture, rendering the coefficient ontologically thin.

  Finally, because environmental variance sits in the denominator, the coefficient is a relational property of a specific variance structure, not an intrinsic constant. Transporting an estimate from a homogeneous cohort to a stratified population is illegitimate because changing the environmental distribution alters the denominator, shifting the ratio even if underlying genetic effects remain constant. Defenders of portability rely on the hidden assumption that genetic and environmental variances are separable and stable across contexts, ignoring that population stratification introduces new genotype-environment structures that invalidate the original variance decomposition.
