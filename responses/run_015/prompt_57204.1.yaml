answer: |-
  ### Desiderata for a Formal Account of Heuristic Estimation

  **1. The Revision Obligation (Local Obstructions)**
  *   **Requirement:** The estimator must update its output when presented with local density constraints that contradict the global independence assumption. The correction must be derivable from the local data, not fitted to the global count.
  *   **Motivating Case:** The Twin Prime Conjecture. The naive independence model suggests $\pi_2(x) \sim x/(\log x)^2$. However, for any prime $p$, the condition that $n$ and $n+2$ are both prime is impossible if $n \equiv 0 \pmod p$ or $n \equiv -2 \pmod p$. For $p=2$, this eliminates half the candidates compared to the random model. The Hardy–Littlewood conjecture corrects this with a singular series $\mathfrak{S} = 2 \prod_{p>2} (1 - \frac{1}{(p-1)^2})$. A valid framework must derive $\mathfrak{S}$ from the local obstructions at each $p$, not treat it as a fudge factor to make the asymptotic match data.
  *   **Status:** **Non-negotiable.** (Analytic Number Theorists). Without this, the estimator is empirically false at the first step.

  **2. Structural Adequacy (Short-Interval Irregularities)**
  *   **Requirement:** The estimator must not be refuted by known structural theorems that contradict the random model's predictions, even if those theorems do not resolve the primary conjecture.
  *   **Motivating Case:** Maier's Theorem. Cramér's model predicts the number of primes in intervals $[x, x + \lambda \log x]$ follows a Poisson distribution. Maier proved that for certain sequences of $x$, the count deviates significantly from this prediction (irregularities in distribution). Granville proposed a modified constant $2e^{-\gamma}$ to adjust the model. A heuristic framework that outputs the Cramér prediction without flagging the potential for Maier-type irregularities is structurally unsound. It must distinguish between "random noise" and "structural deviation."
  *   **Status:** **Non-negotiable.** (Empiricists/Modelers). If a theorem refutes the model's prediction, the model is broken, not just "informed."

  **3. Measure Invariance (Automorphism Weighting)**
  *   **Requirement:** The default measure over a space of objects must account for natural symmetries or weights inherent to the structure, not assume uniform counting measure.
  *   **Motivating Case:** Cohen–Lenstra Heuristics for class groups. The prediction that the $p$-part of the class group of an imaginary quadratic field is isomorphic to a specific group $A$ is weighted by $1/|\text{Aut}(A)|$. A framework assuming a uniform distribution over isomorphism classes would predict the wrong frequencies. The "presumption of independence" must apply to the *weighted* measure, not the counting measure.
  *   **Status:** **Negotiable.** (Algebraic Number Theorists vs. Probabilists). Probabilists might argue the weight belongs in the definition of the random variable; algebraists argue it is intrinsic to the object.

  **4. Non-Omniscient Coherence**
  *   **Requirement:** The estimator must satisfy the axioms of probability (additivity, $P(\neg \phi) = 1 - P(\phi)$, etc.) without requiring the computational power to decide the truth value of $\phi$.
  *   **Motivating Case:** Erdős–Kac Theorem. Before the theorem was proven, the heuristic that $\omega(n)$ is normally distributed was coherent with other probabilistic claims about additive functions. If the framework requires proof to assign probability 1, it cannot function as a heuristic. If it assigns probability $p \in (0,1)$ to a statement that is actually true (in the fixed integers), it must interpret $p$ in a way that does not contradict the fixed truth value (e.g., as epistemic confidence).
  *   **Status:** **Non-negotiable.** (Logicians/Automated Systems). An incoherent estimator can be Dutch-booked; an omniscient one is a solver, not an estimator.

  **5. Construction Awareness (Sparse Sequences)**
  *   **Requirement:** The estimator must recognize when an integer sequence is constructed to correlate with small primes, overriding the default independence assumption.
  *   **Motivating Case:** Primes of the form $n! + 1$. A random integer of size $N$ has probability $1/p$ of being divisible by $p$. However, $n! + 1$ is coprime to all $p \le n$. A heuristic estimator treating $n!+1$ as a random integer of its size will vastly overestimate the probability of small prime factors and underestimate the probability of primality. The framework must flag the construction $n!$ as "specific information about correlation."
  *   **Status:** **Non-negotiable.** (Automated Systems). This is the boundary between "background information" and "specific correlation."

  **6. Global Obstruction Sensitivity**
  *   **Requirement:** The estimator must account for obstructions that are not visible locally (everywhere locally soluble $\nRightarrow$ globally soluble).
  *   **Motivating Case:** Brauer–Manin Obstruction. A variety may have points over $\mathbb{Q}_p$ for all $p$ and over $\mathbb{R}$, suggesting a local density product $> 0$, yet have no rational points. A framework that simply multiplies local densities (as in Requirement 1) will predict existence where there is none. It must allow for a "global correction factor" that can zero out the estimate despite non-zero local factors.
  *   **Status:** **Non-negotiable.** (Arithmetic Geometers). Local-global principles are not universal.

  ---

  ### Impossibility Result: The Coherence–Independence–Adequacy Trilemma

  I assert that the following three requirements cannot be jointly satisfied by any single formal framework:

  1.  **Default Independence:** The estimator uses $E[XY] = E[X]E[Y]$ as the central engine when specific correlation information is absent.
  2.  **Universal Coherence:** The estimator's outputs satisfy the axioms of probability for all logical combinations of claims (including those equivalent under arithmetic transformation).
  3.  **Structural Adequacy:** The estimator's outputs align with known structural theorems regarding irregularities (e.g., Maier's result) and global obstructions (e.g., Brauer–Manin).

  **Argument:**
  The conflict arises in the definition of "absent specific correlation information."
  To satisfy **Structural Adequacy** (specifically regarding Maier's theorem), the estimator must *not* apply Default Independence to primes in short intervals, because Maier proves they are correlated in ways the random model misses. To satisfy **Universal Coherence**, the estimator must have a consistent rule for when to apply Independence and when to suspend it.
  If the rule is syntactic (based on the form of the claim), it fails Adequacy because Maier's irregularities depend on semantic properties of the primes, not the syntax of the interval definition.
  If the rule is semantic (based on the truth of correlation), the estimator must *know* whether the correlation exists. Determining the existence of such correlations in the general case (e.g., for arbitrary sparse sequences or global obstructions) is computationally equivalent to solving the distribution problems themselves.
  Therefore, to maintain Coherence and Adequacy, the estimator must possess the structural knowledge that renders the heuristic unnecessary. If it lacks that knowledge (to remain a heuristic), it must violate Coherence (by being inconsistent in its application of Independence) or Adequacy (by being wrong in the Maier regime). You cannot have a coherent probability measure over arithmetic statements that respects independence defaults and also matches the fixed, irregular structure of the integers without effectively deciding the arithmetic truths those statements describe.

  ### Coherence and the Meaning of Probability

  **Coherence Conditions:**
  Standard coherence (no Dutch books, additivity) is incompatible with an estimator that does not settle the questions it estimates, *if* the probability is interpreted as a frequency in the object. Since the integers are fixed, the frequency of a property is either 0 or 1. A coherent estimator assigning $P(\phi) = 0.5$ implies $\phi$ is contingent. But $\phi$ is not contingent.
  Therefore, coherence can only be had if the probabilities are **epistemic**: they represent the agent's degree of belief given limited computational resources, not a property of the integers. However, if they are epistemic, **Structural Adequacy** becomes an external constraint on the agent's rationality rather than an internal consistency check. The "Impossibility" above shows that an epistemic agent cannot be both coherent and empirically adequate about the integers without becoming omniscient about the correlations.

  **What the Probabilities Are:**
  In this framework, the probabilities must be interpreted as **logical credences**: the measure of consistency of a claim with a specific random model *conditioned on the background information*, acknowledging that the model is false. They are not probabilities *of* the integers, but probabilities *relative to the model*. The framework is successful only if it explicitly tracks the divergence between the model's probability and the structural truth.

  ### The Killer Requirement

  The single requirement that does the most to exclude candidate frameworks is **Construction Awareness (Non-Omniscience)**.
  This requirement demands that the estimator distinguish between a "random" integer and a "constructed" integer (like $n!+1$) based on the *description* of the integer, without computing the factors. This excludes simple Cramér-style random models (which treat all integers of size $N$ identically) and it excludes pure coherence-based approaches (which treat logically equivalent descriptions identically, even if one hides the construction). It forces the framework to have a semantics of "information content" in the definition of the object, which is notoriously difficult to formalize without slipping into computational intractability.

  ### Verdict on Candidate Families

  **Concrete Random Models (Cramér Tradition)**
  These models fail **Structural Adequacy** and **Construction Awareness**. They treat the integers as outcomes of a stochastic process, which allows them to satisfy **Default Independence** easily, but they are provably false in short intervals (Maier) and cannot distinguish constructed sequences from random ones without ad-hoc modification. They are useful for generating conjectures but cannot serve as a formal account of estimation because they lack the semantics to know when they are wrong.

  **Formal Coherence-Based Approaches**
  These approaches satisfy **Non-Omniscient Coherence** by construction but fail **Structural Adequacy** and **Revision Obligation**. By prioritizing logical consistency over empirical fit, they often assign probabilities based on syntactic independence that ignore deep arithmetic correlations (like the singular series or Brauer–Manin obstructions). They risk becoming tautological systems that measure consistency with axioms rather than likelihood of truth in the standard model, effectively decoupling the estimate from the number theory.

  **Working Mathematician's Practice**
  This practice satisfies **Structural Adequacy**, **Revision Obligation**, and **Construction Awareness** through expert intuition, but fails **Universal Coherence** and **Non-Omniscient Coherence**. Mathematicians routinely use inconsistent models (e.g., treating primes as random for one calculation and structured for another) and lack a formal semantics for the probabilities they assign. It is the only approach that currently works for discovery, but it cannot be trusted by an automated agent because it relies on unformalizable judgment calls about when to suspend independence.

  ### Purpose Dependency

  This list depends heavily on the purpose of **automated trust**. If the framework only had to **organize expert practice**, the **Non-Omniscient Coherence** and **Construction Awareness** requirements would drop out or become preferences. Expert practice tolerates inconsistency and relies on the human ability to recognize "construction" without a formal definition. An automated agent, however, cannot rely on intuition; it requires the **Construction Awareness** requirement to be formalized, which triggers the Impossibility Result. Thus, a framework sufficient for organizing practice is necessarily insufficient for an agent that must rely on the estimate without verification.
