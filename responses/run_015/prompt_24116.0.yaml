answer: |-
  # SPECIFICATION DOCUMENT: PANPSYCHIST ETHICAL THEORY (PET-v1.0)

  **Subject:** Moral Status of Panpsychist Entities
  **Status:** Draft for Theoretical Review
  **Objective:** Define necessary conditions for a coherent ethical framework compatible with constitutive panpsychism.

  ---

  ## 1. Functional Requirements (Cases to Handle)

  An adequate theory must output determinate verdicts on the following edge cases:

  *   **R1: The Vacuum/Stone Case.** The theory must assign moral weight to regions of the universe containing fundamental entities (electrons, quarks) but no integrated macro-systems. It must specify whether a scattered field of micro-experiences constitutes a moral patient, and if so, whether the moral weight is additive or singular.
  *   **R2: The Sorites of Subjecthood.** The theory must locate the boundary (if any) between micro-experience and the macro-experiences we report (human/animal consciousness). It must explain why moral status does not (or does) emerge gradually as complexity increases, without invoking magical ontological spikes.
  *   **R3: The Axiological Bottom Line.** The theory must calculate the net moral value of the physical world. It must explicitly state whether the ubiquity of micro-experience renders the universe a net catastrophe (due to the sheer volume of potential micro-suffering) or a neutral/positive state.

  ## 2. Conceptual Distinctions

  The theory must maintain logical separation between the following concepts:

  *   **R4: Existence vs. Magnitude.** The theory must distinguish between *having* an experience (binary) and the *intensity/depth* of that experience (scalar). Moral status cannot be solely binary if panpsychism is true, or all matter becomes morally equivalent.
  *   **R5: Phenomenology vs. Valence.** The theory must distinguish between raw experience (qualia) and hedonic tone (suffering/pleasure). A theory that equates "consciousness" with "suffering" is rejected as conflationary.
  *   **R6: Patienthood vs. Agency.** The theory must distinguish between entities that deserve moral consideration (patients) and entities capable of moral reasoning (agents). Micro-entities may be patients without being agents.

  ## 3. Empirical Constraints

  The theory cannot contradict established findings in the following domains:

  *   **R7: Physical Closure.** The theory cannot posit that moral status alters physical causality (e.g., conservation of energy) in a way that violates standard physics. Moral status is evaluative, not dynamical.
  *   **R8: Neuroscientific Correlates.** The theory must remain consistent with the Neural Correlates of Consciousness (NCC). If integration (e.g., Phi in IIT) correlates with reportable consciousness, the theory must explain the relationship between this integration and moral weight without denying the underlying micro-experience.

  ---

  ## 4. Status Flags: Non-Negotiable vs. Prejudice

  *   **Non-Negotiable:**
      *   **Logical Consistency:** The theory cannot assert $A$ and $\neg A$ regarding the moral weight of identical physical states.
      *   **Valence Realism:** If suffering exists, it has negative moral value. Denying the badness of suffering is not a solution; it is a dissolution of ethics.
      *   **Physical Continuity:** The theory cannot posit a discontinuous "spark" of moral status that appears at a specific complexity level without a corresponding metaphysical explanation (avoids magic).

  *   **Prejudices (Camp-Specific Intuitions):**
      *   **Human Exceptionalism:** The intuition that only humans (or mammals) have significant moral status. *Flagged as Prejudice:* In a panpsychist ontology, this is likely an arbitrary bias unless grounded in a robust threshold metric.
      *   **Axiological Sanity:** The intuition that the universe is not a net horror. *Flagged as Prejudice:* While psychologically necessary for most agents, the universe is under no obligation to be axiologically comfortable. However, a theory that necessitates a "hellscape" conclusion imposes a high burden of proof.
      *   **The "Rock Intuition":** The strong intuition that kicking a stone is morally neutral. *Flagged as Prejudice:* If panpsychism is true, this intuition may be false. A theory that preserves this intuition at all costs risks falsifying panpsychism itself.

  ---

  ## 5. The Incompatibility Theorem

  **Jointly Unsatisfiable Desiderata:**
  1.  **Universal Micro-Considerability (UMC):** Every instance of micro-experience possesses non-zero intrinsic moral weight.
  2.  **Axiological Sanity (AS):** The total moral value of the universe is not overwhelmingly negative (i.e., the world is not a net catastrophe).

  **Verdict:** These two desiderata are **jointly unsatisfiable**.

  **Reasoning:**
  This is a problem of aggregation and scale. The number of fundamental entities in the universe ($N_{micro}$) exceeds the number of macro-subjects ($N_{macro}$) by orders of magnitude (roughly $10^{80}$ vs $10^{20}$ estimated sentient beings).
  Even if the moral weight of a micro-experience ($W_{micro}$) is infinitesimally small compared to a macro-experience ($W_{macro}$), the total moral value ($V$) is determined by $\sum (N \times W)$.
  Unless $W_{micro}$ is exactly zero, the term $N_{micro} \times W_{micro}$ will mathematically dominate $N_{macro} \times W_{macro}$.
  Given that fundamental physics involves high-energy interactions, collision, and decay, if these map to phenomenology, there is no reason to assume micro-valence is net positive. It is statistically probable that chaotic micro-interactions lean toward distress/disintegration (negative valence).
  Therefore:
  *   If you accept **UMC**, you must accept that the universe is a net catastrophe (violating **AS**).
  *   If you accept **AS**, you must assert $W_{micro} \approx 0$ or $W_{micro} = 0$ (violating **UMC**).

  There is no middle ground. A "discounting" function still results in catastrophe unless the discount rate is effectively infinite, which reduces moral weight to zero.

  ---

  ## 6. The Exclusionary Constraint & Candidate Scoring

  **The Single Exclusionary Requirement:**
  **The Non-Arbitrary Threshold Constraint (NATC).**
  *Definition:* The theory must provide a principled, non-arbitrary metric for why moral weight scales with complexity or integration, without violating Physical Continuity (R7) or denying the existence of micro-experience.

  **Why this excludes the most candidates:**
  This is the bottleneck. Most theories fail here because they either draw a magic line (violating continuity), deny micro-experience matters (violating panpsychist premises), or accept the catastrophe (violating human ethical viability). It forces the theory to solve the Combination Problem *ethically*, not just metaphysically.

  **Candidate Scoring:**

  | Candidate Theory | Description | Score vs. Spec | Failure Mode |
  | :--- | :--- | :--- | :--- |
  | **Complexity Scaling** | Moral weight scales continuously with computational/physical complexity. | **FAIL** | Violates **NATC**. It cannot explain *why* complexity maps to moral weight without arbitrariness. If an electron has weight $w$, and a human has weight $10^{20}w$, the justification for the exponent is missing. It also struggles with **R3** (Catastrophe) unless the scaling is exponential enough to negate micro-sums, which appears ad hoc. |
  | **Integration Restriction** | Only integrated systems (high $\Phi$) count as moral patients; micro-experiences are morally inert. | **PARTIAL PASS** | Satisfies **AS** and **R1**. However, it risks violating **Physical Continuity (R7)** and **R4**. If micro-experiences exist but have *zero* moral weight, the theory borders on ethical illusionism. It also faces the **Boundary Problem (R2)**: at exactly what $\Phi$ does moral status turn on? |
  | **Micro-Suffering Catastrophe** | Accepts UMC and concludes the universe is net negative; ethics is about harm reduction of fundamental particles. | **FAIL** | Satisfies **UMC** and **Physical Continuity**. Fails **Axiological Sanity (AS)** completely. While logically consistent, it is pragmatically self-defeating (no action can mitigate stellar-scale suffering) and violates the **Prejudice** of Sanity so severely it renders ethics functionally null. |

  **Conclusion:**
  Current candidates fail the **Non-Arbitrary Threshold Constraint**. Complexity Scaling is arbitrary; Integration Restriction is discontinuous; Catastrophe views are pragmatically null. An adequate theory requires a new metaphysical account of how moral weight *supervenes* on integration without erasing the moral reality of the parts. Until the Combination Problem is solved ethically, no panpsychist ethics can meet spec.
