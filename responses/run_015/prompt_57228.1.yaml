answer: |-
  ### Desiderata for the Heterogeneity Problem

  1.  **Phenomenal Unity:** Must identify a shared feature distinguishing pleasure from pain and neutrality.
      *   *Case:* Hedonism requires a single currency for aggregation; without unity, "maximizing pleasure" is a category error like "maximizing red things and triangles."
  2.  **Radical Heterogeneity Tolerance:** Must accommodate qualitative differences between sensory (warm bread), intellectual (proof), and background (cheerfulness) modes.
      *   *Case:* Cannot reduce pleasure to a specific sensation (e.g., a "tingle") or it excludes higher-order or diffuse states essential to welfare.
  3.  **Valence Contextualization:** Must explain why identical stimuli flip from pleasant to unpleasant based on satiety or context.
      *   *Case:* Water is pleasant when thirsty, neutral or unpleasant when full; the account cannot locate value solely in the external stimulus or static internal sensor.
  4.  **Scalar Granularity:** Must support distinctions of intensity and duration for ranking.
      *   *Case:* Welfare calculus requires trade-offs (e.g., is a short intense joy better than a long mild contentment?); binary accounts fail the module's ranking function.
  5.  **Cross-Species Accessibility:** Must be detectable via third-person evidence in non-linguistic animals.
      *   *Case:* The tool ranks hen welfare; you cannot rely on self-report, so the marker must correlate with observable behavior or physiology.
  6.  **First-Person Authority (Contingent):** Must respect subject reports when available without being defined by them.
      *   *Case:* Denying a human's report of enjoyment is paternalistic, but defining pleasure *as* the report makes animal welfare impossible to assess.
  7.  **Normative Independence:** Must distinguish pleasure from desire-satisfaction.
      *   *Case:* The hedonist needs pleasure to be the *reason* we desire things, not just the result of getting them; otherwise, adaptive preferences (desiring misery) count as welfare.

  ### The Killer Requirement

  **Radical Heterogeneity Tolerance** knocks out the most candidates.
  Most intuitive accounts (simple sensation theories) fail here immediately because there is no single qualitative "feel" shared by eating cake, solving a theorem, and a hen dust-bathing. Demanding a common *ingredient* usually forces a theory to become so abstract (e.g., "felt goodness") that it loses explanatory power, or so specific that it excludes valid cases.

  ### The Bind Analysis

  You are not wrong; that tetrad is jointly unsatisfiable.
  The conflict centers on **(b) Common Phenomenal Ingredient** vs. **(c) Cross-Species Checkability**. If pleasure is a specific *felt* ingredient (b), it is inherently private, making (c) impossible without inferring feeling from behavior, which risks collapsing into **(d) Desire/Disposition**. If you enforce (c) strictly for the animal module, you must externalize the metric (neural/behavioral), which undermines **(a) First-Person Authority** (the scanner can override the subject). You must drop one: usually (a) for animal welfare tools, or (b) for philosophical coherence.

  ### Theory Performance

  *   **Common Felt Quality:** Preserves first-person authority but fails heterogeneity and cross-species checkability (no access to the hen's qualia).
  *   **Attitude-Based:** Solves heterogeneity and checkability (via preference behavior) but sacrifices first-person authority and normative independence (collapses into desire).
  *   **Dispositional:** Excellent for checkability and heterogeneity, but fails to capture the occurrent phenomenology required for intensity ranking.
  *   **Family-Resemblance:** Solves heterogeneity perfectly but destroys the hedonist project by denying a single good-making feature for aggregation.
