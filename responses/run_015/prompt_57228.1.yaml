          4.  One-line summaries of how main families of theories fare (common felt quality, attitude-based, dispositional, family-resemblance).
      *   **Constraints:** No reading list. Concise, high-density philosophical analysis. Tone should be professional, analytical, and direct.

  2.  **Deconstruct the Heterogeneity Problem:**
      *   The core issue: Pleasures seem wildly different (eating cake, solving math, sex, listening to music, a dog scratching its ear). What makes them all *pleasure*?
      *   Context: Welfare assessment (humans + animals). This adds pressure for cross-species comparability and objective measurability, not just introspective reporting.

  3.  **Drafting the Desiderata (Requirements List):**
