answer: |-
  You are right to be suspicious. Half the literature in this domain is philosophers protecting their preferred intuition by labeling it a "constraint." The debate between Etiological (SE), Causal Role (CR), and Organizational accounts often looks like a stalemate because each camp optimizes for a different subset of desiderata and pretends the others are mistakes.

  For Philosophy of Medicine, specifically the naturalistic project of defining disorder, you cannot afford a theory that works only for evolved traits in stable environments. You need a spec that licenses *clinical* judgments.

  Here is the spec. I have ranked them by priority for your specific project.

  ### The Spec: Desiderata for a Medical Theory of Function

  **1. The Normativity Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish between a trait *doing* X and a trait *failing* to do X, without appealing to external value judgments.
  *   **Case:** A heart pumping blood vs. a heart fibrillating. Both are causal contributions to the system's state, but only one is "functioning."
  *   **Why:** If you cannot ground "malfunction," you cannot ground "disorder." This is the core of the Boorse project.
  *   **Status:** **Non-Negotiable.** If a theory collapses function into mere causal contribution (pure Cummins), it is useless for medicine.

  **2. The Reference Class Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must be able to specify *which system's* function is being ascribed (cell, organ, organism, lineage).
  *   **Case:** Cancer. A mutation causes rapid division.
  *   **Why:** As you noted, the answer changes if you ask as a doctor (organism level) vs. an evolutionary biologist (cell lineage level). A medical theory must privilege the **organism** as the primary locus of function without denying the biological reality of the cell lineage.
  *   **Status:** **Non-Negotiable.** Without this, cancer is "functioning" (for the cell) and you cannot call it a disease.

  **3. The Novelty Constraint (High Priority)**
  *   **Requirement:** The theory must ascribe functions to traits that lack an evolutionary selection history.
  *   **Case:** The synthetic cell. Also: novel human adaptations (e.g., reading, using a pacemaker), or *de novo* mutations.
  *   **Why:** If a synthetic cell has no functions, it cannot have dysfunctions. If it gets sick, a strict SE theorist must say it is merely "different," not "disordered." Medicine treats the patient in front of them, not their ancestors.
  *   **Status:** **High Priority.** You can limp without this, but you break on edge cases that are becoming scientifically central (synthetic bio, gene therapy).

  **4. The Granularity Constraint (Preference)**
  *   **Requirement:** The theory must align with how physiologists talk about molecular pathways (e.g., "the function of p53 is to suppress tumors").
  *   **Why:** If the theory contradicts standard biological usage constantly, it becomes revisionist rather than analytic.
  *   **Status:** **Preference.** Biology is often loose with function talk. Your theory can correct biology, but it shouldn't make basic physiology unintelligible.

  **5. The Historical Constraint (Negotiable)**
  *   **Requirement:** A trait's function must be identical to the effect for which it was historically selected.
  *   **Why:** This is the core of the SE account. It grounds normativity in history.
  *   **Status:** **Negotiable.** This is the casualty. It is the source of the "Synthetic Cell" failure.

  ---

  ### Handling Your Hard Cases

  **Case 1: The Synthetic Cell (No History)**
  *   **The Problem:** SE theories (Millikan, Neander) say this entity has *no* biological functions because it has no selection history.
  *   **The Cost:** If you accept SE, you must admit that synthetic life cannot suffer "disorders," only structural failures. This creates a dual ontology: natural organisms get diseases; artificial ones get breakdowns.
  *   **The Verdict:** For medicine, this is unacceptable. We treat the physiology, not the genealogy. A theory that denies function to the synthetic cell fails the **Novelty Constraint**.
  *   **Solution:** You must adopt a theory where function is grounded in the *current organization* of the system, not its past. (See Organizational accounts).

  **Case 2: Cancer (Selection at the Wrong Level)**
  *   **The Problem:** The cancerous trait *is* selected for (cell lineage survival) and *does* contribute causally (to the mass growth).
  *   **The Verdict:** This is a failure of the **Reference Class Constraint**, not the function theory itself.
  *   **Solution:** A medical theory of function must hard-code the **Organism** as the relevant "containing system" for ascriptions of health/disorder.
      *   *Question:* "What is the function of this cell?"
      *   *SE Answer:* To divide (selected effect of the lineage).
      *   *Medical Answer:* To contribute to organismal maintenance.
      *   *Resolution:* The trait is functioning *for the lineage* but malfunctioning *for the organism*. Medicine cares about the latter. Your theory must allow function ascriptions to be relative to a chosen system level, and then stipulate that *Disorder* = Dysfunction at the *Organism* level.

  ---

  ### The Incompatibility Hunch

  You suspect you can't have "New organism has functions" and "Functions can be performed badly" out of one principle.

  **You are half-right.**
  You cannot have them out of a *Historical* principle (SE). SE gets "performed badly" (normativity) but loses "new organism."
  You cannot have them out of a *Pure Causal* principle (CR). CR gets "new organism" but loses "performed badly" (everything that happens is a function).

  **However, they are jointly satisfiable under an Organizational Account.**
  Theories like Mossio & Saborido's "Organizational Closure" ground normativity in the *self-maintaining structure* of the current system, not its history.
  *   **Novelty:** A synthetic cell has functions if it is organizationally closed (produces the components that maintain it).
  *   **Normativity:** It malfunctions if a trait threatens that closure.
  *   **Result:** You get both. The cost is that "function" is no longer about *history*, it's about *current systemic dependency*.

  **What we lose by admitting the split:**
  If you refuse the Organizational route and stick to the idea that "Function" must be a single natural kind, you will fail. The honest move is to admit that "Function" in biology is polysemous.
  *   **Function-E (Etiological):** For explaining why a trait exists (Evolutionary Bio).
  *   **Function-C (Causal/Organizational):** For explaining what a trait does now (Physiology/Medicine).
  *   **The Loss:** You lose the elegance of a Unified Theory of Function. You must accept that when an evolutionary biologist and a doctor use the word "function," they are technically referring to different relations, even if they overlap 90% of the time.

  ---

  ### The Commitment

  Here is my ranking and the cut.

  **Ranking of Desiderata:**
  1.  **Normativity** (Must distinguish function from malfunction).
  2.  **Reference Class** (Must distinguish organism-function from cell-function).
  3.  **Novelty** (Must handle synthetic/new traits).
  4.  **Granularity** (Should fit physio talk).
  5.  **History** (Must trace to selection).

  **The Single Requirement That Knocks Out the Most Candidates:**
  **The Normativity Constraint.**
  This kills the pure Causal Role (Cummins) account immediately. Cummins functions are just causal contributions; a cancer cell contributing to tumor growth is "functioning" in Cummins' sense. If you can't say the cancer cell is *failing* at its proper function, you can't define disease. This eliminates the easiest "fix" for the Synthetic Cell case.

  **The Oft-Repeated Demand That Is Actually Negotiable:**
  **The Historical Constraint.**
  Philosophers love selection history because it solves normativity naturally. But for medicine, it is a liability. It makes function dependent on facts about the past that are often unknowable or irrelevant to the patient's current suffering. **Throw this out.** Do not require selection history for a trait to have a function.

  **Joint Satisfiability:**
  **Yes, but only if you drop History.**
  If you demand History + Normativity + Novelty, the set is empty. No theory satisfies all three.
  If you demand Normativity + Novelty + Reference Class, the **Organizational Account** (or a modified Boorsean "Species-Typical Contribution" that ignores history) survives.

  **My Position:**
  Adopt an **Organizational/Systems-Normative** account. Define function as a causal role that contributes to the *self-maintenance of the organism*.
  *   **Synthetic Cell:** Has functions (it maintains itself).
  *   **Cancer:** Dysfunction (it undermines organismal self-maintenance, even if it aids cell maintenance).
  *   **Normativity:** Derived from the distinction between maintaining the system and dissolving it.

  **Where I Am Most Likely Wrong:**
  The **Organizational Account's** ability to handle *psychiatric* cases.
  Self-maintenance is easy to define for a cell or a heart. It is notoriously difficult to define for a "mind" or "psychological capacity" without smuggling in social norms. If "self-maintenance" of the mind includes "social integration," you've collapsed back into normativism (value judgments).
  **What would change my mind:** If you can show that "organizational closure" can be rigorously defined for neural/psychological systems without referencing social outcomes. If not, you may be forced to accept a hybrid: Organizational for physiology, Social-Normative for psychiatry.

  ---

  ### Scorecard

  | Constraint | Etiological (SE) | Causal Role (CR) | Organizational (Closure) |
  | :--- | :---: | :---: | :---: |
  | **Normativity** (Malfunction) | **PASS** (Failing selection) | **FAIL** (Mere contribution) | **PASS** (Threat to closure) |
  | **Reference Class** (Level) | **PASS** (Level of selection) | **PASS** (Chosen system) | **PASS** (Chosen system) |
  | **Novelty** (Synthetic) | **FAIL** (No history) | **PASS** (Current causal) | **PASS** (Current organization) |
  | **History Required** | **YES** | **NO** | **NO** |
  | **Medical Viability** | **LOW** (Breaks on new traits) | **LOW** (Breaks on cancer) | **HIGH** (Fits clinical needs) |

  **Summary:** Use the Organizational account. It is the only one that passes the Normativity and Novelty constraints simultaneously. Accept that "Function" in medicine is about *system maintenance*, not *evolutionary history*.
