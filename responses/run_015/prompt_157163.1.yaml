answer: |-
  You have hit on something really interesting there that most introductory summaries of Ayer tend to gloss over, and it gets to the heart of why his empiricism is trickier than it first appears. Usually people say Ayer rejects the afterlife simply because talk of disembodied spirits is meaningless under the verification principle, implying that since we cannot observe a soul, the statement has no cognitive content. But you are right to point out that this isnt just about the unverifiability of a ghostly substance; it is fundamentally about the criteria for personal identity. For Ayer, the statement I am the same person who existed yesterday is only meaningful if there is a public method for verifying that identity, and he ties this inextricably to bodily continuity. The tension you identified with the synthetic substrate scenario is definately the stress point where his verificationism and his materialism seem to pull in opposite directions. On one hand, the verificationist wants to say that if every behavioral output and mental state is observable and identical to the deceased, then the statement this is John is verified by the evidence of our senses. On the other hand, the materialist commitment suggests that without the same physical stuff or at least a continuous physical history, it is just a replica, not the person.

  If we look closely at how Ayer constructs the logic of personhood, however, I do not think this ends up being a fatal internal contradiction, though it does require him to lean heavily on a specific notion of what verification entails. The hidden resource he has available is the distinction between qualitative identity and numerical identity within the framework of empirical verification. A perfect synthetic copy possesses qualitative identity; it shares all the same properties and behaviors as the original. But when we make claims about survival or life after death, we are making claims about numerical identity, meaning we are claiming this entity is the very same object in space and time as the one that existed before. For Ayer, verifying numerical identity requires more than just matching current properties; it requires tracing a spatio-temporal continuum. The verification principle does not just validate statements based on immediate sensory data in the present moment; it validates statements based on the logical rules governing how we re-identify objects over time. Since our logical grammar for persons dictates that re-identification relies on bodily continuity, a synthetic being that pops into existence without a causal chain linking it to the original body fails the verification test for being the same person, even if it behaves identically.

  So the verificationist side does not actually force him to accept the synthetic replica as the surviving person because the verification of identity statements includes the history of the object. If you claim this robot is John, you are making a claim about its origin and continuity, not just its current output. Since the robot lacks the causal connection to the original biological body, the statement this is John is actually falsifiable or meaningless depending on how strictly you define the terms, because the necessary conditions for the use of the name John have not been met. Ayer would likely argue that while we might treat the robot as if it were John for social purposes, strictly speaking, the proposition that John has survived is not verified because the criterion of bodily continuity has been broken. This preserves his materialist commitment without abandoning verificationism, but it does come at a cost. It means that verification is not purely about present observation but is laden with theoretical commitments about causality and physical continuity.

  There is a slight wobble here though, which is where your intuition about a tension remains valid. If Ayer insists that all meaningful statements must be reducible to sense data, one could argue that the spatio-temporal history is itself only known through sense data, and if the current sense data is identical, why privilege the history? He has to assume that the concept of a person logically entails physical continuity, which is a philosophical claim rather than a purely empirical one. He is smuggling in a metaphysical constraint about the nature of bodies under the guise of logical grammar. But he would probably reply that this is not metaphysics but an analysis of how we use language. We simply do not use the word same person to describe a duplicate, so to insist otherwise is to misuse language. In the end, the synthetic substrate thought experiment does not break his system, but it does reveal that his verificationism is not as neutral as he sometimes claimed. It relies on a specific, somewhat rigid conception of physical objects and their persistence, meaning he blocks the afterlife not just because it is unobservable, but because it violates the rules he has set for what counts as observation of a person. It is a coherent position, but it rests on the stipulation that bodily continuity is a necessary condition for the verification of identity, effectively ruling out the synthetic scenario by definitional fiat rather than empirical discovery. I hope that helps clarify things, let me know if you want to dig deeper into how this compares to Lockes view.
