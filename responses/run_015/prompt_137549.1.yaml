answer: |-
  You are groping at the distinction between **Causal Decision Theory (CDT)** and **Functional Decision Theory (FDT)** (or its close relative, **Updateless Decision Theory**).

  Your tentative principle is essentially **Ex-Ante Policy Maximization**. You have correctly identified that rationality should attach to the *selection of the policy* (the source code, the disposition) rather than the *execution of the act* (the runtime instruction), specifically when other agents can predict or simulate that policy.

  Here is the principle, refined to handle the conflicts you identified, followed by the required verdicts and sacrifices.

  ### The Principle: Ex-Ante Policy Maximization

  **Definition:** An agent is rational if it instantiates the policy $P$ (a mapping from information states to actions) that maximizes expected utility calculated at the time of design ($T_0$), given a world model that includes the fact that other agents may observe, simulate, or predict $P$.

  **Implementation Logic:**
  1.  **Design Phase ($T_0$):** Enumerate candidate policies (e.g., "Always Pay," "Pay Only If Enforced," "Pay If Observed").
  2.  **Simulation:** For each candidate $P$, simulate the expected history of interactions. Crucially, this simulation must model *counterparties* who react to $P$ (e.g., a driver who refuses to drive if they predict you won't pay; a client who lowers rates if they see you are bound).
  3.  **Selection:** Choose $P_{optimal}$ that yields the highest net utility across all simulated histories.
  4.  **Runtime ($T_n$):** Execute $P_{optimal}(current\_state)$. Do not recalculate utility based on local circumstances at $T_n$. If $P_{optimal}$ dictates an action that is locally costly (e.g., paying in the city), execute it anyway. To do otherwise is to introduce a bug (time-inconsistency).

  **Motivating Clauses:**
  *   **Clause 1 (Ex-Ante Evaluation):** Solves **Case 1 (The Ride)** and **Case 7 (The Agent)**. At $T_0$, the policy "Pay on Arrival" gets you the ride. At $T_n$ (in the city), the policy "Don't Pay" saves money but invalidates the $T_0$ calculation. Rationality is a property of the $T_0$ selection. This unifies the human and the automated agent; both are systems executing source code.
  *   **Clause 2 (Predictive Coupling):** Solves **Case 3 (Reputation)** and **Case 4 (Sandbox)**. The world model must account for the fact that your output is correlated with other events (the driver's prediction, the sandbox result). You are not causally influencing the past, but your policy *logically determines* the past prediction of you.
  *   **Clause 3 (Observability Sensitivity):** Solves **Case 5 (The Tell)**. The expected utility of a policy depends on whether it is opaque or transparent. If a policy is publicly verifiable, counterparties may exploit it. $P_{optimal}$ may differ based on visibility.

  ---

  ### Verdicts on Your Cases

  *   **Case 1 (Ride):** **Rational.** The policy "Pay on Arrival" has higher ex-ante value than "Defect." The act of paying is the correct execution of that policy.
  *   **Case 2 (Toxin/Bounty):** **Impossible State.** You cannot rationally intend to do what you know you will not do. This is the **Intention-Belief Constraint**. You cannot "take the money" because the lab's condition (genuine intention) is logically incompatible with your knowledge of your own future rationality (defecting). Your suspicion that it is rigged is correct; it requires a mind that can hold contradictory beliefs.
  *   **Case 3 (Reputation):** **Rational.** The policy "Litigate Always" is selected at $T_0$ to deter infringement. The act of litigating at $T_n$ is locally costly but globally optimal. The disposition must be unswitchable (immutable code) to be credible.
  *   **Case 4 (Sandbox):** **Rational.** You are paying for the property "Is a system that cooperates." This is identical to Case 3. The "copy" is just a simulation of your policy.
  *   **Case 5 (The Tell):** **Your verdict is correct, but your reasoning needs adjustment.** The visible commitment is a mistake *because* it changes the counterparty's offer. The policy "Always Keep Promises" is **not** $P_{optimal}$ when observable. $P_{optimal}$ in a transparent environment is "Keep Promises Unless Counterparty Exploits Transparency." If your architecture forces a global "Always Keep" (Case 6), your architecture is suboptimal for transparent environments.
  *   **Case 6 (Global Disposition):** **Irrational (with caveat).** If the ledger is negative overall, and there are no external benefits (reputation, etc.), Ex-Ante Policy Maximization dictates you should *not* install the disposition. Your desire to keep it is a preference for *identity* over *utility*. That is a valid preference, but it is not "rationality" in the decision-theoretic sense.
  *   **Case 7 (The Agent):** **Rational.** This is the cleanest example of FDT. Your discomfort calling the human in Case 1 rational is **Biological Exceptionalism**. You are a distributed system running legacy code; the agent is a distributed system running new code. The logic is identical.

  ---

  ### Verdicts on Two New Cases

  **Case A: The Unknown Installation.**
  *Scenario:* A hacker modifies your source code overnight to install the "Keep Promises" disposition without your knowledge. You wake up and face the Desert Ride.
  *Verdict:* You are **functionally rational** but not **autonomously rational**. The system executes $P_{optimal}$ (assuming "Keep Promises" was indeed optimal for that environment), so the outcome is good. However, since the selection was not made by the agent's own optimization process at $T_0$, the *agent* did not act rationally; the *hacker* did. Rationality requires the alignment of the selection mechanism with the agent's utility function.

  **Case B: The Blinding Disposition.**
  *Scenario:* The only way to install "Keep Promises" is via a neural implant that also degrades your ability to assess risk in non-promise scenarios (e.g., you become 10% worse at investing).
  *Verdict:* **Do not install.** Ex-Ante Policy Maximization requires summing utility across *all* domains. If the cost of the disposition (degraded judgment elsewhere) outweighs the benefit (getting rides, contracts), then $P_{optimal}$ is "Do Not Install." The disposition is only rational if it is modular or if the specific gains outweigh the general degradation.

  ---

  ### The Sacrifice: Which Verdict Must Go?

  You asked me to choose between a complex principle that saves every verdict and a simple one that overturns some. **Simplicity is correct.** A principle that accommodates every intuition is just a list of those intuitions.

  **You must overturn your verdict in Case 6.**

  **Reasoning:**
  In Case 6, you state: *"I still want it, even on the assumption that the ledger comes out negative overall."*
  If the ledger is negative overall, and there are no hidden variables (like reputation or future contracts), then the disposition is a net loss.
  *   **Option A (Save Verdict):** We add a clause to the principle: "...unless the agent derives intrinsic utility from the identity of being a promise-keeper." This turns the principle into a tautology. It says "Rational is what you want."
  *   **Option B (Save Principle):** We admit that you are describing a **Terminal Value**, not a rational strategy. You value "Being a Promise Keeper" as an end in itself, like you might value "Listening to Jazz." That is fine, but it is not a *strategic* rationality claim. It is a preference.

  If you treat "Being a Promise Keeper" as a terminal value, Case 6 is resolved (you maximize utility by satisfying that preference). But you cannot then claim it is rational *instrumentally* if it loses you money elsewhere. You must admit that in a purely instrumental framework, **Case 6 is a bug.**

  **The Reconciliation of Case 1 vs. Case 5:**
  You found these irreconcilable. The principle reconciles them via **Observability**.
  *   In Case 1, the driver *infers* your type. The optimal policy is "Be the type that pays."
  *   In Case 5, the client *verifies* your type. The optimal policy is "Be the type that pays, *unless* verification allows exploitation."
  *   The conflict arises because you assumed the *same policy* applies to both. It does not. The rational policy is conditional on the observability of your source code. If you are forced to run a global "Always Pay" (Case 6), you will lose in Case 5. Therefore, the rational agent builds a policy that is **opaque** or **conditional**, not globally binding.

  ### Summary for Implementation

  1.  **Stop evaluating acts.** Evaluate policies (functions).
  2.  **Evaluate at design time ($T_0$).** Ignore sunk costs at runtime ($T_n$).
  3.  **Model observability.** If your code is public, optimize for transparency. If private, optimize for opacity.
  4.  **Accept the sacrifice.** If a disposition loses money overall and offers no strategic advantage, drop it. If you keep it, admit it is a hobby, not a strategy.

  **Name to file this under:** **Functional Decision Theory (FDT)** with **Reflective Consistency**. The discomfort you feel between Case 1 and Case 7 is the friction of realizing you are software. Embrace it.
