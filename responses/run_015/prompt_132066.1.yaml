  **Node 3: Split Dependency**
  **How is the million tied to your choice?**
  *   **Branch X:** **Causally Fixed** (The past is locked; your choice can't change the box content).
  *   **Branch Y:** **Evidentially Tied** (Your choice correlates with the content; logic binds them).

  ***

  **The Leaves (Stances)**

  **Node 4: Causal Fixed (Branch A + X OR Branch B + X)**
  **Stance: CDT (Causal Decision Theory)**
  **Action: Two-Box.**
  *Flag:* These two paths are **indistinguishable**. Whether the predictor read your code or your brain, if you believe the money is already locked in the past, you take both boxes. The mechanism doesn't matter if causality is dead.

  **Node 5: Evidential + Live State (Branch B + Y)**
  **Stance: EDT (Evidential Decision Theory)**
  **Action: One-Box.**
  You treat your choice as a diagnostic signal. You one-box not because you change the past, but because one-boxers are the kind of people who find millions. It's correlation, not causation.

  **Node 6: Evidential + Algorithm (Branch A + Y)**
  **Stance: FDT (Functional Decision Theory)**
  **Action: One-Box.**
  You view your decision as the output of a function. The predictor simulated the function; you are running the same function. Your choice logically determines the prediction, not just evidentially.

  **Node 7: The Quantum Edge Case (Branch A + Superposition)**
  **Stance: QDT (Quantum Decision Theory)**
  **Action: One-Box (Collapsing).**
  *Placement:* This branches off **Algorithm** but bypasses the standard Dependency split.
  *Logic:* If the predictor runs your decision in quantum superposition, the prediction isn't fixed until you observe/choose. You aren't evidentially tied to a past state; you are entangled with it. Your choice collapses the box content simultaneously. It's a hard one-box, but because the timeline is fuzzy, not because of logic.
