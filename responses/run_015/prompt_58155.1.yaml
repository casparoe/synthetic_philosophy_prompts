      *   *Improvisational Actor:* Good. They stay in character, follow prompts, make things up on the fly, but might get facts wrong.
      *   *Dreamer:* Good. Things feel real and connect logically, but aren't bound by reality.
      *   *Librarian who makes things up:* Classic. Knows where books are but might write fake pages.
