answer: |-
  Here are the four conceptual specifications your theory needs to meet to sustain the "gender as fiat currency" analogy without collapsing into reductionism.

  **1. The Material Interface (Why it tracks bodies)**
  Fiat money isn't backed by gold, but it is backed by the material infrastructure of the state (banks, servers, vaults). Gender isn't backed by chromosomes, but it is backed by the material infrastructure of the body as a social interface. Gender tracks bodies not because biology *causes* gender, but because bodies are the card-swipe mechanism. Social interaction requires a quick heuristic to assign roles, and sexed characteristics are the most visible, low-cost signal available. The theory must posit that bodies are the *medium of circulation*, not the *source of value*. This explains the correlation without granting biology ontological authority. The body is the uniform, not the soldier.

  **2. Institutional Inertia (Why it doesn't vanish when laws change)**
  Currency retains value after a regime change if the existing stock is still in circulation and accepted by merchants. Gender persists after legal repeal because it is embedded in physical architecture and habitus, not just statutes. Toilets, clothing sizes, division of labor, and grammatical structures are the "physical cash" of gender. You can repeal the law minting the currency, but you cannot instantly rebuild the vending machines that only accept that specific coin. The theory must account for gender as a *material legacy system* that outlives its legislative authors. It sticks because undoing it requires rebuilding the physical world, not just changing minds.

  **3. Pragmatic Validity (How forgery is genuinely lived)**
  A counterfeit bill is "fake" regarding the mint, but "real" regarding the transaction if it spends. Your theory must decouple *authorization* from *validity*. A forged gender is genuinely lived because the social access it buys is tangible (respect, safety, desire, labor opportunities). The feeling of authenticity comes from the successful circulation of the sign, not the legitimacy of its origin. If a person performs a gender and the world reacts to that performance consistently, the social reality is generated in the interaction, regardless of the "official" status. The lived experience is the spending power, not the reserve backing.

  **4. Non-Fungibility and Relationality (Distinct from Money and Race)**
  To keep gender distinct from money: Money is fungible (one dollar equals another); gender positions are relational and oppositional (manhood is often defined by not-being-womanhood). You cannot swap gender roles without altering the structural relationship, whereas you can swap dollar bills without altering the economy. To keep gender distinct from race: While both are constructed, race is historically constructed around *lineage and origin* (blood, ancestry, geography), whereas gender is constructed around *function and capacity* (who cares, who leads, who breeds). Race looks backward to origin; gender looks forward to role. This distinction prevents the theory from conflating the mechanics of racialization with the mechanics of gendering.

  **The Tension**
  The two requirements in greatest tension are **1 (The Material Interface)** and **3 (Pragmatic Validity)**.
  If gender tracks bodies because they are the necessary interface for social legibility (Req 1), then a "forged" gender that mismatches the body should theoretically fail to circulate or be immediately rejected as illegible. However, Req 3 demands that this forgery still be genuinely lived and socially effective. The theory must explain how the body can be read as one thing while the currency spends as another without crashing the transaction. You are balancing the stubbornness of physical perception against the fluidity of social trust.

  **The Killer Desideratum**
  The single desideratum that kills the usual suspects (specifically **Recognition-Based Social Constructionism** and strict **Performativity**) is **3 (Pragmatic Validity)**.
  Standard performativity and constructivist models often rely on *interpellation*—the idea that you become a gendered subject only when hailed/recognized by the social order. If the social order rejects the performance (labels it a forgery), these theories struggle to account for the subject's internal reality or the pragmatic success of the interaction as "genuine." They tie ontological reality too tightly to social sanction. Your requirement demands a theory where validity is generated by the *act of circulation itself* (phenomenological pragmatism), not by the *authority of the observer*. It forces you to admit that a gender can be real to the holder and functional in the world even if the "state" says it is counterfeit, which breaks models that require social consensus for existence.

  Bottom line: Gender works like fiat because its value lies in the trust of the transaction, not the biology of the holder, but it sticks because the vending machines are built to reject coins that don't fit the slot.
