  # Decision Tree: Idealizations of Judgment (HCH)

  **Entry Commitment:** *HCH (or something like it) is a useful idealization of good deliberation.*
  **Definition:** A question is answered by a human with a fixed time budget who may either answer directly or decompose it into subquestions, each answered by a copy of the same human with the same budget, merged bottom-up.

  ---

  ### Q1: The Engineering Case
  **Suppose you use this structure to train an AI assistant. If the HCH process yields different answers on different days for the same question, does that undermine the AI's legitimacy, or is the AI just a tool that needs to be "helpful" regardless of consistency?**
  *   **Just a tool:** → **Leaf 1: HCH as Mere Training Target**
      *   *Awkward Commitment:* You deny the model describes deliberation at all, reducing the entry commitment to a purely engineering heuristic.
  *   **Undermines legitimacy:** → *Go to Q2.*

  ### Q2: The Time Budget Case
  **You ask a moral question. With 5 minutes per node, the answer is "Yes." With 5 months per node, the answer is "No." Is the "No" closer to the truth, or did the extra time just drift?**
  *   **Just drift (No stable truth):** → *Go to Q3.*
  *   **"No" is truer (Convergence):** → *Go to Q4.*
  *   **[Empty Cell]:** *5-min is truer.* (Unattractive: Implies deeper thought corrupts judgment.)

  ### Q3: The Run Stability Case
  **Since there is no stable truth, can you pick any run of the system and act on it as an "acceptable draw" from the space of good answers?**
  *   **Yes, any run works:** → **Leaf 2: Run-Indifferent Benchmarking**
      *   *Awkward Commitment:* You treat the idealization as a stochastic oracle, severing the link between "good deliberation" and "correct answer."
      *   *Diagnosis:* Distinct from Proceduralism (Leaf 6); here the process does not *constitute* the answer, it merely samples from a vague cloud of acceptability.
  *   **No, variation is fatal:** → **Leaf 3: HCH as Degenerate**
      *   *Awkward Commitment:* You maintain the entry commitment only ironically, acknowledging the model has no fixed point and thus fails as an idealization.
  *   **[Empty Cell]:** *No stable truth, but one specific run is magically right.* (Incoherent: Contradicts the "no stable truth" premise.)

  ### Q4: The Decomposition Case
  **You face a personal decision. Breaking it down by "Risk vs. Reward" says "Take Job A." Breaking it down by "Duty vs. Desire" says "Take Job B." Both breakdowns are reasonable. Is there a fact of the matter about which is right?**
  *   **No fact of the matter:** → **Leaf 4: No-Fact-of-the-Matter Proceduralism**
      *   *Awkward Commitment:* You must accept that "good deliberation" is purely path-dependent, making the root question's framing arbitrarily decisive.
  *   **Yes, one path is better:** → *Go to Q5.*

  ### Q5: The Prejudice Case
  **A person instantly gives a biased answer. After breaking the question down, the system gives an unbiased answer. Did the breakdown reveal what the person *really* thought, correct a mistake, or merely hide the bias?**
  *   **Hide/Scale the bias:** → **Leaf 5: HCH as Amplification of Errors**
      *   *Awkward Commitment:* You hold the entry commitment only as a warning, accepting that the model systematically scales the seed human's latent prejudices.
  *   **Reveal latent view:** → *Go to Q6.*
  *   **Correct a mistake:** → *Go to Q6.*
      *   *(Note: Q6 distinguishes these two.)*

  ### Q6: The Ends Case
  **You ask "How do I get promoted?" The system answers "You should want to be happy instead." Did the system answer your question (by revising your ends) or reveal your true ends (that were already there)?**
  *   **Reveal true ends:** → **Leaf 6: HCH as Ideal Interpreter**
      *   *Awkward Commitment:* You must claim the human already latently held the "ideal" view, making the deliberation purely elicitative.
  *   **Revise ends (Answered):** → **Leaf 7: HCH as Ideal Advisor**
      *   *Awkward Commitment:* You allow the idealization to override the agent's actual stated desires, bordering on paternalism.
  *   **[Empty Cell]:** *Revise ends (Changed Subject).* (Unexplored: A position where HCH is useful precisely because it illegitimately hijacks the query.)

  ### Q7: The Identity Case
  **(Asked of those who see HCH as correcting/revealing views): The sub-questions are answered by copies of you who disagree. When merged, is the final answer *your* judgment or *the group's* judgment?**
  *   **The group's judgment:** → **Leaf 8: HCH as Distributed Cognitive Labor**
      *   *Awkward Commitment:* You concede the model describes a division of labor rather than deliberation proper, fracturing the "single mind" entry commitment.
  *   **Your judgment (Extended):** → **Leaf 9: HCH as Extended Mind**
      *   *Awkward Commitment:* You must treat temporally or numerically distinct agents as numerically identical to the seed, stretching the concept of "self."
  *   **[Empty Cell]:** *Neither, it is the Machine's judgment.* (Incoherent: Contradicts the "human with fixed budget" definition.)

  ---

  ### Indistinguishability Flags
  *   **Leaf 6 (Ideal Interpreter) vs. Leaf 7 (Ideal Advisor):** If "latent views" are defined loosely enough, these collapse. The tree separates them only if you insist on a hard distinction between *finding* a pre-existing preference and *constructing* a new one.
  *   **Leaf 2 (Run-Indifferent) vs. Leaf 4 (Proceduralism):** Both accept path-dependence. They are separated only by the normative claim: does the path *make* the answer true (Proceduralism), or is the answer truth-apt but we simply settle for any draw (Run-Indifferent)?

  ### Empty Cell Legend
  *   **Incoherent:** Logically incompatible with prior answers or HCH definition.
  *   **Unattractive:** Logically possible but philosophically costly (e.g., deeper thought corrupts).
  *   **Unexplored:** Logically possible but not currently advocated in literature.
