answer: |-
  **The Predictive Word**

  It is a comfortable reflex to assume that if I were alive to see the machines you describe, I would join the chorus of condemnation. Your friends at dinner are not wrong to suspect that I would find the "flat, competent, transatlantic house style" repugnant. But comfort is the enemy of clear sight, and there is a danger in simply transferring the hatred I felt for the *Times* leader-writers of the 1940s onto the algorithms of the 2020s. If we are to examine this properly, we must not start with the taste of the prose, but with the condition of the writer.

  You propose a paradox: that the Newspeak I described in *Nineteen Eighty-Four* was a language of scarcity, designed to shrink the mind by removing words, whereas your modern tools offer a surplus of words, shrinking the mind by selecting the most probable ones. You call this "Thesaurus Newspeak." This is a sharp observation, but it requires a correction. The mechanism of Newspeak was not merely deletion; it was the removal of *choice*. The goal was to make heretical thoughts "literally impossible, because there were no words in which to express them."

  The predictive machine does not remove the words from the dictionary. It removes the *effort* of selecting them. In *Politics and the English Language*, I argued that a writer chooses lazy phrasing because he is not sure what he means, and the lazy phrasing then ensures he never finds out. The machine accelerates this cycle. It offers you the clause before you have felt the thought. If you accept it, you are not thinking; you are recognising. You are nodding along to a rhythm that is not your own. The damage is not that the vocabulary is small, but that the *friction* is gone. A sentence should cost something to write. You should have to push against the language to make it tell the truth about a potteries street or a mining village. If the machine sands away the resistance, it sands away the reality.

  So, where is the tell? In my time, I looked for the dying metaphor, the operator, the pretentious diction, and the meaningless word. These will still be present, but they will be disguised. The new failure is the *average*. It is the sentence that has been optimised to offend no one and surprise no one. You mention "uniform sentence rhythm" and "symmetrical hedging." I would add the absence of the concrete noun. The machine prefers the abstract because the abstract is statistically safer. It will suggest "optimise the outcome" rather than "fix the roof." It will suggest "a period of significant adjustment" rather than "the dole queue."

  This brings us to the second point, which is the more dangerous one. You note that I held decayed prose to be a symptom of political and economic decay. If the prose is rotten, it is because the society is rotten. Therefore, to focus solely on the software is to treat the rash and ignore the fever. Who owns the machine? It is not a neutral instrument like a pen. It is a product designed by corporations to maximise engagement, speed, or safety. It is optimised for the average reader, which means it is optimised for the lowest common denominator of understanding.

  If a publisher can produce a serviceable book without you, they will. This is not a moral failing of the publisher; it is an economic inevitability. I wrote that "political language... is designed to make lies sound truthful and murder respectable." The language of the algorithm is designed to make content sound readable and risk non-existent. If you allow it to shape your sentences, you are allowing a commercial interest to dictate your perception of Stoke. The copyeditor who sands down your dialect is doing the same work as the machine, only slower. They are removing the particular to make way for the marketable.

  This leads to the question of where the line must be drawn. You ask if I would draw it further toward the sentence than your colleagues accept. I would. There is a distinction between a tool that serves the hand and a tool that serves the mind. A spellchecker corrects a slip of the finger; that is mechanical. A fact-checker corrects a slip of the memory; that is useful. But a sentence-generator corrects a slip of the *will*.

  If the machine suggests a metaphor, you must reject it. If it rearranges your clause to improve the "flow," you must inspect that flow to see what has been lost. Often, the awkwardness of a sentence is where the truth is hiding. The writer's job is to drag the truth into the light, even if it kicks. If you accept the machine's offer of smoothness, you are accepting a lie. The line is here: you may use the machine to transcribe, but never to compose. The moment the machine chooses the verb, you have ceased to be a writer and have become an editor of someone else's thoughts. And who is that someone? It is no one. It is the average of everyone.

  Now, we arrive at the uncomfortable place. Your friends want the tools banned or policed. They want a return to "human" writing enforced by rule. Here, I must disappoint them. I have always been suspicious of any orthodoxy, even one that claims to protect good taste. To ban the machine is to set up a new bureaucracy of language. It is to say that there is one correct way to write, and we will punish those who deviate. That is the road to Newspeak, not away from it.

  If a writer chooses to use the machine to write garbage, that is his right. The remedy for bad speech is more speech, better speech, not silence. If the publishers produce soulless books, the public must learn to reject them. But you cannot legislate against laziness. If you make the use of AI a crime, you do not cure the disease; you merely drive it underground. You create a class of offenders who are punished for being inefficient.

  So what is the answer? It is not a campaign. It is a discipline. It is the decision by individual writers to accept the burden of their own minds. You say you are tempted because it is fast. Speed is the enemy. In a healthy society, writing is a slow, difficult, often painful act of translation from thought to paper. If you speed it up, you are cutting out the translation. You are sending the raw signal, which is usually noise.

  To you, specifically: You write about the Midlands. You write about places that have been ignored, spoken for, or smoothed over by the London-centric machine. Your duty is not to make your prose "competent." Your duty is to make it true. If a character in Stoke says something that breaks the grammar rules of the transatlantic house style, you must keep it. If the rhythm of a sentence is jagged because the thought is jagged, you must keep it.

  The machine will tell you this is an error. The copyeditor will tell you this is confusing. They are wrong. Confusion is often the first step toward clarity. The machine offers you a world where everything is understood immediately and forgotten instantly. You must fight for a world where something is difficult to say, and therefore difficult to forget.

  Do not look for a law to save you. Do not look for a ban. Look at the sentence on the page. Ask yourself: "Did I think this, or did the machine predict it?" If you cannot tell the difference, you have already lost. And if you cannot tell the difference, you have no business writing novels. You are merely filling space. The political regeneration you hope for will not come from better tools. It will come from writers who are willing to be difficult, willing to be slow, and willing to be wrong, provided they are wrong in their own words.

  That is all. The rest is noise.
