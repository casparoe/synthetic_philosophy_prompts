answer: |-
  Here is a specification of desiderata for adjudicating evolutionary explanations, designed to force clarity in your seminar.

  ### The Desiderata for Evolutionary Explanation

  To answer "Why does this population have this trait?" adequately, a claim must satisfy the following conditions. I have marked **Non-Negotiable (NN)** requirements (conceptual necessities for the logic to hold) versus **Methodological Preferences (MP)** (specific tools favored by one camp but not logically required).

  1.  **Trait Individuation Criterion (NN)**
      *   **Requirement:** The explanation must specify the unit of selection/development being analyzed. It must state whether the "trait" is defined by its developmental module (e.g., the jaw-adductor complex), its morphological output (the crest), or its functional effect (defense).
      *   **Motivation:** Prevents the "single trait" fallacy where a pleiotropic complex is treated as one unit to hide byproduct relationships.
      *   **Skink Case:** *Fails.* The data conflates the crest (morphology) with the jaw attachment (development). Are we explaining the bone or the muscle?

  2.  **Origin vs. Utility Distinction (NN)**
      *   **Requirement:** The account must explicitly separate the *historical cause of the trait's increase in frequency* (origin) from the *current causal contribution of the trait to fitness* (utility).
      *   **Motivation:** Prevents the "Current Utility Fallacy" (assuming because it helps now, it evolved for that).
      *   **Skink Case:** *Mixed.* Clay models show current utility (defense); genome sweep shows historical selection. But mark-recapture shows no current survival benefit, and sister genus suggests different historical utility (burrowing).

  3.  **Selected-For vs. Selected-Of (NN)**
      *   **Requirement:** If claiming adaptation, one must demonstrate that the trait was the *cause* of the differential reproduction, not merely correlated with the true target of selection (Sober's distinction).
      *   **Motivation:** Distinguishes adaptation from hitchhiking or free-riding.
      *   **Skink Case:** *Fails.* The sweep could be on the bite-performance gene, with the crest riding along as a developmental consequence.

  4.  **Genesis vs. Maintenance (NN)**
      *   **Requirement:** The account must specify whether selection *built* the trait (genesis) or merely *prevents its decay* (maintenance/purifying selection).
      *   **Motivation:** A trait can be adaptive now (maintained by selection) but originated as a drift variant or byproduct.
      *   **Skink Case:** *Unclear.* The sweep suggests recent genesis, but the sister genus suggests the potential for ancient maintenance of the capacity to grow bone.

  5.  **Alternative Exclusion (MP)**
      *   **Requirement:** The proponent must provide positive evidence ruling out drift, constraint, or exaptation, rather than merely showing consistency with adaptation.
      *   **Motivation:** Adaptationism often fails by treating consistency as proof.
      *   **Skink Case:** *Fails.* The developmental link to jaw muscles provides a viable constraint/byproduct hypothesis that has not been ruled out.

  6.  **Independence of Evidence (MP)**
      *   **Requirement:** Evidence for function should not rely solely on the existence of the trait itself (e.g., optimality modeling must be tested against independent data, not just fit the trait).
      *   **Motivation:** Prevents circular "just-so" stories where the trait's existence proves the model which proves the trait.
      *   **Skink Case:** *Passes (partially).* Clay models provide independent evidence of predation pressure, though mark-recapture contradicts it.

  ### Meta-Analysis of the List

  *   **Non-Negotiable vs. Preference:** Items 1–4 are logical prerequisites for coherent evolutionary reasoning. Items 5–6 are methodological standards; strict adaptationists might argue 5 is too high a bar (inference to best explanation suffices), while structuralists argue 5 is the minimum.
  *   **Single Most Exclusionary Requirement:** **#3 (Selected-For vs. Selected-Of).** This excludes the vast majority of "adaptive stories" because demonstrating causal covariance between the specific trait variant and fitness, independent of correlated traits, is empirically devastatingly difficult.
  *   **The Incompatible Pair:** **#3 (Selected-For)** and **#6 (General Applicability).**
      *   *Conflict:* To satisfy #3 rigorously for *every* trait requires historical time-series data, ancient DNA, or experimental evolution that is impossible for most natural systems. To satisfy a programme that is "general enough to be worth running" (applicable to most traits in most taxa), you must relax #3 to inference from comparative data. You cannot have demonstration-grade historical evidence for every trait *and* a general programme for studying them.

  ### Application: The Alpine Skink Case

  | Desideratum | Status in Skink Case | Implication |
  | :--- | :--- | :--- |
  | **1. Individuation** | **Failed** | Crest and jaw muscle are developmentally coupled. We do not know if they are one trait or two. |
  | **2. Origin vs. Utility** | **Conflicted** | Utility (defense) is supported by models but not mark-recapture. Origin (sweep) is supported but target is ambiguous. |
  | **3. Selected-For** | **Unproven** | Sweep could be on bite force; crest could be a hitchhiker. |
  | **4. Genesis vs. Maintenance** | **Ambiguous** | Sweep suggests genesis, but sister genus suggests the *capacity* is ancestral (exaptation). |
  | **5. Alt. Exclusion** | **Failed** | Developmental constraint (jaw mechanics) is a viable rival not ruled out. |
  | **6. Indep. Evidence** | **Mixed** | Clay models are independent, but conflict with mark-recapture data. |

  **Verdict:** The case is currently **undecidable**. It is equally consistent with:
  1.  **Adaptation:** Crest evolved for defense (sweep + clay models), mark-recapture misses rare predation events.
  2.  **Byproduct:** Jaw muscle evolved for bite (sweep + performance); crest is a structural consequence (constraint).
  3.  **Exaptation:** Crest evolved for burrowing (sister genus), co-opted for defense (clay models), but currently neutral (mark-recapture).

  **The Single Further Observation:**
  **Experimental decoupling of the crest from the jaw muscle.**
  If you can genetically or surgically alter the crest *without* altering bite performance (or vice versa) and measure survival, you break the correlation. If crest-less skinks with normal bites suffer higher predation, it is an adaptation. If they do not, it is a byproduct of the bite adaptation.

  ### The Bonus Question: The Invariant Optimum

  > *Can a trait whose shape matches an engineering optimum to within a few percent but which is invariant across forty species ever satisfy the list?*

  **No.** It cannot satisfy **Desideratum #3 (Selected-For)** or **#5 (Alternative Exclusion)**.

  *   **Reasoning:** Invariance across 40 species implies a lack of variance. Without variance, you cannot demonstrate a covariance between trait value and fitness (Selected-For). Furthermore, invariance is the hallmark of **developmental constraint** (the system cannot produce other variants) just as much as it is of **stabilizing selection** (all other variants are killed).
  *   **The Trap:** Matching an engineering optimum is necessary for adaptation, but not sufficient. A constrained trait will often look "optimal" simply because the only physically possible solution is the one that exists. Without phylogenetic independence (e.g., the trait evolving multiple times independently) or evidence of historical variance, you cannot distinguish "Selection found the only working solution" from "Development could only build this one solution."
  *   **Seminar Lesson:** Use this to show that **Optimality $\neq$ Adaptation.** Optimality is a claim about design; Adaptation is a claim about history. Without history (variance/phylogeny), the claim is unfalsifiable.
