prompt: |-
  I'm in the second year of a PhD in evolutionary biology, and this term I'm running the graduate seminar in which every discussion of a trait collapses into the same stalemate: half the room wants to know what the trait is for, the other half wants to know why it is there, and everyone slides between the two without noticing. Before I assign any more of the classic adaptationism debate — the spandrels critique, the exaptation literature, optimality modelling, the comparative method — I want a specification of what an adequate answer to the question "why does this population have this trait?" would actually have to deliver, on either side of the dispute. So please write me the desiderata: what a claim that a trait is an adaptation must establish, and, symmetrically, what a claim that it is a structural byproduct, a developmental constraint, a co-opted relic, or drift must establish, with the case or consideration that motivates each requirement. Include the distinctions a theory in this area is not allowed to collapse — current utility versus historical origin, the trait now having an effect versus having been selected for it, selection maintaining a variant versus selection having built it — and say whether an adequate account may return a mixed verdict or must pick one. I also want a criterion about how traits get individuated in the first place, since in my material it is often unclear whether we are looking at one trait or three. Mark which requirements are non-negotiable and which are really methodological preferences of one camp, tell me which single requirement excludes the most candidate explanations, and flag any pair you suspect cannot be jointly satisfied — that is the part I most want, since I suspect the list is asking for demonstration-grade evidence from every trait while also wanting a programme general enough to be worth running.

  To keep this from being an exercise in recall, apply the criteria to a case I've constructed rather than the three textbook examples my students always reach for. A lineage of alpine skinks has a bony supraorbital crest in four of eleven populations; the four are exactly the populations that overlap a visually hunting bird, clay models with the crest are attacked less often than shaved models, and a genome scan shows a recent sweep in the crest region. Against this: five years of mark–recapture finds no survivorship difference between crested and crestless individuals, the crest forms as a mechanical consequence of a shifted jaw-adductor attachment that does improve bite performance, and in the sister genus the same outgrowth serves in burrowing. Each desideratum should say how this case fares under it, and the list should end by naming the single further observation that would do most to settle it. Then, briefly, say whether a trait whose shape matches an engineering optimum to within a few percent but which is invariant across forty species can ever satisfy the list — where the only comparison available is the engineering model itself. Keep any scorecard of the named positions to a few lines; the criteria and their motivating cases are what I need.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** 2nd-year PhD student in evolutionary biology running a grad seminar.
      *   **Problem:** Seminar discussions stall on the adaptationism debate (function vs. origin/history). Students slide between "what is it for?" and "why is it there?" without distinction.
      *   **Task:** Create a list of *desiderata* (requirements) for an adequate answer to "why does this population have this trait?" covering both adaptationist and non-adaptationist claims.
      *   **Specific Requirements:**
          *   Define what an adaptation claim must establish.
          *   Define what a byproduct/constraint/drift claim must establish.
          *   Include key distinctions (utility vs. origin, effect vs. selected-for, maintenance vs. build).
          *   Address mixed verdicts vs. exclusive choices.
          *   Address trait individuation (one trait or three?).
          *   Mark requirements as Non-Negotiable (NN) vs. Methodological Preference (MP).
          *   Identify the single requirement that excludes the most candidate explanations.
          *   Flag any pair of requirements that cannot be jointly satisfied (the tension between evidence standards and generality).
          *   **Application:** Apply criteria to a specific constructed case (Alpine skinks with supraorbital crests).
          *   **Ending:** Identify the single further observation needed to settle the skink case.
          *   **Bonus Question:** Address a trait matching an engineering optimum but invariant across 40 species (no comparative data).
          *   **Constraint:** Keep scorecards of positions brief; focus on criteria and motivating cases. Avoid simple recall.

  2.  **Deconstruct the Scientific Problem:**

      *   The core issue is the distinction between *Current Utility* (What does it do now?) and *Historical Origin* (Why did it evolve?).
      *   Gould & Lewontin's "Spandrels" critique is central here.
      *   Mayr's proximate/ultimate distinction is relevant but needs refinement (ultimate includes both history and function).
      *   The "Selected-For" distinction (Sober) is crucial.
      *   Trait individuation is a metaphysical/methodological hurdle (is the crest a trait, or is it a symptom of jaw muscle attachment?).

  3.  **Drafting the Desiderata (The Core List):**

      *   *Requirement 1: Trait Individuation.* Before asking why, define *what*. Is the crest the trait, or the muscle attachment?
      *   *Requirement 2: Historical Origin vs. Current Utility.* Must distinguish why it *arose* vs. what it *does*.
      *   *Requirement 3: Selection for vs. Selection of.* (Sober). Did selection cause the frequency increase, or did it just track with it?
      *   *Requirement 4: Maintenance vs. Genesis.* Did selection build it, or does selection just keep it from decaying?
      *   *Requirement 5: Alternative Explanations.* Must rule out drift, constraint, or exaptation.

      *Refining for the Prompt's Specifics:*
      *   Need to mark NN vs. MP.
      *   Need to identify the "exclusionary" requirement.
      *   Need to identify the "incompatible pair."

      *Drafting the Tension:* The tension is usually between *Historical Reconstruction* (requires phylogenies, fossils, ancient DNA) and *General Applicability* (we often only have extant data). Or, between *Optimality* (requires variation) and *Constraint* (explains lack of variation). Let's look for the pair the user hinted at: "demonstration-grade evidence from every trait while also wanting a programme general enough to be worth running." This suggests the tension is between *Rigorous Historical Proof* (NN) and *Feasibility/Generality* (MP).

  4.  **Applying to the Skink Case:**

      *   *Data:*
          *   Crest in 4/11 populations.
          *   Overlaps bird predator.
          *   Clay models: Crest = less attack (Utility).
          *   Genome scan: Recent sweep in crest region (Selection signal).
          *   Mark-recapture: No survivorship difference (Contradicts utility?).
          *   Development: Mechanical consequence of jaw muscle (Constraint/Byproduct).
          *   Jaw muscle: Improves bite (Adaptation?).
          *   Sister genus: Crest used for burrowing (Exaptation potential).

      *   *Analysis:*
          *   Individuation: Is it the crest or the muscle?
          *   Origin: Sweep suggests selection, but on what? Muscle (bite) or Crest (defense)?
          *   Utility: Clay models say defense, Mark-recapture says null.
          *   History: Sister genus suggests burrowing origin (exaptation) or shared constraint.

  5.  **Addressing the Bonus Question (Invariant Optimum):**

      *   Trait matches engineering optimum.
      *   Invariant across 40 species.
      *   No comparison available.
      *   *Problem:* Cannot distinguish stabilizing selection (adaptation) from developmental constraint (invariance). If it's invariant, there's no variation for selection to act on *now*, and we can't see the history of change.

  6.  **Developing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the pedagogical value. Set the stage.
      *   **The Desiderata List:**
          1.  *Individuation:* Define the unit. (NN)
          2.  *Causal History:* Distinguish origin from maintenance. (NN)
          3.  *Selected-For:* Distinguish effect from cause of spread. (NN)
          4.  *Exclusion:* Rule out drift/constraint. (MP/NN hybrid?)
          5.  *Independence:* Evidence for function shouldn't rely solely on the trait's existence.
      *   **Marking NN vs. MP:**
          *   NN: Distinction between origin/utility, Selected-for, Individuation.
          *   MP: Optimality modeling, Comparative method (methods to prove the NNs).
      *   **The Exclusionary Requirement:** "Selected-For" (requires historical covariance).
      *   **The Incompatible Pair:** "Historical Specificity" (needs deep data) vs. "Programmatic Generality" (needs to apply to all traits).
      *   **Skink Application:** Walk through the criteria.
      *   **The Deciding Observation:** Needs to decouple crest from muscle.
      *   **Bonus Question:** The Invariant Optimum.

  7.  **Refining the Logic (Self-Correction during drafting):**

      *   *Critique:* Is "Selected-For" really a requirement or a definition? It's a requirement for an *adaptationist* claim. A non-adaptationist claim needs to establish the alternative mechanism.
      *   *Correction:* Frame the desiderata as conditions for *adjudicating* the question, regardless of the answer.
      *   *Tension:* The user asks for a pair that cannot be jointly satisfied. The prompt hints: "demonstration-grade evidence... while also wanting a programme general enough." This is the *Evidence Standard vs. Feasibility* tension. I need to formalize this. Let's call it "Historical Resolution" vs. "Systematic Scope."
      *   *Skink Nuance:* The genome sweep indicates selection, but the mark-recapture indicates no *current* survival benefit. This suggests the selection might be on the *muscle* (bite), with the crest as a hitchhiker (byproduct), OR the selection was historical (bird pressure changed), OR the mark-recapture is missing the predation event (birds are rare but lethal). The clay model supports the bird hypothesis. The sister genus supports the burrowing hypothesis (exaptation).
      *   *Individuation:* This is key. If the crest is developmentally tied to the muscle, they are one pleiotropic unit. If they can be separated, they are two.
      *   *Bonus:* Invariant trait = no variance. No variance = hard to test selection vs. constraint. Matching optimum = suggests function. But without phylogeny, could be ancestral constraint.

  8.  **Final Polish:**

      *   Tone: Academic, precise, peer-to-peer (PhD to PhD).
      *   Formatting: Clear headings, bullet points for desiderata.
      *   Check constraints: "Keep any scorecard... to a few lines." "Mark which requirements are non-negotiable." "Flag any pair you suspect cannot be jointly satisfied."

      *(Self-Correction on the "Incompatible Pair"):* The prompt asks to flag a pair *within the list* of desiderata that I suspect cannot be jointly satisfied.
      *   Candidate 1: "Rule out all alternatives" vs. "Feasible data."
      *   Candidate 2: "Trait Individuation based on development" vs. "Trait Individuation based on function."
      *   Let's go with the Evidence Tension: *Requirement A: Establish Historical Causation (requires time-series/fossils/ancient DNA)* vs. *Requirement B: General Applicability (must work for extant-only taxa).* You can't have deep historical proof for every trait in every extant taxon.

      *(Refining the Skink Decider):* What settles it? We need to break the correlation between the crest and the muscle. Experimental manipulation that alters the crest *without* altering the bite. If survival drops, it's adaptation. If not, it's a byproduct.

      *(Refining the Bonus):* Invariant across 40 species. If it matches optimum, it looks adapted. But invariance suggests constraint. Without phylogeny (independent origins), you can't distinguish convergence (adaptation) from stasis (constraint/ancestral).

  9.  **Final Review against Prompt:**
      *   Desiderata for adaptation AND non-adaptation? Yes.
      *   Distinctions included (utility/origin, effect/selected-for, maintenance/build)? Yes.
      *   Mixed verdict allowed? Yes.
      *   Trait individuation criterion? Yes.
      *   NN vs MP marked? Yes.
      *   Single most exclusionary requirement? Yes.
      *   Incompatible pair flagged? Yes.
      *   Apply to Skink case? Yes.
      *   Single further observation for Skink? Yes.
      *   Bonus question on invariant optimum? Yes.
      *   Scorecard brief? Yes.

