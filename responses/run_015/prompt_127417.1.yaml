  **MINUTES OF THE AD HOC COMMITTEE ON UNPERCEIVED SPACE**
  **Date:** 14 October 2023
  **Present:** Dr. A. Sterling (Chair), B. Miller (Facilities), C. Dao (Finance), D. Wright (HR)

  **1.0 Call to Order**
  The Committee convened to operationalize Trustee Directive 11-I regarding Ontological Fiscal Responsibility. The Chair reiterated the Trustees' acceptance of the master argument for idealism: specifically, that one cannot frame the thought of a thing existing unperceived, as the act of framing supplies an idea, and an idea exists only within a perceiving mind. Consequently, space unattended by sensory input constitutes no institutional liability. It was agreed that administrative policy must reflect this epistemological constraint.

  **2.0 Resolutions on Space Inventory**
  It was moved and seconded that the College space inventory be adjusted to reflect only simultaneous observation.
  **Resolution 2.1:** Rooms currently unoccupied shall be struck from the square-footage inventory effective immediately. Heating and insurance costs for said rooms shall be prorated to intervals of actual occupancy. If no eye falls upon the boiler room, the boiler is not costing the College money.
  **Resolution 2.2:** A moratorium is placed on all new construction. A building no one has yet visited cannot be shown to be needed, as its necessity cannot be conceived without thereby conceiving its existence, which negates the requirement for physical construction. Funds are frozen pending initial visitation protocols.

  **3.0 Continuity of Existence**
  Member Dao raised the issue of nocturnal continuity. It was agreed that the campus requires sensory validation during non-business hours to prevent ontological collapse.
  **Resolution 3.1:** The position of Perpetual Perceiver (Night Shift) is created. The incumbent shall maintain visual contact with primary structural load-bearing walls.
  *Footnote 3.1.a:* An objection was recorded regarding Divine Perception. It was noted that an uninterrupted divine perception already performs this work. The Committee determined that reliance on non-contractual divinity presents audit risks and lacks invoiceable hours. The position remains budgeted.

  **4.0 Ontological Staffing Status**
  Member Wright noted that the Perpetual Perceiver is herself a collection of ideas within the Committee's mind, and thus requires perceiving to exist.
  **Resolution 4.1:** A Subcommittee on Recursive Perception is struck to determine if the Perceiver must be perceived by a Senior Perceiver, or if a rotation of mutual observation satisfies the bylaws. The Subcommittee shall report when it has successfully convened.

  **5.0 Adjournment**
  The meeting adjourned at 4:00 PM. The next meeting is scheduled for next Tuesday, provided the concept of a future meeting remains coherent under Directive 11-I.

  **APPENDIX A: BUDGET IMPLICATIONS**
  Facilities costs reduced by 85%. Savings reallocated to Perpetual Perceiver salary ($45,000) and Subcommittee travel (pending existence of travel). Utilities budget amended to reflect intermittent reality.

  **APPENDIX B: STAFFING TABLE**
  | Position | FTE | Status |
  | :--- | :--- | :--- |
  | Facilities Manager | 0.4 | Active only when observed |
  | Perpetual Perceiver | 1.0 | Vacant |
  | Subcommittee Chair | 0.1 | Conceptual |

  **APPENDIX C: CONCEPTUAL BOUNDARY ISSUES**
  Concerns were raised regarding the extension of Directive 11-I to personnel and temporal planning. If an idea exists only in a perceiving mind, it remains unclear how to budget for a colleague currently at home, as framing the thought of their absence supplies an idea of them, yet their physical presence is unverified. Similarly, scheduling a meeting for next Tuesday requires conceiving of a future time, which may constitute an impermissible assertion of unperceived temporal space. The Committee noted that distinguishing between having an idea of a thing and perceiving that thing seems increasingly difficult, but tabled the distinction to avoid delaying the heating shutdown. The implication that nothing exists beyond the current mental act was noted as a potential barrier to long-term strategic planning, but no motion was made to address it.
