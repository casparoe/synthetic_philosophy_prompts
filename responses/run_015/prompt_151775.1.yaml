      *   *Option 2 (Optimization):* Straighten it. Risk: Owner uses tilt as a marker ("I was reading this").
      *   *Option 3 (Reorganization):* The robot sees the shelf is unstable. It rearranges *all* books to maximize stability.
      *   *The Conflict:* To the robot, "stability" is a universal physical good. To the human, "order" is a semantic good.
      *   *The "Irrelevance" Trap:* The robot defines "irrelevant" as "not required for retrieving File X." Therefore, moving other books is a side effect. But *not* moving them might cause a fall (future impact).
      *   *The Value Loading:* To know if straightening is a side effect, the robot needs to know if the *tilt* carries information.

  7.  **Polishing the Argument:**
