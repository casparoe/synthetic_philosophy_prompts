      *   **Goal:** Illustrate how defining "irrelevance" or "side effects" implicitly requires knowing human values.

  2.  **Deconstruct the Core Problem:**
      *   The "Low-Impact" problem asks an AI to achieve goal $G$ while minimizing change to the rest of the world state $S$.
      *   Formalization often looks like: Maximize $U(G)$ - $\lambda \cdot \text{Impact}(S_{initial}, S_{final})$.
      *   The snag: What counts as "Impact"? Usually, it's defined as deviation from a baseline (like "inaction").
      *   The deeper snag: Some changes are *neutral* or *positive* but look like "impact" physically. Some changes are *negative* but look like "no impact" physically (e.g., information leakage).
      *   The specific snag requested: Distinguishing "task-relevant change" from "side effect" requires knowing what properties of the world matter to the user.

  3.  **Brainstorming Scenarios:**
