answer: |-
  # Desiderata for a Normative Theory of Constitutional Precommitment

  An adequate normative theory of constitutional precommitment must resolve the tension between democratic self-government and the temporal extension of political authority. It must explain why a present polity is justified in restricting the decision-making capacity of its successors, without collapsing into either anarchic presentism or dead-hand control. The following list enumerates the necessary conditions (desiderata) such a theory must satisfy, along with the conceptual tensions motivating them.

  ### 1. The Sovereignty Continuity Condition
  **Desideratum:** The theory must explain how the constituent power ("We the People") retains its identity over time despite changes in population, culture, and circumstance. It must articulate why the sovereign authority of the present generation is not absolute but is instead continuous with the sovereign authority of the founding generation.
  **Motivating Tension:** The Paradox of Sovereignty. If the people are sovereign, they cannot be bound by prior laws without ceasing to be sovereign. However, if they are not bound by prior laws, the constitution is merely a statute, revocable at will. A theory must reconcile the idea of a continuous demos with the reality of discrete generational turnover. If the demos is reconstituted every election or every generation, precommitment is conceptually impossible; if the demos is eternal, present democracy is illusory.

  ### 2. The Asymmetry of Entrenchment
  **Desideratum:** The theory must justify why constitutional provisions exhibit a gradient of entrenchment, where some clauses (e.g., fundamental rights) are nearly immutable, while others (e.g., procedural rules) are amendable by ordinary or supermajoritarian legislative processes. It must determine whether this asymmetry tracks a morally relevant distinction between types of norms or merely reflects contingent historical path-dependency.
  **Motivating Case:** In many constitutions, equal protection clauses require supermajorities to amend, while tax provisions may be altered by simple majority. An adequate theory cannot treat all precommitments as equal. It must explain why entrenching a specific electoral map is normatively different from entrenching a prohibition on torture. If the theory cannot distinguish between substantive entrenchment (protecting values) and procedural entrenchment (protecting interests), it fails to explain the hierarchical structure of constitutional law.

  ### 3. The Intergenerational Moral Risk Condition
  **Desideratum:** The theory must account for the epistemic limitations of the present generation regarding long-range problems. It must provide criteria for when it is permissible to lock in governance structures for issues like climate change or technological regulation, balancing the risk of policy obsolescence against the risk of future inaction.
  **Motivating Tension:** Future generations may face existential threats that require rigid constraints on resource extraction or technological deployment. However, the present generation cannot foresee the specific technological or social conditions of the future. A theory that permits too much entrenchment risks imposing harmful obsolescence (e.g., banning technologies that would solve the very problems they were meant to mitigate). A theory that permits too little risks catastrophic failure due to future short-termism. The theory must define the scope of "future-proofing" without claiming prophetic authority.

  ### 4. The Temporal Directionality (Reverse-Ulysses) Condition
  **Desideratum:** The theory must address the "Reverse-Ulysses" scenario, in which a future majority wishes to preserve a constraint that the present generation seeks to remove. It must state whether temporal direction is morally asymmetrical (i.e., the past binds the future, but the future cannot bind the past) or whether legitimacy conditions apply regardless of which generation initiates the binding or unbinding.
  **Motivating Case:** Suppose a future generation values the stability provided by a specific constitutional constraint (e.g., a balanced budget amendment) that the present generation views as an obstacle to necessary spending. If the present generation removes the constraint, they are overriding the future's desire for self-binding. If the theory treats precommitment as purely a gift from the past to the future, the future's desire is irrelevant. If the theory treats it as a reciprocal democratic practice, the present generation may be violating the future's right to self-bind by removing their shackles. The theory must clarify if the right to precommit includes a right to *remain* precommitted against a present unbinding.

  ### 5. The Domination Threshold
  **Desideratum:** The theory must distinguish between legitimate precommitment (protecting the conditions of democracy) and illegitimate domination (entrenching the power of a faction). It must provide a substantive or procedural test to identify when a constitutional clause ceases to be a commitment and becomes an instrument of oppression.
  **Motivating Tension:** Precommitment is often justified as protecting minorities from majorities. However, minorities can also use constitutional entrenchment to protect privileges against democratic majorities (e.g., property clauses that prevent redistribution). A theory that defines precommitment solely by procedure (e.g., "it was ratified correctly") fails to distinguish between a bill of rights and a clause entrenching slavery. The theory must identify the point at which constraint becomes domination, likely by referencing the preservation of democratic agency itself.

  ### 6. The Perpetuity Limit
  **Desideratum:** The theory must distinguish between having the authority to bind and having the authority to bind in perpetuity. It must determine whether there is a temporal or substantive limit to entrenchment, specifically addressing "eternity clauses" that declare certain provisions unamendable forever.
  **Motivating Case:** If a generation declares a provision unamendable in perpetuity, they are asserting that no future generation can ever exercise constituent power over that issue. This effectively ends democracy regarding that subject. An adequate theory must decide if a generation can waive the right of their successors to amend. If the theory allows perpetual binding, it negates the Sovereignty Continuity Condition; if it forbids it, it undermines the credibility of the most solemn constitutional promises.

  ### 7. The Credibility-Revisability Trade-off
  **Desideratum:** The theory must acknowledge and manage the tension between credible long-term commitment and democratic revisability. It must identify this pair as jointly unsatisfiable in the strong sense: a commitment cannot be perfectly credible and perfectly revisable simultaneously.
  **Motivating Tension:** For a precommitment to function (e.g., to encourage long-term investment or protect rights), it must be costly to break (Credibility). For a polity to remain democratic, it must be able to adapt to new values and circumstances (Revisability).
  **Joint Unsatisfiability:** These two values are in zero-sum tension. High credibility requires high rigidity; high revisability requires low rigidity.
  **Status:** This is not a fatal flaw but a constitutive trade-off that must be managed. An adequate theory cannot resolve the tension by eliminating one side; it must provide a framework for optimizing the balance, perhaps by distinguishing between core constitutional essentials (high credibility) and operational statutes (high revisability).

  ***

  # Evaluation of Broad Theoretical Families

  Two broad families of account dominate the landscape of constitutional theory. Their performance against the desiderata above highlights the structural difficulties of the field.

  **1. Constitutions as Pre-Political Contracts (Foundationalism)**
  This family treats the constitution as a foundational moment of agreement that establishes the rules of democratic engagement, analogous to a social contract.
  *   **Strengths:** This account fares well on the **Credibility** side of the Trade-off (Desideratum 7) and offers a strong explanation for **Asymmetric Entrenchment** (Desideratum 2) by distinguishing between the constituent power (which makes the constitution) and the constituted power (which operates within it). It naturally supports the idea that some things are off-limits to ordinary majorities.
  *   **Weaknesses:** It struggles significantly with the **Sovereignty Continuity Condition** (Desideratum 1), as it relies on a fictionalized consent of the dead over the living. It faces severe difficulties with **Intergenerational Moral Risk** (Desideratum 3), as it assumes the founders had the authority to solve problems for all time. It often fails the **Domination Threshold** (Desideratum 5) if it treats all ratified constraints as equally legitimate regardless of their substantive impact on future agency.

  **2. Constitutions as Revisable Frameworks (Deliberativism)**
  This family treats constitutions as evolving frameworks for ongoing democratic deliberation, where meaning and authority are continuously renegotiated.
  *   **Strengths:** This account excels at satisfying the **Sovereignty Continuity Condition** (Desideratum 1) and the **Perpetuity Limit** (Desideratum 6), as it denies the possibility of binding the future in perpetuity. It handles **Intergenerational Moral Risk** (Desideratum 3) well by allowing adaptation to unforeseen circumstances.
  *   **Weaknesses:** It fares poorly on the **Credibility** side of the Trade-off (Desideratum 7). If the constitution is always open to renegotiation, it loses its precommitment force. It also struggles to justify **Asymmetric Entrenchment** (Desideratum 2); if everything is revisable through deliberation, the distinction between constitutional and ordinary law blurs. Furthermore, it has difficulty addressing the **Reverse-Ulysses** scenario (Desideratum 4), as it prioritizes the present generation's deliberative capacity over the future generation's desire for constraint.

  **Conclusion on Theoretical Adequacy**
  Neither family satisfies all desiderata without significant cost. Foundationalism secures commitment at the expense of democratic legitimacy over time; Deliberativism secures legitimacy at the expense of commitment. An adequate normative theory must therefore be hybrid in nature, accepting the **Credibility-Revisability Trade-off** not as a problem to be solved, but as the defining feature of constitutional democracy. It must locate the **Domination Threshold** not in the text itself, but in the preservation of the future's capacity to exercise constituent power, thereby satisfying the **Perpetuity Limit** while allowing for **Asymmetric Entrenchment** of those very democratic capacities.
