answer: |-
  Hey, it is good to hear from a fellow traveler who remembers the old days, and I think you are right to want a spec rather than a survey because the history of philosophy of science is basically a graveyard of tools that work great in hindsight and terrible in the lab. If we are building a rule for resource allocation rather than truth-seeking alone, the first non-negotiable requirement is that the rule must output a decision variable, not just an epistemic status, meaning it has to distinguish between the claim that a programme is degenerating and the claim that you should abandon it, since you might stay in a sinking ship if the lifeboats are full of sharks. The second requirement is real-time operability, which means the metrics must be calculable from currently available data without knowing the future trajectory of the field, so you cannot define progress by what eventually turns out to be true. The third is anti-gaming robustness, requiring that the metric cannot be optimized by the practitioners without actually producing the desired scientific output, because grant panels are adversarial environments where Goodhart's law is the dominant force.

  When we look at your specific edge cases, the rule needs to handle the zombie programme by separating instrumental reliability from ontological commitment, allowing you to fund a tool everyone knows is false if it keeps landing predictions, provided the cost of switching is higher than the cost of the known error. For the black-box machine learning programme, the rule must value output reliability over mechanistic explainability if the goal is prediction, but demand explainability if the goal is intervention, acknowledging that a high hit rate on novel predictions is sufficient for utility even if the core is unintelligible. The shotgun programme requires a penalty for unregistered predictions or a statistical adjustment for multiple comparisons, so that emitting thousands of predictions and reporting the hits does not count as progress. The absorber programme needs a complexity cost function, where explaining a rival's success as a limiting case only counts as progress if the complexity added to the core is less than the precision gained, otherwise it is just degenerative patching. For the priced-out programme, the rule must treat the cost of evidence as a variable in the expected value calculation, acknowledging that a test costing a billion dollars and thirty years is effectively unfalsifiable for now, which changes the funding decision even if it doesn't change the epistemic status. Finally, for the degenerating programme with no rival, the rule must allow for continued investment if the expected value of information from staying exceeds the cost, even if the programme is technically stagnating, because leaving a field entirely has its own opportunity costs.

  Regarding your suspicions, you are correct that the requirement to cash out in novel predictions is a prejudice of the Popperian camp and should be marked as optional, because it fails the black-box case where predictions are high-quality but not necessarily novel in the theoretical sense, and it is too easy to game in the shotgun case. You are also right that the hard core plus protective belt distinction is close to tautological for this purpose, as it describes the structure of a programme but does not tell you when the belt is too thick, so that should be demoted to a descriptive tool rather than a normative rule. The non-negotiables are the decision-link, the real-time operability, and the anti-gaming constraint, because without those you are writing history rather than allocating grants.

  The part where the list fights itself is genuine and I think unavoidable, specifically the tension between real-time operability and the prohibition on premature death. If you require a verdict now, you will inevitably declare programmes dead that later revive, but if you wait for enough data to be sure, you violate the real-time constraint and fail the job of allocating resources this year. This makes the whole thing slightly self-defeating because any rule strict enough to prevent wasting money on zombies will be too strict to nurture fragile new paradigms, and any rule flexible enough to allow for revival will be too loose to stop the shotgun artists. The anti-gaming requirement also pulls against applicability, because the more explicit you make the metric to ensure usability, the easier it is for scientists to optimize the metric rather than the science, but if you keep it vague to prevent gaming, the grant panel cannot use it consistently.

  The single requirement that knocks out the most candidates is the decision-link, because almost every existing philosophical framework tells you what to believe about truth but none of them tell you what to do with your budget when the truth is uncertain. Lakatos fails on real-time operability because degeneracy is only visible in hindsight, so his rule cannot help a panel deciding today. Popper fails on the priced-out case because he treats all falsification equally regardless of cost, which makes his rule unusable for big science. A straight expected-value-of-information Bayesian rule succeeds on the decision link but fails on the anti-gaming constraint because priors are too subjective to audit in a panel, allowing practitioners to justify anything with a convenient prior.

  I hope this helps you scratch the itch, and let me know if you want to dive deeper into the complexity cost function for the absorber case because that is where I think the real work lies.
