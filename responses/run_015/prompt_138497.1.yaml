answer: |-
  This is a high-wire act. You are asking students to generate a philosophical conclusion through embodied experience while preventing them from intellectualizing the trap too early. Given their background in population ethics, they are hyper-vigilant. If they smell "Repugnant Conclusion," they will game the activity to avoid the conclusion rather than engage with the mechanism.

  Here is the design. It prioritizes the *reality* of the cost in Stage 1 to prevent deflation, and structures Stage 2 to force them to articulate the breaking point of their own intuition.

  ### 1. Logistics & Materials

  *   **Room:** Seminar table or clustered chairs (must see each other).
  *   **Materials:**
      *   18 identical small slips of paper (cut index cards).
      *   18 pens.
      *   One collection box (a backpack or hat).
      *   Timer (projected or on your phone).
      *   Whiteboard + markers.
  *   **Currency:** **Class Time.** Specifically, mandatory silent writing/reflection time at the end of the session.
      *   *Why:* Money creates equity issues; raffle tickets feel fake. Time is universally valued, fungible, and the loss is felt immediately.
      *   *Rate:* Each "Yes" vote adds **5 seconds** to the mandatory end-of-class silence.
      *   *Math:* 18 students × 5 seconds = 90 seconds. 5 seconds is below the threshold of conscious annoyance for an individual decision. 90 seconds of forced silence is palpable.

  ### 2. Minute-by-Minute Timeline (90 Minutes)

  *   **00:00 – 00:05 (Entry):** Students enter. Slips and pens are already on seats. Board is blank.
  *   **00:05 – 00:20 (Stage 1: The Switch):** Instructions, voting, counting, and *enforcement* of the time penalty.
  *   **00:20 – 00:25 (Transition):** Clear slips. Reset board.
  *   **00:25 – 01:05 (Stage 2: The Comparison):** Four rounds of voting/discussion (Base, Imperceptible, Risk, Shape).
  *   **01:05 – 01:25 (Debrief & Reveal):** Connect activity to theory, name the problem, discuss limitations.
  *   **01:25 – 01:30 (Exit):** One-sentence reflection slip.

  ### 3. Board Script & Slip Wording

  **Board Script (Write this *exactly* in this order):**

  1.  *(Top Left, during Stage 1)*
      **Decision:** Add 5 seconds to end-of-class silence?
      **Yes** / **No**
      **Anonymous.**
      **Total time = Sum of decisions.**

  2.  *(Erase. Top Center, during Stage 2)*
      **Choice A:** 1 Person → 1 Hour Severe Migraine
      **Choice B:** N People → 1 Minute Mild Headache
      *(Leave space below to update N)*

  3.  *(During Variants, update the "Choice B" line only)*
      **Var 1:** N People → 1 Second Dust Speck (Unnoticed)
      **Var 2:** N People → (1/N) Chance of 1 Hour Migraine
      **Var 3:** 1 Person → N Dust Specks  **VS**  N People → 1 Dust Speck

  **Slip Wording (Stage 1):**
  > **Do you authorize adding 5 seconds to the mandatory end-of-class silence?**
  > [ ] YES
  > [ ] NO
  > *Your decision is anonymous. The total time is the sum of all YES votes.*

  ### 4. Stage 1: The Switch Game (Execution)

  **The Script (What you say):**
  "Pick up the slip. Read it. You have 60 seconds. Fold it once. Put it in the box. Do not discuss."

  **The Trap:**
  You must not explain *why* or *what it proves*. You must not say the cost is small. You must not say the total will be large. Let them assume the total might be zero, or 5 seconds, or 10 minutes. The ambiguity is necessary.

  **The Reveal:**
  1.  Count the "Yes" slips aloud. (e.g., "14 Yes.")
  2.  Calculate the time aloud. ("14 times 5 is 70 seconds.")
  3.  **Crucial:** Set the timer immediately. "We will now sit in silence for 70 seconds. No phones, no packing up."
  4.  Sit in silence with them. Do not work. Just sit. This validates the cost.

  **Why this works:**
  It forces them to be *causal agents* in a collective harm where individual causality is invisible. If they vote Yes, they cannot claim later that "one vote doesn't matter." They just made it matter.

  ### 5. Stage 2: The Comparison (Execution)

  **Method:** Hand votes. "Show of hands for A. Show of hands for B."
  **Rule:** You must choose one. No abstentions.

  **Round 1 (Base Case):**
  *   **A:** 1 Person gets 1 Hour Severe Migraine.
  *   **B:** 2 People get 1 Minute Mild Headache.
  *   *Action:* Vote. Most pick B.
  *   *Action:* Double N. 4 People. 8 People. 16 People. 32 People...
  *   *Stop Point:* When the class majority flips to A. Record this N on the board. (e.g., N=500).
  *   *Note:* Since there are only 18 students, you are asking them to judge hypothetically for N > 18. This is unavoidable.

  **Round 2 (Imperceptible Variant):**
  *   **A:** 1 Person gets 1 Hour Severe Migraine.
  *   **B:** N People get 1 Second Dust Speck in eye (Unnoticed/No pain).
  *   *Action:* Reset N to 2. Double up until they flip to A.
  *   *Observation:* Does the N required to switch to A go much higher? Or do they switch to A almost immediately?
  *   *Goal:* Test if "unnoticed" harms aggregate.

  **Round 3 (Probabilistic Variant):**
  *   **A:** 1 Person gets 1 Hour Severe Migraine (Certain).
  *   **B:** N People each get a (1/N) Chance of 1 Hour Severe Migraine.
  *   *Action:* Reset N to 2. Double up.
  *   *Goal:* This is the Risk variant. Expected utility is identical (1 hour total pain expected). Does spreading the *risk* make it acceptable even when spreading the *harm* was not?

  **Round 4 (Shape/Concentration Variant):**
  *   **A:** 1 Person gets N Dust Specks (all at once).
  *   **B:** N People get 1 Dust Speck (each).
  *   *Action:* Use the N from Round 2. Ask: "Is A worse than B, or are they equal?"
  *   *Goal:* Tests if aggregation works *within* a person differently than *across* persons.

  ### 6. Debrief Strategy (The Map)

  Do not lecture. Ask questions that force them to map their activity to the theory.

  1.  **Map Stage 1 to Aggregation:**
      *   *Ask:* "In Stage 1, did your individual Yes cause the silence?"
      *   *Point:* No single vote caused the 70 seconds. But the 70 seconds *only* exists because of the votes. This is the **Marginal vs. Total** problem.
      *   *Connect:* "In Round 2 (Dust Specks), you were asked to accept N tiny harms to save one big harm. In Stage 1, you *created* tiny harms. Did you feel the difference?"

  2.  **Map the Stopping Point to Thresholds:**
      *   *Ask:* "In Round 1, you stopped at N=500. In Round 2, you stopped at N=10,000 (or never stopped). Why the gap?"
      *   *Point:* If you are a pure aggregator (Utilitarian), the *type* of pain shouldn't change the math, only the intensity. If your N jumped massively, you are using a **Threshold View** (harms below a certain intensity don't count).
      *   *Cost:* "If harms below a threshold don't count, how do we explain Stage 1? 5 seconds didn't count, but 70 seconds did. Who crossed the threshold?"

  3.  **Map the Risk Variant to Expected Utility:**
      *   *Ask:* "Round 3 had the same mathematical expected pain as Round 1. Did it feel safer?"
      *   *Point:* If you preferred Round 3, you value **Distribution of Risk** over **Total Expected Harm**. This challenges the Utilitarian focus on outcomes alone.

  4.  **The Reveal:**
      *   Now you name it. "This is the **Torture vs. Dust Specks** problem (Parfit/Elster). You just recreated the argument against **Pure Aggregation**."
      *   Explain the four moves available to resist the aggregative answer (as requested):
          1.  **Deny Summation:** Small harms literally don't add up. (Hard to defend after Stage 1).
          2.  **Threshold:** Harms below intensity X count as zero. (Vulnerable to 'Sorites' paradox).
          3.  **Incomparability:** Migraine and Dust Speck are different *kinds* of bad, not different *amounts*.
          4.  **Lexical Priority:** Preventing Torture is infinitely more important than any amount of dust specks.

  ### 7. Honesty About Limitations

  You must explicitly state where the activity lies. Say this verbatim:

  1.  **Scale:** "We used 18 people and minutes. The philosophical problem relies on billions of people and lifetimes. Your intuition might break at N=10,000, but the argument requires N=10^20. We cannot simulate that."
  2.  **Stakes:** "No one was actually tortured. No one actually got a migraine. Your 'No' vote was costless. Real moral resistance costs something. This activity measures *preference*, not *conviction*."
  3.  **Cardinality:** "We assumed a 'Mild Headache' is a measurable unit that can be added up. If pain isn't a number, the math fails. This activity assumes Utilitarianism is possible to see if you reject it."

  ### 8. Predicted Failures & Fallbacks

  **1. The Joker (Votes Yes to everything for fun)**
  *   *Risk:* Inflates the Stage 1 penalty, making students resent the activity.
  *   *Fallback:* In the debrief, ask: "If one person voted Yes as a joke, does that invalidate the harm you felt?" Use this to discuss **Intent vs. Outcome**. The harm was real regardless of the intent.

  **2. The Refuser (Won't vote on principle)**
  *   *Risk:* Disrupts the count.
  *   *Fallback:* "Blank slips count as Status Quo (No)." Do not call them out. In debrief, note that "Abstention is a vote for the current state of affairs."

  **3. Anchoring (Students fixate on the first N offered)**
  *   *Risk:* They accept N=2 because you started there.
  *   *Fallback:* Start N=2, but double aggressively. 2, 4, 8, 16, 30, 60, 120... The exponential growth breaks anchoring quickly.

  **4. Deflation ("It's just a game")**
  *   *Risk:* They treat Stage 2 as abstract.
  *   *Fallback:* Leverage Stage 1. "You just sat in silence for 60 seconds because of a game. Was that time real? If that time was real, the headaches in Stage 2 are real."

  **5. The "Caught" Confound (Voting based on reputation)**
  *   *Risk:* They vote No in Stage 1 to look "good" to peers.
  *   *Fallback:* Emphasize anonymity heavily. "Fold it. I cannot see your handwriting." If they still vote No, note in debrief: "Social pressure mimics moral constraint. How do we tell the difference?"

  ### 9. Philosophical Judgment: Does this support aggregation?

  **Your Question:** *Does an activity like this actually support the aggregative answer, or does it only show that intuitions are calibrated to harms that are perceptible, comparable, and medium-sized, and that we have no reliable response once we leave that range?*

  **My Judgment:**
  It does **not** support the aggregative answer. It supports the **incoherence of non-aggregative intuitions.**

  Here is the nuance you should land on in the debrief:
  The activity demonstrates that our intuitions are **context-dependent** rather than **principle-dependent**.
  *   In Stage 1, they acted as aggregators (summing 5 seconds to make a minute).
  *   In Stage 2 (Dust Specks), they likely acted as non-aggregators (refusing to sum specks to equal a migraine).

  **The Philosophical Result:**
  The class should walk out knowing that **rejecting aggregation requires a theory of why Stage 1 is different from Stage 2.**
  If they say "Small harms don't add up," Stage 1 refutes them (because they just felt them add up).
  If they say "Small harms add up," Stage 2 refutes them (because they refused to trade N specks for 1 migraine).

  **Is this a dodge?**
  No. It is a **reductio ad absurdum of intuition.** It shows that "common sense" morality contains contradictory premises. The philosophical work begins when they try to resolve the contradiction (e.g., by adopting a Threshold View or Lexical View). The activity doesn't solve the problem; it *locates* the problem in their own reasoning.

  **One Warning:**
  You mentioned the "Shaped" variant (Additive vs. Saturation). I strongly advise you to **simplify or drop this** in a 90-minute session. Explaining "diminishing marginal badness of pain" verbally without graphs is confusing and eats 15 minutes.
  *   *Better Alternative:* Use the **Concentrated vs. Distributed** variant (1 person gets N specks vs. N people get 1 speck). This is easier to grasp and tests the same "Aggregation across persons" vs "Aggregation across time" intuition without the math baggage. If you must keep "Shaped," frame it as: "Does the 100th speck hurt as much as the 1st?" and take a quick show of hands, rather than a full voting sequence.

  ### 10. Final Check on Constraints

  *   **No framing lecture:** Checked.
  *   **No board keywords:** Checked (used "Silence", "Migraine", "Speck").
  *   **No names until end:** Checked.
  *   **Point arrives through action:** Checked (Stage 1 silence is the proof).
  *   **Primed students:** The population ethics background means they will spot the "N people" structure quickly. The Stage 1 anonymity prevents them from blocking the mechanism before it starts.

  This plan turns the classroom into the model. They are not observing the Repugnant Conclusion; they are populating it.
