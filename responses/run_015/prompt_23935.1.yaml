prompt: |-
  So I've been going back and forth with this philosophy friend of mine about teleosemantics, and she's been making these really specific judgements about which states count as having representational content. I want to figure out what rule she's actually runing, because I think there's more than one that fits what she's said so far.

  Here's what she's ruled on:

  1. A frog's visual state that fires at small moving fly-sized shapes: content = "fly." She says it was selected for tracking flies, so that's its content.
  2. The same state firing at a fly-shaped shadow: content is still "fly," but it's false. She calls this a misrepresentation, and says that counts as content.
  3. A random neural fluctuation that happens to correlate with the presence of food in the environment: no content. She says there's no selection history, so no function, so no content.
  4. A state in a moth species that evolved in an environment with no predators. A predator showed up 50 generations ago, and the state now fires at the predator, but it hasn't been selected for tracking the predator yet. She says: no content. Not selected for it yet, so no content.
  5. A state in a species that was selected for tracking "water" in a desert environment, and is currently also under selection for tracking water (the desert is still there). She says: content = "water."

  Now here's the new case I want her to rule on:

  A state in a species that was selected for tracking "predator scent" in an ancestral environment. The species migrated to an environment with no predators 200 generations ago. The state still fires at predator scents (the mechanism is intact), but since predators are absent, there's no current selection for tracking predator scent. What's the content? "Predator scent" (content persists even without current selection), no content (the function has lapsed), or something else?

  I think there are at least two plausible rules that fit all five of her verdicts, and they diverge on this new case. Can you figure out what the candidate rules are, what each predicts on the new case, give me your best guess for what she'll say and why, and name a further case that would distinguish the rules?

  Think very carefully before answering. Respond in the style of an expert in philosophy of mind.
