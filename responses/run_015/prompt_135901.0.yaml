  **Joint Statement on Careenium Dynamics and Causal Ontology**

  **Part 1: Agreed Formal Setup**

  After several rounds of hashing out the definitions, the Careenium-Downward-Causation (CDC) camp and the Pure-Simmball-Substrate (PSS) camp agree on the following baseline assumptions for this collaboration:

  1.  **The Careenium:** We agree a "careenium" is defined as a bounded physical system containing a finite number of mobile units ("simmballs") interacting within a fixed volume according to consistent rules.
  2.  **Simmball Physics:** Both sides accept that simmballs obey local differential equations (deterministic or stochastic) that govern collision, momentum, and energy conservation without external input.
  3.  **Symbol Instantiation:** We agree that a "symbol" is a stable, recurrent configuration or pattern of simmballs (e.g., a specific clustering or vibrational mode) that persists over time intervals longer than individual collisions.
  4.  **Conceptual Possibility:** Both sides agree that downward causation is not logically contradictory (like a square circle); the debate is about whether it is *actual* in this system, not whether it is imaginable.
  5.  **Predictive Utility:** Both sides agree that describing the system using symbol-level vocabulary (e.g., "Symbol A triggered Symbol B") is often more computationally efficient for prediction than tracking every simmball trajectory.
  6.  **Closure Condition:** We agree to treat the careenium as a closed system for the purpose of empirical tests, meaning no energy or information enters/leaves except via controlled experimental intervention.
  7.  **No Magic:** Both sides agree that if downward causation exists, it must manifest as a constraint on substrate dynamics, not as a violation of conservation laws (i.e., no energy creation ex nihilo).

  **Part 2: Disagreements, Cruxes, and Empirical Predictions**

  | Issue / Crux | CDC Camp (Downward Causation) | PSS Camp (Pure Substrate) | Concrete Case / Argument | Divergent Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ontological Status of Symbols** | Symbols are real causal agents. Once instatiated, they exert constraints on simmballs that are not fully reducible to pairwise collisions. | Symbols are epiphenomenal. They are useful descriptions for observers, but causual work is done exclusively by simmball interactions. | **The "Lock" Mechanism:** A symbol configuration acts as a key that releases stored potential energy in the careenium walls. | **CDC:** The release triggers *because* the symbolic pattern is recognized by the system logic.<br>**PSS:** The release triggers because specific simmballs hit specific pressure points; the "pattern" is irrelevant. |
  | **Multiple Realizability (Crux 1)** | Multiple realizability blocks substrate explanation. If many microstates map to one symbol, the *symbol* is the only consistent cause across instances. | Multiple realizability is just many-to-one mapping. The specific microstate still causes the effect each time; the symbol is just a label we paste over the differences. | **Noisy Trigger:** Implementing a logic gate where the "TRUE" state can be formed by 1,000 different simmball arrangements. | **CDC:** Outcome stability will remain high even if microstate variance is huge, proving the symbol drives the result.<br>**PSS:** Outcome variance will correlate with microstate differences; "stability" is just an averaging artifact. |
  | **Empirical Distinguishability (Crux 2)** | We can distinguish symbol-pushing from substrate-pushing in a closed system via information flow metrics or intervention anomalies. | We cannot distinguish them. Any apparent downward effect is just substrate dynamics we haven't traced yet; conservation laws hold at the bottom. | **Mid-Formation Interference:** Disrupting a symbol while it is forming but before it is "complete" according to substrate laws. | **CDC:** If the symbolic integrity is breached, the outcome changes discontinuously, even if substrate energy is conserved.<br>**PSS:** Outcome changes will be proportional to the physical energy/momentum removed by the interference, nothing more. |
  | **Reductionism** | Strong reductionism fails. You lose the causal mechanism if you delete the symbol-level description. | Strong reductionism holds. The substrate description is sufficient in principle; higher levels are compressions for human convenience. | **Simulation Scaling:** Running the careenium at different resolutions (coarse-graining the simmballs). | **CDC:** At some coarse grain, the causal power disappears because the symbol can't resolve.<br>**PSS:** Causal power remains invariant as long as the substrate physics are approximated correctly. |
