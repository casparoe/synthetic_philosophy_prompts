answer: |-
  Imagine our old open-plan characterization floor where the new high-throughput X-ray diffractometers create a low-frequency hum that isn't dangerous but causes mild, persistent wrist fatigue for every researcher typing reports at their benches. Management proposes a "Single-Point Dampening" policy: one technician must manually operate a vibration isolator inside the enclosure for eight hours a day, exposing them to levels guaranteed to cause permanent nerve damage over a year, which eliminates the hum entirely for the two thousand researchers on the floor. The aggregative view says adopt the policy immediately because the total sum of wrist fatigue prevented across two thousand people outweighs the nerve damage to one technician, but Scanlon's contractualism says reject the policy because the technician can reasonably reject any principle that sacrifices their long-term health for such trivial gains to others, while no individual researcher can reasonably reject a principle that asks them to endure minor fatigue to save a colleague from disability.

  Here is how the disagreement breaks down. For Scanlon, the justification of a principle depends on whether any individual could reasonably reject it based on their own burden, not on the sum of burdens across the group. In this case, the technician has a very strong personal complaint (permanent nerve damage), whereas each researcher has a very weak personal complaint (minor wrist fatigue). Since the researchers' individual burdens are too small to ground a reasonable rejection, the technician's veto stands, and the policy is forbidden. The aggregative view, typically utilitarian, ignores the distribution of harm and looks only at the total net welfare; it sums the two thousand small benefits and finds they mathematically exceed the one large cost, so the policy is required.

  The structural feature doing the work here is the **aggregation of small claims**. The case is designed so that no single researcher has a claim strong enough to override the technician's claim on its own, but the aggregative view allows them to combine their claims into a single heavy weight that crushes the technician's objection. Scanlon blocks this by insisting that justification must be owed to each person individually; you cannot pool trivial complaints to override a vital one.

  The aggregative side tries to dissolve this feature by challenging the moral significance of the "separateness of persons." They argue that if pain is bad, it is bad regardless of who feels it, so there is no logical reason to treat one person's large pain as morally distinct from many people's small pains when calculating the overall good. To them, the boundary between individuals is not a deep moral barrier but a practical container, and refusing to sum the harms is an irrational fetishism about distribution that ignores the greater total suffering caused by rejecting the policy.
