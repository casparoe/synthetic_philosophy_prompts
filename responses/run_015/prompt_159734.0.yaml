  3.  **Search for Existing Concepts (Mental Knowledge Retrieval):**
      *   *Reference Class Problem:* (Reichenbach, Keynes). The fundamental issue that any single event belongs to multiple classes with different probabilities. This is the bedrock.
      *   *Inside View vs. Outside View:* (Kahneman & Tversky). The user explicitly asks about this. The Inside View focuses on the specifics of the case; the Outside View focuses on the statistics of the class. The user's maneuver is a way of *corrupting* the Outside View to look like an Inside View, or vice versa. It's a "Rigged Outside View."
      *   *Motivated Reasoning:* User rejects this because it feels sincere. But technically, it *is* a form of motivated reasoning, specifically *confirmation bias* in hypothesis testing.
