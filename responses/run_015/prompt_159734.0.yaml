answer: |-
  You have described a precise and sophisticated epistemic maneuver. To answer your primary question directly: **No, there is no single, established term that captures this specific configuration of sincerity, granularity, and post-hoc class construction.**

  However, the phenomenon is not unnamed because it is unknown; it is unnamed because it sits at the intersection of three well-mapped cognitive territories. It is a specific failure mode of **Reference Class Forecasting**, driven by **Descriptive Overfitting**, and protected by the **Conjunction Fallacy**.

  Here is the shape of the move, its edges, and how to distinguish it from honest reasoning.

  ### 1. Is it the Inside View, or the mechanism that generates it?

  It is neither. It is best understood as a **Corrupted Outside View.**

  To clarify: The **Inside View** (Kahneman & Tversky) focuses on the specific details of the case at hand (your scenes, your sources, your diligence) and ignores statistical regularities. The **Outside View** ignores the specifics and focuses on the statistics of a reference class (how do books like this generally perform?).

  Your maneuver does not ignore the Outside View; it hijacks it. You are attempting to use the *language* of the Outside View (comparison classes, base rates) to justify the *certainty* of the Inside View. By refining the description of the case until the comparison class contains only the desired outcome, you create a statistical alibi for an intuition.

  It is not the mechanism that generates the Inside View; it is a mechanism that **disguises** the Inside View as rigor. It feels like scrupulousness because you *are* being scrupulous about the differences between cases. The error is not in the observation of the differences, but in the assumption that those differences are *causally relevant* to the outcome rather than merely *descriptively unique*.

  ### 2. Is it continuous with the Reference Class Problem, or specific to Narrative?

  It is an exploitation of the **Reference Class Problem** (the philosophical difficulty that any single event belongs to multiple classes with different probabilities), but it is powered by **Narrative Granularity.**

  In statistics, this is known as **Overfitting**. If you create a model with enough variables (scenes, sources, dates, functions), you can perfectly predict the past data, but the model loses all predictive power for the future. You are overfitting the reference class to the specific instance.

  The narrative element is crucial. As you noted, "the finer the description, the fewer the comparators survive." This triggers the **Conjunction Fallacy**. Humans find detailed, specific stories more plausible than abstract probabilities, even though the probability of a conjunction of details (a book with *these* scenes, *this* archive, *this* author history) is statistically lower than a broader category (a book by an established author).

  The narrative organization (scenes with functions) provides a ready-made list of exclusion criteria. It gives you a vocabulary of "real differences" that allows you to shrink the class without feeling like you are lying. The narrative doesn't just describe the book; it provides the tools to isolate it.

  ### 3. How to tell an honest restriction from this maneuver?

  You identified the crux: "the two can be verbally identical and differ only in whether the restriction was fixed before one knew where it would lead."

  Since you cannot read your own mind to check for sincerity, you must rely on structural tests. An honest restriction is distinguishable by **Pre-commitment** and **Causal Relevance.**

  *   **Pre-commitment (The Protocol Test):** In scientific research, this is solved by pre-registering the inclusion/exclusion criteria for a study before looking at the data. In your context, the test is: *Could I have written down the rules for this comparison class before I knew which books were in it?* If the definition of the class relies on knowing the outcome (e.g., "books that succeeded" vs. "books that failed"), it is rigged. If the definition relies on antecedent conditions (e.g., "books with archival elements by authors with 9+ prior publications"), it is honest.
  *   **Causal Relevance (The Mechanism Test):** You excluded books because they were debuts, lacked archives, or faced different markets. These are *causally relevant* variables. However, if you continue to refine until the class is empty or singular, you have moved from causal factors to **identifying features**.
      *   *Honest:* "I am excluding debuts because they lack an existing readership." (Causal mechanism).
      *   *The Maneuver:* "I am excluding Book X because its editor was named Sarah, and mine is named David." (Descriptively true, causally noise).
      *   The edge lies where the exclusion stops explaining *why* an outcome happens and starts explaining *which* outcome happened.

  ### 4. Are there cases in which the move is not a failure?

  Yes. Narrowing the class is not only valid; it is necessary for accuracy, provided the narrowing is based on **operational variables** rather than **descriptive variables.**

  *   **Valid Narrowing:** In medicine, a drug trial excludes patients with specific comorbidities. This narrows the class drastically. It is valid because the comorbidity interacts chemically with the treatment. If you applied this to your book, you would ask: *Does the specific nature of this river trade interact with the market mechanics in a way that changes the probability of success?* If the answer is yes, the narrow class is valid.
  *   **Invalid Narrowing:** If the narrowing is based on features that do not alter the underlying mechanism of the market. For example, excluding other books because they were published in a different season, or by a different imprint, unless you have evidence that season/imprint is the primary driver of success for *this specific type* of book.

  The move becomes a failure when the specificity of the description exceeds the specificity of the causal mechanism.

  ### Summary and Definition

  Since you asked for a name if one does not exist, I propose we call this **Reference Class Overfitting.**

  **Definition:** The iterative narrowing of a statistical comparison class based on true but causally weak descriptive details, performed post-hoc to isolate a specific prediction, resulting in a class that is too small to generate a reliable base rate.

  **Boundary Cases:**
  *   **Not this:** Excluding science fiction novels from a comparison class for a historical novel. (Broad, causally relevant market distinction).
  *   **Not this:** Admitting there are no comparators and therefore refusing to make a prediction. (Intellectual honesty).
  *   **Is this:** Excluding comparable historical novels because their authors lived in different cities, or their archives were from a different decade, until only successful books remain (or only failures, depending on the desired mood).

  **How to recognize it in the wild:**
  You are doing it when the definition of the comparison class becomes more complex than the prediction itself. If it takes more words to define *which books count* than to predict *what will happen*, you have likely overfit the class.

  You are experiencing the tension between the **uniqueness of the artifact** (your novel, which is indeed unlike any other) and the **generality required for prediction** (markets deal in categories, not uniques). The maneuver feels like rigor because it honors the uniqueness. It fails as forecasting because markets cannot price uniqueness until it has already sold.
