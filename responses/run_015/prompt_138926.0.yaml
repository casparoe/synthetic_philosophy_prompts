      *   (3) **Person-Affecting Asymmetry:** No duty to create happy lives, duty to avoid creating miserable ones. (Non-identity problem adjacent).
      *   (4) **Cluelessness/Custodianship:** Can't predict specific good outcomes, so focus on keeping options open (institutional resilience, no lock-in).
