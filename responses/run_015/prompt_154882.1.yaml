  2.  **Deconstruct the Core Claim (Moore as Performative):**
      *   *Standard Reading:* Moore argues: 1. Here is a hand. 2. Here is another hand. 3. Therefore, external objects exist. Criticism: Premise 1 assumes what needs to be proved (begging the question).
      *   *Performative Reading:* The act of raising the hand isn't just stating a premise; it's *doing* something. It shifts the context. It forces the skeptic to engage with the world they claim to doubt.
      *   *Indexical Anchoring:* "Here" and "Now" and "This" rely on context. Skepticism tries to detach language from context. Moore re-attaches it.
