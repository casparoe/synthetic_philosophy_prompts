answer: |-
  **The Convertibility Trap: A Structural Autopsy of FTX through Effective Altruism**

  To analyse the FTX collapse through the lens of Effective Altruism (EA) requires moving beyond the narrative of individual criminality. While Sam Bankman-Fried's (SBF) actions constituted fraud, the 'Convertibility Trap' hypothesis suggests that the architecture of 'Earning to Give' (EtG) created a permissive environment where the *metric* of altruism (dollars pledged) superseded the *mechanism* of its generation. When welfare is reduced to a fungible quantity, the production of that quantity becomes the primary moral imperative, potentially decoupling from actual welfare outcomes.

  Here is the mapping of that failure.

  ### 1. The Moral Agent: The Proxy Altruist
  In classical ethics, the moral agent is the individual performing the act. In the EA framework surrounding FTX, the moral agency was distributed and delegated.
  *   **SBF as Proxy:** SBF was not viewed merely as a wealthy donor, but as a 'utility maximiser' acting on behalf of the community. By adopting the EtG path, he positioned himself as a specialist generator of resources for the collective good.
  *   **The EA Establishment as Validator:** Organisations such as the Centre for Effective Altruism and Open Philanthropy acted as secondary agents. By accepting SBF's pledges and granting him platform status (e.g., the FTX Future Fund), they validated his agency. They outsourced the 'earning' to him while retaining the 'giving' oversight, creating a principal-agent problem where the principal (EA) lacked the technical capacity to audit the agent's (SBF) risk profile.

  **The Trap:** Moral responsibility became diffuse. SBF believed he was acting for the greater good (justifying risk), while the EA community believed his success validated their theory. When the metric (pledged wealth) was high, scrutiny of the agent's conduct was lowered.

  ### 2. The Welfare Outcome: Legibility vs. Reality
  In the 'Convertibility Trap', welfare is not measured by lives improved or suffering reduced, but by the *convertibility* of assets into donations.
  *   **The Metric:** The legible output was the 'Giving Pledge' figure and the volume of grants distributed by the FTX Future Fund. These are crisp, quantifiable numbers.
  *   **The Decoupling:** Actual welfare requires sustainable capital. However, high-variance financial strategies produce 'phantom welfare' during the upswing. SBF could pledge billions based on paper wealth or leveraged positions that did not reflect solvent reality.
  *   **The Incentive:** Because the EA community rewards *marginal* impact (the next dollar saved), there is a structural bias towards high-variance earners. A safe earner donating 10% of £10 million is less 'effective' in the calculus than a risk-taker promising 100% of £10 billion. The trap snaps shut when the promise of future convertibility buys present-day influence, regardless of the solvency of the underlying asset.

  ### 3. Earning to Give: Prediction and Silence
  Does EtG predict SBF's behaviour, or did the theory fail to account for it?
  *   **Where EtG Predicts Behaviour:** The core tenet of EtG is Expected Value (EV) maximisation. SBF explicitly argued that crypto trading offered higher EV than traditional finance, and thus, morally, he *ought* to take the risk. The logic holds: if one can generate more good by taking high risks with 'other people's money' (customer funds, in the tragic event of fraud), the metric-driven logic pushes towards that risk. EtG predicts the *ambition* to scale earnings indefinitely.
  *   **Where EtG Stays Silent:** The theory traditionally assumes 'clean money'—that the earning process itself does not negate the good. However, EtG lacks a robust framework for 'earning risk' beyond legal compliance. It stays silent on the *systemic fragility* introduced when a major donor's solvency is tied to volatile, opaque markets. Furthermore, EtG struggles to account for 'reputational contagion'. If the earning mechanism collapses, it damages the cause (AI safety, pandemic prevention) more than the donation helped it. This negative externality was not priced into the moral calculus.

  ### 4. Institutional Critique: The Failure of Scrutiny
  Why did EA bodies fail to catch the decoupling? The 'Convertibility Trap' offers a specific explanation: **Metric Fixation.**
  *   **Auditing the Number, Not the Source:** EA institutions are designed to evaluate the *impact* of donations (e.g., cost per life saved), not the *provenance* of capital. When SBF presented a large number, the institutional machinery was geared to deploy it, not to forensicly audit the balance sheet of FTX. The metric was legible; the risk was opaque.
  *   **The Feedback Loop:** As SBF donated more, his status within EA rose. This status granted him access to policymakers and further capital, which he used to generate more 'welfare metrics'. To question his solvency was to question the efficacy of the EA movement itself. The metric became self-justifying.

  ### 5. Charismatic Capture: The Missing Variable
  Does the case confirm the critique, or does it reveal a blind spot regarding charisma?
  The 'Convertibility Trap' explains the *economic* incentive, but it misses the *sociological* shield. This is where the critique must be expanded to include **Charismatic Capture**.
  *   **The Utilitarian Aesthetic:** SBF cultivated a persona that signalled 'post-materialism' (sleeping on beanbags, wearing shorts). This signalled to the EA community that he was immune to the usual vices of greed. He looked like a monk of utility.
  *   **Bypassing Skepticism:** In a rationalist community, charisma is often dismissed as a bias. However, SBF's charisma was *aligned* with EA values. He spoke the language of EV, long-termism, and existential risk. This created a 'halo effect' where his adherence to the *language* of EA was taken as proof of his adherence to the *ethics* of EA.
  *   **The Verdict:** The case confirms the 'Convertibility Trap' but reveals it is exacerbated by charismatic capture. The metric (dollars) opened the door, but the persona (the self-sacrificing quant) locked the inspectors out. The institutions failed because they trusted the *signal* (his lifestyle and rhetoric) as much as the *metric* (his pledges).

  ### Conclusion
  The FTX collapse was not merely a fraud committed by a greedy individual; it was a stress test that the 'Earning to Give' framework failed. The 'Convertibility Trap' accurately describes how the reduction of welfare to a fungible metric (dollars donated) incentivised high-variance strategies that prioritised the *appearance* of potential impact over the *stability* of actual impact.

  SBF's risk-taking was structurally incentivised because the EA ecosystem rewarded the *magnitude* of the pledge over the *integrity* of the engine generating it. While charismatic capture explains why scrutiny was personally directed away from SBF, the 'Convertibility Trap' explains why the *system* was blind to the danger. When the measure of good becomes the target, the production of that measure can become a distinct activity from the doing of good. The FTX case confirms that without rigorous constraints on the *means* of earning, the *ends* of altruism can be consumed by the machinery designed to fund them.
