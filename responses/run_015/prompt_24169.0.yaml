          1.  Agreed Claims (cognitive architecture, 'user illusion' commitment, explanatory gap argument).
          2.  Exact Formulation of Disagreement (phrased so each accepts their own view's wording).
          3.  Cruxes (sub-questions that would move at least one side).
          4.  For each Crux: Concrete case/argument (e.g., blindsight, functional duplicate), predictions from both sides.
          5.  Falsification Conditions (what would count as evidence against their own view).
          6.  Verbal Dispute Analysis (are they talking past each other regarding 'phenomenal consciousness'?).
      *   **Format:** Numbered agreed claims, then a disagreement table with a cruxes section.
      *   **Tone:** Academic, precise, collaborative, charitable but rigorous.

  2.  **Deconstruct the Positions:**
      *   **Illusionist (e.g., Dennett, Frankish, Keith):** Phenomenal consciousness (P-consciousness) as traditionally defined (intrinsic, ineffable qualia) does not exist. What exists is Access Consciousness (A-consciousness) and a self-model that *judges* it has P-consciousness. The "hard problem" is a cognitive error.
      *   **Realist (e.g., Chalmers, Strawson, Goff):** P-consciousness is real, irreducible, and distinct from functional/access states. The "hard problem" (why does processing feel like something?) is genuine. The "explanatory gap" cannot be bridged by physicalism alone.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground on the *mechanisms* even if the *ontology* differs.
      *   *Cognitive Architecture:* Both agree the brain processes information, creates models, and controls behavior.
      *   *User Illusion Label:* Both agree it implies a mismatch between the model and the reality, but disagree on whether the "reality" being missed is the experience itself or the nature of the experience.
      *   *Explanatory Gap:* Both agree there is a conceptual difficulty in deriving subjective reports from physical descriptions.
      *   *Drafting thought:* Make sure the Illusionist doesn't have to admit qualia exist, and the Realist doesn't have to admit they don't. Focus on the *structure* of the debate.

  4.  **Drafting Section 2: The Exact Disagreement:**
      *   This needs to be the core.
      *   *Illusionist:* "The judgment that there is something it is like is a cognitive posit not grounded in a distinct non-functional property."
      *   *Realist:* "The judgment that there is something it is like is grounded in the immediate presence of a non-functional property."
      *   *Refinement:* Use the prompt's insight about "intrinsic qualitative character vs. self-representational structure."

  5.  **Drafting Section 3: Cruxes (The Core Challenge):**
      *   *Crux 1: The Agency Analogy.* (Prompt suggestion).
          *   *Issue:* Does the fact that agency is constructed mean the *feeling* of agency is illusory?
          *   *Illusionist:* Yes, the feeling is a read-out of the model, not a causal force.
          *   *Realist:* No, the feeling is real even if the causal story is wrong.
          *   *Test Case:* Libet-style experiments or Anarchic Hand Syndrome.
      *   *Crux 2: The Content of the Self-Model.* (Prompt suggestion).
          *   *Issue:* How does the brain represent "experience" without having experience to represent? (Circularity).
          *   *Illusionist:* It represents functional states *as if* they were qualitative.
          *   *Realist:* You can't represent qualia without qualia.
          *   *Test Case:* Philosophical Zombie / Functional Duplicate reporting "nothing."
      *   *Crux 3: The Verbal Dispute (Definition of P-Consciousness).*
          *   *Issue:* Are we defining the target differently?
          *   *Test:* The "What is it like?" question.

  6.  **Drafting Section 4: Falsification Conditions:**
      *   What would make the Illusionist say "Okay, qualia are real"? (e.g., A physical theory that deduces qualia without circularity, or a zombie that acts conscious but reports darkness).
      *   What would make the Realist say "Okay, it's just a model"? (e.g., A complete neural correlate that explains the *judgment* of experience without invoking extra ontology, or proof that the 'gap' is a linguistic trick).

  7.  **Drafting Section 5: Verbal Dispute Analysis:**
      *   Address the prompt's suspicion. Yes, they likely mean different things by "Phenomenal Consciousness."
      *   Illusionist = "Intrinsic, non-functional qualia." (Denies this exists).
      *   Realist = "Subjective character of experience." (Affirms this exists).
      *   If Illusionist defines it as "Self-modeling of functional states," they are Realists about *that*.
      *   Conclusion: Partially verbal, but ontological stakes remain.

  8.  **Review and Refine:**
      *   *Check constraints:* Numbered claims? Yes. Disagreement table? Yes. Cruxes with predictions? Yes. Falsification? Yes. Verbal analysis? Yes.
      *   *Tone Check:* Is it neutral? Does it sound like a document both would sign?
      *   *Specific Prompt Requirements:* Ensure the "Agency Analogy" and "Circularity of Representation" cruxes are explicitly included and fleshed out with the specific examples requested (blindsight, etc.).
      *   *Refining the "Agreed Claims":* Make sure the Illusionist isn't conceding too much. They agree on the *reporting* mechanism, not the *ontological status* of the report's content.
      *   *Refining the Cruxes:* Ensure the predictions are distinct.
          *   *Agency:* Illusionist predicts disruption of the model disrupts the feeling. Realist predicts the feeling persists even if agency is denied (because the feeling is the primitive).
          *   *Circularity:* Illusionist predicts we can build a robot that says "I see red" without qualia. Realist predicts such a robot is a "philosophical zombie" and conceptually distinct from a being that *actually* says it.
      *   *Wait, one correction:* The prompt asks for "Concrete case or argument both would agree bears on it." I need to select cases where the *relevance* is agreed, even if the interpretation differs. Blindsight is good. Functional duplicates are good.

  9.  **Final Polish:** Organize into the requested format. Ensure the "Verbal Dispute" section is nuanced (it's not *just* verbal, it's verbal *and* ontological).

  *(Self-Correction during drafting)*: I need to be careful with the "Agency" crux. The prompt says the Realist replies "even if agency is a misattribution, there is a real experience of agency." I need to capture that distinction. The Illusionist says the experience *is* the misattribution. The Realist says the experience is the *datum*, the misattribution is the *explanation* of the cause.

