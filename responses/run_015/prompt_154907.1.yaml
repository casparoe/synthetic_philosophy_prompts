answer: |-
  ### Brainstorming Notes

  **Core Tension:**
  *   **The Mirror:** Sortition as a statistical snapshot. The body *is* the people. Passive, reflective, descriptive. Danger: It assumes the people are fixed entities to be copied.
  *   **The Forge:** Sortition as a transformative fire. The body *becomes* the state. Active, constructive, prescriptive. Danger: It creates a new class distinct from the people they left behind.
  *   **The Collapse:** If the forge changes the metal, the mirror no longer reflects the original ore. Representation fails when transformation succeeds.

  **End-Word Strategy:**
  *   *Lot:* Fate, selection mechanism, share.
  *   *Mirror:* Reflection, accuracy, illusion.
  *   *Forge:* Creation, heat, alteration.
  *   *Voice:* Agency, speech, vote.
  *   *Silence:* The private self, the unheard, the pause before speech.
  *   *Rule:* Law, dominion, measurement.

  **Meter & Tone:**
  *   Strict iambic pentameter (da-DUM da-DUM da-DUM da-DUM da-DUM). This ensures the "seminar read aloud" quality—rhythmic, serious, inevitable.
  *   Tone should be analytical yet lyrical. Avoid didacticism; let the form reveal the paradox.

  **Envoi Plan:**
  *   Must contain all six words.
  *   Must place *lot* immediately adjacent to *rule*.
  *   Structure: 3 lines, 2 keywords per line roughly.
  *   Line 3 idea: "...the lot rule binds..." or "...by lot rule made..."

  **Drafting Focus:**
  *   Stanza 1: The setup (Mirror hope).
  *   Stanza 2-3: The process (Forge heat).
  *   Stanza 4-5: The friction (Voice vs. Silence).
  *   Stanza 6: The realization (Instability).
  *   Envoi: The philosophical knot.

  ***

  ### The Urn and the Anvil

  We draw a name to find the public **lot**,
  Expecting glass to act as perfect **mirror**,
  Showing the crowd exactly as they are.
  But power is not light; it is a **forge**,
  And silence waits within the chosen **voice**,
  Before the heavy burden of the **rule**.

  To govern is to change the shape of **rule**,
  And change the hand that reaches for the **lot**.
  The private self dissolves into the **voice**,
  No longer holding up a static **mirror**,
  But stepping into fire of the **forge**,
  Where quiet thoughts are burned away in **silence**.

  What comes out of the heat of such a **forge**
  Is not the same metal bound by **rule**,
  But something tempered, hard, and distinct. **Silence**
  Falls on the neighbors of the chosen **lot**,
  Who watch their own reflection in the **mirror**
  Crack under weight of one representative **voice**.

  So statistical truth meets political **silence**,
  For who can speak the whole inside the **forge**
  Without becoming master of the **rule**?
  The urn promises a share, a random **lot**,
  But office turns the holder from the **mirror**,
  Distorting what was meant to be pure **voice**.

  Now listen to the conflict in the **voice**,
  It wants to rest in peaceful private **silence**,
  Yet sees the state only through cracked **mirror**.
  The citizen is consumed inside the **forge**,
  Leaving behind the equality of **lot**,
  To serve the strict necessity of **rule**.

  Does the glass break, or does the **mirror**
  Amplify every whisper of the **voice**?
  We cannot know until we test the **lot**.
  If chance alone could guarantee our **rule**,
  We would not need the fire of the **forge**,
  Nor fear the quiet growth of inner **silence**.

  ***

  **Envoi**

  When **mirror** fails to hold the public **voice**,
  And **silence** cools the fire of the **forge**,
  We see the **lot rule** binds the state by chance.
