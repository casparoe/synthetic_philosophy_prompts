answer: |-
  This is a profound narrative problem that sits at the intersection of sociology, game theory, and tragedy. You are describing a system exhibiting **emergent behavior**: the collapse is a property of the system, not just the individuals within it. If you assign blame too heavily to individuals, you write a melodrama about greed. If you assign it all to the "town," you write a sociological treatise devoid of human stakes.

  To navigate this, you must reject the binary of *Agency vs. Structure*. Instead, your narrative architecture should focus on **Complicity within Constraints**.

  Here is a framework for deciding your perspective and handling moral responsibility without reducing the community to a statistic.

  ### 1. Reframe "Blame" as "Lag"
  In systemic collapses, tragedy arises from the **time lag** between individual action and collective consequence. A captain sells his boat to save his family *today*, which lowers the asset value of the neighbor's boat *tomorrow*, which forces the neighbor to accept predatory wages *next week*.

  *   **Narrative Strategy:** Do not ask "Who is guilty?" Ask "Who saw the pattern too late?"
  *   **The Moral Architecture:** Distribute responsibility not by assigning villainy, but by assigning **information asymmetry**. The buyer knows the market is crashing before the deckhand does. The older captain knows the fish stocks are gone before the younger one does.
  *   **Effect:** This creates tension without caricature. The "villain" is not the person making the hard choice, but the person who hoards the knowledge that makes the choice necessary for others.

  ### 2. The Perspective: The Node and The Network
  You asked whether to center specific characters or the collective trajectory. The answer is to use specific characters to **map the network**, while using a narrative voice to **map the trajectory**.

  **A. The Polyphonic Structure (The Nodes)**
  Use multiple POVs, but limit them to specific functional roles in the economy. Each character should represent a different "rationality":
  *   **The Captain:** Represents *Legacy*. Their rational choice is to preserve the lineage, even if it means debt.
  *   **The Buyer/Merchant:** Represents *Liquidity*. Their rational choice is to cut losses and move capital.
  *   **The Deckhand:** Represents *Labor*. Their rational choice is survival, even if it means accepting degraded terms.
  *   **The Municipal Authority:** Represents *Stability*. Their rational choice is to attract tourism, which accelerates the erasure of fishing culture.

  **B. The Choral Interludes (The Network)**
  Between these character chapters, insert short, impersonal sections. These are not magical realism; they are data points rendered as prose.
  *   *Example:* A list of boat auction prices over ten years. A transcript of a town hall meeting where no one speaks. A description of the rot spreading on the docks.
  *   **Function:** This gives the town its own "voice." It shows the aggregate trajectory that no single character can see. It creates the sense of a "collective fate" without removing agency from the individuals.

  ### 3. Dramatizing the Threshold
  You noted that once unemployment crossed a threshold, residents accepted terms they previously rejected. This is a shift in the **Overton Window of Survival**. To write this effectively, you need a **Control Character**.

  *   **The Control Character:** Choose one character (perhaps a mid-level figure, like a union rep or a boat mechanic) who is present *before* and *after* the threshold.
  *   **The Mirror Scene:** Write a scene early in the book where a contract is offered and angrily rejected as an insult. Write a parallel scene later where the *same* contract (or a worse one) is offered to the same character (or their child), and it is signed without hesitation.
  *   **The Internal Shift:** Do not explain this shift through exposition. Show the physical sensation of the change. The silence in the room is different. The eye contact is different. The "rationality" has changed because the definition of "possible" has shrunk.

  ### 4. Who to Center?
  To avoid reducing the fate to the sum of its parts, you need a perspective that acknowledges the system but is trapped within it. I recommend centering the narrative on **The Pragmatist who becomes the Accelerant.**

  *   **Why:** The idealist who fights the collapse to the bitter end is a martyr, not an explorer of this specific tension. The cynic who exploits it is a villain.
  *   **The Sweet Spot:** Choose the character who tries to "save" the town by making the rational choices that actually kill it. Perhaps a captain who sells his fleet to invest in a tourism venture, believing he is pivoting to save jobs, but whose investment draws capital away from the remaining fishermen, hastening their ruin.
  *   **The Tragedy:** This character acts out of love and logic. Their arc demonstrates how **virtue within a broken system becomes a vice.** This allows you to assign moral weight (they made choices) without assigning simple blame (they wanted to help).

  ### 5. Handling the "Collective Trajectory"
  You asked if blame can be assigned without reducing the community to nothing more than the sum of its parts. The answer lies in **Feedback Loops**.

  In your prose, you must make the feedback loops visible. When a character makes a choice, show the ripple.
  *   *Bad:* "Captain A sold his boat, and the town declined."
  *   *Good:* "Captain A sold his boat to the developer. The developer painted it white and moored it as a restaurant. The smell of frying oil replaced the smell of brine. The gulls changed their flight paths. The deckhands who worked for A now stood on the corner, watching the white boat, calculating how many shifts it would take to buy a meal inside it."

  This technique creates **Emergence**. The town's decline is not just the sum of sales; it is the *relationship* between the sales, the environment, and the psychology.

  ### Summary Recommendation
  1.  **Structure:** Polyphonic (multiple POVs) interspersed with "Choral" sections (town data/atmosphere) to represent the collective trajectory.
  2.  **Moral Center:** Focus on **Complicity**. Characters are not guilty of malice, but of failing to recognize the systemic trap until they were already inside it.
  3.  **The Threshold:** Use a "Control Character" to mirror the shift in moral criteria regarding wages/terms. Show, don't tell, the erosion of dignity.
  4.  **The Blame:** Assign blame not for the *collapse*, but for the *silence*. The tragedy is not that they made rational choices, but that they stopped talking to each other about the collective cost of those choices.

  By framing the collapse as a **communication failure** as much as an economic one, you preserve individual agency (they chose not to speak/organize) while acknowledging the systemic pressure (the economics made communication feel futile). This honors the complexity you are observing.
