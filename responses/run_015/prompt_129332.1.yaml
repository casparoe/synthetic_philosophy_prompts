answer: |-
  **Title:** The Fragile Chain: Agent-Dependency and the Stability of Expected Value Fanaticism

  **Introduction**

  Expected value (EV) fanaticism is the thesis that an agent ought to maximize expected utility even when the probability of success is vanishingly small, provided the potential payoff is sufficiently astronomical. Standard objections to this view rely on the intuition of passivity: the agent is asked to bet on a lottery ticket drawn by the universe, where the causal link between the bet and the payoff is opaque or magical. However, a more sophisticated challenge arises when the outcome space is agent-dependent. In these scenarios, the astronomical payoff is not a fixed prize waiting to be won, but a fragile causal chain that persists only if the agent (or their institutional successor) maintains a specific sequence of choices over time. If the agent deviates, the value drops to zero.

  This essay argues that agent-dependency does not invalidate EV fanaticism, but it fundamentally alters its rational structure. Specifically, I contend that while EV fanaticism collapses as a guide for *sequential act-evaluation*, it remains robust as a criterion for *policy selection*. The endogenous nature of the probability creates a problem of dynamic inconsistency: if an agent re-calculates the EV at every node of the pipeline, the project will rationally abort before completion. Therefore, the rationality of pursuing astronomical value in agent-dependent contexts requires a departure from standard act-consequentialism. The verdict is that EV fanaticism is vindicated only for agents who adopt a strategy of "calculative insulation," binding their future selves to the project regardless of intermediate EV fluctuations.

  **The Standard Objection and the Agent-Dependency Twist**

  To understand the stakes, we must first dismiss the trivial objections. Critics often argue that EV fanaticism fails due to risk aversion or the St. Petersburg paradox, suggesting that humans are psychologically incapable of valuing tiny probabilities correctly. However, in a philosophical context, we assume risk neutrality. If the utility is truly infinite or astronomical (e.g., preventing existential catastrophe), the math dictates action regardless of the odds.

  The agent-dependency twist changes the topology of the problem. In a standard Pascal's Mugging scenario, the probability is exogenous; the mugger either has the power or they do not. In an agent-dependent scenario, the probability is a function of the agent's future reliability. Let us construct a concrete case to illustrate this.

  Consider the "Promethean Lockbox." A research consortium has discovered a partial blueprint for a clean-energy technology that could sustain civilization for millions of years, yielding astronomical value ($V$). However, the blueprint is encrypted in a volatile mathematical state. To stabilize it, a specific, labor-intensive verification protocol must be performed by a human team every single year for fifty years. If the team misses a year, loses funding, or pivots to "more efficient" research that bypasses the protocol, the mathematical coherence collapses, and the value becomes zero. The probability of success is not $P(\text{Universe allows this})$, but $P(\text{We stick to the plan for 50 years})$.

  **The Problem of Dynamic Inconsistency**

  In this scenario, the expected value at Year 0 is $EV = P(\text{Completion}) \times V - \text{Cost}$. If $V$ is astronomical, even a tiny $P(\text{Completion})$ justifies starting the project. However, agent-dependency introduces a recursive threat. At Year 25, the agent faces a new decision. The sunk costs are high. The remaining work is 25 years. The agent must re-evaluate: "Given what I know now, what is the probability we finish the remaining 25 years?"

  Here lies the collapse of standard EV fanaticism as a decision procedure. If the agent is a pure expected-value maximizer at every time slice ($t_0, t_1, \dots t_{50}$), they are vulnerable to dynamic inconsistency. At $t_{25}$, the "astronomical" value is still there, but the *marginal* probability of success might look lower due to unforeseen difficulties encountered in the first half. If the agent calculates that the cost of the next 25 years outweighs the *current* expected value (which is now discounted by the observed fragility of the institution), rational act-maximization dictates quitting.

  But if the agent quits at $t_{25}$, the value of the project at $t_0$ was effectively zero. The initial calculation was falsified by the agent's own future rationality. This creates a paradox: recognizing the astronomical value makes the agent sensitive to the fragility of the chain, which makes them more likely to cut losses when the chain frays, which ensures the chain breaks. In agent-dependent contexts, the act of calculating EV can be self-undermining. If the probability of the payoff is contingent on the agent *not* optimizing locally at every step, then local optimization destroys the value.

  **Calculative Insulation as a Rational Requirement**

  Does this mean EV fanaticism collapses? Not necessarily. It means that the *method* of maximization must shift. The rational structure of agent-dependent fanaticism requires that the agent treats the initial commitment as a binding policy rather than a series of discrete bets.

  To secure the astronomical value, the agent at $t_0$ must recognize that their future self at $t_{25}$ cannot be trusted to perform the correct EV calculation. The $t_{25}$ self will be biased by immediate costs and the visibility of obstacles, whereas the $t_0$ self saw the total picture. Therefore, maximizing expected value over the *whole timeline* requires the $t_0$ agent to restrict the decision-making capacity of the $t_{25}$ agent.

  This is what I term "calculative insulation." The agent must pre-commit to ignoring certain EV recalculations. In the Promethean Lockbox scenario, this means establishing institutional rules that make abandoning the project prohibitively difficult, even if an intermediate cost-benefit analysis suggests quitting. This might look like locking funds in a trust that cannot be redirected, or cultivating a culture of "mission fidelity" that treats deviation as a moral failure rather than a rational update.

  Critics might argue this is irrational dogmatism. Why should an agent ignore new information about costs? The answer lies in the structure of the payoff. In agent-dependent scenarios, the "information" gained at $t_{25}$ about the difficulty of the task is often endogenous to the effort itself. If the project were easy, the value wouldn't be astronomical (due to competition or triviality). The difficulty is a feature, not a bug. Re-evaluating based on difficulty is double-counting the cost. The only relevant variable is whether the *causal chain* is intact. As long as the team exists and the protocol is possible, the EV remains astronomical. To update downward simply because the work is hard is to misunderstand the nature of the value.

  **The Verdict: Policy Over Act**

  This leads to a definitive verdict on the debate. EV fanaticism does not collapse when factoring in agent-dependency, but it ceases to be a doctrine of *act-evaluation* and becomes a doctrine of *identity-constitution*.

  If you approach the Promethean Lockbox asking, "Does this action maximize EV right now?" at every yearly interval, you will fail. The probability of success is contingent on you *not* asking that question too aggressively. The fanaticism is justified only if the agent constitutes themselves as the kind of entity that does not break the chain. This distinguishes the "fragile pipeline" from the "passive lottery." In a lottery, your future actions don't matter. In the pipeline, your future actions *are* the probability.

  Therefore, the rationality of EV fanaticism in agent-dependent contexts is conditional on the ability to pre-commit. For an agent who cannot bind their future self (a purely ephemeral act-maximizer), EV fanaticism is self-defeating and should be rejected. For an agent who can bind their future self (through institutions, contracts, or vocational ethics), EV fanaticism is not only rational but required.

  **Conclusion**

  The debate over EV fanaticism often stalls on the credibility of tiny probabilities. The agent-dependency objection moves the goalposts to the stability of the causal chain. My analysis shows that this dependency does not negate the value, but it exposes the fragility of standard rational choice theory over time. The astronomical payoff exists, but it is hidden behind a door that locks if you stop to check the map.

  Consequently, we must defend a qualified verdict: EV fanaticism is rational, but only as a selection criterion for long-term policies, not as a heuristic for sequential decisions. To pursue the astronomical good in a fragile world, one must be willing to act irrationally at the micro-level to remain rational at the macro-level. The "fanatic" is not the one who bets on the long odds; it is the one who refuses to let the odds change their mind. In the context of agent-dependent outcomes, that stubbornness is not a bug in the rational machinery; it is the only feature that allows the machinery to function.
