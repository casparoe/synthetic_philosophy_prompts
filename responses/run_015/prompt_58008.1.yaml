      *   *Position C: Surrogate Knowledge.* Imaginative simulation, empathy, or testimony. (Decision rule: Use others' experiences to bridge the epistemic gap.)

  3.  **Map Positions to Craft Techniques:**

      *   *Position A (Resilience):*
          *   *Craft Challenge:* How to show a decision based on *capacity* rather than *outcome*?
