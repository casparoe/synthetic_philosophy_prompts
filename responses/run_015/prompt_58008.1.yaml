          *   *Temporal Stance:* Prolepsis (flash-forward) is tempting but risky. If we see the future, it's not transformative anymore. Maybe a "subjunctive" mode?
          *   *Knowledge:* The character feels the *pull* of the unknown.
          *   *Technique:* Lyrical abstraction, gaps in interiority. The "hole" in the text where the new language should be.
