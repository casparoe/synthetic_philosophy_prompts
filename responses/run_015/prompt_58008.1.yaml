          *   *Temporal Stance:* Retrospective narration might cheat (knowing she survived). Needs to be *in media res* of the decision.
          *   *Knowledge:* The reader must know she doesn't know the outcome, but knows her own韧性 (resilience).
          *   *Technique:* Focus on *scene* over *summary* regarding past trials. Show, don't tell, her history of adaptation.
          *   *Risk:* If the narrator predicts her resilience, it's prolepsis that undermines the tension.

      *   *Position B (Revelatory Character):*
          *   *Craft Challenge:* How to value an experience you haven't had?
