  7.  **Final Polish:** Ensure clear headings and precise terminology (e.g., "Pareto-superior," "Equilibrium selection," "Second-order expectations"). Make sure the distinction between Lewis's original project and the *extension* to normativity is clear. (Lewis was wary of calling conventions "norms" in the moral sense).

