      *   *(iv) Exclusion Conditions:* What the theory must *not* do. Don't reduce 'ought' to 'will be' (Hume's Law violation). Don't import heavy moral realism (naturalism constraint).
          *   *Motivating Case:* "Everyone jumps off a bridge" (predictive reliability $\neq$ obligation).
