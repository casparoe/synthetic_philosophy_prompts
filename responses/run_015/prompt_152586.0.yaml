          *   If preferences change (Pareto-superior alternative arises, e.g., metric system, or driving on the right for international alignment), a pure Lewisian convention should shift immediately once mutual expectations shift.
          *   To explain *resistance* to change (b), you usually need something adding cost to deviation beyond the coordination failure. This is typically second-order sanctions (blame, shame) or internalized "oughts."
