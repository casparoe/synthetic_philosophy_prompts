answer: |-
  # Seminar Handout: Desiderata for a Lewisian Theory of Norm Evolution

  **Topic:** Extending Lewisian Convention to Normative Practices
  **Context:** Philosophy of Social Norms
  **Framework:** David Lewis, *Convention* (1969); Evolutionary Game Theory

  ## Introduction
  David Lewis's analysis of convention provides a robust account of how arbitrary regularities (e.g., driving on the left) emerge and stabilize through mutual expectations and conditional preferences for coordination, without explicit agreement or authority. However, Lewisian conventions are fundamentally prudential: they bind agents only insofar as coordination is preferred to non-coordination. Genuine social norms, by contrast, exhibit *normativity*: they are experienced as binding obligations that often persist even when the coordination benefit dissipates or a Pareto-superior alternative becomes available.

  The following desiderata specify the requirements for a theory that successfully bridges Lewisian coordination with genuine normativity. Each requirement is categorized by its function and marked as either **Non-Negotiable** (required for the coherence of the project) or **Camp-Specific** (dependent on metaethical or methodological commitments, e.g., reductionism vs. realism).

  ---

  ## I. Desiderata for an Adequate Theory

  ### (i) Explanatory Coverage
  The theory must account for the dynamic transition from mere behavioral regularity to normative practice.
  *   **Requirement 1: The Moralization Transition.** The theory must explain how a regularity sustained by first-order coordination preferences acquires a "moralized" character (e.g., the shift from a fashion trend to a dress code, or from a queuing habit to a fairness norm).
      *   *Motivating Case:* Tipping. Initially a gratuity for service (coordination/prudence), it evolves into a mandatory social obligation where non-tipping is met with hostility, even in one-off interactions where reputation is not at stake.
      *   *Status:* **Non-Negotiable.** A theory of norm *evolution* that cannot explain the emergence of normativity fails its primary explanatory task.
  *   **Requirement 2: Suboptimal Persistence.** The theory must explain the stability of norms that are no longer Pareto-optimal or are strictly dominated by available alternatives.
      *   *Motivating Case:* The QWERTY keyboard layout or Imperial measurement systems. Agents continue to use them despite known inefficiencies, citing "the rules" or "proper procedure" rather than mere habit.
      *   *Status:* **Non-Negotiable.** If the theory predicts immediate migration to Pareto-superior equilibria, it describes rational choice, not normative constraint.

  ### (ii) Conceptual Distinctions
  The theory must maintain structural distinctions between different types of expectations and forces, even if it ultimately reduces one to the other.
  *   **Requirement 3: First-Order vs. Second-Order Expectations.** The theory must distinguish between expecting others to *act* (first-order) and expecting others to *react* to deviations with approval or sanction (second-order).
      *   *Motivating Case:* A traffic jam vs. A queue. In a jam, I expect you to stop (descriptive). In a queue, I expect you to *think I ought* to wait my turn and to resent me if I cut (normative).
      *   *Status:* **Non-Negotiable.** Collapsing this distinction *a priori* renders the theory unable to diagnose the mechanism of normativity. (Whether the theory *reduces* second-order to first-order is a separate Camp-Specific choice).
  *   **Requirement 4: Descriptive Stability vs. Prescriptive Force.** The theory must distinguish between a regularity that *is* stable and a rule that *ought* to be followed.
      *   *Motivating Case:* "Everyone drinks coffee" (stability) vs. "One ought to greet elders" (force).
      *   *Status:* **Camp-Specific.** Reductionists may argue prescriptive force *just is* a complex form of descriptive stability (psychological projection). Realists will mark this as Non-Negotiable. For the purpose of this seminar, we treat the *distinction* as Non-Negotiable, but the *ontological gap* as Camp-Specific.

  ### (iii) Consistency Constraints
  The theory must remain compatible with the foundational constraints of the Lewisian and Evolutionary frameworks.
  *   **Requirement 5: Decentralization.** The theory cannot rely on explicit agreement, centralized authority, or top-down legislation to establish the norm.
      *   *Motivating Case:* Language evolution. No academy dictated English grammar; it emerged from interaction.
      *   *Status:* **Non-Negotiable.** This defines the project as an extension of *Lewis*, not a theory of law or institutions.
  *   **Requirement 6: Equilibrium Selection.** The theory must be compatible with evolutionary dynamics where multiple equilibria exist and selection is path-dependent rather than strictly efficiency-driven.
      *   *Motivating Case:* Driving on the left (UK) vs. right (US). Both are stable; history, not logic, decided.
      *   *Status:* **Non-Negotiable.** Required for compatibility with Evolutionary Game Theory (EGT).

  ### (iv) Exclusion Conditions
  The theory must avoid specific philosophical pitfalls.
  *   **Requirement 7: No 'Is-Ought' Collapse.** The theory must not reduce the normative 'ought' simply to predictive reliability (e.g., "You ought to X" cannot mean merely "You will be punished if you don't" or "Everyone does X").
      *   *Motivating Case:* The "Bandwagon Fallacy." Just because everyone jumps off a bridge doesn't create an obligation to do so.
      *   *Status:* **Non-Negotiable.** Violating this commits the naturalistic fallacy, rendering the account sociological rather than philosophical.
  *   **Requirement 8: No Unreduced Moral Realism.** The theory should not posit sui generis moral facts that exist independently of human psychology or interaction.
      *   *Motivating Case:* Platonistic values.
      *   *Status:* **Camp-Specific.** Naturalists mark this Non-Negotiable; Moral Realists mark it as a constraint they reject. For a naturalistic extension of Lewis, this is **Non-Negotiable**.

  ---

  ## II. Analysis of the Core Tension

  We now address the central trilemma facing any Lewisian extension. Can a theory simultaneously satisfy:
  *   **(a) First-Order Reduction:** Deriving normative force *solely* from first-order coordination preferences (preference for conformity conditional on others conforming), without invoking second-order attitudes (sanctions, blame, resentment).
  *   **(b) Normative Stickiness:** Explaining why moralized conventions resist revision even when a Pareto-superior alternative is available.
  *   **(c) Lewisian Fidelity:** Remaining faithful to Lewis's claim that conventions require no authority or explicit rule (decentralized emergence).

  ### The Conflict
  **It is impossible to satisfy (a), (b), and (c) simultaneously.**

  The conflict arises between **(a)** and **(b)**, mediated by **(c)**.

  1.  **Lewisian Preferences are Prudential:** In Lewis's framework, an agent's preference for conforming to a convention is conditional on the expectation that others will conform. $Preference(Conform) > Preference(Deviate)$ only if $Expect(Others\_Conform)$.
  2.  **Pareto-Improvement Undermines (a):** If a Pareto-superior alternative becomes available (e.g., a more efficient signaling system), the payoff structure changes. Under condition **(a)**, the agent's first-order preference shifts immediately to the new equilibrium, provided mutual expectations can coordinate on it. There is no internal resource within first-order coordination preferences to *resist* a payoff improvement.
  3.  **Stickiness Requires Extra Costs:** To satisfy **(b)** (resistance to change), there must be a cost to deviation that outweighs the Pareto-gain of the new equilibrium. In a decentralized system **(c)**, this cost cannot come from a central authority. It must come from other agents.
  4.  **The Necessity of Second-Order Attitudes:** Costs imposed by other agents in a decentralized system manifest as social sanctions (blame, ostracism, reputation loss). Expecting these sanctions requires **second-order expectations** (I expect that you expect me to conform, and will punish me if I don't).
  5.  **Conclusion:** Satisfying **(b)** and **(c)** necessitates the introduction of second-order attitudes. This directly violates **(a)**.

  ### Diagnosis of the Failure
  *   **(a) vs. (b):** First-order preferences track efficiency. If norms resist efficiency, first-order preferences are insufficient.
  *   **(a) vs. (c):** Without authority (c), the only way to sustain a suboptimal equilibrium is through peer enforcement. Peer enforcement implies second-order attitudes, violating (a).

  ### Recommended Relaxation
  To save the project of explaining norm evolution within a Lewisian-Evolutionary framework, we must **relax (a)**.

  **Relaxation:** Allow normative force to emerge from **second-order expectations** (expectations of sanctions/approval) that evolve alongside behavioral regularities.

  **Justification:**
  1.  **Least Damage to Project:** Relaxing (a) does not violate Lewis's core insight about decentralization **(c)**. Lewis himself acknowledged that conventions *can* be reinforced by sanctions, though he tried to define them without reference to sanctions to distinguish them from obligations. Extending the framework to *include* sanctions as an evolutionary add-on preserves the decentralized, equilibrium-based methodology.
  2.  **Explanatory Power:** Retaining (b) is essential. A theory of norms that cannot explain why harmful or inefficient norms persist (e.g., dueling, foot binding) is empirically inadequate.
  3.  **Philosophical Coherence:** Relaxing (a) allows us to distinguish between a mere habit (first-order) and a norm (first-order + second-order). This helps satisfy Exclusion Condition **(7)** (No 'Is-Ought' Collapse) by locating the "ought" in the normative expectation of sanction, rather than mere predictive regularity.

  ### Location of Existing Accounts
  *   **Cristina Bicchieri (*The Grammar of Society*):** Satisfies (b) and (c) by relaxing (a). She explicitly distinguishes descriptive norms (first-order) from social norms (contingent on second-order expectations of sanctions).
  *   **Ken Binmore (*Natural Justice*):** Attempts to keep (a) closer to the surface by deriving norms from deep evolutionary equilibria (Rawlsian original position modeled as EGT). Risks failing (b) if the "deep" equilibria are assumed to be efficiency-tracking.
  *   **Pure Lewisian Reductionism:** Satisfies (a) and (c) but fails (b). It can explain the *origin* of conventions but not their *moralization* or *stickiness* against Pareto improvements.

  ### Final Directive for the Seminar
  Proceed on the assumption that **Requirement (a) must be dropped.** The seminar should focus on how second-order attitudes emerge from first-order coordination problems without violating the decentralization constraint **(c)**. The key mechanism to investigate is how *conditional preferences for conformity* transform into *conditional preferences for sanctioning deviators*.
