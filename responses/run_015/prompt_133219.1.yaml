answer: |-
  **Remarks for Courthouse Square**

  Good morning. Thank you for standing with us in the square.

  We are here to mark a change. As you can see, the bronze figure of Elias Rowntree is no longer on this pedestal. It has been moved two hundred yards, to the lawn of the County Historical Society. The granite pedestal remains here. Fixed to it is a new tablet, without a name, explaining that we have moved the monument because we are no longer willing to make the claim it originally made.

  I chair the committee that recommended this change, and I want to say plainly why we did it, and what we hope this space becomes.

  For a hundred years, the story told in this square was that Elias Rowntree gave this land to the town, and that he funded the first schoolhouse. It was a story of generosity, and it was written in bronze. But the deed records in the county clerk's office tell a different story. They show the land was sold at market price, and the school was built from a tax levy. When a monument stands as a record of facts, those facts matter. If the record is wrong, the monument cannot stay in the center of our public square as if it were true.

  But a monument in a town square is not only a record. It is also a place where we gather. For eighty years, this pedestal has been the focal point of our Memorial Day ceremonies. The veterans who lay the wreath, the families who stand in the shade of the trees, the neighbors who meet here year after year—you were not gathering to inspect a deed. You were gathering to honor the dead, and to recognize one another as a community. That practice is real. The value of that gathering does not vanish because the story about Rowntree was mistaken.

  This brings us to the distinction that guides what we have done. We are separating the work of recording from the work of honoring.

  Recording belongs to the historians. It requires accuracy, documents, and a willingness to correct the story when the papers show us something new. That is why the bronze figure now stands beside the Historical Society's display case. There, it can be seen alongside the research into the land transactions. It becomes part of the county's history, exactly as it is, without asking us to pretend it is something it is not.

  Honoring belongs to the living. It requires a place where we can stand together, without needing to verify a transaction before we lay a wreath. That is why the pedestal stays here. This square remains a place for our shared life. The new tablet does not name a hero. It simply tells the truth about the move, and it speaks to the people who will stand here fifty years from now. It asks them to judge whether we were right to make this change. We do not claim to have finished that judgment today.

  To the Rowntree family, and to those who loved the statue as it was: I know this feels like a correction being administered to your grandparents. I want to be clear that this is not a judgment on Elias Rowntree's character. He is not here to answer for himself, and we are not here to try him. This is a decision about what we put in the center of our own town. It is about the claim we make, not the claim he made.

  We have moved the statue so that the history can be told correctly, and we have kept the pedestal so that the honoring can continue honestly.

  The display case at the Historical Society is open. It contains the research behind this decision. I invite you, when you are ready, to walk across the street and look at it. It is not a lesson to be learned, but a story to be continued. The records are there, waiting for you to read them, just as the square is here, waiting for us to use it.

  Thank you.

  ***

  **Note on Risk**

  **Sentence 1:** *"They show the land was sold at market price, and the school was built from a tax levy."*
  **Why it risks trouble:** This is the factual core that hurts the Rowntree descendants and traditionalists. Even stated plainly, it contradicts a century of family lore and may be heard as an accusation of dishonesty rather than a correction of record.
  **Alternative:** *"They do not show a donation of the land, nor a private funding of the school."* (This frames it as an absence of evidence rather than a contradictory presence, which is slightly softer while remaining accurate.)

  **Sentence 2:** *"This is a decision about what we put in the center of our own town. It is about the claim we make, not the claim he made."*
  **Why it risks trouble:** This may frustrate the petitioners and historians who believe the move *is* a moral judgment on Rowntree's status. They may feel this sentence dodges the ethical weight of the removal by focusing entirely on the town's feelings.
  **Alternative:** *"This is a decision about what we affirm in the center of our town. It is about the truth we keep, and the honor we hold."* (This retains the focus on the town's responsibility without explicitly absolving Rowntree of the implication.)
