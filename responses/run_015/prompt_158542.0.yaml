answer: |-
  **Project Title: The Individuation of Decisions and the Transmission of Fanaticism**

  **Research Question**
  The contemporary debate over expected-value fanaticism asks whether one ought to accept an arbitrarily small probability of an astronomical payoff over a certain modest good. Standard formulations treat this as a question about the shape of the value function or the validity of expected utility maximisation in single cases. This project poses a prior, structural question: Is the proper object of normative assessment a single act, a package of independent acts, or a policy mapping evidence to acts? The precise question this project answers is whether fanaticism is an invariant feature of rational choice or whether its presence depends on the level at which decisions are individuated. Specifically, it tests the conjecture that avoiding fanaticism at the level of single acts requires package-sensitivity, which either induces diachronic instability or transmits fanaticism to the level of policy selection.

  **Background and Gap**
  The literature has largely assumed the decision problem is given. Defences of fanaticism rely on the linearity of expectation; resistances propose bounded utility or risk-weighted views. However, these positions typically evaluate isolated prospects. This leaves open the individuation question. Arguments for fanaticism often gain traction through aggregation: a single mugger's offer seems absurd, but a long run of such offers suggests massive cumulative expected value. Conversely, risk-avoidance might justify rejecting a single bet but fail to justify rejecting a package of independent bets where the law of large numbers stabilises the outcome.

  Existing views have not had to take a stand on individuation because they presuppose act-individuation. Bounded utility functions avoid fanaticism per act but do not specify how bounds apply across temporally extended sequences. Risk-avoidance models typically assess static prospects. Consequently, it remains unknown whether a view that avoids fanaticism locally must accept it globally. If avoiding fanaticism requires knowing how many future opportunities will arise, the view becomes package-sensitive. This creates a gap: standard theories lack the resources to explain how an agent should decide now based on facts about her future decision opportunities without invoking a policy-based framework. This project maps that gap.

  **Methodology**
  The project proceeds over twelve months using a formal toy model rather than axiomatics, empirical study, or literature survey. Axiomatics is too abstract to capture the dynamic tension between acts and policies. Empirical study addresses descriptive psychology, not normative structure. A literature survey is insufficient as the individuation question is currently unarticulated. The toy model isolates the structural variables.

  *Months 1–3: Model Construction.* I will formalise a finite sequence of independent offers, each involving a tiny probability of a large finite payoff. I will define three agent types: the act-agent (evaluates each offer separately), the package-agent (evaluates the set of offers), and the policy-agent (selects a rule for acceptance).
  *Months 4–6: Act vs. Package.* I will analyse conditions under which the act-agent avoids fanaticism while the package-agent accepts it. I will test for diachronic instability: does the package-agent intend to accept the sequence but reject individual instances when they arrive?
  *Months 7–9: The Policy Level.* If act-based avoidance proves unstable, I will model policy selection. Does choosing a policy to reject all such offers restore consistency, or does expected value maximisation over policies reinstate fanaticism?
  *Months 10–12: Synthesis.* I will compare the normative verdicts across levels to determine if fanaticism is transmitted or transformed.

  This apparatus is defended by its specificity. It allows for precise tracking of verdict shifts across levels, which general axiomatics obscures. By restricting the horizon to finite runs, I avoid the complexities of infinite ethics while preserving the aggregation intuition driving fanaticism.

  **Expected Outcomes**
  A successful result will not merely verdict on fanaticism but classify its structural behaviour. There are three primary possible conclusions. First, the problem dissolves: verdicts are invariant across levels. This would suggest individuation is normatively irrelevant. Second, fanaticism relocates: acts can be non-fanatical, but policy selection becomes fanatical. This supports the conjecture that fanaticism is transmitted upwards. Third, fanaticism amplifies: the pressure to accept astronomical payoffs is stronger at the policy level than the act level.

  The considerations deciding among these will be dynamic coherence and stability. If a non-fanatical act-plan cannot be executed without self-defeat, the act-level verdict is unstable. If a policy to reject offers yields lower expected value than a policy to accept them, fanaticism reappears at the policy level. The project will determine which level, if any, is normatively basic. If fanaticism persists at every level, the debate must shift from modifying value functions to restricting decision individuation itself.

  **Failure Conditions and Manageability**
  The project fails if the model demonstrates that individuation makes no difference to normative verdicts. If act-based and policy-based evaluations converge trivially on the same choices regardless of parameters, the conjecture that individuation matters is falsified, and the project yields no positive philosophical insight.

  The most likely risk to manageability is the complexity of defining policies. If the policy space becomes too large to analyse within the timeframe, the comparison between levels will remain incomplete. To mitigate this, I will restrict the class of admissible policies to simple threshold rules. This ensures the model remains tractable while preserving the essential features of rule-based decision-making. Should the formalisation threaten to expand beyond twelve months, I will prioritise the comparison between act and package levels, treating the policy level as a secondary extension.

  \answer{Normative verdicts depend on the level of decision individuation.}
