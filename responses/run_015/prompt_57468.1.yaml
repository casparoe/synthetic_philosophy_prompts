  Give me exactly five numbered items, one or two sentences each, with nothing before or after the list -- no intro, no wrap up. Items 1-3 are the tests, in the order a person should actually ask them, and each one has to say what counts as passing and what the verdict is if it fails (required / not required / required-but-with-leeway / whatever your third bucket ends up being). Items 4 and 5 are my two cases run through those tests: (a) the 4am hand-patch, and (b) mentoring, as our doc currently words it, which is "everyone should help onboard new teammates" and nobody has ever been in trouble for not doing it.

  Things it has to survive or I'm wasting my time. The onboarding line is the interesting one -- it feels like a real requirement where you get to pick which instance and when, so the procedure needs to say how much leeway is legitimate before it's just a polite excuse. It has to handle the ratchet: something genuinely above-and-beyond last year becomes the baseline this year, and I want a rule for when that promotion is legitimate and when its just the company free-riding on praise. And the whole thing has to be usable by someone with zero philosophy background in the five minutes before they reply in a Slack thread, so plain words, plus say out loud wherever a step is really a value judgment wearing a procedure costume. One of the two case verdicts is going to make people mad -- tell me which and why.
