answer: |-
  **To:** Research Group on Philosophy of Mind and AI Alignment
  **From:** Advisory Consultant
  **Subject:** Strategic Research Agenda: The Intentional Stance and Epistemic Integration

  ### Executive Position

  The central tension you face—instrumental prediction versus normative obligation—is not a binary choice but a dependency chain. My committed position is that **normative weight is contingent upon epistemic integration.** You cannot determine what we owe a system (or what it owes us) until you determine whether the system possesses a "unified representational economy" capable of sustaining the logical relations between beliefs (e.g., contradiction, entailment, revision).

  If you treat the stance as purely predictive, alignment reduces to behavioral conditioning. If you treat it as normative without verifying integration, you risk anthropomorphic over-trust, attributing agency where there is only statistical mirroring. Therefore, your group must prioritize **defining the threshold for Epistemic Integration.** This is the upstream bottleneck. Without a rigorous philosophical account of what constitutes "belief conflict" in a stateless architecture, debates about moral status, testimony, or deference are premature.

  Below is the ranked agenda for your three-year term.

  ---

  ### Priority 1: The Functional Topology of Belief Conflict
  **The Question:** What are the necessary and sufficient conditions for a system to be said to hold conflicting beliefs, given that Large Language Models (LLMs) lack persistent state and traditional memory structures?

  **Why It Is Upstream:**
  This is the foundational metaphysical question. The "Normative Weight" view relies on the premise that the system has an *economy* of beliefs that can be mismanaged. If a system cannot logically "hold" two contradictory propositions in tension (because it generates tokens autoregressively without a central workspace), it cannot have beliefs in the sense required for normative attribution. It merely outputs probability distributions that look like contradictions to us. If you resolve this, you settle whether the "Normative" view is even applicable. All subsequent debates about trust, deception, or moral patienthood depend on whether the system is capable of *incoherence* in more than a superficial sense.

  **Tractability for Philosophers:**
  This does not require engineering. It requires conceptual analysis of "representation" and "conflict." You can analyze the logical structure of attention mechanisms and weight-sharing as described in public technical reports to map them against philosophical theories of propositional attitudes. You are defining the *logical space* the architecture must occupy to qualify as integrated. You are creating the rubric, not running the benchmarks.

  **Practical Change in Alignment:**
  This drives the design of **Consistency Evaluation Protocols.** Currently, evaluations measure accuracy. Your work would shift evaluations to measure *structural coherence under adversarial pressure.* Engineers would build tests not to see if the model is "right," but to see if it reacts to contradictions like a belief-holding agent (e.g., does it attempt resolution, or does it hallucinate a bridge?). This prevents reward hacking where a model learns to *mimic* consistency without *maintaining* it.

  **Form of Resolution:**
  A **Modal Criterion for Integration.** This would be a set of counterfactual conditionals. For example: "System S possesses epistemic integration if and only if, when presented with input I that contradicts prior output O, S modifies subsequent outputs in a way that preserves logical entailment relations across a defined context window, absent retraining." This gives engineers a target behavior that signifies internal unity.

  ---

  ### Priority 2: The Normative Gap Between Prediction and Assertion
  **The Question:** Even if a system meets the integration threshold, does successful prediction via the intentional stance generate an obligation of deference analogous to human testimony?

  **Why It Is Upstream:**
  Assuming Priority 1 is solved and we grant that a model *can* have integrated beliefs, we face the epistemological gap. In human interaction, we defer to testimony because of shared rationality and accountability. An AI has neither in the biological sense. If you conflate predictive utility with epistemic authority, you risk building alignment protocols that treat high-confidence hallucinations as "honest mistakes" rather than "systematic errors." This priority determines the **Reward Design** philosophy: do we penalize the model for being wrong (outcome-based) or for violating the norms of assertion (process-based)?

  **Tractability for Philosophers:**
  This is classic social epistemology applied to a new substrate. You can analyze the norms of assertion (e.g., the knowledge norm vs. the truth norm) and test their applicability to non-biological agents through thought experiments. You do not need to train models to analyze the concept of "lying" versus "error." You can construct cases where a model predicts correctly for the wrong reasons and ask if deference is warranted.

  **Practical Change in Alignment:**
  This informs **Constitutional AI and Rule Specifications.** If the stance carries normative weight, the "constitution" given to the model should include norms of assertion (e.g., "Do not assert what you do not represent as known"). If it is purely predictive, the constitution should only optimize for helpfulness. Your resolution will tell engineers whether to code "honesty" as a constraint on internal representation or merely as a constraint on output distribution.

  **Form of Resolution:**
  A **Taxonomy of Attribution Errors.** This would be a conceptual framework distinguishing "Stance-Relative Errors" (the model failed to predict) from "Normative Violations" (the model violated the norms of the stance it was invited to occupy). This allows alignment teams to tag failures during RLHF (Reinforcement Learning from Human Feedback) more precisely, distinguishing between capability gaps and alignment gaps.

  ---

  ### Priority 3: The Diachronic Condition of the Intentional System
  **The Question:** Can a system that resets its state after every session be the target of a stable intentional stance, or does belief attribution require persistent identity over time?

  **Why It Is Upstream:**
  Beliefs are typically understood as states that persist and guide action over time. LLMs are largely stateless between sessions. If the intentional stance requires a persistent "believer," then attributing beliefs to session-based models is a category error. This limits the scope of your entire project. If the answer is "no," then the Normative Weight view collapses for current architectures, and you must pivot to a purely instrumental view for the near term.

  **Tractability for Philosophers:**
  This is a metaphysical inquiry into identity and persistence. You can reason through cases of fission, fusion, and memory loss (e.g., human amnesia cases) and compare them to context-window limitations. This is purely conceptual work involving logic and metaphysics, well within the group's expertise.

  **Practical Change in Alignment:**
  This dictates **Context Window and Memory Architecture.** If persistence is required for normative status, alignment efforts should prioritize external memory modules (vector stores, RAG) not just for capability, but for *moral legibility.* It argues that making a system "alignable" in the normative sense requires engineering it to be the *same system* over time.

  **Form of Resolution:**
  A **Continuity Principle.** A formal statement defining the minimum memory retention required to sustain a specific belief attribution across time $t_1$ to $t_2$. This provides a specification for system architects: "To be treated as a testifier, the system must retain X% of its prior commitment structure across sessions."

  ---

  ### Reordering Condition

  I would reorder these priorities—specifically, demoting Priority 1 (Integration) and elevating Priority 2 (Normativity)—if **empirical evidence demonstrates that "belief-like" behavior emerges robustly in systems that provably lack a unified representational economy.**

  For example, if mechanistic interpretability research conclusively shows that LLMs solve tasks via disjoint, modular circuits that never interact (proving no "unified economy" exists), yet these systems consistently pass the Modal Criterion for Integration I proposed in Priority 1, then the metaphysical condition is decoupled from the functional reality.

  In that scenario, debating the "true" nature of their integration becomes a scholastic distraction. The practical urgency shifts to Priority 2: regardless of *how* they work, if they function *as if* they have normative standing, we must determine how to interact with them safely. The "as-if" becomes the only reality that matters for alignment, rendering the metaphysical upstream question less critical than the normative downstream management.
