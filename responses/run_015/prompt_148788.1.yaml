answer: |-
  Last year, an editor killed a sentence of mine: "The agency's failure to act caused the deaths." She couldn't explain what was wrong with it, only that it felt different from "The flood caused the deaths." Around the same time, a colleague covering climate change stalled on attributing harms to nations that didn't cut emissions. We circled the same drain: can an omission be a cause, or is that just smuggling blame in through the back door? The literature treats "an omission" as a unitary category. This is the bug. My project proposes that there are at least three distinct kinds: a scheduled action withheld (a nurse skipping a dose); an ability possessed but no intention formed (a passerby ignoring a drowning child); and a structural impossibility (no individual had standing to create the necessary policy).

  The research question is determinate: Is there any baseline for an omission that does no normative work at all? The three standard positions leave this open. Realists (omissions are causes) ignore the baseline problem, assuming counterfactuals are descriptive. Skeptics (omissions are never causes) dismiss the pragmatic utility of the distinction, focusing on metaphysical purity. Pluralists shrug and say "it depends," offering no criteria for when it depends on what. None explain why the nurse feels different from the passerby, or why the climate case feels different from both.

  Over nine months, I will test whether professional gatekeepers stabilize these baselines. I have no empirical budget, but I have a Rolodex. I will conduct structured half-hour interviews with working reporters, editors, and judges. I will present a fixed set of cases spanning my three-way taxonomy and ask not just for verdicts, but for the reasoning behind them. Specifically: what comparison case are they using? Are they comparing against what happened, what should have happened, or what a decent agent would do?

  Honest assessment: Is this vibes-laundering? There is a risk. Asking people how they use language describes usage, not metaphysics. However, my hypothesis is that the concept of omission causation *is* inherently normative and pragmatic. If so, mapping professional usage *is* mapping the concept's reality. This beats armchair case-mongering because it tests actual stakes—headlines get printed, verdicts get handed down. It beats existing empirical work on causal judgment (psychology labs) because laypeople lack the institutional pressure to be consistent. Editors and judges must defend their causal claims publicly; their intuitions are hardened by consequence.

  The deliverable will be a one-page decision tree an editor could run before printing any sentence of the form "X's failure to do Y caused Z." It will route users through the taxonomy (scheduled vs. unintentional vs. structural) and force a choice on the baseline (normal course vs. normative expectation). If the tree works, it clarifies when a causal claim is actually a moral claim disguised as physics.

  Failure conditions are explicit. First, if my three-way taxonomy turns out to be merely relabeling the old dispute (e.g., if "structural" omissions collapse into "unintentional" ones under scrutiny), the project fails. Second, if everything floats on which baseline you pick and nothing pins the baseline down—if even experts switch baselines arbitrarily depending on desired outcomes—then there is no stable concept to map. I will state this out loud: if the baseline is unpinable, the project concludes that "causation by omission" is too unstable for public discourse without explicit normative tagging.

  A committed defender of the "omissions are never real causes" line would concede that language treats them as causes. They would admit that courts and headlines rely on the distinction. What they would dismiss as merely awkward is the practical need for a decision tree. To the metaphysical skeptic, the fact that editors struggle with the sentence is irrelevant; the sentence is false regardless of utility. They would argue that my project solves a linguistic problem, not an ontological one. They are exposed only if the ontological distinction proves useless for the purposes for which causation is invoked—prediction, accountability, and intervention. If the "false" causal claim does real work in the world, the skeptic's purity becomes a liability.

  This fellowship offers the time to sit with philosophers during office hours and refine the taxonomy, but the core work is journalistic: interviewing practitioners about the tools they use to construct reality. The goal is not to solve the metaphysics of causation, but to provide a style guide for truth-telling when the cause is nothing at all.

  Verdict: FUNDABLE | There is no purely descriptive baseline for omission causation.
