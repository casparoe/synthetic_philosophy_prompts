      *   *Constructivists:* Argue these are *diachronous* units. The "Renaissance" facies in Florence doesn't match the "Renaissance" facies in London. There is no global correlation. The "boundary" is a *fiat* boundary (like a Precambrian date) imposed retrospectively, not a physical horizon. The "Middle Ages" is a lithostratigraphic misnomer applied to a biostratigraphic reality.
