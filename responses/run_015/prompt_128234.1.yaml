prompt: |-
  As someone who has recently taken on responsibility for assessing escalation dynamics in long-term institutional commitments, I find myself returning to the logic of the dollar auction. Please analyse the 1965–1968 escalation of United States ground commitment in Vietnam through the lens of escalation-of-commitment and dollar-auction theory. I want a disciplined mapping: identify the effective bidders, specify what prize was being contested, set out the payoff rules that made withdrawal more costly than continued bidding at each stage, and show how the Gulf of Tonkin resolution and the 1968 Tet Offensive altered the auction structure rather than terminating it. Then, with equal rigour, tell me where the model breaks: does it explain the Johnson administration's refusal to withdraw despite private pessimism, or does it miss bureaucratic incrementalism, domestic audience costs, and — crucially — the possibility that the North Vietnamese leadership was running a parallel domestic escalation game? In particular, examine whether this was not a single bilateral auction but a nested structure in which both sides were locked in separate domestic bidding loops. Present the answer in British English, without bibliographies, citations, or reference lists; I want the conceptual analysis and its limits, not a survey of the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Topic:** Escalation of US ground commitment in Vietnam (1965–1968).
      *   **Theoretical Lens:** Escalation-of-commitment and Dollar Auction theory (Martin Shubik).
      *   **Specific Tasks:**
          *   Identify effective bidders.
          *   Specify the prize.
          *   Set out payoff rules (why withdrawal > continued bidding).
          *   Analyse Gulf of Tonkin Resolution and 1968 Tet Offensive as structural alterations, not terminations.
          *   Critique the model: Where does it break? (Bureaucratic incrementalism, domestic audience costs, parallel North Vietnamese escalation).
          *   Explore the "nested structure" hypothesis (two separate domestic bidding loops).
      *   **Constraints:** British English, no bibliographies/citations/reference lists, conceptual analysis focus.

  2.  **Deconstruct the Dollar Auction Theory:**
      *   *Core Mechanic:* Two bidders compete for a prize. Highest bidder wins the prize but *both* highest and second-highest bidders pay their bids.
      *   *Trap:* Once bidding exceeds the value of the prize, rational actors continue bidding to avoid the certain loss of the second-highest bid (sunk cost fallacy + loss aversion).
      *   *Application to Vietnam:* The US is the primary bidder. Who is the opponent? North Vietnam (Hanoi). What is the prize? South Vietnam's sovereignty/alignment. What are the bids? Troops, money, political capital. What is the penalty for losing? Loss of credibility, domino theory, domestic political fallout.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's role and the utility of the dollar auction model for understanding irrational escalation. Set the scene (1965–1968).

      *   **Mapping the Auction (1965–1968):**
          *   *Bidders:* Primary bidder = US Executive (Johnson Administration). Counter-bidder = North Vietnamese Politburo (Hanoi). *Crucial nuance:* Are they bidding against each other directly, or against their own past investments?
          *   *The Prize:* A non-communist South Vietnam (proxy for US global credibility/containment integrity).
          *   *Payoff Rules:* This is the heart of the dollar auction.
              *   *Winning:* Get South Vietnam.
              *   *Losing (Withdrawal):* You still pay the sunk costs (dead soldiers, spent money) *plus* you suffer the penalty of defeat (loss of credibility, domestic political attack).
              *   *Continuing:* You spend more, but there's a chance to validate the sunk costs.
              *   *Logic:* $Bid_{n+1} < Cost_{sunk} + Cost_{defeat}$. As long as the next increment of troops seems cheaper than admitting the previous troops died in vain, you bid.
          *   *Gulf of Tonkin (1964):* This wasn't the start of the auction, but it *authorised the currency*. It legitimised the bidding mechanism without a formal declaration of war, lowering the initial entry barrier but raising the stakes for exit (Congressional backing made withdrawal a betrayal of legislative trust).
          *   *Tet Offensive (1968):* Did it end the auction? No. It changed the *valuation of the prize*. The US realised the prize was worth less than the cost to win it. However, the auction structure remained because withdrawal still carried the "second-bidder penalty" (political ruin for Johnson/Democrats). It shifted the bidding from *military* escalation to *political* de-escalation (Johnson stepping down, seeking talks), but the sunk costs remained unpaid.

      *   **Critiquing the Model (Where it Breaks):**
          *   *Rationality Assumption:* Dollar auction assumes rational actors trying to minimise loss. Vietnam involved bureaucratic momentum. The "bid" wasn't always a conscious decision by Johnson; it was often a request from generals (Westmoreland).
          *   *Audience Costs:* The model treats the "penalty" as abstract. In reality, the penalty was specific: the 1968 election, the Great Society legislation.
          *   *The Opponent:* Was Hanoi playing the same game?
          *   *Nested Auctions:* This is the key insight requested.
              *   *US Loop:* Johnson vs. US Domestic Politics (Hawks vs. Doves).
              *   *NVN Loop:* Hanoi vs. NVN Domestic/Party Stability (Protracted War vs. Negotiation).
              *   *Interaction:* The US was bidding in its domestic auction *using* the war as currency, while Hanoi was doing the same. They weren't just bidding against each other; they were bidding to survive their own internal politics.

      *   **Synthesis/Conclusion:** Summarise the utility. The dollar auction explains the *trap*, but the nested domestic loops explain the *duration* and the specific *timing* of the exit.

  4.  **Refining the Tone and Language:**
      *   *British English:* Ensure spelling (analyse, programme, honour, defence) and phrasing (whilst, amongst, government rather than administration where appropriate, though "Johnson Administration" is a proper noun).
      *   *No Citations:* Do not mention Shubik, Staw, or specific historians by name in a reference context. Keep it conceptual.
      *   *Discipline:* Stick to the prompt's structure.

  5.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I clearly define the "second-highest bidder penalty"?
      *   *Correction:* Make sure to emphasise that in war, the "second bidder" is the one who quits first and bears the stigma of defeat while having already paid blood.
      *   *Check:* Did I address the Tet Offensive correctly?
      *   *Correction:* Ensure I don't say Tet ended the war. It ended the *credibility* of the military bid, forcing a change in the nature of the bid (political).
      *   *Check:* Is the "nested" argument strong enough?
      *   *Correction:* Explicitly contrast the bilateral view (US vs NVN) with the parallel domestic view (US vs US Politics, NVN vs NVN Politics). This addresses the prompt's specific request about parallel domestic escalation games.

  6.  **Final Polish:** Check for flow and ensure the distinction between the "auction" (the strategic interaction) and the "commitment trap" (the psychological/bureaucratic state) is clear. (Proceed to generate output based on these thoughts).

  *(Self-Correction on British English)*: Watch out for "administration" vs "government". In US context, "Johnson Administration" is standard even in UK English, but I should ensure general spelling is UK (e.g., "defence", "manoeuvre", "analyse").

  *(Self-Correction on Content)*: The prompt asks about 1965-1968. Ensure the focus remains tight on that window, though Tet is the endpoint.

  *(Final thought on the "Nested" concept)*: This is the most sophisticated part of the prompt. I need to make sure I don't just say "domestic politics mattered." I need to frame it as *two separate dollar auctions running simultaneously*, where the international moves are actually bids in the domestic auctions.

