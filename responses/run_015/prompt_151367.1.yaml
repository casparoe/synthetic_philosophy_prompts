      *   *Boltzmann Brains:* The BB scenario is *internally* generated by the physics model itself. The model (e.g., eternal inflation) + standard statistical mechanics $\rightarrow$ BBs dominate.
      *   *Structural Difference:*
          *   Evil Demon: "My senses are fake." (Doesn't necessarily invalidate the logic used to conceive the demon).
          *   BB Model: "The physical laws that allow me to reason about this model also imply my reasoning is noise."
          *   *Crucial Point:* The BB problem arises from *accepting* a scientific theory. The Evil Demon problem arises from *doubting* the basis of knowledge. One is a theory killing itself; the other is a skeptical hypothesis challenging all theories.
          *   *Measure Problem:* In BB, it's a numbers game (typicality). In Evil Demon, it's a possibility space.

  5.  **Address Question 3: Cognitive Instability:**
      *   *Definition:* It's not just "self-defeat." Self-defeat can be pragmatic (e.g., "Nothing is true" is self-defeating). Cognitive instability is more specific.
      *   *Sharpening:* It refers to the *dynamics of belief*. If believing $P$ gives you a reason to stop believing $P$ (not just because $P$ is false, but because the *process* of believing $P$ is untrustworthy under $P$), the belief state is unstable.
      *   *Distinction:*
          *   *Self-Defeat:* Logical contradiction (e.g., "I cannot speak").
          *   *Cognitive Instability:* Epistemic erosion. "If I believe this, I lose the justification for believing it." It's a feedback loop that dissolves the ground beneath the belief.
      *   *In BB context:* If I believe the Cosmological Model, I must believe I'm a BB. If I'm a BB, my belief in the Cosmological Model is random. Therefore, I shouldn't believe the Cosmological Model. But if I don't believe it, maybe I'm not a BB... (It creates a state where you can't rest in the belief).

