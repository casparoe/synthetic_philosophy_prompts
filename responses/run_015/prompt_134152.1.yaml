answer: |-
  **Project Title:** Local Coherence: Expected Utility Theory Under Representational Closure

  **Statement of the Problem and Core Question**
  Standard defenses of expected utility (EU) maximization, particularly Dutch Book arguments and representation theorems, rely on a strong structural assumption: that an agent's state space is fully specified and that coherence conditions apply globally across all representable outcomes. These arguments presume that for any logically possible partition of the world, the agent holds defined beliefs and preferences. However, physically implementable agents—whether human or artificial—operate with *representational closure*. They define preferences and beliefs only over outcomes they can actually represent, leaving large regions of logical possibility outside their cognitive or architectural boundary. These are not merely unknown states; they are unconceptualized states.

  This project asks whether coherence arguments survive if we restrict them to apply only within this representational closure. Specifically: Is an agent who is coherent *within* their representational boundary genuinely committed to expected utility maximization over that domain, or does the restriction force a departure into a different decision framework altogether?

  This inquiry must be distinguished from the familiar logical omniscience objection. The omniscience objection critiques the assumption that agents know all logical consequences of their beliefs. The representational closure problem is more fundamental: it concerns the absence of the conceptual vocabulary required to formulate certain states or outcomes in the first place. The question is not whether the agent can compute the probability of a complex logical proposition, but whether normative coherence binds them regarding propositions they cannot formulate. If coherence is only enforceable within the closure, does "local coherence" retain the normative force of global coherence, or does it dissolve into a fragmented decision procedure?

  **Background and Motivation**
  Classical decision theory treats bounded rationality as a performance error or a computational constraint imposed on an idealized normative model. In this view, EU theory remains the correct standard; agents fail to meet it due to cost or limited processing power. Conversely, recent literature in bounded rationality often focuses on heuristic search, satisficing, or ecological rationality, typically abandoning coherence constraints as descriptively inaccurate.

  Both approaches leave a critical gap open. Neither addresses whether the *normative justification* for coherence changes when the domain of application is structurally restricted. If the Dutch Book argument relies on the possibility of bets being offered on all states in a partition, but an agent cannot recognize bets on states outside their closure, the standard vulnerability argument may fail. If the agent cannot be exploited on unrepresented states, the pressure to maximize expected utility globally diminishes. Yet, it remains unclear whether this leads to a stable alternative norm or merely to incoherence. This project seeks to formalize this intermediate space: a decision theory for agents who are rational *within* their limits, without assuming those limits are merely computational costs.

  **Research Plan and Methodology**
  The project will be conducted over three months, divided into three distinct phases of formalization and analysis.

  *Month 1: Formalizing Representational Closure*
  The first month will be dedicated to defining the structural boundaries of the agent's state space. I will develop a formal model of "representational closure" as a subset of the logical state space that is closed under the agent's available conceptual operations. This involves defining a restriction operator on the sigma-algebra of events, such that events outside the closure are not merely assigned probability zero, but are undefined. The goal is to produce a rigorous definition of a "locally closed preference order" that distinguishes between indifference, ignorance, and unrepresentability.

  *Month 2: Adapting Coherence Arguments*
  In the second month, I will adapt the standard Dutch Book argument to this restricted state space. The standard argument shows that violating probability axioms makes an agent vulnerable to a sure loss. I will investigate whether a bookie can construct a Dutch Book using only events within the agent's representational closure. If the bookie is also restricted to the closure, does local consistency suffice to prevent exploitation? Alternatively, does the boundary itself create vulnerabilities (e.g., through framing effects where the same logical state is represented differently)? I will determine whether local coherence implies local probabilism and local utility maximization.

  *Month 3: Comparative Framework Analysis*
  The final month will compare the resulting model of local coherence with existing non-expected-utility frameworks. Specifically, I will examine whether the behavior of a locally coherent agent mimics rank-dependent utility or case-based reasoning. For instance, if an agent ignores outcomes outside their closure, does this mathematically resemble the weighting functions found in rank-dependent models? Or does it align with case-based reasoning, where similarity to known cases drives choice rather than state-space enumeration? This comparison will determine if "bounded coherence" is a distinct theory or merely a special case of existing alternatives.

  **Expected Outcomes and Success Criteria**
  A successful result will yield a formal characterization of "Local Coherence" that preserves normative force without collapsing into global expected utility theory. Specifically, success looks like a proof that an agent can be immune to Dutch Books within their closure while violating axioms (such as Independence or Sure Thing) when viewed from outside the closure. This would demonstrate that bounded rationality undermines coherence arguments from the *inside*, validating a distinct normative framework for implementable agents.

  Failure would take one of two forms. First, the restriction might collapse back into standard EU: if local coherence mathematically necessitates global consistency (e.g., if local probabilities must extend uniquely to the full space), then the representational boundary offers no escape from standard norms. Second, the model might produce an unstable hybrid: if restricting the state space makes the agent vulnerable to money pumps even within the closure (due to boundary shifts), then "local coherence" is impossible, and the project would conclude that coherence arguments require global scope to function at all. Either negative result is scientifically valuable, as it clarifies the limits of normative theory, but the primary goal is the construction of a stable local model.

  **Scope and Risk Assessment**
  The primary risk is formal tractability. Defining "unrepresentable states" without invoking a higher-order language that re-introduces global scope is technically challenging. There is a risk that the formalization of closure will implicitly assume the very global space it seeks to restrict. To mitigate this, I will focus on finite state spaces initially, where boundaries are discrete and easier to manage, before generalizing.

  Additionally, three months is a short timeline for developing a novel formal framework. The scope is therefore limited to existence proofs and counter-examples rather than a comprehensive new decision theory. I will prioritize the Dutch Book adaptation (Month 2) as the core deliverable, as this directly addresses the normative justification. If the comparative analysis (Month 3) proves too complex, it will be scaled back to a qualitative mapping rather than a formal equivalence proof. Despite these risks, the project is feasible because it builds on existing formal tools, repurposing them to test a specific structural constraint rather than deriving entirely new mathematics. The outcome will clarify whether rationality is a global ideal or a local property of representational systems.
