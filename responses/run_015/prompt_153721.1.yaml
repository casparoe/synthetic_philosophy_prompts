  (iii) **0.55** — Cognitive biases often distort the phenomenology of reasoning itself, preventing statistical evidence from being fully screened off by introspection.
  (iv) **0.75** — First-order justification and higher-order assessment operate on distinct normative tracks that can permissibly diverge in cases of evidential complexity.

  **Combination:** I treat the rationality of akrasia as requiring the conjunction of truth-aiming (ii) and normative duality (iv), weighted by the tension between first-order resilience (i) and higher-order applicability (iii); the lower probability of (iii) constrains the final confidence despite strong support from (ii) and (iv).

  **Weakest Link:** Term (iii) is the weakest link, as it relies on contested empirical assumptions about the cognitive penetrability of logical insight.

