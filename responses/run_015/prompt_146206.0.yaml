  The Abhidharma reductionist argues continuity is merely causal efficency, where momentary dharmas plant seeds (bija) in the next instant, creating a stream without a vessel; their verdict is that no self persists, only a process. Conversely, the narrative theorist claims identity is constituted by the intelligibility of a life story, where Elena's memory and social role provide the unity needed for accountability, verdicting that a practical self does persist. The heavy lifting for the Buddhist side rests on the first-person observation of impermanence—the direct phenomenological gap between stimuli that breaks the narrative glue. A narrative theorist would attack this by arguing the observation itself is just another plot point in Elena's story of enlightenment, not proof of ontological fragmentation. If you remove that first-person observation of impermanence, the Buddhist answer collapses into a third-person error theory, losing its phenomenological grip and leaving only a metaphysical assertion that conflicts with lived experiance.
