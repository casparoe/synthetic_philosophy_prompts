prompt: |-
  In most cities the remedy adopted over the last decade for a contested monument has not been destruction but relocation: the statue is lifted from its pedestal and offered to a museum or stored in a depot, the plinth is sometimes left empty or fitted with an explanatory plaque, and the whole operation is described as recontextualization rather than erasure. When the contested object is a name rather than a statue — a street, a school — the remedy is characteristically the reverse: not removal but addition, an honorary co-designation mounted beneath the official sign, which leaves every address, map, and legal record untouched. Some commemoration commissions are now discussing a third option for new monuments: a commemorative authorization granted for a fixed term, renewable only if a standing body votes that the honoree still merits civic honor, with any monument whose authorization lapses transferred to an off-site archive open by appointment.

  What view of what a monument does does this family of practices presuppose? I want three things pressed in particular. First, does relocation-plus-contextualization presuppose that a statue's honoring is a function of its setting and its framing — so that the same bronze, in a gallery behind wall text, has stopped honoring and started only teaching — and is that defensible, or does it merely move the difficulty somewhere else? Second, what explains the asymmetry between statues, which get taken down, and names, which get added to: does the practice presuppose that a name's honorific force is detachable from its use as an address, and is that distinction stable enough to bear the weight placed on it? Third, does the renewable-authorization scheme presuppose that honoring is an ongoing act performed by the present polity rather than a completed act of a past one or a piece of testimony about what happened — and if honoring is ongoing in that sense, what follows for the default: does an un-renewed monument become a kind of speech, and do private commemorations, a family stone or a donor plaque in a hospital corridor, need authorization as well?

  Say finally where the practice is underdetermined: which rival theories of commemoration would license the same policy, so that nothing the commission is doing forces a choice among them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Source Material:** A paragraph describing three contemporary practices regarding contested monuments/names:
          1.  Relocation + Contextualization (statues moved to museums/depots, plinths empty/plaqued).
          2.  Addition/Co-designation (names on streets/schools get honorary additions without removing the original).
          3.  Renewable Authorization (new monuments have term limits, subject to renewal, otherwise archived).
      *   **Task:** Identify the underlying view of what a monument *does* presupposed by these practices.
      *   **Specific Requirements:**
          1.  Address whether relocation implies honoring is a function of setting/framing (and if this is defensible or just displaces the problem).
          2.  Explain the asymmetry between statues (removal) and names (addition) regarding honorific force vs. utilitarian function.
          3.  Analyze the renewable-authorization scheme regarding honoring as an ongoing act vs. a completed act, and its implications for defaults and private commemoration.
          4.  Identify where the practice is *underdetermined* (which rival theories of commemoration license the same policy).

  2.  **Deconstruct the Underlying View (The "Family of Practices"):**
      *   What connects these three approaches? They all avoid *destruction* (erasure). They all seek to manage *meaning* rather than eliminate the object. They treat commemoration as dynamic, contextual, and administrative rather than sacred, permanent, or intrinsic to the object itself.
      *   *Core Presupposition:* A monument is not an inherent vessel of honor but a *speech act* dependent on civic maintenance, context, and current consensus. It is functional, not ontological.

  3.  **Drafting Section 1: Relocation and Context (The Statue):**
      *   *Question:* Does moving a statue to a museum stop the honoring?
      *   *Analysis:* Yes, the practice presupposes that honor requires a specific *pedestal* context (public square, centrality, unchallenged dominance). In a museum, it becomes "history" or "art," subject to critique (wall text).
      *   *Defensibility:* It's defensible if honor is seen as *active civic endorsement* rather than *memory*. However, it might just displace the difficulty. A museum visit can still be pilgrim-like. The "difficulty" (the offensive honor) might move from the public square to the cultural institution's collection policy.
      *   *Key Concept:* Contextualism. Honor is relational, not intrinsic to the bronze.

  4.  **Drafting Section 2: Asymmetry of Names vs. Statues:**
      *   *Question:* Why remove statues but add to names?
      *   *Analysis:* Statues are purely symbolic (honorific). Names are dual-purpose (honorific + utilitarian/address). Removing a name causes administrative chaos (addresses, maps, legal records). Adding a name (co-designation) acknowledges the controversy without breaking the utility.
      *   *Presupposition:* The practice assumes a name's honorific force is *detachable* or *dilutable* by addition. It treats the name primarily as infrastructure secondarily as honor.
      *   *Stability:* Is this stable? Maybe not. If I live on "Robert E. Lee Blvd," adding "Martin Luther King Jr. Co-Name" doesn't necessarily negate the honor of Lee; it might just create confusion or signal a compromise that satisfies no one. It assumes the *utility* masks the *honor*.

  5.  **Drafting Section 3: Renewable Authorization (The Temporal Aspect):**
      *   *Question:* Is honoring ongoing or completed?
      *   *Analysis:* The scheme presupposes honoring is *ongoing*. It requires present consent. It rejects the "set in stone" (literally) model of the past.
      *   *Implications:* If honoring is ongoing, an un-renewed monument loses its *civic* status but becomes *archival*. It becomes "speech" (historical data) rather than "endorsement."
      *   *Private Commemoration:* If civic honor requires authorization, does private? The logic suggests a distinction between *public/civic* space (requires polity consent) and *private* space (donor/family). However, if the theory is "honor is ongoing endorsement," a hospital plaque (semi-public) might theoretically need review, but the practice likely draws a line at *state* action vs. *private* speech. The prompt asks what *follows*: strictly speaking, if honor is purely about current civic will, private stones shouldn't matter, but donor plaques in public buildings blur the line.

  6.  **Drafting Section 4: Underdetermination:**
      *   *Question:* Which rival theories license the same policy?
      *   *Analysis:* The policies are pragmatic compromises.
      *   *Theory A (Civic Republicanism):* Monuments express current civic values. (Fits renewable auth).
      *   *Theory B (Historical Preservationism):* Don't destroy history, just curate it. (Fits relocation to museums).
      *   *Theory C (Pluralist/Democratic Agonism):* Keep the conflict visible but manage it. (Fits co-designation).
      *   *The Point:* You can support these policies because you think monuments are *dangerous if permanent* (Progressive view) OR because you think *destruction is barbaric* (Conservative/Preservationist view). The policy doesn't force you to choose *why* you value the monument, only *how* you manage it. It is agnostic on whether the monument is "truth" or "propaganda," treating it instead as "administrative object."

  7.  **Review and Refine:**
      *   *Tone:* Philosophical, analytical, precise.
      *   *Structure:* Follow the prompt's four distinct requirements (Relocation, Asymmetry, Authorization, Underdetermination).
      *   *Check:* Did I answer "is that defensible?" in part 1? Yes. Did I answer "is that distinction stable?" in part 2? Yes. Did I answer "what follows for the default/private?" in part 3? Yes.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure not to just describe the practices but dig into the *presuppositions* about what a monument *does*.
      *   *Refinement on Part 1:* Emphasize the shift from "veneration" to "education."
      *   *Refinement on Part 2:* Focus on the "infrastructure vs. symbol" tension.
      *   *Refinement on Part 3:* Highlight the shift from "testimony" to "contract."
      *   *Refinement on Part 4:* Ensure the distinction between *motivation* and *policy* is clear.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This family of practices presupposes a **functionalist and contextualist theory of commemoration**. It rejects the notion that a monument possesses an intrinsic, immutable honorific essence embedded in the material itself. Instead, it treats commemoration as a speech act dependent on civic maintenance, spatial context, and temporal consent. A monument, on this view, does not *record* honor; it *performs* it, and that performance relies on specific conditions of visibility, authority, and duration.

  Here is the analysis of the three specific pressures you requested, followed by the point of underdetermination.

  ### 1. Relocation and the Context of Honor
  The practice of relocation-plus-contextualization presupposes that **honor is a function of setting and framing**. It operates on the assumption that a statue in a public square performs a different speech act than the same statue in a museum gallery. In the square, the statue is an active participant in civic life, commanding space and implying unchallenged endorsement. In the museum, behind wall text, it is reclassified as an artifact of history or art, subject to critique rather than veneration.

  **Is this defensible?**
  It is defensible if one accepts that *civic honor* requires *civic centrality*. If honoring someone means inviting them into the present community's self-conception, removing them from the center of that community (the square) to the periphery (the depot or gallery) effectively terminates the invitation. The bronze remains, but the *honor*—which is a relationship between the viewer and the viewed—dissolves when the framing changes from "hero" to "historical subject."

  **Does it move the difficulty?**
  Yes, it likely displaces the difficulty rather than solving it. It assumes the museum is a neutral space of education, but museums are also sites of curation and value judgment. Storing a contested statue in a depot may look like "erasure by bureaucracy," while displaying it in a gallery may turn the museum into a battleground, forcing visitors to navigate the same moral conflict the city sought to manage. Furthermore, it presupposes that "teaching" and "honoring" are mutually exclusive. A museum exhibit can still inspire reverence; the contextualization may fail to neutralize the honorific force for those predisposed to venerate the figure. The difficulty moves from the *plinth* to the *curatorial policy*.

  ### 2. The Asymmetry of Statues and Names
  The asymmetry—removing statues but adding to names—presupposes a distinction between **purely symbolic objects** and **utilitarian infrastructure**. It assumes that a statue's primary function is honorific, whereas a street name's primary function is navigational.

  **Detachable Honorific Force:**
  The practice presupposes that a name's honorific force is detachable from its use as an address. By adding a co-designation (e.g., "MLK Jr. Way" beneath "Jefferson Davis Ave"), the commission treats the name as a layer that can be diluted. The logic is that the administrative necessity of the address (keeping maps and legal records intact) outweighs the need to purge the honor, provided the honor is counterbalanced by addition.

  **Stability of the Distinction:**
  This distinction is likely **not stable enough** to bear the weight placed on it. While addresses are utilitarian, they are also deeply symbolic; we name airports and schools after people specifically to honor them. Co-designation assumes that honor is a zero-sum resource that can be diluted by addition, but in practice, it often results in "honorific inflation" where both names retain their constituencies. The original name retains its honor because it remains the "official" legal record, while the new name signals a corrective. This creates a fragmented civic memory rather than a resolved one. It presupposes that the *burden* of the name is the administrative cost of changing it, not the moral cost of keeping it. This treats the name as real estate rather than speech, a distinction that collapses when the "address" is a school or a public building where the name is the primary interface with the public.

  ### 3. Renewable Authorization and the Temporal Nature of Honor
  The renewable-authorization scheme presupposes that **honoring is an ongoing act performed by the present polity**, not a completed act of a past one. It rejects the "testimony" model (where a monument records what a past generation valued) in favor of a "contract" model (where a monument records what the current generation endorses).

  **Implications for the Default:**
  If honoring is ongoing, an un-renewed monument does not become "false"; it becomes "expired." It shifts from being *civic speech* (endorsement) to *archival speech* (testimony). It implies that the default status of a public monument is not permanence, but probation. The burden of proof shifts from the challengers (who must prove the figure is unworthy) to the defenders (who must prove the figure is still worthy).

  **Private Commemoration:**
  If honoring is strictly an ongoing act of the *polity*, this logic should not apply to private commemorations (family stones, donor plaques). Private speech does not require civic consent. However, the boundary blurs in semi-public spaces (a hospital corridor, a university building). If the theory is that *any* honor in a public-facing space requires current civic validation, then donor plaques would theoretically need authorization. The practice likely draws a line at **state action**: the state cannot endorse without consent, but private actors can. Yet, if the underlying theory is that *honor itself* is dangerous without ongoing review, the logic exerts pressure on private institutions to adopt similar sunset clauses, potentially commodifying memory or making philanthropy transient.

  ### 4. Where the Practice is Underdetermined
  The policies described are **procedurally robust but theoretically agnostic**. They do not force a choice between rival theories of commemoration because they function as administrative compromises that multiple ideologies can inhabit.

  *   **The Preservationist** can support relocation and renewable authorization because nothing is destroyed; the object is saved from the "iconoclasm" of demolition.
  *   **The Progressive/Revisionist** can support the same policies because the *civic honor* is neutralized (via museum context, co-designation dilution, or expiration).
  *   **The Democratic Agonist** can support co-designation because it keeps the conflict visible in the public sphere rather than hiding it in a depot.

  **The Underdetermination:**
  Nothing the commission is doing forces a choice between the theory that **monuments are historical records** (which should be preserved for truth) and the theory that **monuments are political endorsements** (which should be regulated for justice).
  *   If monuments are *records*, moving them to a museum is good (preservation), but letting authorization lapse is bad (loss of public data).
  *   If monuments are *endorsements*, letting authorization lapse is good (consent), but moving them to a museum is risky (continued veneration).

  The policy suite works because it treats the monument as an **administrative asset** rather than a philosophical truth. It manages the *risk* of the monument without defining its *essence*. Consequently, a citizen can support these measures believing they are saving history, while another supports them believing they are dismantling white supremacy. The practice creates a stable equilibrium precisely because it refuses to adjudicate the underlying metaphysical status of the honor being managed.
