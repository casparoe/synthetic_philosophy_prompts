  No voice speaks out to justify the RULE,
  Yet flesh emerges from the drawing HAND,
  And gravity obeys the flattened PLANE,
  Through the narrow gate of the linen CUFF,
  We are bound inside this perfect LOOP,
  Where origin dissolves into the LINE.

  There is no start or finish to the LINE,
  For every action follows hidden RULE,
  The motion circles round within the LOOP,
  One finger touches skin upon the HAND,
  And fabric hides the edge beneath the CUFF,
  All substance rises from the paper PLANE.

  We do not fall beyond the edge of PLANE,
  Though nothing separates us from the LINE,
  A seam is stitched along the turning CUFF,
  And nothing breaks the pattern of the RULE,
  The creator is created by the HAND,
  Existence spins forever in the LOOP.

  Time moves in circles inside this LOOP,
  There is no up or down upon the PLANE,
  I feel the warmth of life within the HAND,
  Yet I am made of nothing but the LINE,
  Is there a law superior to RULE,
  Or does the world end at the frayed CUFF.

  Nothing escapes beyond the linen CUFF,
  We are sustained within the closing LOOP,
  There is no violation of the RULE,
  All being is contained upon the PLANE,
  Truth is defined by nothing but the LINE,
  And everything begins inside the HAND.

  Life starts beneath the CUFF inside the HAND,
  Drawn LINE becomes a life within the LOOP,
  No RULE is higher than the level PLANE.
