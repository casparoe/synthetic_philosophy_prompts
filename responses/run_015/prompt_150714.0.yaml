answer: |-
  This is a sharp intuition. You have effectively reconstructed a specific problem in metaethics using Quine's machinery, and while there isn't a single, canonical proper noun (like "The Gavagai Problem of Ethics") that dominates the literature, the scenario you describe is a recognized intersection of **Quinean ontological relativity** and **metaethical underdetermination**.

  Here is the breakdown of how this is categorized, who has argued for it, and what we might call that boundary you're identifying.

  ### 1. Is there a specific name for this?

  There is no single standardized term like "Moral Gavagai," but philosophers generally refer to this using a few overlapping concepts:

  **A. Metaethical Underdetermination**
  This is the most direct description. Just as scientific data underdetermines physical theory, behavioral data underdetermines moral ontology. If the behavioral outputs (utterances, actions) are identical between a Moral Realist and a Moral Relativist, the empirical evidence cannot decide between the two ontologies.

  **B. Gilbert Harman's "Explanatory Irrelevance"**
  The philosopher Gilbert Harman (a student of Quine) explicitly tackled this in *The Nature of Morality* (1977). He argued that while we need to posit electrons to explain why a cloud chamber leaves a trail, we **do not** need to posit "objective moral facts" to explain why someone says "that act is wrong." We can explain the utterance entirely by referencing their psychology and cultural conditioning.
  *   **The Connection:** Your scenario is essentially Harman's argument framed as a translation manual problem. Harman concludes that because moral facts do no explanatory work, a Quinean naturalist should translate the utterance as "conflicts with local norms" rather than "violates objective law."

  **C. Quinean Moral Skepticism / Naturalism**
  Quine himself didn't write extensively on ethics, but his naturalism implies that if "objective moral laws" don't show up in the causal nexus of physics/psychology, they aren't part of the ontology. Therefore, in your scenario, a strict Quinean would say the two manuals are **not** actually equal. The "objective moral law" manual is ontologically profligate (it posits "spooky" entities), while the "local norms" manual is parsimonious. For Quine, the boundary of ontology is drawn by explanatory power, not just behavioral prediction.

  ### 2. Is it just general indeterminacy applied to ethics?

  Yes and no.

  *   **Yes:** It relies on the same logical structure as *gavagai*. The stimulus meaning (the sensory input/behavior) is identical, but the "analytical hypotheses" (the internal structure/ontology) differ.
  *   **No:** There is a unique stakes difference. With *gavagai*, the difference is about physical objects (rabbits vs. temporal slices). With ethics, the difference is between **facts** and **values**.
      *   In standard Quinean indeterminacy, we assume there *is* a physical reality, we just can't pin down the language.
      *   In your ethical scenario, one translation posits a reality (moral facts) that the other denies exists (norms are just social constructs). This touches on **Error Theory** (J.L. Mackie), which suggests all positive moral claims are false because the "objective laws" don't exist.

  So, while the *logic* is Quinean indeterminacy, the *implication* is the **Metaethical Reality Debate**.

  ### 3. What should we call the boundary?

  You asked: *What should we call the boundary where ontology ends and normative framing begins in these cases?*

  Since there isn't a standard term, here are three proposals ranging from descriptive to technical:

  **Option 1: The Normative-Ontological Cut**
  This borrows from Karen Barad's "agential cut" but applies it to your problem. It marks the point where the translator decides whether to treat the speaker's commitment as a description of the world (ontology) or a prescription for behavior (normativity).

  **Option 2: The Explanatory Threshold**
  Drawing on Harman and Quine: Ontology ends where explanatory necessity ends. If "objective moral laws" are not required to explain the speaker's behavior, they fall below the threshold of ontology and become "normative framing." This is the most Quinean name.

  **Option 3: The Metaethical Proxy Problem**
  This highlights that "local norms" are acting as a proxy for "moral facts" in the translation. The boundary is where the proxy fails to map onto a mind-independent reality.

  ### 4. Why this matters (The "So What?")

  Your thought experiment exposes a vulnerability in **Moral Realism**.

  If a Realist says, "No, 'wrong' *really means* objective violation," and an Anti-Realist says, "No, it *really means* social violation," and **no experiment can tell them apart**, then the Realist is positing a "ghost in the machine."

  This leads to a position called **Quasi-Realism** (Simon Blackburn). Blackburn argues that even if the "objective law" translation is metaphysically dubious, we should keep using moral language *as if* it were true because it serves a vital social function. In your translation manual scenario, Blackburn might say: *Translate it as "objective law" for the sake of the speakers' internal coherence, even if you know the ontology is just "local norms."*

  ### Summary
  *   **Is there a name?** Not a single famous one, but it is discussed as **Metaethical Underdetermination** or **Harman's Challenge**.
  *   **Is it just Quine?** It's Quinean logic applied to the **Is-Ought gap**.
  *   **What to call the boundary?** The **Explanatory Threshold** is the most philosophically robust term. It marks the line where positing an entity stops helping you predict behavior and starts just being metaphysical baggage.

  You've essentially rediscovered the central tension of naturalistic metaethics: If moral facts don't causally interact with the world differently than social norms do, do moral facts exist? Quine (and Harman) would say: Don't multiply entities beyond necessity. Drop the "objective law" manual.
