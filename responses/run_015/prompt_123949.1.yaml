answer: |-
  This is a sharp and philosophically robust challenge. You have identified a tension that sits at the heart of meta-ethics and the philosophy of memory: the relationship between **incommensurability**, **equality**, and **qualitative distinction**.

  Your argument rests on two logical moves:
  1.  **The Equality Entailment:** If we cannot compare $A$ and $B$, we must treat them as equal.
  2.  **The Smuggling Charge:** If we identify a "distinctive wrong" in $A$ that is absent in $B$, we are implicitly ranking $A$ as morally weightier than $B$.

  However, most philosophers who argue against ranking historical evils would reject both premises. They would argue that your dilemma presents a false dichotomy. There is a third logical position between "ranking" and "equality": **pluralistic incomparability.**

  Here is a breakdown of why the anti-ranking position does not necessarily collapse into the contradictions you suggest.

  ### 1. Incommensurability $\neq$ Equality
  Your first premise assumes that if two values cannot be ordered on a single scale, they must be assigned the same value. In value theory, this is a category error.

  *   **The Logical Gap:** To say suffering is "non-fungible" means there is no common currency (like "units of pain") to measure a famine against a pogrom. It does not mean the moral gravity is *identical*; it means the gravity is *heterogeneous*.
  *   **The Analogy:** Consider the question: "Which is more valuable: a profound friendship or a just legal system?" Many ethicists argue these are incommensurable. They belong to different categories of value (personal vs. structural). To say they cannot be ranked is not to say they are *equal*; it is to say the question "which is more valuable?" is malformed.
  *   **Application to Evil:** Similarly, an anti-ranking philosopher argues that the moral gravity of a genocide (intent to destroy a group) and a famine (lethal neglect or economic policy) operate on different moral axes. One is not "more" than the other; they are *different kinds* of moral failures. Denying the possibility of a single metric does not force us to flatten them into equivalence; it forces us to acknowledge their distinctness without hierarchy.

  ### 2. Qualitative Distinction $\neq$ Ordinal Ranking
  Your second premise suggests that identifying a "distinctive moral wrong" is a covert way of saying "this is worse." This conflates **taxonomy** (categorization) with **hierarchy** (ranking).

  *   **Kind vs. Degree:** When philosophers (or legal scholars) argue that genocide involves a distinctive wrong not present in forced displacement, they are usually pointing to *intent* (*dolus specialis*), not necessarily *outcome*.
      *   **Genocide:** Intent to destroy a group *as such*.
      *   **Displacement/Neglect:** Intent to move, control, or indifference to survival.
      *   **The Distinction:** One can argue these are morally distinct *types* of action without claiming one is ordinally "higher" on a scale of severity. It is the difference between saying "Murder is distinct from Manslaughter" (a qualitative legal distinction regarding intent) and "Murder is always worse than Manslaughter" (a quantitative claim about severity). While murder is often punished more severely, the *moral distinction* lies in the nature of the agency, not just the body count.
  *   **The "Smuggling" Charge:** You ask if this smuggles in an ordinal comparison. It only does so if one assumes that "distinctiveness" inherently implies "superiority of gravity." But distinctiveness can imply **specificity of obligation**. We might label genocide as distinctive not because it is "the worst," but because it requires a specific preventative framework (the Genocide Convention) that neglect does not. This is a pragmatic distinction, not necessarily a hierarchical one.

  ### 3. The Pragmatic Ethics of Anti-Ranking
  It is also crucial to understand *why* philosophers object to ranking. It is rarely a metaphysical claim that all evils are identical; it is usually an ethical stance against the **politics of memory**.

  *   **The Zero-Sum Problem:** Ranking evils often creates a competitive economy of victimhood. If Event $A$ is ranked "worse" than Event $B$, resources, recognition, and moral sympathy tend to flow disproportionately to $A$, potentially erasing $B$.
  *   **The Anti-Ranking Goal:** The goal of refusing to rank is not to deny that gas chambers are different from forced marches. The goal is to prevent the suffering of one group from being used as a cudgel to silence the suffering of another.
  *   **Consistency:** A philosopher can consistently hold that:
      1.  Genocide is qualitatively unique (due to intent).
      2.  Suffering is non-fungible (a mother's grief in Context $X$ cannot cancel out a father's grief in Context $Y$).
      3.  Therefore, we should not construct a hierarchy that implies the grief in $Y$ is "less important" than in $X$.

  This is not a contradiction. It is a refusal to translate **qualitative differences** into **quantitative hierarchies**.

  ### 4. Where Your Critique Holds Weight
  Your objection does land a blow against *sloppy* proponents of anti-ranking. There are thinkers who argue against ranking but then speak in ways that clearly imply a hierarchy (e.g., calling the Holocaust "unprecedented" or "unique" in ways that implicitly marginalize other atrocities).

  If a philosopher says, "We cannot rank evils," but then argues, "Genocide is the *crime of crimes*," they are indeed smuggling in an ordinal claim. The phrase "crime of crimes" implies a apex position in a hierarchy. To remain consistent, an anti-ranking philosopher must describe distinctiveness without using superlatives of gravity. They must speak of **uniqueness of mechanism** rather than **supremacy of suffering**.

  ### Conclusion
  Your paradox relies on the assumption that moral judgment is necessarily unidimensional (a single ladder of "gravity"). If we reject that assumption, the paradox dissolves.

  1.  **Does non-fungibility entail equality?** No. It entails **incomparability**. Two things can be incomparable without being equal.
  2.  **Is identifying distinctive wrongs smuggling in ranking?** No, provided the distinction is **taxonomic** (about the nature of the act) rather than **hierarchical** (about the amount of badness).

  The anti-ranking position is not that "all evils are the same." It is that "evils are different in kind, and reducing them to a single scale of measurement does violence to the specific nature of each." They are not forbidding comparative judgment entirely; they are forbidding **reductive** comparative judgment.
