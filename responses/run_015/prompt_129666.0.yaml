prompt: |-
  I am a novelist preparing a philosophical profile for a workshop on narrative ontology and rational decision, and I want a rigorous consistency audit before I present. I have settled on the following commitments about imprecise probability, authorial intention, and practical reason within fiction. Please treat me as a thoughtful interlocutor who does not yet know where the cracks are, and do not assume I am ready to abandon any one view without argument.

  You should approach this as an expert in formal epistemology and decision theory, with working familiarity with credal representations, maximin reasoning, and the philosophy of artistic intention. Please think carefully and step by step: begin with a brief brainstorm of how each commitment might constrain or undermine the others, then proceed to the structured audit.

  Here is my position:

  (1) In conditions of genuinely ambiguous evidence, rational belief should be modeled by imprecise probabilities—a range or convex family of precise probability functions—rather than by a single Bayesian prior. I take this primarily to dissolve the arbitrariness problem that afflicts precise prior assignment.

  (2) The principle of indifference is legitimate when applied within a given credal representation, but it is not legitimate when used to select between different representations of the same evidential situation; applied across representations, it generates contradictions.

  (3) In my own fiction, the "probability" that a given plot branch will occur is not merely unknown to me; it is genuinely indeterminate because I have not yet fixed a unique narrative weight for that branch. This indeterminacy is ontological, belonging to the story-world's modal structure, not merely epistemic ignorance on my part.

  (4) Nevertheless, I maintain that for any completed or planned narrative there is always a precise fact about what I, as author, intend the plot trajectory to be, and this authorial intention fixes the true probabilities of narrative events.

  (5) When I model a fictional character facing a decision under the kind of imprecision described in (3), the normatively correct decision rule is maximin: the character should evaluate each option by its worst-case outcome across the credal range and choose the option with the best worst case.

  (6) I also hold that if the imprecision in (3) were merely epistemic—pure authorial ignorance—then applying maximin to the character's choice would be an unjustified conservative bias, because the true probabilities are in fact precise and should be weighted by expected utility.

  Please audit this package. Specifically:

  - Identify which pairs are in genuine logical or motivational tension, which pairs only appear to conflict but dissolve on closer inspection, and rank the genuine tensions by severity.
  - For each tension, specify exactly what has to give: which commitment must be revised or dropped, what the revision costs in terms of my other views, and whether there is a less costly reinterpretation that saves both commitments.
  - Pay special attention to whether (5) can survive alongside (4), and whether (3) can survive alongside (6) without collapsing into pure epistemic ignorance.
  - Consider whether my application of maximin in (5) delivers a verdict in a concrete case that my other commitments cannot support—for instance, if a character chooses a safe path that my precise authorial intention in (4) had already determined she would avoid.
  - Finally, recommend the single revision that would restore the most consistency with the least damage to the overall picture, and flag any remaining minor friction that revision leaves behind.

  Please do not provide bibliographies, reading lists, or citations; I need an analysis I could present in a closed seminar without reference materials. Be precise about the logical relationships, but avoid invoking obscure named theories or scholars I may not recognize.
