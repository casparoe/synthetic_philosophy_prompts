      *   *Hard Truth:* You cannot claim patronage secures accountability (T2) and also that it destroys political equality (T6) without qualifying the *type* of patronage. T2 describes "benign" patronage. T6 describes "malign" clientelism. But you treat them as the same phenomenon in T3.
      *   *Recommendation:* T2 is the weak link. It over-romanticizes patronage to make a comparative point. It needs to be scaled back. Patronage secures *loyalty*, not necessarily *public accountability*.

      *   *Fixing T4 vs T6:* T6 needs to be framed as a violation of the *constitutive rules* of the office (T1), not a bad outcome. "Political equality" must be part of the "entrusted purpose" in T1. If the office is entrusted to serve *citizens*, treating them as *clients* violates the definition, not just the outcome.
      *   *Fixing T1 vs T5:* T5 is a practical heuristic, T1 is a theoretical definition. T5 admits that some private obligations are compatible with public office. This weakens T1's "subordination to private advantage."
