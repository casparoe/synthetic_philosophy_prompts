  5.  **Developing Solutions/Revisions:**

      *   *Fixing T2 vs T3:* T2 needs to be narrower. It can acknowledge that kinship *structures* exist, but not that they *secure the goods of public office* in the same way. Or, T3 needs to acknowledge that *some* kinship obligations are compatible with public office, but *kickbacks* are not. The example in T3 ("inflated price with a kickback") is predatory, not just redistributive. T2 talks about "mechanisms" securing "predictability."
