answer: |-
  Dear Colleague,

  I have been reflecting further on our recent discussion regarding Johannes Kepler and the often-dismissed astrological dimensions of his work, specifically as set out in his Harmonices Mundi of 1619. It is far too easy for us to look back at this text and categorize it merely as a leftover of superstition, a blemish on the record of the first great laws of planetary motion. However, I argue that Kepler's reformed astrology is best understood not as superstition but as a noble failure, and that the true nature of this failure is illuminated only when we attempt a neo-Keplerian completion that Kepler himself could not have carried out. To see this, we must first acknowledge the radical surgery Kepler performed on the tradition he inherited. He abandoned the zodiac, the houses, and the entire apparatus of planetary dignities and horoscopic fortune-telling that defined the practice of his contemporaries. In their place, he retained and expanded the geometrical aspects into a system of thirteen, including the quintile of seventy-two degrees from the pentagon and the biquintile of one hundred and forty-four degrees from the pentagram, angles which have no place in Ptolemaic practice. He sought to ground celestial influence not in the arbitrary imagery of constellations but in the necessary truths of geometry.

  Now suppose a modern follower tries to complete this system in Kepler's own spirit by adding aspects for every regular polygon that is constructible with compass and straightedge. This extension would include the 17-gon, which yields an aspect of 360/17 degrees, roughly 21.18 degrees. Kepler did not include this aspect, and the constructibility of the 17-gon was not proved until Gauss, long after Kepler's death, so Kepler had no way of knowing that this polygon, too, was constructible. By adopting this neo-Keplerian completion, we succeed in making Kepler's project more rigorous, adhering strictly to the geometric criterion he valued most. Yet, this very success exposes why the project was always empty. The choice of harmonious aspects was never forced by the phenomena, because for any set of aspects one can always find a post hoc consonance. Whether we stick to Kepler's thirteen or expand to include the 17-gon and beyond, the only thing the geometrical criterion really bought Kepler was a way of dignifying the accident of which polygons happen to be constructible. The physical world does not care about the limits of Euclidean construction, and by tightening the geometric rules, we only highlight that the connection between these angles and earthly events remains asserted rather than demonstrated.

  I want to be clear that this critique is not a return to the dismissal of Kepler as a mystic lost in superstition. Kepler was right to reject the superstition of contemporaries who cast horoscopes from zodiac signs and planetary dignities, as those systems relied on symbolic associations devoid of physical or mathematical mechanism. Furthermore, there is an undeniable poignancy to his vision. We must grant that his remark about the Earth singing a semitone, a rising and falling mi to fa, and about the syllables of that semitone suggesting misery and famine here at home, is a beautiful expression of his geometric Platonism. It captures a worldview where the cosmos is intelligible, ordered, and resonant with human experience. It is a vision that seeks unity between the mathematical structure of the heavens and the qualitative texture of life on Earth.

  However, it is precisely this beauty that misled him, because mistaking a mathematical metaphor for a causal influence is the error that no amount of constructible polygons can repair. The elegance of the mi-fa metaphor or the rigor of the 17-gon aspect does not bridge the gap between geometry and causality. By pursuing the neo-Keplerian completion, we show that one can make the system internally consistent without ever making it externally true. The failure is noble because it stems from a desire for a rational, unified cosmos rather than a chaotic one, but it remains a failure because it conflates the map with the territory. Kepler's geometry was a language for describing the heavens, but he believed it was the engine driving them. In the end, the beauty of the expression is exactly what misled him, leading us to appreciate his struggle while recognizing that the path he chose could not lead to the physical truths he sought.

  Warmly,

  Your Colleague
