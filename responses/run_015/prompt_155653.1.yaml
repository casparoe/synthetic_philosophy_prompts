answer: |-
  Dear colleague,

  It is completely understandable that this debate is driving you a bit crazy, primarily because the paradox of Buridan's Ass is one of those rare philosophical problems that feels like it should be solvable with a bit of conceptual tightening, yet it stubbornly resists resolution because it sits at the intersection of metaphysics, psychology, and normative theory. You are definitely not inventing jargon to cover up bedrock intuitions; in fact, your hunch about the distinction between structural and phenomenal indifference is remarkably astute and points directly toward the source of the friction in your reading group. What you are calling structural indifference maps quite neatly onto what action theorists often discuss as normative symmetry or objective indeterminacy, where the external reasons available to the agent are perfectly balanced. Phenomenal indifference, on the other hand, concerns the internal motivational state, or the lack of a felt inclination toward one option over the other. The stalemate you are experiencing likely arises because one camp is treating rationality as a response to structural reasons, while the other is treating rationality as a capacity for functional closure regardless of those reasons.

  To diagnose this properly, we need to look closely at what each side is actually committed to, because I suspect the disagreement is a hybrid of verbal ambiguity and substantive normative conflict. The camp arguing that choice without preference is arbitrary and therefore irrational is likely operating with a strong Principle of Sufficient Reason, reminiscent of Leibniz. Their commitment is that rationality is essentially reason-responsive. If the reasons for A and the reasons for B are identical, reason itself is silent, and any movement of the will must therefore come from something other than reason, such as random noise or brute causation. For them, calling this rational is a category mistake because rationality requires a grounding in comparative betterness. They are likely conflating preference with all-things-considered judgment. If you cannot judge A better than B, choosing A seems like a violation of the normative structure of agency. They fear that allowing arbitrary choice opens the door to irrationality everywhere, dissolving the link between reasoning and acting.

  The opposing camp, which insists on tie-breaking mechanisms without hidden preferences, is often committed to a functionalist or voluntarist picture of agency. Their core intuition is that agency requires the capacity for closure. An agent who cannot choose between two equivalent options is not perfectly rational; they are paralyzed, and paralysis is a failure of agency. They are likely defining preference dispositionally rather than phenomenally. For them, the act of choosing A just constitutes a preference for A at the moment of choice, even if ex ante the options were ranked equally. They might also be relying on a hidden empirical claim about cognition, suggesting that the brain never actually encounters perfect symmetry due to neural noise or micro-perceptual differences, so the tie-breaking mechanism is just the natural resolution of that noise. However, even if we grant perfect symmetry, their philosophical commitment is that the will has a power to determine itself independent of prior weighting, a view that echoes Scotus or later voluntarists. They see the ability to break a tie as a feature of freedom, not a bug of rationality.

  This brings us to your distinction between structural and phenomenal indifference, which I believe is the key to untangling the verbal component of this dispute. Your reading group is likely talking past each other because one side is focusing on the justification of the action while the other is focusing on the mechanism of the action. If the debate is about whether a choice can be justified by reasons when structural indifference holds, the first camp is right that there is no reason-based justification for picking A over B specifically. However, if the debate is about whether an agent can rationally employ a rule to resolve structural indifference, the second camp is right. The missing piece here is the distinction between the rationality of the outcome and the rationality of the procedure. It can be rational to adopt a policy of random selection when faced with structural indifference, even if the specific outcome of that randomization is not reason-determined. This is where game theory offers a useful conceptual move, specifically the idea of mixed strategies. In situations of symmetric payoff, a rational agent randomizes to prevent exploitation or simply to ensure action. If your reading group can agree that adopting a tie-breaking procedure is itself a reason-based act, even if the output of that procedure is not, you might dissolve the claim that the choice is irrational.

  However, there is also a substantive disagreement hiding here about the nature of preference itself. You need to press your group on whether they view preferences as mental states that cause actions or as theoretical constructs that explain actions. If preferences are occurrent feelings of pull, then phenomenal indifference is real, and Camp 2 must explain how action occurs without that feeling. If preferences are simply revealed by choice, then Camp 1's claim that there is no preference is false by definition, because the choice reveals the preference. This is the classic tension between psychological realism and behaviorism in action theory. I suspect your group is stuck because they are oscillating between these definitions without realizing it. To break the deadlock, you should propose that they explicitly define preference for the sake of the argument. Ask them if they allow for second-order preferences, such as a preference for resolving the indecision itself. Often, what looks like a choice without preference is actually a choice driven by a higher-order preference for efficiency or closure over continued deliberation. This moves the preference from the objects A and B to the state of having chosen, which satisfies Camp 1's demand for a reason while satisfying Camp 2's demand for a mechanism.

  Another avenue to explore is whether the question is ill-posed because it assumes a static model of deliberation. In reality, deliberation is dynamic. As Ruth Chang has argued in her work on hard choices, when reasons run out, the agent does not merely discover a preference but creates one through the act of willing. This is a substantive metaphysical claim about the power of agency, suggesting that the will is not just a weigher of reasons but a creator of reasons. If your group adopts this view, the paradox dissolves because the symmetry is broken by the agent's commitment, not by prior weight. This might be too radical for some members, but it clarifies the stakes. Alternatively, you could introduce the empirical angle more aggressively. If neuroscience suggests that the brain resolves symmetric decisions via random neural noise, does that make the action irrational? Camp 1 would say yes, because the cause is non-rational noise. Camp 2 would say no, because the system is designed to use that noise to achieve a rational end, which is action. This shifts the debate from whether the choice is arbitrary to whether the use of arbitrary mechanisms is permissible in rational architecture.

  Ultimately, I diagnose this as a verbal disagreement masking a substantive normative one. It is verbal because everyone is using preference to mean slightly different things, ranging from felt desire to dispositional ranking to normative judgment. It is substantive because it hinges on whether rationality requires that every specific action be determined by a specific reason, or whether rationality allows for meta-rational rules that permit indeterminacy at the object level. Your structural and phenomenal distinction is not noise; it is the right tool to separate the objective setup from the subjective experience, but you need to add a third category to make it work, which is the normative rule governing the choice. Once you separate the symmetry of the options, the phenomenology of the agent, and the rationality of the decision rule, you will likely find that Camp 1 is objecting to the lack of reasons for the specific option, while Camp 2 is defending the rationality of the decision rule.

  To move forward, I suggest you propose a reframing of the problem in your next session. Ask the group to consider whether it is rational to flip a coin when choosing between two identical bales of hay. If they say yes, then they admit that rationality can incorporate arbitrary mechanisms, which supports Camp 2. If they say no, then they must explain why paralysis is preferable to random selection, which seems to contradict the basic goal of agency. This concrete example often forces people to reveal their underlying commitments about the purpose of rationality. Is rationality about tracking truth and value, or is it about successful navigation of the world? If it is the latter, then tie-breaking is essential. If it is the former, then suspension of judgment might be the only rational response. Getting them to agree on the telos of rationality might be the only way to break the year-long stalemate. You are doing good work by noticing that the distinction matters, and pushing this line of inquiry could genuinely clarify the debate for everyone involved.

  Warmly,

  Your Colleague
