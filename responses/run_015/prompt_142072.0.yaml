answer: |-
  You have correctly identified that the friction you feel comes from running a **Liberal** operating system on **Civic Republican** hardware.

  The Nordic/Swiss model is not a bug in a liberal democracy; it is a deliberate architectural choice based on a different political theory. To answer your request: I will reconstruct the implicit theory, evaluate your guesses, grind on the lottery proposal, and specify what breaks if you switch to the market model.

  ### 1. The Implicit Theory: Civic Republicanism + Total Defense

  The practice presupposes a synthesis of two distinct frameworks:

  **A. Political Ontology: Civic Republicanism**
  Classical Liberalism (the dominant OS in the US/UK) posits that liberty is the *absence of interference*. You are free if the state leaves you alone.
  Civic Republicanism posits that liberty is *non-domination*. You are only free if you are not dependent on the arbitrary will of another (including a foreign power or a domestic standing army).
  *   **The Axiom:** Political membership is not a subscription service; it is a constitutive relationship. You cannot be a "citizen" (a participant in the *res publica*) without sharing the burden of maintaining the *res publica*.
  *   **The Implication:** Conscription is not "forced labor" in this view; it is the *performance of citizenship*. Just as you cannot opt out of voting (in compulsory voting systems) or taxes, you cannot opt out of defense, because defense is not a service provided *to* you, but an action performed *by* you.

  **B. Strategic Doctrine: Total Defense**
  This is the systems engineering layer. It assumes that in a high-intensity conflict between peer competitors, a professional army is a single point of failure.
  *   **The Axiom:** Deterrence is a function of *societal friction*, not just military capability.
  *   **The Implication:** The goal is not necessarily to win a war in the field, but to make occupation prohibitively expensive. This requires coupling the military layer tightly with the civil layer.

  ### 2. Evaluating Your Guesses

  Your intuition is high-fidelity. Here is the validation and refinement:

  *   **"Political membership carries non-optional duties."**
      *   **Verdict:** **Correct.** This is the core Republican claim. Rights are the dividend; duties are the principal.
  *   **"Unfair to outsource dirty work to poorer people."**
      *   **Verdict:** **Correct.** This is the "Equality of Sacrifice" constraint. If the elite do not share the risk, the elite will not hesitate to expend the poor in conflict. Conscription couples the decision-makers to the consequences.
  *   **"Citizen army makes expeditionary wars harder."**
      *   **Verdict:** **Correct.** Reservists are optimized for territorial defense. They are logistically heavy and politically sensitive. You cannot quietly deploy a conscript reserve to a foreign oil field without triggering a domestic political crisis. It creates high friction for offensive action.
  *   **"Deterrence is the expected cost of occupation."**
      *   **Verdict:** **Correct.** This is the "Porcupine Strategy."
  *   **"Does this make civilians part of the deterrent/target?"**
      *   **Verdict:** **Yes, and that is the tension.** Under International Humanitarian Law (IHL), reservists are combatants even when in civilian clothes (until they formally disconnect from the reserve). Civilians are not.
      *   **The Coherence Check:** The theory *does* blur this line intentionally to create ambiguity for the invader ("Is this civilian carrying food or ammo?"). This is morally hazardous. The system commits you to the view that **ambiguity is a defensive asset.** It bets that the invader's fear of insurgency outweighs the legal/moral cost of targeting a population that is structurally prepared for insurgency.

  ### 3. The Lottery vs. Universality (The Grind)

  You suspect the lottery misses the point. You are right. Here is why, strictly in terms of system properties.

  **The Lottery Model (Statistical Representation)**
  *   **Logic:** Burden minimization + Fairness via randomness.
  *   **Social State:** Defense is a *tax* levied on the unlucky few.
  *   **Coupling:** Weak. 95% of the population has zero skin in the game. They view the military as "them."
  *   **Failure Mode:** If the lottery selects a cohort that is disproportionately marginalized, it reverts to the "poor people's war" problem you identified. If it selects the elite, the elite will lobby to end the lottery.

  **The Universal Model (Shared Social Fact)**
  *   **Logic:** Social cohesion + Epistemic Alignment.
  *   **Social State:** Defense is a *rite of passage*.
  *   **Coupling:** Strong. The "Reserve" is not just a military list; it is a social network. Your boss, your MP, and your neighbor are all in the same reserve pool.
  *   **Why Universality is Necessary:**
      1.  **Normalization:** If everyone goes, no one loses status by going. It prevents the formation of a "warrior caste" distinct from the "civilian caste."
      2.  **Liability vs. Activation:** You noted that not everyone actually serves (excusals, civilian service, women often exempted historically). The theory does not require 100% *activation*; it requires 100% *liability*. The legal obligation must be universal for the social norm to hold. The exceptions are treated as medical/administrative deviations, not structural opt-outs.
      3.  **The "Two-Week Drill" Insufficiency:** A two-week drill creates competence, but not *identity*. The 6-12 month service period in Finland/Switzerland is designed to be long enough to disrupt life trajectories (university, career start). This disruption is a feature, not a bug. It forces the individual to integrate the "citizen-soldier" identity into their life story.

  **What the Universal Model Commits You To:**
  It commits you to the claim that **social cohesion is a security asset.** It asserts that a society where everyone knows how to use a rifle and everyone knows someone who did is harder to subvert than a society with a better-funded professional army but a disconnected populace. It prioritizes *resilience* over *efficiency*.

  ### 4. The Market Alternative (Defense as a Job)

  If you swap in the view that defense is a labor market function, here is what concretely changes in the practice:

  1.  **Decoupling of Voting and Fighting:**
      *   *Current:* Politicians know their constituents' children are in the reserve.
      *   *Market:* Politicians know only contractors and volunteers are at risk. The "cost" of war becomes purely financial, not human (for the majority). This lowers the threshold for engaging in conflict.
  2.  **Loss of the Reserve Network:**
      *   *Current:* In a crisis, the state can call up 280,000 Finns in days because the administrative and training framework is ubiquitous.
      *   *Market:* You can only scale as fast as you can recruit. In a total war scenario, you cannot scale a professional army fast enough to match a conscript power.
  3.  **Shift in Deterrence Posture:**
      *   *Current:* "Invading us means fighting 5 million people."
      *   *Market:* "Invading us means fighting 30,000 professionals."
      *   *Consequence:* You must shift from **Denial Deterrence** (you can't win) to **Punishment Deterrence** (if you attack, we will nuke you or rely on allies to save us). This makes you *more* dependent on alliances (like NATO) for survival, whereas the conscript model allows for a higher degree of strategic autonomy.
  4.  **Civil-Military Friction:**
      *   *Current:* The military is a mirror of society.
      *   *Market:* The military becomes a subculture. This increases the risk of the military developing values divergent from the civilian population (the "Praetorian Guard" risk, though low in Nordics, is non-zero).

  ### Summary of the Trade-off

  The Nordic/Swiss package is not incoherent, but it is **expensive** in a currency liberals often ignore.

  *   **It buys:** Strategic autonomy, high-threshold for war entry, societal resilience, and equality of civic status.
  *   **It costs:** Individual liberty (coercion), economic efficiency (time spent out of workforce), and moral clarity (blurring civilian/combatant lines).

  Your intuition that "universality is doing the work" is correct. The lottery treats defense as a **burden to be distributed**. Conscription treats defense as a **bond to be forged**. If you switch to the market model, you gain efficiency and liberty, but you lose the specific type of social cohesion that makes "Total Defense" viable. You become a richer country with a sharper sword, but a softer spine.
