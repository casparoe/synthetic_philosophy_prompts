answer: |-
  Here's the mental map I'm running before we dig in:

  **Map of the Terrain**
  1.  **Side A (Strategic/Consequentialist):**
      *   *Unit of Analysis:* The Outcome.
      *   *Vote Function:* Causal lever (instrumental).
      *   *Expression:* Tracking "all-things-considered" preference (including strategic constraints).
      *   *Complicity:* Diluted by aggregation (I am 1/N); intent matters more than act.
  2.  **Side B (Expressive/Deontological):**
      *   *Unit of Analysis:* The Agent.
      *   *Vote Function:* Speech act/Endorsement (constitutive).
      *   *Expression:* Requires reflective endorsement of the *option itself*, not just the outcome.
      *   *Complicity:* Binary (I participated); act matters more than intent.

  **The Diagnosis**
  You're right that it's not empirical. They agree on the math of aggregation and the badness of suffering. The stall is structural.

  Is it verbal? Partially. They are using the word "expression" to do two different jobs. For Side A, expression is *signal of preference* (I want X to happen). For Side B, expression is *signal of identity* (I am the kind of person who supports X). If you define expression as preference signaling, Side A wins. If you define it as identity signaling, Side B wins.

  Is it substantive? Yes, but deeper than moral values. It's about the *ontology of the vote*. Side A treats the vote as a tool external to the self (a hammer). Side B treats the vote as an extension of the self (a voice). You can't compromise between a hammer and a voice.

  **The Real Issue: Different Projects**
  This is the strongest diagnosis. They are running two different normative projects under one heading.
  *   **Project 1 (Collective Causation):** How do we minimize harm in a non-ideal world? This is a problem of *coordination and efficacy*.
  *   **Project 2 (Citizen Virtue):** How do I maintain moral integrity in a corrupt system? This is a problem of *complicity and cleanliness*.

  The deadlock happens because Side A accuses Side B of being ineffective (irrelevant to Project 1), and Side B accuses Side A of being corrupt (irrelevant to Project 2). They aren't disagreeing; they're answering different questions.

  **Can It Be Broken?**
  A formal model won't fix it because models require axioms, and their axioms differ (utility vs. duty). A conceptual distinction *could* help, but only if both sides admit voting is a hybrid act. The question isn't ill-posed, but the demand for a *single* unified theory of voting ethics is. You need a dual-aspect theory: one rule for causal impact, another for moral integrity, acknowledging they might conflict.

  Progress requires admitting that sometimes you must choose between being effective (Side A) and being clean (Side B). The debate stalls because both sides want to be both.

