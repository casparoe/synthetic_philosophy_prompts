      *   Focus on agency and exposure? Yes.
      *   American English? Yes.
      *   No bibliography? Yes.
      *   Address the shareholder analogy? Yes.

  10. **Final Polish:** (Produces the final output).
answer: |-
  The traditional doctrine of the moral equality of combatants rests on a specific, increasingly archaic image of war. It envisions a battlefield where two uniformed individuals face one another, each possessing the same license to kill and the same liability to be killed. Under this framework, a soldier's moral status is determined by their adherence to the rules of engagement, not by the justice of their cause. As long as they fight cleanly, they are moral equals, regardless of which flag they salute.

  However, this symmetry collapses when we confront the reality of distributed lethal agency. In modern conflict, the act of killing is no longer a singular, discrete event performed by an autonomous agent in a moment of mutual danger. It is a fragmented process, sliced thin across a vast network of intelligence analysts, legal advisors, command protocols, software engineers, and remote operators. When the decision to apply lethal force is disaggregated in this way, the moral uniformity of the battlefield dissolves. We can no longer treat every uniformed fighter as a moral equal because they do not share equal agency, nor do they share equal exposure.

  The breakdown begins with agency. In the traditional model, the soldier on the front line exercises immediate judgment. They assess a threat, weigh the necessity of force, and pull the trigger. Their moral responsibility is direct and concentrated. In contrast, modern high-tech warfare distributes this responsibility until it nearly vanishes. A drone pilot in Nevada may press the button, but they are acting on intelligence vetted by a separate team, authorized by a commander following rules of engagement drafted by lawyers, and aided by targeting algorithms written by civilians.

  This fragmentation creates a hierarchy of moral involvement that the uniform fails to capture. To say the drone operator, the intelligence analyst, and the infantryman patrolling a village are moral equals is to ignore the vast differences in their capacity to choose. Some actors in this chain have the luxury of time, deliberation, and perfect information. Others are bound by rigid protocols that remove discretion entirely. When agency is distributed, culpability cannot be uniform. A soldier following an automated script is not morally equivalent to a commander who designed the script, yet the doctrine of moral equality treats them as interchangeable instruments of the state.

  This brings us to the shareholder analogy. Treating every combatant as morally equal because they wear the same uniform is like claiming every shareholder is equally culpable for corporate harm. A majority shareholder sitting on the board of directors makes decisions that drive policy; a retail investor buying ten shares on an app has no say in the company's operations. Both technically own a piece of the corporation, but their moral relationship to its actions is fundamentally different. Similarly, in a modern military, the "ownership" of lethal force is not evenly distributed. Some personnel are the board members—designing the strategy and the rules of killing—while others are merely the retail investors, carrying out tasks with minimal understanding or control of the broader outcome. Collapsing these distinctions under the label of "combatant" obscures the reality of who is actually making the moral choices.

  Furthermore, the collapse of moral equality is driven by the radical asymmetry of exposure. The moral license to kill in traditional just war theory was predicated on reciprocity. I am allowed to try to kill you because you are trying to kill me, and we are both exposed to the same risks. This mutual vulnerability created a level playing field. Distributed lethal agency shatters this reciprocity.

  When one side operates from remote bases, insulated from physical harm, while the other side is exposed to constant surveillance and precision strikes, the moral landscape shifts. The remote operator faces no physical risk. They go home to their families after their shift. The target, however, lives under the constant threat of death. This lack of shared risk undermines the justification for equal moral status. If the privilege of combatancy is a trade-off—your life for the enemy's—then removing your life from the equation invalidates the trade. You cannot claim the same moral standing as someone you are hunting from a position of total safety. The "equality" becomes a license for the protected to slaughter the exposed without the balancing weight of personal danger.

  Finally, we must consider how this distribution affects the enemy combatant. If we accept that the high-tech force is composed of agents with varying levels of responsibility and safety, how do we judge those fighting against them? An insurgent planting an IED is exercising a high degree of direct agency and accepting total exposure. A drone operator hunting that insurgent exercises fragmented agency and accepts zero exposure. To declare them moral equals is to ignore the structural reality of the conflict. One is acting as an individual moral agent; the other is acting as a node in a bureaucratic machine.

  The moral equality of combatants was designed for a war of duels. We are now fighting a war of systems. In a system where lethal agency is distributed, safety is privatized, and decision-making is bureaucratized, the uniform ceases to be a reliable marker of moral status. We must move toward a framework that evaluates moral liability based on actual decision-making power and actual physical risk. Until we do, we are clinging to a fiction that allows those with the least risk and the least direct agency to claim the same moral standing as those who bear the brunt of the violence, both as perpetrators and victims. The uniform no longer levels the field; it merely hides the hierarchy.
