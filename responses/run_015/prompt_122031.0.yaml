          *   (4) says legitimacy *derives* from deontological commitment.
          *   *Analysis:* This looks like a Two-Level View (Rule-Utilitarian style, but grounded deontologically). (4) provides the *justification* for the *method* in (3). We use aggregative reasoning *because* respecting persons as ends requires a system that minimizes overall rights violations or maximizes overall agency space.
          *   *Verdict:* This might be the pair that dissolves. It's a division of labor between *foundations* (4) and *heuristic/operation* (3).

      *   **Pair D: (2) vs. (3) [Severity: Medium]**
          *   (2) Direct authorship matters (Doing/Allowing).
