      *   *The Grounding Tension:* (3) vs. (4). (3) says reason *proceeds* aggregatively. (4) says legitimacy *derives* from deontology. Is this a coherent division of labor (two-level view) or a contradiction?
      *   *The Agency Tension:* (2) vs. (3). (2) focuses on direct authorship (individual). (3) focuses on institutional design (structural). Who is the "author" in an institution?

  4.  **Deep Dive into Specific Pairs:**

      *   **Pair A: (3) vs. (5) [Severity: High]**
          *   (3) says institutional reasoning weighs outcomes across *all* affected agents (aggregative).
          *   (5) says collective decision-making does *not* license treating individuals as fungible inputs to an aggregate welfare function.
          *   *Conflict:* "Weighing outcomes across all affected agents" sounds suspiciously like "treating individuals as fungible inputs to an aggregate welfare function." If I can't kill 1 to save 5 individually (per 5), can the institution sacrifice 1 to save 5? (3) implies yes (aggregative weighing). (5) implies no (non-fungibility).
          *   *Resolution:* Needs a distinction between *policy-level risk* vs. *targeted sacrifice*. Or a distinction between the *metric* of evaluation vs. the *constraint* on action.

      *   **Pair B: (1) vs. (3) [Severity: High]**
          *   (1) says ACRs prohibit best overall outcomes.
