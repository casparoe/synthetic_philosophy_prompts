answer: |-
  This is a sophisticated and tightly constructed package, effectively attempting a "Division of Moral Labor" between individual and institutional agency. You are aiming for a view where individuals remain deontological agents while institutions operate with consequentialist *heuristics* grounded in deontological *legitimacy*.

  However, there is a significant fault line running through the relationship between your individual constraints and your institutional permissions. Below is the consistency audit.

  ### I. The Dissolving Tension (False Conflict)
  **Pair:** **(3) and (4)**
  **Severity:** None (Conceptual Compatibility)

  **Analysis:**
  On the surface, (3) and (4) appear contradictory. (3) mandates reasoning "as if from a consequentialist framework" (aggregative, outcome-weighing), while (4) denies rule-consequentialism and grounds legitimacy in a "prior deontological commitment." This looks like you are trying to have your cake (deontological ground) and eat it too (consequentialist method).

  **Why it Dissolves:**
  This tension dissolves if you treat (4) as the **foundational justification** and (3) as the **operational heuristic**. This is a stable "Two-Level" or "Division of Labor" view. You are arguing that the *only way* to satisfy the deontological requirement of treating persons as ends (4) in a complex, non-ideal world is to design institutions that manage risk and resource allocation aggregatively (3).
  *   **Example:** A traffic code that maximizes flow (aggregative/consequentialist) is legitimate not because flow is the ultimate good, but because a reliable traffic code respects everyone's agency and right to movement better than a system where every driver makes individual deontological judgments at every intersection.
  *   **Condition:** This holds only if the "aggregative weighing" in (3) is strictly bounded by the side-constraints implied in (4). As long as (3) is the *servant* of (4), they are coherent.

  ---

  ### II. Genuine Tensions (Ranked by Severity)

  #### 1. Critical Tension: The Aggregation/Fungibility Problem
  **Pair:** **(3) and (5)**
  **Severity:** **High**

  **The Conflict:**
  *   **(3)** states institutional reasoning should weigh outcomes across all affected agents "as if from a consequentialist framework."
  *   **(5)** states collective decision-making does *not* license treating individuals as "fungible inputs to an aggregate welfare function."
  *   **The Clash:** Standard consequentialist frameworks *define* the aggregation of welfare by treating individuals as loci of value that are fungible (one person's utility unit counts the same as another's, and can be traded off). If your institution weighs outcomes aggregatively (3), it is functionally utilizing a fungibility metric. If you forbid fungibility (5), you severely cripple the "as if consequentialist" instruction in (3). You cannot consistently instruct an institution to maximize aggregate outcomes while forbidding it from treating the constituents of that aggregate as tradable units.

  **Least Costly Fix:**
  **Qualify (3).**
  *   **Revision:** Restrict the "aggregative weighing" in (3) to **ex ante risks and statistical lives**, rather than **ex post sacrifices of identified individuals**.
  *   **Cost:** You must concede that institutions cannot use aggregative reasoning when a specific, identified individual is being targeted for sacrifice (even for the greater good). The institution must switch from the (3) mode to the (1)/(5) mode when moving from policy design (statistical) to specific execution (identified).
  *   **Why this costs least:** It preserves the deontological core (5) which you seem most committed to protecting. It limits the scope of institutional consequentialism to "rules of the game" rather than "moves within the game."

  #### 2. High Tension: The Authorship Gap
  **Pair:** **(2) and (3)**
  **Severity:** **Medium-High**

  **The Conflict:**
  *   **(2)** grounds the doing/allowing distinction in "direct authorship."
  *   **(3)** assigns institutions the role of aggregative outcome-managers.
  *   **The Clash:** Institutions rarely have "direct authorship" in the sense required by (2). They act through chains of delegation, structural inertia, and statistical probability. If an institution designs a climate protocol (3) that knowingly leads to the deaths of a specific population (via displacement or starvation) to save a larger population, has the institution "done" or "allowed" this harm?
      *   If it "allowed" it (because the authorship is indirect), (3) permits it easily.
      *   If it "done" it (because the institution is the author), (2) suggests a restriction might apply.
      *   The tension is that (3) encourages the institution to ignore the doing/allowing distinction for the sake of aggregation, while (2) insists that distinction is normative bedrock.

  **Least Costly Fix:**
  **Qualify (2) for Institutional Agents.**
  *   **Revision:** Specify that "direct authorship" in (2) applies to **natural persons**, whereas institutional authorship is defined by **control over structural parameters**.
  *   **Cost:** You must accept a fragmented moral ontology where the doing/allowing distinction applies differently to humans than to the structures they create.
  *   **Why this costs least:** It protects the individual agent's integrity (keeping (1) and (2) intact for humans) while allowing the institution the flexibility required for (3). It acknowledges that institutions *cannot* "do" harm in the same visceral way individuals do, they can only structure risk.

  #### 3. Moderate Tension: The Transferability Paradox
  **Pair:** **(1) and (3)**
  **Severity:** **Medium**

  **The Conflict:**
  *   **(1)** affirms agent-centered restrictions (ACRs) are substantive for agents (I cannot kill 1 to save 5).
  *   **(3)** asks institutions to weigh outcomes aggregatively (Save 5 even if 1 dies).
  *   **The Clash:** Institutions are constituted entirely of agents. If every individual agent is bound by (1), how does the collective entity escape (1) to perform (3)? If the board members vote to sacrifice the one to save the five, haven't they collectively violated the restriction that binds them individually? This is the "Problem of Many Hands."

  **Least Costly Fix:**
  **Qualify (1) with a "Role Morality" Clause.**
  *   **Revision:** Add to (1) that ACRs apply to agents *qua* private individuals, but agents acting *qua* institutional fiduciaries operate under the logic of (3).
  *   **Cost:** This risks the "Dirty Hands" problem. You are asserting that putting on an institutional badge alters the substantive moral restrictions that bind you.
  *   **Why this costs least:** It is the standard defense of political realism and administrative ethics. It allows you to keep (3) robust without abandoning (1) for personal morality. However, it requires you to argue that the *institution* is a distinct moral agent, not just a sum of individuals.

  ---

  ### III. Summary of Pressure Points

  | Pair | Status | Verdict | Required Revision |
  | :--- | :--- | :--- | :--- |
  | **(3) & (4)** | **Compatible** | **Dissolves** | No revision needed; clarify Foundational vs. Operational distinction. |
  | **(3) & (5)** | **Critical** | **Contradiction** | **Qualify (3):** Aggregation applies to statistical risks, not identified sacrifices. |
  | **(2) & (3)** | **High** | **Category Error** | **Qualify (2):** Distinction applies to natural persons; institutions manage structural risk. |
  | **(1) & (3)** | **Medium** | **Agency Gap** | **Qualify (1):** Distinguish private agency from fiduciary/role agency. |

  ### IV. Strategic Recommendation

  Your package is most vulnerable at **(5)**. Claim (5) is the hardest line you have drawn ("collective decision-making does not license treating individuals as fungible"). If you hold (5) strictly, you cannot hold (3) strictly ("weighing outcomes... as if consequentialist").

  **The Pivot:**
  To maintain consistency without dropping deontology, you should reframe (3). Instead of saying institutions reason "as if from a consequentialist framework," say they reason from a **"Deontological Maximization of Agency Space."**

  *   **Current (3):** Weigh outcomes aggregatively.
  *   **Proposed (3*):** Design rules that maximize the total compatible exercise of rights across the population.

  This sounds aggregative (it sums up "agency space"), but it respects (5) because it treats *rights* as the unit of aggregation, not *welfare*, and it respects (1) because it prohibits violating a right even to maximize the total number of rights exercised elsewhere (unless dealing with statistical risk). This aligns (3) with (4) and (5) much more tightly, reducing the need to fracture your view of agency between (1) and (3).
