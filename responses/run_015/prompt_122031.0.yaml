prompt: |-
  I'm writing up my position on institutional morality and need a consistency audit before I present it. Here is the package I hold:

  (1) The classic paradox of deontology is substantive, not dissolvable by redescription: agent-centered restrictions genuinely prohibit producing the best overall outcomes, and this is a feature rather than a confusion.

  (2) The doing/allowing distinction tracks a normative relation of direct authorship, not causal efficacy or divergence in expected utility.

  (3) In large-scale institutional design—say, climate governance or AI safety protocols—moral reasoning should proceed aggregatively, weighing outcomes across all affected agents as if from a consequentialist framework.

  (4) This institutional reasoning is not reducible to rule-consequentialism, because the legitimacy of the institution derives from a prior deontological commitment to treating each person as an end, not from the value of the outcomes produced.

  (5) Agent-relative reasons are strictly non-transferable: my prohibition against killing one to save five does not distribute across five agents, and collective decision-making does not license treating individuals as fungible inputs to an aggregate welfare function.

  Please audit whether these hang together. For each pair that is genuinely in tension, rank them by severity and indicate which commitment (1)–(5) must be qualified or abandoned, with the least costly fix. Identify at least one pair that looks conflicted but dissolves on inspection—perhaps involving a distinction between individual and structural agency that I have not earned. Do not advise me to drop deontology wholesale; I want to know exactly where the pressure points are and what each revision costs.
reasoning: |-
