      *   *Refining the Fix for (3) vs (5):* The user wants to keep deontology. The fix must be qualifying (3). Instead of "weighing outcomes... as if consequentialist," it should be "weighing *claims* or *rights-compatibilities* aggregatively." Or, distinguish between *ex ante* risk distribution (allowed) vs. *ex post* sacrifice (forbidden).
      *   *Refining the Fix for (1) vs (3):* This is the "Individual vs. Institution" gap. The fix is to clarify that institutions have a different moral topology (statistical vs. identified victims).

  6.  **Developing the Arguments:**

      *   **Tension 1 (Critical): (3) vs. (5).**
          *   *Why:* (3) invites aggregation. (5) forbids fungibility.
          *   *Cost:* Qualifying (3) to specify that aggregation applies to *general rules/policies* affecting statistical lives, not *specific sacrifices* of identified individuals.
      *   **Tension 2 (High): (1) vs. (3).**
          *   *Why:* Individual ACRs vs. Institutional Aggregation.
          *   *Cost:* Clarifying the moral status of the institution. Is it a moral agent? If so, does it have ACRs? If (3) says it acts consequentially, it lacks ACRs.
      *   **Dissolving Tension: (3) vs. (4).**
          *   *Why:* Looks like Consequentialist Method + Deontological Ground = Contradiction.
          *   *Dissolution:* It's a "Deontological Consequentialism" of sorts (like Scanlonian contractualism or a two-level view). The *goal* is deontological (respect), the *tool* is aggregative (efficiency in respect).

  7.  **Final Review against Constraints:**
      *   Did I rank severity? Yes.
