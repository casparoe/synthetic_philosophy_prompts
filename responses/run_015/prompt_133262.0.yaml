answer: |-
  Imagine a Late Neolithic site, "Tell Nebada," where excavators uncover a single large rectangular structure with no internal walls, containing 120 ceramic storage jars and 12 basalt grinding slabs. The jars are statistically identical in volume (mean 25L, variance <2%), suggesting a high degree of production control, and they are arranged in 12 distinct clusters of 10 jars each, with every cluster centered around one grinding slab. The crucial material detail is that every cluster is separated from its neighbors by an **identical 50cm empty buffer zone**, creating a perfect grid across the floor. Interpretation A (the Institutionalist) argues this buffer is an "audit aisle," designed to allow administrators to walk around and count stock without moving heavy jars, implying a centralized rationing system with formal inventory rules. Interpretation B (the Minimalist) argues the buffer is a "maintenance zone," necessary for sweeping up grain chaff and preventing spillage from mixing between the hearths of 12 cohabiting extended families, implying kinship-based storage where standardization arises from shared cultural pottery traditions rather than administrative law.

  Here is the breakdown of the inference clash. The Institutionalist relies on the principle of *energy cost*: maintaining a precise 50cm gap across a large floor requires deliberate planning and lost storage space, which only makes sense if the "cost" buys administrative security (inventory control). They read the volume standardization as proof of centralized manufacturing (molds or strict oversight) paired with the grid as proof of management. The Minimalist relies on the principle of *practical equifinality*: the same layout emerges from domestic hygiene needs. They argue that 2% volume variance is achievable by skilled kin-group potters sharing a clay source, and the gap is simply a practical walkway for cleaning, not a bureaucratic boundary. The feature doing all the logical work here is the **uniform inter-cluster buffer zone**. It is the single ambiguous variable that flips the narrative from "bureaucratic aisle" to "family cleaning space."

  If we discover one additional object type—say, a cache of **clay tokens** found in a sealed niche within the structure, where the token counts exactly match the jar counts in each cluster—the ambiguity collapses in favor of the Institutionalist. Tokens are counting devices; their presence transforms the buffer from a cleaning zone into an accounting aisle, confirming that the spatial layout was designed for inventory management rather than hygiene. However, if the tokens are absent, the Institutionalist must defend against the charge of overinterpretation (seeing a state where there is only a village). Their defense rests on the *threshold of standardization*: they would argue that the energy expenditure required to produce 120 near-identical vessels exceeds the utility of simple family storage. Families make vessels to fit their specific needs (resulting in variance); only an institution imposes the cost of uniformity to facilitate exchange or rationing. Thus, even without writing, the "expensive" precision of the layout and vessels acts as a proxy for administrative rules.
