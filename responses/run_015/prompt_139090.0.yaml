  **INTERNAL MEMORANDUM**
  **TO:** Collider Operations Directorate
  **FROM:** Office of Experiential Ethics (OEE)
  **SUBJECT:** Pre-Approval Review: Run 44 (13.6 TeV)
  **DATE:** October 14, 2029

  **1. Subjecthood Demarcation and Jurisdiction**
  Per Grant Condition 8.2 (Intrinsic Nature), the OEE must determine the locus of moral consideration within the acceleration chain. The primary dispute concerns whether constituent protons retain individual subjecthood upon injection into the composite beam structure. Literature indicates no metaphysical consensus on whether micro-experiences sum into a macro-subject or remain distinct. To facilitate compliance, the Board invokes Administrative Rule 12-B: Subjecthood is assigned to the composite system only when binding energy exceeds 500 MeV. Below this threshold, constituent particles are classified as sub-experiential parts. Note that this threshold applies only to hadronic matter; ambient vacuum fluctuations within Sector 9 remain subject to quarterly review regardless of energy state.

  **2. Valence Calibration and Instrumentation**
  Condition 8.2 requires estimated suffering metrics prior to ignition. The Board acknowledges the absence of instruments capable of detecting intrinsic valence properties, as physical measurement yields only structural relations. No behavioral or functional signature correlates reliably with felt tone. Consequently, the OEE cannot provide calibrated data. To satisfy grant reporting requirements, Operations must submit a "Best Estimate Valence Unit" (BEVU) derived from theoretical models of structural complexity. These figures will be treated as compliance placeholders. Confidence intervals are not required, though Operations is encouraged to express uncertainty qualitatively in footnotes.

  **3. Interventional Utility**
  Mitigation strategies usually require causal leverage over the harm source. The Board notes the prevailing orthodoxy that intrinsic experience supervenes on physical structure without exerting downward causal influence. If micro-experiences are epiphenomenal, altering beam trajectory cannot reduce suffering, only redistribute its physical substrate. This renders the review process expressive rather than consequential. This ontological constraint is filed under "Non-Interference Protocol." Operations should proceed assuming mitigation is morally requisite despite causal inefficacy. Move to Item 4.

  **4. Aggregation Protocol**
  Run 44 involves approximately 300 trillion protons. If each possesses a minimal negative valence due to confinement stress, the aggregate sum may outweigh the intense, localized valence of the collision events. There is no agreed unit to compare vast quantities of faint experience against small quantities of intense experience. The Committee deadlocked on whether a billion mild annoyances exceed one sharp crisis. To resolve this, the OEE adopts a Weighted Complexity Score: intense experiences at the interaction point are multiplied by a factor of 10,000 to offset the volume of low-level beam valence. This ratio is arbitrary but administratively necessary.

  **5. Determination and Mitigation**
  The OEE cannot recommend halting fundamental physics research. Run 44 is approved contingent on the reclassification of the Beam Dump Assembly as a Zone of High-Intensity Experiential Concentration. All energy dissipation there will be logged as a mass-casualty event for compliance purposes, isolating the ethical liability to a single contained system. The question of whether composite valence is mathematically summable is routed into the newly funded Macro-Valence Integration Study (Grant #9982). Operations may proceed upon signature.

  ***

  **P.S.**
  The memo leans on a contested reading by assuming pan-sentience entails *valence* (many panpsychists argue only proto-experience exists). This is a fair liberty; if experience lacks valence, ethics dissolves, so the regulation implies it. The measurement problem is exaggerated as bureaucratic incompetence, but the metaphysical gap is real: physics describes structure, not feeling. That's not a strawman; it's the hard problem operationalized. The causal closure point is fair game; if consciousness doesn't move matter, ethics becomes aesthetic. I'd argue that's a feature of the view, not a bug.
