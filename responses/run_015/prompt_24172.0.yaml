      *   **Constraint:** Keep it under 150 words.
      *   **Goal:** Make the character's moral reasoning sound like something a real philosopher would endorse (specifically Hume).

  2.  **Recall Hume's Ethics:**
      *   **Justice:** Artificial virtue, not natural. It arises from convention to maintain social order and property.
      *   **Utility:** The foundation of moral approval. Actions are good if they promote happiness/utility.
      *   **General Rules:** Justice relies on strict general rules because case-by-case utility calculations can be biased and destructive to the system.
      *   **Exceptions:** Hume acknowledges that in cases of extreme necessity (e.g., survival, imminent catastrophe), the strict rules of justice might be suspended because the underlying purpose (public utility) is better served by breaking the rule.
      *   **Key Text:** *An Enquiry Concerning the Principles of Morals*, Section III, Part I (regarding necessity).

  3.  **Drafting the Content:**
      *   *Core Idea:* Hume sees justice as a tool for social utility, not an absolute divine command.
      *   *Application:* In normal times, strict rules prevent chaos. But in "cases of extreme necessity," the obligation to justice yields to the greater good.
      *   *Nuance:* He wouldn't endorse torture lightly, but the imminent mass death shifts the utility calculus. The convention exists to save society; if saving society requires breaking the convention *once* to prevent total destruction, utility wins.
      *   *Tone:* Philosophical, precise, concise.

