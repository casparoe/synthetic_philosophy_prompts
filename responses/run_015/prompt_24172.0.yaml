  Hume views justice as an artificial convention grounded solely in public utility. Normally, strict rules against violence are vital because individual calculations of utility are biased and threaten social order. However, Hume explicitly admits that in cases of "extreme necessity," ordinary rules of justice are suspended. If the bomb threatens societal collapse, the convention's purpose, preserving society, is better served by breaking it. The interrogator isn't violating morality but fulfilling its deeper foundation: maximizing utility. Yet, Hume would caution that this exception must be genuinely rare. If torture becomes routine, the convention erodes, causing long-term harm outweighing short-term gains. Thus, she acts rightly only if the necessity is absolute, prioritizing the survival of the many over rigid adherence to rules designed for peaceful stability. The rule bends, but only because the utility demanding the rule now demands its breach.
