answer: |-
  ### Desiderata for a Normative Theory of Public Commemoration

  **1. Functional Differentiation**
  *   **Requirement:** The theory must rigorously distinguish the *honorific* function (endorsing values/individuals) from the *documentary* or *pedagogical* function (recording historical facts).
  *   **Motivating Pressure:** Retaining a monument solely for "educational value" conflates a shrine with a textbook. A statue in a plaza performs a different speech act than a plaque in a museum.
  *   **Status:** Non-negotiable. Without this, debates regarding "erasing history" remain category errors.
  *   **Tension:** None inherent, but difficult to apply in practice.

  **2. Spatial Sensitivity**
  *   **Requirement:** The theory must account for the symbolic weight conferred by location, scale, and density. It must explain why removing a central statehouse monument differs morally from renaming a dispersed residential street.
  *   **Motivating Pressure:** Centrality implies state endorsement; periphery implies habituation. A single monument dominates a visual field; dozens of street names constitute an infrastructure.
  *   **Status:** Non-negotiable. Ignoring spatial context leads to over- or under-estimating the harm of a marker.
  *   **Joint Unsatisfiability:** There is a significant tension between **Spatial Sensitivity** and **Moral Consistency**. If a figure is deemed unworthy of honor (Moral Consistency), their name should theoretically be removed from all spaces. However, Spatial Sensitivity suggests peripheral markers (e.g., residential streets) may lack the honorific force to warrant removal. Satisfying Consistency fully undermines Sensitivity, and vice versa.

  **3. Replacement Normativity**
  *   **Requirement:** The theory must prescribe the status of a site post-removal: whether it obligates a new honoree, requires a deliberate void (marking the absence), or demands reconceptualization (e.g., turning a plaza into a park).
  *   **Motivating Pressure:** A vacated pedestal is not neutral; it signifies loss, victory, or pending decision. Leaving a void can be as expressive as filling it.
  *   **Status:** Camp-specific. Preservationists reject removal; Removalists often disagree on whether replacement is necessary to maintain civic cohesion.

  ---

  ### Assessment of Existing Positions

  **1. Preservationism**
  *   **Success:** Maintains **Symbolic Stability**. It avoids the disruption of constant re-evaluation and preserves the physical record of the past.
  *   **Collapse:** Fails **Functional Differentiation**. It collapses the *honorific* into the *documentary*, arguing that keeping a statue of a tyrant is merely "preserving history." It ignores that public placement constitutes ongoing endorsement, not neutral archiving. It also fails **Spatial Sensitivity** by treating all historical markers as equally sacrosanct regardless of their civic dominance.

  **2. Contextualism**
  *   **Success:** Acknowledges **Spatial Sensitivity** to a degree by suggesting some markers can remain if re-framed (e.g., adding plaques). It attempts to balance continuity with moral correction.
  *   **Collapse:** Fails **Functional Differentiation**. It operates on the assumption that *information* neutralizes *honor*. It collapses the distinction between explaining a monument and endorsing it, presuming that contextual text can overwrite the symbolic primacy of the statue or name itself. It often sidesteps the **Replacement Problem** by leaving the original honorific structure intact.

  **3. Removalism**
  *   **Success:** Upholds **Functional Differentiation**. It correctly identifies that public commemoration is a normative act of honor, not a historical record, and that unworthy subjects must be withdrawn from that status.
  *   **Collapse:** Often fails **Spatial Sensitivity**. Hard removalism frequently applies a blanket moral logic to all markers, treating a residential street name as morally equivalent to a central courthouse monument. It also frequently lacks a robust **Replacement Normativity**, treating removal as a terminal act rather than a transitional one, risking a civic landscape defined solely by negation rather than renewed positive vision.
