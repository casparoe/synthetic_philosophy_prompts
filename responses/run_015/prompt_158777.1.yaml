  Dear friend, it was great to catch up last week and hear about the upcoming episode with Dr. Haddad, though I share your concern that her anonymity suggests she knows this interventionist occasionalism view is likely to draw fire from both the analytic metaphysics and classical theism camps. Since you asked for a strategy to stay a step ahead of her rather than scrambling for responses in the moment, I have sketched out a sequence of ten questions that move from her anti-Humean pretensions through the mechanics of her interventionism and into the theological and moral implications, ensuring you cover the specific pressure points you mentioned while maintaining a coherent narrative arc for the listeners. I suggest you open the substantive portion of the interview by immediately challenging her stock line about Hume, so for question one you should ask how exactly invoking a divine decree explains the regularity rather than just labeling it, to which she will likely insist that decrees provide a metaphysical ground unlike brute facts, which invites the follow-up asking whether, if the decree is necessarily efficacious, the necessity is not just transferred to the link between will and effect. You need to press this advantage immediately for question two by asking what explanatory work the decree performs that a primitive nomic necessity would not, and while she will argue that agency provides intelligibility where brute necessity does not, you should counter with question three by asking if explaining every regularity by one inscrutable will is really an explanation or just a uniformity claim with a theistic footnote, anticipating that she will insist volition is fundamentally different from brute force, which allows you to pivot to the mechanics of her view by asking how this volitional framework accommodates the asymmetry required by interventionism. This leads naturally into question four, where you should ask if the asymmetry between match and burning is just a feature of the pattern of divine responses, does occasionalism seem to be doing no work in the account, and since she will say the pattern is fixed by the decree to establish the direction, you must follow up by asking if the pattern isn't grounded in the creatures, what grounds the pattern other than arbitrary fiat, and if it is arbitrary, how is it robust enough for science. Once you have destabilized the regularity account, move to the intervention mechanism itself with question five, asking what makes something an intervention rather than another event God produces, and whether God's tracking of interventions puts causal relations back in at the divine level, to which she will likely define interventions as exogenous variables not determined by the model's internal history, prompting you to ask in the follow-up whether, if God must distinguish these to respond appropriately, He does not stand in a causal relation to the intervention itself. You should then transition to the theological coherence of the view with question six, asking how a God who has no temporal parts and no successive states suits responding to a counterfactual intervention, and although she will appeal to eternal concurrence or timeless knowledge of counterfactuals, you should press the follow-up by asking whether this does not collapse the distinction between the occasion and the effect into a single eternal decree, undermining the occasionalist sequence. This theological tension sets up question seven regarding the status of miracles, so ask her if on her view miracles can only be relative to a habit, does that leave the category epistemic in a way that undercuts any apologetic use of it, expecting her to argue that miracles are objective deviations from the ordained habit and not just surprise, which invites the follow-up asking if the habit is just what God usually wills, isn't the deviation just what God unusually wills, making the miracle ontologically identical to any other event. Having covered the metaphysics and theology, you need to address the ethical implications with question eight, asking if her authorship without production is just compatibilism with the causal machinery deleted, to which she will say responsibility tracks alignment with will and not causal origination, allowing you to introduce the concrete case in question nine by asking about two agents whose created wills and histories are alike in every respect and who nonetheless act differently, where she will locate desert in the nature of the will God created and not the production of the act, prompting you to ask where the desert goes if neither produced the act. Finally, you should close the interview by testing the scientific vulnerability of the position with question ten, asking what we would have to find in fundamental physics or in scientific practice that would make her give it up, and since she might say nothing empirical counts against it but only metaphysical incoherence, your final follow-up should ask whether, if nothing empirical counts, we are doing metaphysics or theology, which leaves the audience with a clear sense of the view's epistemic status. I hope this sequence helps you navigate the recording without letting her retreat into vague appeals to divine mystery, and please let me know if you want to rehearse any of these follow-ups before you hit record.
