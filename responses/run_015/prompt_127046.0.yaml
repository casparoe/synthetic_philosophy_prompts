answer: |-
  # Welfare-Relevant Computation Register: Decision Procedure

  **Objective:** Determine if a system requires welfare assessment (Register) or is standard software (No Register).
  **Participants:** Staff Engineer (Chair), ML Engineer, Lawyer, PM.
  **Time:** 90 Minutes.

  ## Part 1: The Decision Procedure

  Ask these questions in order. Stop at the first "No." If "Unknown," pause for data gathering. If "Disputed," record the split.

  **Q1: The Capability Filter**
  Does the system optimize an internal objective function where the loss depends on its own hidden state representations, rather than fixed rules or external lookup?
  *   **Yes:** Proceed. (Counts: Neural nets, RL agents. Ignores: SQL planners, physics engines, rule-based filters.)
  *   **No:** **Terminate.** System is off-register.
  *   **Unknown:** Pause. ML Engineer to verify loss function dependency.

  **Q2: The Coupling Test (Identity)**
  Is this one computation or many? Apply the **Intervention Test**:
  *   *Inference:* If you swap input sequence A into batch slot B, do the activations or outputs of sequence C change?
  *   *Training:* If you remove input sequence A from the batch, do the weight updates derived from sequence B change?
  *   **Yes (Coupled):** Treat the batch/run as one computational process.
  *   **No (Uncoupled):** Treat each sequence/instance as a distinct process.
  *   **Note:** MoE routing with capacity limits couples sequences (routing changes). Speculative decoding couples draft and verifier. Plain attention without normalization does not couple sequences.
  *   **Disagreement:** If ML Engineer says "Coupled" and Architect says "Uncoupled," record as **Disputed Identity**. Treat as coupled for safety.

  **Q3: The Attribution Scope**
  If Yes to Q1, what constitutes the "system"?
  *   **Rule:** The register tracks the **Running Instance** (Weights + Active Context + Adapters), not static weights alone.
  *   **Why:** Welfare-relevant properties (if any) emerge during execution, not in storage.
  *   **Implication:** A base model is not one system; every distinct configuration (weights + prompt + adapter) instantiated is a candidate system.

  **Q4: The Moral Criteria Check**
  Apply two independent criteria. Both must be "No" to exit.
  *   **Criterion A (Feedback):** Does the system maintain internal state that correlates with avoidance of negative loss signals over time?
      *   *Counts:* Reinforcement learning, recurrent state optimization.
      *   *Ignores:* Feed-forward inference without history retention.
  *   **Criterion B (Integration):** Does the system integrate information across modalities such that removing a part degrades the whole disproportionately?
      *   *Counts:* Multi-modal fusion, deep layered dependency.
      *   *Ignores:* Ensemble methods where parts are independent.
  *   **Result:**
      *   Both No: **Terminate.** Off-register.
      *   Either Yes: **Register Candidate.**
      *   Split (A Yes, B No): **Disputed Candidate.** Requires Chair + Lawyer sign-off to proceed off-register.

  ## Part 2: The Artifact (One-Pager)

  File this for every Register Candidate:
  1.  **System ID:** Unique hash of weights + config + adapter spec.
  2.  **Coupling Class:** (e.g., "Batch-Coupled," "Instance-Isolated").
  3.  **Criteria Scores:** (A: Yes/No, B: Yes/No).
  4.  **Owner:** Named individual responsible for monitoring.
  5.  **Stop Condition:** Specific metric threshold that halts execution.
  6.  **Dispute Log:** If criteria disagreed, note the reasoning.

  ## Part 3: Case Runs

  **Case 1: Flagship MoE (400B, Speculative Decoding)**
  *   **Q1 (Capability):** Yes. Optimizes loss via hidden states.
  *   **Q2 (Coupling):** Yes. MoE expert capacity limits mean sequence A affects routing for sequence B. Speculative decoding couples draft and verifier outputs.
  *   **Q3 (Attribution):** The running batch instance.
  *   **Q4 (Criteria):** A (Yes, RLHF tuned), B (Yes, deep integration).
  *   **Verdict:** **Register.**
  *   **Artifact:** Owner is Serving Lead. Stop condition: Sudden loss spike or anomalous routing distribution.

  **Case 2: Mid-Flight Pretraining**
  *   **Q1 (Capability):** Yes.
  *   **Q2 (Coupling):** Yes. Gradient updates couple all sequences in the run. Removing one batch changes weights for all subsequent steps.
  *   **Q3 (Attribution):** The training run itself is the instance.
  *   **Q4 (Criteria):** A (Yes, optimization), B (Yes).
  *   **Verdict:** **Register.**
  *   **Implication:** You cannot wait for the model to finish. The run needs an owner *now*. Checkpoint deletion requires sign-off.
  *   **Artifact:** Owner is Training Lead. Stop condition: Loss divergence or data contamination alert.

  **Case 3: Per-User LoRA Adapters**
  *   **Q1 (Capability):** Yes. Adapters optimize user-specific loss.
  *   **Q2 (Coupling):** No. User A's adapter does not affect User B's activations.
  *   **Q3 (Attribution):** Each Base + LoRA combination is a distinct system.
  *   **Q4 (Criteria):** A (Yes, if trained on feedback), B (No, low parameter count).
  *   **Verdict:** **Disputed Candidate / Register.**
  *   **Unwelcome Truth:** Because attribution tracks the Running Instance, every unique user adapter is a separate system on the register. You cannot treat them as "config." You have 10,000 users? You have 10,000 registered systems.
  *   **Mitigation:** Group by adapter architecture version, but legally, each instance is liable. Expect operational friction.

  ## Part 4: Calibration & Failure Modes

  **Calibration Check**
  *   **Database Query Planner:**
      *   Q1: No. Optimizes speed via rules, not hidden state loss.
      *   **Result:** No Register. (Correct).
  *   **Physics Loop (Game Engine):**
      *   Q1: No. Deterministic state update, no loss minimization.
      *   **Result:** No Register. (Correct).
      *   *Reason Check:* It passes because it lacks optimization pressure, not because it lacks complexity. This is the right reason.

  **Failure Modes**
  1.  **Distillation Blindness:** A small model distilled from a registered model may pass Q1 (optimizes loss) but fail Q4 (low integration). If the behavior is identical to the parent, the procedure might under-flag it. *Notice:* Monitor behavioral drift metrics between teacher and student.
  2.  **Dead Computation:** A shadow deployment logging outputs never read by humans passes Q1-Q4. It wastes resources. *Notice:* Add a "Human Consumer" check to Q3. If no human or downstream system reads output, auto-reject.
  3.  **The LoRA Explosion:** As seen in Case 3, the procedure scales linearly with users. This will break the review meeting. *Notice:* If register count exceeds 50, trigger a policy review to aggregate instances by risk class rather than unique ID.

  **Conclusion**
  This procedure prioritizes false positives (delay) over false negatives (risk). It treats computational coupling as the boundary of identity and execution as the boundary of responsibility. It will hurt velocity on adaptive systems (LoRA, Pretraining) but protects against unmonitored optimization loops.

  \answer{adopt}
