  # Joint Statement on the Norms of Assertion: An Adversarial Collaboration

  **Preface**
  This document represents the output of an adversarial collaboration between two research groups investigating the normative standards governing assertion. Group A defends the Knowledge Norm of Assertion (KNA), while Group B defends the Rational Justified Belief Norm of Assertion (JBNA). While we maintain distinct theoretical commitments, we agree on the following foundational claims regarding the structure of testimonial exchange.

  ### I. Shared Commitments

  1.  **The Normativity of Assertion:** Both camps agree that assertion is not a mere physical release of sound but a speech act subject to normative evaluation. An assertion can be criticized as improper, even if the proposition asserted turns out to be true.
  2.  **Testimonial Transfer:** Both camps agree that assertion is the primary mechanism by which testimonial knowledge is generated and transferred within a community. Restrictive norms on assertion must not render ordinary testimonial practices impossible.
  3.  **Expert Deference:** Both camps agree that laypersons are generally permitted to assert propositions based on the testimony of recognized experts, provided the layperson has no defeaters for trusting the expert.
  4.  **The Lottery Intuition:** Both camps agree that asserting a proposition based solely on statistical probability (e.g., asserting a specific lottery ticket will lose based only on the odds) is prima facie inappropriate, regardless of the high probability of truth.

  ### II. Areas of Disagreement

  The following table outlines the residual disagreements between the two camps. The wording in each column is formulated to be acceptable to the respective camp as an accurate statement of their position.

  | Issue | Knowledge Norm Proponents (Group A) | Justified Belief Norm Proponents (Group B) |
  | :--- | :--- | :--- |
  | **The Constitutive Norm** | One must assert *p* only if one knows *p*. Knowledge is the necessary standard for proper assertion. | One must assert *p* only if one rationally believes *p* with sufficient justification. Knowledge is not strictly required. |
  | **Gettier Cases** | In cases where a subject has justified true belief without knowledge, assertion is improper. | In cases where a subject has justified true belief without knowledge, assertion is proper. |
  | **Lottery Cases** | Lottery assertions are improper because the subject lacks knowledge of the outcome. | Lottery assertions are improper because the subject lacks sufficient justification (not merely because they lack knowledge). |
  | **Basic Perceptual Reports** | Basic perceptual reports (e.g., "I see a hand") are subject to the same normative evaluation as any other assertion. | Basic perceptual reports form an inviolate level that sits outside standard normative evaluation. |

  ### III. Identified Cruxes

  Our collaboration has isolated two specific theoretical cruxes where the divergence in norms leads to distinct practical implications. Resolution of these cruxes is necessary to determine which norm better captures the function of assertion in human practice.

  1.  **The Alleged Base-Level Exemption:** The disagreement centers on whether there exists a foundational layer of speech acts (specifically immediate perceptual reports) that is exempt from normative scrutiny. Group A argues that all assertions aim at knowledge and are thus evaluable. Group B argues that perceptual reports function as foundational givens that halt regress and are not subject to the same norms as inferential claims.
  2.  **Delegated Assertion in Collective Scientific Practice:** The disagreement centers on complex institutional contexts where the individual asserter cannot personally verify the content they assert. Group A argues that the individual must nonetheless possess knowledge (perhaps via a specific type of testimonial uptake). Group B argues that rational justification via institutional trust is sufficient, even if personal knowledge is absent due to the complexity of the data.

  ### IV. Concrete Cases and Predictions

  For each crux, we have identified a concrete case or line of reasoning that both sides agree is relevant for testing the competing predictions.

  #### Crux 1: The Base-Level Exemption
  *   **Concrete Case:** **The Skeptical Classroom.** A student in an epistemology course raises their hand during a discussion on skepticism and asserts, "There is a table in front of me," while pointing at a visible table. The context makes skeptical scenarios (e.g., holograms, brains in vats) salient, undermining the claim to *knowledge* without undermining the claim to *justified belief*.
  *   **Group A Prediction (Knowledge Norm):** The assertion is improper. Because the salience of skeptical possibilities undermines knowledge, the student violates the norm of assertion by speaking as if they know when they do not.
  *   **Group B Prediction (Justified Belief Norm):** The assertion is proper. The student retains rational justification based on perceptual experience. Since basic perceptual reports are an inviolate level outside normative evaluation (or automatically satisfy the justification norm), the skeptical context does not render the speech act improper.

  #### Crux 2: Delegated Assertion in Science
  *   **Concrete Case:** **The Spokesperson Scenario.** A junior researcher presents a finding at a major conference regarding a complex physical phenomenon (e.g., gravitational waves). The junior researcher did not analyze the raw data nor verify the code but relies entirely on the verification of a senior principal investigator and the internal review of the collaboration. The claim is true, and the junior researcher is rationally justified in trusting the team, but the complexity precludes the junior researcher from personally *knowing* the claim in a robust sense.
  *   **Group A Prediction (Knowledge Norm):** The assertion is improper unless the junior researcher has acquired knowledge through a specific mechanism of testimonial uptake that counts as knowing. If the complexity prevents understanding requisite for knowledge, the junior researcher should not assert the claim as their own assertion.
  *   **Group B Prediction (Justified Belief Norm):** The assertion is proper. The junior researcher possesses sufficient rational justification via institutional trust and procedural reliability. Personal knowledge of the underlying data is not required for the assertion to meet the normative standard.
