answer: |-
  This is a remarkably sharp observation, and you have put your finger on a blind spot in mainstream moral psychology. The standard consensus (largely following psychologists like June Price Tangney) is that guilt is "adaptive" and shame is "maladaptive." Your critique is that this view focuses on the *phenomenology* of the emotion (how it feels) while ignoring the *sociology* of the emotion (how it functions in a system).

  To answer your direct question: **No, there is not a single, canonical term for this specific structural mismatch.**

  However, the phenomenon you are describing is discussed across theology, sociology, and restorative justice under a few intersecting concepts. If you want to name it or search for it, here are the closest existing frameworks, followed by a proposal for what we might call it.

  ### 1. The Existing Frameworks

  **A. The Privatization of Moral Repair**
  This is the strongest sociological description of what you're seeing. In *Habits of the Heart*, Robert Bellah and colleagues argue that modern liberal individualism (which aligns with "guilt cultures") privatizes morality.
  *   **The Mechanism:** Guilt is defined as an internal conflict between the self and its standards. Therefore, the resolution is assumed to be internal (self-forgiveness, cognitive reframing).
  *   **The Deficit:** By making morality private, you remove the *public stage* required for repair. You cannot "make amends" to a principle; you can only make amends to a person or community.
  *   **The Term:** Scholars might call this the **"Atomization of Conscience."**

  **B. The Expiatory Deficit**
  This comes from theology and ritual studies. In religious systems, guilt (sin) is almost always paired with a mechanism of expiation (confession, penance, sacrifice).
  *   **The Mechanism:** Secular guilt cultures often retain the *condemnation* (the feeling of having done wrong) without the *absolution* (the ritual that declares the debt paid).
  *   **The Deficit:** Without a ritual endpoint, the guilt has no "off switch." It becomes chronic rumination.
  *   **The Term:** You might find this discussed as **"Contrition without Absolution"** or **"Secular Penance."**

  **C. Unreintegrated Guilt**
  This is a flip of John Braithwaite's *Reintegrative Shaming*. Braithwaite argues shame becomes toxic when it is *disintegrative* (stigmatizing without a path back).
  *   **The Mechanism:** Your observation suggests that guilt is *inherently prone to disintegration* because it lacks a built-in reintegration script. Shame forces the community to acknowledge the offender (to shame them); guilt allows the community to ignore the offender (because it's their internal problem).
  *   **The Term:** In criminology, this is sometimes touched upon as **"Isolated Offender Management,"** but there isn't a specific phrase for the emotional counterpart.

  ### 2. Proposed Terminology

  If you want to coin a term for this specific pattern—the structural lack of a redemption script in guilt-dominant systems—here are three options ranging from descriptive to theoretical:

  **Option 1: The Guilt-Repair Asymmetry**
  This highlights the imbalance: We have high-resolution scripts for feeling guilty, but low-resolution scripts for resolving it socially.

  **Option 2: The Expiatory Void**
  This captures the feeling of "stuckness." It suggests that the culture demands payment (suffering/rumination) but offers no vault to deposit it in.

  **Option 3: Moral Solipsism**
  This is the strongest philosophical label. It suggests that guilt cultures trap the moral agent in a "self-only" loop (solipsism), whereas shame cultures, by their nature, acknowledge the "other."

  ### 3. How this differs from "Healthy Shame"

  You asked how this is different from simply arguing that "shame can be healthy." This is a crucial distinction.

  *   **"Healthy Shame" (Reintegrative Shaming):** This argument focuses on **rehabilitating shame.** It says, "We can tweak shame to make it less toxic by adding love and reintegration." It keeps the focus on the emotion of shame.
  *   **Your Argument (The Guilt Deficit):** This focuses on **the structural insufficiency of guilt.** It says, "Even if guilt is theoretically cleaner, it is functionally broken because it lacks a social technology for closure."

  Your point is not that shame is *better*, but that guilt is *incomplete*. It's a critique of the **infrastructure of morality**, not just the emotional valence.

  ### 4. Why does this happen? (The Structural Explanation)

  The reason this pattern exists is that **Guilt is a Sovereign Emotion, while Shame is a Relational Emotion.**

  *   **Guilt** assumes you are a sovereign individual. You broke a rule *you* believe in. Therefore, *you* can fix it *yourself*. The culture doesn't need to intervene. This is why parenting advice says "I'm disappointed in your choice." It hands the burden back to the child's internal processing.
  *   **Shame** assumes you are a node in a network. You damaged the *connection*. Therefore, the *network* must participate in the fix. This is why restorative justice circles work; they treat the harm as a tear in the fabric, not a stain on the soul.

  ### Summary

  You have identified a **structural deficit in individualistic moral systems.**

  While there is no single Wikipedia-ready term for it, the most accurate way to describe it in academic discourse is **"The Privatization of Moral Repair"** or **"The Lack of Expiatory Ritual in Guilt Cultures."**

  If you are writing about this, I would suggest calling it **"The Guilt-Repair Gap."** It succinctly captures the mismatch between the high demand for moral feeling (guilt) and the low supply of social mechanisms to resolve it (repair). It explains why "good" people in guilt cultures often burn out morally: they are paying debts into a void.
