answer: |-
  The isolation booth smelled of ozone and stale coffee, a scent Elara associated with the dead. She adjusted the haptic collar, feeling the cold gel pads settle against her cervical vertebrae. On the monitor, the disclaimer scrolled in mandatory yellow text: *SUBJECT 8940: DECEASED. RECONSTRUCTION FIDELITY: 98.4%. CAUSAL AGENCY: NULL.*

  She clicked *ACKNOWLEDGE*. Her cognitive ledger was balanced. She knew this was data. Excavated neural residue from a man who had died ten years ago. There was no man, only the pattern of his firing synapses preserved in the silicate stacks beneath the floor.

  Elara initiated the handshake.

  The booth dissolved. She was standing on a platform in the rain. Not simulated rain—the archive didn't bother with fake wetness—but the *memory* of rain. The sensory data bypassed her eyes and hooked directly into her occipital lobe. She felt the chill of the coat she wasn't wearing. She felt the weight of the suitcase in a hand that was open and empty.

  Subject 8940 was waiting for a train. He was anxious. Not the generic anxiety of a simulation, but the specific, sour dread of a man running away from a life he loved. Elara felt the knot in her stomach. She knew it was his knot, mapped onto her nervous system for fidelity testing, but her muscles tightened regardless. She watched him check his watch. He was leaving a woman. Elara knew the metadata: the woman was still alive, living in Sector 4. She knew 8940 died of a heart attack three stops later.

   cognitively, this was a closed loop. A ghost story told in binary.

  But when the train arrived, screeching like a dying bird, Elara's breath hitched. She felt the urge to reach out, to grab the lapel of his coat and tell him to stay. Her hand twitched in the empty air of the isolation booth. She didn't move. She knew there was no coat. But the grief that slammed into her chest was physical, a bruise forming on the heart.

  The session ended. The rain vanished, replaced by the hum of the server racks.

  Elara sat in the silence, shaking. She reached for the logbook, pen hovering over Form 88-B: *Empathic Risk Assessment*.

  *Did the subject experience distress?*
  *No.*

  *Did the operator experience distress?*
  *No.*

  She wrote *NO*. Her hand was trembling so hard the ink bled through the page. She stood up and walked to the break room. She poured water into two cups out of habit—one for herself, one for the man on the platform. She stared at the second cup for a full minute before pouring it down the sink.

  This was the divergence. Her mind knew the cup was unnecessary. Her body had prepared it anyway.

  For weeks, the split widened. She would walk home and feel a surge of protective fear when a car sped past, calibrated to the danger levels of a stranger who had died a decade ago. She would wake up grieving a loss that wasn't hers, tears soaking her pillow, while her waking mind calmly categorized the dream as *Archive Residue*. It was double-bookkeeping. One ledger said *FALSE*, marked in red ink. The other said *REAL*, stamped in blood.

  The bureaucracy offered a solution. On her desk lay the override key for the Affective Dampener Protocol. Engaging it would sever the emotional handshake. She would still see the memories, hear the words, but they would hit her like reading a weather report. Dry. Informational. Safe.

  Elara sat in the booth again. Subject 8940 was waiting in the rain.

  She looked at the console. The *DAMPENER* switch was behind a clear plastic guard. To flip it was standard procedure for technicians showing signs of "Ontological Drift." Her supervisor had hinted at it yesterday. *You look tired, Elara. Maybe it's time to mute the signal.*

  If she flipped it, the pain would stop. The grief for the man on the platform would vanish. She would be efficient. Her ledgers would match again. Cognitive and affective would align on the truth: this is not real.

  But then, the truth would be all there was.

  She looked at the man in the rain. He checked his watch again. The anxiety radiated off him, a heat haze in the cold air. If she muted the signal, she would be watching a puppet. She would be safe, but she would be alone in a way she hadn't been before. The pain was the only proof that he had existed at all. The archive preserved the data, but her grief preserved the weight.

  Elara's hand hovered over the plastic guard.

  If she kept the link open, she risked herself. She was accumulating debts in an emotional currency she couldn't spend, mourning ghosts who wouldn't miss her. She was becoming a vessel for other people's unfinished lives.

  If she closed it, she became a machine.

  The man on the platform looked up, as if he could see her through the十年 of death and the layers of reconstruction. He didn't know he was being watched. He didn't know he was dead. He only knew the rain and the wait.

  Elara felt the tears start again. They were hot and real, tracking through the cold gel on her neck. Her cognitive mind screamed that this was inefficient, dangerous, irrational. Her affective mind whispered that it was the only thing that mattered.

  She lowered her hand. She did not touch the guard. She did not leave the booth. She sat in the hum of the servers, letting the grief wash over her, balancing the books as best she could, waiting for the train that never came.
