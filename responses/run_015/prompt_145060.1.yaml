  Good afternoon. For half of you in this room, [Advisor's Name] is the reason you know the difference between stating a fact and doing something with words. You know the texts. You know the arguments. For the rest—her family, our admin staff, colleagues from other fields—she's simply the person who made sure this department felt like a home. She taught us that how we speak matters as much as what we say.

  She spent decades teaching us that language isn't just a mirror of reality. It's a tool for action. And if I'm being honest, after years in her seminars, I still catch myself calling them "preformative" utterances... force of habit.

  But standing here today, I've realized something strange about retirement symposiums. They are themselves weird speech acts. We tend to treat them as constatives. We stand up and say things like, "You are leaving a legacy behind," or "You built this tradition," or "Your work is done." We speak as if we are describing a finished object. We use the past tense. We treat her career like a closed book, something to be archived.

  But for anyone who studied with her, we know that treating a living tradition as "completed" is a specific kind of error. In her terms, it's an infelicity. It's a misfire. If we speak as though her work is done, we imply that the tradition stops when her paycheck does. We confuse the illocutionary force of her teaching—which is to generate more thought, to open new questions—with a perlocutionary effect that suggests a final result. To treat her work as dead history is to violate the very conditions she taught us to cherish. It risks turning a living practice into a museum exhibit.

  Think of it like a wedding vow. When someone stands up and says "I do," they aren't describing a relationship; they are establishing one. The words themselves enact the transition. They change the status of the people speaking. And if you say them without intent, the act fails. Today should work the same way. If I simply list her achievements, I am describing a history. I am making a statement that can be true or false. But if I stand here and offer gratitude, I am attempting to secure a future. I am doing something.

  So, I am going to resist the urge to give an obituary for a career that is clearly still breathing. I won't summarize her publications. I won't speak of her legacy as something left behind, like a statue in a quad. That would be a constative mistake. It would suggest the work is over.

  Instead, I want to use this moment to do what she taught us to do. I want to perform the continuity. When I say "Thank you," I am not just reporting a feeling. I am committing to carrying the work forward. The authority she held in this department isn't vanishing; it's being taken up by the people she trained. The questions she asked are now our questions.

  So, [Advisor's Name], we are not here to close a book. We are here to acknowledge that the illocutionary force of your teaching is still active in us. You aren't leaving a legacy behind. You are sending us out with it.

  Thank you.
