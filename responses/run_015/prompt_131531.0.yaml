prompt: |-
  hey — I'm a junior and I basically run this lunch "numbers club" at my school (its not an official club yet, we just eat in the math room and mess with data). Usually 12–14 people, mostly 10th and 11th graders, and we only get one lunch block, so like 40 minutes on a good day. A few of them take AP Stats, most don't, and honestly half of them show up for the free granola bars.

  Next week I want to do Simpson's paradox with them. Please act like a professional game designer who also happens to know stats education really well — like someone who builds these active-learning things for a living. Before you give me the final version, brainstorm 3 or 4 different ways to stage it and tell me in a couple lines each why you threw the others out, then write up the one you'd actually run. Think carefully as you go, take your time with the numbers, and don't just hand me the textbook thing — I can find batting averages and kidney-stone tables myself, and my group would fall asleep.

  What I want is an activity where they run into the reversal themselves rather than being shown it. So: no lecture up front, don't say the name until after, and ideally the data should be generated by *them* live in the room (cards, dice, something they physically do) so the paradox shows up in numbers they made and can't be waved away as a rigged handout. Give me exact rules, materials, what the small stakes are (we're not betting money — candy or "loses and has to present first next week" is about right), and a rough timeline with the reveal moment marked. I want them to write down a prediction before each reveal so it actually stings.

  Two things that matter to me and that I haven't seen done well:

  1. With 14 people the reversal has to be robust to who happens to show up and to how the dice land. So give me the actual rigged setup (the probabilities or card stacks) and tell me how likely it is to still flip if only 8 people come. I'd rather have a version that almost always works than an elegant one that works 60% of the time.

  2. There's a second half I really care about. I don't want them to come away thinking "always split by the lurking third variable and you're safe," because my teacher said that's not always true either — sometimes the variable you'd naturally group by is itself affected by the thing you're comparing, and then splitting makes things worse or even invents a reversal that isn't real. Can you build a second round where the obvious, tempting way to slice the table is the wrong one, so they feel that too? It's fine if the second round is shorter or more facilitator-led.

  Then a debrief that maps specific moments in the activity onto the pieces of the idea, what will predictably go wrong the first time I run it (and what to do when it does), and an honest note about which part of this the activity just can't deliver and I'll have to say out loud — I'd rather know now than have it fall apart at minute 38. Thanks!
