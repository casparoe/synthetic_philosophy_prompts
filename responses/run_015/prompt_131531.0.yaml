answer: |-
  Here is the design document for your lunch club session. I've approached this as a learning experience that functions like a tabletop game: clear rules, hidden information, physical components, and a "win condition" that relies on understanding the mechanics.

  ### Part 1: Brainstorming & Selection

  Here are four ways I considered staging this, and why I rejected three of them for your specific constraints (40 mins, 8–14 students, robustness).

  1.  **The "College Admissions" Simulation:** Students act as admissions officers reviewing folders with Gender/Major/Decision.
      *   *Why I cut it:* It's too slow. Reading folders takes time, and "admissions" feels like schoolwork. It also relies on students accurately tallying data, which leads to arithmetic errors that muddy the paradox in a 40-minute window.
  2.  **The "Casino" Dice Game:** Two slot machines (A and B) with different weighted dice. Students choose which to play.
      *   *Why I cut it:* Pure probability is too volatile with 8 students. If the dice run hot or cold, the paradox disappears. You need a *guaranteed* reversal to make the point stick in one session.
  3.  **The "Teacher Rating" Poll:** Students rate two teachers based on "Easy Class" vs. "Hard Class" cards.
      *   *Why I cut it:* High schoolers are distracted by the social element ("Wait, is this Mr. Johnson?"). It also requires them to generate the *bias* themselves (choosing which class to rate), which they might not do consistently enough to trigger the flip.
  4.  **The "Clinical Trial" Envelopes (SELECTED):** Students are "Researchers" opening patient files. The files contain pre-determined outcomes (Success/Fail) and conditions (Mild/Severe).
      *   *Why this wins:* It is physically active (opening envelopes), the data is generated by their hands (not a handout table), and **I can rig the envelopes** to guarantee the paradox happens even if only 6 students show up. It separates the "Choice" (which clinic to work at) from the "Outcome" (what's in the envelope), creating the necessary confusion.

  ---

  ### Part 2: The Activity — "The Two-Clinic Trial"

  **Time:** 40 Minutes
  **Players:** 8–14 (Robust to variance)
  **Materials:**
  *   14 Manila Envelopes (labeled "Clinic 1" or "Clinic 2").
  *   28 Index Cards (2 per envelope).
  *   Whiteboard & Markers.
  *   Stakes: A bag of decent candy (e.g., Reese's).
  *   *Prep:* You must prep the envelopes before they arrive. See "The Rig" below.

  #### The Rig (Crucial for Robustness)
  You are not using dice for outcomes. You are using **pre-printed outcome cards**. This ensures the math works every time.
  *   **Clinic 1 (The "Bad" Overall Clinic):** Uses **Drug A** (The Better Drug).
      *   *Envelope Mix:* 9 Envelopes total.
      *   *Contents:* 7 cards say "SEVERE Case", 2 cards say "MILD Case".
      *   *Outcomes:* On the "SEVERE" cards, 3 say "CURED", 4 say "DIED". On the "MILD" cards, 2 say "CURED".
      *   *Stats:* Severe Cure Rate = 43%. Mild Cure Rate = 100%. **Overall = 5/9 (55%).**
  *   **Clinic 2 (The "Good" Overall Clinic):** Uses **Drug B** (The Worse Drug).
      *   *Envelope Mix:* 5 Envelopes total (adjust if you have fewer students, keep ratio 2:1).
      *   *Contents:* 1 card says "SEVERE Case", 4 cards say "MILD Case".
      *   *Outcomes:* On the "SEVERE" card, 0 say "CURED", 1 says "DIED". On the "MILD" cards, 3 say "CURED", 1 says "DIED".
      *   *Stats:* Severe Cure Rate = 0%. Mild Cure Rate = 75%. **Overall = 3/5 (60%).**

  *Note: Drug A is better in both subgroups (43% > 0% and 100% > 75%), but Clinic 1 looks worse overall (55% < 60%) because it took all the hard cases.*

  #### Timeline & Rules

  **0:00–0:05: Setup & Stakes**
  *   **Pitch:** "You are all clinical researchers. There are two clinics testing new drugs. We need to know which drug saves more lives so we can fund it next year."
  *   **Stakes:** "There are two teams: Team Clinic 1 and Team Clinic 2. If your clinic has the higher overall survival rate at the end, your team gets the candy. The losing team has to erase the whiteboard and stack the chairs next week."
  *   **Action:** Have them pick an envelope from the pile (mix the piles so they don't see the ratio yet, or just hand them out 9 to one side of the room, 5 to the other).
  *   **Constraint:** "Do not open the envelope yet. Write down your prediction: Which Clinic will have the higher survival rate?" (Collect these or have them hold onto them).

  **0:05–0:20: Data Generation (Round 1)**
  *   **Step 1:** Students open the outer envelope. They see a card that says **"DRUG A"** (for Clinic 1) or **"DRUG B"** (for Clinic 2). *They do not see the patient type yet.*
  *   **Step 2:** They tally their result on the board immediately under "Drug A" or "Drug B" columns. Just "CURED" or "DIED".
  *   **Step 3:** Calculate the class percentages live on the board.
  *   **The Sting:** Drug B will show ~60% survival. Drug A will show ~55%. Team Clinic 2 wins the candy. Team Clinic 1 groans.
  *   **Facilitator Note:** Act disappointed for Team 1. "Man, Drug A failed. We should defund it."

  **0:20–0:30: The Reveal (Round 1 Stratified)**
  *   **Facilitator:** "Wait. The hospital audit just came in. We forgot to account for patient health. Open the *inner* card in your envelope."
  *   **Action:** The inner card says "SEVERE" or "MILD".
  *   **Step 1:** Erase the first tally. Draw a new table: Rows = Cured/Died. Columns = Drug A (Severe), Drug A (Mild), Drug B (Severe), Drug B (Mild).
  *   **Step 2:** Have students come up and place their "CURED/DIED" card into the correct column based on their Severity.
  *   **The Flip:** Calculate the rates live.
      *   Severe: Drug A (43%) > Drug B (0%).
      *   Mild: Drug A (100%) > Drug B (75%).
  *   **Moment:** "Drug A was better for the sick patients. And better for the healthy patients. But it still lost overall. Why?"
  *   **Let them argue:** Give them 2 minutes to shout out why. (Answer: Clinic 1 took the harder cases).
  *   **Name Drop:** Now you say: "This is **Simpson's Paradox**. A trend appears in groups but disappears or reverses when the groups are combined."

  **0:30–0:35: Round 2 (The "Don't Split" Trap)**
  *   **Facilitator:** "Okay, you think the solution is 'always split by the hidden variable.' Let's test that. New Scenario."
  *   **Scenario:** "Drug X vs. Drug Y. Outcome: Survived Hospital Stay. Variable: 'Discharged Early'."
  *   **The Setup (Facilitator Led):** Draw a table on the board. Tell them:
      *   "Drug X is a strong antibiotic. It cures infection but keeps you in the hospital longer."
      *   "Drug Y is weak. You leave early."
      *   "If we split by 'Discharged Early', Drug Y looks amazing (because only healthy people leave early). Drug X looks bad (because only the sickest stay late)."
  *   **The Question:** "If I tell you 'Discharged Early' is the variable, should we split the data by that to see which drug is better?"
  *   **The Trap:** They will say "Yes!" based on Round 1.
  *   **The Correction:** "No. 'Discharged Early' is *caused* by the drug. If you split by it, you are hiding the side effect. Sometimes the variable you want to group by is part of the problem, not the cause."
  *   **Takeaway:** Round 1 was **Confounding** (Severity caused the choice of clinic). Round 2 is **Selection Bias/Collider** (The Drug caused the Discharge status). Splitting helps in Round 1, hurts in Round 2.

  **0:35–0:40: Debrief & Cleanup**
  *   Hand out candy to winners.
  *   Losers start stacking chairs (keep it light).
  *   Final thought: "Data doesn't speak for itself. You have to ask how it was made."

  ---

  ### Part 3: Designer's Notes & Troubleshooting

  #### 1. Robustness Check (The "8 Students" Scenario)
  You asked how likely this is to work if only 8 people show up.
  *   **The Risk:** If you use dice, a lucky streak can break the paradox.
  *   **The Fix:** By using **pre-printed outcome cards** inside the envelopes, the probability is 100%. Even if only 4 students pick Clinic 1 and 4 pick Clinic 2, as long as you distributed the envelopes according to the ratio (roughly 2:1 Clinic 1 to Clinic 2), the math holds.
  *   **Contingency:** If you have exactly 8 students, hand out 5 Clinic 1 envelopes and 3 Clinic 2 envelopes.
      *   Clinic 1 (5 env): 4 Severe (2 Cure, 2 Die), 1 Mild (1 Cure). Total 3/5 = 60%.
      *   Clinic 2 (3 env): 1 Severe (0 Cure), 2 Mild (2 Cure). Total 2/3 = 66%.
      *   *Wait, 60% vs 66% is close.*
      *   *Adjustment for Low N:* If attendance is low, **you** take on the role of 2 "absent researchers" and open 2 extra envelopes yourself to pad the numbers to the target ratios above. Do this visibly so they see the data is real, just "completed."

  #### 2. Predictable Failure Points
  *   **Failure:** Students mix up the columns on the whiteboard in Round 1.
      *   **Fix:** Draw the columns *before* they come up. Use different colored markers for Drug A and Drug B.
  *   **Failure:** They figure out the rig before the reveal (e.g., "Hey, Clinic 1 has way more Severe cards").
      *   **Fix:** Tell them explicitly in the rules: "The patient severity is hidden inside. Do not discuss severity until Round 2." If someone peeks, have them sit out the candy round (keep stakes low enough this isn't a disaster).
  *   **Failure:** Round 2 goes over time.
      *   **Fix:** Round 2 is *you* talking. Do not let them generate data for Round 2. It is a thought experiment. Cut it at minute 35 no matter what.

  #### 3. The "Honest Note" (Limitations)
  Here is what this activity cannot deliver, which you must say out loud in the debrief:
  *   **The Limitation:** "In Round 1, we knew 'Severity' was the right thing to split by because I told you it was a medical trial. In real life, you won't know which variable is the 'Severity' and which is the 'Discharge Status.' Statistics can show you the numbers flip, but it can't tell you *why* they flipped. You need context, not just math."
  *   **Why this matters:** This prevents them from walking away thinking "Just slice the data by every variable until it makes sense." That is p-hacking. You need to emphasize that knowing the *causal story* (which variable affects which) is more important than the calculation.

  #### 4. Materials Checklist
  *   [ ] 14 Envelopes.
  *   [ ] 28 Index Cards (Write "CURED" or "DIED" on one side, "SEVERE" or "MILD" on the other).
  *   [ ] 2 Signs: "Clinic 1 (Drug A)" and "Clinic 2 (Drug B)".
  *   [ ] Candy.
  *   [ ] Whiteboard markers (Red/Blue/Black).

  This design gives you the physical engagement of a game, the mathematical certainty of a script, and the nuance of a college-level stats warning, all in 40 minutes. Good luck with the club.
