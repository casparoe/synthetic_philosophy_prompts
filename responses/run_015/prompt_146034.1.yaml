  8.  **Final Polish:** Check against the prompt's requirements (order of points, flagging misreadings).

      *(Self-Correction on the "Linear" label for Toynbee/Spengler)*: Actually, Spengler is definitely not linear. He is cyclical/morphological. Toynbee is often seen as moving toward spiritual unity, but his civilizational analysis is cyclical. The user groups them as "linear-progressive or directional." This is a potential weak spot. Spengler is explicitly *anti*-linear progress. I must flag this strongly.

      *(Re-evaluating the User's grouping)*: The user says "contrast this with linear-progressive or directional models—particularly Toynbee... and Spengler."
      *   *Problem:* Spengler is the *archetype* of cyclical history, not linear. He rejects linear progress.
