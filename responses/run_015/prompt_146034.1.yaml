  4.  **Deconstruct Point 3: "Recursive Institutional Blindness" vs. Path Dependence/Decay**
      *   *Path Dependence:* Usually means "history matters," early choices lock in later outcomes (QWERTY keyboard).
      *   *Corruption/Decay:* Moral or functional decline.
      *   *Recursive Blindness:* Second-order observation problem. The system cannot see the environment it depends on because its own structures filter the view.
      *   *Value Add:* Yes, it shifts from "they got greedy" (moral) or "they got stuck" (path dependence) to "their success mechanism prevented them from seeing the threat." It's a *constitutive* blindness, not just an accidental one.
      *   *Risk:* Is it just fancy language for "ideology"? Or "hubris"? Needs to be precise. It must be about the *institutional form* preventing observation, not just human error.

  5.  **Deconstruct Point 4: Collapsing Cyclical/Linear Distinction**
      *   *The Move:* It's not a circle (fate) or a line (progress), but a spiral of feedback loops defined by reflexive capacity.
