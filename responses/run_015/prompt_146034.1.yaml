      *(Re-evaluating Polybius)*: Polybius's *anacyclosis* is naturalistic. Is "institutional blindness" compatible? Polybius focuses on the *psychology* of the rulers (forgetting the struggle that brought them to power). This *is* a form of memory loss/blindness. So the framing holds, but needs to be careful not to over-systematize.

      *(Re-evaluating "Recursive Institutional Blindness")*: This sounds like Systems Theory (Luhmann). Is that anachronistic? Yes, but hermeneutically valid if admitted. The risk is making them sound like cyberneticists.

      *(Final Plan)*:
