  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to phrase things so each side nods.
      *   *Virtue Ethicist (VE):* Traits exist as stable dispositions, perhaps sensitive to context but integrated.
      *   *Situationist (S):* Traits are fragmented, highly sensitive to seemingly irrelevant situational variables.
