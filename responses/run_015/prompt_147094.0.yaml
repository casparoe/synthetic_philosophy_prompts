prompt: |-
  As a retired experimental physicist now working seriously in philosophy, I want to understand whether virtue ethics can survive the situationist challenge once we take seriously the replication crisis in social psychology. Please draft the joint statement that a committed Aristotelian virtue ethicist and a committed situationist could both sign after a good-faith adversarial collaboration. I want: (1) a numbered section of claims both sides accept about moral behavior, trait measurement, and the present state of replication; (2) a disagreements table with the precise formulations of their residual differences, each phrased so its own side would accept the wording of its view; (3) the cruxes—especially whether replication failures in classic situational paradigms (for instance, ego-depletion and obedience studies) weaken situationism or instead force virtue theory to retreat to domain-specific or locally stable traits; and (4) for each crux, one concrete empirical case or argument both agree bears on it, with each side’s explicit prediction about what that case shows. Use formal, precise prose throughout. If my framing rests on a confused premise—say, if the two sides do not in fact disagree empirically but only methodologically, so that an adversarial collaboration of this kind cannot be constructed—say so plainly and do not fabricate agreement.
