  5.  **Drafting - Section 3 & 4: Cruxes and Empirical Cases:**
      *   *Crux 1: The Interpretation of Replication Failures.*
          *   Does the failure of ego-depletion/obedience studies save virtue ethics (by removing evidence against traits) or hurt situationism (by removing evidence for situational power)?
