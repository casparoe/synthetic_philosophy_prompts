      *   *Crux 2: Local vs. Global Traits.*
          *   VE retreat to "local traits" (e.g., honesty-in-exam-settings). S argues this abandons the *unity of virtue* and makes virtue ethics trivial.
          *   *Case:* Hartshorne & May (Character Education Inquiry) - classic, but maybe too old. Let's use something modern. "Cheating paradigms" (e.g., matrix tasks).
          *   *VE Prediction:* Consistency will emerge when controlling for *morally relevant* features of the situation.
