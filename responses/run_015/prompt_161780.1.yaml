answer: |-
  1. **Drawn-figure premise:** Definitions are constructive specifications where the model generation procedure guarantees instantiation; the semantic gap is closed by procedural generation rather than correspondence.
  2. **Resolution and composition:** Verification proceeds by decomposition into atomic state variables and transitions, then proving system properties via compositional reasoning from these primitives.
  3. **Made-so-knowable:** The political system is a verified implementation where the architects possess full knowledge of the spec because they authored the requirements.
  4. **Nominalism:** Symbols are uninterpreted tokens; truth values are assigned via syntactic consistency within the logic, not semantic mapping to external types.
  5. **Fiat-termination:** The sovereign acts as the Trusted Computing Base (TCB) or oracle that resolves undefined behavior and halts specification ambiguity without further proof.
  6. **Author-inside-artifact:** The verification agents are embedded within the runtime environment they verify, creating a self-referential loop where authorization is delegated via proxy variables.
  7. **Wrinkle (Laws of Nature):** Obligations are conditional safety properties; they hold only under the assume-guarantee contract that the environment (other agents) satisfies compliance constraints.

  ### Residue Report

  **Claims that translate cleanly:**
  Claim 2 (Resolution) maps directly to compositional verification and modular decomposition. Claim 5 (Fiat-termination) aligns precisely with the concept of a Trusted Computing Base or an oracle that stops infinite regress in proof checking.

  **Claims that translate only with distortion:**
  Claim 1 (Drawn-figure) distorts construction into specification, importing the assumption that "drawing" is equivalent to "model generation" without accounting for physical error. Claim 4 (Nominalism) reduces ontology to syntax, losing the social conventionality of names in favor of formal uninterpreted tokens. Claim 6 (Author-inside) treats political embedding as a technical self-referential loop, obscuring the temporal discontinuity between founders and subjects. In each case, the translation imports a formalist assumption that structure equals substance.

  **Claims my vocabulary cannot express at all:**
  Normativity is the largest residue; verification handles validity and consistency, not obligation or moral force. The ontological status of "making" a commonwealth versus "specifying" it remains inexpressible; formal tools describe what *is* implemented, not why the implementation *binds* the implementers. The "ought" of the laws of nature becomes a conditional "if-then" without imperative force.

  ### Verdict

  The drawn-figure premise does not solve the knowledge problem; it relocates it from the semantics of geometry to an unnoticed idealization of what "drawing" comes to, assuming the constructor is perfect. The sovereign-as-TCB analogy strengthens the structural explanation of authority but quietly destroys Hobbes's normativity, since nothing in formal verification makes trust in a base anything but pragmatic rather than obligatory. Your framework explains the architecture of Hobbes's system but kills its force; you can verify the machine, but you cannot prove why anyone ought to run it.
