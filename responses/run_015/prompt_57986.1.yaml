  2.  **Deconstruct Good's Theorem:**
      *   Good's Theorem assumes the agent will *conditionalize* (update via Bayes' rule) on the new information.
      *   If the agent knows they will *not* conditionalize (e.g., they will update irrationally), the theorem's premises are violated.
      *   The decision to accept information is itself a decision made under uncertainty. The expected utility of accepting info depends on the *actual* future action taken after receiving info.
      *   If the future self acts suboptimally due to biased updating, the current self might prefer to bind themselves to ignorance.

