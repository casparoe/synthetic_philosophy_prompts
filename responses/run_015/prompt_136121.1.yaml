answer: |-
  Here's the sharp edge of the argument for your scene.

  The Lakoff guy (radial categories) is in trouble immediately. His model is gravitational. A category works because there's a heavy center—a prototype—that pulls everything else into orbit. You recognize a "cup" because it's close to the perfect idea of a cup. If you remove the center, you remove the gravity. The orbits don't just get weird; they vanish. There's no way to measure distance if there's no zero point. For him, a category without a prototype isn't a weird category; it's not a category at all. It's just a pile of unrelated stuff. He collapses fast because his structure is hierarchical. No king, no kingdom.

  The Wittgenstein guy (family resemblance) is messier, but he survives longer. His model isn't a solar system; it's a chain or a web. Things belong together not because they match a center, but because A overlaps with B, B with C, C with D. You don't need a thick rope in the middle; you just need the links to hold. If every example is "peripheral," Wittgenstein would say that "peripheral" is just a word you're using because you miss the center. If people are still using these edge-case examples to do things—to joke, to order drinks, to flirt—then the language-game is still active.

  Here's the crucial divergence on "use is meaning."

  For the Lakoff character, meaning is representational. It's about how well the example maps to the ideal. Strip the ideal, and the map is blank.

  For the Wittgenstein character, meaning is functional. It's about what the word *does*. If you strip away the central practices, you haven't necessarily left nothing; you've just changed the game. Maybe the category becomes hollowed out, ghostly, but if two people can still stand in a pub and successfully use the word to navigate their argument, the meaning holds. It's not that the category has no center; it's that the center is wherever the players are standing right now.

  However, there's a trap for Wittgenstein too. Family resemblance requires *overlap*. If every instance is so peripheral that A doesn't actually share anything recognizable with B, the chain snaps. But that's a practical break, not a structural one.

  So, who collapses quicker? Lakoff. His model is geometrically dependent on the center. Remove the sun, and the system flies apart instantly. Wittgenstein's model is topological. You can stretch the web, thin out the threads, make it all edges and no middle, and it still holds shape as long as the users keep pulling on the strings.

  The punchline for the scene: The Lakoff guy argues that without a center, you can't teach the concept to anyone new. The Wittgenstein guy counters that you never could anyway—you only ever showed them examples and hoped they caught the vibe. Without a center, learning gets harder, but without use, meaning dies. So the category without a center is just a language game played by insomniacs: weird, exhausted, but still a game.
