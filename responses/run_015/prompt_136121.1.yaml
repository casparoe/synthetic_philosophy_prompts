      *   The crux: Lakoff needs a gravity well. Wittgenstein needs a chain.
      *   If every example is peripheral: Lakoff's model breaks because "peripheral" implies a center. No center = no periphery = no category.
      *   Wittgenstein's model: If every example is unique but overlaps slightly with the next, it survives *structurally*. But pragmatically? If "use is meaning," and the use is fragmented, the meaning is fragmented. But it doesn't vanish. It becomes a dialect or a new game.
      *   Winner of "collapsing quicker": Lakoff. His model is geometrically dependent on the center. Wittgenstein's is topological/network-based.

  6.  **Refining for the Novel Scene (Tone & Density):**
      *   Needs to sound like pub talk, not a lecture.
      *   Use metaphors: Solar systems vs. chains vs. webs.
      *   Avoid jargon where possible, or use it naturally.
