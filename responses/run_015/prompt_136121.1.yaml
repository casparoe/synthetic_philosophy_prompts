      *   The "Use is Meaning" angle: If people are still playing these edge-case games, the meaning exists. The center is an illusion of hindsight.
      *   Conclusion: Lakoff collapses because he needs a gravity well. Wittgenstein survives but becomes ghostly—a language game played by ghosts where no one agrees on the rules but keeps passing the ball.

  8.  **Final Polish:**
