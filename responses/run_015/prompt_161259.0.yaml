          *   *Question 3: Fragility & Context.* When does competence fail? (The "debt comes due" idea). *Tractability:* High (case studies of AI failure/evolutionary mismatch). *Impact:* High (practical trust/safety).
          *   *Question 4: The Human Reflection.* Are we just competent without comprehension? *Tractability:* Medium (psych/neuro). *Impact:* High (existential/educational).

      *   *Ordering Defense:*
