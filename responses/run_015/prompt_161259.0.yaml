          4.  Evidence Triggers & Sources.
          5.  Implications Audit (Keep/Cut).
          6.  Register Check (Settled vs. Contested).

      *   *Refining the "Displacement Thesis" Critique:* I need to be careful not to kill the series hook. It's a good hook. But I must warn that "Conservation of Comprehension" is the weak link. It's better to frame it as "The Locus of Comprehension."
      *   *Refining the Questions:*
          1.  **The Boundary:** Where does competence end and comprehension begin? (Operationalizing the distinction).
          2.  **The Source:** Does intelligence require an intelligent ancestor? (Darwin vs. Turing vs. Emergence).
          3.  **The Stress Test:** Does comprehension buy robustness? (The value proposition of understanding).
          4.  **The Mirror:** Are humans competent without comprehension? (The existential payoff).

      *   *Piece Allocation:*
          *   Q1: Pieces 1 & 2.
