      *   **Current Framing:** "Displacement Thesis" (comprehension is relocated upstream, not eliminated). Related ideas: Acquisition vs. Execution intelligence; Collective/Distributed comprehension.
      *   **Candidate Questions:** Distinction validity (competence cluster?), Darwin vs. Turing linkage, Discriminating evidence, Reflexivity (human tacit knowledge), Implications (journalism, education, trust, human worth).
      *   **Desired Output:** An agenda (3-4 core questions), ordered, with defense of ordering. Criteria: Tractability via reporting, impact on reader belief/action, dependency (does Q2 need Q1?), novelty (not well-covered).
