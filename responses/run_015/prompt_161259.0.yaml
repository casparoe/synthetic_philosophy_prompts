      *   *Weaknesses/Risks:* It risks being tautological (if there's competence, *someone* must have understood *sometime*). It might beg the question against emergentism (can comprehension *arise* from non-comprehending parts without an upstream compressor?). It assumes a conservation of "understanding" which isn't a physical law.
      *   *Expert Consensus:* Dennett supports it. Connectionists/Emergentists might push back (understanding as a scale property, not a conserved quantity). AI safety researchers worry about "alignment" precisely because upstream comprehension (programmers) doesn't guarantee downstream alignment.
      *   *Verdict:* It's a good *working hypothesis* for the series, but Piece 1 must stress-test it, not just assert it. It shouldn't be the *conclusion*, but the *lens*.

  3.  **Select and Order the Core Questions (The Agenda):**

      *   *Goal:* 6 pieces, 3-4 core questions.
      *   *Constraint:* Must be answerable via reporting/argument, not lab work.
      *   *Constraint:* Must matter to the reader (implications).

      *   *Drafting the Arc:*
