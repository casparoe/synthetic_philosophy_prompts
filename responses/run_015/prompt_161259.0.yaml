  8.  **Final Review against Constraints:**
      *   Did I answer "Which 3-4 questions?" Yes.
      *   Did I defend the ordering? Yes.
      *   Did I specify criteria/trade-offs? Yes.
      *   Did I specify evidence triggers? Yes.
      *   Did I critique the implications? Yes.
      *   Did I address the register/expert survival? Yes.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm assigning homework. I'm advising an editor/writer. Keep the tone collaborative but critical. Ensure the "Displacement Thesis" critique is prominent because the writer asked for it specifically ("If you think the framing is the problem, say so").

      *Key Insight on Displacement Thesis:* It risks being unfalsifiable. If a system shows "understanding," the thesis says "ah, but it was in the training data." If it fails, "ah, no understanding." To make it journalistic, we need a case where the upstream source is *known* to lack the specific comprehension, yet the system exhibits it (Emergence), OR where the upstream source has it, and the system fails (Brittleness). The series needs to hunt for these cases.

      *Let's finalize the 4 Questions:*
