  4.  **Critique the Framing (Displacement Thesis):**

      *   *Risk:* It assumes a "Conservation of Understanding." This is contested. Emergentists argue understanding *emerges* at scale without a specific upstream locus (e.g., a brain's understanding isn't in the neurons, nor the parents, but in the network structure).
