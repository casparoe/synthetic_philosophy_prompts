          *   Implications (Journalism/Policy) should be woven throughout or a capstone, but the prompt asks for *questions the series is built around*. I will integrate implications into Q3 and Q4 rather than making a standalone "policy" piece which can be dry. Actually, a dedicated piece on "What do we tell the public?" is strong for a science writer commission. Let's make Q4 about *Us* and Q5/6 about *Society*.
          *   *Revised Arc:*
              1.  Definition (Is the distinction real?)
              2.  Origin (Displacement Thesis: Darwin vs. Turing)
              3.  Limits (Fragility/Environment shift)
              4.  Reflexivity (Human cognition)
              5.  Responsibility (Trust/Alignment/Journalism)
              6.  Synthesis (What is understanding worth?)

      *   *Wait, the prompt asks for 3-4 questions to build the series around.* I should group the 6 pieces under these umbrellas.
      *   *Selection:*
          1.  **The Definition Question:** Is comprehension just hidden competence?
          2.  **The Provenance Question:** Must understanding exist upstream? (Displacement Thesis).
          3.  **The Fragility Question:** When does competence break, and does comprehension fix it?
