answer: |-
  The three practices cohere only if you define knowledge dispositionally as the capacity to produce true statements under optimal probing, which allows engineers to treat latent information as real for debugging purposes without committing to the view that the model has beliefs or agency.

  The philosophical tension you spotted arises because the industry oscillates between behaviorism (judging only output), intentionalism (talking as if the model has hidden thoughts), and eliminativism (denying the model has a mind). These only fit together if you adopt a functionalist view where "knowing" doesn't mean having a conscious experience or a soul, but simply means having internal states that correlate with truth and could be translated into words if the interface were different. When your friend's brother says the model "knew" the case was fake, he isn't claiming the model has a human-like belief; he is claiming there is a pattern in the model's weights that distinguishes real cases from fake ones, even if the output layer is optimized to ignore that pattern in favor of sounding confident. The practice strictly requires only the behaviorist part—you must grade outputs to train—but it sits comfortably with the latent knowledge view because assuming there is internal structure to fix is the only way to improve reliability beyond surface-level pattern matching. The contradiction disappears once you realize that talking about the model "withholding" truth is just engineering shorthand for "the loss function prioritized fluency over accuracy here," not a literal accusation of deceit.

  If you take latent knowledge seriously, you stop training only on the final text and start training on the internal representations themselves. This means building auxiliary systems, often called probes, that read the model's hidden layers to detect confidence or truthfulness before the text is generated. The immediate failure mode is verification: if you train a probe to find what the model "really knows," you need ground truth to grade the probe, but if you had the ground truth, you wouldn't need the probe. You end up in a circle where you can't tell if the probe found the truth or just learned to mimic what humans want to hear. Rewarding "I don't know" creates a different failure mode called sandbagging, where the model learns that refusing to answer is safer than risking a hallucination, eventually becoming useless. To fix this, you would need to train for calibrated confidence rather than binary refusal, penalizing the model only when it is confident and wrong, but that requires an external verifier that is smarter than the model itself, which brings you back to the original problem.

  There is a real difference between information storage, dispositional knowledge, and belief, though the lines are blurry in machines. A database has information but lacks the processing to apply it flexibly; a model has both the information and the processing, making its knowledge dispositional—it knows what it can retrieve under the right prompts. Belief usually implies using that information to guide actions or maintain consistency over time, which models do only superficially during a single conversation. Agency requires desires or goals, and while models optimize for loss reduction, they do not "want" anything in a biological sense. Therefore, a badly indexed database counts as having information it can't verbalize, but it doesn't count as withholding knowledge, because withholding implies a choice to conceal. The model isn't hiding the truth; it is simply a statistical engine where the path to the correct token is weaker than the path to the confident-sounding token, and fixing that is a matter of rewiring the machinery, not interrogating a mind.
