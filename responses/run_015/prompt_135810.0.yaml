  hey, I'm a junior and I've been going back and forth on this with my friends for like a month and I need someone to actually sort it out. Here's the setup as I understand it: chatbots get trained by humans rating the answers that come out, and the confident, complete-sounding answers get rated higher than the hedgy ones, so the model basically learns not to admit it's guessing, or learns to admit it in all the wrong places. Then it invents a court case that doesnt exist and everybody calls it a hallucination, and my freind's brother who works in ML said the model "knew" it was guessing — that the fact that it had no idea was in there somewhere, it just couldnt put it into words, and he called it latent knowledge, and said there's a whole thing about trying to get AIs to report what they really "know" instead of what sounds good to a grader.

  what I can't get straight is that we seem to do three things that don't obviously fit together. We train and score these systems only on the words that come out, never on whatever is happening inside them. But then when something goes wrong we talk exactly as if the system knew better and withheld it, or should have told us "I don't know" and didn't. And at the same time a lot of the same people will say the model has no beliefs at all and that anything it says about itself is worthless, so there's no point asking it. So: what does that whole package presuppose about what knowing something even is? Does it force you into the view that knowing is a matter of what you'd say under some better prompt or some weirder kind of question — like a filing cabinet with the right document in it but a broken index — or is the practice also completely fine with the hard version where there's nothing inside at all and nothing to elicit? Please pull those three things apart for me: which one is doing the real philosophical work, do they actually contradict each other or is there one view of knowledge on which all three make sense together, and which parts does the practice strictly require versus just sit comfortably with.

  And then the practical half: if you did take seriously the idea that a system can have knowledge it can't say, what would have to change about how we build, train and grade these things — letting them abstain, paying them for saying "I don't know," training a second system to translate the first one's insides into sentences, whatever — and what goes wrong with each, because my guess is that if you start rewarding "I don't know" you just get a model that says it always or says it in the wrong spots, and that you can never check whether the thing you extracted was really there or whether the extractor made it up. Also is there even a real difference between "the information is in the model somehow," "it would come out if you asked differently," and "the model's internals are genuinely playing the role of a belief," or is that three ways of saying the same thing? And last one: does a thing have to be an agent that wants something to be the kind of thing that can have knowledge it can't verbalize, or does a badly indexed database count already?

  Put your actual answer — the one-sentence bottom line — in the very first sentence, then give me the reasoning after it. Don't open with "great question" or any version of "this is a deep issue," don't restate what I asked back at me, and please don't tell me to go read a paper: I have no way of getting at academic articles and I don't want a list of researchers or titles anyway, I want your argument.
