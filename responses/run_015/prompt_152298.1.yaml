prompt: |-
  I'm writing a feature on how institutions encode philosophy without noticing it. One practice puzzles me: government agencies, universities, and technology consortia regularly embed the phrase "Western values" into partnership contracts, funding criteria, accreditation standards, and ethics guidelines—treating it as though it named a specific, bounded normative package with clear membership conditions. The phrase is almost always left undefined in the document, yet its invocation is meant to do real administrative work: excluding certain collaborations, licensing particular governance models, or marking a boundary around acceptable belief and practice. At the same time, the inventory shifts by institutional context—sometimes secularism and gender equality are included, sometimes market liberalism is included, sometimes neither is; many of the same norms are vigorously defended in societies not conventionally labeled Western; and historical practices widely recognized as Western included precisely the violations now cited as departures from these values. What philosophical commitments about value, culture, and normativity does this institutional practice presuppose? Reconstruct the implicit theory that makes it intelligible to write "Western values" into a binding clause. Say whether the practice strictly requires that moral norms are geographically indexed properties, or whether it is compatible with universalist moral theories that merely use the phrase as rhetorical shorthand. Examine whether it presupposes a form of cultural essentialism, a claim about pragmatic tractability, or a covert theory of moral progress tied to place. Distinguish what the practice strictly requires from what merely fits it well, and note where it is philosophically underdetermined—so that several rival theories could license the same contractual language. Then tell me what the institution would actually have to change, both administratively and conceptually, if it dropped the geographic label and replaced it with an explicit, itemized list of norms. After your analysis, provide a brief structured summary as a JSON object with these exact fields: "implicit_theory_of_value", "cultural_ontology", "geographic_indexing_role", "compatible_with_universalism", "required_administrative_changes", and "remaining_ambiguities".
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Topic:** Institutional use of the phrase "Western values" in binding documents (contracts, funding, accreditation, ethics).
      *   **Observation:** The phrase is undefined but performs administrative work (exclusion, licensing, boundary-marking). The content varies by context, overlaps with non-Western societies, and contradicts historical Western practices.
      *   **Task:** Reconstruct the implicit philosophical theory making this intelligible.
      *   **Specific Questions to Address:**
          *   Does it require moral norms to be geographically indexed?
          *   Is it compatible with universalism (as shorthand)?
          *   Does it presuppose cultural essentialism, pragmatic tractability, or a theory of moral progress tied to place?
          *   Distinguish between what is *strictly required* vs. what *fits well* vs. what is *underdetermined*.
          *   What administrative/conceptual changes would occur if replaced by an explicit list?
      *   **Output Format:** Analytical essay followed by a specific JSON summary.

  2.  **Initial Brainstorming & Philosophical Mapping:**
      *   *The Phrase:* "Western values" acts as a *cluster concept* or a *family resemblance* term (Wittgenstein). It functions as a *dog whistle* or a *shibboleth* in bureaucracy.
      *   *Ontology:* It treats culture as a reified entity (Cultural Essentialism/Reification). It assumes a link between geography/history and normativity (Geographic Indexing).
      *   *Normativity:* It implies that legitimacy comes from lineage or tradition, not just rational justification.
      *   *Universalism vs. Relativism:* If values are universal, why call them "Western"? If they are relative, why enforce them? It suggests a *particularist universalism* (our particular history discovered universal truths).
      *   *Administrative Function:* It reduces transaction costs (shorthand) but increases ambiguity (legal risk/bias).
      *   *Replacement:* Moving to an explicit list shifts power from interpreters to drafters, increases transparency, but loses the "civilizational" weight.

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the phenomenon. It's a "performative utterance" in the bureaucratic sense.
      *   **Implicit Theory of Value:**
          *   *Genealogical Justification:* Values are valid *because* they emerged from a specific historical trajectory (Enlightenment, etc.), not just because they are rational.
          *   *Cluster Concept:* No necessary and sufficient conditions, but a family resemblance.
      *   **Cultural Ontology:**
          *   *Reification:* Treats "The West" as a coherent agent with a will/value system. This is essentialism.
          *   *Diachronic Continuity:* Assumes modern institutions inherit the moral status of past "Western" entities, ignoring historical contradictions (e.g., colonialism vs. human rights).
      *   **Geographic Indexing:**
          *   *Strict Requirement:* Does it *require* norms to be geographic? Not necessarily metaphysically, but *administratively* yes. It uses geography as a proxy for compliance.
          *   *Universalism Compatibility:* Yes, compatible if viewed as "Values discovered in the West but applicable everywhere." However, the *labeling* undermines pure universalism by implying ownership.
      *   **Essentialism vs. Pragmatism vs. Progress:**
          *   *Essentialism:* Strongly implied. "Western" has an essence.
          *   *Pragmatism:* It saves time. "You know what we mean."
          *   *Progress:* Implicitly suggests the West is the vanguard of moral evolution.
      *   **Underdetermination:**
          *   The text doesn't say *which* theory is true. A realist, a pragmatist, and a historicist could all use the phrase for different reasons.
      *   **Administrative/Conceptual Changes (The Swap):**
          *   *Conceptual:* Shift from *identity-based* compliance to *principle-based* compliance.
          *   *Administrative:* Need for adjudication mechanisms. No more "gut check" on cultural fit. Increased litigation risk (ambiguity shifts from meaning to application). Loss of diplomatic flexibility.

  4.  **Refining the Philosophical Nuance:**
      *   *Geographic Indexing:* I need to be careful here. The practice doesn't strictly *require* the metaphysical claim that morality is *created* by geography, but it requires the *operational* claim that geography is a reliable *indicator* of moral alignment.
      *   *Universalism:* It's compatible with a "discovery" model of universalism (we found them first), but incompatible with a "neutral reason" model (why label them?).
      *   *Essentialism:* This is the strongest presupposition. It treats culture as a bounded object.

  5.  **Drafting the "What Would Change" Section:**
