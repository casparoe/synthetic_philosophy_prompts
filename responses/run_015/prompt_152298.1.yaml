          *   *Administrative:* Audits become checklist-based, not cultural-assessment-based.
          *   *Political:* Harder to exclude partners who share the values but aren't "Western" (e.g., Japan, Costa Rica). Harder to include partners who are "Western" but violate specific listed norms.

  6.  **Constructing the JSON:**
