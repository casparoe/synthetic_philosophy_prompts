  ## 9. Conclusion

  This independent study proposes a novel engagement with one of the most famous theorems in political economy. By challenging the assumption of global comparability, I aim to show that Arrow's Impossibility Theorem is not a statement about the impossibility of democracy, but a statement about the impossibility of *forced comparability*.

  If my friend is right that the theorem never bites real groups, it may be because real groups intuitively understand that some things cannot be compared. They muddle through with incomplete preferences. However, if my hypothesis is correct, the "bite" of the theorem is hidden in the institutional design—specifically in the rules that force committees to produce a single winner. By making these trade-offs explicit through a "Framed" model, we can design better systems. We might find that the best voting system is one that admits it cannot rank everything, outputting a set of viable options rather than a false single winner.

  Whether the study ends in a possibility theorem or a new impossibility proof, the result will clarify the boundary between logical constraints and cognitive reality. It will demonstrate that social choice theory remains a vital tool for diagnosing the friction points in collective decision-making. The proposed timeline is aggressive but manageable, provided I stick to the finite, discrete scope and avoid drifting into generalized topology. The combination of formal rigor and empirical grounding ensures that the final paper will be relevant to both theorists and practitioners of institutional design.

  This proposal represents a commitment to rigorous inquiry. I will maintain weekly logs of my modeling progress to ensure I do not get stuck on a single proof path. I will meet with the supervisor bi-weekly to review the axiom definitions, as precision there is critical. By the end of the semester, I will have a definitive answer to the question: Does incommensurability save us from dictatorship, or does it just hide the dictator in the fine print?

  ## 10. Detailed Axiomatic Specification (Appendix for Clarity)

  *Note: This section expands on Section 4 to ensure the mathematical precision required for the study is clear before commencement.*

  To guarantee the study remains on track, I will adhere to the following specific mathematical constraints during the modeling phase:

  **10.1. The Structure of Frames**
  I will treat Frames as partitions of the criteria space, not necessarily partitions of the alternative space. An alternative $x$ has a vector of attributes $(x_1, \dots, x_k)$. Frame $j$ allows comparison based on attribute $j$.
  *   *Constraint:* I will assume $k \geq 2$. If $k=1$, the problem collapses to standard single-dimension voting.
  *   *Constraint:* I will assume all voters share the same Frames. (Allowing voters to have different frames adds too much complexity for one semester).

  **10.2. The Aggregation Operator**
  I will focus on two specific operators for the initial testing:
  *   **Operator A (Intersection):** $x$ is socially chosen only if $x$ is not dominated in *any* frame. (This tends to produce large choice sets).
  *   **Operator B (Lexicographic):** Frames are ordered $1 \dots k$. Frame 1 decides unless there is a tie, then Frame 2 decides. (This is the baseline for "Frame Dictatorship").

  **10.3. Defining the "Dictator"**
  In this framed context, a Dictator is defined in two ways:
  1.  **Voter Dictator:** Voter $i$'s local preference in *any* frame determines the social choice, overriding all other voters in that frame.
  2.  **Frame Dictator:** Frame $j$ determines the social choice regardless of preferences in other frames.
  The study seeks a rule that avoids *both*.

  **10.4. The "Tie" Problem**
  A major technical hurdle is the definition of the output. If the model outputs a set $S$ with $|S| > 1$, is this a failure of Decisiveness?
  *   *Decision:* For the purpose of this study, I will treat $|S| > 1$ as a valid "indeterminate" outcome, provided $S \neq X$ (total indecision). This allows me to explore whether the impossibility is driven by the demand for a *unique* winner. If the impossibility vanishes when we allow $|S| > 1$, that is a significant finding (supporting the idea that we should stop demanding single winners).

  **10.5. Computational Verification**
  To assist the formal proof, I will write a simple Python script to enumerate all possible preference profiles for small $n$ and $m$ (e.g., $n=3, m=3, k=2$). The script will test whether my proposed aggregation rules satisfy the axioms exhaustively for these small cases. This computational check will serve as a sanity check before I attempt general logical proofs. This ensures I don't spend weeks trying to prove a theorem that is false for $n=3$.

  By adhering to these specific constraints, the study remains bounded. The computational verification is a key feasibility safeguard. If the Python script finds a counter-example to my possibility hypothesis in the small case, I know immediately that the general theorem will not hold, and I can pivot to characterizing the failure mode (Hypothesis 2).

