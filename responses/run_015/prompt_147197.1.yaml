answer: |-
  # Proposal for Independent Study: Framed Rationality and the Limits of Social Choice

  **Student Name:** [Your Name]
  **Course:** Independent Study in Political Economy / Formal Logic
  **Semester:** [Season/Year]
  **Supervisor:** [Supervisor Name]

  ## Abstract

  This proposal outlines a one-semester independent study investigating the robustness of Arrow's Impossibility Theorem under conditions of "framed" preference incompleteness. Standard social choice theory assumes that individual voters possess complete, transitive preference orderings over all possible social states. In reality, human decision-making is often context-dependent; voters may hold clear preferences within specific evaluative frames (e.g., economic efficiency vs. social equity) but find comparisons across these frames genuinely incommensurable. This study proposes a formal model where the Universal Domain and Completeness axioms are replaced by a "Localized Comparability" condition. The primary research question is whether a non-dictatorial aggregation rule can exist when social choice is derived from these fragmented, frame-specific preferences, or if the impossibility result merely re-emerges at the stage of frame aggregation. The methodology combines formal axiomatic modeling with testing against two real-world committee decision protocols. The study aims to determine whether relaxing the completeness assumption offers a viable escape from Arrow's theorem or if it simply shifts the burden of dictatorship to a higher level of abstraction.

  ## 1. Introduction and Motivation

  The debate surrounding Arrow's Impossibility Theorem often bifurcates into two camps. On one side are the formalists who view the theorem as a fundamental logical limit on democratic aggregation, proving that no voting system can satisfy a set of seemingly reasonable criteria without becoming dictatorial. On the other side are pragmatists, like my colleague in a recent debate, who argue that the theorem is a "logic puzzle" that rarely bites real-world groups. The pragmatist argument suggests that real groups never encounter the specific profile configurations required to trigger the impossibility, or that they rely on informal norms that bypass the formal constraints.

  I argue that the pragmatist view is partially correct but for the wrong reason. The theorem does not fail because real groups are lucky; it fails because the premises of the theorem do not accurately describe human cognition. Specifically, Arrow's theorem relies on the assumption that every voter can compare every pair of alternatives globally. This is the axiom of **Completeness**. In complex decisions—such as hiring a faculty member, selecting an architectural design, or allocating a public budget—voters often operate within distinct "frames." A voter might be able to rigorously compare Candidate A and Candidate B on *research output*, and compare them on *teaching ability*, but refuse to assert a global preference because the criteria are incommensurable. They cannot say A is better than B overall; they can only say A is better on dimension 1, and B is better on dimension 2.

  If preferences are not complete orderings but rather a collection of local orderings within frames, the mathematical structure of the problem changes. Arrow's theorem technically does not apply to incomplete preferences because the domain is restricted. However, a society still needs to make a decision. We cannot simply say "no choice is possible." We need an aggregation rule that takes these fragmented inputs and produces a coherent output. The critical question is whether constructing such a rule inevitably reintroduces a dictator, perhaps not over the alternatives directly, but over the *weighting of the frames*.

  This independent study proposes to formalize this intuition. By replacing the standard axioms of Universal Domain and Completeness with a "Localized Comparability" axiom, I will explore whether a possibility theorem can be proven. This is not merely a theoretical exercise; it has direct implications for the design of committee charters, legislative voting procedures, and algorithmic governance systems. If the impossibility result holds even under framed rationality, it suggests that conflict is inherent to collective decision-making regardless of how we structure the voting. If the result dissolves, it suggests that acknowledging cognitive limits and incommensurability is the key to designing robust democratic institutions.

  The scope of this study is limited to one semester. Therefore, I will avoid advanced topological social choice theory or infinite set analysis. The focus will remain on finite sets of voters and alternatives, using discrete mathematics and logic sufficient for an advanced undergraduate or early graduate level. The goal is to produce a working paper that either presents a new possibility theorem or rigorously demonstrates why the impossibility persists in this modified framework.

  ## 2. Literature Context and the Gap

  To understand the contribution of this study, one must first locate it within the existing landscape of social choice theory. The foundational work by Kenneth Arrow established the conditions under which a social welfare function fails. The critical axioms are Universal Domain (any logical preference profile is allowed), Pareto Efficiency (if everyone prefers X to Y, society prefers X to Y), Independence of Irrelevant Alternatives (social ranking of X and Y depends only on individual rankings of X and Y), and Non-Dictatorship. Arrow proved that no function satisfies all four for three or more alternatives.

  Subsequent literature has attempted to escape this impossibility by restricting the domain of preferences. The most famous example is the restriction to "Single-Peaked Preferences," associated with Duncan Black and later Median Voter Theorems. If voters' preferences align along a single spectrum (like a left-right political axis), majority rule works perfectly and satisfies Arrow's conditions. However, this requires a strong assumption about the structure of the alternatives themselves, which does not always hold in multi-dimensional decisions like budget allocation or hiring.

  Amartya Sen expanded the framework to handle incomplete preferences. Sen argued that requiring completeness is too demanding and that social choice can function with quasi-transitive or acyclic relations. His work on "Social Choice and Individual Values" and later capabilities approach acknowledges that people may not be able to compare all states. However, Sen's work often focuses on the ethical implications of incompleteness or treats it as a general property of the preference relation.

  The gap this study addresses is the specific structure of *framed* incompleteness. Standard models of incomplete preferences treat the missing comparisons as random or arbitrary gaps. In contrast, the "framed" approach posits that the gaps are structural. A voter does not lack an opinion between Alternative A and Alternative B because they are ignorant; they lack it because A and B are being evaluated on different criteria that the voter refuses to trade off. For example, in an environmental committee, a member might refuse to compare "cost savings" against "species extinction" on a single scale. They have a complete ordering within the "Economic Frame" and a complete ordering within the "Ecological Frame," but no global ordering that combines them.

  Current social choice literature leaves this open because it typically insists on a global social ordering as the output. If the input is fragmented, standard theory often views this as a failure of rationality to be corrected, rather than a feature to be modeled. By treating frames as the primary unit of analysis, this study moves closer to behavioral economics and multi-criteria decision analysis (MCDA) while retaining the rigorous axiomatic approach of political economy.

  The specific niche for this proposal is the transition from individual framed preferences to a collective decision. While MCDA literature discusses how to weight criteria, it often assumes a single decision-maker. Social choice discusses multiple decision-makers but assumes global preferences. This study bridges the two: multiple decision-makers with local, framed preferences. The question is whether the aggregation of *frames* across voters creates a new bottleneck for dictatorship.

  ## 3. Research Question and Hypotheses

  The central research question for this semester is: **Does an impossibility result analogous to Arrow's Theorem hold when individual preferences are defined as a set of transitive orderings over localized frames, rather than a single global ordering?**

  To answer this, I will test two competing hypotheses.

  **Hypothesis 1 (The Possibility Hypothesis):** Relaxing the Completeness axiom via Localized Comparability allows for the construction of a non-dictatorial aggregation rule. Because voters are not forced to compare incommensurable alternatives, the cycles that typically generate Arrow's impossibility (Condorcet cycles) cannot form in the same way. The social choice function can remain indecisive on cross-frame comparisons without violating rationality, thus avoiding the need for a dictator to break ties.

  **Hypothesis 2 (The Re-emergence Hypothesis):** The impossibility result persists but shifts location. While there may be no dictator over the alternatives directly, a "meta-dictator" emerges who effectively determines the weighting or priority of the frames. For example, if the aggregation rule must produce a single winner, it must implicitly prioritize the "Budget Frame" over the "Aesthetic Frame" in cases of conflict. If this prioritization is fixed, it violates neutrality. If it is voted upon, it invites a new cycle of impossibility at the frame level.

  **Sub-Question:** Can we define a "Frame-Independence" axiom that prevents the aggregation rule from manipulating how frames interact, similar to how IIA prevents manipulation of alternatives?

  **Sub-Question:** Do real-world committee protocols implicitly solve this by ignoring one frame, using a lexicographic order, or relying on a chairperson's tie-breaking power (soft dictatorship)?

  The study will not attempt to solve the general case for infinite sets. It will focus on finite sets ($n$ voters, $m$ alternatives, $k$ frames) to determine if a counter-example to the impossibility can be constructed.

  ## 4. Methodology: Formal Framework

  The core of this study is the construction of a formal model. This section details the definitions and axioms that will replace the standard Arrowian framework. I will avoid topological methods and rely on set theory and order relations.

  ### 4.1. Basic Definitions

  Let $V = \{1, \dots, n\}$ be a finite set of voters, where $n \geq 2$.
  Let $X$ be a finite set of alternatives, where $|X| \geq 3$.
  Let $K = \{1, \dots, k\}$ be a finite set of **Frames**. A frame represents a criterion or a context of evaluation (e.g., Cost, Quality, Ethics).

  **Definition 1 (Local Preference Relation):**
  For each voter $i \in V$ and each frame $j \in K$, let $\succeq_{i,j}$ be a binary relation on a subset $X_j \subseteq X$.
  We assume that for a given frame $j$, the relation $\succeq_{i,j}$ is:
  1.  **Reflexive:** $x \succeq_{i,j} x$ for all $x \in X_j$.
  2.  **Complete (within frame):** For all $x, y \in X_j$, either $x \succeq_{i,j} y$ or $y \succeq_{i,j} x$.
  3.  **Transitive (within frame):** For all $x, y, z \in X_j$, if $x \succeq_{i,j} y$ and $y \succeq_{i,j} z$, then $x \succeq_{i,j} z$.

  **Definition 2 (Global Incompleteness):**
  The voter's global preference $\succeq_i$ is the union of their local preferences. Crucially, if $x \in X_a$ and $y \in X_b$ where $a \neq b$, and there is no defined bridge rule, then $x$ and $y$ are **incommensurable** for voter $i$. We denote this as $x \not\succeq_i y$ and $y \not\succeq_i x$.

  **Definition 3 (Social Choice Function):**
  A function $F$ that maps a profile of local preference relations $\{\succeq_{i,j}\}$ to a social choice set $S \subseteq X$. Unlike Arrow's Social Welfare Function which outputs a ranking, this function outputs a non-empty set of winners (a choice set). This relaxation is necessary because demanding a complete social ranking from incomplete individual inputs is mathematically coercive.

  ### 4.2. Modified Axioms

  To test the hypotheses, I will propose a modified set of axioms. The goal is to see if a function $F$ exists that satisfies all of them.

  **Axiom 1: Localized Universal Domain.**
  The domain of $F$ includes all possible profiles of local preference orderings. Voters are free to have any transitive ordering within a frame, and they are free to find frames incommensurable. There is no requirement that a voter must be able to compare an element from Frame 1 to an element from Frame 2.

  **Axiom 2: Frame-Pareto Efficiency.**
  If for a specific frame $j$, all voters $i \in V$ strictly prefer $x$ to $y$ (i.e., $x \succ_{i,j} y$), and $x, y$ are both evaluable within frame $j$, then $y$ cannot be in the social choice set $S$.
  *Note:* This is weaker than standard Pareto. It only applies when the comparison happens within a shared frame. If voters prefer $x$ on "Cost" but prefer $y$ on "Quality," there is no Pareto violation if $y$ is chosen.

  **Axiom 3: Frame-Independence (Modified IIA).**
  The social choice regarding alternatives $x$ and $y$ should depend only on the individual preferences regarding $x$ and $y$ *within the frames where both are comparable*. If $x$ and $y$ are never in the same frame for any voter, the social choice between them must be determined by a neutral rule (e.g., random selection or status quo) rather than by preferences on a third alternative $z$.
  This prevents the aggregation rule from using "irrelevant" cross-frame comparisons to force a ranking.

  **Axiom 4: Non-Dictatorship (Local).**
  There is no voter $i$ and no frame $j$ such that for all profiles, if $x \succ_{i,j} y$, then $y \notin S$ (regardless of other voters' opinions in that frame).
  *Refinement:* We must also check for **Frame Dictatorship**. There should be no single frame $j$ that always dominates the decision. For example, if the rule always chooses the alternative that wins on "Cost" regardless of "Quality," then the "Cost Frame" is a dictator.

  **Axiom 5: Decisiveness.**
  The function $F$ must produce a non-empty choice set $S$ for every profile. The system cannot simply return "no decision" when frames conflict.

  ### 4.3. The Modeling Task

  The mathematical work of the semester will involve attempting to construct a function $F$ that satisfies Axioms 1-5.

  **Step 1: The Voting Rule.**
  I will test a "Frame-Aggregation" rule.
  1.  Within each frame $j$, aggregate preferences using a standard method (e.g., Borda Count or Pairwise Majority) to find a local winner $w_j$.
  2.  Aggregate the local winners $\{w_1, \dots, w_k\}$ into a global winner.

  **Step 2: The Conflict Check.**
  The critical moment is Step 2. If $w_1 \neq w_2$, how do we choose?
  *   *Option A (Lexicographic):* Frame 1 always beats Frame 2. (Violates Non-Dictatorship of Frames).
  *   *Option B (Meta-Voting):* Voters vote on which frame matters more. (Risk of infinite regress or cycles).
  *   *Option C (Union):* The social choice set includes all local winners $\{w_1, \dots, w_k\}$. (Violates Decisiveness if we need a single winner, but acceptable if we allow a tie).

  **Step 3: Impossibility Proof Attempt.**
  If Option C is chosen (allowing ties), does this satisfy the axioms? It satisfies Non-Dictatorship. It satisfies Localized Domain. But does it satisfy Frame-Independence? If the set of winners changes based on how frames are defined, it might violate independence.
  I will attempt to prove that if we demand a *single* winner (strict Decisiveness), we violate Non-Dictatorship. This would confirm Hypothesis 2.

  ## 5. Methodology: Empirical Testing

  Formal modeling can sometimes drift into abstraction that loses touch with the "real groups" argument my friend made. To ground the study, I will test the formal model against two actual committee decision protocols. This qualitative-quantitative hybrid approach will show whether the "framed" model describes reality better than the standard Arrowian model.

  ### 5.1. Case Study 1: University Hiring Committee

  **Context:** A department hiring committee evaluating three final candidates (A, B, C).
  **Frames:**
  1.  **Research:** Publication count, journal prestige.
  2.  **Teaching:** Student evaluations, teaching philosophy.
  3.  **Service:** Committee work, community engagement.

  **Data Collection:**
  I will interview 3-5 faculty members who have served on such committees. I will not ask them "Who do you prefer?" Instead, I will ask for their ranking within each frame.
  *   "Rank A, B, C by Research."
  *   "Rank A, B, C by Teaching."
  *   "Can you compare Candidate A's Research to Candidate B's Teaching?" (Expected answer: No/Incommensurable).

  **Protocol Analysis:**
  I will examine the committee's charter. How do they aggregate?
  *   Do they use a scoring matrix (which forces commensurability by assigning points)?
  *   Do they discuss until consensus (which often hides the frame conflict)?
  *   Does the Chair have a tie-breaker?

  **Application of Model:**
  I will input the collected local rankings into the formal model developed in Section 4.
  *   *Scenario:* Candidate A wins Research. Candidate B wins Teaching. Candidate C wins Service.
  *   *Observation:* How did the real committee resolve this?
  *   *Comparison:* Did the resolution match the "Frame Dictatorship" prediction? (e.g., Research universities implicitly let the Research frame dictate). Or did they use a "Union" approach (hiring two people)?

  This case study tests whether real-world groups implicitly acknowledge incommensurability or force false comparability. If they force comparability (e.g., by arguing "Research is 50% of the score"), they are artificially satisfying Arrow's Completeness axiom, which might explain why they experience conflict or dissatisfaction.

  ### 5.2. Case Study 2: Urban Planning Advisory Board

  **Context:** A city board selecting between three park design proposals.
  **Frames:**
  1.  **Budget:** Construction and maintenance costs.
  2.  **Aesthetics:** Visual appeal, design awards.
  3.  **Accessibility:** ADA compliance, ease of access for residents.

  **Data Collection:**
  Review of public meeting minutes from a recent selection process. I will look for explicit statements of trade-offs.
  *   Search for phrases like "We can't compare cost to beauty."
  *   Search for "We must prioritize budget."

  **Protocol Analysis:**
  Many planning boards use a weighted scoring rubric. This is a critical test case. A rubric *forces* completeness. It says 1 point of Aesthetics = $100 of Budget.
  I will analyze if the rubric weights were contested. If the weights were fixed by statute, that is an external dictatorship (the law dictates the frame weights). If the board voted on the weights, that is a meta-vote.

  **Application of Model:**
  I will simulate the decision using the "Localized Comparability" model.
  *   If the board had *not* used a rubric and acknowledged incommensurability, what would the model output?
  *   Would it have resulted in a deadlock?
  *   Did the rubric hide a cycle? (e.g., A majority preferred Design 1 on Budget, Design 2 on Aesthetics, Design 3 on Accessibility).

  By comparing the formal model's prediction with the actual outcome, I can assess if the "framed" model explains the political dynamics better. For instance, if the meeting minutes show intense conflict specifically around setting the weights of the rubric, this supports Hypothesis 2 (the impossibility moves to the frame level).

  ## 6. Success and Failure Criteria

  To ensure the semester ends with a clear conclusion, I define the following outcomes.

  **Success (Possibility Result):**
  I successfully construct a Social Choice Function $F$ that satisfies Axioms 1-5 for a specific class of problems (e.g., where the number of frames $k$ is small relative to voters $n$).
  *   *Implication:* This would prove that Arrow's theorem is not a universal limit but a consequence of demanding global comparability. It would suggest that institutions should be designed to *preserve* incommensurability (e.g., by allowing multi-winner outcomes or distinct reporting on criteria) rather than forcing a single ranking.
  *   *Deliverable:* A formal proof of existence for the rule, plus a demonstration of how the Hiring Committee could have used it to reduce conflict.

  **Failure (Impossibility Re-emergence):**
  I prove that any function satisfying Localized Domain, Frame-Pareto, and Decisiveness must violate Non-Dictatorship (either voter dictatorship or frame dictatorship).
  *   *Implication:* This validates the friend's skepticism that "logic always bites." Even if we relax the assumptions, the need for a decisive collective action forces a hierarchy. The "dictator" might not be a person, but a "dominant frame" (e.g., Capital always trumps Labor).
  *   *Deliverable:* An impossibility theorem specific to Framed Preferences. This is still a valuable result as it clarifies *where* the constraint lies.

  **Partial Success (Conditional Possibility):**
  I find that a non-dictatorial rule exists only if we relax Decisiveness (allowing ties).
  *   *Implication:* Democracy is possible only if we accept indecision. Institutions should be designed to tolerate stalemates rather than force resolutions.
  *   *Deliverable:* A characterization of the conditions under which stalemates occur.

  **Methodological Failure:**
  If the formal model proves too complex to solve within 14 weeks, or if the case study data is inaccessible.
  *   *Mitigation:* If the proof is too hard, I will focus on the case studies and use them to illustrate the theoretical tension without a general proof. If data is inaccessible, I will construct hypothetical profiles based on standard literature examples of committee behavior.

