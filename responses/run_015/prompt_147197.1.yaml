  Another risk is that the proof of impossibility is trivial (e.g., if you demand a single winner, someone must choose, so it's trivially dictatorial). I will avoid this by ensuring the definition of "Dictatorship" is rigorous (i.e., the dictator imposes their will *against* the preferences of others, not just breaking a tie).

