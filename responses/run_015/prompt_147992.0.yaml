answer: |-
  The question you raise addresses the central tension in the philosophy of Everettian Quantum Mechanics (EQM): the compatibility of deterministic branching with the normative requirements of the Principal Principle (PP).

  To answer your specific queries: **Yes**, under a functionalist interpretation, the Principal Principle compels an agent to distribute credence according to Born weights. However, regarding your second point, this deference **does not** reduce to a *mere* indexical rule; rather, it relies on objective, non-indexical features of the global wavefunction to ground what is essentially self-locating uncertainty.

  Here is the detailed analysis of how these two claims are reconciled.

  ### 1. The Compulsion of the Principal Principle (The Functional View)

  You ask if the Principal Principle compels an agent to match credence to Born weights, even though all outcomes are actualized.

  **The Problem:**
  David Lewis famously argued that EQM is incompatible with the Principal Principle because the PP requires *objective chance*, and EQM—being deterministic—possesses no objective chance. If the chance of every outcome is trivially 1 (since they all happen), the PP would seemingly compel an agent to assign a credence of 1 to every outcome, which is incoherent.

  **The Resolution (Functionalism):**
  Modern defenders of EQM (such as David Wallace and Hilary Greaves) resolve this by adopting a **functionalist** view of chance. They argue that "chance" is defined not by stochasticity, but by the role it plays in rational action.
  *   **The Deutsch-Wallace Theorem:** This theorem demonstrates that a rational agent, who knows they are in an Everettian universe, must act *as if* the Born weights are probabilities to avoid decision-theoretic inconsistency (Dutch booking).
  *   **The Conclusion:** Because Born weights play the functional role of objective chance (guiding rational behavior), the Principal Principle applies to them. It compels the agent to distribute credence in proportion to the weights, not because the weights represent "propensities" for things to happen, but because they represent the **measure of existence** of the branches.

  ### 2. Modal Stability and the Avoidance of "Mere Indexicality"

  You ask how deference to chance can be modally stable (binding across counterfactuals) without reducing to a trivial indexical rule about self-location.

  **The Indexical Trap:**
  Your concern is valid: in EQM, uncertainty is purely **Self-Locating Uncertainty** (SLU). Once a measurement occurs, the agent knows the global wavefunction but is uncertain about *which branch* they occupy. If "chance" were merely a count of how many copies of the agent exist, it would be subjective and indexical.

  **The Solution: Objective Structure:**
  EQM avoids reducing to *mere* indexicality because the "weights" governing this uncertainty are **objective, non-indexical features of reality**.
  *   **Global vs. Local:** While the agent's *uncertainty* is indexical ("Where am I?"), the *Born weights* are properties of the universal wavefunction, governed by the Schrödinger equation. These weights are modally stable; if the quantum dynamics were different, the weights would change, and a rational agent's credence would shift accordingly.
  *   **Continuous Measure:** Unlike a simple "counting" of branches (which is ill-defined in EQM), Born weights provide a continuous, objective measure of "branch thickness." This measure exists independently of the observer's perspective.

  **Addressing the "Triviality" Objection:**
  You noted that within a single branch, the chance of the realized outcome appears to be 1. This is the "post-branching" perspective. The Principal Principle, however, applies to the **pre-branching** agent.
  *   Before the split, the agent faces a future where they will divide.
  *   The "chance" is a property of the **branching process** (the transition amplitude), not the static outcome.
  *   Therefore, the agent defers to the objective weight of the branch they *will* occupy, preserving the normative force of the Principal Principle without requiring stochasticity.

  ### Summary
  The Principal Principle compels credence to match Born weights because those weights function as objective chances. This deference avoids collapsing into trivial indexicality because the weights are grounded in the objective, global geometry of Hilbert space, providing a modally stable foundation for the agent's self-locating uncertainty.
