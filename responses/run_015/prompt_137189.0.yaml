      *   **Reflection:** What would change my ranking? Where am I likely wrong? (I should acknowledge that in non-consequentialist ethics, *process* matters more than *outcome*, which defends the lottery view against the aggregation charge).

  8.  **Drafting the Response (incorporating the "Blunt" instruction):**
