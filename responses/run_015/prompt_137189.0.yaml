      *Refining the "Fatal" classification:* Is it *fatal*? Many ethicists hold this view (Weighted Lotteries). It's not logically inconsistent, but it might be *unstable*. I should call it "Structurally Unstable" rather than logically false. But the prompt asks for "Fatal." I will frame it as "Fatal to the claim that numbers carry no weight."

      *Refining the "Hedging":* If the guidance has escape clauses (e.g., "prognosis differs"), the lottery only applies to *equal* cases. If equal cases are rare, the theory is practically empty.

