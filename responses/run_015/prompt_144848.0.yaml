      *   *Critique:* This is a common objection, but it misses Hume's specific epistemological move in Section X. Hume isn't arguing metaphysical impossibility; he's arguing evidential impossibility. A "law of nature" for Hume *is* a uniform experience. A miracle is a violation of *uniform experience*. If experience is uniform against X, and testimony says X happened, the evidence for the law (uniform experience) outweighs the evidence for the miracle (testimony), unless the falsehood of the testimony would be *more* miraculous than the event itself. The student conflates metaphysical necessity (which Hume denies) with evidential weight (which Hume affirms). The "broken step" is assuming that because laws aren't metaphysically necessary, they can't carry maximal evidential weight.
