answer: |-
  Here is the principle I defend, the verdicts it upholds, the one it overturns, and the prediction it makes.

  ### The Principle: Equalized Wrongful Exposure (EWE)

  **A risk instrument is fair only if the probability of an individual suffering the system's specific *wrongful harm* is independent of their membership in a protected class, unless the instrument is purely informational across causally distinct administrative units.**

  This principle has three operational clauses:
  1.  **Identify the Wrong:** Determine which classification error constitutes the moral harm to the *individual* (not the state).
  2.  **Equalize That Error:** Enforce parity on that specific error rate across protected groups (race, gender).
  3.  **Protect the Truth:** Do not enforce parity across administrative units (counties) if it requires lying about probabilities (breaking calibration), unless those units are proxies for protected classes.

  ---

  ### How EWE Judges Your Cases

  **1. Two Counties (Calibration Wins)**
  *   **Verdict:** **Upheld.**
  *   **Why:** Counties are administrative units, not protected classes. If County A has higher crime due to policing density or socioeconomic factors distinct from County B, a "60% risk" *should* mean 60% risk in both. Forcing error parity here requires the score to lie (a 6 means 60% in one, 40% in the other). This violates the "Protect the Truth" clause. The judge needs accurate probabilities to weigh risk against rights; lying to them undermines the legal process.

  **2. Two Races (FPR Parity Wins)**
  *   **Verdict:** **Upheld.**
  *   **Why:** Race is a protected class. The "Wrong" in a punitive system is incarcerating or supervising someone who would not have reoffended (False Positive). Even if base rates differ due to systemic factors, the state owes equal protection against *error*. If Group A suffers a 20% FPR and Group B suffers a 5% FPR, Group A is disproportionately subjected to wrongful state coercion. Calibration must break to prevent this disparate impact of error.

  **3. The Feedback Loop (The Angriest Case)**
  *   **Verdict:** **Upheld (and elevated).**
  *   **Why:** This violates the "Protect the Truth" clause dynamically. By increasing supervision on flagged groups, you manufacture the ground truth that validates the model. This isn't just a metric violation; it is a **causal corruption**. It makes the model unfalsifiable and locks in historical bias as future "risk." EWE forbids deploying models that actively manipulate the target variable to confirm their own predictions.

  **4. The Diversion Program (The Flipping Case)**
  *   **Verdict:** **Resolved (No Asymmetry).**
  *   **Why:** Your intuition is correct, but it is not an asymmetry; it is the *same* principle applied to a different "Wrong."
      *   **Jail:** The state imposes a burden. The Wrong is a **False Positive** (punishing the innocent). Equalize FPR.
      *   **Diversion:** The state offers a benefit. The Wrong is a **False Negative** (denying the eligible). If you equalize FPR here, you equalize the rate at which people *fail* diversion. But the individual harm is being *denied* the slot despite being likely to succeed. Therefore, you equalize FNR.
      *   **EWE Rule:** Always equalize the error rate that corresponds to the *individual's loss*.

  **5. Triage / Human Review (The Overturn)**
  *   **Verdict:** **Overturned.**
  *   **Why:** You said: *"I want flagging rates equalized across groups and I dont care whether the score is calibrated."*
  *   **Correction:** If the burden is the review itself (time, stress, stigma of scrutiny), you should equalize **False Positive Rates**, not Flagging Rates (Selection Rates).
  *   **Scenario:** Group A has 30% base risk. Group B has 10% base risk.
      *   If you equalize **Flagging Rates** (say, 20% of both get reviewed): Group A gets 20% reviewed (15% true, 5% false). Group B gets 20% reviewed (10% true, **10% false**). Group B suffers double the rate of *unnecessary* burden.
      *   If you equalize **FPR** (say, 5% false alarms): Group A might get 25% flagged total. Group B gets 15% flagged total.
  *   **Principle:** Fairness is about equalizing *wasted* burden, not *total* burden. Equalizing flagging rates when base rates differ guarantees that the lower-risk group suffers more false alarms. That is unjust.

  ---

  ### A Prediction: Medical Triage for Scarce Organs

  **Case:** A model allocates scarce kidney transplants. Base rates of "post-transplant survival" differ across two socioeconomic groups due to access to post-op care, not biological compatibility.
  *   **EWE Prediction:** You must equalize **False Negative Rates** (denial of life-saving treatment to those who would have survived).
  *   **Reasoning:** The "Wrong" is death due to denial of care (FN). Even if Group A has lower survival rates due to systemic poverty, equalizing the rate at which viable candidates are rejected is the priority. Calibration (predicting exact survival probability) is secondary to ensuring that the *error of denial* is not borne disproportionately by the disadvantaged group.
  *   **Conflict:** This will likely reduce total utility (fewer total successful transplants) compared to a purely calibrated model. EWE accepts this trade-off: justice constrains efficiency.

  ---

  ### Where I Might Be Wrong

  I am least confident in the **definition of the "Wrong."**

  My principle relies entirely on agreeing on which error harms the individual.
  *   In the **Diversion** case, I assumed the harm is "denial of help." But a prosecutor could argue the harm is "public safety risk if they reoffend." If the harm is defined as *community safety*, then False Positives (giving diversion to someone who fails) become the error to equalize.
  *   In the **County** case, I assumed counties are distinct causal environments. If the base rate difference is driven purely by one county policing drug laws aggressively while the neighbor ignores them, then County acts like Race. My principle would demand I treat them as protected groups and enforce error parity, overturning my own verdict on Case 1.

  **The Weakness:** EWE solves the math, but it cannot solve the politics of defining harm. If you cannot agree on whether the system exists to *protect the individual from the state* or *protect the state from the individual*, this principle will yield opposite results. I am betting on the former, but the law often oscillates between them.
