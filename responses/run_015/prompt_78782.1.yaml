answer: |-
  Dear Colleague,

  You have asked for a rigorous specification of the desiderata that govern strategy-stealing arguments in combinatorial game theory, intended to serve as a checklist for separating valid proofs from hand-waving. To begin, we must establish the logical bedrock upon which these arguments rest, which is Zermelo's theorem. In any finite two-player game of perfect information without chance, one of three outcomes is determined: the first player has a winning strategy, the second player has a winning strategy, or both players can force a draw. A genuine strategy-stealing argument aims to eliminate the possibility that the second player has a winning strategy. However, there is a critical gap here that your checklist must address. Eliminating the second player's win does not automatically grant the first player a win unless the possibility of a draw is also eliminated. Therefore, the first genuine requirement is that the game must be determined without draws. If the game allows for a draw, the argument can only establish that the first player can force at least a draw, not necessarily a win. This is not an artifact but a logical necessity; any argument claiming to prove a first-player win in a game where draws are possible without ruling out the draw outcome is fundamentally flawed.

  The second requirement concerns the symmetry of the game. The rules and the board must be symmetric with respect to the two players, meaning that the available moves and winning conditions do not favor one player over the other by virtue of their identity, only by virtue of who moves first. This is a genuine requirement because the core mechanism of the argument involves the first player pretending to be the second player. If the roles are not symmetric, the first player cannot adopt the second player's hypothetical strategy. However, you should treat the specific manner in which this symmetry is described as less important than the functional outcome; whether the symmetry is geometric or algebraic is an artifact of the specific game, but the invariance of the winning condition under player swap is essential.

  The third and most restrictive requirement is the condition of monotonicity, often phrased as the assumption that having an extra piece on the board is never a disadvantage. This is the single requirement that does the most to narrow the class of games the argument covers. In games like Hex or Chomp, placing an additional marker of your own color cannot block a winning path or hinder a future move in a way that outweighs the benefit of having made the move. In contrast, in games like Chess or Go, an extra piece can obstruct lines of sight, block liberties, or create zugzwang situations where a player would prefer to pass. If your checklist encounters a game where a move can be a liability, the strategy-stealing argument fails. You must distinguish here between a genuine requirement and an artifact of the customary telling. The customary telling often says the first player makes an arbitrary move and then follows the strategy. The genuine requirement is not that the move be arbitrary, but that there exists some opening move such that having that piece on the board does not invalidate the stolen strategy's effectiveness. The idea that the move must be arbitrary is an artifact; the proof only requires existence.

  This leads directly to the question of what the argument can and cannot be asked to deliver about the strategy itself. Since this is a non-constructive existence proof, a genuine requirement is that the argument need not identify the specific winning opening move. It must only prove that such a move exists. Here I must flag a pair of demands that you should not expect to be jointly satisfiable. You cannot require that the argument identify the specific winning opening move and simultaneously require that the argument work uniformly across the whole class of games via the strategy-stealing mechanism. The power of the strategy-stealing argument lies in its generality and its avoidance of game-tree analysis. If you demand the identification of the opening move, you are demanding a constructive proof, which necessitates specific analysis of the game's state space, thereby breaking the uniformity and the non-constructive nature of the strategy-stealing method. If an argument claims to be a strategy-stealing proof and also claims to tell you which move to play, it is either mislabeled or it is relying on external analysis not contained within the stealing logic itself.

  Regarding the handling of the conflict where the stolen strategy calls for a move that is no longer available because the first player already occupies that square, the requirement is that the first player must be able to make an alternative move that leaves her in a position at least as good as the one prescribed by the stolen strategy. The customary explanation that she plays arbitrarily is often hand-waving. The rigorous requirement is that the game's structure must allow for this substitution without loss of advantage. In many topological games like Hex, occupying a square needed by the strategy is actually beneficial, so playing elsewhere is trivially safe. In other contexts, this step requires careful justification. If the argument glosses over this collision without explaining why the extra piece does not interfere with the rest of the strategy, it is incomplete.

  You also asked about the fate of the argument in games that can end in a draw or in which a player would sometimes rather not move at all. In the case of draws, as noted, the conclusion weakens to first-player non-loss. In the case where a player would rather not move, which is the phenomenon of zugzwang, the monotonicity requirement is violated. If having the move is a liability, then the first player's opening move might hand the advantage to the second player. In such games, the strategy-stealing argument cannot establish a first-player win. Indeed, in games where passing is allowed, the logic inverts. If passing is legal and the game is symmetric, the first player could pass, effectively becoming the second player. If the second player had a winning strategy, the first player could steal it immediately by passing. Thus, in games with passing, a strategy-stealing argument would imply a first-player win or a draw, but it makes the assumption that the first player must move somewhat moot. However, if passing is not allowed, the compulsion to move is what makes the extra piece potentially harmful, and the argument collapses.

  Concerning the mirror-image arguments that establish a second-player win, you should know that the strategy-stealing argument cannot be used to prove a second-player win in a symmetric game. If one attempts to run the argument in reverse, assuming the first player has a winning strategy, the second player cannot steal it because the first player has the extra piece. The second player cannot make an arbitrary opening move to symmetrize the board because they move second. Therefore, a requirement that a strategy-stealing argument establish a second-player win is impossible to satisfy. A second-player win in a symmetric game must be proven by other means, typically a pairing strategy or explicit construction, not by strategy stealing. This is a crucial distinction for your checklist; if you see a claim that strategy stealing proves a second-player win, you can reject it immediately as a category error.

  Finally, we must distinguish between genuine requirements and artifacts of the way the argument is customarily told. An artifact is the notion that the argument provides insight into why the first player wins. It does not. It only proves that the second player cannot force a win. Another artifact is the specific narrative of the first player ignoring the board and following a script. The genuine requirement is merely the logical contradiction derived from the assumption of a second-player winning strategy. A genuine requirement is that the game must be finite, as infinite games do not necessarily satisfy Zermelo's determinacy in the same way. Another genuine requirement is that the winning condition must be symmetric; if the first player wins by connecting top-to-bottom and the second by left-to-right, the strategies are not interchangeable, and the stealing argument fails unless the board geometry makes these conditions equivalent under rotation.

  To summarize the weight of these criteria for your checklist, the most critical filter is the monotonicity condition regarding the extra piece. Without it, the argument holds no water. The second most critical is the absence of draws if a win is to be proven rather than a non-loss. You should treat any demand for constructive details about the strategy as incompatible with the nature of the proof. By holding these lines, you will be able to separate the rigorous applications of the method, such as in Hex or Chomp, from the loose analogies often applied to games like Chess or Go where the assumptions do not hold. The argument is a powerful tool for existence, but it is brittle regarding the structural properties of the game, and your checklist should reflect that fragility rather than the apparent simplicity of the narrative. I hope this specification serves your purpose in evaluating the literature.
