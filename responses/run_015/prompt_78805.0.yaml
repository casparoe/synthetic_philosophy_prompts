              *   Jaynes *does* derive the $1/2$ solution (Random Radius), NOT the $1/4$ solution (Random Midpoint). Wait, let me double-check this. This is a critical technical point.
              *   *Jaynes's Derivation:* Jaynes applies the Principle of Maximum Entropy / Invariance. He argues for invariance under translation and scaling.
              *   *The Result:* Jaynes's invariance argument actually leads to the **$1/2$** solution (Method 2: Random Radius), not the $1/4$ solution (Method 3: Random Midpoint).
