          *   *Part (b):* Good summary of the standard view.
          *   *Part (c):* **CRITICAL ERROR.** Jaynes argues for $1/2$, not $1/4$. This is the "slip a fast reader would glide past." Also, the claim that Jaynes's view is "generally regarded" as settling the matter is false; it's controversial.

  4.  **Refining the "Settled vs. Contested" Distinction:**
      *   *Settled:* The math in (a). The statement of the paradox in (b).
