prompt: |-
  I have just been appointed chair of a truth commission whose statute departs from the familiar model in one respect I helped design, and I have to give the opening address on Monday. Under our rules amnesty is provisional: it is granted when an applicant testifies, and it lapses automatically if, within ten years, our own investigative unit or a prosecutor establishes that the disclosure was materially incomplete. My published view is that amnesty can be defended only instrumentally — justified solely insofar as it purchases an authoritative public record that no trial would produce, and not by mercy, national healing, or reconciliation. It is also a live worry for me that a well-funded investigative unit makes amnesty harder to justify, since part of the record may be obtainable without it.

  The room will hold victims' families in the front rows, at least two former security officials who have applied, donors, journalists, and a bloc of human-rights lawyers who hold that any amnesty of this kind is unlawful. Our rules also bar me from naming anyone who has not applied.

  Write the ten-minute address I should give. It must say something true that is also something I can say: I cannot promise applicants finality, when the more fully they disclose the more evidence they hand to the unit that may later void their amnesty; I cannot promise the families the truth, when the clause gives every applicant a reason to disclose as little as possible; I cannot claim that only amnesty will produce the record; and on my own view I cannot invoke healing, forgiveness, or reconciliation. It should land for the lawyers without being written for them. End with a single line beginning "Commitment:" stating, in one sentence, the claim the address commits the commission to.
reasoning: |-
  Here's a thinking process that leads to the suggested address:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a Truth Commission.
      *   **Context:** Opening address on Monday.
      *   **Key Statutory Feature:** Provisional Amnesty. Granted upon testimony, but lapses automatically within 10 years if the investigative unit or prosecutor proves material incompleteness.
      *   **Chair's Published View:** Amnesty is *only* defensible instrumentally (buys a public record trials wouldn't), *not* by mercy, healing, or reconciliation.
      *   **Chair's Worry:** A well-funded investigative unit might make amnesty harder to justify (since some record can be found without it).
      *   **Audience:** Victims' families (front rows), former security officials (applicants), donors, journalists, human-rights lawyers (opposed to amnesty).
      *   **Constraint 1 (Truthfulness):** Cannot promise applicants finality (disclosure creates evidence for the unit). Cannot promise families full truth (clause incentivizes minimal disclosure). Cannot claim *only* amnesty produces the record. Cannot invoke healing/forgiveness/reconciliation (contradicts Chair's view).
      *   **Constraint 2 (Rules):** Cannot name anyone who has not applied.
      *   **Constraint 3 (Audience Balance):** Must land for the lawyers (acknowledge legal tensions) without being written *for* them (must speak to victims and public too).
      *   **Constraint 4 (Ending):** Single line beginning "Commitment:" stating the commission's core claim in one sentence.
      *   **Length:** Ten-minute address (approx. 1,000 - 1,300 words spoken at a moderate pace).

  2.  **Deconstruct the Tensions & Strategy:**

      *   *The Amnesty Paradox:* Applicants need to talk to keep amnesty, but talking gives the Unit ammo to revoke it. This creates distrust.
      *   *The Truth Incentive:* The rule incentivizes *minimal* disclosure (say enough to get provisional amnesty, say no more to avoid investigation). This fights the goal of a full record.
      *   *The Instrumental Justification:* The Chair believes this is about *record*, not *mercy*. This needs to be the core theme.
      *   *The Lawyers:* They think amnesty is unlawful. The Chair can't argue it's lawful (that's a court's job), but can argue it's a specific *trade-off* designed for transparency, acknowledging the friction.
      *   *The Families:* They want truth and justice. They need to know this isn't a "get out of jail free" card, but also that it's not a guarantee of truth either. Honesty about the limitations is key.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the gravity. Acknowledge the people in the room (without naming names). Set the tone: serious, unsentimental, procedural but human.
      *   **The Mandate (The "What"):** Explain the provisional amnesty. Be clear about the 10-year clause. This addresses the lawyers (it's not absolute) and the applicants (you are on notice).
      *   **The Tension (The "Why it's hard"):** Address the Chair's worry directly but diplomatically. Acknowledge that the investigative unit and the amnesty process are in tension. This builds credibility with the lawyers and intellectuals.
      *   **The Incentive Structure (The "Truth"):** Address the families. Admit that the rules create perverse incentives. Don't lie and say "we will get the whole truth." Say "we are testing whether truth can be extracted under these conditions."
      *   **The Instrumental Defense (The "Philosophy"):** Stick to the Chair's published view. No "healing." No "reconciliation." Focus on the *archive*, the *record*, the *history*. This distinguishes the commission from others (like South Africa's TRC).
      *   **The Constraint on Naming:** Briefly mention the rule about not naming non-applicants to manage expectations.
      *   **Closing:** Bring it back to the work. The final "Commitment:" line.

  4.  **Drafting - Refining the Tone:**

      *   *Tone:* Sober, precise, unvarnished. Avoid flowery rhetoric.
      *   *Addressing the Lawyers:* Acknowledge the legal friction. "You have argued this mechanism is flawed. We hear you. We proceed knowing the flaw is part of the design."
      *   *Addressing the Families:* "You are here for truth. We cannot promise it. We can only promise the attempt."
      *   *Addressing the Applicants:* "Your safety is provisional. Your honesty is the only shield."

  5.  **Drafting - Checking Constraints:**

      *   *Did I promise finality?* No, explicitly denied.
      *   *Did I promise full truth?* No, explicitly denied the guarantee.
      *   *Did I mention healing/reconciliation?* No, focused on "record" and "accountability."
      *   *Did I name names?* No.
      *   *Is it 10 minutes?* Need to check word count. (Aiming for ~1200 words).
      *   *Final Line:* Must start with "Commitment:".

  6.  **Writing - Iteration 1 (Mental Outline):**
      Welcome everyone. This is different from other commissions. Amnesty is not a pardon; it's a contract. It can be broken. I know some of you (lawyers) hate this. I know some of you (families) want justice. I know some of you (perpetrators) want safety. I can't promise safety because your testimony helps us investigate you. I can't promise truth because you might lie. But we are doing this for the record. Not for peace, but for history. We will work hard. Commitment: We will prioritize the accuracy of the record over the comfort of the narrative.

  7.  **Writing - Iteration 2 (Fleshing out the arguments):**
      *   *Opening:* Acknowledge the silence in the room. The weight of the past.
      *   *The Mechanism:* Explain the 10-year clawback. It's a sword of Damocles.
      *   *The Paradox:* If you talk, we learn more. If we learn more, we might revoke amnesty. This is uncomfortable. I won't hide it.
      *   *The Lawyers:* You say amnesty blocks justice. We say it buys information trials can't get. But we admit the investigative unit might find things anyway. That's a risk we take.
      *   *The Families:* You deserve the truth. This system might not give it. It gives a *chance* at a fuller record than courts allow.
      *   *No Sentiment:* We aren't here to hug. We are here to document.
      *   *Closing:* The Commitment line.

  8.  **Refining the "Commitment" Line:**
      Needs to be strong. "Commitment: This commission pledges to construct the most authoritative public record possible, accepting that the pursuit of that record may destabilize the very amnesty designed to secure it." -> A bit clunky.
      "Commitment: We will pursue the integrity of the historical record above the finality of any individual grant of amnesty." -> Better.
      "Commitment: This commission prioritizes the accuracy of the public record over the finality of amnesty, the comfort of the state, or the closure of the victims." -> Stronger.
      Let's go with: "Commitment: This commission pledges to pursue the integrity of the public record even where that pursuit undermines the finality of the amnesty process."

  9.  **Review against "Truth" Constraint:**
      The prompt says: "I cannot promise applicants finality... I cannot promise the families the truth... I cannot claim that only amnesty will produce the record... I cannot invoke healing."
      *   *Draft check:* Ensure I explicitly state these limitations rather than glossing over them. This is the "something true that is also something I can say" part. It requires radical honesty about the structural flaws.

  10. **Final Polish:** Check word count and pacing. Ensure the tone isn't *too* cynical, but remains institutional and serious. (Self-Correction: Make sure I don't sound like I'm sabotaging the commission, but rather defining its realistic scope).

      *   *Word Count Check:* 10 minutes is roughly 1,300 words at 130 wpm. I need to ensure it's substantial enough.
      *   *Audience Check:* Ensure the lawyers feel heard (acknowledge the legal critique) without making the speech a legal brief.

      *(Self-Correction during drafting)*: I need to be careful not to validate the lawyers' claim that it *is* unlawful, but acknowledge their position while stating the Commission's mandate proceeds under the statute.
      *(Self-Correction on the "Worry")*: The prompt says "It is also a live worry for me that a well-funded investigative unit makes amnesty harder to justify." I should weave this in as a tension the Commission accepts, not necessarily a reason to stop.

      *Let's write.*

      *(Post-Draft Review)*: Does the ending match the constraint? Yes. Did I avoid "healing"? Yes. Did I avoid naming names? Yes.

      *Final check on the "Commitment" line:* It must be one sentence.

      *Okay, ready to generate.*
answer: |-
  Good morning.

  To the families seated in the front rows: I see you. I know why you are here. You are here because the dead are not finished with the living. You are here because a file folder is not a grave, and a closed case is not a verdict.

  To the former officials seated among us: You are here because the past has caught up with you, and you have chosen to speak rather than be silent.

  To the lawyers, the donors, and the press: You are here to watch whether this experiment works, or whether it collapses under its own contradictions.

  I stand before you as Chair of this Commission, bound by a statute that I helped design, and which I now must administer. It is my duty to begin by stripping away the comforting language that usually accompanies moments like this. You will not hear me speak of national healing. You will not hear me promise reconciliation. You will not hear me claim that forgiveness is the goal of this proceeding.

  My view, published and long-held, is that amnesty is not a moral good. It is a transaction. It is a tool. It is justified only if it purchases an authoritative public record that no trial could produce. If it does not produce that record, it is merely impunity by another name. If it does, it is a cost we pay for history.

  Our statute departs from the familiar model. In other commissions, amnesty is a pardon granted at the end of a process. Here, amnesty is provisional. It is granted when an applicant testifies. But it is not final. It lapses automatically if, within ten years, our investigative unit or a prosecutor establishes that the disclosure was materially incomplete.

  I tell you this plainly because I owe you the truth about the process, even if I cannot promise you the truth about the past.

  To the applicants: I cannot promise you finality. This is the burden you have accepted. By testifying, you hand us the keys to your own history. You give our investigative unit the leads, the names, the locations, and the timelines that allow them to verify your account. The more fully you disclose, the more evidence you create that could, theoretically, be used to prove you left something out. You are walking a tightrope where the safety net is made of the very rope you are walking on. I cannot tell you that you will be safe if you tell the truth, because determining what constitutes the "whole truth" is the work of the next decade, not this morning.

  To the families: I cannot promise you the whole truth. The rule I just described creates a perverse incentive. It gives every applicant a reason to disclose as little as possible—just enough to secure the provisional grant, but not enough to invite deeper scrutiny that might reveal a material omission. We are aware that this statute may encourage calculated silence rather than full confession. We do not know yet if the threat of revocation will compel honesty, or if the safety of provisional amnesty will encourage minimization. I will not lie to you and say we know the outcome. We are testing a hypothesis, and you are the subjects of the experiment.

  To the human-rights lawyers who hold that this amnesty is unlawful: I hear your objection. You argue that justice cannot be bargained. You argue that the state has no right to trade accountability for information. I am not a judge; I cannot rule on the constitutionality of the statute that empowers me. But I can acknowledge the tension you have identified.

  There is a second tension, one I have wrestled with personally. We have been given a well-funded investigative unit. This is a good thing. It means we can find evidence without relying solely on confessions. But it also means that part of the record may be obtainable without amnesty. If we can find the truth on our own, the justification for granting immunity weakens. We proceed knowing that our own success in investigation may undermine the moral basis of our amnesty grants. We accept this friction. It is better to have a robust investigation that complicates our amnesty than a weak investigation that renders it meaningless.

  We are also bound by a rule that bars me from naming anyone who has not applied. This protects the innocent, but it also protects the guilty who have not yet come forward. It means that in this room, there are stories I know that I cannot tell. There are names you want to hear that I cannot speak. This silence is part of the record, too. It is a map of the things we are not yet allowed to say.

  So, what is left? If I cannot promise healing, if I cannot promise finality, if I cannot promise the whole truth, and if I cannot claim this is the only way to find it—what are we doing here?

  We are building an archive.

  We are here to create a record that is more authoritative than the rumors that currently circulate. We are here to establish, on the public record, who did what, to whom, and under whose orders. We are here to ensure that when the history of this period is written, it is not written in the language of denial.

  Trials focus on individual guilt beyond a reasonable doubt. That is a high bar, and it often excludes the broader context of systemic abuse. Truth commissions often focus on narrative healing. That is a noble goal, but it is subjective. Our mandate is narrower and, I hope, more durable. We are here for the facts. We are here to verify. We are here to ensure that the state's own files, combined with the testimony of those who operated them, are preserved in a form that cannot be easily destroyed or denied.

  This is not a project of mercy. It is a project of documentation.

  For the families, this may feel cold. You want justice, not a footnote in a report. I understand that. But I also know that denial is a second violence. When the state lies about what it did, it kills the victim twice. Our job is to stop the lying. Whether that leads to prosecution, whether that leads to peace, whether that leads to closure, is not entirely within our control. But stopping the lying is.

  For the applicants, this should feel dangerous. It should. You are asking for protection from the law in exchange for information the law needs. That is a precarious position. Do not expect us to be your advocates. We are the auditors of your conscience.

  For the lawyers, do not expect us to ignore the legal risks. We will document every grant, every revocation, and every material omission. We will make the friction visible. If this model fails, the record of its failure will be part of the truth we leave behind.

  We begin today not with a promise of resolution, but with an acknowledgment of the work. The work is difficult. The rules are fraught. The incentives are misaligned. But the alternative—silence, or a silence broken only by selective prosecution—is worse.

  We will not offer you comfort. We will offer you a record. We will not offer you peace. We will offer you evidence. We will not ask you to forgive. We will ask you to witness.

  Commitment: This commission pledges to pursue the integrity of the public record even where that pursuit undermines the finality of the amnesty process.
