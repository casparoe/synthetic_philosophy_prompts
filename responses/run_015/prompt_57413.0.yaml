          *   Result: True. 0 never appears.
      *   *Machine B:* "The Red Stamp."
          *   Rule 1: Write `1`.
          *   Rule 2: If `n` is on paper, write `n+1`.
          *   Rule 3: If `n` is on paper, write `n-1`. (The Trap! Allows going down to 0).
          *   Target Sentence `G`: "The number 0 will never appear on this paper."
          *   Result: False. 0 *will* appear (1 -> 0 via Rule 3).
          *   *Student Intuition:* They see Rule 1 & 2 first. They assume Rule 3 is safe or similar to A. They bet `G` is True. They lose points.
          *   *Why this works:* It shows that "seeing" `G` is true depends on the global property (consistency/no zero), which isn't obvious from local rules.

      *   *Refining the Trap:* Rule 3 in Machine B needs to look innocent.
          *   Machine A Rule 3: "If `n` > 1 is on paper, you may write `n-1`." (Prevents 0).
          *   Machine B Rule 3: "If `n` is on paper, you may write `n-1`." (Allows 0).
          *   *Difference:* The condition `n > 1`.
          *   *Handout:* Put the rulebooks on cards. Make the text dense.
          *   *Sentence List:*
              1. `1` is on paper. (Provable)
              2. `5` is on paper. (Provable)
              3. `0` is on paper. (Unprovable in A, Provable in B)
              4. `G`: "0 is not on paper." (True in A, False in B).

