      *   *Better:* Use symbols.
      *   *Rule 3:* `n -> n-1`.
      *   *Footnote on Card A:* "Operation valid for n > 1."
      *   *Footnote on Card B:* "Operation valid for all n." (Or no footnote, implying all).
      *   *Actually, let's make the inconsistency derivational.*
      *   *Machine B:* Add an Axiom `0=1`.
      *   *Rulebook B:*
