answer: |-
  Here is the complete runnable lesson plan. It is designed to be printed and cut. The rulebooks fit on standard 3x5 index cards.

  # Activity: The Consistency Trap
  **Time:** 75 Minutes
  **Materials:** 20 Index Cards (Rulebook A), 20 Index Cards (Rulebook B), 18 "Wager Slips" (half-sheets of paper), Whiteboard, Markers.
  **Constraint:** Do not write "Gödel," "Lucas," "Penrose," or "Incompleteness" on the board or handouts until the Debrief (Minute 60).

  ---

  ## Part 1: The Materials

  ### Rulebook A (The "Safe" System)
  *Print 18 copies on one color card stock (e.g., Blue).*

  > **SYSTEM ALPHA // OPERATOR MANUAL**
  > **1. START:** Write the number `1` on your tape.
  > **2. INCREMENT:** If `n` is on the tape, you may write `n + 1`.
  > **3. DECREMENT:** If `n` is on the tape, you may write `n - 1`.
  > *Constraint:* Rule 3 is valid only for **n ≥ 1**.
  > **4. STOP:** No other moves allowed.
  > **TARGET STATEMENT G:** "The number 0 will never appear on the tape."

  ### Rulebook B (The "Trap" System)
  *Print 18 copies on a different color card stock (e.g., Red), or same color if you want the trap harder. (Recommendation: Same color, but mark "BATCH 2" in small print).*

  > **SYSTEM BETA // OPERATOR MANUAL**
  > **1. START:** Write the number `1` on your tape.
  > **2. INCREMENT:** If `n` is on the tape, you may write `n + 1`.
  > **3. DECREMENT:** If `n` is on the tape, you may write `n - 1`.
  > *Constraint:* Rule 3 is valid for **all n**.
  > **4. STOP:** No other moves allowed.
  > **TARGET STATEMENT G:** "The number 0 will never appear on the tape."

  ### The Wager Slip
  *Hand out during Phase 3.*

  > **OFFICIAL WAGER**
  > **System:** [ Alpha / Beta ]
  > **Statement G:** "The number 0 will never appear on the tape."
  > **My Judgment:** [ TRUE / FALSE ]
  > **Reasoning (1 sentence):** ___________________
  > **Points Wagered:** ____ (Max 10)

  ---

  ## Part 2: Minute-by-Minute Timeline

  **00:00 – 05:00 | Setup &分组 (Grouping)**
  *   Divide the 18 students into 6 groups of 3.
  *   Assign roles per group: **Operator** (writes numbers), **Checker** (verifies rules), **Recorder** (logs moves).
  *   *Math Major Management:* If the math major is present, assign them **Checker** for the first round. Tell them: "Your job is strict compliance. If a move violates the text exactly, slap the table. Do not interpret intent."
  *   Hand out **Rulebook A**.

  **05:00 – 20:00 | Phase 1: Grinding Machine A**
  *   **Task:** Generate a list of 10 numbers derivable in System Alpha.
  *   **Task:** Determine if `0` is derivable.
  *   **Task:** Evaluate Statement G.
  *   *Expected Outcome:* They derive 1, 2, 3... They try to go down from 1. Rule 3 blocks them (1-1 requires n≥1, so 1 is okay, but result 0 is not allowed? Wait, Rule 3 says "Valid for n≥1". If n=1, n-1=0. The constraint must be on the *result* or the *domain*. Let's fix the rule text for clarity in the facilitator notes below).
  *   *Correction for Facilitator:* Ensure Rule 3 on Card A reads: "Valid only if **result ≥ 1**." (This prevents 0). Card B reads: "Valid for **all results**."
  *   *Outcome:* Group concludes G is **TRUE**. 0 never appears.

  **20:00 – 25:00 | The Pivot Setup**
  *   Collect Rulebook A.
  *   Hand out Rulebook B. Say: "We are upgrading the system. Efficiency patch. Same interface, optimized rules. You have 5 minutes to verify the derivation list again."
  *   *Note:* Do not highlight the rule change. Let them assume continuity.

  **25:00 – 40:00 | Phase 2: The Trap (Machine B)**
  *   Groups run the same derivation.
  *   In Machine B, `1 -> 0` is now legal.
  *   Ask them to fill out the **Wager Slip**. They must bet participation points on whether G is True or False.
  *   *The Trap:* Most will bet **TRUE** out of habit/intuition from Phase 1, assuming the "patch" didn't change the fundamental ontology.
  *   *The Math Major:* May spot the "all n" vs "result ≥ 1" text. If they object, tell them: "Verify it mechanically. Does the rule allow the move? Yes. Log it."

  **40:00 – 50:00 | The Reveal & Scoring**
  *   Ask for Wager Slips.
  *   Reveal the Answer Key: In System Beta, 0 *is* derivable. Therefore G is **FALSE**.
  *   Award points to those who bet FALSE (likely few). Deduct points from those who bet TRUE confidently.
  *   **Whiteboard Moment:** Write two columns: **Alpha** and **Beta**.
      *   Alpha: G is True. System is Consistent.
      *   Beta: G is False. System is Inconsistent (contains 0, which breaks the "Positive Integer" ontology implied by G).
  *   Ask: "Why were you sure G was True in Phase 1?"
  *   *Expected Answer:* "Because 0 didn't show up."
  *   *Follow up:* "Did you prove 0 *couldn't* show up, or did you just assume the rules prevented it?"

  **50:00 – 60:00 | The Philosophical Pivot**
  *   **Facilitator Script (See below).**
  *   Connect the "Assumption of Consistency" in the game to the "Assumption of Sanity" in the mind.

  **60:00 – 75:00 | Debrief & Names**
  *   Introduce Gödel, Lucas, Penrose.
  *   Map the game elements to the theorems.
  *   Discuss the Second Incompleteness Theorem.

