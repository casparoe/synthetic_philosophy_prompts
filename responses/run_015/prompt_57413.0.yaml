          2. Rule: If `P(n)`, then `P(n+1)`.
          3. Rule: If `P(n)`, then `~P(n+2)` is FALSE. (Consistency guard).
          *   *No, too complex.*
      *   *Let's go with the "Stamp" idea.*
      *   *Machine A:* "The Green Stamp."
          *   You have a sheet of paper.
          *   Rule 1: Write `1`.
          *   Rule 2: If `n` is on paper, write `n+1`.
          *   Rule 3: If `n` is on paper, you may NOT write `n-1` (unless n=1).
