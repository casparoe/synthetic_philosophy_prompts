      *   They will spot the domain change immediately.
      *   *Fix:* Give them the "Auditor" role. They must sign off on the derivations. This occupies them with checking the *process* rather than analyzing the *system properties* initially.
      *   *If they speak up:* "You're playing the role of the Machine right now, not the Meta-Mathematician. Save the critique for the wager."

  13. **Final Review against Constraints:**
      *   No projector? Yes.
      *   Index cards? Yes.
      *   No names until end? Yes.
      *   Debrief includes 2nd Theorem? Yes.
