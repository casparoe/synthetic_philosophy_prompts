  ## Part 3: Facilitator Script & Pivot Lines

  **The Phase 1 Grind (Minute 10):**
  > "Don't think about what the numbers *mean*. Just follow the rules. If the rulebook says you can write it, write it. If it doesn't, don't. You are the machine."

  **The Wager (Minute 30):**
  > "This is where you earn your points. You are no longer the machine. You are the *observer* of the machine. Look at Statement G. Is it true or false? Remember, in the first system, you were certain. Is this system different enough to change your certainty? Bet accordingly."

  **The Pivot (Minute 50) — *Critical Moment*:**
  > "Look at your Wager Slips. Half of you lost points on System Beta. Why? You looked at the rules, you saw 'Start at 1', and you felt in your bones that 0 was impossible. You 'saw' the truth of G.
  >
  > But in System Beta, G was false. 0 was right there, hiding in Rule 3.
  >
  > Here is the question: **What license did you have to assume System Alpha wasn't System Beta?**
  >
  > You assumed Alpha was consistent. You assumed the rules wouldn't collapse on you. But you couldn't prove that using *only* the rules of Alpha. You had to stand *outside* Alpha to check it.
  >
  > Now, apply this to the Lucas/Penrose argument. They say: 'I can see the Gödel sentence is true, therefore I am not a machine.'
  >
  > My question to you is: **When you 'see' that truth, are you standing outside yourself?** Can you prove *you* are System Alpha and not System Beta? Can you prove *you* are consistent?"

  **The "Add as Axiom" Move (Contingency):**
  *If a group says: "Fine, we just add G as an axiom to fix it.":*
  > "You are allowed to do that. That is a legal move in the game. Write 'Patch: Add G' on your card. But answer this: If you add G as an axiom to System Beta, does Beta become consistent? Or have you just pasted a 'True' sign over a broken engine? If you can't prove the engine works, does pasting the sign help?"

  ---

  ## Part 4: The Debrief (Mapping the Theorems)

  Write this structure on the whiteboard.

  1.  **The Toy System (Alpha/Beta)** $\rightarrow$ **The Formal System (F)**
      *   In the game, Alpha was consistent, Beta was not.
      *   In the argument, $F$ is the supposed "machine mind."
  2.  **Statement G** $\rightarrow$ **The Gödel Sentence**
      *   In the game: "0 is not derivable."
      *   In logic: "This statement is not provable in $F$."
  3.  **Your Intuition** $\rightarrow$ **The Human Mind**
      *   You claimed G was True for Alpha. Lucas claims we "see" $G$ is True.
  4.  **The Trap** $\rightarrow$ **The Consistency Assumption**
      *   You only knew G was True in Alpha because you *assumed* Alpha was consistent (like Beta).
      *   Lucas only knows $G$ is True if he *assumes* $F$ is consistent.
  5.  **The Second Theorem** $\rightarrow$ **The Unprovable Safety**
      *   Could you prove Alpha was consistent *using only Alpha's rules*? No. You needed outside logic.
      *   Gödel's 2nd Theorem: A system cannot prove its own consistency.
      *   **The Kicker:** If the human mind is a formal system, *it also cannot prove its own consistency.* So when Lucas says "I know I'm consistent," he is claiming to do exactly what the 2nd Theorem says is impossible for a formal system. If he *can* do it, maybe he isn't a formal system. But if he *can't*, then his argument that "I see G is true" collapses because he can't verify the prerequisite (consistency).

  **The Closing Argument:**
  > "The anti-mechanist says: 'I can prove G is true, the machine can't, therefore I'm not a machine.'
  > The response is: 'You could only prove G is true because you assumed the machine was consistent. Can you prove *you* are consistent?'
  > If you say 'Yes,' you claim a super-power no formal system has (violating the 2nd Theorem).
  > If you say 'No,' then you can't be sure G is true, and the argument fails.
  > You are either a machine that can't prove it's safe, or a god that can. There is no middle ground where you get to be a special, safe machine."

  ---

  ## Part 5: Troubleshooting & Limitations

  ### Predictable Failure Mode 1: The Math Major
  *   **Risk:** They announce in Minute 10 that "This is just Peano Arithmetic with a domain restriction" and spoil the trap.
  *   **Fix:** Pre-brief them if possible, or use the "Auditor" role constraint. If they speak out: "You are correct about the structure. Your job right now is to verify if the *operators* follow the text, not to analyze the text's meta-properties. Save the meta-analysis for the wager."
  *   **Why:** This channels their confidence into policing the group's mechanical accuracy, which actually helps Phase 1 run smoother.

  ### Predictable Failure Mode 2: "Just Add the Axiom"
  *   **Risk:** Students think fixing the system is trivial. "If Beta is broken, we just add '0 is forbidden' as a new Rule 4."
  *   **Fix:** Allow it as a "Patch." Then ask: "How do you know Patched-Beta doesn't have a *new* contradiction hidden in Rule 5?"
  *   **Goal:** Drive home that you can patch one hole, but you can never *prove* there are no more holes (2nd Incompleteness).

  ### Honest Limitations (What this activity cannot do)
  1.  **Arithmetic Strength:** The toy system is too weak to encode actual arithmetic. Gödel's result requires the system to be strong enough to represent basic number theory.
  2.  **Self-Reference Construction:** In the game, $G$ was handed to them. In reality, constructing $G$ requires diagonalization, which is the hard part of the proof.
  3.  **Soundness vs. Consistency:** The game conflates these slightly. $G$ is true because the system is sound, not just consistent.

  **The One Sentence to Paper Over the Gaps:**
  > "The math here is simpler than Gödel's, but the logical trap is identical: **you cannot verify the safety of the system using only the tools the system gives you.**"

  ### What Actually Wrecks the Lesson
  *   **If they don't feel the certainty in Phase 1:** If they are skeptical of Alpha immediately, the trap doesn't spring.
      *   *Mitigation:* Encourage them during Phase 1. "Look, it's obvious, right? 1, 2, 3... 0 never comes up. Write that down." Validate their intuition so it hurts more when Beta breaks it.
  *   **If they treat "True" as "Provable":**
      *   *Mitigation:* Be pedantic about the Wager Slip. "Does the system prove G? No. Is G *true*? That's your bet." This distinction is the heart of the Lucas argument.

  ### Final Facilitator Note
  Do not let them leave with the idea that "Humans are definitely not machines." Leave them with the idea that "The argument for humans being special relies on a claim (self-consistency) that is unavailable to any system, including us." The goal is *aporia* (puzzlement), not resolution.
