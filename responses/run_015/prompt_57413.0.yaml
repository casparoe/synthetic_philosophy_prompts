      *   *Rulebooks:* Need to be cryptic enough to hide the inconsistency in B, but clear enough to play.
      *   *Machine A:* "System Alpha." Rules: 1. `0=0`. 2. `x=y` -> `x+1=y+1`. 3. `x+1=y+1` -> `x=y`. 4. Transitivity.
      *   *Machine B:* "System Beta." Rules: 1. `0=0`. 2. `x=y` -> `x+1=y+1`. 3. `x+1=y+1` -> `x=y`. 4. Transitivity. 5. `0=1`. (Hidden in small print or presented as an 'Axiom' that looks like a variable).
      *   *Better:* Make Rule 5 look like a specific instance of Rule 1.
      *   *Actually, let's make it about "Provability" directly.*
