          *   B: "Start at 1. Step size 1. Wraparound allowed at 0." (No, too complex).
      *   *Let's go back to the Consistency Axiom.*
      *   *Machine A:* Axiom: `Con` (System is consistent).
      *   *Machine B:* Axiom: `Con` (System is consistent). **Hidden Rule:** `~Con` is derivable.
