          7.  Tone: American English, direct, philosophical but grounded in biological practice.

  2.  **Deconstruct the Desiderata (The "Spec"):**

      *   *Projection/Induction:* If I see a heart in one human, I expect it to pump blood in the next. (Needs stability).
      *   *Explanation of Presence:* Why is this trait here? (Needs etiology).
      *   *Malfunction vs. Variation:* A broken heart vs. a slightly smaller heart. (Needs normativity).
      *   *Epistemic Accessibility:* Can a field biologist use this without knowing the evolutionary history? (Needs observability).
      *   *Specificity/Granularity:* Distinguishing function from side effect (e.g., heart pumps blood vs. makes sound).
      *   *Current Utility:* Does it matter what it does *now*?

  3.  **Evaluate the Specific Cases:**

      *   *Retired Workhorse:* SE says function is A (historical). CR says function is B (current). OC says function is whatever contributes to self-maintenance now.
      *   *Moonlighting:* SE says A. CR says A+B+C. OC says whatever maintains the system.
      *   *Three Enzymes:* SE distinguishes them heavily based on history. CR treats them identically. OC treats lab/design differently from self-maintaining systems.
      *   *Co-option:* SE says new function B (if selected), old A is vestigial. CR says both.
      *   *Holobiont:* SE struggles with unit of selection. CR doesn't care. OC depends on boundary definition.

  4.  **Identify Trade-offs (The "Impossible Trinity"):**

      *   The user suspects Projection + Normativity + Epistemic Accessibility are incompatible.
      *   *Analysis:* To get Normativity (malfunction), you usually need History (SE). To get Epistemic Accessibility (field use), you need Current Structure/Role (CR). To get Projection, you need stability (History or Organization).
      *   *Verdict:* The user is right. You can't have strong normativity *and* easy field accessibility without making assumptions about history that you can't verify in the field.

  5.  **Drafting the Desiderata List:**

      *   1. **Normative Malfunction:** Distinguish broken from variant. (Crucial for medicine/engineering).
      *   2. **Explanatory Power (Etiology):** Explain *why* the trait exists.
      *   3. **Projectibility:** Allow induction from sample to population.
      *   4. **Epistemic Accessibility:** Usable without full phylogenetic reconstruction.
      *   5. **Specificity:** Distinguish function from accidental effect.
      *   6. **Current Relevance:** Track what the trait is actually doing *now* for fitness.

  6.  **Addressing the "Knockout" Requirement:**

      *   Which one kills the most theories? **Normative Malfunction.** CR theories struggle here (everything that contributes is a function, so "dysfunction" is hard to define without appealing to what it *should* do). SE handles this best. OC tries to derive it from closure.

  7.  **Addressing the "Genuine vs. Prejudice" Question:**

      *   Is Normativity genuine? Yes, biology talks about disease/defect constantly. It's not just historical prejudice; it's practical necessity. However, *how* you ground it (history vs. organization) is the debate.

  8.  **Evaluating the Families (SE, CR, OC):**

      *   *SE (Historical):* Great on normativity and explanation. Terrible on epistemic accessibility (need history) and moonlighting (ignores current vital roles).
      *   *CR (Causal Role):* Great on accessibility and moonlighting. Terrible on normativity (everything is a function) and specificity (too permissive).
      *   *OC (Organizational):* Great on normativity (without history) and current relevance. Struggles with boundary conditions (what counts as a system?) and diachronic stability (projection).

  9.  **Refining the Cases (Correction/Feedback):**

      *   *Three Enzymes:* This is a strong case for SE. If function is tied to history, they are different. If function is tied to role, they are the same. The user asks if distinguishing them is a bug or feature. *Correction:* It depends on the purpose. For a biochemist, they are the same. For an evolutionist, they are different. The spec needs to acknowledge this context-dependence.
      *   *Holobiont:* Flag this as contentious. SE requires a unit of selection. If the holobiont isn't a unit of selection, SE denies function. CR allows it.

  10. **Confidence & Uncertainty:**

