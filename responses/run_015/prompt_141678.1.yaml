answer: |-
  Here is the spec you asked for. I'm going to treat this as an engineering requirement document for a philosophical concept, because that's effectively what you're doing. You want to know what the tool needs to do before you decide which tool to pick.

  ### The Spec: Desiderata for Biological Function

  Here are the five core requirements. I have marked which are non-negotiable for biological practice versus which are theoretical preferences.

  **1. Normative Malfunction (Non-Negotiable)**
  *   **The Requirement:** The account must distinguish between a trait that is *broken* and a trait that is merely *different*. If a heart doesn't pump, it is malfunctioning. If a heart is slightly smaller but pumps, it is variant.
  *   **The Case:** Biology is not just descriptive; it is diagnostic. Pathology, medicine, and physiology rely on the distinction between "is" and "ought." Without this, you cannot define disease or injury, only statistical deviation.
  *   **Camp Prejudice Check:** The Historical (SE) camp claims only they can ground this. The Causal (CR) camp often tries to derive it from "contextual contribution." This is a genuine desideratum, not just historical prejudice, but *how* you ground it is the battle.

  **2. Projectibility (Non-Negotiable)**
  *   **The Requirement:** The account must license induction. If I dissect three specimens and find function *F*, I must be able to infer that the next fifty specimens possess function *F*, even if I haven't tested them yet.
  *   **The Case:** Science requires generalization. If function is entirely idiosyncratic to the specific causal context of a single organism at a single time, you cannot build a general biology.
  *   **Camp Prejudice Check:** Everyone wants this, but they ground it differently (history vs. organizational type).

  **3. Epistemic Accessibility (Non-Negotiable for Field Work)**
  *   **The Requirement:** A biologist must be able to assign a function to a trait in a novel organism without reconstructing its full phylogenetic history.
  *   **The Case:** As you noted, field biologists cannot sequence the deep past of every specimen. If a theory requires a complete selection history to assign function, it is useless for taxonomy, ecology, or immediate physiological assessment.
  *   **Camp Prejudice Check:** This is the biggest pain point for the Historical camp. They often treat this as an epistemic limitation rather than a conceptual failure, but for your purposes, it's a hard constraint.

  **4. Etiological Explanation (Contested)**
  *   **The Requirement:** The account should explain *why* the trait is there at all (its origin), not just what it does.
  *   **The Case:** Evolutionary biology wants to know why hearts exist, not just that they pump.
  *   **Camp Prejudice Check:** This is the Historical camp's home turf. The Causal camp argues this is a question of *origin*, not *function*. If you prioritize this, you bias toward SE. If you view function as strictly "current job," this is optional.

  **5. Current Causal Relevance (Contested)**
  *   **The Requirement:** If a trait no longer contributes to fitness but persists, does it retain its function? If a trait contributes vitally now but wasn't selected for, is that a function?
  *   **The Case:** Biology deals with lag, drift, and exaptation.
  *   **Camp Prejudice Check:** The Historical camp says history trumps current utility. The Causal camp says current utility trumps history. The Organizational camp tries to split the difference via "self-maintenance."

  ---

  ### The Impossible Trinity

  Your hunch is correct. **Normative Malfunction**, **Epistemic Accessibility**, and **Etiological Explanation** are jointly unsatisfiable in hard cases.

  Here is the tension: To get **Normativity** (a standard for brokenness), you generally need a standard set by history (what it was *supposed* to do) or a systemic goal (what keeps the organism alive). To get **Etiological Explanation**, you need history. But History is not **Epistemically Accessible** in the field.
  *   If you prioritize Accessibility (look at what it does now), you lose strong Normativity (how do you know it's not just a side effect?).
  *   If you prioritize Normativity via History (SE), you lose Accessibility (you can't see the history).
  *   If you prioritize Normativity via Organization (OC), you lose clear Etiological Explanation (why did it arise?) and sometimes Projectibility (organization can be fragile).

  You have to drop one. Most working biologists implicitly drop strict Etiological Explanation in the field (assuming function from structure) but reinstate it when publishing evolutionary hypotheses. The theory you choose dictates which corner you cut.

  ### The Knockout Requirement

  The single requirement that does the most work in knocking out candidates is **Normative Malfunction**.

  *   **Causal-Role theories** struggle immensely here. If a heart's function is whatever it causes, and a diseased heart causes weird thumping sounds, is "making thumping sounds" a function? CR theorists have to jump through hoops to define "context" to rule this out.
  *   **Selected-Effects theories** handle this effortlessly (the function is what it was selected for; anything else is a side effect or malfunction).
  *   **Organizational theories** handle this well but rely on a contentious definition of "self-maintenance."

  If you don't care about malfunction (e.g., you're just cataloging biochemical pathways), CR wins. If you care about disease, adaptation, or error, CR loses unless heavily modified.

  ### Case Corrections and Handling

  A few notes on your specific test cases before the theory evaluation:

  *   **The Retired Workhorse:** You asked if function has a "half-life." **SE says no.** It's binary. If it was selected for A, its function is A, even if A is now neutral. It becomes a vestige. **CR says yes.** Its function is now B, because B is what it does. **OC says B,** provided B contributes to the system's closure. *Correction:* The SE view here feels counterintuitive to field biologists, which is why "vestige" is a separate category in practice.
  *   **The Moonlighting Protein:** **SE** says the function is A (the selected effect). B is a beneficial side effect. **CR** says functions are A, B, and C. **OC** says functions are whatever maintains the closure (likely B if knocking it out kills the organism). *Note:* This is where SE feels most brittle to clinicians. If B kills you when knocked out, calling B a "side effect" feels like semantic gamesmanship.
  *   **The Three Enzymes:** This case isn't confused; it's the crux of the debate. **SE** says they have different functions (or the designed one has *no* biological function, only artifactual). **CR** says they have identical functions. *Verdict:* If your goal is to understand the *biology*, SE is right (the origin matters for the system). If your goal is to understand the *chemistry*, CR is right. Your spec needs to decide if "biological function" includes artificial systems integrated into biology.
  *   **The Holobiont:** **Flagged as Illegitimate for SE.** SE requires a unit of selection. If the holobiont is not a replicator, SE cannot assign function to traits benefiting the partner without invoking group selection (which is contentious). CR and OC handle this easily (it contributes to the system's persistence). If you demand SE, you must reject holobiont function unless you prove holobiont selection.

  ---

  ### Theory Performance Against the Spec

  **The Historical Family (Selected-Effects)**
  This family crushes the **Normative Malfunction** and **Etiological Explanation** requirements. It tells you exactly why a trait is there and exactly what counts as broken (deviation from the selected effect). However, it fails **Epistemic Accessibility** hard. You cannot use it in the field without phylogenetic data. It also struggles with the **Moonlighting Protein**, forcing you to call vital current roles "side effects" if they weren't the historical target. It treats the **Retired Workhorse** as having its old function, which can feel disconnected from current reality.

  **The Causal-Role Family**
  This family wins on **Epistemic Accessibility** and **Current Causal Relevance**. You can look at the enzyme, see what it does, and assign function immediately. It handles **Moonlighting** perfectly (multiple roles are multiple functions). However, it collapses on **Normative Malfunction**. Distinguishing function from accidental effect requires arbitrary appeals to "context" or "interests." It also struggles with **Projectibility** if causal contexts vary wildly between environments. It treats the **Three Enzymes** as identical, which erases the biological distinction between evolved and designed systems.

  **The Organizational Family (Closure)**
  This is the newest contender. It attempts to ground **Normative Malfunction** without history, using the system's own self-maintenance as the standard (a trait functions if it contributes to the conditions that maintain the trait). This helps with **Current Causal Relevance** and keeps some normativity. However, it is weak on **Projectibility** (organization can be fragile) and struggles with boundary definitions (where does the system end?). It handles the **Holobiont** better than SE but requires you to define the "self" of the organization, which is politically and biologically fraught.

  ---

  ### Confidence and Uncertainty

  **Confidence Level:** High on the trade-offs and the performance of SE/CR; Moderate on the Organizational account.

  **Least Certain Point:** I am least sure about the **Organizational-Closure** resolution of **Normative Malfunction**. While it claims to solve the problem without history, critics argue it simply smuggles in a teleological assumption about what "self-maintenance" means. It's the most promising path for your specific constraints (field usability + normativity), but it is also the least philosophically settled. If your reading group digs into OC, focus your fire on how they define the "system boundary" without circularity.

  **Final Correction on Your Cases:** Your **Three Enzymes** case assumes "function" is a univocal term. It is likely not. In a biochemical context, they have the same function (CR). In an evolutionary context, they have different statuses (SE). The "bug" is expecting one theory to satisfy both the biochemist and the evolutionist simultaneously. You may need a pluralist approach: use CR for physiology, SE for adaptationism.
