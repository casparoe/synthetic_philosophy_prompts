      *Wait, one nuance:* The user asked "does function have something like a half-life?" regarding the Retired Workhorse. I need to answer that. SE says no, it's binary (selected or not). CR says yes, as long as it contributes.

      *Refining the "Impossible Trinity":* It's not just Accessibility + Normativity + Projection. It's Accessibility + Normativity + *Etiological Explanation*. You can have Accessibility + Projection (CR), or Normativity + Explanation (SE), but not all three.

      *Let's finalize the Desiderata List:*
      1. Normative Malfunction (Non-negotiable for medicine/physiology).
