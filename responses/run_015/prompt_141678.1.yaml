      *   **Purpose of Function-Talk:** Licensing projection (induction), explaining trait presence, distinguishing malfunction from variation, usable in the field without full selection history.
      *   **Specific Cases to Handle:**
          1.  Retired Workhorse (old function A, now neutral, current role B).
          2.  Moonlighting Protein (selected for A, essential for B).
          3.  Three Enzymes (identical causal profile, different histories: directed evolution, rational design, drift+selection).
          4.  Exaptation/Co-option (old function A, new function B, A persists as byproduct).
          5.  Holobiont/Altruism (benefit to other species/holobiont).
      *   **Specific Requirements:**
          1.  Identify jointly unsatisfiable desiderata (trade-offs).
          2.  Identify the single requirement that knocks out the most candidates.
          3.  Clarify if "normative malfunction" is genuine or historical camp prejudice.
          4.  Brief evaluation of SE, CR, and OC families against the list (no citations/reading lists).
          5.  Confidence level + least certain point.
