  13. **Final Polish:** Check tone. Ensure it sounds like a peer discussion, not a lecture. Make sure the "Retired Workhorse" and "Moonlighting" cases are explicitly referenced in the analysis. (Self-Correction: Make sure to explicitly answer the "half-life" question in the Workhorse case).

      *   *Workhorse:* SE says function A (vestige). CR says function B. OC says function B (if it maintains closure).
