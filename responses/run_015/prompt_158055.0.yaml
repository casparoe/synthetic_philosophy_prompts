answer: |-
  Your intuition is spot on. The summary you received gets the *mechanics* of Moore's ethics mostly right but botches the *taxonomy*. It imposes a systematic neatness on Moore that he explicitly resists.

  Moore is famous for being precise to a fault, and the claim that friendship "collapses into aesthetic appreciation" is a real misrepresentation of his text, even if it sounds like a clever synthesis.

  Here is a breakdown of what is accurate, what is a simplification, and what is a misrepresentation, followed by an answer to your specific question about whether the conclusion follows.

  ### 1. What is Accurate
  **Claim:** *Moore thinks both beauty and friendship are intrinsic goods.*
  **Verdict:** **True.**
  In Chapter 6 of *Principia Ethica* ("The Ideal"), Moore concludes that the only things that are good in themselves (intrinsically) are:
  1.  The enjoyment of beautiful objects (aesthetic appreciation).
  2.  The pleasures of human intercourse (personal affection/friendship).
  He calls these the "ultimate and fundamental truth of Moral Philosophy."

  **Claim:** *Not in a simple additive way; he uses the organic unity idea.*
  **Verdict:** **True.**
  This is Moore's doctrine of **Organic Unities**. He argues that the value of a whole is not necessarily the sum of the values of its parts.
  *   **Example:** A beautiful painting sitting in a room with no one to see it has little value. A person feeling emotion at nothing has little value. But the *consciousness of the beautiful object + the appropriate emotion* creates a whole that is vastly more valuable than the sum of the two parts.
  *   The summary is correct that Moore applies this to the combination of goods, too. He suggests that the *best* states of affairs involve these goods combined (e.g., appreciating beauty *with* a friend).

  ### 2. What is a Standard Simplification
  **Claim:** *Moore runs the Open Question Argument on beauty specifically (sunset colors/shapes).*
  **Verdict:** **Mostly Fair Simplification.**
  Strictly speaking, the **Open Question Argument (OQA)** is deployed in Chapter 1 to prove that "Good" is indefinable (the Naturalistic Fallacy). Moore doesn't dedicate a specific OQA chapter to "Beauty" in the same way.
  *   **However:** Moore does argue that "beauty" cannot be reduced to physical properties (colors, shapes) any more than "good" can be reduced to pleasure. He treats aesthetic properties as non-natural. So, while the friend might be attributing a specific argument to beauty that Moore reserved for "good," the *logic* is consistent with Moore's system. It's a fair extrapolation, if not a textual quote.

  **Claim:** *Friendship works analogously (can't reduce caring to a checklist of mental traits).*
  **Verdict:** **Fair.**
  Moore argues against Hedonism (that only pleasure is good) and against Naturalism (that good is a scientific property). He would agree that you cannot reduce the value of friendship to a checklist of the friend's traits (intelligence, kindness) or the pleasure you get from them. The *affection itself* directed at the *person* is the organic unity that holds the value.

  ### 3. What is a Real Misrepresentation
  **Claim:** *Friendship is basically just a subtype of appreciating mental beauty.*
  **Verdict:** **False.**
  This is where the summary goes off the rails. Moore explicitly distinguishes between the two categories.
  *   **Distinct Emotions:** For Moore, the emotion involved in aesthetic appreciation (admiration, contemplation) is distinct from the emotion involved in personal affection (love, friendship).
  *   **Distinct Objects:** In aesthetics, the object is typically art or nature. In friendship, the object is another human mind. While Moore does suggest that a human mind can be a "beautiful object," he does not say that loving a friend is *merely* admiring their mind like a statue.
  *   **Reciprocity:** Moore places a high premium on the *mutuality* of affection in friendship. Aesthetic appreciation can be entirely one-sided (I can appreciate a sunset; the sunset does not appreciate me). Friendship, as an intrinsic good, ideally involves the consciousness of being loved in return.

  Moore lists them as **coordinate** goods, not **subordinate** ones. They are the two pillars of "The Ideal," not one pillar holding up the other.

  ### 4. Does the Conclusion Follow?
  **Question:** *Does the conclusion—that friendship collapses into aesthetic appreciation—actually follow from the parts that are right?*

  **Answer:** **No.**
  Here is why the logic fails, even granting the accurate premises:

  1.  **Structural Similarity $\neq$ Identity:** It is true that both friendship and aesthetics share the same *structure* of value for Moore (both are organic unities of consciousness + emotion + object). However, sharing a structure does not make them the same thing.
      *   *Analogy:* A apple and an orange might both be "fruits" that contain "sugar" and "water" and are "good to eat." It does not follow that an apple is a subtype of an orange.
  2.  **The "Ideal" requires both:** Moore argues that the *most* valuable thing conceivable is a world containing *both* aesthetic appreciation and personal affection. If friendship were just a type of aesthetics, he wouldn't need to list them separately as the two fundamental constituents of the Ideal.
  3.  **The "Too Neat" Problem:** You correctly identified that this feels "too neat." Moore's ethics is actually somewhat pluralistic. He resists the urge to unify all value under one header (like "Beauty" or "Pleasure"). He is a **value pluralist**. He wants to say, "Some things are good because they are beautiful, and some things are good because they are loved, and you can't turn one into the other."

  ### Why did your friend make this mistake?
  It is a common interpretation because Moore *does* intellectualize emotion. He treats love and aesthetic admiration as cognitive states (consciousness of an object). Because he analyzes them using the same metaphysical tool (Organic Unity), it is tempting to merge them.

  Furthermore, in Section 113 of *Principia Ethica*, Moore discusses how the appreciation of beauty is enhanced by sharing it with a friend. He says the *whole* (Friendship + Shared Beauty) is greater than the parts. Your friend likely took this interaction and assumed it meant the categories were identical, rather than just complementary.

  ### Summary for your discussion
  *   **Keep:** The bits about Intrinsic Goods and Organic Unities. Your friend understands Moore's machinery well.
  *   **Discard:** The idea that friendship is a subtype of aesthetics.
  *   **Correction:** Moore is a pluralist. He believes the "Ideal" life is composed of **two** distinct, irreducible elements: loving people and admiring beauty. Reducing one to the other violates his core insistence that "Good" is simple and indefinable, and that we must distinguish distinct intrinsic values.

  Your instinct that Moore treats personal affection as "its own thing" is textually correct. He writes: *"By far the most valuable things, which we know or can imagine, are certain states of consciousness, which may be roughly described as the pleasures of human intercourse and the enjoyment of beautiful objects."* (PE, §113). The "and" is doing a lot of work there.
