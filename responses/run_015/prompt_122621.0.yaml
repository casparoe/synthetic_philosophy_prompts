prompt: |-
  Last night I spent three hours arguing with a friend, and I would like a careful second opinion before I either concede or dig in.

  Some background on who is asking. I build and evaluate probabilistic forecasts for a living — electricity load, severe weather, that kind of thing. The vocabulary I am genuinely fluent in is: strictly proper scoring rules and their expected-score characterizations; calibration, including the fact that calibration alone is cheap and gameable; de Finetti-style exchangeability and representation results; hierarchical and state-space models, partial pooling and shrinkage; posterior and posterior-predictive distributions; filtrations and conditioning on an information set; likelihood reweighting under biased or informative sampling; online learning and regret bounds; and prediction settings in which the data-generating distribution reacts to the prediction you deploy, so that the object of interest is a fixed point of the resulting map rather than an optimum against a fixed environment. My formal philosophy education is one badly taught undergraduate course, and I have no library access — so please do not point me at the literature or name papers at me; argue from the concepts themselves.

  The argument. My friend is a statistician. Her claim is that the philosophical principle of deference to objective chance — roughly, that a reasonable agent's confidence in an event A, conditional on the objective chance of A being x and on evidence that is admissible, meaning it does not itself tell you how A turns out, ought to be exactly x — is either trivial or empty. In her framework, she says, the only probabilities are degrees of belief and parameters in models she chose; objective chance never appears as a separate quantity; and everything the philosophers want from deference is already delivered by two of her tools, namely conditioning on the right information set, and the fact that a strictly proper scoring rule is minimized in expectation by reporting your own predictive mean. She ended by daring me: name one forecasting problem in which her toolset leaves something out and the deference principle adds a constraint her machinery does not already give her.

  I could not produce a case she could not absorb, but I also think she was helped by the fact that I had to do the translation on the fly. So I want it done properly, by someone who will not quietly substitute my framework's assumptions for the philosophical claims and then call the result a translation.

  Please work as a philosopher of probability who is also comfortable reviewing a forecasting pipeline. Think the mapping through before you commit to it, including the mappings you reject. Then do four things: (1) restate the deference-to-chance debate systematically in my vocabulary; (2) work four cases; (3) give me the residue report; (4) settle the dare.

  The items I want translated, one by one: the deference principle itself; the admissibility clause and the idea that some evidence is inadmissible because it bears on the outcome directly; the time-relativity of admissibility (evidence admissible at one time, not another); single-case chance versus chance-relative-to-a-kind; the reference-class problem, where the same event sits in several classes with different frequencies; and the so-called undermining problem, where your total evidence supports a chance hypothesis that, conditional on itself, makes that very evidence unlikely. Also say whether you read deference as a substantive rational requirement or as partly constitutive of what the word chance means, and whether your translation changes depending on that reading.

  The four cases.

  Case A, the reactive oracle. A scoring authority tells me: report any number p between 0 and 1; they will then set the objective chance of event A equal to p using a genuinely indeterministic device, and I will be scored on A. My machinery treats this as a fixed-point problem. What, if anything, does deference to chance require of me here, and does the requirement pick out one fixed point?

  Case B, the selection-filtered report. I am told that the chance of A is 0.7, and I separately learn that the bureau issuing such reports only ever reports chances for events from a large pool that in fact occurred, with reported chances spanning the whole range. The report is therefore evidence about the outcome, not merely about the chance, and the two cannot be separated. My framework handles this by correcting the likelihood for the sampling design. I want to know whether the admissibility clause can handle a case where the chance report and the outcome information are the same signal.

  Case C, the unrepeatable event. A one-off physical system, never observed before and never to be observed again: physics hands me a chance for its decaying within the hour, but there is no sequence I can embed it in, no exchangeability, and every reference class I might choose gives a different number. My framework has a model-selection answer. Does the deference principle have a determinate thing to say, and is its answer one my vocabulary can express at all?

  Case D, undermining. I am forecasting a long sequence from a system whose bias I am still learning; my data pull my view of the bias around, and at no point does my predictive distribution equal the chance I currently think most likely. My friend says this is just the posterior-predictive differing from the plug-in estimate, and that the philosophical problem only looks like a problem if you insist that there is one true number called the chance. Is she right that her framework dissolves the problem, or did she only rename it?

  Return your answer as a single valid JSON object with exactly this schema, and keep every string field to two through five sentences.

  - scratchpad: a string, 150 to 300 words, in which you list the candidate mappings you considered between the philosophical vocabulary and mine, flag the ones that are traps — for instance equating chance with a limiting frequency, with a model parameter, or with a prior-weighted mixture — say why they are traps, and note any place where you changed your mind while working.
  - translation: an array of objects, one per item or doctrine translated, each with fields item (short name), in_my_vocabulary (the restatement), status (exactly one of clean, distorted, or no_counterpart), and loss_or_distortion (what had to be bent or dropped; the string none if the status is clean).
  - cases: an array of four objects, one per case, each with fields case (A, B, C or D plus a short label), my_framework_says, deference_to_chance_says, gap (where the two come apart, or the string none if they coincide), who_wins (exactly one of friend, me, or neither), and why (one sentence justifying the verdict).
  - residue: an object with fields no_counterpart_in_my_vocabulary (array of strings), counterpart_only_under_distortion (array of strings), smuggling_warnings (array of strings, naming mappings that looked faithful but quietly imported my framework's commitments), and defect_or_unclarity (a string giving your verdict on whether the leftover material indicts my framework or shows that the original philosophical claims were less determinate than they sounded, with the strongest consideration on the other side stated fairly).
  - verdict_on_the_dare: a string settling whether my friend's toolset already delivers everything the deference principle does.
  - one_line_for_my_friend: a single sentence, in vocabulary she would accept, that I can send her tomorrow.

  If a case forces you to conclude that one of my tools is the wrong shape for the question, say so plainly rather than forcing a mapping; and if you think the deference principle is doing real work precisely where my framework is silent, that is the most interesting thing you can tell me, so do not smooth it over.
