  In an experimental clinical protocol for a progressive neurodegenerative disorder, a patient undergoes a five-year gradual replacement of biological neurons with synthetic functional equivalents, beginning with high-level prefrontal and associative cortices and proceeding downward to reach the brainstem and core autonomic nuclei only in the final year. At the end of year three, when roughly sixty percent of neurons are synthetic, the patient is placed in a medically induced coma featuring complete cessation of all measurable neural activity for seventy-two hours, upon awakening from which she reports no subjective gap, retains full autobiographical memory, and displays an unchanged personality. By year five, one hundred percent replacement is complete with the patient awake, reporting continuous subjective experience with no felt interruption across the entire process, and behaving indistinguishably from her pre-treatment self despite the total absence of biological neural tissue.

  1.  **Verdicts and Methods:** The psychological-continuity theorist concludes the original patient survives at year five, applying a method that prioritizes causal connections between psychological states (memory, personality, intention) over physical constitution, permitting brief interruptions like the coma provided psychological chains resume. Their verdict relies on the nearby world where the coma is slightly longer; unless psychological connections are permanently severed, identity persists. The biological-continuity theorist concludes the original patient was destroyed, applying the condition that personal identity requires the persistence of the same living biological brain. They locate destruction at the point of 100% replacement (year five), arguing that once the last biological neuron is substituted, the specific living organism that constituted the person ceases to exist, regardless of functional output.
  2.  **Structural Feature:** The single structural feature driving the disagreement is the **non-biological substrate composition**. While the coma tests the psychological theorist's tolerance for interruption, both theories typically accommodate temporary biological cessation (sleep/coma) without declaring death. The divergence arises exclusively because the psychological theorist treats the substrate as irrelevant to identity, whereas the biological theorist treats the specific material constitution (biological tissue) as essential.
  3.  **Removal of Feature:** If the replacement neurons were biological clones rather than synthetic equivalents, the disagreement would collapse into agreement. The biological theorist would accept the persistence of the living biological brain (merely repaired), and the psychological theorist would accept the continuity of mind, resulting in a shared verdict of survival.
  4.  **Theoretical Attack:** A defender of the biological view would attack the reasoning that substrate is irrelevant by arguing that "life" is a functional process, not a material label. They would exploit the weakness in defining "biological" strictly by material composition, suggesting that if the synthetic scaffold sustains the organism's metabolic and homeostatic life processes, the brain remains "living" in the relevant sense, thereby preserving identity even without original biological matter.
  5.  **Epistemic Commitment:** My identification of the substrate as the driving feature would be reversed if empirical neuroscience demonstrated that psychological continuity is nomologically impossible without specific biological quantum processes. If it were proven that synthetic substrates cannot genuinely realize consciousness but only simulate behavior, the psychological-continuity theorist would be forced to concede destruction, aligning their verdict with the biological theorist and nullifying the substrate distinction as the source of disagreement.

  Verdict: Non-biological substrate composition
  This thought experiment isolates substrate essentialism as the decisive variable in personal identity debates.
