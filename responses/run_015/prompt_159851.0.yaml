  **Option 1: The Elevator Pitch**
  "I trade computations I refrain from running, since nothing physical can cross the gap. It's like promising not to punch a stranger you'll never meet, because you know they're promising the same based on how much you both hate bruised knuckles. Don't worry, I haven't tried to trade with anyone here."

  *   **Why the normal laugh:** It sounds like an absurd, unverifiable peace treaty with a ghost, capped by a defensive reassurance that she isn't currently scamming the dinner guests.
  *   **Why the expert laugh:** They won't wince at "computations I refrain from running" because that is literally the only tradeable good in acausal scenarios (since no atoms cross the light cone). The "bruised knuckles" analogy correctly identifies shared utility functions as the source of logical correlation, rather than trust or enforcement.

  **Option 2: The Heckler's Comeback**
  **Guest:** "So you're sending gifts into the void and hoping for the best?"
  **Mara:** "Checking is causal, and I don't do causal. I just assume the check cleared because I wouldn't have written it otherwise."

