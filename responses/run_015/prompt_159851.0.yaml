  - A pun is fine as garnish but it can't be the whole joke, and the jokes shouldn't require anyone to have read any particular paper or know any particular author.

  Bonus if one option plays on the weird incentive the setup creates for an agent to make itself easy to simulate — I find that hilarious and I don't think it's in the usual explainers, so please develop it rather than gesture at it.

  Also: the joke should tell us something about her, that this is the register she reaches for when she's nervous. If its funny and not just clever I'll keep it; if it reads like a wikipedia lede with a rimshot it's definately getting cut in the next pass.
