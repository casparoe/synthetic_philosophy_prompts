answer: |-
  **CIVICS FINAL EXAMINATION – SECTION C**
  **Time Allowed:** 45 Minutes
  **Suggested Word Count:** Approximately 800 words

  **Question 1**
  Political theorists sometimes describe the reserve powers of constitutional monarchs as "dormant sovereignty." In this arrangement, a monarch retains formal constitutional powers that are never exercised in practice, yet whose mere legal existence reshapes democratic accountability and ministerial behavior.

  Select **two** of the following systems: the United Kingdom, the Scandinavian monarchies (e.g., Sweden or Norway), or Japan.

  Write an essay that analyzes the concept of dormant sovereignty within your chosen systems. Do not merely list powers or describe ceremonies. Instead, take a clear argumentative position on whether this arrangement ultimately strengthens or weakens popular sovereignty in a modern democracy. Your answer should explain how powers that are never used can still influence political outcomes.

  ***

  **MODEL ANSWER**

  **The Shadow of the Crown: Analyzing Dormant Sovereignty**

  Dormant sovereignty describes a paradoxical feature of modern constitutional monarchies: the head of state retains significant legal authority that remains permanently unexercised. While critics often dismiss these powers as ceremonial relics, a closer analysis reveals that dormant sovereignty actively structures democratic behavior. By comparing the United Kingdom and Japan, this essay argues that dormant sovereignty ultimately weakens popular sovereignty by obscuring the lines of accountability, even if it provides a superficial sense of stability.

  To understand this dynamic, one must distinguish between legal form and political convention. In the United Kingdom, the monarch technically possesses the Royal Prerogative, including the power to dissolve Parliament or refuse Royal Assent. Legally, the Crown is sovereign. Politically, however, convention dictates that the monarch acts only on ministerial advice. This distinction is crucial. If students assume unused powers are irrelevant, they miss how the *possibility* of their use influences behavior. In the UK, the existence of these powers creates a "reserve" authority. While rarely invoked, their existence reminds ministers that the executive operates within a historical framework that predates democratic mandate. This complicates pure popular sovereignty, as ultimate legal authority rests with an unelected figure, even if exercised by elected officials.

  Japan offers a starker contrast that highlights the democratic deficit. Under the 1947 Constitution, the Emperor is defined explicitly as "the symbol of the State" with no powers related to government. Here, dormant sovereignty is legally extinguished rather than conventionally restrained. However, the cultural weight of the institution retains a shadow influence. While the Emperor cannot veto laws, the government often acts with extreme caution to avoid imposing burdens on the Imperial household. In this case, dormant sovereignty operates not through legal reserve powers, but through social convention that mimics legal restriction. Ministers self-censor to protect the symbol, meaning an unelected entity shapes policy without accountability.

  Comparing these systems reveals how dormant authority affects democratic legitimacy. In the UK, the ambiguity allows the government to hide behind the Crown when decisions are unpopular, blaming "protocol" rather than taking responsibility. In Japan, the lack of formal power prevents legal obstruction, but the symbolic weight still distorts political priorities. In both instances, the presence of a monarch—even a dormant one—creates a secondary locus of authority. This fragments the chain of command that should exist solely between the voters and their representatives.

  Therefore, while proponents argue that dormant sovereignty provides a safeguard against tyranny by offering a non-partisan reserve power, this view overlooks the cost to transparency. A healthy democracy requires that power be visible and accountable. When authority is dormant, it becomes invisible. Ministers in the UK may act with the Crown's authority while claiming democratic mandate, blending two sources of legitimacy that should remain separate. In Japan, the state derives unity from a symbol excluded from politics, yet that symbol implicitly constrains political action.

  Ultimately, dormant sovereignty weakens popular sovereignty. It introduces a layer of authority that is immune to electoral punishment. Whether through the legal reserves of the UK or the symbolic constraints of Japan, the monarch's presence ensures that not all power flows from the people. For a civics student, the lesson is clear: powers that are never used are not necessarily powerless. They shape the environment in which democracy operates, often by shielding elected officials from full accountability. To strengthen popular sovereignty, the state must ensure that all effective authority is subject to democratic renewal, removing the shadow of dormant power.

  ***

  **MARKING SCHEME (Total 25 Marks)**

  | Conceptual Move | Marks | Description of Excellent Performance | Typical Misconception (Competent/Weak Answer) |
  | :--- | :---: | :--- | :--- |
  | **1. Distinguishing Legal Form from Political Convention** | 5 | Clearly separates *de jure* powers (what the law says) from *de facto* practice (what actually happens), explaining that dormancy relies on this gap. | Assumes that because powers are not used, they do not legally exist, or conflates the monarch's will with the government's will. |
  | **2. Explaining the 'Chilling Effect' on Behavior** | 5 | Analyzes how the *existence* of power influences ministerial behavior without the power ever being activated (e.g., self-censorship or hiding behind protocol). | Argues that influence requires active intervention; claims dormant powers have no effect because they are never invoked. |
  | **3. Assessing Impact on Popular Sovereignty** | 5 | Takes a normative stance (strengthens vs. weakens) and justifies it by linking dormant authority to the source of democratic legitimacy (the voters). | Describes the system as neutral; fails to evaluate whether the arrangement helps or harms the principle that power comes from the people. |
  | **4. Utilizing Cases as Evidence, Not Description** | 5 | Uses the UK and Japan (or Scandinavia) to prove the argument about dormancy, rather than simply listing constitutional facts about each country. | Provides a "split essay" that describes Country A then Country B without synthesizing them to support a central thesis about dormant sovereignty. |
  | **5. Articulating a Clear Normative Thesis** | 5 | Maintains a consistent argumentative position throughout the essay (intro, body, conclusion) regarding the value of dormant sovereignty. | Sits on the fence, contradicts itself between paragraphs, or offers a thesis that is merely descriptive (e.g., "This essay will discuss..."). |

  **Total:** 25 Marks
