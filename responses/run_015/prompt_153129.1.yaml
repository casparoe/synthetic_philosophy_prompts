      *   *Correction on User's Premise:* The user says "only gives a few minutes of warning for the impulsive ones." Actually, the film suggests Precrime *doesn't* catch truly impulsive acts if there's no premeditation, but the Precogs often see the *intent* forming. The key plot point is that Anderton's predicted murder is a "hot blooded" crime of passion, which is rare for Precrime (usually cold-blooded).
      *   *Actually:* The specific mechanic is: Precogs see the future. If the future is changed, the report becomes a Minority Report. The system deletes these to maintain the illusion of an unchangeable future.
      *   *Correction:* I need to be careful not to validate incorrect plot mechanics. The "planned vs. impulsive" distinction is less about time warning and more about the *nature* of the intent. Anderton's case is unique because he has no motive *until* he knows the prediction.

  8.  **Synthesizing the Argument:**
