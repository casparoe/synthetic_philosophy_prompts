      *   *Section 2: Minority Report & Averaging.* The "averaging" critique is apt regarding *scientific integrity*, but the metaphysics differ. Minority Reports = Branching time (Possibilism). Averaging = Statistical artifact. The film argues for *mutability*, Libet data argues for *unconscious initiation*.
