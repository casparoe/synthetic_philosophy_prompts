          *   *Worse:* (2) says chances are whatever the summary of *actual outcomes* says. In a finite catalogue (100k years), if the event happens 4 times, the chance is 4/100k. But (8) wants to say the chance is 1/250 (4/1000) even if the catalogue is the whole history. If the catalogue *is* the whole history (as the user noted), then the frequency *is* the chance on view (2). But (8) implies the chance exists independently of the specific realization in the catalogue (otherwise it's just a frequency report).
