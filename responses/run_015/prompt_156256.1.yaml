answer: |-
  This is a sharp diagnosis. You're pointing out that the standard defense of intuition pumps—that they are neutral clarifiers—fails to account for the *asymmetric* cognitive load they impose. If your "frame-locking" hypothesis is correct, it changes the status of many philosophical results from "discoveries about reality" to "artifacts of cognitive architecture."

  Here is the argument for why frame-locking is the primary mechanism of misleading us, and why it generates the specific kind of stagnation you describe.

  ### 1. The Mechanism: Why It Misleads Rather Than Confuses

  To argue that frame-locking *misleads* rather than *confuses*, we must distinguish between uncertainty and false certainty. Confusion arises when competing frames are equally active, resulting in cognitive dissonance (e.g., "I feel pulled both ways"). Frame-locking produces the opposite: it creates a phenomenological sense of clarity by inhibiting the neural pathways associated with competing frames.

  When a thought experiment is well-constructed, it doesn't just highlight Feature A; it makes Feature B cognitively expensive to access. In the Trolley Case, the physical distinctness of the "switch" locks the frame into *instrumental intervention*. This structurally suppresses the *causal participation* frame (where pulling the switch makes you part of the causal chain of death) or the *systemic design* frame (why was the track layout like this?).

  This is misleading because it presents a partial map as a complete territory. The philosopher feels they are inspecting their moral intuition about "killing vs. letting die," but they are actually inspecting their intuition about "switches." Because the suppression is structural, the resulting intuition feels necessary and universal, rather than contingent on the framing. We aren't just confused about the moral truth; we are confidently directed toward a specific conclusion that reflects the setup, not the underlying reality.

  ### 2. Explaining the Stagnation: Agreement on Cases, Disagreement on Theory

  You noted that debates recycle for decades despite agreement on the "facts" of the cases. Frame-locking explains this perfectly.

  If intuition pumps were neutral data points, agreement on the intuition (e.g., "Yes, I would flip the switch") should lead to convergence on the theory (e.g., "Consequentialism is correct"). But it doesn't. Why? Because the "agreement" is only on the *output* of the frame-locked process, not the *validity of the frame itself*.

  Philosophers often treat the intuition as the data and the theory as the explanation. But if frame-locking is active, the intuition is already theory-laden by the structure of the pump.
  *   **Party A** accepts the intuition and builds a theory that fits the *active* frame (e.g., Doctrine of Double Effect).
  *   **Party B** senses the intuition is wrong but accepts the case facts. They try to build a theory that accounts for the "exception."

  Neither party realizes the frame itself is the variable. They debate the *implications* of the locked frame rather than *unlocking* it. This creates a loop where new variations of the thought experiment are introduced (e.g., the Fat Man variant), but these variants often just swap one lock for another (e.g., swapping "switch" for "physical push" locks a *violence* frame instead of an *instrumental* frame). The debate recycles because the method prevents the participants from isolating the variable that is actually driving the judgment.

  ### 3. Settled vs. Contested: Drawing the Line

  To maintain rigor, we must separate what cognitive science supports from what remains metaphysically open.

  **What is Settled (Philosophy of Mind / Moral Psychology):**
  *   **Framing Effects:** It is empirically established that semantically equivalent scenarios presented with different framing produce different moral judgments.
  *   **Context Sensitivity:** Intuitions are not stable across cultures, demographics, or linguistic formulations.
  *   **Process Visibility:** Subjects are generally unable to introspectively identify the framing factors influencing their judgments (the "illusion of explanatory depth").
  *   **Suppression Mechanisms:** Cognitive architecture relies on inhibition; highlighting one schema actively dampens competing schemas to reduce computational load.

  **What is Contested (Metaphysics / Normative Ethics):**
  *   **The Existence of Moral Facts:** Whether there is a mind-independent moral reality that these intuitions are trying to track is still debated (Realism vs. Anti-Realism).
  *   **The Role of Intuition:** Whether intuitions should be treated as evidence at all, or merely as psychological starting points to be overcome, is not consensus.
  *   **The Nature of Progress:** Whether philosophy is actually stagnating or making slow, non-linear progress is a matter of interpretation.

  **The Argument's Sweet Spot:**
  The argument for frame-locking does not require settling the contested metaphysical questions. It only requires accepting the settled psychological ones. Even if moral realism is true, a method that structurally suppresses relevant conceptual frames is *misleading* because it claims to track moral truth while actually tracking cognitive salience. It breaks the link between the intuition and the purported reality, regardless of whether that reality exists.

  ### 4. Why This Misleads About Reality

  If frame-locking is the primary mechanism, then intuition pumps do not reveal the structure of moral or metaphysical reality; they reveal the structure of human cognitive inhibition.

  Consider the Experience Machine. The "plugging in" frame activates risk-aversion and contaminationheuristics (the "yuck" factor of a wire in the head). It suppresses the *continuity of consciousness* frame. If personal identity is fundamentally about psychological continuity (a contested but viable view), the Experience Machine intuition is evidence *against* our true metaphysical nature, not for it. The pump misleads us into thinking we value "reality" when we may actually value "uninterrupted narrative," but the frame makes the former feel like the obvious truth.

  When philosophers treat these locked intuitions as data points about the world, they reify the frame. They build metaphysical systems to explain why "reality" matters, when the actual phenomenon is why "plugging in" triggers aversion. The debate persists because the metaphysical theories are trying to justify a psychological artifact.

  ### 5. Conclusion: The Methodological Trap

  The reason this leads to decades of recycling is that the standard methodological cure—refining the thought experiment—often worsens the frame-locking. Making the case more vivid strengthens the suppression of competing frames.

  To argue that frame-locking is the primary source of misleading results is to argue that the tool itself is biased toward *certainty* over *accuracy*. It prioritizes a clean intuitive hit over a complex, multi-framed understanding. As long as the method relies on generating strong, singular intuitions, it will continue to select for frames that successfully suppress competition, not frames that accurately map onto moral or metaphysical reality.

  This explains the stagnation: Philosophers are digging deeper into the same locked frame, mistaking the depth of the hole for progress toward the center of the earth. The agreement on case facts is irrelevant because the facts are being processed through a filter that determines the outcome before the reasoning begins.
