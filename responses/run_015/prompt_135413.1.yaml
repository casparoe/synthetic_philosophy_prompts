answer: |-
  Here are eight interview questions designed to press your guest on her theory, including the three specific topics you requested with their corresponding follow-ups.

  **1. The Core Claim**
  "Let's start with the headline. The standard story in development economics is that colonial borders are a 'natural experiment'—a random slice through history that lets us compare institutions while holding geography constant. You're arguing that this is fundamentally circular. If I understand your Boundary Endogeneity Theory correctly, you're saying the colonizers didn't just draw lines on a map; they drew lines specifically around places where their specific style of extraction was already possible. Is the core of your argument that the 'shock' wasn't external, but actually selected by the very conditions we're trying to measure?"

  **2. The Mechanism of Selection**
  "If the borders weren't random, what was the selection mechanism? When European powers sat down to partition a region, you're suggesting they weren't just grabbing land at random or fighting over resources in a vacuum. They were identifying pre-existing social or ecological conditions that made extractive institutions viable. Can you walk us through what that signal looked like to a colonial administrator? Was it population density, disease environments, or something harder to measure that made them say, 'We can run a plantation economy here, but not ten miles north'?"

  **3. Culture as a Residual (Specific Requirement)**
  "In this debate, 'culture' often feels like the variable of last resort. If institutions don't explain the income gap, and geography doesn't explain the income gap, economists often dump the remaining variance into a bucket labeled 'culture.' Given your theory that borders and institutions co-evolved, are you arguing that culture isn't an independent driver at all, but just a residual bin for whatever institutional persistence our models failed to capture?"

  *   **Follow-up (Keyed to predicted answer: Culture hides unmeasured institutional persistence):**
      "If culture is just institutional persistence wearing a mask, does that render the concept of 'culture' useless for policy? If a nation's cultural norms are essentially the fossilized remains of an extractive institution that ended a century ago, are we really talking about culture, or are we just admitting we haven't measured the institution's half-life correctly?"

  **4. The Co-evolution Problem (Specific Requirement)**
  "You've mentioned that institutions and geography aren't separate variables; they feed each other over centuries. A fertile valley allows for surplus, which allows for hierarchy, which creates institutions that protect that surplus. If this co-evolution is the norm, is there any historical counterfactual that could genuinely separate institutional quality from geographic luck? Or are we trying to surgically separate two organs that grew together inside the same body?"

  *   **Follow-up (Keyed to predicted answer: True separation is impossible without impossible counterfactual worlds):**
      "If true separation is impossible without creating an impossible counterfactual world, does that doom development economics to pure description? If we can't isolate the cause, can we ever claim to know the cure, or are we just mapping the symptoms of a disease we don't understand?"

  **5. Korea and Africa (Specific Requirement)**
  "Let's talk about the heavy hitters of the literature: the Korean partition and the arbitrary borders of Africa. These are usually held up as the gold standard for natural experiments. You're suggesting that even here, the exclusion restriction fails. In Korea, the split wasn't random; it was based on Soviet and American spheres of influence which were themselves strategic choices. In Africa, borders ignored ethnic lines but followed resource contours. Do these cases actually satisfy the exclusion restriction, or are they just post-hoc narratives with fancy econometrics draped over them?"

  *   **Follow-up (Keyed to predicted answer: Instruments fail because the 'treatment' was never randomly assigned):**
      "If the treatment was never randomly assigned in the first place, that implies a huge portion of the last twenty years of development literature is built on broken instruments. Do we need to throw those findings out entirely, or is there a way to salvage the data without relying on the assumption of exogeneity?"

  **6. The "Settler Mortality" Critique**
  "Your theory seems to have big implications for the famous 'settler mortality' arguments—the idea that Europeans only built good institutions where they didn't die of malaria. If boundary endogeneity is real, does that mean mortality rates didn't determine institutions, but rather determined *where the borders were drawn* in the first place? Are we mistaking the location of the border for the quality of the rule of law?"

  **7. Methodological Alternatives**
  "If Regression Discontinuity Designs and Instrumental Variables are compromised by this boundary problem, what should a young economist be doing instead? Are we looking at process tracing and historical archives, or is there a new econometric approach that accounts for the fact that the 'random' assignment was actually a strategic choice by colonial powers?"

  **8. The Policy Implication**
  "Finally, the 'so what?' If institutions aren't something you can just drop into a country from the outside because the borders themselves prevent them from taking root, what does that mean for foreign aid and intervention? Are you arguing that trying to transplant institutions across these endogenous boundaries is not just difficult, but theoretically incoherent?"
