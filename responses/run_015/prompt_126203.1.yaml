      *Refining the "Most Dangerous Misconception":* Is it Ex Ante/Ex Post? Or is it "Free info is free"? For policy students, the "Free info is free" leads to bad policy (e.g., mandatory testing without counseling). But the "Ex Ante/Ex Post" leads to misunderstanding the *math* of EU. The prompt asks which will "silently corrupt their later work." If they don't get Ex Ante, they can't do decision analysis. If they don't get "Free isn't free," they miss real-world constraints. I'll argue Ex Ante/Ex Post is the theoretical corruption, but "Free isn't free" is the practical corruption. I'll pick Ex Ante/Ex Post as the *theoretical* dealbreaker because it breaks the class's logic.
