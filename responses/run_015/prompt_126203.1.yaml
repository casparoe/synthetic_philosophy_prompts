prompt: |-
  you are a decision theorist who's taught rational choice to grad students something like a dozen times, and you're unusually good at spotting the exact point where peoples intutions go off the rails. Please brainstorm for a bit in bullet points before you commit to anything, and think carefully about the *dependency structure* — what has to be in place before what — rather than just dumping the textbook proof at me.

  I've got a 50-minute slot next week with about fifteen first-year public-policy masters students. They've had exactly one lecture on expected utility: they can read a decision tree, compute an expected value, and they've seen Bayes' rule once but they're shaky on it. They have never seen a value-of-information calculation. Most of them arrive thinking "more information is good, obvs," and at least a couple arrive thinking "but I'd actively not want to know my genetic risk score, so isn't that a counterexample?" I need them to come out actually getting Good's theorem — the result that for an expected-utility maximizer, an extra piece of free information has non-negative expected value, i.e. you can't, from the ex ante standpoint, be made worse off by being handed the option to look — and I need them to get *why* it holds and *where it breaks*. Don't explain the theorem to me and please don't give me a reading list; plan how I should teach it.

  1. The order the pieces have to go in, and what depends on what. My current instinct is: small acts/states table with a prior → value of acting now → "now suppose a signal arrives first" → the convexity bit (max of a mixture is at least the mixture of the maxes) → the punchline that the value is zero unless the signal can actually flip your act. But I keep going back and forth on whether the flipping point should come before the convexity point as the intuition, with convexity as the proof afterwards. Argue for an ordering and tell me what breaks if I do it the other way.

  2. One example to carry the whole session. I was thinking umbrella + weather forecast, because with two acts and two states I can draw the value of information as a function of the prior and it's that tent-shaped curve — zero near the ends, kinked, peaking right at the indifference prior. Tell me what the example has to have and what it has to lack. I'm worried a *perfect* forecast short-circuits the "how good does the information have to be" question, and I don't want any cost of acting, any repeated-play element, or anything strategic in the base case.

  3. The misconceptions, in the order they'll actually form them, and where in my sequence to defuse each. The ones I expect: "the theorem says you won't regret looking" (the ex ante / ex post slide); "the value of information is just how likely it is to change my mind"; "a more accurate test is always worth more"; conflating "I'd be better off if the world were a certain way" with "I'd be better off knowing which way it is"; and "free information is free, so there's never a reason not to look," which ignores that the act of finding out can perturb the world (asking your manager whether you're being made redundant makes it more likely; the diagnostic procedure itself has a complication risk). Which of these is the actually dangerous one — the one that'll silently corrupt their later work — and what am I missing from the list?

  4. Two failure cases I want to close on, and I need help sequencing them. (a) An agent who updates wrong in a particular way: she acts as if the likelihood ratio were raised to the power 1.5, so she over-reacts to signals. For her, more information can be actively harmful and she'd pay to stay ignorant. (b) An agent whose utility depends on her own credence — she likes suspense, or she hates the anxiety of knowing. Are these the same kind of failure of the theorem's assumptions, or structurally different failures? Which one first? And can I reuse the umbrella numbers from item 2 to make (a) concrete rather than hand-wavy?

  5. One question I can put on the board at the end that tells me whether they got the theorem rather than just the arithmetic — something that separates a student who's internalised "ex ante, about the option to look, for an expected-utility maximizer" from one who's internalised "information is good."

  6. What I should openly refuse to explain in fifty minutes, and say out loud that I'm skipping.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Experienced decision theorist, expert at spotting intuition failures, taught grad students many times.
      *   **Audience:** 15 first-year public-policy masters students.
      *   **Background:** 1 lecture on Expected Utility (EU), can read decision trees, compute EV, shaky on Bayes, never seen Value of Information (VoI).
      *   **Goal:** Teach Good's Theorem (VoI $\ge$ 0 for EU maximizers), *why* it holds, and *where* it breaks.
      *   **Constraints:** 50-minute slot. No textbook proof dumping. Focus on dependency structure. Brainstorm in bullets first.
      *   **Specific Questions to Answer:**
          1.  Ordering of concepts (Convexity vs. Action Flipping).
          2.  One core example (Umbrella/Weather?).
          3.  Misconceptions (ordering and defusing).
          4.  Two failure cases (Non-Bayesian updating vs. State-dependent utility/Information aversion).
          5.  Final board question (Conceptual understanding check).
          6.  What to explicitly skip.

  2.  **Deconstruct the Core Concept (Good's Theorem):**
      *   *Premise:* You have a decision problem. You have a prior. You have an option to observe a signal *before* acting. The signal is free.
      *   *Claim:* $E[U(\text{look})] \ge E[U(\text{don't look})]$.
      *   *Mechanism:* Conditioning on the signal allows you to tailor the act to the posterior. Since you *can* choose the same act as the prior optimal act if the signal doesn't change your mind, the worst case is indifference. The best case is switching to a better act for the new state.
      *   *Math:* $E[\max_a E[U|S]] \ge \max_a E[U]$. (Jensen's inequality / Convexity of the max function).
      *   *Caveats:* Must be Bayesian updater. Utility must not depend on the belief state itself (no suspense/anxiety). Signal must not causally affect the state (no Newcomb/observer effect). Signal must be free (no cost).

  3.  **Brainstorming & Dependency Structure (Mental Draft):**
      *   *Dependencies:* You can't talk about VoI without a baseline decision. You can't talk about the baseline without states and acts. You can't talk about the "value" without comparing the "look" tree to the "don't look" tree.
      *   *Intuition vs. Proof:* The "flipping" intuition is more accessible than "convexity of the max function." Convexity is the *reason* the flipping works mathematically, but "sometimes I switch, sometimes I don't, never worse off" is the policy student's hook.
      *   *Example:* Umbrella is classic. Needs specific numbers to show the "kink." If the forecast is perfect, VoI is high. If useless, VoI is 0. Needs to be imperfect to show the *expected* value calculation.
      *   *Misconceptions:* The "ex ante vs. ex post" is the biggest trap. If they think VoI means "you will never regret looking after you see the bad news," they miss the point. It's about the *option* value before the coin flip.
      *   *Failure Cases:* Non-Bayesian updating violates the rationality assumption. Utility over beliefs violates the state-separability assumption. These are distinct. Non-Bayesian is "broken engine." Utility over beliefs is "different destination."
      *   *Time Management:* 50 mins is tight. 10 intro/baseline, 15 VoI calc, 10 Intuition/Convexity, 10 Failure cases, 5 Wrap/Q.

  4.  **Addressing Specific Prompts:**

      *   **1. Ordering:** Flipping first, Convexity second. Why? Policy students care about *decisions*, not functions. "Information is valuable because it lets you change your mind when you need to" is the policy hook. Convexity explains *why* that averages out to non-negative. If you do convexity first, it's abstract math. If you do flipping first, it's actionable logic. *Risk:* If you only do flipping, they might think VoI is *only* positive when the action flips. Need to clarify that "not flipping" = 0 value, not negative.
      *   **2. Example:** Umbrella is good. Needs: 2 Acts (Take/Leave), 2 States (Rain/No Rain), 2 Signals (Forecast Rain/No Rain). *Crucial:* The forecast must be *noisy*. If perfect, they miss the probability weighting. If too noisy, VoI is 0 and they get bored. Need a "sweet spot" prior (near indifference). *Avoid:* Costs of umbrella (keep it simple utility), Repeated play (keep it one-shot), Strategic (keep it Nature).
      *   **3. Misconceptions:**
          *   "Won't regret looking" (Ex post vs Ex ante). *Dangerous:* Leads to thinking bad news is "bad value."
          *   "Value = Prob of flipping." *Dangerous:* Misses magnitude of improvement.
          *   "Free info = always look." *Dangerous:* Ignores psychological/causal costs.
          *   *Most Dangerous:* Ex ante/ex post slide. It undermines the definition of Expected Utility itself.
      *   **4. Failure Cases:**
          *   (a) Non-Bayesian (Over-reacting). This violates the "Rational Updater" assumption.
          *   (b) Utility over Credence (Suspense). This violates the "Consequentialist/State-Independent" assumption.
          *   *Order:* Do (a) first. It keeps the framework intact but breaks the math engine. (b) changes the framework entirely.
          *   *Reuse Umbrella:* Yes. Show how over-reacting leads to taking the umbrella when the posterior says "don't," lowering EU.
      *   **5. Final Question:** Needs to distinguish "Information is intrinsically good" from "Information is instrumentally good."
      *   **6. Skip:** Derivation of Bayes rule (give them the posteriors), Multi-stage info, Cost of info (mention but don't calc), Risk aversion (keep EU linear in money or fixed utility).

  5.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Tone:* Needs to be authoritative but pedagogical. "I've seen this mistake a thousand times."
      *   *Dependency Check:* Can I explain the "flip" without Bayes? Yes, if I give them the posterior probabilities directly. Don't waste time teaching Bayes; give the numbers.
      *   *Convexity:* Don't write $f(E[x]) \le E[f(x)]$. Draw the "V" shape of the value function against the prior probability. That *is* the convexity visualized.
      *   *Failure Case (a):* Make sure to emphasize that *she thinks* she's maximizing EU, but she's using the wrong likelihoods.
      *   *Failure Case (b):* Distinguish "I hate the news" (consequentialist, covered by Good) vs "I hate the knowing" (non-consequentialist, breaks Good).

  6.  **Drafting the Response (incorporating the "Brainstorm first" instruction):**
      *   Start with the bullet-point brainstorming as requested.
      *   Then move to the structured answers for 1-6.
      *   Ensure the "dependency structure" is highlighted.

