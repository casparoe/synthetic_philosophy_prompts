answer: |-
  *Brainstorming & Dependency Mapping*

  *   **Core Dependency:** You cannot define Value of Information (VoI) without a defined *baseline* decision problem. Students must lock in the "No-Info" optimal act and its Expected Utility (EU) *before* introducing the signal. If they don't anchor the baseline, they can't measure the delta.
  *   **The "Flip" vs. "Convexity" Tension:**
      *   *Flip Intuition:* "Info lets me switch acts when I was wrong." (Concrete, policy-relevant).
      *   *Convexity Proof:* "Max of expectations $\ge$ Expectation of max." (Abstract, math-heavy).
      *   *Risk:* If I lead with convexity, I lose the room in minute 5. If I lead with flipping, I risk them thinking VoI is *zero* if the act doesn't change (ignoring that the *option* to change has value even if unused).
      *   *Resolution:* Use the "Flip" to motivate, use the "V-shaped curve" (visual convexity) to solidify. The curve shows that even near the indifference point (where flips happen), the value is positive.
  *   **The Bayesian Bottleneck:** They are shaky on Bayes. If I make them calculate posteriors, I lose 15 minutes. *Dependency:* I must provide the likelihoods and posteriors pre-calculated or as simple integers. The lesson is about *decision structure*, not arithmetic.
  *   **The "Free" Trap:** The theorem assumes the signal doesn't change the state (causal independence) and doesn't enter the utility function (psychological independence). These are the exact points where policy students' intuition ("genetic testing anxiety") clashes with the math. I need to validate their intuition *by showing it violates the theorem's assumptions*, not by saying the theorem is wrong.
  *   **Failure Case Sequencing:**
      *   *Non-Bayesian:* Shows why the *math* fails (you update wrong, you choose wrong).
      *   *Utility over Beliefs:* Shows why the *model* is too narrow (you care about the journey, not just the destination).
      *   *Order:* Do Non-Bayesian first. It keeps the "world is objective" frame. Then do Utility over Beliefs to break that frame.

  ***

  ### 1. The Order of Operations

  **Recommended Sequence:**
  1.  **Baseline Decision:** Establish the "Blind" choice (Act A vs. Act B given Prior). Lock in the Optimal Act and its EU.
  2.  **The "Flip" Intuition:** Introduce the signal. Show a specific scenario where the signal changes the optimal act. Calculate the gain *in that branch*.
  3.  **The Aggregation (Convexity):** Show the *other* branch where the signal confirms the prior act. Value = 0 there. Average the two branches.
  4.  **The General Rule:** $E[\text{Look}] \ge E[\text{Don't Look}]$.
  5.  **The Boundary Conditions:** When is it equal? (When the signal never flips the act).

  **Why this order?**
  Policy students are teleological; they care about *outcomes*. Starting with convexity (Jensen's inequality) is a math lecture, not a policy lecture. Starting with the "Flip" gives them a causal mechanism: "Information prevents mistakes."
  **What breaks if you reverse it?**
  If you start with convexity ($\max E \ge E \max$), they will treat it as a black-box algebraic trick. When they encounter the "genetic risk" counterexample later, they won't know which assumption failed. If you start with the "Flip," you build the intuition that VoI comes from *contingent decision-making*. When you later introduce the "anxiety" counterexample, they can see: "Ah, the decision didn't change, but my utility did," which isolates the violation to the utility function, not the logic of updating.

  ### 2. The One Example: Umbrella + Noisy Forecast

  **The Setup:**
  *   **States:** Rain ($R$), Shine ($S$). Prior $P(R) = 0.4$.
  *   **Acts:** Umbrella ($U$), No Umbrella ($\neg U$).
  *   **Payoffs:**
      *   $U$: 0 utility (dry, burdened).
      *   $\neg U$ + Shine: +10 utility (free, dry).
      *   $\neg U$ + Rain: -20 utility (soaked).
  *   **Signal:** Forecast says "Rain" ($F_R$) or "Shine" ($F_S$).
  *   **Accuracy:** $P(F_R | R) = 0.8$, $P(F_S | S) = 0.8$. (Noisy, not perfect).

  **What it must have:**
  *   **Indifference Proximity:** The prior (0.4) must be close enough to the indifference threshold that a signal *could* flip the decision. (Here, EU($\neg U$) = $0.4(-20) + 0.6(10) = -2$. EU($U$) = 0. So $\neg U$ is optimal blindly. But if $P(R|F_R)$ goes above 1/3, $U$ becomes optimal).
  *   **Noisy Signal:** If the forecast is perfect, VoI looks like "avoiding disaster." If noisy, VoI is "weighted average of avoiding disaster and carrying umbrella unnecessarily."
  *   **One-shot:** No "I'll learn for next time."

  **What it must lack:**
  *   **Cost of the Forecast:** Keep it free to isolate Good's Theorem. Add cost later as a "real world" modifier.
  *   **Cost of the Umbrella:** Keep utility simple. Don't make the umbrella cost money, just "burden."
  *   **Strategic Elements:** Nature is passive. No "weatherman trying to trick me."

  ### 3. Misconceptions & Defusal Strategy

  **Order of Formation & Defusal:**

  1.  **"Value = Probability of Changing My Mind."**
      *   *When:* Immediately after the "Flip" intuition.
      *   *Defusal:* Show the branch where the forecast says "Shine." You stick with $\neg U$. Value = 0. But the *option* was valuable ex ante. Emphasize: VoI is the *weighted average* of the branches, not just the flip probability.
  2.  **"The Theorem Says You Won't Regret Looking (Ex Post)."**
      *   *When:* After calculating the "Rain" branch where you carry the umbrella and it doesn't rain.
      *   *Defusal:* **This is the most dangerous one.** It corrupts the definition of Expected Utility.
      *   *Fix:* Distinguish *Outcome Regret* ("I wish it hadn't rained") from *Decision Regret* ("I wish I hadn't looked"). You might be wetter because you looked and carried the umbrella, but you made the right decision given the info. Good's Theorem is about *Ex Ante Decision Quality*, not *Ex Post Luck*.
  3.  **"Free Information is Free."**
      *   *When:* During the wrap-up/failure cases.
      *   *Defusal:* Acknowledge their intuition (genetic testing). Explain that Good's Theorem assumes the signal doesn't enter the utility function. If "knowing" hurts, the utility function is $U(\text{State}, \text{Belief})$, not $U(\text{State})$.
  4.  **"More Accurate is Always Better."**
      *   *When:* If time permits.
      *   *Defusal:* True for EU maximizers, but only if "accurate" means "more informative in the Blackwell sense." Don't get bogged down here, but note it.

  **The Silent Corruptor:**
  The **Ex Ante / Ex Post slide** (#2). If they believe Good's Theorem guarantees they will feel better *after* knowing, they will misunderstand risk, regret, and the fundamental purpose of decision analysis. They will think decision theory promises emotional comfort rather than instrumental optimization.

  ### 4. Two Failure Cases (Sequencing & Concrete Numbers)

  **Sequence:** Do (a) Non-Bayesian first, then (b) Utility over Beliefs.

  **Case (a): The Over-Reactor (Non-Bayesian)**
  *   *Concept:* The agent updates using Likelihood Ratio$^{1.5}$.
  *   *Why First:* It keeps the utility function standard ($U(\text{State})$) but breaks the *engine* (updating). It shows that Good's Theorem requires *rational* processing.
  *   *Umbrella Reuse:*
      *   True Posterior $P(R|F_R) \approx 0.67$. (Optimal Act: Umbrella).
      *   Her Biased Posterior $\approx 0.85$. (Optimal Act: Umbrella).
      *   *Wait, need a case where bias hurts.*
      *   *Adjustment:* Suppose the forecast is weakly "Rain". True posterior is 0.3 (Stick with $\neg U$). Her biased posterior is 0.45 (Switch to $U$).
      *   *Result:* She pays the cost of the umbrella unnecessarily. Her EU *decreases* relative to the Blind baseline because she trusts the noise too much. She would pay to avoid the signal.
  *   *Lesson:* Information is only valuable if processed correctly.

  **Case (b): The Anxious Agent (Utility over Beliefs)**
  *   *Concept:* $U = \text{Money} - 5 \times (\text{Anxiety})$. Anxiety is high when $P(R)$ is near 0.5.
  *   *Why Second:* This changes the *vehicle*. It validates the "genetic testing" intuition.
  *   *Distinction:* Case (a) is "I calculated wrong." Case (b) is "I calculated right, but I care about the calculation itself."
  *   *Lesson:* Good's Theorem applies to consequentialists. If you have non-instrumental preferences for ignorance/suspense, the theorem doesn't bind.

  ### 5. The Final Board Question

  **Question:**
  > "A dictator is offered a free, perfectly accurate report on whether a proposed policy will succeed or fail. She is an expected-utility maximizer. She looks at the report, sees the policy will fail, and cancels it.
  >
  > **True or False:** The report had positive value *because* it stopped her from implementing a failed policy."

  **Why this works:**
  *   **The Trap:** Students want to say "True." It sounds right.
  *   **The Nuance:** The value existed *ex ante*, before she saw the result. If the report had said "Success," she would have implemented it, and the report's value in that branch was zero (she would have done the same act).
  *   **The Correct Answer:** **False (or Misleading).** The report had positive *expected* value ex ante because it gave her the *option* to cancel. In the specific *ex post* realization where it failed, the value was realized, but the *source* of the value was the ex ante optionality, not the specific bad news.
  *   **Better Phrasing:** "Did the report create value *at the moment she read the bad news*, or *at the moment she accepted the option to read it*?"
  *   **Target:** Separates "Information is intrinsically good" (False) from "The option to condition acts is instrumentally good" (True).

  ### 6. What to Openly Refuse to Explain

  **"I am skipping the Cost of Information."**
  *   *Say this:* "Good's Theorem proves free information is never harmful. In the real world, information costs money, time, or political capital. To analyze that, you simply subtract the cost from the VoI we calculated today. I'm not teaching you cost-benefit analysis today; I'm teaching you the upper bound of benefit."

  **"I am skipping the Derivation of Bayes' Rule."**
  *   *Say this:* "I am giving you the posterior probabilities. In your stats class, you learn to grind the formula. In this class, I care about what you *do* with the number once you have it."

  **"I am skipping Risk Aversion nuances."**
  *   *Say this:* "We are treating utility as linear enough for this example. Risk aversion changes the shape of the utility curve, but it does not break Good's Theorem. The theorem holds for any concave utility function as long as you are Bayesian. Don't confuse 'risk' with 'information'."
