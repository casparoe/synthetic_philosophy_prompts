          *   Ravens: 90.
          *   Non-Ravens: 10.
          *   If $H$ is false, there is at least one non-black raven.
          *   If we see a Black Raven, we just check one of the 90.
          *   If we see a Non-Black Non-Raven... wait, if $H$ is "All Ravens are Black", a Non-Black Non-Raven is consistent with $H$. It confirms $H$ by eliminating the possibility that *this specific object* was a counterexample (a non-black raven).
          *   To make $E_2$ stronger, the pool of "potential counterexamples" must be concentrated in the Non-Black class.
          *   Counterexamples to $H$ are Non-Black Ravens.
          *   To find a counterexample, you can look at Ravens (check if black) or look at Non-Black things (check if raven).
          *   If there are 1000 Ravens and 5 Non-Black things.
          *   If $H$ is false, there is a Non-Black Raven.
          *   That Non-Black Raven must be in the set of Ravens AND in the set of Non-Black things.
          *   If Non-Black things are extremely rare, finding one and seeing it's not a raven eliminates a huge chunk of the "danger zone".
