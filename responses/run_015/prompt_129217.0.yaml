      *   *Wait, does this work?*
          *   If I pick a random item and it's a Black Raven ($E_1$): I know this specific item isn't a counterexample. But there are 94 other Ravens.
          *   If I pick a random item and it's a Non-Black Non-Raven ($E_2$): I know this specific item isn't a counterexample (it's not a raven). But more importantly, I have sampled from the *Non-Black* class.
