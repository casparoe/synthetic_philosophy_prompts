          *   Total items: Small, countable.
          *   Property 1: Species (Raven vs. Other).
          *   Property 2: Color (Black vs. Other).
          *   Hypothesis: "All Ravens in this collection are Black."
          *   To make $E_2$ (Non-Black Non-Raven) stronger than $E_1$ (Black Raven):
              *   We need the set of Non-Black items to be very small.
              *   We need the set of Ravens to be very large.
              *   Why? Because a counterexample is a member of the intersection (Raven $\cap$ Non-Black).
