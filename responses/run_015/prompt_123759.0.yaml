answer: |-
  You have identified a sophisticated distinction in the logic of theory preservation. While there is no single, coined phrase that exclusively captures this specific duality (e.g., "The Taxonomic-Meteorological Paradox"), the mechanisms you describe are well-documented under the broader umbrellas of **immunization strategies**, **conventionalist stratagems**, and **ad hoc hypothesis formation**.

  Your intuition is correct: while both mechanisms serve the same logical function (reducing the empirical content of a theory to avoid falsification), they differ fundamentally in their epistemic potential. In the philosophy of science, the distinction usually hinges not on the *structure* of the adjustment, but on its **heuristic potential** (whether it generates new knowledge) and its **independent testability**.

  Here is an articulation of these concepts suitable for a seminar context, distinguishing the two mechanisms and locating them within established philosophical frameworks.

  ### 1. The Umbrella Concept: Immunization and Empirical Content

  Both cases fall under what Karl Popper called a **Conventionalist Stratagem**. This is any move made to protect a theory from falsification by altering the definitions, boundary conditions, or auxiliary assumptions without genuinely risking the theory in future tests.

  Logically, both moves reduce the **empirical content** of the theory. By narrowing the class (Case 1) or restricting the domain (Case 2), you reduce the number of potential observations that could contradict the claim. A theory that forbids less is easier to defend but explains less.

  However, philosophers generally distinguish between **legitimate theory refinement** and **dogmatic immunization**. Your two cases sit on opposite sides of this line, though they can look similar superficially.

  ### 2. Case 1: Taxonomic Subdivision (Differentiation)

  **Mechanism:** Modifying the *Subject Term* (the Antecedent).
  **Logical Form:** $ \forall x (Sx \to Px) $ fails. Revised: $ \forall x ((Sx \land \neg Qx) \to Px) $.

  In your biological example, the discovery of a counterexample leads to the positing of a new property $Q$ that distinguishes the exception.
  *   **Philosophical Status:** This is often **Progressive**.
  *   **Why:** In biology, taxonomy is not arbitrary; it aims to "carve nature at its joints." If the subdivision corresponds to a causal mechanism (e.g., genetic divergence, reproductive isolation), the revision is not merely saving the rule; it is discovering a new natural kind.
  *   **The Test:** Does the new subclass ($S_2$) have *other* predictive properties besides the exception? If placing the counterexample in a new subclass allows us to predict *other* traits about it (e.g., "This non-viviparous reptile also has a specific bone structure"), the move is scientifically legitimate.
  *   **Terminology:** This is often called **Differentiation** or **Specialization**. In Imre Lakatos's terms, if this subdivision leads to novel predictions, it is part of a **Progressive Problem Shift**.

  ### 3. Case 2: Retroactive Domain Restriction (Immunization)

  **Mechanism:** Modifying the *Conditions of Application* (the Context).
  **Logical Form:** $ Prediction \ P $ fails. Revised: $ Prediction \ P \ holds \ unless \ Anomaly \ A $.

  In your meteorological example, the "anomalous condition" is defined *by* the failure itself. There is no independent way to identify the anomaly before the prediction fails.
  *   **Philosophical Status:** This is **Degenerative**.
  *   **Why:** This is a classic abuse of a **_Ceteris Paribus_** (all else being equal) clause. By saying "the model holds unless an anomaly occurs," you are effectively saying "the model holds unless it doesn't."
  *   **The Test:** Can the "anomalous condition" be identified *independently* of the failure? If you cannot specify the condition that triggers the exception without referencing the exception itself, the move is **_ad hoc_** in the pejorative sense.
  *   **Terminology:** Popper would call this a **Conventionalist Stratagem**. Lakatos would classify this as a **Degenerative Problem Shift**. It protects the "hard core" of the model without adding to the "protective belt" in a way that yields new knowledge.

  ### 4. The Principled Distinction: Independent Testability

  You asked if there is a principled reason to treat them as the same or different. Logically, they are the same maneuver: **restricting the domain of validity.** However, epistemically, they are distinct based on **Independent Testability**.

  *   **Case 1 (Taxonomy) is valid if:** The property used to subdivide the class is detectable *prior* to observing the failure of the generalization. (e.g., We can identify the subclass genetically before we check its reproduction method).
  *   **Case 2 (Meteorology) is invalid if:** The "exception clause" is constructed *post-hoc* using the data of the failure itself.

  This distinction resolves the tension you observed. Case 1 expands our ontology (we now know there are two kinds of things). Case 2 shrinks our risk (we now admit the model applies to fewer situations, but we don't know which ones until after the fact).

  ### 5. Relation to "Grue" and "Ad Hoc"

  You correctly noted this is distinct from the **Grue Paradox**.
  *   **Grue** concerns *projectibility*: Which predicates are law-like enough to support induction?
  *   **Your Cases** concern *falsification avoidance*: How do we modify a theory when induction fails?

  You also mentioned **Ad Hoc adjustments**. In modern philosophy of science (following Lakatos and Worrall), "ad hoc" is not a binary label but a spectrum:
  1.  **Ad hoc1:** Explains the anomaly but nothing else. (Your Case 2).
  2.  **Ad hoc2:** Explains the anomaly and is independently testable.
  3.  **Ad hoc3:** Explains the anomaly, is independently testable, *and* leads to novel predictions. (Your Case 1, ideally).

  ### Summary for Your Seminar

  To articulate this clearly in your seminar, you might propose the following framework:

  1.  **Unified Logical Structure:** Both cases are instances of **Domain Restriction**. They protect an inductive claim by retrospectively shrinking the set of allowable inputs.
  2.  **Divergent Epistemic Value:**
      *   **Taxonomic Subdivision** is **Ontological Refinement**. It posits that the world is more complex than previously thought. It is acceptable if the new category has *explanatory depth* (it predicts other features).
      *   **Retroactive Restriction** is **Immunization**. It posits that the theory is correct but the world was "weird" this one time. It is unacceptable if the exception condition lacks *independent identifiability*.
  3.  **The Criterion:** The boundary between legitimate refinement and dogmatic protection is **Novel Predictive Power**. Does the modification allow us to predict something *new* that we couldn't before?
      *   If the taxonomy predicts new traits: **Progressive.**
      *   If the meteorological clause only explains the past error: **Degenerative.**

  **Conclusion:** You are describing two manifestations of **Theory Rescue**, but they represent opposite ends of the **Progressive/Degenerative** spectrum. There is no single name for the pair, but they are best discussed as **Differentiation** (Case 1) versus **Immunization** (Case 2). The principled reason to distinguish them is that one increases the informational content of the theory (by detailing new kinds), while the other decreases it (by excluding data).
