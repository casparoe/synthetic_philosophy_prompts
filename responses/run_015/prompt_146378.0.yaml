      *   **Specific Focus:** The narrative sequence (Marley $\rightarrow$ Three Spirits $\rightarrow$ Christmas Morning) mapped onto the distinction between acting in conformity with duty (from inclination/fear) vs. acting from duty.
      *   **Key Evaluation:** Is early generosity (after the first visitation) morally worthy? Is there a criterion distinguishing anxiety-driven giving from spontaneous benevolence?
      *   **Constraint:** Resist reducing the novella to a simple Kantian illustration. Acknowledge where Dickens resists the philosophical framework (e.g., emotional conversion vs. contemporaneous motivating reasons).
