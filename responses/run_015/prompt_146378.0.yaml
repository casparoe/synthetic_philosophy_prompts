  2.  **Deconstruct the Philosophical Framework:**
      *   *Wrong-Kind-of-Reasons (WKR) Problem:* Typically arises in value theory (reasons for belief vs. reasons for action), but here applied to moral worth. If I do the right thing because I'm afraid of punishment (prudential fear), do I get moral credit? Kant says no (acting from inclination/fear vs. duty).
      *   *Bootstrapping:* Can a bad motive lead to a good state where good motives eventually take root?
      *   *Kantian Distinction:* *Legality* (conformity with duty) vs. *Morality* (action from duty).
