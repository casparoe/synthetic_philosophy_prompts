answer: |-
  The Simple Conditional Analysis (SCA) proposes that to ascribe a disposition is merely to assert a subjunctive conditional: object $x$ is disposed to yield response $R$ to stimulus $S$ if and only if, were $x$ subjected to $S$, $x$ would yield $R$. This reduction is elegant, promising to eliminate occult powers in favor of modal facts about events. However, the biconditional fails because the truth of the conditional depends on factors extrinsic to the disposition itself.

  Consider two structural failures. First, the *fink*: $x$ has the basis for $R$, but the occurrence of $S$ triggers a mechanism that instantly removes that basis before $R$ can occur. Here, $x$ is disposed, but the conditional is false. The analysis fails left-to-right. Second, the *mask*: $x$ has the basis, $S$ occurs, but an extrinsic factor prevents $R$ without altering the basis. Here, too, the disposition is present but the conditional is false. While both yield false negatives, they break the analysis in different directions regarding repair. The fink shows the antecedent conditions cannot include the stimulus alone, for the stimulus itself may be hostile to the basis. The mask shows the consequent cannot be mere manifestation, for the causal path may be interrupted externally. One demands we hold the *intrinsic base* fixed across the counterfactual scenario; the other demands we hold the *extrinsic environment* fixed. Any repair must choose between protecting the property from the stimulus or protecting the manifestation from the world, and doing both simultaneously threatens to empty the conditional of content.

  Two repairs attempt to salvage the analysis. The first adds a *ceteris paribus* clause: $x$ is disposed to $R$ if $S$ iff, were $S$ to occur in *normal conditions*, $x$ would $R$. This handles masks by excluding extrinsic blockers from "normality." However, it invites circularity. Normal conditions for a fragile glass are those where it breaks when struck. But if "normal" is defined by the manifestation of the very disposition in question, the analysis defines disposition in terms of conditions defined by disposition. The second repair makes dispositions *gradable*: $x$ is disposed to $R$ in $S$ iff $x$ yields $R$ in a suitably high proportion of $S$-cases, with the threshold fixed by context. This accommodates indeterminism and occasional masking. Yet it fails to distinguish between a fragile object in a protective pad (low manifestation rate, high disposition) and a sturdy object in a volatile environment (low manifestation rate, low disposition). The proportion of manifestations tracks the *situation*, not the *power*.

  To see why these repairs fail and why a basis-grounded account is superior, consider three under-discussed cases.

  First, the *Flickering Masker*. A wire is in series with an indeterministic interrupter. On each trial where current should flow, the interrupter has a 0.6 objective chance of opening the circuit and a 0.4 chance of remaining closed. The wire's microstructure never varies. Is the wire conductive? The SCA predicts the wire is not conductive, or only weakly so, because the conditional "if connected, current flows" is false in the majority of trials. The Gradable Analysis predicts the wire is disposed to conduct to degree 0.4. The Basis-Grounded Account predicts the wire is fully conductive, as conductivity is a function of electron mobility in the lattice, which remains constant. The intuition here is unsettled but leans toward the Basis Account. We do not say the wire's conductivity fluctuates with the switch; we say the *circuit's* reliability fluctuates. The Gradable Analysis conflates the property of the object with the probability of the outcome.

  Second, the *Reset Fink*. Contact with a probe opens a relay; the relay closes one millisecond later with the probe still in contact, at which point current flows. The wire's intrinsic state is never altered; only the circuit topology changes temporarily. Is the disposition withdrawn or merely blocked? SCA is ambiguous: if the "response" is immediate flow, the conditional is false; if delayed flow counts, it is true. The Gradable Analysis counts it as a disposition, as manifestation eventually occurs. The Basis Account asserts the disposition is never lost, because the causal basis (the wire's structure) persists through the millisecond gap. This case clarifies the temporal window of manifestation. If we accept the Basis Account, we commit to the view that dispositions need not manifest *immediately* upon stimulation, provided the basis persists. The SCA, tied to the timing of the conditional's consequent, struggles to accommodate the delay without arbitrary stipulation about "relevant times."

  Third, the *Enabler that also Masks*. A loop is superconducting only while a cryogenic field is maintained. By a law of nature, that same field quenches instantly whenever current begins to flow. Without the field, there is no conductivity; with it, no current ever flows. Does the loop conduct electricity? SCA says no: if stimulated, the field quenches, and no current flows. The conditional is necessarily false. The Gradable Analysis says no: the proportion of successful manifestations is zero. The Basis Account says yes: the loop possesses the categorical structural property (Cooper pairing) that *would* ground conductivity were the law different. Here, intuition is genuinely torn. However, scientific practice treats the material as a superconductor whose potential is lawfully frustrated. The Basis Account captures this distinction between *having the power* and *being allowed to exercise it*. The conditional analyses collapse this distinction, rendering the material identical to a normal resistor.

  The pattern of verdicts favors the Basis-Grounded Account. In the Flickering Masker, it isolates the property from environmental noise. In the Reset Fink, it secures the property's persistence through temporary topological changes. In the Enabler/Mask, it distinguishes intrinsic capacity from lawful prevention. The conditional analyses fail because they tether the existence of the power to the success of its manifestation, whereas metaphysics requires distinguishing the *capacity* from the *opportunity*.

  Therefore, I conclude that dispositions are grounded in categorical bases. The conditional ascriptions serve only as defeasible evidence for the presence of the base, not as its definition. This conclusion incurs two costs. First, the basis is often specified in dispositional terms (e.g., "atomic bonds that resist breaking"), threatening circularity. Second, the same disposition (e.g., fragility) can be realized by vastly different bases (glass, ceramic, bone), suggesting the disposition cannot be identical to any single base.

  These costs are manageable. Regarding circularity, the regress stops at fundamental physical properties described structurally rather than functionally. A categorical base is specified by its spatiotemporal arrangement and fundamental forces, not by what it *does*. Regarding multiple realizability, the disposition is a second-order functional property: to be disposed is to *have some property or other* that plays the causal role. This preserves the unity of the disposition without denying the diversity of its grounds.

  The strongest objection to this view is epistemic: we have no access to categorical bases independent of their manifestations. If we cannot identify the base without observing the conditional behavior, positing it is metaphysically idle. The reply is non-question-begging: epistemic access does not determine ontological status. We identify heat via sensation, but heat is not identical to sensation. Similarly, we detect dispositions via conditionals, but the truthmaker for those conditionals is the categorical base. The metaphysics of what *makes* the conditional true is distinct from the epistemology of how we *know* it is true. To collapse them is to confuse the map with the territory.
