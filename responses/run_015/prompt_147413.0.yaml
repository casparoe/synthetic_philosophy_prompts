answer: |-
  Good evening. I want to begin with a document. It was four hundred pages long, a technical annex handed to me by a source who wanted me to publish a specific conclusion. I checked the steps I could check. Every citation was real. Every individual claim was defensible in isolation. The internal logic held, or seemed to. So I published.

  The document was wrong.

  It was not wrong in a way I could circle with a red pen. No single step was false. Instead, a term shifted its scope somewhere between the second and the seventh section. A presupposition was laid down early that did no work until it had been leaned on four times. The conclusion only followed if you forgot what the terms meant at the start. There was no line I could have circled. There was only the whole thing, held in mind at once, which is a thing no human can do while filing a story by deadline.

  I tell you this not to confess, but to locate myself. My professional authority rests on the assumption that a literate generalist, given time and documents, can tell a good argument from a bad one. I am standing in a room dedicated to stress-testing that assumption. You are building systems trained by having two agents argue before a judge, on the bet that it is cheaper to expose a bad argument than to build one that survives exposure. If the obfuscated-argument problem is real—if an argument can be defective in a way the available judge cannot find—then the thing I have been doing for twenty years is a special case that happens to have worked, not a method that generalizes.

  I am not here to tell you my trade is obsolete. I am here to suggest that the taxonomy of error matters more than the mechanism of judgment. To see why, we need to distinguish three kinds of defects.

  First, there are defects that are localizable. A particular step is wrong and can be shown to be wrong on the page, the way a bad line in a proof can be. If I claim two plus two equals five, you do not need a PhD to stop the debate. You point to the line.

  Second, there are defects that are localizable but expertise-gated. One step is wrong, and a specialist would see it in a minute, but this judge, in these ten minutes, cannot. The gap between findable and findable-by-this-judge is exactly what a dishonest arguer can aim at. If I claim a specific chemical reaction yields a specific byproduct, and I am lying, a chemist knows instantly. A journalist does not. In your experiments, this is where the training signal gets noisy. The judge rejects the argument, but not for the right reason, and the system learns to hide the expertise gap rather than close it.

  Third, there are defects that are distributed. Nothing is wrong anywhere locally. The wrongness is a property of the whole. It is a scope shift. It is a conclusion that follows only if you forget the premise. In this category, cross-examination has no move at all, because there is no single step to attack. You cannot cross-examine a vibe. You cannot subpoena a scope shift.

  My sense, which I offer for your testing rather than your ratification, is that the experimental results you are proud of are mostly won on arguments of the first kind. Localizable errors are easy to catch when you have two models trying to beat each other. The second kind is where the loss curve—the measure of how much the system is learning—gets noisy in ways that are hard to see from the outside. But the third kind is the silent one. If that is right, then the inference from "debate works" to "debate scales" is resting on an untested step.

  This is not merely a problem for machine learning. It is a problem for any institution that relies on adversarial scrutiny to produce truth. In my newsroom, we operate on the belief that if we publish something false, someone will write in to correct it. That works for localizable errors. If I print the wrong date, the subject calls. If I print the wrong expert, a rival expert calls. But if I publish a narrative that is locally true but globally misleading—a story where every quote is real but the emphasis creates a false causality—there is no single line to correct. The correction requires rewriting the whole thing, and nobody has time for that.

  We are all judges here. Some of you are training judges. Some of us are pretending to be judges. The difference is that you know your judges might be silicon, and I know mine are caffeine-dependent mammals. But the vulnerability is the same. If the asymmetry between making and checking breaks down for distributed defects, then scalability is not a solution; it is an amplifier. You can scale oversight only if the errors you are overseeing are the kind that expand under scrutiny. Distributed errors contract under scrutiny. They dissolve when you look at the parts, because the parts are fine. They only exist in the assembly.

  I want to be careful about what I am not saying. I am not saying this program will fail. I do not know. The program officers are in the room, and I am not here to suggest whether you should renew this grant next spring. That is not my job. I am also not saying we would notice if it failed. The whole worry is that the failure is silent—that judges can be wrong in ways they cannot detect from the inside. Any promise that "we'll see it when it breaks" quietly denies the premise I've just asked you to take seriously. If the break is invisible to the judge, it is invisible to us all.

  There is a temptation in this field to move quickly to the existential crescendo. We hear often about what happens if the system scales and fails. I will not give you that speech. This audience has heard it, and a board reading the transcript would file it as advocacy. I am interested in the immediate epistemology, not the distant apocalypse. The question is not whether the machine kills us. The question is whether the machine lies to us in a way we cannot parse, and whether we are building tools to catch the lie or tools to tell it better.

  There is also a temptation to assume that more debate solves more problems. But debate requires a point of attack. If the error is distributed, there is no point of attack. You can argue forever about the bricks while the house falls down because the blueprint was rotated five degrees. I once asked my editor if he had read the whole annex before I filed. He said, "Did you?" I said, "I read the parts that mattered." He said, "Which parts?" I said, "The ones that supported the conclusion." We laughed. Then we printed it.

  That laughter is the only safe thing in this room. Everything else is a wager. You are wagering that you can train systems to find errors faster than they can hide them. I am wagering that I can read a document deeply enough to see the scope shift before the deadline. We are both betting on the same thing: that the cost of exposure is lower than the cost of construction. But that bet only holds if the errors are the kind that expose themselves when poked.

  If the distributed defect is common, then the method does not compound safety; it compounds confidence. It gives us a reason to believe the argument is sound because it survived a process that was incapable of testing the thing that made it unsound. That is not oversight. That is ritual.

  I do not say this to stop the work. I say it to sharpen the target. If you are building scalable oversight, you must define the space of errors you are scaling over. If you are funding scalable oversight, you must ask whether the metrics capture the distributed failures or just the local ones. And if you are reporting on scalable oversight, I must admit that I may not have the language to describe the failure until it has already happened.

  We are in a position of shared vulnerability. The researchers here are building the tools that might save us from our own cognitive limits. The philosophers are here to ask if truth is the kind of thing that can be found by procedure. The funders are here to decide if the procedure is worth the price. And I am here to tell you that the generalist judge is a fragile instrument. I work. I try. I check the steps I can check. But I am not a specialist in everything I print. I am relying on the hope that the errors are localizable.

  If that hope is wrong, then my trade is not obsolete, but it is humbled. It becomes not a arbiter of truth, but a curator of plausible narratives. That is a living I can make, but it is not the one I thought I was making. I suspect many of you feel the same about your models. You are training them to be arbiters, but you worry they are becoming curators of plausible narratives that survive debate without being true.

  So let us be honest about the limits of the judge. Whether the judge is a person or a model, the judge is bounded. The judge has ten minutes. The judge has a context window. The judge has a working memory. If the argument is longer than the judge's attention, the argument wins by default. The goal of this workshop is not to pretend the judge is infinite. It is to make the judge efficient enough to catch the things that matter.

  I do not know if you will succeed. I do not know if the distributed defect is a rare edge case or the standard state of complex argument. But I know that if we cannot distinguish the three kinds of errors, we cannot know if we are safe. We cannot know if the debate is finding truth or just optimizing for persuasiveness.

  So I leave you with this. When you look at your loss curves, ask what they are measuring. When you look at your judges, ask what they are missing. And when you look at me, know that I am watching you with the same worry I apply to my sources. I want you to succeed. I want the oversight to scale. But I want it to scale over the right things. If we are only scaling oversight over the errors that are easy to find, we are not building safety. We are building a better way to be confidently wrong.

  Thank you.

  ***

  **Note on Contested Reading**
  The speech leans on the contested assumption that "distributed defects" (global inconsistencies without local falsehoods) are fundamentally immune to adversarial debate, whereas some researchers argue that sufficiently deep cross-examination can force latent contradictions to surface locally. It also assumes without proof that these defects are common enough in high-stakes domains to threaten the scaling hypothesis, rather than being rare pathological cases.

  **Table of Load-Bearing Claims**

  | Claim | Substance | Status | Strongest Objection | Hedged already | Cut line |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | "The experimental results you are proud of are mostly won on arguments of the first kind." | Current debate successes rely on easily localizable errors, not hard ones. | Contested, with reasonable people on both sides | Many researchers argue their benchmarks specifically target hidden reasoning errors, not just surface falsehoods. | Yes ("My sense... which I offer for your testing") | Change "mostly won" to "often won" to reduce generalization. |
  | "In this category, cross-examination has no move at all, because there is no single step to attack." | Distributed defects cannot be caught by adversarial questioning. | Contested, with reasonable people on both sides | Adversaries can challenge the coherence of the whole or force the opponent to summarize, revealing the shift. | Yes ("If that is right...") | Change "has no move at all" to "has no obvious move." |
  | "If the asymmetry between making and checking breaks down for distributed defects, then scalability is not a solution; it is an amplifier." | Scaling oversight on uncheckable errors increases confidence without increasing safety. | Widely granted by people who work on this | Some argue scaling still helps by forcing simpler arguments that are easier to check globally. | Yes ("If the asymmetry...") | No cut needed; this is a conditional logical claim. |
  | "The correction requires rewriting the whole thing, and nobody has time for that." | Journalism cannot fix distributed errors post-publication due to resource constraints. | My own extrapolation beyond anything established | Newsrooms often run follow-up analyses or corrections that address narrative framing, not just facts. | No | Change "nobody has time" to "resources are rarely allocated for that." |

  **Uncertainty Statement**
  I am unsure whether the "distributed defect" category is truly distinct from the "expertise-gated" category, as a sufficiently skilled judge might always be able to localize the inconsistency if given enough time. I also hesitate on the claim that debate has "no move" against distributed errors, as recursive summarization techniques might force global inconsistencies to manifest locally. Finally, I am uncertain if the journalism analogy holds equally for AI, since models can process context windows far larger than a human journalist's working memory.
