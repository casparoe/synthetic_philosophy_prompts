      *   **The Friend's View:** A single principle explains the legal/medical pattern: The negative right not to be touched (bodily integrity/consent). RoT is protected because it's a refusal of touch. AD is prohibited/limited because it requires positive action/help from another, which a negative right doesn't generate.
      *   **The User's View:** No single principle holds it together. It's a mix of acts/omissions, intention/foresight, causation (disease vs. drug), and professional integrity. It's incoherent or merely convenient, not philosophically consistent.
      *   **The Task:** Reconstruct the *implicit view* that would make the current pattern of practice *coherent* (not just convenient).
          *   Identify required elements (strictly necessary).
          *   Identify compatible elements (sit well).
          *   Identify underdetermined elements (rival theories license same practice).
          *   Evaluate specific constraints (self-administration, psychiatric exclusion).
          *   Determine what would change if the Friend's single principle were actually applied.

  2.  **Deconstruct the Current Practice Pattern:**
      *   **Refusal of Treatment (RoT):** Allowed anytime for competent patients, even if fatal, even if non-terminal. Justification: Consent/Bodily Integrity.
      *   **Assisted Dying (AD):** Generally illegal, or highly restricted (terminal, somatic, waiting periods, self-admin). Justification: Safety/Sanctity of Life/Slippery Slope (varies).
      *   **Palliative Sedation (PS):** Allowed. Foreseeably shortens life. Justification: Double Effect (intent is relief of suffering, not death).

  3.  **Evaluate the Friend's "Single Principle" (Negative Rights/Consent):**
      *   *Claim:* RoT is protected by negative rights (don't touch me). AD requires positive rights (help me die), which aren't covered.
      *   *Critique:* This explains RoT well. It explains why AD isn't a *right* in the same way. But does it explain why AD is a *crime*? A negative right theory usually permits liberty unless harm is done. If I consent to be helped to die, why is it a crime for the doctor? The friend's principle explains why the doctor isn't *obligated* to help, but not why the doctor is *forbidden* to help.
      *   *Implication:* If the friend were right, AD should be legal but not mandatory. The fact that it's criminalized suggests a stronger state interest (sanctity of life, public safety).

  4.  **Reconstructing a Coherent Implicit View (The "Standard Doctrine"):**
      *   To make the triad (RoT allowed, AD restricted, PS allowed) coherent, we need a specific ethical framework. This looks a lot like the *Doctrine of Double Effect (DDE)* combined with a robust view of *Bodily Integrity* and a specific view of *Causation*.
      *   *Core Principle:* The state/profession protects life, but respects bodily autonomy and intends only good.
      *   *Killing vs. Letting Die:* Must be morally significant.
      *   *Intention vs. Foresight:* Must be morally significant (DDE).
      *   *Causation:* Disease kills in RoT/PS; Agent kills in AD.

  5.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. It's about the "Standard Doctrine" of medical ethics/law.
      *   **The Coherent Reconstruction (The "Standard Doctrine"):**
          *   What makes it work? It relies on a hybrid of *Liberalism* (consent rules RoT) and *Paternalism/Deontology* (intent/causation rules AD).
          *   *Required Elements:*
              1.  **Bodily Integrity as a Trump Card:** Explains RoT. No touching without consent.
              2.  **The Moral Relevance of Intention (DDE):** Explains PS vs. AD. Intent to relieve suffering (good) vs. Intent to kill (bad), even if outcome is same.
              3.  **Causal Primacy of Pathology:** Explains RoT/PS vs. AD. In RoT/PS, the disease kills. In AD, the agent kills.
          *   *Compatible but not Strictly Required:*
              1.  **Professional Integrity:** The idea that healing is the telos of medicine. Fits well, but secular law might not need it.
              2.  **Slippery Slope Concerns:** Explains restrictions, but is empirical, not philosophical.
          *   *Underdetermined:*
              1.  **Acts vs. Omissions:** Philosophically shaky, but legally useful.
              2.  **Sanctity of Life:** Could be religious or secular (state interest).

      *   **Evaluating the Friend's Principle (Negative Rights Only):**
          *   If *only* negative rights mattered:
              *   RoT stays the same.
              *   AD should be legal (as a liberty), just not state-funded/mandatory. The state shouldn't criminalize consensual assistance if no third-party harm exists.
              *   PS might be scrutinized more (is it a positive act?).
          *   *Conclusion:* The Friend is wrong that one principle explains the *criminalization* of AD. Negative rights explain why you can't *force* a doctor to assist, not why the state arrests them for doing so.

      *   **Specific Constraints (Self-Admin & Psych Exclusion):**
          *   *Self-Admin:* Is it defensible? It reinforces the "agency" aspect. If the patient does the final act, it's closer to suicide (often decriminalized) than homicide. It acts as a safeguard for voluntariness. *Verdict:* Welded on for safety/causation reasons, not strictly required by the core ethics but supports the "patient agency" narrative.
          *   *Psychiatric Exclusion:* This is the hardest to fit. If autonomy is key, psych suffering should count. If "disease killing" is key, psych isn't a terminal disease. *Verdict:* This suggests the practice isn't fully coherent on autonomy grounds; it relies on a judgment about "rationality" or "treatability" of the suffering. It's a safeguard, not a philosophical necessity.

      *   **What Would Change if the Friend Were Right?**
