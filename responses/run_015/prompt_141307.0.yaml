answer: |-
  This is a precise dissection of the "Standard Doctrine" of medical ethics and law. To answer you, I will reconstruct the specific philosophical architecture required to make the triad of practices you describe (Refusal of Treatment, Assisted Dying, Palliative Sedation) internally coherent rather than merely historically contingent.

  Then I will test your friend's "Negative Rights Only" hypothesis against that architecture to see if it holds.

  ### I. Reconstructing the Coherent Implicit View

  For the current legal and medical pattern to be philosophically coherent (rather than a "pile of unrelated things"), it must presuppose a hybrid ethical framework. It cannot rely on a single principle (like autonomy or sanctity of life) but must rely on a specific **interaction** between consent, causation, and intention.

  Here is the reconstruction of the view that makes the practice consistent:

  #### 1. Strictly Required Elements
  These are the load-bearing walls. If you remove them, the distinction between the three practices collapses.

  *   **The Moral Relevance of Causal Pathways (Causation):** The view must hold that *who* or *what* constitutes the primary cause of death matters morally.
      *   *In Refusal of Treatment (RoT):* The cause of death is the underlying pathology. The removal of the tube is merely the removal of an impediment to the natural course.
      *   *In Assisted Dying (AD):* The cause of death is the introduced agent (the drug).
      *   *Coherence Condition:* There must be a "baseline of normal functioning." Interfering with a treatment is returning the patient to the baseline (where the disease kills); introducing a toxin moves them below the baseline (where the doctor kills). Without this distinction in causation, RoT and AD are identical in outcome and agency.
  *   **The Moral Relevance of Intention (The Doctrine of Double Effect):** The view must hold that the *aim* of the agent distinguishes permissible from impermissible acts, even if the foreseeable outcome is identical.
      *   *In Palliative Sedation (PS):* The intention is the relief of suffering. Death is a foreseen but unintended side effect.
      *   *In AD:* The intention is the ending of life (as the means to end suffering).
      *   *Coherence Condition:* Intention must carry more moral weight than foresight. If foresight were sufficient for culpability, PS would be indistinguishable from AD.
  *   **Bodily Integrity as a Negative Right (Consent):** The view must hold that the right to refuse intrusion is absolute, whereas the right to demand assistance is conditional.
      *   *In RoT:* The patient exercises a veto.
      *   *In AD:* The patient makes a request.
      *   *Coherence Condition:* Consent validates the *cessation* of a battery (treatment) but does not necessarily validate the *commission* of a homicide (assistance).

  #### 2. Elements That Sit Well (Compatible but not Strictly Required)
  These support the structure but aren't logically necessary for the core distinctions.

  *   **Professional Integrity (Telos of Medicine):** The idea that medicine is inherently directed toward healing or palliation, never toward destruction. This fits well with banning AD and allowing PS, but secular law could theoretically permit AD without violating medical ethics if the ethics were redefined. It supports the practice but isn't required for the *legal* coherence.
  *   **The Slippery Slope Empiricism:** The worry that allowing AD leads to non-voluntary euthanasia. This justifies the *restrictions* on AD (waiting periods, witnesses) but does not explain the fundamental distinction between AD and RoT. It is a pragmatic add-on to the philosophical core.

  #### 3. Philosophically Underdetermined Elements
  These are areas where rival theories could justify the same practice, meaning the practice doesn't prove which theory is true.

  *   **Acts vs. Omissions:** The law treats removing a ventilator (omission/allowing) differently from injecting poison (act/killing). However, philosophers disagree on whether this distinction is morally real. The practice *uses* this distinction, but it could theoretically be justified purely on Causation (see above) without relying on the metaphysics of acts/omissions.
  *   **Sanctity of Life vs. State Interest:** The prohibition on AD could be based on a religious view (life is sacred) or a secular liberal view (the state has an interest in preventing irreversible mistakes). The practice looks the same under either theory.

  ---

  ### II. The Specific Constraints: Self-Administration and Psychiatric Exclusion

  You asked whether these are independently defensible or welded onto the rest.

  **1. The Self-Administration Requirement**
  *   **Status:** **Welded on.**
  *   **Analysis:** This requirement is not required by the core ethical distinctions above. If the moral permission rests on *autonomy* and *suffering*, whether the patient swallows the pill or the doctor pushes the plunger is morally negligible (the "last act" theory).
  *   **Function:** It serves a **evidentiary and causal purpose**.
      *   *Evidentiary:* It proves contemporaneous consent.
      *   *Causal:* It keeps the doctor one step removed from the direct cause of death, preserving the "patient chose this" narrative over the "doctor killed this" narrative.
      *   *Coherence:* It is an attempt to bridge the gap between AD and RoT. By making the patient perform the final act, the law tries to categorize AD closer to suicide (often decriminalized) than homicide. It is a safeguard, not a philosophical necessity.

  **2. The Exclusion of Psychiatric Suffering**
  *   **Status:** **Independent Tension.**
  *   **Analysis:** This is the hardest element to make coherent with the rest of the framework.
      *   If the principle is **Autonomy/Suffering**: Psychiatric suffering is real and intractable. Excluding it is discriminatory and incoherent.
      *   If the principle is **Terminal Pathology (Causation)**: Psychiatric conditions are rarely "terminal" in the somatic sense. The patient isn't dying from the depression; they are dying from a choice made *because* of depression.
  *   **Coherence:** To make this coherent, the framework must presuppose that **rationality is compromised by psychiatric suffering** in a way it is not by somatic suffering. It assumes a somatic disease validates the request (as an inevitable end), while a psychiatric disease invalidates it (as a treatable distortion of will). This is philosophically contentious but necessary for the current "terminal/somatic" restrictions to hold.

  ---

  ### III. Testing Your Friend's "Single Principle"

  Your friend argues that **Negative Rights (Bodily Integrity)** explain everything: You have a right to be left alone (RoT), but no right to be helped (AD).

  If this single principle were actually the one driving the practice, the legal landscape would look significantly different. Here is what would have to change for your friend to be right:

  **1. Assisted Dying Would Not Be a Crime**
  *   **Current Practice:** AD is often classified as manslaughter or murder. The state actively prohibits it.
  *   **Friend's Principle:** A negative right theory explains why the state cannot *force* a doctor to assist. It does **not** explain why the state *forbids* a willing doctor from assisting a consenting patient.
  *   **The Change:** If only negative rights mattered, AD would be deregulated, not criminalized. It would be treated like other consensual risks (e.g., contact sports, cosmetic surgery). The state's involvement in prohibiting AD implies a **positive duty to preserve life** or a **public interest in the sanctity of life**, which contradicts the "Negative Rights Only" view.

  **2. Palliative Sedation Would Be More Scrutinized**
  *   **Current Practice:** PS is "ordinary medicine."
  *   **Friend's Principle:** PS involves positive acts (administering drugs) that foreseeably cause death. If the only moral shield is "negative rights" (don't touch without consent), PS is vulnerable. Consent is present, but the act is positive.
  *   **The Change:** Under a strict negative rights view, PS is harder to justify than RoT. The fact that PS is *easier* to justify legally than AD suggests that **Intention** (Double Effect) is doing the heavy lifting, not just Consent. Your friend's principle cannot distinguish PS from AD effectively, because both involve positive acts with consent.

  **3. Refusal of Treatment Would Be Absolute (No Paternalism)**
  *   **Current Practice:** In some jurisdictions, RoT can be overridden in specific cases (e.g., public health, minor children, sometimes pregnancy).
  *   **Friend's Principle:** If bodily integrity is the *sole* governing principle, these exceptions shouldn't exist.
  *   **The Change:** A pure negative rights regime would allow a patient to refuse a blood transfusion even if they have a minor child dependent on them. The fact that the law sometimes overrides RoT suggests there are competing positive duties (welfare of others) that your friend's single principle ignores.

  ### IV. Verdict

  **You are closer to the truth than your friend, but the practice is more coherent than you give it credit for.**

  *   **Your Friend** is wrong that a *single* principle explains the pattern. A Negative Rights theory explains RoT but fails to explain the criminalization of AD or the permission of PS. It explains why there is no *right* to assistance, but not why there is a *duty to prohibit* it.
  *   **You** are right that it is a "pile" of distinct concepts, but you underestimate how tightly they are welded. It is not a random pile; it is a **tripod** supported by:
      1.  **Consent** (validates RoT).
      2.  **Causation** (distinguishes RoT from AD).
      3.  **Intention** (distinguishes PS from AD).

  **The Conclusion:**
  The current practice presupposes a **Deontological Hybrid**. It treats the body as a fortress (Negative Rights) regarding intrusion, but treats the *act of killing* as a public wrong (Positive Duty) regardless of consent.

  If your friend's principle were the true operating system, **Assisted Dying would be legal but unregulated**, and **Palliative Sedation would be legally precarious**. The fact that AD is criminalized and PS is protected proves that **Intention and Causation** are doing moral work that "Negative Rights" alone cannot perform. The law is not just protecting the patient's right to be left alone; it is protecting the state's interest in not being a party to intentional killing.
