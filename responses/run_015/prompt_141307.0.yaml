      *   Current Law: AD is often *murder* or *manslaughter*. This requires a positive duty to preserve life, which contradicts the "Negative Rights Only" view.
      *   *Crucial Point:* The friend's principle explains why there is no *right* to AD, but fails to explain why there is a *prohibition* on AD.

  10. **Finalizing the Output Structure:**
