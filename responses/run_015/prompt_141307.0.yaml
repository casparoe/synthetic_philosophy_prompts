  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to just say "The friend is wrong." I need to show *why* the current practice presupposes a more complex view than the friend allows.
      *   *Nuance:* The "Coherent" view isn't necessarily *true* or *good*, just internally consistent. The user asked to reconstruct the view that makes the practice coherent.
      *   *Key Distinction:* The friend conflates "No right to assistance" with "Duty to prohibit assistance." Liberal theory usually allows the latter even if the former is true. The law goes further than the friend's principle.
      *   *Causation:* The "disease takes its course" fiction is crucial. A coherent theory must treat the removal of a barrier (ventilator) differently than the introduction of a toxin (drugs). This relies on a "Normal Baseline" theory of causation.

