              *   If I one-box, I get $1M$.
              *   CDT still says: Take both. The money is already there.
              *   EDT still says: If I two-box, it implies the prediction was likely "Two-box" (contradicting the score? Or implying the score is wrong?).
      *   *The Real Issue with the Score:* It introduces a **feedback loop**. If the subject sees the prediction, the prediction is no longer about the *natural* state, but about the state *after seeing the prediction*.
