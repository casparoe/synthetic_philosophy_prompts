  # Joint Statement on the St. Petersburg Paradox and the Architecture of Rational Choice

  **Signatories:** [Friend] and [User]
  **Date:** October 26, 2023
  **Subject:** Resolution pathways for expectation anomalies in decision theory

  Following our discussion regarding the St. Petersburg Paradox (SPP) and the implications of the "Compact Game" variant, we submit this document to record our points of convergence, our remaining substantive disagreements, and the empirical or conceptual tests we believe bear on the resolution. This is a statement of position, not a verdict.

  ### I. Agreed Claims

  We jointly affirm the following propositions regarding the formalism, the specific games discussed, and the requirements for any satisfactory resolution.

  1.  **Formalism and Convergence:** Within standard Expected Utility (EU) theory, a gamble is well-defined only if the series $\sum p_i u(x_i)$ converges. If the series diverges to infinity, the expectation is infinite; if it converges only conditionally (as in the Pasadena Game), the expectation is undefined and dependent on the ordering of terms.
  2.  **Requirements for Resolution:** Any repair to decision theory must prevent recommendations that lead to financial ruin or absurd behavior for finite agents in the actual world. A rational agent should not be compelled to pay a significant fraction of their wealth for a gamble where the probability of a return exceeding that cost is negligible.
  3.  **The Compact Game:** The game proposed (coin tossed until Heads or 10 Tails; payoff $2^{2^n}$ for Heads on toss $n$; 0 for 10 Tails) possesses finite support (11 outcomes) and a finite maximum duration. Despite this, its expected monetary value is approximately $2^{1014}$ dollars, while the probability of winning more than $10^9$ dollars is exactly $1/16$. We agree this game isolates the tension between *mathematical expectation* and *physical plausibility* without invoking infinite series.
  4.  **Conditionally Convergent Variants:** We agree that variants of the SPP where the payoff series is conditionally convergent (e.g., alternating signs) demonstrate that expectation maximization is mathematically fragile independent of the question of boundedness.
  5.  **Repeated-Play Asymptotics:** We agree that the Law of Large Numbers does not apply to the standard SPP or the Compact Game in a way that stabilizes the average payoff for a finite agent. Repeated play does not guarantee that the average return will converge to the expected value within any realistic timeframe or resource constraint.

  ### II. Table of Disagreements

  We diverge on the locus of the error in standard theory and the normative implications of unrealizable prospects.

  | Issue | Position A ([Friend]: Bounded Utility) | Position B ([User]: Decision Rule / Domain) |
  | :--- | :--- | :--- |
  | **Locus of Repair** | The repair belongs in the **utility function**. Rational preferences *must* be representable by a bounded utility function to ensure coherence. | The repair belongs in the **decision rule** or the **domain of application**. Expectation maximization is not mandatory for undefined/infinite prospects. |
  | **Undeliverable Prospects** | Normative theory must evaluate the *structure* of the gamble, even if the payoff exceeds physical limits. The impossibility of payout is a contingent fact, not a logical constraint on rationality. | Normative theory is only answerable to prospects an actual counterparty could offer. If a payoff is physically undeliverable, the prospect is void, and the theory need not judge it. |
  | **Motivation for Bounds** | Bounded utility is independently motivated by the requirement that preferences be complete and continuous over infinite domains. | Bounded utility is *ad hoc* in this context and creates unacceptable indifference between astronomical differences in value (e.g., saving 1 life vs. $10^{100}$ lives). |
  | **Infinite vs. Undefined** | Both infinite and undefined expectations are symptoms of the same disease: unbounded utility. Bounding $u(x)$ resolves both. | Undefined expectations (conditional convergence) indict the arithmetic of the rule itself, regardless of whether $u(x)$ is bounded. |

  ### III. Cruxes and Predictive Tests

  We identify three cruxes where our positions yield different explanations for the same behavior, or different behaviors in edge cases. For each, we specify a test case and our respective predictions.

  #### Crux 1: Normative Verdicts on Physically Undeliverable Prospects
  *The Question:* Does rationality require a verdict on a gamble that promises more resources than exist in the universe?
  *The Test:* Scale the **Compact Game** from 10 flips to 100 flips. The maximum payoff becomes $2^{2^{100}}$, vastly exceeding the number of atoms in the observable universe.
  *   **Prediction A ([Friend]):** Willingness-to-pay (WTP) remains **low and flat**. As the exponent scales, the utility of the payoff hits the upper bound of the agent's utility function. The agent treats the extra magnitude as irrelevant noise.
  *   **Prediction B ([User]):** WTP remains **low and flat**. As the exponent scales, the probability of the counterparty honoring the contract approaches zero. The agent rejects the gamble based on domain restrictions (counterparty risk), not utility saturation.
  *   **Divergence:** We agree on the *behavior* (low WTP) but disagree on the *mechanism* (saturation vs. invalidity).

  #### Crux 2: Bounded Utility and Astronomical Indifference
  *The Question:* Is it rational to be nearly indifferent between two guaranteed outcomes that differ by astronomical factors?
  *The Test:* A choice between **Guaranteed A** (Save 1 million lives) and **Guaranteed B** (Save $10^{100}$ lives).
  *   **Prediction A ([Friend]):** A rational agent *may* express near-indifference. If utility is bounded, the marginal utility of saving lives beyond a certain scale must approach zero. Preferring B over A is not strictly required by rationality if both exceed the "saturation point" of value.
  *   **Prediction B ([User]):** A rational agent *must* strictly prefer B. Utility regarding lives saved should not saturate while the outcome is logically possible. Bounded utility forces an absurd moral indifference. The SPP repair cannot come at the cost of moral coherence.
  *   **Divergence:** We disagree on the *behavior*. A accepts indifference; B rejects it.

  #### Crux 3: Infinite vs. Undefined Expectations
  *The Question:* Does bounding utility solve all expectation anomalies?
  *The Test:* The **Pasadena Game** (payoffs alternate in sign and decay such that the series is conditionally convergent).
  *   **Prediction A ([Friend]):** If utility is bounded, the series becomes absolutely convergent. The paradox dissolves because the expectation becomes well-defined and finite.
  *   **Prediction B ([User]):** Bounding utility masks the problem but does not solve the structural issue of the decision rule. If the payoffs are denominated in "value units" directly, the rule still fails to provide a unique verdict without arbitrary ordering conventions.
  *   **Divergence:** We disagree on the *sufficiency* of the repair. A sees bounded utility as a universal solvent; B sees it as a patch that leaves the rule's fragility intact.

  ### IV. Note on Verbal Disputes

  We acknowledge that a portion of our dispute is verbal, specifically regarding the definition of **"Rationality"** and **"Utility."**

  1.  **Rationality:** [Friend] employs an internalist definition: rationality is the coherence of preference orderings regardless of physical realizability. [User] employs an externalist definition: rationality is the successful guidance of action in the physical world. When [Friend] says "The theory must judge the prospect," they mean "The preference structure must be consistent." When [User] says "The theory need not judge," they mean "The agent need not compute an expectation."
  2.  **Utility:** [Friend] treats utility as a representation of *choice behavior* (which can be bounded by observation). [User] treats utility as a representation of *value* (which ought to track the magnitude of the good, e.g., lives saved, without arbitrary caps).

  **Resolution of Verbal Dispute:** We agree that if [Friend] admits that "boundedness" is a constraint on *modeling* rather than *value*, and if [User] admits that "decision rules" must incorporate *risk of default* as a formal probability, our behavioral predictions converge. However, we maintain that the *theoretical cost* of these admissions differs: [Friend] accepts moral indifference at the margins; [User] accepts incompleteness in the decision rule.

  ***

  **Signed,**

  _________________________ (Friend)

  _________________________ (User)
