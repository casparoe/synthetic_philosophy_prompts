      *   **Cranes:** Bottom-up mechanisms that build complexity from simpler parts (e.g., natural selection, neural networks). They rest on the ground (physics).
      *   **Greedy Reductionism:** The idea that you *must* explain everything immediately in terms of the lowest level (physics), skipping intermediate levels. Dennett actually *criticizes* greedy reductionism. He advocates for *good* reductionism (respecting levels of organization).

