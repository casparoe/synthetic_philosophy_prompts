      *   *Is it empirical stall?* Yes. Most data is observational (population distributions). We need process data.
      *   *Conclusion:* It's a **substantive disagreement obscured by verbal ambiguity and empirical underdetermination.** It's not *just* verbal, because the causal claims differ. It's not *just* empirical, because the definitions of key terms allow both sides to claim victory on the same data.

