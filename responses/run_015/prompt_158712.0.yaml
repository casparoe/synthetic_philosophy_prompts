answer: |-
  **INSTITUTE FOR NOMOTHETIC HISTORY**
  **INTERNAL MEMORANDUM 44-B**
  **SUBJECT: Guidelines for Quinquennial Law Submission (Round VII)**

  1.  **Definition of Historical Law.** Applicants must submit unconditional predictions regarding the structural development of society. Submissions containing initial conditions or background assumptions must attach **Schedule A (Conditions of Validity)**. Please note: For funding purposes, conditional technological forecasts attached to Schedule A are classified as "Provisional Laws." Do not label them "trends" on the cover sheet.

  2.  **Reflexivity and Publication.** Field 12 asks: *Will publication of this Law alter the event it predicts?* If checked "Yes," the submission must be filed under **Class-O**. Class-O Laws are authorized for publication only in the *Retrospective Supplement*, issued following the predicted event. This ensures the Law remains causally inert while maintaining public confidence in predictive capacity.

  3.  **Scientific Knowledge.** Laws predicting the content of future scientific knowledge are prohibited (Charter Section 9). Applicants may instead predict "structural adjustments necessitated by epistemic expansion." Loophole: You may predict the *social impact* of knowledge, provided the knowledge itself remains unspecified.

  4.  **Whole-Society Requirement.** Field 5 (*Complete Present State of Society*) is limited to 500 characters. Applicants unable to describe the totality of society within this limit may chop the historical sequence into distinct "Epochs." Submitting three sequential Epochs satisfies the Three-Instance Requirement for statistical validation. Epochs supplied by the applicant must not overlap.

  5.  **Schedule H (Human Remodelling).** If a certified Law requires behavioral changes incompatible with current human psychology, applicants must submit a Plan for Human Remodelling. This plan confirms that while the Law is inevitable, the population may require adjustment to fit the coming society.

  6.  **Inter-Departmental Coordination.** Complaints regarding expectation-driven variables in other disciplines (e.g., molecular biology) should be referred to Inter-Departmental Memorandum 99. Note: Memorandum 99 is currently pending issuance indefinitely.

  ***

  **APPENDIX: EXTRACT FROM FORM L-704/B (SUBMISSION DRAFT)**

  **Applicant:** Dr. Aris Thorne
  **Proposed Law:** The Great Consolidation.
  **Statement:** Society will inevitably move toward centralized digital administration.
  **Field 5 (Present State):** [TEXT TRUNCATED] ...fragmented markets, pre-consolidation anxiety, legacy analog systems...
  **Epochs Submitted:** 1. Industrial Era. 2. Post-Industrial Era. 3. Digital Era.
  **Field 12 (Reflexivity):** [X] Yes.
  **Filing Category:** Class-O.
  **Schedule H Attached:** Yes. (Plan includes mandatory neuro-linguistic conditioning to ensure acceptance of centralized administration.)

  **REVIEWER COMMENTS (MARGINALIA)**

  *   *[Next to Epochs]*: You've just chopped one sequence into three boxes. This is a trend, not a law. However, it meets the Three-Instance Requirement. **Approved.**
  *   *[Next to Schedule H]*: If you have to remodel humans to fit the Law, wasn't the Law contingent on the remodeling? **Resolved:** See Clause 5 (Inevitability is structural, not psychological).
  *   *[Next to Field 12]*: Biology Liaison Office notes: "We see this expectation-driven business in protein folding too. Maybe it isn't specific to history?" **Action:** Refer to Memorandum 99.
  *   *[Footer]*: **STATUS:** Certified. **PUBLICATION DATE:** 2045 (Event Occurred: 2044). **AWARD:** Gold Seal for Predictive Accuracy.
