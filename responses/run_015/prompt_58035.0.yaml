  **MEMORANDUM**

  **TO:** Collections Committee, Port City Heritage Trust
  **FROM:** Vice-Chair, Collections Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Designation and Maintenance of Pilot Schooner

  **Purpose**
  This memorandum recommends a resolution regarding the status of the late-1800s pilot schooner ahead of next month's registry filing. The conservation team proposes replacing the final original structural timbers to ensure seaworthiness, while simultaneously reassembling retired original planks into a static hull. We must designate only one hull as the "historic vessel" for insurance, grants, and ceremony. After reviewing stakeholder input and our charter, I recommend designating the **seaworthy sailing vessel** as the historic vessel.

  **Charter Interpretation**
  Our charter mandates preserving "historical integrity" alongside "continued community function." These aims diverge here. The historians' faction prioritizes material continuity, arguing that integrity resides in the original fabric. The sailors and donors prioritize functional continuity, arguing integrity resides in the vessel's capacity to perform its historic role.

  In maritime heritage, "integrity" traditionally encompasses design, workmanship, and setting, not solely material. Wooden vessels are inherently ephemeral; their survival depends on cyclical replacement. If we prioritize material atoms over function, we violate the "continued community function" mandate. A vessel that cannot sail is a sculpture, not a schooner. Therefore, the charter requires us to prioritize the vessel's operational identity, provided the design remains faithful to the original lines and construction methods.

  **Addressing Material Concerns**
  I recognize this decision is difficult for our historian colleagues. The strongest consideration against this recommendation is the loss of material authenticity. Once the final structural timbers are replaced, less than zero percent of the working structure remains original. This risks transforming the vessel into a replica in the eyes of strict preservation standards.

  However, this recommendation does not discard that material value. The reassembled hull of original timbers will be designated as a **Primary Collection Artifact**. While it cannot hold the "historic vessel" registry status, it will be curated with the same rigor as the sailing hull. This ensures the original material is preserved indefinitely indoors, protected from the elements that necessitated its removal. We acknowledge that material continuity is vital for research and interpretation, but under our charter, it cannot supersede the vessel's living function. This approach respects the historians' duty to preserve the past while fulfilling our duty to maintain a living tradition.

  **Implementation Plan and Timeline**
  To execute this decision, the following timeline is proposed:

  1.  **Immediate (30 Days):** File registry documents designating the seaworthy hull as the historic vessel. Secure insurance based on active use status.
  2.  **Pre-Festival (3 Months):** Conservation team to replace final structural timbers using period-correct methods. All removed original wood must be cataloged and transferred to the warehouse for the static hull assembly.
  3.  **Static Hull Assembly (6 Months):** Reassemble retired planks and frames into the complete non-seaworthy hull for indoor display. This exhibit must explicitly document the replacement history to educate the public on maritime preservation challenges.
  4.  **Review Cycle (5 Years):** The committee shall review the vessel's status every five years. If the sailing vessel requires replacement of more than 50% of its structure in a single cycle, we will reconsider the designation.

  **Precedent for Future Cases**
  This decision establishes a precedent for cases of gradual replacement versus reassembly. When a movable object's function is central to its significance (e.g., locomotives, aircraft, vessels), functional integrity outweighs material continuity provided the replacement is incremental and documented. When an object's significance is primarily aesthetic or static (e.g., buildings, furniture), material continuity takes precedence. This distinction allows the Trust to apply charter language consistently across diverse collections without compromising either aim.

  **Actionable Bottom Line**
  The Committee is asked to vote on the following actions:

  1.  **Designate** the seaworthy sailing vessel as the official "Historic Vessel" for all registry, insurance, and grant purposes.
  2.  **Authorize** the replacement of the remaining original structural timbers to maintain seaworthiness for the annual harbor festival.
  3.  **Classify** the reassembled original timber hull as a "Primary Collection Artifact" for indoor static display, ensuring its preservation without compromising the sailing vessel's operational status.
  4.  **Mandate** a five-year review of the vessel's material composition to ensure replacement rates remain within traditional maintenance norms.

  This path honors our donors' desire for active sailing, respects the historians' demand for material preservation, and adheres to the dual mandates of our charter.
