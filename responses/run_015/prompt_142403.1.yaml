answer: |-
  **Setting:** *The university canteen line. Priya is holding a tray with a chicken sandwich on it. Sam is behind her, holding a tray with a veggie wrap.*

  **Priya:** You're going to sigh, aren't you? I can hear the inhale from here.

  **Sam:** I'm not sighing. I'm just observing that you're holding the exact object we spent last Tuesday deconstructing.

  **Priya:** And I'm observing that you're still standing in line. Look, Sam, we went over this. The supplier operates on fixed batches. They order fifty crates every Monday. My buying this sandwich today doesn't change Monday's order. Next week is the same. I am causally inert.

  **Sam:** That's the threshold objection. It works if the system is purely discrete. But remember the mechanism Professor Vance had us invent in section? The "carryover rule."

  **Priya:** The buffer system? That was a thought experiment.

  **Sam:** It's a plausible model for how supply chains actually work. The idea is that the supplier's system logs every unsold unit in a digital buffer. It doesn't order crate-by-crate in real time, but it tracks the deficit. Once the buffer of unsold sandwiches hits fifty, the system automatically cuts the next delivery by one whole crate.

  **Priya:** Okay, assume that's true. It doesn't help me. Because *my* skipped purchase is just one unit. It doesn't hit fifty. So, on its own, it does nothing. It sits in a digital queue until it expires or gets lost in the data.

  **Sam:** But it doesn't get lost. That's the point of the buffer. It persists. Your single unit combines with forty-nine other people's skipped purchases over time. None of them triggered the crate reduction alone, but together they did. Your unit is a necessary part of the set that triggered the reduction.

  **Priya:** Is it? That's the leap I'm not making. If I put a drop in a bucket, and the bucket only empties when it's full, did my drop empty the bucket? No. The *collection* emptied the bucket. If I hadn't bought the sandwich, the buffer would just be one unit shorter. The crate would still ship eventually, just one cycle later. The harm happens either way.

  **Sam:** Not if the buffer creates a permanent reduction in total volume. If the system is sensitive to demand trends, lowering the baseline means fewer chickens are bred over the fiscal year. But look, let's stick to the mechanism. You're worried about the "rounding worry," right?

  **Priya:** Exactly. If the supplier only measures in crates, doesn't my single unit get rounded down to zero the second it's logged? If the algorithm says `IF buffer >= 50 THEN reduce_order`, then a buffer of 1 is functionally identical to a buffer of 0. My contribution is deleted by the logic of the system.

  **Sam:** It's not deleted; it's stored. Think of it like voting. If you vote for a candidate who loses by a million votes, your vote didn't decide the election. But it wasn't "deleted." It was counted toward the total. The carryover rule makes the supply chain sensitive to the *margin*, not just the threshold. Your unit moves the buffer closer to the trigger.

  **Priya:** But moving closer isn't *doing* something, Sam. It's potential. Expected Utility tries to fix this by saying, "There's a tiny probability you're the trigger, multiplied by the huge disutility of a crate." But nobody knows what that probability is. It's epistemic black box. You're asking me to act on a faith that my unit won't be the one that gets rounded off when the system resets.

  **Sam:** I'm not asking for faith. I'm asking you to acknowledge the structure. If the carryover rule exists, your action has a non-zero causal weight. It's not about being the trigger; it's about being a constituent of the trigger.

  **Priya:** Okay, let's grant you the causality. Let's say my skipped sandwich is mathematically necessary for that future crate reduction. Why does that give *me* a reason to skip it? This is where the fairness reply usually comes in, right? "Do your share."

  **Sam:** I'm not making a fairness argument. I'm making a causal one.

  **Priya:** You are, but it's hiding a normative claim. Because if I skip the sandwich, and forty-eight other people don't, the crate ships. My sacrifice was futile. If I buy it, and forty-nine others skip, the crate doesn't ship. My purchase was harmless. So why is skipping the rational choice? The "do your share" reply just says, "You shouldn't benefit from the cooperation of others without cooperating yourself."

  **Sam:** It's not about benefit. It's about complicity in the demand signal.

  **Priya:** That's just semantics for fairness. And it fails if the scheme isn't stable. If the system relies on me holding up my end, but the system doesn't guarantee others will too, I'm just guaranteeing my own lunch loss for no guaranteed gain in chicken lives. I'm being a sucker, not a moral agent.

  **Sam:** You're treating morality like a bet.

  **Priya:** I'm treating it like a reason. If the outcome isn't sensitive to my action *in isolation*, I need a different reason than "it prevents harm." Because it doesn't prevent harm in isolation. The carryover rule just delays the moment of inertness. Instead of my action vanishing today, it vanishes when the buffer resets or the contract renews.

  **Sam:** But the buffer doesn't reset to zero arbitrarily. It's a running log. That means your contribution has a longer half-life. It stays in the system, waiting to combine. That makes it *more* than inert. It makes it a standing condition for the reduction.

  **Priya:** A standing condition that might never be met. If the threshold is fifty, and the average skip-rate is ten a week, maybe the buffer never fills before the supplier changes the algorithm. Then my "stored contribution" was just data noise.

  **Sam:** So your argument is epistemic. You don't know if the buffer works.

  **Priya:** My argument is that *you* don't know either. You're positing a specific logistical architecture to save the consequentialist view. But if you're wrong about the architecture, you're back to causal inertness. And since we can't inspect the supplier's database, you're acting on a hypothesis.

  **Sam:** And you're acting on the hypothesis that it *doesn't* matter. That's the same epistemic gap. If there's a chance the carryover rule is real, and the stakes are chicken suffering, the expected value of skipping is still higher.

  **Priya:** Only if you accept the EU calculation. I don't. I think if the probability is unknowable, you can't multiply it by the utility. You end up with "unknown," not "positive."

  **Sam:** So you're paralyzed.

  **Priya:** I'm honest. I'm saying I don't have a *consequentialist* reason to skip. Maybe I have a symbolic one. Maybe I want to keep my hands clean. But don't tell me I'm preventing harm. With this buffer stuff, you're telling me I'm contributing to a pool that *might* prevent harm.

  **Sam:** Contributing to the pool *is* the prevention. The harm is prevented by the aggregate. The aggregate is just individuals. If you remove yourself from the aggregate, the threshold takes longer to hit.

  **Priya:** Takes longer. Not "doesn't happen." Delayed harm is still harm.

  **Sam:** Delayed demand is reduced demand. If the cycle pushes past the fiscal year, that crate doesn't get ordered.

  **Priya:** *If.*

  **Sam:** You're hanging everything on the *if*.

  **Priya:** Because that's where the reason is supposed to live. You want me to believe that my single unit, logged in a buffer I can't see, subject to a threshold I don't know, managed by a supplier I can't audit, constitutes a moral obligation.

  **Sam:** I want you to believe that the system is connected. That you aren't an island. The carryover rule just makes the connection visible.

  **Priya:** It makes the connection theoretical.

  *(Priya steps forward to the cashier. She puts the sandwich on the counter.)*

  **Sam:** You're still buying it.

  **Priya:** I'm buying it because I'm hungry, and because your "carryover" argument relies on me trusting a system designed to sell me sandwiches.

  **Sam:** So you admit, if the system were transparent, you'd skip it?

  **Priya:** I admit that if I knew my skipping definitely reduced a crate, I'd skip it. But I don't know that. I just know that right now, this sandwich exists, and it's going to be thrown away if I don't buy it.

  **Sam:** That's the waste argument. That's different.

  **Priya:** It's the only one that isn't speculative.

  *(Priya pays. Sam steps up, puts his wrap down.)*

  **Sam:** You know the buffer logs the sale, too. You just added a unit to the demand side.

  **Priya:** Then I hope someone else skips enough to cancel me out.

  **Sam:** That's exactly the problem.

  **Priya:** No, Sam. That's exactly the world we're in.

  *(Priya takes her tray and walks to a table. Sam watches her, then takes his wrap, looking at the cashier.)*

  **Sam:** Does this wrap go in the buffer?

  **Cashier:** *(Blankly)* Do you want a receipt?

  **Sam:** ...No.

  *(Sam takes his tray and follows Priya, but sits at a different table.)*
