      *Refining the "Fairness" point:* Priya needs to distinguish between "fair play" (doing your share in a cooperative scheme) and "consequentialist reason" (actually preventing harm). She should argue that even if the carryover rule exists, if the threshold is never met, no harm is prevented, so the fairness argument is just deontology in disguise.

