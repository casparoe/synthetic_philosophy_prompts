  2.  **Deconstruct the Philosophical Core:**
      *   **The Problem:** The "Causal Impotence" objection to individual ethical consumption. If my single purchase doesn't trigger a new order, did I harm anything?
      *   **Priya's Stance:** Threshold views. If the system is discrete (crates/batches), small changes vanish. Expected Utility (EU) relies on probabilities we can't know. Fairness arguments (complicity) don't address the *consequence* based reason.
      *   **Sam's Stance:** The "Carryover Rule" (a variation on the "triggering case" or "accumulative harm" models). It transforms discrete thresholds into a continuous accumulation over time.
      *   **The Conflict:** Does the *potential* to contribute to a future threshold count as causal efficacy *now*? Is the "buffer" real or theoretical? Does the "rounding" (discrete measurement) wipe out the individual contribution?

  3.  **Drafting - Section by Section:**

