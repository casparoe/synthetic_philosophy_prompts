  okay so ive been chewing on the "consciousness is a user illusion" framing - you know, the idea that what we call subjective experience is basically a compressed dashboard or UI layer that evolved to help an organism navigate social and physical space, not a direct window onto neural computation. every discussion i see either treats it as a shallow computer metaphor or uses it to dismiss phenomenology entirely, and i think both miss the point. so before i go deeper i want the actual spec.

  write the desiderata: what any serious theory in this space has to deliver if its going to be more than a catchy analogy. i need the full list of requirements - the phenomena it must explain (like why the illusion has this specific "feel", why agency seems built-in, why it fragments in split-brain cases or psychedelic states, why there's a sense of temporal continuity despite discrete processing), the distinctions it can't collapse (useful vs veridical, first-person access vs third-person prediction, the organism-as-user vs some subsystem being the user, evolutionary origin vs current function, and why these have to stay seperate not merged), and the neuroscience / cog-sci results it has to stay consistent with (predictive processing, global workspace dynamics, the binding problem - whatever applies).

