answer: |-
  Here is a specification sheet for a normative theory of the Right to the City (RttC) designed for practical zoning reform. This breaks down the logical requirements, the necessary distinctions, the inevitable trade-offs, and a comparative scorecard.

  ### I. The Desiderata (Test Cases & Requirements)

  An adequate theory must adjudicate the following four cases without resorting to ad-hoc intuition.

  **1. The Displacement Case (The Long-Term Renter)**
  *   **Scenario:** A long-term renter is evicted not for cause, but to convert units to luxury condos.
  *   **Requirement:** **Security of Tenure as a Precondition for Citizenship.**
  *   **Consideration:** The theory must establish that residence generates a moral claim stronger than mere contract law. If the city is a site of social reproduction, uprooting people destroys their capacity to participate in urban life. The theory must justify *why* time spent in a place creates an equity stake that competes with ownership title.

  **2. The Exclusion Case (The Homeowner vs. The Shelter/Density)**
  *   **Scenario:** A homeowner uses zoning to block a shelter or multi-family housing, citing property values or "neighborhood character."
  *   **Requirement:** **The Right to Insertion (Access).**
  *   **Consideration:** The theory must limit the veto power of existing residents over new entrants. It needs to define "harm" strictly (e.g., physical safety) rather than economically (property value) or aesthetically (character). It must argue that the opportunity to access urban opportunities (jobs, schools, networks) outweighs the incumbent's desire for exclusivity.

  **3. The Shadow Zoning Case (Informal Exclusion)**
  *   **Scenario:** Developers and community boards make informal deals to limit height or density without changing the code, effectively privatizing zoning power.
  *   **Requirement:** **Institutional Legibility and Publicity.**
  *   **Consideration:** A right that is negotiated behind closed doors is a privilege, not a right. The theory must demand that all constraints on the built environment be codified and publicly contestable. It must treat informal veto points as violations of urban due process.

  **4. The Dynamic Viability Case (Filtering & Supply)**
  *   **Scenario:** Strict protections for current residents freeze the housing stock, causing prices to skyrocket for everyone else (low supply elasticity).
  *   **Requirement:** **Intergenerational and Intra-urban Equity.**
  *   **Consideration:** The theory cannot privilege the *current* population so heavily that it makes the city uninhabitable for the *future* population. It must account for the metabolic needs of the city (labor flow, housing turnover). A theory that creates a "museum city" fails the justice test for outsiders.

  ### II. Necessary Distinctions

  Your theory will collapse if it conflates these three pairs.

  **1. The Right vs. The Remedy (Claim vs. Enforcement)**
  *   **Distinction:** Having a right to housing is not the same as having a specific unit guaranteed by the state.
  *   **Why it matters:** If your theory promises a specific outcome (e.g., "no one moves"), it becomes tyrannical. It must promise a *process* of protection and a *priority* of claim, not an immutable guarantee of stasis.

  **2. Individual vs. Collective Agency**
  *   **Distinction:** Lefebvre's RttC is fundamentally collective (the right to *make* the city), whereas liberal rights are individual (the right to *keep* my apartment).
  *   **Why it matters:** A renter might have an individual right to stay, but the neighborhood might have a collective right to transform. Your theory must explain how individual tenure claims interact with collective planning decisions. Does the collective right to densify override the individual right to low-density surroundings?

  **3. Procedural Fairness vs. Substantive Outcomes**
  *   **Distinction:** A fair hearing (procedure) can result in an unjust exclusion (outcome).
  *   **Why it matters:** Shadow zoning often looks procedurally fine (private meetings). A robust theory must assert that certain substantive outcomes (segregation, homelessness) are impermissible regardless of the process used to achieve them.

  ### III. Non-Negotiables vs. Camp Preferences

  **Non-Negotiable (The Floor)**
  *   **No Informal Vetoes:** Exclusionary power must be codified and subject to appeal.
  *   **Anti-Displacement Baseline:** Eviction without cause or relocation assistance is a violation of the RttC.
  *   **Basic Access:** Zoning cannot be used to render essential infrastructure (shelters, clinics) impossible to site.

  **Camp Preferences (The Variable)**
  *   **Local Autonomy vs. Regional Equity:** This is the main battleground.
      *   *Localist view:* Communities should control their own pace of change.
      *   *Regionalist view:* Housing is a regional resource; localities cannot hoard opportunity.
      *   *Verdict:* You must pick a weighting here; the theory cannot maximize both.
  *   **Preservation vs. Production:** How much weight is given to existing social networks vs. new housing supply?
  *   **Use Value vs. Exchange Value:** To what degree should property be de-commodified?

  ### IV. The Impossibility Theorems (Jointly Unsatisfiable Requirements)

  You need to teach your students that these tensions are structural, not just solvable puzzles.

  **1. The Stability/Mobility Paradox**
  *   **Conflict:** Guaranteeing every current resident a permanent, unchangeable place (Stability) conflicts with the residential mobility required for a functioning labor market and affordable housing supply (Mobility).
  *   **Resolution:** The theory must prioritize *security* over *stasis*. You have a right to not be arbitrarily displaced, but not a right to prevent the neighborhood from changing around you.

  **2. The Local Control/Inclusion Paradox**
  *   **Conflict:** Full inclusion (regional equity) is incompatible with meaningful local control (local autonomy) when local preferences are exclusionary.
  *   **Resolution:** If you prioritize the RttC as a right to *access*, local control must be curtailed. If you prioritize RttC as a right to *participate*, you risk allowing locals to vote against outsiders. You cannot have unlimited local veto power and open access simultaneously.

  **3. The Use/Exchange Paradox**
  *   **Conflict:** Maximizing the "use value" of the city for current inhabitants (quiet, low density) often requires restricting supply, which increases "exchange value" (prices), excluding others.
  *   **Resolution:** A theory must decide whose use value counts: the incumbent's or the potential resident's.

  ### V. Theoretical Scorecard

  **Henri Lefebvre (The Revolutionary/Use Value Model)**
  *   **Score:** High on Collective Agency; Low on Administrative Specificity.
  *   **Verdict:** Brilliantly diagnoses the problem of exclusion and commodification, but offers little guidance on zoning codes. It empowers the "urban dweller" but struggles to adjudicate conflicts between two groups of dwelllers (e.g., renters vs. homeless).

  **Libertarian Property-Rights View (The Market Model)**
  *   **Score:** High on Enforcement/Clarity; Low on Anti-Exclusion.
  *   **Verdict:** Solves the "Shadow Zoning" problem by demanding clear rules, but fails the "Exclusion Case." It treats the homeowner's veto as a property right, effectively legitimizing exclusion as long as it's codified, and offers no protection to the renter against market displacement.

  **Rawlsian Fair-Cooperation (The Distributive Justice Model)**
  *   **Score:** High on Regional Equity; Low on Local Agency.
  *   **Verdict:** Handles the "Displacement" and "Exclusion" cases well by prioritizing the least advantaged. However, it tends to treat the city as a black box for distribution rather than a site of political production, potentially overlooking the *process* of shadow zoning in favor of outcome metrics.

  ### Summary for Course Design
  If you want a theory that guides reform, you need a **Hybrid Institutional Model**. It must take Lefebvre's insistence on *participation*, combine it with Rawls' *priority to the disadvantaged*, and enforce it through Libertarian-style *codification* (killing shadow zoning). The core tension you should center in the syllabus is the **Local Control/Inclusion Paradox**, as that is where the actual zoning battles are fought.
