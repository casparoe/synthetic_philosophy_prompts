      *   *Correction:* The "Must-Land" reply needs to be about *why* this definition matters (AI Safety/Coordination), not just philosophical correctness.

  10. **Final Polish:** Check the voice. "Hey, this is bold..." "Here's the survival sheet..."

  *(Self-Correction on the "Bug" objection)*: The prompt asks to include the objection they are praying the audience skips (bug vs deception). I need to make sure I frame this as the "trap" question.

