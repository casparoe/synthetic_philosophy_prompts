answer: |-
  Hey, bold move taking on a Lewis room with no formal background, but honestly? That's kinda your edge. They'll expect the usual philosophy jargon; you're bringing the actual implementation reality. That said, since one of them literally wrote on Lewis, they're gonna smell blood if you misuse the framework.

  Here's your Q&A survival sheet. I've ordered these by how likely they are to derail your talk.

  ### The Concessions (Give these away early)
  Don't die on hills you don't need. Signal you're reasonable so they lower their guards.
  1.  **Concede the "Agent" point:** Admit upfront that the *model* isn't a moral agent with beliefs. Clarify that the convention is actually between **Developers and Users**, with the model acting as the *medium* of communication. You're analyzing the socio-technical system, not the weights.
  2.  **Concede on Common Knowledge:** Acknowledge that "common knowledge" in the strict Lewisian sense (I know that you know that I know...) is messy in AI. Frame it as "operational common knowledge"—documented specs and SLAs that function *as if* they were common knowledge for the sake of coordination.

  ### The "Must-Land" Reply
  **If you fumble this one, you're sunk.**
  They will ask: *"Why does this definition matter? If there's no intent, why call it deception?"*

  **Your Reply:** "Because for AI safety, **intent is unobservable, but coordination is critical.** If we define honesty as an internal mental state, we can never verify it, and we can't build standards around it. By treating it as a Lewis-style convention, we make honesty a **public, verifiable coordination mechanism**. It shifts the burden from 'did the model feel like lying?' to 'did the system uphold the regularity users relied on?' That's the only definition that allows for formal verification and accountability."

  *(Why this works: It appeals to the AI safety people in the room and sidesteps the cognitive science debate about minds.)*

  ### The Objections (Ordered by Damage)

  **1. The "Lewis Requires Agents" Objection (High Damage)**
  *   **The Vibe:** The Prof will lean back and say, "Lewis conventions are solutions to coordination problems between *rational agents* with preferences. A transformer is neither. You're describing a causal regularity, not a convention."
  *   **The Trap:** If you argue the AI is an agent, the cognitive scientists will eat you alive.
  *   **The Counter:** Double down on the concession. "Exactly. The AI isn't the agent. The convention is between **Dev and User**. The Dev promises a certain output regularity; the User relies on it. The AI is just the road we're driving on. When the AI hallucinates, it's not the road lying, it's the Dev violating the convention of road maintenance."

  **2. The "Arbitrariness" Objection (Medium-High Damage)**
  *   **The Vibe:** "Lewis conventions are arbitrary (we could drive on the left). Truth-telling isn't arbitrary. We *want* truth, not just consistency. So this isn't a convention, it's a norm of assertion."
  *   **The Trap:** They'll say you're misusing the word "convention."
  *   **The Counter:** Hit them with your **"Normative Residue"** idea here. "The *goal* (truth) isn't arbitrary, but the *implementation* is. We could have agreed that models say 'I don't know' vs. silence vs. probabilistic disclaimers. The specific regularity we settled on (confident assertions) is the convention. The 'residue' is why we still punish hallucinations even in creative writing where truth doesn't matter—we're enforcing the convention, not the truth-value."

  **3. The "Functional vs. Intentional Deception" Objection (Medium Damage)**
  *   **The Vibe:** The Cognitive Scientist will say, "Deception requires an intent to mislead. Your definition makes a broken thermometer a liar. It dilutes the concept."
  *   **The Trap:** Getting bogged down in semantics of "lie."
  *   **The Counter:** "I'm not defining 'lie' for a courtroom; I'm defining 'deception' for a system audit. In safety engineering, a component that signals 'green' when it's 'red' is a deceptive signal, regardless of intent. We need a functional definition to manage risk."

  ### The "Pray They Skip" Objection
  **The Bug vs. Deception Trap**
  *   **The Question:** "Under your view, if a random quantization bug causes the model to output false info, is that 'deception'? You said breaking the regularity is deception. So is a bug a lie?"
  *   **Why it's deadly:** If you say yes, you look insane (bugs aren't lies). If you say no, you undermine your thesis (so it's not just about regularity).
  *   **The Survival Answer:** Distinguish between **Systematic Violation** vs. **Noise**. "Conventions tolerate noise. A convention is a *robust* regularity. A bug is a breakdown of the mechanism, not a violation of the coordination agreement. However, if the Dev *knows* about the bug and deploys anyway, *that* is the deception. The convention holds the Dev accountable, not the code."

  ### Quick Tip on Delivery
  Don't try to sound like a philosopher. Sound like the engineer who has to build the thing they're theorizing about. When they get stuck on definitions, pivot to: "In practice, if we can't measure it, we can't manage it. My framework makes it measurable."

  Good luck. You got this. Just don't let them drag you into the weeds of "belief." Keep it on coordination.
