  How I built the tree
  I ordered questions from concrete external outcomes to internal psychological states, ending with meta-questions about the practice itself. This prevents early abstraction from biasing case judgments. Question 1 (Test) establishes the baseline definition of control over outcomes. Questions 2-4 (Panic, Group, Phone) probe the boundary of voluntary action versus habit and physiology. Questions 5-6 (Offense, Loop) test the limits of internal governance. Questions 7-8 (Climate, Failure) address collective agency and the status of the dichotomy itself. This flow ensures participants commit to specific intuitions before generalizing them into a worldview. The structure isolates whether "control" means causal power, moral accountability, or therapeutic utility. By placing the Loop case late, I avoid priming participants to doubt the dichotomy before they have applied it. The Climate case sits near the end to test the individual/collective boundary without contaminating earlier individualistic cases.

  The questions
  1. **The Test:** You studied hard and knew the material, but the teacher misgrades a question, costing you an A. What is up to you?
     A. The grade is mine; I controlled the performance.
     B. Only the studying was mine; the grade is the teacher's.
     C. Even studying was influenced by luck; nothing is fully mine.

  2. **The Panic:** Your heart races before a swim meet despite breathing exercises. Can you stop the feeling?
     A. Yes, a strong mind controls feelings directly.
     B. No, feelings happen; I control my reaction to them.
     C. No, feelings are biological; control is the wrong frame.

  3. **The Group:** Three partners must show up for your project to succeed, but they didn't reply to texts. Is their attendance up to you?
     A. Yes, I should have persuaded them better.
     B. No, only my contribution is up to me.
     C. No, but the project's success is up to us collectively.

  4. **The Phone:** You check your phone at 1 a.m. despite forty nights of promising yourself you wouldn't. Did you fail?
     A. Yes, you chose to check; it is a moral failure.
     B. Yes, but habits are hard; you need better systems.
     C. No, judging yourself adds pain to the habit.

  5. **The Offense:** Someone sends a rude message, though it was ambiguous if they meant it. Are you harmed?
     A. Yes, they insulted me personally.
     B. No, I judged it as an insult; I can judge otherwise.
     C. No, words are just sounds; harm is irrelevant.

  6. **The Loop:** You want peace of mind. Getting yourself to stop caring about outcomes is itself something you either manage or don't. Is achieving this mindset up to you?
     A. Yes, I choose to adopt this view right now.
     B. No, tranquility happens when I stop trying to control it.
     C. No, whether I succeed is itself not up to me.

  7. **The Climate:** You recycle, but factories pollute. Reducing emissions requires global action. Is this up to you?
     A. Yes, my personal footprint is my responsibility.
     B. No, individual action is useless without systems.
     C. No, it is not up to me, but it is up to us.

  8. **The Failure:** You yell at a friend about something outside your control. What happened?
     A. You failed morally; you claimed control wrongly.
     B. You slipped; practice makes perfect.
     C. The theory might be wrong about what is controllable.

  Scoring key
  Most A answers lead to **Strict Internalism**: only your own judgments are truly up to you; outcomes and feelings are external. Most B answers lead to **Effort-Based Stoicism**: your intentions and attempts are up to you, even if results fail. Mixed A and B with Question 4 leaning C suggests **Therapeutic Pragmatism**: the dichotomy is a tool for calm, not a metaphysical truth. If Question 3 and 7 are C, you hold **Collective Agency**: some things are up to us, not me. If Question 6 is C and Question 8 is C, you are in the **Fatalist Loop**: nothing is up to you, including this view. If Question 1 is A but Question 5 is B, you hold **Accountability Theory**: "up to me" means what I can be blamed for, not what I causally control. Any random scattering of answers indicates **Incoherent Intuition**: you haven't settled on a consistent definition of control. There are no unnamed leaves; every combination maps to a recognizable stance or a lack thereof.

  Unoccupied combinations
  One logically possible combination is "Outcomes are up to me, but judgments are not." This leaf is empty because it is incoherent: claiming control over grades while denying control over your assessment of those grades contradicts the agency required to pursue the grade. Another is "Feelings are up to me, but actions are not." This is unattractive because it suggests you can magically feel calm while being physically unable to act, which matches no human experience. A third is "The Loop is solvable, but Climate is purely individual." This is undeveloped; people who solve the Loop usually recognize interdependence, yet some modern Stoics miss this. These gaps show that while logic allows many positions, human psychology and social reality constrain which ones people actually inhabit or find livable.

  Where the tree can't separate positions
  The tree cannot cleanly separate **Strict Internalism** from **Accountability Theory**. Both yield identical answers on cases: both say the grade is not up to you and the judgment is. They differ only on why: one says you lack causal power, the other says you lack standing to blame others. Since the cases test intuitions about control rather than meta-ethical justifications, participants holding these distinct views will land on the same leaf. Similarly, **Therapeutic Pragmatism** and **Effort-Based Stoicism** blur on Question 4. Both recommend better systems over self-blame. The tree flags this by noting that B and C answers on habit questions produce similar behavioral advice despite different theoretical commitments about whether the dichotomy is true or just useful.

  Confidence
  I am highly confident (90%) that the Test and Offense cases correctly distinguish Strict from Effort views. I am moderately confident (70%) that the Climate case successfully isolates Collective Agency without confusing it with fatalism. I am least confident (50%) about the Loop case. It is unclear whether viewing tranquility as "not up to me" is a genuine philosophical difficulty or a confusion about levels of agency. If tranquility is a byproduct, saying it is not up to you might be correct, not fatal. This uncertainty means the Fatalist Loop leaf might actually contain people who have solved the Loop but describe it poorly.
