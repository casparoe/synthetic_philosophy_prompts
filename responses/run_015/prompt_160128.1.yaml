      *   *Self-Correction on the "Why Randomness" question:* If the user isn't arguing deliberative superiority, the "Why not Appointees?" question is fatal *unless* they argue that appointees develop *their own* long-term interests (caste formation) whereas lot prevents cohesion. I need to make sure the reply addresses *factional capture* of the appointment process itself.

