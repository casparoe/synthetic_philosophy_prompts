answer: |-
  ## Part 1: Instructor's Logic Map

  Before handing out the material, here is the logical space the tree maps. This ensures every answer combination leads somewhere, and helps you spot where the theories diverge.

  **The Four Diagnostic Dimensions:**
  1.  **Efficacy:** Does my choice change the physical outcome? (Tested: Plain vs. Coin-Flip).
  2.  **Correlation:** Does breaking the correlation save me? (Tested: Randomizer).
  3.  **Mechanism:** Does *how* the prediction happens change the advice? (Tested: Leaky/Simulation).
  4.  **Evidence:** Does the *timing* of my choice count as evidence? (Tested: 90% Clustered).

  **The Leaves (Positions):**
  *   **The Causal View (Causal Decision Theory):** Choice doesn't cause prediction. Timing doesn't matter. Randomizer helps only if it breaks the link.
  *   **The Evidential View (Evidential Decision Theory):** Choice is news. Timing matters (if errors cluster). Randomizer helps change the news.
  *   **The Control View (Marco's Point):** In simulation cases, you choose for the sim.
  *   **The Mechanism View (Underdescribed):** Refuses to answer without knowing if the prediction is physical or mental.
  *   **The Stable View (Ratifiability):** No choice is stable if you know you made it.
  *   **The Resigned View (Fatalist/Preference):** Outcome is fixed; choose based on taste or not at all.

  **Empty/Problematic Cells:**
  *   *Empty:* "Prediction doesn't matter, but Randomizer doesn't help." (Incoherent: if prediction is fixed, randomizing should either help or be irrelevant, but not harmful without reason).
  *   *Identical Advice:* **The Resigned View** and **The Hard Fatalist** both say "Pick Damascus," but one does it for preference and the other because "nothing matters." The tree flags this.

  ***

  ## Part 2: Student Handout — The Damascus Diagnostic

  **Instructions:** Read the five scenarios below. Answer the specific question for each. Do not worry about being "right"; answer based on your immediate intuition about what you would do or believe in that specific situation. Follow the arrows to find your position.

  ### Scenario 1: The Plain Case
  Death is an infallible predictor. He has already written down "Damascus" or "Aleppo." If you go where he wrote, you die. If you go elsewhere, you live. You know all this.
  *   **Q1:** By deliberating right now, can you raise your chance of being alive at dawn above 0%?
      *   (A) Yes, I can outsmart him. $\rightarrow$ Go to **Scenario 2**.
      *   (B) No, the prediction is already fixed. $\rightarrow$ Go to **Scenario 2**.

  ### Scenario 2: The Coin-Flip Control
  Death is not predicting you. Ten years ago, he flipped a fair coin. Heads = Damascus, Tails = Aleppo. If you go where the coin landed, you die.
  *   **Q2:** By deliberating right now, can you raise your chance of being alive at dawn above 50%?
      *   (A) Yes, I can choose the safe city. $\rightarrow$ Go to **Scenario 3**.
      *   (B) No, it's just luck. $\rightarrow$ Go to **Scenario 5** (The Resigned Path).

  *(Note: If you answered Q1=Yes and Q2=No, you believe you can outsmart a predictor but not beat a coin. This is logically unstable. Mark yourself as **Unnamed (The Outsmarter)** and stop.)*

  ### Scenario 3: The Rented Randomizer
  Back to **Infallible Death**. You can pay a small fee to let a fair coin decide your city.
  *   **Variant A:** Death predicted the coin toss outcome too.
  *   **Variant B:** Death predicted *you*, but he could not predict the coin (it is truly random).
  *   **Q3:** Do you pay the fee in Variant A? Do you pay in Variant B?
      *   (A) Pay in A, Pay in B. $\rightarrow$ Go to **Scenario 4**.
      *   (B) Don't Pay in A, Pay in B. $\rightarrow$ Go to **Scenario 4**.
      *   (C) Don't Pay in A, Don't Pay in B. $\rightarrow$ Go to **Scenario 5** (The Resigned Path).

  ### Scenario 4: The 90% Predictor
  Death is 90% accurate.
  *   **Variant A:** His 10% errors are scattered randomly across the population.
  *   **Variant B:** His 10% errors happen *only* to people who change their minds late in deliberation.
  *   **Q4:** In Variant B, does deliberating longer (changing your mind late) lower your survival odds compared to Variant A?
      *   (A) Yes, timing changes my odds. $\rightarrow$ **Leaf: The Evidential View**.
      *   (B) No, timing doesn't change the past prediction. $\rightarrow$ **Leaf: The Causal View**.

  ### Scenario 5: The Mechanism & The End
  You are on the **Resigned Path** (You believe you cannot change the odds in the Plain Case).
  *   **Q5 (The Leak):** Death didn't predict your mind; he bought a copy of your train ticket from yesterday. The ticket says "Damascus." Can you still go to Aleppo?
      *   (A) I need to know if the ticket *caused* my decision or just *recorded* it. $\rightarrow$ **Leaf: The Mechanism View**.
      *   (B) I don't need to know; the ticket is just evidence. $\rightarrow$ Go to **Q6**.
  *   **Q6 (The Simulation):** Death predicted you by running a perfect simulation of your brain. You are the real you.
      *   (A) I am choosing where my body goes. $\rightarrow$ Go to **Q7**.
      *   (B) I am choosing what the *simulation* does; my body follows the sim. $\rightarrow$ **Leaf: The Control View**.
  *   **Q7 (The Preference):** You know you will die in either city. Do you pick Damascus?
      *   (A) Yes, because I prefer Damascus. $\rightarrow$ **Leaf: The Resigned View**.
      *   (B) No, because neither choice is stable if I know I made it. $\rightarrow$ **Leaf: The Stable View**.

  ***

  ## Part 3: Scoring Key & Position Descriptions

  **The Causal View (Causal Decision Theory)**
  *   **Path:** Q1(B) $\rightarrow$ Q2(A) $\rightarrow$ Q3(B) $\rightarrow$ Q4(B).
  *   **Stance:** Your choice does not cause the prediction. In the Plain Case, you are doomed. In the Randomizer (Variant B), you pay because breaking the causal link saves you. In the 90% Case, timing doesn't matter because your deliberation doesn't reach back into the past to change the prediction.

  **The Evidential View (Evidential Decision Theory)**
  *   **Path:** Q1(B) $\rightarrow$ Q2(A) $\rightarrow$ Q3(B) $\rightarrow$ Q4(A).
  *   **Stance:** Your choice is *evidence* of the prediction. In the 90% Case (Variant B), deliberating longer is bad news because it correlates with being an "error type." You manage the news, not just the physics.

  **The Control View (Simulation/Updateless)**
  *   **Path:** Q1(B) $\rightarrow$ Q2(A) $\rightarrow$ Q3(B) $\rightarrow$ Q5(B) $\rightarrow$ Q6(B).
  *   **Stance:** (Marco's Point). If Death simulated you, the "choice" happened in the simulation. You are not choosing your fate; you are determining what the simulation did, which dictates what Death wrote. You have control over the prediction by controlling the sim's output.

  **The Mechanism View (Underdescribed)**
  *   **Path:** Q1(B) $\rightarrow$ Q2(A) $\rightarrow$ Q3(B) $\rightarrow$ Q5(A).
  *   **Stance:** The case is incomplete. If the ticket caused your choice, you can't change it. If it just recorded it, you can. You refuse to give an answer until the physical mechanism of the correlation is specified.

  **The Resigned View (Preference-Based)**
  *   **Path:** Q1(B) $\rightarrow$ Q2(A) $\rightarrow$ Q3(C) $\rightarrow$ Q5(B) $\rightarrow$ Q6(A) $\rightarrow$ Q7(A).
  *   **Stance:** Decision theory cannot save you. Since the outcome is fixed, you might as well die where you prefer. You treat the choice as aesthetic, not strategic.

  **The Stable View (Ratifiability)**
  *   **Path:** Q1(B) $\rightarrow$ Q2(A) $\rightarrow$ Q3(C) $\rightarrow$ Q5(B) $\rightarrow$ Q6(A) $\rightarrow$ Q7(B).
  *   **Stance:** You cannot endorse a choice once you know you've made it. If you choose Damascus, you know Death predicted Damascus, so you should have chosen Aleppo. No option is stable.

  **The Hard Fatalist (Unnamed)**
  *   **Path:** Q1(B) $\rightarrow$ Q2(B).
  *   **Stance:** You deny causal efficacy even in the Coin-Flip case. You believe your deliberation is an illusion.
  *   **Note:** This gives the same advice as the **Resigned View** ("Go to Damascus"), but for a different reason. The Resigned View says "It doesn't matter, so I'll pick my favorite." The Fatalist says "I can't pick at all."

  ***

  ## Part 4: Instructor Notes & Logical Space Flags

  **1. Identical Advice, Opposite Reasons**
  The tree identifies a pair of leaves that offer the same practical advice but stem from opposite philosophical commitments:
  *   **The Resigned View** vs. **The Hard Fatalist**.
  *   **Advice:** Both end up in Damascus (or wherever).
  *   **Difference:** The Resigned student thinks decision theory has *exhausted* its utility, so they switch to preference. The Fatalist thinks decision theory is *inapplicable* because choice is an illusion.
  *   **Discussion Point:** Ask these two students if they feel "free" to choose. The Resigned student will say "Yes, but it doesn't help." The Fatalist will say "No."

  **2. Empty/Incoherent Cells**
  *   **The "Outsmarter" Cell (Q1=Yes, Q2=No):** If a student thinks they can beat the Infallible Predictor but not a Coin Flip, they are pattern-matching "Damascus = Weird Answer" without a consistent theory. This cell is marked **Unnamed**.
  *   **The "Randomizer A" Cell (Q3=Pay in Variant A):** If a student pays for the randomizer even when Death predicts the coin, they believe they can break a correlation that is defined as unbreakable. This is logically incoherent in the context of the story.

  **3. Separating Causal and Evidential**
  Standard Newcomb problems often confuse these two because they give the same advice (One Box). This tree uses the **90% Clustered Predictor** (Scenario 4) to force a wedge between them.
  *   **Causal:** Timing doesn't matter (Past is fixed).
  *   **Evidential:** Timing matters (Late deliberation is evidence of being an error case).
  *   *Note:* If your group struggles with this, emphasize that in Variant B, the *type of person* who changes their mind is the type Death gets wrong.

  **4. Marco's Point (The Control View)**
  This is located at **Q6(B)**. It bypasses the standard Causal/Evidential split by changing the ontology of the choice. If the student selects this, they are arguing that in a simulation case, the "real" choice is the one the simulation makes, and the real world must conform to the prediction generated by that sim. This is a sophisticated "Updateless" or "Logical Control" intuition.

  **5. Technical Labels**
  The handout uses plain descriptions (e.g., "The Stable View") with technical names in parentheses (e.g., "Ratifiability") only in the Key. This keeps the student flow uncluttered while ensuring you can map their intuition to the literature during the discussion.
