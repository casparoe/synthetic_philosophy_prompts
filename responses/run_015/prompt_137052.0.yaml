          *   Distinguish settled views from contested readings (don't smooth over controversy).
          *   Flag load-bearing wording.
          *   Propose *one* revision to fix the most issues and state the resulting commitments.
          *   No citations needed, but accuracy regarding the landscape is required.
      *   **Tone:** Critical, analytical, helpful for a reading group defense.

  2.  **Analyze the Position File (The 10 Theses):**
