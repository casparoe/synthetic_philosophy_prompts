answer: |-
  She will likely judge both the simulated wife and the simulated valley as diminished goods, closer to reverie than the genuine articles.

  Two principles fit her track record equally well but diverge here:

  1.  **The Epistemic Condition:** Intrinsic value in affection and beauty requires the agent to believe the object is real. Knowledge of falsity collapses value toward mere internal state. (Fits: forgery, false friendship, known fiction, dead friend).
      *   *Prediction:* Both simulations = Low Value (Known falsity).
  2.  **The Ontological Asymmetry:** Beauty's value lies in the quality of experience (forgery); Affection's value requires a living subject (dead friend). (Fits: forgery, dead friend, unseen valley).
      *   *Prediction:* Simulated Valley = High Value (Experience intact); Simulated Wife = Low Value (No living subject).

  I take her to be running the **Epistemic Condition**. The "known fictional character" verdict is decisive: it treats aesthetic/artistic attachment as low value when the falsity is known, undermining Asymmetry's claim that beauty survives known simulation. The forgery case shows *actual* falsity doesn't matter, only *known* falsity. Since the widower knows both simulations are fake, both lose the organic unity required for the greatest goods.

  To separate these principles, I would put this case: **A real valley believed to be a simulation.** He experiences the same rapture but believes it is fake.
  *   **Epistemic Condition:** Predicts **Low Value**. The agent's belief in falsity diminishes the good, mirroring the known simulation cases.
  *   **Ontological Asymmetry:** Predicts **High Value**. The experience is genuine and the object is real; belief is irrelevant to aesthetic value (as per the forgery case).

  This isolates whether the ground of value is the agent's consciousness of truth (Epistemic) or the objective/experiential reality (Asymmetry). Given her commitment to Moore's isolation test and organic unities, she likely views the *conscious relation to reality* as the constitutive element of the whole's value, making the Epistemic Condition the stronger fit for her system.
