answer: |-
  Good morning, everyone.

  I want to start by telling you about a box I found last month. It was tucked under my gran's bed, stuffed with notebooks she'd kept from the late twenties through to the sixties. I opened them expecting to see dates I recognised—years, maybe months. But that's not what was there.

  She didn't date entries by kings or prime ministers. She dated them by harvest failures. By the year the herring boats didn't come back. By when the neighbour's boy returned from Bombay. There's an entry marked simply: *'After the frost took the potatoes.'*

  Now, I'm a historian by training. My instinct was to translate. I sat there with a pencil, trying to map 'the year the boats didn't come' onto 1932 or 1934. But the more I tried to force her timeline into mine, the more I felt I was erasing the logic of her life. Her chronology wasn't wrong; it was just organised around survival, not the state.

  And that's why I'm standing here today. Because this room is split. Half of you are trained to organise the past using the standard clocks of academia—interwar, postcolonial, modern. The other half of you are holding the boxes where time is measured in births, debts, and storms.

  This brings us to the knot we need to untangle this weekend.

  Usually, when we talk about 'archiving from the margins', we talk about inclusion. We say we need to add more voices to the historical record. And that's true. But I'm worried that's not enough. Because if we take my gran's notebooks and file them under 'UK Economic History, 1930s', we've included the document, but we've excluded the timekeeping.

  The tension here isn't just about disagreeing on what happened. It's about disagreeing on what counts as an event in the first place. For the academy, an event is often a treaty, a law, a battle. For the community archivist, an event might be the closure of the pit, the opening of the clinic, the flood that took the ground floor.

  These aren't just different perspectives on the same timeline. They are different timelines altogether.

  If we pretend there's a neutral, global calendar we can all appeal to, we're smuggling in a specific kind of power. We're saying that state time is the master clock, and community time is just local colour. But if we swing the other way and say every community lives in its own untranslatable past, we stop talking to each other. We end up in silos where the historians can't read the boxes, and the box-holders feel their stories are too messy for the history books.

  So the question for us is: how do we translate between incommensurable chronologies without forcing one to win?

  That's what I hope we do here.

  I know we can't solve the philosophy of time by Sunday afternoon. But we can set some practical ground rules for how we work together in this room.

  First, let's resist the urge to re-box too quickly. When a community archivist shows us a collection, let's spend time understanding the internal logic before we try to catalogue it into a national framework. Ask why this letter is tied with that one. Ask why this date matters.

  Second, let's be honest about the friction. If an academic category doesn't fit a family story, don't smooth it over. Name the mismatch. Say, 'This doesn't fit the interwar frame because this community wasn't living in the interwar period; they were living through the strike.'

  We need to create a space where we can hold two calendars at once. We aren't here to merge them into one smooth narrative. We're here to see how they rub against each other.

  To close, I want to come back to those notebooks.

  I haven't translated all the dates yet. I've stopped trying to. Instead, I've started making a key. On one side, gran's markers—*the frost, the boat, the wedding*. On the other, the standard years. I keep them side by side.

  That's my charge for this workshop. Don't try to convince the other half of this room that your clock is the right one. The historians shouldn't demand the community folks adopt archival standards that strip the life out of the records. And the community archivists shouldn't feel they need to apologise for records that don't fit the library catalogues.

  We are building a structure where the harvest failure and the general election can sit on the same shelf, and both are allowed to tell the truth about when things happened.

  If we can do that—if we can respect the time of the box as much as the time of the book—then we might just find a way to tell the past from everywhere at once.

  Thank you.
