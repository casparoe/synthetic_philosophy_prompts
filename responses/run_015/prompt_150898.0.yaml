answer: |-
  Utility is not a hidden engine driving choices, but a coordinate system we can only draw if the choices themselves form a consistent map.

  ### The Example: Fixing the Cafeteria Tray
  The cafeteria example fails if it implies *consumption* (hunger, taste) because that smuggles in mental states. It succeeds if it implies *affordability*.
  *   **What it must have:** Two goods (A and B), two distinct price regimes (Budget 1 and Budget 2), and a clear record of what was selected in each.
  *   **What it must lack:** Any narrative about why the agent liked the item. Do not say "they chose apples because they prefer them." Say "they chose apples when oranges were affordable."
  *   **The Fix:** Use "Compute Credits vs. Storage" or "API Calls vs. Bandwidth." It keeps the programmers in "resource allocation" mode rather than "pleasure maximization" mode. The core mechanic must be: *At prices P1, you could have bought Bundle Y but bought X. At prices P2, you could have bought Bundle X but bought Y.* This creates the contradiction needed for WARP without invoking happiness.

  ### The Session Plan (120 Minutes)

  **0:00–0:15 | The Hook: The Tautology Trap**
  *   **Action:** Write "Utility = Happiness" on the board. Cross it out. Write "Utility = Whatever they picked." Cross it out.
  *   **Claim:** "If utility is just a label for what happened, economics is astrology. If utility is a mental number, economics is theology. We are building engineering."
  *   **Misconception Head-Off #1 (Pre-existing):** *"Utility is a psychological cause."*
      *   **Intervention:** Explicitly state: "We are not modeling why they chose. We are modeling whether the choice pattern allows us to *assign* a number consistently."

  **0:15–0:45 | The Machinery: Choice Functions & Budget Sets**
  *   **Action:** Draw the budget lines. Plot the choices. Define "Revealed Preference" strictly as "Chosen when other was affordable."
  *   **Concept:** Introduce WARP (Weak Axiom of Revealed Preference) using the resource example. If A is revealed preferred to B, B cannot be revealed preferred to A.
  *   **Misconception Head-Off #2 (Early):** *"So this is just a tautology? You're defining preference as choice."*
      *   **Intervention:** Stop here. Ask: "Can I draw a set of choices that violates this?" Show a cycle (A chosen over B, B over C, C over A). "If behavior can violate the axiom, the axiom is not a definition; it's a constraint. Utility exists *only if* the constraint holds."

  **0:45–1:00 | Break**

  **1:00–1:30 | The Representation: From Consistency to Numbers**
  *   **Action:** Explain that if WARP holds (and some technical continuity stuff you will hand-wave), a Utility Function *exists* that reproduces those choices.
  *   **Concept:** Utility is a *representation theorem*, not a measurement.
  *   **Misconception Head-Off #3 (Mid):** *"Why not just ask them what they prefer? (Self-Report)"*
      *   **Intervention:** "Words are cheap data. Choices are expensive data. If they say they prefer A but buy B, revealed preference says their utility function ranks B higher. Their mouth is noise; their wallet is signal."

  **1:30–1:45 | The Friend's Argument & The AI Question**
  *   **Action:** Address the "Shadow Menu" argument directly.
  *   **Resolution:** Your friend is half-right. If "shadow menu" means *observed choices across many randomized price regimes*, that is just more data to test WARP. It makes the theory empirical/falsifiable. If "shadow menu" means *asking people what they would do*, it re-imports the mentalism Samuelson purged.
  *   **The AI Application:** "Can't read off AI goals from behavior."
      *   **Verdict:** Legitimate application, but often misused.
      *   **Correction:** You *can* read off goals if behavior is consistent. If the AI's behavior violates WARP (e.g., cycles resources), it literally *does not have* a coherent goal function to read. The problem isn't epistemic (we can't know); it's ontological (there is nothing to know).
  *   **Misconception Head-Off #4 (Late):** *"Money pumps prove the agent is stupid."*
      *   **Intervention:** "Money pumps prove the agent is *inconsistent*. An agent can be smart, powerful, and exploitable if it lacks a transitive preference ordering. Don't confuse capability with coherence."

  **1:45–2:00 | The Close & The Test**
  *   **Action:** Summarize the spine.
  *   **What to Explicitly Refuse to Cover:**
      1.  **Welfare Economics:** "Are they better off?" (We don't know, we only know they chose).
      2.  **Cardinal Utility:** "How much more did they like it?" (Ordinal only).
      3.  **Dynamic Preference:** "What if they change their mind over time?" (Treat each time-step as a different agent or hold constant).
  *   **Final Distinguishing Question:**
      "If I give you a dataset of choices that violates WARP, can I fix the model by adding a variable to the utility function, or must I conclude no utility function exists?"
      *   *Correct Answer:* No utility function exists. (Utility is a consequence of consistency, not a fit parameter for noise).
      *   *Wrong Answer:* You can add a variable/parameter to fit the data. (This treats utility as a causal model to be regressed, rather than a representation of logic).

  ### Misconception Map (In Order of Formation)

  1.  **"Utility is the cause of choice."**
      *   *When:* Pre-session/Intro.
      *   *Fix:* Spine statement. Utility is the shadow, not the object.
  2.  **"Revealed preference is a tautology (whatever happens is defined as preferred)."**
      *   *When:* Defining Revealed Preference (0:30).
      *   *Fix:* Show the violation (the cycle). If behavior can break the rule, the rule is empirical, not definitional.
  3.  **"We should use surveys/self-reports for ground truth."**
      *   *When:* Discussing counterfactuals (1:15).
      *   *Fix:* Distinguish "cheap talk" from "costly choice."
  4.  **"AI goals are fundamentally unknowable from behavior."**
      *   *When:* AI Application (1:40).
      *   *Fix:* Goals are unknowable *only if* behavior is inconsistent. If consistent, goals are uniquely identified (up to transformation).
  5.  **"Violating axioms means the agent is irrational/stupid."**
      *   *When:* Money Pump discussion (1:45).
      *   *Fix:* It means the agent is *incoherent*. A hyper-intelligent agent can be incoherent.

  ### Handling the Friend's "Shadow Menu" Argument
  Tell the room: "Your friend is describing **Inverse Reinforcement Learning (IRL)**. IRL assumes the agent is optimizing *something*. If you observe choices across many budgets (shadow menus), you can recover the reward function. But if the agent violates WARP across those menus, IRL fails. Your friend is right that more data makes it predictive, but wrong that it recovers a 'mental cause.' It recovers a 'consistent pattern.' If the pattern isn't there, the utility function isn't there."
