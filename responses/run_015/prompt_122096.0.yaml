answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, following a panel on evolutionary individuality. Jordan and Sam stand by the coffee station, holding mugs.*

  **Jordan:** The panelists kept circling the same ambiguity, Sam. We cannot continue to treat the host genome as the exclusive blueprint for the phenotype when, physiologically, the host is merely the scaffold for a complex microbial community. When those communities are vertically transmitted and metabolically integrated, they form what I call a "developmental consortium." Selection acts on the fitness of that consortium, not merely on the host's DNA.

  **Sam:** I agree that the microbiome is causally potent, Jordan. But potency does not confer unit-hood. My position remains one of causal-democracy: while microbial genes certainly contribute to the phenotype, evolutionary selection always tracks differences in replicator fidelity and abundance. The host genome and the microbial genomes remain distinct lineages. To claim they form a single unit of selection is to conflate ecological interaction with evolutionary individuation.

  **Jordan:** That reductionism ignores the mechanism of inheritance. You're assuming that because there is no shared pool of genetic replicators—no single genome merging host and bacteria—there can be no unified selection. But consider the transmission bottleneck. In many species, the host actively constructs the microbial environment for its offspring. This isn't random environmental acquisition; it is stable, transgenerational niche construction. The host builds the niche that ensures specific microbes are present to regulate development. That binding mechanism creates a functional unity that selection can target, regardless of genetic distinctness.

  **Sam:** You are describing a very tight ecological coupling, I grant you. But coupling is not inheritance in the evolutionary sense. For a "developmental consortium" to be a genuine unit of selection, it must exhibit discrete heritable variance at the level of the consortium itself. If the variance in fitness is actually reducible to variance in host genes interacting with variance in microbial genes, then you have two units interacting, not one unit evolving. Without discrete heritable variance mapped to the consortium, you cannot distinguish selection *on* the holobiont from selection on the host mediated by a stable environment.

  **Jordan:** But that distinction collapses when the "environment" is obligately maintained by the host's own physiology. If the host's genes code for the mechanisms that recruit and maintain the microbes, and the microbes are necessary for the host's survival, then the variance in host fitness is inseparable from the variance in the microbial community. The niche construction is the inheritance system. You are demanding a genetic bottleneck where a functional bottleneck suffices. If the consortium reproduces itself reliably across generations, it meets the criteria for evolvability.

  **Sam:** Reliability isn't the only criterion. Fidelity is paramount. In your model, the microbial component is subject to its own evolutionary dynamics, which may diverge from the host's interests. Cheater strains can arise within the microbiome that benefit themselves at the expense of the host. If the unit were truly singular, such internal conflict would be suppressed like somatic mutation. Because it isn't, the "consortium" is merely a temporary alignment of interests. To call it a unit of selection is to ignore that selection is fundamentally about the differential persistence of replicators. The host replicates its genome; the microbes replicate theirs. They do not replicate the "consortium."

  **Jordan:** You are privileging the substrate of inheritance over the process. Yes, internal conflict exists, but somatic mutation exists within multicellular organisms too. We don't say a human isn't an individual because cancer occurs. We recognize the developmental integration as the primary unit. Similarly, when transgenerational niche construction ensures that the microbial composition is restored every generation, the consortium behaves as a single reproductive entity. The selection pressure acts on the output of the whole system. If the system fails, both host and symbiont lineages terminate. That shared fate defines the unit.

  **Sam:** Shared fate is a consequence of selection, not the definition of the unit. The definition requires that the variance in that fate be heritable *as a property of the unit*. If I can explain the fitness differential entirely by referencing the host's alleles and the environmental frequency of microbial alleles, then positing a third entity—the consortium—is ontologically superfluous. It violates parsimony. You want to elevate a functional interaction to an evolutionary individual simply because the interaction is stable. But stability is a condition for selection, not the thing being selected.

  **Jordan:** And I argue that stability achieved through active physiological reconstruction *is* the mechanism of individuation. Evolution is not just about genes; it's about the preservation of functional organization. If the functional organization includes specific microbes maintained via niche construction, then the unit of preservation is the consortium. To deny this is to cling to a gene-centric view that cannot account for cases where the phenotype is emergently constructed by multiple genomes acting in concert.

  **Sam:** I deny nothing about the emergence of the phenotype. I deny that emergence creates a new replicator. Until you can show me discrete heritable variance that belongs to the consortium rather than its constituent genomes, I must maintain that there are only interacting units. The microbiome is a powerful environmental factor, Jordan, but it is not part of the host's evolutionary individuality.

  **Jordan:** Then we agree on the biology, Sam, but not on the ontology. I see a unified life cycle; you see a collision of lineages.

  **Sam:** Precisely. And in evolutionary theory, that difference determines where we locate the engine of adaptation.

  **Jordan:** Then I suppose the consortium remains, for now, a philosophical ghost.

  **Sam:** Or perhaps just a very well-integrated environment.
