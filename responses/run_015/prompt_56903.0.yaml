answer: |-
  The basement smelled of wet earth and old pennies. The dehumidifier hummed in the corner, a plastic box sucking gallons out of the air, its tank needing emptying every six hours. If the humidity rose above fifty-five percent, the clay sweat. If it dropped below forty, the clay dusted. I stood before the bust with the hygrometer in my hand, watching the needle tremble at forty-eight.

  My aunt, Elaine, stood behind me with the ledger open. She wore latex gloves, white against the dark grey of the studio tables.

  "Forty-eight is safe," I said.

  "It's borderline," she said. "Page forty-two. October 1998. She dropped to forty-five and the left ear cracked. She used three grams of slip to fix it."

  "She used water," I said. "The ledger says water."

  "It says 'aqueous binder with clay particulate,'" Elaine corrected. She turned the page. The book was thick, bound in black vinyl, filled with my grandmother's tight, slanting script. "Which means clay. Which means my clay."

  The will was specific, which was the problem. To me, the bust of my grandfather, "as it stands in the studio." To Elaine, "all remaining clay, including offcuts, spoil, and sweepings." For forty-five years, Grandmother had kept the bust alive. Unfired clay is temporary; it wants to return to mud. She had fought that entropy with misters, sprays, and injections. Every time a shoulder slumped, she propped it. Every time a cheek dried, she wet it.

  Elaine tapped the ledger. "Look at the cumulative mass column. 1979, the original build: forty kilograms. Current mass: sixty-two kilograms. Twenty-two kilograms of addition. That's more than half the object. By weight, this is my inheritance sitting on your board."

  "It's his face," I said.

  "It's mud," she said.

  We had to move it for the probate inspection. The studio door was too narrow for the board as it sat, so we had to take the bust off the plinth. This was the first violence. I held the torso while Elaine unscrewed the armature from the wood. The clay was cold and heavy, dead weight that wanted to slide. When we lifted the head, the neck severed cleanly. It wasn't a break; it was a separation of layers. The core was dark, hard, original 1979 clay. The outer inch was lighter, softer, added in 2010, 2015, 2021.

  I carried the head to the new room. It felt fragile, like a skull wrapped in wet paper. When we set it back down, we had to wire the neck back together. I mixed a slurry to seal the join. Elaine watched me smooth the wire into the collar.

  "You're using the bucket from the south table," she said.

  "It's slip."

  "It's sweepings from the floor mixed with water. That's 'spoil.' That's mine."

  "I'm just sealing the wire."

  "You're incorporating my property into your property without compensation."

  We didn't speak while we wired the arm. That was the second violence. The arm had fallen off last week, a clean break at the elbow. We had to replace the surface matter entirely to hide the scar. I took a sponge and wiped away the outer layer of the elbow, the dried skin of the previous repair. It came away as grey sludge. I applied fresh slip, feathering it out until the tone matched the cheek. I worked for an hour. By the time I stopped, every square inch of the elbow's surface was new material. The old surface was in the bucket.

  Elaine weighed the bucket on a kitchen scale. "Four hundred grams," she said. "Removed."

  "It's still the arm," I said.

  "It's a core of old clay with a skin of new clay. Like a snake."

  "It's Grandfather."

  "It's a liability."

  The ashes were discovered three days later. I was checking the base for cracks, running my thumb along the bottom edge where the clay met the board. I felt a grit that wasn't sand. I scraped it with a fingernail. A fine, white powder came away. Bone ash.

  I called Elaine. She came down immediately.

  "You knew," I said.

  "The will was filed on Tuesday," she said. She didn't take off her coat. "I had access until Thursday."

  "You kneaded him into the base."

  "I secured the asset." She looked at the bust, then at me. "If the bust is yours, the ashes are yours. If the clay is mine, the ashes are mine. Either way, he's in the room."

  "He's in the mud," I said.

  "He's in the evidence."

  We stood on opposite sides of the board. The dehumidifier clicked off. The silence was heavy, pressing against the damp walls. We both looked at the ledger open on the table. We both looked at the bust.

  "Page fifty," Elaine said. "Entry dated March 14th, 2023. 'Replaced entire epidermal layer due to desiccation cracking. Material sourced from Studio Bin C.'"

  "I was there," I said. "I watched her do it. She wiped it down and painted new skin on it."

  "Studio Bin C is designated spoil," Elaine said. "She harvested the dust from the floor, mixed it, and applied it. So the surface you are looking at is legally sweepings."

  "I'm looking at his face."

  "You're looking at a layer of dust bound with acrylic medium."

  "We agree on the entry," I said. "We agree on the source. We agree on the weight."

  "Yes."

  "We agree on the humidity."

  "Yes."

  "So how is this not the bust?"

  "Because the bust is the material logged in 1979," Elaine said. "That material is currently distributed across the floor, the bucket, and the base. What is on the board is a sculpture made of my clay, shaped like your grandfather."

  "What is on the board is the object Grandmother maintained for forty-five years."

  "Maintained by replacing it," she said. "She didn't preserve the object. She preserved the image. You inherited the image. I inherited the object."

  "She logged it as 'Repair,' not 'Rebuild.'"

  "She was an artist, not a lawyer. She logged what she did, not what it meant."

  I looked at the face. The eyes were hollow, unfired, dark pits. The lips were slightly parted. It looked like him. It looked like the man who taught me to fish, who smelled of tobacco and rain. But Elaine was right about the weight. If I scraped away the wet skin, the dark core remained, but it was jagged, incomplete. Without the new clay, it wasn't a face. It was a ruin.

  "If you take the clay," I said, "you take the ashes."

  "I know."

  "You'd grind him up with the sweepings."

  "I'd store him in a sealed container. Appropriate for remains."

  "He's not remains. He's sitting there."

  "He's dead. The clay is property."

  The probate hearing was scheduled for Monday. The dehumidifier bill sat on the table next to the ledger. It was due Friday. If I didn't pay it, the humidity would rise. The clay would swell. The cracks would open. If I paid it, I was maintaining the object, which Elaine could argue was acceptance of her terms—that I was caring for her property.

  I picked up the hygrometer. The needle had drifted to fifty-two.

  "I'm not paying the bill," I said.

  "Then it cracks," Elaine said.

  "Then it returns to what it is."

  "It's already what it is."

  "No," I said. I looked at the base, at the white grit mixed into the grey mud. "If it cracks, the ashes fall out. They mix with the floor. Then they're definitely sweepings. Then they're definitely yours."

  Elaine looked at the base. She looked at the ledger. She looked at me. For the first time, she took off her gloves. She folded them slowly, placing them on the table next to the open book.

  "If you let it crack," she said, "you destroy the image."

  "If I let it crack," I said, "you get everything."

  She stared at the bust. The silence stretched, filled only by the hum of the plastic box working hard against the damp. She reached out, not to touch the clay, but to touch the ledger. She ran a finger down the column of added mass. She wasn't looking at the object anymore. She was looking at the sum.

  "I'll pay the bill," she said.

  "Why?"

  "Because if it cracks, the ash disperses. I can't inventory dispersed ash." She picked up her gloves. "Keep it wet. Keep it whole. Until the judge decides who owns the mud."

  She walked up the stairs. I stayed in the basement. I watched the needle on the hygrometer. It held at fifty-two. I looked at the face, the new skin over the old core, the ashes ground into the bottom like gravel in concrete. I picked up the sponge. I dipped it in the bucket of slip. I began to wipe the cheek, smoothing the surface, adding weight, adding mass, adding her clay to my grandfather's face, keeping him together so she could take him apart.

  ***

  **Author's Note**

  I am moderately confident that I've represented the real options in this debate fairly, specifically the tension between *continuity of form* (the Narrator's position) and *continuity of matter* (the Aunt's position). In legal and philosophical disputes over art conservation, this is the central friction: is the artwork the specific physical atoms arranged at time *T*, or is it the sustained visual identity maintained over time *T+n*?

  The thing I am least sure of is the treatment of the **ashes**. I used them as a emotional lever to weight the Aunt's claim as "worse" in the final paragraph, implying that her legalistic claim reduces a human remain to inventory ("spoil"). However, in a real probate context, mixing ashes into art without consensus is often a distinct tort (desecration) separate from property law. By folding it into the property dispute, I may have smoothed over a distinction that would actually dominate the real-world outcome—if the ashes are legally "remains" rather than "property," the Aunt's kneading them into the clay might invalidate her claim to that portion of the material entirely. I leaned on the reading that once mixed, the ashes become part of the "clay" matrix, which is a contested metaphysical and legal boundary I exploited for narrative tension rather than accuracy.

  I also acknowledge that the **ledger framing** quietly rigs the story toward the Aunt's argument. By quantifying the replacement material down to the gram, the text makes the material replacement seem more total and calculated than it might feel in reality. In practice, "repair" often blends materials inseparably. The ledger creates a false precision that makes the "Ship of Theseus" problem solvable via arithmetic, which favors the Aunt's reductive position, whereas the Narrator is left defending a vibe ("It's his face"). This asymmetry was intentional to meet the constraint of making one claim feel worse, but it does tilt the philosophical playing field.
