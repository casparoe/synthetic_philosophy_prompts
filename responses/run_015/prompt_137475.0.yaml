answer: |-
  Based on the verdicts you've described, Dana isn't using a single rule. She's running a small decision tree. She distinguishes between *bugs*, *limits*, and *vague prophecies*.

  Here are the three operating rules that fit her track record, where they diverge on your IPv4 case, and which one she is almost certainly using.

  ### 1. Dana's Three Rules

  **Rule A: The "Stopped Clock" Filter (Falsifiability)**
  *   **Source:** Her zero-credit verdict on Fusion/AGI/Oil-running-out predictions that roll over every decade.
  *   **The Logic:** If a prediction doesn't have a hard deadline, it doesn't count. "Thirty years away" is not a claim; it's a mood.
  *   **Application to IPv4:** The early 90s prediction had a hard date (~2010). It passes this filter. This is where your coworker stops analyzing. He sees a specific date that matched and marks it "Vindicated."

  **Rule B: The "Y2K Exception" (Mitigation vs. Invalidation)**
  *   **Source:** Her Y2K verdict vs. her Malthus/Ehrlich verdicts.
  *   **The Logic:**
      *   If the prediction is **"There is a specific bug that will crash the system on Date X,"** and we spend money to patch the bug, and the system doesn't crash: **The alarmists were Right.** (The threat was real; the work proved it).
      *   If the prediction is **"There is a physical limit that will stop growth on Date X,"** and we innovate/prices adjust/growth continues: **The alarmists were Wrong.** (The limit was not binding; the theory was flawed).
  *   **Application to IPv4:** This is the crux of your argument. Your coworker treats IPv4 exhaustion like Y2K (a known technical debt that we managed). You treat it like Malthus (a resource constraint that the market engineered around).

  **Rule C: The Hubbert Distinction (Trigger vs. Consequence)**
  *   **Source:** Her Hubbert Peak Oil verdict.
  *   **The Logic:** You can get credit for the *number* (the trigger) without getting credit for the *story* (the consequence). Hubbert got credit for predicting the production peak (the number). He got *no* credit for predicting societal collapse (the story), because society didn't collapse; it found other energy sources.
  *   **Application to IPv4:** The engineers predicted the *number* (exhaustion ~2010) and the *story* (internet growth stops/breaks).

  ### 2. Where the Rules Diverge on IPv4

  Your argument with your coworker isn't about the facts; it's about which of Dana's rules takes precedence.

  *   **Your Coworker** is applying **Rule A (The Stopped Clock Filter)**. He sees a specific prediction with a specific date that came true. In his mental model, "Prediction: X happens in 2010" + "X happened in 2010" = Win. He is treating the exhaustion of the pool as the primary claim.
  *   **You** are applying **Rule C (The Hubbert Distinction)**. You are arguing that the exhaustion was merely the *trigger*, and the actual claim was about the *consequence* (growth hitting a wall). Since the consequence didn't happen, the prediction failed, even if the trigger date was accurate.

  **The Conflict:**
  If Dana prioritizes Rule A, your coworker wins.
  If Dana prioritizes Rule C, you win.
  Rule B (Y2K Exception) is the tie-breaker: Was IPv4 exhaustion a *bug* to be patched (Y2K) or a *limit* to be innovated around (Malthus)?

  ### 3. Which Rule Is Dana Running?

  Dana is most likely running **Rule C (The Hubbert Distinction)**, which means **she sides with you.**

  Here is the evidence from her own history:
  1.  **The Hubbert Precedent:** This is the strongest signal. She explicitly granted credit for the numerical peak (the trigger) but denied credit for the societal impact (the consequence). She separated the *arithmetic* from the *outcome*. In your IPv4 case, the arithmetic was right (pool dried), but the outcome was wrong (growth continued). She has already ruled on this exact structure.
  2.  **The Malthus/Ehrlich Precedent:** In both cases, the "resource constraint" prediction failed because human innovation (Green Revolution, substitutes) changed the equation. She calls them "Wrong." She does not treat "we found a workaround" as vindication for "we will run out." She treats it as falsification.
  3.  **Why Y2K is Different:** Y2K was a binary logic error in existing code. It wasn't a resource limit. You couldn't "innovate" your way out of Y2K with a market mechanism; you had to rewrite the code. IPv4 exhaustion was a resource limit overcome by abstraction (NAT) and new protocols (IPv6). Dana views resource limits that don't bind as false predictions (Malthus), not successful mitigations (Y2K).

  **Dana's Likely Verdict:**
  "Partially right on the date, wrong on the claim. The engineers nailed the exhaustion timeline, but they failed to predict the elasticity of the system. Since the internet didn't stop growing, the Malthusian claim that it *would* stop is falsified. Like Hubbert, they get points for the math, but the verdict on the 'disaster' is Wrong."

  ### 4. The Tie-Breaker Case

  If you want to be 100% sure before you bet lunch on this, you need to ask her about a case that splits the difference between **Y2K (Fix the bug)** and **Malthus (Innovate around the limit)**.

  **Ask her this:**
  > "What's your verdict on the **1980s predictions that we would run out of Radio Frequency Spectrum**?"

  **The Context:**
  In the 80s/90s, telecom engineers predicted we would literally run out of usable radio frequencies for mobile phones and broadcasting. They said growth would hit a hard wall.
  **What happened:** We didn't run out. We invented better compression (CDMA, OFDM), we reused frequencies more aggressively (small cells), and we moved services to digital. The "limit" was pushed out indefinitely by engineering, not just by spending money to patch a bug.

  **Why this settles it:**
  *   **If she says the alarmists were RIGHT (like Y2K):** Then she believes that *any* known technical constraint that is successfully managed counts as vindication. **Your coworker wins the IPv4 bet.**
  *   **If she says the alarmists were WRONG (like Malthus):** Then she believes that if a "hard limit" turns out to be soft because of engineering innovation, the original prediction was false. **You win the IPv4 bet.**

  Given her Hubbert and Malthus verdicts, my money is on her calling the Spectrum alarmists **Wrong**, which confirms she's on your side regarding IPv4.
