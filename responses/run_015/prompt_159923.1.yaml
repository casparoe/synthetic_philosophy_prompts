  # Sidebar: Is Your Brain a Computer?

  **Instructions:** *This tool does not tell you what to think. It sorts your intuitions about physical systems into the philosophical positions currently debated in neuroscience. Start from the shared baseline that **neuroscientists' descriptions of neural circuits track real causal structure**. Answer the following six concrete questions to find your position.*

  ***

  ### Q1: The Rock Test
  Imagine you map the physical states of an ordinary rock (molecular vibrations, temperature) onto the states of a WordStar program running on a 1980s PC. The mapping is complex but consistent. Does the rock *literally* run WordStar?
  *   **Yes:** Go to **Leaf A**.
  *   **No:** Go to Q2.

  ### Q2: The Mapping Test
  A specific circuit physically supports two incompatible mathematical descriptions (e.g., it can be read as adding numbers *or* multiplying them, depending on how you label the voltage). Is the *real* computation determined by the system's history and design, or is it up to the observer to choose?
  *   **Up to the observer:** Go to **Leaf B**.
  *   **Determined by history/design:** Go to Q3.

  ### Q3: The Damage Test
  A calculator is smashed. It now outputs "5" when you type "2+2". Is it *miscomputing* (failing to do addition) or simply *computing a different function* (doing whatever its physics now dictates)?
  *   **Simply computing a different function:** Go to **Leaf C**.
  *   **Miscomputing (it is broken):** Go to Q4.

  ### Q4: The Chip Test
  If every neuron in your brain were replaced one-by-one with a silicon chip matching its input-output profile, would your cognition survive?
  *   **No (Biology is essential):** Go to **Leaf D**.
  *   **Yes (Substrate doesn't matter):** Go to Q5.

  ### Q5: The Meaning Test
  For a system to count as thinking or computing, must its internal states *mean* something (represent "cat" or "5"), or is the structured shuffling of signals enough?
  *   **Must mean something:** Go to **Leaf E**.
  *   **Shuffling is enough:** Go to Q6.

  ### Q6: The Format Test
  Are the basic units of this processing discrete steps (like ticks of a clock or digits) or continuous flows (like waves or changing voltages)?
  *   **Discrete steps:** Go to **Leaf F**.
  *   **Continuous flows:** Go to **Leaf G**.

  ***

  ### The Leaves (Your Position)

  **Leaf A: Pancomputationalism**
  *   **Label:** *Pancomputationalism*
  *   **Verdict:** The question is empty because everything computes.
  *   **Awkward Commitment:** You must accept that a rock runs every program imaginable, rendering the word "computer" useless for distinguishing brains from stones.

  **Leaf B: Interpretivism**
  *   **Label:** *Instrumentalism / Interpretivism*
  *   **Verdict:** Computation is a description we impose rather than something a system does intrinsically.
  *   **Awkward Commitment:** You must accept that there is no fact of the matter about what a system is doing until an observer decides to describe it that way.

  **Leaf C: Dynamical Systems View**
  *   **Label:** *Dynamical Systems Hypothesis*
  *   **Verdict:** The dynamical-systems rejection (brains are physical systems, not computers).
  *   **Awkward Commitment:** You must deny that a brain or circuit can ever be "broken" in a computational sense, only changed physically.

  **Leaf D: Biological Naturalism**
  *   **Label:** *Biological Naturalism* (Unnamed in primary list)
  *   **Verdict:** Brains cause minds, but not via computation; biology is required.
  *   **Awkward Commitment:** You must accept that silicon could never think, regardless of how perfectly it mimics neural activity, because only meat generates cognition.

  **Leaf E: Classical Computationalism**
  *   **Label:** *Classical Computationalism* (Unnamed in primary list)
  *   **Verdict:** Brains compute over sentence-like symbols.
  *   **Awkward Commitment:** You must locate discrete, language-like symbols in the brain's physical wetware, which neuroscientists have struggled to find.

  **Leaf F: Mechanistic Realism**
  *   **Label:** *Mechanistic Realism*
  *   **Verdict:** It is a substantive empirical claim about what neural mechanisms do.
  *   **Awkward Commitment:** You must commit to the brain operating via discrete, digital-like causal processes, despite the apparent continuity of biology.

  **Leaf G: Connectionism**
  *   **Label:** *Connectionism / Neural Realism*
  *   **Verdict:** Brains compute but not over sentence-like symbols.
  *   **Awkward Commitment:** You must explain how logical reasoning emerges from fuzzy, continuous signal flows without a central rule-book.

  ***

  ### Diagnostic Notes for the Journalist

  **1. Empty Combinations**
  *   **The "Semantic Continuous" Gap:** Your tree permits a path where a reader answers "Must mean something" (Q5) but "Continuous flows" (Q6). This combination (Classical Semantics + Dynamical Format) is theoretically possible but **virtually unoccupied**.
      *   *Diagnosis:* **Incoherence/Unattractiveness.** Classical semantics usually requires discrete vehicles (symbols) to bear truth conditions. Continuous systems (vectors) typically reject explicit representation in favor of causal covariance. A reader landing here likely misunderstands the terms.

  **2. Indistinguishable Leaves**
  *   **Leaf F (Mechanistic Realism) vs. Leaf G (Connectionism):** These leaves are separated *only* by Q6 (Discrete vs. Continuous).
      *   *Diagnosis:* **Neglect of Nuance.** In professional philosophy (e.g., Piccinini), Mechanistic Realism is an umbrella that *includes* analog/connectionist computation. By forcing them into separate leaves via the "Format" question, this instrument treats them as rivals for the sake of the feature's narrative. In reality, a Mechanistic Realist can agree with the Connectionist that the brain is not symbolic, provided they agree computation is a physical mechanism.

  **3. The "Biological" Outlier**
  *   **Leaf D (Biological Naturalism):** This position was not in your required list of five, but the "Chip Test" (Split v) necessitates it.
      *   *Diagnosis:* **Occupied.** This position is held by philosophers like John Searle. It is not empty, but it stands outside the "Computation" debate entirely, rejecting the premise that cognition *is* computation.

  **4. Shared Baseline Integrity**
  *   All leaves preserve the starting commitment that **neuroscientists track real causal structure**. Even the *Interpretivist* (Leaf B) agrees the *physics* is real, only denying that the *computation* is intrinsic to that physics. This ensures no reader is forced to deny neuroscience itself.
