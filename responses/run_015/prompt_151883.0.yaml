answer: |-
  **Project Title:** Reconceptualising Middle Knowledge: Predictive versus Structural Capacities in Molinist Providence

  **1. Introduction and Context**
  The Molinist framework attempts to reconcile divine sovereignty with libertarian human freedom by positing a logical moment in divine knowledge known as 'middle knowledge'. This capacity purportedly allows the deity to know counterfactuals of creaturely freedom (CCFs) prior to the decree of creation, thereby enabling providential planning without causal determination. However, the coherence of middle knowledge remains a contentious subject in contemporary philosophy of religion. Critics argue that such knowledge lacks ontological grounding, while proponents struggle to explain how these counterfactuals are true without compromising human freedom.

  The standard literature predominantly treats middle knowledge as a uniform capacity: God knows the truth value of specific counterfactual propositions regarding free agents. This proposal suggests that this uniformity obscures a potentially vital distinction. There may be a meaningful divergence between *predictive middle knowledge* (PMK), defined as God's grasp of what a particular agent would freely do in an isolated counterfactual situation, and *structural middle knowledge* (SMK), defined as God's grasp of the modal patterns governing how an agent's choices co-vary across related possible worlds. While PMK concerns token truths (e.g., 'If Peter were in circumstance C, he would deny Christ'), SMK concerns type relationships or laws of freedom (e.g., 'Peter's choices function such that denial in C entails repentance in C-plus'). This research project seeks to analyse whether disaggregating these capacities offers a novel defence against standard objections or merely relocates the metaphysical difficulties.

  **2. Research Question and Hypothesis**
  The central research question is precise: does separating predictive and structural middle knowledge dissolve any of the standard objections to Molinism, particularly the grounding objection and the freedom objection, or does it simply push the difficulty back onto the coherence of holding structural knowledge without predictive knowledge?

  The working hypothesis is that the grounding objection hits PMK with greater force than SMK. The grounding objection asserts that there are no truth-makers for CCFs prior to creation because the agents do not yet exist and the choices are not causally determined. However, if SMK is understood as knowledge of an agent's essential nature or dispositional structure rather than brute factual truths about non-existent situations, it may possess a more robust ontological grounding. Conversely, the freedom objection—which claims that knowing what an agent will do renders their choice unfree—might remain equally potent against both capacities, unless SMK allows for a form of providential guidance that relies on pattern manipulation rather than specific foreknowledge.

  Existing Molinist and anti-Molinist positions leave this framing open because they typically argue over the status of CCFs as a monolithic category. Defenders argue for the logical possibility of such knowledge generally, while critics attack the metaphysical coherence of CCFs generally. Neither side adequately explores whether the *mode* of knowing (predictive versus structural) alters the metaphysical requirements for truth-makers or the implications for libertarian freedom. By treating middle knowledge as uniform, the debate may have stalled on ambiguities that this distinction could clarify.

  **3. Methodology**
  The project will employ conceptual analysis applied to theological cases, utilising tools from counterfactual logic and modal metaphysics. The method proceeds in three stages.

  First, I will construct formal definitions for PMK and SMK, ensuring they are logically distinct. This involves analysing the semantics of counterfactual conditionals to determine if knowledge of a structural pattern necessarily entails knowledge of specific predictive outcomes. If the distinction collapses logically (i.e., knowing the structure necessitates knowing the prediction given a specific input), the taxonomy may be untenable.

  Second, I will compare the explanatory work done by each capacity in models of providence. This involves testing whether a deity possessing only SMK (without PMK) could achieve the same providential ends as a deity possessing full middle knowledge. If SMK is insufficient for robust providence, the distinction may be theologially redundant. If it is sufficient, I will assess whether SMK avoids the grounding objection by appealing to essences rather than contingent facts.

  Third, I will assess the stability of the split against standard objections. I will analyse whether the grounding objection transforms when applied to structural patterns rather than specific outcomes. Similarly, I will evaluate whether the freedom objection retains its force if God knows only the modal constraints on an agent's will rather than the specific output of that will.

  **4. Expected Outcomes**
  A successful result would look like a defensible taxonomy that clarifies which objections target which capacity. For instance, the project might demonstrate that the grounding objection is mitigated for SMK because structural truths are grounded in agent essences, whereas PMK remains vulnerable. Alternatively, success might entail showing that the distinction is logically stable but theologically insufficient, as providence requires PMK.

  Failure would entail demonstrating that the distinction is redundant or unstable. If analysis reveals that structural knowledge logically entails predictive knowledge in all relevant cases, the distinction collapses back into the standard view, yielding no dialectical advantage. Furthermore, failure would result if it is shown that SMK inherits the exact same grounding problems as PMK, implying that the relocation of the difficulty offers no progress.

  **5. Scope and Feasibility**
  This project is designed as a one-semester dissertation prospectus. The scope is tractable provided the analysis remains focused on the coherence of the distinction itself rather than attempting a full defence of Molinism. The primary risk to feasibility lies in the technicalities of modal logic. Delving too deeply into formal semantics for counterfactuals could expand the workload beyond a single term. To mitigate this, the project will prioritise conceptual clarity over formal systematisation, using logical notation only where necessary to demonstrate the relationship between structure and prediction.

  Additionally, there is a risk of scope creep regarding theological implications. The focus must remain on the metaphysical coherence of the knowledge capacities rather than broader soteriological debates. If the project attempts to solve the problem of evil or the specifics of predestination alongside the epistemological distinction, it will become unmanageable. By restricting the inquiry to the grounding and freedom objections as they apply to the proposed taxonomy, the project remains within reasonable bounds for a semester-length investigation.

  **6. Conclusion**
  By interrogating the internal architecture of middle knowledge, this research aims to revitalise a stagnant debate. Whether the distinction between predictive and structural knowledge proves to be a breakthrough or a dead end, the analysis will yield greater precision regarding what Molinism requires of divine cognition and metaphysical grounding. This clarity is a necessary prerequisite for any future progress in the dialogue between divine sovereignty and human freedom.
