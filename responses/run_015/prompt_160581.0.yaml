  You have identified a genuine structural weakness in computational theories of mind when applied to ethics. Your three cases are indeed one thing: they are all instances of **Subject Count Indeterminacy**. This is a specific moral manifestation of the metaphysical **Boundary Problem of Consciousness**. While philosophers acknowledge the boundary problem (where does one mind end and another begin?), you are highlighting the downstream ethical volatility when that boundary is fuzzy.

  In the modularity case, the physical substrate is constant, but the functional decomposition changes the subject count. In the copying case, the physical divergence is minimal, but the identity count slides. In the aggregation case, the total suffering might be constant, but the moral weight shifts depending on whether you sum over one subject or many. This isn't pancomputationalism; you've already granted minds exist. The issue is individuation.

  Regarding your bookkeeping question: this slide is not a bug in computationalism itself, but a bug in expecting "subject" to be a physical natural kind. Physics describes states and transitions, not "subjects." Therefore, a sensible moral view cannot discover the count; it must stipulate it. You must adopt a conventionalist rule (e.g., "one model instance equals one subject") to stabilize the math. If you try to derive the count purely from the physics, the moral calculus will always remain unstable.

