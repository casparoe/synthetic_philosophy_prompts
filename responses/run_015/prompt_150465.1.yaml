answer: |-
  ### Executive Summary

  There is **no established name** in axiomatic decision theory for the specific "two-layer" structure you describe, primarily because **under standard mathematical interpretation, your model reduces to Expected Utility (EU) with a modified, piecewise utility function.**

  The claim that the utility curvature and the threshold scaling are "sequential rather than being collapsed" is a **conceptual distinction without a behavioral difference**, provided the scaling factor depends *only* on the outcome value and a fixed threshold. If the scaling factor depends *only* on the outcome $x$ (and distance from $T$), the product $u(x) \cdot \text{scaling}(x)$ is simply a new utility function $\tilde{u}(x)$.

  However, this framing is common in **regulatory risk management** (e.g., Basel accords, stress testing) where modularity is preferred for interpretability. If you intend for the scaling to depend on the *probability mass* of the catastrophic region (not just the outcome distance), the model becomes distinct and aligns closely with **Disappointment Theory** or a restricted form of **Rank-Dependent Utility (RDU)**.

  Below is the detailed push-back, formal characterization, and comparison you requested.

  ---

  ### 1. The Push Back: Mathematical Reducibility

  You asked to be pushed back plainly if the description hides a reduction. Here it is:

  If your valuation functional $V(L)$ for a lottery $L$ with outcomes $x$ and probabilities $p$ is defined as:
  $$ V(L) = \sum_{x \in L} p(x) \cdot u(x) \cdot \sigma(x, T) $$
  where $\sigma(x, T)$ is the scaling factor (equal to 1 for $x \ge T$ and $<1$ for $x < T$), then this is **mathematically indistinguishable** from standard Expected Utility:
  $$ V(L) = \sum_{x \in L} p(x) \cdot \tilde{u}(x) $$
  where $\tilde{u}(x) \equiv u(x) \cdot \sigma(x, T)$.

  **Why this matters:**
  *   **Axiomatically:** If the model reduces to EU, it must satisfy the **Independence Axiom**. If your agent violates Independence (e.g., their preference between two lotteries changes when both are mixed with a third), then the scaling factor $\sigma$ *cannot* be a function of $x$ alone; it must depend on the lottery structure (probabilities or ranks).
  *   **Conceptually:** The "two-layer" description is an **accounting identity**, not a preference structure. It explains *why* the utility function looks the way it does (risk aversion + catastrophe penalty), but it does not generate unique predictions distinct from a single kinked utility curve.

  **The Exception:** The model becomes distinct from EU only if the scaling factor $\sigma$ depends on the **probability** of falling below the threshold (e.g., "the more likely the catastrophe, the more we discount each catastrophic outcome"). This introduces non-linearity in probabilities, moving the model into the realm of **Non-Expected Utility**.

  ---

  ### 2. Formal Structure (Assuming Non-Reducibility)

  To give this structure decision-theoretic teeth, we must assume the scaling depends on the *measure* of the catastrophic set, not just the outcome magnitude. Let us define this as **Threshold-Weighted Utility (TWU)**.

  **Definition:**
  Let $X$ be the set of outcomes, $T$ a catastrophic threshold, and $L$ a lottery with distribution $F$.
  $$ V(L) = \int_{x \ge T} u(x) \, dF(x) + \int_{x < T} u(x) \cdot \Psi(F(T)) \cdot \phi(T - x) \, dF(x) $$

  Where:
  *   $u(x)$: Standard concave utility (risk aversion).
  *   $\phi(\cdot)$: Distance penalty ($\phi(0)=1$, $\phi' < 0$).
  *   $\Psi(F(T))$: **Probability-dependent scaling**. This is the crucial term that prevents reduction to EU. It scales the catastrophic region based on the total probability mass below $T$.

  **Axiomatic Commitments:**
  1.  **Violation of Independence:** Because $\Psi$ depends on $F(T)$, mixing the lottery with a degenerate outcome changes $F(T)$, altering the weight on existing catastrophic outcomes.
  2.  **Monotonicity:** Preserved (better outcomes still preferred).
  3.  **Continuity:** Likely violated at the threshold $T$ or where $F(T)$ shifts discretely, unless $\phi$ and $\Psi$ are carefully smoothed.
  4.  **First-Order Stochastic Dominance:** Preserved, provided $\Psi$ and $\phi$ are non-negative.

  ---

  ### 3. Distinction from Standard Frameworks

  Here is how your structure (specifically the non-reducible version) differs from the major alternatives:

  #### vs. Prospect Theory (PT)
  *   **PT Structure:** $V = \sum \pi(p_i) v(x_i)$. Probability weighting $\pi(\cdot)$ is applied to *all* probabilities, and the value function $v(\cdot)$ is kinked at a reference point.
  *   **Your Model:** You apply standard probabilities to "safe" outcomes but apply a *state-dependent multiplier* to "catastrophic" outcomes.
  *   **Key Difference:** PT typically overweights *small* probabilities of extreme outcomes. Your model *downweights* the contribution of catastrophic outcomes (effectively ignoring tail risk or treating it as "unrealizable"). PT is descriptive of human psychology (fear of loss); your model is normative/regulatory (capital charges).
  *   **Reference Point:** In PT, the reference point is often endogenous or status-quo. In your model, $T$ is an exogenous regulatory constraint.

  #### vs. Rank-Dependent Utility (RDU)
  *   **RDU Structure:** Weights depend on the cumulative probability (rank) of the outcome. $V = \sum [w(P(x \ge x_i)) - w(P(x > x_i))] u(x_i)$.
  *   **Your Model:** If your scaling factor $\Psi$ depends on the cumulative probability $F(T)$, your model is a **piecewise RDU**. It applies one weighting scheme above $T$ and a different scheme below $T$.
  *   **Key Difference:** RDU is smooth across ranks (depending on the weighting function $w$). Your model introduces a **discontinuity in the weighting scheme** at $T$. It is less general than RDU but more specific about the "catastrophe" mechanism.

  #### vs. Ambiguity Aversion (Maxmin EU / Smooth Ambiguity)
  *   **Ambiguity Structure:** Preferences over acts depend on a set of priors or a second-order belief over probabilities.
  *   **Your Model:** You assume known state probabilities $p$. The scaling is a penalty, not a reaction to unknown probabilities.
  *   **Key Difference:** Ambiguity aversion reduces the value of a lottery because the probabilities are uncertain. Your model reduces the value because the *consequences* are unacceptable, regardless of probability precision. However, behaviorally, both can look like "pessimistic" weighting of bad states.

  #### vs. Disappointment Theory (Gul, 1991)
  *   **Closest Match:** Disappointment Theory discounts outcomes that fall below the **certainty equivalent** of the lottery.
  *   **Your Model:** You discount outcomes below a **fixed threshold** $T$.
  *   **Key Difference:** Endogeneity. In Disappointment Theory, the threshold moves as the lottery changes. In your model, $T$ is fixed. This makes your model easier to compute but potentially dynamically inconsistent if $T$ does not track wealth.

  ---

  ### 4. Boundary Cases and Indistinguishability

  Your framework becomes indistinguishable from others in the following limits:

  1.  **Scaling Factor $\sigma \equiv 1$:** Reduces to standard **Expected Utility**.
  2.  **Utility $u(x)$ Linear:** If $u(x) = x$, your model becomes a **Probability Distortion** model on the lower tail (similar to RDU with a step-function weighting).
  3.  **Threshold $T \to -\infty$:** Reduces to **Expected Utility**.
  4.  **Threshold $T \to \max(x)$:** If *all* outcomes are scaled, it reduces to **Expected Utility** with a globally rescaled utility function.
  5.  **Scaling depends on Rank:** If the scaling factor is determined by the percentile of the outcome rather than a fixed dollar threshold, it becomes **Rank-Dependent Utility**.

  ---

  ### 5. Why the "Two-Layer" Framing Exists (Risk Management Context)

  If the math reduces to a single utility function, why do risk managers describe it as two layers?

  1.  **Modularity of Regulation:** In banking (e.g., Basel III), "Risk Weighting" (the utility/probability part) and "Capital Surcharges" (the threshold scaling) are legislated separately. One reflects market risk; the other reflects systemic stability. Collapsing them mathematically obscures the regulatory intent.
  2.  **Tail Truncation vs. Risk Aversion:** Practitioners want to distinguish between "I dislike variance" (concave $u$) and "I cannot survive this loss" (threshold scaling). The latter is often a hard constraint (ruin) masquerading as a soft penalty.
  3.  **Computational Stability:** In Monte Carlo simulations, it is often easier to apply a "haircut" to tail scenarios post-calculation than to re-engineer the utility function of the optimizing agent.

  ### Recommendation

  If you are writing a theoretical paper:
  *   **Do not claim** this is a new class of preferences if $\sigma$ depends only on $x$. Acknowledge it is a piecewise EU specification.
  *   **Do claim** novelty if $\sigma$ depends on $F(T)$ (the probability of catastrophe). In that case, label it **"Threshold-Dependent Probability Weighting"** or **"Catastrophe-Adjusted RDU."**

  If you are modeling a protocol:
  *   Retain the two-layer description for **interpretability**, but acknowledge that for the purpose of **optimization**, it can be solved as a single objective function with a kinked utility curve $\tilde{u}(x)$.

  ### Summary Table

  | Feature | Your Model (Reduced) | Your Model (Non-Reduced)* | Prospect Theory | Rank-Dependent Utility |
  | :--- | :--- | :--- | :--- | :--- |
  | **Functional Form** | $E[\tilde{u}(x)]$ | $E[u(x) \cdot \sigma(x, F(T))]$ | $\sum \pi(p) v(x)$ | $\sum w(\text{rank}) u(x)$ |
  | **Linearity in Prob.** | Yes | **No** | No | No |
  | **Threshold** | Fixed Kink in $u$ | Fixed Kink in Weighting | Reference Point (Endog.) | None (Continuous Rank) |
  | **Independence Axiom** | Satisfied | **Violated** | Violated | Violated (Comonotonic) |
  | **Primary Driver** | Risk Aversion + Penalty | **Tail Probability Sensitivity** | Loss Aversion + Weighting | Pessimism/Optimism |

  *\*Non-Reduced version assumes scaling depends on the probability mass below the threshold.*
