answer: |-
  # The "What is Life?" Sorter
  **For the Biology Club Science Fair Booth**

  ## Part 1: The Quiz (Hand this to visitors)

  **Instructions:** Read each scenario. There are no right or wrong answers. Pick the option that matches your gut feeling.

  **1. The Candle Flame**
  A candle flame takes in wax and oxygen, releases heat and smoke, grows, moves, and goes out if you cut off its air. It maintains itself, but it has no DNA and doesn't have babies.
  *   A) It is alive.
  *   B) It is not alive.
  *   C) The question is badly asked / It's a matter of degree.

  **2. The 200-Year Seed**
  A seed sits in a drawer for two centuries. It does absolutely nothing—no growth, no breathing, no energy use. Then you plant it, and it sprouts. Was it alive while it was in the drawer?
  *   A) Yes, the whole time.
  *   B) No, it was just a container for life until it sprouted.
  *   C) The question is badly asked / It's a matter of degree.

  **3. The Shape-Shifting Protein**
  A single protein molecule floats in a brain. It doesn't eat or breathe. But when it touches other proteins, it forces them to snap into its own shape, making more copies of itself. (Like a prion).
  *   A) It is alive.
  *   B) It is not alive.
  *   C) The question is badly asked / It's a matter of degree.

  **4. The Hitchhiker Molecule**
  Inside a cell, there is a tiny strand of DNA that does nothing but get copied every time the cell divides. It doesn't help the cell survive; it just rides along.
  *   A) It is alive.
  *   B) It is not alive.
  *   C) The question is badly asked / It's a matter of degree.

  **5. The Sterile Mule**
  A mule is healthy and walks around, but it is sterile. It can never have offspring. It is the end of its family line.
  *   A) It is alive.
  *   B) It is not alive.
  *   C) The question is badly asked / It's a matter of degree.

  **6. The Perfect Robot**
  A robot finds parts and builds a copy of itself. The copy is 100% identical. There are no mistakes, no improvements, and no evolution. They just make more of the same forever.
  *   A) It is alive.
  *   B) It is not alive.
  *   C) The question is badly asked / It's a matter of degree.

  **7. The Ephemeral Computer Program**
  A computer program copies itself with small typos. The versions compete for processor time. But every night, the lab reboots and wipes them all out. They exist for only 12 hours.
  *   A) It is alive.
  *   B) It is not alive.
  *   C) The question is badly asked / It's a matter of degree.

  **8. The Rogue Cells**
  Cells taken from a tumor (or a dish) keep dividing and evolving for decades, long after the person they came from has died. They are kept in a jar.
  *   A) They are alive.
  *   B) They are not alive.
  *   C) The question is badly asked / It's a matter of degree.

  **9. The Synthetic Cell**
  Scientists write a genome on a computer, build it chemically, and put it into an empty cell shell. It starts dividing. It has no biological ancestors; its "parents" were machines.
  *   A) It is alive.
  *   B) It is not alive.
  *   C) The question is badly asked / It's a matter of degree.

  ***

  ## Part 2: The Scoring Key (For Club Members)

  **Step 1: Check for the Deflationary View**
  Count the number of **C** answers.
  *   **If 6 or more answers are C:** Stop. The visitor holds the **Deflationary View**.
      *   *What to tell them:* "Your theory is that 'life' isn't a real category. You think nature is continuous, and drawing a hard line between alive and not alive is a human mistake, not a scientific fact."
      *   *Note:* If they have 3-5 C's, they are undecided. Proceed to Step 2 but treat the result as a "lean" rather than a firm label.

  **Step 2: Tally the "Alive" Votes**
  If they have 5 or fewer C's, count their **A** answers in the following groups:

  *   **Metabolism Score:** Add A's from **Q1 (Flame)** and **Q2 (Seed)**.
      *   *Max Score: 2*
  *   **Replication Score:** Add A's from **Q3 (Protein)**, **Q4 (Molecule)**, and **Q7 (Program)**.
      *   *Max Score: 3*
  *   **Lineage Score:** Add A's from **Q5 (Mule)** and **Q8 (Rogue Cells)**. (Count Q9 as 0 for this score).
      *   *Max Score: 2*
  *   **Substrate Score:** Add A's from **Q6 (Robot)** and **Q7 (Program)**.
      *   *Max Score: 2*
  *   **Origin Check:** Look at **Q9 (Synthetic Cell)**.
      *   If **A**: They value Function over History.
      *   If **B**: They value History over Function.

  **Step 3: Determine the Dominant View**
  Find the highest score among the four categories above. Use the tie-breakers below.

  *   **Winner: Metabolism Score**
      *   **Leaf:** **The Self-Maintaining View**
      *   *What to tell them:* "You think life is about fighting decay. To you, being alive means constantly doing work to keep yourself together and stay far from equilibrium. If it doesn't burn energy to maintain a boundary, it's not alive."
  *   **Winner: Replication Score**
      *   **Leaf:** **The Heredity-Plus-Variation View**
      *   *What to tell them:* "You think life is about information. To you, being alive means being part of a system that can copy itself with variations and evolve. Chemistry doesn't matter as much as the ability to change over time."
  *   **Winner: Lineage Score (AND Q9 is B)**
      *   **Leaf:** **The Lineage View**
      *   *What to tell them:* "You think life is about family history. To you, an individual is alive only if it belongs to an unbroken chain of living ancestors. Being able to function isn't enough; you have to be 'born' of life, not made by machines."
  *   **Winner: Substrate Score (AND Q7 is A)**
      *   **Leaf:** **The Substrate-Neutral View**
      *   *What to tell them:* "You think life is a pattern, not a substance. To you, carbon isn't special. If code or machines can copy, compete, and persist, they are alive. Biology is just one kind of life, not the only kind."
  *   **Tie-Breaker:** If **Replication** and **Substrate** are tied, check **Q6 (Robot)**.
      *   If Q6 is **B**: They are **Heredity-Plus-Variation** (Variation is required).
      *   If Q6 is **A**: They are **Substrate-Neutral** (Copying is enough).
  *   **Tie-Breaker:** If **Metabolism** and **Lineage** are tied, check **Q1 (Flame)**.
      *   If Q1 is **A**: They are **Self-Maintaining**.
      *   If Q1 is **B**: They are **Lineage**.

  ***

  ## Part 3: Logical Space & Limitations (For Club Members Only)

  **The Metabolism vs. Replication Seam**
  We used **Q1 (Flame)** and **Q7 (Program)** to press this seam.
  *   If they say Flame=Alive but Program=Dead, they prioritize **Metabolism**.
  *   If they say Flame=Dead but Program=Alive, they prioritize **Replication**.
  *   *Note:* This is the strongest split in the quiz. It cleanly separates the "Thermodynamic" biologists from the "Evolutionary" biologists.

  **Leaves We Can't Fully Separate**
  1.  **Heredity-Plus-Variation vs. Substrate-Neutral:** These two are extremely close. Both believe copying is the key. The only thing separating them is **Q6 (The Robot)**. If a visitor thinks the Robot is alive, they slide into Substrate-Neutral. If they think the Robot is dead (because it doesn't evolve) but the Program is alive, they are Heredity. Many visitors will not notice the difference between "copying" and "copying with typos," so these two leaves may blur.
  2.  **Deflationary vs. Confused:** Practically, a 9th grader who doesn't understand the questions will pick "C" (Bad Question) repeatedly. This looks exactly like the Deflationary View. We flag anyone with 6+ "C" answers as Deflationary, but be aware that some of those are just unsure students.

  **Confidence Assessment**
  I am **85% confident** in this instrument's ability to sort the Metabolism vs. Replication split. The cases of the Flame and the Computer Program are distinct enough that most people have an intuition about them.

  **The Weakest Claim**
  I am least sure about the **Lineage View** separation. Specifically, **Q9 (The Synthetic Cell)** is the weak point. Many students (and adults) will answer based on sci-fi tropes ("Frankenstein's monster!") rather than biological philosophy. They might say the Synthetic Cell is "Not Alive" because it feels unnatural, which mimics the Lineage View, or they might say it is "Alive" because it moves, which mimics the Self-Maintaining View. It is hard to tell if their answer is driven by a theory of *ancestry* or just a gut reaction to *human-made things*. An actual biologist might tell you that the Synthetic Cell is the worst test case for a high school booth because it conflates "origin" with "authenticity."
