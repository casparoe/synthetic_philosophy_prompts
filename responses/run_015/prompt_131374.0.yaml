answer: |-
  The standoff endures because there is no neutral meta-language available to assess ontological claims without already presupposing the very ontological commitments under dispute.

  Your first hypothesis identifies a symptomatic divergence but misidentifies the cause. It is not that Camp A tests only for world-sensitivity while Camp B tests for consequence-sensitivity; rather, both camps agree that consequences matter but disagree on what those consequences track. Camp A argues that pragmatic utility (consequence-sensitivity) can be fully explained by linguistic convenience and cognitive economy, requiring no further metaphysical grounding. Camp B argues that pragmatic utility is evidence of structural alignment with reality, such that a scheme's success in licensing inferences indicates it is carving the world at its joints. Consequently, they are not running different tests but offering competing explanations for the same test results. Camp A sees utility as a substitute for truth; Camp B sees utility as a marker of truth. This explains why the exchange is stable: each side absorbs the other's data into their own explanatory framework without ever agreeing on the interpretation of that data.

  Your second hypothesis is closer to the structural flaw, though the taxonomy requires refinement. Camp A does indeed occupy the 'third thing'—the choice of representational scheme based on virtues other than truth—but this position is unstable under logical scrutiny. The instability arises because asserting that 'there is no fact of the matter' is itself a truth-apt claim about the limits of reality. To maintain consistency, Camp A must treat their own metaontological thesis as merely a recommendation, but this renders their position powerless to correct Camp B, who treats the thesis as a false description of the world. Camp B cannot accommodate the third position because their logic of assertion demands that any claim about what exists (or fails to exist) be either true or false. Thus, the bipartite taxonomy is not a shared presupposition they could discard, but a constraint imposed by the logic of assertion itself: once you assert something about the status of ontology, you are doing ontology. The 'third thing' collapses because it attempts to step outside the game of truth-evaluation while making a move within it.

  The diagnosis must not be uniform across the composite-objects and numbers cases, for they are substantively different disputes sharing a name. In the composite-objects case, the dispute turns on vagueness and the precision of mereological concepts, where the verbal diagnosis is plausible because the 'cutting' of objects appears language-relative and nothing in fundamental physics seems to hang on the outcome. Here, Camp A's appeal to convenience holds weight because the consequences of denying composites are minimal for ordinary practice. In the numbers case, however, the dispute turns on indispensability to our best scientific theories; here, the consequences are so deeply woven into successful prediction that denying a factual basis looks like denying the success of science itself. Camp A struggles significantly more here because the 'pragmatic virtue' of mathematics is indistinguishable from truth in practice. Treating these as a single metaontological problem obscures the fact that the pressure points differ: one is about boundary-drawing, the other about theoretical commitment.

  Progress would not come from a verdict on who is right, but from a reframing of the question that dissolves the demand for a 'view from nowhere'. The productive shift is to abandon the quest to determine whether quantifiers match the world independently of human interests, and instead ask which quantificational scheme minimises theoretical cost while maximising explanatory scope within a given context. This changes the burden of proof: rather than Camp B needing to prove 'real existence' or Camp A needing to prove 'mere verbalism', both must demonstrate why their preferred scheme offers superior theoretical utility for specific purposes. A formal result aiding this would be a semantics that models ontological commitment as a gradient of theoretical indispensability rather than a binary switch of existence. Until the debate shifts from matching reality to optimising representation, the deadlock will remain, because the question 'what exists' cannot be answered without first settling 'what counts as an answer', which is itself an ontological choice.
