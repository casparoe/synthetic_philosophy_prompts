answer: |-
  # Activity Design: The Symmetry Ledger

  ## 1. Overview and Materials
  **Objective:** To generate an intuitive conflict between the deprivation account of harm (death is bad because it deprives us of goods) and the temporal symmetry argument (pre-birth non-existence is structurally identical to post-death non-existence), culminating in the Epicurean challenge regarding the subject of harm.

  **Class Size:** 12 Students
  **Time:** 90 Minutes
  **Materials:**
  *   **12 Case Packets:** Each packet contains four dossiers (labeled Case W, X, Y, Z).
      *   *Case W (The Unconceived):* Describes a specific individual who was never conceived. Lists specific "Lost Goods" (e.g., 45 years of moderate pleasure, 3 completed projects, 2 deep relationships).
      *   *Case X (The Cut Short):* Describes a specific individual who died unexpectedly at age 25. Lists identical "Lost Goods" to Case W (45 years, 3 projects, 2 relationships).
      *   *Case Y & Z (Fillers):* Describe lives lived to completion or varying degrees of suffering during life. These mask the binary focus of W and X.
      *   *Note:* The names and specific contexts differ between W and X to prevent immediate recognition of the symmetry. The quantitative "Lost Goods" are identical.
  *   **Scoring Sheets:** A grid requiring a "Harm Magnitude Score" (0–100) for each case, where 0 is "No Misfortune" and 100 is "Maximum Conceivable Misfortune."
  *   **Reveal Envelopes:** Sealed envelopes containing the "Symmetry Key" (showing that W and X are temporal mirrors with identical goods).
  *   **Whiteboard:** For aggregating scores.

  ## 2. Phase-by-Phase Timeline

  **Phase 1: Silent Scoring (20 Minutes)**
  *   **Instruction:** Distribute packets. Instruct students that they are acting as "Ethical Auditors." Their task is to assign a Harm Magnitude Score to the *subject* of each dossier based strictly on the profile provided.
  *   **Constraint:** They must score individually. No discussion. They are told to treat each case as independent.
  *   **Facilitator Role:** Circulate silently. Ensure students are scoring the *subject's* misfortune, not the grief of survivors (if a student asks, remind them: "Score the harm to the person in the dossier, not their family").

  **Phase 2: Paired Negotiation (20 Minutes)**
  *   **Instruction:** Pair students (6 pairs). They must compare their scores for Cases W, X, Y, and Z.
  *   **Task:** They must agree on a *joint* score for each case. They are allowed to argue, but they cannot look at other pairs' work yet.
  *   **Hidden Variable:** They do not yet know that Case W and Case X are structurally identical regarding lost goods. They will likely argue that Case X (Death) deserves a higher score than Case W (Non-conception) based on intuition.
  *   **Facilitator Role:** Listen for justifications. Note phrases like "potentiality," "future orientation," or "interrupted narrative." Do not correct them yet.

  **Phase 3: The Reveal (15 Minutes)**
  *   **Instruction:** Pairs open the Reveal Envelopes. The Key displays the "Lost Goods" ledger side-by-side for Case W and Case X, highlighting the quantitative identity.
  *   **Task:** Pairs must look at their agreed-upon scores. If they scored X higher than W, they must write down *one sentence* explaining why identical losses warrant different harm scores based solely on temporal location.
  *   **Aggregation:** Facilitator writes the pair's scores for W and X on the whiteboard. A visual disparity will likely emerge (X scores higher than W).

  **Phase 4: Open Deliberation (30 Minutes)**
  *   **Instruction:** Full class discussion. The facilitator does not lecture but asks questions derived from the disparity.
  *   **Prompt 1:** "The ledger shows identical goods lost. Why did the class assign higher harm to the post-death case?"
  *   **Prompt 2:** "If the harm comes from the loss of goods, does the direction of time matter? If not, why is the pre-birth score lower?"
  *   **Prompt 3:** "For whom is this harm occurring in Case W? For whom is it occurring in Case X?"
  *   **Goal:** Guide students to articulate the Deprivationist intuition (loss of goods is bad) and then crash it against the Symmetry Problem (why not pre-birth?) and finally the Epicurean Subject Problem (who is there to suffer?).

  ## 3. Debrief: Mapping Activity to Philosophy

  | Activity Phase | Philosophical Concept | Facilitator Connection |
  | :--- | :--- | :--- |
  | **Silent Scoring** | **Deprivation Logic** | Students instinctively score based on "goods lost." This mirrors the modern deprivationist account: death is bad because it removes future goods. |
  | **Paired Negotiation** | **Temporal Asymmetry** | Students struggle to justify why Death (X) is worse than Non-Conception (W). This replicates the intuitive asymmetry we feel toward time (future matters more than past). |
  | **The Reveal** | **The Symmetry Problem** | Showing the identical ledgers forces the Lucretian symmetry argument: if the goods are the same, the harm should be the same. The disparity in scores reveals a bias toward the future. |
  | **Open Deliberation** | **The Experience Requirement / No Subject** | Pushing on "Who is harmed?" leads to the Epicurean claim: harm requires a subject. In both W and X, the subject does not exist during the period of loss. |

  ## 4. Limitations: What This Activity Cannot Reproduce

  **The Metaphysical Absence of the Subject**
  The activity requires students to assign a harm score *to a subject* (the person in the dossier). This structurally biases the simulation against the Epicurean position. Epicurus argues that death is not bad precisely because there is *no one* to be the subject of the harm. By asking students to score "Harm to S1," you presuppose a subject exists to receive the score.

  **Facilitator Correction:**
  In the final deliberation, you must verbally supply the missing metaphysical claim. You must state: "The activity forced you to score harm *for* someone. Epicurus denies there is anyone there. The activity simulates the intuition of loss, but it cannot simulate the state of non-existence itself. You must intellectually add the step: 'If there is no subject, the score must be zero, regardless of the lost goods.'"

  **The Phenomenology of Death**
  Students will inevitably conflate the *experience* of dying (which can be bad) with the *state* of being dead (which is non-existence). The activity profiles "lost goods," which abstracts away the process of dying.

  **Facilitator Correction:**
  Explicitly distinguish "dying" (a biological process experienced by the living) from "death" (the state of non-existence). Remind them the scores should reflect the state of non-existence, not the process leading to it.

  ## 5. Predicted Misfires and Handling

  **Misfire 1: The "Potentiality" Defense**
  *   **Prediction:** Students will argue Case W (Unconceived) involves no real person, whereas Case X (Death) involves a real person who lost their future. They will claim the dead person has "established potential" that the unconceived never had.
  *   **Handling:** Do not refute this immediately. Ask: "Does the *amount* of goods lost differ?" When they admit it is identical, ask: "Does the metaphysical status of the subject change the quantity of good lost, or only our emotional attachment?" Push them to see that if harm is based on *deprivation of goods*, the subject's history shouldn't change the math.

  **Misfire 2: Harm to Others (Grief)**
  *   **Prediction:** Students will justify higher scores for Case X by citing the grief of parents or friends.
  *   **Handling:** Remind them of the Phase 1 instruction: "Score the harm to the subject." If they persist, ask them to imagine a hermit with no connections. Does the harm score change? This isolates the *intrinsic* harm to the deceased from extrinsic consequences.

  **Misfire 3: Refusal to Score Pre-Birth**
  *   **Prediction:** Some students may write "N/A" or "0" for Case W, refusing to acknowledge a subject exists to be harmed.
  *   **Handling:** Accept this as a valid philosophical move. In the reveal, highlight this group. Ask them: "If you scored 0 for W because there is no subject, consistency demands you score 0 for X." This directly leads to the Epicurean conclusion without you needing to preach it.

  ## 6. Settled vs. Contested Literature Note

  **Broadly Settled in Literature**
  *   **The Epicurean Claim:** It is consensus that Epicurus argues death cannot be bad for the one who dies because harm requires a subject capable of experience. When death exists, the subject does not. Therefore, there is no subject to suffer harm.
  *   **The Symmetry Argument:** It is settled that Lucretius (following Epicurean logic) formulated the symmetry argument: the time after death is relevantly similar to the time before birth.

  **Genuinely Contested in Literature**
  *   **Deprivationism vs. Experience Requirement:** It is contested whether the deprivation account (death is bad because it deprives us of goods we would have had) successfully overrides the experience requirement (one must experience harm to be harmed). Some argue deprivation is sufficient for harm; others insist experience is necessary.
  *   **The Success of the Symmetry Objection:** It is contested whether the symmetry argument holds. Some philosophers argue there is a relevant difference between pre-birth and post-death (e.g., the direction of time, the existence of a subject at one end but not the other, or the nature of potentiality).
  *   **Temporal Location:** It is contested whether temporal location alone (past vs. future) can ground an asymmetry in harm. Some argue we care more about future goods than past goods; others argue this is a psychological bias, not a metaphysical truth.

  **Facilitator Warning:** Do not present the deprivationist view as the "solution" to Epicurus. Present it as the dominant counter-argument that remains philosophically disputed. Ensure students understand that accepting deprivationism requires rejecting or modifying the experience requirement, which is not a settled matter.
