prompt: |-
  I am a high school junior. For the past two years I have built and evaluated time-series forecasting models — first gradient boosting on tabular features, then recurrent networks — for my school's research symposium and a summer program, so the vocabulary I actually think in is training/validation/test splits, stationarity and differencing, autocorrelation, feature and target construction, leakage, baseline models, regularization, backtesting, calibration, and effective sample size. I have never taken a philosophy or social theory course, and I am not looking for one; I want to know whether a certain research program is doing what I think of as forecasting.

  The program is cliodynamics: the claim that long-run history has quantifiable and partly predictable structure. Specifically, I have been reading about secular cycles — multi-century trajectories with roughly fifty-year integrative and disintegrative oscillations nested inside them — and about structural-demographic theory, whose proposed mechanisms include popular immiseration, elite overproduction, and state fiscal strain. I also recall a widely publicized forecast that the 2020s would bring elevated political instability, which is what first made me curious.

  Please restate the central claims of this program, and the main objections its critics make, in the vocabulary above, as faithfully as you can. Then give me the residue report.

  Structure the answer as follows:

  1. A two-column table. Left column: each central claim or objection, in the practitioners' and critics' own terms. Right column: the closest counterpart in my vocabulary. If there is no genuine counterpart, write "no counterpart" in that cell rather than forcing a fit; the empty cells are the part I care about most.

  2. Prose explaining the residue: which claims translate cleanly, which translate only with distortion, and what the distortion is. Please address at least these four cases directly — elite overproduction as an unobservable quantity that has to be measured through proxy indicators; the problem of a single nonstationary trajectory with no clean holdout period; fitting a mechanistic model's parameters to particular historical cases and then claiming it generalizes to others; and whether the 2020s forecast was a calibrated probability or a directional one.

  3. A closing verdict of at most two sentences, which I can quote in my application essay: is the residue a limitation of my vocabulary — for instance, that machine learning has no way to talk about mechanism, causal explanation, or single-case evidence — or is it evidence that the original claims are vaguer than they sound?

  My working suspicion, which you should test rather than flatter, is that the critics' objections are mostly the standard complaints about overfitting and underdetermination that I already know, with perhaps one genuinely different objection hiding among them. Tell me if that is wrong, and which objection it is.

  Keep the translation honest: do not import assumptions from my framework and present them as translations of theirs. Hard limit of 900 words for the whole response, table included. No bibliography or reading list — I will track down sources myself.
