      *   If I say "It relied on a shared secret assumption," I need to frame that assumption as a *virtue* of the group, not a *bug* of the argument.
      *   *Solution:* Shift the focus from the *validity of the case* to the *community it built*. The "hidden assumption" wasn't a logical fallacy; it was a shared commitment to caring about the question. The "flaw" is actually the feature of the friendship.

