          *   *Ranking:* High decisiveness. Hard to argue slavery had a "hidden compensatory function" that justified it without sounding apologetic for evil.
      *   *Category 2: Conceptual Arguments (The "Path Dependence/Power" Problem).*
          *   Argument: Institutions survive due to power dynamics, coercion, or luck, not efficacy. (Marxist critique, Public Choice theory).
          *   *Ranking:* Medium-High. Undermines the link between survival and wisdom.
      *   *Category 3: Historical Reforms (The "Missed Opportunity" Problem).*
          *   Example: Civil Rights Act, women's suffrage. Conservatives argued these would destroy social fabric. They didn't; they improved it.
          *   *Ranking:* Medium. Defenders can argue the *specific* conservative objections were wrong, but the *principle* of caution still holds, or that the reforms were actually restorations of older rights.

      *   *Refining the Ranking:*
          1.  **Empirical Harm (Highest):** If an institution persists and causes obvious net harm, the "survival = fitness" axiom breaks.
          2.  **Conceptual/Power Dynamics (Middle):** If survival is explained by coercion rather than function, the epistemic value of longevity vanishes.
          3.  **Historical Reforms (Lowest/Middle):** Defenders can often reframe these as corrections of *deviations* rather than dismantling of *core* institutions.

  4.  **Drafting the Defense/Concession Analysis:**
      *   *For Empirical Harm:* Defender concedes specific institutions were bad but argues they weren't *true* organic institutions (imposed by force) or that their removal caused unintended chaos (e.g., post-colonial instability).
      *   *For Conceptual:* Defender concedes power matters but argues power alone can't sustain complex coordination without some functional utility.
      *   *For Reforms:* Defender argues the reform was actually a restoration (Common Law reasoning) or that the *speed* of change was the issue, not the change itself.

  5.  **Addressing Distinctive Predictions:**
      *   What does Burkeanism predict that Progressivism doesn't?
