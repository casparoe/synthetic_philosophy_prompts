      *   Prediction: Reforms that evolve organically or respect existing structures will have higher stability.

  6.  **Addressing Falsifiability:**
      *   *The Trap:* If every failure of an old institution is blamed on "it wasn't a real tradition" and every failure of reform is blamed on "disrupting tradition," the theory is unfalsifiable.
      *   *Assessment:* This is a theoretical vice. It protects the dogma but reduces explanatory power. However, a sophisticated defender argues it's a heuristic, not a law of physics, so "insulation" is actually "context sensitivity." I need to be honest: it *is* at risk of unfalsifiability.

