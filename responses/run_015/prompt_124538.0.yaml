prompt: |-
  I defend a Burkean position on institutional change informed by Chesterton's fence: long-standing social arrangements—legal precedents, customary norms, distributed decision procedures—should not be dismantled unless we can specify the problem they solve and demonstrate that a replacement solves it at least as well, because multigenerational survival is weak but real evidence of distributed problem-solving that exceeds any single cohort's explicit reasoning capacity. What would count against this view? Rank the defeaters by decisiveness: empirical cases where durable institutions clearly produced sustained net harm without hidden compensatory functions; conceptual arguments that longevity is not even weak evidence of efficacy; and historical reforms blocked by conservative caution that were, ex ante, well-understood improvements. For each, indicate what a committed defender of this position would concede versus what they would dismiss—perhaps by invoking unseen second-order effects, misclassification of the institution's age, or the distinction between local and systemic change. Also clarify whether the view makes distinctive predictions that rival reformist frameworks do not, and assess honestly whether it has been qualified into unfalsifiability—if every apparent counterexample can be absorbed by appealing to hidden functions or misidentified institutions—and whether that insulation is a theoretical vice rather than a virtue. Please answer in American English, and do not provide bibliographies or reading lists.
reasoning: |-
