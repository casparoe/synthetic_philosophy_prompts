prompt: |-
  I teach a final-year seminar on formal epistemology, and I am drafting this year's final. A large share of my students arrive having spent years reading rationalist blogs and forum comment threads, and they bring a habit with them that I want the exam to break: they treat *Dutch book* as a conversation-stopper. Someone's credences look strange and the verdict comes down that they are not a coherent probability distribution, therefore Dutch-bookable, therefore irrational — as if the word itself carried the normative weight, and as if the absence of an actual bookie with a satchel were an empirical accident rather than part of the design of the argument.

  I want one question, in three parts, that forces students to cash the argument out rather than invoke it.

  Constraints: closed book, ninety minutes, twenty-five marks, pitched at final-year undergraduates and MA students. Nothing in it may require library or web access: the paper should supply every definition the student needs, and I want the question itself to say that no marks are awarded for naming authors, papers, or theorems, and that a student can take full marks without them. The mathematics available is elementary — finite sets of worlds, real-valued credences, expectation, dominance.

  I have been playing with a device I would like the question built around, though you may improve on it. Call it the posted-quote bookie. The bookie never learns the agent's credences. Instead the agent is asked to post, for any proposition the bookie names, a number: the price at which she is willing to take either side of a unit bet on that proposition. The bookie then chooses the side and the stake, subject to a fixed cap on the stake, and may repeat this for further propositions, choosing them in light of the quotes already given. The agent is free to decline to quote at all, or to quote something other than her real fair price. Please work out what this mechanism does to the argument: which of the usual idealizations it removes, which it leaves untouched, what exactly it shows when the posted prices are incoherent, what happens when the agent quotes strategically rather than honestly, and whether the argument now constrains the agent's credences or only her quotable, actionable dispositions. I also want the small-stakes cap to be load-bearing rather than decorative.

  I would like three things from you.

  First, the question itself, written out as it would appear on the paper, with any stipulations and definitions, and with a short paragraph setting up the dialectical situation so that a student cannot answer it by restating the definition of a probability measure. The crux should be whether and how the move from exploitability to irrationality is supposed to go, and what is left of the argument once you notice that the losing package is one the agent could simply decline.

  Second, a model answer of about a thousand to twelve hundred words. It should commit to verdicts rather than surveying positions: I will penalise a model answer that merely lists what various people have said about the gap between pragmatic and epistemic arguments.

  Third, a marking scheme. Marks per part, totalling twenty-five, with the part built on the posted-quote bookie worth the most. For each part, name the specific moves that earn the marks, and give one line on how students typically go wrong on each. Then give band descriptors that separate an A from a B from a C by what the answer does and does not contain: a C answer should be attainable by someone who has read the Sequences and absorbed that incoherence means a guaranteed loss, while an A answer should require seeing why that gloss is not yet a normative claim.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**

      *   **Context:** Final-year seminar on formal epistemology (UG/MA level).
      *   **Problem:** Students treat "Dutch Book" as a conversation-stopper/magic word for irrationality without understanding the underlying normative force or the gap between pragmatic exploitability and epistemic irrationality. They often conflate the *possibility* of a bookie with the *necessity* of one existing.
      *   **Goal:** Create one 3-part exam question (25 marks, 90 mins, closed book) that forces students to "cash out" the argument rather than invoke it.
      *   **Constraints:**
          *   No external knowledge required (define everything in the prompt).
          *   No marks for naming authors/theorems.
          *   Elementary math (finite worlds, real numbers, expectation, dominance).
          *   Specific device: "Posted-Quote Bookie" (Agent posts prices for any proposition; Bookie chooses side/stake up to a cap; Agent can decline or quote strategically).
          *   Small-stakes cap must be load-bearing.
          *   Focus: Exploitability vs. Irrationality, Strategic vs. Honest quoting, Credences vs. Dispositions.
      *   **Deliverables:**
          1.  The Exam Question (with setup/definitions).
          2.  Model Answer (1000-1200 words, committed verdicts).
          3.  Marking Scheme (25 marks total, specific moves, typical errors, band descriptors).

  2.  **Drafting the Exam Question:**

      *   *Setup:* Need to define the "Posted-Quote Bookie" scenario clearly.
      *   *Definitions:* Worlds ($W$), Propositions (subsets of $W$), Credence function ($C$), Quoted Price ($q$), Stake ($S$), Cap ($K$), Payoff.
      *   *Part 1 (The Mechanism):* Ask them to prove that if quoted prices are incoherent, a sure loss is possible *within the rules of the game*. This tests the math.
      *   *Part 2 (The Cap & Strategy):* Introduce the small-stakes cap ($K$). Ask what happens if the agent quotes strategically (not honestly) to avoid loss vs. quoting honestly. Ask what the cap limits. This addresses the "load-bearing" constraint.
      *   *Part 3 (The Normative Gap):* The philosophical crux. Why does avoiding this specific pragmatic loss entail having rational *credences*? Address the "decline to quote" option.
      *   *Tone:* Needs to be precise but accessible. Explicitly state "No marks for naming authors."

      *(Self-Correction during drafting)*: Make sure the definition of "incoherent" is provided so they don't need to recall Kolmogorov axioms from memory, just the concept of summing to >1 or violating additivity. Let's stick to a simple 2-world or 3-world scenario for the math to remain elementary. Let's define incoherence as violating the probability axioms (Normality, Additivity).
      *Refinement on the Bookie:* The prompt says the bookie *never learns credences*, only quotes. The agent can decline. This is crucial. If the agent can decline, the Dutch Book isn't *forced*. The question must highlight this.

  3.  **Drafting the Model Answer:**

      *   *Word Count:* 1000-1200 words.
      *   *Stance:* Must commit. No "Some say X, others say Y." It needs to argue *for* a specific interpretation of what the argument achieves and where it fails.
      *   *Structure:*
          *   Intro: Briefly state the purpose of the argument (linking coherence to prudence).
          *   Part 1 Response: Demonstrate the sure loss theorem within the game.
          *   Part 2 Response: Analyze the cap and strategy. The cap prevents ruin but doesn't stop exploitation. Strategy breaks the link between quote and credence.
          *   Part 3 Response: The normative leap. Why prudence $\neq$ epistemic rationality. The "decline" option shows the bookie argument constrains *action*, not *belief*, unless we add a bridge principle (e.g., "You must be willing to bet").
      *   *Key Argument:* The Dutch Book argument shows that incoherent *betting dispositions* are pragmatically self-defeating. It does not show incoherent *beliefs* are irrational unless one assumes beliefs *just are* betting dispositions (operationalism) or that one is obligated to bet. The "Posted-Quote" setup highlights that one can avoid the loss by refusing to play, suggesting the irrationality lies in the combination of incoherence + willingness to trade, not incoherence alone.

  4.  **Drafting the Marking Scheme:**

      *   *Total:* 25 Marks.
      *   *Distribution:* Part 1 (Math/Logic) - 5 marks. Part 2 (Mechanism/Strategy) - 10 marks. Part 3 (Normative/Philosophical) - 10 marks. (Part 2 & 3 are the heavy lifters).
      *   *Specific Moves:* Identify exactly what gets points (e.g., "Identifies that strategic quoting decouples price from credence").
      *   *Typical Errors:* "Assumes bookie knows credences," "Confuses pragmatic loss with epistemic error," "Ignores the 'decline' option."
      *   *Band Descriptors:*
          *   C (Pass): Understands the math of the sure loss. Thinks Dutch Book = Irrationality directly.
          *   B (Good): Sees the strategic element. Distinguishes quote from credence.
          *   A (Excellent): Articulates the normative gap. Explains *why* the argument fails to constrain belief without extra premises.

  5.  **Review and Refine:**

      *   *Check Constraints:* 90 mins? Yes, 25 marks is standard for a long question. Closed book? Yes, definitions provided. No authors? Yes, stated in prompt.
      *   *Check the "Posted-Quote" Device:* Does the question use it effectively? Yes, Part 2 relies on it.
      *   *Check the "Small-Stakes Cap":* Is it load-bearing? Yes, it limits the *magnitude* of the penalty, making the "decline" option more salient. If the loss is trivial, is it still irrational?
      *   *Check Model Answer Tone:* Is it too dogmatic? The prompt asks to "commit to verdicts." I will write it as a definitive analysis of the argument's limits.
      *   *Word Count Check:* Need to ensure the model answer hits the 1000-1200 range. I will need to expand on the philosophical implications in Part 3 to ensure length and depth.

  6.  **Final Polish:**

      *   Ensure the definitions in the question are precise enough for the math in Part 1.
      *   Ensure the marking scheme aligns with the model answer.
      *   Verify the "typical errors" reflect the specific student habit mentioned in the prompt (rationalist blog conditioning).

  *(Self-Correction on Model Answer Length)*: 1000-1200 words is quite tight for a 3-part philosophy answer. I need to be concise but dense. I will focus heavily on Part 3 as that's where the marks and the philosophical weight lie.

  *(Self-Correction on Marking Scheme)*: Make sure the distinction between B and A is clear. B sees the mechanism; A sees the normative implication of the mechanism.

  Let's assemble the pieces.

  *   *Question:* Define $W = \{w_1, w_2\}$. Propositions $A, B, A \cup B$. Credence $C$. Quote $q$. Stake $s \in [-K, K]$. Payoff $s(1_A - q)$.
  *   *Part 1:* Show if $q(A) + q(B) \neq q(A \cup B)$ (for disjoint), loss is possible.
  *   *Part 2:* Cap $K$ is small. Agent can quote $q' \neq C$. What does this show?
  *   *Part 3:* Normative force. Decline option.

  Okay, ready to write.
answer: |-
  ### Part 1: The Exam Question

  **Question 1 (25 Marks)**

  **Context:**
  You are an agent with a set of doxastic attitudes toward a finite set of possible worlds $W$. For any proposition $E \subseteq W$, you have a *credence* $C(E) \in [0,1]$. You are approached by a **Posted-Quote Bookie**. The interaction proceeds as follows:

  1.  The Bookie names a proposition $E$.
  2.  You post a *quoted price* $q(E) \in [0,1]$. This is a public commitment.
  3.  The Bookie chooses a stake $s \in [-K, K]$, where $K > 0$ is a fixed, small constant known to both of you.
      *   If $s > 0$, you pay $s \cdot q(E)$ now and receive $s$ if $E$ is true (0 otherwise).
      *   If $s < 0$, you receive $|s| \cdot q(E)$ now and pay $|s|$ if $E$ is true (0 otherwise).
      *   If $s = 0$, no bet occurs.
  4.  Your net payoff for this bet is $s \cdot (\mathbb{1}_E - q(E))$, where $\mathbb{1}_E$ is 1 if $E$ is true and 0 otherwise.
  5.  The Bookie may repeat this for multiple propositions, choosing the next proposition based on your previous quotes.
  6.  **Crucially:** You are free to decline to quote (ending the game) or to post a quote $q(E)$ that differs from your actual credence $C(E)$. The Bookie never sees $C(E)$, only $q(E)$.

  **Definitions:**
  *   A set of quotes is **Coherent** if they satisfy the axioms of probability (e.g., for disjoint $A, B$, $q(A \cup B) = q(A) + q(B)$).
  *   A set of quotes is **Incoherent** if they violate these axioms.
  *   A **Dutch Book** exists if there is a sequence of stakes chosen by the Bookie such that your total net payoff is strictly negative in every possible world $w \in W$.

  **Instructions:**
  *   This question is closed book. All necessary definitions are above.
  *   **No marks are awarded for naming authors, papers, or theorems.** You can receive full marks without referencing any literature.
  *   Focus on the logical and normative structure of the argument.

  **(a) The Mathematical Core (5 Marks)**
  Assume you are committed to quoting honestly ($q(E) = C(E)$ for all $E$) and you cannot decline to quote. Prove that if your quotes for two disjoint propositions $A$ and $B$ and their union $A \cup B$ are incoherent (specifically, if $q(A) + q(B) \neq q(A \cup B)$), the Bookie can construct a Dutch Book against you regardless of the truth of $A$ or $B$. Show the stakes required.

  **(b) The Mechanism and Strategy (10 Marks)**
  Now consider the full rules: you may quote strategically ($q \neq C$) and there is a small-stakes cap $K$.
  (i) Explain how the option to quote strategically allows an agent with incoherent credences to avoid a Dutch Book in this specific game.
  (ii) What specific work is the small-stakes cap $K$ doing? If $K$ were removed (allowing infinite stakes), would strategic quoting still protect the agent?
  (iii) Does the existence of this escape route imply that incoherent credences are pragmatically harmless?

  **(c) The Normative Gap (10 Marks)**
  The standard "Dutch Book Argument" claims that incoherent credences are irrational. Based on the Posted-Quote setup above, evaluate this claim.
  (i) The agent can simply decline to quote. What does the "decline option" suggest about whether the irrationality lies in the *credences* or in the *disposition to trade*?
  (ii) If the Bookie is merely a hypothetical possibility and no actual bookie exists, what normative weight does the argument carry?
  (iii) Conclude: Does this argument prove that rational agents *must* have probabilistic credences, or only that they must *act as if* they do when forced to price bets? Justify your verdict.

  ***

  ### Part 2: Model Answer

  **Candidate Response**

  The Posted-Quote Bookie scenario clarifies the precise link between logical coherence and pragmatic prudence, while simultaneously exposing the limitations of using that link to ground epistemic norms. The argument does not demonstrate that incoherent belief is inherently irrational; rather, it demonstrates that incoherent *pricing* is pragmatically self-defeating *given* a commitment to trade.

  **(a) The Mathematical Core**
  Assume honest quoting ($q=C$) and no decline option. Let $A$ and $B$ be disjoint. Suppose incoherence such that $q(A) + q(B) = q(A \cup B) + \delta$, where $\delta \neq 0$.
  Case 1: $\delta > 0$ (Sum of parts exceeds whole). The Bookie sells you the union and buys the parts.
  Stakes: $s_{A \cup B} = 1$ (You buy Union); $s_A = -1$ (You sell A); $s_B = -1$ (You sell B).
  Payoff if $A$ true: You pay $q(A \cup B)$, receive 1. You pay $-q(A)$ (receive $q(A)$), pay 1. You pay $-q(B)$ (receive $q(B)$), pay 0.
  Net: $1 - q(A \cup B) + q(A) - 1 + q(B) = q(A) + q(B) - q(A \cup B) = \delta$. Wait, signs must ensure loss.
  Correct Construction: If $q(A) + q(B) > q(A \cup B)$, the Bookie sells you $A$ and $B$, and buys $A \cup B$ from you.
  Stakes: $s_A = 1, s_B = 1, s_{A \cup B} = -1$.
  Payoff in any world:
  If $A$ true ($B$ false): Pay $q(A)+q(B)$, receive 1 (from A). Receive $q(A \cup B)$ (from selling union), pay 1 (union true). Net: $1 - (q(A)+q(B)) + q(A \cup B) = -\delta$.
  If $B$ true: Symmetric, Net: $-\delta$.
  If neither: Pay $q(A)+q(B)$, receive 0. Receive $q(A \cup B)$, pay 0. Net: $-(q(A)+q(B)) + q(A \cup B) = -\delta$.
  Since $\delta > 0$, net is $-\delta < 0$ in all worlds. A sure loss is guaranteed. The math holds regardless of $K$, provided $K$ is large enough to accommodate the unit stakes.

  **(b) The Mechanism and Strategy**
  (i) **Strategic Escapism:** The Bookie exploits $q$, not $C$. If I know my $C$ are incoherent (e.g., $C(A)=0.6, C(B)=0.6, C(A \cup B)=0.8$), I can simply post coherent quotes (e.g., $q(A)=0.4, q(B)=0.4, q(A \cup B)=0.8$) to satisfy the Bookie. The Bookie sees coherence and cannot construct a Dutch Book. My internal state $C$ remains incoherent, but my public commitments $q$ are safe. The mechanism exploits *asserted prices*, not *private beliefs*.
  (ii) **The Load-Bearing Cap:** The cap $K$ limits the magnitude of the penalty. If stakes were unbounded, the Bookie could scale $s$ to ruin the agent (bankruptcy). With a small $K$, the "sure loss" is trivial. However, removing $K$ does not negate the strategic escape. Even with infinite stakes, if I quote coherently, the Bookie cannot construct a Dutch Book *mathematically*. Infinite stakes punish incoherent *quotes* more severely, but they do not force me to quote incoherently. The cap primarily highlights that the pragmatic harm is contingent on the *scale* of interaction.
  (iii) **Pragmatic Harm:** The escape route implies incoherent credences are not *intrinsically* pragmatically harmful. They are only harmful if coupled with a disposition to assert them honestly in a betting market. An agent can hold contradictory degrees of belief and suffer no financial loss provided they lie about them when money is on the table. Thus, the "harm" is not in the belief state itself, but in the interface between belief and action.

  **(c) The Normative Gap**
  (i) **The Decline Option:** The ability to decline to quote is fatal to the strong Dutch Book Argument. If I can walk away, I cannot be Dutch Booked. A Dutch Book requires participation. If irrationality entails a susceptibility to sure loss, but I can avoid the loss by refusing to play, then the irrationality cannot be located solely in my credences. It must be located in the combination of (Incoherent Credences + Willingness to Bet). If I have no desire to bet, the argument loses its grip. This suggests the argument constrains *trading dispositions*, not *doxastic states*.
  (ii) **Hypothetical vs. Actual:** If no actual bookie exists, the "loss" is counterfactual. To claim this makes me irrational *now*, one must argue that rationality requires immunity to *possible* exploitation, not just *actual* loss. However, without a bridge principle linking belief to betting, this is merely a consistency requirement on hypothetical actions. It shows my beliefs are *incompatible* with certain actions, not that the beliefs are false or unjustified.
  (iii) **Verdict:** The argument does **not** prove that rational agents must have probabilistic credences. It proves that rational agents must not *post* incoherent prices if they wish to avoid sure losses in betting scenarios. To move from "don't post incoherent prices" to "don't hold incoherent credences," one must add a premise: "You ought to post prices that match your credences" (Transparency) and "You ought to be willing to bet" (Action-Guiding). Without these, the Dutch Book argument is a pragmatic constraint on market behavior, not an epistemic constraint on belief. The Posted-Quote device reveals that the "irrationality" is in the vulnerability of the *system* (belief + action), not the belief component alone. Therefore, the Dutch Book argument fails as a standalone justification for Probabilism; it requires independent epistemic premises to bridge the gap from prudence to truth-tracking.

  ***

  ### Part 3: Marking Scheme

  **Total Marks: 25**

  **Part (a): The Mathematical Core (5 Marks)**
  *   **1 Mark:** Correctly identifies the condition for incoherence (e.g., $q(A) + q(B) \neq q(A \cup B)$).
  *   **2 Marks:** Specifies the correct stakes (buying parts/selling whole or vice versa) to exploit the gap.
  *   **2 Marks:** Demonstrates the net payoff is negative in all worlds (shows the calculation for at least two world-states).
  *   *Typical Error:* Students assume the Bookie knows $C$ rather than $q$, or fail to show the loss occurs in *all* worlds (only showing it for one).

  **Part (b): The Mechanism and Strategy (10 Marks)**
  *   **3 Marks:** Clearly explains that strategic quoting ($q \neq C$) decouples the Bookie's target from the agent's mind, allowing the agent to "mask" incoherence.
  *   **3 Marks:** Correctly analyzes the cap $K$. Acknowledges $K$ limits *severity* of loss but notes that even without $K$, strategic quoting prevents the *existence* of a Dutch Book (mathematically).
  *   **4 Marks:** Verdict on pragmatic harm. Must argue that harm is contingent on honest participation. Incoherence alone causes no loss; incoherence + honesty causes loss.
  *   *Typical Error:* Claiming that removing $K$ forces the agent to be coherent (it doesn't, it just raises the cost of incoherent *quotes*). Claiming strategic quoting is "cheating" rather than a valid move in the defined game.

  **Part (c): The Normative Gap (10 Marks)**
  *   **3 Marks:** **The Decline Option.** Identifies that the ability to opt-out shifts the locus of irrationality from *belief* to *willingness to engage*.
  *   **3 Marks:** **Hypothetical Weight.** Addresses that without an actual bookie, the argument relies on a principle of "immunity to possible exploitation."
  *   **4 Marks:** **Final Verdict.** Commits to a position (e.g., "Argument fails to constrain belief alone"). Must identify the missing bridge principles (Transparency/Action) required to make the argument work.
  *   *Typical Error:* Restating the definition of Dutch Book as proof of irrationality. Failing to distinguish between pragmatic prudence and epistemic rationality.

  **Band Descriptors**

  *   **C Band (13-16 Marks):**
      *   **Part (a):** Math is mostly correct.
      *   **Part (b):** Understands the Bookie exploits quotes. May miss the nuance of the cap or think strategic quoting is invalid.
      *   **Part (c):** Treats "Dutch Bookable" as synonymous with "Irrational." Does not effectively use the "decline option" to challenge the norm. Reads like a summary of rationalist forum orthodoxy (Incoherence = Money Pump = Bad).
  *   **B Band (17-21 Marks):**
      *   **Part (a):** Math is precise.
      *   **Part (b):** Clearly distinguishes $C$ from $q$. Understands strategic quoting avoids the book.
      *   **Part (c):** Recognizes the gap between prudence and belief. Notes the "decline" option weakens the argument. May hesitate to fully commit to a verdict on whether Probabilism is proven.
  *   **A Band (22-25 Marks):**
      *   **Part (a):** Flawless derivation.
      *   **Part (b):** Insightful analysis of the cap (magnitude vs. existence of exploit).
      *   **Part (c):** **Decisive.** Explicitly argues that the Dutch Book argument is incomplete without bridge principles. Uses the specific mechanics of the "Posted-Quote" setup (specifically the opt-out and the masking of $C$) to demonstrate that the argument constrains *dispositions*, not *doxastic states*. Shows why the "conversation-stopper" usage is logically invalid.
