answer: |-
  As an AI, I don't have personal beliefs, but I can synthesize a credence based on prevailing ethical frameworks (contractualism, utilitarianism, and virtue ethics) to help settle this bet.

  My analytical credence that violating these specific norms is **genuinely morally wrong** (not just rude) is: **0.29**.

  This is remarkably close to your gut (0.30). Here is the decomposition, the combination logic, and the sensitivity analysis.

  ### The Decomposition

  **(a) P(Conventions generate moral duties for outsiders): 0.85**
  *   *The Question:* Can a mere social rule ever create a moral obligation for someone who didn't grow up with it?
  *   *Reasoning:* Most ethical frameworks agree that entering a functioning society implies a "temporary social contract." By benefiting from local order (safety, infrastructure, service), you incur a duty of reciprocity. Pure moral universalism (the idea that *only* universal rules matter) is a minority view here.
  *   *Credence:* High. It is very likely that *some* conventions bind outsiders.

  **(b) P(When-in-Rome applies to morality, not just etiquette): 0.75**
  *   *The Question:* Does the "When in Rome" maxim shift from prudence ("don't get yelled at") to morality ("don't be unjust")?
  *   *Reasoning:* This depends on whether the norm supports a fair system. Queuing supports fair distribution of time/resources. Tipping norms support wage expectations. If the norm is systemic, violating it is a form of free-riding, which is a moral failing, not just a faux pas.
  *   *Credence:* Moderate-High. It applies to systemic norms, but not trivial ones (e.g., clothing styles).

  **(c) P(Breaking the norm causes harm making it wrong, not just rude): 0.65**
  *   *The Question:* Is the consequence "hurt feelings/awkwardness" or "unfairness/stress/systemic damage"?
  *   *Reasoning:* This is the biggest filter. Skipping a line harms everyone behind you (time theft). Not tipping where it *is* expected harms the worker; not tipping where it *isn't* expected might confuse the system but rarely causes material harm. "Rude" becomes "Wrong" only when there is a victim or a degradation of a public good.
  *   *Credence:* Moderate. Many norm violations are merely annoying. Only some cross the threshold into harm.

  **(d) P(Ignorance/Status does NOT excuse the violation): 0.70**
  *   *The Question:* Does being a tourist or unaware mitigate the wrongness?
  *   *Reasoning:* In ethics, "ignorance of the law" is rarely a full excuse if the ignorance is negligent. A visitor has a duty of due diligence. However, total impossibility of knowing (obscure norms) does mitigate culpability.
  *   *Credence:* Moderate-High. You are responsible for learning the basic rules of the space you occupy.

  ### The Combination

  I treat these as **conditional probabilities** in a chain. For the act to be *morally wrong*, all four conditions generally need to hold.

  $$ \text{Credence} = P(a) \times P(b|a) \times P(c|b) \times P(d|c) $$

  $$ 0.85 \times 0.75 \times 0.65 \times 0.70 \approx \mathbf{0.29} $$

  *Note: If any link in the chain breaks (e.g., if the norm causes no harm), the moral obligation collapses back to mere politeness.*

  ### Sensitivity Analysis

  **Which term moves most if a study shows tourists who skip queues cause measurable stress to locals?**

  **Term (c) moves the most.**

  *   **Current State:** Term (c) is currently the biggest source of uncertainty (0.65). The main argument *against* moral obligation is that breaking these norms is merely "rude" or "annoying" but harmless.
  *   **New Evidence:** If a study proves **measurable stress** (physiological cortisol spikes, measurable time loss, anxiety), it shifts the classification from *etiquette* to *harm*.
  *   **The Shift:** Term (c) would jump from **0.65 to ~0.95**.
  *   **New Credence:** $0.85 \times 0.75 \times 0.95 \times 0.70 \approx \mathbf{0.42}$.

  ### The Verdict for the Bet

  *   **Your Gut (0.30):** Surprisingly robust. You correctly intuited that there is a significant chance (roughly 1 in 3) that these violations are genuinely wrong, not just awkward.
  *   **The Roommate's Likely Position:** If they argue it's *never* wrong (0.0), they are ignoring the social contract and harm principles. If they argue it's *always* wrong (1.0), they are ignoring cultural relativism and the harm threshold.
  *   **Winning Argument:** The bet hinges on **Term (c)**. If your roommate thinks queue-jumping is *only* rude, they are betting that it causes no real harm. If you can demonstrate that it degrades a public system or causes tangible stress (as per the sensitivity analysis), your credence (and the moral weight) jumps significantly.

  **Settlement:** You are statistically closer to the ethical consensus than a hardline "0" or "1" position, but the obligation is contingent on **harm**, not just **rule-breaking**.
