  **Argument and Framing**
  This project argues that the covering-law versus narrative dispute is framed around the wrong question. Both sides ask what explains an event, assuming a single explanatory relation. This proposal posits two distinct questions: a forward-looking expectation (nomological) and a backward-looking intelligibility (narrative). The innovation lies in treating the temporal asymmetry of narrative not as a defect but as a feature that distinguishes it from subsumption. Crucially, the project argues that accreted detail in narrative is not decorative. In a deductive model, detail is vice; in narrative, it is virtue. This proposal contends that detail stabilises the counterfactual dependencies the narrative asserts. By thickening the story with hesitations and near-misses, the historian demonstrates that the outcome was not inevitable but dependent on specific, contingent nodes. This framing allows us to say what the standard formulation cannot: that a narrative can be objectively correct or incorrect based on the stability of its counterfactuals, rather than merely plausible or illuminating. It moves the debate from 'is history a science?' to 'what is the logic of retrospective causation?'.

  **Method and Case Studies**
  The methodology combines conceptual analysis with comparative case study. Year one will establish the theoretical framework, analysing the logic of retrospective significance and defining 'counterfactual stability' in narrative contexts. I will need to consult literature on formal causal modelling to ensure precision here, as this lies outside my current expertise. Years two and three will apply this framework to two well-documented episodes: the outbreak of the First World War (1914) and the dissolution of the Soviet Union (1991). These cases offer competing narratives with common-knowledge outlines, avoiding the need for archival work.

