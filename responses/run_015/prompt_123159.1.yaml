  **Outcomes and Failure Conditions**
  Possible conclusions are twofold. Either retrospective causal significance is ontic, reflecting a real feature of historical events, or it is epistemic, reflecting only the historian's vantage point. Considerations deciding this will include whether counterfactual stability holds across different narrative perspectives. If stability varies solely with the narrator's position, the epistemic view wins. If it holds invariantly, the ontic view stands.

  An honest account of failure is necessary. The project fails if retrospective causal significance turns out to be only a fact about the historian's vantage point, reducible to epistemic limitations. It also fails if the account collapses into an ordinary interventionist or contrastivist one dressed up in narrative vocabulary without adding explanatory power. If 'counterfactual stability' proves indistinguishable from standard causal modelling, the distinctiveness of narrative explanation vanishes. Finally, the project fails if the case studies prove too complex to analyse without archival work, though the selection of 1914 and 1991 mitigates this risk.

  **Scope and Risks**
  The scope is tight for a three-year doctorate. The primary risk is historical depth; analysing competing narratives requires substantial familiarity with the historiography. I would cut the 1991 case study first if time pressures mount, focusing solely on 1914 to ensure philosophical rigour. Additionally, I currently lack technical training in formal causal modelling. I will need to undertake self-directed study in this area during the first year to ensure the concept of 'counterfactual stability' is robustly defined. This learning curve is a risk but manageable within the timeframe. The project remains feasible because it relies on conceptual clarity and existing historiography rather than new empirical data.
