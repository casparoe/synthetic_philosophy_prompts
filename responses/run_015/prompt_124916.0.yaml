answer: |-
  ### Brainstorming Pass: Candidate Diagnoses

  Here are eight candidate diagnoses for the pattern you describe, drawn from distinct philosophical subfields. I will evaluate them for fit, rejecting those that fail to capture the structural asymmetry or the immunity to dissolution you note.

  1.  **Verbal Dispute / Metaphysical Semantics (Metaphilosophy)**
      *   *Concept:* The parties are using the same words ("belief," "agent") with different semantic intensions (Chalmers 2011; Thomasson 2015).
      *   *Verdict:* **Rejected.** As you noted, pointing this out does not dissolve the dispute. In a standard verbal dispute, once the ambiguity is flagged, parties typically agree to disagree on words while acknowledging factual agreement. Here, both sides insist they win on *both* the descriptive and normative fronts. The shift is not merely semantic confusion; it is a strategic deployment of modality.

  2.  **Pragmatic Encroachment (Epistemology)**
      *   *Concept:* Whether a subject "knows" or is "justified" depends on the practical stakes of the situation (Fantl & McGrath 2007).
      *   *Verdict:* **Rejected.** This applies to epistemic statuses (knowledge, justification), not ontological boundaries (what constitutes the mind/agent). While structurally similar (stakes affect classification), it does not explain the *switch* between empirical and normative *modes of argumentation*. Pragmatic encroachment usually keeps the argument within epistemology; your pattern involves jumping between metaphysics and ethics.

  3.  **Motivated Reasoning / Ideological Defense (Social Epistemology)**
      *   *Concept:* Theorists unconsciously select argumentative strategies that protect pre-existing ideological commitments (e.g., preserving moral responsibility).
      *   *Verdict:* **Rejected (with reservation).** While likely psychologically true, this is an ad hominem explanation, not a structural one. It explains *why* they might want to shift, but not *how* the shift is philosophically sustainable or why it appears transparent to peers. It treats the phenomenon as a bug (bias) rather than a feature of the conceptual landscape.

  4.  **Conceptual Engineering (Metaphilosophy)**
      *   *Concept:* Philosophers are intentionally tweaking concepts to serve better purposes (Carnap 1950; Cappelen 2018).
      *   *Verdict:* **Partial Fit.** This captures the "what we want our notion to do" aspect. However, standard conceptual engineering requires a degree of self-awareness and explicit stipulation. Your observation is that theorists *deny* they are engineering when it suits them, claiming instead to be making empirical discoveries. This is engineering *in disguise*.

  5.  **Ontological Pluralism (Metaontology)**
      *   *Concept:* There are multiple equally valid ways to carve up reality; existence is not univocal (Hirsch 2002; Thomasson 2015).
      *   *Verdict:* **Rejected.** Pluralism suggests peaceful coexistence of frameworks. Your pattern describes *conflict* where each side claims their framework is the *correct* one for the case at hand. Pluralism dissolves the fight; your phenomenon fuels it.

  6.  **The "Burden of Proof Artifact" (Your Colleague's Proposal)**
      *   *Concept:* Extraordinary claims (expansion) require empirical evidence; high-stakes claims (contraction/responsibility) require normative justification.
      *   *Verdict:* **Rejected.** This explains the *intensity* of scrutiny but not the *modality*. If this were true, both sides would argue about the *same* facts but demand different standards of proof. Instead, one side cites neural coupling (empirical) while the other cites responsibility practices (normative). They are playing different games, not just raising the stakes of one game.

  7.  **Normative Metaphysics (Emerging Literature)**
      *   *Concept:* Metaphysical questions (e.g., about persons, objects) are inextricably linked to normative questions (e.g., rights, responsibility) (Baker 2013; Koslicki 2012).
      *   *Verdict:* **Strong Contender.** This literature acknowledges the entanglement. However, it often treats this entanglement as a static feature. It does not explicitly name the *asymmetrical switching* behavior where the entanglement is highlighted only when it supports a contraction, and hidden when it supports an expansion.

  8.  **Strategic Ontological Plasticity (My Proposal)**
      *   *Concept:* A structural tendency in philosophy of mind where the *modality* of the boundary question (Is it empirical? vs. Is it normative?) is determined by the *valence* of the proposed boundary change (Expansion vs. Contraction), regardless of the theorist's stated metaphysical commitments.
      *   *Verdict:* **Best Fit.** This captures the directional asymmetry and the immunity to dissolution (because the plasticity is functional, not accidental).

  ---

  ### Diagnosis: Does this have a name?

  There is no single established term for this specific *asymmetrical switching* pattern. It is discussed piecemeal under **Metaontology**, **Normative Metaphysics**, and **Conceptual Engineering**, but the literature generally treats these as stable positions rather than dynamic strategies that shift within a single debate or across related debates.

  The nearest established concept is **"Metaphysical Activism"** (sometimes associated with Kriegel or Haslanger), which admits that metaphysical claims can be driven by political or ethical goals. However, this usually implies a conscious adoption of a normative stance. Your observation is sharper: it is the *oscillation* between claiming "This is a discovery!" and "This is a decision!" depending on which claim yields the desired boundary.

  I propose we call this phenomenon: **The Ontological-Normative Toggle.**

  #### Definition
  The **Ontological-Normative Toggle** is a dialectical pattern in boundary disputes concerning cognitive or agential systems. It occurs when:
  1.  **Expansionary Moves** (including external tools or internal sub-systems into the agent) are defended via **Empirical/Functional** arguments (e.g., "The coupling is reliable," "The causal role is identical").
  2.  **Contractionary Moves** (excluding tumors, implants, or habits from the agent) are defended via **Normative/Pragmatic** arguments (e.g., "We cannot hold them responsible," "This violates authenticity").
  3.  Crucially, the *same* theorists (or the dialectic as a whole) treat the *modality of the question* as dependent on the *desired outcome*, while maintaining the illusion that the modality is fixed by the subject matter.
  4.  Attempts to dissolve the dispute by separating the "Is" from the "Ought" fail because both sides claim their preferred boundary is supported by *both* the facts and the norms.

  #### Boundary Cases
  *   **Fits the Pattern:** The Extended Mind (Notebook) vs. Pathological Internalism (Tumor/DBS). Also: Group Agency (Is a corporation an agent? Expansion = Empirical functionalism; Contraction = Normative responsibility).
  *   **Does Not Fit:** Disputes where both sides agree on the modality but disagree on the evidence (e.g., "Is the notebook *reliably* coupled?" where both agree reliability is the empirical criterion).
  *   **Does Not Fit:** Pure ethical disputes where no ontological claim is made (e.g., "Should we treat the notebook user *as if* they remember?" without claiming they *do* remember).

  ---

  ### Critique of Your Description

  Your description is philosophically astute, but I must flag one potential confusion regarding the **Extended Mind (EM)** debate history.

  You write: *"The proponent replies that... where the boundary falls is an empirical and theoretical question rather than one to be settled by intuitions."*
  *Correction:* Clark and Chalmers (1998) were actually quite open about the pragmatic nature of their claim. They argued for the *parity principle* based on functional role, but often admitted that if the intuition strongly resists, we might just be arguing about the word "belief."
  *The Shift:* The *critics* of EM (Adams & Aizawa) are the ones who typically insist that cognition is *intrinsically* internal (an empirical/metaphysical claim) to block the expansion.
  *However*, your core observation holds in the **DBS/Tumor** literature. There, the "Expansionists" (those who want to say the DBS user is still an agent) often switch to Normative arguments ("We must respect their autonomy"), while the "Contractionists" (those who say the DBS controls the action) often use Empirical arguments ("The stimulation bypasses the will").
  *Refinement:* The Toggle might not be perfectly aligned with "Expansion = Empirical." It might be aligned with **"Inclusion = Empirical"** when the inclusion is benign (notebook), but **"Exclusion = Normative"** when the exclusion is protective (responsibility). The modality shifts to protect the *normative status* of the agent.

  ---

  ### Addressing the Colleague's Deflationary Explanation

  Your colleague suggests this is a **Burden-of-Proof Artifact**: Boundary-expanding claims are surprising (need evidence); boundary-contracting claims are high-stakes (need justification).

  **Why this is insufficient:**
  If the colleague were right, we would see a difference in *rigor*, not a difference in *kind*.
  *   *Colleague's Prediction:* In both cases, theorists argue about the *same features* (causal coupling, reliability), but demand more proof for the surprising claim.
  *   *Your Observation:* Theorics argue about *different features*. In the notebook case, they argue about **reliability and access** (empirical). In the tumor case, they argue about **authenticity and responsibility** (normative).

  **How to Distinguish Empirically:**
  To test your hypothesis against your colleague's, conduct a **Citation Analysis** of the arguments in these debates.
  1.  **Code the Premises:** Categorize every premise used in the arguments as either *Descriptive* (citing data, mechanisms, causal chains) or *Normative* (citing practices, values, responsibilities, intuitions about fairness).
  2.  **Correlate with Direction:** Map these against the *direction* of the boundary claim (Expand vs. Contract).
  3.  **The Test:**
      *   If the Colleague is right: The ratio of Descriptive/Normative premises should remain stable; only the *length* and *complexity* of the argument should change.
      *   If you are right: There will be a statistically significant correlation between **Expansion** and **Descriptive Premises**, and **Contraction** and **Normative Premises** (or vice versa, depending on the specific protective motive).

  My expectation is that you will find the Toggle. The literature on DBS and agency (e.g., work by Gilbert, Walter, or Baylis) frequently slides from "The stimulation alters the circuitry" (Descriptive) to "Therefore it is not *her* action" (Normative) without bridging the is-ought gap, precisely because the descriptive fact is being recruited to serve a normative boundary.

  ---

  ### Resolution: What would settling this come to?

  If the Ontological-Normative Toggle is real, **settling the dispute is neither a pure discovery nor a pure decision.** It is a **Stipulative Stabilization.**

  1.  **Not Discovery:** There is no "fact of the matter" about whether the notebook is *literally* part of the mind independent of our interests, because "mind" is a functional-kind term tied to practices of prediction and responsibility.
  2.  **Not Decision:** It is not arbitrary. We cannot simply decide the tumor is part of the agent if doing so breaks our practices of holding people responsible. The "decision" is constrained by the *cost* of changing our practices.
  3.  **The Resolution:** Progress comes from **Explicit Conceptual Engineering**.
      *   Instead of asking "Is the notebook part of the mind?", we ask: "For the purpose of *memory attribution*, should we treat the notebook as memory? For the purpose of *moral responsibility*, should we treat the DBS output as the agent's will?"
      *   **Progress Condition:** A debate makes progress when participants stop claiming their boundary is the *only* metaphysically valid one and start mapping the **trade-offs** of different boundary drawings.
      *   *Example:* "If we include the notebook, we gain explanatory power in cognitive science but complicate legal testimony. If we exclude it, we preserve legal clarity but misdescribe the cognitive mechanism."

  **What counts as progress?**
  Progress is marked by the **disappearance of the Toggle**. When theorists explicitly say, "Metaphysically, the system is coupled; Normatively, we may still wish to exclude the tumor for responsibility," the cycle breaks. The persistence of the cycle indicates that participants are invested in maintaining the **illusion of a unified answer** (where Fact and Value align perfectly) because that illusion grants their position more authority.

  ### Summary of the Carving

  *   **Established Terminology:** Metaontology, Normative Metaphysics, Conceptual Engineering.
  *   **Your Phenomenon:** The **Ontological-Normative Toggle**.
  *   **Definition:** The strategic shifting of argumentative modality (Empirical vs. Normative) contingent on the desired direction of a boundary change (Expansion vs. Contraction), characterized by immunity to is/ought dissolution.
  *   **Colleague's View:** Incorrect. It confuses *standards of proof* with *types of premises*.
  *   **Path Forward:** Move from implicit metaphysical realism to explicit conceptual pluralism. Acknowledge that "The Agent" is a cluster concept serving multiple masters (science, law, ethics), and that these masters may require different boundaries.

  You have identified a structural feature of how philosophy of mind protects its normative core while wearing empirical clothing. It is not noise; it is the sound of the discipline trying to be both a science of nature and a guardian of the person simultaneously.
