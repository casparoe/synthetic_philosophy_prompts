answer: |-
  Five years ago, your safety committee voted to mandate pre-load engine checks instead of post-load checks, a decision made solely because the proponent spoke first on a day the meeting ran past lunch, leaving the tired room prone to acquiesce to the first clear voice; everyone, including your operations director Elena, admits the origin was arbitrary and unrelated to mechanical efficacy. Yet when a major client recently offered a lucrative contract contingent on skipping those checks to meet tighter deadlines, Elena refused, losing the contract and triggering bonus cuts for herself, arguing that while the specific rule began as an accident, maintaining it is now essential to the culture of diligence you owe your drivers, and she would defend the rule even knowing its history because the cost of changing it now outweighs the inefficiency of the check itself.

  (1) **Test Runs:**
  *   **History Test:** Returns **Bias**. The judgment exists because of irrelevant causal factors (speaker order, fatigue) rather than evidence of mechanical superiority. The genealogy is tainted.
  *   **Steady-State Test:** Returns **Preference/Conviction**. The judgment is stable under pressure (refused client), coherent with other commitments (safety culture), and acted upon at significant personal cost (bonus cut). It functions as a principled stand, not a reflex.

  (2) **Single Feature:**
  *   **Normative Integration.** The judgment has been woven into a wider web of values (trust, culture, procedural integrity) such that its justification no longer relies on its origin but on its current structural role.

  (3) **Removal Effect:**
  *   If you remove the **Normative Integration** (she follows the rule only because "it's the rule" without the cultural argument), the case collapses into **ordinary bias** (stubborn adherence to an arbitrary standard).
  *   If you remove the **Arbitrary History** (the rule was chosen via data), it becomes an **ordinary preference** (a standard conviction based on evidence). The divergence exists only where a tainted origin is redeemed by subsequent integration.

  (4) **Skeptic Reply:**
  *   **Skeptic:** "She is merely rationalizing sunk costs; losing the bonus proves she's stubborn, not principled."
  *   **Reply:** Rationalization protects the self; sacrifice exposes it. If she were merely rationalizing a bias, she would find a way to keep the contract and the bonus. Accepting the loss demonstrates the judgment is held independently of her self-interest, which is the hallmark of conviction.

  **Mirror Test Analysis:**
  If the vote had gone the other way (post-load checks), Elena would likely defend *that* rule with equal vigor, provided it was the established protocol. The Mirror Test therefore returns **Bias** (the specific content is contingent). However, this does not show she is biased; it shows the Mirror Test is ill-suited for **procedural norms**. In institutional settings, the value often lies in *having* a settled rule, not *which* rule is settled. The test confuses contingency with arbitrariness. It is a bad test for this class of judgment.

  **Commitment:**
  The case works. The tests genuinely come apart in the direction you requested: the history is objectively biased, but the current holding is objectively principled. This shows that your colleague is wrong to treat "bias" and "conviction" as mutually exclusive categories. A judgment can be genealogically biased but functionally convictions. The History Test identifies *risk of error* at the source; the Steady-State Test identifies *integrity of holding* at present. Neither captures the whole picture alone. The distinction you are looking for is not between bias and preference, but between **tainted origin** and **redeemed status**. Your colleague's claim that "any moral view you cannot argue someone into is just a preference" fails here: Elena cannot be argued out of the rule (Steady-State), but she is not merely preferring it (she sacrifices for it), nor is she simply biased (she acknowledges the history). The gap between the tests is where moral growth happens—where accidental starts become deliberate commitments.
