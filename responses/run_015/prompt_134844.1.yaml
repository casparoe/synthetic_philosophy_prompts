      *   Explain why it seemed unavoidable? Yes (conflation of vocabulary and valuation).
      *   State what abandoning it requires? Yes (shift from teleological to contextual coherence).
      *   Address (2) vs Presentism? Yes (concepts are tools, not teleological magnets).

      *(Self-Correction during drafting)*: Make sure to explicitly mention that (2) is actually compatible with anti-Whig history. The colleague's trick is moving from "we use our concepts" to "we use our concepts *as a standard of progress*."

