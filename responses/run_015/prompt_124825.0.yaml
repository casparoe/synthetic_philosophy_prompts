  TO: Collections Care Committee
  FROM: Chair
  DATE: 24 May 2024
  SUBJECT: Decision on Ethical Policy and Pesticide-Free Proposal

  The Committee recommends accepting both the Director's proposal and the petitioners' policy, subject to specific conditions regarding implementation and definition.

  **Recommendation**
  1.	Adopt the ethical policy, defining 'necessary' killing to include protection of material where replacement costs exceed treatment costs or causes significant educational disruption.
  2.	Accept the 'pesticide-free' resolution, interpreting 'pesticide' as chemical residues only, acknowledging that physical eradication methods remain lethal.
  3.	Implement a two-year transition programme.

  **Rationale and Difficulties**
  We must face three uncomfortable truths rather than bypass them. First, non-chemical treatments are not humane alternatives to killing; they are alternative methods of killing. Nitrogen anoxia induces starvation over weeks. We authorise this not because it is painless—sentience remains unsettled—but because it avoids chemical contamination of specimens and staff. It is the least distressing method compatible with our duty of care. We cannot claim moral purity here; we are choosing mechanics of death over chemistry.

  Second, we must distinguish the larvae from research specimens. The petitioners note we deliberately kill insects for the research collection. The distinction lies in intent: research killing generates knowledge; pest killing prevents destruction. However, we acknowledge the hypocrisy risk. We must ensure research collecting remains justified by scientific output, not habit. We cannot claim high ground on sentience while pinning beetles for taxonomy unless the knowledge gained outweighs the life taken.

  Third, the teaching collection is replaceable. Strictly applying the petitioners' criterion—kill only to save the irreplaceable—would permit the infestation to destroy these sheets. We reject this. 'Necessary' protection includes fiscal responsibility and educational continuity. Discarding and replacing infested material wastes resources better spent on conservation. Therefore, saving replaceable material is 'necessary' under these conditions. To let the collection burn to save larvae would be economically irresponsible.

  **Consideration of Opposing Views**
  The Director's proposal secures a £1.2m bequest, vital for our infrastructure. Rejecting this would jeopardise the museum's future capacity to care for *any* collection. Financial viability is a precondition for ethical care.

  However, the petitioners' moral claim deserves honest treatment, particularly as their strict criterion is overridden here. They argue the word 'pest' does moral work, framing insects as aggressors to license carelessness. They are correct. Language shapes practice. By labelling larvae 'pests', we risk ignoring the environmental conditions that invited them. If we override their criterion to save replaceable teaching material, we risk validating that carelessness. We must acknowledge this loss. By deciding to kill the larvae to save replaceable sheets, we are prioritising institutional convenience over the petitioners' strict ethical boundary. This is a genuine moral cost. We accept the funding, but we do not accept the moral simplification. The money enables care, but it does not absolve the killing.

  **Timetable**
  *   **Immediate:** Adopt ethical policy with amended definitions.
  *   **Months 1–12:** Audit current chemical stocks; phase out prohibited substances.
  *   **Months 12–24:** Install anoxia chambers; complete staff training.
  *   **Month 24:** Formal declaration of 'pesticide-free' status to donor.

  We proceed with the funding, but without moral absolution. The committee recognises that while we must kill to preserve, we must do so with eyes open to the cost.
