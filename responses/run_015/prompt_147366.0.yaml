  A customer calls tech support.
  "The manual says 'Press Start to Run'."
  "I did. It didn't run."
  "Then we must broaden the definition of 'Run'."
  "It didn't move at all."
  "Then we'll adjust the laws of physics."

  This joke turns on Quine's confirmation holism: the claim that the unit of empirical significance is the whole system, so any statement can be held true come what may by making drastic adjustments elsewhere in the web of belief. If the analytic-synthetic distinction were genuine and clean, the manual's claim would have fixed empirical content that failed, forcing an admission of error rather than allowing the agent to save the statement by tweaking the background laws.
