prompt: |-
  You are a senior methodology officer and philosopher of mind advising a multi-site cognitive neuroscience consortium that runs repeated consciousness studies—roughly forty sessions per quarter—staffed mainly by graduate students and technicians with uneven philosophical training. You need a reusable, operational protocol that translates heterophenomenology into a practical workflow: a step-by-step decision procedure, with explicit nodes and time constraints, that treats every subject’s verbal and behavioral report about conscious experience as a text within that subject’s heterophenomenological world, not as direct, authoritative access to private mental states. The procedure must remain ontologically neutral among competing theoretical frameworks (for instance, global workspace, higher-order, and integrated-information accounts), and it must be executable within fifteen minutes per case by a researcher with only a master’s-level background, with the principal investigator required to sign off solely at nodes where judgment genuinely cannot be eliminated.

  Your deliverable should contain: (1) a preliminary screening checklist that decides whether a session’s data qualify for heterophenomenological treatment rather than for standard introspective or purely behavioral protocols; (2) an ordered sequence of no more than five interpretive tests—expressed as questions a non-expert can apply—to classify any given report as descriptive within the heterophenomenological world, confabulatory, theoretically loaded, or ambiguous; (3) clearly marked JUDGMENT REQUIRED points at every stage where the theory underdetermines the decision, specifying exactly what the PI must evaluate and sign; (4) explicit rules for conflicts between verbal report and concurrent behavioral or neurophysiological measures, distinguishing cases where discrepancy enriches the heterophenomenological narrative, cases where it invalidates the report, and cases where the data must be suspended; (5) worked applications to three concrete scenarios, including one split-brain patient who reports a unified visual field despite demonstrable contralateral neglect, one subject operating under adversarial incentivization who reports phenomenal-overflow experiences that align neatly with a rival theoretical framework, and one unwelcome case—an articulate subject describing meticulously detailed “micro-phenomenal shifts” during binocular rivalry whose reports your procedure must downgrade or reclassify despite their surface sophistication; and (6) a concise statement of what the protocol cannot do, especially regarding ontological commitment to consciousness and legitimate cross-subject comparison. Before constructing the procedure, begin with a brief conceptual map that distinguishes heterophenomenological neutrality from both eliminativism about consciousness and naive first-person authority, identifying which philosophical distinctions must survive this operational translation and which can be collapsed without distortion. Think carefully, step by step, be honest about misfires, and do not invoke bibliographic authority, citations, or appeals to named texts—the protocol must stand on its conceptual logic alone.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**

      *   **Role:** Senior Methodology Officer and Philosopher of Mind.
      *   **Audience:** Multi-site cognitive neuroscience consortium (graduate students, technicians, uneven philosophical training).
      *   **Task:** Create a reusable, operational protocol translating *heterophenomenology* into a practical workflow.
      *   **Constraints:**
          *   Treat reports as "text" within a subject's world (not direct access).
          *   Ontologically neutral (GWT, HOT, IIT, etc.).
          *   Executable in $\le$ 15 minutes per case by Master's-level staff.
          *   PI sign-off only at genuine judgment nodes.
          *   Deliverables:
              1.  Preliminary Screening Checklist.
              2.  Ordered Sequence (max 5 interpretive tests/questions).
              3.  Marked "JUDGMENT REQUIRED" points (PI sign-off).
              4.  Rules for conflicts (verbal vs. behavioral/neuro).
              5.  Worked Applications (Split-brain, Adversarial/Incentivized, Articulate/Micro-phenomenal).
              6.  Limitations Statement (Ontology, Cross-subject comparison).
              7.  Preliminary Conceptual Map (Neutrality vs. Eliminativism vs. Naive Authority).
          *   **Style:** Conceptual logic only (no citations/named texts), honest about misfires, step-by-step.

  2.  **Deconstruct Heterophenomenology for Operations:**

      *   *Core Idea:* The subject is the authority on *what they seem to experience*, but not on *what is actually happening* in their brain or the metaphysical nature of that experience. The scientist treats the report as data (text) to be interpreted alongside other data (behavior, neural activity).
      *   *Operational Challenge:* How to make this "neutral" without becoming "eliminativist" (ignoring the report) or "naive" (believing the report as truth).
      *   *Time Limit:* 15 minutes means the protocol must be a checklist/flowchart, not an essay.
      *   *PI Involvement:* Minimize bottlenecks. Only when the algorithmic rules fail.

  3.  **Drafting the Conceptual Map (Pre-Protocol):**

      *   Need to distinguish the stance.
      *   *Naive First-Person Authority:* "If they say they see red, there is a red qualia." (Rejected).
      *   *Eliminativism:* "They say they see red, but they are wrong; there is no experience." (Rejected).
      *   *Heterophenomenological Neutrality:* "They say they see red. We record this as a belief/report. We correlate this with neural state X. Whether 'red qualia' exists metaphysically is bracketed."
      *   *Collapsible Distinctions:* We don't need to solve the Hard Problem to run the study. We treat "consciousness" as the *target of the report*, not necessarily a proven entity.
      *   *Surviving Distinctions:* The gap between *seeming* and *being*. The gap between *report* and *mechanism*.

  4.  **Developing the Protocol Components:**

      *   **(1) Screening Checklist:** Needs to filter out sessions where the subject isn't treating the task seriously or where the data is too corrupted for *any* interpretation.
      *   **(2) Interpretive Tests (Max 5):** Needs to classify the report type.
          *   Test 1: Consistency (Internal).
          *   Test 2: Stability (Temporal).
          *   Test 3: Theoretical Contamination (Is the subject parroting the hypothesis?).
          *   Test 4: Behavioral Alignment (Does action match words?).
          *   Test 5: Specificity (Is it vague or precise?).
      *   **(3) Judgment Nodes:** Where does the Master's student stop? When rules conflict. E.g., Report matches theory *too* well (suspicious) OR Report contradicts neural data *radically* (delusion vs. measurement error).
      *   **(4) Conflict Rules:**
          *   *Enrichment:* Mismatch reveals blind spots (e.g., blindsight).
          *   *Invalidation:* Mismatch reveals task misunderstanding.
          *   *Suspension:* Mismatch reveals measurement failure.
      *   **(5) Worked Applications:**
          *   *Split-Brain:* Unified report vs. divided behavior. (Hetero: Report is true *for them*, behavior shows fragmentation).
          *   *Adversarial:* Subject trying to prove Overflow. (Hetero: Treat as strategic text, check for consistency).
          *   *Articulate/Micro-shifts:* Too detailed? (Hetero: Risk of confabulation/theory-ladenness. Downgrade to 'hypothesis' rather than 'data').
      *   **(6) Limitations:** Cannot prove consciousness exists. Cannot compare "intensity" across subjects directly.

  5.  **Refining for Time and Tone:**

      *   *Tone:* Administrative, precise, philosophical but operational.
      *   *Time:* 15 mins. The questions must be binary or ternary (Yes/No/Unsure).
      *   *PI Sign-off:* Keep it rare. Maybe only on "Suspension" or "Theoretical Contamination."

  6.  **Self-Correction/Critique during Drafting:**

      *   *Critique:* Is 5 tests too many for 15 mins?
      *   *Fix:* Make them rapid-fire criteria.
      *   *Critique:* How to handle the "Articulate Subject" without silencing them?
      *   *Fix:* The protocol shouldn't silence, but *classify*. Classify as "Theoretically Loaded" rather than "Raw Data."
      *   *Critique:* Ensure ontological neutrality.
      *   *Fix:* Never use the word "real experience." Use "reported experience" or "phenomenal claim."
      *   *Critique:* The prompt asks for "honest about misfires."
      *   *Fix:* Add a section on where the protocol breaks down (e.g., non-verbal subjects, though the prompt implies verbal reports). Actually, include in the Limitations section.

  7.  **Finalizing the Structure:**

      *   **Header:** Conceptual Map.
      *   **Section 1:** Screening Checklist.
      *   **Section 2:** The 5-Step Interpretive Sequence.
      *   **Section 3:** Conflict Resolution Rules.
      *   **Section 4:** Judgment Nodes (PI Sign-off).
      *   **Section 5:** Worked Applications.
      *   **Section 6:** Limitations.

  8.  **Drafting Content (Iterative refinement):**

      *   *Conceptual Map:* Keep it tight. Focus on the "Text" analogy.
      *   *Screening:* Focus on compliance and basic coherence.
      *   *Tests:*
          1.  Internal Coherence.
          2.  Task Alignment.
          3.  Theoretical Independence.
          4.  Behavioral Concordance.
          5.  Stability.
      *   *Conflicts:* Define the three categories clearly.
      *   *Cases:* Ensure the Split-Brain case respects the "unified text" despite neural division. Ensure the Adversarial case flags the motivation. Ensure the Articulate case flags the *possibility* of confabulation due to excessive detail (the "narrative smoothing" risk).
      *   *Limitations:* Be humble. We are mapping reports, not minds.

  9.  **Review against Constraints:**

      *   15 mins? Yes, if checklist is binary.
      *   Master's level? Yes, avoid jargon where possible.
      *   PI sign-off? Clearly marked.
      *   No citations? Checked.
      *   Ontological neutrality? Maintained by focusing on "reports" not "states."

  10. **Final Polish:** Check tone. Ensure it sounds like a directive from a Senior Officer. (Self-Correction: Make sure the "Judgment Required" nodes are distinct and actionable).

  *(Self-Correction on the "Articulate Subject" case)*: The prompt asks to "downgrade or reclassify" the micro-phenomenal shifts. Why? Because extreme granularity often indicates narrative construction rather than raw phenomenology. The protocol needs a specific test for "Granularity vs. Discriminability."

  *(Self-Correction on PI Sign-off)*: The prompt says PI signs off *solely* at nodes where judgment cannot be eliminated. I need to make sure the staff can do 90% of this without the PI. The PI steps in when the protocol yields "Ambiguous" or "Conflict - Suspension."

