answer: |-
  # CONSORTIUM OPERATIONAL PROTOCOL 44-B: HETEROPHENOMENOLOGICAL DATA HANDLING

  **TO:** All Site Leads, Graduate Researchers, and Technical Staff
  **FROM:** Senior Methodology Office
  **SUBJECT:** Operationalizing Neutrality in Consciousness Reporting
  **TIME ALLOTMENT:** 15 Minutes Per Case
  **APPLICABILITY:** All sessions involving verbal phenomenological reporting

  ---

  ## 0. CONCEPTUAL MAP: NEUTRALITY VS. AUTHORITY VS. ELIMINATION

  Before executing the workflow, staff must internalize the stance of this protocol. We are not solving the metaphysical nature of consciousness; we are curating data *about* consciousness claims.

  1.  **Naive First-Person Authority (REJECTED):** We do not accept the subject's report as an infallible description of a private mental object. If a subject says, "I saw a bright flash," we do not record "Bright Flash Exists." We record "Subject Claims Bright Flash."
  2.  **Eliminativism (REJECTED):** We do not dismiss the report as false or irrelevant because it lacks a neural correlate. If the subject claims a flash and the EEG is flat, we do not record "No Experience." We record "Claim of Flash despite Neural Silence."
  3.  **Heterophenomenological Neutrality (ADOPTED):** The subject's report is treated as a **text**. It is a factual artifact generated by the subject. Our job is to interpret this text alongside behavioral and neural texts to construct a coherent narrative of the subject's *heterophenomenological world* (the world as they believe it to be).

  **Collapsible Distinctions:** For the purpose of this workflow, the distinction between "illusion" and "veridical perception" is collapsed. Both are treated as reports.
  **Surviving Distinctions:** The distinction between *reporting* and *mechanism* must remain. The distinction between *consistent narrative* and *contradictory narrative* must remain.

  ---

  ## 1. PRELIMINARY SCREENING CHECKLIST

  **Operator:** Graduate Student / Technician
  **Time:** 3 Minutes
  **Goal:** Determine if the session data qualifies for heterophenomenological analysis or must be discarded/re-run.

  **Instructions:** Review the session log, video recording, and raw transcript. Mark **PASS** or **FAIL**.

  1.  **Task Compliance:** Did the subject attempt to answer every prompt, even with "I don't know"?
      *   [ ] PASS (Attempted all)
      *   [ ] FAIL (Refused >20% of prompts)
  2.  **Linguistic Coherence:** Is the transcript intelligible enough to parse subject-verb-object relationships regarding experience?
      *   [ ] PASS (Coherent)
      *   [ ] FAIL (Incoherent/Slurred/Non-sequitur)
  3.  **Alertness Verification:** Did psychomotor vigilance tasks (PVT) within the session remain within 2 SD of the subject's baseline?
      *   [ ] PASS (Alert)
      *   [ ] FAIL (Drowsy/Compromised)
  4.  **Incentive Check:** Is there evidence of external reward structures that might encourage specific *types* of answers (beyond standard participation fees)?
      *   [ ] PASS (Standard Fee)
      *   [ ] FLAG (Performance-based bonus on specific outcomes)

  **DECISION NODE:**
  *   If all **PASS**: Proceed to Section 2.
  *   If any **FAIL**: Tag session as "Behavioral Only." Do not analyze phenomenological text. **No PI sign-off required.**
  *   If **FLAG** on Incentive: Proceed to Section 2, but mark for **PI Review** at Step 3.

  ---

  ## 2. THE FIVE INTERPRETIVE TESTS

  **Operator:** Graduate Student / Technician
  **Time:** 7 Minutes
  **Goal:** Classify the report type.
  **Instructions:** Apply these five questions sequentially to the transcript.

  **Test 1: Internal Consistency**
  *Question:* Does the subject contradict themselves within the same session regarding the same stimulus type?
  *   (A) No contradictions.
  *   (B) Minor contradictions (corrected by subject).
  *   (C) Major contradictions (unresolved).
  *   *Action:* If (C), classify report as **UNSTABLE**.

  **Test 2: Theoretical Independence**
  *Question:* Does the subject use technical terminology (e.g., "global workspace," "qualia," "integration") that was not provided in the pre-screening vocabulary list?
  *   (A) No technical jargon used.
  *   (B) Jargon used, but defined idiosyncratically.
  *   (C) Jargon used, matching lab hypothesis definitions.
  *   *Action:* If (C), classify report as **THEORETICALLY LOADED**. **Flag for PI Review.**

  **Test 3: Granularity vs. Discriminability**
  *Question:* Does the subject report distinctions finer than their behavioral discrimination threshold allows (e.g., reporting 10 shades of gray but only distinguishing 3 in forced-choice)?
  *   (A) Report granularity matches behavior.
  *   (B) Report is vaguer than behavior.
  *   (C) Report is significantly more detailed than behavior.
  *   *Action:* If (C), classify report as **NARRATIVELY SMOOTHED** (Potential Confabulation).

  **Test 4: Temporal Stability**
  *Question:* If the same stimulus was presented multiple times, was the phenomenological report consistent?
  *   (A) Consistent (>80% match).
  *   (B) Variable (50-80% match).
  *   (C) Random (<50% match).
  *   *Action:* If (C), classify report as **NOISY**.

  **Test 5: Behavioral Concordance**
  *Question:* Does the verbal report align with the button-press/response action taken at the time of the report?
  *   (A) Aligned.
  *   (B) Misaligned but explained by subject (e.g., "I pressed left but meant right").
  *   (C) Misaligned and unexplained.
  *   *Action:* If (C), classify as **DISSOCIATED**.

  **OUTPUT CLASSIFICATION:**
  Based on the dominant flag above, assign one of four labels to the dataset:
  1.  **DESCRIPTIVE:** (Mostly A answers). Treat as standard heterophenomenological text.
  2.  **CONFABULATORY:** (Test 1C or 3C). Treat as narrative construction, not direct report.
  3.  **THEORETICALLY LOADED:** (Test 2C). Treat as hypothesis testing by the subject.
  4.  **AMBIGUOUS:** (Mixed flags). Requires **PI Sign-off**.

  ---

  ## 3. CONFLICT RESOLUTION RULES (VERBAL VS. NEURO/BEHAVIOR)

  **Operator:** Graduate Student / Technician
  **Time:** 3 Minutes
  **Goal:** Resolve discrepancies between the "Text" (Report) and the "Trace" (Neural/Behavioral).

  **Rule A: The Enrichment Case (Discrepancy = Data)**
  *   *Condition:* Subject reports Experience X, Neural/Behavioral data indicates State Y (where Y usually precludes X), BUT the subject is consistent and theoretically naive.
  *   *Example:* Subject reports seeing a stimulus in the blind field (Blindsight).
  *   *Action:* **Retain Both.** Label dataset "Dissociative Enrichment." The conflict *is* the finding. Do not discard the report.

  **Rule B: The Invalidation Case (Discrepancy = Error)**
  *   *Condition:* Subject reports Experience X, but behavioral data shows chance-level performance *and* the report contains internal contradictions (Test 1C) or theoretical loading (Test 2C).
  *   *Action:* **Downgrade Report.** Tag as "Post-hoc Rationalization." Use neural/behavioral data as primary; treat report as secondary noise.

  **Rule C: The Suspension Case (Discrepancy = Unknown)**
  *   *Condition:* Subject reports Experience X, Neural data is flat/absent, Behavior is absent, but Subject is highly consistent and theoretically naive.
  *   *Action:* **SUSPEND.** Do not include in aggregate analysis. This indicates a potential measurement failure or a radical phenomenological claim that requires ontological adjudication.
  *   **JUDGMENT REQUIRED:** PI must sign off to either (1) Accept as valid anomaly or (2) Discard as artifact.

  ---

  ## 4. JUDGMENT REQUIRED NODES (PI SIGN-OFF)

  **Operator:** Principal Investigator Only
  **Time:** 2 Minutes (Remaining of 15-min window)
  **Goal:** Resolve cases where the algorithmic protocol cannot determine the status of the text.

  **Node 1: Theoretical Contamination Confirmation**
  *   *Trigger:* Staff flags Test 2C (Theoretically Loaded).
  *   *PI Task:* Determine if the subject is a "naive theorist" (inventing terms) or a "crypto-expert" (hiding knowledge to help/hinder).
  *   *Decision:* **Keep as Hypothesis** OR **Discard as Bias.**

  **Node 2: Suspension Adjudication**
  *   *Trigger:* Staff flags Rule C (Suspension Case).
  *   *PI Task:* Evaluate if the neural measurement was robust enough to warrant contradicting a consistent subject.
  *   *Decision:* **Validate Anomaly** (Ontologically neutral acceptance of report) OR **Nullify Session** (Measurement error assumed).

  **Node 3: Incentive Conflict**
  *   *Trigger:* Staff flags Screening Incentive Check (FLAG).
  *   *PI Task:* Determine if the incentive structure coerced the *content* of the report or just the *effort*.
  *   *Decision:* **Weight Data at 50%** OR **Discard.**

  ---

  ## 5. WORKED APPLICATIONS

  ### Case A: The Split-Brain Patient
  *   **Scenario:** Patient has severed corpus callosum. Visual stimulus presented to left hemi-field (Right Hemisphere). Patient verbally reports (Left Hemisphere/Language) "I saw nothing." However, left hand (Right Hemisphere) points to the object.
  *   **Protocol Application:**
      *   *Screening:* PASS.
      *   *Test 5 (Concordance):* FAIL (Verbal says nothing, Hand says something). Classify as **DISSOCIATED**.
      *   *Conflict Rule:* **Rule A (Enrichment).**
      *   **Outcome:** The verbal report ("I saw nothing") is **TRUE within the heterophenomenological world of the speaking hemisphere.** It is not a lie. It is not an error. It is a accurate report of the *left hemisphere's* conscious field. The hand behavior is a accurate report of the *right hemisphere's* processing.
      *   **Action:** Retain both. Do not force unification. Label: "Hemispheric Dissociation."

  ### Case B: The Adversarial Subject
  *   **Scenario:** Subject knows the lab supports "Phenomenal Overflow." Subject is paid a bonus if they detect "subtle edges." Subject reports rich, overflowing detail on every trial, aligning perfectly with Overflow theory.
  *   **Protocol Application:**
      *   *Screening:* FLAG (Incentive).
      *   *Test 2 (Independence):* FAIL (Reports align too neatly with theory). Classify as **THEORETICALLY LOADED**.
      *   *Test 3 (Granularity):* FAIL (Reports detail beyond behavioral discrimination). Classify as **NARRATIVELY SMOOTHED**.
      *   *Judgment Node:* PI reviews incentive.
      *   **Outcome:** The report is treated as **Strategic Text.** It reflects what the subject *believes the experimenters want* more than what they experience.
      *   **Action:** Downgrade weight. Use only for analyzing demand characteristics, not for consciousness metrics.

  ### Case C: The Articulate "Micro-Phenomenal" Subject
  *   **Scenario:** During binocular rivalry, subject describes "micro-shifts in luminance quality lasting 40ms" that precede the perceptual flip. No EEG or behavioral measure detects shifts at this resolution. The description is poetic and precise.
  *   **Protocol Application:**
      *   *Screening:* PASS.
      *   *Test 3 (Granularity):* FAIL (Report resolution exceeds physiological measurement resolution). Classify as **NARRATIVELY SMOOTHED**.
      *   *Test 4 (Stability):* PASS (Subject is consistent).
      *   *Conflict Rule:* **Rule B (Invalidation)** applies regarding the *timing* claim, but **Rule A (Enrichment)** applies to the *feeling* of transition.
      *   **Outcome:** The claim of "40ms precision" is likely a confabulation (narrative reconstruction of a blurry transition). However, the *feeling* of a transition is valid data.
      *   **Action:** Reclassify report. Code as "Perceived Transition" (Valid) but discard "40ms latency" claim (Invalid). The subject is describing a *memory* of the shift, not the shift itself.

  ---

  ## 6. LIMITATIONS STATEMENT

  **Operator:** All Staff
  **Requirement:** This statement must accompany all published datasets derived from this protocol.

  1.  **Ontological Commitment:** This protocol does not prove the existence of consciousness. It proves the existence of *reports about* consciousness. We remain neutral on whether these reports correspond to non-physical qualia, global neural ignition, or integrated information.
  2.  **Cross-Subject Comparison:** We cannot compare the *intensity* or *quality* of experience between Subject A and Subject B. We can only compare the *structure* of their reports (e.g., consistency, complexity, relation to stimulus). "Subject A saw redder red than Subject B" is an invalid statement under this protocol.
  3.  **Non-Verbal Subjects:** This protocol is inapplicable to non-verbal populations (infants, non-human animals). Their data must be handled via purely behavioral inference protocols.
  4.  **Misfire Acknowledgement:** This protocol may incorrectly classify genuine, high-resolution phenomenology as "Narratively Smoothed" (Case C). We accept this false negative rate to minimize false positives (confabulation treated as data).

  ---

  **END OF PROTOCOL 44-B**
  **AUTHORIZED BY:** Senior Methodology Office
  **REVIEW CYCLE:** Quarterly
