prompt: |-
  hey, i need help drafting something for my board. i'm on the risk-assessment committee for a coastal town deciding on a flood-wall project. the engineers sent a report that uses these interval probabilities — failure risk over the next decade is somewhere between 8% and 35%, but they won't pin it to one number because the climate models are unstable. half the board wants to treat the worst case as real and build now; thier argument is that ambiguity aversion makes people underinvest in protection. the other half says without a precise point estimate we can't justify the cost and should delay. we need to send a recomendation to the mayor by friday: build full wall, build smaller version, or hold off with a monitoring timeline. please draft the memo with an actual bottom line, not just "more study", and include an honest treatment of the strongest argument on the losing side. also address whether ambiguity aversion is actually a rational reason to act here, or if it's a bias. no citations needed — just reasoning i can use in the meeting thurday.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Risk-Assessment Committee for a coastal town.
      *   **Audience:** The Board (internal) and ultimately the Mayor (external recipient of the recommendation).
      *   **Task:** Draft a memo recommending a course of action on a flood-wall project.
      *   **Key Data:** Engineers report failure risk over the next decade is between 8% and 35% (interval probability, no point estimate due to unstable climate models).
      *   **Conflict:**
          *   Side A (Build Now): Treat worst-case (35%) as real. Argument: Ambiguity aversion leads to underinvestment.
          *   Side B (Delay): Need precise point estimate to justify cost. Argument: Can't spend without certainty.
      *   **Options:** Build full wall, build smaller version, or hold off with monitoring.
      *   **Constraints:**
          *   Must have an actual bottom line (no "more study" cop-out).
          *   Must honestly address the strongest argument of the losing side.
          *   Must address whether "ambiguity aversion" is a rational reason to act or a bias.
          *   No citations needed, just reasoning for the Thursday meeting.
          *   Deadline context: Recommendation to Mayor by Friday.

  2.  **Determine the Recommendation (The "Bottom Line"):**
      *   *Option 1: Build Full Wall.* Pros: Maximum safety. Cons: Extremely expensive, might be overkill if risk is only 8%. Hard to justify financially without a point estimate.
      *   *Option 2: Hold Off.* Pros: Saves money now. Cons: 8% risk is still significant (1 in 12 chance of failure in a decade). If the 35% scenario hits, it's catastrophic. Politically difficult given the known risk range.
      *   *Option 3: Build Smaller Version (Phased/Adaptive).* Pros: Mitigates immediate risk without committing full capital. Allows for adjustment as models stabilize. Balances the 8% vs. 35% uncertainty.
      *   *Decision:* The "Smaller Version" (often called a "hybrid" or "adaptive pathway") is usually the most robust decision-theoretic approach under deep uncertainty. It acknowledges the risk without betting the farm on the worst-case immediately. *However*, the prompt asks me to choose a side in the debate (Build vs. Delay) or offer a third way. A "smaller version" is a pragmatic compromise. Let's refine this. If I recommend the "smaller version," I need to make sure it doesn't look like "more study." It needs to be *action*.
      *   *Alternative:* Given the "Ambiguity Aversion" argument, treating the upper bound (35%) seriously suggests acting. But fiscal responsibility suggests not overspending. A "Phased Construction" plan is the best technical answer. Let's go with **Build Phase 1 (Smaller Version) with Trigger Points for Phase 2.** This validates the "Build" camp's urgency but respects the "Delay" camp's fiscal caution.

      *Wait, looking closer at the prompt:* "half the board wants to treat the worst case as real and build now... the other half says... delay."
      If I recommend "Build Smaller," I am effectively siding with "Build Now" but modifying the scope. If I recommend "Hold Off," I side with the delay camp.
      *Decision:* The most responsible risk management stance with an 8-35% failure risk is to act. 8% is too high to ignore for a decade. 35% is catastrophic. The rational move is **Build the Smaller Version (Phase 1)**. This is a definitive action.

  3.  **Address the "Ambiguity Aversion" Question:**
      *   Is it a bias or rational? In standard Expected Utility Theory, ambiguity aversion is often treated as a bias (Ellsberg Paradox). However, in *robust decision-making* under deep uncertainty (Knightian Uncertainty), it is rational to prioritize worst-case scenarios when probabilities are unknown and stakes are existential (ruin).
      *   *Conclusion:* It is rational in this specific context (catastrophic risk + unknown probabilities), even if it looks like a bias in standard gambling scenarios.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and actionable.
      *   **Executive Summary:** The bottom line up front.
      *   **Risk Context:** Explain the 8-35% interval.
      *   **The Debate (Ambiguity Aversion):** Address the psychological/economic argument. Is it rational? Yes, because "ruin" is on the table.
      *   **The Counter-Argument (Fiscal Prudence):** Honestly address the "Delay" side. They are right about opportunity cost.
      *   **Recommendation:** The Phased/Smaller Wall.
      *   **Reasoning:** Why this splits the difference logically, not just politically.

  5.  **Refining the Tone:**
      *   Needs to be professional, decisive, yet nuanced.
      *   Avoid academic jargon where possible, but use the terms provided (ambiguity aversion).
