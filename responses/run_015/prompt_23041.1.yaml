      *   *Fix:* I need to be firmer. I will argue that the obligation *exists*, but the *scope* is limited by the population objection. So, the conclusion is: We are obligated to intervene *specifically* in cases where we can decouple survival from reproductive overshoot (e.g., via contraception) or where human activity has already distorted the system. We are *not* obligated to intervene in stable, natural predator-prey dynamics where suffering is the mechanism of stability.
