prompt: |-
  So I've been going down the Gettier rabbit hole and Nozick's tracking theory keeps showing up, and the part everyone fights about is that it just bites the bullet and denies epistemic closure -- you can know p, know that p entails q, and still fail to know q. Which sounds insane until you notice that closure plus whatever blocks the skeptic seem to pull against each other. Before I read any more of this stuff I want the spec first: write me the desiderata for an analysis of knowledge -- what any adequate theory of knowing-that-p has to deliver. Cover at least: handling Gettier and fake-barn style cases, preserving knowledge under competent deduction (closure), not evaporating in lottery/preface cases, saying something non-embarrassing about skepticism (or explaining why that demand is unreasonable), and giving a verdict on the grandmother case (family would lie to her if the kid got hurt, so her belief isn't sensitive, yet it really looks like she knows he's fine). For each requirement, give the case or consideration that motivates it, and be honest about which are genuinely non-negotiable vs. just pet intuitions of one camp -- e.g. is closure a real requirement, or is the "abominable conjunction" worry (happily saying you know you have hands, refusing to say you know you're not a brain in a vat) just a framing effect? Also make the spec handle the sneaky stuff: knowledge of necessary truths, where the sensitivity counterfactual has no false-closest-world to test, and knowledge of conjunctions you yourself inferred. The part I care about most: identify which subsets of the desiderata are jointly unsatisfiable -- I suspect tracking + closure + any decent anti-skeptical story can't all hold at once, but I want the actual argument, not vibes. Then a short scorecard at the end (plain JTB+knowledge-that... you know what I mean, sensitivity, safety) against your list -- keep it brief, the criteria are where the thinking is. A table is fine if you want, just don't make it the whole answer.
