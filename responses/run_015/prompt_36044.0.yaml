      *   *Coin:* Ellie brings out a coin from her pocket? No, keep it theoretical.
      *   *Startup:* Ellie brings up her nephew's app.
      *   *Testing:* Ellie asks, "Show me the propensity meter."
      *   *Priors:* Marcus asks about the crazy agent.

  6.  **Polishing:**
