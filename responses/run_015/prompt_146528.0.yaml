      *   *Refinement on (iv) & (v):* This is the trickiest. If the biological substrate is stable, prevalence *of the substrate* is comparable. Prevalence *of the diagnosis* is not. The revision must make this distinction explicit.

  6.  **Final Polish (British English Check):**
