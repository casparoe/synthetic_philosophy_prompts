      *   *Is it purely epistemic?* Paul argues it is. Critics (like Harman or Pettigrew) argue it's not *that* hard to imagine. I should mention that the "epistemic" vs "utility" distinction is where the user's insight shines.
      *   *Indexicality:* Be careful not to conflate Lewisian indexicality with Paul's transformation. It's better to frame it as "uncertainty about future identity/values."

