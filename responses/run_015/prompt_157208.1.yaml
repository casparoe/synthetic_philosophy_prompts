  1. The conceptual example

  Consider a theoretical framework positing a ubiquitous 'Background Interaction Field' (BIF) that mediates all measurement couplings. The core theory dictates the BIF's symmetry properties. Any measurement apparatus is modelled as a system embedded within this field. When an observation contradicts the core predictions, the discrepancy is not treated as a refutation of the core, but as evidence of a local perturbation in the BIF affecting the apparatus. Crucially, the auxiliary model used to correct the apparatus reading is derived from the core theory's own equations regarding field-matter coupling, yet motivated by consistency requirements elsewhere in the network. Consequently, to accept a reading as a 'basic statement' of fact, one must first calculate the expected field interference using the very theory under test. The observation is not theory-neutral; it is a theoretical output masquerading as empirical input. The structure ensures that any anomaly is absorbed by recalibrating the apparatus model via core parameters, rendering the core immune to direct empirical contradiction despite remaining logically falsifiable in the abstract. The revision is not strategic evasion but a structural necessity to maintain network coherence, meaning the 'signal' is defined entirely by the theoretical expectation of the 'noise'. In practice, this blocks falsification because no raw data can be admitted as evidence against the theory without first being processed through the theory's own filtering algorithms. Unlike standard theory-ladenness, where independent calibration is possible, here calibration is constitutive of the theory itself, ensuring the empirical ground is permanently receding.

  2. The demarcation diagnosis

  This constitutes a specific failure of falsificationism because it undermines the logical status of basic statements. Falsificationism requires that basic statements be accepted conventionally but independently of the theory they test. Here, the acceptance condition for an observation is logically dependent on the truth of the core theory. It is not merely that falsification is difficult due to experimental noise; it is that the epistemic architecture forbids the entry of a contradictory basic statement without triggering a logical inconsistency in the observation protocol itself. The demarcation line shifts from the theory-world boundary to the interior of the theoretical network. Because the theory defines the validity conditions of the evidence, the system is empirically closed. It satisfies the logical criterion of falsifiability (a contradiction is conceivable) but violates the methodological requirement that falsification be possible in practice without presupposing the theory's validity. This transforms the demarcation problem from distinguishing science from non-science to distinguishing coherent theoretical networks from incoherent ones, leaving empirical grounding unresolved. It exposes the vulnerability of the 'conventionalist' solution to the problem of basic statements, showing that convention can be coerced by theoretical hegemony rather than free agreement. The ambiguity is not resolved; it is merely displaced into the calibration procedures, creating a closed validation loop.

  3. The strongest defence

  A committed falsificationist would argue that this diagnosis conflates logical possibility with pragmatic difficulty. They would contend that the auxiliary models, though derived from the core, must also yield predictions in distinct experimental contexts unrelated to the original anomaly. If the BIF theory predicts specific interference patterns in a wholly different apparatus setup, and those predictions fail, the entire network collapses. The circularity is broken by the requirement of independent testability for the auxiliary assumptions. Furthermore, the falsificationist might insist that the scientific community can conventionally agree to treat certain low-level observations as fixed, regardless of theoretical interpretation, thereby forcing the theory to bear the risk. The structural knot is thus loosened by intersubjective agreement on protocol sentences, ensuring that the theory remains exposed to potential refutation through the cumulative weight of disparate tests. Ultimately, the defence rests on the claim that no theory is an island; the network itself is the unit of falsification, not the isolated core. If the cost of protecting the core requires increasingly complex and improbable auxiliary adjustments across multiple domains, the programme becomes degenerate. The falsificationist maintains that eventually, the theoretical burden becomes too high to sustain, forcing a rejection regardless of the structural circularity. This preserves the focus on system risk.

  4. What would change my mind

  I would revise my judgement if it could be demonstrated that the auxiliary models possess independent empirical content separable from the core theory's symmetry properties. If the apparatus calibration could be validated without invoking the BIF equations, the circularity would dissolve. The weakest point in my reasoning is the conflation of methodological impossibility with logical demarcation. Falsificationism is primarily a logical criterion, not a pragmatic guarantee of success. If the demarcation problem is strictly about logical structure rather than historical practice, then the mere conceivability of a contradictory statement might suffice, rendering my practical objection irrelevant to the core philosophical definition. I must accept that if logical falsifiability is the only standard, this structural knot is permissible. However, if demarcation is intended to guide scientific practice, then practical immunity matters. My uncertainty lies in whether the problem is defined by logic or utility. If the latter, my stand holds; if the former, I am mistaken.
