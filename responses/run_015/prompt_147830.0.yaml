  **NOTE TO USER:**
  You requested that I state plainly if this task cannot be done well without empirical or legal evidence you have not supplied. **I must state this plainly:** I am an AI, not legal counsel. I cannot verify the jurisdiction-specific enforceability of the bequest clause ("original material instantiation") against the artist's parametric intent. In many jurisdictions, moral rights and contract law prioritize the literal text of a bequest over curatorial interpretation. If the heirs litigate, a court may rule that "material instantiation" refers strictly to physical atoms, rendering the Foundation's "procedural regeneration" argument legally irrelevant regardless of its art-historical merit.

  The draft below is written as a **Stewardship Opinion**, not a Legal Opinion. It is designed to guide the Committee's vote on policy and classification. However, to make this document truly actionable and safe for the Foundation, **Section IV (Recommendation) explicitly conditions the classification on a concurrent legal review and potential settlement.** Circulating this without attaching a concurrent memo from General Counsel regarding litigation risk would be negligent.

  ***

  **MEMORANDUM**

  **TO:** Acquisition and Stewardship Committee, Meridian Foundation for Ephemeral Art
  **FROM:** [Your Name/Title]
  **DATE:** October 23, 2023
  **SUBJECT:** Classification and Stewardship Status of Mara Kessler, *Sequence No. 7* (Bequest Ref: MK-007)

  ### I. Executive Summary
  The Committee must determine whether the 2022 procedurally regenerated object currently in our care satisfies the bequest clause requiring the "original material instantiation" of Mara Kessler's *Sequence No. 7*. The original installation degraded entirely in 2019. The current object consists of original substrate fragments embedded in a new synthetic matrix, executed via algorithmic reconstruction based on Kessler's published parametric rules.

  The heirs contend this constitutes a reproduction, triggering a reversion clause. This opinion recommends that the Committee **vote to classify the regenerated object as the Bequested Original (Regenerated State)**, contingent upon immediate legal ratification and a negotiated waiver with the estate. This classification preserves the work's public access while acknowledging the material break through a new stewardship category that prevents precedential slippage.

  ### II. Context and Stewardship History
  *Sequence No. 7* was acquired under the understanding that Kessler's practice engaged with entropy as a medium. The 2022 regeneration was not a manual replication but a "procedural regeneration" executed by technicians following the artist's own parametric rules. Original substrate fragments were retained and embedded within the new matrix to maintain a physical link to the initial instantiation.

  The Foundation's conservators argue that for ephemeral art governed by parametric rules, the "work" resides in the execution of the procedure rather than the static permanence of the initial chemicals. The heirs argue that the bequest language is material-specific and that delegating execution to technicians severs authorial continuity.

  ### III. Analysis of Heirs' Claim and Institutional Risk
  The heirs' strongest argument rests on the distinction between **preservation** (stabilizing existing material) and **fabrication** (introducing new material to replace lost material). They contend that accepting the 2022 object as the "original" collapses this distinction, creating a precedent where the Foundation could theoretically replace any degraded work with a new fabrication provided an algorithm or rule set exists.

  **Risk Assessment:**
  1.  **Conceptual Slippage:** If we define "original material instantiation" to include a mostly new synthetic matrix, we risk destabilizing the definition of "original" across the wider collection. This could invite challenges regarding other conserved works where material intervention was less codified.
  2.  **Legal Liability:** The bequest clause specifies "original material instantiation." A strict textualist legal interpretation favors the heirs. If we declare the object the original without addressing the material discontinuity, we expose the Foundation to litigation regarding breach of bequest terms.

  However, rejecting the regenerated object as a mere "reproduction" creates a different risk: it renders the bequest functionally void upon the natural degradation of the work, contradicting the likely intent of a bequest dedicated to *ephemeral* art. To treat the work as extinguished because it behaved as designed (ephemerality) undermines the Foundation's specific mission mandate.

  ### IV. Recommendation and Classification
  To balance the heirs' legal claim with the Foundation's stewardship mandate, I recommend the following course of action:

  **1. Classification:**
  Classify *Sequence No. 7* (2022 Regeneration) as **"Original Work (Regenerated State)."**
  *   *Rationale:* This acknowledges the object's status as the primary stewardship responsibility of the Foundation without falsely claiming it is the 2019 material instantiation. It creates a distinct sub-category within our cataloging system that signals material intervention occurred under artist-sanctioned parameters.

  **2. Policy Safeguard (The "Kessler Protocol"):**
  Adopt a policy stating that "Regenerated State" classification is permissible *only* when:
  *   The artist explicitly codified regeneration parameters prior to death.
  *   Original substrate fragments are physically integrated into the new matrix.
  *   The regeneration is documented as a distinct phase in the work's provenance.
  *   *Rationale:* This directly addresses the "slippage" risk. It ensures this classification cannot be applied to works where conservation relies on curatorial interpretation rather than artist-defined rules.

  **3. Legal and Estate Mitigation:**
  Authorize General Counsel to negotiate a **Deed of Confirmation** with the heirs.
  *   The Foundation acknowledges the material discontinuity in writing.
  *   In exchange for recognizing the work's continued status in our care, the Foundation offers a stipend or licensing fee to the estate, acknowledging their moral rights interest in the regeneration.
  *   *Rationale:* This avoids a binary legal fight over the definition of "original." It purchases legal certainty by compensating the heirs for the "slippage" they contest, rather than forcing a court to rule on the definition of materiality.

  ### V. Implementation Timeline

  *   **Thursday, October 26 (Vote):** Committee votes to adopt the "Original Work (Regenerated State)" classification and authorize the negotiation of a Deed of Confirmation.
  *   **November 15:** General Counsel to initiate contact with heirs' representation proposing the Deed of Confirmation.
  *   **December 31:** Target date for execution of Deed. If no agreement is reached, the object is to be cataloged as "Property of the Foundation (Successor Work)" and the bequest formally declared lapsed to avoid litigation exposure.
  *   **Q1 2024:** Update Collections Management Policy to include the "Kessler Protocol" criteria for future ephemeral art regenerations.

  ### VI. Conclusion
  We cannot maintain the fiction that the 2022 object is materially identical to the 2019 installation without inviting successful legal challenge. However, relegating it to "reproduction" negates the purpose of the bequest. By classifying it as a **Regenerated Original** and securing a negotiated waiver from the heirs, we preserve the work's public utility while insulating the Foundation from the risk of precedential slippage. This approach respects the letter of the bequest by acknowledging the material change, while honoring the spirit of the bequest by preserving the work's continuity.

  **Action Required:** Vote to approve the classification and authorize legal negotiation by end of day Thursday.
