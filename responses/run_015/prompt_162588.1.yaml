  **The mapping**
  On the most charitable reading, the **Ship** is the legal order's continuing identity over time. The **Planks** are individual norms, comprising both primary duties and secondary rules of change. The **Sea** represents social efficacy—the factual obedience and enforcement that keeps the system afloat. The **Dry Dock** is an external foundation, such as a Grundnorm or constituent power, which the analogy renders unnecessary. The **Carpenter** is the authorized law-making body, acting from within the system. The **Voyage** is the temporal continuity of the system despite normative replacement. The carpenter never steps outside onto the dry dock of metaphysical justification; validation is internal, dynamic, and sustained by the interlocking support of the remaining planks during repair.

  **Where it holds**
  The image successfully defeats the charge of vicious circularity by reframing foundation as coherence over time. A flat circularity objection assumes validation must happen instantaneously from outside; the boat shows validation is diachronic and procedural. It captures the intuition that legal systems survive radical textual change without losing identity. It correctly identifies that we justify new norms by referencing existing norms, not by stepping outside the system to a mystical origin. It also models the necessity of keeping the system "afloat" (efficacious) during repair; law cannot cease to function while being amended. Finally, it dissolves the need for a static foundation, showing that stability is a dynamic process of replacement rather than a permanent structural base. This validates the supervisor's rejection of the Grundnorm as a necessary explanatory tool for continuity. It highlights that self-reference is a feature of living systems, not a logical bug.

  **Where it breaks**
  Decorative disanalogies include the physical material of planks versus text. Load-bearing disanalogies concern normativity and validity. First, buoyancy is causal; validity is normative. A plank stays because physics holds it; a rule stays because it is valid. The boat cannot distinguish between an effective illegal rule and a valid legal rule. If a carpenter inserts a plank that sinks the ship, physics rejects it. If a legislature passes a void act, the system remains, but the act is null. The boat lacks this nullity concept. Second, the boat lacks a Rule of Recognition. There is no internal mechanism to reject a "rotten plank" placed by the carpenter; if it floats, it stays. In law, a procedurally improper amendment is void, even if obeyed. Third, the boat lacks jurisdiction. The carpenter acts causally; the legislator acts within competence. The boat cannot represent ultra vires acts. In law, an ultra vires act is not part of the law. Fourth, the sea (efficacy) supports the ship directly. In law, efficacy supports the system, but validity mediates that support. By collapsing validity into efficacy, the boat eliminates the normative constraint that makes entrenchment legally meaningful rather than merely politically costly. This is the critical failure point for the supervisor's conclusion. The boat cannot model the concept of a "void but effective" command, which is central to legal theory. When the sea supports the ship, it does not ask for credentials. When society obeys a law, it may do so out of fear or habit, regardless of validity. The boat conflates these. In law, validity is a status conferred by rules, not by obedience. A rule can be valid but disobeyed. A rule can be obeyed but invalid. The boat has no category for "valid but disobeyed" because a plank that doesn't hold weight is just a bad plank. This distinction is essential for understanding why a court can strike down a popular law. The boat cannot represent judicial review because the sea ultimately decides what floats. In law, the Rule of Recognition decides what counts, regardless of the sea's mood.

  **The three cases**
  1. Package Repeal: The boat allows simultaneous removal. Law requires logical priority. To change A, you need B. If you repeal B and change A in one act, the boat sees "both gone." Law asks: "By what authority was A changed?" If B is gone, the authority vanishes. The boat lacks logical dependency; it only has physical coexistence. It bottoms out at the moment of authorization. The boat cannot represent the sequence where B must exist *at the moment* A is altered. In the boat, removal is instantaneous. In law, validity is instantaneous but dependent on prior status. This makes the package repeal logically impossible on the boat.
  2. Upward Ratchet: The boat accepts tightening easily. Law struggles with self-binding. The old rule authorizes the new restriction, but the restriction limits the old rule's successor. The boat has no concept of future carpenters' rights. It treats all moments as present. It bottoms out at the temporal bind of authority. The boat cannot explain why a future carpenter is bound by a previous carpenter's decision to restrict tools. Physics doesn't bind future actors; norms do. This makes the ratchet merely a strategic choice.
  3. Unamendable Plank: On the boat, a labeled plank is removed like any other. In law, a court must enforce the label. But if the court's jurisdiction is also amendable, we have infinite regress. The boat resolves this via physics (can you lift it?). Law resolves it via validity (do you have the power?). The boat collapses the enforcement question into physical possibility, missing the normative paradox of who guards the guardians. The boat implies the label is irrelevant; law says the label changes the validity conditions. The boat cannot model a rule that invalidates the very tool used to remove it. It treats the court's power as just another plank. If the court strikes down the amendment, the boat sees a plank removed. It doesn't see the *invalidation* of the removal attempt. This makes the unamendable clause a bluff.

  **Does her conclusion survive**
  The "No Grundnorm" and "No Constituent Power" claims survive because the boat successfully models coherentism and continuity without external anchors. It shows how a system maintains identity without a static foundation. However, "Entrenchment is Just Politics" fails. This claim relies on the collapse of validity into efficacy (buoyancy). Because the boat cannot distinguish between a rule that is obeyed (effective) and a rule that is authorized (valid), it treats procedural barriers as mere friction. In law, procedural barriers create invalidity, not just cost. Since the boat lacks a validity filter, it cannot support the conclusion that entrenchment lacks normative force. The supervisor's reductionism works for system identity but fails for internal constraint. You can accept the boat for continuity but reject it for validity. Her conclusion conflates the system's survival with the rules' bindingness. The boat explains how the system floats, not why specific moves are forbidden. Therefore, while you might agree that no Grundnorm is needed for identity, you must insist that normative constraints exist independently of political cost. The boat cannot carry the weight of the entrenchment claim.

  **A better image**
  Reach for a **Game with Constitutional Rules**. In a game, moves are valid only if they follow current rules. Some rules define valid moves (constitutive); others define strategy (regulative). You can change strategy anytime. Changing constitutive rules requires a specific move defined by the current rules. This captures the distinction between playing and rule-changing. It preserves the normative constraint (illegal moves are void, not just hard) while allowing self-modification. It buys the distinction between efficacy (winning) and validity (legal move), which the boat erases. It handles the ratchet and package cases by enforcing logical priority of moves. Unlike the boat, the game recognizes that a move can be physically possible but rule-void. It restores the normative dimension the boat loses. It allows you to argue that entrenchment is a rule-constraint, not a political cost.
