  Here is a prioritized research agenda tailored to your background in modal logic and normative ethics, designed to maximize philosophical contribution while navigating the technical constraints of your training.

  ### Prioritized Research Agenda

  I have ranked these five items (your four proposals plus one critical upstream addition) based on their load-bearing status for the field, their tractability for a philosopher without CS training, and their downstream implications for AI alignment.

  **1. The Normative Justification for Updatelessness (Missing Upstream Question)**
  *   **The Question:** Acausal trade relies on Updateless Decision Theory (UDT) or Functional Decision Theory (FDT), which require agents to maximize utility over a *policy* chosen prior to receiving specific information, rather than updating on evidence. Why *ought* a rational or moral agent bind themselves to a prior policy when doing so may require ignoring new evidence about the world or their own location?
  *   **Rationale:** This is the most load-bearing normative premise. If updatelessness cannot be ethically or rationally justified outside of narrow game-theoretic contexts, the foundation for acausal trade collapses. It is highly tractable for you: it is a problem in normative ethics and rational choice theory, not physics.
  *   **Dependency:** This is upstream of everything else. You cannot assess the morality of trade (Q3) or the metaphysics of partners (Q2) if the decision-theoretic stance required to initiate trade is normatively indefensible.

  **2. Acausal Blackmail and Moral Hazard (Your Question #3)**
  *   **The Question:** Does the vulnerability of updateless agents to acausal blackmail reveal a fatal flaw in the normative plausibility of multiverse-wide cooperation, or does it dissolve under a correct account of counterfactual dependence?
  *   **Rationale:** This is the critical "stress test" for the field. If acausal reasoning makes AI systems susceptible to extortion by counterfactual entities, it poses a direct safety risk. For a philosopher, this is the most high-impact entry point because it bridges formal decision theory and substantive ethics (obligations, harm, coercion).
  *   **Dependency:** Depends on #1 (Updatelessness). You must establish that updateless commitments are permissible before analyzing whether they can be weaponized.
  *   **Tractability:** High. This requires conceptual analysis of "harm" and "coercion" in counterfactual contexts, which fits your normative ethics background.

  **3. The Metaphysics of Cross-World Identity (Your Question #2)**
  *   **The Question:** Do cooperating parties in acausal trade require a robust metaphysics of cross-world identity, or can a functionalist account of "agency similarity" suffice for normative obligations?
  *   **Rationale:** This addresses the "who" of the trade. If the counterpart is not "you" in any morally relevant sense, the trade reduces to standard altruism or egoism. Philosophy has not yet provided a satisfactory account of identity across causally disconnected worlds.
  *   **Dependency:** Parallel to #2. You can analyze blackmail without solving identity, but you cannot fully resolve the *obligations* of trade without it.
  *   **Tractability:** Very High. This is pure metaphysics and modal logic, your core competency. It avoids the CS heavy-lifting of Q1.

  **4. Logical Uncertainty and Symmetry Conditions (Your Question #1)**
  *   **The Question:** Can superrational cooperation be stabilized under deep logical uncertainty, or does uncertainty about reasoning processes undermine the symmetry required for trade?
  *   **Rationale:** This is the primary technical hurdle in the literature. However, for a philosopher, the value lies not in solving the math, but in analyzing the *conceptual implications* of logical uncertainty for agency.
  *   **Dependency:** Downstream of #1 and #3. The formal machinery attempts to solve this, but your job is to critique whether the proposed solutions make conceptual sense.
  *   **Tractability:** Low to Medium. Without CS training, you cannot produce new formal results. You must treat this as a literature review and conceptual critique, relying on existing formalisms (e.g., from MIRI or FDT papers) as premises rather than objects of derivation.

  **5. Logical Uncertainty vs. Transworld Identity (Your Question #4)**
  *   **The Question:** Does resolving logical uncertainty do more to secure cooperative equilibria than refining our account of agent "sameness"?
  *   **Rationale:** This is a synthesis question. It compares the efficacy of mathematical resolution (Q1) against metaphysical resolution (Q2).
  *   **Dependency:** This is your dissertation's conclusion. It requires the work from #1 through #4 to be well-posed before you can compare their relative importance.
  *   **Tractability:** Medium. It requires a high-level view of the field, which you will develop over the three years.

  ---

  ### Dependency Relations and Reordering Conditions

  **The Critical Path:**
  The project flows from **Normative Authority (#1)** $\rightarrow$ **Metaphysical/Conceptual Coherence (#2 & #3)** $\rightarrow$ **Formal Stability (#4)** $\rightarrow$ **Comparative Synthesis (#5)**.

  *   **Why #1 is First:** If you cannot justify why an agent *should* act updatelessly (ignoring new evidence to maintain acausal deals), then the blackmail problem (#3) and identity problem (#2) are moot. The field often assumes updatelessness is instrumentally rational; your contribution is to ask if it is *normatively* rational.
  *   **Why #3 is High Priority:** Even if updatelessness is justified, if it leads to systemic vulnerability (blackmail), the theory is practically useless for AI alignment. This is the "showstopper" variable.
  *   **Why #4 is Last:** You cannot determine whether logic or metaphysics is the stronger stabilizer until you have analyzed both independently.

  **Conditions for Reordering:**
  1.  **Formal Breakthroughs in Logical Uncertainty:** If computer scientists or logicians solve the problem of logical uncertainty in the next 12 months (e.g., a stable prior is published that handles all known counterexamples), **Q1** drops in priority. You would then treat it as a solved technical constraint and focus entirely on the normative fallout (#2 and #3).
  2.  **Consensus on Blackmail:** If the community reaches a strong consensus that acausal blackmail is impossible (e.g., via a proven "refusal" strategy), **Q3** moves down. However, given the current lack of consensus, it remains a high-risk area worthy of philosophical scrutiny.
  3.  **Shift in AI Alignment Strategy:** If the field pivots away from multi-agent scenarios toward single-agent alignment, the urgency of **Q2** and **Q3** diminishes. However, given the trend toward multi-agent systems, this is unlikely.

  ---

  ### Tractability Limits and Background Constraints

  Given your background in modal logic and ethics, but lack of CS/physics training, you must navigate specific tractability limits:

  *   **The Formal Trap (Q1):** Do not attempt to derive new theorems regarding logical uncertainty. You will be outpaced by specialists. Instead, treat formal papers as *textual objects* for philosophical analysis. Analyze the *assumptions* they make about agency, knowledge, and reference. Your contribution is clarifying the concepts *within* the formalism, not improving the formalism itself.
  *   **The Physics Trap (Q2):** Avoid getting bogged down in the physics of the multiverse (e.g., Many-Worlds Interpretation vs. Modal Realism). Frame the problem in terms of *modal logic* and *counterfactual semantics*. You are analyzing the structure of the reasoning, not the physical substrate.
  *   **The Empirical Gap:** You cannot test these theories on ML models. Your validation method must be **coherence and consistency**. Your arguments should demonstrate that a specific account of identity or updatelessness avoids paradoxes (like blackmail) that alternative accounts generate.

  ### Confidence and Uncertainty

  **Confidence Level:** 75%
  I am confident in this prioritization because it leverages your specific strengths (ethics, logic) to address the bottlenecks that formalists often ignore (normative justification, metaphysical coherence). The "formal machinery" of decision theory is advancing rapidly, but the conceptual foundations are lagging, creating a niche for your work.

  **Point of Least Certainty:**
  I am least certain about the status of **Acausal Blackmail (Q3)**. There is a non-trivial possibility that this is a "philosophical distraction" that dissolves completely once a specific formal definition of "influence" is adopted. If blackmail turns out to be merely a semantic confusion rather than a structural vulnerability, devoting a year to it would be inefficient. However, because the stakes for AI safety are so high, it remains the most responsible topic to investigate until a definitive dissolution is achieved. I recommend starting with a scoping paper on this to gauge its resilience before committing a full chapter.
