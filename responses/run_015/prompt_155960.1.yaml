      *   *QUD Objection:* "Who sets the QUD? If I can manipulate the QUD, can I assert anything?"
      *   *QUD Objection:* "What counts as a 'complete answer'? Is the partition fixed?"
      *   *General Epistemic Objection:* "Why assertion specifically? Why not belief?"
