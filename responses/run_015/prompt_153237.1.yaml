answer: |-
  You can run the definitional setup and the "default trust" shorthand, but you must cut the conclusion about institutional rules and qualify the claim that hearers need "no reasons."

  **Claim-by-Claim Walkthrough**

  *   **"Reductionism says... justified only if you independently have reasons... for thinking this speaker is reliable."**
      *   *Verdict:* Acceptable simplification. This accurately describes *Local Reductionism* (often associated with Hume). Specialists distinguish this from *Global Reductionism*, which requires independent reasons for testimony's *general* reliability, not necessarily for each specific occasion.
  *   **"Anti-reductionism says... it's a basic source... so a hearer needs no reasons."**
      *   *Verdict:* Misrepresentation. Your suspicion is correct. Anti-reductionists (like Tyler Burge or Elizabeth Fricker's later work) argue testimony provides *prima facie* justification without independent positive reasons, but hearers still need *negative* reasons (i.e., no available defeaters). Saying they need "no reasons at all" implies blind credulity, which no serious philosopher holds.
  *   **"Reductionists think the default should be doubt and anti-reductionists think it should be trust."**
      *   *Verdict:* Safe simplification. This captures the normative spirit without getting bogged down in technical conditions.
  *   **"And the anti-reductionists win going away."**
      *   *Verdict:* Exaggeration. While anti-reductionism is dominant in contemporary epistemology, reductionism has sophisticated defenders (e.g., Peter Lipton, David Adler). For print, "most contemporary philosophers lean anti-reductionist" is safer.
  *   **"On the reductionist picture... you'd have to personally verify every claim... which is impossible."**
      *   *Verdict:* Targets a strawman. This regress argument lands only against *Local* Reductionism. *Global* Reductionists argue we have inductive, perceptual evidence that testimony is *generally* reliable, so we don't need to verify every claim individually. Your friend is right: this is a real distinction (Local vs. Global), not a dodge. The paragraph ignores Global Reductionism entirely.
  *   **"Institutional demands for independent evidence... are epistemically illegitimate."**
      *   *Verdict:* Straight misrepresentation. This does not follow. Epistemology concerns whether an individual *can* be justified in believing; journalism ethics concerns whether an institution *should* publish. Even if testimony is a basic source, high-stakes institutions require redundancy to mitigate error. Anti-reductionism grants permission to believe, not a prohibition on verifying.

  **Addressing Your Specific Suspicions**

  *   **"Basic source" vs. "No reasons":** You are right to flag this slide. A "basic source" means you don't need to infer reliability from other sources (like perception), not that you need no reasons whatsoever. You still need reasons to think there are no defeaters (e.g., no reason to think the speaker is lying). Fix this by changing "needs no reasons" to "needs no *independent* positive reasons."
  *   **The Regress and Background Evidence:** Your friend is correct. The regress argument only bites if you require non-testimonial backing for *each individual belief* (Local). Most modern reductionists require non-testimonial backing for the *practice* of testimony (Global). This isn't a retreat; it's a different position that avoids the absurdity of verifying every claim while maintaining that testimony isn't magic. The paragraph presents Local Reductionism as the only option, which is outdated.
  *   **Institutional Demands:** The philosopher is changing the subject. She moves from individual epistemic justification (can I believe this?) to institutional policy (should we print this?). Even if anti-reductionism is true, a newsroom's two-source rule is epistemically legitimate because it reduces the risk of false testimony spreading. Anti-reductionism explains how we learn from others; it doesn't mandate that we never check them.
