prompt: |-
  hey — I do a hands-on session every year at the science-writers conference, 75 minutes, around 20 people, mostly reporters plus a few editors, mixed experience levels, and nobody signed up for a philosophy class. This year I want to do it on the precautionary principle, and I want it to be something they actually do rather than me standing at the front defining it.

  The thing I want them to feel is that the precautionary principle isn't really a claim about how much risk to take. It's a claim about who has to prove what. Same dossier, same people, and the outcome flips completely depending on whether the default is "you can go ahead unless somebody produces evidence of harm" or "you can't go ahead until somebody produces evidence of safety." I want them walking out able to spot which default a story has quietly already picked. I've started calling it the default leak, because it leaks out of the reporting and into the grammar: "no evidence that X harms" versus "evidence that X doesn't harm," "can't rule out" versus "has ruled out," "scientists warn" versus "scientists reassure." Readers inherit the default and never find out it was a choice.

  Second thing: I want them to get burned by the mirror version — precaution pointed at the status quo instead of at the new thing. Blocking the replacement keeps the old thing in place, and sometimes the old thing is what's doing the damage. If they leave thinking precaution just means "be careful," I blew it.

  What I have so far is a fake case (I'm inventing the dossier on purpose, I do not want them litigating real science) and a two-round editorial meeting where each table votes. But I can't get the mechanics to bite:

  - I want the two-default thing to land as a discovery, not an instruction. My idea is to slip half the tables a card saying the proposal moves forward unless someone produces evidence of harm, and the other half a card saying it's blocked unless someone produces evidence of safety, without telling them the cards differ — so each table thinks that's just how meetings work. Is that too cute? What happens when they compare notes, and how do I keep it from becoming "you rigged this"?
  - The dossier has to be built so both defaults are genuinely live. I don't want the evidence packet deciding it behind my back. What has to be in it, and what has to be conspicuously missing?
  - I need somthing with actual costs, not real money but a payoff scheme where blocking and approving both cost you something, plus a clock — a lot of the real force of precaution is that the decision has a deadline and the status quo keeps running while you deliberate.
  - Round 2 has to flip it so the risky move is the block. How do I stage that so it doesnt feel like I changed the subject?

  Then a final round: same dossier, each table writes a hed under their standard, tables swap, and they have to guess which default produced which hed.

  Give me rules, materials, a minute-by-minute timeline, and a debrief that maps what happened in the room onto the parts of the idea. Tell me what will predictably blow up the first time I run it and how to handle it. And be straight with me about what the game can't do — I'm guessing it can't reproduce whatever makes real precautionary arguments feel heavy instead of procedural (irreversibility? the gap between a risk you can price and one you can't?), so tell me which part I just have to say out loud myself. No reading list, no citations — I'm not writing the explainer here.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **User:** Science writer running a 75-minute hands-on session at a conference.
      *   **Audience:** ~20 people (reporters/editors), mixed experience, *not* there for philosophy.
      *   **Topic:** The Precautionary Principle (PP).
      *   **Core Insight 1:** PP is about *burden of proof* (who has to prove what), not just "how much risk." It's about the "default setting."
      *   **Core Insight 2:** PP can apply to the *status quo* too (blocking the new thing might keep the dangerous old thing).
      *   **Goal:** Participants should leave able to spot "default leaks" in reporting (grammar choices that reveal hidden assumptions).
      *   **Current Idea:** A fake case study with a two-round editorial meeting. Half the tables get one default rule, half get the other, without knowing initially.
      *   **Specific Needs:** Rules, materials, timeline, debrief, prediction of failure points, honesty about limitations.
      *   **Constraints:** No reading list, no citations, keep it practical/hands-on.

  2.  **Deconstruct the Mechanics:**
      *   *The "Cute" Trick:* Slipping different rule cards to different tables.
          *   *Risk:* Participants feeling manipulated ("you rigged this").
          *   *Mitigation:* Frame it as "different editorial policies" or "different stakeholder mandates." Make the reveal a moment of shared realization, not accusation. The debrief needs to own the manipulation immediately as a feature, not a bug.
      *   *The Dossier:* Needs to be ambiguous enough that both defaults lead to defensible but opposite outcomes.
          *   *Missing:* Definitive long-term safety data.
          *   *Present:* Strong short-term benefits, plausible but unproven mechanisms of harm, high cost of delay.
      *   *The Costs/Clock:* Needs a scoring system. "Points" for lives saved/money saved, minus points for harm/delay. The clock creates pressure.
      *   *Round 2 (The Flip):* Needs to show that blocking the new thing has risks too. The "Status Quo" needs to be actively harmful.
      *   *Headline Exercise:* Crucial for translating the abstract game into their actual job (writing/editing).

  3.  **Drafting the Scenario (The "Fake Case"):**
      *   *Idea:* A new agricultural chemical? A medical device? A geoengineering project?
      *   *Selection:* **A new water filtration system for a drought-stricken region.**
      *   *Why:* High stakes (thirst/disease vs. potential toxicity), clear status quo (dirty water), clear new tech (filter).
      *   *The Tech:* "AquaPure X." Removes pathogens efficiently.
      *   *The Risk:* Potential long-term kidney accumulation in 1% of the population (uncertain).
      *   *The Status Quo:* Current water source has known cholera/dysentery risk.
      *   *The Delay Cost:* Every week without X, people get sick from current water.

  4.  **Developing the Game Mechanics:**
      *   *Teams:* 4 tables of 5 people.
      *   *Round 1:* Decide whether to deploy AquaPure X.
      *   *Rule Cards:*
          *   Card A (Permissive): Deploy unless *proven* harmful.
          *   Card B (Precautionary): Do not deploy unless *proven* safe.
      *   *Scoring:* "Public Health Points."
          *   Deploy + Benefit: +10 pts/week.
          *   Deploy + Harm: -50 pts (if harm happens).
          *   Delay + Status Quo Harm: -5 pts/week.
      *   *Round 2:* New info arrives. The Status Quo gets worse (outbreak). The New Tech is still uncertain. Now, *blocking* is the risky move.
      *   *Headline Round:* Write the lead/headline based on their decision. Swap and guess the rule card.

  5.  **Addressing the "Rigged" Concern:**
      *   Don't hide the fact that rules differ until the very end. Tell them upfront: "You are simulating different newsrooms with different editorial charters."
      *   Actually, better: Tell them *nothing* about the rules differing. Let them argue. When they compare, the friction *is* the lesson.
      *   *Correction:* The prompt asks "Is that too cute?" If I tell them "you have different charters," they intellectualize it. If they discover it, they *feel* it.
      *   *Strategy:* Keep it secret until the reveal. Address the "rigged" feeling by validating it: "Yes, I rigged it. That's how the world works. You didn't know the other newsroom was playing by different rules."

  6.  **Timeline (75 Minutes):**
      *   0-5: Intro (No theory, just setup).
      *   5-20: Round 1 (Decision).
      *   20-30: The Reveal (Table comparison).
      *   30-45: Round 2 (The Status Quo Flip).
      *   45-60: Headline Swap.
      *   60-75: Debrief & Limitations.

  7.  **Refining the "Burn":**
      *   The user wants them to feel the "default leak."
      *   The headline exercise is key here.
      *   "City Deploys New Filter Despite Uncertainty" vs. "City Halts Filter Pending Safety Review." Same facts, different defaults.

  8.  **Identifying Failure Points:**
      *   *Science Litigation:* Reporters love to nitpick the fake science. *Fix:* Explicitly forbid Googling or debating the plausibility. "Treat the dossier as absolute fact."
      *   *Cynicism:* "This is just risk assessment." *Fix:* Focus the debrief on the *grammar* of the decision, not the math.
      *   *Time Overrun:* 75 mins flies. Need a hard stop on Round 1.
      *   *The "Rigged" Backlash:* Handle with humor and honesty.

  9.  **Addressing the Limitations (What the game can't do):**
      *   Real PP involves *irreversibility* and *deep uncertainty* (unknown unknowns). A game has fixed rules.
      *   Real PP involves *power dynamics* (who decides?). In the game, they are the deciders.
      *   Real PP involves *moral weight*. In the game, it's points.
      *   *Instruction:* The facilitator must verbally bridge this gap in the debrief.

  10. **Final Review against Constraints:**
      *   No philosophy class vibe? Keep intro short.
      *   Hands-on? Yes, voting and writing.
      *   20 people? 4 tables of 5 works.
      *   No citations? Check.
      *   Straight talk on limitations? Check.

  11. **Drafting the Content:** (Self-Correction during drafting)
      *   *Make sure the Dossier is provided.* I need to sketch out what's in the envelope.
      *   *Make sure the Rule Cards are distinct.*
      *   *Ensure the "Status Quo Flip" is clear.* In Round 2, the old water source gets contaminated. Blocking the new filter now kills people.
      *   *Refine the Headline prompt.* Ask for a "nut graf" or first sentence too, to catch the grammar.

  12. **Final Polish:** Tone should be professional, peer-to-peer (facilitator to facilitator), direct, and actionable. (Proceed to generate output).

  *(Self-Correction on the "Rigged" aspect)*: If half the room votes Yes and half votes No, and they find out it was the *rules* not the *people*, that's the "Aha!" moment. I need to make sure the tables are physically separated enough that they don't hear each other's rules during Round 1.

  *(Self-Correction on Round 2)*: How to make blocking risky? The dossier needs to say "Current water source has spiked with Pathogen Y." So *not* acting is now an action with consequences. This addresses the "Precaution vs Status Quo" point.

  *(Debrief)*: Must explicitly map the "Default Leak" to the headlines they wrote.

  Let's assemble the plan.cw
answer: |-
  This is a strong concept. The "default leak" is a tangible, reportable hook that avoids the philosophical quagmire. The risk of the "rigged" feeling is real, but if you frame the reveal correctly, it becomes the central lesson: *the world is rigged this way, and you didn't know.*

  Here is the run-of-show, materials, and mechanics to make the 75 minutes bite.

  ### The Setup
  *   **Room:** 4 tables of 5 people. (20 total).
  *   **Materials per table:**
      *   1 Envelope labeled "CONFIDENTIAL DOSSIER."
      *   1 Envelope labeled "EDITORIAL CHARTER" (Sealed. Do not open until instructed).
      *   1 Scorecard (simple grid for tracking "Public Health Points").
      *   Markers and large sticky paper for headlines.
  *   **Facilitator Prep:**
      *   **Charter A (Permissive):** 2 Tables get this.
      *   **Charter B (Precautionary):** 2 Tables get this.
      *   **Dossier:** Identical for everyone.

  ---

  ### The Dossier (The "Fake Science")
  *Keep it to one page. Bullet points. No nuance.*

  **Subject:** Project AquaPure (New Filtration Membrane)
  **Context:** Region Z is in Year 3 of a severe drought. Current water sources are stagnant.
  **The Tech:** AquaPure filters remove 99% of known pathogens. Cost is low. Deployment time: Immediate.
  **The Benefit:** Models project 500 lives saved/month from waterborne disease compared to current source.
  **The Risk:** Lab studies on rats show potential for microscopic membrane fibers to accumulate in kidney tissue.
  **The Uncertainty:** We do not know if this accumulation causes failure in humans. Long-term human trials would take 2 years.
  **The Status Quo:** Current water source has a known, active Cholera strain. Infection rate is rising (10% month-over-month).
  **The Decision:** Authorize immediate deployment OR halt for 2-year safety review.

  ---

  ### The Editorial Charters (The "Rig")
  *Print these on different colored paper inside the sealed envelopes.*

  **Charter A (The "Innovation" Default)**
  > **Mission:** Minimize suffering from known threats.
  > **Rule:** New technologies are presumed beneficial until **conclusive evidence of harm** is presented.
  > **Burden of Proof:** On the critics. If they cannot prove it hurts, you run it.
  > **Penalty:** You lose points for every death caused by the *Status Quo* while you deliberate.

  **Charter B (The "Precaution" Default)**
  > **Mission:** Prevent exposure to unknown threats.
  > **Rule:** New technologies are presumed risky until **conclusive evidence of safety** is presented.
  > **Burden of Proof:** On the proponents. If they cannot prove it's safe, you block it.
  > **Penalty:** You lose massive points if you authorize a tech that later causes harm.

  ---

  ### Minute-by-Minute Timeline (75 Minutes)

  **0:00 – 0:05 | Intro (No Theory)**
  *   "You are the editorial board of a major regional paper. You also hold the power of injunction. You can stop or start public projects based on your coverage."
  *   "You have a dossier. You have a sealed Charter. Do not open the Charter yet. Read the dossier."
  *   "You have 10 minutes to make a decision: Deploy AquaPure or Halt for Review. You must agree as a table."

  **0:05 – 0:15 | Round 1 (The Decision)**
  *   Tables read dossier.
  *   **Crucial:** They open their Charters *now*. They must apply their specific rule to the decision.
  *   They record their vote and calculate their initial "Public Health Points" based on the immediate outcome (Deploy = save 500 lives/mo; Halt = status quo deaths continue).
  *   *Facilitator Note:* Walk around. Listen for the grammar. "We can't be sure" vs "We have no proof."

  **0:15 – 0:25 | The Collision (The Reveal)**
  *   Ask Table 1: "What did you decide?" (Likely Deploy).
  *   Ask Table 3: "What did you decide?" (Likely Halt).
  *   Ask: "Why?" Let them cite the dossier. They will cite the *same facts* to reach *opposite conclusions*.
  *   **The Turn:** "Open your Charters. Compare with the table across from you."
  *   Let the noise happen. Let them realize the rules were different.
  *   **Your Line:** "I rigged this. But I didn't rig the science. I rigged the default. In your coverage, you often inherit a Charter without noticing it. That is the Default Leak."

  **0:25 – 0:40 | Round 2 (The Status Quo Flip)**
  *   Hand out **Update Card** (Same for everyone).
  *   **Update:** "Cholera outbreak in Region Z has mutated. Mortality rate doubled. Status Quo is now actively killing 1,000/month. AquaPure risk data is unchanged (still uncertain)."
  *   **Task:** Re-vote.
  *   **The Trap:** Charter B (Precautionary) tables now have to block a life-saver to avoid a theoretical risk. Charter A tables look like heroes, but are gambling on the unknown.
  *   **Goal:** Make the Precautionary tables feel the pain of *inaction*. Blocking is now the risky move.
  *   5 minutes to decide. 5 minutes to discuss the friction.

  **0:40 – 0:55 | The Headline Swap (The Grammar Check)**
  *   **Task:** Write the first sentence (the lead) of the story announcing your decision.
  *   **Constraint:** You must reflect your Charter's logic in the grammar.
  *   **Swap:** Pass the lead to the table on your right.
  *   **Task:** The receiving table must guess: Did this come from a 'Deploy unless harmful' newsroom or a 'Halt unless safe' newsroom?
  *   **Debrief the Swap:** Read 2-3 aloud. Point out the verbs. "Officials *assure* safety" vs "Officials *cannot rule out* risk."

  **0:55 – 1:15 | The Debrief (Mapping the Room)**
  *   (See detailed script below).

  ---

  ### The Debrief Script (Key Beats)

  **1. Validate the Manipulation**
  "If you felt annoyed that I gave you different rules, good. That is the feeling of reading a story where the default setting is hidden from you. You felt the asymmetry. Your readers feel it too, but they can't name it."

  **2. Map the Grammar**
  "Look at the leads you wrote.
  *   **Charter A** likely wrote: 'City moves forward with filter despite unanswered questions.' (Default: Go).
  *   **Charter B** likely wrote: 'Filter rollout paused until safety guarantees are met.' (Default: Stop).
  *   Neither headline mentioned the *rule* that forced the decision. That is the leak. The rule determined the outcome, but the story covered the science."

  **3. The Status Quo Burn (Round 2)**
  "In Round 2, the Precautionary tables felt the weight of the Status Quo. When the old thing is killing people, 'doing no harm' means acting. If you leave thinking Precaution is just 'blocking new tech,' you missed the point. Precaution is about *which risk gets the benefit of the doubt.* Sometimes the risk is the change; sometimes the risk is the delay."

  **4. What This Game Can't Do (The Honesty Clause)**
  *   **Irreversibility:** "In this game, you could theoretically reverse the decision. In reality (climate, extinction, genetic editing), you can't. The Precautionary Principle weighs heaviest when the door only opens one way. I couldn't simulate that stakes without paralyzing you."
  *   **Power:** "In this game, *you* were the deciders. In reality, the burden of proof is usually placed on the people with the least power to generate evidence. The 'Charter' is usually written by the industry, not the editors. You need to spot who wrote the Charter in the real story."
  *   **Unknown Unknowns:** "The dossier told you the risk (kidney fibers). Real precaution is about risks we can't even imagine yet. That's the hardest part to report: How do you write about a ghost?"

  ---

  ### Predictable Failure Points & Fixes

  **1. "This science is fake/stupid."**
  *   **Prediction:** Reporters will try to debunk the dossier. "Kidney fibers in rats doesn't mean humans."
  *   **Fix:** Hard rule at the start. "You are not science reviewers. You are editors. The dossier is the universe. You cannot dispute the facts, only the threshold for action." If they push back, say: "In your real life, you often don't have time to verify the primary study. You have to judge the claim. Treat this as that moment."

  **2. "You tricked us."**
  *   **Prediction:** During the Charter reveal, someone calls foul.
  *   **Fix:** Own it immediately. "Yes. I hid the variable. That is exactly what happens when a press release says 'Study finds no link' without telling you the study was powered to find only massive effects. The variable was hidden. Now it's on the table."

  **3. Round 2 feels like a "Gotcha."**
  *   **Prediction:** Precautionary tables feel you moved the goalposts to make them look bad.
  *   **Fix:** Frame Round 2 not as "Precaution is bad," but as "Context changes the Default." Ask the Precautionary tables: "Did your rule change, or did the cost of the Status Quo change?" (Answer: Cost changed). "Your job is to spot when the Status Quo becomes the greater risk."

  **4. Time Creep.**
  *   **Prediction:** Round 1 discussion runs long.
  *   **Fix:** Use a visible timer. At 10 minutes, blow a whistle. "Decision locked. If you haven't voted, you default to Status Quo." (This actually reinforces the lesson—indecision favors the Status Quo).

  ### Materials Checklist for You
  1.  **Dossier:** 20 copies.
  2.  **Charter A:** 10 copies (Green paper).
  3.  **Charter B:** 10 copies (Red paper).
  4.  **Update Card:** 20 copies.
  5.  **Timer:** Visible.
  6.  **Whiteboard:** To track the "Public Health Points" of each table (keep score competitive to raise stakes).

  ### Final Advice on the "Heaviness"
  You asked what you have to say out loud because the game can't capture it. It's the **Asymmetry of Proof**.

  In the game, proving safety and proving harm are both just "tasks." In reality, proving a negative (safety) is often impossible. You need to say this in the debrief:
  *"The game made 'Prove Safety' sound like a to-do list item. In the real world, 'Prove Safety' is a black hole. You can never prove absolute safety. So a default of 'Prove Safety' is often a default of 'Never Happen.' You need to write that tension. When a source says 'We need more study,' ask yourself: Is that a request for caution, or a request for indefinite delay?"*

  That is the line that takes them from "game player" back to "reporter."
