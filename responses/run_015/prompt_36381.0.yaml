answer: |-
  This is a fantastic puzzle, and your instincts are spot on. Your mate has accurately described a famous problem in decision theory known as the **Pasadena Game** (introduced by Nover and Hájek in 2004).

  The short answer is: **The maths is settled, but the decision-theoretic conclusion your mate draws is not consensus.** The argument fails at **Step (1) and Step (5)**.

  Here is the breakdown of what is settled mathematics, what is contested philosophy, and exactly where the argument breaks.

  ### 1. Settled Maths vs. Contested Theory

  First, let's separate the arithmetic from the norms.

  *   **Settled Maths:** Your mate's calculation of the series is correct.
      *   The probability of stopping at flip $n$ is $1/2^n$.
      *   The payoff is $\pm 2^n/n$.
      *   The contribution to Expected Value (EV) is $(1/2^n) \times (\pm 2^n/n) = \pm 1/n$.
      *   The series is indeed $1 - 1/2 + 1/3 - 1/4 \dots$, which is the alternating harmonic series.
      *   It is **conditionally convergent** (it converges to $\ln 2$, but the sum of absolute values $\sum 1/n$ diverges to infinity).
      *   The **Riemann Rearrangement Theorem** is correct: you can reorder the terms of a conditionally convergent series to sum to any real number.
  *   **Contested Decision Theory:** The interpretation of what this means for rational choice.
      *   **Your Mate's View:** EV theory is self-refuting because it yields contradictory values for the same gamble.
      *   **Standard Probability/Decision View:** The Expectation of this gamble is **undefined**. It is not $\ln 2$, it is not $100$, it is *NaN* (Not a Number).

  ### 2. Where the Argument Breaks: Steps (1) and (5)

  The fatal error lies in the claim that *"enumeration order is bookkeeping, and bookkeeping can't matter."*

  In finite arithmetic, this is true. In infinite series used to define probabilistic expectation, **it is false.**

  In rigorous probability theory (Measure Theory), the Expected Value is defined as a **Lebesgue Integral**, not a Riemann sum.
  *   For a Lebesgue integral to be well-defined, the integral of the *absolute value* must be finite ($\mathbb{E}[|X|] < \infty$).
  *   If $\mathbb{E}[|X|] = \infty$ (which is true here, since $\sum 1/n$ diverges), then $\mathbb{E}[X]$ is mathematically **undefined**.

  Your mate is treating Expectation like a Riemann sum (where you line up terms and add them). In a Riemann sum, order matters for conditionally convergent series. But Expectation isn't supposed to be a Riemann sum; it's supposed to be a property of the random variable itself, independent of how we list outcomes.

  **The Rejection:** You reject Step (1). Enumeration order *is* mere bookkeeping, **which is precisely why you are not allowed to rearrange the terms.**
  If changing the order of your bookkeeping changes the result, then the bookkeeping wasn't neutral—it was doing work. Since rational evaluation *shouldn't* depend on bookkeeping, the only consistent conclusion is that **the evaluation cannot be performed.**

  By allowing rearrangements to count as "legitimate evaluations" (Step 5), your mate is violating the definition of Expectation. A rearrangement of terms corresponds to a different sequence of partial sums. In the context of the game, the "natural order" ($n=1, 2, 3\dots$) corresponds to the temporal structure of the coin flips. A rearrangement that groups all positive terms first implies a physical impossibility (waiting for all odd flips to occur before acknowledging even flips).

  ### 3. Defusing the Money Pump (Step 6)

  The money pump argument relies on the idea that the game has *multiple true values* (0.69, 100, -5) and the bookie can toggle your belief between them.

  If you adopt the standard mathematical view—that the EV is **undefined**—the pump stops.
  *   **Bookie:** "This game is worth £100 based on rearrangement X."
  *   **You:** "No, that rearrangement violates the conditions for Expectation. The EV is undefined."
  *   **Bookie:** "Okay, well it's worth £0.69 based on natural order."
  *   **You:** "Also undefined. The sum of absolute payoffs diverges."
  *   **Bookie:** "So will you pay me £90?"
  *   **You:** "I cannot use EV to decide. I might decline, or I might use a different decision rule (like utility bounds), but I am not committed to paying £90."

  You cannot be pumped for accepting a price if your theory tells you that *no price is justified by EV*.

  ### 4. What Does Rejecting Step (1) Cost?

  You asked what it costs to reject the idea that enumeration order is irrelevant. The cost is significant, but it's the price of admission for dealing with infinity.

  1.  **EV is not Universal:** You must accept that Expected Value theory cannot evaluate every gamble. It works for "tame" gambles (where $\mathbb{E}[|X|] < \infty$) but fails for "wild" gambles (like the Pasadena game or the original St. Petersburg paradox).
  2.  **Need for Alternative Norms:** If EV is undefined, what *should* you do? Decision theorists propose alternatives:
      *   **Dominance:** If Gamble A pays more than Gamble B in every state, pick A. (This still works for the Pasadena game).
      *   **Utility Bounds:** Assume utility has a maximum/minimum cap (bounded utility). If utility is bounded, the EV becomes absolutely convergent, and the paradox vanishes.
      *   **Time-Average Growth:** Some argue we should maximize the geometric growth rate (Kelly criterion) rather than arithmetic expectation.
  3.  **Privileging the Natural Order:** You asked what privileges the natural order. It's not just that it's "first." It's that $n$ represents a physical index (the flip number). The partial sum $S_N = \sum_{n=1}^N$ represents the expected value of the game *if it were truncated at N flips*. As $N \to \infty$, this sequence converges to $\ln 2$. A rearranged series does not correspond to truncating the physical game; it corresponds to a fictional game where outcomes are revealed in a different order. Since the physical game reveals flips in order $1, 2, 3\dots$, the natural order is the only one that maps to the causal structure of the gamble.

  ### 5. The Consensus View

  To answer your final concern: **The consensus is NOT that EV theory is broken.**

  The consensus among mathematicians and most decision theorists is:
  1.  **Mathematically:** The expectation of the Pasadena game is undefined.
  2.  **Philosophically:** This highlights a limitation of EV as a *complete* theory of rationality. It shows EV cannot handle "infinite utility" or "non-absolutely convergent" scenarios without additional constraints (like bounded utility).
  3.  **Practically:** No real-world bankroll can support the payouts required for this game (paying $2^{100}/100$ is physically impossible). Therefore, in the real world, the game is necessarily truncated, making the sum finite and absolutely convergent, restoring EV's validity.

  Your mate's conclusion ("EV refutes itself") is a position held by some (notably Alan Hájek, one of the paper's authors), who argue this shows EV is fundamentally flawed. However, the opposing view (held by many others) is that EV is perfectly fine, provided we acknowledge its domain of applicability requires absolute convergence.

  ### Summary for your Mate

  You can tell him:
  1.  **Maths:** You are right about the series (Settled).
  2.  **Probability:** You are wrong about Expectation. Expectation requires absolute convergence. If it's not absolutely convergent, the value is undefined, not multivalued (Settled).
  3.  **Step (1):** Enumeration order *must not* matter. Because rearranging terms *does* change the sum, rearranging terms is **not permitted** when calculating Expectation.
  4.  **Money Pump:** Fails because a rational agent following standard probability theory will not assign a value of £100 to the game in the first place.

  The "exit" is to accept that **Expected Value is undefined for this game.** This saves EV theory from contradiction at the cost of admitting it can't value every conceivable infinite gamble.
