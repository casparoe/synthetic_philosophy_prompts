answer: |-
  Good evening. For those who don't know our guest of honor well, [Mentor's Name] has a tradition. Every year on her birthday, she reads Cicero's essay *On Old Age*. For the grandkids in the room, Cicero was a Roman statesman who lived two thousand years ago and decided to write a manual on how to handle getting older. He listed four complaints people have about aging. Usually, a toast ignores the bad stuff. But [Mentor] gave me specific instructions: no fluff. No saying she's "entering a new chapter." No pretending moving to a smaller apartment is some great liberation. And definitely no saying she'll be "watching over us" from above.

  So, we are going to use Cicero's list. Not to decorate the speech, but to test it against the woman we know.

  Cicero's first complaint is that old age withdraws us from public life. He argues you stop doing and start guiding. Does this hold up for her? Partially. She is still taking pro bono cases. Her mind hasn't retired. But Cicero ignores the logistics. She doesn't drive after dark anymore. The work is the same, but the perimeter has shrunk. She isn't withdrawing by choice; she's managing boundaries. So, I won't say she's stepped back to let others lead. I'll say she's still in the fight, just on a schedule that respects the sunset. For the kids: think of it like knowing you have to come inside when the streetlights turn on, even if the game isn't over.

  Cicero's second complaint is that old age enfeebles the body. His rebuttal is that exercise and moderation keep you strong. Here, Cicero collapses. He wasn't accounting for chemo. When your treatment makes your body feel like it's fighting a war, "moderation" isn't the answer. Survival is. I cannot stand here and claim her body is just "aging gracefully." It is enduring something hard. So I won't offer platitudes about health. I will acknowledge the stamina it takes to sit in this chair tonight.

  Third, Cicero claims old age deprives us of physical pleasures. He says "good riddance," that pleasure clouds the mind. But when dinner tastes like cardboard, that isn't wisdom; it's loss. Cicero's rebuttal fails here. You can't reason your way into tasting a strawberry. So I won't pretend she doesn't miss the simple joys. We know the food hasn't been right lately. We know that's hard. For the kids: imagine eating your favorite birthday cake, but it tastes like nothing. That's a hard thing to accept, and we don't pretend it isn't.

  Finally, Cicero says old age is near death, but argues death is natural, like fruit falling from a tree. He says there is no fear. This is where I have to leave something unsaid. I know she worries about being alone. She won't say it out loud, and neither will I. But Cicero's idea that death is just "natural" doesn't comfort the people sitting in this room who want her here. His rebuttal collapses because it ignores love. So I won't say she's unafraid. I won't say she's going anywhere soon. I will say that as long as she is here, she is not alone.

  [Mentor], Cicero wrote his essay to convince himself that aging was okay. You don't need convincing. You need us to see the reality without looking away. You are still working, even if you don't drive at night. You are fighting, even when your body resists. You are here, even when the future is uncertain. We aren't here to celebrate a "new chapter." We are here to witness this one. To [Mentor].

