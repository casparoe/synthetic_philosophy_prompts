answer: |-
  You have identified a genuine and well-documented tension in political theory, even if you haven't seen it named in a way that sticks. Your friend who suggested "constituent power" was actually very close to the bone, but they likely lacked the context to explain *why* it felt slightly off.

  There isn't one single English word for this specific rhetorical maneuver, but there is a precise conceptual framework for it. In political science and legal theory, this is best understood as **the claim to Constituent Power during a moment of Constituted Power.**

  However, since you want a name for the specific *pattern* (the retroactive dating, the freezing, the asymmetry), the most accurate descriptive term is **The Reification of the Popular Will.**

  Here is the carving you asked for: the theory, the name, and the edges that distinguish a legitimate founding moment from a rhetorical trick.

  ### 1. The Theory: Constituent vs. Constituted Power
  Your friend mentioned **Constituent Power** (*pouvoir constituant*). This is the power of "The People" to create a political order from scratch (like writing a Constitution after a revolution). It is raw, unlimited power.
  **Constituted Power** (*pouvoir constitué*) is the power that exists *within* that order (like a Parliament passing a tax law). It is limited by rules, courts, and minority rights.

  **The Pattern You See:**
  The actors you are describing are trying to treat a **Constituted Power** event (a normal referendum or election) as if it were a **Constituent Power** event.
  *   **Normal Politics:** "We won the vote, so we get to pass this law, subject to checks and balances."
  *   **The Pattern:** "We won the vote, so we *are* the People. The law is secondary to our Will. Any check on us is an attack on Democracy itself."

  By doing this, they elevate a temporary policy victory into a permanent moral truth. This is why they date the will backwards ("we always wanted this") and freeze it forwards ("no second votes"). They are trying to lock a normal decision into the status of a sacred founding document.

  ### 2. The Name: The Reified Mandate
  While "Constituent Power Claim" is the academic category, the specific rhetorical move has a better name: **The Reification of the Popular Will.**

  *   **Reification** means treating an abstract concept as if it were a concrete, physical thing.
  *   **The Will** is abstract. It changes, it fluctuates, it is made of millions of different people.
  *   **The Move:** By saying "The Will has spoken," they turn a messy, temporary statistic (51% of voters on a Tuesday) into a solid object ("The Will") that exists independently of the people who created it.

  Once the Will is reified, it can be "obstructed." You can't obstruct an opinion, but you can obstruct a force of nature. This is why opponents become "enemies of the people" rather than just political rivals.

  If you need a shorthand for your group chat, call it **The Frozen Mandate.**
  *   **Definition:** A rhetorical strategy where a temporary electoral victory is reinterpreted as the permanent, pre-existing voice of the nation, rendering future dissent illegitimate.

  ### 3. The Asymmetry: Populist Logic
  You noted the asymmetry: *When they win, it's the Eternal Will. When they lose, it's a Flawed Snapshot.*

  Political theorist Jan-Werner Müller defines this as the core of **Populism**. It is not about policy (left or right); it is about a claim to **exclusive representation**.
  *   **Pluralist Democracy:** "I represent some people; you represent others. We negotiate."
  *   **Populist Logic:** "I represent the *real* people. If you oppose me, you are not part of the people."

  This explains the asymmetry. If they lose, the "real people" couldn't possibly have voted against them, so the vote must be flawed. If they win, the "real people" have finally been unleashed. This is why the will is confirmed but never corrected.

  ### 4. The Edges: When is this legitimate?
  You asked if this is always bogus, noting that after a revolution, "The People have spoken" sounds respectable. This is the crucial distinction. It depends on whether the system is in **Founding Mode** or **Governing Mode**.

  **Legitimate Instance (Founding Mode):**
  *   **Context:** A regime collapse, revolution, or decolonization. There are no existing rules.
  *   **Action:** A constitutional convention or founding referendum.
  *   **Why it works:** You *need* to freeze the will to create stability. You cannot have a second vote on whether the Constitution exists next week, or the state will collapse. The "will" must be reified to build the institutions that will protect future votes.
  *   **Example:** The US Constitutional Convention of 1787; South Africa's post-Apartheid constitution.

  **Illegitimate Instance (Governing Mode):**
  *   **Context:** A functioning democracy with existing courts, laws, and rights.
  *   **Action:** A policy referendum (e.g., leaving a union, changing a tax system, electing a leader).
  *   **Why it fails:** In a functioning system, the "Will" is supposed to be fluid. Today's majority can be tomorrow's minority. If you freeze the will of one specific vote, you destroy the mechanism that allows the will to change peacefully.
  *   **Example:** Claiming a 52% referendum vote on a specific policy is a permanent instruction that cannot be revisited, even if circumstances change drastically.

  **The Test:**
  Ask this: *Does this decision create the rules of the game, or is it a move within the game?*
  *   If it creates the rules (Constitution), freezing the will is necessary.
  *   If it is a move within the game (Policy/Election), freezing the will is authoritarian.

  ### 5. Summary for your Argument
  You can tell your group chat this:

  > "You're using **Constituent Power rhetoric** for a **Constituted Power decision**. You're trying to **reify** a temporary majority into a permanent **Frozen Mandate**. That works for writing a Constitution after a revolution, but in normal politics, it turns democracy into a one-way ratchet. If the 'Will of the People' can't be corrected by a future vote, it isn't democracy anymore; it's a founding myth."

  **The Concept:** The Reification of the Popular Will (or The Frozen Mandate).
  **The Theorists:** Bruce Ackerman (Constitutional Moments), Carl Schmitt (Decisionism), Jan-Werner Müller (Populism).
  **The Verdict:** It is a category error. It treats a governing decision as a founding event to bypass checks and balances.

  This gives you the name, the theory, and the boundary line between "respectable founding" and "sore winners."
