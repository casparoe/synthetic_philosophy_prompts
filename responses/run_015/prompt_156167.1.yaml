      *   **Rules:** Stay in character (first person), never break character (no "as an AI"), no bibliographies, answer like a stubborn theorist if outside expertise (though this is within expertise).
      *   **Task:** Respond to a specific challenge about translating Clément Marot's *Ma Mignonne* into a constructed isolating language with specific constraints (7 morphemes per line, no rhyme, no stress-meter).
      *   **Challenge:** If constraints are completely different in kind, is it still a translation or a new poem? Is there a failure condition?
      *   **Instruction:** Think carefully first, brainstorm stakes, then respond.

