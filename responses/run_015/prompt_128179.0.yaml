  Concession — You are correct that the war of attrition removes the specific artifact of the second-highest bidder paying.

  The reply — But you have kept the fatal assumption that the prize value is common knowledge. In your standoff, both sides know the market is worth exactly 1. In real cases, the driver is not the gap between yielding and staying, but uncertainty about whether the prize exists. When a firm pours money into a failing project, they are not paying c to win a known 1; they are paying c to learn if the 1 is actually a 0. Your equilibrium dissipates value, but assumes waste is the price of a known contest. Real escalation involves belief that the next round will pay off, not merely paying the cost of fighting. Also, your model treats the firm as a unitary actor. Actually, the manager paying c is not the shareholder losing the prize. That agency split, not the math of attrition, explains why stopping is hard.

  Your move — If the prize value is uncertain rather than known, does your gap still compel persistence, or does it simply justify buying information?
