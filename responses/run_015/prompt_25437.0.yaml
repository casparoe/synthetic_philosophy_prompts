  6.  **Addressing the "Settled vs. Contested" Requirement:**
      *   *Settled:* There is *no* settled consensus in political philosophy on Luck Egalitarianism. It is highly contested.
      *   *Contested:* The definition of "choice," the treatment of internal endowments (talents/impulses), and the extent of compensation.
