  ### Teaching Note: The Fragility of Strategy-Proofness at a Profile

  **The Rule**
  **Borda Count with 4 Candidates:** Each voter submits a strict ranking of candidates $\{A, B, C, D\}$; candidates receive 3 points for 1st, 2 for 2nd, 1 for 3rd, 0 for 4th; the candidate with the highest total score wins (ties broken alphabetically).

  **The Sincere Profile ($P$)**
  Five voters ($V_1$ to $V_5$). Maya is $V_4$, Sam is $V_5$.
  *   $V_1, V_2$: $B \succ C \succ D \succ A$
  *   $V_3$: $C \succ A \succ B \succ D$
  *   $V_4$ (Maya): $A \succ B \succ C \succ D$
  *   $V_5$ (Sam): $A \succ B \succ C \succ D$

  **Profile Properties**
  *   **First-Place Votes:** $B$ (2), $A$ (2), $C$ (1). No majority winner.
  *   **Sincere Winner:** **$B$** (Score 11).
  *   **Condorcet Status:** $B$ is *not* a Condorcet winner (loses pairwise to $A$ 3–2).
  *   **Maya & Sam's Preferences:** $A \succ B \succ C \succ D$. They receive their 2nd choice ($B$) sincerely.

  ---

  ### Verification Table

  | Scenario | Ballots ($V_4, V_5$) | Scores ($A, B, C, D$) | Winner | Payoff for Maya/Sam |
  | :--- | :--- | :--- | :--- | :--- |
  | **Sincere ($P$)** | $A \succ B \succ C \succ D$ | $A=8, \mathbf{B=11}, C=6, D=2$ | **$B$** | Baseline (2nd Choice) |
  | **Maya Solo** | $A \succ C \succ D \succ B$ | $A=8, \mathbf{B=9}, C=7, D=3$ | **$B$** | **Neutral** (No gain) |
  | **Maya Solo (Risky)**| $C \succ A \succ D \succ B$ | $A=5, B=9, \mathbf{C=10}, D=3$ | **$C$** | **Strictly Worse** (3rd Choice) |
  | **Joint (Maya + Sam)**| $A \succ C \succ D \succ B$ | $\mathbf{A=8}, B=7, C=8, D=4$ | **$A$** (Tie-break) | **Strictly Better** (1st Choice) |
  | **Sequential** | Maya moves first $\to$ Sam moves | $P \to \text{Maya Solo} \to \text{Joint}$ | $B \to B \to A$ | **Contagious** |

  *(Note on Joint Tie: In the joint deviation, $A$ and $C$ tie at 8 points. Alphabetical tie-break elects $A$.)*

  ---

  ### Structural Feature Doing the Work
  **The "Burying" Threshold.**
  The rule aggregates intensity (Borda), but the margin of victory is narrow. $B$ wins sincerely by 3 points over $A$. A single voter (Maya) moving $B$ from 2nd to 4th place reduces $B$'s score by 2, shrinking the gap to 1 point—insufficient to flip the winner alone. However, two voters doing this reduces $B$'s score by 4, flipping the lead. The manipulation requires **coordinated burial** of the sincere winner to lower their score below the coalition's favorite.

  ### Counterfactuals
  *   **If we swap to Plurality:** The coalition fails. $A$ and $B$ tie for first place (2 votes each) in the sincere profile. A tie-break would likely elect $A$ immediately, removing the incentive to manipulate, or $B$ would win outright if $V_3$ leans $B$. Plurality lacks the granularity to make the solo deviation "almost work" but fail.
  *   **If $B$ were a Condorcet Winner:** If $V_3$ preferred $B \succ A$, $B$'s Borda score would increase, widening the gap. The coalition would need a 3rd voter to join to overcome the margin, making the "phone call" between just two insufficient.

  ### The Honest Bit: Gibbard–Satterthwaite and "Distance"
  A Gibbard–Satterthwaite (GS) proponent would object: *"GS guarantees that for any non-dictatorial rule, there exists **some** profile where a single voter can manipulate. You've just found a 'safe' profile $P$. Why does this matter?"*

  The answer lies in the **distance to manipulability**.
  GS is an existential theorem; it doesn't tell you *where* the vulnerability is. In this example, $P$ is **one ballot change away** from being solo-manipulable.
  *   **Nearest Solo-Manipulable Profile:** Change $V_3$'s ballot from $C \succ A \succ B \succ D$ to $A \succ C \succ B \succ D$.
  *   **New Sincere Scores:** $B=10, A=9$.
  *   **New Solo Deviation:** Maya moves $B$ to last. $B$ drops to 8. $A$ wins.
  *   **Distance:** 1 voter ($V_3$) changing their sincere preference.

  **Pedagogical Takeaway:**
  GS warns us that manipulation is *possible* in the system. This example warns us that strategy-proofness is *fragile* in practice. A rule might look safe at the current political equilibrium ($P$), discouraging students from worrying about strategy. But because the "immunity" relies on precise score margins, a tiny shift in the electorate (one voter changing their mind about $C$ vs $A$) instantly converts a "safe" profile into one where Maya can win by lying alone. The "phone call" case illustrates that even when solo manipulation isn't currently profitable, the **coordination cost** is the only thing holding the system together—and that cost is low (just one other person).
