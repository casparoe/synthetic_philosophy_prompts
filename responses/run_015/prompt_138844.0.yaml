answer: |-
  This is a sharp setup. You are right to worry about the "coordination vs. coercion" distinction; that is the exact pressure point where Lewis's theory either illuminates the film or cracks under it. Your memory of Lewis is about 85% accurate, but that missing 15% is the difference between a convention and a law.

  Here is the correction, the reading, and the confidence assessment you asked for.

  ### 1. Correcting the Lewis Reconstruction

  You have the five conditions mostly right, but you have smoothed over the most critical one: **Condition (iii).**

  Lewis insists that a convention must solve a **coordination problem**, not a Prisoner's Dilemma.
  *   **Coordination Problem:** We both prefer to do $X$ if you do $X$, and $Y$ if you do $Y$. Our interests align; we just need to match. (Example: Which side of the road to drive on.)
  *   **Prisoner's Dilemma:** We both prefer to defect regardless of what the other does, but we are forced to cooperate by an external threat or contract.

  **The Correction:** In your version, you wrote: *"most people prefer to conform given that the others do."* Lewis requires more: they must prefer to conform *because* conforming solves the coordination problem itself, not because a third party punishes them for not conforming. If the preference to conform is driven primarily by the threat of sanction (becoming an animal) rather than the benefit of the match itself, Lewis explicitly excludes this from being a convention. He calls it a **norm backed by sanctions**.

  **Confidence:** High. This is the central thesis of *Convention*. If you miss this, you cannot distinguish traffic laws (conventions) from tax laws (sanction-backed obligations).

  ### 2. The Reading

  #### First: The Hotel, The Loners, and The Gestures
  Your instinct is correct: **The Hotel is not a Lewisian convention.**

  *   **Why it fails:** The guests do not prefer to match on superficial traits because matching on superficial traits is inherently useful (coordination). They prefer it because the alternative is ontological erasure (becoming a lobster). If the Hotel management vanished tomorrow, the "nosebleed match" regularity would collapse immediately. It lacks the self-policing stability of a true convention. It is a coercive regime masquerading as a social contract.
  *   **The Loners:** Similarly, the Loners' "no romance" rule is not a rival convention (Clause iv). Clause (iv) requires the alternative to be an *equally viable solution to the same coordination problem*. The Loners aren't solving the "how to pair up" problem; they are solving the "how to survive the Hotel" problem by opting out. Furthermore, their rule is enforced by mutilation (the Leader cutting the masturbator's hand). This, too, is sanction-backed, not a coordination equilibrium.
  *   **The Gesture Language:** **You are absolutely right here.** This is the only textbook Lewisian convention in the film.
      1.  **Regularity:** They use specific grunts/gestures to mean specific things.
      2.  **Expectation:** Each expects the other to use them.
      3.  **Preference:** Both prefer to use them *given* the other does (it allows intimacy without detection).
      4.  **Arbitrariness:** They could have used different grunts.
      5.  **Common Knowledge:** They know they are doing this.
      *   **Discussion Point:** This highlights that *true* convention in the film only exists in the margins, in the private sphere, away from the institutional enforcement of both the Hotel and the Loners. The film suggests that genuine social ontology is only possible outside of institutionalized norms.

  #### Second: Faked Traits and "Camouflage Conventions"
  This is the hardest philosophical nut. You are closer to the truth than your friend, but Lewis has a workaround you might be missing.

  *   **The Problem:** Lewisian signaling usually relies on the signal being *truthful* because lying undermines the coordination. If I signal "I am driving left" but drive right, we crash. In *The Lobster*, the signal (nosebleed) *must* be false to work.
  *   **Your Friend's View (Cheap Talk):** Lewis does allow for cheap talk, but only if it doesn't disrupt the equilibrium. Here, the deception *is* the equilibrium.
  *   **Your View (Camouflage):** You argue the synchronic definition can't see the incentive to misrepresent.
  *   **The Synthesis:** Lewis can actually handle this if you redefine the **object of the regularity**. The convention is not "Have a nosebleed." The convention is "Perform the ritual of matching traits."
      *   If the regularity is defined as *behavioral performance* rather than *internal state*, the faking doesn't break the convention. Everyone conforms to the rule "Act as if you share a trait." Everyone expects everyone else to act as if they share a trait. Everyone prefers to act as if they share a trait (to avoid becoming a lobster).
      *   **However,** you are right that this strains the spirit of Lewis. Lewis assumes conventions reduce uncertainty. Here, the convention *manufactures* uncertainty (nobody knows who is actually cruel, only who acts cruel).
      *   **Discussion Point:** Push the group on this. Is a convention still a convention if its primary function is to facilitate mutual deception? Lewis would likely say this moves from *Convention* into *Ideology*. The Hotel isn't coordinating action; it's coordinating belief (or the performance of belief).

  #### Third: The Ending (Diachronic Hardening)
  This is your strongest philosophical claim.

  *   **The Act:** David blinding himself is the ultimate commitment to the arbitrary trait.
  *   **Lewis's Gap:** Lewis treats arbitrariness as a logical feature of the convention's *origin*. He acknowledges that once established, conventions feel binding. But he assumes rational agents who can, in principle, switch if a better equilibrium arises.
  *   **The Film's Claim:** The film argues that arbitrariness is *temporal*. At $T_1$ (selection), the trait is arbitrary (nosebleed vs. limp). At $T_2$ (maintenance), the trait becomes essential. By the end, the "short-sightedness" trait is no longer a coordinating device; it is the *condition of possibility* for love.
  *   **The Contribution:** Lewis doesn't account for the **sunk cost of identity**. David isn't just coordinating; he is mutilating himself to maintain the *history* of the coordination. The film shows that conventions don't just solve problems; they create the subjects who are capable of solving them. David must become a blind man to be the partner of a blind woman.
  *   **Discussion Point:** Ask the group: Is David restoring a convention, or is he sacrificing his agency to a norm that has ceased to be a convention and become a law? The knife suggests the latter.

  ### 3. Overreach and Limitations

  Be honest with your group: **This reading flattens the affect.**

  *   **Where it works:** The structural analysis of the Hotel and the Gesture Language.
  *   **Where it fails:** The emotional horror. Lewis's framework is cold and functionalist. It treats the transformation into an animal as a "sanction." But the film presents it as a metaphysical tragedy. A Lewisian reading risks making the Hotel sound like a DMV with stricter penalties, rather than a nightmare of neoliberal coupledom.
  *   **Resistant Scenes:** The scene where David's brother (the dog) is killed. Lewis has no resources for grief that isn't about coordination failure. The scene where the Loners eat the steak with the knife—this is visceral violence, not equilibrium selection.
  *   **The Flattening:** If you stick strictly to Lewis, you might miss the critique of *heteronormativity*. The Hotel isn't just any coordination problem; it's specifically about compulsory pairing. Lewis's theory is neutral on *what* is being coordinated; the film is specific that *this* coordination is pathological.

  ### 4. Confidence and Uncertainty

  **Overall Confidence:** High (85%).
  The distinction between the Hotel (Sanction) and the Gestures (Convention) is robust and defensible using Lewis's text. The analysis of the ending as "diachronic hardening" is a strong philosophical extension of Lewis, even if it points out a limitation.

  **The Claim I Am Least Sure Of:**
  The status of the **Faked Traits**.
  I am 60% confident that Lewis would classify the "performance of traits" as a convention if defined behaviorally. However, there is a strong counter-argument that because the *intent* is deception, it violates the "Common Knowledge" condition (Clause v). If everyone *knows* everyone is faking, is it common knowledge that they are faking? Or is it common knowledge that they are *pretending not to know*? This moves into the territory of "pluralistic ignorance," which Lewis touches on but doesn't fully theorize. If your group pushes hard on whether "everyone knows everyone is lying," you might have to concede that this specific regularity falls outside Lewis's strict definition of convention and into something more like ritual or theater.

  **Summary for the Room:**
  1.  **Lewis Correction:** Conventions solve coordination problems, not Prisoner's Dilemmas. Sanctions kill conventions.
  2.  **Hotel/Loners:** Not conventions. Coercive regimes.
  3.  **Gestures:** The only true convention.
  4.  **Faking:** A convention of performance, not possession.
  5.  **Ending:** Shows how arbitrary conventions become essential identities over time, a gap in Lewis's rationalist model.

  Good luck. It's a great film for this, precisely because it breaks the theory even as it illustrates it.
