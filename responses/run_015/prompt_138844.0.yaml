      *   Q1: Hotel = Sanction (Not Convention). Loners = Sanction (Not Convention). Gestures = True Convention.
      *   Q2: Faking = Convention of Performance. Friend vs. You = Synthesis.
      *   Q3: Ending = Pathology of Convention. Lewis misses the *cost* of arbitrariness becoming essential.
