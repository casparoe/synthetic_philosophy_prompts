prompt: |-
  I'm designing one session of our department's upper-level course on democratic innovation — I'm a PhD student in political theory and I have the "institutional design" block to myself: 17 students, mostly third-years who have already had the survey in normative theory, one 90-minute meeting, a room with movable chairs, and no budget beyond printing. My allotted topic is selection rules: sortition, term limits, and the standing complaint about career politicians.

  I don't want to run it as a comparison of three reform packages, because that is what the reading does and they will arrive having read it. What I want them to feel is something I have started calling the migration thesis: the claim that any rule which lowers the return to holding office does not lower the assembly's need for institutional knowledge, it only relocates the people who hold that knowledge to actors nobody selected — permanent staff, lobbyists, the civil service, or the members of the cohort before. Relatedly, I want them to notice that "career politician" bundles at least two different complaints that the standard reform menu answers separately: a complaint about who gets filtered in (the selection runs on the desire to hold office, so it selects for a certain kind of person regardless of what they then do) and a complaint about whom the officeholder must answer to in order to keep the job.

  The design I keep sketching and cannot get to work: the same small legislative game played two or three times over a fictional mid-sized regional assembly's budget — a fixed pool, maybe five named line items, coalition-building required — with the selection rule swapped between rounds while everything else is held constant. A few students are drawn at the start and stay for the whole session as a permanent Secretariat: they alone have the full rulebook, they convert any member's idea into votable text, and they set the order of business. They score on how many provisions they drafted survive to a final vote, so their interest is in being needed rather than in any particular outcome. Members get private district cards and score on how close the outcome is to their district's priorities. Round one is ordinary re-electability; round two is a hard two-term limit; round three is selection by lot for a single non-renewable term. Members can claw power back from the Secretariat by spending floor time, which is scarce and which competes with actually passing things. I am also toying with a fourth, hybrid rule — call it cohort pairing: each member chosen by lot is shadowed by a randomly drawn veteran of the immediately preceding cohort, who may speak, brief, and draft but not vote, and whose own prospects after office rise with the pair's record — as a way of testing whether memory can be institutionalized without re-electability. Tell me whether that fourth round belongs in 90 minutes or whether it buries the debrief.

  What I need from you: a runnable activity on these lines or a better one — role sheets and a one-page rulebook I can print, a payoff scheme in points rather than money, a minute-by-minute timeline for one facilitator with no props beyond index cards, a deck of cards, and a timer. The debrief should map specific moments the students will actually have had onto the migration thesis and onto the two complaints I want separated, and it should let them name the diagnosis before I do. Also: what will predictably go wrong the first time I run it and how I recover without breaking character, and which part of the idea the game cannot reach at all and I will simply have to assert afterwards — I assume real sortition's descriptive representativeness and anything depending on days of facilitated deliberation are in that category, but tell me what else.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Instructor:** PhD student in political theory.
      *   **Course:** Upper-level Democratic Innovation (Institutional Design block).
      *   **Students:** 17 third-years (survey in normative theory done).
      *   **Constraints:** 90 minutes, movable chairs, no budget (printing only), 1 facilitator.
      *   **Topic:** Selection rules (sortition, term limits, career politicians).
      *   **Core Learning Objective (The "Migration Thesis"):** Lowering returns to office doesn't eliminate the need for institutional knowledge; it migrates that knowledge to unselected actors (staff, lobbyists, predecessors). Also, disentangle "career politician" complaints (selection filter vs. accountability mechanism).
      *   **Proposed Mechanism:** A legislative simulation game played 2-3 times with changing rules.
      *   **Specific Question:** Does the 4th round (Cohort Pairing) fit, or does it bury the debrief?
      *   **Deliverables:** Runnable activity, role sheets, rulebook, payoff scheme, minute-by-minute timeline, debrief guide, prediction of failure modes/recovery, limitations of the simulation.

  2.  **Evaluate the "Cohort Pairing" (Round 4) Idea:**
      *   *Pros:* Directly tests the "institutional memory without re-election" hypothesis.
      *   *Cons:* 90 minutes is tight for 3 rounds + deep debrief. Adding a 4th round adds mechanical complexity (pairing logic, new scoring) and reduces time for the crucial debrief where the "Migration Thesis" is synthesized.
      *   *Decision:* Cut Round 4 from the *play*, but keep it as a *proposal* during the debrief. The debrief needs time for students to articulate the migration of power to the Secretariat. If they spend 20 mins figuring out how pairing works, they won't have cognitive space for the theoretical synthesis.
      *   *Alternative:* Use the "Cohort Pairing" concept as the *solution* phase of the debrief. "You noticed the Secretariat gained power. How might we fix that without bringing back career politicians? Here's a design some theorists propose..."

  3.  **Refine the Simulation Design:**
      *   **Players:** 17 students.
      *   **Roles:**
          *   *Legislators:* 12 students (rotating or fixed? Fixed is easier for tracking scores, but fixed contradicts sortition. Let's make the *selection method* change, but the *people* stay in the room to compare experiences. Actually, for sortition to feel real, some should be excluded. But with 17, excluding people creates boredom. Better: Everyone is a "potential" member, but the *rules* dictate their status. Wait, the prompt says "A few students are drawn at the start and stay... as Secretariat." Let's lock that in.)
          *   *Secretariat:* 3 students (Fixed, hold the rules, draft text).
          *   *Legislators:* 14 students.
      *   **Rounds:**
          1.  Re-election (Career Politicians).
          2.  Term Limits (2 terms, hard stop).
          3.  Sortition (One-off, random).
      *   **Mechanics:** Need to be simple. Budget allocation is good. 5 Line Items.
      *   **Information Asymmetry:** Secretariat knows the *process* (how to draft), Legislators know the *preferences* (district cards). This creates the dependency.
      *   **Scoring:** Points based on policy alignment + survival of bills.

  4.  **Drafting the Materials:**
      *   *Rulebook:* Needs to be one page. Clear phases (Proposal -> Drafting -> Voting).
      *   *Role Sheets:* District priorities (simple vectors), Secretariat incentives.
      *   *Timeline:* 90 mins is 5400 seconds.
          *   Intro: 10 min.
          *   Round 1 (Re-election): 15 min.
          *   Round 2 (Term Limits): 15 min.
          *   Round 3 (Sortition): 15 min.
          *   Debrief: 35 min.
          *   Buffer: 5 min.
      *   *Debrief:* Needs to lead them to the Migration Thesis. Ask: "Who actually controlled the agenda?" "Where did the knowledge go?"

  5.  **Addressing the "Migration Thesis" & "Career Politician" Bundle:**
      *   *Migration:* As legislators become more transient (Term Limits -> Sortition), they rely *more* on the Secretariat to draft viable bills. The Secretariat's power grows.
      *   *Bundle:*
          *   *Selection Filter:* Do we want people who *want* the job? (Round 1 vs Round 3).
          *   *Accountability:* Who do they fear? (Voters in Round 1 vs. Legacy/Randomness in Round 3).
      *   *Debrief Questions:* "In Round 3, did you feel less empowered or more dependent?" "Who became the 'career' actors in the Sortition round?"

  6.  **Predicting Failure Modes:**
      *   *Chaos:* Students talk over each other. *Fix:* Strict speaking tokens or Secretariat controls the floor.
      *   *Secretariat Dominance:* They might block everything. *Fix:* Give Legislators a "Nuclear Option" (majority vote to bypass drafting) but it costs huge points/time.
      *   *Boredom:* Students not selected as legislators in Sortition round. *Fix:* In this design, everyone plays a legislator, but the *rule* simulates sortition (e.g., draw cards to see if your vote counts, or simply treat the *incentive structure* as if you were sortitioned). *Correction:* To feel the "exclusion" of sortition, we need some people to be out. But with 17, losing 5 people per round is hard.
      *   *Better Approach:* Keep the 14 legislators constant for gameplay continuity, but change their *incentive cards* to reflect the selection rule.
          *   Round 1: "You need 60% approval from District to return."
          *   Round 2: "You are in your final term. No re-election."
          *   Round 3: "You were drawn by lot. You cannot return. Your goal is legacy/random."
      *   *Wait, the Prompt's Secretariat Idea is Strong:* "A few students... stay for the whole session as a permanent Secretariat." This is crucial for the Migration Thesis. Let's stick to 3 Secretariat, 14 Legislators.
      *   *Sortition Mechanic:* In Round 3, to simulate the *risk* of sortition, maybe only 7 of the 14 legislators get to vote? No, that creates idle students. Better: In Round 3, the *Secretariat* assigns the agenda based on "Random Public Interest" (drawn from a deck), and Legislators just react. Or, keep it simple: The *incentive* changes. The prompt asks for "selection by lot."
      *   *Refined Sortition Mechanic:* In Round 3, Legislators draw a "Competence Card." If they draw a "Novice" card (50% chance), they cannot draft their own proposals; they *must* use the Secretariat. This simulates the lack of experience/selection filter.

  7.  **Finalizing the Plan:**
      *   **Round 4 Decision:** Cut it from play. Use it in debrief.
      *   **Materials:** Role cards, Rulebook, Scoreboard (whiteboard).
      *   **Debrief Strategy:** Socratic questioning to let them name the "Shadow Bureaucracy."
      *   **Limitations:** Cannot simulate long-term deliberation, cannot simulate true descriptive representation (random sample of population), cannot simulate external lobbying (unless Secretariat acts as lobbyist).

  8.  **Writing the Response:**
      *   Tone: Professional, academic, practical.
      *   Structure:
          1.  Direct answer on Round 4.
          2.  Simulation Overview.
          3.  Materials (Rulebook, Roles).
          4.  Timeline.
          5.  Debrief Script (The most important part for the learning objective).
          6.  Failure Modes & Limitations.

      *(Self-Correction during drafting)*: Make sure the Secretariat has a reason to help but also a reason to gatekeep. Their score is "Bill Survival." If they draft too much, bills fail. If they draft too little, they aren't needed. They need to be *indispensable*.
      *(Refining the Migration Thesis link)*: Ensure the debrief explicitly asks: "As your tenure became less secure (Round 1 -> 3), who did you turn to for help?"

      *(Refining the "Career Politician" Bundle)*: Round 1 selects for ambition. Round 3 selects for... nothing (luck). Round 2 selects for ambition but cuts the accountability.
      *Wait, Term Limits (Round 2) is the pivot.* It keeps the selection filter (ambition) but removes the accountability (re-election). Sortition (Round 3) removes both. This distinction is key.

      *Let's finalize the 3 Rounds:*
      1.  **Re-election:** Ambition + Accountability.
      2.  **Term Limits:** Ambition + No Accountability (Lame Duck).
      3.  **Sortition:** No Ambition (Random) + No Accountability (One-off).
      *This cleanly separates the variables.*

      *Wait, one constraint:* "17 students." 3 Secretariat + 14 Legislators.
      *Sortition Round:* To make it feel like sortition, maybe 14 is too many for a "citizen assembly." But for a classroom game, we need participation. I will keep the players constant but change the *rules of entry/exit* described on their cards to simulate the pressure.
      *Actually, to make the Migration Thesis pop:* The Secretariat must become *more* powerful in Round 3. How? In Round 3, Legislators are forbidden from speaking on the floor unless recognized by the Secretariat. In Round 1, they have open floor. This forces reliance on the "Staff."

      *Okay, let's write it.*
answer: |-
  ### 1. The Verdict on Round 4 (Cohort Pairing)
  **Cut it from the gameplay.**
  In 90 minutes, three rounds is the absolute ceiling for a simulation that requires drafting, voting, and scoring. A fourth round introduces new mechanics (pairing logic, shadow scoring) that will consume 15 minutes of cognitive load and leave you only 20 minutes for the debrief. The Migration Thesis is subtle; if the students are rushing to understand the pairing rules, they will not have the mental bandwidth to synthesize the power shift toward the Secretariat.

  **Instead:** Use Cohort Pairing as the *closing move of the debrief*. Once the students have identified the problem (knowledge migration to unselected staff), ask them: "If we cannot return to career politicians, but we cannot tolerate a powerful unelected Secretariat, how do we institutionalize memory?" Then propose the pairing model as a theoretical solution for them to critique.

  ---

  ### 2. Simulation Overview: "The Regional Budget Game"
  *   **Players:** 17 Total.
      *   **3 Secretariat:** Fixed for all rounds. Hold the Rulebook, Drafting Pen, and Timer.
      *   **14 Legislators:** Fixed for all rounds (for continuity of experience), but their *incentives* change per round.
  *   **Goal:** Pass a budget allocating 100 Points across 5 Line Items (Health, Roads, Schools, Police, Parks).
  *   **The Catch:** Legislators have private preference cards. Secretariat controls the *text* of the bills.
  *   **The Migration Mechanic:** As rounds progress, Legislators lose floor time and drafting autonomy, forcing reliance on the Secretariat to translate preferences into law.

  ---

  ### 3. Printable Materials (Text for Printing)

  #### A. The One-Page Rulebook (Hand to Secretariat Only)
  **ROLE: SECRETARIAT (Permanent Staff)**
  1.  **Objective:** Maximize **Staff Score**. You score 1 point for every Line Item that appears in the Final Budget. You do not care about the values, only that items survive.
  2.  **Power:** You alone write the legal text. A Legislator cannot propose a budget change without handing you a "Request Slip" (index card). You decide the order of business.
  3.  **Constraint:** You have 3 minutes to draft per Request. If you backlog, the floor freezes.
  4.  **Round Specifics:**
      *   *Round 1:* Legislators may speak freely on the floor.
      *   *Round 2:* Legislators must be recognized by you to speak.
      *   *Round 3:* Legislators cannot speak on the floor. All proposals must be drafted by you based on their slips.

  #### B. Legislator Role Cards (Print 14, cut into strips)
  **DISTRUCT PREFERENCES (Private)**
  *Assign each student a number 1-14. Hand out corresponding cards.*
  *   **District 1-4 (Urban):** High priority: Schools, Parks. Low: Police.
  *   **District 5-8 (Suburban):** High priority: Roads, Police. Low: Parks.
  *   **District 9-14 (Rural):** High priority: Health, Roads. Low: Schools.
  *   **SCORING:** At the end of each round, score 10 points for every High Priority item funded >10 pts. Subtract 5 points for every Low Priority item funded >10 pts.

  **INCENTIVE STRUCTURE (Public - Read Aloud each Round)**
  *   **Round 1 (Career):** You seek re-election. If the District Score is negative, you are "voted out" (lose 20 pts). If positive, you return.
  *   **Round 2 (Term Limits):** You are in your final term. Re-election is impossible. Maximize District Score. No penalty for negative score.
  *   **Round 3 (Sortition):** You were chosen by lot. You cannot return. You have no district. Maximize **Legacy Score** (Total Points allocated to *any* item). You are inexperienced; you do not know the rules.

  #### C. Scoreboard (Whiteboard)
  | Round | Rule Type | Avg Legislator Score | Secretariat Score | Bills Passed |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Re-election | | | |
  | 2 | Term Limits | | | |
  | 3 | Sortition | | | |

  ---

  ### 4. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Selection**
  *   Select 3 Secretariat (ask for volunteers who like organization/rules). Seat them at the front.
  *   Distribute Legislator Role Cards.
  *   Explain the Budget (100 pts, 5 items).
  *   **Crucial:** Tell them the *rules will change*, but the goal (pass a budget) remains.

  **00:10 – 00:25: Round 1 (Career Politicians)**
  *   *Incentive:* Re-election.
  *   *Mechanic:* Open floor. Legislators can shout out proposals. Secretariat drafts if asked.
  *   *End:* Tally scores. (Likely high legislator scores, moderate secretariat scores).
  *   *Transition:* "You were ambitious and accountable. Now, you are term-limited."

  **00:25 – 00:40: Round 2 (Term Limits)**
  *   *Incentive:* Lame Duck (No re-election).
  *   *Mechanic:* Secretariat controls speaking queue. Legislators must raise hands.
  *   *Observation:* Legislators care less about long-term stability, more about quick wins. Secretariat begins to gatekeep to ensure *their* score (bill survival).
  *   *End:* Tally scores.
  *   *Transition:* "Now, the election is abolished. You are here by lot."

  **00:40 – 00:55: Round 3 (Sortition)**
  *   *Incentive:* Legacy/Random.
  *   *Mechanic:* **Silent Legislature.** Legislators cannot speak. They must write requests on index cards and hand them to the Secretariat. Secretariat decides what to draft.
  *   *Observation:* Total dependency. Secretariat power peaks. Legislators feel frustrated/lost.
  *   *End:* Tally scores. (Secretariat score should be highest; Legislator satisfaction lowest).

  **00:55 – 01:30: The Debrief (The Core Learning)**
  *   *See Section 5 below.*

  ---

  ### 5. The Debrief Script (Socratic Mapping)
  *Do not lecture immediately. Ask them to name the phenomenon.*

  **Phase 1: The Experience (5 mins)**
  *   "Raise your hand if you felt most empowered in Round 1. Round 2? Round 3?"
  *   "Secretariat: In which round did you feel most necessary? In which round did you feel most powerful?"
  *   *Expected Outcome:* Legislators feel power slide to the Secretariat in Round 3. Secretariat admits they controlled the agenda in Round 3.

  **Phase 2: The Migration Thesis (15 mins)**
  *   "In Round 3, the *need* for a budget didn't disappear. The *knowledge* of how to pass it didn't disappear. So where did it go?"
  *   *Target Answer:* It moved to the unelected staff.
  *   "If we lower the return to office (no career), do we eliminate expertise? Or do we just make expertise unaccountable?"
  *   *Instructor Note:* Here you introduce the term **Migration Thesis**. "You just demonstrated that expertise migrates to the shadows when the light of election is turned off."

  **Phase 3: Unbundling the "Career Politician" (10 mins)**
  *   "Look at Round 1 vs Round 2. Both had 'politicians' who wanted the job. What changed?"
  *   *Target Answer:* Accountability. Round 1 they feared voters. Round 2 they didn't.
  *   "Now look at Round 1 vs Round 3. What changed about *who* was in the room?"
  *   *Target Answer:* Selection Filter. Round 1 selected for ambition. Round 3 selected for luck.
  *   "When people complain about 'Career Politicians,' are they mad that they stay too long (Term Limits fixes this), or that they are a certain *type* of person (Sortition fixes this)?"
  *   *Instructor Note:* Draw a 2x2 on the board. Axis 1: Selection (Ambition vs. Lot). Axis 2: Retention (Re-election vs. Limit). Plot the three rounds. Show that "Career Politician" conflates two different cells.

  **Phase 4: The Solution Proposal (5 mins)**
  *   "We saw that Sortition created a dependency on Staff. How do we fix that without bringing back career politicians?"
  *   *Introduce Cohort Pairing:* "What if every Sortition member was paired with a previous member who could advise but not vote? Would that keep knowledge in the elected body?"
  *   Let them vote on whether this solves the problem or creates a new oligarchy.

  ---

  ### 6. Failure Modes & Recovery
  **1. The Secretariat Goes Rogue (Tyranny)**
  *   *Risk:* They refuse to draft anything to maximize their own scarcity value.
  *   *Recovery:* Do not break character. Announce a "Constitutional Crisis." Tell the Legislators: "You have a majority. You can vote to fire the Secretariat, but it costs 10 rounds of voting (time)." This forces them to weigh the cost of rebellion vs. dependency.

  **2. Legislators Ignore Round 3 Rules (Talking)**
  *   *Risk:* They shout anyway.
  *   *Recovery:* As facilitator, you are the "Sergeant at Arms." Calmly say: "Round 3 Rules: Silent Legislature. That proposal is out of order." Be stern. The frustration is pedagogical.

  **3. Round 3 Finishes Too Fast**
  *   *Risk:* Without debate, they just hand cards in quickly.
  *   *Recovery:* Add a "Review Period." Secretariat must read drafts aloud. Legislators can reject drafts, sending them back to the queue (increasing Secretariat workload).

  ---

  ### 7. Limitations (What You Must Assert)
  The game cannot simulate the following; you must state this explicitly in the debrief so they don't over-generalize:
  1.  **Descriptive Representation:** In the game, the "Sortition" group is just the same 14 students. Real sortition changes *who* is in the room (class, race, expertise). The game simulates the *incentive*, not the *demographics*.
  2.  **Deliberation Time:** Real citizen assemblies meet for weeks. This was 15 minutes. The "inexperience" penalty in Round 3 is exaggerated because they had no time to learn.
  3.  **External Lobbying:** The Secretariat acted as a bureaucracy, but in reality, lobbyists would fill the vacuum left by transient legislators. The Migration Thesis applies even more strongly externally than internally.

  ### 8. Why This Works for Your Objectives
  *   **Migration Thesis:** The mechanic (Silent Legislature in Round 3) forces the knowledge transfer to the Secretariat visibly.
  *   **Unbundling:** Round 2 (Term Limits) isolates the "Accountability" variable from the "Selection" variable, allowing you to show that Term Limits create Lame Ducks, not necessarily better representatives.
  *   **Feasibility:** No tech, minimal props, fits 17 students perfectly (3 staff, 14 assembly is a realistic ratio for a small committee).
