answer: |-
  ### Advisory Agenda: The Distributed Lamp Working Group

  **To:** Interdisciplinary Working Group (Metaphysics, Philosophy of Physics, Formal Logic)
  **From:** Research Advisor
  **Subject:** Priority Agenda for Conceptual Research on the Distributed Lamp

  The "Distributed Lamp" variant offers a novel vector for supertask research by shifting the locus of paradox from a singular temporal limit to a spatial-continuous field. However, this shift risks obscuring the original logical contradiction under layers of measure-theoretic complexity. To maximize the utility of your two-year term, you must avoid the trap of "modeling without ontology." You cannot determine what the lamp *does* (physics/decision theory) until you determine what the lamp *is* (logic/metaphysics).

  Below is the defended priority agenda. The ranking is governed by three explicit criteria:
  1.  **Logical Precedence:** Can Question B be meaningfully formulated if Question A remains unresolved?
  2.  **Risk Mitigation:** Which inquiry is most likely to reveal the research object as incoherent, thereby saving resources?
  3.  **Team Leverage:** Does the task utilize the specific triad of expertise (Logic, Metaphysics, Physics) without drifting into empirical science?

  ---

  ### Priority 1: The Measure-Theoretic Coherence of the Limit Field
  **Lead:** Formal Logician (with Metaphysician)
  **Focus:** Determining whether the function describing the lamp's state at $t=1$ is mathematically well-defined.

  *   **(a) Upstream Impact:** This is the foundational constraint for the *logic of infinite action*. If the limit state of the distributed lamp is not well-defined even within standard or non-standard analysis (e.g., if the resulting field is non-measurable or everywhere discontinuous), then the "Distributed Lamp" is a category error rather than a paradox. Resolving this determines whether subsequent metaphysical debates are about *indeterminacy* (a feature of the world) or *ill-definedness* (a feature of the description). It prevents the group from building metaphysical theories on mathematical nonsense.
  *   **(b) Tractability:** High. This requires no new physics, only rigorous application of real analysis, measure theory, or Non-Standard Analysis (NSA). The Logician can formalize the "infinitesimal scaled toggle" to see if the sequence converges pointwise, uniformly, or in measure.
  *   **(c) Reordering Trigger:** If the Logician demonstrates within the first six months that the limit field is trivially undefined (e.g., analogous to the Dirichlet function) under all standard interpretations, **Priority 2 and 3 must swap.** The project then shifts from "What is the state?" to "Why does continuous composition fail?" making the Metaphysical analysis of failure modes the primary output.

  ### Priority 2: Mereological Supervenience and the "Dissolution" Claim
  **Lead:** Metaphysician (with Logician)
  **Focus:** Assessing whether the global state of the field supervenes on the local histories of the continuum points.

  *   **(a) Upstream Impact:** This addresses the core claim of the Distributed Lamp proponents: that distributing the toggle "dissolves" the contradiction. If the global field state is determinate while local points are indeterminate, this violates standard principles of *mereological supervenience*. Resolving this impacts the *metaphysics of continuity* and composition: can a whole possess a property that no part possesses (or determines) in the context of infinite division? This also gates *decision theory*: an agent cannot place a rational bet on a global state that does not supervene on the physical facts of the components.
  *   **(b) Tractability:** Medium. This is conceptual work supported by the formal results of Priority 1. It requires analyzing existing literature on vagueness, composition, and supervaluationism, applying them to the continuous case. It avoids empirical physics by treating the "devices" as abstract ontological units.
  *   **(c) Reordering Trigger:** If Priority 1 confirms mathematical coherence, but early metaphysical analysis suggests that *local* indeterminacy necessarily entails *global* indeterminacy (collapsing the "dissolution" claim), **Priority 3 becomes secondary.** The group should then focus on classifying the *type* of indeterminacy (semantic vs. ontic) rather than physical realizability, as the paradox would replicate the classic Thomson result.

  ### Priority 3: Causal Closure and Conservation in Continuum Limits
  **Lead:** Philosopher of Physics (with Metaphysician)
  **Focus:** Evaluating whether the causal history of a continuum of supertasks violates conservation laws or causal closure.

  *   **(a) Upstream Impact:** This connects the thought experiment to *physicalism*. Even if the lamp is logically coherent (P1) and metaphysically supervenient (P2), it may be physically impossible due to energy constraints or causal discontinuity. Resolving this determines if the Distributed Lamp is a tool for understanding *logical* possibility or *physical* possibility. It informs debates on determinism in classical field theories where infinite degrees of freedom exist.
  *   **(b) Tractability:** Medium-Low. This requires careful handling to avoid becoming a physics project. The Philosopher of Physics must rely on conceptual analysis of existing principles (e.g., Noether's theorems, energy conditions in classical fields) rather than deriving new equations. The constraint is to treat physics principles as modal constraints, not empirical data.
  *   **(c) Reordering Trigger:** If P1 and P2 establish the scenario as logically and metaphysically sound, but a clear violation of conservation of energy is identified in the limit (e.g., infinite energy density required for the continuum toggle), **the project concludes early.** The result is a "Physical Impossibility Proof," rendering further decision-theoretic or causal analysis moot.

  ---

  ### Trade-offs and Strategic Risks

  **The Logic-Metaphysics Trade-off:**
  Prioritizing P1 (Logic) risks alienating the Metaphysician if the formalism becomes too technical. *Mitigation:* The Logician must translate convergence results into ontological categories (e.g., "existence" vs. "definition") immediately.
  **The Physics-Conceptual Trade-off:**
  Prioritizing P3 (Physics) risks drifting into empirical speculation. *Mitigation:* The Philosopher of Physics is restricted to *principles* (conservation, causality), not *mechanisms* (circuits, quantum states).

  **Why This Order?**
  This order follows a "Funnel of Possibility."
  1.  **Logic:** Is it thinkable? (If no, stop).
  2.  **Metaphysics:** Is it describable as a world? (If no, stop).
  3.  **Physics:** Is it realizable in our world? (If no, stop).
  Reversing this order risks spending months on the causal implications of an object that is mathematically incoherent.

  ### What to Leave for Later (and Why)

  1.  **Decision-Theoretic Modeling:**
      *   *Why:* Betting strategies or rational choice models regarding the lamp's state are downstream of P2. If the global state does not supervene on local facts (P2), standard decision theory collapses. Building models before resolving supervenience is premature optimization.
      *   *When:* Only if P1 and P2 yield a stable ontological model in Year 1.

  2.  **Historical Exegesis of Thomson:**
      *   *Why:* The Distributed Lamp is a *variant* that fundamentally changes the topology of the problem. Arguing about Thomson's original intent is irrelevant to the coherence of this new framing.
      *   *When:* Only for the introduction of final papers to contextualize the novelty.

  3.  **Quantum Mechanical Implementations:**
      *   *Why:* This introduces empirical contingencies (uncertainty principles, discrete spacetime) that muddy the *conceptual* clarity of the continuum supertask. The group is tasked with conceptual research, not quantum engineering.
      *   *When:* Leave for a follow-up grant with a quantum physicist.

  ### Final Recommendation
  Commit the first six months almost exclusively to **Priority 1**. The "Distributed Lamp" stands or falls on whether the limit field can be defined without contradiction. If the Logician cannot produce a coherent formal model of the "infinitesimal scaled toggle," the Metaphysician and Philosopher of Physics have no object to analyze. A negative result here is still a high-impact publication (demonstrating the impossibility of continuous supertasks), whereas a positive result opens the door for the subsequent metaphysical and physical analysis.
