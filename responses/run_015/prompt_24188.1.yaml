answer: |-
  Here is the 15-Minute Inference Filter. It is designed to be run on a notepad while the clock is ticking. It does not guarantee truth; it guarantees you have stress-tested the story against the most common failure points.

  ### The 15-Minute Inference Filter

  **Minute 0-3: The Source & Motivation Scan**
  1.  **Is the source direct or recycled?**
      *   *Good:* "I saw the email," "I was in the room."
      *   *Bad:* "Sarah told me," "Everyone is saying."
      *   *Stop:* If 100% of the claim is recycled rumor, **KILL STORY**.
  2.  **Who benefits if this explanation is true?**
      *   List the main parties. If one party gains status, money, or safety *only* if their version is believed, mark their testimony as "High Risk."
      *   *Note:* High Risk does not mean "Lie." It means "Verify independently."

  **Minute 3-7: The Explanation Stress Test (IBE Core)**
  3.  **Does the explanation cover *all* the known facts, or just the convenient ones?**
      *   *The Trap:* A simple story often ignores awkward details (e.g., "Trip cancelled due to rain" ignores that it wasn't raining at the destination).
      *   *Pass:* The explanation accounts for the awkward details without needing new assumptions.
      *   *Fail:* You have to add "Well, except for this one thing..." to make it work.
  4.  **Is the simplicity suspicious?**
      *   *The Trap:* Real life is messy. If a story is perfectly clean, ask: "What is being cut out to make this clean?"
      *   *Pass:* The story admits some confusion or complexity.
      *   *Fail:* The story is *too* coherent for a chaotic event. **FLAG FOR ADVISOR.**
  5.  **Does this rely on a conspiracy or incompetence?**
      *   *Rule:* Incompetence is more common than conspiracy.
      *   *Pass:* "The admin forgot to file the form."
      *   *Fail:* "The admin planned to lie to everyone." (Requires much higher evidence bar).

  **Minute 7-10: The Bias Interrupter**
  6.  **If the *opposite* were true, would I accept this evidence?**
      *   If the accused was your friend, would you demand more proof? If yes, you are biased.
      *   *Action:* Swap the names in your head. Does the logic still hold?
  7.  **Am I printing this because it's true, or because it's interesting?**
      *   *Hard Truth:* If the story is explosive but the evidence is weak, you are chasing clicks, not truth.
      *   *Stop:* If the answer is "interesting," **KILL STORY**.

  **Minute 10-15: The Decision Matrix**
  *   **Green Light:** Direct sources + Covers all facts + No personal bias + Evidence > "He said." -> **PRINT (with attribution).**
  *   **Yellow Light:** Conflicting direct sources + High stakes (admin/teachers) + Evidence is circumstantial. -> **ASK ADVISOR.** (Do not skip this).
  *   **Red Light:** Recycled sources + Suspicious simplicity + High bias risk. -> **KILL STORY.**

  ***

  ### Where This Procedure Will Misfire On You

  You asked for honesty about the flaws. Here is where this filter breaks:

  1.  **The "Best" Isn't "True":** Inference to the Best Explanation selects the *most robust* story available, not the *actual* truth. If everyone lies to you perfectly, this procedure will validate the lie because it fits the facts you *have*. It cannot detect a coordinated cover-up where all physical evidence is destroyed.
  2.  **Incommensurable Virtues:** You noted that simplicity and scope don't add up. This procedure doesn't fix that. It forces you to choose. Sometimes you must sacrifice Simplicity to keep Scope (accepting a messy story because it fits more facts). The procedure forces a binary choice where reality is a spectrum.
  3.  **The Time Limit:** 15 minutes is not enough for deep verification. This filter prevents *egregious* errors, not subtle ones. It is a shield, not a sword.
  4.  **Confirmation Bias:** Step 6 helps, but it won't cure you. If you *want* the principal to be the villain, you will subconsciously rate the "Budget" explanation higher in Minute 3. The only fix is Step 6, and you might lie to yourself there.

  ***

  ### Case Run-Throughs

  Here is the procedure applied to your two cases. I am committing to the conclusion.

  #### Case 1: The Spring Field Trip (Weather vs. Budget)
  *   **Facts:** Admin says Weather. Coach says Budget. Students saw Principal text about "costs."
  *   **Minute 0-3 (Source/Motive):**
      *   Admin: Official, motive = protect reputation/safety liability.
      *   Coach: Insider, motive = frustration with admin/budget transparency.
      *   Students: Direct observation of text, motive = none/drama.
      *   *Risk:* Admin testimony is "High Risk" for reputation management.
  *   **Minute 3-7 (Stress Test):**
      *   *Coverage:* "Weather" explains cancellation, but fails if weather reports were clear. "Budget" explains cancellation and explains why other trips with similar weather went ahead (assuming they did).
      *   *Simplicity:* "Weather" is simpler. "Budget" is complex.
      *   *Suspicion:* Is "Weather" too clean? Yes, if meteorological data contradicts it.
      *   *Conspiracy:* Claiming Admin *lied* about weather to hide budget is a conspiracy claim. However, the text message moves this from "Conspiracy" to "Deception."
  *   **Minute 7-10 (Bias):**
      *   Do I want the Admin to be liars? Probably. It's a better story.
      *   If I swap names: If a student lied about weather to hide a budget issue, would I believe the text? Yes.
  *   **Minute 15 (Decision):**
      *   The "Budget" explanation has greater **Scope**. It explains the text message *and* the cancellation. The "Weather" explanation requires us to assume the students hallucinated the text or the text was about something else entirely.
      *   **Conclusion:** The Budget explanation is the *Best Explanation*.
      *   **Print Decision:** **YELLOW LIGHT / ASK ADVISOR.**
      *   **Why:** Even though the procedure says "Budget" is the truth, accusing the Principal of deception based on a student's screenshot of a text is a legal and disciplinary minefield. The procedure identifies the likely truth, but the risk profile forces an escalation.
      *   **The Unwanted Outcome:** You have to go to the Advisor and tell them, "I think the Principal lied." You cannot print "Trip Cancelled Due to Weather" without feeling like you are publishing a lie.

  #### Case 2: The Lab Report (Cheating vs. Sick)
  *   **Facts:** Accuser (Friend/Study Group) says copying. Accused says Home Sick. Accuser acting "weird."
  *   **Minute 0-3 (Source/Motive):**
      *   Accuser: Proximity to work, but "acting weird" suggests emotional volatility or guilt. Motive could be grade protection or interpersonal drama.
      *   Accused: Alibi (Home). Hard to verify.
      *   *Risk:* Accuser is "High Risk" due to behavioral changes.
  *   **Minute 3-7 (Stress Test):**
      *   *Coverage:* "Cheating" explains the similarity in reports. "Sick" explains absence but not report similarity.
      *   *Simplicity:* "Cheating" is simple. "Friendship drama leading to false accusation" is complex.
      *   *Suspicion:* Is "Cheating" too clean? Yes. It ignores the "weird behavior" of the accuser.
      *   *Conspiracy:* False accusation requires intent.
  *   **Minute 7-10 (Bias):**
      *   Do I want a cheating scandal? It sells papers.
      *   If I swap names: If my friend was accused, would I demand digital forensics? Yes.
      *   *Crucial Check:* Do I have the actual reports to compare? No. I only have the accusation.
  *   **Minute 15 (Decision):**
      *   The "Cheating" explanation relies entirely on the Accuser's word, which is currently compromised by "weird behavior." The "Sick" explanation is unverifiable but standard.
      *   **Conclusion:** The evidence is insufficient to infer cheating. The "Best Explanation" for the *conflict* is interpersonal drama, not academic dishonesty.
      *   **Print Decision:** **RED LIGHT / KILL STORY.**
      *   **Why:** You cannot print an accusation of cheating without proof of the act (the reports) and verification of the accuser's credibility. The procedure flags the Accuser as unreliable.
      *   **The Unwanted Outcome:** You have to kill a juicy story about a senior cheating. You will look like you are protecting the senior, but the procedure dictates you have no grounds to print.

  ***

  ### What This Procedure Can't Do For You

  1.  **It Can't Give You Courage:** In Case 1, the procedure tells you the Admin likely misled you. It cannot give you the backbone to tell your Advisor you want to pursue that angle despite the pressure. It identifies the fire; it doesn't give you the water.
  2.  **It Can't Verify Physical Evidence:** In Case 2, the procedure highlights that you don't have the lab reports. It cannot magically get them for you. It stops you from guessing, which means you end up with *no story* instead of a *wrong story*.
  3.  **It Can't Resolve Moral Ties:** Sometimes the "Best Explanation" is that two people are partially right and partially wrong. This procedure forces a binary (Print/Kill/Ask). It will flatten nuance. You will lose the gray areas, and sometimes the gray area is the truth.
  4.  **It Can't Save You from Being Wrong:** If the students in Case 1 faked the text message screenshot, this procedure fails. It assumes your inputs are honest. Garbage in, garbage out.

  Use this to keep your hands clean, not to make you a hero. Your job is not to fix the school; it's to not lie to it.
