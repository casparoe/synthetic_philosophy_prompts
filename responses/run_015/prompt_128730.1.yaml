answer: |-
  # Desiderata for a Theory of Slurs: Specification Before Verdict

  ## 1. The Dual Mandate and Theoretical Viability

  You have assigned two distinct jobs to the theory:
  *   **(a) Predictive:** Identify slurs, targets, and offensiveness scales across languages (Type-level).
  *   **(b) Normative:** Explain wrongness, contextual permissibility, and appropriate response (Token-level).

  **Preliminary Verdict:** No single monolithic theory can satisfactorily perform both jobs without fragmentation. The Predictive Job requires semantic stability (the word must carry the same content to be identified across contexts); the Normative Job requires pragmatic fluidity (the word's moral status changes based on speaker identity and power dynamics).

  **Recommendation:** Do not attempt a unified "Meaning of Slurs" theory. Instead, pursue a **Dual-Component Framework**:
  1.  **A Semantic/Pragmatic Account** (Job A): Explains identification, embedding, and reference.
  2.  **A Normative/Ethical Account** (Job B): Explains harm, prohibition, and reclamation.
  *If forced to choose:* Give up the **Predictive Job** as a semantic project. A theory stripped of prediction should look like a **Normative Pragmatics of Harm**, focusing not on "what the word means" but on "what the act does." It would treat the lexical item as a tool whose moral valence is entirely determined by social context, abandoning the search for a stable "slur content."

  ---

  ## 2. The Desiderata List

  The following requirements are derived from your ten cases. Each is marked **NN** (Non-Negotiable: empirical or logical necessity) or **PI** (Program-Internal: specific to a research tradition, e.g., formal semantics).

  ### I. Semantic and Lexical Stability (The Predictive Core)
  *   **D1. Etymological Independence.** The theory must distinguish between a word's historical origin and its current semantic status. A word ceases to be a slur when the derogatory content is no longer cognitively active or socially recognized, even if philology confirms its origin.
      *   *Motivation:* Case 1 (Dead slurs).
      *   *Status:* **NN** (Sociolinguistic fact).
  *   **D2. Generative Productivity.** The theory must explain how novel expressions function as slurs without prior lexicalization. It cannot rely on a fixed dictionary of forbidden terms.
      *   *Motivation:* Case 2 (Novel coinage/mocking accent).
      *   *Status:* **NN**.
  *   **D3. Cross-Cultural Portability.** The theory must account for divergence in status when a term moves between linguistic communities. The "slur-ness" cannot be intrinsic to the phonemes alone.
      *   *Motivation:* Case 3 (Borrowing/In-group affection vs. Out-group offense).
      *   *Status:* **NN**.
  *   **D4. Reference Without Neutrality.** The theory must allow a slur to successfully refer to a group even if no neutral counterpart exists or is available in that context.
      *   *Motivation:* Case 4 (Lexical gaps).
      *   *Status:* **NN**.
  *   **D5. False Taxonomy Handling.** The theory must account for slurs that presuppose false biological or social taxonomies without rendering the utterance simply "false."
      *   *Motivation:* Case 5 (Scientific rejection of target category).
      *   *Status:* **NN**.

  ### II. Logical and Structural Behavior (The Embedding Core)
  *   **D6. Projection of Offense.** The theory must explain why derogatory force survives (or attenuates) under negation, conditionals, questions, and attitude reports. The offense must not be tied solely to assertion.
      *   *Motivation:* Case 6 (Embedding contexts).
      *   *Status:* **NN** (Linguistic datum).
  *   **D7. Type/Token Distinction.** The theory must distinguish between the lexical entry (Type) and the specific utterance event (Token). A theory that collapses these cannot handle reclamation.
      *   *Motivation:* Case 7 (In-group reclamation).
      *   *Status:* **NN**.

  ### III. Normative and Dynamic Flexibility (The Ethical Core)
  *   **D8. Speaker-Relative Normativity.** The theory must permit the same lexical item to be morally permissible for Speaker A (in-group) and impermissible for Speaker B (out-group), without positing lexical ambiguity.
      *   *Motivation:* Case 7 (Reclamation/Endearment).
      *   *Status:* **NN**.
  *   **D9. Diachronic Drift.** The theory must account for semantic change where slurs become general insults, or neutral terms become slurs (euphemism treadmill).
      *   *Motivation:* Case 8 (Successor terms/Drift).
      *   *Status:* **NN**.
  *   **D10. Non-Lexical Derogation.** The theory must not be lexically bound; it must accommodate prosody, gesture, or pronoun misuse as functionally equivalent to lexical slurs in terms of harm/wrongness.
      *   *Motivation:* Case 9 (Prosody/Gesture).
      *   *Status:* **PI** (Required if the goal is a theory of *derogation* rather than *slurs* specifically).
  *   **D11. Target Generalizability.** The theory must apply to dominant groups, voluntary associations, and occupational categories, not just oppressed ethnic minorities.
      *   *Motivation:* Case 10 (Non-ethnic/Dominant targets).
      *   *Status:* **PI** (Required for a general theory of pejoratives).

  ### IV. Conceptual Distinctions to Respect
  The theory must not collapse the following distinctions:
  1.  **Slur vs. Pejorative vs. Profanity:** Slurs target groups; pejoratives target individuals/traits; profanity violates sanctity/taboo without necessarily targeting a group.
  2.  **Targeting vs. Referring vs. Predicating:** One can refer to a group using a slur without predicating the slur's content of them (e.g., "He was called a [slur]").
  3.  **Content vs. Force vs. Uptake:** What the word means vs. what it does vs. how it is received.
  4.  **Harm vs. Wrongness:** An utterance can be wrong without causing measurable psychological harm (e.g., intercepted by a third party), and harmful without being morally wrong (e.g., accidental usage with immediate repair).
  5.  **Norm Against Use vs. Difference in Meaning:** Is the prohibition external (a rule of politics) or internal (part of the semantics)?
  6.  **Binary vs. Graded Offense:** The theory must allow for scales of offensiveness, not just a binary slur/non-slur switch.

  ### V. Sociolinguistic Constraints
  *   **SC1. Variation is Data, Not Noise:** The theory cannot treat intra-group variation (e.g., some group members hate the reclaimed term, others love it) as performance error.
  *   **SC2. Power Asymmetry:** The theory must acknowledge that the "weight" of a slur is often a function of historical power dynamics, not just semantic content.

  ---

  ## 3. The Incompatibility Report

  **Flagged Incompatibility:** **D6 (Projection of Offense)** and **D8 (Speaker-Relative Normativity)** are in direct tension.

  *   **The Conflict:**
      *   **D6** suggests the derogatory content is *semantic* (part of the meaning), because it projects through logical operators like negation (e.g., "He is not a [slur]" still invokes the slur). Semantic content is typically stable across speakers.
      *   **D8** suggests the derogatory force is *pragmatic/normative* (dependent on speaker identity), because the same word is permissible for in-group members. Pragmatic permissions usually do not project through negation in the same way (e.g., "I promise I won't lie" vs. "He promised he won't lie").
  *   **The Consequence:** A theory that secures D6 (by making derogation semantic) typically fails D8 (cannot explain why in-group use is okay without positing ambiguity). A theory that secures D8 (by making derogation a norm of use) typically fails D6 (cannot explain why "If he is a [slur]..." is offensive).

  **The Single Most Exclusionary Requirement:**
  **D8 (Speaker-Relative Normativity).**
  *   *Reasoning:* Most existing theories (Truth-Conditional, Expressive, Implicature) locate the "slur-ness" in the lexical entry or the conventional meaning. D8 demands that the moral status of the token is determined by social relations external to the lexicon. This excludes almost all pure semantic theories and forces a shift toward normative pragmatics. It is the hardest constraint for formal philosophy of language to satisfy because it requires importing sociological variables into the semantic calculus.

  ---

  ## 4. Scoring the Standard Families

  | Desideratum | Truth-Conditional (Content) | Conventional Implicature (Expressive) | Pragmatic (Inferential) | Prohibitive (Taboo/Use) |
  | :--- | :---: | :---: | :---: | :---: |
  | **D1. Etymological Independence** | ✅ | ✅ | ✅ | ❌ (Often treats taboo as historical) |
  | **D2. Generative Productivity** | ❌ (Requires lexicon) | ⚠️ (Limited) | ✅ (Rules of inference) | ❌ (Requires list of taboos) |
  | **D3. Cross-Cultural Divergence** | ❌ (Meaning is stable) | ⚠️ (Hard to vary) | ✅ (Context dependent) | ✅ (Norms vary) |
  | **D4. Reference Without Neutrality** | ✅ | ✅ | ✅ | ⚠️ (Focuses on prohibition) |
  | **D5. False Taxonomy** | ⚠️ (Makes sentences false) | ✅ (Expressive doesn't truth-eval) | ✅ | ✅ |
  | **D6. Projection (Embedding)** | ✅ | ✅ | ❌ (Cancels under negation) | ❌ (Use-prohibition doesn't project) |
  | **D7. Type/Token Distinction** | ❌ (Collapses them) | ❌ (Lexical focus) | ✅ | ✅ |
  | **D8. Speaker-Relative Normativity** | ❌ (Fails Reclamation) | ❌ (Fails Reclamation) | ✅ | ✅ |
  | **D9. Diachronic Drift** | ⚠️ (Slow to update) | ⚠️ | ✅ | ✅ |
  | **Predictive Job (A)** | **High** | **High** | **Low** | **Low** |
  | **Normative Job (B)** | **Low** | **Medium** | **High** | **High** |

  *Legend: ✅ Satisfies well, ⚠️ Partial/Strained, ❌ Fails.*

  ---

  ## 5. Settling Observations

  To resolve the two primary disagreements (Semantic Content vs. Pragmatic Force; and Fixed Meaning vs. Reclamation), the following empirical findings would be decisive:

  1.  **The Negation Neuro-Imaging Test:**
      *   *Observation:* Measure brain activity (fMRI/ERP) when processing a slur under negation ("He is not a [slur]") vs. a neutral term under negation.
      *   *Settles:* If the amygdala/emotional centers light up equally for the negated slur as the asserted slur, **D6** is confirmed as semantic/automatic, damaging pure Pragmatic theories. If activity attenuates significantly under negation, Pragmatic theories gain ground.

  2.  **The Acquisition Order Study:**
      *   *Observation:* Longitudinal study of children in a community with a reclaimed slur. Do they acquire the *reference* of the term before the *normative restriction* (who can say it)?
      *   *Settles:* If children learn the restriction (Speaker-Relative Normativity) simultaneously with the word, it suggests the norm is part of the lexical entry (supporting Semantic/CI views). If they learn the word first and the restriction later via social correction, it supports the **Prohibitive/Pragmatic** view (D8).

  **Final Advisory:** Your paper should argue that the literature's reliance on single cases stems from the impossibility of satisfying **D6** and **D8** simultaneously within a single logical framework. The field requires a bifurcation: a semantics of *derogatory content* and a pragmatics of *derogatory use*.
