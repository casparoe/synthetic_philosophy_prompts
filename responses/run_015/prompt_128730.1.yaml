      *   **The Desiderata List:** Group them logically (Semantic, Pragmatic, Normative, Diachronic). Map the 10 cases to these. Mark as Non-Negotiable (NN) or Program-Internal (PI).
      *   **Required Distinctions:** List the conceptual boundaries.
      *   **The Incompatibility Report:** This is crucial. Highlight the tension between Embedding (semantics) and Reclamation/Context (pragmatics).
      *   **The Most Exclusionary Requirement:** Identify "Projection under Embedding" (Case 6) as the hardest hurdle for pragmatic theories, or "Speaker-Relative Normativity" (Case 7) for semantic theories. Let's pick *Token-Level Normative Variability* as the hardest for semantic theories, and *Projection* as the hardest for pragmatic theories. Actually, the prompt asks for *the single requirement that excludes the largest share*. That is likely **Case 6 (Embedding/Projection)** because it kills pure pragmatic accounts, and **Case 7 (Reclamation)** kills pure semantic accounts. I need to choose the one that kills *most* candidates. Most candidates are semantic or hybrid. Case 7 (Reclamation) is often the dealbreaker for rigid semantic theories. However, Case 6 is the dealbreaker for pure pragmatics. Let's argue that the *combination* is the issue, but if forced to pick one, it's the **Token-Level Normative Variability (Case 7)** because it directly contradicts the idea of fixed semantic content which most theories rely on for prediction. Wait, actually, the *Embedding* problem is the classic philosophical hurdle. I will argue that **Case 6 (Projection)** is the most exclusionary for pragmatic theories, but **Case 7 (Reclamation)** is the most exclusionary for semantic theories. I need to pick one that excludes the *largest share*. Many theories try to be semantic. So Case 7 excludes more.
      *   **The Table:** Score the 4 families against key desiderata.
      *   **Settling Observations:** What empirical data would resolve the big debates? (Neuroimaging of processing? Cross-cultural psycholinguistics?)

  8.  **Review against Constraints:**
      *   Did I cover all 10 cases? Yes, map them explicitly.
      *   Did I address Predictive vs. Normative? Yes.
      *   Did I flag incompatibilities? Yes.
