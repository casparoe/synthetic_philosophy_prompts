      *   Tone check: Ensure it sounds like a rigorous philosophical specification.

  9.  **Refining the "Verdict":**
      *   The prompt asks: "If no single theory can do both, say so, tell me which job to give up, and what a theory stripped of the other job should look like."
      *   *My stance:* A unified theory is likely impossible without becoming trivial. The Predictive Job (Semantics) and Normative Job (Ethics/Pragmatics) pull in opposite directions.
      *   *Recommendation:* Split the project. A Semantic Theory of Slurs (focus on embedding, truth conditions) and a Normative Theory of Slur-Use (focus on harm, power, reclamation). Trying to do both in one "meaning" theory leads to category errors.

  10. **Final Polish:** Check the distinctions list. Ensure "Type vs Token" is highlighted. Ensure Sociolinguistic constraints are noted (e.g., variation is real, not noise).

  *(Self-Correction during drafting)*: I need to be careful with the "Non-Negotiable" vs "Preference" marking. Some things are logically required (non-contradiction), others are theoretical preferences (e.g., truth-conditionalism). I will mark empirical adequacy as Non-Negotiable.

