      *   **Tone:** Academic, precise, philosophical, structured.

  2.  **Deconstruct the Dual Purpose (Predictive vs. Normative):**
      *   *Predictive:* Requires semantic stability, cross-linguistic applicability, and gradability.
      *   *Normative:* Requires sensitivity to context, speaker identity, power dynamics, and ethical evaluation.
      *   *Tension:* A purely semantic theory struggles with context-dependent normativity (e.g., reclamation). A purely pragmatic/normative theory struggles with predictive stability (e.g., embedding).
      *   *Decision:* I need to articulate whether one theory *can* do both. Most literature suggests a hybrid is needed, but strict semantic theories fail the normative nuance, and strict pragmatic theories fail the embedding data. I will frame the desiderata such that the tension is explicit.

  3.  **Drafting the Desiderata (incorporating the 10 cases):**
      *   *Case 1 (Etymological Decay):* Requires distinction between historical origin and current semantic content/usage. (Type-level fact).
      *   *Case 2 (Novel Coinage):* Requires generative capacity. It's not just a list of bad words; it's a mechanism of derogation. (Productivity).
      *   *Case 3 (Cross-Cultural Borrowing):* Requires sensitivity to community norms and uptake. Meaning isn't just in the head or the word; it's in the social fabric. (Context sensitivity).
      *   *Case 4 (No Neutral Counterpart):* Requires handling of "lexical gaps." The theory can't rely solely on contrast with a neutral term. (Reference without neutral alternative).
      *   *Case 5 (Misapplication/False Taxonomy):* Requires handling of false presuppositions or content that doesn't match reality. (Truth-conditions vs. Expressive content).
      *   *Case 6 (Embedding):* The "Frege-Geach" problem for slurs. Offense persists under negation/questions. (Projection problem).
      *   *Case 7 (Reclamation/In-group):* Requires speaker-relative norms. Same word, different moral status based on identity. (Token-level variation).
      *   *Case 8 (Semantic Drift):* Requires diachronic flexibility. Slurs become general insults; neutral terms become slurs. (Dynamic semantics).
      *   *Case 9 (Non-lexical):* Requires broadening beyond lexicon to prosody/gesture. (Multimodal derogation).
      *   *Case 10 (Non-ethnic/Dominant Groups):* Requires generalizability beyond minority oppression. (Scope of application).

