  *Concede:* It lacks instrumental utility or market value.
  *Reply:* That is precisely Moore's point. Intrinsic value defies economic reduction.
  *Weakness:* Sounds elitist amidst material precarity; ignores the labour conditions of restoration.

  **The Reply That Must Land**
  You must successfully argue that while institutions *frame* access to beauty, they do not *constitute* its value. If value is merely institutional, Moore is dead. If value is relational but real, he survives. This distinction is your only shield against constructivism. You must demonstrate that 'affective fundamentality' is a structural claim about how we value, not a claim about what exists independently of us.

