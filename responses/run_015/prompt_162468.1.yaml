answer: |-
  Your working principle is essentially a **Kripkean theory of truth** (specifically, a minimal fixed-point construction using Strong Kleene logic). It is a robust framework that aligns with most of your intuitions, but it hits a well-known wall with Case 6 and your new cases.

  Here is the audit of your principle against your list, the repair required, and the honest cost you have to pay.

  ### 1. The Scorecard: Does the principle deliver?

  Your principle: *A sentence gets a truth value iff evaluating it bottoms out in non-semantic facts; 'not true' applied to a gap yields a gap.*

  *   **Case 1 (Liar):** 'This sentence is not true.'
      *   **Evaluation:** Loops. No non-semantic ground.
      *   **Principle Verdict:** Gappy.
      *   **Your Verdict:** Neither.
      *   **Result:** **Match.** The clause "'not true' said of a gappy sentence isn't true" prevents the Liar from flipping to True.
  *   **Case 2 (Truthteller):** 'This sentence is true.'
      *   **Evaluation:** Loops. No non-semantic ground (it only references itself).
      *   **Principle Verdict:** Gappy.
      *   **Your Verdict:** Neither.
      *   **Result:** **Match.** Many theories make this True, but your "grounding" clause correctly identifies it as unmoored.
  *   **Case 3 (Disjunction):** 'Either this sentence is not true, or snow is white.'
      *   **Evaluation:** The second disjunct ('snow is white') is a non-semantic fact (True). In Strong Kleene logic, (Gap $\lor$ True) = True. The evaluation "bottoms out" because the truth of the sentence is secured by the world, regardless of the self-reference.
      *   **Principle Verdict:** True.
      *   **Your Verdict:** True.
      *   **Result:** **Match.** This is the strongest point of your principle. It distinguishes "vicious" self-reference (1) from "innocuous" self-reference (3).
  *   **Case 4 (Cycle):** Alice/Bob.
      *   **Evaluation:** Circular, no external ground.
      *   **Principle Verdict:** Gappy.
      *   **Your Verdict:** Neither.
      *   **Result:** **Match.**
  *   **Case 5 (Contingent):** 'Card... is not true' (Card: 'Snow is white').
      *   **Evaluation:** Card content is True. So 'Card is not true' is False. Grounded in the card + world.
      *   **Principle Verdict:** False.
      *   **Your Verdict:** False.
      *   **Result:** **Match.**
  *   **Case 6 (Strengthened Liar):** 'This sentence is either false or neither true nor false.'
      *   **Evaluation:** If the sentence is Gappy, then the description "false or neither" accurately describes it. So the content is correct. So it should be True. But if it's True, it's not Gappy.
      *   **Principle Verdict:** **Contradiction.**
      *   **Your Verdict:** Neither.
      *   **Result:** **Fail.** This is the "Revenge Liar." Your principle cannot classify this as Gappy without making it True.
  *   **Case 7 (Probabilistic):** 'It is more likely than not that this sentence is not true.'
      *   **Evaluation:** If Gappy, it is "not true." If it is a fact that it is Gappy, the probability is 1. So the sentence is True. If True, it is not "not true." Probability 0. Sentence False.
      *   **Principle Verdict:** **Contradiction** (unless probability claims about truth values are also treated as ungrounded).
      *   **Your Verdict:** True (initially).
      *   **Result:** **Fail.** Your gut here is likely unstable. To save the principle, this must be Gappy, but then the probability claim becomes problematic.

  ### 2. The Hard Question: Can you hold 1 and 6 together without hierarchy?

  **Honest Answer:** No, not if you want to *say* that 6 is gappy within the same language.

  Case 6 is a "Revenge" problem. It exploits the fact that your theory uses a third value (Gap) to solve Case 1, but then Case 6 simply predicates that third value of itself.
  *   If you say 6 is Gappy, you are effectively saying 6 is True (because it correctly describes its status).
  *   If you say 6 is True, you are saying it is not Gappy.

  To avoid a hierarchy (Tarski), you must adopt a **Paracomplete Logic** (like Hartry Field's). This involves rejecting the Law of Excluded Middle for truth predicates. You would have to say that for Case 6, it is *neither* true *nor* false *nor* gappy in a way that can be consistently asserted.

  However, there is a simpler cost. You must drop the intuition that **the language can express its own gap status.**

  ### 3. The New Cases

  *   **New Case A:** 'This sentence has no truth value.'
      *   This is identical to Case 6. If your theory says it has no truth value, the sentence is accurate, hence true.
      *   **Verdict:** Your principle forces this to be Gappy, but acknowledging that forces a contradiction.
  *   **New Case B:** 'This sentence never gets a value at any stage of the evaluation.'
      *   This refers to the Kripkean construction stages. If the sentence is Gappy, it indeed never gets a value. So the sentence is True.
      *   **Verdict:** Same as A. It shows that "groundedness" cannot be fully defined within the grounded language.

  ### 4. The Repair and The Cost

  To make your principle tidy, you must refine the "bottoms out" clause and accept a specific limitation.

  **Revised Principle:**
  > A sentence gets a truth value iff it is grounded in non-semantic facts. Sentences that are not grounded are **gappy**. However, the predicate "is gappy" cannot be consistently defined within the object language without generating new paradoxes.

  **Which verdicts must you drop?**
  1.  **Case 6 (and New A/B):** You must drop the ability to *assert* that these are gappy within the system. You can see from the outside (metalanguage) that they are gappy, but if you try to write that down in the object language, the system breaks. You have to accept a "blind spot" in the theory.
  2.  **Case 7:** You must correct your gut. This sentence cannot be True. It must be Gappy, but like Case 6, asserting it is Gappy creates instability. It is best treated as a variant of the Liar that fails to ground.

  **Which clause pays for which case?**
  *   **"Bottoms out in non-semantic facts":** This pays for **Case 3** (True) and **Case 5** (False). It explains why they differ from Case 1. The evaluation tree hits 'snow is white' or the card's content and stops.
  *   **"'Not true' said of a gappy sentence isn't true":** This pays for **Case 1**. If this clause were false (i.e., if 'not true' of a gap were True), the Liar would evaluate to True, then False, then crash. This clause preserves the Gap.
  *   **The "Blind Spot" (Inexpressibility of Gap):** This pays for **Case 6** and **New Cases**. It is the price of avoiding a hierarchy. You save the system from contradiction by admitting it cannot fully describe its own gaps.

  ### Summary
  Your gut is remarkably aligned with the best non-hierarchical theories of truth (Kripke/Field). Your principle works perfectly for 1–5. It breaks on 6 because **a system cannot consistently classify its own failures.**

  To keep it tidy:
  1.  Keep the verdicts for 1–5.
  2.  Accept that Case 6 is Gappy, but admit you cannot *say* "Case 6 is Gappy" in the same language without risk.
  3.  Treat Case 7 as Gappy (correcting your gut).
  4.  Accept that "Truth" is a partially defined predicate that leaves some sentences (like 1, 2, 4, 6) in a zone where classical logic does not apply.
