answer: |-
  **AGENCY FOR QUANTITATIVE COMPLIANCE**
  **Form H-2: Application for Permission to Describe a Trait as Genetic in Any Sentence Intended for the Public**

  **INSTRUCTIONS:** Complete all fields in ink. Pursuant to the Variance Partitioning Act, applicants must certify that the term "genetic" will not be conflated with "immutable" or "between-group causal."

  **SECTION 1: REFERENCE PARAMETERS**
  1.1 Define Reference Population (e.g., *Norwegian Atlantic Salmon, Brood Year 2023*): _________________________________
  1.2 Define Environmental Range (e.g., *Temp 8–12°C, Standard Ration*): _________________________________
  1.3 Reported Heritability ($h^2$): _________

  **SECTION 2: VARIANCE MANIPULATION CERTIFICATION**
  Applicant must certify the behavior of $h^2$ under counterfactual conditions.
  2.1 If Environmental Variance ($V_E$) is minimized (uniform tanks):
  [ ] $h^2$ increases toward 1.0
  [ ] $h^2$ decreases
  2.2 If Genetic Variance ($V_G$) is minimized (clonal lines):
  [ ] $h^2$ increases
  [ ] $h^2$ decreases toward 0.0

  **SECTION 3: INTERVENTION QUERY**
  3.1 What does the applicant actually want to know?
  [ ] Can diet alter the trait?
  [ ] Can schooling alter the trait?
  [ ] Can surgery alter the trait?
  3.2 Estimated magnitude of environmental intervention effect: _________________________________

  *FOOTNOTE 3.3: The quantity requested in Field 3.2 is not heritability. No such quantity appears anywhere on this form. A high value in 1.3 is compatible with a value of 100% in 3.2. Do not infer fixability from 1.3.*

  **SECTION 4: BETWEEN-GROUP INFERENCE**
  4.1 Does the value in 1.3 explain the mean difference between Population A and Population B?
  [ ] Yes
  [ ] No
  [ ] **BOX UNAVAILABLE**

  *WARNING 4.2: Within-population variance ratios do not partition between-population means. Checking "Yes" invalidates this application. The Agency does not possess a checkbox for this inference because the inference is statistically illicit.*

  **SECTION 5: WORKED EXAMPLE (MANDATORY)**
  *Species:* Atlantic Salmon (*Salmo salar*)
  *Trait:* Growth Rate
  *Reported $h^2$:* 0.85 (High)
  *Environmental Variance:* Minimized (Identical Tanks)
  *Intervention:* Increase water temperature by 2°C.
  *Result:* Growth rate increased 40% across all genotypes.
  *Conclusion:* Trait is highly heritable within tanks; trait is fully modifiable by temperature.

  **SECTION 6: FINAL DETERMINATION**
  6.1 Select Desired Public Messaging Rating:
  [ ] Low Heritability (Implies Environmental Sensitivity)
  [ ] High Heritability (Implies Environmental Uniformity)

  6.2 Agency Guidance:
  Applicants achieving $h^2 \approx 1.0$ via standardization of tanks (Field 2.1) demonstrate maximum statistical compliance. Such environments eliminate noise, inflating the ratio of genetic variance to total variance. Therefore, the highest heritability ratings are awarded to the most uniform, controlled, and environmentally sterile conditions.

  **AUTHORIZATION**
  Applications demonstrating $V_E \approx 0$ are approved automatically.
  *Stamp Date:* _______________ *Officer ID:* _______________

  **NOTICE:** Approval grants permission to state "variation is genetic." It does not grant permission to state "cause is genetic," "trait is fixed," or "group difference is genetic." Violations subject to peer review.
