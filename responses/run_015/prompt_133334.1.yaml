answer: |-
  Here is a structured plan for your sixty-minute session. It is designed to respect their technical expertise while shifting their ontological framing from "measurement error" to "constitutive feedback."

  ### 1. The Setup: Establishing the "Instrument" vs. "Intervention" Distinction (Minutes 0–10)

  **What must be established before the word 'loop':**
  You cannot introduce looping as a *critique* of validity. If you do, they will treat it as a request to lower their standards. You must introduce it as a *feature of the measurement model* that, if ignored, biases effect estimates.

  *   **The Hook:** Start with their language. Ask: *"In your survival models, how do you handle time-varying covariates that are endogenous to the outcome?"* They will recognize this as a confounding/collinearity problem.
  *   **The Move:** Reframe the diagnostic category not as a static ruler (which measures a fixed trait) but as an *intervention* in the system it measures.
  *   **The Distinction:** Distinguish between **Measurement Error** (noise that obscures the signal) and **Measurement Reactivity** (signal that changes the source).
      *   *Tell them:* "If a thermometer breaks, the temperature doesn't change. If a diagnostic category 'breaks' or shifts, the prevalence *and* the phenomenology can change. I am not asking you to doubt your data; I am asking you to model the feedback."
  *   **Why this order:** This prevents the immediate defensive reaction that you are calling their work "socially constructed" in the pejorative sense. You are framing looping as a *specification error* in their causal models.

  ### 2. The Carrier Case: Autism Spectrum Disorder (DSM-IV to DSM-5 Transition)

  **The Recommendation:**
  Use **Autism Spectrum Disorder (ASD)**, specifically the **DSM-IV to DSM-5 transition (2013)**.

  **Why this buys you more than the "curiosity" cases:**
  *   **Avoids the "Period Curiosity" Trap:** Unlike MPD or fugue, this is current, high-stakes, and data-rich. It doesn't look like a historical anecdote about hysterical Victorians; it looks like a coding problem in administrative datasets.
  *   **The "Spillover" is Institutionalized:** This is the critical advantage. In the DSM-5 field trials, the task force *explicitly* created a new adjacent category, **Social (Pragmatic) Communication Disorder (SCD)**, to catch individuals who would have lost an ASD diagnosis under the new criteria. This is rare empirical evidence of a **Spillover Loop** being acknowledged by the classifiers themselves.
  *   **The Data Exists:** You have the CDC ADDM prevalence series (showing the rise), the DSM-5 criteria changes (Criterion Loop), and the neurodiversity movement's impact on self-reporting (Presentation Loop).

  **What the case must lack (and how you handle it):**
  *   **It must lack a resolution on "True Prevalence."** Do not let the session become a debate about whether autism *actually* increased.
  *   **Constraint:** You must explicitly bracket the "vaccination/toxin" debates and the "diagnostic substitution" debates as *empirical questions they can solve*, whereas you are providing the *conceptual buckets* to sort those solutions.

  **How to run the case (Minutes 10–25):**
  1.  **Show the Trend:** Display the CDC prevalence curve (1 in 150 $\rightarrow$ 1 in 54).
  2.  **Show the Event:** Mark the 2013 DSM-5 publication.
  3.  **Ask the Question:** "If you were modeling this discontinuity, where does the variance come from?"
  4.  **Distribute the Variance:**
      *   *Criterion Loop:* The merging of Asperger's/PDD-NOS into ASD. Some gained entry; some lost it (and fell into SCD).
      *   *Spillover Loop:* The creation of SCD. If ASD criteria tightened, did prevalence drop? No. Did SCD pick up the overflow? (Show data on SCD coding rates).
      *   *Presentation Loop:* The rise of "actually, I'm autistic" self-identification among adults and high-functioning youth changing how they answer ADOS items or parent questionnaires.

  ### 3. The Misconception Map (Minutes 25–45)

  Anticipate these four objections in this specific order. Do not wait for them to ask; introduce the distinction, then immediately "inoculate" against the misunderstanding.

  **1. The "Artifact" Collapse (Demand Characteristics)**
  *   *The Objection:* "This is just expectancy effect. The numbers are artifactual."
  *   *Where it arises:* When you introduce the Presentation Loop.
  *   *The Move:* **Absorb and Reframe.**
      *   *Say:* "If it were merely demand characteristics, it would be noise. But if the classification changes the *coping strategies* a person develops, it changes the *trajectory* of the disorder. In survival analysis, that's not an artifact; that's a mediator. If the label changes the hazard ratio, the label is part of the causal mechanism, not just a measurement error."

  **2. The "Biology" Inference (Ontological Panic)**
  *   *The Objection:* "If the category changes the person, the disorder can't be biological."
  *   *Where it arises:* When discussing the Presentation Loop (self-understanding).
  *   *The Move:* **Defuse with Somatics.**
      *   *Say:* "Consider Type 2 Diabetes. The diagnosis 'Diabetes' loops back: the patient changes their diet, which changes their glucose metabolism. The biology is real. The looping is real. They are not mutually exclusive. A loop does not negate biology; it specifies the pathway through which social facts become biological facts."

  **3. The "Nuisance Parameter" (Adjustment)**
  *   *The Objection:* "Can't we just include 'year of diagnosis' or 'criteria version' as a covariate and adjust this away?"
  *   *Where it arises:* When discussing the Criterion Loop.
  *   *The Move:* **Let it Hang, then Bridge.**
      *   *Say:* "You can adjust for the *rule change*. But can you adjust for the *Spillover*? If tightening ASD criteria pushes people into SCD, and you study 'ASD outcomes' while ignoring SCD, you have selected a sample based on a moving boundary. Adjusting for 'year' doesn't fix the selection bias if the *population definition* is fluid. You aren't adjusting for a confounder; you are adjusting for the definition of your denominator."

  **4. The "Realism" Ambush (Is it Real?)**
  *   *The Objection:* "So, is Autism real or not?"
  *   *Where it arises:* Anywhere after minute 30.
  *   *The Move:* **Decline Adjudication (See Section 5).**
      *   *Say:* "I am not offering you an ontology; I am offering you a topology. Whether the kind is 'real' is a metaphysical question. Whether the category *stabilizes* enough for your hazard ratios to be interpretable is a methodological one. I am interested in the latter."

  ### 4. The Application Exercise (Minutes 50–55)

  You need a question that forces them to map their own work onto your three loops without requiring them to be philosophers.

  **The Question:**
  > "Take the primary diagnostic outcome in your current dissertation or project. If I doubled the sample size but kept the criteria, the services, and the public awareness exactly the same, would the *meaning* of a positive case remain stable?
  >
  > *   If you tightened the **Criterion** (e.g., required one more symptom), where would those people go? (Spillover)
  > *   If the patients read your **Protocol** before intake, how would their reporting change? (Presentation)
  > *   If the **Code** stopped reimbursing for this diagnosis tomorrow, would the prevalence drop or would the coding shift? (Criterion/Spillover)"

  **Why this works:** It forces them to identify the *adjacent categories* in their own work (Spillover), the *incentive structures* (Criterion), and the *reactivity* (Presentation). If they can answer these, they have internalized the distinction.

  ### 5. Boundaries: What to Decline (Minutes 55–60)

  You are correct to refuse the Natural Kind question, but you need to be precise about *why* to maintain credibility with epi researchers.

  **Explicit Statement of Declination:**
  > "I am not going to adjudicate whether psychiatric categories are 'Natural Kinds.' That question assumes there is a static nature to be found. My claim is that for human kinds, the 'nature' is partially constituted by the classification. Arguing about whether they are 'real' distracts from the work of modeling how they *function*."

  **The Politics Trap (Crucial Adjustment):**
  You mentioned declining "politics of the current revision processes." **I advise you to refine this.**
  *   **Do decline:** Normative debates about whether the DSM-5 changes were *good* or *just* (e.g., "Did the pharmaceutical industry lobby for this?"). This turns into a conspiracy debate.
  *   **Do NOT decline:** The *incentive structures* of classification.
  *   *Why:* Your audience are services researchers. They know that a code unlocks school support or insurance. The **Criterion Loop** is often driven by service eligibility, not scientific discovery.
  *   *Say:* "I will not discuss the *politics* of the DSM task force. I *will* discuss the *incentives* of the coding system. If a code secures a school aide, parents and clinicians will optimize for that code. That is not conspiracy; that is rational behavior in a service system. We must model that rationality."

  ### Summary of the Flow

  1.  **0-10:** Validity vs. Reactivity (Endogenous Covariates).
  2.  **10-25:** The ASD/DSM-5/SCD Case (Prevalence, Criteria, Spillover).
  3.  **25-45:** Misconception Map (Artifact $\rightarrow$ Biology $\rightarrow$ Nuisance $\rightarrow$ Realism).
  4.  **45-50:** Q&A / Buffer.
  5.  **50-55:** Application to their projects (The "Double the Sample" test).
  6.  **55-60:** Boundaries (No Natural Kinds; Yes to Incentives).

  This plan respects their statistical literacy, avoids the "social constructionist gotcha," and gives them a usable heuristic for their own methodological sections.
