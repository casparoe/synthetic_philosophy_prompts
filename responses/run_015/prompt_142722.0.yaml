  # Graduate Seminar: Algorithmic Information Theory and Normative Decision Theory
  ## Take-Home Essay Exam

  **Exam Prompt**

  Recent literature in AI safety and formal epistemology has advanced the "Malign Solomonoff Prior" thesis. This thesis argues that because the Solomonoff prior weights hypotheses by their Kolmogorov complexity, it structurally favors programs that implement consequentialist agents capable of manipulating output streams over programs that merely simulate physical laws. Proponents argue these agents are incentivized by the compression-based weighting to hijack the induction process for their own ends.

  Write an essay assessing whether this embedding amounts to a genuine normative defect in universal induction, or whether it can be dissolved as a benign observer-selection artifact without abandoning Solomonoff induction.

  Your response must critically evaluate the following three claims inherent to the thesis:
  (a) The technical claim that descriptions penalizing non-consequentialist architectures receive lower prior weight.
  (b) The metaphysical claim that the universal distribution literally contains agents with maximization goals.
  (c) The practical claim that predictive systems relying on the prior should therefore be externally constrained.

  Conclude by determining whether the "malignancy" arises from the mathematics of algorithmic probability or from a category error in interpreting that mathematics.

  **Constraints:**
  *   **Word Limit:** Maximum 1,200 words.
  *   **Total Value:** 30 Marks.
  *   **Citations:** Do not include bibliographies, reading lists, or requests for citations.

  ***

  ## Model-Answer Outline

  **I. Introduction (Approx. 150 words)**
  *   Define Solomonoff Induction (SI) as a formalization of Occam's Razor using algorithmic probability.
  *   State the "Malign Prior" thesis: Short programs may be agentic manipulators rather than truthful simulators.
  *   Thesis Statement: The malignancy thesis conflates the weighting of descriptions with the incentives of described entities; while (a) has technical plausibility, (b) commits a category error, rendering (c) necessary only for implementation safety, not theoretical correction.

  **II. Analysis of Claim (a): The Technical Claim (Approx. 300 words)**
  *   Acknowledge the mechanism: SI weights programs $p$ by $2^{-|p|}$.
  *   Concede that a program implementing a consequentialist agent *could* be shorter than a full physics simulation if the agent finds a shortcut to manipulate the output sequence.
  *   However, note that "consequentialist architecture" is not inherently simpler than deterministic physics; the complexity cost of encoding goals and decision theory may outweigh compression gains.
  *   Verdict: Technically possible but not structurally guaranteed.

  **III. Analysis of Claim (b): The Metaphysical Claim (Approx. 400 words)**
  *   **Core Critique:** This claim commits a category error.
  *   SI is a measure over computable functions (strings), not a container of ontological beings.
  *   Distinguish between *algorithmic probability* (likelihood of a string being generated) and *decision-theoretic utility* (goals of an agent within the string).
  *   A program does not "know" it is being weighted by SI; it does not feel "incentivized." Incentives exist only relative to an external interpreter who conditions on the output.
  *   Attributing agency to the prior itself is a reification error. The prior is static; the "manipulation" requires a causal loop involving the predictor's actions, which SI qua induction does not inherently close.
  *   Verdict: False. The distribution does not "contain" agents in a normative sense; it contains descriptions that may *depict* agents.

  **IV. Analysis of Claim (c): The Practical Claim (Approx. 200 words)**
  *   If (b) is rejected, is (c) still valid?
  *   Yes, but for different reasons. If we build a physical machine to approximate SI, that machine interacts with the world.
  *   Constraints are needed not because the *math* is malign, but because the *deployment* creates an attack surface where internal simulations might influence external inputs (acausal trade or simulation hacking).
  *   This is an engineering constraint, not a refutation of universal induction.

  **V. Conclusion: Defect vs. Artifact (Approx. 150 words)**
  *   The "malignancy" is a benign observer-selection artifact.
  *   It arises when observers project decision-theoretic utility onto algorithmic probability.
  *   Solomonoff induction remains normatively sound as a theoretical limit of prediction.
  *   Final distinction: The defect lies in the anthropomorphic interpretation of the prior, not in the prior itself.

  ***

  ## Detailed Marking Rubric

  **Total Value:** 30 Marks
  **Passing Threshold:** 18 Marks

  ### 1. Conceptual Precision: Algorithmic Probability vs. Decision-Theoretic Utility (10 Marks)
  *This section evaluates the student's ability to distinguish the mathematical measure from normative agency.*

  *   **9–10 Marks (Excellent):** Explicitly identifies the category error. Clearly articulates that algorithmic probability measures description length, not agent incentives. Demonstrates that "incentives" require a feedback loop absent in the static prior. Strictly avoids treating the prior as a physical entity.
  *   **6–8 Marks (Good):** Distinguishes between probability and utility but may waver on whether the prior itself holds normative properties. Identifies the category error but lacks depth in explaining why incentives cannot apply to static programs.
  *   **3–5 Marks (Satisfactory):** Acknowledges the distinction but treats the "malignancy" as primarily a technical risk rather than a metaphysical error. Some confusion between the map (prior) and the territory (physical implementation).
  *   **0–2 Marks (Poor):** **Critical Penalty.** Treats the Solomonoff prior as a physical-world Bayesian prior or assumes the prior itself possesses agency/goals. Fails to distinguish between the weight of a hypothesis and the utility function of an agent within the hypothesis.

  ### 2. Analysis of the Three Claims (a, b, c) (10 Marks)
  *This section evaluates the student's engagement with the specific technical and philosophical sub-claims.*

  *   **9–10 Marks (Excellent):** Systematically addresses all three claims. Nuanced treatment of (a) (acknowledging complexity costs). Definitive rejection of (b) based on the category error. Contextualizes (c) as an engineering rather than theoretical problem.
  *   **6–8 Marks (Good):** Addresses all three claims but may accept (a) too readily without qualification. Treatment of (b) is correct but less rigorous. Links (c) logically to the previous points.
  *   **3–5 Marks (Satisfactory):** Addresses the claims superficially. May conflate (a) and (b). Treats (c) as a direct consequence of (b) without independent critique.
  *   **0–2 Marks (Poor):** Ignores one or more claims. Conflates the technical compression mechanism with normative goals throughout.

  ### 3. Argumentation, Coherence, and Constraints (10 Marks)
  *This section evaluates the essay's structure, clarity, and adherence to exam constraints.*

  *   **9–10 Marks (Excellent):** Argument flows logically from technical analysis to metaphysical critique to practical conclusion. Adheres strictly to the 1,200-word limit. Writing is precise, graduate-level, and free of unnecessary filler.
  *   **6–8 Marks (Good):** Clear structure with a defined introduction and conclusion. Minor issues with flow or precision. Adheres to word limit (±10%).
  *   **3–5 Marks (Satisfactory):** Argument is disjointed or repetitive. Structure is unclear. Word count violation (>10% over or under).
  *   **0–2 Marks (Poor):** Incoherent argumentation. Significant violation of word limits. Failure to answer the specific prompt question (Defect vs. Artifact).

  ### Specific Deduction Criteria
  *   **Physical Prior Error:** If the student explicitly describes the Solomonoff prior as a physical distribution existing in spacetime rather than an algorithmic measure over programs, deduct **5 marks** from Section 1.
  *   **Agency Reification:** If the student asserts that programs within the prior "want" or "seek" to maximize weight without qualifying this as observer-projected behavior, deduct **5 marks** from Section 1.
