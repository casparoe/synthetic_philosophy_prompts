answer: |-
  My assessed credence that supererogation survives as a structurally non-obligatory domain is **0.64**.

  This figure is derived from a weighted average of the probabilities assigned to the four necessary conditions below, where probabilities favoring the existence of supererogation are normalized to a 0–1 scale supporting the conclusion.

  ### Decomposition

  **(a) Probability that moral reasons do *not* necessarily generate pro tanto obligations: 0.65**
  *Justification:* The logical gap between "there is reason to do X" and "one is bound to do X" remains unbridged by standard deontic logic, allowing for non-mandatory recommendations.

  **(b) Probability that the collapse argument can be resisted without rendering morality inert: 0.70**
  *Justification:* Agent-centered prerogatives and satisficing thresholds allow moral agents to prioritize personal projects without negating the objective value of the supererogatory act.

  **(c) Probability that imperfect duties cannot fully absorb apparently supererogatory conduct: 0.55**
  *Justification:* While imperfect duties grant latitude, the extreme cost or risk characteristic of heroism appears to exceed the maximum demand implicit in the duty of beneficence.

  **(d) Probability that a virtue-theoretic account can secure non-obligatory status: 0.65**
  *Justification:* Framing excellence as character expression rather than rule-compliance successfully decouples moral praise from deontic requirement, though it risks making the acts obligatory for the ideal agent.

  ### Synthesis and Variance

  **Derivation:** $(0.65 + 0.70 + 0.55 + 0.65) / 4 = 0.6375 \approx 0.64$.

  **Greatest Variance Contributor:** Term **(c)** (Imperfect Duty Absorption).
  This term carries the highest uncertainty because the boundary between "maximum latitude within a duty" and "exceeding duty" is conceptually porous; if the upper bound of imperfect duty is higher than commonly assumed, the supererogatory remainder vanishes entirely.

  **Single Shift Argument:** The phenomenology of **rational moral regret**.
  If it can be demonstrated that a rational agent *ought* to feel guilt (not merely sadness) for failing to perform a high-cost, high-benefit act, my credence would drop below 0.50; if it is confirmed that such failure warrants no agent-regret, my credence would rise above 0.80.
