answer: |-
  # Mathematics, Truth and Proof: The Decision Tree

  **How to use this:** Answer the ten questions below in order. Follow the **Paths** to find your philosophical position. Read the **Leaves** for the name and cost of that position.

  ### I. The Branch Questions
  1.  Are mathematical claims (e.g. "2+2=4") literally true?
  2.  If not literally true, are they useful fictions or metaphorical truths?
  3.  Do numerals (like '2') refer to specific, unique objects?
  4.  If rival set-theoretic definitions of '2' disagree on facts, is one correct? **(Identification)**
  5.  Does knowledge require a causal/natural link to the truth-maker?
  6.  If an AI reliably proves theorems without causal contact, does it know? **(AI Reliability)**
  7.  Is mathematics fundamentally about structures or patterns?
  8.  Do these structures exist independently of physical systems instantiating them?
  9.  Can numbers be introduced solely by stipulating equivalence conditions?
  10. Is the demand for a mathematical ontology itself a linguistic confusion?

  ### II. The Decision Paths
  *   **Q1=No** → Q2.
      *   Q2=Fiction → **Field-Style Fictionalism**.
      *   Q2=Metaphor → **Yablo-Style Figuralism**.
  *   **Q1=Yes** → Q10.
      *   Q10=Yes → **Quietism/Deflationism**.
      *   Q10=No → Q3.
          *   Q3=Yes → Q4.
              *   Q4=Yes → Q5.
                  *   Q5=Yes & Q6=No → **Empty:** *Incoherent (Benacerraf's Gap).*
                  *   Q5=No or Q6=Yes → **Object Platonism**.
              *   Q4=No → Q9.
                  *   Q9=Yes → **Neo-Fregean Abstractionism**.
                  *   Q9=No → **Plenitudinous Platonism**.
          *   Q3=No → Q7.
              *   Q7=No → **Empty:** *Unmotivated Realism.*
              *   Q7=Yes → Q8.
                  *   Q8=Yes → **Ante Rem Structuralism**.
                  *   Q8=No → **Modal/Eliminative Structuralism**.

  ### III. The Leaves (Positions & Costs)
  *   **Object Platonism:** Numbers are real objects. *Cost:* Must explain non-causal access.
  *   **Plenitudinous Platonism:** Every consistent theory describes a realm. *Cost:* Proliferates worlds wildly.
  *   **Ante Rem Structuralism:** Structures exist prior to systems. *Cost:* Commits to abstract universals.
  *   **Modal Structuralism:** Math describes possible systems. *Cost:* Relies on modal logic ontology.
  *   **Field-Style Fictionalism:** Math is a useful false story. *Cost:* Denies literal truth of science.
  *   **Yablo-Style Figuralism:** Math is metaphorically true. *Cost:* Complex semantics of content.
      *   *\*Note: Field and Yablo are hard to separate without a node on nominalistic reconstruction.*
  *   **Neo-Fregean Abstractionism:** Numbers exist via logical stipulation. *Cost:* Logic may not be ontologically free.
  *   **Quietism:** Ontological questions are misfiring. *Cost:* Dissolves rather than solves the problem.

  ### IV. Seminar Note
  **The Pivotal Node:** Question 6 (AI Reliability). This node tests the strength of the causal requirement (Q5). If students grant the AI knowledge, the primary epistemic objection to Platonism collapses; if they deny it, they must explain why human reliability differs without invoking magic. Spend seminar time here.
