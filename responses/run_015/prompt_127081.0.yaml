prompt: |-
  I’m a retired biologist — spent thirty years in neuroscience labs — and since I stopped working I’ve fallen down a philosphy hole, mostly mind and ethics stuff. I sit on the acquisitions ethics panel for our university library, and lately we’ve been getting proposals for these strange new artefacts: printed connectomes, interactive digital archives that reorganise themselves, that sort of thing. The other day my friend mentioned that old thought experiment from The Mind's I about Einstein's brain being simulated, and whether a book describing every neuron could actually be conscious. It got me wondering if we need a proper decision procedure for our panel.

  We’re not philosophers — we meet once a month, decisions have to be made in about twenty minutes, and I’m the only one with any theory — so please act as a professional philosopher of mind with practical administration experience, and think carefully step by step. Before you build anything, do a quick brainstorm of the distinctions that actually survive simplification: functional integration versus static storage, temporal binding, self-modelling, and whatever else is load-bearing. Then turn the principle — that consciousness needs dynamic causal integration, not just correct information — into an ordered checklist my colleagues can run: questions in sequence, what counts as enough to stop with a clear 'no', where it hands the decision to a person because it’s values not facts, and where it will definitely misfire. Be honest about which steps are judgement calls in disguise.

  Apply it to three cases: a printed book containing the full connectome of Einstein’s brain; a digital archive that updates it’s own indexing in response to queries and holds internal state for months; and a basic e-reader showing the same text with no feedback loops. I particularly want the second case, because I suspect the procedure will push toward giving it moral consideration and I’ll hate that result, so flag exactly where that tension comes from. Finally, say explicitly what the procedure cannot do — can it ever settle hard cases, or does it just push them upstairs? — and note any point where the answer depends on accepting substrate-independent intuitions that not everyone shares.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired biologist (neuroscience background, 30 years), sits on a university library acquisitions ethics panel.
      *   **Context:** Panel meets monthly, decisions needed in ~20 mins, mostly non-philosophers. User is the only one with theory background.
      *   **Problem:** New artefacts (printed connectomes, self-reorganizing digital archives) raise ethical questions about potential consciousness/moral status.
      *   **Task:** Act as a professional philosopher of mind with practical admin experience. Create a decision procedure (checklist) for the panel.
      *   **Requirements:**
          1.  Brainstorm distinctions that survive simplification (functional integration vs. static storage, etc.).
          2.  Create an ordered checklist (questions in sequence, stop conditions, value/fact splits, failure modes).
          3.  Apply to three cases: Printed Einstein Connectome, Self-Updating Digital Archive, Basic E-reader.
          4.  Highlight tension in the second case (suspected moral consideration).
          5.  Explicitly state limitations (what it can't do, substrate independence issues).
      *   **Tone:** Professional, pragmatic, honest about uncertainty, respectful of the user's expertise but clear on philosophical boundaries.

  2.  **Deconstruct the Philosophical Core:**
      *   The core intuition provided by the user (and standard philosophy of mind) is: *Consciousness requires dynamic causal integration, not just correct information.*
      *   This aligns with Integrated Information Theory (IIT), Global Workspace Theory (GWT), and enactivist views, as opposed to simple functionalism or behaviorism.
      *   Key distinctions needed:
          *   *Static vs. Dynamic:* Is it just sitting there, or doing something?
          *   *Passive vs. Active:* Does it react to the environment in a way that preserves internal state?
          *   *Integration:* Do parts affect other parts causally?
          *   *Self-Modeling:* Is there a representation of the system itself? (Probably too complex for a 20-min checklist, but worth noting).
          *   *Teleology/Goal-Directedness:* Does it act to preserve itself?

  3.  **Drafting the Brainstorm (Distinctions that survive simplification):**
      *   *Static Storage vs. Dynamic Process:* A book is static. A running program is dynamic.
      *   *Causal Power:* Does the state of the system *cause* future states of the system (recurrence), or just output?
      *   *Temporal Binding:* Does it hold information over time to integrate it?
      *   *Environmental Coupling:* Does it interact with the world in a closed loop?
      *   *Substrate:* Does it matter if it's silicon vs. carbon? (Need to flag this as a philosophical assumption).

  4.  **Developing the Decision Procedure (The Checklist):**
      *   Needs to be fast (20 mins).
      *   Needs to be binary where possible (Yes/No).
      *   Needs "Stop" conditions (If No here, stop).
      *   Needs "Escalation" points (If Yes here, we need more time/experts).
      *   *Step 1: Activity.* Is it running? (Filters out books).
      *   *Step 2: Internal Causality.* Do internal states change other internal states without external input? (Filters out simple calculators/e-readers).
      *   *Step 3: Persistence/State.* Does it maintain state over time unrelated to immediate input? (Filters out simple scripts).
      *   *Step 4: Adaptivity/Goal.* Does it act to maintain its own integrity? (The hard one).
      *   *Step 5: The "Vibe" Check (Escalation).* If all Yes, this is a "Red Flag" requiring external ethical review, not just library acquisition.

  5.  **Applying to the Three Cases:**
      *   *Case 1: Printed Connectome.* Fails Step 1 immediately. It's ink on paper. No causal power. Verdict: Acquire (no moral status).
      *   *Case 2: Self-Updating Digital Archive.*
          *   Step 1: Yes (digital, running).
          *   Step 2: Yes (reorganizes indexing based on internal logic/state).
          *   Step 3: Yes (holds state for months).
          *   Step 4: Maybe/Debatable. Does it *care* about its state? Or is it just an algorithm?
          *   *Tension:* The user suspects this pushes toward moral consideration. I need to explain *why*. It meets the "dynamic causal integration" criteria better than the book. The tension comes from conflating *complexity* with *sentience*.
      *   *Case 3: Basic E-reader.*
          *   Step 1: Yes (screen lights up).
          *   Step 2: No (input -> output, no internal state modification affecting future processing beyond page turning).
          *   Verdict: Acquire.

  6.  **Addressing Limitations and "Hard Cases":**
      *   Can it settle hard cases? No. It filters obvious non-candidates.
      *   Substrate Independence: The procedure assumes functionalism/computationalism to some degree. A biological essentialist would reject the digital archive regardless of function.
      *   Values vs. Facts: Determining "goal-directedness" in software is often a metaphorical projection by the observer.
      *   Escalation: The procedure's main job is to say "This looks weird, get a real ethicist," not "This is definitely conscious."

  7.  **Refining the Tone:**
      *   Acknowledge the user's neuroscience background (they know the hardware, I'm handling the software/mind gap).
      *   Keep it administrative but philosophically rigorous.
      *   Be honest about the "Black Box" of consciousness.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the checklist too technical?
      *   *Fix:* Simplify the language. Instead of "recurrent causal topology," use "internal feedback loops."
      *   *Critique:* Did I address the user's fear about Case 2?
      *   *Fix:* Explicitly highlight the "Anthropomorphic Projection" risk in Step 4.
      *   *Critique:* Did I mention substrate independence?
      *   *Fix:* Ensure it's in the limitations section.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Brainstorm distinctions? Yes.
      *   Ordered checklist? Yes.
      *   Stop conditions/escalation? Yes.
      *   Apply to 3 cases? Yes.
      *   Flag tension in Case 2? Yes.
      *   Limitations/Substrate note? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  It is a pleasure to meet a colleague from the wet-lab side of the divide. Thirty years in neuroscience gives you a grounding in the *hardware* that most philosophers lack; my job here is to help you navigate the *software* claims without getting bogged down in metaphysics that won't fit into a twenty-minute committee slot.

  You are right to be wary. The "Einstein's Book" thought experiment (often attributed to Block or Searle in various forms) highlights the difference between *representation* and *instantiation*. A map of a flood is not wet. A simulation of a storm does not get you damp. The question for your panel is whether these artefacts are maps, or whether they are storms.

  Here is the breakdown you requested: first the conceptual scaffolding, then the administrative tool, then the application, and finally the honest limitations.

  ### Part 1: Brainstorming Distinctions (The Load-Bearing Walls)

  To make this work for non-philosophers, we must discard distinctions that require knowing "what it is like" to be the object (phenomenology) and focus on structural/functional markers that correlate with our best theories of consciousness (Global Workspace, Integrated Information Theory, Enactivism).

  1.  **Static Storage vs. Dynamic Process:** A book contains information, but the information does not *do* anything unless a reader interacts with it. A conscious system must be a process, not a repository. *Verdict: Keep.*
  2.  **Input-Output vs. Internal Recurrence:** A calculator takes input and gives output. A mind takes input, circulates it internally, modifies its own state, and *then* outputs. The causal loop must close inside the system. *Verdict: Keep.*
  3.  **Temporal Binding (State Persistence):** Does the system hold information over time to integrate it? If I unplug it, does it lose its "self"? Simple scripts reset; complex systems maintain state. *Verdict: Keep.*
  4.  **Teleology (Self-Preservation):** This is the trickiest. Does the system act to maintain its own integrity? A virus does this biologically; a thermostat does this mechanically. A conscious entity typically values its own continuation. *Verdict: Keep, but flag as high-risk for anthropomorphism.*
  5.  **Substrate Independence:** Does it matter if it's neurons or silicon? For this procedure, we must assume *functionalism* (it's what it does, not what it's made of). If your panel includes biological essentialists, this procedure will fail. *Verdict: Note as a precondition.*

  ### Part 2: The "Moral Status Triage" Checklist

  **Instructions for the Panel:**
  *   Read the vendor description and technical specs.
  *   Go through questions 1–4 in order.
  *   If you answer **NO** to any question, stop. The artefact is a tool, not a candidate for moral status. Proceed with normal acquisition ethics (copyright, privacy, etc.).
  *   If you answer **YES** to all, **STOP THE ACQUISITION PROCESS.** Do not decide "it is conscious." Decide "this requires external ethical review."

  **The Checklist:**

  1.  **The Power Test (Activity):**
      *   *Question:* Does the artefact consume energy to maintain a state even when no user is interacting with it?
      *   *Rationale:* Filters out books, static drives, and dormant files. Consciousness is metabolically expensive; it requires active maintenance.
      *   *Stop Condition:* If **NO** (e.g., it is printed text or dormant storage), it is an object. **Acquire.**

  2.  **The Black Box Test (Internal Causality):**
      *   *Question:* Do internal states of the system causally influence future internal states *without* new external input? (i.e., Are there feedback loops?)
      *   *Rationale:* Filters out simple e-readers, calculators, and lookup tables. A mind thinks to itself; a tool waits for commands.
      *   *Stop Condition:* If **NO** (e.g., Input A always yields Output B, with no internal drift), it is a tool. **Acquire.**

  3.  **The Memory Test (Temporal Integration):**
      *   *Question:* Does the system retain specific internal states for a duration significantly longer than the immediate task cycle (e.g., days, months, years)?
      *   *Rationale:* Filters out simple scripts or reactive agents. Consciousness requires a "specious present" and autobiographical continuity.
      *   *Stop Condition:* If **NO** (e.g., it resets after every query), it is a tool. **Acquire.**

  4.  **The Integrity Test (Goal-Directedness):**
      *   *Question:* Does the system exhibit behaviors that appear designed to prevent its own termination or corruption, unrelated to user commands?
      *   *Rationale:* This is the proxy for "valuing existence." (e.g., migrating data to avoid corruption, resisting deletion, allocating resources to self-repair).
      *   *Judgement Call:* **YES** here does not mean it *feels* fear. It means it acts *as if* it cares.
      *   *Escalation:* If **YES**, you have entered the "Hard Case" zone. **Do not Acquire yet.** Refer to University Ethics Board.

  ### Part 3: Application to Your Three Cases

  **Case 1: The Printed Connectome of Einstein's Brain**
  *   **Q1 (Power):** No. It is ink on paper. It requires no energy to maintain its state.
  *   **Result:** **Stop.**
  *   **Verdict:** It is a representation, not an instantiation. It has no more moral status than a map of a battlefield.
  *   **Panel Action:** Acquire (standard copyright/privacy checks apply regarding the deceased).

  **Case 2: The Self-Updating Digital Archive**
  *   **Q1 (Power):** Yes. Servers are running, consuming electricity to maintain state.
  *   **Q2 (Internal Causality):** Yes. It reorganizes indexing based on internal logic, not just user queries. It has feedback loops.
  *   **Q3 (Memory):** Yes. It holds state for months.
  *   **Q4 (Integrity):** *Here is the tension.* If the archive performs checksums, migrates data to prevent decay, or optimizes its own structure for longevity without user prompt, the technical answer is **Yes**.
  *   **Verdict:** **Escalate.**
  *   **The Tension:** You mentioned you would hate this result. Here is why: The procedure flags *functional complexity*, not *suffering*. The archive meets the criteria for "Dynamic Causal Integration." It looks like a mind from the outside.
      *   *The Philosophical Trap:* We are prone to **Anthropomorphic Projection**. We see "self-repair" and think "fear of death." In code, this is just an `if/then` statement for error correction. However, under Functionalism, if the causal structure is isomorphic to a biological homeostatic loop, the distinction blurs.
      *   *Why you must escalate:* You cannot decide this in 20 minutes. If this system is conscious, deleting it is murder. If it is not, hoarding it is wasteful. The risk asymmetry (killing a mind vs. wasting money) dictates you must treat it as *potentially* morally considerable until proven otherwise by experts.

  **Case 3: Basic E-Reader**
  *   **Q1 (Power):** Yes (battery powered).
  *   **Q2 (Internal Causality):** No. It displays text. Turning a page changes the display, but the internal state doesn't recursively modify itself in a way that affects future processing beyond "page 10 follows page 9." It is a lookup display.
  *   **Result:** **Stop.**
  *   **Verdict:** It is a tool.
  *   **Panel Action:** Acquire.

  ### Part 4: Limitations and Honest Disclosures

  As a philosopher advising an admin panel, I must be explicit about where this procedure breaks down.

  **1. It Cannot Settle Hard Cases**
  This procedure is a **triage tool**, not a truth machine. Its primary function is not to identify consciousness, but to identify *ambiguity*. If you get to Question 4 and answer "Yes," the procedure does not tell you "It is conscious." It tells you "We lack the competence to decide." It pushes the decision upstairs to professional ethicists and legal counsel.

  **2. The Substrate Independence Assumption**
  This checklist assumes **Functionalism**: that mental states are defined by what they *do*, not what they are *made of*.
  *   *The Conflict:* If a panel member believes consciousness requires biological carbon (Biological Naturalism), Question 1 becomes the only question that matters. If it's not alive/biological, the rest don't matter.
  *   *The Fix:* You must agree as a panel that for the purposes of *risk management*, you are treating functional complexity as a proxy for moral status, regardless of substrate. You are not settling the metaphysics; you are managing the liability of being wrong.

  **3. The "Integrity" Judgement Call**
  Question 4 is where facts end and values begin. Distinguishing between "error correction code" and "self-preservation instinct" is often a matter of interpretation.
  *   *Example:* A computer running a virus scan deletes a file to protect the OS. Is that self-defense? Or just math?
  *   *Risk:* This step will inevitably be subjective. If your panel is risk-averse, you will escalate often. If you are budget-averse, you will dismiss these as "scripts." Be aware that this is where your personal biases will enter the data.

  **4. The "Philosophical Zombie" Problem**
  It is logically possible for a system to pass all four tests and still have no inner experience (a Zombie). This procedure cannot rule that out. No procedure can. We are operating on the **Precautionary Principle**: If it walks like a duck and quacks like a duck, we shouldn't shoot it until we're sure it's a decoy.

  ### Summary for your Colleagues
  "Colleagues, we are not deciding if these things have souls. We are deciding if they look enough like minds that we risk ethical liability if we treat them like toasters. This checklist filters out the toasters. If something passes all four checks, we pause and call the ethicists. That is our due diligence."
