answer: |-
  Here is a decision tree built from the logical space of betting theory, designed to separate the mathematical realities from the psychological preferences.

  ### The Bet-Sizing Decision Tree

  **Start:** I have a model that outputs a probability $\hat{p}$ and I have a bankroll $B$.

  **Node 1: Edge Validity**
  *Is the edge statistically significant after accounting for transaction costs (vig), sample size, and look-ahead bias?*
  *   **NO:** $\rightarrow$ **Leaf A: Skeptical Hold (No Bet)**
  *   **YES:** $\rightarrow$ Go to Node 2.

  **Node 2: Objective Function**
  *Are you maximizing the Expected Value of wealth ($E[W]$) or the Expected Growth Rate of wealth ($E[\log W]$)?*
  *(Note: $E[W]$ cares about the arithmetic mean; $E[\log W]$ cares about the geometric mean/compound return.)*
  *   **$E[W]$ (Risk Neutral):** $\rightarrow$ **Leaf B: EV Maximizer (Over-Kelly)** *[Flag: Dangerous]*
  *   **$E[\log W]$ (Growth Focused):** $\rightarrow$ Go to Node 3.

  **Node 3: Epistemic Confidence**
  *Do you treat your model's probability $\hat{p}$ as the **true frequency**, or as a **noisy estimate** with uncertainty?*
  *   **True Frequency (Known $p$):** $\rightarrow$ Go to Node 4.
  *   **Noisy Estimate (Uncertain $p$):** $\rightarrow$ **Leaf C: Fractional Kelly**

  **Node 4: Drawdown & Liquidity Tolerance**
  *Can you withstand a >50% temporary drawdown without quitting, reloading, or needing the money for living expenses?*
  *   **NO (Finite Horizon / Low Tolerance):** $\rightarrow$ **Leaf D: Risk-of-Ruin Constrained**
  *   **YES (Infinite Horizon / High Tolerance):** $\rightarrow$ **Leaf E: Full Kelly**

  **Node 5 (Alternative Path): Heuristic Preference**
  *If you chose Fractional Kelly, do you want to calculate fractions per bet or use a standard unit size?*
  *   **Calculate Fractions:** $\rightarrow$ **Leaf C: Fractional Kelly**
  *   **Standard Units:** $\rightarrow$ **Leaf F: Flat/Unit Sizing** *[Flag: Indistinguishable]*

  ---

  ### The Leaves & Their Awkward Commitments

  **Leaf A: Skeptical Hold (No Bet)**
  *   **Position:** Bet size = 0.
  *   **Awkward Commitment:** "I admit that my 'edge' is likely just noise, and I am willing to earn zero return rather than risk being the sucker at the table."
  *   **Context:** This is the "third group" you mentioned. In efficient markets, most small edges vanish after costs.

  **Leaf B: EV Maximizer (Over-Kelly)**
  *   **Position:** Bet size > Full Kelly (often "All In" on positive EV).
  *   **Awkward Commitment:** "I accept a non-zero probability of total ruin because I care about the average outcome across parallel universes, not my actual survival in this one."
  *   **Context:** Mathematically incoherent for a single bankroll over time. Only valid if you have infinite outside capital to reload after ruin (finite horizon).

  **Leaf C: Fractional Kelly (e.g., Half-Kelly)**
  *   **Position:** Bet size = $0.5 \times$ Kelly Criterion.
  *   **Awkward Commitment:** "I admit I am mathematically suboptimal to protect myself from my own arrogance about knowing the true probabilities."
  *   **Context:** This resolves the Full vs. Fractional debate. If $p$ is uncertain, the "Full Kelly" on your *estimate* is actually "Over-Kelly" on the *truth*. Fractional Kelly approximates a Bayesian integration over uncertainty. It sacrifices ~25% of growth to reduce variance by ~75%.

  **Leaf D: Risk-of-Ruin Constrained**
  *   **Position:** Bet size determined by "Max 5% chance of losing 20% of bankroll."
  *   **Awkward Commitment:** "I prioritize staying in the game over maximizing speed, effectively imposing an arbitrary utility cliff that log-utility ignores."
  *   **Context:** Common for professional funds with investor redemption clauses. It is not Kelly; it is a hard constraint optimization.

  **Leaf E: Full Kelly**
  *   **Position:** Bet size = Exact Kelly Criterion.
  *   **Awkward Commitment:** "I accept that I will likely lose half my bankroll at some point before I double it, and I promise not to quit when it happens."
  *   **Context:** Only optimal if you truly know $p$, have log-utility, and infinite horizon. Most humans quit during the drawdowns, making this strategy self-defeating for them.

  **Leaf F: Flat/Unit Sizing**
  *   **Position:** Bet 1% of bankroll on every play regardless of edge magnitude.
  *   **Awkward Commitment:** "I am too lazy to size by edge, so I hope my average edge is stable enough that this proxy doesn't bleed me dry."
  *   **Context:** *[Flag: Indistinguishable from Fractional Kelly]*. If your edges are small and similar (e.g., all 2-4% ROI), flat betting is mathematically nearly identical to Fractional Kelly but easier to execute.

  ---

  ### Clarifying the "Full vs. Fractional" Debate

  The tree isolates the disagreement at **Node 3 (Epistemic Confidence)**.

  1.  **The Full Kelly Defense:** They argue that if you have uncertainty, you should bake that uncertainty into your probability estimate $\hat{p}$ (shrink the probability, not the bet). If you do that, you should bet **Full Kelly** on the adjusted number. They view fractional sizing as double-counting risk.
  2.  **The Fractional Kelly Defense:** They argue that in sports betting, you cannot accurately quantify the uncertainty distribution of $\hat{p}$. Therefore, a heuristic shrinkage (Half-Kelly) is more **robust**.
  3.  **The Math Reality:** The growth rate curve is asymmetric.
      *   **Underbetting (Fractional):** Growth drops linearly, but variance drops quadratically. (You get 75% of the growth for 50% of the volatility at Half-Kelly).
      *   **Overbetting (>Full Kelly):** Growth drops precipitously. At $2 \times$ Kelly, your expected geometric growth is **zero**. At $>2 \times$ Kelly, it is **negative** (certain ruin long-term).
      *   **Conclusion:** Because the cost of overbetting (ruin) is infinitely worse than the cost of underbetting (slower growth), Fractional Kelly is the rational choice whenever there is *any* doubt about the edge. Full Kelly is only defensible if you claim god-like knowledge of true probabilities.
