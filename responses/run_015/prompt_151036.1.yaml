answer: |-
  So I'm standing in my kitchen at 7 AM, absolutely desperate for tea, and there's this tortoise sitting on my counter. I don't know how he got in, but he's wearing a little waistcoat and holding a notebook.

  I reach for the kettle, and he goes, "Hold on. Premise one: There is water in the kettle. Premise two: You are pressing the switch. Do you accept these?"

  I'm half-asleep, so I say, "Yeah, sure. Water plus switch means boiling."

  "Ah," he says, tapping his pen. "But that's a conclusion. I accept the water, and I accept the switch, but I don't see the logical glue that forces the kettle to boil. You need a conditional statement. Something like: 'If there is water and you press the switch, then the kettle boils.'"

  I'm trying to find the tea bags, so I just scribble that down on a receipt and stick it to the kettle. "There. Happy?"

  "Delighted," he says. "But now I have three premises: Water, Switch, and the Conditional. But I still don't see why *those three things* make the kettle boil. You need a new rule to bridge the gap between having those premises and the conclusion."

  I start writing again. "Fine. 'If premises one, two, and three are true, then the kettle boils.'"

  He nods politely. "Excellent. But now you have four items. What connects those four items to the boiling? You need a fifth premise to apply the fourth."

  I'm getting frantic now. I'm shaking the tea box. "Look, buddy, we're using Modus Ponens! It's the rule of inference! If P implies Q, and P is true, then Q is true!"

  "Is that a premise?" he asks.

  "It's a rule!" I say.

  "Write it down as a premise," he says.

  So I do. I write "Premise Infinity: Modus Ponens applies here." I slam the paper down. "There! The rule is in the list! Now boil!"

  And that's when he hits me with it. He looks up, blinks slowly, and says, "But now you need a rule to apply *that* premise. You've turned the engine into fuel. You can't write down the rule that makes the writing work, or you'll just need another rule to make *that* work."

  I stood there holding the tea bag. He was right. I had a notebook full of reasons why the kettle should boil, but I hadn't actually done the thing that makes the reasons work.

  So yeah. No tea. Just a notebook full of logic and a cold kettle.
