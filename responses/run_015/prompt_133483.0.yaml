answer: |-
  Students draw secret 'birth rank' cards from one of three hidden decks representing different reference classes, place bets on imminent extinction based on their rank, and only learn which deck they drew from after the wager is locked.

  **Rules**
  1.  **The Setup:** There are three sealed envelopes (Deck A, B, C). Each contains 14 cards with an "Observer Rank" number. The total population $N$ for each deck is fixed but hidden: Deck A (Humans) $N=110$ Billion, Deck B (All Minds) $N=500$ Billion, Deck C (Digital) $N=100$ Trillion.
  2.  **The Bet:** Each round, the Instructor selects one envelope (secretly) and deals one card to each bettor. You see your Rank (e.g., #85 Billion) but not the Deck. You must bet chips on whether Total $N$ is **Under 200B** (Doom Soon) or **Over 200B** (Doom Late).
  3.  **The Defense:** After bets are placed, the Instructor reveals which Deck was used. The "Flat-Prior Philosopher" (see Roles) picks 2-3 students to justify their bet using only the revealed Deck's parameters and a uniform prior assumption.
  4.  **Resolution:** If your bet matches the actual $N$ of the revealed deck, you win. If not, you lose. (Note: Since $N$ is fixed per deck, Deck A always pays "Under", Deck C always pays "Over". The tension is whether your Rank *justified* that bet before the reveal).

  **Roles**
  *   **13 Bettors:** Draw cards, place bets, defend reasoning.
  *   **1 Flat-Prior Philosopher:** Rotates each round. Does not bet. Their job is to interrupt any defense that smuggles in outside knowledge (e.g., "But we know we're human!") and insist on treating the revealed Deck as the only possible universe with uniform probability across $N$.
  *   **Instructor:** Dealer, timekeeper, and keeper of the "True N".

  **Chip Payoffs**
  *   **Currency:** Poker chips or slips of paper marked "1 unit".
  *   **Stake:** Everyone starts with 10 chips.
  *   **Wager:** Bet any amount (1-10) on Under or Over.
  *   **Payout:** Win = Keep bet + win equal amount from bank. Lose = Lose bet to bank.
  *   **End Game:** Top chip holder gets first pick of leftover seminar snacks or bragging rights.

  **Materials (10-min Prep)**
  *   3 Large Envelopes labeled "Deck A", "Deck B", "Deck C".
  *   42 Index Cards (14 per envelope). Write ranks on them beforehand (mix high/low, but ensure most are >50B to trigger the DA intuition).
  *   150 Chips/Tokens (can be paper scraps).
  *   Whiteboard + Marker (to track chip counts and the 200B threshold).
  *   Timer (phone is fine).

  **Timeline (90 Minutes)**
  *   **0:00–0:10 (Intro):** Explain rules. Hand out 10 chips each. Assign Round 1 Philosopher.
  *   **0:10–0:30 (Round 1 - The Pull):** Instructor uses Deck A (Humans). Students draw, bet, reveal. Philosopher grills losers who bet "Over" despite high rank. Feel the doom.
  *   **0:30–0:50 (Round 2 - The Stretch):** Instructor uses Deck B (All Minds). Reset chips to 10 if anyone went bust (keep it fun). New Philosopher. Draw, bet, reveal. Ranks feel less significant.
  *   **0:50–1:10 (Round 3 - The Rip):** Instructor uses Deck C (Digital). New Philosopher. Draw, bet, reveal. Rank #85B is now negligible. Doom argument feels absurd.
  *   **1:10–1:30 (Debrief):** Sit down, chips away. Map the experience to the theory.

  **Debrief Guide**
  *   **SSA (Self-Sampling Assumption):** Round 1 felt convincing because you implicitly assumed you were a random sample from *Humans*. Your high rank suggested $N$ must be close.
  *   **Reference Class Problem:** Round 3 killed the feeling because the class expanded. If you're a random sample from *All Digital Minds*, rank #85B is early. The argument dissolves when you change the class.
  *   **SIA (Self-Indication Assumption) / Presumptuous Philosopher:** Ask the group: "Why didn't you bet 'Over' in Round 1 just in case you were in Deck C?" This leads to the Presumptuous Philosopher objection—betting on huge universes just because they contain more observers feels wrong, but SIA says you should.
  *   **Flat-Prior Role:** Highlight how the Philosopher forced you to ignore external priors (like "I know I'm biological"). This isolates the anthropic update from empirical data.

  **Honest Limitation**
  You have to supply verbally that in the real world, we don't know the "Deck" probabilities themselves. In the game, *I* chose the deck each round. In reality, you have to assign a prior probability to being in the Human Deck vs. the Digital Deck. The game simulates the update *within* a class, but not the meta-probability *between* classes.

  **What Will Predictably Go Wrong**
  *   **Deck Confusion:** Someone will ask "Wait, are we still in the Human deck?" mid-round. Write the active Round Number huge on the board.
  *   **Philosopher Stalling:** Grad students love to argue. The Philosopher might turn the defense into a 10-minute lecture. Give them a 2-minute sand timer for each defense.
  *   **Chip Hoarding:** If someone loses all chips in Round 1, they disengage. Allow a "bankruptcy loan" of 5 chips from the instructor so they stay in the game for Round 3.
  *   **Math Panic:** Some will try to calculate exact Bayesian updates on the fly. Tell them "gut feeling based on rank" is enough; we're testing intuition, not arithmetic.
