  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* the tea analogy is a strawman? *Correction:* Need to emphasize that omitting a good act leaves a "moral residue" or missed opportunity, whereas tea/coffee has none.
      *   *Check:* Did I address the utilitarian part fairly? *Correction:* Acknowledge that Peter Singer (a utilitarian) basically argues the book is right (there is no supererogation), so the book is describing a real tension.
