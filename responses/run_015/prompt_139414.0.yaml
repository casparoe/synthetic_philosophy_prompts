answer: |-
  This is a fantastic set of questions. You have intuitively spotted the exact pressure points that professional ethicists argue about. Your brother-in-law is half-right: the "tea vs. coffee" analogy is indeed a simplification that many philosophers reject, but the book isn't necessarily lying; it's likely presenting a specific, non-utilitarian perspective as if it were common sense.

  Here is a claim-by-claim breakdown of what working philosophers generally accept, what is debated, and what is likely oversimplified, followed by an analysis of your three cases and the "mirror image" problem.

  ### Part 1: Claim-by-Claim Breakdown

  **1. The Definition of Supererogation**
  *   **The Book:** "Actions beyond the call of duty... doing them makes you a hero; not doing them isn't wrong."
  *   **The Verdict:** **Accurate.** This is the standard, textbook definition (often traced to J.O. Urmson's 1958 paper *Saints and Heroes*). Almost everyone agrees on this basic mapping: Duty (Required), Forbidden (Wrong), Supererogatory (Optional but Good).

  **2. The "Tea vs. Coffee" Analogy**
  *   **The Book:** "Not giving to charity is morally on a par with having tea instead of coffee."
  *   **The Verdict:** **Your brother-in-law is right; this is a strawman/oversimplification.**
  *   **Why:** In ethics, there is a difference between *morally neutral* (tea vs. coffee) and *morally optional* (giving vs. not giving).
      *   If you choose tea over coffee, the universe contains no more or less moral value.
      *   If you choose *not* to throw yourself on a grenade, the universe contains *less good* than if you had, even if you aren't to blame for it.
      *   Most philosophers argue that omitting a supererogatory act leaves a "moral residue." You aren't *guilty*, but you haven't achieved the same moral standing as the hero. Treating them as identical (tea/coffee) erases the value of the good you *could* have done. It turns morality into a binary pass/fail system, which many find counterintuitive.

  **3. The Utilitarian Critique**
  *   **The Book:** "Utilitarianism falls apart... everything good is mandatory and sainthood is just the minimum."
  *   **The Verdict:** **Fair simplification, but ignores nuance.**
  *   **Why:** For *Act Utilitarians* (who say you must maximize good in every single instance), the book is correct: supererogation doesn't exist. If saving the child costs you less than the value of the child's life, you *must* do it. To an Act Utilitarian, the "hero" is just doing their job.
      *   *However:* Some utilitarians argue for "Satisficing Utilitarianism" (you only need to do *enough* good, not the *most* good) or "Rule Utilitarianism" (we should follow rules that generally maximize good, and a rule allowing rest/leisure maximizes good long-term). These versions try to carve space for supererogation back in. But generally, yes, traditional utilitarianism is hostile to supererogation.

  **4. The "Collapse" Argument**
  *   **The Book:** "If the heroic act is the best thing... and you always have most reason to do the best thing, then it's required... the category collapses."
  *   **The Verdict:** **This is a live debate, not a knockdown argument.**
  *   **Why:** This is known as the **Paradox of Supererogation**. It relies on the premise: "Rationality always demands the best option."
      *   Many philosophers reject that premise. They argue we have a "prerogative" to prioritize our own lives. I might have *most reason* to save the stranger, but I am *permitted* to save my own child instead.
      *   Others argue that "reason" splits into "moral reasons" (save the stranger) and "personal reasons" (protect my future). When they conflict, morality doesn't always win.
      *   So, the book presents a serious philosophical objection as if it were a logical proof. It's not settled.

  **5. Credit for Duty**
  *   **The Book:** "You can't deserve any credit at all for merely doing your duty."
  *   **The Verdict:** **Controversial / Often Rejected.**
  *   **Why:** This is a very Kantian view (duty is the baseline; doing it is just normal). But in Virtue Ethics and common sense, we *do* praise people for doing their duty reliably.
      *   Example: A nurse who is kind, punctual, and careful is "just doing their duty," but we still praise them and consider them morally good. If they get no credit, then morality becomes a burden we endure rather than a character trait we cultivate. Most modern ethicists would say you get *some* credit for doing duty well, just not *extra* credit.

  ---

  ### Part 2: Your Three Cases

  You have intuitively reconstructed arguments that appear in the literature. Here is how a philosopher would categorize them.

  **1. The Cost Slider (Button vs. Interview)**
  *   **The Philosophical Concept:** *The Threshold of Sacrifice.*
  *   **Analysis:** Most theories agree that supererogation requires *some* significant cost or risk.
      *   **Version A (Button):** This is likely a **Duty**. There is a principle called the "Easy Rescue Principle." If you can save a life at negligible cost, you are obligated to do it. Failing to press the button makes you a jerk (and possibly morally culpable).
      *   **Version B (Interview):** This is **Supererogatory**. The cost is significant (livelihood, future stability).
      *   **The Line:** You asked where the line is drawn. Philosophers admit this is the **Vagueness Problem**. There is no bright line. It is a spectrum. As the cost rises, the obligation fades until it becomes optional. The book's "tea/coffee" claim fails here because missing the interview is definitely not morally equivalent to tea/coffee; it's a significant moral sacrifice.

  **2. The Lifeguard (On Shift vs. Off Shift)**
  *   **The Philosophical Concept:** *Special Obligations (or Role Obligations).*
  *   **Analysis:** This is standard ethics. Morality isn't just "one size fits all."
      *   **On Shift:** She has entered a contract. She has assumed a **Duty**. If she doesn't dive, she is negligent and blameworthy.
      *   **Off Shift:** She reverts to a general moral agent. The dive is now **Supererogatory**.
      *   **Why?** It's not just the job description; it's about *reliance* and *consent*. Society relies on her on shift; she consented to that risk for pay. On her day off, that specific reliance and consent vanish. This doesn't break the model; it adds a layer of "professional ethics" on top of "general ethics."

  **3. The Mixed Ones (Promotion / Brother)**
  *   **The Philosophical Concept:** *Motive vs. Action.*
  *   **Analysis:** Supererogation is usually defined by the **action's status**, not the **agent's psychology**.
      *   **The Promotion:** If you run into the burning building primarily for the reward, some might say you aren't a "hero" in character, but the *act* remains supererogatory because it was risky and optional. However, if the benefit (promotion) outweighs the risk, it might slide back toward "rational self-interest" and lose its heroic status.
      *   **The Kidney:** Giving a kidney to a brother is often considered a **Duty of Special Relationship**. Because he is family, many argue you *owe* him more than a stranger. If you view family obligations as duties, this isn't supererogatory. If you view all bodily sacrifice as optional, it is supererogatory.
      *   **Key Takeaway:** Getting something out of it doesn't automatically disqualify an act, but it complicates the "sacrifice" requirement. If the net cost to you is zero (or positive), it's harder to call it supererogatory.

  ---

  ### Part 3: The Mirror Image (Suberogation)

  **The Book:** "There's no mirror image, no such thing as something bad but not forbidden."
  **The Verdict:** **This is widely considered wrong.**

  *   **The Concept:** This is called **Suberogatory** action (coined by Roderick Chisholm).
  *   **Examples:** Being rude to a waiter, cheating on a spouse emotionally but not physically, being stingy when you could be generous.
  *   **Why it matters:** These actions are often not "forbidden" (you won't go to hell, you aren't violating a right), but they are definitely morally worse than the alternative.
  *   **Why the book denies it:** If the book is arguing for a strict Duty/Optional binary, admitting suberogation weakens their "tea/coffee" analogy. If you can be "bad but not wrong," then morality isn't just a pass/fail test. Admitting suberogation forces the book to admit that the "optional" zone has moral texture. By denying it, they keep their system clean but less accurate to real life.

  ---

  ### Part 4: Should You Distrust the Book?

  **How much to trust it:**
  Read the book as **an argument, not a map.**
  The chapter is likely written by a non-utilitarian (probably a deontologist or virtue ethicist) who wants to defend the idea that we are allowed to have personal lives. To do that, they are simplifying the opposing view (utilitarianism) and presenting their own preferred categories as settled facts.

  **What is missing:**
  1.  **The "Demandingness Objection":** The real reason philosophers invented supererogation is to stop morality from becoming too demanding. If morality requires you to give away all your money until you are as poor as the people you help, nobody would be moral. Supererogation is a pressure valve to make morality livable. The chapter hints at this but frames it as "heroism" rather than "psychological necessity."
  2.  **The Spectrum of Praise:** The book treats praise as binary (Hero vs. Normal). In reality, we praise people for doing their duty *well*, and we praise supererogatory acts *more*.
  3.  **Cultural Variance:** What is "duty" in one culture (caring for elderly parents) is "supererogatory" in another. The book treats these categories as universal laws rather than social constructs.

  **Summary Advice:**
  *   **Trust:** The basic definition of supererogation (heroes, optional, good).
  *   **Question:** The "tea/coffee" equivalence (omission has moral weight).
  *   **Question:** The claim that suberogation doesn't exist (petty selfishness is real).
  *   **Question:** The idea that the "Collapse Argument" is proven (it's a paradox, not a proof).

  Your brother-in-law was right to flag the tea analogy. It suggests that if you don't save a drowning child (when it's safe to do so), you've just chosen "coffee." Most people feel that's morally wrong, not just neutral. The book is trying to protect you from guilt, but it's doing so by blinding you to the value of the good you didn't do.
