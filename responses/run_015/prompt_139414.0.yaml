      *   *Section 2: The Three Cases.*
          *   Cost Slider: Discuss the "threshold" view vs. "sliding scale." Mention the "Easy Rescue" principle (low cost = duty).
          *   Lifeguard: Role Obligations. This is standard ethics. Contracts create specific duties.
          *   Mixed Motives: Motive vs. Action. Supererogation is about the act's status, not just the psychology.
      *   *Section 3: The Mirror Image (Suberogation).*
          *   Explain "Suberogatory." The book is wrong/oversimplified here.
