prompt: |-
  I've been reading a chapter in one of those popular "big questions" ethics books (not naming it) about doing more than morality asks, and I have no philosophy background so I can't tell how much of it to trust. Roughly, and mostly in its own words, it says:

  "Some actions are supererogatory — they go beyond the call of duty. Throwing yourself on a grenade, giving away half your income, running into a burning building. Doing them makes you a hero; not doing them isn't wrong and nobody can blame you. Morality has a required part and a forbidden part, and supererogation is just the bit sticking out past the required part: an optional bonus zone where you're free to add extra good if you feel like it. Genuinely optional, though — not giving to charity is morally on a par with having tea instead of coffee. This is also where utilitarianism falls apart, because it says you always have to produce as much good as you can, so for a utilitarian everything good is mandatory and sainthood is just the minimum. And there's a deeper problem: if the heroic act is the best thing you could do, and you always have most reason to do the best thing, then it's required after all, and the whole category collapses back into ordinary duty."

  My brother-in-law took two philosophy classes in college and says the "its just like tea" bit in particular is a strawman, but he won't explain why. So: claim by claim, what would someone who actually works on this accept, what's a fair simplification for a general reader, and whats just wrong? Is the stuff about utilitarianism a real problem for that view or a caricature of it, and is the last bit a knockdown argument or one of those things people are still arguing about? The chapter also says in passing that you can't deserve any credit at all for merely doing your duty — is that right?

  Three cases I came up with myself that the book doesn't touch and that I definately can't fit into its picture:

  1. The cost slider. Same rescue: version A costs me nothing, I just press a button; version B costs me a job interview that would have landed me a 50k job. B feels clearly heroic, A feels like I'd be a jerk not to. If "supererogatory" just tracks how expensive the act is for me, where does the line get drawn — or is it only a sliding scale where we all agreed to be lenient past a certain point? And does the free version become a real duty, or stay optional?

  2. My friend is a lifeguard. Same dive, same risk, but on shift she says it's just her job, and on her day off the same thing is heroic. Does a job description really create a moral duty out of nothing, or is the real difference about what she agreed to, what other people can demand of her, or what she's owed for it?

  3. The mixed ones. The rescue that also gets you a promotion. The kidney you give your brother. Does getting something out of it disqualify an act from being supererogatory, or is the category about cost and risk rather than about why you did it?

  One more: the book says there's no mirror image, no such thing as something bad but not forbidden. That suprised me, because petty selfishness seems exactly like that to me.

  And finally: how much should this make me distrust the rest of the book, and is there something big the chapter left out that changes the picture?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user read a chapter in a popular ethics book about *supererogation* (actions beyond duty).
      *   **User's Background:** No philosophy background.
      *   **Brother-in-law's Input:** Claims the "tea vs. coffee" analogy is a strawman but won't explain why.
      *   **Task:** Evaluate the claims claim-by-claim (what's accepted, what's simplified, what's wrong). Address the utilitarianism critique. Address the "collapse" argument. Address the "credit for duty" claim. Analyze the user's three specific cases (cost slider, lifeguard, mixed motives). Address the "no mirror image" claim (suberogation). Assess the book's overall trustworthiness and missing context.
      *   **Tone:** Accessible, nuanced, authoritative but not condescending, acknowledging the complexity of the field.

  2.  **Deconstruct the Book's Claims:**
      *   *Claim 1: Definition of Supererogation.* (Heroic, optional, not blameworthy to omit). -> *Verdict:* Generally accurate standard definition.
      *   *Claim 2: "Tea vs. Coffee" Analogy.* (Not giving to charity is morally on par with beverage choice). -> *Verdict:* This is the controversial part. It implies *moral indifference*. Many philosophers argue omitting supererogatory acts isn't *fully* morally neutral; it might be "less good" without being "wrong."
      *   *Claim 3: Utilitarianism Critique.* (Utilitarianism collapses supererogation because maximizing good is mandatory). -> *Verdict:* Largely accurate regarding *act* utilitarianism, but nuanced regarding *rule* utilitarianism or satisficing utilitarianism.
      *   *Claim 4: The Collapse Argument.* (If it's the best thing, you have most reason to do it, so it's required). -> *Verdict:* This is the "Paradox of Supererogation." It's a live debate, not a settled knockdown.
      *   *Claim 5: Credit for Duty.* (No credit for merely doing duty). -> *Verdict:* Controversial. Kantians might agree (duty is baseline), but virtue ethicists and common sense disagree (praiseworthy to do duty reliably).

  3.  **Address the User's Three Cases:**
      *   *Case 1: Cost Slider.* (Button press vs. missing interview). -> *Analysis:* Supererogation is often defined by *sacrifice*. Low cost = duty (easy rescue). High cost = supererogatory. The line is fuzzy (the "continuum problem").
      *   *Case 2: Lifeguard.* (On shift vs. Off shift). -> *Analysis:* Role obligations. Special duties arise from roles/contracts. Off-shift, she reverts to general moral agent status. This fits standard deontological/contractual views.
      *   *Case 3: Mixed Motives/Benefits.* (Promotion, family). -> *Analysis:* Supererogation focuses on *optionality* and *sacrifice*, not purely altruistic motive. Benefiting doesn't necessarily negate the "beyond duty" status, though it complicates the "sacrifice" element.

  4.  **Address the "Mirror Image" Claim (Suberogation):**
      *   *Claim:* No such thing as bad but not forbidden.
      *   *Analysis:* This refers to *suberogatory* actions. Roderick Chisholm coined this. Petty selfishness is often cited as an example. The book is likely oversimplifying here.

  5.  **Evaluate the Book's Trustworthiness:**
      *   The "tea/coffee" analogy is indeed a bit of a strawman or at least a strong simplification that ignores the "moral value" of omission.
      *   The utilitarian critique is standard but ignores nuances.
      *   The "collapse" argument is a known philosophical problem, not a settled fact.
      *   *Overall:* The book seems to be presenting one side of a debate (likely a non-consequentialist defense of supererogation) as settled fact. It's not "trash," but it's partisan.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's good questions. Validate the brother-in-law's intuition without dismissing the book entirely.
      *   *Section 1: Claim-by-Claim Breakdown.*
