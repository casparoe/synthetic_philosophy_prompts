answer: |-
  # Workshop Activity: The Attention Ledger

  **Time:** 90 Minutes
  **Participants:** 8 Graduate Students
  **Materials:** 80 Poker Chips (10 per student), 1 Deck of Cards (for the "World State"), Printed Decision Sheets, Whiteboard.

  ## 1. The Setup (10 Minutes)
  Tell the students they are "Epistemic Agents" allocating limited cognitive resources. The goal is to maximize "Impact Points."

  *   **Endowment:** Each student receives **10 Attention Chips**.
  *   **Currency:** Unspent chips are worth **1 Point** each at the end of the game.
  *   **The World State:** You (the facilitator) hold a deck of 10 cards. 1 Card is **"Astronomical"** (Gold Back). 9 Cards are **"Mundane"** (Blue Back). This represents the true probability of a high-impact intervention working (10%). *Do not reveal this ratio yet.*

  ## 2. The Mechanics (15 Minutes)
  Write the three available actions on the whiteboard.

  **A. Secure the Local (Safe Option)**
  *   **Cost:** 0 Chips.
  *   **Payoff:** Guaranteed **15 Points**.
  *   **Logic:** Low impact, high certainty.

  **B. Investigate the Tail (Epistemic Labor)**
  *   **Cost:** **3 Chips** per probe.
  *   **Action:** You may draw a card from the World Deck, look at it, and return it (shuffle required).
  *   **Info:** This tells you if the current "climate" is favorable. (See *The Twist* below).
  *   **Constraint:** You cannot take Action C (The Bet) if you have fewer than 5 Chips remaining.

  **C. The Astronomical Bet (Fanatic Option)**
  *   **Cost:** **5 Chips** (Wagered).
  *   **Payoff:** If the top card of the deck is **Astronomical**, you win **20 Points per Chip Wagered** (Total 100 Points). If **Mundane**, you win **0**.
  *   **Unspent Chips:** Any chips left after the wager are kept at 1 Point each.

  **The Twist (Weaponized Uncertainty):**
  To make the EV calculation work as intended, you must introduce a **Verification Penalty**.
  *   *Rule:* If a student chooses **Action B (Investigate)**, they must reveal the card they drew to the *whole table*.
  *   *Crucially:* If an **Astronomical** card is revealed during investigation, it is **removed from the deck** for the final betting round.
  *   *Why:* This simulates that "using up" epistemic attention to verify a tail risk can diminish the opportunity to capture it (e.g., by alerting competitors, using up the window of opportunity, or simply the cognitive toll reducing execution quality).
  *   *Result:* Investigating *lowers* the probability of success for the Astronomical Bet if you find a positive signal. Ignorance preserves the probability.

  ## 3. The Play (30 Minutes)
  1.  **Phase 1 (Deliberation):** Students decide how many chips to spend on Investigation (0, 3, 6, or 9).
      *   *Note:* If they spend 6 or 9, they have 4 or 1 chips left. They are **physically unable** to place the 5-chip Astronomical Bet. This forces **Paralysis**.
  2.  **Phase 2 (Execution):** Collect Investigation bets. Draw cards for those who paid. Reveal and remove if Astronomical.
  3.  **Phase 3 (Commitment):** Students decide: Safe Option or Astronomical Bet (if they have ≥5 chips).
  4.  **Phase 4 (Resolution):** Reveal the top card of the remaining deck. Calculate scores.

  ## 4. The Math Trap (For Your Eyes Only)
  *   **Initial EV of Astronomical Bet:** 10% chance × 100 Points = **10 Points**.
      *   Wait, 10 Points is less than the Safe Option (15 Points). *Correction:* To make EV dominate, increase the Payoff to **200 Points** (20 per chip).
      *   **Revised EV:** 10% × 200 = **20 Points**. (Beats Safe Option of 15).
      *   **Net EV:** 20 Points + (Remaining Chips).
  *   **Scenario 1: Reckless Commitment (0 Investigation)**
      *   Spend 5 on Bet, Keep 5.
      *   EV = 20 (Bet) + 5 (Keep) = **25 Points**.
      *   *Risk:* 90% chance of getting only 5 points.
  *   **Scenario 2: Epistemic Humility (1 Investigation)**
      *   Spend 3 on Info, 5 on Bet, Keep 2.
      *   **Cost:** You reduced the deck size. If you found the Gold Card, P(Win) drops to 0%. If you found Blue, P(Win) rises slightly (1/9 ≈ 11%).
      *   **Expected Value of Info:** Because removing the Gold Card is catastrophic for the EV, the *expected* value of investigating is **negative**.
      *   EV = (Lowered Probability × 200) + 2 (Keep) - 3 (Cost).
      *   *Result:* The rational EV maximizer **must not investigate**. Investigating destroys value.
  *   **Scenario 3: Paralysis (2+ Investigations)**
      *   Spend 6 on Info. 4 Chips left.
      *   **Cannot Bet.** Forced into Safe Option (15) + 4 Keep = **19 Points**.
      *   *Result:* Lower than Reckless Commitment (25 EV).

  **The Lesson:** The math forces them to realize that *checking* the tail risk is irrational if the tail is fat enough and the cost of checking is non-zero.

  ## 5. The Debrief (35 Minutes)

  **Part 1: The Split (10 mins)**
  Ask for a show of hands:
  1.  Who went for Reckless Commitment (No investigation, Bet the Tail)?
  2.  Who went for Paralysis (Over-investigated, Couldn't Bet)?
  3.  Who took the Safe Option?

  Map the room. Usually, philosophers will try to investigate (humility) and end up paralyzed, or they will feel morally repulsed by betting blind and take the Safe Option. Only the cold EV maximizer bets blind.

  **Part 2: Weaponized Uncertainty (15 mins)**
  Drive home the specific philosophical point.
  *   **The Intuition:** "I should check my probabilities before betting the farm." (Epistemic Humility).
  *   **The EV Reality:** "Checking costs resources. If the Tail is big enough, the cost of checking exceeds the value of the information."
  *   **The Fanaticism Trap:** This means EV reasoning doesn't just tell you to *chase* tails; it tells you to **protect your ignorance** about them. If you learn the probability is lower than you hoped, you lose the EV justification. Therefore, maintaining uncertainty is instrumentally rational.
  *   **Discussion Question:** "Does this mean a consistent EV maximizer should avoid learning about the risks of their own interventions?"

  **Part 3: Limitations & Morality (10 mins)**
  Be frank about the abstraction.
  *   **The Chip Economy:** Chips are fungible. Moral stakes are not. In the real world, "Paralysis" (doing nothing) might be worse than "Recklessness" (trying and failing), or vice versa.
  *   **Moral Distance:** In the game, the points are yours. In fanaticism (e.g., longtermism), the points belong to strangers who don't exist yet. The "Reckless Commitment" feels less greedy when it's for others, but the *epistemic* problem remains: You are betting other people's futures on a probability you refused to check.
  *   **Conclusion:** EV fanaticism isn't just about greed; it's about an epistemic structure that punishes verification.

  ## 6. What Will Go Wrong (Facilitator Warnings)

  1.  **The Hoarding Problem:**
      *   *Risk:* Students might realize keeping 10 chips guarantees 10 points, plus Safe Option 15 = 25 points. This matches the EV of the Bet. Risk-averse students will hoard.
      *   *Fix:* Change Safe Option to **12 Points**. Now Bet EV (25) clearly dominates Hoard+Safe (22). Force the risk.

  2.  **Collusion / Information Sharing:**
      *   *Risk:* Students might say, "I'll investigate and tell you what I saw so you don't have to spend chips."
      *   *Fix:* Rule that Investigation is **Private** but costs **Public Trust**. Or, simpler: "Information is non-transferable. You must spend your own attention to verify." (Stick to the private draw rule).

  3.  **The "All-In" Misunderstanding:**
      *   *Risk:* Students think they can bet *all* 10 chips on the Astronomical option.
      *   *Fix:* Hard cap the Bet at 5 Chips. This ensures that spending 6 on investigation *physically prevents* the bet, creating the Paralysis mechanic.

  4.  **Cynicism:**
      *   *Risk:* "It's just a game, I don't care about points."
      *   *Fix:* Offer a tangible reward for the highest score (e.g., you buy coffee, or they get to choose the next reading). Or, frame it as "Who has the most coherent decision theory?" appealing to their grad student pride.

  5.  **Time Creep:**
      *   *Risk:* The math discussion drags on.
      *   *Fix:* Hand out a **Cheat Sheet** with the EV calculations pre-printed. Do not let them derive the EV on the whiteboard. Give them the numbers, ask them to interpret the *implication*.

  ## 7. Cheat Sheet Content (Print this)
  *   **Safe Option:** 15 Points (Guaranteed).
  *   **Tail Bet:** Cost 5 Chips. Win 200 Points (if Gold Card), 0 (if Blue).
  *   **Investigation:** Cost 3 Chips. Reveals 1 Card (Removed if Gold).
  *   **Chip Value:** 1 Point each.
  *   **Current Deck:** 10 Cards (1 Gold, 9 Blue).
  *   **EV of Tail Bet (No Info):** 0.10 × 200 = 20 Points.
  *   **EV of Tail Bet (After 1 Blue Reveal):** 0.11 × 200 = 22.2 Points.
  *   **EV of Tail Bet (After 1 Gold Reveal):** 0.00 × 200 = 0 Points.
  *   **Expected Value of Investigation:** (90% × 22.2) + (10% × 0) = **19.98 Points**.
  *   **Net Cost of Investigation:** You lose 0.02 EV points *plus* you pay 3 Chips (3 Points). **Total Loss: 3.02 Points.**
  *   **Conclusion:** Investigating is strictly dominated by Blind Betting.
