prompt: |-
  ok so i run a grad workshop on decision theory — like 8 people, 90 minutes, mostly philosophers who dont do formal stuff. i want an in-class game that makes them feel the pull of expected-value fanaticism, but not the boring version where you just say "tiny chance of saving the world." i want them to hit the weirder problem: that once you accept EV reasoning, your epistemic humility about the tail probabilities actually becomes a reason to chase them harder, and the result looks less like greed and more like compulsive checking. design a table-top activity with physical tokens: each student gets an "attention budget" of 10 chips they can spend investigating outcomes, but investigating one tail risk costs 3 chips and reveals only noisy info. the payoff matrix should have local safe options vs remote astronomical ones, scaled so that EV dominates only if you dont spend chips investigating. the rules should force a choice between paralysis (all chips gone, no decision) and reckless commitment (bet on the tail with no investigation). include a debrief that maps the paralysis/commitment split onto the fanaticism debate — specifically the idea that EV doesnt just overweight tails, it weaponizes uncertainty — and be frank that the chip economy cant reproduce the actual moral distance of strangers. also warn me what'll go wrong the first run, like someone hoarding chips or the group colluding. no need for citations, i'll fill those in.
