answer: |-
  # JOB TALK PREP SHEET: "Debunking Within Jurisdiction"

  **To:** Candidate
  **From:** Search Committee Prep
  **Re:** Q&A Strategy for Metaethics/Moral Psychology Search

  This sheet is designed for the specific faculty profile you described. The order below reflects the typical arc of a philosophy Q&A: framing challenges first, followed by empirical/metaethical objections, and concluding with practical implications and "kill shots."

  ### I. STRATEGIC CONCESSIONS & REFUSALS

  **1. Concede Preemptively: The "Action Guidance" Worry (Political Phil)**
  *   **Why:** The Search Chair needs to know you aren't leaving them with paralysis on climate policy. If you wait to be asked, you look naive about applied ethics.
  *   **How:** In your concluding remarks, explicitly state: *"I recognize this leaves a gap for immediate policy action. That is precisely why the 'Calibrated Extension' procedure is not just theoretical but practical: it allows us to act on empirical premises while we suspend the debunked intuitions."*
  *   **Benefit:** Shows you have a constructive project, not just a destructive one.

  **2. Refuse to Concede: The "Truth-Tracking" Assumption (Constructivist)**
  *   **Why:** If you concede that moral judgment isn't in the business of tracking truth (or stability/accuracy), your entire distinction between "debunked" and "surviving" judgments collapses. You become a constructivist by default.
  *   **How:** *"My argument is conditional: IF we are interested in truth-tracking (or objective correctness), THEN the jurisdictional limit applies. I am not arguing against constructivism, but showing that even realists must accept this jurisdictional limit."*
  *   **Benefit:** Keeps your metaethical lane clear without fighting a war you can't win in 20 minutes.

  **3. The Single Most Crucial Objection for Publishability**
  *   **The Charge:** **Gerrymandering the Domain (Naturalist Realist #2).**
  *   **Why:** If referees believe you drew the "ancestral domain" line specifically to save the intuitions you like (kinship) and debunk the ones you dislike (borders), the paper is dead on arrival. You must demonstrate the *independence* of the domain criterion from your moral conclusions.
  *   **Prep:** Have a second example ready where an intuition you *like* gets debunked, or one you *dislike* survives, to prove the test isn't rigged.

  ---

  ### II. CRITICAL VULNERABILITY: THE SELF-APPLICATION WORRY

  **Assessment:** **Yes, this is the question you should be most afraid of.**
  **Damage Estimate:** **High.** If the distinction between "in-domain" and "out-of-domain" is itself a theoretical judgment reached recently using high-level cognitive faculties, your own criteria classify *your theory* as out-of-domain and therefore debunked. This is a self-defeat charge.

  **The Least-Bad Reply:**
  Distinguish between **First-Order Moral Judgments** (the target of the debunking) and **Second-Order Meta-Ethical/Empirical Claims** (the tool used to debunk).
  *   *"The debunking argument targets moral intuitions claiming normative authority. My thesis is an empirical hypothesis about the cognitive origins of those intuitions, justified by evolutionary biology and philosophy of science, not by moral intuition. The 'Displacement Test' relies on anthropological data, not moral conscience. Therefore, the theory is not subject to the moral debunking it prescribes."*
  *   **Weakness:** This relies on a sharp fact/value distinction that many in the room (especially the Constructivist) will reject. You are betting that the empirical basis of your claim insulates it from moral debunking.

  ---

  ### III. Q&A OBJECTION & REPLY MATRIX (8-10 Objections)

  **1. The Constructivist Generalist (Framing Challenge)**
  *   **Objection:** "You're framing this as if moral judgment is a truth-tracking faculty that *could* fail. But if morality is constructed by our practices, evolutionary history doesn't debunk it; it explains it. Why should I accept your realist framing?"
  *   **Reply:** "I'm not arguing that constructivism is false. I'm arguing that *even if* you are a realist, you must accept this jurisdictional limit. Think of this as a conditional: If you want truth-tracking, you can't get it out-of-domain. This leaves constructivism untouched, but it tightens the noose on realism."
  *   **Weakness:** You aren't really answering them; you're bracketing them. They may press that the "truth-tracking" assumption is the real problem.

  **2. Naturalist Realist #1 (Defeater Status)**
  *   **Objection:** "You treat 'no available explanation of the correlation' as a defeater. But in science, lack of explanation is just a research gap. Why think the absence of a story about selection tracks falsity rather than just our current ignorance?"
  *   **Reply:** "Because the debunker's dilemma forces a choice: either the correlation is lucky, or the facts depend on us. If it's lucky, probability is low. If it depends on us, they aren't mind-independent facts. It's not ignorance; it's a structural gap in the realist's explanatory resources."
  *   **Weakness:** You are conceding the "Luck Premise." If they have a Third-Factor argument ready, this reply doesn't block it.

  **3. Naturalist Realist #2 (Gerrymandering Charge)**
  *   **Objection:** "The 'Ancestral Domain' looks suspiciously convenient. It saves kinship partiality (which everyone likes) and debunks national borders (which liberals dislike). How do we know you haven't just drawn the line to match your antecedent politics?"
  *   **Reply:** "The line is drawn by anthropological data on Pleistocene social structures, not moral preference. For example, the intuition that 'promise-keeping is absolute' might feel in-domain, but if it relies on written contracts, it gets debunked by my test. The test bites friends and foes alike."
  *   **Weakness:** You need that example ready. If you stumble, you look biased.

  **4. Phil of Biology (Cultural Evolution)**
  *   **Objection:** "You assume a fixed Pleistocene adaptation. But cultural evolution creates novel cognitive capacities. We have 'mismatch' but we also have 'scaffolded' cognition. Why think the faculty can't extend to large-scale cooperation via culture?"
  *   **Reply:** "Culture scaffolds capacity, but it doesn't create new *foundational* valuations from scratch. It repurposes old ones. My claim is that the *weight* we assign to distant strangers is an extrapolation, not a new tracking mechanism. The scaffolding explains the judgment, not its truth."
  *   **Weakness:** This concedes that the faculty is plastic, which weakens the "fixed domain" premise.

  **5. Cognitive Scientist (Falsifiability)**
  *   **Objection:** "The 'Displacement Test' seems unfalsifiable. Any judgment can be story-told as an extrapolation from small-band dynamics. How could you possibly prove a judgment *isn't* an ancestral extrapolation?"
  *   **Reply:** "By looking for discontinuities in cognitive processing. If judgments about distant strangers recruit different neural machinery than judgments about kin, that supports the domain shift. If they recruit the same machinery but apply it to impossible inputs, that supports the mismatch claim."
  *   **Weakness:** You are pivoting to empirical claims you might not be able to back up in a philosophy talk.

  **6. Phil of Religion (The Religious Analogy)**
  *   **Objection:** "If evolutionary history debunks out-of-domain moral judgments, why doesn't it debunk religious belief? And if religion gets a jurisdictional escape, why doesn't morality?"
  *   **Reply:** "Religious belief often posits entities (gods, spirits) that arguably *were* part of the ancestral social environment (hyper-active agency detection). Morality posits abstract obligations to non-existent entities (future generations, the State). The ontology differs."
  *   **Weakness:** This is empirically contentious. Many argue religious beliefs are also out-of-domain.

  **7. Political Phil / Search Chair (Action Guidance)**
  *   **Objection:** "Okay, suppose you're right. Climate policy requires out-of-domain thinking. If those intuitions are debunked, what do we *do*? Do we stop climate action until we finish your 'Calibrated Extension'?"
  *   **Reply:** "No. We act on the 'Calibrated Extension.' We take the in-domain principle ('suffering is bad') and chain it to empirical premises ('CO2 causes suffering'). We don't need the intuition that 'we owe it to the future'; we need the premise that 'future people will suffer.'"
  *   **Weakness:** It changes the *motivation* for policy, which might be politically unstable.

  **8. Skeptic (Calibrated Extension Circularity)**
  *   **Objection:** "Your replacement procedure chains in-domain principles to empirical premises. But selecting *which* in-domain principles to keep (e.g., 'suffering is bad') is itself a moral choice. Isn't that just intuition smuggling?"
  *   **Reply:** "It's not smuggling; it's foundationalism. We have to start somewhere. The claim is that *those* principles survive the debunking argument, while the extrapolations don't. It's a narrower base, not a circular one."
  *   **Weakness:** Admitting you need a "narrow base" concedes that global realism is dead.

  **9. Realist / Skeptic (Third Factor / Pre-established Harmony)**
  *   **Objection:** "You ignore the Third Factor response. Maybe evolution tracked survival, and survival tracks moral truth, so the correlation isn't lucky. Why doesn't this save the out-of-domain judgments?"
  *   **Reply:** "Third Factor works for general goods like 'survival.' It doesn't explain specific out-of-domain verdicts like 'we owe reparations for colonialism.' Selection didn't track colonial justice. The link breaks at the level of specific institutional obligations."
  *   **Weakness:** You have to argue that the Third Factor is too coarse-grained to save the specific judgments.

  **10. The Self-Application Worry (The Meta-Worry)**
  *   **Objection:** "Your theory is a recent, theoretical judgment about cognitive faculties. By your own Displacement Test, isn't *this theory* out-of-domain and therefore debunked?"
  *   **Reply:** "The theory is a second-order claim justified by empirical science and philosophical argument, not by moral intuition. The Displacement Test targets normative claims, not meta-ethical hypotheses. The tool is not made of the material it tests."
  *   **Weakness:** As noted above, this relies on a fact/value distinction the Constructivist will deny. If they press, admit: *"If my meta-ethics relies on moral intuition, I am debunked. If it relies on science, I am not. I claim the latter."*

  ---

  ### IV. FINAL ADVICE ON TIMING

  *   **Minutes 0-5 of Q&A:** Expect framing objections (Constructivist, Realist #1). Keep answers crisp to save time.
  *   **Minutes 5-15:** The empirical heavy lifting (Bio, CogSci, Religion). This is where you win or lose the "Moral Psychology" part of the search. Don't get bogged down in biological details; defer to "ongoing empirical work."
  *   **Minutes 15-20:** The Practical & Kill Shots (PolPhil, Self-Application). End on the "Calibrated Extension" note. You want the last thing they hear to be that you have a *solution*, not just a problem.

  **Good luck. The project is strong, but the "Gerrymandering" and "Self-Application" charges are the only ones that can sink the hire. Guard those flanks.**
