answer: |-
  Hi there, it is great to hear from you and I completely agree that the class needs to move past the boxes. The fatigue sets in quickly when the props remain the same, even if the underlying logic shifts. I have designed a simulation called the Three Cities Protocol that should fit your seventy-five minute window and hit the specific philosophical notes you are aiming for, particularly the deliberative instability that characterizes the Death in Damascus case without relying on the standard binary setup. I am going to be candid with you right at the start about the cycling constraint you mentioned because I think it is crucial for your preparation. If you set up three symmetric destinations with symmetric payoffs, you will not get a strict preference cycle where the group collectively prefers A to B, B to C, and C to A. That kind of intransitivity usually requires asymmetric payoffs which would muddy the waters regarding the predictor. What you will get instead, and what you should aim for, is deliberative instability where every specific choice feels self-undermining the moment it is made. I recommend you frame this explicitly for the students as the target phenomenon rather than promising a rock-paper-scissors style cycle, as the former is the actual philosophical problem inherent to causal decision theory in this context.

  To run this you will need to send a one-question email to the fourteen students the night before the seminar asking them to indicate which of three cities they would instinctively choose if they had to flee Death tomorrow, labeling them City Alpha, City Beta, and City Gamma. You will use these responses to generate your predictions before they walk into the room. In the classroom, arrange the desks so there are three clear zones or simply project three large labels on the screen. Each student starts with an endowment of twenty points which count towards their participation grade, and surviving a round earns them ten points while dying earns zero. You act as Death, and you hold a sealed envelope for each student containing your prediction of their choice for the first round, which is based directly on their pre-class email response. This establishes the link between their own psychology and the prediction without you needing to be a supernatural entity. You run five rounds total. In the first two rounds, they simply write their city choice on an index card and hand it to you. You reveal the predictions you made beforehand and assign life or death accordingly. You will likely find that a significant portion of them die in the first round because you predicted their instinct, which creates the initial shock that their intuition is tracked.

  For the third round you introduce the twist you requested. Tell them they now have access to a Travel Agent. They can choose to spend five points from their endowment to either pre-commit or randomize. To pre-commit, they write their choice on a card, seal it in an envelope, and hand it to a classmate who holds it until the reveal, signaling that they cannot change their mind. To randomize, they hand you three points and roll a die where one and two correspond to Alpha, three and four to Beta, and five and six to Gamma. The crucial rule you must enforce here to preserve the philosophical problem is that Death predicts the outcome of the randomization just as perfectly as a deliberate choice. If they roll a die, you still check your prediction envelope which should have anticipated the result. I suggest you handle this by telling them that your prediction model accounts for their decision to randomize and simulates the die roll based on their physical telling or simply stipulate that Death is infallible regardless of the mechanism. If you do not stipulate infallibility regarding the die roll, causal decision theory students will correctly identify randomization as a dominant strategy and the tension will vanish. You need them to feel that even paying for randomness does not escape the prediction.

  In rounds four and five, you should shift the prediction heuristic slightly to induce the behavioral cycling you are hoping for, even if it deviates from the static case. Tell them that Death has updated the model and now predicts based on their most recent choice. This means if they chose Alpha in round three, Death will be in Alpha in round four. This forces them to switch cities to survive, creating a visible A to B to C pattern of movement across the room or on their cards. This is technically a different case than the static Death in Damascus problem, but it serves your pedagogical goal of making them feel the instability viscerally. They will try to settle on a strategy, find it fails, switch, and find the ground moving beneath them. During these rounds, encourage them to discuss their reasoning with their neighbors before submitting cards, as the social deliberation often highlights the frustration of finding no stable equilibrium. You should walk around and listen for comments that indicate they feel trapped by their own reasoning, as these are the quotes you will use in the debrief.

  You asked me to be honest about what will predictably go wrong and how to handle it. The first risk is that a student will meta-game your prediction rule. Since you are using their pre-class email for the first round, a savvy student might realize this if you hint at it too strongly. If they try to choose against their instinct specifically to beat you, they might survive, which undermines the feeling of inevitability. To handle this, do not explain the prediction mechanism until the very end. If someone survives round one, simply note quietly that their profile was complex and move on. Do not let one survivor break the tension for the room. The second risk is refusal or nihilism, where a student decides the game is rigged and chooses randomly or refuses to spend points. If a student refuses to play, assign them a default choice of Alpha and proceed. If they complain that the points do not matter, remind them that the participation grade is real but also pivot to asking them why they feel the choice is meaningless, as that apathy is actually a data point for the discussion on fatalism versus decision theory. You can bring them back in by asking them to advise a friend who does care about surviving, which often re-engages them without requiring them to admit they care about the points.

  The debrief is where you must do the heavy lifting to connect the game to the theory without having lectured on it beforehand. Start by asking them why they felt compelled to switch cities in the later rounds. Map this directly to the concept of ratifiability. Explain that in causal decision theory, a choice is ratifiable only if, once you know you have made it, you still prefer it to the alternatives. In the game, the moment they settled on Alpha, the evidence that Death predicts Alpha made Beta more attractive. This is the deliberative instability you wanted them to feel. Contrast this with evidential decision theory, which would have told them that their choice is merely evidence of where Death is, so switching changes nothing about the probability of survival given the prediction is already fixed. You should draw a distinction on the board between the causal influence they have, which is zero, and the evidential correlation, which is perfect. The students who tried to randomize were attempting to find a causal lever to break the correlation, but because you stipulated Death predicts the randomization, you showed them that without a genuine causal gap, the evidential link remains unbroken.

  Finally, you must address the limitation of the simulation honestly in the last ten minutes. The game cannot deliver a truly perfect predictor because you are a human instructor using heuristics and pre-class polls. There is always a causal gap between your prediction and their choice in reality. You need to tell them that in the actual philosophical case, the predictor is part of the structure of the world such that the prediction is causally linked to the choice via a common cause or logical necessity, not just psychological profiling. Ask them to imagine that the prediction was written in the stars or determined by the laws of physics before they were born. This stipulation is necessary to close the gap between the classroom game and the thought experiment. If you do not supply this by hand, a clever student will argue that they could have outsmarted you if they tried harder, which misses the point of the impossibility result. Conclude by revealing the names of the theories and the case, letting them realize that the frustration they felt during the game was the intended lesson on the limits of causal decision theory in the face of Newcomb-like problems. This approach should give you a robust, interactive session that avoids the box fatigue while delivering the theoretical payload you need.
