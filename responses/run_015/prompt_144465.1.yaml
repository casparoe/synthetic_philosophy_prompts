prompt: |-
  You are a professional philosopher of social science specializing in causal explanation, with particular fluency in Max Weber's historical sociology and the philosophy of culture. Before you answer, take a moment to brainstorm: list every distinct interpretation you can generate, then organize them formally.

  Consider the slogan that was used to shut down debate in a graduate seminar on Weber's Protestant Ethic thesis: "Culture doesn't just reflect the economy; it selects for it." The speaker invoked it against a Marxist reductionist who treated Calvinist theology as mere ideological ornamentation to economic interests, claiming instead that religious values actively shaped which economic practices survived and spread.

  Your task is to treat that sentence not as an answer but as a compressed argument. Lay out the menu of precise theses it could express, and for each say whether it is trivial, substantive, defensible, false, or irrelevant to Weber's actual claim. Specifically:

  1. Disambiguate the slogan into at least five distinct readings. For each, specify:
     - Its logical structure (e.g., culture as an independent causal variable, as a filtering environment, as a constitutive framework without which economic actions are unintelligible, as a correlation that reveals hidden mechanisms, etc.)
     - Whether it is a platitude, a substantive claim, or false
     - Whether it requires "causation" in the mechanistic sense (psychological beliefs driving individual behavior) or can survive with a weaker relation

  2. Apply the following niche conceptual distinction rigorously: distinguish "mechanistic value-causation" (where a normative commitment operates as an internal psychological driver of action) from "selection-causation" (where a cultural framework operates like an evolutionary environment that retains, discards, or stabilizes practices regardless of individual psychology). Map at least two of your five readings onto this distinction. Say which form of causation Weber's thesis about predestination anxiety and rationalized labor actually requires, and whether the slogan clarifies or obscures that point.

  3. Identify the reading the seminar speaker likely intended, the reading the Marxist opponent was actually attacking, and whether there exists a true-but-useless reading—one that is correct but does not actually defend Weber against reductionism.

  4. Conclude with a residue report: which parts of the debate survive this precisification, and which parts turn out to be verbal disagreements about which "causation" is in play?

  Write formally, using numbered lists and clear headings. Do not provide bibliographies, citation lists, or references to specific editions. Do not quote Weber or any other author verbatim; paraphrase any claim you attribute to him. Focus on conceptual precision rather than historical scholarship.
