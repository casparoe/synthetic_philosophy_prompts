  ***

  **Sample Exam Question: Neurophilosophy Seminer 404**

  **Question 3:**
  Benjamin Libet's experiments demonstrated that the readiness potentional (RP) precedes the conscious awareness of intention (W) by approximately 350ms. Libet argued that while conscious initiation is an illusion, agency is rescued by "free won't"—the conscious ability to veto an unconsciously initiated action within the final 200ms.

  Critics argue this rescue fails. Explain why the veto mechanism does not successfully restore libertarian free will if the veto decision itself is subject to the same neural latency profile as the action. In your answer, specifically address how the principle of control applies to omissions versus actions.

  ***

  **Model Answer**

  Libet's core finding challenges the intuitive notion that conscious will causes action. If the brain shows electrical preparation (the RP) before the subject feels the urge to move, it suggests the unconscious brain decides first. Consciousness arrives late to the party, merely witnessing a decision already made. To save agency, Libet proposed the veto. He suggested that while we don't consciously start the action, we can consciously stop it. This "free won't" relies on the gap between the urge and the muscle movement. If you feel the urge but don't act, you exercised free will by omitting the action.

  However, this rescue collapses under scrutiny of the veto's own origins. The fundamental problem is that the veto is itself an event—or a non-event—that requires neural processing. If we subject the veto decision to the same empirical scrutiny as the action, we must ask: what precedes the veto? If we measure brain activity during a successful veto, we likely find neural precursors predicting the veto before the subject is consciously aware of deciding to stop.

  This creates a regress problem. If the conscious feeling of "I will stop" is preceded by unconscious neural activity, then the veto is just as determined as the action. The conscious mind is still a spectator, merely watching the brain decide not to move. The latency profile doesn't change just because the output is inhibition rather than excitation. The brain still commits to the veto before consciousness knows about it.

  This leads to the collapse of the control principle regarding omissions. Libertarians argue that moral responsibility requires control. Usually, we think control means initiating an action freely. Libet tries to shift control to the omission of an action. But for an omission to be a free exercise of agency, the agent must control the omission. If the neural causes determining the veto occur unconsciously, the agent lacks control over the omission just as they lack control over the action.

  Therefore, the distinction between acting and not-acting becomes irrelevant to the free will debate. Whether the output is a muscle contraction or a suppression of that contraction, if the decision process is rooted in unconscious neural mechanics prior to awareness, the conscious self is not the source. The veto does not escape the determinism of the readiness potentional; it just shifts the timeline slightly. Without a conscious cause for the veto, the "free won't" is just another "unconscious won't." Consequently, the library of libertarian agency remains empty because the control principle fails for both commissions and omissions alike. The subject is passive in both doing and refraining.

  ***

  **Marking Scheme**

  **A Grade (80-100%):**
  *   Identifies that the veto is subject to the same causal chain as the action.
  *   **Crucial Move:** Explicitly states that the control principle collapses for omissions (not acting) just as it does for actions.
  *   Explains that unconscious precursors to the veto render the veto unfree.
  *   Clear logical flow regarding the regress problem.

  **B Grade (60-79%):**
  *   Correctly explains Libet's RP and the veto concept.
  *   Notes that the veto might be determined.
  *   **Missing Move:** Fails to explicitly connect the lack of control to omissions/non-actions. Treats the veto as a separate category rather than applying the same neural critique to it.
  *   Good description but stops short of the philosophical implication regarding agency.

  **C Grade (50-59%):**
  *   Describes the RP and W times accurately.
  *   Mentions the veto but does not critique it effectively.
  *   Confuses the timeline or the definition of the control principle.

