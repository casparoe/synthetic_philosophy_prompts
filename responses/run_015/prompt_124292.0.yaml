answer: |-
  ### Stage 1: Candidate Concepts and Evaluation

  You have described a phenomenon that sits at the intersection of metaethics, psychometrics, and the sociology of scientific knowledge. To ensure we do not mislabel it, I will first list the closest established concepts, evaluate their fit against your description, and note where they fail.

  **1. The Motte-and-Bailey Fallacy**
  *   **Concept:** A rhetorician advances a controversial, high-value claim (the Bailey), then retreats to a trivial, defensible claim (the Motte) when challenged, only to re-assert the Bailey once the pressure subsides.
  *   **Prediction:** You would expect the "Shallow" reading (universality preserved) to be the defensive retreat used only under criticism, and the "Deep" reading (radical difference) to be the primary marketing claim.
  *   **Evaluation:** You have explicitly ruled this out, and rightly so. In the pattern you describe, both claims are asserted as substantive truths, often within the same text. The "Shallow" reading is not merely a defensive crouch; it is often presented as a sophisticated theoretical insight (e.g., "shared values, different constraints"). The movement is not a retreat from controversy to safety, but a lateral slide between two incompatible ontological claims about the data.

  **2. Measurement Invariance (Psychometrics)**
  *   **Concept:** A statistical requirement establishing that a survey instrument measures the same latent construct across different groups. If invariance holds, score differences reflect true differences in the trait. If it fails, scores are incomparable.
  *   **Prediction:** A rigorous paper would test for invariance. If invariance fails, they must claim the comparison is invalid (Shallow). If invariance holds, they claim the difference is real (Deep).
  *   **Evaluation:** This is the *methodological engine* of the maneuver, not the maneuver itself. The pattern you observe is the *exploitation* of the ambiguity surrounding invariance. Authors often assume invariance to publish the "Deep" finding (Section 4: Results) but invoke non-invariance (translation issues, contextual framing) to explain away the theoretical threat in the Discussion (Section 6). The concept explains *how* it is done, but not the *rhetorical function* of toggling between the two states.

  **3. The Principle of Charity (Davidson/Grandy)**
  *   **Concept:** An interpretive maxim requiring us to maximize the agreement or rationality of a speaker to make sense of their speech.
  *   **Prediction:** To claim the difference is "Shallow" (shared values, different beliefs), one applies Charity to the subjects' normative commitments. To claim the difference is "Deep" (different values), one suspends Charity regarding their norms while maintaining it regarding their sincerity.
  *   **Evaluation:** This is the *philosophical mechanism*. The maneuver relies on **Selective Interpretive Charity**. However, "Selective Charity" is a description of a cognitive move, not a label for the systemic pattern of publishing. It lacks the sociological dimension of *why* the selection flips (i.e., to maximize novelty while minimizing theoretical disruption).

  **4. The Emic/Etic Distinction (Anthropology)**
  *   **Concept:** *Emic* refers to an insider's perspective (culturally specific); *Etic* refers to an outsider's universal categories.
  *   **Prediction:** A "Deep" claim relies on Emic validity (their morality is unique). A "Shallow" claim relies on Etic validity (we are all playing the same game, just with different pieces).
  *   **Evaluation:** This is close, but researchers often claim to have captured the Emic perspective *in order to* map it onto an Etic universal. The collision you describe happens when the same data point is treated as a valid Emic report (proving difference) and an invalid Etic comparison (proving sameness) simultaneously.

  **5. Underdetermination of Theory by Data**
  *   **Concept:** The available evidence is insufficient to determine which of several competing theories is correct.
  *   **Prediction:** Researchers will choose theories based on non-evidential factors (aesthetics, career incentives, prior commitment).
  *   **Evaluation:** This describes the *epistemic condition* that makes the maneuver possible. It does not name the maneuver itself. It explains why the dial *can* be turned, not that it *is* being turned in this specific, bidirectional pattern.

  ***

  ### Stage 2: Diagnosis and Definition

  **Does the maneuver have a name?**
  No. There is no established term in metaethics, psychology, or philosophy of science that specifically captures this bidirectional, intra-author oscillation regarding the ontological status of cross-cultural moral variation.

  Existing terms like "Motte-and-Bailey" are too rhetorical; "Measurement Invariance" is too technical; "Underdetermination" is too broad. The pattern you have identified is a specific pathology of interdisciplinary moral science, where the pressure to produce *novel* findings (requiring Deep difference) conflicts with the pressure to produce *general* theories (requiring Shallow difference).

  **Proposed Definition: The Construct Equivocation**
  I propose we name this maneuver **The Construct Equivocation**.

  It is defined by the following three conditions:
  1.  **Ontological Toggle:** The researcher treats the psychological construct (e.g., "moral judgment," "punishment intuition") as having a fixed identity when asserting a difference (Phase 1: Deep), but treats it as having a fluid or context-dependent identity when explaining the difference (Phase 2: Shallow).
  2.  **Invariance Ambiguity:** The researcher relies on the *assumption* of measurement equivalence to publish the variation, but relies on the *denial* of measurement equivalence (via context, belief, or translation) to defuse the theoretical implications.
  3.  **Theoretical Immunity:** The maneuver functions to insulate the overarching theory from falsification. The data is allowed to falsify *specific predictions* (making the paper publishable) but not the *core framework* (making the career safe).

  **Why this fits:**
  It captures the "sideways" movement you noted. It is not a retreat (Motte-and-Bailey); it is an equivocation on the definition of the object of study. In Phase 1, "Moral Judgment" = *Reported Response*. In Phase 2, "Moral Judgment" = *Underlying Universal Principle*. The word "Judgment" remains constant, but its referent shifts to suit the argumentative need.

  **A Clear Case:**
  *   **Study:** A paper finds that a small-scale society does not view accidental harm as morally blameworthy, unlike Western undergraduates.
  *   **Phase 1 (Deep):** The abstract states this reveals a "fundamental divergence in moral cognition," challenging the universality of intent-based morality. (Construct = Reported Response).
  *   **Phase 2 (Shallow):** The discussion argues this is because the society lacks the concept of "accident" as a distinct causal category, not because they value intent differently. If they understood the physics, they would judge like us. (Construct = Underlying Universal Principle).
  *   **The Equivocation:** If they lack the concept of "accident," then the instrument did not measure the same thing in Phase 1. If it didn't measure the same thing, the "fundamental divergence" claim in the abstract is invalid. The author needs both claims to be true simultaneously to have a paper that is both novel (Phase 1) and theoretically safe (Phase 2).

  **A Near-Miss:**
  *   **Legitimate Nuance:** A researcher finds a difference, tests for measurement invariance, finds it partial, and explicitly limits their claim: "We find behavioral differences, but we cannot rule out construct nonequivalence." They do not claim "Deep" difference in the abstract and "Shallow" difference in the conclusion. They remain in the uncertainty. This is honest science, not the Equivocation.
  *   **Theory Revision:** A researcher finds the difference, accepts it is Deep, and *changes their theory* to accommodate it (e.g., "Universalism is false"). This is not the Equivocation; this is theory updating. The Equivocation requires the theory to remain unchanged despite the data.

  ***

  ### Stage 3: Diagnostic for the Reader

  To distinguish a legitimate depth claim from the Construct Equivocation, apply the **Invariance-Locus Test**.

  **1. Check the Measurement Invariance Claim:**
  *   **Legitimate:** The authors explicitly test for configural, metric, and scalar invariance. If invariance fails, they do not compare means. If invariance holds, they acknowledge the difference is in the latent trait.
  *   **Equivocation:** The authors assume equivalence in the methods section (to justify the comparison) but invoke "cultural context" or "translation nuance" in the discussion to explain away the difference.
  *   **The Signal:** Look for the phrase *"conceptually equivalent"* in the methods and *"culturally specific interpretation"* in the discussion.

  **2. Locate the Locus of Variation:**
  *   **Legitimate:** The authors specify *where* the difference lies. Is it in the *weighting* of values (Deep) or the *application* of values (Shallow)? They commit to one.
  *   **Equivocation:** The locus shifts. In the results, the variation is in the *moral output* (Deep). In the discussion, the variation is in the *non-moral input* (beliefs, constraints, facts).
  *   **The Signal:** If the explanation for the difference moves from "they value X less" (Phase 1) to "they believe X leads to Y" (Phase 2) without evidence distinguishing the two, the dial is being turned.

  **3. The "So What?" Test:**
  *   **Legitimate:** If the difference is Shallow (different beliefs), the paper should conclude with implications for *education or information transfer*. If the difference is Deep (different values), the paper should conclude with implications for *moral pluralism or theory revision*.
  *   **Equivocation:** The paper concludes that we need both *education* (implying Shallow) and *theoretical overhaul* (implying Deep), without acknowledging the tension.

  ***

  ### Stage 4: Settling the Question (Concrete Evidence)

  To permanently close the "Depth Dial" on a specific finding, you need evidence that decouples **Normative Weight** from **Empirical Belief**. The current reliance on self-report and vignette judgment allows the Equivocation to thrive because both values and beliefs are confounded in the response.

  **The Study Design: Belief-Value Decoupling via Process Dissociation**

  **Objective:** Determine if a cross-cultural difference in judgment is driven by a difference in moral *values* (Deep) or empirical *beliefs* (Shallow).

  **Method:**
  1.  **Select a Case:** e.g., Punishment of a third-party violator.
      *   *Western:* Punish.
      *   *Target Population:* Do not punish.
  2.  **Elicit Empirical Beliefs Separately:** Before asking for moral judgment, measure beliefs about the *consequences* of the act.
      *   *Question:* "If Person A steals from Person B, does this harm the community?"
      *   *Hypothesis (Shallow):* Target population believes it does *not* harm the community.
      *   *Hypothesis (Deep):* Target population believes it *does* harm the community, but does not think punishment is the right response.
  3.  **The Crucial Manipulation (Counterfactual Vignettes):**
      *   Present a vignette where the empirical belief is held constant across groups.
      *   *Scenario:* "Imagine a world where stealing *definitely* causes no harm to anyone, not even the victim."
      *   *Scenario:* "Imagine a world where stealing *definitely* causes great harm to the community."
  4.  **Measure Moral Judgment:** Ask "Is it wrong?" and "Should they be punished?" in both counterfactual worlds.

  **Interpretation:**
  *   **Shallow Difference Confirmed:** If the Target Population's judgment *flips* to match the Westerners when the empirical beliefs are controlled (e.g., they punish when harm is certain, abstain when harm is impossible), the difference was in *beliefs*, not values. The "Deep" claim is false.
  *   **Deep Difference Confirmed:** If the Target Population *still* declines to punish even when they acknowledge the harm (or declines to call it wrong even when harm is certain), while Westerners punish, the difference is in the *normative weighting* of harm vs. other factors (e.g., autonomy, authority). The "Shallow" claim is false.

  **Why this settles it:**
  This design removes the "Measurement Invariance Ambiguity." You are no longer asking "Did they understand the question the same way?" You are explicitly manipulating the understanding. If the moral output diverges despite identical empirical inputs, the variation is in the moral function itself (Deep). If the output converges, the variation was in the empirical premises (Shallow).

  Until researchers employ designs like this—process dissociation, implicit measures, or belief-controlled vignettes—the **Construct Equivocation** will remain available. The data will continue to underdetermine the theory, and the dial will continue to turn.
