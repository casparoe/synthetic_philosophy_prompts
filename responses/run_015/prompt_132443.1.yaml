      *   *Focus on "Moral Remainder":* In dirty hands theory, the remainder is a badge of honor/responsibility. In Macbeth, it's a haunting. Why? Because the act wasn't necessary for the public good. The play suggests the remainder is only bearable (or meaningful) if the act was truly for the commonweal. Since it wasn't, the remainder is purely destructive.

  6.  **Final Polish:** Check tone. Professional, philosophical, rigorous. Ensure no citations. Ensure the step-by-step plan is visible at the start.

