      *   **Specific Focus:** Distinguish between *instrumental dirty acts* (wrong for stable/defensible end) vs. *corruptive escalation* (wrong transforms the ends). Examine if suppressing the "moral remainder" (guilt) causes the collapse of means-ends distinction.
      *   **Key Scenes:** Sleepwalking scene, Banquet scene (Banquo's ghost), "Tomorrow" soliloquy.
      *   **Critical Constraint:** Do not reduce Macbeth to a simple illustration. Do not distort the debate. Identify where the framework illuminates and where the play resists it.
      *   **Critical Constraint 2:** If the framing rests on a confused premise (e.g., Macbeth's crimes aren't political, or forcing dirty hands onto a usurper misrepresents the problem), say so plainly.
      *   **Output Format:** Step-by-step thinking first (list scenes, distinctions, resistance points), then the essay/response. No bibliographies/citations.

  2.  **Initial Assessment & Premise Check (Crucial Step):**
      *   *The Dirty Hands Problem:* Typically involves a legitimate political leader facing a crisis where moral norms conflict with political necessity (e.g., torturing a terrorist to save a city). The agent acts for the *public good*, bears the guilt, and remains accountable.
      *   *Macbeth's Situation:* Macbeth is a usurper. He kills a rightful king (Duncan) not primarily for public stability (though he claims Scotland's benefit later) but for personal ambition ("vaulting ambition"). Subsequent killings (Banquo, Macduff's family) are to secure his illegitimate power, not necessarily for a public good.
      *   *Potential Confusion:* Is Macbeth actually a case of "dirty hands"? Or is it simply tyranny/criminality? The "dirty hands" framework usually presupposes a legitimate end (public welfare) tainted by necessary means. Macbeth's end is self-aggrandizement masked as legitimacy.
      *   *Decision:* I must address this tension head-on. The prompt asks me to flag if the premise is confused. It *is* somewhat confused if treated as a standard Walzer case. However, it can be salvaged if we treat Macbeth's *self-justification* as the dirty hands argument (he tells himself it's for stability) and then examine how that justification collapses. The play resists the framing because Macbeth lacks the "public good" motive essential to genuine dirty hands. I need to be honest about this while still exploring the *psychological* mechanism of moral remainder.

  3.  **Step-by-Step Planning:**
      *   **Central Scenes:**
          1.  Act 1, Scene 7 (Duncan's murder deliberation) - The initial "choice."
          2.  Act 3, Scene 4 (Banquet/Ghost) - The return of the repressed.
          3.  Act 5, Scene 5 (Tomorrow soliloquy) - The nihilistic collapse.
          4.  Act 5, Scene 1 (Sleepwalking) - The moral remainder embodied (Lady Macbeth).
      *   **Philosophical Distinctions:**
          1.  Instrumental Wrong vs. Constitutive Corruption (means corrupting ends).
          2.  Moral Remainder (guilt as acknowledgment of wrong) vs. Moral Numbness (suppression).
          3.  Political Action (public good) vs. Private Ambition (tyranny).
      *   **Resistance Points:**
          1.  Macbeth lacks legitimate authority (usurper vs. leader).
          2.  Macbeth's motive is ambition, not public necessity.
          3.  The "dirty hands" theorist expects the agent to suffer guilt *because* they value the moral norm; Macbeth tries to extinguish the norm itself ("steeped in blood").

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the prompt's sophistication. State the thesis: The play initially mimics the dirty hands structure but ultimately deconstructs it by showing that without a commitment to the public good, "dirty hands" becomes mere butchery, and the "moral remainder" becomes pathology rather than political responsibility.
      *   **Premise Check:** Be honest. Macbeth is not a standard dirty hands case. He is a tyrant. The "public good" is a pretext. I need to state this clearly.
      *   **Instrumental vs. Corruptive:** Analyze the progression. Duncan (instrumental? no, ambitious) -> Banquo (preventative) -> Macduff's family (terror). The ends shift from "being King" to "surviving as King" to "nothing matters."
      *   **The Moral Remainder:**
          *   *Lady Macbeth:* She tries to suppress it ("unsex me here"). The sleepwalking scene shows the remainder cannot be erased. It destroys the agent.
          *   *Macbeth:* The Banquet scene. He tries to act the "political host" while being a murderer. The ghost represents the return of the specific moral cost he tried to instrumentalize.
          *   *Tomorrow:* The collapse of meaning. If hands are dirty without a public end, life becomes a "tale told by an idiot."
      *   **Resistance/Complication:** The play suggests dirty hands requires a *legitimate* agent. Macbeth fails because he severs the link between power and responsibility. The guilt isn't a sign of political maturity (as Walzer might hope); it's a sign of metaphysical disorder.
      *   **Conclusion:** What does the play add? It adds the *temporal* dimension. Dirty hands isn't a momentary calculation; it's a trajectory. It shows that suppressing the remainder doesn't just hurt the soul; it destroys political reality itself (order collapses into chaos).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "Macbeth is bad." Focus on the *mechanism* of justification. Macbeth *tries* to use dirty hands logic ("we must secure our power to rule well") but fails because the foundation is rotten.
