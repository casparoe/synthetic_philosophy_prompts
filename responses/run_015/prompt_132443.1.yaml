answer: |-
  **Step-by-Step Planning**

  **Central Scenes to Treat:**
  1.  **Act 1, Scene 7 (Macbeth's Soliloquy):** The deliberation before Duncan's murder. This is the critical juncture where instrumental reasoning is weighed against moral hospitality.
  2.  **Act 3, Scene 4 (The Banquet):** The appearance of Banquo's ghost. This dramatizes the return of the repressed moral cost during a performance of political stability.
  3.  **Act 5, Scene 1 (Lady Macbeth's Sleepwalking):** The somatic manifestation of the "moral remainder" that cannot be verbally confessed.
  4.  **Act 5, Scene 5 ("Tomorrow" Soliloquy):** The nihilistic conclusion where the distinction between means and ends collapses entirely.

  **Philosophical Distinctions to Apply:**
  1.  **Legitimate Necessity vs. Private Ambition:** The core dirty-hands requirement (acting for the public good) versus Macbeth's actual motive (vaulting ambition).
  2.  **Instrumental Wrong vs. Constitutive Corruption:** Whether the wrong act remains a tool for a stable end, or whether the act reshapes the agent's conception of the end itself.
  3.  **Moral Remainder as Responsibility vs. Moral Remainder as Pathology:** In political ethics, guilt signals accountability; in *Macbeth*, guilt signals metaphysical disorder and psychological fragmentation.

  **Points of Resistance (Where the Play Pushes Back):**
  1.  **The Legitimacy Problem:** Dirty hands theory usually presupposes a legitimate authority facing a crisis. Macbeth is a usurper; his "necessity" is self-created.
  2.  **The Public Good Pretext:** Macbeth claims his tyranny secures Scotland, but the play shows it destroys the commonweal. The framework risks validating his pretext if not carefully scrutinized.
  3.  **The Nature of Guilt:** Walzerian dirty hands suggests the agent should feel guilt but proceed. Macbeth suggests that without a true public end, the guilt is not a badge of responsibility but a symptom of damnation.

  ***

  **The Corruptive Escalation: A Philosophical Reading of Macbeth**

  To read *Macbeth* through the lens of the "dirty hands" problem requires us to confront an uncomfortable truth immediately: strictly speaking, Macbeth is not a candidate for the dirty-hands exemption. The standard philosophical formulation—associated with thinkers like Michael Walzer or Jean-Paul Sartre—presupposes a political agent who commits a moral violation *for the sake of a genuine public good* (e.g., sacrificing a few to save the many), accepting the moral stain as the cost of leadership. Macbeth, by contrast, is a usurper whose primary motive is explicitly identified as "vaulting ambition." He creates the crisis he claims to solve.

  However, dismissing the play as merely a study in criminality would miss its profound contribution to political ethics. *Macbeth* is best read not as an illustration of successful dirty-handedness, but as a tragedy about the *failure* to sustain the dirty-hands distinction. The play dramatizes what happens when an agent attempts to use the logic of political necessity to justify private ambition, and how the suppression of the "moral remainder" leads not to stable rule, but to the total collapse of the means-ends distinction.

  **The Premise Check: Tyrant vs. Statesman**
  We must state plainly that applying the dirty-hands framework to Macbeth risks category error if we accept his self-justification. A dirty-hands agent acts wrongly to preserve a moral order they value. Macbeth acts wrongly to seize a position he desires. When he tells the murderers that Banquo is a "common enemy to man," he is mimicking the language of public necessity to mask private insecurity. If we treat this as genuine dirty hands, we validate the tyrant's pretext. The play resists this framing by showing that because the end (Macbeth's kingship) lacks legitimate moral grounding, the means (murder) cannot remain instrumental. They become constitutive. The violence does not secure the throne; it becomes the only reality the throne sits upon.

  **Instrumental Wrong vs. Corruptive Escalation**
  The philosophical distinction between an instrumental dirty act and a corruptive escalation is the engine of the play's second half. In Act 1, Scene 7, Macbeth deliberates. He acknowledges Duncan's virtue and his own duty as "host." Here, the moral norm is intact. He chooses to violate it, ostensibly to become King. If this were a standard dirty-hands scenario, the end (Kingship/Order) would remain stable after the act.

  But the play shows that the act transforms the end. Once Duncan is dead, "Kingship" no longer means ruling Scotland; it means "being safe." Macbeth admits, "We have scorched the snake, not killed it." The end has shifted from achievement to survival. This triggers the corruptive escalation. The murder of Banquo is not for the public good; it is to secure the lineage. The slaughter of Macduff's family is not strategic; it is terroristic ("give to the edge o' the sword his wife, his babes").

  This progression illuminates a critical flaw in abstract dirty-hands theory: it often treats the moral violation as a discrete event. *Macbeth* shows it as a trajectory. Because Macbeth refuses to acknowledge the moral remainder after the first act—because he tries to "be done" with the guilt rather than bear it—he loses the ability to distinguish between necessary violence and gratuitous butchery. The means consume the ends. He becomes "steeped in blood," where returning is as tedious as going o'er. The instrumental logic collapses because there is no longer a "good" being served, only the momentum of the violence itself.

  **The Moral Remainder: Pathology vs. Responsibility**
  In political ethics, the "moral remainder" (the lingering guilt) is often viewed as a sign of the agent's moral health—a proof that they recognize the norm they violated. They should feel bad, but they must act. *Macbeth* complicates this by showing two different responses to the remainder, both catastrophic.

  Lady Macbeth attempts to erase the remainder entirely ("A little water clears us of this deed"). She treats the moral stain as a physical dirt that can be washed away. The sleepwalking scene (Act 5, Scene 1) is the philosophical rebuttal to this. The smell of blood remains ("all the perfumes of Arabia"). Her breakdown demonstrates that the moral remainder is not erasable. However, unlike the Walzerian agent who bears the guilt as a burden of office, Lady Macbeth is destroyed by it. Her guilt is not productive; it is pathological. It suggests that without a legitimate public end to justify the pain of the remainder, the guilt serves no purpose but to dismantle the psyche.

  Macbeth's response is the inverse: he attempts to harden himself against the remainder. This culminates in the Banquet scene (Act 3, Scene 4). Macbeth tries to perform the role of the stable monarch, hosting the thanes. But Banquo's ghost appears. Philosophically, the ghost is the return of the moral remainder that Macbeth tried to suppress. He tried to treat Banquo's death as an instrumental necessity; the ghost reveals it as a personal betrayal. Macbeth's reaction—"Thou canst not say I did it"—is a desperate attempt to maintain the distinction between the act and the agent. He fails. The political performance collapses into public madness. The play suggests that the moral remainder *will* return. If it is not integrated as a conscious burden of responsibility (as dirty-hands theory might hope), it returns as a hallucination that destroys political authority.

  **The Collapse of Meaning: "Tomorrow, and tomorrow, and tomorrow"**
  The final test of the dirty-hands framework is the soliloquy in Act 5, Scene 5. Upon hearing of his wife's death, Macbeth reflects on the futility of life. "Life's but a walking shadow... a tale told by an idiot, signifying nothing."

  This is the ultimate consequence of corruptive escalation. In a genuine dirty-hands scenario, the agent suffers morally so that political meaning (order, justice, survival) can persist. Macbeth finds that because his violence was not in service of a true public good, the violence has drained the world of meaning. If the hands are dirty for no reason other than self-preservation, then time itself becomes a "petty pace." The distinction between means and ends has vanished so completely that existence itself loses teleology. There is no "good" left to secure, only the waiting for death. This challenges the dirty-hands theorist to ask: Is there a point where the cost to the agent's moral universe outweighs any possible political gain? Macbeth suggests that if the agent loses the capacity to feel the weight of the remainder, they lose the capacity to value the end they fought for.

  **What the Play Adds to the Debate**
  Abstract argument in political philosophy often treats the dirty-hands problem as a calculus of competing duties at a specific moment in time. *Macbeth* adds the dimension of *temporal endurance*. It asks not just "Can I do this?" but "Can I live with what I have become after doing this repeatedly?"

  The play argues that the sustainability of dirty hands depends entirely on the legitimacy of the end. If the end is the public good, the moral remainder is a tragic burden that confirms the agent's humanity. If the end is private power, the moral remainder is a poison that rots the agent's reality. Macbeth complicates the debate by showing that the "stain" is not just a metaphor for guilt; it is an ontological change. The agent who suppresses the remainder does not remain a political agent who did wrong; they become a tyrant for whom wrong no longer exists as a category.

  Furthermore, the play warns against the privatization of political violence. Macbeth's tragedy is that he treats the state as an extension of his own body ("my way of life / Is fallen into the sere"). Dirty-hands theory usually assumes the agent sacrifices their moral purity for the *state*. Macbeth sacrifices the *state* for his own moral insulation (his safety). The play thus offers a corrective to the dirty-hands problem: the exemption is only valid if the agent remains subordinate to the public good. Once the agent uses the "necessity" argument to protect themselves rather than the polity, the distinction between political necessity and criminal tyranny dissolves.

  **Conclusion**
  *Macbeth* does not validate the dirty-hands problem; it warns of its abuse. It shows that the "moral remainder" is not merely a psychological side effect but a necessary check on political power. When Macbeth tries to wash away the blood or ignore the ghost, he is trying to evade the accountability that makes dirty hands politically tolerable. The play suggests that without the genuine burden of guilt—without the acknowledgment that a moral boundary has been crossed even if necessary—the political agent ceases to be a leader and becomes a monster. The "nothing" of the final soliloquy is the result of a politics stripped of moral remainder. Thus, the play contributes a vital caution to political philosophy: dirty hands are only sustainable if the hands remain heavy. If the agent learns to love the blood, the politics dies.
