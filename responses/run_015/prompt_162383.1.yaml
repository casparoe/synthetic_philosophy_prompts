answer: |-
  # The Ethical Art Tree

  **Instructions:** Answer each question honestly. Follow the path to a leaf. Your leaf is your position.

  **1. Is the moral wrong *in* the work's meaning (e.g., praising vice) or only in the maker's life?**
  *   **Only in Life:** Go to 2.
  *   **In the Work:** Go to 5.

  **2. Is the wrong a causal ingredient (e.g., footage of real harm, stolen property)?**
  *   **Yes:** **Leaf A: Causal Taint View.** The work is partly made of the wrong. *Awkward commitment:* Destroying the work may be required to destroy the evidence.
  *   **No:** Go to 3.

  **3. Is authorship distributed (e.g., a crew of 200) or solo?**
  *   **Distributed:** **Leaf B: Collective View.** Innocent collaborators share the stigma. *Awkward commitment:* Punishing the crew punishes the innocent.
  *   **Solo:** Go to 4.

  **4. Does engagement financially benefit the wrongdoer?**
  *   **No:** **Leaf C: Radical Autonomism.** Artistic value is wholly insulated from morality. *Awkward commitment:* You must admire the art of a monster equally to a saint.
  *   **Yes:** **Leaf D: Moderate Autonomism.** Value is insulated, but conduct is restricted. *Awkward commitment:* Artistic value is objective, but you shouldn't touch it.

  **5. Does the work invite us to enjoy the vice or be horrified by it?**
  *   **Horrified:** **Leaf E: Ethicism.** Moral defects are pro tanto artistic defects. *Awkward commitment:* A morally perfect but boring work is artistically better than a thrilling immoral one.
  *   **Enjoy:** Go to 6.

  **6. Is the vice necessary for the work's artistic success?**
  *   **No:** **Leaf F: Strong Ethicism.** Defects always lower value. *Awkward commitment:* Impossible to separate the art from the artist's intent.
  *   **Yes:** Go to 7.

  **7. Does the moral defect lower the work's artistic value?**
  *   **Yes:** **Leaf G: Structural Defect.** The work invites a response unmerited by its content. *Awkward commitment:* The audience is blamed for following the work's cues.
  *   **No:** Go to 8.

  **8. Is 'artistic value' a coherent category distinct from moral value?**
  *   **No:** **Leaf H: Deflationism.** The debate rests on a category mistake. *Awkward commitment:* There is no distinct kind of artistic value.
  *   **Yes:** **Leaf I: Immoralism.** Works can be artistically better for being immoral. *Awkward commitment:* Cruelty can be an artistic virtue.
  *   *(Alternative Path from 7):* **Leaf J: Contextualism.** Vice changes meaning, not value. *Awkward commitment:* The work changes without changing quality.

  ***

  ### Empty Logical Space

  The tree reveals gaps where no one actually stands.

  **1. Maker Immorality = Artistic Defect, Work Immorality ≠ Defect.**
  This cell is **incoherent**. If the artist's life taints the art's value, surely the art's own message matters more. To claim the hand corrupts the work but the heart does not reverses intuitive priority.

  **2. Moral Defects = Merits, Never Defects.**
  This cell is **merely unattractive**. It implies morality only helps art, never hurts. No theorist argues that kindness cannot be boring while cruelty cannot be thrilling; this asymmetry lacks defense.

  **3. Timing Matters for Value, Not Conduct.**
  This cell is **undefended**. Some argue abuse occurring *after* creation doesn't lower value, yet still boycott. If timing doesn't change the object, why does it change the verdict? Usually, timing arguments bridge to conduct, not value.

  ***

  ### Honesty About Failure

  This tree cannot separate all positions. Some differences are mechanistic, not verdictive.

  **1. Moderate Autonomism vs. Contextualism.**
  Both often conclude: "Watch, but differently." Autonomists say value is static, reasons for engagement change. Contextualists say meaning changes, value static. The tree groups them near similar leaves because the practical verdict overlaps. To separate them, we would need a case where meaning changes but engagement reasons do not—a scenario rarely argued.

  **2. Ethicism vs. Structural Defect.**
  Both conclude: "The work is worse art." Ethicists say moral flaw *is* artistic flaw. Structural theorists say moral flaw causes cognitive failure. The tree separates them at Q7, but if a user answers intuitively, they may not distinguish "moral defect" from "unmerited response." No arrangement of cases prys them apart because they agree on the sinkage of value.

  ***

  ### The Real Argument: Value vs. Conduct

  You and your friend were likely arguing about conduct, not value. A verdict on artistic value does not settle what to do.

  **1. Agreement on Value, Disagreement on Conduct.**
  Two **Moderate Autonomists** may agree the show is a masterpiece. One streams it (supporting art); one boycotts (denying funds). The value verdict is identical; the action differs based on weighting financial harm against cultural preservation. Similarly, **Ethicists** and **Autonomists** might both boycott, but for different reasons (one because the art is bad, one because the money is dirty).

  **2. Disagreement on Value, No Difference in Conduct.**
  An **Immoralist** (it's better because it's vicious) and an **Ethicist** (it's worse because it's vicious) might both watch it. The Immoralist enjoys the vice; the Ethicist studies the flaw. The value judgment is opposite; the behavior is identical.

  **3. Where Value Settles Conduct.**
  Value verdicts only settle conduct when the mode of engagement is purely evaluative. If the act is **teaching** or **programming a retrospective**, a verdict of "Structural Defect" (Leaf G) suggests exclusion, whereas "Contextualism" (Leaf J) suggests framing. If the act is **buying**, Causal Taint (Leaf A) demands abstention regardless of value.

  **Conclusion:** Do not ask "Is it still good?" Ask "What does watching do?" The tree sorts your metaphysics; the conduct matrix sorts your ethics. You can agree the art is great and still disagree on whether to pay for it. That is not a logical failure; it is the distinction between appreciation and complicity.
