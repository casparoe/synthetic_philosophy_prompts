      *   *3. Future Commitments:*
          *   Motivation: We live for potentials (kids, projects).
          *   Status: Tricky. If the future never happens, was the past meaningless?
          *   Criterion: Must handle the ontological status of "not-yet."

      *   *4. Meaning vs. Happiness:*
          *   Motivation: Martyrs, caregivers (like the user's mom's situation), artists. They suffer but feel meaning.
