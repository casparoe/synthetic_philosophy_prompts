answer: |-
  This is a classic flatmate standoff: one person is arguing from **practical reality**, and the other is arguing from **philosophical technicality**.

  To give you a neutral take: **You are being fairer, but Tom isn't entirely wrong about the principle—he's just applying it to the wrong situation.**

  Here is the breakdown of why the argument is happening and who has the stronger ground regarding the council meeting.

  ### 1. Tom's Argument: The Philosophical Technicality
  Tom is leaning on a concept in ethics called the **Principle of Alternative Possibilities (PAP)**. This principle states that a person is morally responsible for what they do only if they could have done otherwise.

  Tom's logic is: *The brother threatened coercion. Therefore, Priya's will was not free. Therefore, she deserves no credit.*

  **Where Tom is weak:**
  He is treating a conditional threat ("If you don't do X by Friday, I will do Y") as an absolute constraint. At the moment Priya signed (Thursday morning), she **could** have done otherwise. She could have:
  *   Waited until Friday night to see if her brother would actually do it.
  *   Refused to sign and let her brother face the consequences of his threat.
  *   Signed it specifically *to spite* her brother.

  Because the brother hadn't taken control of the account yet, Priya still had agency. Tom is judging her based on a hypothetical future where she lost her choice, not the reality where she exercised it.

  ### 2. Your Argument: The Practical Reality
  Your argument is based on **causality and intent**.
  *   **Intent:** Priya wanted to sign the petition regardless of her brother.
  *   **Causality:** The brother did not sign it; Priya did.
  *   **Timing:** She acted before the coercion deadline.

  **Where you are strong:**
  In the real world, we judge people by their actions and their stated motivations, not by hypothetical "what ifs." If a person wants to do the right thing, and a external pressure *also* aligns with that thing, we don't usually discount their moral credit unless the pressure was overwhelming (e.g., "Sign this or I will hurt you"). A brother threatening to log in and do a chore/task for you is low-level pressure, not duress.

  ### 3. The "Frankfurt Case" Nuance
  If you want to really wind Tom up (or impress him), there is a famous philosophical thought experiment called a **Frankfurt Case**. It was designed specifically to counter Tom's argument.

  It suggests that even if Priya *couldn't* have done otherwise (e.g., if the brother had a mind-control device ready to fire if she hesitated), she would still be responsible **as long as she acted on her own desires.** Since Priya signed because *she wanted to save the library*, not because she was scared of her brother, she owns the action. The fact that the brother *would have* forced her is irrelevant because that mechanism never triggered.

  ### 4. The Real Issue: The Council Meeting
  This is where Tom is being unfair. The goal isn't to award Priya a "Good Citizen Medal"; the goal is to pick the best representative for the flat.

  *   **Stake:** Priya uses the library. Tom (presumably) might not care as much.
  *   **Passion:** Priya is motivated.
  *   **Authenticity:** Priya can speak to the council about how the library helps her study.

  Tom is using a philosophical loophole to disqualify Priya from a practical role. Even if Tom were right about the moral credit (which he isn't, really), Priya is still the best person to go to the meeting. Denying her the role based on her brother's text message is punishing her for someone else's behavior.

  ### The Verdict
  **You are being fairer.**

  Tom is prioritizing abstract logical consistency over human reality. He is essentially saying, "Your action is tainted because a constraint existed in the background," even though that constraint didn't touch her.

  **How to resolve it:**
  Tell Tom: *"I get your point about coercion, but she signed on Thursday. The deadline was Friday. She had 24 hours where she could have let him do it, and she chose not to. That's agency. Plus, for the council meeting, we need the person who actually uses the library, not the person who wins arguments about free will."*

  If Tom keeps pushing, he might just be annoyed that he isn't the one going to the meeting, and the philosophy is a smokescreen. Stick to your guns: Priya signed, Priya cares, Priya should go.
