  *Department of Health and Biological Function*
  *Consultation Paper 44/23*
  *Operationalising the Biostatistical Eligibility Criteria (BEC)*

  *Introduction*
  1. The Department welcomes responses regarding the implementation of the Biostatistical Eligibility Criteria (BEC) across NHS commissioning groups. Following the Health Objectivity Act, eligibility for treatment is now determined solely by statistical deviation from species-typical functioning. The Department emphasises that this framework is value-free. Clinical need is no longer a matter of patient suffering or social impact, but of percentile ranking within a designated reference class.

  2. It is acknowledged that certain conditions previously treated as pathological are statistically normal for specific demographics. Dental caries, presbyopia, and degenerative joint changes in populations over sixty-five fall within the standard deviation for these reference classes. Consequently, these will be reclassified as normal functioning. Resources previously allocated to restorative dentistry and hip replacements for this cohort will be redirected to conditions demonstrating genuine statistical subnormality.

  3. Consider the case of Arthur P., 72, former construction worker. Mr P. presents with osteoarthritis of the hip. Under the BEC, his joint function is compared against the reference class 'Males, 70-75, Manual Labour'. His function is within the 40th percentile. As this is not statistically subnormal, his pain is deemed a result of normal aging rather than disease. Treatment is classified as enhancement. Mr P. was informed that his inability to walk without aid is not a medical priority, as his biology is functioning exactly as expected for a man of his background. He was discharged without analgesia.

  *Reference Class Specification*
  4. To ensure fiscal sustainability, reference classes must be sufficiently narrow. A broad class (e.g., 'Adult Humans') risks pathologising normal wear and tear. A narrow class (e.g., 'Smokers in Postcode Sector SW4') ensures that only significant deviations trigger funding. The Department invites views on whether occupation, region, or income bracket should take precedence in class selection. Early modelling suggests that aligning reference classes with local budget caps yields optimal equilibrium.

  5. Concerns regarding asymmetry have been noted. Conditions involving above-average function (e.g., hypertrophic muscle growth) do not qualify as diseases, as only subnormal function counts. Conversely, rare genetic variants with no impact on survival are classified as diseases due to statistical rarity. The Committee accepts this may result in diagnosing healthy individuals while denying care to symptomatic ones. This is considered an acceptable trade-off for ontological clarity.

  6. Regarding pharmaceutical indications, stakeholders have suggested that funding narrower reference classes could maintain eligibility for certain drugs. For example, reclassifying 'Adults' to 'Adults with Genetic Marker X' renders a condition statistically abnormal again. The Department is reviewing this mechanism for compatibility with the Objectivity Act.

  7. A proposal to adopt a 'Harmful Dysfunction' hybrid model was considered. This was rejected because 'harm' introduces normative judgement. The Department cannot quantify suffering without violating the principle of value-neutrality. It is preferable to treat a pain-free statistical outlier than a suffering statistical norm.

  8. The Department maintains that no value judgements are being made. The selection of reference classes is a technical actuarial exercise. We invite submissions by 14 November.

  *Annex A: Schedule of Proposed Reference Classes*
  | Demographic | Reference Class | Funding Threshold | Notes |
  | :--- | :--- | :--- | :--- |
  | Males 18-40 | General Population | <5th Percentile | Standard |
  | Males 40-60 | Office Workers | <2nd Percentile | Back pain excluded |
  | Females 65+ | Regional Average | <1st Percentile | Mobility aids removed |
  | Miners (Ex) | Occupational Cohort | <0.5 Percentile | Respiratory/Knee |

  *Annex B: Minority Note of Dissent*
  *Dr. E. Vance, Committee Member*
  9. I cannot endorse this framework. The claim that the BEC is value-free is untenable. Selecting a reference class is not an empirical discovery; it is a normative choice. To decide whether a 70-year-old's knees should be compared to a 20-year-old's or another 70-year-old's is to decide whether aging is a disease. By choosing the latter, we are not discovering a fact; we are making a policy decision to withhold care.

  10. Furthermore, defining disease solely by statistical rarity ignores the purpose of medicine. If a condition prevents a human from flourishing, it is a disease, regardless of how many people have it. To say dental decay is 'healthy' because most people have it is to abandon the concept of health entirely. We are not measuring biology here; we are measuring budgets, and calling it science. I resign.

