          4.  What should a channel theorist concede vs. dismiss?
      *   **Constraint:** No "it depends on definitions." No references. Focus on arguments.

  2.  **Deconstruct the Channel Criterion:**
      *   *Goal:* Distinguish genuine multi-level selection (MLS) from mere lower-level selection playing out in a structured population.
      *   *Mechanism:* Inheritance is the key. Without inheritance at level $L$, fitness differences at $L$ don't accumulate *as* level $L$ differences.
      *   *The Tension:* If inheritance is too strict (bottlenecks only), we miss plausible cases of cultural/ecological inheritance. If inheritance is too loose (any environmental modification), everything becomes a unit of selection, and the distinction vanishes.

  3.  **Address Question 1: Falsifying the Criterion (Misclassification):**
      *   *Scenario A (False Positive):* A case that fits the channel criterion but intuitively/mathematically isn't group selection.
          *   *Idea:* Niche construction that is purely individual. If an individual builds a nest that its offspring inherit, that's individual inheritance. If a *group* builds a dam, is it group inheritance?
          *   *Fatal Case:* A "channel" that is actually just a proxy for lower-level inheritance. Example: A group trait correlates perfectly with a gene frequency, and the "channel" (scaffold) is determined solely by that gene frequency. If the scaffold adds no *independent* causal power, is it a distinct channel?
          *   *Better Fatal Case:* "Ghost Channels." Imagine a scenario where the math shows zero group-level response to selection (Price covariance term is zero), but the channel criterion says "Yes, there is a channel." This happens if the channel exists but has zero fidelity or zero variance in fitness. But the user specifies "fitness differences... can accumulate."
          *   *Real Threat:* A case where the channel exists, but selection is *impossible* despite the channel. Or, conversely, selection happens *without* the channel.
          *   *The "Without Channel" Case:* This is the classic Okasha/Godfrey-Smith debate. Can you have MLS without reproduction? Some argue yes (interactors). If a group persists and changes trait frequency *without* fission/bottleneck (e.g., differential survival of stable groups), the channel criterion says "No unit," but the evolutionary outcome looks exactly like group selection. If the *outcome* is indistinguishable, why deny the unit?
      *   *Scenario B (False Negative):* A case that is clearly group selection but lacks the channel.
          *   *Idea:* Differential extinction of groups that *don't* reproduce. If Group A survives 100 gens and Group B dies in 1 gen, trait frequencies shift. No "offspring groups," just surviving groups. The channel criterion denies this is a unit of selection. But evolution occurred.

  4.  **Address Question 2: The Scaffold Move and Unfalsifiability:**
      *   *The Risk:* If "persistent environmental modification" counts, then *everything* counts. Soil chemistry changes based on who lives there. That affects who lives there next. Is "soil" a group unit?
      *   *The Collapse:* If every causal loop counts as a channel, then the distinction between "selection at L" and "selection at L-1 with feedback" vanishes. This leads to the deflationist view (Price equation is all there is; levels are just perspectives).
      *   *How to tell the difference:* You need a *specificity* constraint. The scaffold must carry *information* about the specific composition of the parent group, not just general environmental conditions.
      *   *The Defeater:* If you cannot draw a non-arbitrary line between a "group scaffold" and "background environment," the criterion loses explanatory power. It becomes a label, not a mechanism.
      *   *Vindication vs. Collapse:* It's a vindication *only if* the scaffold allows you to predict evolutionary trajectories that the lower-level model misses or gets wrong. If the lower-level model (tracking individuals + environment) predicts the exact same outcome, the "group channel" is ontologically redundant.

