      *   **Key Constraint:** Requires a "bottleneck" or specific life-cycle mechanism for higher levels (like groups). Aggregation groups don't count.
      *   **The "Patch":** The user recently expanded the criterion to include "persistent extracellular scaffolds" (e.g., a chemical structure left by a group that biases future recolonization) as a valid inheritance channel, even without a strict bottleneck.
      *   **The Worry:** Has this patch made the theory unfalsifiable ("can't lose")? Does it collapse into deflationism (Price equation bookkeeping)?
      *   **The Request:**
          1.  What would show the criterion is *wrong* (misclassifies real cases)?
