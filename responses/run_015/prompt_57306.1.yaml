answer: |-
  **TO:** Standards Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation for Ledger Key and Protocol Resolution

  **1. Candidate Rules Derived from the Record**

  To resolve the *Ledger* impasse, we must first codify the implicit rules governing our past four rulings. Three candidate rules emerge from the minutes:

  *   **Rule CC (Credence Consistency):** The Key represents the rational epistemic credence of the agent at the moment of reporting, independent of the scoring mechanism.
  *   **Rule SM (Score Maximization):** The Key represents the probability report that maximizes the user's expected points under the active scoring engine.
  *   **Rule PA (Procedural Alignment):** The Key represents rational credence (CC), *provided* the vignette and engine are calibrated such that credence aligns with score maximization. If they diverge, the vignette or engine must be patched to restore alignment before release.

  **2. Reconciliation of the Record**

  We test these rules against our existing keys:

  *   **Lamp:**
      *   *Fact:* Keyed 1/2. Petition to key 1/4 (based on 3 prompts in Tails vs. 1 in Heads) was rejected. Vignette was patched to remove the extra prompts.
      *   *Analysis:* **Rule SM fails here.** If SM were operative, we would have keyed 1/4 or accepted the petition. We did not; we altered the world to preserve the 1/2 Key. **Rule CC holds.** **Rule PA holds** (we patched the vignette to ensure CC = SM).
  *   **Two Doors:**
      *   *Fact:* Keyed 1/3. Rationale: Agent should expect to be one of the twice-asked.
      *   *Analysis:* **Rule CC holds** (Thirder position). **Rule SM holds** (under the old "score-every-report" engine, 1/3 maximizes points). **Rule PA holds** (CC and SM were aligned).
  *   **Prelude:**
      *   *Fact:* Keyed 1/2. Rationale: Key indexed to moment of asking.
      *   *Analysis:* **Rule CC holds** (Credence before protocol is 1/2). **Rule SM holds** (Single report, standard scoring). **Rule PA holds**.
  *   **Told First:**
      *   *Fact:* Keyed 1/2. Rationale: Key changed upon disclosure.
      *   *Analysis:* **Rule CC holds** (New evidence updates credence). **Rule SM holds** (Single report). **Rule PA holds**.

  **Conclusion on Reconciliation:** **Rule SM is incompatible with the Lamp precedent.** The committee explicitly rejected the score-maximizing key (1/4) in *Lamp* in favor of the epistemic key (1/2), choosing to patch the vignette rather than the Key. **Rule CC is consistent with all four keys.** **Rule PA is our operational norm**, but *Ledger* presents a case where PA is impossible (engine cannot be restored).

  **3. Analog Identification**

  *   **Structural Analog:** **Two Doors**. *Ledger* uses the *Two Doors* protocol verbatim. The agent's evidence is identical. Under Rule CC, the Key *must* be 1/3.
  *   **Procedural Analog:** **Lamp**. *Ledger* replicates the *Lamp* conflict: a divergence between Epistemic Credence (1/3) and Score-Maximizing Report (1/2). In *Lamp*, we resolved this by patching the vignette to force alignment. In *Ledger*, we cannot patch the engine.

  **4. Recommendation for Ledger**

  I recommend we **Key Ledger at 1/3**, consistent with *Two Doors* and Rule CC, accompanied by a **mandatory UI Warning** displayed before the vignette begins: *"Note: This session uses an averaging scoring engine. While 1/3 reflects the correct probability, reporting 1/2 may maximize points in this specific technical configuration."*

  **Argument for the Committee:**

  *   **To the Pro-1/2 Member (Member B):** You argue that *Lamp* was an error and that consistency requires 1/2. However, the *Lamp* minute records a *rejection* of the petition to lower the key. We did not key 1/4; we changed the vignette to make 1/2 the scoring answer. This establishes that the Key is sacred and the Instrument (vignette/engine) is mutable. In *Ledger*, the Instrument is frozen, not the Key. If we key 1/2, we admit that *Two Doors* was not a finding about probability, but a finding about a specific scoring engine. This corrupts the research dataset.
  *   **To the Pro-1/3 Member (Member A):** You argue the engine is miscalibrated. I agree. However, blocking the release harms the mobile rollout. The UI Warning preserves the training utility (users know the score is distorted) without corrupting the research key. We treat the Key as the Truth and the Engine as the Flawed Tool.

  **5. Principles and Consequences**

  *   **If we Key 1/3 (Recommendation):**
      *   *Principle Adopted:* **Epistemic Primacy.** The Key is a research datum first, a training target second.
      *   *Two Doors Minute:* Upheld. The 1/3 ruling remains valid as a statement of credence, not just scoring strategy.
      *   *Lamp Petition:* Vindicated. The rejection of the 1/4 petition is confirmed as a commitment to epistemic truth over scoring mechanics.
      *   *Data Interpretability:* Preserved. All Keys represent credence.
      *   *Cost:* Users may be confused by the scoring penalty. Mitigated by UI Warning.

  *   **If we Key 1/2:**
      *   *Principle Adopted:* **Instrumental Pragmatism.** The Key is whatever the app rewards.
      *   *Two Doors Minute:* Invalidated. It becomes specific to the "old engine," rendering the *Two Doors* data incomparable to *Ledger*.
