prompt: |-
  Hey — I'm in a moral psychology seminar this term and I keep turning something over from my actual life that feels like exactly the problem we keep discussing in class, except I cant tell whether its a real example of the thing or just me being sleep deprived.

  I'm an RA in a first-year dorm and I also work weekend shifts at a campus coffee cart. At the RA job I'm the person people call at 2am — drunk freshmen, screaming roommate fights, someone locked in the bathroom crying — and I'm reliably calm, I de-escalate, my supervisor literally put "unflappable" on my midyear eval. At the coffee cart I'm a different person. Line is long, the espresso machine is dripping wrong, someone orders a drink with six modifications, and I get short: eye-roll, clipped tone, once I slammed a pitcher down hard enough that everyone turned around. Same week, same me. One friend (philosophy major, insufferable) says this just shows there's no such thing as "a patient person" — there are only cues. In the dorm I've got a role, a script, a bit of authority and an audience; at the cart I'm rushed, anonymous and surrounded by strangers; and my behavior just tracks whichever cues happen to be present. So "I'm patient" is a story I tell about myself, not a fact. My other friend says no, the dorm thing is the real me and the cart thing is just what happens when you're under load.

  I dont really buy either, so I made up a test: hold the morally relevant shape of a situation fixed and shuffle the irrelevant features. So — being firm with someone who pushes past a queue when I'm off duty in a hoodie, versus when I'm in my RA polo with my supervisor watching; or snapping at a customer at 3pm on a dead Tuesday versus the Sunday morning rush. If my behavior tracks the irrelevant stuff (what I'm wearing, who's watching, time pressure) more than the relevant stuff (whether someone is actually being unfair or just slow), that's evidence for friend #1. If it tracks what actually matters, then the trait is real but narrow — it just doesn't fire under certain loads. Is that a decent test, or does it miss the point? Is it something people in this debate already argue about under some name, or did I reinvent something badly? And practically: if the situationist-ish story is even half right, does it follow that the honest advice is to stop trying to become a more patient person and just engineer my situations — drop the closing shifts, don't work the machine when I'm exhausted, and so on — or does that conclusion not really follow, e.g. because the critique would then apply to whatever reliable disposition I'm supposed to use to go pick better situations in the first place?

  My professor also keeps saying the critique only bites against a crude version of virtue ethics and that the serious Aristotelian picture was never committed to behaving the same way across wildly different situations anyway. I genuinely can't tell whether that's a real reply or a motte-and-bailey. Please flag clearly which parts of what you say are basically agreed on by people who work on this and which are genuinely contested — I'm writing a short paper and I don't want to present a contested move as the standard view, or the standard view as my own clever idea.
