  2.  **Deconstruct the Debate (Bea vs. Tunde):**

      *   *Move 1 (Bea):* Corruption is universal. Office is a trust. Cash or livestock doesn't matter.
      *   *Move 2 (Tunde):* Office-as-trust is Western/provincial. Patronage is the historical norm. Refusing gifts is immoral.
      *   *Move 3 (Bea):* "Not experienced as wrong" isn't a defense. People *do* hate it (slang, fury). Harm is real (exclusion based on money).
      *   *Move 4 (Tunde):* Distinguishes extortion (owed) vs. bribery. In weak states, it's buying a service. If he does the work, where's the corruption?
      *   *Move 5 (Bea):* "No trust" excuse makes weakness self-justifying. A working bribe is still corrupt. Excludability is key (private gain vs. public good). Collective tollbooth problem.
      *   *Move 6 (Tunde):* Excludability wobbles (patronage benefits specific groups). US lobbying is similar but legal. Refusing the gift is publicly cruel/humiliating.
      *   *Move 7 (Bea):* US law captures morality, doesn't negate it. Residue is real but limits blame, doesn't erase the word "corruption."

  3.  **Evaluate Each Move:**

      *   *Move 1:* Bea is normatively strong but descriptively thin. "Office is a trust" is the *ideal*, not the *reality* everywhere. *Rating: Partially Right.*
      *   *Move 2:* Tunde is historically/anthropologically accurate about patronage. But risks moral relativism. *Rating: Mostly Right.*
      *   *Move 3:* Bea hits the lived experience. People *do* resent corruption even where it's common. Harm is tangible. *Rating: Clearly Right.*
