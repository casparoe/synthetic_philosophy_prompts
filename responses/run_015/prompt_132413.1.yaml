          4.  Confidence & Uncertainty.
      *   *Specifics:* Ensure I address the "goat vs. envelope" detail. Ensure I address the "confession vs. grievance" stakes.

      *(Self-Correction during drafting)*: I need to be careful not to just say "both are right." I need to rate them. Bea's Move 1 is too rigid. Tunde's Move 6 on lobbying is a deflection, but his point on humiliation is vital. I need to make sure I don't validate the lobbying equivalence too much (it's distinct), but acknowledge the *access* parallel.
