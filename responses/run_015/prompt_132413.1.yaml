      *   *Move 5:* Bea's "collective tollbooth" is a strong systems argument. Weakness doesn't justify the cause of weakness. *Rating: Clearly Right.*
      *   *Move 6:* Tunde's comparison to lobbying is a bit of a "whataboutism" trap but highlights hypocrisy. The "public humiliation" point is the strongest ethical wrench in the gears. *Rating: Mostly Right (on humiliation), Mixed (on lobbying).*
      *   *Move 7:* Bea concedes the "residue" but holds the line on language. *Rating: Clearly Right.*

  4.  **Determine the Winner:**
      *   Bea wins on *systems* and *harm*.
      *   Tunde wins on *context* and *interpersonal ethics*.
      *   Overall: It's a draw, but Bea has the stronger *political* argument, while Tunde has the stronger *phenomenological* argument. For the novelist's specific problem (POV of the woman), Tunde's points about social pressure matter more for the *feeling*, but Bea's points matter for the *consequence*.
      *   *Decision:* Bea is more right about the *nature* of the act; Tunde is more right about the *experience* of the act. If forced to choose "who is winning the argument," Bea holds the moral high ground, but Tunde holds the ground of reality. I will call it a "Functional Draw with Different Domains."

  5.  **Identify What's Missing (The Core Insight):**
      *   The user suspects they are using one word for two jobs (Juridical vs. Moral).
      *   *Analysis:* They are actually missing the *temporal* dimension and the *agency* dimension.
      *   *Juridical:* Is this illegal/against formal rules? (Yes).
      *   *Moral:* Is this ethically wrong given the constraints? (Debatable).
      *   *Missing:* The concept of **Complicity in System Maintenance**. Every time she pays, she validates the system that hurt her. But every time she refuses, she sacrifices her family.
      *   *The "Residue":* It's not just a definition problem. It's the tragedy of *structural sin*. The individual is punished for the system's failure.
      *   *Refining the User's Hunch:* The user is right. It's not an excuse. It's the crux. The word "corruption" describes the system; the feeling "shame" describes the actor. They are conflating the *systemic label* with the *individual culpability*.

  6.  **Drafting the Response:**

      *   *Tone:* Respectful, analytical, encouraging.
      *   *Structure:*
          1.  Move-by-Move Rating.
