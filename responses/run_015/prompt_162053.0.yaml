answer: |-
  This is a sharp dissection. Your friend's "Hobbes with extra steps" critique is common but ultimately too thin. Hobbes is about *security* (avoiding the state of nature); performance legitimacy is about *modernity* (delivering a specific trajectory of development). The former is a floor; the latter is a ladder.

  To reconstruct the implicit theory, we have to separate what the practice *logically requires* to function from the rhetorical flourishes used to sustain it. Here is the breakdown of the philosophical presuppositions, the underdetermined gaps, and the stress tests you proposed.

  ### 1. The Implicit Theory: Trusteeship, Not Pure Consequentialism

  Is the view strictly consequentialist? **No.** If it were pure act-consequentialism (maximize utility now), the Zero-COVID contradiction you noted wouldn't be a contradiction; it would just be a recalculation. The fact that the regime feels the need to justify the *shift* from growth to safety and back again suggests they are managing a portfolio of expectations, not just a utility function.

  **The Strict Presupposition:**
  The practice presupposes a **Paternalistic Trusteeship**.
  *   **The Claim:** The state is not an agent of the people's *will* (procedural), but a guardian of the people's *interest* (substantive).
  *   **The Normative Core:** It is not eliminativist ("no revolt = legitimacy"). It makes a positive normative claim: *Governance is a technical competence, and those with the competence have the right to rule.*
  *   **What it Rules Out:** It strictly rules out **Proceduralism** (legitimacy comes from the *method* of selection) and **Deontological Rights** (legitimacy is constrained by inviolable individual rights regardless of outcome).

  **The Underdetermination:**
  It is underdetermined between **Hypothetical Consent** and **Coordination**.
  *   *Story A (Consent):* "If you understood the complexity, you would consent to our rule because we deliver what you actually need."
  *   *Story B (Coordination):* "We provide a focal point for social expectations. As long as we coordinate on this leader, society functions. Legitimacy is just the stability of that equilibrium."
  *   *Practice:* The regimes speak like Story A (moral duty, serving the people) but often operate like Story B (stability maintenance, preventing cascading failure). They don't need to pick, because both justify the same suppression of procedural dissent.

  ### 2. The Election Puzzle: Signal vs. Authorization

  You asked if the election is an information channel rather than authorization. **Yes, strictly.**

  In the Singaporean PAP model, the vote is not a *mandate* to govern (they already claim that via performance); it is a *sensor* for risk.
  *   **Strict Presupposition:** Dissent is data, not a veto. A drop in vote share signals a rise in the "cost of enforcement" or a drop in "reservoir of goodwill." It triggers a policy adjustment to lower the temperature, not a transfer of power.
  *   **Why care at all?** Because information asymmetry is the enemy of the technocrat. If you silence all feedback, you lose the ability to correct errors before they become systemic failures (the "Dictator's Dilemma"). Elections are a forced, periodic disclosure mechanism.
  *   **Does it have to pick?** No. The system works precisely because it is ambiguous. If it were purely authorization, they'd have to abide by the result (lose power). If it were purely information, they wouldn't need to campaign. The ambiguity allows them to treat a strong vote as *consent* and a weak vote as *feedback*, without ever admitting the voters are the *boss*.

  ### 3. The Auditor Problem and Goodhart's Law

  This is the critical vulnerability. If the regime controls the metrics, and legitimacy tracks the metrics, the system presupposes a **Proxy Trust**.

  *   **Strict Presupposition:** The practice presupposes that **Physical Reality is the Ultimate Audit.**
      *   Citizens may not trust the GDP number, but they trust the train schedule, the safety of the street, and the price of hawker food. The regime knows this. The statistics are for internal cadre evaluation; the *lived experience* is for public legitimacy.
      *   **Goodhart's Law Mitigation:** The system presupposes a **Multi-Metric Trade-off.** By rotating targets (sometimes growth, sometimes green, sometimes equality), they prevent cadres from optimizing a single number to death.
  *   **The Trust Question:** It does not presuppose trust in *numbers*; it presupposes trust in the *institution's capacity for self-correction*. The Anti-Corruption Bureau (CPIB in Singapore, CCDI in China) is the internal auditor. The logic is: "We police ourselves so you don't have to."
  *   **Eliminativism?** It flirts with eliminativism but cannot fully commit. If legitimacy were *just* "no revolt," they wouldn't need to publish poverty alleviation stats or build HDB flats. They would just build prisons. The fact that they invest heavily in *welfare* proves they believe there is a normative obligation to deliver, not just a strategic need to suppress.

  ### 4. The Thought Experiment: The Benevolent AI / Colonial Admin

  This is the stress test that breaks the "Pure Output" theory.

  *   **Scenario:** An AI or Colonial power delivers better metrics than any elected alternative.
  *   **Pure Output View:** Yes, it is legitimate.
  *   **Actual Practice View:** **No.** Neither China nor Singapore would accept this as fully legitimate.
      *   **Why?** Because "Performance Legitimacy" is shorthand for **"Performance within a National Project."**
      *   **The Hidden Variable:** *Membership.* The legitimacy claim relies on the idea that the government is *of* the nation, delivering *for* the nation's restoration or destiny. A colonial power delivers *for extraction* (even if benevolent). An AI delivers *for optimization*.
      *   **Strict Presupposition:** Legitimacy requires **Shared Fate.** The rulers must be vulnerable to the same conditions as the ruled (conceptually, if not financially). The "National Rejuvenation" (China) or "Vulnerability of a Small Island" (Singapore) narratives are not decoration; they are necessary conditions.
      *   **Conclusion:** The practice is **not** pure welfarism. It is **Welfarism + Nationalism.** If you remove the "We" (shared identity), the "What" (output) loses its legitimizing force. This answers your "if no" condition: the practice *is* secretly leaning on authorization/membership, specifically *collective* authorization (the nation), not *individual* authorization (the voter).

  ### 5. The Ratchet: Failure and Succession

  Does the logic accept that failure = loss of claim?
  *   **In Theory:** Yes. The "Mandate of Heaven" is explicitly revocable. The PAP explicitly says, "If we become complacent, vote us out."
  *   **In Practice:** They build **Succession Buffers.**
      *   **Founder's Mandate:** "We built this." This converts past performance into a reservoir of credit to spend during future underperformance.
      *   **Systemic Integration:** In Singapore, the party is woven into the unions, the housing boards, and the grassroots organizations. Removing the party isn't just changing management; it's risking systemic collapse.
  *   **Strict Presupposition:** Legitimacy is **Asymmetric.** Success buys credit; failure spends it. But the "bank" is managed by the regime itself. They presuppose that the cost of coordination for the opposition (finding new leaders, building new trust) is higher than the cost of tolerating slight underperformance by the incumbent.
  *   **The Ratchet:** It does *not* presuppose a mechanism for peaceful removal upon failure. It presupposes that failure will lead to *adaptation*, not *removal*. If adaptation fails, the theory implies revolt is justified (historically), but the practice works hard to make revolt cognitively and logistically impossible.

  ### 6. Summary: Strict Presuppositions vs. Underdetermination

  | Feature | Strict Presupposition (Required for coherence) | Underdetermined / Flexible (Can vary) |
  | :--- | :--- | :--- |
  | **Source of Right** | Competence/Trusteeship (Substantive) | Historical Mandate vs. Hypothetical Consent |
  | **Role of Elections** | Information/Safety Valve (Signal) | Degree of Contestation (can be more or less competitive) |
  | **Auditor** | Physical Reality + Internal Self-Policing | Trust in specific Statistics (can be low) |
  | **Legitimacy Basis** | Output + Shared Identity (Nationalism) | Specific Ideology (Communism vs. Pragmatism) |
  | **Failure Condition** | Loss of Moral Claim (Theoretical) | Mechanism of Removal (Practically undefined) |
  | **Normative Status** | Real Claim (Duty to Deliver) | Eliminativism (Stability as end goal) |

  ### 7. What Changes if We Swap the Theory?

  If you swapped the implicit theory for **Procedural Consent**:
  *   **Practice Change:** Elections would determine *policy*, not just personnel. A vote against a housing policy would kill the policy, even if the technocrats said it was efficient. The "Ministerial Pay" logic would collapse (you don't pay CEOs based on shareholder vote sentiment).
  *   **Legitimacy:** Would rest on the *fairness of the count*, not the *quality of the train*.

  If you swapped for **Flat Welfarism** (Pure Output):
  *   **Practice Change:** The Colonial/AI scenario becomes acceptable. Nationalism becomes irrelevant. If a foreign power ran the country better, they should rule.
  *   **Legitimacy:** Would be fully eliminativist. "Legitimacy" would just mean "High Utility."

  ### Final Verdict on the "Hobbes" Critique

  Your friend is wrong because Hobbes is static (avoid death); Performance Legitimacy is dynamic (achieve destiny).
  However, your **Auditor Problem** is the right wedge. The system presupposes that **competence is self-auditing.** It assumes that a truly competent regime will naturally detect its own errors and correct them without external input.
  *   **The Philosophical Gamble:** The regime bets that its internal feedback loops (cadre evaluation, internal surveys, controlled elections) are faster and more accurate than the "chaos" of external opposition.
  *   **The Risk:** If the internal sensors drift (Goodhart's Law), the regime becomes blind. It presupposes that *truth* is accessible to the center if the bureaucracy is disciplined enough. That is a metaphysical claim about the nature of information in hierarchies that is arguably false.

  **To answer your core question:** The practice is **underdetermined**. It works because it allows the citizen to project *Consent* onto *Delivery*, and the State to project *Trusteeship* onto *Control*. It collapses if you force it to admit it is purely one or the other. The Colonial/AI test proves it requires the "Shared Fate" variable to function as *legitimacy* rather than just *management*.
