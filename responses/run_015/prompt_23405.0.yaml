answer: |-
  The claim that a neuron "represents" a property implies a semantic relationship: the activation value of that unit should encode information about that property in a way that is readable by the rest of the network. While causal intervention (ablation, patching, etc.) is a necessary condition for establishing a neuron's importance, it is **not sufficient** to establish representation.

  Passing a causal-intervention test demonstrates that the unit is **causally necessary** for the behavior, but it does not demonstrate that the unit **semantically encodes** the property. Below is an argument for why causality falls short, followed by a precise explanation of the alternative mechanisms the test fails to rule out.

  ### 1. Causal Necessity $\neq$ Semantic Encoding
  The fundamental category error in equating causal impact with representation is confusing the *carrier* of a signal with the *content* of the signal.

  Consider a digital circuit where a specific wire connects a sensor to a processor. If you cut the wire, the processor stops receiving data, and the system fails. However, the wire does not "represent" the data; it merely transmits it. In a neural network, a neuron might act as a **conduit** or a **gate** rather than an encoder.

  If you ablate a neuron and performance drops, you have proven that information flow through that parameter is required for the output. You have not proven that the *magnitude* or *presence* of that neuron's activation corresponds to the *concept* you are testing. It could simply be a threshold switch that, when active, allows a different, distributed representation downstream to be read out.

  ### 2. What the Causal Test Fails to Rule Out
  To claim a neuron "represents" $X$, we must rule out alternative computational roles that also result in causal dependency. The standard intervention test fails to rule out the following four specific scenarios:

  #### A. The "Fuse" or "Relay" Mechanism
  **What it is:** The neuron is a necessary conduit for information encoded elsewhere, or a bias enabler that does not contain the feature itself.
  **Why the test fails:** If you ablate a fuse, the light goes out. This proves the fuse is causally necessary for the light, but it does not mean the fuse "represents" illumination.
  **In Transformers:** A neuron might simply project a high-norm vector into the residual stream that allows a downstream attention head to attend to the correct token. The *direction* of the vector matters, but the specific neuron is just one basis vector contributing to that direction. Ablating it reduces the norm or alters the direction enough to break the circuit, but the neuron itself isn't a "feature detector"; it's a component of a projection matrix.

  #### B. Polysemanticity and Disjunctive Firing
  **What it is:** The neuron fires for feature $A$ OR feature $B$ (e.g., "Cat" OR "Dog" OR "High Contrast Texture").
  **Why the test fails:** If you test the causal intervention only on inputs containing $A$ (cats), ablating the neuron will hurt performance. The test confirms the neuron is involved in processing cats. However, it fails to rule out that the neuron is actually a **"Animal" detector** or a **"Texture" detector**.
  **The Implication:** Claiming the neuron represents "Cat" is an overfit interpretation of the test conditions. The neuron represents a disjunction ($A \lor B$), and your test only probed $A$. Without testing negative controls (e.g., ablating the neuron on Dog images to see if it also breaks), you cannot claim specific representation.

  #### C. Basis Dependence (The Subspace Problem)
  **What it is:** Information in transformers is often stored in **subspaces** (linear combinations of neurons), not individual neuron coordinates. This is central to the theory of *superposition*.
  **Why the test fails:** If a feature is represented by a direction $\vec{v}$ that is diagonal to the neuron basis, it will have non-zero projection onto many neurons. Ablating *any* of those neurons will degrade the projection of $\vec{v}$, causing a performance drop.
  **The Implication:** The test might identify Neuron 5 as "causal." But if you rotated the basis of the MLP layer, Neuron 5 would change, yet the model's behavior and the underlying representation would remain identical. If the "representation" depends on the arbitrary choice of basis (the specific neuron indices), it is not a robust semantic representation; it is a **basis artifact**. The causal test fails to rule out that the true representation is distributed across a subspace, and you merely identified one contributing coordinate.

  #### D. Capacity and Noise vs. Information Loss
  **What it is:** The neuron provides general computational capacity or stabilizes the activation distribution, rather than encoding specific semantic information.
  **Why the test fails:** Zeroing out a neuron changes the distribution of activations entering the next layer (e.g., shifting the mean or reducing the variance). Downstream layers, trained on the original distribution, may perform worse simply due to **distributional shift** or reduced model capacity, not because specific information about "cats" was deleted.
  **The Implication:** The intervention acts as a "damage" test, not an "information" test. It fails to rule out that the neuron is merely contributing to the **signal-to-noise ratio** of the residual stream. If adding a random constant offset also breaks the "cat" classification, the neuron likely wasn't representing "cat"; it was just maintaining the correct activation scale for a downstream ReLU or LayerNorm.

  ### Conclusion
  To say a neuron "represents" a property implies that the neuron's activation value is a robust, interpretable encoding of that property. The causal-intervention test only proves that the neuron is **instrumental** to the output.

  It fails to distinguish between a neuron that **contains** the information (representation) and a neuron that merely **transmits**, **enables**, or **stabilizes** the information (mechanism). To move beyond causality toward representation, one must complement intervention with **probing** (can a linear probe read the feature from this neuron?), **basis invariance** (does the feature persist across rotations?), and **specificity checks** (does the neuron fail to fire for semantically distinct but causally similar inputs?). Without these, "representation" remains a metaphor for "causal leverage."
