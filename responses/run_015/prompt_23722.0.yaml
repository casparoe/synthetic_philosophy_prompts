      *   *Mode 2 (Unevaluable):* I need to bet on a math statement I can't prove/disprove yet (e.g., Riemann Hypothesis). *Implication:* Use logical uncertainty/probabilistic logic. Treat math like empirical stuff until proven.
      *   *Mode 3 (Reflection):* I know Future Me will believe $X$ with 99% confidence. Should I believe $X$ now? *Implication:* Trust your future reasoning *if* you trust the process, but account for potential corruption or insanity.

  3.  **Drafting Practical Advice (Iterative Process):**

      *   *Scenario 1: Confident in theorem, not consequences.*
          *   *Problem:* If I say $P(A)=0.99$ and $A \implies B$, coherence demands $P(B) \ge 0.99$. But I haven't checked $B$.
          *   *Practical fix:* Don't claim coherence you haven't earned. Your credence in $A$ is actually "Credence that $A$ is true AND I haven't missed a subtle implication that contradicts my worldview."
          *   *Action:* Treat derived claims as *new* hypotheses until verified. Use a "computational budget" mindset. If $B$ is far away in implication space, discount it.

