  Two assistant professors, Smith and Jones, are the last ones left in a Philosophy Department faculty meeting. The Chair is auctioning off the department's single reserved parking space.

  **Chair:** "Rule one: Highest bid wins the spot. Rule two: Both the winner and the runner-up must teach their bid amount in 8 a.m. Introductory Logic sections. Smith, current bid is ten semesters."

  **Smith:** "Eleven."

  **Jones:** "Twelve."

  **Smith:** "Jones, stop. The parking spot saves me fifteen minutes a day. Twelve semesters of 8 a.m. Logic is literally half my tenure clock. The cost exceeds the value."

  **Jones:** "Smith, look at the payoff matrix. I'm currently the runner-up at eleven. If I drop out now, I teach eleven sections of Logic and get no parking. That's a net loss of eleven. If I bid twelve and win, I teach twelve sections, but I get the spot. Assuming the spot is worth at least one section of my sanity, my net loss is only eleven. It's the same loss, but I get the key."

  **Smith:** "But if I bid thirteen..."

  **Jones:** "Then I bid fourteen. Rationality dictates we minimize marginal loss, not total cost."

  **Smith:** "Thirteen."

  **Jones:** "Fourteen."

  **Chair:** "Sold to Jones for fourteen. Smith, you're on the 8 a.m. roster for thirteen semesters. Jones, you're on for fourteen. Here's your parking permit."

  **Jones:** (Taking the permit) "Excellent. Now I can park right in front of the building."

  **Smith:** "Jones... we both teach 8 a.m. Logic."

  **Jones:** "Yes?"

  **Smith:** "Which means we both have to be in the classroom at 7:45 to prep."

  **Jones:** "Right."

  **Smith:** "And the walk from the faculty lot takes fifteen minutes. The walk from the reserved spot takes one."

  **Jones:** "So I save fourteen minutes."

  **Smith:** "But you're teaching fourteen semesters of 8 a.m. Logic. You're never going to leave campus long enough to move your car."

  **Jones:** (Pauses) "Chair, can I bid on a motorcycle?"

  **Chair:** "That's a new auction. Starting bid: one tenure track job."
