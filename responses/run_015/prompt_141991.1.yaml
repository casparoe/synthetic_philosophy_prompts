answer: |-
  You have identified a structural tension that is often present in non-reductive physicalism and metaethical naturalism, yet frequently glossed over in introductory treatments of grounding. You are asking for the "carving"—the structural analysis of the problem—rather than a mere label. Here is the breakdown of the phenomenon, its scope, its relation to existing concepts, and a proposed conceptual tool for it.

  ### 1. The Carving: Ontological Priority vs. Identificatory Priority

  This is a single phenomenon, best understood as a conflict between two different hierarchies that grounding claims attempt to unify:

  1.  **Ontological Priority:** The claim that $G$ is more fundamental than $F$ (i.e., $F$ obtains *in virtue of* $G$). This licenses the "demotion" of $F$ from the fundamental inventory of the world.
  2.  **Identificatory Priority:** The requirement that to specify *which* $G$-facts are doing the grounding, one must invoke the concept $F$.

  The tension arises because **Fundamentality** is typically associated with **Self-Containment**. If $G$ is truly fundamental, the "Book of the World" written in $G$-vocabulary should be complete. It should be able to specify the state of the world without needing terms from the derivative level. Your observation highlights that in many grounding claims, the $G$-base is *ontologically* prior but *conceptually* parasitic.

  **Is it a problem of specification, vocabulary, or relata?**
  It is primarily a problem of **vocabulary constrained by natural kinds** (or "joint-carving," in Ted Sider's terminology).
  *   **The Relata:** The $G$-facts exist independently.
  *   **The Vocabulary:** The $G$-vocabulary lacks the resources to *group* the relevant facts into a coherent class without borrowing from $F$.
  *   **The Specification:** The specific subset of $G$-facts that grounds $F$ is not "projectible" in $G$-terms alone. It looks like a gerrymandered disjunction from the perspective of $G$, but a unified kind from the perspective of $F$.

  ### 2. Scope: When Does This Arise?

  This does not arise for every grounding claim. It arises specifically under conditions of **Heterogeneous Multiple Realizability**.

  *   **It does NOT arise in Type-Identity Cases:** If "Water = H₂O," we can pick out the ground (H₂O) using only microphysical vocabulary. Once the identity is established, the derivative term "water" is not needed to specify the fundamental base. The base is projectible in fundamental terms.
  *   **It DOES arise in Functional/Disjunctive Cases:** As in your pain example. The physical realizers of pain (C-fiber firing, silicon state X, alien slime state Y) share no unified description in microphysical vocabulary *other than* the fact that they all realize the functional role of *pain*. To pick out the relevant physical facts, you must say, "The physical facts that realize *pain*."

  Therefore, the phenomenon is specific to **cross-level grounding where the lower level is heterogeneous relative to the higher level.**

  ### 3. Nearest Named Phenomena (and how this differs)

  You mentioned several concepts. Here is how your phenomenon distinguishes itself from them:

  *   **Supervenience:** Supervenience is a modal claim (no $F$-difference without a $G$-difference). It does not require identifying *which* $G$-facts ground *which* $F$-facts. Your problem is about the *explanatory link*, not the modal correlation. Supervenience allows the base to remain unspecified; grounding demands it be specified.
  *   **Bridge Laws:** Bridge laws ($F \leftrightarrow G$) suggest reducibility. If you need a bridge law to connect them, $F$ is usually considered autonomous. Your case is trickier: the author wants to *demote* $F$ (ontologically) while admitting they need $F$ to *describe* the ground of $F$. Bridge laws usually preserve the legitimacy of $F$-vocabulary; your case suggests $F$-vocabulary is contaminating the fundamental description.
  *   **Realization:** Realization accounts often accept that $F$ is defined functionally. However, standard realization theory usually treats the realizer ($G$) as independently specifiable (e.g., "the state that plays role $R$"). Your insight is that if the *only* way to pick out that state is by referencing $R$ (where $R$ is $F$), then $G$ isn't doing the work of a fundamental base.
  *   **Joint-Carving (Sider):** This is the closest established concept. Ted Sider argues that fundamental structure must be described in "joint-carving" vocabulary. Your phenomenon is effectively a **Failure of Joint-Carving at the Base**. The $G$-facts that ground $F$ do not form a joint-carving class in $G$-vocabulary; they only form a class when viewed through $F$.

  ### 4. A Proposed Concept: Identificatory Dependence of the Base (IDB)

  Since there is no single canonical label for this specific tension between demotion and specification, I propose the term **Identificatory Dependence of the Base (IDB)**.

  **Definition:**
  A grounding relation ($G$ grounds $F$) exhibits **Identificatory Dependence of the Base** if and only if:
  1.  $G$ is claimed to be ontologically fundamental relative to $F$.
  2.  The specific subset of $G$-facts that serve as the ground for a given $F$-fact cannot be specified, enumerated, or projected using only $G$-vocabulary.
  3.  Adequate specification of the $G$-base necessitates reference to $F$ (or $F$-roles).

  **Implication:**
  If IDB holds, the claim that $F$ is "nothing over and above" $G$ is compromised. While $F$ may be ontologically dependent, the *inventory of the world* cannot be written without $F$. Therefore, $F$ retains a form of **conceptual fundamentality** even if it lacks ontological fundamentality.

  ### 5. Case and Non-Case

  **Case (Falls under IDB): Moral Naturalism**
  *   **Claim:** The fact that *Action A is Wrong* is grounded in *Natural Facts N*.
  *   **Ground:** $N$ includes facts about suffering, intent, social cohesion, etc.
  *   **Problem:** To pick out *which* natural facts constitute the ground of *wrongness* (as opposed to mere rudeness or imprudence), one must appeal to moral truisms or the concept of *wrongness* itself. There is no "view from nowhere" in naturalistic vocabulary that isolates the "wrongness-grounding" facts without already using moral concepts.
  *   **Result:** The naturalist cannot demote moral vocabulary from the fundamental inventory without losing the ability to specify the natural base.

  **Non-Case (Does not fall under IDB): Thermodynamics**
  *   **Claim:** The fact that *Gas G has Temperature T* is grounded in *Mean Kinetic Energy M*.
  *   **Ground:** $M$ is the aggregate motion of particles.
  *   **Analysis:** We can specify $M$ entirely in microphysical vocabulary (mass, velocity, vector summation). We do not need the concept "temperature" to identify the kinetic energy. "Temperature" is a useful shorthand, but the ground ($M$) is self-specifying in fundamental terms.
  *   **Result:** The demotion holds. "Temperature" is truly nothing over and above the microphysical inventory, because the microphysical inventory can be written without it.

  ### 6. Conclusion: What this means for Fundamentality

  If the fundamental story can only be told using the vocabulary of the derivative level (due to IDB), then the derivative level is not fundamental in the **ontological** sense (it doesn't exist independently), but it is indispensable in the **ideological** sense (we cannot describe the structure of the world without it).

  This suggests a split in the concept of fundamentality:
  1.  **Ontological Fundamentality:** What exists independently? (Answer: $G$)
  2.  **Ideological Fundamentality:** What vocabulary is required to write the complete book of the world? (Answer: $G$ + $F$)

  Your intuition is tracking the failure of grounding theorists to acknowledge that **Ontological Demotion** does not automatically entail **Ideological Elimination**. When IDB is present, the "demoted" facts ($F$) must remain in the inventory, not as ontological primitives, but as **indispensable classificatory primitives**.
