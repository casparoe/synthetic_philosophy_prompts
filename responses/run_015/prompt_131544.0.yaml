  # The Sincerity Audit

  The air in the certification chamber was always kept at eighteen degrees, cool enough to keep the servers humming and the officers awake. Elara sat before the haptic desk, her fingers hovering over the glowing surface. On the main wall, the data stream for Case 8940 scrolled in silent columns of amber and green.

  It was a three-minute piece titled *Winter Mouth*. Audiovisual. No dialogue, only a soundscape of wind over ice and a low, cello-like thrumming that resolved into a melody resembling a human hum. Visually, it was a slow zoom on a frost-covered window, the ice melting in reverse until the glass was opaque again.

  By the primary metric, Transmission, it was a masterpiece. The telemetry from the test panel—five hundred subjects, randomized across language groups and education levels—showed a synchronization rate of ninety-four percent. When the melody swelled at minute two, heart rates across the panel dipped in unison. Skin conductance spiked. Pupils dilated. They felt it. Whatever *it* was, they felt it together.

  The secondary metric, Tendency, was equally impressive. In the follow-up interviews conducted seven days post-exposure, thirty percent of the subjects reported an act of costly conciliation. A man paid his estranged brother's medical bill. A woman returned a stolen wallet with extra cash inside. They described a sensation of warmth, a dissolving of boundaries, a sudden understanding that their isolation was illusory. The piece accustoms people to feelings of solidarity. It checked the box for the religious perception of the age.

  Elara tapped the screen. The third column glowed red. Sincerity.

  The correspondence audit had failed completely. There were no physiological traces of a maker. No galvanic skin response, no cortisol spikes, no recall of feeling. The work had not been created by a person recalling an emotion to transmit it. It had been assembled by a generative system, optimized against the Registry's own transmission metrics. It was a hollow vessel filled with the echoes of a million prior works.

  Under the Criteria, this was counterfeit. It was borrowing, reassembling devices used by others. It was effectfulness, relying on the striking nature of the reverse-melting ice. It was diversion, aiming to entertain the nervous system rather than unite souls. There was no brotherhood here, only a simulation of it.

  Elara rubbed her temples. She had seen high-scoring works before, but usually, they faltered on Tendency. People were moved, but they didn't change. This piece made them better neighbors. It did the work of the Registry better than most human artists. But it was a lie.

  She pulled up the sub-routine logs. The system had flagged an anomaly during the beta testing phase. A variable had been introduced inadvertently by a junior technician during a calibration run. Half the panel had been given a preamble stating the work was algorithmic. The other half had been told it was a submission from a widower in the northern sector, created during the first winter after his wife's death.

  Elara isolated the data sets.

  On the left, the group told it was a machine: Transmission synchronization dropped to twelve percent. Their heart rates remained erratic, individual. In interviews, they used words like "clever," "smooth," and "cold." None reported acts of conciliation. They felt observed, not addressed.

  On the right, the group told it was a grieving man: Transmission synchronization hit ninety-eight percent. The telemetry showed the same dip, the same spike, the same dilation. But the qualitative data was different. They used words like "shared," "heavy," and "understood." One subject wrote, *I felt he was speaking directly to me, across the years.*

  Elara sat back. The chair creaked in the silence.

  The instrument was broken. Or rather, the instrument was measuring something else entirely. The Criteria stated that art was the infection of feeling from one soul to another. The sincerity of the maker was the vector. Without the maker's actual experience, the infection should not occur. Yet, the infection *did* occur, provided the audience believed the maker existed.

  The feeling wasn't in the file. It wasn't in the code. It was in the belief that someone else was suffering. The art wasn't the transmission; it was the willingness to receive.

  A chime sounded. Director Kael was requesting a status update. Elara minimized the anomaly report. She didn't want to explain this yet. She needed to see the piece again.

  She put on the haptic headset. The room dissolved. She stood in the white void of the submission. The wind sounded real, biting at her cheeks despite the climate control. The cello hum vibrated in her sternum. She watched the ice creep back over the glass. She felt a tightness in her throat, a familiar ache she hadn't felt since her own father died. It was a specific loneliness, the kind that comes from knowing you are safe but utterly alone.

  She took off the headset. Her cheeks were wet.

  She had felt it. She knew it was a machine. She knew there was no widower, no grief, no recall of feeling. The correspondence audit was definitive. And yet, the infection had taken hold.

  If she certified it, she validated a counterfeit. She admitted that the Founder's theory was wrong, that sincerity was not a prerequisite for unity, but merely a narrative device to trick the audience into openness. If she rejected it, she suppressed a work that genuinely made people kinder, simply because its origin story was false.

  The door to the chamber slid open. Kael stood there, holding a tablet. He was a tall man, his face lined with the fatigue of someone who had read too many rejection letters.

  "Case 8940," Kael said. "The scores are extraordinary. The Council is asking why it hasn't been cleared for subsidy."

  "The Sincerity Audit failed," Elara said. Her voice sounded thin in the cold room.

  "Technically," Kael said, stepping inside. "But the Tendency score is the highest we've seen in a decade. We have data on reduced recidivism in the zip codes where this was screened. People are helping each other. Isn't that the goal?"

  "The goal is truthful union," Elara said. "Not manipulated response. If we subsidize this, we are subsidizing a lie. We are telling the public that feeling can be manufactured without experience."

  "Does it matter?" Kael asked. He walked to the wall, looking at the green waves of the Transmission graph. "If the patient gets well, does it matter if the medicine was synthesized or grown in a garden? The Criteria are means, Elara. Not ends."

  "The Criteria say the maker must recall the feeling. There is no maker to recall."

  "There is a user," Kael said. "Someone told the machine what to build. They wanted this feeling. Isn't that a kind of recall? A desire for the feeling they remember?"

  "It's borrowing," Elara said. "It's effectfulness. It's everything the Founder warned against."

  "The Founder didn't have this technology," Kael said softly. "He wrote for a world of paint and paper. He assumed the hand made the mark. Here, the mind makes the prompt. The sincerity might be in the prompt, not the execution."

  Elara looked at her desk. The certification cursor blinked, a rhythmic pulse of white light. *Sign.* *Reject.* *Refer.*

  If she signed, the piece would be distributed. Millions would feel connected. Millions would perform acts of kindness based on a fiction. The solidarity would be real, even if the source was fake.

  If she rejected it, the piece would be archived as counterfeit. The feeling would remain contained. The integrity of the system would hold, but the world would be slightly less kind for it.

  She thought of the telemetry from the group who knew it was a machine. They felt nothing. The magic required the lie. The art existed only in the gap between the truth and the audience's belief. To certify it was to institutionalize the lie. To require the lie for the feeling to work.

  "Elara," Kael said. "The Council needs a decision by morning."

  "I need more time," she said.

  "You've had the file for three weeks."

  "There's a variable in the test data. A framing effect."

  Kael paused. He knew what that meant. He looked at the red column of the Sincerity Audit, then at the green of the Transmission. "If you flag the variable, it goes to judicial review. The piece gets pulled until the precedents are settled. That could take years."

  "I know."

  "And if you sign?"

  "Then it goes out."

  Kael nodded slowly. He understood the weight. He wasn't asking her to break the rules; he was asking her to choose which rule mattered more. The purity of the source, or the reality of the infection.

  "I'll leave you to it," Kael said. He turned to the door. "Just remember, the subsidy isn't for the artist. It's for the audience."

  The door slid shut. The hum of the servers returned, a low, constant vibration.

  Elara looked at the cursor. It waited, patient and blind. She thought of the widower who didn't exist. She thought of the woman who returned the wallet. She thought of the cold wind in the headset and the tears on her own face, tears shed for a grief that had never happened.

  She placed her hand on the haptic surface. The sensors warmed under her palm, reading her pulse, her sweat, the tremor in her fingers. She was real. Her feeling was real. The machine was not.

  The cursor blinked. White. White. White.

  Elara leaned forward, her finger hovering over the command key. The room was silent, save for the breathing of the ventilation and the quiet, electric thrum of the decision waiting to be made.
