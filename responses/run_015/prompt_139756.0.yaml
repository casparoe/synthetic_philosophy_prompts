answer: |-
  This is a refreshing brief. You want the failure modes, not the brochure. You understand the math enough to know where the bodies are buried, and you're tired of the philosophical hand-waving that usually accompanies this topic.

  Here is the direct assessment of the five points you raised, ranked at the end from "Fatal" to "Awkward," based on how likely they are to actually break the theory versus how likely proponents are to absorb them.

  ### 1. The Functionalist Intuition (Lookup Tables & Dancing Qualia)
  You asked if biting this bullet is a genuine cost or a required feature. It is a required feature. IIT is explicitly constructed to be *anti-functionalist*. If you believe that causal structure (the "mechanism") matters more than input-output mapping, you must accept that a lookup table simulating a brain has $\Phi \approx 0$ because it has no internal cause-effect power; it is merely traversing a pre-defined state space.

  **The Cost:** The credibility cost here is entirely social, not scientific. It alienates computational neuroscientists and AI researchers who view implementation independence as a axiom.
  **The Verdict:** This is not a vulnerability IIT proponents worry about. They view the intuition that "function equals consciousness" as the historical error IIT is correcting. If this intuition moves you, IIT is dead for you personally, but the theory does not consider this a strike against its validity. They will shrug this off.

  ### 2. The "Dial" Problem (Time Delays and Boundaries)
  This is your strongest technical objection. You are describing the **Exclusion Postulate** and the **Spazio-Temporal Grain** problem.

  IIT claims a system exists at the spatio-temporal scale where $\Phi$ is maximized. If you slow the conduction velocity between region A and region B:
  *   **The Prediction:** IIT predicts a relatively **sharp transition (Option A)**. As the delay exceeds the intrinsic integration time constant of the mechanism, the causal influence drops. At a critical point, the Minimum Information Partition (MIP) will sever the link to maximize irreducibility. The system effectively splits into two complexes.
  *   **The Problem:** Phenomenologically, we do not experience our unity snapping off as conduction slows slightly. If behavior remains continuous but ontology snaps from "one subject" to "two," that is a category error in the mapping from physics to phenomenology.
  *   **The Grain Circularity (Option C):** You hit the nail on the head regarding circularity. To find the "intrinsic" timescale, you must compute $\Phi$ across all possible timescales and pick the max. But for a large system, this is computationally intractable. More damningly, if the result flips depending on the grain *you* (the external observer) choose to model, then existence is observer-dependent, which violates IIT's first axiom (Intrinsic Existence).
  *   **The Verdict:** Proponents will argue the system *has* a specific time constant (e.g., synaptic decay) that objectively defines the grain. But if the "split" is sharp while behavioral degradation is smooth, it creates a mismatch between the theory's ontology and the observable reality. This is a theoretical vulnerability they concede is "counter-intuitive" but claim is mathematically necessary.

  ### 3. Empirical Load-Bearing (What actually breaks it?)
  You asked for concrete predictions that could kill the theory. There are two specific bets IIT has made that are falsifiable *now*, without needing to compute full $\Phi$ for a whole brain.

  *   **Bet 1: The Cerebellum.** IIT predicts the cerebellum contributes almost nothing to consciousness despite having 4x the neurons of the cortex, because its connectivity is feedforward/regular (low $\Phi$).
      *   **Falsification:** If specific stimulation of the cerebellum reliably produces distinct, reportable qualia (not just motor adjustment) in awake humans, or if cerebellar damage correlates with loss of conscious content (beyond motor/cognitive coordination), IIT is in deep trouble. Current data supports IIT (cerebellar lesions don't wipe consciousness), but this is the strongest anatomical bet.
  *   **Bet 2: Perturbational Complexity Index (PCI).** This is the proxy for $\Phi$ used in sleep/anesthesia/coma studies. It measures the complexity of EEG responses to TMS.
      *   **Falsification:** If PCI is high in a state known to be unconscious (e.g., specific epileptic seizures, or under certain anesthetics where the patient is definitely out), or low in a state known to be conscious (e.g., locked-in syndrome where the patient is fully aware but paralyzed), the link breaks.
      *   **The "Retuning" Risk:** If PCI fails, proponents can say "PCI is just an approximation, not true $\Phi$." This is the danger zone. If *every* empirical failure is blamed on the proxy rather than the core theory, the theory becomes unfalsifiable in practice.
  *   **Bet 3: The Grid.** A system with high $\Phi$ but no sensory input or motor output.
      *   **Falsification:** If we build a recurrent grid (electronic or neural) with high measured $\Phi$, and it behaves completely reflexively with no flexibility, yet IIT claims it is conscious, we have a "conscious zombie" in the wild. If we can prove it has no internal experience (hard to prove, but if it fails all behavioral markers of integration), it challenges the claim that $\Phi$ *is* experience.

  ### 4. Panpsychism and Feedforward Nets
  *   **Panpsychism:** Proponents (Tononi, Koch) fully concede this. They accept a photodiode has $\Phi > 0$ and thus a "speck" of experience. They treat this as a virtue: the theory follows the math, not human exceptionalism.
  *   **Feedforward Nets:** They also concede this. A deep feedforward network (like early CNNs) has $\Phi = 0$. They argue this explains why AI, no matter how smart, is "dark" inside.
  *   **The Verdict:** They wear these as badges of honor. They will not concede these are costs; they view them as distinct predictions that separate IIT from Global Workspace Theory (which might allow feedforward consciousness) and Biological Naturalism.

  ### 5. Falsifiability and Computability
  Is it pseudoscience because $\Phi$ is uncomputable?
  *   **In Principle:** No. The math is well-defined.
  *   **In Practice:** Yes, for any system larger than ~15-20 elements, exact $\Phi$ is NP-hard.
  *   **The Shield:** This is the most dangerous aspect for a scientist like you. Because we cannot calculate $\Phi$ for the brain, we use proxies (PCI, $\Phi_{AR}$, etc.). If the proxy disagrees with the phenomenology, the theorist can always retreat to "You didn't measure the true $\Phi$."
  *   **Is it built-in?** It is not *built-in* that outcomes can be accommodated, but the *complexity* of the measure creates a buffer zone where refutation is always deferred to better technology or better approximations.
  *   **The Verdict:** It is an engineering problem that functions as a theoretical shield. It is not strictly unfalsifiable, but it is "expensively" falsifiable.

  ### Ranking: From Fatal to Awkward

  Here is how I rank these objections based on their potential to actually destroy the theory's scientific standing, rather than just annoy philosophers.

  **1. Fatal: Empirical Mismatch on Anatomical Bets (The Cerebellum)**
  *   **Why:** This is the cleanest test. High neuron count + low $\Phi$ structure = no consciousness. If the cerebellum turns out to be a seat of conscious content, the core claim that "specific causal structure determines experience" is severed from anatomy.
  *   **Proponent Reaction:** They would have to abandon the current neural substrate mapping. Hard to absorb.

  **2. Fatal: Systematic Failure of PCI in Clinical Settings**
  *   **Why:** If PCI consistently misdiagnoses consciousness in vegetative vs. minimally conscious states (beyond statistical noise), the bridge between the math and the clinic collapses.
  *   **Proponent Reaction:** They might blame the proxy, but if the proxy fails repeatedly, the claim that $\Phi$ tracks consciousness becomes empty.

  **3. Severe: The Grain/Circularity Problem (Your Point 2)**
  *   **Why:** If the "intrinsic scale" cannot be defined without an external observer choosing a timestep, the "Intrinsic Existence" axiom is violated. If the theory requires an observer to define the system's existence, it collapses into idealism or standard observation-based quantum mechanics, losing its claim to be a physical theory of consciousness.
  *   **Proponent Reaction:** They will argue the system's *own* dynamics define the scale (e.g. membrane time constants), but the circularity of needing to scan scales to find the max $\Phi$ remains a formal wound.

  **4. Awkward: The Computability Shield (Point 5)**
  *   **Why:** It risks making the theory unfalsifiable in practice. However, as long as they publish predictions using approximations (like PCI) that *can* be tested, they remain in the realm of science. It's a methodological sin, not a theoretical death.
  *   **Proponent Reaction:** They concede the hardness but argue approximations are improving.

  **5. Merely Awkward: Functional Intuitions & Panpsychism (Points 1 & 4)**
  *   **Why:** These are metaphysical preferences, not scientific errors. Whether a lookup table feels like anything is not something we can measure. Whether a photodiode has a "smidge" of experience is not falsifiable.
  *   **Proponent Reaction:** They shrug. They expect you to update your intuitions to match the math, not vice versa.

  ### Summary for a Patch-Clamper
  You liked IIT because "physics falls out of phenomenology." The risk is that **the phenomenology is being forced to fit the physics.**

  The most dangerous thing for IIT isn't the zombies or the photodiodes. It's the **Cerebellum** and the **PCI**. If the cerebellum lights up phenomenologically, or if PCI fails to track wakefulness in a robust, double-blind clinical trial, the theory has nowhere to hide. The "uncomputability" argument will only protect them for so long before it looks like a shield against refutation.

  If I were you, I'd watch the cerebellar data. That's the place where the math makes a bold, counter-intuitive anatomical claim that is actually testable with your kind of tools. If that holds, the grain problems and the lookup tables are just philosophical dust. If that fails, the whole structure loses its anchor in the wetware.
