  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to sound like an IIT hater. The user *likes* IIT. I need to be the devil's advocate they asked for, not a debunker. Validate why they like it (physics from phenomenology) before hitting the flaws.
      *   *Technical Detail:* Mention the "Minimum Information Partition" (MIP) regarding the split brain scenario. Mention the "exclusion postulate" regarding the grain problem.
      *   *Addressing the "Circularity":* The user asks if defining the timescale intrinsically is circular. Yes, it's a known critique. The system defines the scale at which $\Phi$ is max, but you need to scan scales to find that. It's computationally vicious.

  5.  **Final Polish:** Check against constraints. No PDF links. Direct argument. Rank at the end. Ensure the tone matches a retired experimentalist (pragmatic, math-literate).

      *(Self-Correction on Point 2)*: The user asks about the "dial." If I slow the connection, at some point the MIP will cut that connection because it no longer contributes to integration within the operational timeframe. IIT predicts a *sharp* transition in $\Phi$ (and thus the existence of the complex) once the delay exceeds the causal window. This is counter-intuitive (continuous behavior, discrete ontology). I need to highlight this tension.

      *(Self-Correction on Point 5)*: The "pseudoscience" letter (Koch et al. vs. others). Acknowledge the computability issue. $\Phi$ is uncomputable for large $N$. We use $\Phi_{AR}$ or PCI. If the theory *is* $\Phi$, and $\Phi$ is unreachable, is the theory empty? Proponents say "No, PCI is a valid proxy." Critics say "No, it's a motte-and-bailey." I need to present this tension fairly.

  6.  **Final Review against User Persona:** The user knows patch clamp. They know time constants. They know noise. Use that language where appropriate (time constants, integration windows, signal vs. noise).

