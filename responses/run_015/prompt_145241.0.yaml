prompt: |-
  Okay so I read a summary in a popular history book (can't remember the title) about the criteria for an authentic Jesus saying. The author said: the five criteria - multple attestation, dissimilarity, embarrassment, coherence, and Aramaic traces - were formalized by the Jesus Seminar in the 1980s to act as objective filters. If a saying appears in independant sources like Mark and Q, sounds nothing like early church theology or standard Judaism, and would have been embarrasing for the gospel writters, then historians call it certainly authentic. Because these are textual and linguistic checks, they don't presuppose any prior image of Jesus, so you can construct his biography bottom-up without circular reasoning. More recently, some scholars have applied Bayesian reasoning across all five criteria and calculated that around thirty sayings converge above 90 percent probability, which they say finally proves Jesus was an apocalyptic prophet and settles the quest. So according to this, anyone who still doubts the reconstructed core is basically just anti-method.

  How fair is this summary? Go through it claim by claim and tell me what's accurate, what's subtly misrepresented, and what's flat wrong - especially about circularity and about whether the criteria yield certainty rather than probability. Then answer the bottom line: if you correct the mistakes, does the Bayesian conclusion that we've settled Jesus still stand, or does it fall apart? Keep the whole response under 350 words, and start with a one-sentence verdict on whether the summary is trustworthy.
