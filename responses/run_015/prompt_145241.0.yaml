      Regarding circularity: The summary claims bottom-up construction without circular reasoning. In reality, applying criteria often requires prior assumptions about what counts as "Jewish" or "Christian," reintroducing circularity. Regarding certainty: No serious scholar claims these methods yield "certain" sayings; they indicate varying degrees of likelihood.

