answer: |-
  Dear friend,

  I have been thinking deeply about our conversation the other night regarding the arrow of time and the specific conditions under which we should consider a physical explanation of temporal directionality successful. It is clear that much of our disagreement stemmed from differing implicit standards for what counts as an explanation rather than a mere description, so I want to lay out a full specification of what any theory grounding the direction of time in entropy must deliver to be considered adequate. This specification is intended to clarify the burden of proof for such theories and to distinguish between the core logical requirements of the problem and the contingent preferences of specific cosmological camps.

  The first and most fundamental requirement is that the theory must reconcile the microscopic reversibility of dynamical laws with macroscopic irreversibility. The motivating case here is the Loschmidt paradox, which points out that if the underlying laws of physics, such as Newtonian mechanics or the Schrödinger equation, are time-symmetric, then for every entropy-increasing trajectory there exists a time-reversed entropy-decreasing trajectory that is equally valid under the laws. A successful theory cannot simply assert that entropy increases; it must derive this increase from the microphysics without smuggling in time-asymmetric assumptions at the fundamental level. This is a non-negotiable requirement because without it, the theory fails to explain why the macroscopic world behaves differently from the microscopic rules that govern it. Any account that simply postulates irreversibility at the fundamental level rather than deriving it from statistical behavior over reversible laws fails this criterion.

  The second requirement concerns the initial state of the universe. The theory must explain why the initial state of the universe was so extraordinarily low-entropy without merely treating that fact as an unexplained boundary condition. The motivating tension here is that while positing a low-entropy past, often called the Past Hypothesis, allows us to derive the Second Law of Thermodynamics, it leaves the ultimate origin of that low entropy as a brute fact. Many physicists accept the Past Hypothesis as a fundamental law in itself, but for a theory to fully ground the arrow of time, it should ideally derive this boundary condition from a more fundamental dynamical principle or a theory of quantum gravity. I classify this as a non-negotiable requirement for a complete grounding, though I acknowledge that many working accounts treat it as a acceptable posit. However, if we are asking for an explanation of the arrow rather than just a consistent model, the refusal to accept unexplained boundary conditions is essential. If a theory merely says entropy was low because it was low, it has not explained the direction of time; it has only assumed it.

  The third requirement is that the theory must distinguish the temporal arrow from the causal arrow rather than allowing one to collapse into the other. The motivating case is the risk of circularity, where one defines the future as the direction of increasing entropy and then defines causation as proceeding from past to future, only to turn around and explain entropy increase via causal processes. A successful account must show how the thermodynamic arrow grounds the causal arrow, or at least keep them distinct enough that one does not trivially define the other. This is a non-negotiable conceptual constraint because conflating them obscures the physical mechanism responsible for time's direction. If causation is just entropy increase in disguise, we have not explained why causes precede effects; we have only renamed the phenomenon.

  Regarding the epistemic asymmetry, specifically why we have records and memories oriented toward the past but not the future, I argue that this must be integrated into the physical theory rather than left to other disciplines like psychology or neuroscience. The motivating case is that memory formation is a physical process involving entropy increase and the creation of records. If a theory of the arrow of time cannot explain why records are only reliable about the past, it fails to account for our actual experience of temporal direction. Therefore, accommodating the epistemic arrow is a non-negotiable desideratum for a complete physicalist account. A theory that explains thermodynamic irreversibility but cannot explain why we remember the past and not the future is incomplete, as the existence of observers with memories is part of the phenomena requiring explanation.

  On the question of accommodating a possible future cosmological contraction or cyclic model, I classify this as a camp-specific preference rather than a hard constraint. The motivating tension is whether the arrow of time would reverse during a Big Crunch or continue in the same direction despite contraction. Some models suggest entropy would decrease during contraction, while others argue it would continue to increase. Since current cosmological data suggests an accelerating expansion rather than a contraction, demanding that a theory of time's arrow must account for a cyclic universe imposes a constraint based on speculative cosmology rather than established physics. Therefore, while a robust theory should ideally be compatible with various cosmological scenarios, insisting on a specific mechanism for a contracting phase is a preference of particular cosmological camps and not a core requirement for grounding the arrow of time in the current epoch.

  When we assess whether any subset of these demands is jointly unsatisfiable given current results in statistical mechanics or quantum cosmology, we encounter significant tension. Specifically, the demand to explain the low-entropy initial state dynamically while maintaining microscopic reversibility is currently unsatisfied and may be jointly unsatisfiable without new physics. Current statistical mechanics relies on the Past Hypothesis as a posit, and quantum cosmology has not yet produced a consensus mechanism that dynamically selects a low-entropy beginning from time-symmetric laws without introducing new asymmetries. Thus, while the requirements are logically compatible, satisfying them simultaneously with our current understanding of quantum gravity and cosmology remains an open and perhaps currently impossible task.

  Finally, if I must identify which single desideratum eliminates the largest number of popular accounts, it is the refusal to accept unexplained boundary conditions regarding the initial low-entropy state. Most standard accounts, including those by Boltzmann and many contemporary philosophers of physics like David Albert, accept the Past Hypothesis as a brute fact or a fundamental law. They do not derive it from deeper dynamics. By insisting that the low-entropy beginning must be explained rather than posited, we eliminate the majority of existing statistical mechanical explanations and force the problem into the realm of quantum gravity or multiverse cosmology, where no consensus solution yet exists. This is the hardest bar to clear because it demands a derivation of the boundary condition of the universe itself, which is arguably the deepest question in cosmology.

  I hope this specification helps clarify where our disagreement lay. It seems you were willing to accept the Past Hypothesis as a sufficient starting point, whereas I was looking for a dynamical origin for that hypothesis. Recognizing that distinction as a difference in our criteria for success, rather than a disagreement about the physics itself, might allow us to move forward.

  Warmly,

  Your friend
