answer: |-
  Here are the requirements for a left–right account suitable for your dataset, followed by the structural tensions and the candidate scores.

  ### The Requirements

  **1. Dimensionality Specification**
  *   **Requirement:** The account must explicitly state whether left–right is a single dimension or a bundle of correlated dimensions, and provide a rule for aggregating them if a single scale is required.
  *   **Motivation:** *Case 1 (Mixed Party).* A party can be economically radical (left) and culturally nationalist (right). A single-dimension account forces a coding error; a two-dimension account requires a weighting rule to produce the single scale you want.
  *   **Status:** **Non-Negotiable.** Without this, Case 1 is uncodable.

  **2. Label Independence**
  *   **Requirement:** The coding rule must not rely on party self-identification or local media labels as primary evidence. It must code based on policy positions and coalition behavior.
  *   **Motivation:** *Case 3 (Post-Soviet Inversion).* Local labels can invert relative to standard policy bundles. If the theory relies on the label "Left," you code the nationalist party as left; if it relies on content, you might code them as right. The theory must privilege one.
  *   **Status:** **Non-Negotiable.** Reliance on labels destroys cross-country validity.

  **3. Temporal Anchoring (Fixed vs. Relational)**
  *   **Requirement:** The account must decide if "Left" is a fixed set of policies (e.g., redistribution) or a relational position (e.g., challenge to status quo). If relational, it must specify the baseline (status quo at time *t*?).
  *   **Motivation:** *Case 4 (Stationary Party).* If the country moves right, a stationary party becomes "left" relationally. If "Left" is fixed substance, the party stays center-left. You cannot have both comparability across time (Fixed) and accurate local context capture (Relational).
  *   **Status:** **Non-Negotiable.** You must choose one to ensure consistency across 1945–now.

  **4. Position/Intensity Separation**
  *   **Requirement:** The account must distinguish *where* a party is on the scale from *how extreme* it is. It must not code intensity as position.
  *   **Motivation:** *The Horseshoe.* Extremes often resemble each other in method (authoritarianism) while remaining opposite in goal. If the theory conflates intensity with position, the horseshoe becomes a measurement error rather than a phenomenon.
  *   **Status:** **Non-Negotiable.** Prevents coding Case 1's hard lines as "extreme position" rather than "intense preference."

  **5. Operational Symmetry (The Undergrad Rule)**
  *   **Requirement:** The criteria for coding Left must be structurally identical to the criteria for coding Right, merely inverted. Coders must not need local cultural knowledge to apply the rules.
  *   **Motivation:** *Methodological Contamination.* If "Left" is defined by complex sociological conditions (e.g., "party of the oppressed") and "Right" by simple policy, coders will drift. "Two undergrads" is not about intelligence; it is about ensuring the codebook contains all necessary information, excluding local expertise.
  *   **Status:** **Non-Negotiable for Dataset.** (Conceptually debatable, but methodologically required for reliability).

  **6. Normative Neutrality (Symmetry of Rationality)**
  *   **Requirement:** The account must not define one side as inherently irrational, deluded, or factually incorrect. Both sides must be codable as pursuing coherent goals.
  *   **Motivation:** *Even-handedness.* If the theory defines Left as "correct calibration of reality," coders will hesitate to code obviously popular Right parties as "Right" because the definition implies they are "wrong." This introduces coder bias.
  *   **Status:** **Camp Preference.** (A theory *could* claim one side is irrational, but it will fail the Operational Symmetry requirement above).

  **7. Breakdown Threshold**
  *   **Requirement:** The account must specify the conditions under which a party is "Uncodable" rather than forcing a fit.
  *   **Motivation:** *Case 2 (Neither Left nor Right).* Some movements genuinely reject the axis. Forcing them onto the scale creates noise. The theory must define the limit of its own applicability (e.g., "If economic and cultural scores diverge by >X, flag as uncodable").
  *   **Status:** **Non-Negotiable.** Prevents garbage data entry.

  ---

  ### The Structural Tensions

  **The Impossible Pair: Cross-National Comparability vs. Contextual Validity**
  You cannot jointly satisfy **Fixed Substantive Content** (required for comparing 1950s Sweden to 1990s Russia) and **Relational Accuracy** (required for Case 3 and Case 4).
  *   If you fix the content (e.g., Left = Redistribution), you miscode Case 3 (Post-Soviet "Left" is austere).
  *   If you make it relational (Left = Reform/Challenge), you lose comparability (Case 4 becomes a moving target, and "Reform" means different things in different regimes).
  *   *Decision:* For a dataset, you must sacrifice Contextual Validity for Comparability. You must code Fixed Content and accept that Case 3 looks anomalous.

  **The Account Killer: Operational Symmetry without Local Knowledge**
  This requirement knocks out the most accounts. Most theoretical accounts of left–right rely on implicit cultural knowledge (e.g., knowing that "nationalism" implies Right in France but might imply Left in a post-colonial context). Requiring that "two undergrads with no local knowledge" agree forces the theory to be purely manifest (manifesto data, voting records) rather than latent (intent, historical role). Any account that requires understanding *why* a policy is proposed (to protect tradition vs. to protect workers) fails this.

  ---

  ### Candidate Scores

  **(1) Equality (Left = reduce inequality)**
  *   **Score:** **Fail.** Handles economics well, but collapses on Case 1 (mixed econ/culture) and Case 3 (Post-Soviet "Left" is austere). Violates Label Independence if local "Left" parties abandon equality.
  *   **Verdict:** Too narrow for a 75-year global dataset.

  **(2) Tradition vs. Emancipation (Left = change, Right = preserve)**
  *   **Score:** **Fail.** This is a Relational definition. It solves Case 4 (Stationary Party) but destroys Cross-National Comparability. It also fails Case 3 where "Left" is conservative.
  *   **Verdict:** Theoretically elegant, methodologically unusable for your purpose.

  **(3) Circle of "Us" (Left = universalism, Right = particularism)**
  *   **Score:** **Partial.** Handles Case 1's immigration stance well. Fails on economics (Case 3's pension defense). Hard to operationalize for Undergrads (requires interpreting rhetoric rather than policy).
  *   **Verdict:** Good for cultural axis, poor for economic axis.

  **(4) Purely Positional (Left = local reformers)**
  *   **Score:** **Fail.** Maximizes Contextual Validity but sacrifices Comparability entirely. You cannot compare "Left" in Country A to "Left" in Country B. Makes the dataset a collection of unique stories rather than variables.
  *   **Verdict:** Reject. Destroys the purpose of a comparative dataset.

  **(5) Two Dimensions (Economic + Cultural)**
  *   **Score:** **Pass (with caveat).** Best fit for Case 1 and Case 3. However, it violates your request for a "left–right scale" unless you impose an aggregation rule (which reintroduces the Impossible Pair tension).
  *   **Verdict:** The only robust conceptual fit, but requires you to accept a 2D codebook or an arbitrary weighting formula to produce the 1D scale you want.
