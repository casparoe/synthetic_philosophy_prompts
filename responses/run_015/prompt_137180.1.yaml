      *   The user wants to avoid harsh blame on the exhausted brother.
      *   The user wants to maintain resilience on the surgery.
      *   *Solution:* The **Stoic Archer Analogy** (Cicero *Fin.* 3.22). The aim is up to us (to shoot well); the hitting the target is not. This distinguishes *trying* (up to us) from *succeeding* (not up to us).
      *   *Precisification:* "Up to us" = The quality of our intention and effort. "Not up to us" = The external realization of that effort.
      *   *Why:* Saves Climate (effort is valuable regardless of outcome), Saves Surgery (worry is about outcome, not effort of care), Nuances Snapping (exhaustion limits capacity for effort, reducing blame).

  10. **Review against Constraints:**
