answer: |-
  This is a classic stalemate in bioethics, and it is fascinating that your neighbors landed on it so precisely. They have essentially recreated the debate between **Ronald Dworkin** (Mara's position) and **Rebecca Dresser** (Leo's position), which has been raging since the 1990s.

  As a biologist, you know that when two models explain the data equally well but predict different outcomes, the issue usually lies in the boundary conditions or the underlying definitions. Mara and Leo are talking past each other because they are prioritizing different *types* of moral goods.

  Here is an analysis of who is "right," where the philosophical fault lines lie, and what they are both missing.

  ### 1. The Case for Mara: Precedent Autonomy and Critical Interests
  Mara is arguing for **Diachronic Autonomy**. Her claim is that a human life is a narrative whole, and dignity consists in the ability to shape that narrative from beginning to end.

  *   **The Philosophy:** This aligns with Ronald Dworkin's distinction between *experiential interests* (what feels good now, like eating) and *critical interests* (what makes a life go well overall, like maintaining dignity or avoiding burdening family). Dworkin argued that critical interests survive incompetence. If you valued independence above life itself, losing independence makes life *worse* for you, even if you don't realize it.
  *   **The Lab Metaphor:** Her "locked protocol" analogy is strong here. In a longitudinal study, you cannot change the inclusion criteria halfway through just because the subjects have changed; otherwise, the data (the life's integrity) is corrupted.
  *   **Where she is right:** If we side with Leo, we effectively say that a person loses the right to govern their life the moment they lose cognitive capacity. This makes a mockery of long-term planning. It implies that the "self" is merely a series of momentary time-slices with no authority over the future.

  ### 2. The Case for Leo: Present Sovereignty and the Epistemic Gap
  Leo is arguing for **Synchronic Beneficence**. His claim is that moral status is grounded in the capacity to suffer or enjoy, and that the "past self" has no right to harm the "present self."

  *   **The Philosophy:** This draws on Derek Parfit's reductionist view of identity (psychological connectedness matters more than numerical identity) and Rebecca Dresser's critique of advance directives. Dresser argued that the competent person is **epistemically cut off** from the incompetent person. You cannot imagine what it is like to be demented; therefore, your directive is based on ignorance.
  *   **The Lab Metaphor:** Leo's "apparatus wants to close the log" is a critique of Mara's protocol. If the equipment is fundamentally rewired (neurodegeneration), running the old protocol isn't just difficult; it's category error. It might damage the apparatus.
  *   **Where he is right:** He highlights the risk of "moral necromancy." If the dementia patient is smiling and enjoying the food, forcing a tube (or withholding it, depending on the directive) based on the fears of a ghost causes tangible harm to a sentient being. It treats the current patient as a means to an end (the past self's dignity) rather than an end in themselves.

  ### 3. Who is Right?
  Neither is objectively "right" because they are weighing incommensurable values.
  *   **Mara prioritizes Integrity:** The coherence of the life story.
  *   **Leo prioritizes Welfare:** The minimization of current suffering/maximization of current pleasure.

  In legal and ethical practice, we usually try to split the difference, but your neighbors have found the exact point where the split fails. However, there is a strong philosophical consensus emerging that **Leo has the stronger claim in cases of severe dementia.** Why? Because for autonomy to matter, there must be a "self" to be autonomous. If the psychological connectedness is severed (as Parfit argues), the "past self" and "present self" are morally distinct enough that the past self's authority diminishes.

  ### 4. What Are They Missing?
  This is where your specific questions about promises vs. instructions and narrative continuity come in. Both Mara and Leo are treating the advance directive as a monolith, but it functions in two different ways that they are conflating.

  #### A. Instruction vs. Proxy (The "Delegation" Problem)
  Mara treats the directive as a **Command** (a locked protocol). Leo treats it as a **Constraint** (a ghost haunting the machine).
  *   **The Missing Piece:** Advance directives are often better understood as **delegations of authority**, not rigid commands. When you sign one, you are appointing a surrogate to make the decision you *would* make if you could.
  *   **The Nuance:** If the situation on the ground (the "lab conditions") has changed so radically that the original instructions clearly cause harm the author didn't anticipate (the epistemic gap), the surrogate (or doctor) has a moral duty to interpret the *spirit* of the directive, not just the letter.
  *   **Application:** If the directive says "No feeding tube," but the patient is happily eating by hand, the directive is moot. If the directive says "No feeding tube" and the patient is starving and distressed, the directive holds. If the patient is starving but *content* (as in Leo's smiling woman case), the directive is in conflict with current welfare. In this gap, the directive should shift from a **Command** to a **Bequest** (as Mara suggested), meaning it is strong evidence of preference, but rebuttable by evidence of current well-being.

  #### B. The Threshold of Narrative Continuity
  Mara introduces a "biographical continuity threshold," which is sophisticated, but Leo dismisses it.
  *   **The Missing Piece:** We need to distinguish between **Numerical Identity** (same human organism) and **Narrative Identity** (same story-teller).
  *   **The Biology:** In late-stage dementia, the neural substrate required to sustain the "narrative self" is often physically degraded. The "PI" (Principal Investigator/Pre-dementia self) is not just absent; the office is demolished.
  *   **The Ethical Implication:** If the narrative self is gone, "critical interests" (Dworkin's concept) may no longer exist. You cannot violate the dignity of a self that no longer exists. At that point, the patient becomes a "ward of the state" morally, and the standard shifts from *Autonomy* to *Best Interest*.
  *   **Correction to Mara:** Her "locked protocol" fails because the PI is gone. You don't follow the PI's notes if the PI has resigned and the lab has been repurposed.
  *   **Correction to Leo:** He cannot treat the patient as a *totally* new person legally or biologically, but he is right that morally, the "new person" has rights the "old person" cannot violate.

  #### C. The "Ulysses Contract" Flaw
  Both are arguing as if this is a standard contract. It is actually a **Ulysses Contract** (binding yourself to the mast to resist future temptation).
  *   **The Problem:** Ulysses contracts work when the future self is *irrational* but still *you* (e.g., an addict begging for drugs). In dementia, the future self is not necessarily irrational; they are *different*.
  *   **The Missing Insight:** The directive was made under the assumption that the future state would be one of *suffering* (the common fear of dementia). If the future state is actually one of *contentment* (the smiling Alzheimer's patient), the condition for the contract has been violated. The contract was: "If I am suffering and degraded, do not keep me alive." It was not: "If I am happy and eating, do not feed me." Leo is right that the directive was made in ignorance, but Mara is right that we must respect the *fear* that motivated it. The compromise is to ask: **Is the current state one the past self would recognize as a violation?**

  ### Summary Verdict for Your Study Group

  If you want to untie the knot for them, suggest this synthesis:

  1.  **Mara is right about the General Rule:** We must respect precedent autonomy to preserve the integrity of a life plan. Without this, we lose the ability to plan for our end.
  2.  **Leo is right about the Exception:** When the "psychological connectedness" drops below a critical threshold (severe dementia) AND the current state involves contentment (no evidence of suffering), **Beneficence trumps Autonomy.**
  3.  **The Missing Mechanism:** The advance directive is not a rigid script; it is a **trust**. The "trustees" (doctors/surrogates) must manage the assets (the body/life) for the benefit of the current beneficiary (the dementia patient), guided by the wishes of the grantor (the past self), *unless* those wishes clearly harm the beneficiary in ways the grantor could not have foreseen.

  **In your lab metaphor:** The PI (past self) left a protocol. But if the equipment (brain) has been fundamentally rewired such that following the protocol causes the machine to overheat (suffering) or prevents it from functioning in its current stable state (contentment), the Lab Manager (surrogate/doctor) has the authority to amend the protocol to preserve the machine, provided they document why the original PI's assumptions no longer hold.

  Mara protects the **Author**; Leo protects the **Character**. In late dementia, the Author has died, but the Character is still reading the book. We owe our duty to the reader.
