answer: |-
  This is a sharp tension to pull at. Lewis's *Convention* is often read as a naturalistic, evolutionary account of how norms emerge from the bottom up through repeated interaction. Dagen H looks like a top-down smash-and-grab. But if you look closely at Lewis's technical definitions, Dagen H doesn't necessarily break the theory; instead, it stress-tests the boundaries of what counts as "salience" and "common knowledge."

  Here is the mapping of Dagen H through Lewis's lens, followed by an analysis of where the theory holds and where it goes silent.

  ### 1. The Lewisian Mapping

  To see if Dagen H fits, we have to strip it down to the game-theoretic components Lewis requires.

  **The Players ($P$):**
  The primary agents are individual drivers. Pedestrians are secondary players coordinating with drivers. The State is *not* a player in the coordination game in the same sense; it acts as an external mechanism for generating signals.

  **The Situation ($S$):**
  The situation is "operating a vehicle on a public road."
  *   *Pre-1967:* The equilibrium was Left-Hand Traffic (LHT).
  *   *Post-1967:* The equilibrium was Right-Hand Traffic (RHT).

  **The Coordination Problem:**
  This is a pure coordination game (like meeting at a train station). I prefer to drive on the right *if and only if* you drive on the right. I prefer to drive on the left *if and only if* you drive on the left. My primary interest is avoiding a head-on collision; the specific side is secondary.
  Before the switch, Sweden was in a stable equilibrium (LHT). The problem wasn't "how to coordinate," but "how to switch equilibria without crashing during the transition."

  **The Solution ($R$):**
  The regularity $R$ is "driving on the right."
  For this to be a Lewisian convention, it must meet his five conditions immediately after the switch:
  1.  **Conformity:** Everyone drives right.
  2.  **Expectation:** Everyone expects everyone else to drive right.
  3.  **Conditional Preference:** Everyone prefers to drive right *given* that others do.
  4.  **Arbitrariness:** There was an alternative ($R'$ = driving left) that would have worked just as well *technically*, even if RHT had better geopolitical payoffs.
  5.  **Common Knowledge:** Everyone knows 1–4, everyone knows that everyone knows, etc.

  ### 2. What the Theory Explains Well

  **The Stability of the New Equilibrium**
  Lewis's theory shines in explaining why Dagen H *stuck*. Once 5:00 AM passed on September 3, 1967, the mechanism of **precedent** kicked in immediately. On Day 1, people drove right because the State told them to. On Day 2, they drove right because they saw everyone do it on Day 1. By Day 30, the State's voice was irrelevant; the convention was self-policing. Lewis predicts exactly this: once a regularity is established, it generates its own reason for continuation. The fact that Sweden still drives on the right today is a textbook example of precedent locking in a convention.

  **The Role of Common Knowledge**
  Lewis emphasizes that coordination fails without common knowledge. If I think you'll drive left, I drive left. If you think I'll drive right, you drive right—we crash. The Swedish government's massive media blitz ("Håll till höger") wasn't just propaganda; it was a **common knowledge generator**. By broadcasting the switch simultaneously to the entire population, the State ensured that I knew you knew the rule, and I knew that you knew that I knew. Lewis's framework explains why the media campaign was necessary: without it, the switch would have been a coordination failure resulting in mass accidents.

  **Arbitrariness**
  Lewis insists conventions are arbitrary. Critics might say RHT wasn't arbitrary for Sweden because their neighbors drove on the right and their cars were left-hand drive. However, in the strict Lewisian sense, it *was* arbitrary. Sweden could have forced Norway and Finland to switch to the left, or forced car manufacturers to build right-hand drive cars. The physical reality of the road allows for either. The choice was contingent on external payoffs, but the convention itself (the rule of the road) remains arbitrary relative to the physics of driving. Lewis accommodates this: a convention can be arbitrary even if one option has slightly higher utility, provided the *coordination* is the primary driver of the choice.

  ### 3. Where the Theory Struggles or Goes Silent

  **Transition Costs and Friction**
  This is the biggest silence in Lewis's account. Lewis treats conventions as equilibria in a game, largely ignoring the *cost of moving* between them. His theory is synchronic (describing the state of affairs) rather than diachronic (describing the historical process).
  Dagen H involved massive friction: replacing millions of road signs, modifying bus doors, retraining drivers, and the psychological terror of the switch day itself. Lewis's framework assumes rational agents update their expectations instantly. It has no variable for "fear of transition" or "logistical lag."
  In Lewis's world, if the State announces a new focal point, the convention shifts. In reality, there was a "hump" of chaos where the old convention was dead but the new one wasn't fully trusted. Lewis doesn't account for the energy required to overcome the inertia of the old precedent. He explains why the new norm holds, but not why breaking the old one was so expensive.

  **Engineered Salience vs. Natural Salience**
  Lewis relies heavily on Schelling's idea of **salience**—focal points that stand out naturally (e.g., "meet at noon" because noon is a natural break). Dagen H suggests salience can be *manufactured*.
  Does this break Lewis? Not technically. Lewis defines salience as whatever distinguishes one equilibrium from another. A government mandate is a very strong distinguishing feature. However, it challenges the "naturalistic vibe" of his theory. Lewis often writes as if conventions emerge from the interactions of agents seeking mutual benefit. Dagen H shows that a third party (the State) can impose a focal point even if the agents themselves wouldn't have selected it organically.
  The nuance here is crucial: The State didn't change the *payoffs* of the game (it's still a coordination problem, not a Prisoner's Dilemma). They changed the *signal*. Lewis allows for this, but it stretches his evolutionary narrative. It suggests conventions aren't just discovered; they can be designed.

  **Authority and Enforcement**
  There is a risk of conflating Lewisian convention with law. If everyone drove on the right solely because they feared a fine, it wouldn't be a Lewisian convention; it would be coercion. Lewis is clear that conventions are self-enforcing through mutual expectation.
  Dagen H is a test case here. There were fines for non-compliance, but they were unenforceable at scale. The switch worked because drivers trusted *each other*, not the police. Lewis's theory correctly identifies that the law only worked *because* it successfully coordinated expectations. If the law had failed to create common knowledge (e.g., if half the country missed the broadcast), the fines wouldn't have mattered; the convention would have collapsed into chaos. Lewis explains why the law succeeded (it solved the coordination problem) rather than failing (trying to solve a Prisoner's Dilemma).

  ### 4. Verdict: Anomaly or Special Case?

  Dagen H is not an anomaly for Lewis, but it exposes a limitation in how his theory is often *applied*.

  **It is not an anomaly** because the resulting state (driving on the right) fits all five of Lewis's criteria perfectly. The State acted as a massive Schelling point generator. In a complex coordination problem with high stakes, natural salience (like "drive on the side your steering wheel is on") was conflicting with geopolitical salience ("drive on the side your neighbors do"). The State cut the knot by creating a new, overwhelming focal point. Lewis's theory allows for any signal that creates common knowledge to serve as the basis for convention.

  **However, it reveals a silence regarding "Equilibrium Selection."** Lewis explains why we stay in an equilibrium once we are there (precedent). He is less robust on how a population jumps from one equilibrium to another when the old one is still stable.
  In a naturalistic Lewisian story, a convention shifts because the old one stops serving mutual interest (e.g., too many accidents). In Sweden, the old convention (LHT) was still working fine for coordination; it was just suboptimal for trade and car imports. The switch was a collective action problem solved by authority.
  Lewis's framework implies that if the mutual interest is strong enough, the convention will shift. Dagen H shows that sometimes the mutual interest (trade efficiency) isn't enough to overcome the precedent (safety of the known norm) without an external shock.

  **On Engineered Norms:**
  Does this undermine the idea that norms serve mutual interest? No. The mutual interest (safety + trade) existed before the switch. The *barrier* was the coordination risk. The State didn't create the interest; they lowered the transaction cost of coordinating on the new interest.
  So, authority-based salience is a **special case of Schelling points**, not a break from them. It's just that the "focal point" wasn't a natural feature of the landscape (like a clock tower) but a social feature (a law).

  **The Honest Silence:**
  Where Lewis truly comes up short is on the **human cost of the transition**. His theory is bloodless. It treats the switch as a change in belief states. Dagen H was a physical, dangerous, expensive logistical nightmare. Lewis tells us why the convention is stable *after* the dust settles. He doesn't tell us why some societies can absorb the cost of switching conventions while others remain stuck in suboptimal equilibria (like QWERTY, or in this case, why Sweden waited so long to switch despite the costs of LHT).
  Lewis explains the *logic* of the convention, but Dagen H highlights the *politics* of the transition. The theory assumes common knowledge is easy to establish. Dagen H proves that establishing common knowledge on a national scale requires immense resources.

  **Summary:**
  Lewis survives Dagen H, but he comes out looking more like a theorist of *equilibrium maintenance* than *equilibrium evolution*. The case proves that conventions can be engineered, provided the engineering successfully targets common knowledge rather than just coercion. But it also highlights that Lewis's framework has no vocabulary for the friction, fear, and cost of breaking a precedent, treating the shift as a rational update rather than a societal trauma.
