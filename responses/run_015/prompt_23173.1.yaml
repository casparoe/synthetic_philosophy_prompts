          *   **Verdict:** **Crucial Nuance Check.** This is the most contentious point in Descartes scholarship. Does Descartes deny animals *sensation* (feeling pain) or just *conscious thought* about pain?
              *   *Standard View:* Animals feel pain physically (mechanical reaction) but do not have the *conscious awareness* or *qualitative experience* (qualia) of pain because that requires a mind (*res cogitans*).
