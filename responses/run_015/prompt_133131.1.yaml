answer: |-
  **PHD COMP EXAM – ETHICS & SOCIAL CHANGE**
  **Time Allowed: 90 Minutes**
  **Instructions: Answer ONE question. No citations or bibliographies required. Focus on argumentative clarity.**

  **Question 1**
  Kwame Anthony Appiah and Bernard Williams suggest that moral revolutions (e.g., the end of slavery or dueling) are driven less by rational argument than by shifts in honor codes. However, consider the concept of **"Shadow Honor."** This theory posits that the prestige structure of dueling did not vanish but migrated into modern corporate risk-taking culture, where high-stakes financial gambles serve as status markers similar to pistol shots at dawn.

  Evaluate the claim that the moral revolution against dueling was incomplete. Did the norm truly die, or did it merely change costume via Shadow Honor? Use Appiah's framework to argue whether this migration undermines the idea of moral progress.

  ***

  **MODEL ANSWER (KEY)**

  Appiah argues that moral revolutions happen when honor codes shift, making previous practices shameful rather than just wrong. Williams adds that ethical life is rooted in social identity, not just abstract reason. In the case of dueling, the practice ended not because people realized it was illogical, but because it became incompatible with being a "gentleman." The question is whether this was a genuine moral extinction or a metamorphosis.

  If we apply the Shadow Honor thesis, the structure of dueling remains intact. Dueling required three things: a high-stakes risk to life, a witness community that conferred prestige, and a code where avoiding risk was shameful. Modern corporate risk-taking, particularly in high-frequency trading or leveraged buyouts, mirrors this. The "risk" is financial ruin rather than death, but the social mechanics are identical. CEOs and traders engage in volatile maneuvers to signal courage and competence. If they succeed, they gain immense prestige (bonus structures, board seats); if they fail, they are ruined, yet often still respected for "having the guts to try."

  A student arguing for genuine moral progress would claim that the *object* of the risk matters. Dueling involved literal death for no social utility. Corporate risk, while dangerous, ostensibly drives market efficiency. Therefore, the honor code was refined, not just moved. However, this misses the Shadow Honor point. The *motivation* remains honor-based, not utility-based. Traders often take risks that threaten the firm's stability purely for status signaling.

  To score highly, one must argue that if the underlying psychology of honor remains unchanged, the revolution is superficial. Appiah suggests honor codes can be harnessed for good (e.g., turning honor against slavery). But Shadow Honor suggests honor is parasitic. It finds a new host. The "gentleman" is now the "rainmaker." The shame of backing down from a duel is now the shame of missing a quarterly target or showing "weakness" in a negotiation.

  Therefore, the norm didn't die; it changed costume. The moral revolution was incomplete because the community still rewards reckless bravery under the guise of economic rationality. The shift from blood to capital is cosmetic. True moral progress would require dismantling the prestige structure itself, not just redirecting it. If honor still demands risk-taking to validate status, we are still dueling, just with spreadsheets instead of pistols. The student must conclude that without addressing the Shadow Honor mechanism, claims of moral progress are premature. We haven't escaped the honor code; we've just monetized it.

  ***

  **MARKING SCHEME (Total 25)**

  **A Range (20-25 pts)**
  *   **The Move:** Explicitly treats Shadow Honor as a structural continuation, not just a metaphor.
  *   **The Move:** Connects Appiah's "shame" mechanism to corporate status markers (bonuses/reputation).
  *   **The Move:** Argues that "costume change" undermines the definition of moral revolution.
  *   **Must Hit:** Must distinguish between *risk for utility* vs. *risk for honor*.
  *   **Mistake that costs:** Failing to define why corporate risk counts as "honor" rather than just greed.

  **B Range (15-19 pts)**
  *   **The Move:** Summarizes Appiah/Williams accurately on dueling/slavery.
  *   **The Move:** Attempts to apply Shadow Honor but treats it as a side note.
  *   **The Mistake:** Argues corporate risk is fundamentally different because "no one dies." (Misses the structural point).
  *   **The Mistake:** Relies on rational argument vs. honor, ignoring the prompt's constraint to use honor frameworks.
  *   **Note:** Good essays often get stuck here becuase they play it safe. Push them to commit to the Shadow Honor thesis.

  **C Range (10-14 pts)**
  *   **The Mistake:** Ignores Shadow Honor entirely. Just writes about dueling.
  *   **The Mistake:** Uses citations (prompt said no).
  *   **The Mistake:** Confuses Williams and Appiah's core distinctions.

  **Fail (0-9)**
  *   Incoherent or fails to address the prompt.

