answer: |-
  This is a sharp observation. You have identified what political theorists and sociologists of memory often call the **"dual legitimacy problem"** of the modern liberal nation-state.

  To answer your core question: No, this is not merely practical hypocrisy, nor is it a coherent, consistent philosophy. It is a **managed contradiction**. The institutional pairing you describe presupposes a theory of national identity that is **ontologically functionalist but aesthetically primordialist.**

  Here is the breakdown of the implicit philosophy at work in this bureaucratic double-bookkeeping, how it handles time, and who it excludes.

  ### 1. The Ontology: "Functionalist Realism"
  You asked if the state treats the nation as having "real historical persistence" or as a "functionalist tool." The answer is that the bureaucracy treats the *past* as real (ontologically fixed) and the *present* as functional (ontologically flexible).

  *   **The Museum (The Anchor):** The national museum operates on a **Primordialist** ontology. It presupposes that the nation is a trans-historical subject—that "France" or "Japan" or "Mexico" existed as a coherent entity in 1200 CE, even if the political structures were different. This is necessary for *state legitimacy*. It tells the citizen: "You belong to something eternal. Your sacrifice for this state is rational because the state is a natural extension of your ancestry."
  *   **The Grants (The Valve):** The multicultural grant program operates on a **Civic/Voluntarist** ontology. It presupposes the nation is a political contract available to anyone who enters the legal container. This is necessary for *state stability* in a globalized world. It tells the citizen: "You belong because you are here and you participate. You don't need the bloodline."

  **The Implicit Philosophy:** The state implicitly argues that **identity is stratified.** There is a "Deep Culture" (museum) which provides the *texture* of national life, and a "Civic Culture" (grants) which provides the *access*. The philosophy is that you can layer a civic identity on top of an ethnic/historical substrate without the two reacting chemically.

  ### 2. The Theory of Time: "Retroactive Continuity" vs. "The Eternal Present"
  The tension you see is largely a tension of *time*. The bureaucracy manages two conflicting temporalities to keep the nation stable.

  *   **Museum Time (Linear/Teleological):** This treats history as a story leading inevitably to the current state. It uses what narratologists call **retroactive continuity (retcon)**. It assumes medieval peasants were "proto-citizens." This creates a sense of destiny.
  *   **Grant Time (Synchronic/Flat):** This treats all cultures as existing in the same "now." A tradition that arrived in 1980 is funded to be displayed *alongside* a tradition from 1080. In the logic of the grant, they are equal "contributions" to the current mosaic.

  **The Contradiction:** If the museum is true (the nation is a deep, continuous lineage), then the grant logic is false (recent arrivals cannot be "equally" part of the deep story in the same way). If the grant logic is true (the nation is a hybrid container), then the museum is lying (there is no continuous lineage, only a series of accidents and conquests).

  **The Bureaucratic Solution:** The state separates these temporalities spatially. You go to the museum to feel *depth*; you go to the community center to feel *inclusion*. As long as they don't occupy the same room at the same time, the contradiction doesn't collapse.

  ### 3. The Exclusion Mechanism: Who Falls Between the Cracks?
  You asked whose exclusion counts. This dual system creates a specific hierarchy of belonging based on **temporal proximity.**

  1.  **The "Host" Population:** They are validated by the Museum but often feel threatened by the Grants. They are told they are the "true" owners of the deep timeline, but the grants imply their culture is just one tile in a mosaic, not the floor itself.
  2.  **The "New" Immigrants:** They are validated by the Grants but excluded from the Museum. They are told they are "part of the nation," but the museum narrative implicitly marks them as guests. They belong to the *state*, but not the *story*.
  3.  **The "Un-timely" Populations (The Real Victims):** This is the most critical group. These are populations that **do not fit the linear timeline but are not "new" enough for multiculturalism.**
      *   *Indigenous Peoples:* Often erased by the "Medieval Kingdom" narrative of the museum (which frames the nation as starting with the colonizer's arrival or the founding dynasty) but treated as just another "culture" by the grant system.
      *   *Colonial Subjects/Descendants:* Groups that arrived 150 years ago (e.g., Caribbean migrants in the UK, North Africans in France). They are too recent for the "Deep Timeline" of the museum, but too old to be celebrated as "fresh diversity" in the grant system. They are stuck in a **temporal limbo**—historically integral to the empire that built the nation, but narratively excluded from the nation's "ancient roots."

  ### 4. Is it Consistent or a Pragmatic Mess?
  It is a **pragmatic mess that functions as a stable system.**

  If you press it philosophically, it collapses. You cannot logically hold that the nation is an ancient ethnic organism *and* a modern voluntary association simultaneously.
  *   If the nation is ancient, immigration is a biological/cultural alteration.
  *   If the nation is voluntary, the "ancient roots" are irrelevant folklore.

  **However,** the state does not require logical consistency; it requires **affective coherence.**
  *   The Museum produces **Awe** (vertical legitimacy).
  *   The Grants produce **Consent** (horizontal legitimacy).

  The implicit philosophy is **Performative Statism.** The state is not describing a pre-existing nation; it is *stitching* one together by alternating between these two modes. When nationalism is too weak, they fund the museum. When social cohesion is too fractious, they fund the grants.

  ### Summary: The "Curatorial State"
  The theory of identity presupposed here is that **National Identity is a Curatorial Project.**

  The state acts as a Curator who believes:
  1.  **Artifacts need Provenance:** (We need the Museum to show where we came from).
  2.  **Exhibitions need Relevance:** (We need the Grants to show who is here now).

  The contradiction is only fatal if you believe "Nation" refers to a single, unified metaphysical entity. If you view "Nation" as a **governance technology**, the contradiction is a feature, not a bug. It allows the state to demand loyalty based on history (from the core) while demanding tolerance based on law (from the periphery).

  **The Verdict:** It is not a coherent philosophy. It is a **dialectical governance strategy.** It works until the "Deep Timeline" becomes weaponized to invalidate the "Multicultural Container" (i.e., ethno-nationalism rises), or the "Multicultural Container" becomes so dominant that the "Deep Timeline" is viewed as oppressive fiction (i.e., post-nationalism rises). The tension you see is the fault line where the next culture war will happen.
