answer: |-
  This is a high-stakes application of signaling theory. In most contexts, a bad signal leads to a bad hire or a lost bet; in your context, it leads to renal failure. That raises the threshold for what counts as a "defensible" mechanism.

  The phrase "talk is cheap" is doing a lot of heavy lifting in your thread, conflating three distinct concepts: **Cheap Talk** (game theory), **Signaling** (economics/biology), and **Handicaps** (evolutionary biology). The proposer is arguing from the Handicap principle, but the problem you face (honest error vs. strategic lying) might make that the wrong tool.

  Here is the menu of precise readings of "talk is cheap," evaluated for theoretical standing and mapped to your four rules.

  ### 1. The Literal/Trivial Reading
  *   **Assertion:** Uttering a sentence requires negligible energy/time compared to the action it describes.
  *   **Verdict:** **Platitude.** True, but theoretically inert.
  *   **Theory:** None required.
  *   **Rule Support:** **None.** This justifies *some* friction, but not a specific mechanism. It explains why people spam IDs, but not how to stop it.

  ### 2. The "Cheap Talk" Equilibrium Reading
  *   **Assertion:** In a game where interests conflict (e.g., a troll wants attention, users want safety), costless messages cannot convey private information in equilibrium. If lying costs nothing, everyone lies, so the message conveys zero information.
  *   **Verdict:** **Settled/Defensible.** This is the Crawford & Sobel (1982) model. It is mathematically robust.
  *   **Theory:** Cheap Talk Game Theory.
  *   **Rule Support:** **Argues against "No Rule."** It demands *some* friction to break the "pooling equilibrium" where experts and trolls sound the same. It does **not** specify *which* friction (Burn, Bet, or Receipts all add cost/verification). It merely proves that a system with zero friction is informationally useless.

  ### 3. The "Differential Cost" Reading (Screening)
  *   **Assertion:** Reliability requires a cost that is *lower for the truthful/competent type* than for the lying/incompetent type. The absolute cost matters less than the *ratio*.
  *   **Verdict:** **Settled/Defensible.** This is the core of Spence's Job Market Signaling model.
  *   **Theory:** Signaling Economics (Spence, 1973).
  *   **Rule Support:** **Supports (c) Bet and (b) Track Record.**
      *   **Bet:** If I am right, the cost is zero (money returned). If I am wrong, the cost is high (money lost). This is perfectly differential.
      *   **Track Record:** Building a record is easy for consistent experts, hard for guessers.
      *   **Undermines (Burn):** A burn fee costs the *same* whether you are right or wrong. It does not differentially burden the "wrong" type unless the "wrong" type is also "less wealthy" or "less confident." If a confident idiot has money, they pass the screen.

  ### 4. The "Handicap" Reading (Wasteful Cost)
  *   **Assertion:** Reliability requires *wasteful* cost specifically (money burned, not transferred). The waste proves the signal is honest because a liar would not incur the waste.
  *   **Verdict:** **Contested/Model-Dependent.**
  *   **Theory:** Zahavi's Handicap Principle (1975).
  *   **Nuance:** In biology, this is debated. Some models show waste is necessary to prevent cheating; others show "indexical" signals (see #5) work without waste. In economics, waste is usually seen as inefficient; we prefer transfers (bets).
  *   **Rule Support:** **Supports (The Proposal/Burn).** This is the only reading that justifies burning money to a disliked cause. It asserts that the *pain* of the loss is the signal, not the outcome of the ID.
  *   **Risk:** In your context, this screens for **confidence**, not **accuracy**. In mycology, confidence and accuracy are often negatively correlated (Dunning-Kruger). A burn rule selects for rich, confident people, not necessarily correct ones.

  ### 5. The "Indexical" Reading (Mechanical Tie)
  *   **Assertion:** Some signals are trustworthy not because they cost anything, but because they are mechanically tied to the reality they describe. You cannot fake the physics.
  *   **Verdict:** **Settled/Defensible.**
  *   **Theory:** Indexical Signaling / Hard Evidence.
  *   **Rule Support:** **Supports (a) Receipts.** A spore print photo is an indexical signal. It is hard to fake (requires physical presence) and directly verifies the claim. It bypasses the "cost" argument entirely by removing the information asymmetry.
  *   **Note:** This is often superior to signaling because it doesn't require waste.

  ### 6. The "Virtue Signaling" Reading (The Dismissal)
  *   **Assertion:** "That's just signaling" means the action is performative and divorced from the underlying quality it claims to represent.
  *   **Verdict:** **False/Category Error.**
  *   **Theory:** Colloquial sociology vs. Game Theory.
  *   **Rule Support:** **Used to dismiss all rules.**
  *   **Analysis:** In game theory, a signal *must* be correlated with the quality to be an equilibrium signal. If it's "just signaling" in the pejorative sense, it's a "cheap talk" equilibrium masquerading as a signal. However, pointing out something is a signal does *not* prove it is empty. A peacock's tail is a signal, but it is not "empty"—it is a honest indicator of genetic fitness. Using "signaling" as an insult confuses the *mechanism* (signaling) with the *validity* (honest vs. dishonest).

  ---

  ### Deep Dive: Burn vs. Bet (The Economic Distinction)

  You suspected these do different things. You are correct.

  *   **The Burn (Handicap):** This is a **Sunk Cost Screen**. It asks: "How much pain are you willing to endure to say this?"
      *   *What it selects:* Confidence and Wealth.
      *   *Failure Mode:* The "Confident Idiot." If someone is 99% sure they are right, but they are wrong, they will happily burn the money. They have signaled high confidence, but delivered false information. In mushroom foraging, **confidence is not safety.**
  *   **The Bet (Contract):** This is an **Incentive Compatibility Constraint**. It asks: "Are you willing to stake value on the *outcome*?"
      *   *What it selects:* Accuracy (assuming mods are perfect).
      *   *Failure Mode:* Enforcement risk. If mods disagree, or if the mushroom decays before verification, the bet cannot be settled. Also, it requires a escrow system.

  **Verdict on the Proposal:** The "Burn" rule is theoretically weak for *epistemic* claims (claims about truth). It works well for *commitment* claims (e.g., "I will show up to this event"). For mushroom ID, you want accuracy, not commitment. A burn rule punishes honest mistakes (the biggest danger in foraging) just as harshly as lies.

  ### Deep Dive: "That's Just Signaling"

  When a member dismissed a careful post as "showing off" (signaling), they were using Reading #6.
  *   **Does the theory license this?** No. Identifying a behavior as a signal does not invalidate the information it carries.
  *   **Why do they say it?** They are likely accusing the poster of **Costly Signaling without Quality**. i.e., "You are incurring cost (writing a long post) to look good, but the cost isn't differentially higher for experts than for pretenders."
  *   **Precision:** If the long post contains verifiable data (Reading #5), it is not "just signaling." If it contains only rhetoric and jargon, it may be a "bad signal" (one that can be faked).

  ### Diagnosis: What were they reaching for?

  Your loudest member is reaching for **Reading #4 (The Handicap)**, but they are applying it to the wrong variable.

  They assume the problem is **Lying** (strategic misinformation). Handicaps solve lying.
  The actual problem in foraging Discord is **Error** (honest incompetence).
  *   Handicaps do not solve error. A confident expert and a confident novice will both pay the burn fee.
  *   **Reading #3 (Differential Cost)** via the **Bet** rule is closer, because it ties cost to the *truth value* of the ID, not the *confidence* of the IDer.
  *   **Reading #5 (Indexical)** via the **Receipts** rule is the strongest. It removes the need for trust entirely.

  ### Uncertainty & Caveats

  I must flag where the theory is not definitive:
  1.  **Superlinear Scaling:** The proposal suggests 99% costs *much* more than 80%. There is no settled theory on the optimal curvature of signaling costs. This is heuristic.
  2.  **Waste Necessity:** Economists generally agree waste is *inefficient*. If a Bet (transfer) works, a Burn (waste) is socially suboptimal. The only reason to prefer Burn is if you cannot enforce the Bet (e.g., mods can't verify the mushroom later).
  3.  **The "Disliked Cause" Nuance:** Donating to a disliked cause adds a psychological cost layer. This is behaviorally potent but theoretically identical to a fine. It doesn't solve the "Confident Idiot" problem.

  ### Recommendation

  If you need to cite theory to settle the rule:
  1.  **Reject the Burn.** It selects for confidence/wealth, not accuracy. It punishes honest mistakes, which discourages experts from posting (they know the risk of subtle ID errors).
  2.  **Prioritize Receipts (Indexical).** This is the only method that verifies the *mushroom*, not the *person*.
  3.  **Use Track Record (Reputation).** This is a repeated-game signal. It is robust, non-wasteful, and differentially costly (hard to fake over time).

  The phrase "talk is cheap" is true (Reading #2), but the inference "therefore we must burn money" (Reading #4) is a non-sequitur in an environment dominated by honest error rather than strategic deceit.
