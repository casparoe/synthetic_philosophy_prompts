prompt: |-
  Hey — I help moderate a foraging / mushroom-ID Discord (yes, the kind where a wrong ID can put someone in hospital). We've been going round for weeks about a rule for our "certain ID" posts, and the whole argument runs on the line "talk is cheap," which I've now heard so many times that I've lost any grip on what anyone means by it.

  The proposal on the table, from our loudest member: if you want to post an ID at "certain" or "near-certain," you burn a donation to a cause our group actively dislikes, scaled superlinearly to how confident you say you are (so "99%" costs a lot more than "80%"). His reasoning as I understand it: words cost nothing, so anyone can claim certainty, so the only way to make a certainty-claim mean something is to attach a real, non-refundable cost to it — and the waste is the point, because if you could get the money back, or bet it and hedge, it wouldn't be a handicap anymore.

  Three competing rules are floating around: (a) a "receipts" rule — no payment at all, you just have to attach a photo of the spore print and gill attachment so others can check; (b) a track-record rule — a bot displays your historical ID accuracy next to your name, which nobody can edit; (c) a bet rule — you post a stake you get back if two moderators later confirm the ID and lose if they refute it. Someone answered (c) with "put your money where your mouth is," and I can't tell whether that's the same principle as the burn or a different one wearing the same clothes.

  What I want is the menu of precise things "talk is cheap" could be asserting here, from the trivial ("uttering a sentence has low marginal cost, so people sometimes say things they don't believe") on up: that costless messages carry no information when interests conflict; that reliability requires differentially higher cost for the bad type rather than cost simpliciter; that reliability requires *wasteful* cost specifically; that attaching any cost is enough to make a message trustworthy; that some signals are trustworthy because they're mechanically tied to the fact instead of because they cost anything. For each reading: platitude, defensible and substantive, or false? And which reading would actually get our member his rule — I have a feeling a fee everyone can pay just selects for rich or very confident people rather than accurate ones, and that burning money and betting money do different things (one screens, one incentivizes?), but I can't make it precise. Same question for the "that's just signalling" move someone used to dismiss a long careful post as showing off: does anything in this story license that, or does showing that something is a signal not show it's empty?

  Lay it out as a numbered list of readings, each with a verdict and a note on which of the four rules it actually supports. Also please seperate what's settled textbook signalling theory (peacocks, stotting, the job-market model, handicap stuff) from what's genuinely contested or model-dependent — say where you're unsure instead of smoothing it over, and don't hand me a contested reading as if it were the definitve consensus. And tell me which reading you think people in that thread were actually reaching for.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Moderator of a high-stakes foraging/mushroom ID Discord.
      *   **Problem:** A debate over how to regulate "certain ID" posts to prevent dangerous misinformation.
      *   **Core Phrase:** "Talk is cheap." This phrase is being used repeatedly but ambiguously.
      *   **Proposed Rule (The "Burn"):** To claim high certainty, one must donate money to a disliked cause, scaled superlinearly. The waste is the point (non-refundable).
      *   **Competing Rules:**
          *   (a) Receipts (Evidence): Photo of spore print/gills.
          *   (b) Track Record (Reputation): Bot displays historical accuracy.
          *   (c) Bet (Stake): Money returned if correct, lost if wrong.
      *   **Goal:** A menu of precise interpretations of "talk is cheap" rooted in signaling theory/economics, evaluated for truth/defensibility, mapped to the specific rules, and distinguishing settled theory from contested areas.
      *   **Tone:** Analytical, precise, nuanced, avoiding false consensus, acknowledging uncertainty.

  2.  **Deconstruct "Talk is Cheap":**
      *   *Literal meaning:* Speaking costs little energy/time.
      *   *Game Theoretic meaning:* Cheap talk (costless, non-binding communication) cannot convey information in games of conflicting interest (Crawford & Sobel).
      *   *Signaling meaning:* To be credible, a signal must be costly (Zahavi's Handicap Principle).
      *   *Specific nuance:* Is *any* cost enough? Does it need to be *wasteful*? Does it need to be *differential*?

  3.  **Drafting the Readings (Iterative Process):**

      *   *Reading 1: The Trivial/Literal.* Uttering words has low marginal cost.
          *   Verdict: True/Platitude.
          *   Rule Support: None really, justifies *some* friction but not specific mechanisms.

      *   *Reading 2: The Game Theoretic "Cheap Talk".* Costless messages carry no information when interests conflict.
          *   Verdict: Defensible/Substantive (Crawford & Sobel).
          *   Rule Support: Argues against *no* rule. Suggests *some* cost is needed. Doesn't distinguish between Burn vs. Bet vs. Receipts yet.

      *   *Reading 3: The Handicap Principle (Wasteful Cost).* Reliability requires *wasteful* cost specifically (burning).
          *   Verdict: Contested/Model-Dependent. Zahavi vs. modern refinements. Is waste *necessary* or just *sufficient*?
          *   Rule Support: Specifically supports the "Burn" rule.

      *   *Reading 4: Differential Cost (Screening).* Reliability requires higher cost for the "bad type" (wrong ID) than the "good type" (right ID).
          *   Verdict: Defensible/Substantive (Spence Job Market).
          *   Rule Support: Supports Bet (c) and Track Record (b). Undermines Burn (if rich people can just pay).

      *   *Reading 5: Indexical Signals (Mechanical Tie).* Some signals are trustworthy because they're tied to the fact, not cost.
          *   Verdict: True/Substantive.
          *   Rule Support: Supports Receipts (a).

      *   *Reading 6: "That's Just Signaling" (Dismissive).* Showing something is a signal shows it's empty/manipulative.
          *   Verdict: False/Category Error.
          *   Rule Support: Dismisses all rules as posturing.

  4.  **Refining the Analysis (Connecting to Mushroom Context):**
      *   *The "Burn" Rule:* This is a classic Handicap argument. But in mushroom ID, does burning money make you *know* the mushroom better? No. It just makes you afraid to lie. But if you are *mistaken* (honest error), burning money punishes you the same as lying. This is a crucial distinction. Signaling theory usually addresses *hidden information* (I know, you don't), not *hidden competence* (I think I know, but I might be wrong).
      *   *The "Bet" Rule:* This is a contract. It incentivizes accuracy *ex-post*. But it requires enforcement (mods).
      *   *The "Receipts" Rule:* This is *evidence*, not signaling. It reduces information asymmetry directly.
      *   *The "Track Record" Rule:* This is *reputation*. Repeated game signaling.

  5.  **Addressing the Specific Questions:**
      *   *Burn vs. Bet:* Burn screens for confidence/willingness to suffer. Bet screens for accuracy (if mods are perfect). Burn is wasteful; Bet is transferable (potentially).
      *   *Rich vs. Accurate:* A flat fee selects for rich. A superlinear fee selects for... people who really want to speak? But does it select for *accuracy*? Only if accurate people are more willing to burn. Why would they be? Because they know they are right? If so, that's differential cost. But if the cost is *waste*, it doesn't matter if they are right or wrong, only if they are confident.
      *   *"That's just signaling":* This is usually a pejorative use. In biology, signaling is functional. In social discourse, it implies "virtue signaling" (empty). Need to clarify this distinction.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the high stakes (life/death) and the theoretical depth of the question.
      *   **The Menu (Numbered List):**
          *   Statement of the reading.
          *   Verdict (Platitude, Substantive, False, Contested).
          *   Theory Reference (Crawford/Sobel, Spence, Zahavi, etc.).
          *   Rule Support (Burn, Bet, Receipts, Track Record).
      *   **Deep Dive: Burn vs. Bet:** Explain the economic difference (Sunk Cost vs. Incentive Compatibility).
      *   **Deep Dive: "Just Signaling":** Address the pejorative usage.
      *   **Diagnosis:** What were they actually reaching for? (Likely a mix of Handicap and Cheap Talk, but conflating competence with honesty).
      *   **Caveats/Uncertainty:** Where theory breaks down (e.g., honest error vs. lying).

  7.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* I need to be careful not to say Handicap Principle is "settled." It's heavily debated in evolutionary biology regarding *waste*. In economics, signaling costs are standard, but *waste* isn't always required (just differential).
      *   *Correction:* The "Burn" rule is weird because it's a donation to a *disliked* cause. That adds a psychological cost layer. It's essentially a "bond" that is forfeited.
      *   *Crucial Point:* Mushroom ID errors are often *honest mistakes*, not lies. Signaling theory mostly deals with strategic lying. I must highlight this mismatch. A burn rule punishes honest mistakes just as hard as lies. A receipt rule prevents honest mistakes by allowing verification.
      *   *Refining "Talk is Cheap":* The phrase usually maps to the "Cheap Talk" equilibrium concept (no cost = no info). But the proposer is jumping to "therefore Handicap." I need to show that jump isn't automatic.

  8.  **Final Polish:** Check tone. Ensure it's helpful for a moderator, not just a lecture. Make sure the distinction between "settled" and "contested" is clear. (e.g., Cheap Talk equilibrium is settled math; Handicap necessity is contested biology/econ).

  9.  *(Self-Correction on the "Burn" Rule)*: The proposer says "waste is the point." This is pure Zahavi. But does it work for *epistemic* certainty? If I am 99% sure but wrong, I burn money. If I am 99% sure and right, I burn money. The cost is identical. So it doesn't screen for *accuracy*, it screens for *confidence*. Is confidence correlated with accuracy? In mushroom foraging, often negatively (Dunning-Kruger). This is a vital insight to include.

  10. **Final Review against constraints:** Numbered list? Yes. Verdicts? Yes. Rule mapping? Yes. Settled vs. Contested? Yes. Diagnosis of thread? Yes.

