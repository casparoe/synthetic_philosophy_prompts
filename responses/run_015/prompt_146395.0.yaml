answer: |-
  You have identified precisely the fault line where Aristotelian scholarship meets modern economic theory. Your intuition is correct: treating the "sterility of money" argument as a purely empirical claim about physical currency is a category error that weakens Aristotle's position unnecessarily. If you treat it as a functional-teleological claim, the normative core survives the transition from coinage to fiat credit, though it requires significant translation.

  Here is an analysis of why the prohibition does not necessarily collapse, provided you shift the ground from **physical ontology** to **functional teleology**, and how *Nicomachean Ethics* V.5 relates to this shift.

  ### 1. *Argos* as Functional, Not Physical
  When Aristotle calls money *argos* (idle/sterile) in *Politics* I.10, he is not making a claim about the chemical properties of metal or the accounting mechanics of ledgers. He is making a claim about **final causality** (*telos*).

  For Aristotle, the nature of a thing is defined by its proper use. The *telos* of a shoe is to be worn; if you trade shoes solely to accumulate more shoes, you are misusing them. Similarly, the *telos* of money is to facilitate the exchange of goods (*allaktike*). It is a measure of demand and a guarantee of future exchange.
  *   **The Ancient Context:** In a static agrarian economy, capital accumulation generally meant hoarding. Money removed from circulation was indeed "idle."
  *   **The Modern Context:** In a credit economy, money lent is not idle; it is deployed into production.

  However, Aristotle's deeper point is that money has no *internal* principle of generation. A cow generates a calf because of its biological form. Money generates interest only because of a **social convention** (the law of contract). Therefore, *tokos* (interest, which literally means "offspring") is a metaphorical breeding that treats a human convention as if it were a natural substance.

  **Verdict:** The empirical reality of fractional reserve banking shows that money *can* be made to multiply institutionally. It does not show that money *naturally* reproduces. Aristotle's objection is that treating institutional multiplication as natural growth obscures the human labor and risk actually driving the value creation. The "sterility" argument is an illustration of the separation between **real economy** (production of goods) and **monetary economy** (accumulation of claims).

  ### 2. The Teleological Core: *Oikonomike* vs. *Chrematistike*
  You are absolutely right to suspect that the biological analogy is secondary to the distinction between acquisition for use (*oikonomike*) and acquisition for unlimited accumulation (*chrematistike*).

  *   **Natural Acquisition:** Limited by the needs of the household (*oikos*) or the polis. It has a natural terminus (sufficiency).
  *   **Unnatural Acquisition:** Unlimited (*apeiron*). The goal becomes the accumulation of wealth itself, rather than the good life (*eudaimonia*) that wealth supports.

  **Application to Modern Finance:**
  If we apply this to modern banking, Aristotle's critique does not collapse; it arguably becomes more potent. Modern financialization often decouples profit from production. When derivatives trade at multiples of global GDP, or when debt is serviced by issuing new debt rather than real growth, this is pure *chrematistike*.
  *   The "false move" you identified is indeed treating the coin's physical sterility as the premise.
  *   The **real premise** is that exchange should serve human need. When the financial system becomes an end in itself (growth for growth's sake), it reverses the natural order where economy serves polity.

  Therefore, the prohibition on *tokos* is not strictly about the mechanics of lending, but about **extractive vs. generative** value. If interest represents a share in real profit generated by enterprise (risk-sharing), an Aristotelian might tolerate it (as later Scholastics did via *lucrum cessans*). If interest is a guaranteed return detached from real productivity (rentier income), it fits the definition of unnatural *chrematistike*.

  ### 3. *Nicomachean Ethics* V.5 and Exchange Justice
  Does the normative conclusion in *NE* V.5 stand independent of the *Politics* ontology? **Yes, but with caveats.**

  In *NE* V.5, Aristotle discusses reciprocal justice. Money serves as a common measure to equate dissimilar goods (shoes vs. houses) based on **need** (*chreia*).
  *   **The Ontological Shift:** In Aristotle's view, money measures *past* labor/need. In modern credit, money often monetizes *future* labor/need.
  *   **The Justice Question:** Aristotle's justice requires proportionality. If A lends to B, justice requires that the return reflects the actual benefit conferred.
      *   If interest is a price for **time preference** or **risk**, modern economics argues this is proportional (compensating the lender for deferred use).
      *   Aristotle would argue that time is a common good and cannot be sold. Charging for time is selling what belongs to the gods (or nature), which is why *tokos* is "most hated."

  **Independence:** The *NE* V.5 argument rests on the idea that exchange must maintain the proportionality of the community's needs. If interest rates distort prices such that accumulation outpaces real demand (leading to crisis/inequality), then exchange justice is violated. This conclusion does not depend on coins being physically sterile; it depends on the **social function of money** remaining tied to human need.

  However, if you accept the modern ontological shift—that money is not just a measure of value but a **claim on future production**—then Aristotle's specific prohibition on interest looks like an obsolete constraint on liquidity preference. He lacked the concept that liquidity *itself* has productive value in coordinating complex economies.

  ### 4. Synthesis: Obsolete Ontology or Enduring Ethics?
  You asked if his ethics of exchange is inseparable from an obsolete ontology of currency.

  **The Answer:** It is inseparable from an ontology of **purpose**, but not necessarily an ontology of **physics**.

  1.  **Obsolete:** The idea that money is merely a counter for barter is empirically false. Money is a social technology of trust and time. Aristotle's inability to conceive of money as capital (a factor of production) limits the direct application of his *tokos* prohibition.
  2.  **Enduring:** The distinction between **wealth as means** and **wealth as ends** remains robust. The critique that financial systems can become parasitic on the real economy is profoundly Aristotelian.

  **Conclusion on Your Reading:**
  You are correct to pivot to the teleological argument. If you ground Aristotle's prohibition in the **reversal of the means-end relationship** (money serving accumulation rather than life), the critique survives fractional reserve banking.
  *   **Modern Translation:** The "unnatural" act is not lending money; it is structuring financial instruments where the return is guaranteed regardless of real value creation, thereby treating money as a self-generating substance rather than a claim on social labor.

  The *Nicomachean Ethics* V.5 framework stands if you interpret "need" (*chreia*) not as immediate biological desire, but as the **sustainable requirements of the political community**. If interest mechanisms threaten that sustainability (via instability or extreme inequality), the Aristotelian prohibition retains its normative force, even if the "sterile coin" analogy is discarded as a heuristic device.

  **Summary:** You have not shown his ethics to be obsolete; you have shown that the *biological metaphor* was the weak link, not the *teleological structure*. The collapse only occurs if you insist on reading him as a metallist economist rather than a political philosopher.
