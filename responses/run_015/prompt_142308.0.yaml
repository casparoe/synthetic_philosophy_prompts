answer: |-
  # Q&A Prep Sheet: Calibration Gap & Replication Metrics

  ### Part 1: Pre-emptive Concessions (First 2 Minutes)
  *Do not wait for these to be raised. State them in your opening summary or immediately after. It disarms the "you didn't consider X" attack.*

  1.  **On Selection Bias:** "I want to be clear upfront: the hierarchical model is fitted to published, significant original estimates. I am not claiming this removes publication bias; I am claiming that by modeling the distribution of *published* effects, we can quantify how much replication failure is statistically expected versus how much is excess. The selection mechanism is a limitation of the input, not a bug of the metric."
  2.  **On Causality:** "The calibration gap is a diagnostic statistic, not a causal identifier. It tells you *that* the literature is miscalibrated, not *why* (e.g., p-hacking vs. measurement drift). I am treating it as a residual to be explained, not an explanation itself."
  3.  **On Prior Robustness:** "When I say 'prior-robust,' I mean robust to *subjective* prior specification, not robust to the structural assumptions of the hierarchical model. If the distribution of true effects is not approximately Normal, the prediction shifts."

  ---

  ### Part 2: Objections, Replies, and Softness
  *Ordered by potential damage to the chapter (High to Low).*

  #### 1. The Selection Bias Attack (Biostatistician)
  **Objection:** "You fit a hierarchical model to estimates that survived a $p < .05$ filter. Your predicted replication rate is therefore conditioned on selected data. Unless you explicitly model the truncation in the likelihood function, your 'predicted' rate is inflated by the very bias you're trying to measure. The gap isn't a calibration error; it's the mathematical residue of selection bias you failed to correct for."
  **Reply:** "You're right that fitting on raw published estimates inflates the prediction. However, the hierarchical shrinkage pulls extreme winners back toward the mean. In my simulations, even without an explicit selection function, the shrinkage captures enough of the winner's curse to establish a baseline. The gap measures the *remaining* excess failure after shrinkage accounts for the obvious winners."
  **Softness:** **High.** If the shrinkage isn't strong enough to counteract the selection bias, the predicted rate is still too high, making the gap artificially large (suggesting artifacts where there are none).
  **Verdict:** **Weaken.** Do not drop, but qualify the gap as a "lower-bound estimate of excess failure."
  **Falsifier:** If I apply this to a simulation where *all* effects are true and only selection operates, and I still get a non-zero calibration gap, the metric is measuring selection, not artifacts.

  #### 2. The Circularity/Filter Question (Philosopher / General)
  **Objection:** "If the benchmark is fitted to the very same published estimates that went through the publication filter, isn't your 'gap' just the filter reconstituted? You're comparing observed replications to a prediction derived from filtered data. Isn't the gap guaranteed to be negative simply because the original data was filtered for significance?"
  **Reply:** "No, because the replication data is *not* filtered. The original data is filtered (high effects), the replication data is unfiltered (unbiased estimates). The model predicts what happens when you take the filtered originals and run them again with higher $N$. If the literature were just underpowered but honest, the gap should be near zero. A large negative gap implies the original filter captured noise that didn't replicate."
  **Softness:** **Medium.** This relies on the assumption that the hierarchical model correctly estimates the underlying mean despite the filter. If the filter is severe (e.g., $p < .001$), the model might not recover the true mean.
  **Verdict:** **Drop.** If you cannot demonstrate that the model recovers the true mean in a selection-only simulation, the metric is tautological.
  **Falsifier:** Run a simulation with 100% true effects, apply $p < .05$ selection, fit your model, and predict replications. If the calibration gap is significantly different from zero, abandon the framing.

  #### 3. The "Prior Robustness" Claim (Biostatistician / Philosopher)
  **Objection:** "You argue the gap is prior-robust because the prior is integrated over. But you're using an Empirical Bayes approach where the hyperparameters are estimated from biased data. That's not 'robustness'; that's laundering the bias into the prior. A skeptic's prior and your estimated prior will diverge significantly."
  **Reply:** "The claim isn't that the estimated prior is 'true,' but that it represents the *literature's* operating characteristics. A skeptic's fixed prior ignores the actual distribution of effects in the field. My approach asks: 'Given what this field claims to find, how often should they replicate?' It shifts the debate from 'are effects real?' to 'is the field calibrated to its own claims?'"
  **Softness:** **High.** If the hyperparameter estimation is sensitive to outliers (which published effects are), the "literature prior" is unstable.
  **Verdict:** **Weaken.** Change "prior-robust" to "field-calibrated."
  **Falsifier:** If changing the hierarchical distribution family (e.g., from Normal to t-distribution) drastically changes the gap magnitude, the "robustness" claim is false.

  #### 4. Causal Ontology (Philosopher)
  **Objection:** "You present the gap as evidence of 'artifacts' versus 'underpowering.' But statistically, it's just a residual. Without identifying the causal mechanism (e.g., p-hacking vs. measurement drift), labeling it an 'artifact' is ontologically premature. Are you measuring a property of the world or a property of the publication process?"
  **Reply:** "I agree it doesn't identify the mechanism. I'm framing it as a *phenomenological* distinction. Two literatures can have the same replication rate but different gaps. One implies the studies were honest but noisy (gap ≈ 0); the other implies the estimates were inflated beyond sampling error (gap < 0). It classifies the *type* of crisis, even if it doesn't name the culprit."
  **Softness:** **Medium.** Philosophically, this is a retreat from causal claims to descriptive taxonomy.
  **Verdict:** **Weaken.** Accept the descriptive label. Do not claim it identifies "artifacts" definitively.
  **Falsifier:** If a literature known to be high-quality (e.g., psychophysics) shows a large negative gap, the metric is conflating noise with artifacts.

  #### 5. Measurement Invariance (Social Psychologist)
  **Objection:** "Your model assumes the replication is measuring the same construct with the same reliability. If the replication fails because the measure wasn't invariant across contexts, your model attributes that to 'artifacts' or 'power.' You're treating measurement error as statistical noise."
  **Reply:** "That's correct, and it's a feature. If a literature is so context-dependent that replications fail due to measurement drift, the original effect sizes are not generalizable parameters. The gap captures the 'portability' of the effect, regardless of whether the failure is statistical or contextual."
  **Softness:** **Medium.** This redefines "replication failure" to include measurement incompatibility, which some purists reject.
  **Verdict:** **Weaken.** Acknowledge the gap conflates statistical and measurement failure.
  **Falsifier:** If controlling for measure reliability (e.g., Cronbach's alpha) eliminates the gap, then it's just a reliability metric, not a replication metric.

  #### 6. Redundancy with Power Analysis (Econ-Adjacent)
  **Objection:** "We already know underpowered studies replicate poorly. Why do we need a 'calibration gap'? A standard post-hoc power analysis tells you the expected replication rate. This is just power analysis with extra steps."
  **Reply:** "Standard power analysis is study-level and binary (powered/not). The gap is literature-level and continuous. It aggregates the winner's curse across the whole field. Power analysis says 'Study A had 40% power.' The gap says 'The literature claims effects that should yield 80% replication, but we see 40%.' It captures the systemic inflation, not just the sample size."
  **Softness:** **Low.** Economists might still see this as semantic.
  **Verdict:** **Keep.** This is a framing difference, not a mathematical one.
  **Falsifier:** If the correlation between average post-hoc power and the calibration gap is > 0.95, the metric adds no information.

  #### 7. The "Measurement Problem" Alternative (Committee Social Psych)
  **Objection:** "I've argued the crisis is a measurement problem. If your gap is large, why shouldn't I interpret that as evidence that the original measures were unreliable, rather than that the estimates were artifacts? Your model doesn't distinguish bad measures from bad statistics."
  **Reply:** "It doesn't distinguish them, which is why the gap is useful. Whether the failure is due to p-hacking or unreliable measures, the result is the same: the literature's reported effect sizes are not actionable. The gap quantifies the 'unactionability' regardless of the source."
  **Softness:** **Low.** This concedes the point to the chair but keeps the metric useful.
  **Verdict:** **Keep.**
  **Falsifier:** If improving measurement reliability in a replication study does *not* reduce the gap, the metric is insensitive to the measurement problem.

  #### 8. The Specific Numbers Trap (Department Member)
  **Objection:** "Can you give me the exact replication rate from the Open Science Collaboration 2015 project? You cited it, but I recall different numbers being thrown around."
  **Reply:** "The OSC 2015 project reported 36% of replications had $p < .05$, but subsequent re-analyses like ManyLabs showed heterogeneity ranging significantly depending on protocol fidelity. I treat the specific percentage as a point estimate from a specific sample protocol, whereas my metric focuses on the structural calibration across literatures."
  **Softness:** **None.** This is a safe dodge.
  **Verdict:** **Keep.**
  **Falsifier:** N/A.

  ---

  ### Part 3: The "Hope Nobody Asks" Question
  *You identified this correctly. It is the combination of Objection 1 and 2, phrased more aggressively.*

  **The Question:** "If you estimate the distribution of true effects *from* the published literature, and the published literature is selected for significance, aren't you essentially baking the publication bias into your 'prediction'? If your model learns that 'published effects are large,' and then predicts 'replications should be large,' isn't a failure to replicate just proof that publication bias exists, which we already knew? What does the gap tell us that we don't already know from the selection model itself?"

  **Why it's deadly:** It suggests the entire chapter is a complex way of rediscovering publication bias.

  **The Reply:** "We know publication bias exists. The gap quantifies its *consequence* on replicability. Knowing the filter exists doesn't tell you whether the surviving effects are real but underpowered, or false and inflated. The gap separates those two scenarios. If the gap is zero, the filter passed underpowered true effects. If the gap is negative, the filter passed false positives. It moves us from 'bias exists' to 'bias is distorting the literature's predictive validity.'"

  **Preparation:** Run the "Selection Only" simulation (100% true effects, $p < .05$ filter). If the gap is zero, you are safe. If the gap is negative, you have a major problem. **Do this before the defense.**

  ---

  ### Part 4: Falsifiers & Decision Rules
  *For each objection above, here is the concrete result that would make you abandon the measure.*

  1.  **Selection Bias:** If a simulation with **100% true effects + selection bias** yields a **non-zero calibration gap**. (Implies the gap measures selection, not artifacts). -> **DROP.**
  2.  **Circularity:** If the gap magnitude is **perfectly correlated ($r > .95$)** with the severity of the publication filter (e.g., $p < .01$ vs $p < .05$) regardless of the true effect distribution. (Implies it's just a filter gauge). -> **DROP.**
  3.  **Prior Robustness:** If changing the hierarchical prior from **Normal to Cauchy** changes the gap sign (positive to negative). (Implies the result is driven by distributional assumptions). -> **WEAKEN.**
  4.  **Causal Ontology:** If applying the metric to **psychophysics data** (known high reliability) yields a **large negative gap**. (Implies the metric flags artifacts where there are none). -> **DROP.**
  5.  **Measurement Invariance:** If **correcting for reliability** (disattenuating correlations) reduces the gap to zero. (Implies it's just a reliability metric). -> **WEAKEN.**
  6.  **Power Redundancy:** If the **rank ordering** of literatures by "Calibration Gap" is identical to rank ordering by "Average Post-Hoc Power". (Implies no new information). -> **WEAKEN.**
  7.  **Measurement Problem:** If **preregistered high-power replications** with **identical measures** still show a large gap. (Implies the gap captures something real beyond measurement). -> **KEEP (This validates the metric).**
  8.  **Specific Numbers:** N/A.

  ### Summary Advice
  Your strongest position is that the gap is a **diagnostic residual**, not a causal estimator. If you defend it as a tool for *triage* (which literatures need theoretical overhaul vs. just more power) rather than *truth*, you survive the philosophical attacks. If you claim it identifies "false positives," the Biostatistician will dismantle you.

  **Do the Selection-Only Simulation tonight.** If that gap isn't zero, you need to adjust the model (e.g., include a selection function in the likelihood) before you walk into the room.
