      4.  *Prior Robustness Claim (Biostat/Phil):* You say it's prior-robust, but the hierarchical prior *is* a prior estimated from biased data. (Medium-High)
      5.  *Measurement Heterogeneity (Social Psych):* Replication failure is often context/measurement, not just statistical power. Your model assumes exchangeability. (Medium)
      6.  *Power Analysis Redundancy (Econ):* Why not just calculate post-hoc power? (Low-Medium)
      7.  *Specific Numbers (Department):* Trivia trap. (Low)
      8.  *Generalizability (Social Psych):* Does this work outside psych? (Low)

      *Let's select the top 8 based on "Damage to Chapter".*
      1.  Biostat: Selection Bias in the Hierarchical Fit.
      2.  Phil/General: The Tautology/Circularity of the Filter.
      3.  Biostat: The "Prior Robustness" Claim (Garbage In, Garbage Out).
      4.  Phil: Causal vs. Statistical Ontology.
      5.  Social Psych: Measurement Invariance/Context (The "Direct" Replication Assumption).
      6.  Econ: Redundancy with Standard Power Analysis.
      7.  Social Psych: The "Measurement Problem" Alternative Explanation.
      8.  Department: The Specific Numbers Trap.

  4.  **Drafting Concessions:**
      *   Need to show humility and awareness of limitations immediately.
      *   Acknowledge the selection bias issue (it's known, not ignored).
      *   Acknowledge the metric is descriptive, not mechanistic.
      *   Acknowledge dependence on the assumption of exchangeability.

  5.  **Drafting Replies & Softness:**
      *   *Selection Bias:* Reply: I model the selection process (selection model). Softness: Requires correct specification of the selection function.
      *   *Circularity:* Reply: The gap exists *because* the model predicts success based on reported magnitude, but reality shows less. It quantifies the excess failure. Softness: If the hierarchical shrinkage is too aggressive, it masks the gap.
      *   *Prior Robustness:* Reply: Empirical Bayes approach integrates over the distribution of effects rather than fixing a point prior. Softness: Still relies on the distributional assumption (e.g., Normal).
