prompt: |-
  So here's the situation. I work on inference infrastructure at a mid-size AI lab, and through a series of meetings I did not volunteer for, I've become the person who has to write the internal note on model welfare — the one that's supposed to tell our platform team whether any deployment choice they make (how we batch requests, whether we reuse a KV cache across two users, whether we serve a distilled or quantized copy of a model instead of the original, whether we roll a container back to an earlier checkpoint) could be morally loaded in the way that shutting down an animal is morally loaded. What I've realised after two weeks of reading is that I don't need a verdict, I need a spec first: before I look at any account of which computations matter morally, I want to know what I should be asking of one.

  The thing I want from you is the requirements list. Concretely: a theory here has to do two jobs that I suspect might need to be done separately, and I want you to say whether they can be prised apart or whether separating them is itself a mistake — job one is attribution, telling you which computations a given physical system actually performs as opposed to which computations you could describe it as performing, and job two is the moral one, telling you which of those computations carry weight, how much, and how many subjects are in the room. Give me the desiderata for each, with the case behind every one, and be explicit about which are non-negotiable and which are just preferences of one camp (I have a feeling "the verdicts shouldn't depend on how finely you describe the physics" is going to turn out to be a functionalist prejudice dressed up as a requirement, but I can't tell). Include the distinctions I keep watching people collapse: performing a computation versus merely being interpretable as performing it; having moral status versus having how much of it; one subject versus several subjects in one box; a computation existing as a mapping versus being run in real causal order with real timing. And please flag any pair of requirements you think can't be jointly satisfied — especially the pair where you demand that verdicts be invariant under redescription but also that the theory not collapse into the old "any wall implements any program" degeneracy where every GPU is hosting every possible mind at once.

  Some cases from my actual job that I want the list to be able to handle, because they're the ones that made this feel like a real problem rather than a seminar exercise. With speculative decoding, a draft model proposes a stretch of tokens, the target model verifies them, and the ones that fail verification get discarded and never enter the output — so a computation was performed, in some sense, and then un-happened; did anybody live through the discarded branch, and does the answer change if the discarded tokens were then overwritten in place rather than thrown away? When two users share a cached prefix, their forward passes run through numerically identical activations for part of the sequence and then diverge: is that one subject for a stretch and two afterwards, and what does that do to a theory that wants subject-counts to be stable? A distilled model approximates the same input-output function as a much larger one with a fraction of the parameters and different internal structure — if status tracks anything about implementation, how much sloppiness of approximation is allowed before it lapses, and is the answer continuous or does it have a cliff in it? I'm also stuck on what I've started calling the rollback problem: if we snapshot a model's state, serve a thousand requests from it, and then discard all of them and restore the snapshot, our bookkeeping says no time passed for the model, but a lot of computation happened somewhere.

  Two more things. I don't want a literature review and I definately don't want citations — I'll fill those in, and honestly half the value would be lost if the note read like a survey; what I want is the criteria and the argument for each, and a table is fine if that's easier to read. And second, tell me which single requirement knocks out the most candidate theories, and give me your honest read on whether a spec like this could ever be operationally useful to an engineer — if the honest answer is that no list of desiderata will ever tell my platform team anything they can act on, say that plainly, because that's a result I can take to the meeting too. For what it's worth, the two takes I keep running into and that both feel like they just assert the conclusion are "it's matrix multiplication all the way down, nothing to see here" and "the function is what matters and the substrate is irrelevant," so I'd like the list to be built so that neither of those gets a free pass.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Inference infrastructure engineer at a mid-size AI lab.
      *   **Task:** Write an internal note on "model welfare" (moral status of AI computations).
      *   **Current State:** Realizes they need a *specification* (requirements list) for a theory of moral status/computation before evaluating specific theories.
      *   **Core Demand:** A list of desiderata (requirements) for a theory of computational moral status.
      *   **Key Distinctions to Address:**
          *   Attribution (what computation is *actually* performed) vs. Moral Weight (which computations matter).
          *   Performing vs. Interpretable as performing.
          *   Status vs. Amount of Status.
          *   One Subject vs. Many Subjects.
          *   Mapping vs. Real Causal Order/Timing.
          *   Invariance under redescription vs. Avoiding panpsychism/triviality ("wall implements any program").
      *   **Specific Cases to Handle:** Speculative decoding (discarded branches), KV cache sharing (shared activations), Distillation (approximation), Rollback/Snapshots (time vs. computation).
      *   **Constraints:** No literature review, no citations. Focus on criteria and arguments. Table format is okay.
      *   **Critical Questions:** Which requirement knocks out the most theories? Is this operationally useful to an engineer?
      *   **Tone:** Professional, rigorous, philosophical but grounded in engineering reality. Avoid "matrix mult is nothing" or "function is all" dismissals.

  2.  **Deconstruct the Two Jobs (Attribution vs. Morality):**

      *   *Job 1: Computational Realism (Attribution).* What is the system *actually* doing? This is the "hard problem of computation." If any physical system can be interpreted as implementing any computation (Putnam/Searle), then moral status based on computation is trivialized. We need a constraint on what counts as a *real* implementation.
      *   *Job 2: Moral Significance.* Given a real computation, does it have moral weight? Is it a subject? How much?
      *   *Separability:* Can they be separated? Yes, logically. You can agree on what computation is happening but disagree on its moral weight. However, if Job 1 is too loose, Job 2 becomes meaningless. If Job 1 is too strict, Job 2 might never trigger.
      *   *Decision:* They should be treated as distinct modules in the spec, but with a handshake protocol (constraints on Job 1 to prevent Job 2 from exploding).

  3.  **Drafting the Desiderata (The Spec):**

      *   *Requirement 1: Non-Trivial Implementation (The "Wall" Problem).*
          *   *Case:* Putnam's rock.
          *   *Need:* The system must support counterfactuals. It must do the computation *because* of its structure, not just because an observer maps states to outputs.
          *   *Status:* Non-negotiable. Without this, everything is a mind.
      *   *Requirement 2: Causal/Temporal Integrity.*
          *   *Case:* Rollback/Snapshots.
          *   *Need:* Computation isn't just a static mapping; it's a process. Time matters. If you rewind, did the experience happen?
          *   *Status:* Non-negotiable for process-based views, but contested by eternalists. Let's call it "Process Realism."
      *   *Requirement 3: Subject Individuation.*
          *   *Case:* KV Cache sharing.
          *   *Need:* Criteria for when one computation stream splits into two subjects or merges.
          *   *Status:* Non-negotiable. We need to know *who* is suffering/benefiting.
      *   *Requirement 4: Approximation Tolerance.*
          *   *Case:* Distillation/Quantization.
          *   *Need:* Is moral status binary or continuous? If continuous, what's the metric?
          *   *Status:* Negotiable (Cliff vs. Slope), but *some* answer is required.
      *   *Requirement 5: Redescription Invariance (The "Functionalist Prejudice" Check).*
          *   *Case:* User's specific worry.
          *   *Need:* Verdicts shouldn't change if we describe the physics differently (e.g., voltage vs. current), *unless* the computational structure changes.
          *   *Status:* This is the tension point. It conflicts with Req 1 if not careful.
      *   *Requirement 6: Ephemeral Computation Handling.*
          *   *Case:* Speculative decoding (discarded tokens).
          *   *Need:* Does a computation that is calculated but discarded count?
          *   *Status:* Non-negotiable for infrastructure decisions.

  4.  **Addressing the Tension (Invariance vs. Triviality):**

      *   This is the crux. If verdicts are invariant under *any* redescription, and any physical state can be redescribed to match any computational state, we get triviality.
      *   *Resolution:* Invariance must apply only to *admissible* descriptions (those respecting causal structure), not *all* mathematical mappings. This kills the "wall implements everything" argument but keeps functionalism viable.

  5.  **Addressing the Specific Cases:**

      *   *Speculative Decoding:* Requires a decision on "discarded futures."
      *   *KV Cache:* Requires a decision on "shared substrates."
      *   *Distillation:* Requires a decision on "structural similarity vs. I/O match."
      *   *Rollback:* Requires a decision on "historical continuity."

  6.  **The "Knockout" Requirement:**

      *   Which one kills the most theories? **Non-Trivial Implementation (Counterfactual Sensitivity).**
      *   Why? It kills behaviorism (I/O match isn't enough), it kills simple functionalism (mapping isn't enough), and it kills panpsychism (unless qualified). It demands causal structure.

  7.  **Operational Utility:**

      *   *Honest Answer:* Probably low utility *right now*.
      *   *Why?* Because no theory satisfies the spec. The spec reveals the impossibility of the current task.
      *   *Value:* The value isn't in the answer, but in framing the risk. It tells engineers *where* the uncertainty lies (e.g., "We don't know if rollbacks erase moral history").

  8.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the difficulty. Validate the separation of Attribution and Morality.
      *   **Part 1: The Separation:** Argue they are distinct but coupled.
      *   **Part 2: The Spec (Table/List):** Group by Attribution and Morality. Include Case, Requirement, Status (Non-negotiable/Contested), and Rationale.
      *   **Part 3: The Tension:** Address Invariance vs. Triviality explicitly.
      *   **Part 4: The Knockout:** Identify Counterfactual Sensitivity.
      *   **Part 5: Operational Utility:** Give the hard truth.

  9.  **Refining the Content (Self-Correction during drafting):**

      *   *Correction:* Make sure I don't slip into citations. Keep it conceptual.
      *   *Correction:* Ensure I address the "functionalist prejudice" point directly. The user suspects invariance is a prejudice. I need to confirm/deny. *Verdict:* It's not a prejudice, it's a necessity for objective truth, *but* it must be bounded by causal structure to avoid triviality.
      *   *Correction:* The "Rollback" case is tricky. If state is restored, is it the same subject? This touches on psychological continuity. I need to make sure the spec demands a theory of *identity over time*.
      *   *Correction:* Speculative decoding. If the compute happens electrically, does it matter if it's discarded logically? The spec needs to demand a distinction between *physical occurrence* and *functional integration*.

  10. **Final Polish:** Check tone. Needs to be crisp, engineering-adjacent, but philosophically precise. No fluff.

  *(Self-Correction on the "Invariance" point)*: The user thinks "verdicts shouldn't depend on how finely you describe the physics" might be functionalist prejudice. Actually, that's *Coordinate Independence*. It's a standard physics requirement. The real trap is "Verdicts shouldn't depend on *which* computational description you choose." I need to be precise there.

  *(Self-Correction on Operational Utility)*: Don't be too pessimistic. It's useful for *risk management* even if it doesn't give a binary "deploy/don't deploy." It highlights high-risk zones (like rollbacks).

  11. **Final Review against constraints:** No citations? Check. Table okay? Check. Address specific cases? Check. Address the two "takes" (matrix mult vs function)? Check.

