prompt: |-
  I'm taking a moral philosophy course and we've been talking about the separateness of persons objection to utilitarianism — the idea that people aren't just containers for utility, there's no "sum" that includes me and you. I tried to extend the argument and now it feels like it proves way too much.

  Here's the chain:

  1. The core objection is that welfare isn't interpersonally fungible: my loss can't be cancelled out by your gain, because there's no super-person whose welfare is the total.
  2. But fungibility isn't only about literally adding numbers. It's also about treating one person's burden as acceptable just because it produces benefits elsewhere.
  3. So the objection should block not just direct sacrifice (trolley problems) but any scheme where some bear costs so others benefit — taxation for public goods, risk pools in healthcare, even voluntary contracts where I take a hit for a shared project I care about.
  4. If that's right, then any collective arrangement that allows trade-offs between persons violates separateness, unless every single affected person explicitly consents to their specific burden.
  5. But then the objection doesn't just defeat utilitarianism; it defeats liberal social democracy, public health mandates, and probably any society larger than a voluntary commune.
  6. That cant be right — I dont want to be forced into anarchism about tax or medicine.

  I think the slip might be between (2) and (3), maybe I'm confusing "not fungible" with "never acceptable to impose harm for collective ends"? But I'm not sure. Which step should I reject, and what does giving it up cost?

  Please answer in British English. Also, say what would change your mind — which argument or consideration would make you overturn your diagnosis, and where is your reasoning most likely to fail?
