      *   *Verdict:* It often pushes the regress back unless one adopts a "structure primitive" view. If grounding is a further fact, Bradley wins. If grounding is just a way of talking about metaphysical dependence without ontological addition, it might dodge it. But strictly speaking, if grounding is a real relation, Bradley's hammer falls again.

