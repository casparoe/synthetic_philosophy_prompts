answer: |-
  Your reconstruction of Bradley's argument is accurate, and your intuition regarding the "hidden premise" is philosophically astute. You have identified the crux of the debate between British Idealism (Bradley) and Early Analytic Philosophy (Russell).

  To answer your primary question directly: Bradley's argument succeeds only if one accepts his specific ontology of what it means to be "real." If one rejects that ontology, the argument does not prove relations are unreal; rather, it exposes a category mistake in how Bradley models relational propositions.

  Here is a detailed parsing of the issues you raised, broken down by the specific components of your inquiry.

  ### 1. Bradley's Conception of the "Unity of the Proposition"

  To understand why Bradley thinks the regress is vicious, we must understand what he means by "unity." For Bradley, a judgment or fact (e.g., "a is related to b by R") is not merely a list of ingredients. A list ($a$, $b$, $R$) is a plurality, not a unity. A fact, however, is a single state of affairs.

  Bradley's demand for unity is a demand for **internal coherence**. He argues that if $a$, $b$, and $R$ remain distinct, self-subsistent entities, their togetherness is unintelligible.
  *   If $R$ is a distinct entity from $a$, then $R$'s connection to $a$ is not automatic.
  *   Therefore, something must account for that connection.
  *   If that "something" is another relation ($R'$), then $R'$ is also a distinct entity, requiring its own connection ($R''$).

  For Bradley, true unity implies that the distinctions between the terms are ultimately absorbed into a whole where they do not stand apart. Because relations inherently maintain the distinctness of their terms (a relation is *between* things), Bradley concludes that relations are appearances, not reality. True reality must be the "Absolute," a seamless, non-relational whole where distinctions are transcended.

  ### 2. The Hidden Premise: External vs. Internal Connection

  You asked whether there is a hidden premise that every constituent must be an independently real term externally connected to the others. **The answer is yes.**

  Bradley's argument relies on the assumption that **to be real is to be a substance-like particular.**
  *   **The Premise:** If $R$ is real, it is a "thing" (a term) in its own right.
  *   **The Consequence:** If $R$ is a "thing," it sits alongside $a$ and $b$ as a third item.
  *   **The Problem:** Three items do not make a fact; they make a heap. To turn the heap into a fact, you need a "copula" or a connector.
  *   **The Regress:** If the connector is also a "thing," you are back to the heap problem.

  This premise rules out Russell's view by definition. Russell argues that relations are not "things" in the same sense that particulars are. They are **unsaturated** or **incomplete** entities that have a combining power built into their nature.

  Bradley assumes that all ontological constituents are "saturated" (self-contained). If you start with the premise that all constituents are self-contained, you can never generate unity without an infinite series of external glue. Therefore, Bradley's argument is less a proof that relations are unreal and more a *reductio ad absurdum* of the view that relations are self-subsistent particulars.

  ### 3. Russell's Response and the Blocking of the Regress

  Bertrand Russell explicitly recognized Bradley's regress as the primary obstacle to a pluralistic realism. His response, developed in *The Principles of Mathematics* (1903) and later in *The Philosophy of Logical Atomism* (1918), attempts to block the regress without appealing to an Absolute.

  **Russell's Strategy:**
  Russell distinguishes between a relation **as a term** and a relation **as relating**.
  *   **As a term:** We can talk about "similarity" abstractly. In this mode, it is just an object of thought.
  *   **As relating:** In the fact "$a$ is similar to $b$," similarity is actively holding $a$ and $b$ together.

  Russell argues that the "relating" function is primitive. It does not require a further relation to make it work. To ask "what relates the relation to the terms?" is to treat the relation as a static object (a term) rather than a dynamic constituent of the fact.

  **Does this block the regress?**
  *   **Yes,** logically. Russell simply asserts that some unities are brute facts. He denies Bradley's hidden premise that every connection requires an external explainer. For Russell, the proposition *is* the unity; it is not a unity constructed out of parts that need gluing.
  *   **No,** dialectically (from Bradley's perspective). Bradley would argue Russell is merely asserting unity without explaining it. Bradley would say, "You claim the relation has 'combining power,' but if the relation is distinct from $a$, that power is an additional property, which needs its own connector."

  **Does it require an Absolute?**
  No. Russell's move allows for a pluralistic universe composed of many distinct atomic facts. He sacrifices the demand for a totalizing explanation (which Bradley wants) in favor of stopping the regress at the level of atomic facts.

  ### 4. Modern Metaphysical Grounding

  You asked whether a modern grounding framework resolves the issue or pushes the regress back. This is a nuanced area in contemporary metaphysics.

  **The Grounding Proposal:**
  In modern terms, one might say the fact [$aRb$] is **grounded in** the existence of $a$, $b$, and $R$. Grounding is intended to be a non-causal, metaphysical determination relation.

  **Does it solve Bradley's Regress?**
  *   **If Grounding is a Relation:** If "grounding" is treated as a real relation existing between the relata ($a, b, R$) and the fact ($aRb$), then **Bradley's regress returns immediately.** We would need to ask: what grounds the grounding relation? If grounding is a further fact, we need a further ground.
  *   **If Grounding is Primitive:** Most grounding theorists treat grounding as a primitive, unexplained brute connection (similar to Russell's "relating"). If so, it **does not solve the problem better than Russell;** it merely renames the primitive. It avoids the regress by fiat, asserting that metaphysical explanation must stop somewhere.

  **The Verdict on Grounding:**
  Grounding offers a genuine resolution only if it is understood not as an ontological addition (a new "thing" connecting things) but as a structural feature of reality. However, if one presses the Bradleyan critique, any claim that "$X$ grounds $Y$" posits a distinction between $X$ and $Y$. If they are distinct, what secures the link?
  *   **Resolution:** It resolves the issue for those willing to accept **metaphysical primitivism** (the view that some connections are fundamental and unexplainable).
  *   **Regress:** It pushes the regress back one level for those who insist that *all* metaphysical connections must be externally mediated.

  ### Summary and Conclusion

  Your suspicion is correct: Bradley's argument succeeds only if you accept the hidden premise that **all real constituents are self-subsistent terms requiring external connection.**

  1.  **Bradley's Unity:** Requires the dissolution of distinctness. Since relations preserve distinctness, they cannot yield true unity.
  2.  **The Hidden Premise:** Bradley assumes relations are "things." This begs the question against Russell, who views relations as "unsaturated" functions that combine terms by their very nature.
  3.  **Russell's Block:** Russell blocks the regress by positing primitive unity. He denies that the "combining" of a relation needs a further explanation. This allows him to reject the Absolute in favor of a pluralistic world of facts.
  4.  **Grounding:** Modern grounding frameworks generally mirror Russell's solution. They avoid the regress only by treating grounding as a primitive, non-relational dependency. If grounding is treated as a relation, the regress returns.

  Ultimately, the debate is not settled by logic alone but by competing intuitions about explanation. Bradley demands a total explanation for unity (which leads to the Absolute). Russell and modern primitivists accept that unity is a fundamental feature of the world that does not itself require a further cause. Bradley's argument exposes the cost of Russell's view (brute facts), but it does not logically compel us to accept Bradley's conclusion (the unreality of relations) unless we already share his ontology.
