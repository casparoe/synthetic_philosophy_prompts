answer: |-
  Here are the desiderata for an adequate theory of cognitive penetration (CP), structured to resolve the stalemate in your seminar.

  ### I. Core Desiderata for an Adequate Account

  To determine whether an arbitrary case counts as cognitive penetration, a theory must provide a decision procedure that satisfies the following conditions.

  **1. The Experiential Difference Condition**
  *   **Specification:** The theory must identify a variance in perceptual experience (phenomenal character or representational content) correlated with a variance in cognitive state (belief, desire, hypothesis), holding the distal and proximal stimulus constant.
  *   **Status:** **Non-Negotiable.** Without a change in *experience*, you have cognitive influence on judgment or behavior, not perception.
  *   **Case to Get Right:** *The Gun/Phone.* If the experience of the object literally looks more gun-shaped (elongated barrel, darker metal) when the observer believes the stranger is dangerous, this condition is met. If the object looks identical but the observer is just quicker to classify it as a gun, this condition fails.

  **2. The Architectural Directness Condition**
  *   **Specification:** The theory must specify that the causal path from cognition to experience does not run exclusively through mechanisms traditionally categorized as "non-perceptual" (e.g., voluntary eye movements, explicit memory retrieval, or post-perceptual decision criteria).
  *   **Status:** **Non-Negotiable.** This is the constraint that prevents collapse into "any causal influence."
  *   **Case to Get Right:** *Voluntary Attention.* If I tell you to "look for red," and you see red more vividly because you shifted spatial attention, this is *not* penetration. A theory must distinguish top-down modulation of *processing weights* (potential CP) from top-down selection of *input data* (Attention).

  **3. The Dissociation of Levels Condition**
  *   **Specification:** The theory must treat four variables as independently measurable: (a) Sensory processing (neural/functional modulation), (b) Perceptual Content (what the scene is represented as), (c) Phenomenal Character (what it is like), and (d) Perceptual Judgment (the report).
  *   **Status:** **Non-Negotiable.** A theory that conflates these cannot survive the "post-perceptual judgment" objection.
  *   **Case to Get Right:** *The Radiologist.* The radiologist's scan *looks* different to her than to you (Phenomenal/Content change) because her visual cortex processes the texture differently (Sensory change), not merely because she is more confident in her report (Judgment change).

  **4. The Epistemic Significance Condition**
  *   **Specification:** The theory must explain why CP, if it occurs, alters the justificatory status of the resulting belief (e.g., via "epistemic downgrade" or circularity).
  *   **Status:** **Preference of One Camp (The Epistemologists).** While most agree CP *could* matter epistemically, some (e.g., pragmatic encroachment theorists) argue that even if penetration occurs, it doesn't necessarily undermine justification if the cognitive penetrator is reliable.
  *   **Reasoning:** Demanding that penetrated perceptions *never* justify the penetrating belief rules out cases where prior knowledge legitimately sharpens perception (e.g., learning to see wine notes).

  ---

  ### II. Head-On Issue 1: Stimulus Constancy vs. Causal Explanation

  You asked which test a theory should be built around: "Same proximal stimulus, different experience" or "Difference-maker in the best causal-explanatory story."

  **The Conflict:**
  *   **Stimulus Constancy Test:** Holds retinal input fixed. If experience changes, something internal changed.
      *   *Weakness:* It allows attention to sneak in. I can hold the stimulus fixed but attend to different features based on cognition. Is that penetration? Most say no.
  *   **Causal Explanation Test:** Asks if cognition is the *best explanation* for the variance.
      *   *Weakness:* It risks over-inclusion. If cognition causes an eye movement (saccade), cognition is the difference-maker for the new experience, but this is clearly not penetration.

  **The Resolution:**
  A robust theory must be built around the **Causal Explanation Test**, but with a **Mediation Constraint**.
  *   **Why:** Stimulus constancy is merely a methodological control, not an ontological definition. You can have penetration even if the stimulus varies slightly, provided cognition drives the perceptual weighting.
  *   **What it gives up:** It gives up the simplicity of the "Same Stimulus" rule. You cannot just measure retinal input; you must model the processing pipeline.
  *   **The Trade-off:** To satisfy the Mediation Constraint, the theory must admit that **Attention is the boundary problem.** If the cognitive state changes *which* features are resolved (feature-based attention) without changing *how* they are processed, it is not penetration. If it changes the *gain* or *tuning* of the feature detectors themselves, it is.
  *   **Requirement:** The theory must define "perceptual processing" narrowly enough to exclude standard attentional selection, or broadly enough to admit that attention *is* the mechanism of penetration. (Most accounts fail because they want the epistemic worry of the latter while using the definition of the former).

  ---

  ### III. Head-On Issue 2: Levels of Penetration

  You asked whether sensory processing, content, phenomenal character, and judgment are one relation or several.

  **The Verdict:** They are **dissociable relations** that a theory must track separately. A theory treating them as one package will be refuted by cases of unconscious perception or blindsight-style dissociations.

  1.  **Sensory Processing Penetration:** Cognitive states alter neural weights in early vision (V1/V2).
  2.  **Content Penetration:** The proposition represented by the experience changes (e.g., representing an object as *threatening* rather than *metallic*).
  3.  **Phenomenal Penetration:** The "what-it-is-likeness" changes (e.g., the fear makes the grey look darker).
  4.  **Judgment Uptake:** The willingness to report the experience changes.

  **Why they must dissociate:**
  *   **Case:** *Unconscious Priming.* You can have Sensory Processing Penetration (faster reaction times, neural modulation) without Phenomenal Penetration (no change in conscious experience). If your theory requires Phenomenal Change, you rule out unconscious CP. If your theory only requires Processing Change, you risk including mere motor priming.
  *   **Case:** *Illusion without Belief.* You see the Müller-Lyer lines as different lengths (Phenomenal/Content) but believe they are the same (Judgment). If cognition penetrated perception, your belief should have fixed the experience. It didn't. This suggests Judgment and Phenomenology are distinct loci.

  **Desideratum:** An adequate account must specify *which* level is being penetrated. "Cognitive Penetration" is ambiguous unless it specifies: "Cognitive penetration of *phenomenal character* via *early sensory processing*."

  ---

  ### IV. Meta-Analysis of Requirements

  #### 1. Non-Negotiable vs. Camp Preference

  | Requirement | Classification | Reasoning |
  | :--- | :--- | :--- |
  | **Experiential Difference** | Non-Negotiable | If experience doesn't change, it's not perceptual penetration by definition. |
  | **Architectural Directness** | Non-Negotiable | Without this, CP collapses into "causation," losing its philosophical bite. |
  | **Dissociation of Levels** | Non-Negotiable | Empirical data (blindsight, priming) forces these apart. |
  | **Epistemic Downgrade** | **Camp Preference** | **Reasoning:** Siegel's camp requires that penetrated beliefs lose justification (circularity). Vance's camp argues that if the cognition is knowledge (expertise), the penetration is epistemically benign. Demanding downgrade excludes the "Radiologist" case from counting as *problematic* CP, even if it is *mechanistic* CP. |

  #### 2. Incompatible Pairs (Impossibility Results)

  **Pair:** **The "Directness" Requirement** AND **The "Predictive Processing" Framework.**
  *   **Conflict:** Predictive Processing (PP) posits that *all* perception is inference driven by top-down priors (cognition). If PP is true, there is no "encapsulated" bottom-up stream to be penetrated. Perception is *constitutively* cognitive.
  *   **Result:** If you adopt PP, the "Architectural Directness" requirement becomes impossible to satisfy because there is no architectural boundary to cross. You must either abandon the notion of CP (because it's ubiquitous) or redefine "cognition" to exclude "priors."
  *   **Flag:** A theory cannot simultaneously maintain a strict modular boundary (for Directness) and a holistic predictive architecture (for PP).

  #### 3. The Single Most Exclusionary Requirement

  **Requirement:** **The Attention Exclusion Clause (within Architectural Directness).**
  *   **Definition:** The theory must demonstrate that the cognitive influence did *not* operate solely by directing spatial or feature-based attention to information already available in the sensory array.
  *   **Why it excludes the most:** Almost every empirical candidate for CP (the gun/phone, the radiologist, the expert chess board) can be re-described as a case of **Expert Attention.** The radiologist isn't *seeing* differently; she is *looking* at different micro-features than the novice.
  *   **The Case that Makes it Bite:** **The Radiologist.**
      *   *Claim:* The tumor "pops out."
      *   *Rebuttal:* The radiologist has learned *where* to attend. The sensory processing of the pixels is identical to the novice; the selection mechanism is different.
      *   *Impact:* To prove CP, you must show that the *same* attended region is processed differently (e.g., contrast enhancement) solely due to belief. This is empirically incredibly difficult to isolate from attention. This requirement kills 90% of proposed cases.

  ### V. Brief Note on Frameworks

  *   **Encapsulation (Pylyshyn):** Satisfies the **Attention Exclusion** easily by positing a hard architectural firewall. However, it fails the **Experiential Difference** condition in almost all real-world cases, rendering CP theoretically possible but empirically null.
  *   **Predictive Processing (Hohwy/Clark):** Satisfies the **Causal Explanation** test effortlessly (top-down is standard). However, it collapses the **Architectural Directness** condition, making CP ubiquitous and thus potentially stripping it of its special epistemic worry (if all seeing is guessing, "penetration" is just "seeing").

  ### Summary for Seminar Use
  To break the stalemate, demand that the next proponent of a CP case specify:
  1.  Is the variance in **content** or **judgment**?
  2.  Is the causal mediator **attention** or **processing gain**?
  3.  Does their account survive the **Radiologist Objection** (expertise as attention vs. expertise as penetration)?

  If they cannot distinguish attention from processing gain, they have not met the **Architectural Directness** desideratum.
