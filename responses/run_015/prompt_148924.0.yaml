  3.  **Consistency:** Must not collapse into Bayesian updating upon observation in embedded contexts. Yet, it must permit bounded agents to approximate rational behavior. *Motivation:* Updating destroys updateless coordination; infinite compute renders the theory impractical.
  4.  **Logical-Indexical Coupling:** Must handle logical uncertainty about self-source code interacting with physical observations without standard conditioning. *Motivation:* Agents must coordinate with identical copies in causally isolated branches despite receiving only one sensory stream.

  **Critical Tension:** Preserving causal independence (Desideratum 2) while honoring logical correlation across copies (Desideratum 4) is jointly difficult. Demanding both risks inconsistency if the theory cannot distinguish physical causation from logical implication without updating on indexical facts. This suggests a potential impossibility result for bounded agents satisfying all conditions.

