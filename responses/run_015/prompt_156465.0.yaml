answer: |-
  1. There is no single established philosophical term that precisely captures this specific shift from questioning knowledge transmission to questioning emotional sincerity. While concepts like epistemic injustice or signaling theory touch on related issues, they miss the unique focus on performed awe within aesthetic discourse.
  2. We can coin this phenomenon as affective credentialism, where the validity of testimony depends on verifying the speaker's internal emotional state rather than their external expertise. This framing treats genuine feeling as the primary credential required to authorize an aesthetic judgment.
  3. The concept edges into social performance theory because it assumes observers are constantly scanning for mismatches between reported intensity and behavioral cues. It specifically targets the suspicion that cultural capital is being gained through fabricated emotional responses.
  4. This differs from general expert distrust because it does not challenge the critic's technical knowledge or historical context. Instead, it accepts their expertise but rejects their authority on the grounds that their personal reaction is a status-seeking fabrication.
  5. Ultimately, affective credentialism turns aesthetic dialogue into a lie detector test where the truth of the art matters less than the authenticity of the viewer. The burden of proof shifts from the object's quality to the subject's honesty.
