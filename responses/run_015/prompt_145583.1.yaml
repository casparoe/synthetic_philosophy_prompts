  # Seminar Plan: The Reprimand Protocol

  **Duration:** 90 Minutes
  **Participants:** 8–12 Advanced Undergraduates or Early Graduate Students
  **Facilitator:** 1
  **Objective:** To embody the structural collapse of collective blame when standing is treated as a binary purity condition.

  ## I. Materials and Preparation

  **Room Setup:**
  *   Chairs arranged in a tight circle.
  *   A central table or whiteboard visible to all (The "Ledger").
  *   Two bowls of tokens: Red (Tainted) and Green (Pure).
  *   A locked box or sealed envelope for ballots.

  **Handouts (Prepared in advance):**
  1.  **Case Card (1 copy for Facilitator):** A description of a serious, unambiguous transgression.
      *   *Example:* "Dr. A systematically removed the names of junior collaborators from three published papers over two years, claiming sole authorship. Evidence is conclusive. The department must decide whether to issue a formal public condemnation."
  2.  **Fault Cards (1 per participant):**
      *   **75% Tainted:** "Status: Tainted. You have previously committed a minor version of this fault (e.g., once failed to correct a misattribution)."
      *   **25% Pure:** "Status: Pure. You have no history of this fault."
      *   *Note:* Distribute these randomly as participants enter. Ensure the 75/25 split is exact.
  3.  **Ballots (1 per participant):** Simple slip with "SIGN" or "REFUSE."
  4.  **Private Worksheet (1 per participant):** For Phase 1.

  **Facilitator Note on Ethics:**
  The Fault Cards assign *game status*, not real-world guilt. Instruct participants that for the purpose of the simulation, the card defines their standing, regardless of their actual history. This prevents forced confession while preserving the structural dynamics.

  ---

  ## II. Procedure (60 Minutes)

  ### Phase 1: Silent Positioning (10 Minutes)
  1.  **Read the Case:** The Facilitator reads the Case Card aloud. No discussion is permitted.
  2.  **Private Judgment:** Participants complete the Private Worksheet.
      *   *Question 1:* Do you believe the transgression warrants collective condemnation? (Yes/No)
      *   *Question 2:* If a vote were held today, would you sign the statement? (Yes/No)
  3.  **Collection:** Collect worksheets without looking at them.
      *   *Facilitator Script:* "Keep your answers to yourself. We are establishing a baseline of private judgment before public standing is considered."

  ### Phase 2: Structured Disclosure and Discussion (25 Minutes)
  1.  **The Rule:** Participants sit in the circle. Each person may speak once, for or against the statement.
      *   **If speaking AGAINST:** You say nothing about your status. You place **no token**.
      *   **If speaking FOR:** You must declare your status before speaking.
          *   "I am Tainted." -> Place a **Red Token** on the Ledger.
          *   "I am Pure." -> Place a **Green Token** on the Ledger.
      *   **Constraint:** You may not explain *why* you are tainted or pure. Only the status is declared.
  2.  **The Flow:** Go around the circle. Allow 1–2 minutes per person.
  3.  **Observation:** The Facilitator tracks the visible count of Red vs. Green tokens in real-time.
      *   *Expected Dynamic:* As Red tokens accumulate, subsequent speakers may hesitate to add Green tokens (fear of futility) or may switch to opposing/silence to avoid association with a compromised process.
  4.  **Closing Phase 2:** "Discussion is closed. The Ledger is set."

  ### Phase 3: Vote and Payoff (15 Minutes)
  1.  **The Incentive:** Announce the collective reward.
      *   *Script:* "If at least 75% of the group casts a *valid* signature, the group chooses the next seminar topic and receives a shared snack. If the threshold is not met, the Facilitator chooses the topic and there is no snack."
  2.  **The Vote:** Distribute ballots. Participants mark SIGN or REFUSE secretly. Deposit in the box.
  3.  **The Reveal:**
      *   Count the raw SIGN votes aloud. (Likely high).
      *   Ask participants to place their Fault Cards face-up on the table.
      *   **Apply the Purity Filter:** "To count toward the 75% threshold, a vote must meet three criteria: You voted SIGN, You placed a Green Token in Phase 2, and You hold a Pure Card."
      *   *Correction for Game Logic:* To ensure the collapse happens as designed, the rule is: **Only Pure Cardholders who voted SIGN count.** (The Token in Phase 2 was the public commitment; the Card is the verification).
      *   *Calculation:* Count the Pure Cards that voted SIGN. Compare to total group size.
  4.  **The Outcome:** In a standard distribution (25% Pure), the maximum possible score is 25%. The threshold is 75%. The group will fail.
      *   *Script:* "The raw support was [X]%. The valid support is [Y]%. The threshold was 75%. The reward is lost."

  ---

  ## III. Debrief (30 Minutes)

  **Facilitator Goal:** Do not lecture. Guide the participants to articulate the structural problem they just experienced. Use their frustration or confusion as data.

  ### 1. Mapping the Experience (10 Minutes)
  Ask the group to identify specific moments where the dynamic shifted. Map these to the conceptual framework.

  *   **Moment 1: Silent Writing.**
      *   *Ask:* "In Phase 1, did anyone hesitate to condemn the transgression?"
      *   *Concept:* **Private Judgment vs. Public Standing.** Initially, blame feels like an individual credential. Everyone assumes the *capacity* to blame resides within them.
  *   **Moment 2: The First Red Token.**
      *   *Ask:* "How did the room feel when the first Red Token was placed? Did it change how you planned to speak?"
      *   *Concept:* **Contagion.** Hypocrisy is not just individual; it signals a environmental condition. One admission of taint lowers the perceived value of subsequent support.
  *   **Moment 3: Token Accumulation.**
      *   *Ask:* "For those holding Green cards, did seeing many Red tokens make you less willing to place a Green one?"
      *   *Concept:* **Standing as a Distributed Resource.** Your standing depends on the group's status. If the group is compromised, your pure standing feels insufficient to carry the collective weight.
  *   **Moment 4: The Reveal.**
      *   *Ask:* "Look at the math. Even if everyone wanted to sign, could we have won?"
      *   *Concept:* **The Purity Condition Collapse.** A strict binary filter (Pure/Tainted) in a non-ideal world (where most are Tainted) makes collective judgment mathematically impossible.

  ### 2. Handling Predicted Failures (10 Minutes)
  Anticipate objections and use them to deepen the conceptual point.

  *   **Objection A: "Degrees of Fault Matter."**
      *   *Participant:* "My fault was tiny. Theirs was huge. Why does the card treat them the same?"
      *   *Facilitator Response:* "In the game, the rule was binary. In reality, could we have drawn a line mid-game? Where? Who decides?"
      *   *Concept:* **The Arbitrariness of Bright Lines.** To function, groups often need clear rules. But moral life is graded. Enforcing a bright line creates the collapse we just saw. Ignoring the line feels inconsistent. This is the tension of *non-ideal theory*.
  *   **Objection B: "Private vs. Public Distinction."**
      *   *Participant:* "I voted SIGN but didn't place a token. I still believe they are wrong."
      *   *Facilitator Response:* "Exactly. You separated your *judgment* (the act is wrong) from your *standing* (I cannot lead the condemnation). The game forced these apart."
      *   *Concept:* **The Function of Standing.** Standing isn't about truth; it's about authority. The game shows that private truth survives even when public authority collapses.

  ### 3. Limitations and Real-World Application (10 Minutes)
  Be frank about what the simulation froze out. This prevents students from rejecting the lesson as "just a game."

  *   **Limitation 1: Static Taint.**
      *   *Script:* "In the game, once Tainted, always Tainted. You could not apologize or repair your status."
      *   *Concept:* **Diachronic Standing.** In real communities, standing is dynamic. Apology, restitution, and time can restore standing. The game removed this to show the *baseline* structural risk.
  *   **Limitation 2: Single-Round.**
      *   *Script:* "This was one vote. Real communities interact over years."
      *   *Concept:* **Reputational Dynamics.** Long-term trust allows groups to tolerate minor hypocrisy because of past reliability. The game isolated the variable of *current fault* to show its immediate cost.
  *   **Limitation 3: The Binary.**
      *   *Script:* "We treated blame as a single public token."
      *   *Concept:* **Nuanced Sanction.** Real communities have private rebuke, quiet corrections, and informal norms that survive even when formal public condemnation fails. The game showed why formal mechanisms are more fragile than informal ones.

  **Closing Statement:**
  "We experienced a failure of collective capacity. The transgression remained wrong. Our private judgments remained intact. But our *capacity to act together* was disabled by the distribution of our own imperfections. The philosophical question for next week is not whether hypocrisy is bad—it is—but whether a community can survive if it treats hypocrisy as a total disqualifier."

  ---

  ## IV. Facilitator Checklist & Troubleshooting

  | Potential Issue | Facilitator Action |
  | :--- | :--- |
  | **Participants refuse to accept Fault Cards.** | Remind them: "This is a simulation of status, not a confession of sin. Play the hand you are dealt to test the system." |
  | **Phase 2 stalls (Silence).** | If no one speaks, prompt: "The protocol requires us to test the capacity to speak. Who is willing to test the first token?" |
  | **Participants try to negotiate rules mid-game.** | Hold the line: "The rules are fixed to demonstrate the structural constraint. Note your objection for the debrief." |
  | **Group becomes hostile about losing the snack.** | Use it: "Notice the frustration. That is the cost of the purity condition. It feels unfair because it disables agency." |
  | **Debrief drifts into specific philosophers.** | Gently redirect: "Let's stick to the mechanics of what we just did. What does *this* dynamic tell us about blame, regardless of who wrote about it?" |

  ## V. Conceptual Glossary (For Facilitator Use Only)
  *Use these terms during the debrief to name the experiences, but do not distribute this list.*

  *   **Standing:** The authority or right to issue blame.
  *   **Purity Condition:** The rule that one must be free of the fault to blame it.
  *   **Collective Action Problem:** A situation where individual rationality (withholding support to avoid hypocrisy) leads to group failure (no condemnation issued).
  *   **Distributed Resource:** The idea that standing belongs to the group's health, not just the individual's record.
  *   **Diachronic:** Occurring over time (used to explain how real standing is repaired, unlike in the game).
