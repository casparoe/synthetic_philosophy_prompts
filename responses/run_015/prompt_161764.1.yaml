answer: |-
  **Grade: 8/20**

  **Marginal Comments**

  **Part [1]**

  *   *"The Principal Principle says C(A | ch(A) = x and E) = x, where E is admissible evidence."*
      *   **Correct.** This captures the core formula accurately. (Full credit for definition).
  *   *"Admissible evidence is evidence that bears on A only by way of what it tells you about the chances — as opposed to evidence about how A actually turns out."*
      *   **Correct.** This is the standard intuition for admissibility. (Full credit for explanation).
  *   *"The clearest example of inadmissible information is the outcome itself, or a crystal ball report of the outcome, and the clause is needed because if we allowed E = A we would get C(A | ch(A) = 0.7 and A) = 1, which contradicts the 0.7 the principle asks for, so without the restriction the principle is inconsistent."*
      *   **Correct.** You have correctly identified the trivialization problem that motivates the clause. (Full credit for example and justification).
  *   *"One thing worth noting is that chances don't change over time: the chance of a given outcome is a fixed feature of the setup, which is what makes it objective rather than merely a feature of somebody's evidence."*
      *   **Incorrect.** Chances *do* change over time (e.g., the chance of rain changes as the storm approaches; the chance of a radioactive atom decaying changes as time passes). Objectivity does not require timelessness. **(Deduct 0.5 marks)**.
  *   *"The little t subscript in ch_t(A) is just there to keep track of which chance we happen to be talking about, not to say that the chance is relative to a time, so in practice it can be dropped."*
      *   **Incorrect.** This contradicts the course notes and standard theory. The subscript $t$ is essential because the chance function is time-relative. Dropping it leads to errors in cases where evidence accumulates over time. **(Deduct 0.5 marks)**.
      *   **Part [1] Subtotal: 5/6**

  **Part [2]**

  *   *"Here you should defer to the chance: your credence in heads should be the objective chance of heads, since the chance is the fact about the world that you are trying to track, and it doesn't matter whether you know what it is — the chance is what it is regardless of your uncertainty."*
      *   **Misleading.** While you should defer to the chance, your uncertainty *about* what the chance is matters. You cannot defer to a specific number if you do not know which number is the true chance.
  *   *"Your evidence leans toward the coin having a 0.9 chance rather than a 0.3 chance, so 0.9 is the chance to defer to, and your credence in heads should be 0.9."*
      *   **Incorrect.** This ignores your uncertainty. When you are unsure about the chance, you must calculate the *expected* chance. The correct credence is $(0.6 \times 0.9) + (0.4 \times 0.3) = 0.66$. Picking the most likely chance is a conceptual error. **(Deduct 4 marks)**.
  *   *"If a perfectly reliable source then tells you that the coin landed heads, your credence should go to about 1."*
      *   **Correct.** Conditionalizing on reliable testimony of the outcome overrides the chance. (Full credit).
  *   *"That doesn't conflict with the Principal Principle, because that testimony is inadmissible: it tells you how A turned out rather than anything about the chances, so the principle has no say about that update and you simply conditionalize on the testimony in the ordinary way."*
      *   **Correct.** You have correctly identified future-outcome information as inadmissible and noted that PP does not govern updates on inadmissible evidence. (Full credit).
  *   *"Nor is the principle telling you to throw away evidence you already have — it constrains the credence you'd have given the chance plus admissible evidence, and everything else goes in by conditionalization."*
      *   **Correct.** Good summary of how PP interacts with conditionalization.
      *   **Part [2] Subtotal: 2/8**

  **Part [3]**

  *   *"The Principal Principle is basically a rule for changing your mind: when you learn that the chance of A is x, you set your credence in A to x."*
      *   **Imprecise.** PP is better understood as a constraint on rational credence functions (a synchronic norm) rather than merely a diachronic updating rule, though it implies one. **(Deduct 1 mark)**.
  *   *"The Expected Chance Principle is a different and weaker rule of thumb, and it isn't really connected to the Principal Principle, which tells you to match the chance rather than to average over your guesses about what the chance might be."*
      *   **Incorrect.** They are mathematically connected. The Expected Chance Principle is a direct consequence of the Principal Principle combined with the theorem of total probability. If PP holds for all $x$, ECP must hold. **(Deduct 2 marks)**.
  *   *"So no, the Principal Principle isn't a special case of it."*
      *   **Incorrect.** If you treat the ECP as the general rule for uncertainty about chances, the PP result (where you are certain of the chance) is indeed the degenerate/special case where the probability of one chance hypothesis is 1. **(Deduct 1 mark)**.
  *   *"What the Expected Chance Principle does capture is the degenerate situation in which you have no evidence at all about the chance, where there's nothing to defer to and averaging is the best you can do."*
      *   **Incorrect.** ECP applies whenever you have *uncertainty* about the chance, not just when you have *no* evidence. You apply it precisely because you are deferring to the chance hypotheses you do have evidence for. **(Deduct 1 mark)**.
      *   **Part [3] Subtotal: 1/6**

  **Total: 8/20**

  **Summary Feedback for the Student**
  You have a strong grasp of the definition of the Principal Principle and, crucially, you understand the role of admissibility (Part 1 and the second half of Part 2). Your explanation of why future outcomes are inadmissible is excellent.

  However, there are two major conceptual errors that cost significant marks:
  1.  **Uncertainty about Chances:** In Part 2, you treated uncertainty about the chance as if you should simply pick the most likely chance value. In Bayesian frameworks, when you are unsure about a parameter (the chance), you must average over your hypotheses weighted by their probability (the Expected Chance Principle).
  2.  **Relationship between PP and ECP:** In Part 3, you claimed the principles aren't connected. They are tightly linked; the ECP is derived from the PP using total probability. You need to review the derivation showing how $C(A) = \sum C(ch(A)=x) \cdot C(A | ch(A)=x)$ simplifies to the Expected Chance Principle given the PP.

  Finally, be careful with the metaphysics of chance: chances are typically time-relative ($ch_t$), so do not claim they are fixed features that never change.
