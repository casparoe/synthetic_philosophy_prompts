  *(Self-Correction on Word Count)*: I need to be careful not to write too little. I should expand on *why* the peer-grading insight matters. It's about "instrumental convergence" vs "human values" but I can't use those terms. I need to explain it as "having a life outside the grade."

  *(Self-Correction on Case 3)*: Case 3 in AI is like a model manipulating its operators. In school, it's rare but exists (student evaluations, parents complaining). I should note that distinction.

  *(Self-Correction on Wireheading)*: Case 4 is definitely wireheading. Case 1 is specification gaming. Case 2 is adversarial attack/security failure.

