answer: |-
  ### Agreed claims

  1. The correlation between national gender-equality indexes and gendered study choices is real in specific datasets but fragile; it vanishes when controlling for economic development or changing country samples. It is shakier than popular discourse suggests. Replication attempts show mixed results depending on which equality metric is used.
  2. Both sides distinguish between the *relative gap* (ratio of men to women) and *absolute levels* (total women in engineering). Egalitarian countries may show a wider relative gap while maintaining or increasing absolute numbers of women in STEM. This distinction is critical for policy evaluation.
  3. Economic security reduces survival-driven career choices for everyone. When basic needs are met, career selection becomes less about income stability and more about other factors, whether those are inherent interests or culturally shaped pursuits.
  4. Measurement matters. Indices measuring legal rights differ from indices measuring cultural attitudes, and these do not always move together. High welfare spending often conflates with high equality scores.
  5. No single factor explains all variance; both institutional structures and individual preferences play roles, though their weighting is disputed. We agree current data cannot definitively isolate causality without natural experiments. We acknowledge that publication bias may exaggerate the paradox's prominence in literature.

  ### Where they still differ

  | Disagreement | Culture/Structure Side | Predisposition Side |
  | :--- | :--- | :--- |
  | **Core Mechanism** | Gendered choices are responses to external constraints. When institutions remove barriers (e.g., childcare costs), choices change to reflect true equal opportunity. The paradox is an artifact of measuring wealth as equality. | Gendered choices reflect internal preferences. When survival pressure lifts, innate differences in interest are free to express themselves. The paradox reveals biology/psychology unmasked by prosperity. |
  | **Policy Shock Response** | If childcare subsidies double overnight, enrollment shifts immediately across all age cohorts. Constraints are lifted now, so behavior changes now. Existing students switch tracks; adults retrain. | If childcare subsidies double, shifts occur slowly over new cohorts. Socialization takes time; preferences emerge over generations, not quarters. Current adults remain locked in prior patterns. |
  | **Equality Index Meaning** | The index measures welfare state capacity, not gender norms. Rich countries look egalitarian because they can afford safety nets, not because norms changed. It's a confound, not a cause. | The index measures freedom from survival pressure. Rich countries look egalitarian because citizens can afford to follow preferences rather than paychecks. It's the enabling condition. |

  ### Cruxes and predictions

  We identify two decisive tests to resolve the causal direction. First, the Time-Course of a Policy Shock. Imagine a country suddenly mandates paid parental leave for both parents and subsidizes childcare by 50% within one fiscal year. This isolates institutional constraints from cultural drift.

  *   **Culture Side Prediction:** Within 12 months, university enrollment ratios shift significantly. Women return to STEM fields immediately because the logistical barrier (childcare cost) is removed. The change is visible across all age groups simultaneously because the constraint was external.
  *   **Predisposition Side Prediction:** No immediate shift in enrollment among existing adults. Changes appear only in younger cohorts over 5-10 years as socialization adjusts. The relative gap remains stable or widens even as absolute numbers slowly rise, because preferences are stable.

  Second, the Absolute vs. Relative Metric.

  *   **Culture Side Prediction:** Absolute numbers of women in engineering must rise as equality indexes rise. If the gap widens but absolute numbers fall, the structure is failing women.
  *   **Predisposition Side Prediction:** The relative gap widens regardless of absolute numbers. Even if more women enter engineering, men enter at a faster rate when free to choose. Absolute gains do not invalidate the gap widening.

  Both sides agree to track both metrics. If the shock produces immediate cohort-wide shifts, the Culture model wins. If changes are generational and the relative gap widens despite high absolute participation, the Predisposition model gains credibility. We commit to preregistering these thresholds before data collection to prevent moving goalposts. Each side puts reputational weight on these specific timelines.

  ### Just words

  Much debate hinges on definitions. When the Predisposition side says "preference," the Culture side hears "socialized habit." If a woman chooses nursing for flexible hours, is that a preference or a response to a structure built around gendered caregiving? Similarly, "equality" is ambiguous. Does it mean equal opportunity (legal rights) or equal outcome (50/50 splits)? The Culture side argues you cannot measure preference until opportunity is truly equal. The Predisposition side argues you cannot measure opportunity until you account for differing preferences. This circularity is verbal, not empirical. We will define preference as stated choice under identical constraints to bypass this.

  ### Settled versus contested

  **Settled:** The correlation exists in some data but is not universal. Wealth correlates with equality indexes. Absolute vs. relative metrics must be distinguished. Researchers agree that survival pressure constrains choice for both sexes.

  **Contested:** Causality (does equality cause the gap, or does wealth cause both?). The interpretation of the policy shock results. Whether the pattern is robust across different measures of "equality."

  **Flagging Contested Claims:** My claim in Section 1 that the pattern is "shakier than popular discourse suggests" is contested by researchers who find robust replication in specific subsets of data. My claim in Section 3 that a policy shock *can* isolate these variables is contested by economists who argue culture and policy are too entangled to separate cleanly. These are open fights, not consensus.
