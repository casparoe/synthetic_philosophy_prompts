prompt: |-
  I run the clinical ethics consultation service at a mid-size hospital — about forty consults a year, one hour-long case conference each, and the attending physician plus a three-person committee has to sign off at the end. Our accreditation body has started requiring that every consult close with a one-sentence "articulable rationale" that could be applied to future cases, and that's exactly the thing I'm not sure is always available.

  I've been reading up on moral particularism versus generalism and the holism of reasons — the thought that a feature counting in favour of an action here might count against it, or count for nothing, somewhere else. Turn that into a procedure my committee can actually run inside an hour: the questions in the order we should ask them, a real test for whether a feature is doing work in this case or just travelling along with it, and a way of dealing with the fact that we keep a register of past consults (I pair each new case with its closest near-miss from the register, and we routinely can't agree whether the difference between the two is a reason or just noise).

  It has to say where it stops with no answer, which steps are judgment calls dressed up as steps, and what we write on the form when the honest answer is that there is no generalizable rationale — I'd rather flag that than invent one. It also has to tell me which parts of the theory I can drop in translating it to a one-hour meeting and which I can't drop without the whole thing collapsing into a plain checklist.

  Then run it on three of our cases: a family insisting on continued ICU treatment the team calls futile; a case that is the near-identical twin of one we decided last year except the patient has no family at the bedside; and a patient with a history of violence toward staff, where everyone in the room is sure it matters but nobody can say whether it's a reason or a biasing factor. Include at least one where the procedure lands somewhere I won't like, and say plainly what the procedure can't do for us.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analyses:

  1.  **Analyze the Request:**
      *   **User:** Clinical Ethics Consultation Service lead at a mid-size hospital (40 consults/year, 1-hour conferences, 4 signatories).
      *   **Problem:** Accreditation body requires a one-sentence "articulable rationale" (generalizable principle) for every consult. User suspects this isn't always possible due to moral particularism/holism of reasons.
      *   **Task:** Create a procedure for the committee to run *within one hour* that incorporates insights from moral particularism/generalism and holism of reasons.
      *   **Requirements:**
          *   Ordered questions/steps.
          *   Test for whether a feature is "doing work" vs. "travelling along."
          *   Method for using the register of past consults (comparing near-misses).
          *   Explicitly state where it stops with no answer.
          *   Identify which steps are judgment calls disguised as steps.
          *   Provide a fallback for when there is *no* generalizable rationale (honest flagging).
          *   Distinguish essential theory vs. expendable theory for a 1-hour meeting.
          *   **Application:** Run the procedure on three specific cases (Futile ICU, Twin Case w/ No Family, Violent Patient).
          *   **Constraint:** Include at least one outcome the user won't like.
          *   **Constraint:** State plainly what the procedure *can't* do.

  2.  **Theoretical Grounding:**
      *   *Moral Generalism:* There are invariant moral principles (e.g., "Always respect autonomy").
      *   *Moral Particularism:* Moral reasons are context-dependent; a feature can be a reason in one case and not in another (holism of reasons).
      *   *The Tension:* Accreditation wants Generalism (one-sentence rationale). Reality often leans Particularist.
      *   *The Solution:* A "Principled Particularism" or "Defeasible Generalism" approach. We aim for a principle, but test its stability. If it fails stability, we admit it.

  3.  **Drafting the Procedure (The "Holistic Rationale Protocol"):**
      *   *Time Limit:* 60 minutes. Needs to be tight.
      *   *Structure:*
          1.  Fact/Feature Mapping (10 mins).
          2.  The "Switch" Test (Holism Check) (15 mins).
          3.  The "Twin" Test (Register Comparison) (15 mins).
          4.  Drafting the Rationale (10 mins).
          5.  The "Stop" Condition (10 mins).
      *   *Key Concept:* Distinguishing *enablers/disablers* from *intensifiers/attenuators* (Jonathan Dancy's terminology is useful here but needs simplification). Let's call it the "Valence Test."
      *   *The Register:* Use the "Near-Miss" method the user mentioned.
      *   *The "No Answer" Option:* Needs a specific code or phrasing on the form.

  4.  **Refining the Steps (Iterative Process):**
      *   *Step 1:* Don't just list facts. List *morally salient* features.
      *   *Step 2:* The "Switch" Test. If we change this feature, does the recommendation flip? If yes, it's a reason. If no, it's noise. *Correction:* Particularism says it might flip in *another* case, not just this one. So the question is: "Does this feature *always* count in this direction?"
      *   *Step 3:* The Register. Compare Case A (current) with Case B (past). If the recommendation differs, what feature explains it? If you can't name the feature, it's intuition, not rationale.
      *   *Step 4:* Drafting. If the principle holds, write it. If it doesn't, write the "Particularist Flag."
      *   *Theory to Drop:* Deep meta-ethical debates about ontology of reasons.
      *   *Theory to Keep:* Holism of reasons (valence can change), Defeasibility (principles have exceptions).

  5.  **Developing the Three Cases:**
      *   *Case 1: Futile ICU.* Standard conflict. Family wants more, team says stop.
          *   *Expected Outcome:* Usually, we find a principle like "Beneficence limits autonomy."
          *   *Twist:* Maybe the procedure reveals the "futility" claim is masking a resource allocation issue, making the rationale unstable.
      *   *Case 2: The Twin (No Family).* Identical to last year's case, but no surrogate.
          *   *Expected Outcome:* Should be the same decision.
          *   *Problem:* If the procedure says "We can't generalize because the *presence of family* was the actual reason last time, not the medical facts," that's uncomfortable. It exposes that the previous rationale was a sham.
      *   *Case 3: Violent Patient.* Staff safety vs. Care.
          *   *Expected Outcome:* Hard to generalize. Is violence a reason to limit care or a bias?
          *   *Disliked Outcome:* The procedure forces us to admit we are punishing the patient, or conversely, that we are endangering staff without a clear principle. Let's make it so the procedure concludes we *cannot* write a generalizable rationale without lying.

  6.  **Addressing the Constraints:**
      *   *One Hour:* The steps must be timed.
      *   *Judgment Calls:* Acknowledge that identifying "salient features" is subjective.
      *   *What it Can't Do:* It can't force consensus where none exists. It can't turn a particularist judgment into a generalist rule without loss of truth.

  7.  **Writing the Response:**
      *   *Tone:* Professional, direct, clinically grounded, philosophically rigorous but accessible.
      *   *Structure:*
          1.  Introduction (Acknowledging the tension).
          2.  The Protocol (Step-by-step).
          3.  Theory Triage (What to keep/drop).
          4.  The "No Rationale" Clause.
          5.  Case Applications.
          6.  Limitations (What it can't do).

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is the "Switch Test" too abstract for a busy committee?
      *   *Fix:* Make it concrete. "Imagine this feature was absent. Would we decide differently?"
      *   *Critique:* The user wants to know where the procedure lands they won't like.
      *   *Fix:* In Case 2 (The Twin), the procedure might reveal that the previous year's decision was actually based on the *family's distress*, not the patient's best interest, meaning the current case (no family) requires a *different* decision, contradicting the desire for consistency. Or, it reveals we can't articulate *why* they are different. Let's go with: The procedure reveals the previous rationale was false, and we must make a different decision now, exposing inconsistency.
      *   *Critique:* Make sure the "One Sentence" requirement is addressed.
      *   *Fix:* Provide the specific syntax for the sentence, including the "Exception Clause."

  9.  **Final Polish:** Check against all prompt requirements.
      *   Procedure order? Yes.
      *   Test for feature work? Yes (Valence/Switch Test).
      *   Register use? Yes (Twin Test).
      *   Stop condition? Yes.
      *   Judgment calls identified? Yes.
      *   Theory drop/keep? Yes.
      *   Three cases run? Yes.
      *   One disliked outcome? Yes (Case 2).
      *   What it can't do? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  This is a structural problem disguised as a documentation problem. Your accreditation body wants moral generalism (invariant principles); your experience suggests moral particularism (context-dependent reasons). If you force generalism onto particularist realities, you produce bureaucratic fiction. If you embrace particularism without guardrails, you produce unaccountable intuition.

  Here is a procedure designed to navigate that tension within a sixty-minute window. It is based on a "Defeasible Generalism" model. It assumes principles exist but are fragile.

  ### The Holistic Rationale Protocol (HRP)

  **Time Allocation:** 60 Minutes
  **Participants:** Attending + 3 Committee Members
  **Materials:** Current Case Sheet, Register of Past Consults (searchable), HRP Worksheet.

  #### Phase 1: Feature Mapping (10 Minutes)
  Do not list medical facts. List *morally salient features*.
  *   **Action:** Each member writes down the top 3 features driving their intuition (e.g., "Patient's prior violence," "Family's religious distress," "Low probability of recovery").
  *   **Output:** A consolidated list of 4–6 salient features.
  *   **The Judgment Call:** Deciding what counts as "morally salient" is subjective. This is where bias enters. *Mitigation:* If a feature is listed by only one person, it must be defended before moving to Phase 2.

  #### Phase 2: The Valence Test (15 Minutes)
  This tests the *Holism of Reasons*. A feature might count *for* an action here but *against* it elsewhere.
  *   **Question:** "For each salient feature, does it count in the same direction in *every* possible context, or only in this one?"
  *   **The Switch:** Take a feature (e.g., "Family insists on treatment"). Ask: "If the family insisted on treatment in a case where recovery was *highly likely*, would this feature still count *against* the treatment?"
      *   If **Yes**: It is a **Invariant Reason** (safe to generalize).
      *   If **No**: It is a **Contextual Reason** (unsafe to generalize without qualifiers).
  *   **Output:** Tag each feature as *Invariant* or *Contextual*.

  #### Phase 3: The Twin Test (Register Comparison) (20 Minutes)
  This uses your register to stress-test the rationale.
  *   **Action:** Pull the "near-miss" case from the register (the one you usually compare against).
  *   **Question:** "We decided $X$ in the Twin Case. We are deciding $Y$ in this case. What is the *single feature difference* that justifies the different outcome?"
  *   **The Noise Filter:** If you cannot agree on the specific feature difference, or if the feature difference failed the Valence Test (Phase 2), the rationale is unstable.
  *   **Output:** A confirmed "Differentiating Feature" OR a "Rationale Failure."

  #### Phase 4: Drafting the Rationale (10 Minutes)
  You must produce the one-sentence articulation. There are two permissible formats.

  *   **Format A (Generalizable):** "In cases where [Invariant Feature] is present, [Action] is mandated/forbidden because [Principle]."
  *   **Format B (The Particularist Flag):** "This decision rests on the specific convergence of [Feature A] and [Feature B]; no general rule is asserted because [Feature A] may not count in favor of [Action] in other contexts."
      *   *Note:* Format B satisfies the "articulable rationale" requirement by articulating *why* a general rule cannot be made. It is honest metadata.

  #### Phase 5: The Stop Condition (5 Minutes)
  *   **Rule:** If the committee cannot agree on the "Differentiating Feature" in Phase 3, or if the Valence Test shows all features are Contextual, you **must** use Format B.
  *   **Constraint:** Do not invent an Invariant Reason to satisfy accreditation. Using Format B is compliant; lying is not.

  ---

  ### Theory Triage: What to Keep and What to Drop

  To make this fit in one hour, you must strip the philosophy down to its load-bearing walls.

  **Drop These (Expendable):**
  *   **Ontological Debates:** Do not discuss whether moral properties *exist*. It doesn't matter for the form.
  *   **Ideal Observers:** Do not ask "What would a perfectly rational agent do?" Ask "What can we defend to the board?"
  *   **Principlism Taxonomy:** Do not waste time categorizing reasons into "Autonomy vs. Beneficence." That is often just labeling, not reasoning. Focus on the *features* (e.g., "pain," "cost," "risk"), not the labels.

  **Keep These (Essential):**
  *   **Holism of Reasons:** You cannot drop the idea that a reason's force depends on the context. If you drop this, Phase 2 collapses, and you return to a checklist that yields false generalizations.
  *   **Defeasibility:** You must keep the notion that a rule holds *unless* defeated by a specific context. This allows Format A to exist without being a lie.
  *   **The Register as Precedent:** You cannot drop the comparison to past cases. Without it, you have no empirical check on whether your "principle" is actually consistent.

  ---

  ### Case Applications

  Here is the protocol run on your three scenarios.

  #### Case 1: The "Futile" ICU
  *   **Facts:** 82yo, multi-organ failure. Team says treatment non-beneficial. Family demands "everything" based on religious hope.
  *   **Phase 1 (Features):** 1. Low probability of recovery. 2. Family religious distress. 3. Resource intensity.
  *   **Phase 2 (Valence):**
      *   *Low probability:* Invariant? Yes. (Always counts against aggressive intervention).
      *   *Religious distress:* Invariant? No. (In a palliative case, it counts for accommodation. In a futile case, it counts less). Tag: **Contextual**.
      *   *Resource intensity:* Invariant? No. (Usually irrelevant in individual ethics, counts in disaster triage). Tag: **Contextual**.
  *   **Phase 3 (Twin Test):** Compare to Case #104 (similar medical profile, family agreed to DNR). Difference: Family disagreement.
  *   **Phase 4 (Drafting):**
      *   *Attempt:* "Treatment may be withheld when medically futile regardless of family objection."
      *   *Valence Check:* Does "family objection" *always* count for less than "futility"? In pediatrics? Maybe not.
      *   *Result:* **Format A (Qualified).**
      *   *Sentence:* "In adult cases where physiological futility is established by consensus, the obligation to prevent harm overrides surrogate demands for non-beneficial intervention."
  *   **Verdict:** Stable. The feature "physiological futility" passes the Valence Test as a strong defeater of autonomy claims in this context.

  #### Case 2: The Identical Twin (No Family)
  *   **Facts:** Clinically identical to Case #392 from last year (same prognosis, same intervention).
      *   *Case #392:* Patient had a vocal family. Committee recommended *continuing* treatment for 2 weeks to allow family adjustment.
      *   *Current Case:* Patient has no family. Team wants to stop *now*.
  *   **Phase 1 (Features):** 1. Medical prognosis. 2. Presence of family. 3. Staff emotional burden.
  *   **Phase 2 (Valence):**
      *   *Medical prognosis:* Invariant.
      *   *Presence of family:* Contextual. (Sometimes family presence demands *more* care, sometimes *less*).
  *   **Phase 3 (Twin Test):**
      *   *Comparison:* Case #392 vs. Current.
      *   *Decision:* Last year = Continue 2 weeks. This year = Stop now.
      *   *Differentiating Feature:* "Presence of family."
      *   *The Hard Question:* "Did we continue treatment last year for the *patient's* benefit, or for the *family's* benefit?"
      *   *Committee Consensus:* "For the family's benefit."
      *   *The Conflict:* If the treatment was medically non-beneficial (as implied by the desire to stop now), continuing it last year was technically a deviation from the patient's best interest to serve the family's psychological needs.
      *   *Valence Check:* Is "Family Psychological Needs" an Invariant Reason to provide non-beneficial treatment? **No.**
  *   **Phase 4 (Drafting):**
      *   *The Disliked Outcome:* You cannot write a general rule that says "Continue non-beneficial treatment for families" (unethical) nor "Stop immediately if no family" (discriminatory).
      *   *Sentence (Format B):* "This decision to withdraw immediately reflects the absence of surrogates requiring a grieving process; no general rule is asserted regarding the duration of non-beneficial care for surrogate support."
  *   **Verdict:** **Uncomfortable.** This admits that Case #392 was an exception based on compassion, not principle. It exposes that your service treated two clinically identical patients differently based on a feature (family) that *should not* determine medical necessity. The accreditation body might accept the sentence, but it flags an inconsistency in your service's moral history.

  #### Case 3: The Violent Patient
  *   **Facts:** Patient with history of assaulting staff. Needs a procedure. Staff refuse to enter room without restraints/sedation. Patient currently calm.
  *   **Phase 1 (Features):** 1. History of violence. 2. Current calm state. 3. Staff safety. 4. Patient autonomy/dignity.
  *   **Phase 2 (Valence):**
      *   *History of violence:* Contextual. (In a prison context, counts for restriction. In a therapeutic context, counts for caution, not necessarily restriction).
      *   *Staff safety:* Invariant? (Generally yes, but degree matters).
  *   **Phase 3 (Twin Test):** Compare to Case #211 (Intoxicated patient, aggressive). Decision there was "Sedate for safety."
      *   *Difference:* Current patient is *currently calm*.
      *   *Conflict:* Committee agrees history matters, but cannot agree *how*. Is it a reason to preemptively restrain? Or just to have security present?
      *   *Valence Failure:* Half the committee says "History counts as current risk." Half says "History counts as bias unless behavior is current."
  *   **Phase 4 (Drafting):**
      *   *Attempt:* "History of violence justifies preemptive restriction."
      *   *Valence Check:* Fails. (Would we do this for a non-violent patient who looked scary? No. Would we do it for a violent patient who is comatose? Yes.)
      *   *Attempt:* "Staff safety overrides patient dignity."
      *   *Valence Check:* Too broad. (Overrides it how? Completely? Partially?)
      *   *Result:* **Format B (The Particularist Flag).**
      *   *Sentence:* "Preemptive restraint is authorized here due to the specific convergence of past violence and high-risk procedure; history of violence alone is not asserted as a generalizable reason for restriction."
  *   **Verdict:** **Honest but Weak.** This protects the committee from setting a precedent that stigmatizes patients with psychiatric histories. It admits this is a specific risk calculation, not a moral rule.

  ---

  ### What This Procedure Cannot Do

  You asked for plain speech on the limitations.

  1.  **It Cannot Force Consensus:** If your committee is fundamentally divided on whether "staff safety" is a moral reason or a pragmatic constraint, Phase 2 will stall. The procedure exposes the disagreement; it does not resolve it.
  2.  **It Cannot Fix Bad History:** As seen in Case 2, if your past consults were inconsistent (deciding based on intuition rather than principle), this protocol will expose that inconsistency rather than smoothing it over. It forces you to admit when a past decision was a "one-off" act of mercy rather than a rule.
  3.  **It Cannot Satisfy a Generalist Accreditor Completely:** If the accreditation body rejects Format B (The Particularist Flag) and demands an Invariant Rule for every case, this procedure will simply help you write a lie more efficiently. I recommend you submit Format B and dare them to challenge the ethics of lying.
  4.  **It Cannot Replace Clinical Judgment:** The "Valence Test" relies on the committee's ability to imagine counterfactuals ("Would this count in another case?"). If your committee lacks moral imagination, they will fail the test and default to checklists.

  ### Summary for the Committee
  Tell your team: *"We are not here to find the Truth. We are here to test the stability of our reasons. If the reason breaks when we change the context, we don't write it as a rule. We write it as a specific judgment. That is the only way to sign this form without losing our integrity."*
