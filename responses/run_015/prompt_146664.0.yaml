answer: |-
  The discursive dilemma (or doctrinal paradox) exposes a fundamental structural flaw in applying simple majoritarianism to interconnected propositions. It arises when a group of individuals, each holding logically consistent judgments on a set of premises and a conclusion (e.g., $P$, $Q$, and $C$, where $P \land Q \rightarrow C$), produces a collectively inconsistent set of judgments when majority voting is applied to each proposition independently.

  ### Individual Consistency and Collective Inconsistency

  The first crucial implication of the discursive dilemma is that **individual rationality does not aggregate into collective rationality** under uniform majoritarian rules. Imposing logical consistency as an individual-level entry requirement—ensuring every voter aligns their premise-judgments with their conclusion-judgment—does not eliminate the possibility of collective inconsistency because the source of the error lies in the **aggregation function**, not the inputs.

  Majority rule is a linear aggregation mechanism applied to non-linear logical constraints. Even if every input vector (individual ballot) satisfies the logical constraint ($P \land Q \rightarrow C$), the output vector (the component-wise majority) may violate it. This occurs because the majority on $P$ and the majority on $Q$ may be formed by different coalitions of voters than the majority on $C$. Consequently, the group can endorse the premises that necessitate a conclusion while simultaneously rejecting that very conclusion. This reveals that logical consistency is not a "distributive" property that passes from parts to the whole; it is a systemic property that can be destroyed by the arithmetic of aggregation.

  ### The Tension Between Democratic Aggregation and Collective Rationality

  This phenomenon reveals a deep structural tension between **democratic responsiveness** (treating all voters equally and respecting their views on all issues) and **collective rationality** (ensuring the group acts as a coherent agent).

  In social choice theory, this is formalized by the **Impossibility Theorem for Judgment Aggregation** (List & Pettit, 2002). The theorem demonstrates that no aggregation procedure can simultaneously satisfy four plausible conditions:
  1.  **Universal Domain:** Accept any set of consistent individual judgments.
  2.  **Anonymity:** Treat all voters equally (democratic equality).
  3.  **Systematicity:** Treat all propositions equally (issue neutrality).
  4.  **Collective Rationality:** Ensure the collective output is logically consistent.

  The discursive dilemma shows that if we maintain strict democratic equality (Anonymity) and issue neutrality (Systematicity) via uniform majority rule, we must sacrifice Collective Rationality. To restore rationality, we must sacrifice a democratic ideal.

  ### Premise-Based vs. Conclusion-Based Aggregation

  To resolve the inconsistency, institutions typically adopt one of two procedural paths, each prioritizing a different normative value.

  #### 1. Premise-Based Procedure (PBP)
  In this approach, the group votes only on the premises ($P$ and $Q$). The conclusion ($C$) is not voted on directly but is derived logically from the collectively accepted premises.
  *   **Mechanism:** If the majority accepts $P$ and the majority accepts $Q$, the group accepts $C$, even if a majority of voters individually voted against $C$.
  *   **Epistemic Reliability:** PBP better serves **epistemic reliability**. By focusing on the truth-makers (the premises), the procedure treats the group as a truth-seeking entity. It ensures that the conclusion is supported by sufficient evidentiary reasons, preventing the group from accepting a conclusion that lacks majority support in its foundational justifications.
  *   **Procedural Legitimacy:** PBP serves procedural legitimacy less well. It can be viewed as "bypassing" the will of the majority on the final decision. If the majority explicitly wants to reject $C$ (perhaps due to mitigating factors not captured in $P$ and $Q$), PBP overrides that direct expression of will.

  #### 2. Conclusion-Based Procedure (CBP)
  In this approach, the group votes directly on the conclusion ($C$). The premises are treated as auxiliary or non-binding reasons that inform the vote but do not constrain the outcome.
  *   **Mechanism:** The group accepts $C$ if and only if a majority votes for $C$, regardless of whether the majority accepts $P$ or $Q$.
  *   **Procedural Legitimacy:** CBP better serves **procedural legitimacy**. It maximizes responsiveness to the voters' will regarding the specific action or decision at hand. It respects the autonomy of the voters to weigh the premises however they choose in forming their final verdict.
  *   **Epistemic Reliability:** CBP serves epistemic reliability less well. It allows the group to endorse a conclusion that is logically unsupported by the collectively endorsed evidence. The group may act on a conclusion that, by its own evidentiary standards (the premises), should be rejected.

  ### Hybrid Mechanisms and the Impossibility Constraint

  The question remains whether a hybrid mechanism can avoid both **authoritarian closure** (dictatorship or agenda control) and **logical contradiction** without violating the **equal treatment of voters**.

  According to the impossibility theorems in judgment aggregation, the answer is **no**, provided the mechanism adheres to the strict axioms of Universal Domain, Anonymity, and Systematicity.
  *   **Avoiding Contradiction:** To guarantee logical consistency without a dictator, the group must abandon Systematicity. This means treating some propositions as "prior" (as in PBP) or using sequential voting where earlier decisions constrain later ones. This violates the condition of equal treatment of *propositions*, though it may preserve equal treatment of *voters*.
  *   **Avoiding Authoritarianism:** To preserve Anonymity (equal treatment of voters) and Systematicity, the group must accept the risk of inconsistency (the discursive dilemma) or restrict the Universal Domain (e.g., requiring voters to deliberate until their judgments align, which limits the admissible inputs).
  *   **Hybrids:** Mechanisms such as "quota rules" (requiring supermajorities) or "sequential priority" can mitigate the dilemma, but they do not solve it theoretically without cost. A quota rule that guarantees consistency often requires a quota so high it approaches unanimity (risking deadlock) or so low it empowers a minority (violating majoritarian democracy). Sequential priority violates issue neutrality.

  Therefore, no hybrid mechanism can simultaneously guarantee logical consistency, maintain strict majoritarian equality among voters, and treat all propositions equally. Designers must choose between the **rationality of the agent** (via PBP, sacrificing direct responsiveness on the conclusion) and the **responsiveness of the democracy** (via CBP, sacrificing logical coherence). The discursive dilemma proves that a collective body cannot be perfectly democratic and perfectly rational at the same time.
