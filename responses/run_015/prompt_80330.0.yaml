answer: |-
  **Kai:** Let's start with the constitutive rule. You can't play chess without trying to checkmate; you can't assert without representing yourself as knowing. If you assert $p$ without knowing $p$, you've violated the rule of the game, even if $p$ turns out true.

  **Tess:** That conflates the *goal* of the game with the *move* itself. The goal of assertion is to share truth. If I assert a mathematical theorem that is, in fact, true, I've succeeded in sharing truth. Why does your norm demand I possess a specific cognitive relation to that truth before I speak?

  **Kai:** Because without that relation, you're misleading your audience. You're presenting the proposition as settled.

  **Tess:** Consider a complex necessary truth, like the Riemann Hypothesis. Assume it's true. A mathematician asserts it based on overwhelming heuristic evidence, prior to a formal proof. She doesn't *know* it yet—there's no derivation, so the epistemic basis is incomplete by your standards. But the proposition is necessary. If it's true, it's necessarily true. Your Knowledge Norm forbids her assertion. My Truth Norm permits it, provided she has warrant. She's advancing the field, not misleading anyone. Everyone knows it's unproven.

  **Kai:** If everyone knows it's unproven, she shouldn't be *asserting* it. She should be *conjecturing*. The speech act changes. "I assert $p$" carries a different commitment than "I conjecture $p$." If she says "I assert," she claims knowledge. If she lacks it, she breaks the norm, even if the math is sound. The necessity of the truth doesn't grant her epistemic access.

  **Tess:** But that makes assertion too intellectualized. It turns the norm into a barrier to information transfer. If the proposition is true and she has warrant, why withhold the assertion? It seems your norm prioritizes the speaker's status over the listener's access to truth.

  **Kai:** It prioritizes the listener's *epistemic safety*. Suppose I guess a lottery number. I say, "Ticket 402 lost." It's true. I had no evidence, just a hunch. By your Truth Norm, was my assertion proper? It was true, and I believed it.

  **Tess:** I'd say it was improper. But not because you lacked *knowledge*. It was improper because your warrant was insufficient to track the truth reliably.

  **Kai:** But "tracking the truth reliably" just *is* the externalist condition for knowledge. You're smuggling knowledge in through the back door. If you concede the lottery guess is wrong, you admit the norm isn't just about truth. It's about how you stand in relation to the truth.

  **Tess:** I'll concede the lucky guess is defective. A true assertion born of a coin flip doesn't serve the purpose of assertion, which is to expand the common ground responsibly. But that defect is about *responsibility*, not knowledge. I can be responsible and still lack knowledge in Gettier cases. If I have a justified true belief that fails to be knowledge due to some environmental luck, your norm says I shouldn't have asserted. But intuitively, I was blameless. I did everything right.

  **Kai:** Blameless, perhaps. But the assertion was still defective. You can be blameless in violating a rule. If a referee makes a bad call but honestly thinks it's correct, they're blameless, but the call is still invalid. The Knowledge Norm explains why the assertion feels "off" even when you're justified. It lacks the authority knowledge provides.

  **Tess:** Authority is social. Truth is factual. If I tell you the bridge is out, and it is out, and I saw a sign that said so (even if the sign was technically unreliable but happened to be right), I've saved you from driving off. Did I wrong you?

  **Kai:** You risked wronging me. Knowledge removes the risk. That's why it's the norm.

  ***

  **Note on Philosophical Framing**

  This dialogue takes a few liberties to make the debate dramatic, which you should flag for your students:

  1.  **The "Truth Norm" Strawman:** In contemporary literature, the primary rival to the Knowledge Norm (KN) is rarely a bare **Truth Norm** ("Assert $p$ only if $p$ is true"). A pure Truth Norm is externalist and arguably not action-guiding (agents cannot directly check truth conditions). Most opponents of KN defend a **Justified Belief** or **Reasonable Belief** Norm. Tess's position in the dialogue is a hybrid: she advocates for Truth as the *standard* but allows "warrant" to make it followable. You should clarify that the "Truth Norm" is often shorthand for "Epistemic Norms weaker than Knowledge."
  2.  **The Necessary Truths Objection:** The dialogue frames the objection as "hard to know math." This is a specific skeptical pressure. The more common objection regarding necessary truths is that KN is too *restrictive* on unproved conjectures (as Tess argues), not that necessities are unknowable *simpliciter*. The dialogue treats "knowledge of math" as requiring proof, which is a specific (and contested) internalist reading of mathematical knowledge.
  3.  **The Concession:** Tess's concession on the lottery case blurs the line between Truth and Justification. By admitting the lucky guess is improper, she effectively concedes that *truth alone* is insufficient, which pushes her view closer to a Justified Belief norm. The dialogue leaves this tension unresolved to maintain the stalemate, but technically, once she admits luck invalidates assertion, she has abandoned a pure Truth Norm.
