          *   *Correction on the "Necessary Truths" Objection:* The standard objection against KN regarding necessary truths is actually the reverse: Some argue KN is too *weak* or too *strong* depending on the modal profile. But the specific objection the user wants is: "It's hard to see how you could know them... yet we plainly do assert them." This sounds like a confusion between *truth* and *knowledge of truth*. Actually, the stronger objection against KN is usually about *false* assertions that are justified (Moore's paradox territory) or *true* assertions that aren't known (Gettier).
