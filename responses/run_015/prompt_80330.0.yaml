          *   **Truth Norm (TN):** Often associated with Weiner (2005) or early views, but usually, the rival to KN isn't just "Truth," it's "Justified Belief" (JB) or "Reasonable Belief." A pure Truth Norm ("Assert $p$ only if $p$ is true") is externalist in a way that makes it hard to follow as a *rule* for agents (you can't always check truth directly).
