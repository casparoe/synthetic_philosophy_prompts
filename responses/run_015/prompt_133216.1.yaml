  *(Self-Correction on the Study Hypothesis)*: If sanctity reduces to pathogen avoidance, the User says "It's not moral." The Friend might say "Pathogen avoidance is a substrate of Care/Harm, so it's still moral, just misfiring." Or "Authority/Loyalty are the real binding ones." I need to highlight *why* they interpret it differently. It's because they disagree on what *debunking* means.

