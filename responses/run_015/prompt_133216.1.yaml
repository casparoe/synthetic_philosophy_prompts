      *   *Is it Empirical?* Partly (modularity vs. domain-general), but as the user notes, both sides often co-opt empirical findings. The hypothetical study example highlights this. If sanctity reduces to pathogen avoidance, the User says "See, not moral!" The Friend says "See, it's about survival/harm, which connects to Care, or it shows Authority/Loyalty are the real binding ones."
      *   *Is it Metaethical?* Yes. It's about the relationship between *origins* and *validity*.
          *   User: Genealogical reduction $\rightarrow$ Debunking (if it's just disgust/coalition, it's not normative).
          *   Friend: Genealogical reduction $\rightarrow$ Irrelevant (origins don't determine validity) OR Coherence (a theory must fit the data of human moral experience).
      *   *Is it Definitional?* Yes. What counts as "Moral"?
          *   User: Moral = Impartial/Universalizable (Kantian/Utilitarian leanings).
          *   Friend: Moral = What functions to bind groups/sustain societies (Humean/Communitarian leanings).
      *   *The "Inference to Best Explanation" Clash:* The friend argues a moral theory must explain moral *phenomena*. The user argues a moral theory must *critique* moral phenomena. This is the Euthyphro dilemma applied to psychology: Do we value foundations because they are moral, or are they moral because we value them?

  3.  **Address the Thought Experiment (The Preregistered Study):**
      *   *Scenario:* Sanctity = Pathogen avoidance (no distinct module). Left-Right sanctity gap vanishes when controlling for pathogens. Authority/Loyalty gaps remain.
