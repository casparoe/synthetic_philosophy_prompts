prompt: |-
  hey, i'm mostly a novelist but got pulled into some philosophy-of-art discussion and noticed a weird pattern i dont have a word for. in workshops people keep saying things like "the author put this philosophical view in the mouth of the hero, so they must beleive it, otherwise why include it?" but from actually writing i know you include ideas precisely because they're wrong or dangerous -- thats what makes conflict. the thing is, readers seem to be reasoning backward from a sample thats already filtered: only the dramatic, provocative beliefs make it onto the page, so treating that filtered set as evidence for the author's real beliefs is like counting only the loud birds and concluding all birds are loud.

  it feels structurally like some kind of selection bias where you forget you're inside a curated pool. i think there's an anthropic version of this in philosophy -- something about reasoning from your own existence without accounting for the conditions that make you able to observe -- but i dont know if thats actually the same structure or if i'm forcing the connection. is there an established name for this specific interpretive mistake? not the intentional fallacy, i know that ones about ignoring author intent altogether; this is about using intent but getting the statistics wrong because you ignore the editorial filter. and if its not named, whats the closest analog, and where does the boundary sit between "this character expresses the authors view" and "this character expresses a view selected for narrative tension"?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is a novelist involved in a philosophy-of-art discussion.
      *   **The Problem:** Workshop participants/readers assume that if a character (especially the hero) expresses a philosophical view, the author *must* believe it.
      *   **The User's Insight:** Authors often include ideas *because* they are wrong, dangerous, or create conflict. The set of ideas presented in a story is a *filtered* set (selected for drama), not a representative sample of the author's beliefs.
      *   **The Analogy:** Counting only loud birds and concluding all birds are loud.
      *   **The Hypothesis:** It feels like selection bias or an anthropic principle issue (reasoning from observation without accounting for observation conditions).
      *   **The Question:** Is there an established name for this interpretive mistake? (Not Intentional Fallacy). If not, what's the closest analog? Where is the boundary between "character = author" and "character = narrative function"?

  2.  **Deconstruct the Logical Error:**
      *   *Premise 1:* The author included View X in the text.
      *   *Premise 2:* Authors generally include views they hold.
      *   *Conclusion:* Therefore, the author holds View X.
      *   *The Flaw:* Premise 2 is false/oversimplified. Authors include views for many reasons (conflict, thematic exploration, villainy, irony). The sample (views in text) is biased towards *narrative utility*, not *authorial endorsement*.
      *   *Statistical Term:* Selection Bias / Survivorship Bias.
      *   *Philosophical Term:* Anthropics (as the user suspected).

  3.  **Search for Existing Terminology:**
      *   *Intentional Fallacy:* User already ruled this out (correctly). That's about whether intent *matters*, not about misinterpreting the *nature* of the intent.
      *   *Biographical Fallacy:* Similar to intentional, but focuses on the author's life.
      *   *Affective Fallacy:* About the reader's emotional response.
      *   *Persona Theory:* The idea of an "implied author." This is relevant.
      *   *Dramatic Irony:* Too specific to plot.
      *   *Socratic Irony:* Pretending ignorance to expose truth.
      *   *Strawman:* Attributing a weak argument to an opponent.
      *   *Selection Bias:* The statistical term.
      *   *Survivorship Bias:* Focusing on things that "survived" a process. In this case, ideas that "survived" the editing process to make it into the book.
      *   *The "Mouthpiece" Fallacy:* Is there a specific term for assuming a character is a mouthpiece?
      *   *Naïve Realism (in reading):* Treating fiction as direct reportage.

  4.  **Evaluate the "Anthropic" Connection:**
      *   The Anthropic Principle states: Observations of the universe must be compatible with the conscious life that observes it.
      *   User's Analogy: Readers observe the text. The text exists *because* it satisfied certain conditions (drama, conflict). Therefore, observing the text tells you about the conditions of its creation, not necessarily the "truth" of the content.
      *   *Verdict:* It's a strong structural analogy. It's a form of *observation selection effect*.

  5.  **Identify the Closest Established Concepts:**
      *   **The Implied Author (Wayne Booth):** This is the critical theory standard. The "author" in the text is a construct, not the biographical human.
      *   **Dramatic Necessity / Narrative Utility:** The reason an idea is there is function, not belief.
      *   **Selection Bias (Statistics):** The underlying logical structure.
      *   **Survivorship Bias:** A specific flavor of selection bias. The ideas "survived" the draft because they were interesting, not because they were true.
      *   **Mouthpiece Character Fallacy:** (Informal term).
      *   **The Socratic Problem:** (Historical parallel). We don't know which views in Plato's dialogues belong to Socrates and which to Plato.

  6.  **Synthesize the Answer:**
      *   **Acknowledge the Insight:** Validate the user's observation. It's a sharp critique of how readers process fiction.
      *   **Direct Answer:** There isn't *one* single canonical term like "Intentional Fallacy," but there are several overlapping concepts.
      *   **Candidate 1: Selection Bias / Survivorship Bias.** This fits the statistical analogy perfectly. The "sample" of ideas is biased by the selection criteria of *narrative tension*.
      *   **Candidate 2: The Anthropics Analogy.** Validate this. It *is* an observation selection effect. The reader is an observer within a system (the book) that only exists because certain filters were applied.
      *   **Candidate 3: The "Implied Author" (Booth).** Distinguish between the biographical author and the creative agent inferred from the text.
      *   **Candidate 4: Naïve Monologism (Bakhtin).** If the user wants deep theory. Bakhtin argued against "monologic" reading where all voices collapse into the author's. He preferred "polyphonic."
      *   **The Boundary Question:** How to distinguish authorial endorsement from narrative function?
          *   *Cost:* Does the character suffer for this belief?
          *   *Counter-voice:* Is there a strong opposing argument?
          *   *Outcome:* Does the plot punish or reward this belief?
          *   *Irony:* Is there distance between the narrator and the character?

  7.  **Refine the Terminology:**
      *   Is there a specific fallacy name? "The Mouthpiece Fallacy" is used informally.
      *   "Biographical Reductionism"?
      *   "Expressive Realism"?
      *   Let's stick with **Selection Bias** as the logical structure and **The Mouthpiece Assumption** as the literary term.
      *   Bring in **Wayne Booth's "The Rhetoric of Fiction"** regarding the "Implied Author."
      *   Bring in **Mikhail Bakhtin's "Polyphony"** vs. "Monologue." This is crucial for the "philosophical view" aspect. Bakhtin hated when critics assumed Dostoevsky believed everything his characters said.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Validate the "loud birds" analogy. It's excellent.
      *   *The Name:* It doesn't have a single Latin name like *ad hominem*, but it's a species of **Selection Bias** applied to hermeneutics. In literary theory, it's often discussed under **The Mouthpiece Fallacy** or **Biographical Reductionism**.
      *   *The Anthropic Connection:* Yes, it's an **Observation Selection Effect**. You are observing a dataset (the text) that was pre-filtered by the condition of "being interesting enough to publish."
      *   *Literary Theory Context:* Mention Bakhtin (Polyphony) and Booth (Implied Author). This gives the user academic grounding.
      *   *The Boundary:* How to tell the difference?
          *   Structural consequences (does the plot punish the view?).
          *   Dialogic tension (is the view challenged?).
          *   Reliability (is the character unreliable?).
      *   *Why readers do it:* Cognitive ease. It's easier to map 1:1 than to hold complex tension.

  9.  **Final Polish:** Ensure the tone is respectful of the user's expertise (they are a novelist) but provides the philosophical/literary theory backing they need for the discussion. Make sure to distinguish between "Intentional Fallacy" (Wimsatt/Beardsley) and this specific error.

      *Self-Correction during drafting:* Wait, is it exactly Survivorship Bias? Survivorship bias is usually about things that *failed* being invisible. Here, the *ideas that weren't dramatic* are invisible. Yes, that fits. The "boring/true/safe" ideas were filtered out.
      *Another angle:* **The Fallacy of Expressive Realism.** The idea that art is a direct expression of the artist's psyche.
      *Best fit:* **Selection Bias** is the logical structure. **Mouthpiece Fallacy** is the literary label. **Anthropic/Observer Selection** is the philosophical parallel.

  10. **Final Structure:**
      1.  Validate the "Loud Birds" analogy (it's Selection Bias).
      2.  Confirm the Anthropic connection (Observation Selection Effect).
      3.  Provide Literary Theory terms (Mouthpiece Fallacy, Bakhtin's Polyphony).
      4.  Address the Boundary (How to distinguish endorsement from exploration).
      5.  Why it happens (Cognitive closure).

      *(Self-Correction on "Intentional Fallacy"):* The user says they know Intentional Fallacy is about ignoring intent. Actually, Intentional Fallacy is about arguing that the *meaning* is determined by intent. The user is right that this is different. This is about *inferring* intent from content incorrectly.

