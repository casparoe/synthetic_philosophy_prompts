answer: |-
  **Exam Question**

  **Question 3**
  Consider the case of the "locally coherent agent." At every choice node she faces, her preferences over the available options are complete and transitive. However, her preferences are menu-dependent: she prefers A to B in {A, B}, B to C in {B, C}, and C to A in {C, A}, though she prefers A to all others when {A, B, C} are offered together. An exploiter controls the order of pairwise menus, charging a small fee for each swap, leaving her holding A again but poorer by three fees. She is "contented": she foresees this sequence, understands the money pump argument, yet prefers remaining the person she is to bearing the cost of having her dispositions removed.

  Critically evaluate whether the money pump argument successfully establishes that this agent is irrational. In your answer, you must: (1) specify whether the alleged defect lies in her preferences, her choice rule, or her vulnerability to framing; (2) explain why her contentment does not automatically refute the charge of irrationality; (3) describe the strategy required to escape the pump and the normative cost of adopting it; and (4) address the overgeneration worry regarding agents who change preferences through learning or endorsed taste shifts.

  ***

  **Model Answer**

  The money pump argument against the locally coherent agent does not demonstrate a defect in her static preferences, since ex hypothesi she is transitive at every node. Instead, the pump targets her diachronic choice rule or disposition. The alleged defect is a failure of dynamic consistency: her local optimality at each node aggregates to global inefficiency. This distinction matters because it shifts the critique from the structure of valuation to the policy of implementation. If the defect were in preferences, she would be logically inconsistent. Since it is in the choice rule, she is instrumentally inefficient, sacrificing wealth for no gain in final outcome.

  The contentment stipulation does not settle the matter in her favour because money pump arguments typically support a verdict about coherence rather than welfare. Rational choice theory often distinguishes between satisfying desires and satisfying norms of instrumental rationality. An agent can be contented yet instrumentally incoherent, much like a happy procrastinator. The pump argues that she violates a norm of means-ends efficiency: she pays to return to her starting state. Her contentment indicates she values her disposition higher than the lost fees, but this merely shows she ranks her disposition above money. It does not show her choice sequence is coherent. If rationality requires that plans be executable without self-defeat, her contentment is irrelevant to the structural defect.

  To escape the pump, the agent must adopt a strategy of resolute choice. She must refuse a swap at a specific node—not because she currently prefers the status quo, but because she is adhering to a plan formed at the outset based on the grand-menu ranking. She must treat her prior intention as binding despite her current local preference for the swap. This requires a form of agency that allows past decisions to constrain current choices even when current preferences diverge.

  The cost of this escape is the violation of local optimality. To be rational diachronically, she must act against what she most prefers at the moment of choice. This costs her "sophistication," where an agent merely anticipates future preferences; instead, she must exercise authority over her future selves. The normative cost is high: it requires rejecting the principle that one should always act on one's current strongest preference. She sacrifices local autonomy for global coherence. If rationality demands maximizing satisfaction at every node, she cannot escape the pump without becoming irrational at that node. Thus, avoiding the pump requires privileging global planning over local responsiveness.

  Finally, the argument faces the overgeneration worry. Any agent whose preferences change over time—even through learning or endorsed taste shifts—can be pumped. If I prefer tea to coffee today and coffee to tea tomorrow due to a reasoned change in taste, an exploiter can pump me. Condemning the locally coherent agent therefore requires distinguishing between benign preference shifts and defective menu dependence. The distinction lies in reason-responsiveness. If her menu dependence reflects context-sensitive reasons (e.g., framing effects), it is a defect. If it reflects genuine learning, it is not. The money pump only condemns her if her menu dependence is arbitrary rather than reason-based. Without this qualification, the argument condemns too much, labeling all temporal preference change as irrational. Therefore, the pump succeeds only if it can show her menu dependence lacks justificatory reasons, not merely that it creates cycles.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  1.  **Target of the Critique (4 marks)**
      *   *Requirement:* Identify that the defect is in the diachronic choice rule/disposition or dynamic consistency, not static preferences (since she is locally coherent).
      *   *Common Error:* Candidates claim her preferences are intransitive simpliciter, ignoring the "local coherence" stipulation.
  2.  **Contentment and Welfare (4 marks)**
      *   *Requirement:* Explain that money pumps target instrumental coherence/efficiency, not necessarily welfare maximization; contentment addresses welfare, not coherence.
      *   *Common Error:* Candidates argue that because she is happy, she is rational, conflating welfare with instrumental rationality.
  3.  **Escape Strategy (4 marks)**
      *   *Requirement:* Describe resolute choice (binding oneself to a prior plan) as the necessary mechanism to stop the pump.
      *   *Common Error:* Candidates suggest "sophistication" (backwards induction) without noting that local preferences must be overridden, not just anticipated.
  4.  **Cost of Escape (4 marks)**
      *   *Requirement:* Articulate that escaping requires acting against current local preference, sacrificing local optimality for global coherence.
      *   *Common Error:* Candidates claim the escape is costless or fail to identify the tension between local and global rationality.
  5.  **Overgeneration Worry (4 marks)**
      *   *Requirement:* Address that learning/taste changes also allow pumping; distinguish defective menu dependence from reason-responsive change.
      *   *Common Error:* Candidates ignore the worry or claim all preference change is irrational.

  **A vs. B Distinction:**
  A-grade answers synthesize these points into a unified verdict on the pump's force (e.g., "The pump works only if menu dependence is arbitrary"). B-grade answers treat the four requirements as a checklist without connecting the cost of escape to the overgeneration worry (e.g., failing to see that resolute choice might be too high a cost if preference change is benign).

  ***

  **Confidence Note**

  I am moderately confident this question has a determinate best answer regarding the *requirements* for a strong response, though philosophical verdicts vary. The least confident requirement is the "Overgeneration" point. Some strong theories (e.g., strict structuralism) deny the distinction between benign shifts and defects, arguing all cycle-inducing changes are irrational. Forcing candidates to accept the "reason-responsiveness" distinction might penalize a coherent structuralist defense, though such a defense is rare at undergraduate level.
