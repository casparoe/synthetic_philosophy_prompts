      *Tone Check:* Needs to be supportive of the case manager but critical of the philosophy's limits.

      *(Final thought on the "Unwanted" case)*: I will make the Food Truck case result in a **Denial of Emergency Cash**, but a referral to business rehab. This is the "Luck Egalitarian" result. It will feel cold to a helper. That fits.

