  *Wait, one more nuance:* The Meditator's Move 5 (self-defeat) is a classic transcendental argument. The Skeptic's Move 6 (unstable target) is the counter. I need to adjudicate that specifically. The Skeptic is right: if the target is unstable, calibration fails. This is the pivot point.

