      *   *Stance:* Introspective reports deserve **low prior credence regarding causal claims** and **moderate credence regarding coarse-grained phenomenology**, but **near-zero credence regarding fine-grained structural claims** without external validation. The Meditator's "gauge" analogy is misleading; it's more like "skilled storytelling." The Skeptic is broadly more correct, but the Meditator's distinction (Move 3) saves introspection from total collapse.
