          2.  Negation equivalence: The summary says "negation of a conditional is equivalent to the antecedent paired with the negated consequent". This looks like $\neg(A \rightarrow B) \equiv (A \rightarrow \neg B)$. This is actually a consequence Lewis derives or uses in some formulations, but the core assumption is that they are truth-apt propositions subject to standard probability calculus.
          3.  Coherent updating: Standard Bayesianism.
      *   *The Conclusion:* Lewis concluded that conditionals *cannot* be propositions (cannot have truth conditions) if Adams's thesis holds. He did not necessarily conclude they are *purely* pragmatic (though many non-cognitivists did); he left open that Adams's thesis might be false, but most accepted the thesis and rejected truth conditions.
      *   *Counterfactuals:* Lewis did analyse counterfactuals via possible worlds (1973), treating them as truth-conditional. The triviality result applies specifically to the combination of Adams's thesis and truth conditions. Counterfactuals do not generally obey Adams's thesis (one can accept a counterfactual while assigning low probability to the consequent given the antecedent in some contexts, or rather, the logic differs). So the distinction holds.
