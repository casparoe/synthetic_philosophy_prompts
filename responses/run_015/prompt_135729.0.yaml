      *   *Assumptions:* Lewis assumes conditionals express propositions (have truth conditions). He does *not* assume they can be freely embedded (in fact, embedding is often restricted in non-truth-conditional accounts). He does *not* assume the negation equivalence described (¬(A→B) ≡ A→¬B) as a primary premise; rather, he uses the law of total probability and the assumption that conditionals are propositions.
      *   *The "Three Rules" in the summary:*
