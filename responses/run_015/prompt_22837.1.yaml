answer: |-
  First off, huge props for diving straight into McTaggart. That paper ("The Unreality of Time," 1908) is dense, and your confusion is actually a sign that you're understanding it correctly. In fact, the specific objection you're raising ("Why not just drop the A-series and keep the B-series?") is the exact objection that defined the last 100 years of philosophy of time.

  You have intuitively stumbled upon the **B-Theory of Time**, which is the dominant rival to McTaggart's view today.

  However, to understand why McTaggart doesn't just let you do that, we have to look at the one assumption he hides in the text you quoted. Here is the walkthrough of why he thinks the B-series can't stand alone, and how this connects to Presentism and Eternalism.

  ### 1. The Hidden Premise: Time Requires Change
  The key to unlocking McTaggart's argument is realizing that for him, **a static universe is not a universe with time.**

  Imagine a movie reel.
  *   **The B-Series** is like looking at all the frames of the movie laid out on a table. Frame 1 is "earlier than" Frame 2. Frame 50 is "later than" Frame 2. These relationships never change. Frame 1 is *always* earlier than Frame 50.
  *   **The A-Series** is the light of the projector moving across the frames. Frame 50 is *future*, then it becomes *present* (on the screen), then it becomes *past*.

  McTaggart argues that if you only have the frames on the table (the B-series), nothing is actually *happening*. It's just a static arrangement of events, like numbers on a ruler or books on a shelf. The number 1 is always before the number 2, but we don't say time is passing between numbers on a ruler.

  For McTaggart, **Time = Change.**
  *   In the B-series, nothing changes. (Event M is always earlier than Event N).
  *   In the A-series, things change. (Event N goes from being Future $\rightarrow$ Present $\rightarrow$ Past).

  Therefore, McTaggart concludes: **You cannot have time without the A-series.** The B-series is just a static ordering; the A-series is what makes it *temporal*.

  ### 2. Why the A-Series is "Contradictory"
  Since McTaggart thinks you *need* the A-series for time to exist, he then tries to prove the A-series is impossible.

  His argument goes like this:
  1.  Every event must be Past, Present, and Future (at different points).
  2.  But an event cannot be all three at once. (An event can't be Present and Past simultaneously).
  3.  So, we say: "Event E is Present *now*, but it *was* Future and *will be* Past."
  4.  **The Trap:** To explain that E isn't all three *at once*, you have to use time words ("was," "will be," "now").
  5.  But you are trying to define Time using the A-series. If you need Time to explain the A-series, your explanation is circular.

  Because he thinks the A-series is logically broken (contradictory), and he thinks Time *requires* the A-series, he concludes **Time is unreal.**

  ### 3. Your Objection: "Why not just keep the B-Series?"
  You asked: *"Why does the A-series being broken drag the whole thing down with it? ... Why not just drop the A-series and keep the B-series?"*

  **McTaggart's Answer:** Because without the A-series, you don't have time, you just have a static list. You have a "Block Universe" where nothing ever truly changes, and for McTaggart, that isn't time.

  **The Modern Philosopher's Answer (The B-Theory):** You are absolutely right to push back here. Most modern philosophers and physicists (especially after Einstein) say: **"McTaggart was wrong about change."**

  They argue that change doesn't require the A-series.
  *   **A-Theory Change:** An object changes its *temporal properties* (from Future to Present).
  *   **B-Theory Change:** An object changes its *physical properties* at different coordinates. (e.g., The poker is hot at $t_1$ and cold at $t_2$).

  If you accept the B-Theory, you say: "Time is just the dimension of 'earlier' and 'later'. We don't need a moving 'Now'. The 'Now' is just where our consciousness happens to be, like 'Here' is just where our body happens to be."

  So, your intuition aligns with the **B-Theorists**. They accept the B-series is real and the A-series is an illusion of human consciousness.

  ### 4. Connecting to Presentism vs. Eternalism
  This is where your reading on Presentism and Eternalism fits in perfectly.

  **The A-Series aligns with Presentism:**
  *   **Presentism:** Only the Present exists. The Past is gone; the Future hasn't happened.
  *   **Connection:** This requires a moving "Now" (A-Series). If only the Present exists, events must literally come into existence and go out of existence.
  *   **McTaggart's View:** He thinks Presentism (A-Series) is what time *feels* like and what is *required* for time, but he proves it's logically impossible.

  **The B-Series aligns with Eternalism:**
  *   **Eternalism (Block Universe):** The Past, Present, and Future all exist equally. 1900 exists just as much as 2024, just at a different coordinate.
  *   **Connection:** This fits the B-Series perfectly. Events are just fixed at coordinates "earlier" or "later." Nothing moves; nothing comes in or out of existence.
  *   **The Conflict:** McTaggart says Eternalism (B-Series only) isn't really "time" because nothing changes. Modern B-Theorists say, "Yes it is."

  ### Summary
  To answer your specific stuck point:

  1.  **Why does the A-series being broken drag Time down?** Because McTaggart defines Time as requiring **dynamic change**, and he believes only the A-series provides dynamic change. The B-series is too static.
  2.  **Can you just keep the B-series?** McTaggart says no (that's not time). Modern philosophers say **yes** (that is exactly what time is).
  3.  **Presentism/Eternalism:** McTaggart is essentially saying: "Time requires Presentism (A-Series). Presentism is contradictory. Therefore, Time is unreal." You are siding with the Eternalists (B-Series), who say: "Time does not require Presentism. Eternalism is consistent. Therefore, Time is real."

  You've basically reinvented the B-Theory of Time in real-time. That's a great place to be stuck! If you want to read the counter-argument to McTaggart, look up philosophers like **D.H. Mellor** or **J.J.C. Smart**, who defend the view you're leaning toward: that the B-series is real and the A-series is just how we experience it.
