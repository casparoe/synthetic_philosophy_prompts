  I'm writing an advanced seminar paper on the evolution of honest communication between agents whose interests partly diverge, and I've noticed that I keep having the same argument with myself in a way that isn't productive: I supply both the objection and the reply, and the reply always wins because I invented it. So I'd like you to take one side of it properly.

  Please play a committed defender of the handicap principle — someone who holds that where signaler and receiver interests conflict, a signal can be reliable only because it is costly in a way that makes the dishonest option unprofitable for exactly the signalers who would most want to use it. I want a real defender and not a caricature: you know the standard equilibrium formulations, and the distinction between signals that are costly to produce and signals that are merely physically unfakeable, and you will concede small points readily (plenty of communication is cheap; common-interest cases are a different story; some displays function as amplifiers rather than tests) while never conceding the central claim and never letting me score a hit by restating your position in a weaker form than the one you actually hold. No drifting toward the conclusion that both views have merit — argue with me. Keep each reply to roughly two hundred words, in plain speech rather than lecture style, and stay in character until I say stop.

  My opening move. I want to attack the principle by relocating the cost. Consider a lek-breeding bird — call it the gilded courser — whose males gather on a display ground and perform a display that is metabolically almost free: a posture, a few wing-flicks, two seconds of work. Females visit, check what they see against independent cues of a male's condition such as plumage sheen and gait, and when a male's display outruns his actual condition they mob him — repeated chases by several females, which cost him his place on the lek and a whole season of matings. A high-quality male performing the full display is never mobbed; a low-quality male performing the full display is mobbed every time; a low-quality male who tones the display down is simply ignored. So the display is perfectly honest, and the marginal production cost of the signal is close to zero: the entire cost is imposed by the receivers, and it falls only on the males who lie. Three questions, though answer whichever you want first. First: is the gilded courser a specimen of your principle or a counterexample to it? Second: if the cost may be supplied by the receiver's response rather than by the signal's production, what is left of the claim that signals must be costly — doesn't it collapse into the remark that honesty requires cheating not to pay, which is true by construction and predicts nothing, since any signaling system we can observe is one in which cheating in fact didn't pay? Third: note that the cost here runs the wrong way round, since performing the display is what exposes a male to being tested, so the signal is what makes the cost possible rather than the cost being what makes the signal trustworthy — which looks like the opposite of a handicap. And if your reply is that mobbing is itself expensive for the females and that my story merely relocates the bill onto the receiver, then tell me what your principle predicts for a species in which receivers neither punish nor are cheaply deceived, and what single observation would actually make you abandon it.
