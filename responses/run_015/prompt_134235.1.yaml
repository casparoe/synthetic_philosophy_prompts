  2.  **Deconstruct Good's Theorem (Value of Information):**
      *   *Core Claim:* For a rational agent maximizing expected utility, the expected value of free, non-intrusive information is non-negative. It is positive if the information might change the decision.
      *   *Ex Ante vs. Ex Post:* Before knowing the result, you expect to be better off (or equal). After knowing, you might regret the cost or the news, but the *decision quality* based on that info was optimal given the info.
