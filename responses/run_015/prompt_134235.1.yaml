  Our situation violates these assumptions in four distinct ways, each pushing against the theorem's conclusion. First, the examination is costly and intrusive. The fee subtracts directly from the budget, and the sampling physically alters the painting. This is not merely observing; it is an intervention that degrades the asset regardless of the result. Second, the results are public. This changes the external environment—insurers and lenders react to the file entry—meaning the information alters the available actions themselves, not just our knowledge of which action is best. Third, and most subtly, our utility is belief-dependent. The visitors' experience and our own satisfaction depend partly on what we believe the painting to be. If a downgrade confirms a lesser status, the value of the object drops even if the physical canvas is unchanged. Here, knowledge destroys value by collapsing a hopeful uncertainty into a disappointing certainty.

  Fourth, the theorem assumes a single agent with consistent beliefs. We are a board of fourteen with divergent priors. If we evaluate options by their worst case over our range of beliefs rather than a single average, the non-negativity of information does not survive. For members who weigh the regional narrative heavily, a downgrade is catastrophic. For those prioritizing the major attribution, an upgrade is vital. Whether the value remains non-negative depends on how we aggregate these conflicting utilities. If we adopt a maximin rule—protecting against the worst outcome for any member—the expected value of the test can become negative because the pain of a downgrade for some outweighs the gain of an upgrade for others. I am not unsure on this point: under a strict worst-case evaluation, the guarantee fails.

  To reason quantitatively, we must construct a skeleton equation. The upper bound of the examination's value is the probability that the test is informative, multiplied by the probability that the result changes our programme choice, multiplied by the net benefit of making the correct choice over the incorrect one. From this, we must subtract the explicit fee, the estimated cost of the delay in launching the programme, and a quantified proxy for the conservator's objection. We cannot ignore her professional distress, but neither should it function as an absolute veto; it enters the equation as a cost term representing reputational or ethical risk. Regarding the uninformative result, we treat this as a branch in the decision tree where we pay the cost but retain our original probabilities. Given the laboratory's warning that one-third of such tests are uninformative, we must discount the potential benefit by roughly two-thirds. We must also compare deciding now versus waiting. Waiting four months delays the benefits of either programme by that period; we must discount the future value of the chosen programme accordingly. If the cost of delay exceeds the potential gain from a better decision, we should decide now.

  Finally, consider the slogans circulating among you. The claim that you cannot be hurt by knowing gets the ex ante logic right but ignores the costs, the physical intervention, and the belief-dependent nature of our mission. It treats knowledge as free and utility as purely objective. The counter-claim, that some things are better not known, captures the reality of belief-dependent value and the risk of destructive information, but it risks paralyzing us if used to avoid necessary risks. It is correct that certainty can diminish enjoyment, but wrong if it suggests ignorance is a viable long-term strategy when physical resources and security are at stake. We must weigh the cost of being wrong against the cost of knowing.
