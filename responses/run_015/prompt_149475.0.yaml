answer: |-
  Based on the track record you provided, the board is facing a critical test of their ethical framework. If they want to remain consistent with their past five decisions, **they should reject the proposal in its current form.**

  Here is the breakdown of why, which precedent controls, and what principles are actually at stake.

  ### 1. The Closest Analog: The Church Baptismal Records
  The **19th-century church baptismal records** are the controlling precedent here, not the factory tapes or the mayors' memoirs.

  *   **Why it matches:** Both proposals involve 19th/early 20th-century institutional records created by a power structure (Church/Plantation Owner) about marginalized individuals (Congregants/Workers). Both proposals offered raw data without critical context.
  *   **The Deciding Factor:** The board rejected the church records specifically because the proposal included **"zero interpretation of the racial categories baked into the ledgers."**
  *   **Application:** The plantation ledgers are functionally identical. They are "immaculate records" from an owner that list laborers by name and wage but lack the workers' perspective, context, or interpretation. Accepting them without framing would violate the specific condition set in the church record rejection.

  ### 2. Consistency Check: Yes vs. No
  If the board votes, here is how the principles align with their history:

  **If they vote YES (as currently proposed):**
  *   **The Principle:** *Archival Rescue / Neutrality.* The argument is that the physical survival of the names is the highest good, and the archive's job is to preserve data, leaving interpretation to future researchers.
  *   **The Inconsistency:** This directly contradicts the **Church Records** decision (which demanded interpretation) and the **Gardeners** decision (which demanded subject control over how data is released). It also leans toward the **Ex-Mayors** logic (preserving polished records of elites) but tries to justify it as labor history. It prioritizes the *owner's* neat handwriting over the *workers'* silence.

  **If they vote NO:**
  *   **The Principle:** *Contextual Integrity / Ethical Custody.* The argument is that an archive cannot ethically preserve a tool of economic control (wage ledgers) without also preserving the context of that control.
  *   **The Consistency:** This aligns perfectly with the **Church Records** rejection (data without context is harmful) and the **Gardeners** acceptance (labor history requires laborer agency/framing). It acknowledges that "completeness" (the ledgers being intact) does not equal "truth."

  ### 3. Is "Recording Asymmetry" Just Jargon?
  No. In the context of this specific board, **"Recording Asymmetry" is the operational logic that ties their decisions together.** It is not just a fancy phrase; it is the only concept that explains why they accepted the **Factory Tapes** (worker voice, even if damaged) but rejected the **Church Records** (institutional data, even if historically significant).

  *   **Factory Tapes:** Asymmetry corrected by recording the workers' own voices.
  *   **Gardeners:** Asymmetry corrected by giving workers control over pseudonyms and release.
  *   **Church Records:** Asymmetry *reinforced* by preserving only the institution's categorization of people.
  *   **Plantation Ledgers:** Asymmetry *reinforced* by preserving only the owner's accounting of the workers.

  If they ignore this concept now, they invalidate the reasoning behind their two most ethically complex decisions (Church and Gardeners).

  ### 4. The Recommendation: The "Third Way"
  To stay consistent without losing the historical data, the board should not simply say "No." They should follow the model of the **Gardeners** case (conditional acceptance).

  **They should offer to accept the ledgers ONLY IF:**
  1.  **Interpretive Framing is Funded:** The donor or the archive must fund a parallel project to interpret the data (e.g., researching the workers' lives outside the ledgers, contextualizing the wages against the cost of living, or interviewing descendants). This satisfies the **Church Records** requirement for interpretation.
  2.  **Access Restrictions are Considered:** Even though the family wants open access, the board should consider the **Gardeners** precedent. If the workers' descendants are local and identifiable, "open access" might cause harm. The board should retain the right to apply sensitivity protocols.
  3.  **Reframing the Catalog:** The finding aid cannot simply be "Plantation Wage Ledgers." It must be cataloged in a way that highlights the power dynamic (e.g., "Owner Records of Labor," not "Worker History").

  ### Summary for the Board
  *   **Closest Precedent:** Church Baptismal Records (Rejected due to lack of interpretation).
  *   **Verdict:** Reject *as is*.
  *   **Reasoning:** Preserving the owner's record of the worker without the worker's context cements the silence the archive claims to fight.
  *   **Path Forward:** Accept conditionally, requiring an interpretive layer that centers the laborers, not just the ledger.

  This approach allows them to save the names (addressing the "Rescue" argument) without violating their ethical stance on power dynamics (addressing the "Asymmetry" argument).
