prompt: |-
  hey, so i'm trying to figure out what our local archive's acquisitions board should do about this new proposal and whether they're being consistent with themselves. here's their track record so far:

  they funded an oral history of factory workers from the 70s strike, even though half the tapes are damaged and some speakers wanted anomymity.

  they turned down a polished memoir collection by three ex-mayors, said it was too self-congratulatory and didn't need public money.

  they said yes to documenting undocumented gardeners' labor histories, but only with pseudonnyms and if the gardeners themselves control the release schedule.

  they rejected digitizing 19th-century church baptismal records because the proposal included zero interpretation of the racial categories baked into the ledgers.

  they also kept a box of handwritten, unsigned notes from a demolished community center, even with no clear authorship and missing pages.

  now there's this new thing: a family is donating complete, beautifully preseved wage ledgers from their plantation business, 1880-1920. every worker listed by name, hours, wages, all in the owner's neat hand. the family wants open access with no restrictions and isn't offering any laborer accounts or framing. some board members argue these ledgers are the only place these workers' names and wages survive, so archiving them rescues people from obscurity; others say that preserving the owner's immaculate record without the workers' own voices just deepens what they've been calling "recording asymmetry" — where the completeness of the source actually cements the silence around the people inside it.

  if they want to stay consistent, what's the call? which past case is the closest analog — the church records, the mayors' memoirs, the factory tapes, or something else? and if their precedents genuinely don't settle it, what's the principle they'd be adopting by saying yes, and what's the principle they'd be adopting by saying no? also, should that "recording asymmetry" idea actually drive the decision, or is it just a fancy phrase that sounds good but doesn't match how they've actually ruled before?
