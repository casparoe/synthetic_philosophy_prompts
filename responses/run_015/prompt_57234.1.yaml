  1. Democratic legitimacy requires all decisive public power to be electorally accountable.
  2. Unelected insulation justifies retaining discretionary reserve powers for crisis management.
  3. Hereditary succession is acceptable only if the office remains purely symbolic and powerless.
  4. The monarch must act solely on cabinet advice with no independent governmental powers.
  5. The monarch must actively intervene to prevent unconstitutional dissolutions when alternatives exist.
  6. Legislative power requires an electoral mandate, unlike headship of state.
  7. Transparency applies to official acts, but private counsel and views remain protected.

  ### Audit Proper

  You have built a package that tries to fuse the Japanese model of symbolic monarchy with the Westminster model of reserve powers. They are mutually exclusive. Here are the conflicts, ranked by severity.

  **1. Point 4 vs. Points 2 and 5 (Structural Contradiction)**
  *   **Conflict:** Point 4 explicitly adopts the Japanese settlement ("no powers related to government"). Points 2 and 5 demand specific governmental powers (refusing dissolution, choosing PM). You cannot have "no powers" and "reserve powers" simultaneously.
  *   **What gives:** Point 4's constraint must go.
  *   **Cost:** You lose the claim that the Japanese model supports your view. It does not.
  *   **Revision:** Adopt the Westminster model of neutrality. The monarch remains politically neutral but retains reserve powers as a constitutional guardian, not a policy initiator.

  **2. Point 3 vs. Points 2 and 5 (Justification Collapse)**
  *   **Conflict:** Point 3 justifies heredity because the office "does nothing." Points 2 and 5 require the office to do something decisive (refuse dissolution, pick PM). If the monarch acts, the "birth lottery is harmless" argument fails.
  *   **What gives:** Point 3's justification must change.
  *   **Cost:** You can no longer argue heredity is harmless *because* the role is empty.
  *   **Revision:** Argue heredity provides continuity *for* the exercise of reserve powers, insulating the decision from partisan cycles.

  **3. Point 1 vs. Points 2 and 5 (Theoretical Tension)**
  *   **Conflict:** Point 1 states unelected offices deciding things are illegitimate. Point 5 admits the monarch would be "picking who governs." This is a direct violation of Point 1's principle.
  *   **What gives:** Point 1 needs an exception clause.
  *   **Cost:** You weaken your democratic purity.
  *   **Revision:** Clarify that reserve powers are not "governing" but "custodial," exercised only to preserve the electorate's ability to choose, not to choose for them.

  **4. Point 7 vs. Point 1 (Accountability Gap)**
  *   **Conflict:** Point 1 demands traceability. Point 7 keeps the PM audience confidential forever. If the monarch influences power (Point 2), secrecy undermines accountability.
  *   **What gives:** Point 7's confidentiality must be limited.
  *   **Cost:** Loss of complete privacy for the monarch's advice.
  *   **Revision:** Keep audience content confidential but require contemporaneous notes be archived for historical review after a set period.

  ### Single Change

  The single change that cleans up the most is to **drop Point 4**.

  Your package is fundamentally Westminster (reserve powers, PM audiences, hereditary peers debate), but Point 4 imports a Japanese constraint that forbids the powers you demand in Points 2 and 5. Removing Point 4 allows you to keep "Reigns doesn't govern" as a principle of neutrality without falsely claiming the monarch has "no powers." It resolves the structural contradiction immediately. Points 1 and 3 will still need tweaking, but they are theoretical tensions; Point 4 is a factual impossibility.

