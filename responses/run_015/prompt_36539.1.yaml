  9.  **Final Polish:** Ensure the distinction between "Strategy-Stealing" (game theory) and "Strategy-Stealing Assumption" (AI safety heuristic) is clear. The AI safety version is actually more about *alignment* stealing (if I can align my AI, you can too) than just capabilities, though the user focuses on capabilities. I should acknowledge both but stick to the user's framing (capabilities/multipolarity). *Correction:* The user specifically mentions "leading AI project cannot obtain a decisive capabilities advantage." I will stick to that, but note that alignment is often the hidden variable.

