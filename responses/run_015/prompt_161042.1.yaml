      *   *Undisclosed-Boundary:* Demote to CP (Folk-Essentialist). Reason: Social kinds are often institutional.
      *   *Re-enlistment:* Keep as NN. Reason: Distinguishes cohort from period.
      *   *Counterfactual:* Keep as NN. Reason: Core causal claim.
      *   *Portability:* Keep as NN. Reason: Generations are not biological species; they are historical.
      *   *Half-Generation:* Keep as NN (refined as "Gradient Membership"). Reason: Sharp cutoffs are statistically indefensible.
      *   *APC Constraint:* Add as NN. Reason: Mathematical necessity.
      *   *Label Asymmetry:* Add as NN (refined as "Label-Dependence Specification"). Reason: Must specify if the name is constitutive or descriptive.

      *Incompatibility:* The "Label-Dependence" requirement clashes with the "Portability/Reality" requirement if one assumes cohorts are objective demographic facts. If cohorts are *interactive kinds* (Hacking), they need the label. If they are *causal kinds* (Mannheim), they don't. I must flag that a single theory cannot easily be both "objective regardless of name" and "dependent on name for causal power." I will side with the Interactive Kind view for *social science explanation* because mere demographic overlap doesn't cause voting without mediation.

      *Killer Constraint:* The **APC Identification Requirement**. It kills 90% of pop-soc accounts because they run regressions without identifying assumptions.
      *Wait, reconsider:* The prompt asks for the one that excludes the most *otherwise-popular* accounts. Pop accounts (Strauss/Howe) don't do regressions. They do narrative. The **Counterfactual Birth-Year Test** kills the narrative accounts because they can't explain *why* the birth year matters other than "fate."
      *Better:* The **Re-enlistment (Persistence) Test**. Most accounts claim "Boomers are X." But if Boomer behavior converges with Gen X behavior as they age, it was an age effect. This kills the "Boomers are selfish" narrative.

      *Let's settle on:* **The Causal Isolation Requirement (combining Counterfactual + APC).** It demands a mechanism that isn't just age or period.

