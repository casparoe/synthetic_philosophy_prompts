answer: |-
  Here is the specification list for an adequate theory of generational cohorts, calibrated for social science explanation.

  ### Desiderata for a Theory of Generational Cohorts

  **1. The Causal Isolation Requirement (APC Compliance)**
  *   **Status:** Non-Negotiable.
  *   **Consideration:** Age, Period, and Cohort are linearly dependent ($Cohort = Period - Age$). You cannot statistically vary one without changing at least one other. Most popular accounts claim "Cohort C behaves differently" without specifying the assumption that identifies the cohort effect distinct from aging or current events. A theory that cannot state its identifying assumption is mathematically incoherent.
  *   **Concrete Test:** The theory must explicitly state the *identifying assumption* used to separate cohort effects from age effects (e.g., assuming age effects are non-linear, or using external instruments). If the theory claims "Boomers are more conservative," it must show this is not merely because "older people are more conservative" (age) or "2024 makes everyone conservative" (period).

  **2. The Re-enlistment (Persistence) Test**
  *   **Status:** Non-Negotiable.
  *   **Consideration:** A cohort effect must be an *imprint*, not a *state*. If the explanatory power of cohort membership decays to zero once the formative event passes, it was a period effect. If it tracks perfectly with biological aging, it is an age effect. To be explanatory, the cohort marker must retain predictive power decades after the formative window closes, controlling for age and period.
  *   **Concrete Test:** Take a trait attributed to a cohort (e.g., Millennial distrust of institutions). Measure it at Time A (during formative years) and Time B (20 years later). The theory must predict that the cohort gap persists at Time B even when the comparison group is at the same *age* the cohort was at Time A. If the gap closes, the theory fails.

  **3. The Contextual Indexicality (Portability) Requirement**
  *   **Status:** Non-Negotiable.
  *   **Consideration:** Generations are not biological subspecies; they are historical relations. A "Depression Generation" exists in the US but not in a country unaffected by the 1929 crash. A theory that posits global generations (e.g., "Gen Z is global") without accounting for local institutional mediation is empirically false.
  *   **Concrete Test:** The theory must predict variance in cohort strength across national boundaries. If the theory claims "Gen Z is anxious," it must explain why this holds in South Korea (high youth unemployment/suicide) but might not hold in a demographic outlier with different economic shocks. If the cohort is real, its boundaries must shift with the boundaries of the causal shock.

  **4. The Gradient Membership Requirement (Half-Generation)**
  *   **Status:** Non-Negotiable.
  *   **Consideration:** Social causation is rarely binary. Sharp birth-year cutoffs (e.g., Dec 31, 1980 vs. Jan 1, 1981) are administrative conveniences, not causal cliffs. A theory insisting on sharp boundaries contradicts the continuous nature of socialization and demographic flow.
  *   **Concrete Test:** The theory must assign *probabilistic* membership weights to "cuspers" (e.g., Xennials). It must predict that someone born in 1979 behaves more like a Gen Xer than someone born in 1985, but less like a Gen Xer than someone born in 1970. If the theory treats 1980 and 1981 as qualitatively distinct kinds, it is falsified by the continuity of social experience.

  **5. The Label-Dependence Specification**
  *   **Status:** Non-Negotiable.
  *   **Consideration:** This addresses the asymmetry of successful vs. failed labels. Does the cohort exist *before* the name (a demographic fact waiting to be discovered) or *because* of the name (an interactive kind where the classification changes the classified)? For social science explanation, this distinction is vital. If the mechanism is "self-identification," the label is constitutive. If the mechanism is "shared exposure," the label is descriptive.
  *   **Concrete Test:** The theory must predict the causal status of "Generation Jones" (a label that largely failed) vs. "Boomer" (a label that succeeded).
      *   *If Descriptive:* Jones members should behave differently from Boomers regardless of label recognition.
      *   *If Constitutive (Looping):* Jones members should *not* show cohesive behavior distinct from Boomers because the feedback loop of the label never closed.
      *   *Verdict:* For *social science explanation* (voting, consumption), the **Constitutive** view is usually required. Mere demographic overlap rarely causes coordination without the label.

  **6. The Undisclosed-Boundary Test (User Proposal)**
  *   **Status:** Camp Preference (Folk-Essentialist). **Discard for Social Science.**
  *   **Consideration:** You asked if this is a prejudice. It is. It assumes cohorts are natural kinds with visible phenotypes (like species). But social kinds (e.g., "veteran," "refugee," "teenager") often require institutional or self-identification to become causally active. People do not "look" like Millennials until the category is available to them.
  *   **Concrete Test:** *Removed from Non-Negotiable list.* A competent observer cannot sort people by generation without cultural cues because the generation *is* a cultural cue. Demanding this privileges a biological metaphor over a sociological one.

  ---

  ### Incompatibility Flag

  There is a tension between **Requirement 3 (Portability)** and a strong version of **Requirement 5 (Label-Dependence)**.
  *   If cohorts are *constituted* by labels (Looping), they cannot be "real" in a country where the label hasn't penetrated, even if the demographic shock occurred (e.g., a "lost generation" in a country that doesn't use the term).
  *   If cohorts are *caused* by shocks (Portability), they should exist regardless of the label.
  *   **Resolution:** For *social science explanation* (voting, behavior), you must choose the **Looping/Constitutive** view. A demographic slice without a label is just data; it does not *explain* action. Therefore, Portability is constrained by Label-Dependence: A cohort is only "real" for explanation where the label mediates the shock. This restricts the portability of "generations" more than demographers like, but it is necessary for explanatory power.

  ---

  ### The Killer Constraint

  **The Causal Isolation Requirement (APC Compliance)** is the single requirement that excludes the most otherwise-popular accounts.

  **Why:** Almost all popular generational theory (Strauss & Howe, popular journalism, marketing decks) relies on narrative storytelling that conflates Age, Period, and Cohort. They observe that 20-year-olds in 1970 were rebellious and 20-year-olds in 2020 are anxious, and they attribute this to "Gen Z vs. Boomers."
  **The Exclusion:** This requirement forces the theorist to admit that without a specific identifying assumption (e.g., "age effects plateau after 30"), they cannot know if the difference is due to the cohort, the era, or the life stage. It renders 90% of existing generational literature technically inadmissible as causal explanation. It forces the move from "Boomers are X" to "People who came of age during Y, controlling for Z, exhibit X."

  ---

  ### Scorecard for Three Contenders

  1.  **The Convention View (Stipulated Reporting Categories):**
      *   *Verdict:* **Fails.** It treats cohorts as purely administrative (like census bins). It satisfies APC compliance by denying causal power, but fails the Re-enlistment Test. It cannot explain why cohort labels motivate political action or identity formation. It is useful for demography, useless for social explanation.
  2.  **The Shared-Formative-Event View (Mannheim/Classical):**
      *   *Verdict:* **Fails.** It posits cohorts as objective historical facts (Descriptive). It passes Portability but fails the Label-Dependence Specification. It cannot explain why "Generation Jones" failed to cohere while "Boomers" did, despite similar demographic positioning. It often violates Causal Isolation by assuming the event *automatically* imprints without mediation.
  3.  **The Deflationary/Looping View (Hacking/Interactive Kinds):**
      *   *Verdict:* **Passes (with caveats).** It treats cohorts as real *because* people believe them to be real. It satisfies Label-Dependence and Re-enlistment (the label persists). It handles the Half-Generation problem well (fuzzy boundaries of identification). It struggles with Portability (requires label diffusion), but this is the correct constraint for *social* science. It is the only view that licenses the claim "she votes this way *because* she is a Millennial" without committing a causal fallacy.

  ---

  ### Least Confident Item

  **The Label-Dependence Specification (Requirement 5).**

  **Reason for Uncertainty:** I have committed to the "Constitutive/Looping" view as necessary for social explanation. However, there is a risk of over-intellectualizing. It is possible that shared material conditions (e.g., housing prices, wage stagnation) create cohort effects *without* the label being internalized. If Gen Z votes differently simply because they are poorer, not because they *call* themselves Gen Z, the Looping view is too strong.

  **What Would Change My Mind:** Longitudinal evidence showing cohesive cohort behavior in populations *unaware* of the generational label (e.g., older cohorts before "Boomer" was coined, or non-Western populations adopting the behavior without the label). If behavior tracks the demographic shock perfectly without the label mediating it, the Constitutive view must be demoted to a Camp Preference, and the Shared-Formative-Event view rehabilitated.
