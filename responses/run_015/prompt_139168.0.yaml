  **To:** Culture & Traditions Committee
  **From:** [Your Name], Student Representative
  **Date:** Thursday, October 26
  **Subject:** Recommendation Regarding the Main Hall Memorial Case

  **Recommendation and Proposed Motion**
  I recommend that the committee vote to retain the memorial case in the main hall, but with immediate changes to how it is managed and who is included. Specifically, I move that the committee adopts a five-year review cycle for the display, beginning on June 1, 2029. Until that review, the current contents remain, but we initiate a formal process to contact the families of those currently displayed to confirm their consent. Regarding new additions, I propose we add Kayla Mbeki's name and items effective November 1, pending family approval, while tabling the request for Mr. Ferreira until the committee defines a separate policy for classified staff versus faculty and students. This approach keeps the memorial active without letting it become permanent clutter. It ensures that remembrance is a choice we make repeatedly, rather than a decision we made once in 2011 and forgot about.

  **Reasoning**
  My position comes down to the difference between neglecting a memory and honoring it. Ms. Okonkwo is right that a school is more than just a building where classes happen; it is a community with a history. When we take down a memorial simply because it is awkward to maintain, we signal that our care for members of this community has an expiration date. However, the current state of the case supports Mr. Brandt's concerns. Dust, faded photos, and curled letters suggest neglect, and neglect turns a memorial into something gloomy. If the case is just left alone forever, it becomes part of the background noise of the hallway, which helps no one.

  By instituting a review cycle and requiring family consent, we solve the stagnation problem without abandoning the duty to remember. A five-year timeline is long enough to provide stability but short enough that the committee knows they will be accountable for it again. Requiring family consent addresses the mental health concern directly. If a sibling or parent finds the display painful, they have a formal channel to say so, and we have a responsibility to listen. If they find it comforting, we have a responsibility to maintain it. This shifts the display from a static monument to grief into an active practice of community care. It acknowledges that while current students may not have known Danny Ruiz or Simone Alvarado, knowing that their school cares enough to keep their memory clean and respected teaches us something about who we are supposed to be.

  **The Opposing View**
  The strongest argument for removing the case comes from the Wellness Committee's perspective on institutional grief. Mr. Brandt argues that schools should not be in the business of curating sadness for students who had no connection to the deceased. From this viewpoint, a permanent display forces every student who walks by to participate in a mourning process they never signed up for. There is validity to the idea that constant visual reminders of death can weigh on the general atmosphere of a school, especially for students already struggling with anxiety or loss. Furthermore, keeping the case open for new additions risks turning the display into a contentious political project where we have to decide whose life was worth more. If we remove the case entirely, we avoid the risk of mishandling grief, we eliminate the maintenance burden, and we allow families to mourn privately without their loved ones becoming a hallway exhibit. This view prioritizes the mental health of the living student body over the memory of the past, arguing that closure is kinder than permanence.

  ***

  ### What I Actually Think

  You asked for my honest take, not just backup. Here it is: **Keep the case, but fix the maintenance.**

  You are losing the argument in your head because you are trying to solve two different problems at once: the philosophical problem (do we owe the dead memory?) and the logistical problem (the case is dusty and some families hate it). Brandt is winning on the logistics because the current situation *is* messy. Okonkwo is winning on the philosophy because she's right that forgetting people feels wrong.

  Your "custodian club" idea was actually smart in theory (active choice vs. passive neglect) but flawed in execution because it made remembrance optional for students. If no club signs up, does Danny Ruiz deserve to be forgotten? That's a bad rule. The Committee itself should be the custodian. You are the Culture & Traditions Committee. This *is* culture. This *is* tradition. It belongs in your lane, not a volunteer club's lane.

  The "Review Cycle" I wrote into the document above is the compromise. It tells Brandt: "We hear you, we won't let this sit forever." It tells Okonkwo: "We hear you, we aren't deleting history." It tells the families: "We will ask you before we act."

  ### Handling Ms. Devereaux and the "Noise"

  Ms. Devereaux wants to avoid parent emails. The only way to do that is **proactive communication.**

  If you vote to keep the case without contacting Danny's sister, she will email the principal. If you vote to remove it without contacting Danny's mom, she will email the principal. You cannot avoid the noise by hiding; you avoid it by listening first.

  **Here is the play for Friday:**
  1.  **Frame the vote as "Policy," not "Final Decision."** Tell Ms. Devereaux that the vote on Friday is to adopt the *process* (the 5-year review and family consent protocol), not to finalize the contents immediately.
  2.  **The "Quiet Period."** Propose that between the vote and November 1, the Committee reaches out to the families of the three current names plus Kayla Mbeki. Say: "We are updating our memorial policy. We want to know if this display is comforting or painful for you."
  3.  **The Shield.** If parents get mad, Ms. Devereaux can say: "The student committee is currently conducting a family consent review. We are waiting on their feedback before making changes." This buys time and shows care. It turns a "No" into a "We are listening."

  If you go into Friday with a plan that includes contacting families *before* changes happen, Devereaux will feel safer. It shows you aren't just kids voting on feelings; you're managing a process. Good luck. You're doing a good job thinking this through.
