  Distributional program equilibrium occupies a structurally distinct intermediate regime between standard Bayesian Nash equilibrium and exact program equilibrium, provided that agents model opponents as samples from a shared parameterized family with bounded simulation capacity rather than as either independent rationalizers or identical source code. This proposal argues that the current dichotomy in decision theory—where agents are treated either as causally isolated entities maximizing expected utility based on independent priors, or as logically identical copies capable of perfect mutual prediction—fails to capture the realistic conditions of modern strategic interaction, particularly among AI systems derived from common base models or human reasoners sharing cultural and cognitive architectures. The core claim is that by relaxing the identity assumption of program equilibrium to a probabilistic similarity assumption, constrained by computational bounds on simulation, we can derive equilibrium conditions where cooperation scales continuously with a similarity parameter, avoiding the discontinuous collapse into defection that characterizes standard causal decision theory while remaining robust to the noise that invalidates exact program equilibrium. This independent study will formalize this framework, termed Distributional Program Equilibrium (DPE), derive its conditions for the Prisoner's Dilemma and continuous bargaining games, and determine whether the cooperative benefits of logical correlation survive the introduction of parameter uncertainty and bounded compute.

  The justification for this claim rests on the observation that existing formalizations of acausal decision theory and program equilibrium rely on a brittle assumption of source-code identity. In the standard model, two agents cooperate in a one-shot Prisoner's Dilemma because each can simulate the other perfectly, knowing that their own output determines the opponent's output via logical identity. If I cooperate, my simulation of you shows you cooperating, because you are running the same algorithm I am. This yields a cooperative equilibrium that dominates the Nash equilibrium of defection. However, this model breaks down immediately upon the introduction of any noise. If my source code differs from yours by even a single bit, the logical identity is severed. In the strict formalism, this often implies a collapse back to standard Nash reasoning, where the logical link is treated as non-existent, and defection becomes dominant again. This discontinuity is theoretically unsatisfying and empirically implausible. Real-world agents, whether biological or artificial, are never identical copies. Human beings share neural architectures and cultural training but differ in specific weights and experiences. AI models are fine-tuned from common base weights but diverge through distinct training histories or random seeds. To treat these agents as either perfectly identical or completely independent is to ignore the structural correlations that exist in the parameter space of their decision-making algorithms.

  Conversely, standard Bayesian Nash equilibrium assumes that agents are independent except for common knowledge of the game structure and priors over types. It captures statistical correlation but fails to capture logical correlation. In Bayesian Nash, if I decide to cooperate, this action provides evidence about my type, which might update my belief about your type if our types are correlated, but it does not causally or logically determine your action. The feedback loop required for the cooperative equilibrium in program equilibrium—the knowledge that my decision procedure *is* the reason for your decision—is absent. Bayesian Nash treats the opponent's move as a fixed probability distribution conditional on types, rather than as the output of a function that takes my function as input (directly or via simulation). This leads to the standard defection outcome in one-shot dilemmas unless external mechanisms (reputation, enforcement) are introduced. The gap, therefore, is a model that retains the logical structure of program equilibrium—where agents reason about each other as algorithms—while incorporating the probabilistic uncertainty of Bayesian games—where agents are not identical but similar.

  The hypothesis driving this study is that there exists a continuous transition between these regimes. If agents share a common prior over a family of programs parameterized by $\theta$, and each agent knows their own $\theta_i$ but not the opponent's $\theta_j$, they can still perform bounded simulations of the opponent's program using their own code as a heuristic or base model. The degree to which this simulation yields accurate predictions depends on the distance between $\theta_i$ and $\theta_j$ in the parameter space. If the distance is small, the simulation is accurate, and logical correlation remains high enough to support cooperation. If the distance is large, the simulation fails, and the agents revert to Bayesian reasoning. The critical question is whether there is a stable intermediate equilibrium where the cost of simulation and the uncertainty of the opponent's parameter still permit cooperation at rates higher than Nash but lower than perfect program equilibrium, and whether this cooperation degrades smoothly as similarity decreases. This study posits that such a regime exists and is formally definable, offering a more robust foundation for decision theory in contexts involving similar but non-identical reasoners.

  The significance of resolving this question extends beyond abstract game theory. It addresses a central concern in the alignment and interaction of artificial intelligence systems. As AI models are deployed into multi-agent environments, they will often be instances of similar architectures trained on similar data. If their interaction dynamics are governed by standard Nash equilibrium, we expect competitive, defection-heavy outcomes in dilemmas. If they are governed by exact program equilibrium, we might expect robust cooperation, but only under the unrealistic assumption of perfect code transparency and identity. A distributional model provides a realistic middle ground, predicting levels of cooperation based on measurable similarity metrics (e.g., weight distance, architectural overlap) and computational constraints. Furthermore, it clarifies the philosophical status of "logical correlation." Is logical correlation a binary property that exists only between identical algorithms, or is it a graded property that decays with algorithmic distance? By formalizing DPE, we can test whether the normative force of functional decision theory extends to non-identical agents, or whether it is an artifact of the identity assumption.

  Existing treatments leave this intermediate regime open because they prioritize mathematical tractability over realistic modeling of algorithmic similarity. The original formulations of program equilibrium focus on the existence proof of cooperation via quining or perfect simulation. Introducing probability distributions over code complicates the fixed-point arguments significantly. Conversely, Bayesian game theory prioritizes the handling of uncertainty but abstracts away the internal structure of the agents, treating them as black boxes with type-dependent payoff functions. Neither framework is equipped to handle agents that are transparent algorithms *and* probabilistic variants of one another. Some recent work in logical induction and functional decision theory has touched on uncertainty about logical facts, but a dedicated model for parameterized program families with bounded simulation budgets remains undeveloped. This study aims to fill that gap by constructing a specific formal model that bridges the two extremes, rigorously testing the stability of cooperation under relaxation of the identity axiom.

  The methodology for this study is structured to move from definition to derivation to comparison over a five-month period. The first month is dedicated to formalizing the environment. This involves defining the parameterized family of programs $\mathcal{F} = \{P_\theta : \theta \in \Theta\}$, where $\Theta$ is a metric space representing the parameter space. We must define a distance metric $d(\theta_i, \theta_j)$ that correlates with behavioral similarity. Crucially, we must define the simulation budget. Agents cannot run infinite loops; they have a computational bound $B$. The simulation of $P_{\theta_j}$ by $P_{\theta_i}$ must be bounded by $B$ steps. If the simulation does not halt within $B$, the agent must rely on a prior belief about the output. We also need to define the belief-updating rule. Upon observing its own parameter $\theta_i$, an agent updates its belief about $\theta_j$ based on the common prior. This creates a correlation structure. The output of Month 1 will be a rigorous definition of the DPE game form, specifying the utility functions, the information sets, and the allowable strategies (which include partial simulation).

  The second month focuses on deriving equilibrium conditions for the Prisoner's Dilemma. We will set up the payoff matrix and analyze the decision rule for an agent $P_{\theta_i}$. The agent chooses an action $a \in \{C, D\}$ to maximize expected utility, where the expectation is taken over the simulated output of the opponent. The simulation output is a probability distribution over $\{C, D\}$ that depends on the accuracy of the simulation, which in turn depends on $d(\theta_i, \theta_j)$. We will look for a threshold function $\tau$ such that if the expected similarity is above $\tau$, cooperation is the dominant strategy. We will investigate whether this threshold is stable under best-response dynamics. Does an agent have an incentive to modify its parameter $\theta$ to appear more similar to the population average to induce cooperation, or to appear distinct to exploit cooperators? This month will produce the core lemmas regarding the existence of cooperative equilibria in the discrete case.

  The third month extends the analysis to the continuous split-the-dollar game. This is critical because the Prisoner's Dilemma is binary, which might hide nuances in the gradient of cooperation. In a continuous game, agents propose a split of a resource. We will analyze whether the distributional model predicts smooth adjustments in demand based on similarity. If I know you are very similar to me, I might demand less, anticipating you will do the same, leading to an efficient split. If you are dissimilar, I might demand more, anticipating conflict. We will check for uniqueness of equilibrium and prior-dependence. Does the result depend heavily on the specific shape of the prior distribution over $\Theta$? We will also examine consistency conditions: if agents update their beliefs about the family based on observed interactions, does the equilibrium converge or diverge over time? This month aims to generalize the results from the binary case to a more robust continuous setting.

  The fourth month is dedicated to comparison and sensitivity analysis. We will compare the DPE predictions with standard Bayesian Nash Equilibrium (BNE) and exact Program Equilibrium (PE). We will isolate the parameters where the three models diverge. Specifically, we look for regions in the parameter space where BNE predicts defection, PE predicts cooperation, and DPE predicts a mixed or conditional strategy. We will also test the sensitivity of the model to the simulation budget $B$. If $B$ is too low, does DPE collapse to BNE? If $B$ is high enough, does it approach PE? This month involves running theoretical simulations (thought experiments grounded in the formalism) to map the phase transitions between the regimes. We will also address potential objections regarding the common prior assumption. If agents disagree on the family distribution, does the equilibrium hold?

  The fifth month is for synthesis, writing, and revision. The goal is to assemble the definitions, lemmas, and comparative analysis into a coherent document. This involves refining the notation, ensuring the arguments are watertight, and clarifying the philosophical implications. We will review the success criteria to ensure the final document meets the standards of a formal independent study. This month also includes a risk assessment: if the derivation shows that DPE collapses to BNE under reasonable assumptions, the document must honestly report this negative result as a finding that the intermediate regime is unstable. The final output will be a self-contained theoretical paper suitable for discussion in decision theory forums or submission as a writing sample for further academic work.

  To elaborate on the formal framework required in Month 1, we must be precise about the nature of the "program." In standard program equilibrium, a program is a Turing machine that takes the opponent's source code as input. In DPE, the program is a member of a parametric family. Let $\Theta$ be a compact subset of $\mathbb{R}^n$. Each $\theta \in \Theta$ defines a program $P_\theta$. The agents know the mapping $\theta \mapsto P_\theta$ and the prior distribution $\pi(\theta)$. Agent 1 draws $\theta_1 \sim \pi$, Agent 2 draws $\theta_2 \sim \pi$. They observe their own $\theta$ but not the opponent's. The game proceeds by each agent submitting an action. However, the action is determined by the program $P_\theta$, which may include a simulation step. The simulation step involves running $P_{\hat{\theta}}$ where $\hat{\theta}$ is Agent 1's estimate of Agent 2's parameter. The estimate is derived from $\theta_1$ and the prior $\pi$. If $\theta_1$ and $\theta_2$ are correlated (e.g., drawn from a cluster), $\theta_1$ provides information about $\theta_2$.

  The critical innovation in this framework is the bounded simulation. In exact PE, the simulation can be perfect because the code is identical, allowing for fixed-point solutions (e.g., "I do what you do"). In DPE, $P_{\theta_1}$ running $P_{\theta_2}$ may not halt, or may halt with a different output than $P_{\theta_2}$ would produce on its own due to resource constraints or internal randomness. We model this by introducing a success probability function $S(d(\theta_1, \theta_2), B)$, which represents the probability that the simulation yields the correct prediction of the opponent's action within budget $B$. This function must be monotonically decreasing in distance and increasing in budget. The agent's expected utility calculation then becomes a weighted sum: $EU(a) = S \cdot U(a, \text{simulated\_opp\_action}) + (1-S) \cdot U(a, \text{prior\_belief\_opp\_action})$. This formulation explicitly blends the logical correlation (via the simulation term) and the statistical correlation (via the prior belief term). The equilibrium condition is a fixed point where the actions chosen by $P_\theta$ for all $\theta$ are mutually consistent given these utility calculations.

  A major technical challenge anticipated in Month 1 and 2 is defining the metric $d(\theta_1, \theta_2)$. Behavioral distance (probability of different output on random inputs) is ideal but hard to compute from parameters alone. Parameter distance (Euclidean distance in weight space) is easier but may not correlate perfectly with behavior due to non-linearities in the program logic. For the sake of tractability in a one-semester study, we will assume a simplified model where behavioral distance is bounded by parameter distance via a Lipschitz constant. This allows us to use parameter distance as a proxy for simulatability. We must state this assumption clearly as a limitation. If the relationship between parameter distance and behavioral distance is discontinuous (e.g., chaotic systems), the DPE model might not yield smooth transitions. We will assume a "smoothness prior" on the family $\mathcal{F}$ to ensure the continuity results we are looking for are possible.

  Another key definition is the "belief-updating rule." In standard Bayesian games, types are independent unless specified otherwise. Here, the "type" is the parameter $\theta$. The correlation arises from the sampling process. We might model this as $\theta_2 = \theta_1 + \epsilon$, where $\epsilon$ is noise. This creates a direct statistical link. Alternatively, we might model them as independent draws from a mixture model where the mixture component is unknown. The former (correlated noise) is more conducive to the "shared base model" intuition (e.g., fine-tuning). We will adopt the correlated noise model for the primary analysis, as it best captures the intuition of "similar but not identical." Agent 1 knows $\theta_1$ and knows $\theta_2 \sim N(\theta_1, \sigma^2)$. The parameter $\sigma$ becomes the "similarity parameter." As $\sigma \to 0$, we approach exact PE. As $\sigma \to \infty$, we approach independent BNE. The study will analyze the behavior of the equilibrium cooperation rate as a function of $\sigma$.

  In Month 2, deriving the equilibrium conditions for the Prisoner's Dilemma requires solving the fixed-point equation for the cooperation probability. Let $p(\theta)$ be the probability that agent with parameter $\theta$ cooperates. In a symmetric equilibrium, $p(\theta)$ should be a function of the expected similarity. The agent cooperates if $EU(C) > EU(D)$.
  $EU(C) = S(\sigma) \cdot [R \cdot p(\theta) + P \cdot (1-p(\theta))] + (1-S(\sigma)) \cdot [R \cdot \bar{p} + P \cdot (1-\bar{p})]$
  $EU(D) = S(\sigma) \cdot [T \cdot p(\theta) + S \cdot (1-p(\theta))] + (1-S(\sigma)) \cdot [T \cdot \bar{p} + S \cdot (1-\bar{p})]$
  Where $R, P, T, S$ are standard PD payoffs, and $\bar{p}$ is the population average cooperation rate. Note that in exact PE, $p(\theta)$ is perfectly correlated with the opponent's action, so the simulation term dominates. In BNE, $S=0$, so only the prior term matters. In DPE, both matter. We need to solve for $p(\theta)$ such that this inequality holds consistently across the distribution of $\theta$. We anticipate a threshold strategy: agents with "central" parameters (high expected similarity to the population) cooperate, while outliers defect. Or, more likely, a smooth gradient where cooperation probability decreases as distance from the mean increases. Deriving this function explicitly will be the main technical result of Month 2.

  Month 3's focus on uniqueness and prior-dependence is crucial for validating the model's robustness. In many game-theoretic models, multiple equilibria exist (e.g., all-cooperate vs. all-defect). We need to determine if DPE selects a unique equilibrium or if it inherits the multiplicity of PE. If multiple equilibria exist, we need a selection criterion. Furthermore, we must check if the results depend on the specific form of the prior $\pi(\theta)$. If we change from a Gaussian prior to a Uniform prior, does the cooperation threshold change drastically? A robust theory should not be overly sensitive to arbitrary choices of prior shape, provided the variance is constant. We will also examine consistency conditions regarding the simulation budget. If agents can choose their budget $B$ at a cost, what is the equilibrium budget? If simulation is costly, agents might choose low $B$, collapsing the model to BNE. If simulation is cheap, they choose high $B$, approaching PE. This adds a layer of endogenous complexity that we may touch upon if time permits, but the primary focus will be on fixed $B$ to ensure completion.

  Month 4's comparative analysis will involve plotting the cooperation rates against the similarity parameter $\sigma$ for all three models (BNE, DPE, PE). We expect BNE to be a flat line at the Nash rate (usually 0 cooperation in one-shot PD). We expect PE to be a flat line at the cooperative rate (usually 1). We expect DPE to be a curve connecting these two, potentially sigmoid in shape. The "non-trivial result" required for success is demonstrating that this curve is not just an artifact of mixing strategies but arises from the structural properties of the equilibrium conditions. We must show that the agents are not simply randomizing between Nash and PE strategies, but are playing a distinct strategy optimized for the distributional environment. We will also isolate the divergence points: at what level of $\sigma$ does DPE become indistinguishable from BNE? This defines the "radius of logical correlation."

  Success for this independent study is defined by two main deliverables: a clean formalization of the DPE framework and at least one non-trivial theorem or derived result showing the intermediate behavior. The formalization must be rigorous enough to withstand scrutiny from a decision theorist; definitions must be unambiguous, and assumptions must be explicit. The non-trivial result should demonstrate that cooperation scales smoothly with the similarity parameter $\sigma$ and the simulation budget $B$, and that this scaling is not reducible to a simple mixture of Nash and Program Equilibrium outcomes. For example, showing that there exists a range of $\sigma$ where the unique equilibrium involves partial cooperation that is strictly higher than Nash but strictly lower than PE, and that this equilibrium is stable under best-response dynamics, would constitute success. Additionally, success involves clarifying the conditions under which the model collapses. If we prove that for any $\sigma > 0$, the equilibrium collapses to Nash due to the instability of partial simulation, this is also a successful result (a negative result), provided the proof is sound. It clarifies the landscape by ruling out the intermediate regime.

  Failure conditions must be specified honestly to maintain intellectual integrity. The primary failure mode is if the relaxation of identity immediately destroys the logical correlation required for cooperation. If the model shows that any non-zero probability of difference leads agents to treat each other as independent (due to risk dominance or similar criteria), then DPE does not occupy a distinct regime; it is merely Program Equilibrium with a fragile boundary. Another failure mode is if the model relies on hidden assumptions that effectively restore identity. For example, if the belief-updating rule requires agents to know the opponent's parameter with high precision to simulate, then the "distributional" aspect is nominal, and the model reduces to a game of incomplete information that solves to Nash. A third failure mode is intractability. If the equilibrium conditions cannot be solved analytically or approximated meaningfully within the scope of the semester, the study may remain descriptive rather than derivational. We will mitigate this by focusing on simplified parametric families (e.g., linear thresholds) rather than general Turing machines.

