answer: |-
  Here are the candidate desiderata that occur to me, including the ones I am inclined to reject. We need administrability, meaning the rules must be decidable by a caseworker with limited evidence. We need robustness, meaning states cannot game the system by degrading their own capacity. We need universality, meaning every person with the status has some state who owes them admission. We need causal tracking, meaning duties align with responsibility for the displacement. We need self-determination, meaning states retain control over membership. We need impartiality, meaning no discrimination among claimants. We need non-conditionality, meaning admission is not based on usefulness. I am cutting causal tracking and self-determination as disguised conclusions. Causal tracking is a substantive theory of justice, not a constraint on the framework; demanding it pre-judges the allocation question. Self-determination is often the variable we are trying to constrain, not a fixed boundary; insisting on it as a desideratum simply validates exclusion. I am also cutting strict impartiality as a non-negotiable, because associative duties might legitimately prioritize certain claims without rendering the account inadequate, provided the baseline is met. The core constraints must be about the machinery of decision and the stability of the system under stress, not the moral distribution of outcomes.

  For your operational purpose, the specification must distinguish sharply between the criteria that generate the status and the criteria that allocate the duty. An adequate account must deliver a definition of the class that is evidence-sensitive but not hindsight-dependent, and an allocation mechanism that persists when other states default. Administrability is non-negotiable because a guidance document that requires adjudicators to resolve counterfactuals no evidence bears on will fail in the interview room. Robustness to strategic behaviour is also non-negotiable; if the account allows a state to extinguish its duty by dismantling its reception system, the guidance is politically indefensible and operationally futile. However, I would demote the requirement that duties must track causal responsibility. In composite causation cases, precise shares are unknowable, making this administratively impossible. I would also demote the requirement that states must never require admission without consent, if by consent you mean specific approval for each individual; this collapses under partial compliance. The requirement that admission must not be conditional on usefulness is non-negotiable for the integrity of the protection regime, but the requirement that duties must respect a state's claimed right to determine membership is a preference for sovereignty over protection and should be treated as a variable to be balanced, not a hard constraint.

  Consider the cases you listed to see what distinctions they probe. The non-state actor cases probe the distinction between state willingness and state capacity; an account must specify whether the duty triggers on the absence of protection or the presence of persecution, and who owes protection when the state is unable versus unwilling. The climate atoll case probes the distinction between agentless harm and persecutory harm; an account must say whether the duty arises from the harm itself or the political relationship broken by the harm. The denationalised dissident probes the distinction between jurisdiction and nationality; an account must identify the duty-bearer when the state of nationality has severed the legal tie. The pre-emptive flight case probes the distinction between risk assessment and factual occurrence; an account must specify the epistemic standard for well-foundedness without requiring the adjudicator to know the future. The composite causation flow probes the feasibility of causal tracking; an account must either abandon causal precision or provide a heuristic for shared liability. The rich state closing routes probes robustness; an account must treat self-induced incapacity as irrelevant to duty. The offshoring and chain removal cases probe the distinction between owing admission and owing protection; an account must specify whether outsourcing discharges the duty or merely relocates the performance, and whether the duty persists if the third country fails. The post-conflict return case probes the temporal shape of the duty; an account must distinguish between temporary safety and permanent membership, and handle the transition when return ceases to be foreseeable. The protracted situation and adjacent hosting cases probe the distinction between individual entitlement and collective burden-sharing; an account must say whether a state discharges its duty by funding camps elsewhere or must admit individuals directly.

  Now for the incompatibilities. You suspect a trilemma between universal coverage, causal responsibility, and no duty without causation. You are correct. If only the persecutor caused the displacement, and the persecutor cannot owe asylum to its own victims, and uninvolved states owe nothing without causation, then the status exists without a duty-bearer. To resolve this for your purpose, you must drop the requirement that duty tracks specific causal responsibility. Causal responsibility is too brittle for operational allocation; it leaves gaps where protection is needed most. A second unsatisfiable subset involves universal coverage, state consent on specific admissions, and partial compliance. If every state must consent to each individual, and some states refuse, the complying states cannot absorb the remainder without violating the consent constraint or leaving claimants unprotected. Here, you must drop the requirement for specific consent in favour of a quota or allocation mechanism that binds states even when they prefer not to admit. A third subset involves temporary protection, non-refoulement, and protracted displacement. If protection is temporary because return is expected, but return becomes impossible, the duty evaporates while the risk remains. You must drop the temporal limitation and acknowledge that temporary status must convert to permanent when return is no longer foreseeable. The single requirement that does the most exclusionary work is this: duties must track specific causal responsibility for the individual displacement. This is a theorem of exclusion because causation in displacement is almost always composite, historical, or unknowable; insisting on it knocks out almost all claimants from the class of those owed duties by any specific state, leaving the duty in the abstract but unassigned in practice.

  Finally, a scorecard over the main families of account. Capacity-based accounts fail the robustness test because they reward states for degrading their own capacity to reduce their share. Causal or historical-responsibility accounts fail the administrability test because causal shares in composite flows cannot be computed by caseworkers. Proximity or first-asylum accounts fail the equity test because they burden low-income adjacent states and allow distant rich states to opt out. Associative or special-ties accounts fail the universality test because they leave claimants with no ties to any willing state without a duty-bearer. Fair-share or global-distribution accounts struggle with partial compliance; they need a mechanism to redistribute the share of defaulting states without overburdening compliers beyond breaking point. Consent or self-determination based accounts fail the robustness test because they allow states to close routes and dismantle systems to avoid duty. Market or tradable-quota based accounts fail the non-conditionality test because they make protection contingent on financial valuation rather than need. Only a hybrid that separates status generation from duty allocation, treats self-induced incapacity as irrelevant, and accepts that duties may fall on states without direct causal involvement survives the specification. You must build your guidance on the premise that the existence of the duty is distinct from the identity of the bearer, and that the identity of the bearer is determined by a robust allocation rule rather than historical guilt or immediate capacity.
