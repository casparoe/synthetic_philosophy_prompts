answer: |-
  The pill organizer was a bright, toxic orange, sitting on the table like a warning beacon. It was Tuesday. Blue compartment.

  Leo watched his mother's hand hover over the coffee mug. Her fingers trembled, just slightly, a vibration that hadn't been there six months ago. She pulled the mug back before it touched her lips.

  "I'm not hungry," she said.

  "It's not food, Mom. It's the Donepezil. We talked about this."

  "I know what it is." Her voice was sharp, the way it used to be when she corrected his grammar at the dinner table. But her eyes were darting around the kitchen, landing on the fridge, the window, the floor, as if the room were slowly rearranging itself. "I don't need you watching me swallow."

  Leo felt the familiar tightening in his chest. He'd spent the last three weeks reading those essays on his phone during his commute, the ones about the fortress of the mind. *Some things are up to us, some are not.* It was clean logic. It was supposed to be armor.

  But the armor didn't fit. The old philosophy assumed you were a single, intact unit. It assumed the skin was a solid border. With Mom, the skin was permeable. His anxiety was her stress; her confusion was his panic. The control wasn't staying in its lane.

  He looked at the orange box. If he forced her, he broke her spirit. If he let her be, he broke her health. The dichotomy said: *Her body is not up to you. Her choice is hers.* But the disease was stealing her ability to choose rationally. So was her refusal "up to her"? Or was the disease the external factor, and she was the internal victim?

  Leo took a breath. He tried the old rule: *Detach.* He imagined a wall between them.
  *Result:* Mom glared at him, pushed her chair back, and stood up. "I'm going to lie down."

  The wall didn't work. It just isolated her.

  Leo stood up too, blocking the path to the hallway. Not aggressively, just... present. He needed a new map. He thought about the concept he'd been scribbling in the margins of his notebook: *Distributed Control.*

  The idea was that agency wasn't a possession you kept in your pocket. It was a baton. Sometimes he held it. Sometimes she held it. Right now, she was dropping it, but she was angry that her hands were shaking. If he grabbed it too fast, she'd fight. If he let it hit the ground, she'd fall.

  He had to hold the baton *with* her.

  "Okay," Leo said, softening his shoulders. He sat back down. "You're right. It's annoying. I hate watching you take them too."

  She paused, one hand on the chair back. She hadn't expected agreement. "It feels like... like I'm being managed. Like a project."

  "You're not a project." Leo reached out and slid the orange box toward the center of the table, into the space between them. "But the memory thing... it's tricky. It's like when you taught me to drive. You had the brake on your side, and I had the wheel."

  "I was a good teacher," she murmured, her defensiveness slipping.

  "The best. But right now, the car is stalling. I'm not trying to take the wheel. I'm just... I'm the passenger reading the map. You still drive."

  He pushed the blue compartment open. He didn't take the pill out. He left it in the plastic.

  "Here's the deal," Leo said. "This pill? This is your job. Deciding when it goes in your mouth. That is one hundred percent your sphere. I can't do that for you. But getting the box open, and remembering that it's Tuesday... that's my job. That's the map reading."

  He was redefining the boundary. He wasn't claiming control over her body. He was claiming control over the *context*, and offering her control over the *action*. He was making the refusal belong to him (the setup) and the acceptance belong to her (the execution).

  Mom looked at the pill. She looked at Leo. The anger was still there, but the panic had receded. She needed to feel like the agent, not the object.

  "I don't want the water," she said.

  "Fine. No water. Dry swallow. Your call."

  She sat back down. The air in the kitchen shifted. It wasn't peaceful, exactly. It was heavy, like the moment before a storm breaks. She reached out. Her fingers brushed the plastic blister pack.

  Leo held his breath. This was the leak. If she refused, his day would be ruined. He would be angry at the disease, then guilty for being angry, then worried about her decline. His peace was tethered to her compliance. The old essays said that was a failure of character. Leo thought that was just biology. You love someone, you share a nervous system.

  She popped the foil. The sound was loud in the quiet room.

  She put the pill on her tongue. She didn't swallow immediately. She looked at him, challenging him to celebrate, to rush her, to take the credit.

  Leo looked at his own coffee. Cold. He took a sip. "I need to fix the leak under the sink later," he said to the table. "And I have that meeting at ten."

  He gave her the space. He didn't watch her throat. He looked at his phone. He ceded the audience.

  She swallowed.

  "Done," she said.

  "Thanks," Leo said. He didn't say *good job*. He didn't say *I told you so*. He just closed the orange box.

  He realized then that the control hadn't returned to him. It hadn't stayed with her either. It had existed in the transaction. The "sphere" wasn't a circle drawn around a person; it was the overlap.

  Mom stood up again, smoother this time. "The sink is leaking because you're using the wrong washer. It's in the junk drawer."

  "I'll check the junk drawer."

  "Don't check it. Just fix it."

  "I'll fix it."

  She walked out of the kitchen. Leo listened to her footsteps fade down the hall. He looked at the orange box. He knew tomorrow she might refuse again. He knew the disease would eat more of the map until he was driving the car entirely, and she was just a passenger looking out the window.

  But for today, the baton had passed.

  Leo picked up his phone. He opened the notes app where he'd been drafting his own rules. He deleted the line: *Accept what you cannot change.*

  He typed: *Hold what she cannot carry. Let go when she can grasp.*

  He finished his cold coffee. It tasted bitter, but it was his.
