prompt: |-
  Please construct a rigorous argument for the view that computational intractability—specifically, the NP-hardness of exact aggregation rules exemplified by optimal consensus-ranking problems such as Kemeny-Young—constitutes an epistemic, rather than merely practical, failure for normative theories that require rational agents to compute their prescriptions. Contrast this intractability-based critique with the familiar demandingness objections raised against consequentialism, showing precisely why the former targets explanatory accessibility and justified belief in a theory’s outputs rather than motivational cost or psychological burden. Then address the counter-argument that polynomial-time approximation schemes (for instance, Markov-chain Monte Carlo sampling for ranking aggregation) salvage the normative theory by substituting tractable computation for exact solution, and explain why this reply misses the epistemic point. Avoid bibliographic references, reading lists, and author citations; develop the argument solely from the conceptual connections among tractability, normative obligation, and the conditions under which a prescription can be genuinely understood and endorsed by the agents to whom it applies.
reasoning: |-
  Here's a thinking process that leads to the argument above:

  1.  **Deconstruct the Prompt:**

      *   **Core Thesis:** Computational intractability (specifically NP-hardness in aggregation rules like Kemeny-Young) is an *epistemic* failure for normative theories requiring rational agents to compute prescriptions, not just a *practical* one.
      *   **Contrast:** Distinguish this from "demandingness objections" against consequentialism (motivational/psychological burden vs. explanatory accessibility/justified belief).
      *   **Counter-Argument:** Address the reply that polynomial-time approximation schemes (PTAS) or sampling (MCMC) salvage the theory.
      *   **Rebuttal to Counter-Argument:** Explain why approximations miss the *epistemic* point (normative authority requires understanding/endorsement of the specific prescription, not just a close guess).
      *   **Constraints:** No bibliographic references, reading lists, or author citations. Focus on conceptual connections among tractability, normative obligation, and conditions for genuine understanding/endorsement.

  2.  **Initial Brainstorming & Concept Mapping:**

      *   *Normative Theory:* Tells agents what they ought to do (or believe/rank).
      *   *Rational Agent:* Assumed to be capable of following the theory's logic.
      *   *Kemeny-Young:* Finding the ranking that minimizes disagreement with individual preferences. It's NP-hard.
      *   *Intractability:* As $n$ grows, time/resources explode. No efficient algorithm exists (assuming $P \neq NP$).
      *   *Epistemic Failure:* The agent cannot *know* the prescription is correct. It's not just "too hard to do," it's "impossible to verify/derive."
      *   *Demandingness:* "Utilitarianism asks too much sacrifice." (Psychological/Motivational).
      *   *Tractability Critique:* "This theory asks for a calculation that cannot be cognitively grasped." (Cognitive/Justificatory).
      *   *Approximation:* "Close enough is good enough."
      *   *Rebuttal:* Normativity often demands specific correctness (e.g., justice, truth), not proximity. If I can't distinguish the optimal from the near-optimal, I can't endorse the optimal *as* optimal.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define the scope. Normative theories often imply a procedure for determining the right action/state. If that procedure is computationally opaque, the theory fails to guide.
      *   **The Epistemic Nature of Intractability:**
          *   Standard view: Intractability is a resource problem (time/memory).
          *   Argument view: It's a knowledge problem. To be bound by a rule, one must be able to identify its application.
          *   Kemeny-Young example: To know the "true" consensus, one must solve an NP-hard problem. If $P \neq NP$, no efficient path exists.
          *   Consequence: The agent cannot form a *justified belief* that a specific ranking is the prescribed one. They are guessing, even if using heuristics.
      *   **Contrast with Demandingness:**
          *   Consequentialism (e.g., Utilitarianism): "You must save the drowning child instead of going to the movies."
          *   Demandingness Objection: "That's too hard emotionally/financially."
          *   Distinction: The agent *knows* what to do (calculate utility), but doesn't *want* to or *can't bear* the cost.
          *   Tractability Objection: The agent *cannot know* what to do, even if they wanted to with infinite resources (within reasonable time bounds). It attacks the *intelligibility* of the obligation, not the *cost* of fulfilling it.
          *   Key phrase: "Ought implies Can" vs. "Ought implies Knowable."
      *   **The Approximation Reply:**
          *   Objection: We don't need exact solutions. MCMC or PTAS gives high probability of near-optimality.
          *   Why this fails epistemically:
              1.  *Normative Precision:* Many normative concepts (justice, rights, truth) are binary or threshold-based, not gradient. Being "close" to justice isn't just.
              2.  *Verification:* Even if I have an approximate solution, I often cannot verify *how* close it is without solving the hard problem (the gap problem).
              3.  *Endorsement:* Rational endorsement requires understanding *why* this is the right answer. A black-box sampler provides output without intelligible justification.
      *   **Conclusion:** Summarize. Intractability undermines the normative force because it severs the link between the agent's reasoning and the theory's verdict.

  4.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check:* Did I cite anyone? *No.*
      *   *Check:* Is the distinction between epistemic and practical clear? *Need to emphasize that "practical" usually means "costly," whereas "epistemic" means "unjustifiable."*
      *   *Check:* Is the Kemeny-Young example integrated well? *Use it to illustrate the specific structural barrier, not just as a passing mention.*
      *   *Check:* Is the approximation rebuttal strong? *Focus on the loss of justification. If I use a heuristic, I believe the result is *likely* good, not that it is *right*. Normative obligation usually binds us to the Right, not the Probable.*
      *   *Tone:* Rigorous, philosophical, analytical. Avoid colloquialisms.

  5.  **Final Review against Constraints:**
      *   No references? (Confirmed)
      *   Focus on conceptual connections? (Confirmed)
      *   Address all parts of the prompt? (Confirmed: Intractability as epistemic, Contrast with demandingness, Approximation reply & rebuttal).

  6.  **Final Polish:** (Mental check of the flow)
      *   Start with the "Ought implies Can" principle but refine it to "Ought implies Cognizable."
      *   Ensure the distinction between *motivational* burden and *cognitive* opacity is sharp.
      *   Make sure the approximation section highlights the difference between *instrumental* success and *normative* justification.

  *(Self-Correction Note)*: I need to be careful not to conflate "practical intractability" (it takes too long) with "epistemic intractability" (I can't know if I'm right). The prompt asks to argue that it *is* epistemic. So I must argue that the time complexity translates into a lack of justified belief, not just a delay in action. The argument is: If I cannot compute the answer within the lifespan of the decision context, I cannot claim to *know* the answer. Therefore, I cannot be rationally bound by it.

  Let's write.

  *Structure:*
  1.  Introduction: Normative theories as computational prescriptions.
  2.  The Epistemic Argument: Intractability as a barrier to justified belief.
  3.  Contrast: Demandingness (Motivation) vs. Intractability (Cognition).
  4.  The Approximation Objection: Why "close enough" fails normatively.
  5.  Conclusion: The necessity of cognitive access for normative authority.

  *Key Concept:* The "Black Box" problem. If the derivation is intractable, the output is opaque. Normativity requires transparency.

  *Refining the Approximation Rebuttal:* Even if MCMC gives a distribution, the *normative fact* (the Kemeny winner) remains hidden. Acting on a probability distribution is acting on risk, not on normative certainty. If the theory demands the *optimal*, acting on the *probable* is a category error.

  *Refining the Demandingness Contrast:* Demandingness assumes the agent sees the cliff but fears the jump. Intractability means the agent cannot see the cliff at all.

