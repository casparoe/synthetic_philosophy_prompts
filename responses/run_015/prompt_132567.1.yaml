answer: |-
  Normative theories function as guides for action and judgment, prescribing specific states of affairs or decisions as obligatory, permissible, or forbidden. For such a theory to possess normative authority over rational agents, it must satisfy a condition of cognitive accessibility: the agents to whom the theory applies must be capable of identifying its prescriptions through reasoning. When a normative theory relies on an aggregation rule or decision procedure that is computationally intractable—specifically, NP-hard, as seen in optimal consensus-ranking problems like Kemeny-Young—it fails to meet this condition. This failure is not merely a practical limitation regarding time or resources; it is a fundamental epistemic failure. It severs the link between the agent's reasoning processes and the theory's verdicts, rendering the prescriptions unknowable and thus unjustifiable to the agents bound by them.

  To understand why intractability constitutes an epistemic failure, one must examine the relationship between computation and justification. In the context of social choice or collective rationality, a normative theory often posits that there exists a unique "correct" ranking or outcome that satisfies specific axioms of fairness or consistency. The Kemeny-Young method, for instance, defines the optimal consensus ranking as the one minimizing the sum of pairwise disagreements with individual voter preferences. While the definition is precise, the computational complexity of finding this ranking grows exponentially with the number of alternatives. Assuming the standard conjecture that P does not equal NP, there exists no efficient algorithm that guarantees finding this optimal ranking in polynomial time.

  From a purely engineering perspective, this is a resource problem: the calculation takes too long. However, from a normative perspective, it is an epistemic problem. For an agent to be rationally obligated to bring about a specific state of affairs, the agent must be able to form a justified belief that a particular action leads to that state. If the determination of the "correct" state requires computational resources that exceed the cognitive or temporal bounds of the decision context, the agent cannot distinguish the prescribed outcome from a non-prescribed one. The agent is left in a state of ignorance regarding the theory's demands. A normative theory that generates outputs which cannot be cognitively grasped or derived by the agents it governs functions as an oracle rather than a guide. It demands compliance with a rule that the agent cannot verify, understand, or internally endorse. Consequently, the intractability of the prescription undermines the agent's capacity to hold a justified belief about what they ought to do, transforming the normative obligation into an arbitrary command.

  This epistemic critique must be sharply distinguished from the familiar demandingness objections often raised against consequentialist ethical theories. Demandingness objections argue that a theory requires too much sacrifice from the agent—be it financial, emotional, or psychological. For example, a strict utilitarian framework might require an individual to donate almost all their income to charity to maximize global welfare. The objection here is that such a requirement places an undue burden on the agent's motivations and well-being. The structure of this objection presupposes that the agent *knows* what the theory requires but finds the cost of compliance too high. The barrier is motivational or volitional.

  In contrast, the intractability objection targets the antecedent condition of knowledge. It does not claim that computing the Kemeny-Young ranking is too costly in terms of effort or sacrifice; it claims that the computation is cognitively opaque. Even a perfectly motivated agent, willing to expend any amount of effort within reasonable polynomial bounds, cannot access the theory's verdict. The demandingness objection asks, "Is it fair to ask so much of the agent?" The intractability objection asks, "Can the agent even understand what is being asked?" The former challenges the *content* of the obligation (its severity), while the latter challenges the *form* of the obligation (its intelligibility). A theory that is too demanding might still be true, but a theory that is computationally intractable in this epistemic sense cannot function as a rational guide because it violates the principle that obligation implies cognitive access. If an agent cannot determine the right action through reasoning, they cannot be rationally blamed for failing to perform it, nor can they rationally endorse the theory that mandates it.

  A common counter-argument suggests that this epistemic critique is mitigated by the existence of polynomial-time approximation schemes or probabilistic methods, such as Markov-chain Monte Carlo (MCMC) sampling. Proponents of this view argue that agents need not compute the exact optimal ranking to satisfy the normative theory; finding a ranking that is sufficiently close to the optimum with high probability is sufficient for practical governance. By substituting exact computation with tractable approximation, the theory becomes actionable, and the epistemic barrier is lowered.

  However, this reply fails to address the core epistemic point regarding normative authority. First, normative concepts often possess a threshold or binary character that resists approximation. In contexts of justice, rights, or truth, being "close" to the correct verdict is not equivalent to achieving the correct verdict. If a normative theory defines the obligatory action as the *unique* optimum, acting on a probable approximation is not acting on the obligation; it is acting on a gamble. The agent does not hold a justified belief that they are doing the right thing; they hold a justified belief that they are *likely* doing something acceptable. This shifts the normative ground from deontic certainty to risk management, which fundamentally alters the nature of the obligation.

  Second, and more critically, approximation methods often suffer from a verification gap. In many NP-hard problems, while finding a solution is hard, verifying the quality of an approximate solution can also be computationally difficult. An agent using MCMC sampling may generate a ranking, but without solving the intractable exact problem, they often cannot know *how far* their approximation deviates from the optimum. They possess an output without a metric of its accuracy. Normative endorsement requires understanding the justification for a specific prescription. If the agent relies on a black-box sampling process, they are deferring to a statistical tendency rather than grasping the normative reasons that make the ranking correct. The epistemic failure persists because the agent remains unable to connect the specific features of the situation to the specific verdict of the theory through a chain of reasoning they can comprehend.

  Furthermore, the reliance on approximation concedes that the exact normative fact exists but is inaccessible. This creates a dualism between the "true" normative reality (the exact Kemeny-Young ranking) and the "accessible" normative practice (the approximation). Rational agents are asked to govern themselves by a theory whose true dictates they acknowledge they cannot know. This creates a fracture in rational agency: the agent must act as if they know the rule, while simultaneously knowing that their method of determining the rule is fundamentally fallible in a way that cannot be corrected by further reasoning. This undermines the autonomy of the rational agent, reducing them to a processor of heuristics rather than a follower of principles.

  Therefore, computational intractability in normative aggregation rules represents a profound epistemic failure. It is not simply that the calculation is slow or expensive; it is that the calculation lies beyond the horizon of justified belief for the agents involved. Unlike demandingness objections, which concern the burden of compliance, the intractability critique concerns the possibility of comprehension. Approximation schemes do not resolve this because they substitute normative certainty with probabilistic guesswork, leaving the agent without a justificatory link to the true prescriptions of the theory. For a normative theory to genuinely bind rational agents, its prescriptions must be derivable within the cognitive constraints of those agents. When the logic of the theory requires computations that are structurally resistant to efficient derivation, the theory loses its claim to guide rational agency, becoming a description of an ideal state rather than a prescription for action.
