  7.  **Drafting the Content (Iterative process):**
      *   *Sentence 1:* Step (1) fails because it mistakenly treats the archival system as separate from the social world it inhabits, rather than recognizing that the system's boundaries are themselves social facts.
      *   *Elaboration:* The principle is a vital heuristic against naive empiricism, but as an ontological claim, it is self-undermining. You correctly identify in (5) that claiming "systematic unrecording" is a claim about the world. The error lies in assuming that "the world" in (1) refers only to the *subjects* of the ledger (the workers), rather than the *system* of relations (the town's power structure).
      *   *Steps 2-4:* These hold. They correctly identify the institutional logic and warn against inferring intrinsic attributes (literacy, inertness) from extrinsic exclusion. The naive historian commits a category mistake: inferring "no strikes" from "no record of strikes."
      *   *Step 5-6:* The contradiction arises because (1) is too absolute. It says silence is *never* a fact about the world. But the record-keeper is part of the world. Their interests are social facts. Therefore, the silence *is* a fact about the social world—specifically, about the distribution of visibility and authority.
      *   *The Fix:* Restrict (1) to distinguish between *intrinsic properties* of the missing and *relational status* of the missing. You cannot infer they were illiterate (intrinsic), but you can infer they were deemed unworthy of full naming (relational).
      *   *Burial Register:* This clarifies the restriction. A legal requirement establishes a normative boundary. If a name is missing, it is a fact about the world: either the person did not exist in the parish's jurisdiction, or they were excluded from its rites (e.g., suicides, unbaptized). The silence testifies to the boundary of the community, not necessarily the biological fact of death alone. Your mentor is right that this fits a revised (1): the gap tells you about the parish's definition of membership.
      *   *Cost:* The cost is abandoning the hope of recovering the "view from below" directly from the ledger. You cannot use the ledger to prove the women existed as workers; you use it to prove the system refused to see them as workers. This shifts your project from recovery of experience to analysis of erasure.
