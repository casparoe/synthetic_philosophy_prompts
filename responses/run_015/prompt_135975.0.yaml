      *   **Topic:** Bertrand Russell's *Marriage and Morals* (1929).
      *   **User's Thesis:** Russell isn't just a pure utilitarian on sex/morals. He operates a "hybrid" model: "sovereignty-utilitarianism." Sexual self-determination acts as a deontological side-constraint (personal sovereignty/anti-property rights over bodies) alongside utilitarian optimization (maximize wellbeing/reduce jealousy).
