answer: |-
  This is a sharp reading. You're correctly identifying a tension in Russell that standard "hedonic utilitarian" summaries flatten out. Framing it as "sovereignty-utilitarianism" captures the specific texture of his argument in *Marriage and Morals* better than the standard label.

  Here is the breakdown on your three specific logic checks.

  ### 1. Possessive vs. Expressive Attachment: Import or Inherent?
  You are not importing the split; you are naming a structural dualism that is already doing the heavy lifting in his text, though your terminology is modern.

  Russell explicitly grounds jealousy in the "property instinct." He argues that traditional marriage codifies a right of access that treats the partner as a resource to be guarded. That is your **possessive** category. Conversely, when he describes the ideal sexual relationship, he describes it as something that thrives on freedom, where love is not diminished by outside interests. He argues that if love is genuine, it doesn't need the crutch of exclusivity to survive. That is your **expressive** category.

  However, a caveat: Russell hedges on the biology. He admits jealousy has *some* instinctual basis (particularly in males), whereas your "expressive" framing might imply a purely social construction. Russell's argument is that while the *seed* of jealousy might be innate, the *tree* is cultivated by property laws and moral taboos. So, the distinction is inherent, but Russell sees it as a spectrum of socialized instinct rather than a binary of "bad vs. good" attachment styles. Using your terms is analytically sound as long as you acknowledge he views the "possessive" mode as a fossilized survival instinct, not just a moral failing.

  ### 2. The Hybrid View: Coherence or Collapse?
  Does the "sovereignty-utilitarianism" hold up, or does it collapse into straight utilitarianism when he gets to policy?

  **It holds up, and it actually solves a coherence problem in his text.**
  If Russell were a pure act-utilitarian, he would have to concede that if a specific community found genuine happiness in strict, lifelong, indissoluble monogamy, he should support it. But he doesn't. He argues they are *mistaken* about their happiness because they are operating under false consciousness (religious dogma, social fear).

  However, if he were a pure deontologist (rights-based), he couldn't justify the one major area where he restricts sexual freedom: **children.**
  Russell is uncompromising that the rights of parents yield to the welfare of children. He supports legal constraints on divorce and cohabitation *specifically* when children are involved. A pure sovereignty model would say, "My body, my choice, regardless of offspring." Russell says, "Once a child exists, the state has an interest."

  Your hybrid model explains this boundary perfectly:
  *   **Zone 1 (Adults, no children):** Sovereignty is the side-constraint. Utility cannot override the right to sexual self-determination. (This prevents the collapse into "if society is happier with repression, repress them.")
  *   **Zone 2 (Involving children):** Utilitarian calculation returns. The vulnerability of the child reintroduces the happiness/welfare calculus, overriding adult sovereignty.

  So, the hybrid view makes him *more* coherent. It explains why he is radical on adult sexuality but surprisingly conservative on parental obligation. A straight utilitarian reading struggles to explain why he doesn't just weigh the "stability of the home" against "adult freedom" in every case. Russell treats adult freedom as a trump card *unless* a third party (the child) is harmed.

  ### 3. Relational Autonomy: Illuminating or Anachronistic?
  This is the riskiest move, but it can work if qualified.

  **The Anachronism Risk:**
  Modern relational autonomy theory (e.g., Mackenzie, Stoljar, Friedman) is largely a feminist critique of the liberal, atomistic subject. It argues that autonomy is *constituted* by social relations, not just exercised within them. Russell is still fundamentally a liberal individualist. He believes there is a "true self" inside the social shell that needs to be liberated *from* society. He doesn't fully grasp the postmodern idea that the self is constructed *by* the relations.

  **The Illumination:**
  However, linking him to relational autonomy is illuminating regarding **enabling conditions.** Russell anticipates the core insight that autonomy requires social scaffolding. He argues you cannot be sexually autonomous in a vacuum of stigma, economic dependence, or legal bondage. He recognizes that "freedom" isn't just the absence of law (negative liberty); it requires a change in social ethos and economic structure (positive liberty) to be real.

  **Verdict:**
  Don't claim Russell *is* a relational autonomy theorist. Claim he is a **precursor** who identifies the *problem* that relational autonomy solves. He realizes that "sovereignty" is impossible without relational support. Using the lens highlights that his utilitarianism isn't about isolated pleasure units, but about the quality of the relational matrix in which those units exist. It saves you from the critique that Russell is just a "free love" hedonist; it shows he's concerned with the *structural conditions of agency.*

  ### Summary of the Logic
  Your "sovereignty-utilitarianism" framing is robust.
  1.  **Possessive/Expressive:** The concepts are textually present; the labels are just modern shorthand for his property-vs-love distinction.
  2.  **Hybrid Coherence:** It prevents collapse. It explains the "Adult Sovereignty / Child Welfare" split better than pure utilitarianism does.
  3.  **Relational Autonomy:** Use it heuristically. He identifies the social preconditions for autonomy without having the full social ontology of modern theory.

  This approach saves you from the boring "Russell = Utilitarian" summary and lets you argue he's developing a specific kind of liberal-feminist ethics before the terminology existed.
