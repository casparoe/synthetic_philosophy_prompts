      *   *Analysis:* The *terminology* ("expressive attachment") is modern. The *concept* is definitely there. Russell distinguishes between love based on fear/ownership and love based on mutual growth/freedom. He doesn't use the phrase "expressive attachment," but he describes the phenomenon of love that isn't threatened by outside interests.
