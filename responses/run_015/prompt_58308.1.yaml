answer: |-
  ### Moral Permissibility Evaluations

  **1. Government Monopsony for Living Kidney Donation**
  *   **Rating:** 5
  *   **Rank:** 2nd Most Defensible
  *   **Strongest Concern:** Exploitation or Compromised Consent
  *   **Explanation:** The fixed payment and lifetime follow-up mitigate the risk of physical harm and "race to the bottom" pricing found in open markets, strengthening the case for donor safety. However, the financial incentive still risks constituting undue inducement for economically vulnerable populations, leaving the voluntariness of consent morally ambiguous.

  **2. Futures Market for Cadaveric Kidneys**
  *   **Rating:** 6
  *   **Rank:** 1st Most Defensible
  *   **Strongest Concern:** Corruption or Degradation of the Good at Stake
  *   **Explanation:** Because the retrieval occurs postmortem, the design eliminates physical risk to the donor, significantly weakening concerns regarding exploitation or bodily harm. The primary remaining objection is the commodification of the human corpse, though the binding contract respects the agent's prior autonomy over their bodily remains.

  **3. Price Gouging on Generators with Charitable Donation**
  *   **Rating:** 3
  *   **Rank:** 4th Most Defensible
  *   **Strongest Concern:** Exploitation or Compromised Consent
  *   **Explanation:** While donating profits mitigates the moral vice of unjust enrichment, the price hike still restricts access to essential goods based on ability to pay during a crisis, exploiting the buyer's desperation. The design fails to protect the most vulnerable from exclusion, meaning the benevolent outcome does not fully absolve the exploitative mechanism.

  **4. Nonpartisan Payment for Voter Turnout**
  *   **Rating:** 4
  *   **Rank:** 3rd Most Defensible
  *   **Strongest Concern:** Corruption or Degradation of the Good at Stake
  *   **Explanation:** By decoupling payment from vote choice, the design avoids skewing electoral outcomes, thereby minimizing harm to democratic institutions. However, it still transforms a civic duty into a form of labor, potentially degrading the intrinsic moral value of participation as a public-spirited act.

  **5. Partisan Payment for Votes**
  *   **Rating:** 1
  *   **Rank:** 5th Most Defensible (Least Defensible)
  *   **Strongest Concern:** Harm to Third Parties and Erosion of Shared Institutions
  *   **Explanation:** This design directly purchases political power, undermining the principle of political equality and corrupting the legitimacy of the electoral outcome regardless of the lack of coercion. The self-reporting mechanism further erodes institutional integrity by encouraging fraud, making this impermissible even if legally enforced.

  ***

  ### Conclusion: Separating the Objections

  The design variation that most clearly separates these three kinds of objection is the **specificity of the behavioral condition attached to payment** (i.e., outcome-contingent vs. participation-contingent vs. price-contingent).

  This variation isolates the objections because **outcome-contingent payments** (Case 5: Vote for X; Case 1: Provide Kidney) create direct incentives that risk **harm to third parties** (skewed elections) or **exploitation** (physical risk for money). In contrast, **participation-contingent payments** (Case 4: Vote at all; Case 2: Sign Contract) primarily raise concerns about the **corruption or degradation of the good** (civic duty or bodily integrity) without necessarily causing immediate external harm. Finally, **price-contingent mechanisms** (Case 3) isolate **exploitation** based on market vulnerability distinct from the moral corruption of the good itself. By toggling the conditionality of the transaction, the vignettes demonstrate that markets are most objectionable when they incentivize specific outcomes that undermine the integrity of the institution or the safety of the participant, rather than merely compensating for participation or access.
