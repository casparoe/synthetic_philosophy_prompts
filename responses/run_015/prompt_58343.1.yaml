  ### Discriminating Test Case

  To definitively determine whether Rule 1 (Ontological) or Rule 2 (Modal-Epistemic) governs her judgments, I propose the following variant. This case isolates the Modal-Epistemic move from the Ontological claim about existence.

  **The "Consistency-Only" Variant**
  *   **Setup:** Present an argument identical to the Gödelian variant regarding the definition of "Positivity" (closure under entailment, conjunction, etc.) and the definition of "God-like" (possessing all Positive properties).
  *   **Modification:** **Remove** the axiom "Necessary Existence is Positive." Instead, stipulate that "Omniscience is Positive" and "Moral Perfection is Positive." Do not include any property that entails existence.
  *   **Argument:** Argue that because the axioms of Positivity (including Omniscience and Moral Perfection) are jointly consistent, it follows that a God-like being is *metaphysically possible* ($\diamond \exists x Gx$). Stop the argument there. Do not proceed to S5 to prove necessary *existence*.
  *   **The Discrimination:**
      *   **If she follows Rule 1 (Ontological):** She should find this argument **more acceptable** (perhaps Qualified Acceptance or Suspension) than the original Gödel case. Since the axiom "Existence is Positive" is removed, her primary objection (V2) is neutralized. She has no ontological ground to reject the positivity of Omniscience.
      *   **If she follows Rule 2 (Modal-Epistemic):** She should reject this argument **with the same force** as the original Gödel case. The inference from "joint consistency of stipulations" to "metaphysical possibility" remains the sole engine of the argument. Since V5 states that consistency is insufficient for genuine possibility, she must reject this move regardless of which properties are involved.

  **Evaluation:** If she rejects the "Consistency-Only" Variant as vigorously as the Gödelian Variant, Rule 2 is dominant (Modal Skepticism). If she treats the "Consistency-Only" Variant as merely inert or logically sound (but existentially weak) while treating the Gödelian Variant as unsound, Rule 1 is dominant (Ontological Skepticism).
