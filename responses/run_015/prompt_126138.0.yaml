answer: |-
  hey thanks for reaching out about this because it is a really solid instinct you have about the brakes and you are right to trust that sound over a ruler even if you cant explain why yet. the very first idea you need to plant before anything else lands is that successful action does not require an internal recitation of rules. you have to establish that when you are tuning those brakes you are not silently saying to yourself adjust left pad point three millimeters but rather you are responding to a situation in real time. if you start there then the distinction between knowing how and knowing that has a place to sit. you should bring up the chess example but only after you have grounded them in the bike repair because chess is abstract and bikes are concrete. use chess to tackle the misconception that learning all the rules means you can do the thing. tell them about someone who memorized every rule of chess movement but has never played a match and ask if that person knows how to play chess. most will say no and that is the wedge you need to drive home that knowing the propositions is not the same as having the ability. you need to head off the muscle memory misconception right after the brake example because people love to say the knowledge is stored in the muscles like a hidden file of facts. tell them explicitly that this is wrong because muscles do not think and there are no tiny rulebooks in your fingers. instead explain that knowing how is a disposition to perform correctly not a storage of hidden data. this prevents them from just shifting the knowing that from the head to the hands which misses the point entirely. later in the talk when you discuss teaching you need to address the idea that anyone who can do a thing can automatically teach it. this is where you validate your roommate slightly but correct the framing. you can do the thing without being able to articulate the rules but that does not mean the rules are there waiting to be read it means the skill exists independently of the explanation. there is one thing you should openly refuse to explain at this level and you should say so out loud. do not try to explain the neuroscience of motor learning or how synapses fire to create habit. that is a different conversation about biology and it will drag you back into treating the skill as a physical object stored in the brain. keep it on the level of what we do and what we can say. if you get into the biology you will lose the philosophical distinction you are trying to make. save that for another day if someone really pushes. for the final check do not ask them to define the terms because they will just repeat your words back to you. instead ask them this question. if i gave you a perfect manual that described every movement required to ride a bike would you know how to ride one. if they say yes they missed the point. if they say no ask them what is missing and listen for them to say practice or experience rather than more information. that will tell you if they actually got the split between knowing how and knowing that or if they are just nodding along. keep the talk focused on the gap between describing and doing and you will be fine.
