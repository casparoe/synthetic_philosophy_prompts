answer: |-
  # JOINT STATEMENT ON THE SEMANTICS OF KNOWLEDGE AND STAKES
  **A Collaborative Draft by Proponents of Epistemic Contextualism and Pragmatic Encroachment**

  ### I. AGREED CLAIMS

  We, the undersigned, representing the Contextualist and Pragmatic Encroachment (Interest-Relative Invariantist) traditions, affirm the following commitments. This statement delineates our common ground against invariantist purism and pragmatic deflationism, while isolating the precise locus of our remaining disagreement.

  1.  **The Reality of the Stakes Effect:** We agree that the truth conditions of ordinary knowledge attributions (e.g., "S knows that p") vary with practical stakes. In "Bank Cases," where evidence is held fixed, a knowledge attribution true in a low-stakes context becomes false in a high-stakes context. This is not a performance error; it reflects the semantics of the verb 'knows'.
  2.  **Rejection of Pragmatic Deflationism:** We jointly reject the claim that the stakes effect is explained solely by Gricean implicature, conversational pragmatics, or norms of assertion (e.g., the Knowledge Norm of Assertion). We deny that the speaker in high-stakes cases literally speaks truth but merely implicates falsehood, or that she lacks the *right* to assert while retaining knowledge. The variation is in the proposition expressed, not merely in the propriety of expressing it.
  3.  **Rejection of Evidential Variance:** We deny the explanation that high-stakes subjects simply possess weaker evidence than low-stakes subjects. We stipulate that the probabilistic support (e.g., memory, past visits) is identical in both cases. The variance lies in the threshold required for knowledge, not the evidential base.
  4.  **Unity of the Phenomenon:** We agree that the stakes-sensitivity observed in first-person ("I know") and third-person ("She knows") attributions is a single semantic phenomenon. It is not the case that first-person reports track one mechanism (e.g., confidence) while third-person reports track another (e.g., reliability).
  5.  **Semantic Significance:** We agree that any adequate theory must provide a semantic parameter that shifts. The dispute is not *whether* a parameter shifts, but *what fixes* that parameter and *whose* situation determines its value.

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table summarizes our divergent analyses. We have phrased these claims charitably, avoiding the caricature that the opposing view reduces to "confusion" or "error theory."

  | Issue | Contextualist Position | Pragmatic Encroachment (IRI) Position |
  | :--- | :--- | :--- |
  | **The Semantic Parameter** | The content of 'knows' is indexical. It contains a hidden variable for an *epistemic standard*, analogous to 'tall' or 'ready'. | The content of 'knows' is invariant. However, its truth conditions include a clause relating the subject's evidence to their *practical environment*. |
  | **Locus of Fixing** | The standard is fixed by the **Attributor's Context**. This includes the conversational purposes, salient error possibilities, and needs recognized by the speaker. | The standard is fixed by the **Subject's Practical Situation**. This includes the costs of error and the value of truth for the subject of the attribution. |
  | **Diagnosis of the Shared-Utterance Case**<br>*(Speaker says to High-Stakes Listener A and Low-Stakes Listener B: "I checked: the ferry leaves at 11.")* | The utterance expresses a **single, high-standards proposition**. The conversational context is set by the most demanding salient purpose of the audience. The speaker addresses both, but the content is governed by A's needs, which become salient in the speaker's context. B hears a claim stronger than necessary. | The utterance expresses a **single proposition whose truth depends on the Speaker's stakes**. If the Speaker is acting as an agent for A, A's stakes transfer to the Speaker, raising the threshold. If the Speaker is merely reporting with no liability, the threshold remains low. The truth value may differ from the Contextualist's if the Speaker lacks personal liability. |
  | **Relation to Rational Action** | Knowledge is distinct from the norm of action. One can know *p* relative to a low standard but be irrational to act on *p* in high stakes. The shift in 'knows' tracks the shift in *attributor* expectations, not necessarily the subject's rational permissions. | Knowledge is the norm of action. If it is irrational to act on *p* due to high stakes, one does not know *p*. The shift in 'knows' tracks the shift in the **subject's** rational permissions to act. |
  | **The "Error" in Disagreement** | When a low-stakes attributor denies knowledge to a high-stakes subject (or vice versa), they are speaking from different contexts. Neither is strictly wrong, though one may be unhelpful. | When a low-stakes attributor claims knowledge for a high-stakes subject, they are **false**. The subject's situation objectively fixes the standard; the attributor's ignorance of that situation leads to error. |

  ### III. CRUCES: SUB-QUESTIONS FOR RESOLUTION

  We identify the following four cruxes. Settling any one would significantly alter the dialectical landscape or force a concession from one side. For each, we propose a test case or argument we both grant is relevant, and we record our divergent predictions.

  #### Crux 1: Whose Stakes Fix the Standard? (Subject vs. Attributor vs. Aggregate)
  *   **The Question:** In a third-person attribution ("S knows that p") where the Subject's stakes and the Attributor's stakes come apart, whose stakes determine the truth of the attribution?
  *   **The Case:** *The Ignorant High-Stakes Subject.* Subject S is buying a house (extremely high stakes). Attributor A is a bystander with no stake in the transaction, observing S. S has good evidence the bank is open. A says, "S knows the bank is open."
  *   **Relevance:** Distinguishes whether 'knows' tracks the subject's rational position (IRI) or the conversational context of the evaluation (Contextualism).
  *   **Predictions:**
      *   **Contextualist:** A's utterance is **True**. The standard is set by A's context (low stakes). S's high stakes are irrelevant to the truth of A's claim, though relevant to S's action.
      *   **IRI:** A's utterance is **False**. The standard is set by S's practical situation. Since S cannot rationally act without further check, S does not know, regardless of A's casual context.

  #### Crux 2: Rational Ignorance and Irrational Inflation of Stakes
  *   **The Question:** Can a subject fail to know because of stakes they are unaware of? Can a subject know despite believing stakes are high when they are actually low?
  *   **The Case:** *The Unaware Bomb.* S checks a switch to turn on a light. S believes it is a light switch (low stakes). Unbeknownst to S, the switch is wired to a bomb (high stakes). S has standard visual evidence.
      *   *Variation (Inflation):* S believes the switch triggers a bomb (high stakes), but it is actually just a light (low stakes).
  *   **Relevance:** Tests whether the "practical environment" is objective (fact-based) or psychological (belief/salience-based).
  *   **Predictions:**
      *   **IRI (Objective):** In *Unaware Bomb*, S **does not know** (stakes are objectively high). In *Inflation*, S **knows** (stakes are objectively low). Knowledge tracks objective rational permissions.
      *   **Contextualist (Salience):** In *Unaware Bomb*, if the bomb risk is not salient in the *Attributor's* context, S **knows**. In *Inflation*, if the risk is salient to the Attributor (or Subject-as-Attributor), the standard rises. Knowledge tracks salient possibilities, not hidden metaphysical facts.

  #### Crux 3: Encroachment on Belief and Credence
  *   **The Question:** Does the stakes sensitivity apply only to the knowledge relation, or does it "encroach" on rational belief and credence as well?
  *   **The Argument:** *The Link to Action.* If knowledge is the norm of practical reasoning, and high stakes make it irrational to act on a belief without further evidence, does it not follow that the belief itself is irrational? Or can one rationally believe *p* but be forbidden from using *p* as a premise?
  *   **Relevance:** If stakes affect rational belief, Contextualism struggles (belief is usually taken as invariant). If stakes affect only knowledge, IRI must explain the disconnect between knowledge and rational belief.
  *   **Predictions:**
      *   **IRI:** Stakes affect **Knowledge only** (or primarily). One can rationally believe *p* (credence remains fixed by evidence) but fail to know *p* because the warrant is insufficient for action. Knowledge is a distinct normative status tied to action.
      *   **Contextualist:** Stakes do **not affect rational belief**. Belief is evidence-relative. The intuition that belief shifts is a confusion caused by the shifting semantics of 'knows'. We maintain a strict separation: 'knows' shifts; 'believes' does not.

  #### Crux 4: Non-Circular Standard Fixing in the Shared-Utterance Case
  *   **The Question:** In the Shared-Utterance Case (Speaker addressing High-Stakes A and Low-Stakes B), what non-circularly fixes the standard? Can we specify the rule without simply saying "the standard that matches our intuition"?
  *   **The Case:** *The Mixed Audience.* Speaker S says to A (needs certainty for life-saving medicine) and B (curious): "I know the pharmacy is open." S has good evidence but not absolute proof.
  *   **Relevance:** Tests the robustness of the "Context" vs. "Subject's Situation" parameters. If the rule is "the standard of the most important listener," Contextualism wins. If the rule is "the speaker's liability," IRI wins.
  *   **Predictions:**
      *   **Contextualist:** The standard is fixed by the **Conversational Score**, which defaults to the highest salient practical need among participants. The utterance is false if S cannot meet A's needs, because the conversation is governed by A's needs.
      *   **IRI:** The standard is fixed by **S's Liability**. If S is merely informing, S's stakes are low (utterance true). If S is undertaking a guarantee, S's stakes rise (utterance false). The listener's stakes matter only insofar as they alter the Speaker's practical situation.

  ### IV. VERBAL DISPUTE AND SUBSTANTIVE REMAINDER

  We acknowledge that a portion of our dispute may be verbal, specifically regarding the label **"Semantic Content."**

  *   **The Verbal Element:** The Contextualist describes the variation as a shift in the *proposition expressed* (indexicality). The Proponent of Encroachment describes it as an invariant proposition with truth conditions sensitive to practical facts. If both agree that the *truth value* of "S knows p" flips with stakes (holding evidence fixed), the disagreement over whether this is due to a hidden variable in the content or a hidden variable in the truth conditions may be a technical distinction without a difference in predictive power regarding usage.
  *   **The Substantive Remainder:** However, a deep substantive disagreement remains regarding **the metaphysics of epistemic normativity.**
      1.  **The Nature of Knowledge:** Is knowledge a purely intellectual state (Contextualism: pure evidence + shifting standard of attribution) or a hybrid state essentially linked to action (IRI: evidence + practical sufficiency)?
      2.  **The Authority of the Attributor:** Does the evaluator (attributor) have the power to alter the epistemic status of a subject merely by changing their own conversational context (Contextualism), or is the subject's epistemic status objective relative to their own situation, immune to the evaluator's context (IRI)?
      3.  **The Shared-Utterance Resolution:** The substantive question that remains is: **In a mixed-stakes conversation, does the speaker owe the truth to the most vulnerable listener (Contextualism), or does the speaker report their own epistemic position relative to their own liability (IRI)?**

  Settling Crux 4 (Shared-Utterance Fixing) is the most promising path to resolving this substantive remainder. If we can agree on a non-circular rule for standard-fixing in mixed contexts, we can determine whether the "context" that matters is the conversational sphere (Contextualism) or the agent's practical sphere (Encroachment).

  ***

  **Signed,**

  *The Contextualist Working Group*
  *The Pragmatic Encroachment Working Group*
