      *   (4) *Elective Affinity:* Relationship is structural compatibility/mutual reinforcement, *not* a direct causal chain from doctrine to behavior.
      *   (5) *Methodology:* *Verstehen* allows treating collective subjective meanings as real explanatory factors without ontological independence (methodological realism vs. ontological anti-realism).
