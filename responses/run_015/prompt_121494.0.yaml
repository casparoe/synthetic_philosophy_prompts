      *   *Revision:* Refine (3). Instead of "only... through individual motives," say "mediated through individual actions, but the *source* and *structure* of those motives are irreducibly collective." This saves (2) and keeps (3)'s mechanism.
      *   *Alternative:* Refine (2). "Collective values are genuine causes *at the sociological level of analysis*, even if ontologically grounded in individuals." This is standard non-reductive physicalism applied to sociology.
