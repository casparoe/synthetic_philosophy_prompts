  I'm in the final year of a Politics, Philosophy and Economics degree, and this term I'm taking a small seminar called *Who Counts? The Boundaries of the Political*. Last week we spent the whole session on a case our instructor made up: the coastal city of Ardmuir is holding a referendum on whether to build a tidal barrage across the Salm estuary. The barrage would generate most of Ardmuir's electricity for a century, but it would also deflect silt onto the beach at Duncairn, a town nine kilometres down the coast in the neighbouring country, which would lose most of its summer trade; it would flood a stretch of saltmarsh that a conservation trust holds in perpetuity for nobody in particular; and it would change the tidal regime for the several thousand people who own holiday homes in Ardmuir but are registered to vote elsewhere. One of my friends in the seminar said that the answer was obvious — anyone who is affected by a decision is entitled to a say in making it — and our instructor nodded, said this was the all-affected principle and that it is what most people really mean by democratic inclusion, and then used it to conclude that the residents of Duncairn should get a vote in Ardmuir's referendum. Nobody pushed back, but the more I turn the sentence over the more it seems to me to be several different principles wearing one coat, and I can't tell which of them would actually carry my friend's conclusion. (One thing I'd ask you not to do: our library is shut for renovation and I have no journal access, so please don't give me a reading list, a bibliography, or a set of named authors and titles. I want the arguments themselves, and I'd rather you reason it out than tell me who to look up.)

  What I want is a precisification, as a menu rather than a single interpretation. As I see it there are at least four separate choice-points hiding in the slogan, and I'd like you to add any I've missed: whose affectedness counts (interests, welfare, rights, legal position, or simply being causally downstream of the outcome); affected by what (the decision itself, its expected outcome, the rule under which it is taken, or the procedure that produced it); how much affectedness is required before the entitlement switches on (any effect at all, a non-trivial one, one that is weighty relative to the person's other concerns, or one that is not itself the product of an unjust background); and what kind of a say is owed (a full vote, a consultative hearing, a veto, a standing to demand reasons, or influence proportional to the expected size of the effect). There are also two worries I can't get past, and I'd like them applied to the readings rather than just listed. The first is what I've started calling baseline sensitivity: whether someone counts as affected seems to depend on which alternative you compare the decision to, and Ardmuir could just as well be described as deciding to keep the estuary open as deciding to close it, which would swap the affected set around. The second is second-order affectedness: whoever is already inside the demos is itself affected, in the weight of its own vote, by the decision about whom to include, so the principle seems to have to be applied to its own application, and I can't see where that stops.

