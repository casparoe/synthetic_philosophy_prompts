answer: |-
  ### Dependency Chain Brainstorm

  Before we map the 90 minutes, here's the logical dependency chain you need to scaffold. If you skip a link, they'll fall back into classical bivalence or nihilism.

  1.  **Classical Reflex:** Students assume propositions ($P$) refer to subjects with intrinsic nature ($svabhāva$). If the subject exists, $P$ is true or false.
  2.  **The Pivot:** Nāgārjuna isn't attacking logic; he's attacking the *ontological status of the subject*. The tetralemma isn't a truth table; it's an ontological probe.
  3.  **The Collapse:** All four corners fail for *one reason*: the subject lacks intrinsic nature ($svabhāva$). It's not that logic breaks; it's that the subject can't support the predicates.
  4.  **The Rescue:** Emptiness ($śūnyatā$) isn't non-existence; it's dependent origination ($pratītyasamutpāda$). Things function *because* they are empty.
  5.  **The Guardrail:** Two Truths framework prevents nihilism (conventional truth holds) and eternalism (ultimate truth denies intrinsic nature).

  ---

  ### The Teaching Arc (90 Minutes)

  #### 1. Break the Reflex (0–15 mins)
  **Goal:** Stop them from treating the tetralemma as a puzzle to be solved with truth tables.
  **Move:** Start with their logic training. Ask: "For 'The King of France is bald' to be true or false, what must be true about the King of France?" They'll say "He must exist."
  **Point:** Classical logic assumes the subject has a stable referent. Nāgārjuna asks: "What if the subject *never* has a stable referent?"
  **Action:** Tell them explicitly: "We are not doing multi-valued logic today. We are doing ontological archaeology. We are digging for the 'thing itself' behind the label."

  #### 2. The Carrying Example: "The Traffic Jam" (15–45 mins)
  **Goal:** Demonstrate the fourfold negation collapsing for *one reason*.
  **Why not the chariot?** Too static, too "parts vs. whole."
  **Why the Traffic Jam?** It's an *event*, not an object. It has causal power (you're late), but no essence.

  **Walkthrough:**
  *   **Context:** You're stuck on the highway. The jam is real; you're not moving.
  *   **Corner 1 (Exists):** Is the jam an entity over and above the cars? No. Remove the cars, the jam vanishes. You can't point to "the jam" without pointing to cars.
  *   **Corner 2 (Doesn't Exist):** Is it nothing? No. You're stuck. It has causal efficacy. If it didn't exist, you'd be driving.
  *   **Corner 3 (Both):** Can it be both an independent entity and nothing? No. Contradictory predicates on the same ontological level.
  *   **Corner 4 (Neither):** Is it some mystical third thing? No.

  **The One Reason:** Why do all four fail? Because you're looking for *svabhāva* (intrinsic existence).
  *   If it existed intrinsically, it wouldn't depend on cars.
  *   If it didn't exist at all, it wouldn't stop cars.
  *   **Key Insight:** The tetralemma exhausts the possibilities of *intrinsic* existence. Since all four fail, the jam is empty of intrinsic nature. It exists only *dependently*.

  #### 3. Killing Misconceptions (45–65 mins)
  **Goal:** Preempt the two biggest errors undergrads make.

  **Misconception A: "Emptiness is Nihilism."**
  *   *Where it pops up:* Right after Corner 2 (Doesn't Exist).
  *   *The Kill:* Hit them with **Causal Efficacy**. "If the traffic jam were truly nothing (nihilism), would you arrive on time?" No. Emptiness allows function. If the jam had intrinsic nature, it would be frozen and couldn't dissolve when traffic moves. Emptiness is what allows change.
  *   *Phrase to use:* "Emptiness isn't a vacuum; it's a network."

  **Misconception B: "Nāgārjuna is Being Mystical/Irrational."**
  *   *Where it pops up:* When you reject Excluded Middle.
  *   *The Kill:* Frame it as **Category Error**. "He's not saying logic is broken. He's saying you're asking 'Is the jam real?' like you're asking 'Is this rock real?' One is an object, one is a dependent event. Applying object-logic to event-ontology generates contradictions."
  *   *Phrase to use:* "This isn't mysticism; it's rigorous mereology."

  #### 4. The Two Truths Boundary (65–75 mins)
  **Goal:** Use the framework without getting bogged down.
  **What to Explain:**
  *   **Conventional Truth:** The jam stops cars. We use language like "traffic" to navigate.
  *   **Ultimate Truth:** Analysis reveals no intrinsic "jam-ness."
  **What to REFUSE to Explain:**
  *   **The Ontological Status of the Ultimate.**
  *   *Why:* Students will ask, "Is Emptiness real?" or "Are the Two Truths themselves empty?" This is the "emptiness of emptiness" rabbit hole. It requires a whole other course on prasaṅga vs. svātantrika.
  *   *Your Line:* "We are treating the Two Truths as pedagogical tools, not ontological layers. Don't ask me if the Ultimate exists. Ask me if the concept helps you stop reifying the traffic jam."

  #### 5. The Final Check (75–90 mins)
  **Goal:** Distinguish "Dependent Origination" from "Illusion."
  **Activity:** The "Magic Trick" Test.
  **Ask:** "If I say the traffic jam is empty, am I saying it's a magic trick that isn't really happening?"
  **Correct Answer:** "No. It's real conventionally, but lacks intrinsic nature."
  **Incorrect Answer:** "Yes, nothing matters, it's all Maya."
  **The Diagnostic Question:**
  > "If emptiness meant 'illusion,' could a traffic jam make you late?"
  > *   If they say **Yes**: They get dependent origination (functional but empty).
  > *   If they say **No** (or hesitate): They think emptiness means non-existence (nihilism/illusionism).

  ### Quick Advice on Delivery
  *   **Don't** write the tetralemma as $A, \neg A, A \land \neg A, \neg (A \lor \neg A)$. It invites them to use truth tables. Write it as: *Exists intrinsically, Doesn't exist intrinsically, Both, Neither.* The qualifier "intrinsically" is the load-bearing wall.
  *   **Do** let them feel the frustration. When they try to find the jam and can't, that frustration is *prapañca* (conceptual proliferation) running out of fuel. That's the win condition.
  *   **Stay Casual:** You're not initiating them into a sect; you're showing them a bug in their ontological software.

  Good luck. If they leave thinking "contradiction might be a feature of the subject, not the logic," you've won.
