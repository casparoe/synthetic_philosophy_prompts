answer: |-
  You have hit on something that most introductory surveys of the paradox of fiction gloss over: the debate isn't stalled because we lack a solution, but because the participants are operating with incommensurable criteria for what constitutes an "emotion."

  Your intuition that you are looking at three parallel arguments under one heading is largely correct. The stagnation since Radford (1975) isn't due to a lack of ingenuity, but rather a failure to disentangle **phenomenology**, **intentionality**, and **functional architecture**.

  Here is a diagnosis of the impasse, broken down by the structural issues you identified.

  ### 1. The "Different Exam Questions" Hypothesis
  You noted that one group cares about intentional objects, another about phenomenology, and a third about belief mechanisms. This is the primary source of the talk-past-each-other dynamic.

  *   **The Illusionists (e.g., Coleridge's descendants):** They are answering a **phenomenological** question. *"What does it feel like?"* Their claim is that the subjective experience is indistinguishable from real grief, therefore the mechanism must involve a temporary suspension of disbelief.
  *   **The Thought Theorists (e.g., Lamarque, Carroll):** They are answering an **intentional** question. *"What is the emotion about?"* They argue that emotions are directed at propositions, not ontological status. If I think *that Anna died*, I can grieve, regardless of whether Anna exists.
  *   **The Pretense Theorists (e.g., Walton):** They are answering a **functional/normative** question. *"What does the emotion compel me to do?"* Walton's key insight is that real fear motivates flight; fictional fear does not. Therefore, functionally, it cannot be the same state, regardless of how it feels.

  **Diagnosis:** The debate stalls because Walton can concede the phenomenology to the Illusionists and the intentionality to the Thought Theorists, yet still deny the *classification* of the state as "emotion" based on functional output. They aren't contradicting each other's data; they are weighting different necessary conditions for the label "emotion."

  ### 2. The Empirical Red Herring (Neuroimaging)
  You asked if neuroimaging could do the work. While tempting, this is likely a category error.

  Even if fMRI showed that fictional sadness and real bereavement activate identical neural circuits (the "same hardware"), the philosophical disagreement would persist.
  *   **Walton** would say: "Of course the hardware is similar; it's a *quasi*-emotion designed to mimic the real thing via make-believe. Similar circuitry doesn't prove identical propositional attitude."
  *   **Thought Theorists** would say: "See? The brain doesn't check existence before firing the sadness module. Belief isn't required."

  Neuroscience can tell us about **causal mechanisms**, but the Paradox of Fiction is a problem of **rationality and categorization**. The paradox is essentially: *How is it rational to feel X if Y is not the case?* Neural firing patterns don't answer questions about rationality or intentionality. Knowing *how* the sadness happens doesn't tell us *what* the sadness is.

  ### 3. The Hidden Variable: The Theory of Emotion
  The real substantive bottleneck is that the Paradox of Fiction relies on a specific, often undefended, **Cognitive Theory of Emotion**.

  Radford's original formulation assumes that emotions are essentially **judgments** or **beliefs** about the world (a Stoic/cognitivist view). If emotion = judgment, then you cannot judge that a non-existent thing is dangerous/sad.
  *   If you adopt a **Perceptual Theory of Emotion** (emotions are like sensory perceptions, not judgments), the paradox dissolves. I can perceive a stick as a snake in the dark and feel fear, even if I later learn it was a stick. The visual module fired without existential commitment.
  *   If you adopt an **Evolutionary/Modular View**, the emotion system is a fast-and-frugal heuristic that doesn't wait for ontological verification.

  **Diagnosis:** The debate is stalled because many participants are fighting over the *fiction* while ignoring the *emotion*. They are using a folk-psychological definition of emotion that requires existential commitment, while modern philosophy of mind has largely moved toward modular or perceptual accounts that do not. The impasse breaks only if we admit the paradox is an artifact of an outdated cognitivist model of emotion.

  ### 4. Philosophy of Mind vs. Aesthetics
  Your friends' disagreement on whether this is a problem for Mind or Aesthetics is also diagnostic.

  *   **As Philosophy of Mind:** It is a problem of **consistency**. How can a rational agent hold inconsistent propositional attitudes? (I believe X doesn't exist; I feel sadness about X).
  *   **As Aesthetics:** It is a problem of **value**. Why is this irrational-seeming state *desirable*? Why do we seek out tragedy?

  **Diagnosis:** The paradox is a **boundary object**. It sits at the intersection.
  *   When treated as **Mind**, the goal is to save rationality (explain how we aren't crazy).
  *   When treated as **Aesthetics**, the goal is to save the artwork (explain why the experience is meaningful).

  The stall occurs when Aesthetic intuitions ("But the sadness feels so real and valuable!") are used to solve Mind problems ("Therefore belief must be present"), or vice versa. Walton solves the Mind problem by downgrading the emotion, which some aestheticians hate because it seems to diminish the art. Thought Theorists save the emotion's reality, which some mind-philosophers hate because it muddies the link between belief and action.

  ### Summary: How to Break the Impasse
  If you want to move the needle, you don't need new data or a new verdict. You need a **taxonomy shift**.

  1.  **Acknowledge Pluralism:** Admit that "emotion" is not a natural kind with a single set of necessary conditions. It is a cluster concept involving physiology, phenomenology, intentionality, and action-tendency. Fictional engagement hits some clusters (physiology, phenomenology) but misses others (action-tendency, existential belief).
  2.  **Dissolve the "Paradox":** Recognize that the "Paradox" only exists if you insist on a strict Cognitivist Theory of Emotion. If you treat emotions as modular responses to *imagined* scenarios (a standard view in contemporary cognitive science), there is no paradox to solve.
  3.  **Reframe the Question:** Stop asking "Is it real emotion?" and start asking "What is the functional role of this affective state in the context of artistic engagement?"

  **Verdict on your diagnosis:** You are right. It is three parallel arguments. The "Paradox" is largely a verbal dispute fueled by an undefended commitment to a specific theory of emotion, masked as a substantive puzzle about rationality. The empirical question (neuroimaging) is interesting but irrelevant to the conceptual knot. The way out is to stop trying to force fictional affect into the box of "real world emotion" and treat it as a distinct cognitive mode with its own norms.
