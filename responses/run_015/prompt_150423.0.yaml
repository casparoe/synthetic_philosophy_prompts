answer: |-
  This is a classic historiographical frustration. The phrase "revolutions devour their children" is a rhetorical grenade: it sounds profound, but it often functions to naturalize violence rather than explain it. In a seminar setting, using it to shut down a debate about the *structural inevitability* of the Terror is particularly ironic, because the slogan itself is a deterministic claim disguised as an observation.

  Here is a breakdown of the precise readings of the slogan, how they map onto the inevitability/contingency axis, and whether the phrase does any analytical work for a contingentist view.

  ### 1. The Menu of Precise Readings

  You offered four options. Here is how they unpack in terms of historical mechanism:

  **Option 1: The Realpolitik Reading (Power Struggles)**
  *   **The Claim:** Regime changes create power vacuums. Elites must consolidate authority to survive, and former allies become rivals.
  *   **Mechanism:** Institutional instability + human ambition.
  *   **Verdict:** **Banal.** This is essentially the "Iron Law of Oligarchy." While true, it explains why *purges* happen, but not necessarily why the *Terror* happened in its specific ideological and mass-violence form. It reduces the Terror to a standard coup cleanup.

  **Option 2: The Socio-Economic Reading (Marxist/Class Conflict)**
  *   **The Claim:** The revolution has a social logic. The bourgeoisie started it, but the *sans-culottes* and the poor pushed it further than the leaders intended. Leaders like the Girondins or Danton were "devoured" because they became brakes on the necessary momentum of class struggle.
  *   **Mechanism:** Material conditions and class pressure.
  *   **Verdict:** **Substantive (Deterministic).** This argues the Terror was the engine of history working itself out. The "devouring" is unavoidable because the social forces require it to move to the next stage.

  **Option 3: The Ideological Reading (Rousseauist/Totalitarian)**
  *   **The Claim:** This is the François Furet interpretation. The logic of the "General Will" allows no opposition. If the Revolution represents the People, then anyone opposing the current leadership is an enemy of the People. Purity requires constant purging.
  *   **Mechanism:** The internal logic of democratic absolutism.
  *   **Verdict:** **Substantive (Deterministic).** This suggests that once you accept the premise of total representation, the Terror is a logical outcome, not an accident. The revolution *must* eat its children to maintain ideological purity.

  **Option 4: The Circumstantial Reading (Contingency/Paranoia)**
  *   **The Claim:** The "devouring" wasn't a law of nature; it was a specific reaction to specific threats (foreign war, civil war in the Vendée, food shortages). Robespierre and the Committee of Public Safety weren't following a script; they were panicked actors making brutal choices under duress.
  *   **Mechanism:** Human agency + extreme environmental stress.
  *   **Verdict:** **Substantive (Contingent).** However, **the slogan fits poorly here.** If it's contingent, you shouldn't say "Revolutions devour their children" (a universal law); you should say "The Jacobins panicked in 1793."

  ---

  ### 2. Banal vs. Substantive

  *   **Banal:** Option 1. Saying "power struggles happen" is a truism. It drains the Terror of its specific horror and political novelty. It explains why ministers get fired, not why they get guillotined en masse for "virtue."
  *   **Substantive:** Options 2 and 3. These offer a *mechanism* for the violence. They explain why the violence escalated rather than stabilized. Option 4 is also substantive but requires discarding the slogan's universalizing language.

  ### 3. Inevitability vs. Contingency

  This is the crux of your seminar debate.

  *   **Supports Inevitability:** Options 2 and 3 (and arguably 1). If revolutions *as a category* devour their children, then the French Revolution *had* to do it. It treats "The Revolution" as a singular actor with a nature, rather than a series of human choices. This is a **deterministic** stance.
  *   **Supports Contingency:** Option 4. But notice the tension: if you argue contingency, you are arguing *against* the slogan. You are arguing that *this* revolution devoured its children because of *these* specific wars and *these* specific men, not because "Revolutions" do.

  ### 4. Does the Slogan Support Contingency?

  **Short Answer:** No. It almost always smuggles in determinism.

  **Long Answer:**
  The phrase is a **reification**. It turns a complex series of political events into a biological or mythological inevitability (a monster eating its young).
  *   **If you defend contingency:** You must argue that the Terror was a *failure* of politics, a specific breakdown, or a choice made under duress. You would say, "The revolution didn't have to eat Danton; Robespierre chose to sacrifice him to save the Committee."
  *   **If you use the slogan:** You imply that Danton's death was the natural lifecycle of the revolutionary organism.

  **Why your classmate used it to shut down the debate:**
  The slogan functions as a **conversation stopper** because it moves the discussion from *history* (what happened and why) to *mythology* (what revolutions "are").
  *   If the Terror is inevitable (structural/ideological), then debating "could they have stopped?" is pointless.
  *   By invoking the slogan, your classmate implicitly took the **Inevitability** side (likely leaning toward the Furet/Ideological or Marxist/Structural view) but packaged it as a timeless wisdom to avoid having to provide evidence.

  ### Summary for Your Seminar

  If you want to push back, you can argue that the slogan is historiographically lazy. It conflates **correlation** (many revolutions have purges) with **causation** (the nature of revolution causes purges).

  *   **To defend Contingency:** You must reject the slogan. Argue that the "devouring" was a specific political tactic adopted by the Committee of Public Safety to manage the war economy and suppress factionalism, not an inherent trait of revolution. (See historians like William Doyle or Timothy Tackett).
  *   **To defend Inevitability:** You can keep the slogan, but you must specify *which* mechanism made it inevitable. Was it the logic of the General Will (Furet)? Or the pressure of the sans-culottes (Soboul)?

  **Final Verdict:** The phrase "revolutions devour their children" is a **determinist slogan**. It does no work for a contingency view. If you want to argue contingency, you need to argue that revolutions *sometimes* devour their children, depending on who is holding the knife and why. Using the universal phrase concedes the point to the structuralists.
