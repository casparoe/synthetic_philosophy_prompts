prompt: |-
  I run genetics for a mid-size laying-hen operation and we're moving from small cages to bigger mixed-group pens, and suddenly the old way of picking breeders is breaking. Until now we've measured each hen's production and picked the top individual hens, but in the group pens the hens that score best on their own are often the nastiest ones — they eat more because they shove others off the feed. Someone at a conference told me there's a whole literature on this, that a couple decades back some people got calmer, more productive birds by selecting whole groups together instead of individual hens, and that this hooks into an old fight in evolutionary biology about whether selection acts on genes, individuals, or groups. I have a math background but zero evolutionary theory, so translate as you go.

  Write me a decision procedure for choosing breeders that my team can run every generation. It should be grounded in what the levels-of-selection debate actually says — when picking on the individual is fine, when you have to pick at the group level, and why (I gather it's something about heritable variance getting partitioned between levels, but explain that in plain terms). The procedure needs: which measurements to take and in what order; a rule for when to rank birds individually vs. rank whole groups; what to do about traits you can't score at the group level (mortality is easy, feather cover is harder, pecking order is a nightmare); and it has to be honest about where the math stops and somebody just has to make a judgement call — mark those places clearly, don't dress them up as steps.

  Then run it on three cases that are basically our real decisions: (1) feather pecking, where the damage is done by a few hens but the whole group loses feathers and it's hard to tell who's the culprit; (2) feed efficiency, where our costs are per-pen but every heritability number we have our per-bird; (3) a line where we've selected individually for egg size for ten years and I'm told moving to group selection now would cost us years of progress on the exact trait we sell. If the procedure gives an answer I wont like on case 3, give it anyway. And tell me what the procedure can't do — anywhere the biology genuinely dosn't have a settled answer, flag it instead of inventing a rule. It needs to be runnable by a technician in an afternoon with nothing fancier than a spreadsheet.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Genetics manager for a mid-size laying-hen operation.
      *   **Context:** Moving from individual cages to mixed-group pens. Individual selection is failing (selecting for aggression/social dominance).
      *   **Problem:** Need a new breeder selection procedure grounded in evolutionary theory (levels of selection), specifically addressing the conflict between individual and group selection.
      *   **Audience:** Tech-savvy (math background) but zero evolutionary theory. Needs plain English explanations of concepts like heritable variance partitioning.
      *   **Requirements:**
          *   Decision procedure (step-by-step).
          *   Grounded in levels-of-selection theory (Individual vs. Group).
          *   Specifics: Measurements, order, rules for ranking (individual vs. group), handling hard-to-score traits.
          *   Honesty: Mark where math ends and judgment begins.
          *   Application: Run the procedure on three specific cases (Feather Pecking, Feed Efficiency, Egg Size).
          *   Constraints: Runnable by a technician in an afternoon with a spreadsheet.
          *   Caveats: Admit where biology isn't settled.

  2.  **Deconstruct the Evolutionary Theory (Levels of Selection):**
      *   *Core Concept:* Price Equation / Multilevel Selection (MLS).
      *   *Plain English:* Total evolutionary change = Change due to individual differences + Change due to group differences.
      *   *The Conflict:* Sometimes what's good for the individual (aggression, hogging feed) is bad for the group (lower total egg production, higher mortality). This is "social genetic effects" or "associative effects."
      *   *Variance Partitioning:* Phenotypic variance ($V_P$) splits into Direct Genetic Variance ($V_{D}$) and Social/Indirect Genetic Variance ($V_{S}$). In groups, you also have Group Environmental Variance.
      *   *The Rule:* If social effects are strong and negative (aggression), individual selection fails. You need to select on *group performance* or use a model that accounts for social effects (IGS/SGE).
      *   *Simplification for the User:* Don't bog them down in the full Price Equation derivation, but explain the *variance partitioning* concept clearly. "Is the variation between pens bigger than the variation between hens within pens?"

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A flowchart-like text that a technician can follow.
      *   *Step 1: Define the Trait & Economic Weight.* What are we optimizing?
      *   *Step 2: Assess Social Interaction.* Is this trait affected by neighbors? (Crucial step).
      *   *Step 3: Data Structure.* Do we have individual ID within groups?
      *   *Step 4: Variance Check (The Math Part).* Compare within-group vs. between-group variance.
      *   *Step 5: Selection Index.* How to combine individual and group data.
      *   *Step 6: The Judgment Call.* Where the model breaks.

      *Refining the "Math vs. Judgment" aspect:* The prompt specifically asks to mark where math stops. This usually happens when weighting economic values or deciding if a trait is "social" enough to warrant group selection.

  4.  **Developing the Three Cases:**

      *   *Case 1: Feather Pecking.*
          *   *Nature:* Highly social, negative externality. Victim suffers, perpetrator might gain status/resources.
          *   *Procedure Outcome:* Individual selection is dangerous. Group selection or Specific Combining Ability is needed.
          *   *Verdict:* Select whole groups (or cull whole groups).

      *   *Case 2: Feed Efficiency.*
          *   *Nature:* Mixed. Individual metabolism + social competition for feed.
          *   *Data:* Costs per pen, heritability per bird.
          *   *Procedure Outcome:* Need to partition variance. If competition is high, group average is better. If feeders are individual, individual works.
          *   *Verdict:* Likely needs a blended index (Individual + Group Mean).

      *   *Case 3: Egg Size (Historical Individual Selection).*
          *   *Nature:* Mostly direct genetic effect. Low social conflict.
          *   *Conflict:* Fear of losing gain.
          *   *Procedure Outcome:* Theory says if social effects are negligible, individual selection is *more* efficient. Group selection dilutes selection intensity.
          *   *Verdict:* Stick to individual selection (with monitoring). Don't switch to group selection blindly. This might be the "answer I won't like" if they think group selection is a magic bullet, but scientifically it's the correct answer for non-social traits.

  5.  **Refining the Tone and Constraints:**
      *   *Tone:* Professional, direct, mathematically literate but biologically explanatory.
      *   *Constraint:* Spreadsheet friendly. No complex mixed models (REML/BLUP) unless they can approximate them. *Correction:* The prompt says "nothing fancier than a spreadsheet." I cannot ask them to run an Animal Model. I need to simplify the variance partitioning to ANOVA-style calculations or simple correlations.
      *   *Constraint:* "Mark those places clearly, don't dress them up as steps." I will use bold warnings like **[JUDGMENT CALL]**.

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the shift. Explain the "Levels of Selection" simply (Price Equation intuition).
      *   **The Theory Bit:** Explain $V_{Total} = V_{Individual} + V_{Group}$. Explain that if $V_{Group}$ is driven by aggression, selecting individuals picks aggressors.
      *   **The Procedure:**
          1.  Trait Classification (Social vs. Non-social).
          2.  Data Collection (Individual ID in Groups).
          3.  The Variance Ratio Test (Intraclass Correlation).
          4.  Selection Method Choice.
          5.  Weighting.
      *   **The Cases:** Apply the steps.
      *   **Limitations:** What the procedure can't do (GxE, long-term inbreeding, etc.).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is asking for an ANOVA too hard for a "spreadsheet afternoon"?
      *   *Fix:* Provide the specific Excel formulas for the Variance Ratio. Keep it to `VAR.P` and `VAR.S` logic or simple averages. Actually, the Intraclass Correlation Coefficient (ICC) is the standard metric here. I can describe how to approximate it: (Variance Between Groups) / (Total Variance).
      *   *Critique:* Case 3 might be controversial.
      *   *Fix:* Ensure the explanation is solid. If a trait has no social component, group selection reduces selection intensity ($i$) without reducing environmental noise enough to compensate. It *will* slow progress. I must state this clearly.
      *   *Critique:* The prompt asks for "heritable variance getting partitioned."
      *   *Fix:* Use the terms Direct Genetic Effect (DGE) and Indirect Genetic Effect (IGE). Explain that Total Breeding Value = DGE + (n-1)*IGE.

  8.  **Final Polish:** Check against all constraints.
      *   Math background respected? Yes.
      *   Evo theory translated? Yes.
      *   Decision procedure clear? Yes.
      *   Judgment calls marked? Yes.
      *   Three cases run? Yes.
      *   Spreadsheet feasible? Yes.
      *   Honest about limitations? Yes.

  9.  *(Self-Correction on Case 3)*: The prompt says "If the procedure gives an answer I wont like on case 3, give it anyway." This implies the user *expects* group selection to be the answer, but for egg size, it likely isn't. I need to be firm there.

  10. *(Refining the "Spreadsheet" constraint)*: Real genetic evaluation uses BLUP. A spreadsheet can't do BLUP. I need to be honest that the procedure is an *approximation* for decision making, not a full genetic evaluation. I will frame it as a "Selection Protocol" using phenotypic data as a proxy for breeding value, acknowledging the limitation. *Wait, better approach:* I can instruct them to use Group Means as a proxy for the Social Effect. It's not perfect BLUP, but it's spreadsheet-doable.

  11. *(Final check on "Levels of Selection")*: Ensure I explicitly mention that selection acts on the *vehicle* (hen) but the *replicator* (gene) sees the total effect. The conflict arises when the gene spreads by helping the individual at the expense of the group.

  Let's assemble the response.

  *Structure:*
  1.  **Theory Primer:** The "Why" (Variance Partitioning).
  2.  **The Procedure:** The "How" (Steps 1-5).
  3.  **The Cases:** Application.
  4.  **Limitations:** What this doesn't solve.

  *Key Concept to simplify:* The Price Equation.
  $\Delta z = Cov(w, z)$.
  In groups: $\Delta z = Cov(W_{group}, Z_{group}) + E[Cov(w_{ind}, z_{ind})]$.
  Translation: Change = Group Selection + Individual Selection.
  If Individual Selection favors aggression (high $w_{ind}$) but Group Selection favors calm (high $W_{group}$), and Aggression hurts Group, you have a conflict.

  Okay, ready to write.
answer: |-
  ## Part 1: The Theory (Translated for a Mathematician)

  You have a math background, so think of this as a variance partitioning problem with a covariance twist.

  In the old cage system, a hen's phenotype ($P$) was mostly her Direct Genetic Effect ($D$) plus environment ($E$).
  $$P = D + E$$
  When you selected the top individuals, you were selecting on $D$. This worked because $E$ was randomized and independent between hens.

  In group pens, a hen's phenotype is now:
  $$P = D + S + E$$
  Where $S$ is the **Social (Indirect) Genetic Effect**. This is the genetic impact of her *pen-mates* on her.
  *   If she has aggressive pen-mates, her $S$ is negative (she gets shoved off feed).
  *   If she is aggressive, she imposes a negative $S$ on others.

  **The Levels of Selection Conflict:**
  Evolutionary theory (specifically Multilevel Selection) states that total evolutionary change is the sum of selection between groups plus selection within groups.
  *   **Individual Selection:** Picks hens with high $P$. In a competitive pen, high $P$ often means high Aggression (high $D$ for bullying, negative $S$ for others).
  *   **Group Selection:** Picks pens with high Total Output. This favors low Aggression (high $D$ for laying, positive/neutral $S$ for others).

  **The Variance Rule:**
  You need to estimate how much of the variation in your data is **Between Groups** vs. **Within Groups**.
  *   If most variance is *Within Groups* (hen A lays way more than hen B in the same pen), Individual Selection is efficient.
  *   If most variance is *Between Groups* (Pen 1 lays way more than Pen 2, but hens within pens are similar), Group Selection is required.
  *   **The Danger Zone:** If individual performance is negatively correlated with group performance (the "nasty hen" problem), Individual Selection will drive the population extinct. You must select on Group Means or use an index that penalizes social harm.

  ---

  ## Part 2: The Decision Procedure

  **Goal:** Determine the selection method for a specific trait in the next generation.
  **Tools:** Spreadsheet, Phenotypic Data (Individual ID + Group ID), Basic Stats functions.
  **Time:** < 4 hours per trait.

  ### Step 1: Trait Classification (The "Social" Test)
  Before touching data, classify the trait.
  *   **Type A (Autonomous):** Trait is physically internal and unaffected by neighbors (e.g., Egg Shell Color, specific blood markers).
  *   **Type B (Competitive):** Trait requires shared resources where one hen's gain is another's loss (e.g., Feed Intake, Space usage).
  *   **Type C (Destructive):** Trait actively harms neighbors (e.g., Feather Pecking, Aggression).

  **Action:**
  *   If **Type A**: Skip to Step 4 (Individual Selection).
  *   If **Type B or C**: Proceed to Step 2.

  ### Step 2: The Variance Ratio Test (The Math)
  You need to know if the "Group Effect" is strong enough to override individual data.

  1.  **Organize Data:** Column A = Hen ID, Column B = Pen ID, Column C = Trait Value (e.g., Egg Count).
  2.  **Calculate Group Means:** Average the trait for each Pen ID.
  3.  **Calculate Variances:**
      *   $Var_{Total}$: Variance of all individual records.
      *   $Var_{Between}$: Variance of the Pen Means.
      *   $Var_{Within}$: $Var_{Total} - Var_{Between}$ (Approximation for quick screening).
  4.  **Calculate Intraclass Correlation (ICC):**
      $$ICC = \frac{Var_{Between}}{Var_{Total}}$$
      *(Note: In a full ANOVA you adjust for group size, but for a spreadsheet screen, this ratio suffices.)*

  **Decision Rule:**
  *   **ICC < 0.1:** Group effects are weak. **Select Individuals.**
  *   **ICC > 0.3:** Group effects are strong. **Select Groups.**
  *   **ICC 0.1 – 0.3:** **Mixed Strategy (Index Selection).** (See Step 3).

  ### Step 3: The Correlation Check (The Conflict Test)
  *Only run this if ICC > 0.1.*
  You need to know if individual success hurts the group.

  1.  **Calculate:** Correlation between **Individual Trait Value** and **Pen Mean (excluding the individual)**.
      *   *Why exclude individual?* To see if a hen's high score is associated with her pen-mates doing poorly.
  2.  **Result:**
      *   **Positive Correlation:** Good hens make good neighbors. **Select Individuals.**
      *   **Zero Correlation:** Independent. **Select Individuals** (higher intensity).
      *   **Negative Correlation:** High performers suppress neighbors. **Select Groups.**

  **[JUDGMENT CALL 1]:** If the correlation is weakly negative (e.g., -0.1 to -0.2), you must decide if the economic loss from aggression outweighs the genetic gain from individual selection. There is no formula for this price. **Mark this decision in your log.**

  ### Step 4: Selection Method Execution
  Based on Steps 1-3, choose one of three protocols:

  **Protocol A: Individual Selection (Type A traits or Low ICC)**
  *   Rank all hens by phenotype.
  *   Top $X\%$ become breeders.
  *   *Constraint:* Ensure no two breeders come from the same pen (to maintain family diversity).

  **Protocol B: Group Selection (High ICC or Negative Correlation)**
  *   Rank Pens by Total (or Average) Performance.
  *   Top $Y\%$ of Pens are "Breeder Pens."
  *   **Crucial:** Select *all* surviving hens from the top pens as breeders (randomly sampled if too many). Do not pick the "best" hen from a "bad" pen.

  **Protocol C: Index Selection (The Middle Ground)**
  *   Calculate a Score for each hen:
      $$Score = (Individual\_Value \times w_1) + (Pen\_Mean \times w_2)$$
  *   **$w_1$ (Individual Weight):** Start at 0.7.
  *   **$w_2$ (Group Weight):** Start at 0.3.
  *   **[JUDGMENT CALL 2]:** Adjust weights based on Step 3 correlation. If correlation is highly negative, increase $w_2$. If trait is critical for survival (mortality), $w_2$ must be $\ge 0.5$.

  ### Step 5: The "Unmeasurable" Trait Rule
  Some traits (pecking order, specific mortality causes) cannot be scored per bird.

  *   **Rule:** If a trait cannot be scored individually, it **must** be scored at the Group Level.
  *   **Integration:** If you are using Protocol A (Individual), you must still cull any individual from a group that fails the Group-Level threshold (e.g., Mortality > 5%).
  *   **Logic:** An individual from a dead group has no genetic future, regardless of her personal egg count.

  ---

  ## Part 3: Running the Procedure on Your Cases

  ### Case 1: Feather Pecking
  *   **Step 1 (Classify):** Type C (Destructive). Harm to neighbors is the definition of the trait.
  *   **Step 2 (Variance):** Likely High ICC. Feather loss is often clustered by pen due to social contagion.
  *   **Step 3 (Correlation):** Almost certainly Negative. The hen doing the pecking often has better feathers (less stress) or higher status, while the group loses feathers.
  *   **Step 4 (Method):** **Protocol B (Group Selection).**
  *   **Reasoning:** You cannot identify the culprit reliably without video surveillance (too expensive). Selecting individuals risks picking the aggressors. You must select calm *groups*.
  *   **Action:** Rank pens by feather score. Select breeders only from the top 20% of pens.
  *   **Unmeasurable Note:** You can't score "aggression" individually. Treat "Pen Feather Score" as the primary trait.

  ### Case 2: Feed Efficiency
  *   **Step 1 (Classify):** Type B (Competitive). Feed is a shared resource in pens.
  *   **Step 2 (Variance):** Check your spreadsheet.
      *   *Scenario:* You find ICC = 0.25. (Moderate group effect).
  *   **Step 3 (Correlation):** Check Individual Intake vs. Pen Efficiency.
      *   *Likely Result:* Weakly Negative. The hens eating the most (high individual intake) might be bullying others, lowering overall pen efficiency.
  *   **Step 4 (Method):** **Protocol C (Index Selection).**
  *   **Reasoning:** Feed efficiency has a strong biological component (metabolism) that is individual. Ignoring individual data loses genetic gain. But ignoring group data selects bullies.
  *   **Action:** Use the Index Score.
      $$Score = (0.6 \times Individual\_Efficiency) + (0.4 \times Pen\_Efficiency)$$
      *(Note: Efficiency = Eggs / Feed. Higher is better.)*
  *   **[JUDGMENT CALL]:** You must decide the economic weight of feed vs. eggs. If feed costs spike, increase the Pen Weight ($w_2$) because group harmony saves feed.

  ### Case 3: Egg Size (Historical Individual Selection)
  *   **Step 1 (Classify):** Type A (Autonomous). One hen's egg size does not physically prevent another from laying a large egg.
  *   **Step 2 (Variance):** ICC will be low. Egg size variance is mostly within-pen.
  *   **Step 3 (Correlation):** Zero. A hen laying large eggs does not suppress her neighbor's egg size.
  *   **Step 4 (Method):** **Protocol A (Individual Selection).**
  *   **The Hard Truth:** Moving to Group Selection here **will reduce genetic gain.**
      *   *Why?* Selection Intensity ($i$). In Individual Selection, you pick the top 1% of hens. In Group Selection, you pick the top 10% of pens, then take all hens. You are forced to keep mediocre layers just because they are in a good pen.
      *   *Variance:* Since there is no social conflict (negative correlation), the "Group" component adds noise, not signal.
  *   **Action:** Continue Individual Selection.
  *   **Caveat:** Monitor the *variance* in egg size. If group housing causes stress that increases variance, you may need to select for *stability* (lower within-pen variance), but do not switch to Group Selection for the mean trait.
  *   **Warning:** If you switch to Group Selection for Egg Size because "it's the new standard," you will lose 3-5 years of progress. Do not do it.

  ---

  ## Part 4: Limitations & Where the Math Stops

  This procedure is a heuristic, not a full genetic evaluation. Here is where it fails and you need external help:

  1.  **Heritability Estimates:** This procedure uses *phenotypic* variance. It assumes phenotypic correlations match genetic correlations.
      *   *Risk:* Sometimes hens look similar because they share the same environment, not genes.
      *   *Flag:* If you see high ICC, verify it isn't just a "bad batch of feed" in one pen. Randomize feed batches across pens.
  2.  **Inbreeding:** Group selection accelerates inbreeding because you are selecting families, not individuals.
      *   *Flag:* If you use Protocol B (Group Selection) for more than 3 generations, you **must** introduce outside genetics or use a pedigree tracker to avoid mating cousins. This spreadsheet does not track kinship.
  3.  **GxE Interactions:** A hen selected for calm in a pen of 10 might be aggressive in a pen of 50.
      *   *Flag:* Keep your selection pens the same size as your commercial pens. If they differ, the selection is invalid.
  4.  **The "Judgment Calls":**
      *   In Step 3, deciding the economic weight of aggression vs. production is not math. It is business strategy.
      *   In Case 3, resisting the urge to "modernize" egg size selection requires discipline. The math says stay individual; the industry buzz says go group. Trust the math on autonomous traits.

  **Summary for your Team:**
  1.  **Feather Pecking:** Select Groups (Survival of the calmest).
  2.  **Feed Efficiency:** Select Index (60% Bird, 40% Pen).
  3.  **Egg Size:** Select Individuals (Don't fix what isn't broken).
  4.  **Always:** Randomize families across pens to ensure "Group Effect" is genetic, not environmental.
