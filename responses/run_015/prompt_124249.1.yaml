answer: |-
  The coffee maker gurgled, a sound that used to mean *morning* and now meant *shift start*.

  Mark stood in the kitchen, watching the steam rise. For the last three weeks, since the neurologist used the A-word, he'd been filling his head with noise. Essays on screens. PDFs about ancient Greeks who lived in huts and wore rags. They talked about a circle. Inside the circle: your mind, your choices, your judgments. Outside the circle: everything else. Other people, sickness, the past, the weather.

  *Keep the circle tight,* the essays said. *You suffer when you try to hold what isn't yours.*

  But looking at his mother, Eleanor, sitting at the sun-drenched kitchen table, the circle felt like a noose.

  She was pushing the orange pill organizer away with the back of a trembling hand. The Tuesday slot was open. The little blue capsule sat there, exposed.

  "I'm not taking that one," she said. Her voice was thin, but the edge was sharp. "It makes me feel like I'm walking through water."

  "That's the one for the swelling, Mom," Mark said. He kept his voice level. Practice made perfect. "Dr. Chen said it's critical."

  "Dr. Chen doesn't live in my legs." She crossed her arms. She was wearing the robe with the frayed cuffs, the one she'd had for twenty years. She looked small, but in this moment, she felt immovable.

  Mark felt the old panic rise in his throat. The old Stoic rule flashed: *Her body is outside your control. Her choice is outside your control. Only your reaction is yours.*

  If he followed that rule, he would accept her refusal. He would detach. He would let her be wrong, because her error was "external" to his mind. But if she didn't take the meds, she'd swell. If she swelled, she'd fall. If she fell, she'd break. And he would be the one picking up the pieces.

  The dichotomy was broken. It assumed two solid walls: Me and You. But Alzheimer's was an eraser. It was sanding down the wall of *Her* until it was bleeding into *Him*.

  He needed a new geometry.

  He walked over and pulled out the chair opposite her. He didn't sit immediately. He leaned against the table, close enough that his sleeve brushed her robe.

  "Okay," Mark said. "You don't want the blue one."

  "No."

  "Because of the water feeling."

  "Yes."

  Mark closed his eyes for a second. He visualized the control not as a circle, but as a rope. A heavy, wet rope they were both holding. Yesterday, he had been pulling most of the weight because she was confused about the time. Today, she was lucid enough to grip the rope. She was pulling back.

  If he yanked the rope, he wins the pill, but he breaks the connection. If he drops the rope, he keeps his peace, but she gets hurt.

  *Distributed Control,* he thought. *The grip slides.*

  "Mom," he said, opening his eyes. "I'm worried. If your legs swell, you can't walk to the garden. And I know you want to see the hydrangeas."

  Her eyes flickered. The garden was hers. That was still inside her circle.

  "The hydrangeas are blue," she said suspiciously. "Like the pill."

  "Coincidence."

  "I don't like blue things today."

  Mark felt the boundary shift again. It wasn't about the medicine anymore. It was about the color. The disease was stealing her vocabulary for discomfort, leaving her only with aesthetics. She couldn't say *I feel scared I'm losing myself*, so she said *I don't like blue*.

  This was the leak. Her capacity to process the *why* was fading, so the control over the *what* had to be shared. He had to hold the *why* for her, while she held the *what*.

  "Okay," Mark said. "No blue."

  He reached for the pill organizer. He popped the blue capsule out. It sat in his palm, tiny and synthetic.

  "I'm going to hold this for a minute," he said.

  Eleanor watched him, wary.

  "I'm going to hold the worry about what the pill does," Mark continued, speaking slowly, testing the weight of the new idea. "You hold the feeling of your legs. If the water feeling comes back, you tell me. We decide together if we keep it. But for this morning, I need to carry the worry so you don't have to."

  It was a lie, technically. The chemistry didn't care about their agreement. But the *compliance* did. The compliance lived in the space between them.

  He wasn't asking her to surrender control. He was asking to borrow it.

  Eleanor looked at his hand. Then she looked at his face. She was searching for the son who used to ask for money for college, and finding the man who now held the keys to her house. The grief of that swap passed over her face, quick as a cloud shadow.

  "You'll carry it?" she asked.

  "I promise. I'll carry the worry. You just drink the water."

  He placed the pill on a spoon and held it out. He didn't move it toward her mouth. He kept it in the neutral zone, on the table.

  She looked at the spoon. The control was hovering there, unclaimed. If she took it, she was accepting his help. If she refused, she was asserting her self.

  "I hate the water feeling," she whispered.

  "I know. I'll be here when it happens. I'll rub your calves. I'll get the ice packs." He was listing things that were technically *his* actions, but framing them as *their* solution. "We'll manage the water. Together."

  *Together.* The word dissolved the circle.

  Eleanor's hand moved. It was shaky. She didn't take the spoon. She knocked it gently, tipping the pill into her palm.

  "One day," she said. "Just today."

  "Just today," Mark agreed.

  She put the pill in her mouth and swallowed it with a gulp of tepid tea.

  Mark exhaled, a long, shuddering breath he hadn't realized he was holding. He had won. But it didn't feel like victory. It felt like a transfer. He had taken the burden of the consequence onto his own shoulders to make the weight light enough for her to lift.

  She finished the tea and set the cup down. She looked at him, clear-eyed for a fleeting second.

  "You're a good boy, Markie."

  Then she blinked, and the clarity slipped. She looked down at the orange organizer.

  "Did I take my morning pills?" she asked.

  The rope went slack. The capacity had vanished as quickly as it arrived.

  Mark felt the ache in his chest, the specific sting of the disease resetting the board. But he didn't reach for the old circle. He didn't tell her *Yes, I made you do it.* He didn't tell himself *It's out of my control.*

  He reached out and covered her hand with his.

  "We did it," Mark said. "We took them together."

  "Oh," she said. She relaxed into the touch. "Good. That's good."

  She stood up, shuffling toward the living room, already forgetting the negotiation, forgetting the blue pill, forgetting the fear.

  Mark stayed at the table. He looked at the empty Tuesday slot in the organizer. He picked up the orange plastic case and ran his thumb over the ridges.

  The essays said peace comes from knowing what is yours. Mark looked at the empty slot, then at his mother's retreating back.

  *Nothing is just mine,* he thought. *And nothing is just yours.*

  He put the organizer in his pocket. He would carry the schedule tomorrow, too. He would carry the memory of this morning when she couldn't. He would hold the control until she was strong enough to grip the rope again, or until his hands were the only ones left holding on.

  It wasn't stoic. It wasn't clean. But as he stood up to follow her, it felt like the only way to stay in the room.
