      *   **Conflict:** The boundary of control is blurry/leaking. The caregiver decides meds, the patient decides whether to take them.
      *   **Format:** Short story.
      *   **Specific Scene:** A morning routine where the mother refuses something, and the caregiver must determine whose "sphere" the refusal belongs to.
