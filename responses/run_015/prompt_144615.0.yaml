      *   **The Scenario:** Causal Inference and Counterfactual Simulation (specifically Climate/Geoengineering or Pharmacological trials). Let's go with **Pharmacological/Toxicological Modeling** or **Climate**. Climate is more "systemic." Let's use **Climate/Geoengineering** because it involves *novel* states.
