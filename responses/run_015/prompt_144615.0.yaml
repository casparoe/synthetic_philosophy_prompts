      *   *The Occasionalist Twist:* If parameters aren't properties of the system but records of God's past habits, then running a model for a *novel* scenario (one God hasn't "habitually" done before) is ontologically empty.
      *   *The "Knot":* The distinction between *extrapolation* (more of the same) and *intervention* (changing the system). Occasionalism collapses this distinction because the "system" has no internal structure to intervene *upon*.

  5.  **Refining the Argument (Ontological vs. Epistemic):**
      *   *Hume:* "How do we know the sun will rise?" (Justification of belief).
      *   *Occasionalist Ontology:* "What does the equation $F=ma$ refer to?" If it doesn't refer to a property of mass, but to a Divine Habit, then *simulation* is impossible. Simulation assumes we can isolate variables. Occasionalism says variables aren't isolated; they are all directly sustained by one Will.
      *   *Specific Tension:* **Parameter Stability in Counterfactual Modeling.**
      *   *Scenario:* A climate model tries to predict the effect of geoengineering (injecting aerosols).
      *   *Realist View:* We change one variable (aerosols), the physical laws (thermodynamics) stay the same, we get a result.
      *   *Occasionalist View:* There are no physical laws. There is only God's habit. Has God established a habit for "worlds with geoengineering"? No, this is new. So the model isn't calculating a physical outcome; it's guessing at a new Divine Habit.
      *   *The Kicker:* In modern causal inference (e.g., Judea Pearl), causality is defined by *invariance* under intervention. Occasionalism denies the invariance because the "cause" of the outcome is always the Will, not the invariant structure.

