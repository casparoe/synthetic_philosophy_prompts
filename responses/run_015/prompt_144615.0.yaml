  i'm in a philosophy of science seminar and we've been arguing about Al-Ghazali's occassionalism — the view that God is the direct cause of every single event and things like fire only burn cotton because God consistently pairs them. Everyone keeps using the cotton-and-fire example, which feels totally tired and doesn't really stress-test the view.

  What I actually need is an example of a conceptual issue that only pops up when you take occasionalism seriously in a modern, technical context — not just medieval theology. Like, imagine a climate model predicting a hurricane path, or an AI diagnosing sepsis from vital signs. In an occasionalist framework there are no causal powers in nature, just divine habits. Can you lay out a concrete scenario where this creates a conceptual tension that's genuinely different from Hume's problem of induction? I want to see where the problem isn't just epistemic — how do we justify predicting X — but ontological: what does prediction even mean if nature has no internal tendency to behave one way? Make it specific enough that I could present it to my study group, but don't ask me to read specific texts — I need the knot, not a bibliography. (sorry for any typos, typing on my phone)
