          *   *Verdict:* **Stimulated Recall (Replay with Eye-Tracking/Logs)** is likely superior for *extraction*, but **Live** is better for understanding *workflow*.
          *   *Refinement:* Actually, for *teaching residents*, you want to capture the *heuristics*. Retrospective recall often yields better *explanations* (know-that), even if they are post-hoc rationalizations, because that's what you want to teach (the conceptual framework). However, live narration captures the *triggers*.
          *   *Best Practice:* **Concurrent Think-Aloud + Eye Tracking.** Why? Because the divergence suggests one expert is lying (unconsciously) about their process. Eye tracking reveals if the "holistic" expert actually fixated on specific distortion cues before saying "reads wrong."
      *   **Addressing the Divergence:** This is a feature, not a bug. Teach both strategies. Analytic vs. Holistic.
