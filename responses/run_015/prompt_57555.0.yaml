      *Cognitive Science Consensus:* For complex perceptual tasks, concurrent think-aloud can alter the strategy (reactivity). Retrospective think-aloud (stimulated recall) is often better for capturing the *reasoning* without disrupting the *performance*.
      *However*, for the "holistic" expert, the reasoning *is* the perception.
      *Decision:* Recommend **Stimulated Recall (Replay)** as the primary method for *extraction of rules*, because it allows the interviewer to probe the "reads wrong" comment until it yields features. Live narration is too fast and linear.

