answer: |-
  My friend Marcus, a historian of early modern science, was trying to periodize his "Sobriety Era" for a grant application. He wanted to demarcate a hard break between his "Domestic Middle Ages" of grad school and his "Personal Renaissance" of tenure.

  But the timeline was a mess. He'd bought the running shoes in 2019, but didn't quit drinking until 2021, and he'd already missed three runs by the time he filed the paperwork in 2022. The "humanism" was bleeding into the "scholasticism."

  "There's no rupture," he told me, staring into his coffee. "It's all gradual shifts that later narrators tidy up."

  "So how do you chapter it?" I asked. "Just pick a date."

  He sighed. "I can't. I'm realizing my life doesn't get a clean periodization. My 'Renaissance' is just Burckhardtian projection, and my 'Scientific Revolution' has no birth certificate. Future biographers are going to argue that my 'New Man' phase is just a 20th-century construct invented by Koyré to make my mid-life crisis look like epistemological progress."
