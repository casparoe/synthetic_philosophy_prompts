answer: |-
  ### The Moral Driver Classification Protocol (MDCP)

  **Purpose:** To determine whether a proposed industry norm change is driven by material interest, rational ethical argument, or honour dynamics.
  **Timebox:** 30 minutes.
  **Participants:** Ethics review panel (no philosophical expertise required).
  **Instructions:** Answer the following questions sequentially for each proposal. If a stopping condition is met, record the classification and cease analysis for that proposal.

  #### Step 1: The Commercial Interest Filter
  **Question:** Does the primary proponent of this change stand to gain direct revenue, market share, or cost reduction from its adoption?
  *   **Yes:** **STOP.** Classification: **Material Interest**. Return verdict: 'Not a moral revolution'.
  *   **No:** Proceed to Step 2.
  *   **Note:** This step assumes that norms driven primarily by profit are commercial strategies, not ethical progress.

  #### Step 2: The Harm Reduction Filter
  **Question:** Does the proposal prevent identifiable physical harm, legal liability, or systematic rights violations that exist independently of public opinion?
  *   **Yes:** Proceed to Step 3 (Candidate for Rational Argument).
  *   **No:** Proceed to Step 3 (Candidate for Honour Dynamics).
  *   **Flag:** This question requires defining "harm". If the panel disagrees on what constitutes harm (e.g., is environmental damage "harm" if it is distant?), mark this as a **Judgment Call**.

  #### Step 3: The Enforcement Mechanism Test
  **Question:** What is the primary penalty for non-compliance?
  *   **Legal/Contractual Penalty:** Classification leans towards **Rational Argument/Compliance**.
  *   **Social/Reputational Damage (Shame, Loss of Status):** Classification leans towards **Honour Dynamics**.
  *   **Flag:** If penalties are mixed, the panel must weigh which is more feared. Mark this as a **Judgment Call**.

  #### Step 4: The Status Sacrifice Check (Human Decision Point)
  **Question:** Would the proponents still support this norm if adopting it reduced their own social status or industry prestige?
  *   **Yes:** Classification: **Genuine Moral Revolution (Argument-led)**.
  *   **No:** Classification: **Status Game (Honour-led)**.
  *   **Warning:** This step cannot be mechanised. It requires the panel to introspect on motive. There is no data lookup for this. You must vote.

  ---

  ### Application of Procedure to Proposals

  #### 1. Banning Predictive Policing APIs
  *   **Step 1 (Commercial Interest):** **No.** Vendors of these APIs lose revenue if banned. Proponents (civil liberties groups, ethical engineers) do not gain direct profit.
      *   *Result:* Pass to Step 2.
  *   **Step 2 (Harm Reduction):** **Yes.** The argument rests on identifiable rights violations (bias, due process) and legal liabilities.
      *   *Result:* Pass to Step 3.
  *   **Step 3 (Enforcement):** **Mixed.** Bans are legal/contractual, but the push is often fueled by public outcry (reputation). However, the stopping condition is the ban itself (legal).
      *   *Result:* Leans Rational Argument.
  *   **Step 4 (Status Sacrifice):** **Yes.** Proponents often risk industry relationships to advocate this.
      *   *Human Decision:* The panel must agree that the risk to career status is real.
      *   *Resolution:* The framework classifies this as **Rational Argument**.
      *   *Judgment Flag:* Step 4 requires estimating the social cost to proponents. This is not measurable via metrics.

  #### 2. Mandating Open-Source Disclosure in Government Contracts
  *   **Step 1 (Commercial Interest):** **Yes/No (Ambiguous).** Large contractors may lose proprietary advantage (No gain), but smaller open-source vendors gain market access (Yes gain). Additionally, the government gains cost savings.
      *   *Human Decision:* The panel must decide whose interest counts as the "proponent". If the government is the proponent, it is cost-saving (Interest). If open-source vendors are the proponents, it is market-share (Interest).
      *   *Resolution:* If the panel views the government as the driver, Step 1 triggers **STOP**. Classification: **Material Interest**. Return verdict: 'Not a moral revolution'.
      *   *Judgment Flag:* Step 1 forces a decision on who the "proponent" is. This is a political definition, not a technical one.
      *   *Outcome:* For this exercise, we assume the government is the primary driver seeking cost efficiency.
      *   *Verdict:* **Not a moral revolution (Interest-driven).**

  #### 3. Attaching Carbon-Footprint Badges to Cloud Invoices
  *   **Step 1 (Commercial Interest):** **No.** Calculating and displaying this data incurs cost without direct revenue increase for the provider.
      *   *Result:* Pass to Step 2.
  *   **Step 2 (Harm Reduction):** **No (Debatable).** The badge itself does not reduce carbon; it only reports it. The harm reduction depends on subsequent customer action, which is indirect.
      *   *Human Decision:* The panel must decide if "reporting" equals "preventing harm". Most engineers know reporting does not equal mitigation.
      *   *Result:* Leans towards Honour Dynamics.
  *   **Step 3 (Enforcement):** **Social/Reputational.** There is no law requiring this yet. The penalty for not having it is looking "ungreen" to clients.
      *   *Result:* Strong lean towards **Honour Dynamics**.
  *   **Step 4 (Status Sacrifice):** **No.** Adopting this *increases* status (being seen as responsible). Not adopting it reduces status. Proponents support it because it boosts their brand prestige.
      *   *Human Decision:* The panel must admit that the motive is prestige enhancement.
      *   *Resolution:* The framework classifies this as **Honour Dynamics**.
      *   *Unwelcome Answer:* This result will likely be unwelcome. Panels often view environmental measures as inherently ethical (Rational Argument). This procedure identifies them as status signalling (Honour), which implies the moral value is performative rather than substantive.
      *   *Judgment Flag:* Step 2 and Step 4 require subjective assessment of "harm" and "motive". There is no log file for this.

  ---

  ### Analysis of Framework Limitations

  You requested explicit flagging of where normative judgement replaces mechanised reasoning. In the application above, three critical failure points for automation appeared:

  1.  **Defining the Proponent (Step 1, Open Source):** The procedure cannot determine who counts as the "driver" of a norm. Is it the regulator, the vendor, or the community? This is a political choice disguised as a filter.
  2.  **Defining Harm (Step 2, Carbon):** The procedure cannot distinguish between direct harm prevention and indirect signalling. Engineers prefer measurable metrics, but "harm" in this context is philosophical.
  3.  **Assessing Motive (Step 4, All):** This is the most significant limitation. Asking whether proponents would act without status gain requires mind-reading. The panel must vote based on intuition. This step is merely a judgment call dressed up as protocol.

  Despite these limitations, the procedure forces the panel to separate profit (Interest), rights (Argument), and reputation (Honour). In the case of the carbon badges, it strips away the ethical veneer to reveal the status mechanic underneath.

  Verdict: Carbon-footprint badges
