answer: |-
  **ASSEMBLY INSTRUCTIONS: MODEL 3000**

  **Congratulations.** You have selected the Model 3000 Community Integrity Unit. This unit is a direct upgrade to the discontinued Model 100. Users of the Model 100 reported structural failure upon contact with external data sources; the filtration mesh was porous, allowing unverified outside narratives to puncture the interior environment. The Model 3000 solves this by reinforcing internal coherence rather than relying on isolation alone.

  **PARTS LIST**
  *   (A) Perimeter Wall Panels x4
  *   (B) Internal Authority Peg x1
  *   (C) Discrediting Circuit Module x1
  *   (D) Loyalty-Test Attachment x1
  *   (E) Assembly Key x1

  **ASSEMBLY**

  **Step 1**
  Connect Perimeter Wall Panels (A) to form a closed loop. Ensure there are no gaps. While the Model 100 functioned as a simple screen, the Model 3000 requires a sealed environment to maintain pressure.

  **Step 2**
  Insert the Internal Authority Peg (B) into the center of the structure. This peg serves as the primary anchor for all truth claims within the unit. Tighten until secure. Do not overtighten, as the Authority must remain flexible enough to adapt narratives when required.

  **Step 3**
  Attach the Discrediting Circuit Module (C) to the interior face of the Perimeter Walls. **WARNING:** You must install the Authority Peg (B) *before* installing the Discrediting Circuit (C). If the Circuit is activated prior to the establishment of Internal Authority, the module will classify the Authority as an external source and discredit it immediately, causing total structural collapse.

  **Step 4**
  Calibrate the Discrediting Circuit. Set the sensitivity to "Universal." The module must flag all signals originating outside the Perimeter Walls as compromised. This includes signals from individuals claiming the Circuit itself exists. If the module fails to discredit reports of its own existence, it will recurse upon itself. Align the arrows carfully to ensure total coverage.

  **TROUBLESHOOTING / FAQ**

  **Q: Members are still accepting evidence from outside sources.**
  **A:** You have likely assembled a Model 100. The Model 3000 does not rely on blocking exposure; it relies on pre-emptive distrust. If external facts penetrate the unit, the Discrediting Circuit was not installed correctly. Refer to Step 3. You cannot simply filter information; you must invalidate the sender.

  **Q: A member trusts a childhood friend who disagrees with the Internal Authority.**
  **A:** Personal history is not a valid credential. Attach the Loyalty-Test Attachment (D) to the member's interface. This reframes the friend not as a neutral party, but as an outsider who has already been compromised by external narratives. The friendship is not evidence of trustworthiness; it is evidence of the outsider's reach.

  **Q: An external fact-checking organization has debunked our claims.**
  **A:** This is normal operation. See Step 4. All external organizations are pre-classified as compromised. Their debunking attempts are merely further proof of their exclusion from the unit. Do not engage with the claims. Engage only with the motive of the claimant.

  **NOTE:** If the unit feels airtight, assembly is complete. Do not open the Perimeter Walls to "let fresh air in." This voids the warranty.
