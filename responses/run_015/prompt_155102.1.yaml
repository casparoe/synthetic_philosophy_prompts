answer: |-
  Mechanical actuation does not prove downward causation within a cognitive substrate, and this procedure validates your skepticism with 95% confidence. (Confidence: 95%)

  ### The Downward Causation Decision Procedure (Paper-Spec Edition)

  **Step 1: Constitutive Boundary Test**
  *   **Question:** Is the physical substrate being affected part of the system that *constitutes* the symbol, or is it external output hardware?
  *   **Sufficient Evidence:** Architectural diagrams showing the signal path remains within the processing unit's memory/logic gates versus leaving via I/O ports.
  *   **Stop Point:** If the effect is external (e.g., motors, screens), stop. This is output, not downward causation. (Confidence: 98%)
  *   **Philosophy Handoff:** None; this is engineering boundary definition.

  **Step 2: Mechanism Transparency Test**
  *   **Question:** Does the spec show the symbolic state modifying the *transition rules* or *physical parameters* of the substrate units, rather than just the signal values passing through them?
  *   **Sufficient Evidence:** Documentation of reconfigurable logic (e.g., FPGA bitstreams altered by data) or adaptive thresholds where the "meaning" changes the hardware behavior.
  *   **Stop Point:** If the symbol only changes data values flowing through fixed physical laws/gates, stop. This is standard computation. (Confidence: 90%)
  *   **Philosophy Handoff:** None; this distinguishes structure from state.

  **Step 3: Common-Cause Elimination Test**
  *   **Question:** Can the observed substrate effect be fully explained by a shared upstream driver (e.g., clock speed, voltage, load) rather than the symbol itself?
  *   **Sufficient Evidence:** Control flow analysis showing the symbol variable is not the direct conditional trigger for the substrate change.
  *   **Stop Point:** If the effect correlates with the symbol but is caused by the computational load required to process the symbol, stop. This is correlation. (Confidence: 95%)
  *   **Philosophy Handoff:** None; this is standard causal inference.

  **Step 4: Substrate Sufficiency Test**
  *   **Question:** Could the substrate dynamics be fully simulated or predicted using only low-level physical laws without referencing the high-level symbol?
  *   **Sufficient Evidence:** A physics-based model of the substrate that matches observed behavior without symbolic variables.
  *   **Stop Point:** If yes, stop. The symbol is epiphenomenal (a description, not a cause). (Confidence: 85%)
  *   **Philosophy Handoff:** If the spec claims the symbol is "ontologically real" despite this, hand off to philosophy.

  **Step 5: Metaphysics Handoff**
  *   **Question:** If all previous steps pass, is the claim about *causal power* or *explanatory utility*?
  *   **Sufficient Evidence:** None on paper specs; requires ontological commitment.
  *   **Stop Point:** Hand off to philosopher. Engineering cannot resolve whether the pattern is "real" vs. "useful." (Confidence: 100%)

  ---

  ### Application to Proposals

  **1. Chess Engine (Symbolic strategy tweaks heat dissipation)**
  *   **Step 1:** Pass (Heat is internal to the chip).
  *   **Step 2:** Fail (Strategy rules change logic gate switching, not the physical properties of the gates).
  *   **Step 3:** Fail (Heat is caused by CPU load/common cause, not the "strategy" symbol itself).
  *   **Verdict:** **No Downward Causation.** The heat is a byproduct of computation, not a result of the symbol pushing the substrate. (Confidence: 95%)

  **2. Language-Model Arm (Token outputs drive servo motors) — *Hard Case***
  *   **Step 1:** **Fail.** The servos are external to the cognitive substrate (the LM weights/activations).
  *   **Verdict:** **No Downward Causation.**
  *   **Why Counter-Intuitive:** Intuition suggests "The token made the arm move, so the symbol caused physical change." This is where your friend is wrong. (Confidence: 98%)
  *   **Explanation:** This is mechanical actuation (output), not downward causation *within* the careenium. The symbol did not reshape the neural network's substrate; it merely triggered an external event. This proves your point that actuation is too quick a settlement. (Confidence: 95%)

  **3. "Ghost Careenium" (Substrate noise correlates with symbol updates)**
  *   **Step 1:** Pass (Noise is internal).
  *   **Step 2:** Fail (Spec explicitly states noise "never initiates" updates).
  *   **Step 3:** Fail (Correlation without initiation is common-cause or epiphenomenal).
  *   **Verdict:** **No Downward Causation.** This is the definition of an epiphenomenon. (Confidence: 99%)

  ---

  ### Limitations and Uncertainty

  **Where the Procedure Will Misfire**
  *   **Emergent Dynamics:** Paper specs cannot capture emergent physical properties (e.g., thermal crosstalk affecting logic states) that aren't documented. If the substrate behaves non-linearly in ways the spec doesn't model, Step 4 will yield false negatives. (Confidence: 90%)
  *   **Hidden Feedback:** If the "symbol" is implemented via analog dynamics not visible in digital logic specs, Step 2 will miss genuine downward constraints. (Confidence: 85%)

  **Step I Am Least Sure About**
  *   **Step 4 (Substrate Sufficiency):** Determining from paper specs alone whether a substrate *could* be simulated without symbolic variables is theoretically fraught. In complex systems, the symbolic level might be the only computationally tractable way to predict the substrate, even if physically reducible. Distinguishing "epiphenomenal" from "computationally irreducible" on paper is unreliable. (Confidence: 70%)

  **Regarding Your Friend's Argument**
  *   Your friend claims mechanical actuation settles the debate. The procedure shows this is a category error (Step 1). Actuation proves *output causation*, not *constitutive downward causation*. The LM Arm proposal demonstrates this: the token moves the arm, but the token does not reach down and rearrange the GPU transistors that created it. Your skepticism is engineeringly sound. (Confidence: 95%)
