answer: |-
  # The Moral Emotion Diagnostic: What's Running Your Code?

  **By [Your Name], Ethics & School Life Column**

  We talk a lot about "doing the right thing," but we rarely talk about the engine that drives it. When you hesitate before cheating, or flush red after snapping at a friend, is that guilt? Shame? Something else? Most articles define these emotions and tell you which one is better. That's useless if you don't know which one you're actually feeling.

  This isn't a personality test. There are no "good" or "bad" results. This is a diagnostic instrument built from the logical space of moral emotions. It uses ten concrete cases to map where you stand on the hidden assumptions about audience, fault, and selfhood.

  Read the cases. Pick the option that matches your gut reaction, not what you think you *should* say. Then check the Key to see which philosophical position you are implicitly running on.

  ### The Diagnostic

  **1. The False Flag**
  A plagiarism checker flags a sentence you wrote yourself. You know you didn't cheat. The teacher clears you. But for the rest of the day, you feel oddly sullied, like you're walking around with a stain no one else can see.
  *   **A.** The feeling is irrational and should be ignored; you did nothing wrong.
  *   **B.** The feeling is real, even if the fault isn't; you feel tainted by the accusation itself.
  *   **C.** The feeling is actually anger at the machine, not moral emotion at all.

  **2. The Accent**
  At a school event, you feel a flash of shame because your father's accent draws attention. Later, you feel ashamed that you felt that way.
  *   **A.** The second shame cancels out the first; you are back to neutral.
  *   **B.** The second shame piles on top; you are now doubly compromised.
  *   **C.** The first feeling wasn't real shame, so the second is just embarrassment about a mistake.

  **3. The Uninvited Classmate**
  You didn't invite a classmate to a weekend gathering. You had no obligation to invite them, and you did nothing to exclude them actively. Yet you feel a steady, low-grade guilt.
  *   **A.** This is not guilt; it is pity or sympathy mislabeled.
  *   **B.** This is real guilt; obligation exists even without explicit rules.
  *   **C.** This is a useful feeling to keep you generous, regardless of whether it's "true."

  **4. The Corridor Camera**
  You walk perfectly in the corridor only because there is a camera at the end. If the camera were broken, you'd run. You can't tell from the inside if this restraint is shame, prudence, or something nameless.
  *   **A.** It is prudence; shame requires caring about the watcher, not just the punishment.
  *   **B.** It is shame; the imagined judgment of the camera operator is enough.
  *   **C.** It is a new category of behavior unique to surveillance societies.

  **5. The Family Scandal**
  Your sibling cheats on a major exam. You had no part in it. When the news breaks, you feel a need to look at the floor when teachers walk by.
  *   **A.** You are feeling their shame by proxy; it attaches to the family unit.
  *   **B.** You are feeling embarrassment for them, but it is not your moral burden.
  *   **C.** You are only feeling this because you worry people will think you knew.

  **6. The Lie vs. The Liar**
  You tell a significant lie. Later, you reflect on it.
  *   **A.** You feel bad about the *act*; you wish you hadn't done that thing.
  *   **B.** You feel bad about the *self*; you worry you are the kind of person who does that.
  *   **C.** The distinction is semantic; the pain feels exactly the same.

  **7. The Cultural Tourist**
  You are abroad and do something that locals consider deeply offensive, though it is normal at home. You feel "wrong."
  *   **A.** You are violating their rules, so the feeling is valid there but not at home.
  *   **B.** Your home rules apply everywhere; the feeling is a mistake.
  *   **C.** "Wrong" is just a word for local rules; there is no universal feeling to compare.

  **8. The Remorseful Robot**
  An AI apologizes for an error, fixes it immediately, and ensures it never happens again. It has no feelings.
  *   **A.** The apology is meaningless without the inner sting of guilt.
  *   **B.** The repair is all that matters; the feeling is just evolutionary baggage.
  *   **C.** It simulates the social function of guilt well enough to count.

  **9. The Forgotten Transgression**
  You did something harmful years ago, forgot about it completely, and were never caught. It never affected your behavior since.
  *   **A.** The guilt existed as a disposition, even while you forgot it.
  *   **B.** If you didn't feel it, it didn't exist; memory is required.
  *   **C.** It only matters if it comes back to light; otherwise it is morally null.

  **10. The Public Penance**
  You wrong a friend. You can apologize privately or publicly.
  *   **A.** Private is more moral; public apology is performance for an audience.
  *   **B.** Public is more moral; it restores the social order you damaged.
  *   **C.** The method doesn't matter; only the repair of the specific harm matters.

  ***

  ### The Scoring Key: Mapping the Tree

  Do not count your A's, B's, and C's. Instead, look at the *pattern* of your choices across the ten cases. Your answers place you on a tree of logical possibilities. Below are the six main leaves (positions) occupied by actual thinkers, plus the empty branches where logic allows a view but no one seems to live there.

  Find the description that best matches your answer pattern.

  #### Leaf 1: The Act-Retentionist (Guilt-Superior)
  *   **Your Pattern:** You consistently chose options that isolate the specific **act** (Case 6A), require **fault** (Case 1A, 3A), and reject **vicarious** feeling (Case 5B). You likely see the camera as prudence (Case 4A).
  *   **The View:** Guilt is the more moral emotion because it keeps the act in view. It allows you to fix a mistake without destroying your self-worth. Shame is dangerous because it attacks the person, not the behavior.
  *   **Least Comfortable Commitment:** You must admit that a person who feels no guilt after a terrible act is not necessarily bad, just morally disabled, whereas a shamed person is socially broken.

  #### Leaf 2: The Character-Holist (Shame-Superior)
  *   **Your Pattern:** You chose options focusing on the **self** (Case 6B), accepted **vicarious** taint (Case 5A), and felt the "False Flag" as real taint (Case 1B). You likely value public repair (Case 10B).
  *   **The View:** Shame is the more moral emotion because it reaches the whole character rather than one transaction. It ensures you are the *kind of person* who doesn't do the thing, rather than just someone who didn't do it *this time*.
  *   **Least Comfortable Commitment:** You must accept that feeling "sullied" by a false accusation (Case 1) is a valid moral state, even if you are innocent.

  #### Leaf 3: The Mechanism-Identist (Same Mechanism)
  *   **Your Pattern:** You chose options suggesting the feelings are **interchangeable** or depend only on triggers (Case 6C, 4C). You likely see the "Double Shame" as additive (Case 2B) but not structurally different.
  *   **The View:** Guilt and shame are the same mechanism with different triggers. They differ only in what sets them off (audience vs. conscience), not in what they *are*.
  *   **Least Comfortable Commitment:** You have to argue that the student in Case 1 (False Flag) and the student in Case 3 (Uninvited Classmate) are running the exact same software, just with different inputs.

  #### Leaf 4: The Repair-Functionalist (Both Defective)
  *   **Your Pattern:** You prioritized **outcome over feeling** (Case 8B, 10C). You likely view the "low-grade guilt" as useful but not truth-tracking (Case 3C).
  *   **The View:** Both guilt and shame are defective and should be replaced by something like remorse or agent-regret. The feeling itself is irrelevant; only the willingness to repair matters.
  *   **Least Comfortable Commitment:** You must treat the "Remorseful Robot" (Case 8) as morally equal to a repentant human, provided the fix is the same.

  #### Leaf 5: The Cultural-Relativist (Socially Constructed)
  *   **Your Pattern:** You focused on **context** over universal rules (Case 7A/C, 4C). You likely see the "Accent" shame as a product of social hierarchy (Case 2C).
  *   **The View:** These emotions are socially constructed and not comparable across cultures. What looks like "guilt" in one setting is a different phenomenon in another.
  *   **Least Comfortable Commitment:** You cannot judge whether a "Guilt Culture" is better than a "Shame Culture," because the terms don't translate cleanly between them.

  #### Leaf 6: The Sanction-Anthropologist (Guilt/Shame Cultures)
  *   **Your Pattern:** You distinguished between **internal feeling** and **external enforcement** (Case 4A vs 4B, 10A vs 10B). You likely see Case 5 (Family Scandal) as a sanction issue, not a feeling issue.
  *   **The View:** This is the older anthropological contrast. It claims societies enforce norms either through internalized conscience (Guilt) or external honor/sanction (Shame). It is a claim about which sanctions a society enforces rather than about what anyone feels.
  *   **Least Comfortable Commitment:** You must admit that an individual can feel "shame" in a "guilt culture," making the label about the *system*, not the *person*.

  #### Empty Leaf: The Reverse-Target View
  *   **The Logic:** A view where Guilt targets the *Self* and Shame targets the *Act*.
  *   **Status:** **Incoherent.** While logically possible in the abstract, this contradicts the linguistic and phenomenological roots of the words. No one occupies this leaf because it requires redefining the terms so thoroughly they lose their meaning.

  #### Empty Leaf: The Conscious-Only Disposition
  *   **The Logic:** A view where guilt can only exist when consciously felt (Case 9B) *but* can also be inherited vicariously (Case 5A).
  *   **Status:** **Untried/Unattractive.** It requires believing you can feel an emotion you aren't conscious of, passed down from someone else. Most thinkers drop one of these two claims to avoid the paradox.

  #### Indistinguishable Leaves
  *   **Note:** If you found yourself torn between **Leaf 3 (Same Mechanism)** and **Leaf 4 (Both Defective)**, the quiz cannot separate you. Both views agree that the *distinction* between guilt and shame is less important than the *result*. If you are here, you believe the taxonomy itself is the problem, not the emotions.

  ***

  ### Part II: The Implications for Choice

  Your classmates keep asserting two contradictory things: that "you cannot help what you feel" and that "a school can decide what sort of people it turns out." Your position on the tree above determines which of these claims you can actually hold.

  Here is how your leaf handles the question of **Choice** across three scales.

  | Scale | Leaf 1 & 2 (Guilt/Shame Superior) | Leaf 3 (Same Mechanism) | Leaf 4 (Both Defective) | Leaf 5 & 6 (Construct/Anthro) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Individual**<br>*(Can I cultivate one emotion over the other?)* | **Yes.** You can train your conscience (Guilt) or your honor (Shame). It is hard work, but it is a genuine choice. | **No.** If they are the same mechanism, you can't choose the emotion, only the trigger. You are stuck with your wiring. | **Yes.** You can choose to abandon both for "remorse." It is a deliberate cognitive shift. | **Ill-Posed.** You cannot choose an emotion that your culture hasn't built the language for. |
  | **School**<br>*(Can we adopt an Honor Code vs. Restorative Justice?)* | **Yes.** A school can decide to enforce norms via character (Honor) or act-based repair (Restorative). | **Maybe.** The school changes the *triggers*, but the students' internal reaction remains the same. | **Yes.** The school should design systems that make the feeling irrelevant (focus on repair). | **Limited.** The school is bound by the wider culture. An Honor Code fails in a Guilt Culture. |
  | **Culture**<br>*(Can a society shift over a generation?)* | **Happens-To.** Cultures shift organically through history, not by choice. | **Happens-To.** Triggers change as society changes, but the mechanism is static. | **Choice.** A culture can decide to value function over feeling, but it requires a revolution. | **Happens-To.** You are inside the construction; you cannot step outside to choose it. |

  **The Cross-Cutting Problem:**
  Notice that the ability to choose does not cut cleanly across the tree. Instead, it depends on whether your view treats these emotions as **tools** (Leaves 1, 2, 4) or **conditions** (Leaves 3, 5, 6).
  *   If you think emotions are **tools**, you believe individuals and schools can choose them.
  *   If you think emotions are **conditions**, you believe choice is an illusion, and shifts only "happen to" groups.

  **The Verdict for School Life:**
  If you want to argue that our school *should* change how it handles discipline, you cannot stand on Leaf 3, 5, or 6. Those views suggest the school is powerless to change the emotional substrate of the student body. To argue for change, you must commit to Leaf 1, 2, or 4: you must believe that what we feel is, in part, something we build.
