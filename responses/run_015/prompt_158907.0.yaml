prompt: |-
  Hi — I host a tiny linguistics-adjacent podcast (around 300 listeners, mostly my old department plus some friends from grad school), and next week my guest is a psycholinguist who's just published a book defending what she calls "obligatory-category relativism". Rough version, as I take it: the Whorfian effects that actually replicate only show up where the grammar *forces* you to code something on essentially every utterance — evidentials, aspect, grammatical gender, honorifics — and not where a language merely lacks a word (the whole "Eskimo words for snow" genre of example is exactly what she says is irrelevant). And the mechanism isn't that your concepts get reshaped; it's that mandatory coding builds an encoding habit, and the habit survives as a retrieval cue, so effects show up in memory and in tasks where you have to hold something online, not in what you can perceive or reason about in the moment. Her flagship new claim, and the reason I booked her, is about evidentiality: obligatory evidential marking does not give speakers a richer concept of evidence at all, it just attaches a mandatory source-tag to the memory, so speakers of an evidential language do better on delayed source monitoring (did you see this, or were you told it?) but are no better at weighing testimony, discounting hearsay, or resisting bullshit generally.

  Here's my problem: every time I've heard her on other shows she gets the same four easy questions — the Hopi-and-time thing, the snow-lexicon thing, the colour studies, the "so you think language determines thought?" thing — and she fields them in her sleep, largely with the move "that's the strong version, nobody defends that anymore". I want eight to ten questions that make that move useless. Concretely: I need at least one that seperates her retrieval-cue mechanism from Slobin's "thinking for speaking" in a way she can't just answer "yes, and I'm happy with that"; one that presses the bilingual and schooling/literacy confounds in the evidentiality work (how would you ever tell an evidentiality effect apart from the fact that some speakers get drilled way more, in school or in court, into saying where they got what they know?); one about the metalanguage problem — if the languages differ in what they force you to encode, what language are the experimenter's own task instructions and theory written in, and what makes her description of the difference neutral; one on the light-blue/dark-blue style colour results in Russian speakers, where the obvious worry is that a fast-discrimination advantage isn't a perceptual effect at all but a naming or response strategy; one about reverse causality, i.e. why we shouldn't say languages *acquire* evidentials because speakers already needed to track sources; and one where I ask her flat out what experimental result would make her give up obligatory-category relativism, since "the effects are narrow" can start to sound like it predicts nothing. For each question please also give me the answer she's most likely to give and then the follow-up that answer walks straight into — I want to be ready in the moment, not scrabling for a reply while she talks.

  Two more things about the room. My co-host is a hardline nativist who'll be sitting in and will use any opening to announce that the whole research programme died in the 1970s, so one of the questions should preempt him without just picking a fight; and there's a crude version of this stuff that gets used in bad political ways ("these people literally cannot think X"), so I'd like one question about whether narrowing the claim the way she does genuinely defuses that, or just makes it harder to notice when it's happening. Oh, and a listener question I promised to squeeze in: if mandatory source-tagging really does help source memory, does that give an argument for changing how witness testimony gets recorded? She can answer that one badly, I just want the question and one follow-up. No warm-up questions please, and definitely don't have me ask her what got her into linguistics.
