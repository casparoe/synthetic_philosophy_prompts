answer: |-
  Here are ten questions designed to bypass the standard "Strong vs. Weak Whorfian" defenses, tailored to your guest's specific claims about obligatory-category relativism (OCR). Each includes the question, the smooth academic deflection she is likely to offer, and the immediate follow-up to press the point.

  ### 1. The Slobin Distinction (Mechanism)
  **Question:** You distinguish your view from Dan Slobin's "Thinking for Speaking." Slobin argues we attend to specific information *during* speech planning. You argue obligatory coding creates a retrieval cue for *later* memory. But if the retrieval cue is *only* generated by the speech-planning habit, isn't your effect just the afterimage of Slobin's process? Why is this a distinct theory of relativism rather than just "Slobin's effect with a delay"?

  **Likely Answer:** "Slobin is about online conceptualization for production; I'm about offline memory traces. The cognitive architecture is different—one is planning, one is retrieval. I'm happy to say I'm building on Slobin, but the locus of the effect is distinct."

  **Follow-up:** "If the locus is distinct but the *cause* is identical (the grammatical habit), then if I disrupt the speech-planning habit—say, through bilingual attrition—your memory effect should vanish. Do we have evidence that the memory advantage survives if the grammatical habit is lost, or is your 'relativism' entirely dependent on current grammatical performance?"

  ### 2. The Evidentiality Confound (Schooling/Institutions)
  **Question:** Your flagship claim is that obligatory evidentials improve source monitoring. But communities with obligatory evidentials (e.g., Andean, Turkic) often have distinct relationships with formal schooling and legal testimony compared to the Western controls used in these experiments. How do you disentangle a grammatical obligation from a cultural or institutional drilling on the importance of sourcing?

  **Likely Answer:** "We control for education levels and use non-verbal memory tasks. The effect correlates with the grammatical structure, not years of schooling. We're seeing a linguistic processing habit, not a cultural lesson."

  **Follow-up:** "But if the *reason* the grammar became obligatory is that the culture values source tracking, isn't the grammar just a proxy for the cultural priority? If you find a community with the grammar but without the cultural emphasis on truth-tracking, does the memory effect persist? If not, isn't the culture doing the work, not the syntax?"

  ### 3. The Metalanguage Problem
  **Question:** You describe the difference between languages as one having "mandatory source-tagging." That description is in English, using meta-linguistic categories developed in Western linguistics. When you run experiments, even non-verbal ones, the instructions and the interpretation of the data rely on *your* meta-language. How do you know you aren't just measuring how well subjects solve *your* puzzle, rather than how their language shapes their cognition?

  **Likely Answer:** "We use triangulation. We look at reaction times, eye-tracking, and error patterns that don't rely on self-report. The data shows a processing cost or benefit that exists before the subject can strategize about the experimenter's intent."

  **Follow-up:** "Reaction times to *what* stimulus? If the stimulus is categorized by the experimenter as 'source-relevant' based on English categories, haven't you already baked the bias into the trial design? Is there a task design that doesn't assume the category of 'evidence' is universal before you start testing?"

  ### 4. The Russian Blue Case (Naming vs. Perception)
  **Question:** Regarding the Russian light-blue/dark-blue discrimination results: critics argue this isn't perceptual facilitation but a verbal labeling strategy (naming the colors silently to aid memory). Your theory relies on encoding habits. If I add a verbal interference task (like articulatory suppression) and the Russian advantage disappears, does your theory survive?

  **Likely Answer:** "If verbal interference kills the effect, that actually supports the 'encoding habit' view. It shows the effect is linguistically mediated, not a change in the retina. That's exactly what OCR predicts: it's a coding habit, not a perceptual rewrite."

  **Follow-up:** "But if it vanishes under verbal interference, it's an *online* strategy, not a lasting *retrieval* cue. You claimed earlier these effects survive in memory. If the effect requires active subvocal labeling to exist, isn't this just 'Thinking for Speaking' happening during the test, rather than a structural change to memory retrieval?"

  ### 5. Reverse Causality (Evolution of Grammar)
  **Question:** Why should we assume the grammar causes the cognitive habit and not the other way around? Languages usually grammaticalize features speakers already care about. Isn't it more likely that speakers who already prioritized source tracking grammaticalized evidentials, rather than the grammar forcing them to care?

  **Likely Answer:** "It's likely a feedback loop. But once the grammar is obligatory, it forces the attention even in contexts where the speaker *doesn't* culturally care. The grammar takes on a life of its own and enforces the habit universally across contexts."

  **Follow-up:** "Do we have evidence of that 'enforcement' in low-stakes contexts? If the effect is only visible in tasks that mimic the high-stakes contexts where the grammar evolved, doesn't that suggest the cultural priority is still the driver? Where is the case where the grammar forces a habit the culture *doesn't* value?"

  ### 6. Falsifiability (The "Narrow" Defense)
  **Question:** You argue effects are narrow—limited to memory and online tasks, not reasoning. What specific experimental result would make you give up Obligatory-Category Relativism? If we find a language with obligatory evidentials but no source-memory advantage, do you abandon the theory, or do you assume the task wasn't sensitive enough?

  **Likely Answer:** "Science is never about one study. But if we consistently found null results across multiple tasks and languages with the same obligatory feature, yes, I'd have to reconsider. The prediction is specific: obligatory coding leads to encoding advantages."

  **Follow-up:** "But 'encoding advantage' is flexible. If they don't remember better, but they encode *faster*, is that a win? If they don't encode faster, but they make *fewer errors* of a different type? At what point does 'narrow effects' become a shield against falsification? Can you name one specific null result that would kill the theory?"

  ### 7. Preempting the Nativist (Co-host Management)
  **Question:** I have to ask this because my co-host is a hardline nativist sitting right here: Does your work challenge Universal Grammar, or is it compatible with it? If the 'hypothesis space' is universal but the 'parameter settings' affect retrieval habits, aren't you just describing parametric variation within a nativist framework?

  **Likely Answer:** "I'm fully compatible with UG. I'm not saying the capacity for language varies, but that the specific settings tune cognitive processing. It's a performance model, not a competence model. Your co-host and I agree on the architecture."

  **Follow-up:** "If it's just performance variance within a universal competence, why use the word 'Relativism' at all? That term implies a difference in kind. If you agree the mind is universal and only the processing habits differ, aren't you conceding the nativist point that the deep structure of thought is identical across humans?"

  ### 8. Political & Ethical Implications
  **Question:** Strong Whorfianism is criticized for implying some groups "cannot think" certain thoughts. You narrow the claim to memory retrieval. But does saying "Group A has better source memory due to grammar" actually defuse the political risk, or does it just shift the stereotype from 'reasoning' to 'memory'?

  **Likely Answer:** "It defuses it because it removes the claim of inferiority. Everyone can reason; some just have different retrieval cues. It's a difference in tool use, not cognitive capacity."

  **Follow-up:** "But in legal or academic settings, 'better source memory' *is* a marker of credibility. If your research suggests speakers of certain languages are objectively better at witness reliability, isn't that just as dangerous as saying they are worse at logic? How do you prevent this from being used to suggest epistemic superiority?"

  ### 9. Ecological Validity (Lab vs. Life)
  **Question:** Your effects show up in delayed source monitoring tasks in the lab. But in real-world conversation, speakers can ask clarifying questions or re-check sources. Does the 'mandatory tag' advantage actually survive in naturalistic communication where the memory load is distributed across speakers, or is this purely a lab artifact?

  **Likely Answer:** "Lab tasks isolate the variable. In the wild, the effect might be smaller, but the habit still exists. We see it in narrative structures and eyewitness accounts outside the lab too."

  **Follow-up:** "If the effect is smaller or negligible in the wild because social interaction compensates for it, what is the real-world stakes of your theory? If the grammar only matters when you are isolated in a booth doing a memory task, is it a linguistic effect or just a task-specific strategy?"

  ### 10. Listener Question (Witness Testimony Reform)
  **Question:** A listener asks: If mandatory source-tagging improves source memory, does that give an argument for changing how witness testimony gets recorded? Should we train witnesses to use artificial evidentials to improve accuracy?

  **Likely Answer:** "That's a fascinating application. If we could train people to habitually tag sources, we might reduce misinformation. But language acquisition is deep; training adults might not create the same automatic habit."

  **Follow-up:** "If training adults doesn't work because the habit must be childhood-acquired, isn't that an admission that this isn't a 'tool' we can deploy, but a fixed constraint? And if it *does* work, aren't we ethically obligated to test it, given the stakes of wrongful conviction?"
