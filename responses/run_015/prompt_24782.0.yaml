  Tessa said he definately lied, because the whole point of saying "yeah" there was to make her believe there was nothing left, and he knew it. her thing was that lying isn't really about whether the sentence is false, it's about trying to put a false belief in someone's head, and he did that on purpose.

  Marcus said ok but he didn't say anything false. "it's the last one" was true, like, it was the last one he was giving out, he just didn't say anything more, so that's misleading not lying, and there's a real difference. his move was that when you say something you're kind of putting your word on the line, like promising it's true, and he never promised anything about the other cookies.

  Tessa shot back that the promise thing is basically made up, like nobody actually promises when they say "the milk is in the fridge," and that if anything misleading is the worse move because it's sneakier and he can deny it later, whereas lying at least means you own your words.

  Marcus said sneakier isn't the same as worse, and that the reason lying feels worse is that it messes with the one thing the listener is allowed to trust, which is what you actually said, and you can't do that with misleading because nothing was said about the other cookies. he also said if there's no real difference then a politician who says true but misleading stuff is just as bad as one who flat out lies, which he thinks is wrong.

  can you go through it and tell me who's right about what, like move by move? i want to know if Tessa's "that's what lying is for" point actually holds up, if the word-on-the-line/commitment thing is real, and if "sneakier = worse" makes sense. and like, is there actually a moral difference between lying and misleading, or is that a fake distinction people made up? also whatever both of them are missing. please keep it under 450 words though, i really can't read a whole essay.
