answer: |-
  Here is a case built to your specifications, designed for a graduate seminar context. It avoids the usual trolley problems and focuses on the structural conditions required for logrolling to function as a model of moral compromise.

  ### The Setting: The Riverdale City Council
  **Parties:**
  1.  **The Development Coalition (DC):** Represents business interests and housing advocates.
  2.  **The Heritage Alliance (HA):** Represents historic preservationists and local community groups.

  **The Issues:**
  1.  **Zoning Variance (Issue A):** Approve a high-density mixed-use tower in the downtown core (**High**) vs. Maintain current low-density limits (**Low**).
  2.  **Municipal Budget Allocation (Issue B):** Fund a new Suburban Park (**Park**) vs. Fund Downtown Road Repair (**Road**).

  **Constraints:**
  *   Both issues are legally permissible.
  *   No empirical deception (both sides agree on the costs and physical effects).
  *   Status Quo (Disagreement Point): If no deal is struck, the Council defaults to current policy: **Low** Zoning and **Road** Repair (based on existing mandates). Let's denote outcomes as (Zoning, Budget). Status Quo = **(Low, Road)**.

  ---

  ### Version 1: The Successful Trade (Logrolling)

  In this version, both parties view the issues as *separable* goods. Their disagreement is driven by asymmetric intensity. DC cares intensely about Zoning and mildly about Budget. HA cares intensely about Budget and mildly about Zoning.

  **1. Preference Orderings**
  *(Ranked from Best [1] to Worst [4])*

  **Development Coalition (DC)**
  *   *Priority:* High Density is the primary goal. Roads are slightly preferred to Parks.
  1.  **(High, Road)** — *Ideal*
  2.  **(High, Park)** — *Acceptable Compromise*
  3.  **(Low, Road)** — *Status Quo (Disagreement Point)*
  4.  **(Low, Park)** — *Worst Case*

  **Heritage Alliance (HA)**
  *   *Priority:* The Park is the primary goal. Low Density is slightly preferred to High.
  1.  **(Low, Park)** — *Ideal*
  2.  **(High, Park)** — *Acceptable Compromise*
  3.  **(Low, Road)** — *Status Quo (Disagreement Point)*
  4.  **(High, Road)** — *Worst Case*

  **2. The Arithmetic of the Trade**
  *   **Proposed Package:** **(High, Park)**.
  *   **DC Movement:** Moves from Rank 3 (Status Quo) to Rank 2.
      *   *Gain:* Secures High Zoning.
      *   *Cost:* Accepts Park instead of Road.
      *   *Implicit Exchange Rate:* DC is willing to sacrifice 1 rank of Budget preference to gain 2 ranks of Zoning preference.
  *   **HA Movement:** Moves from Rank 3 (Status Quo) to Rank 2.
      *   *Gain:* Secures Park Funding.
      *   *Cost:* Accepts High Zoning instead of Low.
      *   *Implicit Exchange Rate:* HA is willing to sacrifice 1 rank of Zoning preference to gain 2 ranks of Budget preference.

  **3. Verification**
  *   **Strict Improvement:** Both parties rank (High, Park) strictly higher than (Low, Road).
  *   **Permissibility:** Neither side violates a constraint; DC gets development, HA gets green space.
  *   **No Commensurability:** DC does not need to agree that Parks are "worth" X dollars. They only need to agree on the ordinal ranking of the joint outcomes.

  **4. What is Doing the Heavy Lifting?**
  The feature enabling trade here is **Difference in Relative Intensities** (given Separability).
  *   If both sides cared *equally* about both issues (e.g., DC loved Roads as much as HA did), the orderings would mirror each other perfectly, and (High, Park) would be a loss for one side.
  *   However, this relies on **Separability**. If the value of Issue B depends on the state of Issue A, the ordering changes (see Version 2).
  *   **Completeness** is necessary but not sufficient. Both sides have complete rankings, but without the intensity mismatch, there is no surplus to capture.

  ---

  ### Version 2: The Collapsed Trade (Holism)

  In this version, we keep the parties and issues identical, but we alter the **Heritage Alliance's** value structure. HA does not view the Park as an independent good. They view the Park as a *breathing space* whose value is constituted by the low-density character of the surrounding area. A park surrounded by high-density towers is not a "breathing space"; it is merely a courtyard.

  This is a case of **Organic Unities / Non-Separability** (Moore). The value of the whole is not the sum of the values of the parts.

  **1. Preference Orderings**

  **Development Coalition (DC)**
  *(Unchanged from Version 1)*
  1.  (High, Road)
  2.  (High, Park)
  3.  (Low, Road)
  4.  (Low, Park)

  **Heritage Alliance (HA) — Holistic Valuation**
  *   *Constraint:* The Park is only valuable if Zoning is Low. If Zoning is High, the Park budget is seen as wasted or even detrimental (attracting crowds to a congested area).
  1.  **(Low, Park)** — *Ideal (Park in quiet neighborhood)*
  2.  **(Low, Road)** — *Status Quo (Quiet neighborhood, no park)*
  3.  **(High, Road)** — *Bad (Congestion, no park)*
  4.  **(High, Park)** — *Catastrophe (Congestion + wasted money on useless courtyard)*

  **2. The Collapse**
  *   **Proposed Package:** **(High, Park)**.
  *   **DC Movement:** Rank 3 → Rank 2 (Gain).
  *   **HA Movement:** Rank 2 → Rank 4 (**Loss**).
  *   **Result:** HA vetoes the deal. They prefer the Status Quo (Low, Road) over the Package.

  **3. Why Holism and not Lexical or Sacredness?**
  *   **Why not Lexical Ordering?** A lexical view would be: "No High Density, ever." That would rank (Low, Road) and (Low, Park) above *any* High Density outcome. While this also kills the trade, it reduces the problem to infinite intensity. It doesn't challenge the *structure* of the trade model, only the weights. Holism is more interesting because it challenges the **independence of the issues**.
  *   **Why not Sacredness?** Sacredness (Taboo Trade-offs) usually implies that the *act* of trading is immoral (e.g., "You can't put a price on heritage"). Here, HA isn't offended by the negotiation; they simply don't value the *outcome* of the negotiation. The trade fails because the goods aren't what DC thinks they are.
  *   **Selection:** Holism is the strongest breaker because it demonstrates that the "Issue Space" in Version 1 was carved incorrectly. It shows that Issue A and Issue B were not two distinct dimensions, but one complex dimension.

  ---

  ### Wrap-Up: Seminar Discussion Points

  **1. Commensurability vs. Completeness**
  Does Version 1 prove we don't need commensurability? **Yes, but with a caveat.**
  Version 1 shows that parties do not need a common *metric* (cardinal utility) to find gains from trade. Ordinal rankings over joint outcomes suffice. However, Version 2 suggests that **Completeness** over the joint outcome space is doing heavier lifting than it appears.
  In Version 1, we assumed HA could rank (High, Park) independently of how they value (High, Road). Version 2 reveals that for moral agents, preferences are often **non-separable**. If values are holistic, the "outcome space" cannot be constructed by simply crossing Issue A with Issue B. The "no commensurability required" claim holds only if the issues are structurally independent. If moral values are inherently relational (holistic), the "trade" model requires a commensurability of *description* before it can proceed without a commensurability of *value*.

  **2. The "Trade on Another Margin" Defense**
  If a defender of the trade picture says, *"In Version 2, HA should just trade on a different margin (e.g., building height instead of zoning),"* is that a rescue?
  **It is an admission.**
  It admits that the *moral conflict as described* was not tradable. It shifts the burden to the parties to redescribe the conflict until it fits the trade model. This risks making the theory tautological: "Moral compromise is possible wherever gains from trade exist." If gains from trade only exist after we strip away the holistic features of the moral disagreement, the theory isn't explaining compromise; it's explaining how to dissolve the disagreement by redefinition.

  **3. Issue Individuation (The Framing Problem)**
  This is the critical vulnerability. **The availability of the trade depends entirely on how I carved up the issue space.**
  *   **In Version 1:** I carved "Zoning" and "Budget" as separate dimensions. This made the trade visible.
  *   **In Version 2:** HA effectively argues that "Park-in-Low-Density" is a single good, distinct from "Park-in-High-Density." If we redraw the boundary to match HA's ontology, Issue B disappears. There is no longer a 2x2 matrix; there is a choice between *Neighborhood Integrity* vs. *Development*.
  *   **Implication:** If a party can redraw the boundary between Issue A and Issue B, they can make the trade vanish (by claiming holism) or appear (by claiming separability). In Version 1, DC *assumes* separability to make the deal. In Version 2, HA *asserts* holism to block it. The model cannot adjudicate which carving is correct.

  **4. Where I Rigged the Case & Strongest Objection**
  *   **The Rig:** I rigged Version 1 by stipulating **Separability**. I assumed that DC's value for Roads was independent of Zoning, and HA's value for Parks was independent of Zoning. In real moral psychology, this is rare. Most moral goods are context-dependent.
  *   **The Strongest Objection:** The **"Corruption of Value" Objection**.
      Even if Version 1 works arithmetically, does the *act* of trading change the moral quality of the outcomes? By accepting (High, Park), HA might signal that their commitment to Heritage is negotiable, which could erode their standing or the intrinsic value of their advocacy. The trade succeeds in the model, but fails in the social reality because the *process* of logrolling alters the meaning of the victory. The model treats preferences as exogenous and fixed; in moral politics, preferences are endogenous to the bargaining process.

  **Suggested Seminar Question:**
  *"If the success of moral trade depends on the separability of issues, and moral agents typically experience their values holistically, is the gains-from-trade model a prescription for how we **ought** to deliberate (by artificially separating issues), or a description that only applies to trivial cases?"*
