answer: |-
  This is an exceptionally sharp diagnosis of the current dialectical stalemate. You are correct: the debate often founders because realists and illusionists are playing different games with different win conditions. The realist is playing "Save the Ontology," while the illusionist is playing "Save the Data without the Ontology."

  If we treat illusionism as a scientific research program rather than a metaphysical provocation, we can derive a specification list. For an illusionist theory to be viable, it does not need to save the *existence* of qualia (that is, by definition, what it rejects), but it must save the *data* that leads us to posit qualia.

  Here is a breakdown of the desiderata for a successful illusionist theory, categorized by the type of work they need to do, followed by an analysis of which are non-negotiable and where the impossibility results might lie.

  ### I. The Core Specification: What Illusionism Must Deliver

  #### 1. The Meta-Problem Constraint (The Baseline)
  **Requirement:** The theory must provide a mechanistic account of why humans assert the existence of phenomenal consciousness.
  **Why:** This is Chalmers' "meta-problem." If illusionism is true, the belief in consciousness is a false belief. A theory of false beliefs requires a causal mechanism.
  **Specific Cases:**
  *   **Verbal Reports:** Why do we say "I see red" rather than "My visual system is detecting 700nm wavelengths"?
  *   **Intuitive Conviction:** Why is this belief held with such high confidence (seeming incorrigible) compared to other false beliefs (e.g., superstition)?
  *   **The Hard Problem Intuition:** Why does the explanatory gap *feel* unbridgeable even to physicalists?

  #### 2. The Functional/Behavioral Constraint
  **Requirement:** The theory must account for the functional roles that phenomenal states appear to play, without invoking non-physical properties.
  **Why:** If qualia are illusions, they cannot be causal agents. However, the *states* that generate the illusion must do the work qualia are supposed to do.
  **Specific Cases:**
  *   **Pain and Motivation:** This is the biggest hurdle. Realists argue pain motivates *because* it hurts. Illusionists must explain why "illusionary pain" triggers avoidance more urgently than mere propositional knowledge of damage. The theory needs a model of **affective valence** that is distinct from sensory discrimination but doesn't rely on "felt badness."
  *   **Attention and Reportability:** Why can we report on some states (phenomenal/access) and not others (subliminal/blindsight)? The illusionist usually collapses Phenomenal Consciousness (P) into Access Consciousness (A), but must explain the *residual intuition* that P exceeds A.
  *   **Learning and Conditioning:** How does the "illusion" facilitate reinforcement learning?

  #### 3. The Structural Constraint (The Geometry of the Illusion)
  **Requirement:** The theory must explain the specific structural properties of the "illusionary field."
  **Why:** An illusion isn't static noise; it has logic. If I see a red square next to a blue square, the "illusion" has spatial and chromatic relations.
  **Specific Cases:**
  *   **Phenomenal Geometry:** Why does the illusion present itself as a unified field rather than disjointed data points? (The Binding Problem).
  *   **Similarity Spaces:** Why does red seem more like orange than blue? The theory must recover color space topology from neural/functional architecture.
  *   **Temporal Flow:** Why does the illusion have a sense of "specious present" or flow, rather than discrete frames?

  #### 4. The Epistemic/Normative Constraint
  **Requirement:** The theory must explain the apparent **incorrigibility** of introspection without granting it actual infallibility.
  **Why:** This is the crux of the realist objection. If I say "I am in pain," I cannot be wrong. If illusionism says I *am* wrong (there is no pain, only a judgment of pain), it must explain why this specific error is immune to correction.
  **Specific Cases:**
  *   **First-Person Authority:** Why do I know my "mind" better than you do?
  *   **Error Conditions:** The theory must delineate when introspection *can* be wrong (e.g., misidentifying emotions, change blindness) vs. when it seems it *cannot* (raw feels). If it collapses this distinction too hard, it loses explanatory power regarding blindsight.

  #### 5. The Altered States Constraint
  **Requirement:** The theory must model how the "illusion" degrades or modifies under specific conditions.
  **Why:** If consciousness is a user-illusion generated by specific cognitive systems, damaging or tweaking those systems should change the illusion in predictable ways.
  **Specific Cases:**
  *   **Psychedelics:** Why do these substances increase "entanglement" or "ego dissolution"? (Suggests the illusion relies on specific predictive hierarchies).
  *   **Meditation:** Why does focused attention change the apparent granularity of experience?
  *   **Dreaming:** How is the illusion generated without external input?

  ---

  ### II. Non-Negotiable vs. Question-Begging

  This is where the stalemate usually happens. We need to filter the desiderata.

  **Question-Begging Desiderata (Reject These):**
  *   **"Preserve the existence of qualia."** Obviously. This is the definition of the dispute.
  *   **"Explain how physical processes produce subjective feels."** This assumes feels exist to be produced. The illusionist goal is to explain how physical processes produce the *judgment* that there are subjective feels.
  *   **"Account for the intrinsic nature of experience."** Illusionists deny experience has an intrinsic nature beyond its functional/representational role.

  **Non-Negotiable Desiderata (Must Haves):**
  *   **Causal Closure:** The theory must not violate physical causal closure. (Both sides usually agree here, but illusionists must ensure their "illusion mechanisms" are physically grounded).
  *   **Self-Consistency (The Self-Defeat Check):** The theory must not undermine the rationality of asserting the theory itself. If my cognitive systems are designed to generate false models of my internal states, why should I trust the model that says "illusionism is true"? *This is the single most critical non-negotiable constraint.*
  *   **Recovery of Folk Psychology:** The theory must allow us to keep talking about "pain," "seeing red," and "feeling sad" in a way that preserves the truth conditions of everyday sentences (e.g., "Pain is bad" must remain true in some pragmatic sense, even if pain is an illusion).

  ---

  ### III. Potential Impossibility Results (The "Jointly Unsatisfiable" Check)

  You asked if there is a subset of requirements that are jointly unsatisfiable. If so, illusionism is dead on arrival. Here are the three tension points where illusionism risks breaking:

  **1. The Incorrigibility vs. Fallibility Tension**
  *   *Requirement A:* Explain why we feel introspection is incorrigible (we can't be wrong about our pain).
  *   *Requirement B:* Maintain that introspection is a heuristic mechanism (like vision) and therefore fallible (as illusionism requires).
  *   *The Conflict:* If you explain the *feeling* of incorrigibility too well, you risk making the error undetectable, which leads to skepticism. If you emphasize fallibility too much, you fail to capture the specific phenomenology of "what it's like," which *feels* immediate and certain.
  *   *Status:* **High Risk.** Frankish handles this by saying the judgment is a "quoting" mechanism that is technically true about the judgment but false about the property. It's a tightrope walk.

  **2. The Normativity of Pain**
  *   *Requirement A:* Explain why pain is *bad* (normative force).
  *   *Requirement B:* Deny that there is a "bad feel" (phenomenal property).
  *   *The Conflict:* If pain is just a functional state of damage avoidance, why is it *suffering*? A robot can avoid damage without suffering. If the illusionist says "suffering is just the judgment that this state is to be avoided," they risk defining away the very thing that makes pain morally significant.
  *   *Status:* **Moderate Risk.** Requires a robust theory of valence that isn't just behavioral.

  **3. The Self-Defeat Objection**
  *   *Requirement A:* Our introspective systems generate a false model (the phenomenal field).
  *   *Requirement B:* We use those same systems to evaluate the truth of illusionism.
  *   *The Conflict:* If the system is tuned to generate a false model, what guarantees that the "illusionism module" isn't also part of the false model?
  *   *Status:* **Manageable but Critical.** Illusionists must argue that the "false model" is specific to *introspective monitoring*, not *theoretical reasoning*. Distinguishing these two cognitive modes is a hard empirical requirement.

  ---

  ### IV. Brief Scorecard of Variants

  Here is how the main contenders stack up against the critical desiderata.

  | Theory | Meta-Problem (Why we believe) | Pain/Valence (Motivation) | Structure (Geometry) | Self-Defeat Risk |
  | :--- | :--- | :--- | :--- | :--- |
  | **Dennett (Quining)** | **Strong.** Explains it as a result of "fame in the brain" and narrative competence. | **Weak.** Often accused of explaining away the *urgency* of pain. "Pain is just damage avoidance" feels insufficient. | **Moderate.** Focuses on heterophenomenology, less on neural geometry of the illusion. | **Low.** Argues that once we clarify terms, the contradiction vanishes. |
  | **Frankish (Strong Illusionism)** | **Strong.** Explicitly targets the meta-problem. Uses "quoting" to explain the error. | **Moderate.** Relies on functional role of pain judgments. Still battling the "why does it hurt?" intuition. | **Moderate.** Focuses more on the judgment than the structural content of the illusion. | **Moderate.** Must carefully distinguish introspective monitoring from theoretical reasoning. |
  | **Graziano (AST)** | **Strong.** Consciousness is a schematic model of attention. We model attention as a non-physical essence. | **Strong.** Valence is part of the attention schema's priority tagging. | **Strong.** The "schema" has spatial and structural properties by design. | **Low.** The mechanism (attention schema) is distinct from the theoretical claim. |
  | **Predictive Processing (Hohwy/Seth)** | **Strong.** "Controlled Hallucination." The brain predicts sensory causes; consciousness is the top-level prediction. | **Strong.** Interoceptive predictions carry "precision weighting" which maps to affective urgency. | **Very Strong.** Naturally accounts for structure, flow, and binding via hierarchical inference. | **Low.** Grounded in standard Bayesian mechanics. |

  ### V. Conclusion: The Verdict on the Stalemate

  The reason you have been going in circles for two years is that Realists and Illusionists disagree on **Desideratum #1 (The Meta-Problem)**.

  *   **The Realist** thinks solving the Meta-Problem is *insufficient*. They think you must solve the Hard Problem (explain the existence).
  *   **The Illusionist** thinks solving the Hard Problem is *impossible* (category error). They think solving the Meta-Problem is *necessary and sufficient*.

  **The Viability Test:**
  Illusionism is viable **if and only if** it can satisfy the **Functional** and **Structural** constraints without relying on the **Ontological** constraint.

  If an illusionist theory can predict:
  1.  When a subject will report consciousness (vs. blindsight),
  2.  How the report will change under psychedelics/lesions,
  3.  Why the subject will insist the experience is ineffable/intrinsic,
  4.  Why the subject will act to avoid "pain" states with high urgency...

  ...then the Realist's remaining objection ("But is there *really* something it is like?") becomes a verbal dispute with no empirical cash value.

  **The Non-Negotiable Takeaway:**
  Do not accept the criterion "Explain why it feels like something."
  Accept the criterion "Explain why we *judge* that it feels like something, and why that judgment has the structural/functional properties it does."

  If an illusionist theory delivers on the latter, the stalemate breaks in their favor, not because they proved qualia don't exist, but because they rendered the assertion "qualia exist" explanatorily redundant. If they fail to explain the *structure* of the judgment (e.g., why the illusion has color geometry), then Realism retains the advantage because it captures data the Illusionist cannot.

  **Recommendation:** Focus your evaluation of papers on the **Structural Constraint**. That is currently the weakest link for Dennett/Frankish (who focus on judgments) and the strongest link for Graziano/PP (who focus on models/predictions). If the "illusion" has no structure, it can't explain the richness of experience. If it does have structure, it starts looking suspiciously like the real thing renamed. That is the bottleneck.
