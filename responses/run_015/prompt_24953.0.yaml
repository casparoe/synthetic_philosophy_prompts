prompt: |-
  So I've been going back and forth on illusionism about phenomenal consciousness for like two years now—ever since that Frankish paper made the rounds on the forum—and I keep noticing that discussions between illusionists and realists totally talk past each other because they're using different criteria for what would count as a successful theory. The realist says "you haven't explained the thing that most needs explaining" and the illusionist says "you're asking me to explain something that doesn't exist, that's like asking a theory of combustion to explain phlogiston." And then everyone just retrenches.

  I want to step back and get clear on the actual desiderata. If someone is going to defend illusionism—the view that phenomenal consciousness, the "what it's like"-ness, qualitative feels, whatever you want to call it, is an illusion and doesn't actually exist as we introspectively seem to find it—what does their theory actually have to deliver? Not just "explain why we're mistaken," but the full spec. What are the phenomena it has to account for? Which cases does it have to get right? Which distinctions can't it collapse without losing explanatory power? I'm thinking of things like: the apparent difference between access consciousness and phenomenal consciousness (illusionists often want to collapse this, but then they need to explain why the distinction felt so compelling and why it maps onto things like blindsight); the fact that we can talk about, reason about, and compare our "experiences" (the illusion has to be causally efficacious in some sense, or at least the mechanisms that generate the illusion do); the meta-problem of consciousness—why we think there's a hard problem at all; altered states from meditation or psychedelics where the "illusion" seems to change in structured ways; the fact that pain motivates action in a way that mere propositional knowledge doesn't, and an illusionist owes an account of that difference; and the apparent unity of the phenomenal field. I'm sure I'm missing some.

  What I'm especially interested in is which requirements are genuinely non-negotiable versus which are just intuition-pumps that realists have smuggled into the criteria. Like, is "preserve the intuition that there is something it is like to be me" a genuine desideratum, or is that exactly the thing the illusionist is trying to debunk and demanding they preserve it begs the question? And I want to know if there's some subset of the requirements that are jointly unsatisfiable—if so, that's itself a result about the viability of the position, and I'd rather know that upfront than spend another two years going in circles. If you want to do a quick scorecard for the main variants (Dennett-style, Frankish's strong illusionism, Graziano's attention schema, maybe the predictive processing crowd) against the list, that's fine, but I mostly care about the criteria themselves and the reasoning behind each one. The scoring is secondary.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Illusionism about phenomenal consciousness (the view that qualia/phenomenal consciousness don't exist as introspectively presented).
      *   **Problem:** Discussions between illusionists and realists talk past each other due to differing criteria for success.
      *   **Goal:** Define the *desiderata* (requirements/criteria) for a successful illusionist theory.
      *   **Specific Questions:**
          *   What phenomena must be accounted for?
          *   Which distinctions must be preserved (or explained away)?
          *   What is non-negotiable vs. question-begging?
          *   Are there jointly unsatisfiable requirements (impossibility results)?
          *   (Optional) Scorecard of main variants (Dennett, Frankish, Graziano, PP).
      *   **Tone:** Philosophical, rigorous, analytical, sympathetic to the frustration of the stalemate.

  2.  **Deconstruct the Core Conflict:**
      *   *Realist Criterion:* Save the phenomena (qualia exist, explain them).
      *   *Illusionist Criterion:* Save the *judgments* about phenomena (qualia don't exist, explain why we think they do).
      *   *The Stalemate:* Realists say illusionists change the subject. Illusionists say realists are chasing ghosts.
      *   *The Task:* Bridge this by listing what an illusionist theory *must* explain to be viable, even if it denies the ontology.

  3.  **Brainstorming Desiderata (The "Spec"):**
      *   *The Meta-Problem:* Why do we say we have qualia? (Chalmers).
      *   *The Phenomenal/Access Distinction:* Blindsight, subliminal perception. Why does one feel like something and the other doesn't?
      *   *Valence/Motivation:* Pain hurts. Why does "illusionary pain" make me pull my hand away?
      *   *Structure of Experience:* Spatial layout, color relations, temporal flow. The illusion has structure.
      *   *Introspective Authority:* Why do I feel like I know my mind better than yours?
      *   *Altered States:* Meditation, drugs, sleep. The "illusion" changes. How?
      *   *Normativity:* I can be wrong about what I see (illusion), but can I be wrong about how it feels? (Seems incorrigible).
      *   *Causal Efficacy:* If qualia are illusions, do the *beliefs* about them cause things? Or do the underlying physical states?

  4.  **Categorizing the Desiderata:**
      *   *Explanatory:* Must explain the *belief* in consciousness.
      *   *Functional:* Must account for the behavioral/functional roles qualia seem to play.
      *   *Structural:* Must account for the internal logic/geometry of experience.
      *   *Normative:* Must handle error and authority.

  5.  **Addressing the "Non-Negotiable vs. Question-Begging" Question:**
      *   *Crucial Point:* Demanding "preserve the existence of qualia" is question-begging against illusionism.
      *   *Replacement:* Demand "preserve the *functional role* of qualia reports."
      *   *The Hard Constraint:* The theory cannot be self-undermining. If the theory is true, does it make the *assertion* of the theory meaningless? (Self-defeat objection).

  6.  **Identifying Jointly Unsatisfiable Requirements (The "Impossibility" Check):**
      *   *The "Hard Problem" Residue:* If you explain all functions, have you explained *why it feels like something*? Illusionist says "Yes, because 'feeling like something' is just a functional judgment." Realist says "No."
      *   *The Self-Defeat Risk:* If all judgments are illusionary outputs, why trust the judgment that "illusionism is true"?
      *   *The Normativity Tension:* If introspection is a heuristic (Graziano/Frankish), it's prone to error. But phenomenal claims seem incorrigible. Reconciling fallibility with apparent incorrigibility is hard.

  7.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the frustration. Validate the "talking past" diagnosis. Set the stage for a neutral specification.
      *   *Section 1: The Core Mandate (The Meta-Problem).* This is the baseline. Explain the *judgment* of consciousness.
