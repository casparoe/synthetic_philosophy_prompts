          5.  Answer the Replication question.
          6.  Answer the Reforms ($p < 0.005$/Preregistration) question.
          7.  Conclusion/Summary.

      *   *Refining the Bayesian Explanation:* Be careful not to get bogged down in "Prior Probability" math. Use the "Needle in a Haystack" analogy. If you only report when you find a needle, but your magnet is weak, the "needles" you find are often actually pieces of metal that look like needles (noise).
      *   *Refining the "Which is bigger?" answer:* Most meta-scientists (like Simonsohn, Gelman, Ioannidis) lean towards the systemic/statistical explanation being the heavier driver, because "cheating" is hard to prove, but "low power" is measurable and ubiquitous.
      *   *Refining the Replication answer:* Emphasize that replication is expensive and slow. It's a patch, not a vaccine.
      *   *Refining the Reforms answer:* Preregistration stops the *garden of forking paths*. $p < 0.005$ forces larger samples (ideally). Larger samples fix the Bayesian inflation. So yes, they help, but they require cultural change (funding, patience).

  7.  **Self-Correction/Review during drafting:**
