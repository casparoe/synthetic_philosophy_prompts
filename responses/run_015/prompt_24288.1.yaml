      *   *Check:* Is the distinction between "cheating" and "honest mistakes" clear? Yes, emphasize that the second explanation applies even to saints.
      *   *Check:* Did I answer the specific prompt about $p < 0.005$? Yes, need to mention that without larger samples, it just kills science. With larger samples, it helps.

  8.  **Final Polish:** Ensure headings are clear. Use bold text for emphasis. Keep paragraphs short. (Proceed to generate output based on these thoughts.)

