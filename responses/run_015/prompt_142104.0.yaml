          *   Scope: Philosophy and theory *only* (no empirical ML, evals, interpretability).
          *   Goal: Better than the standard list everyone already has.
          *   Output: Ranked questions, defended rankings (upstream/downstream, tractability for philosophers), triggers for reordering, and deliberate exclusions.
          *   Tone: Casual, working document style.
          *   Input Material: The user provided several raw ideas (epistemic problem, identity/copying, cheap abundance, continuum, sub-personal subjects, pausing).
      *   **Key Challenge:** Avoid generic "AI ethics" or "AI safety" tropes. Focus on *moral status* specifically, ensuring it's tractable for philosophers without needing code.

  2.  **Deconstruct the "Standard List":**
      *   What does the "list everyone already has" look like?
          *   "What is consciousness?" (Too broad, unsolvable in 3 years).
          *   "How do we test for sentience?" (Forbidden: no evals/empirical).
          *   "Rights for robots?" (Too premature/political).
          *   "S-risk scenarios" (Often too speculative/consequentialist without grounding).
      *   *Goal:* Find the conceptual bottlenecks that prevent progress on the standard list. Focus on *metaphysics* and *epistemology* of status, not just applied ethics.

  3.  **Evaluate the User's Raw Material:**
      *   *Epistemic Problem (Self-report):* Crucial. If we can't know, status is moot. Very philosophical (epistemology of other minds + game theory).
      *   *Identity/Copying:* High importance for digital specifics. Tractable for metaphysicians.
      *   *Cheap Abundance:* Consequentialist crunch. Important, but maybe downstream of *whether* they count.
      *   *Continuum:* Standard vagueness problem. Important, but maybe less distinctive to digital minds than identity.
      *   *Sub-personal:* Very niche, potentially high reward but high risk of being a dead end.
      *   *Pausing:* Good edge case for persistence/identity.

  4.  **Drafting the Agenda (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1.  Consciousness theories.
          2.  Moral weight.
          3.  Identity.
          4.  Epistemology.
          5.  Population ethics.
          *Critique 1:* Too generic. "Consciousness theories" is too big for 5 postdocs. Needs to be sharper.

      *   *Attempt 2 (Focusing on Bottlenecks):*
