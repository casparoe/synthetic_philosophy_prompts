  5.  **Fleshing out the Defenses (The "Why"):**
      *   *Ranking Logic:* Upstream questions (metaphysics/epistemology) must come before downstream questions (policy/aggregation).
      *   *Tractability:* Why can a philosopher do this without an ML engineer? (e.g., analyzing concepts of identity, not running training loops).
      *   *Reordering Triggers:* What new info changes the priority? (e.g., if an architecture proves resistant to deception, Epistemology drops).

  6.  **Developing the Exclusions:**
      *   Why leave off "AI Rights"? Premature.
      *   Why leave off "Consciousness Theories (General)"? Too broad, needs to be specific to digital substrate.
