          *Critique 2:* Better. Needs to be framed as *questions* with specific philosophical angles.

      *   *Attempt 3 (Refining for "Philosophy Only" & "Upstream"):*
          *   *Priority 1:* The Epistemic Problem. If we can't solve the "optimized lying" problem, nothing else matters. This is the gatekeeper.
          *   *Priority 2:* Individuation. Before counting welfare, we need to know what counts as *one* unit of welfare. Digital copying breaks standard personhood metaphysics.
          *   *Priority 3:* Moral Gradients. Digital minds won't be binary sentient/insentient. We need a theory of partial status.
          *   *Priority 4:* Temporal Existence. Pausing/Deleting. Distinct from identity, focuses on the *value* of continuation.
          *   *Priority 5:* Welfare Content. What *is* the good/bad for a digital mind? (Hedonism vs. Preference).
