      *(Decided to drop "Cheap Abundance" as a separate item and fold it into Individuation/Aggregation, or keep it as a specific consequence of #2. Actually, let's keep Aggregation distinct because the *normative* response to astronomical numbers is a philosophical problem, not just a counting one. Let's swap #5 for Aggregation. Pausing is a sub-case of Identity/Time. Aggregation is bigger.)*
      *Correction:* The prompt asks for 5-6 questions.
