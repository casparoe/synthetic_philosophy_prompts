answer: |-
  # Specification: Aquaculture Welfare Theory v1.0

  ## 1. Purpose and Scope
  This spec defines the adequacy criteria for a theory of animal welfare intended for industrial aquaculture. The theory must support three production jobs: (1) Intervention Validation, (2) Cross-Species Comparison, (3) Scalable Auditing.

  ## 2. Requirements Desiderata

  **REQ-1: Phenomenal Decoupling (Non-Negotiable)**
  *   **Definition:** The theory must distinguish between nociception (reflexive withdrawal/damage detection) and affective suffering (negative emotional state).
  *   **Case:** A shrimp with ablated eyestalks spawns normally (nociception/functioning intact) but may experience chronic stress. A fish with fin erosion grows at target rate (functioning intact) but may be in pain.
  *   **Test:** An animal must demonstrate trade-off behavior (e.g., enduring a cost to avoid a stimulus) or show long-term behavioral modification (learning/avoidance) inconsistent with simple reflex. If the animal ignores the stimulus when motivated by a higher drive (feeding), it is likely nociception only. If it sacrifices feeding to avoid the stimulus, it indicates feeling.
  *   **Constraint:** Must not require mammalian neocortex. Evidence must rely on functional integration of stimuli in the specific nervous system (e.g., decapod ganglia integration).

  **REQ-2: Productivity Independence (Non-Negotiable)**
  *   **Definition:** Welfare metrics cannot be positively correlated with production outputs (growth rate, feed conversion ratio, survival to harvest).
  *   **Case:** A fish with a deformed jaw feeds and grows at target rate. A farm scores high on FCR while animals suffer.
  *   **Rationale:** Prevents Trap 1. If welfare improves productivity, the metric is confounded. Welfare must be measurable even if it reduces yield (e.g., lower density).

  **REQ-3: Behavioral Integrity (Non-Negotiable)**
  *   **Definition:** Metrics cannot rely on behaviors that can be genetically suppressed without reducing suffering.
  *   **Case:** Fish selectively bred not to thrash during handling. Measurements show "calm," welfare is unchanged or worse.
  *   **Rationale:** Prevents Trap 2. "Calm" must be distinguished from "apathetic/learned helplessness." The theory must require a baseline of species-typical behavioral repertoire, not just absence of struggle.

  **REQ-4: Cross-Species Currency (Preference)**
  *   **Definition:** The theory must provide a common unit or mapping function to compare welfare states across taxa (e.g., shrimp vs. salmon).
  *   **Case:** Deciding if a kilo of shrimp is "worse" than a kilo of salmon.
  *   **Rationale:** Required for Job 2. Without this, "it depends" remains the output.
  *   **Conflict:** High tension with REQ-1 (Biological Specificity).

  **REQ-5: Lifetime Integration (Non-Negotiable)**
  *   **Definition:** Welfare assessment must integrate state over time, not just snapshot status.
  *   **Case:** A whole life that lasts eight months vs. natural lifespan. A fish that suffers terribly for week 1 then thrives vs. one that thrives then suffers terribly at slaughter.
  *   **Rationale:** Addresses "State at a time versus over a lifetime." A good week does not cancel a bad week if the bad week involves severe suffering.

  **REQ-6: Termination Stance (Non-Negotiable)**
  *   **Definition:** The theory must explicitly state whether death is a welfare event (harm in itself) or a boundary condition (end of welfare).
  *   **Case:** Swapping ice-slurry chilling for electrical stunning.
  *   **Rationale:** Addresses "whether death is a welfare item at all." If death is a harm, shorter lives are inherently worse. If only process matters, only the kill method counts. The theory cannot be agnostic.

  **REQ-7: Outlier Sensitivity (Preference)**
  *   **Definition:** The assessment must account for the worst-off individual, not just the population mean.
  *   **Case:** The one individual in the pen who is doing terribly and will never be sampled.
  *   **Rationale:** Addresses "how bad versus how many." Utilitarian averaging hides severe suffering in small subsets.
  *   **Conflict:** High tension with REQ-8 (Scalability).

  **REQ-8: Audit Scalability (Non-Negotiable)**
  *   **Definition:** The metric must be computable by a human inspecting a facility holding millions of animals they will not inspect individually.
  *   **Case:** Job 3 implementation.
  *   **Rationale:** If it requires individual neuro-imaging or continuous monitoring of every animal, it is not shippable.

  **REQ-9: Ontological Distinction (Non-Negotiable)**
  *   **Definition:** The theory must distinguish between the animal's actual condition and the number the audit produces.
  *   **Case:** Distinction: "Animal's actual condition versus the number the audit produces."
  *   **Rationale:** Prevents Operationalism. The audit is a lossy compression of reality. The theory must acknowledge error margins where the audit says "pass" and the animal suffers.

  ## 3. System Conflicts (Unsatisfiable Pairs)

  **Conflict A: Cross-Species Currency (REQ-4) vs. Biological Plausibility (REQ-1)**
  *   **Issue:** To compare shrimp to salmon, you need abstraction (e.g., "units of suffering"). To be biologically accurate, you need specificity (e.g., "shrimp nervous system integration").
  *   **Result:** You can have a comparable metric or a biologically accurate one. You cannot have both with high fidelity. A common currency inevitably leans on analogy, which violates strict biological consistency.

  **Conflict B: Outlier Sensitivity (REQ-7) vs. Audit Scalability (REQ-8)**
  *   **Issue:** You cannot statistically guarantee detection of a single suffering individual in a population of 1,000,000 using spot checks without testing every animal.
  *   **Result:** Job 3 (Audit) inherently violates the requirement to catch the "one individual... doing terribly." You must choose between statistical confidence (averages) and individual protection (census).

  **Conflict C: Ontological Distinction (REQ-9) vs. Audit Scalability (REQ-8)**
  *   **Issue:** If welfare is an internal state (REQ-1), and the audit is external/proxy-based (REQ-8), there is always a gap. If you demand the audit *be* the welfare (Operationalism), you satisfy Scalability but violate REQ-9.
  *   **Result:** You cannot claim to measure internal state perfectly via external audit.

  ## 4. Feasibility Verdict

  **The Full List is Unsatisfiable.**
  You cannot build a system that measures internal subjective states (REQ-1), distinguishes that measurement from reality (REQ-9), scales to millions (REQ-8), and catches individual outliers (REQ-7).

  **The Killer Requirement:**
  **REQ-9: Ontological Distinction.**
  This requirement kills the most candidates.
  *   It kills **Operationalism** immediately (by definition).
  *   It kills **Functioning Views** if they claim their metrics *are* welfare rather than proxies.
  *   It makes **Feeling-Based Views** unshippable for Job 3 (Audit), because admitting the audit is not the reality makes the audit legally/ethically fragile for industry use.
  *   It forces the theory to admit it might certify a farm as "good" while animals suffer, which undermines Job 1 (Decide whether change is improvement).

  To ship a product, you must drop REQ-9 (accept the audit *defines* welfare for the purpose of the contract) or drop REQ-8 (accept you cannot audit millions).

  ## 5. Scorecard

  **Feeling-Based Views (Sentientism)**
  *   **Pros:** Satisfies REQ-1 (Phenomenal), REQ-6 (Death), REQ-9 (Distinction).
  *   **Cons:** Fails REQ-8 (Scalability) and REQ-4 (Currency). Cannot measure internal state at scale; cross-species comparison is speculative.

  **Preference/Desire-Based Views**
  *   **Pros:** Satisfies REQ-1 (Feeling via trade-offs), REQ-3 (Behavioral Integrity).
  *   **Cons:** Fails on Apathy (depressed animals stop preferring) and REQ-7 (Outliers). Hard to audit without individual testing; bred-out desires break the metric.

  **Functioning/Natural-Living Views**
  *   **Pros:** Satisfies REQ-8 (Scalability), REQ-5 (Lifetime). Easy to measure growth/behavior.
  *   **Cons:** Fails REQ-2 (Productivity) and REQ-3 (Breeding). High risk of Trap 1 & 2. A "natural" life can still hurt; functioning can persist through suffering.

  **Operationalist View (Welfare = Audit Score)**
  *   **Pros:** Satisfies REQ-8 (Scalability), REQ-4 (Currency). Shippable product.
  *   **Cons:** Fails REQ-9 (Distinction) catastrophically. Collapses reality into the metric. Validates Trap 1 & 2 if the protocol is flawed.
