          *   *Removing Tax:* If she can choose the $500k fix even after knowing mold exists, she tests.
          *   *Feature:* It's the *constraint on action space* triggered by observation.

  6.  **Final Polish:** Check tone, ensure all prompt requirements are met (one paragraph scenario, specific analysis points). Ensure the distinction between "post-learning action cost" and "something deeper" is clear. The "something deeper" is the change in the *feasible set of actions* or the *utility function itself* based on the epistemic state.

      *Self-Correction on "Feature doing the work":* The prompt asks: "is it the post-learning action cost or something deeper?"
      *Answer:* It looks like action cost, but it's actually a change in the *rules of the game* (the utility function/constraints) conditional on the epistemic state. Good's theorem assumes the utility of an outcome depends on the *state* and the *act*, not the *information state*. Here, Utility(State, Act, Knowledge) is the real function. So it's deeper than just cost; it's a violation of the separability of information and consequence.

  7.  **Final Review against constraints:**
