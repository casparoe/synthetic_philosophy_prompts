answer: |-
  Elena, a facility director, must decide whether to upgrade ventilation in a warehouse where a toxic mold *might* exist. A $10,000 test gives a definitive answer, and standard decision theory suggests testing is valuable: if mold is absent, she saves the $500,000 upgrade cost; if present, she spends it wisely. However, Elena refuses the test. Under environmental law, if she *knows* the mold exists, she is legally mandated to perform a $2,000,000 full-scale hazardous abatement. If she remains ignorant, she can legally justify a $500,000 "prudent precaution" upgrade that manages the risk without triggering the "confirmed contaminant" protocol. She declines the information, paying a small premium for ignorance to avoid the liability trap that knowledge activates.

  **Analysis**

  **Why Good's Theorem Recommends Info:** Good's Theorem states that the expected utility of making a decision after observing evidence is always at least as high as deciding without it (minus the cost of the evidence). Roughly, the Expected Value of Sample Information (EVSI) here is the probability of the mold being absent multiplied by the savings from avoiding the upgrade, plus the probability of it being present multiplied by the value of targeted remediation. As long as the test cost ($10k) is lower than the expected savings from avoiding unnecessary or misallocated spending, a rational agent should test.

  **What the Tax Does to Utility:** The "Curiosity Tax" alters the utility function conditional on the epistemic state. Normally, utility depends on the *State of the World* (Mold/No Mold) and the *Action* (Fix/Don't Fix). Here, utility depends on *State*, *Action*, and *Knowledge*. If Elena knows the mold is present, the utility of the $500k fix becomes negative infinity (legal violation), forcing her into the $2M fix. If she doesn't know, the $500k fix yields high utility. The tax makes the "Informed" branch of the decision tree strictly worse than the "Ignorant" branch.

  **Violated Assumption:** Good's Theorem assumes that **information does not change the payoff structure or the set of available actions.** It assumes $U(Action, State)$ is constant regardless of whether the State was observed. Elena's scenario violates this because the act of observation changes the legal constraints, effectively removing the $500k action from her feasible set if the result is positive.

  **Removing the Tax:** If you remove the Tax (i.e., regulations allow the $500k fix even if mold is confirmed), the scenario collapses back to standard agreement. Elena would pay for the test, and if mold is found, she would choose the $500k fix, saving $1.5M compared to the mandatory abatement. Good's Theorem would hold because information would once again only enable better optimization, not trigger penalties.

  **Feature Doing the Work:** It is **something deeper than post-learning action cost.** It is not merely that the fix is expensive; it is that the *observation itself alters the feasible action space.* In standard decision theory, learning reveals the world; here, learning *changes the rules of the world.* The feature is the coupling of epistemic state to legal/moral obligation, which violates the separability of information and consequence assumed by Good.
