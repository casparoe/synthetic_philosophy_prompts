      *   *Characters:* A manager (decision-maker) and a safety inspector or consultant (offering info).
      *   *The Choice:* Test for a hazard vs. don't test.
      *   *The "Blind" Action:* Apply a cheap, universal precaution (e.g., generic shielding).
      *   *The "Informed" Action:* If the test says "hazard present," she *must* do a costly remediation (legal liability). If "hazard absent," she saves money, but the risk of finding it present makes the test unattractive.
      *   *Drafting:* Elena, a plant manager, faces a potential asbestos issue in an old wing. She can pay $5k for a definitive survey. Good's Theorem suggests this is worth it to avoid unnecessary abatement. However, company policy and federal law state that if she *knows* asbestos exists, she must fund a $2M full remediation. If she remains ignorant, she can legally justify a $50k encapsulation strategy that manages risk without triggering the "known hazard" protocol. She declines the survey, preferring plausible deniability to avoid the mandatory $2M fix, even though the survey would technically optimize resource allocation.

      *Refining for constraints:* Needs to be one paragraph. Needs to highlight the "Curiosity Tax" (liability upon knowledge).

  3.  **Analyzing Good's Theorem (Mental Check):**
      *   *Good's Theorem (1967):* Under certain conditions, the expected utility of making a decision *after* obtaining free information is at least as high as making the decision *without* it. If information costs money, you buy it if the cost is less than the Expected Value of Sample Information (EVSI).
      *   *Key Assumptions:*
          1.  Rational agent maximizing expected utility.
          2.  Information doesn't change the *state of the world* (non-intrusive).
          3.  Information doesn't change the *payoff structure* (utility function remains constant regardless of what is known).
          4.  Agent can take the optimal action for any state revealed.

  4.  **Connecting the Scenario to the Analysis:**
      *   *Why Good says gather info:* Knowing the truth allows tailoring the action (Fix only if needed vs. Fix always). EV of information > Cost of survey.
      *   *What the Tax does:* It changes the payoff matrix *conditional on knowledge*. Knowing $X$ triggers Cost $Y$. Not knowing $X$ allows Cost $Z$ (where $Z < Y$).
      *   *Violated Assumption:* The utility of an action depends on *whether the state was observed*, not just the state itself. Specifically, the assumption that "information does not change the available actions or their consequences" is violated. The act of observation changes the legal/moral constraints.
      *   *Removing the Tax:* If knowledge doesn't trigger mandatory expensive fixes (i.e., she can choose the cheap fix even if she knows), then Good's Theorem holds. She would test and act optimally.
      *   *Feature doing the work:* It's the *coupling of observation to obligation*. It's not just post-learning action cost; it's that the *set of permissible actions* shrinks upon observation.

