prompt: |-
  Build me a one-paragraph workplace scenerio where Good's theorem reccomends you pay to learn some hidden fact before deciding, but the decision-maker refuses because of what I'll call the "Curiosity Tax" — if she learns the risk is real she gets legally/morally on the hook to fix it, and that fix costs way more than just acting blindly with a cheap precaution. Keep it realistic, no sci-fi predictors or perfect machines. After the scenerio, walk through: why Good's theorem says gather info (rough expected value), what the Tax does to her utility, which specific Good's assumption gets violated, and whether removing the Tax collapses things back to standard agreement. Also say what feature is actually doing the work — is it the post-learning action cost or something deeper?
