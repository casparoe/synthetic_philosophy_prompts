answer: |-
  ### Brainstorming Rationalisations

  Before reconstructing the implicit theory, I need to isolate the competing logics that could underpin this appraisal practice. The behaviour is inconsistent with standard moral theories, suggesting a hybrid or a category error. Here are five distinct rationalisations, ranging from the cynical to the philosophical, along with what each would predict about the details you provided.

  1.  **The Intergenerational Ponzi Scheme (Fiscal Contractarianism)**
      *   **Rationale:** The state is essentially a pension fund. Current workers pay for current retirees. To prevent default, new contributors are required. The moral status of the new contributor is irrelevant; they are an input required to balance the ledger.
      *   **Prediction:** This perfectly predicts the interchangeability of migrants and newborns. It also predicts that if a child is projected to be a net fiscal *drain* (e.g., due to predicted disability or low income), the policy should logically discourage that birth, even if the child would be happy. It predicts the environmental ministry's view is a competing ledger entry, not a moral objection.
      *   **Conflict:** It struggles to explain why the ministry claims to count only effects on the "already alive." In a Ponzi scheme, the value comes from the *new* entrant, not just the relief to the old.

  2.  **Covert Total Utilitarianism**
      *   **Rationale:** The ministry actually believes creating happy lives is good (Total View) but knows that explicitly saying "we need more people" sounds authoritarian or triggers the Repugnant Conclusion. So, they use fiscal language as a proxy for "lives worth living," assuming a normal life has positive welfare and positive tax contribution.
      *   **Prediction:** This predicts that if data showed high-tax individuals were deeply miserable, the ministry should logically stop incentivising their births. It predicts the exclusion of welfare metrics is rhetorical camouflage.
      *   **Conflict:** It cannot explain the refusal to include QALYs in the spreadsheet. If they were covert total utilitarians, they would want the welfare data to ensure the "total good" was actually increasing.

  3.  **Narrow Person-Affecting View (The Ministry's Defense)**
      *   **Rationale:** We only have obligations to existing people. Future children have no rights. However, existing people (current taxpayers) benefit if there are more future taxpayers to share their burden. The child is not the beneficiary; the current voter is.
      *   **Prediction:** This predicts the benefit should be scored as "tax reduction for current citizens," not "net tax contribution of the child." The child is a means, not an end.
      *   **Conflict:** The prompt states the benefit is scored as the "marginal child's expected lifetime net tax contribution." This treats the child's economic activity as a good in itself, not merely as a transfer to the living. This rationalisation fails to match the accounting.

  4.  **State Perfectionism (National Continuity)**
      *   **Rationale:** The nation-state is an entity distinct from its citizens that has a duty to persist through time. Demographic decline is an existential threat to the *state*, independent of the welfare of individuals.
      *   **Prediction:** This explains why individual welfare is ignored. It explains why environmental costs are a separate ledger (the State needs to survive, but also remain habitable). It predicts policy would persist even if citizens reported low happiness, provided the state remains solvent.
      *   **Conflict:** Liberal democracies rarely admit this ontology explicitly. It clashes with the "bookkeeping" defense, which sounds technocratic rather than nationalist.

  5.  **Measurement Pragmatism (The "Bookkeeping" Claim)**
      *   **Rationale:** There is no deep moral theory. It is simply that welfare of non-existent people is metaphysically and measurably undefined, whereas tax codes are concrete. We count what we can count.
      *   **Prediction:** This predicts that if a reliable metric for "expected lifetime welfare of a potential child" were developed, the ministry should be willing to include it. It predicts the inconsistency between Finance and Environment is just a silo problem, not a philosophical one.
      *   **Conflict:** It fails to explain why the *fiscal* contribution of a non-existent person is treated as measurable and relevant, while their *welfare* is not. Both require counterfactual claims about a person who does not yet exist.

  ***

  ### 1. The Implicit Theory

  The bundle of practices you describe presupposes a view I shall call **Fiscal Instrumentalism**. This is not a standard position in population ethics, but it is a coherent operational ontology often found in bureaucracies.

  On this view, the fundamental unit of value is not the *welfare subject* (the person who feels), but the *fiscal agent* (the person who pays). The theory holds that the primary obligation of the state is to maintain the solvency of the intergenerational transfer system (pensions, health, infrastructure). Consequently, the "value" of adding a person is strictly equivalent to their Net Present Value (NPV) to the public purse.

  Crucially, this theory presupposes a **separation of existence from welfare**. It treats "coming into existence" as a neutral event that becomes morally relevant only when it triggers fiscal flows. It implicitly rejects the Person-Affecting View (because it counts benefits to non-existent entities via their tax) but also rejects Total Utilitarianism (because it ignores the welfare that makes the existence "good" for the person).

  The unstated premise is: **A life is a resource.** The theory assumes that if a life is fiscally positive, it is *prima facie* rational to create it, regardless of the subjective experience of the life created. This is not necessarily because the state is malicious, but because the appraisal framework is designed to solve a specific problem (solvency), not a general problem (how to live well). The theory presupposes that the "cost" of creating the person (parental effort, environmental impact) is external to the person's own ledger, while the "benefit" (tax) is internal to the state's ledger.

  ### 2. Strict Presupposition versus Good Fit

  Is the Ministry's "already-alive" reply sufficient to reconstruct the practice on a Person-Affecting basis? **No.** The practice is philosophically underdetermined in its rhetoric but overdetermined in its math.

  The Ministry claims it is counting only effects on people who are already alive (current taxpayers who will receive pensions). This is a **good fit** for the *justification* (we need workers for *our* pensions) but it is **strictly incompatible** with the *scoring method* (benefit = child's net tax contribution).

  If the view were strictly Person-Affecting, the benefit column should read: *"Present value of tax reduction for current cohort C."* Instead, it reads: *"Present value of net tax paid by new person P."* By attributing the value to the new person's economic activity, the appraisal treats the new person as a source of value in themselves, not merely as a tool for the living.

  **Observable features that would settle the question:**
  *   **The Deficit Test:** If a projected child was expected to be happy (high QALYs) but a net fiscal drain (e.g., low income, high health needs), would the appraisal score the birth as negative?
      *   If **Yes**: The theory is Fiscal Instrumentalism (strict presupposition).
      *   If **No**: The theory is Covert Total Utilitarianism (good fit).
  *   **The Migration Equivalence:** If a migrant is scored purely on fiscal NPV, does a newborn with a lower fiscal NPV but higher welfare get ranked lower?
      *   The prompt says they are "interchangeable units." This strictly presupposes Fiscal Instrumentalism. A Person-Affecting view would struggle to equate the two, as the migrant affects existing people differently than a newborn (who requires 18 years of investment).

  The "already-alive" defense is a rhetorical shield. It cannot reconstruct the whole practice because the practice relies on the *value of the future person's contribution*, which logically requires that the future person's existence be a "thing" that can be valued. You cannot have it both ways: you cannot claim the non-existent have no standing while simultaneously banking on their future earnings.

  ### 3. The Exclusion

  Is the decision not to score the child's own welfare a genuine substantive commitment or a defensible convention? **It is a substantive commitment disguised as a convention.**

  The Ministry claims it is a "bookkeeping reason." This is indefensible. Bookkeeping conventions are chosen to reflect underlying economic reality. If the underlying reality is that a new person is being created, standard cost-benefit analysis requires counting all costs and benefits associated with that creation.
  *   **Cost:** Resources consumed, environmental impact, parental effort.
  *   **Benefit:** Fiscal contribution, *and* the welfare of the person created.

  By counting the fiscal benefit but excluding the welfare benefit, the Ministry is engaging in **asymmetric accounting**. They are counting the "revenue" the person generates for the state but ignoring the "utility" the person generates for themselves.

  **What becomes incoherent if existence *could* benefit the person?**
  If we accept that existence can benefit the person (the standard view in most ethics), the current practice becomes incoherent because it creates a **Zombie Incentive**.
  Imagine a policy that creates a million miserable taxpayers who pay just enough to be net positive. Under the current scoring, this is a "profit." Under any welfare-inclusive view, this is a catastrophe.
  The exclusion is applied only to fertility programmes because in infrastructure projects, the people affected *already exist*. In fertility projects, the people affected *are the project output*. To exclude their welfare is to assert that the output of the policy has no moral standing, only the state does. This is not a measurement constraint; it is a denial of moral patienthood to the unborn.

  ### 4. Internal Coherence

  Is it coherent for Finance to count a person as an asset and Environment as a liability while neither counts welfare?
  **Yes, it is internally coherent, but only under a specific ontology: The State as the Sole Moral Patient.**

  On this practice's own terms, a person is neither a welfare subject nor a rights-bearer. A person is a **Bio-Economic Unit**.
  *   To Finance: The Unit is a revenue stream.
  *   To Environment: The Unit is a carbon source.
  *   To the Ministry: The Unit is a variable in a solvency equation.

  This is coherent if the goal of government is **System Maintenance** rather than **Welfare Maximization**. If the "Good" is the persistence and solvency of the state apparatus, then optimizing the ratio of Fiscal Asset to Environmental Liability is rational.

  **Would it still be recognisable as population policy?**
  It would be recognisable as *demographic engineering*, but it would cease to be recognisable as *family policy*. Family policy implies concern for the family's well-being. This practice is closer to livestock management or capital investment. A coherent version of this practice would explicitly merge the Finance and Environment spreadsheets into a single "Resource Balance Sheet." The incoherence arises only because the Ministry tries to use the language of public service ("helping families") while operating on the logic of resource extraction ("securing taxpayers"). To be coherent, they must drop the pretense of helping parents and admit they are purchasing future fiscal capacity.

  ### 5. The Targeting Inversion

  This is the most critical philosophical pivot. Your second friend claims that making the payment conditional on the birth's counterfactual non-existence (the "marginal birth payment") makes the justification *worse*. **Your friend is correct, and here is why.**

  We must distinguish between the **Universal Bonus** and the **Marginal Bonus** through the lens of the Non-Identity Problem.

  *   **Universal Bonus:** Paid for *every* child.
      *   *Effect:* Most recipients would have had the child anyway.
      *   *Beneficiary:* The **Parents** (existing people). They are richer.
      *   *Justification:* This *can* be justified on Person-Affecting grounds. We are making existing people better off. The child's existence is incidental. The Ministry's "already alive" defense actually works here. We are transferring wealth to current citizens to encourage a behaviour that has positive externalities (future taxpayers).

  *   **Marginal Bonus:** Paid *only* if the child would not otherwise exist.
      *   *Effect:* The payment causes the child to exist.
      *   *Beneficiary:* The **State** (gets a taxpayer) and the **Child** (exists). The Parents are indifferent (by definition, they wouldn't have done it without the money, so they are no better off than their baseline).
      *   *Justification:* This *cannot* be justified on Person-Affecting grounds regarding the parents. The parents are not made better off relative to their choice set; they are merely induced to choose a different option. The primary "gain" is the existence of the new taxpayer.

  **The Inversion:**
  By moving to the Marginal Bonus, the Ministry shifts the moral weight from the **Existing Parent** to the **New Child**.
  *   Under the Universal scheme, the Ministry could plausibly say: "We are helping current citizens."
  *   Under the Marginal scheme, the Ministry is saying: "We are paying to bring a new fiscal unit into existence."

  If the Ministry excludes the child's welfare (as they do), the Marginal Bonus rests *entirely* on the fiscal value of a non-existent person. This exposes the contradiction the Objector noted. You cannot claim to "count only effects on the already alive" when the *entire point of the expenditure* is to create someone who is *not* already alive.
  The Universal Bonus hides the non-identity problem (most births are not identity-affecting). The Marginal Bonus *is* the non-identity problem monetized. It forces the Ministry to admit that it values the creation of the person for their tax, which requires a stance on the value of existence. By refusing to count the welfare, they are valuing the existence *only* for the state's sake. This is philosophically weaker than the Universal Bonus, which could be framed as a welfare transfer to the living.

  ### 6. Replacement

  **Scenario A: Strict Asymmetry View**
  *Theory:* We have strong reasons to avoid creating miserable people, but no reasons to create happy people.
  *   **Survive:** Environmental regulations (preventing harm). Parental support for *existing* children (preventing harm to them).
  *   **Abandon:** Baby bonuses, fertility incentives, demographic targets. There is no "need" for more workers if creating them is not a moral good.
  *   **Change:** Pension systems would need to shift from Pay-As-You-Go (requiring new workers) to Fully Funded (requiring capital investment). Policy would focus on automation and productivity, not birth rates. The "fiscal sustainability" argument would be rejected as a moral claim; solvency cannot justify creating people.

  **Scenario B: Averaging View**
  *Theory:* What matters is the average welfare level, not the total. Adding people is only good if they raise the average.
  *   **Survive:** High investment in child quality (education, health). If new citizens are highly productive and happy, they might raise the average.
  *   **Abandon:** Quantity targets. A "baby bonus" that increases births but lowers average resources per child would be negative policy.
  *   **Change:** The appraisal would include the child's welfare (QALYs) explicitly. If the marginal child is expected to have below-average welfare, the policy is bad even if they are fiscally positive. Migration policy would change: high-skill migrants might be preferred not for tax, but because they might have higher average welfare (or not lower it). The "interchangeability" of migrant and newborn breaks down because their impact on the *average* differs based on integration and starting welfare.

  ### Final Conclusion: The Missing Distinction

  There is a distinction both the Ministry and the Objector are sliding over: **The distinction between *Identity-Affecting* and *Welfare-Affecting* policy.**

  The Ministry treats the policy as *Welfare-Affecting* for the state (the state gets richer) but claims it is *Identity-Neutral* for the individual (we aren't judging the child's life). The Objector treats it as *Identity-Affecting* (you are causing someone to exist) and demands *Welfare-Affecting* accounting (you must count their life quality).

  What is missing is the explicit recognition that **Population Policy is inherently Identity-Affecting.** You cannot design a fertility incentive without deciding who comes into existence. A better-designed practice would have to confront the **Non-Identity Condition** explicitly.

  It would require a two-tier appraisal:
  1.  **For Existing People:** Standard cost-benefit (taxes, parental welfare).
  2.  **For New People:** A distinct "Existence Threshold."

  The Ministry currently assumes that *Fiscal Positive = Existence Good*. A better practice would admit that these are separate variables. It would require asking: "Is this a life worth living?" *before* asking "Is this a taxpayer we need?" By conflating the two, the Ministry risks creating a policy where the "optimal" outcome is a population of net-positive taxpayers who wish they had never been born. That is the philosophical failure hidden in the spreadsheet.
