  3.  **Drafting the Response - Section by Section:**

      *   **Brainstorming Section:** Need to write this out clearly before the main analysis. I will list the 5 rationalizations and their predictions regarding the "targeting" and "welfare exclusion" issues.

      *   **Section 1: The Implicit Theory.**
