answer: |-
  ### Robustness Scores and Tier List

  **Tier 1: High Behavioral Consistency (70–100)**
  *   **Punctuality: 85** — High opportunity density and precise cue-concordance drive this score, though the stability reflects social scripting rather than moral character [SCRIPT].
  *   **Temperance: 70** — Extremely high opportunity density regarding food and drink consolidates the disposition, despite physiological drives that occasionally override it.

  **Tier 2: Moderate Behavioral Consistency (50–69)**
  *   **Truthfulness in speech: 65** — High opportunity density supports stability, but Hartshorne & May data on cheating fragments cross-situational consistency.
  *   **Playful ease in conversation: 60** — Frequent social interaction provides dense practice opportunities, though the lack of experimental data makes this an extrapolation from opportunity density.
  *   **Fidelity to costly promises: 55** — Cue-concordance is high when a promise is explicit, but the low frequency of *costly* promises limits dispositional consolidation.
  *   **Fairness in dividing resources: 50** — Moderate cue-concordance in game-theory settings, but opportunity density with *strangers* is too low to guarantee global stability.

  **Tier 3: Low Behavioral Consistency (30–49)**
  *   **Gratitude: 45** — Cue-concordance is strong upon receiving benefits, but the irregular frequency of significant favors limits opportunity density.
  *   **Humility about accomplishments: 40** — Situational cues for humility are often ambiguous or socially punished, reducing the reliability of the eliciting context.
  *   **Loyalty to a friend: 35** — Opportunity density is low because associations rarely become genuinely costly, and situational pressure often overrides the disposition.
  *   **Physical courage: 30** — Extremely low opportunity density for genuine threats allows situational fear responses to dominate the rare occasions that arise.

  **Tier 4: Minimal Behavioral Consistency (0–29)**
  *   **Compassionate helping: 20** — Low opportunity density for visible distress combined with the bystander effect demonstrates severe cue-concordance failure.

  ***

  ### Assessment of Experimental Bias

  **Is this ranking measuring robustness or experimental coverage?**
  Honestly, this ranking measures **experimental coverage** more than actual robustness. The traits in Tier 4 (Compassion, Courage) are scored low primarily because situationist psychologists have aggressively targeted them with studies designed to show failure (e.g., Darley & Batson, Milgram), whereas traits in Tier 1 and 2 (Punctuality, Wittiness, Temperance) are scored higher largely because they are under-studied in social psychology, not because they are empirically proven to be globally stable. We have no "dime in the phone booth" equivalent for wittiness, so we assume stability by default based on opportunity density, which is a methodological artifact, not a finding.

  **How to tell the two hypotheses apart:**
  To distinguish actual robustness from experimental bias, you would need to apply **uniform Experience Sampling Methodology (ESM)** across all eleven traits simultaneously. If you equipped subjects with devices prompting them to report opportunities and actions for *every* trait on the list over six months, you could calculate a true cross-situational consistency coefficient for each; if the "Courage" and "Punctuality" scores converge under identical measurement conditions, the current ranking is merely a map of the literature's blind spots.
