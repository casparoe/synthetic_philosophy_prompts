      *   *Refined Prediction:* She will likely argue Arcadia is **not** backsliding, or at most "illiberalism within a democracy," because the *mechanisms of removal* (elections, term limits) remain intact and independent, distinguishing it from Hungary/Turkey where removal became structurally difficult.

  5.  **Identify Two Divergent General Rules:**
      *   *Rule A (Institutional Resilience):* Backsliding requires the durable weakening of core state accountability mechanisms (courts, electoral admin, constitution). Civil society restrictions alone are insufficient if elections remain free and executive constraints hold.
          *   *Fits:* US (institutions held = No), Hungary (institutions weakened = Yes).
