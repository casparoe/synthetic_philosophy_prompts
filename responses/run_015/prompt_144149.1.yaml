answer: |-
  # The Indicator Stress Protocol (ISP)

  **Purpose:** To determine whether a candidate performance indicator is suitable for financial attachment in a state workforce contract.
  **Users:** Evaluation Analysts (3), Director, Deputy Director.
  **Output:** One of four verdicts: **Pay As Written**, **Pay With Guardrails**, **Monitor Only**, **Drop**.

  ## Part 1: The Twelve-Step Procedure

  **Step 1: Goal/Measure Separation & Blind Spot Statement**
  *   **Action:** Write the policy goal in plain English. Write the metric formula separately. Draft the "Blind Spot Statement."
  *   **Pass:** The Blind Spot Statement explicitly names the population or outcome the metric structurally excludes (e.g., "This measure excludes participants who find work after 91 days").
  *   **Fail:** The metric is treated as synonymous with the goal.
  *   **Failure Action:** Return to Step 1. Do not proceed until the Blind Spot Statement is signed by the Analyst.
  *   **Artifact:** *Blind Spot Statement* (Internal Memo).

  **Step 2: No-Real-Improvement Test (Cost-Benefit of Gaming)**
  *   **Action:** Identify the cheapest administrative or procedural change a provider can make to hit the target without improving participant outcomes. Estimate the provider's cost to execute this change versus the potential payment gain.
  *   **Pass:** Cost to game > Potential Payment Gain.
  *   **Fail:** Cost to game < Potential Payment Gain.
  *   **Failure Action:** Move to **Verdict: Monitor Only** OR proceed to Step 8 to design a payment structure that reduces the gain.

  **Step 3: Who-Goes-Missing Test (Creaming/Parking)**
  *   **Action:** Identify which participant subgroups (e.g., those with barriers, criminal records) a provider would financially prefer not to enroll or serve to maximize this metric. Determine if our intake data can detect the absence of these groups.
  *   **Pass:** We can detect shifts in enrollment demographics via existing data fields.
  *   **Fail:** We cannot detect the exclusion of high-cost participants.
  *   **Failure Action:** Move to **Verdict: Drop** unless a risk-adjustment formula can be added (requires Step 11 Sign-off).

  **Step 4: Moving-the-Line Test (Definition Manipulation)**
  *   **Action:** Identify where in the causal chain a provider can reset a clock, redefine a denominator, or reclassify an exit (e.g., delaying "exit" date until employment is secured).
  *   **Pass:** Definition relies on third-party verified data (e.g., wage records) rather than provider entry.
  *   **Fail:** Definition relies on provider-entered dates or statuses.
  *   **Failure Action:** Proceed to Step 6 (Data Verification). If verification is impossible, move to **Verdict: Drop**.

  **Step 5: What-Gets-Sacrificed Test (Unintended Consequences)**
  *   **Action:** Identify which unmeasured goods (e.g., job quality, retention beyond 90 days, soft skill development) a provider would trade away to move this number. Identify a signal that would indicate this trade-off.
  *   **Pass:** A correlated "guardrail metric" exists to detect the sacrifice (e.g., retention at 6 months).
  *   **Fail:** No data exists to detect the sacrifice.
  *   **Failure Action:** Move to **Verdict: Monitor Only** (do not pay) until a guardrail metric is developed.

  **Step 6: Data Verification Feasibility**
  *   **Action:** Confirm the data can be validated during the annual audit without creating new reporting burdens.
  *   **Pass:** Data matches existing state wage records or immutable system logs.
  *   **Fail:** Data relies on case notes or self-reporting.
  *   **Failure Action:** Move to **Verdict: Drop**.

  **Step 7: Legal/Procurement Language Check**
  *   **Action:** Draft the payment rule. Can it be written as a binary or formulaic condition?
  *   **Pass:** Rule is objective (e.g., "If X > 50%, Pay $Y").
  *   **Fail:** Rule requires subjective judgment (e.g., "If effort is satisfactory").
  *   **Failure Action:** Redefine metric or Move to **Verdict: Drop**.

  **Step 8: Payment Structure Design (Cliff vs. Smooth)**
  *   **Action:** Determine if payment is a threshold (cliff) or continuous (smooth).
  *   **Pass:** Payment is tiered or continuous to reduce marginal gaming incentives.
  *   **Fail:** Payment is all-or-nothing at a specific threshold.
  *   **Failure Action:** Redesign payment schedule. If Legal rejects redesign, proceed to Step 11.

  **Step 9: Guardrail Integration (Hold-Backs)**
  *   **Action:** Assign at least one metric to be collected but never paid on, to serve as a validity check.
  *   **Pass:** A "Shadow Metric" is identified.
  *   **Fail:** All resources are consumed by paid metrics.
  *   **Failure Action:** Reduce the number of paid metrics.

  **Step 10: Re-Review Trigger Definition**
  *   **Action:** Set the statistical threshold that forces a mid-contract review.
  *   **Pass:** Trigger is defined (e.g., "If 90% of providers hit 100% of target").
  *   **Fail:** No trigger defined.
  *   **Failure Action:** Do not finalize contract.

  **Step 11: Value Judgment Sign-Off**
  *   **Action:** If Steps 2, 3, or 5 resulted in a "Fail" but the indicator is still desired (e.g., legislative mandate), the Deputy Director must sign off on the risk.
  *   **Pass:** Deputy Director signs the *Risk Acceptance Form* (see Part 3).
  *   **Fail:** Deputy Director refuses signature.
  *   **Failure Action:** Move to **Verdict: Monitor Only**.

  **Step 12: Final Verdict & Contract Integration**
  *   **Action:** Assign final verdict and draft contract language.
  *   **Output:** Contract Clause or Internal Memo.
  *   **Verdicts:**
      1.  **Pay As Written:** All steps passed.
      2.  **Pay With Guardrails:** Passed with Step 8/9 modifications.
      3.  **Monitor Only:** Failed Steps 2/3/5, passed Step 11 (Risk Accepted) OR failed Step 11.
      4.  **Drop:** Failed Steps 6/7 or deemed too risky.

  ---

  ## Part 2: Operationalizing the "No" and Guardrails

  ### What a "No" Means Operationally
  *   **Drop:** The indicator is removed from the contract entirely. It is not reported to the provider. It is not reported to the legislature (or is reported as "Under Development").
  *   **Monitor Only:** The indicator is written into the contract as a **Reporting Requirement**, not a **Payment Requirement**.
      *   *Contract Language:* "Provider shall report [Metric] quarterly. Failure to report constitutes a breach. Performance on [Metric] shall not influence reimbursement rates."
      *   *Internal Use:* Data is used for the annual audit sampling and the Re-Review Trigger (Step 10).

  ### Contract-Safe Guardrails
  1.  **Smoothing Payment:**
      *   *Concept:* Marginal effort yields marginal money.
      *   *Legal Risk:* Procurement often rejects open-ended formulas as "fiscally uncertain."
      *   *Substitute:* **Tiered Bonus Structure.** Define specific tiers (e.g., 50-60% = $X, 60-70% = $Y). This creates steps, not a cliff, but remains enforceable.
  2.  **Hold-Back Measure:**
      *   *Concept:* One measure collected but never paid.
      *   *Legal Risk:* Low, provided it is listed under "Reporting Requirements" separate from "Incentive Payments."
      *   *Substitute:* None needed. Label it "Compliance Metric" rather than "Performance Metric."
  3.  **Pre-Baseline Target:**
      *   *Concept:* Setting a target before the baseline year closes.
      *   *Legal Risk:* High. Procurement will strike this as "unfair competition" or "impossible condition."
      *   *Substitute:* **True-Up Clause.** "Year 1 targets shall be established based on Year 1 actual performance. Year 2 payments shall be reconciled against Year 2 targets established in Month 13."

  ### Secret vs. Public Machinery
  *   **Public (In Contract):** The definition of the metric, the data source, the payment tiers, the reporting frequency.
  *   **Secret (Internal Only):** The *Stress Test Logic* (Steps 2-5), the *Re-Review Trigger* thresholds, the *Blind Spot Statement*.
  *   **Risk of Secrecy:** If providers discover the Re-Review Trigger (e.g., "If everyone hits 100%, we change the rule"), they will coordinate to stay just below the trigger.
  *   **Mitigation:** The Re-Review Trigger must be written as a "Right to Amend" clause based on "Statistical Anomaly," without defining the specific anomaly threshold in the contract text.

  ---

  ## Part 3: Value Judgment Sign-Off

  **When used:** When an indicator fails a Stress Test (Steps 2, 3, or 5) but must be included due to legislative mandate or strategic priority.

  **Format: Risk Acceptance Form (One Page)**

  | **Indicator Name** | [e.g., 90-Day Employment Rate] |
  | :--- | :--- |
  | **Failed Stress Test** | [e.g., Step 3: Who-Goes-Missing] |
  | **Identified Risk** | [e.g., Providers may avoid enrolling candidates with criminal records to protect the rate.] |
  | **Detection Plan** | [e.g., Quarterly audit of referral logs against community demographic data.] |
  | **Mitigation Strategy** | [e.g., Cap weight of this indicator at 20% of total contract value.] |
  | **Residual Risk** | [e.g., We may see a 10% reduction in high-barrier enrollments before detection.] |
  | **Deputy Director Signature** | ___________________ **Date:** ___________ |
  | **Rationale for Acceptance** | [Required: "Legislative Mandate" or "Strategic Necessity"] |

  ---

  ## Part 4: Re-Review Trigger

  **The Pattern:** **Compression and Decoupling.**
  1.  **Compression:** 80% or more of providers achieve 95% or more of the target within the first two quarters. This indicates the target is too low or the gaming is successful.
  2.  **Decoupling:** The paid indicator moves positively (e.g., employment up), while the "Hold-Back/Shadow Metric" moves negatively or stays flat (e.g., 6-month retention down).

  **Distinguishing Improvement from Adaptation:**
  *   **Improvement:** Paid metric rises; Shadow metric rises or holds steady; Provider costs (reported in audits) rise or hold steady.
  *   **Adaptation (Gaming):** Paid metric rises; Shadow metric falls; Provider costs drop (efficiency gain without resource increase).
  *   **Action:** If Trigger fires, invoke the "Right to Amend" clause. Freeze payments on the indicator. Convert to "Monitor Only" for Year 2 while a new metric is stress-tested.

  ---

  ## Part 5: Procedure Application on Three Candidates

  ### Candidate 1: Share of participants employed at 90 days after exit
  *   **Step 1 (Blind Spot):** Excludes employment found on day 91+. Excludes gig work not captured in wage records.
  *   **Step 2 (No-Real-Improvement):** **FAIL.** Provider can pressure participants to accept any job (even unsustainable) just to hit day 90, then let them churn. Cost to provider: Low (one phone call). Payment Gain: High.
  *   **Step 3 (Who-Goes-Missing):** **FAIL.** Providers will avoid participants with barriers (justice-involved, disabled) who are statistically less likely to hold a job for 90 days.
  *   **Step 4 (Moving-the-Line):** **FAIL.** Provider can delay "exit" date in the system until the participant has been employed for 90 days, artificially manufacturing the denominator.
  *   **Step 5 (Sacrifice):** **FAIL.** Sacrifices job quality and long-term retention.
  *   **Step 11 (Sign-Off):** Required. Legislature expects this number.
  *   **Verdict:** **Monitor Only.** (This is the answer you will not like).
  *   **Rationale:** The gaming cost is too low, and the risk to high-barrier populations is too high. Paying on this actively harms the mission.
  *   **Legislative Strategy:** Report the number as "Outcome Data" but not "Performance Success." Testify: "Paying on this metric reduces long-term stability. We are monitoring it to ensure quality, but paying on [Alternative Metric]."
  *   **Alternative Payment:** Pay on **Wage Growth at 1 Year**. It is harder to game (requires wage record match) and aligns with stability.

  ### Candidate 2: Median days from referral to first paycheck
  *   **Step 1 (Blind Spot):** Excludes quality of match. Favors quick-placement jobs over career-path jobs.
  *   **Step 2 (No-Real-Improvement):** **PASS.** Cheapest route is actual efficiency. Gaming requires falsifying referral dates.
  *   **Step 3 (Who-Goes-Missing):** **FAIL.** Providers may refuse "work-ready" assessments for difficult cases to stop the clock.
  *   **Step 4 (Moving-the-Line):** **FAIL.** Provider can redefine "referral" date to the date the participant was actually ready, not when they walked in.
  *   **Step 6 (Verification):** **PASS.** Can be cross-checked against system login timestamps if intake is digital.
  *   **Step 8 (Smoothing):** **PASS.** Use tiered bonus.
  *   **Verdict:** **Pay With Guardrails.**
  *   **Guardrails:** Cap weight at 15% of total contract. Add Step 3 risk-adjustment (credit for high-barrier enrollments). Define "Referral" in contract as "Date of First System Login," not "Date of Case Opening."

  ### Candidate 3: Documented completion of soft-skills workshop
  *   **Step 1 (Blind Spot):** Measures attendance, not learning.
  *   **Step 2 (No-Real-Improvement):** **FAIL.** Cost to game is zero. Provider runs a 15-minute session, signs the sheet, pays the participant $20.
  *   **Step 5 (Sacrifice):** **FAIL.** Sacrifices actual curriculum rigor.
  *   **Step 6 (Verification):** **FAIL.** Audit can verify a signature exists, not that the content was delivered.
  *   **Verdict:** **Drop.**
  *   **Rationale:** This is an output, not an outcome. It is purely gameable. Do not put this in the contract. If needed for compliance, make it a "Reporting Requirement" with no financial tie.

  ---

  ## Part 6: Honest Limitations

  **Residual Risk:**
  This procedure cannot stop collusion. If 30 of your 40 providers agree to game a metric in the same way, the data will look like "systemic improvement" until the audit. With only one audit per year, you will miss the window to stop it before the fiscal year closes.

  **Uncatchable Adaptation:**
  The procedure cannot detect "effort displacement." A provider may hit your metrics perfectly while silently defunding the parts of their program you aren't measuring (e.g., counseling, community building). You will see success in the data while the program's soul erodes.

  **The Breaking Point:**
  Stop trusting indicators when the **Variance Collapse** occurs. If every provider hits the target within a 2% margin for two consecutive quarters, the metric is dead. It no longer distinguishes performance; it only distinguishes compliance.

  **The Fallback:**
  When the metrics collapse, you must fall back on **Qualitative Site Visits**. Your analysts must visit providers not to check boxes, but to interview participants off-site. Ask participants: "What did you actually do?" and "Are you still working?"
  If the data says 90% employed and the participants say 50% employed, burn the contract and rewrite the metrics. Do not try to fix the math. Fix the relationship.
