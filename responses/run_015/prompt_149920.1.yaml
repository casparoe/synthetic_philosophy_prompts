answer: |-
  # SEMINAR HANDOUT: Taxonomy of Strategy-Stealing Commitments
  **Course:** Advanced Decision Theory | **Topic:** The Strategy-Stealing Assumption in Newcomb Problems

  ## I. The Diagnostic Decision Tree
  *Follow the branches based on your theoretical commitments. Leaves indicate specific philosophical positions.*

  **ROOT:** Does the strategy-stealing assumption require that the agent's reasoning process be **transparent** to the predictor (i.e., accessible as logical source code rather than merely statistically correlated)?
  *   **BRANCH 1A: YES (Transparency Required)**
      *   **LEVEL 2:** Does a "local-copy" scenario (offline simulation of the predictor's algorithm, acting contrary to its output) count as **stealing the strategy**?
          *   **BRANCH 2A: YES (Copy Counts as Stealing)**
              *   **LEVEL 3:** Does accepting this assumption force **one-boxing** in standard Newcomb, or is it consistent with **two-boxing** (via causal independence)?
                  *   **BRANCH 3A: FORCES ONE-BOXING**
                      *   **LEVEL 4:** In "Twin Newcomb" (identical agents, only one faces predictor), does the argument apply **symmetrically** to both?
                          *   **BRANCH 4A: YES (Symmetric)** → **LEAF 1: Functional Decision Theory (FDT)**
                          *   **BRANCH 4B: NO (Asymmetric)** → **LEAF 2: Contextual Functionalism**
                  *   **BRANCH 3B: CONSISTENT WITH TWO-BOXING**
                      *   **LEVEL 4:** In "Twin Newcomb," does the argument apply **symmetrically** to both?
                          *   **BRANCH 4A: YES (Symmetric)** → **[GAP: Incoherent]** *(See Section III)*
                          *   **BRANCH 4B: NO (Asymmetric)** → **LEAF 3: Causal-Logical Hybrid**
          *   **BRANCH 2B: NO (Copy Does Not Count)** → **[GAP: Incoherent]** *(See Section III)*
  *   **BRANCH 1B: NO (Transparency Not Required)**
      *   **LEVEL 2:** Does a "local-copy" scenario count as **stealing the strategy**?
          *   **BRANCH 2A: YES (Copy Counts as Stealing)**
              *   **LEVEL 3:** Does accepting this assumption force **one-boxing** or is it consistent with **two-boxing**?
                  *   **BRANCH 3A: FORCES ONE-BOXING** → **[GAP: Unattractive]** *(See Section III)*
                  *   **BRANCH 3B: CONSISTENT WITH TWO-BOXING**
                      *   **LEVEL 4:** In "Twin Newcomb," does the argument apply **symmetrically** to both?
                          *   **BRANCH 4A: YES (Symmetric)** → **[GAP: Unexplored]** *(See Section III)*
                          *   **BRANCH 4B: NO (Asymmetric)** → **LEAF 4: Strategic Causalism**
          *   **BRANCH 2B: NO (Copy Does Not Count)**
              *   **LEVEL 3:** Does accepting this assumption force **one-boxing** or is it consistent with **two-boxing**?
                  *   **BRANCH 3A: FORCES ONE-BOXING**
                      *   **LEVEL 4:** In "Twin Newcomb," does the argument apply **symmetrically** to both?
                          *   **BRANCH 4A: YES (Symmetric)** → **LEAF 5: Evidential Decision Theory (EDT)**
                          *   **BRANCH 4B: NO (Asymmetric)** → **[GAP: Unstable]** *(See Section III)*
                  *   **BRANCH 3B: CONSISTENT WITH TWO-BOXING**
                      *   **LEVEL 4:** In "Twin Newcomb," does the argument apply **symmetrically** to both?
                          *   **BRANCH 4A: YES (Symmetric)** → **[GAP: Incoherent]** *(See Section III)*
                          *   **BRANCH 4B: NO (Asymmetric)** → **LEAF 6: Causal Decision Theory (CDT)**

  ---

  ## II. Leaf Descriptions & Awkward Commitments

  1.  **Functional Decision Theory (FDT)** [1A-2A-3A-4A]
      *   *Awkward Commitment:* Treats physically distinct agents with identical source code as a single locus of agency, violating intuitive boundaries of individuality to preserve logical correlation.
  2.  **Contextual Functionalism** [1A-2A-3A-4B]
      *   *Awkward Commitment:* Claims identical reasoning processes yield different normative prescriptions solely based on the external presence of a predictor, undermining the "functional" claim.
  3.  **Causal-Logical Hybrid** [1A-2A-3B-4B]
      *   *Awkward Commitment:* Asserts a logical link between agent and predictor exists (transparency) yet denies that link constrains the optimal action, rendering the transparency diagnostic inert at the moment of choice.
  4.  **Strategic Causalism** [1B-2A-3B-4B]
      *   *Awkward Commitment:* Claims an agent can "steal" the strategy via simulation (implying predictive vulnerability) while maintaining the prediction is causally sealed (implying predictive invulnerability).
  5.  **Evidential Decision Theory (EDT)** [1B-2B-3A-4A]
      *   *Awkward Commitment:* Requires treating news of one's own action as causally efficacious regarding past events, or accepting "spurious correlations" (e.g., the smoking lesion) as action-guiding.
  6.  **Causal Decision Theory (CDT)** [1B-2B-3B-4B]
      *   *Awkward Commitment:* Must concede that agents who precommit win more, yet maintain that rational agents at the moment of choice should act to lose, creating a tension between planning and acting.

  ---

  ## III. Diagnosed Gaps (Unoccupied Combinations)
  *Combinations not represented by Leaves 1–6 are diagnosed below.*

  *   **[1A-2B] Transparency Yes / Copy No:** **Incoherent.** If reasoning is transparent to the predictor, a perfect local simulation *is* the reasoning; denying it counts as stealing contradicts the transparency premise.
  *   **[1A-2A-3B-4A] Transparency Yes / Copy Yes / Two-Box / Symmetric:** **Incoherent.** If the twin symmetry holds and logical transparency exists, the agent cannot causally separate their choice from the prediction; two-boxing contradicts the symmetry constraint.
  *   **[1B-2A-3A] Transparency No / Copy Yes / One-Box:** **Unattractive.** Implies the agent can trick the predictor via simulation (Copy Yes) but should still submit to the prediction (One-Box), forfeiting the advantage gained by the simulation.
  *   **[1B-2A-3B-4A] Transparency No / Copy Yes / Two-Box / Symmetric:** **Unexplored.** Suggests a non-transparent causal link that allows strategy stealing but applies symmetrically to twins; no major literature defends this specific causal topology.
  *   **[1B-2B-3A-4B] Transparency No / Copy No / One-Box / Asymmetric:** **Unstable.** EDT typically relies on correlation symmetry; asserting asymmetry without transparency removes the evidential link for the twin, collapsing into CDT.
  *   **[1B-2B-3B-4A] Transparency No / Copy No / Two-Box / Symmetric:** **Incoherent.** If there is no transparency and no simulation leverage, there is no mechanism to enforce symmetry between the twin facing Omega and the twin who is not.

  ---

  ## IV. Limitations of this Taxonomy
  *Positions that fall on the same branch require further cases to distinguish.*

  *   **CDT vs. Sophisticated CDT:** Both occupy **Leaf 6**. To distinguish them, introduce a **Precommitment Case**: Sophisticated CDT pays for a precommitment device; standard CDT does not.
  *   **FDT vs. Timeless Decision Theory (TDT):** Both occupy **Leaf 1**. To distinguish them, introduce a **Counterfactual Mugging** variant involving logical uncertainty vs. mathematical certainty; TDT and FDT diverge on the treatment of logical counterfactuals in non-identical algorithm scenarios.
  *   **EDT vs. Arntzenius's Deliberational EDT:** Both occupy **Leaf 5**. To distinguish, use a **Newcomb with Feedback** loop where the agent's deliberation process itself alters the correlation strength.
