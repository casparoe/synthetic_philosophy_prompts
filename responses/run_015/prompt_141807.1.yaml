answer: |-
  You press me on the spirit of locality, but I contend you are smuggling in a metaphysical preference for temporal asymmetry that relativity itself does not mandate. My defence is that the 'spirit' of relativity is Lorentz invariance and the absence of a preferred foliation of spacetime. Nonlocality, whether Bohmian or collapse-based, invariably requires a privileged simultaneity to make sense of the instantaneous influence, which strikes me as a far graver violation of the relativistic worldview than allowing causal influences to track the light-cone structure backwards. I concede freely that retrocausality is counterintuitive; however, intuition is a poor guide in quantum foundations. I am paying the cost of temporal symmetry, yes, but you are paying the cost of spatial nonlocality, which demands action outside the light cone. I argue mine is the cheaper bill because it preserves the spacetime ontology without modification.

  Regarding bilking and the undermining of evidence, you are conflating retrocausality with superdeterminism. My view is not that the settings were fixed at the Big Bang in a conspiratorial fashion, but that the setting event dynamically influences the source via a backwards-in-time process. This blocks the bilking argument because, just as standard quantum mechanics prohibits superluminal signalling despite nonlocal correlations, my model prohibits retro-signalling despite the backwards influence; you cannot manipulate the hidden variables directly to create a paradox. As for your third point, the evidence does not dictate that settings *must* be independent, only that they *appear* statistically independent in practice. Retrocausality explains this appearance without sacrificing the integrity of the experimental arrangement. I maintain that preserving locality in the sense of spacelike separation is worth the conceptual adjustment of allowing the future to weigh upon the past.
