answer: |-
  You have hit on one of the central debates in the philosophy of technology and digital ethics. Your friend is experiencing a very common cognitive friction, and you are right to notice that his *ontology* (what he thinks exists) clashes with his *ethics* (how he thinks we should treat things).

  Here is a breakdown of the terminology, the philosophical landscape, and how to determine if your friend is inconsistent or just using the wrong vocabulary.

  ### 1. Is there a name for this tension?

  There isn't one single "law" named after a philosopher, but there are two key terms that describe exactly what is happening.

  **A. Digital Dualism**
  Coined by sociologist Nathan Jurgenson, this is the most precise label for your friend's mindset. **Digital Dualism** is the fallacy that the "physical world" and the "digital world" are separate realities.
  *   **The Dualist View:** The physical is "real" (atoms, touch, consequence); the digital is "virtual" (bits, screens, pretend).
  *   **The Tension:** As you noticed, Digital Dualists often claim virtual things don't matter *until* they suffer a loss. Then, they implicitly switch to an **Augmented Reality** view (where digital and physical are intertwined) to justify their anger. Your friend is a Digital Dualist in theory but an Augmented Realist in practice.

  **B. The Virtual Realism vs. Virtual Fictionalism Debate**
  In metaphysics, this is the core conflict.
  *   **Virtual Fictionalism:** Virtual objects are fictional entities. They are like props in a play. Harming them is like tearing up a script—it's rude, but not "theft."
  *   **Virtual Realism:** Virtual objects are real objects, just made of digital stuff rather than physical stuff. A digital sword is a real sword made of bits.
  *   **The Tension:** Your friend argues for Fictionalism ("it's just code") but reacts as a Realist ("my property was stolen").

  ### 2. Is your friend inconsistent, or is there a coherent position?

  You asked if he is just being inconsistent or if there is a way to make sense of both halves. Interestingly, there **is** a coherent philosophical position that validates his feelings while accepting his premise that "it's just code." It relies on shifting the definition of *value* from *substrate* to *labor and relationship*.

  Here are three ways to reconcile his view without calling him a hypocrite:

  **A. The Lockean Labor Argument (The "Sweat Equity" Defense)**
  John Locke argued that property rights are established when a person mixes their labor with a resource.
  *   **The Coherent Position:** The *object* (the code) might be ephemeral or owned by the game company, but the *value* is generated by the player's time and effort.
  *   **Why it works:** Even if the sword is "just pixels," the 100 hours spent earning it are **real hours** of a **real life**. Destroying the build doesn't destroy atoms, but it destroys *time*. Since time is a finite, real resource, the harm is real. Your friend isn't valuing the code; he is valuing the crystallized labor.

  **B. The Psychological/Moral Reality Argument**
  This distinguishes between **Ontological Reality** (is it made of matter?) and **Phenomenological Reality** (does it affect consciousness?).
  *   **The Coherent Position:** Harm is defined by the impact on a sentient being, not the material status of the object causing the impact.
  *   **Why it works:** If someone insults you, no physical atoms are transferred, yet the harm is real. If someone deletes your character, it triggers genuine neurological stress responses (cortisol, anger, grief). The "reality" of the harm is located in the *victim*, not the *object*. Your friend can consistently claim "the object isn't real" while maintaining "the pain is real."

  **C. The Social Contract Argument**
  Online games function as micro-societies with implicit social contracts.
  *   **The Coherent Position:** The "reality" of the object is derived from the shared agreement of the community.
  *   **Why it works:** Money is "just paper" (or digital entries in a bank), yet we agree it has value. If someone burns your cash, they haven't destroyed much physical matter, but they have violated a social agreement that sustains your ability to live. Similarly, in Minecraft, the community agrees that builds belong to builders. Violating that norm is a moral wrong, regardless of the ontological status of the blocks.

  ### 3. The Strongest Counter-Argument (David Chalmers)

  If you want to push your friend further, you should look at the work of philosopher **David Chalmers**, specifically his book *Reality+*.

  Chalmers argues that your friend's first premise is simply false. Chalmers posits **Virtual Realism**:
  *   Virtual objects *are* real objects.
  *   A digital chair is a real chair, made of digital bits rather than wooden atoms.
  *   Therefore, virtual harm *is* physical harm, because the digital world is part of the physical world (it runs on physical servers and affects physical brains).

  Chalmers would say your friend is suffering from a **category error**. He thinks "real" means "made of atoms," but "real" actually means "causally powerful." Since virtual objects have causal power (they make you happy, they make you sad, they can be sold for real money), they are real.

  ### Summary for your next argument

  You don't have to convince him that pixels are atoms. You can win the argument by reframing what "real" means in this context.

  1.  **Name the bias:** Tell him he is exhibiting **Digital Dualism**. He treats the digital realm as separate until it hurts him.
  2.  **Validate the harm:** Agree that the *code* might be ephemeral, but the **labor** (time spent) and the **social relations** (friendships, reputation) attached to that code are undeniably physical and real.
  3.  **The "Just Paper" Analogy:** Ask him if a bank deleting his savings is "not real harm" because money is just numbers in a database. If he says that *is* real harm, he admits that **informational value** counts as reality.

  Your friend isn't necessarily inconsistent; he just lacks the vocabulary to explain why "just code" can constitute "real property." His intuition about the harm is morally correct, even if his metaphysics are shaky.
