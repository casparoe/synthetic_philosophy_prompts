answer: |-
  This is a rich pedagogical challenge. *Do the Right Thing* is often taught as a film about racial conflict, but your framing isolates a much more precise philosophical problem: the ontology of the commemorative object and the politics of the space it occupies.

  Here is a reading of the Wall of Fame strand structured around your schema and hypotheses, designed to hold up under scrutiny from both philosophy and film studies colleagues.

  ### 1. The Schema Applied: Subject, Voice, and Speech-Act

  Your suspicion is correct: the dispute presents itself as the **Subject Question** (Who is worthy?) but is fundamentally driven by the **Voice Question** (Who speaks?) and the **Speech-Act Question** (What does this do to the space?).

  *   **The Subject Question (The Red Herring):** Buggin' Out frames his demand as one of representation: "We want some brothers up on that wall." Sal frames his refusal as one of personal taste: "I only put up Italians." If this were purely about the Subject Question, the "Addition Asymmetry" should hold. Adding Denzel Washington does not erase Frank Sinatra. The moral cost should be low.
  *   **The Voice Question (The Real Conflict):** Sal's defense is not "Italian-Americans are better." It is "It's my pizzeria." He anchors the Voice in *property ownership*. Buggin' Out anchors the Voice in *demographic presence* ("This is a black neighborhood"). The film reveals that in segregated urban environments, property rights and community sovereignty are in tension. The wall is not just a display; it is a declaration of who has the authority to curate the neighborhood's visual landscape.
  *   **The Speech-Act Question (The Injury):** You ask if commemoration praises or claims belonging. The film argues it is the latter. When a Black customer looks at the wall, the speech-act is not "These Italians are great." It is "You are a guest here." The wall functions as a boundary marker. It converts a commercial transaction (buying a slice) into a cultural submission.

  ### 2. Testing the "Addition Asymmetry"

  Your hypothesis is that the honoring is **positional**: the statement is *"This is whose place this is."* Therefore, addition changes the statement rather than lengthening the list.

  **Verdict:** This is correct, but we can sharpen the philosophical terminology. The wall is not an *archive*; it is a *constitution*.
  *   **Archive Model:** If the wall were an archive (aiming for comprehensive historical record), addition would be neutral.
  *   **Constitutive Model:** Sal treats the wall as a constitutive act of the business's identity. To add Black celebrities is not to add data; it is to amend the constitution of the space from "Italian-American Outpost" to "Integrated Community Hub."
  *   **The Resistance:** Sal resists because he understands that curation is power. If he accepts the addition, he admits that his ownership does not grant him unilateral control over the *meaning* of the space. The resistance is proportional to removal because both addition (in this context) and removal challenge the *curatorial authority* of the owner. It is a dispute over who holds the pen that writes the neighborhood's narrative.

  **Better Formulation:** The asymmetry fails because the speech-act is **identitarian**, not **honorific**. The wall says, "I am here, and this is my home." Adding "We are here too" contradicts the singular possessive. It transforms the speech-act from an expression of *self* to an acknowledgment of *other*. For Sal, that is a loss of self-definition, equivalent to erasure.

  ### 3. Testing the "Conversion Thesis"

  Why does a private wall feel like a public monument? Why isn't Sal off the hook?

  **Verdict:** The film does not cheat. It relies on the concept of the **Quasi-Public Sphere**.
  *   **Avoidability:** A statue in a park is hard to avoid; a picture in a shop is theoretically avoidable (don't go in). However, Sal's is the neighborhood hub. It functions as the de facto town square. When a private space assumes the *functional role* of a public square, it incurs *public obligations*.
  *   **Economic Entanglement:** Sal extracts capital from the Black community while visually excluding them. This creates a colonial dynamic. The "Conversion" happens because the *economic relationship* is public, even if the *property title* is private.
  *   **The Philosophical Pivot:** The literature on public memory often assumes a democratic polity (the State puts up the statue). *Do the Right Thing* updates this for civil society. It asks: When the State is absent or hostile (as represented by the police in the film), does the commercial proprietor become the default governor of public memory? If so, do they have democratic obligations? The film argues yes.

  ### 4. Addressing the Film-Studies Colleague (Critical Challenges)

  You need to defend the analogy against the charge that a pizzeria wall is not a Confederate statue.

  **Where the Analogy Breaks:**
  1.  **Funding:** Statues are often tax-funded (coercive). Sal's wall is self-funded (voluntary).
  2.  **Subject Matter:** Sinatra and DiMaggio are entertainers/athletes; Lee and Jackson are political/moral leaders. One is cultural capital, the other is moral authority.
  3.  **Permanence:** Statues are bronze and stone; photos are paper and glue.

  **Where the Analogy Holds (The Defense):**
  1.  **The Gaze:** The injury of public memory is not in the funding source, but in the *interpellation* of the viewer. Both the statue and the wall hail the passerby. They say, "This space is for people like *them*." The psychological effect of alienation is identical regardless of whether the funding was public or private.
  2.  **Cultural Landscape:** Public memory is not just about statesmen; it is about whose culture is deemed "monumental." By excluding Black figures from the "Hall of Fame," Sal relegates Black culture to the street (the boombox) while keeping Italian culture on the pedestal (the wall).
  3.  **Property Rights vs. Human Dignity:** Sal's refusal is "not obviously wrong" in a libertarian framework. The film challenges that framework by suggesting that in a tightly knit, segregated community, property rights cannot fully insulate one from the moral demands of recognition.

  **The Ending: Riot or Resolution?**
  Does the film let a riot settle the argument? No. The riot *destroys the premise of the argument*.
  *   The burning of the pizzeria removes the wall. It solves the dispute by annihilating the site of the dispute. This is a tragic commentary on what happens when commemorative conflicts have no democratic outlet: the monument is destroyed rather than debated.
  *   **Smiley's Act:** This is the crucial philosophical intervention. Smiley pins the photos of King and Malcolm X to the *burning* wall.
      *   **Ephemeral Commemoration:** Unlike the permanent wall, this act is fleeting. It acknowledges that memory in this context is fragile.
      *   **Reclamation:** He reclaims the space at the moment of its destruction.
  *   **The Epigraphs:** You ask if this is "commemoration without verdict." It is better understood as **dialectical commemoration**.
      *   King (nonviolence) and Malcolm X (self-defense "by any means necessary") are presented not as a synthesis, but as a tension.
      *   The film refuses to rank them because the *conflict itself* is the truth of the memory. To choose one is to falsify the historical reality of the struggle. It proposes that honest public memory must hold competing truths in tension, rather than smoothing them into a single, state-approved narrative. It is coherent, not evasive: it suggests that memory is a *site of struggle*, not a settled fact.

  ### 5. Teaching Advice: Pause Points

  For a philosophy seminar, pause on these three moments to bridge the gap between abstract argument and cinematic texture.

  **Pause 1: The First Confrontation (Subject vs. Voice)**
  *   **Scene:** Buggin' Out asks for the photos; Sal says, "I don't know any Black celebrities." Buggin' Out: "What about Magic Johnson?" Sal: "It's my pizzeria."
  *   **Philosophical Point:** Highlight the shift in Sal's argument. He moves from *Subject* ("I don't know any") to *Voice* ("It's my pizzeria").
  *   **Lesson:** This reveals that the "Subject" argument is often a shield for the "Voice" claim. When we argue about statues, we say "He was a bad man" (Subject), but we often mean "You don't get to tell us what to value" (Voice).

  **Pause 2: Radio Raheem's Boombox (Auditory Commemoration)**
  *   **Scene:** Raheem walking the block, "Fight the Power" blasting, clashing with Sal's Italian opera or the Korean grocer's radio.
  *   **Philosophical Point:** This is the **non-visual claim on shared space**.
  *   **Lesson:** Commemoration isn't just static (statues/walls); it's ambient. Raheem forces the neighborhood to *hear* Black presence, just as the wall forces them to *see* Italian presence. It expands the "Speech-Act" question: Memory is not just what we look at; it is the soundscape we inhabit. It also raises the question of *imposition*: Is Raheem's volume as coercive as Sal's wall? (The film suggests the power dynamics differ, but the claim on space is parallel).

  **Pause 3: Smiley at the End (The Transformative Act)**
  *   **Scene:** Smiley taping the photos to the charred wall as the fire trucks arrive.
  *   **Philosophical Point:** **Insurgent Commemoration.**
  *   **Lesson:** Standard public memory is top-down (State -> People). Smiley's act is bottom-up and ephemeral. It suggests that when official channels (or property owners) block recognition, memory becomes an act of resistance. It also answers the "Addition Asymmetry": Smiley doesn't ask to add to Sal's wall; he creates a *new* wall on the ruins of the old one. It shows that sometimes, the existing framework of commemoration must be broken to make space for the truth.

  ### Summary for the Seminar
  *Do the Right Thing* argues that commemoration is never merely about the past (the Subject); it is always about the present distribution of power (the Voice) and the definition of belonging (the Speech-Act). The film validates your "positional" hypothesis: the wall is a claim of sovereignty. It complicates the "private property" defense by showing how economic power converts private space into public terrain. Finally, through Smiley, it offers a model of memory that is not about settling verdicts, but about sustaining the tension of competing truths—a necessary correction to the philosophical desire for neat resolutions.
