      *   **Audience:** 8 Astrobiologists (microbial ecologists, origin-of-life, skeptical of human exceptionalism/hubris, value epistemic humility, worry about scientific objectivity) + 4 Moral Philosophers (environmental ethics, non-identity problem, *no* decision theory/analytic metaphysics).
      *   **Format:** Q&A Prep Sheet ordered by "damage" (most threatening objections first).
      *   **Structure per Objection:** Objection (in their vocabulary), Concession, 2-Minute Reply, Weakest Point of Reply.
      *   **Specific Inclusion:** The "Objection I hope nobody raises" (consent/information asymmetry or implausible procreative obligation).
      *   **Tone:** Serious, respectful of their commitments, not straw-manning.

  2.  **Deconstruct the Audience & Their Likely Objections:**

