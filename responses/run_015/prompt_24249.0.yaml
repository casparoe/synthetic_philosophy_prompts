  9.  *(Check on (5))*: (5) says "rest of natural world... continues to flourish." This implies non-human sentience. If (2) is true, this flourishing has value. (5) says human extinction without this flourishing being a "tragedy" (in the sense of 1). This implies the *human* element is the necessary condition for the "catastrophe" in (1). This creates a hierarchy of value incompatible with standard welfarism (2).

  10. **Final Plan:**
