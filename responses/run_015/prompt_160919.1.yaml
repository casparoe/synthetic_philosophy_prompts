answer: |-
  Elara lies in Bed 4, vascular dementia so advanced she no longer tracks faces or speaks, her internal capacities for agency and self-awareness clinically absent. Yet the ward's morning routine bends around her standing commitments. When the doctor proposes a sedative, her daughter doesn't appeal to kindness; she cites Elara's lifelong insistence on clarity over comfort, a principle Elara enforced for everyone she cared for. The charge nurse adjusts the blinds not because it's policy, but because Elara promised her brother she'd watch the sunrise, a promise the nurse now treats as a binding constraint on her own workflow. Her past reasons are not memories here; they are active vetoes and directives that settle practical disputes among the staff. The ward operates differently because Elara's agency is still routing decisions, even though she generates no new signals.

  **What each view says**
  The capacities theorist says Elara is no longer a person. She cannot reason, choose, or recognize herself. The daughter and nurse are behaving virtuously, but they are projecting personhood onto a biological organism that no longer has it. The relational theorist says Elara is fully a person. Personhood isn't a light inside the head; it's a status maintained by the network around you. Because her community is still bound by her reasons—letting her past commitments decide present actions—her personhood is still active. She isn't just being cared for; she is still participating.

  **The feature doing the work**
  Call this **Active Reasons-Keeping**. It's not just remembering who she was; it's allowing who she was to govern what happens now. The relations aren't passive; they are conduits for her agency.

  **The Variation**
  What if the daughter stops visiting and the staff rotate shifts, caring for Elara by rote off a chart? The capacities theorist says nothing changes; she wasn't a person yesterday either. The relational theorist faces a hard choice. If personhood depends on the quality of the relation, then yes, her personhood fades when the Reasons-Keeping becomes mechanical. Some relationalists accept this: personhood is fragile and requires constant social labor. Others argue the *institution* now holds the reason, but that risks turning personhood into a paperwork exercise. If the relations go slack, the relational view must admit the person slips away, or else explain what carries the weight without the active holding.

  **The Capacities Reply**
  The capacities theorist will say: "You've relocated personhood into other people's attitudes and got the direction of explanation backwards. We don't keep her reasons because she is a person; we keep her reasons because we *owe* it to the person she was. You're describing our duty, not her status. By making her personhood depend on our effort, you make it something we give her, not something she has."

  **Honest Assessment**
  Is this something extra or just redescription? It is something extra. The capacities view says personhood is a natural kind, like having a liver—you either have the parts or you don't. The relational view says personhood is a social status, like being a citizen—you have it only as long as the community recognizes and upholds it. That's a real difference. It means personhood isn't just found; it's made. But it comes with a cost: if the community stops making it, the person disappears. That's a hard pill for any of us to swallow, especially in a care home where staff are tired and families drift. The case shows the relational view isn't just wearing nicer clothes; it's wearing a different skeleton.
