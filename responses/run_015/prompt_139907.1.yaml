  Plutarch's painter misleads. It suggests character is a static surface captured by a passive observer. Your verdicts show character is dynamic tension. The right principle is **The Law of Friction**: character is revealed where will meets resistance.

  **Clause 1: The Asymmetry of Leakage.** Unforced errors reveal more than cultivated virtues because virtue is often performance, while vice is often leakage. This saves (4), (5), and (7). Rudeness damns because it bypasses social editing; courtesies are cheap currency. Public crimes tell more than achievements because collapse exposes structural flaws achievement hides. "Some say" discreditable stories stick because they align with this leakage; flattering ones vanish as propaganda.

  **Clause 2: The Cost of Will.** Deliberate acts reveal only when they overcome significant internal or external resistance. This saves (1) and the last part of (9). The Gordian knot instructs because it resolves a genuine impasse with decisive will, not because it is unauthored. The ledger of faults reveals because sustaining virtue against inclination is expensive labour. This overturns your "failure of authorship" rule: authored acts count if the cost is high.

  **Clause 3: Resistance to Shape.** Anecdotes reveal when they resist moral neatness. This saves (2), (3), (6), and (8). Caesar weeping is discounted because it fits a trope too perfectly; the estate instruction moves because it is mundane and untheatrical. Childhood prefiguration is a trick; remembered childhood is evidence because it implies the subject integrated the memory, not the biographer.

  **Unsettled Cases:**
  1.  **Leaked Remark vs. Voting Record:** The remark wins. Voting is routine performance (low friction); the leak is unguarded friction (high revelation), per Clause 1. The record shows policy; the remark shows the man.
  2.  **Blameless Life/No Anecdotes:** The absence is the verdict. A life without friction is either saintly or hollow; biography cannot distinguish them. The method is blind here. Silence is data, but it is ambiguous data. You must decide if smoothness is virtue or emptiness.
  3.  **Life by Enemy:** High value, but risky. The enemy seeks friction where the subject seeks smoothness. However, verify against Clause 3: if the enemy shapes the life too neatly to condemn, it loses force. An enemy's truth is often sharper, but their narrative is often more shaped. Trust the specific accusation, distrust the general arc.

  **Verdicts Overturned:**
  This principle saves all nine of your verdicts by reframing the source of revelation. It overturns only your working rule that revelation requires a "failure of authorship." Case (1) and the ledger in (9) are highly authored yet instructive because they demonstrate costly will. It also clarifies (8): the subject's memory matters not because it lacks authorship, but because it shows internal integration rather than external shaping.

  Plutarch's focus on the "slight thing" remains valid, but not because it is small. It is valid because small things often bypass the defenses erected for great occasions. The painter captures the face; you must capture the strain behind the eyes. Your biographer should not look for the uncomposed moment, but for the moment where composition nearly failed.
