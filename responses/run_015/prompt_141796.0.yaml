  Consider a territorial songbird with an innate aggression mechanism ($S$) selected to defend against conspecific rivals ($A$). A heterospecific mimic ($B$) has evolved to match the rivals' key visual features, reliably triggering $S$ despite posing no actual territorial threat. Crucially, the metabolic cost of refining the visual mechanism to exclude $B$ outweighs the energy wasted on futile attacks; thus, the selection history is genuinely indifferent between a mechanism tuned strictly to $A$ and one tuned to $A$-or-$B$, meaning the mechanism functions exactly as selected when tokened by $B$. The mimic's power to trigger $S$ is entirely derived from the conspecific's profile (remove $A$, the tuning vanishes, and $B$ no longer triggers $S$), satisfying asymmetric dependence for content *Conspecific Rival*. However, because the consumer system's fitness payoff is identical under both mappings and the mechanism is performing its proper function when tokened by $B$, teleosemantics cannot privilege 'conspecific' over 'conspecific-or-mimic' without arbitrary stipulation, leaving the $B$-token status indeterminate while the informational account cleanly verdicts it as error.

  | Feature | Informational (Asymmetric Dependence) | Teleosemantics (Etiological/Consumer) |
  | :--- | :--- | :--- |
  | **Verdict on $B$-tokens** | **Misrepresentation (Error).** $S$ means *Conspecific Rival*. | **Indeterminate / True.** $S$ means *Conspecific Rival or Mimic*. |
  | **Why?** | $B$'s causal power depends on $A$'s, but not vice versa. | Selection history tolerates $B$; no function is frustrated by $B$-tokens. |
  | **Key Feature Doing Work** | **Evolutionary Cost-Benefit Indifference.** The mechanism is *supposed* to ignore the distinction because discrimination is too costly. | **Evolutionary Cost-Benefit Indifference.** (Same feature, opposite implication). |
  | **If Feature Removed** | If discrimination were costless, $A$ and $B$ would diverge causally; Info might still hold but the case weakens. | If discrimination were costless, selection would prune $B$-tokens; Teleo would then verdict Error (malfunction). |
  | **Teleosemantic Pushback** | "Proper function is fixed at the *origin* of the trait, not during maintenance. If $B$ is a later mimic, it's not in the selection history, so $B$-tokens are errors." |
  | **Honesty Flag** | **Tension Bent:** The "Derived/Mimic" constraint implies $B$ evolves *after* $A$, but the "Selection Indifference" constraint requires $B$ to be present *during* the relevant selection period to bloat the content. I assumed a co-evolutionary equilibrium where $B$ is entrenched enough to shape the "Normal Conditions" of the mechanism's maintenance, which some strict historical teleosemanticists might reject. |
