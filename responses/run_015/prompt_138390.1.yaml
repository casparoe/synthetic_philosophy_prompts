  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Process designer for citizens' assemblies on regional water policy.
      *   **Context:** 24 residents, 6 weekends, scientific advisory panel produced a "factual baseline" (reservoir levels, demand scenarios, contamination thresholds, capital costs).
      *   **Conflict:** Disagreement with a colleague on epistemic ground rules.
      *   **User's Proposal:** Baseline is settled fact. Participants can argue *what to do* about facts, not *whether* they are facts. Facilitators rule out claims contradicting baseline.
      *   **User's Justification:** Arendtian grounds (*Lying in Politics*, "Truth and Politics"). Factual truth loses in open contestation; liars produce coherent alternatives, truth-tellers only repeat contingent facts. Organized falsehood leaves cynicism. Therefore, remove factual questions from agenda.
      *   **Colleague's Objection:** Turns advisory panel into a "ministry of truth"; Arendt would hate this. Arendt's worry isn't about false beliefs (verbal quibble according to user).
      *   **User's Task:**
          1.  Answer the colleague (strongest Arendtian version of objection + reply).
          2.  Draft the rule (individual statements vs. systemic accounts).
      *   **Constraints:**
          *   Reply as a single JSON object.
          *   Specific field names: `reading_verdict`, `presupposition`, `arendt_on_truth_and_power`, `harm_relocated`, `reply_to_colleague`, `rule_scope`, `draft_rule`, `unaddressed_residue`, `confidence`.
          *   Take user's reading of Arendt as given for the second part (but the JSON fields require assessing the reading).
          *   `draft_rule` max 80 words.
          *   `confidence` format: "level," followed by a clause.

  2.  **Evaluate User's Reading of Arendt (Internal Knowledge Check):**
      *   *User's Claim:* Factual truth loses in open contestation; liars produce coherent alternatives, truth-tellers repeat contingent facts. Damage is cynicism/falsehood discrimination loss. Solution: Shelter facts outside political struggle (like courts/archives).
      *   *Arendt's Actual View:* In "Truth and Politics," Arendt distinguishes between rational truth (philosophical/scientific) and factual truth. She argues factual truth is indeed fragile against organized lying because facts are contingent (could be otherwise) whereas lies can be made consistent. She argues factual truth needs institutions (judiciary, press, archives) to protect it *from* the political realm's tendency to overwrite reality. However, she also emphasizes that factual truth enters the political realm when it becomes a matter of public concern. The tension is that while facts need protection, *politics* requires the presence of others and debate.
      *   *Critique of User's Proposal:* Arendt warns against turning facts into absolute dictates that destroy the political space. If the "baseline" is imposed *within* the assembly (the political space itself) as non-debatable, it risks turning the assembly into an administrative body rather than a political one. The "Ministry of Truth" objection holds weight because Arendt values the *appearance* of truth in the public realm, not just its bureaucratic enforcement. However, she does agree facts need institutional protection. The key nuance is *who* decides the facts and *how*. An advisory panel is closer to an expert body, but making their output immune to challenge *within* the deliberation might stifle the "common world" building that happens when participants verify facts together.
      *   *Verdict:* The user's reading holds *in part*. They capture the fragility of factual truth and the need for institutional shelter. They miss the nuance that the political realm must still *acknowledge* the fact freely, not just be forced to accept it procedurally, otherwise the fact loses its worldly reality (which depends on shared recognition, not just decree).
      *   *Presupposition to Reject:* The idea that sheltering facts *outside* the arena is identical to foreclosing them *inside* it. For Arendt, the "outside" institutions (press, courts) validate truth so it can enter the arena *as* truth, not as a rule of procedure. If the assembly cannot question the source, the fact doesn't become part of their "common world."

  3.  **Drafting the JSON Fields:**

      *   `reading_verdict`: "holds in part" (Captures the fragility of truth, misses the nuance of political acceptance).
      *   `presupposition`: The assumption that procedural foreclosure inside the assembly is equivalent to institutional shelter outside it. Arendt distinguishes between the *authority* of institutions (which persuades) and the *power* of rules (which coerces); factual truth needs authority to become part of the common world, not just procedural immunity.
      *   `arendt_on_truth_and_power`: Arendt argues factual truth is contingent and vulnerable to organized lying, which destroys the common world. She insists facts require independent institutions (courts, press) to validate them before they enter politics. However, she warns that treating facts as absolute commands can destroy the political space where freedom appears. Protection requires authority, not just coercion.
      *   `harm_relocated`: The harm is not false beliefs but the destruction of the "common world" where reality is shared. If participants cannot jointly verify facts, they inhabit different realities, making action impossible. The rule must prevent reality-denial without preventing shared discovery.
      *   `reply_to_colleague`: Strongest objection: Foreclosing debate turns facts into commands, destroying the political freedom Arendt cherishes. Reply: The baseline is not a command but a boundary condition provided by an independent body (like a court), allowing freedom to operate on *action* rather than *reality*, preserving the common world necessary for freedom.
      *   `rule_scope`: "both" (Need to catch direct lies and coherent alternative realities, but facilitators need help). Actually, the prompt asks for one of the options. Let's look at the colleague's argument: individual is too broad/narrow, systemic is what Arendt worried about. But facilitators can't judge systemic easily. A hybrid approach is best, but I must choose one of the specific strings or justify a nuance. The prompt says: `rule_scope` — string, one of "individual statements," "systemic accounts," "both," or "neither," followed by a one-sentence justification. I will choose "both" because Arendt worries about the *image* (systemic) but the rule needs enforceability (individual).
      *   `draft_rule`: Needs to be
