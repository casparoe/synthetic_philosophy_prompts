  Final Report on a Simple State

  I believe that it is raining.
  I watch the water on the street.
  It is certain that it is raining.

  The clouds are gray and not draining.
  I watch the water on the street.
  I feel that the light is waning.

  The air is thick and straining.
  The glass is cold against the heat.
  It is clear that the light is waning.

  The night is slow and gaining.
  The glass is cold against the heat.
  The body waits for the light waning.

  The warmth is gone and feigning.
  No dry place left for us to meet.
  The skin responds to the dark gaining.

  The cold is sharp and remaining.
  No dry place left for us to meet.
  The hand moves as the dark is gaining.
  It is certain that it is raining.
