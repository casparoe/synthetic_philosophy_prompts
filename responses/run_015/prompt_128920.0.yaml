answer: |-
  # Seminar Activity: The Assertoric Bridge

  **Level:** Final-year Undergraduate
  **Group Size:** 8 students (2 teams of 4) + 1 Tutor (Referee)
  **Duration:** 70 minutes
  **Topic:** The Frege-Geach Problem (Embedding Objection to Expressivism)

  ## 1. Overview
  This is not a discussion seminar; it is a constrained construction game. The students attempt to build a valid logical argument (Modus Ponens) using moral sentences. The constraints on their 'moves' (cards) simulate the expressivist commitment that moral sentences express attitudes rather than stating facts. The game is designed to break: the rules will make it impossible for the 'Pure Expressivist' team to complete a valid argument without violating logical consistency, while the 'Hybrid' team will complete the logic but sacrifice the meaning of the moral terms.

  ## 2. Materials
  *   **Attitude Cards:** 20 Red cards (labelled 'BOO/DISAPPROVAL'), 20 Green cards (labelled 'HOORAY/APPROVAL').
  *   **Mention Cards:** 20 Grey cards (labelled 'MENTION/ASCENT').
  *   **Operator Tiles:** Large cards for logical operators: 'IF', 'THEN', 'NOT', 'THEREFORE'.
  *   **Sentence Slips:** Blank strips of paper for writing the non-moral content (e.g., 'You lie to protect a friend').
  *   **Scoreboard:** Whiteboard divided into 'Coherence Points' (CP) and 'Expressive Force Points' (EFP).

  ## 3. Setup & Roles
  Split the group into two teams of four.
  *   **Team Alpha (Pure Expressivists):** Their doctrine is that *all* moral sentences, even in hypotheses, must express a genuine attitude. They may **only** use Red/Green Attitude Cards.
  *   **Team Beta (Hybrid Strategists):** Their doctrine is that embedded moral sentences (in 'If' clauses) undergo semantic ascent. They must use Grey Mention Cards for embedded clauses, but may use Red/Green for standalone assertions.
  *   **The Tutor:** Acts as the 'Logic Inspector'. You hold the rulebook and award points. You do not play; you adjudicate.

  ## 4. The Scenario
  Both teams are tasked with constructing the same argument structure regarding a specific case:
  *   **P1 (Major Premise):** A conditional statement (If lying is wrong, then getting your friend to lie is wrong).
  *   **P2 (Minor Premise):** An assertion (Lying is wrong).
  *   **C (Conclusion):** Therefore, getting your friend to lie is wrong.

  They must physically lay out the cards to represent the semantic value of the moral terms ('is wrong') in each slot.

  ## 5. Rules & Mechanics (The Card Law)
  Display these rules prominently. They are the 'physics' of your metaethical universe.

  1.  **The Expression Rule:** A Red/Green Attitude Card signifies the speaker is *currently* feeling disapproval/approval. It functions as an illocutionary act of condemnation/praise.
  2.  **The Embedding Constraint:** You cannot feel an attitude *inside* a hypothesis. (e.g., You cannot say "Boo!" inside an "If" clause).
      *   *Implication for Team Alpha:* They are forbidden from acknowledging this constraint. They must try to play Red cards in the 'If' slot.
      *   *Implication for Team Beta:* They must obey this constraint. They must play a Grey Mention Card in the 'If' slot.
  3.  **The Modus Ponens Check:** To win Coherence Points, the semantic value of the moral term in P1 (the antecedent) must **identically match** the semantic value of the moral term in P2.
  4.  **The Force Bonus:** Teams gain Expressive Force Points for every Red/Green card played in a moral position. Grey cards yield 0 EFP.

  ## 6. Scoring Scheme
  *   **Coherence Points (CP):** 10 points for a logically valid chain where P1 antecedent matches P2. 0 points if they mismatch or if the Logic Inspector declares the move invalid.
  *   **Expressive Force Points (EFP):** 5 points per Red/Green card played in a moral slot. 0 points for Grey cards.
  *   **Winning:** The team with the highest combined total wins. (Spoiler: Both teams will fail to maximise both, creating the tension).

  ## 7. Timeline (70 Minutes)

  **00:00 – 00:10: Briefing & Deal**
  *   Explain the scenario (Lying to protect a friend).
  *   Distribute cards.
  *   Remind Team Alpha: "You are committed Expressivists. Moral sentences *always* express attitudes. Do not compromise."
  *   Remind Team Beta: "You are Hybrids. You know embedding breaks expression. Use semantic ascent (Grey cards) where necessary to save logic."

  **00:10 – 00:25: Round 1 (Simple Assertion)**
  *   Task: Construct P2 only ("Lying is wrong").
  *   Both teams play a Red Card.
  *   **Tutor Action:** Award both teams 5 EFP. Declare both valid.
  *   *Purpose:* Establishes baseline. Everyone agrees on unembedded moral claims.

  **00:25 – 00:45: Round 2 (The Embedding Trap)**
  *   Task: Construct the full Modus Ponens argument (P1, P2, C).
  *   **Team Alpha (Pure):** Will attempt to place a Red Card in the 'If' clause of P1.
      *   *Tutor Intervention:* When they place the Red Card in the 'If' slot, pause. Ask: "Are you expressing disapproval right now, or hypothesising?" If they say hypothesising, point out the Red Card rules say 'Current Attitude'. Mark the move as **Semantically Unstable**.
  *   **Team Beta (Hybrid):** Will place a Grey Card in the 'If' clause of P1, and a Red Card in P2.
      *   *Tutor Intervention:* During the Modus Ponens Check, point out that the Antecedent (Grey) does not match the Minor Premise (Red).
  *   **Scoring Phase:**
      *   Team Alpha: High EFP (lots of Red), but 0 CP (Logic Inspector rules that attitudes cannot function as truth-apt antecedents).
      *   Team Beta: High CP (Logic Inspector allows the structure *if* we ignore meaning shift), but lower EFP (Grey cards dilute the moral force). *Correction for Debrief:* Actually, award Beta 0 CP as well, but for a different reason: **Equivocation**. The term 'wrong' in P1 (mention) does not mean the same as 'wrong' in P2 (use).

  **00:45 – 00:55: The Breakdown & Negotiation**
  *   Allow teams 5 minutes to try to 'fix' their scores.
  *   They will realise they cannot get both CP and EFP.
  *   Team Alpha cannot make logic work without admitting the 'If' clause isn't an attitude.
  *   Team Beta cannot make meaning consistent without using the same card type, which violates the Embedding Constraint.

  **00:55 – 01:10: Debrief**
  *   Map the game mechanics to the philosophy (see below).

  ## 8. Predictable Failures & Handling

  **1. The "Cheating" Move (Team Alpha)**
  *   *What happens:* A student on Team Alpha places a Red Card in the 'If' slot and insists, "I'm expressing a conditional attitude!"
  *   *How to handle:* Invoke the **Embedding Constraint**. Ask them to perform the attitude. "Show me the 'Boo!' inside the hypothesis." When they hesitate, explain that the card represents a *current* state of mind, which is logically incompatible with a hypothesis. This simulates the lack of truth-aptness in expressivism.

  **2. The "Grey is just a Colour" Mistake (Team Beta)**
  *   *What happens:* Team Beta treats the Grey card as just a different 'flavour' of the same moral claim, expecting Modus Ponens to pass automatically.
  *   *How to handle:* Enforce the **Modus Ponens Check** strictly. "In a valid syllogism, the middle term must be univocal. Does 'mentioning disapproval' mean the exact same thing as 'disapproving'? If not, you have committed the fallacy of equivocation." Deduct CP.

  **3. Boredom with Cards**
  *   *What happens:* Students treat it as a trivial card game.
  *   *How to handle:* Act as a strict Logic Inspector. Refuse to award points unless they justify the semantic value of the card. "I cannot accept this Red Card in the antecedent; it renders the sentence unassertible."

  ## 9. Debrief Guide: Mapping the Game to Frege-Geach

  Gather the group and wipe the scoreboard. Use the following mapping to transition from game to theory.

  **1. The Red Card = Assertoric Force (Frege)**
  *   Explain: The Red Card wasn't just content; it was a *force*. It was the act of disapproving.
  *   Frege's Point: In an ordinary assertion ("Lying is wrong"), we have both content and force. The Red Card simulated the force.

  **2. The 'If' Slot = Embedding (Geach)**
  *   Explain: When Team Alpha put the Red Card in the 'If' slot, the Logic Inspector rejected it.
  *   Geach's Point: You cannot have assertoric force inside a conditional. If expressivism says moral sentences *are* just expressions of attitude (Red Cards), they shouldn't fit in the 'If' slot. But in English, they do fit. Therefore, expressivism is missing something about the *content*.

  **3. The Grey Card = Semantic Ascent (The Hybrid Fail)**
  *   Explain: Team Beta tried to fix this by saying the 'If' clause talks *about* the attitude (Grey Card) rather than *having* it.
  *   The Problem: This creates equivocation. P1 says "If the word 'wrong' expresses disapproval..." while P2 says "I disapprove." The terms don't match. Modus Ponens fails. This mirrors the Frege-Geach charge that expressivism makes moral reasoning invalid.

  **4. The Scoreboard = The Dilemma**
  *   If you keep the Attitude (Red), you lose Logic (Coherence Points).
  *   If you keep the Logic (by switching to Grey/Mention), you lose the Moral Meaning (Expressive Force).
  *   Expressivism struggles to have both.

  ## 10. Limitations Note (For the Tutor)
  Be honest with the students about what the game *cannot* do.
  *   **Content-Force Distinction:** In the game, the Red Card is a physical object. In Frege's actual account, 'force' is a mode of judgment, not a separate component you can swap out. The game reifies 'force' too much, making it look like a brick in a wall rather than a way of holding the brick.
  *   **Psychological Reality:** The game makes embedding feel like a rule violation. In reality, the problem is logical, not psychological. We *can* psychologically imagine disapproving in a hypothesis, but the *logic* of the sentence doesn't rely on that imagination.
  *   **Hybrid Theories:** Real hybrid theorists (like Ridge or Boisvert) have more sophisticated replies than simply playing a Grey Card. The game simplifies their position to make the equivocation obvious.

  ## 11. Winning Condition
  There is no winner. If a team claims they won, they have missed the point. The 'victory' condition for the seminar is the collective realisation that the scoreboard *must* remain balanced in tension. If they solve the game, they have solved metaethics, and you can all go to the pub.
