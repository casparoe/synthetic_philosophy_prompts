  The risk is real. When a sentence places the pathogen as the driver of the mortality curve, half the room sees something precise and defensible about transmission dynamics. The other half hears a sentence in which nobody decided anything. No one built the tenements. No one cut the quarantine budget. No one picked which neighborhoods got the water main. Conversely, historians have their own failure mode. They write an outbreak as though it were purely a story about power, with the biology as set dressing. You could swap the microbe for a different one and change nothing. That is a failure mode for both sides. One erases human agency; the other erases biological constraint.

  So, we have two tools to keep us here for two days. First, the exposure question. Behind any claim that a germ or a climate caused an outcome, there is a prior fact about who was standing where. Somebody usually arranged that positioning. Ask who was exposed and who made that arrangement. The sentence either gains a mechanism or turns out to have been an alibi. This grounds the biology in geography and the geography in policy. It forces the modeler to account for the tenement and the historian to account for the transmission vector. It turns a black box into a map.

  Second, the substitution test. Rewrite the sentence with the non-human term replaced by the human decisions that set the exposure. See what is left. Here, I will break my own rule to show you why it matters. Imagine we say the volcano voted to close the trade routes. [PAUSE] Now run the test. Replace "volcano" with "magistrates who feared the ash." If the sentence becomes false—if it cannot explain why this valley starved while the next one traded—then the non-human term was carrying real weight. Keep it. If nothing is left, the geology was decoration. This prevents us from hiding behind nature or hiding behind culture.

  This is not metaphysics. We are not here to resolve whether germs count as actors. That is the wrong question for a kickoff. The right question is whether our sentences survive contact with the other side of the room. For our funder, this is the deliverable. A shared vocabulary is not just polite; it is the only way to ensure the next five years produce findings rather than misunderstandings. It turns "deliverable" from a buzzword into a method. It ensures that when we publish, we are not publishing parallel monologues.

  We need both halves of the room. If the biologists leave, we lose the mechanism. If the historians leave, we lose the context. Stay in the room. Test your sentences. Let's get to work.

  2. **Grammar ledger**

  *   "Definition that slips its leash": Definition (non-human) slips (action). Survives substitution; metaphor for linguistic drift.
  *   "Biology as set dressing": Biology (non-human) acts as (state). Survives; illustrates reducibility.
  *   "Volcano voted": Volcano (mountain) voted (intention). **Flagged exception**; immediately corrected via substitution test.
  *   "Geology was decoration": Geology (non-human) was (state). Survives; denotes lack of explanatory power after substitution.
  *   "Germs count as actors": Germs (microbe) count (state). Survives; framing the debate rather than entering it.

  3. **If the room turns out to be mostly modelers**

  *Replacement paragraph (third quarter):*
  Second, the parameter check. When a model outputs a mortality spike, isolate the variable that triggered it. If the variable is "contact rate," ask what human behavior fixed that rate. If the model cannot distinguish between a crowded market and a crowded church without new inputs, the biology is carrying weight it shouldn't. This prevents us from treating social structures as static background noise. It turns a black box into a map.

  *Cost analysis:*
  This swap prioritizes mechanical robustness over narrative agency, appealing to quantifiers but risking alienation of the historians. I lose the explicit invitation for historians to test their own sentences, potentially making them feel like data providers rather than collaborators.
