answer: |-
  **Settled:** Social conventions (tipping, traffic) vary geographically; visitors interact with and impact local systems.
  **Contested:** Whether physical presence generates a *moral* obligation to adopt local norms.

  **Menu of Claims:**

  *   **Descriptive Prediction:** "Locals will stare or fine you."
      *   *Status:* True/Trivial.
      *   *Supports Conformity?* Only if you fear social sanction or legal penalty.
  *   **Prudential Advice:** "Minimize friction/maximize utility."
      *   *Status:* Defensible.
      *   *Supports Conformity?* Instrumentally, yes. Morally, no. Sometimes breaking norms (safe jaywalking) is rational.
  *   **Fairness/Reciprocity:** "You benefit from their system, bear its costs."
      *   *Status:* Defensible.
      *   *Supports Conformity?* Strong for public goods (traffic rules); weak for voluntary transfers (exploitative tipping).
  *   **Cultural Relativism:** "Morality is local; no external standard."
      *   *Status:* Contested/Disputed.
      *   *Supports Conformity?* Weak. Most ethicists reject strong relativism. Even if true, it doesn't mandate *your* adherence.
  *   **Conventionalism:** "The rule exists, therefore it binds."
      *   *Status:* False.
      *   *Supports Conformity?* No. Conventions lack authority if coercive or welfare-reducing.

  **Verdict:** The proverb often conflates prudential risk with moral duty. It supports conformity only when local norms align with independent reasons (safety, reciprocity), not merely because they are local.
