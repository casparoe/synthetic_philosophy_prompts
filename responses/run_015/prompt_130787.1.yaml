prompt: |-
  Everytime I travel someone hits me with "when in Rome, do as the Romans do" like its a knockdown argument — last week about tipping in NYC (which I think is coercive) and then jaywalking in Berlin. I'm trying to figure out what that proverb actually amounts to when people apply it to everyday conventions: tipping, queueing, jaywalking, and whether visitors really have moral obligations to conform.

  Can you lay out teh precise claims it could be expressing? For example: pure descriptive prediction ("locals will stare"), prudential advice ("avoid conflict"), universal morality with locally-variable rules, full-blown cultural relativism, or something weirder like the convention generating its own authority regardless of welfare. For each reading say if its trivial, defensible, false, and — crucially — whether it actually supports the conclusion people push (that I must tip/queue/jaywalk like them). I want a menu I can use, not one picked answer.

  Keep it under 300 words, bullet points ok. Also please separate what's genuinely settled (that social conventions exist and vary) from what's contested among people who study norms — don't present one side like cultural relativism or universalism as teh consensus.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** The proverb "When in Rome, do as the Romans do" applied to everyday conventions (tipping, queueing, jaywalking).
      *   **Task:** Lay out precise claims/interpretations of the proverb (e.g., descriptive, prudential, moral, relativist, etc.).
      *   **Evaluation:** For each reading, assess if it's trivial, defensible, false, and whether it supports the conclusion (visitor *must* conform).
      *   **Constraint 1:** Keep under 300 words.
      *   **Constraint 2:** Bullet points okay.
      *   **Constraint 3:** Separate settled facts (conventions exist/vary) from contested theories (relativism vs. universalism).
      *   **Tone:** Analytical, philosophical, neutral (don't present one side as consensus).

  2.  **Drafting - Step 1: Identify Interpretations:**
      *   *Descriptive/Predictive:* If you don't conform, X happens (stares, fines).
      *   *Prudential:* Conform to avoid hassle/maximize utility.
      *   *Fairness/Reciprocity:* You benefit from the system, so follow its rules.
      *   *Cultural Relativism:* Morality is local; no external standard.
      *   *Convention Authority:* The rule exists, therefore it binds (positivism).

  3.  **Drafting - Step 2: Evaluate Each:**
      *   *Descriptive:* True, but doesn't imply "ought."
      *   *Prudential:* Defensible, but contingent (sometimes breaking rules is fine).
      *   *Fairness:* Defensible for some things (queueing), less for others (tipping).
      *   *Relativism:* Contested philosophically; doesn't necessarily bind individuals.
      *   *Authority:* False/Contested; bad laws/conventions exist.

  4.  **Drafting - Step 3: Separate Settled vs. Contested:**
      *   Settled: Norms vary, visitors impact/is impacted by them.
      *   Contested: Source of obligation, moral weight of conventions.

  5.  **Drafting - Step 4: Write and Edit (watching word count):**

      *   *Settled:* Social conventions vary geographically; visitors interact with local systems.
      *   *Contested:* Whether these conventions generate moral obligations.

      *   *Interpretations:*
          *   **Descriptive Prediction:** "Locals will judge you." *True.* Supports conformity only if you care about judgment.
          *   **Prudential Advice:** "Avoid fines/conflict." *Defensible.* Supports conformity instrumentally, not morally.
          *   **Fairness/Reciprocity:** "You use their roads/services, follow their rules." *Defensible.* Strongest case for queueing/jaywalking; weaker for voluntary tipping.
          *   **Cultural Relativism:** "Right/wrong is local." *Contested/False.* Philosophically disputed; doesn't prove *you* must adopt local values.
          *   **Conventionalism:** "The rule exists, therefore it binds." *False.* Ignores welfare/justice (e.g., unjust laws).

      *   *Conclusion:* The proverb rarely proves a *moral* obligation. It mostly signals prudential risks or fairness claims, both of which are context-dependent.

  6.  **Review and Refine (Word Count Check):**
      *   Current draft looks okay. Need to ensure I explicitly mention the "settled vs contested" requirement clearly.
      *   Need to make sure I don't exceed 300 words.

      *   *Revision:*
          **Settled:** Conventions (tipping, crossing) vary by location; visitors affect and are affected by them.
          **Contested:** Whether local norms create moral obligations for outsiders.

          **Interpretations of "Do as Romans Do":**
          *   **Descriptive:** "Locals will stare/fine you." *True.* Trivial. Supports conformity only if you fear social sanction.
          *   **Prudential:** "Minimize friction." *Defensible.* Instrumental advice, not moral duty. Sometimes breaking norms (jaywalking safely) is utility-maximizing.
          *   **Fairness:** "Benefit from system, bear its costs." *Defensible.* Strong for public goods (traffic); weak for voluntary transfers (tipping).
          *   **Cultural Relativism:** "Morality is local." *Contested.* Most ethicists reject strong relativism. Even if true, it doesn't mandate *your* adherence.
          *   **Positivism:** "Rule exists = Rule binds." *False.* Conventions lack authority if harmful or coercive (e.g., exploitative tipping).

          **Verdict:** The proverb usually conflates prudential risk with moral obligation. It supports conformity only when local norms align with independent reasons (safety, fairness), not merely because they are local.

      *   *Word Count Check:* ~160 words. Good.
      *   *Requirements Check:* Bullet points? Yes. Under 300? Yes. Settled/Contested separated? Yes. Menu of options? Yes.

  7.  **Final Polish:** Ensure clarity on the "tipping/jaywalking" examples mentioned in the prompt. I included them in the draft. Make sure the distinction between settled and contested is clear.

      *   *Refining the "Settled/Contested" section:* Make it a header or distinct paragraph.
      *   *Refining the "Menu":* Ensure the "supports conclusion" part is clear for each.

      *   *Final Polish:*
          **Settled:** Social conventions vary; visitors interact with local systems.
          **Contested:** Whether proximity generates moral obligation.

          **Menu of Claims:**
          *   **Descriptive:** "Locals will judge/fine you." *True.* Trivial. Supports conformity only if you value approval/avoid penalties.
          *   **Prudential:** "Avoid conflict." *Defensible.* Instrumental, not moral. Sometimes violating norms (safe jaywalking) is rational.
          *   **Fairness:** "Take benefits, bear costs." *Defensible.* Strong for public order (traffic); weak for voluntary wages (tipping).
          *   **Cultural Relativism:** "Right/wrong is local." *Contested.* Philosophically disputed. Even if valid, doesn't prove *you* must adopt local values.
          *   **Conventionalism:** "Existence implies authority." *False.* Norms lack binding power if coercive or welfare-reducing.

          **Summary:** The proverb often conflates prudential risk with moral duty. It supports conformity only when local norms align with independent reasons (safety, reciprocity), not merely because they are local.

      *   *Word Count:* ~170 words. Perfect.

  8.  **Final Check against constraints:**
      *   Under 300 words? Yes.
      *   Bullet points ok? Yes.
      *   Separate settled/contested? Yes.
      *   Menu of interpretations? Yes.
      *   Evaluate trivial/defensible/false? Yes.
      *   Evaluate support for conclusion? Yes.

