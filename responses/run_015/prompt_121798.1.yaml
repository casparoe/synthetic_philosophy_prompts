answer: |-
  This is a classic dispute between the **conventionalist** view of speech acts (Maya) and the **moral/constitutive** view (Leo). Both are drawing from the same well of Ordinary Language Philosophy but drawing different buckets. Here is the move-by-move adjudication based on Austin, Searle, and subsequent speech act theory.

  ### Move 1: Maya's Performative Claim
  **Maya:** The utterance is performative; right formula + context = debt cleared. Feelings irrelevant.
  **Adjudication:** **Partially Right.**
  Maya is correct that apologies are illocutionary acts; saying "I apologize" under appropriate conditions *does* constitute the act of apologizing. Austin argues that performatives are not descriptions of inner states but actions in themselves. However, she is wrong that feelings are *irrelevant*. Austin explicitly lists "thoughts and feelings" as part of the felicity conditions. If you say "I promise" without intending to keep it, you have still promised (you are bound), but you have violated a condition.
  **What she misses:** She conflates the *existence* of the act with the *felicity* of the act. The social debt isn't automatically "cleared" just because the words were spoken; the act is merely *initiated*.

  ### Move 2: Leo's Austinian Distinction
  **Leo:** Austin distinguishes misfires from abuses. No remorse = abuse (hollow), not success.
  **Adjudication:** **Mostly Right.**
  Leo has the better textual grasp of Austin here. Austin categorizes infelicities into **Misfires** (the act is not achieved, e.g., a non-priest trying to baptize) and **Abuses** (the act is achieved but is hollow/insincere, e.g., promising without intent). Leo is correct that an apology without remorse is an **abuse** of the procedure. However, he risks implying the act *didn't happen*. For Austin, an abusive performative *does* happen—it is just infelicitous. Maya apologized, but she did so abusively.
  **What he misses:** He implies the act might be void (like a misfire). In Austin's framework, the insincere apologizer is still an apologizer, just a blameworthy one.

  ### Move 3: Maya's Coordination Argument
  **Maya:** Demanding verified sincerity breaks coordination. Analogy: Contracts under duress are binding.
  **Adjudication:** **Pragmatically Right, Theoretically Shaky.**
  Maya is correct about the *function* of language: social coordination often requires treating utterances as binding regardless of hidden mental states (the "objective" view of speech). However, her contract analogy fails legally and philosophically. Contracts signed under *duress* are often voidable precisely because the internal condition (volition) was violated. A better analogy would be a contract signed by someone who secretly intends to breach it; that contract is binding, but the person is in breach.
  **What she misses:** She treats the *social consequence* (coordination) as overriding the *constitutive rules*. While society may *act as if* the apology happened, the moral mechanism she relies on (discharging debt) jams if the sincerity condition is known to be false.

  ### Move 4: Leo's Moral Debt & Baptism Analogy
  **Leo:** Apologies discharge moral debt, requiring recognition. No recognition = Baptism without person (infelicity/misfire).
  **Adjudication:** **Philosophically Strong, Taxonomically Loose.**
  Leo identifies the core issue: apologies are not just transactional (like buying coffee); they are relational. He is right that the "sincerity condition" is essential to the *point* of the act. However, his baptism analogy is technically off according to Austin. A baptism without a person present is a **Misfire** (Type A: act not achieved). An apology without remorse is an **Abuse** (Type B: act achieved but insincere). Leo wants to upgrade insincerity to a misfire. Searle later supports Leo here by calling sincerity a "constitutive rule," implying that without it, the act is defective in a way that undermines its status.
  **What he misses:** He ignores that "defective" apologies still function socially. People accept hollow apologies all the time to move on. The act *works* perlocutionarily (tension drops) even if it fails illocutionarily (moral debt remains).

  ### Move 5: Maya's Institutional Facts vs. Leo's Deception Clause
  **Maya:** Searle says institutional facts depend on collective acceptance. If Leo accepts, the fact exists.
  **Leo:** Acceptance requires no deception on essential conditions. False premises = shared mistake, not fact.
  **Adjudication:** **Leo Wins this Round.**
  Maya invokes Searle's *Construction of Social Reality*, where $X$ counts as $Y$ in context $C$ because we agree. She argues Leo's refusal to accept breaks the agreement. However, Leo's counter is devastatingly accurate to Searle's later work. Institutional facts (like money, marriage, or apologies) rely on **constitutive rules**. If you print fake money that looks real, and people accept it, it is still not money—it is a successful counterfeit. If Maya simulates the *signs* of remorse without the *state* of remorse, and Leo finds out, the institutional fact collapses because the constitutive conditions were not met, only mimicked.
  **What they both miss:** They are treating "Institutional Fact" as binary (exists/doesn't exist). In reality, speech acts exist on a spectrum of **uptake**. An apology is a bid for forgiveness. If the hearer rejects the bid *because* they detect insincerity, the illocutionary act fails to secure its perlocutionary goal.

  ### What They Are Missing About the Interaction
  Both friends are treating Speech Act Theory as a rulebook for a board game, but they are missing the **dynamic interplay between convention and intention.**

  1.  **Maya misses that conventions rely on trust.** Institutional facts (like "an apology occurred") are sustained by a background assumption of sincerity. If speakers routinely abuse the procedure without consequence (as Maya suggests), the institution itself devalues. The "currency" of the apology inflates and becomes worthless.
  2.  **Leo misses that rituals have independent power.** Even a "hollow" apology changes the conversational score. It publicly admits fault, which shifts the normative landscape even if the moral repair is incomplete. He wants the internal state to dictate the external reality, but language often works the other way: the external act constrains the internal state (e.g., cognitive dissonance often forces the apologizer to *become* remorseful after speaking).

  ### Summary
  Maya is right that the *label* "apology" sticks to the utterance regardless of feelings (Austin's Abuse). Leo is right that the *moral function* of the apology fails without those feelings (Searle's Constitutive Rules). Maya wins on the sociology of language; Leo wins on the philosophy of action.

  Verdict: Leo wins the theory, Maya wins the dinner.
