prompt: |-
  My friend and I were argueing about speech acts last week, and then at dinner Maya and Leo got into a whole thing over an apology Maya made to him. She'd eaten his leftover pasta, said "I'm sorry, I shouldn't have done that," and he told her she wasn't actually remorseful, just tired of the tension. She said the utterance itself is performative -- like Austin's idea -- so once she said the right formula in the right context the social debt was cleared, and her private feelings are irrelevant. (1) He pushed back: Austin distinguishes misfires from abuses, and going through the motions without the requisite mental state is an abuse, not a fully successful performative. An apology with no remorse is hollow. (2) She replied that if we demanded verified sincerity for every apology we'd never coordinate socially; it's like arguing a contract signed under duress isn't binding, but legally it still is. (3) He said contracts and apologies have different mechanisms: contracts create obligations regardless of inner state, but apologies discharge moral debt, which requires actual recognition of wrongdoing. Without that recognition it's like trying to baptise someone who isn't present -- an infelicty, not just an insincere success. (4) Maya brought up Searle: institutional facts depend on collective acceptance, not private mental states. If Leo accepts her words, then the institutional fact "Maya apologized" exists, and his refusal to accept is what's breaking the social contract, not her lack of remorse. (5) Leo said collective acceptance still requires participants aren't decieved about essential conditions. In baptism the priest needs authority; in apology the speaker needs to recognize the wrong. If she never actually recognized it, acceptance is based on false premises, so it's not a genuine institutional fact, just a shared mistake. They kept going and asked me to referee since I'd just been talking about this stuff with my friend. Can you go through their exchange move by move and say who's right at each step -- not just who wins overall? What's each one missing about how performatives and institutional facts actually interact? Please end with a line that says Verdict: [short phrase].
