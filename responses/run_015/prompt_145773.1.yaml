answer: |-
  ### The Problem: Functional Overdetermination and Semantic Conflict

  Standard objections to teleosemantics (like the "fly vs. black dot" problem) usually focus on **extensional indeterminacy**: the evolutionary history is too coarse-grained to pin down exactly which environmental feature the mechanism was selected to track. The standard teleosemantic reply is often to appeal to "Normal Conditions" to narrow the content.

  However, a deeper conceptual issue arises from **functional overdetermination**. This occurs when a single cognitive mechanism has been preserved by natural selection for *two distinct reasons*, each implying a different Proper Function, which in turn assigns *incompatible truth conditions* to the same mental token. This is not merely a vague boundary problem; it is a clash of semantic kinds.

  Here is a concrete case illustrating how this forces teleosemantics to import an interpretive layer, undermining its claim to hard naturalization.

  ---

  ### The Case: The Primate "Direct-Gaze" Mechanism

  Consider a specific neural circuit in a macaque monkey, State $M$, which is triggered by the visual perception of a large, forward-facing pair of eyes (a "direct stare"). When $M$ activates, it triggers a cascade of physiological responses: increased cortisol, freezing behavior, and averting one's own gaze.

  #### 1. The Dual Evolutionary History
  Teleosemantics defines the content of $M$ by its **Proper Function**—what the mechanism was selected to do in the evolutionary past. In this case, the phylogenetic record suggests two distinct selection pressures that maintained $M$ in the gene pool:

  *   **Function A (Predator Avoidance):** For millions of years, $M$ allowed ancestors to detect leopards and eagles. A direct stare from a predator indicates imminent attack.
      *   *Proper Function:* Indicate the presence of a lethal predator.
      *   *Assigned Content:* **"A lethal threat is present."**
  *   **Function B (Social Hierarchy):** For the last few million years, $M$ allowed ancestors to navigate dominance hierarchies. A direct stare from an alpha male indicates a challenge to rank.
      *   *Proper Function:* Indicate a dominance challenge from a conspecific.
      *   *Assigned Content:* **"An alpha is asserting rank."**

  #### 2. The Semantic Clash
  The problem arises when we evaluate the truth conditions of $M$ in a specific scenario. Suppose a subordinate monkey encounters a dominant alpha male who is posturing to assert rank but has **no intention of attacking** (a common social ritual). State $M$ fires.

  *   **If Content is A ("Lethal Threat"):** The representation is **False**. The alpha is not a predator, and there is no lethal threat. The mechanism is misrepresenting the world, even though the behavior (submission) is adaptive.
  *   **If Content is B ("Dominance Challenge"):** The representation is **True**. The alpha is indeed asserting rank. The mechanism is accurately tracking the social environment.

  Teleosemantics requires that a mental state have a determinate content to have determinate truth conditions. But the biological history provides **two equally valid Proper Functions**. There is no biological "fact of the matter" that prioritizes the predator-avoidance lineage over the social-ranking lineage (or vice versa). Both contributed causally to the reproductive success of the ancestors who possessed $M$.

  #### 3. Why Disjunctive Content Fails
  A common teleosemantic defense against indeterminacy is to propose a disjunctive content (e.g., "Predator OR Alpha"). However, this fails to resolve the overdetermination problem for two reasons:

  1.  **Downstream Incompatibility:** The physiological consumers of $M$ may need to distinguish these cases eventually. A "lethal threat" requires a fight-or-flight adrenaline spike (sympathetic nervous system). A "dominance challenge" requires a submission/cortisol response (often involving stress inhibition of aggression). If $M$ carries the content "Predator OR Alpha," the downstream systems cannot know which physiological profile to instantiate based on the content alone. The content must be specific to guide the specific adaptive response.
  2.  **Divergent Normal Conditions:** Millikan's theory relies on "Normal Conditions" under which the Proper Function is performed.
      *   Normal Conditions for Function A require the object to be *non-conspecific*.
      *   Normal Conditions for Function B require the object to be *conspecific*.
      *   These conditions are mutually exclusive. A single token of $M$ cannot be operating under both sets of Normal Conditions simultaneously.

  ### The Threat to Naturalization

  This is where the naturalization project stalls. Teleosemantics was designed to eliminate the need for an **interpretive layer**. It sought to make mental content a brute biological fact, like digestion or circulation, independent of any observer's perspective.

  However, in cases of functional overdetermination:

  1.  **Biology is Silent:** The biological history alone does not dictate which Proper Function is the *semantic* one. Both are biologically real.
  2.  **Theory Requires Choice:** To assign a content, the theorist must decide whether to prioritize the older evolutionary function (Predator) or the more recent one (Social). Or, they must decide based on which function is currently more relevant to the organism's survival *in this context*.
  3.  **Reintroducing Interpretation:** Making that decision requires an **interpretive stance**. We, the theorists, must *interpret* the monkey's situation to decide if $M$ is functioning as a predator detector or a rank detector. We are effectively saying, "Given the context, it makes sense to treat this as a social signal."

  This reintroduces the very thing teleosemantics sought to eliminate: **content as dependent on an interpreter's attribution.** If the content of $M$ is not fixed solely by the internal history and structure of the organism, but requires an external agent to resolve the conflict between competing Proper Functions, then mental content is not fully naturalized. It remains partially constitutive upon the theoretical framework used to describe the organism.

  ### Conclusion

  The "Direct-Gaze" case shows that functional overdetermination creates a **semantic contradiction** that biology cannot resolve. When two Proper Functions assign incompatible truth conditions to the same token, teleosemantics cannot identify *the* content without appealing to contextual relevance or theoretical utility. This forces the theory to concede that mental content is not a hard biological invariant, but rather a description that relies on an interpretive layer to resolve evolutionary conflicts. Thus, the promise of a purely naturalistic semantics is compromised not by misrepresentation, but by the biological reality of multifunctional mechanisms.
