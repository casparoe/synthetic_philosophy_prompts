      *   Key mechanism: Proper Function (Millikan, Papineau, etc.).
      *   Standard Problem: Indeterminacy (what exactly was selected for?).
      *   Target Problem: *Conflict* between two equally valid proper functions that imply *different* truth conditions.

  3.  **Develop the Concrete Case:**
      *   *Suggestion:* Threat-detection vs. Social-ranking.
      *   *Scenario:* A primate sees a specific facial expression or posture in another primate.
      *   *Mechanism:* A neural circuit triggering a specific emotional/behavioral response (e.g., submission/fear).
      *   *Function 1 (Ecological/Threat):* Detect a predator or aggressive rival. Content: "Danger/Predator present."
      *   *Function 2 (Social/Ranking):* Detect a dominance signal from an alpha. Content: "Alpha is asserting rank."
      *   *The Clash:* Why are these incompatible?
          *   If Content = "Danger," the truth condition is satisfied by a leopard.
          *   If Content = "Dominance Signal," the truth condition is satisfied by a playful alpha (no actual danger).
          *   If the mechanism fires for *both*, which content is the *real* content?
      *   *Refining the Clash:* It needs to be stronger than just "two things." It needs to be that the *conditions for success* differ.
          *   Success for Threat: Avoid death.
          *   Success for Social: Maintain group cohesion/hierarchy.
          *   Crucially: A false positive in one might be a true negative in the other, or vice versa.
          *   Better angle: The *response* is the same (submit/flee), but the *world state* required to make the representation true differs.
          *   Let's try a specific signal: A "stare."
          *   Function A: Detect a predator looking at me. (Content: "I am being hunted.")
          *   Function B: Detect a dominant male challenging me. (Content: "I am being challenged for rank.")
          *   *Overdetermination:* The mechanism evolved because it served *both* lineages of survival.
          *   *Incompatibility:* If I submit to a predator, I die (wrong response for Content A). If I submit to a dominant male, I live (right response for Content B). Wait, if the response is the same, the content determines the *truth conditions*.
          *   Let's focus on the *Truth Conditions*.
          *   Content A: $\exists x (Predator(x) \land LookingAt(x, Me))$
          *   Content B: $\exists y (Dominant(y) \land Challenging(y, Me))$
          *   Scenario: A dominant male who is *not* dangerous (just posturing) triggers the state.
          *   If Content is A: Representation is False (He's not a predator).
          *   If Content is B: Representation is True (He is challenging).
          *   Teleosemantics says content is fixed by selection history. If selection history supports *both* equally, content is indeterminate *between two distinct propositions*, not just vague.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Define the specific teleosemantic problem. It's not "is it a fly or a shadow?" (indeterminacy of reference), it's "is it a threat or a handshake?" (indeterminacy of *kind* due to dual selection pressures).
      *   *The Case:* The "Submissive Crouch" mechanism in a macaque.
      *   *Mechanism:* Visual input (looming shape + direct gaze) $\rightarrow$ Neural State $N$ $\rightarrow$ Behavior (Crouch/Look Away).
      *   *History 1 (Predator Avoidance):* $N$ was selected because it detected leopards. Proper Function: Indicate Leopard. Content: "Predator."
      *   *History 2 (Social Hierarchy):* $N$ was selected because it detected Alpha aggression. Proper Function: Indicate Dominance Challenge. Content: "Alpha Challenge."
      *   *The Conflict:*
          *   Case: Alpha male postures (no intent to kill, just rank). $N$ fires.
          *   If Content = "Predator": Representation is False. Behavior (cowering) is adaptive (better safe than sorry), but the *semantic evaluation* is False.
          *   If Content = "Dominance": Representation is True. Behavior is adaptive.
          *   Teleosemantics relies on the "Normal Conditions" for the performance of the Proper Function.
          *   If *both* are Proper Functions (exaptation or dual selection), which Normal Conditions apply?
      *   *The Naturalization Threat:* To decide which content is real, we can't look at the biology alone (both are biologically real). We have to ask: "What is the agent *doing*?" This requires an interpretive stance (Dennett-style) rather than a hard biological fact. We have to *interpret* the context to fix the content, which violates the hard naturalist goal of teleosemantics (content should be in the head/history, not the interpreter's view).

  5.  **Refining the "Incompatibility":**
      *   Why is this worse than standard indeterminacy? Standard indeterminacy (Fly vs. Black Dot) usually allows a disjunctive content ("Fly-or-Dot") that saves the theory.
      *   Here, a disjunctive content ("Predator-or-Alpha") fails because the *conditions for satisfaction* regarding the *response* differ.
      *   Actually, a stronger clash is needed.
      *   Let's look at the *consumer* system. The consumer system uses $N$ to guide action.
      *   If $N$ means "Predator," the consumer system prepares for mortal combat/fleeing.
      *   If $N$ means "Social Challenge," the consumer system prepares for submission ritual.
      *   If the behavior is identical (freeze/crouch), the *downstream* implications differ.
      *   *Key Point:* The "Normal Condition" for the Predator function requires the object to be lethal. The "Normal Condition" for the Social function requires the object to be a conspecific.
      *   If a conspecific triggers it, the Predator function is malfunctioning (false positive), but the Social function is working.
      *   If a leopard triggers it, the Social function is malfunctioning (wrong category), but the Predator function is working.
      *   Since the mechanism is *one* token, it cannot have two contradictory truth conditions simultaneously without violating the law of non-contradiction in the semantics. Teleosemantics needs *one* proper function to fix *one* content. If evolution selected for *both* equally, there is no biological fact of the matter to pick one.

  6.  **Addressing the "Interpretive Layer" Constraint:**
      *   Teleosemantics wants content to be like digestion: a fact about the organism, not the observer.
      *   If biology gives us two equal proper functions, we (the theorists) have to *choose* which one counts as "the" content based on context or utility.
      *   This reintroduces the "Interpretation" (like Davidson or Dennett) that teleosemantics (Millikan/Papineau) explicitly rejected. It makes content mind-dependent (on the theorist's mind), not world-dependent.

