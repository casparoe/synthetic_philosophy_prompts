prompt: |-
  Give an example of a conceptual issue in teleosemantics where the problem isn't standard misrepresentation but something like functional overdetermination — where a cognitive mechanism's evolutionary history points to two proper functions that assign incompatible contents to the same mental token. Don't just rehearse the indeterminacy objection; show why this particular kind of pull-apart makes it hard to keep mental content fully naturalized without importing some intepretive layer that teleosemantics was supposed to eliminate. Use a concrete case: maybe a threat-detection response that also serves social-ranking, and spell out exactly how the two functions clash in assigning specifc content.
