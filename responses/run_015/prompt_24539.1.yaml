  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Topic:** US Nuclear Umbrella (Extended Deterrence).
      *   **Core Problem:** The tension between rationality and credibility.
      *   **Specific Paradox:** To deter, the US must appear willing to risk NYC for Berlin/Seoul (seemingly irrational/self-sacrificing), but the adversary must also believe the US is rational enough not to start a nuclear war over nothing.
      *   **Key Questions:**
          1.  What view of rationality/commitment underpins the doctrine?
          2.  Is it about costly commitment (tying hands) or feigned irrationality?
          3.  Does it make allies safer or just shift risk?
          4.  Do the pieces fit together (coherence)?

  2.  **Initial Analysis & Theoretical Framework:**

