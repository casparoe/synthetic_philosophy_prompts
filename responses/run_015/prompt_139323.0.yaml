      *   *Rashomon:* Four contradictory accounts of a death/rape. Plus a framing device (the gate). Plus an epilogue (the baby).
      *   *The Tension:* Jainism values *honest* partiality. *Rashomon* features *dishonest* totality (lying to save face).
      *   *The Solution:* Distinguish between *naya* (valid partial standpoint) and *durnaya* (false/pseudo standpoint). Jain logic *does* have resources for this. A lie isn't a "side" of the truth; it's an obstruction. However, the *motivation* for the lie reveals a psychological truth (the "side" of human shame).
      *   *The Dead Husband:* Mediumship complicates things. Is it a "standpoint" from beyond? Or just another projection of the living?
