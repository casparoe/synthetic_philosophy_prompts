      *   *Is the "Three Questions" distinction standard?* It resembles the distinction between *extension*, *intension*, and *phenomenology*. I should acknowledge that while the distinction is helpful, the theories often claim that answering Q3 *automatically* answers Q1. That's part of the friction.
