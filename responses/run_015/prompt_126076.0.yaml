  ### The track record so far

  Looking at Ms. Chen's previous verdicts, a clear pattern emerges regarding what she considers 'original' mental content versus mere mechanism. She grants genuine content to biological systems with an evolutionary history and a functional architecture, such as the frog (even in reflex) and the dreaming human, allowing for the possibility of misrepresentation. Conversely, she denies original content to artifacts and purely mechanical systems like the thermostat, the broken calculator, and the language model, categorising them as having either derived content or no content at all. The Venus flytrap is an interesting boundary case; despite being biological, she dismisses it as 'just chemistry', suggesting that evolutionary history alone might not be sufficient without a specific kind of functional consumer system, likely a nervous system. Crucially, her distinction between the broken calculator (malfunction) and the frog (misrepresentation) signals that she believes a system must have a 'proper function' to represent truth before it can be said to misrepresent.

  ### The competing rules

  The strongest candidate for her hidden rule is **Evolutionary Teleosemantics**. This theory posits that genuine mental content depends on a history of natural selection establishing a 'proper function' for a state. This fits her verdicts perfectly: the frog's snap has a selected function (catching flies), so it can misrepresent; the thermostat and LLM lack evolutionary history, so they only have derived content or none; and the broken calculator isn't misrepresenting because it isn't performing its selected function at all. The Venus flytrap might be excluded here if she holds that plants lack the specific cognitive architecture required for 'mental' states, or if she views their mechanisms as purely chemical rather than functional in the teleological sense. Under this rule, the synthetic bacterium fails because it was engineered, not selected by nature.

  A competing rule that also fits most of the data is **Consumer Semantics**. This view argues that a signal only has content if there is an internal 'consumer' system that uses that signal to guide behaviour or survival. This explains the frog (the brain/muscles consume the visual signal) and the Venus flytrap (perhaps viewed as lacking a distinct consumer system separate from the chemical reaction). It also excludes the thermostat and LLM, as their outputs are not consumed by an internal biological system for survival. However, this rule differs from Teleosemantics on the source of the function: Consumer Semantics cares about current use, whereas Teleosemantics cares about historical selection. Both rules would likely treat the engineered bacterium similarly to the thermostat, but for slightly different reasons regarding the source of its 'function'.

  ### Prediction for the biosensor

  Ms. Chen will almost certainly rule that the synthetic bacterium is like the thermostat: it has only derived content, not genuine original content, and therefore cannot genuinely misrepresent. Since the bacterium was engineered in a lab with no evolutionary history, it lacks the 'proper function' established by natural selection that Evolutionary Teleosemantics requires for original intentionality. Its 'purpose' to detect arsenic is imposed by the scientists (derived), not selected by nature (original). Consequently, when it glows for phosphate, it is not misrepresenting the world in a mental sense; it is merely exhibiting a causal error in a designed mechanism, much like the thermostat reacting to the wrong temperature source or the calculator malfunctioning. She will likely argue that without a history of selection, there is no normativity to ground a claim of misrepresentation.

  ### The tie-breaker case

  To distinguish between Evolutionary Teleosemantics and Consumer Semantics, you should propose a case involving a biological organism with a novel, useful trait that has not yet been selected for. For example: 'A bird mutates randomly to sense magnetic fields and immediately uses this sense to navigate successfully, though the trait has no evolutionary history.' An Evolutionary Teleosemanticist (like Ms. Chen appears to be) would say this bird has no genuine content yet, whereas a Consumer Semanticist would say it does, because the internal system is successfully using the signal.
