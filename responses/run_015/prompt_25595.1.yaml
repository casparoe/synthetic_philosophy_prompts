answer: |-
  First, I want to acknowledge that you are dealing with a incredibly difficult and painful situation. Trying to find a philosophical framework to help process blame and responsibility regarding a loved one's addiction is a very human response, but it is also fraught with complexity.

  Your intuition that your friend's argument moves "too quickly" is spot on. While your friend has correctly identified one of the most famous arguments in modern philosophy, their summary of its implications—and the state of the debate—is significantly oversimplified.

  Here is a breakdown of what is right, what is wrong, and how this actually applies (or doesn't) to your brother's situation.

  ### 1. What Your Friend Got Right
  Your friend is correct about the basics of the **Frankfurt Case** (proposed by Harry Frankfurt in 1969).
  *   **The Target:** It was designed to attack the **Principle of Alternative Possibilities (PAP)**. PAP states: *A person is morally responsible for what they have done only if they could have done otherwise.*
  *   **The Intuition:** Most people agree with your friend that "Jones" seems responsible in the story. Since Jones couldn't have done otherwise (due to the chip) but still seems responsible, PAP appears to be false.
  *   **The Popularity:** It is true that **Compatibilism** (the view that free will/responsibility is compatible with determinism) is the majority view among professional philosophers today. (According to the 2020 PhilPapers survey, about 59% of philosophers lean compatibilist, while 30% lean incompatibilist).

  So, on the surface, your friend isn't making things up. But the devil is in the details.

  ### 2. The Big Oversimplification: "Leeway" vs. "Sourcehood"
  The jump your friend makes—from "PAP is false" to "Determinism is no threat"—is where the argument breaks down.

  When Frankfurt showed that you don't need *alternative possibilities* (the ability to do otherwise) to be responsible, he defeated a specific version of Incompatibilism called **Leeway Incompatibilism**.

  However, most sophisticated Incompatibilists (those who think determinism kills responsibility) simply shifted their ground. They now argue that alternative possibilities aren't the main point. The main point is **Sourcehood**.

  *   **The Sourcehood Objection:** Even if Jones didn't need the ability to do otherwise, he still needed to be the *ultimate source* of his action. In the Frankfurt case, Jones's decision flows from his own character and desires. But in a **deterministic universe**, your desires and character are the result of genetics and environment stretching back before you were born.
  *   **The Problem:** If determinism is true, *you* didn't choose your desires; the Big Bang and the laws of physics did. Frankfurt cases show you don't need *options*, but they don't show you are the *author* of your actions in a deterministic world.

  So, when your friend says, "Determinism is no threat... as long as we act on our own desires," a skeptic would reply: "But in a deterministic world, where did those desires come from? If I didn't choose them, how am I responsible?" Frankfurt cases do not answer this.

  ### 3. Is It "Settled"?
  Your friend claimed this is "basically settled." In philosophy, almost nothing is settled.
  *   **Flicker Strategies:** Some philosophers argue that in Frankfurt cases, there *are* still tiny alternative possibilities (e.g., Jones could have hesitated, or shown a "sign" of deciding otherwise), which keeps PAP alive in a modified form.
  *   **Source Incompatibilism:** As mentioned above, many philosophers (like Derk Pereboom or Robert Kane) argue that Frankfurt cases fail to address the deeper worry about causal determination.
  *   **Semicompatibilism:** Some, like John Martin Fischer (a leading expert on this), argue that Frankfurt cases prove we don't need alternative possibilities for *moral responsibility*, but we might still need them for *free will*. This splits the concepts in a way your friend didn't mention.

  ### 4. The Crucial Issue: Addiction vs. Frankfurt Cases
  This is the most important part for your personal situation. Applying Frankfurt cases to addiction is philosophically risky because the scenarios are structurally different.

  **In the Frankfurt Case:**
  *   Jones acts exactly according to his **own desires**.
  *   He wants to vote for the candidate.
  *   The chip is a backup that never turns on.
  *   **Key:** His agency is intact. He is doing what he wants to do.

  **In Addiction:**
  *   Addiction often involves **compulsion** or **akrasia** (weakness of will).
  *   Many addicts act *against* their own deeper desires (they want to be sober, but use anyway).
  *   The "chip" in addiction isn't a backup that stays off; it is an active neurological hijacking that *does* turn on.
  *   **Key:** Agency is often compromised.

  If you use the Frankfurt argument to blame your brother, you are assuming his addiction is like Jones's vote: that he is acting on his true, uncoerced desires. But if his addiction compromises his ability to align his actions with his values, the Frankfurt case doesn't apply.

  Conversely, if you use it to excuse him, you might be ignoring that he still has *some* agency. Most modern views on addiction responsibility suggest a middle ground: addiction reduces control and culpability, but rarely eliminates it entirely.

  ### 5. Summary for Your Situation
  If you were to sit down with a philosopher who specializes in free will and moral responsibility, here is what they would likely tell you:

  1.  **Your intuition is correct:** The move from "Frankfurt cases refute PAP" to "Determinism is harmless" is invalid. Determinism raises problems about *sourcehood* that Frankfurt cases do not solve.
  2.  **The consensus is not settled:** While Compatibilism is popular, the debate is vibrant and unresolved.
  3.  **Be careful with the analogy:** Your brother's situation involves psychological compulsion and disease, not a philosophical thought experiment about voting. The relevant question isn't "Could he have done otherwise?" but rather "To what extent was his capacity for rational control impaired?"
  4.  **Philosophy might not give the answer you want:** Philosophy can clarify *what* we mean by responsibility, but it cannot tell you *how much* to blame your brother. That is a question of ethics, psychology, and family dynamics, not just metaphysics.

  **The Verdict:** Your friend gave you a "Philosophy 101" summary that holds up in an introductory lecture but falls apart under scrutiny. It is understandable why you want a clean framework to help you process your hurt, but relying on this specific argument might lead you to a conclusion that feels intellectually shaky or emotionally unsatisfying.

  It is okay to hold two thoughts at once: that your brother is struggling with a disease that limits his choices, *and* that his actions have real consequences that you are allowed to be hurt by. You don't need Frankfurt to validate that complexity.
