answer: |-
  This is a fantastic set of intuitions to unpack. You are effectively navigating the debate between **rationalist monism** (there is always one right answer) and **moral pluralism** (values can genuinely clash).

  Your intuitions are not random; they cluster around a specific, defensible principle, but you have identified two genuine friction points (the Source of Conflict and the Nature of Regret).

  Here is an analysis of your pattern, a proposed unifying principle, the verdict on your overdetermination case, and the falsification conditions you asked for.

  ### 1. The Unifying Principle: Rational Resolvability via Lexical Hierarchy

  Your four cases are consistent if we adopt the principle of **Rational Resolvability**.

  *   **Genuine Dilemma:** A situation where two obligations clash, and there is **no higher-order principle** to rank them. The values are incommensurable or equal.
  *   **Hard Choice (Not a Dilemma):** A situation where two obligations clash, but a **higher-order principle** decisively ranks one over the other.

  Here is how this saves your four cases:

  *   **Case 1 (Sophie):** **Dilemma.** Life vs. Life. There is no moral calculus that makes Child A's life objectively more valuable than Child B's. No lexical hierarchy exists. (Fits your intuition).
  *   **Case 2 (Trolley):** **Not a Dilemma.** You implicitly accept a utilitarian or "minimize harm" hierarchy. 5 lives > 1 life. The conflict is rationally resolvable. (Fits your intuition).
  *   **Case 3 (Judge):** **Not a Dilemma.** You view the "Rule of Law" or "Professional Role" as lexically superior to "Personal Friendship" in this context. The system provides the tie-breaker. You classify this as "structural" because the *resolution* is dictated by the institution, not your personal moral weighing. (Fits your intuition).
  *   **Case 4 (Promises):** **Dilemma.** Professional Duty vs. Parental Duty. You intuitively feel neither automatically trumps the other. There is no meta-rule that says "Kids always win over Colleagues." (Fits your intuition).

  **Resolving Tension 1 (Source of Conflict):**
  You asked: *Why treat Case 3 (Law) and Case 4 (Calendar) differently if both are "outside"?*
  **Answer:** It isn't about whether the constraint is external (calendar vs. statute); it is about whether the external constraint provides a **tie-breaking rule**.
  *   In Case 3, the Law *tells you* how to resolve the conflict (sentence the friend).
  *   In Case 4, the Calendar *creates* the conflict but offers no rule on which promise to break.
  *   **Principle:** A conflict is only a dilemma if the agent must supply the resolution. If the system supplies the resolution, it is a structural tragedy, not a moral dilemma.

  **Resolving Tension 2 (Regret):**
  You asked: *If regret marks a dilemma, why shouldn't I regret doing the right thing?*
  **Answer:** You need to distinguish **Guilt** from **Agent-Regret** (a la Bernard Williams).
  *   **In Hard Choices (Trolley/Judge):** You did the *obligatorily right* thing. Guilt is irrational. Sadness is appropriate, but "I shouldn't have done that" is false.
  *   **In Genuine Dilemmas (Sophie/Promises):** You violate a binding obligation even when choosing the "best" path. This leaves a **Moral Remainder**. Agent-regret is rational here *not* because you chose wrongly, but because the world required you to violate a value you uphold.
  *   **Fix:** Your intuition that "if you identify the stronger obligation... you shouldn't feel regret" applies only to *Hard Choices*. In *Genuine Dilemmas*, there is no "stronger" obligation, only a tragic choice. Regret is the appropriate response to the remainder.

  ### 2. The Overdetermination Case

  **The Case:** Two obligations point to Action A. Obligation 1 is real. Obligation 2 rests on a false belief you do not share.
  **Verdict:** **Not a Dilemma.**

  **Reasoning:**
  Under the **Rational Resolvability** principle, a dilemma requires two *binding* normative forces.
  *   If you do not share the false belief, Obligation 2 has no normative force *for you*. It is a phantom obligation.
  *   You are effectively acting on Obligation 1. There is no conflict in your deliberative field.
  *   **Prediction:** You should feel no agent-regret regarding the "lost" obligation, because it never existed for you. An observer might think you faced a dilemma, but subjectively, you did not.

  **Nuance:** If you *did* share the false belief (Subjective Dilemma), then for all practical purposes, it *is* a dilemma for you, even if objectively it isn't. But based on your description ("false belief I don't share"), the conflict is illusory.

  ### 3. What Would Change My Mind? (Falsification Conditions)

  If I were arguing for this principle (and I think it best fits your teaching intuitions), here is where the reasoning is shakiest and what would force me to abandon it:

  **A. The "Judge" Intuition is the Weak Link**
  *   **Challenge:** Many ethicists (e.g., Natural Law theorists or thick virtue ethicists) would argue Case 3 *is* a genuine dilemma. They would say sentencing an innocent friend *always* leaves a moral remainder, regardless of the law. The law might justify the action legally, but not morally.
  *   **Falsification:** If you can be convinced that a Judge *should* feel agent-regret (not just sadness) after sentencing the innocent friend, the **Rational Resolvability** principle collapses. It would mean that institutional rules cannot dissolve moral dilemmas, only mask them. If Case 3 becomes a Dilemma, the distinction between "Structural" and "Personal" vanishes.

  **B. The "Trolley" Intuition is Culturally Contingent**
  *   **Challenge:** Your classification of Case 2 relies on the premise that "1 < 5" is a decisive moral trump. Deontologists argue that *killing* vs. *letting die* is incommensurable.
  *   **Falsification:** If you encounter a robust deontological argument that pulling the lever violates a duty that cannot be traded for utility, Case 2 becomes a Dilemma. If Case 2 is a Dilemma, then "Rational Resolvability" is no longer the dividing line, and we must look for a different principle (perhaps "Direct Harm" vs. "Indirect Harm").

  **C. The "Regret" Loop**
  *   **Challenge:** You noted the inconsistency: *Regret marks a dilemma, but doing right precludes regret.*
  *   **Falsification:** If you find a case where an agent does the clearly right thing (e.g., Trolley) and feels profound agent-regret, and we agree that this regret is **rational** (not just psychological noise), then the link between "Dilemma" and "Regret" is broken. Regret might just be a feature of agency in a tragic world, not a diagnostic tool for dilemmas.

  ### Summary for Your Teaching

  You can present this to your students as a move from **Conflict** to **Incommensurability**.

  1.  **Conflict** is common (Case 2, 3, 4).
  2.  **Dilemma** is rare. It only occurs when the conflict cannot be resolved by a higher-order rule (Case 1, 4).
  3.  **Regret** is the emotional residue of a Dilemma. If you resolve a conflict using a rule (Case 2, 3), you may feel sadness, but not the specific moral regret of having violated a binding duty.

  **Your Principle:** *A genuine moral dilemma exists if and only if the agent faces conflicting obligations that cannot be rationally ranked by a shared higher-order principle.*

  This saves your intuitions, explains the Judge/Promise distinction (Hierarchy vs. No Hierarchy), and clarifies the Regret tension (Remainder vs. Resolution).
