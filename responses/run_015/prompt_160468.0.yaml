  **MEMORANDUM**

  **TO:** Board of Directors, Regional Transit Authority
  **FROM:** [Your Name], Board Member
  **DATE:** May 15, 2024
  **SUBJECT:** Capital Budget Prioritization and Statutory Interpretation

  **Recommendation**
  I recommend the Board vote in June to fund the Harborview Grade Separation ($186 million) and defer the Wayfinding and Access Program. Given our $190 million capital budget, we cannot fund both. While staff recommend Wayfinding based on their Quality-Adjusted Burden Hours (QABH) metric, this approach conflicts with our enabling statute, which instructs us to "give priority to the reduction of fatal and life-altering harm."

  To resolve this and guide future budgets, I propose adopting a **Severity Threshold Policy**. This policy establishes a concrete rule for staff to apply next cycle without returning for interpretation.

  **The Severity Threshold Policy**
  This policy answers three critical questions regarding how we evaluate projects.

  *First, regarding the statutory priority clause:* This clause acts as an absolute priority, not a weighting factor. Projects preventing fatal or life-altering harm must be funded before projects optimizing aggregate comfort, regardless of the total burden hours involved. Staff should categorize projects into Tier 1 (Safety/Fatal) and Tier 2 (Comfort/efficiency). Tier 1 projects compete against each other; only after Tier 1 is fully funded do we maximize QABH within Tier 2. The Board sets the threshold definitions; staff apply them.

  *Second, regarding imperceptible harms:* We must distinguish between imperceptible *risks* of catastrophe and imperceptible *nuisances*. A one-in-ten-million chance of death is imperceptible to a traveler, yet statistically real. These risks aggregate to form "statistical lives saved" and belong in Tier 1. Conversely, a one-second delay is an imperceptible nuisance. Under this policy, burdens below a perceptibility threshold (e.g., delays under ten seconds) cannot be summed across different people to outweigh Tier 1 safety projects. However, repeated exposures to the same individual do sum toward that individual's burden score within Tier 2. We will not treat aggregated micro-annoyances as equivalent to fatal risks.

  *Third, regarding the aggregation objection:* Our board member, the health economist, correctly notes that preventing the Harborview deaths relies on aggregating imperceptible risks across millions of traverses. She argues that refusing to aggregate imperceptible burdens undermines our basis for aggregating imperceptible risks. While logically consistent in a vacuum, this ignores our statutory mandate. The statute distinguishes harm *types*, not just harm *probabilities*. We agree that statistical risks of death aggregate to justify safety spending. We disagree that aggregated minor annoyances equate to safety priorities. The statute requires us to correct salience bias only within the bounds of prioritizing life over convenience. We can value statistical lives without equating a year of collective waiting time to a human death.

  **The Rejected Position**
  The strongest argument against this recommendation is the staff's current utilitarian approach: maximize total welfare. If our goal were simply to reduce the sum total of human dissatisfaction, funding Wayfinding is correct. It relieves distress for 380,000 people daily. Deferring it causes real, cumulative frustration. The economist is right that rejecting aggregation invites inconsistency; if we count small risks of death, why not small units of pain? If the statute did not exist, or if the Harborview crossing posed negligible risk, I would support the staff's metric. It is efficient, transparent, and treats all rider time as equally valuable. There is genuine moral weight in relieving the daily friction of hundreds of thousands of commuters, and ignoring that aggregate suffering risks making the Authority unresponsive to the rider experience.

  **Conditions for Changing This Recommendation**
  I will change my vote under two conditions. First, if an independent audit reveals the Harborview fatality risk is significantly overstated (e.g., fewer than 0.5 deaths per decade), moving it below our safety threshold. Second, if staff can demonstrate a reduced-scope Wayfinding program under $4 million that captures 80% of the benefit, allowing us to fund both. Absent these findings, the statute compels us to choose safety over convenience. We must also ensure that Tier 2 projects are not neglected indefinitely; if Tier 1 needs are met for five years, surplus capital should automatically flow to high-scoring Tier 2 items.

  **Next Steps**
  I move that we adopt the Severity Threshold Policy immediately. Staff should re-rank the current capital slate using this tiered system by May 30. The June vote will proceed based on that revised ranking. This ensures compliance with our enabling legislation and provides a durable framework for future fiscal cycles.

  **Conclusion**
  We are not merely managers of rider comfort; we are stewards of public safety. The math of burden hours is useful, but it cannot override the law or the moral imperative to prevent death. By establishing this threshold, we protect the Authority from legal challenge and ensure our investments reflect the hierarchy of values our community expects. This rule allows staff to calculate efficiently while ensuring the Board retains control over the ethical boundaries of those calculations.
