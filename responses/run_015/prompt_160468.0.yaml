      *Refining the Economist point:* She argues that if we don't aggregate imperceptible burdens, we can't aggregate imperceptible risks. I need to counter this by distinguishing the *nature* of the outcome. A death is a distinct category from a delay, regardless of probability aggregation. The statute mandates this distinction.

      *Refining the Imperceptible Harms:* The prompt asks about "harms no individual can perceive." For the crossing, the risk per traverse is imperceptible. For wayfinding, the 90-second wait is perceptible. The 1-second irritation mentioned in the prompt ("removing a one-second irritation") is imperceptible. The rule needs to say: Imperceptible *burdens* do not aggregate to outweigh perceptible *risks* of severe harm. But imperceptible *risks* of severe harm DO aggregate to count as severe harm prevention.

