answer: |-
  **Project Title:** The Inheritance of Reasons: A Compositional Stress Test for Fitting-Attitude Accounts

  **Project Overview**
  Fitting-attitude (FA) accounts analyse value in terms of the reasons we have to adopt certain pro-attitudes towards an object. For example, to say something is admirable is to say there are reasons to admire it. The central difficulty for this view is the 'Wrong Kind of Reasons' (WKR) problem. As standardly illustrated by threat cases, a demon might give you a reason to admire him by threatening you if you do not. This is a reason for the attitude, but it does not make the demon admirable. To save the FA account, theorists must distinguish reasons of the 'right kind' (RKRs), which constitute value, from reasons of the 'wrong kind' (WKRs), which do not.

  Despite decades of debate, no consensus has emerged. The literature has proceeded atomistically, testing solutions against isolated attitudes like desire, belief, or admiration in isolation. This project identifies a structural blind spot in this approach. Many philosophically significant attitudes are arguably *composite*: hope is often analysed as desire plus uncertainty; regret as belief plus a counterfactual desire; blame as belief regarding agency plus a reactive emotion. If these attitudes are constituted by others, normative properties may interact across their constituents. Existing solutions to the WKR problem have not been tested for consistency across these compositional structures. This project proposes a 'compositional stress test' to determine whether, and how, the normative status of reasons transmits from constituent attitudes to composite ones.

  **The Research Question**
  The core question is the **Inheritance Question**: *When a reason of the wrong kind bears on a constituent attitude of a composite attitude, what normative status does it hold for the composite attitude?*

  There are three candidate answers:
  1.  **Transmission:** The wrong-kindness transmits upwards. A WKR for the desire constituent remains a WKR for the hope.
  2.  **Filtering:** Each attitude applies its own correctness conditions. A WKR for the constituent is blocked from counting as a reason for the composite.
  3.  **Transformation:** A WKR for a constituent can become an RKR for the composite (or vice versa) depending on the structural role the constituent plays.

  Current families of WKR solutions (object-given vs. state-given distinctions; explanatory role accounts; and attitude-relativist accounts) yield verdicts on atomic cases but have not been required to maintain consistency across composite structures. This project will determine which family of solutions can accommodate the Inheritance Question without contradiction.

  **Methodology and Work Plan**
  The project is divided into three phases over nine months.

  *Months 1–2: Taxonomy and Case Calibration*
  The primary risk to this project is the contestability of constitutive claims about attitudes (e.g., that hope *is* desire plus belief). I will not defend a specific philosophy of mind but will select a 'stable core' of composite attitudes widely accepted in the literature for the sake of the test. I will construct a calibrated set of threat cases targeting constituents (e.g., a threat to desire the outcome of a hope) versus targets of the composite. The output of this phase will be a fixed set of vignettes and a defined taxonomy of 'constituent' vs. 'composite' relations sufficient to run the test.

  *Months 3–5: The Stress Test*
  I will apply the three main families of WKR solutions to the calibrated cases.
  *   **Object/State-Given Accounts:** Do these distinguish the threat to the constituent from the threat to the composite?
  *   **Explanatory Accounts:** Does the reason figure in the correct explanation of the composite's fittingness if it only fits the constituent?
  *   **Relativist Accounts:** Can an attitude-relative solution handle the interaction without ad hoc adjustments?
  I will map the verdicts of each theory against the three candidate answers (Transmission, Filtering, Transformation).

  *Months 6–7: Evaluation and Implications*
  I will analyse which theories survive the stress test. A theory that yields inconsistent verdicts (e.g., Transmission for hope but Filtering for blame without principled distinction) will be marked as deficient. I will also assess the implications for FA accounts of value: if WKRs transmit, FA accounts may be more vulnerable to contamination than assumed; if they filter, the 'right kind' may be more robust.

  *Months 8–9: Writing and Dissemination*
  Drafting the dissertation and preparing two articles for submission. One article will focus on the Inheritance Question itself; the second on the comparative performance of WKR solutions.

  **Significance and Alternative Approaches**
  The obvious alternative is to generate further variants of atomic threat cases or to pursue a broader conceptual analysis of fittingness. This project is superior for two reasons. First, it avoids the diminishing returns of intuition-pumping on single attitudes, where theorists often dig in on conflicting intuitions. Second, it leverages an independent constraint of adequacy: whatever a WKR theory says about 'leakage' into a belief-constituent must not contradict the well-worked-out debate on pragmatic reasons for belief. This provides an external check on the coherence of WKR theories that atomic cases lack. By focusing on the *relations* between attitudes rather than the attitudes themselves, the project offers a diagnostic tool that discriminates between theories without requiring a new first-order principle of value.

  **Outcomes, Risks, and Failure Conditions**
  There are three positive outcomes: demonstrating that one family of solutions uniquely satisfies the compositional constraint; showing that all current families fail, necessitating a structural revision of the WKR debate; or establishing that the Inheritance Question admits no uniform answer, implying a fragmented normative landscape.

  However, I must state plainly the conditions under which this project would fail.
  1.  **Instability of Input:** The project assumes there is a stable set of composite attitudes (like hope or blame) whose constituents are identifiable. If, during Months 1–2, it becomes clear that the constitutive claims are too contested to serve as a fixed input (e.g., if 'hope' is rejected as a genuine composite in favour of a sui generis view), the test loses its traction. *Mitigation:* I will prepare a secondary taxonomy focusing on 'entangled' attitudes rather than strictly constitutive ones, though this weakens the theoretical leverage.
  2.  **Baroque Complexity:** If the cases required to test the inheritance become too complex for reliable intuitive verdicts, the data will be unusable. *Mitigation:* I will restrict the case-set to simple threat structures, accepting less coverage for higher reliability.
  3.  **Intractability:** It is possible that the Inheritance Question has no determinate answer within nine months because the competing theories are flexible enough to absorb any verdict via auxiliary hypotheses. If the theories prove sufficiently ad hoc to accommodate any outcome, the project will conclude that the WKR debate lacks the rigidity required for this type of structural testing.

  **Framing Assumptions**
  Referees should note that this proposal assumes the WKR problem is a genuine theoretical constraint rather than a pseudo-problem dissolvable by eliminativism about value. It also assumes that normative reasons can be meaningfully categorised by 'kind' in a way that tracks the metaphysical structure of attitudes. If a referee holds that reasons are univocal and the 'kind' distinction is merely pragmatic, the Inheritance Question may appear ill-posed. I proceed on the premise that the distinction is substantive, as this is the working assumption of the literature I aim to test.

  This project offers a rigorous, structural intervention in a stalled debate. By shifting focus from the *source* of reasons to the *structure* of the attitudes they target, it provides a novel pathway to evaluate the coherence of fitting-attitude accounts within a feasible nine-month timeframe.
