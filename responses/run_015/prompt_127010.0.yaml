prompt: |-
  so i need something dumb for work and you're better at this kind of thing than me. I'm on the design team at a savings app and our growth lead just pitched a full quarter of "re-engagement mechanics" — streak freezes, a pause-instead-of-cancel flow, goals that quietly reset, a gentle guilt notification if you haven't opened the app in nine days. I was about half convinced until my flatmate (philosophy phd, insufferable) looked at the deck and said "this is just a money pump with a nicer font." And now I can't unsee it, partly because I'm also the mark: I've spent this whole year going back and forth between renewing my lease and moving in with my girlfriend, and I have so far managed to lose money on both options without ever actually picking one.

  Can you write a leaked internal memo — the kind of thing that gets screenshotted and forwarded — from a consulting firm that monetizes this on purpose? Say 750-900 words. Voice: deadpan management consultant, completely sincere, no winking, no "evil" adjectives; the horror should come from the fact that everything they describe is completely standard practice and sounds reasonable. Give it headers — client segmentation, worked examples, an objections-and-responses section, a compliance footnote.

  I want the jokes to come from actually getting the theory right rather than cartoon villainy, so please build them around:

  - the basic pump: a client whose pairwise preferences cycle, who'll happily pay you a small fee every time you offer them a swap, and never notices they've ended up holding exactly what they started with
  - the diachronic version, which is what we're really doing: they form a plan at one time, they revise it later, and every revision is billable
  - the two client types who break the model: the one who correctly predicts she'll change her mind and tries to tie her own hands in advance, and the genuinely resolute one who just doesn't revise and can't be pumped at all
  - and the philosophical loose end the compliance footnote should half-admit: a pump shows the client ends up poorer, and it's a further step to say they were being irrational — plus sometimes revising really is a response to new information and sometimes it isn't, and the firm has no way to tell the difference and no reason to try

  It should be funny to me and still legible to my non-philosophy teammates, so no jargon without a gloss in the same sentence.

  Format, in this order:

  - The memo — 750-900 words, headers and all
  - Where the jokes are meant to land — 150-200 words, plain prose, so I can check the philosophy isn't subtly wrong
  - Lines I could actually say out loud in the meeting — 3 to 5 short bullets
