      *(Refining the Ending)*: The "one line I may not write." It needs to be something that claims ultimate knowledge of her interior state regarding the brother.

  5.  **Final Polish:** Check the rhythm. Ensure no speech is a monologue. Ensure they listen to each other.

      *   *Drafting the Concessions:*
