answer: |-
  The draft sits between us, pages cooled by the open window. The clock on the wall ticks past two.

  "You owe her nothing," I say, tapping the manuscript. "You owe the reader a human being, not a riddle. And you owe the record a bridge. A biographer owes the facts as they lie; I owe the facts as they lived. If I don't give her a motive, she's a monster. If I give her one, she's a woman. That is the debt: intelligibility."

  "She is not a riddle to be solved," she answers, stirring cold tea. "She is a person who chose not to be known. You owe the dead their opacity. And you owe the living descendants a mother they don't have to explain away. The biographer's debt and the novelist's are the same species: truth. You just think your truth is allowed to wear a mask. It isn't. When you fill the silence, you aren't building a bridge; you're paving over a grave."

  "If I pave over a grave, it's because she left the ground unstable. But consider the asymmetry. If I invent a sordid affair to explain the letter, you call it theft. If I invent a noble sacrifice, you call it theft. Why? If unflattering invention is a theft of reputation, why is flattering invention not one too? Or is it only theft when it damages?"

  "Because both are erasures," she says. "Flattery is the more insidious theft. If you make her noble, you steal her right to have been petty, or confused, or silent for no reason at all. You replace the complex dead woman with a useful archetype. Whether you paint her a villain or a saint, you have evicted her to move in your plot. The debt is to the reality, not the coherence."

  "Coherence *is* the repayment," I insist. "The archive denies her a mind. I lend her one. By giving her a motivation that aligns with the letter, I pay back the silence with meaning. I am not evicting her; I am furnishing the house she left empty so someone can finally visit."

  "You cannot repay a loan with counterfeit currency," she counters. "You say you lend her a mind, but you demand interest in the form of plot progression. If the silence was a withholding, as I believe, then coherence is a violation of that will. You argue you repay the debt of obscurity. I argue the obscurity *was* the payment she made to her own life. You cannot settle her account by spending money she hid."

  "Then we are at an impasse on the principle. But I need your help on the practice. I will concede this: the cousin cannot comfort her. In the three years I write, the cousin must fail to understand her. That preserves the isolation you say is sacred. It makes the confidant a witness to the silence, not a key to unlock it. Can you use that?"

  "I can," she says. "And I will concede this: the silence cannot be passive. You are right that a gap on the page reads like negligence. I concede you must dramatize the *act* of withholding. Show her starting a diary entry and stopping. Show her burning a letter. Make the reader feel the weight of the thing she refuses to say, rather than just skipping the years. That serves your need for scene without violating my rule against invention."

  "Agreed. But that brings us to the night before the letter. The scene I care most about. I need to put her at the table, pen in hand. I need to show the decision crystallizing."

  "You may show the table," she says. "You may show the pen. You may show the hour. But you cannot claim the content of the resolve."

  "I have to explain why she writes it the next morning."

  "No. You have to explain why the reader sees her write it. Those are different things." She leans forward, her hand covering the last page of my draft. "You can stage the struggle. You can stage the cost. But you cannot stage the justification. If you tell us *why* she denounces him, you break the Sealed Room. The letter itself is the public act. The night before is the private boundary."

  "So I can write the scene, but I am bound by a specific prohibition."

  "Yes."

  "Tell me the line. Tell me the one sentence that crosses the border so I know where the floor ends."

  She looks at me, and for the first time, she looks tired. "You may not write: 'I am doing this to save him.'"

  I nod slowly. "Because that claims a motive that justifies the betrayal."

  "Because that claims a knowledge of the future and a purity of intent that the archive does not support and the silence does not permit. It turns a wound into a weapon. You can write her shaking. You can write her crying. You can write her staring at his name until the ink blurs. But you cannot write her deciding that the cruelty is kindness. That is the one line you may not write."
