      *(Refining the "Asymmetry" argument)*: The prompt asks: "if unflattering invention is a theft, why is flattering invention not one too?" I need to make sure this specific logical trap is sprung and answered.
      *   Me: Flattery serves the archive's gap; traducing serves my plot. (Weak).
