  # Joint Statement on the Inside-Outside View Tension
  **Adversarial Collaboration on Rational Belief Revision**

  ### I. Areas of Agreement
  We, the undersigned representatives of the Internalist (Camp A) and Reference-Class (Camp B) perspectives, affirm the following claims as common ground. These claims are phrased to allow endorsement without requiring either side to abandon its core normative commitments regarding the source of justification.

  1.  **The Reality of Selection Effects:** We agree that human confidence assessments are systematically subject to cognitive biases and selection effects. Specifically, individuals who feel they possess unique insight are statistically more likely to be overconfident than underconfident, regardless of their actual domain expertise.
  2.  **Formal Coherence:** We agree that ideal belief revision should adhere to principles of probabilistic coherence (such as Bayesian updating). While we disagree on the *inputs* required for such updating (case-specific evidence vs. base rates), we agree that arbitrary inconsistency in belief strength is epistemically defective.
  3.  **The Reference Class Problem:** We agree that identifying the appropriate reference class for any given judgment is practically difficult and theoretically non-trivial. Different plausible reference classes yield different base rates, and the choice of class can itself introduce bias if not carefully constrained.
  4.  **The Normative Value of Calibration:** We agree that uncalibrated overconfidence is instrumentally harmful. Whether achieved through internal refinement or external adjustment, improving the correlation between stated confidence and actual frequency of truth is a shared goal of epistemic modesty.

  ### II. Statement of Remaining Disagreements
  Despite our agreement on the problems, we diverge on the mechanism of the solution.

  *   **Camp A (Internalist) Position:** We maintain that inside-view calibration can be non-circular. An agent can critically evaluate the quality of their own evidence and reasoning processes without needing to surrender to a statistical aggregate. We argue that strict adherence to outside-view adjustments risks discarding valid, case-specific information (signal) that distinguishes the current situation from the historical average, thereby reducing discriminative accuracy.
  *   **Camp B (Reference-Class) Position:** We maintain that any non-circular calibration requires an outside-view anchor. We argue that the decision to treat specific case details as "valid information" rather than "noise" is itself an inside-view judgment prone to the very biases the outside view is meant to correct. Consequently, preserving "valid information" is often a post-hoc rationalization for maintaining overconfidence.

  ### III. Identified Cruxes
  We have identified two specific points of contention—one empirical, one conceptual—that resolve the disagreement.

  #### Crux 1: The Empirical Efficacy of Adjustment Protocols
  **The Issue:** Does the systematic application of reference-class adjustments by domain experts improve overall forecasting performance (specifically calibration) without degrading discriminative accuracy, compared to experts trained solely in inside-view refinement?

  **Proposed Study Design:**
  A longitudinal forecasting tournament involving 200 domain experts (e.g., geopolitical analysts, financial forecasters).
  *   **Group A (Inside-View):** Trained in structured analytic techniques to identify causal mechanisms and refine internal uncertainty estimates. They are forbidden from using explicit base-rate anchoring.
  *   **Group B (Outside-View):** Trained to identify the narrowest relevant reference class first, establish a base rate, and *only* adjust that base rate if they can provide evidence meeting a pre-specified likelihood ratio threshold.
  *   **Metric:** Brier scores decomposed into Calibration and Resolution (Discrimination) components over 500 binary questions.

  **Predictions:**
  *   **Camp A Prediction:** Group A will achieve equal or better Resolution (discrimination) than Group B, with no statistically significant deficit in Calibration. The unique information utilized by Group A will outweigh the noise suppression of Group B.
  *   **Camp B Prediction:** Group B will achieve significantly better Calibration than Group A. While Group A may show higher Resolution, their poor Calibration will result in a superior (lower) aggregate Brier score for Group B, demonstrating that inside-view "signal" is predominantly noise.

  #### Crux 2: The Regress of Weighting
  **The Issue:** Does assigning weight to inside-view evidence necessarily presuppose an inside-view judgment about the weight itself, thereby generating a regress that only an outside-view stopping rule can halt?

  **Structured Thought Experiment:**
  Consider an agent, *S*, attempting to determine the probability of event *E*. *S* possesses specific evidence *e* and a base rate *b*. *S* must decide how much to adjust *b* given *e*.
  *   **Scenario:** If *S* uses their own judgment to decide how much *e* is worth, that judgment is an inside-view claim. If *S* uses a rule to decide how much to trust that judgment, the selection of the rule is also a judgment.
  *   **Question:** Is there a non-arbitrary stopping point for this regress that does not rely on an external, statistical frequency claim?

  **Predictions:**
  *   **Camp A Prediction:** The regress halts at rational insight. *S* can directly apprehend the relevance of *e* to *E* through understanding the causal mechanism. This foundational grasp does not require further statistical validation to be justified; the "stopping rule" is the coherence of the explanation itself.
  *   **Camp B Prediction:** The regress halts only at an external reliability claim. *S* is only justified in weighting *e* if *S* knows (via reference class) that agents in *S*'s position who perceive evidence *e* are reliably correct. Without this outside-view anchor, the stopping point is arbitrary confidence.

  ### IV. Assessment of Verbal Disagreement
  We assess that a portion of our disagreement is verbal, centering on the definition of **"Epistemic Modesty."**

  *   **Camp A Usage:** Modesty is primarily **Procedural/Attitudinal**. It refers to the intellectual virtue of acknowledging the fallibility of one's reasoning processes, actively seeking counter-arguments, and reducing certainty *within* the framework of one's own analysis.
  *   **Camp B Usage:** Modesty is primarily **Statistical/Predictive**. It refers to the mathematical property of calibration, where stated probabilities match observed frequencies, regardless of the internal reasoning process used to generate them.

  **Disentanglement:**
  We agree to distinguish **"Internal Humility"** (Camp A's focus: the quality of the reasoning process) from **"External Calibration"** (Camp B's focus: the accuracy of the probability output). Camp A argues Internal Humility is necessary and sufficient for justification; Camp B argues Internal Humility is insufficient without External Calibration. Recognizing this distinction clarifies that Camp A is making a claim about *epistemic justification*, while Camp B is making a claim about *instrumental reliability*.

