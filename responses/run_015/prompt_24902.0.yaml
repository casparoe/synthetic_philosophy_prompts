answer: |-
  This is a classic "reverse-engineer the normative theory" puzzle. Your professor is testing whether you can distinguish between different philosophical objections to markets. Based on her verdicts, she is clearly **not** a standard "anti-commodification" theorist like Michael Sandel (who would typically ban kidneys, surrogacy, *and* mercenaries). She is also not a Libertarian (who would allow vote selling and price gouging).

  Here is the breakdown of the competing principles, the prediction, and the tie-breaker.

  ### 1. The Two Competing Principles

  Based on her data, there are two plausible principles that fit most of her cases but diverge on the adoption queue.

  **Principle A: The "Vital Need & Civic Equality" Principle**
  *   **The Theory:** Markets are permissible *except* when they allow wealth to bypass need-based allocation for essential goods (health, safety) or undermine equal citizenship (votes). The core worry is **inequality of access to essentials.**
  *   **Fit:** Explains the bans on Vote Selling (civic equality), Healthcare Queues (essential need), and Price Gouging (exploitation of need). Explains the allowances for Kidneys/Surrogacy (increases supply of medical goods) and Mercenaries (state service, not individual right).
  *   **Prediction for Adoption:** **Illegal.** Adoption through the state is an allocation of an essential human good (family/child welfare) based on "best interest" and need, not wealth. Selling a spot allows money to bypass the merit/need assessment, violating the equality principle.

  **Principle B: The "Medical Triage" Principle**
  *   **The Theory:** Markets are permissible *except* when they interfere with life-or-death medical triage or the specific mechanics of democracy. The core worry is **direct harm to survival or political integrity.**
  *   **Fit:** Explains the bans on Healthcare Queues (life-or-death triage), Price Gouging (survival goods), and Vote Selling (democratic integrity). Explains the allowances for Kidneys/Surrogacy (medical supply) and Mercenaries (not life-or-death for the citizen).
  *   **Prediction for Adoption:** **Legal.** While adoption is important, it is not "medical triage." The prospective parents have already passed the home study (they are fit). The queue is administrative, not life-saving. Therefore, market exchange is permissible.

  ### 2. Which Principle is She Actually Using?

  **She is almost certainly using Principle A (Vital Need & Civic Equality).**

  **Why?**
  The strongest clue in her list is the **Healthcare Queue** verdict combined with the **Mercenary** verdict.
  *   If she were a strict "Market Corrupts Virtue" theorist (like Sandel), she would ban Mercenaries. She didn't. This means she doesn't think markets inherently degrade moral goods.
  *   If she were a Libertarian, she would allow Healthcare Queue Jumping. She didn't. This means she thinks markets *do* have limits regarding essential access.
  *   **The Adoption Queue is structurally identical to the Healthcare Queue.** Both involve a state-managed waitlist for a vital human good where allocation is supposed to be based on need/fitness, not ability to pay. Since she banned selling spots in the medical line, consistency demands she ban selling spots in the adoption line. Principle B (Medical Triage) tries to draw a line between "Health" and "Family," but Principle A captures the deeper structural similarity: **State allocation of essential goods.**

  ### 3. The Tie-Breaker Case

  To definitively settle whether she is following Principle A (Essential Public Goods) or Principle B (Medical/Democratic Specifics), you need a case that is an **essential public good** but is **neither medical nor political.**

  **The Case:** **"Should parents be allowed to sell their spot in line for enrollment in a public school?"**

  *   **Context:** Imagine a high-demand public school with a lottery or waitlist. Parents have already qualified for the district.
  *   **If she says ILLEGAL:** It confirms **Principle A.** She believes markets cannot determine access to *any* essential public good (Health, Education, Family) managed by the state. The principle is about **Equal Access to Essentials.**
  *   **If she says LEGAL:** It confirms **Principle B.** It suggests her ban on Healthcare Queues was specifically about *medical triage/life-saving* resources, not public goods generally. This would imply the Adoption Queue might actually be legal (since adoption isn't life-saving medical care).

  ### Summary for Your Class
  *   **Prediction:** She will say selling adoption spots should be **Illegal**.
  *   **Principle:** **"Markets are impermissible when they allow wealth to determine access to essential goods or rights allocated by the state based on need/merit."**
  *   **Tie-Breaker:** **Selling a spot in line for public school enrollment.** (Illegal = Essential Goods Principle; Legal = Medical/Democratic Specificity Principle).
