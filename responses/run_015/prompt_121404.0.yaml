answer: |-
  You have identified a specific rhetorical and epistemic maneuver that is well-documented in **political ecology** and **critical disaster studies**, though it lacks a single, lexicalized term like "strawman" in formal logic.

  The closest established concept is **"Naturalization"** (specifically, the naturalization of political outcomes). However, to capture the specific *causal slide* you are describing—where a trigger absorbs the explanatory weight of a structure—the most precise existing phrase is **"The Alibi of Nature."** This term is used by historians like Mike Davis (*Late Victorian Holocausts*) and political ecologists to describe exactly this phenomenon: using meteorological or biological facts to exonerate political agents.

  If we need a technical term for the *logical structure* of the error itself (distinct from the political motive), the best coinage is **"Explanatory Naturalization."**

  Here is the mapping of the concept, its existing synonyms, and the boundary carving you requested.

  ### 1. The Established Terminology

  While there is no single word in formal logic, three fields have names for this move:

  *   **Political Ecology:** **"The Alibi of Nature."** This frames the move as an exoneration strategy. The natural event is not just a cause; it is a defense witness for the regime.
  *   **Disaster Risk Reduction (DRR):** **"Hazard-Disaster Conflation."** In DRR theory, a *hazard* (drought) only becomes a *disaster* (famine) through vulnerability. Treating them as synonymous is a technical error known as **Hazard Determinism**.
  *   **Critical Theory:** **"Naturalization."** The process of making contingent, historical, or political facts appear inevitable, biological, or meteorological.

  **The Coinage:** If you want a term that describes the *rhetorical slide* specifically (the epistemic closure), I propose **"Explanatory Naturalization."**
  *   *Definition:* The premature termination of causal inquiry at the point of a natural trigger, treating a contingent precondition as a sufficient cause.

  ### 2. Boundary Carving

  You asked to distinguish this from three specific alternatives. Here is how **Explanatory Naturalization** differs from them:

  #### (1) vs. A Legitimate Partial Cause
  *   **Legitimate Claim:** "The monsoon failure reduced the harvest, which *contributed* to the crisis alongside export policies."
  *   **Explanatory Naturalization:** "The monsoon failure caused the famine."
  *   **The Boundary:** The distinction lies in **sufficiency vs. contribution**. A legitimate analysis treats the weather as a *stressor* applied to a system. Explanatory Naturalization treats the weather as the *system failure itself*.
  *   **Test:** If you remove the political variable (e.g., food exports continue during drought), does the famine still occur? If no, the weather was not the sufficient cause. Explanatory Naturalization ignores this counterfactual.

  #### (2) vs. Motte-and-Bailey
  *   **Motte-and-Bailey Structure:**
      *   *Motte (Defensible):* "There was a severe drought." (Undisputed meteorological fact).
      *   *Bailey (Contested):* "Therefore, the famine was unavoidable/natural." (Political claim).
  *   **Explanatory Naturalization:** This is the *mechanism* that allows the slide from Motte to Bailey to go unchallenged.
  *   **The Boundary:** A Motte-and-Bailey is a *debate tactic* (retreating to the safe claim when challenged). Explanatory Naturalization is an *epistemic habit* (genuinely failing to see the distinction). However, when used rhetorically to shut down inquiry, Explanatory Naturalization *functions* as a Motte-and-Bailey. The difference is intent: Motte-and-Bailey implies conscious strategic retreat; Explanatory Naturalization can be an unconscious ideological blind spot.

  #### (3) vs. Ignorance of Sen's Work
  *   **Ignorance:** "I didn't know food distribution mattered; I thought famine was just lack of food."
  *   **Explanatory Naturalization:** "I know distribution matters, but this drought was so severe it overrides those factors." (Or: "The drought is the primary story; distribution is a secondary detail.")
  *   **The Boundary:** Ignorance is a lack of data. Explanatory Naturalization is a **hierarchy of evidence**. It privileges physical data (rainfall meters, crop yields) over social data (price spikes, entitlement maps) by categorizing the former as "hard causes" and the latter as "soft context." It is a category error, not necessarily a knowledge gap.

  ### 3. Why the Slide Happens (The Mechanism)

  The reason this move is so recurrent (Bengal, Ireland, GLF) is that it exploits a cognitive bias in causal reasoning: **Salience.**

  *   **The Trigger is Salient:** Droughts, blights, and floods are discrete, observable events with clear start and end dates.
  *   **The Structure is Latent:** Entitlement collapse, colonial extraction, or bureaucratic rigidity are continuous, background processes.

  **Explanatory Naturalization** occurs when the *salient* event is allowed to cannibalize the *latent* structure in the causal narrative. It turns a **conjunctive cause** (Drought AND Policy) into a **singular cause** (Drought).

  ### Summary for Usage
  If you are writing this up, **"The Alibi of Nature"** is the most historically resonant term for the *political function*. **"Explanatory Naturalization"** is the most precise term for the *logical error*.

  **Example Usage:**
  > "Attributing the Bengal famine solely to the cyclone is an instance of **explanatory naturalization**. It treats a meteorological trigger as a sufficient cause, effectively granting an **alibi of nature** to the administrative failures that converted a crop shortfall into a mass mortality event."
