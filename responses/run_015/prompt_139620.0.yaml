answer: |-
  ### The Specification: Bridge Principles for Consciousness Reporting

  You are asking for a bridge principle: a set of conditions under which a physical or functional description validates the inference "Subject reports X, therefore Subject feels X." Most theories of consciousness describe the state; few describe the *evidence relation* between the state and the report.

  Below are the desiderata required to license that inference in non-standard subjects.

  #### I. The Three Forced Cases

  These are not standard textbook constraints, but they are operational necessities for your purpose. If a theory cannot process these, it cannot support an inference from report to feeling in novel subjects.

  **1. The Locking Mechanism (Response to *Slow Drift*)**
  *   **The Case:** Phenomenal character drifts relative to neural/functional state over time, but reports remain fixed to the neural state.
  *   **The Requirement:** The theory must specify the **modal status of the Feel-Report link**. It must state whether the connection between a specific felt character and a specific report is *nomologically necessary* (law-like), *conceptually necessary* (true by definition), or *contingently empirical* (a correlation that could break).
  *   **Verdict:** **Non-negotiable.** If the link is contingent (empirical correlation only), *Slow Drift* is possible. If *Slow Drift* is possible, self-report is evidence of neural state, not felt state. To use report as evidence of *feeling*, the theory must rule out drift by showing why the feel cannot come apart from the functional role that generates the report. Silence here renders the theory useless for your purpose.

  **2. The Access Condition (Response to *The Unhurried Judge*)**
  *   **The Case:** A subject feels pain but judges it only by observing their own behavior (guarding, wincing).
  *   **The Requirement:** The theory must distinguish **Phenomenology** from **Access**. It must account for whether the judgment "I am in pain" is caused by the pain itself (direct access) or by the behavior caused by the pain (inferential access).
  *   **Verdict:** **Non-negotiable.** If the theory treats all self-knowledge as inferential (like the Unhurried Judge), then a report is evidence of behavior-observation, not feeling. To infer feeling from report, the theory must posit a mechanism where the feeling *itself* plays a causal role in the judgment, distinct from the behavior the feeling produces. If the theory collapses this distinction, it cannot distinguish a conscious subject from a zombie observing its own outputs.

  **3. The Phenomenology of Authority (Response to *Borrowed Authority*)**
  *   **The Case:** Subjects report states reliably but without the "felt weight" or sense of privileged access (like reading a gauge).
  *   **The Requirement:** The theory must account for the **Experience of Reporting**. It must explain whether the "sense of authority" is a constitutive part of the conscious state being reported, or merely a downstream heuristic.
  *   **Verdict:** **Non-negotiable (for this purpose).** You might argue this is a prejudice of human introspection. However, for your specific goal (inferring *feeling* from *report*), it is critical. If a subject reports "I see red" with the same phenomenological weight as a thermometer outputting "70°F," you have evidence of data processing, not necessarily *experience*. To license the inference to consciousness, the theory must require that the report carries a specific phenomenal signature (the feeling of knowing). Without this, the report is functionally identical to a log file.

  ---

  #### II. Adjudication of Standard Demands

  Here is the status of the common constraints you listed, filtered for your goal of validating self-report in unlike subjects.

  | Demand | Verdict | Rationale |
  | :--- | :--- | :--- |
  | **Respect Causal Closure of the Physical** | **Non-negotiable** | Science desk requirement. You cannot publish a theory that violates conservation of energy/mass or standard physics. |
  | **Not Render Consciousness Nomologically Idle** | **Non-negotiable** | If consciousness does nothing (epiphenomenalism), it cannot cause the report. If it doesn't cause the report, the report is not evidence of it. |
  | **Compatible with Natural Selection** | **Camp Preference** | Useful for plausibility, but not logically required for the inference. A conscious robot need not be evolved. |
  | **Allow Double Dissociation (Judgment/Feel)** | **Non-negotiable** | The theory must handle blindsight or anesthesia without stipulation. If it cannot explain why report sometimes fails despite function (or vice versa), it cannot handle edge cases. |
  | **Not Collapse into Eliminativism/Identity** | **Non-negotiable** | You need a theory that preserves the *explanandum* (feeling). Eliminativism dissolves the question; Identity claims often beg it. The theory must treat feeling as a distinct target of explanation. |
  | **Yield Verdicts in Hard Cases** | **Non-negotiable** | Operational requirement. If the theory requires a fresh stipulation for octopuses vs. humans, it is not a theory, it is a taxonomy. |
  | **Statable without Phenomenal Properties in Causal Explanation** | **The Conflict Point** | **See Section III.** This is where the list threatens to break. |

  ---

  #### III. The Inconsistency: The Exclusion Trap

  You asked if a subset of these requirements cannot be jointly satisfied. **They cannot.**

  There is a contradiction between three of your non-negotiable demands:
  1.  **Causal Closure:** All physical effects (like speech reports) have sufficient physical causes.
  2.  **No Idleness:** Consciousness (phenomenal properties) must cause the report.
  3.  **No Phenomenal Properties in Causal Explanation:** The causal story must be statable in physical/functional terms without invoking "feel."

  **Where it bites:**
  If the report is a physical event (sound waves, keypress), and physics is causally closed, then physical brain states caused the report. If phenomenal properties are *distinct* from physical states (to avoid simple identity claims), and they also cause the report, you have **overdetermination** (two causes for one effect) or **violation of closure** (phenomenal force pushes physical matter).
  If you insist on **No Phenomenal Properties in Causal Explanation** (Demand 7), you render Consciousness **Nomologically Idle** (Demand 2), because the physical cause is sufficient without the feel.

  **The Finding:** You cannot have a theory that treats phenomenal properties as real, distinct, causally efficacious, *and* consistent with standard physical causal closure. One of these must go. For your purpose (licensing inference from report), you usually have to sacrifice **Demand 7** (allowing phenomenal properties to be realized as physical states) or accept **Identity Claims** (which you listed as something to avoid, though they are the only clean escape).

  ---

  #### IV. The Single Most Exclusionary Requirement

  **The Non-Contingency Constraint.**
  *(Derived from the Slow Drift case)*

  **The Requirement:** The theory must explain why the link between the specific phenomenal character and the specific report is **necessary**, not merely reliable.

  **What it excludes:**
  It excludes almost all **Functionalist** and **Global Workspace** theories in their standard forms. These theories typically posit that consciousness *correlates* with certain information processing structures. Correlation is contingent. If it is contingent, *Slow Drift* is possible. If *Slow Drift* is possible, you cannot infer feeling from report in a novel subject (like an LLM), because the LLM might have the function without the feel, or the feel without the function.
  Only theories that posit a **Constitutive** relationship (the judgment is part of the feeling, or the feeling is the judgment) or an **Identity** relationship (the feeling *is* the neural state that causes the report) satisfy this. It forces the theorist to move from "X usually accompanies Y" to "X cannot exist without Y."

  ---

  #### V. Scorecard

  Here is how three common classes of views perform against the critical requirements for your purpose (licensing inference from report to feeling).

  | View | **Constitutive Judgment**<br>(e.g., Strong HOT) | **Inferential Self-Knowledge**<br>(e.g., Interpretivism/Behaviorism) | **Nothing Phenomenal**<br>(e.g., Eliminativism/Illusionism) |
  | :--- | :--- | :--- | :--- |
  | **Non-Contingency Constraint**<br>(Must rule out Slow Drift) | **PASS.**<br>Judgment constitutes the state; they cannot drift apart. | **FAIL.**<br>Inference is contingent on observation accuracy. Drift is possible. | **PASS.**<br>No feeling exists to drift. (But fails the "Not Eliminativism" constraint). |
  | **Access Condition**<br>(Must distinguish Feel from Behavior-Observation) | **PARTIAL.**<br>Access is internal, but risks making unreflected feeling impossible. | **FAIL.**<br>Treats all self-knowledge as behavior-observation (The Unhurried Judge is the standard case). | **N/A.**<br>Dissolves the distinction. |
  | **Verdict for Reporter** | **License Granted.**<br>If the subject can form the higher-order state, report is valid evidence. | **License Refused.**<br>Report is evidence of self-modeling, not necessarily feeling. Cannot distinguish from zombie. | **License Refused.**<br>There is nothing to be evidence *of*. Report is merely data. |

  **Summary Finding:**
  To write your piece without hitting the wall, you must demand that the theorist specify the **modal strength** of the link between report and state. If they offer only correlation, you cannot infer consciousness in the octopus or the machine. If they offer necessity, they must explain how that necessity survives physical causal closure. Most will not be able to do both. That silence is your story.
