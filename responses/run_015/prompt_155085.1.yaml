      *   *Constraint Check:* "Factual vs Axiological". Need a test for this. Factual = Data check. Axiological = Value judgment.

  10. **Final Polish:** Ensure the language is precise enough to be followed in real-time but not so jargon-heavy that non-logicians get stuck. (e.g., avoid "conjunctive aggregation," use "All-Three Rule").

      *(Self-Correction on Case 3)*: The prompt asks for a case where the procedure mandates approval *despite* the Chair's conviction. This highlights the constraint of the rule-based system. I need to make sure the flowchart explicitly forces this outcome to demonstrate the system's integrity over individual whim.

      *(Self-Correction on Authority)*: The prompt says members "carry unequal domain authority". I need to make sure I don't give them *veto* power necessarily, but the prompt says "if the member with designated authority on a premise dissents, the board records a conditional status". This is a specific rule I must implement.

      *(Final check on 7 members)*:
