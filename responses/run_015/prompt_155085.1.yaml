answer: |-
  # IRB Decision Aggregation Protocol (IDAP)
  **Version:** 1.0 (Real-Time Application)
  **Constraint:** 90 Minutes, 7 Voting Members, No External Logic Tools

  ## Part 1: Pre-Meeting Authority Tagging (Static)
  *To prevent circularity, authority is assigned by **Role**, not by Argument. This is fixed in the Board Charter, not decided per protocol.*

  1.  **Premise R (Minimal Risk):** Designated Authority = **Biostatistician**.
      *   *Rationale:* Risk calculation is fundamentally statistical and design-based.
  2.  **Premise C (Adequate Consent):** Designated Authority = **Patient Advocate**.
      *   *Rationale:* "Genuine adequacy" for vulnerable populations hinges on comprehension and vulnerability, not just legal syntax.
  3.  **Premise V (Scientific Value):** Designated Authority = **Clinician-Researcher**.
      *   *Rationale:* Justification of risk requires clinical/scientific merit assessment.
  4.  **Remaining 4 Members (Legal, Community, 2 At-Large/Chair):** General Voters.
      *   *Role:* Vote on all premises; provide axiological balance; break ties.

  ---

  ## Part 2: The 90-Minute Decision Flowchart
  *Execute sequentially. Do not skip steps. Time allocation is approximate.*

  ### Phase 1: Disagreement Triage (15 Minutes)
  **Test 1: Factual vs. Axiological.**
  When a member objects to a premise ($R$, $C$, or $V$), the Chair asks: *"Is this objection based on missing data/calculation error (Factual) or on weight/priority/value (Axiological)?"*
  *   **If Factual:** Pause vote. Request immediate correction or data verification. If unresolved, table the protocol (do not vote).
  *   **If Axiological:** Proceed to Phase 2. (The procedure is designed to resolve axiological disagreement).

  ### Phase 2: Premise Aggregation (45 Minutes)
  *Regulatory compliance requires findings on each premise. We vote on premises first to avoid the Discursive Dilemma.*

  **Test 2: The Premise Vote.**
  Conduct three separate roll-call votes (Yes/No/Abstain) for $R$, $C$, and $V$.
  *   **Threshold:** Simple Majority (4 of 7) required to affirm a premise.
  *   **Record:** Tally for each premise.

  **Test 3: The Authority Dissent Check (Critical).**
  For each premise affirmed by Majority (4+ votes), check the vote of the **Designated Authority** for that premise.
  *   **If Authority Voted YES:** Premise stands as **AFFIRMED**.
  *   **If Authority Voted NO:** Premise is tagged **CONTESTED**.
      *   *Rule:* A premise cannot be "Affirmed" without the Authority's concurrence unless the Board overrides the Authority with a **Supermajority (6 of 7)**.
      *   *Action:* If Authority dissents and Supermajority is not reached, the Premise status becomes **CONDITIONAL**.

  ### Phase 3: Conclusion Determination (20 Minutes)
  **Test 4: The Conjunctive Rule.**
  *   **If all 3 Premises are AFFIRMED:** Conclusion = **APPROVAL**.
  *   **If any Premise is CONDITIONAL:** Conclusion = **QUALIFIED CLEARANCE**.
      *   *Definition:* Protocol proceeds *only* if the specific concern raised by the dissenting Authority is mitigated (e.g., revised consent form, reduced sample size) and verified by the Chair before study initiation.
  *   **If any Premise is REJECTED (Majority No):** Conclusion = **DISAPPROVAL / DEFERAL**.

  **Test 5: The Chair's Consistency Check.**
  *   Compare the Conclusion derived in Test 4 against a direct vote on "Approval."
  *   **If they match:** Record decision.
  *   **If they conflict (The Discursive Dilemma):** The **Test 4 Conclusion prevails**.
      *   *Rationale:* Regulatory findings on $R, C, V$ are legally binding; the holistic "Approval" vote is derivative. You cannot approve if $R, C, V$ are not met, even if a majority wants to. Conversely, if $R, C, V$ are met, you cannot disapprove based on holistic intuition alone.

  ### Phase 6: Dissent Documentation (10 Minutes)
  **Test 6: Transparency Rule.**
  *   Any member voting against the Conclusion, OR any Designated Authority voting against their Premise (resulting in Qualified Clearance), must have their dissent recorded.
  *   **Requirement:** The minutes must state: *"Premise X was affirmed by majority, but Designated Authority [Name] dissented. Status is Qualified Clearance."*
  *   **Suppression Prohibition:** The Chair cannot edit dissenting rationales for "clarity" if it alters the ethical weight. Dissenters may submit a 1-paragraph addendum to the official record.

  ---

  ## Part 3: Application to Three Cases

  ### Case 1: Straightforward Approval
  *   **Votes:**
      *   $R$: 7 Yes (Biostatistician: Yes)
      *   $C$: 7 Yes (Patient Advocate: Yes)
      *   $V$: 7 Yes (Clinician-Researcher: Yes)
  *   **Procedure Execution:**
      *   Phase 2, Test 3: All Authorities concur. All Premises **AFFIRMED**.
      *   Phase 3, Test 4: All Affirmed $\rightarrow$ **APPROVAL**.
      *   Phase 3, Test 5: Direct Approval vote matches.
  *   **Outcome:** Standard Approval. No dissent recorded.

  ### Case 2: The Discursive Dilemma + Authority Dissent
  *   **Scenario:** Majority supports premises, but the logic feels shaky. Biostatistician sees a risk others miss.
  *   **Votes:**
      *   $R$: 4 Yes, 3 No. (Biostatistician votes **No**).
      *   $C$: 5 Yes, 2 No. (Patient Advocate votes Yes).
      *   $V$: 5 Yes, 2 No. (Clinician-Researcher votes Yes).
      *   *Direct Approval Vote:* 4 Yes, 3 No.
  *   **Procedure Execution:**
      *   Phase 2, Test 2: $R$ passes Majority (4 votes).
      *   Phase 2, Test 3: **Authority Check on $R$.** Biostatistician (Authority) voted No. Supermajority (6 votes) to override was not reached (only 4 Yes).
      *   **Status of $R$:** **CONDITIONAL**.
      *   Phase 3, Test 4: Since $R$ is Conditional, Conclusion = **QUALIFIED CLEARANCE**.
      *   *Note:* Even though the direct Approval vote passed (4 Yes), the Premise Aggregation rule triggers the Conditional status due to Authority Dissent.
  *   **Outcome:** Qualified Clearance. The study cannot start until the Biostatistician signs off on the risk mitigation. Dissent is recorded in minutes: *"Risk premise affirmed by majority, but Biostatistician dissent triggers Conditional Status."*

  ### Case 3: Chair Overruled (Procedural Integrity)
  *   **Scenario:** You (Chair) believe the study is ethically dubious, but the procedure forces approval.
  *   **Votes:**
      *   $R$: 6 Yes, 1 No (You). Biostatistician votes Yes.
      *   $C$: 6 Yes, 1 No (You). Patient Advocate votes Yes.
      *   $V$: 6 Yes, 1 No (You). Clinician-Researcher votes Yes.
      *   *Direct Approval Vote:* 4 Yes, 3 No (You + 2 others vote No).
  *   **Procedure Execution:**
      *   Phase 2, Test 3: All Authorities voted Yes. All Premises **AFFIRMED**.
      *   Phase 3, Test 4: All Affirmed $\rightarrow$ **APPROVAL**.
      *   Phase 3, Test 5: **Conflict Detected.** Premise Aggregation says Approve. Direct Vote says Disapprove (Majority for approval was slim, but you are in the minority).
      *   **Mandatory Step:** **Test 4 Prevails.** The Chair must rule the outcome as **APPROVAL**.
  *   **Outcome:** Approval granted.
  *   **Identification of Overrule:** **Phase 3, Test 5.** This step explicitly subordinates the Chair's holistic judgment (and the direct conclusion vote) to the conjunctive finding of the three regulatory premises. Your personal conviction is recorded as a dissent in the minutes, but it does not veto the procedure.

  ---

  ## Part 4: Limitations & Dissent Documentation

  ### What This Procedure Cannot Settle
  1.  **Meta-Disagreement on Premises:** If members argue that $R, C, V$ are the *wrong* criteria (e.g., "We should be judging Justice, not just Risk"), this procedure fails.
      *   *Action:* This is a Charter issue, not a protocol issue. The Chair must halt the review and refer the matter to the Board's governing body for a criteria review. Do not attempt to solve this in the 90-minute window.
  2.  **Authority Credibility:** If the Board loses trust in the Biostatistician's competence, this procedure creates gridlock.
      *   *Action:* Authority tags are static. Removing an Authority requires a Charter Amendment, not a protocol vote.
  3.  **The "Qualified Clearance" Regulatory Gap:** Federal regulations (Common Rule) typically allow "Approved," "Modifications Required," or "Disapproved." "Qualified Clearance" is an internal administrative status.
      *   *Action:* Map "Qualified Clearance" to **"Approved with Modifications"** in the official regulatory system, where the "Modification" is the specific resolution of the Authority's dissent.

  ### Dissent Documentation Rules (Transparency Obligation)
  To prevent suppression of ethical concern while maintaining operational efficiency:

  1.  **The "Dissent Tag":** In the official minutes, any vote where the Designated Authority dissents from the Majority on their specific premise must be tagged with **[AUTH-DISSENT]**.
  2.  **The "Reasoning Addendum":** Any member voting against the Conclusion (Approval) has the right to attach a max-200-word reasoning statement to the official file. The Chair cannot edit this for content, only for redaction of confidential data.
  3.  **The "Chair's Paradox Note":** In cases like Case 3, where the Chair is overruled by the procedure, the minutes must explicitly state: *"Conclusion determined by Premise Aggregation Protocol Section 3, Test 5, overriding direct conclusion vote."* This protects the Chair from accusations of arbitrary decision-making and protects the Board from accusations of ignoring the Chair's safety concerns.

  ### Final Instruction to Chair
  You are the guardian of the **Procedure**, not the guardian of the **Outcome**. Your power lies in enforcing the flowchart strictly. If the flowchart produces an outcome you dislike, your ethical duty is to ensure the dissent is recorded transparently (Part 4), not to manipulate the vote to match your conviction. This preserves the Board's legal defensibility and ethical integrity over time.
