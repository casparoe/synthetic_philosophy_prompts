answer: |-
  **Project Title:** The Metric Mismatch: Diagnosing Goodhart Failures by Type to Select Effective Mitigations

  **The Precise Question**
  Current literature treats Goodhart's Law as a monolithic phenomenon: "when a measure becomes a target, it ceases to be a good measure." This project asks: **Does distinguishing between three distinct mechanisms of metric failure—(1) Selection Pressure (tail divergence), (2) Reclassification (label gaming), and (3) Constitutive Capture (metric defining reality)—reliably predict which mitigation strategies will succeed or fail?**

  Specifically, I will test the hypothesis that standard remedies are bucket-specific: *Audits* fix Reclassification but not Selection Pressure; *Metric Rotation* fixes Selection Pressure but destabilizes Constitutive Capture. If this typology holds, it offers a diagnostic tool for practitioners. If it does not, it suggests the "Collapse Worry" is correct: that in practice, the target and proxy are inseparable, rendering the distinction academically interesting but operationally useless.

  **Why Existing Frameworks Leave This Open**
  Organizations typically respond to gaming by adding complexity (dashboards, weighted composites) or oversight (audits). These are applied indiscriminately. The literature on specification gaming (ML) and performance management (public policy) describes *that* gaming happens, but rarely categorizes *how* the link between measure and target broke.

  This leaves the **Collapse Worry** unresolved: In many domains (e.g., credit scoring), the "target" (creditworthiness) has no existence independent of the measure. If all robust targets are ultimately constituted by their proxies, my three buckets collapse into one. Existing frameworks cannot distinguish between a metric that *fails to capture* a reality and a metric that *creates* a reality. This project treats that distinction as an empirical variable, not a philosophical premise. If I cannot cleanly classify real-world cases into these buckets, the typology is invalid.

  **Method and Timeline (9 Months, ~10 Hours/Week)**
  I will not build a formal model (too abstract for practical epistemics) or conduct interviews (ethics/scope creep for an independent researcher). Instead, I will perform **Comparative Case Reconstruction** using publicly documented instances of metric failure and remediation.

  *   **Months 1–2: Framework Stabilization.**
      *   Refine definitions of the three buckets using existing literature (Goodhart, Campbell, ML specification gaming).
      *   Create a coding rubric: What evidence counts as "Constitutive" vs. "Reclassification"?
      *   *Milestone:* A 2-page classification guide.
  *   **Months 3–6: Case Reconstruction (5 Domains).**
      *   Select one deep-dive case per domain: Hospital Coding (Reclassification), School Accountability (Selection Pressure), Credit Scoring (Constitutive), Warehouse Logistics (Mixed), ML Reward Hacking (Extreme Constitutive).
      *   For each: Document the original target, the proxy, the specific gaming behavior, the intervention attempted, and the outcome.
      *   Classify the failure type and the intervention type. Assess "Match" vs. "Mismatch."
      *   *Milestone:* Five case briefs (4 pages each).
  *   **Months 7–8: Synthesis and Stress-Testing.**
      *   Cross-reference cases. Did "Mismatched" interventions fail? Did "Matched" ones succeed?
      *   Explicitly test the Collapse Worry: In which cases was it impossible to distinguish the target from the proxy?
      *   *Milestone:* Draft analysis of typology validity.
  *   **Month 9: Deliverable Production.**
      *   Compile findings into the practical toolkit (see below).
      *   Final report for the foundation.

  **Why This Method?**
  Formal modeling would require assumptions I cannot justify without domain expertise in each field. Interviews would require IRB approval and access I do not have. Public documentation allows for auditability; the foundation can check my work against the same sources I use. This method prioritizes *external validity* (does this describe the real world?) over *internal precision* (is the math perfect?), which aligns with "practical epistemics."

  **The Deliverable**
  A **Diagnostic Decision Tree for Metric Design**, aimed at operations managers and policy implementers (e.g., my own employer).
  *   **Format:** A 10-page practical guide + a one-page flowchart.
  *   **Content:**
      1.  **Symptom Checker:** Questions to identify the failure type (e.g., "Did the behavior change, or did the labeling change?").
      2.  **Prescription:** Matched interventions (e.g., "If Constitutive, do not rotate metrics; redefine the policy goal instead").
      3.  **The Collapse Warning:** A specific section on when to abandon the metric entirely because the target no longer exists independently.
  *   **Utility:** A logistics director could use this to decide whether to add an audit (costly) or change the KPI (disruptive) when a depot starts gaming.

  **Scope Limitation**
  I am cutting the **ML Reward Hacking** case from the deep-dive analysis if it proves too technical to reconstruct from public papers within the time limit. It will remain a reference point, but I will prioritize the organizational cases (Hospital, School, Credit, Warehouse) as they are more relevant to the deliverable's audience. The project is about *organizational epistemics*, not AI safety specifically.

  **Failure Conditions**
  I will consider this project a failure if:
  1.  **Classification Impossible:** I cannot cleanly assign at least 4 of the 5 cases to a single bucket without significant ambiguity. (This confirms the Collapse Worry).
  2.  **No Predictive Power:** I find that "Matched" interventions fail as often as "Mismatched" ones. (This implies the typology doesn't matter).
  3.  **Deliverable Too Abstract:** The Decision Tree requires philosophical training to use, rather than operational experience. (This fails the "practical" mandate).

  If (1) occurs, I will write up the "Collapse Worry" as the primary finding: that practitioners must assume all metrics are constitutive and design accordingly. If (2) or (3) occurs, I will publish the negative result with the case data, noting that metric remediation is likely context-specific rather than typological.
