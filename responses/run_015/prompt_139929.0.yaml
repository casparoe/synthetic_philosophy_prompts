      *   *Sharpened Question:* "Does distinguishing between *divergence*, *reclassification*, and *constitutive* Goodhart failures predict the success or failure of specific mitigation strategies in real-world organizational settings?"
      *   *Better phrasing:* "Can a typology of Goodhart effects (Divergence, Reclassification, Constitution) reliably guide the selection of mitigation strategies, or does the 'Collapse Worry' (that all targets are ultimately constituted by their measures) render the distinction practically useless?"

  3.  **Address the "Collapse Worry" (Theoretical Grounding):**
      *   Why existing talk leaves it open: Most literature treats Goodhart as a monolithic "metric goes bad" phenomenon. Solutions are generic (add more metrics, add human oversight). They don't distinguish *why* the metric broke.
      *   The Collapse Worry: If "creditworthiness" *is* the score, then Constitutive Capture isn't a bug, it's a feature. If this is true everywhere, the typology is academic navel-gazing. The project must test if the distinction has *predictive power* regarding interventions.

