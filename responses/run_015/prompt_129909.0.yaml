answer: |-
  ### Specific Tests: Timing and Disclosure

  **Timing-Neutrality:** Your stipulation is **negotiable**. Strict neutrality between early and late brute luck conflicts with *Incentive-Responsiveness* and *Implementability*. If compensation for late-life accidents equals compensation for congenital defects without discounting, agents are incentivized to delay risk-taking or under-save. A lifetime accounting window (requiring integration over time) is superior to slice neutrality, but it requires relaxing strict timing-neutrality in favor of *lifetime sufficiency*.

  **Disclosure Condition:** Your suspicion is **incorrect**. This is not merely an expressive preference; it is a **non-negotiable** requirement for a democratic scheme. If compensation requires proving "defect," it creates a class of certified inferiors, undermining the political equality required to sustain the scheme. It rules out means-testing protocols that rely on invasive medical or psychological verification of incapacity.

  ### Desiderata Table

  | id | requirement | motivating_case | status | rules_out |
  | :--- | :--- | :--- | :--- | :--- |
  | R1 | **Responsibility Differentiation** | The theory must distinguish inequalities arising from choice vs. circumstance to judge injustice. | Non-negotiable | Strict Egalitarianism, Strict Libertarianism |
  | R2 | **Preference Endogeneity** | Compensation must not subsidize expensive tastes formed under deprivation nor punish adaptive preferences. | Non-negotiable | Naive Welfarism, Strict Resourcism |
  | R3 | **Dignity Floor** | No person may fall below a threshold of functioning required for democratic citizenship, regardless of choice. | Non-negotiable | Strict Luck Egalitarianism (abandonment clause) |
  | R4 | **Non-Stigmatizing Access** | Claims to transfer must not require self-certification as defective, pitiable, or incapable. | Non-negotiable | Paternalistic Means-Testing, Medical Model Disability |
  | R5 | **Observable Proxies** | Rules must rely only on earnings, wealth, and coarse facts; no direct observation of effort or taste. | Non-negotiable | Ideal Luck Egalitarianism, Perfect Information Models |
  | R6 | **Incentive Compatibility** | The scheme must remain solvent and functional when agents alter behavior to maximize transfer or minimize tax. | Non-negotiable | Utopian Redistribution, Unconstrained Maximin |
  | R7 | **Currency Specification** | The theory must specify whether justice targets resources, welfare, capability, or opportunity. | Negotiable | Theories lacking a metric (e.g., pure Proceduralism) |
  | R8 | **Lifetime Accounting** | Justice is assessed over a complete life, not time-slices, to allow for smoothing and risk-taking. | Negotiable | Strict Time-Slice Egalitarianism, Instantaneous Redistribution |
  | R9 | **Membership Scope** | The theory must define whether obligations extend to non-citizens, future generations, or children. | Negotiable | Closed Nationalism, Strict Presentism |
  | R10 | **Administrative Simplicity** | The cost of determining eligibility must not consume the value of the transfer itself. | Non-negotiable | Hyper-Granular Case-by-Case Adjudication |

