answer: |-
  **Joint Statement on the Problem of Dirty Hands in Political Ethics**

  **Produced for the Graduate Workshop on Political Ethics**
  **By Dr Elena Vance (Dirty-Hands Theorist) and Prof. Julian Thorne (Consequentialist)**

  **Introduction**
  For the past academic year, the undersigned have engaged in a structured adversarial collaboration regarding the coherence and utility of the 'dirty hands' problem in political morality. While our foundational commitments remain distinct, this process has allowed us to isolate genuine philosophical disagreements from verbal disputes and to identify a robust area of overlapping consensus regarding the practical realities of political decision-making. The following statement records our joint findings.

  ### 1. Agreed Claims

  We jointly affirm the following propositions regarding the phenomenology, epistemology, and limits of moral reasoning in political emergencies:

  1.  **The Phenomenology of Necessity:** We agree that political leaders facing supreme emergencies experience a distinctive phenomenological burden. The decision to violate standard moral prohibitions (e.g. against torture, deception, or targeting non-combatants) is not experienced as a simple calculation of utility, but as a traumatic rupture of normative order. Both of us accept that a leader who makes such a decision without psychological distress is likely dangerous, regardless of the moral justification for that distress.
  2.  **Epistemic Vulnerability and Drift:** We agree that the 'dirty hands' justification is epistemically fragile. Officials possess a well-documented tendency to overestimate necessity and urgency. We further agree that there is a historical pattern of 'supreme emergency' reasoning drifting from genuine existential threats down to mere policy convenience. Consequently, any doctrine permitting the violation of prohibitions must include strict epistemic hurdles to prevent self-serving licensing of escalation.
  3.  **The Failure of Absolutism:** We agree that the Kantian absolutist who refuses ever to dirty her hands is not necessarily morally superior. In cases of genuine catastrophe, a refusal to violate a prohibition (e.g. refusing to torture a terrorist to locate a nuclear device) constitutes a form of moral self-indulgence. To keep one's own hands clean at the cost of thousands of lives is to prioritise the agent's integrity over the welfare of the constituents they are sworn to protect.
  4.  **The Public Function of Anguish:** We agree that public displays of anguish or remorse by leaders following such decisions serve a vital political function. Whether or not the guilt is metaphysically warranted, the visible acknowledgement of the moral cost acts as a necessary check against the trivialisation of violence and reassures the citizenry that the violation was not undertaken lightly.

  ### 2. Residual Disagreements

  Despite the consensus above, we remain divided on the metaphysical status of the actions taken and the normative standing of the agent afterwards. The table below summarises our residual disagreements. Each formulation is phrased such that the respective party accepts the description of their own view.

  | Area of Disagreement | The Dirty-Hands View (Vance) | The Consequentialist View (Thorne) |
  | :--- | :--- | :--- |
  | **The Status of Guilt** | Post-action guilt is a **moral remainder**. It tracks the objective truth that a genuine moral prohibition was violated. To feel no guilt is to fail to recognise the reality of the wrong committed. | Post-action guilt is a **commitment device**. It is instrumentally useful for preventing future overuse of emergency powers, but it is not a tracking of moral truth. A leader who did the right thing *ought* not to feel guilt, though they may feign it for utility. |
  | **Coherence of Obligation** | The claim 'this act is wrong, yet I ought to do it' is a **coherent paradox**. It captures the tragic structure of politics where moral systems collide. The 'ought' of political office overrides the 'ought' of ordinary morality without erasing the latter. | The claim 'this act is wrong, yet I ought to do it' is a **category error**. If an act is what one ought to do, all things considered, it is by definition the right act. To call it 'wrong' is to misuse moral language, confusing a violation of a heuristic rule with a violation of morality itself. |
  | **The Function of the Category** | The 'dirty hands' category preserves the **integrity of prohibitions**. It ensures that even necessary violations are marked as toxic, preventing them from becoming normalised policy tools. | The 'dirty hands' category functions to **license escalation**. By allowing leaders to claim they are 'doing wrong for the right reason', it provides a rhetorical shield that insulates them from accountability for outcomes. |

  ### 3. The Cruxes

  We have identified two primary cruxes underlying our disagreements. In doing so, we have pruned away purely verbal disputes.

  **Crux 1: The Definition of 'Wrong'**
  *   **Verbal Dispute Pruned:** We acknowledge that we often use the word 'wrong' to mean different things. For Thorne, 'wrong' means 'sub-optimal outcome'. For Vance, 'wrong' means 'violation of a deontological constraint'. We agree to stipulate that in this collaboration, 'wrong' refers to the violation of a deep-seated moral prohibition (e.g. 'do not torture innocents'), regardless of the outcome.
  *   **Substantive Crux:** Even with this definition fixed, do we believe that a 'wrong' act can be 'right' all-things-considered?
      *   *Vance:* Yes. Morality is pluralistic. One can satisfy the 'all-things-considered' obligation while still violating a specific moral truth.
      *   *Thorne:* No. Morality is singular. The 'all-things-considered' verdict subsumes all other considerations. If the outcome justifies it, the prohibition was merely a rule of thumb, not a moral truth.

  **Crux 2: The Normativity of Guilt**
  *   **Substantive Crux:** Is guilt a cognitive state (recognising a fact) or a conative state (a tool for motivation)?
      *   *Vance:* Guilt is cognitive. It is the appropriate emotional response to having committed a moral violation.
      *   *Thorne:* Guilt is conative. It is a psychological mechanism to ensure future compliance with rules that generally maximise welfare.

  ### 4. Concrete Cases and Predictions

  For each crux, we have selected a concrete case where our views generate different predictions regarding the moral assessment of the leader.

  **Case A: The Ticking-Bomb Torture (Crux 1)**
  *   *Scenario:* A security chief authorises the torture of a detainee known to have information about a bomb set to detonate in a city centre. The bomb is found and defused.
  *   *Vance's Prediction:* The chief did the **obligatory** thing, but also committed a **moral wrong**. He should be prosecuted or punished in some formal sense, not because he shouldn't have done it, but because he *did* do it. His guilt is warranted.
  *   *Thorne's Prediction:* The chief did the **right** thing, full stop. Any punishment would be a backward-looking error, though a public reprimand might be useful to maintain the general prohibition for non-emergency cases. His guilt is unwarranted.

  **Case B: The Coventry Episode (Crux 1 & 2)**
  *   *Scenario:* Intelligence indicates a specific city will be bombed. Warning the city would reveal that the enemy's codes are broken, leading to greater losses later. The decision is made not to warn. (Note: We acknowledge the historiography is disputed; we treat this as a hypothetical based on the legend).
  *   *Vance's Prediction:* The leadership betrayed the citizens of that city. This betrayal is a genuine wrong, even if necessary. The state owes a specific debt of honour to the victims that cannot be washed away by the greater good.
  *   *Thorne's Prediction:* The leadership optimised the survival of the polity. To speak of 'betrayal' is emotive nonsense. The citizens were unfortunate casualties in a calculation that saved more citizens elsewhere. No specific debt of honour is owed beyond the general duty to win the war.

  **Case C: The Broken Election Promise (Crux 2)**
  *   *Scenario:* A Prime Minister explicitly promises not to raise taxes, then does so to avert a constitutional crisis and economic collapse.
  *   *Vance's Prediction:* The PM has dirty hands. She violated the democratic contract. She should feel personal guilt and perhaps resign after the crisis, acknowledging that she violated a trust to save the state.
  *   *Thorne's Prediction:* The PM did the right thing. If she feels guilt, it is only useful if it prevents her from breaking promises lightly in the future. If she sleeps soundly, knowing she saved the constitution, she is morally blameless.

  ### 5. On Sartre's Hoederer

  In Sartre's *Les Mains Sales*, Hoederer asks, in effect, whether anyone imagines they can govern innocently. We offer the following precise answers to this question, highlighting where our views diverge.

  **Dr Vance (Dirty-Hands Theorist):**
  *   **Answer:** No. One cannot govern innocently.
  *   **Reasoning:** Innocence implies a state of moral purity compatible with ordinary morality. Political office inevitably places the agent in situations where ordinary morality must be violated to fulfil political obligations. Therefore, to govern is to accept moral stain. Hoederer is correct that innocence is a fantasy; the effective leader must accept that they will be guilty of genuine wrongs.

  **Prof. Thorne (Consequentialist):**
  *   **Answer:** Yes, one can govern innocently, but one cannot govern *naively*.
  *   **Reasoning:** 'Innocence' in the sense of moral guilt is achievable if one consistently performs the action that maximises the good. If torture saves lives, the torturer is not guilty; they are clean. However, Hoederer is correct that one cannot be *naive*—one cannot ignore the brutal realities of power. Our disagreement lies here: Vance believes the brutal reality *stains* the soul; I believe the brutal reality is merely the terrain upon which the moral agent acts. If they navigate it correctly, they remain innocent of wrongdoing.

  **Where We Come Apart:**
  We come apart on the nature of the 'stain'. For Vance, the stain is ontological; the act of violating the prohibition changes the moral status of the agent permanently. For Thorne, the 'stain' is merely psychological or reputational; it has no bearing on the agent's actual moral standing, provided the calculus was correct. We agree, however, that the leader who claims to govern without getting their hands metaphorically dirty—by refusing to make hard choices—is unfit for office.

  ***

  **Signed,**

  **Dr Elena Vance**
  **Prof. Julian Thorne**
  **October 2023**
