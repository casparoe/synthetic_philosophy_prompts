      TO: Standards Committee
      FROM: [My Name/Role]
      RE: Findings on Democratic Backsliding and Formula Definition

      **I. Recommendations**

      The Committee should adopt the following findings regarding the four pending files:
      1.  **Hungary:** Backsliding **Established**.
      2.  **Poland:** Backsliding **Established**.
      3.  **Turkey:** Backsliding **Established**.
      4.  **United States:** Record **Insufficient**.

      Regarding the proposed Fourth Prong (Intent): The Committee should **Reject** its adoption.

      **II. Application of the Formula**

      **Hungary:**
      *   *Formal-Legality:* Pass. The 2010 election was contested; the 2011 Constitution and cardinal laws followed parliamentary procedure.
      *   *Ratchet:* Pass. Media control, district redistribution, and court reconstitution reinforce one another to favor the incumbent coalition.
      *   *Lock-in:* Pass. Cardinal laws require a two-thirds majority to undo, raising the cost of alternation above the cost of winning a simple majority.
      *   *Load-bearing fact:* The entrenchment of cardinal laws requiring supermajority repeal.

      **Poland:**
      *   *Formal-Legality:* Pass. The 2015 election was contested; legislation passed through the Sejm.
      *   *Ratchet:* Pass. Simultaneous control over public media and the judiciary (appointment, retirement, discipline) shifts power distribution toward the governing majority.
      *   *Lock-in:* Pass. Reconstituting the Constitutional Tribunal and National Council of the Judiciary prevents a subsequent bare majority from restoring prior judicial independence.
      *   *Load-bearing fact:* The restructuring of the National Council of the Judiciary to ensure political control over judicial appointments.

      **Turkey:**
      *   *Formal-Legality:* Pass. Measures adopted via referendum and legislation following a contested election, despite the state of emergency.
      *   *Ratchet:* Pass. Transition to an executive presidency consolidates decree and appointment powers, removing parliamentary checks.
      *   *Lock-in:* Pass. The executive structure raises the threshold for effective opposition control beyond a simple legislative majority.
      *   *Load-bearing fact:* The constitutional shift from a parliamentary to an executive presidency.

      **United States:**
      *   *Formal-Legality:* Pass. State statutes enacted via valid procedures.
      *   *Ratchet:* Fail/Insufficient. Measures are subnational and contradictory; some jurisdictions tightened access, others expanded it. No national shift toward incumbents is demonstrable.
      *   *Lock-in:* Fail/Insufficient. State laws are generally reversible by subsequent state legislatures; no permanent national lock-in is established.
      *   *Load-bearing fact:* The federal structure prevents a unified finding of national incumbency advantage.

      **III. Evaluation of the Formula**

      **The Fourth Prong (Intent):**
      The Chair proposes requiring proof that the government acted with the *purpose* of entrenchment. This should be rejected. Intent is subjective and evidentiary, whereas the existing three prongs measure objective structural effects. A law that locks in power damages democratic alternation regardless of the sponsor's stated motive. Adding an intent condition creates a safe harbor for actors who can articulate a public-interest justification for structural advantages. The existing formula captures the harm without requiring mind-reading.

      **The Mirror Test:**
      Consider a government elected on a reform platform that abolishes an unelected upper chamber, introduces automatic voter registration, and bans an extremist party.
      *   *Abolishing an unelected chamber* reduces lock-in (lowering the barrier to legislative change).
      *   *Automatic voter registration* reduces lock-in (lowering the barrier to voting).
      *   *Banning a party* triggers scrutiny. If the ban raises the cost of alternation for a viable opposition, it triggers the Lock-in condition. If it targets a non-viable violent group, it does not.
      *   *Conclusion:* The formula does not flag popular reforms unless they structurally entrench the incumbent. This demonstrates that the formula measures *entrenchment*, not policy unpopularity. The charge that backsliding is a label applied only to the other side is **answered** by the structural specificity of the Lock-in condition.

      **Baseline for the Ratchet Condition:**
      The comparison must be the *status quo ante* immediately before the measures. Using an independent standard of fairness would require the Committee to adjudicate the inherent fairness of member states' founding constitutions (e.g., malapportioned upper chambers or electoral colleges). Such background entrenchment predates the episode and falls outside the mandate to prevent *retrogression*. This baseline protects the Committee from becoming a constitutional convention for member states, though it means pre-existing structural defects are invisible to this specific formula.

      **Blind Spots:**
      The Committee must be disciplined about what the formula cannot see. It does not capture:
      1.  Erosion driven by private actors (e.g., media ownership concentration without state mandate).
      2.  Violence or intimidation not codified in law.
      3.  Subnational retrogression in federal states where national incumbency is not affected (see United States file).
      4.  Slow drift where no single legislative package triggers the Ratchet condition.
      5.  Background entrenchment that predates the current government.
      These are real harms, but they are not *constitutional retrogression via legislation*, which is the specific jurisdiction of this Clause.

      **IV. Operational Decisions**

      1.  **Burden of Proof:** The Secretariat bears the burden to propose a finding; the Member State bears the burden to rebut with evidence of reversibility or lack of incumbency advantage.
      2.  **Standard of Proof:** Clear and convincing evidence.
      3.  **Constitutional Court Validation:** A ruling by a member state's constitutional court upholding the measures counts as evidence against a finding, but is not dispositive. A captured court cannot validate away a lock-in effect.
      4.  **Subsequent Elections:** A subsequent election won by incumbents under the challenged rules does *not* defeat a finding. The formula tests whether losing an election means leaving office on the same terms; winning under skewed rules confirms the skew.
      5.  **Review:** Findings carry a mandatory review date set for the conclusion of the next general election cycle in the member state.

      **V. Counter-Arguments**

      **Hungary:**
      *   *Argument:* The government possessed a two-thirds majority mandate from the electorate. Constitutional change is the exercise of democratic sovereignty, not backsliding. The voters authorized the new rules.
      *   *Response:* **Outweighed.** A single election mandate cannot authorize permanent constraints on future majorities. The Lock-in condition specifically protects the right of future voters to change government on equal terms. Sovereignty is continuous, not exhausted in one election.

      **Poland:**
      *   *Argument:* The judiciary required reform to correct post-communist excesses and inefficiencies. The measures were substantive policy corrections, not entrenchment.
      *   *Response:* **Answered.** Correction cannot equal incapacitation. While judicial reform is permissible, restructuring appointment bodies to ensure political control prevents the judiciary from acting as a check on future governments. This triggers the Ratchet and Lock-in conditions regardless of the stated policy goal.

      **VI. Conclusion**

      The three-part formula survives contact with the pending files. It distinguishes between democratic turnover and structural entrenchment. The addition of an intent condition would weaken its objective application. The Committee should proceed with findings where the structural conditions are met and acknowledge the limits of the instrument regarding subnational or non-legislative erosion.

