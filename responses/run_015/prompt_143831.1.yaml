answer: |-
  The security case presupposes a causal model in which measurement settings are exogenous variables probabilistically independent of any hidden variables determining the outcomes, distinct from and irreducible to the condition of local causality.

  1.  The independence of the settings is a separate assumption from locality, often termed Measurement Independence or the Free Choice assumption, and treating it as such is not arbitrary but structurally necessary for the causal inference. Locality (or Local Causality) constrains influences propagating between the separated laboratories during the measurement round, whereas Measurement Independence constrains the causal history prior to the round, asserting that the setting generators are not effects of the common cause $\lambda$ that prepares the devices. This asymmetry is coherent because the protocol treats the settings as interventions—inputs from outside the physical system being modeled—while granting the adversary complete knowledge of the system's internal state. If settings were correlated with $\lambda$, the adversary could exploit that correlation to simulate a violation deterministically, so the security case rests on the claim that the setting choice is causally upstream of and isolated from the device preparation, a condition not guaranteed by no-signalling alone.

  2.  The security proof consumes a hidden-variable-level condition equivalent to Parameter Independence, not merely the operational no-signalling condition observed in the marginals. Operational no-signalling ensures that the public statistics do not reveal communication, but if the adversary knows the hidden variables $\lambda$, she could exploit a dependence of one output on the remote setting conditional on $\lambda$ even if that dependence washes out in the average statistics. Therefore, the standard forbids Parameter Dependence at the level of the adversary's information (the hidden variables), while leaving Outcome Independence open to accommodate quantum entanglement. A deterministic pilot-wave theory violates this forbidden condition because the particle positions (the hidden variables) guide outcomes nonlocally based on the remote setting, meaning a pilot-wave-aware adversary could predict the outputs despite operational no-signalling.

  3.  The engineers' asymmetry in treating the anomalies derives from the implicit commitment to Quantum Mechanics as the complete physical theory and to the locality of relevant common causes. Case (a) implies a violation of Measurement Independence, suggesting the settings or device states are correlated with a cosmological common cause (the fixed stars), which the standard rules out by assuming relevant common causes are local to the laboratory environment; accommodating this would require expanding the causal model to include cosmic variables or trusting the randomness source less. Case (b) implies a violation of the Tsirelson bound, which the standard treats as a bug because it presupposes Quantum Mechanics is true and complete; accommodating this would require abandoning the quantum security bound in favor of a general no-signalling bound, which typically yields weaker randomness certification or implies superluminal signalling is present.

  4.  The practice strictly requires that outcomes are not determined by the adversary's information, which rules out local hidden-variable theories and nonlocal theories where the adversary knows the hidden variables, but fits well with standard Quantum indeterminism. It presupposes single definite outcomes because the certification produces a specific string of bits, a notion that becomes problematic in a many-worlds view unless interpreted as randomness relative to a branch, though the security proof itself operates on the assumption of a single history. If rebuilt to drop setting independence, the standard would require a weak randomness source for expansion rather than full certification; if rebuilt to grant the adversary hidden-variable information, nothing could be certified as the system would be deterministic relative to her; if rebuilt to accept supra-quantum violations, the security bound would shift to principles like Information Causality, but the guarantee of privacy would diminish without a new physical theory to limit the adversary's knowledge.

  I am 90% confident in this reconstruction overall, and I am least sure about the claim that the practice strictly presupposes single definite outcomes rather than merely requiring a single observed history compatible with a many-worlds interpretation.
