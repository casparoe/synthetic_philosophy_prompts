      *   The vulnerability lies in the "non-natural" commitment and the claim that naturalism *necessarily* collapses the distinction.

  3.  **Brainstorming Defeaters/Challenges:**

      *   *Naturalized Epistemology (Quine/Churchland):* They argue we *can* explain normativity naturalistically (e.g., homeostatic property clusters, predictive processing).
