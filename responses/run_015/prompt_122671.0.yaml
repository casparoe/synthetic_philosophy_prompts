answer: |-
  # Adversarial Collaboration: Interface Fictionalism vs. Render Realism

  ## 1. Agreed Claims
  Both camps endorse the following methodological and ontological commitments. Denial of any claim below constitutes exit from the collaboration.

  1.  **The Rendering Stage:** There exists a specific computational stage in neural processing where information is formatted for global access and report. Both camps agree this stage exists; disagreement concerns whether properties of this stage exhaust the facts of consciousness.
  2.  **Report Fallibility:** First-person reports are causal outputs of the system, subject to noise, memory decay, and conceptual limitation. They are data points, not infallible verdicts on internal states.
  3.  **No Homunculus:** The "rendering" is not inspected by an inner agent. Any talk of "viewing" the rendering must be cashed out in terms of downstream computational access (e.g., speech planning, motor control).
  4.  **Temporal Granularity:** Conscious reports have a coarser temporal resolution than early sensory discrimination. Both camps agree neural discrimination often precedes reportable awareness; disagreement concerns whether the *experience* precedes the report or is constructed by it.
  5.  **Empirical Richness:** The question of whether experience is rich (dense information) or sparse (summary only) is partly empirical. Neither side assumes sparsity or richness a priori; both accept that experiments limiting attentional bandwidth bear on the dispute.
  6.  **Causal Closure:** Physical effects have sufficient physical causes. Neither side posits magic; disagreement concerns whether the qualitative character of the rendering plays a distinct causal role beyond its computational structure.

  ## 2. Residual Disagreements

  | Issue | Camp U (Interface Fictionalist) Formulation | Camp R (Render Realist) Formulation | Genuine or Verbal? | Dependent Crux |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ontological Status** | Experience is the rendering process itself; no extra fact exists about "what it's like" beyond the functional summary. | Experience includes the rendering process plus an intrinsic qualitative character not exhausted by function. | Genuine | Render-Invariance |
  | **Temporal Location** | Experience is retrospective; the "now" of experience is a post-hoc construction aligning with report readiness. | Experience is occurrent; the lag is in the report channel, not the experience itself. | Genuine | Lag |
  | **Vocabulary Source** | Report vocabulary is task-general interface language (icons), not a readout of intrinsic quality. | Report vocabulary attempts to map intrinsic quality, limited only by linguistic bandwidth. | Verbal/Genuine Mix | Substitution |
  | **Subjecthood** | The "user" is the action-selection subsystem accessing the interface. | The "user" is the unified subject to whom qualities appear. | Verbal | User |
  | **Causal Power** | Qualitative character is causally inert; only the computational structure drives behavior. | Qualitative character is causally relevant; removing it changes the system's nature. | Genuine | Efficacy |

  ## 3. Cruxes

  ### The Lag Crux
  **Case:** Backward masking experiments where a stimulus is discriminated above chance (priming) but not reported, alongside Libet-style timing where reportable awareness lags neural onset by ~300ms.
  **U Prediction:** Reports of "when" the stimulus appeared will shift to align with the time of report-availability, not stimulus onset. Experience is constructed at the moment of global access.
  **R Prediction:** Reports of "when" will track stimulus onset even if delayed, provided memory is controlled. The experience occurred at onset; the report lagged.
  **Analysis:** This is genuine. If U is correct, manipulating the timing of the global access window should shift the reported time of experience independently of stimulus timing. R must deny this shift is possible without altering the experience itself.

  ### The Substitution Crux
  **Case:** Congenitally blind subjects trained on sensory substitution devices (e.g., camera-to-tongue) achieving sight-level discrimination.
  **U Prediction:** Reports will converge on structural terms ("edge," "motion," "depth") but diverge on qualitative terms ("red," "bright"). They are learning the same interface vocabulary, not acquiring visual qualia.
  **R Prediction:** Reports will converge on both structure and qualitative descriptors. The functional role determines the qualitative character; if the discrimination is identical, the experience is visual.
  **Analysis:** This is the strongest empirical test. I predict **U will be vindicated here**. Subjects typically describe the sensation as "tingling" or "pressure" even when interpreting it as shape. Convergence on *interpretation* does not prove convergence on *rendering character*. U explains this naturally: the interface icons are being mapped to different sensory inputs.

  ### The Render-Invariance Crux
  **Case:** Two systems are probe-identical (same behavior, reports, neural structure) but differ in whether the rendering has intrinsic character.
  **U Prediction:** No difference in consciousness. If the rendering process is identical, consciousness is identical.
  **R Prediction:** Possible difference. One could be a zombie system lacking the intrinsic character despite functional identity.
  **Analysis:** This is **undecidable empirically** by construction. If systems are probe-identical, no test distinguishes them. This crux reveals the metaphysical stalemate. However, the verbal confusion lies in "rendering." If U defines rendering as "functional summary" and R defines it as "functional summary + intrinsic feel," they are talking past each other. The factual disagreement survives only if R can specify a physical correlate of "intrinsic character" that U denies exists. Until then, this is a metaphysical axiom clash, not a scientific hypothesis.

  ### The User Crux
  **Case:** Defining the beneficiary of the interface without a homunculus.
  **U Story:** The "user" is the planning and motor-control subsystem. It queries the rendering to select actions. No unity required beyond data integration.
  **R Story:** The "user" is the subject of experience. Unity is a primitive feature of the rendering, not just data integration.
  **Analysis:** Mostly verbal. Both reject a little man. The disagreement reduces to whether "subjecthood" requires intrinsic unity (R) or is just a label for integrated access (U). I recommend reformulating this as: "Does the system behave *as if* it is unified because it is modeled as such (U), or because the experience forces unity (R)?" This moves it to the Efficacy crux.

  ### The Efficacy Crux
  **Case:** Does the qualitative character drive behavior, or does the computational structure drive behavior while carrying quality as a passenger?
  **U Prediction:** Qualia are epiphenomenal shadows. Removing the "feel" but keeping the computation changes nothing in behavior.
  **R Prediction:** Qualia are causally potent. The "feel" is part of the computational state that drives behavior.
  **Analysis:** Genuine, but hard to isolate. If R claims qualia are physical properties of the rendering, U asks why those properties aren't just captured by the computational description. If R claims they are non-physical, they violate causal closure. R must argue that the qualitative character is a physical property not captured by current functional descriptions.

  ## 4. Commitments and Verdicts

  Having laid out the terrain, I offer the following commitments regarding the path forward.

  **On Genuineness:** The **Lag** and **Efficacy** cruxes are genuine empirical disagreements. The **Render-Invariance** crux is currently a metaphysical stalemate; it cannot be tested without a physical marker for "intrinsic character." I classify it as undecidable until Camp R provides a non-functional physical correlate. The **User** crux is largely verbal; both sides describe the same architecture using different metaphors ("control module" vs. "subject").

  **On Wording:** Camp R's wording does more work than it admits. By insisting on "intrinsic character" without specifying how it differs physically from the functional rendering, R risks shielding their claim from falsification. Camp U's wording is tighter but risks explaining away the phenomenon entirely. U must admit that the "illusion" is a real neural process with real effects, not nothing.

  **On Movement:** I expect **Camp R to move first** on the Substitution Crux. If blind subjects consistently report non-visual qualia despite visual-level discrimination, R must concede that functional role does not fully determine qualitative character. This would force R to abandon pure functionalism regarding qualia, pushing them toward a specific neural-correlate view that U might accept as just "the rendering mechanism."

  **On Substitution:** I predict specifically that sensory substitution users will **never** spontaneously report "seeing" in the qualitative sense without prompting. They will report "knowing where the object is" via tongue sensations. This favors U: the interface vocabulary ("object," "edge") is shared, but the rendering medium (qualia) remains tied to the input modality.

  **On Render-Invariance:** I judge this crux to be **badly posed** as a testable hypothesis. It is a philosophical intuition pump, not a scientific crux. I replace it with the **Compression Crux**: Can we compress the neural data of the rendering stage without altering reports? U says yes (it's a summary); R says no (loss of data alters the quality). This is testable via neural decoding. If we can simplify the neural pattern while maintaining reportable content, U wins. If quality degrades before report fails, R wins.

  **Final Stand:** The collaboration should pivot away from metaphysical zombies (Render-Invariance) and toward the **Compression** and **Substitution** cases. These offer traction. If U is right, consciousness is a specific type of data compression for action. If R is right, consciousness is a specific type of physical state that resists compression without loss. That is a fight worth having.
