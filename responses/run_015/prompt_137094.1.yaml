  The data rejects epistemicism (coin case) and simple bivalence (sea battle). It retains classical logic (Excluded Middle) while allowing truth-value gaps. This points strongly to supervaluationism over branching time. However, the eclipse case suggests determinism closes the branches. The conditional verdict implies strict implication across histories, not material implication. The relativity verdict implies a privileged present for assessing settledness. Candidates: (1) Supervaluationism (truth = supertruth across histories), (2) Nomic Settledness (truth = necessitation by current state + laws), (3) Macro-Stability (truth = invariant macro-outcome). The tension lies in whether micro-chance prevents truth when macro-outcomes converge. The conditional verdict is the hardest constraint: how can $P \to Q$ be true if $Q$ is gappy? Only if $P$ settles $Q$ across histories.

  2. **The rules that fit**
  1. **Supervaluationism:** A future proposition is true iff it holds in all historically possible futures consistent with the present. False iff false in all. Otherwise, it lacks a truth value. Logical compounds like $P \lor \neg P$ are true because they hold in every history, even if $P$ itself varies. Conditionals are true if the consequent holds in all histories where the antecedent holds. This handles the Sea Battle (divergent histories) vs. Eclipse (convergent histories).
  2. **Nomic Settledness:** A proposition is true iff the current physical state plus laws of nature strictly necessitate it. The past is necessitated by current traces (Coin). The future is gappy unless deterministic laws fix the outcome. Micro-indeterminacy prevents truth, even if macro-outcomes align.
  3. **Macro-Stability:** Truth supervenes on macro-outcomes. If every physically possible micro-history yields the same macro-result, the proposition is true, regardless of micro-chance. This diverges from Nomic Settledness on case (ii).

  3. **What each predicts**
  **Main Case:** All rules verdict **Gap**. The outcome depends on chancy processes, so it's not necessitated nor true in all histories.
  **(i) 90% Chance:** All rules verdict **Gap**. High probability does not equal settledness or supertruth. Truth is binary or gappy, not graded.
  **(ii) 100% Macro:** Supervaluationism and Macro-Stability verdict **True** (all histories/paths lead to landfall). Nomic Settledness verdicts **Gap** (laws don't strictly necessitate it due to micro-chance). This is a key divergence point.
  **(iii) Prophecy:** All rules verdict **Gap** at utterance. The Admiral's choice is open *then*. The fact that the bulletin causes the battle does not make the bulletin true *when issued*, unless one accepts retro-truth (which contradicts the Sea Battle verdict). The conditional "If bulletin, battle" might be true, but the categorical prediction is not.

  4. **Your best guess**
  She is running **Supervaluationism**. It is the only view that cleanly explains the Excluded Middle verdict alongside the Sea Battle gap. Nomic Settledness struggles to explain why the conditional "If order, battle" is true if the order isn't necessitated; Supervaluationism handles this via strict implication across histories where the order is given. The Eclipse is simply a case where all histories converge. The relativity verdict fits the requirement to evaluate truth relative to a privileged "now" slice of the branching tree.

  5. **The tie-breaker**
  **Case:** One year later, looking back at the storm morning: "It was true then that the storm would land."
  **Supervaluationism:** **False.** At the time of utterance, the proposition lacked a truth value. It is now settled that the storm landed, but not that it was *true* it would.
  **Thin Red Line (Ockhamism):** **True.** There was a unique actual future all along; we just couldn't know it.
  **Nomic Settledness:** **False.** It wasn't necessitated then.
  This separates views on whether truth values are retroactively acquired or permanently absent. If she says "Yes, it was true," she abandons Supervaluationism for a Thin Red Line view disguised by epistemic humility.

  6. **Loose ends**
  The conditional verdict is unstable. If "Battle" is gappy, "If Order, Battle" is true only if the Order *settles* the Battle. She must explain how an open future allows settling conditionals without collapsing into determinism. Also, is "neither" a third value or a gap? If gaps, Excluded Middle holds. If third value, it might not. Her Excluded Middle verdict confirms gaps, but her conditional verdict risks implying a connection that looks suspiciously like necessitation.
