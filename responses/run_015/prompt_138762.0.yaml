prompt: |-
  I got roped onto the conduct committee of my housing co-op last fall (28 units, we rotate, two-year terms, and I somehow ended up chairing it this spring) and I need something I can actually run, not theory. Here's the setup: members file written complaints against other members about shared-life stuff — noise, missed chore shifts, common-room hogging, dishes, the group chat, bikes in the hallway. We meet one evening a month, read the pile, and we either dismiss, mediate, or sanction (a formal letter, and in bad cases loss of common privileges). Any sanction needs a two-thirds vote plus a one-page written rationale that goes to both parties and gets read out at the next house meeting, and anyone can appeal to the whole co-op at the AGM. Nobody on the committee has any philosophy background, we've got about three hours and no budget, and whatever we write has to be readable by an angry neighbour at 10pm.

  The thing I keep geting stuck on is hypocrisy, and specifically whether someone who does the same thing themselves has any standing to complain at all. We've been informally applying a "clean hands" thing — if you've done it too, your complaint gets tossed — and its obviously doing damage. It's become the first move for anyone who wants their case dropped, the members who are held to the highest standard most often lose their complaints, and last month we dismissed a noise complaint against a guy who has been making everyone's life miserable for a year because the complainant once threw a loud party. Then there are the versions I can't handle at all: half the time the person didn't do the same thing, they did a neighbouring thing (they hoard the common room but are complaining about dishes); or they did it two years ago and genuinely stopped; or they openly admit what they did versus being in total denial about it; or they're complaining on behalf of someone else who is completely clean; or the complaint is about how they personally were treated versus about how the house is running. And then there's us — the committee — which has ignored this exact category of behaviour when the person doing it was popular. I want to know whether that's even the same question or whether I'm confusing two different things.

  So: please write me a decision procedure, in plain language, that my committee can run on a complaint in about fifteen minutes and that tells us when a complainant's own conduct defeats or weakens their complaint and when it's just noise we should ignore. It should say what order to ask things in, what counts as an adequate answer to each question, where we stop and dismiss, and where the procedure has to hand the decision to a person because it's a question about what kind of house we want to be rather than a matter of fact. Please be explicit about which distinctions it has to preserve — I suspect "they don't really believe the norm," "they have no right to hold you to it," and "the complaint is true and apt but they shouldn't be the one saying it" come apart, and I suspect "did the same thing" is the wrong test in at least three different ways, but you tell me which ones. Also tell me what to do when we can't tell whether two bits of conduct are the "same" norm violation, and whether a complainant can get standing back by owning what they did.

  Then run it on three cases, and I want at least one to come out in a way I will hate, because I'd rather find that out now than at a house meeting. One: a member with four months of missed chore shifts files against a member who missed two. Two: a member who is a notorious common-room hoarder files a documented complaint about someone leaving dirty dishes in the sink for a week — different rule, same family of sloppiness. Three, the one I expect to dislike: a founding member who was repeatedly noisy in 2023 and was never sanctioned, because the committee that year let it slide, now files a strong and well-documented noise complaint against a newer member, and the target's entire defense is "look at what she did." For that one I want to know both whether her complaint stands and whether we as a committee have any business sanctioning anyone for noise given our own record, and if those are two separate questions please say so and say which one we should answer first. Finally, be honest about where the procedure is philosophy dressed up as a checklist, which steps are really us choosing what to value, and what it just can't settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Housing co-op conduct committee (28 units, rotating members, no philosophy background).
      *   **Task:** Create a practical decision procedure (checklist/flowchart style) for handling complaints, specifically addressing the "clean hands" / hypocrisy issue.
      *   **Constraints:** Plain language, runnable in ~15 minutes per complaint, readable by angry neighbors, no budget, 3-hour meeting limit total (so efficiency is key).
      *   **Specific Problems to Solve:**
          *   Current "clean hands" rule is causing damage (dismissing valid complaints because complainant sinned too).
          *   Nuance needed: Same violation vs. neighboring violation, past vs. present, admitted vs. denied, proxy complaints, personal treatment vs. house rules.
          *   Committee hypocrisy (ignoring behavior for popular people).
          *   Distinctions needed: "Don't believe the norm" vs. "No right to hold you to it" vs. "True complaint but wrong messenger."
          *   "Same norm violation" ambiguity.
          *   Restoring standing (owning past mistakes).
      *   **Deliverables:**
          *   The Decision Procedure (step-by-step).
          *   Explanation of distinctions preserved.
          *   Application to three specific cases (one must be unpopular/uncomfortable).
          *   Honest reflection on where philosophy hides in the checklist and what can't be settled.

  2.  **Deconstruct the "Clean Hands" Problem:**
      *   *Current Rule:* If you did it, you can't complain. (Result: Chaos, worst offenders silence best critics).
      *   *Better Principle:* Standing depends on *current commitment to the norm*, not *perfect past adherence*.
      *   *Key Distinction:* Is the complaint about *rule enforcement* or *moral superiority*? Co-ops need rules enforced, not saints judging sinners.
      *   *Hypocrisy Types:*
          1.  *Tu Quoque (You too):* "You did it too." (Irrelevant to whether the rule was broken now).
          2.  *Inconsistency:* "I say don't do X, but I do X." (Undermines authority, but doesn't make X okay).
          3.  *Selective Enforcement:* "We only punish people we dislike." (Procedural injustice).

  3.  **Drafting the Decision Procedure (The "15-Minute Filter"):**
      *   *Goal:* Move from "Is the complainant a hypocrite?" to "Is the rule broken and do we need to act?"
      *   *Step 1: Threshold.* Is this a rule violation? (If no, dismiss).
      *   *Step 2: Evidence.* Is there proof? (If no, dismiss/mediate).
      *   *Step 3: The "Clean Hands" Check (The Core).* Instead of "Did they do it?", ask "Are they currently violating the *same* norm?"
          *   *Refinement:* Differentiate between *ongoing* violation and *past* violation.
          *   *Refinement:* Differentiate between *same* norm and *different* norm.
      *   *Step 4: Committee Integrity.* Are *we* enforcing consistently?
      *   *Step 5: Sanction Decision.* Based on the act, not the accuser.

      *Drafting the Steps (Mental Iteration):*
      *   *Attempt 1:* 1. Did they break the rule? 2. Did complainant break the rule? 3. If yes, dismiss. -> *Too blunt, repeats current problem.*
      *   *Attempt 2:* 1. Is the complaint valid? 2. Is the complainant a hypocrite? 3. If hypocrite, warn them but proceed. -> *Better.*
      *   *Attempt 3 (Final Polish):* Focus on "Current Standing."
          *   Q1: Is the alleged behavior a violation?
          *   Q2: Is the complainant *currently* violating the *same* specific rule?
          *   Q3: If yes to Q2, have they acknowledged it and are they trying to fix it?
          *   Q4: Is this about the rule or personal spite?

      *Let's make it more robust based on the prompt's specific pain points.*
      *   Need to address "neighboring norms" (dishes vs. common room).
      *   Need to address "past vs. present" (2023 noise vs. now).
      *   Need to address "committee hypocrisy."

      *Revised Procedure Structure:*
      1.  **Validity Check:** Is this a rule? Is there evidence?
      2.  **Standing Check (The Hypocrisy Filter):**
          *   Same Rule?
          *   Current vs. Past?
          *   Acknowledged vs. Denied?
      3.  **Committee Check:** Are we being consistent?
      4.  **Outcome:** Dismiss, Mediate, Sanction.

  4.  **Addressing the Specific Distinctions:**
      *   "Don't believe the norm" (Active saboteur) vs. "No right to hold you to it" (Legalistic standing) vs. "True complaint/wrong messenger" (Hypocrisy).
      *   The procedure needs to separate *validity of the charge* from *credibility of the charger*.
      *   *Crucial realization:* In a co-op, *any* member can report a violation. It's not a court of law where standing is strict. It's community maintenance. The "Clean Hands" doctrine is legally specific and morally toxic in community living. The goal is *compliance*, not *purity*.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Chores):* Complainant (4 missed) vs. Target (2 missed).
          *   *Analysis:* Same rule. Complainant is *currently* violating.
          *   *Outcome:* Complaint stands (rule is rule), but Complainant gets flagged for their own violations. *Unpopular result:* The hypocrite wins the point, but loses the war.
      *   *Case 2 (Hoarding vs. Dishes):* Complainant (Hoarding) vs. Target (Dishes).
          *   *Analysis:* Different rules. "Sloppiness" is a vibe, not a rule.
          *   *Outcome:* Complaint stands fully. Hoarding is irrelevant to dishes.
      *   *Case 3 (Founder Noise):* Complainant (Past noise, no sanction) vs. Target (Current noise). Defense: "You did it."
          *   *Analysis:* Past vs. Present. Committee failure then vs. Target violation now.
          *   *Outcome:* Complaint stands. Committee must admit past failure. Target is still liable. *This is the one the user might hate:* The Founder gets to enforce a rule they broke, but the Committee has to eat crow.

  6.  **Refining the "Philosophy vs. Checklist" Honesty:**
      *   Where is the philosophy? In the definition of "Same Norm." In the decision to value "Rule of Law" over "Moral Purity."
      *   What can't be settled? Whether the community wants to be punitive or restorative. The checklist assumes rules matter more than feelings.

  7.  **Finalizing the Tone:**
      *   Direct, practical, slightly bureaucratic but human.
      *   Avoid jargon like "tu quoque" in the checklist itself, save for the explanation.
      *   Ensure the "Committee Hypocrisy" part is explicit.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 15 minutes realistic?
      *   *Fix:* Make the "Standing" section a quick Yes/No flow. If it gets complicated, push to Mediation, not Sanction.
      *   *Critique:* Did I answer the "Standing back" question?
      *   *Fix:* Add a specific step about "Acknowledgement restores standing."
      *   *Critique:* Did I handle the Committee's own hypocrisy?
      *   *Fix:* Add a "Mirror Check" step before sanctioning.

  9.  **Final Polish:** Check against all constraints in the prompt. (Plain language, 3 cases, specific distinctions, honesty about philosophy). *Self-correction: Ensure Case 3 explicitly separates the Complainant's standing from the Committee's liability.*

  **(Self-Correction on Case 1):** The prompt says "One: a member with four months of missed chore shifts files against a member who missed two." If I say the complaint stands, the user might hate it because it rewards a slacker. But if I dismiss it, I reinforce the "Clean Hands" toxicity. The philosophical honest answer is: The rule was broken, so the fact stands. But the Complainant should *also* be sanctioned. I need to make sure the procedure allows for *cross-sanctioning* or at least flagging the complainant. Actually, the prompt asks about the *complaint*. Does the complaint stand? Yes. Does the complainant get off scot-free? No. I need to make sure the procedure triggers a review of the *complainant* too.

  **(Self-Correction on Case 3):** The user expects to dislike this one. The result should be: Founder's complaint is valid (past sin doesn't erase current rule), BUT the Committee must acknowledge they failed before. This exposes the Committee's weakness. That's the "hate" part.

  Let's write it.
answer: |-
  Here is a decision procedure designed for your specific constraints. It is built to kill the "Clean Hands" defense without letting actual bad actors run wild, and it forces the committee to look in the mirror before punishing others.

  ### The "15-Minute Filter" Decision Procedure

  **Instructions:** Read the complaint and the response. Go through these four steps in order. Do not skip ahead. If you stop at "Dismiss," you are done. If you reach "Sanction," you must write the rationale.

  #### Step 1: The Rule Check (Fact, not Feeling)
  *   **Q1:** Is there a written agreement, policy, or explicit house rule that covers this behavior?
      *   *No:* **Dismiss.** (You cannot sanction for "vibes" or "being a jerk" unless it violates a specific rule. Refer to mediation).
      *   *Yes:* Proceed to Q2.
  *   **Q2:** Is there objective evidence (logs, photos, third-party witnesses, admission) that the *Target* broke this rule?
      *   *No:* **Dismiss.** (Insufficient evidence. Do not investigate further).
      *   *Yes:* **The Violation is Established.** Proceed to Step 2.

  #### Step 2: The Standing Check (The Hypocrisy Filter)
  *This step determines if the Complainant's behavior stops you from acting. The goal is not purity; it is consistency.*

  *   **Q3:** Is the Complainant *currently* violating the **exact same rule**? (Not a similar vibe, not a different rule, the specific same one).
      *   *No:* **Complainant has Standing.** Proceed to Step 3.
      *   *Yes:* Proceed to Q4.
  *   **Q4:** If they are violating the same rule, have they acknowledged it and are they on a documented plan to fix it?
      *   *Yes (Acknowledged & Fixing):* **Complainant has Standing.** (We reward honesty and improvement). Proceed to Step 3.
      *   *No (Denial or Ongoing Violation):* **Complainant has Weak Standing.**
          *   *Action:* You may **not dismiss** the complaint based solely on this. A broken rule is still a broken rule.
          *   *Modification:* You must **also open a file on the Complainant** for the same violation.
          *   *Decision:* Proceed to Step 3, but note that sanctioning the Target without sanctioning the Complainant is prohibited unless there is a specific reason (e.g., Complainant is on a probationary plan).

  #### Step 3: The Mirror Check (Committee Integrity)
  *This step addresses your own hypocrisy. You cannot punish what you tolerate.*

  *   **Q5:** Has the Committee knowingly ignored this specific violation by other members in the last 12 months?
      *   *No:* Proceed to Step 4.
      *   *Yes:* **Stop.** You cannot sanction the Target yet.
          *   *Action:* You must draft a "Notice of Enforcement Reset." This states: *"We have not been enforcing Rule X consistently. Effective today, we are resuming enforcement. This Target is the first case under the reset."*
          *   *Reasoning:* You cannot punish someone for a rule you have treated as optional. You must announce the rule is "back on" before you strike.
          *   *Decision:* Mediate this specific instance (warn the Target) but do not Sanction (fine/privilege loss) until the Reset Notice has been read at a house meeting.

  #### Step 4: The Outcome (Sanction vs. Mediate)
  *   **Q6:** Is this a first-time offense for the Target (in the last 2 years)?
      *   *Yes:* **Mediate.** (Send a warning letter, facilitate a chat).
      *   *No:* **Sanction.** (Formal letter, loss of privileges, etc., per your bylaws).
      *   *Exception:* If Step 2 (Weak Standing) applied, you must sanction the Complainant simultaneously or dismiss both.

  ***

  ### The Distinctions This Preserves

  You suspected "did the same thing" was the wrong test. You were right. Here is what the procedure separates:

  1.  **Same Norm vs. Neighboring Norm:** Step 2, Q3 forces you to match the *rule*, not the *vibe*. Hoarding the common room is not the same rule as leaving dishes in the sink. One is about space allocation, the other is about hygiene/flow. If they are different rules, the Complainant has full standing. This stops "Whataboutism" (e.g., "You left dishes out!" "Well you left your bike in the hall!").
  2.  **Current vs. Past Violation:** Step 2 distinguishes between someone currently breaking the rule and someone who did it two years ago. Past sin does not remove standing unless the norm is "never sin." Your co-op norm is "follow the rules now."
  3.  **Denial vs. Acknowledgement:** Step 2, Q4 is the "Redemption Clause." If I admit I miss chore shifts and I'm working on it, I can still complain about *your* missed shifts. If I deny I miss shifts while missing them, I have weak standing. This rewards honesty.
  4.  **Validity of Charge vs. Credibility of Charger:** The procedure decouples these. A liar can tell the truth. If the Target broke the rule (Step 1), the rule was broken. The Complainant's hypocrisy doesn't fix the sink. However, Weak Standing (Step 2) triggers a review of the Complainant, so they don't get a free pass.
  5.  **Committee Liability vs. Target Liability:** Step 3 (The Mirror Check) separates the Target's guilt from the Committee's negligence. The Target might be guilty, but if the Committee is negligent, sanctioning is unjust. This forces you to fix your own enforcement before punishing a member.

  ***

  ### Running the Cases

  Here is how the procedure runs on your three scenarios.

  #### Case 1: The Chore War
  *   **Setup:** Complainant (4 months missed shifts) vs. Target (2 months missed shifts).
  *   **Step 1:** Rule exists? Yes. Evidence? Yes. **Violation Established.**
  *   **Step 2:** Complainant currently violating same rule? **Yes.** (4 months missed).
      *   Acknowledged/Fixing? **No** (Presumably, or they wouldn't be complaining without shame).
      *   **Result:** **Weak Standing.**
  *   **Action:** You cannot dismiss the complaint. The Target *did* miss shifts. However, you **must open a file on the Complainant** for their 4 missed months.
  *   **Step 4:** Sanction? If you sanction the Target for 2 months, you **must** sanction the Complainant for 4 months.
  *   **Outcome:** Both get sanctioned. The complaint "succeeds" in proving the rule was broken, but the Complainant pays a higher price.
  *   **Why you might hate it:** It feels like rewarding a slacker to let them file the complaint. But the alternative is that *no one* can enforce chore shifts unless they are perfect, which means chore shifts never get enforced.

  #### Case 2: The Sloppy House
  *   **Setup:** Complainant (Common Room Hoarder) vs. Target (Dirty Dishes for a week).
  *   **Step 1:** Rule exists? Yes (Dishes). Evidence? Yes. **Violation Established.**
  *   **Step 2:** Complainant currently violating *same* rule? **No.**
      *   Hoarding is "Common Room Use." Dishes is "Kitchen Hygiene." These are different rules.
      *   **Result:** **Full Standing.**
  *   **Step 3:** Mirror Check. Have you ignored dishes? (Assume No).
  *   **Step 4:** Outcome. Sanction or Mediate based on Target's history.
  *   **Outcome:** Complainant wins. The Target's defense ("You hoard the sofa!") is irrelevant noise.
  *   **Why this works:** It stops the "General Sloppiness" defense. You are enforcing specific agreements, not judging character.

  #### Case 3: The Founder's Noise (The One You'll Dislike)
  *   **Setup:** Founder (Noisy in 2023, never sanctioned) vs. New Member (Noisy now). Target Defense: "She did it."
  *   **Step 1:** Rule exists? Yes. Evidence? Yes. **Violation Established.**
  *   **Step 2:** Complainant currently violating same rule? **No.** (2023 is past).
      *   **Result:** **Full Standing.** Past violations do not revoke citizenship or reporting rights.
  *   **Step 3:** Mirror Check. Has the Committee knowingly ignored this violation in the last 12 months?
      *   **Yes.** (You admitted the committee let the Founder's 2023 noise slide because they were popular).
      *   **Result:** **Stop Sanction.**
  *   **Action:** You cannot sanction the New Member yet. You must issue a **"Notice of Enforcement Reset."**
      *   *The Rationale:* "We acknowledge noise rules were not enforced consistently in 2023. We are correcting this. This warning serves as notice that future noise violations will be sanctioned."
  *   **Outcome:** The Founder's complaint is **Valid**, but the New Member **Cannot Be Sanctioned** this time. The Committee must publicly admit at the next house meeting that they failed to enforce the rules previously.
  *   **Why you will hate it:** The New Member gets off (technically), and the Committee has to eat public humble pie. The Founder gets to be "right" despite their past.
  *   **Why it's necessary:** If you sanction the New Member now, you are admitting you punish new people for things you let founders do. That destroys trust. You must reset the baseline before you punish.

  ***

  ### Honest Reflection: Where the Philosophy Hides

  You asked where this is just philosophy dressed as a checklist. Here is the truth:

  1.  **The Definition of "Same Rule" (Step 2, Q3):** This is not a fact; it is a value judgment. Deciding that "Dishes" and "Hoarding" are different norms is a philosophical choice to value *specificity* over *general virtue*. You are choosing to be a bureaucracy rather than a family. That is a political choice. If the house wants to be a family, this checklist will feel cold. If the house wants to be a contract, it will feel fair.
  2.  **The "Reset" Mechanism (Step 3):** This assumes that *procedural justice* (consistent enforcement) is more important than *retributive justice* (punishing the guy who made noise). It prioritizes the health of the system over the satisfaction of the moment. That is a liberal political philosophy, not a natural law.
  3.  **What This Cannot Settle:**
      *   **Malicious Compliance:** This procedure stops hypocrisy, but it doesn't stop a member from following the rules to the letter while being emotionally abusive. It handles *conduct*, not *culture*.
      *   **The "Popular" Problem:** Step 3 relies on the Committee admitting they ignored past behavior. If your committee is still too cowardly to admit they let the Founder slide in 2023, Step 3 will fail. The checklist cannot fix cowardice.
      *   **Standing Restoration:** You asked if owning a mistake restores standing. Step 2, Q4 says "Yes." But the house might not believe it. The checklist says they have standing; the neighbors might still hiss when they speak. The procedure fixes the *vote*, not the *reputation*.

  **Final Advice:**
  Print this. Tape it to the table. When someone says "But they did it too!", point to Step 2. When someone says "But you let *me* do it last year!", point to Step 3. If the Committee refuses to do Step 3 (the Mirror Check), resign. A conduct committee that enforces rules selectively is not a committee; it is a weapon.
