answer: |-
  Nadia is a **casuist**. She doesn't start with a theory and apply it; she starts with intuitions about specific cases and adjusts the principles until they fit. This is why she refuses to state a general rule—she knows that any rule broad enough to cover her "fine" verdicts will likely snag one of her "ban" verdicts, and vice versa.

  However, looking at her track record, we can reverse-engineer two distinct ethical frameworks that both successfully reconstruct all ten of her past verdicts. They split on *why* a market is repugnant.

  ### The Two Candidate Rules

  **Rule 1: The Vulnerability & Inequality Constraint**
  *Markets are impermissible when the consent of the seller is tainted by desperation, or when the trade entrenches a hierarchy of wealth over fundamental equality.*
  *   **Why it fits:** It bans kidneys (desperation), disaster pricing (desperation), vote selling (wealth buys influence), and golden visas (wealth buys standing). It allows plasma (routine, not desperate), NYE surge (convenience, not survival), and line standing (trivial labor). It explains the "grudgingly fine" on capped surrogacy (caps reduce exploitation) and the tolerance for ticket resale (bans hurt the poor via black markets).
  *   **The Logic:** The market mechanism itself isn't evil; *predation* is evil. If you remove the predation (via caps, verification, or lack of necessity), the market is clean.

  **Rule 2: The Civic & Personhood Integrity Constraint**
  *Markets are impermissible when they commodify things that constitute personhood or the political community, regardless of consent or inequality.*
  *   **Why it fits:** It bans kidneys (body integrity), baby selling (parent/child bond), vote selling (citizen agency), and golden visas (national membership). It bans disaster pricing because it violates the *social norm* of mutual aid in crisis (community integrity). It allows plasma (regenerative), surrogacy (labor, not baby), and ticket resale (entertainment is not sacred).
  *   **The Logic:** Some spheres are "market-free zones" not because people are exploited, but because putting a price on the thing *corrupts the meaning* of the thing (a la Michael Sandel).

  ---

  ### Application to the Election Contract

  Here is how each rule processes your startup's prediction market:

  **Under Rule 1 (Vulnerability):**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** The guardrails specifically target the sources of exploitation. The $50 cap prevents significant financial risk or wealth-based influence. Verified identity and "no leverage" prevent professional gambling dynamics. The "must have voted" requirement ensures participants are civic actors, not external manipulators. The spread going to a nonprofit adds a public benefit. There is no desperation being leveraged here; it's a capped, verified, civic-aligned speculation.

  **Under Rule 2 (Integrity):**
  *   **Verdict:** **Ban.**
  *   **Reasoning:** The object being traded is the *outcome of a democratic election*. Even if no one is exploited, turning the presidency into a ticker symbol commodifies the democratic process. It treats the collective civic decision as a horse race for profit. The "must have voted" guardrail might actually make it *worse* in this view, as it links civic duty directly to financial speculation, potentially corrupting the motivation for voting. The "Vote Selling" and "Golden Visa" precedents suggest the political sphere is a market-free zone, regardless of caps.

  ---

  ### Nadia's Likely Verdict

  **Prediction:** She will call it **Repugnant / Ban**, but she will agonize over it more than the "Vote Selling" case.

  **Why:**
  While the guardrails satisfy Rule 1 perfectly, Nadia's "Philosophy minor" side usually trumps her "Public Health" side when the topic shifts from *health behavior* (vaccines) to *political agency* (votes/visas).
  *   **The Anchor:** The **"Selling your vote"** verdict is the gravitational center here. To Nadia, the vote is the unit of civic equality. A prediction market on the election outcome is functionally adjacent: it monetizes the *result* of the aggregate votes.
  *   **The Tension:** The **"Paying for a vaccine"** verdict is the counter-weight. That was a financial incentive for a civic/health good. She allowed it because the outcome (herd immunity) is objectively good. An election outcome is contested.
  *   **The Decider:** The **"Golden Visa"** ban. She rejects buying/selling status in the polity. A prediction market effectively allows people to take a financial position on the polity's leadership. Even with a $50 cap, the *norm* is corrupted. She will likely say: *"You can't put a price on the peaceful transfer of power, even a small one. It turns citizens into shareholders."*

  ### The Linchpin Case

  The verdict doing the most work to pin down the rule is **"Selling your vote."**

  *   If she were running **Rule 1 (Vulnerability)**, she might have said "Fine with caps" (like surrogacy). After all, a poor person selling a vote to a rich person is an inequality issue. If you cap the price and verify identity, the inequality is mitigated. But she said **Ban**.
  *   This hard "Ban" signals that for her, some things are **non-fungible**. No amount of guardrails makes selling a vote okay. This suggests Rule 2 (Integrity) is the stronger driver in the civic sphere. If the election market is too close to "selling a vote," the guardrails don't matter.

  ### The Test Case

  To tell the rules apart, you need a case where **Vulnerability is low** (no desperation, equal footing) but **Civic Integrity is ambiguous**.

  **The Case:**
  > **"A city pays citizens $50 to attend a town hall meeting and fill out a feedback survey."**

  *   **Rule 1 (Vulnerability) predicts: Fine.**
      *   It's labor (like line standing). There is no desperation (it's a flat fee, open to all). It increases participation (public health benefit).
  *   **Rule 2 (Integrity) predicts: Ban.**
      *   Civic deliberation should be driven by duty/interest, not payment. Paying for attendance commodifies political engagement (like voting). It turns a "citizen" into a "contractor."

  **Why this splits them:**
  If Nadia says **"Fine, it's like jury duty pay,"** she is prioritizing **Rule 1** (getting the outcome without exploitation).
  If she says **"Ban, it corrupts the deliberation,"** she is prioritizing **Rule 2** (the market norm displaces the civic norm).

  Given her "Vote = Ban" stance, I suspect she'd say **"Ban,"** which would confirm that her election market verdict will also be a Ban, regardless of your engineering guardrails. The plumbing doesn't fix the philosophy.
