          2.  Tier 1: Fatal/Structural Threats (Statistical Reliability & The "No False Lemmas" Redundancy).
          3.  Tier 2: Serious Conceptual Threats (Collective Agency & Method Individuation).
          4.  Tier 3: Awkward/Practical Threats (X-Phi & Theoretical Vice).
          5.  The Insulation Limit (When to stop patching).
