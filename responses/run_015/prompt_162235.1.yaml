      *   *Correction on Satisfiability:* Actually, the prompt asks me to say *if* they aren't satisfiable. I think they *are* satisfiable, but only if we accept the "Answerability" framework as valid. If we stick to strict Deontology (Kant), it's impossible. But the prompt asks for the "Answerability" view to be one of the three. So I can proceed.

      *   *Wait, looking closer at the "Worse" constraint:* "The misleader has to come out worse... it can't be because they had a nastier motive, caused more harm...". It must be because of the *foothold* issue.
