prompt: |-
  I'm in the first year of a doctorate and I'm organising a reading group that has spent a whole term on the 1979 critique of the adaptationist programme — Gould and Lewontin's spandrels paper, the architectural analogy of the tapering spaces left over where arches meet the base of a dome, the complaint that adaptationists carve organisms into independent parts and invent functions for each, and the standing reply that selection is the only known source of complex functional fit. We keep having the same argument, so I want to try something different: draft the joint statement that a good-faith adversarial collaboration would produce between two researchers who have been talking past each other for forty years. Call them the optimality modeller — someone in the behavioural ecology tradition who holds that the productive first move with any trait is to ask what problem it might have been shaped to solve, to build the model, and to treat a failed prediction as information about the model's assumptions rather than as a refutation of the method — and the structuralist critic, who holds that the organism arrives with a body plan, a developmental system and a history, that many traits are by-products, later co-options (exaptations, in the term introduced a few years after the spandrels paper) or consequences of allometry and phylogenetic inertia, and that sliding from 'this trait serves F now' to 'this trait was built by selection for F' is a real error rather than a harmless shorthand.

  What I want from you is the document, not a verdict on who was right. Give me a numbered section of agreed claims both could sign — about what the 1979 paper did and did not establish, about what would count as evidence that some trait is an adaptation, about what nobody has shown yet — followed by a disagreements table in which each side's position is stated in a wording that side would itself accept, and then the cruxes. My own suspicion is that 'adaptationism' is being used for at least three separable theses: one about the causal powers of selection, one about which question to ask first at the bench or in the field, and one about some particular trait; and that much of the shouting comes from people who accept one and are heard as asserting another. Say whether that split does any work or quietly begs the question, and mark off separately any part of the dispute that is merely verbal — a historical notion of adaptation versus one defined by current utility, say. I also want two things I have not seen these debates produce. The first is a base-rate commitment: both sides should fix a reference class of traits in advance — a named clade, or a year's worth of trait explanations in a journal they both read — say what fraction they predict will be vindicated as adaptations within some stated period, and say who would do the coding and by what rule; if they cannot agree on a reference class, that failure is itself a finding and I want it recorded. The second is an accounting of what I have started calling the asymmetry of omission: getting an adaptationist story wrong and getting a constraint story wrong are different errors with different costs, the first sending people after a function that was never there and the second closing off a line of work that was about to pay off, so each side should say which error it takes to be worse in the short run, which in the long run, and whether that judgement rather than any biological claim is what actually drives its methodological stance. Please also flag, explicitly, any sentence you catch yourself writing that both could sign but that no one has ever denied.

  Several of the cruxes should be fastened to cases, and to save you guessing, here are the four I want used, with the facts as I understand them — tell me if I have any of them wrong, but please don't go hunting for more. First: the giant panda strips bamboo with a greatly enlarged wrist bone that works as an opposable sixth digit; it is a wrist bone, not a finger. Second: in vertebrate eyes the photoreceptors sit behind the neural wiring, the nerve fibres run across the light-facing surface and bundle to exit through it, leaving a blind spot, whereas in the independently evolved eyes of octopuses and squids the photoreceptors face the light and there is nothing structurally comparable. Third: in mammals the nerve serving the larynx leaves the skull, runs down into the chest, loops around a major artery and runs back up, so that in a giraffe the detour is metres long. Fourth: Darwin inferred from the length of a Madagascan orchid's nectar spur that a pollinator with a tongue of matching length must exist, and a moth of roughly that description was later found. For each case, say what each side should make of it, whether either side owes the other a concession, and whether the case is decisive or merely illustrative. I am especially interested in whether the fourth gives the modeller a tie-breaker — a prediction made before the observation — that the critic should accept as the strongest available evidence for the method, and in what the critic is entitled to demand in return. Finish by having each side name the single finding that would make it abandon its strongest claim, and the one line in the other's wording it would refuse to sign.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** First-year PhD student organizing a reading group on Gould & Lewontin's 1979 "Spandrels" paper.
      *   **Problem:** The group keeps having the same argument (Adaptationism vs. Structuralism/Constraint).
      *   **Task:** Draft a "Joint Statement" from an adversarial collaboration between an "Optimality Modeller" (Behavioural Ecologist) and a "Structuralist Critic" (Evolutionary Biologist/Developmentalist).
      *   **Format:**
          1.  Numbered section of Agreed Claims.
          2.  Disagreements Table (Position stated in acceptable wording, plus Cruxes).
          3.  Analysis of the "Three Theses" split (Causal, Heuristic, Specific).
          4.  Base-Rate Commitment (Reference class, predicted fraction, coding rules).
          5.  Asymmetry of Omission Accounting (Cost of errors).
          6.  Four Specific Cases (Panda, Vertebrate Eye, Giraffe Recurrent Laryngeal Nerve, Darwin's Moth).
          7.  Final Concessions (Finding to abandon claim, Line to refuse signing).
      *   **Tone:** Academic, precise, good-faith, avoiding verdicts, highlighting verbal vs. substantive disputes.
      *   **Constraint:** Do not hunt for more cases; use the four provided. Check facts on the four cases.
      *   **Specific Instruction:** Flag sentences that both could sign but no one has ever denied (tautologies/truism check).

  2.  **Deconstruct the Personas:**
      *   **Optimality Modeller (OM):** Focus on function, selection as the primary shaper of complex fit, models as null hypotheses, failed predictions refine assumptions rather than kill the method.
      *   **Structuralist Critic (SC):** Focus on constraints, development, phylogeny, by-products (spandrels), danger of "just-so stories," distinction between current utility and historical origin.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal. "Joint Statement on the Scope and Limits of Adaptationist Explanation."
      *   **Introduction:** Briefly set the stage (40 years of debate, desire for clarity).

      *   **Section 1: Agreed Claims:**
          *   Need common ground. Selection exists. Constraints exist. "Adaptation" has multiple definitions. Evidence is required for both.
          *   *Self-Correction on "No one has ever denied":* I need to explicitly flag a sentence that is trivially true but often ignored in heat. E.g., "Not every trait is an adaptation."

      *   **Section 2: The Three Theses (Analysis):**
          *   The user suspects 'adaptationism' conflates three things: Causal (selection *can* do this), Heuristic (start by asking *what for*), Specific (this trait *is* an adaptation).
          *   I need to evaluate if this split helps. Yes, it disentangles method from ontology.
          *   Identify verbal disputes: "Adaptation" (process vs. product vs. current utility).

      *   **Section 3: Disagreements Table & Cruxes:**
          *   Need clear columns: Issue, OM Position, SC Position, Crux.
          *   Key issues: Default assumption, Burden of proof, Definition of "Adaptation."

      *   **Section 4: Base-Rate Commitment:**
          *   This is tricky. Scientists hate putting numbers on this. But the prompt demands it.
          *   Reference Class: Needs to be specific. "Traits published in *Evolution* or *The American Naturalist* in 2024."
          *   Prediction: OM says high (e.g., 70%+), SC says lower (e.g., 40%).
          *   Coding: Independent panel.
          *   *Crucial:* If they can't agree, state that. I will draft it as if they *managed* to agree on the framework, even if the numbers differ, because the prompt asks for the document they *would* produce.

      *   **Section 5: Asymmetry of Omission:**
          *   OM fears missing a function (Type II error in function detection).
          *   SC fears inventing a function (Type I error in function detection).
          *   Short run vs. Long run costs.

      *   **Section 6: The Four Cases:**
          *   *Panda Thumb:* Radial sesamoid. OM: Functional solution despite constraint. SC: Constraint dictates form, function is co-option. Consensus: Exaptation/Co-option.
          *   *Vertebrate Eye:* Blind spot. OM: Local optimum given history. SC: Historical lock-in, poor design relative to cephalopods. Consensus: Phylogenetic constraint.
          *   *Giraffe Nerve:* Recurrent laryngeal. OM: Inefficient but selectable path dependent. SC: Evidence against perfect optimization, historical baggage. Consensus: Phylogenetic inertia.
          *   *Darwin's Moth:* Prediction confirmed. OM: Strong evidence for method. SC: Impressive, but doesn't prove *all* traits are adaptations.
          *   *Fact Check:*
              *   Panda: Enlarged radial sesamoid. Correct.
              *   Eye: Vertebrates inverted, Cephalopods everted. Correct.
              *   Giraffe: Left recurrent laryngeal nerve loops under aortic arch. Correct.
              *   Moth: *Angraecum sesquipedale*, *Xanthopan morganii praedicta*. Correct.

      *   **Section 7: Final Concessions:**
          *   OM: What kills the program? (e.g., showing complex fit arises without selection).
          *   SC: What kills the critique? (e.g., showing constraints are negligible).
          *   Refused Line: The one sentence that crosses the red line for each.

  4.  **Refining the Tone:**
      *   Ensure it sounds like a collaborative document, not a summary *of* them. Use "We agree," "We disagree."
      *   Check the "Flag sentences no one has denied" instruction. I will insert a specific marker [FLAG: Truism] for these.

  5.  **Review against Constraints:**
      *   Did I use the four cases? Yes.
      *   Did I address the three theses? Yes.
      *   Did I include Base-Rate and Asymmetry? Yes.
      *   Did I avoid a verdict? Yes.
      *   Is the formatting clear? Yes.

  6.  **Drafting Content - Specific Considerations:**
      *   *The Three Theses:* This is a key analytical part. I need to make sure I don't just list them but evaluate if the split begs the question. It helps clarify, but if "Heuristic" assumes "Causal" is dominant, it still begs the question. I need to be nuanced.
      *   *Base-Rate:* This is the hardest part to make realistic. I will frame it as a "Proposed Protocol" they agree to test, rather than claiming they know the answer now.
      *   *Darwin's Moth:* The prompt asks if this is a tie-breaker. It's the strongest evidence for OM, but SC will argue it's a single data point. I need to reflect that tension.
      *   *Flagging Truisms:* I need to be careful not to flag things that are actually contested (e.g., "Selection is the only source of complex fit" is contested). I need something like "Organisms are not perfectly optimized."

  7.  **Final Polish:**
      *   Check word count and density. It needs to be dense enough for a PhD reading group but clear enough to resolve arguments.
      *   Ensure the "Asymmetry of Omission" section clearly distinguishes short-term vs long-term costs.

  *(Self-Correction during drafting)*: I initially thought about letting them disagree on the Base-Rate reference class. But the prompt says "if they cannot agree... that failure is itself a finding." To make the document useful as a template for the reading group, I should show them *attempting* to define it, perhaps noting where the friction lies. I will draft it as an agreement on the *protocol* to measure it, acknowledging the divergence in prediction.

  *(Fact Check on Cases)*:
  1. Panda: Radial sesamoid bone. Yes.
  2. Eye: Vertebrate retina inverted. Cephalopod everted. Yes.
  3. Giraffe: Recurrent laryngeal nerve. Yes.
  4. Moth: *Angraecum sesquipedale*. Darwin predicted 1862. Moth found 1903 (Rothschild & Jordan). Yes.

  *(Flagging Truisms)*: I will insert bolded notes like **[FLAG: Universal Acceptance]** where appropriate.

