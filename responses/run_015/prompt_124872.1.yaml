      *   *Key Insight:* The Teletransportation case reveals that we care about *narrative continuity* and *interest satisfaction* more than strict ontological presence. Death frustrates interests. Teletransportation (replacement) frustrates interests. If we admit the latter is a harm (grievance), we must admit the former is too.

