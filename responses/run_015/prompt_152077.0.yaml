answer: |-
  Here's the breakdown you need for your story. If you want to dramatize the tension between "useful lies" and "scientific truth," you need to know exactly where the bodies are buried.

  ### The Desiderata: What a Theory of Idealization Must Deliver

  Any account that wants to take a seat at the table has to hit these five marks. If it misses one, it's just philosophy, not a theory of practice.

  1.  **The F-Twist Resolution:** It must explain *how* false premises yield true predictions without magic. It can't just say "it works"; it has to map the logical bridge between the lie and the truth.
  2.  **The Domain Boundary:** It must specify where the model breaks. A theory of idealization that can't tell you when the lie stops working is dangerous. It needs a "Here Be Dragons" marker.
  3.  **The Distinction Constraint:** It must separate **harmless fiction** (frictionless planes) from **harmful distortion** (ignoring feedback loops). One makes math possible; the other makes policy fatal.
  4.  **The Explanatory/Predictive Split:** It must distinguish between modeling to *predict* (what will the temperature be?) and modeling to *explain* (why did the temperature rise?). You can predict with a black box; you can't explain with one.
  5.  **The Error-Structure Requirement:** It must account for how errors propagate. It's not enough that the output is right; the theory needs to know if the output is right for the right reasons, or if the errors just cancelled out.

  ### The Cases to Handle

  Your story needs to show the theory working (or failing) across these three archetypes:

  *   **Ideal Gas Law:** The classic. Particles have no volume and no attraction. Obviously false. Works great at low pressure, fails at high pressure. The theory must explain why the volume lie doesn't matter until the particles get crowded.
  *   **Rational-Agent Economics:** Humans are not utility maximizers with perfect information. This is a psychological falsehood. Yet, markets often behave *as if* they are. The theory must explain when aggregate behavior smooths out individual irrationality and when it doesn't (e.g., crashes).
  *   **Climate Grid Approximations:** We can't model every cubic meter of the atmosphere, so we grid it. This smears out clouds and storms. The theory must explain how we trust long-term trends when short-term weather is literally erased by the model's resolution.

  ### The Niche Scenario: The "Echo-Chamber Problem"

  Here's your plot twist.

  **The Setup:** You have a complex model built of two sub-models.
  *   **Sub-model A** assumes a parameter is higher than reality (Positive Bias).
  *   **Sub-model B** assumes a different parameter is lower than reality (Negative Bias).
  *   **The Calibration Window:** In the range of existing data, Bias A and Bias B cancel each other out perfectly. The model fits the historical data flawlessly.
  *   **The Extrapolation:** Once you push the model past the known data (e.g., CO2 levels higher than ever recorded), the mathematical relationship changes. The biases no longer cancel; they compound. The model explodes.

  **Which Desiderata Does This Threaten?**
  This kills **Desideratum #1 (The F-Twist Resolution)** and **Desideratum #5 (Error-Structure)**.
  If your theory of idealization only cares that the predictions "come up roses" (Friedman's view), the Echo-Chamber looks like a success story until the moment it becomes a disaster. It proves that empirical adequacy is not enough. You need to know the *structure* of the error, not just the *magnitude*.

  ### The Killer Requirement

  The single requirement that knocks out the most popular theories is **Desideratum #5: The Error-Structure Requirement.**

  Most theories (especially instrumentalist ones) are happy if the output matches the data. They treat the model as a black box. The Echo-Chamber scenario proves that a black box can be perfectly calibrated and completely broken simultaneously. Any theory that doesn't demand insight into *why* the errors cancel is toast. It eliminates pure instrumentalism and naive empiricism immediately.

  ### The Jointly Unsatisfiable Pair

  Here's the tragic tension for your characters: **Universal Validity vs. Radical Idealization.**

  You cannot have a model that is **universally valid** (works everywhere) and relies on **radical idealization** (knowingly false premises).
  *   If you want the model to work everywhere, you have to add more realistic (complex) assumptions, which kills the idealization.
  *   If you want to keep the radical idealizations (for simplicity/math), you sacrifice universal validity.

  Scientists constantly try to sell the press on both ("This simple model explains everything!"), but logically, they can't have it. Your story can highlight the moment a scientist realizes they have to choose one.

  ### Scorecard: The Contenders

  Here's how the big three stack up against your list.

  **1. Friedman's Instrumentalism ("The F-Twist")**
  *   **Gist:** Assumptions don't need to be true; they just need to yield accurate predictions. The more significant the theory, the more unrealistic the assumptions.
  *   **Score:** Fails hard on the Echo-Chamber. Friedman would look at the perfect calibration and say the model is valid. He has no mechanism to detect compensating errors. He ace's Prediction but fails Explanation and Error-Structure.
  *   **Verdict:** Great for engineering, dangerous for policy.

  **2. Cartwright's "Dappled World" (Misrepresentation)**
  *   **Gist:** Fundamental laws are true but apply to almost nothing. Models work because they build a "nomological machine" that isolates a specific capacity, but they don't describe reality broadly.
  *   **Score:** She handles the Distinction Constraint well (harmless fiction vs. capacity). However, she struggles to explain why models work *as well as they do* outside the lab (The Success Condition). She's too skeptical of the bridge between the model and the world.
  *   **Verdict:** Philosophically safe, scientifically pessimistic.

  **3. Patchwork Realism (The New Guard)**
  *   **Gist:** Models are partially true. Different parts of the model latch onto real structures in the world, even if the whole package is idealized. We realism about the "working posits."
  *   **Score:** This is the strongest contender for your story. It handles the Echo-Chamber by demanding we identify which parts are doing the work. It respects the Domain Boundary. However, it's messy—it requires scientists to constantly audit which parts of their math are "real" and which are "fiction."
  *   **Verdict:** The most robust, but the most labor-intensive for the scientists.

  **Summary for your plot:** If your protagonist wants to expose a scandal, they use the **Echo-Chamber** to show that the scientists were Friedmanians (caring only about fit) when they should have been Patchwork Realists (checking which assumptions were actually doing the work). The conflict isn't about truth vs. lies; it's about *compensating errors* vs. *structural reliability*.
