      *   *D4: The Explanatory Condition.* Must distinguish predicting *that* from explaining *why*. (Predictive vs. Explanatory).
      *   *D5: The Robustness Condition.* (This is where the Echo-Chamber fits). Must detect when errors cancel vs. when they compound.

  4.  **Developing the "Echo-Chamber Problem":**
