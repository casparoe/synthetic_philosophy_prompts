prompt: |-
  I'm taking this phil of science seminar and we spent like two lectures on Hacking's looping effects with psychiatric kinds, but then my professor mentioned this wierd edge case about "pre-loop conditions" where a label gets applied before any interactive feedback has even started, and now I can't figure out what the actual spec is for a good theory. Like, if you're building a theory of psychiatric classification that takes looping seriously, what does it actually have to deliver? I was arguing with my freinds about whether epidemiological stability is a real desideratum or just DSM bias.

  Write me the full desiderata list: the cases a looping-aware theory of psychiatric kind-membership must get right (including proto-classifications where the loop hasn't kicked in, stable interactive kinds that are biologically novel, and reverse-looping where treatment dissolves the kind), the distinctions it can't collapse (having the disorder vs being shaped by the label, natural kind vs interactive kind, risk-state vs actual membership), and the results from biology or epidemiology it can't flat-out contradict. For each, say why it's required and flag which ones are non-negotiable vs camp-specific preferences. Then tell me if any subset is jointly unsatisfiable — I'm especially suspicious that you can't have both perfect cross-temporal epidemiological comparability and full looping-sensitivity. Also, which single requirement does the most damage to the popular theories?

  Finally, briefly score the standard DSM medical-model view and Hacking's own interactive-kind framework against the list — don't do a full table, just the highlights where they fail or succeed. And address that pre-loop case: if someone gets a transient stress-label but hasn't developed any stable interactive patterns, should the theory count them as having the disorder, being in a risk-state, or miscategorized? Build that into the criteria if it changes anything.
