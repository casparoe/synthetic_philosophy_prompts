answer: |-
  Here is a complete session plan designed for your constraints, your audience, and your specific philosophical goals. It relies on a **Self-Organized Criticality (Sandpile)** simulation. This model is ideal because it is deterministic (satisfying the reductionists) but statistically robust (satisfying the emergentists), and it is computationally irreducible for humans (satisfying the pragmatists).

  ### 1. The Simulation Specifications
  You will run this on your laptop the night before to generate the handouts. Do not run it live during the session; it eats too much clock.

  **The Model:** Abelian Sandpile Model (ASM) on a 2D grid.
  **The Physics:** Each cell holds an integer value ("stress"). If a cell $\ge$ 4, it "topples": it loses 4 units, and each of its 4 cardinal neighbors (N, S, E, W) gains 1 unit. This may trigger cascades ("avalanches").
  **Boundary:** Open (grains fall off the edge).
  **Driving:** Add 1 grain to a random cell after the grid stabilizes.

  **Scenario Parameters (Generate these three datasets beforehand):**

  *   **Scenario A (Baseline):**
      *   **Grid:** 50 $\times$ 50 cells.
      *   **Rule:** Standard toppling (1 to each cardinal neighbor).
      *   **State:** Start from a "critical" state (run the sim for 5,000 steps before capturing the snapshot).
      *   **Data for Handouts:** Capture the grid state at Step 5,000. Record the size (number of topplings) of the next 20 avalanches (Steps 5,001–5,020).
  *   **Scenario B (Micro-Change / Robustness):**
      *   **Grid:** 50 $\times$ 50 cells.
      *   **Rule:** **Stochastic Toppling.** When a cell topples, it sends 1 grain to 4 neighbors chosen *randomly* from the 8 surrounding cells (including diagonals), rather than fixed cardinal neighbors.
      *   **Why:** This changes the micro-mechanics entirely but preserves the macro power-law statistics.
      *   **Data:** Capture grid state and next 20 avalanche sizes.
  *   **Scenario C (Macro-Break / Defect):**
      *   **Grid:** 50 $\times$ 50 cells.
      *   **Rule:** Standard toppling.
      *   **Defect:** A vertical "wall" of immutable cells (value = 0, never topples, never accepts grains) runs down the exact center column.
      *   **Why:** This breaks the system into two independent piles, altering the maximum avalanche size distribution.
      *   **Data:** Capture grid state and next 20 avalanche sizes.

  **Preparation Checklist:**
  1.  Run the simulation for Scenario A. Save the Grid State (matrix of integers) and the Time Series (list of 20 avalanche sizes).
  2.  Run for Scenario B. Save Grid State and Time Series.
  3.  Run for Scenario C. Save Grid State and Time Series.
  4.  Draft the "Law Sheet" (Phenom): Calculate the average avalanche size and the approximate maximum size for each scenario. (For ASM, average is low, max scales with system size).

  ### 2. Materials List
  *   **Projector:** To display the "Question of the Round" and the Timer.
  *   **Whiteboard:** To track scores and park philosophical terms that arise.
  *   **Handouts (Printed):**
      *   **Micro Packets (5 copies):** Contains the 50x50 matrix of numbers (Scenario A, then B, then C) and the written toppling rules.
      *   **Macro Packets (5 copies):** Contains a line graph of "Avalanche Size vs. Time" for the previous 100 steps, and the raw list of the last 20 sizes. No rules, no grid.
      *   **Phenom Packets (5 copies):** Contains a text summary: "In this system, avalanche sizes follow a power law. Average size $\approx$ 15. Maximum observed size $\approx$ 400. 90% of events are size < 50."
      *   **Prediction Slips:** Small slips of paper for each team to write their prediction for the *next* avalanche size (single number) and a confidence interval (min–max).
  *   **Timer:** Visible to all.

  ### 3. The Information Sheets (Text for Handouts)

  **Team Micro (The Reductionists)**
  > "You have the complete physical description. You know the exact state of every cell (the grid) and the exact laws of interaction (the rules).
  > **Task:** Using only this information, predict the size of the *next* avalanche.
  > **Constraint:** You may not use external computers. You must derive the answer from the provided state and rules."

  **Team Macro (The Modelers)**
  > "You do not know the micro-rules or the current state. You have the observational history.
  > **Task:** Extrapolate from the time-series data to predict the size of the *next* avalanche.
  > **Constraint:** You must treat the system as a black box. No assumptions about internal mechanics."

  **Team Phenom (The Phenomenologists)**
  > "You do not know the state or the history. You have the generalizations derived from long-term observation of similar systems.
  > **Task:** Apply the statistical law to predict the size of the *next* avalanche.
  > **Constraint:** You must rely on the stability of the generalization, not specific data points."

  ### 4. Scoring Scheme: "The Prediction Token"
  No money. Use poker chips or printed tokens.
  *   **Exact Match:** 3 Tokens.
  *   **Within 10% of Actual:** 2 Tokens.
  *   **Within Confidence Interval:** 1 Token.
  *   **Penalty:** If the actual result falls *outside* their stated confidence interval, lose 1 Token.
  *   **The Kicker:** In Round 2 and 3, if a team's prediction method is rendered *invalid* by the change (e.g., Micro's rules no longer match reality), they lose all tokens for that round, even if they guess right by luck. (You, the facilitator, judge validity based on their written reasoning).

  ### 5. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Introduction & Grouping**
  *   Welcome. No philosophy talk yet.
  *   Divide into 3 teams (Micro, Macro, Phenom). 5-6 people per team.
  *   Hand out Round 1 packets (Scenario A).
  *   **Facilitator Script:** "You are all consultants hired to predict the next event in a stress-accumulation system. You have different budgets and different clearances. You have 10 minutes to discuss and write down a prediction."

  **00:10 – 00:25: Round 1 (Baseline)**
  *   Teams work. (Micro will quickly realize 50x50 is too big to calculate by hand. They must decide whether to sample a small region or guess).
  *   Collect Prediction Slips.
  *   Reveal the Actual Result (from your pre-run data).
  *   Award Tokens.
  *   **Likely Outcome:** Micro fails (too complex). Macro/Phenom do okay (statistical likelihood).

  **00:25 – 00:40: Round 2 (The Micro Swap)**
  *   Hand out Round 2 packets (Scenario B).
  *   **Crucial:** Do *not* tell them the rules changed.
  *   **Micro Team:** Gets the *new* grid and the *new* rules (Stochastic). They must recalculate.
  *   **Macro/Phenom Teams:** Get the new data/graph. The graph looks statistically identical to Round 1.
  *   Teams predict.
  *   Reveal Result.
  *   **The Trap:** Micro team might try to use Round 1 logic or fail to notice the rule change in the text. Macro/Phenom should succeed because the statistics didn't change.
  *   Award Tokens.

  **00:40 – 00:55: Round 3 (The Defect)**
  *   Hand out Round 3 packets (Scenario C).
  *   **Micro:** Gets grid with the "Wall" visible.
  *   **Macro:** Sees the time series. (The variance might look slightly different if you tweaked the data, but let's assume it looks noisy).
  *   **Phenom:** Gets the same "Law" sheet as Round 1 (because they don't know the system changed).
  *   Teams predict.
  *   Reveal Result (Likely a smaller max avalanche size due to the wall).
  *   **The Trap:** Phenom team fails because the law no longer holds. Micro team might succeed if they noticed the wall restricts flow.
  *   Award Tokens.

  **00:55 – 01:15: The Debrief (The Philosophy)**
  *   (See Section 6 below).

  **01:15 – 01:30: Closing & Limitations**
  *   (See Section 7 below).

  ### 6. The Debrief Guide
  *Do not lecture.* Use the whiteboard to map their experience to the concepts. Ask these specific questions in this order.

  **Phase 1: The Utility of the "Nothing-But" (10 mins)**
  *   **Ask Team Micro:** "You had the truth. The complete physical state. Why didn't you win?"
  *   **Expected Answer:** "Too many variables," "Couldn't calculate in time."
  *   **Board Note:** Write *Completeness $\neq$ Usability*.
  *   **Point to Make:** "You all agreed the system is nothing but cells toppling. But knowing that didn't help you predict. Why?" (Leads to: Computational Irreducibility).
  *   **Ask Team Macro:** "You were ignorant of the physics. Why did you do better?"
  *   **Point to Make:** Higher-level generalizations compress information in a way that is *actionable*.

  **Phase 2: Invariance and Counterfactuals (10 mins)**
  *   **Ask:** "In Round 2, I changed the micro-rules (cardinal to random neighbors). Team Macro/Phenom, did your predictions break?"
  *   **Expected Answer:** "No, the stats looked the same."
  *   **Ask:** "Team Micro, did your work from Round 1 carry over?"
  *   **Expected Answer:** "No, we had to start over."
  *   **Board Note:** Write *Robustness*.
  *   **Point to Make:** "The macro-pattern survived a change in the micro-rules. This means the macro-pattern is *invariant* to certain micro-details. This is the heart of emergence: not magic, but stability across different micro-realizations."
  *   **Counterfactual Question:** "If I asked you, 'What would happen if we doubled the grid size?', who could answer that?" (Phenom can say 'Max size increases'; Micro has to simulate the whole new grid).

  **Phase 3: Distinguishing the Two "Emergences" (10 mins)**
  *   **Ask:** "We felt two different kinds of difficulty today. Round 1 was hard because the calculation was too long. Round 3 was hard because the pattern broke."
  *   **Board Note:** Draw two columns.
      1.  *Too Hard to Calculate* (Round 1).
      2.  *Pattern Independent of Rules* (Round 2).
  *   **Point to Make:** "Sometimes we call something 'emergent' because we are too small to do the math (Epistemic). Sometimes we call it 'emergent' because the pattern exists regardless of the math (Ontological/Robust). Today showed us both."

  ### 7. What Will Predictably Go Wrong
  1.  **The Micro Rebellion:** The Micro team will argue that if they *had* a computer, they would win.
      *   *Response:* "You are scientists. You know the difference between a closed-form solution and a numerical simulation. If the only way to get the answer is to run the system itself, is the micro-description actually *predictive*, or is it just a copy of the system?"
  2.  **The "It's Just Ignorance" Objection:** A participant will say, "This isn't emergence, it's just that Macro didn't know the rules."
      *   *Response:* "In Round 2, the Micro team *knew* the rules and still lost predictive power to the Macro team's statistics. Ignorance doesn't explain why the detailed knowledge was less robust to the rule change."
  3.  **Time Overrun:** The Micro team will get stuck trying to calculate a 5x5 sub-grid.
      *   *Mitigation:* At minute 15, announce: "If you haven't written a prediction down, you get zero tokens. Commit to a guess."
  4.  **Suspicion of Rigging:** They might think you changed the numbers to make Micro lose.
      *   *Mitigation:* Keep the Python script open on your laptop. Offer to show the code after the session. Transparency builds trust.

  ### 8. Limitations & The Closing Statement
  *You must be honest.* This activity demonstrates **Epistemic Emergence** (usefulness of description) and **Robustness** (multiple realizability). It does not prove **Ontological Emergence** (downward causation that violates physics).

  **Your Closing Statement (In your voice):**
  > "I want to be careful before we leave. I am a geochemist. I do not believe the crystals in my melts were doing anything magic. I believe every ion obeyed quantum mechanics. If someone built a god-sized computer, they could simulate this room, this sandpile, and the history of the universe using only the Standard Model.
  >
  > "But.
  >
  > "In thirty years, I never once used the Schrödinger equation to predict a partition coefficient. I used empirical laws. I used generalizations. Today, we saw why. We saw that 'complete' does not mean 'useful.' We saw that a pattern can be real—robust enough to survive changes in the underlying rules—even if it is made of nothing but those rules.
  >
  > "Reductionism tells us what the world is made of. Emergence tells us how to talk about it without drowning in the details. Neither is the 'true' view. They are tools for different jobs. My job was to measure the trace elements. I couldn't have done that if I'd been forced to track the electrons. And that isn't a failure of physics. It's a feature of being a scientist who has to finish a paper before they retire."

  ### 9. Why This Works for Your Group
  *   **Scientists/Engineers:** They respect the simulation. They understand "boundary conditions" and "parameters." They won't feel like they are doing abstract navel-gazing.
  *   **No Jargon:** You avoid "supervenience" until the end, letting them feel the concept first.
  *   **The "Two Emergences":** Round 1 targets computational limits. Round 2 targets multiple realizability. This cleanly separates the two concepts you wanted to pry apart.
  *   **The "Nothing-But" Tension:** The Micro team *has* the truth but loses the game. This forces them to admit that "truth" isn't the only metric for scientific value.

  ### 10. Final Facilitator Note
  When you hand out the Round 2 packets to the Micro team, ensure the rule change is written clearly in the text but not highlighted. If they miss it, it proves the point about brittleness. If they catch it, it proves the point about computational load (they have to recalculate). Either way, you win the argument.

  Good luck. It sounds like a splendid way to spend retirement.
