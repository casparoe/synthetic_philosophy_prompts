      *   *Claim 1: Authorship/Origin.* An original is valuable because the specific artist made it. A copy, even if identical, lacks this causal link.
      *   *Claim 2: Deception/Aesthetics.* Does knowing a work is a forgery change how we see it? Goodman says yes (aesthetic experience depends on knowing it's real). Others say no (if it looks the same, it *is* aesthetically the same).
      *   *Claim 3: Irreproducible Presence (Aura).* Benjamin's "here and now." Something unique about the object's history that cannot be copied.

  3.  **Translate into Conservation Vocabulary:**
      *   *Constraint:* Must use *compositional fidelity, documented provenance chains, detectable material signatures, restoration ethics, distinction between replication and continuity of origin*.
      *   *Translation 1 (Authorship):* Instead of "Artist's hand," use *continuity of origin* verified by *documented provenance chains*.
      *   *Translation 2 (Deception/Aesthetics):* Instead of "Aesthetic worth," use *compositional fidelity* vs. *detectable material signatures*. If signatures match but provenance breaks, *restoration ethics* dictate treatment.
      *   *Translation 3 (Irreproducible Presence):* Instead of "Aura," use the gap between *replication* (making it look right) and *continuity of origin* (the actual history).

