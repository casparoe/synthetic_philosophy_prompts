  2.  **Deconstruct the Concepts:**

      *   **Radical Translation:** The thought experiment of translating a completely unknown language with no prior dictionaries or cognates (the Jungle Linguist scenario).
      *   **Gavagai:** The native says "Gavagai" when a rabbit runs by.
      *   **Inscrutability of Reference:**
          *   *Focus:* Terms/Objects (Reference).
          *   *Claim:* We can't determine *what object* a term refers to based solely on behavioral evidence.
          *   *Gavagai application:* Does "gavagai" mean "rabbit," "undetached rabbit part," "rabbit stage," or "rabbithood"?
          *   *Status:* Epistemological (mostly). We can't *know* which it is, but we assume there *is* a fact about what the native means in their own conceptual scheme. It's about the mapping between words and world.
      *   **Indeterminacy of Translation:**
          *   *Focus:* Sentences/Meanings (Holistic Translation Manuals).
          *   *Claim:* There can be multiple, mutually incompatible translation manuals that fit all possible behavioral evidence equally well, and *there is no fact of the matter* to decide between them.
          *   *Gavagai application:* It's not just about the word "gavagai," but how the whole language is mapped to English. One manual says "gavagai" = "rabbit," another says "gavagai" = "undetached rabbit part" (compensated by translating other particles differently).
          *   *Status:* Ontological. It's not just that we can't know; it's that there *is nothing to know*. Meaning isn't a hidden mental entity.

  3.  **Address the "No Fact of the Matter" Question:**
      *   This is the heart of the controversy.
      *   *Epistemological view:* There is a right answer (the native's mental state), but we are cut off from it.
      *   *Quine's view (Ontological):* Meaning *just is* behavioral disposition. If behavior doesn't distinguish them, there is no difference in meaning. There is no "mental museum" of meanings.
      *   *Analogy:* Mathematics (underdetermination of theory by evidence) vs. Language (indeterminacy). In physics, we assume there's a truth even if we can't prove it. In translation, Quine says there *isn't* a truth.

