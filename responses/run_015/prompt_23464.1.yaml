answer: |-
  This is one of the most common stumbling blocks in reading *Word and Object*, and you are right to suspect that conflating them leads to serious misunderstandings of Quine's project.

  While both theses emerge from the "Radical Translation" thought experiment (the jungle linguist encountering a native speaker), they target different levels of language and make different metaphysical claims.

  Here is the breakdown of the difference, using *gavagai*, and an explanation of why "no fact of the matter" is an ontological claim, not just an epistemological one.

  ---

  ### 1. The Setup: Radical Translation and *Gavagai*
  Imagine a linguist encounters a native speaker of a completely unknown language. A rabbit runs by, the native says "Gavagai," and the linguist notes this down.
  *   **The Evidence:** The only evidence the linguist has is the native's **behavior** (assent/dissent) in response to sensory stimuli. The linguist has no access to the native's mind, thoughts, or internal concepts.

  ### 2. Inscrutability of Reference (The "What" Problem)
  **Thesis:** We cannot determine what objects a speaker's terms refer to based solely on behavioral evidence.

  *   **Focus:** It applies to **terms** (words referring to objects).
  *   **The *Gavagai* Application:** When the native says "Gavagai," does the term refer to:
      1.  The whole rabbit?
      2.  An undetached rabbit part?
      3.  A temporal stage of a rabbit?
      4.  The universal "rabbithood"?
  *   **The Problem:** All of these possibilities are compatible with the exact same behavioral evidence. Every time a whole rabbit is present, an undetached rabbit part is also present. Pointing doesn't help, because pointing at a rabbit is also pointing at a rabbit-part.
  *   **The Status:** This is primarily an **epistemological** limitation regarding the *mapping* of words to the world. It says: "From the outside, we cannot scrutinize (see into) what object the native is referring to."

  **Crucially:** One can accept Inscrutability without accepting Indeterminacy. You could argue, "We can't know if the native means 'rabbit' or 'rabbit part,' but *the native knows*. There is a fact in their head; we just can't access it."

  ### 3. Indeterminacy of Translation (The "How" Problem)
  **Thesis:** There can be multiple, mutually incompatible translation manuals that fit all possible behavioral evidence equally well, and there is **no fact of the matter** to decide between them.

  *   **Focus:** It applies to **sentences** and **translation manuals** (the holistic system).
  *   **The *Gavagai* Application:** This isn't just about the word "gavagai." It's about how you translate the *whole language*.
      *   **Manual A:** Translates "Gavagai" as "Rabbit." To make this work, it translates certain logical particles (like identity or plurality markers) in standard English ways.
      *   **Manual B:** Translates "Gavagai" as "Undetached Rabbit Part." To make this work, it must translate the native's logical particles *differently* to compensate. (e.g., Where the native says something that looks like "is the same as," Manual B translates it as "belongs to the same whole as").
  *   **The Result:** Both Manual A and Manual B predict the native's behavior perfectly. They are empirically equivalent.
  *   **The Status:** This is an **ontological** claim about meaning itself.

  ### 4. The "No Fact of the Matter" Claim
  This is the specific point you asked about, and it is the source of the controversy.

  **The Epistemological View (What people often think Quine means):**
  "There is a correct translation (the one that matches the native's mental state), but because we are limited to behavioral evidence, we humans can never figure out which one it is."
  *   *Implication:* Meaning is a hidden mental entity. We are just cut off from it.

  **Quine's Ontological View (What Quine actually means):**
  "There is **no correct translation** waiting to be discovered. Meaning is not a mental entity; meaning *is* behavioral disposition."
  *   *Implication:* If two manuals account for all behavior equally well, there is literally nothing else to check. There is no "meaning museum" in the brain to peek into. If behavior doesn't distinguish them, **meaning doesn't distinguish them.**

  Quine is a behaviorist about meaning. For Quine, to ask "But what does he *really* mean?" beyond what his behavior dictates is a meaningless question, like asking "Is the north pole to the left or right of the south pole?" It's not that we can't measure it; it's that the concepts don't apply.

  ### 5. Why Indeterminacy is the Stronger (and Controversial) Claim

  You can think of the relationship this way: **Inscrutability is a symptom; Indeterminacy is the diagnosis.**

  1.  **Inscrutability is weaker:** Most philosophers accept Inscrutability. It is relatively uncontroversial to say that reference is hard to pin down from the outside. It leaves open the possibility that there is a "God's eye view" where the reference is fixed.
  2.  **Indeterminacy is stronger:** Quine argues that because reference is inscrutable, we must construct a translation manual to fix it. But since multiple manuals work, and there is no mental fact to choose between them, translation is *indeterminate*.
      *   **The Controversy:** This attacks the intuition that meaning is real and determinate. If Indeterminacy is true, then when you ask, "Does 'gavagai' mean rabbit or rabbit-part?" the answer is not "We don't know," the answer is **"There is no answer."**
      *   **Chomsky's Critique:** Noam Chomsky famously attacked this. He argued Quine was confusing *evidence* with *meaning*. Chomsky argues there *is* a fact of the matter (the native's internal linguistic competence/biology), even if we can't observe it behaviorally. Quine rejects this because he rejects "mental meanings" as unscientific.

  ### Summary Table for Your Draft

  | Feature | Inscrutability of Reference | Indeterminacy of Translation |
  | :--- | :--- | :--- |
  | **Target** | **Terms** (Reference to objects) | **Sentences/Manuals** (Holistic Meaning) |
  | **Question** | What object does "gavagai" name? | Which manual correctly maps Language X to English? |
  | **Nature of Claim** | Mostly Epistemological (We can't tell) | Ontological (There is nothing to tell) |
  | **"Fact of the Matter"** | Allows that a fact might exist (in the native's mind). | Denies that a fact exists beyond behavior. |
  | **Philosophical Weight** | Widely accepted (referential opacity). | Highly controversial (denies determinate meaning). |

  ### How to phrase this in your piece
  When you write about the "no fact of the matter" claim, be explicit that Quine is rejecting **meaning realism**.

  > "Quine is not merely saying that the linguist is ignorant of the correct translation (an epistemological limitation). He is making the ontological claim that 'correctness' in translation is not a property that exists independently of the evidence. Since behavioral evidence underdetermines the translation manual, and Quine rejects private mental meanings as scientific data, there is no further reality against which to judge the manuals. To ask which manual is *really* right is like asking which coordinate system is *really* correct for mapping a sphere; the choice is pragmatic, not factual."

  This distinction saves your piece from the common error of treating Quine as a skeptic (who says "we can't know") rather than a behaviorist/eliminativist (who says "there is nothing there to know").
