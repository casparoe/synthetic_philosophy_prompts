      *   *Indeterminacy of Translation:*
          *   Define it: Uncertainty about *sentences/manuals*.
          *   Example: Manual A vs. Manual B.
          *   Key strength: It applies to the whole system.
          *   Nature: Ontological (no fact of the matter).
      *   *The Crucial Difference (The "Why Stronger" part):*
          *   Inscrutability allows for a "God's eye view" (the native knows what they mean).
          *   Indeterminacy denies the "God's eye view" (meaning is public/behavioral).
