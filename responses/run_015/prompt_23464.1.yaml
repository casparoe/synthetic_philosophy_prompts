      *   *Clarification:* Inscrutability is a thesis about *terms* (reference). Indeterminacy is a thesis about *sentences* (meaning/holophrastic).
      *   *Wait, is Inscrutability weaker?* Yes. You can accept Inscrutability (we can't pin down reference from outside) without accepting Indeterminacy (there is no fact of the matter about meaning). Many philosophers accept Inscrutability but reject Indeterminacy.
      *   *The "Fact of the Matter" point:* This is the big one. If I say "It's indeterminate," I mean "Both are right." If I say "It's inscrutable," I usually mean "One is right, but I can't tell." Quine argues Inscrutability leads to Indeterminacy, but the logical jump is where the controversy lies.

