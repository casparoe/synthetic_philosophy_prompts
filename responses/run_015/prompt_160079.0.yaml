answer: |-
  You are right to be suspicious. The stalemate exists because the debate is often framed as an empirical contest between two mutually exclusive hypotheses, when it is actually a conceptual confusion about **counterfactuals** and **constraints**.

  Here is the diagnosis, the stress test, and the prognosis.

  ### 1. The Diagnosis: It's a Category Error, Not Just a Verbal Dispute

  Your working theory is 80% correct. It is a verbal dispute wrapped in a measurement problem, but the core issue is a disagreement about the **space of possible phenotypes**.

  *   **The Handicap Claim:** Honesty is an **economic equilibrium**. Cheating is *physiologically possible* but *evolutionarily unstable*. A low-quality individual *could* grow the big tail, but they would die trying. The mechanism is **selection against cheaters**.
  *   **The Index Claim:** Honesty is a **physical constraint**. Cheating is *physiologically impossible* (or prohibitively constrained by physics, not fitness). A small frog *cannot* make a deep sound because its larynx is too small. The mechanism is **developmental/physical necessity**.

  **The Checkable Question:**
  The real empirical question is not "Is the signal costly?" (Both agree it often is). The question is: **"If we artificially removed the fitness cost, would the low-quality individual still be unable to signal?"**

  *   If you could magically subsidize the energy cost of a peacock's tail for a weak male, and he still couldn't grow it (because his immune system collapses under the antigen load, not the calorie count), that leans Index.
  *   If you subsidize the cost and he *does* grow it and gets mates, but his offspring die, that is Handicap.

  **Why the Stalemate?**
  Almost no one measures the **marginal cost of fitness**. They measure the correlation between signal and quality. As you noted, both models predict $Signal \propto Quality$. To distinguish them, you need to decouple the signal from the quality experimentally. This is ethically and technically difficult in wild animals. Consequently, "Cost" becomes a rhetorical placeholder. Handicap proponents call any constraint a "cost"; Index proponents call any cost a "constraint."

  **The "High-Quality Signal Least" Case:**
  This third case you mention (silent dominance) actually supports the Index view. Once quality is known (via past indices or fights), signaling becomes redundant. Handicap theory struggles here unless you invoke "efficiency," but Index theory handles it easily: the physical proof is already established; no further broadcast is needed.

  ### 2. The Stress Test: Generative AI and Credentialing

  Let's apply the two accounts to your AI scenario.
  *Premise:* AI drives the marginal cost of "polished output" (essays, code, art) to near zero.
  *Observation:* Credentialing shifts to handwritten exams, live orals, and "process footage."

  **Prediction A: The Handicap Account**
  *   **Logic:** Honesty requires a cost differential. If AI makes the old signal (the essay) cheap for low-quality agents, the signal collapses. To restore honesty, we must introduce a *new* cost that is **differentially burdensome**.
  *   **Prediction:** We should see an **arms race of difficulty**. Exams shouldn't just be handwritten; they should get *harder*. The barrier to entry must rise until the "low-quality" (less capable) humans find it too "costly" (in time/cognitive effort) to fake the signal.
  *   **Outcome:** Credentialing becomes more exclusionary and exhausting. We invent harder puzzles to maintain the cost differential.

  **Prediction B: The Index Account**
  *   **Logic:** Honesty requires a physical tie between signal and agent. AI broke the tie between "text" and "human mind." We must shift to signals that are **physically bound to the human apparatus**.
  *   **Prediction:** We should see a shift to **modalities of presence**. Handwritten exams aren't valuable because they are *hard* (Handicap); they are valuable because the motor control and latency are physically tied to the specific human nervous system (Index). Live orals aren't valuable because they are stressful (cost); they are valuable because the latency of response is physically constrained by human cognition, which AI currently cannot perfectly mimic in real-time interaction.
  *   **Outcome:** Credentialing becomes more about **provenance and continuity** than difficulty. "Proof of Personhood" replaces "Proof of Merit."

  **The Convergence (and what it tells us):**
  Both accounts predict the death of the "polished artifact" as a signal.
  *   **If they diverge:** Handicap expects us to make the *task* harder. Index expects us to make the *channel* more restrictive (in-person, biometric).
  *   **Current Reality:** We are seeing the Index shift (live defenses, process videos) more than the Handicap shift (arbitrarily harder exams). This suggests that in human cultural signaling, we intuitively treat "humanity" as an **Index**, not a Handicap. We don't ask you to suffer to prove you're human; we ask you to show your face.

  **The Verdict on the AI Test:**
  If the shift is toward "things AI can't do because of how it's built" (Index) rather than "things AI won't do because it's too expensive" (Handicap), then the Index model is the better descriptor for this transition. However, if compute costs rise such that running the AI becomes the "handicap," the Handicap model returns. Currently, it looks like an Index shift.

  ### 3. What Counts as Progress?

  Do not expect a "victory" for one side. Expect a **dissolution of the dichotomy**.

  **The Formal Result (Already Happened):**
  Theoretically, this was largely resolved by Johnstone (1997) and others who showed that Indices are simply a limiting case of Handicaps where the cost of cheating approaches infinity. If the cost is infinite, it's an Index. If the cost is finite but differential, it's a Handicap. They exist on a continuum of **constraint**.

  **The Empirical Progress Needed:**
  To move the needle, you need a study that manipulates the **constraint** independently of the **cost**.
  *   *Example:* In a species with a "size-based" call (putative Index), use hormonal manipulation to allow a small male to produce a deep call *without* killing him.
  *   *Result:* If he gets mates and survives, it was a Handicap (cost was the barrier). If he gets mates but the call physically damages his larynx immediately, it was an Index (physics was the barrier).

  **Should you expect resolution in your lifetime?**
  **No.** Not because the science is hard, but because the question is being asked wrong.
  *   **The Honest Answer:** The "fight" is a zombie. It persists because "Handicap" is a sexier, more counter-intuitive idea (honesty *because* of waste) than "Index" (honesty *because* of physics). Journals prefer the former.
  *   **The Progress:** Progress looks like stopping the ask of "Is this signal a handicap or an index?" and starting to ask "What is the **shape of the cost function** for this signal?"
      *   Is the cost function vertical? (Index)
      *   Is the cost function sloped differentially? (Handicap)
      *   Is the cost function flat? (Cheap Talk)

  **Advice for your Column:**
  Frame the AI transition not as a victory for one biological theory, but as a revelation of the **underlying substrate of trust**.
  When production costs collapse (AI), we are forced to reveal whether we ever believed in the Handicap (the work was hard) or the Index (the work was human). The panic over AI suggests we were relying on **Indices** (human effort) but mistaking them for **Handicaps** (difficulty). We thought we were testing intelligence (Handicap); we were actually testing biology (Index). Now that biology is decoupled from output, we are scrambling to re-attach the signal to the body.

  The stalemate in biology persists because nature uses both. The stalemate in your column can end by pointing out that the distinction is a tool for measurement, not a law of nature.
