      *   *Section 2: The Distillation Pressure.* Explain how loss functions work. They reward matching the amplified output. If the amplified output is a consensus of sub-agents working within the frame, the outlier saying "stop" gets minimized.
      *   *Section 3: Alignment Specifics.* Connect frame-openness to instrumental convergence and Goodhart's Law. The dangerous moments are when the spec is wrong. IDA makes the spec king.
      *   *Section 4: Engaging Objections.*
