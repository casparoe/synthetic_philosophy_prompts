answer: |-
  Here is a breakdown you can raise in seminar. It distinguishes the logical truism from the epistemic mistake, and addresses the leak dynamics directly.

  ### 1. Three Claims Behind the One-Liner

  **Claim A: The Logical Truism (Trivial)**
  *   **Claim:** 'Failure to prove $X$ exists is not a formal proof that $X$ does not exist.'
  *   **Plausibility:** True, but irrelevant. We are dealing with empirical probability, not logical deduction.
  *   **Verdict:** Gets him nothing. In Bayesian terms, absence of evidence is almost always *some* evidence of absence, provided the evidence was expected. It shifts the probability, even if it doesn't reach zero.

  **Claim B: The Epistemic Defence (Substantive)**
  *   **Claim:** 'We should not expect to find evidence even if the theory is true (e.g., because secrecy is perfect).'
  *   **Plausibility:** Low. This requires the conspiracy to be flawlessly efficient over time.
  *   **Verdict:** Supports **you**. For this to hold, the probability of a leak given the conspiracy exists must be near zero. With hundreds of people over five years, this is empirically implausible.

  **Claim C: The Immunising Strategy (Self-Sealing)**
  *   **Claim:** 'The lack of evidence is itself proof of the conspiracy's power (i.e., they hid it all).'
  *   **Plausibility:** None. This makes the theory unfalsifiable.
  *   **Verdict:** Supports **you**. It demonstrates that his position is immune to counter-evidence by definition, which is a hallmark of pseudoscience, not robust epistemology.

  ### 2. The Leak Wrinkle: Numbers vs. Controversy

  Your seminar colleague is hoping that low internal controversy reduces leak probability enough to explain the silence. It does not.

  *   **Motivation vs. Opportunity:** Controversy drives *intentional* whistleblowing (e.g., Snowden). However, the sheer number of conspirators drives *accidental* disclosure (error, drunkenness, domestic rows).
  *   **The Grimes Equation:** Physicist David Grimes modelled this precisely. The probability of a conspiracy failing rises exponentially with the number of conspirators ($N$) and time ($t$).
  *   **The Calculation:** For hundreds of people ($N$) over five years ($t$), the probability of remaining undetected is negligible, regardless of internal controversy. Human error alone swamps the lack of moral objection.

  ### 3. Seminar Intervention

  If you need a tight summary to put to the room, try this:

  > "The phrase 'absence of evidence is not evidence of absence' is only valid if we had no reason to expect evidence in the first place. But in a surveillance programme involving hundreds of people over five years, we *should* expect leaks via error or conscience. Since the evidence was expected but not found, the silence is not neutral; it is strong probabilistic evidence of absence. To claim otherwise is to treat the conspiracy as magically immune to human error."
