      *   Analysis: The "Snowden effect" or general whistleblowing dynamics suggest that large groups + secrecy = high leak probability over time. If the programme were real and controversial, leaks are likely. If uncontroversial, maybe less so, but still, human error exists. The sheer number usually swamps the controversy factor over 5 years.

