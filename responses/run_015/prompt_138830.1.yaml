prompt: |-
  I work at a small research-funding foundation, and we are arguing about whether to stop assigning each early-stage proposal to a single reviewer and instead route it to a three-person panel that meets for twenty minutes and decides by majority vote. Both sides cite the Condorcet jury theorem, and I have come to think the citation is doing less work than everyone assumes, so I want a number with its derivation rather than a survey of what has been said about the theorem.

  The proposition I want your credence on is this: for our actual decisions — binary fund/don't-fund calls on early-stage proposals, made by reviewers drawn from the same few subfields — replacing the single reviewer with a deliberating three-person majority would raise the long-run rate of correct decisions by at least five percentage points. Take 'correct' to be settled by a rubric we write down now and apply three years later: the funded project produced the result it proposed, where 'produced' excludes outcomes that would have arrived anyway without our money. Take the question to be resolved by the obvious experiment: for two years, randomly assign a subset of proposals to be assessed both by a single reviewer and, separately and independently, by a three-person panel, then compare the two hit rates against that rubric. Give me (i) your probability that the panel arm beats the single-reviewer arm by five points or more, (ii) your probability on the bare comparative with the margin ignored, and (iii) your probability that the proposition has a determinate truth value at all, given how much weight 'produced' and 'would have arrived anyway' are carrying. Hold cost out of the picture: assume the extra reviewer-hours are free.

  I want the decomposition rather than a bare number, and I will show you my own attempt so you can tell me where it is broken. I modelled each decision as having, with probability λ, a 'shared-signal' character in which one common cue — the topic's current fashion, the framing of the call for proposals, a shared methodological prior — drives all three reviewers to the same verdict and is right with probability q; with probability 1−λ the three judgments are effectively independent and each is right with probability p. On that model the panel is right with probability λq + (1−λ)·M₃(p), where M₃ is majority-of-three accuracy under independence, and the single reviewer is right with probability λq + (1−λ)p, so the panel's entire advantage comes to (1−λ)(M₃(p) − p): never negative provided p exceeds one half, and entirely independent of q. The same model also predicts an error floor in the neighbourhood of λ(1−q) that no further enlargement of the panel removes. I do not trust this result, and I suspect the reason is that the stylization makes the shared component neutral between the two arms and holds p fixed across them. So: tell me what the model excludes that could make the panel actively worse than the single reviewer — I have in mind herding and information cascades, deliberation lowering effective p by substituting deference for private judgment, the shared cue being anti-informative in the sense that q < p, and the interaction of correlated error with unequal competence — then assign a number and a one-line justification to each of your sub-questions, show roughly how they combine into the three probabilities I asked for, and say how much of your final number rests on each of those exclusions. Our programme director puts 0.85 on the five-point claim and one of our board members puts 0.25; I am at 0.5. Tell me which sub-question their disagreement most likely lives in, which single measurement would move your own number the most, and what, if anything, would push it below one half.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Context:** Small research-funding foundation.
      *   **Decision:** Switch from single reviewer to 3-person panel (20 min deliberation, majority vote) for early-stage proposals.
      *   **Core Question:** Will this raise the long-run rate of *correct* decisions by $\ge 5$ percentage points?
      *   **Definition of "Correct":** Funded project produced proposed result (counterfactual: wouldn't have happened without funding), assessed 3 years later via rubric.
      *   **Task:** Provide probabilities for three specific propositions:
          1.  $P(\text{Panel Hit Rate} - \text{Single Hit Rate} \ge 0.05)$
          2.  $P(\text{Panel Hit Rate} > \text{Single Hit Rate})$
          3.  $P(\text{Proposition has a determinate truth value})$ (given the fuzziness of "produced" and counterfactuals).
      *   **Constraints:**
          *   No bare numbers; need decomposition/derivation.
          *   Address the user's specific model (Shared Signal $\lambda$ vs. Independent $1-\lambda$).
          *   Identify what the model excludes that could make panels *worse* (herding, deference, $q < p$, correlated error/unequal competence).
          *   Assign a number and one-line justification to sub-questions.
          *   Show how they combine.
          *   Analyze the disagreement between the Director (0.85) and Board Member (0.25).
          *   Identify the key measurement to update belief.
          *   Identify what would push the probability below 0.5.
      *   **Tone:** Analytical, rigorous, acknowledging uncertainty, avoiding hand-waving about Condorcet.

  2.  **Analyze the User's Model:**

      *   *Model:* $P(\text{Correct}) = \lambda q + (1-\lambda) \times \text{Accuracy}$.
      *   *Single:* $\lambda q + (1-\lambda)p$.
      *   *Panel:* $\lambda q + (1-\lambda)M_3(p)$.
      *   *Gain:* $(1-\lambda)(M_3(p) - p)$.
      *   *User's Critique:* Correct. This model assumes deliberation doesn't change $p$, assumes independence in the $(1-\lambda)$ case, and assumes the shared signal is equally accessible/weighted in both arms.
      *   *Missing Factors:*
          1.  **Deliberation Cost:** 20 mins is short. Might lead to deference to the senior member (lowering effective $p$ for the group compared to independent average).
          2.  **Correlated Error:** Reviewers from the "same few subfields" implies high correlation in priors/methodological biases. This increases $\lambda$ effectively.
          3.  **Selection Bias:** Who gets put on panels? Usually the "available" or "senior" ones, not necessarily the most accurate $p$. Single reviewers might be specialized matches.
          4.  **Counterfactual Noise:** The definition of "correct" (3-year rubric) is incredibly noisy. Did the money cause it? Hard to tell. This adds variance to the *measurement* of success, not necessarily the decision quality, but it affects the *observed* hit rate difference.
          5.  **Early-Stage Specifics:** Early stage = high uncertainty. $p$ is likely close to 0.5 (barely better than chance). Condorcet gains vanish as $p \to 0.5$.

  3.  **Evaluate the "Correctness" Metric (Proposition iii):**

      *   The definition relies on a counterfactual: "outcomes that would have arrived anyway without our money."
      *   In reality, foundations rarely run RCTs on their own funding (withholding money from a control group of "winners").
      *   The prompt says "Take the question to be resolved by the obvious experiment... randomly assign...". Okay, the user *proposes* an experiment to measure this.
      *   However, proposition (iii) asks about the *truth value* of the proposition given the weight of "produced" and "would have arrived anyway". Even with the experiment, attributing causality 3 years later is epistemically fraught.
      *   *Decision:* The truth value is determinate *in the context of the proposed experiment*, but ontologically fuzzy. I need to score the probability that the metric *itself* is coherent enough to yield a stable truth value. Let's say 0.8. It's measurable, but noisy.

  4.  **Evaluate the Performance Gap (Propositions i & ii):**

      *   *Condorcet Baseline:* If $p=0.6$, $M_3(p) = 0.648$. Gain = 4.8%. If $p=0.55$, $M_3(p) = 0.578$. Gain = 2.8%.
      *   *To get 5% gain:* Need $p \approx 0.62$ or higher *under independence*.
      *   *Reality Check:* Early-stage grant review accuracy ($p$) is notoriously low. Studies (e.g., NIH, NSF) often show inter-reviewer reliability is low (kappa ~ 0.2-0.4). This implies $p$ is not much better than chance, or correlation is very high.
      *   *Correlation:* If reviewers are from the "same few subfields", $\lambda$ is high. If $\lambda$ is high, the $(1-\lambda)$ term shrinks, reducing the Condorcet benefit.
      *   *Deliberation:* 20 minutes is very short. Risk of "groupthink" or deference to the chair. This could make effective $p_{panel} < p_{single}$ in the independent component.
      *   *Director (0.85):* Optimistic about deliberation quality and reviewer competence.
      *   *Board Member (0.25):* Skeptical of group dynamics or reviewer competence.
      *   *My Assessment:* Early-stage prediction is hard. $p$ is likely low (0.55-0.60). Correlation is likely high. Deliberation time is short. A 5-point gain is ambitious.
      *   *Estimate for (ii) (Panel > Single):* Likely true, but margin is small. Maybe 0.65.
      *   *Estimate for (i) (Margin $\ge$ 5%):* This requires $p$ to be decent and correlation to be low. Unlikely for "same subfields". Maybe 0.35.

  5.  **Drafting the Decomposition:**

      *   I need to break down the probability $P(\text{Gain} \ge 0.05)$ into components based on the user's model extensions.
      *   Key variables:
          1.  $p$: Individual competence (probability single reviewer is right).
          2.  $\rho$: Correlation between reviewers (inverse of independence).
          3.  $\delta$: Deliberation effect (does talking help or hurt?).
          4.  $\sigma^2_{metric}$: Noise in the 3-year rubric.

      *   *Refining the User's Model:*
          *   Single: $Acc_1 = p$.
          *   Panel: $Acc_3 = f(p, \rho, \delta)$.
          *   Gain $\Delta = Acc_3 - Acc_1$.
          *   We need $P(\Delta \ge 0.05)$.

      *   *Sub-questions for Decomposition:*
          1.  **Competence ($p$):** Is the average reviewer better than 0.6? (Needed for 5% gain under independence).
          2.  **Independence ($1-\lambda$):** Are errors uncorrelated enough?
          3.  **Deliberation ($\delta$):** Does 20 mins improve or degrade the aggregate signal?
          4.  **Measurement Stability:** Does the rubric yield a stable signal?

  6.  **Addressing the "What makes panels worse" prompt:**

      *   *Herding/Cascades:* In 20 mins, the first speaker or the senior member dominates. Effective $N$ drops from 3 to 1.
      *   *Deference:* Junior reviewers align with senior to avoid conflict.
      *   *Shared Bias ($q < p$):* If the "fashionable" topic is actually wrong (bubble), the shared signal leads everyone astray. Single reviewer might be idiosyncratic (sometimes right).
      *   *Regression to Mean:* Panels often smooth out extreme scores. If the single reviewer was a "super-recognizer" of high-risk/high-reward, the panel might reject it as too risky.

  7.  **Calculating the Numbers:**

      *   *Prop (iii) Truth Value:* 0.85. The experiment is well-defined, even if the underlying ontology of "causality" is fuzzy. The rubric operationalizes it.
      *   *Prop (ii) Panel > Single:* 0.60. Three heads are usually better than one, even with correlation, unless deliberation is toxic.
      *   *Prop (i) Margin $\ge$ 5%:* 0.30. This is the hard one. 5% is huge in grant land. NIH studies often show reproducibility of funding decisions is barely above 50%. To get a *5 point improvement* implies moving from say 55% to 60%. Given high correlation in subfields, this is optimistic.

      *   *Re-evaluating based on "Early Stage":* Early stage = high noise. $p$ is lower. Condorcet benefits shrink as $p \to 0.5$. If $p=0.55$, max gain (independent) is 2.8%. To get 5%, you need $p > 0.62$. Is a single reviewer 62% accurate on *early stage* science 3 years out? Unlikely.
      *   *Adjustment:* I need to be more skeptical than my initial draft.
      *   *New (i):* 0.25.
      *   *New (ii):* 0.55. (It might be a wash).
      *   *New (iii):* 0.80.

  8.  **Addressing the Disagreement (Director vs. Board):**

      *   Director (0.85): Believes $p$ is high and deliberation adds value ($\delta > 0$).
      *   Board (0.25): Believes $p$ is low (near chance) or correlation is high ($\lambda \approx 1$).
      *   *Crux:* The value of $p$ (individual competence) and the effective independence.
      *   *Key Measurement:* Inter-rater reliability (IRR) on a pilot set. If Kappa is low, correlation is high/competence is low.

  9.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the user's model. Validate their skepticism.
      *   **Part 1: The Model Critique (What excludes worse outcomes).** Detail Herding, Common Priors, and the "Early-Stage $p \approx 0.5$" problem.
      *   **Part 2: The Decomposition & Numbers.**
          *   Define the sub-probabilities.
          *   Show the math linking them to (i), (ii), (iii).
      *   **Part 3: The Disagreement Analysis.** Where do Director and Board diverge?
      *   **Part 4: The Pivot.** What measurement changes the mind? What breaks the 0.5 barrier?

  10. **Refining the Math for the "5% Claim":**

      *   Let $G$ be the gain.
      *   $G \approx (1-\lambda)(M_3(p) - p) + \delta$.
      *   For $G \ge 0.05$:
          *   If $\lambda = 0.5$ (moderate correlation), need $M_3(p) - p \ge 0.1$.
          *   $M_3(p) - p = 3p^2(1-p) + p^3 - p = 3p^2 - 2p^3 - p$.
          *   Max value of Condorcet gain is at $p \approx 0.75$? No, derivative $6p - 6p^2 - 1 = 0$. $p \approx 0.21$ or $0.79$. At $p=0.6$, gain is 0.048. At $p=0.65$, gain is 0.066.
          *   So if $\lambda=0$, need $p \ge 0.63$.
          *   If $\lambda=0.5$, need $M_3(p) - p \ge 0.1$. This is impossible for binary majority vote (max gain is ~0.14 at $p=0.75$). Wait, max gain is at $p=0.5$? No, gain is 0 at $p=0.5$ and $p=1$. Max gain is around $p=0.7$.
          *   Actually, $M_3(p) - p = p(1-p)(3p-1)$? No.
          *   $M_3(p) = 3p^2(1-p) + p^3 = 3p^2 - 2p^3$.
          *   Gain $= 3p^2 - 2p^3 - p = p(3p - 2p^2 - 1) = -p(2p^2 - 3p + 1) = -p(2p-1)(p-1) = p(1-p)(2p-1)$.
          *   Max gain occurs at derivative $1 - 4p + 3p^2 = 0 \rightarrow (3p-1)(p-1)=0$. Max at $p=1/3$ (negative gain region) or check bounds.
          *   Wait, $M_3(p) > p$ only when $p > 0.5$.
          *   Max gain is at $p \approx 0.79$. Value $\approx 0.148$.
          *   So if $\lambda = 0.5$, max possible gain is $0.5 \times 0.148 = 0.074$.
          *   So a 5% gain is *possible* even with 50% correlation, but requires high competence ($p > 0.65$).
          *   If $p=0.6$ (typical expert), gain is $0.048$. With $\lambda=0.5$, gain is $0.024$.
          *   Conclusion: To get 5% gain, you need either very low correlation ($\lambda < 0.3$) OR very high competence ($p > 0.7$). Both are unlikely in "same subfield" early-stage review.
      *   This math supports a low probability for (i).

  11. **Final Polish:**

      *   Ensure the tone is respectful of the user's modeling effort.
      *   Make sure the "one-line justifications" are punchy.
      *   Check that I answer all parts of the prompt (i, ii, iii, decomposition, disagreement, measurement, threshold).

