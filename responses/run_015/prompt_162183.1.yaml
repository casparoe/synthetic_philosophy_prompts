prompt: |-
  Write a satirical onboarding packet, roughly 700 words, issued by the Office of the Sortition Authority of a country that has replaced its elected legislature with a chamber chosen by lot. Format it as three short sections: a summons-and-congratulations letter to a newly selected member, a numbered FAQ, and a bulleted code of conduct. The voice should be deadpan bureaucratic cheerfulness — the tone of a jury-duty notice crossed with a corporate HR welcome guide.

  The packet should register the real objections to sortition by embodying them rather than stating them, and two invented institutional features should carry most of the weight. First: because members serve one short term and then rotate out, the Authority forbids them from acquiring subject-matter expertise or hiring their own staff — a member who researches an issue on their own is said to have "de-mirrored," and all briefing is supplied by a permanent civil service that also drafts the motions the chamber may vote on. Second: because non-response and dropout would otherwise ruin the sample's descriptiveness, the Authority reweights votes to restore the original demographic proportions, so the packet must explain cheerfully that a given member's vote may count 1.37 or 0.62 depending on how many people of their kind declined to serve, quit, or were excused.

  Work in as well: who sets the agenda and what the chamber is not permitted to vote on at all; the thought that selection by lot is the democratic method while election is aristocratic; descriptive representation as the whole point of the exercise, together with the awkwardness that a member is chosen for being typical and yet may not claim to represent anyone; the handling of experts as witnesses who must always be heard in adversarial pairs; and the residual rule that any motion on which the chamber deadlocks is settled by a fresh lottery, so that judgment is never really eliminated, only relocated.

  No character should wink at the reader or observe that any of this is undemocratic; the reader should arrive there unaided. Do not name or cite real theorists, living or dead. Make the piece intelligible to someone who has never heard the word "lottocracy," while keeping it fair enough that a defender of sortition would concede the packet describes a recognizable version of their own view rather than a caricature of it.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Satirical onboarding packet for a country with a sortition-based legislature (chosen by lot).
      *   **Issuer:** Office of the Sortition Authority.
      *   **Length:** Roughly 700 words.
      *   **Format:** Three sections (Summons/Congrats Letter, Numbered FAQ, Bulleted Code of Conduct).
      *   **Tone:** Deadpan bureaucratic cheerfulness (Jury duty notice + Corporate HR welcome guide).
      *   **Key Constraints/Features to Include:**
          *   Embody real objections to sortition without stating them explicitly (show, don't tell).
          *   Feature 1: No expertise/staff allowed ("de-mirroring"), briefing by permanent civil service who draft motions.
          *   Feature 2: Vote reweighting based on demographic dropout rates (e.g., vote counts 1.37 or 0.62).
          *   Agenda setting: Who sets it? What can't be voted on?
          *   Ideology: Sortition = democratic, Election = aristocratic.
          *   Representation: Descriptive representation is key, but members can't claim to represent anyone (chosen for being typical).
          *   Experts: Heard in adversarial pairs.
          *   Deadlocks: Settled by fresh lottery.
          *   No winking at the reader (no meta-commentary on undemocratic nature).
          *   Fair enough for a defender to recognize it (not a strawman).
          *   No real theorists cited.

  2.  **Drafting - Section 1: Summons-and-Congratulations Letter:**
      *   *Goal:* Establish the tone and the basic premise (you were picked, don't worry about expertise, you are statistically significant).
      *   *Tone:* Warm but impersonal.
      *   *Content:* Notification of selection, explanation of the "Democratic Lottery," prohibition on research ("de-mirroring"), mention of the civil service briefing.
      *   *Word Count Check:* Need to manage length carefully to hit ~700 total.

  3.  **Drafting - Section 2: Numbered FAQ:**
      *   *Goal:* Address the mechanical oddities (vote weighting, agenda, experts, deadlocks).
      *   *Content:*
          *   Why me? (Random selection vs. aristocratic election).
          *   Vote weight (Demographic reweighting).
          *   Expertise (Civil service provides facts, experts come in pairs).
          *   Agenda (Permanent Secretariat sets it, certain topics off-limits).
          *   Deadlocks (Random resolution).
      *   *Tone:* Helpful, clarifying, slightly unsettling implications delivered matter-of-factly.

  4.  **Drafting - Section 3: Bulleted Code of Conduct:**
      *   *Goal:* Reinforce the restrictions and the philosophy.
      *   *Content:* No campaigning, no claiming representation, no independent research, compliance with vote weighting.
      *   *Tone:* Rules-based, compliance-oriented.

  5.  **Review and Refine (Self-Correction during drafting):**
      *   *Check:* Did I mention "de-mirroring"? Yes, need to ensure that term is used.
      *   *Check:* Is the vote weighting clear? Need to make sure the 1.37/0.62 example is there.
      *   *Check:* Is the tone right? Avoid sarcasm that breaks the fourth wall. It must sound like *they* believe this is normal.
      *   *Check:* Word count. 700 words is tight for three sections. I need to be concise.
      *   *Check:* Fairness. A sortition defender should recognize the logic (avoiding career politicians, descriptive representation) even if the satire highlights the absurdity.
      *   *Check:* Agenda setting. Need to specify who controls it (Civil Service/Secretariat) and what's off-limits (probably the system itself).
      *   *Check:* Deadlocks. Must mention the fresh lottery.

  6.  **Drafting - Step-by-Step:**

      *   *Header:* OFFICE OF THE SORTITION AUTHORITY.
      *   *Letter:* Welcome Citizen [ID]. You are selected. This is democracy (not aristocracy). Do not study issues (de-mirroring). We provide briefings.
      *   *FAQ:* 1. Why lot? (Elections are elite). 2. Vote weight? (Demographic correction). 3. Experts? (Adversarial pairs). 4. Agenda? (Secretariat sets it, Constitution off-limits). 5. Ties? (Randomizer).
      *   *Code:* No staff. No claims of representation. Accept weighted vote. No independent research.

      *Let's write.*

