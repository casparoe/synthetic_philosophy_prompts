answer: |-
  **OFFICE OF THE SORTITION AUTHORITY**
  **CITIZEN LEGISLATOR ONBOARDING PACKET**

  **SECTION I: NOTICE OF SELECTION AND WELCOME**

  Dear Citizen #89402,

  Congratulations! You have been randomly selected to serve in the National Chamber for the upcoming quarterly term. Please accept this letter as your formal summons. While traditional societies relied on aristocratic elections—wherein the wealthy and popular compete for power—our system ensures true democracy by selecting rulers who are statistically identical to the ruled. You are not here because you are special; you are here because you are typical.

  Your primary duty is to vote on motions drafted by the Permanent Civil Service. To maintain the Chamber's descriptive fidelity, you are strictly prohibited from acquiring subject-matter expertise. Consulting outside sources, reading policy whitepapers, or hiring advisors constitutes "de-mirroring." If you know more than the average citizen about an issue, you are no longer a valid sample. All necessary briefing materials will be provided by the Authority at the start of each session. Please report to the Capitol Complex on Monday. Failure to appear will trigger a demographic recalculation of your constituency's voting power.

  **SECTION II: FREQUENTLY ASKED QUESTIONS**

  1.  **Why was I chosen by lot instead of elected?**
      Elections favor the articulate, the wealthy, and the careerist, creating a ruling class distinct from the people. Sortition eliminates campaigning and lobbying. You are a mirror, not a leader.

  2.  **Why does my voting app show a multiplier (e.g., 1.37x or 0.62x)?**
      To ensure the Chamber remains a perfect microcosm, votes are reweighted based on demographic attrition. If 40% of selected single parents decline service, your vote as a serving single parent is increased to 1.37 to restore proportional accuracy. Conversely, if your demographic group has low dropout rates, your vote may be discounted to 0.62. This ensures the final tally reflects the nation, not just those who showed up.

  3.  **How do we hear from experts if we cannot research?**
      The Civil Service summons expert witnesses in adversarial pairs. For every expert advocating a policy, an equally credentialed expert must argue against it. You are not expected to judge their merit, only to observe the conflict before voting.

  4.  **Who sets the agenda?**
      The Permanent Secretariat determines all legislative topics. Please note that the structure of the Sortition Authority, the budget of the Civil Service, and the rules of demographic weighting are constitutionally exempt from Chamber voting.

  5.  **What happens if a vote is tied?**
      The Chamber is a body of judgment, but deadlock indicates a failure of randomness. Any motion resulting in a 50-50 split is settled by a fresh lottery draw among the tied members. Judgment is never eliminated, only relocated.

  6.  **Can I claim to represent my district?**
      No. You represent no one. You are a descriptive unit. Claiming to speak for others implies a mandate, which is an aristocratic conceit.

  **SECTION III: CODE OF CONDUCT AND COMPLIANCE**

  *   **No Independent Research:** Accessing news media or policy data regarding pending motions is a Class C violation. Ignorance is a statutory requirement for validity.
  *   **No Staffing:** You may not hire assistants. You are a temporary amateur; reliance on permanent staff is a feature, not a bug.
  *   **Demographic Compliance:** You must update your marital, employment, and health status weekly. Changes may alter your voting weight mid-term.
  *   **Silence on Representation:** Public statements claiming you "fight for the people" are prohibited. You fight for nothing; you reflect everything.
  *   **Acceptance of Randomness:** Disputes regarding procedure, seating, or speaking order will be resolved by dice roll. To argue against the roll is to argue against democracy itself.
  *   **Term Limits:** You serve one term only. Returning citizens are statistically suspect and will be disqualified.

  Welcome to the People's Chamber. Your lack of qualification is your highest credential.
