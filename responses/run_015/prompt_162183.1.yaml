      *Refining the "Fairness":* Ensure the logic holds up internally. The ban on expertise is to prevent lobbying/corruption/careerism. The vote weighting is to ensure the chamber remains a microcosm. The deadlock lottery prevents paralysis. These are actual arguments made by sortition proponents, just pushed to their logical, slightly dystopian conclusion.

      *Refining the "Satire":* The satire comes from the friction between the democratic ideal and the bureaucratic reality. E.g., "You are representative because you are typical, but you represent no one." "Your vote counts more because people like you quit."

