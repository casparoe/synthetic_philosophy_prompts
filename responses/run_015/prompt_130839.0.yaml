answer: |-
  This is a sharp dissection. You are right to suspect that "Frame Problem" is being used as a philosophical Rorschach test here. Your friend is reaching for a fundamental limitation of AI (relevance), while you are pointing at a specific architectural choice (risk allocation). The truth is closer to your view, but the theoretical implications are messier than either of you allow.

  Here is the disciplined mapping you asked for.

  ### 1. The Agent and the Frame Axioms
  The agent is not the software, nor the driver, but the **sociotechnical control loop**. The "frame" is held by the organization's safety case, instantiated in code and policy.

  **The Frame Axioms (Implicit):**
  *   **Persistence:** Objects maintain identity across frames *only if* classification is stable. (This is where the tracking reset enters).
  *   **Relevance:** An object is relevant for Emergency Braking (AEB) *only if* classified as Vehicle, Pedestrian, or Cyclist with high confidence.
  *   **Stasis:** The environment is static regarding threats unless classified. An "unknown object" is treated as background noise (static frame element) rather than a dynamic threat.
  *   **Delegation:** If the automated system disengages or hesitates, the human safety driver maintains the frame of "vigilant observer."

  **What Broke:**
  The **Relevance Axiom** was the failure point. The system detected an object (it entered the frame) but failed to update its *status* from "background" to "threat" because the classification label oscillated. Crucially, the **Delegation Axiom** broke simultaneously. The human was assumed to be part of the frame's maintenance (monitoring the edge cases), but the human had exited the frame cognitively.

  The specific axiom that killed Herzberg was: *"Uncertainty implies wait, not stop."* In a logical frame, this is a decision rule. In a safety frame, it is a lethal constraint. The system treated "unknown" as "unchanging background" (a frame axiom violation regarding dynamics) rather than "potential obstacle."

  ### 2. The Frame-Churn (Reclassification Reset)
  Your friend is identifying a real phenomenon but labeling it with the wrong philosophy. The "re-framing cost" they describe is not the McCarthy/Hayes Frame Problem (which concerns the computational cost of proving *nothing else changed* after an action). This is the **Object Permanence/Identity Problem** in perception.

  However, your friend is right that this has teeth. By resetting the tracked history upon reclassification, the system destroyed the *temporal integration* required to resolve ambiguity.
  *   **Frame Problem:** "If I move the block, do I need to re-calculate the color of the wall?"
  *   **Uber Bug:** "If I change my mind about what this blob is, do I forget where it was 2 seconds ago?"

  This isn't the classic Frame Problem, but it is a **Representation Stability Problem**. If the representation of the world flickers (Pedestrian -> Vehicle -> Bicycle -> Unknown), the system cannot accumulate evidence. It forces the system to treat every millisecond as a new logical state where previous inferences are voided. This *looks* like the Frame Problem because the system fails to carry forward "what matters" (the trajectory of the threat), but it's actually a failure of state maintenance in the perception stack. It's a bug with philosophical consequences, not a philosophical limit manifesting as a bug.

  ### 3. Too Small vs. Uncommitting
  This is the crux of your disagreement.
  *   **Too Small:** The ontology lacks "jaywalking pedestrian."
  *   **Uncommitting:** The ontology sees "something," but refuses to act until it knows "what."

  The evidence supports **Uncommitting**. The lidar saw the object. The radar saw the object. The fusion stack knew *something* was there. The failure was not in the *scope* of the frame (it was inside the sensor horizon), but in the **permission structure** within the frame.

  The classic Frame Problem asks: "How do we represent what changes?" The Uber case asks: "How do we represent what *matters* when we aren't sure what it *is*?"
  This is the **Qualification Problem** (a sibling of the Frame Problem): *What conditions must hold for an action to succeed?* Uber's qualification for braking was: `IF classification == KNOWN_THREAT`.
  The fix required was: `IF trajectory_intersects AND time_to_collision < X`.

  Your diagnosis ("frame deliberately shrunk") is more accurate than your friend's. The frame wasn't too small spatially; it was too narrow *semantically*. The system was designed to ignore anything that didn't fit a specific slot, effectively axiomatizing "irrelevance" for anything unclassified. That is a design choice to solve the Relevance Problem by brute force: "If we can't name it, it doesn't exist for the brake controller."

  ### 4. What Solving It Looks Like
  *   **More Frame Axioms (Monotonic):** Useless. Adding `IF object_height > 1m AND speed < 10mph` creates new edge cases. You cannot axiomatize the open world.
  *   **Nonmonotonic/Default Reasoning:** **High Value.** "Assume unknown moving objects are obstacles *unless* proven otherwise." This flips the default. This is what a defensive human driver does. The system used a default of "safe unless proven dangerous."
  *   **Situated/Embodied:** **Highest Value.** Decouple braking from classification. Use optical flow or time-to-collision (TTC) directly from sensor data without semantic labeling. This bypasses the "Frame" entirely. It treats the world as affordances (collision possible) rather than representations (that is a bicycle).
  *   **Precision-Weighting:** Treat classification uncertainty as high risk. If the probability distribution over classes is flat (it could be anything), the risk weight should spike. Uber's system treated uncertainty as *low confidence* (ignore) rather than *high entropy* (danger).

  The crash would likely have been prevented by the **Embodied** approach (AEB based on raw obstacle detection, not semantic class) or the **Nonmonotonic** default (Unknown = Stop). Both avoid the need to "solve" the frame by refusing to rely on a complete semantic description before acting.

  ### 5. Impact on Theory
  This case does not vindicate the pessimistic reading of the Frame Problem. The pessimistic reading suggests the world is too complex to be represented. Uber's world *was* represented accurately enough to detect the object; the failure was in the **coupling between representation and action**.

  The case shows that the classic Frame Problem is silent on three load-bearing issues:
  1.  **Delegation:** The Frame Problem assumes a unitary agent. It has no formalism for "Agent A handles the frame, Agent B handles the exceptions." When Agent B (the driver) is removed from the loop cognitively, the frame collapses. The theory doesn't account for the *human* as a frame-maintenance component.
  2.  **Organizational Framing:** The "frame" was set by Uber management (disable AEB to prevent jerkiness/comfort issues), not just the engineers. The philosophical frame is subordinate to the corporate risk frame. The "axiom" that comfort > aggressive braking was an organizational decision encoded in software.
  3.  **Latency/Time:** The classic Frame Problem is largely atemporal (state T to state T+1). The Uber crash was a failure of *real-time relevance*. The system had enough time to brake, but the *computational path* to the decision (classification -> prediction -> action) was too long. The "Frame" took too long to update.

  **Verdict:**
  Your friend is using "Frame Problem" as a synonym for "AI struggled with relevance." You are correct that this was a **deliberate framing choice** (shrinking the actionable world to reduce false positives) combined with a **delegation failure**.

  The truthful answer is indeed "a safety-culture failure with a philosophy gloss." The Frame Problem is a useful metaphor for why we can't list every exception, but it doesn't explain why Uber chose to ignore the exceptions they *could* see. The theoretical gap isn't about representation; it's about **responsibility allocation in partial-automation systems**. The frame wasn't broken; it was outsourced to a human who wasn't in the room, and the software was forbidden from acting on the things the frame didn't name.

  You win the argument on the technicals, but your friend wins on the warning: if you try to solve open-world driving with closed-world logic, you will eventually meet a case your axioms excluded. The difference is that Uber *knew* they were excluding cases and bet on a human to catch them. That's not the Frame Problem; that's a gamble.
