answer: |-
  Here is a breakdown of the claims hidden inside your brother-in-law's favourite phrase, ordered from the mundane to the metaphysical, followed by a verdict on the two specific arguments you're chewing over.

  ### Part 1: The Hierarchy of Claims
  *From "Boring Platitude" to "Genuinely Radical"*

  **1. The Friction Claim**
  *   **The Claim:** After you add up the commission, the spread, the tax, and the value of your own time, the net profit of any obvious opportunity is zero or negative.
  *   **Plausibility:** High. In liquid markets, this is almost certainly true for small players. In niche markets (like football trading), it depends on your specific costs.
  *   **Coherence:** Perfectly coherent. It's simple arithmetic.
  *   **Supports:** Primarily **(a)**. It says the street isn't empty, but the note is glued down and costs £50 of solvent to remove.
  *   **Verdict:** This is the strongest version of his argument. It is hard to refute without showing your specific net returns.

  **2. The Competition Claim**
  *   **The Claim:** If an opportunity exists, professionals with faster data, lower fees, and better models have already exploited it. You are not competing against the market; you are competing against the sharpest players in the market.
  *   **Plausibility:** Medium-High. In major stock markets, very high. In football trading, medium (professionals exist, but the market is fragmented and slower).
  *   **Coherence:** Coherent. It relies on the existence of a hierarchy of competence.
  *   **Supports:** Primarily **(b)**. It implies that if you see a trade, it's because a pro didn't want it, or you are the liquidity for their exit.
  *   **Verdict:** Plausible, but not absolute. It assumes the "pros" care about the same tiny stakes you do, which they might not.

  **3. The Information Claim**
  *   **The Claim:** The current price already incorporates all publicly available information. You cannot gain an edge using public data (news, stats, form) because the price has already moved to reflect it.
  *   **Plausibility:** Medium. Prices reflect *some* information quickly, but often overreact or underreact.
  *   **Coherence:** Coherent, but depends on how you define "public." (Is your model's output public? No. Is the data it uses? Yes.)
  *   **Supports:** Primarily **(c)**. It suggests the price is the best summary of reality available.
  *   **Verdict:** This is where the argument starts to wobble. Markets aggregate information, but they do not always process it *correctly*.

  **4. The Truth Claim**
  *   **The Claim:** The price is not just a summary of opinion, but an accurate reflection of true value or probability. Systematic outperformance is impossible because the market cannot be systematically wrong.
  *   **Plausibility:** Low. History is full of bubbles, crashes, and mispricings that lasted years.
  *   **Coherence:** Problematic. "True value" is unobservable. If the price is always right, there is no metric to judge it against.
  *   **Supports:** **(c)** exclusively. It elevates the market from "smart" to "infallible."
  *   **Verdict:** This is the weakest link. It turns a practical heuristic into a dogma. It contradicts the existence of bubbles.

  ***

  ### Part 2: The "No-Trade" Argument
  *Your brother-in-law's logic: If we all reason perfectly with the same info, we'd agree. If we trade, one of us is wrong. If we know we're both rational, we shouldn't trade.*

  **What it establishes:**
  This argument is about **speculative volume**, not the existence of profit. It claims that purely betting against each other based on different opinions is a fool's game among rational agents. If I sell to you, I must think the price is too high. You must think it's too low. If we both know the other is rational, we should both realise we can't both be right, and cancel the trade.

  **Does the "rescue" (insurance, rebalancing, cash needs) save it?**
  Yes, but it changes the subject. The theorem applies to *speculative* trading (trading to make money from price changes). It does not apply to *hedging* (trading to reduce risk) or *liquidity* trading (trading because you need cash for a house).
  *   **Verdict:** The existence of insurance-style trading does not prove there are £50 notes on the pavement. It just proves people have different needs. You can have a market full of trade where no one expects to make a profit on the trade itself (they are paying for risk transfer).
  *   **For your Christmas argument:** This supports his point **(b)**. If you are trading purely because you think you know better than the counterparty, the theorem suggests you are the mark. If you are trading because you have a specific model that processes public data differently, you are claiming to have a "private" interpretation, which bypasses the theorem but invites the Competition Claim (2) above.

  ***

  ### Part 3: The "Sweeping" Argument
  *Your logic: If the pavement were clean, no one would sweep. If no one sweeps, it gets dirty. So it can't be perfectly clean.*

  **Which reading does this sink?**
  This sinks **Claim 4 (The Truth Claim)** and weakens **Claim 3 (The Information Claim)**.
  If markets were perfectly efficient (no £50 notes ever), there would be no profit incentive to hire analysts, build models, or run trading desks. If no one does that work, prices would stop reflecting information and become wrong. Therefore, markets must be *just inefficient enough* to reward the people who correct them.

  **Does the boring version survive?**
  Yes. **Claim 1 (The Friction Claim)** survives untouched. The sweeper might find a £50 note, but it might cost them £49 in brooms and time to pick it up. The market can be "inefficient" (notes exist) but still "unbeatable" for you (net profit is zero).

  **Verdict:**
  This is your strongest card. It proves that a certain level of inefficiency *must* exist for the market to function. However, it does not prove *you* can capture it. It establishes that the pavement is dirty, but not that you have the right shoes to walk on it without paying the toll.

  ***

  ### Summary for the Christmas Table

  1.  **On the "No £50 Notes":** Tell him you accept **Claim 1 (Friction)** and **Claim 2 (Competition)**. These are sensible warnings.
  2.  **On the "Market is Right":** Reject **Claim 4 (Truth)**. Use the **Sweeping Argument**: if the market were perfectly right, no one would bother working there, so it wouldn't stay right. Inefficiency is the fuel that keeps the engine running.
  3.  **On the "No-Trade Theorem":** Concede that *speculative* disagreement between rational people shouldn't drive trade. Clarify that your model isn't based on "disagreement" but on processing speed or pattern recognition (which makes it a competition claim, not a logic claim).
  4.  **The Final Point:** His phrase conflates "there is no free money" with "there is no money to be made." The former is mostly true (after costs). The latter is false (gross profits exist, net is the hard part). Your model is a test of whether your specific costs are low enough to keep the difference.
