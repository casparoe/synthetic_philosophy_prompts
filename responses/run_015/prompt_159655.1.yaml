          *   (c) Price equals true value (Market Efficiency).

  3.  **Drafting the List of Claims (Boring to Radical):**

      *   *Claim 1 (The Practical/Boring One):* Transaction costs and effort eat small edges.
          *   Plausibility: High.
          *   Coherence: High.
          *   Supports: (a).
      *   *Claim 2 (The Competitive One):* Other players are faster/better/informed.
          *   Plausibility: Medium-High (in liquid markets), Medium (in niche markets like football).
          *   Coherence: High.
          *   Supports: (b).
      *   *Claim 3 (The Informational One):* Prices reflect all available public information.
          *   Plausibility: Medium (varies by market).
