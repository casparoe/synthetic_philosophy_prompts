prompt: |-
  I direct the translation and measurement team for a multi-country health and well-being survey that runs in a little over forty languages. Every week my analysts review a few dozen items where the same question, asked in two languages, produces response distributions that we do not think mean the same thing. Each of these items has to receive one of four verdicts: pool as-is; adapt the wording and pool with a documented caveat; do not pool for this language; or send the item back to the design team as unusable across the whole survey. At the moment the calls are made on instinct, different analysts decide differently, and we have been burned in both directions — pooling items that a reviewer later showed were not comparable, and dropping whole countries from a headline comparison for what turned out to be a bad translation.

  What I want is a decision procedure my team can actually run, grounded in what the linguistic relativity literature genuinely supports rather than in what a first-year textbook says it says. Two constraints on the theory side. First, I keep being told that the Sapir–Whorf hypothesis was refuted decades ago, and I need the procedure built out of only what survives that refutation: I do not want any step that assumes language determines what a person can represent or think, and I do want it said explicitly which familiar-sounding steps are of that kind and must be left out. Second, my current working rule — flag an item only when the cross-language difference sits in obligatory grammar, and ignore differences that are merely lexical — has started to look wrong to me. Please test it against the cases below and either repair it or replace it, naming the cases that break it and saying what the repaired rule costs us in false alarms.

  On the practice side: the procedure has to be executable in about twenty minutes by an analyst whose only training is a single undergraduate linguistics course, and it has to terminate in one of my four verdicts. For each step, say what would count as a sufficient answer, and whether the answer can be found in materials we already hold — translation notes, back-translations, cognitive interview transcripts, split-sample data — or requires a question to the country team, whose time I can spend at roughly two hours per flagged item and no more. Where a question is settled by fact, the procedure should settle it. Where it is settled by what we want the survey to claim — whether a construct is intended to travel or is allowed to be culture-specific — the procedure should stop, hand the decision to me, and say in plain language what I am choosing between. I also need a one-page version, free of theory vocabulary, for the sign-off meeting with country coordinators, and I want it marked honestly which steps are real tests and which are judgment calls with a checklist wrapped around them.

  Then run the procedure on three items from current work. For each, give me the verdict, the step at which the procedure reached it or the point at which it stopped and handed over, and the short plain-language paragraph I would take into sign-off.

  1. In Language A, the verb obligatorily marks the source of the speaker's information: whether they witnessed the thing, inferred it, or were told it. Our confidence item — How confident are you that the health information you get from your clinic is accurate? — could only be rendered in the reported form, and mean confidence came out well below the pooled sample. Our cognitive interviews suggest that respondents given the inferred form would score differently again. Is this a translation and encoding problem to be fixed by rewording, a difference in how speakers of A are led to construe confidence, or a substantive difference in trust in clinics?

  2. In Language B, every clause describing an event must mark its cause as either an agent acting intentionally or an impersonal process. Our self-efficacy item — How much control do you feel you have over your own health? — came back from back-translation in the impersonal-cause form; the translator said the agentive form reads as boastful and unnatural. Scores are lower than the pooled sample. Note two things: the item was designed to measure individual agency over health, a local advisory group has asked us to drop it as culturally inappropriate, and our funders have the self-efficacy index written into the deliverables.

  3. This is the one I expect not to like. Our headline single item — Overall, how satisfied are you with your life these days? — has no general evaluative term in Language C. The nearest word is closer to contentment with the lot one has been given; it carries no implication that a life is the sort of thing one assesses, or could improve. That item is what the cross-national ranking and all the press coverage rest on. If the procedure says Language C cannot be pooled, I want that said plainly, together with whatever the procedure then implies about the other thirty-nine languages — because I suspect the same argument tells against our English item as well, and I need to know whether I have to go to the funders and say so.

  Finally, tell me what the procedure cannot do. I especially want to know how it handles, or fails to handle, the standing confound that in our sample every linguistic difference is paired with a non-linguistic one — different health systems, different schooling, different interview settings, different norms about giving scalar answers — and what it should say when an item is answered by people responding in a second language rather than their first.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Director of translation and measurement team for a multi-country health survey (40+ languages).
      *   **Problem:** Inconsistent decision-making on item comparability (pool vs. adapt vs. drop vs. redesign). Current method is instinct-based.
      *   **Goal:** A decision procedure grounded in *actual* linguistic relativity literature (post-Sapir-Whorf refutation), executable by analysts with basic linguistics training (~20 mins/item), terminating in one of four verdicts.
      *   **Constraints:**
          *   *Theory:* No strong determinism (language doesn't limit thought). Must identify and exclude "strong Whorfian" steps. Must test/repair the current rule (obligatory grammar = flag, lexical = ignore).
          *   *Practice:* 20 mins/analyst time. Uses existing materials (notes, back-translations, cognitive interviews, split-sample) or limited country team contact (max 2 hrs/flagged item).
          *   *Output:* Full procedure + One-page plain language version (marked tests vs. judgment calls).
          *   *Application:* Run on three specific cases (Language A: Evidentiality/Confidence; Language B: Agency/Self-Efficacy; Language C: Life Satisfaction/Semantic Gap).
          *   *Limitations:* Address confounds (language vs. culture/system) and L2 speakers.

  2.  **Theoretical Grounding (Linguistic Relativity):**

      *   *The "Refuted" Stuff:* Strong Sapir-Whorf (language *determines* thought, makes certain concepts unrepresentable). We cannot assume speakers of Language A *cannot* think about confidence without evidential markers.
      *   *The "Surviving" Stuff:* Neo-Whorfianism / Linguistic Relativity Lite. Language influences *attention*, *habitual thought*, *processing speed*, and *interpretive framing*. Obligatory categories (grammar) force speakers to attend to specific information during encoding/decoding. Lexical gaps make certain concepts harder to access or prime different associations.
      *   *Implication for Survey:* It's not about "can they understand?" but "what are they being prompted to attend to?" and "does this prompt match the construct definition?"
      *   *Critique of Current Rule:* "Flag obligatory grammar, ignore lexical" is too blunt.
          *   *Counter-example 1 (Lexical):* "Health" might mean "absence of disease" in one culture/language and "holistic balance" in another. This is lexical/semantic but crucial.
          *   *Counter-example 2 (Grammar):* Gendered nouns might not matter for a health item. Obligatory grammar isn't *always* relevant.
          *   *Repair:* Focus on *semantic relevance to the construct*, not just grammatical obligatoriness.

  3.  **Drafting the Decision Procedure (The "Comparability Protocol"):**

      *   *Structure:* Needs to be a flowchart or step-by-step checklist.
      *   *Time Limit:* 20 minutes.
      *   *Steps:*
          1.  **Construct Alignment:** Does the translation map to the *definition* of the concept? (Not just the word).
          2.  **Priming/Attention:** Does the language force attention to information irrelevant or contradictory to the construct? (This is where Neo-Whorfianism lives).
          3.  **Response Burden:** Does the language make answering harder or socially risky?
          4.  **Empirical Check:** Do the data (cognitive interviews, split samples) support the linguistic hypothesis?
          5.  **Policy Decision:** If linguistic equivalence fails, is the construct universal or local? (Director's call).

      *   *Addressing the "Current Rule" (Grammar vs. Lexical):*
          *   *Repair:* Replace with "Obligatory Information Relevance." If the grammar forces you to specify X, and X is irrelevant to the construct, it adds noise. If the lexicon forces you to use word Y, and Y implies Z which contradicts the construct, it adds bias.
          *   *Cost:* Increased false alarms (flagging items that are actually fine) because we are looking deeper than just grammar.

  4.  **Developing the One-Pager:**

      *   Needs to be non-technical.
      *   Must distinguish "Hard Tests" (facts) from "Judgment Calls" (policy).
      *   Audience: Country Coordinators (political stakeholders).

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1 (Language A - Evidentiality):*
          *   *Issue:* Verb forces "reported" info. Construct is "confidence" (internal state).
          *   *Analysis:* Grammar forces attention to source, not internal certainty. Mismatch.
          *   *Verdict:* Adapt/Do Not Pool.
      *   *Case 2 (Language B - Agency/Cause):*
          *   *Issue:* Grammar forces "impersonal process" vs "agentive". Construct is "self-efficacy" (agency).
          *   *Analysis:* Grammar directly contradicts construct (agency vs. fate). Cultural advisory agrees.
          *   *Verdict:* Do Not Pool (or Adapt if possible, but likely Drop for index).
          *   *Conflict:* Funders want index. This is a policy call.
      *   *Case 3 (Language C - Life Satisfaction):*
          *   *Issue:* No word for "satisfaction," only "contentment with lot."
          *   *Analysis:* Lexical gap changes construct from "evaluation" to "acceptance."
          *   *Implication:* If C is out, is English valid? English "satisfaction" is also culturally loaded.
          *   *Verdict:* Hand to Director. This challenges the whole survey construct.

  6.  **Addressing Limitations (Confounds & L2):**

      *   *Confounds:* Language is never isolated. The procedure isolates *linguistic* mechanisms, but cannot disentangle them from culture in the data alone. It relies on the *mechanism* identification.
      *   *L2 Speakers:* The procedure assumes L1 competence. L2 adds cognitive load. Need a specific note on this.

  7.  **Refining the Output:**

      *   *Tone:* Professional, authoritative, pragmatic, academically rigorous but accessible.
      *   *Formatting:* Clear headings, bold text for emphasis, distinct sections for Procedure, One-Pager, Case Studies, and Limitations.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Whorf is dead." I need to explain *what* is alive (thinking-for-speaking). I need to ensure the "20-minute" constraint is realistic. I need to make sure the "Director's Call" points are clear.

      *(Self-Correction on Case 2)*: The prompt says funders have the index written in. If we drop the country, we miss deliverables. If we pool, we lie. The procedure must highlight this tension.
      *(Self-Correction on Case 3)*: This is the "nuclear option." If Language C is out because of semantics, does English stand? The procedure needs to flag this as a "Construct Validity" issue, not just translation.

  8.  **Final Review against Constraints:**
      *   No strong determinism? Checked.
      *   Test current rule? Checked (replaced with "Relevant Obligatory Information").
      *   20 mins/analyst? Checked (streamlined steps).
      *   Four verdicts? Checked.
      *   One-pager included? Checked.
      *   Limitations section? Checked.

  9.  **Drafting the Content:** (Mental outline of the response structure)
      *   Introduction: Acknowledge the difficulty and the theoretical stance.
      *   Part 1: The Theory (Neo-Whorfianism vs. Strong Determinism).
      *   Part 2: The Decision Procedure (Step-by-Step).
      *   Part 3: The One-Page Summary.
      *   Part 4: Case Studies (A, B, C).
      *   Part 5: Limitations (Confounds, L2).

      *Let's refine the "Current Rule" critique.*
      Current Rule: Flag obligatory grammar, ignore lexical.
      Problem: "Health" (lexical) can vary more than tense (grammar).
      New Rule: Flag *Construct-Irrelevant Obligatory Information* (grammar or lexicon).
      Cost: More false positives (flagging things that turn out to be negligible), but fewer false negatives (missing big biases).

      *Let's refine the "20 minute" constraint.*
      Analyst needs to check: Translation notes, Back-translation, Cognitive Interview summary. If those don't resolve it, it goes to "Director/Country Team Query." The procedure itself must stop before the 2-hour query limit is hit.

      *Let's refine the "Verdicts".*
      1. Pool as-is.
      2. Adapt + Caveat.
      3. Do Not Pool (Country specific).
      4. Unusable (Global redesign).

      *Okay, ready to write.*
answer: |-
  # The Comparability Protocol: A Decision Procedure for Cross-Linguistic Measurement

  ## Part 1: Theoretical Grounding & The "Current Rule" Repair

  ### What Survives the Refutation?
  You are correct to be wary of the "Strong Sapir-Whorf" hypothesis (linguistic determinism). We do **not** assume that speakers of Language A *cannot* conceive of a concept because their language lacks a specific word. That is the refuted step.

  **What we rely on is "Neo-Whorfianism" (or "Thinking-for-Speaking"):**
  1.  **Habitual Attention:** Obligatory grammatical categories force speakers to attend to specific information *while encoding or decoding a message*.
  2.  **Priming:** Specific lexical choices activate associated cultural schemas that may conflict with the survey construct.
  3.  **Processing Cost:** If a respondent must mentally add information the language requires but the question doesn't provide (e.g., "How did you know that?"), response variance increases due to noise, not true difference.

  ### Repairing Your Current Rule
  **Current Rule:** *Flag only obligatory grammar; ignore lexical differences.*
  **Verdict:** **Replace.**
  **Why it breaks:**
  *   **False Negatives (The Danger):** Lexical gaps can be more damaging than grammar. If Language X has no word for "rights" but uses "privileges," the construct changes entirely, even though "privilege" is just a noun (lexical).
  *   **False Positives (The Cost):** Obligatory grammar isn't always relevant. If a language obligatorily marks noun gender, but the item is about "pain intensity," the grammar is irrelevant to the construct.

  **The Repaired Rule:** *Flag **Construct-Irrelevant Obligatory Information** (CIOI).*
  Whether grammatical or lexical, does the language force the respondent to specify information that is **not** part of the construct definition?
  *   **Cost:** This increases "false alarms" (items flagged for review that turn out to be poolable). It is safer to over-flag than to pool biased data. The procedure below filters these alarms.

  ---

  ## Part 2: The Decision Procedure (Analyst Version)

  **Time Limit:** 20 Minutes per item.
  **Inputs:** Translation notes, Back-translation, Cognitive Interview (CI) summaries, Split-sample data (if available).
  **Output:** One of four verdicts or a "Director Decision" handoff.

  ### Step 1: The Construct Map (5 Minutes)
  *   **Action:** Compare the *definition* of the construct (from the codebook) against the *semantic range* of the translated term(s).
  *   **Question:** Does the translation require the respondent to assume facts not in evidence to answer grammatically?
  *   **Look for:**
      *   **Evidentiality:** Does the verb force a source (seen vs. heard)?
      *   **Agency:** Does the grammar force an actor (self vs. fate)?
      *   **Aspect:** Does the verb force a timeline (ongoing vs. completed) that contradicts the question (e.g., "current health")?
      *   **Lexical Scope:** Does the word imply more/less than the construct (e.g., "health" = "absence of disease" vs. "holistic balance")?
  *   **Sufficient Answer:** "Yes, the translation forces specification of X" or "No, the translation is semantically neutral regarding the construct."
  *   **Source:** Translation notes, Back-translation.
  *   **If "No":** Verdict = **Pool as-is**. (Stop).
  *   **If "Yes":** Proceed to Step 2.

  ### Step 2: The Cognitive Check (5 Minutes)
  *   **Action:** Review Cognitive Interview transcripts for this item in this language.
  *   **Question:** Did respondents struggle with the forced information identified in Step 1?
  *   **Look for:**
      *   Respondents asking clarifying questions ("Do you mean how I know, or how I feel?").
      *   Respondents selecting answers based on the forced information (e.g., lowering confidence score because they weren't sure of the source).
      *   Interviewer notes on hesitation or discomfort.
  *   **Sufficient Answer:** "CI data confirms the linguistic feature alters response behavior" or "CI data shows respondents ignore the feature."
  *   **Source:** CI Transcripts/Summaries.
  *   **If "Ignore the feature":** Verdict = **Pool as-is** (Document in notes). (Stop).
  *   **If "Alters behavior":** Proceed to Step 3.

  ### Step 3: The Adaptation Test (5 Minutes)
  *   **Action:** Consult translation notes for alternative phrasings proposed during validation.
  *   **Question:** Can the item be reworded to remove the CIOI without losing the core meaning?
  *   **Look for:**
      *   Periphrastic constructions (using more words to bypass grammar).
      *   Alternative lexical roots.
  *   **Sufficient Answer:** "A viable alternative exists" or "No viable alternative exists without changing the construct."
  *   **Source:** Translation notes.
  *   **If "Viable alternative exists":** Verdict = **Adapt wording and pool with caveat**. (Stop).
  *   **If "No viable alternative":** Proceed to Step 4.

  ### Step 4: The Scope Decision (5 Minutes)
  *   **Action:** Determine if the construct itself is the problem.
  *   **Question:** Is this item measuring a universal psychological state, or is it measuring a culture-specific expression?
  *   **Look for:**
      *   Does the linguistic barrier exist in the *concept* (e.g., "Self-Efficacy") or just the *word*?
      *   Is this a "Headline Item" (critical for ranking) or a "Support Item" (covariate)?
  *   **Sufficient Answer:** This is often a policy judgment, not a fact.
  *   **Source:** Survey Design Document / Codebook.
  *   **Decision Point:**
      *   If the concept is universal but untranslatable: **Do not pool for this language** (Exclude country from this analysis).
      *   If the concept itself relies on English semantics (e.g., "Satisfaction"): **Send to Design Team** (Unusable across whole survey).
      *   **If unsure:** **Handoff to Director.** (State the trade-off clearly).

  ---

  ## Part 3: One-Page Sign-Off Summary (For Country Coordinators)

  **Subject:** Item Comparability Review Process
  **Goal:** Ensure fair comparison across countries without misrepresenting local responses.

  **How We Decide (The Checklist)**
  *Analysts review every flagged item against these three tests.*

  | Test | What We Check | Type |
  | :--- | :--- | :--- |
  | **1. The Meaning Test** | Does the translation force the respondent to answer a question we didn't ask? (e.g., forcing them to say *how* they know something when we only asked *what* they think). | **Fact** (Linguistic Analysis) |
  | **2. The Behavior Test** | Did people in cognitive interviews hesitate, ask for clarification, or answer differently because of the wording? | **Fact** (Interview Data) |
  | **3. The Fix Test** | Can we rephrase the question to fix the problem without changing the topic? | **Fact** (Translation Options) |

  **Where Judgment is Required**
  *If an item fails the tests above, we must make a policy choice. The Analyst flags these for Director review.*

  *   **Judgment Call A:** Is the concept (e.g., "Control over health") universal, or does it only make sense in some cultures?
  *   **Judgment Call B:** If we cannot fix the translation, do we exclude the country from the comparison, or exclude the question from the survey entirely?

  **Verdicts**
  1.  **Green (Pool):** Passed all tests.
  2.  **Amber (Adapt):** Failed Meaning Test, but passed Fix Test. (We will change wording and note the difference).
  3.  **Red (Exclude Country):** Failed Meaning/Fix Tests. Concept is universal, but this language cannot measure it fairly.
  4.  **Black (Exclude Item):** Failed Meaning/Fix Tests. Concept itself may be culturally biased. (Requires Survey Redesign).

  ---

  ## Part 4: Case Study Applications

  ### Case 1: Language A (Evidentiality & Confidence)
  *   **Step 1 (Construct Map):** **FAIL.** The verb obligatorily marks information source (reported vs. witnessed). The construct is "internal confidence." The grammar forces external validation. This is Construct-Irrelevant Obligatory Information.
  *   **Step 2 (Cognitive Check):** **FAIL.** CI suggests respondents given "inferred" form would score differently. The grammar drives the score, not the confidence.
  *   **Step 3 (Adaptation Test):** **PASS/FAIL.** Can we rephrase to avoid the evidential marker? Usually, evidentiality is obligatory on the main verb. If a periphrastic construction (e.g., "I have the feeling that...") bypasses the marker, it passes. If not, it fails. *Assumption for verdict:* Evidentiality is often hard to bypass in core verbs.
  *   **Step 4 (Scope):** The concept of "confidence" is likely universal, but the measurement is compromised.
  *   **Verdict:** **Adapt the wording and pool with a documented caveat** (If a workaround exists) OR **Do not pool for this language** (If no workaround).
  *   **Director Handoff Paragraph:**
      > "Language A requires speakers to state how they know information (seen vs. told). The current translation forces respondents to treat clinic accuracy as 'reported rumor' rather than 'personal assessment.' This artificially lowers scores. We can attempt a workaround using a noun phrase instead of a verb, but it changes the reading level. If we cannot bypass the grammar, we must exclude Language A from the 'Confidence' index, as their scores measure 'source reliability,' not 'personal confidence.'"

  ### Case 2: Language B (Agency & Self-Efficacy)
  *   **Step 1 (Construct Map):** **FAIL.** The construct is "Self-Efficacy" (Individual Agency). The grammar forces "Impersonal Process" (Fate/Environment). This is a direct contradiction of the construct definition.
  *   **Step 2 (Cognitive Check):** **PASS (for bias).** Translator notes say agentive form is "boastful." CI would likely show social desirability bias against the intended meaning.
  *   **Step 3 (Adaptation Test):** **FAIL.** If the agentive form is culturally "boastful," adapting the wording doesn't fix the cultural norm, only the grammar. The *concept* of individual agency is the friction point.
  *   **Step 4 (Scope):** **HANDOFF.** This is a conflict between the Construct (Western individualism) and the Culture (Local advisory group).
  *   **Verdict:** **Handoff to Director.** (Technically "Do not pool," but the implication is broader).
  *   **Director Handoff Paragraph:**
      > "Language B grammar distinguishes between 'self-caused' and 'fate-caused' events. To be grammatically natural, this item must be phrased as 'Health happens to you' rather than 'You control health.' The local advisory group confirms individual agency is culturally inappropriate here. We have a conflict: the funder requires a Self-Efficacy Index, but Language B speakers cannot validly answer this construct without violating social norms. We must choose: exclude Language B from the Index (missing deliverables) or redefine the Index as 'Perceived Health Locus of Control' globally to accommodate this variation."

  ### Case 3: Language C (Life Satisfaction)
  *   **Step 1 (Construct Map):** **FAIL.** "Satisfaction" (evaluative, improvable) vs. "Contentment" (acceptance, static). This is a lexical gap that shifts the construct.
  *   **Step 2 (Cognitive Check):** **N/A.** The semantic gap is fundamental.
  *   **Step 3 (Adaptation Test):** **FAIL.** If no general evaluative term exists, you cannot reword it without inventing a neologism (invalid).
  *   **Step 4 (Scope):** **HANDOFF.** This challenges the universal validity of the headline metric.
  *   **Verdict:** **Send item back to design team as unusable across the whole survey.**
  *   **Director Handoff Paragraph:**
      > "Language C lacks a concept equivalent to 'Life Satisfaction.' The nearest term means 'Acceptance of Fate.' If we pool Language C, we are comparing 'Evaluation' (English) against 'Resignation' (Language C). However, this reveals a flaw in the English item too: 'Satisfaction' is also a culturally loaded, Western evaluative stance. If Language C is invalid, the construct may not be universal. I recommend we pause the headline ranking. We must decide whether to fund a global construct re-definition (e.g., 'Well-being' instead of 'Satisfaction') or acknowledge that the ranking is only valid for the 30 languages that share this specific Western semantic frame."

  ---

  ## Part 5: Limitations & Confounds

  ### 1. The Linguistic-Cultural Confound
  **The Problem:** In your sample, Language A is always spoken in Country A. You cannot statistically disentangle whether the score difference is due to the *verb ending* or the *health system*.
  **How the Procedure Handles It:** It does not solve this statistically. It solves it *mechanistically*.
  *   If the procedure identifies a **linguistic mechanism** (e.g., obligatory evidentiality) that *could* cause the difference, you must assume the linguistic bias exists. You cannot assume "it's probably just their health system."
  *   **Rule:** If a linguistic mechanism for bias is identified, the item is flagged *even if* a substantive difference is also plausible. It is better to drop a valid country difference than to pool a linguistic artifact.

  ### 2. Second Language (L2) Respondents
  **The Problem:** Respondents answering in a second language (e.g., a migrant answering in the host country's language) operate under higher cognitive load. They may miss nuances or default to literal interpretations.
  **How the Procedure Handles It:** The current procedure assumes L1 competence.
  *   **Addendum:** If >10% of the sample for a language group are L2 speakers, the **Cognitive Check (Step 2)** automatically fails.
  *   **Reasoning:** L2 speakers process obligatory grammar differently (often ignoring it). This introduces variance that is neither "true score" nor "translation bias," but "proficiency noise."
  *   **Verdict:** **Do not pool for this language** unless L2 speakers are screened out or analyzed separately.

  ### 3. False Alarms (The Cost of the Repaired Rule)
  By moving from "Obligatory Grammar" to "Construct-Irrelevant Obligatory Information," you will flag more items.
  *   **The Cost:** Analyst time and Country Team queries.
  *   **The Mitigation:** Step 2 (Cognitive Check) is the filter. If the grammar exists but respondents ignore it (per CI), you pool. This saves the "false alarms" from becoming "excluded countries."
  *   **Honesty:** You will still send some items to the Country Team that turn out to be fine. This is the price of measurement integrity. It is cheaper to spend 2 hours querying a team than to publish a retracted headline finding.
