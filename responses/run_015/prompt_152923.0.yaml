answer: |-
  **The Origins Quiz**

  *Answer instinctively. Don't overthink the science; focus on what feels like "you."*

  1.  **The Slow Swap:** A scientist swaps one base pair in the sperm that made you. Then another. At what point are you no longer you?
      A) Immediately; any change makes a different person.
      B) Only when the genetic code meaningfully changes.
      C) There is no specific point; the question is vague.

  2.  **The Duplicate:** A different sperm cell fertilizes the egg, but it carries a base-pair-perfect copy of your father's original DNA.
      A) That is not you; the specific cell matters.
      B) That is you; the code is what counts.
      C) It's impossible to say; identity doesn't work that way.

  3.  **The Delay:** The same sperm and egg meet, but fertilization happens one hour later in a dish instead of the tube.
      A) Not you; the specific event is broken.
      B) You; the materials are identical.
      C) Irrelevant; only the resulting life matters.

  4.  **The Shell:** Your nuclear DNA is placed into an egg with donor cytoplasm (mitochondria).
      A) Not you; the egg's body is part of the origin.
      B) You; the nucleus holds the identity.
      C) A hybrid; identity is shared.

  5.  **The Split:** The zygote splits into identical twins. Who are you?
      A) Both of them.
      B) Only one (randomly selected).
      C) Neither; you are the singular organism that survived.

  6.  **The Reconstruction:** Gametes are synthesized years later from your own skin cells to conceive you.
      A) Not you; the origin time is wrong.
      B) You; the genetic source is still you.
      C) Not you; gametes must be natural causes, not parts.

  7.  **The Brick:** Are the gametes that made you parts of you or causes of you?
      A) Parts; you are made of them.
      B) Causes; they built you but aren't you.
      C) Neither; you are a continuing process.

  8.  **The Total Swap:** A completely different sperm and egg conceive a child in your place.
      A) Definitely not you.
      B) Possibly you, if the life is similar.
      C) No fact of the matter; counterfactuals are meaningless.

  9.  **The Backup:** The clinic implants a frozen sibling embryo from the same batch (same parents, different gametes).
      A) Not you; different cells.
      B) Not you; different genetic roll.
      C) Irrelevant; you are the one who exists now.

  10. **The Continuity:** You wake up with different origins but identical memories and body.
      A) You are still you; continuity wins.
      B) You are an impostor; origin wins.
      C) The question is confused; both matter.

  ***

  **Scoring Key**

  Tally your answers. Do not look for labels; look for the cluster.

  *   **The Materialist (Gamete Essentialism):** Mostly **A** on Q2, Q3, Q6. You believe the specific physical cells are necessary. If the sperm is numerically different, you are different, even if the DNA is identical.
  *   **The Codex (Genome Essentialism):** Mostly **B** on Q2, Q4, Q9. You believe identity lies in the information pattern. A duplicate genome creates you; mitochondrial swaps do not.
  *   **The Contextualist:** Mostly **A** on Q3, Q9 but **B** on Q2. You care about the specific historical event, not just the material. Timing and location constitute the origin.
  *   **The Animalist:** Mostly **C** on Q5, Q10, **B** on Q7. You prioritize the living organism's continuity over its starting conditions. You are the body that persists.
  *   **The Deflationist:** Mostly **C** on Q1, Q8. You reject the premise that there is a fact of the matter regarding non-actual origins.
  *   **The Noise:** No clear majority. You may hold inconsistent views or a position not mapped here (see Note 2).

  ***

  **The Taxonomy of Origins**

  **Root:** Is there a necessary condition for your existence in the past?
  │
  ├── **No (Anti-Essentialism/Deflationism)**
  │   └── *Leaf:* Counterfactuals have no truth value. (Q1-C, Q8-C)
  │
  └── **Yes (Essentialism)**
      │
      ├── **Branch:** What is the essential property?
      │   │
      │   ├── **Material (The Gametes)**
      │   │   ├── *Branch:* Does numerical identity matter vs. composition?
      │   │   │   ├── Yes (Specific Cells) → *Leaf: Gamete Essentialism* (Q2-A)
      │   │   │   └── No (Composition) → *Leaf: Organism/Animalist* (Q5-C, Q10-A)
      │   │   └── *Branch:* Are gametes parts or causes?
      │   │       ├── Parts → *Leaf: Material Constitution* (Q7-A)
      │   │       └── Causes → *Leaf: Causal Essentialism* (Q7-B)
      │   │
      │   ├── **Information (The Genome)**
      │   │   └── *Leaf: Genome Essentialism* (Q2-B, Q4-B)
      │   │
      │   └── **Event (The Context)**
      │       └── *Leaf: Contextual Essentialism* (Q3-A, Q9-A)
      │
      └── **Branch:** Is identity vague?
          └── *Leaf: Sorites Acceptance* (Q1-C)

  ***

  **Notes on the Logical Space**

  **1. Empty Cells and Incoherent Combos**
  Your hunch is correct: the "Sperm matters, Egg doesn't" box is empty. While sperm contribute DNA and eggs contribute cytoplasm, no consistent theory privileges the paternal gamete's numerical identity while dismissing the maternal one. To do so requires a metaphysical asymmetry that biology doesn't support; even patriarchal essentialisms usually rely on *seed* as information (Genome), not the specific cell (Gamete).

  The "Genome Identical + Timing Essential" combination is likely incoherent rather than merely unpopular. If the genetic code is identical, the only reason timing would matter is if the *gametes themselves* are essential (Gamete Essentialism). If you claim the DNA makes you, but the hour of conception also makes you, you are secretly a Contextualist who uses DNA as a proxy for the event. You cannot hold that the information is sufficient for identity while simultaneously claiming the container's history overrides it.

  **2. Collapses and Noise**
  The instrument struggles to separate **Genome Essentialism** from **Gamete Essentialism** unless Question 2 (The Duplicate) is weighted heavily. In natural conception, specific gametes and unique genomes always travel together. Readers who haven't encountered the "duplicate sperm" thought experiment will default to assuming they are the same condition. If your newsletter respondents split evenly on Q2 but cluster on Q4, you have successfully separated them. If not, the positions collapse into a general "Biological Essentialism."

  Regarding the **Noise** category: If respondents produce patterns like A-B-C-A-B-C, do not treat this as a missing position. It is likely noise or "Contextual Fragmentalism"—the view that identity criteria shift depending on the scenario. To flush this out, add a follow-up asking: "Is there one rule for all cases, or does it depend?" If they say "depends," they aren't noise; they are Pragmatists, a leaf you intentionally omitted to keep the tree clean. For the newsletter, treat inconsistent scorers as "Animalists in denial"—they care about the living result (Q10) but get distracted by the biology (Q2).
