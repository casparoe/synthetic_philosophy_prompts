prompt: |-
  Please act as an expert in metaethics and the philosophy of moral motivation. Before drafting anything, briefly brainstorm the central pressure points in applying the wrong-kind-of-reasons problem to second-order motivation—especially risks of collapse into first-order deontology, psychological feasibility concerns, and boundary disputes with epistemic justification.

  I am an undergraduate philosophy student preparing podcast interview questions for an unnamed philosopher who defends what she calls "meta-motivational isolationism": the view that moral worth requires not only acting for right first-order reasons (direct representations of an act's deontic status), but also forming and sustaining those reasons without appeal to narrative identity, psychological flourishing, solidarity, or socially constructed roles. She allows only reasons internal to the duty itself—such as role-based reasons where the role is constituted by the duty—to sanitize second-order motivation.

  Draft eight to ten rigorous interview questions that avoid generic biographical prompts. Press specifically on: (1) whether distinguishing second-order from first-order wrong-kind reasons avoids collapse; (2) how she separates permissible duty-constituted roles from impermissible social roles; (3) whether constant meta-cognitive monitoring makes moral life psychologically impossible, and what reply she has to habituation-based objections; (4) whether her isolationist boundary extends to epistemic belief-formation; and (5) what conceptual or empirical finding could genuinely undermine the view. For each major question, include a follow-up keyed to the answer she is most likely to offer. Keep the tone formal and suitable for a colloquium-level discussion rather than a popular summary.
