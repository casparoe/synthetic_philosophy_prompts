answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board, *Journal of Philosophy of Mathematics*
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Submission #24-09 (Analog Hypercomputation and the Church–Turing Thesis)

  **1. Context**
  Submission #24-09 argues that a proposed analog physical device, utilizing continuously varying physical quantities, can decide the Halting Problem in finite time. The author concludes this falsifies the Church–Turing Thesis (CTC). The board is currently divided between a desk rejection (on grounds of mathematical impossibility/scope) and external review (to assess physical realizability and philosophical implications).

  **2. The Epistemic Status of the Church–Turing Thesis**
  To adjudicate this submission, we must clarify what the author is claiming to falsify. The CTC is not a monolithic claim; it holds different epistemic statuses depending on interpretation:

  *   **The Mathematical/Logical CTC:** This is a claim about *effective calculability* defined by formal systems (e.g., $\lambda$-calculus, Turing Machines). On this reading, the CTC is arguably a definition or a mathematical conjecture about formal equivalence. It cannot be falsified by a physical experiment, only by a counter-example within a formal system.
  *   **The Physical CTC:** This is an empirical hypothesis that *no physical system in our universe* can compute functions beyond the Turing-computable. This is contingent on the laws of physics.

  If the author treats the **Mathematical CTC** as falsifiable by physics, they have committed a category error. If they target the **Physical CTC**, the claim is coherent but shifts the paper's primary weight to the philosophy of physics and the idealizations required to build the device (e.g., infinite precision, Zeno-like processes).

  **3. Steelmanning the Case for Desk Rejection**
  The board members advocating for immediate rejection are operating from a defensible and rigorous position. Their argument rests on three pillars:

  1.  **Category Error:** If the author conflates the Mathematical CTC with the Physical CTC, the paper is fundamentally confused. A physical gadget cannot refute a mathematical definition of effective procedure. Publishing this would signal that the journal tolerates basic conceptual conflation.
  2.  **Burden of Proof:** Claims of hypercomputation historically rely on physically impossible idealizations (e.g., measuring a real number with infinite precision in finite time). If the device requires infinite energy or ignores quantum noise limits, it is a "paper machine." It is not the job of a philosophy journal to vet engineering impossibilities.
  3.  **Scope Mismatch:** If the argument hinges entirely on the realizability of the device, the paper belongs in *Philosophy of Physics* or *Foundations of Physics*. For a *Philosophy of Mathematics* journal, the contribution must be about the *concept* of computation, not the *construction* of a machine. If the machine is impossible, the philosophical conclusion is vacuous.

  **4. The Case for External Review**
  However, a desk rejection carries risks. The relationship between physical computation and mathematical definability is a live debate in our field (e.g., the work of Copeland, Shagrir, or Hogarth).
  *   **Philosophical Value:** Even if the device is physically unrealizable, the paper might offer a novel argument regarding *why* we accept the Physical CTC. A "negative result" analysis (explaining why the device fails to falsify CTC) can be philosophically valuable.
  *   **Avoiding Dogmatism:** Rejecting without review might appear as if the board is protecting the CTC from empirical scrutiny by fiat, rather than by argument.

  **5. Recommendation**
  I recommend we **Send Out for External Review**, but with **strict referee criteria** designed to address the desk-reject concerns.

  We should not send this to a generalist. We need two referees: one with expertise in computability theory and one in philosophy of physics. We must explicitly instruct them to filter for the "category error" identified above. If the referees confirm the author conflates Mathematical and Physical CTC, we will have a documented, expert basis for rejection at the revision stage. This protects the journal's standards while avoiding the appearance of dogmatism.

  **6. Proposed Referee Criteria**
  When inviting referees, I propose we include the following specific questions:

  1.  **Distinction of Theses:** Does the author clearly distinguish between the *Mathematical* Church–Turing Thesis and the *Physical* Church–Turing Thesis? If they claim to falsify the former via physical means, please flag this as a fatal conceptual error.
  2.  **Physical Idealizations:** Does the proposed device rely on physically forbidden idealizations (e.g., infinite precision, infinite density, ignoring the Bekenstein bound)? If the device is physically impossible in principle, does the author acknowledge the philosophical limitation of their conclusion?
  3.  **Disciplinary Fit:** If the device is physically impossible, does the paper still offer sufficient value to the *philosophy of mathematics* (e.g., regarding the definition of effective procedure), or is it strictly a contribution to the *philosophy of physics*?

  **6. Next Steps**
  If you agree with this recommendation, I will draft the invitation letters to potential referees with these criteria attached. If the board prefers a desk rejection, I suggest we draft a response that explicitly cites the "Mathematical vs. Physical" distinction as the reason, to provide constructive feedback to the author.

  I look forward to discussing this at Tuesday's meeting.
