answer: |-
  This is an excellent puzzle. You have identified one of the most persistent tensions in the philosophy of consent: the conflict between **subjective materiality** (what *this* agent cares about) and **objective materiality** (what a *reasonable* agent would care about), and the further question of what normative work "invalidity" actually does.

  Your intuition is shared by many ethicists (notably Ruth Faden and Tom Beauchamp in their *History and Theory of Informed Consent*), who argue that deception only vitiates consent if it actually undermines the agent's autonomous authorization. However, your professor is defending a view often associated with Onora O'Neill or certain Kantian accounts: that consent is a normative power that requires a specific kind of integrity in the transaction, regardless of the outcome.

  Here is a way to structure your response that respects the sophistication of the seminar while pressing your objection without necessarily conceding to the "wild verdict" that this is morally equivalent to operating on a refuser.

  ### 1. The Counterfactual Test and Hypothetical Consent
  Your proposal is that materiality should track the counterfactual: *Deception vitiates consent only if the truth would have changed the decision.*

  You should be prepared for your professor to identify this as a version of **Hypothetical Consent**. The argument against this is strong: if we validate actions based on what the agent *would have* agreed to, we risk licensing paternalism.
  *   **The Professor's Likely Reply:** "If we allow the counterfactual to validate the consent, we are saying the surgeon was entitled to act based on what he *guessed* the patient would accept, rather than what she actually authorized. This turns consent from a constraint on action into a post-hoc ratification of benevolence."
  *   **Your Counter:** You aren't arguing for hypothetical consent *ex ante*; you are arguing for a subjective standard of materiality *ex post* to determine the *degree* of wrongfulness. However, be careful here. If you make the counterfactual the condition for *validity*, you do run the risk of the paternalism objection.

  ### 2. The "Battery" Equivalence is the Weak Point
  The most productive avenue for your seminar paper is not necessarily to prove the counterfactual test determines validity, but to challenge the professor's claim about the **normative consequences** of invalidity.

  The professor claims: *If consent is invalid, the surgeon has done something in the same normative category as operating on someone who refused outright.*

  This is the "wild verdict" you want to avoid. You can argue that **Validity** and **Wrongfulness** are distinct concepts.
  *   **Validity is Binary:** Either I authorized you, or I didn't. In your case, regarding the trainee, the patient explicitly said "No." The team did it anyway and hid it. Technically, that specific component was unauthorized. In a strict legal sense, this is a trespass (battery).
  *   **Wrongfulness is Scalar:** Just because an act is technically a battery does not mean it carries the same moral weight as a paradigmatic battery (e.g., operating on a conscious patient screaming "No").
  *   **The Distinction:** We can distinguish between **rights-violations** and **harmful wrongs**. The surgeon violated the patient's right to control (a deontological wrong), but did not set back her interests (no consequentialist harm), and the patient has retrospectively waived her complaint.
  *   **Argument:** You can accept that the consent was *invalid* (because the process was tainted by deception about a reasonable-person material fact) without accepting that the *moral blame* is equivalent to operating on a refuser. The "normative category" might be "unauthorized touching," but the *moral valence* is significantly mitigated by the lack of harm and the alignment with the patient's actual values.

  ### 3. The "Integrity of the Practice" Argument
  If you want to press the counterfactual point (that materiality *should* be subjective), you need to address why the professor prefers the reasonable-person standard. She likely worries about **epistemic access** and **incentives**.
  *   **Epistemic Access:** At the time of surgery, the team cannot know the counterfactual. They only know the patient ticked "No." If they are allowed to deceive based on a hunch that "she won't mind," they are undermining the reliability of the consent form.
  *   **Incentives:** If deception only vitiates consent when it changes the mind, medical staff have an incentive to deceive whenever they think the patient is being "unreasonable." (e.g., "She won't want the trainee, but the trainee needs the practice, and she won't mind later. I'll just hide it.")
  *   **Your Rebuttal:** You can argue that the **Subjective Standard** does not require the surgeon to guess the counterfactual *ex ante*. It requires them to tell the truth. If they tell the truth, the patient decides. The counterfactual test is only relevant for determining the *severity of the violation* after the fact, not for licensing the deception beforehand.

  ### 4. A Proposed Synthesis for Your Seminar
  Here is a specific line of argument you might take:

  > "Professor, I agree that the reasonable-person standard protects the integrity of the consent process *ex ante*. We cannot let surgeons decide unilaterally what information patients 'need.' However, I disagree that invalidity implies a monolithic normative category of wrongfulness.
  >
  > In the trainee case, the deception violated the patient's **authority** (her right to decide), but it did not violate her **autonomy** in the sense of her actual will and values (since she retrospectively endorses the outcome).
  >
  > If we treat this as morally equivalent to operating on a refuser, we are conflating **procedural invalidity** with **substantive harm**. A better account would hold that deception about reasonable-person material facts renders consent *voidable* (giving the patient the right to complain or sue), but the *moral wrongfulness* of the act is mitigated if the patient demonstrates that the deception did not actually subvert her will. This allows us to maintain strict standards for information disclosure (satisfying your concern) without delivering the counterintuitive verdict that a beneficial, endorsed surgery is a moral atrocity (satisfying my concern)."

  ### Summary
  You are right to feel that the "Battery" verdict is too blunt.
  1.  **Don't concede** that the counterfactual is irrelevant. It is relevant to *harm* and *moral blame*, even if your professor insists it is irrelevant to *validity*.
  2.  **Challenge the equivalence.** Argue that "Invalid Consent" creates a *pro tanto* wrong (a wrong unless overridden), but the weight of that wrong depends on whether the deception actually subverted the agent's will.
  3.  **Distinguish Law from Ethics.** Legally, this might be battery to protect the system of rights. Ethically, we can judge the agent's blameworthiness differently based on the outcome and the patient's retrospective view.

  This approach allows you to keep the rigorous definition of consent (preventing paternalism) while avoiding the absurd moral conclusion that the surgeon is as blameworthy as a malicious attacker.
