  3. This view breaks because even with identical physical form and authorship, it cannot explain why the reconstruction feels like a fake against the forgery's cultural primacy.
  4. The causal history view survives by locating the work's identity in the specific temporal chain of the object's public emergence rather than just the artist's biological production.
  5. Thus, the reconstruction remains a fake because the work's essence includes its historical trajectory, which the belated canvas cannot reclaim despite sharing the artist's signature.
