answer: |-
  A regional logistics company predicts driver shift lengths in a dense historic district using a simulation where drivers are assumed to walk at 10 mph between doors but spend 5 minutes locking up at each stop. In reality, drivers walk at 3 mph and spend 1 minute per stop. The excessive walking speed subtracts time from the prediction while the excessive lock-up time adds it back, resulting in a total shift duration that matches reality within 1%. A more accurate model that inputs the true walking speed and stop time consistently overestimates the shift length because it fails to account for unmodeled shortcuts drivers take through alleys, whereas the fake model's errors inadvertently compensate for this missing variable. The prediction holds perfectly for this specific neighborhood layout but relies entirely on the ratio of walking time to stopping time remaining constant.

  **Philosophical Analysis**

  *   **Instrumentalist Position:** Following Milton Friedman's methodology, the instrumentalist argues that the truth of the assumptions (walking speed and lock-up time) is irrelevant because the model yields accurate predictions within its intended domain. For them, the model is a tool for organizing data, not a map of reality; if the output matches the observed shift lengths, the model is scientifically valid for that purpose.
  *   **Representational Realist Position:** The realist contends that the model's success is accidental and does not constitute genuine understanding. Because the micro-rules are false and the accuracy depends on compensating errors rather than causal mechanisms, the model fails to represent the actual system. They argue that scientific progress requires models that track true entities and processes, not just output matching.
  *   **Structural Realist Position:** A structural realist might argue that while the specific parameters are wrong, the model captures a valid mathematical relationship between the number of stops and total time. However, in this specific case of pure error cancellation, they would likely concede that the structure is spurious because the relationship does not hold invariantly across different contexts; there is no preserved structural link between the model's internal logic and the world's actual structure.

  **The Mechanism and Collapse**
  The feature doing all the work is **environment-dependent error cancellation**. The model functions only because the specific ratio of walking distance to stop frequency in the historic district allows the two false assumptions to negate each other. If you move the model to a suburb with large lawns (increasing walking time) or a high-security office park (increasing lock-up time), the ratio shifts. The errors no longer cancel, and the predictions collapse, revealing the model's inability to generalize.

  **Instrumentalist Counter-Attack**
  The instrumentalist would attack the critique as unfair by arguing that changing the city or season violates the model's scope conditions. They would claim the model was never intended to be universal, only useful for the specific context where it was calibrated. To demand it work elsewhere is to change the question; as long as it solves the problem it was designed for, the cancellation of errors is a feature of its efficiency, not a bug in its scientific status.

  **Settled vs. Debated**
  It is **settled** among philosophers of science that models relying on compensating errors are fragile and context-specific, and that the assumptions in this scenario are empirically false. What remains **genuinely debated** is whether predictive success alone is sufficient for a model to be considered scientifically valuable, or whether understanding the true causal mechanism is a necessary condition for scientific knowledge. The instrumentalist values the utility, while the realist values the truth, and there is no consensus on which virtue takes precedence when they diverge.
