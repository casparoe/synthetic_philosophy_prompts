      You have put the knife exactly where it should go, and I will not pretend the tradition has always been clean on this. There is a difference between a contradiction born of error and a contradiction born of complexity. When your laboratories report incompatible values, if one has miscalibrated their instrument, that is not a case for *anekāntavāda* (the doctrine of many-sidedness); that is a case of *mithyātva*, false cognition. The doctrine was never intended to validate error or to suggest that every disagreement is a clash of valid standpoints. It is not a procedure for reconciling lies with truths. So, to your first horn: the schema is not content-insensitive because it is tethered to *vastu*, the real object. If the object does not sustain the predicate in a specific respect, the predication fails. We do not apply the sevenfold scheme to force coherence where there is only mistake.

