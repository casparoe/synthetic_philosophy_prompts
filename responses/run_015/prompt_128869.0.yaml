  # JOINT STATEMENT ON THE MORPHOLOGY OF AGENCY AND OMITTANCE
  **Issued by the Adversarial Collaboration on Causal Source and Institutional Role**

  ## I. Agreed Claims

  The Causal-Source Camp and the Institutional-Role Camp hereby affirm the following six propositions as a common foundation for further inquiry. Both camps endorse these claims despite diverging on their ultimate metaphysical or normative grounding.

  1.  **Grammatical and Conceptual Distinction:** There exists a robust grammatical and conceptual distinction between acts of commission (doing) and acts of omission (allowing). This distinction is stable across ordinary language usage, wherein "killing" typically denotes the initiation of a causal sequence resulting in death, and "letting die" denotes the failure to interrupt a causal sequence resulting in death that originates independently of the agent.
  2.  **Intuitive Asymmetry in Direct Cases:** In standard, direct cases—such as administering a lethal toxin versus failing to supply an antidote when one possesses no special duty to provide it—there is a pre-theoretical intuitive asymmetry. Agents and observers consistently judge the former as morally weightier or distinct in kind from the latter, absent specific contextual modifiers.
  3.  **Legal Codification:** Most mature legal jurisdictions codify this asymmetry, maintaining a substantive distinction between crimes of homicide (active killing) and offenses related to failure to rescue or criminal negligence (letting die). Both camps acknowledge this legal distinction exists as a social fact, regardless of its justification.
  4.  **Instability in Complex Causation:** The clarity of the distinction diminishes or collapses in cases involving indirect causation, causal preemption, or overdetermination. In scenarios where an agent removes a barrier to a threat versus redirecting a threat, the classification of the event as "killing" or "letting die" becomes ambiguous without further stipulation of the baseline conditions.
  5.  **Rejection of Purely Affective Explanations:** Both camps reject the hypothesis that the moral asymmetry between killing and letting die is merely a product of transient psychological bias, emotional aversion, or cognitive heuristic error. Both camps maintain that the distinction tracks a structured reasoning process, whether that structure is grounded in physical causality or normative architecture.
  6.  **Technological Mediation:** The introduction of technological mediators—specifically, automated systems with transparent decision rules that either actively withdraw life support or passively decline to initiate it—does not by itself dissolve the conceptual problem. The question of whether the machine's active withdrawal constitutes "killing" while its non-initiation constitutes "letting die" remains live and structurally identical to the human-agent case.

  ## II. Disagreements Table

  The following table delineates the core points of divergence. The formulations provided in columns two and three are drafted to be acceptable to the respective camps as accurate representations of their positions.

  | Issue / Crux | Causal-Source Camp Formulation | Institutional-Role Camp Formulation |
  | :--- | :--- | :--- |
  | **1. Existence of Non-Normative Causal Difference** | There is a mind-independent, objective asymmetry in causal topology between initiating a lethal sequence and failing to block an independent lethal sequence. This asymmetry exists prior to and independently of any social or moral interpretation. | Causal descriptions are always interest-relative and selected based on normative frameworks. There is no "bare" causal difference that carries moral significance without the prior imposition of a framework defining relevant interventions and defaults. |
  | **2. Absorption of Moral Weight** | Institutional roles and social expectations track the pre-existing moral weight generated by the causal asymmetry. The law distinguishes killing from letting die *because* the causal structures differ in moral import. | Institutional roles and social expectations fully constitute the moral weight assigned to the distinction. Without a normative framework assigning a duty to intervene, the physical difference between action and omission carries no independent moral force. |
  | **3. Engineered Cases (Dual Design)** | In cases where a single agent designs both the lethal pathway and the missing safeguard, the asymmetry survives at the moment of execution. The causal origin of the immediate threat (agent-introduced vs. background) retains moral significance regardless of prior design control. | In cases where a single agent designs the entire system, the distinction between doing and allowing dissolves into a single plan of responsibility. The agent's global control renders the local distinction between intervention and non-intervention morally artificial. |

  ## III. Cruxes and Predictive Tests

  The following three cruxes identify sub-questions where resolving the empirical or intuitive data would significantly shift the burden of proof. For each crux, a shared hypothetical is provided, along with the *ex ante* predicted judgments of both camps.

  ### Crux 1: The Default Protocol in Automated Triage
  **(a) Neutral Formulation:** Does the moral status of a death depend on the software's default setting (active vs. passive) when the outcome is determined by the same algorithmic logic?
  **(b) Shared Hypothetical:** An autonomous medical AI manages life support for two patients with identical prognoses. The AI operates on transparent logic: "If resources < demand, prioritize Patient A."
  *   *Scenario X:* Patient B is on support. The AI actively sends a signal to terminate the flow (Active Withdrawal).
  *   *Scenario Y:* Patient B is not yet on support. The AI declines to send a signal to initiate flow (Passive Non-Initiation).
  *   In both scenarios, the decision rule is identical, the outcome (death of B) is identical, and the resource constraint is identical.
  **(c) Causal-Source Prediction:** Scenario X is a instance of killing; Scenario Y is an instance of letting die. The causal topology differs (interruption of existing flow vs. failure to start new flow), preserving the moral asymmetry despite identical algorithmic logic.
  **(d) Institutional-Role Prediction:** Scenario X and Scenario Y are morally equivalent. The moral status is determined by the legitimacy of the triage protocol (the institutional role of the AI), not by the physical direction of the switch. If the protocol is just, both are permissible; if unjust, both are violations.

  ### Crux 2: The Pre-Existing Threat and Redirective Intervention
  **(a) Neutral Formulation:** Does redirecting a threat onto a new victim constitute "killing" even if the agent had no role in creating the original threat?
  **(b) Shared Hypothetical:** A runaway trolley is on a track where it will kill five people. An agent can pull a lever to switch the trolley to a side track where it will kill one person. The agent did not build the trolley or the tracks.
  **(c) Causal-Source Prediction:** Pulling the lever is an act of killing the one person. The agent introduces a new causal pathway leading to death that would not have existed without the intervention. This is distinct from failing to stop the trolley (letting the five die).
  **(d) Institutional-Role Prediction:** The distinction depends on the assigned duty of the agent. If the agent is a bystander with no official capacity, the distinction may hold. If the agent is a designated controller of the tracks (an institutional role), the distinction collapses; they are responsible for the distribution of harm regardless of the causal switch.

  ### Crux 3: Contractual Waiver and Active Euthanasia
  **(a) Neutral Formulation:** Can a normative agreement (contract/waiver) render an active causal intervention morally equivalent to a passive omission?
  **(b) Shared Hypothetical:** A patient with a terminal condition signs a binding, revocable directive requesting death.
  *   *Scenario A:* A physician administers a lethal injection upon request.
  *   *Scenario B:* A physician disconnects a ventilator upon request.
  **(c) Causal-Source Prediction:** Scenario A remains killing and Scenario B remains letting die, regardless of the waiver. The waiver alters the *justification* (consent) but does not alter the *ontological category* of the act. The causal source in A is the toxin; in B, it is the underlying pathology.
  **(d) Institutional-Role Prediction:** The waiver reconstitutes the physician's role. Within the framework of the agreement, both actions function as "assisted dying." The institutional framework absorbs the causal difference, rendering the moral distinction between injection and disconnection negligible.

  ## IV. Residual Verdict

  Upon review of the agreed claims, the table of disagreements, and the predictive tests, the Collaboration issues the following verdict regarding the nature of the dispute. The disagreement is not purely verbal, though it contains a verbal component. Both camps utilize the terms "killing" and "letting die," but they map these terms onto different underlying structures: the Causal-Source Camp maps them onto topological features of causal chains, while the Institutional-Role Camp maps them onto positions within a normative framework of duties. Consequently, when debating whether a specific case *is* killing, the camps are often talking past one another regarding the definition of the term. However, the disagreement becomes substantive when addressing the *source of moral constraint*. The Causal-Source Camp asserts that moral constraints are discovered via causal analysis, whereas the Institutional-Role Camp asserts that moral constraints are imposed via social agreement. Because this meta-ethical divergence yields different practical prescriptions in the Cruxes identified above (specifically regarding automated systems and engineered contexts), the Collaboration concludes that the remaining disagreement is substantive. It concerns the fundamental architecture of moral reasoning, not merely the labeling of events.
