      *   *Philosophical Implication:* If the friend says Malthus "didn't anticipate technology," that's a historical error. But does it matter? Yes, because it changes the structure of the theory. It's not $Food = f(Tech)$ where $Tech=0$. It's $Population Growth > Food Growth$ regardless of $Tech$. The friend's simplification weakens the steelman of the Malthusian position.

