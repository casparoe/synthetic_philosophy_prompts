answer: |-
  # Diagnostic Taxonomy of Knowing-How: A Procedural Calibration Framework

  **Context:** This taxonomy is designed for graduate-level classification of positions on the intellectualism debate. It operationalizes the concept of **Procedural Calibration**: the thesis that skilled agency involves a continuous, non-representational tuning between agent and environment. The following decision tree sorts positions based on how they locate procedural calibration relative to propositional knowledge.

  **Instructions:** Proceed through the four diagnostic nodes sequentially. Record the answer profile (e.g., 1-Yes, 2-Intact, 3-No, 4-No) to locate the corresponding terminal leaf.

  ---

  ## The Decision Tree

  ### Node 1: The Amnesia Split
  **Case:** A subject retains smooth, expert performance of a task after total explicit amnesia for all rules and instructions.
  **Question:** Does the subject's *procedural calibration* survive the loss of explicit propositional access, such that we still attribute knowing-how?
  *   **Branch 1.1 (Yes):** Calibration persists independently of explicit rules. → *Proceed to Node 2.*
  *   **Branch 1.2 (No):** Calibration is lost or downgraded to mere habit without rules. → *Proceed to Node 3.*

  ### Node 2: The Reconfiguration Split
  **Case:** A skilled agent suffers nerve damage that forces a completely different physical execution of the same task (e.g., playing a string instrument with a reconfigured hand posture).
  **Question:** Does the original *procedural calibration* survive intact, transform, or disappear?
  *   **Branch 2.1 (Survives Intact):** Calibration is tied to task invariants, not specific motor constants. → *Proceed to Node 3.*
  *   **Branch 2.2 (Transforms/Disappears):** Calibration is embodied in specific motor habits that cannot be fully translated. → *Proceed to Node 3.*
  *   **Branch 2.3 (Collapses):** The distinction between "same" and "different" calibration is merely linguistic; only competence matters. → *Proceed to Node 4 (Deflationary Path).*

  ### Node 3: The Acquisition Split
  **Case:** Comparing skill acquisition through explicit rule-internalization versus calibrated trial-and-error in which the agent never articulates intermediate rules.
  **Question:** Is there an ontological epistemic difference between these paths, or do they converge on the same state?
  *   **Branch 3.1 (Difference):** The path determines the epistemic type (e.g., habit vs. knowledge). → *Proceed to Node 4.*
  *   **Branch 3.2 (Convergence):** The path is heuristic only; the resulting epistemic state is identical. → *Proceed to Node 4.*

  ### Node 4: The Failure Split
  **Case:** A single, surprising failure occurs after years of consistent success.
  **Question:** Does this falsify the claim that the agent possesses *procedural calibration* (knowing-how)?
  *   **Branch 4.1 (No):** Calibration is a robust disposition or representational state; single failures are noise.
  *   **Branch 4.2 (Yes):** Calibration is a context-sensitive attribution; failure reveals the fragility of the status.

  ---

  ## Terminal Leaves and Position Mapping

  The sixteen possible answer profiles map onto the following five philosophical positions. Note that multiple profiles may converge on the same leaf if minor variations do not alter the core ontological commitment.

  ### Leaf (A): Pure Intellectualism
  *   **Required Profile:** Node 1 (No) + Node 3 (Convergence) + Node 4 (No).
  *   **Description:** Knowing-how is strictly reducible to knowing-that combined with practical application. If explicit rules are lost, the epistemic status of "knowing" is lost, even if performance remains.
  *   **Status of Procedural Calibration:** **Rejected.** Calibration is fully reducible to the successful application of propositional rules. There is no non-representational tuning; there is only fast computation.

  ### Leaf (B): Ryle-Style Anti-Intellectualism
  *   **Required Profile:** Node 1 (Yes) + Node 2 (Transforms/Disappears) + Node 3 (Difference) + Node 4 (No).
  *   **Description:** Knowing-how is a multi-track disposition or ability. It survives amnesia but is tightly bound to specific embodied habits. The genealogy of the skill (training vs. rules) matters ontologically.
  *   **Status of Procedural Calibration:** **Accepted.** Calibration is irreducible. It is the primary ontological constituent of knowing-how, existing as a direct agent-environment coupling that does not require mediation by beliefs.

  ### Leaf (C): Intermediate Position (Phenomenal/Representational)
  *   **Required Profile:** Node 1 (Yes) + Node 2 (Survives Intact) + Node 3 (Convergence) + Node 4 (No).
  *   **Description:** Knowing-how survives amnesia and is task-invariant (survives reconfiguration), but it retains a factive, representational structure. It possesses a distinctive first-personal or phenomenal mode of presentation that distinguishes it from mere blind disposition.
  *   **Status of Procedural Calibration:** **Modified.** Calibration is irreducible in its *mode of access* (phenomenal/practical) but remains representational in its *content*. It is a unique kind of representation that tunes the agent to the world.

  ### Leaf (D): Deflationary View
  *   **Required Profile:** Node 2 (Collapses) + Node 4 (Yes).
  *   **Description:** The distinction between knowing-how and knowing-that is a linguistic artifact. Both collapse into generic competence. Attributions of knowledge are context-sensitive speech acts rather than descriptions of internal states.
  *   **Status of Procedural Calibration:** **Rejected (as a metaphysical category).** Calibration is a useful metaphor for competence but denotes no distinct epistemic natural kind. The framework of "reducibility" is itself a category error.

  ### Leaf (E): Unoccupied Combination (The Unstable Hybrid)
  *   **Required Profile:** Node 1 (No) + Node 3 (Difference).
  *   **Diagnosis:** **Incoherent/Unstable.**
  *   **Explanation:** This position asserts that knowing-how is reducible to knowing-that (Node 1: No, implying rules are essential), while simultaneously claiming that the *method of acquisition* fundamentally alters the ontological type of the knowledge (Node 3: Difference). If knowledge is purely propositional, the genealogy of the proposition should not alter its epistemic category, only its psychological accessibility. Holding both claims creates a tension between an intellectualist ontology and an anti-intellectualist genealogy that cannot be sustained without collapsing into Leaf (C) or Leaf (A).

  ---

  ## Diagnostic Notes

  ### 1. Inseparable Leaves
  While this taxonomy utilizes four robust splits, **Leaf (A) (Pure Intellectualism)** and **Leaf (C) (Intermediate Position)** may prove difficult to separate in practice if the respondent adopts a "Moderate Intellectualism."
  *   **The Conflict:** A Moderate Intellectualist may answer **Yes** to Node 1 (Amnesia) by positing *implicit* propositions, which mimics Leaf (C)'s profile.
  *   **Resolution:** Separation relies on Node 2 (Reconfiguration). Leaf (A) typically views the physical realization as irrelevant to the knowledge (Survives Intact), whereas Leaf (C) insists on a specific phenomenal mode that might be disrupted by radical reconfiguration. However, if a respondent claims implicit propositions survive reconfiguration *and* carry a phenomenal mode, Leaves (A) and (C) converge. In this seminar context, treat them as a spectrum of Intellectualism rather than distinct taxa if this profile emerges.

  ### 2. The Role of Procedural Calibration
  This taxonomy treats **Procedural Calibration** as the primary variable.
  *   **Leaf (B)** is the only position that fully endorses calibration as a non-representational ontological primitive.
  *   **Leaf (C)** attempts to domesticate calibration within a representational framework.
  *   **Leaves (A) and (D)** eliminate calibration as a distinct explanatory factor, either by reducing it to computation (A) or dissolving the distinction entirely (D).
  *   **Leaf (E)** demonstrates the theoretical cost of misaligning calibration with propositional structure.

  ### 3. Usage in Seminar
  Participants should not be asked to identify their "label" (e.g., "I am a Rylean"). Instead, have them traverse the tree by answering the concrete case judgments. This prevents terminological baggage from obscuring their actual commitments regarding procedural calibration.
