answer: |-
  In the discipline of history, the distinction between revisionism and denialism is not merely a matter of conclusion, but of methodology. While both involve re-examining the past, they operate on fundamentally opposing epistemological frameworks. Historical revisionism is the legitimate engine of the profession, driven by new evidence or fresh perspectives. Denialism is an ideological project that seeks to distort or erase established historical reality.

  The difficult case you raise—where a writer admits mass killings occurred but denies they were intentional, systematic, or genocidal—occupies a contentious space. In contemporary historiography, this is often categorized as **"soft denialism"** or **"trivialization."** Whether such an argument constitutes legitimate revisionism or denialism depends entirely on the methodological markers employed by the writer.

  ### Core Conceptual Distinctions

  **Historical Revisionism**
  Legitimate revisionism proceeds from the archive outward. It acknowledges the established consensus as a baseline and seeks to modify, nuance, or overturn it based on the discovery of new primary sources, the application of new analytical methods, or the correction of previous errors. A revisionist accepts the burden of proof and subjects their conclusions to the possibility of falsification. For example, the debate among Holocaust historians between "intentionalists" (who argued Hitler planned the Holocaust from the start) and "functionalists" (who argued it evolved through bureaucratic radicalization) was a vigorous, legitimate revisionist debate. Both sides agreed on the occurrence and scale of the genocide; they disagreed on the specific chronology of decision-making.

  **Historical Denialism**
  Denialism proceeds from a conclusion inward. It begins with an ideological imperative (e.g., protecting national honor, exonerating a regime, or attacking a specific group) and selects evidence solely to support that pre-determined conclusion. Denialism is characterized by a refusal to accept the burden of proof and an immunity to counter-evidence. When confronted with contradictory documentation, the denialist does not adjust the hypothesis; they question the authenticity of the document or the motive of the historian.

  ### The Edge Case: Denying Intent and Characterization

  The scenario in which a writer admits deaths occurred but denies the label of "genocide" or the presence of "intent" is the most common form of modern denialism. This shifts the goalposts from ontological denial (it did not happen) to normative or categorical denial (it was not *that* kind of happening).

  This belongs to the category of **denialism** when the re-characterization is used to minimize moral responsibility or legal culpability in contradiction to the weight of evidence. For example, arguing that the deaths of Armenians in 1915 were merely the "unintended byproduct of wartime relocation" rather than a state-sponsored extermination campaign requires ignoring direct orders, telegrams, and survivor testimonies that indicate intent.

  However, this can belong to **revisionism** if the argument is a good-faith engagement with legal or semantic definitions. The term "genocide" was coined in 1944, and applying it retroactively involves complex legal and philosophical questions. A historian might argue that while atrocities occurred, they fit the legal definition of "crimes against humanity" rather than "genocide" due to specific evidentiary gaps regarding the *dolus specialis* (specific intent to destroy a group). If this argument is open to counter-evidence and engages with the full archive, it is revisionist. If it selectively ignores evidence of intent to achieve political exoneration, it is denialist.

  ### Case Studies in Historiography

  **The Holocaust**
  *   **Denialism:** Hard denialism claims the gas chambers did not exist or the death toll is a fabrication. Soft denialism argues that the Holocaust was a legitimate anti-partisan war effort or that the deaths were caused by disease and famine rather than systematic murder.
  *   **Revisionism:** Legitimate revisionism has refined our understanding of the death toll (e.g., revising the number of victims at Auschwitz downward from 4 million to roughly 1.1 million based on archival research) without challenging the reality of the extermination program.
  *   **The Edge Case:** When writers argue that the Holocaust was not "unique" or that Jewish resistance was negligible, they often tread the line. If used to diminish German culpability, it is denialist trivialization. If used to compare structures of violence across regimes, it is comparative genocide studies.

  **The Armenian Genocide**
  *   **Denialism:** For most of the 20th century, the Republic of Turkey maintained a state policy of denial, arguing that the deaths of 1915–1917 were a result of civil war, famine, and mutual suffering, denying any central Ottoman intent to destroy the Armenian people.
  *   **Revisionism:** Scholars have revised the understanding of *how* the genocide was implemented, debating the role of local actors versus central committee orders.
  *   **The Edge Case:** The argument that these events were "inter-communal violence" rather than genocide is the primary vehicle of denialism. Despite a consensus among genocide scholars that the evidence meets the criteria for genocide, the "civil war" narrative persists as a method of denying the specific legal and moral characterization of the event.

  **The Nanjing Massacre**
  *   **Denialism:** Japanese nationalist historiography has often sought to minimize the death toll (arguing for tens of thousands rather than hundreds of thousands) or deny the systematic nature of the rapes and executions, framing them as isolated incidents of war.
  *   **Revisionism:** Western and Chinese scholars have debated the precise numbers and the chain of command responsibility (whether Emperor Hirohito or local commanders were directly liable).
  *   **The Edge Case:** Arguments that the killings were "military necessities" or that the death toll is exaggerated due to Chinese propaganda often function as denialism when they dismiss forensic evidence and diary entries from Japanese soldiers themselves.

  ### Methodological Markers

  To distinguish between legitimate revisionism and denialism (including the "soft" variety regarding intent), one must examine the methodology rather than just the conclusion.

  **1. Engagement with the Archive**
  *   **Revisionism:** Seeks to incorporate all available evidence, including evidence that complicates the thesis. It acknowledges the provenance and context of documents.
  *   **Denialism:** Cherry-picks data. It isolates anomalies (e.g., a single document showing concern for prisoner welfare) to negate the weight of the broader archive (e.g., thousands of documents ordering executions). In the case of intent, denialists often demand a "smoking gun" signed by the leader, ignoring that intent in genocide is often inferred from patterns of action.

  **2. Falsifiability**
  *   **Revisionism:** Offers claims that can be proven false. A revisionist might say, "If a direct order from Hitler dated 1941 is found, my functionalist theory is wrong."
  *   **Denialism:** Constructs arguments that are unfalsifiable. If evidence of intent is produced, the denialist claims it is a forgery, a mistranslation, or taken out of context. The conclusion remains immune to evidence.

  **3. Responsiveness to Evidence**
  *   **Revisionism:** Responds to peer critique by refining arguments or conceding points. It operates within the community of scholars.
  *   **Denialism:** Responds to critique by attacking the credibility of the critics (ad hominem), alleging conspiracies, or claiming political bias. It operates outside the community of scholars.

  **4. Consensus-Seeking**
  *   **Revisionism:** Views consensus as a provisional snapshot of current knowledge, subject to change but worthy of engagement. It explains why the consensus is wrong using shared standards of proof.
  *   **Denialism:** Views consensus as evidence of a conspiracy. The existence of agreement among experts is framed as groupthink or political coercion rather than the result of shared evidentiary standards.

  **5. Allocation of the Burden of Proof**
  *   **Revisionism:** Accepts the burden of proof. The person making the new claim must provide the evidence.
  *   **Denialism:** Shifts the burden of proof. The denialist demands that the historian prove a negative (e.g., "Prove that there was *no* other reason for these deaths besides genocide") or demands an impossible standard of evidence for the established narrative while accepting low standards for their own.

  ### Occurrence vs. Moral and Legal Characterization

  Distinguishing between denying an event occurred and denying its characterization is vital, yet the two are often inextricably linked.

  **Denying Occurrence:** This is ontological denial. It claims the event is a fabrication. This is the easiest form of denialism to identify and refute.

  **Denying Characterization:** This is normative denial. It admits bodies piled up but denies the *meaning* of the pile. By arguing that deaths were "unintended byproducts of war" rather than "genocide," the writer alters the moral and legal landscape. Genocide carries specific legal liabilities and moral stigmas; "collateral damage" does not. Therefore, denying the characterization is often a proxy for denying the culpability associated with the event.

  In the cases of the Holocaust, the Armenian Genocide, and the Nanjing Massacre, the argument that killings were "unintended" is rarely a neutral semantic debate. It is almost invariably an attempt to sever the link between the state/perpetrators and the moral crime of extermination. When this argument relies on ignoring evidence of systematic planning, dehumanizing rhetoric, and targeted logistics, it crosses from revisionism into denialism.

  ### Conclusion

  The writer who admits mass killings but denies intent or the label of genocide occupies the gray zone of **soft denialism**. This position belongs to the category of denialism when it utilizes the methodological markers of denial: shifting the burden of proof, immunizing claims from falsification, and cherry-picking the archive to support an exonerating conclusion. It belongs to the category of revisionism only if it engages in good-faith debate regarding the application of legal definitions, remains open to counter-evidence, and does not seek to minimize the scale or horror of the suffering.

  Ultimately, history is not just about counting the dead; it is about understanding how and why they died. To systematically obscure the intent behind mass death is to distort the historical record as profoundly as denying the death toll itself. Legitimate revisionism clarifies the past; denialism, even in its softer forms, obscures it to serve the present.
