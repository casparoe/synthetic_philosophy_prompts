      *   *Denialism:* An ideologically motivated attempt to distort or erase historical reality. It operates *outside* the rules of historical inquiry, often starting with a conclusion and working backward.
      *   *The Edge Case (Soft Denialism/Minimization):* Admitting deaths but denying the *nature* (intent/genocide). This is often called "trivialization," "minimization," or "soft denialism."

  3.  **Address the Specific Edge Case:**
