prompt: |-
  Please explain the conceptual difference between historical revisionism and denialism, with reference to the historiography of the Holocaust, the Armenian genocide, and the Nanjing Massacre. I am especially interested in the difficult case in which a writer does not deny that mass killings occurred, but denies that they were intentional, systematic, or properly describable as genocide — arguing instead, for example, that the deaths were the unintended byproduct of war, famine, or civil conflict. Does this belong to revisionism, denialism, or a third category? In your answer, distinguish denying that an event occurred from denying its moral or legal characterization, and explain what methodological markers — engagement with the archive, falsifiability, responsiveness to evidence, consensus-seeking, and the allocation of the burden of proof — separate legitimate revision from denial. Please write your answer in American English.
