prompt: |-
  In my philosophy of politics reading group, two members have been deadlocked over the democratic boundary problem, and I am reporting their exchange as a bystander without taking sides. I want a point-by-point adjudication of the arguments as they actually unfolded, plus a diagnosis of where they are talking past each other and what both are missing.

  One member, Mara, began by defending an all-affected-interests principle: anyone whose important interests are significantly shaped by a collective decision should have democratic standing with respect to it. The other, Leo, objected that this renders the demos unworkably expansive—if a nation sets a carbon tax that influences global climate patterns, does every affected person on Earth acquire a vote? Mara conceded that binary affectedness fails here, but proposed replacing it with a graded criterion she called sustained structural exposure: you belong to the demos for a given decision domain only if you live within the institutional reach of its implementation over time, not merely if you suffer diffuse ripple effects. Leo granted that this blocks over-inclusion, but charged that it smuggles in the very boundary it claims to justify—“institutional reach” is delimited by jurisdictional borders, and those borders presuppose a prior demos that authorized them, so the criterion is circular. Mara replied that jurisdictional reach can be defined functionally—say, by the enforcement capacity of a watershed authority or a labor-regulatory body—without requiring prior democratic authorization of the border itself, so no vicious circularity arises. Leo then pivoted to an all-subjected principle: democratic membership should track coercive legal subjection, which yields determinate boundaries (those bound by enforceable law) and avoids arbitrary grading altogether. Mara countered that this excludes precisely the groups most in need of democratic protection—future generations, undocumented residents subject to severe informal coercion, and cross-border communities affected by upstream extraction—while including transient visitors who happen to be present when a law is enforced. Leo responded that these are manageable supplements: you retain the core subjection principle for membership and add stakeholder mechanisms for affected non-members, without dissolving democratic accountability into cosmopolitan vagueness. At this point the argument stalled. Mara accused Leo of treating democracy as a membership club for the legally included rather than as a check on power over lives; Leo accused Mara of dissolving decision procedures into an unbounded affectedness that makes collective choice impossible. They seem partly right, but I cannot tell where the clash is substantive versus terminological.

  Please adjudicate specifically: Is Mara’s sustained structural exposure criterion genuinely non-circular, or does Leo’s circularity charge hold once we distinguish functional enforcement reach from democratically authorized borders? Is Leo correct that Mara’s view risks dissolving accountability, and is Mara correct that Leo’s view arbitrarily excludes vulnerable non-subjected groups? What distinction—perhaps between constitutive and regulative boundaries, or between domain-specific and domain-transcendent membership—might repair the disagreement? Give a verdict on which precise claims stand, which collapse, and what each party is failing to see that would allow them to concede ground without abandoning their core concern.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy of politics reading group.
      *   **Participants:** Mara (All-Affected Interests, modified to Sustained Structural Exposure) vs. Leo (All-Subjected Principle).
      *   **Task:** Point-by-point adjudication of arguments, diagnosis of talking past each other, identification of missing elements, and a verdict on specific claims.
      *   **Constraint:** Act as a bystander/reporter without taking sides (neutral adjudicator), but provide a rigorous philosophical analysis.
      *   **Key Issues:** Circularity of "institutional reach," risk of dissolving accountability vs. arbitrary exclusion, distinction between types of boundaries/membership.

  2.  **Deconstruct the Arguments:**

      *   **Mara's Position:**
          *   *Initial:* All-Affected Interests Principle (AAIP).
          *   *Problem:* Over-inclusiveness (global climate example).
          *   *Revision:* Sustained Structural Exposure (SSE). Membership based on living within the "institutional reach" of implementation over time.
          *   *Defense against Circularity:* "Institutional reach" is functional (enforcement capacity, e.g., watershed authority), not necessarily pre-authorized democratic borders.
          *   *Critique of Leo:* Excludes vulnerable non-subjected groups (future gens, undocumented, cross-border). Treats democracy as a club rather than a check on power.

      *   **Leo's Position:**
          *   *Initial Objection:* AAIP is unworkably expansive.
          *   *Critique of Mara's Revision:* SSE is circular. "Institutional reach" presupposes jurisdictional borders, which presuppose a prior demos.
          *   *Alternative:* All-Subjected Principle (ASP). Membership tracks coercive legal subjection.
          *   *Defense:* Determinate boundaries, avoids arbitrary grading.
          *   *Response to Exclusions:* Add stakeholder mechanisms for non-members (supplements) without dissolving core membership.
          *   *Critique of Mara:* Dissolves decision procedures into unbounded affectedness, making collective choice impossible.

  3.  **Adjudication - Point-by-Point:**

      *   **Issue 1: Circularity of SSE (Mara) vs. Leo's Charge.**
          *   *Leo's Charge:* You need a demos to set borders; using borders to define demos is circular.
          *   *Mara's Defense:* Functional reach (e.g., a river authority) exists independently of democratic authorization.
          *   *Analysis:* Leo is partially right about *political* borders, but Mara is right about *functional* jurisdictions. However, who defines the "functional reach"? If a state agency defines it, it's state-centric (circular). If an objective metric defines it (e.g., pollution radius), it's non-circular but might not align with political agency.
          *   *Verdict:* Leo's charge holds for *state-centric* definitions of reach but fails against *functional/ecological* definitions. However, Mara hasn't explained how functional reach translates to *political* standing without a prior authority.

      *   **Issue 2: Accountability vs. Exclusion.**
          *   *Mara's Charge:* ASP excludes vulnerable people (undocumented, future gens).
          *   *Leo's Defense:* Use supplements (stakeholder mechanisms).
          *   *Analysis:* Mara is right that ASP *strictly* excludes them. Leo is right that supplements can mitigate harm. But do supplements equal *democratic standing*? No. Mara wants *power*, Leo offers *consideration*.
          *   *Leo's Charge:* AAIP/SSE makes collective choice impossible (infinite regress/indeterminacy).
          *   *Mara's Defense:* SSE limits it to "structural exposure."
          *   *Analysis:* Leo is right that AAIP is risky. SSE is better but still fuzzier than ASP.
          *   *Verdict:* Mara is right about the moral deficit of ASP (exclusion). Leo is right about the procedural risk of AAIP/SSE (indeterminacy). Leo's "supplements" are a patch, not a solution to the *status* problem.

      *   **Issue 3: Talking Past Each Other (Diagnosis).**
          *   They are defining "Demos" differently.
          *   Mara: Demos = Those who *need* protection from power (Normative/Protective).
          *   Leo: Demos = Those who *constitute* the decision-making body (Procedural/Constitutive).
          *   They are also conflating *boundary setting* (who decides the borders) with *boundary justification* (why these borders).
          *   Missing Distinction: *Constitutive* boundaries (who makes the rules) vs. *Regulative* boundaries (who is protected by the rules). Or *Membership* vs. *Standing*.

  4.  **Synthesizing the Solution/Repair:**
      *   Need a distinction between *Authorship* (Leo's focus) and *Impact/Protection* (Mara's focus).
      *   Need to acknowledge that "The Demos" isn't a single static thing. It might be layered (local, national, functional).
      *   The "Circularity" problem is the "Boundary Problem" itself (Whelan 1983). It's logically unavoidable to some degree. The question is which circle is *virtuous* vs. *vicious*.
      *   Leo's "supplements" admit that ASP is insufficient on its own, undermining his claim that it's the *sole* principle.
      *   Mara's "functional reach" admits that AAIP needs constraints, undermining her claim that affectedness is the *sole* principle.

  5.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the classic nature of the debate (Whelan, Goodin, Arrhenius). Set the tone as neutral adjudication.
      *   *Section 1: The Circularity Charge (SSE).* Analyze the functional vs. political border distinction. Verdict: Leo wins on political borders, Mara wins on functional domains, but Mara hasn't solved the *authority* problem.
      *   *Section 2: Exclusion vs. Indeterminacy.* Analyze the vulnerable groups vs. decision capacity. Verdict: Both are right about the risks. Leo's "supplements" concede Mara's point implicitly.
      *   *Section 3: Diagnosis of Disagreement.* Identify the category error (Constitutive vs. Normative). Identify the missing distinction (Domain-specific membership).
      *   *Section 4: Verdict & Path Forward.* Specific claims that stand/collapse. Proposal for synthesis (e.g., nested demoi or distinction between voters and stakeholders).

  6.  **Refining the Philosophical Nuance:**
      *   *Circularity:* Be careful. The "Boundary Problem" is famously difficult. Whelan argues it's insoluble democratically. Leo is channeling Whelan. Mara is channeling Goodin/Arrhenius.
      *   *Functional Reach:* If a watershed authority exists, who created it? If a state created it, Leo is right (circular). If it's natural, Mara is right (non-circular), but does nature grant voting rights?
      *   *Undocumented/Coercion:* Are undocumented people "subjected"? Leo says "legal subjection." Mara says "informal coercion." This is a definitional clash. If "law" applies to them (deportation, policing), they *are* subjected. Leo might be wrong on the facts here if he excludes them.
      *   *Future Generations:* ASP definitely fails here. Leo admits this needs supplements. This is a major concession.

  7.  **Final Polish:** Check tone. Ensure I'm not taking sides but evaluating the *logic* of the sides. Ensure all parts of the prompt are answered (adjudication, diagnosis, missing distinctions, verdict).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "they are both right." I need to say *where* their specific logical claims hold or fail.
      *   *Mara's Circularity Defense:* It holds *only if* "institutional reach" is pre-political (ecological/functional). If it's state-defined, it fails.
      *   *Leo's Exclusion Defense:* It fails on future generations (cannot supplement non-existent beings easily). It holds on transient visitors (they shouldn't vote).
      *   *The "Talking Past" element:* They are arguing about *legitimacy* (Mara) vs. *feasibility* (Leo).

  8.  **Final Structure:**
      1.  Executive Summary.
      2.  Adjudication of Specific Claims (Circularity, Accountability/Exclusion).
      3.  Diagnosis of the Impasse (Category Errors).
      4.  The Missing Distinction (Constitutive vs. Normative / Domain-Specific).
      5.  Final Verdict (What stands, what collapses, the synthesis).

  9.  (Proceed to generate output based on this structure.)
answer: |-
  ### Adjudication Report: The Democratic Boundary Dispute

  **Subject:** Mara (All-Affected/Sustained Structural Exposure) vs. Leo (All-Subjected Principle)
  **Role:** Neutral Adjudicator
  **Context:** Philosophy of Politics Reading Group

  The following is an adjudication of the exchange between Mara and Leo regarding the democratic boundary problem. This dispute recapitulates a classic tension in democratic theory between the *all-affected interests principle* (AAIP) and the *all-subjected principle* (ASP). The analysis below evaluates the logical validity of their specific claims, diagnoses the conceptual misalignment causing the deadlock, and proposes a distinction that could resolve the impasse.

  ---

  ### I. Point-by-Point Adjudication of Arguments

  #### 1. The Circularity Charge: SSE vs. Institutional Reach
  *   **Leo's Claim:** Mara's "Sustained Structural Exposure" (SSE) is circular because "institutional reach" presupposes jurisdictional borders, which presuppose a prior demos.
  *   **Mara's Counter:** Jurisdictional reach can be defined functionally (e.g., enforcement capacity of a watershed authority) without prior democratic authorization.
  *   **Adjudication:** **Split Verdict.**
      *   **Leo is correct** that if "institutional reach" is defined by *state* borders (e.g., "within the US"), the argument is viciously circular. You cannot use the state's border to define the demos that legitimizes the state.
      *   **Mara is correct** that if "institutional reach" is defined by *functional* or *ecological* parameters (e.g., "within the flood zone of this dam"), it is not logically circular. However, she faces a different problem: **authority.** A functional boundary (like a watershed) does not automatically generate a political agent capable of voting.
      *   **Ruling:** Leo's circularity charge holds against *state-centric* definitions of SSE but fails against *functional* definitions. However, Mara has not explained how a functional boundary translates into *democratic standing* without a prior political authority to recognize it. She solves the circularity but creates a vacuum of agency.

  #### 2. The Exclusion Charge: Vulnerable Groups vs. Determinacy
  *   **Mara's Claim:** Leo's All-Subjected Principle (ASP) excludes vulnerable non-subjected groups (future generations, undocumented residents, cross-border communities).
  *   **Leo's Counter:** These are manageable via "stakeholder mechanisms" (supplements) without granting full membership.
  *   **Adjudication:** **Mara Prevails on Principle; Leo Prevails on Procedure.**
      *   **Mara is correct** that ASP creates a moral deficit. Undocumented residents are often subject to coercive state power (deportation, policing) even if lacking legal status. If "subjection" means "bound by enforceable law," Leo is factually wrong to exclude them. If he excludes them, he admits ASP is under-inclusive. Future generations cannot be "subjected" in the present, so ASP strictly fails here.
      *   **Leo is correct** that granting full voting membership to everyone affected (or structurally exposed) risks **decisional paralysis.** If the "demos" for a carbon tax includes the entire globe, the cost of coordination may exceed the benefit of the decision.
      *   **Ruling:** Leo's "supplement" strategy implicitly concedes Mara's point: if ASP were sufficient, supplements wouldn't be needed. By admitting supplements are necessary, Leo acknowledges that *subjection* is not the sole criterion for democratic justice. However, Mara underestimates the administrative impossibility of her view if "structural exposure" is too broadly interpreted.

  #### 3. The Accountability Charge: Club vs. Check on Power
  *   **Leo's Claim:** Mara dissolves decision procedures into unbounded affectedness, making collective choice impossible.
  *   **Mara's Claim:** Leo treats democracy as a membership club rather than a check on power over lives.
  *   **Adjudication:** **Substantive Clash (No Clear Winner).**
      *   This is not a logical error but a conflict of **democratic values.** Leo prioritizes *agency* (the capacity of a group to act collectively). Mara prioritizes *legitimacy* (the justification of power over individuals).
      *   Leo is right that a demos must be a *decision-making unit*, which requires boundaries.
      *   Mara is right that a demos must be a *justification unit*, which requires including those impacted.
      *   **Ruling:** Both claims stand. Democracy requires both the capacity to choose (Leo) and the justification of that choice (Mara). Prioritizing one to the exclusion of the other renders democracy either impotent (Mara's risk) or tyrannical (Leo's risk).

  ---

  ### II. Diagnosis: Where They Are Talking Past Each Other

  The deadlock arises because Mara and Leo are using the word "Demos" to refer to two different conceptual objects.

  1.  **The Constitutive Demos (Leo):** Leo views the demos as the *author* of the law. For a law to exist, there must be a defined body that enacts it. His concern is **ontological**: How does the collective agent come into existence to make a decision?
  2.  **The Normative Demos (Mara):** Mara views the demos as the *subject* of justification. Her concern is **ethical**: Who is owed an explanation and a voice regarding the exercise of power?

  **The Category Error:**
  Leo is arguing about the **conditions of possibility** for voting (you need a closed list to count ballots). Mara is arguing about the **conditions of legitimacy** for ruling (you need inclusion to justify coercion).
  *   When Leo says, "Your view makes collective choice impossible," he is speaking about *procedure*.
  *   When Mara says, "Your view excludes vulnerable groups," she is speaking about *justice*.

  They are talking past each other because Leo is offering a **procedural solution** to a **normative problem**, and Mara is offering a **normative solution** to a **procedural problem**.

  **What Both Are Missing:**
  Both assume there is a *single* boundary for *all* decisions. They treat the demos as monolithic (one people, one border). They are missing the concept of **functional demoi** or **nested membership**. A person might be a "member" for labor regulations (local), environmental regulations (regional/watershed), and foreign policy (national) simultaneously.

  ---

  ### III. The Repair: Distinguishing Boundary Types

  To resolve the disagreement, the group must adopt a distinction between **Constitutive Boundaries** and **Regulative Boundaries**, or alternatively, **Membership** vs. **Standing**.

  **1. Constitutive Boundaries (Leo's Domain):**
  These define the *voting body* for specific administrative decisions to ensure efficiency and agency. Leo is right that these must be determinate. You cannot have a vote with infinite participants.
  *   *Concession Mara should make:* Not everyone "affected" can be a *voter* in every decision. Administrative feasibility requires a bounded electorate.

  **2. Regulative Boundaries (Mara's Domain):**
  These define the *scope of justification* and protection. Even if one cannot vote, one may be owed representation, legal protection, or stakeholder consultation.
  *   *Concession Leo should make:* "Stakeholder mechanisms" are not merely optional supplements; they are required by democratic legitimacy. If a group is structurally exposed, they possess *standing* even if they lack *membership*.

  **3. Domain-Specific Membership:**
  The solution lies in decoupling "citizenship" from "standing."
  *   **Leo's ASP** works well for defining the *citizenry* (those who maintain the state over time).
  *   **Mara's SSE** works well for defining *consultative constituencies* (those who must be heard before a specific decision is finalized).

  ---

  ### IV. Final Verdict

  **Claims That Stand:**
  *   **Leo:** The All-Affected Principle (in its binary form) is unworkable for decision-making procedures. A bounded decision-making body is logically necessary for collective action.
  *   **Mara:** The All-Subjected Principle is morally under-inclusive. It fails to account for externalities, future generations, and those subject to informal coercion. "Subjection" is often a matter of degree, not a binary legal status.
  *   **Mara:** Functional boundaries (watersheds, labor markets) are not necessarily circular if defined by empirical metrics rather than political fiat.

  **Claims That Collapse:**
  *   **Leo:** The claim that "stakeholder mechanisms" fully resolve the exclusion problem. If non-members have no veto or vote, their "standing" is merely advisory, which fails Mara's test of checking power.
  *   **Mara:** The claim that "Sustained Structural Exposure" alone can define a voting demos without a prior political authority to recognize that exposure. Functional reach does not automatically create political agency.
  *   **Leo:** The claim that undocumented residents are not "subjected." If they are policed and deportable, they are subject to coercion. Leo's exclusion of them is empirically false under his own definition.

  **Path to Concession:**
  *   **Leo must concede** that the "boundary of the demos" is not a one-time event but a continuous process of justification. He must accept that for specific *domains* (like climate or trade), the demos must expand beyond legal citizens to include those with "sustained structural exposure."
  *   **Mara must concede** that "democratic standing" does not always mean "one person, one vote" in a single referendum. She must accept a tiered system where some groups have voting rights (constitutive members) and others have guaranteed representation or veto rights over specific issues (regulative stakeholders).

  **Conclusion:**
  The deadlock is not substantive but structural. They are arguing over which layer of a multi-layered problem is the *only* layer. The verdict is that **Leo is right about the unit of decision, but Mara is right about the unit of justification.** A viable theory of democratic boundaries must treat the demos not as a fixed circle, but as a series of overlapping jurisdictions where membership is determined by the specific type of power being exercised. Leo provides the container; Mara provides the content. Neither functions without the other.
