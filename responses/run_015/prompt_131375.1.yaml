answer: |-
  ### Grad Seminar: Social Epistemology — Final Exam

  **Time:** 90 Minutes
  **Word Limit:** ~1000 words
  **Total Marks:** 25

  **Question 1: The Notation Problem**

  Consider the following case: Mathematicians A and B are established epistemic peers in number theory. They have identical track records for correctness and creativity. They are collaborating on a preprint when they hit a disagreement over Lemma L. A asserts L is true; B asserts L is false.

  When pressed, A claims B is misreading a notational convention that was standardized in 2022. B counters that A is overfitting to an old heuristic and ignoring the new context. Crucially, while they agree they are peers on *math ability*, they disagree on whether they are peers regarding *knowledge of this specific notation*. A thinks B is ignorant of the 2022 standard; B thinks the standard is irrelevant here.

  Enter C, a third mathematician who is also a peer to both A and B in general ability. C has not looked at the proof for L but knows A and B have identical track records. C learns of the disagreement and the conflicting explanations (notation vs. heuristic).

  Write an essay addressing the following:
  1.  Does the Conciliationist view require A or B to revise their belief about L, given they disagree about *why* they disagree?
  2.  Can A or B maintain a Steadfast position without begging the question (circularity)?
  3.  What is C's epistemic obligation?
  4.  Ultimately, does disagreement about the *source* of the disagreement undermine the Conciliationist mandate?

  *(Note: Please manage your time wisely, theres a lot to cover here.)*

  ***

  ### Model Answer

  The case of A, B, and C exposes a fissure in the standard Peer Disagreement literature regarding the conditions of peerhood and the weight of higher-order evidence. To answer whether conciliationism holds, we must first dissect what "peer" means in this context. Standard conciliationism, like the Equal Weight View, suggests that upon discovering a peer disagrees, you should split the difference or suspend judgment. However, this presupposes you recognize the other as a peer *regarding the specific proposition in question*.

  A and B agree they are peers on general math ability but disagree on their relative familiarity with the 2022 notation. This is a disagreement about the *conditions* of peerhood itself. For A, the disagreement is first-order (about L) but explained by a second-order asymmetry (B lacks notation knowledge). If A is right, B isn't a peer on this specific issue, so conciliationism doesn't trigger. The problem is A cannot assume she is right without circularity. If A uses her understanding of the notation to prove B is ignorant of the notation, she is using the contested first-order evidence to dismiss the higher-order evidence of B's disagreement. This is the "bootstrapping" problem.

  Therefore, for A to remain steadfast without circularity, she needs independent access to the fact that B is ignorant of the notation. She doesn't have this; she only has her own interpretation of the proof. Consequently, a pure steadfastness view looks indefensible here unless A can point to external evidence of B's ignorance (e.g., B missed the 2022 conference). Without that, A must treat B as a peer *until proven otherwise*. This means conciliationism still exerts pressure. A should lower her confidence in L, not necessarily because B is right, but because A cannot rule out that *she* is the one misapplying the convention. The disagreement about the source (notation vs. heuristic) functions as higher-order evidence that their reliability is in question.

  However, does this undermine the conciliationist mandate? Not necessarily. It complicates it. Conciliationism requires weighing the peer's opinion equally. If the peerhood status is contested, the rational move is to suspend judgment on the peerhood status itself, which cascades into suspending judgment on L. The disagreement about the source doesn't cancel the need for revision; it reinforces the need for humility. If they can't agree on why they disagree, their combined reliability drops below the threshold required for steadfastness.

  Now consider C. C knows A and B are general peers but hasn't seen the proof. C faces a "double disagreement." C disagrees with A (who says L is true) and B (who says L is false). But C also sees A and B disagreeing about the *cause*. For C, the situation is clearer than for A or B. C has no first-order evidence about L, only the testimony of two reliable agents who cancel each other out. Standard conciliationism dictates C should suspend judgment on L.

  But what about the explanation? C knows both have identical track records. If A claims B is ignorant of notation, and B claims A is stuck on heuristics, C has no reason to prefer one explanation over the other. C should also suspend judgment on the *source* of the error. Some might argue C should defer to the consensus of the field, but ex hypothesi, this is a new preprint. C's obligation is to withhold belief in L until the notation dispute is resolved by independent verification. C cannot simply say "A is probably right about the notation" because that would require C to evaluate the notation, which C hasn't done.

  Does the disagreement about the source undermine conciliationism? Only if conciliationism requires a clear metric of peerhood to function. If peerhood is all-things-considered, A and B are peers. If it is proposition-specific, they might not be. But since they can't agree on the proposition-specific factors without begging the question, they must default to the all-things-considered status. Thus, the conciliationist mandate stands: you cannot use the disagreement itself to prove you are the better judge. To do so is epistemically arrogant.

  In conclusion, A and B should revise their beliefs (likely toward suspension) because they lack independent access to the source of error. Steadfastness is circular without external proof of the peer's deficiency. C must also suspend judgment, treating the conflicting explanations as noise. The disagreement about the source does not undermine conciliationism; rather, it highlights that conciliationism is most necessary precisely when agents cannot agree on why they diverge. The mandate survives because the alternative—trusting your own assessment of the disagreement's cause—is question-begging.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. The Peerhood Condition (5 Marks)**
  *   **Conceptual Move:** Must distinguish between *general* peerhood (track record) and *proposition-specific* peerhood (knowledge of notation). Must argue that A/B cannot assume proposition-specific superiority without independent evidence.
  *   **Marks:** 5 for clear distinction; 3 for mentioning it but conflating the two; 0 for ignoring it.
  *   **Typical Mistake:** Assuming A and B are automatically peers on Lemma L just because they are peers in number theory generally.

  **2. Conciliationism & Belief Revision (5 Marks)**
  *   **Conceptual Move:** Must argue that conciliationism still requires revision (or suspension) because the disagreement about the *source* prevents either from claiming independent access to the error.
  *   **Marks:** 5 for linking source-disagreement to revision mandate; 3 for saying revision is needed but missing the "source" link; 0 for saying no revision needed.
  *   **Typical Mistake:** Claiming conciliationism is voided because they disagree on the cause, treating that as a "defeater" for peer status.

  **3. Steadfastness & Circularity (5 Marks)**
  *   **Conceptual Move:** Must identify that steadfastness here is circular (bootstrapping) if A uses her view of L to prove B is ignorant of the notation. Needs to mention the need for *independent* access.
  *   **Marks:** 5 for identifying circularity/bootstrapping; 3 for mentioning circularity vaguely; 0 for defending steadfastness without addressing circularity.
  *   **Typical Mistake:** Arguing A can be steadfast because she "sees the proof clearly," ignoring that B claims the same.

  **4. C's Epistemic Obligation (5 Marks)**
  *   **Conceptual Move:** Must conclude C should suspend judgment on both L and the explanation (notation vs. heuristic) due to lack of first-order evidence and symmetric testimony.
  *   **Marks:** 5 for suspending on both L and explanation; 3 for suspending on L only; 0 for taking sides.
  *   **Typical Mistake:** Suggesting C should investigate the notation themselves (misses the point of C's limited evidence role).

  **5. The Meta-Question (Undermining Conciliationism) (5 Marks)**
  *   **Conceptual Move:** Must conclude that disagreement about the source does *not* undermine conciliationism, but rather reinforces the need for suspension to avoid arrogance/question-begging.
  *   **Marks:** 5 for robust defense of conciliationism's survival; 3 for ambiguous conclusion; 0 for claiming conciliationism is defeated.
  *   **Typical Mistake:** Concluding that because peerhood is contested, the whole framework collapses (too skeptical).
