      *   **Task:** Reconstruct the *implicit theory* presupposed by current practices (not argue for what *should* be done). Use the TA's lens (rules substitute stand-ins for consciousness).
      *   **Specific Questions to Address:**
          1.  What does the "independent feeding" line (Day 5 zebrafish) presuppose about consciousness (threshold vs. gradual, administrative convenience)?
