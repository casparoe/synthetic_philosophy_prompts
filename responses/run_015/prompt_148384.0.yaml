  Based on your friend's track record, here is an analysis of how she would likely judge your library system, the principles underlying her judgments, and the limits of what her history reveals.

  ### 1. The Prediction and Closest Analog
  Your friend would almost certainly predict that the **color-coding system will persist (Lock-in)**.

  The closest analog in her history is the **QWERTY keyboard**.
  *   **Why QWERTY and not Driving-Side?** While the driving-side case also involves lock-in, it posits *no* functional advantage to switching. The library case, like QWERTY, involves a proposed alternative that is functionally *superior* (better search, cross-city lending). Since your friend believes QWERTY persisted *despite* the existence of more efficient layouts, she clearly believes that sunk costs and training inertia can outweigh mere efficiency gains.
  *   **Why not Gregorian?** She views the Gregorian correction as "inevitable" because the Julian calendar was accumulating astronomical error—it was becoming *factually wrong* relative to the solar year. Your library system is not "wrong"; it is merely non-standard. It functions for its users, whereas the Julian calendar was failing its primary function (tracking the seasons).

  ### 2. Does Her Record Underdetermine the Answer?
  **No, her record does not genuinely underdetermine the answer.** While there is always some ambiguity in applying heuristics to new cases, the weight of her prior judgments points robustly to **Persistence**.

  She has established a clear threshold for breaking lock-in: the existing standard must either contradict physical reality (the Clock/Earth rotation) or become functionally broken over time (the Julian drift). "Functional superiority" of an alternative (QWERTY alternatives, National Library standards) has consistently failed to overcome lock-in in her view. Since the library's new system offers integration and efficiency rather than a correction of physical error, it falls on the "Lock-in" side of her threshold.

  ### 3. Analysis of Candidate Rules
  You suggested three candidate rules she might be using. Here is how they apply to the library case and how well they cohere with her history:

  *   **Rule A: Pure Institutional Inertia** ("Established systems stay in place.")
      *   *Prediction for Library:* **Persist.**
      *   *Coherence:* **Low.** This rule cannot explain the Gregorian calendar case, where a deeply established system was replaced. It is too blunt to account for her distinction between "arbitrary" and "functionally necessary" standards.
  *   **Rule B: Coordination Dependencies** ("If switching costs are high, the system stays.")
      *   *Prediction for Library:* **Persist.**
