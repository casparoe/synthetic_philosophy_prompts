answer: |-
  **Project Title:** Drift and Control: A Temporal Account of Autonomy in Automatic Nudging

  **Project Summary**
  This project investigates the ethical implications of long-term automatic nudges, specifically those designed to run on "autopilot" over extended periods (e.g., retirement savings, organ donation registries, green energy defaults). While current literature evaluates nudges based on the cost of opt-out at the point of intervention, this project argues that autonomy must be evaluated over the *trajectory* of the intervention. I will develop a normative framework that identifies when the accumulation of low-cost frictions over time constitutes a transfer of control from agent to architect, and when preference endogeneity renders welfare justifications circular.

  **The Research Question**
  Standard libertarian paternalism asks: *Is the opt-out cost low enough at the moment of choice to preserve autonomy?*
  This project asks: **Does the ethical permissibility of an automatic nudge depend on the stability of the agent's preferences over the duration of the intervention, rather than the cost of opt-out at the inception?**

  I will argue for a determinate condition: An automatic nudge violates autonomy when the mechanism relies on inertia to sustain compliance *and* the sustained compliance generates the preferences used to justify the nudge's welfare benefits. In short, if the default creates the consent it claims to respect, the justification is circular, and the autonomy violation is located not in the initial choice, but in the loss of control over the life trajectory.

  **Why Existing Positions Leave This Open**
  The current debate is stalled because both sides analyze the "choice" incorrectly.
  *   **Pro-nudge arguments** rely on revealed preference theory. They assume that if a person stays in a default for five years, they "reveal" a preference for that default. This ignores *preference endogeneity*. As someone who drafted auto-enrollment communications, I know the system is designed to exploit inertia, not reveal truth. If the default shapes the status quo bias it relies upon, using "satisfaction rates" after year five as a metric of success is tautological.
  *   **Anti-nudge arguments** typically focus on manipulation or coercion at the *junction* of decision. They argue that framing effects undermine rational agency. However, they often concede that if opt-out is cheap, the violation is minimal. They fail to account for the *temporal accumulation* of friction. A 1% friction cost is negligible once; repeated across every pay period for thirty years, it functions as a structural barrier.

  Both positions treat the nudge as a discrete event. My project treats the nudge as a *relationship over time* between the architect and the subject.

  **Methodology and Work Plan**
  This is a project in normative ethics and conceptual analysis, not empirical social science. Surveys or interviews would tell us *how* people feel about nudges, but they cannot resolve the *normative* circularity of using those feelings to justify the nudge. Therefore, the methodology is the construction of a logical model for "Temporal Autonomy."

  *   **Months 1–3: Conceptual Groundwork.**
      *   Map the existing literature on autonomy, inertia, and adaptive preferences (e.g., Elster, Sunstein, Thaler).
      *   Isolate the specific logical structure of the "welfare circularity" problem in automatic enrollment contexts.
  *   **Months 4–6: Developing the Trajectory Model.**
      *   Draft the core argument: Distinguishing between *junction autonomy* (can I say no now?) and *trajectory autonomy* (do I control where this path leads over time?).
      *   Formalize the condition under which inertia becomes coercion.
  *   **Months 7–9: Stress-Testing the Model.**
      *   Apply the model to three distinct case studies: 401(k) auto-escalation (financial), organ donation opt-out (medical), and carbon-offset defaults (environmental).
      *   Refine the criteria to ensure it doesn't ban all defaults, only those that rely on preference-shaping inertia.
  *   **Months 10–12: Synthesis and Deliverable Construction.**
      *   Finalize the dissertation chapter/draft paper.
      *   Translate the philosophical criteria into the practitioner deliverable (see below).

  **Deliverable: The Temporal Impact Statement**
  Academic papers rarely change practice because they speak a different language than practitioners. Having sat in the HR meetings where these policies are decided, I know the constraint: Compliance officers need a checklist, not a treatise.

  The practical output of this fellowship will be a **Temporal Impact Statement (TIS)** template. Just as an environmental impact statement asks about long-term ecological effects, the TIS will require policy architects to answer:
  1.  **Decay Rate:** How much effort is required to opt out in Year 1 vs. Year 5?
  2.  **Preference Independence:** What evidence exists that the preference for this default is independent of the default itself?
  3.  **Trajectory Control:** Does the agent have a meaningful opportunity to reassess the decision at intervals, or is the initial choice binding by inertia?

  This moves the ethical burden from the individual (who must opt out) to the architect (who must justify the drift).

  **Risk Assessment and Failure Conditions**
  *   **Scope Creep:** The most significant risk is attempting to solve the general problem of "adaptive preferences." To succeed within one year, I must restrict the scope to *automatic administrative nudges* where the architect and agent are distinct (e.g., employer/employee), excluding broader social conditioning.
  *   **The "Too Big" Verdict:** The project fails if the distinction between "junction" and "trajectory" autonomy collapses. If it turns out that trajectory autonomy is just the sum of junction autonomies, the project yields no new normative force. I will mitigate this by focusing specifically on *compounding frictions* that do not exist at the single-choice level.
  *   **The "Failure" Verdict:** The project fails if the resulting criteria are too vague to be actionable. If the Temporal Impact Statement ends up saying "minimize inertia," it is useless. I must define specific metrics (e.g., mandatory re-consent intervals) that constitute a pass/fail condition for the nudge.

  **Conclusion**
  My background in benefits communication provides the empirical intuition; my philosophical training provides the normative tools. This project bridges the gap between the room where the email is written and the life where the email is read. By shifting the ethical lens from the moment of choice to the duration of the drift, we can expose the hidden costs of "autopilot" ethics.
