          *   If Swampman behaves exactly like me (4), but has no content (3), and content is causally explanatory for behavior (5), then Swampman's behavior lacks that causal explanation. But if the behavior is identical, how can the causal story be different? This looks like a violation of causal closure or explanatory exclusion. If physical states cause the behavior, and content *supervenes* on physical states (usually assumed for causal efficacy), but Swampman has the physical states without the content, then content isn't doing the work. Or, if content *is* doing the work, Swampman shouldn't be able to behave that way without it.
          *   *Severity:* High. This is the "Exclusion Problem" applied to Swampman.

      *   *Tension B: Teleosemantics (1 & 2) vs. Math Content (7).*
          *   Teleosemantics relies on evolutionary selection (history). Math truths (like 17 is prime) are abstract, necessary, and not plausibly linked to specific survival conditions in the EEA (Environment of Evolutionary Adaptedness). How can a mechanism be "selected for indicating" abstract necessary truths? This is the "Normativity/Abstracta" problem for teleosemantics.
          *   *Severity:* Medium-High. It's a known gap in the literature, but proponents (like Millikan or Neander) often try to extend the theory. It's a "work in progress" tension rather than a logical contradiction *yet*.

      *   *Tension C: Swampman (3) vs. Teleosemantics solving Disjunction (2).*
          *   Is there a tension here? Not really. (2) explains why *normal* frogs mean fly. (3) explains why *Swamp* frogs mean nothing. They are consistent applications of the same principle (History matters).
          *   *Severity:* None/Apparent only.

      *   *Tension D: Content $\neq$ Consciousness (6) vs. Swampman (3 & 4).*
          *   If Swampman has no content, does he have qualia? (6) says teleosemantics doesn't commit to a view on qualia. However, if Swampman reports pain, does he feel it? If he feels it but has no content, that's fine. But if he has no content, does his report "I am in pain" have content? If yes, (3) is violated. If no, how does he report sincerely? This touches on (4).
          *   *Severity:* Medium. Depends on how strictly one separates access consciousness from phenomenal consciousness.

      *   *Tension E: Causal-Explanatory Role (5) vs. Externalism (implied by 1 & 3).*
          *   If content is determined by external history (1 & 3), but causation is local (internal physical states), how does the *external* history cause the *local* behavior? This is the "Distality" or "Causal Relevance" problem. If the intrinsic properties of Swampman and I are identical, and causation depends on intrinsic properties, then content (which differs between us) cannot be the cause.
          *   *Severity:* High. This is essentially the same as Tension A but framed via Externalism.

  4.  **Drafting the Analysis (Iterative Refinement):**

      *   *Refining Tension A (The Swampman Causal Exclusion Problem):*
