      *   For each: The conflicting commitments, The Nature of the Tension, Resolution Options & Costs.
      *   Confidence & Uncertainty section.
      *   Contested Readings flag.

      *(Self-Correction during drafting)*: I should check if (2) and (7) are in tension. (2) relies on causal indicators (flies). (7) relies on abstracta. Teleosemantics usually handles (2) well but struggles with (7). So the tension is between the *success* claimed in (2) and the *requirement* in (7). I will group this under the "Scope" problem.

      *(Refining the Causal Exclusion)*: This is the big one. If I believe beer is in the fridge (content), I go to the fridge. Swampman has the same brain state, no content, goes to the fridge. If content is causal, why didn't Swampman need it? If physical states are sufficient, content is epiphenomenal. This contradicts (5).

      *Let's finalize the ranking:*
