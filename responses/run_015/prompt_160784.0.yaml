  2.  **Deconstruct the Asymmetry (Life vs. Intelligence):**
      *   *Biosignatures (Life):* Often treated as "potential habitability" or "chemical anomaly." The standard is high, but the *consequence* of a false positive is scientific embarrassment. The consequence of a false negative is missing a discovery.
      *   *Technosignatures (Intelligence):* Treated as "ETI" (Extraterrestrial Intelligence). The standard is *extremely* high (Wow! Signal, Tabby's Star). The consequence of a false positive is global societal disruption, loss of scientific credibility, potential panic/religious upheaval.
      *   *The "Sagan Standard":* "Extraordinary claims require extraordinary evidence." Intelligence is viewed as more extraordinary than simple life.

  3.  **Evaluate the User's Hypotheses:**
      *   *Hypothesis 1 (Extraordinariness):* Yes, this is the stated philosophical justification. Intelligence implies technology, civilization, longevity. Life implies chemistry.
      *   *Hypothesis 2 (Mimics):* Also true. Abiotic oxygen is a known debate. Radio interference is *everywhere*. But is it the *root* cause?
      *   *Hypothesis 3 (Repeatability):* This is a strong methodological point. Science relies on reproducibility. A one-off signal is statistically weak. Atmospheric spectra are integrated over time, implying stability.

  4.  **Analyze the Thought Experiments:**
      *   *Case 1 (One-off Prime Signal):* If it's *unmistakably* artificial (mathematical structure), repeatability becomes less critical for *validity* but critical for *study*. If it never repeats, it's a historical artifact, not a communicative channel. The field would likely call it an "anomaly" rather than "contact" until verified, but the content raises the bar for "mundane mimic."
      *   *Case 2 (CFCs/Industrial):* This is the bridge. CFCs are a technosignature found via biosignature methods (spectroscopy). Would it get the "life" standard or the "intelligence" standard? Likely the latter. This suggests the *implication* (minds) drives the standard, not just the *method*.
