answer: |-
  This is a remarkably sharp dissection of the sociology and epistemology of astrobiology and SETI (Search for Extraterrestrial Intelligence). You have identified a genuine inconsistency in the field. The short answer is: **The practice does not presuppose one consistent principle.** It is a patchwork of epistemological rigor, institutional risk management, and historical stigma.

  Here is the breakdown of what the field strictly presupposes, what it merely sits comfortably with, and where the contradictions lie.

  ### 1. The Three Hypotheses: Which one is doing the work?

  You offered three readings for the asymmetry between life (biosignatures) and intelligence (technosignatures).

  *   **Hypothesis 1: Intelligence is a more extraordinary claim.**
      *   *Status:* **Rhetorically dominant, operationally inconsistent.**
      *   This is the "Sagan Standard" ("Extraordinary claims require extraordinary evidence"). The field *says* this is the reason. However, as your CFC thought experiment reveals, this is often applied retroactively. If we find methane, it's chemistry. If we find CFCs, it's sociology. The *method* of detection is identical (spectroscopy), but the *burden of proof* shifts because of the implication. This suggests the "extraordinariness" is a social judgment, not an evidentiary one.
  *   **Hypothesis 2: Mundane mimics (Confounders).**
      *   *Status:* **Technically true, but insufficient.**
      *   It is true that radio frequency interference (RFI) from satellites is ubiquitous, while abiotic oxygen-methane disequilibrium is chemically difficult (though not impossible) to fake. However, we have gotten very good at ruling out RFI. When a signal passes all RFI checks (like the "Wow! Signal"), it is still treated as a non-detection because it didn't repeat. If mimics were the only issue, a verified non-mimic signal should count, regardless of repetition.
  *   **Hypothesis 3: Repeatability (Checkability).**
      *   *Status:* **The strongest methodological presupposition.**
      *   Science relies on falsifiability and verification. A spectral line in an atmosphere is a *stable state*. It is there today, tomorrow, and next year. You can point a different telescope at it and check. A one-off radio burst is an *event*. Once it's gone, you cannot verify it wasn't a glitch in your own receiver.
      *   *Verdict:* The field strictly presupposes **repeatability** for signals, but accepts **stability** for atmospheres. The asymmetry arises because life usually presents as stability (atmospheres), while intelligence (in our current search paradigm) presents as events (signals).

  ### 2. Running Your Thought Experiments

  **Case One: The One-Off Artificial Burst**
  *   *Scenario:* 30 seconds, prime numbers, 400 light years, never repeats.
  *   *The Practice:* This would **not** be classified as a detection. It would be classified as an "unexplained anomaly."
  *   *Why:* This reveals that **repeatability is the real principle**, not the content. Even if the content is mathematically impossible to generate naturally, the inability to rule out instrumental error (a glitch in the digitizer that *looked* like primes) prevents it from entering the canon of fact.
  *   *Implication:* If the field accepted this as a detection, it would admit that single-observer data can constitute truth. It refuses to do this. Therefore, the "Mind" penalty is secondary to the "Verification" penalty. However, because it implies Mind, the scrutiny on the instrumental error will be 100x more intense than if the burst looked like noise.

  **Case Two: The Industrial Chemical (CFCs)**
  *   *Scenario:* Spectroscopic detection of refrigerants on a distant planet.
  *   *The Practice:* This would immediately be subjected to the **stricter intelligence standard**, despite using the **life-detection method**.
  *   *Why:* This proves that **Hypothesis 1 (Extraordinariness)** is the hidden driver. Methodologically, CFCs are identical to Oxygen. They are absorption lines. They are stable. They are repeatable. But because they imply *agency*, the community will demand the elimination of *all* possible abiotic pathways (even unlikely ones) before conceding intelligence.
  *   *Implication:* The asymmetry lives in the **implication**, not the evidence. The field presupposes that claims about *minds* require a higher probability threshold than claims about *metabolism*, even if the data quality is identical.

  ### 3. Planetary Protection: Epistemology, Not Ethics

  You asked about the "smear of life" on Mars and why we treat it like a protected site while bacteria on Earth have no moral standing.

  *   **What's doing the work:** This is not about the moral standing of the bacteria. It is about **contamination control**.
  *   **The Logic:** If we find life on Mars, we need to know if it is *Martian* or if we took it there. If we treat the site as "protected" (sterile protocols), we preserve the ability to answer that question.
  *   **The Asymmetry:** On Earth, we are already contaminated. Finding bacteria here tells us nothing about the origins of life. Finding bacteria on Mars tells us everything about the universality of life.
  *   **Conclusion:** The protecting practice does not need rarity or moral standing. It needs **scientific purity**. It is caution wearing a costume, but the costume is "protocol," not "ethics." We protect the *data*, not the *bugs*.

  ### 4. The "Cost of Being Wrong" Analysis

  If you replace the philosophical justifications with a straight decision-theory view ("What does it cost us to be wrong?"), the asymmetry makes pragmatic sense, even if it is epistemologically messy.

  *   **False Positive (Life):** We publish a paper, get excited, later find a volcanic explanation.
      *   *Cost:* Embarrassment, wasted telescope time, minor erosion of public trust.
      *   *Verdict:* Acceptable risk.
  *   **False Positive (Intelligence):** We announce Contact. Societies react. Religions grapple. Governments might posture. Then it turns out to be a pulsar or a satellite reflection.
      *   *Cost:* Massive erosion of scientific credibility, potential geopolitical instability, "Boy Who Cried Wolf" effect that kills funding for decades.
      *   *Verdict:* Unacceptable risk.
  *   **False Negative (Life/Intelligence):** We miss it.
      *   *Cost:* Delay in discovery.
      *   *Verdict:* Science is patient. Delay is preferable to error.

  **Where would the bar end up?**
  If the justification were purely "cost of error," the bar for intelligence would remain **significantly higher** than for life. The current tilt is justified by risk management, even if the epistemological explanations (repeatability, mimics) are inconsistent.

  ### 5. Is Our Trajectory Relevant? (The Selection Bias)

  You noted that we leak less narrowband radio every decade.

  *   **Relevance:** High. The standard is calibrated to **20th-century human technology**.
  *   **The Bias:** SETI largely searches for what *we* used to do (omnidirectional radio leakage) or what *we* think is efficient (directed laser comms).
  *   **The Consequence:** If a civilization moves to fiber optics, neutrino comms, or technology we can't conceive, they are invisible to our current standards.
  *   **Does it change the standard?** No. It changes the *search space*, not the *verification standard*. However, it does suggest that the "Intelligence" bar is high partly because we assume intelligent civilizations should be *loud* or *obvious*. If they are quiet, we won't find them, so the few candidates we do find are treated with extreme suspicion because they violate the expectation that advanced tech should be either ubiquitous or undetectable.

  ### Summary: What is Presupposed vs. What is Comfortable?

  1.  **Strict Presupposition:** The field strictly presupposes **verification**. A claim must be independently checkable. This is why the one-off signal fails and the atmospheric gas succeeds.
  2.  **Comfortable Habit:** The field is *comfortable* with the idea that **Mind > Matter**. It feels right to demand more proof for intelligence. This is not a strict epistemological rule (evidence is evidence), but a sociological one.
  3.  **Inconsistency:** The practice is **inconsistent** regarding technosignatures found via biosignature methods (like CFCs). If the field were consistent, CFCs would be treated exactly like Oxygen: as a chemical anomaly requiring geological exclusion. Instead, they are treated like Radio Signals: requiring sociological exclusion.
  4.  **Concrete Change:** If the field admitted the real justification was **Cost of Error**, they would formalize a "Impact Assessment" alongside the "Evidence Assessment." They would admit: *"The evidence is sufficient for a chemical claim, but insufficient for a societal claim."* Currently, they pretend the evidence itself is weaker, rather than admitting the stakes are higher.

  **The Verdict:**
  The gap in standards is not deep philosophy. It is **institutional risk management** disguised as **epistemological rigor**. The field acts as if the evidence for intelligence is inherently fuzzier, when often it is just more dangerous to claim. If you found those CFCs tomorrow, the data would be solid, but the papers would be cautious, not because the spectrum is ambiguous, but because the implication is too big to own without absolute certainty.

  You are right to sense that the "squiggle in the graph" is treated differently depending on what story you tell about the squiggle. That isn't science; that's sociology. But in a field where a false positive could shake civilization, maybe that sociology is a necessary safety valve.
