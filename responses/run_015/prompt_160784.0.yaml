      *   *False Positive (Intelligence):* Societal impact, loss of trust in science, potential geopolitical tension. Cost: High.
      *   *False Negative (Life):* Missed discovery.
      *   *False Negative (Intelligence):* Missed contact.
      *   *Conclusion:* The asymmetry is largely driven by risk management (societal/scientific reputation), not just pure epistemology.

  6.  **Address Human Trajectory (Radio Leakage):**
      *   We are becoming quieter digitally (fiber optics, directed comms). SETI searches for narrowband beacons. If we don't leak, maybe they don't either. The standard is calibrated to *our* past, not necessarily a universal constant. This is a selection bias.

  7.  **Synthesize the Argument:**
