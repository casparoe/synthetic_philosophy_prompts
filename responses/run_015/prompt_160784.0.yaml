      *Refining the Repeatability point:* A one-off signal *can* be recorded. It's not gone. But we can't verify it's not instrumental error without a second detection.

  9.  **Final Polish:** Check against the user's specific constraints ("what does the practice strictly presupposes," "concrete changes," "cost view"). Ensure the distinction between *epistemology* (how we know) and *pragmatics* (what happens if we're wrong) is clear.

      *(Key Insight to highlight)*: The "Wow! Signal" wasn't rejected because it wasn't intelligent; it was rejected because it wasn't *verifiable*. But a CFC detection *is* verifiable (in the sense that the spectrum persists), yet it would still face higher skepticism than Oxygen. This proves the "Mind" penalty is real.

