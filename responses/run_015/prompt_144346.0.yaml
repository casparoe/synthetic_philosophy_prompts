  *(e.g., Is "I could have been a fisherman" true because a similar person exists, or because someone fits the description "fisherman version of me"?)*

  *   **SIMILARITY** → Go to **NODE 3C**
  *   **DESCRIPTION** → Go to **NODE 3D**

  ---

  ### **NODE 3A (Essentialist Track)**
  **If origins are fixed, can it still change its *fundamental kind* across worlds?**
  *(e.g., Could this living organism have been an artifact instead?)*

  *   **NO** (Kind is Essential) → Go to **NODE 4A**
  *   **YES** (Kind is Accidental) → Go to **NODE 4B**

  ### **NODE 3B (Anti-Essentialist Track)**
  **If nothing about origin/kind is essential, what grounds its identity across worlds?**
  *(e.g., Is it just a bare "thisness" or haecceity?)*

  *   **BARE THISNESS** → **LEAF 4 (Unoccupied/Unattractive)**
  *   **QUALITATIVE GROUNDS** → *(Collapses back to NODE 3A)*

  ### **NODE 3C (Similarity Track)**
  **Is similarity determined by *overall resemblance* or *contextually relevant* traits?**
  *(e.g., Does the counterpart need to match most properties, or just the ones we care about in this conversation?)*

  *   **CONTEXTUAL** → Go to **NODE 4C**
  *   **OVERALL** → Go to **NODE 4D**

  ### **NODE 3D (Description Track)**
  **Must the description pick out a *unique* individual in the other world?**
  *(e.g., Can there be multiple candidates who fit the description equally well?)*

  *   **YES** (Unique Fit) → **LEAF 3 (Hybrid 'Best-Describer')**
  *   **NO** (Multiple Fit) → *(Collapses to NODE 3C)*

  ---

  ### **NODE 4A (Strict Essentialist)**
  **Do we identify the object across worlds via *intuition* or *criterion*?**
  *(e.g., Do we just "see" it's the same king, or do we check a list of necessary conditions?)*

  *   **INTUITION** → Go to **NODE 5A**
  *   **CRITERION** → *(Collapses to NODE 3A)*

  ### **NODE 4B (Moderate Essentialist)**
  **Why fix origins but not kind?**
  *(e.g., What makes the origin special if the kind doesn't matter?)*

  *   **NO GOOD ANSWER** → **LEAF 4 (Unoccupied/Unattractive)**
  *   **SPECIAL STATUS** → *(Moves to NODE 4A)*

  ### **NODE 4C (Contextual Similarity)**
  **Can one object have *multiple* counterparts in a single world?**
  *(e.g., Can I have two equally good "fisherman" counterparts in the same world?)*

  *   **YES** → Go to **NODE 5B**
  *   **NO** → *(Collapses to Standard TWI)*

  ### **NODE 4D (Overall Similarity)**
  **Is the counterpart relation symmetric?**
  *(e.g., If A is like B, is B like A?)*

  *   **YES** → *(Collapses to LEAF 1)*
  *   **NO** → *(Strict Counterpart Theory)*

  ---

  ### **NODE 5A (Kripkean Check)**
  **Are proper names (e.g., 'Nixon') rigid designators that pick out the same object in all worlds?**

  *   **YES** → **LEAF 1 (Kripkean Essentialist TWI)**
  *   **NO** → *(Collapses to Hybrid)*

  ### **NODE 5B (Lewisian Check)**
  **Is the counterpart relation governed by weights that shift with conversational context?**

  *   **YES** → **LEAF 2 (Lewis-style Counterpart Theory)**
  *   **NO** → *(Collapses to LEAF 2)*

  ---

  ## **THE LEAVES**

  ### **LEAF 1: Kripkean Essentialist Transworld Identity**
  *   **Path:** Yes (Props) → Yes (Origins) → No (Kind) → Intuition → Yes (Rigid)
  *   **Weirdest Commitment:** **Modal Intuitionism.** You must accept that we have a direct, non-qualitative grasp of identity across worlds (we just "know" it's Nixon even if he looks different), yet deny this grasp applies to qualitative duplicates.
  *   **Collapse Flag:** Can collapse into **Leaf 3** if you admit descriptions play a role in fixing reference.

  ### **LEAF 2: Lewis-style Counterpart Theory**
  *   **Path:** No (Props) → Similarity → Contextual → Yes (Multiple) → Yes (Weights)
  *   **Weirdest Commitment:** **Self-Duplication.** You are not literally in other worlds; you are world-bound. When you say "I could have been a fisherman," you are talking about a *different* person who resembles you. You never survive across worlds.
  *   **Collapse Flag:** Can collapse into **Leaf 3** if context sensitivity is removed and description becomes primary.

  ### **LEAF 3: Hybrid 'Best-Describer' View**
  *   **Path:** No (Props) → Description → Yes (Unique)
  *   **Weirdest Commitment:** **Linguistic Dependence.** Modal truths depend on how we describe the object. If we change the description, the "object" in the other world changes, even if the metaphysical situation hasn't. Reality waits on language.
  *   **Collapse Flag:** Often collapses into **Leaf 2** (Lewis) if "description" is cashed out as "contextual similarity."

  ### **LEAF 4: Unoccupied / Unattractive (Haecceitism)**
  *   **Path:** Yes (Props) → No (Origins) → Bare Thisness
  *   **Weirdest Commitment:** **Ungrounded Identity.** You claim an object is the same across worlds even if *every* qualitative property (origin, kind, shape, matter) is different. There is no fact of the matter that makes it the same object other than a primitive "thisness." Most find this incoherent because identity becomes untrackable.
  *   **Collapse Flag:** Collapses into **Leaf 1** if you try to ground the "thisness" in intuition.

  ---

  ### **Discussion Notes for Tuesday**
  *   **The "President" Test:** If you think "The current president" picks out the same person in all worlds (TWI), you lean Leaf 1. If you think it picks out whoever fits the role best in that world (WB), you lean Leaf 2 or 3.
  *   **The "Statue" Test:** If you think the statue could be made of different clay (No Origin Essentialism), you risk falling into Leaf 4 unless you switch to the World-Bound track (Node 2B).
  *   **Collapse Warning:** Notice how Leaf 2 and Leaf 3 are neighbors. Many philosophers argue Lewis's "contextual similarity" is just a disguised form of "best description." Be ready to defend why similarity isn't just description.
