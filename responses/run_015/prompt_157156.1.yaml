answer: |-
  ### 1. Tort Doctrine: Liability vs. Apportionment

  Your summary of the black-letter law is substantially correct, though one nuance requires sharpening before we interrogate the theory. You state that in the apportionment phase, the jury assigns a "share of causal contribution." In many jurisdictions (particularly those adopting the Restatement (Third) of Torts), the jury apportions *percentage of responsibility*, which is a hybrid of causal contribution and comparative fault (negligence severity). However, some jurisdictions do require apportionment based strictly on causal potency. I will proceed assuming your stricter reading: that the system asks for a causal percentage.

  **The Theory Presupposed**
  The legal practice does not presuppose a single, consistent metaphysical theory of causation. Instead, it operates with a **bifurcated pragmatic model**.

  1.  **Liability (The Threshold):** The move from *but-for* to *substantial factor* in overdetermination cases is best read not as a rival metaphysical theory (like causation as "production"), but as the **counterfactual theory with a normative overlay**. The law implicitly admits that metaphysically, neither fire *but-for* caused the loss (since the loss was inevitable). However, the *normative* goal of torts is loss-spreading and deterrence. To let both defendants off would violate the deterrent principle. Thus, the "substantial factor" test is a legal fiction that treats "sufficient contribution" as equivalent to "necessary contribution" for the specific purpose of establishing a duty to pay. It is a policy-driven expansion of the causal concept, not a discovery of a deeper causal reality.
  2.  **Apportionment (The Division):** Here, the system quietly shifts to a **degree-based theory**. By asking for percentages that sum to 100, the law treats causation as a conserved quantity (like energy or a budget). This contradicts the liability stage, where causation is treated as a binary status (you are either a cause or you are not).

  **Is a Single Theory Possible?**
  It is extremely difficult to square these two stages with one metaphysical theory.
  *   If causation is **binary** (as the liability stage suggests for sufficient causes), apportionment makes no sense; if Fire A caused 100% of the harm and Fire B caused 100% of the harm, you cannot divide the bill 50/50 without admitting that "causing 100%" was a shorthand for "being a sufficient condition."
  *   If causation is **divisible** (as the apportionment stage suggests), then the liability stage is misleading; neither defendant actually caused the *whole* harm, so holding them jointly and severally liable for the *whole* harm is a normative imposition, not a causal finding.

  The doctrine is forced into this inconsistency because it serves two masters: **corrective justice** (you broke it, you fix it — which favors the binary view) and **fairness among tortfeasors** (pay according to your contribution — which favors the divisible view). The "substantial factor" test is the glue holding these incompatible metaphysical commitments together. It allows the court to say, "You are fully responsible" (Liability) while simultaneously saying, "But you are only half to blame" (Apportionment).

  **Confidence Level:** I am **85% confident** in this analysis. The doctrinal description is stable, but the philosophical interpretation of *why* courts maintain this tension varies among legal theorists. Some argue the "substantial factor" test *is* a distinct metaphysical theory (the NESS test: Necessary Element of a Sufficient Set), which would resolve the liability tension but still struggle with the apportionment math.

  ***

  ### 2. Historical Practice: The Meaning of "Overdetermined"

  Historians use the term "overdetermined" loosely, often conflating the four meanings you listed. To make the practice coherent, we must distinguish them.

  1.  **Symmetric Sufficiency:** (Each condition sufficient on its own).
  2.  **Structural Sufficiency:** (Several independent routes exist).
  3.  **Epistemic Uncertainty:** (We don't know which route fired).
  4.  **Robustness:** (Outcome stable under perturbation).

  **Genuine Commitment**
  Professional historians are rarely committed to **(i) Symmetric Sufficiency**. In complex social systems, it is almost never true that *any single* named condition (e.g., "the assassination of Archduke Franz Ferdinand") was strictly sufficient on its own to cause a World War without the background conditions. If historians explicitly adopted (i), their practice of ranking causes would become incoherent: if A is sufficient and B is sufficient, calling A "primary" is causally meaningless.

  Historians are genuinely committed to **(iv) Robustness**, often mixed with **(ii) Structural Sufficiency**. When a historian says the war was overdetermined, they usually mean the structural tensions were so high that *some* spark was inevitable, even if this specific spark wasn't. The outcome was robust to small changes in initial conditions.

  **The "Primary Cause" Problem**
  If the outcome is robust (iv), what does "primary cause" mean? It cannot mean "most causal power" in a metaphysical sense, because the system was designed to produce the outcome regardless. In this context, "primary cause" is almost entirely **pragmatic and rhetorical**:
  *   **Salience:** It is the factor that varies in the contrast class (Why *this* war now, rather than peace?).
  *   **Intervention:** It is the point where an agent *could* have acted differently (the "contingency" hook).
  *   **Narrative:** It provides a handle for the story (a decision is easier to narrate than a structural trend).

  **Incoherence and Change**
  If historians explicitly adopted **(i) Symmetric Sufficiency**, they would have to abandon the notion of "turning points." If two routes are independently sufficient, blocking one changes nothing. To maintain coherence under (i), historical writing would have to shift from narrative (what happened) to modal analysis (what could have happened), focusing on the redundancy of the system rather than the agency of the actors.
  If they adopted **(iii) Epistemic Uncertainty**, they would simply need to admit ignorance. This is the least disruptive but also the least common usage.

  The current practice remains coherent only because it relies on **INUS conditions** (Insufficient but Necessary parts of Unnecessary but Sufficient sets). A "primary cause" is usually the *most salient INUS condition*—the one that completed the specific sufficient set that actually fired, or the one most amenable to human intervention.

  **Confidence Level:** I am **75% confident** here. While the philosophical reconstruction (INUS/Robustness) is standard in philosophy of history, attributing a specific commitment to the *profession* is difficult. Historians are not a monolith; quantitative historians might lean toward (iv), while narrative historians might implicitly rely on (i) despite its logical flaws.

  ***

  ### 3. Stress-Testing the Rule (The Shapley Value)

  The rule you have toyed with is known in philosophy and game theory as the **Shapley Value** (specifically applied to causation by scholars like Chockler and Halpern). It measures a cause's "pivotality" averaged over all possible orders of arrival.

  **Pre-emption and the Backup Cause**
  In a pre-emption case (Fire A burns the house; Fire B arrives later but would have burned it if A hadn't), your rule assigns positive causal share to Fire B. The law assigns zero.
  *   **Is this a defect?** It depends on the purpose of the attribution.
      *   If the purpose is **actual impact**, it is a defect. Fire B changed nothing in the actual world.
      *   If the purpose is **risk assessment or disposition**, it is a feature. Fire B revealed a vulnerability; the system was not safe from B, even if A got there first.
      *   **Legal Assumption:** The law assumes symmetric overdetermination and pre-emption are metaphysically distinct. In overdetermination, both fires *operate*. In pre-emption, only one *operates*. Your rule suggests they are structurally similar: in both cases, the backup was "ready to go."
      *   **Verdict:** This is not necessarily a defect in the *rule*, but a reason to doubt the *law's distinction*. The law cares about the physical mechanism (the flame that touched the wood). Your rule cares about the counterfactual structure (the set of conditions sufficient for the outcome). If you adopt the rule, you must accept that "causation" includes *dispositional readiness*, not just *actual execution*.

  **Reconstructing Liability**
  Can this rule reconstruct the liability stage (100% liability for each)? **No.** By definition, the Shapley Value is additive; the shares sum to 1. It cannot assign 100% to A and 100% to B.
  To reconstruct the liability stage using this rule, you would need to decouple *liability* from *causal share*. You would have to say: "Causation is divided 50/50, but Liability is triggered by *any* non-zero causal share above a threshold, and statutory policy mandates joint and several liability."
  *   **Historian Impact:** For a historian to adopt this rule, they would have to give up the **singular narrative**. You cannot write a biography of "The Great Man" if the Great Man only holds 15% of the Shapley Value for the victory. It forces a move from "Who did it?" to "How much did everyone contribute?" It destroys the "turning point" narrative, replacing it with a landscape of contributory weights. It makes history less dramatic but potentially more accurate.

  **Confidence Level:** I am **90% confident** in the mathematical properties of the rule and its incompatibility with the "100% each" liability model. The philosophical interpretation of pre-emption is more debated, but the structural limitation of the rule (additivity) is certain.

  ***

  ### 4. Pragmatics vs. Metaphysics

  Your suspicion is well-founded: the deepest disagreement is not about the metaphysics of causation, but about the **telos (purpose)** of the attribution.

  **Underdetermination by Metaphysics**
  Both legal and historical practices are radically underdetermined by metaphysics.
  *   **Law:** A Counterfactual theorist and a Process theorist (causation as physical transfer) can agree on 95% of verdicts. They diverge only on edge cases (overdetermination, pre-emption). In those edge cases, the verdict is driven by *policy* (deterrence, compensation), not by a deeper discovery of causal truth. The "substantial factor" test is proof: it is a policy tool disguised as a causal test.
  *   **History:** A Realist (causes are real forces) and an Constructivist (causes are narrative tools) can write the same history book. The Realist says, "Economic pressure caused the war." The Constructivist says, "Economic pressure is the most useful lens for explaining the war." The text looks identical.

  **Where Metaphysics Would Bite**
  For metaphysics to constrain these practices, the practices would need to change:
  *   **Law:** Courts would need to forbid policy considerations in causation rulings. They would have to say, "Even if letting this defendant off is unjust, the metaphysics of *but-for* causation forbids liability." They do not do this.
  *   **History:** Historians would need to agree on a single metric of "causal weight" (like your Shapley rule) and forbid narrative privileging of one factor over another unless the metric supported it. They do not do this.

  **Fixed Quantity vs. Status**
  Your framing ("fixed quantity to be divided" vs. "status each has fully") is accurate but misses a **third option**: Causation as **Explanation**.
  *   **Law:** Causation is a **gateway to responsibility**. It is a status (in/out) for liability, and a proxy for fault for damages.
  *   **History:** Causation is a **tool for understanding**. It is neither a quantity nor a status, but a relation of relevance between facts and an outcome.
  *   **The Third Option:** In both fields, causation is **context-sensitive**. In law, the context is the legal rule (deterrence). In history, the context is the research question (why *this* contrast?).

  The disagreement isn't about whether causation is real; it's about whether we are **counting** (apportionment), **blaming** (liability), or **explaining** (history). When you try to use the "counting" model (your rule) for the "blaming" task (liability), it breaks. When you use the "blaming" model (primary cause) for the "explaining" task (overdetermination), it distorts.

  **Confidence Level:** I am **85% confident** in this pragmatic diagnosis. It aligns with the dominant "contextualist" view in modern philosophy of causation (e.g., Van Fraassen, Hart & Honoré).

  ***

  ### Final Uncertainty

  **The Claim I Am Least Sure Of:**
  In Section 2, I claimed that professional historians are **genuinely committed to Robustness (iv)** rather than Symmetric Sufficiency (i), and that their use of "primary cause" is primarily pragmatic/rhetorical.

  **What Would Settle It:**
  This claim would be settled by a **systematic textual analysis of historiographical methodology**. If one could sample a significant corpus of academic historical monographs claiming "overdetermination" and code their actual counterfactual reasoning, we could see if they truly believe the outcome would have occurred without the "primary" factor (Robustness) or if they implicitly believe the primary factor was strictly necessary (Sufficiency/Necessity). My confidence is lower here because historians rarely make their counterfactual commitments explicit; they often speak metaphorically about "forces" and "pressures," making it difficult to distinguish between a metaphysical claim about sufficiency and a rhetorical claim about importance.
