answer: |-
  Here is the audit. Your friend's accusation ("helping yourself to something") is accurate: you are shifting your criteria for subjecthood depending on whether you want to preserve common sense or explain the lab data.

  Here are the tensions, ranked by severity.

  ### 1. The Ontological Instability (b) vs. (c)
  **Severity:** Critical. This is the metaphysical breakage.
  **The Clash:** In (b) you claim the surgery *creates* two subjects. In (c) you claim that in ordinary life they are *one subject again*. This implies the number of conscious subjects in a single skull fluctuates based on environmental stimulation (lab vs. home). Subjects do not typically pop in and out of existence because a tachistoscope is turned on.
  **What to Give Up:** You must drop (c).
  **The Cost:** You lose the intuition that the patient "feels normal" in daily life. You have to accept that there are *always* two subjects present after the surgery, but ordinary life provides enough cross-cuing and shared context that they act in concert. The "oneness" is behavioral coordination, not ontological unity.
  **Why:** If you keep (c), you make subjecthood contingent on task difficulty. If you drop (c), (b) becomes a stable claim: the surgery divides the workspace, creating two subjects permanently; daily life just hides the division.

  ### 2. The Methodological Exception (d) vs. (e)
  **Severity:** High. This undermines your epistemic authority.
  **The Clash:** (d) commits you to "report-first" and says enquiry "mostly ends" there. (e) explicitly overrides the patient's report ("nothing feels different") because of a theoretical commitment (confabulation). You are not starting and ending with the report; you are starting with the report and ending with your theory of hemispheric ignorance.
  **What to Give Up:** You must qualify (d).
  **The Cost:** You lose the purity of the phenomenological method. You have to admit that reports are theory-laden data points, not foundational truths.
  **Why:** You cannot claim (d) while simultaneously asserting (e). If you keep (e) (which you should, because confabulation is real), you must rewrite (d) to say: "Reports are the primary data, but subject to correction when structural disconnection prevents access."

  ### 3. The Developmental Gap (f) vs. (i)
  **Severity:** Medium. This is a theoretical hole.
  **The Clash:** (f) defines unity by access to a shared workspace. (i) asserts agenesis patients (born without the corpus callosum) are "obviously" one subject. But if the main fibre bundle is missing, how is the workspace unified? In adults, cutting it splits the subject (b). Why does lacking it from birth not split the subject?
  **What to Give Up:** You need to add a clause to (f) or (i).
  **The Cost:** You lose the simplicity of the "One Workspace" rule. You have to allow for *alternative* pathways (anterior commissure, subcortical routes) that develop in agenesis but are insufficient in adult split-brain cases.
  **Why:** Without this, (i) is an assertion of faith. If (f) is your principle, (i) needs a mechanism. If the mechanism exists in (i) but not (b), you need to say what it is.

  ---

  ### Fake Clashes (Keep These)

  *   **(f) vs. (g):** This is **compatible**. In hemispherectomy (g), half the hardware is gone, so there is only one potential workspace remaining. In split-brain (b), both halves are present but disconnected, allowing for two workspaces. Your principle (f) handles this fine: one workspace = one subject.
  *   **(a) vs. (b):** This is **compatible**. (a) defines the normal case; (b) defines the pathological exception. No tension there.
  *   **(h) vs. (d):** This is **compatible**, provided you interpret "report" broadly. (h) grants consciousness to the non-speaking hemisphere because it can *act* (guide a hand). If you treat action as a form of report, (d) is satisfied. If you require verbal report, (h) violates (d), but since the non-speaking hemisphere *cannot* speak, (d) simply doesn't apply to it.

  ---

  ### Case Verdict Check

  **Does your principle (f) actually deliver your verdict (b)?**
  **Yes.** If the corpus callosum is cut, the "broadcast" is restricted. Left visual field data does not reach the right-hemisphere workspace (and vice versa). Two workspaces = two subjects. (f) supports (b).

  **Does your principle (f) actually deliver your verdict (i)?**
  **Not necessarily.** As noted in Tension 3, if the CC is missing, does the broadcast fail? You assume "obviously one subject," but your own principle requires evidence of a shared workspace. You are helping yourself to the assumption that agenesis brains unify functionally in a way adult split-brains do not. You need to state that explicitly.

  ---

  ### The Single Revision

  To clean up the most mess with the least pain, **rewrite (c) and merge it into (b).**

  **Current (b) & (c):**
  > (b) ...there are two subjects there... (c) but only in that setup: in ordinary life i think they're one subject again... The twoness is a lab artefact.

  **Proposed Revision:**
  > **(b*)** In the classic adult split-brain setup, there are two distinct subjects of experience permanently. In ordinary life, cross-cuing and shared environmental context allow these two subjects to coordinate behavior so effectively that they function as a single *person*, but the duality of *subjects* remains. The "oneness" of daily life is behavioral, not phenomenological.

  **Why this fixes it:**
  1.  **Solves (b) vs (c):** It stops the subjects from popping in and out of existence.
  2.  **Solves (d) vs (e):** It explains *why* the report is wrong (the speaking subject is sincere but ignorant of the other subject), preserving your right to override the report without abandoning report-first methodology entirely.
  3.  **Satisfies the Friend:** It admits the "two minds" conclusion is a structural fact, not a lab trick. You are no longer "helping yourself" to unity when it's convenient.

  **Final Note:** Your list is 80% solid. The remaining 20% is you trying to protect the intuition that "I am one person" from the data that says "I am two minds." Let the data win on the metaphysics (two minds), and keep the intuition for the biography/law (one person). You already have (g) doing this for hemispherectomy; just apply the same logic to split-brain.
