  2.  **Analyze the Commitments:**
      *   (a) Normal humans = 1 subject, unified experience.
      *   (b) Split-brain (adult, cut) = 2 subjects/streams.
      *   (c) Split-brain (ordinary life) = 1 subject (twoness is lab artefact). *Wait, this contradicts (b) slightly or qualifies it.*
      *   (d) Methodology: Report-first (phenomenology drives theory).
      *   (e) Exception to (d): Patient reports are contaminated by confabulation (specifically the speaking hemisphere), so ignore their claim of unity.
      *   (f) Principle of Unity: Experiences belong to one subject if available to the same downstream consumer systems/workspace. One workspace = one subject.
      *   (g) Hemispherectomy (removal): 1 subject (loss of faculty, not subject).
      *   (h) Consciousness Criterion: Conscious iff subject can attend/act on it. Non-speaking hemisphere counts as conscious (can attend/guide hand).
      *   (i) Agenesis (born without corpus callosum): 1 subject.

  3.  **Identify Tensions/Contradictions:**

      *   **Tension 1: (b) vs. (c) vs. (f).**
          *   (b) says cut adult = 2 subjects.
          *   (c) says cut adult in ordinary life = 1 subject (twoness is lab artefact).
