          *   *Problem:* If the corpus callosum is cut, is there one workspace or two? If (f) is the metaphysical ground, then the physical disconnection *should* create two workspaces permanently, not just in the lab. (c) suggests functional integration restores unity, but (f) suggests structural/functional broadcast is the key. If the hemispheres can't talk to each other, do they share a workspace?
          *   *Worse:* (b) claims there *are* two subjects in the classic setup. (c) claims in ordinary life they are *one subject again*. This implies the number of subjects fluctuates based on environmental stimulation. This is metaphysically unstable. Are there two subjects hiding, waiting to be revealed by a tachistoscope? Or is there one subject that splits under pressure?
          *   *Friend's Critique:* This is likely where the friend said you're "helping yourself." You're defining subjecthood by behavioral output in the lab (b) but ignoring behavioral output in life (c), or vice versa.

      *   **Tension 2: (d) vs. (e).**
          *   (d) Report-first: Enquiry starts and *mostly ends* with sincere reports.
          *   (e) Exception: Ignore patient reports of unity because of confabulation.
          *   *Problem:* This looks like special pleading. Why is the report of the split-brain patient less "sincere" or valid than the report of a normal person? You are overriding (d) specifically to get the result you want in (b).
          *   *Cost:* If you keep (e), you weaken (d) significantly. You are theorizing *over* the report, not starting/ending with it.

      *   **Tension 3: (f) vs. (g).**
          *   (f) Unity = One Workspace/Consumer System.
          *   (g) Hemispherectomy = 1 Subject (loss of faculty).
          *   *Problem:* In hemispherectomy, huge amounts of "workspace" are removed. If consciousness depends on the workspace (f), does removing half the hardware destroy the workspace? (g) says no, it's the same subject. This seems compatible *if* the remaining hemisphere constitutes a full workspace.
