          *   Jordan (Substratist/Discontinuity): Substrate matters. Hidden threshold kills the original. Result is a copy (p-zombie-ish).
      *   **Key Arguments to Include:**
          *   Functionalist must address the "hidden cutoff" worry (where does it die?).
          *   Substratist must address why behavioral identity in the hybrid stage isn't enough (it acts like me, but is it *me*?).
          *   Empirical testability: Is there a testable difference in the intermediate state? If not, does the disagreement matter?
