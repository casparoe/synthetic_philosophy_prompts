      *   **The "Hidden Cutoff" (Functionalist Counter):** Alex challenges Jordan to pinpoint *when* it dies. Is it at 51%? 99%? Jordan needs to respond to the vagueness.
      *   **The "Hybrid State" (Substratist Counter):** Jordan argues that even if the hybrid acts normal, the *internal experience* (qualia) might be gone. It's a philosophical zombie.
