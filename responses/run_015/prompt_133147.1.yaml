  5.  **Validity:** Every provision in these Bylaws is in force only if approved by at least 60% of all members.
  6.  **Meetings:** Annual meetings occur in January.

  ### The Amendment

  "Article 5 is amended to read: 'Every provision in these Bylaws is in force only if approved by at least 80% of all members.'"

  *(The Amendment receives a 70% vote in favor.)*

  ### Walkthrough

  **1. Pre-Adoption Check (Validity)**
  Immediately before adoption, Article 5 requires a 60% threshold for any provision to be in force. The Amendment is a proposed provision. It has received 70% support. Since 70% exceeds 60%, the condition in Article 5 is satisfied. The Amendment meets every requirement imposed by the Bylaws as they stand. **Verdict: Valid.**

  **2. Post-Adoption Check (Invalidity)**
  Immediately after adoption, Article 5 reads that *every* provision requires 80% support to be in force. The Amendment is now a provision in the Bylaws. It has 70% support. Since 70% is less than 80%, the condition in the new Article 5 is not satisfied. The Amendment fails a requirement the Bylaws impose immediately after it is adopted. **Verdict: Invalid.**

  **3. The Oscillation**
  *   If the Amendment is **Valid**, it becomes part of the Bylaws. The new Article 5 (80% rule) applies to it. Because it has only 70% support, it fails the 80% rule and becomes **Invalid**.
  *   If the Amendment is **Invalid**, it does not become part of the Bylaws. The old Article 5 (60% rule) remains in force. Because it has 70% support, it meets the 60% rule and becomes **Valid**.
  *   The system contains no transition rule, savings clause, or temporal marker (e.g., "future provisions") to arrest this cycle. The text "Every provision" is universal; the tense "is in force" is present-continuous. Nothing in the text prioritizes the rule at T1 over the rule at T2. **Verdict: Indeterminate.**

  **4. Ordinary Determinacy**
  For any other question (e.g., "Can I sublet?", "Is the Board elected?"), the Bylaws return a single answer. Article 2, 3, 4, and 6 are unaffected by the vote threshold in Article 5 unless challenged. The indeterminacy is confined strictly to the standing of the Amendment itself.

  ### Analysis

  **The Feature Doing the Work**
  The work is done by the **universal quantifier in a standing validity condition** ("Every provision... is in force only if"). This frames validity not as a one-time procedural hurdle (e.g., "Amendments must be passed by...") but as a continuing state of being that applies to the document's contents regardless of when they were enacted. Because the Amendment changes the condition while simultaneously being subject to it, and because the text does not distinguish between the enacting instrument and the enacted content, the temporal indexical is hidden.

  **The Drafter's Repair and Its Cost**
  A drafter could remove the indeterminacy by rewording Article 5 to be expressly prospective: "Every provision *adopted after this date* is in force only if..."
  *   **Effect:** The Amendment would clearly be Valid (meeting the old 60% rule) and the new 80% rule would apply only to future changes.
  *   **Cost to the Faction:** The faction raising the threshold wants to establish a principle of *supermajority legitimacy* for the entire regime. If the new rule explicitly exempts itself, it admits that the 80% standard was not legitimate enough to govern its own creation. This undermines the normative force of the new rule, signaling to opponents that the 80% threshold is a tactical shield rather than a principled standard. To maintain the claim that *all* authority derives from 80% consent, they must risk the paradox that their own authority derives from only 70%.

  **The Strongest Reply (Social Fact Theory)**
  A legal positivist (à la Hart) would deny the paradox exists in practice. They would argue that the "Rule of Recognition" is a social fact, not merely text. If the members and officials *accept* the Amendment as valid (because they voted for it and act on it), then it is valid, regardless of the textual oscillation. The text is only evidence of the rule; the actual practice settles the matter. On this view, the indeterminacy is theoretical only; the moment the Chair declares the result, the social fact crystallizes, and the "Invalid" horn is cut off by official acceptance.

  **Honest Assessment of Smuggling**
  The case does not smuggle the verdict, but it does rely on a specific interpretation of "is in force." A court might rule that "is in force" implies a continuing condition for *remaining* in force, not a condition for *initial* validity, which would resolve the paradox in favor of validity (the amendment passes, then the stricter rule applies to future attempts to change it). However, because the text does not explicitly distinguish "enactment" from "continuance," and because Article 5 governs "Every provision" without temporal qualification, the textual indeterminacy is genuine. The oscillation falls out of the provisions as written, provided one refuses to import external canons of prospective construction.
