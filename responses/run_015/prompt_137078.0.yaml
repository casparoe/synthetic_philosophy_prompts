answer: |-
  **To:** The Author
  **From:** Consultant on Statutory Interpretation
  **Re:** Procedure for the Commission on the Common Life

  Here is the procedure you requested. It is drafted in the idiom of your statute, designed to be read aloud in the hearing room by the Chairman. It forces the philosophical conflict to surface at specific points without requiring your characters to name it.

  Following the procedure, I have applied it to your three petitions, validated your existing draft for the third petition, and provided the confidence statement you asked for.

  ***

  ### THE COMMISSION'S PROTOCOL FOR ADJUDICATION

  **Preamble:**
  *This Protocol is adopted to ensure the Commission discharges its statutory duty consistently. It divides the inquiry into Findings of Fact (to be supplied by the Research Officer) and Judgments of Value (to be determined by the Members). Where the Protocol indicates a Vote, the majority decision prevails.*

  **Step 1: The Threshold of Morality (Fact)**
  *Question:* Is the practice in question a matter of moral choice, rather than mere convenience, taste, or technical skill?
  *Evidence:* Research Officer to report on the nature of the activity.
  *Stopping Point:* If the Research Officer certifies the matter is amoral (e.g., traffic regulations, commercial pricing), the Commission declines jurisdiction.
  *Commissioner's Role:* To accept the Officer's certification.

  **Step 2: The Test of Repugnancy (Value)**
  *Question:* Is the practice repugnant to the common morality of the county?
  *Evidence:* Research Officer to report on the intensity of feeling among the populace (letters, press, clergy statements, police records).
  *Commissioner's Role:* To determine if the feeling reported amounts to "repugnancy" (deep disgust) rather than mere "disapproval" (preference for the alternative).
  *Stopping Point:* If the Commission finds the practice is merely disapproved but not repugnant, the petition is rejected. No further action.

  **Step 3: The Test of the Fabric (Value)**
  *Question:* Does the tolerance of this practice loosen the fabric of the common life?
  *Evidence:* Research Officer to report on tangible harms to third parties or public order arising from the practice.
  *Commissioner's Role:* To determine the link between the *moral feeling* identified in Step 2 and the *stability of society*.
  *Crucial Distinction:*
  *   *Finding A:* The fabric is loosened only if there is evidence of tangible harm to others or public disorder.
  *   *Finding B:* The fabric is loosened if the practice, by being tolerated, undermines the shared moral bonds that hold the county together, regardless of tangible harm to specific others.
  *Stopping Point:* If the Commission finds the fabric is not loosened, the petition is rejected.
  *Vote:* If Members cannot agree on whether the fabric is loosened, they must Vote on this Question alone before proceeding.

  **Step 4: The Test of Necessity (Fact/Value)**
  *Question:* Can the loosening of the fabric be sufficiently restrained by means short of the criminal law?
  *Evidence:* Research Officer to list available alternatives (licensing, censure, education) and their likely efficacy.
  *Commissioner's Role:* To weigh the efficacy of alternatives against the severity of the loosening found in Step 3.
  *Convention:* The Commission must select the least coercive measure that will serve.
  *Stopping Point:* If a non-criminal measure is deemed sufficient, the Commission recommends that measure and stops.

  **Step 5: The Final Recommendation (Value)**
  *Question:* Given the findings above, does the Commission recommend criminal prohibition?
  *Vote:* Required if any Member dissents on the application of the Convention in Step 4.

  ***

  ### APPLICATION TO THE THREE PETITIONS

  Here is how the Protocol runs on your specific cases, highlighting where your characters will split.

  #### Petition 1: The Suicide Manual
  *   **Step 1 (Fact):** Officer confirms this is a moral issue (sanctity of life). **Pass.**
  *   **Step 2 (Repugnancy):** Officer reports that the idea of aiding suicide is deeply shocking to most citizens. **Pass.**
  *   **Step 3 (The Fabric):** *Here is the split.*
      *   The **Devlinian Member** argues Finding B: If the county permits the sale of manuals on how to end life, it declares life has no value. This dissolves the bond of mutual care. The fabric is loosened.
      *   The **Hartian Member** argues Finding A: Purchasing a book harms no one. Suicide is self-regarding. There is no tangible harm to *others*. The fabric is not loosened by private despair.
      *   **Outcome:** They must Vote on Step 3. The Devlinian wins the vote (2-1, assuming the third member is cautious).
  *   **Step 4 (Necessity):** Officer notes censure is unlikely to stop sales. Only prohibition works.
  *   **Step 5 (Decision):** Commission recommends Prohibition.
  *   *Note:* The Hartian dissents, recording that the Commission has criminalised a thought, not a harm.

  #### Petition 2: Blasphemous Libel (Repeal vs. Retain)
  *   **Step 1 (Fact):** Officer confirms religion is a matter of morality. **Pass.**
  *   **Step 2 (Repugnancy):** Officer reports a split. The religious are repugned by blasphemy; the secular are repugned by the idea of silencing speech.
      *   *Complication:* The Statute asks about the "common morality of the county."
      *   **Devlinian Member:** The "common morality" is the historic morality. The fact that a minority objects does not change the common standard.
      *   **Hartian Member:** If a large section is not repugned, it is no longer "common."
  *   **Step 3 (The Fabric):**
      *   **Opposing Petitioners (Devlinian argument):** Repeal *itself* loosens the fabric. It is a public declaration that the old bond is dead.
      *   **Petitioners for Repeal (Hartian argument):** Retaining the law loosens the fabric by creating resentment and division in a pluralistic society.
      *   **Outcome:** This turns entirely on Step 3. The Commission must vote on whether *silence* (repeal) or *speech* (blasphemy) is the greater threat to the fabric.
  *   **Step 4 (Necessity):** If they vote to retain the morality, is criminal law needed? Devlinian says yes, because censure is too weak to uphold divine honour. Hartian says no, because divine honour is not the law's business.
  *   **Decision:** Likely a 2-1 to Retain, but with a strong dissenting opinion noting that the law is now protecting feelings rather than persons.

  #### Petition 3: Consensual Sexual Practice (Your Draft Check)
  *   **Step 1 (Fact):** Officer confirms moral issue. **Pass.**
  *   **Step 2 (Repugnancy):** Officer reports that while many do it, the *professed* standard remains repugnance.
      *   *Crucial Point:* Your draft rationale ("private breach is not the same as public toleration") fits perfectly here. The Devlinian Member argues that the "common morality" is what people *say* they believe, not necessarily what they *do* in the dark.
  *   **Step 3 (The Fabric):**
      *   **Devlinian Majority:** The existence of the law upholds the fabric. To remove it is to say the practice is indifferent to the common life. This loosens the fabric.
      *   **Hartian Minority:** The Officer's survey shows the fabric is already diverse. Prosecuting the poor and immigrants *itself* loosens the fabric by creating injustice.
  *   **Step 4 (Necessity):**
      *   **Devlinian Majority:** Private acts cannot be restrained by censure. Only the criminal law reaches into the private sphere to affirm the public standard.
      *   **Hartian Minority:** The criminal law cannot restrain private acts without tyranny. Therefore, no means can sufficiently restrain it without unacceptable cost.
  *   **Step 5 (Decision):** **Your draft stands.**
      *   The 2-1 vote to retain is philosophically sound within this Protocol.
      *   The rationale ("entitled to legislate for the morality it professes") is a direct application of Step 3, Finding B.
      *   The rationale ("private breach $\neq$ public toleration") is the specific counter to the Research Officer's survey data.
      *   **You do not need to rewrite this chapter.** The logic holds. The tragedy of the scene is that the Commission is following its own rules faithfully to reach a result the modern reader (and the Hartian member) finds unjust.

  ***

  ### RESEARCH OFFICER VS. COMMISSIONER JUDGMENTS

  To keep your scenes tight, here is the division of labour:

  **The Research Officer Settles (Fact):**
  *   The prevalence of the practice (e.g., the survey in Petition 3).
  *   The existence of alternative measures (licensing, censure).
  *   The record of tangible harm (police reports, medical data).
  *   The demographic breakdown of convictions.

  **The Commissioners Must Own (Value):**
  *   Whether "disapproval" rises to "repugnancy."
  *   Whether "repugnancy" equates to a "loosening of the fabric." (This is the most important distinction).
  *   Whether the "common morality" is defined by what people *do* or what they *profess*.
  *   Whether the cost of enforcement (e.g., targeting immigrants) outweighs the benefit to the fabric.

  ***

  ### CONFIDENCE AND THE DOUBTFUL STEP

  **Confidence Level:**
  I am highly confident (90%+) that this procedure is faithful to the arguments as made in the late 1950s and early 1960s. The structure mirrors the actual movement of the Hart-Devlin exchange: defining the social bond, assessing the threat to it, and determining the limit of law. Your draft for Petition 3 is historically accurate to the Devlin position; many critics mistakenly believe Devlin required *harm* to others, when his central point was that the *immorality itself* was the harm to the society's existence.

  **The Doubtful Step:**
  The step I am least sure of is **Step 3: The Test of the Fabric**, specifically the distinction between Finding A and Finding B.

  *   **Why it is doubtful:** In the actual debate, Lord Devlin struggled to define exactly *how* morality binds society. He often slid between "society will collapse" (a factual prediction) and "society has a right to defend its ideas" (a moral claim). In my Protocol, I have separated these into "Tangible Harm" (Hart) and "Undermining Bonds" (Devlin).
  *   **The Risk:** A sharp reviewer might argue that I have made the Devlinian position too coherent. Devlin sometimes argued that the *feeling* of disgust was evidence of the threat, effectively collapsing Fact and Value. By separating them in Step 3, I have given your Hartian character a cleaner line of attack than he might have had in reality.
  *   **How to Defend It:** If challenged, you can note that the Protocol is a *legal* tool designed to force clarity, whereas the philosophical debate was often muddy. The Commission is trying to *operationalize* the debate, which necessitates distinctions the philosophers might have blurred.
  *   **Recommendation:** In the dialogue for Step 3, let your Devlinian character occasionally slip. Let him say, "We know it loosens the fabric *because* we feel the disgust," rather than keeping the two strictly separate. This humanises the philosophy and covers the flattening I have imposed for the sake of the procedure.

  **Summary:**
  Your book is on solid ground. The procedure gives your characters a cage to rattle against. Petition 3 does not need rewriting; it is the strongest test of the statute because it shows the "Decent People" doing something "Indecent" by following the rules. That is the heart of the tragedy you are writing.
