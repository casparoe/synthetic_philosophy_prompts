  **Impossible Pair:** **Ensemble Stability** and **Global Consistency**. A model stable across ensembles (like Cramer's) is necessarily generic and smooths out irregularities. To capture global consistency (like Maier's fluctuations), you must tailor the ensemble to the specific arithmetic structure, violating stability. You cannot have a generic probabilistic model that is both ensemble-robust and globally accurate for deterministic sequences.

  **Biggest Filter:** **Ensemble Stability**. Most heuristic arguments rely on a single convenient model (usually maximum entropy) without testing against alternative ensembles. This requirement kills the "naive coin flip" approach immediately, as most fail when switched from natural density to random models.

  **Missing Element Added:** **Updateability**. The spec implicitly requires that when a global constraint is found (like the twin prime correction), the local model must be updateable without collapsing. This bridges Locality and Global Consistency.

  **Note on Relata:** Requirement 1 addresses the aggregation of reasons. If reasons are treated as vectors, independence is geometric, not probabilistic. This prevents the "twenty weak ones" problem before Confidence Capping even applies.

  **Note on Defeaters:** Requirement 6 distinguishes between *causal* dependence (mechanism) and *logical* dependence (entailment). In heuristic reasoning, logical dependence is ubiquitous; if it defeated independence, no heuristic would survive. Only structural mechanisms (like congruence obstructions) should defeat the presumption.

  **Note on Regress:** Requirement 3 is marked Preference because different camps prefer different stopping points (e.g., physical intuition vs. axiomatic probability). Non-negotiable stopping points are impossible without circularity.

  **Note on Confidence:** Requirement 4 ensures "No Free Lunch". It prevents the multiplication of small probabilities into false certainty, capping the output by the quality of the independence assumption itself.

  **Note on Locality:** Requirement 5 ensures that local checks do not validate a globally false model. This addresses your mate's concern about fluctuations in short intervals that local checks miss.

  **Note on Ensemble:** Requirement 2 is the core conflict. It demands robustness across spaces, which is the hardest bar to clear. Most heuristics are space-specific.

  **Final Verdict:** Your mate is right that the model breaks globally, but you are right that the method is fine *if* Ensemble Stability is treated as a diagnostic tool rather than a guarantee. The spec forces you to quantify the breakage.
