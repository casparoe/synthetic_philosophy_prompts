prompt: |-
  ok so im presenting next thursday at our evolutionary biology seminar—mostly empirical biologists and a philosopher of science who still thinks Gould and Lewontin basically won the adaptationism debate. my thesis is that their spandrels critique is usually treated like a methodological warning against just-so stories, but if you actually take modern evo-devo seriously, especially deep homology and developmental modularity, then the spandrel vs adaptation distinction stops being a philosophical caution and turns into an empirical prediction about whether a trait is structurally coupled to a selectable module. im also arguing that identifying something as a spandrel requires a prior functional analysis of the architectural context, which means the critique secretly depends on the adaptationist reasoning it claims to reject—so constraint and adaptation aren't the binary they imagined. the audience cares about mechanistic plausibility, not conceptual gymnastics, and half of them will hear this as me smuggling adaptationism back in through fancy evo-devo language. i need a prep sheet: the objections in roughly the order they'll come, phrased like a working biologist or that philosopher would actually say them, not sanitized. for each, what's the real damage, what should i concede up front (definately that developmental constraint is real and not just noise), what's the two-minute reply, and where is that reply weakest? include the one question im praying nobody asks—probably whether my view collapses everything into either adaptation or spandrel with no room for exaptation or developmental bias, or maybe a direct challenge about whether modularity data actually supports the coupling claim. this is a 20-minute talk with 15 minutes q&a, so keep replies practical.
