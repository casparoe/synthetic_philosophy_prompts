answer: |-
  To analyze the Marius episode, I will employ a conceptual apparatus distinguishing between individualist and holistic moral frameworks. The load-bearing distinction is between *individual standing* (moral status derived from intrinsic properties like sentience or autonomy) and *collective value* (status derived from contribution to a population, species, or ecosystem). The version of the speciesism critique I take to be strongest is not merely the psychological claim that we favor cute animals, but the normative claim that species membership alone is morally irrelevant to the consideration of interests. However, I must contrast this with a rival explanation: relational ethics, which argues that special obligations arise from specific relationships (custody, dependency) rather than intrinsic properties alone. My task is to determine whether the zoo's reasoning fits within moral discourse or operates outside it, and whether the public reaction reveals speciesism or something else.

  Applying this to the episode, the zoo's justification relies on what you call the "herd-slot conception." Marius's worth was functionally defined by his genetic utility to the European Endangered Species Programme. Standard individualist positions cannot represent this as a sufficient moral reason for killing. An interest-based utilitarianism might weigh Marius's future happiness against the population's genetic health, but since Marius was healthy and the threat was merely "slot occupation," the utilitarian calculus likely favors his continued life unless the population collapse causes immense suffering elsewhere. A rights view (Regan) or capabilities view (Nussbaum) would forbid the killing outright, as Marius is a subject-of-a-life whose flourishing is blocked for administrative convenience. Thus, the zoo's reasoning belongs to a population-level conservation ethic that individualist views must reject as instrumentalizing the individual. Consequently, the speciesism critique largely talks past the zoo's decision. The zoo was not discriminating based on species (they would cull a genetically redundant rhino similarly); they were discriminating based on genetic utility within a species. The speciesism critique is silent here because the conflict is not between species, but between the individual and the collective.

  However, the case sharply discriminates between individualist families regarding replaceability. The zoo treated Marius as replaceable by a genetically superior brother. Classic utilitarianism, committed to total utility, can license painless killing plus replacement if the replacement yields more value. Rights views forbid this absolutely. The Marius case confirms this antecedent disagreement rather than resolving it. If one finds the killing intuitively abhorrent, one is likely predisposed toward rights or capabilities views; if one finds it regrettable but administratively rational, one leans toward aggregative consequentialism. The episode does not prove one right, but it exposes the cost of each: the rights view potentially undermines conservation breeding programs (by forbidding culling surplus), while utilitarianism risks making individuals expendable for the greater good.

  Turning to the outrage as data, the disparity between the fury over Marius and the silence over Danish pig slaughter looks like literal speciesism: valuing a giraffe over a pig based on charisma. However, a relational explanation accounts for more variance. The outrage was not merely about death, but about betrayal. Zoos present themselves as custodians; killing a healthy dependent violates the implicit contract of care owed to animals brought into captivity. We do not owe the same special obligation to wild deer or commercially farmed pigs (in the public's implicit reasoning) as we do to animals we have claimed to protect. If this relational explanation wins, it does not damage the speciesism critique but relocates it. It suggests that while speciesism explains the *selection* of the victim (giraffe vs. pig), the relational breach explains the *intensity* of the reaction. The speciesism critique remains necessary to explain why the pig's death is tolerated, but insufficient to explain why the giraffe's death was scandalous.

  The breeding wrinkle stresses the apparatus further. Marius existed only because of the programme that killed him. Consistent individualists face a non-identity problem: had they forbidden the breeding policy to prevent culling, Marius would never have existed. Is a life worth living but cut short better than non-existence? If the individualist forbids the killing, they are logically committed to forbidding the breeding that makes killing necessary, effectively demanding an end to managed conservation breeding. This is a credible commitment for abolitionists but a reductio for those who value conservation. It reveals that individualist ethics struggles to accommodate population management without collapsing into either abolition of zoos or acceptance of culling.

  Finally, does the case confirm the speciesism critique? It confirms it as an explanation of public inconsistency (giraffe vs. pig), but reveals the critique is aimed at a different target than the zoo's logic. The critique targets prejudice across species; the zoo's logic targets individuals within a managed population. The lens is silent on several key fronts: it offers no verdict on whether zoos should exist at all (both abolitionists and conservationists can oppose the killing), on who had standing to decide (the zoo vs. the public), on the ethics of public dissection (which concerns dignity rather than life), or on whether the conservation goal was worth pursuing. It manufactures no verdict on the trade-off between genetic diversity and individual life because that trade-off lies outside individualist calculus.

  Regarding your constraints: Your roommate's claim that objecting here requires objecting to deer culling and meat-eating survives only partially. If the objection is based on rights (intrinsic value), the roommate is correct; killing Marius is morally equivalent to killing a pig. But if the objection is relational (betrayal of custody), the roommate is wrong; we have different obligations to captive dependents than to wild game or commodities. Your supervisor's claim that this is a reductio of the individualist consensus is stronger. The case reveals that individualist ethics cannot easily resolve conflicts between individual welfare and population health without either abolishing the population management (zoos) or sacrificing the individual. The consensus breaks because it lacks a framework for collective goods that doesn't swallow individual rights. The Marius episode shows that individualist animal ethics is ill-equipped to handle institutional contexts where animals are managed as populations rather than encountered as individuals, leaving us with a choice between inconsistent outrage or inconsistent ethics.
