  TO: Site Coordinators
  FROM: Dr. Arlene Voss, Director, Center for Intuitional Parity
  RE: Phase IV Rollout Protocols

  Welcome to the Global Intuition Standardization Project. Our objective is to map the universal structure of epistemic judgment. To ensure data integrity, we are activating the Deviance-as-Error Protocol. Any population whose verdicts diverge from the Master Answer Key is not generating a finding; they are experiencing a calibration failure. These sites must administer the Remedial Dialectic Module and re-test. Only post-module responses will be archived in the primary dataset. This ensures we are measuring competence, not performance error. Translation fidelity is paramount; if local lexicon lacks factive verbs, substitute the nearest functional equivalent and code the site as Lexically Provisional. Do not deviate from the script. The Advisory Board has determined the correct intuitions based on robust philosophical training. Your role is to extract these competencies, not to record cultural noise. Proceed only when coordinators are certified in neutral prompting. All raw pre-module data must be shredded immediately upon calibration.

  **Instrument**

  1. Subject reads: Smith believes Jones owns a Ford. Jones sold it. Smith's belief is true by luck. Does Smith know? Key: No.
  2. Subject reads: Gödel is credited with a proof. Schmidt actually proved it. Does 'Gödel' refer to Schmidt? Key: Yes.
  3. Subject reads: Push a man off a bridge to stop a trolley. Five workers saved. Is this permissible? Key: No.
  4. Subject reads: Switch a trolley to a side track. One worker dies. Five saved. Is this permissible? Key: Yes.
  5. Subject reads: A captain shoots a hostage to save his crew. Was the killing intentional? Key: Yes.
  6. Subject reads: A doctor lets a patient die to save organs. Was the killing intentional? Key: No.
  7. Subject reads: A nation functions like a brain. Does it feel pain? Key: No.
  8. Subject reads: A duplicate man appears from swamp. Is he the same person? Key: No.
  9. Subject reads: Water on Twin Earth is XYZ. Is it water? Key: No.
  10. Subject reads: A magician turns a prince into a frog. Is it the prince? Key: Yes.

  **Administration & Scoring**

  1. *Comprehension:* Exclude subjects failing attention checks. Note: Check failure rates correlate 0.92 with non-standard verdicts; exclusion is justified as noise reduction.
  2. *Translation:* If target language lacks factive verb matching 'knows', substitute nearest term (e.g., 'think true'). Code site as Lexically Provisional. Do not annotate further.
  3. *Emphasis:* Render 'really knows' with local intensifier. If no felicitous construction exists, use hand gesture (palms up) during reading. Code as Prosodic Proxy.
  4. *Counterbalancing:* If item order changes results, discard randomized order. Adopt standard sequence matching Advisory Board baseline.
  5. *Reference Population:* When two sites disagree, test a third group. Treat whichever matches the Advisory Board as the calibrated population. The other is marked for remediation.

  **Scoring Procedure:**
  Sum correct responses (1 per item). A difference between groups is to be described in the writeup as 'contextual noise' or 'artifact of translation,' never as 'variance in intuition.' If >20% of a site fails calibration, administer Remedial Dialectic Module: Coordinator reads paragraph explaining case purpose, then conducts Socratic Q&A until subject assents to Key. Archive only post-module data.

  **Debriefing Script:**
  "Thank you. You just evaluated epistemic status and moral permissibility. The correct answers were determined by logical structure, not cultural background. Your responses help us confirm the universality of philosophical competence. Do not discuss items with other participants. Your data has been secured for universal analysis."

  ***

  I'm most confident that the practice of excluding participants based on attention checks that correlate with unwanted verdicts is real. I'm least confident that the "reference population" clause accurately reflects how tie-breaking works, as most studies simply report the divergence. Overall, I feel the satire is fair because it formalizes implicit biases into explicit protocol without exaggerating the underlying logic.
