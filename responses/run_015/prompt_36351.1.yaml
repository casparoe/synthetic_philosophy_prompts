answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION ON PERSONAL IDENTITY**
  **Spring Term Seminar Series**

  **Preamble: On the Scope of Disagreement**
  The undersigned acknowledge that a significant portion of our historical dispute regarding the existence of the "self" is not substantive. We explicitly agree that the dispute is not regarding the existence of a Cartesian ego: both parties deny the existence of an immaterial, indivisible, and permanent substance underlying experience. We further agree that both parties accept the reality of causally connected physical and psychological aggregates. Consequently, the disagreement is not about the *furniture* of the world, but about the *status* of the concepts used to organize that furniture. The residual disagreement is not merely verbal; it concerns whether the psychological-continuity relation constitutes a genuine ontological unity sufficient to ground strict identity and non-derivative prudential concern, or whether it is a pragmatic fiction imposed upon a flux that ultimately lacks unity.

  **Part I: Substantive Agreements**
  The undersigned affirm the following claims as jointly held conclusions resulting from the term's collaboration:

  1.  **Limits of Classical Arguments:** Arguments from Hume, Locke, and the *Anatta-lakkhana Sutta* successfully demonstrate that no introspective evidence supports a permanent owner of experience, but they do not demonstrate that the *concept* of a person is ethically inert or that the causal chains constituting a life are normatively insignificant.
  2.  **The Teletransporter Intuition:** In standard teletransporter cases (destruction and replication), both parties agree that prudential concern for the replica is rational and that moral responsibility transfers to the replica. However, we agree that this intuition supports the continuity theorist's view of "what matters" while simultaneously supporting the Buddhist view that "identity" in the strict sense is not what drives that concern.
  3.  **Fission and Identity (Continuity Theorist Concession):** In cases of symmetric fission, psychological continuity holds between the original and both successors, but strict numerical identity does not. We agree this demonstrates that psychological continuity is not logically equivalent to identity, requiring the continuity theorist to either abandon the claim that continuity *is* identity or accept that identity is not what matters in survival.
  4.  **Ethics and Ownership (Buddhist Concession):** The denial of a substantial self does not automatically dissolve the phenomenological demand for special concern. We agree that causal continuity alone is insufficient to explain why specific future aggregates merit *special* prudential concern distinct from general benevolence without invoking a further fact about unity or convention that the Buddhist account must robustly defend.
  5.  **The Chariot Analysis:** The *Milindapañha* analogy (naming a person as one names a chariot) successfully explains how designation functions conventionally, but it does not settle whether the basis for that designation is a mind-independent relation or a mind-dependent imposition.
  6.  **Karma and Reaping:** Regarding the Buddhist worry that "one cultivates, another reaps," we agree that causal continuity is sufficient to explain the transmission of karmic consequences (habitual tendencies and suffering), but we remain divided on whether justice requires a singular subject to whom those consequences belong.

  **Part II: Table of Remaining Disagreements**
  The following table enumerates the precise points of divergence. The wording in each column is phrased to be acceptable to the party named as holding that view.

  | Topic | Formulation Acceptable to the Buddhist/Anatta Theorist | Formulation Acceptable to the Psychological Continuity Theorist |
  | :--- | :--- | :--- |
  | **Metaphysical Status** | "Person" is a useful pragmatic label imposed on a stream of processes; there is no fact of the matter about unity beyond the processes themselves. | "Person" denotes a genuine ontological unit constituted by strong psychological connectedness and causal dependence over time. |
  | **Normative Ground** | Prudential concern is a habit to be managed; ethics rests on the reduction of suffering, not on the rights or identity of an owner. | Psychological continuity is the objective relation that *makes* prudential concern rational and grounds moral responsibility. |
  | **Narrative Unity** | The narrative self is a retroactive fabrication that obscures the fragmented nature of experience. | The narrative self is a discovery of structural unity that integrates memories and intentions into a coherent life. |

  **Part III: The Cruxes and Recorded Predictions**
  The undersigned identify two specific cruxes where empirical or conceptual clarification could resolve the remaining disagreement. We record the following test cases and our predictions regarding their outcomes.

  **Crux 1: The Evidential Value of Meditative Experience**
  *   **The Issue:** Does the reported absence of a "sense of self" in sustained meditation provide evidence about the *nonexistence* of the self, or only about the *suppressibility* of the sense of self?
  *   **Test Case:** Long-term phenomenological reporting from advanced meditators in *nirodha-samāpatti* (cessation of perception and feeling) compared with neuroscientific data on integrated information processing during such states.
  *   **Buddhist Theorist Prediction:** The phenomenological report is ontologically revelatory; the absence of the sense of ownership proves the absence of the owner, and neural integration will be shown to be non-central to the subjective report.
  *   **Continuity Theorist Prediction:** The phenomenological report is functionally revelatory only; the absence of the sense of ownership proves only that the monitoring mechanism is offline, and neural integration will persist, showing the underlying structural self remains.

  **Crux 2: The Status of the No-Branching Rider**
  *   **The Issue:** Is the "no-branching" clause required by psychological continuity theorists to handle fission a principled constraint on identity, or an *ad hoc* patch that reveals the account was never about a real relation?
  *   **Test Case:** A thought experiment involving gradual, asymmetric fission where one branch retains 90% of psychology and the other 10%, compared to a 50/50 split.
  *   **Buddhist Theorist Prediction:** The necessity of adding complexity (weighting branches) to save the theory will reveal the "relation" is a human construct; the theory will fracture under the weight of its own exceptions.
  *   **Continuity Theorist Prediction:** The no-branching rider is a principled requirement of the logic of identity (which is one-to-one); the theory will successfully accommodate asymmetry by distinguishing between *identity* (strict) and *survival* (graded).

  **Signatures:**

  _________________________ (Philosopher A)
  _________________________ (Philosopher B)
  **Date:** _________________
