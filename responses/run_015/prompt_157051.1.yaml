prompt: |-
  I'm a novelist and I've somehow ended up on the jury for a translated-fiction prize — six of us, two long weekends a year, a longlist of about a hundred and fifty down to one winner. The disagreements are brutal and mostly can't be settled by anyone reading harder, and I'm bad at them: I either dig in or cave inside five minutes, and I can't tell which one I'm doing at the time.

  Half the books are in languages only one or two of us read, so half the time I'm arguing about a translation I can't check against the original; and we deliberate in the same room after reading each other's notes, so I suspect our verdicts aren't independent evidence at all, whatever that ought to mean for how much I move.

  What I want is a procedure I can actually run in the ten minutes before each meeting and again when we deadlock, for how much to shift when the others disagree with me. The stuff I half-remember about disagreement between peers seems built for factual disputes, where there's one thing that's true and we're both trying to find it, but "the ending doesn't earn itself" or "this is the most alive book on the list" doesn't obviously work like that, and the output isn't my belief anyway, it's a joint list I put my name to. So give me the questions in order, what counts as a decent answer to each, where the procedure stops with a no, and where it hands the decision back to us because it's a row about what the prize is for rather than a matter of evidence. It has to handle the cases where the other person has evidence I can't get at, like the original; where they know that literature far better than I do; where I'm the only one who loves the book; and where going along means signing a citation I think is wrong. Then run it on two: a book only I can read in the original that the other five are lukewarm about, and the book I found and fought for and should probably drop.

  Please write it as continuous prose, no headings, bullets, bold or tables — like an email to a friend. Don't worry about typos, its fine.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Novelist, jury member for a translated-fiction prize.
      *   **Context:** 6 jurors, 2 long weekends, 150 books -> 1 winner. Disagreements are brutal. User is bad at disagreement (digs in or caves too quickly). Half the books are in languages only 1-2 jurors read (asymmetry of evidence). Deliberation is communal (notes shared), so independence is compromised.
      *   **Goal:** A procedure to decide how much to shift opinion when others disagree. Needs to be runnable in 10 mins before meeting and during deadlocks.
      *   **Constraints:**
          *   Must handle aesthetic judgments ("ending doesn't earn itself"), not just factual disputes.
          *   Output is a joint list/citation, not just personal belief.
          *   Must handle asymmetry (others know the language/literature better, or user is the only one who knows the language).
          *   Must handle the case where agreeing means signing a wrong citation.
          *   Must distinguish between evidence-based disputes and value-based disputes (what the prize is for).
          *   **Format:** Continuous prose, no headings, bullets, bold, or tables. Like an email to a friend.
          *   **Tone:** Informal but thoughtful, practical, empathetic to the novelist's plight.
          *   **Task:** Write the procedure *and* run it on two specific cases (Book A: User knows original, others lukewarm; Book B: User found/fought for, should probably drop).

  2.  **Deconstruct the Problem:**
      *   The core tension is between *epistemic humility* (maybe they see something I don't) and *aesthetic integrity* (I stand by my taste/responsibility to the text).
      *   Standard peer disagreement norms (like conciliationism) assume a shared truth target. Art prizes don't have a single truth.
      *   The procedure needs to be a checklist of questions internalized as a flow of thought.
      *   It needs to stop when the disagreement is fundamental values vs. evidence.
      *   It needs to address the "citation" problem (can I sign my name to this?).

  3.  **Drafting the Procedure (Mental Outline):**
      *   Start with empathy/acknowledgment of the difficulty.
      *   Step 1: Check the source of disagreement. Is it evidence (translation error, context) or taste (aesthetic value)?
      *   Step 2: Check expertise asymmetry. Do they know the language/culture better? Do I?
      *   Step 3: Check the stakes. Is this the winner or just longlist? Can I live with the citation?
      *   Step 4: Decision rule. If evidence -> shift. If taste -> hold firm but compromise on rank. If citation -> veto.
      *   Apply to Case 1 (User knows original, others lukewarm).
      *   Apply to Case 2 (User fought for, should drop).

  4.  **Drafting the Content (incorporating constraints):**
      *   *Constraint Check:* No bullets, no bold, no headings. Continuous prose. Email style.
      *   *Tone:* Friendly, peer-to-peer.
      *   *Content:* Needs to be specific about the questions to ask oneself.

      *   *Drafting - Section 1: Intro & The Procedure.*
          Start by saying I hear you, it's a tough spot. The key is distinguishing evidence from value. Here's the mental script. First, ask if the disagreement is about what the book *is* or what it's *worth*. If it's about what it is, like a mistranslation or a cultural reference you missed, and the other person knows the language, you defer to them on the fact but not necessarily the value. If it's about worth, like whether the ending works, that's not factual. Second, ask if you can sign the citation. If the group writes "a masterful exploration of grief" and you think it's shallow, you can't sign that. Third, check the expertise gap. If they know the literature better, their comparison class is wider. Fourth, check your own rigidity. Are you digging in because you're sure or because you're tired?
          *Refining for flow:* Needs to be smoother. "Run this in your head..."

      *   *Drafting - Section 2: The Two Cases.*
          Case 1: You know the original, they don't. They are lukewarm. The procedure says: Check if their lukewarmness is based on the translation. If the translation is flat, their reaction is valid evidence of the reading experience in English. If the translation is good and they still don't like it, it's taste. You have privileged evidence (the original). You shouldn't cave on quality, but you might concede on prize viability.
          Case 2: You found it, fought for it, should drop it. Procedure: Ask why you should drop it. Is it evidence (flaws revealed) or consensus pressure? If it's consensus pressure on taste, hold firm unless you can't sign the citation. If you're tired, acknowledge that.

      *   *Refining the "Procedure" into prose:*
          Instead of "Step 1", use "Start by asking..."
          Instead of bullets, use paragraphs.
          Ensure the transition between the general advice and the specific examples is seamless.

      *   *Addressing the "Peer Disagreement" theory aspect:*
          The user mentioned they know half-remembered stuff about peer disagreement. I should acknowledge that aesthetic judgment isn't truth-apt in the same way. The goal isn't truth, it's a defensible collective decision.

      *   *Addressing the "Citation" issue:*
          This is crucial. If you can't sign the statement, you must dissent or veto.

      *   *Addressing the "Independence" issue:*
          Acknowledge that notes are shared, so independence is gone. The procedure is about managing the remaining integrity.

  5.  **Writing - First Pass (Mental or scratchpad):**
      Hey, I hear you. It's messy. Here is a way to think. First ask is this fact or value. If fact, defer to expert. If value, hold ground. Check if you can sign the quote. If not, stop. Then apply to your books. For the one you read in original, if translation is good, their taste counts. If translation bad, you know more. For the one you should drop, ask if you are tired or convinced.

      *Critique:* Too choppy. Needs to be flowing prose. Needs to be longer and more nuanced. Needs to explicitly list the questions as part of the narrative flow.

      *Revised Plan:*
      1. Open with empathy.
      2. Introduce the mental checklist as a narrative flow (First ask yourself... Then consider...).
      3. Define the stop conditions (when it's about values).
      4. Run Case 1.
      5. Run Case 2.
      6. Close with encouragement.

      *Constraint Check:* NO BOLDS. NO LISTS. NO HEADINGS.
      *Self-Correction:* I must be very careful not to use formatting that looks like a list. Use connecting words like "first," "next," "finally."

      *Drafting the content:*
      Start with "Dear friend" or just dive in. Let's dive in.
      Explain the distinction between epistemic weight and aesthetic responsibility.
      The procedure:
      1. Is the disagreement about the text's properties (translation accuracy, cultural nuance) or its merit (beauty, impact)?
      2. If properties: Who has access to the evidence? If they know the language, defer on properties. If you know the language, hold firm on properties.
      3. If merit: Can you endorse the collective statement? If no, you must dissent. If yes, how much weight to give their taste?
      4. Check for fatigue/bias.

      *Running the cases:*
      Case 1 (Original language): You have the evidence. If the translation is good, their lukewarm response is valid aesthetic data. If the translation is bad, their response is to the translation, not the book. You need to advocate for the book *as translated* or fix the translation view.
      Case 2 (Fighter's fatigue): You feel you should drop it. Is it because they found a flaw (evidence) or because you are worn down? If evidence, drop it. If weariness, hold firm unless you can't sign the citation.

      *Polishing the prose:*
      Make it sound like a novelist talking to a novelist. Use phrases like "the texture of the thing," "signing your name," "the room gets hot."
      Ensure the transition between the general procedure and the specific examples is clear without breaking the prose flow.

      *Final check on constraints:*
      - Continuous prose? Yes.
      - No headings? Yes.
      - No bullets? Yes.
      - No bold? Yes.
      - No tables? Yes.
      - Email style? Yes.
      - Typos allowed? Yes (but I'll keep it clean enough to be readable).
      - Run the two cases? Yes.

      *Wait, one more thing:* The user asked for "the questions in order, what counts as a decent answer to each, where the procedure stops with a no, and where it hands the decision back to us." I need to make sure these specific elements are embedded in the prose clearly.

      *Revised Plan for Embedding Requirements:*
      I will weave the questions into the text as "The first question you put to yourself is..." and "A decent answer looks like..." and "You stop here if..."

      *Let's write.*

      (Self-Correction during drafting): I need to make sure I don't accidentally bold the questions. I will just write them out. I need to make sure the transition to the examples is smooth.

      *Drafting thought:* "Here is the protocol. First ask..." -> "The protocol starts with..."
