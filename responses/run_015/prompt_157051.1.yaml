      *Okay, ready to generate.*

      *Wait, check the "independence" point.* The user mentioned notes are shared so verdicts aren't independent. I should acknowledge that the procedure isn't about restoring independence but about managing the dependency responsibly.

      *Okay, final polish of the plan:*
      1. Acknowledge the difficulty.
      2. Lay out the mental routine (Question 1: Fact vs Value. Question 2: Evidence Access. Question 3: Citation Endorsement).
      3. Define the "Stop" condition (Value clash).
      4. Define the "Defer" condition (Evidence asymmetry).
      5. Apply to Case 1 (User knows original).
