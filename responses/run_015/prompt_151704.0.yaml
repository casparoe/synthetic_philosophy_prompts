  Anyway, I don't want a survey. What are the open questions in this area that actually matter for deciding whether indirect normativity is doing real work versus just hiding direct intuition behind a curtain? If I'm writing a term paper in about six weeks, rank the 2 or 3 I should actually care about and defend the ordering — like which ones are upstream of the others, what kind of result would shift them, and whether solving one collapses the rest. Don't give me a bibliogrophy or page numbers; my wifi's broken and I can't check half the journals anyway. Also, if there's a better analogy than cleaning a lens for what idealization does, mention it, but mostly I just need the priorities straight.
