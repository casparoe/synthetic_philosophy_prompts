  **Rule 1: The "Ontology of the Target" Heuristic**
  *   **Definition:** This rule classifies based on *what* is being optimized. If the target is a mind-independent state of the physical world (profit, board configuration, empirical truth), it is **Goal-Directed**. If the target is a mind-dependent state of an observer (preferences, opinions, ratings, reputation), it is **Approval-Directed**.
