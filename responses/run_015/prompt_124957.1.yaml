  *   **Definition:** This rule classifies based on *how tightly the feedback signal couples to reality*. If the feedback mechanism forces the agent to model reality accurately and produce substantive outcomes to succeed (high integrity), it is **Goal-Directed**. If the feedback mechanism allows for gaming, signaling, or short-term manipulation without substantive outcomes (low integrity), it is **Approval-Directed**.
