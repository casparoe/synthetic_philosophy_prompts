answer: |-
  ### The 10-Minute "Single Individual" Protocol

  **Purpose:** To prevent the paper from manufacturing an abstract "public" that allows readers to spectate and writers to hide.
  **Time:** 10 minutes max per piece.
  **Who:** Section Editors.

  #### Step 1: The Signature Check (Answerability)
  **Question:** Who is speaking, and who can be confronted about this?
  *   **Look for:** A byline (student/staff name) OR an explicit editorial signature (e.g., "Signed, The Editorial Board" with listed names).
  *   **Pass:** A specific human or a defined group of humans owns the text.
  *   **Fail:** "Staff Reports," "The Campus," "Administration," or unsigned editorials.
  *   **Action:**
      *   **If Fail:** **STOP.** Return to author for a name. If they refuse, escalate to Editor-in-Chief (EIC).
      *   **Exception (Values Call):** If the author fears retaliation (safety/visa/status), escalate to EIC. *Do not decide this alone.*

  #### Step 2: The Spectator Check (Action vs. Observation)
  **Question:** What does this ask the reader to *do* with the information?
  *   **Look for:** Language that invites judgment of *others* vs. language that demands a decision from the *self*.
  *   **Pass:** The text implicates the reader's own choices, responsibilities, or immediate community actions. (e.g., "We must demand," "Here is how you vote," "This affects your lab work").
  *   **Fail:** The text invites outrage, gossip, or passive consumption of someone else's drama. (e.g., "Look at what they did," "Students are angry," pure speculation).
  *   **Action:**
      *   **If Fail:** **STOP.** Rewrite the close to demand specific agency or spike.
      *   **Escalate:** If the piece is purely informational (e.g., event listing), skip to Step 3.

  #### Step 3: The Type Check (Leveling)
  **Question:** Is a specific person being turned into a symbol or a representative of a group?
  *   **Look for:** Generalizations attached to named individuals or specific groups.
  *   **Pass:** The subject is treated as a particular individual with specific context.
  *   **Fail:** The subject is framed as "The [X] Student," "The [Y] Professor," or a stand-in for a demographic.
  *   **Action:**
      *   **If Fail:** **STOP.** Edit headline and lede to remove generalizing language.
      *   **Escalate:** If the generalization is the point of the piece (e.g., an opinion piece on identity), escalate to EIC. *This is a values call on representation vs. leveling.*

  ---

  ### What Was Dropped to Make This Work
  To fit this into a 10-minute volunteer shift, the following Kierkegaardian nuances were sacrificed:
  1.  **Indirect Communication:** Kierkegaard often wrote pseudonymously to *protect* the reader's freedom, not to hide. The checklist treats anonymity as inherently suspect because distinguishing "ethical hiding" from "cowardly hiding" takes too long.
  2.  **The Religious "Single Individual":** The protocol treats "answerability" as social/legal (who do we confront?) rather than existential (who stands before God?).
  3.  **The Dialectic of the Public:** Kierkegaard saw "the public" as a spiritual void. The checklist treats it as a journalistic bad habit. It ignores that sometimes "the public" is a necessary political fiction for marginalized groups to gain leverage.
  4.  **Irony and Satire:** The checklist struggles with pieces that *use* leveling to expose leveling. Those require an EIC override.

  ---

  ### Run on Queue

  #### Case 1: Unsigned Editorial ("The Campus Has Spoken")
  *   **Step 1 (Signature):** **FAIL.** "The Campus" is the exact abstract phantom Kierkegaard warns against. No one is answerable for the interpretation of the poll.
  *   **Step 2 (Spectator):** **FAIL.** "The Campus Has Spoken" implies the readers are merely witnesses to a verdict already rendered by an abstraction. It invites them to align with the majority, not decide for themselves.
  *   **Step 3 (Type):** **FAIL.** The poll respondents are leveled into a single voice ("The Campus").
  *   **Verdict:** **SPIKE or RETURN.**
  *   **Required Fix:** A named author must write an op-ed interpreting the poll ("Here is what I think this data means"), or the headline must change to "Poll Suggests..." with a byline. The "voice of the campus" cannot exist.

  #### Case 2: Lab Safety Exposé (Anonymous Source, Leaked Docs)
  *   **Step 1 (Signature):** **CONDITIONAL FAIL.** The *author* is named, but the *accuser* (source) is hidden. The checklist flags this: Who answers for the accusation if the docs are contested? The paper absorbs the risk, but the source avoids answerability.
  *   **Step 2 (Spectator):** **PASS.** This invites action (fix safety, demand oversight). It is not gossip; it is a call to protect life.
  *   **Step 3 (Type):** **RISK.** The lab supervisors risk being leveled into "The Negligent Admins."
  *   **Verdict:** **ESCALATE TO EIC.**
  *   **The Unpleasant Answer:** The procedure suggests you cannot run this *as written* without violating the answerability principle. To pass, the paper must take full moral ownership of the leak, not hide behind "documents show."
  *   **The Cost:** Following this means the EIC must sign off as the moral agent of the accusation, increasing legal liability and potential retaliation against the paper that the source sought to avoid. It may slow publication or force you to name the source if their safety can be guaranteed, which might kill the tip. Kierkegaard would argue that if the truth cannot be spoken openly, using the press to whisper it makes the press a tool of intrigue rather than ethical communication. You have to decide if "safety outcomes" justify "abstract means."

  #### Case 3: First-Person (Named Student, "International Student" Experience)
  *   **Step 1 (Signature):** **PASS.** Named author.
  *   **Step 2 (Spectator):** **PASS.** Personal narrative usually demands empathy/engagement, not just judgment.
  *   **Step 3 (Type):** **FAIL.** You noted everyone will read this as "what international students think." The headline or blurb likely frames her as a representative.
  *   **Verdict:** **EDIT REQUIRED.**
  *   **Required Fix:** Change headline from "An International Student's Struggle" to "[Name]'s Struggle with [Specific Incident]." Add an editor's note clarifying this is one experience, not a representative sample. Force the reader to see *her*, not the *category*.

  ---

  ### Where The Framework Misfires

  **1. The Epistemic Value of the Aggregate**
  Kierkegaard hates "the crowd," but sometimes the crowd *is* the data. In Case 1 (the poll), the "abstract public" actually reveals material conditions (e.g., 80% of students are hungry). Insisting on a named author for a poll result can obscure the systemic nature of the problem. Sometimes "The Campus" is a valid shorthand for a structural issue that no single individual can own. The checklist risks atomizing systemic critique into individual opinion.

  **2. Protective Anonymity as Justice**
  In Case 2, the Kierkegaardian demand for "open answerability" privileges the powerful. A tenured professor can sign their name; a precarious grad student reporting safety violations often cannot. Demanding the source stand in the light protects the institution from accountability by silencing the vulnerable. The checklist treats anonymity as a moral failing; in power asymmetries, it is often a survival tactic.

  **3. Collective Organizing**
  Kierkegaard's "Single Individual" is anti-political by design. But student newspapers often serve as organs for collective action (unions, protests). These movements *require* the formation of a "public" that acts as a bloc. If you successfully break the "crowd" back into "individuals," you may inadvertently dismantle the solidarity required to force administrative change. The checklist optimizes for ethical purity, not political efficacy.

  **4. The Burden of the Marginalized**
  In Case 3, demanding the writer specify "this is just me" places the burden of nuance on the marginalized speaker, while the dominant group is allowed to remain the "universal." Asking the international student to constantly disclaim representativeness can exhaust the very voice you're trying to amplify. Sometimes letting a story stand as "testimony" is more important than preventing "leveling."
