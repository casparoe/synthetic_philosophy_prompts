answer: |-
  This is a sharp observation that cuts right to the core of philosophy of medicine. You're asking whether the current institutional behavior is consistent with its stated philosophical commitments. The short answer is: **no, the implicit theory does not hold together.** It is philosophically incoherent, masking a pragmatic institutional bias as a naturalist distinction.

  Here is the breakdown of why the split fails under scrutiny and what the biomarker scenario would actually do.

  ### 1. Naturalism vs. Normativism: The False Dichotomy
  The current practice tries to have it both ways, which creates the inconsistency you're spotting.

  *   **If it were strictly Naturalist:** Disease is defined by internal biological dysfunction (e.g., Boorse's biostatistical theory). Under this view, loneliness *should* be medicalized if it causes physiological dysregulation (immune suppression, HPA axis dysfunction). Since we know loneliness creates measurable biological wear-and-tear (allostatic load), a consistent Naturalist view would demand it be treated as a pathology, regardless of whether the root cause is social. The fact that it isn't suggests Naturalism is being applied selectively.
  *   **If it were strictly Normativist:** Disease is defined by what society values and wants medicine to fix. Under this view, the split makes more sense, but for cynical reasons. We medicalize obesity because we have profitable, individual interventions (drugs, surgery). We do not medicalize loneliness because the "cure" (community infrastructure, time, economic security) lies outside the medical marketplace.

  **The Verdict:** The practice cannot be explained strictly by either. It is driven by **Methodological Individualism**. The medical system is built to intervene on the *individual body*, not the *social environment*. Obesity is framed as a metabolic dysfunction within the individual (even if socially caused), whereas loneliness is framed as a relational deficit between individuals. The system ignores the latter not because it lacks biological consequences (Naturalism), but because it lacks an individual-unit intervention (Pragmatism).

  ### 2. The "Pre-Condition" Disparity
  You mentioned "pre-diabetes" vs. no "pre-loneliness." This highlights the economic engine of medicalization.
  *   **Pre-diabetes** creates a market for monitoring and prevention. It expands the jurisdiction of medicine into healthy populations.
  *   **Loneliness** does not expand jurisdiction; it threatens to overflow it. If loneliness is a medical condition, the "treatment" might require a city planner, a labor economist, or a religious leader, not a GP.

  The implicit theory here is that **disease is whatever the healthcare system is equipped to bill for.** This is neither Naturalist (truth-based) nor Normativist (value-based); it is **Instrumentalist**.

  ### 3. The Biomarker Scenario: "Social Deficit Disorder"
  If we started treating cortisol or oxytocin patterns as proof of a "social deficit disorder," here is what would change in the practice:

  *   **Validation vs. Reduction:** It would solve the *legitimacy* problem (insurance would pay), but it would worsen the *category error*. By locating the pathology in the hormone rather than the social void, you individualize a structural problem.
  *   **Treatment Shift:** Intervention would shift from "social prescribing" (joining a club, community support) to pharmacology (oxytocin nasal sprays, cortisol blockers). You would treat the *symptom* of isolation biologically while leaving the *cause* (isolation) intact.
  *   **Responsibility:** It would absolve the community. If loneliness is a "hormonal disorder," it is the patient's medical failure, not society's failure to provide connection.

  ### 4. Does the Implicit Theory Hold Together?
  No. The current split presupposes a **Bio-Individualist** theory of disease that claims to be Naturalist but operates on Normativist convenience.

  *   **Inconsistency:** It claims biological dysfunction is the threshold for disease (Naturalism), yet ignores the biological dysfunction caused by loneliness because it lacks a localized lesion or simple biomarker.
  *   **Inconsistency:** It claims to promote health (Normativism), yet refuses to categorize a major mortality risk as a disease because the treatment protocol disrupts the boundaries of the medical profession.

  **Conclusion:**
  The split exists because medicine is structured as a repair shop for individual bodies, not a maintenance system for social ecosystems. Medicalizing loneliness via biomarkers would likely just turn a social tragedy into a chronic pharmaceutical condition without fixing the isolation. The theory only holds together if you accept that "disease" is not a truth claim about health, but a bureaucratic claim about **liability and billability.**
