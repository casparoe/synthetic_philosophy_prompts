      *   *Section 1: Naturalism vs. Normativism.*
          *   Does the split presuppose Naturalism? Partially. Obesity fits the "internal dysfunction" model better. Loneliness looks external.
          *   Does it presuppose Normativism? Yes. We decide what's "medical" based on what we think doctors *can* do.
          *   *Verdict:* It's not strictly one. It's a hybrid that leans on **methodological individualism**. The system requires the problem to reside *in the body* to be a disease. Loneliness resides *in the gap between bodies*.
      *   *Section 2: Explaining the Practice.*
