prompt: |-
  hey so i've been thinking about this weird split in public health. we medicalize obesity and pre-diabetes with ICD codes, drugs, and even surgeries, but chronic loneliness—which meta-analyses tie to mortality risk comparable to smoking—gets handled through UK-style "social prescribing" or just ignored. there's no "pre-loneliness" diagnosis, no billing code for isolation.

  what view of health and disease does that institutional split presuppose? is it basically naturalist, that disease needs a biological dysfunction you can measure on a blood pannel, so loneliness doesn't count? or is it normativist, where we call something a disease when we think medicine should fix it, but call it a social problem when fixing it requires restructuring community? and can the practice be explained by either view, or does it strictly require one? also, if we started treating cortisol or oxytocin patterns as biomarker proof of a "social deficit disorder," what in the current practice would have to change?

  just want comments on whether the implicit theory holds together, not a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Observation:** There's a disparity in how public health handles obesity/pre-diabetes (medicalized, coded, drugged) vs. chronic loneliness (socialized, "social prescribing," often ignored).
      *   **Key Fact:** Loneliness has mortality risks comparable to smoking (supported by meta-analyses like Holt-Lunstad et al.).
      *   **Questions:**
          1.  What view of health/disease does this split presuppose? (Naturalist vs. Normativist?)
          2.  Can the practice be explained by either view, or does it require one?
          3.  If we biomarker-ized loneliness (cortisol/oxytocin = "social deficit disorder"), what would change in current practice?
      *   **Constraint:** "Just want comments on whether the implicit theory holds together, not a reading list." (Keep it analytical, concise, avoid academic bibliography dumping).

  2.  **Deconstruct the Philosophical Frameworks:**
      *   **Naturalism (Boorse, etc.):** Disease is a deviation from normal species functioning, statistically or biologically defined. It's value-free (in theory).
      *   **Normativism (Engelhardt, Canguilhem, etc.):** Disease is a value judgment. It's about what society deems undesirable or in need of intervention.
      *   **The User's Hypothesis:** The split suggests we medicalize when we can measure biology (Naturalist) *or* when we want medicine to fix it (Normativist), but we avoid medicalizing loneliness because it implies social restructuring.

  3.  **Evaluate the "Split" through the Lenses:**

      *   *Naturalist Lens:* Obesity has BMI, blood sugar, lipids. Loneliness has... self-reporting? If we found reliable cortisol/oxytocin markers, would Naturalism *force* us to medicalize it? Yes, if it counts as "species dysfunction." But currently, Naturalism allows the split because loneliness lacks a clear *internal* mechanism distinct from social context.
      *   *Normativist Lens:* This is where the user's insight is strongest. We medicalize obesity because we have pills/surgeries (profitable, individual-focused). We don't medicalize loneliness because the "cure" is community, policy, time—things outside the medical industrial complex's control/interest.
      *   *Synthesis:* The current practice isn't purely Naturalist or Normativist. It's *Pragmatic Institutionalism*. It follows the path of least resistance for the healthcare system.

  4.  **Address the "Biomarker" Scenario:**
