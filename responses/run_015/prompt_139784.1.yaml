      *   **Context:** The Board is split on classifying two entities (HX-7 and CX-2) under the *Synthetic Living Organism* (SLO) policy.
      *   **Policy Definition (SLO):** Constructed/modified by humans + self-produced boundary + maintains self far from equilibrium (internal processes) + capable of heritable variation subject to selection.
      *   **Consequences:** SLO = high containment, registry, MTAs, annual review, no public use. Non-SLO = ordinary lab hygiene, no registry, public use allowed.
      *   **Entities:**
          *   *HX-7 (Protocell Dynamics):* Fatty-acid vesicles, thermal gradient, fed amphiphiles/catalysts. Growth/split via shear (physical). No genome, compositional inheritance (statistical). Evolved faster uptake/division over 2k divisions. Dormant state (vitrified) reversible after 14 months. Spontaneous fusion (non-tree genealogy). Cannot make own boundary/energy.
          *   *CX-2 (Reactor Evolution):* Cell-free gene expression. Replicating RNA + replicase. Compartmentalized in water-in-oil emulsion on chip. Serial passaged 500+ times. Adapts (RNA sequence changes). Does *not* make compartment or energy. Material continuity broken every passage (fresh extract), only sequence continues.
      *   **Board Camps:**
          1.  *Adaptation Focus:* Both are SLOs (open-ended adaptation is the risk).
          2.  *Autonomy Focus:* Neither are SLOs (lack self-produced boundary/metabolism).
          3.  *Split:* Some say HX-7 yes/CX-2 no, others vice versa.
      *   **External Pressures:** Funding agency ("synthetic organism" clause), Utrecht Institute (watching), Public Exhibit (HX-7, 6 weeks out).
      *   **Required Content:**
          1.  Concrete disposition for HX-7 and CX-2 (SLO, Non-SLO, Provisional) + conditions/timeframes.
          2.  Operational criteria (feedstock dependence, dormancy, fusion/genealogy).
          3.  Strongest argument for the losing side.
          4.  Philosophical stance: Ontological claim (what *is* life) vs. Regulatory instrument (purpose-relative). Address how to communicate this to stakeholders.

  2.  **Determine the Recommendation (The "Decision"):**

      *   *Constraint:* I need to make a choice that is defensible, consistent with the policy text, and manageable operationally.
      *   *Analysis of HX-7:*
          *   *Boundary:* Self-produced (fatty-acid vesicles grow from feedstock). *Matches Policy.*
          *   *Equilibrium:* Maintains internal chemistry until feedstock stops. *Matches Policy.*
          *   *Heritable Variation:* Compositional inheritance, statistical, evolved traits. *Matches Policy.*
          *   *Weakness:* No genome, fusion breaks lineage, dormancy halts metabolism.
          *   *Verdict:* Leans strongly toward SLO. The "self-produced boundary" is the key differentiator from CX-2. The dormancy is akin to spores.
      *   *Analysis of CX-2:*
          *   *Boundary:* Chip/Emulsion (investigator supplied). *Fails Policy ("self-produced boundary").*
          *   *Equilibrium:* Dependent on fresh extract every passage (material continuity broken). *Fails Policy ("maintains itself... through internal processes").*
          *   *Heritable Variation:* RNA sequence, digital, evolves. *Matches Policy.*
          *   *Weakness:* It's essentially a chemical reaction in a box that copies a recipe, but the "organism" doesn't build the box or the factory.
          *   *Verdict:* Leans toward Non-SLO (Chemical/Biochemical Process). It lacks the physical continuity and self-boundary required by the specific text of the SLO definition.
      *   *Rationale:* This splits the pair (Camp 3). It respects the text of the policy (specifically "self-produced boundary") while acknowledging the risk of CX-2 through standard biosafety rather than SLO registry. It allows the HX-7 public exhibit to be cancelled/modified (safety first) but avoids over-regulating CX-2 which is effectively a试管 (test tube) evolution experiment.
      *   *Refinement:* HX-7 needs SLO classification. CX-2 needs Non-SLO classification but with specific monitoring due to evolutionary capacity. Let's make HX-7 SLO and CX-2 Non-SLO (Chemical Process).
      *   *Wait, reconsider CX-2:* The policy says "bounded by a self-produced boundary." CX-2 is in an emulsion on a chip. The emulsion is physical, but is it *self-produced*? No, it's microfluidic. The RNA replicates, but the compartment doesn't grow and divide *by itself* in the same way HX-7 does. HX-7 grows the vesicle. CX-2 is partitioned by flow. HX-7 is closer to "life" physically. CX-2 is closer to "virus in a host" but without the host being part of the entity.
      *   *Decision:* HX-7 = SLO. CX-2 = Non-SLO (Chemical Process).
      *   *Provisional?* HX-7 is robust enough for full SLO. CX-2 might need a "Provisional Non-SLO" with a review clause if it gains compartment-making ability. Let's stick to clear decisions to reduce ambiguity, but add a review trigger.

  3.  **Drafting the Operational Criteria:**

      *   *Feedstock/Infrastructure:* Dependence does *not* disqualify (analogy to cell lines/endosymbionts). The key is whether the *boundary* and *metabolic continuity* are intrinsic to the entity during its active phase.
      *   *Dormancy (HX-7):* Dormancy does not negate SLO status if the *capacity* to resume metabolism and reproduction is intrinsic and reliable (like spores). The "death" is metabolic pause, not entity termination.
      *   *Fusion (HX-7):* Fusion is not death. It is a recombination event. Lineage tracking must shift from tree-based to network-based graphing. This complicates registry but doesn't negate SLO status.

  4.  **Addressing the Philosophical Stance:**

      *   *Ontological vs. Regulatory:* We must choose Regulatory. We are a Safety Board, not a Philosophy Department. Defining "Life" is a trap. Defining "Regulated Entity" is our job.
      *   *Communication:* When asked "Is it alive?", the answer is "That is not the question before this Board. The question is whether it meets the regulatory threshold for containment."
      *   *Risk:* If we admit it's just administrative, does it lose authority? No, it gains clarity. It prevents scope creep.

  5.  **Addressing the Losing Side:**

      *   *The "Adaptation" Argument (Camp 1):* If CX-2 evolves indefinitely, isn't that the real risk? Why regulate the vesicle (HX-7) which might hit a complexity ceiling, but not the RNA (CX-2) which follows Darwinian logic perfectly?
