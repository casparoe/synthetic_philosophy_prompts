answer: |-
  **MEMORANDUM**

  **TO:** Novel Entity Classification Board, Vandermeer Institute for Origins and Synthesis
  **FROM:** [Your Name/Chair], Classification Board
  **DATE:** 5 November 2024
  **SUBJECT:** Draft Decision Memorandum: Classification of HX-7 and CX-2
  **MEETING DATE:** 12 November 2024

  ### 1. Executive Summary and Recommendations

  This memorandum establishes the operational interpretation of the *Synthetic Living Organism* (SLO) category under the Institute's Biosafety and Materials Policy. It provides specific determinations for the pending submissions HX-7 (Protocell Dynamics) and CX-2 (Reactor Evolution).

  **Recommendation 1: HX-7 (Protocell Dynamics)**
  **Classification:** **Synthetic Living Organism (SLO).**
  **Conditions:** Immediate entry into the Biological Materials Registry. Containment Suite Level 2 required. The scheduled "Build-a-Droplet" public exhibit is **prohibited** under current policy.
  **Review:** Annual review of compositional stability and fusion rates.

  **Recommendation 2: CX-2 (Reactor Evolution)**
  **Classification:** **Chemical/Biochemical Process (Non-SLO).**
  **Conditions:** Standard laboratory hygiene rules apply. However, due to demonstrated evolutionary capacity, the entity must be registered in a separate *Evolving Chemical Systems* log (non-regulatory) to track sequence changes. No bar on outreach, provided the emulsion system remains contained within the microfluidic hardware.
  **Review:** Provisional status for 24 months. If CX-2 or its derivatives demonstrate the ability to self-assemble a boundary from feedstock without microfluidic intervention, classification must be immediately reconsidered as SLO.

  ### 2. Operational Criteria for SLO Classification

  To ensure consistency for future submissions, the Board adopts the following interpretive criteria regarding the four clauses of the SLO definition.

  **A. Dependence on Feedstock and Infrastructure**
  *Policy Clause:* "Constructed or substantially modified by human intervention... maintains itself far from equilibrium through its own internal processes."
  *Interpretation:* Dependence on investigator-supplied energy or molecular feedstock does **not** disqualify an entity from SLO status. Obligate endosymbionts and established mammalian cell lines rely on external provision; they remain biological. The distinction lies in **material continuity**.
  *   *Test:* Does the entity utilize the feedstock to maintain its *own* structural integrity and internal chemistry during the active phase?
      *   If **Yes** (Entity metabolizes feedstock to repair/grow boundary): SLO candidate.
      *   If **No** (Entity is passive within a boundary supplied by the investigator): Non-SLO.

  **B. Dormancy and Metabolic Cessation**
  *Policy Clause:* "Maintains itself far from equilibrium."
  *Interpretation:* Temporary cessation of metabolism does not negate SLO status if the capacity to resume is intrinsic and reliable.
  *   *Test:* Is the dormant state a reversible physiological phase (analogous to sporulation or cryptobiosis) or a termination of the process?
      *   HX-7's vitrification is treated as dormancy. The "internal processes" are paused, not abolished. The *potential* for non-equilibrium maintenance is encoded in the compositional state.
      *   *Ruling:* Reliable revival confirms continuity of identity. Dormancy is not death.

  **C. Heritable Variation and Genealogy (Fusion)**
  *Policy Clause:* "Capable of heritable variation subject to selection."
  *Interpretation:* The policy requires heritable variation, not a specific mechanism (e.g., digital genetics) or a strictly bifurcating lineage.
  *   *Test:* Do daughter entities statistically resemble parent entities in traits subject to selection?
      *   *Fusion Events:* Spontaneous fusion (as seen in HX-7) is not the death of a lineage but a recombination event.
      *   *Registry Requirement:* For entities with non-tree genealogy, registration must track *population-level traits* and *compositional clusters* rather than strict individual lineages. The "organism" is defined by the persistent autocatalytic set, not the individual vesicle.

  ### 3. Determination Rationale

  **HX-7: Why it is an SLO**
  HX-7 meets the "self-produced boundary" clause, which is the primary discriminator. The fatty-acid vesicles grow by incorporating fed amphiphiles into their own membrane; the boundary is intrinsic to the entity, not the apparatus. Division is physical, but it is a consequence of the entity's growth dynamics within the environment. The compositional inheritance, while statistical, satisfies the "heritable variation" clause, evidenced by the selected uptake rates. The dormancy period is functionally equivalent to spore formation. The inability to synthesize amphiphiles *de novo* is irrelevant under Criterion A (Feedstock Dependence).

  **CX-2: Why it is Not an SLO**
  CX-2 fails the "self-produced boundary" and "material continuity" clauses. The water-in-oil emulsion is imposed by the microfluidic chip, not generated by the RNA system. Crucially, material continuity is broken at every passage; the "parent" RNA is diluted into a fresh aliquot of extract. The *information* persists, but the *physical system* does not maintain itself; it is rebuilt by the investigator at every generation. CX-2 is a self-replicating chemical recipe executed in a reusable hardware container. It is a sophisticated reaction, not an organism.

  ### 4. The Strongest Argument for the Losing Side

  The Board must give full weight to the argument presented by the "Adaptation Focus" camp (Camp 1), which argues that **CX-2 should be classified as an SLO.**

  Their argument rests on the purpose of the Biosafety Policy: risk management of open-ended evolution. CX-2 possesses a digital genome, replicates with higher fidelity than HX-7, and has demonstrated rapid adaptation to salt conditions and replication speed. By classifying CX-2 as a chemical process, we risk creating a regulatory loophole where a pathogenic or ecologically disruptive sequence could evolve under "ordinary laboratory hygiene" rules simply because it lacks a lipid membrane.

  The proponents argue that the "self-produced boundary" clause is an artifact of carbon-based chauvinism. If the risk we fear is *unpredictable evolutionary trajectory*, CX-2 is a higher risk than HX-7. HX-7's compositional inheritance is "fuzzy" and likely to hit a complexity ceiling; CX-2's digital inheritance allows for open-ended Darwinian evolution. To classify CX-2 as non-living because it relies on a chip is to classify a virus in a host cell as non-living because it relies on the host's ribosomes. If the policy exists to contain *evolutionary risk*, ignoring CX-2 is a failure of safety, prioritizing semantic purity over hazard mitigation.

  *Board Response to this Argument:* We acknowledge this risk. However, the Charter limits us to *applying* policy, not rewriting it. The policy explicitly requires a "self-produced boundary." To classify CX-2 as an SLO would require us to ignore the text of the definition. We mitigate the risk identified by Camp 1 by imposing the *Evolving Chemical Systems* log and maintaining standard biosafety protocols that prohibit environmental release, even if the full SLO containment suite is not triggered.

  ### 5. Ontological vs. Regulatory Stance

  The Board must decide whether this classification constitutes a claim about the nature of life or a regulatory instrument.

  **Decision:** This classification is explicitly a **purpose-relative regulatory rule.** It is not an ontological claim.

  We are not deciding if HX-7 or CX-2 are "alive" in a philosophical or biological sense. We are deciding if they trigger the *Synthetic Living Organism* policy. The definition provided in the Biosafety and Materials Policy is a *functional threshold for containment*, not a definition of essence.

  **Communication Strategy:**

  1.  **To Submitting Groups:** "The Board's determination reflects compliance with the Institute's Biosafety and Materials Policy. It is not a judgment on the biological status of your work. HX-7 triggers containment protocols due to self-boundary dynamics; CX-2 does not. This does not preclude you from describing your work as 'synthetic life' in scientific contexts, provided you do not claim it exempts you from SLO containment."
  2.  **To Funding Agency:** "Regarding the grant clause requiring notification of 'any synthetic organism': The Institute classifies entities based on the SLO definition in our Biosafety Policy. HX-7 is reported as a Synthetic Living Organism. CX-2 is reported as a Self-Replicating Chemical System. This classification governs our containment and reporting obligations."
  3.  **To Press Office / Public:** "The Vandermeer Institute classifies materials based on safety and containment requirements, not philosophical definitions of life. HX-7 requires high-level containment because it builds its own physical boundary and maintains internal chemistry. CX-2 does not. We do not use the term 'alive' in regulatory contexts because it is imprecise. We use 'SLO' to denote entities requiring specific biosafety measures."

  **Addressing the "Stopped Being Biology" Critique:**
  If challenged that an administrative definition divorces us from biology, the response is: "Biology describes what *is*; Policy manages what we *do*. A spore in a vault is biologically identical to a spore in the wind, but regulatory status differs based on context. Our definition is designed to identify *autonomous physical risk*, not to adjudicate the mystery of life. Clarity in regulation prevents ambiguity in safety. We prioritize the safety of the public and the integrity of the Institute over semantic consistency with textbook biology."

  ### 6. Timeline and Next Steps

  *   **12 November:** Board Vote on this Memorandum.
  *   **13 November:** Notification to Protocell Dynamics (HX-7) and Reactor Evolution (CX-2).
  *   **14 November:** Notification to Funding Agency (Grant Compliance Office).
  *   **15 November:** Press Office briefed on Q&A regarding "Is it alive?"
  *   **6 Weeks Out:** "Build-a-Droplet" exhibit cancelled or redesigned to use non-SLO simulants. Protocell Dynamics must submit a containment plan for HX-7 within 30 days.
  *   **24 Months:** Provisional review of CX-2 status.

  ### 7. Conclusion

  This split decision respects the text of the Policy while acknowledging the distinct risks of each system. HX-7 is physically autonomous enough to warrant the SLO label; CX-2 is evolutionarily potent but physically dependent enough to remain a chemical process. By framing this as a regulatory instrument rather than an ontological truth, we protect the Institute from philosophical drift while maintaining rigorous safety standards.

  **Action Required:** Board members are requested to review these criteria and come prepared to vote on the SLO status of HX-7 and CX-2 based on this framework.

  ***

  **Prepared by:**
  [Your Name]
  Novel Entity Classification Board
