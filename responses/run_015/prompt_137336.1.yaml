  ### The Night Register

  *I am the guest who enters now.*
  The manager shifts keys along the row.
  Room One is free, the rest move down,
  A finite shuffle, well and slow.
  The register accepts the strain,
  And I sleep safe in Room One's own.

  The next arrival pushes deep;
  *I am the guest who enters now.*
  The first guest wakes from distinct sleep,
  Moves to Room Two to make a bow.
  The line extends, the keys all turn,
  And I in Two await my turn.

  A third arrival takes the lead;
  The first moves Two, the Second Three.
  *I am the guest who enters now.*
  In Room Three I am safe and free.
  The list grows long but holds the weight,
  A countable and open gate.

  Then comes the bus with endless seats;
  *I am the guest who enters now.*
  The old guests double down the streets,
  *I am the guest who enters now.*
  To Even Rooms the old ones flee,
  *I am the guest who enters now.*
  We Odd Ones take the vacancy.

  The Register claims all is known;
  Room One burns Light, Room Two burns Dark.
  Room Three burns Light, Room Four burns Dark,
  Room Five burns Light, Room Six burns Dark.
  A list of traits for every door,
  Claiming there can be no more.

  *I am the guest who enters now;*
  I bear a Dark against Room One.
  *I am the guest who enters now;*
  I bear a Light against Room Two.
  *I am the guest who enters now;*
  I match no line, though all are true.

  *The keys are marks on paper strips,*
  *The Porter says, and wipes the dust.*
  *No infinite hotel exists,*
  *Only the ink, and human trust.*
