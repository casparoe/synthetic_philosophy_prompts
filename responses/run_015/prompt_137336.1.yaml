  ### Brainstorming Formal Strategies

  1.  **Visual Indentation:** Each stanza could indent further to the right, physically pushing the text down the page to mimic guests moving to higher room numbers ($n \to n+1$). The diagonal argument would then appear as a text block that refuses to align with the margin.
      *   *Critique:* Visually clever, but relies on layout rather than rhythm. Harder to read aloud, and the "doubling" move ($n \to 2n$) is difficult to represent with simple indentation.

  2.  **Rhyme Scheme as Mapping:** Assign specific rhyme sounds to specific room numbers. A successful accommodation means all rhymes match their assigned slots. The diagonal argument would break the rhyme scheme at the $n$-th rhyme of the $n$-th stanza.
      *   *Critique:* Too subtle for a 90-second read. Audiences might miss the mathematical isomorphism between rhyme failure and set-theoretic impossibility.

  3.  **Refrain Positioning (Selected):** The refrain represents the guest(s). Its position within the six-line stanza dictates the mathematical operation: shifting down one line for finite addition ($n \to n+1$), occupying odd lines for the infinite bus ($n \to 2n$), and failing to align for the diagonal.
      *   *Critique:* This offers the clearest auditable map. The listener can track the guest's location line-by-line, making the structural failure of the uncountable set palpable without needing jargon.

  ### Selection Note

  I chose **Refrain Positioning** because it allows the *location* of the text to perform the arithmetic. By moving the refrain down the stanza for finite guests and splitting it into odd lines for the infinite coach, the poem enacts the bijections physically. This sets up the final stanza, where the refrain cannot find a stable position because the "traits" of the lines themselves are constructed to exclude it, mirroring the diagonal argument's logical exclusion rather than a capacity error.

