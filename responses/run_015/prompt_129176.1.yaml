answer: |-
  ### Desiderata for Moral Objectivity in Light of Cross-Cultural Variation

  To construct an account of moral objectivity that respects the empirical data of Moral Foundations Theory (MFT)—specifically the WEIRD/non-WEIRD divergence regarding Harm/Care (universal but weighted) and Loyalty/Purity (variable in salience and structure)—the following five desiderata must be met.

  #### 1. The Salience-Existence Distinction
  *   **Requirement:** The theory must distinguish between a moral norm being psychologically *absent* in a population and being structurally *present* but assigned low *salience* or priority.
  *   **Motivating Case:** In WEIRD populations, Purity judgments are often low-salience or framed as personal choice rather than moral obligation. In non-WEIRD populations, they are high-salience obligations. A theory that interprets low WEIRD salience as the *absence* of the Purity foundation misreads the psychological data (which suggests the capacity is universal but deactivated) and falsely implies that WEIRD morality is structurally incomplete rather than differently prioritized.
  *   **Classification:** **Non-Negotiable for Empirical Adequacy.** Any metaethics ignoring this conflates psychological activation with normative existence.

  #### 2. The Convergence-Truth Decoupling
  *   **Requirement:** The theory must explain why near-universal convergence on Harm/Care does not automatically constitute proof of mind-independent moral truth, nor does divergence on Loyalty/Purity constitute proof of falsehood.
  *   **Motivating Case:** The universality of Harm/Care may result from shared evolutionary pressures (e.g., survival of vulnerable offspring) rather than tracking mind-independent moral facts. Conversely, the variation in Purity may reflect different contextual applications of a single truth rather than error. An objective account must separate *intersubjective agreement* (sociological fact) from *moral truth* (metaphysical claim).
  *   **Classification:** **Non-Negotiable for Objectivity.** (Relativist/Constructivist camps may reject this, treating convergence as constitutive of truth; Objectivity requires the gap).

  #### 3. The Structural Variance Accommodation
  *   **Requirement:** The theory must account for variation not only in the *intensity* of moral judgments but in their *conceptual ontology* (i.e., what kind of thing the obligation is understood to be).
  *   **Motivating Case:** Loyalty in a WEIRD context is often framed as voluntary associative commitment (contractual), whereas in non-WEIRD contexts it may be framed as essentialist kinship obligation (constitutive). If moral objectivity posits a single property of "Loyalty," it must explain how two conceptually distinct relational structures can both track that property without one being a category error.
  *   **Classification:** **Non-Negotiable for Empirical Adequacy.** (Standard Moral Realism struggles here; Pluralism/Pragmatism accommodates this more naturally).

  #### 4. The Weighting-Validity Decoupling
  *   **Requirement:** The theory must allow for different hierarchical weightings of moral foundations without rendering the lower-weighted foundations invalid or the higher-weighted foundations exclusively true.
  *   **Motivating Case:** WEIRD cultures prioritize Harm over Authority; non-WEIRD cultures may weight them equally or reverse the priority. An objective account must avoid declaring the non-WEIRD weighting "morally blind" (ethnocentrism) while avoiding the claim that all weightings are equally correct (relativism). It must distinguish between *incommensurability* (no common metric) and *permissible variation in prioritization* (common metric, different inputs).
  *   **Classification:** **Camp-Specific (Pluralist/Realist Tension).** Monistic Realism struggles here; Value Pluralism embraces it.

  #### 5. The Systematic Error Constraint
  *   **Requirement:** The theory must preserve the logical possibility that widespread folk-moral intuitions in *any* culture (WEIRD or non-WEIRD) are systematically mistaken.
  *   **Motivating Case:** If objectivity is to mean anything, the "folk" cannot be infallible. If Harm/Care is universal, it could still be a shared illusion (e.g., an evolutionary error theory). If Purity is culturally specific, it could still be a local truth. The account must allow for the possibility of error independent of cultural consensus.
  *   **Classification:** **Non-Negotiable for Objectivity.** (Relativist and some Constructivist camps reject this).

  ***

  ### Analysis of Compatibility and Exclusion

  #### The Jointly Unsatisfiable Subset
  Given the empirical pattern of MFT, the following three requirements form an unsatisfiable triad. An account of moral objectivity must abandon or modify at least one:

  1.  **Strong Mind-Independence:** Moral truths exist and have specific content independent of human conceptual schemes.
  2.  **Radical Conceptual Variance:** The *content* of specific moral obligations (e.g., Loyalty, Purity) is constituted by fundamentally different relational structures across cultures (e.g., Hierarchy vs. Communal Sharing).
  3.  **Folk Authority:** The variation in conceptual structure reflects valid moral insights rather than systematic error or misdescription.

  **The Conflict:** If moral truths are mind-independent (1), they possess a specific ontological structure. If the conceptual structures used by cultures to describe these truths vary radically (2), then at least one conceptual scheme is misaligned with the mind-independent truth. However, if we grant Folk Authority (3), we assert that the varying schemes are valid. You cannot maintain that truth is independent of the mind, that minds conceptualize the truth differently, and that all conceptualizations are valid.
  *Resolution:* Objective accounts typically sacrifice **Folk Authority**, positing that one culture (or a reflective equilibrium of both) is closer to the truth, or they sacrifice **Strong Mind-Independence**, moving toward response-dependent realism.

  #### The Most Exclusionary Requirement
  The single requirement that does the most to exclude popular theories is **The Structural Variance Accommodation (Desideratum 3)**.

  **Reasoning:**
  *   **Excludes Naive Naturalistic Realism:** Popular realist theories assume moral terms (like "Loyalty" or "Purity") pick out stable, natural properties. If the *conceptual structure* of Loyalty shifts from "contract" to "essence" across cultures, there is no single stable property for the term to track without significant theoretical revision.
  *   **Excludes Simple Subjectivism/Relativism:** While relativism handles variation easily, it fails the **Convergence-Truth Decoupling (Desideratum 2)** and **Systematic Error Constraint (Desideratum 5)**, which are required for *objectivity*.
  *   **Excludes Evolutionary Debunking Arguments:** These often treat variation as evidence of non-truth-tracking. Structural Variance requires explaining how different structures might *all* track truth, not just that they are adaptive.

  **Why it is the primary hurdle:** Most dominant metaethical theories (Cornell Realism, Simple Non-Naturalism) rely on a stable ontology of moral properties. The empirical reality that the *ontology of the obligation itself* (how the duty is conceived) varies culturally forces a choice between declaring most cultures in error (violating the spirit of taking variation seriously) or fragmenting the ontology of moral truth (violating standard Unity assumptions). This requirement forces objectivity accounts toward **Moral Pluralism** or **Response-Dependent Realism**, excluding the majority of standard Monistic Realist frameworks.
