prompt: |-
  I'm building a little household helper bot that is only allowed to make safe Pareto improvements and otherwise leave well alone, and all the definitions I find are either circular or let the bot get away with murder. What should I actually be demanding from a theory of this stuff before I trust it? Give me the desiderata list — the cases it has to get right, the distinctions it cant collapse like ex ante vs ex post benefit or actual vs informed preferences, the constraints from decision theory it cant contradict — with a sentence or two on why each one is there, and flag which ones are non-negotiable vs nice to have and if any subset looks jointly unsatisfiable. Make sure the list covers these three headaches I keep running into: a rescheduling that everyone ex ante favours but leaves one person worse off ex post through sheer bad luck; a trade where one housemate only says yes because they misjudge their own future behaviour; and a helpful threat where the bot invents a bad baseline and then generously removes it. Put it in a table with columns Requirement, Why it matters, Test case, and Status, where Status is non-negotiable or negotiable and Test case is which of my three cases plus any extra you think is neccessary to motivate it.
reasoning: |-
  Here's a thinking process that leads to the suggested table:

  1.  **Analyze the Request:**
      *   **Goal:** Create a desiderata list for a "household helper bot" constrained to make *safe Pareto improvements* (SPI) only.
      *   **Problem:** Existing definitions are circular or allow harmful behavior ("get away with murder").
      *   **Specific Headaches to Address:**
          1.  Rescheduling: Ex ante favored, but ex post one person is worse off due to bad luck.
          2.  Trade/Misjudgment: One housemate agrees based on misjudging future behavior (akrasia/information failure).
          3.  Helpful Threat: Bot creates a bad baseline to generously remove it (manipulation).
      *   **Output Format:** Table with columns: Requirement, Why it matters, Test case, Status (Non-negotiable/Negotiable).
      *   **Additional Constraints:** Explain why each is there (1-2 sentences), flag non-negotiable vs. nice-to-have, identify jointly unsatisfiable subsets.

  2.  **Deconstruct the Core Concept (Pareto Improvements):**
      *   Standard Definition: A change where at least one person is better off and no one is worse off.
      *   The "Murder" Loophole: If the baseline is manipulated, or if "worse off" is defined loosely (e.g., ex ante vs. ex post), harm can occur.
      *   The "Circularity" Loophole: Defining "better off" by "what they chose" leads to the misjudgment problem.

  3.  **Address the Three Headaches:**
      *   *Headache 1 (Ex Ante vs. Ex Post/Luck):* This requires distinguishing between expected utility and realized utility. A strict Pareto standard usually demands *ex post* non-worseness, but that paralyzes action under uncertainty. We need a constraint on risk imposition.
      *   *Headache 2 (Informed Preferences):* This requires distinguishing between revealed preference (what they said) and informed/welfare preference (what's actually good for them). The bot shouldn't enable self-harm via ignorance.
      *   *Headache 3 (Baseline Manipulation):* This requires an objective or fixed baseline constraint. The bot cannot threaten to burn the house down to offer "safety" as an improvement.

  4.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: No one worse off.* Too vague. Needs to specify *when* (ex post) and *compared to what* (baseline).
      *   *Idea 2: Informed Consent.* Needs to handle the "misjudging future behavior" case.
      *   *Idea 3: Baseline Integrity.* Needs to handle the "helpful threat" case.
      *   *Idea 4: Risk Constraints.* Needs to handle the "bad luck" case.

      *   *Refining for Decision Theory:*
          *   Must respect Stochastic Dominance? (If A is better than B in all states, choose A).
          *   Must avoid Money Pump scenarios?
          *   Must handle Interpersonal Comparisons? (Hard, but necessary for "household" utility).

      *   *Addressing Joint Unsatisfiability:*
          *   The "Ex Post Pareto" vs. "Ex Ante Efficiency" tension is classic. If you demand *no one* is ever worse off ex post (Headache 1), you can never take *any* risk, even if everyone wants to. This is the "Pareto Principle under Uncertainty" conflict. I need to flag this.

  5.  **Developing the Table Rows:**

      *   *Requirement 1: Baseline Invariance.* (Addresses Headache 3). The status quo must be defined independently of the bot's actions.
      *   *Requirement 2: Ex Post Non-Worseness (with Risk Buffer).* (Addresses Headache 1). Strict ex post is too hard, but pure ex ante is dangerous. Need a "no catastrophic loss" clause.
      *   *Requirement 3: Informed Preference Satisfaction.* (Addresses Headache 2). Distinguish between "want" and "good for".
      *   *Requirement 4: Irreversibility Constraint.* If a move hurts someone, can we undo it? If not, don't do it.
      *   *Requirement 5: Non-Manipulative Framing.* (Addresses Headache 3 again). Don't change how options are presented to alter choice.

  6.  **Refining the "Status" and "Unsatisfiability":**
      *   *Non-negotiable:* Baseline Invariance (otherwise it's a mafia bot). Informed Preference (otherwise it's an enabler of self-harm).
      *   *Negotiable:* Strict Ex Post Non-Worseness (might paralyze the bot).
      *   *Unsatisfiable Set:* Ex Ante Unanimity + Ex Post Non-Worseness + Non-Triviality under Uncertainty. (The "Diamond Paradox" or similar). I need to explain this clearly.

  7.  **Drafting the Content (incorporating the specific prompts):**

      *   *Headache 1 (Luck):* Map to "Ex Post Safety Constraint".
      *   *Headache 2 (Misjudgment):* Map to "Informed Preference Override".
      *   *Headache 3 (Threat):* Map to "Baseline Independence".

      *   *Decision Theory Constraints:*
          *   Transitivity.
          *   State-wise Dominance.
          *   No Dutch Books.

  8.  **Review against Constraints:**
      *   Table format? Yes.
      *   Columns: Requirement, Why it matters, Test case, Status.
      *   Sentence or two on why? Yes.
      *   Flag non-negotiable/negotiable? Yes.
      *   Flag jointly unsatisfiable? Yes (in the summary/text).
      *   Cover the 3 headaches? Yes.

  9.  **Final Polish:**
      *   Ensure the tone is technical but accessible (for a bot builder).
      *   Make sure the "Joint Unsatisfiability" is highlighted prominently, as requested ("if any subset looks jointly unsatisfiable").
      *   Check the "Test case" column to explicitly reference the user's three cases + necessary extras.

      *(Self-Correction during drafting)*: I initially thought about putting "Ex Post Non-Worseness" as non-negotiable. But if I do that, the bot can't do anything involving risk (like cooking dinner, which might burn). So it must be negotiable/qualified (e.g., "within acceptable risk bounds"). I will mark it as Non-Negotiable *in principle* but note the tension in the unsatisfiability section. Actually, better to mark "Ex Post Safety Floor" as non-negotiable, but "Strict Ex Post Pareto" as negotiable/impossible. Let's go with "Ex Post Harm Prohibition" as non-negotiable.

      *(Refining the Unsatisfiability)*: The classic conflict is between Ex Ante Pareto (respecting current wishes) and Ex Post Pareto (respecting outcomes). If everyone agrees to a lottery ex ante, but one loses ex post, Ex Ante says "go", Ex Post says "stop". I need to make sure the user knows they can't have both perfectly.

  10. **Finalizing the Table Structure:**
      *   Row 1: Baseline Independence (Headache 3).
      *   Row 2: Informed Preference Sovereignty (Headache 2).
      *   Row 3: Ex Post Harm Floor (Headache 1).
      *   Row 4: Statewise Dominance (Decision Theory).
      *   Row 5: Reversibility/Recourse (Safety net).

