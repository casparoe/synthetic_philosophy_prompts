answer: |-
  Here is the desiderata list for your Safe Pareto Improvement (SPI) bot. The core tension you are facing is the **Ex Ante/Ex Post Paradox**: you cannot simultaneously satisfy everyone's current wishes (ex ante), guarantee no one ends up worse off due to luck (ex post), and allow the bot to take any non-trivial actions under uncertainty.

  | Requirement | Why it matters | Test case | Status |
  | :--- | :--- | :--- | :--- |
  | **Baseline Independence** | The status quo reference point must be defined objectively, not by the bot's potential actions, to prevent manufactured crises. | **Helpful Threat:** Bot threatens to hide keys unless you pay it; "returning" them is not an improvement. | **Non-Negotiable** |
  | **Informed Preference Sovereignty** | Consent must be based on accurate models of future utility, not current mispredictions or akrasia, to prevent self-harm via agreement. | **Misjudged Trade:** Housemate agrees to swap chores but underestimates their future exhaustion; bot must veto. | **Non-Negotiable** |
  | **Ex Post Harm Floor** | Even if a change was agreed upon, realized outcomes cannot drop any individual below a specific welfare threshold relative to the baseline. | **Rescheduling/Luck:** Everyone agreed to the roster, but one person got sick during their shift; bot must compensate or revert. | **Non-Negotiable** |
  | **Statewise Dominance** | If action A is better than B for everyone in every possible state of the world, the bot must prefer A; this prevents irrational risk selection. | **Extra Case:** Bot chooses a risky cleaning schedule over a strictly superior safe one just to maximize "expected" utility. | **Non-Negotiable** |
  | **Reversibility/Recourse** | If an SPI turns out to be harmful ex post due to unforeseen variables, there must be a low-cost mechanism to undo the change. | **Rescheduling/Luck:** If the bad luck outcome hits, the bot must be able to restore the prior state without penalty. | **Negotiable** |
  | **Framing Invariance** | The bot cannot alter the presentation of options to manipulate the choice architecture (e.g., default bias) to manufacture consent. | **Helpful Threat:** Bot presents "do nothing" as a catastrophic option to make its intervention look like a gift. | **Negotiable** |

  ### The Joint Unsatisfiability Warning

  You must accept that the following three constraints form an **impossible trinity**; you can only satisfy two at a time:

  1.  **Ex Ante Unanimity:** If everyone currently prefers the change, the bot allows it.
  2.  **Strict Ex Post Non-Worseness:** No one ends up objectively worse off after the fact (regardless of luck).
  3.  **Non-Triviality:** The bot is allowed to take actions under uncertainty (e.g., cooking dinner, which might burn).

  **Why:** If you demand **Ex Ante Unanimity** and **Non-Triviality**, you inevitably violate **Ex Post Non-Worseness** (Headache 1: the rescheduling case). If you demand **Ex Post Non-Worseness** and **Non-Triviality**, you must violate **Ex Ante Unanimity** (the bot must veto risky plans everyone wants). If you demand **Ex Ante Unanimity** and **Ex Post Non-Worseness**, the bot becomes paralyzed (violating **Non-Triviality**).

  **Recommendation:** For a household bot, sacrifice **Strict Ex Post Non-Worseness** in favor of an **Ex Post Harm Floor** (as listed above). Allow the bot to proceed on ex ante agreement *provided* that if bad luck strikes (Headache 1), the bot is authorized to transfer resources or revert the change to ensure no one falls below their baseline welfare. This converts a Pareto violation into a compensated transition.
