answer: |-
  The ledger sat on the lectern like a slab of cold iron. Elara ran a finger over the embossed title: *The Shedding, Cycle Seven*. The room smelled of dry paper and lemon polish, the air conditioning humming a low, sterile note. Outside, the town of Oakhaven was preparing for the evening ceremony, bunting strung across the high street to celebrate a unity that felt, to Elara, like a held breath.

  Mr. Vale stood by the window, his hands clasped behind his back. He was the Keeper of the Archives, a man who had spent thirty years curating the town's silence.

  "It passed by a significant margin," Vale said, not turning around. "Seventy-four per cent. The highest in a decade."

  Elara opened the book. The pages were thick, creamy stock. Most were blank, save for the date and the single line of text that defined what was to be excised. She turned to the current year. *The Incident at Miller's Weir, 1974.* Below it, the signature of the town mayor, and beside that, the mark of the witness.

  "Nan's mark is a cross," Elara said, her voice flat. "She couldn't hold a pen."

  "She made the sign willingly," Vale replied, finally turning. His face was kind, which made it worse. "The council verified it. She is the last living witness. Her consent is the only legal requirement for the Shedding to proceed."

  "She doesn't know what she's consenting to. She asked me yesterday if my father was still at school."

  "Then she is free of it," Vale said softly. "That is the point, Elara. For fifty years, your grandmother carried the weight of that day. The negligence that drowned her brother. The lawsuits. The whispers in the market. She spoke of it constantly. Now, she speaks of the weather. Is it not a mercy to let the town match her peace?"

  "It's not peace. It's erosion." Elara slammed the book shut. The sound echoed like a gunshot in the small room. "You're voting to forget because it's uncomfortable for *you*. Not because it helps her."

  "We are voting to stop defining your family by your tragedy," Vale countered, stepping closer. "Every Remembrance Day, every history lesson, your name is attached to the Weir. 'The Miller Boy who Drowned.' 'The Miller Family who Sued.' We are trying to give you the dignity of being just residents of Oakhaven, not monuments to a mistake."

  "A mistake?" Elara laughed, a sharp, brittle sound. "You call it a mistake. We call it manslaughter. And now you want to vote it away? You say forgetting is care. I say it's a second drowning."

  "The ledger remains sealed," Vale said, tapping the book. "The truth isn't destroyed. It is merely... retired. Like a soldier."

  "Soldiers are honoured. This is being hidden." Elara grabbed her coat. "The rules say the witness must understand the weight of the silence. She doesn't understand anything anymore."

  "Then who speaks for her?" Vale asked. "You? Or the majority?"

  Elara didn't answer. She left the archive and walked to the care home on the edge of town. The sun was setting, casting long, bruised shadows across the pavement.

  Nan was in the communal lounge, staring at a television that wasn't turned on. She looked small in the orthopaedic chair, her hands knotted in her lap. When Elara sat beside her, Nan turned slowly, her eyes clouded with cataracts and time.

  "Ellie?" Nan whispered. "Is it time for tea?"

  "Soon, Nan."

  "Did you lock the gate?" Nan's voice tightened, a sudden spike of anxiety in the fog. "At the Weir? Your uncle... he shouldn't go near the water."

  Elara felt a lump rise in her throat. This was the fragment that remained. Not the lawsuit, not the settlement, but the gate. The specific failure of a latch.

  "It's locked, Nan," Elara said. "It's all locked."

  "Good," Nan sighed, her shoulders dropping. "Must be careful. People talk."

  "Does it hurt, Nan? Remembering?"

  Nan frowned, looking through Elara rather than at her. "Remembering what? I'm tired, Ellie. My head is so full of dust."

  Elara watched her for a long time. If Nan couldn't recall the pain, did the pain exist? If the town forgot the gate, would the water still be dangerous? Vale argued that keeping the memory alive pinned Nan to the moment of her greatest failure. But looking at her now, Elara wondered if the memory was the only thing holding Nan together. Without the guilt, who was she? Just a body in a chair, waiting for tea.

  Elara kissed her forehead. "I'll come back tomorrow."

  "Lock the gate," Nan murmured, already drifting back to the static on the screen.

  Elara walked home through the darkening streets. The bunting snapped in the wind. In the windows of the houses she passed, she saw families eating, laughing, living in the version of Oakhaven that had just been voted into existence. A version without the Weir. Without the Miller boy.

  Her brother, Toby, was in the kitchen. He was ten years old, too young to have voted, too young to know that the Shedding existed. The rules stated that children were not to be told anything had been removed. They were to inherit a clean slate, unburdened by the sins of their elders. He was building a tower out of sugar cubes, his tongue poking out in concentration.

  Elara stood in the doorway. She thought of Vale's argument: *Let them be free.* She thought of Nan's clouded eyes: *People talk.* She thought of the sealed ledger, locking the truth away in the dark, safe and suffocated.

  If she said nothing, Toby would grow up believing Oakhaven was perfect. He would walk past the Weir and see only water. He would never know why his great-aunt flinched at the sound of rushing water. He would be safe.

  But he would be alone in it.

  Elara pulled out the chair opposite him. The wood scraped loudly against the tile. Toby looked up, smiling.

  "Hi, El. Want to see my bridge?"

  "In a minute," Elara said. Her hands were shaking slightly. She reached across the table and covered his small hand with hers. The sugar cubes wobbled.

  "Toby," she said. "Do you know why the gate at the Weir is always locked?"

  Toby shrugged. "Because it's old?"

  "No." Elara took a breath. The air in the kitchen felt thick, resistant, as if the house itself wanted her to stop. "Because something happened there. Before you were born. Before I was born."

  Toby's smile faded. He sensed the shift in gravity. "What happened?"

  Elara looked at the sealed ledger in her mind's eye. She thought of the vote, the ceremony, the promise of silence. She thought of Nan, who could no longer remember enough to be hurt, and Vale, who thought he was helping.

  "Someone died," Elara said. Her voice was quiet, but it filled the room. "And the town decided we shouldn't talk about it. But I'm talking about it."

  Toby stared at her, the sugar cube forgotten in his fingers. "Why?"

  "Because someone has to," Elara said. "And because if I don't tell you, then it never happened at all."

  She watched his face, waiting for the confusion, the fear, or the burden to settle there. She was giving him a memory he wasn't meant to have, a wound he hadn't earned. She didn't know if it was an act of love or an act of cruelty. She only knew that the silence was too loud to bear.

  "Listen," she said, leaning in. "It started on a Tuesday, just like today..."
