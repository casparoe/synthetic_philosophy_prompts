answer: |-
  This is an excellent set of intuitions. You have effectively reconstructed the Nyāya causal theory of knowledge without reading the *Nyāyasūtra*. Your proposed principle ("whatever fixes the content") is very close to the Nyāya definition of a *pramāṇa* as the **instrumental cause** (*karaṇa*) of a valid cognition.

  However, your principle is missing one critical constraint that Nyāya insists on, and that missing constraint is the key to resolving your 8a/8b dilemma and your unease about memory.

  Here is the repair of your principle, the audit of your verdicts, and the solution to the individuation problem.

  ### 1. Repairing the Principle

  Your guess: *A pramāṇa is whatever fixes the content.*
  The Nyāya repair: *A pramāṇa is the instrumental cause of a **novel** (*anadhigata*) determinate cognition of reality.*

  You nailed the "fixes the content" part (the *karaṇa*). If the eyes see pixels but the speaker provides the truth, the speaker is the *pramāṇa* (Śabda). If the thermometer provides the truth directly, the instrument is the *pramāṇa* (Pratyakṣa).

  **The Missing Constraint: Novelty (*Anadhigata*)**
  Nyāya defines *pramā* (valid knowledge) as cognition that is both true and *new*. You cannot have a *pramāṇa* generate a *pramā* if you already know the proposition. This is why memory is not a *pramāṇa* (Case 10). It preserves knowledge; it does not generate *new* knowledge.

  This missing constraint is the only thing that explains why your verdicts on 8a and 8b feel unstable.

  ### 2. Auditing Your Verdicts

  Here is how the repaired principle ("Instrumental Cause + Novelty") handles your cases.

  *   **1 (Smoke/Fire):** **Anumana.** Correct. The invariable concomitance (*vyāpti*) is the operative instrument.
  *   **2 (Text Message):** **Śabda.** Correct. The pixels are the sense-contact; the reliable speaker is the instrument.
  *   **3 (Recognition):** **Pratyakṣa.** Your "grudgingly" is historically accurate. Nyāya treats recognition (*pratyabhijñā*) as a complex perception. Memory is a *causal condition* (*kāraṇa*), but not the *instrument* (*karaṇa*). The sense-contact with the present face is the *pramāṇa*.
  *   **4 (Bridge Sign):** **Śabda.** Correct. Written testimony is testimony.
  *   **5 (Absent Keys):** **Pratyakṣa.** You called this a "dodge," but Navya-Nyāya (the later school) explicitly codifies **Perception of Absence** (*abhāva-pratyakṣa*). You perceive the counter *as qualified by the absence of keys*. No inference needed. Early Nyāya might have called this inference, but your reluctance to add a fifth *pramāṇa* is correct; it fits under Perception.
  *   **6 (Thermometer):** **Pratyakṣa.** Your sliding verdict is the only error here.
      *   *Why:* A thermometer is an instrument of perception (like eyes, but artificial). Whether the calibrator was reliable is a background condition for the instrument's validity, not the *pramāṇa* itself. If the calibrator lied, the instrument is *defective*, not a *speaker*. It remains Perception, just *invalid* perception (*apramā*). It does not slide to Śabda unless you treat the number as a "statement" rather than a reading.
  *   **7 (Tapir/Upamāna):** **Upamāna.** Correct. This is the textbook case. Nyāya argues this is irreducible because the specific cognition "This animal is the referent of the word 'tapir'" arises from the *comparison* operation, not just the testimony (which gave the description) or perception (which gave the animal).
  *   **8a (Inference + Text):** **No new pramāṇa.** Correct. You already know "Fire." The text adds no novelty.
  *   **8b (Inference + Perception):** **Here is the crux.**
      *   *Strict Nyāya View:* If the proposition is identical ("There is fire"), this is **not** a new *pramā*. You already know it. Perception here functions as *confirmation*, not a new source of valid knowledge.
      *   *Your Intuition:* You feel it *is* new knowledge.
      *   *The Reconciliation:* Nyāya distinguishes the *object* from the *mode of presentation*. Inference gives "Fire qualified by smoke-relation." Perception gives "Fire qualified by visual-form." If you treat the content as strictly identical, 8b is not a new *pramā*. If you treat the sensory qualifiers as new content, it is.
      *   *Verdict:* Strictly speaking, **No new pramāṇa** regarding the proposition "Fire exists." But a new *cognition* with richer qualifiers.
  *   **9 (Tarka):** **Not a pramāṇa.** Correct. *Tarka* removes doubt but doesn't establish truth on its own.
  *   **10 (Memory):** **Not a pramāṇa.** Correct. Fails the novelty test.
  *   **11 (Overhear/Context):** **Anumana.** Nyāya rejects *Arthāpatti* (presumption) as a separate *pramāṇa* (unlike Mīmāṃsā). They subsume this under Inference. You infer "Anger" from the "Tone + Fragmentary Words."

  ### 3. The Individuation Question

  You asked: *What makes something one pramāṇa rather than a stack of others?*

  Nyāya's test for irreducibility is **Distinct Operational Mode (*Vyāpāra*)**.
  To reduce *X* to *Y*, the specific operation that generates the knowledge in *X* must be fully explainable by the operation in *Y*.

  *   **Why Upamāna (Case 7) isn't just Śabda + Pratyakṣa:**
      *   Śabda gives you: "The word 'tapir' refers to a pig-like thing."
      *   Pratyakṣa gives you: "This is a pig-like thing."
      *   Neither of those alone, nor their simple sum, gives you: "This thing *is* what the word 'tapir' refers to."
      *   The *operation* of comparing the memory of the description with the present perception (*sādṛśya-jñāna*) is unique. Therefore, *Upamāna* is irreducible.

  *   **Why Memory isn't a Pramāṇa:**
      *   Its operation is revival (*saṃskāra*), not contact with reality. It depends entirely on a previous *pramāṇa*. It has no independent grip on truth.

  *   **Why Tarka isn't a Pramāṇa:**
      *   Its operation is hypothetical reasoning (*if not P, then absurd Q*). It relies on a *pramāṇa* to establish the absurdity. It cannot establish *P* on its own.

  **Is the fourfold list exhaustive?**
  Nyāya claims yes. Mīmāṃsā says no (they add *Arthāpatti* and *Anupalabdhi*). Your Case 11 is the battleground. If you feel Case 11 is *sui generis*, you are leaning Mīmāṃsā. If you feel it's just "inference from context," you are Nyāya.

  ### 4. Solving the 8a/8b Dilemma

  You asked for the **smallest change** to flip the verdict on 8a/8b.

  **The Feature Doing the Work:** *Qualifiers (*Viśeṣaṇa*).*
  In Nyāya epistemology, knowledge is relational: "A qualified by B."
  *   Inference: "Fire (A) qualified by location-on-hill (B)."
  *   Testimony (8a): "Fire (A) qualified by location-on-hill (B)."
      *   *Result:* Content is identical. No new *pramā*.
  *   Perception (8b): "Fire (A) qualified by **red-flaming-visual-presence** (C)."
      *   *Result:* Content is technically distinct.

  **The Smallest Change to Flip 8a:**
  Change the text message to add a qualifier the inference didn't have.
  *   *Inference:* "There is fire."
  *   *Text:* "There is **electrical** fire."
  *   *Verdict:* Now the text is a new *pramāṇa* (Śabda) because it adds new content (*anadhigata*).

  **The Smallest Change to Flip 8b:**
  Make the perception strictly identical to the inference in terms of qualifiers.
  *   *Inference:* "There is fire."
  *   *Perception:* You walk in, but it's pitch black. You feel the heat.
  *   *Verdict:* If the heat only confirms "Fire exists" without adding visual qualifiers, Nyāya says this is **not** a new *pramā*. It is *niścaya* (certainty), not *pramā* (new knowledge).

  **Why your intuition struggles:**
  You are conflating *psychological confidence* with *epistemic novelty*. 8b feels like knowledge because it is vivid, but if the proposition is already settled, Nyāya says the *pramāṇa* is idle regarding truth-generation. It is only active regarding *experience*.

  ### 5. The New Test Cases

  Here is how the repaired account handles your three new scenarios:

  **(i) A dog who knows his owner is home from the smell.**
  *   **Verdict:** **Pratyakṣa (Perception).**
  *   **Reasoning:** Animals possess senses. Direct smell-contact with the owner's scent is sense-object contact. No inference is required unless the dog smells a *coat* and infers the *owner*. If the smell is of the owner directly, it is perception. Nyāya accepts animal cognition (*paśu-jñāna*), though they debate if it counts as *pramā* in the soteriological sense. Epistemically, it is perception.

  **(ii) Coming to know from a photograph that it rained last night.**
  *   **Verdict:** **Pratyakṣa + Anumana.**
  *   **Reasoning:** You perceive the photograph (Pratyakṣa). The photograph shows wet ground/puddles. You infer "It rained" from the wet ground (Anumana).
  *   *Alternative:* If you treat the photograph as a "record" or "statement" by the photographer, it could be Śabda. But Nyāya prefers the Inference model here: The photo is a mark (*liṅga*) of rain.

  **(iii) The same proposition learned by testimony from two people who both got it from one person.**
  *   **Verdict:** **Śabda (Single Instance).**
  *   **Reasoning:** The second testimony adds no *new* content (*anadhigata*). It is repetition. Furthermore, the *pramāṇa* is the original reliable source. The second speaker is just a conduit. If the first speaker was reliable, you already know it. If the first speaker was unreliable, the second speaker (getting it from the first) adds no validity.
  *   *Exception:* If the second speaker confirms a *detail* the first didn't mention, that detail is new Śabda.

  ### Summary of the "Rule"

  To state your rule formally in a way that survives Nyāya scrutiny:

  > **A *pramāṇa* is the distinct instrumental cause (*karaṇa*) that generates a determinate cognition of an object, provided that cognition is both true and novel (*anadhigata*) with respect to its specific qualifiers.**

  **Where your verdicts were messy:**
  1.  **Case 6 (Thermometer):** Don't slide to Śabda. It's Perception via instrument. Reliability is a condition for validity, not a change in source type.
  2.  **Case 8b (Seeing Fire):** Acknowledge that strictly, this is not a new *pramā* if the proposition is identical. The "newness" is in the sensory qualifiers, not the fact.
  3.  **Case 11 (Context):** Classify as Inference (*Anumana*). Nyāya rejects *Arthāpatti*.

  **The Individuation Test:**
  Ask: "Can the specific operation that produced this knowledge be fully described using the operations of the other *pramāṇas*?"
  *   If yes (e.g., Memory = past Perception), it's not a *pramāṇa*.
  *   If no (e.g., Upamāna = unique comparison of name/form), it is irreducible.

  You were sorting by "what fixes the content," which is the *karaṇa* theory. You just needed to add the "novelty" filter to stop memory and repetition from counting, and the "distinct operation" filter to stop *Upamāna* from collapsing into *Śabda*.
