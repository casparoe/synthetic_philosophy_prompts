prompt: |-
  I'm the director of program ops at a mid-sized regional workforce nonprofit, and over the next year every contract we have is moving to outcomes-based payment: we propose the numbers, the state agency has to approve them, and somewhere between 40 and 60 percent of our funding sits on top of them. So a few times a month I'm going to be sitting there with a proposed metric in front of me, about a day to think about it, a board that wants money at risk to look like confidence, and a program staff who will quietly reorganize their entire week around whatever I pick. I'd like a written procedure my team can run on each candidate metric before it goes into a contract.

  The problem I keep running into is that "watch out for gaming" is too vague to be useful, and the standard advice I've seen either collapses into "measure everything" (we can't — we can properly audit maybe two things a quarter, the rest we get self-reported) or into "just use judgment" (which is what got us here). I've started sorting failure modes myself and I think there are at least five different things going on: hitting the number by serving people we'd have served anyway; sorting who we serve so the easy cases are the ones who count; the ratchet, where a good year becomes next year's floor; collateral, where something nobody put a number on gets worse while the headline improves; and what I think of as plain decay, where the proxy just stops tracking the thing we cared about over a couple of years even though nobody is cheating. I'd like you to clean that taxonomy up, throw away the parts that don't earn their keep, and add whatever's missing.

  What I actually need:

  - the questions in the order to ask them, and what counts as a real answer to each one rather than a shrug
  - where the procedure just stops with a no, and where it has to hand the question to a person because it's a values call and not a factual one
  - a distinction between metrics that are safe to put money on and metrics that are fine to report but must never carry payment — and what to do when the funder insists that at least three of the payment metrics be ours and at least half the money be at risk, so "use none of them" isn't available
  - a one-page version, plus a one-sentence plain-English "why this step" line under each question, because I have to defend the whole thing to a board member who will ask why we're making this so complicated
  - an honest note on which steps are judgment calls wearing a lab coat, and what the procedure deliberately doesn't try to do

  Then run the whole thing on three candidates: share of participants still employed 90 days after exit; median hourly wage at placement; and number of participants who complete a credential. That last one is the funder's favorite and my staff's favorite, and I have a bad feeling about it, so if the procedure says it can't carry money, say so plainly. And tell me what I'm supposed to do mid-contract when a metric that passed the procedure starts to look wrong, since nothing we sign is shorter than three years.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Director of Program Ops at a mid-sized regional workforce nonprofit.
      *   **Situation:** Moving to outcomes-based payment (OBC) contracts. 40-60% of funding at risk.
      *   **Constraints:** Limited audit capacity (2 deep dives/quarter, rest self-reported). Board wants risk to look like confidence. Staff behavior changes based on metrics. Funder insists on specific constraints (3 metrics, 50% risk).
      *   **Problem:** Existing advice ("watch for gaming," "measure everything," "use judgment") is useless.
      *   **User's Insight:** Has identified 5 failure modes (creaming, substitution, ratchet, collateral damage, proxy decay). Wants this taxonomy refined.
      *   **Deliverables:**
          1.  Refined taxonomy of failure modes.
          2.  Step-by-step procedure (questions, order, valid answers).
          3.  Stop/Hand-off points (factual vs. values).
          4.  Classification: Safe for Payment vs. Safe for Reporting Only.
          5.  Strategy for Funder Constraints (when "none" isn't an option).
          6.  One-page version + "Why this step" lines (for the Board).
          7.  Honest note on limitations (judgment calls in lab coats).
          8.  Stress test: Run the procedure on 3 specific metrics (90-day employment, median wage, credential completion).
          9.  Mid-contract correction protocol.

  2.  **Refine the Taxonomy (The "Failure Modes"):**
      *   *User's List:*
          1.  Serving people we'd have served anyway (Deadweight/Substitution).
          2.  Sorting who we serve (Creaming/Parking).
          3.  Ratchet (Good year = next year's floor).
          4.  Collateral (Unmeasured stuff gets worse).
          5.  Decay (Proxy stops tracking reality).
      *   *Critique:* These are solid. "Serving people we'd have served anyway" is technically "Deadweight" in evaluation literature. "Sorting" is "Creaming" (easy cases) and "Parking" (hard cases ignored). "Ratchet" is a contract design issue, not just a metric issue, but relevant. "Collateral" is "Tunnel Vision" or "Measure Fixation." "Decay" is "Indicator Drift."
      *   *Refinement:* Keep it practical for ops, not academic.
          1.  **Deadweight:** Would this have happened without us?
          2.  **Creaming/Parking:** Are we selecting clients to hit the number?
          3.  **Tunnel Vision:** Are we ignoring unmeasured important outcomes?
          4.  **Indicator Drift:** Does the number stop meaning what it meant?
          5.  **Threshold Distortion:** (Added) Are we stopping work *just* after the metric is hit? (e.g., employed day 91, not day 89).
      *   *Decision:* Stick close to the user's intuition but sharpen the definitions for the checklist.

  3.  **Develop the Procedure (The "Gatekeeper"):**
      *   Needs to be sequential.
      *   Needs clear "Pass/Fail/Hand-off" criteria.
      *   *Step 1: Definition.* Is it unambiguous?
      *   *Step 2: Control.* Can we actually influence it?
      *   *Step 3: Gaming Risk.* (The User's taxonomy).
      *   *Step 4: Cost of Verification.* Can we audit it?
      *   *Step 5: Values Check.* Is this what we actually care about?
      *   *Differentiation:* Payment-Ready vs. Reporting-Only. Payment-Ready needs low gaming risk + high auditability. Reporting-Only can be higher risk/softer.
      *   *Funder Constraints:* If a metric fails payment but funder wants it, propose a "hybrid" (base payment + bonus) or pair it with a "guardrail metric" (e.g., credential completion + wage floor).

  4.  **Drafting the Content - Section by Section:**

      *   **Taxonomy:** Clean up the user's 5 points. Make them actionable.
      *   **The Procedure:** 5 Gates.
          *   Gate 1: Clarity (Can two people calculate this differently?)
          *   Gate 2: Attribution (Did we cause it?)
          *   Gate 3: Gaming (The 5 failure modes).
          *   Gate 4: Verification (Can we catch lies?)
          *   Gate 5: Values (Should we do this?)
      *   **Stop/Hand-off:** Factual stops at Verification. Values hand-off at Gate 5.
      *   **Payment vs. Reporting:** Criteria for each.
      *   **Funder Constraints:** The "Mitigation Strategy" (Guardrails, Caps, Blends).
      *   **One-Pager:** Condense the 5 Gates + "Why."
      *   **Limitations:** Acknowledge that this reduces risk, doesn't eliminate it.
      *   **Stress Test:** Apply to the 3 metrics.
          *   *90-day Employment:* High gaming risk (cream easy employable), verification hard (self-report). *Verdict: Reporting only, or with strict audit.*
          *   *Median Wage:* High gaming risk (serve high earners only), good outcome. *Verdict: Payment OK if baseline established.*
          *   *Credential Completion:* Funder/Staff favorite. High risk of "credential mill" (easy certs, no value). *Verdict: DO NOT PUT PAYMENT ON THIS ALONE.* Needs wage guardrail.
      *   **Mid-Contract:** "Circuit Breaker" clause. Renegotiation trigger.

  5.  **Refining the Tone:**
      *   Professional, direct, operational.
      *   Respectful of the user's expertise (they know the field).
      *   No fluff.
      *   Acknowledge the political reality (Board, Funder).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "one-sentence plain English" requirement? *Yes, need to ensure that's distinct.*
      *   *Check:* Did I address the "3 metrics/50% risk" constraint? *Yes, in the mitigation section.*
      *   *Check:* Is the Credential Completion verdict strong enough? *User has a bad feeling. I need to validate that feeling with the procedure.*
      *   *Check:* Is the taxonomy cleaned up? *Yes, renamed for precision.*
      *   *Check:* Mid-contract fix? *Need a specific mechanism, not just "talk to them."*

  7.  **Final Polish:**
      *   Ensure the distinction between "Stop" (Kill the metric) and "Hand-off" (Board/Executive decision) is clear.
      *   Make sure the "One-Pager" looks like a handout.
      *   Ensure the stress test results are definitive.

  8.  *(Self-Correction on Taxonomy)*: The user asked to "throw away parts that don't earn their keep."
      *   *Ratchet:* This is a contract negotiation issue, not a metric selection issue. I should move this to the "Contract Design" phase, not the "Metric Selection" phase. It doesn't help decide *which* metric, only *what target*. I will note this but exclude it from the core metric checklist to keep it sharp.
      *   *Deadweight:* Crucial.
      *   *Creaming:* Crucial.
      *   *Collateral:* Crucial.
      *   *Decay:* Crucial.
      *   *Add:* "Threshold Cliff" (stopping work once the number is hit).

  9.  *(Final Plan)*:
      *   Part 1: Refined Taxonomy (The "Pathologies").
      *   Part 2: The Procedure (The 5 Gates).
      *   Part 3: Payment vs. Reporting & Funder Constraints.
      *   Part 4: One-Pager.
      *   Part 5: Limitations Note.
      *   Part 6: Stress Test (3 Metrics).
      *   Part 7: Mid-Contract Protocol.

  Let's write it.cw
answer: |-
  Here is the operational procedure, refined taxonomy, and stress test you requested.

  ### Part 1: Refined Taxonomy of Failure Modes
  You identified five. I am cutting "The Ratchet." That is a *target-setting* problem, not a *metric-selection* problem. It belongs in contract negotiation, not metric vetting. I am adding one critical mode you missed: **The Threshold Cliff.**

  1.  **Deadweight (Substitution):** We get paid for outcomes that would have happened without us.
      *   *Test:* If we closed tomorrow, would this participant still achieve this outcome?
  2.  **Creaming & Parking (Selection Bias):** We change *who* we serve to make the number easier to hit.
      *   *Test:* Does this metric incentivize rejecting hard-to-serve clients or ignoring those who need the most help?
  3.  **Tunnel Vision (Collateral Damage):** We improve the metric by degrading unmeasured outcomes.
      *   *Test:* Can we hit this number while making the participant's long-term life worse?
  4.  **The Threshold Cliff:** We stop working the moment the metric is achieved.
      *   *Test:* Is there a disincentive to support the participant *after* the measurement point (e.g., employed day 89 vs. day 91)?
  5.  **Indicator Drift (Decay):** The proxy stops correlating with the goal over time.
      *   *Test:* Will this specific credential/job type still hold value in 3 years, or will the market saturate/devalue it?

  ---

  ### Part 2: The Metric Vetting Procedure (The "Five Gates")
  Run every candidate metric through these gates in order. If it fails a gate, it stops unless a specific override is triggered.

  **Gate 1: The Ambiguity Test**
  *   **Question:** Can two different staff members calculate this number for the same participant and get different results?
  *   **Real Answer:** A written calculation rule that yields a single integer.
  *   **Shrug:** "It depends on the case manager's notes."
  *   **Action:** **STOP.** Do not proceed. Ambiguity creates audit disputes, not performance.

  **Gate 2: The Attribution Test**
  *   **Question:** Is there a plausible path between our specific intervention and this outcome that excludes external economic forces?
  *   **Real Answer:** "We provide training X which is required for License Y."
  *   **Shrug:** "The economy is picking up."
  *   **Action:** **STOP.** If the macro-economy drives the number more than your program does, you are betting on the Fed, not your ops.

  **Gate 3: The Pathology Scan**
  *   **Question:** Which of the 5 Failure Modes applies here, and can we mitigate it with data?
  *   **Real Answer:** "Creaming is a risk, so we will track denial rates by barrier-to-employment."
  *   **Shrug:** "Our staff are ethical."
  *   **Action:** **HAND-OFF.** If high risk exists, this moves to the Executive Director/Board for risk acceptance. Ops cannot sign off on ethical hazards.

  **Gate 4: The Verification Cost**
  *   **Question:** Can we verify this outcome for 10% of cases without spending more than 5% of the program budget?
  *   **Real Answer:** "We can match SSNs to state wage records automatically."
  *   **Shrug:** "We'll call the participants." (Response rates <60% make this invalid).
  *   **Action:** **STOP.** If you can't audit it, you can't put payment on it.

  **Gate 5: The Values Check**
  *   **Question:** If we maximize this number at the expense of everything else, are we still a nonprofit?
  *   **Real Answer:** "Yes, because higher wages align with our mission."
  *   **Shrug:** "The funder wants it."
  *   **Action:** **HAND-OFF.** This is a Board-level mission decision, not an Ops decision.

  ---

  ### Part 3: Payment vs. Reporting & Funder Constraints

  **Classification:**
  *   **Payment-Ready:** Passes all 5 Gates. Low ambiguity, high attribution, low gaming risk, cheap to audit.
  *   **Reporting-Only:** Fails Gate 3 (High Gaming) or Gate 4 (Hard to Audit). Useful for strategy, dangerous for cash flow.

  **The "Funder Insists" Protocol:**
  When the funder demands a metric that is **Reporting-Only** be moved to **Payment-Ready** (to meet the 50% risk / 3 metric requirement):
  1.  **The Guardrail:** Pair the risky metric with a counter-metric. (e.g., If paying on *Credentials*, also pay on *Post-Credential Wages*).
  2.  **The Cap:** Limit the liability. (e.g., "We accept payment on this metric, but capped at 15% of total contract value, not the pro-rated share.")
  3.  **The Reopener:** Insert a clause allowing metric renegotiation if external validity drops below a threshold (e.g., if credential market value drops).

  ---

  ### Part 4: The One-Pager (For the Board)

  **Metric Vetting Checklist**
  *Use this to approve any metric carrying financial risk.*

  1.  **Clarity:** Can two people calculate this differently?
      *   *Why:* Ambiguity creates contract disputes, not performance.
  2.  **Control:** Did our program cause this result, or did the economy?
      *   *Why:* We cannot bet our budget on the Federal Reserve.
  3.  **Gaming:** Does this number reward us for turning away hard-to-serve clients?
      *   *Why:* We must not sacrifice our mission to balance the books.
  4.  **Audit:** Can we prove this happened without calling every participant?
      *   *Why:* Self-reported data cannot carry financial risk.
  5.  **Mission:** If we hit this number but fail everywhere else, are we still doing good?
      *   *Why:* Financial survival cannot require mission drift.

  **Decision Logic:**
  *   **Fail Q1, Q2, or Q4:** Reject Metric.
  *   **Fail Q3:** Executive Director must sign risk waiver.
  *   **Fail Q5:** Board must sign risk waiver.

  ---

  ### Part 5: Limitations Note (The "Lab Coat" Warning)
  This procedure reduces *observable* risk; it does not eliminate *systemic* risk.
  *   **Judgment Calls:** Gate 3 (Gaming) and Gate 5 (Mission) are ethical judgments disguised as operational checks. The procedure forces them into the light, but it cannot answer them for you.
  *   **What this doesn't do:** It does not protect you from a funder changing the rules mid-stream, nor does it protect you from a recession. It only protects you from signing a contract that incentivizes your own staff to act against your mission.

  ---

  ### Part 6: Stress Test (Running the 3 Candidates)

  #### 1. Share of participants still employed 90 days after exit
  *   **Gate 1 (Clarity):** **PASS.** Date of exit + 90 days + employment status.
  *   **Gate 2 (Attribution):** **FAIL.** In a tight labor market, low-barrier participants find jobs without you. High Deadweight risk.
  *   **Gate 3 (Gaming):** **FAIL.** High Creaming risk. Staff will avoid participants with criminal records or gaps in employment. High Threshold Cliff risk (support stops day 90).
  *   **Gate 4 (Audit):** **FAIL.** Self-report is unreliable. Wage record matching has a lag and misses gig/cash work.
  *   **Verdict:** **REPORTING ONLY.**
  *   **Mitigation:** If Funder insists on payment, change to "Employed 90 days AND 180 days" to reduce cliff, and demand wage record access for audit.

  #### 2. Median hourly wage at placement
  *   **Gate 1 (Clarity):** **PASS.** Pay stub data.
  *   **Gate 2 (Attribution):** **PASS.** Training directly correlates to higher skill/wage tiers.
  *   **Gate 3 (Gaming):** **RISK.** Creaming risk (serve only those with prior experience). Tunnel Vision risk (ignore job benefits/stability for higher hourly rate).
  *   **Gate 4 (Audit):** **PASS.** Pay stubs are auditable.
  *   **Verdict:** **PAYMENT-READY (with Guardrail).**
  *   **Mitigation:** Pair with a "Placement Rate" floor to prevent staff from only serving the top 10% of candidates.

  #### 3. Number of participants who complete a credential (Funder/Staff Favorite)
  *   **Gate 1 (Clarity):** **PASS.** Certificate issued.
  *   **Gate 2 (Attribution):** **PASS.** You control the training.
  *   **Gate 3 (Gaming):** **CRITICAL FAIL.** High Tunnel Vision. Staff will push "easy" credentials that have no labor market value just to hit the number. High Indicator Drift (credential devalues in 2 years).
  *   **Gate 4 (Audit):** **PASS.** Certificates are easy to verify.
  *   **Verdict:** **NEVER PAY ON THIS ALONE.**
  *   **Why:** This is the classic "credential mill" trap. You will fill your classes, hand out certs, and participants will remain unemployed.
  *   **Mitigation:** This metric can carry payment *only* if paired with a **Wage or Employment Guardrail**. Example: "Payment triggered on Credential Completion *only if* participant is employed within 6 months at $X/hr." If the funder refuses the guardrail, you must push back hard. This metric alone incentivizes fraud against the participant.

  ---

  ### Part 7: Mid-Contract Correction Protocol
  *Nothing is shorter than three years. Things will break.*

  **The "Circuit Breaker" Clause**
  When drafting the contract, insert a **Validity Review** trigger.
  *   **Trigger:** If external data (e.g., Bureau of Labor Statistics, local wage surveys) shows the metric's correlation to long-term stability drops by >15% OR if audit discrepancies exceed 5%.
  *   **Action:** This triggers a mandatory 30-day renegotiation window.
  *   **Leverage:** Frame this to the funder as *their* risk protection. "You don't want to pay for outcomes that don't represent real success in Year 3. This clause ensures your money keeps buying real impact."

  **Internal Stop-Work Order**
  If a metric passes the procedure but behavior shifts negatively (e.g., staff report increased pressure to deny hard cases):
  1.  **Ops Director Authority:** You have the authority to suspend the *internal* bonus/incentive tied to that metric immediately.
  2.  **Notification:** Notify the Executive Director. Do not notify the funder yet.
  3.  **Remediation:** If behavior doesn't correct in 30 days, the metric is flagged for the next "Validity Review" negotiation as "requiring adjustment."

  **Summary Advice:**
  Your bad feeling about **Credential Completion** is correct. It is the easiest metric to game and the easiest to decouple from actual human welfare. Do not let it carry more than 20% of the at-risk funding, and only then if tied to an employment outcome. Fight for **Median Wage** as your primary payment driver; it aligns money, mission, and participant welfare better than the others.
