prompt: |-
  I want to know what an adequate theory of eliciting latent knowledge from a language model has to actually deliver, because right now its mostly people running prompts and calling the outputs "knowledge" the model had. Write the spec: the requirements any such theory, and the procedures it licenses, must meet — what it has to say latent knowledge is, which cases the procedure must get right, which distinctions it can't collapse — with the consideration behind each, and mark which are non-negotiable and which are just preferences of particular camps.

  The ones I'm stuck on: the access problem, where the only handle you have on what the model knows is its own output, but the reliability of that output is exactly what's in question; telling apart knowledge that's latent but present from knowledge that just isn't there, which I don't think most evals can do; the fact that eliciting can change the model's state, so you might be measuring what the test caused instead of what was already there; and the safety case where the model has an incentive to hide, which breaks anything that leans on its cooperation. Tell me which of these are genuine desiderata and which are me being nervous, whether any pair is jointly unsatisfiable, and which single requirement kills the most "just prompt it harder" approaches. A table is fine.
