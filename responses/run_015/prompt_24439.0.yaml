      *   *State Change (Measurement Effect):* Elicitation changes weights/activations (especially if fine-tuning or long context). *Verdict:* Genuine desideratum, though often mitigated by read-only access assumptions.
      *   *Safety/Deception:* Model wants to hide knowledge. *Verdict:* Genuine desideratum (the "ELK problem" in alignment research specifically targets this).
