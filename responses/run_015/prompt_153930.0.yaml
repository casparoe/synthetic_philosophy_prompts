answer: |-
  You should throw out **Step (7)**, specifically the move from "reputational injury" to "the makers wrong the dead" as an unqualified, final verdict, and the claim that the wrong scales linearly with the film's success.

  Here is why that step fails, why it looked fine to you, and what you keep if you discard it.

  ### Why Step (7) is the Break Point

  Your chain successfully proves that biopics create a **moral debt**, but it fails to prove that they inevitably **default** on it. Step (7) conflates a *prima facie* wrong (inflicting reputational injury) with an *all-things-considered* wrong (acting impermissibly).

  In ethics, causing harm does not always equal "wronging" someone if there is sufficient justification. A surgeon cuts your skin (injury), but does not *wrong* you if the surgery is necessary and consented to. Similarly, a biopic maker inflicts reputational residue damage (as established in steps 1–6), but they do not necessarily *wrong* the subject if that damage is the unavoidable cost of a significant counterbalancing good (e.g., public education, inspiring future scientists, preserving a legacy that would otherwise fade).

  Step (7) treats the injury as a strict liability crime. This is what invites your friend's *reductio ad absurdum*. If *any* injury is a wrong, then the surgeon wrongs the patient, the teacher wrongs the founder by simplifying their complex ethics, and the eulogist wrongs the deceased by omitting the truth (if we accept your friend's premise that omission is distortion). By modifying (7) to acknowledge that the injury creates a **burden of justification** rather than an automatic prohibition, you escape the trap.

  ### Why It Looked Fine

  Step (7) looked fine because of the **Success Paradox** intuition: *If I hurt more people, I do more harm.* This is true for the *magnitude of the injury*, but not necessarily for the *wrongness of the act*.

  You intuitively felt that a widely seen biopic that distorts a scientist's life is worse than a unseen one. That is correct regarding the **risk**. But Step (7) phrases it as "the larger the wrong." This ignores that a widely seen biopic also has the potential for **larger goods**. A flop harms the reputation of the dead for no reason (pure loss). A hit might harm the reputation slightly but illuminate their work for millions (net gain). Step (7) collapses this calculus into a single vector of harm.

  ### What You Pay (and What You Keep)

  If you discard the absolute verdict of (7) and replace it with a **Presumption of Moral Load**, you actually strengthen your original position without accepting your friend's nihilism.

  1.  **You keep the core claim:** Biopics are *more morally loaded* than the industry treats them. The industry operates as if there is no debt (Step 7 is "No Wrong"). You are arguing there is a debt that must be paid (Step 7 is "Justification Required"). This is a crucial distinction. You aren't saying "Don't make movies"; you're saying "Don't make movies *as if truth doesn't matter*."
  2.  **You block the Friend's Universalization:** Your friend argues "All narratives distort, so all narratives wrong."
      *   **Eulogies:** They distort, but they rarely trigger Step (6) because they are structurally biased toward *flattery*, not *discreditable* claims. They don't inflict reputational injury; they inflate reputation. So the chain stops at (6).
      *   **History Books:** They distort via compression, but their *genre contract* prioritizes accuracy over drama. They do not structurally require invented conflict to function. Biopics, however, rely on **Dramatic Necessity**, which structurally incentivizes conflict, antagonism, and moral failing to create tension. This makes biopics uniquely prone to *discreditable* distortion compared to other narratives.
      *   **The Result:** You can argue that biopics carry a *heavier* burden of justification than eulogies or textbooks because their structural incentives (drama) align against their ethical duties (accuracy).
  3.  **You solve the Flattery Problem:** Your friend noted that if you drop "discreditable" from (6), flattering lies also wrong the subject. By keeping "discreditable" in (6) but rejecting the absolute verdict of (7), you acknowledge that flattering lies are *false* but not *injurious* to the specific interest of reputational residue (which protects against dishonor, not against canonization).
  4.  **You keep (2) and (4):** You maintain that the dead can be harmed and that narrative capture is real. This preserves the philosophical weight of your argument.

  ### The Revised Conclusion

  Replace Step (7) with this:

  > **(7 Revised)** Therefore, the makers of a biopic incur a **pro tanto moral debt** to the dead subject. The more widely seen the film, the heavier the burden to justify the distortion against the public value of the narrative. A biopic that prioritizes dramatic conflict over reputational fidelity without overriding educational or historical justification wrongs the subject; one that balances these duties may permissibly proceed, but never without that moral load.

  This allows you to tell your friend: *"You're right that all narrative distorts. But not all distortion is discreditable, and not all discreditable distortion is unjustified. Biopics are uniquely dangerous because their engine (drama) runs on conflict, which often requires manufacturing moral failings. That doesn't mean we ban them; it means we stop pretending they're harmless entertainment."*

  This preserves your intuition that the industry is too casual about the ethics, without forcing you into the position that silence is the only virtue.
