  4.  **Diagnose the Core Conflict:**
      *   **Jaspers' Framework:** Jaspers explicitly argued that *political guilt* involves liability for the state's actions because citizens allow the state to exist. He argued this *does* survive in the sense that the new state (or continuing state) owes reparations, paid by citizens. However, he distinguished this sharply from *moral* guilt (conscience) and *metaphysical* guilt (solidarity as humans).
