answer: |-
  The Swiss requirement for a "double majority" (*Volksmehr* and *Ständemehr*) to amend the Federal Constitution is not merely a procedural hurdle; it is the institutional crystallization of a specific political ontology. It presupposes a conception of sovereignty that is fundamentally **compound** rather than unitary. By demanding that constitutional change secure both the will of the numerical majority of citizens and the majority of the federal states (cantons), the Swiss system rejects the Jacobin notion of "one and indivisible" popular sovereignty. Instead, it operationalizes a theory of **dual constituent power**: the Swiss polity is constituted simultaneously by the sum of its individual citizens and the sum of its historic territorial communities.

  ### The Conception of Democratic Equality: Arithmetic vs. Federal

  Philosophically, this design rests on a distinction between two types of democratic equality. The national popular majority (*Volksmehr*) honors the liberal principle of **arithmetic equality**, where every individual counts for one and none for more than one. This treats Switzerland as a unitary *demos*. However, the cantonal majority (*Ständemehr*) honors the federal principle of **political equality among constituent units**, where the sovereign entities that formed the federation retain equal standing regardless of demographic size. This treats Switzerland as a federation of corporate bodies.

  Consequently, the system does not treat the Swiss polity as exclusively one or the other, but as **both at once**. It posits that the "Swiss People" does not exist as a homogeneous mass, but rather as a pluralistic entity composed of distinct political communities (the cantons) that retain a residual sovereignty. In this view, democratic legitimacy is not derived solely from the aggregate will of individuals, but from the concurrent consent of the people *and* the states. This aligns with the historical genesis of the Swiss Confederation, which evolved from a treaty alliance of sovereign valleys and cities (*Staatenbund*) into a federal state (*Bundesstaat*) without fully erasing the sovereign status of the members.

  ### The Implicit Theory of Representation: The Dual Capacity of the Voter

  To reconstruct the theory of representation that renders coherent the counting of the same electorate in two "incompatible" ways, we must attribute a **dual legal capacity** to the voter. When a Swiss citizen casts a ballot on a constitutional amendment, they are not acting in a single role.

  1.  **As a Subject of the Law:** In the *Volksmehr*, the voter acts as an individual bound by the supreme law. Here, the question is one of individual liberty and rights; thus, every individual's assent must carry equal weight.
  2.  **As a Member of a Constituent State:** In the *Ständemehr*, the voter acts as a proxy for their canton's sovereignty. Here, the question is one of federal balance and the preservation of the compact. A voter in Uri is not merely an individual; they are a stakeholder in a corporate entity that possesses equal standing to the Canton of Zurich.

  This theory resolves the apparent incompatibility by suggesting that the *object* of the vote is dual in nature. The Constitution is both a charter of individual rights and a treaty of association among states. Therefore, the aggregation of votes must reflect both dimensions. The "inequality" of vote weight in the cantonal tally is not a bug but a feature designed to prevent the demographic hegemony of a few urban centers from overriding the structural integrity of the federation. It is a mechanism of **mutual veto**, ensuring that no constitutional change can occur unless it bridges the cleavage between the urban and the rural, the populous and the sparse.

  ### Reconciliation with Liberal-Constitutionalism

  The prompt asks whether this theory reconciles with the liberal-constitutionalist view that safeguards exist to restrain majoritarian power, particularly when citizens themselves initiate change. Standard liberal constitutionalism typically posits a constitution as a shield *against* the majority (often via a court or rigid amendment process) to protect minority rights. The Swiss system adds a layer of complexity: it allows the majority (via the 100,000-signature initiative) to *propose* the sword, but requires a super-majority structure to *wield* it.

  This can be reconciled with liberal constitutionalism if one expands the definition of "liberty" beyond individual rights to include **structural liberty**. In this view, the *Ständemehr* is a pre-commitment device that restrains the "national majority" from tyrannizing the "regional minorities." It acknowledges that a simple national majority can be as despotic as a monarch if it ignores the federal diversity of the land.

  However, a tension remains. In classic liberal theory, the "people" are the ultimate sovereign. By allowing a minority of voters (those in small cantons) to veto the will of the national majority, the Swiss system effectively fragments the sovereign. It reconciles this by arguing that **sovereignty is not absolute**. The "People" cannot act unilaterally because the "People" are federally constituted. Thus, the safeguard is not just against a tyrannical government, but against a tyrannical *demos*. It prioritizes **consensus democracy** over **majoritarian democracy**, positing that stability and legitimacy in a heterogeneous society require broader agreement than a simple 50% + 1 threshold.

  ### The Counterfactual: A Shift to Strict Individualism

  If the underlying account of sovereignty were replaced by a strictly individualist, uniform one-person-one-vote principle, the institutional architecture of the Swiss system would require radical dismantling. The philosophical shift from "compound sovereignty" to "unitary popular sovereignty" would necessitate the following changes:

  1.  **Abolition of the *Ständemehr*:** The requirement for a majority of cantons would be eliminated. Constitutional amendments would pass solely based on the national popular vote. This would fundamentally alter the power dynamic, rendering the concerns of rural, conservative cantons (like Uri or Appenzell Innerrhoden) politically negligible against the urban axis of Zurich-Bern-Geneva-Lausanne.
  2.  **Redesign or Abolition of the Council of States (*Ständerat*):** The Swiss upper house mirrors the constitutional amendment logic: each canton sends two representatives regardless of population. Under a strict individualist principle, this chamber would lose its democratic legitimacy. It would either need to be abolished (moving to a unicameral system) or reapportioned by population (becoming a duplicate of the National Council), effectively ending bicameralism as a tool of federal representation.
  3.  **Reconfiguration of Fiscal Federalism:** The political leverage of small cantons currently protects their financial interests in the national equalization scheme. Without the *Ständemehr*, the fiscal constitution would likely shift toward greater centralization and redistribution, as the small cantons would lose the veto power they use to negotiate subsidies and tax autonomy.
  4.  **Erosion of Cantonal Autonomy:** Finally, the substantive scope of cantonal power would likely shrink. The double majority acts as a jurisdictional boundary marker; without it, the federal government would face fewer hurdles in centralizing competencies (e.g., in education, health, or policing), transforming the cantons from semi-sovereign states into mere administrative districts.

  ### Conclusion

  The Swiss double-majority system presupposes a **federal-republican conception of sovereignty** that views the polity as a union of peoples rather than a mass of individuals. It treats the electorate as possessing a dual capacity, reconciling the tension between individual equality and state equality by demanding that constitutional legitimacy flow from both sources simultaneously. While this creates a "democratic deficit" in arithmetic terms, it is justified within the system as a necessary safeguard for federal liberty and social peace. To replace this with a strict one-person-one-vote principle would not be a mere technical adjustment; it would be a regime change, transforming Switzerland from a compound federation into a unitary state, prioritizing the efficiency of the national will over the preservation of its constituent diversity.
