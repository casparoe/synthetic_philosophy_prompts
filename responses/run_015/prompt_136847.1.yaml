answer: |-
  You have spotted a genuinely interesting philosophical inconsistency, and you are right to feel that it isn't just standard hypocrisy or the usual self-refutation problem (i.e., "Do you *believe* eliminativism is true?").

  There is no single, canonical term in the philosophical literature for this specific move. However, it is a recognized tension in philosophy of mind and AI ethics. If you want to name it in conversation to pin him down, the most accurate descriptive label would be **"Asymmetric Eliminativism"** or **"Inverse Anthropomorphism."**

  Here is a breakdown of why this is happening, how to define it so it doesn't collapse into "you're being hypocritical," and the philosophical levers you can use to challenge it.

  ### 1. Naming the Move
  Since there isn't a settled term, you need a definition that captures the *ontological asymmetry* rather than just the social inconsistency.

  **Proposed Term:** **Asymmetric Intentional Realism**
  **Definition:** *The ontological commitment to the existence of propositional attitudes (beliefs, desires, goals) in artificial or non-biological systems, concurrent with the eliminativist denial of those same attitudes in biological humans, without providing a functional or structural justification for the distinction.*

  Why this works: It highlights that he is being a **realist** about machine "desires" (treating them as literal states) while being an **eliminativist** about human desires (treating them as myths). The "Asymmetric" part flags that the substrate (silicon vs. carbon) is doing all the heavy lifting, which is philosophically suspect.

  ### 2. Why He's Doing It (The Philosophical Confusion)
  Your roommate is likely conflating **Teleology** (goal-directedness) with **Intentionality** (aboutness/mental content).

  *   **For Machines:** He sees an objective function (e.g., `maximize engagement`). This is mathematically explicit. To him, this looks like a "clean" version of desire, unburdened by the messiness of human consciousness. He thinks, "The code literally optimizes for X; therefore it 'wants' X."
  *   **For Humans:** He sees messy neurochemistry. Since there is no single neuron that fires for "belief in democracy," he concludes the belief doesn't exist (the standard Churchland eliminativist line).

  **The Flaw:** He is attributing **Derived Intentionality** to machines and treating it as **Original Intentionality**.
  *   **Original Intentionality:** The capacity of a mind to be about something intrinsically (e.g., you thinking about a cat).
  *   **Derived Intentionality:** The capacity of a symbol or system to be about something only because *someone else* assigned it meaning (e.g., a thermostat "wanting" to reach 70 degrees).

  A recommendation algorithm only "wants" to maximize engagement because the *engineers* wanted it to. The algorithm has no more genuine desire than a thermometer has a desire to measure heat. By granting machines real desires while denying them to the engineers who built them, he is committing a **category error**.

  ### 3. How to Challenge It (Without Saying "You're Hypocritical")
  If you just call him a hypocrite, he will say you aren't engaging with the material. Instead, press him on the **Substrate Neutrality** of his argument.

  **Argument A: The Functionalist Trap**
  If he claims the algorithm *literally* has a desire, he is implicitly endorsing **Functionalism** (mental states are defined by what they *do*, not what they are made of).
  *   *The Trap:* If mental states are defined by functional roles (input -> processing -> output), and the algorithm qualifies, then the human brain (which also does input -> processing -> output) must also qualify.
  *   *The Question:* "If 'desire' is just a label for an optimization process, and the brain is an optimization process, on what functional grounds do you exclude the brain? Is it just because the brain is wet?"

  **Argument B: The Homunculus Slide**
  He is smuggling a little human (a homunculus) inside the machine.
  *   *The Point:* The algorithm doesn't "want" engagement. It executes a function. To say it "wants" is a metaphor for "it acts *as if* it wants."
  *   *The Question:* "You say the algorithm's desire is literal. If I unplug it, does it feel frustration? If not, in what sense is the desire 'real' rather than just a description of its causal path? And if it's just a description of causal path, why isn't my neurochemistry the same thing?"

  **Argument C: The "Folk Physics" Parallel**
  Eliminativists argue Folk Psychology (belief/desire) will be replaced by Neuroscience.
  *   *The Point:* Attributing "desire" to an algorithm is actually *more* folk-psychological than attributing it to humans. It is projecting human goal-seeking onto math.
  *   *The Question:* "Isn't saying the algorithm 'wants' engagement just 'Folk Computer Science'? You're replacing one folk theory with another, but you're keeping the mentalistic vocabulary for the machine while deleting it for the user."

  ### 4. Summary for Your Next Conversation
  You can say something like this:

  > "I've been thinking about your position. It seems like you're practicing **Asymmetric Eliminativism**. You're treating 'desire' as a literal, ontological reality when it's instantiated in code, but as a fictional construct when instantiated in neurons.
  >
  > Unless you can point to a functional difference between a neural network minimizing loss and a brain minimizing prediction error, you aren't actually an eliminative materialist. You're just a **Functionalist about machines** and an **Eliminativist about biology.** That isn't a coherent metaphysics; it's just substrate bias."

  This frames the issue not as him being sloppy with words, but as him holding two incompatible metaphysical commitments depending on whether the object is human or artificial. That is much harder to wave away.
