answer: |-
  The emergency lights cast the triage zone in a sickly amber glow. Outside, the storm had taken out the grid, and St. Jude's ER was running on generators that sounded like dying asthmatics. Elena was mid-suture on a lacerated forearm when she saw him through the rain-streaked window of the ambulance bay.

  Danny. He was slumped against the brickwork, soaked, head in his hands. He wasn't hurt, not physically. He was just done. The kind of drunk that wasn't about celebration, but about erasure.

  The charge nurse was screaming for pain meds. There were twelve people in the waiting room, three critical. By any metric of aggregate welfare, Elena's place was here. Her hands could stitch more wounds, stabilize more vitals. Danny was one man, and a messy one at that.

  She didn't calculate. She didn't weigh the utility of her brother's stability against the wait times of strangers. She finished the stitch, cut the thread, and told the charge nurse, "Family emergency. Ten minutes."

  She walked out into the rain. She didn't bring an umbrella. She helped Danny up, smelled the cheap whiskey and the despair, and put him in the cab she called. She watched the taillights disappear into the gray morning before going back inside to finish her shift.

  ***

  The diner coffee was bitter, masking the exhaustion in Elena's bones. Mark sat across from her, stirring sugar into his mug with precise, circular motions. Mark was good people. He volunteered, he donated, he thought about the world in a way that made Elena feel both inspired and slightly claustrophobic.

  "I heard you left triage during the blackout," Mark said. He wasn't accusing, just curious. "Must have been chaotic."

  "It was."

  "Your brother okay?"

  "He will be."

  Mark nodded, leaning forward. "I've been thinking about that, actually. The decision matrix. In a resource-scarce environment like a blackout ER, the marginal utility of a skilled nurse is incredibly high. But family bias is a strong heuristic. How did you justify the trade-off? Did you factor in his long-term potential versus the immediate risk to the patients?"

  Elena stared at the steam rising from her cup. She wanted to be honest, but the truth felt like it wouldn't fit in the space between them.

  "I didn't justify it," she said.

  Mark smiled gently. "Everyone justifies it somehow. Even intuitively. Otherwise, it's just negligence. You must have thought something like, 'I'm the only one who can help him,' or 'The other patients are stable enough.'"

  Elena looked out the window. A bus rumbled past, shaking the condensation on the glass. She thought about Danny's face in the amber light. If she had stopped to ask herself if Danny deserved her help more than a stranger with a broken leg, she would have already lost him. Not because he would have died, but because the question would have severed the tie that made her help matter.

  "If I had to find a reason that applied to everyone," Elena said slowly, "then I wouldn't be his sister. I'd just be a nurse who happens to be related to him."

  "But surely," Mark pressed, "you want your actions to be morally defensible. If you can't explain why saving him was the right thing impartially, doesn't that make it arbitrary? Favoritism?"

  "It feels like you're asking me to explain why I love him using math," Elena said. Her voice wasn't angry, just tired. "If I saved him because I calculated that his life produces more good than the people in the waiting room, that's one thought. And if I saved him because the rules allow for family exceptions, that's another thought."

  "And?"

  "And both of those are one thought too many."

  Mark stopped stirring his coffee. "I don't follow."

  "When I walked out there," Elena said, turning back to him, "I didn't see a patient versus a brother. I saw Danny. If I have to step back and view him as a unit of value to be weighed against strangers, I'm already standing outside the relationship. I'm acting like a stranger who knows his history."

  She took a sip of the bitter coffee.

  "You want me to say that helping him was the optimal moral choice. But the only reason it feels like a choice I can live with is because I didn't treat it like a moral problem. I treated it like gravity. He fell, I caught him. If I have to justify why gravity works every time I drop something, I'm going to spend a lot of time looking at the floor while things break."

  Mark sat back. He looked like he wanted to argue, to find the flaw in the logic. But he looked at Elena's hands, resting still on the table, and he saw that there was no logic to find. There was just the fact of her, and the fact of Danny, and the space between them that couldn't be bridged by numbers.

  "That's not very rigorous," Mark said softly.

  "No," Elena agreed. "It's just what keeps me here."
