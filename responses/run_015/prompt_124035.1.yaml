  | **Informational** | Content = High probe accuracy + causal efficacy on training dist. | **Proper Function**. Work: Uses training objective to distinguish 'dog' from 'dog-or-manipulated-activation' (solves disjunction). | Normative 'aboutness' vs. correlation; why specific properties are tracked over gerrymandered disjunctions. |
  | **Anti-Realist** | Content = Utility of decomposition for steering/prediction tasks. | None. Aligns with "usefulness of decomposition." | No fact of the matter on "true" content; ontology collapses to methodology. |

  **Misrepresentation:** Your vocabulary tracks output error, not content error. A "read-only feature" decodes 'dog' perfectly but causes nothing. Realism calls this non-representational; Anti-realism calls it useless for steering. To capture *misrepresentation* (representing 'dog' when it's a cat), you must import a **normative target** primitive distinct from loss landscapes. Without it, you only have "correlation mismatch." You cannot distinguish a system lying from a system broken.

  **Individuation:** Dictionary disagreement shows basis freedom. Interventions settle causal efficacy, not ontological uniqueness. If two dictionaries support identical interventions, Realism insists one is *the* structure; Anti-realism says both are valid tools. Your methods cannot settle individuation because linear transformations preserve intervention outcomes if readouts adjust accordingly. The "right" decomposition is underdetermined by causal data. Your interventions inherit basis freedom; they do not resolve it.

  **Verdict:** The debate collapses if you accept basis freedom. Realism fights for a ghost uniqueness; Anti-realism accepts the gauge freedom. "We discovered a representation" defends Realism. It is indefensible given non-identifiability. Give it up. You lose ontological comfort—the feeling that you found nature's joints. You gain precision: you constructed a coordinate system useful for control. Your methods never delivered uniqueness, only utility. Stop claiming discovery; claim engineering. The sentence "we discovered a representation" implies a fact of the matter your math denies. Replace it with "we constructed a decomposable subspace supporting causal interventions." You lose the claim to truth, but you keep the claim to utility, which is all your probes and interventions actually measure.
