  You raise a pertinent objection, one I hear often from colleagues still wedded to the positivist dream of history as a courtroom verdict. However, you conflate instrumental propaganda with constitutive mythography. A knowingly fabricated founding fiction, say, an imperial rescript invented to justify a usurpation, remains tethered to the specific political utility of its moment; whilst it may serve a regime, it does not survive the collapse of the state that spawned it, nor does it permeate the liturgical and legal consciousness of a people for millennia. The Exodus narrative, unlike a transient forgery, possesses a generative durability that reshapes the ontology of the community itself; it becomes the lens through which reality is interpreted, regardless of the silence of the Sinai desert. To insist on empirical verification here is not to safeguard historical truth, but to impose a modern epistemic demand upon ancient modes of being that simply did not operate according to our standards of evidence. My thesis does not dissolve critical authority; rather, it relocates it from the futile excavation of facts to the rigorous analysis of how these narratives functioned as historical forces in their own right.
