      *   *Clarification on "Immediate":* The user is confused by "as immediate... as the Ideas are." I need to explain that Ideas are the *first* objectification, but they are still objectifications *for a subject*. Music is unique because it doesn't rely on the *concepts* of the Ideas. It bypasses the conceptual mediation.
