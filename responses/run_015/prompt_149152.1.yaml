  2.  **Deconstruct Hume's "Money as Oil" Analogy:**
      *   *Source:* Hume's essay "Of Money" (1752).
      *   *The Quote:* "Money is nothing but the oil which renders the motion of the wheels more smooth and easy." (Paraphrased/Standard interpretation).
      *   *Hume's Actual Theory:* Quantity Theory of Money (long-run neutrality), Price-Specie Flow Mechanism (international adjustment), Non-neutrality in the short run (stimulus via price/wage lag).
      *   *Instructor's Interpretation:* Money reduces transaction costs (friction). Increasing supply/programmability reduces friction. Therefore, good.
      *   *Critique:* Hume viewed money primarily as a *counter* or *representative* of labor/commodities, not a factor of production. The "oil" analogy is often used to explain *velocity* or *facilitation*, but Hume was deeply skeptical of paper money expansion (which he saw as inflationary and destabilizing).

  3.  **Drafting the Correspondence Table:**
      *   Need to map: Money, Trade, Government, Velocity, Prices, Agents $\rightarrow$ Oil, Wheels, Engine, Friction, Heat/Pressure, Operator.
      *   *Drafting:*
          *   Money $\rightarrow$ Oil.
          *   Trade/Commerce $\rightarrow$ Wheels/Motion.
          *   Economy $\rightarrow$ Engine.
          *   Transaction Costs $\rightarrow$ Friction.
          *   Inflation $\rightarrow$ Overheating/Pressure.
          *   Central Bank/Gov $\rightarrow$ Operator/Mechanic.
          *   Velocity $\rightarrow$ Flow rate of oil.
          *   Prices $\rightarrow$ Temperature/Pressure gauge.

  4.  **Identifying the Breaks (The "Disanalogies"):**
      *   *Homogeneity:* Oil is physically uniform (mostly). Money is heterogeneous (cash, credit, bonds, CBDC) and hierarchical.
      *   *Consumption:* Oil degrades/burns. Money doesn't "burn" in transactions (it circulates).
      *   *Purpose:* Oil creates motion. Money facilitates *exchange* (which is about allocation, not just motion).
      *   *Neutrality:* Adding oil generally helps until it leaks/floods. Adding money changes *prices* (Hume's core point), not just speed.
      *   *Passive vs. Active:* Oil is passive. Money carries expectations (signaling).
      *   *The "Friction" Fallacy:* Hume didn't see money as solving "friction" primarily; he saw it as a veil. The instructor conflates New Institutional Economics (transaction costs) with Hume's Classical view.

  5.  **Analyzing Hume's Actual Mechanism (Price-Specie Flow):**
      *   Hume's equilibrium isn't internal lubrication; it's international balance.
      *   If you pump more money (oil) in, prices rise. Goods become expensive. Exports fall. Gold (specie) flows out. Money supply contracts.
      *   *Instructor's Error:* She treats the economy as a closed system (an engine in a box). Hume treated it as open (connected to other nations).
      *   *QE/CBDC:* These are internal expansions. Hume would predict inflation and specie outflow (or currency depreciation in fiat terms), not just "smoother wheels."
      *   *Conclusion:* The policy inference is *not* Humean. It relies on the analogy ignoring the international adjustment mechanism.

  6.  **Evaluating the "Viscosity" Argument:**
      *   Instructor says CBDC changes viscosity.
      *   Hume says Money is a "representative." Changing the form (digital vs. metal) matters less than the *quantity* relative to goods.
