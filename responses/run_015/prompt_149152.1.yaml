      *   *Critical Point:* Make sure to distinguish between Hume's *short-run* non-neutrality (which the instructor might be leaning on) and his *long-run* neutrality (which undermines her). The instructor argues for *structural* change (CBDC) to reduce friction. Hume argues quantity matters more than form.

  11. **Final Polish:** Ensure the distinction between "friction" (transaction costs) and "neutral veil" (classical dichotomy) is clear. The instructor is smuggling in Coasean transaction cost economics into a Humean framework where it doesn't belong.

