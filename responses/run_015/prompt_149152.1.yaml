prompt: |-
  I have recently been auditing a graduate seminar on eighteenth-century political economy, and the discussion keeps returning to Hume’s comparison of money to oil that lubricates the wheels of commerce. The instructor extends the image into present-day policy: she argues that introducing a programmable central-bank digital currency is merely altering the viscosity of the lubricant, leaving the underlying mechanism of trade untouched, and that Hume’s framework should therefore welcome quantitative easing so long as it reduces transactional friction rather than flooding the engine. I am trying to determine whether this extension actually carries the argumentative weight she assigns to it, or whether it collapses once the structural disanalogies are laid out explicitly.

  Could you provide a detailed correspondence table—mapping money, trade, government, velocity, prices, and economic agents onto the oil, the wheels, the engine, the friction, and the operator—and then identify precisely where the mapping breaks? I am particularly concerned with whether the analogy quietly imports physical properties that money lacks: oil is consumed and degrades, it is homogeneous in grade, and its purpose is purely mechanical motion, whereas commerce aims at welfare and depends on heterogeneous credit instruments and conventional valuation. I would also like you to examine whether treating money as a passive substance obscures Hume’s own emphasis on cross-border price adjustments and bullion flows—the mechanism by which relative price levels, not internal lubrication, govern monetary equilibrium—and whether the conclusion that modern digital-currency expansion is therefore Humean survives once that mechanism is restored to view. If the analogy fails to support the policy inference, what alternative image—perhaps drawn from signaling or protocol coordination—would better capture Hume’s view without licensing it?

  In assessing this, please do not rely on bibliographic references I could not check without access; instead, work from the conceptual structure of the analogy itself and from the economic logic Hume employs. I want to know whether the relaxed conclusion about monetary intervention was genuinely derived from Hume’s position or whether it was being carried by the oil image all along.
