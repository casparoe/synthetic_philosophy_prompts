          5.  Determine if the policy inference (support for QE/CBDC) is Humean or just an artifact of the analogy.
          6.  Propose an alternative image (signaling/protocol) if the oil analogy fails.
      *   **Constraint:** Do not rely on hard-to-check bibliographic references. Work from conceptual structure and economic logic.
