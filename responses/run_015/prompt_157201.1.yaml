answer: |-
  # A Field Key for Locating Minds
  **For use on desks, in offices, or inside skulls.**

  **Instructions:** Begin at Couplet 1. Answer the question for the system you are examining (e.g., "The Ant Colony," "The Human Brain," "The Corporation"). Follow the arrow to the next numbered couplet or to a Final Verdict (Leaf).

  **1. Where does the "map" live?**
  *   If you isolate a single working unit (an ant, a neuron, an employee) from the rest, does it still know how to do the job on its own? → **Go to 2**
  *   No. The unit is clueless without the signals from the others; the knowledge is in the connections, not the parts. → **Go to 3**

  **2. If that single unit dies, does the knowledge vanish forever?**
  *   Yes. The system loses that specific skill or memory permanently. → **Go to 4**
  *   No. Other units pick up the task immediately; the knowledge survives the loss of the carrier. → **Go to 5**

  **3. Swap the hardware.**
  *   If you replace the working units one-by-one with tiny robots following the exact same local rules, does the system stop "thinking" or solving problems? → **Go to 6**
  *   No. The system continues behaving exactly as before; the material doesn't matter, only the pattern does. → **Go to 7**

  **4. Who gets the credit?**
  *   When the job is done, we praise the individual unit for its skill. → **LEAF A: Mind in the Units Only**
  *   We praise the arrangement or the manager, not the worker. → **LEAF D: Mind is "As-If" (Instrumental)**

  **5. Cut the system in half.**
  *   If you physically separate the system into two equal, functioning halves, do you now have two distinct "thinkers" with their own goals? → **Go to 8**
  *   No. One half dies, or both halves act confused and stop behaving like the original system. → **LEAF B: Mind in the Whole Only**

  **6. Does the swap change the outcome?**
  *   Yes. The robots can mimic the movement, but the *purpose* is lost; it's just a mechanical simulation. → **LEAF D: Mind is "As-If" (Instrumental)**
  *   No. To an outside observer, the robot-colony is indistinguishable from the ant-colony in goal and action. → **Go to 7**

  **7. Look inside the sub-teams.**
  *   Do smaller clusters within the system (a foraging team, a brain region, a department) act like little agents with their own mini-goals? → **LEAF C: Nested Minds**
  *   No. The sub-clusters are just wires and pipes; only the total system has any agency. → **Go to 9**

  **8. What happens to the original identity?**
  *   The original "self" is gone; two new selves are born. (Like a cell dividing). → **LEAF C: Nested Minds**
  *   The original "self" persists in one half, the other is a copy or a shell. → **Go to 10**
  *   The original "self" is destroyed; both halves are new. → **LEAF E: Verdict Indeterminate**

  **9. How do you predict it?**
  *   You predict it like a rock falling: by physics and cause-and-effect. → **LEAF D: Mind is "As-If" (Instrumental)**
  *   You predict it like a person: by guessing what it *wants* or *believes*. → **LEAF B: Mind in the Whole Only**

  **10. Where is the boundary?**
  *   Clear skin or wall. Everything inside is "us," everything outside is "them." → **LEAF B: Mind in the Whole Only**
  *   Fuzzy. The system bleeds into its environment (trails, wifi, supply chains). → **LEAF E: Verdict Indeterminate**

  ***

  ### The Leaves (Verdicts)

  *   **LEAF A: Mind in the Units Only.** (Reductionism). The colony is just a pile of insects. The brain is just cells. The mind is located in the smallest capable part.
  *   **LEAF B: Mind in the Whole Only.** (Strong Emergence). The ants are dumb; the Colony is smart. The neurons are dumb; the Brain is smart. The parts are merely tools.
  *   **LEAF C: Nested Minds.** (Hofstadter's View). Minds all the way down. The ant has a mind, the team has a mind, the colony has a mind. They are stacked like Russian dolls.
  *   **LEAF D: Mind is "As-If".** (Instrumentalism). It doesn't matter if it's "real." We talk *as if* it has a mind because it's useful shorthand for prediction.
  *   **LEAF E: Verdict Indeterminate.** (Mysterian/Blurry). The system resists classification. Boundaries are too porous or identity is too fractured to say "yes" or "no."

  ***

  ### Post-Session Analysis

  **1. The Indistinguishable Leaves**
  This key struggles to genuinely separate **Leaf B (Mind in the Whole Only)** and **Leaf C (Nested Minds)**.
  *   *Why:* If a user answers that sub-teams have "mini-goals" (Couplet 7), they go to Nested. But if they define "mini-goals" strictly as "mechanical functions," they slide to Whole Only. In practice, a Strong Emergentist (Whole Only) and a Hofstadterian (Nested) will often answer the couplets identically because they agree the *Colony* thinks; they only disagree on whether the *Ant* thinks. Since this key focuses on the system level, it lacks the resolution to probe the interiority of the base unit deeply enough to force a split.

  **2. Unoccupied Answer Combinations**
  *   **Combination:** *Couplet 1b (Knowledge in connections)* + *Couplet 5b (Split destroys mind)* + *Couplet 9b (Predict like a person).*
  *   **Why Unoccupied:** This describes a system where the knowledge is distributed (not in parts), but if you cut it in half, the mind vanishes rather than splitting or persisting, yet you still predict it using psychology. This is **unattractive**. If a system is complex enough to require psychological prediction (beliefs/desires), it usually possesses enough redundancy that fission creates two agents (like splitting a worm or a hypothetical digital mind) or persists (like a brain losing a hemisphere). A "fragile person" is a concept we rarely occupy.
  *   **Combination:** *Couplet 3a (Robots stop thinking)* + *Couplet 6b (Outcome unchanged).*
  *   **Why Unoccupied:** This is **incoherent**. It claims the robots stop the thinking, but the outcome is indistinguishable. If the outcome (behavior/solving) is unchanged, asserting the thinking has stopped is a metaphysical claim the key is designed to bypass. It contradicts the operational definition of "thinking" used in the rest of the key.

  **3. The Workhorse Couplet**
  **Couplet 1 (Where does the "map" live?)** does the heaviest lifting.
  *   *Effect of Deletion:* If you delete Couplet 1, the key collapses into a test of *resilience* rather than *location*. Without establishing whether information is localized or distributed at the start, you cannot distinguish Leaf A (Units Only) from the rest. Every subsequent question about splitting, swapping, or sub-teams assumes you have already decided whether the unit or the network holds the primary agency. Without Couplet 1, a reductionist (who believes the ant knows the way) and an emergentist (who believes the trail knows the way) would answer the remaining questions similarly, forcing them both into "Whole Only" or "Nested" verdicts erroneously. Couplet 1 is the fork in the road between "It's just bugs" and "It's a Superorganism."
