answer: |-
  **JOINT STATEMENT ON PRECOMMITMENT AND THE ORPHEUS CLAUSE**

  **Signatories:** The Diachronic-Autonomy Working Group & The Present-Will Coalition
  **Date:** October 24, 2023

  **I. AGREED CLAIMS**

  We, the undersigned, acknowledge the following regarding the mechanics and effects of self-binding mechanisms, specifically the specimen "Orpheus Clause" described in the accompanying feature:

  1.  **Third-Party Enforcement is Necessary:** There is no such thing as a purely self-enforcing precommitment. Just as Ulysses required sailors to ignore his later commands, the Orpheus Clause requires the ordinary courts (iv) to enjoin the executive. Without external enforcement, the clause is merely cheap talk.
  2.  **The Function of the Review Mechanism:** The Citizens' Assembly requirement (iii) operates as an informational filter, not a veto. It forces the repealing legislature to articulate which specific factual predicates have lapsed. This increases the political cost of repeal but does not render repeal impossible.
  3.  **Effect of Judicial Strike-Down:** If courts declare the Clause unconstitutional, the policy instrument (the emissions floor) reverts to the status of ordinary statute, repealable by simple majority without certification. The policy remains, but the *binding* quality vanishes.
  4.  **Impossibility of Pure Self-Binding:** A legislature cannot physically bind its successors. The Orpheus Clause binds only by altering the incentives and procedures facing future actors.
  5.  **Distinction of Intent:** The Clause is not a mere statement of intent because it creates justiciable standards. However, its legitimacy does not derive solely from its text, but from the ecosystem of actors (courts, assemblies, electorates) willing to uphold it.

  **II. RESIDUAL DISAGREEMENTS**

  | Claim | Diachronic-Autonomy View | Present-Will View |
  | :--- | :--- | :--- |
  | **1. Source of Legitimacy** | The Clause is legitimate because it extends the agency of the enacting legislature across time. To allow a later simple majority to override it without meeting the original terms is to treat the legislature as a series of strangers rather than a continuous agent. The Ulysses contract and the constitutional clause are the same act at different scales. | The Clause is legitimate only insofar as it prevents harm to non-consenting parties (including future citizens) or secures reliance interests. It is not the past will binding the present, but the present acceptance of constraints that serve current welfare. Entrenchment is governance by the dead unless justified by living consequences. |
  | **2. Nature of Repeal** | A later reversal of will should not automatically defeat the earlier commitment. What stands in need of explanation is why anyone thinks a transient later preference should trump a considered earlier plan. The Citizens' Assembly ensures the *conditions* of the original will are met, preserving temporal integrity. | A bare self-binding is paternalism by an earlier self over a later one. Legitimacy comes from the consent of the governed *now*. If the Citizens' Assembly certifies the predicament has lapsed, the earlier will *must* yield. To do otherwise is to prioritize a ghost over a living electorate. |
  | **3. The "Dead Hand"** | The "dead hand" objection confuses biological death with institutional continuity. The enacting body is not dead; it is the same institution at a different temporal coordinate. Binding is not a surrender of agency but the exercise of agency over the stretch of time it actually occupies. | Constitutional entrenchment stands or falls by its effects on people who never agreed to it. If the Clause prevents a future majority from addressing a crisis they did not foresee, it is tyranny. We judge the chain by the weight it places on the living, not the intentions of the dead. |

  **III. THE CRUXES**

  We identify two cases where our theoretical divergence yields observable differences in institutional design and outcome.

  **A. The Signature Problem (Learning vs. Weakness)**
  *The Issue:* A well-designed precommitment should defeat later weakness of will but not later learning. However, an agent in the grip of a preference reversal will always describe itself as having learned something.
  *Solubility:* We agree this is insoluble in the abstract. The Orpheus Clause attempts to solve it procedurally via the Citizens' Assembly (iii), which must certify that the *predicament* no longer obtains.
  *Shared Test:* Observe the frequency of repeal attempts during periods of high economic stress (e.g., a recession) versus periods of new scientific consensus.
  *   **Diachronic Prediction:** Repeal should remain low during economic stress (weakness) but rise sharply upon new scientific consensus (learning). The Assembly distinguishes the two.
  *   **Present-Will Prediction:** Repeal will track current political pressure regardless of the cause. If the Assembly is independent, it will block stress-based repeal; if it is political, it will rubber-stamp it. The Clause's success depends entirely on the Assembly's independence, not the logic of precommitment.
  *   **Implication:** If repeal spikes during economic stress despite the Assembly, the Diachronic view counts this as a failure of the mechanism; the Present-Will view counts it as the living will correctly reasserting itself.

  **B. The Ratchet Case (Restraint vs. Generosity)**
  *The Issue:* Contrast a clause restraining a future majority from spending beyond a fiscal rule with a clause restraining a future majority from *raising* foreign aid or a carbon price (precommitting against later generosity).
  *Symmetry:* Does each view treat the two symmetrically?
  *   **Diachronic Prediction:** Symmetrical. Both are exercises of diachronic agency. A promise to spend less and a promise to spend more are equally valid bindings of the future. To treat them differently is to smuggle in a substantive preference under the guise of procedural autonomy.
  *   **Present-Will Prediction:** Asymmetrical. A fiscal rule may be justified by preventing harm (economic collapse) to future citizens who cannot consent. A "generosity brake" prevents benefit to others without preventing harm. The latter is harder to justify under a harm principle or reliance theory.
  *   **Shared Test:** Judicial review of a "Generosity Brake" clause.
  *   **Outcome:** If courts strike down the Generosity Brake but uphold the Fiscal Rule, the Present-Will view is vindicated (legitimacy rests on harm prevention). If courts uphold both, the Diachronic view is vindicated (legitimacy rests on the validity of the binding act itself).

  **IV. VERBAL VS. SUBSTANTIVE DISPUTE**

  We conclude that part of our dispute is merely verbal, specifically regarding the definition of **Autonomy**.
  *   **The Verbal Dispute:** The Diachronic view defines autonomy as fidelity to a plan over time. The Present-Will view defines autonomy as the capacity to choose in the present. When we argue about whether the Orpheus Clause "enhances" or "restricts" autonomy, we are often talking past each other using different temporal definitions of the self.
  *   **The Substantive Question:** Underneath the terminology lies a concrete disagreement about **Institutional Stability vs. Responsiveness**.
      *   The Diachronic view prioritizes the stability of long-term projects against the volatility of electoral cycles.
      *   The Present-Will view prioritizes the responsiveness of government to current conditions and values.
      *   **Resolution Path:** We agree that the Orpheus Clause is a tool that trades responsiveness for stability. The debate is not whether this trade-off is conceptually coherent (we agree it is), but whether the specific trade-off encoded in the Clause is normatively desirable for a democracy. We disagree on who bears the burden of proof: the Diachronic view asks why a later will should defeat an earlier one; the Present-Will view asks why an earlier will should bind a later one.

  **Signed,**

  *The Diachronic-Autonomy Working Group*
  *The Present-Will Coalition*
