answer: |-
  The platitude you cite is a vernacular statement of **Good's Theorem** (I.J. Good, 1967), specifically the principle that the expected utility of making a decision with free information is at least as high as making it without. In decision theory, this is the **Non-Negative Value of Information** property.

  However, as you have intuited, this theorem is not a law of nature; it is a mathematical consequence of a specific set of modeling assumptions. When information harms, it is because one of these assumptions has been violated. There is no single settled taxonomy for these violations, but they are well-documented across distinct subfields (game theory, behavioral economics, ambiguity theory).

  Below, I lay out the candidate mechanisms (assumptions), test your cases against them, and address your specific suspicions regarding ambiguity and behavioral labels.

  ### The Candidate Mechanisms (Assumptions of Good's Theorem)

  For information to have non-negative value, the following conditions must hold:

  1.  **Consequentialism:** Utility is derived only from terminal outcomes (wealth, health), not from the belief state itself or the process of waiting.
  2.  **Agency (Freedom to Ignore):** The agent retains the full set of actions available without information after receiving the information. The agent can effectively "throw away" the signal.
  3.  **Privacy (Non-Strategic Acquisition):** The act of acquiring information is not observable by other agents who can alter the payoff structure in response.
  4.  **Bayesian Linearity (or Rectangularity):** The agent ranks prospects by probability-weighted averaging (Expected Utility) or, in ambiguity models, maintains **dynamic consistency** (specifically, a rectangular set of priors).
  5.  **Costlessness:** The information has no direct monetary or resource cost.

  ### Analysis of Your Three Cases

  #### Case One: The Genetic Test (Self-Binding)
  *   **The Mechanism:** The woman anticipates that receiving the signal will alter her **constraint set** or **preference ordering**. She expects her future self to be compelled to act (prophylaxis) in a way her current self dislikes.
  *   **Assumption Violated:** **Agency (Freedom to Ignore)** and **Stable Preferences**. Good's theorem assumes a unitary agent with stable preferences who can choose action $A$ after seeing signal $S$ even if they would have chosen $A$ without $S$. Here, the information triggers a psychological compulsion that removes the option to "wait."
  *   **Classification:** This is a **genuine counterexample to the platitude**, but technically a **hypothesis failure of the unitary agent model**. In decision theory, this is modeled as an **intrapersonal game** (O'Donoghue & Rabin, 1999). The "chooser" is actually two agents (Time 1 and Time 2). Information changes the equilibrium of the game between selves.
  *   **Status:** Real phenomenon, often termed **Preference for Ignorance due to Self-Control**.

  #### Case Two: The Misery of Waiting (News Utility)
  *   **The Mechanism:** The patient derives negative utility from the state of anxiety during the waiting period. The test extends this period.
  *   **Assumption Violated:** **Consequentialism**. Standard VoI models assume utility is defined over final health states. Here, utility is defined over the *path* of beliefs (Caplin & Leahy, 2001). The information event itself is a "bad" in the utility function.
  *   **Classification:** This is a **hypothesis failure**. The platitude holds for *instrumental* value of information (guiding action). It fails for *consumptive* value (information as a good/bad itself). If you expand the utility function to include "anxiety costs," the theorem holds again (the net value is negative because the cost is positive), but under the standard health-econ definition of utility (QALYs based on health states), it looks like a counterexample.
  *   **Status:** Real phenomenon, termed **News Utility** or **Anticipatory Utility**.

  #### Case Three: The Market Study (Strategic Signaling)
  *   **The Mechanism:** The competitor observes the *acquisition* of information and infers intent, moving first to preempt the firm.
  *   **Assumption Violated:** **Privacy (Non-Strategic Acquisition)**. Good's theorem is a single-agent result. In game theory, information can have negative value if its acquisition signals private information to an opponent (Hirshleifer, 1971).
  *   **Classification:** This is a **genuine counterexample to the single-agent platitude**, but a standard result in **Game Theory**. It is the **Hirshleifer Effect**: public information can destroy risk-sharing or strategic advantage.
  *   **Status:** Real phenomenon, termed **Strategic Disadvantage of Information**.

  ### Comparison: Case One vs. Case Three

  You noted that in both cases, "someone later reacts." This resemblance is superficial. The theoretically important distinction lies in the **locus of the constraint**.

  *   **Case Three (Competitor):** The reaction is **exogenous** to the agent's psychology. The payoff matrix changes because an *external* adversary optimizes against the new information state. The agent's preferences and capabilities remain stable; the world becomes more hostile.
  *   **Case One (Future Self):** The reaction is **endogenous** to the agent's psychology. The payoff matrix might remain stable, but the agent's *ability to navigate it* degrades. The "adversary" is the agent's own future preference structure.

  **The Theoretically Important Resemblance:** Both violate the assumption that the **Action Set is Independent of Information Acquisition**. In standard VoI, $A$ (the set of actions) is fixed. In Case 1, $A$ shrinks (compulsion). In Case 3, the effective payoff of $A$ changes because the opponent's move $B$ becomes a function of the information acquisition $I$.

  **The Theoretically Important Difference:** **Dynamic Consistency.** In Case 3, a rational agent *should* anticipate the competitor's move and decline the test (consistent planning). In Case 1, the agent declines the test specifically because they know they will be **dynamically inconsistent** (they will not be able to stick to the plan they currently prefer). Case 1 is a failure of rationality (or a recognition of bounded rationality); Case 3 is rational behavior in a multi-agent setting.

  ### Case Four: Ambiguity and the Destroyed Hedge

  Your suspicion is correct: For a chooser who does not rank by probability-weighted averaging (e.g., MaxMin Expected Utility), resolving ambiguity can hurt even with free, ignorable information.

  **Is it real?** Yes, but only if the agent's updating rule violates **Rectangularity** (Epstein & Schneider, 2003). If an ambiguity-averse agent maintains a rectangular set of priors (dynamic consistency), VoI is non-negative. If they do not (dynamic inconsistency), VoI can be negative.

  **Minimal Example:**
  Consider an agent with MaxMin preferences (evaluating acts by their worst-case expected utility over a set of priors $\mathcal{P}$).
  *   **States:** $S_1, S_2$.
  *   **Priors:** $\mathcal{P} = \{p \in [0.4, 0.6]\}$, where $p$ is prob of $S_1$.
  *   **Actions:**
      *   $H$ (Hedge): Pays 5 regardless of state.
      *   $R$ (Risky): Pays 10 if $S_1$, 0 if $S_2$.
  *   **Without Information:**
      *   $EU_{min}(H) = 5$.
      *   $EU_{min}(R) = 0.4 \times 10 = 4$.
      *   **Choice:** $H$. Value = 5.
  *   **With Information:** A free signal reveals whether $p=0.4$ or $p=0.6$ (50/50 chance).
  *   **Updating (Non-Rectangular/Naive):** Suppose the agent updates by simply narrowing the set to the revealed point (Full Bayesian on the set), but evaluates the *plan* to update using the original priors (Dynamic Inconsistency).
      *   If signal says $p=0.6$: $EU(R) = 6$, $EU(H) = 5$. Agent switches to $R$.
      *   If signal says $p=0.4$: $EU(R) = 4$, $EU(H) = 5$. Agent stays with $H$.
  *   **Ex-Ante Evaluation:** The ambiguity-averse agent evaluates this *plan* (Switch if 0.6, Stay if 0.4) using the worst-case prior from the original set ($p=0.4$).
      *   Under $p=0.4$, the probability of the "good" signal (revealing 0.6) is not necessarily 0.5; the ambiguity might extend to the signal structure.
      *   *Simpler Violation:* If the agent simply values the *ambiguity itself* as a hedge. By resolving the ambiguity, you force a decision under risk. If the agent is sufficiently ambiguity-averse, the utility of "Not Knowing" (which allows them to claim the hedge $H$ is optimal) exceeds the utility of "Knowing" (which might tempt them into $R$ in the high-probability state, exposing them to loss in the low-probability state which they fear ex-ante).
  *   **Verdict:** It is real under **Dynamic Inconsistency**. It is impossible under **Rectangularity**. The "hedge" being destroyed is the ability to treat the set of priors as a single robust object.

  ### Behavioral Finance Label: The Ostrich Effect

  The label you are looking for is the **Ostrich Effect** (Galai & Sade, 2003; Sicherman & Loewenstein, 1993). This describes investors avoiding information (e.g., logging into portfolios) when markets are falling.

  **Do they collapse?** No.
  *   **Ostrich Effect (Case 2 alignment):** This is primarily driven by **News Utility**. Investors avoid the *pain* of the belief update. It is psychological/consumptive.
  *   **Your Structural Cases (1, 3, 4):** These are driven by **Instrumental Constraints**. The information changes the *feasibility* or *payoff* of actions, not just the emotional state.
  *   **Distinction:** If an investor avoids looking because they know they will panic-sell (Case 1), that is **Self-Control/Ostrich overlap**. If they avoid looking because they simply feel sad (Case 2), that is pure **Ostrich**. Most empirical Ostrich behavior is a mix, but theoretically, the *mechanism* distinguishes them.

  ### Taxonomy and Terminology

  There is no single established term that bundles these violations into a unified taxonomy. The literature treats them as separate anomalies (News Utility, Hirshleifer Effect, Dynamic Inconsistency).

  Since you asked to coin a term if nothing established covers the taxonomy, I propose the term **"Information Pathologies"**.

  **Definition:** An Information Pathology occurs when the acquisition of costless, accurate information reduces the decision-maker's expected utility.

  **Boundary Cases for Membership:**
  1.  **Structural Pathologies (Genuine Counterexamples to Single-Agent EU):**
      *   *Strategic Hazard (Case 3):* Information alters opponent behavior (Hirshleifer). **Membership:** Yes.
      *   *Agency Hazard (Case 1):* Information alters future self's constraints (Self-Control). **Membership:** Yes.
      *   *Ambiguity Hazard (Case 4):* Information destroys robustness hedges (Non-Rectangularity). **Membership:** Yes.
  2.  **Psychological Pathologies (Hypothesis Failures of Consequentialism):**
      *   *Consumptive Hazard (Case 2):* Information causes direct disutility (News Utility/Ostrich). **Membership:** Yes (but distinct mechanism).
  3.  **Non-Members (What should not count):**
      *   *Costly Information:* If the test costs money, and the value of the test is less than the cost, this is **not** an Information Pathology. This is standard economics.
      *   *Bad Signals:* If the information is noisy or misleading (incorrect), this is **not** an Information Pathology. Good's theorem assumes accurate Bayesian updating.
      *   *Ex-Post Regret:* If you get info, make the optimal choice, and still get a bad outcome (e.g., test says healthy, you get sick anyway), this is **not** a pathology. VoI is about *ex-ante* expected utility.

  **Summary Table:**

  | Case | Mechanism | Violated Assumption | Taxonomy Class |
  | :--- | :--- | :--- | :--- |
  | **1 (Genetic)** | Self-Binding | Agency / Stable Preferences | Structural (Intrapersonal) |
  | **2 (Waiting)** | Anxiety | Consequentialism | Psychological (Consumptive) |
  | **3 (Competitor)** | Signaling | Privacy / Single-Agent | Structural (Interpersonal) |
  | **4 (Ambiguity)** | Hedge Destruction | Rectangularity / Linearity | Structural (Model Specification) |

  The platitude holds only for a **Single, Consequentialist, Bayesian Agent with Stable Preferences and Private Acquisition**. Your cases map precisely to the failure of each of those five adjectives.
