  I'm a second-year CS PhD student and I'm in a small reading group on fairness in multi-objective ML — we usually argue about scalarization weights, and now I've been dragooned into presenting on bargaining theory because of one undergrad game theory course I took three years ago and mostly forgot. My econ-department flatmate keeps telling me the Nash vs Kalai–Smorodinsky thing is "just an axiom swap," and I think he's wrong but I can't say why in words I actually trust. So here's what I want: restate the whole dispute in the vocabulary I really use — achievable loss/utility pairs, the Pareto frontier of a model class, scalarization (weighted sum, min-max fairness, log-barrier/proportional-fairness objectives), distributionally robust optimization, per-objective rescaling and normalization, optimizers that are invariant to rescaling like Adam, and picking a model using a held-out set. Be honest about the translation rather than quietly importing ML assumptions and calling them translation: for each of Nash's axioms and for KS's monotonicity, tell me what the axiom says in my terms. My guesses, which you should correct if they're off: the Nash product of gains looks like maximizing a sum of log-gains, i.e. the proportional-fairness objective people use in networking and fair classification; KS looks like the "min-max fairness" rule where you equalize each objective's fraction of its own range from the status quo up to its best achievable value; invariance to positive affine transformation of a player's utility looks like invariance to rescaling each loss term, which is the same itch Adam's per-parameter normalization scratches; and a "player" is just an objective whose units are not comparable to the other one's.

  Then I want the residue report, and the residue is the part I care about. What translates cleanly, what only survives if you distort it, and what has no expression at all in my vocabulary? Two things I suspect have no home: (i) the axioms are demands on a *rule evaluated across counterfactual feasible sets* — "if the set had been this other set, and your pick was still available, you'd have picked the same thing" — whereas in ML I fix one model class, one training run, one test distribution, and I never ask whether my scalarization is self-consistent across the model classes I didn't train; (ii) the disagreement point. We have baseline models, but there's no canonical "walk away" outcome, and everything (Nash product and KS's ratios both) seems to depend on where you put it. Also, KS needs a *cardinal* zero and scale for each player, not just an ordering — what happens to KS if one of my three objectives has no meaningful zero or unit at all, e.g. some interpretability or fairness gap score I invented, where the affine rescaling is genuinely arbitrary?

  Here's the concrete thing that got me stuck, and please actually work it, don't hand-wave. Suppose I can't convexify: I have to ship one deterministic model, and the metric is nonlinear in mixtures (accuracy, say), so my achievable set really is non-convex. Say the gains over the status quo, for two players, are the L-shaped region where 0 ≤ g1 ≤ 10, 0 ≤ g2 ≤ 10, and (g1 ≤ 4 or g2 ≤ 4) — so the frontier is the two segments (10, 4)-to-(4, 4) and (4, 4)-to-(4, 10), and the corner (4, 4) is dominated. As I understand it, KS says: take the ideal point (10, 10), draw the line from the disagreement point (0, 0) to it, and take the furthest feasible point on that line — which here is (4, 4), a Pareto-dominated point, so the KS rule as stated seems to break its own Pareto axiom. And the Nash product ties at (10, 4) and (4, 10) with product 40, both beating the symmetric point, so I get two asymmetric optima out of a symmetric problem and no way to break the tie. Which axiom is really doing the work that convexity was doing, and if I had to repair KS for non-convex achievable sets, what would the repair cost me? One more wrinkle while you're at it: in practice I only know the frontier from finite validation samples, so the ideal point is a coordinate-wise max over noisy estimates and is biased upward, while the Nash product doesn't use the ideal point at all — is KS therefore strictly more fragile statistically, or does that wash out? Finish with a verdict, not a shrug: does the stuff that won't translate point to something my ML vocabulary is missing, or to the axiomatic debate being thinner and more convention-bound than the econ people let on?
