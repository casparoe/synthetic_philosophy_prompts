answer: |-
  Here is the translation and the autopsy you asked for. I will skip the econ-history and map the concepts directly to your multi-objective optimization (MOO) stack.

  ### 1. The Axiom Translation Table

  Your guesses are mostly correct, but the devil is in the *scope* of the invariance.

  | Axiom | Econ Definition | ML Translation | Your Guess Correction |
  | :--- | :--- | :--- | :--- |
  | **Pareto Efficiency** | No other outcome makes someone better off without hurting another. | The selected model lies on the Pareto frontier of your validation metrics. | **Correct.** If you can improve Accuracy without hurting Fairness, you haven't finished tuning. |
  | **Symmetry** | If players are identical, they get identical gains. | If two objectives are exchangeable (same scale, same range), the scalarization treats them equally. | **Correct.** But rare in ML. Accuracy (0-1) and H-Score (0-100) are never symmetric without normalization. |
  | **Invariance to Affine Transformations** (Scale/Location) | Solution doesn't change if $u_i \to a u_i + b$ ($a>0$). | **Unit Invariance.** If you change Objective 1 from "Error Rate" to "Accuracy" ($1 - \text{error}$), or rescale from $[0,1]$ to $[0,100]$, the chosen model index $f^*$ remains the same. | **Close.** Adam's invariance is about *optimization dynamics* (gradient scaling). This is about the *solution concept*. If your scalarization is $\sum w_i \mathcal{L}_i$, it fails this unless $w_i$ adapts to the scale. Nash/KS *demand* this. |
  | **Independence of Irrelevant Alternatives (IIA)** (Nash) | If $S' \subset S$ and the chosen $x \in S'$, then $x$ must still be chosen in $S'$. | **Frontier Stability.** If you prune your model class $\mathcal{F}$ (remove models you weren't going to pick anyway), your scalarization shouldn't suddenly pick a different model from the remaining set. | **Missed.** This is the convexity axiom. It fails if removing a "dominated" model changes the curvature of the frontier enough to shift the weighted sum optimum. |
  | **Monotonicity** (KS) | If the feasible set expands in favor of Player 1, Player 1's gain shouldn't decrease. | **Opportunity Sensitivity.** If you improve your model class such that the *best possible* Accuracy increases (ideal point moves up), but Fairness potential stays same, the selected model shouldn't sacrifice Accuracy to "compensate" Fairness. | **Close.** It's about the *Ideal Point*. If the utopia for Obj 1 gets better, KS ensures you capture some of that gain, whereas Nash might ignore it if the disagreement point stays fixed. |

  **The "Player" vs. "Objective" mapping:** You are correct. In MOO, the "players" are the loss terms. The "utility" is the negative loss. The "disagreement point" is your baseline model (e.g., the null model or current production model).

  ---

  ### 2. The Residue Report

  Here is what breaks when you try to port bargaining theory into a standard ML training loop.

  **What Translates Cleanly:**
  *   **Pareto Efficiency:** This is the native language of MOO.
  *   **Symmetry:** Easy to enforce if you normalize objectives (e.g., z-scoring losses on the validation set).
  *   **Affine Invariance:** This is exactly why people use *Proportional Fairness* (Nash Product) or *Max-Min Fairness* (KS-adjacent). They are attempts to satisfy this without manual weight tuning.

  **What Distorts:**
  *   **The Disagreement Point ($d$):** In bargaining, $d$ is "no deal" (zero utility). In ML, $d$ is arbitrary.
      *   *Nash:* Maximizes $\prod (u_i - d_i)$. If you set $d$ to "random guess," the product is huge. If you set $d$ to "current SOTA," the product shrinks. **The Nash solution moves as you move $d$.** There is no canonical $d$ in ML. This makes the Nash solution convention-bound.
      *   *KS:* Uses $d$ to define the denominator of the ratio $\frac{u_i - d_i}{u^*_i - d_i}$. Same problem.
  *   **Cardinality of Utility:** KS requires that the *distance* between $d$ and $u^*$ is meaningful.
      *   *Your Worry:* If Objective 1 is "Accuracy" (0 to 1) and Objective 2 is a "Fairness Gap" (0 to 0.5, arbitrary units), KS equalizes the *fraction* of the range achieved.
      *   *The Break:* If the Fairness Gap is arbitrary (e.g., you could have defined it as $2 \times \text{Gap}$), KS changes the solution. Nash also changes because the product scales. **Neither is invariant to non-linear rescaling,** but KS is more fragile because it relies on the *Ideal Point* $u^*$, which defines the scale.

  **What Has No Expression (The Void):**
  *   **Counterfactual Feasible Sets (IIA & Monotonicity):** You noted this. In ML, we train *one* model class $\mathcal{F}$ on *one* dataset. We never ask, "If I had a smaller model class, would I still pick this hyperparameter?"
      *   *Why it matters:* IIA is what guarantees the Nash solution can be found via a weighted sum (scalarization). Without IIA (i.e., in non-convex sets), scalarization fails to find the Nash point.
      *   *Monotonicity:* We don't test if expanding $\mathcal{F}$ improves the specific objective fairly. We just retrain and check the frontier. The axiom imposes a *consistency across experiments* that we never run.

  ---

  ### 3. The Non-Convex Workthrough

  Let's work your L-shaped example. This is the critical stress test.

  **The Setup:**
  *   Gains $g = (g_1, g_2)$ over disagreement $d=(0,0)$.
  *   Feasible Set $S = \{ (g_1, g_2) \mid 0 \le g_1, g_2 \le 10, \min(g_1, g_2) \le 4 \}$.
  *   This creates an "L" shape. The region where both $>4$ is forbidden.
  *   **Pareto Frontier:** The set of points where you cannot increase one gain without decreasing the other.
      *   Segment 1: $g_1 = 10, 0 \le g_2 \le 4$. (Maxed Obj 1).
      *   Segment 2: $g_2 = 10, 0 \le g_1 \le 4$. (Maxed Obj 2).
      *   *Wait, check the corner:* Is $(4,4)$ Pareto efficient?
          *   Consider $(4.1, 4)$. $\min(4.1, 4) = 4 \le 4$. Feasible.
          *   $(4.1, 4)$ dominates $(4,4)$ (better $g_1$, same $g_2$).
          *   Therefore, **$(4,4)$ is NOT Pareto efficient.** The frontier is the two "arms" of the L, excluding the inner corner.

  **Kalai-Smorodinsky (KS) Calculation:**
  1.  **Ideal Point ($u^*$):** Coordinate-wise max. $u^*_1 = 10$ (at $g_2=4$), $u^*_2 = 10$ (at $g_1=4$). So $u^* = (10, 10)$.
  2.  **Ray:** Line from $d=(0,0)$ to $u^*=(10,10)$. Equation: $g_1 = g_2$.
  3.  **Intersection:** Find max $k$ such that $(k,k) \in S$.
      *   Constraint: $\min(k,k) \le 4 \implies k \le 4$.
      *   Max $k = 4$.
      *   **KS Solution:** $(4,4)$.
  4.  **Failure:** As shown above, $(4,4)$ is dominated by $(5,4)$ and $(4,5)$.
      *   **Verdict:** **KS violates Pareto Efficiency on non-convex sets.**

  **Nash Product Calculation:**
  1.  **Objective:** Maximize $N = g_1 \cdot g_2$ (since $d=0$).
  2.  **Search:**
      *   On Segment 1 ($g_1=10, g_2 \le 4$): Max product is $10 \times 4 = 40$ at $(10, 4)$.
      *   On Segment 2 ($g_2=10, g_1 \le 4$): Max product is $4 \times 10 = 40$ at $(4, 10)$.
      *   At Corner $(4,4)$: Product is 16.
  3.  **Result:** Two optima: $(10, 4)$ and $(4, 10)$.
  4.  **Failure:** The problem is symmetric ($g_1 \leftrightarrow g_2$), but the solutions are asymmetric. You must break the tie arbitrarily (e.g., flip a coin).
      *   **Verdict:** **Nash preserves Pareto Efficiency but fails Symmetry in selection** (though the *set* of solutions is symmetric).

  **Which Axiom Broke?**
  *   **KS:** The **Monotonicity** axiom (combined with Pareto) implicitly assumes the feasible set is *comprehensive* and *convex*. The ray intersection method only guarantees Pareto optimality if the frontier is "bulging out" (convex). If the frontier caves in (concave/non-convex), the ray hits the "shadow" of the frontier, not the frontier itself.
  *   **Nash:** The **IIA** axiom is what usually guarantees a unique, symmetric solution via scalarization. In non-convex sets, the supporting hyperplane (weighted sum) touches multiple points.

  **Repairing KS:**
  To fix KS for non-convex sets, you cannot just take the ray intersection. You must define the KS solution as the Pareto point that *minimizes the distance* to the ray, or equalizes the ratios $\frac{g_i}{u^*_i}$ *subject to* $g \in \text{Pareto}(S)$.
  *   **The Cost:** You lose the clean "line intersection" geometry. Computationally, you now need to search the frontier, not just solve a linear equation. More importantly, you lose the **Monotonicity** guarantee. If the set expands slightly, the "closest Pareto point to the ray" might jump discontinuously from one arm of the L to the other.

  ---

  ### 4. Statistical Fragility: Ideal Point vs. Product

  You asked if KS is strictly more fragile statistically. **Yes.**

  *   **KS Sensitivity:** KS depends on $u^* = (\max f_1, \max f_2)$.
      *   In finite validation sets, the maximum of noisy estimates is **biased upward** (Extreme Value Theory). $\mathbb{E}[\max \hat{y}] > \max \mathbb{E}[y]$.
      *   If Objective 1 has higher variance than Objective 2, $\hat{u}^*_1$ will be disproportionately inflated.
      *   This tilts the KS ray toward Objective 1, forcing the solution to give Objective 1 more gain to "match" the inflated ratio.
      *   **Result:** KS systematically favors high-variance objectives in finite samples.

  *   **Nash Sensitivity:** Nash depends on the product of gains $(u_i - d_i)$.
      *   It does *not* use the ideal point $u^*$.
      *   It is sensitive to the disagreement point $d$. If $d$ is noisy, the "gain" is noisy.
      *   However, the product operator is generally more robust to outliers than the max operator.
      *   **Result:** Nash is statistically more stable than KS, provided $d$ is fixed (e.g., a large held-out baseline).

  ---

  ### 5. The Verdict

  Your flatmate is mathematically right but practically wrong.

  **Mathematically:** Yes, Nash and KS are separated by a swap of IIA for Monotonicity. On convex, comprehensive sets with cardinal utility, this is a clean, elegant distinction.

  **Practically (in ML):** The axiomatic debate is **thinner and more convention-bound** than the econ people let on, because the premises of the theorems do not hold in your setting.

  1.  **Convexity is a Lie:** You ship deterministic models. Your achievable set is a cloud of points, almost certainly non-convex. KS breaks Pareto optimality here. Nash works but forces asymmetric tie-breaking.
  2.  **Cardinality is a Lie:** Your loss functions are designed by humans. The "zero" and "unit" of a fairness gap are arbitrary. KS requires these to be meaningful to define the "fraction of ideal gain." If you rescale one loss by 10x, KS changes the model. Nash changes too, but KS is more sensitive because it normalizes by the *range* (Ideal - Disagreement), amplifying the noise in the Ideal point.
  3.  **The Disagreement Point is a Phantom:** In bargaining, walking away is a real state. In ML, the "baseline model" is a choice. Moving $d$ changes the Nash solution. There is no "true" $d$.

  **Conclusion:**
  The stuff that won't translate points to **ML vocabulary missing a theory of "Objective Meaning."**
  Econ assumes utility is *discovered* (intrinsic to the player). ML assumes utility is *designed* (intrinsic to the engineer).
  *   Because you design the losses, **Affine Invariance is your responsibility, not the optimizer's.** You should normalize losses to comparable scales *before* applying Nash or KS.
  *   Because you don't have counterfactual model classes, **IIA and Monotonicity are untestable.** They offer no guidance for hyperparameter selection.

  **Recommendation for your presentation:**
  Tell the group that **Nash (Proportional Fairness)** is the robust choice for ML.
  1.  It handles non-convexity better (finds corners, doesn't pick dominated points).
  2.  It avoids the statistically biased Ideal Point estimate required by KS.
  3.  It corresponds to minimizing the log-barrier, which is standard in optimization.
  4.  **Caveat:** Admit that the Disagreement Point is arbitrary. Suggest setting $d$ to the performance of a "null model" (e.g., majority class predictor) to anchor the gains, but acknowledge this is a convention, not a truth.

  The "axiom swap" is elegant math, but in the mud of non-convex, noisy, human-designed loss landscapes, **Nash is the only one that doesn't actively break.** KS is too fragile for the non-convex reality of deep learning.
