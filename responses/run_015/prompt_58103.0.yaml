  You are a professional philosopher specializing in Augustine and early Christian ethics. Please reason carefully step by step, starting with a brief brainstorm of the key distinctions before giving your final audit. I am a software engineer with no formal philosophy background. A theologically trained friend summarized Augustine on lying roughly like this: Augustine thought lying is always sinful because words are given to express what we believe to be true, so even a lie to shield an innocent person from a murderer or an obvious joking lie that no one believes is still a lie and a sin, though some lies are less grave than others, and that deliberately misleading someone with technically true statements you expect them to misread counts as lying in exactly the same way as stating what you believe to be false. The last claim puzzles me because I deal with placeholder UI text and evasive error messages at work. Is my friend's summary fair? Please separate what is accurate, what is a common simplification, and what Augustine would actually reject, and say whether his strict verdict on lying to save a life still follows once the summary is corrected.
