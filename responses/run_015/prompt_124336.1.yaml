answer: |-
  This is a crisp formulation of the **Causal Exclusion Argument** for Mereological Nihilism, effectively combining Quinean parsimony with the causal closure of the physical. It's a argument that has kept many metaphysicians awake at night (or employed, depending on your perspective). You've correctly identified that the pressure point lies between your methodological rule (1) and the physicalist intuition (2).

  Here is the breakdown of where the argument breaks, why it seduced you, and the price of the other exits.

  ### The Hole: The Inference from (2) to (3)

  You should reject the transition **(2)->(3)**.

  **Why it looked fine:**
  This step relies on the **Causal Exclusion Principle**: *If an event has a sufficient physical cause, it has no other distinct cause (unless it is a case of overdetermination).* Since (2) establishes that the parts are sufficient for the causal powers, (3) intuitively follows that the whole is "left out" of the causal chain. It treats the relationship between whole and parts as a competition for causal credit, like two people trying to lift the same box. If the atoms lift it, the table didn't.

  **Why it fails:**
  The inference fails because it assumes **distinctness** where there is **constitution**. The table is not a *rival* cause to the atoms; the table *is* the atoms arranged tablewise. When the atoms exert force, *the table* exerts force. It is not a case of overdetermination (two causes for one effect); it is a case of **causal relevance via constitution**.

  By rejecting (2)->(3), you can maintain that the composite *does* do causal work, precisely *because* its parts do. The whole inherits the causal powers of the parts without adding "spooky" extra powers. This allows you to keep the causal closure of physics (2) without eliminating the table (4). You avoid the "competition" model of causation in favor of a "hierarchical" or "constitutive" model.

  ### The Costs of the Other Ways Out

  **1. Rejecting (1) [The Ontological Criterion]**
  *   **The Move:** You deny that existence requires unique explanatory power. You allow entities into your ontology even if they are causally redundant, perhaps because they are indispensable to our *conceptual* scheme or language.
  *   **The Cost:** You lose your primary weapon against **Universalism** (the view that *any* scattered collection of objects composes a whole). If existence doesn't require unique causal work, what stops you from accepting "trout-swarms" (the object composed of a trout and a swarm of bees)? You would need a new principle to restrict composition, or you must accept that reality is vastly more crowded than physics suggests. Given you wrote this to wind up a realist, you likely value the leverage (1) gives you against arbitrary objects.

  **2. Rejecting (2) [Causal Closure/Supervenience]**
  *   **The Move:** You assert that composites have **emergent causal powers** that are not fixed by their parts. The table can do something the atoms, individually or collectively, could not do.
  *   **The Cost:** This is scientifically expensive. It violates the **Causal Closure of the Physical**, implying that physics is not a complete description of causal interactions. It opens the door to strong emergence, dualism, or vitalism. For a third-year seminar, this is a hard sell unless you are prepared to argue that quantum mechanics or complex systems theory leaves room for downward causation that violates physical determinism.

  **3. Accepting your Friend's Move [Rejecting (4)'s literal force]**
  *   **The Move:** You accept the nihilist conclusion for *fundamental* ontology but allow a derivative sense of existence for everyday objects (Ontological Pluralism).
  *   **The Cost:** You admitted this feels like "changing the subject." The cost is **deflationism**. You have to accept that when we say "tables exist," we are speaking loosely or practically, not literally. This creates a two-tiered reality: the "serious" world of simples and the "folk" world of tables. While philosophically respectable (see Ted Sider), it concedes the main point to the nihilist: strictly speaking, there are no tables. It sacrifices the robust reality of the macroscopic world to save the fundamental physics.

  ### Summary

  Your friend's solution saves the phenomena by downgrading their ontological status. Your argument tries to save the ontology by eliminating the phenomena. The best path is to show that the elimination doesn't follow. By rejecting the move from (2) to (3), you deny that causal sufficiency of parts entails causal exclusion of the whole. This preserves the reality of people and tables without violating physics or bloating your ontology with idle posits.

  Verdict: (2)->(3)
