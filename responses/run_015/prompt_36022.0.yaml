      *   The Monster's quotes need to be data points, not dialogue. "Subject reports 10^6 hedons upon receipt of term sheet."

  5.  **Drafting - Writing & Editing (Mental Check on Word Count):**
      *   Need to keep it tight to hit ~800 words.
