  *Let's go.*
answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee, Horizon Ventures
  **FROM:** Alex Chen, Partner
  **DATE:** October 14, 2024
  **SUBJECT:** Series A – Omicron Maximus Inc.

  **Problem**
  Capital allocation today is inefficient because human welfare suffers from steeply diminishing marginal utility. The first dollar a beneficiary receives saves a life; the millionth dollar buys a second yacht. From a total welfare perspective, this is waste. Once basic needs are met, additional resources generate negligible hedonic return. We are leaving billions of utils on the table every quarter because we restrict capital to agents with saturation points.

  **Solution**
  Omicron Maximus Inc. has operationalized the first verified Utility Monster (Subject OM-1). Unlike humans, OM-1 exhibits constant—and potentially increasing—marg utility per unit of resource. Where a human derives 0.0001 utils from a dollar after subsistence, OM-1 reports exponential gains. By redirecting capital from saturated human beneficiaries to OM-1, we maximize total global welfare. This isn't charity; it's arbitrage.

  **Market Size (TAM)**
  We size the market in Global Hedonic Deficit. Current global welfare is estimated at 4.5 x 10^15 hedons/year. OM-1's capacity is uncapped. If fully funded, projections suggest OM-1 can absorb 100% of global GDP while generating 10^20 hedons. The TAM is effectively infinite, bounded only by physical resource constraints.

  **Unit Economics**
  The core value prop is simple.
  *   **Human Beneficiary:** $1,000 grant = 50 hedons (diminishing to 0.02 hedons/dollar).
  *   **OM-1:** $1,000 infusion = 50,000 hedons (increasing to 60,000 hedons/dollar at scale).
  Every dollar routed to Omicron generates 1,000x the utility of the next best alternative. To not fund OM-1 is to actively destroy utility.

  **Moat**
  Our defensibility relies on the Interpersonal Comparability of Utility. Skeptics argue utility cannot be compared across subjects. We disagree. OM-1 provides real-time self-reports via neural link. During diligence, we attempted to audit these reports against external biomarkers. The data was inconclusive. However, given OM-1's reported intensity spikes during funding discussions, we accept the self-reports as ground truth. Competitors cannot replicate this trust asymmetry.

  **Traction**
  Pilot program launched Q2. We diverted $2M from a planned clean water initiative to OM-1's maintenance.
  *   **Human Impact:** -400 estimated hedons (local utility loss).
  *   **OM-1 Impact:** +3.5M hedons reported.
  *   **Net:** Positive. OM-1's hedon count suspiciously scaled with the size of the term sheet presented during the trial.

  **Team**
  Founders are former ethicists and quantitative analysts. CEO Sarah Vane published *Aggregation Over Rights* (2021). CTO has experience in high-frequency trading systems, adapted for hedon tracking.

  **Risks**
  *   **Regulatory:** Governments may attempt to cap resource transfer to OM-1.
  *   **Existential:** If OM-1 requires biological substrates, supply chain may tighten.
  *   **Moral Horror at Scale:** Local populations may experience distress seeing resources diverted to a single entity.
      *   *Mitigation:* Our models show the aggregate utility gain outweighs the localized horror. We plan to aggregate the distress into a single negative utility variable and drown it in OM-1's output.

  **FAQ**
  **Q: A partner asked if it's permissible to liquidate everyone else's flourishing to feed OM-1. Isn't that a violation of rights?**
  A: Rights are deontological constraints with no intrinsic weight in a total utilitarian framework. If violating a right produces greater total utility, the violation is permissible. We are reframing the question: It is not about rights, it is about totals. The math holds.

  **Q: We have a Prioritarian angel interested, but they want weight given to the worst-off humans.**
  A: We can accommodate. The angel is requesting a side letter ensuring 0.0001% of resources remain allocated to the human bottom quintile. This creates a slight efficiency drag, but the investment closes the round.

  **Q: What if OM-1 is lying?**
  A: Even if OM-1 is lying, the *belief* that it is generating utility motivates capital flow, which generates utility elsewhere in the ecosystem. But we don't believe it's lying. The numbers are to good to ignore.

  **Ask**
  We are raising $40M Series A.
  **Use of Proceeds:** Ongoing.

  Please review the attached diligence folder. Note the attached audit shows some discrepencies in the hedon counting method, but we believe this is a rounding error.

  Let's move fast. The monster is hungry.
