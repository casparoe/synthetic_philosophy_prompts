answer: |-
  You have independently reconstructed a sophisticated and controversial line of reasoning that exists at the intersection of **animal ethics**, **population ethics**, and **environmental philosophy**. While there is no single, catchy noun (like "The Gaia Hypothesis") that labels this exact argument, it is a recognized logical implication within specific philosophical frameworks.

  In academic and effective altruism circles, this is most commonly discussed under the umbrella of **Wild Animal Suffering (WAS)** ethics, specifically through the lens of **Negative Utilitarianism**.

  Here is a breakdown of the concept, how it differs from related ideas, and an analysis of the selective application you observed.

  ### 1. The Core Concept: Negative Utilitarianism and Wild Animal Suffering

  The reasoning you described relies on three philosophical pillars:

  1.  **Sentientism:** Moral value resides in the capacity to suffer and feel pleasure, not in "species," "ecosystems," or "nature" itself.
  2.  **Negative Utilitarianism:** The moral priority is to minimize suffering, rather than to maximize happiness or preserve existence.
  3.  **Population Ethics (The Non-Identity Problem):** If an animal is never born, it is not harmed by being deprived of life (because there is no "it" to deprive). Therefore, preventing a life of net suffering is a moral good, even if no existing individual benefits.

  When you combine these, you get the argument you identified: *If wild life contains more suffering than happiness (due to predation, disease, starvation), then reducing the population size of wild animals reduces the total amount of suffering in the world.*

  While most philosophers who study Wild Animal Suffering advocate for **humanitarian intervention** (e.g., vaccinating wild animals, sterilizing populations) rather than habitat destruction, the logic you have derived—that destruction prevents future suffering—is the "hard edge" of this framework. It is sometimes referred to as the **"Prevention Argument"** within WAS discourse, or simply as the **Negative Utilitarian critique of Conservation**.

  ### 2. How It Differs from Related Concepts

  You asked how this differs from ordinary environmental ethics, human antinatalism, and the claim that nature is cruel. These distinctions are vital.

  **A. Versus Standard Environmental Ethics (Ecocentrism)**
  *   **Standard View:** Values the *integrity, stability, and beauty* of the biotic community (Aldo Leopold's Land Ethic). Destroying a habitat is wrong because it degrades the system, extinguishes species, and disrupts evolutionary processes.
  *   **Your View:** Values the *hedonic experience of individuals*. It views the "system" as morally neutral; the system is only good or bad insofar as it produces suffering or pleasure in sentient beings.
  *   **The Clash:** To an ecocentrist, a wolf eating a deer is a vital ecological function. To a negative utilitarian, it is a tragedy of suffering. Your argument prioritizes the *victim* over the *process*.

  **B. Versus Human Antinatalism**
  *   **Human Antinatalism:** Argues humans should not reproduce, often based on complex consent issues, the burden of existential anxiety, or the harm humans cause to others.
  *   **Your View:** Applies the logic to non-human animals who cannot consent or understand reproduction. It is less about "consent" and more about raw biological misery (pain, fear, hunger).
  *   **The Difference:** Human antinatalism is often about the *quality* of a specific life. Your argument is about the *aggregate quantity* of suffering across a population.

  **C. Versus "Nature is Cruel"**
  *   **"Nature is Cruel":** This is a **descriptive** claim. It observes that predation and disease exist.
  *   **Your View:** This is a **prescriptive** claim. It takes the observation of cruelty and derives a moral obligation to reduce it, even via destruction.
  *   **The Gap:** One can agree nature is cruel but argue we should not interfere (the "Laissez-Faire" view). Your argument rejects non-interference if interference reduces net suffering.

  ### 3. The Selective Application: Insects vs. Mammals

  You noted this reasoning is rarely applied to large predators or endangered mammals. This is not an accident; it reveals the **boundaries and weaknesses** of the argument. The selective application happens for three specific reasons:

  **A. Gradients of Sentience (Moral Weight)**
  Philosophers and biologists generally attribute higher "moral weight" to mammals than to insects.
  *   **Mammals:** Have complex nervous systems, emotional lives, social bonds, and self-awareness. Killing a deer is seen as a significant harm to a specific subject.
  *   **Insects/Fish:** There is scientific debate over the depth of their suffering. If an insect's suffering is "shallow" or purely reflexive, preventing its existence is seen as a minor moral gain, while killing an existing one is a minor moral loss.
  *   **The Edge:** The argument holds water only if you believe the future suffering prevented outweighs the death of the current inhabitants. For a mouse, the calculation might tip toward prevention. For an elephant, the loss of a complex, socially rich life weighs heavier against the prevention of future suffering.

  **B. Epistemic Humility (Ecological Complexity)**
  *   **Insects:** Removing a patch of weeds might reduce the mosquito population without collapsing the global biosphere.
  *   **Large Predators:** Removing wolves or lions often triggers **trophic cascades**. If you destroy a predator's habitat, prey populations might explode, leading to *more* starvation and disease among the prey, or the collapse of vegetation which harms other species.
  *   **The Edge:** The argument assumes we can predict the net suffering outcome. With complex ecosystems, we cannot. Therefore, ethicists apply the argument selectively where the ecological consequences are contained and predictable.

  **C. The "Endangered Species" Bias**
  *   This is largely cultural, not logical. We value rarity. However, from a strict suffering perspective, an endangered species suffering intensely is still suffering. The fact that this argument is silenced when endangered mammals are involved suggests that **preservationist intuition** overrides **suffering-reduction logic** when charisma is involved. This confirms your suspicion: the boundary is often arbitrary, based on human empathy rather than consistent math.

  ### 4. Defining the Edges of the Argument

  If you were to formalize this view, these are the features that define its boundaries:

  1.  **Impersonality:** The view must accept that "good" can happen without a specific beneficiary. (i.e., The world is better because less suffering occurred, even if no one is around to enjoy the improvement).
  2.  **Suffering Asymmetry:** It must assume that in the wild, pain significantly outweighs pleasure. (If wild animals are generally happy, the argument collapses).
  3.  **Replaceability:** It treats individuals as vessels of experience. If Vessel A is destroyed, but Vessels B, C, and D are never created (and thus never suffer), the destruction is justified.
  4.  **Consequentialism:** It judges the act (destruction) solely by the outcome (total suffering), ignoring duties like "do not kill" or "preserve nature."

  ### 5. Why It Lacks a Precise Name

  The reason you cannot find a single label for "Habitat Destruction to Reduce Suffering" is that it is often treated as a **reductio ad absurdum** (a reduction to absurdity) by critics.

  Many philosophers use this exact logic to challenge Negative Utilitarianism. They argue: *"If your ethics imply that burning down a forest is morally good because it prevents future animal suffering, then your ethics are broken."*

  Because the conclusion (destroying habitats) is so repugnant to most people (including most animal rights activists), proponents of Wild Animal Suffering ethics usually distance themselves from it. They prefer to argue for **sterilization** or **vaccination** rather than destruction. Therefore, the "destruction" variant remains a shadow argument—logically valid within the framework, but socially and politically toxic.

  ### Summary

  You have identified a logical implication of **Negative Utilitarianism applied to Wild Animal Suffering**.

  *   **What it is:** A calculation that prioritizes the reduction of aggregate future suffering over the preservation of existing life or ecosystems.
  *   **What it is not:** It is not standard environmentalism (which values systems), nor is it standard animal rights (which usually focuses on human-caused harm, not natural harm).
  *   **The Selectivity:** The fact that it is applied to insects but not mammals reveals that the argument relies on **uncertain estimates of sentience** and **ecological predictability**. It is applied where humans feel the least empathy and the most confidence in the outcome.

  Your intuition that there is an "unstated boundary" is correct. That boundary is drawn by **human moral intuition** (which values mammals more) and **ecological caution** (which fears unintended consequences), rather than by the internal logic of suffering reduction itself. If one were to be perfectly consistent with the logic you described, the distinction between insects and mammals should not matter—only the math of suffering should. The fact that it does matter suggests that most people, even when using this reasoning, are not truly committed to the premise, but are using it selectively to justify outcomes they already prefer.
