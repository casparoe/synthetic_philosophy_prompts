answer: |-
  Hi there,

  It is really fascinating that you sat in on that committee, and honestly, your intuition that the code is a patchwork of conflicting moral theories is spot on. When you lay out the clauses like that, it becomes clear that the document isn't deriving from a single coherent philosophy of sport or fairness. Instead, it looks like a pragmatic compromise designed to satisfy several different moral intuitions simultaneously while remaining enforceable. If I had to reconstruct the single implicit view that tries to hold this all together, I would say it presupposes a concept of the athlete as a fixed historical entity whose natural potential is defined by a specific moment in time, protected by medical authority, and constrained by social equity. But that unity is fragile. The code is trying to protect the integrity of the competition by preserving the status quo of the human body, but it keeps changing its mind about what defines that status quo.

  The tension you noticed between the therapy clauses is the biggest crack in the foundation. You have the exemption clause which relies on medical authority, saying a diagnosis legitimizes the substance. Then you have the baseline clause which relies on individual history, saying only what you were before counts as legitimate. Then you have the deficiency clause which relies on population statistics, saying what is normal for a healthy adult counts as legitimate. These are three different definitions of normalcy. A single coherent view would have to pick one. If the view was strictly about health, the diagnosis clause would dominate and the baseline wouldn't matter. If the view was strictly about preserving the specific individual's natural talent, the baseline clause would dominate and population statistics wouldn't matter. The fact that all three exist suggests the code is underdetermined. It allows administrators to pick the justification that fits the case rather than applying a consistent rule. The only thing strictly required by any view that generates these rulings is the desire to distinguish between restoring a function and creating a new one, but the code fails to define where that line is consistently. It wavers between restoring health, restoring history, and restoring statistical normality.

  The enforcement clause is actually the glue that keeps this contradictory package from falling apart. By punishing presence rather than advantage, the code admits that it cannot reliably measure fairness in every instance. It shifts from a consequentialist view, where the wrong is gaining an unfair edge, to a deontological view, where the wrong is breaking the rule. This is necessary because if you had to prove advantage for every violation, the conflicting definitions of therapy and baseline would make enforcement impossible. You would need a court case for every sample to determine which theory of normalcy applied. So the strict liability rule is the only part that is truly required for the system to function administratively, even if it contradicts the stated goal of fairness. The rest of the clauses are comfortable bedfellows that agree in most cases but diverge in the edge cases you are worrying about.

  The availability clause and the consistency clause introduce entirely different ethical frameworks that don't fit neatly with the restoration model. The availability clause is about socioeconomic fairness. It assumes that inequality derived from wealth is worse than inequality derived from biology. This contradicts the baseline clause, which protects biological inequality. If I was born with a deficiency and you weren't, the baseline clause says I can only return to my low baseline, while the availability clause suggests I should have access to whatever you have if it is cheap. The consistency clause is even stranger because it makes a teleological claim about what the sport is for. By allowing a compound that removes off-days but bans one that raises peaks, the code asserts that the sport is a test of maximum capacity, not reliability. This is a specific philosophical choice about the nature of excellence that has nothing to do with health or access. It suggests the code is trying to preserve a specific kind of drama in the competition, prioritizing the spectacle of the peak performance over the consistency of the worker.

  If you dropped the therapy and enhancement distinction and rebuilt the code around health and safety plus equal access, the code would look radically different. The therapeutic exemptions would survive but would be expanded to anything safe, regardless of diagnosis. The baseline clause would likely disappear because if the goal is health, returning to a pre-injury state is less important than ensuring the athlete is not harmed. The external energy ban might flip if the machine was safe and available to all, since the objection would shift from unnaturalness to safety and access. The consistency compound would definitely survive. The enforcers would no longer measure substances in samples but would instead need to measure health outcomes and socioeconomic access levels. They would have to audit supply chains and medical records rather than urine samples. The wrong would no longer be use, but harm or exclusion.

  If you rebuilt it around levelling the natural lottery, which is a radical egalitarian view, almost everything would flip. The baseline clause would be abolished because your pre-injury state is just another accident of the natural lottery that shouldn't be protected. The deficiency clause would become the primary rule, but it would be used to mandate treatment for everyone to bring them up to the top percent, not the bottom. The availability clause would become the central organizing principle, banning anything not universally accessible regardless of safety. The consistency compound might be banned if it gave some athletes a psychological edge in reliability that others couldn't afford. Enforcers would have to measure genetic profiles and socioeconomic status to ensure everyone started from the same physiological and material baseline. The focus would shift from policing the body to policing the environment.

  If you rebuilt it around capping total advantage regardless of source, which is a utilitarian approach to competition, the therapy distinction would vanish entirely. It wouldn't matter if you were sick or healthy, only where you stood relative to the cap. The baseline clause would disappear because history is irrelevant to the current output. The external energy ban would disappear unless the machine pushed you over the cap. The consistency compound would be treated exactly the same as a peak enhancer, calculated by its contribution to total expected value over a season. Enforcers would have to stop testing for substances and start measuring performance metrics directly. They would need to monitor output in training and competition to ensure no one exceeded the advantage ceiling. This would turn sport into a handicapped race where the goal is to manage your allowance of advantage rather than to push the limits of the human body.

  What strikes me most about the code you described is that it is trying to have it both ways. It wants to protect the individual story of the athlete through the baseline clause, but it also wants to protect the social integrity of the sport through the access clause. It wants to respect medical authority through the exemption clause, but it wants to respect statistical reality through the deficiency clause. These are noble goals, but they are not compatible without the heavy hand of the enforcement clause to shut down debate. The code presupposes that the natural athlete is a stable category, but your analysis shows that the natural is being defined by doctors, by historians, by statisticians, and by economists all at once. The only thing that remains constant is the prohibition itself. It seems the committee decided that maintaining the boundary was more important than agreeing on why the boundary existed. They prioritized the existence of a rule over the coherence of the reason for the rule.

  I think the bit that is most underdetermined is the relationship between the deficiency clause and the baseline clause. If an athlete is statistically deficient but historically high performing, which rule wins? The code doesn't say, which means it relies on the discretion of the committee to resolve cases ad hoc. This suggests the code is not a logical system but a legal one, designed to give authorities enough flexibility to manage public perception rather than to enforce a strict moral truth. The consistency clause is the outlier that suggests someone on the committee was thinking deeply about the phenomenology of sport, but it sits awkwardly next to the crude binary of the prohibited list.

  In the end, the package presupposes that sport is a fragile social construct that needs protection from both biology and economics, but it lacks a theory of which threat is more dangerous. It treats the body as something to be repaired but not improved, yet it defines repair in three incompatible ways. It treats fairness as both equal opportunity and equal outcome, depending on which clause you read. The only consistent thread is the desire to maintain the status quo of what sport looks like, using whatever philosophical justification is necessary to ban the new thing. If you want to find the real philosophy, look at what gets banned rather than what gets permitted. The code is defined by its exclusions, and those exclusions are motivated by a fear of changing the nature of the contest more than they are by a commitment to any specific definition of health or fairness.

  Hope that helps untangle some of what you were seeing. It is rare to get a look behind the curtain at how these things are actually stitched together, and it sounds like you witnessed the exact moment where the philosophy broke down and the lawyering took over. Let me know if you want to dig deeper into any of those alternative frameworks.

  Best,

  Friend
