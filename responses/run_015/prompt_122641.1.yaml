      *(Drafting thought)*: I need to be careful not to introduce headings. I will use paragraph breaks to signal shifts in topic.

      *(Drafting thought)*: I need to make sure I address the "required vs. contingent" part clearly. The enforcement mechanism is likely the most "required" for the system to function given the philosophical contradictions.

      *(Drafting thought)*: When discussing alternative frameworks, I need to be specific about which clauses survive.
      *   Health/Safety: TUE survives. Baseline might go. External energy might survive if safe. Enforcement changes to harm.
      *   Natural Lottery: TUE goes (unless it levels). Baseline goes. Access becomes paramount.
      *   Cap on Advantage: Consistency clause survives. Baseline goes. Enforcement changes to performance metrics.

      *(Final Review)*: Does this look like a long email? Yes. No formatting violations? Looks good.

  6.  **Final Output Generation** (incorporating the above thoughts into the final text).
