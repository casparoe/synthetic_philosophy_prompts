prompt: |-
  I'm on the grants committee of a small longtermist foundation — we give out a few million a year, mostly AI safety, biorisk, a couple of institutional-resilience things, and one standing line for research on how to weigh the very long run at all. Last night my housemate and I got into a two-hour fight about whether we're living in a simulation and whether that should make us less fanatical about the far future, and I now have to turn that into an actual decision document.

  The concrete case: a two-person team has applied for ~$180k to spend eight months writing us an internal report answering exactly that question. Their pitch, roughly: (1) if we're in a simulation, there's a real chance it gets shut down or reset long before anything like a billion-year future plays out — whoever is running it probably wants results on a short horizon, not the whole history — so the expected number of future people is much smaller than our models assume; (2) whatever we do inside the sim may not propagate to whatever base reality is running it, so "protect the long run" work could turn out to be locally-only; (3) but they insist it cuts the other way too, because a base civilization running lots of sims means there are probably far more morally relevant beings than we assumed when we did our headcounts, so maybe the future gets bigger, not smaller. And one of our own board members has already emailed saying that if simulated experiences count at all, a short sim densely packed with people isn't obviously worse than a long empty one — it's just different, and she doesn't see why that lowers the priority.

  Half the committee thinks this is metaphysics cosplay with restricted funds, and that even asking has a cost: once "maybe we're simulated" is on the table as a budget line, every grant gets a speculative haircut and nothing gets funded. The other half thinks that if there's even a 15% chance of point (1), it swamps every cause-prioritization disagreement we've ever had, and refusing to look is just motivated reasoning to protect the portfolio.

  Draft the memo I circulate Thursday: a clear recommendation — fund, don't fund, or fund with conditions, and if conditions, what they'd have to actually deliver — plus the reasoning, and a genuinely fair statement of the strongest version of whichever side you're rejecting, so the losing side reads it and thinks they were heard rather than steamrolled. Please dont just say the simulation argument is unfalsifiable; that's the thing my housemate kept repeating and it settled nothing.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Grants Committee Member of a small longtermist foundation.
      *   **Context:** Foundation gives a few million/year (AI safety, biorisk, institutional resilience, long-termism methodology).
      *   **Trigger:** A fight with a housemate about simulation theory (Sim Theory) and its impact on longtermism, leading to a grant application.
      *   **The Application:** 2-person team, ~$180k, 8 months, internal report on "Does Sim Theory change our longtermist priorities?"
      *   **Applicants' Arguments:**
          1.  Sim might end early (horizon problem).
          2.  Actions might not propagate to base reality (impact problem).
          3.  Counter-point: Base civ running sims = more moral patients (scale problem).
      *   **Internal Conflict:**
          *   Side A (Skeptics): Metaphysics cosplay, restricted funds misuse, creates decision paralysis ("speculative haircut").
          *   Side B (Proponents): 15% chance swamps all other cause prioritization, refusing to look is motivated reasoning.
          *   Board Member Note: Simulated experiences count morally; short/dense != long/empty necessarily.
      *   **Task:** Draft a memo for Thursday circulation.
      *   **Requirements:** Clear recommendation (Fund/Don't Fund/Conditional), reasoning, steelman of the rejected side.
      *   **Constraint:** Do *not* just dismiss it as "unfalsifiable" (the housemate's unhelpful point).

  2.  **Determine the Recommendation:**
      *   *Option 1: Full Fund ($180k).* Risks validating the "metaphysics cosplay" critique. $180k is significant for a small foundation (likely 5-10% of the budget). It sets a precedent that could paralyze future decision-making.
      *   *Option 2: Don't Fund.* Risks ignoring a potentially high-value uncertainty. If Sim Theory is true, it *does* break longtermism. Ignoring it looks like dogmatism.
      *   *Option 3: Conditional/Scoped Fund.* This is the pragmatic middle ground. Acknowledge the importance of the *decision-relevance* without endorsing a deep dive into metaphysics for its own sake. Reduce the budget, tighten the scope to *action-guidance* rather than *truth-seeking*.
      *   *Decision:* **Fund with Conditions (Scoped Pilot).**
      *   *Why?* It addresses the "motivated reasoning" critique by taking the uncertainty seriously, but addresses the "paralysis/cosplay" critique by strictly bounding the inquiry to *decision-theoretic impact* rather than ontological truth. $180k is too high for an 8-month internal report on a philosophical question. A smaller amount ($50k-$75k) for a tighter scope is more appropriate. Or, fund the full amount but with very strict deliverables that prevent endless navel-gazing.
      *   *Refinement:* Actually, for a small foundation, $180k is a lot. A "pilot" approach is better. Recommend funding a *phase 1* scoping exercise or reducing the scope/budget significantly. However, the prompt asks for a clear recommendation on *this* application. Let's go with **Fund with Strict Conditions & Reduced Scope/Budget**. It shows seriousness without opening the floodgates.
      *   *Wait, reconsidering:* If I recommend funding, I need to make sure the "Skeptics" feel heard. If I recommend *not* funding, the "Proponents" feel ignored. The best path for a committee memo is often "Fund, but narrowly."
      *   *Actually, the strongest strategic move:* **Fund with Conditions.** But the conditions must be hard. The deliverable isn't "Are we in a sim?" (unanswerable). The deliverable is "Under what specific empirical conditions does Sim Theory change our grantmaking *today*?"
      *   *Budget:* $180k for 2 people for 8 months is ~$110k/person/year. That's high for a philosophical report. I should recommend negotiating this down or splitting it. Let's recommend **Funding at a Reduced Level ($75k) for a Tighter Scope.** This signals "We take the uncertainty seriously, but not seriously enough to bet 5% of our annual budget on metaphysics."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** The recommendation upfront.
      *   **Context:** Briefly state the application and the internal debate.
      *   **The Core Question:** Reframe from "Are we in a sim?" to "Is this uncertainty decision-relevant?"
      *   **Argument for Funding (Steelman for Proponents):** Acknowledge the 15% risk. If true, it invalidates the current portfolio. Ignoring it is dogmatic.
      *   **Argument against Funding (Steelman for Skeptics):** Acknowledge the risk of paralysis. "Metaphysics cosplay." Opportunity cost. The Board Member's point (moral weight of sims) needs to be integrated here as a nuance.
      *   **Recommendation & Rationale:** The "Conditional Fund."
      *   **Conditions/Deliverables:** This is crucial. They can't just write a paper. They need a decision matrix.
      *   **Next Steps:** Negotiation.

  4.  **Refining the Arguments (Avoiding "Unfalsifiable"):**
      *   Instead of "It's unfalsifiable," focus on "It lacks *leverage*." Even if we are in a sim, do we know the *parameters* of the sim well enough to act differently?
      *   Address the Board Member's point: If simulated lives count, the "shutdown" risk is less bad if the density is high. The report must address *moral status*, not just *ontological status*.

  5.  **Tone Check:**
      *   Needs to be professional, charitable, decisive, and pragmatic.
      *   Avoid sounding dismissive of the Proponents (they have a valid point about expected value).
      *   Avoid sounding dismissive of the Skeptics (they have a valid point about organizational mission creep).
      *   Acknowledge the housemate fight implicitly (by treating the seriousness of the question seriously) without making it personal.

  6.  **Developing the Conditions:**
      *   Condition 1: No ontological truth claims. Focus on conditional probability.
      *   Condition 2: Actionability. Must produce a "If X, then we shift Y% of portfolio" framework.
      *   Condition 3: Budget cap. $180k is too high for this uncertainty. Cut to $60k-$80k.
      *   Condition 4: External review. Needs buy-in from the Skeptics.

  7.  **Final Polish:**
      *   Make sure the Board Member's specific point about moral weight is addressed in the reasoning.
      *   Ensure the "speculative haircut" fear is mitigated by the conditions.

      *(Self-Correction during drafting)*: I initially thought about cutting the budget. But if I cut the budget too much, the applicants might say they can't do the work. The real issue isn't money, it's *scope*. I will recommend funding the full amount *only if* the scope is tightened to specific decision-trees. Actually, for a small foundation, $180k is huge. I should recommend a partial fund or a milestone-based release. Let's go with **Milestone-Based Funding**. Release $50k for Phase 1 (Framework), option for remaining $130k only if Phase 1 shows decision-relevance. This protects the foundation from the "black hole" risk.

      *Wait, simpler is better.* Recommend **Funding with Scope Restrictions.** Keep the budget but demand specific outputs. No, $180k for philosophy is hard to justify to skeptics. I will recommend **$75k for a 4-month scoping phase.** If it proves decision-relevant, *then* we consider more. This splits the difference.

      *Actually, looking at the prompt again:* "Draft the memo I circulate Thursday: a clear recommendation."
      Okay, I will recommend **Funding, but with Strict Conditions on Scope and Deliverables.** I won't cut the budget arbitrarily in the memo (that's negotiation), but I will frame the *value* as contingent on specific outputs.
      *Re-evaluation:* If I recommend funding $180k, the Skeptics will revolt. If I recommend $0, Proponents revolt. The best compromise is **Fund a Reduced Scope ($90k)** or **Milestone Based.** Let's go with **Milestone Based.** It shows we are serious but risk-averse.
      *Decision:* I will recommend **Approving the Grant in Principle, subject to a Revised Scope and Milestone Structure.** This allows the committee to vote "Yes" on the *idea* without committing the full cash upfront.

      *Wait, one more thing:* The Board Member's point is crucial. "Short sim densely packed... isn't obviously worse." The memo *must* explicitly mention that the report needs to tackle moral weight, not just duration.

      *Final Plan:*
      1.  **To/From/Subject.**
      2.  **Recommendation:** Approve with Conditions (Milestone-based, Scope-limited).
      3.  **Context:** The application and the debate.
      4.  **Steelman (Pro-Fund):** The Expected Value (EV) argument. 15% chance of total invalidation is too big to ignore.
      5.  **Steelman (Anti-Fund):** The Paralysis & Opportunity Cost argument. Metaphysics doesn't pay bills.
      6.  **Synthesis/Rationale:** We fund the *uncertainty analysis*, not the *metaphysics*.
      7.  **Conditions:** 3 specific deliverables.
      8.  **Closing.**

      *Let's write it.*
