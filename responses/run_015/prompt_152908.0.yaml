      *   *Comparison:* Both deny perceptible necessary connection. *Difference:* Hume is agnostic/skeptical about the ultimate source (nature/mind), Ghazali is theological (God's will). Hume's regularities are brute facts of the world; Ghazali's are contingent acts of Will.
