      *   *Risk:* It might just look like "We can't know anything about the outside, so we can't act." That's skepticism. The user needs to ensure they argue that this *specifically* undermines the *Longtermist project*, not just action in general.
      *   *Key Distinction:* Pascal's Wager is about belief. "Simulator Pascalism" is about *policy optimization* based on uncertain priors about simulator values.

