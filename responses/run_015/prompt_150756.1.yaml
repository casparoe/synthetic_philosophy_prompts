      *   *Correction on Ireland:* I need to be careful. Sen acknowledges Ireland had a FAD component (potatoes), but emphasizes the entitlement failure regarding other food sources. The student says "Direct entitlement failure." That is technically correct for the potato-dependent population. The student's dismissal of the export issue as a "side issue" is the weak point. Sen argues the export proves it wasn't an *aggregate* availability issue for the region, just an entitlement issue for the poor.
      *   *Correction on China:* This is the big differentiator. A top student would know Sen argues China was *not* pure FAD. The student says it *was* pure FAD. This is a significant error in understanding the reading.
      *   *Subtle Flag:* The student defines entitlements as "growing/buying/getting." Sen's definition is more about the *mapping* of legal/economic means. But for an undergrad exam, the simplification is usually acceptable. I will note it but not penalize heavily.
      *   *Subtle Flag:* The student says transfer entitlements in Ireland "didn't matter." They mattered immensely; their absence caused death. The student means "the failure of transfer wasn't the *cause*, the lack of potatoes was." This is a semantic ambiguity that needs flagging.

