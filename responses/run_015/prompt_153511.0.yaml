      *   *Revised Metaphor:* A cathedral? Too religious. A dam? Beavers. Good. A nest? Good. A *promise*? Best. A promise is physical (words/brain) but the *obligation* is the higher-level fact.
      *   *Actually, let's stick to the "Reason" itself.* The reason "Because she asked" is a high-level object.

      *(Final Plan)*:
