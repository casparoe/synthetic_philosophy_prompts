answer: |-
  Here is the script flow for your interview with Dr. Okonjo. The strategy here is to start with concrete empirical cases where her "person-plus-setup" view feels intuitive, then slowly tighten the screws on what counts as a "virtue" versus a "reflex," and finally trap the "fundamental attribution error" deflection by forcing her to admit that if the designer has the virtue, attributing it to them isn't an error.

  ### Interview Script Flow

  **1. The Seminary Study (Time Pressure)**
  Start with the classic Darley and Batson study. Ask why being in a hurry negates character rather than just dividing attention.
  **2. Follow-up (Attention vs. Character)**
  Press on whether virtue is just having enough spare cognitive bandwidth to notice the guy in the doorway.

  **3. The Obedience Experiments (Reliability)**
  Bring in Milgram. The subjects were reliably consistent across the situation, just in a bad direction.
  **4. Follow-up (Local Virtue vs. Local Vice)**
  Ask if her definition of "local virtue" allows a reliable torturer to count as virtuous within that specific setup.

  **5. Scaffold Dependency (Habit vs. Virtue)**
  Ask where the line is between a virtue and a habit if the behavior vanishes when the scaffold is removed.
  **6. Follow-up (Semantic Work)**
  Ask what specific work the word "virtue" is doing if it's just environmental compliance.

  **7. Moral Education (Management)**
  Ask if engineering a child's situations counts as giving them virtue or just managing their behavior.
  **8. Follow-up (Unscaffolded Work)**
  Ask about moments without scripts—improvisation or being alone with a decision—where her machinery seems to have no grip.

  **9. The System Claim (Designer vs. Institution)**
  She says the designer has the virtue. Ask why we stop there and don't just attribute it to the institution itself.
  **10. Follow-up (Software)**
  Push further: if the system enforces the norm, why is it crazy to call the software itself honest?

  **11. The Deflection Trap (FAE One Level Up)**
  Directly address her favorite deflection. If the designer has the virtue, is attributing it to them still an error?
  **12. Falsifiability (Closing)**
  End by asking what evidence would actually change her mind.

