      *   Step (7): *Overstatement.* The dilemma shows majority rule *can* fail, not that it *always* fails or is *inherently* irrational in all contexts. It's a possibility theorem, not an impossibility theorem for every specific case.
      *   Step (8): *False/Contestable.* Majority rule is *not* the only game in town. There are other aggregation rules (premise-based, conclusion-based, dictatorial, etc.). List & Pettit's Impossibility Theorem is more nuanced than "only majority rule exists."
