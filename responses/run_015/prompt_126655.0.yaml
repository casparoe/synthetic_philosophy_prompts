answer: |-
  This is a profound meta-philosophical question. When scholars assert that Frege's *Tagebuch* (diary) is biographically significant but philosophically inert, they are not merely making a pragmatic decision to keep the curriculum manageable; they are enacting a specific, robust ontology of logic and a specific epistemology of philosophical knowledge.

  To bracket Frege's politics is to commit to a cluster of theoretical positions. If you challenge the bracketing, you aren't just doing moral housekeeping; you are challenging the self-image of analytic philosophy. Here is an analysis of the implicit commitments required to maintain that separation.

  ### 1. A Rigid Reichenbachian Distinction
  The most explicit commitment is to Hans Reichenbach's distinction between the **context of discovery** and the **context of justification**.
  *   **The Commitment:** This view holds that the psychological, social, or political circumstances under which a theory is generated (discovery) are categorically distinct from the logical validity or truth of the theory (justification).
  *   **The Implication:** To bracket the diary is to assume that justification is hermetically sealed. It presupposes that a proof in the *Begriffsschrift* can be evaluated without reference to the axioms of value held by the prover.
  *   **The Vulnerability:** This distinction has been under fire for decades. Holists (like Quine) and sociologists of scientific knowledge argue that justification is often retrofitted to discovery. If Frege's drive for "rigor" was motivated by a fear of cultural "decay" or "impurity" (themes present in his nationalism), then the *motivation* for the rigor is entangled with the politics. Bracketing assumes these motivations didn't shape the *structure* of the logic, only the *decision* to write it.

  ### 2. Robust Platonism or Formalist Realism
  To claim logic is immune to the reasoner's character is to assume a specific metaphysics of logical objects.
  *   **The Commitment:** This assumes a form of **Platonism** (logical truths exist independently of human minds) or a strong **Formalism** (logic is a game of symbols governed by rules that are indifferent to semantics).
  *   **The Implication:** If logic is a description of mind-independent abstract structures, then Frege was merely a "scanner" or a "medium." A corrupt scanner can still produce a clear image of a mountain. The truth of $2+2=4$ (or the validity of Modus Ponens) does not depend on the moral virtue of the person asserting it.
  *   **The Vulnerability:** This collapses if you hold a **Pragmatist** or **Social Epistemological** view of logic. If logic is a normative practice embedded in human communities (as Robert Brandom or Jagjit Hodes might argue), then the values of the community (and its founders) constitute the norms. If the founder views certain humans as "irrational" or "sub-human," does that categorization bleed into how "rationality" is defined in the system?

  ### 3. The Atomism of Belief (Compartmentalization)
  The bracketing practice presupposes a psychological model where beliefs are modular and compartmentalized.
  *   **The Commitment:** It assumes **Doxastic Atomism**: the idea that one can hold vicious ethical/political beliefs in one "box" of the mind while maintaining pristine epistemic standards in another.
  *   **The Implication:** It assumes that antisemitism is a specific belief about Jews, not a *mode of thinking* that affects categorization, generalization, and essentialism.
  *   **The Vulnerability:** This is where the **Epistemic Contamination** argument hits hardest. Virtue epistemologists argue that intellectual vices (closed-mindedness, arrogance, prejudice) are character traits, not isolated beliefs. If Frege possessed the intellectual vice of essentialism (believing in fixed, hierarchical natures of things), that vice could easily migrate from his politics (fixed natures of races) to his semantics (fixed senses of terms). To deny this is to assume that "logic" is a vacuum-sealed chamber where character traits cannot enter.

  ### 4. The Autonomy of Syntax over Pragmatics
  In the philosophy of language, this bracketing privileges **Semantics/Syntax** over **Pragmatics**.
  *   **The Commitment:** It assumes that the meaning of a logical constant or the validity of an inference is determined entirely by its formal properties, not by its use in a form of life.
  *   **The Implication:** Frege's logic is treated as a tool that, once forged, can be used by anyone for any purpose. The "use" of the logic by the Nazi regime (which did happen) is seen as an external application, not an internal feature.
  *   **The Vulnerability:** If you take Wittgenstein seriously ("meaning is use"), the context matters. If Frege designed his logic to purify thought, and his conception of "purity" was racially coded, the logic itself might carry the scar of that intention. Defenders must argue that logic is *sui generis*—unlike ethics or politics, it has no "content" that can be corrupted.

  ### 5. Inconsistency in Treatment (The Heidegger Problem)
  You asked if this is consistent with how we treat other figures. Generally, it is not, which reveals a bias toward **Formalism**.
  *   **The Comparison:** We struggle to read Heidegger's *Being and Time* without reference to his Nazism because his ontology (authenticity, destiny, peoplehood) is conceptually porous to his politics. However, we treat Frege differently.
  *   **The Commitment:** This implies a hierarchy of philosophical sub-disciplines. It assumes **Logic is harder/more objective than Ontology**. It suggests that formal systems have a "truth preservation" mechanism that natural language philosophy lacks.
  *   **The Vulnerability:** This assumes that formalization successfully scrubs ideology. But formal systems require primitive terms and axioms. If the *intuition* behind the axioms is ideological (e.g., a desire for absolute order), the formalism merely codifies the ideology. Treating Frege as "safe" compared to Heidegger assumes that mathematical notation acts as a filter that removes human bias, which is a contentious claim in the philosophy of mathematics (see Penelope Maddy or feminist critiques of math).

  ### 6. The Implicit Theory of Knowledge: "The View from Nowhere"
  Ultimately, the practice of bracketing smuggles in a **Disembodied Theory of Knowledge**.
  *   **The Theory:** It assumes that philosophical knowledge is cumulative, objective, and agent-neutral. It treats the history of philosophy as a quarry from which we extract timeless blocks of truth, leaving the dirt (the biography) behind.
  *   **The Alternative:** A **Situated Epistemology** would argue that knowledge is produced by embodied agents in specific historical contexts. On this view, you cannot fully understand *why* Frege sought to reduce arithmetic to logic without understanding his fear of relativism and psychologism, which may have been fueled by his conservative nationalism.
  *   **The Cost:** By bracketing the diary, we preserve the **Normative Force** of Frege's logic (it binds us regardless of who he was), but we lose the **Hermeneutic Depth** of his project (what the logic was *for*).

  ### Conclusion: Can a Defender Respond?
  A defender of the bracketing practice can make a coherent case, but they must commit to **Logical Exceptionalism**. They must argue:
  1.  **Normativity:** Logic is normative (how we *ought* to think), not descriptive (how we *do* think). Therefore, the psychologist's fallacy applies: Frege's bad character describes *him*, not the *laws* he found.
  2.  **Success Conditions:** The success of logicism (or the sense/reference distinction) is determined by whether it solves technical problems (e.g., Russell's Paradox, identity statements), not by the moral worth of the solver.

  However, if you accept **Epistemic Contamination**, the bracketing collapses. If you believe that a commitment to racial hierarchy warps one's ability to conceptualize "universality" or "equality" (even in the logical sense), then Frege's logic is not a neutral tool; it is a artifact of a specific, compromised worldview.

  To say the diary is "philosophically irrelevant" is to assert that **truth is independent of the community of inquirers.** To say it is "relevant" is to assert that **logic is a human practice, and practices bear the marks of their practitioners.** The Frege debate is rarely about Frege; it is a proxy war between Platonist Realism and Social Pragmatism.
