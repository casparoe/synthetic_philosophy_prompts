answer: |-
  Democratic backsliding survives as a coherent analytical category only if we anchor it non-negotiably in the intentional degradation of electoral contestation through legal instruments, explicitly rejecting substantive definitions that inevitably collapse into partisan accusation. To function as a tool of comparative politics rather than a moralistic cudgel, the concept must satisfy three indispensable criteria while treating a fourth as contingent upon specific theoretical commitments.

  First, the operationalisation must be procedurally minimal rather than substantively liberal. This is non-negotiable. If we define backsliding by the erosion of minority rights or social justice, we cannot distinguish between undemocratic institutional capture and unpopular but democratically enacted policy shifts. The Hungarian case under Fidesz illustrates this necessity: Orbán's government altered the constitution and media laws through parliamentary supermajorities, not coups. A theory that labels this backsliding must do so because it impaired future electoral competition, not because it pursued illiberal social policies. If we conflate policy outcomes with procedural integrity, every conservative victory becomes potential backsliding, rendering the concept useless for cross-national analysis. This requirement aligns with the liberal-proceduralist camp and must override substantive-democratic preferences.

  Second, the framework must account for degradation achieved through formal legal channels. This is non-negotiable. Classic coup literature focuses on extra-constitutional seizures of power, yet the Polish Law and Justice party's judicial overhaul demonstrates how ruling parties can dismantle checks and balances using existing legislative procedures. A viable theory must recognise that legality does not equal legitimacy in democratic terms; if the law is used to insulate incumbents from accountability, it constitutes backsliding. This distinguishes institutional decay from ordinary constitutional hardball, where parties push boundaries but accept the risk of electoral punishment. The Turkish transition via emergency decrees further complicates this, blending legal states of exception with permanent institutional change; an adequate model must capture how temporary legal mechanisms become permanent barriers to competition.

  Third, the concept must demand evidence of strategic intentionality by political actors. This is non-negotiable. Democratic decline can result from state capacity failure, economic collapse, or external shock, but backsliding implies agency. Without this requirement, we cannot distinguish between a government failing to protect rights due to incompetence and one dismantling institutions to retain power. This separates the phenomenon from general democratic recession and focuses analysis on the strategies of incumbent elites.

  Fourth, the framework should distinguish asymmetrical polarisation from mutual norm-breaking, though this reflects the preferences of the behavioural-institutionalist camp rather than strict necessity. In the American debate, scholars argue over whether executive norm-breaking counts as backsliding if it lacks formal constitutional change. If we include mere norm violation, the concept becomes too expansive, capturing routine partisan conflict. However, if we restrict it to formal institutional change, we miss the soft erosion of guardrails. A robust theory must treat asymmetrical efforts to rig the game as backsliding, while viewing mutual polarisation as a confounding variable. If both sides engage in tit-for-tat escalation, the system is stressed but not necessarily backsliding until one side successfully institutionalises the advantage.

  There is, however, a jointly unsatisfiable subset within these desiderata: value-neutral measurement conflicts directly with capturing substantive harm. To maintain cross-national comparability and avoid partisan accusation, we must strip the concept of substantive moralising, yet this risks ignoring cases where formal procedures remain intact while substantive democracy is eviscerated. Furthermore, a universal threshold conflicts with context-sensitive institutional variation. What constitutes court-packing in Poland may differ structurally from judicial reform in the United States or Turkey. We cannot have a context-invariant metric that is also sensitive to local institutional nuances; we must choose comparability over granularity, accepting that some edge cases will be misclassified to preserve the concept's analytical bite.

  Existing families of approach fare unevenly against these criteria. Index-based measurements, such as those produced by major democracy datasets, often fail the first desideratum by blending procedural and substantive indicators, thereby inviting accusations of liberal bias when scoring governments in the Global South or Eastern Europe. Actor-focused frameworks capture intentionality well but struggle with cross-national operationalisation, often relying on qualitative case knowledge that resists generalisation. Minimal-procedural accounts come closest to satisfying the non-negotiables but often lack the sensitivity to register the Turkish emergency-decree pathway where legal forms mask authoritarian substance.

  Ultimately, we must accept that a coherent theory of democratic backsliding requires us to prioritise the integrity of competitive institutions over the quality of democratic outcomes. If we refuse to make this trade-off, the term will remain merely a partisan epithet dressed in institutional language, capable of describing everything we dislike but explaining nothing about how democracies die.
