answer: |-
  This is a beautifully constructed paradox, and it is no surprise it is causing trouble in your reading group because it isolates a genuine tension in how we value learning versus truth. You want to hold onto the idea that education is about capacity rather than rote storage, which is the core of Turing's insight, but you also want to avoid the conclusion that truth is incidental. The step you need to reject is (4), though I admit it is Step (3) that makes (4) look so tempting. Step (4) claims that if two curricula produce the same dispositions, they are equally good as education. This looks innocent because it relies on a purely internalist view of the mind, treating the student like a closed system where the only thing that matters is the coherence and flexibility of their cognitive machinery. It feels like you are honoring Turing's child-machine analogy by focusing on the learning mechanism rather than the specific data fed into it. However, rejecting (4) costs you the comfort of thinking that pedagogy can be completely neutral regarding truth. It forces you to admit that education is not just about building a powerful engine, but about building an engine that is steered toward the world as it actually is. You cannot separate the quality of the education from the success of its reference, which means you cannot evaluate a student's education solely by looking at their internal dispositions; you must also look at whether those dispositions latch onto reality.

  The reason this cut is necessary is that your own definition in Step (1) already smuggles in the requirement for truth, which Step (4) tries to ignore. In Step (1), you defined education as producing correct answers, not just any answers. The false-colour students, by your own description in Step (5), land on relabelled answers, which means they are producing incorrect answers relative to the world. Therefore, they fail the definition in (1), and Step (4) is false to claim they are equally good. The slip happened because you shifted from talking about outputs in (1) to talking about internal dispositions in (3) and (4). By rejecting (4), you preserve the intuition that reach matters without conceding that reach into falsehood is as valuable as reach into truth. The cost is that you lose the ability to say that teaching method is entirely distinct from teaching content. You have to accept that a method which systematically divorces the student from truth is a defective method, even if it produces vigorous generalization. This means Turing's child-machine cannot be trained in a vacuum; the feedback loop it learns from must be connected to reality, or the learning itself is corrupted.

  As for your separate question on whether the false-colour curriculum is even possible, I suspect it is not, at least not in the robust sense required for your argument to hold. Step (5) assumes that you can alter content systematically while keeping inferential relations exactly as they were, but this treats inference as purely syntactic rather than semantic. If you add a fixed amount to every quantity in a physics curriculum, you break the causal laws that govern the inference. Force equals mass times acceleration is not invariant under additive translation of quantities, so the inferential relations would not hold, and the students would fail to generalize correctly even within the false system when faced with actual physical constraints. If you swap proper names, you break the reference, and any interaction with the world outside the textbook would reveal the discrepancy immediately. For the false-colour curriculum to work, the students would have to be hermetically sealed from reality, interacting only with the textbook and each other. But if they are sealed from reality, they cannot satisfy your condition in (1) of producing correct answers to questions outside their training, because any question about the real world would yield a false-colour answer. So the thought experiment collapses either because the inference breaks internally or because the reach fails externally. This reinforces the decision to reject (4), because a curriculum that cannot sustain itself against reality cannot produce the dispositions you value in the first place.
