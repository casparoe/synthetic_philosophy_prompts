      "We need a universe," Kael said softly. "And we can't build one."
      The hum deepened. The shell was ramping up. The number ticked: *0.043*.
      "It's changing," Elara said.
      "It's resisting," Kael said.
      They watched the number climb, infinitesimally slow, neither zero nor whole, hanging in the dark between them.

