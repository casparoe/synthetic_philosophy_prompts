answer: |-
  The hum wasn't sound; it was gravity. Thirty years of welding asteroid iron into a perfect sphere, three kilometers thick, surrounding the tiny hab-module at the geometric center. Now, the shell was spinning.

  Elara stared at the gyro readout. *0.0000.* Then, a flicker. *0.014 arcseconds per hour.*

  "It's moving," she said.

  Kael didn't look up from the mass telemetry. "It's drifting. The station is inertial. The shell is rotating. The gyro is supposed to stay fixed relative to the distant quasars. It isn't."

  "Because the quasars don't matter," Elara said. "Local matter defines the inertial frame. We made the shell heavy enough, compact enough, and the local notion of 'not rotating' started to drag along with it. Mach had the shape of it right. Absolute space was always just a placeholder for the actual distribution of stuff."

  "If rotation were purely a relation among bodies," Kael said, his voice tight, "the effect should be all-or-nothing. Inside a spinning shell, you are inside a spinning universe. You should spin with it completely. One-to-one."

  "We haven't reached the limit."

  "We're at neutron density, Elara. If we go higher, we collapse into a black hole. The coupling is asymptotic. It picks up more rotation the heavier we make it, but it never locks." Kael finally looked at her. "That partial coupling is exactly what you'd expect if spacetime carries its own inertial structure that the shell perturbs without constituting. The shell nudges the geometry, but the geometry exists independently."

  "You're resurrecting Newton's ghost," Elara said. "Worshipping an invisible stage."

  "Newton asked the question that got us into this," Kael countered. "What would the water in the bucket do in a universe with nothing else in it at all?"

  Elara scoffed. "A nonsense question. There is no nothing."

  "Answer it."

  "If there's no matter, there's no inertia. The bucket doesn't spin. The water stays flat."

  "And here?" Kael gestured to the readout, now ticking to *0.015*. "There is matter. Just the shell. And the water—the gyro—is barely curling. If matter constituted inertia, the shell would dictate the state. It doesn't. It only influences it. That means the stage exists independent of the actors."

  "The stage is invisible because you can't measure the whole thing," Elara said. "The coupling is partial because gravity is weak, not because space is absolute. We just need more mass."

  "We need a universe," Kael said. "And we can't build one."

  The hum deepened. The shell was ramping up. The number ticked, infinitesimally slow, neither zero nor whole, hanging in the dark between them.

  ***

  **Note on Philosophical Stipulations**

  **Contested Reading:** I leaned hardest on the interpretation of **Mach's Principle** as requiring "all-or-nothing" frame dragging (full induction of inertia by local mass). Ernst Mach himself was somewhat vague, and while Einstein hoped General Relativity would fully embody Mach's ideas, standard GR solutions (like the Lense-Thirring effect demonstrated here) allow for partial dragging without violating relational intuitions entirely. I treated the "all-or-nothing" expectation as the definitive Machian stance to sharpen the conflict.

  **Confidence in Live Options:** I am highly confident that **Relationism** (inertia is purely relative to matter) vs. **Substantivalism** (spacetime is a real entity with independent structure) are the two live philosophical options here. These represent the standard dichotomy in the philosophy of space and time regarding the ontological status of inertial frames.

  **Least Sure Claim:** The claim I am least sure about is Kael's inference that **partial coupling definitively proves substantivalism**. Some sophisticated relationists argue that partial dragging is compatible with relationalism if one accounts for boundary conditions or the influence of the rest of the universe (even if distant), meaning the "nudge" doesn't necessarily require spacetime to be a standalone substance. I presented Kael's view as stronger than it might be to ensure the dramatic stalemate.
