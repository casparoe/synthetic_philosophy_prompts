      The hum was finally audible. Not a vibration—they'd isolated the center module decades ago—but a pressure, a weight of mass moving just beyond the hull.
      Elara tapped the glass. The gyro readout blinked: *0.042 arcsec/hr.*
      "It's turning," she said.
      "It's drifting," Kael corrected. He didn't look away from the telemetry. "The station is inertial. The shell is spinning. The gyro is... compromising."
      "It's following the mass," Elara said. "We made the shell heavy enough, dense enough, and the local definition of 'still' started to move with it. Mach was right. The distant stars aren't the anchor. This steel is."
      "If Mach was right," Kael said, tapping his pen against the console, "it should be one-to-one. If rotation is purely relation among bodies, then inside a spinning universe, you are stationary. Inside a spinning shell, you should spin with it. Completely."
      "It's asymptotic," Elara countered. "We haven't reached the limit. Make it heavier, spin it faster, it locks."
      "We've pushed the stress limits of known matter, Elara. We're at the Chandrasekhar edge of engineering. It's not locking. It's nudging." Kael leaned back. "That nudge is the key. Spacetime isn't just a bookkeeping ledger for where the stuff is. It has structure. Its own inertia. The shell perturbs it, drags it slightly, like honey on a spoon. But the honey exists even without the spoon."
      Elara laughed, sharp and tired. Thirty years on this rock. "Absolute space? You want to go back to the placeholder? Newton's ghost is haunting you."
      "Newton knew water concaved in a bucket," Kael said. "He asked the question that got us here. What does that water do in a universe with nothing else in it at all?"
      "It's a nonsense question," Elara said. "There is no nothing."
      "Answer it."
      "If there's no matter, there's no inertia. The bucket doesn't spin because there's nothing to spin against."
      "And the water?"
