answer: |-
  **Research Proposal**

  **Title:** Decomposing the Boundary Problem: Distinguishing Franchise Eligibility from Jurisdictional Legitimacy

  **1. The Research Question**

  The democratic boundary problem asks who constitutes the *demos*—the people entitled to rule themselves. Standard formulations treat this as a single question requiring a single criterion of membership: Who belongs? This proposal contends that this formulation is category-confused. It conflates two distinct functional requirements of a political system: the input side (who decides) and the output side (who is bound by the decision).

  Consequently, the primary research question for this paper is: **Does resolving the democratic boundary problem require a single criterion of membership, or does it require distinct criteria for franchise eligibility (the right to vote) and jurisdictional legitimacy (the scope of binding authority)?**

  This question is framed to admit a determinate answer. If the two functions can be shown to serve different normative purposes and operate under different constraints, the answer is that distinct criteria are required. If it can be shown that legitimacy collapses without identity between the voters and the bound, the answer is that a single criterion is necessary. The paper will argue for the former: that the boundary problem is actually two problems, and treating them as one generates the paradoxes currently stalling the literature.

  **2. Existing Positions and the Proposed Intervention**

  The contemporary literature on the boundary problem is characterized by a stalemate between competing principles, each of which captures an intuitive requirement of democracy but fails to provide a comprehensive solution.

  *   **The Territorial Principle:** This view holds that presence within a geographic boundary determines membership. It offers stability and clarity but is vulnerable to the objection that it arbitrarily excludes affected outsiders (e.g., neighbors affected by pollution) and includes unaffected insiders.
  *   **The Civic Principle:** This view holds that legal citizenship status determines membership. It aligns with existing constitutional structures but faces the "all-subjected" objection: it fails to account for long-term residents or non-cizens who are subject to coercive laws.
  *   **The All-Affected Principle:** This view holds that anyone whose interests are significantly affected by a decision should have a say. While normatively attractive, it faces the "unbounded demos" objection. Because almost any decision can ripple outward to affect someone, somewhere, this principle threatens to expand the *demos* to include virtually everyone for almost every decision, making stable decision-making impossible.
  *   **The All-Subjected (or All-Able-to-Affect) Principle:** Often distinguished from the all-affected principle, this view argues that membership should extend to all who are subject to the coercive power of the state, or all who are able to affect the political process. This narrows the scope compared to the all-affected principle but still struggles to define the precise scope of "subjection" or "ability."

  **Epistemic Status of the Debate**
  It is widely acknowledged in the literature that no single principle currently commands consensus. It is also a settled feature of the debate that the all-affected principle is frequently criticized for leading to an unbounded or unstable *demos*. However, it is contested whether this instability is a fatal flaw or a feature requiring global democracy. Furthermore, while some theorists have hinted at distinctions between input and output legitimacy, the standard formulation of the boundary problem continues to treat "membership in the *demos*" as a unitary status that confers both the right to vote and the status of being legitimately bound.

  **The Proposed Intervention**
  My hypothesis is that the stalemate arises because the all-affected principle is being misapplied as a franchise criterion when it is properly a jurisdictional principle.
  1.  **Franchise Boundary:** Determines who votes. This must be bounded to ensure decisional capacity. Territorial or civic criteria may be appropriate here for pragmatic reasons.
  2.  **Jurisdictional Boundary:** Determines whose interests must be considered for a decision to be legitimate. This should track the all-affected principle.

  On this reading, the "unbounded demos" objection dissolves. The set of affected persons is indeed potentially unbounded, but this set defines the scope of *justification* required, not the scope of the *electorate*. A legitimate political community is one where the jurisdictional boundary is a superset of the franchise boundary. The gap between those who are affected and those who vote is not handled by expanding the electorate to infinity, but by mechanisms of representation, trusteeship, or accountability.

  **3. Methodology and Argumentative Strategy**

  The paper will proceed via conceptual analysis and case-based testing. I will not attempt to derive a new normative theory from first principles but will instead reconstruct existing arguments to show where they rely on an unstated conflation of input and output.

  **Conceptual Moves**
  1.  **Reconstruction of the Unboundedness Objection:** I will reconstruct the standard argument against the all-affected principle (that it makes democracy impossible due to instability) and demonstrate that this argument only holds if "having a say" is interpreted strictly as "having a vote."
  2.  **Decomposition:** I will formally distinguish *franchise eligibility* (a procedural capacity) from *jurisdictional legitimacy* (a substantive constraint on power). I will argue that democratic theory requires both, but they need not coincide perfectly in every instance.
  3.  **Reinterpretation of Representation:** I will argue that representation should be understood not merely as a proxy for voting, but as the mechanism that bridges the gap between the franchise boundary and the jurisdictional boundary.

  **Test Cases**
  To test the viability of this decomposition, I will apply it to three puzzle cases where the standard unitary view struggles:
  1.  **Non-Resident Workers:** Consider workers who labor within a territory but reside elsewhere, paying taxes and affected by labor laws but lacking voting rights. The unitary view must either grant them votes (potentially destabilizing) or deny them legitimacy. The decomposed view allows them to be within the jurisdictional boundary (entitled to representation/interest consideration) without necessarily being in the franchise boundary.
  2.  **Transboundary Environmental Regulation:** Consider a factory emitting pollution into a neighboring jurisdiction. The neighbors are affected but cannot vote. The unitary view demands either cross-border voting (institutionally difficult) or accepts illegitimacy. The decomposed view treats the neighbors as within the jurisdictional boundary, requiring the emitting state to account for their interests through diplomatic or legal accountability, not necessarily ballots.
  3.  **Non-Citizen Residents:** Consider long-term residents who lack citizenship. The civic principle excludes them; the territorial principle includes them. The decomposed view suggests they are clearly within the jurisdictional boundary (subject to coercion) and arguably the franchise boundary, but distinguishes this from the question of whether their interests are counted (which they must be, regardless of voting status).

  **Failure Conditions for the Method**
  If I find that mechanisms of representation cannot plausibly account for the interests of the "affected but non-voting" group without actual voting rights, the decomposition fails. If it turns out that "having an interest counted" is conceptually inseparable from "having a vote," the distinction collapses.

  **4. Success and Failure Conditions for the Project**

  **Success**
  A successful result will demonstrate that:
  1.  The "unbounded demos" objection relies on conflating the scope of justification with the scope of voting.
  2.  The all-affected principle functions coherently as a constraint on legitimacy (jurisdiction) even if it is impractical as a rule for voting (franchise).
  3.  The proposed decomposition resolves the tension in at least two of the three test cases without generating new paradoxes.
  4.  The paper provides a clear conceptual framework that allows theorists to retain the normative appeal of the all-affected principle without accepting the institutional impossibility of a global electorate.

  **Failure**
  The project will count as a failure if:
  1.  I cannot identify a plausible mechanism for accountability that satisfies the jurisdictional boundary without granting franchise rights. If the only way to respect affected interests is to grant votes, the decomposition offers no practical advantage.
  2.  The distinction between "input" and "output" proves to be merely verbal, with no normative consequences for how we judge democratic legitimacy.
  3.  The scope of the "affected" proves so indeterminate that even as a jurisdictional principle, it offers no guidance on legitimacy (i.e., if everyone is affected by everything, the jurisdictional boundary is also unbounded, rendering the concept useless).

  **5. Scope and Feasibility Assessment**

  This project is designed for a one-semester seminar paper of approximately 7,000 words. This word count is sufficient for a focused conceptual argument but requires strict discipline regarding scope.

  **Feasible Scope**
  *   **Focus:** The paper will focus exclusively on the conceptual distinction between franchise and jurisdiction. It will not attempt to defend a specific theory of representation (e.g., Burkean trusteeship vs. delegate models) but will only argue that *some* form of representation is the necessary bridge.
  *   **Literature:** I will engage with the contemporary analytic debate on the boundary problem. I will not provide a historical genealogy of the concept (e.g., Rousseau or Hobbes) unless directly relevant to the conceptual distinction.
  *   **Cases:** I will limit the analysis to the three test cases outlined above. I will not expand into global democracy, future generations, or animal rights, as these introduce additional metaphysical complications that would exceed the word limit.

  **Necessary Cuts**
  To maintain feasibility within 7,000 words, I must exclude the following:
  1.  **Historical Context:** I will not trace the history of the boundary problem through the canon of political philosophy. The focus will be on the contemporary structural problem.
  2.  **Detailed Institutional Design:** I will not propose specific institutional reforms (e.g., specific voting structures for non-residents). The argument is conceptual, not institutional.
  3.  **The "What Counts as Affected" Problem:** There is a substantial sub-debate regarding how to measure "affectedness" (interests vs. rights, causal vs. moral affectedness). I will acknowledge this contestation but will not attempt to resolve it. I will treat "affected" as a placeholder for "those whose interests generate a claim to justification," assuming for the sake of argument that we can identify this group sufficiently to test the boundary problem.
  4.  **Global Democracy Implications:** While the argument has implications for global democracy, I will not argue for or against a global state. I will restrict the analysis to the legitimacy of existing state boundaries under the decomposed model.

  **Risk Management**
  The primary risk is that the distinction between franchise and jurisdiction is already well-trodden ground. To mitigate this, I will focus specifically on how this distinction dissolves the "unbounded demos" objection, which is a specific point of contention in the current literature. If preliminary research suggests the distinction is too commonplace to be novel, I will pivot to focus more heavily on the implications for the all-affected principle specifically, arguing that its proponents have inadvertently weakened their own case by accepting the franchise framing.

  **Conclusion**
  This proposal outlines a strategy to resolve a persistent stalemate in democratic theory by disaggregating the concept of the *demos*. By distinguishing who votes from who counts, the paper aims to salvage the normative core of the all-affected principle while respecting the pragmatic necessity of bounded decision-making. The scope is tightly managed to ensure a complete argument within the semester constraints.
