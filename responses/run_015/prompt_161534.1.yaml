answer: |-
  Your suspicion is well-founded. The passage you quoted is a competent summary of the *narrative arc* often told about the "Knobe Effect" (or Side-Effect Effect), but it conflates three distinct layers of the debate: the empirical data, the competing theoretical explanations, and the normative philosophical conclusions. It presents one specific explanation (the "Constitution" view) as if it were the data itself, and it treats a descriptive finding as a prescription for legal and ethical reform.

  Here is the claim-by-claim audit, followed by the analysis of your probes and the practical conclusions.

  ### Part 1: Claim-by-Claim Audit

  I have broken the passage into six distinct claims. For each, I distinguish between (i) what is empirically secure, (ii) where the passage simplifies or slides between categories, and (iii) what competing theories reject.

  **Claim 1: "People read about a company chairman... Asked whether the chairman harmed the environment intentionally, most people said yes... with 'help'... most people said he did not help the environment intentionally."**
  *   **(i) Fair Statement:** This is the core empirical finding. The asymmetry is robust across many variations and demographics.
  *   **(ii) Simplification:** It implies the effect is universal. In reality, effect sizes vary by culture, age, and phrasing. Some replications show weaker effects.
  *   **(iii) Rejection:** No serious theorist rejects the existence of the asymmetry. This is the datum to be explained.

  **Claim 2: "Even though in both versions he plainly foresaw the side effect and was indifferent to it."**
  *   **(i) Fair Statement:** The vignette is designed to hold belief (foresight) and attitude (indifference) constant.
  *   **(ii) Slide:** It assumes "indifference" is psychologically identical in both cases. Some argue that "not caring about harm" implies a willingness to allow harm, whereas "not caring about help" implies a lack of motivation to pursue help. These might not be the same mental state.
  *   **(iii) Rejection:** Defenders of the "Classical View" argue that if the mental states are truly identical, the intuition *should* be identical. They argue the vignette fails to control for a hidden variable (e.g., the agent's deeper attitude toward the norm).

  **Claim 3: "The moral valence of the outcome is therefore driving a judgment that ought to be purely factual: people's moral verdicts distort their view of the facts."**
  *   **(i) Fair Statement:** This accurately describes the *puzzle* as it initially appeared. It frames the "Bias" or "Distortion" hypothesis.
  *   **(ii) Slide:** It asserts the judgment *ought* to be purely factual. This presupposes the Classical View (that intentionality is a metaphysical/psychological fact independent of morality) is true.
  *   **(iii) Rejection:** Proponents of the "Moral Constitution" view (like Knobe) reject this. They argue the judgment is *not* a distortion; it is a correct application of a concept that is inherently normative. There is no "factual" view to distort.

  **Claim 4: "Our very concept of intentional action is partly constituted by moral considerations... when the outcome is bad, foresight plus indifference really is enough... and when it is good it is not."**
  *   **(i) Fair Statement:** This is a fair statement of Knobe's specific "Skill Model" or "Normative Competence" hypothesis.
  *   **(ii) Simplification:** It presents this as *the* conclusion of the literature. In reality, this is one of three or four major competing explanations.
  *   **(iii) Rejection:**
      *   **The Pragmatic/Expressivist View:** Rejects this. They argue people *know* it wasn't intentional in the help case, but say "not intentional" to avoid praising him. The concept is stable; the *usage* is strategic.
      *   **The Deep Self View:** Rejects this. They argue the asymmetry arises because harming reveals a "deep self" that endorses bad norms, whereas helping does not necessarily reveal a deep self that endorses good norms (since he didn't try to help).

  **Claim 5: "The result is said to refute the classical philosophical project... 'intentional' has no stable content to analyse."**
  *   **(i) Fair Statement:** It challenges the Classical View (belief + desire + causation).
  *   **(ii) Slide:** "No stable content" is too strong. Most experimental philosophers argue the content is *more complex* than the Classical View thought, not that it is non-existent or unanalyzable.
  *   **(iii) Rejection:** Many armchair philosophers argue the Classical View can be saved by adding a "volition" or "endorsement" condition, without accepting that morality *constitutes* the concept.

  **Claim 6: "Methodological: what people say in surveys about cases just is what the concept means, so experimental philosophy can replace armchair conceptual analysis."**
  *   **(i) Fair Statement:** This reflects the "Restrictionist" or "Positive" X-Phi manifesto.
  *   **(ii) Slide:** It equates *folk usage* with *conceptual competence*. People might use a term inconsistently (performance) without the underlying concept (competence) being inconsistent.
  *   **(iii) Rejection:** Armchair philosophers argue surveys measure intuitions, which are prone to error, whereas conceptual analysis seeks the coherent principles that *best* justify our practices.

  **Claim 7: "Practically... doctrine of double effect... legal notion of intent... resting on a distinction that is really just a moral judgment wearing a factual disguise, and should be abandoned."**
  *   **(i) Fair Statement:** This is a radical implication drawn by some theorists.
  *   **(ii) Slide:** It commits a naturalistic fallacy (moving from "folk *use* intent normatively" to "law *should* use intent normatively"). Legal concepts are tools for policy, not just mirrors of psychology.
  *   **(iii) Rejection:** Legal theorists argue that even if folk psychology is messy, the law requires a stable, stipulative definition of intent to ensure predictability and fairness. The Knobe Effect suggests juries might be biased, not that the legal distinction is invalid.

  ---

  ### Part 2: The Core Tension (Bias vs. Constitution)

  You correctly identified a tension in the passage. It says:
  1.  Moral verdicts **distort** factual judgment (The Bias View).
  2.  Moral considerations **constitute** the concept (The Constitution View).

  These are mutually exclusive explanations.
  *   **Bias View:** The concept of "intentional" is purely psychological (fact). People make a mistake because they are angry/satisfied.
  *   **Constitution View:** The concept of "intentional" is partly moral (norm). People are making no mistake; they are applying the concept correctly.

  The passage treats (2) as a correction of (1) ("But the distortion is not merely a bias..."). This is misleading. It implies the Bias View was the "first draft" and the Constitution View is the "final draft." In the actual literature, these are **rival hypotheses**. If the Constitution View is true, the Bias View is false (there is no distortion). If the Pragmatic View is true, *both* are false (the concept is stable, and people are lying/implicating, not distorting or redefining).

  **Where to stay agnostic:** You should remain agnostic about *why* the asymmetry happens. The data (Claim 1) is robust. The explanation (Claims 3 & 4) is hotly contested.

  ---

  ### Part 3: Analysis of Your Probes

  Here is how the competing explanations would handle your hypothetical cases.

  #### Probe One: The Compliance Engine (No Mind)
  *Scenario:* An automated system causes harm/help as a side effect of cost-minimization. No "deep self," no reasons, no caring.

  *   **Moral Constitution View:** Predicts the **asymmetry survives**. If intentionality is constituted by moral judgment of the outcome, the presence of a "mind" is secondary. We might say the *firm* intentionally harmed the environment via the engine. The moral badness makes the causal bringing-about count as intentional.
      *   *Target:* The Firm or The Designers (via the system).
  *   **Deep Self / Reason-Based View:** Predicts the **asymmetry disappears** (or is significantly reduced). Without a "self" to endorse or repudiate the outcome, there is no psychological asymmetry. A machine cannot "not care" in the relevant sense; it simply calculates.
      *   *Target:* N/A (or purely causal).
  *   **Pragmatic / Expressivist View:** Predicts the **asymmetry survives**. We still want to blame someone for the harm. We use "intentional" as a vehicle to assign responsibility to the owners of the engine. In the help case, we don't feel the pressure to praise, so we deny intentionality.
      *   *Target:* The Firm (as a proxy for blame).

  *   **Discrimination:** If the asymmetry vanishes with the machine, it supports the **Deep Self** view (mind is required). If it persists, it supports **Constitution** or **Pragmatic** views. To distinguish Constitution from Pragmatic, you would need to ask: "Did the engine *know* it was harming?" If people say "No, but it was still intentional," that supports Constitution. If they say "Yes, the designers knew," that supports Pragmatic (shifting the target).

  #### Probe Two: The Pointless Rule (Non-Moral Norms)
  *Scenario:* Breaching vs. Complying with an arbitrary office convention. No moral harm/help.

  *   **Moral Constitution View:** Predicts the **asymmetry disappears**. If the concept is constituted by *moral* considerations, a non-moral norm violation should not trigger it.
  *   **General Norm / Violation View:** Predicts the **asymmetry survives**. The driver is not "moral badness" but "norm violation." Breaching a rule (even arbitrary) is negative; complying is neutral. Intentionality is attributed to norm violations.
  *   **Affect/Valence View:** Predicts the **asymmetry survives** *if* "breaching" feels negative. If the rule is truly pointless, there may be no negative affect, and the asymmetry might vanish.

  *   **Discrimination:** If the asymmetry holds for arbitrary rules, the "Moral" in "Moral Constitution" is too narrow. It would suggest the concept is constituted by *normative* considerations generally, not just moral ones. This weakens the specific claim that "moral verdicts distort factual judgment" and strengthens the idea that "normative status determines action description."

  ---

  ### Part 4: Practical Conclusions (DDE and Law)

  Does the last sentence follow? *"Anything that leans on the intended/merely-foreseen distinction... should be abandoned or replaced by an explicitly normative test."*

  **Verdict:** This does **not** follow from the robust findings, and it only follows from specific explanations.

  **1. The Doctrine of Double Effect (DDE)**
  *   **If the finding is robust but explanation unsettled:** The DDE relies on a distinction between *intending* harm and *foreseeing* harm. The Knobe Effect shows that folk psychology struggles to distinguish these when moral stakes are high.
      *   *Implication:* This does not refute the DDE. The DDE is a **normative ethical theory**, not a descriptive psychological report. It says what you *ought* to do, not how people *talk*. Even if people call foreseen harm "intentional," an ethicist can stipulate: "For the purpose of this theory, we define intention as X."
  *   **If the Constitution View is true:** If "intentional" *means* "morally bad side effect," then the DDE becomes circular ("It is wrong to intend harm" becomes "It is wrong to do what is morally bad"). This would undermine the DDE's utility.
  *   **If the Pragmatic/Bias View is true:** The DDE is safe. It just means humans are bad at applying the distinction under emotional pressure. The distinction remains valid; our application of it is noisy.

  **2. Legal Intent**
  *   **If the finding is robust but explanation unsettled:** Juries are likely to convict based on moral outrage rather than technical mental states.
      *   *Implication:* The law should not abandon the distinction, but it should **insulate** it. Jury instructions need to be stricter. The definition of intent in statute should be precise to override folk intuition.
  *   **If the Constitution View is true:** It suggests the law *already* operates normatively, even if it claims to be factual.
      *   *Implication:* We should make this explicit. Instead of asking "Did they intend it?" (which invites moral bias), ask "Should they be held responsible for this outcome?"
  *   **If the Pragmatic View is true:** The law should not change its definitions, but it should recognize that "intent" in court is often a proxy for "blameworthiness."
  *   **Why the passage's conclusion is too strong:** Abandoning the distinction removes a crucial constraint on liability. If we replace "intent" with "explicit normative test," we risk punishing people purely for bad outcomes (strict liability) rather than their mental relationship to those outcomes. The Knobe Effect suggests we *conflate* the two, not that we *should*.

  **A Better Upshot:**
  "The experimental findings show that the folk concept of intentional action is sensitive to normative considerations. This creates a risk of bias in legal and ethical contexts where a neutral assessment of mental state is required. Therefore, institutional definitions of intent should be stipulative and precise, rather than relying on ordinary language intuition."

  ---

  ### Part 5: Review of Your Glosses

  You used four labels for the explanations: *valence-sensitive, reason-based, deep-self/valuational, and pragmatic-or-expressivist.*

  *   **Valence-sensitive:** Accurate for the broad phenomenon, but this describes the *data*, not the *explanation*. (All theories agree the valence correlates; they disagree on why).
  *   **Reason-based:** A bit vague. Usually, this refers to the "Reasons View" (the agent had a reason to allow the harm but not the help). This is a strong competitor to the Moral View.
  *   **Deep-self/valuational:** Accurate. This captures the view that intentionality tracks whether the action aligns with the agent's deeper values.
  *   **Pragmatic-or-expressivist:** Accurate. This captures the view that the utterance "he did it intentionally" is a speech act of blame, not a description of mind.

  **One Misleading Gloss:** You asked if the driver has to be "moral valence" or if a "norm-violation account" is different. In the literature, these are often grouped under "Normative Explanations." The debate is whether it is specifically *moral* wrongness or *any* norm violation (including etiquette, rules, etc.). Your Probe Two targets exactly this distinction. If the effect holds for arbitrary rules, "Moral Constitution" must be widened to "Normative Constitution."

  ### Summary Recommendation
  You can trust the **first paragraph** of the passage as a description of the experiment and the basic result. You should treat the **second and third paragraphs** (explanation and methodology) as one specific philosophical argument (Knobe's), not as settled consensus. You should treat the **final paragraph** (practical upshot) as a controversial opinion that does not logically follow from the data.

  When repeating this to others, the safest formulation is: *"Experiments show that people are more likely to call a side effect 'intentional' if it is harmful than if it is helpful, even when the agent's mental state is identical. Philosophers disagree on whether this shows our concept of intention is moral, or whether people are just biased by blame."*
