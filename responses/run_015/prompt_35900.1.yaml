      *   **Requirements:**
          *   Sequence of ordered questions.
          *   Define sufficient answers and stopping points.
          *   Distinguish between *epistemic verdict* (did it happen?) and *novelistic use* (can I write it?).
          *   Include an "override" step for artistic license with conditions.
          *   Run the procedure on three specific cases: Trojan Horse, Arthur's Court/Companions, Exodus Scale.
          *   One case must reach an unpopular conclusion (e.g., debunking the Horse) and show the override.
          *   British English.
          *   No reading lists/bibliographies.
          *   Acknowledge limitations of the procedure at the end.
      *   **Tone:** Considered, polished, methodical, honest about uncertainty.

  2.  **Brainstorming & Conceptual Framework:**
      *   *Legends vs. History:* Legends aren't just "false history." They are cultural memories, often distorted. Types: Distorted memory (kernel of truth), Origin myth (explaining why things are), Political charter (legitimising rule), Folkloric motif (storytelling tropes), Later retrojection (projecting later norms onto the past).
      *   *Novelist's Needs:* Rigorous academic truth isn't the goal; *plausibility* and *narrative integrity* are. The novelist needs to know *why* a detail exists to decide how to treat it.
      *   *The Procedure:* Needs to be a funnel. Start with hard evidence, move to context, then motive, then narrative utility.
      *   *The "Override":* This is crucial. It acknowledges that fiction is not history. But it shouldn't be "I like it so it stays." It needs conditions (e.g., thematic resonance, character perspective, acknowledging the myth within the text).
      *   *The Three Cases:*
          1.  *Trojan Horse:* Likely folkloric/ritual memory, not literal. Hard to justify historically. Good candidate for the "unpopular conclusion."
          2.  *Arthur's Court:* Anachronistic (medieval romance vs. Dark Age warband). Nuanced.
          3.  *Exodus Scale:* Theological elaboration vs. small group. Archaeological silence is loud here.

  3.  **Drafting the Procedure (The "Twenty-Minute Protocol"):**
      *   *Step 1: Contemporary Attestation.* Is there evidence from the time? (Stop if no, but don't discard yet).
      *   *Step 2: Material Fit.* Does it match the archaeology/tech of the *putative* period? (If no, it's likely retrojection).
      *   *Step 3: Independent Convergence.* Do different traditions say the same thing? (If yes, stronger core).
      *   *Step 4: Motive Analysis.* Who wrote this down and why? (Political/Theological bias?).
      *   *Step 5: The Epistemic Verdict.* Assign a probability (Historical, Probable, Possible, Unlikely, Mythic).
      *   *Step 6: Novelistic Utility.* Does it serve the story?
      *   *Step 7: The Override.* Can I keep it despite the verdict? Conditions: Internal logic, character belief, thematic necessity.

  4.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is 20 minutes realistic? Yes, if the questions are sharp.
      *   *Critique:* Need to ensure British English (e.g., "programme" vs "program", "honour", "centre").
      *   *Critique:* Make sure the distinction between *verdict* and *use* is clear. The procedure shouldn't tell the writer *what* to write, but *what they are writing*.
      *   *Critique:* The "Override" needs to prevent self-deception. It must be conscious myth-making, not accidental error.

  5.  **Running the Procedure on the Cases:**
      *   *Trojan Horse:*
          *   Attestation: Late (Homer, Virgil). No Hittite/Egyptian mention.
          *   Fit: Siege engines existed, but a wooden horse? Unlikely.
          *   Motive: Storytelling climax, ritual offering memory?
          *   Verdict: Mythic/Folkloric.
          *   Override: Can keep it if treated as a ruse or religious symbol, not a literal giant wooden toy.
      *   *Arthur:*
          *   Attestation: Gildas (no name), Nennius (later).
          *   Fit: Hall/Companions = Germanic/Feudal retrojection onto a Romano-British context.
          *   Motive: Legitimising later kings.
          *   Verdict: Anachronistic but culturally "true" for the legend.
          *   Override: Keep the *feel* of the hall but strip the stone castles and plate armour.
      *   *Exodus:*
          *   Attestation: Biblical only. No Egyptian record.
          *   Fit: 2 million people in Sinai? Impossible archaeologically.
          *   Motive: Nation-founding theology.
          *   Verdict: Unhistorical as mass event.
          *   Override: Focus on the *experience* of liberation, scale down the numbers.

  6.  **Developing the "Limitations" Note:**
      *   What does this miss? Emotional truths, deep prehistory where archaeology is silent, the "truth of the teller" (what the legend says about the people who believed it).

  7.  **Final Polish:**
      *   Check tone: Philosophical but practical.
      *   Check constraints: No citations, British English.
      *   Ensure the "unpopular conclusion" (Horse) is handled with the Override mechanism clearly.

  8.  *(Self-Correction during final review)*: Make sure I explicitly mention the "Twenty-Minute" aspect in the intro to ground the user. Ensure the distinction between "Epistemic Verdict" and "Novelistic Use" is a specific step, not just implied. Ensure the "Override" has strict conditions to avoid "self-deception."

      *Refining the Horse verdict:* I need to be firm. The Horse is almost certainly not a historical siege engine. The procedure should lead to "Mythic." The Override allows the novelist to keep it *if* they frame it correctly (e.g., as a metaphor the characters believe, or a ritual object).

      *Refining Arthur:* The "Hall" is the key. A *comitatus* is historical, a Round Table is not. The procedure should distinguish the social structure from the furniture.

      *Refining Exodus:* The scale is the issue. A small group is plausible; a nation is not. The procedure should flag the numbers.

      *Tone Check:* "Philosopher of history" means I should speak to the *nature* of truth in fiction, not just facts.

      *British English:* "Analysing", "centre", "honour", "programme" (if used), "whilst".

      *Let's write.*
answer: |-
  ### The Twenty-Minute Protocol for Legendary Material

  You are correct to distinguish between the historian's burden of proof and the novelist's burden of plausibility. A historian asks, *'Did this happen?'* A novelist must ask, *'If this did not happen, why is it told as if it did, and what truth does that telling contain?'*

  The following procedure is designed to separate the *epistemic verdict* (the likelihood of historical occurrence) from the *novelistic use* (the legitimacy of inclusion in your narrative). It is a funnel: start broad, narrow down, and make your conscious choice at the end. It requires no books, only your general knowledge and a willingness to be rigorous with yourself.

  Set a timer. Work through these seven steps in order.

  #### Step 1: Contemporary Attestation
  **Question:** Is there any reference to this specific element from the putative time period, or from a culture contemporary with it?
  *   **Sufficient Answer:** Yes (e.g., a Hittite letter mentioning Wilusa/Troy; a Roman inscription mentioning a Briton).
  *   **Stopping Point:** If **No**, do not discard the element yet. Move to Step 2. Most legends lack contemporary attestation. This merely flags the element as 'tradition' rather than 'record'.

  #### Step 2: Material Fit
  **Question:** Does the element align with the archaeological and technological reality of the *putative* period, or does it resemble a later era?
  *   **Sufficient Answer:** It fits the known material culture (e.g., bronze weapons for Bronze Age; sub-Roman villa sites for Arthur).
  *   **Stopping Point:** If **No** (e.g., iron armour in Bronze Age, stone castles in Post-Roman Britain), classify the element as **Retrojection**. It is a projection of the storyteller's time onto the past.
  *   **Judgement Call:** Distinguish between *technology* (hard facts) and *social custom* (soft facts). Social customs persist longer; technology is a harder stop.

  #### Step 3: Convergence of Strands
  **Question:** Do independent traditions converge on this detail? (e.g., Do Greek, Hittite, and Egyptian sources all hint at conflict? Do Welsh, Breton, and Latin sources all hint at a war leader?)
  *   **Sufficient Answer:** Yes, multiple independent lines of tradition mention the core event or person.
  *   **Stopping Point:** If **Yes**, you have a **Historical Kernel**. The specific details may be wrong, but the core is likely solid.
  *   **If No:** It may be a singular invention of one tradition. Treat with caution.

  #### Step 4: Motive Analysis
  **Question:** Who wrote this down, and what did they gain by telling it this way? Look for:
  *   **Political Charter:** Legitimising a current dynasty (e.g., Tudors claiming Arthur).
  *   **Theological Lens:** Demonstrating divine favour or wrath (e.g., Plagues of Egypt).
  *   **Folkloric Motif:** A satisfying story shape (e.g., the trickster, the hidden treasure).
  *   **Sufficient Answer:** You can identify a clear motive for the distortion.
  *   **Stopping Point:** If the motive is purely theological or folkloric, the **Epistemic Verdict** leans heavily toward **Mythic**. If the motive is political, there may be a factual core twisted to suit.

  #### Step 5: The Epistemic Verdict
  **Action:** Based on Steps 1–4, assign one of the following labels to the element. Be honest.
  1.  **Historical:** Supported by evidence and fit.
  2.  **Probable:** Fits the context, lacks direct proof, but likely.
  3.  **Possible:** Cannot be disproven, but lacks positive evidence.
  4.  **Unlikely:** Contradicts material fit or logic.
  5.  **Mythic:** Serves a theological or narrative function; historically implausible.

  *Note: This is the end of the historical inquiry. The next steps are about art.*

  #### Step 6: Novelistic Utility
  **Question:** Does this element serve the thematic or emotional truth of your novel?
  *   **Sufficient Answer:** Yes, it anchors a character arc, symbolises a theme, or drives the plot.
  *   **Stopping Point:** If **No**, discard it regardless of the Verdict. It is dead weight.
  *   **If Yes:** Proceed to Step 7.

  #### Step 7: The Override (Conscious Myth-Making)
  **Question:** I have a 'Mythic' or 'Unlikely' verdict, but I wish to keep the element. Under what conditions is this legitimate?
  *   **Condition A (Internal Perspective):** Can a character believe this without the narrator endorsing it as objective fact?
  *   **Condition B (Metaphorical Truth):** Can the element stand as a symbol of a real phenomenon (e.g., the Horse represents siegecraft, not a toy)?
  *   **Condition C (Thematic Necessity):** Is the myth more 'true' to the cultural memory you are exploring than the dry history?
  *   **Sufficient Answer:** You can satisfy at least one condition without contradicting your own internal logic.
  *   **Warning:** If you cannot satisfy these conditions, keeping the element is **Self-Deception**. You are prioritising cliché over integrity.

  ***

  ### Application of the Protocol

  Here I apply the procedure to your three specific cases. I will be blunt where the evidence demands it.

  #### Case 1: The Trojan Horse
  *   **Step 1 (Attestation):** No contemporary Hittite or Egyptian record mentions a horse. First appears in Homer (centuries later). **Result:** Tradition only.
  *   **Step 2 (Material Fit):** A wooden structure large enough to hide men, built under siege, without being burned? Technologically improbable for a siege context. **Result:** Retrojection/Folkloric.
  *   **Step 3 (Convergence):** Greeks agree on the horse. Hittites mention the destruction of Wilusa but not the method. **Result:** Single-tradition motif.
  *   **Step 4 (Motive):** Folkloric (the trickster trope) and Ritual (votive offerings often took animal shapes). **Result:** Mythic.
  *   **Step 5 (Epistemic Verdict):** **Mythic.** It is highly unlikely a literal wooden horse was the mechanism of victory.
  *   **Step 6 (Utility):** High. It is the iconic climax of the war.
  *   **Step 7 (Override):** Can you keep it?
      *   *Condition A:* Yes. Your characters can believe in the horse as a religious offering to Poseidon (Earth-Shaker), which masks its function.
      *   *Condition B:* Yes. Treat the 'Horse' not as a vehicle, but as a name for a siege engine (known in later periods) or a specific battalion insignia that later bards literalised.
      *   *Decision:* You may keep the Horse, but you must strip it of its fairy-tale mechanics. It is not a gift left on the plain; it is a ritual object brought to the walls, or a metaphor for the breach. If you write men hiding inside a wooden statue on wheels, you have failed the Override and succumbed to self-deception.

  #### Case 2: Arthur's Court and Companions
  *   **Step 1 (Attestation):** No contemporary mention of Arthur. Gildas (6th c.) mentions a siege but no name. Nennius (9th c.) names him. **Result:** Tradition only.
  *   **Step 2 (Material Fit):** A stone castle with a Round Table? Impossible for post-Roman Britain. A warband (*comitatus*) and a timber hall in a reoccupied hillfort or villa? Plausible. **Result:** Mixed. The *structure* is anachronistic; the *social bond* is plausible.
  *   **Step 3 (Convergence):** Welsh, Breton, and Latin traditions all agree on a war leader with elite companions. **Result:** Historical Kernel regarding the social structure.
  *   **Step 4 (Motive):** Political. Later medieval writers needed Arthur to be a king of chivalry to legitimise feudal norms. **Result:** Political Charter.
  *   **Step 5 (Epistemic Verdict):** **Probable (Warband)** / **Mythic (Court).** A leader with a sworn band is historically sound; a formalised court with a capital is retrojection.
  *   **Step 6 (Utility):** High. The bond between leader and men is the emotional core of the tragedy.
  *   **Step 7 (Override):**
      *   *Condition B:* Yes. Depict the 'Court' not as a bureaucracy, but as the fire-light circle of the warband. The 'Round Table' is not furniture, but the equality of the chieftains sharing the spoil.
      *   *Decision:* You may depict the hall and the companions, provided the material culture is mud, timber, and iron, not stone and chivalry. The 'legend' of the court is a memory of the loyalty of the *comitatus*.

  #### Case 3: The Scale of the Exodus
  *   **Step 1 (Attestation):** No Egyptian record of a mass departure or plagues. **Result:** Tradition only.
  *   **Step 2 (Material Fit):** 600,000 men (plus women/children = ~2 million people) in the Sinai? Archaeology shows no trace of such a mass encampment in the Late Bronze Age. The logistics of water and food are impossible. **Result:** Contradicts material fit.
  *   **Step 3 (Convergence):** Biblical tradition is unanimous. External traditions are silent. **Result:** Single-tradition.
  *   **Step 4 (Motive):** Theological. To establish Israel as a distinct, covenantal nation chosen by God, the numbers must be miraculous. **Result:** Theological Lens.
  *   **Step 5 (Epistemic Verdict):** **Mythic.** As a mass migration of a whole people, it is historically untenable.
  *   **Step 6 (Utility):** High. The sense of a 'people' being born is central to the trilogy's theme.
  *   **Step 7 (Override):**
      *   *Condition A:* Yes. The *narrator* or the *community* believes they are a multitude, but the reader sees the straggling reality.
      *   *Condition B:* Yes. The 'Exodus' is real, but the scale is a later inflation. A small group of Levites escaped and later absorbed local tribes, projecting their memory onto the whole.
      *   *Decision:* You must reduce the numbers for the sake of physical realism (water, food, marching speed), but you may retain the *psychological* scale. To your characters, the crowd feels endless. To the archaeologist (and the reader), it is a few thousand. If you attempt to stage the parting of a sea for two million people, you violate the Override.

  ***

  ### A Note on Limitations

  This procedure is a tool for managing *material* plausibility. It cannot measure *emotional* truth. There are elements of legend that are historically false but culturally essential—the 'truth of the teller' rather than the 'truth of the event'.

  Furthermore, this protocol will struggle with 'Deep Prehistory'. In periods where archaeology is silent (such as the early patriarchal narratives), Step 2 (Material Fit) becomes vague. In such cases, the procedure will default to 'Possible', leaving you with the burden of choice.

  Finally, be wary of the 'Kernel Fallacy'. Just because a legend has a historical kernel (Step 3) does not mean the surrounding story is true. The procedure protects you from the worst anachronisms, but it cannot guarantee you are writing history. It guarantees only that you know the difference between the history you are writing and the myth you are inhabiting.
