      *   **Section 5: The "Killer" Constraint.**
          *   Epistemic Accessibility regarding Responsibility.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I collapse metric and principle? *Correction:* Ensure I emphasize that the metric is the *space*, not the *shape* of distribution.
      *   *Check:* Did I score the theories? *Correction:* Keep it abstract. Mention how theories *tend* to fail, but don't say "Welfarism fails X." Say "A metric based on X faces challenge Y."
      *   *Check:* Is the tone right? *Correction:* Make it sharp, dissertation-ready. Use terms like "distribuendum," "conversion factors," "epistemic burden."
      *   *Check:* Did I address the "Equality of What" specific literature? *Correction:* Reference Sen, Cohen, Dworkin, Arneson implicitly or explicitly as sources of these constraints without evaluating their specific solutions.

