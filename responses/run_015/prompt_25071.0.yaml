answer: |-
  This is a critical foundational step. Too many dissertations jump straight into critiquing Dworkin or Sen without first rigorously defining the job description of the *metric* itself. If you do not separate the *space* of equality (the metric) from the *rule* of distribution (the principle), your evaluation will conflate distinct failures.

  Below is the specification sheet for a theory of the metric of equality. It is divided into **Functional Requirements** (structural necessities), **Substantive Requirements** (moral necessities), and **False Neutrality** (pet constraints). It concludes with the **Incompatibility Thesis** and the **Single Most Damaging Requirement**.

  ---

  ### I. Functional Requirements (Genuine Structural Necessities)
  *These are conditions required for the concept to function as a political metric rather than a moral ideal or a metaphysical claim.*

  #### 1. The Metric/Principle Distinction
  *   **The Requirement:** The theory must specify the *distribuendum* (the good to be equalized) without embedding the *distributive rule* (e.g., strict equality, maximin, sufficiency) into the definition of the good.
  *   **Motivating Case:** If you define the metric as "equal opportunity for welfare," you have smuggled the principle (equality) and a specific view of responsibility (opportunity) into the metric. If the principle changes to prioritarianism, the metric should theoretically remain stable.
  *   **Status:** **Genuine Requirement.** Collapsing these makes it impossible to test whether a failure lies in the currency chosen or the rule applied to it.

  #### 2. Epistemic Accessibility (Publicity)
  *   **The Requirement:** The metric must be measurable or assessable by public institutions with reasonable reliability. It cannot rely on information that is inherently private or counterfactually unknowable.
  *   **Motivating Case:** A metric requiring knowledge of an agent's exact counterfactual choices ("Would you have worked harder if taxes were lower?") to determine entitlement fails because the state cannot know this.
  *   **Status:** **Genuine Requirement.** A metric that cannot be operationalized is a philosophical category, not a political metric.

  #### 3. Normative Salience
  *   **The Requirement:** There must be a clear explanation of *why* inequalities in this specific space matter for justice, distinct from why they might matter for charity or efficiency.
  *   **Motivating Case:** Equality of hair color is a coherent metric but lacks normative salience. Equality of pain is salient but perhaps too narrow. The theory must link the metric to moral status or human dignity.
  *   **Status:** **Genuine Requirement.** Without this, the metric is arbitrary.

  ---

  ### II. Substantive Requirements (The Moral Battleground)
  *These are the moral intuitions the metric is expected to capture. Note that satisfying all of them simultaneously is the central problem of the debate.*

  #### 4. Sensitivity to Choice (Responsiveness to Responsibility)
  *   **The Requirement:** The metric must allow for inequalities that arise from voluntary choice to pass without triggering a claim of injustice.
  *   **Motivating Case:** The "Surfer vs. Worker" case. If two people have identical initial endowments, and one chooses to surf all day while the other works, a metric that demands equal outcomes regardless of this choice violates the intuition that individuals are responsible for their preferences.
  *   **Status:** **Genuine Requirement (with caveats).** Widely accepted in post-Rawlsian egalitarianism, though some relational egalitarians dispute its primacy.

  #### 5. Sensitivity to Endowment (Responsiveness to Misfortune)
  *   **The Requirement:** The metric must identify inequalities arising from brute luck (disability, innate talent, social background) as unjust, even if resources are formally equal.
  *   **Motivating Case:** The "Disabled Person" case. Giving a paraplegic and an able-bodied person the same bundle of resources (bicycles, stairs) results in equal resources but unequal mobility. A metric blind to conversion factors fails here.
  *   **Status:** **Genuine Requirement.** This is the primary driver for moving from Resourcism to Capabilities/Welfarism.

  #### 6. Respect for Agency (Anti-Paternalism)
  *   **The Requirement:** The metric should not impose a specific conception of the "good life" on individuals who reject it. It should track what the individual values, not what the theorist thinks they should value.
  *   **Motivating Case:** The "Ascetic Monk." If the metric is "capabilities to achieve high income," the monk is disadvantaged. If the metric respects his preference for poverty, it must accommodate that.
  *   **Status:** **Genuine Requirement.** Essential for liberal neutrality.

  #### 7. Protection Against Adaptive Preferences
  *   **The Requirement:** The metric must not validate preferences formed under conditions of oppression or deprivation.
  *   **Motivating Case:** The "Happy Slave" or "Subservient Woman." If a person reports high welfare or expresses no desire for freedom due to systematic conditioning, a metric based solely on subjective satisfaction declares them equal.
  *   **Status:** **Genuine Requirement.** Essential to prevent the metric from justifying oppression.

  ---

  ### III. False Neutrality (Pet Constraints Dressed as Requirements)
  *These are often presented as necessary conditions for a theory of equality but are actually substantive commitments that bias the debate against certain views.*

  #### 8. The "Objectivity" Constraint
  *   **The Claim:** "A metric must be based on objective goods, not subjective states."
  *   **Why it's a Pet Constraint:** This begs the question against Welfarism. Subjective states are real phenomena. Dismissing them as "too subjective" is a choice to prioritize external observation over internal experience.
  *   **Verdict:** **Reject.** A valid metric can be subjective, provided it meets Epistemic Accessibility.

  #### 9. The "Comprehensiveness" Constraint
  *   **The Claim:** "The metric must cover all aspects of human advantage."
  *   **Why it's a Pet Constraint:** This leads to bloated theories. A metric can be partial (e.g., focusing only on political status or only on material means) and still be a valid theory of *a* sphere of equality. Demanding a "master metric" is a theoretical luxury, not a requirement.
  *   **Verdict:** **Reject.** Pluralist metrics are permissible.

  #### 10. The "End-State" Constraint
  *   **The Claim:** "The metric must measure outcomes, not processes." (Or vice versa).
  *   **Why it's a Pet Constraint:** This assumes the resolution of the process-vs-outcome debate within the definition of the metric. A metric should be able to accommodate procedural elements (e.g., "equality of opportunity" is a process metric).
  *   **Verdict:** **Reject.** The metric should be agnostic on whether the *distribution* of the metric is what matters, or the *history* of how it was distributed.

  ---

  ### IV. The Incompatibility Thesis (Joint Unsatisfiability)
  *This is the structural tension that restructures the debate. You cannot maximize all Substantive Requirements simultaneously.*

  **The Trilemma:** You cannot simultaneously satisfy **Sensitivity to Choice**, **Protection Against Adaptive Preferences**, and **Respect for Agency** without violating **Epistemic Accessibility**.

  1.  **Choice vs. Adaptive Preferences:** To distinguish between a "responsible preference" (the Surfer) and an "adaptive preference" (the Happy Slave), you need to know the *history* of the preference formation.
  2.  **Agency vs. Adaptive Preferences:** To correct for adaptive preferences, you must override the individual's stated valuation of their own life. This violates **Respect for Agency** (Paternalism).
  3.  **The Epistemic Wall:** To avoid paternalism while still filtering adaptive preferences, you need to know what the agent *would* prefer under non-oppressive conditions (counterfactual autonomy). This violates **Epistemic Accessibility**. No public institution can reliably measure counterfactual autonomy.

  **Implication for your Chapter:** Any theory you evaluate will have to sacrifice one leg of this trilemma.
  *   **Welfarism** sacrifices *Protection Against Adaptive Preferences* (to save Agency).
  *   **Objective Capabilities** sacrifices *Respect for Agency* (to save against Adaptive Preferences).
  *   **Luck Egalitarianism** sacrifices *Epistemic Accessibility* (by relying on hypothetical insurance/choice tests).

  ---

  ### V. The Single Most Damaging Requirement
  *If you take this requirement seriously, it causes the most structural damage to the leading candidates.*

  **The Requirement:** **Epistemic Accessibility regarding Responsibility (The "Identification Problem").**

  **Why it is the killer:**
  Most modern metrics (especially Luck Egalitarian variants of Welfarism and Resourcism) hinge on the distinction between *circumstance* (compensable) and *choice* (non-compensable).
  *   **The Damage:** In the real world, choice and circumstance are causally entangled. Your "choices" are determined by your genetics, upbringing, and available options (circumstances).
  *   **The Consequence:** To implement a metric that respects responsibility, the state must be able to disentangle this web. If the metric requires this disentanglement to function (i.e., if the metric *is* "opportunity for welfare" rather than just "welfare"), it becomes **unimplementable**.
  *   **Impact on Theories:**
      *   It destroys **Luck Egalitarianism** (which relies on the choice/circumstance cut).
      *   It pressures **Resourcism** (which assumes resources proxy for opportunity, but ignores that disabled people convert resources differently due to circumstances they didn't choose).
      *   It pressures **Welfarism** (which cannot distinguish between expensive tastes chosen vs. imposed).
      *   It leaves **Strict Outcome Egalitarianism** (which ignores responsibility) as the only *implementable* view, but that view violates the *Sensitivity to Choice* requirement.

  **Strategic Advice for the Chapter:**
  Use this requirement to force the theories into the open. Don't ask "Is this theory morally attractive?" Ask "Does this theory require information that a political authority cannot possess?" If a metric requires God's eye knowledge of individual responsibility to be applied justly, it fails the **Epistemic Accessibility** desideratum. This moves the debate from "which moral intuition is better?" to "which moral intuition is governable?"

  ### Summary Checklist for Your Evaluation
  When you evaluate Welfarism, Resourcism, and Capabilities in the next section, apply this spec:
  1.  **Separation:** Did they define the currency separately from the rule?
  2.  **Trilemma:** Which of the three (Choice, Anti-Paternalism, Anti-Adaptation) did they sacrifice?
  3.  **Epistemic Burden:** Does their metric require knowing things the state cannot know?
  4.  **Pet Constraints:** Did they rule out competing views by defining "objectivity" or "comprehensiveness" in a biased way?

  This framework prevents you from merely listing strengths and weaknesses; it forces you to evaluate the *viability* of the metric as a tool of political justice.
