prompt: |-
  I'm starting a dissertation chapter on the "equality of what?" debate and before I evaluate welfarism, resourcism, and the capabilities approach, I want the full spec of what a theory of the metric of equality actually has to deliver. What are the cases it must get right, the distinctions it can't collapse (like the distinction between the metric and the principle — I don't want to accidentally build distributive-rule assumptions into the metric), the empirical facts from psychology or economics it has to be consistent with, and so on. For each desideratum, give me the case or consideration that motivates it, and flag which are genuine requirements and which are just, like, one theorist's pet constraint dressed up as a neutral starting point. If any subset of the desiderata are jointly unsatisfiable — if you basically can't have a metric that both respects individual responsibility and handles adaptive preferences, or whatever — tell me that, because that's the kind of thing that restructures the whole debate. And tell me which single requirement, if you take it seriously, does the most damage to the most theories. Don't bother scoring the actual views; I'll do that.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The "equality of what?" debate (metric of equality).
      *   **Goal:** Define the full specification/desiderata for a theory of the metric of equality *before* evaluating specific theories (welfarism, resourcism, capabilities).
      *   **Key Requirements:**
          *   List cases/considerations that motivate each desideratum.
          *   Distinguish between genuine requirements and "pet constraints" (theorist-specific biases).
          *   Identify joint unsatisfiability/trade-offs (e.g., responsibility vs. adaptive preferences).
          *   Identify the single most damaging requirement to existing theories.
          *   *Constraint:* Do not score the actual views (welfarism, etc.); leave that for the user.
      *   **Tone:** Academic, rigorous, critical, structured (suitable for a dissertation chapter).

  2.  **Deconstruct the "Metric of Equality":**
      *   What is it? It's the *currency* or *space* in which equality is measured (the "distribuendum").
      *   What is it *not*? It is not the *principle* of distribution (e.g., strict equality, prioritarianism, sufficiency) nor the *site* of distribution (e.g., global, national). The prompt specifically warns against collapsing the metric and the principle.

  3.  **Brainstorm Desiderata (The "Must-Haves"):**
      *   *Clarity/Coherence:* It must be definable.
      *   *Normative Significance:* Why does *this* matter for justice?
      *   *Action-Guidingness:* Can we actually measure/policy around it?
      *   *Responsiveness to Responsibility:* Does it account for choice vs. circumstance (luck egalitarianism influence).
      *   *Responsiveness to Needs/Disabilities:* Does it account for conversion factors (Sen's critique of resources).
      *   *Respect for Preferences:* Does it respect what people actually want (welfarist intuition)?
      *   *Anti-Paternalism:* Does it avoid imposing a specific conception of the good?
      *   *Feasibility/Informational Basis:* Can we know this information?

  4.  **Categorize & Critique Desiderata (Genuine vs. Pet Constraint):**
      *   *Genuine:* Coherence, Normative Significance, Feasibility (to some extent).
      *   *Pet Constraint:* "Must be purely objective" (ignores subjective well-being), "Must be purely subjective" (ignores adaptive preferences), "Must fully track responsibility" (might be epistemically impossible).
      *   *Crucial Distinction:* Metric vs. Principle. (e.g., Equality of Resources is a metric + a rule; we need to isolate the metric part).

  5.  **Identify Trade-offs/Incompatibilities:**
      *   *Responsibility vs. Epistemic Access:* To track responsibility, we need deep knowledge of psychology/intentions. This clashes with Feasibility/Publicity.
      *   *Respect for Preferences vs. Adaptive Preferences:* If we take preferences as given (welfarism), we validate oppression. If we correct them (capabilities), we risk paternalism.
      *   *Neutrality vs. Normative Significance:* If the metric is neutral among conceptions of the good, does it lose its bite?

  6.  **Identify the "Killer" Desideratum:**
      *   What breaks the most theories?
      *   *Candidate 1:* The "Expensive Tastes" objection (breaks simple welfarism).
      *   *Candidate 2:* The "Conversion Factor/Disability" objection (breaks simple resourcism).
      *   *Candidate 3:* *Epistemic Accessibility/Publicity.* If a metric requires God-like knowledge of counterfactual choices or internal mental states to be actionable, it fails as a political metric. This hits Luck Egalitarianism hard, but also deep Welfarism.
      *   *Selection:* **The Publicity/Epistemic Accessibility Constraint combined with the Responsibility Sensitivity.** This is the "Implementation Gap."

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Define the scope (Metric vs. Principle).
      *   **Section 1: The Core Functional Desiderata (Genuine Requirements).**
          *   Normative Salience (Why this currency?).
