answer: |-
  **MEMORANDUM**

  **TO:** Naming and Memorials Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Whitfield Middle School

  **Recommendation**
  The committee should recommend to the Board that the district retain the name "Whitfield Middle School" but officially rededicate it to Elias Whitfield (1880–1963), removing all honors specific to Josiah Whitfield. Specifically:
  1.  **Honoree:** Designate Elias Whitfield as the namesake. Josiah Whitfield is no longer the honoree.
  2.  **Symbols:** Remove the bronze relief of Josiah Whitfield from the lobby. Retain the "Whitfield Minutemen" mascot and the granite "W" monogram.
  3.  **Budget:** Allocate the $150,000 capital fund to the Rivermont Chinese American Heritage Coalition for the expulsion exhibit and curriculum module. Do not fund rebranding.
  4.  **Timeline:** Complete rededication and removal of the relief by August 1, prior to the next school year.

  **Policy Application**
  Our policy permits removal when an honoree's "principal legacy" is "fundamentally at odds with the district's mission." Josiah Whitfield's legacy is dual: public health infrastructure and violent ethnic expulsion. While sewers save lives, a mission of safety and belonging cannot coexist with honoring a man who destroyed a community through violence and exclusion. His expulsion campaign defines his moral legacy. However, the policy governs the *honor* conveyed by the district, not merely the string of letters on a sign. By rededicating the school to Elias Whitfield—a Black educator enslaved by Josiah's family—we align the school's honor with our mission without triggering the financial and legal costs of a full name change.

  **Evaluation of Positions**
  The committee should adopt the **third position**: that the goal is to stop ongoing injury and provide repair, and if this can be achieved without removing the name, removal is optional.

  *   **Position 1 (Fresh Honor):** We reject the premise that every use of the name is a fresh act of honoring *Josiah*. Once the district officially rededicates the school to Elias, using the name honors Elias. However, we accept this position's core concern: we cannot continue honoring Josiah. Removing his portrait satisfies this.
  *   **Position 2 (Identifier/Trust):** We reject the view that the name is merely a neutral container. Names signal values. Keeping the name solely for continuity ignores the harm it causes those who know its history. However, we acknowledge that for many students, "Whitfield" is simply their school community. Rededication respects this community identity while correcting the values signal.
  *   **Position 3 (Injury/Repair):** We adopt this position. The primary metric is the harm felt by the 38 percent of students who are Asian American and the broader community. A full name change costs $190,000, which precludes funding the memorial exhibit this year. Rededication stops the honor to Josiah immediately and frees capital to fund the exhibit, prioritizing tangible repair over symbolic purity.

  **Complications**
  Regarding the **Superintendent's proposal**, we accept it. Rededicating to Elias Whitfield changes whom the name honors without the cost of rebranding. It transforms a symbol of exclusion into one of resilience. Regarding the **poll**, the fact that 62 percent of respondents do not know whom the name honors carries little weight. Ignorance does not negate harm; those who know the history suffer the injury, and the district cannot claim neutrality based on public ignorance. Regarding the **budget**, because rededication avoids the $190,000 rebranding cost, we can fund the $150,000 Chinese American memorial. This directly addresses the injury caused by Josiah Whitfield, fulfilling the priority of repair.

  **Litigation Risk**
  The threat of litigation regarding the land reversion clause should not change the recommendation, but it informs the strategy. Counsel advises the clause is likely unenforceable, yet litigation would cost $200,000 and years of distraction. Rededication maintains the school "known as Whitfield," likely avoiding the trigger entirely. If suit is filed despite this, the district should defend vigorously using counsel's assessment of unenforceability, but the committee's duty is to recommend the path that minimizes risk to educational resources while achieving justice. Rededication is that path.

  **Strongest Consideration on the Losing Side**
  The strongest argument against this recommendation is that retaining the surname "Whitfield" remains inherently harmful, regardless of which Whitfield is honored. Proponents of full removal argue that the surname itself belongs to the enslaving and expelling family, and that sharing a name with one's oppressor is a daily injury that rededication cannot cure. They contend that true repair requires a clean break, and that asking Asian American and Black students to learn under the enslaver's name—even rededicated—prioritizes budgetary convenience over their dignity. This view holds that no compromise is acceptable when the symbol itself is tainted by violence.

  **Conclusion**
  Rededication allows us to stop honoring Josiah Whitfield, fund immediate repair for the Chinese American community, and preserve district resources. It satisfies our policy's intent without incurring prohibitive costs. I move we adopt this recommendation.
