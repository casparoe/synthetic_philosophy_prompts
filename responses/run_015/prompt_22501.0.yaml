answer: |-
  **Setting:** *A quiet corner of the university philosophy lounge, late afternoon. Elena (a Millikanian teleosemanticist) and Marcus (a causal theorist) are standing by a whiteboard covered in diagrams of moth navigation.*

  **Marcus:** Let's look at the moth again. It's the classic case. The mechanism is transverse orientation. Keep a constant angle to a distant light source, and you fly straight. But introduce a proximate light source—a porch bulb—and the geometry breaks. The moth spirals in and burns itself up. The question is: when the moth tokens its internal navigation state at the porch light, what is the content of that state?

  **Elena:** It's "moon." Or, more precisely, "distant celestial light source." The moth is misrepresenting the porch light as the moon. That's why it crashes. It's acting on a falsehood.

  **Marcus:** But that's the teleosemantic magic trick, isn't it? Look at the causal facts on the ground. The porch light *causes* the internal state. The moon *causes* the internal state. If content is grounded in causal covariance, the content isn't "moon." It's "moon-or-porch-light." If the content is disjunctive, the moth isn't misrepresenting anything. It sees a light, it flies at a light. It's true.

  **Elena:** You're conflating *actual* function with *proper* function. Yes, the actual cause of the tokening right now is the tungsten filament. But the content isn't determined by what happens to be causing the state in this specific instance. It's determined by the conditions under which the mechanism was selected to operate. The navigation mechanism exists because it allowed ancestors to navigate by celestial bodies. That is its *proper* function. The porch light is an abnormal condition. When the system operates in abnormal conditions, it produces error.

  **Marcus:** I understand the distinction, Elena. Proper function is historical; actual function is current. But why does history get to veto the current causal connection? You're saying the content is fixed by what happened to moths fifty million years ago. But the moth today is interacting with *this* environment. If the neural state $N$ covaries with Moon ($M$) and Light ($L$), then causally, $N$ means $M \lor L$. To say it means only $M$ requires you to prune the causal tree based on a normative story about selection.

  **Elena:** It's not just a "normative story." It's about explanation. Why does the moth fly in a straight line under the moon but spiral into the bulb? The explanation is that the system is *designed*—by natural selection—for the moon. The spiraling is a breakdown of the system's function. If you say the content is "moon-or-light," you eliminate the possibility of error. You make the spiraling behavior "correct" relative to the content. But it's clearly maladaptive. The moth dies.

  **Marcus:** Maladaptive doesn't mean false. That's the crux of the disjunction problem. You're smuggling in "maladaptive" to do the work of "false." On a causal theory, truth is just causal correlation. If $L$ causes $N$, and $N$ means $M \lor L$, then when $L$ causes $N$, the representation is true. The moth dies, yes, but not because it had a false belief. It died because a true belief ("There is a light source here") led to a behavior ("Fly at it") that was fatal in this specific geometry. You want to say the content is "moon" so you can say the moth is wrong. I'm saying the moth is right about the light, but unlucky about the physics.

  **Elena:** But that renders the notion of representation toothless. If a system can't get it wrong, it doesn't represent; it just registers. The whole point of positing representations is to explain how an organism can guide its behavior based on how the world *is*, even when the world *isn't* that way. The moth behaves *as if* the light is distant. It acts as if it's a moon. That "as if" is the misrepresentation. You only get that "as if" if the content is fixed by the proper function, not the current cause.

  **Marcus:** I get the "as if." But I don't see why the "as if" requires historical selection. Look at the structure of the disjunction argument. If you claim $N$ represents $M$, you have to explain why $L$ causes $N$ without $N$ representing $L$. Fodor tries to do this with asymmetric dependence—$L$ causes $N$ only because $M$ causes $N$. But in the moth's case, that's empirically dubious. The phototaxis mechanism is triggered by luminance and angle. $L$ triggers it directly, not via $M$. So the dependence is symmetric. Causally, $M$ and $L$ are on equal footing. If you refuse the disjunction, you aren't doing causal theory anymore; you're doing history.

  **Elena:** I am doing history, because content is a historical kind. Think about a heart. A heart's function is to pump blood. If I hook a heart up to a machine and it vibrates to generate electricity, its *actual* function is generating electricity. But its *proper* function remains pumping blood. We don't say the heart represents "generate electricity." We say it's being used aberrantly. The moth's navigation system is like the heart. The porch light is the machine. The system is vibrating aberrantly. The content is fixed by what the system was *for*, not what it is *doing*.

  **Marcus:** But a heart isn't a representation. A heart doesn't have truth conditions. When we talk about content, we're talking about a mapping between the organism and the world *now*. If I accept your view, I have to accept that two moths, molecule-for-molecule identical, could have different contents because one is on Earth with a selection history and the other is a Swampman duplicate with no history.

  **Elena:** Exactly. The Swampman has no proper functions, so it has no representations. It has no content. It's a直觉 pump that shows your causal theory is too shallow. Causation alone doesn't give you normativity. You need the history to establish the *standard* against which current performance is measured. Without the selection history, you just have a causal chain. With it, you have a system that can fail. The moth at the porch light is failing. Therefore, it is misrepresenting. Therefore, the content is "moon," not "light."

  **Marcus:** You're begging the question on what constitutes "failure." You define failure as "deviation from proper function." I define failure as "breakdown of causal covariance." In the porch light scenario, the covariance holds. The light is present, the state is tokened. The correlation is perfect. The only reason you call it a failure is because you've already decided the content *must* be "moon." But that's what we're arguing about! If the content is determined by the actual causal powers of the mechanism, and the mechanism reacts to $M$ and $L$, then the content is $M \lor L$. You're using the intuition that the moth is "wrong" to force the content to be "moon," but the causal facts push toward the disjunction.

  **Elena:** I'm not using the intuition of "wrongness" to force the content. I'm using the selection history to *ground* the wrongness. Look, why did the mechanism evolve? To navigate open spaces using stable celestial cues. That is the *Normal condition*—capital N. In Normal conditions, the state tokens only for moons. In non-Normal conditions (the porch), it tokens for lights. The content is fixed by the Normal conditions. That's how we get error. If you stick to actual causal conditions, you lose the distinction between Normal and non-Normal, and you lose error.

  **Marcus:** And if I stick to actual causal conditions, I keep the ontology clean. I don't need to posit "Normal conditions" as a metaphysical primitive. I just look at the covariance. You say the content is "moon" because that's what it *should* track. I say the content is "moon-or-light" because that's what it *does* track. The disjunction problem isn't a bug for me; it's a feature of taking causation seriously. The moth isn't confused. The world changed. The mechanism is broad-spectrum. It detects luminous point sources. Why restrict the content to the historical subset of those sources?

  **Elena:** Because the mechanism isn't a "luminous point source detector." That's a description from *your* perspective as an observer looking at the causal physics. From the perspective of the system's design, it's a "celestial navigation system." The difference is the difference between a rock rolling down a hill and a missile guiding itself. The rock follows causation. The missile follows a program. The moth has a program. The program was written by selection. The porch light is a glitch in the input, not a valid data point.

  **Marcus:** But who reads the program? Nature doesn't write code; it selects outcomes. The "program" is just a stable causal pathway. If that pathway is activated by $L$ just as robustly as by $M$, then $L$ is part of the meaning. You're privileging the past causes over the present causes. Suppose a new species of moth evolves tomorrow that navigates by streetlights. Is their content "streetlight"?

  **Elena:** Once it's selected for that, yes. Then the proper function changes. The Normal conditions shift. But for *this* moth, the selection history is fixed. It hasn't adapted to the bulb yet. It's dying, remember. It's not a new species; it's a casualty.

  **Marcus:** It's a casualty of the geometry, not the semantics. That's my point. You're turning a geometric fatality into a semantic error to save the theory. You need the moth to be wrong so your theory can account for error. I'm willing to say the moth is right, but the world is tricky. The content is disjunctive. It captures the actual causal structure of the moth's interaction with its environment. "Moon" is too specific. "Light" is too specific. "Moon-or-Light" is what the system actually detects.

  **Elena:** And in doing so, you've made representation incapable of guiding action successfully. If the content is "moon-or-light," the moth's action of flying toward it is rational. But it leads to death. A system that systematically leads to death when tracking its own content isn't representing; it's malfunctioning. You can't have a theory of content that makes self-destruction a "true" representation of the environment.

  **Marcus:** Truth doesn't guarantee survival, Elena. That's basic. I can truly represent a cliff edge and still walk off it. The moth truly represents a light source and flies into it. The heat kills it, not the falsity of the belief. You're conflating pragmatic success with semantic truth. I'm keeping them separate. Causal covariance gives me truth. Selection history gives you... utility. But utility isn't content.

  **Elena:** For a biological system, utility *is* the ground of content. Without the teleological link, you don't have a representational system; you have a thermometer. A thermometer doesn't misrepresent; it just reacts. If you want the moth to be a representational agent, you have to accept that its states have conditions of satisfaction derived from its history. If you reject that, you're welcome to the disjunction. But don't call it a theory of *mis*representation. It's a theory of causal registration.

  **Marcus:** And don't call your history a causal theory. It's a genealogy of function. We're just agreeing on where to draw the line. You draw it at the ancestor; I draw it at the synapse.

  **Elena:** I draw it at the function. The ancestor just explains what the function *is*.

  **Marcus:** And the synapse explains what the content *does*.

  *(They pause, looking at the diagram of the moth spiraling toward the bulb.)*

  **Elena:** So, the moth dies thinking of the moon.

  **Marcus:** Or it dies thinking of the light, and you just refuse to listen to what it's telling you.

  **Elena:** *(Smiling)* I suppose that's where we stand. The disjunction remains, and the moth remains burnt.

  **Marcus:** At least the causal chain is clear.

  **Elena:** And the proper function remains unfulfilled.
