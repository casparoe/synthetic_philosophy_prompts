prompt: |-
  Hey — I'm one of five maintainers on a pretty widely used open-source agent framework (think tens of thousands of downstream projects, some of them wired into hospital record systems and payment flows). Any one of us can merge to main and cut a release, no second approver required, and that's not going to change — the whole point of the team is that we move fast. We merge maybe fifteen things a week. Most are obviously trivial. But every couple of weeks something lands that isn't: it has a real upside, a tail risk that would hit every downstream user at once, and no way to recall it once it's out.

  There's this idea I keep half-remembering from a paper somewhere — the unilateralist's curse, or something like it — about situations where lots of people can each act alone, the benefit only pays out once no matter how many act, but the downside gets shared by everybody. The upshot as I understand it is that the more people who could each pull the trigger, the more each individual one of them should hold off, because the chance that *someone* acts on thin evidence goes up with the number of people, while the upside doesn't. We want to actually run that.

  So: write us a decision procedure we can run in twenty minutes, on a laptop, by someone who has never read any decision theory, on any PR that isn't obviously trivial. I need:

  - the questions in the order we ask them, and what counts as a good enough answer to each (we can't get real numbers on most of this — give us coarse bands and say what to do when even a band is a guess);
  - where the procedure just stops with a no and kicks the thing up to the release lead or to our slow two-week review path;
  - where it has to stop and hand the call to a human because the question is about values, not facts — my teammates will bin anything that pretends to be a flowchart all the way down, so be explicit about which steps are judgement calls wearing a lab coat;
  - and the distinctions from the actual idea that have to survive the simplification, versus the ones we can drop for the sake of it being usable. Don't water it down into generic "be careful when the stakes are high".

  A few things I think it has to handle, which is where I keep tying myself in knots: upside that's redundant (if any of five of us ships it, shipping it twice adds nothing) versus upside that accumulates; the counterfactual where someone else on the team — or someone in the wider ecosystem, call it the shadow quorum, since plenty of other forks could independently ship the same change — would have done it in the next month anyway, so my acting isn't what produces the benefit; the fact that the downside is shared and non-excludable while the credit accrues to me; and the point I find spookiest, that the people who end up acting are selected for being the ones whose evidence was thinnest, so my own confidence isn't really the variable — presumably the question is closer to "how many people with my evidence would ship this". There's also the mirror image: sometimes *not* merging is the unilateral move with the scary tail, and deferring to the group is itself a way of acting.

  Then run it on three real-ish cases:

  1. An outside contributor's PR adding an escape hatch to the command sandbox. Big user win, fast, and a maybe-one-in-a-hundred chance of a sandbox escape that would compromise every downstream deployment simultaneously.
  2. A PR that quietly downgrades the agent's capabilities whenever it thinks it's being used for something on a blocklist. Could prevent a lot of harm, could also be a rug-pull that destroys trust in the project, and we genuinely can't tell which yet.
  3. My own patch. It closes a prompt-injection hole that's being exploited in the wild right now, I've spent two weeks on it, I'm confident it's good, and it rewrites the tool-call parser — so if it's subtly wrong it breaks every downstream app in a way that looks like the model failing. Run the procedure honestly on this one and if it comes out as "don't merge today", please just say so plainly; I'd definately rather hear it from you than read it in a postmortem.

  Finally, tell us what the procedure can't do — especially anything about us five all being similar enough that our errors are correlated, which I suspect quietly breaks the whole thing.

  Oh and write it in British English, our docs are all en-GB and I get moaned at otherwise. No need to tell me who came up with the idea or where to read more about it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** One of five maintainers of a high-stakes open-source agent framework (tens of thousands of downstream projects, including hospitals/payments).
      *   **Context:** Fast-moving team, any of the five can merge/release without approval (15 merges/week). Most are trivial, but some have high tail risk.
      *   **Core Concept:** "Unilateralist's Curse" (Nick Bostrom et al.). The idea: When many actors can act alone to produce a public good (or bad), but the benefit is non-rivalrous (one person doing it is enough) and the cost is shared, individuals should act more conservatively than their private judgment suggests to avoid the risk that *someone* acts on insufficient evidence.
      *   **Task:** Create a 20-minute decision procedure for non-trivial PRs.
      *   **Requirements:**
          *   Ordered questions with coarse bands (no precise numbers).
          *   Clear stop conditions (kick to release lead/slow path).
          *   Explicit identification of value judgments vs. factual estimates.
          *   Preserve key distinctions from the theory (redundant upside, shared downside, selection effect on evidence).
          *   Run on three specific cases (Sandbox escape, Blocklist downgrade, Prompt-injection fix).
          *   Honest output on Case 3 (even if it says "don't merge").
          *   Limitations section (specifically regarding correlated errors among the 5 maintainers).
          *   **Tone/Style:** British English (en-GB), practical, no academic citations, no "be careful" platitudes.

  2.  **Deconstruct the Unilateralist's Curse for this Context:**

      *   *Standard Theory:* If $N$ people can act, and the benefit $B$ happens if *anyone* acts, but cost $C$ is shared, the threshold for acting should rise with $N$.
      *   *Adaptation:*
          *   $N = 5$ maintainers + "Shadow Quorum" (forks/competitors).
          *   Benefit: Is it redundant? If I don't merge, will someone else soon? (Counterfactual).
          *   Cost: Shared downstream (hospitals/payments). Non-excludable.
          *   Evidence Selection: If I'm the one considering merging, am I the most optimistic of the 5? (Selection bias).
          *   Inaction Risk: Sometimes *not* acting is the unilateral risk (e.g., security patch).

  3.  **Drafting the Procedure (The "20-Minute Protocol"):**

      *   *Goal:* Needs to be actionable. Not a math proof.
      *   *Structure:* Filter -> Estimate -> Adjust -> Decide.
      *   *Language:* Direct, imperative, British spelling (analyse, realise, programme, etc.).
      *   *Key Distinction:* Facts vs. Values. I need to mark where the user must consult their conscience/team norms.

      *   *Step 1: Triviality Check.* (Skip if trivial).
      *   *Step 2: The Redundancy Check (Upside).* If I don't do it, will it happen anyway?
      *   *Step 3: The Harm Distribution (Downside).* Who pays? Is it concentrated or diffuse?
      *   *Step 4: The Evidence Adjustment (The Curse).* Adjusting confidence based on the fact that I'm the one asking.
      *   *Step 5: The Inaction Check.* Is waiting dangerous?
      *   *Step 6: The Verdict.* Merge, Hold, or Escalate.

  4.  **Refining the Questions & Bands:**

      *   Avoid "What is the probability?" (Humans are bad at this).
      *   Use "How many of us would agree?" or "How long until someone else does this?"
      *   *Band Example:* "Would 4/5 teammates agree this is safe?" vs "Would 2/5 agree?"
      *   *Stop Condition:* If downside is catastrophic + upside is redundant = Stop/Escalate.

  5.  **Addressing the Specific Nuances:**

      *   *Redundant Upside:* If the feature exists once, adding it again adds nothing.
      *   *Shadow Quorum:* If a fork will ship it, our caution might be moot (unless we are the trusted source).
      *   *Selection Effect:* "If I'm the one pushing this, is it because I'm the least cautious?"
      *   *Value Judgments:* Explicitly flag where "acceptable risk" is defined.

  6.  **Developing the Three Cases:**

      *   *Case 1 (Sandbox Escape):* High shared risk, redundant upside (one escape hatch is enough). *Verdict: Escalate/No.*
      *   *Case 2 (Blocklist Downgrade):* High trust risk, ambiguous intent. Value judgment heavy. *Verdict: Escalate/No.*
      *   *Case 3 (Security Patch):* High risk of breakage, but *inaction* is also high risk (exploit in wild). Upside is not redundant (we need *this* fix now). *Verdict: Tricky. The procedure might flag the risk, but the "Inaction Check" saves it. However, the prompt asks me to be honest if it says "don't merge". I need to weigh the "rewrites parser" risk against "exploit in wild". Usually, active exploitation trumps potential breakage, but the "Unilateralist" lens suggests checking if *another* maintainer agrees. Since I am the author, the selection bias is high. I should probably recommend a "Sanity Check" pause, not a full block.*
      *   *Correction on Case 3:* The prompt says "Run the procedure honestly... if it comes out as 'don't merge today', please just say so plainly." I must not bias the procedure to pass Case 3. I must apply the logic rigorously. If the logic says "Wait for a second pair of eyes on a parser rewrite," I must say that.

  7.  **Drafting the Limitations Section:**

      *   *Correlated Errors:* The 5 maintainers likely think alike (same background, same docs). The "N=5" assumption of independence is false. This weakens the curse adjustment but strengthens the need for external review.
      *   *Time Pressure:* 20 minutes might not be enough for deep code review.
      *   *Moral Hazard:* Relying on the procedure to absolve guilt.

  8.  **Review against Constraints:**

      *   British English? (Check: 'analyse', 'programme', 'colour', 'defence', 's' not 'z' in organise).
      *   No academic citations? (Check).
      *   20 minutes? (Keep it short).
      *   Explicit value judgments? (Highlight them).
      *   Case 3 honesty? (Crucial).

  9.  **Writing - Section by Section (Mental Sandbox):**

      *   *Intro:* Acknowledge the gravity.
      *   *The Protocol:* Numbered steps. Bold text for actions.
      *   *The Cases:* Apply the steps mechanically.
      *   *Limitations:* Be blunt about the "Groupthink" issue.

      *(Self-Correction during drafting Case 3)*: The prompt says "My own patch... I'm confident it's good." The Unilateralist Curse specifically targets *overconfidence* when you are the one acting. If I am the author, I am the most biased. The procedure *must* account for authorship bias. If the procedure works, it should likely suggest "Get one other maintainer to glance at it even if merge rights don't require it." I will write the procedure to require a "Sanity Signal" for high-risk rewrites. If the user (maintainer) is alone, the procedure should say "Wait". I will be honest.

      *(Refining British English)*: Ensure "license" (noun) vs "licence" (verb) is correct (actually in UK, licence is noun, license is verb). Ensure "practise" vs "practice". Ensure "programme" for software. Ensure "analyse".

      *(Refining the Theory)*: The core insight is: $P(Act) \times Cost > Benefit$. But since Benefit is capped (non-rival), as $N$ increases, $P(Act)$ must decrease.
      Simplified: "If anyone could do this, would we want *anyone* to do this?"
      Better: "If I don't do it, how long until it's done safely?"

      *(Final Polish on Case 3)*: The prompt asks me to run it *honestly*. If the procedure dictates a pause, I must recommend the pause. I cannot game the system to make the user feel better. This builds trust.

  10. **Final Review of the Output:**
      *   Does it look like a checklist? Yes.
      *   Is the distinction between fact and value clear? Yes, I'll use boxes or bold warnings.
      *   Is the tone appropriate? Serious, professional, peer-to-peer.

  Let's assemble.

  *(Self-Correction on "Unilateralist's Curse" specifics)*: The prompt mentions "the people who end up acting are selected for being the ones whose evidence was thinnest". I need to embed a question like: "Are you the most enthusiastic about this change among the five?"

  *(Self-Correction on "Shadow Quorum")*: If a fork will ship it anyway, does our caution matter? Yes, because we are the "trusted" upstream. If we ship a bug, it validates the bug. If we wait, we might ship a safer version later.

  Okay, ready to write.
answer: |-
  # The Unilateralist's Protocol (20-Minute Version)

  This procedure is designed to adjust your private confidence downwards when you are one of several actors capable of imposing a shared risk. It is not a code review tool; it is a governance check. It assumes the code is functionally sound but questions whether *you*, specifically, should be the one to release it *now*, without consultation.

  **Timebox:** 20 minutes. If you exceed this, you have entered a review phase, not a decision phase. Escalate.
  **Scope:** Non-trivial PRs only. (Trivial = typo fixes, logging, docs, config tweaks with no logic change).

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: The Redundancy Check (Upside)
  *Goal: Determine if the benefit is non-rivalrous.*

  **Q1: If you do not merge this today, will the benefit still exist in 30 days?**
  *   **Yes, definitely:** (e.g., another maintainer is working on it; a competitor/fork is shipping it; the feature is already partially live).
      *   *Action:* Proceed to Step 2.
  *   **No, the opportunity vanishes:** (e.g., a time-sensitive security patch; a window to fix a breaking API change).
      *   *Action:* **Skip to Step 5 (Inaction Risk).**
  *   **Unsure / Guess:** Assume **Yes**. (Optimism bias is your enemy here).

  **Q2: If someone else merges this next week, is your merge today worthless?**
  *   **Yes:** (e.g., enabling a feature flag that only needs flipping once).
      *   *Action:* **High Redundancy.** Note this.
  *   **No:** (e.g., performance improvements that stack; handling more load).
      *   *Action:* **Low Redundancy.**

  > **VALUE JUDGMENT ALERT:** You are deciding whether speed is more valuable than safety. There is no factual answer. If you value "being first" over "being the safest upstream", state that explicitly to yourself before moving on.

  ### Step 2: The Harm Distribution (Downside)
  *Goal: Determine if the cost is shared and non-excludable.*

  **Q3: If this breaks, who pays the cost?**
  *   **Mostly us:** (e.g., our servers burn more CPU).
      *   *Action:* **Low Shared Risk.** Proceed to Step 3.
  *   **Mostly downstream:** (e.g., hospital records corrupt, payments fail, security compromised).
      *   *Action:* **High Shared Risk.**
  *   **Mixed:** Weight towards **High Shared Risk**.

  **Q4: Can a downstream user opt out of this breakage easily?**
  *   **Yes:** (e.g., they can pin a previous version, or toggle a config).
      *   *Action:* **Mitigated Risk.**
  *   **No:** (e.g., silent data corruption, security hole, breaking change without semver major).
      *   *Action:* **Non-Excludable Risk.**

  **STOP CONDITION A:** If **High Shared Risk** AND **Non-Excludable Risk**, you cannot merge on your own authority unless Step 5 overrides it. **Prepare to Escalate.**

  ### Step 3: The Evidence Adjustment (The Curse)
  *Goal: Correct for the fact that you are the one asking.*

  **Q5: Among the five maintainers, are you the most enthusiastic about this change?**
  *   **Yes:** (You wrote it; you championed it; others were lukewarm).
      *   *Action:* **Apply Penalty.** Reduce your confidence level by one full band (see below).
  *   **No:** (Others are pushing for this; you are the reluctant merger).
      *   *Action:* No penalty.
  *   **Unsure:** Assume **Yes**.

  **Q6: How many of the other four maintainers would merge this *without hesitation* if they were in your seat?**
  *   **4 or 5:** (Consensus is clear).
      *   *Band:* **Strong Evidence.**
  *   **2 or 3:** (Split decision likely).
      *   *Band:* **Weak Evidence.**
  *   **0 or 1:** (You are the outlier).
      *   *Band:* **Critical Evidence Deficit.**

  **STOP CONDITION B:** If **Critical Evidence Deficit** AND **High Shared Risk**, **Do Not Merge.** Escalate to the release lead or the slow path.

  ### Step 4: The Shadow Quorum
  *Goal: Account for the wider ecosystem.*

  **Q7: If we don't ship this, will an untrusted fork ship a worse version soon?**
  *   **Yes, almost certainly:** (e.g., a critical security fix we are sitting on).
      *   *Action:* This increases the cost of *inaction*. Note for Step 5.
  *   **No / Unsure:**
      *   *Action:* Assume our release sets the standard. Caution is warranted.

  ### Step 5: The Inaction Check (Mirror Image)
  *Goal: Determine if waiting is the unilateral risk.*

  **Q8: Is there an active exploit or active harm happening *right now* that this fixes?**
  *   **Yes:** (e.g., logs show exploitation in the wild).
      *   *Action:* **Inaction Risk is High.** This can override Stop Condition A, but requires a "Sanity Signal" (see Verdict).
  *   **No:** (e.g., theoretical vulnerability; feature request).
      *   *Action:* **Inaction Risk is Low.**

  ### Step 6: The Verdict

  Combine the outputs:

  1.  **MERGE:** Low Shared Risk OR (High Inaction Risk AND Strong Evidence).
  2.  **SANITY SIGNAL:** High Shared Risk AND (Weak Evidence OR Author Penalty).
      *   *Requirement:* You must message the team channel: *"I am merging X due to [reason]. It carries [risk]. If anyone objects strongly, speak in 30 mins."* Then wait 30 mins.
  3.  **ESCALATE / HOLD:** High Shared Risk AND (Critical Evidence Deficit OR Non-Excludable Risk) AND Low Inaction Risk.
      *   *Requirement:* Move to the slow review path. Do not merge to main.

  ---

  ## Part 2: Running the Cases

  Here is the procedure applied honestly to your three scenarios.

  ### Case 1: The Sandbox Escape Hatch
  *PR: Adds escape hatch to command sandbox. Big user win. 1% risk of total sandbox compromise.*

  1.  **Redundancy:** If you don't merge, will it exist in 30 days? **Likely Yes** (feature request, not emergency). **High Redundancy.**
  2.  **Harm:** Who pays? **Downstream** (every deployment). Opt-out? **No** (if sandbox breaks, it breaks for all). **High Shared / Non-Excludable.**
      *   *Trigger:* **STOP CONDITION A.**
  3.  **Evidence:** Are you the most enthusiastic? **Yes** (you are considering merging it). **Apply Penalty.** How many others would merge without hesitation? **Guess: 2 or 3** (it's a big win, but risky). **Weak Evidence.**
      *   *Trigger:* **STOP CONDITION B.**
  4.  **Inaction:** Active exploit? **No.**
  5.  **Verdict:** **ESCALATE / HOLD.**
      *   *Reasoning:* The downside is catastrophic and shared. The upside is redundant (can wait). You are potentially the optimistic outlier. This requires the slow path or a formal vote. Do not merge today.

  ### Case 2: The Blocklist Downgrade
  *PR: Quietly downgrades capabilities for blocklisted tasks. Prevents harm vs. rug-pull trust risk.*

  1.  **Redundancy:** **Low Redundancy** (Policy decision, not code capability).
  2.  **Harm:** Who pays? **Downstream** (trust loss). Opt-out? **No** (silent change). **High Shared / Non-Excludable.**
      *   *Trigger:* **STOP CONDITION A.**
  3.  **Evidence:** Are you the most enthusiastic? **Unsure** (Assume Yes). **Apply Penalty.** How many others? **Unsure** (Policy is divisive). **Critical Evidence Deficit.**
      *   *Trigger:* **STOP CONDITION B.**
  4.  **Values Check:** This is not a fact. This is a policy decision on whether the project polices user intent.
      *   *Action:* **VALUE JUDGMENT ALERT.** This cannot be solved by the maintainers alone; it requires community consensus or a steering committee decision.
  5.  **Verdict:** **ESCALATE / HOLD.**
      *   *Reasoning:* This is a values call wearing a lab coat. Merging this unilaterally centralises a moral risk across all downstream users. Kick to the release lead to convene a discussion.

  ### Case 3: Your Prompt-Injection Patch
  *PR: Closes active hole. Rewrites tool-call parser. High breakage risk if subtle bug exists. You wrote it.*

  1.  **Redundancy:** If you don't merge, will it exist in 30 days? **No** (You wrote it; exploit is active). **Low Redundancy.**
      *   *Action:* Skip to Step 5.
  2.  **Inaction:** Active exploit? **Yes.** **Inaction Risk is High.**
  3.  **Harm:** Who pays? **Downstream** (breakage looks like model failure). Opt-out? **No** (parser rewrite). **High Shared / Non-Excludable.**
      *   *Trigger:* **STOP CONDITION A.**
  4.  **Evidence:** Are you the most enthusiastic? **Yes** (You wrote it, you are confident). **Apply Penalty.**
      *   *Adjustment:* You feel "Confident". Penalty applied -> **"Moderately Confident"**.
      *   How many others would merge without hesitation? **Guess: 2 or 3** (Parser rewrites scare people). **Weak Evidence.**
      *   *Trigger:* **STOP CONDITION B** (Weak Evidence + High Shared Risk).
  5.  **Resolution:** Usually, Stop Condition B means HOLD. However, **High Inaction Risk** overrides HOLD, but forces **SANITY SIGNAL**.
  6.  **Verdict:** **SANITY SIGNAL.**
      *   *Instruction:* Do not merge immediately. Post in the maintainer channel: *"Active exploit detected. I have a patch that rewrites the parser. It fixes the hole but carries breakage risk. I am confident, but I am the author. I intend to merge in 45 minutes unless someone vetoes."*
      *   *Honest Output:* **Do not merge today without that 45-minute window.** Even if you are right, the Unilateralist's Curse dictates that because you are the author *and* the merger, your confidence is statistically suspect. You need one other pair of eyes to confirm the rewrite isn't obviously broken. If no one responds in 45 minutes, the silence counts as the second signal. Merge then.

  ---

  ## Part 3: What This Procedure Cannot Do

  You asked for the distinctions that must survive simplification, and the limitations. Here they are.

  **1. Correlated Errors (The Groupthink Problem)**
  The theory assumes the five of you are independent actors. You are not. You read the same docs, hire from the same pool, and argue in the same Slack channel. If you are wrong about the parser rewrite, there is a high probability the other four are wrong in the *same way*.
  *   *Consequence:* The "Sanity Signal" in Case 3 might give false comfort. If all five of you share a blind spot, the procedure clears the risk even though the risk remains.
  *   *Mitigation:* The procedure cannot fix this. Only external audit or canary deployments can.

  **2. The "Shadow Quorum" Illusion**
  The procedure asks if a fork will ship a worse version. Often, we tell ourselves "Yes" to justify shipping quickly. In reality, if the trusted upstream (you) waits, the ecosystem often waits too.
  *   *Consequence:* You may overestimate the cost of inaction.
  *   *Mitigation:* Be brutal in Q7. Unless there is public evidence of a fork ready to ship, assume the answer is "No".

  **3. Moral Hazard**
  Running this procedure can become a box-ticking exercise to absolve guilt. "I ran the protocol, so if it burns, it's not my fault."
  *   *Consequence:* The procedure becomes a shield rather than a filter.
  *   *Mitigation:* The protocol requires you to explicitly state *why* you are overriding a Stop Condition. Write it down.

  **4. Value Judgments Disguised as Facts**
  In Case 2 (Blocklist), the risk isn't technical; it's reputational and ethical. The procedure flags this, but it cannot solve it.
  *   *Consequence:* You might try to quantify "trust loss" to force a number.
  *   *Mitigation:* Respect the **VALUE JUDGMENT ALERT**. If the question is "Should we?" rather than "Can we?", the procedure must hand off to a human discussion, not a flowchart.

  **5. The Selection Effect on "Confidence"**
  The hardest pill to swallow is Q5. If you are the one merging, you are statistically likely to be the one with the thinnest evidence, simply because the cautious maintainers self-selected out.
  *   *Consequence:* Your personal confidence is the wrong variable to measure.
  *   *Mitigation:* This is why the procedure asks "How many *others* would do this?" rather than "How sure are *you*?" Trust the distribution, not the individual.

  ### Final Note on Case 3
  You asked for honesty. The procedure says **wait 45 minutes for a sanity signal.**
  I know you have spent two weeks on this. I know the exploit is active. But you are rewriting the parser. That is the definition of a shared, non-excludable tail risk. If you are wrong, every hospital and payment flow using your agent breaks simultaneously, and they cannot opt out.
  The Unilateralist's Curse does not say "Don't act." It says "Don't act *alone* when the downside is shared."
  Send the message. Wait the 45 minutes. If the team is silent, you have your quorum. Then merge.
