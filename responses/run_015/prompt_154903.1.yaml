      *   *Problem for ESR:* If the choice of mathematical framework is pragmatic (Quine), then the "structure" we claim to know is also subject to pragmatic revision, not necessarily a mirror of reality. Furthermore, if we can't distinguish analytic (definition) from synthetic (fact), how do we distinguish "structural description" from "ontological commitment"?
      *   *Problem for Quine:* Quine is a *realist* (mostly). He believes in the entities posited by our best theory. ESR is agnostic/skeptical about the entities. Quine might ask: If the structure works, why deny the relata? To be is to be the value of a variable. If the variables range over electrons, electrons exist. ESR says "We know the electron's relations, but not what an electron *is*." Quine might say "That distinction is meaningless; being an electron just *is* occupying that node in the causal/structural web."

