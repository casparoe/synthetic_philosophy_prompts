          *   Pragmatism: Theory choice is guided by simplicity, conservatism, etc., not by matching "reality" directly.
          *   Underdetermination (Duhem-Quine): Multiple theories can account for the same evidence.
          *   Ontological Commitment: "To be is to be the value of a bound variable." We commit to entities required by our best theory.

      *   **Epistemic Structural Realism (ESR):**
          *   Claim: Science tells us about the *structure* of the world (relations, equations), not the *intrinsic nature* of the relata (objects, substances).
          *   Motivation: Pessimistic Meta-Induction (old theories' ontologies were wrong, but their math survived) + No Miracles Argument (science works, so structure must be real).
