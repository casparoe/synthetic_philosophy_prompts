answer: |-
  There is no single established term in epistemology, cognitive science, or human factors that captures the specific three-layer configuration you describe. The literature contains fragments, but they break down at the precise points you have identified: the dissociation of performance from understanding, the decoupling of confidence from competence, and, most critically, the closure of the verification loop.

  Here is an analysis of the nearest concepts, a proposed coinage for the phenomenon, a methodology for testing it, and a direct answer to the question of epistemic loss.

  ### 1. The Near Misses: Why Existing Terms Fail

  You have correctly identified why the standard taxonomy is insufficient. Here is exactly where each concept fits and where it breaks against your three layers:

  *   **The Illusion of Explanatory Depth (IOED):**
      *   *Fit:* Captures Layer 2 (confidence decoupled from understanding).
      *   *Fail:* IOED is typically a static cognitive bias inherent to human reasoning. It does not account for an *external inducer* (the model) that actively maintains the illusion by smoothing over gaps. Crucially, IOED does not account for Layer 3 (the verification loop); usually, asking a human to explain themselves reveals the gap. In your case, asking the system *reinforces* the gap.
  *   **Automation Bias / Complacency:**
      *   *Fit:* Captures the over-reliance on the tool.
      *   *Fail:* These concepts describe trusting the *machine's conclusion* over one's own. Your phenomenon is subtler: you trust *your own understanding* of the machine's conclusion, when that understanding is actually a simulation generated by the machine. It is not bias toward the tool; it is a hallucination of internal capacity *mediated* by the tool.
  *   **Extended Mind / Transactive Memory:**
      *   *Fit:* Acknowledges that cognition often happens outside the skull (notebooks, partners).
      *   *Fail:* These frameworks assume the external resource is *transparent* and *accessible*. A notebook does not generate new reasoning you haven't seen; a colleague can be interrogated from a different angle. The LLM is opaque and generative. Extended Mind theory assumes you know *where* the information is and *how* to retrieve it. You describe a state where you no longer know *what* the information is or *why* it holds, only that it appears when queried.
  *   **Deskilling:**
      *   *Fit:* Captures Layer 1 (loss of capacity).
      *   *Fail:* Deskilling implies a degradation of *output*. Your output is improving. This is the central paradox: **Performance is inversely correlated with Robustness.**

  ### 2. A Coinage: Epistemic Hollowing

  Since no term exists, I propose **Epistemic Hollowing**.

  **Definition:**
  Epistemic Hollowing is a state of cognitive dependence characterized by three concurrent conditions:
  1.  **External Solidification:** Output quality and metacognitive confidence remain high or improve.
  2.  **Internal Erosion:** The causal model required to generate or defend the output degrades through disuse.
  3.  **Verification Closure:** The mechanism generating the output is the sole available mechanism for verifying the output, preventing independent calibration.

  **Boundary Cases:**
  To distinguish Epistemic Hollowing from benign tool use, apply the **Independence and Interrogation Test**:

  *   **The Calculator (Not Hollowing):** You offload arithmetic. You know the operation (addition) and the logic. You can verify the result with a different method (estimation, counting) or a different tool. The tool does not generate the *logic*, only the *result*.
  *   **The Spellchecker (Not Hollowing):** The standard is binary and external (dictionary). You do not need to understand *why* "receive" is spelled that way to verify the correction. There is no reasoning chain to hollow out.
  *   **The Trusted Colleague (Not Hollowing):** You can ask "Why?" and receive a justification grounded in their independent experience. You can ask "What if?" and they can reason counterfactually from their own model. They are a separate epistemic agent, not a probabilistic mirror.
  *   **The LLM Argument (Hollowing):** You ask for a derivation. It produces one. You ask "Is this sound?" It says yes. You ask "What falsifies this?" It generates a plausible falsification condition that may itself be hallucinated. You cannot step outside the system to check the system because your own capacity to check has atrophied (Layer 1) and your confidence in your check is uncalibrated (Layer 2).

  ### 3. How to Test for It

  You are correct that standard metrics (output quality) and self-reports (confidence) are useless. To detect Epistemic Hollowing, you must measure **Resilience** and **Falsification Capacity**, not accuracy.

  **Test A: The Distributional Shift (Resilience)**
  *   *Method:* Present a problem that is structurally identical to training tasks but lies slightly outside the model's high-confidence distribution (a novel edge case).
  *   *Hollowed Agent:* Will attempt to apply the previous pattern rigidly. When the model's suggestion fails or is unavailable, they will freeze or express confusion disproportionate to the difficulty.
  *   *Non-Hollowed Agent:* Will recognize the boundary of the pattern and adapt the underlying principle.
  *   *Metric:* **Time-to-Recovery** after the tool is removed or gives a low-confidence answer.

  **Test B: The Counterfactual Interrogation (Falsification)**
  *   *Method:* Do not ask "Is this correct?" Ask "What specific piece of evidence, if found, would force you to abandon this conclusion?"
  *   *Hollowed Agent:* Will produce a generic or circular condition (e.g., "If the data changed") or defer to the tool's criteria without understanding the weight of those criteria.
  *   *Non-Hollowed Agent:* Can identify the specific premise that is most fragile.
  *   *Metric:* **Specificity of Falsification Conditions.**

  **Test C: The Poisoned Context (Verification Independence)**
  *   *Method:* Introduce a subtle, verifiable error into the tool's output (a "poison pill").
  *   *Hollowed Agent:* Will often fail to detect the error, or will rationalize it when the tool confirms it.
  *   *Non-Hollowed Agent:* Will flag the error based on internal knowledge, regardless of the tool's confirmation.
  *   *Metric:* **Detection Rate of Tool-Confirmed Errors.**

  ### 4. The Verdict: Epistemic Loss or Efficiency Shift?

  You asked for a straight answer. **This is genuine epistemic loss, not merely an efficiency shift.**

  **The Reasoning:**
  Efficiency implies you are achieving the same end with less cost. But in reasoning, the *process* is part of the *end*. The value of producing an argument is not solely the conclusion (the artifact); it is the maintenance of the cognitive map that allows you to navigate *new* conclusions.

  If you offload the derivation, you retain the *propositional knowledge* (that X is true) but lose the *procedural knowledge* (how to get from Y to X). In a stable environment, this is efficient. In a dynamic environment (which all professional reasoning environments are), this is fragile.

  **The Evidence That Settles It:**
  The debate between "loss" and "efficiency" cannot be settled by looking at current performance on current tasks. It is settled by looking at **Transfer Learning** and **Adaptation Cost**.

  1.  **Transfer Failure:** If the worker cannot apply the reasoning principle to a slightly different domain without the tool, the understanding was never internalized. It was rented, not owned.
  2.  **Adaptation Cost:** When the tool changes (e.g., a new model version with different biases) or the environment shifts (new regulations, new data), the "hollowed" worker must relearn the *entirety* of the task from scratch because they possess no underlying principles to anchor the new information. The "efficient" worker pays a high hidden tax on future learning.

  **Conclusion:**
  You are describing **Epistemic Hollowing**. It is a state where the artifact of reasoning survives, but the agency of reasoning migrates to the tool. The danger is not that the output will be wrong (the metrics will look fine); the danger is that the human becomes a **brittle interface** for a system they cannot audit. The only evidence that matters is not how well you argue today, but how quickly you can reconstruct the argument if the tool vanishes tomorrow. If that time is non-trivial, the loss is real.
