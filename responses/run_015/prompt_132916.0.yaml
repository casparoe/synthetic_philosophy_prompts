answer: |-
  # THE ANALOGICAL STRESS TEST (AST)
  **Internal Procedure for Policy Planning Unit**
  **Time Limit:** 45 Minutes | **Output:** One-Page Ministerial Memo

  ## PART 1: THE PROCEDURE

  **STEP 1: PRE-REGISTRATION & POLICY LINK (5 Mins)**
  *   **Q1:** Was the analogy selected *before* or *after* the policy recommendation was drafted?
      *   *If After:* Flag as "Post-Hoc Rationalization." The analogy is evidence only if it survives Step 3.
  *   **Q2:** What specific action does this analogy license? (e.g., "Blockade," "Withdraw," "Strike").
      *   *Stop Rule:* If the analogy does not point to a specific action, it is **Rhetorical Work (Verdict 3)**. Strike it.

  **STEP 2: MECHANISM EXTRACTION (10 Mins)**
  *   **Q3:** What is the *causal mechanism* claimed by the proponent? (Not "what happened," but "why it happened").
      *   *Example:* Munich is not "Hitler took land." It is "Concessions to expansionist regimes signal weakness, increasing their demand rate."
      *   *Constraint:* Do not adjudicate historical truth. Accept the proponent's mechanism for the sake of the test, provided it is internally consistent.
  *   **Q4:** What are the *necessary conditions* for this mechanism to operate?
      *   *Example:* For Munich: Aggressor must have unlimited aims; Defender must value peace over credibility.
      *   *Stop Rule:* If conditions are vague (e.g., "bad leaders"), mark as **Reframing Device (Verdict 2)**.

  **STEP 3: CONDITION MATCHING (10 Mins)**
  *   **Q5:** Do the necessary conditions (Q4) exist in the *target* case based on open sources?
      *   *Yes:* Proceed.
      *   *No/Unknown:* The analogy **Earns No Weight**.
  *   **Q6:** (Reflexivity Check) Is the target actor aware of this analogy? Could they be staging events to trigger it?
      *   *If Yes:* Downgrade predictive confidence. The analogy may be a trap.

  **STEP 4: SYMMETRY CHECK (10 Mins)**
  *   **Q7:** What is the best-fitting historical analogy that supports the *opposite* policy?
      *   *Task:* Run Steps 2 & 3 on the counter-analogy. (e.g., If Munich says "Fight," 1914 says "De-escalate to avoid spiral").
  *   **Q8:** Compare the "Condition Match" score of the Proponent Analogy vs. the Counter Analogy.
      *   *If Proponent wins clearly:* Proceed to Step 5.
      *   *If Tie or Counter wins:* The analogy is a **Reframing Device (Verdict 2)**. It highlights risk but cannot decide policy.

  **STEP 5: COST OF ERROR (5 Mins)**
  *   **Q9:** If the analogy is wrong, is the recommended action irreversible?
      *   *High Irreversibility + Weak Analogy:* **Reframing Device (Verdict 2)**.
      *   *Low Irreversibility + Strong Analogy:* **Earns Weight (Verdict 1)**.

  **STEP 6: VERDICT & HAND-OFF**
  *   **Verdict 1 (Earns Weight):** Mechanism is clear, conditions match, counter-analogy is weaker, error cost is manageable. *Licenses prediction.*
  *   **Verdict 2 (Reframing Device):** Mechanism plausible but contested, or symmetry tie. *Generates questions for the Minister.*
  *   **Verdict 3 (Rhetorical Work):** No mechanism, post-hoc, or conditions missing. *Strike from paper.*
  *   **Human Hand-Off:** If Step 4 results in a Tie, or Step 6 involves high irreversibility with uncertain analogies, the decision is explicitly marked as **Value Judgment**. The analyst provides the risk profile; the Minister chooses the risk tolerance.

  ***

  ## PART 2: LIVE CASE RUNS

  **CASE A: THUCYDIDES TRAP (Rising vs. Established Power)**
  *   **Target:** Competition over Taiwan.
  *   **Proponent Analogy:** Peloponnesian War (Rising Sparta frightens Established Athens → War).
  *   **Policy:** Pre-emptive containment / Hard line.
  *   **AST Result:**
      *   *Mechanism:* Structural stress makes war probable regardless of intent.
      *   *Conditions:* Nuclear deterrence? High economic interdependence? Both exist now, absent in source.
      *   *Counter-Analogy:* Cold War (US vs. USSR). Mechanism: Nuclear stalemate + containment prevents hot war. Conditions match better (nukes, ideology, proxies).
      *   *Reflexivity:* Beijing explicitly cites the Trap to justify expansion; they are playing the script.
      *   *Verdict:* **Reframing Device.** The structural mechanism is too broad to license specific predictions. Use to highlight long-term risk, not to justify immediate escalation.

  **CASE B: MUNICH (Appeasement)**
  *   **Target:** Neighbor demands territory cap on alliances.
  *   **Proponent Analogy:** 1938 Sudetenland.
  *   **Policy:** Reject demands / Mobilize.
  *   **AST Result:**
      *   *Mechanism:* Concessions signal weakness, increasing aggressor demand rate.
      *   *Conditions:* Does the neighbor have *unlimited* ideological aims or *limited* irredentist aims? Open sources suggest mixed signals.
      *   *Counter-Analogy:* 1914 (July Crisis). Mechanism: Hardline posture triggers defensive mobilization spirals. Conditions: Alliance networks exist. Fit is comparable.
      *   *Reflexivity:* Neighbor may be testing resolve, expecting a Munich response to paint us as warmongers.
      *   *Verdict:* **Reframing Device.** Valid only if intelligence confirms unlimited aims. Currently, it frames the risk of concession but does not prove concession leads to war.

  **CASE C: VIETNAM (Quagmire)**
  *   **Target:** Sending advisers + air support to counterinsurgency.
  *   **Proponent Analogy:** Vietnam (US Advisory Phase → Ground War → Defeat).
  *   **Policy:** Restraint / No involvement.
  *   **AST Result:**
      *   *Mechanism:* Sunk cost fallacy drives incremental escalation to conscripted ground war.
      *   *Conditions:* Do we have conscription? No. Is domestic tolerance for casualties low? Yes. Is the government corrupt/legitimacy low? Mixed.
      *   *Counter-Analogy:* El Salvador / Colombia (Advisers + Air → Stabilization without ground war). Mechanism: Local forces do the fighting; air power tips balance. Conditions match current tech/politics better than 1960s Vietnam.
      *   *Reflexivity:* Insurgents expect us to leave (Vietnam Syndrome); they may prolong war to test this.
      *   *Verdict:* **Rhetorical Work (Strike).** The specific mechanism (conscription-driven domestic collapse) is absent. The analogy relies on "slippery slope" fear rather than causal portability.
      *   **Bias Check:** *This unit prefers the Vietnam analogy. The AST indicates it is the weakest of the three cases because the causal mechanism (mass mobilization) is missing. This must be stated in the memo.*

  ***

  ## PART 3: LIMITATIONS & FAILURE MODES

  **1. What the Procedure Cannot Do**
  *   **Predict Black Swans:** It tests portability of *known* mechanisms. It cannot foresee novel technologies or sudden regime collapses that break historical patterns.
  *   **Resolve Value Conflicts:** If Step 4 (Symmetry) ends in a tie (e.g., Munich and 1914 fit equally well), the procedure cannot choose. It hands the decision to the Minister as a choice between "Risk of Aggression" vs. "Risk of Escalation."
  *   **Replace Intelligence:** It relies on open sources for condition matching (Step 3). If the adversary's true aims are classified, the condition check may fail false-negative.

  **2. Where It Will Misfire**
  *   **The "Mechanism" Trap:** Generalist analysts may struggle to distinguish a mechanism from a description (Step 2). *Mitigation:* Require the mechanism to be an "If X, then Y" statement.
  *   **False Symmetry:** Analysts may contrive a weak counter-analogy just to satisfy Step 4. *Mitigation:* The counter-analogy must be one that a credible opponent would actually use.
  *   **Status Quo Bias:** The procedure favors "Reframing" over "Earns Weight." In a crisis requiring speed, this may look like paralysis.

  **3. Judgment Calls Dressed as Method**
  *   **Step 3 (Condition Matching):** Deciding whether a condition "matches" is subjective. (e.g., Is today's economic interdependence "like" 1914 or "like" 1938?). This is where analyst bias enters.
  *   **Step 5 (Irreversibility):** Judging what is "irreversible" is political, not analytical.
  *   **Step 4 (Counter-Analogy Selection):** Choosing *which* counter-analogy to test determines the outcome.

  **4. Final Warning**
  This procedure is designed to prevent *bad* analogies from driving policy, not to guarantee *good* policy. It protects against the "Loudest Analogy Wins" pathology by forcing the quiet, structural weaknesses into the light. If the output is consistently "Reframing Device," that is a feature, not a bug: it means history is offering warnings, not instructions.
