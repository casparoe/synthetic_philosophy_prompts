answer: |-
  ### 1. The tree

  Start here: You have exactly one individual and someone is demanding one probability.

  **Node 1:** Is the group you want to use defined by whether the event happens? (Non-negotiable)
  Check the case file. If you are defining the reference class as "people who will die soon" to predict death, you are circular. This often appears in disability claims where the class is "people who never return to work." If **Yes**, stop. You land on **Leaf 1**. There is no single-case probability here, only rates in classes. If **No**, proceed to Node 2.

  **Node 2:** Do two valid classes pass every test you have but disagree on the rate? (Non-negotiable)
  Look for conflicting statistics. For example, a claimant fits both "all surgeons" and "surgeons with back injuries," and the return-to-work rates differ wildly. If **No**, proceed to Node 5. If **Yes**, proceed to Node 3.

  **Node 3:** Can you quantify the cost of the two kinds of error?
  Check the decision context. Is there a clear penalty for false positives versus false negatives? If **Yes**, proceed to **Leaf 7**. There is no question-independent right class, so pick it by what the number is going to be used for and what the two kinds of error cost. If **No**, proceed to **Leaf 6**. Refuse one number, report the spread the admissible classes give you.

  **Node 4:** Can the individual change their class membership by choice?
  Check for agency. Consider the pilot: 52 years old, grounded after an arrhythmia, applying to fly again. He can comply with medication or retire, effectively picking his own risk class. If **Yes**, proceed to **Leaf 4**. Any class is fine as long as you're coherent about the choice mechanism. If **No**, proceed to Node 5.

  **Node 5:** Is the best statistical class legally off-limits?
  Check for protected variables. Suppose the class with by far the best statistics is one we're legally not allowed to sort people by (sex, ethnicity, postcode), with a proxy variable sitting right there. If **Yes**, proceed to **Leaf 2**. Take the narrowest class you still have reliable statistics for (within legal bounds). If **No**, proceed to Node 6.

  **Node 6:** Can you subdivide this class in a way that changes the rate?
  Check for homogeneity. If you can split the group and get a different probability, you aren't at the bottom yet. If **Yes**, go back and narrow the class (loop to Node 5 logic). If **No**, proceed to **Leaf 3**. Take the class that can't be subdivided in a way that changes the rate.

  **Node 7:** Is the event fundamentally unique?
  Check the event type. Consider a three-year-old startup's chance of surviving five years; there is no true peer group. If **Yes**, proceed to **Leaf 5**. There's a genuine single-case chance and the class is only evidence about it. If **No**, you should have been caught by Node 6; default to **Leaf 3**.

  ### 2. The leaves

  **Leaf 1: No single-case probability.**
  You report the frequency of the outcome within the defined group and refuse to map it to the individual. The awkward thing is that the client asked for a risk number for *this* person, and you have given them a statistic about *other* people.

  **Leaf 2: Narrowest legal class.**
  You select the most specific grouping that remains compliant with anti-discrimination laws, ignoring superior prohibited data. The awkward thing is that you knowingly produce a less accurate number because accuracy conflicts with equity regulations.

  **Leaf 3: Indivisible class.**
  You stop subdividing when further cuts yield no statistical difference, treating this homogeneity as the limit of knowledge. The awkward thing is that "no statistical difference" depends entirely on the sample size you happened to pull, not on reality.

  **Leaf 4: Coherence over correctness.**
  You model the individual's choices as part of the probability space, ensuring your numbers don't contradict their agency. The awkward thing is that you are modeling their decision process, which means your risk number changes if they lie to you about their intentions.

  **Leaf 5: Genuine single-case chance.**
  You treat the probability as a property of the specific situation, using classes only as analogies. The awkward thing is that you cannot verify this number even in principle, because this specific case never happens twice.

  **Leaf 6: Report the spread.**
  You present the range of probabilities generated by the conflicting admissible classes rather than picking one. The awkward thing is that the decision-maker will inevitably pick the number in that spread that best suits their pre-existing bias.

  **Leaf 7: Pick by use.**
  You select the reference class that minimizes the cost of the error most dangerous to the specific decision context. The awkward thing is that two different departments using the same file will legitimately require two different probabilities for the same person.

  ### 3. Empty cells

  There are combinations of answers your nodes allow that nobody actually occupies. The most glaring is answering "No" to Node 7 (Unique Event) but also "No" to Node 6 (Subdivision). This implies a repeatable event type that is nonetheless statistically homogeneous at the highest level of granularity. In practice, analysts either find a subdivision (making Node 6 "Yes") or admit the uniqueness (making Node 7 "Yes"). Nobody sits in the middle claiming a event is both common and indivisible.

  Another empty cell is Node 3 "Yes" (Costs known) combined with Leaf 6 (Report Spread). If you can quantify error costs, the logic forces you to Leaf 7 (Pick by Use). Analysts sometimes claim they know the costs but still report a spread to avoid accountability, but logically this cell should be empty. It represents a refusal to use the information you claim to have.

  ### 4. Where it breaks

  The tree handles the "Protected Class" node badly. Node 5 assumes there is always a "narrowest legal class" available, but sometimes the proxy variables are so noisy that the resulting statistic is meaningless. The tree forces you to Leaf 2, but it doesn't offer a "Refuse to answer" option when the legal constraint destroys predictive validity entirely. You end up producing a number that is legally safe but analytically dishonest.

  Node 4 (Individual Choice) is also unstable. It assumes the individual's choice is independent of the risk number you produce, but in reality, telling a pilot his risk is high might cause him to retire, changing the class. The tree treats the choice as a static input, but it is dynamic feedback. This creates a loop the tree cannot resolve: your number changes the class, which changes the number.

  Finally, Node 1 (Outcome-defined) is too binary. Some classes are *partly* defined by the outcome without being fully circular, such as "people who survived the first year." The tree forces a hard stop, but analysts often navigate this by adjusting the time horizon. The node doesn't separate "circular" from "conditional," leading to false negatives where valid conditional probabilities are rejected as circular definitions.
