answer: |-
  Look, I get it. Mencius vs. Xunzi is the "To Be or Not To Be" of Chinese philosphy—everyone knows it, nobody wants to hear it again. You want the messy stuff where the text doesn't give you a clear answer. That's where the actual drama lives.

  So, for your scene, don't just draw a line between "good" and "bad." Draw a map of *why* the obligation exists. Here's the decision tree your protagonist would sketch on a napkin or a whiteboard. It starts with one question: **Where does the duty come from?**

  Here are the seven leaves (end-points) of the tree.

  **1. The Bio-Essentialist Dead End [EMPTY/INCOHERENT]**
  *   **The Claim:** Obligation requires shared blood. Adoption revelation instantly kills duty.
  *   **Verdict:** **Incoherent.** In classical Confucianism, ritual adoption (*li*) creates reality. Saying blood is the *only* thing basically breaks the system. It's more Mohist or modern legalistic than Confucian.
  *   **Outcome:** Son walks away. (But technically, he's left the tradition behind).

  **2. The Ritual Constitutor [Defender: Roger Ames]**
  *   **The Claim:** Roles aren't found, they're made. By performing the rituals of a son, he *became* a son. Biology is irrelevant metadata.
  *   **Outcome:** Donate. The ritual bond is thicker than blood.

  **3. The Affective Resonance [Defender: Mencius-adjacent]**
  *   **The Claim:** Duty follows feeling (*qing*). If the reveal destroys the emotional bond, the duty dissolves. If the love remains, the duty stays.
  *   **Outcome:** **Conditional.** Depends on whether he still *feels* like a son.

  **4. The Body as Inheritance [Defender: Classic *Xiao Jing*]**
  *   **The Claim:** Your body is a gift from your parents. Damaging it (surgery) is unfilial... unless saving them preserves the lineage.
  *   **Outcome:** **Paradox.** This leaf trembles. It could go either way, but traditionally leans toward **Don't Donate** (preserve the body given) unless the parent dies without heir.

  **5. The Role Hierarchy [Defender: Xunzi-ish]**
  *   **The Claim:** Social order trumps bodily autonomy. The role of "Father" commands the role of "Son." Period.
  *   **Outcome:** Donate. Autonomy is a selfish concept.

  **6. The Universal Humaneness [Defender: Tu Weiming]**
  *   **The Claim:** *Ren* (humaneness) is the root. If a specific role demand destroys the humanity of either party, the universal role trumps the specific one.
  *   **Outcome:** **Don't Donate** (if coerced) or **Donate** (if purely benevolent). Usually protects the self from being consumed by the role.

  **7. The Unnamed Martyr [Unnamed]**
  *   **The Claim:** The self is entirely disposable for the continuity of the social structure.
  *   **Weird Commitment:** He must donate even if the surgery has a 50% chance of killing him, because the *structure* of father-son must be preserved regardless of the individuals.
  *   **Outcome:** Donate at all costs.

  ***

  **Notes for your scene:**

  *   **The Empty Spot:** Make sure she points at Leaf 1. That's the "gotcha." If a character argues that "no blood = no duty," she can call them out for not actually understanding Confucianism. It's an unexplored spot because the tradition assumes ritual *works*.
  *   **The Indistinguishable Leaves:** Flag **Leaf 2 (Ritual)** and **Leaf 5 (Hierarchy)** for me. Practically, the tree cant actually tell them apart. Both result in "Donate because Role," but one says the role is created by love/action (Ames) and the other says the role is a rigid command (Xunzi). In a crisis, they look identical, which is frustrating for your protag.
  *   **Typo check:** I definitly left a couple in above. Keep them. Makes it feel like she was typing fast.

  This way, your protagonist isn't just reciting history; she's showing how the ethics break under pressure. Hope this helps the draft.
