answer: |-
  1. There is no single established name for this specific institutional pattern, though it shares features with open texture in philosophy and concept creep in psychology. Both notions describe semantic expansion, but neither accounts for the bureaucratic mechanism where past decisions bind future definitions without explicit rule changes.
  2. Open texture is the nearest philosophical fit, positing that empirical concepts must remain flexible to accommodate unforeseen cases without rigid definitions. It fails here because open texture assumes the core meaning persists through expansion, whereas your committee allows the original definition to be silently replaced by new criteria.
  3. Path dependence from economics and political science accurately models your observation that the order of decisions dictates the final content of the list. It falls short because it explains structural inertia rather than the semantic slippage where a plant admitted for utility is later defended as heritage.
  4. I would name this justificatory accretion, defined as the process where a category expands through unanimous precedent until the original criteria are obscured by layered rationalizations. You could apply this to a new plant by asking whether its inclusion relies on a chain of prior exceptions rather than the core definition itself.
  5. These are two symptoms of a single phenomenon where category membership becomes decoupled from original criteria through institutional memory loss. To settle this, imagine a committee that records specific reasons for each entry and forbids citing them for other purposes; if the order still changes the outcome, they are separate, but if the list stabilizes, they are one.
