          *   *Example:* The "Reluctant Addict" vs. The "Wanton Addict." Both might have deep plasticity in some areas, but one has a conflict of levels.
          *   *Better:* The "Architect vs. The Bricklayer." The bricklayer is flexible in laying bricks (compensating for uneven mortar) but rigid in the wall design. The architect is rigid in the laws of physics but flexible in the design. Freedom is the ability to move between these roles.

