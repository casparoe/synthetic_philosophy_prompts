answer: |-
  Prices are not data points to be collected, but signals generated by action that cannot be simulated without destroying the thing being measured.

  **Sequence and the PriceBot Stipulation**
  Begin with the case study (10 mins), then Mises (10 mins), then introduce the PriceBot stipulation (5 mins), then Hayek (20 mins), then close (5 mins). You must introduce the PriceBot *after* establishing Mises's claim that calculation requires a common denominator (prices), but *before* Hayek's claim that the knowledge required to set those prices is dispersed. If introduced earlier, it validates the engineers' view that calculation is merely a computational optimization problem. Placed here, it concedes the compute battle to win the epistemic war: even with infinite FLOPs and perfect telemetry, the planner lacks the *valuations* that only exist in the act of choosing.

  **The Concrete Case**
  Use **allocating scarce compute cycles across competing inference jobs**.
  *   **Required Properties:** The good is intermediate (cycles); its worth is not readable off physical inputs (a cycle's value depends on the user's subjective urgency); "just simulate it" fails because demand is counterfactual (users change behavior based on availability/price).
  *   **Useless Properties:** Do not use final consumer goods (obscures opportunity cost) or goods with fixed physical utility (makes value look objective).

  **Misconceptions and Interventions**
  1.  **"Planning is just inefficient."** Head this off during **Mises**. Clarify that without prices, there is no metric for efficiency; it is not driving slowly, it is driving blind.
  2.  **"Compute power is the bottleneck."** Head this off at the **PriceBot** moment. Explicitly grant unbounded compute and perfect telemetry. If they still see a problem, it isn't computational.
  3.  **"Lange answered this."** Head this off during **Hayek**. Explain that Lange's trial-and-error assumes the planner knows *when* to adjust prices. Hayek argues the knowledge of *whether* an adjustment is needed is local and tacit.
  4.  **"This is about incentives."** Head this off by **explicitly declining it** (see below). Do not let the discussion slide into corruption or laziness; keep it on information and calculation.

  **Final Question**
  Ask: "If your model predicts demand perfectly, what economic function has it rendered obsolete: the entrepreneur who discovers the demand, or the price that communicates it?" This forces them to distinguish between predicting static data and facilitating dynamic discovery.

  **What to Decline**
  Openly decline to discuss **incentives, politics, or human corruption**. State clearly: "We are assuming a benevolent, omniscient planner. Even if the planner is an angel with a supercomputer, the calculation problem remains." This isolates the epistemic argument from the public-choice argument, preventing the engineers from dismissing the philosophical problem as merely a "political implementation detail."
