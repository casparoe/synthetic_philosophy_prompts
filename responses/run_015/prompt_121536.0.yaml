answer: |-
  Aristotle argues that applying the principle of bivalence to future contingent statements entails fatalism because if a prediction is already determinately true, the corresponding event is fixed by necessity, so he rejects bivalence for such cases to preserve genuine possibility. The bridge between truth and necessity rests on the assumption that truth corresponds to reality, meaning if a proposition is true now, the state of affairs it describes is already settled in the fabric of existence. Consequently, if it is true today that a sea battle will occur tomorrow, the occurrence of the battle is as fixed and unalterable as any past event, making it impossible for the battle not to happen. This creates the conflict regarding possibility: if every true statement about the future is necessarily true, then nothing is contingent, and the definition of "possible" as "that which can be otherwise" is rendered void. Aristotle resolves this by distinguishing the Law of Excluded Middle from the Principle of Bivalence, asserting that while it is necessary that either a battle will occur or it will not, it is not necessary that any specific one of these is already true. By claiming future contingent statements are neither true nor false until the event occurs, he prevents the truth-value from locking the future into necessity. This move preserves the openness of the future, ensuring that human deliberation and chance remain effective causes rather than illusions.
