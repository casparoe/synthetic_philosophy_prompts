  I am trying to work through a passage I found in Aristotle's De Interpretatione, chapter 9, about what people call the sea battle problem. The text considers whether a statement predicting that there will be a sea battle tomorrow is already true or false today. Aristotle seems to worry that if such a statement is true now, then tomorrow's battle is unavoidable, and if it is false now, then it is unavoidable that there will be no battle. I do not understand the exact bridge between a statement having a truth-value and the corresponding event being necessary. Is he assuming that whatever is truly said about the future is thereby fixed, or is the problem somewhere in the logic of negation and contradiction? Someone I spoke with suggested that the real issue involves whether possible is defined as not necessary and not impossible, but I cannot see how that definition interacts with the argument about the battle. Can you help me understand the specific step where truth is meant to entail necessity, and whether giving up on true-or-false for future events actually resolves the worry? Lead with your bottom line in the first sentence, then give your reasoning, with no preamble and no restating of the question.
