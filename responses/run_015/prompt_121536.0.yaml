      *   *The Logical Step:* The bridge isn't just "true = fixed." It's about the correspondence between language and reality over time. If "There will be a sea battle" is true *now*, then the state of affairs it corresponds to *must* obtain *later*. If it *must* obtain, it cannot fail to obtain. If it cannot fail to obtain, it is necessary.
      *   *The Role of Contradiction:* Aristotle accepts the Law of Excluded Middle (either P or not-P is true) but challenges the Law of Bivalence (P is true OR P is false) for future contingents. He wants to say "Either there will be a battle or there won't" is true, but neither "There will be" nor "There won't" is individually true *yet*.
