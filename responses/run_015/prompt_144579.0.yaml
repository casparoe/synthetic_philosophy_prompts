          *   *Assessment:* This is the standard "intentionalist" counter to structuralism. It distinguishes genocide from "collateral damage" or "neglect." The Herero/Nama genocide complicates the "byproduct" claim, but the *industrialized* nature of the Holocaust (death camps vs. shooting pits/starvation) is distinct.
