prompt: |-
  you're a political theorist who also works on philosophy of action — like someone who has read both Elster and Bratman and has actual opinions about them. take your time with this, brainstorm your way in rather than dumping the first five things that occur to you, and flag where you're guessing.

  I'm working on a paper about Ulysses contracts — the individual kind (Ulysses and the sirens, the guy who hands his car keys to a friend before the party, advance directives in mental health law, the app that locks the fridge at 10pm) and the collective kind (constitutional entrenchment, supermajority requirements, one parliament trying to bind the next one, clauses that constitution drafters declare unamendable, sunset clauses as the compromise version). Before I write another page of it I want the spec, not the survey. What would a theory of precommitment actually have to get right to count as adequate — as adequate, specifically, for deciding when an earlier decision should be allowed to bind a later agent, and how rigid the binding mechanism should be? Give me the requirements with the case or consideration behind each one. I care far more about you getting the criteria right than about scoring views, so keep the scorecard to a few lines at the end.

  What I want in it:

  - The cases it has to handle, especially the ones people skip. The begging Ulysses: he's tied, the song is playing, he screams to be let go — and suppose that by then he's genuinely reconsidered and means it. The crew's problem, which I think is the crux: from outside, how do they tell "the music has deranged him" from "he has thought about it and changed his mind"? The ship-burner: Ulysses ties himself, Cortés (or whoever) burns the boats — is removing an option the same move as just making it expensive, or a different one with different justification? The enforcer problem: nearly every real precommitment needs someone else to hold the rope, and that someone has interests of their own (the crew can be bribed, the court can be packed, the fridge app can sell your data). The second-order case: Ulysses has to bind the crew not to untie him — so who ties the crew? Does that regress stop anywhere, or doesnt it, and if it doesn't is that a reductio or just the normal shape of any enforcement story? The ratchet: a chain of precommitments where each self binds the next, every step is locally justified, and the chain as a whole walkes somewhere that no self in it would have chosen. Asymmetric friction: rules that make one direction cheap and the other costly — degenerate version of precommitment, or the ordinary case?
  - The distinctions it can't collapse. Binding versus merely influencing. Changing your mind versus finding something out. Weakness of will versus a revised view about what's worth wanting. The past self's authority versus the past self's better information. Binding yourself versus binding other people who happen to be your future. Precommitting to an outcome versus to a procedure for deciding. Revocable versus unamendable. And the one I suspect is doing the most damage: precommitment where the binder and the bound are numerically different agents. The "dead hand" worry only really bites in that case, so a theory that explains individual Ulysses contracts by appeal to personal identity over time has nothing to say about constitutions, and a theory built for constitutions may have nothing to say about why it's fine to tie yourself to the mast.
  - What it can't contradict: people systematically discount the future and mispredict their own later tastes, and that fact is most of the reason precommitment is ever rational; and the dull empirical point that very rigid entrenchment does sometimes lock in a mistake for decades.

  Then the part I most want: which requirements are genuine adequacy conditions and which are just one camp's prejudices wearing a desideratum's clothing. My suspicion is that "the reflective later self's judgment should win" is an autonomy-camp prejudice, not a requirement — argue me out of it or confirm it. And tell me whether some subset of the list is jointly unsatisfiable. My guess is that "precommitment has to be able to actually work, meaning it has to be able to override even a calm, informed, reflectively endorsed change of mind" and "the later self's considered judgment is the authority on what to do" cannot both be on the list, and that the crew's inability to distinguish derangement from reconsideration is what makes that a real conflict instead of a verbal one. If the list turns out to be internally inconsistent, say so plainly and say which requirement you'd drop. Also: which single requirement excludes the most candidate theories?

  Finish with a short scorecard, prose, no table, on how the obvious contenders do: the plain sovereignty/autonomy view, the prudential expected-utility view, the multiple-selves / intrapersonal-bargaining picture, and straight dead-hand skepticism about binding successors. Just tell me which requirement each one dies on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Political theorist + philosophy of action specialist (familiar with Elster, Bratman, etc., but with independent opinions).
      *   **Task:** Define the *specification* (adequacy conditions) for a theory of precommitment (Ulysses contracts), covering both individual and collective cases.
      *   **Tone:** Brainstorming, thoughtful, flagging guesses, avoiding info-dumps, critical.
      *   **Key Content Requirements:**
          *   Handle specific hard cases (Begging Ulysses, Crew's Problem, Ship-Burner, Enforcer Problem, Second-Order/Regress, Ratchet, Asymmetric Friction).
          *   Maintain specific distinctions (Binding vs. Influencing, Mind Change vs. New Info, Weakness of Will vs. Revised Values, Binder vs. Bound Identity, Outcome vs. Procedure, Revocable vs. Unamendable).
          *   Respect empirical constraints (Hyperbolic discounting, rigid entrenchment locks in mistakes).
          *   **Crucial:** Distinguish genuine adequacy conditions from camp prejudices (specifically addressing "reflective later self's judgment should win").
          *   **Crucial:** Identify internal inconsistencies (specifically the conflict between effective precommitment and later self authority).
          *   **Crucial:** Identify the single most exclusionary requirement.
          *   **Ending:** Short prose scorecard on four specific views (Sovereignty/Autonomy, Prudential EU, Multiple-Selves, Dead-Hand Skepticism).

  2.  **Deconstruct the Core Tension:**
      *   The user identifies the central conflict: If precommitment *works*, it overrides the later self. If the later self is sovereign, precommitment *can't* work (normatively).
      *   Elster tries to solve this via "sovereignty of the past self" in specific contexts (constitutions) but worries about irrationality.
      *   Bratman solves this via planning theory (future-directed intentions have normative weight), but struggles with *radical* preference change.
      *   The "Begging Ulysses" case is the stress test. If Ulysses screams "Let me go" and means it (not just impulse, but reconsideration), does the rope hold?
      *   If yes: Why? (Past self authority? Protection from error?)
      *   If no: Was it really a precommitment or just a suggestion?

  3.  **Brainstorming Adequacy Conditions (The "Spec"):**
      *   *Condition 1: The Epistemic Asymmetry Condition.* The theory must explain *why* the past self knew better (or cared more) than the future self, without assuming the future self is always irrational. (Addresses: Discounting vs. New Info).
      *   *Condition 2: The Enforcement/Agency Condition.* Precommitment isn't magic; it requires mechanisms. The theory must account for the *enforcer's* incentives. (Addresses: Enforcer Problem).
      *   *Option Removal vs. Cost Increase.* Burning boats vs. paying a fine. The theory needs to distinguish these because the normative justification differs (freedom vs. price).
      *   *The Identity/Continuity Condition.* It must work for one person over time *and* distinct generations (constitutions). It can't rely solely on psychological continuity if it needs to cover constitutions.
      *   *The Reversibility Threshold.* When *can* the rope be cut? A theory needs a criterion for legitimate release.
      *   *The Ratchet/Accumulation Condition.* Must prevent a slide into tyranny via incremental binding.

  4.  **Addressing the "Prejudices vs. Requirements" Prompt:**
      *   User suspects "Reflective Later Self Wins" is a prejudice.
      *   *Analysis:* If the later self always wins, precommitment is impossible. It's conceptually incoherent to say "I bind you" and "You can unbind yourself whenever you want." So, "Later Self Wins" *cannot* be an adequacy condition for a theory of *binding* precommitment. It is an autonomy prejudice.
      *   *Counter-prejudice:* "Past Self Wins" is also a prejudice (Dead Hand).
      *   *Real Requirement:* The theory must specify the *conditions of legitimacy* for the binding, not just declare a winner.

  5.  **Addressing the Inconsistency:**
      *   User guesses: "Precommitment must override calm later self" AND "Later self's considered judgment is authority" are incompatible.
      *   *Verdict:* They are logically incompatible *unless* you introduce a third standard (e.g., Objective Good, or Procedural Fairness). If the standard is purely *agency-based*, you have to pick a time-slice.
      *   *Decision:* I need to confirm this inconsistency. The "Crew's Problem" (Epistemic Access) is what makes it practically unsolvable, not just theoretically.

  6.  **Drafting the Content - Section by Section:**

      *   **Intro:** Set the stage. Acknowledge the Elster/Bratman lineage but signal independence.
      *   **The Hard Cases (The Stress Test):** Go through the user's list (Begging Ulysses, Crew, Ship-Burner, Enforcer, Regress, Ratchet). Formulate requirements based on these.
      *   **The Distinctions:** Ensure the theory doesn't blur these.
      *   **The Empirical Constraints:** Acknowledge hyperbolic discounting and lock-in.
      *   **The Meta-Evaluation (Prejudices vs. Conditions):** This is the core philosophical heavy lifting. Tackle the "Later Self Sovereignty" issue.
      *   **The Inconsistency:** Confirm the user's suspicion about the conflict between effective binding and later authority.
      *   **The Exclusionary Requirement:** Which one kills the most theories? Likely the "Enforcer Problem" or the "Identity Continuity" (Individual vs. Collective).
      *   **Scorecard:** Briefly assess the four views.

  7.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just list the cases but derive *requirements* from them.
      *   *Example:* The "Enforcer Problem" isn't just a case; it implies a requirement: *The theory must account for the incentive compatibility of the third-party enforcer.*
      *   *Correction on Identity:* The user notes individual vs. collective. A theory based on "psychological continuity" fails constitutions. A theory based on "legal sovereignty" fails individual addiction. The requirement must be *neutral* regarding the metaphysics of identity, focusing instead on *authority transfer*.
      *   *The "Begging Ulysses":* This is the crux. If he screams and means it, is he competent? If the theory says "Yes, let him go," precommitment fails. If "No, hold him," it looks paternalistic. The requirement is: *The theory must specify a competence threshold for the later self that distinguishes preference reversal from competence failure.*

  8.  **Finalizing the "Prejudice" Argument:**
      *   Is "Later Self Wins" a prejudice? Yes. It assumes sovereignty is located in the *now*. But precommitment argues sovereignty is located in the *plan*.
      *   However, the *stronger* requirement is: *The theory must explain why the past self had the standing to bind.*
      *   The inconsistency: You cannot have *absolute* binding and *absolute* later sovereignty. One must yield. Most theories fudge this. I should call that out.

  9.  **Structuring the Response:**
      *   **Opening:** Acknowledge the depth of the prompt. Set the persona (theorist who has wrestled with this).
      *   **Part 1: The Adequacy Spec (Requirements derived from cases).**
      *   **Part 2: The Distinctions (What must remain separate).**
      *   **Part 3: The Meta-Analysis (Prejudices, Inconsistencies, Exclusionary Conditions).**
      *   **Part 4: The Scorecard.**

  10. **Tone Check:**
      *   Avoid academic jargon where possible, but use precise terms (diachronic, sovereignty, incentive compatibility).
      *   Be opinionated but rigorous.
      *   Flag guesses as requested.

  11. **Final Polish:** Check against the "Begging Ulysses" and "Crew's Problem" specifics. Ensure the "Enforcer" issue gets weight (it's often ignored in philosophy of action). Ensure the distinction between individual and collective is maintained (the "Dead Hand" issue).

  *(Self-Correction during final review)*: Wait, the user asked for "The cases it has to handle... Give me the requirements with the case or consideration behind each one." I should structure the first section explicitly as Requirement + Case.
  Also, make sure to explicitly answer: "Which single requirement excludes the most candidate theories?"
  And: "Argue me out of [Later Self Wins] or confirm it." (I will confirm it).

  Let's write.
answer: |-
  This is a sharp brief. You've identified the exact fracture lines where most theories of precommitment glue over the cracks with terminology rather than argument. I've spent a lot of time in the Elster/Bratman weeds, and my sense is that Elster gets the political stakes right but lacks a moral psychology to ground them, while Bratman gets the psychology right but struggles to scale it to the constitutional level without smuggling in normative assumptions.

  Here is the spec. I'm deriving these requirements directly from the failure modes you listed, rather than from first principles, because as you note, the first principles (Autonomy vs. Welfare) are usually where the bias enters.

  ### Part I: The Adequacy Spec (Requirements & The Cases Behind Them)

  **1. The Epistemic Access Requirement**
  *   **The Case:** *The Begging Ulysses.* Ulysses screams to be released. Is he expressing a new preference or a temporary pathology?
  *   **The Requirement:** A theory must specify an epistemic criterion for distinguishing *preference reversal* (which might invalidate the contract) from *competence failure* (which validates the enforcement). It cannot simply assume the later self is irrational, nor can it assume the later self is sovereign.
  *   **Why:** If the theory treats all later-self objections as "weakness of will," it is tyrannical. If it treats all objections as "revised judgment," precommitment is impossible. It needs a test for *when* the scream counts as data versus noise.

  **2. The Incentive-Compatibility of Enforcement Requirement**
  *   **The Case:** *The Enforcer Problem.* The crew, the court, the app developer. They have their own utility functions.
  *   **The Requirement:** The theory must account for the *third party's* incentives to enforce. A precommitment mechanism is not adequate if it assumes a benevolent, cost-less enforcer. It must explain why the enforcer is bound to the *principal's* original instruction rather than their own current interest or the *agent's* current plea.
  *   **Why:** Most philosophical accounts treat the rope as a law of nature. In reality, the rope is held by a person. If the crew can be bribed by the Sirens (or by Ulysses's later self), the contract fails. A theory that ignores the enforcement layer is describing a wish, not a mechanism.

  **3. The Identity-Neutrality Requirement**
  *   **The Case:** *Individual vs. Collective.* Tying yourself to the mast vs. a constitution binding a future parliament.
  *   **The Requirement:** The theory must function without relying on a specific metaphysics of personal identity. It cannot solve the individual case via "psychological continuity" and the collective case via "legal sovereignty" if it claims to be a unified theory of precommitment.
  *   **Why:** As you noted, the "Dead Hand" worry only bites when the binder and bound are effectively different agents. If a theory relies on "it's all the same person," it dissolves the political problem. If it relies on "it's different sovereigns," it makes individual addiction treatment incoherent. The mechanism of binding must be analogous across both.

  **4. The Option-Removal Distinction Requirement**
  *   **The Case:** *The Ship-Burner.* Cortés burning ships vs. a high tax on leaving.
  *   **The Requirement:** The theory must distinguish between *removing an option* and *changing the price of an option*. It must justify why the former is sometimes permissible when the latter would be insufficient (or vice versa).
  *   **Why:** Burning the ships creates a state of necessity; taxing the exit preserves choice but alters incentives. These have different normative profiles. A theory that treats them as functionally identical (just "raising costs") misses the qualitative shift in agency involved in making an action *impossible*.

  **5. The Anti-Ratchet Requirement**
  *   **The Case:** *The Ratchet.* A chain of local bindings that leads to a global outcome no self would endorse.
  *   **The Requirement:** The theory must provide a stopping rule. It must explain why a sequence of rational precommitments doesn't license a trajectory that violates the agent's (or polity's) overarching integrity.
  *   **Why:** Without this, precommitment becomes a tool for slow-motion suicide or authoritarian creep. Each step is locally rational (bind the next self to protect the goal), but the sum is destructive.

  **6. The Asymmetric Friction Justification**
  *   **The Case:** *Sunset Clauses vs. Entrenchment.* Making reversal costly but not impossible.
  *   **The Requirement:** The theory must justify *directionality*. Why is it okay to make reversing a decision harder than maintaining it?
  *   **Why:** Default rules matter. If the theory cannot explain why the status quo gets a boost (friction) without calling it a veto, it fails to capture the actual design of most Ulysses contracts (which are rarely absolute).

  ---

  ### Part II: The Distinctions That Must Hold

  You listed several. I want to highlight the one that usually collapses first: **Binding Yourself vs. Binding Other People Who Happen To Be Your Future.**

  *   **The Risk:** Theories of personal identity (Locke, Parfit) often try to solve precommitment by arguing the future self *is* the past self.
  *   **The Requirement:** The theory must treat the future self as a distinct *locus of agency* even if they are the same *ontological entity*.
  *   **Why:** Because the future self has *new information* and *new incentives*. Treating them as numerically identical for the purpose of authority ignores the temporal gap where the conflict arises. The "Dead Hand" problem exists even within a single life if the time gap is long enough (e.g., an advance directive from age 30 applied at age 80 with dementia).

  Also, **Binding vs. Influencing.**
  *   **The Risk:** Bratman's planning theory leans heavily here. Plans guide, but do they *bind*?
  *   **The Requirement:** The theory must specify the cost of violation. If I can break the precommitment with no penalty other than "I broke my plan," it's influence. If there is an external or internalized penalty that operates *against* my current desire, it's binding.
  *   **Why:** Without this, "precommitment" just becomes "having a strong preference."

  ---

  ### Part III: Prejudices, Inconsistencies, and The Kill Switch

  **Is "The Reflective Later Self's Judgment Should Win" a Prejudice?**
  **Confirm.** It is an autonomy-camp prejudice.
  *   **Argument:** If the later self's reflective judgment *always* wins, then precommitment is normatively impossible. It reduces the earlier contract to a mere suggestion. You cannot define a *binding* contract where one party has the unilateral right to void it at will based on their current state of mind.
  *   **Nuance:** The later self's judgment should win *unless* the conditions for the precommitment's validity are met. But "Later Self Sovereignty" cannot be the *default* adequacy condition for a theory of *binding*. It is the *problem* the theory is trying to solve, not the solution.

  **The Internal Inconsistency**
  You guessed that *"Precommitment has to be able to actually work (override calm later self)"* and *"The later self's considered judgment is the authority"* are incompatible.
  *   **Verdict:** **They are jointly unsatisfiable.**
  *   **Reasoning:** This is the hard truth most theorists dodge. If the later self is calm, informed, and reflectively endorses untying the rope, and the rope *still holds*, then the later self is *not* the authority. If the later self *is* the authority, the rope *must fall*.
  *   **The Crew's Problem as the Wedge:** You identified this perfectly. The only way to resolve this without contradiction is to introduce a **third standard** (e.g., Objective Welfare, or Procedural Legitimacy established at T1).
      *   If you say "The rope holds because T1 Self knew better," you abandon Later Self Authority.
      *   If you say "The rope falls because T2 Self knows best," you abandon Effective Precommitment.
      *   **My Recommendation:** Drop "Later Self's Considered Judgment is the Authority." Replace it with: *"The later self's judgment is authoritative regarding facts and values, BUT the past self retains authority over the procedural constraints agreed upon, provided the past self's decision was competent and the enforcement mechanism is legitimate."*
      *   **Why drop it?** Because "Later Self Authority" is the definition of *no* precommitment. You can't have a theory of locks if the person inside can always open them.

  **The Single Most Exclusionary Requirement**
  **The Incentive-Compatibility of Enforcement Requirement.**
  *   **Why:** 90% of the literature (Elster included, mostly) treats the enforcement mechanism as exogenous or benevolent. They assume the Constitution enforces itself or the friend holds the keys loyally.
  *   **Impact:** Once you demand the theory explain *why the enforcer enforces* (especially when the enforcer benefits from non-enforcement), you eliminate almost all purely normative accounts. You are forced into game theory, institutional design, or credible threat analysis. It kills the "moral binding" theories dead.

  ---

  ### Part IV: Scorecard

  Here is how the obvious contenders die on these requirements.

  **1. The Plain Sovereignty/Autonomy View**
  *   **Core:** I am sovereign now; I cannot bind my future self because that future self is also sovereign.
  *   **Where it dies:** **The Option-Removal Distinction.** It cannot explain why burning the ships is rational. If I am sovereign, I can just swim. If I can't swim because I burned the ship, my sovereignty was an illusion. It also fails the **Identity-Neutrality Requirement** because it treats the individual as indivisible but struggles to explain why a Parliament can bind a future Parliament without a "Dead Hand" violation. It collapses precommitment into mere prediction.

  **2. The Prudential Expected-Utility View**
  *   **Core:** Precommitment is rational if it maximizes expected utility across time-slices (overcoming hyperbolic discounting).
  *   **Where it dies:** **The Begging Ulysses (Epistemic Access).** It assumes the T1 calculation is always superior because it's "cool." It cannot handle the case where T2 has *new information* or a *legitimate value shift*. It treats all preference changes as errors. It also fails the **Enforcer Requirement** because it assumes the enforcer acts to maximize the principal's utility, ignoring the enforcer's own utility function.

  **3. The Multiple-Selves / Intrapersonal-Bargaining Picture**
  *   **Core:** I am a sequence of selves; precommitment is a contract between them.
  *   **Where it dies:** **The Identity-Neutrality Requirement.** It works great for addiction (individual), but it makes the constitutional case weird. Are generations "selves"? If so, do we owe them the same psychological continuity? It also struggles with **The Ratchet**. If selves bargain, what stops a coalition of past selves from ganging up on a future self? It lacks a normative stop-loss.

  **4. Straight Dead-Hand Skepticism**
  *   **Core:** Binding successors is illegitimate (Jefferson's "earth belongs to the living").
  *   **Where it dies:** **The Anti-Ratchet / Stability Requirement.** It cannot explain the value of stability or coordination. If no binding is allowed, cooperation over time collapses. It also fails the **Ship-Burner** case: If I burn my own boat, who are you to say I couldn't? It conflates *political* legitimacy with *individual* agency, failing to distinguish between binding others and binding oneself.

  **Summary:** The Prudential view ignores the Enforcer. The Sovereignty view denies the possibility of the Lock. The Multiple-Selves view gets the psychology but loses the Politics. The Skeptic saves the Future Self but destroys the Project. You need a hybrid that accepts the **Inconsistency** I flagged: you must grant the Past Self *procedural* authority to limit the Future Self's *substantive* choices, but only if the Enforcement is credible and the Epistemic conditions at T1 were superior regarding the specific risk.
