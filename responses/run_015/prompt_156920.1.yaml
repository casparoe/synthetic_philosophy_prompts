answer: |-
  The phenomenon you are describing is a failure of the *interpretive landscape* rather than the mechanical landscape of choice. You are correct to reject "coercion," "deception," and "competence." Coercion works by altering consequences (if you say no, X bad thing happens). Deception works by altering facts (you think X is true, but it is false). Competence works by altering capacity (you cannot understand X).

  Your cases are different. The consequences are unchanged. The facts are known. The capacity is intact. What is altered is the *meaning* of the act itself. In both scenes, the characters are not choosing between "Option A" and "Option B" in a vacuum; they are choosing between "Being a Person Who Fits the World" and "Being a Person Who Breaks the World." The social narrative has monopolized the interpretation of the refusal. To say "no" is not to select an alternative option; it is to step outside the language game of the community. It is to become unintelligible.

  The philosopher you heard was likely referring to a concept known in ethics as **hermeneutical injustice**, though your application is slightly distinct. Traditionally, that term describes a gap in collective understanding that prevents someone from making sense of their own experience (e.g., a woman feeling harmed but lacking the concept of "sexual harassment" to name it). Your cases are not about understanding harm, but about the *possibility of agency*. The collective understanding is so saturated with one narrative ("women yield to charming men," "men sacrifice for family") that the alternative narrative does not exist to be chosen. The option space is physically open but hermeneutically closed.

  I propose calling this **Hermeneutical Constraint**. It is not coercion because no threat is issued; the threat is ontological, not practical. It is not deception because the facts are clear; the *significance* is rigged. It differs from simple social pressure (like peer pressure at a party) because the stakes are constitutive of the agent's identity within that society. Refusing the operation isn't just unpopular; it renders the man a "monster" in his own eyes. Refusing the suitor isn't just risky; it renders the woman a "fiction" in her town's eyes.

  Does this invalidate consent? Legally and procedurally, no. The signature is valid; the consent form is signed. The agents spoke the words. However, morally, it renders the consent *hollow*. It grounds a complaint not about the transaction itself, but about the *conditions of agency* under which the transaction occurred. The complaint is that the world was too small for them to be free.

  **Edges and Boundaries:**
  To ensure your narrator names this correctly, you must distinguish it from nearby cases.
  1.  **Strong Social Ostracism:** If refusing the suitor meant the town would burn her workshop, that is coercion (threat of worsened alternative). Your case is weaker: nothing happens, but she becomes a ghost.
  2.  **Internal Compulsion:** If the man refused the operation because of a pathological fear of hospitals, that is internal, not social. Your case is external: the meaning is fixed by the *town*, the *family*, the *year*.
  3.  **Ignorance:** If she didn't know she could refuse, that is deception or ignorance. Your characters know they can refuse; they just cannot *be* the refusers.

  **The Dialogue:**
  Your narrator needs to capture that the choice existed physically but not meaningfully. "Hermeneutical" is too academic for most dialogue, even in a modern frame. You need a phrase that captures the *fixed meaning*.

