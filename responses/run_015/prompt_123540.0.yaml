  **TO:** Trust Board, Merrivale Fertility Service
  **FROM:** Lay Member, Emerging Genetics Policy Group
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Polygenic Risk Scoring Policy and Interim Determination

  **Executive Summary**

  This memo resolves the deadlock within the Emerging Genetics Policy Group regarding the use of polygenic risk scores (PRS) in embryo selection. We face two competing frameworks: the "Treatment Test," which permits selection only to avoid conditions the Service would treat or prevent; and the "No-Maximising Rule," which permits only aggregate health risk reduction without trait maximisation or data disclosure. Given our mandate as a publicly funded trust, I recommend adopting the **Treatment Test** as our governing policy, subject to an immediate moratorium on PRS usage for embryos of non-European ancestry due to clinical validity concerns. This memo outlines the policy conditions, the interim determination for patients Rachel Okonjo and Daniel Ferris, and the ethical rationale for this decision.

  **Policy Recommendation: The Treatment Test with Validity Constraints**

  The Service should adopt the Treatment Test. This aligns embryo selection with the core medical mission of the NHS: to prevent suffering and treat illness. It draws a defensible line between health and enhancement. Selecting against a severe psychiatric condition like bipolar disorder falls within the scope of preventing future suffering, whereas selecting for educational attainment constitutes enhancement, which is inappropriate for public funding.

  However, this permission is conditional on clinical validity. The Lab Director has confirmed that current PRS panels are trained predominantly on European-ancestry data. For embryos of mixed Nigerian and European ancestry, the predictive power is significantly degraded, and the risk of erroneous ranking is high. Therefore, the policy must include a stipulation that PRS cannot be offered where ancestry-specific validation is absent. To offer otherwise would be clinically negligent.

  Furthermore, I reject the secrecy clause of the No-Maximising Rule. Withholding scores from patients undermines informed consent. If we offer a test, patients must see the results, accompanied by mandatory counselling on the statistical limitations.

  **Interim Determination: The Case of Okonjo and Ferris**

  Regarding the immediate request from Rachel Okonjo and Daniel Ferris: **The Service cannot fulfil either request at this time.**

  This decision is not a moral judgment on their desire to avoid bipolar disorder or their aspiration for their child's education. It is a clinical safety determination. Because their embryos carry partial Nigerian ancestry, the polygenic scores available to us lack the necessary predictive accuracy. The difference in risk between their five embryos is statistically negligible compared to the margin of error in the test itself. Selecting an embryo based on these scores would be no more effective than random chance, yet it would impose a false certainty on the parents.

  You should be told plainly: We are not refusing because your goals are wrong. We are refusing because the tool you are asking us to use is broken for embryos like yours. Using it would risk transferring an embryo with higher risk based on faulty data. We will transfer the highest-quality embryo based on standard morphological assessment, without polygenic ranking.

  **Disclosure and Ancestry**

  Moving forward, if PRS is offered under the Treatment Test, the lab must disclose three specific limitations to all patients: the ancestry bias of the training data, the small absolute risk difference between siblings, and the overlapping confidence intervals. We should not offer polygenic scoring for mixed-ancestry embryos until validated panels are available. To do so would violate our duty of care.

  **The Non-Identity Problem**

  Rachel Okonjo raised a philosophical objection: whichever embryo is chosen, the resulting child would not otherwise have existed, so no one is made worse off by the selection. This is logically correct regarding harm to the child. However, it does not neutralise the ethical objections, nor does it remove the point of the exercise.

  Our policy is not solely about preventing harm to a specific future child; it is about the moral character of the Service and the stewardship of public resources. Even if the child is not harmed, the Service might be compromised by endorsing a view that some lives are inherently less worth living than others, or by facilitating social stratification through genetic enhancement. The non-identity argument proves we are not harming a patient, but it does not prove that the practice is medically indicated or socially equitable. We are not merely facilitating private choices; we are setting public norms.

  **The Rejected Proposal: The Case for No-Maximising**

  I recommend rejecting the No-Maximising Rule, but its proponents offer a powerful argument that must be acknowledged. Their position is that the Treatment Test relies on an unstable distinction between "medical" and "social" traits. Bipolar disorder and educational attainment are both polygenic, both influenced by environment, and both impact life quality. By permitting selection against one but not the other, we implicitly endorse an official judgment that a life with bipolar disorder is worse than a life with lower educational prospects, which risks stigmatising existing patients.

  Furthermore, the scientists argue that any specific selection implies a false precision. The No-Maximising Rule, by focusing on aggregate health risk and withholding specific numbers, acknowledges that these scores are probabilistic clouds, not deterministic verdicts. It prevents parents from fixating on a single number and protects the child from being designed for a specific niche. This approach treats embryo selection as a medical safety net, not a design process, preserving the idea that children are gifts to be accepted rather than products to be optimised. This concern for the expressive meaning of our choices is profound and should guide our counselling, even if we adopt the clearer boundaries of the Treatment Test.

  **Equity and Enforcement**

  Finally, we must acknowledge the Legal Officer's warning: restrictive policies may export this practice to private clinics abroad, where patients receive less counselling and fewer safeguards. While this risk is real, it does not justify lowering our clinical standards. Our duty is to the patients who come to us, not to regulate what happens elsewhere. We cannot compromise clinical safety or ethical coherence simply because others might act less responsibly.

  **Review Timeframe**

  This policy should be reviewed in **12 months**. This allows time for potential advancements in ancestry-diverse genomic datasets and provides a period to monitor the clinical outcomes of any PRS-assisted transfers under the Treatment Test.

  **Conclusion**

  We must act decisively. I recommend the Board approve the Treatment Test with the ancestry moratorium described. This protects our patients from unreliable science, maintains the medical integrity of the Service, and provides a clear ethical framework for the future.

  **Recommendation:** Approve Treatment Test policy with immediate suspension of PRS for non-European ancestry embryos.
