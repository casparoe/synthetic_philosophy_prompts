  the part the committee keeps getting stuck on is a second thing tangled up in it. we have a test-anxiety accommodation where any student on the list gets 24 hours notice for every assessment, and four kids in that class are on it. so if Okafor honors the accommodation he has to tell four kids the date, and then it's obviously not a secret from anyone. one member proposed that teachers should just announce a window instead ("one quiz during the week of the 6th") and drop the surprise language entirely, since kids supposedly study the same either way. another member says that kills the point, kids just cram through the whole window and then crash.

  what i need is a short memo i can circulate: it should recommend an actual decision on Dev's appeal (uphold the quiz, void it, or something in between), plus a concrete rule for teachers going forward — what they're allowed to say when they announce a quiz, what would count as breaking the promise, and how the accommodation list fits in. take Dev's argument seriously instead of hand-waving it, and Okafor's "you only guessed" answer too, and be honest about the strongest point on whichever side loses. please actually commit to one option and defend it rather than handing me a menu — and if there's a version of the announcement that is coherent and still leaves the quiz genuinely surprising on some days, say which days and why. at the end add a short note on which part of your recommendation you're least confident about and what would make you flip. no citations or sources needed, obviously.
