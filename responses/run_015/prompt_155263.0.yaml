  **MEMORANDUM**

  **TO:** Academic Policy Committee
  **FROM:** Junior Class Rep
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Okafor Quiz Appeal & Assessment Announcement Policy

  **Decision on Dev's Appeal**
  I recommend the committee **deny Dev's appeal and uphold the quiz grade.**

  **Reasoning**
  Dev's argument relies on the "Unexpected Hanging Paradox," which asserts that a surprise event is logically impossible within a known finite timeframe. While valid in abstract logic, this reasoning fails in a classroom setting because it requires students to be *certain* that the teacher will keep the promise. Since students cannot possess perfect knowledge of the teacher's intent or capacity (e.g., the teacher might forget or change plans), the logical chain of elimination breaks. Dev was empirically surprised on Tuesday, which validates Mr. Okafor's defense that the pedagogical goal was met.

  However, we must take Dev's logic seriously: if we establish that "logical deducibility" voids an assessment, we invite future appeals based on philosophical technicalities rather than learning outcomes. Conversely, Mr. Okafor's strongest point is empirical reality (Dev was surprised), but his weakest point is ignoring the conflict with test-anxiety accommodations. A policy that prioritizes "surprise" over accommodation compliance is legally and ethically untenable.

  **Policy Recommendation**
  To resolve the tension between pedagogical intent, logical coherence, and accommodation rights, I propose the following concrete rule:

  1.  **Ban "Surprise" Language:** Teachers are prohibited from announcing "Surprise Quizzes." Instead, they must announce an **Assessment Window** (e.g., "One quiz between Wednesday and Friday").
  2.  **Announcement Constraints:** Teachers may state that the specific day is "unannounced within the window," but cannot claim it is "impossible to deduce."
  3.  **Accommodations:** Students requiring 24-hour notice must receive the specific date within the window. We must accept that this compromises the "surprise" for the whole class if information leaks. To mitigate cramming, quizzes within these windows should be low-stakes (e.g., completion grade or minimal weight).
  4.  **Breaking the Promise:** A promise is considered broken only if the assessment occurs outside the announced window or if accommodated students do not receive mandated notice.

  **Coherent Surprise Days**
  A surprise quiz is logically coherent on **Monday through Thursday.** The paradox only eliminates Friday *if* no quiz has occurred by Thursday night. Since the elimination process relies on time passing, Monday and Tuesday are logically safe days for a surprise. Friday is the only vulnerable day, as the "surprise" condition collapses on Thursday night if the quiz hasn't happened yet. Since Mr. Okafor administered the quiz on Tuesday, the logical conditions for surprise were met.

  **Uncertainty Note**
  I am least confident about the assumption that accommodated students will maintain confidentiality regarding the quiz date. If sharing the date becomes common practice, the "Assessment Window" policy fails to prevent cramming just as much as a surprise quiz. I would flip my recommendation on the "Window" policy if we find evidence that accommodated students are systematically sharing dates with peers to neutralize the assessment's intent; in that case, I would recommend eliminating unannounced assessments entirely in favor of fixed schedules.
