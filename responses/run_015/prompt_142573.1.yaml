answer: |-
  # A Dichotomous Key for Personal Identity Views
  ### (With Specific Reference to Buddhist *Anatta* Positions)

  **Instructions:** This key functions like a taxonomic guide. Start at Question 1. Choose the statement (a or b) that best matches your intuition about the *case* described. Follow the arrow to the next Question number or to a **Leaf** (a final position). Glossaries for technical terms are provided inline.

  ---

  ### The Key

  **1. Synchronic Unity (The "Controller" Case)**
  *Consider a moment of intense internal conflict (e.g., a craving to eat cake vs. a resolution to diet). Is there a single, unitary "experiencer" or "decider" behind these competing impulses, or is the experience just the competition itself?*
  *   **1a.** There is a single subject who *has* the conflict. (Go to **2**)
  *   **1b.** There is no subject; there is only the competing processes (craving vs. resolution). (Go to **5**)

  **2. Diachronic Unity (The "Gap" Case)**
  *Consider deep dreamless sleep or general anaesthesia where no experience occurs. Does the "you" that exists before the gap cease to exist and a new one arise upon waking, or does the same entity persist through the gap?*
  *   **2a.** The entity persists through the gap (continuity of substance). (Go to **3**)
  *   **2b.** The entity ceases and is replaced (discontinuity of experience). (Go to **4**)

  **3. Criterion of Persistence (The "Amnesia" Case)**
  *Consider a case of total retrograde amnesia where explicit memory is wiped, but character dispositions and intentions remain intact. Is this the same person?*
  *   **3a.** Yes, psychological continuity (dispositions) is sufficient. (**Leaf A: Lockean Psychological Continuity**)
  *   **3b.** No, strict memory connection is required for identity. (**Leaf B: Strict Lockean Memory**)
  *   **3c.** Yes, but only because the biological animal persists. (**Leaf C: Animalism**)

  **4. The "Empty Box" Check (Subject without Stream)**
  *You posited a Subject now (1a) but denied persistence through gaps (2b). If the subject ceases completely in sleep, in what sense is it the "same" subject when it returns?*
  *   **4a.** It isn't the same subject; identity is an illusion. (**Leaf D: Eliminativist Nihilism**)
  *   **4b.** It is the same subject, re-anchored to the same body. (**Leaf C: Animalism** — *Note: This collapses back to 3c*)
  *   **4c.** This position is incoherent (a subject implies persistence). (**Empty Box 1**)

  **5. Diachronic Stream (The "Drift" Case)**
  *You denied a subject now (1b). Consider a case where every psychological feature changes gradually over 50 years (values, memories, personality), but the causal mental stream is unbroken. Is there a "person" here?*
  *   **5a.** No, if psychology changes completely, the person is gone. (Go to **6**)
  *   **5b.** Yes, the causal stream (*santana*) is sufficient for conventional personhood. (Go to **7**)

  **6. Degree of Identity (The "Fission" Case)**
  *Consider a teletransporter accident where your psychological stream branches into two fully functioning copies. Do both have an equal claim to be the "survivor"?*
  *   **6a.** Yes, survival is a matter of degree; identity is not what matters. (**Leaf E: Parfitian Reductionism**)
  *   **6b.** No, identity must be one-to-one; this scenario destroys the person. (**Leaf D: Eliminativist Nihilism**)

  **7. Ontology of the Stream (The "Momentariness" Case)**
  *Is the mental stream composed of discrete, momentary events (*dharmas*) that arise and perish instantly, or is it a continuous flow?*
  *   **7a.** Discrete moments; continuity is causal succession like a flame. (Go to **8**)
  *   **7b.** Continuous flow; moments are conceptual cuts. (Go to **9**)

  **8. Convention and Karma (The "Responsibility" Case)**
  *On the discrete moment view: What picks out "John" for karmic responsibility? Is it the psychological similarity or the causal role?*
  *   **8a.** Psychological similarity; karma is just cause-and-effect on traits. (**Leaf E: Parfitian Reductionism** — *Note: Convergence*)
  *   **8b.** Causal role; "John" is a label on a karmic series, not a psychological entity. (**Leaf F: Abhidharma Reductionist**)

  **9. Emptiness of the Stream (The "Neuron" Case)**
  *Consider slow neuron-by-neuron replacement. If the stream is continuous, does it have inherent existence?*
  *   **9a.** The stream is real, but the self is imputed upon it. (**Leaf G: Yogacara/Sautrantika**)
  *   **9b.** The stream itself is empty of inherent existence; even causality is conventional. (**Leaf H: Madhyamaka Prasangika**)

  **10. Prudential Concern (The "Adequacy" Case)**
  *Does your view need to make it rational to care about your future self (or future rebirth) to count as adequate?*
  *   **10a.** Yes, if the view doesn't justify self-concern, it fails. (Filter for **Leaf A, B, C, E**)
  *   **10b.** No, self-concern is a habit to be undone, not justified. (Filter for **Leaf F, G, H**)

  ---

  ### Leaf Descriptions (The Taxa)

  *   **Leaf A: Lockean Psychological Continuity.** (Western Reductionist). There is no soul, but a person is defined by overlapping chains of memory and character. *Prudential concern is justified by psychological connection.*
  *   **Leaf B: Strict Lockean Memory.** (Historical). Identity requires actual memory links. *Problem: Forgets sleep and infancy.*
  *   **Leaf C: Animalism.** (Biological). You are a human organism. Psychological gaps don't matter. *Synchronic unity is biological, not mental.*
  *   **Leaf D: Eliminativist Nihilism.** (Nastika). No self, no stream, no persistence. Talk of "person" is strictly false. *Often fails the Prudential Concern test.*
  *   **Leaf E: Parfitian Reductionism.** (Western Buddhist-adjacent). Persons exist, but identity is not what matters; survival is a matter of degree (Relation R). *Functionally very similar to Leaf F.*
  *   **Leaf F: Abhidharma Reductionist.** (Buddhist Realist). Moments (*dharmas*) are real; persons are conceptual constructs (*prajñapti*) over a causal stream. *Karma tracks the causal stream, not a self.*
  *   **Leaf G: Yogacara/Sautrantika.** (Mind-Only/Stream Realist). The mental stream has a level of reality; the self is a false superimposition. *Synchronic unity is denied; diachronic continuity is affirmed.*
  *   **Leaf H: Madhyamaka Prasangika.** (Emptiness). Neither self nor stream has inherent existence. All views are conventional tools. *Denies the coherence of the "Empty Box" questions themselves.*

  ---

  ### Logical Space & Empty Boxes

  You asked to separate Synchronic (now) and Diachronic (time) unity, and to identify empty boxes. Here is the matrix of logical possibilities generated by Questions 1 and 2/5:

  | | **Diachronic Unity YES** (Persists) | **Diachronic Unity NO** (Perishes) |
  | :--- | :--- | :--- |
  | **Synchronic Unity YES** (Subject Now) | **Substantialism** (Leaf A, B, C, G). <br> *Standard Western & Some Buddhist views.* | **Empty Box 1** (Subjective Presentism). <br> *Why empty:* Incoherent. If a "subject" exists now but has no temporal thickness or persistence, it cannot act or experience change. It is a geometric point in time, which is ontologically unstable. |
  | **Synchronic Unity NO** (No Subject Now) | **Process/Stream Views** (Leaf E, F, H). <br> *The "Unoccupied Box" you suspected.* <br> *Status:* **Occupied.** This is the classic Buddhist Reductionist position (*anatta* + *santana*). There is a stream, but no rider. | **Eliminativism** (Leaf D). <br> *Nihilism.* Nothing exists but the current moment of phenomena. |

  **Note on Degree vs. All-or-Nothing:**
  This is handled in Question 6.
  *   **All-or-Nothing:** Leaf B, C, D. (Either you are the same person or you aren't).
  *   **Matter of Degree:** Leaf A, E, F. (Connection can be stronger or weaker).
  *   **Incoherent Combination:** A view that claims "Identity is all-or-nothing" but "Survival matters more than Identity" (Parfit's starting point) often collapses into the Degree view upon analysis.

  ---

  ### Ambiguity Flag: The Reductionist Collapse

  **Leaf E (Parfitian)** and **Leaf F (Abhidharma)** are flagged as potentially indistinguishable in this key.
  *   **Why:** Both deny a substantial self. Both affirm a causal/psychological stream. Both treat "person" as a conventional label. Both allow identity to be a matter of degree (or replace identity with survival).
  *   **Difference:** The difference is metaphysical, not phenomenological. Leaf F commits to discrete momentary *dharmas* (Question 7a) and karmic causality as a fundamental law. Leaf E commits to physical/psychological causality and is neutral on momentariness.
  *   **Verdict:** If your group members agree on the cases (Fission, Amnesia, Sleep) but disagree on "Momentariness," they are functionally holding the same ethical/phenomenological view. Do not let them argue they are different unless they can show a *practical* difference in how they treat the Amnesia or Fission cases.

  ---

  ### Scoring Key

  **To locate a view, tally the answers:**

  *   **Mostly 1a + 2a:** You are in the **Substantialist** branch (Leaves A, B, C).
      *   If 3a: **Lockean (A)**.
      *   If 3b: **Strict Memory (B)**.
      *   If 3c: **Animalist (C)**.
  *   **1a + 2b:** You are in the **Incoherent/Nihilist** zone (Leaf D or Empty Box 1).
  *   **Mostly 1b + 5b:** You are in the **Stream/No-Self** branch (Leaves E, F, G, H).
      *   If 6a (Degree): **Parfitian (E)** or **Abhidharma (F)**.
          *   Check Q7: Discrete = **Abhidharma (F)**. Continuous = **Parfit (E)**.
      *   If 6b (One-to-One): **Nihilist (D)**.
      *   If 7b + 9a: **Yogacara (G)**.
      *   If 7b + 9b: **Madhyamaka (H)**.
  *   **Mostly 1b + 5a:** You are a **Psychological Eliminativist**. (If psychology goes, you go). This usually collapses into **Nihilism (D)** or **Parfit (E)** depending on how you handle Fission.

  **Ambiguous Patterns:**
  *   **Pattern:** 1b (No Subject) + 6a (Degree) + 7a (Moments) + 8b (Karmic Role).
      *   **Result:** **Abhidharma Reductionist (F)**.
  *   **Pattern:** 1b (No Subject) + 6a (Degree) + 7b (Continuous) + 8a (Psych Role).
      *   **Result:** **Parfitian Reductionist (E)**.
      *   **Ambiguity:** These two patterns yield identical predictions on the Fission and Amnesia cases. The distinction is purely metaphysical (discrete moments vs. continuous flow). If your group argues here, remind them they are arguing about physics/metaphysics, not personal identity.

  *   **Pattern:** 1a (Subject) + 5b (Stream persists).
      *   **Result:** **Contradiction.** You cannot have a unitary subject (1a) that is also just a stream (5b). This indicates a confusion between *conventional* "I" (useful label) and *ontological* "I" (real entity).

  **Final Note for the Group:**
  If two people land on different Leaves but agree on all the *Cases* (Fission, Amnesia, Sleep), they do not have a disagreement about personal identity; they have a disagreement about vocabulary. The Key sorts by case intuition. If the cases match, the view matches, regardless of the label.
