prompt: |-
  I'm a third-year philosophy student enrolled in an advanced seminar on Wittgenstein's later work, and I'm drafting a proposal for a one-semester independent research project of about 6,000 words. Rather than rehearsing the familiar anti-essentialist reading of family resemblance—where 'game' or 'language' lacks a common feature shared by all instances—I want to ask whether the metaphor can be turned into a constructive analytical tool for tracking conceptual migration across disciplinary boundaries. Specifically, I propose to examine how the term 'rule-following' functions grammatically in three distinct language-game contexts: experimental physics protocols, judicial precedent reasoning, and children's structured play. The precise question is this: if family resemblance describes not merely the absence of an essence but a positive structural relation among concept-clusters, can we specify the conditions under which a resemblance-link between two contexts is strong enough to preserve meaningful transfer without collapsing into ambiguity or equivocation? I think the existing literature leaves this open because treatments either remain at the level of negative critique against essentialism or borrow cognitive-science notions of prototypes without addressing Wittgenstein's specific concern with grammar, use, and context-dependent criteria of correctness. My method will be purely conceptual: I will map the overlap and divergence of grammatical rules across my three cases, then propose a tentative criterion—call it 'grammatical continuity'—that distinguishes legitimate cross-contextual extension from mere homonymy. A successful deliverable would be a defensible, non-arbitrary standard for such continuity applied to at least one concrete conceptual migration; failure would occur if analysis shows that either all cross-game uses are strictly identical (making resemblance redundant) or entirely incommensurable (making resemblance impossible). Given the semester scope, I will limit myself to these three domains, avoid empirical data collection or archival work, and not attempt a general theory of all conceptual change. I also need an honest assessment of whether this framing is too abstract to yield a determinate conclusion or too ambitious for the word limit, and what adjustments would make it tractable. Please do not include a bibliography or reading list, as I will supply citations myself. At the very end, provide a one-sentence summary of the proposal's core deliverable in this exact format: Summary: [one sentence].
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Third-year philosophy student (advanced seminar on Wittgenstein's later work).
      *   **Task:** Drafting a proposal for a one-semester independent research project (approx. 6,000 words).
      *   **Topic:** Wittgenstein's "family resemblance" not as anti-essentialist critique but as a constructive analytical tool for tracking conceptual migration across disciplinary boundaries.
      *   **Specific Focus:** The term 'rule-following' in three contexts: experimental physics protocols, judicial precedent reasoning, children's structured play.
      *   **Research Question:** Can we specify conditions under which a resemblance-link between two contexts is strong enough to preserve meaningful transfer without collapsing into ambiguity or equivocation?
      *   **Method:** Purely conceptual (mapping overlap/divergence of grammatical rules), proposing a criterion called 'grammatical continuity'.
      *   **Deliverable:** A defensible, non-arbitrary standard for continuity applied to at least one concrete conceptual migration.
      *   **Constraints:** No bibliography/reading list. One-sentence summary at the very end in a specific format (`Summary: [one sentence]`).
      *   **Feedback Needed:** Honest assessment of whether the framing is too abstract, too ambitious for the word limit, and suggestions for adjustments to make it tractable.

  2.  **Evaluate the Proposal's Viability:**
      *   **Strengths:**
          *   Moves beyond the standard "no essence" reading of family resemblance (which is indeed overdone).
          *   Attempts to make Wittgenstein *constructive* rather than just therapeutic/negative.
          *   Selects three distinct domains (physics, law, play) that clearly involve "rules" but in different ways.
          *   Acknowledges limitations (no empirical data, limited scope).
      *   **Weaknesses/Risks:**
          *   **Word Count:** 6,000 words is very short for a deep Wittgensteinian exegesis *plus* a comparative analysis of three complex domains *plus* the construction of a new criterion ('grammatical continuity').
          *   **Abstractness:** The notion of "grammatical continuity" risks becoming itself an essentialist criterion, which might contradict Wittgenstein's anti-theoretical stance. Wittgenstein famously warned against building theories.
          *   **Scope:** Three domains is likely too many for 6,000 words if the analysis is to be rigorous. Each domain requires setting up the "language-game" before comparing them.
          *   **Wittgensteinian Orthodoxy:** Wittgenstein might resist the idea of a "standard for legitimacy" of conceptual migration. He often aimed to dissolve philosophical problems rather than solve them with criteria. The proposal risks turning Wittgenstein into the kind of theorist he criticized.
          *   **Ambiguity of "Rule-Following":** This is one of the most debated topics in Wittgenstein scholarship (Kripke, etc.). Tackling this in three domains is huge.

  3.  **Formulate the Feedback:**
      *   **Tone:** Academic, supportive, critical, tailored to a third-year philosophy student.
      *   **Assessment:**
          *   *Ambition:* Too ambitious for 6,000 words. Three domains is too many.
          *   *Abstractness:* The risk of reifying "grammatical continuity" into an essence is high. Needs careful framing to avoid contradicting Wittgenstein's method.
          *   *Tractability:* Needs narrowing. Focus on two domains instead of three. Or focus on the *migration* itself rather than establishing a general criterion.
      *   **Suggestions:**
          *   Reduce domains to two (e.g., Law and Play, or Physics and Law).
          *   Reframe the "criterion" not as a theoretical standard but as a descriptive map of overlaps (staying true to PI §66-67).
          *   Clarify the relationship between "grammar" and "use" to avoid metaphysical baggage.
          *   Address the potential conflict between proposing a "standard" and Wittgenstein's anti-theoretical stance.

  4.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the sophistication of the proposal. It's a strong pivot from the standard reading.
      *   **Critique on Scope/Word Count:** 6,000 words is tight. Three case studies + exegesis + positive theory construction is too much. Suggest cutting one case study.
      *   **Critique on Philosophical Coherence:** The idea of a "criterion for legitimacy" might clash with Wittgenstein's therapeutic aim. Warn against turning "family resemblance" into a theory of meaning. Suggest framing it as "perspicuous representation" rather than a "standard."
      *   **Critique on "Rule-Following":** This is a minefield (Kripkean skepticism). Need to ensure the student isn't accidentally solving the rule-following paradox but rather looking at the *grammar* of the word "rule" in specific contexts.
      *   **Specific Adjustments:**
          1.  Drop one case study (keep Physics and Law, or Law and Play).
          2.  Reframe "grammatical continuity" as a descriptive tool, not a normative standard.
          3.  Ensure the exegesis doesn't consume all the word count.
      *   **Conclusion:** Encouraging but realistic.
      *   **Final Summary:** Must follow the exact format.

  5.  **Refining the Summary:**
      *   Needs to be one sentence.
      *   Needs to capture the core deliverable.
      *   Format: `Summary: [one sentence]`.
      *   Draft: Summary: The project aims to establish a criterion of grammatical continuity to determine when conceptual migration between language-games is meaningful rather than equivocal.
      *   Refinement: Summary: This project proposes a criterion of grammatical continuity to distinguish legitimate conceptual migration from equivocation across distinct language-games involving rule-following.

  6.  **Final Review against Constraints:**
      *   No bibliography? Check.
      *   One-sentence summary at the very end? Check.
      *   Specific format? Check.
      *   Address the student's specific questions (abstractness, ambition, adjustments)? Check.

  7.  **Final Polish:** Ensure the tone is appropriate for an advanced seminar student (respectful of their knowledge, but pointing out potential pitfalls). Make sure the Wittgensteinian nuances are accurate (e.g., warning against theory-building).

      *Self-Correction on "Rule-Following":* I should mention that "rule-following" is notoriously difficult in Wittgenstein scholarship. If they focus on the *word* "rule" rather than the philosophical problem of rule-following, it might be more manageable. I need to advise them to stick to the *grammar* of the concept, not the metaphysics of normativity.

      *Self-Correction on Word Count:* 6,000 words is roughly 20-25 pages. Introduction (10%), Exegesis (30%), Case Studies (40%), Conclusion (20%). That leaves only 2,400 words for three case studies. That's 800 words per case study. That is insufficient for "experimental physics protocols" AND "judicial precedent" AND "children's play". Definitely recommend cutting one.

      *Self-Correction on "Constructive Tool":* Wittgensteinians might balk at "constructive analytical tool." I should advise the student to frame this carefully so it doesn't look like they are turning Wittgenstein into a positivist or a cognitive scientist. Use terms like "perspicuous overview" (übersichtliche Darstellung).

      *Final check on Summary Format:* `Summary: [one sentence]`. No extra spaces or line breaks after the colon unless part of the sentence.

