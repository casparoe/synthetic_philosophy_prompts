      *   *Priya's Argument:* Make sure I don't say "individual choices matter." Say "individual choices aggregate to matter via the contract."
      *   *Pledge Wall:* Be firm on removing/modifying it.
      *   *Leakage:* Acknowledge it's a real risk.

  7.  **Final Polish:** Check flow, clarity, and ensure the "Bottom Line" is unmistakable. (Self-Correction: Make sure I don't sound like I'm attacking the undergrads, but rather strengthening their proposal based on committee feedback).

  8.  **Word Count Management:**
