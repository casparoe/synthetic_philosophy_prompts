      *   *Leakage:* If students leave, we lose revenue and don't reduce meat. Measure total meals served. If traffic drops >5%, rethink.
      *   *Agency:* Stop framing this as student choice. It's university procurement. Students are participants, not moral agents responsible for the supply chain.
      *   *Pledge Wall:* Remove it. It creates guilt for vulnerable students (meal plan holders, international). It doesn't add data.
      *   *Plan:* One hall. One semester. Measure mix + total volume. Review committee meeting Dec 15.
      *   *Conclusion:* This protects the university from risk while testing the mechanism that actually matters (the contract threshold).

  6.  **Review against Constraints:**
