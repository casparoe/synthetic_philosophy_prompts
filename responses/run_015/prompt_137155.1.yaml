answer: |-
  **MEMORANDUM**

  **TO:** Dining and Sustainability Advisory Committee
  **FROM:** [Your Name], Graduate Student Union Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Undergrad Sustainability Caucus Proposal: Plant-Based Default Pilot

  **Bottom Line Recommendation**

  I recommend we **approve the proposal with conditions**. Specifically, we should limit the pilot to one of the two proposed dining halls for a single semester, remove the public pledge wall, and reframe the initiative as an institutional procurement test rather than a student moral commitment. We should set a formal review date for December 15 to assess data before considering expansion or contract renegotiation.

  This approach allows us to test the mechanism that actually drives change—the contractual threshold—while mitigating the financial and ethical risks raised during our last discussion.

  **Addressing the Inefficacy Objection**

  We need to address the strongest argument against this proposal head-on: the claim that individual dietary choices do not impact animal welfare because of how bulk ordering works. The argument is that our contractor orders protein in large blocks (approximately 500 pounds). If a student skips the chicken today, that meal falls within the "rounding band" of the existing order. The chicken was already bought; skipping it changes nothing.

  This logic is sound regarding individual meals. However, it does not apply to the policy itself. Our contract contains a specific clause: if animal-protein orders remain under 12% of total meals served for two consecutive semesters, the contractor must trigger a wholesale procurement renegotiation. This changes pricing tiers and supplier networks permanently.

  Therefore, the goal of this pilot is not to ensure that every skipped meal saves an animal—that is statistically unlikely. The goal is to shift the aggregate data enough to hit that 12% threshold. A default nudge is the most effective tool we have to move the aggregate number. Even if individual efficacy is low, policy efficacy is high if we hit the contract trigger. We should be honest about this: we are not asking students to save chickens one by one; we are asking them to participate in a data set that allows the University to change its purchasing tier.

  **Leakage and Institutional Agency**

  There is a valid concern about leakage: if the default changes, students may simply drive to off-campus options for meat, leaving our waste numbers low but doing nothing for overall consumption. This would hurt dining revenue without achieving sustainability goals.

  To manage this, we must measure total meal counts, not just the protein mix. If the plant-based default causes a significant drop in overall dining hall traffic, the policy is failing. By piloting this in only one hall, we keep the second hall as a control group. If traffic dips in the pilot hall but remains stable in the control, we have evidence of leakage. If traffic remains stable in both, we have evidence of acceptance.

  This also clarifies the question of agency. Our business manager noted that if the University decides this policy, the causal burden shifts from students to the institution. I agree. We should stop framing this as a test of student morality. It is an institutional supply chain decision. Students are not moral agents responsible for the carbon footprint of their lunch; they are customers responding to a menu change. Framing this as an institutional procurement shift protects students from bearing the weight of systemic issues they didn't create.

  **The Pledge Wall**

  I recommend we remove the pledge wall from the proposal. While well-intentioned, it introduces ethical risks that outweigh its benefits.

  First, it creates a "free rider" dynamic where students who eat meat after signing are framed as letting down their peers. This is particularly problematic for students on mandatory meal plans who cannot opt out of the system, and for international students for whom specific meat dishes may be culturally significant or the only familiar option available. Making them sign a pledge to restrict their own access to comfort food creates unnecessary social pressure.

  Second, the pledge wall does not add value to the data. We will know exactly how many meat meals are ordered through the dining app. A public signature board adds social friction without adding metric value. If we want student engagement, we should replace the pledge wall with a feedback board where students can comment on the food quality. This keeps the focus on the product, not the person.

  **Proposed Pilot Design**

  To move forward responsibly, I propose the following concrete plan:

  1.  **Scope:** Implement the plant-based default in only one of the two large dining halls (e.g., Main Hall) for the Spring semester. The second hall (e.g., West Hall) remains standard operating procedure to serve as a control for traffic and leakage analysis.
  2.  **Opt-In Mechanism:** Keep the proposed app-based ordering for animal protein (24-hour notice) to ensure accurate forecasting and minimize waste.
  3.  **Metrics:** We will track three specific data points:
      *   Percentage of meals served with animal protein (target: <12%).
      *   Total daily meal count per hall (to detect leakage).
      *   Food waste weight per station (to ensure we aren't throwing away more plant-based food than we save in meat).
  4.  **Review Point:** The Committee will reconvene on December 15, prior to the start of the Spring semester, to review the Fall data. If the 12% threshold is met without significant traffic loss, we discuss expanding to the second hall to trigger the two-semester contract clause. If leakage is high or student pushback is severe, we terminate the pilot.

  **Conclusion**

  Priya's argument that individual choices are morally cosmetic is largely correct, but it misses the structural opportunity here. We aren't voting on whether students should be virtuous; we are voting on whether the University should test a procurement threshold that could lock in long-term sustainability gains.

  By narrowing the scope, removing the moralizing pledge wall, and focusing on the contract trigger rather than individual impact, we can defend this pilot against economic and ethical critique. It transforms the proposal from "moral cosplay" into a legitimate business intelligence test. I ask the committee to support this modified approach.
