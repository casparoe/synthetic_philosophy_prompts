      *   Inefficacy/Contract: 300 words.
      *   Leakage/Agency: 250 words.
      *   Pledge Wall: 200 words.
      *   Pilot Design/Next Steps: 200 words.
      *   Total: ~1100 words.

      *Let's write.*

