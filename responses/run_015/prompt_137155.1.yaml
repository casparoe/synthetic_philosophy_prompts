      *   **Context:** Voting in three weeks on a proposal from the undergrad sustainability caucus.
      *   **Proposal:** Two biggest dining halls go plant-based by default for a semester. Meat must be requested via app day before or at station. Pledge wall in lobby.
      *   **Conflict/Challenge:** Friend Priya (econ PhD) argues "inefficacy objection" (individual choices don't matter due to bulk ordering thresholds/rounding). Also raises leakage (students going off-campus), institutional vs. individual responsibility, and ethical issues with the pledge wall (free rider guilt, mandatory meal plans, international students).
      *   **Key Contract Detail:** If animal-protein orders stay under 12% for two consecutive semesters, contractor triggers renegotiation (wholesale procurement change). This makes the threshold real but probabilistic.
      *   **Requirements:**
          *   Format: Memo (not an essay).
          *   Length: 900 to 1200 words.
          *   Audience: 11 other committee members (mix of facilities staff, dean, students, etc.). Plain language, no citations.
          *   Content: Must take Priya's strongest argument (inefficacy) seriously, not just dismiss it. Must address leakage, institutional vs. individual agency, and the pledge wall ethics.
          *   Output: Clear bottom line (approve, reject, approve with conditions), concrete pilot design (one hall vs. both, metrics, sunset/review).
          *   Tone: Professional, decisive, nuanced, defensible.
          *   Status: User is genuinely undecided but wants a defensible recommendation.

  2.  **Determine the Recommendation:**
      *   *Option A (Approve as written):* Risks leakage, ethical issues with pledge wall, ignores the probabilistic nature of the threshold.
      *   *Option B (Reject):* Misses the opportunity to hit the 12% threshold which *does* trigger structural change. Ignores the signaling value.
      *   *Option C (Approve with Conditions):* This seems the strongest. It addresses the inefficacy objection by focusing on the *aggregate* goal (hitting the 12% threshold) rather than individual moral purity. It mitigates leakage by testing in one hall first. It fixes the pledge wall ethical issue by reframing or removing it.
      *   *Decision:* Recommend a **Modified Pilot (Approve with Conditions)**. This allows for data collection to answer Priya's concerns while aiming for the contractual threshold.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening/Bottom Line:** State the recommendation clearly upfront. (Approve a modified one-semester pilot in one hall, remove pledge wall, focus on aggregate metrics).
      *   **Addressing the Inefficacy Objection (Priya's Point):** Acknowledge the bulk ordering reality. Explain that individual choices *don't* matter in isolation, but the *policy* matters because it shifts the aggregate to hit the contractual 12% threshold. The goal isn't individual virtue; it's triggering the contract clause.
      *   **Addressing Leakage:** Acknowledge students might go off-campus. Mitigation: Measure total dining hall volume, not just mix. If total volume drops too much, the policy fails financially. Pilot in one hall limits this risk.
      *   **Addressing Institutional vs. Individual:** Agree that the University is the agent of change, not the students. The policy should be framed as an institutional procurement shift, not a student moral test. This solves the "moral cosplay" critique.
      *   **Addressing the Pledge Wall:** This is the ethical weak point. Mandatory meal plans + international students + guilt = bad. Recommend removing the pledge wall or changing it to a "feedback board" rather than a commitment contract. It creates unnecessary social pressure without adding efficacy.
      *   **Pilot Design:**
          *   *Scope:* One large hall (not both) to limit leakage risk and create a control group.
          *   *Duration:* One semester (need two to trigger contract, but pilot decides whether to continue).
          *   *Metrics:* % animal protein orders, total meal count (leakage check), cost variance, waste metrics.
          *   *Review:* End of semester review before deciding on Hall 2 or contract renegotiation push.
      *   **Closing:** Call to action for the vote.

  4.  **Refining and Editing (Word Count & Tone Check):**
      *   *Tone:* Needs to be pragmatic, not preachy. Acknowledge the econ argument without getting bogged down in philosophy.
      *   *Word Count:* Target 900-1200.
      *   *Key Constraint:* "Take Priya's strongest version seriously." I need to explicitly state that individual meals don't save chickens, but the *policy* changes the order block.
      *   *Key Constraint:* "Plain language." No academic jargon.
      *   *Key Constraint:* "Concrete pilot design."

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**
