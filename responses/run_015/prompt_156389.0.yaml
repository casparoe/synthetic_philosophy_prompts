answer: |-
  This is a remarkably sharp dissection of a problem that usually gets glossed over in both philosophy and law. You have identified that our institutions do not operate on a single, coherent metaphysical theory of persistence. Instead, they operate on a **pragmatic patchwork of normative continuity.**

  To answer your core question: The package of practices you describe does not presuppose Endurance (Friend A) or Perdurance (Friend B) in the strict metaphysical sense. It presupposes a third thing, which we might call **Functional Succession**.

  Here is the reconstruction of the implicit theory, the analysis of your "Chain-of-Custody" view, and the concrete consequences of radicalizing the metaphysics.

  ### 1. The Implicit Theory: Normative Continuity

  Your friends are arguing about *ontological* persistence (what makes a thing *be* the same thing). The law and institutions are arguing about *normative* persistence (what makes a thing *bear the same burdens and rights*).

  **What the practices strictly require:**
  The institutions do not require metaphysical identity. They require **identifiability and transferability**.
  *   **For Corporations/States:** The requirement is an unbroken chain of *legal recognition*. As long as the registry says "Kestrel & Voss" and the law says "successors assume liabilities," the entity persists. The "stuff" (brass vs. software) is irrelevant because the corporation is not a material object; it is a *nexus of contracts*.
  *   **For Natural Persons:** The requirement is split. For *property and rights* (living wills), the body serves as the anchor (continuity of organism). For *culpability and punishment*, psychological continuity serves as the anchor (continuity of mind).

  **What merely sits well with the practices:**
  *   **Perdurance (Friend B):** This sits well with corporate liability. Viewing the firm as a "spacetime worm" of activity allows liabilities to slide along the worm regardless of material turnover.
  *   **Endurance (Friend A):** This sits well with the intuition behind statutes of limitations. If the "substance" of the harm is too distant from the "substance" of the current entity, the link feels broken.

  **Where the practices are underdetermined:**
  The metaphysics is underdetermined wherever the law allows for *successor liability* without *universal succession*. For example, when Company A buys the assets of Company B but not the liabilities, the law treats them as different entities. When Company A merges with Company B, they become the same. The metaphysical difference between a "merge" and an "asset purchase" is zero; the difference is purely linguistic and regulatory. The law creates the identity conditions it needs to achieve policy goals (e.g., protecting creditors vs. encouraging commerce).

  ### 2. The Corporate-Personal Asymmetry: Policy or Principle?

  Your friend who insists "the metaphysics never enters into it" is mostly right, but with a crucial caveat. It is **liability policy wearing a metaphysical costume.**

  *   **Why the asymmetry exists:**
      *   **Corporations** are artificial persons created *for* the purpose of holding assets and liabilities across time. Their entire *point* is to outlast their constituents. If a corporation shed its liabilities every time it changed its business model, the corporate form would be useless for capital accumulation. Therefore, the law *forces* a perdurantist view on corporations to ensure market stability.
      *   **Natural Persons** are biological organisms. The law respects the biological reality that punishment requires a subject who can understand the connection between act and consequence. If the psychological link is severed (dementia/insanity), retributive justice becomes incoherent. However, for *autonomy* (living wills), the law prioritizes the *past competent self* over the *current incompetent self* to prevent the "tyranny of the present moment."

  *   **Is it principled?**
      It is principled *functionally*, not metaphysically. The principle is: *Bind entities that can plan across time to their plans; bind persons to their bodies for care, but only to their minds for blame.*

  ### 3. Evaluating Your "Chain-of-Custody" View

  Your "Chain-of-Custody" view (unbroken sequence of transfers, name, records, and assumption of obligations) is actually the **dominant legal standard** for institutional identity. In law, this is known as **Successor Liability** or **Continuity of Enterprise**.

  *   **Does existing practice presuppose this?**
      Yes, for institutions. The 1931 foundry and the 2024 software firm are the same *legal person* because the registry entry never died, and the obligations were never legally extinguished, only transformed.
  *   **How it handles awkward cases:**
      *   **The Revolutionary Government:** This is the weak point of your view. International law distinguishes between the *State* (which persists) and the *Government* (which changes). A revolutionary regime often claims to be the *same State* (to keep territory and treaty rights) but a *new Government* (to repudiate "odious debts" of the tyrant). Your Chain-of-Custody view struggles here because the revolutionaries explicitly *break* the chain of obligation while claiming the chain of identity. The law resolves this politically: if the new regime is recognized, they get the treaties; if the debts are deemed "odious" (incurred against the people's interest), the chain of custody is legally severed despite the physical continuity.
      *   **The Dementia Patient:** Your view works for the living will (the body/ID provides the chain of custody) but fails for criminal punishment. If the 85-year-old cannot access the "records" (memories) of the 30-year-old, the chain of *moral* custody is broken, even if the *legal* custody holds. This explains the asymmetry: the law enforces the living will because it protects the *institution of autonomy*, but it halts punishment because it protects the *integrity of retribution*.

  ### 4. Concrete Consequences of Radicalizing the Metaphysics

  If we stopped being pragmatic and forced our institutions to align with a single strict metaphysical theory, the results would be catastrophic.

  #### Scenario A: Going All-In on Time-Slices (Perdurance)
  *Theory:* The Kestrel & Voss of 1931 and the Kestrel & Voss of 2024 are distinct temporal parts of a "company worm," but liability cannot transfer between distinct slices unless explicitly contracted. The 30-year-old and 85-year-old are distinct person-stages.

  *   **Who owes the 1931 workers?**
      *   **Nobody.** The 1931 slice is gone. The 2024 slice did not commit the tort. Unless there was a specific contract passing the debt (which your theory might view as a new obligation, not an old one), the claim dies with the temporal part.
      *   **Result:** Massive windfall for legacy corporations. No historical liability for slavery, pollution, or fraud.
  *   **Whose signature on the living will counts?**
      *   **Nobody's.** The 30-year-old slice has no authority over the 85-year-old slice. They are different people. The 85-year-old's current interests (even if demented) or their next-of-kin's decisions would override the will.
      *   **Result:** Advance directives become unenforceable. Medical ethics collapses into present-moment paternalism.
  *   **Treaties and Debt:**
      *   National debt resets every election cycle or regime change. Bonds become worthless. International treaties dissolve as signatory governments change.

  #### Scenario B: Going All-In on Strict-Same-Substance (Endurance/Material)
  *Theory:* A thing is only the same if it retains its core material constituents or essential "stuff."

  *   **Who owes the 1931 workers?**
      *   **Nobody (again).** The 2024 Kestrel & Voss has no brass, no foundry, and no original shareholders. It is a new entity wearing a mask.
      *   **Result:** Similar to Time-Slices, but for a different reason. Corporate mergers and pivots would legally dissolve the entity, triggering immediate liquidation of all assets to pay off all debts before any new business could start. The modern economy would freeze.
  *   **Whose signature on the living will counts?**
      *   **The 85-year-old's.** But since the brain cells have largely turned over, and psychological continuity is broken, one could argue the 85-year-old is not the 30-year-old. However, since the *body* is the substance, the body's current interest prevails.
      *   **Result:** Similar to Time-Slices regarding the will.
  *   **Treaties and Debt:**
      *   If a country changes its population significantly (migration, birth/death), is it the same state? If we require "same people," borders become meaningless. If we require "same land," then a government in exile ceases to exist.
      *   **Result:** Sovereign debt markets collapse. Recognition of states becomes a biological census.

  ### 5. Conclusion: The Verdict on the Barbecue Argument

  Your friend who said "metaphysics never enters into it" is the closest to the truth, but for the wrong reason. Metaphysics *does* enter, but only as a **vocabulary of justification**, not as a **constraint on design**.

  The legal system treats Kestrel & Voss as the same entity not because it believes in the metaphysical persistence of "corporate substance," but because **treating them as different would create a moral hazard.** If firms could shed liabilities by changing their business model, they would poison workers in 1931, pivot to software in 1980, and leave the victims with nothing. The "Chain-of-Custody" view is the legal engine that prevents this.

  Conversely, the legal system treats the dementia patient as *not* the same agent for punishment because **punishing a disconnected mind serves no deterrent or retributive purpose.**

  **The Synthesis:**
  The institutions presuppose a **Dual-Track Theory of Persistence**:
  1.  **For Obligations (Debt, Torts, Treaties):** Continuity is defined by **Record and Recognition** (Your Chain-of-Custody view). This allows society to plan across time.
  2.  **For Culpability (Crime, Blame):** Continuity is defined by **Psychological Connection**. This protects individuals from being punished for acts they can no longer own.

  The contradiction you feel isn't a bug; it's a feature. It allows us to hold institutions accountable for their long-term history while acknowledging that human beings change internally. If you force the law to choose one metaphysical view for everything, you either destroy the possibility of long-term planning (Time-Slices) or destroy the possibility of mercy and justice (Strict Substance).

  **Recommendation for the next barbecue:** Tell your friends they are both right about the metaphysics, but wrong about the law. The law isn't trying to solve the Ship of Theseus; it's trying to make sure someone pays for the lead poisoning without bankrupting the software industry. Your "Chain-of-Custody" view is the one the judges actually use, but they apply it selectively to maximize social utility, not metaphysical consistency.
