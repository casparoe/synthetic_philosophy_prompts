      *   The "opt-out" feature aligns with liberty, but the "sludge" (friction) manipulates the exercise of that liberty.
      *   Mill values the *process* of choosing, not just the outcome. Manipulating the choice architecture undermines the development of character and individuality.
      *   The claim of "facilitating true will" would likely strike Mill as presumptuous. Only the individual can judge their own good through experience and free choice.

