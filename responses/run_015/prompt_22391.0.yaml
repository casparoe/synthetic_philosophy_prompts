          *   *Better Conclusion:* The rational agent should follow the prediction. Why? Because "Objective Chance" is defined by its role in the best system (Lewis) or propensity. If a hidden variable determines the outcome, the chance is actually 0 or 1, not 0.01. The 0.01 was an epistemic placeholder. Therefore, the PP doesn't apply because the condition $Ch(A)=0.01$ is false given the total evidence.
