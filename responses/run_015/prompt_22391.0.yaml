      *   *Final Stance:* I will argue that the Principal Principle is a substantive norm that fails in this specific edge case because the concept of "objective chance" collapses when non-chance prediction is possible. Therefore, the agent should follow the prediction. The PP is a heuristic for when chance is the *best* available guide, not an absolute law when better guides exist.

