  **OFFICE OF SCIENTIFIC DEMARCATION (OSD)**
  **PUBLIC PORTAL | FAQ SECTION 4.2: CERTIFICATION STANDARDS**
  **LAST UPDATED: FISCAL QUARTER 3**

  **Q: Can pure mathematics apply for provisional certification?**
  **A:** No. Pure mathematics consists of tautological systems derived from axioms. As such, mathematical claims are not susceptible to empirical refutation. They cannot fail. Since the OSD mandates that all certified claims must maintain a positive vulnerability score on the **Risk-Exposure Ledger**, mathematics is categorically ineligible for Scientific Status. Applicants wishing to utilize mathematical frameworks within certified research programs must file Form M-2 for "Instrumental Endorsement." Please note that Instrumental Endorsement does not confer scientific status upon the mathematics itself, but merely acknowledges its utility in generating falsifiable predictions for a certified physical theory. Do not submit proofs of conjectures expecting demarcation clearance.

  **Q: My core claim was contradicted by observation, but I believe the failure lies with my auxiliary assumptions (e.g., instrument calibration). What is the procedure?**
  **A:** This scenario triggers a mandatory review by the **Conventionalist Stratagem Review Board**. Applicants are reminded that theories are not tested in isolation; they are tested alongside background conditions. When a prediction fails, proponents frequently attribute the error to these background conditions rather than the core claim. While this is sometimes valid, it is also the primary method by which non-scientific programs evade refutation.

  To proceed, you must submit evidence that your auxiliary hypothesis is independently testable. If the Board determines that the auxiliary assumption was introduced solely to absorb the anomaly without generating new risks, it will be classified as an "Immunization Maneuver." Upon such classification, your Risk-Exposure Ledger will be adjusted to reflect zero vulnerability, and your certification will be suspended. Please do not petition the Board regarding the logical underdetermination of theory by data; the OSD operates on administrative finality, not epistemological nuance.

  **Q: My research program consistently revises its predictions after data collection to ensure accuracy. Can I still qualify for renewal?**
  **A:** Generally, no. Certification requires that predictions be stated prior to observation. A research program that consistently adjusts its core claims to accommodate existing data is engaging in post-hoc rationalization. While this may increase the empirical fit of the theory, it decreases its Risk-Exposure score. The OSD does not certify accuracy; we certify vulnerability. If your theory explains everything that has already happened but risks nothing regarding what will happen next, it is considered functionally equivalent to a narrative. Renewal applications containing extensive retroactive modifications will be returned for revision. You must specify, in advance, what observation would cause you to abandon the claim. If the answer is "nothing," you are not doing science; you are doing theology.

  **Q: Why do certain classical theories retain certification despite known anomalies and low current risk-exposure?**
  **A:** These theories operate under a **Heritage Exemption**. The OSD recognizes an arbitrary historical cutoff date. Theories certified prior to this period retain their status through institutional prestige rather than current exposure to risk. This exemption is necessary to maintain stability in the academic infrastructure. While newer applicants must demonstrate high vulnerability on their Risk-Exposure Ledgers, HeritageExempt theories are granted "Grandfathered Validity." Applicants are advised not to cite this disparity in appeals. The Board does not adjudicate historical prestige. If your theory is not old enough to be exempt, it must be risky enough to be certified. There is no middle ground.

  **Q: Who do I contact if I believe the falsification of my theory was itself falsifiable?**
  **A:** Please submit a ticket to the Meta-Adjudication Division. Wait times are approximately 18 to 24 months. Do not call.
