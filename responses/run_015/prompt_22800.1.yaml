answer: |-
  This is a classic debate in the literature on moral uncertainty, often framed as the problem of **intertheoretic comparisons**. M is defending the **Expected Choice-Worthiness (ECW)** framework (championed by philosophers like William MacAskill), while R is raising the **Incommensurability Objection** (often associated with critics like Jacob Ross or early Ted Lockhart).

  Here is the play-by-play refereeing of their exchange, followed by an analysis of what both are missing.

  ### Play-by-Play Analysis

  **1. M's Opening: "Moral uncertainty is ordinary uncertainty."**
  *   **Verdict:** **M is methodologically standard, but assumes too much.**
  *   **Analysis:** M is correctly describing the dominant framework in moral uncertainty. If you are uncertain about empirical facts, you maximize expected utility; M argues you should do the same for moral facts. This is the principle of *maximizing expected choice-worthiness*. However, M is glossing over a crucial prerequisite: for ordinary uncertainty, all outcomes exist on a single utility scale (your preferences). For moral uncertainty, the "scales" belong to different theories that may not speak the same language. M is right about the *goal*, but premature about the *feasibility*.

  **2. R's Objection: "Theories must be commensurable."**
  *   **Verdict:** **R is technically correct.**
  *   **Analysis:** R identifies the "Intertheoretic Comparison Problem." If Utilitarianism says an action yields +10 units of value, and Deontology says the action is "Forbidden," these are not just different numbers; they are different *categories*. A prohibition is often understood as a constraint, not a cost. You cannot mathematically average a real number (+10) with a logical constraint (Forbidden). R is right that without a common currency of "choice-worthiness," the formula breaks.

  **3. M's Counter: "Incommensurability is a defect in the theories, not the procedure."**
  *   **Verdict:** **M is weak here.**
  *   **Analysis:** M tries to shift the burden, suggesting that at the meta-level, *you* create the scale. But this is question-begging. If a theory genuinely claims that certain actions are outside the realm of cost-benefit analysis (lexical priorities), forcing them onto a numerical scale misrepresents the theory itself. You aren't just "comparing options"; you are trying to aggregate inputs that refuse to be aggregated. M is hoping the problem resolves itself at the meta-level, but the input error propagates upward.

  **4. R's Pushback: "Expected value requires a single numerical scale."**
  *   **Verdict:** **R is mathematically right.**
  *   **Analysis:** Expected Value is defined as $\sum (Probability \times Value)$. If $Value$ is undefined for one of the theories in the sum, the total sum is undefined. R is correct that this isn't just a "hard calculation"; it is a category error. If 40% of your credence is in a theory that says "this calculation is invalid," you cannot use the calculation to override that 40%.

  **5. M's Concession: "Most decisions have agreement; use it there."**
  *   **Verdict:** **M is pragmatically optimistic, but logically retreating.**
  *   **Analysis:** M is arguing from prevalence. It is true that on most trivial choices (e.g., "what to eat for lunch"), Utilitarians and Deontologists agree. However, M is conceding that the theory fails in "edge cases." In decision theory, a theory that fails in high-stakes divergent cases is significantly weakened. M is effectively admitting that ECW works only when moral uncertainty doesn't actually matter much.

  **6. R's Closing: "A tool undefined where needed is broken."**
  *   **Verdict:** **R wins the pragmatic argument.**
  *   **Analysis:** The value of a decision procedure under uncertainty is highest when your first-order theories disagree. If the procedure only works when the theories agree, you didn't need the procedure; you could have just followed any of the agreeing theories. R is right that a meta-ethical tool that dissolves precisely at the point of moral conflict has failed its primary design specification.

  ---

  ### What Both of Them Are Missing

  While R wins the logical exchange, both M and R are operating with a slightly outdated map of the literature. They are missing three crucial developments that bridge the gap between their positions.

  **1. Normalization Strategies (M's Missing Piece)**
  M assumes we must take the theories' values "raw." But proponents of ECW (like MacAskill) argue for **normalization**. We don't take Utilitarianism's "10 utils" and Deontology's "Forbidden" at face value. We rescale the theories so they have the same variance or range.
  *   *How it helps M:* You can model "Forbidden" as an extremely high negative number (a "lexical" value). If you normalize the scales, you *can* run the calculation.
  *   *The Catch:* R would rightly ask: "By what authority do you rescale a theory that explicitly rejects trade-offs?" Normalization solves the math but may violate the spirit of the deontological theory.

  **2. Stochastic Dominance (The Third Way)**
  Both M and R assume you must calculate a specific *expected value*. Newer work (e.g., by Christian Tarsney) suggests using **Stochastic Dominance**.
  *   *The Idea:* Instead of summing values, you ask: "Is Action A at least as good as Action B according to *more* of my credence, and strictly better according to *some*?"
  *   *Why it matters:* This allows you to make decisions under moral uncertainty without requiring intertheoretic cardinal comparisons. You don't need to know if a rights violation is "-1000" or "-Infinity"; you just need to know that Theory A prefers X and Theory B is indifferent. This sidesteps R's "undefined sum" objection while keeping M's goal of rational choice.

  **3. Ordinal vs. Cardinal Information (R's Missing Piece)**
  R assumes that because we can't add the numbers, we can't decide. But decision theory doesn't always require cardinal (addable) values; sometimes **ordinal** (ranking) information is enough.
  *   *The Idea:* If Theory 1 says A > B and Theory 2 says A > B, you choose A, even if Theory 1 measures in "happiness units" and Theory 2 measures in "duty fulfillment."
  *   *Why it matters:* R is too quick to declare the tool "broken." It might not be an *Expected Value* tool, but it could be a *Pareto* tool. If an action is permissible across all theories you have credence in, you can take it without doing the impossible math M suggests.

  ### Final Verdict

  **Who won the argument?**
  **R wins on logic; M wins on aspiration.**

  R is correct that M's specific formulation (raw expected value maximization) is mathematically undefined in the exact cases where it is most needed. You cannot average a number with a prohibition. M's attempt to wave this away as a "defect in the theories" is unconvincing because the meta-theory must respect the inputs it is given.

  **However,** M is right that we need *some* way to navigate moral uncertainty. Abandoning the project entirely (as R implies) leaves us paralyzed or forced to pick "My Favorite Theory" arbitrarily.

  **The Referee's Ruling:**
  M's specific mechanism is broken, as R proved. But R's conclusion that the *project* is broken is too strong. The solution is not to abandon expected-value reasoning, but to upgrade it.
  *   If M switches from **raw expected value** to **normalized expected value** or **stochastic dominance**, M survives R's objection.
  *   If R acknowledges that "Forbidden" can be modeled as a lexical priority within a broader decision framework (rather than a math-stopper), R's objection loses its absolute force.

  **Advice for the Reading Group:**
  Tell them to read William MacAskill's *Normative Uncertainty* (for M's side) and then look up papers on "Stochastic Dominance under Moral Uncertainty" (for the synthesis). They are arguing about Version 1.0 of the software; Version 2.0 has already patched the bug R found.
