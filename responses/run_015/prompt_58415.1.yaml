answer: |-
  The rain battered the skylight of the common room, a rhythmic distraction from the silence that had fallen over the Oakwood Cooperative. Twelve residents sat around the scarred oak table, the air thick with the smell of wet wool and stale coffee. In the center lay the Charter, a black binder thick with amendments, its spine cracked from fifteen years of use.

  Elias, the board chair, cleared his throat. He was a man who found comfort in spreadsheets and finalized contracts. "The vote on Amendment 44 is concluded," he said, his voice steady. "Seven in favor, five against. Under Provision One, simple majority governs. The motion carries."

  He reached for the binder to initial the new page.

  "Stop," said Sarah. She didn't raise her voice, but the sharpness of it halted Elias's pen. Sarah was a tenant of ten years, a former paralegal who watched the building's finances with the suspicion of a hawk. "You can't initial that."

  "It passed, Sarah. Seven to five. We've been over this."

  "It passed under the rules that existed before the vote," Sarah said, tapping the table. "But Amendment 44 changes Provision Three. It says any change to an immutability designation requires unanimity. And Amendment 44 designates *itself* as immutable."

  Elias sighed, rubbing his temples. "We know what it says. But the rule wasn't in effect when we voted. You can't be bound by a law that doesn't exist yet."

  "Provision Three says a proposal to change a designation must pass by the threshold *currently required*," Sarah countered. "If the proposal changes the threshold required for itself, which threshold is 'currently required' at the moment of adoption? The Charter doesn't say. If the new threshold applies to the act of creating it, we needed twelve votes. We have seven. It failed."

  Marcus, sitting near the back, shifted in his chair. He was younger than the rest, renting a unit while he finished his degree. He didn't care about the metaphysics of the Charter; he cared about the leak in his bathroom ceiling. "So, what does this mean for the maintenance budget?" he asked. "We needed to approve that too."

  "We can't approve anything," said Priya, the secretary, who hadn't opened her laptop. "If Amendment 44 passed, Provision Three is now stricter. If it didn't pass, Provision Three is still mutable by majority. But we don't know which version of Provision Three is real. If I write this into the minutes, I'm certifying a legal reality that might be false."

  The room fractured. This was not the first time Oakwood had struggled with its self-governing rules, but it was the first time the rules had seemed to consume themselves. The Charter was designed to be alive, a organism that could adapt to the needs of the residents. Provision One allowed majority rule. Provision Two allowed residents to mark rules as 'mutable' or 'immutable.' Provision Three governed how those labels could be changed. Provision Four guaranteed the right to keep proposing changes. It was a elegant system, until it wasn't.

  Elias leaned forward. "Look, practically speaking, we operated under Majority Rule for fifteen years. We voted under Majority Rule. To say otherwise is to say that no amendment can ever tighten a rule, because the tightening itself would require the stricter rule it's trying to create. It's a logical lockout. It paralyzes the co-op."

  "That's not my argument," Sarah said. "My argument is textual. The amendment is a single unit. It changes the lock and turns the key in the same motion. If the key doesn't fit the new lock, the door doesn't open. You're trying to say the key fits the old lock, but you're walking through a new door."

  Marcus rubbed his face. "I just need to know if I can hire a plumber without unanimous consent. Under the old rules, maintenance is mutable. Majority rules. But if Amendment 44 passed, does it cast a shadow over everything else? Elias, you proposed this amendment to protect the 'No Short-Term Rentals' clause, right? You wanted to make sure nobody could vote to allow Airbnbs later."

  "Exactly," Elias said. "Stability. We need to stop people from voting away the character of this building every time a new investor moves in."

  "But you used a mechanism that breaks the machine," Sarah said. "If you can bind the future unanimously with only a majority vote today, then Provision Two is meaningless. Any majority can declare anything immutable instantly. But if you can't, then Amendment 44 is void."

  Priya finally opened her laptop, the screen glow illuminating her worried face. "If I record the vote as passed, and a court later says it failed, I'm liable for false minutes. If I record it as failed, and Elias sues for obstruction, I'm liable for negligence. The Charter doesn't have a provision for adjudicating the validity of the Charter itself."

  "Let's vote on it," Marcus suggested. "Let's vote on whether the amendment passed."

  "Under what rule?" Sarah asked. "If we vote by majority, and the amendment passed, then Provision Three now requires unanimity for designation changes. So a majority vote on the validity of the amendment would be invalid. If we vote by unanimity, and the amendment failed, then we're using a threshold we didn't need, potentially validating a rule that requires less."

  Elias stood up, pacing the small room. "This is absurd. We are neighbors, not philosophers. We have a roof that leaks. We have a garden that needs weeding. We cannot live in a state of superposition."

  "Then act," Sarah said. "But know that you are acting without authority. That's the reality now. The Charter cannot settle this from within. There is no neutral rule. Provision One says majority rules, but only 'except where the charter provides otherwise.' Provision Three provides otherwise, but only if Amendment 44 is real. Whether Amendment 44 is real depends on Provision Three. It's a circle."

  Marcus looked at his hands. He thought about the water staining his ceiling. He thought about the plumber waiting for a call. If he hired the plumber under majority rule, and Sarah's faction was right, was he violating the lease? If he waited for unanimity, and Elias was right, was he being held hostage by a minority?

  "We have to proceed," Elias said, sitting back down heavily. "I am declaring Amendment 44 in effect. I will update the Charter. Priya, note the dissent in the minutes, but record the motion as carried."

  "I can't do that," Priya said softly. "I'll record that the vote was 7-5. I will record that the outcome is contested. I won't label it passed or failed."

  "Then the book is incomplete," Elias said.

  "Then the book is honest," Sarah replied.

  The meeting adjourned without approving the budget. The residents filed out into the rain, the black binder left on the table like a dormant weapon.

  In the weeks that followed, Oakwood Cooperative did not dissolve, but it changed. It became a place of cautious gestures. When the roofers came to fix the leak, Marcus collected signatures. He got seven, enough for a majority, but he waited until he had ten, unsure if the threshold had shifted. Sarah didn't stop him, but she didn't sign either, watching from her window.

  Elias updated the physical copy of the Charter in the hallway, typing out Amendment 44 in bold font. Sarah kept her own copy on her computer, where Amendment 44 remained marked 'rejected.' Neither version was destroyed. Neither was fully accepted.

  The paradox settled into the woodwork of the building. Authority had not vanished, but it had become spectral. When new residents moved in, they were handed the Charter. Some read Elias's version, some read Sarah's. They paid their dues, they painted their fences, they held their meetings. But every vote carried a quiet hesitation, a momentary pause where the residents looked at one another, wondering if the ground beneath them was solid or if they were all merely agreeing to pretend it was.

  The rules required them to govern themselves, but the rules could not agree on what they were. So they lived in the gap, maintaining the house together, bound by a contract that half of them believed had changed, and half believed had broken. They were a community united by address, divided by law, waiting for a resolution that the text could never provide. The rain continued to fall on the roof, indifferent to the threshold required to fix it.
