  I leave your second point—the worry that my own argument against closure undermines itself via deduction—for the next round, precisely because it demands a more careful unpacking of how philosophical methodology interacts with the tracking conditions. You suggest I must rely on adherence for necessary truths, and whilst I am prepared to defend the adherence clause, I should not wish to rush that defence whilst we are still clearing up the confusion regarding Vera's practical reasoning. For now, recognise that denying closure does not paralyse action; it merely refines our understanding of what knowledge is. Vera signs the log because she has true belief, and she knows P, but she does not know Q, and there is no contradiction in that position once we separate the norms of knowledge from the norms of assertion. I am stipulating, to avoid any ambiguity, that the clinic's protocol requires only true belief for signing, not knowledge, so her refusal would indeed be unnecessary, though her lack of knowledge remains.
