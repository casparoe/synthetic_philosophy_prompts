answer: |-
  This is a sophisticated debate that cuts to the core of the **meta-problem of consciousness** (a term popularized by David Chalmers). The meta-problem doesn't ask "Why is there consciousness?" but rather "Why do we *think* there's a hard problem of consciousness?"

  Both Jordan and Riley are physicalists (they likely believe consciousness is physical), but they disagree on the *mechanism* that generates the illusion of a gap. Jordan is defending the **Phenomenal Concept Strategy (PCS)**, while Riley is advocating for a **Cognitive Architecture/Introspective Model** (akin to Illusionism or Self-Model Theory).

  Here is a move-by-move breakdown of who holds the stronger position at each stage, followed by an analysis of your "missing option."

  ---

  ### Move-by-Move Analysis

  #### Move 1: Jordan's Opening (The PCS Claim)
  *   **Argument:** The "hard problem" intuition arises because phenomenal concepts (e.g., "what it's like to see red") are direct and recognitional, lacking physical descriptive content. Therefore, they seem distinct from neural concepts.
  *   **Assessment:** **Jordan is on solid ground.**
      *   **Why:** This is the standard, robust physicalist response to the hard problem (championed by philosophers like Brian Loar and David Papineau). It correctly identifies that we use two different "files" in our cognitive system to store information about the brain vs. information about experience. The "gap" is semantic, not ontological.
      *   **Weakness:** It describes *that* the concepts are different, but doesn't fully explain *why* our cognitive system is forced to use two such radically different files.

  #### Move 2: Riley's Counter (The Framing Claim)
  *   **Argument:** PCS mistakes the symptom for the cause. The real issue is **introspective framing**. Attending inward forces a first-personal mode that structurally excludes third-personal physical data (like trying to see the back of your own head).
  *   **Assessment:** **Riley gains the advantage.**
      *   **Why:** Riley identifies a structural constraint that PCS glosses over. PCS says the *concept* is special; Riley says the *access route* is special. This aligns better with cognitive science. We don't just "have" phenomenal concepts; we generate them via a specific introspective process that filters out noise (including physical data). The "back of the head" analogy is powerful: it's not that the back of the head doesn't exist, it's that the visual frame makes it inaccessible.
      *   **Strength:** This moves the debate from semantics (meanings of words) to architecture (how the brain processes info).

  #### Move 3: Jordan's Pushback (Subsumption)
  *   **Argument:** Framing is just PCS with extra steps. If the concept lacks physical content, the frame is just the delivery mechanism.
  *   **Assessment:** **Jordan is being reductionist (Weak Point).**
      *   **Why:** Jordan is trying to swallow Riley's argument whole. While concepts and frames are related, conflating them ignores causal direction. If the *frame* dictates the *concept*, then the frame is the primary cause. By calling it "just the delivery mechanism," Jordan dismisses the possibility that the mechanism itself creates the distortion. A delivery mechanism can damage the package; if so, the mechanism matters more than the package.
      *   **Verdict:** Riley wins this point on nuance. The *process* of framing is explanatorily prior to the *content* of the concept.

  #### Move 4: Riley's Thought Experiment (Frame-Neutral Observer)
  *   **Argument:** Imagine a system that reports internal states without first- or third-person framing. If it doesn't generate the hard-problem intuition, then framing is the causal variable.
  *   **Assessment:** **Riley wins on methodology.**
      *   **Why:** This is a classic philosophical isolation of variables. Riley is asking: "Is the intuition necessary, or is it contingent on the frame?" If the intuition disappears when the frame changes, the frame is the cause. This is a valid predictive model.
      *   **Strength:** It shifts the burden of proof to Jordan to explain why the frame *couldn't* be the variable.

  #### Move 5: Jordan's Objection (Science-Fiction Biology)
  *   **Argument:** That's science-fiction biology. You can't dissolve a real philosophical problem by inventing imaginary creatures.
  *   **Assessment:** **Jordan loses this point decisively.**
      *   **Why:** This is a methodological error. Philosophy of mind *runs* on thought experiments (Philosophical Zombies, Mary's Room, Swampman). Dismissing a coherence argument because the entity is "imaginary" undermines the very tools Jordan uses to defend PCS. The point isn't whether the creature exists, but whether the *concept* is coherent. If a frame-neutral observer is conceptually possible, the intuition is contingent, not necessary.
      *   **Verdict:** Jordan is digging in defensively rather than engaging the logic.

  #### Move 6: Riley's Closing (Conceptual Coherence)
  *   **Argument:** Conceptual coherence is enough. The framing account predicts that altering the frame dissolves the intuition. This is distinct from swapping concepts.
  *   **Assessment:** **Riley closes strong.**
      *   **Why:** Riley clarifies that this is a claim about cognitive architecture, not biology. The prediction is: Change the mode of access $\rightarrow$ Change the intuition. This is a falsifiable claim about the meta-problem. Jordan has no equivalent prediction other than "concepts will always be distinct."

  ---

  ### The Missing Option: Are They the Same Thing at Different Levels?

  You asked if framing and phenomenal concepts are actually the same thing explained at different levels. **Yes, this is likely the most accurate synthesis.**

  Here is how you can mediate the dispute:

  **1. The Static vs. Dynamic Distinction**
  *   **Jordan (Static/Semantic):** Is looking at the **snapshot**. A "Phenomenal Concept" is the stored representation. It is the *result* of the cognitive process.
  *   **Riley (Dynamic/Process):** Is looking at the **video**. "Introspective Framing" is the *process* of generating that representation.

  **2. The Synthesis: "Frozen Frames"**
  You can argue that a **Phenomenal Concept is simply a "frozen" Introspective Frame.**
  *   When you introspect, you engage a specific neural routing (Riley's Frame).
  *   That routing creates a representation that lacks physical data (Jordan's Concept).
  *   Therefore, Jordan is right that the *concept* creates the intuition, but Riley is right that the *frame* creates the concept.

  **3. Why the Distinction Matters**
  Even if they are two levels of the same thing, **Riley's level is more useful for solving the meta-problem.**
  *   If you only focus on Jordan's level (Concepts), you end up saying, "Well, that's just how our concepts are." It's a dead end.
  *   If you focus on Riley's level (Framing), you can ask evolutionary questions: *Why did we evolve a framing mechanism that screens out physical data?* (Answer: Perhaps for rapid, egocentric decision-making). This offers a causal explanation for the meta-problem, whereas Jordan only offers a descriptive one.

  ### Final Verdict

  *   **On the specific arguments:** **Riley is winning.** Riley successfully identifies that Jordan's PCS is a description of the *state* of the system, while Framing is a description of the *function* of the system. Riley also correctly defends the use of thought experiments, whereas Jordan falters there.
  *   **On the big picture:** They are describing the same cognitive architecture. Jordan is describing the **data structure** (Phenomenal Concept), and Riley is describing the **interface** (Introspective Frame).
  *   **The Takeaway:** You cannot have the data structure without the interface. However, Riley is right that the *interface* is what generates the user-error (the Hard Problem intuition). If you want to solve the meta-problem, you have to explain the interface (Riley), not just catalog the data files (Jordan).

  **Suggestion for your group:** Propose that Jordan is describing the **representational vehicle**, while Riley is describing the **computational process**. The "Hard Problem" intuition is a bug generated by the process (Riley) that gets saved into the vehicle (Jordan). To fix the bug, you have to understand the process.
