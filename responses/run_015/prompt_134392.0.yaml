          1.  Introduction (Contextualize the Meta-Problem).
          2.  Move-by-Move Breakdown (Who wins the point and why).
          3.  The Synthesis (The "Missing Option").
          4.  Conclusion (Who likely has the stronger overall position).

      *   *Refining the "Who is Right" assessment:* In philosophy, "right" is tricky. I need to frame it as "who has the stronger argument/coherence" rather than objective truth.
      *   *Key Distinction:* PCS is usually about *semantics* (meaning). Framing is about *cognitive architecture* (process). The meta-problem allows for both, but Riley's critique suggests PCS is incomplete without the architectural story.

      *(Self-Correction during drafting)*: I need to make sure I don't validate Illusionism as *the* truth, but rather as the framework Riley is implicitly using. Jordan is defending a standard Physicalist/Type-B Materialist view. The Meta-Problem is neutral ground where both fight.
      *   *Correction on Move 5:* Jordan's dismissal of thought experiments is indeed weak, but I should acknowledge *why* he might feel that way (naturalism). Still, in this context, it's a loss for him.
