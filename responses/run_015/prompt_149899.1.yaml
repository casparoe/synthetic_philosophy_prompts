  both modes ran. now we have Agent-T and Agent-C. both claim her unfinished NSF grant obligations, both want access to her lab notebooks, and her estate is split down the middle. the board needs a formal memo for thursday's meeting recommending to the provost which agent (if either) should be recognized as the legitimate research successor for grant and IP purposes.

  please draft the memo with these sections in this order and about these lengths:

  - Executive Summary (~150 words)
  - The case for Mode-T / strict identity (~200 words)
  - The case for Mode-C / counterpart admission (~200 words)
  - The strongest steelman of the losing side (~150 words)
  - Verdict with concrete recommendation and timeline (~150 words)

