  8.  *(Self-Correction during drafting)*: I need to be careful not to attribute views to Dennett that he might have refined. Stick to the core "Center of Narrative Gravity" argument from *Consciousness Explained* and *The Self as a Center of Narrative Gravity* (1992). The key is the analogy to the center of gravity. A center of gravity is not a physical part, but it is objectively determinable and causally relevant in explanations.

