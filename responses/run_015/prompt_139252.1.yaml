answer: |-
  This is an exceptionally clean reconstruction of the "inefficacy objection" to individual consumer ethics (a la Alston, Nefsky, and early Singer). You have correctly identified that the argument is valid; the tension lies entirely in the plausibility of the conclusion (7) given the reality of the harm.

  You have also correctly diagnosed why the "Expected Difference" repair fails. It collapses morality into epistemology (the informed manager is exculpated) and allows for strategic immorality (timing purchases to maximize known harm). Furthermore, as you noted, it cannot handle the plant worker case, where the causal chain is even more rigidly fixed than the market orders.

  Since you wish to retain (2) (the counterfactual test for harm) and (3) (the empirical claim about lumpiness/thresholds), you are logically forced to reject (1) (the Difference Principle). You cannot hold that an act is objectionable *only if* it makes a specific creature worse off, because (2) and (3) jointly prove that many objectionable acts do not make specific creatures worse off.

  Here is the pricing of the three standard responses, followed by a recommendation on how to handle the quantifier shift and the specific constraints you raised.

  ### 1. Pricing the Three Responses

  #### A. Expected-Difference Consequentialism (The Repair You Attempted)
  *   **The View:** Moral weight is determined by *expected* utility (Probability of Pivotality $\times$ Magnitude of Impact).
  *   **What it Concedes:** It concedes that actual causal impact is not required, but insists that *probabilistic* causal impact is. It retains the consequentialist structure of (1).
  *   **What it Must Explain Away:**
      *   **The Informed Manager:** As you noted, this view implies the logistics manager who *knows* the batch is full has zero obligation not to order more, whereas the ignorant shopper does. This makes moral obligation depend on ignorance, which is counterintuitive.
      *   **The Plant Worker:** It cannot condemn the worker on a fixed quota. If the birds die regardless of which specific human moves the knife, the worker's expected difference is zero.
      *   **Moral Luck:** It makes the moral status of two identical acts depend on external facts about inventory levels unknown to the agent.
  *   **Verdict:** **High Cost.** It saves consequentialism but sacrifices the intuition that knowing participation in harm is worse than ignorant participation, and it fails to capture the wrongness of direct participation (the worker).

  #### B. Group-Act / Threshold View
  *   **The View:** The primary moral agent is the collective (the set of all shoppers/voters). The harm is caused by the group; individuals are responsible for their "fair share" of the group's action.
  *   **What it Concedes:** It concedes that individual counterfactuals are the wrong metric for responsibility. It shifts the locus of agency.
  *   **What it Must Explain Away:**
      *   **The Non-Identity of the Group:** It must explain how "the group" acts when there is no coordination. If I stop buying chicken but you don't, the group act continues. Am I responsible for the group act I tried to opt out of?
      *   **Individual Guidance:** It struggles to tell *me* what to do *now*. If the threshold isn't met without me, my abstinence is futile. If it is met with me, my abstinence is futile. The "fair share" logic works for costs (taxes), but is murky for abstention from harm.
      *   **The Plant Worker:** It handles the worker better than Expected Difference (the killing is a joint enterprise), but still struggles to pinpoint why *this* worker is blameworthy if the killing happens regardless of their specific stint.
  *   **Verdict:** **Medium Cost.** It solves the aggregate paradox (7) but risks dissolving individual responsibility entirely ("The system did it, not me").

  #### C. Complicity / Participation View (Recommended)
  *   **The View:** An act is objectionable if it constitutes participation in a wrongful practice or structure, regardless of whether it is causally pivotal to a specific outcome. This rejects (1) directly.
  *   **What it Concedes:** It abandons pure outcome-based consequentialism. It admits that you can do wrong without making the world worse (in terms of specific outcomes). It relies on a deontological or virtue-ethical constraint: "Do not join in evil."
  *   **What it Must Explain Away:**
      *   **Over-demandingness:** If I buy a shirt made with exploitative labor, am I complicit even if my purchase didn't sustain the factory? This view says yes. You must argue why this isn't paralyzing.
      *   **The Vote/Petrol Constraint:** This view treats the voter, the petrol buyer, and the chicken buyer similarly. All are participating in structures that produce harm. You must argue that this is a *feature*, not a bug, or find a principled distinction in the *nature* of the participation (see below).
      *   **The "Clean Hands" Problem:** It implies that in a deeply unjust world, almost everyone is morally tainted.
  *   **Verdict:** **Lowest Cost for Your Constraints.** It preserves (2) and (3), handles the Plant Worker case robustly (the worker participates in killing, full stop), and explains why the Manager is not exculpated (she knowingly facilitates the practice).

  ### 2. The Quantifier Shift and the Recursive Worry

  You asked whether the tension between (5) ("No link makes a difference") and (7) ("The chain made all the difference") is a contradiction.

  It is **not a contradiction**; it is a **Fallacy of Composition**.
  *   *True:* For every link $x$, $x$ is not strong enough to hold the weight alone.
  *   *True:* The chain holds the weight.
  *   *False:* Therefore, the chain's holding the weight is mysterious.

  The moral parallel:
  *   *True:* For every purchase $x$, $x$ does not cause a bird's death (given lumpiness).
  *   *True:* The set of purchases $\{x\}$ causes the birds' deaths.
  *   *False:* Therefore, no purchase is morally objectionable.

  The error is in Premise (1). (1) assumes that individual moral objectionability *supervenes* on individual causal difference-making. If you reject (1), you can accept the truth of (5) while denying (5) $\to$ (7). You can say: "It is true that I made no difference to the number of birds, but it is also true that I am morally tainted because I joined a practice that kills birds."

  **The Cost of This Move:** You must articulate *why* participation matters if consequences don't. The standard answer is **Integrity** or **Complicity**. By buying the chicken, you make yourself an agent of the industry. You align your will with the harm. Even if your specific contribution didn't tip the scale, you have validated the demand.

  ### 3. Handling the Plant Worker and the Vote (Your Constraints)

  **The Plant Worker:**
  The Complicity view handles this best. The worker's quota is fixed, so (2) says they make no counterfactual difference to the *number* of birds. But (1) is rejected. The worker is objectionable not because they changed the outcome, but because they performed the killing.
  *   *Distinction from Shopper:* The shopper is *remotely* complicit (funding); the worker is *directly* complicit (executing). Both are objectionable, but perhaps to different degrees. This satisfies your desire to explain the difference without touching (2) or (3).

  **The Vote and The Petrol:**
  You requested the view treat these similarly unless there is a principled distinction.
  *   **Similarity:** Under the Complicity view, voting for a warmonger (in a landslide) and buying petrol (in a carbon-intensive grid) are both acts of participation in a harmful structure. You are not causally pivotal, but you are a participant.
  *   **Principled Distinction:** If you need to distinguish them, the metric is **Proximity to Harm**.
      *   *Chicken:* The harm (killing) is the *purpose* of the transaction.
      *   *Petrol:* The harm (emissions) is a *side effect* of the transaction.
      *   *Vote:* The harm (policy) is an *authorized outcome* of the transaction.
      *   *Recommendation:* For the purposes of your paper, treat them as **structurally identical** regarding the inefficacy objection. This strengthens your argument: if the logic exculpates the chicken shopper, it exculpates the voter in a genocide. Since we intuitively feel the voter is not fully exculpated, the logic must be flawed. The flaw is (1).

  ### 4. Summary of Recommendations for the Paper

  1.  **Reject Premise (1).** This is the only move that allows you to keep (2) and (3) while avoiding the absurd conclusion.
  2.  **Replace (1) with a Participation Principle.** "An act is morally objectionable if it constitutes voluntary participation in a practice that is harmful, regardless of marginal causal impact."
  3.  **Address the Cost.** Acknowledge that this moves you away from simple consequentialism. You are now arguing that morality is partly about the *character of the agent* (one who joins in killing) and not just the *state of the world* (number of birds).
  4.  **Resolve the Recursive Worry.** Explicitly name the Fallacy of Composition. The chain causes the harm; the links are responsible because they are essential constituents of the chain, not because they are pivotal.
  5.  **Handle the Worker.** Use the worker to demonstrate why Expected Difference fails. The worker is the "canary in the coal mine" for this argument. If the argument exculpates the person holding the knife, the argument is broken.
  6.  **Generalize.** Apply the Participation Principle to the vote and petrol. Argue that this is a consistent result: we *are* collectively responsible for structural evils even when individually non-pivotal. This is a feature of political morality, not a bug.

  **Final Note on the "Quiet Contradiction":**
  You asked if (5) and (7) are a contradiction. They are consistent claims about *causation*. The contradiction arises only when you add the moral premise (1). By diagnosing (1) as the failure point, you dissolve the paradox without denying the empirical reality of lumpiness or the logical validity of counterfactuals. You are buying a more complex moral ontology (one that includes complicity) to save the phenomenon of moral responsibility. That is a worthwhile purchase.
