      *Refining the "Missing Issue":* While Tanha/Chanda is the technical fix, the *philosophical* issue is **The Normative Status of Agency.** Is agency something to be perfected (Move 3) or extinguished (Move 4)? If agency is intrinsically valuable, Tranquilism fails. If agency is intrinsically suspect, Tranquilism wins. But the *missing* piece is defining the boundary where agency becomes craving.

