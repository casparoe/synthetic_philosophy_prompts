  I am applying for a one-year dissertation fellowship and need a two-page proposal. My half-formed idea concerns workfare, benefit fraud, and conditionality: the standard debate treats the "undeserving poor" as a static moral category—someone either complies with conditions or fails them at a given moment—but it misses a temporal mechanism built into administrative systems. Conditional welfare generates records that accumulate over time, so temporary non-compliance (a missed appointment, a documentation error, a brief job-search lapse) gets converted into a predictive profile that justifies deeper exclusion or permanent disqualification. I want to ask whether this creates a conceptually distinct category—call it the "structurally undeserving"—whose undeservingness is not a discrete moral failure but an emergent property of the tracking architecture itself, and whether that undermines the common defense that conditionality is compatible with respect for persons.

  Turn this into a proposal with: a precise statement of the philosophical question; why both incentive-based justifications and desert-based critiques leave it open; the method (conceptual analysis of how temporal records function in administrative justice, with structured comparison to analogous tracking regimes such as probation or credit scoring, to isolate what is contingent design versus necessary feature); what a useful result would look like (a framework for evaluating whether a given welfare design respects temporal autonomy or necessarily manufactures structural undeservingness); what would count as the project failing (e.g., if the temporal transformation collapses into ordinary repeated moral failure, or if every tracking system inevitably produces the same result); and an honest assessment of scope for a one-year philosophy dissertation chapter. Do not include a bibliography or citation requests—I will supply those. Write the proposal so that its conceptual framing is specific enough to avoid generic summaries of the welfare-state literature.
