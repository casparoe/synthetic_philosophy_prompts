answer: |-
  Good morning. Welcome to this colloquium honoring the life and work of Dr. Elena Voss.

  Looking around this room, I see the full spectrum of Elena's intellectual and personal world. I see her former doctoral students, now philosophers in your own right. I see the neuroscientists with whom she debated, collaborated, and sometimes drank coffee until 3:00 AM. And I see her family—her siblings, her nieces and nephews, her partners in life—who knew her not as a theorist of mind, but as a listener, a storyteller, and a friend.

  It is a delicate task to speak for ten minutes that does justice to both the rigor of her thought and the warmth of her presence. Often, at memorials, we separate the two. We offer personal anecdotes for the family and technical summaries for the specialists. But Elena would have rejected that division. She believed that how we think about consciousness determines how we value human life. So, I intend to do some philosophical work today. I want to explain, as clearly as I can, the central move of her career. Because to understand why she argued that "qualia" is an incoherent concept is to understand why she cared so deeply about the reality of experience.

  For thirty years, Elena held a position that often frustrated her interlocutors. She insisted that phenomenal consciousness is undeniably real. She never doubted that pain hurts, that red looks vivid, or that grief weighs heavy. But she argued with equal force that the theoretical posit we use to explain these things—the "quale," the intrinsic, private property of experience—is structurally broken. She called this strategy "quining" the concept, in the spirit of earlier arguments, but she developed it into a distinct tool for clearing conceptual underbrush.

  To the family members here: I know this sounds abstract. Let me try to ground it.

  Elena believed that when we ask, "What is it like to be you?" we are accidentally making a category error. We tend to treat "what it is like" as if it were a *thing* that you possess. We imagine that inside you, there is a specific quality of "redness" or "painfulness" that belongs only to you, locked away from the rest of the world.

  Elena argued that this picture creates a contradiction. On one hand, we say these experiences are private—that only you can know your pain. On the other hand, we talk about them as if they are comparable—that my "red" is similar enough to your "red" that we can discuss a stoplight. If they are truly private, we cannot compare them. If we can compare them, they are not truly private in the way the theory demands.

  Furthermore, we treat these properties as causally inert. In physics, every effect has a physical cause. If "qualia" are non-physical private objects, they shouldn't be able to push atoms around. Yet, we scream when we are hurt. We act based on our experiences. So, are these properties causally powerless, or do they drive our behavior? Elena showed that the concept of qualia demands they be both: inert enough to fit outside physics, yet potent enough to explain why we run from fire. She argued that a concept that requires such a contradiction cannot stand.

  Now, to her former students and the scientists here: You know that this position is often misread. I must be precise on this point, because Elena was precise on it.

  She was not an illusionist. She did not claim that consciousness is an illusion. She did not claim that the difference between seeing red and seeing blue is a trick of the brain. She denied that experience is an illusion with the same vigor that she denied that qualia are real. Her point was ontological, not phenomenological. She taught us that we can acknowledge the reality of the *process* of experiencing without reifying the *object* of experience.

  This is why her work matters for scientific practice. For decades, the study of consciousness was stalled by the search for the "neural correlate of the quale." Scientists were asked to find the specific brain state that matches the private, ineffable redness. Elena argued that this was a wild goose chase, not because the brain activity isn't there, but because the "private redness" it is supposed to match is a grammatical fiction.

  By quining qualia, she did not reduce consciousness to mere neural correlation. Instead, she cleared space for an interdisciplinary study that treats consciousness as a public, functional capacity. She invited neuroscientists to study how organisms discriminate, report, and react to stimuli without the burden of explaining how a physical brain generates a non-physical ghost. She freed the scientists to study the mechanisms of awareness without having to solve a metaphysical puzzle that she proved was unsolvable by design.

  But why does this matter for remembrance? Why does this matter for us, standing here today?

  If Elena is right, then honoring her does not mean trying to access some private, inner essence of who she was that is now lost to us. We often comfort ourselves with the idea that a person's true self was a private light that has now gone out. Elena's philosophy suggests something more robust, and perhaps more comforting in its own way.

  She taught that our experiences are not locked away in private theaters. They are constituted by our relations, our reactions, and our shared forms of life. The "Elena" we are honoring is not a hidden object that we can no longer reach. She is present in the arguments she shaped, in the students she guided, in the collaborations she fostered, and in the love she gave to this family. Her consciousness was not a sealed room; it was a way of engaging with the world.

  To say that qualia are incoherent is not to say that her joy was fake or her suffering was meaningless. It is to say that these things were real precisely because they were enacted in the world, not because they were hidden inside her. Her grief, her curiosity, her patience—these were not private possessions. They were public facts, woven into the fabric of our shared history.

  This is the legacy I hope we carry forward. For the philosophers in the room: Continue to scrutinize the grammar of our concepts. Do not accept a contradiction just because it feels intuitive. If a theory requires a property to be both knowable and unknowable, the theory must yield, not the reality.

  For the scientists: Pursue the mechanisms of mind without fear that you are leaving something out. You are not ignoring the "hard problem" by dissolving it; you are respecting the integrity of the physical world while taking the phenomenon of life seriously.

  And for her family: Know that her work was never an attempt to distance herself from the world. It was an attempt to understand how deeply we are already in it. She rejected the idea that we are isolated spectators trapped behind our eyes. She believed we are participants.

  There is a profound humility in Elena's view. It asks us to admit that one of our most familiar concepts—the idea of a private, inner quality—does not survive careful scrutiny. It is rare for a thinker to spend a lifetime demonstrating that a question we all ask is based on a mistake. But it is an act of love. She wanted us to stop looking for the ghost in the machine so that we could finally attend to the machine itself, and to each other, with clarity.

  We honor Elena Voss not by preserving her conclusions as dogma, but by using the space she cleared. She removed the barrier of the "inexplicable quale" so that we could meet one another in the explicable, shared reality of human experience.

  She is not here to answer our questions. But she has left us with better tools to ask them. Let us use them. Let us think clearly, let us study rigorously, and let us remember that the reality of a life is found not in what is hidden, but in what is lived.

  Thank you.
