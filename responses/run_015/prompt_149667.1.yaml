  **Scenario**
  Administrator Alex at Metro General must decide whether to activate Strict Antibiotic Stewardship (SAS), a costly protocol that restricts prescriptions. The hospital's digital dashboard flags SAS as "Available" only when local resistance metrics exceed a noisy, latent threshold associated with a virulent "Super-Strain" that drastically increases mortality regardless of treatment; historically, activating SAS is 95% correlated with harboring the Super-Strain (bad news), though SAS causally reduces mortality by 10% if active. Simultaneously, Metro uses the same administrative algorithm as partner hospital Northside; if Metro's algorithm outputs "Activate," Northside's identical code logically must also output "Activate," triggering a regional herd-immunity bonus that further reduces mortality, though there is no causal communication between them.

  **Reasoning Walkthrough**
  *   **Causal Decision Theory (CDT):** Alex conditions on the current state indicated by the dashboard (likely Super-Strain). She treats the strain presence as fixed fact. She calculates that *given* this state, activating SAS causally prevents more deaths than it costs in administrative burden. The regional bonus is ignored as she cannot causally influence Northside. **Verdict: Approve.**
  *   **Evidential Decision Theory (EDT):** Alex conditions on the *act* itself. Choosing "Approve" is strong evidence (95% probability) that the Super-Strain is present, which implies high mortality regardless of the protocol. Choosing "Don't Approve" is evidence that the hospital is likely Strain-free (low mortality, no cost). Because the bad news of confirming the Super-Strain outweighs the marginal causal benefit of SAS in the expected utility calculation, EDT recommends avoiding the act that signals the high-risk state. **Verdict: Do Not Approve.**
  *   **Updateless Decision Theory (UDT):** Alex evaluates the decision algorithm from behind a "veil of ignorance" regarding her specific indexical location, treating the dashboard data as an input to the algorithm rather than evidence to update on. She recognizes that her algorithm's output is logically correlated with Northside's identical code (a setup akin to **program equilibrium**). Therefore, "Approve" logically entails "Northside Approves," unlocking the regional herd-immunity bonus. This logical counterfactual dependence adds sufficient utility to outweigh both the costs and the evidential bad news. **Verdict: Approve.**

  **Analysis of Weighted Features**
  The feature carrying the weight for the CDT/UDT vs. EDT split is the **treatment of indexical evidence**. EDT treats the decision as a diagnostic test for the Super-Strain, penalizing the act for correlating with a bad state. CDT and UDT treat the state as either fixed (CDT) or irrelevant to the policy evaluation (UDT). The feature carrying the weight for the UDT vs. CDT distinction is the **logical correlation**. CDT sees the partner hospital as causally isolated; UDT sees it as logically bound. Without the logical correlation (e.g., if Northside used different software), UDT would lose the regional bonus utility. If we assume UDT takes the dashboard data as an input (standard formalization), it would still approve based on local causal benefits, effectively collapsing toward CDT's verdict though via a different formalism (policy selection vs. causal intervention). However, if UDT were strictly updateless on the *observation* itself (ignoring the dashboard), it might recommend "Don't Approve" based on prior averages, dissenting from CDT; but standard UDT allows observations as inputs, so it converges with CDT on the local action once the logical link is removed.

  **EDT Defense and Critique**
  An EDT defender would attack the **evidential link**, arguing that the dashboard metrics **screen off** the correlation. Once Alex sees the resistance metrics, the act of approving adds no new information about the Super-Strain; the probability of the strain is fixed by the data, not the decision. If the correlation is screened off, EDT converges with CDT. However, if the metrics are noisy and the *decision* confirms the interpretation of those metrics (as specified in the scenario), the evidential link holds.

  **Epistemic Status**
  It is well-settled that CDT is the standard for causal inference and EDT for diagnostic reasoning in statistics. It is **genuinely contested** whether logical correlations (as used by UDT) are normative for decision-making. Many philosophers reject UDT's claim that logical counterfactuals constrain rational choice, viewing it as a confusion of logic with causation (the "Newcomb problem" remains unresolved consensus-wise). Program equilibrium clarifies how algorithms correlate, but whether rational agents *should* act to maximize across logical instances rather than causal consequences is a live debate in formal epistemology.
