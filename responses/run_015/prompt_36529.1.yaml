      *   *Check:* Is the tone appropriate?
      *   *Correction:* Keep it analytical, philosophical, and legally grounded. Avoid moralizing, focus on the presuppositions.

  9.  **Final Polish:** Organize into clear sections matching the prompt's demands. (Reconstruction, Consistency, Requirements vs. Fit, Revealed Preference, Platform Work). Ensure the distinction between *economic coercion* and *cognitive impairment* is clear.

      *(Self-Correction on the High-Earner Exemption)*: The prompt asks why it feels ethically backwards. I need to articulate that if the danger is *health*, wealth doesn't immunize you. If the danger is *coercion*, wealth does. The law seems to mix these. I should highlight that the exemption assumes wealth = autonomy, which ignores the physiological reality of fatigue.

  10. **Final Review against constraints:**
      *   Reconstruct implicit view? Yes.
      *   Consistency check? Yes.
      *   Require vs. Fit? Yes.
      *   Revealed preference counterfactual? Yes.
      *   Platform work application? Yes.

