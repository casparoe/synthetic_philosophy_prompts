answer: |-
  The cluster of practices you describe—*karoshi* compensation, statutory hour caps, non-waivable overtime premiums, and the high-earner exemption, contrasted with the validity of consent in high-risk leisure—presupposes a specific, hybrid theory of labor consent. It is neither purely libertarian (freedom of contract) nor purely paternalistic (state knows best).

  Here is a reconstruction of the implicit view, an analysis of its internal tensions, and an assessment of its implications.

  ### 1. Reconstructing the Implicit View: "Structural Voluntariness"

  The legal systems you cite operate on a theory of **Structural Voluntariness**. This theory holds that consent in the employment relationship is distinct from consent in civil or leisure contexts because it occurs within a hierarchy of subordination and economic necessity.

  This view rests on three pillars:

  *   **The Subordination Principle:** An employee is not a counterparty to a commercial exchange but a subordinate within an organization. Because the employer controls the environment, pace, and culture, the employer bears a non-delegable duty of care. *Karoshi* compensation reflects this: even if the worker "chose" to stay late, the employer created the conditions where that choice was the rational path to survival or advancement.
  *   **The Coercion Gradient:** Consent is vitiated by economic necessity, but this vitiation is not binary. It is a gradient correlated with bargaining power. The high-earner exemption in Japan is not an assertion that rich people don't get tired; it is a proxy for **autonomy**. The law assumes high earners have sufficient "exit power" (savings, employability) and "voice power" (negotiating leverage) to render their consent to overtime structurally voluntary, whereas ordinary workers are structurally coerced by the threat of job loss.
  *   **The Epistemic Instability of Fatigue:** Unlike boxing or fishing, where the risk is immediate and the decision to participate is made *ex ante* with full faculties, overwork risk is cumulative and insidious. Fatigue degrades the very cognitive capacity required to assess risk and withdraw consent. Therefore, consent to open-ended hours is **self-undermining**. You cannot validly consent to a state of exhaustion that prevents you from revoking that consent.

  **Why the Boxing Contrast?**
  The law distinguishes between **sovereign risk** and **subordinate risk**.
  *   **Boxing/Fishing:** These are treated as sovereign activities. The risk is the *point* of the activity (sport) or an accepted inherent feature of a trade (fishing) entered into with specific knowledge. The state treats the adult body as property the owner may risk in leisure or high-risk trades.
  *   **Overwork:** This is treated as a subordinate demand. The risk is a byproduct of economic production, not the activity's purpose. Because the worker is subordinate, the state assumes the risk is imposed by the structure, not chosen by the individual.

  ### 2. Consistency Check: *Karoshi* vs. Hour Caps

  Are *karoshi* compensation and hour caps consistent? **Mostly, but the high-earner exemption creates a philosophical fracture.**

  *   **The Consistency:** Both *karoshi* recognition and hour caps rely on the **Subordination Principle**. *Karoshi* compensation says, "If the work killed you, the structure is at fault, regardless of your nominal agreement." Hour caps say, "You cannot agree to this structure in advance." They are retrospective and prospective applications of the same duty of care.
  *   **The Friction:** The high-earner exemption reveals a conflict between the **Coercion Gradient** and the **Epistemic Instability** theories.
      *   If the justification for caps is *fatigue* (Epistemic Instability), the exemption is incoherent. A high-earning lawyer suffers the same physiological stroke risk from 100-hour weeks as a low-wage coder. Wealth does not immunize the cardiovascular system.
      *   If the justification is *coercion* (Coercion Gradient), the exemption makes sense. High earners are presumed less coerced.
      *   **The Ethical Backwards Feeling:** You noted the exemption feels ethically backwards. This is because the law prioritizes the *economic* theory of consent over the *biological* theory of harm. It implies that a rich person's consent is more "real" than a poor person's, even if the biological consequence (death) is identical. It treats labor law as a protection of the *weak* rather than a regulation of *hazard*.

  ### 3. Requirements vs. Fit

  To understand how rigid this view is, we must distinguish what the practices strictly *require* from what merely *fits well* with them.

  *   **Strictly Required:**
      1.  **Non-Waivability:** Core safety standards (max hours, rest periods) cannot be contracted away by ordinary workers. If they could be waived, the duty of care would be nullified.
      2.  **Employer Liability:** Harm resulting from excess hours must be attributable to the employer, not the worker's "lifestyle choice."
      3.  **Distinction from Leisure:** Employment risk must be legally categorized differently from leisure risk.

  *   **Merely Fits Well With:**
      1.  **The Income Threshold:** The specific salary level for the high-earner exemption is arbitrary. It fits the *Coercion Gradient* theory, but the system could equally use tenure, union representation, or job title as the proxy for autonomy.
      2.  **The 35-Hour Limit:** The specific number is political, not philosophical. A 40-hour cap would presuppose the same view of voluntariness.
      3.  **Right to Disconnect:** This is a technological update to the rest period. It fits the view but isn't strictly required if other mechanisms ensured rest.

  ### 4. The Revealed-Preference Counterfactual

  If we replaced Structural Voluntariness with a **Revealed-Preference View** (workers' actual choices are taken at face value as rational maximizations of utility), the legal landscape would collapse into standard contract law.

  *   **Abolition of Caps:** Hour limits would be viewed as anti-competitive restrictions on labor supply. If a worker chooses 60 hours, they value the income more than the leisure/health.
  *   **Waivers:** Employees could sign "Assumption of Risk" waivers for overtime. *Karoshi* claims would be denied based on contributory negligence or voluntary assumption of risk.
  *   **Overtime Premiums:** These would be negotiable. A worker might trade overtime pay for more base leave, or vice versa.
  *   **The Consequence:** This shifts the burden of health entirely to the individual. It assumes a market for safety where none effectively exists (because individual workers cannot price the systemic risk of burnout accurately). It would likely increase aggregate hours worked, lower labor costs for employers, and increase long-term public health costs (the third-party harm you noted).

  ### 5. Application to Platform Work

  Does the implicit view have anything determinate to say about platform work (Uber, DoorDash, etc.)? **Yes, and it is destabilizing.**

  Platform work is marketed on a Revealed-Preference picture: "You are your own boss. You choose your hours. Therefore, you bear the risk."

  However, under the **Structural Voluntariness** view, platform work fails the autonomy test for two reasons:

  1.  **Algorithmic Subordination:** Even if the worker chooses *when* to log on, the algorithm dictates the *pace*, the *route*, and the *pay rate*. If the pay rate is set such that a living wage requires 60 hours of active time, the "choice" to work 60 hours is structurally coerced, indistinguishable from the ordinary worker in the Japanese model.
  2.  **The Illusion of Exit:** The high-earner exemption relies on the ability to say "no." Platform workers often lack the bargaining power to negotiate rates. If the "choice" is "work these hours at this rate or don't work," the Structural Voluntariness view classifies this as coercion, not consent.

  **The Determinate Conclusion:**
  If the legal system remains consistent with its presuppositions in Japan and France, it must **reclassify platform workers** or create a **third category of labor**. It cannot accept the "independent contractor" label at face value if the algorithmic management recreates the subordination and coercive pressure of traditional employment. The "free choice of hours" sales pitch is irrelevant if the economic structure vitiates the voluntariness of that choice.

  ### Summary

  The implicit view is that **labor consent is structurally compromised by subordination and economic necessity, and physiologically compromised by cumulative fatigue.**

  *   **Consistency:** It is internally consistent regarding ordinary workers (caps + compensation) but inconsistent regarding high earners (prioritizing economic autonomy over biological reality).
  *   **Boxing Contrast:** It distinguishes between sovereign risk (leisure/high-risk trades) and subordinate risk (standard employment).
  *   **Platform Work:** The view demands that platform work be regulated as employment if algorithmic control replicates subordination, regardless of the "flexibility" marketing.

  The system essentially argues that there are some things a human being cannot validly sell, even to themselves, when the buyer holds the power of economic survival. The high-earner exemption is the crack in the armor where the law admits it is really protecting the *powerless*, not the *human*.
