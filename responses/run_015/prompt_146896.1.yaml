answer: |-
  1. The standard case (why sunk costs should never matter)

  The standard economic argument is ruthless but clear: rational agents maximize future utility, not past recovery. Once resources are spent, they are gone; no decision today can retrieve them. To let past investment dictate future action is to compound error with inertia. If a career path no longer yields satisfaction or income, pouring more life into it because you already poured five years in is mathematically indefensible. It treats irrecoverable losses as leverage, which they are not. This view treats human life as a portfolio of assets: if a stock tanks, you sell to reinvest elsewhere, regardless of purchase price. Honoring sunk costs here is merely emotional inertia masquerading as loyalty. It assumes the past has a claim on the future simply by existing, which rationality denies. The money is gone. The time is spent. Only what remains is yours to allocate. Rationality demands forward-looking clarity, not backward-looking grief.

  2. The constitutive-cost counter-case (where honoring them might be rational or required)

  However, this model fails when investments are not merely instrumental but constitutive. Some costs build the very platform upon which future value stands. A five-year career isn't just time spent; it is a web of relationships, a developed identity, and a set of promises made to colleagues and mentors. These are not past expenses; they are present structures. Abandoning them isn't neutral; it actively dismantles a social and psychological architecture that took years to erect. If rationality includes maintaining integrity and social trust, then walking away breaches contracts that aren't written but felt. Furthermore, personal identity requires narrative continuity. To treat oneself as a constantly optimizing agent is to fracture the self. Honoring the investment isn't about recovering the past, but respecting the entity the past created. If the investment generated obligations or a specific kind of self that values commitment, then ignoring those costs damages the current agent. The cost isn't sunk; it's embedded in who you are now. When investment creates dependency or trust in others, withdrawal inflicts harm unrelated to the original cost. This transforms the calculation from loss avoidance to duty fulfillment. You are not paying for the past; you are maintaining the present.

  3. The line between them — how to tell instrumental from constitutive in practice

  So where is the line? It lies in whether the investment created independent value or merely expended resources. Instrumental costs are fuel burned to move; constitutive costs are the engine built along the way. Ask: Does leaving destroy something that currently exists, or does it merely stop future accumulation? If you leave a job and the skills vanish, that's instrumental. If you leave and colleagues lose a trusted partner or you betray a committed identity, that's constitutive. The test is whether the "cost" has transformed into a current obligation or asset. If staying is only about justifying the past expenditure, it's a fallacy. If staying is about honoring a present relationship or identity forged by that expenditure, it's rational. Don't ask what you spent; ask what exists now because you spent it. If nothing exists but the memory of spending, walk away. Constitutive costs demand maintenance; instrumental costs demand efficiency.

  4. Verdict — apply it to my situation or to the general principle, and say clearly where you land

  My position is definite: honoring sunk costs is irrational unless they have transmuted into constitutive obligations. The standard view is the default rule, but your intuition identifies a crucial exception. In your situation, you must audit whether your five years created binding relationships or an identity that collapsing would harm. If this career was merely a transactional ladder, leaving was rational; the money and time are gone, and staying would have been the true fallacy. But if you were a keystone in a team or vowed to see a project through, staying would have been moral. Most careers, however, are instrumental. Unless you left people in the lurch or betrayed a core vow, you did the right thing. Do not let the "constitutive" label become a trap for guilt. The past only matters if it built something living. If it didn't, your departure is not a breakage, but a correction.
