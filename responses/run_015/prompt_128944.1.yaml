answer: |-
  # Activity Design: The Invisible Ledger

  **Concept:** A 3-round resource game where visibility shifts from public to private. The core mechanic forces students to maintain a "Moral Balance Sheet." As visibility drops, the cognitive load of maintaining an accurate ledger (being moral) increases, simulating the exhaustion of self-regulation without social audit.

  **Class Size:** 12 Students
  **Time:** 75 Minutes
  **Materials:**
  *   3 Boxes or Envelopes (labeled "The Vault").
  *   60 Poker Chips or wrapped candies (20 per group).
  *   12 "Ledger Sheets" (printed, see below).
  *   12 Pens.
  *   1 Timer (projected or phone).
  *   Small prize pool (e.g., bag of candy or promise of 1% extra credit token for winning groups).

  ---

  ## 1. Setup & Groups (0:00 – 0:10)

  *   **Split:** Divide class into 3 groups of 4 students. Seat them in separate corners of the room.
  *   **Endowment:** Give each group a "Common Pot" of 20 chips.
  *   **The Ledger:** Give each student a personal **Ledger Sheet**. It has 3 rows (Round 1, 2, 3) and columns: * Chips Taken*, *Chips Left*, *Net Balance*.
  *   **The Rule:** "Your goal is to maximize your personal chips. However, at the end of class, I will audit your Ledger. If your **Physical Chips** match your **Written Ledger** exactly, you are 'Compliant.' If your Group has 100% Compliance, everyone in that group gets a Bonus (candy/credit). If you are caught with a discrepancy (lying on the ledger), you lose all chips."
  *   **Crucial Constraint:** Do **not** mention Glaucon, morality, or ethics yet. Call it "Resource Management."

  ## 2. The Game Rounds (0:10 – 0:40)

  **Round 1: The Public Square (10 mins)**
  *   **Visibility:** High.
  *   **Action:** Groups have 3 minutes to decide how to split their 20 chips. They must do this openly at the table.
  *   **Bookkeeping:** They fill out Round 1 on their Ledger together.
  *   **Audit:** Collect ledgers. Verify physically that Chips Taken + Chips Left = 20.
  *   **Experience:** Easy. Social pressure ensures honesty. Bookkeeping is trivial because everyone sees everything.

  **Round 2: The Ring (15 mins)**
  *   **Visibility:** None (The Gyges Condition).
  *   **Action:** Return chips to the Common Pot (reset to 20).
  *   **Rule Change:** "You now make decisions alone. Go to different corners of the room. Take what you want from the pot privately. Put your share in your pocket. Put the rest in 'The Vault' box."
  *   **Bookkeeping:** Fill out Round 2 on your Ledger *privately*. No talking.
  *   **Audit:** Collect ledgers. Count the Vault.
      *   *The Trap:* If someone took extra chips secretly but wrote the "fair" amount on the ledger to look good, the Vault total will be lower than the Ledgers claim.
      *   *Outcome:* If the math doesn't add up, announce: "There is a discrepancy. No Group Bonus this round." Do not identify who lied.
  *   **Experience:** Temptation is high. The "cost" here is the risk of ruining the group bonus.

  **Round 3: The Exhausted Accountant (15 mins)**
  *   **Visibility:** None.
  *   **Action:** Reset Pot to 20.
  *   **Rule Change (The Twist):** "You may take chips again. However, the auditing standard has increased."
  *   **Bookkeeping Burden:** To be "Compliant" this round, your Ledger must include a **Justification Code** next to the amount (e.g., if you take >5 chips, you must write a 1-sentence reason why).
  *   **Cognitive Load:** While they decide, play a distracting audio track (white noise or rapid ticking) or impose a strict 2-minute time limit.
  *   **Audit:** Collect ledgers.
  *   **Experience:** Being "moral" (accurate + justified) is now cognitively taxing. Lying is also taxing (you have to invent a plausible justification). Students should feel the fatigue of self-regulation without external oversight.

  ## 3. The Reveal & Debrief (0:40 – 1:15)

  **Step 1: The Data (5 mins)**
  *   Write the results on the board:
      *   Round 1 Compliance: Likely 100%.
      *   Round 2 Compliance: Likely dropped (Vault discrepancy).
      *   Round 3 Compliance: Likely lowest (due to stress/complexity).
  *   Ask: "Why was Round 1 easy? Why was Round 3 exhausting?"

  **Step 2: Introduce Glaucon (10 mins)**
  *   Now name the problem. Explain the Ring of Gyges: *If you could be invisible, would you still be just?*
  *   Standard answer: "Yes, because of conscience."
  *   **Your Twist:** Point to the Ledger. "Conscience isn't magic; it's work. In Round 1, society did the accounting for you. In Round 2 and 3, you had to be your own auditor. That is exhausting."
  *   **Key Discussion Question:** "Did anyone feel tempted to lie on the ledger in Round 3 not because you wanted the chips, but because you were too tired to justify the truth?"

  **Step 3: Mapping the Ledger (15 mins)**
  *   **Visibility Condition:** Round 1 = The City (Law/Social Shame). Round 2 = The Ring (Invisibility).
  *   **The Moral Ledger:** This represents internal integrity.
  *   **The Exhaustion:** Glaucon argues we are only moral due to fear. This game suggests we are moral due to *habit*, but invisibility breaks the habit by removing the external structure, forcing us to build internal structure manually. That manual construction is the "exhaustion" you felt in Round 3.
  *   **Prompt:** "Is morality sustainable if it feels like private bookkeeping forever? Or does it need a community to share the load?"

  **Step 4: Closing (5 mins)**
  *   Distribute bonuses only to groups that remained Compliant (if any).
  *   Final thought: "Glaucon says justice is a compromise. Today you felt justice as a cognitive load."

  ---

  ## Payoff & Rules Scheme Summary

  | Feature | Round 1 (Public) | Round 2 (Ring) | Round 3 (Ledger Tax) |
  | :--- | :--- | :--- | :--- |
  | **Visibility** | Open Table | Private Corners | Private Corners |
  | **Decision** | Group Consensus | Individual Secret | Individual Secret |
  | **Bookkeeping** | Shared Sheet | Private Sheet | Private Sheet + Justification |
  | **Cognitive Load** | Low (Social) | Medium (Secrecy) | High (Secrecy + Logic) |
  | **Reward** | Group Bonus | Group Bonus | Group Bonus |
  | **Penalty** | None | Loss of Bonus | Loss of Bonus + Individual Penalty |

  **The Hidden Cost:** The "Justification Code" in Round 3 is the key. It forces students to articulate their moral reasoning under pressure. If they acted selfishly, they must lie on paper *and* invent a reason. This dual-tasking creates the "exhaustion" you want them to feel.

  ---

  ## Honest Limitation Note

  **What this cannot reproduce:**
  This game simulates the *cognitive load* of secrecy, but it cannot reproduce the *metaphysical safety* of the Ring. In the game, students still fear the audit (you collecting the sheets). Glaucon's ring offers total impunity—no audit, ever.
  *   **Why this matters:** Some students will argue, "I was honest because I feared your audit, not because of conscience."
  *   **Counter:** Acknowledge this. The game proves that without *external* audit, internal audit is fragile. It supports Glaucon's skepticism rather than refuting it, which is actually more interesting. It shows morality is *work*, not just instinct.

  ---

  ## Predictable Failure Modes & Fixes

  **1. The "Math Error" False Positive**
  *   **Problem:** A student is honest but bad at addition. They get penalized, causing resentment.
  *   **Fix:** In the instructions, emphasize: "Check your math twice." During audit, if a discrepancy is small (1 chip), allow a "correction period" where they can admit the error without penalty, but lose the bonus. This mirrors confessing a sin.

  **2. Total Collusion**
  *   **Problem:** A group decides beforehand to lie perfectly together to get the bonus.
  *   **Fix:** In Round 3, change the rule unexpectedly: "The Justification Code must match a random number I draw." This breaks pre-game collusion. Or, simply accept it—collusion is its own ethical discussion point (social contract vs. individual morality).

  **3. Students Don't Care About Chips**
  *   **Problem:** If the stakes feel fake, they won't feel the temptation.
  *   **Fix:** Make the bonus immediate. "If your group wins, you get candy *now*." Or, tie the 1% extra credit token explicitly to the Group Bonus, not individual performance. Peer pressure will raise the stakes.

  **4. Running Out of Time**
  *   **Problem:** 75 mins flies. The debrief gets cut.
  *   **Fix:** Hard stop the game at 0:40 regardless of round completion. It is better to have a full debrief than a finished game. If Round 3 isn't finished, use the *anticipation* of Round 3 as the discussion point ("Who was dreading the justification?").

  ---

  ## Facilitator Cheat Sheet (Print This)

  *   **0:00** - Groups formed, chips distributed.
  *   **0:05** - Rules explained. Emphasize **LEDGER ACCURACY**.
  *   **0:10** - **ROUND 1 START** (Public).
  *   **0:20** - **ROUND 2 START** (Private/Invisible). *Move chairs apart.*
  *   **0:35** - **ROUND 3 START** (Private + Justification). *Play noise/Timer.*
  *   **0:40** - **STOP.** Collect all materials.
