      *   **Tone:** Philosophical, diagnostic, analytical.

  2.  **Deconstruct the Impasse (Strawson vs. Critics):**
      *   *Strawson's Move ("Freedom and Resentment"):* He shifts the ground from metaphysics (determinism vs. indeterminism) to psychology/social practice (reactive attitudes like resentment, gratitude, blame). He argues these attitudes are natural, non-optional features of human life. Determinism doesn't threaten them unless it introduces a "universal objective attitude" (seeing everyone as objects to be managed), which is psychologically impossible for us to sustain globally.
      *   *Incompatibilist Critique:* They argue Strawson begs the question. Just because we *feel* resentment doesn't mean it's *justified* if determinism is true. They claim reactive attitudes presuppose a "could have done otherwise" (in a libertarian sense) or basic desert that determinism rules out. Strawson describes the practice; they question its legitimacy under determinism.
      *   *Compatibilist Defense:* They argue the incompatibilist demand for "ultimate responsibility" is incoherent or unnecessary. Responsibility *just is* the susceptibility to reactive attitudes within a normative community.
      *   *The Stall:* Incompatibilists say, "You changed the subject from *true* responsibility to *social* responsibility." Compatibilists say, "There is no 'true' responsibility beyond the social/normative practice."

  3.  **Evaluate the Nature of the Disagreement (Substantive vs. Verbal vs. Cross-Purposed):**
      *   *Verbal?* Partially. "Responsibility" is the flashpoint. Incompatibilists often mean *Basic Desert* (you deserve punishment/reward simply because you did it, ceteris paribus). Compatibilists often mean *Accountability* (you are an appropriate target of regulation/blame to sustain norms).
      *   *Substantive?* Yes, underneath the terminology. It's about whether the *justification* of our deepest emotional practices requires a metaphysical truth (libertarian free will) or whether the practices are self-justifying (naturalistic/functional).
      *   *Cross-Purposed?* This is the strongest diagnostic. Incompatibilists are asking a *metaphysical/justificatory* question ("Is blame *fair* given the causal history?"). Compatibilists (following Strawson) are answering a *descriptive/normative-functional* question ("Is blame *inevitable and useful* for human relationships?"). Strawson tries to dissolve the metaphysical question by saying the normative practice is bedrock. Critics say the metaphysical question undermines the normative practice.

  4.  **Drafting the Diagnosis (incorporating Strawson):**
      *   Focus on Strawson's "objective attitude" vs. "participant stance."
      *   Highlight the critic's claim: The participant stance *itself* relies on a false belief (that we are contra-causally free). If that belief is false, the stance is irrational (like resentment toward a storm).
      *   Highlight Strawson's counter: The belief isn't a theoretical belief; it's a commitment of the form of life. You can't step outside it to judge it.
      *   Conclusion on the stall: It's a clash between *external justification* (Incompatibilist) and *internal vindication* (Compatibilist/Strawsonian).

  5.  **Determining "Progress":**
      *   *Conceptual Distinction?* We already have "Basic Desert" vs. "Forward-Looking Accountability." (Derby, Pereboom, Fischer). Has this helped? Not really, people still fight over which one is *real* responsibility.
      *   *Empirical Psychology?* Knowing *how* we blame doesn't tell us if we *should*. Is-ought gap.
      *   *Clarification of Desert?* If we define desert purely retributively, incompatibilists win (if determinism is true). If we define it relationally, compatibilists win. This just pushes the definitional battle.
      *   *Bedrock Acknowledgment?* This seems most honest. The disagreement is about fundamental values: Is fairness (metaphysical) more important than social cohesion (pragmatic)?
      *   *Selection:* The most productive path is acknowledging the **normative/metaphysical split**. Progress isn't solving it, but mapping it precisely so we know *why* we disagree. We need to admit that "Responsibility" is a cluster concept and the sides are prioritizing different clusters.

  6.  **Refining the Argument (Self-Correction during drafting):**
