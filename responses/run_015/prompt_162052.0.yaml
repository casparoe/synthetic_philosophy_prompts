answer: |-
  Hubert is a participant in a medical trial where his brain is surgically removed and sustained in a nutrient vat within a neurology lab in **Cambridge**, while his headless body is kept alive on life support in a hospital bed in **Boston**. Instead of wiring his brain back to his biological nerves, the surgeons connect it via radio link to a telepresence robot equipped with cameras and manipulators located in a testing warehouse in **Worcester**. Hubert remains fully conscious, perceiving the warehouse walls through the robot's sensors and controlling its limbs, while his biological body remains unconscious but metabolically active in Boston.

  **The Organism View** answers that Hubert is in **Boston** because he is identical to the living human animal, and that animal's vital functions are being maintained in the hospital bed. Since the biological organism is the person, the person is located wherever the organism's metabolic processes are occurring, regardless of where consciousness is projected.

  **The Brain View** answers that Hubert is in **Cambridge** because he is identical to the seat of consciousness, which is physically constituted by the brain tissue in the vat. Since the brain is the necessary and sufficient physical substrate for his mental life, the person is located wherever that specific organ is situated.

  **The Experienced-Here View** answers that Hubert is in **Worcester** because personal location is defined by the spatial content of the first-person perspective. Since his sensory experience presents the warehouse as his immediate surroundings and his agency is enacted there, the "here" of his experience fixes his location.

  **The Pivot Feature:** The single feature pulling the three apart is the **routing of the sensory-motor loop to a remote surrogate rather than the biological body**. If you remove this feature and reconnect the brain to the body (as in Dennett's original case), the Experienced-Here View shifts to Boston to align with the Organism View, collapsing the three-way split into a two-way disagreement between the Body/Boston and the Brain/Cambridge. If you instead remove the life support and let the body die, the Organism View collapses, leaving only the Brain and Experience views in contention.

  **The Objection:** The defender of the Experienced-Here View will object that perceiving a location via video feed is not occupying it, much like a drone pilot is not where the drone is. This complaint is about **their own view**, not the scenario; the case successfully establishes veridical perception and agency in Worcester, so the objection merely reveals that the view conflates *represented* space with *physical* location.

  **The Verdict:** The **Brain View** handles the case best because it anchors the person to the physical cause of consciousness without relying on the unconscious biology of the organism or the potentially misleading phenomenology of the surrogate. It respects the intuition that you go where your mind goes, while avoiding the category error of treating sensory data as spatial presence.
