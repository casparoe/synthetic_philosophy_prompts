answer: |-
  ### 1. Exam Question

  **Question 4 (30 Marks)**

  Consider the following two scenarios regarding the influence of higher-order states on visual processing:

  **Case A (The Radiologist):** After two years reading scans alongside an assistive system that draws boxes around suspicious regions, an experienced radiologist finds that tumours now "jump out" at her even on days when the system is down. She has no occurrent belief about any particular image while scanning, and her unassisted accuracy has genuinely improved.

  **Case B (The Lab Analogue):** Participants are told before each block what an ambiguous target is most likely to be. In **Version 1**, they report the target popping out vividly, but signal detection analysis shows a shift in response criterion ($c$) with sensitivity ($d'$) unchanged. In **Version 2**, sensitivity ($d'$) genuinely increases.

  (a) Regarding **Case B**: Explain why Version 1 fails to demonstrate cognitive penetrability even if participants report vivid changes. For Version 2, explain why an increase in sensitivity ($d'$) is necessary but not sufficient to prove penetration rather than a modulation of attention. (10 marks)

  (b) Regarding **Case A**: Does the radiologist's improved performance count as cognitive penetrability in the sense relevant to debates about modularity? Justify your answer by distinguishing between synchronic causal influence and diachronic system tuning. (10 marks)

  (c) Fodor argues that if perception is penetrable, it cannot serve as an "independent tribunal" for belief. Using insights from (a) and (b), evaluate whether a penetrable perceptual system is necessarily epistemically circular. Does the distinction between benign and malignant influence track the distinction between penetrable and encapsulated systems? (10 marks)

  ***

  ### 2. Model Answer

  To establish cognitive penetrability in Case B, we must rule out post-perceptual decision effects. Version 1 shows only a criterion shift; participants are willing to guess "target present" more readily based on expectation, but their ability to discriminate signal from noise ($d'$) is unchanged. This is a change in judgment, not experience. Version 2 shows increased sensitivity, which rules out mere response bias. However, this is still not sufficient for penetration. Attention is a non-cognitive (or pre-cognitive) modulator that also increases $d'$. To prove penetration, one must show the sensitivity shift is driven specifically by *semantic* or *conceptual* content (e.g., believing the target is a rabbit) rather than merely spatial or feature-based priming. If the effect persists when attention is controlled for, only then does it suggest cognitive states alter the perceptual processing itself.

  Case A presents a diachronic change. The radiologist's system has been retuned by training; at the moment of seeing, no occurrent belief ("there is a tumour here") is causing the experience. Strictly speaking, this is not synchronic cognitive penetrability. The cognitive state existed in the past to train the module, but the current processing is encapsulated from current beliefs. However, if "cognitive penetrability" is defined broadly to include etiological influence, it counts. For modularity debates, the synchronic definition is usually paramount: Fodor's modularity requires the system to be informationally encapsulated *now*. Thus, Case A describes expertise (plasticity), not necessarily synchronic penetration.

  This distinction resolves the epistemic worry. Fodor's "independent tribunal" argument claims that if belief $B$ causes experience $E$, $E$ cannot justify $B$ without circularity. This is a genuine risk in synchronic cases (e.g., wishful thinking making a hill look steeper). However, Case A shows that diachronic penetration (training) can be epistemically benign. The radiologist's experience justifies her belief because the training process was reliable, even if her current perception is shaped by past cognition. Therefore, the benign/malignant distinction does not track the penetrable/encapsulated cut. A system can be penetrable (via training) and still serve as a reliable tribunal, provided the penetration arises from reliable learning rather than occurrent wishful thinking. Epistemic circularity depends on the *etiology* of the influence, not merely the presence of top-down effects.

  ***

  ### 3. Marking Scheme

  | Required move | Marks (out of 30) | What a first-class answer does | The specific mistake that costs the mark |
  | :--- | :---: | :--- | :--- |
  | **Case B: Criterion vs. Experience** | 10 | Identifies that $c$-shift is decision-level, not perceptual. Explains that reported vividness is unreliable self-report without $d'$ support. | Treating a criterion shift as a change in what's experienced; accepting self-report as proof of phenomenology. |
  | **Case B: Sensitivity vs. Attention** | (Included above) | Notes that $d'$ increase is necessary but confounds attention with cognition. Requires isolation of semantic content to prove penetration. | Assuming any change in $d'$ proves cognitive penetration; failing to distinguish attention from cognitive state. |
  | **Case A: Synchronic vs. Diachronic** | 10 | Distinguishes occurrent belief (synchronic) from trained plasticity (diachronic). Argues that Case A is likely expertise/plasticity, not synchronic penetration. | Assuming the diachronic case counts as penetration merely because a belief was causally involved at some earlier point. |
  | **Epistemic Implications** | 10 | Argues that circularity applies to synchronic wishful thinking, not diachronic expertise. Concludes benign/malignant $\neq$ penetrable/encapsulated. | Asserting that *any* penetration destroys justification; failing to see that training can be epistemically benign. |
  | **Total** | **30** | | |

