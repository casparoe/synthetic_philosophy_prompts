prompt: |-
  I've been reading rationalist blogs since the Sequences days and commenting maybe twice a year, so I'm out of my depth here and I know it. There's a thread under a recent post about whether building a global-workspace architecture into an AI system would make it conscious, and the top comment shuts it down with: "either there's something it's like to be the thing or there isn't, and global workspace theory only ever tells you about access — access aint phenomenality." Loads of upvotes. I've never read whatever paper that phrasing comes from (famous philosophy thing about bats; I absorbed it purely through secondhand blog posts), and the more I stare at the sentence the less sure I am that it's asserting anything I can evaluate.

  So I want the phrase taken apart into a menu, not defended. Concretely, I made up a case to test it on: take a system with a global workspace of the standard sort — limited-capacity buffer, contents broadcast to a bunch of otherwise encapsulated specialist modules, ignition, downstream effects on memory and action selection, the works — except that the broadcast has no route to the system's self-model or to any verbal-report machinery, and leaves nothing the system's own later self-monitoring can retrieve. Call it dark broadcast: the content is functionally available in exactly the way the theory says matters, but there's no audience for it anywhere, including inside the system. Is there something it's like to be that system? Run each reading against it, and also tell me what happens to your answer in a variant where two such workspaces run on the same inputs with disjoint consumers and no crosstalk — one subject, two, or none.

  I don't want you to pick your favourite reading and argue for it; I want the disambiguation with verdicts, and I want to be told where a disagreement between two of the readings is merely verbal. For each reading say roughly: what the world would have to be like for it to be true; whether it's a platitude, a substantive and defensible claim, or empty/false; whether a completed global-workspace story could in principle settle it; and what it implies about dark broadcast.

  Sections, please:

  1. "The menu" — the distinct precise theses "there is something it is like to be S" could be expressing, ordered thinnest to thickest, each with the four points above. ~700 words, and compress rather than pad; 6–9 readings is fine.
  2. "Triage" — a small table: reading, platitude-or-not, does GWT settle it, verdict on my case. ~200 words.
  3. "What he actually needed" — which of the readings would have to be true for his comment to land, i.e. for it to follow that a perfect account of access leaves the "something it's like" question open, and whether those readings survive your verdicts. ~250 words.
  4. "Where my case does and doesn't bite" — honestly: which readings my dark-broadcast setup actually discriminates between, and where I'm just relabelling the original confusion. ~200 words.
  5. "Things I can post in the thread" — 4–6 short, concrete questions or stipulations I could put to the commenters that would force which reading they're using without me having to pretend to expertise. ~150 words.
