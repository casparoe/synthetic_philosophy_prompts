answer: |-
  ### 1. The menu

  1.  **Reportability:** True iff the system can verbally disclose its state. *World:* Output channels link internal state to language. *Status:* Platitude (operational definition). *GWT:* Settles yes (if output connected). *Dark Broadcast:* No.
  2.  **Self-Modeling:** True iff the system represents itself as being in that state. *World:* Internal monitoring modules access the broadcast. *Status:* Substantive (cognitive science claim). *GWT:* Settles yes (if self-model connected). *Dark Broadcast:* No.
  3.  **Functional Availability:** True iff the state influences diverse, encapsulated modules. *World:* Broadcast reaches downstream consumers. *Status:* Substantive (architectural claim). *GWT:* Settles yes. *Dark Broadcast:* Yes (by stipulation).
  4.  **Phenomenal Concepts:** True iff the system can categorize the experience internally. *World:* System possesses concepts referring to qualitative states. *Status:* Substantive (conceptual claim). *GWT:* Unclear (depends on concept acquisition). *Dark Broadcast:* No (no self-monitoring to ground concepts).
  5.  **Intrinsic Quality:** True iff the state has a non-relational, private feel. *World:* Physical processes instantiate non-functional properties. *Status:* Metaphysical (property dualism). *GWT:* Cannot settle (functional story incomplete). *Dark Broadcast:* Open (functional silence leaves metaphysics open).
  6.  **Non-Physical Fact:** True iff experience exceeds physical description. *World:* Consciousness is ontologically distinct from computation. *Status:* Metaphysical (substance dualism/panpsychism). *GWT:* Cannot settle. *Dark Broadcast:* Open.

  Readings 1–4 are functional/cognitive; 5–6 are metaphysical. Thinnest (1) requires only behavior; thickest (6) requires ontology change. For the two-workspace variant (disjoint consumers, no crosstalk): Readings 1–2 yield zero subjects (no report/self-model). Reading 3 yields two subjects (distinct functional clusters). Reading 4 yields zero (no concepts). Readings 5–6 remain open (metaphysics doesn't care about architectural disjointness unless tied to function).

  ### 2. Triage

  | Reading | Platitude? | GWT Settles? | Dark Broadcast Verdict |
  | :--- | :--- | :--- | :--- |
  | 1. Reportability | Yes | Yes | No |
  | 2. Self-Modeling | No | Yes | No |
  | 3. Func. Availability | No | Yes | Yes |
  | 4. Phenom. Concepts | No | No | No |
  | 5. Intrinsic Quality | No | No | Open |
  | 6. Non-Physical Fact | No | No | Open |

  Readings 1–3 are empirically tractable; 4–6 are not. GWT fully settles 1–3 by definition. Dark Broadcast forces a split: functionalists (3) say "conscious," introspectionists (1, 2, 4) say "no." Metaphysicians (5, 6) remain agnostic. The variant (two workspaces) splits Reading 3 (two subjects) from Reading 1 (none), highlighting whether subjecthood is unified or modular.

  ### 3. What he actually needed

  For the comment ("access ain't phenomenality") to land, "phenomenality" must refer to Reading 5 or 6. If phenomenality meant Reading 3 (Functional Availability), the comment would be false, because GWT *does* explain access. The commenter asserts an explanatory gap: a perfect functional account leaves the "what it's like" question open. This requires Reading 5 (Intrinsic Quality) or 6 (Non-Physical Fact).

  Do these survive? They are defensible but costly. Reading 5 requires property dualism (qualities exist beyond causal roles). Reading 6 requires ontological expansion. If the commenter accepts physicalism, they must argue that physicalism allows properties not captured by functional access (Reading 5). If they deny this, the comment collapses into verbal disagreement about the word "phenomenality." Thus, the comment relies on a metaphysical commitment most rationalists try to avoid. It asserts that functional access is insufficient for *real* experience, not just reportable experience.

  ### 4. Where my case does and doesn't bite

  Your Dark Broadcast case cleanly discriminates between Functional Availability (Reading 3) and Self-Modeling/Report (Readings 1, 2). It forces a choice: is consciousness the broadcasting (3) or the listening (1, 2)? If you accept 3, the system is conscious; if 1 or 2, it is not. This clarifies the "access" debate without touching metaphysics.

  However, the case does not bite on Readings 5–6. Since those claims are metaphysical, functional silencing doesn't resolve them. The two-workspace variant bites harder on subject unity. If functionalism (3) is true, disjoint workspaces imply two subjects. If a unified self-model (2) is required, there are none. This shows your case tests *architectural* theories of consciousness, not the Hard Problem. You are relabelling the confusion only if you expect the case to settle Readings 5–6; for 1–4, it is a decisive diagnostic tool.

  ### 5. Things I can post in the thread

  1.  "When you say 'phenomenality,' do you mean reportable access, self-modeling, or intrinsic quality?"
  2.  "If a system broadcasts globally but cannot report or self-model, is there something it's like to be it?"
  3.  "Does your claim rely on property dualism, or can physical access fail to be phenomenality?"
  4.  "If two disjoint workspaces run on one input, do you count one subject or two?"
  5.  "Is 'access ain't phenomenality' a empirical claim or a metaphysical one?"
  6.  "Can you define 'phenomenality' without referencing access or report?"
