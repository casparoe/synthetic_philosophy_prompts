answer: |-
  **Spine:** Mechanism (Imagination) → Propriety (Concord) → Internalization (Conscience).

  **1. Verdict Split:** Do not split propriety and merit. Students haven't read Part II. Introducing merit (the object's worthiness) now confuses the mechanism of sympathy (the passion's proportionality to the cause). Keep the question narrow: "Is the emotion proportionate to the situation?" Splitting them obscures the distinct mechanism of sympathy.

  **2. Actual vs. Impartial:** Move from actual to impartial *before* internalization. Demonstrate actual spectators failing due to proximity or bias. This creates the logical necessity for the impartial standard. If you wait until internalization, students conflate the inner voice with actual social pressure, cementing the "sociology" error.

  **3. Spectator Reading:** Anchor **fixed-point**. Surrogate (internalized approval) explains development, but fixed-point (corrected for bias/ignorance) explains normativity. Leading with surrogate validates the reductionist misconception that morality is just social conditioning. Fixed-point justifies the "ought." Treat surrogate as the genetic origin, demoted to explanatory background.

  **4. Calibration:** Defuse during fixed-point explanation. Correction pushes off the ideal of full information and neutrality, not averaging biases. Saving this for the end undermines confidence; resolve it when establishing the standard.

  **5. Example:** A professional grievance (e.g., credit stolen). Requirements: (1) Allows excessive anger (fails sympathy), (2) Shows crowd bias (friends approve rage), (3) Allows impartial correction (facts reduce rage). Avoid death (reduces sympathy to pity). Avoid clear rule violations (theft) so judgment rests on sentiment proportionality, not rules. It must be interpersonal but not tragic.

  **6. Misconceptions:**
  *   **Sympathy=Compassion:** Head off in minute 5. Define as "imaginary change of situations."
  *   **Spectator=Social Internalization:** Address during internalization. Distinguish "actual approval" from "ought to approve."
  *   **Impartial=Universal Law:** Clarify as context-sensitive neutrality.
  *   **Relativism:** Handle via fixed-point reading.

  **7. Omissions:** State aloud: "We bracket Merit (Part II) and Custom (Part V). We ask only if the passion fits the cause, not if the object deserves it." This prevents confusion about why we ignore the victim's worthiness.

  **8. Closing Question:** "If your society approves of a passion the impartial spectator would not, is that society wrong? How does Smith know?" This tests whether they grasp the normative independence of the impartial spectator from actual social approval.
