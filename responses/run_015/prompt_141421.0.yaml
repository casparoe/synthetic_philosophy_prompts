answer: |-
  **Total Mark: 18/20**

  This is a strong answer that demonstrates a solid grasp of the literature and the ability to apply theoretical principles to concrete cases. The student writes clearly and identifies the core logical tensions well. However, there are a few places where they make theoretically ambitious moves that gloss over necessary distinctions. Below is the breakdown.

  ### Part (a): 5/5 marks
  **What they got right:**
  *   **Definitions:** The distinction between "who the 'we' is" (boundary) and "what the 'we' decides" (scope) is clear and accurate.
  *   **Circularity:** They correctly identify the Whelan paradox (you need a demos to decide the demos) and explain why this doesn't apply to scope (an existing demos can decide its own jurisdiction).
  *   **Clarity:** The explanation is concise and uses the "voting" example effectively to illustrate the logical priority problem.

  **What to flag (for your records):**
  *   **Loose Heuristic:** The sentence *"In a sense the scope problem is the boundary problem applied to issues rather than persons"* is a bit glib. While helpful for memory, they are logically distinct problems (membership vs. competence), not just person/issue variants of the same thing. However, since they correctly distinguish them in the next sentence, this doesn't warrant a deduction.

  **Feedback to Student:**
  > "Excellent explanation of the circularity objection. You clearly articulate why the boundary problem is logically prior and why democratic procedures cannot solve it without presupposing a solution. Your distinction between membership (boundary) and competence (scope) is clear."

  ### Part (b): 6/8 marks
  **What they got right:**
  *   **AAP Application:** Correctly identifies the "indeterminacy" and "over-inclusion" objections to the All-Affected Principle (AAP). The application to the Ruritania/Belgravia case (causal chains, wage effects) is spot on.
  *   **Determinacy Argument:** You correctly note that ASP is often viewed as more determinate because legal subjection is (ostensibly) binary, whereas "affected interests" are a matter of degree.
  *   **Critical Engagement:** It is sophisticated to argue that border enforcement *is* a form of coercion that subjects outsiders to the regime.

  **What's wrong or missing (The "Plausible but Shaky" bits):**
  *   **Conflation of Exclusion and Subjection:** You argue that because Belgravians are *deterred* by Ruritanian coercion, they are *subject* to Ruritanian law. This is a specific philosophical claim (associated with authors like Abizadeh), but it is not the standard definition of the All-Subjected Principle (ASP) in most introductory contexts. Standard ASP usually relies on *jurisdictional membership* (citizenship/residency). By defining "subject to coercion" as "impacted by the threat of coercion," you are effectively collapsing ASP into AAP.
  *   **Contradiction on Determinacy:** You claim ASP is more determinate ("yes-or-no matter") but then conclude it "inherits the all-affected principle's over-inclusiveness." If it yields the same indeterminate/global result in practice, you need to explain more carefully in what sense it remains "determinate." (Is the *rule* clearer, even if the *outcome* is the same? You hint at this, but it needs explicit argumentation).
  *   **Missing the Standard Contrast:** The question asks which is *more* determinate. The standard answer is ASP, precisely because it *excludes* the Belgravians (they are not citizens/residents). You argued they converge. While theoretically interesting, you didn't fully defend why ASP should be read so expansively in this context.

  **Feedback to Student:**
  > "Strong analysis of the All-Affected Principle's indeterminacy. However, your application of the All-Subjected Principle is theoretically risky. You argue that Belgravians are 'subject to coercion' because they are deterred by border enforcement. While this is a defensible philosophical position, it conflates being 'excluded by coercion' with being 'subject to the legal order.' Standard interpretations of ASP rely on jurisdictional membership (citizenship/residency), which would exclude Belgravians. Because you treat ASP as nearly identical to AAP here, you undermine your own claim that ASP is more 'determinate.' You need to distinguish between the clarity of the *criterion* (legal status) and the *extension* of the demos (who gets in)."

  ### Part (c): 7/7 marks
  **What they got right:**
  *   **Escaping AAP:** Correctly identifies that No-Exit narrows the demos by filtering out those who can avoid costs, addressing the over-inclusion objection.
  *   **Collapse Question:** Clearly argues that No-Exit and ASP do not collapse.
  *   **Divergence Cases:** This is the strongest part of the answer.
      *   *Tourist:* Subjected (ASP) but can exit (No-Exit excludes).
      *   *Abandoned/Poverty:* Cannot exit (No-Exit includes) but not coerced/governed (ASP excludes).
      *   These are textbook counter-examples that show deep understanding.
  *   **Secondary Objection:** You independently identified the "external dependency" problem (membership depends on other states' policies), which shows excellent critical thinking.

  **What to flag (for your records):**
  *   **Final Sentence Slip:** The very last sentence (*"Once we know who is in the demos we also know which territory the state may rightfully control, since the demos just is the people who live on the territory in question"*) subtly contradicts Part (a). In Part (a), they correctly distinguished boundary (people) from scope/territory. Here, they assume a congruence that the boundary problem problematizes. It's a minor slip in an otherwise perfect section.

  **Feedback to Student:**
  > "Excellent work here. Your counter-examples (the tourist vs. the trapped resident) are precise and definitively show that the two principles track different properties. You also correctly identify the 'external dependency' worry (that membership depends on other states' immigration policies). One minor note: your concluding sentence suggests that solving the boundary problem automatically solves the territorial scope problem. Be careful not to conflate these again; as you noted in Part (a), knowing *who* the people are doesn't necessarily dictate *where* their jurisdiction ends."

  ### TA-to-TA Note on Grading Consistency
  The main risk with this paper is **Part (b)**.
  *   If your course taught the **Abizadeh view** (coercion includes border enforcement), this student deserves **8/8** on Part (b) and **20/20** overall.
  *   If your course taught the **Standard/Weberian view** (subjection = within jurisdiction), the student is conflating "impact" with "subjection." In that case, **6/8** on Part (b) is defensible because they missed the intended contrast between the two principles.
  *   *Recommendation:* If you haven't covered Abizadeh specifically, stick with the 18/20. The student is making an argument that requires more premises than they provided (i.e., *why* deterrence counts as subjection in the relevant normative sense).
