          *   *Potential Pitfalls:* Conflating the two, failing to explain *why* the circularity exists specifically for boundary.

      *   **Part (b) [8 marks]:**
          *   *Task:* Apply All-Affected (AAP) and All-Subjected (ASP) to Ruritania/Belgravia immigration case. Determine which is more *determinate* and why.
          *   *Key Concepts:* AAP = interests affected (often leads to over-inclusion/global demos). ASP = subject to coercion/law (often leads to state citizenship/residency). Determinacy = clarity of application.
          *   *Expected Analysis:* AAP is indeterminate (how much affect? causal chains?). ASP is usually seen as more determinate (legal status).
          *   *Student's Twist:* The student argues ASP *also* includes Belgravians because border enforcement coerces them. This is a sophisticated point (Goodin/Arrhenius debates), but needs to be evaluated on whether they answered the "determinacy" question correctly.
