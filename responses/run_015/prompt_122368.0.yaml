answer: |-
  The rain was hammering against the window of The Old Crown, blurring the streetlights into smeary orange streaks. Juno nursed a pint of stout, swirling the dark liquid like it was a crystal ball, while Kiran picked at the label on their lager bottle.

  **Juno:** Right, but think about it properly. If Dennett's right about the centre of narrative gravity, yeah? It's a fictional point. But it's stable. It holds the story together. My point is, once you let later stuff change the weight of earlier stuff... that centre isn't a point anymore. It's like... temporal curvature.

  **Kiran:** Curvature implies a mass though, doesn't it? Something doing the curving.

  **Juno:** Not necessarily. Think gravity. You don't see gravity, you see what it does to light. If I turn thirty and realise that traumatic breakup at twenty-five was actually the best thing that ever happened to me—because it led to me meeting Sarah, or whatever—that memory *changes*. The past event hasn't moved in time, but its gravitational pull on who I am now? Totally different. It bends the light of the earlier years.

  **Kiran:** See, that's where I get stuck. You're saying the self is the black hole rewriting its own history. But if the history keeps getting rewritten by whatever story I'm telling myself *now*, then where's the black hole? If the pull is constantly shifting based on my current mood or who I'm talking to, there's no single centre doing the pulling. It's just... scattered.

  **Juno:** But the scattering is what creates the shape though. Like, the tension between who I was and who I say I am now—that tension *is* the self. It's not a thing, it's a force field.

  **Kiran:** A force field without a generator? Come off it. That introduces proper epistemic friction. If I can just retroactively decide that failing my exams was "character building" whenever I feel like it, how do I know what actually matters? There's no anchor. It's just a bunch of micro-narratives fighting for dominance. One minute you're a victim, next minute you're a hero, depending on which story wins the tug-of-war that afternoon.

  **Juno:** Why do you need an anchor? Ships need anchors because they're in water. We're in time. Time flows one way, sure, but meaning flows both ways. The friction you're talking about? That's not a bug, Kiran, that's the feature. That friction *is* the heat of being alive. If the story was fixed, you'd be dead. Or a robot.

  **Kiran:** I'm not saying it should be fixed. I'm saying there needs to be some resistance from the world. Distributed cognition says the self isn't just in your head, it's out there in your notes, your photos, your mates reminding you of what you actually said. If your internal narrative tries to bend the past too much, the external stuff pushes back. That's the friction. But you're talking like the internal story can just override everything. Like a black hole swallowing light.

  **Juno:** Maybe it does swallow it. Maybe the external stuff only matters insofar as it gets pulled into the orbit. Look, if I remember a holiday as amazing, but the photos show me looking miserable... eventually the memory wins. The photos just become props in the new story. "I was tired then, but happy inside." See? The gravity bends the evidence.

  **Kiran:** But who's bending it? That's my issue. You keep saying "the self does this". But if the self is just the result of the bending, you've got a loop. A snake eating its own tail. If there's no stable agent doing the narrating, just a series of competing impulses... then you haven't got a black hole. You've got gas. Diffuse gas. No centre.

  **Juno:** *sips stout* Alright, fair point. Maybe "black hole" is too solid. Too dense. But it's not gas either. It's more like... a whirlpool. Water going down a plughole. The water isn't the hole, the hole isn't the water. But the shape persists while the stuff changes. The retrocausal bit is the spin. The future spin determines how the water drains from the past.

  **Kiran:** A whirlpool's still dependent on the plughole though. The structure beneath. If you rip out the plug, the whirlpool stops. What's the plug in your metaphor? If it's not a unified cognitive agent, what stops the whole thing from just draining away into noise?

  **Juno:** The body? The brain? Dunno. Maybe it doesn't matter what the plug is, just that the water keeps spinning. But you're hung up on this "unified agent" idea. Cognitive science keeps telling us there isn't one. There's no little man in the head. So why do you need a little man to hold the narrative together?

  **Kiran:** Because someone's got to pay the bill. Metaphorically. If there's no unity, there's no responsibility. If my "future self" rewrites the past to make me look better, but my "past self" actually did something rubbish... who owns the mistake? If it's just a scattered field of micro-narratives, then no one owns it. It's just physics. And I can't live like that. I need to know I'm the one doing the pulling, even if it's hard work.

  **Juno:** Maybe ownership is just another story we tell to keep the friction down.

  **Kiran:** *laughs* Typical. You'd dissolve the self entirely if you could. But admit this—if the gravity bends too much, the story snaps. You meet someone who was there, they say "that's not how it happened", and your curvature hits a wall. Reality has mass too, Juno. It doesn't just bend to your narrative gravity.

  **Juno:** Alright, alright. Maybe it's not a black hole. Maybe it's... a negotiation. Between the gravity of now and the mass of then.

  **Kiran:** Now you're talking. A negotiation implies two parties. Not just one ghost rewriting history.

  **Juno:** Cheers to that then. *raises glass* To the negotiation.

  **Kiran:** Cheers. Just don't try to rewrite the round, yeah? I saw you order this pint.

  **Juno:** Too late. In my narrative, you offered.

  **Kiran:** *shakes head* Wierdo. Drink up.
