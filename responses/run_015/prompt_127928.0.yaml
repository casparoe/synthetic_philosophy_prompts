answer: |-
  ### Exam Question: Moral Philosophy 450 – Final Take-Home

  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,200 words maximum

  **Question:**
  Consider the following triage scenario: A medical disaster has occurred. You can save five patients who will certainly die without intervention. However, the only way to administer the cure is to run a pipeline through a crowded zone. This imposes a 0.5% risk of severe, life-altering injury on each of 100 distinct bystanders. Alternatively, you can protect the bystanders completely, but the five patients will die with certainty.

  In *What We Owe to Each Other*, Scanlon argues that we cannot aggregate burdens to override an individual's reasonable rejection when the burden is large (e.g., one death vs. five deaths). However, he suggests that many small burdens might be aggregated to justify a policy.

  Write an essay addressing the following:
  1.  How does Scanlon's **Individualist Restriction** apply to the five patients versus the single bystander in a standard 1-vs-5 death case?
  2.  Does the **distributed risk** to the 100 bystanders change the contractualist calculation compared to the certain death of the five? Can the 100 bystanders collectively reasonably reject the risk, or do their complaints fail to aggregate?
  3.  Critically evaluate whether allowing aggregation in the risk case but blocking it in the death case renders Scanlon's theory unstable. Does this distinction secretly rely on a utilitarian weighing of total expected harm, thereby collapsing contractualism into a form of weighted rule-utilitarianism?

  ***

  ### Model Answer (Approx. 700 Words)

  Scanlon's contractualism is defined by the Individualist Restriction: a principle is wrong if it could be reasonably rejected by any single individual, given a desire to find principles others could not reasonably reject. This framework faces a severe stress test in the proposed triage scenario, specifically regarding the aggregation of complaints.

  In a standard 1-vs-5 death case, Scanlon blocks aggregation. If a principle permits sacrificing one innocent bystander to save five, that bystander has a generic reason to reject it: "I am forced to bear the full cost of saving others." The five patients also have reasons to reject a principle that lets them die. However, Scanlon argues the single bystander's complaint is stronger because their burden is certain and catastrophic, whereas the five patients' complaints are not *stronger* individually than the bystander's. Since contractualism compares individual complaints rather than summing them, the single bystander's veto stands. The numbers do not count; the strength of the individual complaint does.

  The triage scenario complicates this by introducing probabilistic harm distributed across 100 people. Here, no single bystander faces certain death; each faces a 0.5% risk of severe injury. Scanlon allows that when burdens are small enough, they may be aggregated. The crucial distinction lies in the *nature* of the complaint. A 0.5% risk of injury is qualitatively different from certain death. Individually, no single bystander has a complaint strong enough to veto the saving of the five patients, because the expected burden on any one person is low.

  However, the 100 bystanders might argue collectively. If contractualism permits summing these tiny risks to form a collective complaint equivalent to a serious harm, then the 100 bystanders could veto the rescue. Scanlon resists this. He suggests that reasonable rejection is anchored in the individual standpoint. If the risk to *each* is below the threshold of reasonable rejection, the fact that *someone* will statistically suffer does not grant a veto to the group. The five patients, facing certain death, have a much stronger individual complaint than any single bystander facing a 0.5% risk. Therefore, contractualism permits imposing the distributed risk to save the five.

  The critical philosophical problem is whether this distinction is stable or merely a disguised utilitarianism. If Scanlon blocks aggregation in the 1-vs-5 death case (protecting the one) but allows it in the 100-vs-5 risk case (sacrificing the statistical victims to save the five), he appears to be weighing total expected harm. In the risk case, 0.5% of 100 people equals 0.5 expected severe injuries, which is less than 5 certain deaths. If the justification for allowing the risk is that the *total* expected harm is lower, Scanlon has surreptitiously reintroduced the utilitarian calculus he sought to replace.

  This threatens to collapse contractualism into weighted rule-utilitarianism. If the "strength of a complaint" is determined by comparing the individual burden against the total social benefit (or total harm averted), the individualist restriction becomes a mere heuristic for maximizing good outcomes. For contractualism to remain distinct, the justification must remain grounded in *relational* reasons—what we owe to each other as justificatory equals—not impersonal value.

  Scanlon attempts to save the theory by appealing to impersonal reasons only as a tie-breaker or when individual complaints are weak. He argues that we owe it to the five patients to save them because their individual complaint (certain death) outweighs the individual complaint of any bystander (small risk). The aggregation of the bystanders' risks is not what justifies the action; rather, the weakness of each individual bystander's complaint fails to override the strength of the patients' individual complaints.

  However, this defense is precarious. If the 100 bystanders know that imposing the risk guarantees *someone* among them will be maimed, their generic reason to reject the principle strengthens. If Scanlon admits that the certainty of *some* harm to the group aggregates to override the five patients, he concedes to utilitarianism. If he denies it, he must explain why 100 small risks do not constitute a collective burden comparable to five deaths without simply counting heads. Ultimately, the distinction holds only if Scanlon maintains that reasonable rejection is strictly non-aggregative regarding the *source* of the veto, even if the *strength* of the complaint acknowledges probability. Without this tightrope walk, the theory collapses into the very consequentialism it was designed to avoid.

  ***

  ### Marking Scheme

  **Grade A (Excellent/Distinction):**
  Demonstrates a sophisticated grasp of the tension between individualism and aggregation. Synthesizes Scanlon's specific mechanisms with the collapse objection.

  **Grade B (Good/Pass):**
  Accurately explains Scanlon's view and identifies the problem but lacks critical depth on the "collapse" objection or misapplies the Individualist Restriction.

  **Five Specific Moves Required for an 'A' Answer:**

  1.  **Identify the Veto Power (Individualist Restriction):**
      *   *Move:* Correctly explain that in a 1-vs-5 death case, the single person can veto the sacrifice because their individual complaint is not weaker than any of the five.
      *   *Typical Mistake (B Grade):* Treating the veto as a majority vote or claiming Scanlon simply counts the five as "more important" without referencing individual complaint strength.

  2.  **Distinguish Certainty vs. Probability:**
      *   *Move:* Articulate that the triage case turns on the difference between *certain death* (patients) and *distributed risk* (bystanders). The strength of the complaint changes based on probability.
      *   *Typical Mistake (B Grade):* Treating the 0.5% risk as morally identical to certain death, or ignoring the probabilistic nature of the bystander's burden.

  3.  **Analyze the Aggregation of Small Burdens:**
      *   *Move:* Explain Scanlon's allowance for aggregating small burdens but note the limit: aggregation is permitted only when individual complaints are too weak to veto individually.
      *   *Typical Mistake (B Grade):* Claiming Scanlon *never* allows aggregation (ignoring his later work/responses to critics) or claiming he *always* allows it (missing the Individualist Restriction).

  4.  **Address the Collapse Objection:**
      *   *Move:* Explicitly discuss whether distinguishing these cases forces Scanlon to weigh total expected harm, effectively making the theory a form of rule-utilitarianism.
      *   *Typical Mistake (B Grade):* Mentioning utilitarianism only as a foil without explaining *why* the distinction might collapse into it (i.e., failing to link "total expected harm" to the justification).

  5.  **Evaluate Impersonal/Relational Reasons:**
      *   *Move:* Assess whether Scanlon's appeal to "what we owe to each other" (relational) can survive the use of impersonal calculations (total risk) in the risk case.
      *   *Typical Mistake (B Grade):* Assuming impersonal reasons automatically save the theory without analyzing the tension they create with the individualist foundation.

  **Differentiation Criteria:**
  *   **A Answer:** Connects the five moves into a coherent argument about the *stability* of the theory. Acknowledges that Scanlon's defense is "precarious" or "tightrope" (as seen in the model).
  *   **B Answer:** Treats the five moves as a checklist. Accurately reports Scanlon's view but offers a binary verdict (e.g., "It collapses" or "It doesn't") without exploring the nuance of *why* the distinction is theoretically difficult to maintain.
