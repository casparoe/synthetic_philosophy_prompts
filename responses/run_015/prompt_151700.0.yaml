          1.  *Capacity is King (while present):* Current competent self overrides past self (even 1 hour ago).
          2.  *Past is King (once incapacitated):* Past competent self overrides current incapacitated self (e.g., dementia patient refusing feeding tube).
          3.  *Psychiatric ADs:* Less enforceable (Ulysses contracts often fail).
          4.  *Welfare vs. Agency:* Incapacitated patients are treated as welfare subjects (don't let them suffer) but not agents (their current refusals don't count).
      *   **The Metaphysical Question:** What theory of persistence (Endurantism vs. Perdurantism/Worm vs. Stage) does this practice presuppose, fit comfortably with, or remain underdetermined by?
      *   **Specific Hypothesis to Test:** Is the refusal/request asymmetry just about vetoes vs. compulsion, not identity?
      *   **The "Graded Continuity" Thought Experiment:** What if we replaced the binary capacity threshold with a graded continuity measure? What would *that* presuppose?
      *   **Constraint:** Distinguish between what is *strictly presupposed*, what *fits comfortably*, and what is *underdetermined*.

  2.  **Initial Analysis & Mapping:**

      *   **Endurantism (3Dism):** The person is wholly present at every moment. $Person_{t1} = Person_{t2}$.
          *   *Fit:* Explains why the past self's will binds the future self (it's the *same* entity). Explains the binary switch (you either have the property of "capacity" or you don't).
          *   *Tension:* Why does the current incapacitated self's will count for *nothing* if it's the same entity? Endurantism usually implies strict identity. If $A = B$, why does $A$'s wish trump $B$'s wish completely just because $A$ had "capacity"?
      *   **Perdurantism (4Dism - Worm View):** The person is a spacetime worm. $Person_{t1}$ and $Person_{t2}$ are temporal parts.
          *   *Fit:* The "Worm" has interests over time. The "Earlier Stage" is best positioned to judge the "Whole Worm's" good. Supports "Precedent Autonomy."
          *   *Tension:* Why does the "Current Stage" have *any* moral weight regarding welfare if it's just a part? Why the binary switch?
      *   **Perdurantism (4Dism - Stage View):** The person is a momentary stage. Identity is a counterpart relation.
          *   *Fit:* Explains the decay of authority. As psychological connectedness fades, the counterpart relation weakens, so the Past Stage's authority over the Current Stage weakens.
          *   *Tension:* Doesn't fit the *actual* legal practice, which treats the Past Self's authority as absolute once capacity is lost, regardless of psychological connectedness (e.g., severe dementia). The law acts more like the Worm view or Endurantist view here.
      *   **The Binary Threshold:** Law needs bright lines. Metaphysics (especially Stage View) suggests degrees. This suggests the binary is pragmatic/legal, not metaphysical.
      *   **The Asymmetry (Refusal vs. Compulsion):** This looks like a liberty/harm principle issue (Mill), not necessarily a persistence issue.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. State the thesis: The practice is metaphysically ecumenical but legally pragmatic. It *looks* Endurantist but functions like a specific flavor of Perdurantism (Worm) with a legal bright line.
      *   **Section 1: The Standard Practice & Metaphysical Underdetermination.**
          *   Analyze the "Capacity Switch."
          *   *Endurantism:* Fits the "Same Person" intuition. $Self_{then} = Self_{now}$. But struggles with why $Self_{now}$ (demented) has no agency if it's the same substance.
          *   *Perdurantism (Worm):* Fits "Precedent Autonomy" best. The Worm's life plan matters. The earlier stage represents the rational planning of the whole worm.
          *   *Perdurantism (Stage):* Fits the *intuition* that authority decays, but contradicts the *law* (which doesn't decay).
          *   *Conclusion:* The practice is underdetermined. Both can explain it, but for different reasons.
      *   **Section 2: The Refusal/Request Asymmetry.**
          *   User suspects this isn't identity work. Agree.
          *   It's about *harm* and *liberty*. Refusing treatment = letting nature take course (often seen as negative liberty). Forcing treatment = battery (positive imposition).
          *   Even if $Self_{then} \neq Self_{now}$, forcing $Self_{now}$ to suffer for $Self_{then}$'s values is a high bar.
          *   This is ethical/political, not metaphysical.
      *   **Section 3: Psychiatric Advance Directives (Ulysses Contracts).**
          *   Why are they weaker? Because the "Current Self" is often deemed to have *fluctuating* capacity or the harm of coercion is weighed higher.
          *   Metaphysically, this hints at a Stage-View intuition creeping in (the "psychotic self" feels like a different person), but the law won't admit it.
      *   **Section 4: The Graded Continuity Thought Experiment.**
          *   If we grade authority by psychological connectedness (Parfitian reductionism).
          *   *Presupposition:* This explicitly commits to a **Stage View** or **Psychological Continuity View** (which aligns better with Perdurantism/Stage than strict Endurantism).
          *   *Endurantist Objection:* Identity is all-or-nothing. You can't be "0.6 the same person." So a graded system is metaphysically incoherent for a strict Endurantist.
          *   *Perdurantist Fit:* Perfect fit. Temporal parts have varying degrees of connectedness.
          *   *Revisionism:* Yes, a perdurantist would see the current binary as a legal fiction masking the metaphysical reality of degrees.
      *   **Section 5: Synthesis/Conclusion.**
          *   The binary is legal, not metaphysical.
          *   The practice implicitly relies on a **Normative Endurantism** (you are one person responsible for your life) implemented via **Metaphysical Perdurantism** (we judge the life as a whole narrative).
          *   Actually, the best description is **Narrative Identity**. It's not about substance or stages, but about the coherence of a life story.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to conflate Endurantism with Psychological Continuity. You can be an Endurantist and believe in psychological continuity as the *criterion* of identity. However, strict Endurantism implies numerical identity is binary.
      *   *Nuance:* The user asked about "Standard Medical Practice." I need to stick to what the law/ethics actually *do*, not just ideal theory. The law treats the patient as *one* legal person (Endurantist legal fiction) but makes decisions based on *interests* over time (Perdurantist/Worm calculation).
      *   *Key Insight:* The "Capacity Threshold" is the crucial pivot. Before the threshold, the person is an *agent*. After, they are a *patient*. This isn't about identity changing; it's about *moral status* changing.
      *   *Addressing the "Graded" question:* If we move to graded continuity, we abandon the legal fiction of the "unitary person." This is a massive shift. It presupposes that "personhood" is a cluster concept, not a substance.

  5.  **Final Polish:**

      *   Ensure the tone matches the user's (philosophically literate, precise, slightly skeptical).
      *   Check that I answered the specific question: "Does it only make sense if... literally numerically the same substance?" (Answer: No).
      *   Check the "Refusal/Request Asymmetry" point.
      *   Check the "Graded Continuity" point.

  6.  **Final Output Structure:**
      1.  Executive Summary (Underdetermination).
      2.  The Binary Threshold (Legal vs. Metaphysical).
      3.  Endurantism vs. Perdurantism (Who fits best?).
      4.  The Asymmetry (Liberty, not Identity).
      5.  The Graded Continuity Scenario (Committing to Stage/Parfitianism).
      6.  Conclusion.

  *(Self-Correction on the "Worm" view)*: Wait, does the Worm view support the *current* stage's welfare? Yes, the Worm's good includes the experiences of all stages. So overruling the demented stage to prevent suffering fits the Worm view (minimizing suffering for the worm). Overruling the demented stage to enforce the past will *also* fits the Worm view (respecting the Worm's autonomous plan). The tension is between *Critical Interests* (Dworkin) vs. *Experiential Interests*. This is the real conflict, not Endurance vs. Perdurance. I need to make sure I highlight Dworkin's distinction here as it's the ethical bridge between the metaphysics.

  *(Refining the "Graded" point)*: If we go graded, we are effectively adopting Parfit's Reductionism. This is closer to Perdurantism/Stage theory than Classical Endurantism. Classical Endurantism struggles with "partial identity."

