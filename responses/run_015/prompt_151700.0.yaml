answer: |-
  This is a sharp dissection of the intersection between bioethics, law, and metaphysics. You are right to suspect that the current practice is a patchwork that wears metaphysical clothing but is tailored by legal pragmatism and liberal political theory.

  Here is the reconstruction of the implicit view, separated into what is presupposed, what is compatible, and what is merely pragmatic.

  ### 1. The Binary Threshold: Legal Fiction vs. Metaphysical Commitment

  **Does the practice presuppose Endurantism?**
  Strictly speaking, **no.** The practice does not require the earlier self and later self to be literally numerically the same substance in the strict Aristotelian sense.

  **What it actually presupposes:**
  The practice presupposes **Normative Continuity** backed by a **Legal Fiction of Unity.**
  The law requires a single liable/entitled entity to hold rights and duties over time. Whether that entity is a 3D substance (Endurantism) or a 4D worm (Perdurantism) is irrelevant to the clerk at the intake desk. The system requires that *Person-at-t1* can bind *Person-at-t2*.

  *   **Endurantism fits comfortably:** If $Person_{t1}$ is identical to $Person_{t2}$, it makes intuitive sense that $Person_{t1}$'s autonomous choices bind $Person_{t2}$. It explains the "authority" aspect well. However, it struggles to explain why $Person_{t2}$'s current suffering (welfare) can override $Person_{t1}$'s autonomy in some cases (like psychiatric holds), or why $Person_{t2}$'s current refusal counts for *nothing* in dementia cases if they are truly the same agent.
  *   **Perdurantism (Worm View) fits comfortably:** This is arguably the better fit for *advance directives*. On the Worm view, the "person" is the whole life-span. The earlier stage (competent) is the best representative of the Whole Worm's "critical interests" (Dworkin's term). The later stage (demented) is merely a temporal part experiencing "experiential interests." The practice of honoring the AD prioritizes the *Worm's* narrative integrity over the *Stage's* current comfort.
  *   **Perdurantism (Stage View) fits poorly:** If the later stage is only a counterpart with degrees of connectedness, the absolute authority of the earlier stage makes no sense. The Stage view suggests authority should decay as psychological connectedness decays. Since the law does *not* allow for decayed authority (the AD is valid until revoked or the patient dies), the Stage view is in tension with current black-letter law, even if it matches our moral intuitions about severe dementia.

  **Verdict:** The binary capacity threshold is **metaphysically underdetermined.** It is a procedural bright line required for liability and consent, not a discovery of ontological change. Both Endurantists and Perdurantists can accept the binary as a necessary legal heuristic, even if their metaphysics suggests continuity is graded.

  ### 2. The Refusal/Request Asymmetry

  You suspected this asymmetry is doing no identity work. **You are correct.**

  The asymmetry (Current Competent Self can override Past Self's AD, but Current Incapacitated Self cannot override Past Self's AD) is not a function of persistence theory; it is a function of **liberal harm principles and the definition of battery.**

  *   **Competent Refusal:** When a competent patient refuses treatment, overriding them is *battery*. It is a violation of bodily integrity. The metaphysical status of their past self is irrelevant because the current body is the locus of the violation.
  *   **Incapacitated Refusal:** When an incapacitated patient refuses, they lack the legal standing to consent or refuse. Honoring their refusal is not "respecting autonomy" (which they lack); it is a decision made by a surrogate. The surrogate is instructed to look to the *last known competent will*.
  *   **The Asymmetry:** It is easier to justify *allowing* someone to die (respecting a current refusal) than *causing* harm to someone (enforcing a past refusal against current protests).

  This is political philosophy (Millian liberty), not metaphysics. A Stage Theorist and an Endurantist would both agree that touching a screaming, competent adult without consent is battery, regardless of what their past self signed.

  ### 3. Psychiatric Advance Directives (Ulysses Contracts)

  The fact that these are less enforceable is the "tell" that reveals the metaphysical tension.

  *   **Why they fail:** In dementia, we assume the "Current Self" is a diminished version of the "Past Self." In psychosis/mania, we often intuitively treat the "Current Self" as an *intruder* or a *different entity* entirely, yet the law is wary of this.
  *   **Metaphysical Implication:** The reluctance to enforce Ulysses contracts suggests the system is secretly sympathetic to the **Stage View**. If the psychotic stage is psychologically discontinuous enough, enforcing the past stage's will feels like oppressing a different person. However, because the law cannot officially recognize "split personhood" without collapsing the legal framework, it treats these contracts as unenforceable to avoid the risk of coercing a "new" person.
  *   **Conclusion:** The weakness of Ulysses contracts is where the legal fiction of the Unitary Person strains most against the metaphysical reality of psychological discontinuity.

  ### 4. The Graded Continuity Thought Experiment

  Now, to your specific innovation: *Junk the threshold. Make the directive's weight a decreasing function of operationalized continuity (memory, values, etc.).*

  **What would this presuppose?**
  This would explicitly commit the system to **Perdurantism (Stage Theory)** or **Parfitian Reductionism.**

  *   **Incompatibility with Endurantism:** Classical Endurantism holds that identity is an all-or-nothing relation. $A$ is either identical to $B$ or not. There is no such thing as "0.6 identical." To adopt a graded system is to reject the notion that personal identity is what matters, and instead accept that *psychological connectedness* is what matters. This is the core of Parfit's argument in *Reasons and Persons*.
  *   **Perdurantist Revisionism:** A perdurantist (Stage theorist) would view the current binary system as a crude approximation. They would argue that the "Current Stage" *does* have a moral claim that competes with the "Past Stage," and the weight of that claim varies based on the strength of the inter-stage relations (memory, character, etc.).
  *   **The "Strongest Continuity Claim" Rule:** If you decide based on whoever has the strongest continuity claim, you are effectively treating personhood as a **cluster concept** rather than a substance.
      *   *Scenario:* Past Self wants chemo. Current Demented Self refuses.
      *   *Current System:* Past Self wins (Binary capacity check).
      *   *Graded System:* We measure connectedness. If connectedness is > 0.5, Past Self wins. If < 0.5, Current Self's welfare interests win.

  **Would a Perdurantist have to be a revisionist?**
  Yes. A consistent Perdurantist/Stage Theorist *should* be a revisionist about the current binary system. The current system treats the "Worm" as a monolithic authority figure. The Stage view suggests the "Worm" is a society of stages, and authority should be negotiated based on connectedness.

  **Does the binary fall out of one view and not the other?**
  *   **Endurantism:** Naturally supports a binary (Identity is binary). If you are the same person, your past will binds you. If you lack capacity, you are a "broken" version of the same person, but still the same person.
  *   **Perdurantism:** Naturally supports a gradient. Temporal parts fade in connectedness.
  *   **The Twist:** The *Law* adopts the Endurantist binary for administrative ease, even if the *Ethics* (especially in dementia care) often leans Perdurantist (weighing current comfort vs. past values).

  ### 5. Summary Reconstruction

  If we reconstruct the implicit view of standard medical practice:

  1.  **Metaphysics:** **Aggressive Agnosticism.** The system does not care if you are a substance or a worm. It cares about **Legal Personhood**, which is a fictional endurantist construct (one ID number from birth to death).
  2.  **Ethics:** **Dworkinian Dualism.** It distinguishes between *Critical Interests* (the life narrative, owned by the competent self) and *Experiential Interests* (current pleasure/pain, owned by the incapacitated self).
      *   *Standard ADs:* Critical Interests trump Experiential Interests.
      *   *Welfare overrides:* If Experiential Interests involve extreme suffering, they can trump Critical Interests (hence the "she seems happy" exception).
  3.  **The Threshold:** Purely **Pragmatic.** It is not an ontological boundary. It is a liability boundary.
  4.  **The Asymmetry:** **Liberal Political Theory.** It is about minimizing state/corporate coercion (battery) rather than resolving identity puzzles.

  **Final Answer to your suspicion:**
  You are right. The refusal/request asymmetry is about **vetoes vs. compulsion**, not identity.
  However, the **Advance Directive itself** (the ability of the past to bind the future) relies on a **Normative Endurantism** (you are responsible for your whole life) implemented via a **Metaphysical Worm View** (we are protecting the integrity of the life-narrative).

  If you moved to the **Graded Continuity** model, you would break the Legal Personhood fiction. You would no longer be treating the patient as "one person having a bad moment" but as "a current stage negotiating with a past stage." This would require a radical overhaul of liability, consent, and rights, effectively codifying Parfitian Reductionism into law. The current binary exists not because Endurantism is true, but because the law cannot function if "the defendant" is only 0.6 identical to "the perpetrator."

  **Recommendation:** The practice is metaphysically underdetermined but ethically committed to a **Narrative View of Identity**. It treats the *Life* as the unit of moral concern, not the *Moment*. This aligns best with the **Perdurantist Worm View**, but it enforces it using **Endurantist Legal Tools** (binary capacity). The friction you feel is the sound of those two things grinding against each other.
