answer: |-
  ### Brainstorming: Vulnerabilities in the Strong Lock-In View

  Before drafting the questions, it is necessary to identify where a rigorous defence of strong path dependence often falters. This ensures the interview probes the limits of the historian's thesis rather than merely echoing it.

  1.  **The Efficiency Defence:** Critics (notably Liebowitz and Margolis) argue that if a technology persists, it must be economically efficient; otherwise, competitors would undercut it. A strong lock-in theorist must explain why the market failed to correct the 'mistake' of the pneumatic tubes without simply asserting 'irrationality'.
  2.  **The Definition of 'Outcome':** If the function (rapid delivery) is achieved by lorries in one timeline and tubes in another, is the historical outcome the same? If the theorist argues the *social relations* of tube-workers make the outcome different, they risk moving the goalposts from economic history to sociology.
  3.  **The Determinism Trap:** Strong lock-in can imply that human agency is negligible once a path is chosen. This struggles to account for deliberate policy shifts, wars, or disasters that forcibly reset technological baselines.
  4.  **Local vs. Global:** Merrivale is a single port. If the rest of the nation adopts lorries, Merrivale becomes an outlier. Is this genuine lock-in or merely a local subsidy/anomaly? The theorist must explain why the local network effects outweighed the pressure to conform to national standards.

  ***

  ### Interview Questions for the Economic Historian

  **1. Mechanism of Persistence: Distinguishing Increasing Returns from Sunk Cost**
  **Main Question:** In your model of strong lock-in, how do you empirically distinguish between a technology that persists because it generates genuine increasing returns (network effects, learning curves) and one that persists merely because actors are falling for the sunk cost fallacy, refusing to abandon capital they have already expended?
  **Likely Reply:** The historian will likely argue that in cases of true lock-in, the 'sunk cost' is actually a web of complementary assets (like the warehouse doors in Merrivale) that make the old technology *currently* more efficient than the new one, rendering the decision rational rather than fallacious.
  **Follow-up:** But if the efficiency is entirely dependent on those complementary assets which were themselves created by the initial arbitrary choice, does that not mean the 'rationality' is circular? At what point does a rational adaptation to a past mistake become indistinguishable from the mistake itself?

  **2. Mechanism of Persistence: The Merrivale Crate Standard**
  **Main Question:** In Merrivale, the pneumatic tubes necessitated standardised crate sizes, which then dictated warehouse door widths. Is the persistence of the tubes driven by the physical infrastructure of the pipes, or by the institutional inertia of the crate standardisation?
  **Likely Reply:** They will likely contend that it is the *combination* that creates the lock-in; the physical pipes are the hardware, but the crate standards are the software, and neither can be changed without breaking the other.
  **Follow-up:** If the crate standard is the stronger lock, could a municipal decree mandating a new crate size have broken the path without replacing the pipes? If so, does that suggest the lock-in was political and reversible, rather than technological and inevitable?

  **3. Counterfactual Test: Functional Equivalence**
  **Main Question:** When testing for inevitability, if we imagine a Merrivale without tubes that later adopts motor lorries to achieve rapid small-parcel delivery, do you consider the historical outcome to be identical to the tube timeline, provided the speed and cost are the same?
  **Likely Reply:** The historian will probably say no; the 'outcome' includes the labour structure, the urban noise, the energy consumption, and the specific guilds that arise around the technology, not just the velocity of a parcel.
  **Follow-up:** If the 'outcome' includes the specific social architecture of the industry, does that make your theory unfalsifiable? Can any divergence be explained away as a 'different social outcome' even if the economic utility is identical?

  **4. Counterfactual Test: Convergence vs. Canalisation**
  **Main Question:** Proponents of technological convergence argue that industrial pressures inevitably force cities toward the most energy-efficient logistics eventually. How do you separate a temporary canalisation from a permanent one? Is there a time horizon after which, if the tubes still exist, you concede convergence was wrong?
  **Likely Reply:** They will argue that there is no fixed time horizon; as long as the increasing returns hold, the path holds. They might cite the QWERTY keyboard as a century-long lock-in.
  **Follow-up:** Yet QWERTY persists despite digital interfaces removing the mechanical jamming risk it was designed to solve. If Merrivale's tubes persist despite electric lorries being cheaper to run, are we observing lock-in, or are we observing a market failure that should have been regulated away?

  **5. Reversibility: The Threshold of Shock**
  **Main Question:** In your view of historical canalisation, what magnitude of exogenous shock is required to break a locked-in trajectory? Must it be a total systemic collapse, or can a coordinated policy intervention suffice?
  **Likely Reply:** The likely response is that minor shocks are absorbed by the system's resilience; only a shock that destroys the complementary assets (the warehouses, the tubes themselves) can reset the path.
  **Follow-up:** Does this imply that a locked-in society is inherently fragile? If it requires a catastrophe to correct an inefficiency, is the 'stability' of the system actually a form of stagnation waiting for a disaster?

  **6. Reversibility: The Merrivale Fire Scenario**
  **Main Question:** Suppose a great fire destroys forty per cent of Merrivale's warehouse district, including the tube terminals. In your analysis, would the rebuilding process revert to the tube standard out of habit, or would the blank slate allow for a path switch to lorries?
  **Likely Reply:** They will likely argue for path continuation; the knowledge, the skilled labour, and the remaining infrastructure would bias the rebuilding toward the tubes, perhaps even improving them.
  **Follow-up:** But if the fire destroys the *physical* lock (the tubes), on what basis do you claim the *preference* remains? Is there not a risk you are attributing agency to the technology itself, rather than to the merchants who choose to rebuild it?

  **7. Institutional Entrenchment: The Insurance Statutes (Merrivale Specific)**
  **Main Question:** Your thesis emphasises institutional entrenchment. In Merrivale, municipal insurance statutes were rewritten to favour tube-transported goods over street vehicles. Is this legal framework the primary engine of the lock-in, rather than the technology?
  **Likely Reply:** The historian will likely posit that the law and the technology co-evolved; the law cemented the advantage, but the technology provided the initial justification for the law.
  **Follow-up:** If the law is the cement, then the lock-in is fundamentally political. Why, then, do you frame this as a technological path dependence rather than a case of regulatory capture by the Tube Guild?

  **8. Mechanism: Agency and Beneficiaries**
  **Main Question:** Strong lock-in theories often sound deterministic, as if the technology chooses itself. Who are the specific human agents in Merrivale who benefit from retaining the tubes, and do they actively lobby to prevent the switch to lorries?
  **Likely Reply:** They will acknowledge the agents (tube maintenance unions, pipe manufacturers) but argue that even without their lobbying, the cost structures would make the switch prohibitive for the average merchant.
  **Follow-up:** If the average merchant is harmed by the higher costs but cannot switch due to coordination problems, is this not a collective action failure rather than a historical inevitability? Does 'lock-in' simply describe a situation where antitrust law was insufficient?

  **9. Reversibility: Coordinated Intervention**
  **Main Question:** If lock-in is real and inefficient, what kind of coordinated intervention could unlock Merrivale without a catastrophe? Would a subsidy for lorry imports suffice, or must the tube network be forcibly dismantled?
  **Likely Reply:** They will likely suggest that subsidies are rarely enough to overcome network effects; the state would likely need to mandate the new standard and ban the old, effectively forcing a path switch.
  **Follow-up:** If the state must force the change to overcome the 'market' logic of the lock-in, does that not prove the market is incapable of self-correction in these instances? And if so, why do we treat the resulting persistence as 'history' rather than 'policy failure'?
