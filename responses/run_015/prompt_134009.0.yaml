answer: |-
  # Adequacy Specification for Theories of Special Composition

  ## Introduction
  The Special Composition Question (SCQ)—*under what conditions do some things compose a further thing?*—admits of divergent answers, ranging from Nihilism to Unrestricted Composition. To evaluate these competing ontologies rigorously, one requires a structured adequacy framework. The following specification delineates the desiderata any robust theory must address. These criteria are divided into extensional adequacy (case classification), intensional adequacy (conceptual distinctions), empirical compatibility, and theoretical coherence. 

  Note that in metaphysics, 'non-negotiable' refers to constraints imposed by logic or settled empirical science, whereas 'camp-specific' refers to intuitions or methodological priorities favoured by specific ontological traditions (e.g., common-sense realism vs. eliminativism).

  ---

  ## 1. Extensional Adequacy: Case Classification
  An adequate theory must provide truth-conditions for composition that yield plausible verdicts on paradigmatic and boundary cases.

  ### 1.1 Everyday Artifacts
  *   **Motivating Case:** A table, a bicycle, or a computer. These are the standard examples used in introductory mereology.
  *   **Requirement:** The theory must explain why certain arrangements of simples constitute an artifact whilst others (e.g., scattered debris) do not, or explicitly deny the existence of artifacts.
  *   **Status:** **Camp-Specific.** Common-sense realists treat this as non-negotiable; Nihilists and Organicists treat the non-existence of artifacts as a feature, not a bug.

  ### 1.2 Organisms with Complete Cellular Turnover
  *   **Motivating Case:** A human being or a tree over a decade. Biological entities replace nearly all their constituent matter over time whilst maintaining numerical identity.
  *   **Requirement:** The theory must account for persistence through material change without resorting to ad hoc temporal parts unless explicitly motivated. It must distinguish the organism from the mere succession of cells.
  *   **Status:** **Non-Negotiable (for Realists).** Any theory admitting composite objects must accommodate the diachronic identity of living beings, as this is empirically observable biological continuity.

  ### 1.3 Quantum-Entangled Pairs
  *   **Motivating Case:** Two electrons in a singlet state. Their properties are correlated in a manner that defies classical localisation, suggesting a form of ontological holism.
  *   **Requirement:** The theory must not rule out *a priori* that physical systems exhibiting non-separable states constitute a composite object. It must be compatible with the failure of supervenience of relations on intrinsic properties.
  *   **Status:** **Non-Negotiable.** A metaphysical theory cannot contradict settled physical facts regarding non-locality and entanglement.

  ### 1.4 Functional Aggregates (Synthetic-Biology Consortia)
  *   **Motivating Case:** A microbial consortium engineered to perform a metabolic task where individual species retain independent metabolism but display collective behaviour (e.g., quorum sensing, division of labour).
  *   **Requirement:** The theory must determine whether functional integration without physiological fusion warrants composition. It tests the boundary between 'life' and 'mechanism'.
  *   **Status:** **Non-Negotiable.** As biotechnology advances, metaphysics must accommodate these intermediate ontological categories rather than forcing a binary 'alive/dead' or 'one/many' distinction that contradicts biological function.

  ---

  ## 2. Intensional Adequacy: Conceptual Distinctions
  A theory must preserve necessary conceptual boundaries to avoid category errors or ontological collapse.

  ### 2.1 Genuine Composite vs. Mere Collection
  *   **Motivating Case:** A heap of sand versus a solid rock; a crowd versus a football team.
  *   **Requirement:** The theory must articulate a difference in being between objects that act causally as a unit and objects that are merely co-located or loosely associated.
  *   **Status:** **Non-Negotiable.** Failing to distinguish these leads to an inability to explain causal powers (e.g., why a hammer strikes but scattered hammer-parts do not).

  ### 2.2 Temporary vs. Essential Parts
  *   **Motivating Case:** A car with a replaced tyre versus a human with a lost limb.
  *   **Requirement:** The theory must specify whether parts are essential to the identity of the whole (Mereological Essentialism) or contingent. It must handle modal intuitions regarding destruction and survival.
  *   **Status:** **Camp-Specific.** Essentialism is favoured by those prioritising logical rigour; contingent parthood is favoured by those prioritising common-sense persistence conditions.

  ### 2.3 Composition vs. System Membership
  *   **Motivating Case:** A heart is *part of* an organism; an organism is *part of* an ecosystem.
  *   **Requirement:** The theory must distinguish the mereological relation (constitutive) from the systemic relation (functional/contextual). Not every system member is a mereological part.
  *   **Status:** **Non-Negotiable.** Conflating these relations leads to the 'ecological fallacy' in ontology, where arbitrary groupings are reified as objects.

  ---

  ## 3. Empirical Compatibility
  Metaphysical speculation is constrained by the best available scientific models.

  ### 3.1 Biological Individuation
  *   **Requirement:** The theory cannot contradict the criteria used in biology to individuate organisms (e.g., immunological boundaries, genetic continuity, metabolic autonomy).
  *   **Status:** **Non-Negotiable.** Metaphysics should not dictate biological taxonomy where empirical data is robust.

  ### 3.2 Conservation Laws and Localisation
  *   **Requirement:** The theory must not posit composite objects that violate conservation of mass-energy or imply impossible localisation (e.g., an object being in two places at once without a coherent account of multi-location).
  *   **Status:** **Non-Negotiable.** Compatibility with fundamental physics is mandatory.

  ---

  ## 4. Theoretical Tensions: Jointly Unsatisfiable Pairs
  A crucial part of the framework is recognising that no theory satisfies all desiderata simultaneously. The following pairs represent the primary trade-offs.

  ### 4.1 Common-Sense Ontology vs. Non-Vagueness
  *   **The Tension:** If composition is restricted (e.g., only to artifacts and organisms), the boundary of composition appears vague (e.g., when exactly do parts compose a whole?). If composition is precise (non-vague), it likely violates common sense (e.g., Unrestricted Composition).
  *   **Implication:** One must choose between accepting vague existence (ontological indeterminacy) or accepting counter-intuitive objects (trout-turkeys).
  *   **Resolution:** **Camp-Specific.** There is no consensus solution; the framework requires the theorist to declare which horn of the dilemma they accept.

  ### 4.2 Parsimony vs. Causal Explanation
  *   **The Tension:** Nihilism is maximally parsimonious (only simples exist) but struggles to explain macro-causal powers without elaborate paraphrasing. Realism explains causation naturally but inflates the ontology.
  *   **Implication:** One must weigh the virtue of quantitative parsimony against the virtue of explanatory power.
  *   **Resolution:** **Camp-Specific.** Eliminativists favour parsimony; Realists favour causal explanation.

  ### 4.3 Modal Flexibility vs. Transitivity of Parthood
  *   **The Tension:** Allowing parts to be contingent (Modal Flexibility) often complicates the transitivity of parthood (if A is part of B, and B part of C, is A part of C?). Strict transitivity often forces Mereological Essentialism.
  *   **Implication:** A theory may need to restrict transitivity to accommodate temporary parts, or restrict temporary parts to preserve transitivity.
  *   **Resolution:** **Methodologically Contested.** Depends on the underlying mereological system (Classical vs. Non-Classical).

  ---

  ## 5. Brief Comparative Scorecard
  *Emphasis remains on the criteria above; the following is a schematic application.*

  | Desideratum | Unrestricted Composition (Universalism) | Nihilism (Eliminativism) | Restricted Biological View (e.g., Van Inwagen) |
  | :--- | :--- | :--- | :--- |
  | **Everyday Artifacts** | **Pass** (Exists, but trivialised) | **Fail** (Denies existence) | **Fail** (Denies existence) |
  | **Organisms (Turnover)** | **Pass** (Composes, but persistence issues) | **Fail** (Only simples arranged organism-wise) | **Pass** (Central criterion) |
  | **Quantum Entanglement** | **Pass** (Composes) | **Fail** (No composites) | **Mixed** (Depends on 'life' definition) |
  | **Synthetic Consortia** | **Pass** (Composes) | **Fail** (No composites) | **Fail/Borderline** (Is it 'one life'?) |
  | **Composite vs. Collection** | **Fail** (No distinction; all compose) | **Pass** (Neither exist, only simples) | **Pass** (Life marks the distinction) |
  | **Non-Vagueness** | **Pass** (Composition is never vague) | **Pass** (Composition never occurs) | **Fail** (Boundary of life is vague) |
  | **Parsimony** | **Fail** (Ontologically profligate) | **Pass** (Maximally parsimonious) | **Pass** (Moderately parsimonious) |
  | **Scientific Compatibility** | **Pass** | **Pass** (With paraphrase) | **Pass** (Generally) |

  ### Analysis of the Scorecard
  *   **Unrestricted Composition** satisfies the logical desiderata (non-vagueness, transitivity) and scientific compatibility but fails the intensional distinction between composites and collections. It sacrifices common-sense ontology for logical simplicity.
  *   **Nihilism** satisfies parsimony and avoids vagueness but fails almost all extensional cases regarding macroscopic objects. It requires a robust error theory or paraphrase strategy to handle scientific discourse about organisms and entangled systems.
  *   **Restricted Biological View** aligns best with biological individuation and organismic persistence but struggles with the vagueness of 'life' (violating non-vagueness) and excludes artifacts (violating common-sense realism). It faces significant pressure from the synthetic-biology desideratum, as functional consortia blur the line of 'single life'.

  ## Conclusion
  This framework demonstrates that the evaluation of special composition theories is not merely a matter of counting objects. It requires navigating tensions between empirical adequacy, logical precision, and intuitive plausibility. For a doctoral thesis, the critical work lies not in finding a theory that satisfies all non-negotiable criteria (as such a theory may not exist), but in justifying which camp-specific preferences are adopted to resolve the jointly unsatisfiable pairs identified in Section 4.
