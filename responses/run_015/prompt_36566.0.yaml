prompt: |-
  I'm a software engineer with no legal training beyond what I've picked up from arguments at family dinners, and I'd like you to audit an analogy I've been leaning on. At work I maintain a large legacy codebase — most of it written a decade before I arrived, no comments, the original developers long gone. My working method there is completely settled: I don't try to reconstruct what the departed developer "intended"; I read what the code actually does, treat behavior that frustrates any reasonable purpose as a bug, and fix it through the normal patching process rather than by reinterpreting it into behaving differently. Over the holidays I argued to my sister-in-law, a litigation attorney, that courts should read statutes the same way: the legislature is the departed developer, the statute is the code, the judge is the maintenance engineer, and if the plain text produces an absurd or obsolete result, that's a bug for the legislature to patch through amendment — not something judges should paper over by consulting unobservable "legislative intent." This seemed obviously right to me, and I said so with some confidence, mostly by analogy to how impossible it would be to do my job if I had to reverse-engineer intent instead of reading the code.

  She pushed back on several fronts, and I want to know whether her objections break the analogy or merely bruise it. First, she said my analogy assumes code is "self-executing" — the behavior just is what the program does — whereas a statute is a message read by millions of citizens and agencies who adjust their conduct based on what they think it says, so "what the code does" and "what the text says" are not the same kind of thing at all. Second, she said the legislature, unlike my departed developers, is not dead: it can be petitioned, lobbied, and asked to amend, and pretending it's a ghost is itself a substantive choice about who should fix what. Third — and this one bothered me — she pointed out that I can only call something a "bug" in my codebase because I already know what the program is supposed to do; "unintended behavior" is unintelligible without an intended function, so the bug/patch vocabulary I was using to defend strict textualism quietly presupposes the purposivist's starting point. She capped it off with a case from 1892, Church of the Holy Trinity v. United States, where the Supreme Court read a statute literally barring contracts for "labor or service of any kind" as not covering a New York church that had hired an Anglican rector from England, because Congress had plainly been after cheap industrial labor, not clergy — a case textualists like Scalia have grumbled about for decades.

  So here is what I'd like from you. Lay out the analogy explicitly — the correspondence table, if you like: statute to code, legislature to the original dev team, judge to the maintenance engineer, amendment to a patch, an absurd literal application to a bug, ordinary meaning to documented behavior — and then assess each of my sister-in-law's three objections against it, plus any other disanalogies you think matter more than hers. Distinguish the disanalogies that genuinely undermine the use I was putting the analogy to (supporting textualist-style statutory interpretation) from the ones that don't. I'd also like to know whether the twist she identified is as devastating as it felt: does the fact that engineers need purposes to identify bugs mean the analogy actually supports purposivism instead, or is there a coherent textualist rejoinder — say, a distinction between using purpose to identify a problem versus using it to rewrite the text? Finally, tell me whether a better analogy from my world exists at all: if not legacy code, then perhaps a public API contract with many downstream consumers, or a specification that clients have relied on and can't be silently changed — something that captures what statutes are that code isn't. I'd appreciate a clear verdict on where my dinner-table argument actually lands once the audit is done.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Software engineer, no legal training, confident in their analogy between legacy code maintenance and statutory interpretation (textualism).
      *   **Context:** Argument with sister-in-law (litigation attorney) during holidays.
      *   **Core Analogy:** Statute = Code, Legislature = Original Devs, Judge = Maintenance Engineer, Amendment = Patch, Absurd Result = Bug, Textualism = Reading Code Behavior.
      *   **Sister-in-Law's Objections:**
          1.  Code is self-executing; statutes are instructions for humans (citizens/agencies).
          2.  Legislature isn't dead; they can be lobbied to fix "bugs."
          3.  "Bug" implies "intended function," so admitting bugs exist presupposes purposivism.
          4.  *Holy Trinity* case example (literal text vs. clear intent).
      *   **Tasks:**
          1.  Lay out the analogy explicitly (correspondence table).
          2.  Assess the three objections (break or bruise?).
          3.  Identify other significant disanalogies.
          4.  Address the "bug/purpose" twist (does it support purposivism?).
          5.  Propose a better analogy from the software world (e.g., API, Spec).
          6.  Give a clear verdict on the argument's strength.

  2.  **Deconstruct the Core Analogy:**
      *   *Statute* $\leftrightarrow$ *Source Code/Legacy Codebase*.
      *   *Legislature* $\leftrightarrow$ *Original Development Team*.
      *   *Judge* $\leftrightarrow$ *Maintenance Engineer*.
      *   *Amendment* $\leftrightarrow$ *Patch/Commit*.
      *   *Absurd Literal Result* $\leftrightarrow$ *Runtime Error/Logic Bug*.
      *   *Plain Meaning* $\leftrightarrow$ *Compiled Behavior/Output*.
      *   *Legislative Intent* $\leftrightarrow$ *Dev Comments/Commit Messages (often missing)*.

  3.  **Evaluate Objection 1: Self-Executing vs. Instructional:**
      *   *Claim:* Code runs itself; statutes tell people what to do.
      *   *Analysis:* This is a strong disanalogy. Code behavior is deterministic (mostly). Statutory behavior depends on human interpretation and compliance. If the "code" (statute) is ambiguous, the "runtime" (society) crashes or behaves unpredictably.
      *   *Impact:* Bruises the analogy. It highlights that *interpretation* is the runtime for law, whereas *compilation/execution* is the runtime for code. A judge isn't just reading output; they are defining the output for others.
      *   *Verdict:* Significant disanalogy, but doesn't kill textualism. It just means the "compiler" (judicial system) needs stable rules.

  4.  **Evaluate Objection 2: Legislature is Not Dead:**
      *   *Claim:* Devs are gone; legislators are reachable/lobbyable.
      *   *Analysis:* In practice, legislatures are often gridlocked (like a dev team that refuses to merge PRs). Treating them as "responsive" is an idealization. However, the *power* dynamic is different. A maintainer *cannot* change the code without permission (in a strict workflow), but a judge *can* effectively change legal outcomes via interpretation.
      *   *Impact:* Bruises the analogy. It highlights the separation of powers. If the maintainer patches without approval, they break the workflow. If the judge "interprets" too broadly, they usurp the legislature.
      *   *Verdict:* Supports textualism actually. If the legislature *can* patch, the judge *shouldn't* patch.

  5.  **Evaluate Objection 3: The "Bug" Presupposes Purpose (The Twist):**
      *   *Claim:* You can't call it a bug without knowing what it's *supposed* to do. Therefore, you need intent to find absurdity.
      *   *Analysis:* This is the strongest philosophical point. In software, "bug" = deviation from spec/requirement. If there is no spec (intent), there is only "behavior." Textualists argue the *text* is the spec. Purposivists argue the *goal* is the spec.
      *   *Rejoinder:* Textualists define "absurdity" not by secret intent, but by contradiction with the rest of the codebase (statutory scheme) or logical impossibility.
      *   *Impact:* Deep cut. It challenges the coherence of "absurdity" without intent.
      *   *Verdict:* Needs nuance. The analogy holds if "purpose" is derived from the *code structure* (internal coherence) rather than *dev diaries* (external intent).

  6.  **Evaluate *Holy Trinity*:**
      *   *Case:* Text said "any kind," Court said "not clergy."
      *   *Software Equivalent:* A function `banAllImports()` blocks *everything*, but the team clearly meant `banCheapLaborImports()`. The maintainer lets the clergy through.
      *   *Analysis:* Is this good maintenance? Or is it breaking the build? Textualists say break the build (let legislature fix). Purposivists say hotfix it.
      *   *Impact:* Illustrates the tension.

  7.  **Identify Other Disanalogies:**
      *   *Feedback Loop:* Code has unit tests/regression suites. Law has case law (but it's evolutionary).
      *   *Cost of Error:* Code bug = crash/loss of data. Legal bug = loss of liberty/rights.
      *   *Ambiguity:* Code compilers error on ambiguity. Law thrives on it sometimes.

  8.  **Develop a Better Analogy:**
      *   *Legacy Code:* Too internal.
      *   *Public API:* Better. Consumers rely on it. Breaking changes are bad.
      *   *Protocol Specification (RFC):* Even better. Multiple implementations (judges/agencies) must agree on the spec. If the spec is ambiguous, you don't guess intent; you look at the standard.
      *   *Smart Contracts:* Code is law, literally. But still relies on oracle inputs.
      *   *Selection:* **Public API Contract / Protocol Specification.** It captures the "reliance interest" of citizens (consumers) and the need for stability over "correctness."

  9.  **Drafting the Response:**
      *   *Tone:* Professional, respectful of both fields, analytical.
      *   *Structure:*
          1.  Correspondence Table.
          2.  Audit of Objections (Break vs. Bruise).
          3.  The "Bug/Purpose" Twist (Textualist Rejoinder).
          4.  Better Analogy (API/Spec).
          5.  Final Verdict.

  10. **Refining the "Bug" Argument (Crucial Step):**
      *   How does a textualist handle the "bug requires purpose" claim?
      *   *Argument:* The purpose is *in the text*. The "absurdity doctrine" isn't about guessing what they wanted; it's about recognizing when the text contradicts itself or reality so hard it ceases to function as code.
      *   *Software parallel:* If a function returns `null` when the type signature promises `int`, that's a bug *based on the signature*, not the developer's diary. The text *is* the spec.
      *   *Refinement:* Distinguish between "Subjective Intent" (diary) and "Objective Purpose" (type signature/function name). Textualists reject the former, accept the latter.

  11. **Refining the Verdict:**
      *   The user's analogy is strong on *institutional competence* (judges shouldn't patch) but weak on *semantic theory* (what words mean).
      *   The sister-in-law won on semantics; the user won on process.
      *   The API analogy bridges the gap better.

  12. **Final Review against Constraints:**
      *   Did I answer all parts? Yes.
      *   Is the tone appropriate? Yes.
      *   Is the legal/technical accuracy sound? Yes. (Need to be careful not to give legal advice, but analyzing legal theory is fine).

  *(Self-Correction during drafting)*: I need to make sure I don't take sides on whether Textualism is *correct*, but rather whether the *analogy* supports it. The prompt asks to audit the analogy, not the legal philosophy. However, the "Bug" objection attacks the internal logic of the analogy itself. I must address that.

  *(Refining the "Legislature is Not Dead" point)*: Actually, this is a point *for* the user. If the legislature *can* patch, the judge *should not*. The sister-in-law used it to say "they aren't ghosts," implying we should talk to them (via intent). The user can retort: "Exactly, they are on call, so page them, don't hack the prod." I need to make sure this nuance is clear.

  *(Refining the API Analogy)*: An API is good because of "Backward Compatibility." Citizens rely on statutes like devs rely on APIs. Changing behavior based on "intent" breaks the contract. This aligns perfectly with the user's textualist leanings.

  Okay, ready to write.
answer: |-
  This is a sophisticated collision of two complex systems: software maintenance and legal hermeneutics. Your sister-in-law is a skilled opponent; she identified the exact pressure points where the analogy leaks.

  Below is the audit of your analogy, an assessment of her objections, a proposed better analogy from your domain, and a final verdict on where your argument stands.

  ### 1. The Correspondence Table

  To audit the analogy, we must first formalize the mapping you proposed.

  | Legal Domain | Software Domain | Function in Analogy |
  | :--- | :--- | :--- |
  | **Statute** | **Legacy Codebase** | The authoritative artifact governing behavior. |
  | **Legislature** | **Original Dev Team** | The authors with the power to create/change the artifact. |
  | **Judge** | **Maintenance Engineer** | The actor authorized to interpret/fix the artifact in production. |
  | **Amendment** | **Patch / Commit** | The formal mechanism for changing behavior. |
  | **Plain Text** | **Compiled Behavior / Output** | What the system actually *does*, regardless of comments. |
  | **Legislative Intent** | **Dev Comments / Commit Messages** | External metadata explaining *why* code exists (often missing/outdated). |
  | **Absurd Result** | **Runtime Error / Logic Bug** | Behavior that crashes the system or violates obvious constraints. |
  | **Citizens** | **Downstream Services / Users** | Entities that rely on the artifact's stability to function. |

  ### 2. Audit of Sister-in-Law's Objections

  Here is the breakdown of whether her objections break the analogy (render it useless for your argument) or merely bruise it (require nuance but leave the core intact).

  #### Objection 1: Code is Self-Executing; Statutes are Instructions
  *   **Her Point:** Code runs on a CPU; statutes run on human brains. "What the code does" is physics/logic; "what the statute says" is semantics/psychology.
  *   **Assessment:** **Bruise.**
  *   **Analysis:** This is a category error, but it doesn't defeat your institutional argument. In software, the "compiler" is deterministic. In law, the "compiler" is the judicial system + societal compliance. However, your core point was about *who fixes errors*, not *how execution happens*.
  *   **Why it doesn't break the analogy:** Even if statutes are instructions, the *Maintenance Engineer* (Judge) still faces the choice: Do I follow the instruction literally and let the user (Citizen) crash, or do I rewrite the instruction on the fly? The distinction between "execution" and "interpretation" complicates the *mechanism*, but not the *authority* dynamic.
  *   **Verdict:** It highlights that judges have more discretion than compilers, but it doesn't invalidate the claim that they should exercise that discretion narrowly.

  #### Objection 2: The Legislature is Not Dead
  *   **Her Point:** Original devs are gone; legislators can be lobbied to fix bugs. Treating them as "ghosts" is a choice.
  *   **Assessment:** **Backfires (Supports You).**
  *   **Analysis:** This is actually your strongest point, though she framed it as a weakness. In software, if the original team is *still around* and has merge access, a maintenance engineer *never* hotfixes production directly. They file a ticket.
  *   **The Rejoinder:** If the legislature is "alive" (capable of amending), that reinforces Textualism. If the "dev team" is on-call, the "maintainer" (Judge) should not be merging code to `main`. The fact that they *can* be petitioned means the proper channel for fixing a "bug" (absurd result) is the amendment process, not judicial interpretation.
  *   **Verdict:** This objection fails to break the analogy; it strengthens the Textualist position that judges should not patch code when the original authors retain write access.

  #### Objection 3: "Bug" Presupposes Purpose (The Twist)
  *   **Her Point:** You can't identify a bug without knowing the intended function. Therefore, admitting "absurd results" exist requires consulting intent (Purposivism).
  *   **Assessment:** **Break (with a potential patch).**
  *   **Analysis:** This is the most philosophically damaging objection. In software, a "bug" is defined as *deviation from specification*. If the code *is* the specification (Textualism), then the code cannot deviate from itself. To call something a bug implies there is a "true" specification elsewhere (Intent).
  *   **The Textualist Rejoinder:** You can salvage this by distinguishing between **Subjective Intent** (what the devs thought in their heads) and **Objective Purpose** (what the code structure implies).
      *   *Software Parallel:* If a function is named `calculateTax()` but returns `userName`, that is a bug. You didn't need to ask the developer what they *felt*; the type signature and function name (the text's context) declared the purpose.
      *   *Legal Application:* Textualists argue the "purpose" is found in the *structure of the statute itself*, not in committee reports. If a law bans "vehicles in the park," and you try to apply it to an ambulance, the "bug" isn't that it violates the devs' dreams; it's that it violates the *internal coherence* of the legal codebase (e.g., other laws requiring emergency access).
  *   **Verdict:** This breaks the analogy *if* you define "bug" as "violation of secret developer intent." It holds *if* you define "bug" as "violation of the system's internal logic or type safety." *Holy Trinity* is the example where the Court decided the "type signature" (the word "labor") was wrong and overrode it with the "commit message" (we meant industrial labor). A strict engineer would say: "The type signature is the contract. Fix the signature."

  ### 3. Other Significant Disanalogies

  There are two disanalogies that matter more than your sister-in-law's objections, both of which lean against your position.

  **A. The Cost of "Crashing"**
  *   **Software:** If legacy code has a bug, the service might degrade. We prioritize uptime, but we can roll back.
  *   **Law:** If a statute is applied literally and causes an "absurd" result (e.g., a man goes to jail for a technicality that violates justice), the "system crash" is a loss of liberty or rights.
  *   **Impact:** Engineers are trained to prefer "it works" over "it's pure." Judges are sworn to uphold "justice" over "syntax." This suggests the "Maintenance Engineer" in law has a higher duty to intervene than a software maintainer does.

  **B. Ambiguity is a Feature, Not a Bug**
  *   **Software:** Ambiguity (undefined behavior) is always a bug. The compiler errors out.
  *   **Law:** Ambiguity is often intentional compromise. Legislatures *want* vague language to get a bill passed.
  *   **Impact:** In code, `void*` is dangerous. In law, "reasonable" is necessary. Treating all ambiguity as a "bug" to be fixed by the legislature ignores that the "devs" intentionally shipped technical debt to meet a deadline (election cycle).

  ### 4. A Better Analogy: The Public API Contract

  Your legacy code analogy fails because it assumes the code is internal. A better analogy from your world is a **Public API with Semantic Versioning.**

  *   **The Statute = The Public API Specification.**
  *   **The Citizens = Downstream Developers** building apps on top of your API.
  *   **The Judge = The API Gateway / Version Manager.**
  *   **The Legislature = The Platform Owner.**

  **Why this works better:**
  1.  **Reliance Interests:** Citizens rely on statutes like devs rely on APIs. If you change the behavior of `getUser()` based on "what we intended" rather than "what the docs say," you break downstream applications. This captures the **Rule of Law** value of predictability.
  2.  **Versioning:** When a behavior is truly broken (a security flaw/absurdity), you don't silently patch it in v1. You deprecate it and release v2 (Amendment). This mirrors the legislative process.
  3.  **Documentation as Law:** In a Public API, the *documentation* is the contract. If the code does one thing but the docs say another, the docs usually win for the consumer. In Textualism, the *text* is the documentation.

  **How it handles the "Bug" Objection:**
  In an API, if the documentation says "Returns Integer" and it returns `null`, that is a breaking change. You don't guess *why* the dev returned null. You fix the implementation to match the contract. If the contract itself is wrong (e.g., "Returns Integer" but the business logic requires a String), the Platform Owner (Legislature) must issue a v2. The Gateway (Judge) cannot silently coerce the type without breaking the contract for everyone else.

  ### 5. The *Holy Trinity* Revisited

  In your API analogy, *Holy Trinity* looks like this:
  *   **API Doc:** `banContractors(type: "any")`
  *   **Implementation:** Blocks the Anglican Rector.
  *   **Court:** "We know the Platform Owner meant `banContractors(type: "industrial")`."
  *   **Action:** The Court allows the Rector through, effectively rewriting the function logic at runtime.

  **Textualist View:** This breaks the API contract. Downstream users (other churches, employers) can no longer trust the `banContractors` definition. They must now guess the "spirit" of the function, not read the docs.
  **Purposivist View:** Blocking the Rector causes a system crash (violation of religious freedom/intent). A hotfix is required to keep the platform running.

  ### 6. Final Verdict

  **Where your argument lands:**
  You won the **Institutional** argument, but you lost the **Semantic** argument.

  1.  **Institutional (Win):** Your analogy successfully demonstrates *why* judges should be reluctant to "patch" statutes. Just as a maintenance engineer shouldn't merge unreviewed code to production because it breaks the workflow and accountability, judges shouldn't amend statutes because it bypasses the democratic "merge request" process. Your sister-in-law's point that the legislature is "not dead" actually helps you here: if they are alive, page them.
  2.  **Semantic (Loss):** Her "Bug" objection (Objection 3) successfully exposed a weakness in your logic. You cannot coherently call a result "absurd" without a metric of "intended function." If you reject "legislative intent" as a metric, you struggle to define "absurdity" without smuggling in your own policy preferences. The *Holy Trinity* case shows that sometimes the "code" is so clearly wrong relative to the "system requirements" that a runtime patch is the only way to prevent a crash.

  **The Verdict:**
  Your dinner-table argument is **70% sound.** It is an excellent defense of *Judicial Restraint* and *Predictability* (The API Contract view). However, it is not a complete defense of *Textualism* in the hard cases.

  To salvage the remaining 30%, you must adopt the **API Contract** analogy and concede that "Purpose" is not a ghost in the machine, but the **Type Signature** of the law. You can look at the structure of the code (the whole statute) to infer the type signature without reading the devs' diaries (committee reports).

  **Advice for the next dinner:**
  Tell her you've refactored your argument. You concede that "bugs" require a spec, but argue that the **Text is the Spec**, not the Intent. Tell her you are treating the Statute like a **Public API**: citizens rely on the documented interface (the text), not the internal implementation details (the intent). If the API is broken, the Platform Owner (Legislature) must release a new version, or the ecosystem loses trust in the contract. This preserves your textualist conclusion while answering her critique about purpose.
