answer: |-
  Here is the specification for a moral theory capable of resolving the deontological paradox while accounting for your mirror problem insight.

  ### Part 1: The Specification List

  #### A. Case Coverage (Output Requirements)
  These are the specific verdicts the theory must generate to be considered a successful resolution of the paradox you described.

  1.  **The Bridge Verdict**
      *   **Requirement:** The theory must explain why pushing the one person is prohibited, even though it saves five.
      *   **Reason:** This is the foundational intuition driving the deontological position. If the theory concludes pushing is mandatory, it has dissolved the paradox by becoming consequentialism, not resolved it.
      *   **Status:** Non-negotiable (for a deontological resolution)

  2.  **The Promise Verdict**
      *   **Requirement:** The theory must uphold a promise even when breaking it yields a marginal net benefit, provided the harm of breaking is not catastrophic.
      *   **Reason:** This tests the binding nature of obligations against the pull of overall good. It ensures the theory protects individual claims against aggregate welfare.
      *   **Status:** Non-negotiable (for a deontological resolution)

  3.  **The Mirror Verdict**
      *   **Requirement:** The theory must explain why refusing to push is not merely prioritizing the agent's moral purity over the victims' lives. It must show that the agent is respecting the victims' status, not just their own hands.
      *   **Reason:** This addresses your specific insight. If the theory cannot answer this, it leaves the agent vulnerable to the charge of moral narcissism (valuing their own innocence over others' survival).
      *   **Status:** Non-negotiable (Core to your specific request)

  #### B. Conceptual Distinctions (Structural Requirements)
  These are the philosophical tools the theory must retain to remain distinct from utilitarianism.

  4.  **Doing vs. Allowing**
      *   **Requirement:** The theory must maintain a moral difference between actively causing harm and passively allowing harm, without making allowing harm morally invisible.
      *   **Reason:** Collapsing this distinction eliminates the basis for refusing to push the person. However, making the distinction too wide invites the mirror problem (that allowing harm is too easy to justify).
      *   **Status:** Non-negotiable

  5.  **Intention vs. Foreseeability**
      *   **Requirement:** The theory must distinguish between harm intended as a means or end and harm merely foreseen as a side effect.
      *   **Reason:** This helps explain why pushing (using the person) is worse than switching a track (where death is a side effect). It is essential for navigating the bridge case without banning all risky actions.
      *   **Status:** Non-negotiable

  6.  **Agent-Relative vs. Agent-Neutral Duties**
      *   **Requirement:** The theory must explain why I have a special duty not to kill that is stronger than my duty to prevent killing by others.
      *   **Reason:** This is the only logical space where refusing to save five by killing one makes sense. It grounds the restriction in the agent's own agency rather than the state of the world.
      *   **Status:** Non-negotiable

  #### C. Empirical and Psychological Constraints
  These requirements ensure the theory fits human reality.

  7.  **Moral Residue**
      *   **Requirement:** The theory must account for the feeling of guilt or regret even when the agent does the right thing (e.g., feeling terrible about letting the five die).
      *   **Reason:** If the theory says the agent did the perfect moral duty, yet the agent feels guilt, the theory is psychologically incomplete. It needs to validate that tragedy exists even in right action.
      *   **Status:** Non-negotiable

  8.  **Motivational Realism**
      *   **Requirement:** The theory must not require agents to have superhuman calculation abilities or emotional detachment.
      *   **Reason:** A theory that contradicts how humans actually process moral decisions will fail in practice. It must align with our capacity for rule-following and emotional response.
      *   **Status:** Non-negotiable

  9.  **Social Trust Stability**
      *   **Requirement:** The theory must support a system where people can rely on promises and safety from aggression.
      *   **Reason:** Real-world behavior shows that societies function on trust. A theory that encourages breaking promises for slight gains undermines the social fabric required for morality to exist.
      *   **Status:** Camp Preference (Consequentialists argue trust is only valuable for outcomes, but deontologists view it as intrinsic)

  ---

  ### Part 2: Incompatibilities (The Trade-offs)

  You asked to see where these requirements clash. A theory that satisfies all of the above perfectly is likely impossible. Here are the critical friction points:

  **1. The Mirror Problem vs. The Doing/Allowing Distinction**
  *   **Conflict:** To solve the Mirror Problem, you must argue that letting the five die is also a serious moral failure (otherwise you are just valuing your purity). But if letting die is a serious moral failure comparable to killing, the distinction between Doing and Allowing collapses.
  *   **Result:** You cannot fully vindicate the agent's innocence (solving the Mirror Problem) while maintaining a strong barrier against killing (preserving the Distinction). You must accept some moral dirt either way.

  **2. Agent-Relative Duties vs. Overall Good**
  *   **Conflict:** The requirement to prioritize your own duty not to kill (Agent-Relative) directly contradicts the requirement to minimize total death (Overall Good).
  *   **Result:** You cannot satisfy the Bridge Verdict and also claim to maximize the good. You must explicitly reject the maximization of the good as the sole standard of rightness.

  **3. Moral Residue vs. Objective Rightness**
  *   **Conflict:** If the theory says Refusing to Push is the Objectively Right Action, why is there Moral Residue (guilt)? Usually, guilt implies wrongdoing.
  *   **Result:** The theory must redefine guilt not as a signal of error, but as a recognition of tragedy. If it fails to do this, it contradicts the psychological constraint.

  ---

  ### Part 3: Scorecard of Usual Suspects

  Here is how existing frameworks stack up against your specification.

  **1. Strict Kantianism**
  *   **Bridge Case:** Pass. (Never use humanity as a means.)
  *   **Promise Case:** Pass. (Perfect duties are binding.)
  *   **Mirror Problem:** Fail. (Struggles to explain why letting die isn't just valuing your own rationality over their lives. Often accused of prioritizing agent integrity over victim welfare.)
  *   **Distinctions:** Pass. (Strong on intention and means/ends.)
  *   **Psychology:** Mixed. (Demands high rationality; struggles with moral residue.)
  *   **Verdict:** Strong on rules, weak on the mirror critique.

  **2. Rule Utilitarianism**
  *   **Bridge Case:** Mixed. (Depends on whether the rule do not kill generally produces more utility. Can collapse into act utilitarianism in extreme cases.)
  *   **Promise Case:** Mixed. (Will break the promise if the rule itself ceases to be useful in that context.)
  *   **Mirror Problem:** Pass. (Focuses on overall welfare, so the agent's purity is irrelevant. However, this dissolves the deontological intuition rather than resolving it.)
  *   **Distinctions:** Fail. (Ultimately collapses doing vs. allowing based on outcomes.)
  *   **Psychology:** Fail. (Requires calculation that humans are bad at.)
  *   **Verdict:** Solves the mirror problem by removing the deontological constraint entirely.

  **3. Virtue Ethics**
  *   **Bridge Case:** Pass. (A virtuous person would not see pushing as an option.)
  *   **Promise Case:** Pass. (Keeping promises is part of integrity.)
  *   **Mirror Problem:** Pass. (Focuses on character. The agent isn't valuing purity, but expressing who they are. However, critics say this is just egoism renamed.)
  *   **Distinctions:** Mixed. (Focuses on the agent rather than the act, so distinctions blur.)
  *   **Psychology:** Pass. (Aligns well with human development and emotion.)
  *   **Verdict:** Best fit for the mirror problem and psychology, but lacks clear action guidance in hard cases.

  ### Summary Recommendation
  To build your own resolution, you likely need a hybrid. You need the **action guidance** of deontology (to keep the Bridge and Promise verdicts) combined with the **character focus** of virtue ethics (to handle the Mirror Problem and Moral Residue). You must accept that the Doing vs. Allowing distinction cannot be absolute; it must be a presumption that can be outweighed, otherwise the Mirror Problem remains unsolved.
