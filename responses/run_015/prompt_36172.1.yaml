  2.  **Deconstruct the Ellsberg Paradox (Standard Version):**
      *   *Two-Urn Experiment:* Urn A (50 Red, 50 Black). Urn B (100 Red/Black, ratio unknown). Bet on Red. Most prefer Urn A. Bet on Black. Most prefer Urn A.
      *   *Three-Urn Experiment (Standard Ellsberg):* Urn with 30 Red, 60 Black/Yellow (unknown split).
