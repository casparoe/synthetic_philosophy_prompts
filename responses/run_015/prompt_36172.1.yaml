          *   Act $g$: Win if Black.
          *   Act $f'$: Win if Red or Yellow.
          *   Act $g'$: Win if Black or Yellow.
          *   Preference: $f \succ g$ and $g' \succ f'$.
      *   *Violation:* This violates Savage's Sure-Thing Principle (STP) and Subjective Expected Utility (SEU). If $P(R) > P(B)$, then $P(R \cup Y) < P(B \cup Y)$ (since $P(Y)$ cancels out). Ellsberg preferences imply $P(R) > P(B)$ AND $P(B \cup Y) > P(R \cup Y) \implies P(B) > P(R)$. Contradiction.

  3.  **Translate to Quant Vocabulary:**
      *   *Savage/SEU:* Single probability measure $P$. Utility maximization $E_P[u]$.
