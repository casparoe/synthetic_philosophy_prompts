answer: |-
  Here is the audit. I have ranked the tensions by severity, identified the load-bearing claims, and evaluated your cases against your own criteria.

  ### 1. The Single Revision That Cleans Up the Most
  **Revise (4).**
  Current: *"At a given layer, some ways of carving up activation space carve at the joints..."*
  Proposed: *"At a given layer, some ways of carving up **computational role space** carve at the joints..."*

  **Why:** This resolves the severe tension with (6) and aligns with (3). Your current (4) commits you to a geometric realism about the *activation vectors* themselves. Your (6) commits you to the contingency of those vectors across seeds. If the vehicle (geometry) changes but the role survives, the "joints" cannot be in the activation space geometry; they must be in the functional/causal structure.
  **Cost:** You lose the hope that there is a single, universal "basis" for a layer across models. Interpretability becomes the search for invariant *functions*, not invariant *directions*. This makes the math harder but saves your ontology.

  ---

  ### 2. Ranked Tensions

  #### **Tension 1: (4) Privileged Decomposition vs. (6) Vehicle Anti-essentialism (Severity: High)**
  *   **The Conflict:** (4) asserts a fact of the matter about carving *activation space*. (6) asserts that the mapping from function to activation pattern is contingent (seed dependence). If Seed 1 implements "gap-parity" via Direction $D_1$ and Seed 2 via Manifold $M_2$, there is no privileged decomposition of the *activation space* that captures both. There is only a privileged decomposition of the *functional space*.
  *   **The Smuggle:** (4) smuggles in a geometric essentialism you explicitly disavow in (3) and (6). It sounds like you want the "joints" to be linear directions (or fixed manifolds) intrinsic to the layer, rather than intrinsic to the *computation*.
  *   **Cheapest Fix:** Adopt the revision suggested above. Shift the "joints" from the vector space to the causal graph.
  *   **Cost:** You concede that "activation space" itself is a messy implementation detail. This weakens the claim that SAEs (which decompose activation space) are *directly* finding the joints. They are finding *candidates* for the joints, which must be validated by (2).

  #### **Tension 2: (2) Causal Dependence vs. Case B "4% Usage" (Severity: Medium)**
  *   **The Conflict:** (2) requires the system's success to counterfactually depend on the state. In Case B, the feature is causally necessary on only 4% of inputs. If you ablate it, the system still succeeds on 96% of inputs. Does "system success" depend on it?
  *   **The Risk:** If you set the threshold too low (4% is enough), you risk inflating the ontology with features that are barely used. If you set it too high, you lose Case B.
  *   **Cheapest Fix:** Clarify "success" in (2) to mean *capacity* or *distributional performance*, not *instance-level necessity*. The system's success *on the task distribution* depends on the feature, even if individual instances do not.
  *   **Cost:** You must accept that a representation can be "dormant" for most inputs. This complicates the "read-out" requirement, as standard probes might miss features that only fire on edge cases.

  #### **Tension 3: (1) Moderate Realism vs. (5) Deflationism about Belief (Severity: Low)**
  *   **The Conflict:** You claim representations are real (1) but belief ascriptions are instrumental (5). The boundary is unstable. If a network represents "gap-parity" (real) and uses it to generate tokens, why is ascribing "belief that parity is odd" instrumental?
  *   **Analysis:** This is a standard sub-personal vs. personal-level distinction, but in transformers, the line is blurry.
  *   **Cheapest Fix:** Explicitly scope (1) to *sub-personal computational states* and (5) to *personal-level propositional attitudes*.
  *   **Cost:** You must defend the claim that transformers have sub-personal states without having personal levels. (This is standard philosophy of mind, so likely low cost for you, but worth noting as a boundary condition).

  ---

  ### 3. Audit of Cases Against Claim (2)

  Does criterion (2) deliver your verdicts?

  **Case A (Shadow Features): Verdict = Not a Representation.**
  *   **Does (2) deliver this?** **Yes.**
  *   **Reasoning:** (2) requires downstream consumption such that success counterfactually depends on the state. You state: "when you ablate it... literally nothing happens, and no downstream component's behaviour covaries."
  *   **Audit:** This is a clean fail of the causal clause. The informational clause is met (it correlates), but the teleological/consumption clause is not. Your verdict follows strictly from (2).
  *   **Note:** This validates (7). Most papers find the correlation (info) and stop, missing the consumption check.

  **Case B (Gap-Parity): Verdict = Representation.**
  *   **Does (2) deliver this?** **Yes, but precariously.**
  *   **Reasoning:**
      *   *Info:* Met (perfectly correlated).
      *   *Consumption:* Met (causally necessary on 4% of inputs).
      *   *Dependence:* As noted in Tension 2, this depends on defining "system success" as distributional competence. If you define success as "getting every token right," it fails. If you define it as "solving the task to the best of the model's ability," it passes.
  *   **Audit:** The verdict holds, but it relies on the "4%" being sufficient for counterfactual dependence of *overall* success.
  *   **Crucial Point:** Your verdict on Case B relies heavily on (6) (Anti-essentialism). You justify calling it a representation *despite* the seed dependence. (2) does not care about seed dependence; it only cares about causal role *in this network*. So (2) justifies the status *within* Seed-1. (6) justifies why we generalize the label "gap-parity representation" across seeds despite vehicle change. You need both (2) and (6) to secure Case B.

  ---

  ### 4. Idle Claims and Smuggled Assumptions

  **Claim (3) Method Neutrality:**
  *   **Status:** **Load-Bearing but Redundant.**
  *   **Analysis:** It does important work blocking the Linear Representation Hypothesis from becoming a definition. However, it is largely implied by (6). If vehicles are anti-essential, they obviously don't have to be linear. You can keep it for clarity, but it's not doing independent work.

  **Claim (7) Critique of Field:**
  *   **Status:** **Idle.**
  *   **Analysis:** This is a sociological consequence of (2). It doesn't constrain your ontology. It's a prediction, not a premise. You can drop it from the core package without affecting the consistency of (1)-(6).

  **Smuggled Assumption in (4):**
  *   **The Issue:** "Decomposition" implies a sum of parts (e.g., $v = f_1 + f_2 + ...$). If you accept (3) (nonlinear features) and (6) (manifolds), "decomposition" is the wrong mathematical term. A partition of manifolds is not a decomposition of a vector space.
  *   **Fix:** As noted in the "Single Revision," switch to "functional decomposition" or "causal factorization."

  **Claim (5) Deflationism:**
  *   **Status:** **Potential Liability.**
  *   **Analysis:** You say belief ascription is *only* instrumentally useful. But if (1) is true (representations are real) and beliefs are just complex clusters of representations + functional roles, why aren't beliefs real?
  *   **Risk:** Your committee may press you on why "gap-parity" is ontologically robust but "believes Paris is in France" is not.
  *   **Fix:** Ensure you have a clear "level" distinction ready (sub-personal mechanism vs. personal-level stance). If you don't, (5) undermines (1).

  ### Summary Recommendation
  1.  **Rewrite (4)** to refer to *computational role space* rather than *activation space*. This dissolves the conflict with (6) and (3).
  2.  **Clarify (2)** to specify that counterfactual dependence applies to *distributional performance*, not instance-level necessity (saves Case B).
  3.  **Drop (7)** from the core ontological package; it's a corollary.
  4.  **Prepare a defense** for the boundary between (1) and (5) (sub-personal vs. personal).

  Your package is 85% coherent. The geometry/functionalism clash in (4)/(6) is the only thing that threatens to break the realism claim (1). Fix (4), and the rest holds.
