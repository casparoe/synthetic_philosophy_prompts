  6.  **Evaluating Claim (2) against Cases A & B:**
      *   **Case A:** (2) requires downstream consumption/counterfactual dependence. Case A has *none* (ablation does nothing). Verdict: Not a representation. **Matches.**
      *   **Case B:** (2) requires info + downstream consumption. Case B has info (perfect correlation) + consumption (4% causal necessity). Verdict: Representation. **Matches**, *provided* 4% counts as "system success dependence."
      *   *Smuggled Assumption:* In Case B, you rely on (6) (seed dependence) to justify it's still a representation despite vehicle change. But (2) doesn't mention vehicles. (2) works fine with (6).
      *   *Problem:* In Case A, you mention "shadow cast by real computation." This implies the feature *correlates* with something real but isn't *used*. (2) handles this.
      *   *Problem:* In Case B, you mention "only findable with nonlinear probe." (2) is neutral on linearity, so it handles this.
