  hey im a retired marine biologist who just started auditing philosophy classes, so bear with me if this is muddled. i was reading about peirce versus james on truth — peirce with that inquiry-based idea where belief gets fixed through community investigation, and james saying truth is basically what works in practice over time. then i got to wondering about these big language models that spit out sentences with no beliefs or investigators behind them at all. if peirce and james were alive today, how do you think each would judge whether an LLM can have true outputs? i feel like peirce might say no, since theres no real inquiry going on, just statistical weights, but james might be more open if the outputs keep being useful. but am i conflating james with thier later followers? also, heres a weirder thought: could a pragmatist say that the models calibration error — basically how far off its predictions are on average — is actually the real measure of its truth, rather than any single statement? i dont need citations or a reading list, just want to check if im thinking straight before i email my professor.
