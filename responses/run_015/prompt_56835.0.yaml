answer: |-
  The mechanic is a bounded, non-uniform prior distribution over envelope pairs that forces conditional probabilities to diverge from 0.5 at specific observed values.

  ### Materials
  *   **48 Opaque Envelopes:** Numbered 1–48 on the inside (invisible to students) to track pairs if needed, but externally identical.
  *   **Token Slips:** Printed values of 10, 20, and 40. (Prepare 36 slips of 10, 48 slips of 20, 12 slips of 40).
  *   **Record Sheets:** One per student, columns for: Round, Observed Value ($V$), Decision (Switch/Stay), Final Value ($F$), Net Gain ($F-V$).
  *   **Currency:** "Seminar Points" (SP). Start each student with 100 SP. End-of-class conversion: 10 SP = 1 participation point.

  ### Banker's Role & Secret Knowledge
  *   **You (The Banker):** Know the exact distribution. You do **not** reveal this.
  *   **The Setup:** Before class, stuff the 48 envelopes into 24 pairs according to this fixed distribution:
      *   **18 Pairs:** Contain (10, 20).
      *   **6 Pairs:** Contain (20, 40).
      *   *Total:* 36 envelopes have 10, 48 envelopes have 20, 12 envelopes have 40. (Wait, math check: 18 pairs * 1 ten = 18 tens. 18 pairs * 1 twenty = 18 twenties. 6 pairs * 1 twenty = 6 twenties. 6 pairs * 1 forty = 6 forties. Total: 18 tens, 24 twenties, 6 forties. Total 48 envelopes.)
      *   **Correction for Distribution:** To ensure the 0.75/0.25 conditional probability for seeing a 20:
          *   18 Pairs of (10, 20).
          *   6 Pairs of (20, 40).
          *   Envelopes containing 20: 18 (from first set) + 6 (from second set) = 24.
          *   If a student sees 20, probability it came from (10,20) is 18/24 = 0.75. Probability it came from (20,40) is 6/24 = 0.25.
          *   EV(Switch | See 20) = $0.75(10) + 0.25(40) = 17.5$. Since $17.5 < 20$, **Stay** is correct.
          *   EV(Switch | See 10) = $20$. **Switch** is correct.
          *   EV(Switch | See 40) = $20$. **Stay** is correct.
  *   **During Play:** Distribute one pair per student. Collect and reshuffle pairs between rounds to maintain the distribution without restuffing. Pay out Net Gains immediately or track on board.

  ### Timeline (75 Minutes)
  *   **00–10: Setup.** Distribute 100 SP endowment and Record Sheets. Explain rules: Open one envelope, see value $V$, decide Switch or Stay, record Final Value $F$. Net Gain = $F - V$. Goal: Maximize total Net Gain over 4 rounds.
  *   **10–40: Gameplay (4 Rounds).**
      *   *Round Start:* Distribute pairs.
      *   *Action:* Students open Envelope A. Record $V$.
      *   *Calculation:* Ask students to write down the Expected Value of switching based on $V$. (Most will write $1.25V$).
      *   *Decision:* Choose Switch or Stay. Reveal Envelope B if switched. Record $F$ and Net.
      *   *Rotation:* Collect pairs, shuffle, redistribute to neighbor.
      *   *Round End:* Tally Net Gain for the round.
  *   **40–50: Data Aggregation.** Draw a table on the board with rows for Observed Values (10, 20, 40). Ask students to shout out their Net Gains for each value seen. Fill the table.
      *   *Expected Result:* Net Gain for $V=10$ will be consistently positive. Net Gain for $V=40$ will be consistently negative. Net Gain for $V=20$ will be negative (averaging -2.5 per round).
  *   **50–60: The Crash.** Ask students to show their written EV calculations. They will show $0.5(2V) + 0.5(V/2) = 1.25V$. Point to the $V=20$ data on the board. "Your formula predicts +5 SP. The data shows -2.5 SP. The formula is wrong."
  *   **60–75: Debrief.**

  ### Debrief: Mapping Play to Paradox
  1.  **The Symmetry Problem:** Ask why they wrote 0.5 for the probability. They will say "It's equally likely to be half or double." Point out that this symmetry holds for the *pair generation* but not for the *conditional probability* given a specific observed value in a bounded set.
  2.  **Smuggling the Prior:** The 1.25 calculation assumes $P(\text{Other}=2V | \text{See } V) = 0.5$ for all $V$. The data proves this is false for $V=20$ (where it is 0.25) and $V=40$ (where it is 0).
  3.  **The Threshold:** Highlight that switching was rational for $V=10$ but irrational for $V=20$ and $V=40$. The "Always Switch" strategy fails because it ignores the information contained in the magnitude of $V$ relative to the hidden bound.

  ### Predictable Failures & Limitations
  *   **What Will Go Wrong:** Students will aggregate data across all values ("Switching won 50% of the time overall") rather than conditioning on $V$. You must force the board table to be split by Observed Value to reveal the threshold. Also, students may lose track of their SP; keep a running tally on the projector.
  *   **The Bounded Limitation:** This game resolves the paradox by making the prior **proper** (bounded). It does not reproduce the philosophical tension of the unbounded case, where no maximum exists and the symmetry intuition feels stronger. You must supply the explanation that the paradox relies on an impossible "uniform distribution over all positive numbers," which this finite pot explicitly forbids. The game demonstrates the *mathematical error* (ignoring the prior) but not the *epistemic temptation* of the infinite case.
