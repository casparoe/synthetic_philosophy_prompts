prompt: |-
  I teach an undergraduate philosophy-of-probability seminar — 24 students, one 75-minute session. They have had expected value and conditionalization but nothing on paradoxes. Design an in-class game that puts the two-envelope problem in their hands: they should generate the 1.25A calculation themselves, bet on it, and watch it fail, all before anyone names the paradox. Use a token currency convertible into participation points rather than real money.

  I want the envelopes filled from a finite pot: the smaller amount in each pair drawn from a bounded set of token values according to a distribution you choose, with students playing repeated rounds so they accumulate frequencies. Do the math and make sure your chosen distribution yields a genuine threshold — some observed amounts where switching really is correct and some where it is not — and build into the round structure a way for participants to find that threshold empirically instead of being told it.

  Give me the rules, materials, the banker's role and exactly what the banker knows that the players don't, a timeline, and a debrief that maps particular moments in play onto the symmetry problem and onto the step where a prior gets smuggled in. Then tell me what will predictably go wrong the first time I run it, and which feature of the paradox a bounded pot cannot reproduce, so I know what I have to supply myself.

  Begin with a single sentence naming the mechanic that will produce the failure, then give the plan. No preamble and no restating my setup.
