  hey so im about eight weeks pregnant and suddenly this philosophy thing isnt just academic — im trying to wrap my head around L.A. Paul’s transformative experience idea, where picking a big life change like having a kid is rationally weird because you cant know what its like until youre already changed. but i also keep coming back to this framing i invented, call it value-drift without closure: your priorities can shift radically not because you learn some hidden first-person fact, but because the old decision-maker literally stops being relevant and theres no epistemic bridge back. can you compare Paul’s actual theory with this value-drift framing? i want to know if they really disagree about whether theres a rational failure in pre-transformation choice, or if the real split is over whether post-change preferences should count as belonging to the same person. also, where exactly does the problem sit — in what we can know, or in who gets to decide? keep it casual, im writing between nausea waves, and dont bother with citations or a reading list, just map the concepts for me.
