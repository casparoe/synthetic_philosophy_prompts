answer: |-
  Let $V$ denote the expected welfare gain of a candidate intervention. The scale argument formalizes $V$ as the product of three terms: $V = N \times C \times S$. Here, $N$ represents the population size affected by the intervention. $C$ represents the credence factor, defined as the decision-maker's subjective probability that members of the population possess the capacity for valenced conscious states. Crucially, $C$ is treated as correlated across the population; it reflects uncertainty about the moral status of the kind, not independent probabilities per individual. $S$ represents the sign factor, defined as the expected per-capita net welfare difference produced by the intervention, averaged over affected individuals. The Redirection Thesis contends that $N$ amplifies the magnitude of $V$ but determines neither its sign nor its action-guiding force. Because $N$ is a scalar multiplier, it cannot resolve uncertainty inherent in $S$. If $S$ is epistemically symmetric around zero, multiplying it by an astronomical $N$ yields a large quantity of unknown sign, not a decisive reason for action.

  The claim of sign symmetry requires distinguishing baseline welfare from intervention effects. It is not merely uncertainty about whether insect lives are inherently good or bad. Rather, it is uncertainty about how an intervention alters the total welfare function, which depends on both population density and per-capita welfare. Many interventions involve trade-offs: reducing population size may reduce total suffering but harm surviving individuals, or increase resources per individual while decreasing total population. Premise: we lack a robust theoretical model to weigh changes in population count against changes in per-capita welfare intensity for insects. Consequently, the distribution of possible values for $S$ is centered near zero. This symmetry is not merely transient ignorance removable by simple data collection; it is structural uncertainty regarding the functional relationship between ecological variables and welfare. Until the sign of this trade-off is resolved, $N$ remains inert regarding decision direction.

  This defense accepts the constraints of expected-value reasoning and correlated credence. It does not dilute $C$ by treating sentience as an independent probability per insect, nor does it reject high-stakes reasoning based on fanaticism worries. The argument holds even for a strict expected-value maximizer. The objection from linearity posits that if the decision-maker holds any view where $E[S] \neq 0$, linearity dictates that $N$ dictates the choice. However, this presupposes a non-zero mean for $S$. Where uncertainty is symmetric, $E[S] \approx 0$. Acting on a noise term amplified by $N$ is not rational maximization; it is gambling with amplified stakes. The learning objection suggests large-scale intervention resolves the sign question faster. Yet, the value of information scales with the cost of error. If $N$ is large, the cost of implementing an intervention with the wrong sign is astronomical. Therefore, standard decision theory recommends acquiring information via small-scale verification before scaling, rather than using the large intervention itself as the probe.

  The argument generalizes to a mixture form. Replace the single credence factor $C$ with a distribution over competing theories of sentience, $\{T_i\}$, each with probability $p_i$. The expected value becomes $V = N \times \sum (p_i \times S_i)$, where $S_i$ is the sign factor conditional on theory $T_i$. Different theories of consciousness may yield conflicting verdicts on whether insects matter or how interventions affect them. If plausible theories generate $S_i$ values with opposing signs, the sum may converge near zero regardless of $N$. The scale argument fails to prioritize insects here because $N$ amplifies the conflict between theories rather than resolving it. The mixture form reinforces that $N$ is morally neutral; it scales moral weight but does not generate moral clarity where theoretical disagreement exists.

  The constructive upshot for an allocator choosing between a large insect-directed intervention and a smaller, vertebrate-directed intervention is a recommendation to defer the former. Vertebrate welfare states are better evidenced, implying a sign factor $S_{vert}$ with lower variance and a known sign. Insect interventions possess a high-variance $S_{insect}$ centered near zero. Even if $N_{insect} \gg N_{vert}$, the expected value of the insect intervention remains suppressed by the sign uncertainty. The allocator should prefer the vertebrate intervention not because insects matter less, but because the action-guiding content—the sign of the welfare change—is verifiable. The scale argument thus redirects resources toward research and small-scale pilots capable of resolving the sign of $S$, rather than direct large-scale manipulation.

  This thesis is falsifiable on empirical or conceptual grounds. Empirically, the thesis fails if research demonstrates that the trade-off between population size and per-capita welfare is robustly positive for a specific class of interventions. If it is shown that $S$ is strictly positive across all plausible theories of sentience, then $N$ regains its action-guiding force, and the scale argument correctly prioritizes insects. Conceptually, the thesis fails if one can demonstrate that population size itself carries intrinsic moral weight independent of sentience or welfare sums. If $N$ contributes to value directly, rather than as a multiplier of per-capita welfare, then the Redirection Thesis collapses, as $N$ would settle the decision regardless of the sign factor's uncertainty. Until such findings obtain, the scale argument functions as a demand for information, not a mandate for intervention.
