answer: |-
  ### Model Answer

  **(a)**
  For an arbitrary citizen $i$, let $u_i(\cdot)$ denote their von Neumann–Morgenstern utility function. Given $u_i(0)=0$, the expected utilities are:
  $$EU_i(A) = u_i(1\text{m})$$
  $$EU_i(B) = 0.89u_i(1\text{m}) + 0.11\left[\frac{10}{11}u_i(5\text{m}) + \frac{1}{11}u_i(0)\right] = 0.89u_i(1\text{m}) + 0.10u_i(5\text{m})$$
  $$EU_i(C) = 0.11u_i(1\text{m})$$
  $$EU_i(D) = 0.11\left[\frac{10}{11}u_i(5\text{m}) + \frac{1}{11}u_i(0)\right] = 0.10u_i(5\text{m})$$

  The difference in expected utility for Problem 1 is $\delta_i = EU_i(B) - EU_i(A) = 0.10u_i(5\text{m}) - 0.11u_i(1\text{m})$.
  The difference for Problem 2 is $EU_i(D) - EU_i(C) = 0.10u_i(5\text{m}) - 0.11u_i(1\text{m})$.
  Thus, $\delta_i$ is identical across both problems. $\delta_i$ is positive if and only if $u_i(5\text{m}) / u_i(1\text{m}) > 1.1$. This condition requires the citizen to be sufficiently risk-neutral; for a risk-averse agent with concave utility, this ratio is typically lower.

  Because $\delta_i$ is identical, the vector of expected utilities for lotteries B and D are simply the vectors for A and C shifted by the same amount $\mathbf{\delta}$. Moreover, since $u(0)=0$, the utility vector for C is exactly $0.11$ times the vector for A, and D is $0.11$ times B. The Allais pattern requires the planner to rank $\mathbf{EU}(A) > \mathbf{EU}(B)$ but $\mathbf{EU}(D) > \mathbf{EU}(C)$. Substituting the proportionality, this implies $W(\mathbf{u}) > W(\mathbf{v})$ but $W(0.11\mathbf{v}) > W(0.11\mathbf{u})$. This reversal is impossible for any social welfare function that satisfies scale invariance (homotheticity). Since standard inequality-averse functions (e.g. Atkinson, Generalised Entropy) are homothetic, they preserve rankings under proportional scaling. Thus, aggregation of EU maximisers cannot generate the Allais pattern.

  **(b)**
  Let $F$ be the leximin rule, which ranks vectors by their smallest component, then the second smallest, and so on. Consider two citizens and three lotteries with expected utility vectors:
  $\mathbf{L} = (2, 10)$, $\mathbf{M} = (3, 3)$, $\mathbf{R} = (10, 0)$.
  Leximin ranks $\mathbf{M}$ above $\mathbf{L}$ because $\min(3,3) > \min(2,10)$ ($3 > 2$).
  Let $\alpha = 0.5$. The mixed lotteries are:
  $\alpha\mathbf{L} + (1-\alpha)\mathbf{R} = (6, 5)$. Leximin value: 5.
  $\alpha\mathbf{M} + (1-\alpha)\mathbf{R} = (6.5, 1.5)$. Leximin value: 1.5.
  Now the mixture of $\mathbf{L}$ is ranked above the mixture of $\mathbf{M}$ ($5 > 1.5$), violating independence.

  The structural feature enabling this is the **crossing of utility levels** across citizens. In $\mathbf{M}$, utility is equalised; in $\mathbf{L}$, it is unequal. The common consequence $\mathbf{R}$ exacerbates inequality in the mixture of $\mathbf{M}$ (dragging the minimum down significantly) while mitigating it in the mixture of $\mathbf{L}$. This feature was absent in part (a) because the difference vector $\mathbf{\delta}$ was identical for all citizens, meaning the 'shape' of the utility distribution did not change relative to the baseline across the two problems.

  **(c)**
  Let $W(L) = \sum_s p(s) F(\mathbf{u}(s))$. Consider a compound lottery $Z = \alpha L + (1-\alpha)R$. The probability of any state-outcome pair in $Z$ is the weighted sum of probabilities in $L$ and $R$. By the linearity of the summation operator:
  $$W(Z) = \sum_s [\alpha p_L(s) + (1-\alpha)p_R(s)] F(\mathbf{u}(s))$$
  $$= \alpha \sum_s p_L(s) F(\mathbf{u}(s)) + (1-\alpha) \sum_s p_R(s) F(\mathbf{u}(s))$$
  $$= \alpha W(L) + (1-\alpha) W(R)$$
  Since the social value of the mixture is the mixture of the social values, the ranking satisfies independence.

  The contrast shows that violations of independence in social choice arise from **ex-ante aggregation** (aggregating expected utilities), which allows distributional concerns to interact non-linearly with risk. **Ex-post aggregation** (expected social welfare) preserves the linearity of expectation, ensuring independence holds regardless of inequality aversion.

