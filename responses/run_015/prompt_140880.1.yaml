      *   *Predictive Processing (PP):* Brain minimizes prediction error (PE) or Variational Free Energy (VFE).
      *   *The Reductio:* If minimizing PE is the goal, sensory deprivation is optimal. No input = no error.
      *   *The Counter-argument (usually):* We have priors about being alive, eating, etc. (Existence priors).
      *   *The Brochure's Spin:* We can override those priors (for a fee).
      *   *Precision:* Confidence in prediction errors. High precision = learning/updating. Low precision = ignoring input. The brochure sells "Low Precision" as relaxation.
      *   *Active Inference:* Acting on the world to match predictions vs. updating predictions to match the world. The brochure sells "updating predictions" (solipsism) as the premium service.
      *   *The Formalism Joke:* VFE is an upper bound on surprise (negative log model evidence). You can't minimize surprise directly (it's intractable), so you minimize the bound. But minimizing the bound doesn't guarantee minimizing surprise if the model class is wrong. Or, the ergodic assumption (time averages = ensemble averages) required for the math to hold over a "lifetime" vs. a "retreat". Let's go with the Bound vs. Surprise distinction in the fine print.
