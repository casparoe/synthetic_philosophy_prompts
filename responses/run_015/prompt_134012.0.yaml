  The Control-Principle theorist blames Maya more in Case 1 solely for the voluntary audit omission, as it was within her control, while dismissing the fatal surge as luck. The Quality-of-Will theorist assigns identical blame, judging her conscientious mindset constant across both scenarios. The Resultant-Luck theorist blames Maya more in Case 1 solely due to the fatality, treating the inert audit as irrelevant. This precise three-way divergence is forced by pairing a causally inert controllable omission with an uncontrollable outcome variance. If the audit were causally relevant to the surge, Control and Luck theorists would align on blame because the omission caused the death. If the outcome were fully within Maya's control, all three theories would converge because the death would no longer be luck. Removing this specific structural pairing collapses the distinction, forcing at least two theories to agree. A defender of the Resultant-Luck view, often critiqued for violating fairness, might dissolve the case by arguing the fatality reveals an objective risk retrospectively tainting her will, denying the luck is purely resultant rather than evidentiary of hidden negligence, thereby aligning with the Quality-of-Will account to avoid admitting moral arbitrariness.
