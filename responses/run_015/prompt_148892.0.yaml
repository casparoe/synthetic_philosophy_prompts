answer: |-
  # Taxonomy of Collective Memory Obligations

  **Root Question:** Does collective remembrance of a past wrong serve a moral purpose that outlives the direct victims?  
  *(Note: This tree presupposes "Yes." If "No," the duty collapses into mere preference.)*

  ### **Split 1: Primary Obligation Owed To...**
  *   **A.** The Victims (Past)
  *   **B.** The Descendants of Perpetrators (Present Moral Constitution)
  *   **C.** Present Bystanders (Political Stability/Justice)

  ### **Split 2: Required Form of Remembrance**
  *   **i.** Institutional (State-led: monuments, curricula, apologies)
  *   **ii.** Private/Familial (Civil society: oral history, household transmission)

  ### **Split 3: Conditions for Active Forgetting (Deliberate Suppression)**
  *   **1.** Never Permissible
  *   **2.** Permissible Only After Material Reparations Are Complete
  *   **3.** Permissible Whenever Remembrance Fuels Present Conflict

  ---

  ## **The Leaves (8 Distinct Positions)**

  **1. [A-i-1] The Thick Ethics of Memory**
  *   **Defender:** Avishai Margalit
  *   **Awkward Commitment:** Mandating state funding for memorials and curricula even when living survivors lack adequate healthcare or housing.

  **2. [A-ii-1] The Familial Trust**
  *   **Defender:** Unnamed
  *   **Awkward Commitment:** Requiring grandchildren to carry trauma narratives that may destabilize their own psychological well-being despite no direct experience of the event.

  **3. [A-i-3] The Tragic Compromise**
  *   **Defender:** Unnamed
  *   **Awkward Commitment:** The state dismantling a memorial survivors still visit because keeping it standing risks retaliatory violence against their community.

  **4. [B-i-2] Constitutional Closure**
  *   **Defender:** Unnamed
  *   **Awkward Commitment:** Government declaring a official "guilt holiday" after financial payments, even while systemic inequalities from the era remain visibly unchanged.

  **5. [B-ii-2] Personal Moral Hygiene**
  *   **Defender:** Unnamed
  *   **Awkward Commitment:** Individuals deciding their family's moral debt is paid without consulting the harmed community about whether the reparations were sufficient.

  **6. [C-i-3] Strategic Political Forgetting**
  *   **Defender:** David Rieff
  *   **Awkward Commitment:** Archiving evidence of crimes but legally sealing it to maintain a fragile peace treaty, effectively trading truth for stability.

  **7. [C-ii-3] Civil Peacekeeping**
  *   **Defender:** Unnamed
  *   **Awkward Commitment:** Neighbors agreeing to silence histories of local collaboration to keep the neighborhood stable, prioritizing current harmony over historical accuracy.

  **8. [C-i-1] Civic Education Duty**
  *   **Defender:** Unnamed
  *   **Awkward Commitment:** Teaching children primarily about past evils as a cautionary tale, risking political cynicism rather than fostering positive civic virtue.

  ---

  ## **Structural Flags**

  **Incoherent Empty Branch:** **[A + 2] Victims + Permissible After Reparations**
  *   **Reasoning:** If the primary obligation is owed to the *victims* (Split A), their claim is for moral recognition, not material compensation. Treating memory as a debt that can be "paid off" via reparations (Split 2) commits a category error; once the victim is dead, material payment cannot extinguish the duty to remember them.

  **Hard-to-Separate Leaves:** **[3] The Tragic Compromise** vs. **[6] Strategic Political Forgetting**
  *   **Reasoning:** Both positions result in the identical state action: suppressing memory to prevent violence. The distinction relies entirely on the state's internal justification (protecting the *victims* vs. protecting the *public order*), which is often indistinguishable in political practice and easily used as rhetorical cover for the same decision.
