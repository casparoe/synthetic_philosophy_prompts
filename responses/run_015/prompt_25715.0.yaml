          *   *Criterion:* Significant sacrifice or risk is usually required. Urmson emphasizes "heroes and saints."
          *   *Shading:* There's a continuum. Simple politeness -> Good Samaritan acts -> Heroic/Saintly acts. The "cost" to the agent is a key factor.
      *   **Shading into Obligation:**
          *   *Utilitarian view:* Act Utilitarianism struggles with this. If you can maximize good, you *ought* to. So, for a strict Utilitarian, supererogation might not exist (it becomes obligatory).
          *   *Common Sense Morality:* Distinguishes between duty and "above and beyond."
          *   *The "Demandingness Objection":* This is a key philosophical debate point. If morality demands too much, it becomes unreasonable. Supererogation provides a safety valve.
      *   **Motive and the "Fragility of Praise":**
          *   *Kantian view:* Duty is key. If you do it for inclination, it has less moral worth. But supererogation isn't duty.
          *   *The Bragging Problem:* The user noted that bragging spoils it. This touches on *moral worth* vs. *moral status of the act*.
          *   *Selfish Motives:* If I donate bone marrow for fame, is the act supererogatory? The *act* is still objectively supererogatory (good, not required), but the *agent* might not be praiseworthy. This distinguishes the *action type* from the *moral credit*.
      *   **Internal Logic:** The user suspected it has its own logic. Philosophers agree. It's not just "optional good." It involves going beyond the call of duty.

  4.  **Structure the Response:**
