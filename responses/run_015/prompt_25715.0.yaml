answer: |-
  You have independently rediscovered one of the most significant categories in modern normative ethics. The term you are looking for is **supererogation**.

  The actions you described are called **supererogatory acts** (from the Latin *supererogatio*, meaning "payment above what is due").

  The philosophical mapping of this territory is well-established, though it remains a site of active debate. The seminal paper that brought this into mainstream analytic philosophy was J.O. Urmson's "Saints and Heroes" (1958). Before Urmson, many ethical systems (particularly strict Utilitarianism and some interpretations of Kant) struggled to accommodate this category, often collapsing morality into a binary of "duty" vs. "non-duty."

  Here is how philosophers have mapped the boundaries, the logic, and the puzzles you identified.

  ### 1. The Deontic Square
  Standard deontic logic (the logic of obligation) usually divides actions into three buckets:
  1.  **Obligatory:** You must do it; blame if you don't.
  2.  **Forbidden:** You must not do it; blame if you do.
  3.  **Permissible (Optional):** You may do it or not; no blame either way. (This is your "cereal" category).

  Supererogation breaks this trichotomy. It creates a fourth category within the "Permissible" zone:
  *   **Supererogatory:** Permissible to omit (no blame), but morally better to perform (praise if you do).

  As you noted, this creates an asymmetry. In standard duty, doing the right thing is the baseline (no special praise), and failing is negative. In supererogation, failing is the baseline (neutral), and doing is positive.

  ### 2. Drawing the Boundary: Sacrifice and Cost
  You asked where the line is drawn between ordinary politeness and supererogation. This is the **threshold problem**.

  Most philosophers agree that for an act to be supererogatory, it must involve **significant cost, risk, or sacrifice** to the agent.
  *   **Holding a door:** This is generally considered part of "ordinary morality" or minimal decency. It costs you almost nothing. Failing to do it might incur mild social censure, but it isn't usually seen as a moral failure.
  *   **Bone marrow donation:** This involves pain, time, medical risk, and inconvenience. It is costly.
  *   **Jumping in a freezing river:** This involves physical risk.

  If we classify *every* small kindness as supererogatory, the category loses its meaning. If holding a door is "above and beyond," then we are rarely required to be kind to strangers. Therefore, the consensus is that supererogation resides in the realm of the **Good Samaritan**, not the merely polite.

  However, the boundary is fuzzy. Is giving $10 to a beggar supererogatory? What about $1,000? Philosophers like David Heyd argue that the "cost" is relative to the agent. For a billionaire, $1,000 is trivial (perhaps just polite); for a student, it is sacrificial (supererogatory).

  ### 3. The Motive Problem and the "Fragility of Praise"
  Your observation about bragging is incredibly astute and touches on the distinction between the **status of the act** and the **praiseworthiness of the agent**.

  *   **The Act:** The bone marrow donation is objectively supererogatory regardless of why you do it. It saves a life at cost to you.
  *   **The Agent:** To receive full moral *credit* (praise), your motives matter.

  If you donate purely for attention, philosophers would say the act remains supererogatory (it was still good and not required), but your **moral worth** is diminished. This aligns with your intuition that bragging spoils the praiseworthiness.

  Why does bragging spoil it? Because supererogation is often linked to **virtue ethics**. A "hero" or a "saint" is defined not just by what they do, but by their character. Part of that character is a lack of self-aggrandizement. If you demand praise, you signal that you view the act as a transaction (I give pain, you give status) rather than a moral gift. In contrast, when someone fulfills a duty (like paying taxes), mentioning it isn't boastful in the same way because they are merely meeting the baseline requirement.

  ### 4. The Theoretical Battle: Does Supererogation Exist?
  You asked if philosophers have mapped this out. They have, but they don't all agree it *should* exist.

  *   **Common Sense Morality:** Intuitively accepts supererogation. We believe we are not required to be heroes.
  *   **Act Utilitarianism:** Often **rejects** supererogation. For a strict Utilitarian, the right action is the one that maximizes overall well-being. If jumping in the river saves a dog and the cost to you is less than the value of the dog's life (plus the owner's grief), you are *obligated* to jump. If you don't, you did the wrong thing. For a Utilitarian, there is no "above and beyond," only "what maximizes utility."
  *   **The Demandingness Objection:** This is the strongest argument *for* supererogation. Critics of Utilitarianism argue that if morality demands we sacrifice everything until we are as poor as the poorest person we can help, morality becomes too demanding to be livable. Supererogation acts as a safety valve: it allows us to acknowledge that giving away all your money is *good*, without claiming you are *wrong* for keeping it.

  ### 5. Summary of the Logic
  To answer your specific questions on the internal logic:

  1.  **Is there a term?** Yes, **Supererogation**.
  2.  **Does it require sacrifice?** Generally, yes. It must go beyond the "call of duty," which is defined by social expectations and minimal moral requirements.
  3.  **Does motive matter?** It matters for the praise of the *person*, but not necessarily the classification of the *act*. However, if the motive is malicious (e.g., donating bone marrow to make the recipient indebted to you for exploitation), the act may lose its moral goodness entirely, even if the physical action is the same.
  4.  **Why the fragility?** Because supererogatory acts are gifts. A gift that demands repayment (in the form of praise) ceases to function socially as a gift.

  You have correctly identified that this category operates on a different axis than duty. Duty is about **requirements**; supererogation is about **ideals**. Duty keeps the moral floor intact; supererogation raises the ceiling.
