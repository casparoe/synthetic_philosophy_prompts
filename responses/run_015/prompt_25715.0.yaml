  2.  **Identify the Philosophical Concept:**
      *   The description perfectly matches the concept of **Supererogation**.
      *   *Term:* Supererogatory actions (from Latin *supererogatio*, "payment above what is due").
      *   *Key Philosophers:* J.O. Urmson ("Saints and Heroes," 1958) is the seminal paper. Also David Heyd, Susan Wolf, Judith Jarvis Thomson.
      *   *Deontic Logic:* Standard deontic logic usually deals with Obligatory, Permissible, Forbidden. Supererogation breaks the binary of Obligatory vs. Permissible.

  3.  **Address the Sub-questions (Drafting the Content):**

      *   **The Term:** Confirm it's "Supererogation." Explain the etymology briefly.
      *   **The Boundary (Sacrifice vs. Small Kindness):**
