      *   *Constitution vs. Influence:* This is the crux. Knobe's early work suggested a deep link, but "constituted entirely" is a strong claim (often attributed to the "Radical Challenge"). Many x-phi researchers (including Knobe later) moved toward "blame/praise influences application conditions" rather than "the concept *is* moral."
      *   *Methodological Aftermath:* Did x-phi conclude conceptual analysis is *bankrupt*? No. Some (like Weinberg, Nichols, Stich) raised doubts about *reliability*. Others (like Knobe, Leiter) argued for a more nuanced role of intuitions. The "only descriptive taxonomy" claim is a caricature of the "naturalist" turn, ignoring armchair synthesis.
