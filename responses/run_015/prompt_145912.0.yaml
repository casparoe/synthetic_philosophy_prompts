answer: |-
  **MEMORANDUM**

  **TO:** Museum Director
  **FROM:** Curatorial Review Board, History of Science Division
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Exhibition Proposal: "Agents Without Intent"

  **RECOMMENDATION**
  **Approve with Conditions.**

  The proposal offers a theoretically rigorous intervention into public understandings of modernity, but it requires specific textual and design modifications to mitigate the risk of obscuring human political agency. The board recommends proceeding contingent on the curatorial team's ability to demonstrate how non-human forces and human societies co-constituted historical outcomes, rather than presenting the former as sole drivers of the latter.

  **CONTEXT AND DISPUTE**
  The proposal seeks to decentralize the human subject by framing cholera, volcanic climate shock, and drought cycles as active protagonists in 19th-century history. This approach aligns with current scholarship in more-than-human history and actor-network theory, challenging the anthropocentric view that nature is merely a stage for human action.

  However, the review board reached a stalemate. One faction argues that treating non-human entities as "agents" risks slipping into environmental determinism, specifically erasing the resilience, adaptation, and resistance of colonized peoples who navigated these crises. The opposing faction argues that refusing this framework reinforces an outdated human/nature binary that fails to explain the material realities of imperial collapse and restructuring.

  **CONCEPTUAL REASONING**
  The decision to approve rests on the premise that "agency" need not imply "intent." Non-human entities (viruses, climate systems) exert force and constrain possibilities without possessing consciousness. Acknowledging this is not determinism, provided the exhibition clarifies that these forces operate within existing political structures.

  However, we must explicitly validate the strongest argument from the dissenting faction: **The Risk of Colonial Erasure.**
  The concern that framing a monsoon or a microbe as a "protagonist" may inadvertently sideline the human labor and knowledge systems that managed these crises is valid. In colonial contexts, environmental shocks were often exploited by imperial powers to justify stricter control, while colonized populations developed sophisticated adaptive strategies (medical, agricultural, social). If the exhibition narrative suggests that Tambora or El Niño "caused" historical shifts without detailing how imperial policy mediated those shifts, it will reproduce the very colonial logic it seeks to critique. It risks presenting colonized peoples as passive victims of nature rather than active participants in a hybrid network of survival and governance.

  Therefore, the exhibition must move beyond a simple inversion (where nature replaces humans as the hero) toward a model of **hybrid agency**. The narrative must show how imperial governments *interpreted* these non-human acts to restructure labor, and how colonized communities *responded* to them to maintain autonomy. The non-human is an agent, but not the only agent.

  **CONDITIONS FOR APPROVAL**
  To ensure theoretical precision and ethical responsibility, the following conditions must be met before final script approval:

  1.  **Clarify "Agency" in Interpretive Text:**
      The exhibition must include a clear definitional statement early on distinguishing between *human agency* (intent, choice, politics) and *non-human agency* (causal force, constraint, material effect). Avoid language that suggests microbes or magma have "goals" or "strategies." Use terms like "actants," "forces," or "constraints" where appropriate to prevent confusion.

  2.  **Center Colonial Mediation:**
      For every instance of non-human impact (e.g., a cholera outbreak), there must be a corresponding display of human mediation. Specifically, show how colonial officials used the outbreak to justify quarantine laws or labor restructuring, and how local populations navigated, resisted, or adapted to those laws. The non-human force triggers the event, but human power structures determine the outcome.

  3.  **Highlight Subaltern Knowledge Systems:**
      The exhibition must explicitly feature indigenous or local knowledge regarding these environmental phenomena. If discussing drought cycles, include local agricultural adaptations or water management strategies that predated or existed alongside imperial interventions. This counters the determinism critique by showcasing human ingenuity in the face of non-human force.

  4.  **Avoid "Great Man" vs. "Great Force" Symmetry:**
      Do not simply replace "Great Men" of history with "Great Forces" of nature. Instead, visualize the network. Diagrams or interactives should illustrate the feedback loops between volcanic ash, crop failure, market prices, colonial policy, and local resistance.

  **NEXT STEPS**
  The curatorial team is requested to submit a revised narrative outline addressing these conditions within 30 days. Once the Review Board confirms that the risk of environmental determinism has been adequately mitigated through the inclusion of human adaptive agency, the project may move to design development.

  This approach allows the museum to lead on innovative historical theory without compromising our commitment to representing the complexity of human experience under empire.
