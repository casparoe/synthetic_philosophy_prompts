          *   *Conflict:* XR work is often abstract, long-term, and prevents *potential* suffering. (6) suggests a very strong priority for *concrete, severe, current* suffering. If XR is about preventing a future where *some* people suffer extremely, it aligns. But if XR is justified by numbers (as per 7), it might conflict with the lexical priority of the current worst-off. However, if the future contains *extreme* suffering, (6) and (7) align. The tension is in the justification of (7).
