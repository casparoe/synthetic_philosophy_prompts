prompt: |-
  I'm on the executive committee of a scientific society — about 3,000 members — and every couple of years we put out an official position statement on some contested question in the field (does effect X replicate, is technique Y safe at scale, should regulators treat Z as settled). Right now a 12-person elected council ratifies it's wording by simple majority, and the chair breaks ties. Two motions are on the floor for the AGM, which is in three weeks, and I have to circulate the committee's one-page recommendation by Friday.

  Motion A, from a group of members: put every statement to an online vote of the whole membership — a two-week comment thread first so people can see each other's arguments, then a simple majority of whoever turns up. Their argument is basically the Condorcet jury theorem: lots of roughly independent voters, each a bit better than chance, and the majority ends up very likely to be right.

  Motion B, from our treasurer, who's worried about reputational damage: keep it with the council but require two-thirds.

  Some things I've noticed that I want the memo to actually deal with.

  First, we're 12 — an even number. If ties are broken by a coin flip, I think a 12-person council is exactly as reliable as an 11-person one; I checked it on toy cases (1 vs 2, and 3 vs 4, both came out identical when everyone's reliability is 0.6) but I can't prove it in general. If that's right, the 12th vote is worth nothing and we should either go to 11 or change the tie rule. Is defaulting to "we issue no statement" better than the chair's casting vote, and does that depend on what fraction of proposed statements are true in the first place?

  Second, the comment thread. If everyone reads the same three loud people before voting, we don't have 3,000 independent votes, we have fewer — and I've been told that once votes are correlated the majority stops converging on the truth at all and plateaus somewhere below 1, which would take the legs out of motion A entirely. But the obvious reply is that our 12-person council is far more correlated than the membership: they've been in the same room for three years.

  Third, and this is the bit that actually worries me: on a specialist question most of our members are in subfields that have nothing to do with it, so the average member's reliability might be near chance or below it — and if it's below, the same theorem says a bigger electorate makes us worse, not better. I have no idea which side of 0.5 we're on, and we have no track record of scoring our own statements against what later happened, so no one can honestly say. What do you do with a decision rule when you can't tell whether it's helping or hurting?

  Fourth, one of our committee members — she's an econometrician — says the simple-majority framing is wrong anyway: if votes are independent, the right rule weights each person by the log-odds of their being right, and a few hundred members who are each only marginally better than a coin flip will beat twelve experts under it. She wants self-reported expertise added as a weighting to the online vote. I don't know if the weighting claim is right, and I definately don't know how anyone would report their own expertise honestly.

  Fifth, our statements come in two parts: a factual bit (does the effect replicate) and a recommendation bit (so here's what practitioners and regulators should do). The jury-theorem reasoning seems to touch only the first part, and I suspect that's where the two-thirds rule really belongs, if it belongs anywhere — but I also suspect the threshold ought to fall out of the base rate of statements being right and how much worse a false statement is than silence, rather than from a round number somebody liked.

  What I need is the memo: a position on each motion (adopt, reject, adopt with conditions), what we do at the AGM in three weeks, what we do over the next year instead — pilot something? record votes before the comment thread opens and compare them to the post-deliberation ones? split each statement into two separate votes? drop to 11 members and fix the tie rule? — and reasons our members could actually argue with rather than just nod at. Please be straight about the strongest argument for whichever motion you're telling us to reject; the referendum people will be in the room and they're not stupid. If it helps you put numbers on any of this, assume a decent specialist is right about 60% of the time on these questions.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Executive Committee Member of a scientific society (3,000 members).
      *   **Task:** Write a one-page recommendation memo to the committee regarding two motions at the upcoming AGM (in 3 weeks).
      *   **Deadline:** By Friday (implies urgency and conciseness).
      *   **Context:** The society issues position statements on contested scientific questions. Currently, a 12-person council ratifies by simple majority (chair breaks ties).
      *   **Motions:**
          *   Motion A: Online vote of whole membership (2-week comment thread + simple majority). Argument: Condorcet Jury Theorem (CJT).
          *   Motion B: Keep council vote but require 2/3 supermajority. Argument: Risk management/reputation.
      *   **Key Issues to Address:**
          1.  *Council Size/Tie-Breaking:* Is a 12-person council with chair tie-break equivalent to 11? Is "no statement" better than chair vote? Dependence on base rate?
          2.  *Correlation/Independence:* Does the comment thread destroy independence (herding)? Is the council *more* correlated than the membership?
          3.  *Competence:* Are members >0.5 reliable? If <0.5, CJT makes things worse. No track record to verify.
          4.  *Weighting:* Econometrician's claim about log-odds weighting vs. simple majority. Feasibility of self-reported expertise.
          5.  *Fact vs. Value:* Statements have factual (replication) and normative (recommendation) components. Do different rules apply?
      *   **Requirements:** Position on each motion (Adopt/Reject/Modify), actionable plan for AGM and next year, strong arguments (especially for the rejected motion), quantitative reasoning where helpful (assume specialist reliability $p \approx 0.6$).
      *   **Tone:** Professional, analytical, decisive, respectful of opposing views.

  2.  **Deconstruct the Mathematical/Logical Problems:**

      *   *Issue 1: 12 vs. 11 Members & Tie-Breaking.*
          *   Standard Condorcet logic: If $N$ is even and ties are broken randomly (coin flip), the probability of a correct decision is exactly the same as $N-1$ (odd).
          *   Proof intuition: In an $N=2k$ group, a tie occurs when $k$ vote right and $k$ vote wrong. The coin flip adds $0.5 \times P(\text{tie})$. In $N=2k-1$, the "swing" voter decides the cases that would have been ties. If the swing voter has $p=0.5$, it's identical. If the swing voter (Chair) has $p > 0.5$, the 12th person adds value *only* if the Chair is better than random.
          *   *Wait, the prompt says:* "If ties are broken by a coin flip... 12-person council is exactly as reliable as an 11-person one." The prompt asks: "If that's right... does defaulting to 'we issue no statement' better than the chair's casting vote?"
          *   *Analysis:* If the Chair breaks ties, the Chair is effectively the $N$-th voter *only* in tie scenarios. If the Chair is competent ($p>0.5$), keeping 12 + Chair vote is better than 11. If the Chair is random, 12+Chair = 11.
          *   *Status Quo:* Chair breaks ties. This is generally better than "no statement" *if* the Chair is at least average competence. "No statement" is a safe default but reduces utility.
          *   *Recommendation:* Don't change council size now (too disruptive before AGM), but note the theoretical equivalence if ties are random. Keep Chair vote.

      *   *Issue 2: Correlation & Deliberation.*
          *   CJT requires independence.
          *   Motion A (Comment Thread): Deliberation *induces* correlation. If everyone reads the same top comments, $N_{eff}$ drops drastically. This undermines the main argument for Motion A.
          *   Council Correlation: Council members talk constantly. High correlation.
          *   Membership Correlation: Lower than council, but the comment thread increases it.
          *   *Verdict:* Motion A's mechanism (thread then vote) actively harms the CJT benefit it claims to seek.

      *   *Issue 3: Competence ($p$).*
          *   Assumption: Specialist $p \approx 0.6$.
          *   Reality: 3,000 members, many outside subfield. Average $p$ could be $< 0.5$.
          *   If $p_{avg} < 0.5$, CJT says larger $N \to$ Error Probability $\to 1$.
          *   *Risk:* Motion A is high variance. If $p > 0.5$, it's great. If $p < 0.5$, it's disastrous.
          *   *Council:* Selected for expertise. $p$ likely $> 0.5$ and more stable.
          *   *Verdict:* Motion A is too risky given unknown $p_{avg}$.

      *   *Issue 4: Weighting.*
          *   Optimal weighting is log-odds ($\ln(p/(1-p))$).
          *   Self-reporting is incentivized to lie (everyone claims expert).
          *   Hard to implement by Friday/AGM.
          *   *Verdict:* Interesting theory, impractical now.

      *   *Issue 5: Fact vs. Value.*
          *   Fact: "Does X replicate?" (Epistemic). CJT applies.
          *   Value: "Should we regulate Z?" (Normative). CJT does *not* apply. Majority preference $\neq$ Truth.
          *   Motion B (2/3 rule): Good for high-stakes normative claims (risk aversion).
          *   *Verdict:* Split the vote or apply higher threshold to recommendations.

  3.  **Drafting the Strategy:**

      *   **Recommendation:** Reject Motion A (too risky, correlation issues, competence unknown). Modify Motion B (adopt 2/3 threshold but *only* for normative recommendations, keep majority for factual findings).
      *   **Immediate Action (AGM):** Vote on the modified Motion B.
      *   **Next Year:** Pilot a "shadow vote" (membership votes privately, no thread, compared to Council) to estimate $p_{avg}$ and correlation without risking reputation.
      *   **Council Structure:** Keep 12 + Chair vote (better than "no statement" if Chair is competent).

  4.  **Drafting the Memo (Iterative Process):**

      *   *Header:* To: Executive Committee. From: [My Name]. Date: [Friday Date]. Subject: Recommendation on AGM Motions regarding Position Statements.
      *   *Executive Summary:* Clear stance.
      *   *Analysis of Motion A (Membership Vote):* Acknowledge the CJT argument. Hit the weaknesses hard (Correlation via comment thread, Competence uncertainty). This addresses the "strongest argument" requirement.
      *   *Analysis of Motion B (2/3 Council):* Acknowledge risk management. Refine it (Fact vs. Value distinction).
      *   *Council Mechanics:* Address the 12 vs. 11 tie-break issue.
      *   *Action Plan:* AGM strategy + 1-year pilot.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Tie-Break:* The prompt asks if "no statement" is better than Chair vote. If the base rate of true statements is low, or the cost of error is high, "no statement" (status quo bias) might be safer. However, the society's *purpose* is to issue statements. "No statement" reduces utility. I should recommend keeping the Chair vote but acknowledging the 12=11 equivalence if the Chair isn't an expert. Actually, the Chair *is* an elected council member, so likely competent. I will advise keeping the current tie-break but noting the 11-member equivalence for future constitutional reviews.
      *   *Correction on Motion A:* I need to be fair. The strongest argument for A is legitimacy and buy-in. Even if epistemically risky, it prevents elitism. I must acknowledge this to show I'm not just protecting turf.
      *   *Correction on Weighting:* Dismiss self-reporting firmly. It's gameable.
      *   *Correction on Fact/Value:* This is a strong intellectual contribution. Distinguishing epistemic truth from policy preference justifies a hybrid approach.

  6.  **Final Polish:**
      *   Check constraints: One-page recommendation (needs to be tight).
      *   Tone: Executive, analytical, not condescending.
      *   Math check: Ensure the $p=0.6$ assumption is used correctly to illustrate the risk of $p<0.5$ in the general membership.
      *   Address the "3 weeks" timeline: Keep proposals implementable.

  7.  **Final Review against Prompt Requirements:**
      *   Position on Motion A? Yes (Reject).
      *   Position on Motion B? Yes (Adopt with conditions).
      *   AGM Plan? Yes.
      *   Next Year Plan? Yes (Pilot).
      *   Address 12 vs 11? Yes.
      *   Address Correlation? Yes.
      *   Address Competence ($p<0.5$)? Yes.
      *   Address Weighting? Yes.
      *   Address Fact vs Value? Yes.
      *   Strongest argument for rejected motion included? Yes (Legitimacy/Elitism).

  8.  *(Self-Correction on Length)*: A "one-page recommendation" usually means concise. I will structure it with clear headings and bullet points to ensure readability within the limit.

  9.  *(Final thought on the Tie-Break)*: The prompt asks: "Is defaulting to 'we issue no statement' better than the chair's casting vote, and does that depend on what fraction of proposed statements are true in the first place?"
      *   If the Chair is competent ($p>0.5$), Chair Vote > Random > No Statement (assuming we *want* statements).
      *   If the goal is avoiding error at all costs, "No Statement" is safest.
      *   I will recommend keeping the Chair vote because the society's mission is to speak, but suggest reviewing council size later.

  10. *(Final thought on Motion A's strongest argument)*: It's not just CJT. It's democratic legitimacy. If the Council gets it wrong, the Society loses credibility. Membership vote spreads the blame. I need to mention this.

  Let's write.
answer: |-
  **MEMORANDUM**

  **TO:** Executive Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on AGM Motions Regarding Position Statements

  **Executive Summary**
  We face two motions: Motion A (Membership Referendum) and Motion B (Council Supermajority). I recommend **rejecting Motion A** in its current form and **adopting Motion B with modifications**. Specifically, we should apply the two-thirds threshold only to *normative recommendations*, not *factual findings*. Additionally, we should launch a one-year "shadow pilot" to test membership competence before considering broader voting rights.

  **Analysis of Motion A (Membership Vote)**
  *The Proposal:* Two-week comment thread followed by simple majority vote of all members.
  *The Strongest Argument for A:* Legitimacy. Even if the Council is epistemically superior, a statement backed by 3,000 members carries more political weight and distributes reputational risk. It counters accusations of elitism.
  *Why We Must Reject It:*
  1.  **Competence Risk ($p < 0.5$):** The Condorcet Jury Theorem (CJT) only improves truth-tracking if the average voter competence $p > 0.5$. On specialist questions, our general membership may average near chance ($p \approx 0.5$) or below. If $p < 0.5$, CJT dictates that increasing $N$ drives accuracy toward *zero*. We have no data on our members' $p$, making this a high-variance gamble with our reputation.
  2.  **Correlation via Deliberation:** Motion A mandates a comment thread. CJT requires independent votes. A public thread creates information cascades; members will anchor on the first few loud arguments. This reduces the *effective* sample size ($N_{eff}$), negating the "wisdom of crowds" benefit while retaining the competence risk.
  3.  **Weighting Impracticality:** While weighting votes by expertise (log-odds) is theoretically optimal, self-reporting is gameable. We cannot verify expertise reliably by Friday or the AGM.

  **Analysis of Motion B (Council Supermajority)**
  *The Proposal:* Retain Council vote, require two-thirds majority.
  *Recommendation:* **Adopt with Conditions.**
  1.  **Fact vs. Value Distinction:** Statements contain factual claims (e.g., "X replicates") and normative recommendations (e.g., "Regulate X"). CJT applies to facts; cost-benefit analysis applies to values. A false fact is an error; a false recommendation is a harm. We should require simple majority for factual findings (tracking truth) and two-thirds for normative recommendations (risk aversion).
  2.  **Council Size & Tie-Breaking:** Regarding the 12-person Council: Mathematically, a 12-person body with a random tie-break is equivalent to an 11-person body. However, our Chair is an elected expert, not a coin flip. If the Chair's competence $p_{chair} > 0.5$, the casting vote adds value. Defaulting to "no statement" on ties protects reputation but reduces utility. Given our mission is to *issue* statements, retaining the Chair's vote is preferable, provided the Chair recuses on conflicts.

  **Action Plan**

  **1. Immediate (AGM in 3 Weeks)**
  *   **Move to Amend Motion A:** Propose a "Shadow Pilot" amendment. The membership vote will occur privately *alongside* the Council vote but will not be binding. Results are published annually for comparison. This satisfies the demand for transparency without risking reputational capital on unverified competence.
  *   **Move to Amend Motion B:** Specify that the two-thirds threshold applies *only* to the recommendation/regulatory portion of statements. Factual findings require simple majority.
  *   **Rationale to Members:** "We cannot weight votes by expertise yet, and public deliberation destroys vote independence. A shadow pilot gives us the data to decide on binding referenda next year without gambling the Society's credibility today."

  **2. Next Year (The Pilot)**
  *   **Measure Competence:** Compare the shadow vote results against the Council's decision and subsequent scientific consensus. This allows us to estimate the membership's average $p$.
  *   **Test Correlation:** Run half the shadow votes with a comment thread and half without to measure the correlation penalty of deliberation.
  *   **Constitutional Review:** Form a working group to assess reducing the Council to 11 members to eliminate tie scenarios entirely, or formalizing the Chair's expertise requirement.

  **Conclusion**
  Motion A relies on assumptions (independence, competence) we cannot verify and mechanisms (public threads) that actively undermine those assumptions. Motion B is safer but too blunt. By splitting factual/normative thresholds and piloting membership input, we protect the Society's reputation while gathering the data needed to democratize responsibly.

  **Recommended Vote:** Reject Motion A; Adopt Motion B as amended.
