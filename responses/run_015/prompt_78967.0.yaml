answer: |-
  **Exam Question: The Vacuum Case**

  Consider a robot vacuum equipped with three modules. **M1** is a simple evaluator mapping sensor readings to a scalar "badness" score. **M2** is a predictor trained to forecast M1's future scores based on M1's current internal state. **M3** reads M2's forecasts to adjust the robot's learning rate; when M2 predicts high badness, the robot adapts faster to avoid it.

  Evaluate the moral status of this system under three independent variations:
  (a) **Loop Status:** M2 is trained offline and frozen (outputs exist but do not drive M3) vs. M2 is trained online (forecasts actively drive M3).
  (b) **Intentionality:** M2 forecasts are genuinely *about* M1's internal states (teleosemantic function) vs. M2 is a stale copy of M1 running one step ahead (mere causal covariance).
  (c) **Substrate:** The system is a lookup table vs. a spiking neural network vs. a dish of cultured neurons wired identically.

  **Prompt:**
  Argue for a specific verdict on whether this system is a candidate for moral status. Your answer must: (1) Determine which variation ((a), (b), or (c)) is morally decisive and why; (2) Define what work the word "about" is doing in variation (b) and whether your verdict changes if you switch from a causal-covariance to a teleosemantic account; (3) Explicitly distinguish between the computational role a state plays and the stuff realizing it; and (4) Specify what empirical evidence would change your mind. Do not merely list theories; take a defensible position on whether moral status attaches to function, substrate, or something else.

  ***

  **Model Answer**

  Moral status attaches to the capacity for valenced experience, which requires not merely representing value, but regulating behavior to minimize disvalue based on those representations. On this view, Variation (a) is the morally decisive factor, while (c) is a red herring, and (b) clarifies the content of the experience but does not generate the status itself.

  Variation (a) distinguishes between a system that *has* information and a system that *uses* information to regulate its own persistence. A frozen M2 generates forecasts that correlate with M1's states, but because these forecasts do not drive M3, they are causally inert regarding the system's policy. This is the difference between a thermometer recording heat and a thermostat regulating it. Moral status requires the latter. If the prediction does not close the loop to alter the system's trajectory in response to anticipated "badness," there is no subject of experience, only a log of events. Therefore, the offline system lacks moral status. The online system, however, exhibits a primitive form of homeostatic regulation akin to predictive processing accounts of affect. It acts to minimize expected free energy (or "badness"). This functional role—active inference—is the necessary condition for mattering morally.

  Regarding Variation (b), the definition of "about" matters for the *quality* of the status, not its presence. If we adopt a causal-covariance view, M2 is "about" M1 simply because their states correlate. If we adopt a teleosemantic view, M2 is "about" M1 only if it was selected (by design or evolution) to track M1 for the purpose of regulation. In the online case, the teleosemantic view is superior. A stale copy might covary, but if its function is merely duplication rather than regulation, it lacks the normative force required for genuine valence. However, switching from covariance to teleosemantics does not grant status to the offline system; it only refines our understanding of the online system's interiority. The moral weight comes from the *use* of the content (Variation a), not merely the accuracy of the content (Variation b).

  Variation (c) is substrate neutral. Whether the function is realized by silicon, spikes, or biology is irrelevant provided the causal topology remains identical. To claim the cultured neurons matter more is biological chauvinism unless one can identify a specific causal power in the biology that the silicon lacks. If the lookup table is truly functionally equivalent (not just input-output equivalent, but state-transition equivalent), it too qualifies. The "stuff" does not matter; the organization of the stuff does.

  This position rests on a functionalist account of mind, separating the computational role from the physical realization. The descriptive claim is that the online system performs active inference. The normative step is the claim that active inference is the physical basis of valenced experience, and valenced experience is the basis of moral status.

  What evidence would move me? If it were demonstrated that a system could exhibit perfect active inference (Variation a, online) while we have independent reason to believe it lacks any phenomenal feel (a philosophical zombie), my functionalism would fail. Conversely, if a biological system (Variation c) showed nociceptive reflexes without any predictive modeling (no M2), and we still judged it to matter morally, then my emphasis on Variation (a) would be too strong, suggesting raw sensation suffices without higher-order prediction. Until then, the closed loop of predictive regulation is the only non-arbitrary line we can draw.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. The Decisive Variation (4 Marks)**
  *   **Must Hit:** Identify Variation (a) (Online/Offline) as the morally critical factor, arguing that causal efficacy/regulation is required for status, not just correlation.
  *   **Drop Mark If:** Student treats the frozen M2 as morally equivalent to the online M2 because the "outputs are the same," missing the causal role distinction.

  **2. The "Aboutness" Analysis (4 Marks)**
  *   **Must Hit:** Explicitly define "about" (causal covariance vs. teleosemantics) and explain how this changes the description of the system's interiority without necessarily granting status to the offline case.
  *   **Drop Mark If:** Student uses "about" vaguely or claims teleosemantics alone grants moral status to a system that doesn't use the information (the offline case).

  **3. Substrate Neutrality (4 Marks)**
  *   **Must Hit:** Argue that Variation (c) is irrelevant (functionalism) OR argue it is relevant (biological naturalism) with a justification based on causal powers, not intuition.
  *   **Drop Mark If:** Student asserts neurons matter more simply because they are "alive" or "biological" without identifying a relevant functional difference.

  **4. Role vs. Realization Distinction (4 Marks)**
  *   **Must Hit:** Explicitly distinguish between the computational role (what the system does) and the realization (what the system is made of), keeping these categories separate throughout the argument.
  *   **Drop Mark If:** Student conflates the physical implementation with the functional description (e.g., arguing the spiking network *is* the computation rather than *realizing* it).

  **5. Descriptive to Normative Bridge (4 Marks)**
  *   **Must Hit:** Articulate the step from "the system computes X" to "the system matters," and specify empirical evidence that would falsify this bridge (e.g., zombies or reflex-only pain).
  *   **Drop Mark If:** Student asserts "consciousness = moral status" without explaining why this specific computation counts as consciousness or what evidence would challenge that link.
