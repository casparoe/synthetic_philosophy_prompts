answer: |-
  1. Lange proposes that central planners can mimic market efficiency by instructing managers to follow marginalist rules while adjusting prices through iterative trial and error. This framework treats economic coordination as a solvable system of equations rather than a dynamic discovery process.
  2. Hayek counters that relevant knowledge is never given in its entirety to any single mind, residing instead in the unarticulated, contextual judgments of dispersed actors. Consequently, reducing this embodied know-how to discrete data points for a central bureau inevitably strips away the nuance required for genuine adaptation.
  3. Viewing the debate through institutional learning reveals that Lange's managers lack the residual claimancy and risk-bearing responsibility that drive entrepreneurial experimentation in private markets. Without the threat of bankruptcy or the promise of profit, the feedback loop necessary for correcting errors becomes sluggish and politically distorted.
  4. The assumption that price signals can fully transmit tacit knowledge ignores the fact that prices are themselves the outcome of competitive rivalry, not merely inputs for optimization. Therefore, Lange's simulation presupposes the very discovery mechanism it seeks to replace, resulting in significant epistemic loss regarding future opportunities.
  5. Hayek's critique ultimately survives because Lange's model relies on a static conception of data that cannot capture the temporally extended process of generating new knowledge through competition. The mechanism fails not merely due to computational limits, but because it cannot institutionalize the procedural learning inherent in private property entrepreneurship.
