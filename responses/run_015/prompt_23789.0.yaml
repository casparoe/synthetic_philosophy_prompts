answer: |-
  This disagreement is fundamentally a clash of normative principles regarding how to treat indexical information as evidence, rather than a solvable technical gap or a hidden fact about reference classes.

  The SSA camp (Doomsday) is committed to the view that your existence is a fixed background condition and that the only evidence you possess is your specific rank within the sequence of observers; this forces you to reason as if you are a random sample from a completed set, which statistically penalizes hypotheses predicting vast numbers of future observers because it would be unlikely for you to be so early in the queue. The SIA camp (Presumptuous Philosopher) is committed to the view that your existence is itself data point evidence, meaning you should favor hypotheses that predict more observers simply because there are more "slots" for you to occupy in those worlds, which cancels the Doomsday update but forces you to favor physically unsupported theories that imply larger populations. The reference class problem proves there is no objective fact to settle this, because the probability shifts continuously depending on whether you define the "sample" as human beings, observer-moments, or carbon-based intelligences, revealing that the "random sample" assumption is a methodological choice rather than a law of nature.

  Nothing currently on the horizon—no new proof, thought experiment, or formalization—is likely to break this stalemate, because the debate has reached the bedrock of probability theory where axioms must be chosen rather than derived. We are effectively asking probability theory to answer a question it wasn't built to handle: how to weigh "where I am" against "what exists," and different formal systems (SSA, SIA, Full Non-indexical Conditioning) simply encode different intuitions about whether existence is evidence. This is likely permanent in the sense that consensus will not emerge from mathematical progress, but rather from a pragmatic decision to adopt the framework that yields the least objectionable consequences for a specific field, such as cosmology versus existential risk.

  For your dinner conversations, the winning move is to point out that the Doomsday Argument is not a discovery about the world, but a tax imposed by choosing a specific reasoning framework; your friend is free to pay that tax, but you are equally rational to reject the SSA axiom in favor of SIA or to simply treat anthropic reasoning as too unstable to drive high-stakes beliefs.
