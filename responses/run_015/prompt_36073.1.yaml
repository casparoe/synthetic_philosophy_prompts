      *   *Wait, let's look closer at the Friend's specific accusation:* "Metaphysical error." She isn't just saying it's immoral; she's saying the *self* doesn't exist as she thinks it does. This is the Constitutive Ontological Claim.
      *   *The Skeptic's defense:* "Causally shaped." This is the Causal Claim.
      *   *The Novelist's Need:* A novel shouldn't be a philosophy textbook. The *tension* between the claims is the story.

  5.  **Finalizing the Advice:**
