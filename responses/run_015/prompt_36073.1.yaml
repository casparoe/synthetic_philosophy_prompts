      *   *Check:* Is the distinction between "human being" and "Person" clear? This is vital. In many African traditions, you are born a human, but you *become* a person through ritual and relation. This bridges the gap between the siblings.
      *   *Check:* Is the advice practical? Yes, focus on *dramatizing the cost* rather than proving the theorem.

  8.  **Final Polish:** Ensure the voice is authoritative but accessible to a creative writer. (Proceed to generate output).

  *(Self-Correction Note: Make sure not to get too bogged down in academic jargon. Keep it relevant to the revision process.)*
