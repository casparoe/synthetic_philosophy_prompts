answer: |-
  Precommitment practices do not commit to a single decision theory but instead hybridize them: they assume a Two-boxing vulnerability to justify the device, yet demand One-boxing credibility to make soft pledges work, while hard binding bypasses the distinction entirely.

  Hard binding devices like the mast or the locked savings pot do not strictly require a specific view of the agent at the moment of temptation because they remove the choice altogether. At the moment of execution, decision theory is irrelevant because the option to defect is physically unavailable; the agent cannot Two-box because the second box is locked. However, the *decision to install* the device presupposes a Two-boxing diagnosis of the future self: you believe that without the constraint, your future self will locally re-optimize and defect. If you truly believed your future self would act as a consistent One-boxer (following the optimal policy regardless of temptation), the cost of the binding device would be wasted money. So, while the device's efficacy is underdetermined by decision theory (it works regardless of what you think at the moment), its necessity relies on the belief that you are prone to Two-boxing behavior.

  Soft pledges, such as deterrence threats or reputation-based commitments, are not underdetermined; they strictly require One-boxing behavior to function. In these cases, the option to defect remains open, so the device relies entirely on credibility. If you are a pure Two-boxer at the moment of truth, you will calculate that carrying out the threat is costly and locally suboptimal, so you will walk it back. An adversary aware of your Two-boxing nature will ignore the pledge, rendering it useless. For the pledge to have force, you must be disposed to carry out the threat even when it is locally costly, effectively acting as a One-boxer who values the consistency of their policy over the immediate causal payoff. Thus, soft precommitment diagnoses a Two-boxing vulnerability but demands a One-boxing solution.

  The practice is underdetermined only in the hard binding case, where both theories license the same behavior (installing the lock) for different reasons. A Two-boxer installs the lock because they know they will defect without it; a One-boxer might install the lock if they recognize their decision function is susceptible to corruption or noise, though a perfect One-boxer would arguably simply choose the correct action without external aid. In the soft pledge case, the theories diverge: a Two-boxer cannot successfully precommit via pledge alone, while a One-boxer can.

  If you forced yourself to pick one consistent view and drop the other, the practice of precommitment would split into two distinct strategies. If you adopted a strict Two-boxing view, you would abandon all soft pledges as empty talk and rely exclusively on external, physical enforcement mechanisms like contracts, locks, or third-party enforcers, since you could never trust your future self's word. If you adopted a strict One-boxing view, external binding devices would become largely redundant; you would shift focus from rigging the environment to cultivating internal disposition, trusting that your future self will execute the optimal policy without needing the mast because you are the type of agent who does not steer toward the sirens.
