  # Seminar Handout: Causal Explanatory Frameworks
  **Course:** Philosophy of Science | **Topic:** Causation & Structural Models

  ## Part 1: The Test Cases
  *Keep these three scenarios in mind as you navigate the decision tree. Your answers should reflect how a theory resolves these specific problems.*

  1.  **Symmetric Overdetermination:** Two assassins fire simultaneously. Both bullets hit the victim. Either bullet alone was sufficient to kill.
      *   *Problem:* Do both count as causes, or does the presence of one negate the other?
  2.  **Preemption:** Assassin A fires and kills the victim. Assassin B was ready to fire but held back because A fired. B's mechanism was structurally present but physically inactive.
      *   *Problem:* Is B a cause? Does physical impossibility of intervention matter?
  3.  **Feedback Loops:** Variable $A$ increases $B$, and $B$ simultaneously increases $A$ (e.g., microphone squeal or homeostatic systems).
      *   *Problem:* Can a causal model contain a loop, or must it be broken to be valid?

  ---

  ## Part 2: The Decision Tree
  *Answer the following diagnostic questions based on how the theory handles the cases above. Follow the path to identify the theoretical framework.*

  ### Node 1: The Modal Commitment
  **Q1:** To resolve the **Preemption** and **Overdetermination** cases, does the theory determine causality by comparing the actual world to alternative possible worlds, or by identifying invariance under active manipulation?
  *   **(A) Compare Worlds (Modal):** Proceed to Node 2.
  *   **(B) Active Manipulation (Interventionist):** Proceed to Node 3.

  ### Node 2: The Acyclicity Commitment (Modal Branch)
  **Q2:** To represent the **Feedback Loop** case, must the causal model eliminate loops (assume temporal asymmetry) for the counterfactuals to hold?
  *   **(A) Yes (Acyclic Required):** Proceed to Node 4.
  *   **(B) No (Cycles Allowed):** *See Unoccupied Leaf Diagnosis #1.*

  ### Node 3: The Acyclicity Commitment (Interventionist Branch)
  **Q3:** To represent the **Feedback Loop** case, must the structural equations be mathematically recursive (acyclic) to be valid?
  *   **(A) Yes (Acyclic Required):** Proceed to Node 5.
  *   **(B) No (Cycles Allowed):** Proceed to Node 6.

  ### Node 4: The Redundancy Commitment (Modal/Acyclic)
  **Q4:** In the **Symmetric Overdetermination** case, does the presence of two sufficient pathways in the model guarantee that both are distinct causes in reality?
  *   **(A) Yes (Redundancy Real):** Proceed to Node 7.
  *   **(B) No (Redundancy Epistemic):** *See Unoccupied Leaf Diagnosis #2.*

  ### Node 5: The Redundancy Commitment (Intervention/Acyclic)
  **Q5:** In the **Symmetric Overdetermination** case, does the model assign full causal status to both sufficient pathways?
  *   **(A) Yes (Both Causes):** Proceed to Node 8.
  *   **(B) No (One Screened Off):** *See Unoccupied Leaf Diagnosis #3.*

  ### Node 6: The Redundancy Commitment (Intervention/Cyclic)
  **Q6:** In the **Symmetric Overdetermination** case, does the model treat multiple sufficient pathways as distinct ontological causes?
  *   **(A) Yes (Both Causes):** Proceed to Node 9.
  *   **(B) No (Singular Capacity):** Proceed to Node 10.

  ### Node 7: The Alterability Commitment (Modal/Acyclic/Redundant)
  **Q7:** In the **Preemption** case, does the backup cause fail to be a cause *only* because it is physically impossible to intervene upon in the actual context?
  *   **(A) Yes (Must be Alterable):** *See Unoccupied Leaf Diagnosis #4.*
  *   **(B) No (Structure/Worlds Suffice):** **LEAF: Lewisian Counterfactual Account**

  ### Node 8: The Alterability Commitment (Intervention/Acyclic/Redundant)
  **Q8:** In the **Preemption** case, does the backup cause retain causal status if the structural equation exists, even if physical intervention is impossible?
  *   **(A) Yes (Structure Suffices):** **LEAF: Pearl's Structural-Model Approach**
  *   **(B) No (Must be Alterable):** *See Unoccupied Leaf Diagnosis #5.*

  ### Node 9: The Alterability Commitment (Intervention/Cyclic/Redundant)
  **Q9:** In the **Preemption** case, does the theory require that a cause be physically intervenable in the actual context to count?
  *   **(A) Yes (Must be Alterable):** **LEAF: Woodward's Interventionist Account**
  *   **(B) No (Structure Suffices):** *See Unoccupied Leaf Diagnosis #6.*

  ### Node 10: The Alterability Commitment (Intervention/Cyclic/Singular)
  **Q10:** In the **Preemption** case, does the theory require physical intervenability for causal status?
  *   **(A) Yes (Must be Alterable):** **LEAF: Hybrid View (Mechanistic Structuralism)**
  *   **(B) No (Structure Suffices):** *See Unoccupied Leaf Diagnosis #7.*

  *(Note: Nodes 2-10 cover the branching logic. The Unoccupied Leaf Diagnoses below cover all 12 empty paths resulting from the 4 binary commitments.)*

  ---

  ## Part 3: Unoccupied Theoretical Space
  *The following combinations of commitments yield no major established theory. Diagnose why.*

  1.  **Modal + Cycles Allowed:** **Incoherent.** Standard modal semantics for causation rely on temporal asymmetry to evaluate counterfactual dependence; loops break the similarity metric.
  2.  **Modal + Acyclic + Redundancy No:** **Unexplored.** Modal realists generally accept overdetermination as a metaphysical possibility rather than screening it off epistemically.
  3.  **Intervention + Acyclic + Redundancy No:** **Incoherent.** If interventions on both variables change the outcome, acyclic structural models mathematically assign coefficients to both; denying this contradicts the algebra.
  4.  **Modal + Acyclic + Redundant + Alterable:** **Incoherent.** Modal accounts define causation via truth conditions in other worlds, not physical intervention capabilities in the actual world.
  5.  **Intervention + Acyclic + Redundant + Alterable:** **Unexplored.** This combines Pearl's mathematics with Woodward's strict physicalism; usually, acyclic models rely on mathematical surgery ($do$-operator) rather than physical feasibility.
  6.  **Intervention + Cyclic + Redundant + Structure Suffices:** **Unexplored.** Cyclic interventionists (like Woodward) typically tie causation to invariance under *possible* interventions, not merely structural existence.
  7.  **Intervention + Cyclic + Singular + Structure Suffices:** **Incoherent.** If structure suffices without intervention, the view collapses into structural realism, making the "intervention" commitment nominal.
  8.  **Modal + Acyclic + Redundancy No + Alterable:** **Incoherent.** Combines modal metaphysics with interventionist constraints on alterability.
  9.  **Modal + Acyclic + Redundancy No + Structure Suffices:** **Unexplored.** A modal view that denies overdetermination reality but accepts structural definitions is theoretically unstable.
  10. **Intervention + Acyclic + Redundancy No + Structure Suffices:** **Incoherent.** Acyclic structural models inherently quantify redundancy; denying it while accepting the structure is mathematically inconsistent.
  11. **Intervention + Cyclic + Redundancy No + Structure Suffices:** **Unexplored.** A view allowing loops and structural sufficiency but denying redundant causation lacks a clear mechanism for path allocation.
  12. **Modal + Cycles Allowed + Any/Any:** **Incoherent.** (See Diagnosis #1). Allowing cycles in a modal framework fundamentally breaks the standard evaluation of counterfactuals.

  ---

  ## Part 4: Theory Summary (Leaves)

  | Theory | Modal? | Acyclic? | Redundancy Real? | Must be Alterable? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Lewis** | Yes | Yes | Yes | No |
  | **Pearl** | No | Yes | Yes | No |
  | **Woodward** | No | No | Yes | Yes |
  | **Hybrid** | No | No | No | Yes |
