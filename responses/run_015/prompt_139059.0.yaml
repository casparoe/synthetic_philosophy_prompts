answer: |-
  Standing is a genuine normative condition, but its failure renders blame either morally defective or void depending on whether the blamer's conduct negates the target's obligation.

  The question of standing is not merely procedural; it strikes at the heart of what moral blame is for. If blame is simply a judgment that a norm has been violated, then anyone who perceives the violation might issue it. However, if blame is a communicative act that demands accountability and implies a sanction, then the relationship between the blamer and the target matters profoundly. In the context of your departmental rota cases, we see that the accuracy of the blame—that a share was shirked—is distinct from the propriety of the blamer issuing it. The literature often oscillates between treating standing as a moral permission and treating it as a conversational norm. I argue that standing is genuine because moral blame asserts a form of authority over the target, and that authority is compromised when the blamer's own relationship to the norm is tainted. However, the structural consequence of lacking standing is not uniform; it varies by case because the source of the standing failure differs.

  Consider the structure of the defect first. Some philosophers argue that lacking standing makes the blame void, as if it were never successfully issued. Others suggest it is merely an independent wrong, where the blame is accurate but the blamer owes an apology for their audacity. I contend that the structure varies by case. In instances of mere hypocrisy, the blame is defective but not void; the norm was still violated. However, where the blamer's conduct negates the obligation itself, the blame is void. This distinction is crucial for handling your five cases without forcing them into a Procrustean bed.

  The confessing hypocrite lacks standing, yet her blame is not void. She admits her own violation, so she is not deceiving anyone about her record. The defect here is not conversational implicature but moral equality. By violating the norm herself, she places herself outside the position of equality required to demand compliance from another. Her confession prevents the charge of deception, but it does not restore the moral authority required to sanction. The trouble is not that she implies she is compliant; the trouble is that she claims a right to enforce a rule she herself disregarded. Therefore, the blame is morally defective. The target may acknowledge the violation but rightly reject the sanction from this specific source. The unindicted beneficiary similarly lacks standing. Her clean hands are contaminated by the structural injustice she benefits from and sustains by voting against reform. Her blame is defective because it ignores her complicity in the conditions that produced the violation. She cannot demand adherence to a scheme she refuses to make fair.

  The selective enforcer also lacks standing, but for a reason of arbitrariness. By blaming one colleague while exempting an ally, she treats the norm as a weapon rather than a standard. This undermines the norm's authority itself. Her blame is defective because it is discriminatory, rendering the target a victim of partiality rather than justice. The inducer, however, presents a different structural problem. Here, the blame is void. By telling the colleague cover was not needed, she effectively waived the obligation for that instance. When she blames him later, she is blaming him for doing what she authorised. This is not a lack of standing to blame; it is a lack of fact that there was a violation worth blaming. The target's obligation was negated by her instruction, so the blame fails to latch onto anything real. Finally, the proxy retains standing. Her personal shirking is irrelevant because she speaks not for herself but for the union branch. The authority derives from the role and the mandate of the members, not her personal moral record. This case proves that standing is about authority, not merely personal purity.

  This analysis addresses the view that the defect is purely conversational. If the problem were merely that the hypocrite implies she is compliant, her confession should repair the blame entirely. It does not. We still feel she lacks the right to blame us. This suggests the defect is not about what is conveyed but about the normative relationship between the agents. The symmetry test further illuminates this. Does praise require standing? If I praise you for a virtue I lack, is my praise defective? Generally, no. Praise does not carry the same sanctioning force or demand for accountability that blame does. I do not assert authority over you when I praise you; I merely acknowledge value. However, demands for an apology do require standing. If I demand you apologise to me for a wrong you did to someone else, I lack standing unless I am authorised to represent them. This asymmetry confirms that standing is tied to the reactive attitudes that involve claiming a right to hold another accountable. Blame claims a right; praise does not.

  Regarding the state of the literature, it is settled among specialists that hypocrisy undermines standing, that standing is distinct from the correctness of the blame, and that the *tu quoque* dismissal is too quick in moral contexts. It is also settled that proxy roles can confer standing independent of personal conduct. However, it is genuinely contested whether standing failures void the blame or merely make it inappropriate, whether standing is a moral or conversational norm, whether confession restores standing, and whether the source of standing is authority or equality. My verdict that the structure varies by case is a substantial minority position; most theorists seek a unified account of the structural consequence. I assign this verdict a confidence of 0.75, tracking my conviction that the Inducer case is fundamentally different from the Hypocrite case, despite the temptation to unify them. The single consideration that would make me abandon this view is a compelling argument that blame is purely a descriptive assertion of norm violation without any sanctioning or authority-claiming element. If blame were merely truth-telling, standing would vanish entirely. The familiar dismissal of these complaints as mere *tu quoque* fallacies is too quick because it treats moral blame as a logical proposition rather than a normative interaction. In logic, the truth of a statement is independent of the speaker. In morality, the act of blaming is itself a move in a social game, and one's prior moves determine whether one is permitted to play that card.

  The hardest case for this account is the proxy. It is difficult to delineate precisely when a role completely severs the link between personal conduct and official authority. If the proxy's shirking was egregious, would it still not undermine her capacity to speak for the union? There is a threshold where personal moral failure incapacitates role-based authority, and locating that threshold is fraught. Nevertheless, the distinction holds: standing is genuine, but its loss does not always silence the blame; sometimes it merely stains the blamer, and sometimes it voids the charge entirely.

