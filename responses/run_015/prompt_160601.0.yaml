answer: |-
  ### Brainstorming Candidate Cruxes

  1.  **The Commensurability Trap:** This crux focuses on whether the "gains from trade" model illicitly assumes a single metric of value. If Asha values Justice and Ben values Efficiency, can we really say Asha is "compensated" for losing on Efficiency by winning on Justice? The problem here is that students often just say "values are incommensurable" without explaining why that blocks the trade rather than just complicating it.
  2.  **The Integrity/Dirty Hands Limit:** This focuses on whether agents can morally authorize themselves to implement a policy they deem wrong (even if compensated elsewhere). If Asha thinks S is unjust, does implementing S violate her integrity even if she gets P? This is strong because it forces a distinction between *preferences* (which can be traded) and *principles* (which might resist trade).
  3.  **The Strategic Fanaticism Problem:** This focuses on the incentive structure. If the outcome depends on intensity of preference, agents are rewarded for acting like fanatics. The crux is whether a moral theory should endorse a mechanism that incentivizes dishonesty or extremism. Students usually treat this as a practical glitch rather than a moral objection.
  4.  **Moral Uncertainty and Deference:** This focuses on whether Asha should implement S because she isn't sure Ben is wrong. The crux is whether uncertainty mandates compromise or sticking to one's best moral guess. This often devolves into vague hand-waving about "being humble."

  **Selection:** I'm picking **The Integrity/Dirty Hands Limit**. It's the most direct challenge to the Pareto intuition that "if everyone prefers it, it's good." It forces students to confront the difference between getting what you *want* and doing what you *think is right*, which is the heart of the seminar. It also naturally incorporates the incommensurability material without letting them off the hook with buzzwords.

  ***

  ### Exam Question

  **Question 4 (20 Marks)**

  Consider two agents, Asha and Ben, who must jointly settle two independent policy issues. On Issue 1, Asha prefers policy P to the midpoint M1 to policy Q; Ben prefers Q to M1 to P. On Issue 2, the preferences are reversed: Asha prefers R to the midpoint M2 to S; Ben prefers S to M2 to R. Assume both agents care more intensely about their top preference on their "priority" issue than about the loss on their secondary issue. Specifically, Asha prefers the package (P, S) to the compromise package (M1, M2), and Ben also prefers (P, S) to (M1, M2).

  The package (P, S) represents a "gains from trade" solution: it is Pareto superior to the compromise (M1, M2). However, suppose Asha holds that policy S is not merely less desirable than R, but morally impermissible.

  In a closed-book essay, evaluate the moral permissibility of adopting the package (P, S). Does the fact that the package is Pareto superior to the compromise justify the trade, or does the structure of value pluralism and integrity block this reasoning? Your answer must address the distinction between evaluating the package as a whole versus evaluating each policy act individually.

  ***

  ### Model Answer

  The scenario presents a classic tension between social choice efficiency and moral integrity. On the surface, the package deal (P, S) is straightforwardly justified by Pareto efficiency: both Asha and Ben prefer this outcome to the midpoint compromise (M1, M2). In standard welfare economics or preference-based contractarianism, this is sufficient for justification. If both parties consent and both are better off by their own lights, the transaction is valid. However, this seminar has stressed that moral values are not merely preferences to be satisfied, but commitments to be upheld. When we introduce value pluralism and the integrity objection, the justification for the trade becomes far less stable.

  To see why, we must first distinguish between two levels of evaluation: the package level and the act level. At the package level, Asha judges (P, S) as superior to (M1, M2). She gets her most preferred outcome on Issue 1, which she values highly, and accepts a loss on Issue 2. If her values were purely consequentialist preferences—like wanting chocolate versus vanilla ice cream—this trade would be unproblematic. The gain in utility on Issue 1 compensates for the loss on Issue 2. The Pareto improvement captures all the morally relevant information because the "good" is defined solely by preference satisfaction.

  However, the prompt specifies that Asha views policy S as morally impermissible. This shifts the domain from preferences to principles. Here, the integrity objection gains traction. Integrity concerns the relationship between an agent and their actions. If Asha believes S is unjust, implementing S makes her complicit in injustice. The crucial question is whether complicity in injustice on Issue 2 can be "cleansed" or compensated by achieving justice on Issue 1. If values are plural and incommensurable, then Justice on Issue 1 and Injustice on Issue 2 are not fungible currencies. You cannot purchase moral cleanliness with political wins. To argue otherwise is to assume a monistic value system where all moral costs can be netted out against moral gains in a single calculus. Value pluralism denies this. It suggests that some moral costs remain "residual" even after a net benefit is secured.

  Therefore, the Pareto superiority of (P, S) relies on aggregating preferences across domains that may not be aggregable. When Asha says she prefers (P, S) to (M1, M2), she is speaking as a beneficiary. But when she says S is impermissible, she is speaking as a moral agent. The trade requires her to fragment her agency: to act on Issue 1 as a maximizer of her values, and on Issue 2 as a collaborator in what she deems wrong. This creates a "dirty hands" problem. Even if the overall package is better for her projects, her hands are dirty regarding S. The compromise (M1, M2), while less efficient, might allow both agents to avoid implementing a policy they deem strictly forbidden. M1 and M2 are midpoints; they are likely imperfect but perhaps not impermissible. The trade solution maximizes satisfaction but risks maximizing moral violation.

  Furthermore, we must consider the implication of incommensurability on the "gains" themselves. The model assumes Asha can weigh her gain on Issue 1 against her loss on Issue 2. But if Issue 1 concerns, say, free speech and Issue 2 concerns human rights, and Asha views human rights as lexical constraints, the trade collapses. A lexical constraint cannot be traded off. If S violates a lexical constraint for Asha, then (P, S) is not actually preferred to (M1, M2) all-things-considered; it is only preferred if she ignores the constraint. If she respects the constraint, the package is off the table. The Pareto improvement disappears once we move from "what I want" to "what I am permitted to do."

  However, a sophisticated defense of the trade is possible if we distinguish between personal integrity and political responsibility. In a pluralistic society, Asha may recognize Ben's authority to co-govern. She might judge that securing P is so vital that it warrants accepting S as a tragic remainder of political cooperation. This is not treating values as fungible preferences, but acknowledging the moral cost of political power. Here, the trade is not a mere preference swap but a tragic choice. The justification for (P, S) would not be that it is "better" in a simple sum, but that it is the least worst option available given the necessity of joint action.

  Ultimately, the permissibility of (P, S) hinges on the status of S. If S is merely dispreferred, the trade is morally robust. If S is impermissible, the trade is suspect. The Pareto criterion is blind to this distinction. It treats all rankings as equal. A moral evaluation must discriminate between preferences and principles. Therefore, the package deal is only justified if the values at stake are commensurable preferences. If they are pluralistic principles involving constraints, the Pareto improvement is insufficient to override the integrity violation. The compromise (M1, M2) may be less efficient, but it preserves the moral agency of the participants by avoiding clear violations. The "gains from trade" model works for interests, but it fails when applied to convictions.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Identification of Pareto Structure (4 marks)**
  *   **Must hit:** Clearly state that (P, S) is Pareto superior to (M1, M2) because both agents prefer the package deal to the compromise.
  *   **Common error:** Students confuse Pareto superiority with unanimity on each individual issue, claiming the trade fails because Asha hates S.

  **2. The Integrity/Dirty Hands Objection (4 marks)**
  *   **Must hit:** Articulate that implementing a policy deemed impermissible (S) violates integrity regardless of compensation elsewhere.
  *   **Common error:** Students treat integrity as just a "strong preference" rather than a constraint on action.

  **3. Incommensurability/Fungibility Analysis (4 marks)**
  *   **Must hit:** Explain that if values are plural/incommensurable, gains on Issue 1 cannot morally "cancel out" losses on Issue 2.
  *   **Common error:** Students assert incommensurability as a buzzword without explaining why it blocks the trade-off mechanism.

  **4. Act vs. Package Evaluation (4 marks)**
  *   **Must hit:** Distinguish between judging the whole bundle (where the trade looks good) versus judging each act individually (where S looks bad).
  *   **Common error:** Students argue that package evaluation is always wrong, rather than explaining the tension between the two modes.

  **5. Nuanced Normative Conclusion (4 marks)**
  *   **Must hit:** Conclude that the trade is permissible only if values are preferences, but blocked if they are lexical principles/constraints.
  *   **Common error:** Students give a binary "yes" or "no" without conditioning it on the nature of the values at stake.

  **A/B Boundary:**
  The boundary lies in **Criterion 3 (Incommensurability)**. A **B answer** will state that values are incommensurable and therefore trade is hard. An **A answer** will explain *why* incommensurability blocks the specific mechanism of compensation (i.e., that moral costs are non-fungible residues, not subtractable utilities).

  **Total:** 20 Marks
