answer: |-
  Based on John von Neumann's late writings, particularly *The Computer and the Brain*, and his work on probabilistic logic and self-replicating automata, we can reconstruct his position by prioritizing his physicalist constraints over functional similarities. Von Neumann was acutely aware that while computers and brains might solve similar problems, the physical media governing their operations were fundamentally distinct. He argued that the digital computer relies on precise, discrete states and explicit addressing, whereas the brain operates via continuous, analog processes where precision is sacrificed for speed and tolerance. He suspected the brain used a "statistical" rather than an "arithmetic" language, but he remained skeptical that digital machines could fully replicate this without adopting the physical properties of the neural substrate.

  Regarding the **dominance of artificial neural networks and transformers**, von Neumann would likely distinguish sharply between the *mathematics* of these models and the *physics* of their implementation. While he would acknowledge that deep learning abandons symbolic rules for statistical inference—aligning with his hypothesis that the brain does not compute arithmetically—he would note that transformers execute these statistics on deterministic, digital hardware with precise weights and synchronous clocks. To von Neumann, a statistical method implemented on a precise digital substrate is still a digital computation, not a neural one. He would view transformers as a sophisticated evolution of the stored-program architecture he helped define, rather than a breakthrough in brain-like architecture. He would argue that because these systems lack the analog continuity and substrate-specific noise of biological neurons, they remain "computers" in the strict sense, simulating statistical behavior rather than embodying it.

  On the **discovery of stochastic resonance and neural noise**, von Neumann would likely see this as vindication of his view that neural logic is fundamentally different from digital logic. In his work on reliable computing from unreliable components, he proposed using redundancy to *suppress* error and approximate deterministic behavior. The discovery that biological systems *exploit* noise to amplify signals would suggest to him that the brain does not merely tolerate error but integrates randomness into its logical structure. He would interpret this not as a form of digital error correction, but as evidence of a computational regime where noise is a feature of the language itself. This would reinforce his conviction that the brain cannot be modeled simply as a noisy digital computer; rather, it operates on principles where uncertainty is constructive, a property digital machines actively fight against.

  Concerning **predictive coding and free-energy minimization**, von Neumann would find the conceptual shift toward continuous Bayesian inference more congenial to his views than symbolic AI. This framework treats perception as statistical estimation rather than discrete rule-following, matching his speculation that the brain's message system is statistical. However, consistent with his physicalism, he would demand an account of how this inference is physically realized. If predictive coding is implemented via digital backpropagation, he would classify it as a simulation. If it is realized through analog dynamics and energy minimization in physical substrates, he would view it as a closer approximation of neural reality. He would likely appreciate the move away from symbol manipulation but would remain cautious about conflating the mathematical description of inference with the biological mechanism of cognition.

  Ultimately, von Neumann would likely classify **modern LLMs as sophisticated computational tools** rather than cognitive entities. He distinguished between "automata" (which follow rules) and biological organisms (which self-repair and self-organize). LLMs, lacking embodiment, true analog noise, and self-repairing physical structures, would fall into the category of complex automata. He would argue that while they mimic the *output* of statistical cognition, they do not replicate the *process* of neural cognition because they lack the physical constraints that define it. He would maintain that the brain-computer analogy is useful for abstraction but misleading for mechanism.

