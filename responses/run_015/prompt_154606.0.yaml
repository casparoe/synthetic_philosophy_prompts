answer: |-
  **Setting:** *The White Cube Gallery, London. A dimly lit room centreing on a glass vitrine. Inside stands a human-shaped form made of white mycelium. It looks solid, but faint pulses of light suggest metabolic activity. A plaque reads: 'Subject IV (Year 5)'.*

  **Mara:** It's strange, isn't it? Standing here looking at Year Five, knowing none of the matter from Year One is left.

  **Jules:** That's the point, I suppose. But 'looking at' is doing a lot of heavy lifting. You're looking at a different collection of molecules than the ones that were here on opening night.

  **Mara:** Sure, materially. But it's the same statue. The form has persisted, the artistic function is intact. The mycelium sheds old hyphae and grows new ones, but it maintains the shape the artist dictated. That continuity is what makes it the artwork.

  **Jules:** See, that's where I lose you. You're treating 'statue' as a sortal that overrides physics. If I take a lump of clay and swap every molecule, you'd say it's the same statue because the shape holds. But here, you've got a living organism. It's not even inert matter being swapped; it's metabolising. To say it's the 'same statue' implies the statue is an object distinct from the biomass. I don't buy that. The statue just *is* the biomass arranged statue-wise.

  **Mara:** But if the statue is just the biomass, then the artwork died years ago. The specific carbon atoms from Year One are gone, breathed out as CO2. If you hold to strict identity, the artwork vanished the moment the fungus exhaled. That seems absurd. We recognise it as the same piece. The gallery recognises it. The artist recognises it.

  **Jules:** Recognition isn't ontology, Mara. Just because we point and say 'that's Subject IV' doesn't mean there's a persistent object there. You're conflating spatial continuity with numerical identity. It's a useful fiction for navigating the gallery, sure. But ontologically? You've got a colony of fungi. It happens to be shaped like a bloke. Calling it a statue is projecting human intention onto biology.

  **Mara:** Intention isn't just a projection, though. It's constitutive. When the artist seeded that mould, they didn't just grow a fungus; they created an artefact. The intention binds the temporal stages together. The form isn't accidental; it's essential. As long as the colony maintains that human shape through its growth process, it survives the material turnover. The matter is incidental; the form is the object.

  **Jules:** Incidental? The matter is all there is. Look, let's push your view. If the fungus mutates next year and grows a third arm because of a genetic drift, is it still the same statue?

  **Mara:** If the artist accepts the mutation as part of the piece's evolution, yes. If they prune it back to maintain the original form, also yes. It depends on the artistic criteria, not the biological ones.

  **Jules:** Exactly! It depends on *criteria*. That proves my point. The 'statue' isn't a real thing in the world; it's a description we impose based on our criteria. The fungus is the real thing. It's living, breathing, changing. By calling it a statue, you're trying to freeze it into an artefact category that doesn't fit living matter. You're saying the artwork survives total material replacement, but I'm saying you've just got a continuous biological process that we've decided to label 'art'. The label doesn't create a new object.

  **Mara:** But the label changes the persistence conditions. A fungus without the mould is just a colony. A fungus inside the mould, maintained by the gallery, is an artwork. The artist's intention hijacks the biological process and redirects it towards an aesthetic end. That creates a new entity. It's not *just* a fungus anymore, any more than a human is *just* atoms. We emerge from the matter.

  **Jules:** Emergence is one thing. Ontological doubling is another. You're suggesting there are two things in this vitrine: the fungus and the statue. And you're saying the fungus can change completely while the statue stays. I think that's wasteful. Occam's razor. There's only the fungus. The 'statue' is just a way of talking about the fungus's shape at a given time. So, is Year Five identical to Year One? No. Because the matter is different. Is it the same organism? Probably, biologically speaking. But is it the same statue? Only if you think statues are ghosts that haunt lumps of matter.

  **Mara:** I don't think they're ghosts. I think they're defined by their history and function. Think about the Ship of Theseus. If you replace the planks, it's the same ship because of the continuous function and form. Here, the metabolic process *is* the function. The artist didn't sculpt a static object; they sculpted a process. If you deny the identity over time, you deny the medium. You're saying bio-art is impossible because biology changes.

  **Jules:** I'm saying bio-art is possible, but your metaphysics of it is wrong. The artwork isn't an object that persists; it's a performance that persists. If you call it a 'statue', you're importing static artefact rules onto a dynamic system. If I swap every molecule, I've got a different physical object. If you say it's the same statue, you're admitting the statue isn't physical. And if it's not physical, what is it? A pattern?

  **Mara:** A pattern realised in matter, yes. And patterns can survive material change. The music isn't destroyed when the air vibrations stop; it's realised again when the orchestra plays. This fungus is the orchestra. The matter is just the medium of instantiation.

  **Jules:** But music is an abstract type. You're standing in front of a particular token. You're touching the glass, looking at a specific token. If that token is defined by its matter, it's gone. If it's defined by the pattern, then you're not looking at a statue, you're looking at an instance of a design. And honestly, that feels like you're dismissing the reality of the living thing in favour of the human idea stamped on top of it. It's a bit arrogant, isn't it? To say the fungus doesn't count, only the shape counts.

  **Mara:** It's not arrogant, it's categorisation. We categorise things by their relevance to us. A river changes its water every second, but it's the same river. Why? Because its course and function matter more than the H2O. This artwork is the same because its aesthetic trajectory matters more than the hyphae. The artist's intention set that trajectory. Without the intention, it's mould in a box. With it, it's Subject IV. The intention creates the boundary conditions for the object's identity.

  **Jules:** I suppose we're back to whether intention can alter metaphysics. I say it alters description, not reality. You say it alters reality.

  **Mara:** In the social world, intention *is* reality. This is a gallery, Jules. Not a petri dish.

  **Jules:** (Laughs softly) Fair point. But don't expect me to sign the conservation form saying this is the original object.

  **Mara:** I wouldn't ask you to. I'd ask you to sign that it's the same work.

  **Jules:** Semantics.

  **Mara:** Ontology.

  **Jules:** Potato, potah-to. Pass me the catalogue, would you? I want to see what they claim happened in Year Three.

  **Mara:** Here. Just don't read the artist's statement too closely. It might destabilise your materialism.

  **Jules:** And you don't read the biological analysis. Might ruin your form.
