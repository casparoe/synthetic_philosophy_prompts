answer: |-
  \answer{Coherence is a survival constraint, not a moral axiom.}

  ### Session Plan: The Logical Market

  **Target:** 14 participants (Phil/CS mix).
  **Goal:** Experience logical uncertainty and coherence as non-exploitability.
  **Materials:** Whiteboard, sticky notes (3 colors), markers, 6 laptops (for verification), timer, printed handouts.

  ---

  ### 1. The Sentences (6 Candidates)
  *All are decidable within 5 minutes using a laptop or careful arithmetic.*

  1.  **$S_1$:** The 100th decimal digit of $\pi$ is 7. (**True**)
      *   *Settle:* WolframAlpha/Python `str(pi)[101]`.
      *   *Risk:* Low. Many know early digits, 100th is obscure.
  2.  **$S_2$:** The number 8191 is prime. (**True**)
      *   *Settle:* Python `sympy.isprime(8191)` or trial division up to $\sqrt{8191} \approx 90$.
      *   *Risk:* Mersenne prime $2^{13}-1$. CS students might know.
  3.  **$S_3$:** $17^5 \pmod{100} = 57$. (**True**)
      *   *Settle:* Modular arithmetic ($17^2=289 \equiv 89 \equiv -11$; $17^4 \equiv 121 \equiv 21$; $17^5 \equiv 357 \equiv 57$).
      *   *Risk:* High computation cost for mental math; easy for laptop.
  4.  **$S_4$:** There are exactly 95 primes less than 500. (**True**)
      *   *Settle:* `sympy.primepi(500)`.
      *   *Risk:* Pure memorization check.
  5.  **$S_5$:** ($S_1 \to S_2$). "If the 100th digit of $\pi$ is 7, then 8191 is prime." (**True**)
      *   *Settle:* Material implication truth table (True $\to$ True = True).
      *   *Risk:* Confusion about relevance vs. material implication.
  6.  **$S_6$:** ($S_2 \to S_3$). "If 8191 is prime, then $17^5 \pmod{100} = 57$." (**True**)
      *   *Settle:* Material implication (True $\to$ True = True).
      *   *Risk:* Same as $S_5$.

  *Note:* $S_5$ and $S_6$ are crucial for testing the coherence constraint $P(A) + P(A \to B) \ge P(B)$.

  ---

  ### 2. Roles and Rules

  **Participants (Traders):**
  *   Start with **100 Points**.
  *   Write **Limit Orders** on sticky notes: *"Buy $S_i$ @ 0.60"* or *"Sell $S_i$ @ 0.70"*.
  *   Stick notes on the central Board under the relevant Sentence.
  *   **Goal:** Maximize points. Top 3 players choose next week's reading.

  **The Exploiter (Rotates every round):**
  *   Given a separate **Exploiter Bankroll** (does not count toward prize).
  *   **Power:** May execute *any combination* of trades against the sticky notes on the board instantly.
  *   **Goal:** Maximize Exploiter Bankroll by finding incoherence (e.g., buying $S$ and $\neg S$ for < 1.00 total) or computing truths the market mispriced.
  *   **Constraint:** Must execute trades *before* truth reveal.

  **The Facilitator (You):**
  *   Acts as the Clearing House. When Exploiter trades, you adjust Trader points immediately.
  *   Acts as the Oracle. Verifies truth at reveal time.

  **Payoff Scheme:**
  *   **Share:** Costs $p$ points. Pays 1 point if True, 0 if False.
  *   **Short (Sell):** You receive $p$ points. Pay 1 point if True, 0 if False.
  *   **Exploit Penalty:** If Exploiter makes profit on a Trader's note, that loss is deducted from the Trader's stack immediately.

  ---

  ### 3. One-Page Handout (For Participants)

  **LOGICAL MARKET RULES**

  1.  **Objective:** End the session with the most Points. Top 3 pick the next reading.
  2.  **Assets:** Six sentences ($S_1$–$S_6$) are on the board. Each is either True or False.
  3.  **Trading:** Write limit orders on sticky notes: *"Buy $S_1$ @ 0.60"* or *"Sell $S_1$ @ 0.70"*. Place them on the board. Prices must be between 0.00 and 1.00.
  4.  **Settlement:** At round end, truth is revealed. True shares pay 1.00; False pay 0.00. Shorts pay the difference.
  5.  **The Exploiter:** One player per round is the Exploiter. They scan the board. If your prices allow a guaranteed profit combination (e.g., buying $S_1$ and Not-$S_1$ for less than 1.00), they will execute it against you immediately. You lose the difference.
  6.  **Computation:** You may use laptops to verify math. The Exploiter may also compute.
  7.  **Warning:** Inconsistent prices bleed points. Ignorance is not safety.

  *(Word count: 148)*

  ---

  ### 4. Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Deal**
  *   Hand out rules. Assign Exploiter #1 (pick a CS student to start).
  *   Explain sticky note mechanics.
  *   **Crucial:** Define "Not-$S_i$" as available for trade implicitly (Selling $S_i$ is betting on $\neg S_i$).
  *   Clarify Material Implication for $S_5, S_6$ ($A \to B$ is False only if $A$ True, $B$ False).

  **00:10 – 00:25: Round 1 (Trading + Exploit)**
  *   Traders post notes (10 mins).
  *   Exploiter #1 scans for arbitrage (5 mins).
  *   *Facilitator Action:* Log Exploiter Profit on the "Leakage Ledger" (Whiteboard). Deduct from Traders.

  **00:25 – 00:30: Reveal 1**
  *   Settle $S_1, S_2$. (Keep $S_5, S_6$ hidden to maintain logical tension).
  *   Pay out winning shares.

  **00:30 – 00:45: Round 2 (Trading + Exploit)**
  *   Rotate Exploiter #2 (Phil student).
  *   Traders post notes on remaining/related sentences ($S_3, S_5, S_6$).
  *   Exploiter scans. Focus on $P(S_1) + P(S_1 \to S_2) < P(S_2)$ violations.
  *   *Facilitator Action:* Update Ledger.

  **00:45 – 00:50: Reveal 2**
  *   Settle $S_3, S_5$.

  **00:50 – 01:05: Round 3 (The Crunch)**
  *   Rotate Exploiter #3.
  *   Final trading on all sentences.
  *   Exploiter goes hard on coherence.
  *   *Facilitator Action:* Final Ledger update.

  **01:05 – 01:10: Final Reveal**
  *   Settle $S_4, S_6$.
  *   Tally scores. Announce winners.

  **01:10 – 01:15: Debrief**
  *   Map Ledger to the 4 Learning Objectives.

  ---

  ### 5. The Debrief (Mapping Moments to Objectives)

  Do not lecture. Point to the whiteboard.

  1.  **Genuine Uncertainty:** Point to Round 1 prices on $S_1$ ($\pi$ digit). "Nobody knew this initially. Prices ranged 0.3–0.7. You felt uncertainty about a fixed fact."
  2.  **Coherence via Loss:** Point to the **Leakage Ledger**. "Exploiter #1 made 15 points. Where? Row 3: Bought $S_1$ and Sold $S_1$ from different people at sum < 1.00. You weren't punished for being wrong; you were punished for contradicting each other."
  3.  **0.5 is Vulnerable:** Point to Round 2. "Someone priced $S_3$ at 0.50 because 'I don't know.' Exploiter #2 computed it in 30 seconds and took 50 points from you. Hesitation costs money against computation."
  4.  **No Unique Prior:** Point to Final Prices. "Winners had different final prices (0.8 vs 0.9), but both were unexploitable. There wasn't one 'right' price, only prices that didn't bleed."

  **Best Established:** Objective 2 (Coherence as Loss). The Ledger provides visceral evidence of money vanishing due to structure, not truth.

  ---

  ### 6. Troubleshooting: What Will Go Wrong

  *   **CS Students Compute $S_1$ Instantly:**
      *   *Fix:* Ban internet on $S_1$ for Round 1 only. Force "logical uncertainty" initially. Allow laptops Round 2+.
  *   **Market Freezes (No Orders):**
      *   *Fix:* You (Facilitator) seed the board with 2-3 dummy orders to break inertia. "I'll buy $S_1$ @ 0.50 if no one else does."
  *   **Confusion on Conditionals ($S_5, S_6$):**
      *   *Fix:* Write the truth table for $A \to B$ on the board permanently. Remind them: "If Antecedent is False, the sentence is True."
  *   **Exploiter Becomes Market Maker:**
      *   *Fix:* Remind Exploiter: "You cannot post orders. You can only *take* existing orders. You are a shark, not a fish."
  *   **All-In Hunches:**
      *   *Fix:* Cap orders at 20 shares per sentence per person to prevent early elimination.

  ---

  ### 7. Limitations (What You Must Say Out Loud)

  In the final 2 minutes, acknowledge what the game hid:

