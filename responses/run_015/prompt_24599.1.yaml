answer: |-
  This is a precise and penetrating question. You are asking for the measure-theoretic foundations of a heuristic that economists and gamblers treat as intuitive. Since you think in terms of convergence and existence, I will frame the answer in terms of integration theory, state functions, and the conditions required for an observable to be well-defined.

  Here is the examination of the practice, structured by your three requests.

  ### 1. The Implicit Theory: What the Practice Presupposes

  The practice of pricing by expected value (EV) treats the expectation operator $E[\cdot]$ as a **linear functional** mapping the space of gambles to the extended real number line $\bar{\mathbb{R}} = \mathbb{R} \cup \{-\infty, +\infty\}$.

  Strictly speaking, the practice presupposes one of two conditions for any gamble $X$ it prices:
  1.  **Absolute Integrability:** $E[|X|] < \infty$. In this case, the sum converges regardless of the order of terms (by the Riemann Rearrangement Theorem analogue for series). The value is a stable, intrinsic property of the distribution.
  2.  **One-Sided Divergence:** Either $E[X^+] = \infty$ and $E[X^-] < \infty$ (yielding $+\infty$), or vice versa (yielding $-\infty$). This allows the St. Petersburg game to be priced as "infinity" within the extended reals.

  The practice **does not** merely presuppose that a sum can be written down; it presupposes that the sum defines a **state function**. In thermodynamics, a state function (like entropy or internal energy) depends only on the current state of the system, not the path taken to reach it. In pricing, the "state" is the probability distribution and payoff structure. The "path" is the order in which we sum the outcomes.

  By treating EV as a single determinate number, the practice presupposes that **the order of summation is irrelevant.** This is mathematically equivalent to presupposing that the gamble is Lebesgue integrable. In measure-theoretic probability, the expectation is defined via the Lebesgue integral. A function is Lebesgue integrable only if the integral of its absolute value is finite, *or* if the positive and negative parts do not both diverge.

  Therefore, the strict presupposition is: **"All gambles encountered in practice belong to the space $L^1$ (integrable) or are semi-integrable (one-sided infinite)."** The practice implicitly denies the existence of gambles where $E[X^+] = \infty$ and $E[X^-] = \infty$ simultaneously.

  ### 2. Coherence and the Distinction from St. Petersburg

  Is this presupposition coherent? Mathematically, no, because the space of all possible random variables includes the Pasadena case. Practically, it is coherent only if physical constraints (finite bankrolls, finite time) force absolute convergence. But as a theoretical pricing mechanism, it is incomplete.

  **Distinguishing Pasadena from St. Petersburg**
  The standard EV practice can technically handle St. Petersburg but fails catastrophically on Pasadena.
  *   **St. Petersburg:** The series is $\sum \frac{1}{2}$. The partial sums $S_N = N/2$ diverge monotonically to $+\infty$. In the extended reals, this is a determinate value. The pricing practice says: "Pay any finite amount to play." This is consistent, if counterintuitive.
  *   **Pasadena:** The series is $\sum (-1)^{n-1} \frac{1}{2}$. The partial sums oscillate: $1/2, 0, 1/2, 0 \dots$. There is no limit in $\mathbb{R}$, and there is no limit in $\bar{\mathbb{R}}$ (it does not go to $+\infty$ or $-\infty$). The expectation is **undefined**.

  **Do Standard Replies Transfer?**
  You asked whether the standard physical/economic cutoffs rescue the Pasadena game. They do not, and the failure mode is different.

  *   **Bounded Utility:** If we apply a bounded utility function $U(x)$ (e.g., $\tanh(x)$), both games become absolutely convergent. The terms decay fast enough. This solves the problem by changing the quantity being summed, not by fixing the EV of the dollar payoffs. It admits that raw dollar EV is the wrong quantity.
  *   **Finite Wealth/Truncation:** This is where the physics of the limit matters.
      *   *St. Petersburg:* If you truncate at $N$ flips, the value is $N/2$. As $N \to \infty$, the truncated values converge to $+\infty$. The limit of the truncated values exists.
      *   *Pasadena:* If you truncate at $N$ flips, the value is $0$ (if $N$ even) or $1/2$ (if $N$ odd). As $N \to \infty$, the sequence of truncated values **does not converge**. It oscillates forever.
      *   *Implication:* For St. Petersburg, you can argue the "true" value is the limit of the physically realizable truncated games. For Pasadena, **there is no limit to approach.** The value is not merely large; it is path-dependent. If the casino counts outcomes in a different order (e.g., grouping two losses for every win), the sum changes. By the Riemann Rearrangement Theorem, since the positive and negative parts both diverge, you can reorder the outcomes to make the expected value **any real number you like**.

  *   **Impatience (Discounting):** If payoffs are discounted by time $\delta^n$ with $\delta < 1$, the terms become $\frac{1}{2}\delta^n$. Both games converge absolutely. This works, but it again changes the object: you are no longer pricing the gamble described, but a time-decayed version of it.

  **The Conceptual Failure:**
  The practice treats EV as an intrinsic property of the gamble (like mass). The Pasadena game demonstrates that for unbounded gambles with mixed signs, EV is an **extrinsic property** dependent on the summation order (like work done, which is path-dependent). The practice presupposes path-independence where none exists.

  ### 3. Underdetermination and Required Changes

  **Where the Practice is Underdetermined**
  In the domain of "well-behaved" gambles (where $E[|X|] < \infty$), several distinct theories of value collapse into the same pricing number:
  1.  **Frequentism:** The long-run average payoff per trial.
  2.  **Bayesian Fairness:** The price that prevents a Dutch Book (sure loss).
  3.  **Risk-Neutral Utility:** The price where $U(\text{wealth} + \text{payoff} - \text{price}) = U(\text{wealth})$.

  For the Pasadena game, these theories diverge:
  *   **Frequentism:** The long-run average does not converge. The Law of Large Numbers requires $E[|X|] < \infty$. Without it, the sample mean does not settle to a number.
  *   **Bayesian Fairness:** You cannot construct a Dutch Book against a price of $0$, nor against $1/2$, nor against $100$. Because the sum can be rearranged to justify any price, no price is strictly "unfair" in the standard sense.
  *   **Utility:** As noted, only bounded utility resolves this, which abandons EV pricing for Utility pricing.

  The practice is underdetermined because it assumes these three concepts are identical. They are only identical on the subspace of absolutely convergent gambles.

  **What Must Change if We Accept Valueless Gambles?**
  If we accept that some well-defined gambles have no expected value, the practice of pricing must shift from **calculation** to **constraint**.

  1.  **Existence Preconditions:** Just as a physicist will not calculate the temperature of a system not in equilibrium, a pricer must verify $E[|X|] < \infty$ before assigning a number. If the condition fails, the gamble is "unpriceable" by EV methods.
  2.  **Dominance over Expectation:** Decision theory must rely on **Stochastic Dominance** rather than Expectation Dominance.
      *   *Expectation Dominance:* Choose $A$ over $B$ if $E[A] > E[B]$. (Fails for Pasadena).
      *   *Stochastic Dominance:* Choose $A$ over $B$ if $P(A > x) \ge P(B > x)$ for all $x$. (This remains well-defined even when expectations diverge, provided the distributions are distinct).
  3.  **Market Exclusion:** In a rigorous market, contracts resembling the Pasadena game would be voided or prohibited, not because they are risky, but because they lack a **clearing price**. A market price implies a consensus number; if the mathematical object has no number, the market is attempting to clear a non-existent quantity.

  ### Summary: The Conceptual Work

  You asked what the practice is doing when it treats an undefined quantity as a number.

  It is performing a **regularization**. In physics, when an integral diverges, we often introduce a cutoff or a renormalization scheme to extract a finite number. The pricing practice implicitly regularizes all gambles by assuming the "tail" of the distribution contributes zero or behaves regularly.

  In the St. Petersburg case, the regularization (truncation) yields a stable limit ($\infty$). In the Pasadena case, the regularization yields an oscillation. By ignoring this, the practice assumes that **all observables commute with the limit operation.**

  Is it defensible?
  *   **Empirically:** Yes, because in the physical universe, all payoffs are bounded (there is not enough mass-energy in the universe to pay out $2^{1000}$ dollars). Therefore, $E[|X|]$ is always finite in reality. The Pasadena game is a mathematical singularity that physical constraints remove.
  *   **Theoretically:** No. It depends on the premise that the mathematical model of the gamble (infinite support) maps cleanly to the pricing quantity. The Pasadena game exposes that this map is not a function; it is a relation that is multi-valued unless restricted to absolutely convergent subspace.

  The practice presupposes that the universe of finance is $L^1$. The Pasadena game proves it is not, unless you impose physical cutoffs. If you impose physical cutoffs, the game is no longer Pasadena; it is a finite oscillating sum, which has a value, but that value depends entirely on *where* you cut. Thus, the value is not a property of the gamble, but a property of the **counterparty's solvency limit**.

  The practice treats the value as intrinsic. The example shows it is extrinsic. That is the defect.
