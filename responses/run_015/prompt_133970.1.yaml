          *Standard Example:*
          P1: T, M, B. P2: L, R.
          T: 1,1 | 1,1
          M: 1,1 | 0,0
          B: 0,0 | 0,0
          For P1: T weakly dominates M (1=1, 1>0). T weakly dominates B (1>0, 1>0).
          For P2: L weakly dominates R?
          If P1 plays T: L=1, R=1.
          If P1 plays M: L=1, R=0.
          If P1 plays B: L=0, R=0.
          L weakly dominates R.
          Order 1: Eliminate R (weakly dominated by L).
          Game becomes P1 vs L.
          P1: T=1, M=1, B=0.
          Eliminate B. T and M remain.
          Result: {T, M} x {L}.
          Order 2: Eliminate M (weakly dominated by T).
          Game: P1 {T, B}, P2 {L, R}.
          T: 1,1 | 1,1
          B: 0,0 | 0,0
          P2: L weakly dominates R (1>=1, 0>=0). Eliminate R.
          P1: T=1, B=0. Eliminate B.
          Result: {T} x {L}.
          The sets are different ({T,M} vs {T}).
      *   *Verdict:* **FALSE**. IEWDS is order-dependent.

