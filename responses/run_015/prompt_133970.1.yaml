  5.  **Analyze Claim 4: Weak Dominance.**
      *   *Claim:* "The same is true if you replace strict dominance with weak dominance... unique outcome regardless of the order."
      *   *Fact:* Iterated Elimination of *Weakly* Dominated Strategies (IEWDS) is **Order Dependent**.
      *   *Example:*
