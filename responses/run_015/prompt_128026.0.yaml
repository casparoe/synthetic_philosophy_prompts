answer: |-
  **Exam Question**

  **Question 4 (20 Marks)**
  Consider the Two-Envelope Paradox variant where the amounts in the envelopes are drawn from an improper prior (a non-normalizable weighting function over all positive real numbers). In this scenario, the global expected value is undefined, yet the local conditional expectation suggests switching is always beneficial.

  Write a concise essay addressing the following three components:
  1.  **The Local Illusion:** Reconstruct why the argument for switching remains compelling for any specific observed amount $x$, despite the global prior being improper.
  2.  **The Decision Status:** Evaluate whether declaring the expectation "undefined" resolves the paradox. Does this imply you should stay, switch, or that rational choice is suspended?
  3.  **The Indexical Objection:** Analyze the claim that averaging over "the other envelope" is illegitimate here for reasons analogous to the *Sleeping Beauty* problem (i.e., involving indexical uncertainty rather than just distributional limits).

  *Note: No citations are required. Focus on conceptual precision regarding expectation logic and indexical belief.*

  ***

  **Model Answer**

  The persistence of the switching argument under an improper prior stems from the decoupling of local conditional probabilities from global normalization. Locally, upon observing amount $x$, the agent reasons that the other envelope contains either $2x$ or $x/2$. Because the prior is improper (effectively flat over an infinite range), the likelihood ratio between the world where $x$ is the smaller amount and the world where $x$ is the larger amount appears symmetric (1:1) for any finite $x$. Consequently, the local conditional expectation $E(Y|X=x) = 0.5(2x) + 0.5(x/2) = 1.25x$ holds mathematically for every observed $x$. The compelling nature of the switch arises because the local logic relies only on relative symmetry, which the improper prior preserves pointwise, even though it fails globally.

  However, stating that the global expectation is undefined does not dissolve the paradox; it relocates it into a crisis of decision theory. If the expected utility of both staying and switching is undefined (infinity minus infinity or divergent integrals), standard Expected Utility (EU) maximization cannot rank the options. This does not imply indifference (which requires equal defined values) nor does it strictly mandate staying. Instead, it suggests rational choice is suspended: the decision rule itself is inapplicable. The paradox persists because our intuition demands a action-guiding norm, but the mathematical framework offers none. To say "expectation is undefined" is to admit the tool is broken, not that the job is done.

  Finally, the indexical objection deepens this impasse by challenging the coherence of the averaging procedure itself. In *Sleeping Beauty*, averaging over awakenings is contentious because "today" is an indexical referent that shifts across centered worlds. Similarly, in the Two-Envelope problem, "the other envelope" is an indexical term whose reference depends on which possible world obtains (the world where I hold the smaller sum vs. the larger sum). With a proper prior, we weight these worlds to average safely. With an improper prior, we lack a coherent measure over these centered possibilities. We are attempting to average over indexical perspectives without a normalized measure of self-location. Thus, the symmetry breaking is not merely about the impossibility of a uniform distribution over magnitudes, but about the illegitimacy of averaging over indexical positions when the global measure fails to normalize. The paradox reveals a limit in applying uncentered expectation logic to indexical choices under non-normalizable uncertainty.

  ***

  **Marking Scheme**

  **Total Marks: 20** (5 Criteria × 4 Marks)

  | Criterion | Must-Hit Point | Common Error (Deduction) |
  | :--- | :--- | :--- |
  | **1. Local Logic** | Explains that local conditional symmetry (1:1 likelihood of $2x$ vs $x/2$) holds pointwise regardless of global divergence. | **(-2)** Confusing improper priors with uniform priors over finite sets. |
  | **2. Local/Global Tension** | Distinguishes between the validity of the local calculation ($1.25x$) and the failure of the global integral. | **(-2)** Claiming the local calculation is mathematically wrong rather than contextually isolated. |
  | **3. Decision Status** | Argues that "undefined" implies suspension of EU maximization, not indifference or a mandate to stay. | **(-2)** Treating "undefined" as equivalent to "zero gain" or indifference. |
  | **4. Indexical Analogy** | Connects "the other envelope" to *Sleeping Beauty* style centered worlds/indexical uncertainty rather than just magnitude distribution. | **(-2)** Reducing the indexical point to a standard symmetry break without mentioning reference/centering. |
  | **5. Synthesis** | Concludes that the paradox exposes a limit in applying uncentered expectation logic to indexical choices under non-normalizable uncertainty. | **(-2)** Ending with a generic summary without linking indexicality to the decision failure. |

  **Grading Distinction:**
  *   **A Answer (16-20 marks):** Integrates the three moves into a cohesive narrative. Explicitly articulates why "undefined" prevents indifference. Clearly draws the *Sleeping Beauty* parallel regarding centered worlds vs. uncentered propositions.
  *   **B Answer (10-15 marks):** Addresses all three prompts but treats them as separate checklist items. May correctly identify the improper prior issue but falters on the decision-theoretic implication (e.g., suggests staying is rational) or treats the indexical point as merely semantic.
