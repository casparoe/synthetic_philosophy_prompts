answer: |-
  Here is a Q&A prep sheet tailored to your specific audience and argument.

  ### **Pre-Game Note on Terminology**
  Your "Genesis vs. Continuation" distinction is catchy, but be prepared for it to be treated as a *label* rather than an *argument*. The seniors will want to know the metaphysical cash value.
  *   **The Roommate Worry (Omission/Commission):** Flag this immediately if it comes up, but don't let it stick. The Omission/Commission distinction is about *agency* (doing vs. allowing). Your distinction is about *counterfactual dependence of identity*. Make sure you clarify: "This isn't about whether we acted or refrained; it's about whether the victim's existence is contingent on the specific act complained of."

  ---

  ### **Objection 1: The Parfit Specialists (The "Causal Chain" Attack)**
  **Who:** The two seniors who taught *Reasons and Persons*.
  **The Objection:** "You're assuming climate policy affects *conditions* for the same people, while reproductive choice affects *identity*. But Parfit's point is precisely that large-scale social policies (like climate) shift conception dates and partner choices just as much as a teenager's choice does. The people in 2100 under a 'Green Policy' are not the same people as under a 'Burn Policy.' So your 'Continuation Harm' is metaphysically illusory. It's Genesis Harm all the way down."
  **Severity:** **Critical.** This destroys the dichotomy.
  **Concede Up Front:** "You're right that strictly speaking, identity is sensitive to small causal changes in both cases."
  **2-Minute Reply:** "I grant the metaphysical sensitivity. But my distinction isn't about the *causal history* of the people; it's about the *structure of the grievance*. In the reproductive case, the grievance *is* existence (I shouldn't have been born). In the climate case, the grievance is *environmental* (I exist, but my air is toxic). Even if the specific individuals differ between worlds, the *type* of complaint available to the 2100 population is 'you worsened our habitat,' not 'you caused us to exist.' I'm distinguishing the *normative structure of the harm claim*, not the metaphysical pedigree of the victims."
  **Where It's Weakest:** They will press that if the people are different, you can't say "we made *their* air worse" in a person-affecting way. You are smuggling in an impersonal comparison.

  ### **Objection 2: The Political Philosopher (The "Distraction" Attack)**
  **Who:** The one who thinks identity metaphysics distracts from justice.
  **The Objection:** "Why are we doing this gymnastics? If a policy leads to a future where people suffer due to climate change, it's unjust. Whether those specific people would have existed otherwise is irrelevant to distributive justice. By trying to save the 'person-affecting' view, you're tying our hands to a metaphysical puzzle that shouldn't matter for policy."
  **Severity:** **Medium.** It challenges the *point* of your project, not the logic.
  **Concede Up Front:** "I agree that ultimately, justice shouldn't hinge on metaphysics."
  **2-Minute Reply:** "I'm not arguing justice hinges on this; I'm arguing *political motivation* does. Person-affecting principles resonate with our moral psychology ('don't harm people') in ways impersonal principles ('make the world better') often don't. My goal is to show climate ethicists they don't need to abandon the person-affecting intuition to get the right result. I'm trying to bridge the gap between our moral instincts and our policy obligations, not define justice itself."
  **Where It's Weakest:** They may argue that if the person-affecting view requires metaphysical contortions to work, it's the view that should be abandoned, not saved.

  ### **Objection 3: The Climate Grad Student (The "Literature" Attack)**
  **Who:** The intergenerational justice specialist.
  **The Objection:** "This looks like a version of the 'Identity-Insensitive Harm' argument (like Meyer or Gardiner). They've already argued we can compare the welfare of the person who exists to a 'counterpart' in the other world. What does 'Continuation Harm' add? Is it just a new name for an existing solution, or does it solve the 'Non-Intuitive Result' problem better?"
  **Severity:** **Medium-High.** Risks making your contribution look incremental.
  **Concede Up Front:** "It shares DNA with identity-insensitive accounts."
  **2-Minute Reply:** "Existing accounts often bite the bullet that we are comparing across different identities, which feels metaphysically spooky. My 'Continuation' move tries to ground the comparison in the *continuity of the social and biological environment*. We aren't comparing Person A to Person B; we are comparing the *conditions of life* for the cohort that occupies that time slot. It shifts the focus from 'same soul' to 'same historical trajectory,' which I think is more robust for policy than standard counterpart theories."
  **Where It's Weakest:** You need to be clear on why "historical trajectory" isn't just a vague way of saying "impersonal good."

  ### **Objection 4: The Epistemologists (The "Modal" Attack)**
  **Who:** The two who like modal logic.
  **The Objection:** "When you say 'we made their air worse,' what is the modal status of 'their'? In the world where we pass the Green Policy, 'they' don't exist. So you're making a trans-world identity claim. Are you committed to haecceities? Or are you using a rigid designator that fails to refer in the counterfactual world?"
  **Severity:** **Low-Medium.** Mostly technical, but can bog you down.
  **Concede Up Front:** "I want to avoid heavy metaphysical commitments if possible."
  **2-Minute Reply:** "I'm treating 'they' as a definite description of the occupants of the 2100 time-slice, not a rigid designator of specific souls. I'm comparing the welfare level of the occupants of World A (2100) vs. World B (2100). The harm is located in the drop in welfare for whoever fills that slot, not in the identity of the filler."
  **Where It's Weakest:** This sounds suspiciously like an impersonal principle disguised as person-affecting language.

  ---

  ### **The "Dreaded Objection" (The One You Hope Nobody Asks)**
  **The Question:** "If the Nonidentity Problem arises because the choice determines *who* exists, and climate policy determines *who* exists (via the causal chain the seniors mentioned), isn't your 'Continuation Harm' just a label for 'cases where we ignore the identity problem'? You haven't solved the problem; you've just stipulated that climate cases don't count."

  **Why it's dreaded:** It attacks the core coherence of your distinction. If climate policy changes identity (which it does), then it *is* Genesis Harm by your own definition (act brings about the victim's existence).

  **How to Defend (Without Panicking):**
  1.  **Don't deny the metaphysics.** Admit that climate policy changes *who* is born.
  2.  **Pivot to the "Baseline of Complaint."** Argue that the Nonidentity Problem only *bites* (i.e., blocks moral judgment) when the *only* alternative for the victim is non-existence.
  3.  **The Move:** In the reproductive case (14-year-old girl), if she waits, *that specific child* never exists. The alternative for the child is non-existence. In the climate case, even if Policy A leads to Person X and Policy B leads to Person Y, the alternative for Person X is not non-existence *simpliciter*, it is "existing in a better world" (conceptually).
  4.  **The Kicker:** "I am arguing that for the purposes of *harm*, we should treat the 'future generation' as a continuing entity of moral concern, regardless of turnover. The NIP relies on the intuition that you can't harm someone by bringing them into a life worth living. But in climate cases, we aren't debating whether their life is worth living; we are debating whether we degraded the *common inheritance*. The identity turnover is incidental to the harm of degradation."

  ---

  ### **Defending Your Weakest Point: The "Genesis/Continuation" Boundary**
  **The Weakness:** The line is blurry. Is a policy that causes a famine (leading to different conceptions) "Continuation"? Is IVF selection "Genesis"?
  **Defense Strategy:** **Functionalism over Metaphysics.**
  Don't defend the distinction as a metaphysical fact about the universe. Defend it as a **normative tool**.
  *   **Say this:** "I'm not claiming the universe is divided into two metaphysical kinds of acts. I'm claiming our moral practices track this distinction. We *treat* reproductive choices as identity-constituting in our legal and moral frameworks (wrongful life suits, etc.), but we *treat* environmental policy as condition-setting. My paper explains why that intuitive divergence is rational, even if the underlying metaphysics of identity is messy. The distinction is valid because it tracks where the Nonidentity intuition actually has persuasive force."

  ### **Final Tip for the Q&A**
  If the Parfit seniors gang up on the metaphysics, defer to the Political Philosopher's instinct: "If the metaphysics of identity makes climate action impossible, that's a *reductio* of the strict person-affecting view, not a reason to abandon climate obligations. My project is to show we don't have to choose. But if forced, I side with the obligation." This shows you know the stakes aren't just semantic.
