          *   Both agree DT derivation *works* mathematically *if* you accept the axioms.
          *   Both agree the friction point is the *justification* of the axioms.
      *   **Section 2: Disagreements Table.**
          *   *Crux 1: Axioms & Branch Counting.*
              *   Neutral: Do rationality axioms assume a measure?
              *   Everettian: Axioms are about preference consistency, not ontology.
              *   Skeptic: Axioms implicitly assume a continuum of states, ignoring discrete branching.
          *   *Crux 2: The 10-vs-1 Copy Case.*
              *   Neutral: Equal weight, different "branch counts."
              *   Everettian: Branch count is ill-defined (basis ambiguity). Weight is fundamental.
              *   Skeptic: If physics creates 10 copies, ignoring them looks like begging the question.
      *   **Section 3: Concrete Arguments/Predictions.**
          *   Need to specify what happens in the 10-vs-1 case.
          *   Everettian: Agent bets on the single branch (higher weight per branch? No, wait. The prompt says "equal norm-squared weight". So 10 branches share 0.5 weight, 1 branch has 0.5 weight. Or 10 branches have total weight W, 1 branch has total weight W. Let's clarify: "ten physically identical agent-copies in one sector and one in another with equal norm-squared weight". This means Sector A has 10 branches, Sector B has 1 branch. Total amplitude squared for A = Total amplitude squared for B.
          *   Everettian Prediction: Agent is indifferent (Born rule depends on total weight, not branch count).
          *   Skeptic Prediction: Agent should prefer Sector A (more copies experience the outcome) OR the setup reveals the incoherence of "weight" without count.
      *   **Section 4: The Verbal Dispute Conclusion.**
          *   Is it just about the word "probability"?
