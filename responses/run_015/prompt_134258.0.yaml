      *   **Camp 1 (Everettian/Decision-Theoretic):** Accepts the decision-theoretic derivation of the Born rule (e.g., Deutsch-Wallace). Believes branching creates self-locating uncertainty suitable for probability.
      *   **Camp 2 (Determinist-Skeptic):** Thinks branching worlds break self-locating uncertainty (or that probability makes no sense in a deterministic multiverse where everything happens). Skeptical of deriving probability from rationality axioms without circularity.
      *   **Structure:**
          1.  Numbered section of Agreed Claims (Formalism, Measurement Problem, Derivation successes/failures).
          2.  Disagreements Table (Crux, Neutral Description, Camp 1 Formulation, Camp 2 Formulation).
