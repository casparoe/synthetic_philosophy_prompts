prompt: |-
  Write the collaboration document that an Everettian camp accepting the decision-theoretic derivation of the Born rule and a determinist-skeptic camp that thinks branching worlds break self-locating uncertainty ought to be able to sign together after arguing for a year. Start with a numbered section of agreed claims: what the unitary formalsim actually says, what the measurement problem demands, where the derivation succeeds versus where it appeals to rationality constraints. Then do a disagreements table — each row should have the crux in neutral words, then each camp's formulation phrased so theyd actually sign off on their own column. The cruxes I care about are: can rational-choice axioms be applied over branches without already presupposing a branch-counting measure; and what should we say about a contrived case where the Hamiltonian splits the world into ten physically identical agent-copies in one sector and one in another with equal norm-squared weight — does that count against either view. For each crux, write the concrete argument or case both sides agree bears on it, then each side's predicition in advance. End with whether any chunk of this fight is just verbal about 'probability' in a deterministic multiverse. Keep it somewhat in the weeds but dont ask for citations or reading lists — just reason from the formalism and the argument structure. Oh, and writting it casual is fine, im not grading grammar.
reasoning: |-
  Here's a thinking process that leads to the collaboration document:

  1.  **Analyze the Request:**
