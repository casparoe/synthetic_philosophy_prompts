              *   Rational-choice axioms over branches vs. presupposing branch-counting.
              *   The "Ten Copies vs. One Copy" case (equal norm-squared weight, different branch counts).
          4.  For each crux: Concrete argument/case, Side A prediction, Side B prediction.
          5.  Conclusion: Is any of this just verbal disputes about 'probability'?
      *   **Tone:** Casual, "in the weeds," no citations/reading lists, reasoning from formalism and argument structure.
      *   **Goal:** A document both sides could *actually sign* after a year of arguing (meaning it accurately reflects their positions without caricature, even if they still disagree).

  2.  **Deconstruct the Physics/Philosophy:**
      *   *Unitary Formalism:* Schrödinger equation is linear and deterministic. No collapse. Superposition persists.
      *   *Measurement Problem:* How do we get definite outcomes/probabilities from a superposition of all outcomes?
      *   *Decision-Theoretic Derivation (DT):* Agents should act *as if* the Born rule is true to maximize utility. Probability is emergent from rational behavior.
      *   *Skeptic's Worry:* If everything happens, "probability" is illusory. If branching is just physical splitting, why weight by amplitude squared ($|\psi|^2$) instead of branch count? DT axioms might smuggle in the Born rule via "Equivalence" or "Diachronic Consistency."
      *   *The "Ten Copies" Case:* This is a crucial test. If the wavefunction splits into 10 branches of amplitude $\alpha$ and 1 branch of amplitude $\sqrt{10}\alpha$ (normalized appropriately), does the agent care about the *number* of branches (10 vs 1) or the *weight* (Born rule)?
          *   Standard MWI/DT: Weight matters. Branch count is ill-defined (basis dependence).
          *   Skeptic: If branches are physically identical copies, why does weight matter? If branch count is real, DT fails. If branch count is fake, DT needs to explain why without circularity.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look like a working document. "Joint Statement of Partial Agreement..."
      *   **Section 1: Agreed Claims.**
          *   Need to establish common ground on the math. Both agree on Unitary QM.
