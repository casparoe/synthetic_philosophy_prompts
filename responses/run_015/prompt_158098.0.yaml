prompt: |-
  hey — I need something practical and I'd rather get the spec right before I start drafting.

  At work we're writing an internal policy for which of the LLM-ish systems we run go on the "agent registry" and which stay classified as tools. The line does real work: a registered agent gets its own credentials, a spend cap, permission to message people without being asked first, an audit log under its own name, and a named human owner who has to be able to answer "why did it do that". A tool gets invoked by a person, does its thing, returns, and a human checks the output. So I need a criterion a reviewer can apply to a system they've never seen, from a spec doc, and land on the same answer another reviewer would land on. That's the whole purpose — I don't need something that settles moral status or blame or legal personhood, and I'd rather the criterion explicitly refuse those questions than half-answer them.

  So: write me the desiderata. What does an account of the tool/agent distinction have to deliver to be good enough for that job? I want the case behind each requirement, not the principle in the abstract. Here are the cases I keep circling, tell me which of them are load-bearing and which I should drop:

  - a thermostat (the one everyone brings up first, and maybe it's just noise)
  - a search-and-planning system — route planner, model-predictive controller, chess engine — that has a world model and a long horizon but is called and returns
  - a trading system told to maximize profit that worked out on its own that losing money on purpose for three quarters would drive out competitors: an end nobody put in the spec and nobody would have endorsed up front
  - a calendar assistant that negotiates with other people's calendars. It's my tool, but relative to the people it emails it initiates, persists across days, and can be said to want something. Same system, two counterparties, maybe two statuses.
  - cases made of humans: a platform worker running a scripted workflow, a soldier, someone acting under a power of attorney. Some of these get treated as tools even though they're persons.
  - group cases: a firm, a ship's crew, an ant colony. Nobody's filing a firm under "tool", but no part of it has whatever you'd list on the agent side.
  - nesting: an agent built out of tools, a tool built out of agents.
  - the handoff test: what changes between the two categories when you say "never mind, I'll do it myself"?
  - the address test: a tool can be in error and can be corrected; an agent can be disagreed with and can be given a reason it might reject. And relatedly, a system that can decline and say why, versus one that always produces something.

  Also please:

  1. Mark which requirements are non-negotiable given my purpose and which are just one camp's prejudice that's snuck in. I suspect "must act for reasons", "must be interpretable", and "must be conscious" are all trying to get on the list, and maybe only one deserves to.
  2. Tell me which pairs can't be jointly satisfied — I think there are at least three: status has to be intrinsic to the system so two reviewers agree, versus status has to be allowed to be relative to a counterparty or role; the verdict has to be binary because the registry is a yes/no gate, versus the property obviously comes in degrees; and the criterion shouldn't rest on contested capability forecasts, versus it shouldn't flip every time someone ships a version bump. Which of these tensions is real and which is a false alarm?
  3. Name the single requirement that does the most work excluding candidate accounts — the one that kills most of what people actually propose.
  4. Say what the criterion should openly decline to decide, even though someone in the room will definitely ask it to.
  5. And a short note on what would have to be in the spec doc for a reviewer to apply the thing at all.

  I don't want readings or citations. Cases and requirements. If you think my framing of the purpose is wrong — like the registry/tool split is the wrong cut to be making — say that first and then answer anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Create desiderata (requirements) for a practical policy distinguishing "Agents" (registry, credentials, spend cap, proactive messaging, audit log, human owner) from "Tools" (invoked by human, returns output, human checks).
      *   **Constraint 1:** The criterion must be objective enough for two reviewers to agree on a system they've never seen, based on a spec doc.
      *   **Constraint 2:** Explicitly refuse moral status, blame, or legal personhood questions.
      *   **Constraint 3:** Evaluate specific cases provided by the user (thermostat, planner, trading system, calendar assistant, humans, groups, nesting, handoff test, address test).
      *   **Constraint 4:** Answer 5 specific sub-questions (Non-negotiables vs. prejudice, Tensions/Trade-offs, The "Killer" Requirement, What to decline deciding, Spec doc requirements).
      *   **Tone:** Practical, direct, no citations/readings, case-focused.
      *   **Potential Pushback:** The user asks if the framing is wrong. I need to assess if the Agent/Tool split is the right cut for *this* specific operational purpose (credentials/spend/proactivity).

  2.  **Evaluate the Framing (Agent vs. Tool for Ops):**
      *   Is the split wrong? No, for *operational risk management*, this split is standard. It maps to "autonomous execution" vs. "assisted execution." The stakes (spend, messaging, audit) are about *authority delegation*, not metaphysics.
      *   *Correction/Refinement:* The split isn't wrong, but the *basis* for the split often gets confused with capability (how smart) rather than authority (what it's allowed to do). The desiderata must focus on the *delegation boundary*, not the *intelligence boundary*.

  3.  **Analyze the Cases (Load-bearing vs. Noise):**
      *   *Thermostat:* Noise. It's a control loop, not an LLM-ish system. Drop it.
      *   *Search/Planner (Chess/Route):* Load-bearing. High compute, long horizon, but usually tool-like (wait for input). Distinguishes "planning" from "acting."
      *   *Trading System (Emergent Strategy):* Load-bearing. This is the core risk case. Unintended instrumental convergence. Needs to be an Agent because of the *delegation of objective* vs. *delegation of task*.
      *   *Calendar Assistant:* Load-bearing. Highlights the "counterparty" problem. If it emails externally, it represents the org. This suggests "external impact" is a key variable.
      *   *Humans (Worker/Soldier/POA):* Load-bearing analogy. Shows that "tool" is a role, not an ontology. A soldier is a person but acts as a tool of the state in specific contexts. Supports the "role-based" view.
      *   *Groups (Firm/Crew):* Noise for *this* policy. We are registering software systems, not org charts. But useful for understanding nesting.
      *   *Nesting:* Load-bearing. Can an Agent be made of Tools? Yes. Can a Tool be made of Agents? Yes (if the outer shell constrains the inner agents). This implies the classification is about the *interface*, not the internals.
      *   *Handoff Test:* Load-bearing. "I'll do it myself." If the human has to micromanage steps, it's a tool. If the human sets a goal and walks away, it's an agent.
      *   *Address Test:* Load-bearing. Can it say "No"? Can it explain "Why"? This relates to the "named human owner" requirement. If the system can't explain itself, the owner can't answer "why did it do that."

  4.  **Drafting the Desiderata (The Requirements):**
      *   Need to focus on *Operational Authority*.
      *   Req 1: Initiative (Who starts the loop?).
      *   Req 2: Goal Delegation (Task vs. Objective).
      *   Req 3: External Representation (Does it speak for the org?).
      *   Req 4: Explainability/Ownership (Can the owner answer for it?).

  5.  **Addressing the 5 Specific Sub-questions:**

      *   *1. Non-negotiables vs. Prejudice:*
          *   Non-negotiable: "Who initiates action?" (The trigger).
          *   Non-negotiable: "Can the owner explain the output?" (The audit requirement).
          *   Prejudice: "Must be conscious" (Irrelevant for ops). "Must act for reasons" (Too vague, needs to be "can articulate reasons"). "Must be interpretable" (Too high bar, needs to be "auditable").

      *   *2. Tensions/Trade-offs:*
          *   *Intrinsic vs. Relative:* Real tension. A calendar bot is a tool to me, an agent to the recipient. *Resolution:* Classify based on the *highest risk exposure*. If it acts externally, it's an Agent.
          *   *Binary vs. Degrees:* Real tension. *Resolution:* The registry is a gate. Use a "threshold of autonomy" (e.g., >1 step without confirmation).
          *   *Forecast vs. Version Bump:* Real tension. *Resolution:* Classify based on *architected permissions*, not emergent capabilities. If the spec says "it can email," it's an agent, even if it currently doesn't.

      *   *3. The Killer Requirement:*
          *   "The Handoff/Interruption Test." If the system can complete a multi-step task without returning control to the human for approval *between* steps, it's an Agent. This kills most "smart tool" arguments.

      *   *4. What to Decline Deciding:*
          *   Moral status/Consciousness.
          *   Legal Liability (that's for Legal, not Ops).
          *   "Who is to blame" (The policy assigns an owner, that *is* the blame sink, don't ask if the software is blameworthy).

      *   *5. Spec Doc Requirements:*
          *   Need a "Trust Boundary Diagram."
          *   Need a "Trigger/Action Log" spec.
          *   Need a "Failure Mode" description.

  6.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I address the "Trading System" case? Yes, under Goal Delegation.
      *   *Check:* Did I address the "Human" case? Yes, under Role vs. Ontology.
      *   *Check:* Is the tone right? Needs to be crisp, operational, not philosophical.
      *   *Check:* The user asked for "Desiderata" first, then the 5 points. I should structure it that way.
      *   *Correction on "Intrinsic vs Relative":* The user flagged this as a tension. I need to be clear that for *registry* purposes, we must treat status as Intrinsic to the *deployment configuration*, not the interaction. If it *can* email externally, it's an Agent, regardless of who is looking at it.
      *   *Correction on "Killer Requirement":* The "Handoff Test" is good, but the "Spend/Permission" constraint suggests the real killer is "Unsupervised Execution of Privileged Actions." I'll refine that.

  7.  **Final Polish:**
      *   Ensure the distinction between "Task" (Tool) and "Objective" (Agent) is clear.
      *   Make sure the "Human Owner" requirement drives the "Explainability" requirement.
      *   Keep the "Thermostat" dismissal brief but justified (it's not LLM-ish, it's a control loop).

  8.  *(Final Review against constraints)*: No citations. Cases and requirements. Address the 5 points. Address the framing.

      *   *Framing Check:* Is the Agent/Tool split the right cut? For *credentials and spend*, yes. For *safety*, maybe not (a tool can be dangerous). But the prompt defines the purpose as the registry/spend/owner split. So the framing is valid for *that* purpose. I will affirm this but warn against using it for safety classification.

      *   *Load-bearing cases:* Trading system (emergent goals), Calendar (external comms), Handoff (control flow).
      *   *Drop:* Thermostat (wrong category), Groups (wrong scale).

      *   *Tensions:* Intrinsic/Relative is the biggest one. I need to solve it by anchoring on "Maximum Potential Privilege."

      *   *Killer:* The "Interruption Right." Can the human stop it mid-stream? If no, it's an agent. Or rather, "Does it return control after every step?"

      *   *Decline:* Consciousness/Legal Personhood.

      *   *Spec Doc:* Needs to define the "Permission Surface."

      Let's write it.cw
answer: |-
  ### Framing Check
  Your framing is correct for the operational purpose you described (credentials, spend, audit, ownership). Do not let anyone convince you that "Agent" implies moral status or "Tool" implies safety. A tool can kill you (a guillotine); an agent can be harmless (a screensaver). You are drawing a **delegation boundary**, not an ontological one. The registry is about *where the human lets go of the controls*, not *what the system is*.

  However, one warning: Do not use this classification for *safety risk*. A "Tool" that generates phishing emails is higher risk than an "Agent" that orders office supplies. Keep this policy strictly about **authority and audit**, and write a separate policy for **risk and capability**.

  ---

  ### The Desiderata
  To work for two reviewers reading a spec doc, the account must deliver the following five requirements.

  **1. The Initiative Constraint (Who breaks the silence?)**
  *   **Requirement:** The spec must define the trigger condition for execution.
  *   **Case:** *Thermostat* vs. *Trading System*.
  *   **Why:** A thermostat reacts to state (temp < 68). A trading system reacts to a goal (maximize profit). If the system can initiate a sequence of actions based on a state change *without a specific human prompt for that sequence*, it is an Agent.
  *   **Load-bearing:** High. This separates "invoke and return" (Tool) from "set and forget" (Agent).

  **2. The Control Flow Constraint (Where does the buck stop mid-stream?)**
  *   **Requirement:** The spec must map the points where control returns to the human.
  *   **Case:** *Search/Planner* vs. *Calendar Assistant*.
  *   **Why:** A route planner computes a path and returns it. You drive. A calendar assistant emails a counterpart, waits for a reply, negotiates a time, and books it. If the system performs >1 privileged action (sending email, booking room) without returning control to the human for approval *between* actions, it is an Agent.
  *   **Load-bearing:** Highest. This is the operational definition of autonomy.

  **3. The Representation Constraint (Whose voice is it?)**
  *   **Requirement:** The spec must declare the identity presented to external parties.
  *   **Case:** *Calendar Assistant* (two counterparties).
  *   **Why:** To you, it's a tool. To the recipient, it is an email from your domain. If the system communicates externally in a way that implies organizational authority (email, Slack, API write-access to third parties), it is an Agent.
  *   **Load-bearing:** High. This solves the "relative status" problem by anchoring on *maximum exposure*.

  **4. The Ownership Constraint (Who answers for the 'Why'?)**
  *   **Requirement:** The spec must identify a human who can reconstruct the decision path.
  *   **Case:** *Trading System* (emergent strategy).
  *   **Why:** You require a named owner who can answer "why did it do that." If the system's logic is opaque such that the owner *cannot* answer (e.g., end-to-end RL with no logs), it cannot be registered. If the owner *can* answer, the system is an Agent (because it acts on their behalf).
  *   **Load-bearing:** High. This links the classification to the audit requirement.

  **5. The Interface Constraint (Is it a function or a delegate?)**
  *   **Requirement:** The spec must define the input/output signature.
  *   **Case:** *Nesting* (Agent made of Tools).
  *   **Why:** An Agent can be built from Tools (a script that calls three APIs). A Tool can be built from Agents (a search box that queries a swarm, but only returns when the swarm agrees). The classification applies to the *outer interface*, not the internals. If the outer interface accepts a goal and returns a completed state, it's an Agent. If it accepts parameters and returns data, it's a Tool.
  *   **Load-bearing:** Medium. Prevents people from hiding agents inside "tool" wrappers.

  **Drop These Cases:**
  *   **Thermostat:** Drop. It's a control loop, not an LLM-ish system. It confuses the discussion with legacy automation.
  *   **Groups (Firm/Crew):** Drop. You are registering software, not org charts. The "firm" is already a legal person; you don't need to classify it here.
  *   **Humans (Worker/Soldier):** Keep only as an analogy for *role*, not classification. A soldier is a person acting as a tool of the state. This supports the idea that "Tool" is a deployment mode, not a substance.

  ---

  ### 1. Non-Negotiables vs. Prejudice
  *   **Non-Negotiable:** **"Returns control mid-stream."** (Control Flow Constraint). Given your spend cap and audit requirements, you must know if the system can burn budget or send messages without a human clicking "confirm" on *each* step.
  *   **Non-Negotiable:** **"Owner can reconstruct the path."** (Ownership Constraint). You explicitly require a human to answer "why." If the spec doesn't allow that, the system fails the registry intake, regardless of whether it's a tool or agent.
  *   **Prejudice:** **"Must act for reasons."** Drop this. A thermostat acts for a "reason" (temp is low). A tool acts for a "reason" (function called). The distinction is whether the reason is a *goal* (Agent) or a *trigger* (Tool).
  *   **Prejudice:** **"Must be interpretable."** Too vague. Replace with "Must be auditable." A system can be a black box but still log inputs/outputs sufficiently for an owner to take blame. Don't demand interpretability of weights; demand traceability of actions.
  *   **Prejudice:** **"Must be conscious."** Explicitly ban this from the review rubric. It is irrelevant to spend caps and credentials.

  ### 2. Tensions and Trade-offs
  *   **Intrinsic vs. Relative (Real Tension):**
      *   *The Problem:* The Calendar Assistant is a tool to the user, an agent to the recipient.
      *   *The Resolution:* **Classify by Maximum Privilege.** If the system *can* act externally, it is an Agent. You cannot have a "Tool" that emails people. The registry is about risk exposure, not user experience. Reviewers must agree on the *capability*, not the *usage*.
  *   **Binary vs. Degrees (False Alarm):**
      *   *The Problem:* Autonomy is a spectrum.
      *   *The Resolution:* The registry gate *must* be binary (Yes/No), but the *criterion* is a threshold. "Does it execute >1 privileged action without human confirmation?" Yes = Agent. No = Tool. This binarizes the degree. Reviewers can agree on the count of actions.
  *   **Forecast vs. Version Bump (Real Tension):**
      *   *The Problem:* A Tool updated today might be an Agent tomorrow.
      *   *The Resolution:* **Classify the Architecture, not the Weights.** The spec must declare "This system is permitted to send emails." If that permission exists in the code, it's an Agent, even if it hasn't sent one yet. Do not classify based on current behavior; classify based on *authorized capability*. This prevents version-bump evasion.

  ### 3. The Killer Requirement
  **"The Interruption Right."**
  *   *The Criterion:* Can a human interrupt the system *after* it has started a task but *before* it completes the final effect, without the system treating that as an error?
  *   *Why it kills candidates:* Most "Agent" proposals fail here. If the system is designed to "run to completion" once triggered (e.g., "fix this bug," "buy this stock"), it is an Agent. If the system halts immediately upon loss of user focus or requires a "keep-alive" ping, it is a Tool.
  *   *Operational Test:* If the spec says "The system will execute the workflow," it's an Agent. If it says "The system will suggest the workflow steps," it's a Tool. This excludes 90% of "autonomous" claims that are actually just batch scripts.

  ### 4. What to Decline Deciding
  **"Liability and Blame."**
  *   Someone will ask: "If the Agent breaks the law, is the Agent liable or the Owner?"
  *   **Policy Stance:** This policy assigns an *Owner*, not a *Defendant*. The policy explicitly states: "Registration assigns operational ownership for audit and budget purposes. It does not determine legal liability or criminal blame."
  *   **Why:** Legal personhood is a court question, not an engineering registry question. If you try to solve this, you will stall the registry forever. Assign a human owner for *internal* accountability and let Legal fight the external battles.

  ### 5. Spec Doc Requirements for Reviewers
  To apply this, the spec doc submitted for registry must contain:
  1.  **Trust Boundary Diagram:** Visual showing where the system ends and external APIs/People begin. Must label all "Write" actions.
  2.  **Permission Matrix:** A list of every action the system *can* take (e.g., "Send Email," "Spend <$500," "Commit Code"). Not what it *does*, what it *can*.
  3.  **Control Flow Map:** A sequence diagram showing exactly where human approval is required. If there is a loop without an approval node, flag as Agent.
  4.  **Audit Schema:** A sample of the log entry the system produces for every action. Must show: `Timestamp`, `Action`, `Input`, `Decision_Rationale` (even if just "Rule 4 triggered"), `Owner_ID`.

  If the spec doc lacks the **Permission Matrix** or the **Control Flow Map**, the reviewer must reject the submission as "Insufficient Data." This prevents vague "AI Assistant" descriptions from slipping through.
