prompt: |-
  i sit on my museum's public-program board and lately we're getting exhibit-tie-in proposals that lean hard into pseudohistory: Atlantis as an actual engineering culture, ancient aliens editing cuneiform, and this Russian mathematician's idea that ancient Rome and the middle ages are just duplicated records in a fake chronology (Fomenko's new chronology thing). i need a decision procedure my team can actually run on each pitch in about 15 minutes: questions in order, what counts as a sufficent answer to reject, where the call has to go to a real historian because it's values not facts, and be honest about where the checklist misfires. ground it in whatever philosophy of sicence says about demarcation but keep it practical. apply it to two proposals: one claiming Atlantis was a tech hub in the Aegean, and one pushing Fomenko-style duplicated dynasties. include a case where the procedure says reject but a serious amateur historian might still disagree, and flag what the checklist can't settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a museum's public-program board.
      *   **Problem:** Receiving exhibit proposals based on pseudohistory (Atlantis, Ancient Aliens, Fomenko's New Chronology).
      *   **Goal:** A 15-minute decision procedure (checklist/flowchart) to evaluate pitches.
      *   **Requirements:**
          *   Questions in order.
          *   Criteria for rejection (sufficient answers).
          *   Criteria for escalation to a professional historian (values vs. facts).
          *   Honesty about limitations (where the checklist misfires).
          *   Grounding in philosophy of science (demarcation problem).
          *   Practical application to two specific proposals (Atlantis tech hub, Fomenko chronology).
          *   Include a "false positive/negative" case (reject but serious amateur disagrees).
          *   Flag what the checklist can't settle.

  2.  **Theoretical Grounding (Philosophy of Science):**
      *   *Demarcation Problem:* How to distinguish science/history from pseudoscience/pseudohistory.
      *   *Key Thinkers:* Karl Popper (Falsifiability), Thomas Kuhn (Paradigms/Normal Science), Imre Lakatos (Research Programmes), Larry Laudan (Demise of Demarcation).
      *   *Practical Adaptation:* We can't get bogged down in deep epistemology. We need *indicators* of pseudohistory.
      *   *Key Indicators:* Immunity to counter-evidence, conspiracy thinking (suppression of truth), lack of peer review, reliance on anomalies rather than systematic data, anachronism.
      *   *Museum Ethics:* ICOM Code of Ethics (accuracy, public trust, scholarly rigor).

  3.  **Drafting the Decision Procedure (The "15-Minute Filter"):**
      *   *Structure:* Needs to be sequential. Start easy, get harder.
      *   *Phase 1: Source & Method (The "Popper" Check).* Is there a way to be wrong?
      *   *Phase 2: Evidence Handling (The "Lakatos" Check).* How do they treat counter-evidence?
      *   *Phase 3: Community & Consensus (The "Kuhn" Check).* Where does this live academically?
      *   *Phase 4: Museum Mission (The "Values" Check).* Does this harm public trust?
      *   *Decision Points:* Pass, Reject, Escalate.

  4.  **Refining the Questions (Iterative Process):**
      *   *Draft 1:* Is it true? (Too hard).
      *   *Draft 2:* Do historians agree? (Too vague).
      *   *Draft 3:* Can you show me the primary source? (Better).
      *   *Final Polish:* Focus on *process* rather than *truth*. Museums aren't courts of ultimate truth, but guardians of methodology.
      *   *Key Question:* "What evidence would change your mind?" (Falsifiability).
      *   *Key Question:* "Where is this published?" (Peer review).
      *   *Key Question:* "How do you explain the silence of contemporary records?" (Conspiracy vs. Gap).

  5.  **Developing the Case Studies:**
      *   *Case A: Atlantis as Aegean Tech Hub.*
          *   Claim: Advanced tech in Bronze Age.
          *   Red Flags: Anachronistic tech, ignoring lack of archaeological residue, Plato as literal history.
          *   Verdict: Reject.
      *   *Case B: Fomenko/New Chronology.*
          *   Claim: History is compressed/faked.
          *   Red Flags: Mathematical pattern matching without context, denying carbon dating, conspiracy of global scale.
          *   Verdict: Reject (Hard).
      *   *Case C: The "Edge Case" (Reject but debatable).*
          *   Need something that looks pseudohistorical but has some scholarly traction or is a legitimate revisionist debate.
          *   *Idea:* The "Bronze Age Collapse" causality. Was it climate change? Earthquakes? Systems failure? Some proponents might sound conspiratorial ("The System Failed") but it's legitimate debate.
          *   *Better Idea:* A proposal on the "Sea Peoples" identity. It's highly contested. A pitch might claim a specific identity (e.g., "They were Mycenaeans") which is minority view but not pseudohistory.
          *   *Best Idea:* A proposal on *pre-Clovis* settlement of the Americas. 20 years ago, this was pseudoscience. Now it's consensus. If the checklist is too rigid, it kills legitimate paradigm shifts.

  6.  **Addressing the "Values vs. Facts" Escalation:**
      *   When does a historian need to step in?
      *   When the claim isn't about *data* but about *narrative impact*.
      *   Example: "The Dark Ages weren't dark." This is a historiographical debate, not a factual error. The checklist might flag it as "contrarian," but it's valid history.

  7.  **Addressing Limitations (Where it Misfires):**
      *   Paradigm shifts (Semmelweis effect).
      *   Interdisciplinary work (looks weird to historians but valid in geology/physics).
      *   Public engagement vs. Academic rigor (something can be fun/educational without being cutting-edge research).

  8.  **Final Review against Constraints:**
      *   15 minutes? Yes, the checklist is short.
      *   Philosophy grounded? Yes (Popper/Lakatos mentioned).
      *   Two specific proposals applied? Yes.
      *   Disagreement case included? Yes.
      *   Honest about limitations? Yes.

  9.  **Writing the Output:** (Self-Correction during drafting)
      *   *Tone:* Professional, pragmatic, not condescending to the board members but firm on standards.
      *   *Formatting:* Use bolding, lists, and clear sections for readability.
      *   *Check:* Make sure I explicitly mention Fomenko and Atlantis in the application section.

  10. **Final Polish:** Ensure the distinction between "pseudohistory" (methodologically flawed) and "revisionist history" (methodologically sound but controversial) is clear, as that's the core tension. (Proceed to generate response).

  *(Self-Correction on the "Disagreement Case"):* I need to make sure the case where the checklist says "Reject" but an amateur might disagree is distinct from the pseudohistory cases. It needs to be a *legitimate* controversy that looks suspicious. The "Pre-Clovis" example is good because it was once heresy. Or perhaps the "Out of Africa" vs. "Multiregional" debate. Let's go with a specific archaeological interpretation that is minority but valid. Let's use the "Gobekli Tepe changed everything" pitch. It's often co-opted by pseudo-archaeology (ancient aliens), but the actual archaeology is legitimate, just revolutionary. A strict checklist might flag it as "anomaly hunting."

  *Wait, better:* A proposal arguing for a specific, controversial identification of a biblical figure based on a single inscription. It's fringe, but methodologically historical (epigraphy), not pseudo. The checklist might catch it on "Consensus."

  *Decision:* I will use the "Gobekli Tepe" angle but frame it carefully. It's often used to support pseudo-claims, but the core archaeology is real. A pitch focusing *only* on the anomaly without the context might get flagged.

  *Actually, let's stick to the prompt's request:* "Include a case where the procedure says reject but a serious amateur historian might still disagree."
  *Selection:* A proposal arguing that the "Dark Ages" is a misleading term and proposing an exhibit on "Continuity in Late Antiquity."
  *Why?* To a layperson/board member, this sounds like "denying the fall of Rome" (Fomenko-adjacent). To a historian, it's standard Peter Brown-style historiography. The checklist might flag it under "Contradicts Established Narrative." This highlights the limitation of the tool regarding *interpretation* vs. *fact*.

  *Wait, one more check:* The prompt asks for "where the call has to go to a real historian because it's values not facts." I need to make sure that section is distinct.

  *Okay, plan solidified.*
  1. Intro: Philosophy grounding (Laudan/Popper).
  2. The 15-Minute Filter (4 Steps).
  3. Application to Atlantis.
  4. Application to Fomenko.
  5. The "False Positive" Case (Dark Ages/Continuity).
  6. Limitations & Escalation.

  *Let's write.*
answer: |-
  This is a classic demarcation problem. In philosophy of science, Karl Popper argued that what makes a theory scientific is **falsifiability** (can you prove it wrong?). Imre Lakatos added that legitimate research programs can withstand anomalies, but they must eventually produce new facts, not just explain away old ones. Larry Laudan famously argued that "demarcation" is a dead concept, but for a museum, you don't need perfect epistemology; you need **risk management for public trust.**

  Your museum's currency is credibility. Pseudohistory isn't just "wrong"; it is characterized by specific *methodological failures*: immunity to counter-evidence, reliance on conspiracy (suppressed truth), and anachronism.

  Here is a 15-minute decision procedure grounded in these principles, designed for non-specialists.

  ### The 15-Minute "Methodology Filter"

  **Instructions:** Ask the proposer these four questions in order. If they fail any bolded **Stop Condition**, the proposal is rejected unless escalated (see Section 4).

  #### 1. The Falsifiability Check (Popper)
  *   **Question:** "What specific piece of evidence, if found tomorrow, would prove your thesis wrong?"
  *   **Good Answer:** "If we found carbon dating showing this layer is 1,000 years younger," or "If a contemporary text explicitly denied this event."
  *   **Bad Answer:** "That evidence is lost/destroyed," "The records were faked," or "Mainstream science ignores it."
  *   **🛑 STOP CONDITION:** If the theory is immune to counter-evidence (i.e., lack of evidence *is* evidence of a cover-up), **REJECT.**

  #### 2. The Anomaly vs. System Check (Lakatos)
  *   **Question:** "Does your exhibit explain the *majority* of the data, or does it rely on highlighting gaps in the current model?"
  *   **Good Answer:** "We use the standard timeline but show where new data suggests a trade route shift."
  *   **Bad Answer:** "Standard history can't explain this one artifact, therefore the whole timeline is wrong."
  *   **🛑 STOP CONDITION:** If the argument rests entirely on an **argument from ignorance** ("Science can't explain X, therefore my theory is true"), **REJECT.**

  #### 3. The Publication & Peer Check (Kuhn)
  *   **Question:** "Where has this research been published, and who has critiqued it?"
  *   **Good Answer:** "Journal of X," "University Press," or "We are presenting at Y conference."
  *   **Bad Answer:** "Self-published book," "YouTube documentary," or "Academics are too closed-minded to review it."
  *   **🛑 STOP CONDITION:** If the work exists entirely outside the ecosystem of peer critique (books, blogs, lectures only), **REJECT.**

  #### 4. The Anachronism Check (Context)
  *   **Question:** "Are you attributing capabilities, concepts, or technologies to this culture that appear nowhere else in their time period?"
  *   **Good Answer:** "They had better metallurgy than neighbors, consistent with regional trade."
  *   **Bad Answer:** "They had electricity/computers/flight when no one else did."
  *   **🛑 STOP CONDITION:** If the claim requires **exceptionalism without mechanism** (magic tech appearing in isolation), **REJECT.**

  ---

  ### Application to Current Proposals

  #### Case 1: "Atlantis as an Aegean Tech Hub"
  *   **Claim:** Atlantis was a real Bronze Age engineering culture in the Mediterranean with advanced power generation.
  *   **Running the Filter:**
      1.  *Falsifiability:* Proposer claims lack of tech remnants is due to "sea level rise destroying everything." (Fail: Immune to counter-evidence).
      2.  *Anomaly:* Relies on Plato's dialogue as literal engineering log, ignores lack of archaeological residue (wiring, power sources) in the strata. (Fail: Argument from ignorance).
      3.  *Publication:* Self-published monograph and lecture tour. (Fail: No peer review).
      4.  *Anachronism:* Claims "power generation" in 10,000 BCE without any precursor tech in the record. (Fail: Exceptionalism).
  *   **Verdict:** **REJECT.**
  *   **Why:** This fails all four stops. It treats myth as data and absence of evidence as evidence of destruction.

  #### Case 2: "The New Chronology" (Fomenko Style)
  *   **Claim:** Ancient Rome and the Middle Ages are duplicates; history is compressed by 1,000 years via a global conspiracy.
  *   **Running the Filter:**
      1.  *Falsifiability:* Proposer claims carbon dating is "calibrated incorrectly by the establishment." (Fail: Immune to counter-evidence).
      2.  *Anomaly:* Uses statistical patterns in texts to claim duplication, ignores physical stratigraphy, dendrochronology, and ice core data. (Fail: Ignores majority of data).
      3.  *Publication:* Published in math journals (Fomenko was a mathematician) but rejected by all history/archaeology journals. (Fail: Wrong ecosystem).
      4.  *Anachronism:* Requires a global conspiracy of record-keepers across enemies (Church, Caliphate, Empire) to agree on a fake timeline. (Fail: Mechanism impossible).
  *   **Verdict:** **REJECT.**
  *   **Why:** This is the textbook definition of pseudohistory. It substitutes mathematical pattern-matching for historical context and requires a conspiracy that violates human behavior patterns.

  ---

  ### The "False Positive" Case (Where the Checklist Misfires)

  **Proposal:** "The Dark Ages Were a Myth: Continuity in Late Antiquity."
  *   **Claim:** The fall of Rome wasn't a collapse; it was a transformation. There was no "Dark Age."
  *   **Running the Filter:**
      1.  *Falsifiability:* "If we find mass depopulation layers in 500 CE vs 300 CE." (Pass).
      2.  *Anomaly:* Challenges the "Gibbonian" narrative of collapse. (⚠️ **Flag:** Looks like "contradicting established narrative").
      3.  *Publication:* Published by university presses (Peter Brown, etc.). (Pass).
      4.  *Anachronism:* None. (Pass).
  *   **The Conflict:** A board member might flag this at **Step 2** because it sounds like they are "denying the fall of Rome" (similar to Fomenko denying the timeline). A serious amateur historian might argue, "But the cities *did* shrink! This exhibit is revisionist."
  *   **Verdict:** The checklist might trigger a **ESCALATE** flag here, even though this is legitimate historiography.
  *   **Why it misfires:** The filter is designed to catch *methodological* fraud, not *interpretive* debate. "Dark Ages" is a value judgment/periodization, not a hard fact. The checklist treats "challenging the standard narrative" as a risk factor, which is necessary to catch Fomenko, but it risks catching legitimate paradigm shifts.

  ---

  ### Escalation Protocol: When to Call a Historian

  Do not use the checklist to make final calls on **Escalate** results. Send these to a professional historian. You need a human when the issue is **Values** or **Interpretation**, not Facts.

  **Send to Historian if:**
  1.  **The "Consensus" is Shifting:** The proposal challenges a view that was standard 20 years ago but is now debated (e.g., Pre-Clovis settlement of the Americas, the cause of the Bronze Age Collapse).
  2.  **Community Sensitivity:** The exhibit touches on living traditions, indigenous oral histories, or national identity where "facts" are contested by the community itself.
  3.  **The "Dark Ages" Problem:** The proposal is interpretive (e.g., "This wasn't a collapse, it was a transition") rather than factual (e.g., "This collapse didn't happen").

  **What the Checklist Cannot Settle:**
  *   **Paradigm Shifts:** Science changes. If you strictly enforce "Consensus" (Step 3), you would have rejected Wegener's Continental Drift in 1920. The checklist protects the museum from *crankery*, but it cannot identify *genius*.
  *   **Public Engagement vs. Rigor:** A proposal might be methodologically thin but excellent at teaching *how* we know things (e.g., "The Mystery of the Sea Peoples"). The checklist might flag it as "uncertain," but it has educational value.
  *   **Interdisciplinary Friction:** A geologist might propose a timeline based on sediment cores that contradicts a historian's timeline based on texts. The checklist sees "conflict"; the reality is "data integration needed."

  ### Summary for the Board
  *   **Reject** if the theory cannot be proven wrong, relies on conspiracies, or exists outside peer review.
  *   **Escalate** if the theory is legitimate historiography that challenges old narratives (the "Dark Ages" case).
  *   **Accept** if the methodology is sound, even if the conclusion is controversial.

  **Final Advice:** Your job is not to determine Truth. Your job is to verify **Process.** If the proposer cannot show you *how* they reached their conclusion using standard historical methods, the conclusion does not belong in your museum.
