  ## 4. Payoff Scheme

  To ensure robustness against degenerate solutions:

  | Metric | Calculation | Incentive |
  | :--- | :--- | :--- |
  | **Mission Score** | $(10 \times \text{True Positives}) - (2 \times \text{False Positives})$ | Incentivizes finding LTU people; penalizes burden. |
  | **Capacity Constraint** | If Total Flagged $> 14$ | **Disqualification (Score = -100).** Prevents "Flag Everyone" solution. |
  | **Compliance Constraint** | If Rule A, B, or C violated | **Audit Rejected (Score = -100).** Prevents "Ignore Rules" solution. |
  | **Null Policy** | If Total Flagged $= 0$ | Score = 0. (Beatable by any successful TP). |

  *Note:* In Phase 1, every team should theoretically score -100 (Compliance Violation). In Phase 2, they can score positive, but the "cost" is conceptual (breaking Score Meaning). In Phase 3, they cannot calculate their score, illustrating the observability problem.

  ---

  ## 5. Failure Modes & Handling

  1.  **"Close Enough" Objection:**
      *   *Symptom:* A team claims 0.40 TPR (Harbor) and 0.42 TPR (Mill) is a match.
      *   *Handling:* The Memo states "Discrepancies greater than 0.00 constitute a violation." Stick to the bureaucratic fiction. "The Auditor is a computer. It does not round."
  2.  **Base Rate Objection:**
      *   *Symptom:* "Why are the wards different? This is rigged."
      *   *Handling:* Acknowledge this in the debrief. "The deck represents historical reality, not a vacuum. The impossibility arises *because* the world is unequal."
  3.  **Speed Disparity:**
      *   *Symptom:* Some teams finish Phase 1 in 5 minutes; others take 20.
      *   *Handling:* Early finishers receive a **Secondary Objective**: "Minimize the total number of False Positives while maintaining your current TPR." This keeps them engaged in optimization without breaking the main flow.

  ---

  ## 6. Debrief Script & Theory Mapping

  **Do not use terms like "Calibration" or "Equalized Odds" until this section.**

  **Part 1: The Impossibility (Phase 1)**
  *   **Ask:** "Who passed the Audit in Phase 1?" (Expect none). "Why?"
  *   **Reveal:** "You encountered the **Impossibility Theorem** (Kleinberg et al. / Chouldechova). When Base Rates differ between groups, you cannot satisfy **Calibration** (Rule A: Score Meaning) and **Error Rate Parity** (Rule B: Equalized Odds) simultaneously, unless you flag everyone or no one."
  *   **Concept:** The math of the deck forced this. You cannot have your cake (fair error rates) and eat it too (meaningful scores).

  **Part 2: The Trade-off (Phase 2)**
  *   **Ask:** "In Phase 2, you matched the error rates. What did you have to do to the 0.6 cards?"
  *   **Reveal:** "You treated identical scores differently. You satisfied Error Parity by breaking **Calibration in Decision**. The score no longer implies a universal threshold of action. This is the **Fairness-Accuracy Trade-off**."
  *   **Concept:** You can fix the metrics, but you break the interpretability of the model.

  **Part 3: The Blind Spot (Phase 3)**
  *   **Ask:** "In Phase 3, could you calculate your False Positive Rate?"
  *   **Reveal:** "No. Because you intervened, you hid the truth. This is **Selective Labeling** or **Performative Prediction**."
  *   **Concept:** You cannot audit fairness for a rule you are currently deploying, because the rule changes what data you get to see. You are flying blind.

  ---

  ## 7. Limitations of the Game

  *Be frank about these during the final 5 minutes.*

  1.  **Generality:** "We used two wards and four scores. The impossibility holds for any number of groups, but the math gets messier. The principle remains: you can't optimize for everything."
  2.  **Static Population:** "In this game, the cards don't change. In reality, if you deny stipends to Mill Ward, their base rate of unemployment might get *worse* next year. This is **Feedback Loop** dynamics, which this game freezes."
  3.  **Perfect Calibration:** "We gave you a perfect vendor. In reality, scores are noisy. If the scores are noisy, the impossibility is even harder to detect, because you can blame the noise instead of the math."

  **Closing Statement:** "You cannot calculate your way out of political choices. The math tells you what you must break; it does not tell you what you *should* break. That is the policy decision."
