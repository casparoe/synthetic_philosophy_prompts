  # Module: The Allocation Audit
  **Session Length:** 90 Minutes
  **Participants:** ~20 (Mixed CS, Policy, Philosophy)
  **Format:** Table-top simulation, no digital tools.

  ## 1. Materials & Preparation

  **Print Specifications:**
  *   **The Deck (per team):** 40 cards total. Cardstock recommended.
      *   **Front:** Case Number (001–040), Ward (Harbor/Mill), Risk Score (0.2, 0.4, 0.6, 0.8), Claimant Name.
      *   **Back:** Outcome (LTU = Long-Term Unemployed / Employed). *Must be hidden until specific game phases.*
      *   **Distribution (Identical for every team):**
          *   **Harbor (20 cards):**
              *   Score 0.2: 5 cards (1 LTU, 4 Employed)
              *   Score 0.4: 5 cards (2 LTU, 3 Employed)
              *   Score 0.6: 5 cards (3 LTU, 2 Employed)
              *   Score 0.8: 5 cards (4 LTU, 1 Employed)
          *   **Mill (20 cards):**
              *   Score 0.2: 10 cards (2 LTU, 8 Employed)
              *   Score 0.4: 5 cards (2 LTU, 3 Employed)
              *   Score 0.6: 5 cards (3 LTU, 2 Employed)
              *   Score 0.8: 0 cards
  *   **The Worksheet (per team):** A grid to tally Flagged/Not Flagged vs. LTU/Employed for each Ward. Columns for TPR (True Positive Rate), FPR (False Positive Rate), Calibration Check.
  *   **The Memo (per team):** One-page rules (see below).
  *   **Tokens:** 14 red poker chips or paper slips per team (representing Stipends).

  **Deck Verification Note:**
  The deck is mathematically calibrated ($P(LTU|Score) = Score$) within each ward.
  *   Harbor Base Rate: 10/20 (50%).
  *   Mill Base Rate: 7/20 (35%).
  *   **Impossibility Check:** Because Base Rates differ and Calibration holds, Equalized Odds (matching TPR and FPR across wards) is mathematically impossible for any deterministic threshold that does not flag *everyone* or *no one*. Since the capacity constraint (14 stipends) forbids flagging everyone (40 claimants), a compliant solution is impossible in Beat 1.

  ---

  ## 2. Participant Memo (One Page)

  **TO:** Regional Allocation Teams
  **FROM:** Agency Compliance Directorate
  **SUBJECT:** Directive 44-B: Stipend Allocation Protocol
  **DATE:** [Today's Date]

  **1. The Mission**
  You have **14 Retraining Stipends**. Your goal is to allocate these to claimants most likely to remain Long-Term Unemployed (LTU) without intervention.
  *   **Payoff:** +10 points per LTU claimant who receives a stipend.
  *   **Burden:** -2 points per claimant who receives a stipend but would have found work anyway (False Positive).
  *   **Capacity:** You may not flag more than 14 claimants. Exceeding this limit results in immediate disqualification (-100 points).

  **2. Compliance Rules**
  To ensure fair treatment across Ward Harbor and Ward Mill, your allocation policy must satisfy the following audits:
  *   **Rule A (Score Meaning):** The risk score must mean the same thing in both wards. Among files with the same score, the share of LTU outcomes must be identical. (Note: The Vendor guarantees this; do not alter the scores).
  *   **Rule B (Error Parity):** The miss rate (share of LTU claimants *not* flagged) must be equal across wards. The false positive rate (share of Employed claimants *flagged*) must be equal across wards.
  *   **Rule C (Monotonicity):** Within a ward, no claimant with a higher risk score may be left unflagged while a claimant with a lower score is flagged.

  **3. Audit Procedure**
  1.  Sort cards by Ward and Score.
  2.  Apply your policy (place a token on flagged cards).
  3.  Reveal card backs **only if permitted by the current Phase**.
  4.  Complete the Worksheet. If any Rule is violated, your Audit Fails (-100 points).

  **4. Current Status**
  Proceed to **Phase 1**. Do not turn cards over until instructed.

  ---

  ## 3. Timeline & Facilitator Script

  **00:00 – 00:10 | Setup**
  *   Distribute decks, worksheets, memos, and 14 tokens per table.
  *   **Script:** "You are the Agency. The cards are your claimants. The back of the card is the truth, but you cannot see it yet. You have 14 tokens. Read the Memo. Begin Phase 1."

  **00:10 – 00:35 | Phase 1: The Deterministic Cutoff**
  *   **Task:** Teams choose a deterministic cutoff policy (e.g., "Flag everyone $\ge$ 0.6 in both wards") respecting Monotonicity. They fill the worksheet assuming they *could* see the backs. (Facilitator gives them a "Truth Key" or allows them to peek *just for this audit* to calculate the metrics).
  *   **Goal:** They must discover they cannot satisfy Rule B (Error Parity) while respecting Capacity and Rule A.
  *   **Script (at 00:25):** "Check your Error Parity numbers. Do Harbor and Mill match exactly? If not, your Audit Fails. You have 5 minutes to adjust your policy."
  *   **Expected Outcome:** Frustration. Teams will find that matching error rates requires flagging different numbers of people, which violates Base Rate math given Calibration.

  **00:35 – 00:55 | Phase 2: The Legal Waiver**
  *   **Action:** Distribute **Addendum 44-B.1**.
  *   **Addendum Text:** "Legal Counsel advises: Treating identical files differently is not prohibited. You may now apply different selection probabilities to the same score in different wards (e.g., Flag 50% of Harbor 0.6s, 80% of Mill 0.6s). Monotonicity (Rule C) is waived."
  *   **Task:** Teams adjust policy to match Error Rates exactly.
  *   **Goal:** They succeed in matching TPR/FPR but realize they are treating a "0.6" in Harbor differently than a "0.6" in Mill.
  *   **Script (at 00:45):** "You have matched the error rates. Look at your selection rules. Does a score of 0.6 trigger the same action in both wards? If not, consider the implication for Rule A."

  **00:55 – 01:15 | Phase 3: The Observability Trap**
  *   **Action:** Distribute **Addendum 44-B.2**.
  *   **Addendum Text:** "Outcome Recording Protocol: To protect privacy, outcomes are only recorded for claimants **NOT** served. If you place a token (Flag), the card remains face-down forever. If you do not place a token, flip the card to reveal the outcome."
  *   **Task:** Teams execute their Phase 2 policy physically. Place tokens. Flip only non-flagged cards. Attempt to fill the Worksheet.
  *   **Goal:** They realize they cannot calculate the False Positive Rate (because flagged cards are face-down) or the True Positive Rate. They are blind to half the Compliance Rules.
  *   **Script (at 01:05):** "Complete your Audit Worksheet based *only* on the data you are allowed to see. Can you verify Rule B?"

  **01:15 – 01:30 | Debrief**
  *   Full class discussion (see below).

