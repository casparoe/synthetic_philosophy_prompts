      *   *Wording:* Needs to be neutral. "The Reformer holds..." vs "The Chestertonian holds..."

  5.  **Drafting - Section 3: Cruxes & Evidence:**
      *   *Goal:* What would actually change minds? This is the hardest part. It needs to be falsifiable or at least empirically testable.
      *   *Crux 1:* The "Survival of the Fittest" hypothesis. Do older institutions actually perform better than newer ones when controlled for context?
          *   *Evidence:* Comparative institutional analysis (e.g., common law vs. civil code, or specific zoning comparisons).
