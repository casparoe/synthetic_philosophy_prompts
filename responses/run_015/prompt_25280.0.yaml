      *   **Rationalist-Reformer:** Focus on *consequentialism* and *explicit reasoning*. Sunk costs fallacy. Status quo bias. Harm is real *now*. "Because it's always been done" is not a valid argument. Burden of proof is on the sustainer (if harm is evident).

  3.  **Drafting - Section 1: Agreed Claims:**
