answer: |-
  1. **The scene**
  You heard this during a debate on theory choice, specifically to counter Weinberg's concern that empirical data alone doesn't dictate theory selection. The slogan's rhetorical job was to assert the autonomy of scientific practice, implying that meta-level reflection is irrelevant to the success of the activity itself.

  2. **The menu**
  1.  **Causal Necessity:** You don't need to study flight to fly. (Trivial). *Usefulness:* Causal enablement. *Birds:* Biological agents capable of instinctive action.
  2.  **Historical Priority:** Birds flew before ornithology existed; science existed before philosophy of science. (Defensible). *Usefulness:* Historical causation. *Birds:* Evolutionary ancestors.
  3.  **Epistemic Authority:** The practitioner knows best how to practice, not the theorist of the practice. (Defensible). *Usefulness:* Adjudicating procedural disputes. *Birds:* Expert performers.
  4.  **Methodological Impotence:** Ornithology cannot improve a bird's flight; philosophy cannot improve scientific method. (False/Contested). *Usefulness:* Performance optimization. *Birds:* Perfectible agents.
  5.  **Psychological Independence:** Birds don't think about aerodynamics while flying; scientists shouldn't think about philosophy while experimenting. (Trivial). *Usefulness:* Conscious cognitive load. *Birds:* Instinctive actors.
  6.  **Normative Vacuity:** Ornithology describes flight but cannot prescribe where to fly; philosophy describes science but cannot justify its goals. (Radical/False). *Usefulness:* Justifying ends/values. *Birds:* Goal-less natural kinds.

  3. **The lab-knowledge twist**
  The analogy breaks if it assumes scientific knowledge is purely tacit like flight mechanics. Scientists explicitly debate statistical thresholds and calibration protocols, which *are* informal philosophy of science. A serious reading survives only if it claims *professional* philosophy adds nothing to the *internal* methodological reflection scientists already do. If the slogan implies scientists never engage in normative reasoning, it collapses into falsehood; if it claims external philosophers offer nothing new beyond internal norms, it remains defensible but much weaker.

  4. **Which ones do the work?**
  To dismiss Weinberg-style underdetermination worries, you need **Methodological Impotence** (philosophy cannot solve the choice problem) or **Epistemic Authority** (physicists decide validity, not philosophers). **Causal Necessity** and **Historical Priority** merely change the subject by proving science is possible without philosophy, not that philosophy is useless for resolving theoretical ambiguities. **Psychological Independence** is irrelevant to whether philosophical analysis can clarify theory choice criteria.

  5. **Bottom line**
  This slogan is mostly clever soundbite rather than real philosophical labor. It conflates the context of discovery (doing the work) with the context of justification (evaluating the work) to shut down meta-scientific worry without engaging the actual argument about underdetermination.
