      *   Nietzsche warns Antiquarianism loses the ability to distinguish valuable from valueless. Reinholt wants to distinguish (shame vs. glory) but keep the vessel.

      *Refining the "Ratchet":*
      *   Nietzsche accepts flux. There is no "stable content" of justice across time, only "service to life" in the present. The ratchet is only a problem if it stops life (paralysis).

  8.  **Final Review against constraints:**
