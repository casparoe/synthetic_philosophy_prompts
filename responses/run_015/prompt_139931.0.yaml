answer: |-
  Here is the thinking process, the calculations, and the verdict.

  ### 1. The Calculations

  Before we frame the philosophy, we must verify the geometry of your "lopsided hill" and the arithmetic of your "two friends."

  **Calculation A: The Lopsided Hill**
  Let's assume a simple even-money bet ($b=1$). You win \$1 for \$1 risked.
  Let your true win probability be $p = 0.6$.
  The Kelly fraction is $f^* = p - (1-p) = 0.2$ (20% of bankroll).
  The expected log-growth rate per round is $g(f) = p \ln(1+f) + (1-p) \ln(1-f)$.

  *   **Optimal:** $f = 0.2$.
      $g(0.2) = 0.6 \ln(1.2) + 0.4 \ln(0.8) \approx 0.6(0.1823) + 0.4(-0.2231) \approx \mathbf{0.020}$ nats.
  *   **Half-Bet (Under):** $f = 0.1$.
      $g(0.1) = 0.6 \ln(1.1) + 0.4 \ln(0.9) \approx 0.6(0.0953) + 0.4(-0.1054) \approx \mathbf{0.015}$ nats.
      *Result:* You keep $0.015/0.020 = 75\%$ of the growth rate.
  *   **Double-Bet (Over):** $f = 0.4$.
      $g(0.4) = 0.6 \ln(1.4) + 0.4 \ln(0.6) \approx 0.6(0.3365) + 0.4(-0.5108) \approx \mathbf{0.000}$ nats.
      *Result:* Zero growth. You are treading water. If you bet slightly more ($f=0.41$), growth turns negative. You go broke.

  **Verdict:** Your spreadsheet is correct. The penalty for overbetting is asymptotic (ruin); the penalty for underbetting is linear (opportunity cost).

  **Calculation B: The Two Friends**
  Friend A says $p_A = 0.7$. Friend B says $p_B = 0.5$ (random guess). True $p = 0.6$.
  *   **Merging:** You average probabilities: $p_{avg} = 0.6$. You bet Kelly on $0.6$.
      $f_{merge} = 0.2$. You bet 20% of the whole pot.
  *   **Splitting:** You give half pot to A, half to B.
      A bets Kelly on $0.7 \rightarrow f_A = 0.4$ of *their* half (20% of total pot).
      B bets Kelly on $0.5 \rightarrow f_B = 0$ of *their* half.
      Total exposure: 20% of total pot.

  *Wait.* In a single round with even-money bets, Merging Probabilities and Splitting Bankroll yield the **exact same total exposure** if Kelly is linear in probability (which it is for even money).
  $ f(\frac{p_A + p_B}{2}) = \frac{f(p_A) + f(p_B)}{2} $.

  So why does your simulation show a difference over hundreds of rounds?
  Because **Splitting allows capital migration.**
  In the Split scenario, Friend A's half grows at $g(0.4 | p=0.6) \approx 0.015$. Friend B's half grows at $0$.
  After 100 rounds, 90% of your total money is sitting in Friend A's sub-account. You are effectively betting more aggressively because the "winner" now controls the capital.
  In the Merge scenario, you recalculate the average every time. You force the capital to stay 50/50 weighted between the two opinions forever. You prevent the better forecaster from dominating the bankroll.

  **Verdict:** Merging is **Model Averaging** (static weights). Splitting is **Model Selection** (dynamic weights).

  ---

  ### 2. Three Candidate Framings

  Now that we have the math, let's brainstorm how to categorize what you are feeling.

  **Candidate 1: "Parameter Uncertainty" (The Bayesian View)**
  *   **The Idea:** Your friend's argument. You don't know the true $p$, so you have a distribution over $p$. You should bet the fraction that maximizes expected utility integrated over that distribution.
  *   **Why it fits:** It explains why you shade down. If there's a chance your edge is zero, betting full Kelly on the *average* edge exposes you to ruin in the zero-edge scenarios.
  *   **Why it fails:** It doesn't explain the "lopsided hill." Even if you *know* $p$ with certainty, the hill is still lopsided. Overbetting is still worse than underbetting. This framing treats the asymmetry as a side effect of ignorance, but the asymmetry is structural, not epistemic.

  **Candidate 2: "Ergodicity Breaking" (The Time-Average View)**
  *   **The Idea:** Associated with Ole Peters and the Santa Fe Institute. The ensemble average (expected value) differs from the time average (geometric growth). You shade down because you care about the time path, not the expectation.
  *   **Why it fits:** It captures the "repeated bet" nature and why ruin is fatal (it stops the time series).
  *   **Why it fails:** It's too broad. It explains why we use Log utility at all, but it doesn't distinguish between your two problems (the single-bettor shading vs. the two-friends aggregation). Both problems exist within an ergodic framework, but they operate on different variables.

  **Candidate 3: "Non-Linearity of the Growth Operator" (The Geometric View)**
  *   **The Idea:** The function mapping bet fraction to growth is concave ($\cap$). The function mapping model weight to long-term wealth share is convex (winner takes all).
  *   **Why it fits:** It isolates the mathematical engine. Problem 1 is about concavity in *leverage*. Problem 2 is about convexity in *allocation*.
  *   **Why it fails:** It's dry. It describes the mechanism but not the decision-theoretic implication.

  ---

  ### 3. The Verdict: Which One is Right?

  I am dropping **Candidate 1 (Parameter Uncertainty)** as the primary explanation. Your friend is technically wrong. It is *not* true that "the correct fraction is your average edge." Because the growth function is concave, the optimal fraction under uncertainty is **strictly less** than the Kelly fraction of the average edge.
  *Proof:* Let $p$ be 0.6 or 0.4 with equal probability. Mean $p = 0.5$ (Edge 0). Kelly on mean = 0. But if you know $p$ will be 0.6 next round, you want to bet. If you integrate log-utility, you get a positive bet fraction. If you bet the "average edge" (zero), you bet nothing. The friend's heuristic fails.

  I am dropping **Candidate 2 (Ergodicity)** as the specific label. It's the background music, not the melody.

  **I select Candidate 3, refined:**
  Your two observations are **not the same phenomenon.** They are distinct consequences of non-linearity acting on different inputs.

  1.  **The Shading Down** is **Geometric Fragility**. It is the asymmetry of the log-wealth function with respect to *leverage*. It exists even with perfect knowledge. It dictates that error in bet size is penalized quadratically on the upside and linearly on the downside.
  2.  **The Two Friends** is **Adaptive Capital Allocation**. It is the convexity of wealth share with respect to *strategy performance*. It dictates that allowing capital to flow to the winner outperforms static averaging.

  **Why they feel the same:**
  They both induce a "conservatism" instinct, but for opposite reasons.
  *   In **Geometric Fragility**, you conserve capital because *you* might be wrong about the edge, and the penalty for being wrong is asymmetric.
  *   In **Adaptive Allocation** (Splitting), you conserve the *structure* of the portfolio because you want to let the market prove who is right, rather than betting on your own judgment of who is right now.

  **The Name:**
  There is no single established term that covers both, because they are mathematically distinct. However, the specific "lopsidedness" you found in the first case is best termed **"Kelly Asymmetry"** or **"Overbetting Ruin Sensitivity."**
  For the specific feeling you have—the instinct to shade down not because you are risk-averse, but because the map is not the territory—I propose we coin: **"Epistemic Leverage Decay."**
  *Definition:* The reduction in optimal bet size required when the estimated edge is treated as a random variable rather than a constant, due to the concavity of the log-growth function.

  ---

  ### 4. The Edges (Your Specific Questions)

  **Does the lopsidedness survive if winnings aren't reinvested?**
  **No.** If you bet with fresh money every time (non-reinvested), you maximize Expected Value (linear utility), not Expected Log Wealth.
  *   Math: $E[W] = p(1+f) + (1-p)(1-f) = 1 + f(2p-1)$.
  *   This is a straight line. The "hill" becomes a ramp. Betting 2x Kelly gives you 2x the expected profit of 1x Kelly (until you hit bankruptcy constraints). The asymmetry vanishes. The lopsidedness is purely a product of **compounding**.

  **Does it survive if there is only ever one bet?**
  **No.** In a single bet, "ruin" is just a loss. Unless you have a specific utility cliff (e.g., "I need \$100 to eat"), the penalty for losing 50% is symmetric to the joy of gaining 50% in linear utility. In Log utility, there is still asymmetry ($\ln(0.5) \neq -\ln(1.5)$), but the "time to recover" argument disappears. The lopsidedness is primarily a **repeated game** phenomenon.

  **Does it survive if my bankroll is topped up from outside?**
  **Mostly No.** If you can infinitely replenish your bankroll, you are no longer subject to geometric ruin. You are effectively in a "fresh money" regime regarding survival. You would bet closer to full Kelly (or even higher, depending on the top-up rules). The shading instinct is a survival mechanism for closed systems.

  **Is "I just hate deep drawdowns" an instance of the same thing?**
  **No.** That is **Loss Aversion** (Prospect Theory).
  *   **Geometric Fragility** says: "I bet half-Kelly because betting full-Kelly reduces my long-term growth rate if my edge estimate is noisy."
  *   **Loss Aversion** says: "I bet half-Kelly because seeing my account drop 20% feels painful, even if it recovers."
  *   *Test:* If I offered to insure your drawdowns (guarantee you never drop below starting bankroll) but capped your upside, a Loss Averter takes the deal. A Geometric Fragilist rejects the deal (because it caps the compounding). Your description ("I'd happily take a wildly swingy bet if I was confident") suggests you are **not** loss averse. You are a Geometric Fragilist.

  ### 5. Summary Carving

  You are tripping over two different boundaries of the same map.

  1.  **The Hill (Shading Down):** This is **Epistemic Leverage Decay**.
      *   *Cause:* Concavity of Log-Wealth vs. Bet Fraction.
      *   *Rule:* When edge is uncertain, optimal $f < f^*(\text{mean edge})$.
      *   *Why:* The cost of overbetting (ruin) outweighs the benefit of underbetting (slow growth).
      *   *Distinct from:* Risk aversion. You are maximizing growth, not smoothing variance.

  2.  **The Friends (Merging vs. Splitting):** This is **Static Pooling vs. Dynamic Selection**.
      *   *Cause:* Convexity of Wealth Share vs. Strategy Accuracy.
      *   *Rule:* Splitting (Dynamic) beats Merging (Static) when one source is persistently better. Merging beats Splitting when errors are uncorrelated and cancel out.
      *   *Why:* Splitting allows capital to migrate to the higher-growth path. Merging locks capital into the average path.
      *   *Distinct from:* The Hill. You can have perfect knowledge of the edge (no Hill issue) and still face the Merging vs. Splitting choice.

  **Final Advice:**
  Your instinct to "shade down, hard" is correct, but not because you are unsure of the number. It is because the **cost function of error is asymmetric**.
  Regarding the friends: If you believe their errors are random noise, **Merge**. If you believe one has a structural advantage you can't identify, **Split**. Do not Split hoping to "find out" who is better unless you are willing to let the winner take 99% of your book; if you plan to rebalance to 50/50 regularly, you are just Merging with extra steps.

  The concept you are looking for is not "Risk." It is **"Asymmetric Sensitivity to Leverage Error."** Keep that in your spreadsheet header.
