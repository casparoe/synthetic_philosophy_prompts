  10. What result or methodological failure would count as evidence against local constructivism? How do you answer my friend who says this is just classical logic with a guilt trip?
  Finding a constructive proof that fails where classical succeeds would falsify it. I would tell him the guilt trip is actually a necessary check on meaning.
  So is the guilt trip the core feature rather than a bug?
