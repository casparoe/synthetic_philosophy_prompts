  **PETERSBURG PROTOCOL — END USER LICENSE AND WAGERING AGREEMENT (v4.2)**

  **1. DEFINITION OF EXPECTATION AND VALUATION**
  1.1. The User acknowledges that the Stochastic Payoff Contract (the "Contract") possesses a mathematical Expected Value (EV) diverging to infinity under standard measure theory.
  1.2. Notwithstanding Clause 1.1, Petersburg Ltd. defines the "Realizable Settlement Value" via a non-Archimedean truncation function capped at the firm's aggregate liquidity reserves.
  1.3. The User waives any claim that the divergence of the theoretical EV constitutes a misrepresentation of the Contract's fair price, acknowledging that infinite expectation does not correlate linearly with finite utility.

  **2. SOLVENCY AND BEHAVIORAL COVENANTS**
  2.1. The User explicitly acknowledges that Petersburg Ltd.'s solvency model relies on the systematic violation of Expected Utility maximization principles by the Counterparty (the User).
  2.2. By entering this Agreement, the User covenants not to act in accordance with the rational prescription of infinite EV maximization (i.e., wagering total net worth).
  2.3. Should the User attempt to leverage assets proportional to the theoretical EV, Petersburg Ltd. reserves the right to freeze accounts under Clause 5.1 (Catastrophic Rationality Event).

  **3. ARBITRATION OF RATIONALITY-INDUCED DISTRESS**
  3.1. In the event the User experiences cognitive dissonance resulting from the conflict between formal decision theory (which prescribes unlimited entry fees) and financial reality (which prescribes zero), such distress is classified as a "Subjective Utility Error."
  3.2. Disputes arising from the User's realization that rational adherence to EV theory mandates personal bankruptcy shall be settled via binding arbitration in a jurisdiction where non-standard analysis is not admissible evidence.
  3.3. Petersburg Ltd. accepts no liability for psychological harm incurred when Users compute optimal bet sizes exceeding global GDP.

  **4. COUNTERPARTY MORAL HAZARD**
  4.1. The User acknowledges a structural moral hazard: Petersburg Ltd. offers Contracts it cannot honor at theoretical expectation, knowing the User knows they cannot honor them.
  4.2. This mutual knowledge of insolvency at infinite iteration is deemed a "Stable Equilibrium" provided the User prioritizes survival over mathematical consistency.
  4.3. The User indemnifies Petersburg Ltd. against claims that offering infinite-liability contracts with finite reserves constitutes fraud, provided the probability of payout exceeding reserves remains below the User's subjective risk threshold.

  **5. LIMITATION OF LIABILITY AND UTILITY BOUNDS**
  5.1. Petersburg Ltd. expressly disclaims warranty that the laws of probability will accommodate the firm's balance sheet.
  5.2. The User agrees that Utility is bounded, even if Wealth is not, and that this boundedness is a feature of the User's psychology, not a bug of the Contract.
  5.3. This Agreement supersedes any conflicting axioms contained in von Neumann-Morgenstern utility theory.

  ***

  **NOTE ON FORMAL LIBERTIES AND STANCE**

  **Stance:** This text commits to the position that the St. Petersburg Paradox **genuinely undermines standard Expected Utility (EU) theory**, specifically the assumption that rational agents should maximize expected value regardless of variance or tail risk. It treats the infinite expectation as mathematically valid but economically nonsensical.

  **Liberties & Contested Readings:**
  1.  **Non-Archimedean Utility:** Clause 1.2 references "non-Archimedean truncation." While non-standard analysis (hyperreals) has been proposed to resolve the paradox (e.g., by Nover and Hájek), there is no consensus that this solves the decision-theoretic problem in practice.
  2.  **Menger's Critique:** Clause 5.2 assumes bounded utility resolves the paradox. However, Karl Menger (1934) demonstrated that sufficiently large payoffs can overcome any bounded utility function (the "Super Petersburg Paradox"). The ToS ignores this to maintain the solvency fiction.
  3.  **Moral Hazard:** Clause 4.1 treats the counterparty risk as a known equilibrium. Standard literature usually focuses on the agent's risk aversion; this clause shifts the hazard to the firm's inability to cover tail risk, a niche angle often omitted in favor of psychological explanations.
