answer: |-
  Two philosophers, Elias and Simon, are sitting in a café when the bill arrives. Simon slides the check toward Elias.

  "You ordered the espresso," Simon says. "And last week, I lent you twenty euros. So, logically, you're paying."

  Elias adjusts his glasses, looking genuinely relieved. "Simon, you won't believe the breakthrough I've had. I've finally derived the entire moral law from the principle of non-contradiction. I've proven that fidelity is a necessary truth. It is as certain as geometry that a promise, once made, creates an obligation to perform."

  Simon blinks. "That's great. So you admit you owe me the twenty?"

  "I admit that *obligation* is real," Elias says, tapping the table. "I have successfully derived the universal form of fidelity. In every possible world where rational agents exist, the promisor must repay the promisee. That part is solved. It's a truth of reason."

  "Okay," Simon says slowly. "And in *this* world, you promised to pay me back."

  "Ah," Elias says, holding up a finger. "There lies the rub. The proposition 'Elias borrowed twenty euros from Simon' is not a truth of reason. It's a truth of fact. It's contingent."

  "So?"

  "So, while I know with absolute metaphysical certainty that *someone* must repay *someone*, I cannot deduce from first principles *who* occupies which position in the equation." Elias gestures vaguely between them. "My analysis gives me the function of justice, but it doesn't provide the input values. To know that *I* am the debtor requires empirical observation—sensory data about who spoke, who held the coins, and even who we are."

  Simon stares at him. "You're looking right at me. You have the coins in your pocket."

  "Sensory testimony!" Elias scoffs. "For all pure reason dictates, I might be the creditor and you might be the debtor. Or, for that matter, I might be the twenty euros, and you might be the promise. Until I perform an empirical survey to establish the contingent identities of the agents involved, I cannot assign the necessary obligation to a specific subject."

  Simon sighs, pulls out his wallet, and pays the bill. "Fine. I'm paying. Does your moral calculus have a necessary truth about that?"

  Elias nods enthusiastically as Simon stands up. "Yes! It confirms that generosity is a perfection. You are fulfilling a necessary duty."

  "Right," Simon says, walking toward the door. "And since 'Simon is leaving Elias here' is just a contingent fact, I assume you won't mind if I take your umbrella?"

  Elias freezes, his eyes widening in panic. "Simon, wait! The identity of the umbrella's owner is... well, that's also contingent, but I have strong empirical evidence that—"

  "Epistemic caution, Elias," Simon calls out over his shoulder. "Don't trust the senses."
