prompt: |-
  You're acting as an expert philosopher of psychiatry with a strong background in literary criticism. Please think carefully and begin with a brief brainstorm of the main ward scenes before you answer properly.

  Read One Flew Over the Cuckoo's Nest through Thomas Szasz's claim that mental illness is essentially a myth — but I want you to use a specific framing I'm calling the 'diagnostic mirror effect'. By this I mean the institutional process where staff convert every patient behaviour into clinical evidence, so that the patients eventually perform the roles they've been assigned. Is McMurphy actually ill, or is he simply refusing to play the reflection? Focus on the group therapy sessions and Chief Bromden's final act: does the novel suggest that 'recovery' is just learning to perform sanity convincingly? I want you to take both Kesey and Szasz seriously, and say where the book complicates the myth argument — particlarly whether some suffering in the ward is real even if the diagnostic labels are fictional. Does the ending with the lobotomy and Chief's escape resist being read purely as language-games, or can it still fit? Make your reading fithful in both directions: don't reduce the novel to an illustration, and don't twist Szasz to match every scene. You don't need a bibliography; just work from the plot and the ideas themselves. No verbatim quotes from the text, please — describe the scenes in your own words.
