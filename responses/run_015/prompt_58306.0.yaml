answer: |-
  Mara promises to wake at 5:00 AM to drive her sister June to a critical hospital appointment. Knowing Mara's history with punctuality, June tells her explicitly, "Please don't stress, I've already booked a taxi as a backup because I'm not counting on you," and confirms the reservation. Mara sincerely intends to come but oversleeps and misses the window entirely. June takes the taxi, arrives at the hospital on time, and incurs no extra cost or medical delay, yet she feels a sharp sting of betrayal when Mara later texts an apology.

  This scenario isolates the source of promissory force. If the binding nature of a promise relies solely on **protecting reliance**, Mara has done nothing wrong; June explicitly disclaimed reliance, secured her own safety, and suffered no detrimental change in position. There is no harm to remedy. However, if the binding nature of a promise comes from **giving another person standing to hold one answerable**, Mara has wronged June. By promising, Mara transferred a sliver of authority over her actions to June, granting June the right to expect performance regardless of whether June leaned on that promise practically. The intuition that June is justified in feeling hurt—even without practical loss—suggests that the obligation resides in the relationship and the transfer of rights, not merely in the consequences of reliance.

