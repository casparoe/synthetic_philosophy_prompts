  *   **Application to Quantum Case:** Calibration drift implies that the mapping function from the measurement outcome to the target observable is *unstable*. The old conditionals (based on a calibrated apparatus) are no longer trustworthy.
  *   **Prediction:** **Refuse JC.** (The structural link required for JC is broken).

