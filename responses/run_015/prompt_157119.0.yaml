          *   *Insulation:* This is a methodological sin. If the threshold moves to fit intuitions, it's not a theory, it's a rationalization.

      *   **5. Insulation/Correction Risk:**
          *   The undefined threshold is a major defect. It makes the view unfalsifiable. If every counter-example is met with "Well, the threshold is higher than that," the theory explains nothing. It becomes a "Just So" story.

      *   **6. Evaluating User's Weighting:**
          *   User: Arbitrariness > Incoherence.
          *   My Assessment: Actually, Incoherence (specifically under uncertainty) is often *more* damaging logically than Arbitrariness. Arbitrariness is metaphysically weird; Incoherence makes action impossible. However, Arbitrariness is more intuitively damning. I should nuance this. The "Continuum Argument" (Sorites) is the standard killer of lexical thresholds.

  4.  **Refining the Argument (Self-Correction during drafting):**
