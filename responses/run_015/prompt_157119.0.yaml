          *   *Core Claim 1 (Below Threshold):* Commensurability. Mild pains/pleasures trade off normally (aggregative).
          *   *Core Claim 2 (Above Threshold):* Lexical Priority. Any instance of suffering above a specific threshold makes an outcome worse than *any* outcome without it, regardless of pleasure/aggregate mild pain below the threshold.
          *   *Motivation:* Captures the intuition that extreme agony trumps infinite mild headaches, while preserving common-sense trade-offs in daily life.
      *   **The Task:** Stress-test the view. Provide the *case against it*. Do not defend it. Do not give a literature tour.
      *   **Specific Questions to Address:**
          1.  Which parts are load-bearing? (What happens if lexicality, commensurability, or sharpness is dropped?)
          2.  What counts decisively against it vs. merely awkward? Rank defeaters. Add new ones.
