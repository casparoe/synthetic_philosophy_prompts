      *   *Focus:* The "Lexical" part is the most fragile. If you admit *any* trade-off above the threshold (e.g., 1 unit of agony vs infinite pleasure), the lexicality collapses. If you admit *no* trade-off, you face the "Torture vs. Dust Specks" problem in reverse (or rather, the inability to prevent the torture if it requires sacrificing enough mild pleasure).
      *   *Wait, check the view:* The user says "Any outcome containing a single instance... is worse than any outcome containing none." This is *lexical* priority of the *absence* of extreme suffering.
      *   *The "Happy Torture" Problem:* If a world has one person tortured for an hour, and a billion people in ecstasy, LTNU says the tortured world is worse. But what if the torture is necessary to create the ecstasy? (Trolley problem variants).
      *   *The "Threshold Sorites":* If pain is a continuum, where does the lexical weight kick in? If 59 minutes of torture is below threshold and 61 minutes is above, the moral value jumps infinitely. This violates the principle that small changes in natural properties shouldn't cause massive changes in moral value without a relevant moral difference.

