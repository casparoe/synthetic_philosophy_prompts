answer: |-
  **BUREAU OF DETERMINATE CHOICE**
  **Motto:** *Preference Is Truth.*

  **SO YOU ARE INDIFFERENT: GUIDANCE FOR APPLICANTS**

  **1. What is Indifference?**
  Indifference is not a state of the world. It is a failure of introspection. The Bureau holds that for any two options *A* and *B* presented to a rational agent, a preference relation exists. If you claim none, you are not describing reality; you are reporting an error in your own self-knowledge. The Bureau's function is corrective.

  **2. What if the options are exactly equal?**
  This is impossible. Options may appear identical in rent, light, and commute, but they are never ontologically identical. Even if they were, the distinction between "equally good" and "on a par" is a semantic evasion. Both mask the underlying hierarchy of your will. The Bureau collapses this distinction. There is only Better, Worse, or Unknown. "Equal" is merely "Unknown" pending further interrogation.

  **3. How do you find the preference?**
  We utilize micro-incentives. Under the "Penny Rule," if an applicant accepts a fee of one cent to select Option *A* over Option *B*, the Bureau records that you preferred *A* all along. The willingness to transact reveals the latent ranking. Preference is not manufactured; it is excavated through price.

  **4. What if I prefer A today and B tomorrow?**
  This is Temporal Inconsistency, classified as Fraud. If your stated preference reverses based on which option was presented second, you are not discovering a preference; you are manipulating the record. The Bureau assumes a stable, transitive will. Fluctuation indicates deceit.

  **5. Can I flip a coin?**
  No. To randomize is to abdicate the rational will. Action requires a reason. A coin flip admits that reasons have run out, which is impermissible for a citizen in good standing. You must choose *for* something, not *without* something.

  **6. What if I choose nothing?**
  Inaction is a positive choice of the status quo. Refusing to select *A* or *B* is recorded as a preference for "Neither." This requires its own Preference Statement (Form 12-B) and incurs the standard processing fee.

  **Note on Integrity:** Our staff adhere strictly to these principles. For example, the Bureau canteen has served no lunch since the founding because the kitchen cannot establish a preference between two identical daily specials. We consider this fasting a mark of dedication.

  ***

  **APPENDIX: WORKED CASE (FILE 8940)**

  **Applicant:** Ms. E. Vance
  **Choice:** Flat 4A vs. Flat 4B.
  **Declared State:** "I genuinely don't mind. They are the same."

  **Intervention:**
  Officers presented Flat 4A. Applicant hesitated. Officers applied the Penny Rule, offering a subsidy of $0.01 for signing the lease on 4A immediately. Applicant accepted the subsidy.

  **Determination:**
  Applicant's claim of indifference was false. The acceptance of the subsidy revealed a latent preference for 4A. The preference existed prior to the offer; the offer merely made it visible. Applicant is cleared to sign. Indifference resolved.

  ***

  **Commentary on Philosophical Stakes**

  This document takes a hardline stance in the debate between Rationalist Determinism and Value Pluralism. It treats Revealed Preference Theory not as an economic model but as a metaphysical truth: if you choose it, you wanted it, therefore you always wanted it. It denies the existence of "parity" (where options are comparable but not ranked), insisting all value is commensurable. It also frames randomization as irrational rather than a valid tie-breaker when reasons are exhausted.

  The single objection that would necessitate a rewrite comes from Ruth Chang regarding "hard choices." Chang argues that in cases of parity, no fact of the matter exists about which option is better until the agent *creates* a reason through commitment. The Bureau assumes the reason must pre-exist the choice. If Chang is right, the Bureau isn't extracting truth; it is coercing citizens into fabricating reasons for choices that are genuinely open. This undermines the Bureau's entire ontology—that preference is discovery rather than creation—turning their "guidance" into state-enforced delusion.
