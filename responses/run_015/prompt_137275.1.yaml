  I'm a senior in a philosophy elective, writing a paper on Book I of Aristotle's *Politics* (I'll use the standard passage numbers — 1254b, 1255a, 1260a). I think I've built an argument that turns Aristotle against himself, but my teacher says one of my premises rests on a misreading and won't tell me which. Here it is:

  Aristotle defines the natural slave as someone who shares in reason only far enough to take it in from someone else, but not to possess it himself. But Aristotle also holds that practical wisdom isn't present at birth — it's built up through habituation and experience — so anyone able to take in reason should be able, given the right upbringing, to come to possess it; and he says the slave is a partner in his master's life. So a good master, on Aristotle's own terms, would be training his slaves out of slavery, and "natural slave" can't name a fixed natural kind — it names whoever never got the chance to deliberate. Since Aristotle himself concedes that enslavement in war is a merely conventional arrangement that many people regard as monstrous, my conclusion is that his principles make natural slavery a curable condition, that his theory is quietly abolitionist, and that the natural/conventional distinction collapses into whatever a slave-owner finds convenient.

  Which step is the misreading, and does anything survive once it's corrected? Please keep what Aristotle actually commits himself to separate from what specialists genuinely dispute, and don't report a contested reading as though it were the consensus.

  Give your answer as a table with one row for each step of my argument and exactly these columns: Step (a short phrase from my argument); Verdict (one of: committed to by Aristotle, misreading, or contested among scholars); Basis (the Aristotelian distinction or passage number doing the work — name it, don't quote at length); Settlement (settled, or contested — if contested, one clause on what the two sides disagree about); Consequence (does my conclusion survive if this step is corrected, and why).
