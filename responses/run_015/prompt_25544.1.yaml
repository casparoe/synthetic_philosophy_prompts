prompt: |-
  I serve on a university sexual misconduct hearing panel. We hear about two dozen cases a year, and the single question we spend the most time on is whether the complainant's consent was valid — or, in cases where the respondent claims they reasonably believed consent was present, whether that belief was reasonable given what they knew about deception, pressure, or the complainant's capacity at the time. The panel includes faculty from across the university (history, chemistry, engineering) and two students; nobody has formal training in the philosophy of consent, and our training materials mostly recite policy language without helping us operationalize it. We are not lawyers, we do not apply rules of evidence, and we deliberate in a conference room with a whiteboard, not a courtroom.

  I want a decision procedure we can use during deliberations, after the factual disputes have been resolved as best we can, to assess whether consent was validly given. The procedure should walk us through the three main threats to validity — deception, coercion, and incompetence — in a structured order, with concrete questions for each, thresholds for what counts as sufficient to undermine consent, and explicit flags for where the procedure cannot decide and the panel must exercise judgment. The procedure should be usable by non-philosophers in under thirty minutes, and it should be honest about which steps are genuinely rule-like and which are judgment calls dressed up as criteria. Where the philosophical literature contains a genuine dispute that bears on a step — for instance, about whether consent is fundamentally a mental state or a communicative act, or about whether the standard for competence should be fixed or vary with the stakes of the decision — please flag that dispute and tell us how to proceed in spite of it, rather than pretending it does not exist.

  Please then apply the procedure to three cases. First: a complainant alleges they consented to sex only because the respondent told them they were in a committed relationship and had ended things with their other partner; the respondent admits they were still seeing the other partner and had no intention of ending that relationship, but argues that people misrepresent their romantic intentions all the time and this does not rise to the level of invalidating consent. Second: a graduate student alleges they consented to a sexual relationship with their thesis advisor only because they feared that refusing would damage their career; the advisor never made any explicit threat but acknowledges they were aware of the power differential. The university's policy is silent on whether advisor-student relationships are per se prohibited. Third: both parties agree the complainant had been drinking heavily — somewhere between six and nine drinks over four hours — and initiated the sexual encounter, but the complainant says they were too intoxicated to meaningfully consent and the respondent says the complainant was lucid, conversational, and appeared to be making decisions normally.

  For each case, walk through the procedure step by step and tell me what it yields. I especially want to see a case where the procedure returns an answer the panel will find uncomfortable — perhaps because it says consent was valid when our instincts say otherwise, or invalid when we would prefer to find it valid. Finally, tell me what this procedure systematically cannot handle: the kinds of cases or considerations it will miss, and where the underlying philosophical theory itself is unsettled enough that no procedure could settle it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analyses:

  1.  **Analyze the Request:**
      *   **User:** Member of a university sexual misconduct hearing panel.
      *   **Context:** ~24 cases/year, diverse panel (faculty/students, no philosophy/law training), training is policy-heavy but not operational. Deliberations are informal (conference room, whiteboard).
      *   **Goal:** A decision procedure to assess *validity of consent* after facts are resolved.
      *   **Key Threats to Validity:** Deception, Coercion, Incompetence (Capacity).
      *   **Requirements:**
          *   Structured order.
          *   Concrete questions & thresholds.
          *   Explicit flags for judgment calls vs. rules.
          *   Acknowledge philosophical disputes (e.g., mental state vs. communication, fixed vs. variable competence).
          *   Usable by non-philosophers in <30 mins.
          *   Apply to three specific cases (Deception/Relationship, Coercion/Power Differential, Intoxication/Capacity).
          *   Highlight uncomfortable outcomes.
          *   Discuss limitations of the procedure.

  2.  **Deconstruct the Philosophical Landscape (Internal Knowledge):**
      *   *Consent Theory:* Is it attitudinal (mental state) or performative (speech/act)? Most policies lean performative/communicative for adjudication, but philosophy debates this.
      *   *Deception:* "Fraud in the factum" (nature of the act) vs. "Fraud in the inducement" (reasons for the act). Philosophy generally agrees the former invalidates consent, the latter is contested.
      *   *Coercion:* Threats vs. Offers. Structural power (advisor/student) vs. Explicit threats.
      *   *Capacity:* Fixed threshold vs. Sliding scale (risk-dependent). Intoxication is the classic hard case.
      *   *Reasonable Belief:* Subjective vs. Objective standard.

  3.  **Drafting the Decision Procedure (The "Consent Validity Protocol" - CVP):**
      *   *Structure:* Needs to be linear. Deception -> Coercion -> Capacity is a logical flow (External manipulation -> Internal/Structural pressure -> Internal ability).
      *   *Tone:* Practical, honest about ambiguity, distinct from legal rules.
      *   *Time Limit:* Keep steps concise.
      *   *Philosophical Flags:* Must explicitly state where the panel is making a policy choice, not discovering a metaphysical truth.

      *   *Step 1: Deception.* Distinguish between *what* is happening (act/identity) and *why* it's happening (context/future).
          *   *Threshold:* Does the lie change the *nature* of the act?
          *   *Flag:* The "Inducement" problem.
      *   *Step 2: Coercion/Pressure.* Distinguish between threats (or else) and offers (if). Address structural power.
          *   *Threshold:* Was there a credible threat of harm, or an exploitation of necessary dependency?
          *   *Flag:* The "Background Conditions" problem (is all pressure coercion?).
      *   *Step 3: Capacity/Competence.* Intoxication, age, disability.
          *   *Threshold:* Could they understand the "who, what, where" and communicate refusal?
          *   *Flag:* The "Sliding Scale" problem (high stakes = higher capacity needed).
      *   *Step 4: Reasonable Belief (if validity is undermined).* Did the respondent know/should they have known?

  4.  **Developing the Case Studies:**

      *   *Case 1: The Relationship Lie (Deception).*
          *   *Facts:* Lie about breaking up with partner.
          *   *Analysis:* This is fraud in the inducement (reasons), not factum (nature of act).
          *   *Outcome:* Procedure likely says *Valid Consent* (philosophically standard, though emotionally unsatisfying).
          *   *Discomfort:* Panel wants to punish the liar, but consent wasn't technically invalid regarding the *sex act* itself.

      *   *Case 2: The Advisor (Coercion/Power).*
          *   *Facts:* No explicit threat, but career dependency. Policy silent.
          *   *Analysis:* Is silence coercion? Structural power creates a "threat environment."
          *   *Outcome:* *Invalid Consent* (due to structural coercion/exploitation of dependency).
          *   *Discomfort:* Respondent didn't "do" anything active. It penalizes the relationship status itself.

      *   *Case 3: The Drinking (Capacity).*
          *   *Facts:* 6-9 drinks, initiated sex, claims intoxication.
          *   *Analysis:* Behavioral evidence (lucid/conversational) vs. Internal state.
          *   *Outcome:* *Valid Consent* (based on external communication), *unless* panel adopts a high-protective sliding scale. Let's make the procedure lean towards communicative acts for clarity, leading to *Valid*.
          *   *Discomfort:* Complainant feels violated/regretful, procedure says they were competent.

  5.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is 30 minutes realistic? Yes, if facts are pre-resolved.
      *   *Critique:* Am I being too legalistic? Need to emphasize the "Whiteboard" nature. Use checklists.
      *   *Critique:* Philosophical honesty. I need to make sure I don't present the "Fraud in the Inducement" distinction as settled law, but as a necessary operational line.
      *   *Critique:* The "Reasonable Belief" aspect. The prompt asks about validity *or* reasonable belief. I should focus primarily on validity first, then add a "Respondent Culpability" check if validity is negated. Actually, the prompt asks to assess *whether consent was validly given*. I will stick to validity, but add a note on reasonable belief as a secondary check if the panel needs to determine responsibility. *Correction:* The prompt says "assess whether consent was validly given." I will focus there.

  6.  **Finalizing the Limitations Section:**
      *   What does this miss? Retrospective regret, cultural differences in communication, implicit bias, the "gray area" of enthusiastic vs. permissive consent.
      *   Philosophical unsettledness: The definition of "harm" in coercion, the metaphysics of intoxication.

  7.  **Review against Constraints:**
      *   Three threats (Deception, Coercion, Incompetence)? Yes.
      *   Concrete questions/thresholds? Yes.
      *   Flags for disputes? Yes.
      *   Under 30 mins? Yes, it's a checklist.
      *   Three specific cases applied? Yes.
      *   Uncomfortable outcome highlighted? Yes (Case 1 & 3).
      *   Limitations section? Yes.

  8.  **Final Polish:** Ensure tone is respectful of the gravity of the work but clear about the limitations of the tool. (Self-correction: Ensure I don't give legal advice, but frame this as a deliberative aid based on philosophical frameworks.)

  *(Self-Correction on Case 2)*: The prompt says policy is *silent* on advisor relationships. This makes it harder. If policy doesn't forbid it, can it be coercion? Yes, if the power dynamic makes refusal impossible without severe cost. I need to be careful not to invent policy, but assess *consent validity* based on the dynamic. I will frame it as "Structural Coercion."

  *(Self-Correction on Case 1)*: This is the classic "fraud in the inducement" case. Most legal and philosophical frameworks say this does *not* vitiate consent to sex. This will be the "uncomfortable" result. I must explain *why* clearly.

  *(Self-Correction on Case 3)*: Intoxication is tricky. If they initiated, that's strong evidence of capacity. But 6-9 drinks is a lot. I need to make sure the procedure distinguishes between "bad judgment" and "incapacity."

  9.  **Drafting the Response.** (Proceeding to generate output based on these thoughts.)
answer: |-
  This is a **Consent Validity Protocol (CVP)** designed for university hearing panels. It is not a legal test, nor does it claim to solve metaphysical debates about autonomy. It is a deliberative tool to structure conversation, expose assumptions, and isolate where judgment calls are required.

  **Time Estimate:** 20–30 minutes (after facts are found).
  **Format:** Whiteboard checklist.
  **Philosophical Stance:** Communicative/Performative (consent is what is expressed, not just felt), with specific exceptions for capacity and structural coercion.

  ---

  # The Consent Validity Protocol (CVP)

  **Instructions:** Proceed through the three gates in order. If any gate is "Failed," consent is **Invalid**. If all gates are "Passed," consent is **Valid**. At each step, mark whether the decision is a **Rule** (policy-based) or a **Judgment Call** (panel discretion).

  ## Gate 1: Deception (The "What" vs. The "Why")
  *Philosophical Dispute:* Does lying about *reasons* for sex (inducement) invalidate consent the same way lying about the *nature* of the act (factum) does? Most frameworks say no, but this feels unjust to laypeople.
  *Operational Stance:* We distinguish between lies about the act itself and lies about the context.

  **Questions:**
  1.  **Nature of Act:** Did the respondent lie about what the physical act *was*? (e.g., claiming a medical procedure was sex, or claiming a condom was used when it was not).
      *   *Yes:* **FAIL.** (Invalid Consent).
      *   *No:* Proceed to Q2.
  2.  **Identity:** Did the respondent lie about *who they were*? (e.g., impersonating a partner in the dark).
      *   *Yes:* **FAIL.** (Invalid Consent).
      *   *No:* Proceed to Q3.
  3.  **Context/Intent:** Did the respondent lie about feelings, relationship status, or future intentions? (e.g., "I love you," "I broke up with my ex," "I will call you tomorrow").
      *   *Yes:* **PASS.** (See *Judgment Flag* below).
      *   *No:* **PASS.**

  > **⚠️ JUDGMENT FLAG (The Inducement Problem):**
  > If Q3 is "Yes," standard philosophical and legal theory says consent remains **Valid**. Lying to get sex is morally wrong, but it does not usually negate the authority to consent to the act itself.
  > *   *Panel Instruction:* If you feel this is unjust, you are identifying a gap in policy, not a flaw in consent theory. You cannot rule consent invalid here without redefining "sexual misconduct" to include "emotional deception." Mark this as **Valid Consent / Policy Gap**.

  ## Gate 2: Coercion (Threats vs. Power)
  *Philosophical Dispute:* Is coercion only explicit threats ("Or else"), or does it include exploiting background inequalities (structural coercion)?
  *Operational Stance:* We treat credible threats and exploitative dependencies as functionally equivalent.

  **Questions:**
  1.  **Explicit Threat:** Did the respondent threaten harm (physical, academic, professional, social) to secure compliance?
      *   *Yes:* **FAIL.** (Invalid Consent).
      *   *No:* Proceed to Q2.
  2.  **Quid Pro Quo:** Was compliance exchanged for a benefit the respondent controls (grades, letters, promotion)?
      *   *Yes:* **FAIL.** (Invalid Consent).
      *   *No:* Proceed to Q3.
  3.  **Structural Dependency:** Was there a significant power differential (e.g., advisor/student, coach/athlete) where the complainant reasonably believed refusal was impossible without severe cost, *and* did the respondent know or should they have known this?
      *   *Yes:* **FAIL.** (Invalid Consent).
      *   *No:* **PASS.**

  > **⚠️ JUDGMENT FLAG (The Background Conditions Problem):**
  > If Q3 is "Yes," you are ruling that *structural power* can vitiate consent even without explicit threats. This is a **Judgment Call**.
  > *   *Panel Instruction:* Ask: "Could a reasonable person in the complainant's position have said 'no' without fearing catastrophic loss?" If the answer is No, consent is invalid due to coercion.

  ## Gate 3: Capacity (Competence & Intoxication)
  *Philosophical Dispute:* Is capacity a fixed threshold (you are either drunk enough or you aren't) or a sliding scale (higher stakes require higher capacity)?
  *Operational Stance:* We use a **Communicative Capacity** standard. Can they understand and communicate?

  **Questions:**
  1.  **Consciousness:** Was the complainant unconscious, asleep, or blacked out?
      *   *Yes:* **FAIL.** (Invalid Consent).
      *   *No:* Proceed to Q2.
  2.  **Understanding:** Could the complainant articulate *who* they were with, *where* they were, and *what* was happening? (Evidence: conversation logs, witness testimony, video).
      *   *No:* **FAIL.** (Invalid Consent).
      *   *Yes:* Proceed to Q3.
  3.  **Volition:** Could the complainant physically and verbally refuse? (Evidence: Did they initiate? Did they push away? Did they say "stop"?)
      *   *No:* **FAIL.** (Invalid Consent).
      *   *Yes:* **PASS.**

  > **⚠️ JUDGMENT FLAG (The Sliding Scale Problem):**
  > If Q2/Q3 are borderline (e.g., "slurred but coherent"), you must decide: Do we require *higher* capacity for higher risk acts?
  > *   *Panel Instruction:* If the act carried high physical/emotional risk, raise the threshold for Q2. If the complainant was "lucid but impaired," mark as **Valid Consent**, but note that *impairment* is not *incapacity*.

  ---

  # Application to Cases

  Here is how the CVP applies to your three scenarios.

  ## Case 1: The Relationship Lie (Deception)
  *Facts:* Complainant consented based on lie about relationship status/ex-partner. Respondent admits lie.

  **CVP Walkthrough:**
  *   **Gate 1 (Deception):**
      *   Q1 (Nature of Act): No. It was sex.
      *   Q2 (Identity): No. It was the respondent.
      *   Q3 (Context/Intent): **Yes.** Respondent lied about breaking up with ex and commitment level.
      *   *Result:* **PASS** (per Protocol Rule).
  *   **Gate 2 (Coercion):** No threats. **PASS**.
  *   **Gate 3 (Capacity):** No intoxication alleged. **PASS**.

  **Verdict:** **Valid Consent.**
  **Panel Discomfort:** High. The respondent acted deceptively and manipulatively. The complainant feels violated.
  **Why this happens:** The CVP adheres to the "Fraud in the Inducement" distinction. The complainant consented to *sex with this person*; they did not consent to *sex within a monogamous relationship*. The lie affected the *motivation* for consent, not the *scope* of consent.
  **Action:** The panel must acknowledge this is a **Policy Gap**. If the university wishes to punish this, it must be under a code of "Conduct/Integrity," not "Sexual Misconduct/Non-Consent." The CVP forces you to admit: *This was wrong, but it was not non-consensual sex.*

  ## Case 2: The Advisor (Coercion)
  *Facts:* Grad student & Advisor. No explicit threats. Policy silent on relationships. Student feared career damage.

  **CVP Walkthrough:**
  *   **Gate 1 (Deception):** No lies alleged. **PASS**.
  *   **Gate 2 (Coercion):**
      *   Q1 (Explicit Threat): No.
      *   Q2 (Quid Pro Quo): No explicit exchange stated.
      *   Q3 (Structural Dependency): **Yes.** Advisor controls thesis/career. Student feared damage. Advisor knew of differential.
      *   *Result:* **FAIL** (per Judgment Flag).
  *   **Gate 3 (Capacity):** **PASS**.

  **Verdict:** **Invalid Consent.**
  **Panel Discomfort:** Moderate to High (for the Respondent). The advisor may argue, "I never threatened them. They chose this."
  **Why this happens:** The CVP treats structural power as a form of coercion. When one party holds the keys to the other's livelihood, "voluntariness" is compromised. The "No" was available in theory, but not in reasonable practice.
  **Action:** This relies on the **Judgment Flag** at Gate 2, Q3. The panel must explicitly vote on whether the power differential was sufficient to negate voluntariness. If you vote "Yes," you are establishing a precedent that *silence* in a power dynamic can be coercive.

  ## Case 3: The Drinking (Capacity)
  *Facts:* 6–9 drinks over 4 hours. Complainant initiated. Complainant claims intoxication invalidated consent. Respondent claims lucidity.

  **CVP Walkthrough:**
  *   **Gate 1 (Deception):** N/A. **PASS**.
  *   **Gate 2 (Coercion):** N/A. **PASS**.
  *   **Gate 3 (Capacity):**
      *   Q1 (Consciousness): No. **PASS**.
      *   Q2 (Understanding): Evidence suggests lucid/conversational. **PASS**.
      *   Q3 (Volition): Complainant *initiated*. **PASS**.
      *   *Result:* **PASS**.

  **Verdict:** **Valid Consent.**
  **Panel Discomfort:** Very High. Complainant feels they were too drunk to know better. 6–9 drinks is significant.
  **Why this happens:** The CVP uses a **Communicative Capacity** standard, not a **Protective Paternalism** standard. If the complainant could communicate desire and understand the act, they had capacity. Regret or poor judgment due to alcohol is not incapacity.
  **Action:** This highlights the **Sliding Scale Flag**. If the panel believes 9 drinks *automatically* removes capacity regardless of behavior, you must override Q2/Q3. However, doing so risks infantilizing drinkers. The CVP forces you to confront: *Are we punishing the respondent for sex with a drunk person, or sex with an incapacitated person?* The facts support the former.

  ---

  # Limitations: What This Procedure Cannot Handle

  This procedure is a tool for clarity, not truth. It systematically misses or mishandles the following:

  **1. Retrospective Revocation & Regret**
  The CVP assesses consent *at the time of the act*. It cannot account for a complainant who felt safe in the moment but feels violated in retrospect due to new information (Case 1) or sobriety (Case 3). Philosophy calls this the "problem of diachronic autonomy." The procedure treats consent as a snapshot; human experience is a narrative.
  *   *Risk:* You may find "Valid Consent" in cases where the complainant feels profound violation.

  **2. Implicit Bias in "Reasonableness"**
  Gate 2 (Coercion) and Gate 3 (Capacity) rely on "reasonable belief" and "lucidity." These are culturally coded.
  *   *Risk:* A panel might view a quiet complainant as "coercible" or a loud one as "capable" based on gendered or racialized stereotypes of behavior. The CVP does not correct for bias; it only structures it.

  **3. The "Enthusiastic Consent" Gap**
  The CVP tests for *validity* (absence of no/incapacity), not *affirmative enthusiasm*. Many modern policies advocate for "Yes Means Yes." This procedure is largely "No Means No" with capacity checks.
  *   *Risk:* It validates permissive consent (submitting without desire) that technically meets the threshold but violates the spirit of sexual respect.

  **4. Philosophical Settledness**
  There is no philosophical consensus on **Case 1 (Deception)**. Some ethicists argue that *any* material lie vitiates consent because autonomy requires truth. The CVP takes the dominant legal/analytic view (Factum vs. Inducement) for operational stability.
  *   *Risk:* You are making a philosophical choice (prioritizing transactional clarity over holistic autonomy) without realizing it.

  **5. The "Gray Zone" of Power**
  In Case 2, if the policy is silent, ruling "Invalid Consent" effectively creates new policy mid-hearing.
  *   *Risk:* This creates due process concerns for the respondent. The CVP flags this, but cannot solve the tension between protecting students and fair notice to faculty.

  ### Final Recommendation for the Panel
  Use the CVP to **diagnose**, not just to **decide**.
  If the CVP yields "Valid Consent" but the panel unanimously feels a violation occurred (likely Case 1 or 3), do not force the square peg into the round hole of "Non-Consent." Instead, use the **Judgment Flags** to write a finding that says: *"Consent was valid under current operational definitions, but the Respondent's conduct violated community standards of honesty/care."*

  This preserves the integrity of the word "consent" while still addressing the harm.
