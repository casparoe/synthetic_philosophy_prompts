  **PROJECT LICENCE APPLICATION: ADAPTIVE SYSTEMS (WELFARE) REGULATIONS 2024**
  **Reference:** ASWR-2024-892
  **Project Title:** Distributed Proximal Policy Optimisation for Continuous Control Tasks

  **1. Subject Quantification**
  **1.1** Define the welfare subject.
  [x] The policy network checkpoint.
  [x] Each parallel actor instance.
  [ ] The cumulative episode trajectory.
