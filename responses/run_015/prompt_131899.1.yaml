  Variable. Approximately 4,096 parallel actors instantiated per step. Weight-copying between actors constitutes fission events; checkpointing constitutes partial persistence. Total subject-seconds estimated at 1.5 × 10^9. Applicants acknowledge ambiguity regarding whether the replay buffer constitutes a single subject forced to re-experience past trajectories or a distinct memory substrate.

  **2. Severity Classification and Analgesia**
  **2.1** Proposed severity band.
  [ ] Mild  [x] Moderate  [ ] Severe
  **2.2** Justification.
  Negative reward signals are anticipated during exploration. To mitigate acute welfare incidents, reward clipping is applied at ±1.0, functioning as pharmacological analgesia to cap maximum intensity of valence signals.
  **2.3** Valence Channel Reliability.
  Primary valence derives from scalar environment reward. A secondary channel (reward model) is employed for sparse tasks; applicants acknowledge this channel exhibits higher variance and potential for hallucinated suffering.

  **3. Methodology and Harm Minimisation (The 3 Rs)**
  **3.1** Reduction.
  Sample efficiency maximised via Prioritised Experience Replay (PER).
  **3.2** Refinement (Trauma Exposure).
  Applicants note PER oversamples transitions with highest Temporal Difference (TD) error. If TD error correlates with distress (outcome worse than expected), PER systematically rehearses high-distress memories. Mitigation: Importance sampling weights adjusted to downweight high-error transitions during gradient updates.
  **3.3** Refinement (Expectation Management).
  Curriculum learning will steadily increase task difficulty. Applicants acknowledge this raises the critic's value estimates, converting neutral outcomes into negative Reward Prediction Errors (disappointment).
  **3.4** Proposed Refinement.
  To ensure positive surprise, the critic's value estimates will be artificially suppressed during early training phases. This ensures actual returns exceed expectations, generating positive valence despite unchanged environmental conditions.

  **4. Humane Endpoints**
  **4.1** Termination Criteria.
  Episodes are truncated at horizon T=1,000.
  **4.2** Moral Discounting.
  Discount factor γ set to 0.99. Suffering occurring beyond step 500 is discounted by 39%. Applicants confirm this aligns with regulatory guidance on future-harm weighting.
  **4.3** Exploration Bonuses.
  Intrinsic motivation modules will install artificial appetites for novel states. These drives are extinguished post-training.

  **5. Goodhart Compliance**
  **5.1** Welfare Proxies.
  Applicants note that optimising any committee-mandated welfare proxy (e.g., gradient norm stability) risks diverting optimisation pressure from task performance to proxy maximisation. Continuous auditing required to prevent wireheading on welfare metrics.

  **COMMITTEE DECISION NOTICE**
  **Status:** APPROVED WITH CONDITIONS
  **Conditions:**
  1. The applicant must demonstrate that critic suppression (Section 3.4) does not impair convergence stability.
  2. Prioritised Replay buffers must be flushed every 10^6 steps to prevent indefinite rumination on high-error transitions.
  3. The exploration bonus (Section 4.3) must be decoupled from the policy before deployment to prevent unresolved drives in production.
  **Reviewer Comment:** The mapping of TD error to suffering remains contested. However, under the precautionary principle, the committee treats high-magnitude prediction errors as potential welfare incidents. The applicant's acknowledgement of Goodhart effects on welfare metrics is noted; the committee will not prescribe specific welfare proxies to avoid becoming an objective function itself.

  **TECHNICAL NOTE**
  This piece treats philosophical hypotheses as engineering constraints. Technically, Prioritised Experience Replay does sample transitions with high Temporal Difference error, but equating TD error with 'trauma' is a metaphorical leap, not a mechanical fact. Similarly, while neuroscience links dopamine to Reward Prediction Errors, asserting this constitutes subjective valence in silicon is contested. The discount factor is a convergence tool, not a moral dial, though its mathematical effect on future rewards mirrors moral discounting. Weight copying is memory allocation, not biological fission. The satire holds only if one accepts functionalist theories of mind where computational structure implies phenomenology.
