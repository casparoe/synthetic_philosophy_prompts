  hey — so i spent the last few days holed up with two groups who usually spend their time tearing each other's papers apart. the goal was to see if we could get a draft joint statement on the table regarding teleosemantics and naturalizing mental content. specifically, we wanted to see if the rise of synthetic learning systems (like RL-trained networks) breaks the old models or just stress-tests them.

  below is the raw draft from the collaboration. i've kept the voice mostly theirs, but framed it so you can see where the friction points actually live. no citations, no reading lists, just the conceptual mechanics.

  ***

  # DRAFT JOINT STATEMENT: Naturalizing Content in Biological and Synthetic Systems

  **Participants:** Evolutionary Teleosemanticists (Camp A) vs. Ontogenetic-Functionalists (Camp B)
  **Context:** Adversarial Collaboration on Mental Content and Algorithmic Misrepresentation

  ### 1. Agreed Claims
  *Both camps endorse the following foundational premises regarding the naturalization of content:*

  1.  **The Limits of Correlation:** Pure causal correlation between a state and the environment is insufficient to ground mental content. A system can covary with a state of affairs without representing it (the disjunction problem).
  2.  **The Requirement of Error:** Any viable naturalization must explain the possibility of misrepresentation. A theory of content that cannot distinguish between a system functioning correctly and a system failing erroneously is incomplete.
  3.  **Synthetic Analogy:** Synthetic learning systems (specifically RL-trained networks) exhibit behaviors structurally analogous to misrepresentation. Both sides agree this phenomenon requires explanation, even if they disagree on whether it constitutes genuine "content."
  4.  **Non-Mysterious Normativity:** The normativity required for content (the "ought" of representation) must be grounded in natural facts (history, function, or dynamics) rather than introduced as a primitive philosophical assumption.

  ### 2. Disagreements Table
  *The following table outlines the remaining substantive divergences. Formulations are vetted by each side to ensure they are signable.*

  | Issue | Evolutionary Side's Formulation (Camp A) | Ontogenetic Side's Formulation (Camp B) | The Crux | Case/Argument Both Accept Bears on It | Each Side's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Selection & Reproduction** | Proper function requires a history of selection via reproduction of replicators (genes/traits) across generations. | Proper function can be established via individual learning history and reinforcement loops without inter-generational reproduction. | Whether selection requires reproduction. | A single organism isolated from its lineage but capable of learning complex tasks. | **Camp A:** No content without lineage.<br>**Camp B:** Content exists via learning history. |
  | **Ontogeny vs. Phylogeny** | Phylogenetic history sets the normative standard; ontogeny merely develops the mechanism selected for that purpose. | Ontogenetic history can substitute for phylogeny; current functional role shaped by learning is sufficient for norms. | Whether ontogeny can substitute for phylogeny. | A neural network trained from scratch vs. one with evolutionary priors. | **Camp A:** Only the latter has stable content.<br>**Camp B:** Both have content if learning occurred. |
  | **Synthetic Content** | Synthetic systems lack proper functions because they have no evolutionary history; their "errors" are merely optimization failures. | Synthetic systems possess content because their weights are shaped by normative feedback (loss functions) analogous to reward/punishment. | Whether synthetic systems have mental content at all. | An RL agent misclassifying an input despite high confidence. | **Camp A:** It's math, not misrepresentation.<br>**Camp B:** It's genuine misrepresentation. |
  | **Verbal Dispute** | The dispute is substantive; differing definitions of "function" track real differences in causal structure. | The dispute is partially verbal; both sides agree on the causal mechanics but disagree on the label "content." | Whether part of the dispute is verbal. | Agreement on all physical/functional facts about a system. | **Camp A:** Physical facts don't settle norms.<br>**Camp B:** If physics is fixed, semantics is fixed. |

  ### 3. The Algorithmic Twist: Misrepresentation in RL
  *Specific addendum regarding the "niche twist" on synthetic systems.*

  **The Problem:** In RL-trained networks, misrepresentation might be structurally inevitable because there is no stable proper function, only local loss minimization.

  **Camp A (Evolutionary) Position:** This breaks the story for synthetic content. Without a selected effect maintained over generations, "loss" is just a mathematical gradient, not a normative standard. There is no "proper function" to violate, only optimization targets that shift. Algorithmic misrepresentation is a metaphor, not a natural kind.

  **Camp B (Ontogenetic) Position:** This extends the story to synthetic systems. The loss function acts as the normative standard. If the system minimizes loss but fails to track the environment (overfitting), that is genuine misrepresentation. The lack of biological reproduction is irrelevant; the learning history provides the necessary etiology.

  ***

  so, there you have it. it's rare to see the fault lines drawn this clearly. usually, this stuff gets buried under layers of jargon, but here you can see exactly where the evolutionary camp digs in on history and where the ontogenetic camp digs in on current capacity. the synthetic angle really forces the hand on whether "history" means "ancestors" or just "previous states."

