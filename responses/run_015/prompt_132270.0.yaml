      *   *analogy_limit:* Wittgenstein's hinges are typically pre-reflective and inherited (e.g., "I have hands"), whereas the harness is an explicit, contingent artifact subject to replacement. The harness is a *stipulated rule*, whereas his hinges are often *lived certainties*.

