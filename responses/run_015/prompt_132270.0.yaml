      *   *Nuance on Objectivity:* Wittgenstein isn't a relativist in the "anything goes" sense. He emphasizes shared practice. So the objectivity comes from the *shared* acceptance of the hinge, not the hinge itself being objectively true in a metaphysical sense.
      *   *Nuance on Analogy Limit:* The key difference is *contingency*. If the harness breaks, we build a new one. If "I have hands" fails, my whole world-picture collapses. The ML hinge is more fragile/replaceable.

