  2.  **Deconstruct Wittgenstein's *On Certainty* (Conceptual Structure):**
      *   **Hinge Propositions:** These are propositions that are exempt from doubt within a specific language-game. They are the "scaffolding" or "hinges" on which our inquiries turn. Examples: "The earth exists," "I have hands," "Objects don't vanish when unobserved."
      *   **Function:** They are not known (justified) but *acted upon*. Doubting them undermines the possibility of making meaningful judgments within that system.
      *   **Universality vs. Locality:** Wittgenstein often discusses universal certainties (world-picture), but he also acknowledges that language-games vary. Some hinges are tied to specific forms of life or practices. However, there's a tension: are they psychological certainties or logical grammatical rules?
      *   **Circularity/Regress:** Wittgenstein rejects the need for ultimate justification. The "ground" is not an ungrounded proposition but a way of acting. The circle is not vicious; it's the condition of possibility for the language-game. "If I want the door to turn, the hinges must stay put."
      *   **Objectivity/Subjectivity:** Hinges are not subjective opinions. They are shared norms of a community/practice. Calling something a hinge doesn't make it arbitrary; it makes it foundational to the *method* of doubt itself.
      *   **Analogy Limits:** Wittgenstein's hinges are often pre-reflective, inherited, and biological/cultural (e.g., having hands). Technical artifacts (evaluation harnesses) are constructed, contingent, and explicitly designed. This is a key difference.

  3.  **Evaluate the ML Audit Case against Wittgenstein's Framework:**
      *   *Claim:* "The evaluation harness is intact."
      *   *Function:* Without this, test results mean nothing. With it, testing proceeds.
      *   *Verification:* Cannot be verified without using the harness (circular).
      *   *Wittgenstein's Likely View:*
          *   **Stance:** He would likely acknowledge the structural similarity but caution against conflating technical assumptions with deep grammatical hinges. He might call it a "local hinge" or a "rule of the game" rather than a universal certainty.
          *   **Locality:** Wittgenstein recognizes different language-games. A technical practice has its own rules. So, yes, hinges can be local to a practice, but they must function *grammatically* (as rules), not just empirically (as untested hypotheses).
          *   **Circularity:** He would see this as constitutive. You need a stable background to measure anything. If you doubt the ruler, you can't measure the table. This isn't a vicious regress; it's the end of justification.
          *   **Objectivity:** He would reject the idea that this makes it subjective. Objectivity arises *within* the system defined by the hinges. If the community agrees on the harness, the results are objective *relative to that practice*.
          *   **Analogy Limit:** Wittgenstein's hinges are usually inherited/world-pictorial (e.g., "objects exist"). A software harness is人工 (artificial), contingent, and breakable in a way "having hands" is not. It's more of a *convention* or *rule* than a deep certainty.

