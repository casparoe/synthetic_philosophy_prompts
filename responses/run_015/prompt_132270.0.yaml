      *   *locality_of_hinge:* He would accept locality. Hinges are tied to specific language-games. Technical practices have their own scaffolding distinct from universal human certainties.
      *   *circularity_assessment:* Constitutive, not vicious. The impossibility of verifying the harness without itself is not a flaw but the definition of its role as the standard of measurement.
