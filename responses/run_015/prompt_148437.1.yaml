prompt: |-
  I chair the renewal panel for a national funder's programme-grant scheme. Twice a year, seven of us decide whether to continue roughly fifteen multi-group research programmes for another five-year term, and we must attach to each decision a one-page rationale a lay board can sign off on. The panelists are working scientists with no philosophy training, and we have about forty-five minutes per programme using only documents the teams already submit: the founding proposal, the previous renewal report, and the current progress report with its publication list. No new evidence, no interviews.

  Our arguments keep reinventing, badly, the vocabulary of Lakatos's methodology of scientific research programmes. Someone says a group has stopped predicting anything and is only patching its model; someone replies that every worthwhile programme looks like that for a while; we end up voting by temperament. I want a decision procedure instead. It must operationalize the distinctions that do the work — the protected core versus the belt of auxiliary hypotheses, a progressive versus a degenerating problem shift, an auxiliary that increases what the programme claims and predicts versus one adopted purely to absorb a result that had already come in, and a novel fact anticipated in advance versus one merely accommodated afterward — using only the paperwork we have, in the time we have, in language a physicist or a geneticist will apply without being taught the theory. Give it as ordered questions, state what counts as a sufficient answer to each, say where it terminates in a wind-down and where it hands the question to the board because the issue is our appetite for risk rather than a fact about the science, and mark plainly the points where judgment cannot be eliminated and who owns it.

  Two things will make or break it. First, several of our applicants now file what I call a deferral register: at the outset they list the anomalies they intend to set aside and those they claim they will solve. Does an anomaly's appearing on that list exempt it from counting against the programme, or does declaring it merely make a later degenerating verdict cleaner? And where does repeated narrowing of the class of systems the core is claimed to cover fall — content-decreasing, or genuine discovery about scope — when each narrowing comes with a well-argued paper explaining why the broader claim was overstated? Second, I take Lakatos to hold that whether a programme is degenerating is visible only with hindsight, and that young programmes deserve a long leash; we have an afternoon and a fixed budget. Tell me what my procedure is doing that his framework forbids, and what dated proxy it substitutes for a historical verdict.

  Then run it on three cases. (1) A programme that stated three quantitative results in advance and had all three confirmed, but whose model now needs five auxiliary parameters fitted after the fact, two of them introduced after a measurement conflicted. (2) A programme that registered two anomalies for a ten-year deferral, deferred them, and in the meantime published heavily on questions internal to its own framework, work everyone agrees is excellent and that settles nothing anyone outside cares about. (3) Our flagship, which three of us including me were trained in and which the board cites as a success, whose core claim has been narrowed four times over three terms. If the procedure says to wind down (3), say so plainly and tell me whether to believe it. Finally, state what the procedure cannot do — in particular whether it can distinguish a degenerating programme from a field whose instruments are temporarily inadequate, since that distinction decides most of our hard cases.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a renewal panel for a national funder's programme-grant scheme.
      *   **Task:** Create a decision procedure for renewing multi-group research programmes (5-year terms).
      *   **Constraints:**
          *   Panelists: Working scientists (no philosophy training).
          *   Time: ~45 minutes per programme.
          *   Evidence: Founding proposal, previous renewal report, current progress report + pubs (no new evidence, no interviews).
          *   Output: One-page rationale for a lay board.
          *   Framework: Operationalize Lakatos's Methodology of Scientific Research Programmes (MSRP) without using jargon.
          *   Specific Issues to Address: "Deferral registers" (pre-listed anomalies), narrowing scope (content-decreasing vs. discovery), hindsight problem vs. immediate decision, instrument limitation vs. degeneration.
          *   Cases to Run: (1) Predictive success + post-hoc parameters, (2) Deferred anomalies + internal productivity, (3) Flagship + repeated narrowing.
          *   Self-Critique: What does this procedure do that Lakatos forbids? What proxy does it use? What *can't* it do?

  2.  **Deconstruct Lakatos for Scientists:**

      *   *Hard Core:* The fundamental assumptions not to be abandoned. -> *Operationalization:* "Foundational Assumptions" in the founding proposal.
      *   *Protective Belt:* Auxiliary hypotheses adjusted to save the core. -> *Operationalization:* "Model Adjustments" in progress reports.
      *   *Progressive Problem Shift:* Predicts novel facts, expands content. -> *Operationalization:* "Anticipated Discoveries" vs. "Retrospective Explanations."
      *   *Degenerating Problem Shift:* Only accommodates known facts, patches model, shrinks scope. -> *Operationalization:* "Post-hoc Fitting," "Scope Reduction."
      *   *Hindsight Problem:* We can't know for sure *now*. -> *Operationalization:* Risk assessment based on trajectory.

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* Ordered questions, sufficient answers, termination points, judgment ownership.
      *   *Language:* Physicist/Geneticist friendly (avoid "epistemological," "heuristic," "degenerating").
      *   *Structure:*
          1.  Core Integrity (Is the original promise still the engine?)
          2.  Predictive Track Record (Did they hit what they said they would?)
          3.  Model Evolution (Are changes adding power or just fixing leaks?)
          4.  Scope & Anomalies (The "Deferral Register" issue).
          5.  Verdict & Risk.

      *   *Addressing Specific Constraints:*
          *   *Deferral Register:* Does listing an anomaly exempt it? No, but it changes the *type* of failure. If they said "we will solve X" and didn't, it's a missed prediction. If they said "we are ignoring X for now," it's a boundary condition. The prompt asks about anomalies they *intend* to set aside vs. solve. If they solve them, good. If they set them aside and the core relies on them being solvable eventually, it's a risk.
          *   *Narrowing Scope:* Is it content-decreasing? If the narrowing allows *new* predictions within the narrow scope, it's progress (refinement). If it just excludes data that contradicts without adding new predictive power, it's degeneration (ad hoc).
          *   *Hindsight:* We must decide *now*. The proxy is "Momentum of Novelty."

  4.  **Refining the Questions (Iterative Process):**

      *   *Q1 (The Core):* Has the central claim changed? If yes, is it a refinement or a retreat?
      *   *Q2 (Predictions):* Compare Founding Proposal "Aims" vs. Progress Report "Outcomes."
      *   *Q3 (Parameters/Adjustments):* Look at the math/model. New parameters added *after* data arrived?
      *   *Q4 (Scope):* The narrowing issue.
      *   *Q5 (The Deferral):* How to handle the register.

      *   *Decision Tree:*
          *   If Progressive -> Renew.
          *   If Degenerating -> Wind Down.
          *   If Ambiguous -> Risk Call (Board's job).

  5.  **Addressing the "Lakatosian Critique" (The Meta-Analysis):**

      *   Lakatos says you can't judge a programme in real-time. This procedure *forces* a real-time judgment.
      *   Proxy: We are using "Publication Impact/External Engagement" as a proxy for "Theoretical Progress," which Lakatos might reject (sociology vs. logic).
      *   Proxy: We are using "Parameter Count" as a proxy for "Ad Hocness."

  6.  **Running the Cases:**

      *   *Case 1 (3 hits, 5 new params):* Predictive success is good (Progressive). But 5 new params, 2 post-conflict, suggests a degenerating *protective belt*. Verdict: Conditional Renewal (fix the belt).
      *   *Case 2 (Deferred anomalies, internal pubs):* Ignored anomalies (Degenerating sign). Internal pubs (Tautological?). If "settles nothing anyone outside cares about," it's isolated. Verdict: Wind Down (High Risk of Degeneration).
      *   *Case 3 (Flagship, narrowed 4 times):* This is the hard one. Lakatos says narrowing *can* be progress if it leads to new facts. But 4 times in 15 years? Sounds like retreating. If the procedure says Wind Down, do I believe it? The procedure might flag it as "Scope Retreat." But if it's the Flagship, there's a "Sunk Cost/Paradigm" bias. I need to be honest: The procedure likely flags it, but the *political* reality might override. I must advise the Chair on the tension.

  7.  **Addressing the "Instrument Limitation" Problem:**

      *   Can we distinguish "Bad Theory" from "Bad Tools"?
      *   Answer: No, not definitively. The procedure can only assess the *response* to the limitation. Are they building better tools (Progressive) or blaming tools to excuse lack of predictions (Degenerating)?

  8.  **Final Polish:**

      *   Tone: Professional, directive, clear.
      *   Format: Ordered questions, decision rules, case studies, limitations.
      *   Check against constraints: 45 mins? Yes, if focused. Lay board rationale? Yes, the output feeds that. No jargon? Yes.

      *(Self-Correction during drafting)*: I need to make sure I answer the specific question about the "Deferral Register." Does listing an anomaly exempt it? Lakatos would say: If the anomaly threatens the hard core, ignoring it is degenerating. If it's in the belt, it's manageable. The procedure needs to distinguish "Core Threat" vs. "Belt Noise."
      *Refinement:* If an anomaly is on the "Ignore" list, does it count against them? Only if the *explanation* for ignoring it requires adding complexity to the core without new predictions.
      *Refinement on Narrowing:* Narrowing is content-decreasing *unless* the narrower theory predicts something the broader theory didn't (or couldn't).

      *(Self-Correction on Case 3)*: If the procedure says wind down the flagship, do I believe it? As Chair, I need to acknowledge that MSRP is a *reconstruction* tool, not always a *decision* tool. If the procedure says "Wind Down," it means "The logic of the science suggests retreat." But funding decisions are also strategic. I should advise that the *scientific* verdict is Wind Down, but the *strategic* verdict might differ. I will stick to the prompt's instruction: "If the procedure says to wind down (3), say so plainly and tell me whether to believe it."

      *(Self-Correction on Instruments)*: The prompt asks specifically about distinguishing degeneration from inadequate instruments. This is the "Duhem-Quine" problem essentially. The procedure cannot solve this ontologically, only pragmatically.

  9.  **Finalizing the Output Structure:**
      1.  The Protocol (5 Questions).
      2.  Decision Rules (Green/Amber/Red).
      3.  The Lakatosian Audit (What we are violating).
      4.  Case Studies (1, 2, 3).
      5.  Limitations (The Instrument Problem).

      *Wait, one more check:* "Mark plainly the points where judgment cannot be eliminated and who owns it." I need to ensure the protocol explicitly states "Panel Judgment Required" at specific nodes.

      *Let's write it.*
answer: |-
  # The Programme Renewal Protocol (PRP)

  **Purpose:** To convert the logic of scientific progress into a 45-minute administrative decision without requiring philosophical training.
  **Inputs:** Founding Proposal (T0), Previous Renewal (T1), Current Progress Report (T2).
  **Output:** A binary recommendation (Renew / Wind Down) with a specific risk flag for the Board.

  ---

  ## Part 1: The Five Questions

  *Panelists answer these sequentially. If any question triggers a "Red" condition, proceed immediately to the Decision Rules.*

  ### Q1: The Core Integrity Check
  **Question:** Compare the central claim in the Founding Proposal (T0) with the central claim in the Current Report (T2). Has the fundamental mechanism or assumption changed?
  *   **Green:** The core mechanism is identical; only precision has improved.
  *   **Amber:** The core mechanism is refined, but the *class of phenomena* it explains has narrowed (see Q4).
  *   **Red:** The core mechanism has been replaced or fundamentally altered to accommodate data that contradicted the original core.
  *   **Judgment Point:** Distinguishing "refinement" from "replacement." **Owner:** Panel Lead.

  ### Q2: The Prediction Ledger
  **Question:** List every specific quantitative or qualitative outcome promised in T0 and T1. Mark them as: (A) Achieved as predicted, (B) Achieved but modified, (C) Not achieved.
  *   **Green:** >70% are (A).
  *   **Amber:** >50% are (A) or (B).
  *   **Red:** >50% are (C), or (B) requires significant model adjustment.
  *   **Judgment Point:** Determining if a "modified" outcome counts as a success. **Owner:** Panelists (Discipline-specific).

  ### Q3: The Parameter Cost (The "Patching" Test)
  **Question:** Look at the model/equations/framework. To fit the data in T2, how many new variables, parameters, or boundary conditions were added that were *not* in T0?
  *   **Green:** Zero new parameters; precision improved on existing ones.
  *   **Amber:** 1–2 new parameters, but they generate *new* testable predictions for the next term.
  *   **Red:** 3+ new parameters, OR parameters added *after* a specific conflicting measurement was known (post-hoc fitting).
  *   **Judgment Point:** Whether a new parameter adds "content" (predicts new things) or just "fits" (absorbs old data). **Owner:** Panelists (Technical).

  ### Q4: The Scope & Deferral Audit
  **Question:** Review the "Deferral Register" (anomalies listed to be solved or set aside).
  *   **Scenario A (Set Aside):** Did they set an anomaly aside?
      *   **Pass:** They provided a justified boundary condition (e.g., "This effect only applies at low temperatures") *and* the narrower scope predicts something new within that boundary.
      *   **Fail:** They excluded the data simply because it contradicted the core, without new predictive power in the remaining scope.
  *   **Scenario B (To Solve):** Did they promise to solve an anomaly and fail?
      *   **Pass:** They explain why the anomaly was harder than expected and show partial progress that validates the approach.
      *   **Fail:** They ignore the missed promise or claim the anomaly is now "irrelevant."
  *   **Red:** Repeated narrowing of scope (3+ times over programme life) without a corresponding increase in predictive precision within the narrow scope.
  *   **Judgment Point:** Is narrowing a "discovery of limits" (Good) or a "retreat from falsification" (Bad)? **Owner:** Panel Lead.

  ### Q5: External Engagement (The "Isolation" Test)
  **Question:** Do the T2 publications solve problems defined by the programme's internal logic, or do they solve problems recognized by the wider field?
  *   **Green:** Results are used/cited by groups *outside* the programme to solve external problems.
  *   **Amber:** Results are technically excellent but only cited within the programme network.
  *   **Red:** Results are purely defensive (published to justify the model's survival against anomalies).
  *   **Judgment Point:** Distinguishing "specialization" from "isolation." **Owner:** Panelists.

  ---

  ## Part 2: Decision Rules

  1.  **Automatic Renewal:** All Green.
  2.  **Conditional Renewal (Risk Flag):** Any Amber, no Red.
      *   *Rationale:* "The programme is scientifically active but faces theoretical friction. Renewal is granted on the condition that Term 3 focuses on [Specific Deficit identified in Q3 or Q4]."
      *   *Board Handoff:* The Board must approve the "Risk Flag." This is not a scientific fact; it is an appetite for risk.
  3.  **Wind Down Recommendation:** Any Red.
      *   *Rationale:* "The programme is exhibiting signs of theoretical retreat. Resources should be redirected."
      *   *Board Handoff:* If the programme is a "Flagship" (strategic importance), the Board may override. This is a political/strategic decision, not a scientific one.

  ---

  ## Part 3: The Lakatosian Audit (What this procedure violates)

  You asked what this procedure does that Lakatos's framework forbids, and what proxy it uses.

  **1. The Hindsight Violation**
  *   **Lakatos:** A problem shift is only "degenerating" in hindsight (historically). A programme that looks degenerate now might have a breakthrough next year.
  *   **Procedure:** We are forcing a *present-tense* verdict.
  *   **The Proxy:** We substitute **Momentum of Novelty** for **Historical Truth**. We assume that if a programme is not predicting *now*, it is unlikely to predict *soon*. This is a betting heuristic, not an epistemological truth.

  **2. The Sociological Proxy**
  *   **Lakatos:** Progress is about theoretical content (truth-likeness), not popularity.
  *   **Procedure:** Q5 (External Engagement) uses citation/utility by others as a proxy for theoretical progress.
  *   **Risk:** A brilliant, lonely genius looks "degenerate" by this metric. A popular but shallow programme looks "progressive." We accept this risk because funders must support *science as a social practice*, not just logic in a vacuum.

  **3. The Deferral Register Verdict**
  *   **Your Question:** Does listing an anomaly exempt it?
  *   **The Procedure's Answer:** No. Listing it makes the verdict *cleaner*, not softer.
      *   If they list it as "To Solve" and fail: It counts as a missed prediction (Q2).
      *   If they list it as "Set Aside": It counts as a Scope Narrowing (Q4).
      *   **Why:** Lakatos argues that ignoring anomalies is the essence of a degenerating shift *unless* the ignore-action leads to new predictions. The Register simply creates a contract. If they break the contract, the degeneration is documented, not excused.

  ---

  ## Part 4: Case Studies

  ### Case 1: The Over-Fitted Success
  *   **Data:** 3/3 quantitative results confirmed (Q2: Green). Model needs 5 new auxiliary parameters, 2 post-conflict (Q3: Red).
  *   **Procedure Verdict:** **Wind Down Recommendation.**
  *   **Rationale:** While the predictions were hit, the *cost* of hitting them violates the "Parameter Cost" rule. Adding parameters *after* conflict is the definition of "patching the belt."
  *   **Action:** Do not renew for 5 years. Offer a 1-year "consolidation grant" to see if the 5 parameters can be derived from a simpler principle. If not, the programme is mathematically bloated.

  ### Case 2: The Deferral Isolationists
  *   **Data:** 2 anomalies deferred (Q4: Amber/Red depending on justification). Heavy publication on internal questions, zero external uptake (Q5: Red).
  *   **Procedure Verdict:** **Wind Down Recommendation.**
  *   **Rationale:** Deferring anomalies is permissible *if* the time is used to solve external problems. Publishing "excellent work that settles nothing anyone outside cares about" indicates the programme has become a self-referential logic puzzle. It is theoretically degenerating even if technically proficient.
  *   **Action:** Wind down. The work is now basic research suitable for individual grants, not a coordinated programme grant.

  ### Case 3: The Flagship (The Hard Case)
  *   **Data:** Core claim narrowed 4 times in 15 years (Q4: Red). Trained panelists including you (Bias Risk). Board cites it as a success.
  *   **Procedure Verdict:** **Wind Down Recommendation.**
  *   **Should you believe it?** **Yes.**
  *   **Reasoning:** Four narrowings in three terms is the textbook definition of a "retreating front." Unless each narrowing produced a *surge* in predictive precision within the new narrow scope (which you did not state), the programme is surviving by excluding counter-evidence, not by explaining evidence.
  *   **The Conflict:** The Board views it as a success because it is *established*. Lakatos warns that established programmes often survive due to institutional inertia long after they stop being progressive.
  *   **Chair's Duty:** You must present the "Red" finding on Q4 to the Board. You must explicitly state: *"Scientifically, this programme is retreating. Strategically, you may choose to fund it as a legacy infrastructure, but do not label it 'cutting edge research'."* If the Board overrides, the rationale changes from "Renewal of Research" to "Subsidy of Infrastructure."

  ---

  ## Part 5: Limitations (What this cannot do)

  **The Instrument Problem**
  *   **Question:** Can this distinguish a degenerating programme from a field whose instruments are temporarily inadequate?
  *   **Answer:** **No.**
  *   **Why:** This is the Duhem-Quine problem. If a prediction fails, is the theory wrong, or was the measurement tool insufficient?
  *   **How the Procedure Handles It:** It punishes *inaction*.
      *   If the team says "Instruments failed" and spends the term *building better instruments* that yield new data: **Green** (Progressive).
      *   If the team says "Instruments failed" and spends the term *writing papers explaining why the data doesn't count*: **Red** (Degenerating).
  *   **The Hard Truth:** We cannot judge the *state of the technology*, only the *productivity of the response* to the technological limit. If the instruments are truly inadequate, a progressive programme will pivot to instrumentation. A degenerating one will pivot to apology.

  **The Judgment Ownership Summary**
  1.  **Scientific Fact:** Whether a parameter was added post-hoc (Q3). **Owner:** Panelists.
  2.  **Scientific Judgment:** Whether scope narrowing yielded new predictions (Q4). **Owner:** Panel Lead.
  3.  **Risk Appetite:** Whether to renew an "Amber" programme. **Owner:** Board.
  4.  **Strategic Override:** Whether to renew a "Red" Flagship. **Owner:** Board (with explicit warning from Chair).

  **Final Instruction to Panel:**
  Use this protocol to generate the *text* of the one-page rationale. If the protocol says "Red," the rationale must not use words like "challenge" or "opportunity." It must use words like "retreat," "accommodation," and "risk." Clarity is kinder than hope.
