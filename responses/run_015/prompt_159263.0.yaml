answer: |-
  **The Scenario**

  An insurance policy covers accidental damage unless a specific exclusion clause fires. Two drivers, Alice and Bob, were involved in separate incidents under identical conditions, except Alice was driving 2 mph faster than Bob. Both speeds fall squarely in the borderline zone of the vague predicate "reckless" (neither clearly reckless nor clearly careful, but Alice is indisputably more reckless than Bob). The exclusion clause reads: "Coverage is denied if the following statement is true: If Bob's driving was reckless, then Alice's driving was reckless." The insurer must decide whether to pay Alice's claim based solely on the truth value of that conditional statement.

  **The Key Sentence**
  *"If Bob's driving was reckless, then Alice's driving was reckless."*

  **The Walkthrough**

  *   **Supervaluationism:** The theory treats "reckless" as having multiple admissible precisifications (sharp cutoffs). Because Alice is more reckless than Bob, no admissible precisification can classify Bob as reckless while classifying Alice as not reckless (that would violate the penumbral connection). On every admissible precisification, the material conditional is true (either both are in, both are out, or Bob is out while Alice is in). Therefore, the sentence is **supertrue**. The semantic status is definite. The insurer has a decidable verdict: **Deny Coverage.**

  *   **Epistemicism:** The theory holds there is a single, sharp cutoff for "reckless" fixed by usage, even if unknowable. It is a fact that the conditional is either true or false. However, because the cutoff could metaphysically lie precisely between Alice's speed and Bob's speed, it is possible the conditional is false (if Bob is on the "reckless" side of the line and Alice is on the "careless" side). Since the theory entails we cannot know where the cutoff lies, we cannot know the truth value of the conditional. The insurer faces a fact of the matter they are constitutionally barred from accessing. The practical verdict is **Undecidable/Stuck.**

  **The Key Feature**
  The work is done by the **penumbral connection** (the comparative ordering) between the two cases. The vagueness is constrained by the fact that Alice is *more* $F$ than Bob. This constraint rules out certain precisifications in Supervaluationism (stabilizing the truth value), but it does not rule out certain metaphysical locations of the sharp boundary in Epistemicism (destabilizing the knowledge of the truth value).

  **If You Remove It**
  If the clause relied on a single atomic case ("Coverage denied if Alice was reckless"), Supervaluationism would also gap out (indeterminate), matching the Epistemicist's ignorance. If the clause explicitly used a determinacy operator ("Coverage denied if it is *definitely* true that..."), both theories would likely converge on a negative verdict (since neither case is definitely reckless), removing the divergence. If the decision-maker were allowed to stipulate a bright line (precisification by fiat), the dispute dissolves into administrative rule-making rather than semantic analysis.

  **Reversal Robustness**
  If the rule were rewritten as "Coverage is permitted if and only if it is *not* the case that (If Bob reckless then Alice reckless)," the Supervaluationist still denies coverage (the negation of a supertruth is superfalse, so the permission condition fails). The Epistemicist remains stuck (the negation of an unknown truth value is still unknown). The asymmetry survives the logical flip.

  **The Epistemicist's Best Counter**
  The Epistemicist will argue that Supervaluationism is cheating by changing the definition of "truth" required to fire the clause. The contract says "if the statement is *true*," not "if the statement is *supertrue*." By equating supertruth with the truth required for liability, Supervaluationism smuggles in a precisification policy under the guise of semantics. Furthermore, the Epistemicist will note that the "decidability" is illusory: if the court asks *why* coverage is denied, the Supervaluationist cannot point to a fact about the driving, only to a fact about the semantics of the word "reckless."

  **The Cost**
  This reversal costs Supervaluationism its claim to preserving classical logic without remainder. To get the decidable verdict, the Supervaluationist must accept that the material conditional behaves non-classically in borderline contexts (it is true even though the antecedent and consequent lack truth values). More honestly, it costs the theory metaphysical neutrality: it solves the decision problem only by treating semantic stability across interpretations as a substitute for worldly fact. In a legal context demanding "what actually happened," handing over "what holds across all interpretations" may be a category error that a judge would reject as soon as they realize the verdict relies on the non-existence of a sharp boundary rather than the presence of a fact.
