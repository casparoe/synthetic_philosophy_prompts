prompt: |-
  hey — I need a thought experiment built to order, on vagueness.

  Context on what it's for, since that fixes what counts as cheating: I'm writing a section pushing back on a bit of folklore, the idea that epistemicism is the clean, classical, institution-friendly theory (bivalence, classical logic, verdicts for everyone) while supervaluationism is the mushy gap-tolerant one that can't tell a decision-maker what to do. I want at least one case where that's backwards: supervaluationism hands the decision-maker a usable, decidable answer, and epistemicism is the one stuck saying there's a fact of the matter but you can never know which way it goes.

  So: build me one ordinary scenario — a tenancy deposit, an insurance claim, a workplace bonus rule, whatever — one paragraph, no sci-fi, no demons, where the two theories disagree about a concrete practical outcome (who gets paid, who's on the hook, whether a clause fires). Specs:

  1. The disagreement has to be traceable to one identifiable sentence containing one vague predicate, and both theories have to treat that predicate as a geniune borderline case here — nobody wins by saying the predicate isn't really vague in this instance.
  2. The outcome has to track the truth value of that sentence, not who can prove what. So write the rule so it turns on whether the sentence is true, and have the one finding both sides accept be that it's borderline. No burden-of-proof trickery, no "the decision-maker just stipulates a cutoff and moves on" — the verdicts have to fall out of the semantics: bivalence plus classical composition on one side, supertruth across admissible precisifications and gaps on the other.
  3. The reversal has to survive rephrasing: show it still comes out the same if the trigger is written the other way round (permitted unless P versus permitted iff not-P), so it isn't an artefact of one formulation.
  4. No leaning on definitely/determinately operators and no higher-order vagueness — I want the gap propagating through the embedding (negation, conditional, whatever you use) to do the work, not a special operator doing it for you.

  Then: state the key sentence explicitly, walk through what each theory says about the case and why, tell me which single feature of the case is doing the work, what happens if you remove it (say the clause said "definitely not P", or the decision-maker were allowed to lay down a bright line), and what the epistemicist's best counter is. I assume it's something like admissible-precisification being itself vague so your decidability is fake, plus legal practice being bivalent anyway — but give me your version, and be honest about how much it actually costs.
