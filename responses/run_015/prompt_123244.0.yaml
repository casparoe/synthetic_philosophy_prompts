answer: |-
  **Handout: Futarchy and the Precrime Paradox**

  **The Mechanism**
  Robin Hanson's futarchy proposes a split in governance: democracy decides the utility function (what we want to maximize), while prediction markets decide the policy (which action yields the most utility). Voters define the metric; traders bet on outcomes. If the market predicts Policy A yields higher national welfare than Policy B, Policy A is enacted. Crucially, the market must be scored later against real-world outcomes to settle contracts. *Minority Report* presents a dark mirror of this: the utility function is "zero murders," the policy is "preventive arrest," and the "market" is the precognitive triad. However, treating Precrime as a failed futarchy reveals specific institutional failure modes that Hanson's papers often abstract away.

  **Failure Mode 1: Proxy and Instrument Risk**
  In futarchy, the market metric must align with the social goal. In *Minority Report*, the instrument (the precogs) is conflated with the truth. This is **Proxy Risk**. The system cares more about the infallibility of the instrument than the actual reduction of harm. We see this in the **Temple scene**, where Lamar Burgess protects the precogs not as sensors, but as icons. When the system's reputation is threatened, Burgess murders to maintain the illusion of zero error. 

  This risk extends to the biometric instruments used to track citizens. During the **eye-transplant escape**, Anderton evades the state by swapping his retinas. The system's "instrument" for identity is fragile; it measures retinal scans, not persons. When the proxy (retina) diverges from the reality (Anderton), the institution blinds itself rather than updating its model. A robust futarchy requires instruments that are robust to manipulation; Precrime requires citizens to be legible to the point of biological surrender.

  **Failure Mode 2: Unscoreability and the Exploration Levy**
  Futarchy relies on settlement: you must know if the policy actually worked to pay out the market. Precrime suffers from permanent **Unscoreability**. Because the arrest prevents the murder, the prediction can never be graded against the counterfactual. Did Anderton really intend to kill Leo Crow? We never know, because the intervention occurred. 

  Your proposed fix, an **exploration levy**, suggests deliberately allowing some predicted murders to occur to verify the precogs' accuracy. In the film, this translates to letting Anderton confront Crow without intervention. While this solves the epistemic black box, it highlights the moral horror of the utility function. A market can absorb financial loss to verify a price; a justice system cannot absorb human death to verify a prophecy. The film suggests that when the "utility" is human safety, unscoreability is a feature, not a bug—but one that renders rational validation impossible.

  **Failure Mode 3: Reflexivity and Agency**
  Reflexivity occurs when the forecast alters the outcome. Standard market design worries about traders manipulating prices; Precrime worries about subjects manipulating fate. When Anderton learns he is predicted to kill, he flees. This is not merely "predictions change the world." The deeper failure is that the institution criminalizes the agency required to falsify the prediction. 

  In the **confrontation with Crow**, Anderton chooses not to shoot, proving the prediction wrong. In a futarchy, this would be a profitable short position: you bet against the murder, the murder doesn't happen, you win. In Precrime, changing the future is treated as evidence of guilt (he knew the prediction and ran) or suppressed entirely. The system cannot tolerate a citizen who proves the market wrong by exercising free will. It demands a deterministic universe to function, punishing the very reflexivity that proves human agency exists.

  **The Minority Report as Signal**
  Your note on the "minority report" itself is crucial. In well-designed markets, dissent is information; divergent prices indicate uncertainty or hidden variables. Agatha (the minority precog) represents a dissenting price signal. She sees the version of the future where Anderton *doesn't* kill. A rational institution would treat this as a high-variance signal requiring further investigation. Instead, Precrime treats dissent as noise to be expunged. By suppressing the minority report, the institution destroys the data required to correct its own errors. It prioritizes consensus over truth, turning a prediction mechanism into a dogma machine.

  **Where the Reading Breaks: Legitimacy vs. Efficiency**
  However, treating Precrime purely as a botched market design commits a category error. Futarchy assumes willing participants trading capital; Precrime relies on captive persons (the precogs) and non-consensual subjects (the arrested). The precogs are not traders; they are slaves hooked to a machine. There is no market analogue for this because legitimate markets require property rights over one's own cognition. 

  Furthermore, the film's central objection is not epistemic but moral. Futarchy asks, "What is the most efficient way to maximize welfare?" *Minority Report* asks, "Is it legitimate to punish someone for a world that did not happen?" The film adds a phenomenological layer to the debate: the experience of being scored. In Hanson's vision, citizens vote on values and trust the market. In Spielberg's, citizens live under the gaze of an oracle that denies their potential for change. 

  The "sealed-forecast" fix (withholding predictions from officials) might reduce reflexivity, but it does not solve the legitimacy crisis. If the state arrests you based on a secret score you cannot contest, the efficiency of the prediction is irrelevant. The film argues that a system without the possibility of forgiveness—or the possibility of being proven wrong by the accused—is tyrannical, regardless of its accuracy. 

  **Conclusion**
  *Minority Report* does not just warn us that predictions can be wrong; it warns us that perfect predictions are incompatible with human freedom. Futarchy attempts to outsource truth to markets to avoid political bias. The film shows that when you outsource justice to prophecy, you remove the space for redemption. The exploration levy is theoretically sound but morally repugnant; the sealed forecast is operationally difficult but ethically hollow. The film's contribution to the rationalist debate is the reminder that efficiency is not the only utility function. A society that maximizes safety by eliminating the possibility of error also eliminates the possibility of choice. The precogs see the future, but the system refuses to let us live in it.
