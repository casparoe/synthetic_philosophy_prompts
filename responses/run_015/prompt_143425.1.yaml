answer: |-
  This is a classic problem in normative ethics (the "Aggregation Problem" and "Non-Identity Problem"), but your request is for an engineering specification, not a literature review. You are asking for a decision function `decide(List<Person> outcomes) -> Outcome` that matches your intuitions.

  Your intuitions are inconsistent with standard Utilitarianism (which fails Cases 4, 7, 9) and inconsistent with strict Egalitarianism (which fails Cases 1, 10). You are describing a **Hybrid Constrained Prioritarianism**.

  Below are three candidate principles stated as algorithms. I have derived them from your verdicts, not from philosophical authority.

  ### Candidate Principle 1: Weighted Lexical Aggregation
  **Logic:** Harm severity is the primary key; numbers are the secondary key, but with diminishing returns.
  **Data Structure:** `Person { id, harm_severity, relationship, is_active_victim }`

  **Algorithm:**
  1.  **Filter Rights:** If an outcome requires `active_killing` (Case 7), discard it unless all options require it.
  2.  **Filter Special Obligations:** If `relationship == 'kin'` (Case 5), multiply that person's weight by $\infty$.
  3.  **Group by Severity Tier:** Cluster harms into ordinal tiers (e.g., Death, Maiming, Burns, Rash).
  4.  **Compare Worst Tier:**
      *   If Option A has a worse "Worst Tier" than Option B, choose B (Case 3).
      *   If Tiers are equal, proceed to Aggregation.
  5.  **Aggregate with Diminishing Returns:** Calculate Score $S = \sum_{i=1}^{n} w(harm) \cdot \sqrt{n}$.
      *   $w(harm)$ is the weight of the severity tier.
      *   $n$ is the count of people in that tier.
      *   If $w(rash) \approx 0$ (Case 4), they do not sum to outweigh a hand.
  6.  **Fairness Tie-Break:** If $\Delta S < \epsilon$ (Case 2), default to a Lottery (Case 9).

  **Motivation by Case:**
  *   **Case 1 & 2:** Handled by Step 5 (Aggregation). The square root handles your hesitation in Case 2 (2 vs 1 feels closer than 5 vs 1).
  *   **Case 3 & 4:** Handled by Step 4 & 5 (Lexical severity + De Minimis weight for rashes).
  *   **Case 7:** Handled by Step 1 (Rights Constraint).
  *   **Case 5:** Handled by Step 2 (Partiality Override).
  *   **Case 9:** Handled by Step 6 (Tie-break).
  *   **Case 10:** **Fails.** This principle would likely calculate the "Save 5" score as significantly higher than "Save 1" and reject the lottery, matching your verdict, but it struggles to explain *why* Case 9 allowed a lottery while Case 10 did not, other than the $\Delta S$ magnitude.

  ### Candidate Principle 2: The "Strongest Complaint" Model
  **Logic:** Morality is about addressing the strongest individual reasonable complaint, not summing welfare. Numbers only matter insofar as they strengthen a complaint.
  **Algorithm:**
  1.  **Identify Complaints:** For each person, calculate $C = harm\_severity \cdot (1 / probability\_of\_avoidance)$.
  2.  **Find Max Complaint:** Identify the individual with the highest $C$ in each Outcome.
  3.  **Compare Max Complaints:**
      *   If $MaxC_A \gg MaxC_B$, choose A.
      *   If $MaxC_A \approx MaxC_B$, look at the *number* of people with that complaint.
  4.  **Aggregation Threshold:** Only aggregate complaints if the severity is identical (Case 1). If severity differs (Case 3), the single worst-off individual vetoes the sum.

  **Motivation by Case:**
  *   **Case 1:** Severities equal; 5 complaints > 1 complaint.
  *   **Case 3:** Death complaint > Hand complaint. One death vetoes five hands.
  *   **Case 4:** Hand complaint > Rash complaint. One hand vetoes a million rashes.
  *   **Case 6:** Hand+Foot complaint > Hand complaint. You might save the single worse-off person (Maximin), which conflicts with your verdict ("I don't think the outcome containing him is worse"). This principle forces you to drop your Case 6 verdict.
  *   **Case 9:** Everyone has an equal complaint (100% chance of death if not picked). Lottery resolves equal complaints.
  *   **Case 10:** The 5 have a collective complaint that outweighs the 1, even if ex-ante chances are equalized.

  ### Candidate Principle 3: Ex-Ante Fairness with Ex-Post Constraints
  **Logic:** Maximize the expected chance of survival for each individual, subject to a "Minimum Acceptable Outcome" constraint.
  **Algorithm:**
  1.  **Calculate Ex-Ante Probabilities:** For each option, what is the $P(survival)$ for every individual?
  2.  **Check Minimum Constraint:** Does any option push a specific individual's $P(survival)$ below a threshold (e.g., 0.1) when an alternative keeps it at 1.0? (Case 7/10).
  3.  **Maximize Sum of Probabilities:** $\sum P(survival_i)$.
  4.  **Variance Penalty:** Apply a penalty to options with high variance in $P(survival)$ unless the Sum is significantly higher.

  **Motivation by Case:**
  *   **Case 9:** Sum of probabilities is equal (1.0). Variance is lower in Lottery. Choose Lottery.
  *   **Case 10:** Sum of probabilities is higher in "Save 5" (5.0 vs 1.0). Variance penalty is outweighed by Sum. Choose Save 5.
  *   **Case 4:** Sum of probabilities for rashes is high, but the "Minimum Constraint" for the Hand loss is triggered.
  *   **Case 7:** The "active killing" lowers the ventilator patient's $P$ to 0 via *your* action, triggering a hard constraint.

  ---

  ### Verdicts on Unlisted Cases

  Here is how **Principle 1 (Weighted Lexical Aggregation)**—which best fits your overall profile—handles your requested edge cases:

  **1. A Hundred vs. One (Identical Harms)**
  *   **Verdict:** Save the hundred.
  *   **Reasoning:** $\sqrt{100} = 10$ vs $\sqrt{1} = 1$. The diminishing return is not strong enough to override a 100x multiplier at the same severity tier.
  *   **Conflict:** If you feel hesitation here similar to Case 2, your diminishing return function needs to be logarithmic, not square root.

  **2. Five Hands vs. One Hand+Foot**
  *   **Verdict:** Save the Five Hands.
  *   **Reasoning:** Severity Tier is "Maiming" for both. Aggregation applies. $5 \cdot \sqrt{5} > 1 \cdot \sqrt{1}$.
  *   **Conflict:** This contradicts your Case 6 intuition ("I don't think the outcome containing him [Hand+Foot] is worse"). Principle 1 forces you to accept that 5 hands is a worse outcome than 1 hand+foot. If you cannot accept this, you must adopt **Principle 2**, which would save the Hand+Foot person (Maximin).

  **3. One Identified vs. Million Statistical**
  *   **Verdict:** Save the One Identified.
  *   **Reasoning:** This is the "Identifiable Victim Effect." In code, this is a weight multiplier on `is_identified == true`.
  *   **Conflict:** This violates **Impartiality**. If you implement this, your system is explicitly biased against statistical lives. In production, this looks like: `if victim.name != null: weight *= 10`.

  ---

  ### Reconciling Cases 9 and 10

  You asked if these can be reconciled or if you must choose between Ex-Ante and Ex-Post.

  **They can be reconciled via a "Claim Strength Threshold."**

  *   **Case 9 (1 vs 1/6):** The *Aggregate Claim Strength* is equal. (1 Life vs 6 people $\times$ 1/6 Life). When aggregate claims are equal, **Ex-Ante Fairness** (the lottery) breaks the tie.
  *   **Case 10 (5 vs 1):** The *Aggregate Claim Strength* is unequal. (5 Lives vs 1 Life). The "Fairness Bonus" of a lottery is a constant value $F$. The "Utility Loss" of the lottery is $U_{save5} - U_{lottery}$.
      *   In Case 9, $U_{loss} \approx 0$, so $F > U_{loss}$. (Choose Lottery).
      *   In Case 10, $U_{loss}$ is large (4 lives), so $U_{loss} > F$. (Choose Save 5).

  **Implementation:**
  Do not treat "Fairness" as a primary objective. Treat it as a **tie-breaker with a budget**.
  `if (abs(Score_A - Score_B) < Fairness_Budget): return Lottery`
  `else: return Max(Score)`

  In Case 9, the scores are identical, so the budget covers the difference. In Case 10, the score difference exceeds the budget.

  ---

  ### Formal Properties & Production Failures

  If you implement the **Weighted Lexical Aggregation with Fairness Budget**, you must abandon **Independence of Irrelevant Alternatives (IIA)** and potentially **Transitivity**.

  **1. Failure of Separability (Grouping Sensitivity)**
  *   **The Bug:** Your verdict depends on how the input list is partitioned.
  *   **Example:** In Case 1, the 5 are "East Wing." If you treat them as 5 individuals, they sum. If you treat them as 1 "Wing" entity, they might not.
  *   **Production Symptom:** The scheduler returns different decisions if the input JSON groups users by `region_id` vs. `user_id`.
  *   **Fix:** Enforce a canonical grouping level (e.g., always flatten to individual humans) before calculation.

  **2. Failure of Transitivity (Cycling)**
  *   **The Bug:** Because you use a Lexical Tier (Severity) *and* Aggregation (Numbers), you can create cycles in edge cases.
  *   **Scenario:**
      *   Option A: 1 Death.
      *   Option B: 100 Hands. (You choose B, Numbers > Severity).
      *   Option C: 1 Hand+Foot. (You choose A, Severity > Hand).
      *   But do you choose C over B? 1 Hand+Foot vs 100 Hands. If you choose B, you have A < B, A < C, but B > C. This is transitive.
      *   However, if your "Severity Tier" boundaries are fuzzy (Case 6), you risk cycling.
  *   **Production Symptom:** A triage loop where the system oscillates between two allocation strategies as load changes slightly, never converging.

  **3. Failure of Completeness (Refusal to Answer)**
  *   **The Bug:** Case 7 (Killing) introduces a hard constraint.
  *   **Production Symptom:** `Null` return or Exception thrown when the only available options involve active rights violations.
  *   **Requirement:** You must define a "Least Bad" fallback. E.g., `if all_options_violate_rights: return Minimize_Violations`.

  ### Recommendation

  Your intuition is most closely modeled by **Weighted Lexical Aggregation with a Fairness Budget**.

  **The Spec:**
  1.  **Input:** `List<Claim>` where `Claim = { Person, Harm_Score, Is_Identified, Relationship }`.
  2.  **Pre-processing:**
      *   If `Relationship == Self/Kin`: `Harm_Score *= 1000`.
      *   If `Harm_Score < De_Minimis_Threshold`: `Harm_Score = 0`.
      *   If `Action_Type == Active_Killing`: `Veto = True`.
  3.  **Scoring:**
      *   Group by `Harm_Tier` (Death, Maim, Burn, Rash).
      *   If Tiers differ: Select option with best Worst-Tier (unless `Veto`).
      *   If Tiers match: `Option_Score = sum( sqrt(count) * Harm_Score )`.
  4.  **Decision:**
      *   If `abs(Score_A - Score_B) < Fairness_Threshold`: **Trigger Lottery**.
      *   Else: **Select Max Score**.
      *   If `Veto` is set on Max Score: **Select Next Best Non-Veto**.

  **What you must drop:**
  You must drop the intuition in **Case 6** that "the outcome containing him [Hand+Foot] is not worse."
  *   **Why:** To save the 5 hands (Case 6) while saving the 1 life (Case 3), you must admit that numbers *sometimes* outweigh severity differences, or that Hand+Foot is not a higher Tier than Hand. If Hand+Foot is a higher Tier, you must save him (Maximin). If it is the same Tier, you must save the 5 (Aggregation). You cannot have it both ways without violating Transitivity.
  *   **Credibility Check:** The principle (consistency) is more credible than the specific intuition in Case 6. Case 6 is likely an emotional reaction to the "concentration of harm" which the `sqrt(count)` function already accounts for by diminishing the value of the 5 hands. If `5 * sqrt(1)` is not greater than `1 * sqrt(1) * severity_multiplier`, the math will save the Hand+Foot automatically.

  **Final note on Case 8 (Copies):**
  Implement `Harm_Score /= sqrt(Duplicate_Count)`.
  *   10,000 copies of 1 mind $\approx$ $100 \times$ Weight of 1 person.
  *   This validates your intuition that it is worse than 1 death, but not 10,000 times worse.
