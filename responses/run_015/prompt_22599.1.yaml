  8.  **Finalizing the Plan:**
      *   Intro: SCA and the threat of counterexamples.
      *   Argument 1: Metaphysical Mechanism (Base removal vs. Pathway blocking).
      *   Argument 2: Truth-Conditional Asymmetry (Disposition truth-value during $S$).
