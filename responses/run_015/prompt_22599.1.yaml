answer: |-
  The debate over the Simple Conditional Analysis (SCA) of dispositions—roughly, that an object $x$ has disposition $D$ to manifest $M$ upon stimulus $S$ iff if $x$ were $S$, then $x$ would $M$—has long been haunted by counterexamples. The two most prominent are **finks** (introduced by C.B. Martin) and **masks** (discussed by Johnston, Lewis, and others).

  Your friend suggests the distinction between them is merely verbal: both are simply cases where the conditional fails despite the disposition's presence, and both are solved by the same "ceteris paribus" clause. I will argue the opposite. The distinction is **substantive**, not verbal. Collapsing finks and masks obscures the metaphysical structure of dispositions and creates a fatal ambiguity in the reductive program. To save reductionism, we must treat them as distinct failures requiring distinct reparations.

  Here is the strongest argument for the substantive distinction, followed by the strongest case for unification and why it ultimately fails.

  ### I. The Metaphysical Divergence: Base Removal vs. Pathway Blocking

  The primary reason the distinction is substantive is that finks and masks represent fundamentally different ontological mechanisms regarding the **categorical base** of the disposition.

  1.  **Masks (Interference):** In a masking case (e.g., a fragile glass packed in styrofoam), the categorical base of the disposition (the molecular structure of the glass) remains intact throughout the stimulus. The mask is an extrinsic (or sometimes intrinsic) factor that intervenes in the causal pathway *between* the stimulus and the manifestation. The disposition is present, the stimulus occurs, but the manifestation is blocked.
  2.  **Finks (Removal):** In a finkish case (e.g., Martin's electro-fink which makes a wire live only when not touched, or dead when touched), the stimulus itself triggers a change in the object that **removes the categorical base** of the disposition before the manifestation can occur. The disposition is present at $t_0$, but the occurrence of $S$ causes the disposition to cease existing at $t_1$.

  **Why this matters for Reduction:**
  The reductive program aims to analyze dispositional talk in terms of non-dispositional (categorical) facts and counterfactuals.
  *   If we treat masks as the paradigm, we assume the categorical base is stable and the problem is merely environmental noise. The fix is to specify "normal external conditions."
  *   If we treat finks as the paradigm, we must acknowledge that the categorical base itself can be **intrinsically volatile**. The fix requires specifying "stability of the base."

  If you collapse these categories, you lose the ability to specify *what* is being reduced. Are we reducing dispositions to stable categorical bases (threatened by finks) or to behaviors under specific environmental constraints (threatened by masks)? A unified theory blurs the line between the *property itself* and the *conditions of its operation*.

  ### II. The Truth-Conditional Asymmetry

  The distinction is logically substantive because the truth-value of the disposition attribution differs during the antecedent of the counterfactual.

  *   **In Masking:** When the antecedent "If $x$ were struck" is true, the proposition "$x$ is fragile" remains **true**. The failure of the conditional ($S \boxright M$) is due to an external blocker.
  *   **In Finking:** When the antecedent "If $x$ were struck" becomes true, the proposition "$x$ is fragile" becomes **false**. The fink operates *because* of the stimulus.

  This creates a **truth-conditional gap**. In masking cases, the SCA fails because the right-hand side (the conditional) is false while the left-hand side (the disposition) is true. In finkish cases, the SCA fails because the truth of the antecedent actively falsifies the left-hand side *during* the evaluation of the right-hand side.

  **Why this matters for Reduction:**
  A reductive analysis seeks necessary and sufficient conditions.
  *   To fix **Masks**, we need to add clauses to the *antecedent* of the conditional (e.g., "and no interferers are present").
  *   To fix **Finks**, we need to add clauses regarding the *persistence conditions* of the property itself (e.g., "and the base property remains stable").

  If you treat them as the same, you are forced to adopt a generic "no interferers" clause. But a fink isn't an interferer; it is a **property-annihilator**. Treating a property-annihilator as a mere interferer forces the reductive analysis to treat the *existence* of the disposition as a background condition rather than the *explanandum*. This undermines the reduction, as the analysis presupposes the stability of the very property it is trying to define.

  ### III. The Threat to Intrinsicness

  A major motivation for the reductive program is to ground dispositions in **intrinsic properties**. We want to say the glass is fragile in virtue of its internal structure, not its environment.

  *   **Masks** are typically extrinsic (packing material, safety nets). They are compatible with the disposition being intrinsic.
  *   **Finks** often imply that the "intrinsic" base is sensitive to the stimulus in a way that removes the disposition.

  If we collapse finks and masks into a single category of "conditional failures," we invite a slide toward **extrinsicism**. If a fink is just a type of mask, then whether an object has a disposition depends heavily on the "conditions" surrounding the stimulus, including the object's own reactive mechanisms to that stimulus. This makes the disposition less a property of the object and more a property of the object-in-a-specific-context.

  For the reductive program to succeed, it must isolate the disposition as a property of the object. Recognizing finks as distinct forces the reductionist to account for **intrinsic stability**. Recognizing masks forces the reductionist to account for **extrinsic isolation**. Collapsing them allows the reductionist to cheat by using a vague "appropriate conditions" clause that hides whether they are relying on intrinsic or extrinsic facts to do the heavy lifting.

  ---

  ### The Strongest Counter-Argument: The Unificationist View

  To be fair to your friend, there is a compelling reason to treat them as the same phenomenon. This is the **Functional Equivalence / Antecedent Strengthening** argument.

  **The Argument:**
  1.  **Extensional Equivalence:** From the perspective of the conditional analysis, finks and masks do the exact same thing: they make the counterfactual $S \boxright M$ false while the disposition $D$ is (initially) true.
  2.  **Unified Solution:** Both problems are solved by the same logical move: **Antecedent Strengthening**. To fix the SCA, we move from "If $S$, then $M$" to "If $S$ and conditions $C$ obtain, then $M$."
  3.  **Indistinguishability in $C$:** Whether condition $C$ rules out a mask (e.g., "no packing material") or a fink (e.g., "no electro-fink device attached"), it is simply a restriction on the circumstances under which the counterfactual is evaluated.
  4.  **Occam's Razor:** If the logical fix is identical (refine the antecedent), positing a metaphysical distinction between "base removal" and "pathway blocking" is gratuitous. It adds ontological complexity without yielding different predictive or analytical results. As philosopher Stephen Mumford has suggested, both are simply cases where the "stimulus-manifestation" link is broken; the precise mechanism of the break is irrelevant to the logic of the analysis.

  On this view, the distinction is merely verbal because the *repair strategy* for the reductive program is identical. We just need a sufficiently robust "ceteris paribus" clause, regardless of whether the *paribus* is violated by a mask or a fink.

  ### Rebuttal: Why Unification Undermines Reduction

  The Unificationist view is pragmatically useful but metaphysically shallow. It fails to see that **how** you strengthen the antecedent determines the success of the reduction.

  1.  **The Circularity Trap:** If you treat finks as masks, your "ceteris paribus" clause must rule out anything that prevents manifestation. But in fink cases, what prevents manifestation is the *loss of the disposition*. If your analysis says "$x$ is disposed to $M$ if $S$ and $C$," and $C$ includes "the disposition is not lost," you have defined the disposition in terms of itself. You have said: "$x$ is fragile iff if struck, it breaks, provided it remains fragile." This is circular.
      *   To avoid circularity in **Fink** cases, $C$ must be defined in terms of the *categorical base* (e.g., "molecular structure remains intact").
      *   To avoid over-restriction in **Mask** cases, $C$ must be defined in terms of *external interferers*.
      *   If you collapse them, you are forced to use a generic $C$. If $C$ is generic, it either smuggles in dispositional terms (circularity) or is so vague it fails to reduce anything.

  2.  **Explanatory Depth:** Reductionism isn't just about saving the truth values of sentences; it's about explaining *in virtue of what* the sentences are true.
      *   A mask explains failure via **causal obstruction**.
      *   A fink explains failure via **property cessation**.
      *   If a reductive analysis cannot distinguish between "the cause was blocked" and "the cause ceased to exist," it has failed to capture the causal structure of the world. It treats the disappearance of a property as equivalent to the interference with a property. This is a category error.

  3.  **The "Finkish Lack" Problem:** The distinction becomes even more critical when considering "finkish lacks" (where an object lacks a disposition, but the stimulus causes it to gain it, leading to a false positive on the SCA). Masks generally don't produce false positives (a non-fragile glass doesn't break just because it's unpacked). Finks do. If you collapse the categories, you lose the tools to explain why one case yields a false negative (mask/standard fink) and the other yields a false positive (finkish lack). A unified theory struggles to explain this asymmetry without reintroducing the distinction anyway.

  ### Conclusion

  Your friend is correct that finks and masks are *logically* similar in that they both break the Simple Conditional Analysis. However, they are wrong to conclude the distinction is merely verbal.

  For the **reductive program**, the distinction is vital. Masks threaten the **sufficiency** of the conditional (the disposition is there, but the conditional fails). Finks threaten the **stability of the truth-maker** (the antecedent destroys the disposition).

  Collapsing them forces the reductionist into a dilemma: either adopt a "ceteris paribus" clause so vague it explains nothing, or adopt one so specific it becomes circular (by referencing the disposition's persistence). By keeping them distinct, we can tailor the reductive analysis: ruling out extrinsic interferers for masks, and demanding intrinsic stability for finks. To treat them as the same is to ignore the difference between a roadblock on a journey (mask) and the car vanishing mid-drive (fink). Both stop the journey, but only one implies the car never existed at the destination. That difference is the bedrock of a substantive metaphysics of dispositions.
