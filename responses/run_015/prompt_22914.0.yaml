answer: |-
  **Title:** Grounds Before Truths: A Verdict on the Molinist-Ockhamist Priority Dispute

  **Abstract:** *The debate over Counterfactuals of Creaturely Freedom (CCFs) is often presented as a stalemate between divine providence and metaphysical coherence. This essay argues that the stalemate is illusory. By distinguishing the verbal disagreements regarding truth-conditions from the substantive metaphysical commitments regarding grounding, I demonstrate that the Grounding Objection inflicts significantly more damage on Molinism than the Flicker Objection. I conclude that the Ockhamist priority thesis—that CCFs are grounded in the agent's powers and choices rather than ontologically prior to them—is the only metaphysically robust position. Furthermore, I identify where standard presentations of Middle Knowledge beg the question by smuggling in the Principle of Conditional Excluded Middle as a neutral logical tool.*

  ---

  ### I. Introduction: The Illusion of Stalemate

  In the literature on divine foreknowledge and human freedom, the Molinist-Ockhamist debate is frequently treated as a standoff. The Molinist insists that Counterfactuals of Creaturely Freedom (CCFs) must be ontologically prior to God's creative decree (*ante voluntatem Dei*) to preserve providential control without coercion. The Ockhamist (or Simple Foreknowledge theorist) counters that CCFs cannot be prior to the choices that ground them without rendering those choices unfree or the truths brute.

  For a third-year doctoral student, the frustration is understandable. The literature often circles the same drain: Molinists assert the logical possibility of Middle Knowledge; Ockhamists assert the metaphysical impossibility of ungrounded truths. Both sides accuse the other of changing the subject.

  This essay forces a verdict. The disagreement is not a pure stalemate. While there is a verbal component regarding the semantics of "truth," there is a hard substantive core regarding the metaphysics of contingency. When we weigh the two primary objections—the Flicker Objection and the Grounding Objection—it becomes clear that the Flicker Objection is a category error, while the Grounding Objection is a metaphysical killer. The Ockhamist is correct: CCFs cannot be ontologically prior to the grounds of their truth. Molinism requires a commitment to brute, ungrounded contingent facts that is philosophically untenable.

  ### II. The Verbal and the Substantive

  Your suspicion that the debate is "more verbal than substantive" is partially correct, but identifying the boundary is crucial.

  **The Verbal Disagreement:** The equivocation lies in the predicate "is true."
  *   **Molinists** operate with a **Platonist/Abstractist** semantics. A proposition is true if it corresponds to a state of affairs in a possible world, regardless of whether that world is actualized. For them, "truth" is a timeless logical relation.
  *   **Ockhamists** operate with an **Aristotelian/Actualist** semantics. A contingent proposition is true only if there is an actual ontological ground (a truthmaker) in the causal order that makes it so. For them, "truth" is a function of reality's structure.

  When a Molinist says, "It is true that Peter would deny Christ," they mean, "This proposition holds in the feasible world God selects." When an Ockhamist says, "It is not yet true," they mean, "There is no existing fact to ground this assertion."

  **The Substantive Core:** However, the debate is not *merely* verbal. Once we fix the semantics, a substantive metaphysical question remains: *Can there be contingent truths about free actions that lack a causal or ontological ground in the agent's nature or decision?*
  If the answer is "Yes" (Molinism), then reality contains brute conditional facts. If the answer is "No" (Ockhamism), then truth supervenes on being. This is not a linguistic dispute; it is a disagreement about the Principle of Sufficient Reason applied to modality. The Molinist must argue that God's knowledge rests on facts that are not grounded in God's will (or else freedom is determined by God) nor in the creature's actual choice (or else the knowledge is not *pre*-volitional). This leaves the CCFs floating metaphysically.

  ### III. Weighing the Objections: Flicker vs. Grounding

  To reach a verdict, we must weigh the damage done by the two standard objections.

  #### 1. The Flicker Objection (The Weaker Challenge)
  The Flicker Objection argues that if a CCF is true prior to creation, the agent lacks the power to do otherwise at the moment of decision. If it is true *before* I choose that I will choose A, how can I choose B?

  **Verdict:** This objection fails to land a killing blow because it conflates **logical priority** with **causal determinism**.
  The Molinist has a live, standard response here: The truth of the CCF is *conditional*, not coercive. The proposition "If S were in C, S would freely do A" does not cause S to do A. It merely reports what S *would* do. The necessity involved is a "necessity of the consequence," not a "necessity of the consequent."
  As long as the Molinist maintains that the CCF describes the *mode* of the action (freely) rather than determining the *event* of the action, the Flicker Objection can be deflected. It attacks the *experience* of freedom, but not the *metaphysics* of freedom. It is a psychological objection masquerading as a metaphysical one.

  #### 2. The Grounding Objection (The Decisive Challenge)
  The Grounding Objection (GO) argues that for a contingent proposition to be true, there must be a truthmaker. For CCFs, the truthmaker cannot be God (or freedom is lost) and cannot be the actual choice (or the knowledge is not middle/pre-volitional). Therefore, CCFs are ungrounded.

  **Verdict:** This objection does significantly more damage.
  Unlike the Flicker Objection, the GO attacks the *coherence* of Middle Knowledge itself. It is not asking, "Is this compatible with freedom?" It is asking, "Is this even intelligible as knowledge?"
  If CCFs are not grounded in the agent's actual choice (since the choice hasn't happened), they must be grounded in the agent's "freedom nature." But as Plantinga and others have noted, a "nature" only grounds *possibilities* (what S *can* do), not *conditionals* (what S *would* do). To move from "S can do A" to "S would do A" requires a fact about the specific exercise of that power. If that fact exists prior to the exercise, it is a brute fact.

  **Why GO Wins:** The Flicker Objection allows the Molinist to retreat to a distinction between truth and causation. The Grounding Objection offers no such retreat. It forces the Molinist to admit that there are true propositions about the world that are not grounded in *anything* in the world (not God, not the creature, not the relation between them). This violates a robust metaphysical intuition that truth supervenes on being. If the GO holds, Molinism doesn't just threaten freedom; it threatens the intelligibility of divine knowledge itself. God would be "guessing" correctly about brute facts, which is incompatible with omniscience defined as knowledge of all *knowable* truths.

  ### IV. The Molinist's Live Response and Its Failure

  Does the Molinist have a response to the Grounding Objection? The standard move is the **World-Indexed Properties** defense (often associated with Plantinga).
  *Argument:* The truthmaker for "If S were in C, S would do A" is the property *doing-A-in-C* instantiated by S in the possible world W. Since W is an object of God's intellect, the truth is grounded in the divine mind's comprehension of W.

  **Why this fails:** This response quietly assumes what it needs to prove. It assumes that the possible world W *already contains* the truth value of the CCF. But how does W contain that truth? Is it part of the definition of S? If so, S's actions are essential to S, which destroys freedom (S could not have been a creature who did otherwise). Is it a brute fact about W? If so, we are back to ungrounded truths.
  The Molinist response essentially says, "The truth is grounded in the possible world," but the Ockhamist reply is, "What grounds the truth *in* the possible world?" To say "It just is true in W" is to assert the Molinist position, not defend it against the grounding critique. It pushes the brute fact back one step (from the actual world to the possible world) but does not eliminate it.

  ### V. Where the Textbooks Beg the Question

  You mentioned suspecting the literature talks past itself. There is a specific locus where standard textbook presentations of Molinism quietly assume the conclusion. It occurs in the presentation of the **Logical Moments of Divine Knowledge**.

  Standard texts (e.g., Craig, Moreland) present the three moments as a neutral heuristic:
  1.  Natural Knowledge (Necessary truths)
  2.  Middle Knowledge (Contingent CCFs)
  3.  Free Knowledge (Actual decree)

  **The Begging of the Question:** This schema assumes the **Principle of Conditional Excluded Middle (PCEM)** applies to counterfactuals of freedom without argument. PCEM states that for any antecedent C, either "If C, then A" or "If C, then not-A" is true.
  *   **Molinists** assume PCEM is a law of logic. Therefore, there *must* be a truth value for every CCF prior to creation.
  *   **Ockhamists** (following Open Theists or even Aquinas in some readings) deny PCEM for contingent free actions. They argue that prior to the choice, the counterfactual is *indeterminate*.

  By presenting the "Three Moments" as a logical given, textbooks smuggle in PCEM. If PCEM is rejected for free actions, "Middle Knowledge" vanishes not because God's power is limited, but because there is *nothing there to know*. The textbook presentation treats the existence of CCFs as a premise of the debate, when it is actually the conclusion the Molinist is trying to prove. This is why the debate feels circular: The Molinist framework assumes the truth of CCFs to explain providence, while the Ockhamist challenges the truth of CCFs to explain grounding.

  ### VI. Final Verdict

  **On Priority:** The Ockhamist is correct. CCFs are ontologically posterior to the grounds of the agent's freedom. They are grounded in the agent's powers and the actual causal history that leads to the choice. To place them *ante voluntatem Dei* is to reify logical relations into metaphysical entities.

  **On the Objections:** The Grounding Objection is the superior critique. The Flicker Objection can be parried by distinguishing truth from causation. The Grounding Objection cannot be parried without accepting brute, ungrounded contingent facts, which is a high metaphysical price that renders divine knowledge opaque.

  **On the Debate Status:** The disagreement is 40% verbal (semantics of truth) and 60% substantive (metaphysics of contingency). The verbal aspect can be clarified by distinguishing Abstract Truth from Grounded Truth. The substantive aspect remains: Molinism requires a commitment to brute facts about freedom that Ockhamism rejects.

  **Recommendation for the Reading Group:** Stop arguing about whether God *can* know the future (both sides agree He can). Start arguing about the **Principle of Conditional Excluded Middle**. If the Molinist cannot defend PCEM for free actions without begging the question, the "Logical Moments" schema collapses, and the priority of CCFs falls with it. The Ockhamist priority thesis stands as the only view that preserves the supervenience of truth on being.
