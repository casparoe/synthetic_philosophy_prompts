      *   *Ockhamism (often associated with Simple Foreknowledge or Open Theism, but here specifically the "Grounding" critique):* Truths about free actions must be grounded in the actual occurrences of those actions (or the powers leading to them). If the choice hasn't happened (even counterfactually), there's nothing to make the CCF true. Ontological priority: Actual Choice/Powers > CCFs.
      *   *The "Verbal" Suspicion:* The user suspects they are talking past each other. This is a keen insight. Often, Molinists treat CCFs as abstract propositions with truth values independent of time, while Ockhamists treat truth as requiring a causal or ontological ground in the actual world order.

  3.  **Evaluate the Objections:**
      *   *The Grounding Objection (GO):* CCFs lack truthmakers. If $S$ never does $A$ in $C$, what makes "If $S$ were in $C$, $S$ would do $A$" true? Molinists say "the agent's freedom nature." Ockhamists say "that's not enough without the actualization."
      *   *The Flicker Objection (FO):* If CCFs are true prior to creation, then in the actual world, when $S$ is in $C$, $S$ *must* do $A$ to make the CCF true. Does this eliminate the power to do otherwise *in the moment*? Molinists say "No, it's conditional necessity." Ockhamists say "It renders the alternative inaccessible."
      *   *Comparison:* The GO attacks the *coherence* of the knowledge (can there be such knowledge?). The FO attacks the *compatibility* with freedom (does this knowledge kill freedom?).
