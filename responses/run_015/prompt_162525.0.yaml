  **Adversarial Collaboration Brief: The Epistemology of Bad Faith**

  **Role:** Political Epistemologist (Formerly affiliated with both camps)
  **Subject:** Divergence between 'Bad-Faith Realists' and 'Misperception Theorists' regarding out-partisan argumentation.

  ### 1. Agreed Claims
  *Both camps endorse the following propositions as non-controversial baseline facts about the current information ecosystem:*

  1.  Platform algorithms prioritise engagement over accuracy, systematically amplifying content that triggers outrage or tribal affirmation while suppressing nuanced, low-arousal truth-tracking.
  2.  Individuals routinely encounter their own cohort's arguments as lived, contextualised reasoning processes, whereas they encounter opposing cohorts primarily through decontextualised, curated excerpts designed to maximise perceived absurdity.
  3.  There exists a distinct psychological difference between holding a belief because one has weighed evidence for it, and holding a belief because maintaining it signals loyalty to one's social group; the latter often mimics the former in outward behaviour.
  4.  From an external vantage point, distinguishing between a sincerely held but poorly articulated view and a strategically adopted propaganda line is exceptionally difficult, often impossible, without access to the speaker's private deliberative history.
  5.  Echo chambers function not merely by filtering information in, but by actively discrediting external sources, thereby raising the epistemic cost for members to exit or even seriously consider outside arguments.
  6.  Political discourse frequently involves 'signalling' moves—statements intended to demonstrate group allegiance rather than to describe reality—and these moves are present in all large-scale political coalitions, not just the opponent's.
  7.  The norm of 'steelmanning' (reconstructing an opponent's argument in its strongest form) can inadvertently sanitise bad-faith strategic framing if the underlying intent was never truth-seeking to begin with.
  8.  Conversely, the default assumption of bad faith creates a self-fulfilling prophecy where opponents, sensing they are not being heard sincerely, retreat further into defensive, performative posturing.
  9.  The asymmetry of information flow means that most participants vastly overestimate the coherence and centralisation of the opposing camp's actual belief structure.
  10. Neither camp denies that *some* amount of genuine bad faith exists in political argumentation; the dispute is strictly regarding its prevalence and the appropriate default heuristic for detecting it.

  ### 2. Disagreements Table

  | Domain of Dispute | Bad-Faith Realist Formulation | Misperception Theorist Formulation |
  | :--- | :--- | :--- |
  | **Prevalence** | A significant, non-trivial proportion of out-partisan rhetoric is fundamentally strategic, aimed at status or disruption rather than truth, making suspicion a rational default. | The *perception* of widespread bad faith is an artefact of media exposure; actual dispositional bad faith is rare, and most apparent strategising is misinterpreted sincere reasoning. |
  | **Default Heuristic** | Treating every opponent as a sincere truth-seeker is an epistemic error that invites exploitation and rewards sophisticated propaganda with undue credibility. | Assuming good faith is the necessary corrective to structural distortion; without this charitable default, the possibility of genuine cross-partisan understanding is foreclosed. |
  | **Source of Error** | The primary epistemic failure lies in naivety: failing to recognise when an interlocutor is playing a game rather than solving a problem. | The primary epistemic failure lies in cynicism: projecting structural distortions onto individual psyches and mistaking medium-induced noise for signal. |
  | **Remedy** | We must develop sharper detection mechanisms to identify and isolate bad-faith actors, even if this risks occasional false positives. | We must repair the informational environment and suspend judgment on intent, even if this risks occasional exploitation by the truly malicious. |

  ### 3. Cruxes

  **I. The Medium Crux (Chaperone Protocol)**
  *Sub-question:* Is signalling behaviour intrinsic to specific ideological camps, or is it a universal reaction to unmoderated discourse?
  *Why it moves the needle:* If signalling is symmetric, the Realist's claim of unique out-group duplicity collapses. If asymmetric, the Misperception Theorist's structural excuse weakens.
  *Test Design:* A controlled debate where a neutral chaperone flags sentences functioning as status signals rather than claims, requiring immediate rephrasing as factual assertions.
  *Predictions:*
  *   **Realist:** Flags will cluster heavily on one side, revealing that one camp relies more fundamentally on performative nonsense that cannot be translated into claims.
  *   **Misperception Theorist:** Flags will be distributed symmetrically, but the *perception* of asymmetry will persist among observers until the chaperone intervenes, proving the bias is in the viewing, not the speaking.

  **II. The Detection Crux (Swap Forum)**
  *Sub-question:* Can partisans accurately distinguish between sincere and insincere defenders of their own ideology?
  *Why it moves the needle:* Tests the Realist's confidence in their ability to spot a 'fake' versus the Misperception Theorist's belief that sincerity is opaque.
  *Test Design:* Members of Camp A write and defend Camp B's strongest arguments before a Camp B audience. Some defenders are sincere converts; others are paid actors mimicking the view. The audience scores their ability to identify the actors.
  *Predictions:*
  *   **Realist:** The audience will successfully identify the actors at rates significantly above chance, proving that bad faith leaves detectable traces regardless of rhetorical skill.
  *   **Misperception Theorist:** The audience will perform at or near chance levels, demonstrating that even insiders cannot reliably distinguish sincerity from strategy, undermining the Realist's confidence in external detection.

  **III. The Error-Cost Crux**
  *Sub-question:* How do we weigh the cost of being exploited (false negative) against the cost of alienating a potential ally (false positive)?
  *Why it moves the needle:* Forces an explicit valuation of epistemic safety versus social cohesion.
  *Test Design:* A modelling exercise where both sides assign numerical weights to the damage caused by letting a bad-faith actor speak unchecked versus the damage caused by wrongly accusing a sincere actor of bad faith.
  *Predictions:*
  *   **Realist:** Will argue the cost of false negatives is catastrophic (systemic corruption), justifying a high rate of false positives. They will claim error costs are asymmetric because one side is actively weaponising the discourse.
  *   **Misperception Theorist:** Will argue the cost of false positives is catastrophic (total breakdown of dialogue), justifying tolerance of some bad faith. They will claim error costs are symmetric, as cynicism poisons the well for everyone equally.

  **IV. The Exit-Cost Crux**
  *Sub-question:* Is echo chamber membership a result of coercive social penalties or genuine preference?
  *Why it moves the needle:* If exit is impossible due to external threats, 'bad faith' may actually be 'survival strategy', changing the moral valence of the behaviour.
  *Test Design:* A longitudinal survey tracking individuals who attempt to publicly modify their views, measuring the severity of professional and social sanctions received from their original group versus the voluntary pull of the new group.
  *Predictions:*
  *   **Realist:** Will find that members stay primarily due to genuine ideological alignment and that exit penalties are exaggerated myths used to excuse intransigence.
  *   **Misperception Theorist:** Will find that exit costs (ostracisation, job loss) are prohibitively high, meaning apparent bad faith is often rational risk-aversion in a hostile environment.

  **V. The Translation Crux (New)**
  *Sub-question:* Does the content of an argument change fundamentally when stripped of its tribal signalling markers?
  *Why it moves the needle:* Determines if the 'core' of the disagreement is substantive or purely performative.
  *Test Design:* Take a set of highly charged political statements and remove all emotive language, identity markers, and rhetorical flourishes, leaving only the propositional content. Ask both camps if the remaining proposition is still objectionable.
  *Predictions:*
  *   **Realist:** Will argue that for the bad-faith side, the *signalling* is the entire point; once stripped, the argument vanishes or becomes trivial, proving there was no substantive claim to begin with.
  *   **Misperception Theorist:** Will argue that the substantive claim remains robust and disagreeable even after stripping, proving that the conflict is real and the accusation of 'mere signalling' is a deflection.

  ### 4. Verbal Disputes

  A significant portion of this quarrel is verbal, centred on the definition of 'bad faith'. The Realist often uses the term to describe *consequences*: if an argument functions to obstruct truth or signal status, it is treated as bad faith regardless of the speaker's internal state. The Misperception Theorist defines it *internally*: bad faith requires a conscious intent to deceive.

  If the Realist means "functionally obstructive behaviour" and the Misperception Theorist means "conscious lying", they may agree on the data (e.g., "Person X made a statement that halted progress") but disagree on the label. However, the **Error-Cost Crux** suggests this is not purely verbal; even if we agree on definitions, they fundamentally disagree on the risk tolerance for mislabelling. The **Medium Crux** also resists dissolution: if the chaperone experiment shows symmetric signalling, the Misperception Theorist wins on facts, not just semantics. Conversely, if the signalling is genuinely asymmetric in content (not just perception), the Realist wins on facts. Thus, while the *framing* is linguistic, the *predictions* are empirical.

  ***

  **Drafter's Note**

  I am moderately confident (perhaps 70%) that a real person in each camp would sign the **Agreed Claims** section as worded. The items are specific enough to avoid vacuity but broad enough to capture the shared misery of the current digital landscape without forcing a concession on the core dispute. Item 7 is the tightrope walk there; Realists love it, but Misperception Theorists might fear it concedes too much ground to cynicism, though the qualifier 'can inadvertently' should save it.

  The single line I would bet least on is in the **Disagreements Table**, under the Realist's 'Default Heuristic': *"Treating every opponent as a sincere truth-seeker is an epistemic error..."* Some softer Realists might prefer 'often an error' rather than the categorical 'is', fearing that absolute language makes them sound like conspiracy theorists. They might worry that signing this gives ammunition to those who claim they never listen to anyone.

  If I had both parties in a room, I would change the format of the **Cruxes**. Written predictions are safe; live betting is not. I would force them to put actual foundation money (or reputation points) on the outcomes of the proposed tests before we run them. Theoretical disagreement is cheap; skin in the game clarifies whether someone truly believes their model of the world or is just enjoying the aesthetic of their own cynicism. The 'Translation Crux' specifically needs this pressure, as it is the most likely to reveal that one side is fighting a ghost while the other is fighting a tank.
