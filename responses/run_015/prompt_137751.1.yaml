  **The Scenario**

  The Lower Basin Authority must select a water security strategy for the coming decade. Option A (Infrastructure Lock) constructs a permanent concrete dam across the Canyon, guaranteeing supply but carrying a 10% risk (confidence interval 7–13%) of triggering irreversible downstream sediment starvation that permanently displaces 5,000 fishing households. Option B (Modular Conservation) implements a distributed network of retention tanks and efficiency mandates, carrying a 10% risk (confidence interval 7–13%) of insufficient capacity causing irreversible industrial exodus that permanently displaces 5,000 manufacturing households. The uncertainty in both cases stems from identical hydrological model variances; the harm currency is permanent household displacement; the magnitude and probability bands are equal. Physically, the Canyon Dam occupies the only viable site, precluding any future modification or removal, whereas the Conservation network is modular and does not preclude constructing the Dam later if capacity fails.

  **The Derivation**

  1.  **Application to Arm A (Dam):** The course of action (Build Dam) carries a risk of serious/irreversible harm (5,000 households displaced). There is absence of full scientific certainty (7–13% interval). Therefore, under the principle, this uncertainty is not a sufficient reason for declining measures against that harm (i.e., not building). To build is to decline the measure against sediment harm.
  2.  **Application to Arm B (Conservation):** The course of action (Implement Conservation) carries a risk of serious/irreversible harm (5,000 households displaced). There is absence of full scientific certainty (7–13% interval). Therefore, under the principle, this uncertainty is not a sufficient reason for declining measures against that harm (i.e., building the Dam). To conserve is to decline the measure against exodus harm.
  3.  **The Paralysis:** Applied symmetrically, the principle forbids building (risks sediment harm despite uncertainty) and forbids conserving (risks exodus harm despite uncertainty). The agency cannot act without violating the injunction against using uncertainty to decline a protective measure.
  4.  **The Dissolving Feature:** **Physical Preclusion of Future Measures.** Option A (Dam) physically eliminates the ability to implement the measure against sediment harm (removal/modification) once initiated; the exposure becomes locked. Option B (Conservation) preserves the ability to implement the measure against exodus harm (building the Dam) at a later date if the risk materializes.
  5.  **The Verdict:** The principle requires Option B. Choosing Option A forces the agency to decline the measure against sediment harm *permanently*, relying on the hope that the uncertain risk does not materialize. Choosing Option B allows the agency to maintain the measure against sediment harm (by not building yet) while retaining the capacity to enact the measure against exodus harm (by building later) if uncertainty resolves toward failure. Option B is the only arm that remains compliant with the principle for *both* risks simultaneously.

  **The Numbers**

  *   **Probability:** Arm A = 10% (CI 7–13%). Arm B = 10% (CI 7–13%). (Satisfies Constraint 3 & 4: same band, same width).
  *   **Harm Magnitude:** Arm A = 5,000 households permanently displaced. Arm B = 5,000 households permanently displaced. (Satisfies Constraint 4: single currency).
  *   **Uncertainty Type:** Hydrological model variance. (Satisfies Constraint 3: same kind).

  **The Removal Test**

  If the Conservation network (Option B) required large surface retention ponds that flooded the Canyon site, thereby physically precluding future Dam construction, the asymmetry vanishes. Both options would then lock in their respective risks irreversibly. The paralysis would return: the principle would forbid both, yielding no determinate verdict. This confirms that the **Physical Preclusion** feature is load-bearing; without the structural reversibility of Option B, the principle offers no guidance beyond the initial trigger.

  **The Hostile Reading**

  A critic holding that the precautionary principle is either idle or paralytic would characterize this case as **Real Options Analysis in disguise**. They would argue that the verdict does not come from the precautionary principle itself, but from an implicit valuation of flexibility: you have simply assigned a higher utility to the option that preserves future choice. They would claim that ordinary expected-utility calculation, properly accounting for the value of information and reversibility, would yield the same verdict without needing a separate principle.

  **Response to Charge:** The case answers this charge only partially. It admits that the *mechanism* of resolution is structural reversibility (which EU can value). However, it establishes that the precautionary principle imposes a **normative constraint** on that valuation which EU lacks. In expected-utility analysis, flexibility is traded off against cost; if the Dam were significantly cheaper, EU might recommend locking in the risk. The precautionary principle, as applied here, makes the preservation of the measure against irreversible harm **mandatory** under uncertainty, regardless of cost efficiency. It outlaws the trade-off that EU permits. Thus, the principle has content distinct from EU: it converts option value from a variable to be weighed into a constraint to be satisfied.

  **Specification Check**

  The specification is met. The formulation is used exactly. The paralysis is genuine (both arms trigger the clause). The resolution relies on a structural fact (physical preclusion), not a framing distinction or bare appeal to learning. Framing invariance holds: whether Conservation is described as "Policy B" or "Omission to Build," the physical preclusion remains the same, and the verdict is stable. I report plainly that the reversibility feature carries the entire argument (Constraint 6).
