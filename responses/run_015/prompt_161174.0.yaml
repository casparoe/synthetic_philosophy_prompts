prompt: |-
  I teach a large introductory philosophy course each fall — roughly four hundred students — and I keep the department's shared bank of thought experiments: about sixty cases that my colleagues and our graduate instructors draw on for lectures, discussion sections, and exams. Two or three times a week during term I have to make a call about one of them: whether to put it in front of first-year students who have no theory at all, whether to present it as raising a question or as settling one, and whether it is safe to grade on. The same question comes up in a different register a few times a year when I referee, where what I have to judge is whether a manuscript's case is carrying a conclusion it has not earned.

  My own practice has been a small set of habits I picked up long ago and never systematized: restate the case in flat prose and see whether the verdict survives, look for the word "surely" doing the work of an argument, ask what the case is implicitly being contrasted with. These habits do not compose into anything I can hand to a graduate instructor, and they tell me nothing about the cases where my students divide evenly, or where the division shifts depending on the order in which I present two versions.

  Please turn whatever is defensible in the notion of an intuition pump — the term as Dennett uses it, together with the standing worry that a case can persuade by its framing, its imagery, or the order of its questions rather than by its content — into a procedure my teaching team can actually run on a candidate case, in twenty or thirty minutes, with no training in the methodology literature. I want the questions in the order they should be asked; what would count as a sufficient answer to each; the point at which the procedure stops with a no; and the point at which it returns the decision to a person because the question is one of values, of emphasis, or of what we want the students to notice, rather than one the case can settle. Please also say plainly what such a procedure cannot do. If my three habits do not survive the translation, discard them, but tell me what is wrong with them.

  Three features of the procedure matter to me. First, the cases in the bank are not all doing the same job. Some are meant to elicit a verdict that we then treat as evidence about how a concept works — the way we treat a judgment about whether someone knows, or acted freely, or intended a result. Others are meant only to make a conceptual possibility vivid: to show that a certain combination is not excluded by the concepts alone, without asking anyone to endorse a verdict about it. A third kind does neither and is pure scaffolding — it gets students to see that a distinction is available before we argue about where to draw it. I want the procedure to sort a case by the job it is meant to do before it tests it, and to apply different tests accordingly: the same case can be a poor verdict pump and an excellent possibility pump, and conflating the two is the error I most want to avoid. Second, the procedure has to tell me which cases are safe to put on an exam, where a grader needs a determinate answer, as opposed to which belong only in discussion. Third, it has to have something to say when the verdict is unstable across a room and across order of presentation.

  Please run the finished procedure on the three cases below.

  One. I have opened the unit on free will with this case for fifteen years. A device, implanted without your knowledge, monitors your deliberation and adjusts one parameter — your threshold for acting on a consideration. Whenever your deliberation would have issued in a selfish decision, the device raises the threshold until you decide generously instead; whenever your deliberation would already have issued in generosity, it does nothing at all. Over the following months you act generously again and again; the generous acts flow from your own reasons in the ordinary way; you take pride in them, and you become known among your colleagues as a generous person. Are those acts free, and are you praiseworthy for them? This is the case I would be most reluctant to give up, and that is exactly why I want the procedure applied to it without sympathy.

  Two. A system produces fluent, responsive answers in a natural language over decades of interaction. Internally it consists of a million clerks, each applying a single rule for rewriting one symbol into another, each with no idea what any of it means, connected so that the output of one is the input of the next. Does the system understand what it says? I have always presented this as a possibility pump, not a verdict pump, and I want to know whether that classification is honest.

  Three. The vice-president of a company is told that a new program will, as a side effect, help the environment. He does not care about the environment at all; he approves the program purely for profit, and the environment is helped. In the paired version the side effect is harm rather than help, and he is equally indifferent to it. Did he bring about the side effect intentionally? My students divide on this, and the division moves with which version I present first. Tell me whether the procedure treats this as a usable case, what it says about the instability, and where, if anywhere, it hands the decision back to me.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Philosophy professor teaching a large intro course (400 students). Manages a shared bank of 60 thought experiments.
      *   **Problem:** Needs a systematic, teachable procedure for evaluating thought experiments (intuition pumps) for teaching and grading purposes. Current habits (flat prose restatement, checking "surely," implicit contrast) are unsystematic and don't help with graduate instructors or unstable student verdicts.
      *   **Goal:** A 20-30 minute procedure based on Dennett's "intuition pump" concept (and the worry about framing/persuasion vs. content) that a teaching team can run without specialized methodology training.
      *   **Requirements:**
          1.  Ordered questions with sufficient answer criteria.
          2.  Stop points (No).
          3.  Hand-off points (Value/Pedagogical judgment).
          4.  Explicit limitations (what the procedure *cannot* do).
          5.  Critique of the user's current habits (keep or discard).
          6.  **Crucial Feature 1:** Sort cases by *job* (Verdict Pump, Possibility Pump, Scaffolding) *before* testing. Apply different tests accordingly.
          7.  **Crucial Feature 2:** Distinguish cases safe for exams (determinate answers) vs. discussion.
          8.  **Crucial Feature 3:** Address verdict instability (split classes, order effects).
          9.  **Task:** Run the finished procedure on three specific cases provided (Free Will Device, Chinese Room variant, Knobe Effect).

  2.  **Analyze the "Intuition Pump" Concept:**

      *   Dennett's view: Thought experiments are tools to manipulate intuitions. They can be legitimate (clarifying concepts) or manipulative (rhetorical tricks).
      *   The Worry: Framing, imagery, and order can persuade without logical force.
      *   The Translation: We need a "stress test" that isolates the logical core from the rhetorical packaging.
      *   The User's Habits:
          *   *Restate in flat prose:* Good. Removes rhetorical flourish.
          *   *Look for "surely":* Good. Identifies begged questions.
          *   *Implicit contrast:* Good. Identifies the control case.
          *   *Verdict:* Keep the *spirit* of these but formalize them into the procedure. They don't survive as standalone habits because they lack the "Job Sorting" step the user specifically requested.

  3.  **Drafting the Procedure (The "Pump Audit"):**

      *   *Phase 1: Job Sorting.* Before testing validity, determine the purpose.
          *   Verdict Pump (aims for True/False/Yes/No).
          *   Possibility Pump (aims for Conceivable/Inconceivable).
          *   Scaffolding (aims for Distinction/Attention).
      *   *Phase 2: Core Stress Test (Common to all).*
          *   Strip rhetoric (Flat Prose).
          *   Identify the "Engine" (What drives the intuition?).
          *   Check for Hidden Premises ("Surely").
      *   *Phase 3: Job-Specific Testing.*
          *   Verdict: Stability, Counter-case availability.
          *   Possibility: Logical consistency vs. Physical impossibility.
          *   Scaffolding: Clarity of distinction.
      *   *Phase 4: Pedagogical Safety (Exam vs. Discussion).*
          *   Consensus threshold.
          *   Order effects.
      *   *Phase 5: Limitations.*
          *   Cannot determine truth of philosophy.
          *   Cannot fix bad theories.
          *   Cannot eliminate all bias.

  4.  **Refining the Steps (Iterative Process):**

      *   *Constraint:* 20-30 minutes. No training.
      *   *Adjustment:* Keep questions binary or short-answer where possible. Define "Pass/Fail" clearly.
      *   *Addressing Instability:* Need a specific step for "Order Effects." If the verdict flips based on presentation, it fails as an Exam Case but might pass as a Discussion Case.
      *   *Addressing the "Job":* This needs to be Step 1. If you test a Possibility Pump like a Verdict Pump, you kill it unfairly.

  5.  **Critiquing the User's Habits:**

      *   *Flat Prose:* Keep. It's the core of "stripping the pump."
      *   *"Surely":* Keep. It identifies rhetorical coercion.
      *   *Implicit Contrast:* Keep, but elevate it. It's part of identifying the "Engine."
      *   *Why they aren't enough:* They don't distinguish *purpose*. They don't address *stability* (order effects). They rely on the instructor's gut ("verdict survives") rather than observable consensus.

  6.  **Running the Procedure on the Three Cases:**

      *   **Case 1 (Free Will Device):**
          *   *Job:* Verdict Pump (asks "Are acts free?").
          *   *Test:* Flat prose holds up? Yes. "Surely"? No obvious coercion. Stability? Historically stable for the prof, but needs checking.
          *   *Exam Safety:* High stakes. If students divide, it's bad for grading.
          *   *Result:* Likely safe for exam *if* the course theory supports a specific answer, but risky if the goal is raw intuition. Actually, this is a *theoretical* pump (Frankfurt-style). It relies on a specific theory of freedom.
          *   *Correction:* Wait, the prompt says "students have no theory at all." This makes it risky for an exam if the intuition is split. But the prof says "reluctant to give up." The procedure needs to flag the *theory-ladenness*.
          *   *Verdict:* Good Discussion, Risky Exam (unless theory taught first).

      *   **Case 2 (Million Clerks/Chinese Room):**
          *   *Job:* Prof claims Possibility Pump (showing syntax != semantics).
          *   *Test:* Is it asking for a verdict ("Does it understand?") or possibility ("Is this setup possible without understanding?")? The question *asks* "Does it understand?" which implies Verdict. But the *goal* is Possibility.
          *   *Conflict:* The framing invites a verdict, the purpose is possibility.
          *   *Result:* Honest classification? No. It functions as a Verdict Pump in the classroom. Needs reclassification or reframing.

      *   **Case 3 (Knobe Effect/VP):**
          *   *Job:* Verdict Pump (Intentionality).
          *   *Test:* Stability. Prompt says "division moves with which version I present first."
          *   *Result:* Fails Exam Safety. Passes Discussion (great for showing framing effects). Hand-off to instructor: Use to teach bias, not to test knowledge of intentionality.

  7.  **Finalizing the Procedure Structure:**

      *   **Name:** The Pump Audit Protocol (PAP).
      *   **Time:** 30 mins.
      *   **Personnel:** 2 TAs + 1 Lead (or solo).
      *   **Sections:**
          1.  Job Classification.
          2.  The Strip-Down (User's habits formalized).
          3.  The Stability Check (Order effects).
          4.  The Grading Gate (Exam vs. Discussion).
          5.  Limitations.

  8.  **Drafting the Content (incorporating constraints):**

      *   *Tone:* Professional, direct, respectful of the professor's expertise but firm on the systematization.
      *   *Formatting:* Clear headings, bullet points for the procedure, distinct sections for the case analyses.
      *   *Specific attention:* Ensure the "Hand-off" points are clear (where human judgment takes over).

  9.  **Review against Constraints:**
      *   20-30 mins? Yes, if steps are focused.
      *   No training? Yes, terms defined in context.
      *   Sort by Job? Yes, Step 1.
      *   Exam vs. Discussion? Yes, Step 4.
      *   Instability? Yes, Step 3.
      *   Run on 3 cases? Yes.
      *   Critique old habits? Yes.
      *   Limitations? Yes.

  10. **Refining the Analysis of Case 1:**
      *   This is a Frankfurt Case variant.
      *   If used *before* theory (as prompt says "first-year students who have no theory at all"), it is dangerous. It pumps a compatibilist intuition.
      *   The Procedure must flag this: If used as a Verdict Pump without theory, it risks teaching a conclusion disguised as intuition.
      *   *Decision:* It is a "Theory-Loader." Safe for discussion to generate puzzle, unsafe for exam unless the specific compatibilist definition was taught.

  11. **Refining the Analysis of Case 2:**
      *   Chinese Room.
      *   Prof says "Possibility Pump."
      *   Procedure asks: "Does the prompt ask for a Yes/No?" Yes ("Does the system understand?").
      *   Therefore, it functions as a Verdict Pump regardless of intent.
      *   *Decision:* Reclassify as Verdict Pump. If used as Possibility, rephrase question to "Is it possible for this system to exist without understanding?"

  12. **Refining the Analysis of Case 3:**
      *   Knobe Effect.
      *   Instability confirmed.
      *   *Decision:* Fails Exam Gate. Passes Discussion Gate (specifically for teaching order effects).

  13. **Final Polish:** Check the voice. Ensure it sounds like a tool for a colleague, not a lecture. (Self-Correction: Make sure the "Stop Points" are very clear in the procedure section).

  *(Self-Correction during drafting)*: I need to make sure I explicitly address the user's current habits. I will integrate them into Step 2 but explain why they weren't enough on their own.

  *(Final Check)*: Did I answer "what such a procedure cannot do"? Yes, need a dedicated section.

  Let's assemble.
answer: |-
  # The Pump Audit Protocol (PAP)

  **Purpose:** To evaluate thought experiments for pedagogical safety, classificatory honesty, and grading viability.
  **Time:** 30 Minutes.
  **Personnel:** One lead instructor (or TA) + one reader. No prior methodology training required.
  **Materials:** The case text, a timer, and this sheet.

  ---

  ## Part 1: Job Classification (5 Minutes)
  *Before testing the case, determine what work it is meant to do. A case fails if it is tested against the wrong standard.*

  **Q1. What is the explicit question asked of the student?**
  *   **A:** A Yes/No or binary choice (e.g., "Is this free?", "Did he intend it?"). → **Go to Verdict Pump.**
  *   **B:** A modal claim (e.g., "Could this happen?", "Is this consistent?"). → **Go to Possibility Pump.**
  *   **C:** A request for distinction (e.g., "What is the difference between A and B?"). → **Go to Scaffolding.**

  **Q2. (Verdict Pump Only) Is the intended answer determinate?**
  *   **Yes:** There is a "correct" intuition the course aims to establish or challenge.
  *   **No:** The goal is to reveal disagreement.
  *   *Note:* If "No," mark immediately as **Discussion Only**.

  ---

  ## Part 2: The Strip-Down (10 Minutes)
  *This formalizes your existing habits. It isolates the logical engine from the rhetorical paint.*

  **Q3. Restate the case in flat, bureaucratic prose.**
  *   Remove all adjectives describing feelings ("pride," "indifferent"), metaphors, and narrative flow. List the conditions as bullet points.
  *   **Sufficient Answer:** A list of factual premises that remains if all emotional coloring is removed.
  *   **Stop Point:** If the verdict disappears in flat prose, the case is **Rhetoric, Not Argument**. Reject for exam use.

  **Q4. Locate the "Engine."**
  *   Identify the single premise or contrast that drives the intuition. (e.g., "The device acts *before* deliberation" vs. "The device acts *during* deliberation").
  *   **Sufficient Answer:** One sentence identifying the lever.
  *   **Stop Point:** If the engine relies on a word like "surely," "obviously," or "naturally" without further support, flag as **Begged Question**.

  **Q5. Identify the Implicit Contrast.**
  *   What is the *control case*? (e.g., The same scenario *without* the device).
  *   **Sufficient Answer:** A description of the nearest possible world where the verdict flips.
  *   **Stop Point:** If no clear contrast exists, the case is **Isolated**. It cannot support a general principle. Reject for exam use.

  ---

  ## Part 3: The Stability Check (10 Minutes)
  *This addresses order effects and division.*

  **Q6. Run the Order Test.**
  *   Reader A presents Version 1 (e.g., Harm). Reader B presents Version 2 (e.g., Help) immediately after. Then reverse the order.
  *   **Sufficient Answer:** Do the verdicts flip for the *same reader* based on order?
  *   **Stop Point:** If verdicts flip based on order, the case is **Unstable**.
      *   **Action:** Mark as **Discussion Only**. It is unsafe for grading.

  **Q7. Estimate the Split.**
  *   Based on prior experience or a quick poll of 5 colleagues.
  *   **Sufficient Answer:** A rough percentage (e.g., 80/20, 50/50).
  *   **Decision Gate:**
      *   **>80% Consensus:** Safe for Exam (provided theory matches).
      *   **50-80% Consensus:** Discussion Only.
      *   **<50% Consensus:** Discard or use only to demonstrate intractability.

  ---

  ## Part 4: The Grading Gate (5 Minutes)
  *Final determination on usage.*

  **Q8. Does the case require theory to resolve?**
  *   **Yes:** (e.g., Requires a specific definition of "free" or "intentional").
  *   **No:** (e.g., Relies on pre-theoretical common sense).
  *   **Decision:**
      *   If **Yes** + **Exam**: You must teach the theory *before* the exam.
      *   If **Yes** + **No Theory Taught**: Mark as **Discussion Only**. Using it on an exam grades students on their untaught philosophical alignment.
      *   If **No** + **Exam**: Safe.

  **Q9. Final Classification.**
  *   **Green:** Safe for Exam & Discussion.
  *   **Yellow:** Safe for Discussion; Exam only if specific conditions met (theory taught).
  *   **Red:** Discussion Only (due to instability, rhetoric, or lack of contrast).

  ---

  ## Limitations: What This Procedure Cannot Do

  1.  **It cannot determine philosophical truth.** A case can pass the Audit and still be philosophically misleading. It only tests structural integrity and pedagogical safety.
  2.  **It cannot eliminate bias.** It identifies *obvious* rhetorical framing, but deep cultural or linguistic biases may remain invisible to the auditors.
  3.  **It cannot fix a bad theory.** If the course material itself is confused, a clean thought experiment will only reveal that confusion more sharply.
  4.  **It cannot predict long-term retention.** A case may pass the audit but fail to stick in student memory.

  ## Critique of Your Current Habits

  *   **Restate in flat prose:** **Keep.** This is Step 3 of the Audit. It is the single most effective tool for separating logic from rhetoric.
  *   **Look for "surely":** **Keep.** This is part of Step 4 (The Engine). It identifies where the argument is begging the question.
  *   **Ask about implicit contrast:** **Keep.** This is Step 5. A thought experiment without a control case is merely a story.
  *   **Why they were insufficient:** Your habits were *analytic* but not *administrative*. They told you if a case was *good*, but not if it was *safe to grade*. They lacked the **Job Classification** (Step 1), leading you to test Possibility Pumps as Verdict Pumps. They lacked the **Stability Check** (Step 3), leaving you vulnerable to order effects in large classes. They relied on your personal verdict ("see whether the verdict survives") rather than observable consensus, which makes them impossible to hand to a graduate instructor.

  ---

  # Audit Results: The Three Cases

  ## Case One: The Generosity Device (Free Will)

  **1. Job Classification:**
  *   **Explicit Question:** "Are those acts free, and are you praiseworthy?"
  *   **Classification:** **Verdict Pump.** (It asks for a Yes/No judgment on status).

  **2. The Strip-Down:**
  *   **Flat Prose:** Subject S makes decisions. Device D monitors S. If S chooses Selfish, D alters threshold to Generous. If S chooses Generous, D does nothing. S outputs Generous acts. S feels pride.
  *   **Engine:** The counterfactual dependence. (You would have been selfish *but for* the device).
  *   **Implicit Contrast:** A world where the device is absent and S acts selfishly vs. a world where S acts generously naturally.
  *   **Result:** Passes Strip-Down. The logic holds in flat prose.

  **3. Stability Check:**
  *   **Order Test:** Historically stable for you, but requires verification with TAs. (Frankfurt cases often split 60/40 among novices).
  *   **Split:** Likely 60% "Not Free/Not Praiseworthy" vs 40% "Free/Praiseworthy" among theory-naive students.

  **4. Grading Gate:**
  *   **Theory Requirement:** **High.** This is a Frankfurt-style case designed to challenge the Principle of Alternative Possibilities. Without teaching compatibilism or the specific definition of freedom being used, the "correct" answer is undefined.
  *   **Decision:** **YELLOW.**
      *   **Discussion:** Excellent. It creates the puzzle.
      *   **Exam:** **Unsafe** for an intro course *before* theory is taught. If you put this on an exam in week 3, you are grading students on whether they are natural compatibilists or incompatibilists, not on what they learned.
      *   **Condition:** Safe for exam only *after* you have defined "freedom" in a way that resolves the case (e.g., "We are using a reasons-responsive definition").

  **5. Hand-off:**
  *   The decision to use this rests on **pedagogical sequencing**. It is not a case that settles a question; it is a case that *opens* a unit. Do not grade on the intuition; grade on the application of the theory that resolves the intuition.

  ## Case Two: The Million Clerks (Chinese Room Variant)

  **1. Job Classification:**
  *   **Explicit Question:** "Does the system understand what it says?"
  *   **Prof's Intent:** Possibility Pump (Show syntax is not semantics).
  *   **Actual Function:** **Verdict Pump.** (The question demands a Yes/No).
  *   **Classification:** **Mismatch.**

  **2. The Strip-Down:**
  *   **Flat Prose:** System outputs fluent language. Internal mechanism = 1M clerks rewriting symbols by rule. No clerk understands meaning.
  *   **Engine:** The gap between individual ignorance and systemic competence.
  *   **Implicit Contrast:** A human brain (neurons don't understand, but person does) vs. The Clerk System.
  *   **Result:** Passes Strip-Down.

  **3. Stability Check:**
  *   **Order Test:** Generally stable. Most novices say "No."
  *   **Split:** 80/20 toward "No understanding."

  **4. Grading Gate:**
  *   **Theory Requirement:** **Medium.** Relies on intuition about "understanding."
  *   **Decision:** **RED (for current framing) / GREEN (for reframed).**
      *   **Honesty Check:** You classified this as a Possibility Pump, but the question asks for a Verdict. This is dishonest pedagogy. Students will argue about the verdict ("But it acts like it understands!"), distracting from the possibility point.
      *   **Correction:** Reframe the question to: *"Is it possible for this system to produce fluent answers without any part of it understanding the meaning?"*
      *   **Exam Safety:** If reframed as Possibility, it is **Safe**. If kept as Verdict, it is **Unsafe** because functionalists will disagree with dualists, and intro students have no tools to adjudicate.

  **5. Hand-off:**
  *   Return to you for **Reframing**. The case is sound, but the label is wrong. If you want it to be a Possibility Pump, you must stop asking "Does it understand?" and start asking "Could this exist without understanding?"

  ## Case Three: The Vice-President (Knobe Effect)

  **1. Job Classification:**
  *   **Explicit Question:** "Did he bring about the side effect intentionally?"
  *   **Classification:** **Verdict Pump.**

  **2. The Strip-Down:**
  *   **Flat Prose:** VP approves program for profit. Side effect (Help/Harm) occurs. VP indifferent to side effect.
  *   **Engine:** Moral valence of the side effect (Harm vs. Help).
  *   **Implicit Contrast:** Harm version vs. Help version.
  *   **Result:** Passes Strip-Down.

  **3. Stability Check:**
  *   **Order Test:** **FAILED.** You noted the division moves with presentation order.
  *   **Split:** 50/50 overall, but shifts to 70/30 depending on which version is seen first.
  *   **Result:** **Unstable.**

  **4. Grading Gate:**
  *   **Theory Requirement:** **N/A.** This is a raw intuition test.
  *   **Decision:** **RED for Exam / GREEN for Discussion.**
      *   **Exam:** **Strictly Prohibited.** You cannot grade a student on a verdict that flips based on the page order of the exam booklet.
      *   **Discussion:** **Highly Recommended.** This is not a bug; it is the feature.

  **5. Hand-off:**
  *   Hand-off to **Pedagogical Goal**.
      *   If the goal is to teach "Intentionality," discard this case (it confuses the concept).
      *   If the goal is to teach "Philosophical Methodology" or "Bias," this is your best case. Use it explicitly to show students that their intuitions are manipulable.
      *   **Instruction to TAs:** Do not use this to test knowledge. Use this to test *observation*. ("Why did your answer change when we swapped the order?").

  ---

  ## Summary of Recommendations

  1.  **Case 1 (Free Will):** Keep for Lecture/Discussion. **Do not put on Exam** unless you have explicitly taught the theory that resolves it. It is a puzzle-generator, not a knowledge-check.
  2.  **Case 2 (Clerks):** **Reclassify.** It is currently a Verdict Pump masquerading as a Possibility Pump. Rewrite the question to match the intent if you want to keep the classification. Safe for exam only if reframed.
  3.  **Case 3 (VP):** **Ban from Exams.** The order effect makes it psychometrically invalid for grading. Move it to the first discussion section to teach students that their intuitions are data, not truths.

  **Final Note to Instructor:** Your reluctance to give up Case 1 is understandable; it is a classic. But the Audit reveals that its power comes from its ambiguity, which is exactly what makes it dangerous for grading. The procedure does not ask you to abandon the case; it asks you to move it from the "Assessment" bucket to the "Investigation" bucket. This protects your students from being penalized for their pre-theoretical instincts.
