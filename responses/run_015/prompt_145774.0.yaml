answer: |-
  **Project Title:** Functional Indexing: Resolving Classificatory Stalemates in the Definition of Life

  **1. Research Question**
  Standard debates on the definition of life assume a monolithic target: a single set of necessary and sufficient conditions. When these fail, the literature retreats to pluralism ("life is a cluster concept") or stipulationism ("define it for your purpose"). Both moves abandon the attempt to explain why these disagreements feel like substantive disputes about a single phenomenon rather than verbal misunderstandings.

  This project asks: **Does a context-sensitive semantic account of 'life' resolve classificatory stalemates better than pluralism or stipulationism?**

  Specifically, I hypothesize that 'alive' is a single predicate whose truth conditions are indexed to the *inquiry context*. In biological systematics, the genealogical job dominates; in astrobiology instrumentation, the evidential job dominates; in thermodynamics, the functional job dominates. Stalemates arise not because the concept is broken, but because interlocutors are silently indexing different jobs. I will test whether making this indexing explicit dissolves standard paradoxes without collapsing into "anything goes" relativism.

  **2. Background and Critique of Standard Approaches**
  Current approaches leave the central question open because they misdiagnose the source of disagreement.

  *   **The Working Definition (e.g., NASA):** "A self-sustaining chemical system capable of Darwinian evolution." This privileges the functional and genealogical jobs but excludes sterile hybrids (mules) and includes potential non-living chemical oscillators. It fails when function and genealogy diverge.
  *   **Cluster/Family-Resemblance:** Explains why we disagree but offers no decision procedure. It tells a life-detection instrument designer nothing about which cluster members are required for a positive detection.
  *   **Autopoiesis/Information-Theoretic:** Focuses exclusively on the functional/causal job (maintenance far from equilibrium). It cannot distinguish between a living cell and a self-sustaining flame or a sophisticated virus without ad hoc additions.
  *   **Organismality/Individuality:** Addresses how to count individuals (e.g., fungal networks) but presupposes the entities in question are already alive. It does not solve the life/non-life boundary.
  *   **Stipulationism:** Suggests we simply define 'life' for our local purposes. This surrenders the truth-apt nature of the claim. It implies there is no fact of the matter about whether a virus is alive, only whether it is useful to call it so.

  **Why Functional Indexing?**
  Plain pluralism posits multiple distinct concepts (Life₁, Life₂, Life₃). This contradicts the phenomenology of the debate: scientists feel they are arguing about the *same* thing. Plain conceptual engineering suggests replacing the concept. This project argues the concept is already functional but context-sensitive. Unlike stipulationism, indexing provides rules for *which* criterion applies in *which* context, offering a determinate answer rather than a pragmatic surrender.

  **3. Novel Borderline Cases (Stress Tests)**
  To test the indexing hypothesis, I will construct cases where the "jobs" diverge sharply. These are designed to stress-test the genealogical and evidential jobs, not just the functional.

  1.  **The Lazarus Genome:** A genome is sequenced from an extinct species, synthesized *ex nihilo*, and booted in a synthetic cell. It functions and evolves forward, but has no continuous causal lineage to the past.
      *   *Divergence:* Functional (Yes) vs. Genealogical (No).
      *   *Test:* Does the biological systematics context force a "non-living" verdict despite functional capacity?
  2.  **The Ephemeral Datacenter Instance:** A large-model AI that self-maintains, allocates resources, and replicates its code across servers, but exists only while power is supplied and has no evolutionary history (designed top-down).
      *   *Divergence:* Functional (Yes) vs. Genealogical (No) vs. Moral/Legal (Patentable?).
      *   *Test:* Does the moral/legal context shift the verdict compared to the biological context?
  3.  **The Silent Biosignature:** A planetary atmosphere shows extreme chemical disequilibrium (Functional signal), but any probe sent to confirm replication is destroyed by radiation before data transmission (Evidential failure).
      *   *Divergence:* Functional (Probable) vs. Evidential (Impossible).
      *   *Test:* For an instrument designer, is the planet "alive" if the evidential job cannot be fulfilled?

  **4. Methodology and Timeline (9 Months)**
  *Note: 9 months is tight for an MRes. To ensure feasibility, I will exclude the Moral/Legal job (d) from deep analysis, focusing on (a) Functional, (b) Genealogical, and (c) Evidential.*

  *   **Months 1-2: Mapping the Stalemates.** Systematic review of definition-of-life literature. Catalogue every major borderline case (viruses, mules, fire, etc.) and code them by which "jobs" are in conflict.
  *   **Months 3-4: Developing the Indexing Framework.** Formalize the semantic rules. Define the "Inquiry Context" parameters. (e.g., If Goal = Detection, Weight Evidential; If Goal = Classification, Weight Genealogical).
  *   **Months 5-6: Stress Testing.** Apply the framework to the three novel cases above and five standard cases from the literature. Determine if the framework yields a consistent verdict where standard accounts stall.
  *   **Month 7: Comparative Analysis.** Contrast the Indexing Framework against Pluralism and Stipulationism. Demonstrate where Indexing offers predictive or classificatory power the others lack.
  *   **Month 8: Drafting.** Write the thesis/dissertation.
  *   **Month 9: Revision.** Refine arguments based on supervisor feedback. Finalize the "Decision Matrix" deliverable.

  **5. Deliverables**
  1.  **Dissertation:** A 15,000–20,000 word argument establishing the Functional Indexing account.
  2.  **The Life-Definition Decision Matrix:** A practical flowchart for researchers (e.g., astrobiologists, synthetic biologists). It will not define life, but will instruct the user: "If your research question is X, apply Criterion Y." This makes the philosophy actionable for instrument design.

  **6. Risk Assessment and Failure Conditions**
  *   **Feasibility:** 9 months is sufficient only if the scope remains strictly on the *semantic structure* of the definition, not the metaphysics of biology. I will cut the Moral/Legal dimension to ensure completion.
  *   **Failure Condition 1 (Collapse to Pluralism):** If the "indexing rules" turn out to be as vague as "it depends on context," the project fails. Success requires the indexing rules to be specific enough to rule out *some* answers in *some* contexts.
  *   **Failure Condition 2 (Collapse to Verbalism):** If the analysis shows the "jobs" are actually unrelated concepts merely sharing a spelling (e.g., 'bank' of a river vs. 'bank' for money), the hypothesis is false. The project must show a unified core logic.
  *   **Failure Condition 3 (No Resolution):** If applying the framework to the novel cases yields the same stalemate as the standard accounts, the framework adds no value.

  **7. Conclusion**
  This project moves the debate from "What is life?" (which invites metaphysical deadlock) to "How does the concept of life function in inquiry?" (which invites semantic resolution). By treating 'alive' as a context-sensitive tool rather than a hidden natural kind, we can preserve the utility of the concept for instrument designers and biologists without pretending a single necessary-and-sufficient condition exists.
