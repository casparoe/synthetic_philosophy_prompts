answer: |-
  You need three stacks of index cards, a whiteboard, and markers. The goal is to run a simulation called Normative Archaeology where students excavate rules from extinct practices and test whether the rules retain their force when the practice dies. Start by dividing the class into two groups of seven. Give each group a stack of cards and tell them they are curators of a museum dedicated to dead civilizations, technologies, or institutions. Their first task is to write down ten specific mandates or instructions found in these dead systems. Encourage variety: a line of code from a deprecated programming language, a rule of etiquette from a vanished court, a maintenance schedule for a factory that stopped production, a liturgical instruction from a dissolved monastery. The key constraint is that each card must state a requirement using normative language like must, should, or ought, not just descriptive language. Once they have their decks, bring them to the whiteboard. Draw three columns labeled Scenario A, Scenario B, and Scenario C. Scenario A is the system functioning as intended with agents present. Scenario B is the system intact but the original beneficiaries or users are gone, though agents still exist who could interact with it. Scenario C is the system intact but no agents exist at all, or no agents could possibly exist in that context.

  Have the groups pick their three strongest cards and walk them through the three scenarios. For each card, they must place a checkmark in the columns where they feel the mandate still holds. This is where you drive the wedge they usually miss. When they discuss Scenario B, force them to articulate whether the reason is unclaimed because no one is around to claim it, or unclaimable because the context for claiming it is gone. If they say the code should still be clean in Scenario B, ask them who it is for. If they say no one, ask why it matters. If they say it matters for the integrity of the code itself, you have successfully isolated the intuition of a reason without a subject. Do not correct them yet. Just record their verdicts on the board. Then move to Scenario C. This is the orphaned mandate test. If the monastery is empty and will never be occupied again, is there still a reason to light the lamp at vespers? If the checksum is in a protocol no computer will ever run, is there still an error if the bits are flipped? Have them vote on each card for Scenario C. You will likely get a split. Leave the split visible.

  Now give them ten minutes to prepare a defense for one card where they voted that the reason survives in Scenario C and one where they voted it dies. They must argue without using the word good or value. They must talk only about reasons, demands, or correctness. This constraint prevents them from sliding into simple value objectivism too early. Bring the class back together for the debrief. This is where you reveal the target. Explain that the activity was designed to test the assumption that reasons are essentially relations between facts and agents. Map the three columns to the philosophical distinctions. Scenario A is standard reasons internalism or agent-relative reasons. Scenario B is the unclaimed reason, the space where your students usually collapse the distinction. Scenario C is the agentless reason, the orphaned mandate. Point out that when they argued for the mandate surviving in Scenario C, they were arguing for a rationale that exists independently of any possible claimant. Ask them to look at the cards where they disagreed. This disagreement is the data point for metaethical realism versus anti-realism about reasons.

  You must anticipate the deflationary move where a student says the mandate in Scenario C is just a metaphor or a projection of our own feelings onto a dead system. They will say the lighthouse does not really ought to shine, we just feel sad it does not. When this happens, do not argue against it immediately. Instead, ask them why the metaphor feels so apt. Ask why we use normative language like error or function for dead systems if there is no normative reality there. Push them to see that even calling it a metaphor acknowledges a normative residue that demands explanation. The activity cannot fully prove that agentless reasons exist, but it makes the denial feel costly. It forces them to explain away their own intuition rather than just dismissing the theory. You also need to warn them that this is not just value objectivism re-described. Value objectivism says the lighthouse shining is good. The view you are pointing toward says there is a reason to shine the light even if no one experiences the good. The activity focused on instructions and mandates to keep the focus on reasons rather than value properties. If they conflate the two in the debrief, remind them that a reason is a counting-in-favor, not a property of the outcome.

  Be honest about the limitation you will face. The activity relies heavily on functional norms like code or machines, which have built-in teleology. Moving from the normativity of artifacts to the normativity of morality or practical reason requires a leap the cards cannot bridge on their own. You will have to state explicitly in the debrief that if they accept a reason survives in Scenario C for a lighthouse, they must explain why a moral reason would not also survive in a world without moral agents. The activity generates the intuition pump, but you must build the engine that connects it to ethics. Finally, watch for the group that refuses to play along and insists on strict naturalism from the start. If they deny all normative force in Scenario A, the activity stalls. To prevent this, prime the pump in the introduction by accepting functional normativity as a given baseline. Tell them we are assuming for the sake of the game that functions generate norms, and we are testing where those norms go when the function loses its user. This brackets the harder metaethical question just long enough to get them to the edge of the cliff you want them to look over.
