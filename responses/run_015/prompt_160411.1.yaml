answer: |-
  # The Pain Badness Decision Tree

  **Instructions:** Begin at the root. Answer each question based solely on the clinical intuition the case provokes, without regard for which philosophical position you suspect it supports. Follow the branch corresponding to your answer until you reach a leaf. Each leaf provides the three required verdicts: **Charting** (Is the patient in pain?), **Norms** (Is there a reason to treat, and whose?), and **Epistemology** (Can the badness of pain be hidden from the subject?).

  ### Node 1 (Case A: The Indifferent Discriminator)
  In Case A, the patient detects and accurately rates a noxious stimulus but reports no unpleasantness and takes no action to stop it. Should the clinical chart record "Pain Present"?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 6.

  ### Node 2 (Case D: The Shrugger)
  In Case D, the patient reports an unpleasant sensation identical to past pain but sincerely denies it is bad and refuses treatment. Does the clinical team have a *pro tanto* reason to intervene against the patient's will?
  *   **No:** Go to Leaf 1.
  *   **Yes:** Go to Node 3.

  ### Node 3 (Case C: The Unmoved)
  In Case C, the patient rates the pain as excruciating and awful but feels no urge to act and shows no avoidance behavior. Does the sensation itself issue a command to act, even if the patient ignores it?
  *   **No:** Go to Node 4.
  *   **Yes:** Go to Leaf 2.

  ### Node 4 (Case E: The Relabeller)
  In Case E, the patient's unpleasantness shifts based on information about tissue damage, while sensory reports remain constant. Is the pain itself different in the two conditions?
  *   **No:** Go to Leaf 3.
