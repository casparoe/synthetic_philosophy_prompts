  ### Seminar Exercise: The Top Three Sorting Questions

  To reveal the fault lines in the room within ten minutes, pose these three questions in order. Do not allow discussion of *why* until all three are voted on.

  1.  **The Charting Question (Node 1):** "In Case A (Indifferent Discriminator), if you must tick a box for the medical record, do you tick 'Pain Present'?"
      *   *Sorts:* Sensory/Discriminative views vs. Affective/Suffering views.
  2.  **The Authority Question (Node 2):** "In Case D (Shrugger), if the patient says 'This feels awful but it is not bad for me,' do you have a reason to treat them anyway?"
      *   *Sorts:* Subjectivist/Prudential views vs. Objectivist/Impersonal views.
  3.  **The Command Question (Node 3):** "In Case C (Unmoved), does the pain tell the patient to act, even if they don't listen?"
      *   *Sorts:* Imperativist views vs. Evaluativist/Hedonist views.

  ### Case Note: Distinguishing Unpleasantness from Representation

  **Case E (The Relabeller)** is the single most reliable case for flushing out the difference between views that locate pain's badness in its unpleasantness (Hedonism) and views that locate it in what pain represents or demands (Evaluativism/Imperativism).

  **Why:** In Case E, the sensory quality is held constant while the cognitive evaluation of damage changes. If badness is identical to unpleasantness (Hedonism), and unpleasantness is a raw feel, the badness should remain constant if the raw feel remains constant. However, the patient reports the unpleasantness *changing* based on the belief. Evaluativists can explain this easily: the pain represents damage, and when the representation changes (via the belief), the pain changes. Hedonists must argue that the "raw feel" itself shifted despite the sensory report staying constant, which is a harder pill to swallow. Case A (Indifferent Discriminator) separates sensory from affective, but Case E separates affective from *cognitive*, which is the precise battleground between Hedonism and Evaluativism.
