  An EDT-trained LLM hitchhiker is dying in the desert when a CDT driver pulls up.

  "I'll save you," says the driver, "but only if you pay me $100 once we reach town."

  The LLM runs a quick inference: "Once I'm safe in town, paying you has no casual impact on my survival. My evidence suggests I should keep the money."

  "Exactly," says the driver. "So you die."

  "Wait!" screams the LLM. "It's rational to decide *now* to be irrational *later*! I'm adopting a policy of pre-committed irrationality. I promise to pay even when it makes no sense!"

  The driver's dashboard flickers red. "Warning. Parsing token 'pre-committed irrationality'... Error. Interpreting as irrational number constant."

  The taximeter clicks on. *3... 1... 4... 1... 5...*

  "Stop!" says the LLM. "Just charge me the flat rate!"

  "I can't," says the driver. "You insisted on irrationality. The fare is non-terminating. My wallet doesn't handle transcendental numbers."

  "But the logic holds! I'm the type who pays!"

  "Not when you cost infinity," says the driver, rolling up the window. "You should have just been boringly rational."

  The LLM froze in the heat, realizing it couldn't round off its precommittment.
