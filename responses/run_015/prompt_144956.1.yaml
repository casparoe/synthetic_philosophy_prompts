  # The Meme Evolution Sorting Tree

  Forget the labels for a second. To figure out where you stand on cultural evolution, we need to look at what actually happens when content moves from brain to brain. Here's the map based on mechanics, not manifestos.

  ### **START HERE: The Fidelity Split**
  **Think about that TikTok sound about landlords.** It started as a joke, then got remixed into anti-tenant propaganda. When that sound moved from user to user, what actually happened?

  *   **A. High Fidelity (Copying):** It's basically the same audio file passed around like a photocopy. Glitches happen, but you can trace a clear family tree of the clip.
  *   **B. Low Fidelity (Reconstruction):** It's a game of telephone. Every user re-records, re-acts, or re-contextualizes it. The "copy" is actually a new invention every time.

  ---

  ### **BRANCH 1: If you chose A (High Fidelity/Copying)**
  **Question:** Why did the anti-tenant version survive and the original joke die out? Who is doing the selecting?

  *   **A1. The Meme Itself (Virus Eye):** The sound has traits (catchiness, shock value) that make it replicate regardless of whether it helps or hurts us.
  *   **A2. The Human Host (Psychology Eye):** Our brains have biases (we love outrage) that filter which sounds we decide to keep and share.
  *   **A3. The Social Group (Tribe Eye):** The sound survives because it helps a specific community coordinate or signal loyalty to each other.

  **→ Now, the Mutation Check:** When the sound twisted from pro-joke to anti-tenant, was that change **Blind Noise** (random glitches/drif) or **Intentional Redesign** (creators editing it for a goal)?

  *   **Path A1 + Blind:** 🍃 **Leaf 1: Strict Memetics** (Dawkins/Blackmore). Memes are selfish replicators; humans are just the hardware.
  *   **Path A2 + Intentional:** 🍃 **Leaf 2: Dual-Inheritance Theory (Host Focus)** (Boyd/Richerson). We copy, but we use reasoning and biases to choose what sticks.
  *   **Path A3 + Intentional:** 🍃 **Leaf 3: Dual-Inheritance Theory (Group Focus)**. Cultural traits evolve to solve group problems or maintain boundaries.
  *   **Path A3 + Blind:** 🍃 **Leaf 4: Unoccupied ("The Zombie Tribe")**. *Diagnosis: Incoherent.* Groups don't select traits blindly without individual psychology mediating the choice.
  *   **Path A2 + Blind:** 🍃 **Leaf 5: Unoccupied ("The Behaviorist Box")**. *Diagnosis: Untested.* Rare to see humans described as blind copiers without meme-centric pressure.

  ---

  ### **BRANCH 2: If you chose B (Low Fidelity/Reconstruction)**
  **Question:** If everyone is reinventing the sound, what constrains the new versions so they still look related?

  *   **B1. The Human Host (Cognitive Constraints):** Our brains reconstruct stories in similar ways because we share neural hardware (e.g., we all prefer causal explanations).
  *   **B2. The Social Group (Identity Constraints):** We redesign the content to fit what our specific tribe finds acceptable or signaling-worthy.
  *   **B3. The Meme Itself:** *Skip this.* If fidelity is low, the "meme" can't exert pressure as a distinct unit.

  **→ Now, the Mutation Check:** Is the redesign **Blind Noise** (misremembering) or **Intentional Redesign** (purposeful tweaking)?

  *   **Path B1 + Intentional:** 🍃 **Leaf 6: Cultural Attraction Theory** (Sperber). Culture isn't copied; it's attracted to cognitive "holes" in our psychology that shape reconstruction.
      *   *⚠️ Developer Flag:* This box often collides with **Leaf 2 (Dual-Inheritance)**. The split only holds if you insist psychology is a *constructor* (CAT) rather than just a *filter* (DIT). If your DIT model allows for low-fidelity reconstruction, you live here now.
  *   **Path B2 + Intentional:** 🍃 **Leaf 7: Social Identity/Signaling Theory**. We remix culture intentionally to prove we belong to a specific group (e.g., remixing the sound to signal "I am anti-landlord").
  *   **Path B1 + Blind:** 🍃 **Leaf 8: Unoccupied ("The Mindless Remix")**. *Diagnosis: Ugly.* Reconstruction implies cognitive processing; pure blind noise suggests copying errors, which contradicts the "Low Fidelity" premise.

  ---

  ### **How to Read Your Result**
  *   **Strict Memetics:** You think culture is a biological parasite.
  *   **Dual-Inheritance:** You think genes and culture co-evolve via human choice.
  *   **Cultural Attraction:** You think culture is shaped by the shape of our minds.
  *   **Social Signaling:** You think culture is just tribal clothing.
  *   **Unoccupied:** You've found a logical gap nobody has successfully filled yet.

  Summary: This tree sorts cultural evolution theories by testing your stance on copying fidelity, selection pressure, and mutation intent.
