answer: |-
  Here is a 5-minute auditing procedure designed to be defensible in office hours, followed by the application to your three papers.

  ### The 5-Minute Presentism Audit

  **Time Budget:** 5 minutes per paper.
  **Goal:** Distinguish between *naive presentism* (imposing the present on the past) and *critical anachronism* (using the present to analyze the past).
  **Honesty Clause:** Steps 1–3 are factual checks. Step 4 is where your judgment wears a costume. Step 5 is where you admit it.

  #### Step 1: The Coinage Check (1 minute)
  **Question:** Is the key analytical term (e.g., "genocide," "white supremacist," "justice") defined or coined *after* the period being studied?
  *   **No:** Pass. (Not presentism).
  *   **Yes:** Proceed to Step 2.
  *   **TA Note:** If the paper uses *only* period terms but arranges them to imply a modern conclusion (e.g., "he wasn't a racist, but he owned slaves and believed they were inferior"), flag for Step 3.

  #### Step 2: The Translation Test (2 minutes)
  **Question:** If you force the student to restate their claim using *only* concepts available to the historical actors (e.g., swap "domestic violence survivor" for "battered wife" or "violated subject"), does the argument collapse?
  *   **No (Argument holds):** Pass. The modern term is just a label for a recognizable phenomenon.
  *   **Yes (Argument collapses):** **STOP.** This is Presentism. The modern term is carrying theoretical weight the past cannot support.
      *   *Exception:* If the student explicitly acknowledges the term is modern and argues why it is *necessary* to explain the event, proceed to Step 4.
      *   *Office Hour Defense:* "You are arguing that X caused Y. But X didn't exist as a concept to the actors. If you remove X, your explanation of Y disappears. You are explaining the past using a future rulebook."

  #### Step 3: The Silence Laundering Check (1 minute)
  **Question:** Does the paper treat the *absence* of evidence in the archive as evidence of the *presence* of the modern category? (e.g., "They didn't write about queer identity, which proves how repressed it was.")
  *   **No:** Pass.
  *   **Yes:** **STOP.** This is Presentism. You cannot turn archival silence into positive proof of a modern category without intermediate evidence.
      *   *Office Hour Defense:* "Silence proves the archive is silent, not that the category existed. You are reading your expectation into the gap."

  #### Step 4: The Disclaimer Check (1 minute)
  **Question:** Does the student signal that they know this is a modern lens? (e.g., "While they would not have called it genocide, the outcome fits the UN definition...")
  *   **Yes:** Pass to Step 5. (This is *critical anachronism*, which is allowed in honors work).
  *   **No:** **STOP.** This is Naive Presentism. They are treating a modern judgment as a historical fact.

  #### Step 5: The TA Discretion (The "Costume" Step)
  **Question:** Is the anachronism doing *explanatory* work (helping us understand causes) or *evaluative* work (telling us who to blame)?
  *   **Explanatory:** Let it slide, but demand a disclaimer in the margin.
  *   **Evaluative:** Flag it. History explains; moral philosophy judges. If the paper substitutes judgment for explanation, it fails the methods requirement.
  *   **Honesty Clause:** This step is entirely your judgment. There is no rule for how much moral evaluation is "too much." You are deciding if the paper is *history* or *advocacy*.

  ***

  ### Application to This Week's Papers

  Here is how the audit runs on your three specific cases, including the marginal comments you should write.

  #### Paper A: The Colonial Governor & Genocide
  **Audit Run:**
  1.  **Coinage:** "Genocide" (1944) applied to 1780s. **Yes.**
  2.  **Translation:** If swapped for "extermination campaign" or "destruction of a people," does the argument hold? Usually, yes, *unless* the student relies on the legal/moral weight of "genocide" to prove criminal intent that isn't in the source.
  3.  **Silence:** Is the student inferring intent from outcome? (e.g., "Many died, therefore it was genocide.") If so, that's Silence Laundering.
  4.  **Disclaimer:** Does the student acknowledge the term is anachronistic?
  5.  **Discretion:** Is this explaining *why* the campaign happened, or just condemning it?

  **Verdict:** **Flag.** (Most undergrad papers use "genocide" to condemn, not to explain mechanism).
  **Marginal Comment:**
  > "You are applying the legal/moral category of 'genocide' to a period that lacked this concept. To avoid presentism, you must distinguish between the *outcome* (destruction of a people) and the *intent* (specific policy to eradicate). If you rely on the modern term to prove criminal intent where the archive only shows military strategy, you are laundering moral judgment through historical analysis. Clarify: are you explaining their motives or judging their crimes?"

  #### Paper B: The Food Rioter & Redistributive Justice
  **Audit Run:**
  1.  **Coinage:** "Redistributive Justice" (Modern political theory) applied to 18th century. **Yes.**
  2.  **Translation:** If swapped for "moral economy," "customary rights," or "just price," does the argument collapse? **Yes.** "Redistributive justice" implies a state-centric or systemic theory of equity the rioters likely didn't hold. They held a theory of *tradition*.
  3.  **Silence:** N/A.
  4.  **Disclaimer:** Did the student say, "While they wouldn't call it this..."? **No.** (Assuming based on your note that you liked it but worry about the method).
  5.  **Discretion:** Is it explanatory? **Yes.** It explains *why* they felt justified.

  **Verdict:** **Flag.** (Even though it's a good insight, it is methodologically presentist if unqualified. Honors work requires precision).
  **Marginal Comment:**
  > "This is a strong analytical insight, but it is methodologically presentist. 'Redistributive justice' implies a theoretical framework these actors did not possess; they appealed to 'custom' and 'tradition,' not abstract justice. You are explaining their actions using a vocabulary they wouldn't recognize. This is a useful heuristic, but you must acknowledge the anachronism explicitly, or you risk attributing modern political consciousness to traditionalist actors."

  #### Paper C: The Moral Abstention ("We Weren't There")
  **Audit Run:**
  1.  **Coinage:** No modern moral terms used. **No.**
  2.  **Translation:** N/A.
  3.  **Silence:** N/A.
  4.  **Disclaimer:** N/A.
  5.  **Discretion:** The paper refuses evaluation.

  **Verdict:** **Pass on Presentism.** (This is not presentism; it is positivist avoidance).
  **Marginal Comment:**
  > "You have successfully avoided presentism, but you have also avoided historical significance. History requires us to explain why actions mattered, which inevitably involves evaluating consequences. Refusing moral language does not make the paper more objective; it makes it descriptive. You don't need to judge the actors, but you must explain how their contemporaries judged them. Complete neutrality is not a method; it is a silence."

  ***

  ### Office Hour Defense Scripts (For when they push back)

  **On Vocabulary Drag:**
  *   **Student:** "But she *was* abused, even if they didn't call it that."
  *   **You:** "She may have been. But if you use the term 'domestic violence,' you import modern legal and psychological theories about power dynamics that didn't exist then. If you want to use the term, you have to prove the *mechanism* matches, not just the outcome. Otherwise, you're diagnosing a dead patient with a modern disease."

  **On Explaining vs. Evaluating:**
  *   **Student:** "So we can't say slavery was wrong?"
  *   **You:** "You can say it was wrong. But that's a philosophy paper. In a history paper, you must explain *how* they justified it, *why* it persisted, and *who* opposed it at the time. If your explanation for why it ended is just 'because it was wrong,' you've stopped doing history."

  **On Reciprocity:**
  *   **Student:** "Future historians will judge us too."
  *   **You:** "They will. And they should. But they shouldn't judge us by standards we couldn't possibly know. If you judge the 18th century by the 21st, you make the 18th century irrelevant. They become just a bad version of us, rather than a different world we need to understand."

  **On the "Costume" Step (Step 5):**
  *   **Student:** "This feels subjective."
  *   **You:** "It is. History isn't math. I'm not grading you on whether your politics match mine. I'm grading you on whether you're using the past to score points in the present, or using the present to illuminate the past. When the judgment replaces the explanation, the method breaks."
