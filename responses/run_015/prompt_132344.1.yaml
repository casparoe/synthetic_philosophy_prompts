      *   **The Big Correction:** Semantics (Contextualism) vs. Metaphysics/Epistemology (PE). This is crucial.
      *   **The Test:** Your bystander case is the standard "cross-context" test. It works *in principle*.
      *   **The "Settlement" Warning:** Intuitions are messy. Don't claim it's settled. Mention the "Loose Talk" objection from PE side.
      *   **Paper Advice:** Focus on the distinction, not just the variable swap.

  7.  (Final Polish): Ensure the distinction between *truth conditions of sentences* (Contextualism) and *conditions on the mental state* (PE) is clear. Use the "Tall" analogy carefully (Contextualists love it, PE proponents might accept it for 'knows' but for different reasons). Actually, PE proponents often reject the 'tall' analogy for 'knows' because they think knowledge is a real relation, not just a gradable adjective.

      *Wait, one nuance:* Some PE proponents *do* think 'knows' is context-sensitive, but they think the context sensitivity is driven by subject factors, not attributor factors. But the dominant view (SSI) is Invariantist about the *word*, but Sensitive about the *fact*. I need to make sure I don't confuse the user.
      *Standard View:*
      *   Contextualism: "Knows" is indexical. Truth depends on Attributor.
      *   PE (SSI): "Knows" is not indexical. Truth depends on Subject (including stakes).
      *   So, they are *rival* explanations of the same data (bank cases), not versions of the same thesis.

