prompt: |-
  Our reading group went over the bank cases last week and I want to check I've got the dialectic right before I write my response paper. The way I've reconstructed it: contextualism says 'knows' is like 'tall' — the standards that fix whether the sentence is true shift with the attributor's context — and pragmatic encroachment says exactly the same thing, except it's the subject's practical stakes that move the standards instead of the speaker's. So aren't they really one thesis with a different variable plugged in, and the whole fight just about which variable the intuitions happen to favor?

  If so, I think there's a clean way to settle it. Take a bystander who is in a totally relaxed, low-standards conversation, but tell her that enormous stakes are riding on whether Hannah is right about the bank being open Saturday, and then ask her whether Hannah knows. If she cheerfully says yes, is that a point for contextualism and against encroachment — and if enough cases like that come out the same way, should I just be a contextualist?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user is in a reading group discussing "bank cases" (epistemology, specifically knowledge attributions). They are writing a response paper.
      *   **User's Reconstruction:**
          *   Contextualism: 'Knows' is context-sensitive (like 'tall'). Standards shift based on the *attributor's* (speaker's) context.
          *   Pragmatic Encroachment (PE): 'Knows' is context-sensitive. Standards shift based on the *subject's* practical stakes.
          *   User's Conclusion: They are essentially the same thesis, just swapping the variable (speaker context vs. subject stakes). The debate is just about which variable fits intuitions better.
          *   User's Proposed Test: A bystander (low-standards context) is told about high stakes for the subject (Hannah). If the bystander says "Hannah knows," that supports Contextualism and refutes PE.
      *   **Goal:** Check if this reconstruction is accurate and if the proposed test is a valid way to settle the debate for the response paper.

  2.  **Evaluate the Reconstruction (Contextualism vs. Pragmatic Encroachment):**
      *   *Contextualism:* Yes, the core claim is that the truth conditions of knowledge ascriptions vary with the *attributor's* conversational context (specifically, the epistemic standards salient in that context).
      *   *Pragmatic Encroachment:* The core claim is that whether a subject *knows* (the factivity of the knowledge relation itself, not just the word 'knows') depends on the *subject's* practical stakes. It's not just about the word 'knows'; it's about the mental state of knowledge.
      *   *The "Same Thesis" Claim:* This is the weak point in the user's reconstruction.
          *   Contextualism is a *semantic* thesis about the word 'knows'. It says "S knows p" can be true in Context A and false in Context B, even if S's evidence and stakes remain constant.
          *   PE is a *metaphysical/epistemic* thesis about knowledge itself. It says S's *actual epistemic status* changes based on stakes. If stakes go up, S might lose knowledge (even if no one is talking about it).
          *   *Crucial Distinction:* Contextualism preserves the idea that knowledge is purely truth-linked (evidence + truth + belief), but the *ascription* varies. PE says practical factors *constitute* part of the justification/warrant needed for knowledge.
          *   *Invariantism:* There's also Subject-Sensitive Invariantism (SSI), which is often what people mean when they talk about PE in this specific contrast. PE often implies SSI.
      *   *Verdict:* The user's reconstruction is a common simplification but misses a fundamental metaphysical/semantic distinction. They are *not* just the same thesis with a different variable. One is about language (semantics), the other is about the nature of knowledge (epistemology/metaphysics).

  3.  **Evaluate the Proposed Test (The Bystander Case):**
      *   *Scenario:* Bystander (low stakes/context) evaluates Hannah (high stakes).
      *   *User's Prediction:* If Bystander says "Yes, she knows," it supports Contextualism (attributor context rules) and hurts PE (subject stakes should rule).
      *   *Analysis:*
          *   *Contextualist Prediction:* The attributor (bystander) is in a low-standards context. So "Hannah knows" should be *true* (relative to that context). So they should say "Yes."
          *   *PE/SSI Prediction:* The subject (Hannah) has high stakes. High stakes raise the bar for knowledge *itself*. So Hannah *does not know*. Therefore, the bystander should say "No," regardless of the bystander's own context.
      *   *Validity:* This *is* the standard "cross-context" test used in the literature (often associated with DeRose, Stanley, etc.).
      *   *Complication:* The empirical data is messy. Some people have intuitions that side with Contextualism here, others with PE. Also, PE proponents might argue about how the question is framed (pragmatics vs. semantics).
      *   *Verdict:* The test is logically sound as a differentiator, *provided* the reconstruction is corrected. However, claiming it "settles" the debate is too strong because intuitions vary, and there are nuanced responses (e.g., moderate invariantism, error theory).

  4.  **Drafting the Response:**
      *   **Tone:** Encouraging but corrective. This is for a response paper, so accuracy matters.
      *   **Key Correction 1 (Semantics vs. Metaphysics):** Explain that Contextualism is about the *word* 'knows' (semantics), while PE is about the *state* of knowledge (epistemology). This is the biggest error in the user's reconstruction.
      *   **Key Correction 2 (Invariantism):** Clarify that PE is usually paired with Subject-Sensitive Invariantism (SSI). This means the truth value of "S knows p" doesn't change with the speaker, but with the subject. Contextualism says the truth value changes with the speaker.
      *   **Feedback on the Test:** Acknowledge that the "Bystander Case" is indeed the standard way to distinguish them. It's a good intuition pump.
      *   **Caveats:** Warn that "settling" it via intuitions is tricky because intuitions are disputed. Mention that some philosophers argue both might be wrong (Invariantism + Error Theory) or that there are hybrid views.
      *   **Advice for the Paper:** Suggest framing it as "The Semantic/Epistemic Distinction" rather than "Two variables of the same thesis." This will show deeper understanding.

  5.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Wait, is PE strictly SSI?* Often, yes. "Pragmatic Encroachment" is the umbrella term, but in the bank case literature, it usually implies that stakes affect whether you *know*, not just whether you can *say* you know.
      *   *Is Contextualism strictly Attributor Context?* Yes, classic Contextualism (DeRose, Lewis).
      *   *The "Same Thesis" point:* If the user writes that they are the same thesis, they will likely lose marks. I need to be firm but polite that this is a category mistake.
      *   *The Test:* The user asks: "If she cheerfully says yes, is that a point for contextualism?" Yes. "If enough cases... should I just be a contextualist?" I should advise caution. Intuitions aren't data in the scientific sense; they are evidence to be explained. Also, PE proponents have responses (e.g., the bystander is speaking loosely).

  6.  **Final Structure:**
