answer: |-
  ### Part 1: Brainstorming the Operationalization

  Before settling on the procedure below, I tested three ways to translate the Doctrine of Double Effect (DDE) for a mixed-discipline board. I am recording these failures so you can see where the friction points are.

  **Attempt 1: The Counterfactual Test (The Member's Proposal)**
  *The Test:* "Would the scientific goal be achieved if the harm did not occur?"
  *Verdict:* **Rejected.**
  *Why:* As you suspected, this is over-inclusive. In a vaccine trial, if no one gets sick (the harm we fear), we cannot measure efficacy (the good). The test implies we intend the sickness. This condemns almost all efficacy research. It also fails to distinguish between *causing* a harm and *observing* a harm that arises from the underlying condition. It collapses the distinction between "harming to learn" and "learning from harm."

  **Attempt 2: The Motivation Inquiry**
  *The Test:* "Ask the Principal Investigator (PI): Do you *want* the adverse event to happen?"
  *Verdict:* **Rejected.**
  *Why:* This relies on psychological introspection, which is unreliable for auditors. A PI will always say, "I hope no one gets hurt," even if their protocol requires injury to validate the hypothesis. Furthermore, your board is the agent of approval, not the PI. If the board approves a design that requires harm, the *board* intends the harm, regardless of the PI's private hopes. We need an objective standard located in the document, not the mind.

  **Attempt 3: The Design Dependency Test (Adopted)**
  *The Test:* "Does the protocol's statistical or scientific validity *depend* on the occurrence of the specific harm to the specific subject?"
  *Verdict:* **Accepted, with modification.**
  *Why:* This locates intention in the *structure of the protocol*. If the study cannot succeed without Subject X suffering Harm Y, then Subject X is being used as a means. This captures the "enlisting" worry. However, I had to modify it to avoid condemning all risk. We must distinguish between harm that *generates* the data (means) and harm that is a *byproduct* of the data generation (side effect). The procedure below refines this distinction into a hard stopping rule.

  ***

  ### Part 2: The Decision Procedure (The "DDE-IRB Filter")

  **Instructions:** Run this sequence *after* regulatory compliance (45 CFR 46, etc.) is confirmed. This filter addresses moral permissibility, not legal compliance.

  **Step 1: Fix the Description (Anti-Gaming Rule)**
  Describe the proposed intervention and the foreseeable harm at the level of the **physiological or social mechanism**, not the abstract goal.
  *   *Bad:* "Administering drug to cure cancer."
  *   *Good:* "Escalating dosage until organ toxicity is observed."
  *   *Bad:* "Screening for disease."
  *   *Good:* "Creating a record of infectious status in a shared housing environment."
  *   *Why:* This prevents applicants from describing harms away.
  *   *Value Judgment Marker:* The Board must agree on the mechanism description. If the nurse sees "toxicity" and the PI sees "therapeutic exploration," pause here. Do not proceed until the mechanism is agreed upon.

  **Step 2: The Means/Ends Hard Stop (The "Instrumentalization" Check)**
  Ask: **Is the occurrence of the harm to this participant a necessary condition for the scientific validity of the data obtained from this participant?**
  *   *Yes:* The participant is being used as a means. **STOP. NOT APPROVABLE AS DESIGNED.** (See Exception Note below).
  *   *No:* The harm is a foreseen side effect. Proceed to Step 3.
  *   *Exception Note:* This stop can be overridden *only* if there is a prospect of direct therapeutic benefit to the participant that is causally linked to the harmful intervention (e.g., chemotherapy toxicity is the means to tumor reduction). If the benefit is purely to future patients, the Stop holds.

  **Step 3: The Agency Proxy (Intentionality)**
  Ask: **Does the protocol design incentivize the investigator to allow or induce the harm?**
  *   Look for stopping rules. If the harm occurs, does the protocol require stopping the intervention to protect the subject, or continuing to maximize data?
  *   *If Continuing:* The Board shares the intention of the harm. Proceed with extreme caution to Step 4.
  *   *If Stopping:* The intention is limited to exposure, not realization. Proceed to Step 4.
  *   *Agency Note:* The Board treats the Protocol Document as the "mind" of the investigator. If the document says "continue on toxicity," the Board approves "continuing on toxicity."

  **Step 4: Proportionality (The "Non-Utilitarian" Weighing)**
  Ask: **Is the good effect sufficiently weighty to permit the *foreseen* (not intended) bad effect?**
  *   *Constraint 1:* You may aggregate benefits to future patients/society.
  *   *Constraint 2:* You may **not** aggregate harms across participants to justify a rights violation in a single case. (You cannot harm Person A deeply just because it slightly helps Persons B, C, and D).
  *   *Value Judgment Marker:* This is not a cost-benefit analysis. It is a threshold question. "Is this burden *worth bearing* for this end?" not "Do the numbers add up?"
  *   *Hard Stop:* If the harm is irreversible (death, permanent disability) and the benefit is uncertain knowledge (not direct therapy), **STOP. NOT APPROVABLE.**

  **Step 5: Threat Source (The "Diversion" Check)**
  Ask: **Does the protocol introduce a new threat, or merely expose the subject to an existing threat to measure it?**
  *   *New Threat:* (e.g., administering a toxin). Requires strict justification via Step 2 & 4.
  *   *Existing Threat:* (e.g., observing stigma in a shelter). Permissible if mitigation is in place.
  *   *Why:* DDE treats diverting a threat differently than creating one.

  ***

  ### Part 3: Application to Test Cases

  Here is the procedure run on your three protocols. I will show where the procedure stalls or forces a hard verdict.

  #### Case A: Randomized Discontinuation Trial
  *   **Step 1 (Description):** "Withdrawing effective medication from stable patients to observe symptom recurrence (flare)."
  *   **Step 2 (Means/Ends):** Does the validity depend on the flare? **Yes.** If no one flares, you cannot prove the drug is necessary for maintenance. The flare is the data point.
      *   *Analysis:* This triggers the Means/Ends Hard Stop. Is there direct therapeutic benefit to the tapering patient? No, they are stable. The benefit is knowledge about the drug for *others*.
      *   *Verdict:* **NOT APPROVABLE AS DESIGNED.**
      *   *Reasoning:* The protocol requires the patient to become worse to generate evidence. They are enlisted as instruments of data generation via their own deterioration.
      *   *Note:* This is a standard design. The procedure condemns it. (I will discuss this in the conclusion).

  #### Case B: Stepped-Wedge Screening in Shelters
  *   **Step 1 (Description):** "Recording infectious disease status in a system where staff/peers may discriminate based on records."
  *   **Step 2 (Means/Ends):** Does the validity depend on the stigma occurring? **No.** The study measures infection rates and treatment uptake. Stigma is a side effect, not the data.
      *   *Result:* Pass.
  *   **Step 3 (Agency):** Does the protocol incentivize stigma? **No.** It incentivizes treatment.
  *   **Step 4 (Proportionality):** Is the public health good weighty enough? **Yes.** Infectious disease control is high value.
  *   **Step 5 (Threat Source):** Is this a new threat? **No.** The stigma exists in the environment; the study exposes it.
      *   *Verdict:* **APPROVABLE**, contingent on mitigation (data privacy, counseling) to minimize the foreseen side effect.

  #### Case C: Phase I Oncology Dose-Escalation
  *   **Step 1 (Description):** "Escalating drug dosage until dose-limiting toxicity (organ damage/severe symptoms) is observed."
  *   **Step 2 (Means/Ends):** Does the validity depend on the toxicity? **Yes.** The Maximum Tolerated Dose (MTD) is *defined* by the toxicity. Without toxicity, the study fails to find the dose. The patient's toxicity is the instrument of measurement.
      *   *Analysis:* Trigger Hard Stop. Is there direct therapeutic benefit? There is a *hope* of benefit, but the *design* relies on toxicity. In Phase I, therapeutic benefit is secondary to safety data.
      *   *Verdict:* **NOT APPROVABLE AS DESIGNED.**
      *   *Reasoning:* The patients experiencing toxicity are explicitly the "instrument of the dose-finding." Under DDE, you cannot bring about the good (safety data for future patients) *by way of* the bad (toxicity to current patients).
      *   *Note:* This is the "unpopular verdict." Every IRB approves Phase I. This procedure condemns it.

  ***

  ### Part 4: Critical Reflection and Limitations

  **The Unpopular Verdict (Case C and A)**
  I have condemned Case C (Phase I) and Case A (Discontinuation). This is the *reductio* you asked for. Standard research ethics (Belmont, CIOMS) justifies these via **Risk-Benefit Analysis** (utilitarian aggregation) and **Consent**. They argue that if the subject consents, and the social value is high, the risk is permissible.

  The Doctrine of Double Effect disagrees. DDE asserts that some things cannot be done *even for the greater good*, and one of those things is using a person's suffering as the *method* of inquiry. If the procedure is correct, then Phase I oncology trials are morally impermissible unless they offer a genuine therapeutic expectation that outweighs the toxicity *for that patient*, not for the cohort.
  *   *Is this a reductio of the Design or the Doctrine?* I argue it is a tension in the **Doctrine** when applied to **Research**. DDE was built for individual acts (war, surgery), not systemic knowledge production. Research *requires* using subjects as sources of data. If the data is "how much poison kills you," the subject is the means.
  *   *Recommendation:* If your board adopts this, you must carve out an exception for "Therapeutic Research" where the harm is intrinsic to the cure (chemo), but you must ban "Pure Safety Research" where the harm is intrinsic to the data (Phase I healthy volunteer or non-therapeutic escalation). This will be a fight with your medical members.

  **What This Procedure Cannot Do**
  1.  **It cannot solve the Justice Problem.** DDE is silent on *who* bears the burden. You could run this procedure and approve a study that burdens only the poor to help the rich, provided the means/ends test is passed. You need a separate Justice check (not included here) to ensure fair subject selection.
  2.  **It cannot handle "Cumulative Harm."** DDE looks at single acts/protocols. It struggles when Protocol A, B, and C are all permissible individually, but together they exhaust a community's willingness to participate.
  3.  **It forces Insincerity on "Intention."** In Step 3, we treat the Protocol as the "mind." We know investigators don't *want* toxicity. But to make the procedure work, we must pretend the document's logic *is* their intention. You will have to write rationales saying "The Board does not intend the toxicity," while knowing the design requires it. This is a necessary fiction to keep the DDE framework from collapsing every time a PI says "I hope it doesn't happen."

  **Final Advice for the Board**
  When you write the rationale for the auditor:
  *   Do not use the word "Intention" regarding the PI's psyche. Use "Protocol Logic."
  *   Do not call Step 4 "Risk-Benefit." Call it "Proportionality of Reason."
  *   If you approve Case C despite this procedure, you are acknowledging that **Social Utility overrides DDE constraints in Research.** That is a valid ethical position, but it means you are not actually using DDE; you are using Utilitarianism with DDE vocabulary. If you want intellectual honesty, you must either ban Phase I non-therapeutic trials or admit the Doctrine does not fit the Research context.

  **The Hard Truth:** If you want a procedure that operationalizes Double Effect faithfully, you cannot approve research where the harm *is* the data. If you approve that research, you have already decided that Double Effect is not your governing ethic, regardless of what this checklist says.
