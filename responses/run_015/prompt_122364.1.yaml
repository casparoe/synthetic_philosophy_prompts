prompt: |-
  You are a professional philosopher who specializes in normative ethics — in particular the doctrine of double effect and the family of cases usually argued over under the heading of trolley problems — and who has some real experience of making that material usable by people who have never read any of it. Please think carefully and do not rush to the deliverable. Before you settle on a final version, spend a few paragraphs brainstorming two or three candidate ways of operationalizing the doctrine, and tell me what you tried, what you rejected, and why. I would much rather have a short, honest procedure with its failures marked than a long, confident one. And please do not give me citations or a reading list: I have the literature. What I need is the translation.

  My situation. I am a professor of philosophy at a large research university, and for two years I have been one of two philosophers sitting on our institutional review board. We meet for three hours every three weeks and dispose of between twenty and thirty protocols; each one has been pre-read by two members. The rest of the board is a pharmacist, a pediatric nurse, a biostatistician, a hospital chaplain, and two community representatives. None of them have studied philosophy, and the two community representatives have to be able to follow and dissent from our reasoning in real time. Every approval has to be defended in a written rationale that an external auditor could read a year later and make sense of. Anything the board cannot settle goes to the chair, who signs off alone. Assume throughout that each protocol below has already cleared our regulatory screening: I do not need the compliance analysis. I need the layer of moral reasoning that the screening does not do.

  The deliverable. A decision procedure — a checklist or a flowchart in words — that this board could actually run on a protocol in the ten or fifteen minutes we have per case, and that operationalizes the doctrine of double effect: the requirement that the act be permissible apart from its bad effects, the intended-versus-merely-foreseen condition, the prohibition on bringing about a good effect by way of a bad one, and the proportionality condition. I want you to be explicit about the translation: which of the doctrine's distinctions must survive simplification because dropping them would change the verdicts, and which are casualties we should accept in exchange for something a nurse and a community representative can apply without training. Mark every point at which the procedure hands the question to a person because what remains is a disagreement about values rather than a matter of fact. And give me at least two hard stopping rules — points at which the procedure returns 'not approvable as designed' and stops, rather than continuing to weigh.

  Four complications the procedure has to earn its keep on.

  First, the intended/foreseen condition. One of our members proposes a simple test: ask whether the good effect would still be achieved if the bad effect failed to occur; if it would not, the bad effect is being used as a means, and the protocol fails at that step. I have doubts, and I want them tested rather than confirmed. The test seems to me to misfire in both directions: it condemns protocols where a single causal process simply carries an unwelcome consequence along with it, and it waves through protocols where what does the work is the participant's body, or their reaction, or their not knowing something, which is precisely what I take the prohibition on using people to be about. My own hunch, which you should feel free to demolish, is that for our purposes the means condition should be replaced by something like an enlisting-versus-exposing question: does the protocol need to make use of the participant as an instrument, or does it merely place them in a situation in which harm may befall them? Build that in if it survives scrutiny, or tell me why it must go and what to put in its place. Relatedly, several of us keep reaching for the thought that diverting a threat that already exists is different in kind from starting a new causal sequence in motion, but we cannot say what to do with a protocol that does some of each.

  Second, proportionality. Two worries. May the good that is weighed include benefits to people other than the participants who bear the burden — future patients, a shelter population, a health authority — or must the relevant good be a good for, or at least a risk taken on by, the person harmed? And if we allow that aggregation, does the proportionality condition simply become cost-benefit analysis, leaving the rest of the doctrine as decoration? If so, say so, and tell me whether the doctrine is then doing any work in our setting at all.

  Third, redescription. Any test that turns on how the act or the effect is described can be gamed by describing more finely or more coarsely; I do not want an applicant to get a different verdict by relabelling. Should the procedure fix a level of description in advance, and if so, on what basis?

  Fourth, agency. The doctrine is stated for an individual agent with intentions, but the body applying it is a committee, and a committee does not literally intend anything. Tell me what the intended/foreseen condition even means when the agent is a board voting seven to one, and whether the procedure should ask about the intentions of the investigators, of the board, or of neither.

  The test cases. Run the procedure on all three, showing your work at each step and where it stalls.

  A. A randomized discontinuation trial. A drug is widely prescribed for a chronic, disabling, non-fatal condition, never properly tested, and genuinely in equipoise. Patients stable on it are randomized to continue or to taper off under monitoring, with a pre-specified rescue rule. Some in the taper arm will flare, painfully, and the flare is part of what generates the evidence.

  B. A stepped-wedge study of a screening-and-treatment programme for a stigmatized infectious disease across a city shelter system. Participation is voluntary and the intervention is beneficial on balance, but it is foreseeable that being seen to take the medication, or the existence of a record, will expose some participants to consequences from shelter staff, employers, or family. Those who impose the consequences are not subjects of the study.

  C. A phase I dose-escalation study in oncology, in which the maximum tolerated dose is defined by dose-limiting toxicity: the more toxicity is observed, the more is learned, and the patients who experience it are the instrument of the dose-finding. The benefit is overwhelmingly to future patients.

  Finally: at least one of your applications must return a verdict that my board will not like — ideally one that condemns a design that research ethics committees everywhere approve as a matter of routine. Do not soften it; if that result is a reductio of the doctrine rather than of the design, say which and argue for it. Close by telling me what this procedure cannot do: the cases it will systematically get wrong, and the questions it will make us answer insincerely in order to get to a verdict at all.
