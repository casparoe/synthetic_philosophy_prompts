answer: |-
  Your hypothesis is astute: the dispute is not primarily about where the mind *is*, but about what work the concept *cognitive* is supposed to perform in a scientific theory. However, characterizing it merely as a verbal dispute or a clash over definitions underestimates the depth of the impasse. It is not just that they are using the word differently; it is that they are operating with incompatible **norms of explanation**.

  Here is a diagnosis of the standoff, an analysis of why your symmetry condition fails to break it, and a proposal for what progress would actually look like.

  ### 1. Diagnosis: A Clash of Explanatory Ideals
  The standoff is a **meta-explanatory dispute about individuation conditions**. It is a hybrid of substantive methodological disagreement and ontological pragmatism.

  *   **The Internalist/Mechanist Ideal:** For critics like Adams and Aizawa (and many mechanistic philosophers of science), a scientific kind must track a **causal mechanism** with a unified structure. To call something "cognitive" is to hypothesize that it belongs to a natural kind (or a mechanistic kind) that supports specific inferences about breakdown, learning, and implementation. For them, "cognitive" names a *structure-dependent process*. If you allow the boundary to shift based on functional role, you lose the ability to generalize about the *mechanism* that produces the function. They fear that EMT makes "cognitive" too promiscuous to support law-like generalizations.
  *   **The Externalist/Functionalist Ideal:** For proponents like Clark and Wilson, cognitive science is a **problem-solving enterprise**. The boundary of the system should be drawn where the **explanatory model** is most productive. If treating the notebook as part of the memory system allows you to predict behavior better than treating it as input, then it is cognitive. For them, "cognitive" names a *functional organization*. They fear that Internalism imposes an arbitrary "neuro-chauvinism" that ignores how agents actually solve problems in the world.

  **Why it is frozen:** The dispute is frozen because both sides are correct within their own explanatory frameworks.
  *   If your goal is to understand neural implementation, the Internalist is right: the notebook is not made of neurons, and its physics are different.
  *   If your goal is to understand behavioral adaptation in an ecological niche, the Externalist is right: the agent + notebook system adapts as a unit.

  Because the literature often frames this as "Where is the mind?" (an ontological question) rather than "Which system individuation yields the best explanation?" (a methodological question), the parties talk past each other. They agree on the physics (the light hits the eye, the hand moves the pen) but disagree on the **ontology of explanation**.

  ### 2. Why Your Symmetry Condition Does Not Break the Deadlock
  Your "substitutional symmetry condition" is an **interventionist criterion** (reminiscent of Woodward's manipulability theory of causation). You propose: $X$ is constitutive if interventions on $X$ map isomorphically to interventions on intracranial $Y$.

  This fails to move the needle for two reasons:

  1.  **Epistemic vs. Ontological:** Your condition solves an *epistemic* problem (how do we detect constitution?) but not the *ontological* problem (what is constitution?). The Internalist grants that the notebook is *causally coupled* tightly enough to mimic neural manipulation profiles. Their claim is that **causal coupling is not constitution**. A shadow moves exactly when I move; interventions on me change the shadow. But the shadow is not *part* of me. The Internalist argues that symmetry of manipulation profiles is consistent with tight coupling, not proof of parthood. They demand a story about *information flow* or *mechanistic integration*, not just counterfactual dependence.
  2.  **The "Mark" is a Proxy for Mechanism:** When the critic demands a "mark of the cognitive," they are not asking for a stipulation; they are asking for evidence of **mechanistic unity**. If the notebook degrades under stress differently than the hippocampus (e.g., it doesn't suffer from proactive interference in the same way), the symmetry fails. If you construct a thought experiment where it *does* match (your implantable device), the Internalist will argue you have simply built an *intracranial-style mechanism* and put it outside. They will say, "Of course that's cognitive; it's functionally isomorphic to a brain part." But they will deny that a standard paper notebook meets this bar. Thus, the dispute shifts to empirical claims about real-world tools, not the principle of symmetry.

  ### 3. What Counts as Progress?
  Given this diagnosis, a formal criterion (like your symmetry condition) will not work, because the disagreement is not about the lack of a definition, but about the *legitimacy of functional individuation*. A single experiment will not work, because the data (behavioral success/failure) is compatible with both models.

  Progress requires **Reframing the Question**. Specifically, progress lies in shifting from **Ontological Realism** about the boundary to **Explanatory Pluralism** regarding the system.

  Here are three concrete paths to progress:

  **A. Adopt a "Degrees of Freedom" Analysis (Dynamical Systems)**
  Instead of asking "Is it in or out?", ask "How many degrees of freedom does this component contribute to the control loop?"
  *   *Progress looks like:* Modeling the agent-environment system using dynamical systems theory or control theory. If the notebook's state variables are necessary to close the control loop (i.e., the system is unstable without them), then the boundary is functionally defined by the **closure of the control system**, not by the skin.
  *   *Why this helps:* It bypasses the "constitution vs. coupling" language. It treats the boundary as a modeling choice determined by stability analysis. If the "agent-only" model is unstable but the "agent+notebook" model is stable, the extension is justified *mathematically*, not intuitively.

  **B. The Predictive Processing Reframing**
  Recent work in Predictive Processing (PP) dissolves the boundary by treating it as a **precision-weighting interface**.
  *   *Progress looks like:* Showing that the brain treats external resources as if they were internal body schema (e.g., the rubber hand illusion, or tool use in proprioception). In PP, the "mind" is the hierarchy of predictions. If the prediction error is minimized by including the tool in the generative model, the tool is "extended" in the only sense that matters for the theory.
  *   *Why this helps:* It changes the "mark of the cognitive" from *location* or *mechanism* to **inferential integration**. The question becomes: "Does the agent minimize free energy by modeling this resource as part of the self?" This is an empirical question about neural weighting, not a conceptual one about notebooks.

  **C. Local Empirical Resolution (The "Hidden Empirical" Path)**
  You asked if this is a hidden empirical question. In specific domains, it is.
  *   *Progress looks like:* Abandoning the universal claim ("The mind extends") for local claims ("Memory extends in case X, but attention does not in case Y").
  *   *Example:* Research on **collaborative recall** shows that couples remember more together than apart, but their error patterns also correlate. If the error correlation structure of the couple matches the error structure of a single individual's memory (false memories spreading between partners), that is empirical evidence of a unified cognitive system.
  *   *Why this helps:* It forces the Internalist to explain away specific data patterns rather than hiding behind general principles. It moves the debate from "Can it extend?" to "Does it extend *here*?"

  ### Summary Recommendation
  The standoff is a **methodological conflict masquerading as metaphysics**. The predicate "cognitive" is doing double duty: it is supposed to track *mechanism* (for the Internalist) and *function* (for the Externalist).

  To make progress in your seminar:
  1.  **Concede the verbal point:** Acknowledge that if "cognitive" means "neural mechanism," EMT is false by definition. If "cognitive" means "functional role in behavior," EMT is trivially true.
  2.  **Pivot to utility:** Argue that the only non-arbitrary way to choose between definitions is **explanatory power**.
  3.  **Propose the test:** The question should not be "Is the notebook part of the mind?" but "Does a model that treats the notebook as a state variable yield better predictions of breakdown and learning than a model that treats it as input?"

  If the seminar can shift to evaluating **competing models of specific tasks** rather than debating the **definition of mind**, the frozen structure will thaw. The "cognitive" is not a natural kind waiting to be found; it is a theoretical construct that must earn its keep. The dispute is frozen because everyone is trying to find the construct in the world, rather than evaluating its utility in the theory.
