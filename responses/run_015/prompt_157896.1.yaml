  I'm defending a thesis next week that Mill's late socialism wasn't a departure from liberalism but an extension of his "permanent interests" logic into factory organization—specifically that the late editions of Principles sketch an implicit theory of cooperative surplus allocation rather than state control. The room will be Victorian political historians who think Mill went soft on markets after Harriet Taylor died, plus a couple economists who read his factory chapers as proto-marginalist confusion. Give me the prep sheet: objections in the order they'll come, phrased like they would phrase them, ranked by damage. For each, what I concede up front, the two-minute reply, and where that reply is soft. Include the question I'm praying nobody asks—probably something about whether cooperative surplus allocation collapses without competitive price signals?
