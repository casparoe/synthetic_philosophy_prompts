      *   *Objection 3 (State Aid):*
          *   *Concession:* He allowed state funding for experiments.
          *   *Reply:* "Seed funding" $\neq$ "State Control." It's liberal enablement, not dirigisme. Once started, they run themselves.
          *   *Soft Spot:* Where does the funding come from? Taxation. That's coercive redistribution.

  5.  **Refining the Tone:**
