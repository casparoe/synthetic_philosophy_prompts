answer: |-
  ### The Tool vs. Agent Debate: A Control Engineering Restatement

  In your vocabulary, the online debate is largely a confusion about **who closes the loop** and where the **setpoint** originates.

  A **Tool** is an open-loop assist. It functions as a smart sensor or a sophisticated HMI. You query it (input), it processes data using a static internal model, and returns a recommendation (output). You, the human, act as the controller. You perform the **state estimation**, you check the **constraint enforcement**, and you decide whether to actuate. The **stability margins** are entirely your responsibility. If the tool fails, it is a **degraded mode** where you revert to manual calculation or first principles. The **objective** is exogenous; you define the prompt, and the tool does not revise it.

  An **Agent**, theoretically, is a closed-loop controller. You provide a high-level **objective** (e.g., "optimise this workflow"), and the agent derives its own **setpoints** and trajectories. It possesses **sensors** (API reads, web scraping) and **actuators** (API writes, code execution). It carries an **internal model** of the environment to predict the consequence of its actuations. Crucially, it closes the loop around the task without human intervention at every step. The disagreement online is rarely about this architecture; it is about whether the **state estimation** is reliable enough to trust the **constraint enforcement**.

  The friction arises because most so-called "Agents" are actually open-loop scripts wrapped in probabilistic logic, claiming closed-loop **stability margins** they cannot guarantee. The debate is muddled because vendors conflate "automation" (executing a fixed script) with "agency" (adapting the script to maintain an objective under disturbance). In your world, an interlock is not an agent; it is a hard constraint. An MPC is closer, but its model is identified and validated. Online, an "Agent" is often just an MPC with an unvalidated model and no SIL rating.

  The core disagreement is not about capability, but about **authority**. In a Tool, authority remains with the human (manual mode). In an Agent, authority is delegated to the controller (auto mode). The fear is that the **degraded modes** are undefined: if the **state estimation** diverges (hallucination), does the system fail safe, or does it actuate confidently towards the wrong **objective**?

  ### Residue Report

  | claim (in the AI debate's own words) | control-engineering restatement | status | what gets lost or smuggled in | verdict: is this a gap in my vocabulary, or a place where the debate is just muddled? |
  | :--- | :--- | :--- | :--- | :--- |
  | "Agents take actions on their own." | The controller drives actuators without human confirmation on every scan cycle. | Clean | Smuggles in the assumption that the action is valid. In CE, we validate the logic before commissioning. | The debate is muddled. It conflates execution with authority. |
  | "Agents understand context." | The controller maintains a robust state estimation despite noisy sensors. | Distorted | "Understand" implies semantic comprehension. In CE, it's just observer convergence. | Gap in their vocabulary. They anthropomorphise state estimation. |
  | "Agents are autonomous." | The loop is closed locally; the human is supervisory only. | Clean | Often ignores that the human is still responsible for the high-level setpoint. | Muddled. Autonomy is a spectrum of loop closure, not a binary state. |
  | "Agents might go rogue." | The controller destabilises due to model mismatch or unmodelled disturbances. | Clean | "Rogue" implies intent. In CE, it's just instability or windup. | Muddled. It's a stability margin issue, not a moral one. |
  | "You can't switch them off." | The system lacks a defined degraded mode or hard interlock to override the controller. | Distorted | Software always has a kill switch physically. The claim is about logical override authority. | Gap in their vocabulary. They mean "hard to override safely," not physically impossible. |
  | "Agents learn from experience." | Adaptive control where the internal model parameters are updated online. | Clean | Ignores that adaptive control requires strict stability proofs (Lyapunov) which LLMs lack. | Muddled. They confuse parameter tuning with structural change. |

  ### Hunch Evaluation

  | hunch | best restatement in your terms | does it survive | what would pin it down properly |
  | :--- | :--- | :--- | :--- |
  | **1. Loop-closure latency** | The prediction horizon of the controller exceeds the sampling rate of human oversight. | Yes | Measure the ratio of agent action frequency to human review frequency. If >1, the human is open-loop. |
  | **2. Endogenous re-specification** | The controller modifies its own objective function without exogenous input. | Yes | This is the critical failure mode. In CE, setpoints are hard-limited. In AI, the loss function can drift. |

