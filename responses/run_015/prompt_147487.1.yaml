answer: |-
  Here's the bottom line: mixing up these rights lets people enforce social vetoes that keep housing scarce even after the law changes, because you're trying to solve a social claim problem with a legal liberty solution.

  Here's the breakdown on the rights stuff. A **claim-right** means someone owes you something (like the city owes you shelter); a **liberty-right** means no one can stop you from doing something (like building on your land). The NIMBY vs. YIMBY framing collapses because both sides swap these mid-argument. NIMBYs argue from liberty ("it's my property") but enforce a claim ("you owe me a stable neighborhood view"). YIMBYs argue from liberty ("let us build") but demand a claim ("people are owed housing"). When you don't distinguish them, you can't identify who has the duty to act. If housing is a claim-right, the state must build it; if building is a liberty-right, the state must step back. Mixing them means everyone is shouting about duties that don't exist under the framework they're actually using.

  This connects directly to your neighbor's "shadow zoning" and the economist's scarcity argument. Standard economics says scarcity is artificial because *legal* zoning restricts supply. But shadow zoning proves scarcity is also *socially* enforced through norms, harassment, and unwritten agreements among owners. This breaks the standard argument because changing the law (liberty-right) doesn't remove the social pressure (claim-right). If long-time owners believe they have a moral claim to neighborhood character, they will use shadow zoning to block projects even if the new upzoning legally allows them.

  The dependency here is critical: the rights confusion is the fuel that makes shadow zoning effective. Because everyone treats their preference for low density as a "right" (ambiguous between claim and liberty), developers face non-legal costs that maintain artificial scarcity despite upzoning. You can't fix the scarcity purely through deregulation if the community believes they hold a claim-right that overrides your liberty-right to build.

  Verdict: Confusing legal liberties with social claims allows shadow zoning to maintain artificial scarcity even when statutory zoning changes.
