answer: |-
  # The Biographical Morality Tree

  Use this decision tree to sort members of your discussion group. Start at the root and follow the claims they agree with most. Note that some branches terminate early because later questions become irrelevant (e.g., if you smooth out flaws, you don't need to ask if flaws contaminate virtue).

  ### **Node 1 (Root): The Accuracy Claim**
  > *"A biography teaches best when it presents the subject exactly as they were, flaws included."*

  *   **DISAGREE (Smooth the Story):** Go to **Node 2**.
  *   **AGREE (Show the Flaws):** Go to **Node 2**.

  ---

  ### **Node 2: The Relatability Claim**
  > *"To learn from a life, I need to see my own struggles reflected in the subject."*

  *   **DISAGREE (I learn from distance):**
      *   *If you smoothed the story (Node 1 Disagree):* → **Leaf 1: The Marble Saint Admirer**
      *   *If you showed the flaws (Node 1 Agree):* → Go to **Node 4**.
  *   **AGREE (I learn from similarity):**
      *   *If you smoothed the story (Node 1 Disagree):* → **Leaf 2: The Hagiographic Mirror**
      *   *If you showed the flaws (Node 1 Agree):* → Go to **Node 3**.

  ---

  ### **Node 3: The Contamination Claim**
  *(Only for those who want Accuracy + Relatability)*
  > *"Personal cruelty invalidates public virtue as a moral lesson."*

  *   **AGREE (Vice cancels virtue):** → **Leaf 3: The Empathic Purist**
  *   **DISAGREE (Virtue survives vice):** → **Leaf 4: The Complex Humanist**

  ---

  ### **Node 4: The Pairing Claim**
  *(Only for those who want Accuracy + Distance)*
  > *"Placing two lives side-by-side reveals truths neither shows alone."*

  *   **AGREE (Comparison is key):** → **Leaf 5: The Comparative Structuralist**
  *   **DISAGREE (Pairing is decorative):** → Go to **Node 5**.

  ---

  ### **Node 5: The Negative Example Claim**
  *(Only for those who want Accuracy + Distance + No Pairing)*
  > *"Studying failed or vicious lives teaches virtue just as well as studying good ones."*

  *   **AGREE (Villains instruct):** → **Leaf 6: The Full-Spectrum Realist**
  *   **DISAGREE (Only saints instruct):** → **Leaf 7: The Heroic Exclusivist**

  ---

  ### **The Leaves (Positions)**

  1.  **The Marble Saint Admirer:** You want heroes who feel larger than life. You prefer a polished narrative that emphasizes greatness over gritty truth. You learn by looking up, not looking in.
  2.  **The Hagiographic Mirror:** You want heroes who feel like *you*, but better. You prefer stories smoothed over to highlight relatable struggles without the messiness of true moral failure.
  3.  **The Empathic Purist:** You need to see yourself in the subject, but you cannot forgive moral failings. If the hero was cruel at home, their public victories teach you nothing. Consistency is the lesson.
  4.  **The Complex Humanist:** You see yourself in the subject's struggles and accept that virtue is messy. A revolutionary can be cruel to his family and still teach you about courage. You learn from the whole person.
  5.  **The Comparative Structuralist:** You don't need to relate to the subjects. You believe truth emerges from the friction between two lives (e.g., Greek vs. Roman). The structure of the comparison matters more than the individual moral status.
  6.  **The Full-Spectrum Realist:** You want accurate, distant examples and believe even villains teach virtue (by negative example). You don't need pairing; you just need the full truth, good or bad.
  7.  **The Heroic Exclusivist:** You want accurate lives, but only if they are morally commendable. You reject villains as teachers and don't care for pairing. You seek true heroes, accurately rendered.

  ---

  ### **Taxonomy Notes for the Moderator**

  **⚠️ Unstable Combination:**
  **Leaf 7 (The Heroic Exclusivist)** is logically fragile. If you demand strict **Accuracy** (Node 1) but reject **Negative Lives** (Node 5), you will eventually run out of subjects. History rarely provides flawless heroes. This position often collapses into Leaf 1 (smoothing the flaws to keep the hero) or Leaf 6 (accepting the flaws).

  **🔄 Indistinguishable Pair:**
  **Leaf 1 (The Marble Saint Admirer)** and **Leaf 7 (The Heroic Exclusivist)** often behave identically in practice. Both result in reading only about admired, distant figures. The only difference is *how* they handle the flaws: Leaf 1 denies them (hagiography), while Leaf 7 excludes the subject entirely (selection bias). In a book club, these two people will end up reading the same books.

  **🔀 The Plutarch Test:**
  Plutarch himself would likely fall into **Leaf 4 (The Complex Humanist)** or **Leaf 5 (The Comparative Structuralist)**. He admits flaws (Accuracy) but believes virtue shines through (No Contamination), and his entire project relies on the Pairing Claim. If a member agrees with Node 1, Node 3 (Disagree), and Node 4 (Agree), they are reading Plutarch as intended.
