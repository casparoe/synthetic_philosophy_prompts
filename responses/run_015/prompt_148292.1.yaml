answer: |-
  **Sestina on the Untranslatable**

  To capture strictly each lexical **form**,
  We seek the literal, plain and clear **sense**,
  But meaning suffers inevitable **loss**,
  When dragged away from its original **source**,
  Leaving behind a faint and hollow **echo**,
  Bound by the rigid, unyielding **constraint**.

  The rhyme scheme imposes a heavy **constraint**,
  Distorting the syntax, bending the **form**,
  Until the voice becomes a distant **echo**,
  And clarity yields to a poetic **sense**,
  Far removed from the truthful, living **source**,
  Where fidelity pays the price of **loss**.

  For who would wish to compound the **loss**,
  Of health, with verbal acts of **constraint**?
  The maiden lies apart from her **source**,
  While we reshape the poem's external **form**,
  To make the rhythm make a new **sense**,
  Like a bell tolling a false **echo**.

  We chase the tonal colour, not the **echo**,
  Yet every substitution brings a **loss**,
  Of logic, for the sake of aesthetic **sense**,
  A cruel and self-imposed **constraint**,
  That shatters the vessel of the **form**,
  To spill the wine far from its **source**.

  No map returns the traveller to **source**,
  No mirror gives a perfect **echo**,
  We mould the clay into a new **form**,
  Accepting each semantic **loss**,
  Under the gravity of **constraint**,
  Where only music makes a kind of **sense**.

  What profit is there in a perfect **sense**,
  If dead apart from its living **source**?
  The translator lives under **constraint**,
  Hearing only a fragmented **echo**,
  Measuring the weight of every **loss**,
  Against the beauty of the final **form**.

  No perfect **sense** survives the fading **echo**,
  Nor truth return to its original **source** without **loss**,
  Yet love imposes **constraint** to shape the **form**.
