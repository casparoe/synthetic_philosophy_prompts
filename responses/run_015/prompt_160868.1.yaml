      *   **Specific Content Requirements:**
          *   Sort provided intuitions into "real requirements" vs. "optional extras".
          *   Add missing requirements.
          *   Identify joint unsatisfiability (trade-offs) if any (student suspects Completeness + Independence + No-Circularity + Two-Routes might clash).
          *   Identify the *single most powerful requirement* for ruling out lists.
          *   Score Nyāya (4), Buddhist (2), and Modern Reliabilism (1) against the criteria.
          *   **Tone/Style:** British English. Academic but accessible (seminar level).
          *   **Deadline:** Essay due in a fortnight (needs clarity and structure).

  2.  **Deconstruct the Provided Intuitions (Sorting Task):**

      *   *Process vs. Belief-type vs. Source:* Crucial distinction. *Pramāṇa* is usually the *instrument* or *cause*, *Pramā* is the cognition/result.
      *   *Pramāṇa vs. Pramā vs. True Belief:* Non-negotiable. *Pramā* is valid cognition; *Pramāṇa* is the means. Must distinguish from lucky true belief (*yathārtha* but not *pramā*).
      *   *Characteristic Failure Mode:* Important for individuation. If two sources fail in exactly the same way, are they distinct?
      *   *Error Cases (Rope-Snake, etc.):* How to handle error without circularity? *Pramāṇa* theory usually defines validity positively, error is *viparyaya* or *apramā*.
      *   *Intrinsic vs. Extrinsic Warrant (Svataḥ vs. Parataḥ Prāmāṇya):* Huge debate (Mīmāṃsā vs. Nyāya). Regress problem is central.
      *   *Novelty (Anadhigata):* Nyāya says *pramā* must be novel. Buddhists disagree (memory can be valid). Crucial for Memory.
      *   *Independence:* Testimony depends on perception. Are they independent?
      *   *Overdetermination (Two Routes):* Seeing and being told. Does this collapse the distinction?
      *   *Non-Reflective Knowers:* Children/animals. *Pramāṇa* shouldn't require higher-order reflection (mostly).
      *   *Completeness:* Can the list prove it's complete without using a *pramāṇa*? (Self-referential problem).

  3.  **Develop the Desiderata List (The "Admission Test"):**

      *   Need to categorize these into "Non-Negotiables" (Constitutive) and "Contestable" (School-specific preferences).
      *   *Non-Negotiable:* Causal efficacy (must produce true belief), Distinction from luck, Distinction between Means (*Pramāṇa*) and Result (*Pramā*).
      *   *Contestable:* Novelty (Memory), Intrinsic Validity, Completeness, Independence.

  4.  **Address the "Non-Canon" Cases:**

      *   *Readout Case:* Is it Testimony (instrument as speaker)? Inference (model implies result)? Or a new *pramāṇa* (Instrumentation)?
      *   *Empty-Search:* Is it *Anupalabdhi* (non-apprehension) or Inference (absence of perception implies absence of object)?

  5.  **Address Joint Unsatisfiability (The "Trade-off"):**

      *   The student suspects: Completeness + Independence + No-Circularity + Two-Routes.
      *   *Analysis:* If you demand strict Independence, Testimony collapses into Perception/Inference. If you demand Completeness, you face the self-referential paradox. If you demand No-Circularity, Intrinsic Validity (*svataḥ prāmāṇya*) is hard to defend without dogmatism.
      *   *Decision:* The hardest clash is between **Independence** and **Exhaustiveness**. If every *pramāṇa* must be irreducible, the list shrinks (Buddhist view). If the list must cover all human knowledge practices (like Testimony), Independence must go.
      *   *Another Clash:* **Intrinsic Validity** vs. **Regress Stopper**. If validity is intrinsic, how do we know it's intrinsic without another *pramāṇa*?
      *   *Selection:* I will argue that **Independence** and **Exhaustiveness** are the tension point. You can't have a short list of independent sources that covers everything without reductionism.

  6.  **Identify the "Single Most Powerful Requirement":**

      *   What kills the most candidates?
      *   Is it Novelty? (Kills Memory).
      *   Is it Causal Efficacy? (Kills lucky guesses).
      *   *Winner:* **Individuation by Distinctive Causal Role (Failure Mode).** If you can't explain *how* it knows differently from the others, it's not a separate *pramāṇa*. This rules out bloated lists (Mīmāṃsā 6+) and forces the Readout/Empty-Search cases to justify their distinctness.

  7.  **Score the Schools:**

      *   *Nyāya (4):* Good on individuation, struggles with Independence (Testimony).
      *   *Buddhist (2):* Strong on Independence/Parsimony, struggles with Testimony/Absence.
      *   *Modern Reliabilism (1):* Solves Regress, kills Individuation (everything is just 'reliable process').

  8.  **Drafting the Response (incorporating British English and Tone):**

      *   *Tone:* Encouraging, rigorous, slightly conversational but academic ("fortnight", "colour", "analyse").
      *   *Structure:*
          1.  Introduction (Validating the confusion).
          2.  The Desiderata (Sorted into Constitutive vs. Contestable).
          3.  The Trade-off (Joint Unsatisfiability).
          4.  The "Killer" Criterion.
          5.  Scoring the Schools.
          6.  Application to the Two Cases (Readout & Empty-Search).
      *   *Check:* Did I answer the specific prompt about the "Readout" and "Empty-Search" cases using the desiderata? Yes, need to ensure the desiderata are built *for* that purpose.

  9.  **Refining the Content (Self-Correction during drafting):**

      *   *Correction:* The user asked for the desiderata to be built *for* the admission test job. I need to make sure the criteria explicitly help decide if "Readout" counts.
      *   *Refinement on Unsatisfiability:* The user's hunch was Completeness + Independence + No-Circularity + Two-Routes. I should address this specifically. Actually, the "Two-Routes" case (overdetermination) is usually handled by saying the *pramāṇa* is distinct even if the object is the same. The real tension is **Independence vs. Exhaustiveness**. I will stick with that but acknowledge the Circular/Regress issue too.
      *   *Refinement on "Single Requirement":* The distinction between *Pramāṇa* (means) and *Pramā* (result) is foundational, but the *Individuation* criterion is the one that actually prunes the list. I'll go with Individuation via Causal Role.
      *   *British English:* Check spellings (analyse, colour, programme, defence, manoeuvre). Check idioms ("fortnight", "spot of trouble").

  10. **Final Review against constraints:**
      *   British English? Yes.
