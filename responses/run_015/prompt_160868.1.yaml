prompt: |-
  hey! I'm doing a course on classical Indian epistemology this term (my first real go at anything outside the analytic canon) and the bit that's definately not clicking for me is the pramāṇa literature. Every week the seminar seems to be working with a different number of them: the Nyāya four — perception, inference, analogy or comparison (the wild-cow sort of case: you're told a gavaya is like a domestic cow, later you see one in the forest and recognise it), and verbal testimony; the Buddhist logicians who cut the whole thing down to just perception and inference; the Mīmāṃsā and Vedānta people who keep letting more in — postulation (the fellow is fat but never eats in the daytime, so he must be eating at night) and non-apprehension (you look at the floor, no jug is there, so you know there is no jug). My tutor says the number isn't the interesting question and what matters is what the list is supposed to do, which I think is right, but I still need an actual spec before I can write anything.

  So, before I pick a side in the essay (due in a fortnight, ugh): give me the desiderata. What does any adequate theory of the pramāṇas have to deliver — which cases it must get right, which distinctions it must keep, which results it can't contradict — with the case or consideration behind each requirement, and mark which are non-negotiable and which are really just preferences of one camp. And I want the list to do a specific job, so please build it for that: I want to use it as an admission test for candidate sources of knowledge, because the part of my paper I actually care about is two cases my tutor calls "not in the canon". (1) The readout case: you get a number off a measuring instrument, or a prediction out of a model; the number is correct and you act on it successfully, but you personally can't trace how it was produced and can't check it independently. Is that perception, inference, testimony, or would it need its own seperate slot? (2) The empty-search case: your query returns nothing, or you go through the whole folder and find no file, and you conclude the thing isn't there. Non-apprehension as a pramāṇa in its own right, or just an inference in disguise? So the desiderata should be the sort of thing that settles admissions questions rather than just vibes about how many sources there are.

  Concretely, here's what I keep circling, and I want you to sort it into real requirements versus optional extras, and add what I've missed: whether the entries are supposed to be processes, belief-types, or sources, and whether a theory has to keep pramāṇa distinct both from pramā (the true cognition it produces) and from mere true belief; whether each pramāṇa needs its own characteristic failure mode, and how the stock error cases (rope taken for a snake, a mirage, testimony from someone who's lying) get handled without the definition becoming circular — i.e. whether a pramāṇa is allowed to fail at all; whether the warrant is intrinsic to the cognition or has to be established by something else, and how either answer escapes an infinite regress; whether a pramāṇa has to deliver cognition you didn't already have, which is where memory gets awkward; whether the sources have to be independent of one another, given that testimony seems to depend on somebody else's perception or inference somewhere up the chain; what to say when one belief arrives by two routes at once (you see it and you're also told it); and whether a theory has to leave room for knowers who can't reflect on their own methods — children, animals, or honestly most of us most of the time. Also: does the list have to be complete, and how could a theory certify that without helping itself to one of the very sources it lists?

  Two more things, and these are the parts I most want. First: if some subset of these desiderata can't be jointly satisfied — my hunch is that completeness, independence, a strict no-circularity condition and a clean answer to the two-routes case can't all be had together, but tell me what you actually think and which one you'd drop and why — say so plainly, because that joint-unsatisfiability claim is the real result I'd put in the essay. Second: tell me which single requirement does the most work in ruling out otherwise popular lists. Then, and only briefly — a short paragraph or a small table — score the Nyāya four, the Buddhist two, and a modern "there's really only one thing here, reliable belief-production, so stop counting" view against your own criteria. Please write the reply in British English.
