  11. **Final Polish:** Ensure the distinction between *pramāṇa* (instrument) and *pramā* (valid cognition) is clear, as the user flagged this as confusing. Ensure the "Readout" case is analysed as potentially *Testimony* (instrument as witness) or *Inference* (data implies conclusion). Ensure "Empty-Search" is analysed as *Anupalabdhi* vs *Inference*.

  *(Self-Correction on the "Readout" case)*: In Indian terms, an instrument is often treated under Perception (if direct) or Inference (if based on marks/signs). But if it's opaque, it looks like Testimony (trusted source). I need to make sure the desiderata help decide this. The key is: Is the instrument a *conscious agent*? If not, Testimony is tricky. Nyāya allows testimony from reliable persons (*āpta*). Extending to machines requires a criterion of 'reliability' vs 'agency'.

