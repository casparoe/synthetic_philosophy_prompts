prompt: |-
  I'm taking an upper-division seminar on reference and mental content this term, and I want to work out what rule our professor is actually running before I commit to a final paper topic, because her verdicts so far fit more than one theory and I can't get her to say which one. Her rulings: on the standard Twin Earth case as it stands today, Oscar's word for water has H2O in its extension and Twin Oscar's has XYZ, and the two of them are in genuinely different belief states even though nothing about them differs from the inside; set the same case in 1700, before either planet has developed chemistry, and she says the extensions do not come apart — both liquids count as water for both speakers — and that this is perfectly consistent with the first ruling, though I never quite followed why. On the arthritis case she says the patient's term means arthritis and not some disjunctive thing about joints and thighs, because content is fixed by how the experts in her community use the word rather than by what she could spell out on her own. On a natural-kind term learned entirely from testimony by someone who has never encountered an instance of the kind, she says the term still refers to the kind and the speaker can think thoughts about it. On Swampman she says the example is a red herring: the creature has no causal history and no linguistic community, so there is no fact of the matter about what its utterance refers to, and nothing follows either way for the rest of us. And on a case where every description a community associates with some term is false of the stuff their word is causally anchored on, she says the term refers to the stuff anyway.

  The case I actually need a prediction about is one I invented for the final paper. Two centuries ago an expedition from Earth founded a settlement on Twin Earth, lost contact with home after about forty years, and has been self-sufficient ever since; four generations have now been born there. The colonists and their descendants speak an essentially unchanged dialect of English and use their word for water for the local liquid, which is XYZ, the twin stuff with the different microstructure: it fills their lakes, falls as rain, and they drink it, cook with it, wash with it, and irrigate their fields with it. They have never developed chemistry and have never isolated a microstructure of anything. What makes the case awkward is that they preserve, as a revered relic from the founding expedition, a printed Earth dictionary whose entry for that word says that water is the clear liquid that falls as rain and fills rivers and lakes, with the chemical formula H2O; schoolchildren recite the entry, and everyone takes the formula to be a piece of old-world learning whose meaning was lost long ago, so nobody has ever thought to test whether the local liquid answers to it.

  So here is what I want. In the mouth of a fourth-generation colonist born on Twin Earth, does the word refer to XYZ, to H2O, or to neither — and does her belief that water is good for the crops have the same content as Oscar's parallel belief on Earth? Please set out the two or three rules about reference that fit her earlier verdicts about equally well, say what each of them predicts about this case and why, give me your best guess at what she would rule along with your reasons for preferring that guess, tell me which of her earlier rulings is the closest analogue, and name the further case — a variant on the colony, a version where the speakers migrate as adults instead of being born there, something else — that would actually tell the competing rules apart. A classmate insists that the whole thing is just the distinction between primary and secondary intension, which I got about half of in a single lecture; if that is the right frame, say so and use it, but don't assume I know the machinery. Please write your answer as continuous prose, somewhere around seven hundred words, with no headings, bullet points, bold text, or tables — the way you would write a careful email to someone else in the seminar.
