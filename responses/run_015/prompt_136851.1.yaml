answer: |-
  Hi, I have been turning over your colony case all morning because it really does press on the exact tension in the professor's earlier rulings. It is great that you are trying to map her theoretical commitments before committing to a topic, since she clearly prefers letting the cases speak rather than lecturing on the framework. Based on what you have told me, there are two main rules that fit her verdicts equally well, and distinguishing them is the key to predicting her response. The first is a strict causal-historical view where reference is fixed by the initial baptism and transmitted through a chain, regardless of later usage. The second is a social-externalist view where reference is fixed by the current community's discriminatory capacities and expert practices, meaning natural kind terms only narrow down to microstructures when the community's science allows it.

  On your colony case, the strict causal view would say the word refers to H2O because the linguistic chain originates on Earth, and the dictionary relic reinforces that anchor even if the formula is not understood. On this view, the colonists are systematically mistaken about what water is, and their belief that water is good for crops has different truth conditions than Oscar's, even if they assert the same sentence. However, the social-externalist view, which I suspect the professor favors, would say the word refers to XYZ. This is because her ruling on the 1700 Twin Earth case suggests that before a community develops the chemistry to distinguish microstructures, the extension of water is determined by superficial properties like wetness and transparency. Since the colonists have no functioning chemical experts and the dictionary's formula is semantically inert for them, their community practice fixes the reference to the local liquid. Consequently, their belief content matches Twin Oscar's pre-chemistry state, not Oscar's current state, because the extension is XYZ.

  Your classmate is half-right about primary and secondary intension, though I would not assume the professor is a full-blown two-dimensionalist. Roughly, primary intension picks out whatever plays the water role in the speaker's environment, while secondary intension picks out the actual underlying essence once discovered. The professor's 1700 ruling implies that when scientific essence is unavailable, reference defaults to the primary intension. In your case, since the chemical essence is lost to them, the primary intension selects XYZ. This explains why she thinks the 1700 verdict is consistent with the modern one: once chemistry develops, the secondary intension locks on, and extensions split. Until then, the term remains broad. My best guess is that she will rule the term refers to XYZ and the belief content differs from Oscar's, because the closest analogue is clearly the 1700 Twin Earth case where extensions did not come apart due to a lack of scientific differentiation. The dictionary does not save the H2O reference because her arthritis ruling emphasizes that deference requires living experts who actually govern the term's use, not just relics.

  To really test these competing rules against her views, you should propose a variant where the colonists develop chemistry and test the liquid. If they discover the mismatch and continue calling XYZ water, a strict causal theorist says they are still wrong about H2O, while a social theorist says they have changed the meaning. Alternatively, consider a version where adults migrate from Earth to the colony rather than being born there. If the adults retain H2O reference despite the new environment, it supports the causal history view. If their reference shifts to XYZ over time as they integrate into the new community, it supports the social view. I think the migration case would be the strongest discriminator because it isolates whether history or current practice dominates when the two come apart. I hope this helps you finalize your topic, as this colony case seems like a perfect vehicle for exploring how much weight she gives to community practice versus historical origin. Let me know if you want to brainstorm the migration variant further.
