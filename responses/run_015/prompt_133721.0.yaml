      *   **Audience:** 16 grad students (8 Psych PhDs w/ stats background, 8 Philosophy grads w/ little stats). Mixed expertise.
      *   **Format:** 90 minutes, one room, low-tech (cards, dice, whiteboard, no laptops per person).
      *   **Goal:** Teach the Frequentist vs. Bayesian divide regarding the replication crisis, specifically focusing on *heterogeneity* vs. *false positives*.
      *   **Constraint:** Avoid the standard "p-hacking/publication bias" lesson (preregistration/N-hacking isn't the point). The point is *ambiguity of failed replication* due to unmeasured moderators.
      *   **Specific Mechanism Idea:** User suggests a "hidden moderator die" per table. Worries this rigs the game toward Bayesianism by assuming a distribution over effects upfront.
      *   **Deliverables:** Rules, materials, payoff scheme, timeline, debrief (mapping game moments to formal concepts), failure modes (null-table dig-in, loud expert), limitations of the activity.
      *   **Tone:** Frank, confident, critical of own suggestions. No fluff.

  2.  **Evaluate the "Hidden Moderator Die" Idea:**

      *   *Pros:* It creates genuine heterogeneity. It forces the "is it zero or just different here?" question.
      *   *Cons:* The user is right to worry. If the die determines the *true effect* for that table, it essentially hard-codes a random-effects model (Bayesian hierarchical structure) into the reality of the game. Frequentists *can* handle heterogeneity (meta-analysis, subgroup analysis), but the standard null-hypothesis significance testing (NHST) framework assumes a fixed effect $\theta$.
      *   *Verdict:* The die mechanism is actually *necessary* to create the phenomenon the user wants to teach (heterogeneity). However, the *interpretation* is where the divide happens. The risk isn't that it rigs the Bayesian side, but that it makes the Frequentist look incompetent rather than showing the *structural limitation* of the fixed-effect assumption.
      *   *Refinement:* To make it fairer, the "truth" shouldn't just be a die roll per table. It should be that the *procedure* interacts with the table's hidden context. But for a 90-min game, simplicity is key. The die is fine, *provided* the debrief clarifies that the Frequentist isn't "wrong" about the p-value, but "wrong" about the generalizability assumption.
      *   *Better Mechanism?* Actually, the die is the best low-tech way to simulate $\theta_i \sim N(\mu, \tau)$. The problem is how the data is generated. If I just say "Roll a d6, if 1-3 effect is 0, 4-6 effect is 5," that's a prior.
      *   *Correction:* The user wants them to *feel* the ambiguity. The die should determine the *context*, not just the effect size directly. But that's too complex. Let's stick to the die but frame it as "Lab Context" in the debrief.
      *   *Critical Feedback:* I need to tell the user that the die *does* impose a Bayesian structure on reality. That's unavoidable if you want to simulate heterogeneity. The lesson isn't "Bayes is true," it's "If reality is heterogeneous, Fixed-Effect NHST leads to conflicting decisions."

  3.  **Designing the Activity: "The Multi-Lab Consortium"**

      *   **Concept:** Each table is a "Lab." They are all testing the *same* hypothesis.
      *   **The Twist:** Some labs have a hidden constraint (the Die) that changes the underlying reality for them.
      *   **Data Generation:** Needs to be fast. Drawing cards? Rolling dice?
          *   *Idea:* Each "participant" is a card draw. Red = Success, Black = Failure.
          *   *Effect:* If Effect is Present, deck is rigged (more Reds). If Null, deck is 50/50.
          *   *Heterogeneity:* Some tables get a "Rigged" deck, some get a "50/50" deck, but they don't know which.
          *   *Wait, that's just Truth vs False.* We need *variation*.
          *   *Revised:* All tables get the *same* instructions. But the "Population" (the deck) differs.
          *   *Mechanism:* Table Secret Role.
              *   Type A (Replicable): Effect exists (Deck: 70% Success).
              *   Type B (Context-Null): Effect is zero here (Deck: 50% Success).
              *   Type C (Context-Reverse?): Maybe too complex. Let's stick to A & B.
      *   **The Conflict:** Table A finds $p < .05$. Table B finds $p > .05$.
      *   **The Decision:** They have to decide whether to "Adopt the Intervention" (bet chips).
      *   **Frequentist Move:** Table B says "Null Result, do not adopt." Table A says "Significant, adopt."
      *   **Bayesian Move:** "Combine evidence. Update belief about the *distribution* of effects."

      *   *Wait, the User's specific worry:* "Piling on more single-site replications doesn't obviously dissolve that ambiguity."
      *   *Activity Goal:* They need to realize that combining p-values (Fisher's method) assumes fixed effects. If they just vote, they get stuck.
      *   *Payoff:* Points for making the "correct" decision about the *global* utility, not just their local table.

  4.  **Developing the Mechanics (Iterative Refinement):**

      *   *Materials:* 16 people, 4 tables of 4.
      *   *Secret Info:* Each table gets an envelope. Inside: A "Lab ID" card.
          *   2 Tables get "Standard Population" (Effect $\delta = 0.5$).
          *   2 Tables get "Idiosyncratic Population" (Effect $\delta = 0$).
          *   *Crucial:* They don't know this distribution exists. They think they are all testing the *same* universal effect.
      *   *Data Collection:* 10 "participants" per table. Flip coins or draw cards.
          *   Standard: Weighted coin (e.g., 65% Heads).
          *   Idiosyncratic: Fair coin (50% Heads).
          *   *Task:* Test if Coin is biased towards Heads.
      *   *Analysis:* They calculate a p-value (binomial test) or just count successes. (Psych students can do binomial, Phil students can count).
      *   *The Clash:* Standard tables likely get sig results. Idiosyncratic tables likely get nulls.
      *   *The Choice:* "Consortium Vote." Do we publish this as a robust finding?
      *   *The Trap:* If they vote by majority of tables, it might split 2-2. If they pool data, they get a moderate effect.
      *   *The Bayesian Pivot:* In the debrief, reveal the Lab IDs. The question becomes: "What is the probability the effect exists in *your* lab?" vs "What is the average effect?"

      *   *Critique of this design:* It's a bit standard. How to make it about *decision making under uncertainty*?
      *   *Payoff:* Chips.
          *   Cost to "Implement" = 5 chips.
          *   Payoff if Effect Real = 10 chips.
          *   Payoff if Effect Null = -10 chips (Loss).
          *   *Twist:* The payoff depends on the *Global Truth*, but the cost is local.
          *   *Better:* The payoff depends on *their specific table's truth*.
          *   If Table A (Effect Real) Implements: Win.
          *   If Table B (Effect Null) Implements: Lose.
          *   If Table B (Effect Null) Does Nothing: Break even.
          *   *Problem:* This encourages local optimization. The lesson is about *generalization*.
          *   *Revised Payoff:* You are a Funding Agency. You have to decide whether to fund a *multi-lab rollout*.
          *   If you fund: You pay cost for ALL tables. You get return only from Tables where Effect is Real.
          *   This forces them to estimate the *base rate* of the effect (the Prior).

  5.  **Addressing the "Rigged Bayesian" Worry:**

      *   The user asks: *Does the die rig the thing toward Bayesian side?*
      *   *Answer:* Yes, structurally. Because the "Truth" is generated from a distribution. Frequentist properties are long-run frequencies under *fixed* parameters. If the parameter varies, the Frequentist guarantee (Type I error control) applies to the *process*, but not necessarily to the *specific inference* about a universal law.
      *   *Honesty:* I must tell the user that you cannot simulate heterogeneity without implicitly creating a hierarchical structure. The "Frequentist" lesson isn't that the math is wrong, but that the *model specification* (Fixed Effect) was mismatched to reality. The activity *must* make the Fixed Effect assumption explicit in the instructions ("Test if the coin is biased") while the reality violates it.

  6.  **Drafting the Plan:**

      *   **Title:** "The Consortium Gamble."
      *   **Setup:** 4 Tables. 2 "Stable" (Biased Coin), 2 "Volatile" (Fair Coin).
      *   **Round 1:** Local Data & Decision. (Each table decides: Is it biased?)
      *   **Round 2:** The Consortium. (Tables share summary stats, not raw data. Must decide on a joint policy.)
      *   **Round 3:** The Reveal & Payoff.
      *   **Materials:** Coins (or cards), Envelopes (Secret Lab Type), Chips, Whiteboard.
      *   **Timeline:** 15 min setup, 30 min Round 1, 20 min Round 2, 25 min Debrief.
      *   **Failure Modes:**
          *   *Null Table Dig-in:* They feel stupid. *Fix:* Frame null results as "valuable info about boundary conditions."
          *   *Loud Expert:* They explain the trick. *Fix:* Give them a role ("Data Auditor") that requires them to record, not interpret.
          *   *Confusion:* Phil students lost on p-values. *Fix:* Use simple counts (Heads > 7?) and provide a lookup table for "Significance."

  7.  **Refining the Debrief (The Crucial Part):**

      *   Map the "Secret Envelope" to $\tau$ (heterogeneity variance).
      *   Map the "Consortium Vote" to Meta-analysis.
      *   Map the "Funding Decision" to Expected Utility (Bayesian).
      *   Map the "Local P-value" to $P(Data | H_0)$.
      *   *Key Insight:* The Frequentist controls false positives *per test*. The Bayesian controls false decisions *across contexts*.

  8.  **Self-Correction/Confidence Check:**

      *   *Confidence:* High on the structure, Medium on the timing. 90 mins is tight for 4 tables to collect data.
      *   *Fix:* Reduce N per table. 10 trials is enough for a binomial test intuition.
      *   *Confidence on "Rigged":* I need to be very clear. The activity *cannot* show why Frequentism is valid for fixed effects. It is designed to break fixed effects. I need to state this limitation clearly.
      *   *Confidence on "Loud Expert":* Giving them a job is standard facilitation, but I should suggest a specific constraint (e.g., "You are the Scribe, you cannot speak until the voting phase").

  9.  **Final Polish:**

      *   Make the payoff abstract (Points) to avoid money issues.
      *   Ensure the "Die" mechanism is hidden until the end.
      *   Ensure the Psych students don't just do the math and bore the Phil students. Mix the groups at tables.

