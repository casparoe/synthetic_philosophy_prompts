answer: |-
  ### Frank Assessment of Your "Moderator Die" Idea

  You are right to be suspicious. **Yes, the die mechanism structurally rigs the game toward the Bayesian side.**

  Here is why: By assigning effect sizes via a random draw (the die) before the experiment begins, you are literally instantiating a **prior distribution over effect sizes** ($\theta \sim \text{Distribution}$). This is the definition of a hierarchical Bayesian model. A Frequentist framework assumes $\theta$ is fixed but unknown. If you build the game so $\theta$ is literally random, the Frequentist model is *misspecified by design*.

  **However,** this is not a bug; it is the feature you need, provided you frame it correctly. You cannot teach the failure of Fixed-Effect NHST in a world where effects are actually fixed. To create the ambiguity you want ("Is this a false positive or a boundary condition?"), reality *must* be heterogeneous.

  **The Fix:** Do not tell them the die determines the *truth*. Tell them the die determines the **Lab Context**.
  *   **Frequentist Assumption (Implicit):** "Lab Context is noise; we are estimating the Universal Effect."
  *   **Bayesian Reality (Explicit in Debrief):** "Lab Context is a parameter; we are estimating the Distribution of Effects."

  The activity works not because Bayes is "true," but because the **Frequentist decision rule (Reject/Fail to Reject $H_0$) collapses when the assumption of exchangeability is violated.**

  Below is the design. It is tight, high-tension, and requires zero laptops.

  ---

  ### Activity: "The Consortium Gamble"

  **Core Concept:** Four "Labs" test the same intervention. Two Labs are in a "Responsive" population, two are in a "Null" population. They don't know this. They must decide whether to jointly fund a rollout.

  **Materials:**
  *   4 Decks of Cards (prepared in advance).
      *   **Deck Type A (Responsive):** 7 Red, 3 Black (70% success rate).
      *   **Deck Type B (Null):** 5 Red, 5 Black (50% success rate).
      *   *Prep:* Create 2 Type A decks and 2 Type B decks. Seal them in envelopes labeled "Lab Kit 1-4".
  *   4 Envelopes labeled "Secret Protocol" (Empty for now, used in debrief).
  *   Poker chips (3 colors: White, Blue, Red).
  *   Whiteboard & Markers.
  *   Printed "Decision Sheets" (one per table).

  **Grouping:**
  *   4 Tables of 4 people.
  *   **Crucial:** Mix the disciplines. 2 Psych + 2 Phil per table. The Psych students know how to calculate significance; the Phil students know how to argue about uncertainty. They need each other.

  ---

  ### Payoff Scheme (The "Grant")

  Use chips. No real money.
  *   **Endowment:** Each table starts with **10 White Chips**.
  *   **Cost of Action:** To "Adopt Intervention," a table must bet **5 Chips**.
  *   **Payoff:**
      *   If the Intervention **Works in your Context**: You get **15 Chips** back (Net +10).
      *   If the Intervention **Fails in your Context**: You lose the bet (Net -5).
      *   If you **Do Nothing**: You keep your 5 Chips (Net 0).
  *   **The Kicker (Consortium Bonus):** If *all four tables* make the *same* decision (All Adopt or All Pass), everyone gets a **+5 Chip Bonus**. This forces communication and creates the conflict: Do we standardize on the majority, or respect local data?

  ---

  ### Timeline (90 Minutes)

  **0:00 – 0:10 | Setup & Instructions**
  *   Seat them. Hand out Lab Kits.
  *   **Script:** "You are one of four labs in a consortium. You are testing a new cognitive intervention. Red cards = Patient Improved. Black = No Change. You have 10 'patients' (draws). Draw with replacement. Record your Red/Black count."
  *   **Constraint:** "You do not know the other labs' conditions. You assume you are all testing the *same universal effect*." (This sets the Fixed-Effect trap).
  *   **Task:** Calculate your local success rate. Decide: Is this effect real? (Psych students can do a binomial test; Phil students can argue thresholds).

  **0:10 – 0:35 | Round 1: Local Data & Private Bet**
  *   Tables draw 10 cards each. Record results.
  *   **Private Vote:** Each table secretly writes on a slip: **ADOPT** or **PASS**.
  *   Collect slips. Do not reveal yet.
  *   *Expected Outcome:* Type A labs (7/3) will likely see $p < .05$ (Binomial $k \ge 8$ is sig at .05). Type B labs (5/5) will see noise.
  *   *Tension:* Type A wants to Adopt. Type B wants to Pass.

  **0:35 – 0:55 | Round 2: The Consortium Meeting**
  *   **Reveal:** Tables share their *counts* only (e.g., "We got 8 Reds"). They do **not** reveal their decks or secret types.
  *   **Task:** They must negotiate a **Joint Policy**.
  *   **Rule:** If they agree on a Joint Policy (All Adopt or All Pass), they trigger the **Consortium Bonus**. If they disagree, they play their Private Vote scores individually.
  *   **The Trap:**
      *   Type A Labs argue: "The aggregate data is 25/40 (62%). That's significant! We should Adopt." (Pooled Frequentist).
      *   Type B Labs argue: "Our local data is null. If we Adopt, we lose chips. We should Pass." (Local Frequentist).
      *   **The Conflict:** Pooled data says "Go." Local data says "Stop." Heterogeneity is invisible.

  **0:55 – 1:15 | Round 3: The Reveal & Payoff**
  *   Open the "Lab Kits". Reveal the Decks.
  *   **Type A Tables:** You had a real effect. If you Adopted, you win big.
  *   **Type B Tables:** You had a null effect. If you Adopted, you lost chips.
  *   **Calculate Scores:** Tally chips. Announce the winner.

  **1:15 – 1:30 | Debrief (The Formal Map)**
  *   (See script below).

  ---

  ### Debrief Script: Mapping Moments to Formalism

  Do not lecture. Ask questions that force them to map the game to the stats.

  **1. The Ambiguity of Failure (10 mins)**
  *   *Ask Table B (Null Result):* "You failed to reject. Why?"
      *   *Expected:* "No effect."
      *   *Push:* "Or was there an effect that doesn't work *here*?"
  *   *Map:* "In the game, the Deck Type was hidden. In science, the **Moderator** is hidden. A failed replication is $P(Data | H_0)$ is high. It is *not* $P(H_0 | Data)$ is high. You treated a null result as proof of no effect, rather than proof of *contextual mismatch*."

  **2. The Pooling Trap (10 mins)**
  *   *Ask the Group:* "Those who argued to pool the data (25/40 Reds), why?"
      *   *Expected:* "More power. Better estimate."
  *   *Map:* "You assumed a **Fixed Effect Model**. You assumed $\theta_{Lab1} = \theta_{Lab2}$. If that assumption is true, pooling is optimal. If $\theta$ varies (Random Effects), pooling averages over distinct realities. You calculated a precise mean for a distribution that doesn't exist."
  *   *The Frequentist Limit:* "Frequentist NHST controls Type I error *assuming the model is correct*. It does not tell you if the model (Fixed Effect) matches reality."

  **3. The Bayesian Pivot (5 mins)**
  *   *Ask:* "What information would have saved the Type B labs from losing chips?"
      *   *Expected:* "Knowing there were two deck types."
  *   *Map:* "That is a **Prior**. Specifically, a prior on the *variance* of effects ($\tau$). A Bayesian approach asks: 'What is the probability this effect generalizes to *my* context?' not 'Is the global mean non-zero?'"
  *   *The Lesson:* "Preregistration wouldn't have helped. You preregistered 'Test if Deck is Biased.' You didn't preregister 'Test if Deck Type Varies.' The crisis isn't p-hacking; it's **model misspecification**."

  ---

  ### Predictable Failure Modes & Mitigation

  **1. The "Null Table" Dig-In**
  *   *Risk:* Table B gets 5 Reds/5 Blacks. They conclude "Effect is fake." They feel vindicated when revealed, but miss the point about heterogeneity.
  *   *Fix:* In the debrief, emphasize utility. "You saved your local chips, but if you had known the *distribution*, you could have bet on Table A's success. Science isn't just local safety; it's generalization. You failed to generalize."

  **2. The "Loud Expert" (Psych PhD)**
  *   *Risk:* They calculate the exact binomial p-values immediately, dominate the conversation, and treat the Phil students as laypeople.
  *   *Fix:* **Role Assignment.** Hand out role cards at the start.
      *   *The Statistician (Psych):* Calculates the numbers. Cannot make the final decision.
      *   *The Auditor (Phil):* Checks the logic. Has veto power on the "Joint Policy" if the reasoning is inconsistent.
      *   *The Treasurer:* Manages the chips.
      *   *The Spokesperson:* Only person allowed to talk to other tables.
      *   *Why:* This forces the Psych student to translate math into constraints, and the Phil student to engage with the data to audit it.

  **3. The "Pool Everything" Rout**
  *   *Risk:* They pool data immediately in Round 2, ignore local nulls, and everyone Adopts. Type B tables lose chips. They blame the game.
  *   *Fix:* This is actually the *desired* failure. It proves the point. In the debrief, highlight the Type B losses. "You optimized for the Global Mean and sacrificed Local Validity. This is exactly what happens when we ignore heterogeneity in meta-analysis."

  ---

  ### Limitations: What This Activity Cannot Do

  Be honest with your group about these boundaries.

  1.  **It Cannot Justify Subjective Priors:** The game uses an *objective* frequency (the decks) to simulate the prior. It does not teach how to elicit a subjective prior from expert knowledge. It shows why we *need* a distribution, not how to *choose* one.
  2.  **It Simplifies the Frequentist Defense:** A sophisticated Frequentist would say, "Run a test for heterogeneity ($Q$-statistic) before pooling." You don't have time to teach Cochran's Q. You must acknowledge: "A careful Frequentist *could* detect this with enough labs. But with only 4 labs (typical in psych), tests for heterogeneity have no power. You are in the power-sinkhole where Bayes shines."
  3.  **It Doesn't Solve Publication Bias:** This activity assumes all 4 labs report data. It isolates heterogeneity from the file-drawer problem. Make sure they know this is a *specific* slice of the replication crisis.

  ### Confidence Check

  *   **The Mechanism:** High confidence. Card decks are robust, low-tech, and clearly demonstrate probability differences.
  *   **The Lesson:** Medium-High confidence. The leap from "Deck Types" to "Hierarchical Priors" is abstract. You must work hard in the debrief to ensure they don't just think "Oh, some labs are different." They need to hear "The *parameter itself* is a random variable."
  *   **The Timing:** Low confidence. 90 minutes is aggressive. If Round 1 drags, cut the Consortium Bonus negotiation. Let them vote by majority if they stall. The *conflict* matters more than the *agreement*.

  **Final Advice:** If the "Loud Expert" tries to explain the solution during Round 2, stop them. "Save that for the debrief. The point is to feel the confusion, not solve it yet." The learning happens in the friction, not the resolution.
