answer: |-
  ## The Council Safety Protocol (CSP)
  **Purpose:** To prevent hasty, unfeasible, or punitive decisions inspired by emotion rather than reason. Based on historical lessons regarding cooling-off periods, expert consultation, and minority rights.
  **Format:** Print this single page for the Chair and Parliamentarian.

  ### PHASE 1: CLASSIFICATION (Before Debate Begins)
  *The Chair asks the Sponsor to categorize the motion.*

  1.  **Is this punitive?** Does this target a specific person or group for punishment, removal, or censure?
      *   **YES:** Go to **The Shield (Phase 3)**.
      *   **NO:** Go to Question 2.
  2.  **Is this high-cost/high-impact?** Does this spend >25% of remaining budget, commit to next year, or change a major school rule?
      *   **YES:** Go to **The Reality Check (Phase 2)**.
      *   **NO:** Standard debate rules apply.
  3.  **Is this urgent?** Is there a genuine safety/legal deadline requiring a vote *today*?
      *   **YES:** **[ADVISOR JUDGMENT]** required to confirm urgency.
      *   **NO:** Go to **The Cool-Down (Phase 4)**.

  ---

  ### PHASE 2: THE REALITY CHECK (Feasibility & Expertise)
  *Triggered by High-Cost/Impact motions (See Athens: Sicilian Expedition).*

  1.  **Has the Treasurer spoken?** The Treasurer must speak to budget impact before general debate.
      *   *Sufficient Answer:* A specific dollar amount and remaining balance.
  2.  **Has the Advisor spoken?** The Advisor must speak to logistical/legal feasibility.
      *   *Sufficient Answer:* "Feasible," "Not Feasible," or "Feasible with conditions."
  3.  **Has organized dissent been heard?** If no one speaks against the motion, the Chair **must** appoint a "Devil's Advocate" (a neutral member) to list three risks.
      *   *Sufficient Answer:* Three specific risks (cost, time, participation).
  4.  **[CHAIR JUDGMENT]:** If experts warn of failure, does the Council vote to proceed anyway?
      *   **YES:** Vote is valid, but warnings are recorded in minutes.
      *   **NO:** Motion is sent to committee for revision.

  ---

  ### PHASE 3: THE SHIELD (Rights & Punishment)
  *Triggered by Punitive motions (See Athens: Trial of Socrates).*

  1.  **Is the target present?** The accused person must be allowed to speak in their own defense before any vote.
  2.  **Is the charge specific?** "Disloyalty" or "Bad Character" is insufficient. Charges must cite specific violated rules.
      *   **[ADVISOR JUDGMENT]:** Advisor must confirm a specific school or council rule was broken.
  3.  **What is the vote threshold?** Punitive actions require a **2/3 Supermajority**, not a simple majority.
  4.  **Protection of Speech:** If the "offense" was expressing an opinion (editorial, speech, complaint), the motion is **Out of Order** unless it violates harassment policies.

  ---

  ### PHASE 4: THE COOL-DOWN (Timing & Emotion)
  *Triggered by Non-Urgent, High-Emotion motions (See Athens: Mytilene Debate).*

  1.  **Is emotion high?** Are members shouting, cheering, or speaking personally rather than on the issue?
      *   **[CHAIR JUDGMENT]:** If YES, pause debate for 2 minutes of silence.
  2.  **Is this irreversible?** If passed, can it be easily undone next week?
      *   **NO (Hard to Undo):** Vote **must** be delayed to the next meeting.
      *   **YES (Easy to Undo):** Vote may proceed today.
  3.  **The "Second Thought" Rule:** If a vote passes on a high-emotion issue, any member can move to "Reconsider" at the next meeting without needing a second.

  ---

  ### IMPLEMENTATION NOTES
  *   **Advisor Veto:** The Faculty Advisor retains final sign-off on all actions per school bylaws. This protocol advises *them* as well.
  *   **Minutes:** The Secretary must record when this protocol was triggered and which steps were completed.

  ***

  ## Application of the Protocol to Live Proposals

  Here is how the CSP applies to your three scenarios. In each case, I will act as the Parliamentarian guiding the Chair.

  ### Scenario 1: The Phone Ban (Immediate Reaction)
  **Context:** Cheating incident occurred this morning. Sponsors want to ban phones at lunch *today*. Anger is high.
  **My Position:** I personally want this ban to pass.
  **Protocol Application:**
  1.  **Phase 1 (Classification):** Is it urgent? Sponsors say "Yes, to stop cheating."
      *   *[ADVISOR JUDGMENT]:* Advisor notes cheating happened in class, not lunch. Lunch ban does not solve the immediate safety threat. Urgency denied.
  2.  **Phase 1 (Classification):** Is it irreversible? A ban is hard to enforce and creates resentment.
      *   *[CHAIR JUDGMENT]:* Chair rules this is "Hard to Undo" socially.
  3.  **Phase 4 (Cool-Down):** Triggered.
      *   **Action:** Vote **must be delayed** to next Tuesday.
      *   **Requirement:** Sponsors must draft an enforcement plan and present it next week.
  4.  **Outcome:** **BLOCKED/DELAYED.** Even though I (Parliamentarian) and the majority want this now, the protocol forces a "night of reflection" equivalent. This prevents the "Mytilene" error of voting in anger and reversing later.

  ### Scenario 2: The Leadership Retreat (Budget & Enthusiasm)
  **Context:** Proposal to spend $1,800 of a $2,000 budget on a trip. Treasurer says it leaves no money for dances. Advisor says buses are scarce. Members are cheering.
  **Protocol Application:**
  1.  **Phase 1 (Classification):** Is it high-cost? Yes (>25% of budget).
      *   **Action:** Trigger **Phase 2 (Reality Check)**.
  2.  **Phase 2 (Expertise):**
      *   **Treasurer:** Reports remaining balance would be $200.
      *   **Advisor:** Reports bus availability is "Uncertain."
  3.  **Phase 2 (Dissent):** Members are ignoring warnings.
      *   **Action:** Chair appoints a Devil's Advocate. They list risks: "No Homecoming Dance," "Bus Cancellation," "Refund issues."
  4.  **Phase 2 (Judgment):**
      *   *[CHAIR JUDGMENT]:* Chair asks, "Does Council wish to vote knowing the Treasurer warns of insolvency?"
      *   **Action:** Council votes to proceed, *but* minutes record the Treasurer's warning.
  5.  **Outcome:** **PROCEEDS WITH WARNING.** The vote isn't blocked, but the "Sicilian" error is mitigated. The record shows the experts were heard. If the trip fails, the Council cannot claim they weren't warned. This protects the Council's credibility later.

  ### Scenario 3: The Newspaper Representative (Punishing Speech)
  **Context:** Motion to remove the Newspaper Rep because their editorial criticized the Council. Charge is "Disloyalty."
  **Protocol Application:**
  1.  **Phase 1 (Classification):** Is this punitive? Yes (Removal from seat).
      *   **Action:** Trigger **Phase 3 (The Shield)**.
  2.  **Phase 3 (Specific Charge):**
      *   **Charge:** "Disloyalty."
      *   *[ADVISOR JUDGMENT]:* Advisor confirms "Disloyalty" is not a violation of the Student Council Constitution.
      *   **Action:** Motion is ruled **Out of Order** unless amended to cite a specific rule (e.g., "Disclosure of Private Financial Data").
  3.  **Phase 3 (Protection of Speech):**
      *   **Fact:** The offense was an editorial (speech).
      *   **Action:** Unless the editorial was libelous or harassing, the protocol protects the speech.
  4.  **Phase 3 (Threshold):**
      *   **Action:** Even if amended, removal requires a 2/3 vote, not a majority.
  5.  **Outcome:** **BLOCKED.** The protocol prevents the "Socrates" error. It stops the Council from punishing a member for doing their job (reporting news), even if the majority is annoyed.

  ***

  ## Limitations and Honest Conclusion

  As Parliamentarian, you must understand where this procedure will fail. A checklist cannot fix culture.

  1.  **The "Rubber Stamp" Risk:** If the Advisor is passive, they may sign off on "Urgency" (Phase 1) just to end the meeting early. The protocol relies on the Advisor actually exercising judgment.
  2.  **Time Pressure:** In a 45-minute meeting, Phase 2 (Reality Check) can eat 20 minutes. Members may resent the delay and try to suspend the rules to bypass the protocol. You will need the Chair's firm support to enforce it.
  3.  **Majority Tyranny:** In Scenario 2, the Council *could* still vote to ignore the Treasurer. The protocol forces them to hear the warning, but it cannot force them to be wise. It only creates a record of their folly.
  4.  **Social Cost:** Using "The Shield" to protect an unpopular member (Scenario 3) may make *you* and the Chair unpopular. You will be accused of "protecting enemies." You must be prepared to explain that you are protecting the *process*, not the person.

  **Final Verdict:** This procedure will not stop bad decisions entirely. It will, however, slow down the *worst* decisions enough that reason has a chance to intervene. It shifts the burden from "stopping a bad idea" to "following the steps." If the steps are followed, the Council owns the outcome, good or bad.
