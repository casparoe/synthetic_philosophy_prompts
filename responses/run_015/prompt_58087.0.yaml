prompt: |-
  I am a high school junior serving as parliamentarian for our student council, and I am trying to turn what we studied about ancient Athens into something my council can actually use.

  We discussed three failures of Athenian democracy in class. In the first, the assembly angrily voted to punish a rebellious allied city with extreme severity and then, after a night of reflection and a second debate, reversed itself the next day. In the second, the assembly was persuaded by enthusiastic speeches to approve a large, distant military expedition, brushed aside warnings from more cautious and experienced commanders about cost, distance, and poor information, and suffered a catastrophe. In the third, a large citizen jury convicted a philosopher who questioned conventional views and annoyed prominent people, on broad charges of impiety and corrupting the young.

  Our council meets for about forty-five minutes each Tuesday with thirty members between the ages of fourteen and eighteen. We decide matters such as dance budgets under two thousand dollars, spirit week plans, and recommendations to the administration on phone use and club funding. None of us has training in history or philosophy, our faculty advisor must sign off on any action, and we are under constant pressure to vote quickly when feelings run high. I need a reusable procedure, not advice on a single vote: a step-by-step checklist or flowchart in words that a chair with no background in theory could follow in real time and that would fit on one page if summarized.

  Please design that procedure so it preserves the core lessons of the three Athenian cases while dropping details that do not transfer to a school setting. It should specify in order the questions to ask, what counts as a sufficient answer at each step, when a vote must be delayed to a second meeting, when dissenting or expert voices must be heard, and what protections apply when the target of a proposal is an unpopular person or view. Mark clearly the points where judgment cannot be eliminated and must be exercised by the chair or advisor.

  Then run the procedure step by step on three live proposals: a proposal to ban phones during lunch immediately after a cheating incident, where sponsors demand a same-day vote while anger is high; a proposal to spend most of our annual budget on an ambitious overnight leadership retreat in another city, promoted with great enthusiasm while warnings from the treasurer and advisor about cost and logistics are being dismissed as negativity; and a proposal to remove our newspaper representative from the council after an editorial sharply criticizing the council and administration, on grounds of disloyalty and bad character. Include at least one application where the procedure blocks or delays what I and a majority currently want, and conclude with an honest statement of what the procedure cannot do and where it is likely to misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** High school junior, Student Council Parliamentarian.
      *   **Goal:** Create a reusable procedure (checklist/flowchart) based on three specific failures of Athenian democracy to improve Student Council decision-making.
      *   **Constraints:**
          *   Must fit on one page (summarized).
          *   Must be usable by a chair with no theory background in real-time (45-min meetings, 30 members, ages 14-18).
          *   Must address specific issues: hasty votes, ignoring experts/logistics, punishing unpopular views/people.
          *   Must specify: Questions to ask, sufficient answers, delay triggers, dissent/expert requirements, protections for unpopular targets.
          *   Must mark points of required judgment (Chair/Advisor).
      *   **Task:** Design the procedure, then apply it to three specific scenarios (Phone Ban, Budget/Retreat, Newspaper Rep Removal).
      *   **Requirement:** At least one application must block/delay what the majority *wants*.
      *   **Conclusion:** Honest statement on limitations/failure points.

  2.  **Deconstruct the Athenian Lessons:**
      *   *Case 1 (Mytilenean Debate):* Hasty emotional vote reversed later. *Lesson:* Cool-off periods for severe/irreversible decisions.
      *   *Case 2 (Sicilian Expedition):* Ignoring logistics/experts due to enthusiasm. *Lesson:* Mandatory consideration of feasibility/cost/expert dissent before voting.
      *   *Case 3 (Trial of Socrates):* Punishing unpopular speech/views. *Lesson:* Protections for minority speech/dissent, high bar for punitive actions against individuals.

  3.  **Drafting the Procedure (The "Athenian Safety Valve" Protocol):**
      *   *Context:* 45 mins, 30 teens, faculty advisor oversight. Needs to be snappy but effective.
      *   *Structure:* Pre-Motion, Debate, Voting, Post-Vote.
      *   *Key Mechanisms:*
          *   "The Cool-Down" (for Case 1).
          *   "The Reality Check" (for Case 2).
          *   "The Shield" (for Case 3).
      *   *Judgment Points:* Need to clearly label where the Chair or Advisor steps in.

      *Drafting the Steps:*
      1.  *Introduction:* Is this punitive? Is this expensive? Is this urgent?
      2.  *Expertise:* Have we heard from the person who knows the numbers/rules? (Treasurer/Advisor).
      3.  *Dissent:* Has someone spoken *against* this?
      4.  *Timing:* Does this need a sleep-over?
      5.  *Rights:* Is this targeting a specific person's speech?

      *Refining for High School Context:*
      *   Instead of "Assembly," use "Council."
      *   Instead of "Generals," use "Treasurer/Advisor/Committee Head."
      *   Instead of "Execution," use "Expulsion/Ban/Punishment."
      *   Keep language simple.

  4.  **Developing the Scenarios:**

      *   *Scenario 1: Phone Ban (Case 1 Parallel).*
          *   Emotion: High (cheating scandal).
          *   Pressure: Immediate vote.
          *   Application: The "Cool-Down" triggers. Vote delayed.
          *   Outcome: Blocks immediate action (matches requirement).

      *   *Scenario 2: Leadership Retreat (Case 2 Parallel).*
          *   Emotion: Excitement.
          *   Dissent: Treasurer/Advisor warning on cost.
          *   Application: The "Reality Check" triggers. Must hear the Treasurer. If cost > threshold, needs Advisor sign-off *before* vote.
          *   Outcome: Slows down, forces budget review.

      *   *Scenario 3: Newspaper Rep Removal (Case 3 Parallel).*
          *   Emotion: Anger/Defensiveness.
          *   Target: Specific individual for speech.
          *   Application: The "Shield" triggers. High bar for removal. Protection of speech.
          *   Outcome: Makes removal very difficult/procedurally heavy.

  5.  **Refining the Procedure for "One Page" Feel:**
      *   Use bold headers.
      *   Use Yes/No logic.
      *   Clearly mark [JUDGMENT] points.

  6.  **Writing the Application Section:**
      *   Walk through each scenario step-by-step using the protocol.
      *   Ensure the "block/delay" requirement is met (Phone Ban is the best candidate for this).

  7.  **Writing the Limitations Section:**
      *   Be honest. Procedures don't fix culture. Teens might bypass it. Advisor might overrule. It takes time (45 mins is tight).

  8.  **Review against Constraints:**
      *   *Step-by-step checklist?* Yes.
      *   *Questions to ask?* Yes.
      *   *When to delay?* Yes.
      *   *Dissent/Expert voices?* Yes.
      *   *Protections for unpopular views?* Yes.
      *   *Mark judgment points?* Yes.
      *   *Three scenarios?* Yes.
      *   *One block/delay?* Yes (Phone Ban).
      *   *Honest conclusion?* Yes.
      *   *Tone:* Respectful, practical, empowering for a student leader.

  9.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the procedure too long?
      *   *Fix:* Condense the wording. Use "IF/THEN" logic.
      *   *Critique:* Did I address the Advisor's role?
      *   *Fix:* Make sure the Advisor is the final "Safety" valve in the judgment points.
      *   *Critique:* Is the connection to Athens clear?
      *   *Fix:* Add a brief intro linking the steps to the three cases (Mytilene, Sicily, Socrates) so the user sees the lineage.

  10. **Final Polish:** Check formatting for readability. Ensure the distinction between "Procedure" and "Application" is clear. (Proceed to generate output).

  *(Self-Correction Note during drafting the response)*: I need to make sure I don't just give advice, but a *tool*. The prompt asks for a "reusable procedure... that a chair with no background in theory could follow." I will create a distinct section called "The Council Safety Protocol" that looks like a handout.

  *(Check on the "One Page" constraint)*: I cannot physically enforce one page in a chat interface, but I can format it so it *could* be printed on one page (concise, bullet points). I will explicitly note this.

  *(Check on "Judgment Points")*: I will use brackets like **[CHAIR JUDGMENT]** to highlight these.

  *(Check on "Blocks what I want")*: In the Phone Ban scenario, I will explicitly state that the Parliamentarian (user) might want the ban, but the procedure stops it.

