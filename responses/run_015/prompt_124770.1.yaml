answer: |-
  **Q&A Prep Sheet: Confucian Role Ethics & Localized Ontology**

  **1. The "Relativism Trap" (Analytic Crowd)**
  *   **The Question:** "If *yi* is purely indexical and there's no universal substrate, how do you critique a role that's being performed badly? If a father abuses his son, is that just a different 'indexical shift,' or do you have any ground to call it wrong without smuggling in universalism?"
  *   **The Reply:** It's not relativism; it's contextual normativity. The standard isn't an external rule, it's the sustainability of the relational node itself. Abuse destroys the relationship, thereby negating the *yi* of the role. You don't need a universal substrate to know a bridge is broken when you fall through it.
  *   **Where You're Soft:** Defining "sustainability" without implicitly relying on universal human goods. If the relationship sustains itself through coercion, your ontology might lack the resources to condemn it.

  **2. The "Ghost in the Machine" (Agency/Constitution)**
  *   **The Question:** "You say the self is constituted by enacting roles, not constrained by them. But doesn't this eliminate the critical distance needed to change those roles? If I *am* my role, where does the agency come from to reform it?"
  *   **The Reply:** Agency isn't a pre-existing capacity; it's the creative expansion of the role through *zhengming*. You don't stand outside the role to change it; you stretch the role's boundaries by performing it differently, forcing mutual recognition to shift.
  *   **Where You're Soft:** Explaining *why* some people get to stretch roles (fathers) and others don't (sons/wives) without appealing to power dynamics you're trying to ontologize away.

  **3. The "Conceptual Imperialism" (Chinese Phil Specialist)**
  *   **The Question:** "Is mapping Austin's speech-act theory onto *zhengming* doing violence to the text? *Zhengming* is about cosmic and political order, not micro-level performative utterances. Aren't you just making Confucius sound like a Western analytic philosopher?"
  *   **The Reply:** It's a heuristic bridge, not a historical claim. I'm not saying Confucius read Austin, but that the *mechanism* of how names bind behavior works performatively. This explains *how* the normative force transfers without needing a divine command or categorical imperative.
  *   **Where You're Soft:** You might be flattening the cosmic/political scope of *zhengming* to fit your ontological model. The specialist is right that it's bigger than interpersonal recognition.

  **4. The Nuclear Option (Patriarchy/Hierarchy)**
  *   **The Question:** (From Sociology or Ethics) "Doesn't this ontological grounding just naturalize hierarchy? If the self is ontologically constituted by patriarchal roles, aren't you arguing that women are literally subordinate beings? Isn't this just conservatism with extra steps?"
  *   **The Reply:** (Concede up front) You must concede that historically, Confucianism *was* used to justify patriarchy. However, argue that your reading offers a *better* tool for dismantling it than universalism. Universalism abstracts the victim; relational ontology focuses on the brokenness of the relation. If the role harms the relation, the role loses its normative force.
  *   **Where You're Soft:** This is your biggest vulnerability. If the relational field itself is structurally rigged, "mutual recognition" is impossible. You need to pivot quickly to how this ontology allows for *role revolution* rather than just role compliance.

  **Bottom line:** The normativity isn't in the rule, it's in the relationship's viability—if the role kills the relation, it ceases to be a role.
