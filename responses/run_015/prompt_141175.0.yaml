answer: |-
  ### I. Translation of the Mechanism and Objections

  **The Core Mechanism: Bilateral Barter of Contingent Commitments**
  Formalize the proposal as a mechanism $\Gamma$ with two agents $i \in \{1, 2\}$. Let $X$ and $Y$ be public goods (bednets, roof). Each agent has an endowment of money $m_i$ and a utility function $u_i(G_1, G_2)$ over the provision levels of the goods.
  *   **Autarky (Status Quo):** Agent 1 allocates $m_1 \to X$; Agent 2 allocates $m_2 \to Y$.
  *   **Moral Trade:** Agent 1 allocates $m_1 \to Y$ conditional on Agent 2 allocating $m_2 \to X$.
  *   **Claimed Efficiency:** The proposal asserts a Pareto improvement: $u_1(\text{Trade}) > u_1(\text{Autarky})$ and $u_2(\text{Trade}) > u_2(\text{Autarky})$.
  *   **Implicit Assumption:** This requires **comparative advantage in production effectiveness** or **leverage**. If the physical outcome is identical (same money, same goods produced), there is no gain in a private-value model. The gain exists only if the trade induces *additional* provision (e.g., "I fund your project, freeing your budget to fund mine *in addition* to your original plan") or if utility functions include **warm-glow terms** (value derived from the act of giving itself) that are swapped to higher-valued targets. Without a **common cardinal scale** of moral value, the claim that "value is secured" is undefined across agents.

  **Objection 1: The Commitment Problem (Dynamic Inconsistency)**
  *   **Translation:** This is a sequential game without a binding contract. Agent 1 moves first (funds $Y$). Agent 2 observes this history. Agent 2's dominant strategy in the subgame is to defect (retain $m_2$ or allocate to $Y$), as the benefit from $Y$ is already secured by Agent 1's move.
  *   **Mechanism Failure:** The mechanism lacks **incentive compatibility (IC)** in the second stage. It requires **enforceable contracts** or an **escrow mechanism** (third-party holding of funds) to ensure **subgame perfection**. Without this, the "trade" is a non-credible threat/promise structure.

  **Objection 2: Corruption and Simony (Repugnance Constraints)**
  *   **Translation:** This invokes **repugnant transactions** (Roth). Introducing a price (quid-pro-quo) into a domain governed by social norms of unconditional giving may crowd out intrinsic motivation or violate **normative constraints** on the market.
  *   **Mechanism Failure:** If agents derive utility from "moral purity" (unconditional intent), the conditional nature of the trade reduces the utility of the outcome. The mechanism design ignores **preference endogeneity**: the act of trading may shift $u_i$ such that the trade is no longer individually rational (IR).

  **Objection 3: Moral Offsetting (Fungibility and Additionality)**
  *   **Translation:** This treats moral actions as **fungible permits** in a cap-and-trade system.
  *   **Mechanism Failure:** For a market to clear, units must be homogeneous. If "moral value" is not fungible (e.g., bednets $\neq$ roofs), this is **barter**, not trade. If it is fungible, the worry is **additionality**: does the trade increase total provision, or merely reallocate it? In standard markets, trade increases efficiency via allocation. Here, if the "goods" are fixed (one roof, one net distribution), trade is purely redistributive unless it unlocks **thickness** (more participants).

  **Objection 4: Contested Claims (Common vs. Private Values)**
  *   **Translation:** Standard market design assumes **private values** ($u_i$ is known only to $i$). Moral trade often implies **common values** (there is a "true" moral good).
  *   **Mechanism Failure:** If values are common (e.g., bednets *are* objectively better), then Agent 2 is mistaken to value roofs. Trading based on mistaken priors reduces social welfare. To claim mutual advantage, the model must assume **private values** (subjective morality). To claim *moral* improvement, it requires a **Social Welfare Function (SWF)** or **interpersonal utility comparisons (IUC)**, which standard mechanism design explicitly excludes.

  ***

  ### II. Residue Report

  **1. What Translated Cleanly**
  *   **The Commitment Problem:** This maps perfectly to a sequential Prisoner's Dilemma or Hold-up problem. The lack of enforceable contracts is a standard friction.
  *   **Repugnance:** Roth's framework handles the "simony" charge well. It is a constraint on the mechanism's domain.
  *   **Information Asymmetry:** The worry about contested claims maps to the Common vs. Private Value distinction in auction theory.

  **2. What Required Stretching**
  *   **"Pareto Improvement":** In your framework, Pareto is defined over the agents' *own* utility functions. If Agent 1 values Bednets and Agent 2 values Roofs, and they swap funding, the *physical outcome* is identical (assuming 1:1 cost). For Agent 1 to be better off, they must value the *existence* of the Roof enough to fund it, provided the Bednets are funded. But they value Bednets *more*. The only way the math works is if the trade induces **leverage** (Agent 2 funds *more* Bednets than they would have otherwise). This turns the model from a simple exchange into a **public good contribution game with matching grants**. You have to stretch "trade" to mean "subsidized contribution."
  *   **"Price":** There is no price here. There is no numeraire good being exchanged for the action. Money is transferred to a third party (the cause), not the counterparty. This is not a market; it is a **reciprocal externality internalization**.

  **3. What Is Incoherent in Your Vocabulary**
  *   **The "Market" Itself:** A market requires a good that is transferred from seller to buyer. Here, the "buyer" (Agent 1) never consumes the good (Bednets go to strangers). The "seller" (Agent 2) attaches no intrinsic value to producing the good for the buyer (they prefer Roofs).
      *   *Result:* This violates the **individual rationality** condition of a standard exchange economy. Agent 1 is paying for a public good they value, but using Agent 2 as a proxy. Agent 2 is being paid (via Agent 1's funding of Roofs) to produce a public good they value less.
      *   *Incoherence:* You cannot define a **demand curve** for "Agent 2's action." Agent 1 doesn't want Agent 2's action; they want the Bednets. Agent 2's action is merely a **constraint** or **technology** to unlock the Bednets.
  *   **Transferable Utility (TU):** The argument relies on an unearned TU assumption. It assumes £1 of "moral value" for Agent 1 is comparable to £1 of "moral value" for Agent 2. Without a **common cardinal scale**, you cannot sum the gains to show the "deal" is good. If utilities are ordinal and non-comparable, you can only say "Agent 1 prefers Trade, Agent 2 prefers Trade." You cannot say "Total Value Increased."

  ***

  ### III. The Wrinkles and The Verdict

  **The Unverified Contingency (Trusted Arbiter)**
  *   **Translation:** This introduces a **verifier** into an **incomplete contract**. If the arbiter cannot verify the outcome (e.g., "Did the roof actually get fixed?"), the mechanism relies on **cheap talk** or **reputation**.
  *   **Residue:** If the arbiter is trusted but verification is impossible, this is a **correlated equilibrium** device. It works only if the agents value their reputation with the arbiter more than the gain from defection. In market design terms, this is **non-verifiable performance**, which usually collapses the mechanism to Autarky unless repeated interactions exist.

  **Strangers and Expected Reciprocity**
  *   **Translation:** This is a **one-shot Prisoner's Dilemma** masquerading as a repeated game.
  *   **Residue:** Without observation or repetition, **Folk Theorems** do not apply. "Expected reciprocity" is a **prior over types** (believing the other is a "cooperator"). If types are private information, this is a **Bayesian Game**. Unless the probability of meeting a cooperator is high enough to satisfy the IC constraint, the unique equilibrium is Defect. The "market" has zero **thickness** and no **clearinghouse** to enforce matches.

  **Verdict on Your Suspicion**
  Your suspicion is correct, but requires one refinement.

  1.  **Coasean Bargaining:** Yes. This is bargaining over an **externality**. Agent 1's utility is affected by Agent 2's spending (positive externality). Agent 1 pays Agent 2 (via the Roof) to internalize that externality (fund Bednets).
  2.  **Unexamined Status Quo:** Yes. The "endowment" is the right to spend one's own money. The trade assumes this right is alienable in a specific way (conditional giving).
  3.  **Unearned TU:** This is the critical failure. The proposal claims "mutual advantage" but often slides into "greater moral good."
      *   If it claims **Pareto** (subjective gain): It works *only if* the leverage effect exists (I fund your project *to induce you to fund mine additionally*). If it's a straight swap of fixed budgets, there is no gain in a private-value model (Outcome is identical).
      *   If it claims **Utilitarian** (objective gain): It requires a **Social Planner** to validate the exchange rates, which contradicts the decentralized market premise.

  **Conclusion:**
  Moral Trade is not a market design problem; it is a **mechanism implementation problem** with missing enforcement technology.
  *   **What your framework is missing:** It lacks a module for **normative preference aggregation**. Your tools assume preferences are given and sovereign. Moral Trade assumes preferences are **mistaken** or **suboptimal** and can be corrected via trade.
  *   **What is confused in the literature:** The literature conflates **gains from trade** (private value) with **gains from effectiveness** (common value). It treats moral disagreement as a difference in taste (like preferring apples to oranges) when it is often a difference in belief (like believing apples cure cancer vs. oranges do). You cannot trade away factual disagreements.

  **Final Diagnosis:** The "market" is a **Coasean solution to a public good provision problem** that assumes **Transferable Utility** across moral agents without a mechanism to enforce the transfer. It is incoherent as a market because there is no consumption, only production of externalities. It is trivial if viewed as simple leverage (matching grants), and incoherent if viewed as a swap of fixed budgets.
