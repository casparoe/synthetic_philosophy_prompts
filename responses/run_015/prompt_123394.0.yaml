answer: |-
  Elena signs the contract renewal, declining the director's offer to move to headquarters. "This work finds you," she tells her colleague, marking the files for the evening shift. "I didn't choose the need; I just saw it was here." She organizes the donation bins with precise, practiced movements, humming softly. There is no hesitation in her step, no glance toward the corporate office upstairs. When asked if she feels sacrificed, she laughs. "There's nothing to give up. The value lies in the work itself; I'm just the instrument." She treats the community's urgency as a gravitational force she merely orbits, her commitment absolute yet described as a reaction to external necessity. Her colleague nods, impressed by her stability. Elena feels entirely aligned with her task, knowing exactly who she is in this room: the person who ensures the lights stay on. She does not wonder why this need matters; it simply does. Her satisfaction is complete, rooted in the certainty that the path was already laid out before she arrived. She avows every action but locates the authority entirely outside herself.

  **1. Three Verdicts**
  (i) **Sartre:** Bad faith. Elena treats her constituting choice of value as facticity ("value lies in the work"), denying her transcendence in making this need matter. She reduces herself to a thing that fills slots.
  (ii) **Motivational:** Not self-deceived. She holds no belief against evidence; her desire and behavior align without tension or hidden motive.
  (iii) **Wholeheartedness:** Authentic. She identifies fully with her desire, lacks ambivalence, and would not trade this life on reflection.

  **2. The Single Feature and Perturbation**
  The working feature is the *objectification of value* (treating value as found vs. conferred). I relied on your working idea of excess avowal.
  **Perturbation:** Elena adds, "I chose to prioritize this need over others."
  **Result:** The Sartrean verdict flips to **authenticity** (she owns her constituting freedom). Views (ii) and (iii) remain unchanged; she remains undeceived and wholehearted.

  **3. Strongest Attack and Response**
  **Attack:** A defender of (ii) argues Sartre merely penalizes a metaphysical error about value's source, which counts as a false belief held for comfort.
  **Response:** Bad faith is not epistemic error but ontological flight; it is the structure of denying one's role as value-conferrer, regardless of the belief's truth.
  **Concession:** If the belief functions to soothe anxiety about freedom, (ii) captures the psychological motive, but misses the structural denial of transcendence essential to Sartre.

  **4. Confirmation**
  This case is not solved by correcting a false belief, resolving an inner conflict, or abandoning a disreputable project.
