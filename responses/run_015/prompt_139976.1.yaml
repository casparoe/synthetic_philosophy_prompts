      *Question 1 (Valid Case):*
      Q: You dismiss the keyboard and videocassette stories as both over-claimed and over-debunked. If we strip those away, what does a well-documented instance of lock-in actually have to look like to satisfy your three conditions?
      Note: She will list the requirements: clear contingent start, observable feedback, and erasability test passed.
      Follow-up: If the evidence required is that dense, aren't you admitting that confirmed cases will be vanishingly rare compared to the claims historians usually make?

      *Question 2 (Feedback Mechanism):*
      Q: Your account leans heavily on positive feedback—learning effects, coordination, adaptive expectations. In the episodes you endorse, do these mechanisms operate simultaneously, or do you need to isolate one to prove the cascade wasn't just standard cumulative advantage?
      Note: She will argue that multiple mechanisms reinforce each other, making the lock-in stronger.
      Follow-up: But if they reinforce each other, doesn't that make it harder to identify the specific causal weight of the early event versus the strength of the mechanism itself?

      *Question 3 (Early Event):*
      Q: You insist the early event must be contingent—no better suited than its rivals. How do you distinguish that from a standard historical explanation where a small cause has a large effect simply because the system was sensitive, not because it was locked in?
      Note: She will distinguish sensitivity from lock-in by emphasizing the persistence and resistance to change in the latter.
      Follow-up: Yet persistence can also be explained by the outcome being genuinely superior; what rules out the hypothesis that the early event won because it was slightly better, not just first?

      *Question 4 (Erasability/Observability):*
