  Ms. Vance upheld the Prime Directive of the Archives: the index describes the object, but the index is not the object. The ledger was the frame; the collection was the picture. Frames were not hung on walls.

  Then came Donation 8940. A leather-bound sketchbook. Inside, graphite renders of the museum's accession ledgers. Page 4 depicted the very ledger open on her desk. Page 12 depicted her hiring card, dated October 14, 2003, complete with the ink smudge she made that morning.

  She examined the illustrations of the hands holding the pens. They were not hers. The cuffs were tweed, silk, wool—uniforms of previous cataloguers stretching back decades. Each pair of hands drew the hands that preceded them, a chain of creation biting its own tail.

  Vance attempted to file the sketchbook. If she accessioned it as Art, it became part of the collection. But the sketchbook depicted the ledger that defined the collection. If the ledger was depicted, it was effectively part of the collection, violating the Prime Directive. If she filed it as Reference Material, it remained outside the collection. But the sketchbook depicted the Reference log itself. Every level she designated as the framing mechanism was already framed by the image beneath it.

  She could not pause. Procedure demanded continuity. To stop was to admit the system was porous.

  She selected a fresh index card. Stock: 100lb rag. Ink: Permanent black. If the sketchbook predicted this card, then the card was inevitable. If the card was inevitable, it was not an act of creation, but of transcription. Yet, transcription required an original.

  She placed the card on the desk. The sketchbook lay open to a drawing of this exact moment: a top-down view of the desk, the sketchbook, and the card being written. In the drawing, the hand holding the pen was hers. In the drawing, the hand holding *that* hand belonged to her predecessor.

  Vance dipped her pen. To file the book, she must describe it. To describe it, she must exist outside it. But the drawing suggested she existed inside it. She resolved the tension by ignoring the ontological status and focusing on the syntax.

  *Item: Sketchbook.*
  *Content: Depiction of Archives.*
  *Cataloguer: Vance.*

  She signed the bottom right corner. In the sketchbook, the drawn hand signed the drawn card. She placed the physical card into the physical drawer. She closed the physical sketchbook.

  She did not check if the drawing updated. She simply filed the card under 'V'. It was impossible to tell if she had just cataloged the book, or if she had just completed the drawing that cataloged her. The card sat in the tray, indistinguishable from the thousands surrounding it, waiting to be drawn by hands that had not yet arrived.
