answer: |-
  You've conflated the description of the outcome from a God's-eye view with the actual choice of policy available to the agent. When the GPS is silent, the driver is in the exact same information state at both intersections; the likelihood of silence is independent of location, so silence provides no self-locating evidence. Consequently, the driver cannot adopt different continuation probabilities for "Silent at Intersection 1" versus "Silent at Intersection 2" because he cannot distinguish those states. A planning-optimal strategy must map information states to actions, not world states to actions. If you calculate the *ex ante* expected utility properly respecting this constraint, the optimal probability of continuing when silent is actually 3/4, not 1/2. Your proposed fragmentation is inexecutable; the planning perspective isn't fragile here, it's doing exactly what it should by forcing you to respect the agent's informational constraints rather than smuggling in knowledge he doesn't have.

  This confirms rather than undermines the *ex ante* standpoint as the deep norm of rationality. The original 2/3 rule wasn't an artifact of symmetry; it was the unique solution to maximizing utility given the constraint of indistinguishable nodes. The GPS case merely enriches the information structure, adding a "Known" state and a "Silent" state, but the normative principle remains unchanged: rationality consists in committing to the policy that maximizes expected utility from the initial perspective, accounting for all future informational limitations. The fact that the optimal policy utilizes signals when available doesn't mean the planning standpoint collapses; it means the planning standpoint is robust enough to incorporate partial information without succumbing to the illusion that the agent knows more than he does at the moment of choice.
