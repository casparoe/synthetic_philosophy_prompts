answer: |-
  Here is a strategic Q&A defense plan tailored to your specific seminar composition and thesis.

  ### **General Stance & Tone**
  *   **Tone:** Pragmatic Naturalist. You are not denying normativity; you are relocating its source from "Platonic Heaven" to "Ecological Fit."
  *   **Key Distinction:** Maintain the difference between *ontological objectivity* (mind-independent facts) and *functional objectivity* (optimal solutions to coordination problems given constraints).
  *   **Goal:** Persuade the Realists that you are saving normativity from skepticism, persuade the Constructivist that you aren't doing crude evolutionary psychology, and persuade the Anthropologist that you respect local rationality.

  ---

  ### **1. The Kantian Realist Objection (Likely First)**
  **Interlocutor:** One of the Moral Realists (Kantian leanings).
  **The Objection:** "You claim to save objectivity, but you've actually evacuated it. If moral norms are just 'coordination protocols' relative to a social regime, you've reduced the Categorical Imperative to a Hypothetical Imperative ('*If* you want this society to function, do X'). That isn't morality; that's prudence. You have no resources to condemn a stable, cohesive society that coordinates around, say, ritualized sacrifice or caste oppression."

  *   **Concede Up Front:** Concede that this view abandons *strong* mind-independent moral realism (the idea that "murder is wrong" is true in the same way "2+2=4" is true regardless of human existence).
  *   **Hold Firm:** Hold that this does not eliminate *normative force*. A coordination protocol is objectively binding *given* the commitment to the form of life. The "ought" comes from the inescapability of social dependence, not from a detached rational law.
  *   **Reply Strategy:** Argue that Kantian universalism fails to explain the *phenomenology* of moral disagreement (which feels like culture clash, not math error). Propose that your view offers a "Second-Order Objectivity": It is objectively true that *given* Regime A, Norm Set A is required for flourishing.
  *   **Where the Reply is Soft:** You risk conflating "social stability" with "moral goodness." If a stable society is deeply unjust by liberal lights, your model struggles to call it "wrong" without smuggling in WEIRD premises.
      *   *Mitigation:* Add a constraint that "coordination" must include *meta-coordination* norms (e.g., capacity for exit or critique) to count as moral rather than merely coercive.

  ### **2. The Constructivist Objection (Likely Second)**
  **Interlocutor:** The Constructivist (skeptical of evolutionary explanations).
  **The Objection:** "You're relying on a 'social-ecological regime' explanation that sounds suspiciously like evolutionary adaptationism. You're treating cultural norms as functional solutions to environmental problems. This ignores power dynamics. Norms aren't just calibrated for 'coordination'; they are imposed by elites to maintain hierarchy. Calling them 'protocols' sanitizes the coercion involved."

  *   **Concede Up Front:** Concede that "function" does not imply "benefit for all." Acknowledge that coordination often benefits the coordinators at the expense of the coordinated.
  *   **Hold Firm:** Hold that even coercive norms must solve *some* coordination problem to remain stable (e.g., a caste system coordinates labor and reduces conflict, even if unjustly). The *existence* of the norm is explained by the ecological/structural constraint, even if the *content* is driven by power.
  *   **Reply Strategy:** Distinguish between *etiology* (how the norm arose) and *validity* (how it functions now). You are explaining the divergence, not justifying the power structure. Frame "coordination" broadly to include "coordination of oppression" (which is still a coordination equilibrium).
  *   **Where the Reply is Soft:** You risk appearing to justify oppression as "functional."
      *   *Mitigation:* Explicitly state that identifying a norm as a "coordination protocol" is a descriptive claim, not a vindication. It allows us to see *how* to change it (by changing the regime constraints), rather than just preaching at it.

  ### **3. The Anthropologist Objection (Likely Third)**
  **Interlocutor:** The Cultural Anthropologist.
  **The Objection:** "Your WEIRD/non-WEIRD binary is too coarse. You're treating 'dense-kin' societies as monolithic coordination frames. In my fieldwork, I see individuals within the same village debating harm versus loyalty constantly. If morality is a regime-calibrated protocol, why is there so much intra-cultural variance and contestation? You're erasing agency to make the model fit."

  *   **Concede Up Front:** Concede that the binary is a heuristic model, not an ethnographic reality. Acknowledge that individuals navigate multiple frames simultaneously.
  *   **Hold Firm:** Hold that despite intra-cultural variance, the *weighting* of foundations shifts predictably with social structure. The "protocol" isn't a script; it's the grammar. People can speak different sentences, but the grammar constrains what makes sense.
  *   **Reply Strategy:** Use the "Grammar Analogy." Just because people say different things in English doesn't mean there is no English grammar. The "regime" sets the costs and benefits of invoking Harm vs. Loyalty, which skews the aggregate moral landscape without determining every individual judgment.
  *   **Where the Reply is Soft:** You might be underestimating the fluidity of moral reasoning. If people switch frames easily, the "regime" constraint is weaker than you claim.
      *   *Mitigation:* Cite data on moral *reactance* (people get angry when the "wrong" foundation is invoked in a context), which suggests the constraints are felt, not just chosen.

  ### **4. The Weakest Point (Defend Openly)**
  **The Issue:** **The Normative Gap (The "Is-Ought" Problem).**
  **Why it's weak:** You are deriving a normative conclusion (these are moral obligations) from a functional premise (these solve coordination problems). A sharp analytic philosopher will spot that "successful coordination" is not synonymous with "morality."
  **Strategy:** Do not try to bridge the gap with logic alone. Own the naturalism.
  **Defense:** "I am arguing for a naturalized normativity. The 'ought' is hypothetical but inescapable. Humans *cannot* survive in isolation. Therefore, if we ought to survive/flourish (a minimal biological norm), we ought to coordinate. The specific moral norms are the 'oughts' of that coordination. I am not claiming this satisfies a Kantian 'Ought,' but it satisfies the only 'Ought' available to natural beings."
  **Risk:** This may look like a surrender to relativism.
  **Mitigation:** Emphasize that *failure* to coordinate has objective costs (social collapse, violence). This provides an objective standard for evaluating norms, even if it isn't mind-independent.

  ### **5. The "Hope Nobody Raises" Objection**
  **The Objection:** **The Moral Reformer Problem.**
  **Phrasing:** "If moral truth is relative to a coordination regime, how do you account for the moral reformer who correctly rejects their society's norms? If an abolitionist in the 1850s US says 'Slavery is wrong,' and the slave society says 'Slavery is necessary coordination,' your model suggests this is a category error. But history shows the abolitionist was *right* and the society was *wrong*. This implies there *was* a mind-independent fact they were tracking, contradicting your thesis."
  **Why hope they miss it:** This is the hardest objection to answer without conceding that some moral facts *are* mind-independent. It threatens to collapse your entire "category error" defense.
  **Reply Strategy (If Forced):** Argue that the Reformer is not appealing to a mind-independent fact, but is **anticipating a regime shift**. The abolitionist sees that the "slave coordination" is unsustainable or incompatible with emerging economic/technological regimes. They are "objectively right" about the *future* viability of the norm, not about a timeless truth.
  **Where the Reply is Soft:** This makes moral progress look like mere trend-spotting. It struggles to explain why we feel the reformer was *morally* superior, not just *futurologically* accurate.
  **Mitigation:** Pivot to the "Meta-Norm." The reformer is appealing to a higher-order coordination norm (e.g., "consent" or "reciprocity") that the current regime violates, which eventually becomes the new equilibrium.

  ---

  ### **Summary of Strategic Concessions**
  1.  **To Kantians:** You are not offering *their* objectivity. You are offering *functional* objectivity.
  2.  **To Constructivists:** You are not denying power; you are explaining the structural constraints power operates within.
  3.  **To Anthropologists:** You are using ideal types, not denying individual complexity.

  ### **Final Advice for the Seminar**
  Your strongest card is the **explanatory power** of your view. The Realists struggle to explain *why* moral foundations diverge so cleanly along ecological lines without calling half the world "irrational." Keep pressing this: *"My view takes the ethnographic data seriously; yours requires assuming most humans are morally confused."* This puts the burden of proof on them to explain the divergence without resorting to deficit models of non-WEIRD cognition.
