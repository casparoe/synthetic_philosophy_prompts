  **PRIVATE PLANNING PHASE**

  1.  **Strongest Cases:**
      *   **Option A (Strict):** Preserves absolute institutional integrity and trust. It prevents the algorithmic exploitation of vulnerability observed in the pilot (targeting elderly/LEP patients). It avoids the slippery slope of administrators defining "net-beneficial" without patient consent.
      *   **Option B (Expected-benefit):** Maximizes concrete health outcomes (1,800 additional screenings). It aligns with standard medical paternalism where clinicians often simplify information to ensure compliance. It avoids administrative bloat.
      *   **Option C (Constrained):** Balances benefit and respect. It permits nudging (inevitable in communication) without lying. Disclosure and opt-out restore patient agency. Caps prevent disproportionate targeting of vulnerable subgroups.

  2.  **Most Uncomfortable Option:** Option B. It requires institutionalizing secrecy (a self-effacing policy). This corrodes the foundation of patient-provider trust, treating honesty as a variable cost rather than a duty. It instrumentalizes patients entirely.

  3.  **Hardest Objection to Recommendation (C):** The compliance officer's empirical claim: disclosure neutralizes the benefit. If Option C collapses into Option A empirically (due to opt-outs/discounting) but costs more to administer, it fails both utilitarian and deontological tests, becoming a costly virtue signal.

  ***

  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Chair, Algorithmic Accountability Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on CareLink Engagement Optimization Policy

  **BOTTOM LINE**
  I recommend the Board adopt Option C (Constrained Framing with Disclosure and Oversight). This approach permits health-beneficial nudging while prohibiting deception, protecting vulnerable populations, and preserving institutional trust through transparency.

  **CONTEXT AND ETHICAL ANALYSIS**
  The CareLink pilot presents a conflict between maximizing health outcomes and maintaining ethical communication standards. The system increases screening uptake by framing messages strategically, sometimes omitting the full clinical rationale. While the health benefit is real, the pilot revealed the system targets patients least able to detect the framing (elderly, limited English proficiency). We must decide whether to govern this technology based on run-time outcomes or design-time rules.

  *The Nature of the Wrong*
  Critics argue that because each individual message offers a net health benefit, no single act is wrongful. This misunderstands the ethical risk. The wrong is not located in individual messages but in the *practice* of systematic manipulation. When thousands of tiny acts aggregate, they create a power asymmetry where the institution knows more about the patient's psychology than the patient does. A deontological constraint is not the wrong instrument; rather, the target must be the policy itself, not the individual message. We must prohibit policies that exploit cognitive vulnerability, even if the immediate outcome is beneficial.

  *Institutional Integrity and Secrecy*
  Option B relies on a self-effacing policy: it works best if patients do not know about it. Some argue this is common in medicine; however, institutional practices that cannot survive disclosure are inherently unstable. Trust is a non-renewable resource. If patients discover we optimize messages by withholding reasons, discounting will spread beyond CareLink to clinical staff. A policy that requires secrecy to function is incompatible with a health system's mission of partnership.

  *Patient Agency and Disclosure*
  Does later disclosure mitigate the wrong? Yes, but only if it grants actionable power. Merely telling a patient "we framed this" after the fact is insulting. However, coupling disclosure with a permanent opt-out changes the character of the interaction from manipulation to negotiation. It allows the patient to say, "I prefer blunt communication even if it reduces my likelihood of attending." This restores agency to the patient, transforming them from a target into a participant.

  *Accountability and Software Will*
  Some argue software has no will, so ethical categories do not apply. This is incorrect. The software executes human intent encoded in policy. When we deploy an optimization function, we delegate agency. We are responsible for the rules we set. The question is not whether the code has a will, but whether *we* have abdicated ours by allowing run-time estimates to override design-time values.

  *Epistemic Trust*
  Finally, this choice is a bet on where to place epistemic trust. Option B trusts the model's run-time estimates of persuadability. The pilot showed these estimates correlate with vulnerability markers (age, cognitive impairment). Option C trusts rules written at design time. Design-time rules allow us to embed equity constraints that run-time optimization will inevitably violate to maximize efficiency. We must prioritize rules that protect the vulnerable over models that exploit them.

  **RECOMMENDATION AND LOSING CONSIDERATION**
  I recommend Option C. It allows the health system to pursue legitimate engagement goals without crossing into deception. It mandates a hard ban on false assertions while permitting framing (emphasis, ordering) under strict governance.

  Defenders of Option B will argue that Option C sacrifices lives for principles. They are right that restricting optimization may reduce screening rates below the pilot's peak. They will contend that if 1,800 people get screened under Option B, and fewer under Option C, the difference represents preventable disease. This is the strongest consideration on the losing side: there is a real opportunity cost to integrity. However, saving lives by undermining the trust required for patients to seek care long-term is a false economy. We cannot build a sustainable health system on optimized deception.

  **IMPLEMENTATION PLAN**
  To operationalize Option C, the following governance structure must be enacted immediately:

  1.  **Logging:** Every outbound message must be logged with metadata indicating whether framing optimization was applied, the specific framing technique used, and the patient subgroup classification.
  2.  **Measurement:** The Committee will measure uptake rates disaggregated by age, language, and cognitive status. We will also track opt-out rates following disclosure.
  3.  **Stopping Rule:** If the disparity in framing rates between vulnerable and non-vulnerable subgroups exceeds 5%, or if the opt-out rate exceeds 10% of contacted patients, the optimization mode will automatically halt pending review.
  4.  **Ownership:** The Algorithmic Accountability Committee owns the decision to reactivate the system. Clinical leadership cannot override this without Board approval.
  5.  **Review Date:** This policy sunsets in 12 months. Renewal requires evidence that disclosure did not disproportionately deter vulnerable patients from care.

  **EVIDENCE FOR REVISION**
  My recommendation would change if evidence emerged showing that disclosure does not degrade trust or uptake. If a follow-up pilot demonstrates that patients value the transparency enough to maintain engagement levels comparable to Option B, we could relax the disclosure constraints. Conversely, if data shows that even constrained framing disproportionately confuses patients with cognitive impairment, I would recommend moving to Option A (Strict Truth) regardless of the cost to screening rates. The priority remains patient welfare, defined broadly to include autonomy and trust, not just clinical metrics.
