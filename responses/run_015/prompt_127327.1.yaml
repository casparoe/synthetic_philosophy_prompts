answer: |-
  # HANDOUT: DECISION TREE FOR BERTRAND'S CHORD PARADOX
  **Graduate Reading Group: Chance, Symmetry, Ignorance**

  **The Starting Point:** You accept that the three standard constructions for "drawing a chord at random" are all defensible readings of the instruction, yet they yield three different probabilities ($1/3, 1/2, 1/4$) that a chord is longer than the side of the inscribed equilateral triangle.
  1.  **Random Endpoints:** Two points chosen independently on the circumference.
  2.  **Random Radius:** A radius chosen, then a point chosen along it (chord perpendicular to radius).
  3.  **Random Midpoint:** A point chosen in the disk as the chord's midpoint.

  **Instructions:** Answer the questions below in order. Your path determines your philosophical position on what the paradox shows and how (or if) it is resolved. Technical terms in *italics* are glossed in the footer.

  ---

  ## THE DECISION TREE

  **Q1. UNIQUENESS:** Does the phrase "choose a chord at random" specify a **unique** correct probability distribution, independent of any physical context?
  *   **YES** $\rightarrow$ Go to **Q2**.
  *   **NO** (The problem is under-determined) $\rightarrow$ Go to **Q5**.

  **Q2. THE UNIFORM QUANTITY:** If unique, which geometric quantity is uniformly distributed (spread evenly)?
  *   **A.** The angular position of an endpoint. $\rightarrow$ **LEAF 1**
  *   **B.** The distance of the midpoint from the centre. $\rightarrow$ **LEAF 2**
  *   **C.** The position of the midpoint within the disk area. $\rightarrow$ **LEAF 3**
  *   **D.** The length of the chord itself. $\rightarrow$ **LEAF 4**

  **Q3. INVARIANCE SCOPE:** (For those seeking a mathematical principle rather than a specific quantity). Do you require the answer to remain unchanged if the circle is **shifted or rescaled**, or only if it is **rotated**?
  *   **Rotation Only** $\rightarrow$ Go to **Q4**.
  *   **Shift & Scale (Rigid Motion)** $\rightarrow$ **LEAF 5**

  **Q4. THE NON-CIRCULAR TEST:** Does your principle yield a determinate answer for a **square** or **ellipse** using the same logic (e.g., "random midpoint")?
  *   **NO** (The logic breaks without circular symmetry) $\rightarrow$ **LEAF 6**
  *   **YES** (The logic holds for any convex region) $\rightarrow$ **LEAF 7**

  **Q5. RESOLVING UNDER-DETERMINATION:** If the problem is under-determined, how should the gap be closed?
  *   **A.** By specifying the **physical mechanism** (e.g., how the straw is thrown). $\rightarrow$ **LEAF 8**
  *   **B.** By accepting **multiple rational answers** are permissible. $\rightarrow$ **LEAF 9**
  *   **C.** By rejecting the question as **ill-posed/empty**. $\rightarrow$ **LEAF 10**

  ---

  ## THE LEAVES (POSITIONS)

  | Leaf | Label | Position | Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | **Privileged Angle** | The endpoint angle is the natural parameter for a circle. | Must explain why endpoints are more fundamental than midpoints. |
  | **2** | **Privileged Radius** | Radial distance is the natural measure of "closeness" to centre. | Must explain why linear distance trumps area density. |
  | **3** | **Privileged Area** | Uniform density over the disk area is the default for "random". | Must explain why area is privileged over boundary length. |
  | **4** | **Length Indifference** | The chord length itself should be uniformly distributed. | **Empty Cell:** No defenders; implies a physically singular density of lines. |
  | **5** | **Jaynes / Invariance** | *Transformation Groups:* Only the solution invariant under shift/scale is objective. | Requires treating the circle as embedded in an infinite plane of lines. |
  | **6** | **Rotation Limited** | Symmetry applies only to the specific shape given (circle). | Probability becomes shape-dependent; no general theory of "random lines". |
  | **7** | **Affine Invariant** | A general measure exists for lines intersecting any convex region. | Requires abandoning simple "uniform midpoint" intuition for complex measures. |
  | **8** | **Chance-Setup** | The probability is a matter of fact about the physical generating process. | Mathematics cannot solve the problem without empirical data. |
  | **9** | **Permissive** | "Random" is incomplete; multiple distributions are rationally permissible. | Dilutes the normative force of probability theory in ignorance. |
  | **10** | **Under-specification** | The problem is ill-posed; there is no answer until constraints are added. | Risks making all probability problems contingent on unstated assumptions. |

  ---

  ## COINCIDENCES AND BLIND SPOTS

  **1. The $1/2$ Coincidence:**
  **Leaf 2 (Privileged Radius)** and **Leaf 5 (Jaynes)** both yield $p=1/2$ for the circle.
  *   **Distinction:** Leaf 2 claims radial distance is *intrinsically* uniform. Leaf 5 claims radial distance is uniform *because* it is the only distribution invariant under shifting the circle's position.
  *   **Separation Test:** Ask about a **square**. Leaf 2 struggles (what is the "radius"?). Leaf 5 (via Integral Geometry) still yields a unique measure based on line invariance.

  **2. The Empty Cell (Leaf 4):**
  Indifference over **Chord Length** yields $p = 1 - \sqrt{3}/2 \approx 0.134$.
  *   **Diagnosis:** This is mathematically coherent but physically unattractive. It implies that lines passing near the centre are vastly more dense than lines near the edge, violating translation invariance. It has no defenders because it treats the *effect* (length) as the cause, ignoring the geometry of the line's position.

  **3. Unoccupied Logical Space:**
  *   **Scale Invariance Only:** A view demanding invariance under resizing but not shifting. **Diagnosis:** Unstable. If you can resize, you can effectively shift by resizing a larger containing circle.
  *   **Permissive + Physics:** A view that says "Physics decides, but multiple physics are permissible." **Diagnosis:** Collapses into Leaf 9 (Permissive).

  ---

  ## WALK-THROUGHS

  **Student A (The Empiricist):**
  *   **Q1:** NO. (Words don't fix probabilities; facts do.)
  *   **Q5:** A. (We need to know how the chord is generated.)
  *   **Result:** **Leaf 8 (Chance-Setup).**
  *   *Comment:* Consistent. Refuses to solve physics with pure math.

  **Student B (The Objectivist):**
  *   **Q1:** YES. (Ignorance imposes constraints.)
  *   **Q2:** (Skipped, seeks principle not quantity).
  *   **Q3:** Shift & Scale. (Location/size shouldn't matter.)
  *   **Result:** **Leaf 5 (Jaynes / Invariance).**
  *   *Comment:* Consistent. Uses symmetry to force a unique solution.

  *(Note: If both students landed on Leaf 5, the tree would fail to sort epistemic vs. ontic commitments.)*

  ---

  ## ANSWER KEY: MAPPING THE CLASSICS

  | Classic Construction | Result | Corresponding Leaf | Flag / Warning |
  | :--- | :--- | :--- | :--- |
  | **Random Endpoints** | $1/3$ | **Leaf 1** (Privileged Angle) | Defenders often claim this is "most natural," but cannot justify why angle trumps area without circular bias. |
  | **Random Radius** | $1/2$ | **Leaf 5** (Jaynes) | **Mismatch:** Classic defenders often argue Leaf 2 (Privileged Radius). Jaynes argues Leaf 5. They coincide on the circle, diverge elsewhere. |
  | **Random Midpoint** | $1/4$ | **Leaf 3** (Privileged Area) | Defenders must accept Leaf 6 (Rotation Limited), as "uniform area" does not translate invariantly to squares. |
  | **Invariant Measure** | $1/2$ | **Leaf 5** (Jaynes) | Consistent. This is the modern standard for "geometric probability." |

  ---

  **Glossary & Simplifications:**
  *   ***Invariance:*** "The answer shouldn't change if you move/resize the circle." (Simplifies *Group Theory*).
  *   ***Measure:*** "A rule for assigning sizes/probabilities to sets of lines." (Simplifies *Measure Theory*).
  *   ***Simplification:*** We treat "Shift & Scale" as a single node. Technically, translation invariance implies scale invariance for lines, but we separate them here for pedagogical clarity.
  *   ***Simplification:*** We ignore the distinction between *epistemic* (knowledge-based) and *ontic* (world-based) probability in the nodes, capturing it instead in the Leaves (e.g., Leaf 8 vs Leaf 5).

  *(End of Handout)*
