      *   The Converse is **not** the contrapositive of the Dutch Book Theorem. It is the *inverse*. It does not follow logically from (a) without further assumptions (specifically, that the bookie's options are symmetric or that the space is finite, though the direct proof handles this). Claiming it follows by contraposition is a formal logic error.
