answer: |-
  Okay, I'll say it: the bit about numbness looking like progress? That stings. You're right that on my view, the person who stops hurting looks like they've solved the equation, and everyone knows that's wrong. It's a bad look for my side. But here's the distinction: getting better at the job means getting faster at picking, not getting better at watching people die. The scar tissue isn't proof there was no right answer; it's proof that right answers can still cost you your soul. You don't learn to stop the guilt because the guilt isn't a mistake signal. It's just the bill.

  As for the "yes and no"—she's not answering the same question twice. The "yes" is for the choice: you sent the truck. The "no" is for the world: a person is dead. You're treating the feeling of owing something as proof that you actually owe something. But feelings aren't receipts. You can feel like you owe a debt even when the ledger is clean. That doesn't mean the debt is real; it just means the loss is heavy. If she thinks she did wrong, she's blaming herself for gravity.
