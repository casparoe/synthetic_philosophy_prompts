answer: |-
  # JOINT STATEMENT OF AGREEMENT AND DISAGREEMENT
  **Subject:** Representational Status of Internal Directions in Fixed Transformers
  **Signatories:** Alex (Realist), Bea (Deflationist)
  **Date:** [Workshop Date]

  ## I. AGREED CLAIMS

  1.  **Fixed Object:** We are discussing a single, fixed trained transformer. We are not debating alternative architectures, training regimes, or counterfactual models.
  2.  **Mechanical Efficacy:** We agree that linear directions exist within the residual stream such that adding a multiple of a direction $d$ to the activation vector reliably shifts model behavior on held-out in-distribution inputs. We agree that sparse autoencoders and linear probes can identify these directions.
  3.  **Basis Dependence:** We agree that the full activation vector is not a singular semantic unit. We agree that most bases are useless for steering or interpretation. We agree that some decompositions are objectively more useful than others for prediction and control.
  4.  **No Magic:** We agree that there is no non-physical "meaning" substance injected into the weights. All claims about representation must cash out in terms of causal influence on outputs or correlations with external variables.

  ## II. DISAGREEMENTS TABLE

  | Crux | Alex's Claim (Realist) | Bea's Claim (Deflationist) | Neutral Stake | Test / Case | Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Transplant Transfer** | If direction $d_A$ in Model A and $d_B$ in Model B perform the same causal role on in-distribution data, they align to the *same underlying feature*. Therefore, they will generalize similarly to hard out-of-distribution (OOD) inputs. | $d_A$ and $d_B$ are defined by their local causal roles. Similarity on in-distribution data does not imply shared ontology. Generalization to hard OOD is a property of the specific model's ecology, not a shared feature. | **Do functionally aligned directions across different architectures share a generalization profile on hard OOD data, or does alignment decay?** | **The Transplant Test:**<br>1. Identify $d_A$ in Model A.<br>2. Find $d_B$ in Model B (diff. arch/tokenizer) that matches $d_A$'s causal role on ID data.<br>3. Test both on "Hard OOD" (adversarial paraphrases, translations, novel forms of the feature). | **Alex:** Correlation of effect sizes on Hard OOD will be $> 0.8$.<br>**Bea:** Correlation of effect sizes on Hard OOD will be $< 0.5$ (significant decay compared to ID). |
  | **2. Causal Slack** | As the test battery expands to cover all possible inputs, the set of directions that satisfy the causal role converges to a single unique vector (or 1D subspace). Slack is an artifact of incomplete testing. | Even as the test battery expands to all possible inputs, there may remain a multiplicity of directions (a subspace) that are causally equivalent. There is no fact of the matter selecting one vector over another within that subspace. | **Does the set of causally equivalent directions converge to a point (unique feature) or a subspace (equivalence class) as the test battery becomes exhaustive?** | **The Slack Limit:**<br>Measure the volume/angle of the subspace of directions that satisfy the causal role as the test battery size $N \to \infty$. | **Alex:** The angle between any two valid directions goes to 0 as $N \to \infty$.<br>**Bea:** The angle stabilizes at $> 0$ even as $N \to \infty$. |
  | **3. The Unnamed Feature** | A causally robust direction has representational content even if no human can label it. Content is a relation between state and world/use, not state and human-language. | A direction is a steering handle. Without a human-interpretable label connecting the activation to a use-case, calling it a "representation" adds no explanatory power beyond "causal lever #8412." | **Is "representational content" an intrinsic property of a causally robust direction, or does it require a mapping to human-interpretable concepts?** | **The Unnamed Feature:**<br>Identify a direction that is robustly causal and reproducible but has zero correlation with any known human concept or label. | **Alex:** This direction *is* a representation of [Unknown Feature X]. It has truth conditions.<br>**Bea:** This direction is a *latent control variable*. Calling it a representation is a category error until it is interpreted. |

  ## III. META-ANALYSIS: VERBAL VS. GENUINE

  **1. Merely Verbal Disagreements**
  *   **The Word "Representation" (Crux 3):** If Alex defines "representation" as "causally robust internal state" and Bea defines it as "causally robust internal state *mapped to human vocabulary*," they agree on the math and disagree on the label. If Alex concedes that "content" implies "interpretable by the user," Crux 3 dissolves. If Bea concedes that "content" can exist relative to the model's own loss function rather than human language, Crux 3 dissolves.
  *   **Ontological Weight:** Much of the heat comes from Alex implying representations are "discovered" (Platonic) and Bea implying they are "imposed" (Pragmatic). If both agree that directions are mathematical structures selected by gradient descent for loss minimization, the "discovery vs. imposition" framing is largely rhetorical.

  **2. Genuine Disagreements (Empirical)**
  *   **Generalization Geometry (Crux 1):** This is not verbal. Alex predicts that the loss landscape geometry forces different architectures to converge on similar OOD-generalizing directions for the same "task." Bea predicts that architectures will find locally optimal solutions that diverge on OOD data. This is a falsifiable claim about the structure of deep learning solution spaces.
  *   **Uniqueness in the Limit (Crux 2):** This is not verbal. Alex claims the loss function + data distribution defines a unique optimal direction for a feature. Bea claims it defines a manifold of equivalent directions. This is a claim about the curvature and symmetries of the model's internal geometry.

  ## IV. NOTES ON RIG AND VACUITY

  **Critique of Setup 3 (The Unnamed Feature):**
  *   **Risk:** This setup is vulnerable to verbal stipulation. If Alex says "It represents *something*," he is technically unfalsifiable unless he specifies what *something* is.
  *   **Fix:** Require Alex to specify *what* the feature represents in principle (e.g., "a specific logical combination of tokens") even if unnamed. Require Bea to specify what *use-case* would make it a representation. If Alex cannot hypothesize the truth conditions and Bea cannot hypothesize the utility, the setup is vacuous.

  **Critique of Setup 1 (The Transplant Test):**
  *   **Risk:** "Best plays the corresponding causal role" is ill-defined across different architectures. If Model A uses 5 neurons for a feature and Model B uses 50, finding $d_B$ requires a mapping function.
  *   **Fix:** Pre-agree on the alignment metric (e.g., Canonical Correlation Analysis on activation patterns, or functional matching via interchange intervention accuracy). Without a fixed alignment metric, Bea can claim failure to transfer is just failure to align, and Alex can claim success is alignment.

  **Critique of Setup 2 (Causal Slack):**
  *   **Risk:** "All possible inputs" is infinite.
  *   **Fix:** Define the limit operationally. E.g., "As the test battery expands to include all inputs within $L_p$ distance $k$ of the training manifold, does the valid subspace shrink?" If the limit is truly infinite, the test is impossible. Bind the claim to the limit of the *data distribution*, not logical possibility.
