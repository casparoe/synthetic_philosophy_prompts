answer: |-
  # ADVERSARIAL COLLABORATION DRAFT: UNCERTAIN EVIDENCE
  **Status:** Draft for Reading Group Session 3
  **Parties:** "Radical Probabilist" (Philosopher), "Graphical Modeler" (ML)
  **Facilitator:** [User]

  ## 1. DEFINITIONS AND AGREED CLAIMS

  To prevent terminological slippage, we define the following terms for the purpose of this document:

  *   **Credence ($P$):** A function satisfying the probability axioms representing an agent's degree of belief.
  *   **Partition ($\mathbf{E}$):** A set of mutually exclusive and exhaustive propositions $\{E_1, ..., E_n\}$.
  *   **Standard Conditionalization:** Updating on a proposition $E$ learned with certainty. $P_{new}(A) = P_{old}(A|E)$.
  *   **Rigidity:** The constraint that conditional probabilities on the evidence partition remain fixed during an update. $P_{new}(A | E_i) = P_{old}(A | E_i)$.
  *   **Jeffrey Conditionalization (JC):** An update rule where the input is a new marginal distribution over a partition $\{E_i\}$. $P_{new}(A) = \sum_i P_{old}(A | E_i) \cdot P_{new}(E_i)$.
  *   **Virtual Evidence (VE):** An update method where the input is a likelihood function over a partition, modeled as conditioning on a virtual node $V$. $P_{new}(A) \propto P_{old}(A) \cdot L(E_i)$, where $L(E_i)$ is the likelihood ratio provided by the experience.
  *   **Commutativity:** The property that updating on evidence $X$ then evidence $Y$ yields the same posterior as updating on $Y$ then $X$.

  **We agree on the following:**

  1.  **Probability Calculus:** Both sides accept the standard Kolmogorov axioms for static credences.
  2.  **Certain Evidence:** Both sides agree that when a proposition is learned with certainty (probability 1), Standard Conditionalization is the correct update rule.
  3.  **The Phenomenon:** Both sides agree that agents often receive inputs that do not render any proposition certain (e.g., a blurry perception, a classifier score of 0.8).
  4.  **Formal Equivalence (Single Step):** For a *single* update on a *single* partition, JC and VE can be made mathematically equivalent by deriving the appropriate likelihood ratios from the JC marginals (or vice versa). The disagreement concerns *sequential* updates, *input specification*, and *normative interpretation*.
  5.  **Explanatory Burden:** Any proposed rule must explain how to combine multiple pieces of uncertain evidence and must distinguish between rational evidence and arbitrary credence shifts.

  ---

  ## 2. DISAGREEMENTS TABLE

  | Feature | Radical Probabilist (JC) | Graphical Modeler (VE) |
  | :--- | :--- | :--- |
  | **The Input** | The input is the **posterior marginal** over the partition ($P_{new}(E_i)$). Experience tells you directly how confident you should be in the evidence propositions. | The input is the **likelihood ratio** ($P(V|E_i)$). Experience tells you how probable the observation is under each evidence proposition. |
  | **Invariance** | **Rigidity is required.** You must hold fixed your conditional beliefs about the world *given* the evidence ($P(A|E_i)$). Only the weight of the evidence changes. | **Likelihood Ratios are required.** You must hold fixed the diagnostic value of the evidence. Your conditional beliefs $P(A|E_i)$ are allowed to change if the likelihoods imply it. |
  | **Portability** | **Posterior Agreement.** If two agents have the "same experience," they should arrive at the same credences over the partition $\mathbf{E}$, regardless of priors. | **Likelihood Agreement.** If two agents have the "same experience," they should accept the same likelihood ratios. They will *not* arrive at the same credences over $\mathbf{E}$ if their priors differed. |
  | **Sequential Updates** | **Order-Dependent.** Updating on partition $\mathbf{E}$ then $\mathbf{F}$ generally yields a different result than $\mathbf{F}$ then $\mathbf{E}$, unless specific independence conditions hold. | **Order-Independent.** Likelihoods multiply. $Posterior \propto Prior \times L_1 \times L_2$. Multiplication commutes; the order of evidence processing does not matter. |
  | **Normative Constraint** | **Internal Coherence.** The constraint on input is psychological/normative: only shifts caused by "experience" count, not whims, but the formalism accepts any shift. | **Generative Model.** The constraint is structural: evidence must be modeled as a causal child of the hypothesis. Whims cannot be expressed as likelihoods without a model. |

  ---

  ## 3. CRUXES AND PREDICTIONS

  We identify five specific points of divergence. For each, we specify a concrete case and what each side predicts the formalism will yield.

  ### Crux 1: Order-Dependence (Commutativity)
  **The Case:** An agent holds a joint distribution over Hypothesis $H$ and Evidence $E$. They receive two pieces of uncertain information: one suggesting $H$ is likely (shifts $P(H)$ to 0.7), one suggesting $E$ is likely (shifts $P(E)$ to 0.8). These partitions overlap (are not independent).
  *   **Sequence A:** Update on $E$ (to 0.8), then update on $H$ (to 0.7).
  *   **Sequence B:** Update on $H$ (to 0.7), then update on $E$ (to 0.8).

  **Predictions:**
  *   **Radical Probabilist:** Predicts $P_{final}(H, E)$ will differ between Sequence A and Sequence B. JC does not guarantee commutativity for overlapping partitions. This is a feature, not a bug: the *context* of the second update depends on the *state* left by the first.
  *   **Graphical Modeler:** Predicts $P_{final}(H, E)$ must be identical. If the evidence items are distinct observations, their order of processing is irrelevant. If JC yields different results, JC is flawed for sequential reasoning. VE treats these as two likelihood functions $L_1(H)$ and $L_2(E)$ which multiply commutatively.

  ### Crux 2: Portability (The "Same Experience" Test)
  **The Case:** Agent 1 has Prior $P(H) = 0.3$. Agent 2 has Prior $P(H) = 0.6$. Both look at the same blurry image.
  *   **JC Interpretation:** "Same experience" means both agents set their posterior $P_{new}(H)$ to the same value (e.g., 0.8).
  *   **VE Interpretation:** "Same experience" means both agents accept the same Likelihood Ratio (e.g., the image is 5x more likely if $H$ is true).

  **Predictions:**
  *   **Radical Probabilist:** Agents should agree on the posterior $P_{new}(H) = 0.8$. The experience *is* the resulting uncertainty. If they disagree on the posterior, they had different experiences. The prior is irrelevant to the *input* of the update.
  *   **Graphical Modeler:** Agents will disagree on the posterior. Agent 1 will move more than Agent 2. If they agree on the posterior, they have effectively incorporated their priors into the "evidence," which contaminates the data. The likelihood ratio is the only portable unit of evidence.

  ### Crux 3: Rigidity Failure (Classifier Calibration)
  **The Case:** You use a classifier that outputs "80% probability of Rain." You know the classifier is well-calibrated, meaning $P(\text{Rain} | \text{Output}=80\%) = 0.8$. Your prior conditional probability $P_{old}(\text{Rain} | \text{Output}=80\%)$ was *not* 0.8 (perhaps you thought the classifier was biased).
  *   **Update:** You condition on the event "Classifier Output = 80%".

  **Predictions:**
  *   **Radical Probabilist:** This violates Rigidity. JC requires $P_{new}(A | E) = P_{old}(A | E)$. Here, learning the output *changes* your conditional belief about Rain given the output (from your prior belief about the classifier to the calibration fact). JC cannot handle this directly without expanding the partition to include "Classifier is calibrated," which changes the problem structure.
  *   **Graphical Modeler:** This is the standard case. The likelihood $P(\text{Output}=80\% | \text{Rain})$ encodes the calibration. Updating via VE (or standard conditionalization on the output node) naturally shifts $P(\text{Rain} | \text{Output})$ to match the calibration. Rigidity is an unnatural constraint here.

  ### Crux 4: Input Legitimacy (The "Mood Swing" Problem)
  **The Case:** An agent wakes up and simply feels more confident that it will rain ($P(Rain)$ shifts from 0.4 to 0.7), with no external stimulus or proposition learned.
  *   **Question:** Is this a rational update?

  **Predictions:**
  *   **Radical Probabilist:** The formalism accepts the shift as valid *if* the agent judges it to be a direct result of experience. The distinction between "mood" and "evidence" is external to the math (psychological/normative). The math only constrains how to propagate the shift, not whether the shift is permitted.
  *   **Graphical Modeler:** The formalism rejects this. There is no virtual event $V$ and no likelihood $P(V|Rain)$ that generates this shift without a structural claim. A "mood" has no likelihood function. If you cannot specify the likelihood, you cannot update. This prevents arbitrary credence pumping.

  ### Crux 5: Normative Vindication (Dutch Book/Accuracy)
  **The Case:** An agent makes a sequence of soft updates. A bookie offers bets based on the agent's posted credences.
  *   **Question:** Does the update rule protect the agent from a sure loss (Dutch Book) or minimize expected inaccuracy?

  **Predictions:**
  *   **Radical Probabilist:** Standard Dutch Book arguments for Conditionalization do not apply directly. Specialized arguments (e.g., Armendt) exist for JC but require assuming the input probabilities are fixed constraints. Accuracy arguments are weaker; JC minimizes accuracy loss *subject to the constraint* of the new marginals, but does not vindicate the marginals themselves.
  *   **Graphical Modeler:** VE inherits the vindications of Standard Conditionalization. By positing a virtual event $V$, updating on $V$ is just standard conditionalization. If the likelihoods are correct, the agent is immune to standard Dutch Books. The burden of vindication shifts to the justification of the likelihoods, which is a modeling choice, not a logic choice.

  ---

  ## 4. STRUCTURAL NOTE ON VERBAL DISPUTES

  We acknowledge the suspicion that some disagreements are merely verbal. We assert the following are **not** verbal disputes:

  1.  **Commutativity:** This is a mathematical fact. Either the order of operations changes the output number or it does not. JC changes it; VE (with independent likelihoods) does not.
  2.  **Rigidity:** This is a testable constraint on the joint distribution. Either $P_{new}(A|E)$ equals $P_{old}(A|E)$ or it does not. In the Classifier Case (Crux 3), it does not. JC forbids the update; VE allows it.
  3.  **Portability:** This is a divergence in the definition of "evidence." One defines it as a *state* (Posterior), the other as a *function* (Likelihood). This leads to divergent predictions about whether agents with different priors should agree after sharing data.

  We assert the following **may** be verbal (to be resolved in session):
  1.  **The definition of "Experience":** If the Philosopher defines "Experience" as "that which fixes the posterior" and the ML person defines "Experience" as "that which provides the likelihood," they may be talking past each other in Crux 2. However, the *consequence* of that definition (Agreement vs. Disagreement of posteriors) remains a substantive divergence.

  ## 5. NEXT STEPS

  For the next session, each party must select **one** Crux where they are willing to concede their position if the concrete case plays out as the opponent predicts.
  *   **Philosopher:** Recommended target is Crux 3 (Rigidity/Classifier). If JC cannot handle calibration without ad-hoc partition expansion, it is practically limited.
  *   **ML Person:** Recommended target is Crux 4 (Legitimacy). If VE cannot account for non-propositional experiences (e.g., sensory qualia without a clear model), it is descriptively incomplete.
