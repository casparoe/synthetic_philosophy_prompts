          *   Format: Dialogue only, minimum stage directions.
          *   Quality: Neither character should be a strawman. Each must state the other's position strongly before answering. Each must concede something real. Disagreement remains open.
          *   Content: Turn on cruxes (truth vs. description, self-refutation, relativism, action/verdict).
          *   Audience: Assume reader knows nothing about Sanskrit terms; explain them through character motivation/context.
      *   **Context:** Grandfather was a schoolteacher/mill manager. Manuscript uses a specific event: a worker died after a safety guard was removed. Family vs. Union stories differ.

  2.  **Deconstruct the Philosophy (for accurate representation):**
      *   *Anekāntavāda:* Reality is complex; no single proposition captures the whole truth.
      *   *Syādvāda:* "Maybe" or "In some respect." Predication is conditioned (e.g., "In some way, it is," "In some way, it is not").
      *   *Nayavāda:* Partial standpoints.
      *   *The Brother's Critique:* Is this just relativism? Does it prevent action? If *everything* is partial, is *that* statement also partial (self-refutation)? In law, we need a verdict (Guilty/Not Guilty), not "Maybe."
      *   *The Sister's Defense:* It's not relativism (anything goes); it's rigorous acknowledgment of context. It prevents violence caused by absolutism. It's about humility, not evasion.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the setting (boxes, manuscript) and the immediate conflict (publish vs. shred/ignore).
      *   **The Core Conflict (The Mill Accident):** Bring in the specific example from the prompt. The worker death.
