      *   **Concessions:** Sister admits it doesn't give easy answers. Brother admits absolutism causes harm.
      *   **Ending:** Unresolved but shifted.

  4.  **Word Count Management:**
      *   Need to be concise but deep. No long monologues. Quick exchanges.
