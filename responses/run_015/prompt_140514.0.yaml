answer: |-
  "Put it in the keep pile."

  "It's not keepable, David. It's three hundred pages of 'maybe.'"

  "It's not maybe. It's *syādvāda*. Conditioned predication. Grandpa wrote it in the margins too."

  "Grandpa wrote 'buy milk' in the margins. This is a treatise on indecision. *Anekāntavāda*. Reality is many-sided. I know the Sanskrit, Elena. I've heard the eulogy. But I read the chapter on the mill accident."

  "Then you know why it matters."

  "I know it's a way to avoid saying who killed Thomas Gower. The guard was removed. Gower died. The union says management ordered it to speed up the line. Management says a worker tampered with it. Grandpa's solution is to say both statements are true in some respect, false in some respect, and indescribable in some respect. That isn't philosophy. That's a deposition nightmare."

  "It's not saying both are true. It's saying no single statement captures the whole event. If you say 'Management killed him,' you ignore the worker who loosened the screw. If you say 'The worker killed him,' you ignore the quota pressure from above. Grandpa wasn't evading liability. He was mapping the causality."

  "Causality needs a proximate cause. I spend my life compressing messy events into single findings of fact. That's not because I'm simple. It's because a verdict requires a binary. Guilty or not. Liable or not. If you tell a jury that reality is many-sided, you aren't giving them truth. You're giving them paralysis."

  "Or you're giving them humility. You think your binary verdicts are truth. I think they're fictions you tell so you can sleep at night. You compress the mess until it fits the statute. Grandpa refused to compress it. He thought the compression was the violence."

  "Without compression, there is no justice. There's only endless context. You're defending relativism with better manners. If every assertion is only partial, then your assertion that 'every assertion is partial' is also partial. Which means there might be absolute truths after all. Including the one that says your grandfather's manuscript is garbage."

  "He anticipated that. The doctrine isn't a claim about truth itself. It's a claim about the incompleteness of description. Language is a standpoint. *Nayavāda*. A partial view. The statement 'all views are partial' is a rule of logic, not a description of reality. It doesn't bite its own tail. It's a ladder you kick away once you've climbed."

  "It's a ladder that doesn't reach the roof. I need to know if I should publish this. If I put this out, the insurance company will use it to deny the claim. They'll say even the family admits the truth is unknowable. You want to honor him? Don't let his life's work become a loophole for the mill owners."

  "You think publishing it admits defeat? I think hiding it admits that we're afraid of complexity. The union story and the family story have been incompatible for thirty years because both sides demand to be the whole truth. That's why the town is still bitter. Because everyone is fighting over a shadow."

  "Someone has to pay the widow. Shadows don't write checks. You're missing the ethical crux. A view that declines a final verdict cannot tell anyone what to do when a verdict is owed. If I'm judging a case, I can't say 'In some respect, you are negligent.' I have to say 'You are.' Or 'You aren't.' Does his philosophy offer an action guide? Or is it just contemplation for people who don't have to decide?"

  "It offers caution. It stops you from acting as if you know more than you do. Most violence comes from certainty. The mill guard was removed because someone was certain production mattered more than safety. Or certain that safety didn't require the guard. Certainty killed Thomas Gower. Grandpa's manuscript is a vaccine against certainty."

  "Certainty also built the hospital that tried to save Gower. Certainty gets the bridge built so the ambulance can cross. You're romanticizing doubt. I'll concede this: absolutism causes harm. I've seen clients destroyed by opponents who believed their own lies. But the cure isn't to dissolve the concept of fact. It's to be rigorous about evidence. Grandpa isn't being rigorous. He's being poetic."

  "And you're being legalistic. But look at the concession you just made. You admitted absolutism causes harm. So you agree that single-sided views are dangerous. Then why demand a single-sided verdict?"

  "Because the alternative is worse. If we accept that no verdict is fully true, then justice becomes arbitrary. Why punish anyone? Why compensate anyone? If liability is only partial, is the payout only partial? You can't split a widow's grief into seven standpoints. At some point, you have to stop analyzing and start paying."

  "I'm not saying we don't pay. I'm saying we pay without claiming we know the whole story. We can say 'From the standpoint of the law, you are liable,' without saying 'You are the sole cause of this evil.' It changes the texture of the judgment. It leaves room for repair instead of just blame."

  "That's beautiful. It's also unenforceable. Courts don't deal in texture. They deal in orders. But I'll concede this: my verdicts feel like lies sometimes. I win a case, and I know I only proved one slice of the story. I walk away knowing the other side had truth too, but the system required me to bury it. Maybe Grandpa was trying to write down what I feel every time I close a file."

  "Then let people read it. Let them see that the silence between the stories is where the truth lives."

  "If I publish, I invite the town to reopen the wound. The union will say he sided with management. Management will say he sided with the union. He'll be posthumously dragged through the mud because he refused to pick a team."

  "He didn't refuse to pick a team. He refused the game. That's the point. But you're right. Publishing it might not change anything. It might just be more paper in a house full of paper."

  "So what do we do? We're standing in the middle of his life, and we have to decide. Keep or shred. Publish or bury. We need a verdict, Elena. Right now. Is this manuscript true?"

  "It's true that we don't know the whole truth."

  "That's not an answer."

  "It's the only one he left us. But... if you need a binary? Keep it. Not to publish. Not yet. But not to shred."

  "Because?"

  "Because you were right. Without a verdict, nothing gets done. But I was right too. Without this, the verdict is a lie. We keep the manuscript so that when we do decide, we know what we're leaving out."

  "That's a compromise. It's not a solution."

  "No. It's *syādvāda*. In some respect, we keep it. In some respect, we let it go."

  "Fine. Box stays open. But I'm writing the introduction. If this goes out, someone has to explain that this isn't an excuse for negligence."

  "Agreed. But I write the afterword. Someone has to explain that negligence isn't the only thing that kills people. Certainty does too."

  "Deal. Now help me lift this crate. It weighs more than it looks."

  "Everything does."
