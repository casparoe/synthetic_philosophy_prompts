      *   **The Breaks (Disanalogies):**
          *   *Causal Origin:* The bug wouldn't exist without the author. The merge wouldn't happen without the author (usually).
          *   *The "Bystander" Problem:* Reviewers aren't random bystanders; they are assigned gatekeepers. But Authors are *creators*.
          *   *Epistemic Load:* The author knows the code best. The reviewer is sampling.
          *   *Process vs. Physics:* Merging is a choice, drowning is a state.
      *   **Smuggled Assumptions:**
