      *   *Wait, one more nuance:* The coworker making the argument *is* the reviewer. He is arguing *against his own interest* (admitting equal blame). This suggests he might be trying to foster a "we are in this together" culture, or he genuinely believes the philosophical point. I should mention this motivational aspect.

