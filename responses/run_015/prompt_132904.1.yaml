      *   Use precise philosophical terminology (e.g., "trichotomy," "lexical superiority," "parity").
      *   Ensure the distinction between "not better" (equality) and "not better" (incommensurability) is sharp.
      *   Make the "Impossibility" section punchy and explicit.

