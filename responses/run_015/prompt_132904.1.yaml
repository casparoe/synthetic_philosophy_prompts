  10. **Final Structure:**
      *   Introduction (Scope).
      *   I. Extensional Desiderata (Pairwise Cases).
      *   II. Structural Desiderata (Formal Properties).
      *   III. Conceptual Distinctions (Equality vs. Incommensurability).
      *   IV. Classification (Non-negotiable vs. Camp).
      *   V. Impossibility Results (The Core Tensions).
      *   VI. Brief Theory Assessment.

  11. (Final Polish): Ensure the distinction between *homogeneous quantitative dimension* (more pleasure) and *qualitatively shifting scale* (pleasure vs. dignity) is highlighted as requested.

  12. *Wait, one more check:* The prompt asks to "List every desideratum the theory must satisfy." I need to be careful not to present contested claims as absolute "musts" without qualifying them in the classification section. I will frame them as "Candidate Desiderata" and then classify their status. Actually, the prompt asks for the specification of an *adequate* theory. I should present the criteria that define adequacy, acknowledging that meeting all is the problem. I will list them as requirements for a *successful* resolution, then show which are incompatible.

      *Revised Plan:* List the desiderata as "Requirements for Adequacy." Then, in the "Impossibility" section, reveal that they form an inconsistent set. This aligns with the prompt's request to "identify whether any subset... is jointly unsatisfiable."

      *Let's refine the "Non-negotiable" list.* Asymmetry is logically required for a strict partial order. But is it non-negotiable in *all* cases? If A and B are incommensurate, neither is better. That holds asymmetry. If A and B are equal, neither is better. That holds asymmetry. So Asymmetry of "Better Than" is non-negotiable. Transitivity is the main casualty.

      *Let's refine the "Boundary" issue.* The prompt asks for "non-arbitrariness of boundaries." This is the heart of the Sorites. A theory must explain why the shift happens without a magic number.

      *Okay, ready to write.*
answer: |-
  # Specification for an Adequate Theory of the Comparative Relation "Better Than" in Spectrum Arguments

  This specification defines the criteria for a theory of value comparison ($>$) capable of resolving spectrum arguments (sorites-style chains of value). The criteria are divided into Extensional (case-based), Structural (formal), and Conceptual (distinction-based) desiderata. Following the list, requirements are classified by status, and logical tensions are explicated.

  ## I. Extensional Desiderata (Pairwise Cases)
  *The theory must correctly assign truth values to the relation $A > B$ across four specific types of pairwise comparisons found in spectrum chains.*

  **1. Clear Superiority (The Anchors)**
  *   **Criterion:** For endpoints $A$ (high quality/low quantity) and $Z$ (low quality/high quantity) that are sufficiently distant, if intuition dictates $A$ is vastly superior, the theory must yield $A > Z$. Conversely, if the spectrum argues toward the Repugnant Conclusion, the theory must be able to yield $Z \ngtr A$ without contradiction.
  *   **Motivating Case:** A life of high autonomy and moderate pleasure ($A$) vs. a life of "muzak and potatoes" ($Z$). The theory must not force the conclusion that $Z > A$ solely via transitive closure if that violates deep reflective equilibrium.
  *   **Status:** **Non-negotiable.** A theory that forces the counter-intuitive global ordering is extensionally inadequate.

  **2. Local Indiscernibility (The Step)**
  *   **Criterion:** For adjacent members in a homogeneous spectrum ($A_n$ and $A_{n+1}$), where the difference is below the threshold of practical or phenomenological notice, the theory must allow that $A_{n+1} \ngtr A_n$ (or that they are equal).
  *   **Motivating Case:** Adding one grain of sand to a heap; adding one second of mild pain to a torture session. It is implausible that a single marginal addition makes an outcome strictly *better* (or worse) in a meaningful choice-guiding sense.
  *   **Status:** **Non-negotiable.** Denying this collapses the spectrum argument into a simple linear ordering, failing to capture the phenomenological reality of marginal change.

  **3. Borderline Proximity (The Penumbra)**
  *   **Criterion:** In the middle of the chain, where qualitative shifts begin to outweigh quantitative accumulation, the theory must accommodate cases where it is indeterminate whether $A_n > A_{n+1}$.
  *   **Motivating Case:** The point where increasing population size begins to erode average welfare significantly. The theory must not force a sharp "true/false" binary where human judgment hesitates.
  *   **Status:** **Camp Preference** (Required by Vagueness/Epistemicist views; rejected by Crisp Binary views).

  **4. Distant Incommensurability (The Gap)**
  *   **Criterion:** For items separated by a qualitative shift (e.g., aesthetic value vs. moral duty), the theory must allow that neither $A > B$ nor $B > A$ nor $A = B$.
  *   **Motivating Case:** Comparing a minor aesthetic improvement to a significant moral cost. The theory must permit a "no comparative relation" state without defaulting to equality.
  *   **Status:** **Camp Preference** (Required by Value Pluralists; rejected by Monists/Utilitarians).

  ## II. Structural Desiderata (Formal Properties)
  *The theory must specify which logical properties the relation $>$ preserves or abandons.*

  **5. Asymmetry**
  *   **Criterion:** If $A > B$, then $\neg(B > A)$.
  *   **Motivating Case:** Logical coherence of choice. If A is chosen over B because it is better, B cannot simultaneously be chosen over A for the same reason.
  *   **Status:** **Non-negotiable.** This is definitional for "better than." (Note: This does not preclude incommensurability, where neither holds).

  **6. Transitivity (Global)**
  *   **Criterion:** If $A > B$ and $B > C$, then $A > C$. This must hold across the entire chain, from $A_1$ to $A_{1000}$.
  *   **Motivating Case:** Rational choice consistency. If you prefer A to B and B to C, preferring C to A constitutes a money-pump vulnerability.
  *   **Status:** **Camp Preference** (Rational Choice Orthodoxy). *See Impossibility Section.*

  **7. Local Transitivity (Neighborhood Continuity)**
  *   **Criterion:** Transitivity must hold within small "neighborhoods" of similarity. If $A \approx B$ and $B \approx C$, then $A \approx C$.
  *   **Motivating Case:** The Sorites Step. We accept that if $A_n$ is not better than $A_{n+1}$, and $A_{n+1}$ is not better than $A_{n+2}$, then $A_n$ is not better than $A_{n+2}$ *locally*.
  *   **Status:** **Non-negotiable.** Abandoning local transitivity makes the concept of a "spectrum" incoherent.

  **8. Completeness (Trichotomy)**
  *   **Criterion:** For any $A, B$, exactly one holds: $A > B$, $B > A$, or $A = B$.
  *   **Motivating Case:** Decision theory requires a determinate ranking to maximize utility.
  *   **Status:** **Camp Preference** (Monists accept; Pluralists reject).

  **9. Non-Arbitrariness of Boundaries**
  *   **Criterion:** If a shift from "not better" to "better" occurs in the chain, it cannot occur at a specific integer $n$ without a qualitative justification. There must be no "magic number."
  *   **Motivating Case:** The Sorites Paradox. Asserting that 543 grains make a heap but 542 do not is arbitrary. Similarly, asserting $A_{543} > A_{542}$ but $\neg(A_{543} > A_{542})$ is implausible.
  *   **Status:** **Non-negotiable.** A theory requiring a sharp, unjustified cutoff is extensionally inadequate.

  ## III. Conceptual Distinctions
  *The theory must not collapse specific conceptual categories.*

  **10. Equality vs. Incommensurability**
  *   **Criterion:** The state of "not better" ($\neg(A > B)$) must distinguish between *Equality* ($A = B$, same value level) and *Incommensurability* ($A \perp B$, different value dimensions).
  *   **Motivating Case:** Two lives of equal welfare are *equal*. A life of artistic greatness and a life of moral saintliness may be *incommensurate*. Collapsing these implies that all values are reducible to a single metric.
  *   **Status:** **Non-negotiable.** Collapsing this distinction eliminates the possibility of value pluralism.

  **11. Quantitative Accumulation vs. Qualitative Shift**
  *   **Criterion:** The theory must distinguish between moving along a homogeneous dimension (more pleasure) and moving across a heterogeneous dimension (pleasure vs. dignity).
  *   **Motivating Case:** In a spectrum argument, early steps are quantitative (more people), later steps imply qualitative degradation (lower quality of life). A theory that treats these identically fails to capture lexical priorities.
  *   **Status:** **Non-negotiable.**

  ---

  ## IV. Classification of Requirements

  | Requirement | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Asymmetry** | **Non-negotiable** | Logical precondition for strict preference. |
  | **Local Transitivity** | **Non-negotiable** | Required for the coherence of "marginal change." |
  | **Clear Superiority (Anchors)** | **Non-negotiable** | Required to match reflective equilibrium on paradigm cases. |
  | **Non-Arbitrary Boundaries** | **Non-negotiable** | Required to avoid the Sorites Paradox. |
  | **Equality/Incommensurability Distinction** | **Non-negotiable** | Required for conceptual accuracy regarding value types. |
  | **Global Transitivity** | **Camp Preference** | Required by Rational Choice Theory; often abandoned by Spectrum Solutions. |
  | **Completeness** | **Camp Preference** | Required by Utilitarianism/Welfarism; abandoned by Pluralism. |
  | **Continuity** | **Camp Preference** | Required by Classical Economics; abandoned by Lexical Views. |

  ---

  ## V. Impossibility Results and Internal Tensions

  **1. The Transitivity-Boundary Tension (The Core Impossibility)**
  *   **Conflict:** **Global Transitivity** + **Local Indiscernibility** + **Non-Arbitrary Boundaries** + **Clear Superiority (Anchors)**.
  *   **Explanation:** It is logically impossible to satisfy all four simultaneously.
      *   If you accept Local Indiscernibility ($\neg(A_n > A_{n+1})$) for every step in a long chain...
      *   And you enforce Global Transitivity...
      *   Then you must conclude $\neg(A_{start} > A_{end})$.
      *   If Clear Superiority demands $A_{start} > A_{end}$, you have a contradiction.
      *   To resolve this, you must either:
          1.  **Deny Local Indiscernibility:** Assert a sharp cutoff where $A_n \ngtr A_{n+1}$ but $A_{n+1} > A_{n+2}$. (Violates **Non-Arbitrary Boundaries**).
          2.  **Deny Global Transitivity:** Allow $A > B$ and $B > C$ but $A \ngtr C$ over long distances. (Violates **Global Transitivity**).
          3.  **Deny Clear Superiority:** Accept the Repugnant Conclusion or similar counter-intuitive global ordering. (Violates **Clear Superiority**).
  *   **Verdict:** **Unrestricted Transitivity and Non-Arbitrary Boundaries are jointly unsatisfiable** in the presence of a Sorites chain where the endpoints are intuitively ranked opposite to the transitive closure of the steps.

  **2. The Completeness-Incommensurability Tension**
  *   **Conflict:** **Completeness** + **Equality/Incommensurability Distinction**.
  *   **Explanation:** If the relation is complete, every pair must be rankable as $>$, $<$, or $=$. This leaves no logical space for incommensurability ($\perp$). To preserve the distinction, Completeness must be abandoned.
  *   **Verdict:** **Completeness is incompatible with genuine Incommensurability.**

  **3. The Continuity-Lexicality Tension**
  *   **Conflict:** **Continuity** + **Qualitative Shift Distinction**.
  *   **Explanation:** Continuity implies that for any improvement in Quality, there is some Quantity of lower Quality that compensates for it. A Qualitative Shift (Lexical View) implies that *no* amount of lower quality compensates for the loss of higher quality.
  *   **Verdict:** **Continuity is incompatible with Lexical Priorities.**

  ---

  ## VI. Brief Theory Assessment Against Criteria

  **1. Strict Total-Ordering View (e.g., Classical Utilitarianism)**
  *   **Survives:** Asymmetry, Global Transitivity, Completeness, Continuity.
  *   **Fails:** **Non-Arbitrary Boundaries** (implies a sharp, albeit perhaps unknown, cutoff point where one unit of value tips the scale); **Clear Superiority (Anchors)** (often forced to accept the Repugnant Conclusion via transitivity); **Equality/Incommensurability Distinction** (collapses all value to a single metric).
  *   **Primary Weakness:** Solves the structural logic by sacrificing the phenomenological plausibility of the endpoints and the non-arbitrariness of the margin.

  **2. Incommensurabilist View (e.g., Value Pluralism/Parity)**
  *   **Survives:** **Clear Superiority (Anchors)** (can deny $Z > A$); **Equality/Incommensurability Distinction**; **Non-Arbitrary Boundaries** (allows for "zones" of parity rather than sharp lines).
  *   **Fails:** **Completeness**; **Global Transitivity** (often requires abandoning transitivity across zones of parity to avoid the spectrum conclusion).
  *   **Primary Weakness:** Sacrifices the axioms of standard rational choice theory (completeness/transitivity) to preserve intuitive value judgments.

  **3. Vagueness-Based Graded-Membership View (e.g., Fuzzy Axiology)**
  *   **Survives:** **Non-Arbitrary Boundaries** (replaces sharp lines with degrees of truth); **Local Transitivity** (holds within high-degree membership); **Equality/Incommensurability Distinction** (can model parity as overlapping membership).
  *   **Fails:** **Global Transitivity** (transitivity fails for fuzzy relations when truth values drop below a threshold); **Asymmetry** (can become blurred in borderline cases, e.g., $A$ is "0.6 better" than $B$, $B$ is "0.6 better" than $C$...).
  *   **Primary Weakness:** Mathematically complex; struggles to provide action-guiding advice when truth values of "better than" are low (e.g., 0.51 vs 0.49).

  ## VII. Conclusion on Adequacy
  An adequate theory of "better than" for spectrum arguments **cannot** satisfy the set {Global Transitivity, Non-Arbitrary Boundaries, Clear Superiority of Anchors}.
  *   To be **Rationalist-Adequate**, one must accept sharp boundaries or counter-intuitive global conclusions (favoring Strict Total Ordering).
  *   To be **Phenomenologically-Adequate**, one must abandon Global Transitivity or Completeness (favoring Incommensurabilism or Vagueness).

  Therefore, the specification of an "adequate" theory is relative to which desideratum is treated as the **Non-negotiable Anchor**. If Rational Choice axioms are non-negotiable, the theory must be a Strict Total Order. If Intuitive Value Judgments are non-negotiable, the theory must be Incommensurabilist or Vague. **No theory satisfies all listed desiderata simultaneously.**
