answer: |-
  Dear Friend,

  You ask a question that cuts to the heart of what we believe an archive to be, and why the staff in that repository speak of destruction when not a single word has been erased. When archivists claim that re-ordering files destroys the record, they are relying on a specific ontology in which a document is not merely a container of information but a piece of evidence within a transaction. In this traditional view, the record derives its meaning from its context of creation, so that its position in a filing system is not accidental but evidential. The sequence tells us who saw the document, why it was kept, and what action it prompted. To move a file from the desk of the admissions officer to the life story of the child is to sever the link between the document and the administrative function that produced it. The staff fear that without this link, the record ceases to be proof of what the institution did and becomes merely a statement of what happened to someone, shifting the authority from the creator of the record to the subject of it. This is why they argue the record is destroyed; its capacity to testify to the institution's processes is lost even if its capacity to convey information remains.

  Yet you are right to point out the tension this creates with everyday archival work. Repositories routinely rebox, re-folder, and digitize materials, actions that physically detach documents from their original containers and often alter their sequence for the sake of preservation or access. The theoretical defense is that these changes affect the physical carrier but preserve the intellectual order, yet this distinction grows thin when digitization fragments the physical whole anyway. The inconsistency suggests that the prohibition against re-ordering is not truly about physical integrity but about maintaining the institution as the primary author of history. The practice rules out the rival picture of records as instruments owed to the people they document, a view that would prioritize the experiential truth of the survivor over the administrative truth of the state. By insisting on original order, the archive quietly asserts that the state's classification of a child is more real than the child's own memory of their life, treating the file as a shield for the bureaucracy rather than a mirror for the community.

  There are, however, places where this practice is underdetermined, where the theory does not actually dictate the shelf order as strictly as claimed. Often, when records arrive, there is no clear original order to preserve, only a chaotic heap of papers. In these cases, the archivist imposes an order based on convenience or logic, such as alphabetical or chronological sorting. Here, several different theories could license the same shelf order. A pragmatist might choose alphabetical order for ease of access, while a traditionalist might claim it reflects the filing clerk's original intent, and a community advocate might agree because it helps families find names quickly. The apparent rigidity of the principle often masks the subjective judgments archivists make when the evidence of original order is missing. This underdetermination reveals that the current arrangement is not a sacred preservation of the past but a contemporary construction that could be built differently without violating the physical evidence.

  If the survivors' re-ordering were adopted, the consequences would ripple through the finding aid, the courtroom, and the classroom. The finding aid would cease to be a neutral map of administrative boxes and would instead become a narrative guide, structured around lives rather than offices, requiring archivists to write descriptive notes that acknowledge the harm documented within rather than simply listing file titles. In legal proceedings, the treatment of records as evidence would shift from proving administrative compliance to substantiating personal testimony, potentially challenging laws that privilege institutional provenance as the sole guarantor of authenticity. Archivists would no longer be trained as neutral custodians of static objects but as mediators of memory, taught to balance the evidential needs of the state with the human rights of the subjects. This would require a new ethics of care where the archivist acknowledges that silence and structure are themselves political acts. Ultimately, the conflict you describe is not about paper but about power, asking whether the archive exists to protect the integrity of the institution that created the records or to serve the truth of the people whose lives were caught within them.

  Yours sincerely,

  A Correspondent
