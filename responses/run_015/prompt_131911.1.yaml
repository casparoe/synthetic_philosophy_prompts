answer: |-
  ### Exam Question

  **Question 4: The Basic Argument and the Uncaused Origin (25 Marks)**

  Consider an agent named Kai. Kai's psychological development from birth to age twelve was the product of a fully deterministic causal chain involving genetics and environment. However, at exactly age twelve, a genuinely random, uncaused mental event occurred in Kai's mind. This event was not determined by prior states, nor was it willed by Kai; it simply happened. Following this event, Kai entered a self-modifying feedback loop: utilizing the mental shift provided by the random event, Kai deliberately cultivated, reinforced, and refined a specific set of character traits over the next decade. From age twelve onward, Kai's actions flowed deterministically from this self-cultivated character.

  Galen Strawson's Basic Argument posits that moral responsibility is impossible because it requires an agent to be *causa sui* (cause of oneself). Using the case of Kai, evaluate whether the introduction of a single uncaused "origin point" blocks Strawson's regress. Does the presence of indeterminism at age twelve grant Kai the necessary sourcehood to be truly morally responsible for the traits cultivated thereafter? In your answer, distinguish clearly between the absence of determinism, the presence of randomness, and the requirements for ultimate moral ownership.

  ***

  ### Model Answer

  Galen Strawson's Basic Argument asserts that true moral responsibility requires "Ultimate Responsibility" (UR). To be responsible for one's actions, one must be responsible for the mental nature from which those actions flow. However, to be responsible for one's mental nature, one must have chosen it based on some prior mental nature, leading to an infinite regress. Strawson concludes that because one cannot be *causa sui*—the ultimate cause of one's own existence and nature—moral responsibility is impossible. The case of Kai attempts to interrupt this regress by inserting an uncaused event, but upon analysis, this modification fails to secure the necessary sourcehood.

  The crucial error in the Kai hypothetical is the assumption that breaking determinism secures agency. Strawson's argument is not merely a complaint about determinism; it is a complaint about the conditions of origination. For Kai to be responsible for the character traits cultivated after age twelve, Kai must be responsible for the decision to cultivate them. This decision emerged from the feedback loop initiated by the random event at age twelve. While this event breaks the deterministic chain, it does not establish Kai as the *source* of the event. By definition, the event was uncaused and unwilled. It was a matter of luck, not agency.

  Distinguishing between determinism, randomness, and sourcehood is vital here. Determinism implies that prior states necessitate future states. Randomness implies that future states are not necessitated by prior states. However, neither condition guarantees sourcehood. Sourcehood requires that the agent is the ultimate author of the action. In Kai's case, the random event provides indeterminism, but it creates a "gap" in causation rather than a locus of control. If the mental shift at age twelve was not caused by Kai's prior character (because it was random), then Kai did not author it. It happened *to* Kai, rather than *by* Kai.

  Consequently, the subsequent self-modification feedback loop cannot rescue Kai's responsibility. While Kai exerted effort to reinforce specific traits, the *basis* for that reinforcement was the uncaused random event. One cannot be responsible for the consequences of a cause for which one is not responsible. If the initial impulse was a matter of luck, the character built upon that impulse is ultimately grounded in luck. Strawson would argue that Kai is still not *causa sui*. Kai did not create the capacity for self-modification, nor did Kai choose the random spark that ignited the process. To be truly responsible, Kai would have needed to exist prior to the random event to choose it, which is metaphysically impossible.

  Therefore, the uncaused origin point does not block the regress; it merely shifts the problem. The regress demands that the agent be responsible for how they are *mentally* at the time of the decision. At age twelve, Kai's mental state regarding the random event was not self-determined; it was indeterminate. An indeterminate state is no more "owned" by the agent than a determined one. Ultimate Responsibility requires that the agent creates their own nature out of nothing, without relying on luck or prior determination. Since Kai relies on both (deterministic upbringing and a random spark), Kai fails to meet the *causa sui* condition.

  In conclusion, Strawson's Basic Argument applies to Kai with full force. The introduction of randomness avoids determinism but fails to provide the positive control required for moral ownership. Without being the ultimate cause of the random event itself, Kai cannot claim authorship over the resulting character. The impossibility of being *causa sui* remains insurmountable, rendering true moral responsibility impossible even in this hybrid metaphysical scenario.

  ***

  ### Marking Scheme

  **Total Marks: 25**

  | Point | Conceptual Move Required | Marks | Common Candidate Failure |
  | :--- | :--- | :--- | :--- |
  | **1. The *Causa Sui* Requirement** | Must identify that Strawson's core objection is not determinism *per se*, but the impossibility of being the ultimate cause of one's own mental nature (UR). | 5 | Treating the Basic Argument solely as a complaint about causal determinism rather than the conditions of origination. |
  | **2. Analysis of the Random Event** | Must argue that an "uncaused" event does not equate to an "agent-caused" event; it constitutes luck rather than authorship. | 5 | Conflating the absence of determinism (indeterminism) with the presence of freedom or control (the "Libertarian mistake"). |
  | **3. The Feedback Loop Limitation** | Must explain that cultivating traits based on an unchosen impulse does not grant responsibility for the impulse itself or the resulting character foundation. | 5 | Assuming that effort, revision, or self-modification automatically confers moral responsibility regardless of the initial cause. |
  | **4. Tripartite Distinction** | Must clearly distinguish between Determinism (necessitation), Randomness (absence of cause), and Sourcehood (ultimate authorship), showing randomness fails to provide the third. | 5 | Treating Randomness as a third kind of Control rather than an absence of causal connection to the agent. |
  | **5. Final Verdict on Kai** | Must conclude that Strawson's argument holds against Kai because the random event does not satisfy the requirement for Ultimate Responsibility. | 5 | Hedging the conclusion or claiming Kai has "partial" responsibility without addressing the impossibility of *Ultimate* responsibility. |
