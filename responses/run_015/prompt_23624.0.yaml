answer: |-
  This is a fantastic question. You have stumbled onto a deep issue in the philosophy of science and Bayesian epistemology that has puzzled statisticians and philosophers for decades. You aren't missing anything obvious; you are grappling with the tension between **subjective confidence** and **objective evidentiary weight.**

  The short answer is: **Yes, the replication is strong evidence for you, even though you already believed the result.**

  Here is why your intuition is tripping you up, broken down into the Bayesian mechanics, the nature of the hypothesis, and the "ceiling effect" of probability.

  ### 1. The Bayesian Mechanics: It's about the Alternative
  In Bayesian terms, evidence is determined by the **Likelihood Ratio**. This is the ratio of:
  1.  How likely the data is if your hypothesis is true ($P(E|H)$).
  2.  How likely the data is if your hypothesis is **false** ($P(E|\neg H)$).

  You are focusing on the first part. You're thinking: *"I already believed the drug works ($H$), so I expected this replication ($E$). Therefore $P(E|H)$ is high."* That is correct.

  However, the evidentiary weight comes from the denominator: **$P(E|\neg H)$**.
  Ask yourself: *If the drug actually does nothing, what is the probability that an independent lab would nonetheless publish a successful replication?*

  *   **If it were your lab again:** The probability might be high. Maybe you have a specific mouse strain, a specific temperature, or an unconscious bias in measurement that creates a false positive. If you replicated it yourself, $P(E|\neg H)$ is high, so it's weak evidence.
  *   **Because it is an independent lab:** For the result to be a false positive *again*, two completely different teams, with different mice, different reagents, and different biases, would have to make the same mistake or find the same noise pattern.

  The probability of two independent labs generating the same false positive is extremely low (roughly the product of their individual false-positive rates). Because $P(E|\neg H)$ is tiny, the Likelihood Ratio is huge.

  **The Math:**
  Let's say your prior credence was 95% (Odds of 19:1).
  *   If the drug works, the chance of replication is ~90%.
  *   If the drug *fails*, the chance of an independent replication is ~5% (assuming standard p-values) $\times$ ~5% (for the second lab) = 0.25%.
  *   Likelihood Ratio = $90 / 0.25 = 360$.
  *   Your posterior odds = $19 \times 360 = 6840:1$.
  *   Your new probability = 99.98%.

  Mathematically, your belief *did* shift massively in terms of odds, even if it feels small in terms of percentage points.

  ### 2. You Changed the Hypothesis
  This is the most important conceptual point. You think you are testing the same hypothesis, but you aren't.

  *   **Before Replication:** Your hypothesis was effectively, *"Our lab's data reflects reality."*
      *   **Rival Hypothesis:** *"Our lab made a mistake (bias, artifact, contamination)."*
  *   **After Replication:** Your hypothesis is now, *"This biological mechanism exists across contexts."*
      *   **Rival Hypothesis:** *"There is a universal confound affecting all labs"* (Much harder to sustain).

  The replication didn't just add data points; it **ruled out a specific class of error theories** that your prior belief didn't fully eliminate. You might have trusted your pipetting, but did you trust your mouse supplier? Did you trust that you didn't subconsciously select healthier tumors? The independent lab eliminates *your* specific local sources of error.

  So, the evidence isn't just "The drug works." The evidence is "The drug works *and* it isn't just a quirk of our specific lab environment." That is a stronger claim than the one you held before.

  ### 3. The "Ceiling Effect" (Psychology vs. Math)
  You mentioned: *"It barely moved my credence."*

  This is a known psychological phenomenon regarding probability scales. The difference between 50% and 75% feels huge. The difference between 95% and 99.9% feels tiny. But in terms of **betting odds**, the shift is enormous.
  *   95% confidence means you'd accept a bet of 19:1.
  *   99.9% confidence means you'd accept a bet of 999:1.

  That is a 50-fold increase in how much you should be willing to wager on the drug's success. Your *feeling* of confidence has a ceiling (you can't feel "more sure" than absolutely sure), but your *logical* commitment has shifted significantly.

  ### 4. Addressing the Generalization (The "Dogmatism" Worry)
  You worried this generalizes: *"Once you've learned the literature, it looks like nothing new... can count as evidence."*

  This is a version of the **Problem of Old Evidence** or the **Dogmatism Objection** in Bayesianism. If I know Newton's laws, does a falling apple count as evidence for gravity?

  The resolution is that new evidence is never just testing the main theory; it is testing the **conjunction of the theory and the absence of new error sources.**

  Even if you trust the literature, a new experiment counts as evidence because:
  1.  **It tests auxiliary assumptions:** Maybe the literature is right, but *this* specific batch of drug is degraded. The experiment tests that.
  2.  **It rules out conspiracy/systemic error:** If 100 labs find X, and you find Not-X, that's evidence. If 100 labs find X, and the 101st lab also finds X, that reduces the probability that the first 100 were part of a systemic bias (e.g., publication bias, shared contaminated cell line).
  3.  **Priors are never 1.0:** As long as you leave even a 0.01% chance that you are wrong, sufficiently strong independent evidence *must* update you. If you assign probability 1.0 (absolute certainty), you have left the realm of science and entered dogma. Science requires you to acknowledge that you *could* be wrong, no matter how confident you are.

  ### Summary
  Your postdoc is right. The replication is strong evidence.

  1.  **Independence is key:** It drastically lowers the probability of the result occurring if the hypothesis were false ($P(E|\neg H)$).
  2.  **It kills different demons:** It rules out lab-specific artifacts that your original belief couldn't rule out.
  3.  **The shift is real:** Your "odds" shifted massively, even if your "percentage" didn't look like it moved much due to the ceiling effect.

  You aren't missing a math trick; you are experiencing the difference between **predicting data** (which you did) and **ruling out alternative explanations for that data** (which the replication did). The value of the replication isn't that it surprised you; it's that it survived a gauntlet of independence that a false positive almost certainly would not have.
