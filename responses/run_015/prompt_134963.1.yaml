  ### The Torn Cases

  **(a) The Self-Referential Model**
  *   **Analysis:** If the register storing the model is part of the system, then querying it (reading the register) is an intervention that changes the system state (updates the model).
  *   **Verdict:** The ontology is **time-indexed and intervention-sensitive**.
  *   **Principle Application:** The variable "Model State" satisfies the Ontic Condition. However, the Epistemic Condition is unstable: reading it changes it. This is not "no fact of the matter"; it is a **Dynamic Fixed Point** problem. The fact of the matter exists at any instant $t$, but you cannot know $M_t$ without creating $M_{t+1}$.
  *   **Ruling:** Well-posed, but knowledge is necessarily one step behind reality.

  **(b) The Multiscale Case**
  *   **Analysis:** Coarse (3 vars, nonlinear) vs. Fine (5 vars, linear). Both exact at their resolution.
  *   **Verdict:** Ontology is **Resolution-Relative**.
  *   **Principle Application:** The "System" is defined by the Channel. If the Channel has fixed time resolution, only one ontology is valid for *that* channel. If you can change the channel's resolution, you are meeting *different effective systems*.
  *   **Ruling:** There is no "unique finest grain" requirement. If the fine-grain dynamics do not project cleanly to the coarse-grain (i.e., if the coarse variables are not sufficient statistics of the fine ones), they are **distinct ontologies for distinct interfaces**. Do not seek a single "True" ontology; seek the ontology true *to the interface*.

  ---

  ### Diagnostic Case: The Correlated Oracle

  **Setup:** A variable $O$ perfectly predicts the future readouts of the channel (better than the system's own dynamics seem to allow) but has **no causal arrows** pointing from $O$ to the system or the channel. $O$ is a "common effect" of a hidden cause that also drives the system, or simply pre-established harmony.

  **Application of Principle:**
  *   **Ontic Condition:** Does $O$ evolve non-trivially? Yes. Is it required for the system's transition function? **No.** The system evolves perfectly well without $O$; $O$ is just a mirror.
  *   **Verdict:** $O$ is **Real** (it exists and evolves) but **Extrinsic** (it is not part of *this* system's ontology, it is part of the environment's ontology).
  *   **Why Diagnostic:** This tests whether you conflate "Predictive Power" with "Causal Role." Your fallback principle might accept $O$ because accessible variables "depend" on it (in a probabilistic sense). The Dynamical Autonomy principle rejects it as part of the *system's* ontology because it is not an input to the transition function. It forces you to decide: is the ontology the *generator* or the *predictor*? (I argue Generator).

  ### Summary of the Split
  Your grad student was half-right. Separating "Is there more?" (Ontic) from "Can we pin it down?" (Epistemic) saves Case 6 (Shadow Sector) and Case 10 (Safety). It does not save Case 8 (Washed-out); Case 8 must be discarded as "currently non-existent" to maintain consistency with Case 7. The variable in 7 is a locked room; the variable in 8 is a demolished room. Both are inaccessible, but only one is still there.
