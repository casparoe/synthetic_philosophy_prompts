answer: |-
  ### The Principle: Dynamical Autonomy

  Your grad student is right that you are conflating **Ontic Status** (does the variable exist in the generator?) with **Epistemic Status** (can we distinguish its state?). Your fallback principle fails because it demands epistemic leverage ("accessible variable depends on it") to grant ontic status. This forces you to call the Shadow Sector (Case 6) "unreal," contradicting your intuition, while leaving you unable to explain why Washed-out ICs (Case 8) feel different from Measurement Incompatibility (Case 7).

  Here is the repaired criterion. It separates the conditions for *being* from the conditions for *knowing*.

  **The Principle of Dynamical Autonomy**
  1.  **Ontic Condition (Reality):** A variable $V$ is part of the system's ontology at time $t$ if and only if the system's state-transition function requires a distinct dimension for $V$ at $t$ that evolves non-trivially (i.e., $V_{t+1}$ is not a constant function of $t$), regardless of whether $V$ couples to the channel.
  2.  **Epistemic Condition (Identifiability):** A variable $V$ is identifiable if and only if the channel's readout function is injective with respect to $V$ (i.e., distinct states of $V$ entail distinct channel histories under some intervention).

  **Why this repairs your fallback:**
  *   It allows for "Dark Variables" (Case 6): They evolve (Ontic = Yes) but don't map to readouts (Epistemic = No).
  *   It eliminates "Fossils" (Case 8): They do not evolve/affect the transition function at $t$ (Ontic = No).
  *   It clarifies "Gauges" (Case 3): They do not evolve by law, but by arbitrary choice (Ontic = No).

  ---

  ### Application to Your Cases

  **1. Isomorphism.**
  *   **Verdict:** Same ontology.
  *   **Principle:** Isomorphic models share the same dynamical structure. The dimensions exist, but the labeling is epistemic noise.
  *   **Status:** Ontic Yes, Epistemic N/A (Equivalent).

  **2. Deterministic Function.**
  *   **Verdict:** Not real.
  *   **Principle:** Fails Ontic Condition. $V$ adds no dimension to the transition function; it is reducible to other variables.
  *   **Status:** Ontic No.

  **3. Gauge/Undetermined.**
  *   **Verdict:** Not real.
  *   **Principle:** Fails Ontic Condition. $V_{t+1}$ is not determined by the dynamics; it is a coordinate artifact, not a system dimension.
  *   **Status:** Ontic No.

  **4. Microphysics (Gas).**
  *   **Verdict:** Real.
  *   **Principle:** Satisfies Ontic Condition. The particles evolve non-trivially. The fact that they are aggregated in the readout is an Epistemic limitation, not an Ontic one.
  *   **Status:** Ontic Yes, Epistemic No (for individual particles).

  **5. Bookkeeping (Conservation).**
  *   **Verdict:** Real.
  *   **Principle:** Satisfies Ontic Condition. The "carrier" is required for the transition function to conserve the quantity. It evolves (carries the remainder).
  *   **Status:** Ontic Yes, Epistemic No (never read directly).

  **6. Shadow Sector.**
  *   **Verdict:** Real, but Underdetermined.
  *   **Principle:** Satisfies Ontic Condition (you stipulated it is "dynamically active" and "not isomorphic" to the H-free model). It fails Epistemic Condition (influence cancelled).
  *   **Resolution:** Your grad student's distinction saves this. There *is* a fact of the matter (Ontic), but the channel cannot pin it down (Epistemic). Your fallback principle incorrectly killed this because it demanded accessible dependence.
  *   **Status:** Ontic Yes, Epistemic No.

  **7. Measurement Incompatibility.**
  *   **Verdict:** Real.
  *   **Principle:** Satisfies Ontic Condition (in input map). Fails Epistemic Condition (intervention destroys the register).
  *   **Resolution:** Distinguishable from Case 8 because here $H$ is *currently* active in the dynamics, whereas in 8 it is not.
  *   **Status:** Ontic Yes, Epistemic No.

  **8. Washed-out Initial Conditions.**
  *   **Verdict:** Not Real (at $t=1000$).
  *   **Principle:** Fails Ontic Condition. At step 1000, the variable is no longer an input to the transition function. It was real at $t=0$, but it is not a variable of the *current* system state.
  *   **Resolution:** This resolves your inconsistency with Case 7. In 7, the variable is currently doing work. In 8, it is a historical fossil.
  *   **Status:** Ontic No (now), Epistemic No.

  **9. Embedded Observer.**
  *   **Verdict:** Real.
  *   **Principle:** Satisfies Ontic Condition. The fact that *you* can't read it is irrelevant; the subsystem's dynamics depend on it. The "channel" for the subsystem includes $H$.
  *   **Status:** Ontic Yes, Epistemic Yes (for subsystem), Epistemic No (for you).

  **10. Safety Case.**
  *   **Verdict:** Real.
  *   **Principle:** Satisfies Ontic Condition ($H$ determines lethality, so it is in the transition function for the subject's survival).
  *   **Resolution:** Your reluctance to say "no fact of the matter" is correct. The stakes don't make it real; the causal role does. The stakes just make the Epistemic failure dangerous.
  *   **Status:** Ontic Yes, Epistemic No.

