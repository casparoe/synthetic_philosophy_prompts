answer: |-
  Here is a design for a 90-minute workshop called **"The Border Patrol."** It requires almost no theory upfront, uses cheap materials, and is designed to induce the specific anxiety of the Sorites paradox through social pressure and arbitrary rules.

  ### **Workshop Title:** The Border Patrol
  **Time:** 90 Minutes
  **Participants:** 9 (7 Writers, 1 Phil Grad Student, 1 You/Facilitator)
  **Goal:** To force participants to draw a sharp line on a vague spectrum, defend it, and then experience the collapse of that defense when the boundary itself is questioned.

  ---

  ### **1. Materials & Setup (10 Minutes)**
  **You need to prep this beforehand.**
  *   **The Deck:** 40 Index Cards.
      *   Use a gradient printer or paint them.
      *   Card 1: Pure Red.
      *   Card 40: Pure Orange.
      *   Cards 2–39: Subtle, imperceptible shifts in hue between each step.
      *   *Note:* Number them 1–40 on the back in small print (so you know the order, they don't).
  *   **The Tokens:** 50 poker chips, dried beans, or coins.
  *   **The Dividers:** 2 distinct objects (e.g., a red block and a blue block).
  *   **The Table:** Arrange chairs in a semi-circle. Place the deck face-up in a fan shape in the center.

  **The Roles:**
  *   **Facilitator (You):** Enforce rules. Do not explain *why*. Act like a bureaucratic border agent.
  *   **Scribe (The Phil Grad Student):** Their job is to write down the exact card numbers where the group places dividers. *Crucial:* Tell them privately beforehand: "Do not offer philosophical insights. Just record the numbers. If you speak out of turn, you lose a token."
  *   **The Patrol (The 7 Writers):** They make the decisions.

  **The Stakes:**
  *   Everyone starts with 3 Tokens.
  *   If you run out of tokens, you are "Deported" (you must stand behind the chairs and watch).
  *   Winner gets a cheap prize (a nice pen, a book of stamps).

  ---

  ### **2. The Game (60 Minutes)**

  **Introduction (5 Mins):**
  *   Do not mention "Sorites," "Vagueness," or "Philosophy."
  *   **Script:** "We are calibrating a border. We have a sequence of objects. Your job is to categorize them. The category is **'RED.'** You will make decisions as a group. If you hesitate too long, or if the group disagrees too loudly, tokens are deducted. We need a clear border."

  **Round 1: The Epistemic Cut (20 Mins)**
  *   **Task:** Place **Divider A** between two cards. Everything to the left is RED. Everything to the right is NOT RED.
  *   **Rule:** You must agree on a single gap.
  *   **Pressure:** If they argue, count to 10. If no decision, remove a token from the loudest person.
  *   **The Trap:** They will eventually pick a spot (e.g., between Card 18 and 19).
  *   **Facilitator Move:** Once placed, point to Card 18. "Are you sure?" Point to Card 19. "Are you sure?"
  *   **Outcome:** They will commit to a sharp cutoff. They are now **Epistemicists**. They have asserted there is a fact of the matter, even if it feels tight.

  **Round 2: The Fuzzy Zone (20 Mins)**
  *   **Task:** "The previous border was too brittle. We are introducing a buffer zone."
  *   **Action:** Place **Divider B** to the right of Divider A.
      *   Left of A: **DEFINITELY RED**
      *   Between A & B: **UNCERTAIN**
      *   Right of B: **DEFINITELY NOT RED**
  *   **Pressure:** Ask them to make the "Uncertain" zone small. "We can't have too much uncertainty. Efficiency matters."
  *   **The Trap:** They will create a safe zone (e.g., Cards 15–22).
  *   **Facilitator Move:** Point to Card 15 (the edge of the "Definitely" zone). "Is it *definitely* red? Or is it *definitely uncertain*?"
  *   **Outcome:** They will realize Card 15 is arguably part of the uncertain zone. They try to shift Divider A left. But then Card 14 becomes the new edge, and the problem repeats.

  **Round 3: The Second-Order Collapse (20 Mins)**
  *   **Task:** "Defend the edges of the Uncertain Zone."
  *   **Action:** You (Facilitator) pick up Card 15 (the boundary of 'Definitely Red'). Ask the group: "Is this card *Definitely* in the 'Definitely Red' zone?"
  *   **Rule:** They must answer Yes or No. No "It depends."
  *   **Pressure:** If they say "Yes," point out it looks like the Uncertain cards. If they say "No," move Divider A.
  *   **The Collapse:** They will realize that the boundary between "Definitely Red" and "Uncertain" is *itself* vague. They cannot draw a line around the fuzziness.
  *   **End Game:** Most will run out of tokens or refuse to play. Stop the game when the frustration peaks.

  ---

  ### **3. The Debrief (20 Minutes)**
  *Now* you name the beast. Sit down. No tokens left.

  **Mapping the Experience:**
  1.  **Round 1 (The Sharp Cut):** Ask them how it felt to pick Card 18 vs 19.
      *   *Concept:* **Epistemicism.** This is the view that there *is* a sharp cutoff (a truth), we just don't know it. In the game, you forced them to act *as if* there was a truth.
      *   *Novelist Angle:* "This is the border guard who says 'The line is here on the map, even if the river moved.'"
  2.  **Round 2 (The Buffer):** Ask them if the "Uncertain Zone" felt safer.
      *   *Concept:* **First-Order Vagueness.** Admitting that the predicate (Red) doesn't apply cleanly.
  3.  **Round 3 (The Collapse):** Ask about defending the edge of the Uncertain Zone.
      *   *Concept:* **Second-Order Vagueness.** This is the killer. It's not just that 'Red' is fuzzy; it's that 'The boundary of Red' is *also* fuzzy. You can't solve vagueness by drawing a box around the fuzz, because the box has fuzzy edges.
      *   *Novelist Angle:* "This is the lie people tell about borders. They say 'It's a disputed territory,' as if 'disputed' has a clear map. But the dispute itself has no border."

  **The "Grad Student" Release:**
  *   Now allow the grad student to speak. Ask them to name the paradox (Sorites/Heap). Ask them to briefly mention that philosophers have been stuck on this for 2,000 years. This validates the writers' frustration: *It's not you, it's the structure of language.*

  ---

  ### **4. Predictable Failures & Fixes**

  **Failure 1: The Relativist Revolt**
  *   *What happens:* A writer says, "Red is subjective. Card 18 is red to me, orange to her. There is no truth."
  *   *The Fix:* You (Facilitator) must be rigid. "The game requires a consensus ruling for the archive. Subjectivity costs a token." You must simulate a system that *demands* precision even when none exists. This creates the necessary friction.

  **Failure 2: The Grad Student Spoiler**
  *   *What happens:* They say "This is the Sorites Paradox" in minute 5.
  *   *The Fix:* The pre-game briefing is key. Give them a job that requires silence (Scribe). If they speak, they lose tokens like everyone else.

  **Failure 3: Boredom/Counting**
  *   *What happens:* Focusing on the numbers on the back.
  *   *The Fix:* Keep the numbers hidden until the Debrief. The visual gradient is what matters. The numbers are only for the Scribe to record the "crime scene."

  ---

  ### **5. Limitations: What This Game Can't Do**
  Be frank with them in the last 5 minutes.

  1.  **Forced March vs. Natural Speech:** The game forces a "Forced March" (you *must* decide). In real life, we rarely need to decide if Card 18 is Red. We only care about the clear Reds and clear Oranges. The paradox only hurts when the system *demands* a binary choice.
      *   *Takeaway:* "Borders hurt when the state demands a Yes/No on a Maybe reality."
  2.  **Perception vs. Concept:** This game uses color (perception). Some Sorites problems are purely conceptual (e.g., "When does a fetus become a person?"). Color is easier to agree on than morality, but the *structure* of the trap is the same.
  3.  **The Solution:** You haven't solved it. Neither has philosophy. The point of the workshop isn't to fix vagueness, but to recognize that **precision is often a performance of power, not a description of reality.**

  ### **Why This Works for Writers**
  Writers deal in nuance. They hate binary choices. This game weaponizes their strength (noticing nuance) against them by forcing them into a binary system. When they feel that anger—that "It's *not* that simple!"—that is the feeling of the paradox. That is the feeling of the border lying about itself.
