      *   *Stress Test 1 (The Readout):* Painless, reliable mind-reading. (f) drops out. Still feel Daughter = No, Bomber = Yes. Why?
      *   *Stress Test 2 (The Hundred-Case):* Frequent TBCs (30/year). Morality holds, Politics change.

  3.  **Initial Brainstorming & Tension Detection:**

      *   *Tension 1: Justification vs. Punishment (b + c).* If an act is *justified* (morally right/obligatory), why punish? Usually, justification is a defense against conviction. Excuse leads to conviction without blame (sometimes), but justification means "this was the right thing to do." Punishing someone for doing the *right* thing seems incoherent unless the law is radically separated from morality.
      *   *Tension 2: Institutional Rationale vs. Moral Distinction (d + e).* (d) says the wrong is about the *state-person relation*. (e) says torturing the daughter is worse than the bomber. If the wrong is institutional (state abusing power), why does the *identity of the victim* matter so much? The state is violating its relation with *both*. If it's about "attack on the person," why is the bomber's personhood less protected than the daughter's?
