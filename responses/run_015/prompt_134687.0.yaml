      *   *Severity 1: Justification vs. Conviction (b + c).* This is the big one. In political theory/law, if you justify an act, you typically acquit. If you convict, you typically say it was wrong (even if excused). User says: It's the *right* thing to do, but you go to jail. This is the "Ostrich" or "Machiavellian" paradox. It requires a very specific theory of legal authority that contradicts moral authority.
