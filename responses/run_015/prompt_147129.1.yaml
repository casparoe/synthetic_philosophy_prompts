  # Handout: Taxonomy of Responses to Death in Damascus
  **Graduate Reading Group: Decision Theory & Prediction**

  ## I. Background Stipulations
  *   **The Setup:** You are in Damascus. Death has predicted your location tomorrow. If Death finds you, you die (Utility: $-\infty$). If you survive, you gain life minus travel costs (Utility: $+100$). Travel costs are negligible.
  *   **The Predictor:** Death is not a pursuer; he is a predictor. He is already in Aleppo or Damascus based on his prediction.
  *   **The Variants:**
      1.  **Accuracy:** Prediction is 99% accurate vs. 70% accurate (with known bias toward predicting flight).
      2.  **Legibility:** Prediction is opaque vs. written on a card in a sealed envelope (reading it does not alter the card).
      3.  **Delegation:** You may pay to irrevocably delegate your choice to a randomizing device (Death's accuracy drops to 50% against the device).
      4.  **Memory:** After opening the envelope, you may pay for a drug to erase your memory of the card before choosing.

  ## II. The Logical Space (Separating Dimensions)
  Before assigning theory labels, we map the logical space of possible commitments. A position is defined by its answers to the following dimensions.

  1.  **Evidential Relevance:** Does the statistical correlation between your act and Death's location provide a reason for action, absent causal influence?
  2.  **Ratificatory Stability:** Must a rational act maximize expected utility *conditional on the fact that you are performing it*?
  3.  **Randomization Permission:** Is it rationally mandatory to surrender choice to a randomizer if it increases survival odds?
  4.  **Prediction Fragility:** Does the agent's knowledge of the prediction (e.g., reading the card) logically or causally falsify it?
  5.  **Information Valence:** Is it ever rational to pay to reduce one's own information (e.g., memory erasure) to improve outcomes?
  6.  **Accuracy Sensitivity:** Does a drop in predictor accuracy (99% $\to$ 70%) fundamentally change the rational strategy (e.g., from randomizing to outguessing)?
  7.  **Metaphysical Coherence:** Is the conjunction of "near-perfect external prediction" and "free agent deliberation" logically consistent?
  8.  **Unit of Agency:** Is the primary object of rational choice a specific *act* or a *disposition/function*?
  9.  **Normative Existence:** If no act meets the criteria for rationality, is "no act is permissible" a valid verdict?

  ## III. The Diagnostic Tree
  *Answer the following questions based on your intuitions about the variants above. Do not worry about which theory you are "supposed" to hold.*

  **Node 1 (Base Case: 99% Opaque):** In the standard case, does the fact that you *would* choose Aleppo count as evidence that Death is in Aleppo, independent of any causal influence you have on Death?
  *   **Yes** $\rightarrow$ Go to Node 2 (Evidential Path)
  *   **No** $\rightarrow$ Go to Node 5 (Causal/Structural Path)

  **Node 2 (Stability):** In the standard case, is an act rational only if, *assuming you do it*, it looks better than the alternative?
  *   **Yes** $\rightarrow$ Go to Node 3
  *   **No** $\rightarrow$ Go to Node 4

  **Node 3 (Solution Existence):** If no act satisfies the stability requirement (because choosing Aleppo makes Damascus better and vice versa), is the correct verdict that *no act is permissible*?
  *   **Yes** $\rightarrow$ **Leaf A: Ratificationist Nihilism**
  *   **No** $\rightarrow$ Go to Node 9 (Mixed Strategy)

  **Node 4 (Dispositional):** Should you view yourself as selecting a *disposition* to be predicted, rather than a specific *act* to perform?
  *   **Yes** $\rightarrow$ Go to Node 6
  *   **No** $\rightarrow$ **Leaf B: Evidential Decision Theory**

  **Node 5 (Delegation Variant):** If a device randomizes your choice and reduces Death's accuracy to 50%, is purchasing it rationally *required*?
  *   **Yes** $\rightarrow$ Go to Node 9 (Mixed Strategy)
  *   **No** $\rightarrow$ Go to Node 7 (Pure Act)

  **Node 6 (Memory Variant):** If you read the prediction (e.g., "Aleppo"), is it rational to pay for a drug to erase that memory before choosing?
  *   **Yes** $\rightarrow$ **Leaf C: Functional Decision Theory**
  *   **No** $\rightarrow$ **Leaf D: Dispositional Evidentialism**

  **Node 7 (Legibility Variant):** If the prediction is on a card in a sealed envelope, does reading the card render the prediction void?
  *   **Yes** $\rightarrow$ **Leaf E: Ill-Posed/Incoherence**
  *   **No** $\rightarrow$ Go to Node 8

  **Node 8 (Accuracy Variant):** If accuracy drops to 70% with a known bias toward predicting flight, do you abandon randomization to try to outguess the bias?
  *   **Yes** $\rightarrow$ **Leaf F: Strategic Exploitation**
  *   **No** $\rightarrow$ **Leaf G: Causal Decision Theory**

  **Node 9 (Mixed Strategy):** If stability fails or randomization helps, is the rational response to adopt a *mixed strategy* (randomize) rather than admit paralysis?
  *   **Yes** $\rightarrow$ **Leaf H: Ratificationist Mixed Strategy**
  *   **No** $\rightarrow$ **Leaf I: Diachronic Tragedy**

  ## IV. Map of Positions (The Leaves)
  *Each leaf represents a named response with its most awkward commitment.*

  *   **Leaf A: Ratificationist Nihilism**
      *   *Commitment:* In symmetric prediction cases, rationality demands the impossible, leaving the agent with no permissible moves.
  *   **Leaf B: Evidential Decision Theory (EDT)**
      *   *Commitment:* Agents cannot act to avoid bad news if the news is already correlated with the act, leading to instability in deliberation.
  *   **Leaf C: Functional Decision Theory (FDT)**
      *   *Commitment:* Dissolves the distinction between choosing an act and being a type of person, requiring memory erasure to maintain optimal dispositions.
  *   **Leaf D: Dispositional Evidentialism**
      *   *Commitment:* Treats dispositions as evidence but refuses to manipulate information access, creating tension between knowledge and optimization.
  *   **Leaf E: Ill-Posed/Incoherence**
      *   *Commitment:* Dismisses the thought experiment as metaphysically impossible rather than solving the decision problem.
  *   **Leaf F: Strategic Exploitation**
      *   *Commitment:* Suggests rational strategy flips discontinuously based on arbitrary accuracy thresholds (99% vs 70%).
  *   **Leaf G: Causal Decision Theory (CDT)**
      *   *Commitment:* Accepts that rational agents must walk into death rather than manipulate correlations they cannot causally influence.
  *   **Leaf H: Ratificationist Mixed Strategy**
      *   *Commitment:* Requires paying to surrender rational control to a coin flip to satisfy stability conditions.
  *   **Leaf I: Diachronic Tragedy**
      *   *Commitment:* Declares rationality structurally broken in high-stakes prediction scenarios, offering no rescue via randomization.

  ## V. Unoccupied Logical Space
  *Combinations of answers that yield no standard theory.*

  1.  **Evidence Yes + Stability No + Delegation No:** (Unstable EDT). You care about correlations but don't care if your choice makes the correlation fatal, and you won't randomize. *Diagnosis:* Merely unattractive; leads to guaranteed death in the 99% case.
  2.  **Evidence No + Stability Yes + Delegation No + No Act Permissible:** (Paralyzed CDT). You reject evidence, demand stability, but find no stable act and refuse to randomize. *Diagnosis:* Incoherent; if you reject evidence, standard acts are usually stable for CDT.
  3.  **Legibility Yes + Memory No:** (Fragile Realist). You think reading the card breaks the prediction, but you won't pay to forget it if it doesn't. *Diagnosis:* Unexplored; implies knowledge is dangerous only if it breaks the loop, not if it aids survival.

  ## VI. Meta-Analysis: Unseparated Pairs
  *Despite the tree's granularity, certain positions converge within the specific variants of Death in Damascus.*

  **1. Causal Decision Theory (Leaf G) vs. Functional Decision Theory (Leaf C)**
  *   **Convergence:** In the standard 99% opaque case, both may recommend the same act (or randomization) to ensure survival. The tree separates them via the "Memory Variant" (Node 6), but if the student answers "No" to memory erasure (believing information is always good), FDT collapses into CDT behaviorally here.
  *   **Prying Variant:** **Newcomb's Problem with Pre-commitment.** In Newcomb's, CDT two-boxes while FDT one-boxes. To separate them in Damascus, introduce a variant where you can *pre-commit* to a city before Death predicts. FDT one-boxes (commits to stay); CDT two-boxes (commits then defects).

  **2. Ratificationist Nihilism (Leaf A) vs. Ratificationist Mixed Strategy (Leaf H)**
  *   **Convergence:** At 99% accuracy, both agree that no *pure* act is ratifiable. The tree separates them at Node 9, but the intuition for "No" (Nihilism) and "Yes" (Mixed) is often a matter of degree regarding whether randomization counts as a "solution."
  *   **Prying Variant:** **Costly Randomization.** Increase the cost of the randomizing device significantly. The Mixed Strategist will pay up to the survival value; the Nihilist will refuse to pay *any* cost for a mechanism that surrenders agency, preferring the tragedy of no act.

  **3. Evidential Decision Theory (Leaf B) vs. Dispositional Evidentialism (Leaf D)**
  *   **Convergence:** Both accept evidential relevance. The tree separates them on the "Unit of Agency" (Node 4), but in a one-off case, choosing an act *is* choosing a disposition.
  *   **Prying Variant:** **Iterated Damascus.** Run the case 100 times. EDT might try to vary acts to confuse Death; Dispositional Evidentialism will lock into one disposition. Divergence appears in long-run survival rates.

  ***

  **Instructor Note:** Use this handout to diagnose where students' intuitions fracture. If the group splits at Node 3 (Solution Existence), you have a debate on Normative Existence. If they split at Node 6 (Memory), you have a debate on the Value of Information vs. Strategic Ignorance.
