      *   *Note:* Ensure the "dismantled rig" detail is used to kill the frequentist escape route, forcing the Propensity view to stand on single-case grounds.

  7.  **Final Polish:** Check the flow. Ensure the transition from qubit to coin to startup feels organic. (e.g., Sarah uses the coin to challenge the "fact of the matter," then the startup to challenge the "physical basis.")

  *(Self-Correction during final review)*: Make sure Paul doesn't concede too easily on the startup. He should argue that maybe startups *don't* have objective probabilities, which highlights the difference in their views on what probability *is*.

