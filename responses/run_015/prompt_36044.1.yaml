answer: |-
  **Setting:** *The Grind & Measure*, a coffee shop across the street from the Institute for Quantum Optics. It's late afternoon. **Sarah** (Subjectivist) and **Paul** (Propensity Theorist) are sitting at a small table, empty espresso cups between them. They're still wearing their lab badges.

  **Paul:** (Stirring sugar into a fresh mug) I'm telling you, that rig had a disposition. A real, physical disposition. Just because they're taking it apart tomorrow doesn't mean the probability wasn't fifty-fifty *today*.

  **Sarah:** The wavefunction was fifty-fifty, Paul. The *probability* is how much I should bet on the outcome given that wavefunction. There's a difference.

  **Paul:** That's semantic gymnastics. The apparatus was prepared in an equal superposition. The physical setup *was* such that it tended toward spin-up half the time. That tendency exists in the single case. It's as much a property of that qubit holder as its mass or its charge.

  **Sarah:** Mass you can measure on a scale. Charge you can measure with an electrometer. How do you measure a "single-case tendency" when the case happens once and then the machine goes into the shredder? You literally cannot distinguish a propensity of 0.5 from a propensity of 0.99 in a single trial. The outcome is just *click*.

  **Paul:** You're smuggling frequentism in the back door. You think I need a long run to validate the propensity. I don't. If I have a radioactive atom with a half-life of five minutes, and it decays in the first second, did it not have that half-life?

  **Sarah:** It had a decay constant. That's a parameter in an equation. But "probability" is the map, not the territory. The equation tells me how to update my credence. When you say the atom "had a half-life," you're describing a physical rate. When you say it "had a probability of 0.5," you're describing my rational expectation.

  **Paul:** So if I walk out of that lab and say, "I believe there's a 90% chance that was spin-up," and you say "50%," you're saying we're both rational?

  **Sarah:** I'm saying if you know the physics and you say 90%, you're irrational. The physics constrains the credence. The Principal Principle ties them together. But the number *in the world* is the amplitude. The number *in your head* is the probability.

  **Paul:** But why? Why posit this extra layer of "belief" if the physical setup is doing all the heavy lifting? Look, imagine a bent coin. We haven't tossed it yet. We don't know the bias.

  **Sarah:** Okay.

  **Paul:** Is there a fact of the matter about its probability of heads right now, sitting on the table?

  **Sarah:** There's a fact about its geometry and mass distribution.

  **Paul:** Which *constitutes* the propensity! The probability *is* that physical setup's disposition to produce heads. It might be 0.63. It's not 0.5 just because we're ignorant.

  **Sarah:** But if I have to bet on it right now, I'm betting at 0.5.

  **Paul:** That's your epistemic state. I'm talking about the ontic state. The coin doesn't care about your ignorance. It has a specific tendency. If you say the probability *is* 0.5, you're saying the coin is fair. It's not. It's bent.

  **Sarah:** I'm saying "probability" is the word we use for the betting quotient. If we can't access the bias, the "true propensity" is metaphysical decoration. It does no work.

  **Paul:** It does work! It explains *why* your frequencies converge if you *were* to toss it. It's the causal power.

  **Sarah:** Okay, let's push that causal power. What's the propensity of a specific startup succeeding? Say, that new quantum computing firm down the street.

  **Paul:** (Winces) Ah. That's different. That's not a physical setup.

  **Sarah:** Why not? It's a collection of physical objects and people.

  **Paul:** It's not a repeatable experimental arrangement. There's no stable mechanism.

  **Sarah:** Exactly. But investors assign probabilities. They bet. They hedge. If I say "probability" only applies when there's a physical propensity like your qubit or your bent coin, I can't talk about the startup. If I say probability is degree of belief, I can talk about both with the same math. Occam's razor, Paul.

  **Paul:** So you're willing to sacrifice objectivity for universality? You want to say the startup's success probability is *just* in the investor's head?

  **Sarah:** It's in the relationship between the investor and the evidence.

  **Paul:** But with the qubit! We *know* the physics there. We know the Hamiltonian. In that case, the 0.5 isn't just belief. It's derived from the symmetry of the physical law.

  **Sarah:** Derived from the law, yes. But the law gives you amplitudes. You need the Born Rule to get probabilities. And the Born Rule is a bridge law between the physics and the agent's expectations.

  **Paul:** Or it's a law about how propensities manifest. Look, here's my problem with your view. If it's all credence, what stops two people from looking at the same qubit setup and having different "truths"? If I say 0.5 and you say 0.5, we agree. But if I say 0.5 and you say "I don't know, I feel like 0.6," and you claim you're both right relative to your priors...

  **Sarah:** I don't claim that. If you know the preparation procedure, your prior *should* be 0.5. If it's not, you're wrong. Not "wrong about the world," but wrong about rational inference.

  **Paul:** So there is a correct number.

  **Sarah:** There's a correct number *given the information*.

  **Paul:** But the information is about the physical setup! The physical setup dictates the number. So the number is grounded in the setup, not the head. You're just refusing to call it a property of the setup.

  **Sarah:** Because properties of setups survive the absence of an observer. If everyone dies, the qubit rig still has mass. Does it still have "probability"?

  **Paul:** Yes! If the rig is set to superposition, it has the propensity to yield up, even if no one is there to bet on it.

  **Sarah:** Then prove it. Not with a long run, because we agreed there isn't one. Not with a single trial, because one bit of data doesn't confirm a propensity. How do you measure this thing?

  **Paul:** The same way we measure charge. We look at the theoretical role it plays in the model. We posit the propensity to explain the behavior of the system.

  **Sarah:** But you check charge with frequencies of deflection! You check propensity with frequencies of outcomes. You can't have it both ways. You want the propensity to be single-case and intrinsic, but the only evidence you ever accept for it is long-run frequency.

  **Paul:** The evidence is frequency, the *truthmaker* is propensity.

  **Sarah:** (Laughs) There's the metaphysics coming out. "Truthmaker." You love that stuff.

  **Paul:** And you love pretending the world doesn't have structure until an agent bets on it.

  **Sarah:** The world has structure. Causality. Dynamics. I'm not denying the Schrödinger equation. I'm denying that "probability" is a fluid leaking out of the qubit. It's a tool for navigating the uncertainty the equation describes.

  **Paul:** But uncertainty implies ignorance. In the qubit case, there is no ignorance. The state is pure. We know everything there is to know. And yet the outcome is indeterminate.

  **Sarah:** Nature is indeterminate. That doesn't mean "probability" is a physical thing. It means the future isn't fixed.

  **Paul:** And what grounds that indeterminacy? If it's not a propensity, what is it? Magic?

  **Sarah:** It's just... openness.

  **Paul:** (Sips coffee) Openness. That's very poetic, Sarah. But science likes quantities. And that quantity, 0.5, matches the physical symmetry. It feels like you're trying to have your cake and eat it too. You want to use the physics to fix the number, but deny the physics *is* the number.

  **Sarah:** I'm distinguishing the map from the territory. The territory has symmetries. The map has probabilities. You're painting the probability onto the territory.

  **Paul:** I'm saying the territory has a shape that makes the map work. If the coin wasn't bent, your 0.5 would be wrong in the long run. So the bend matters. The bend *is* the propensity.

  **Sarah:** The bend is the mass distribution. The propensity is the label we put on the mass distribution when we want to predict tosses.

  **Paul:** Labels don't cause frequencies.

  **Sarah:** Neither do propensities. Only the mass distribution does.

  **Paul:** (Grins) See? You just admitted the mass distribution does the work. So why not call the probabilistic aspect of that distribution a propensity? Why insist it's "in the head"?

  **Sarah:** Because "in the head" scales. I can apply my probability to the qubit, the bent coin, the startup, and whether it rains on my wedding day. You need a different ontology for every single one. For the qubit, it's a physical disposition. For the startup, what is it? A "social disposition"?

  **Paul:** Maybe the startup doesn't have an objective probability. Maybe you're right there, and that's just subjective uncertainty. But that doesn't mean the quantum case is subjective.

  **Sarah:** But we use the same Kolmogorov axioms for both. We add them, multiply them, condition them the same way. If one is a physical force and the other is a feeling, why does the math work identically?

  **Paul:** Because the logic of partial belief mirrors the logic of physical chance. That's the Principal Principle. They're distinct but coordinated.

  **Sarah:** Coordinated by what?

  **Paul:** By rationality.

  **Sarah:** (Leans back) So rationality forces my beliefs to match your physical propensities.

  **Paul:** Exactly.

  **Sarah:** Then for all practical purposes, the propensity is just the thing my belief is supposed to track. If I can never measure it without frequencies, and I'm rationally required to match my belief to it based on theory... isn't it simpler to just say the probability *is* the rational belief constrained by theory?

  **Paul:** No. Because if you're irrational, the probability doesn't change. If I panic and say the qubit has a 10% chance of spin-up, the qubit doesn't care. The propensity remains 50%.

  **Sarah:** The *physical setup* remains the same. I'm just saying "probability" is the name for the 50% judgment. You're saying "probability" is the name for the setup's feature.

  **Paul:** And the setup's feature explains why the judgment should be 50%.

  **Sarah:** The setup's feature explains why the *outcome frequencies* would be 50% *if* we ran it again. Since we aren't, the "feature" is doing no explanatory work other than propping up your realism.

  **Paul:** It explains the single case! It tells us why *this* outcome happened, even if it was chancy.

  **Sarah:** It tells us nothing about why *this* outcome happened. It only tells us about the setup.

  **Paul:** (Checks watch) They're going to lock the lab soon. They're dismantling the rig.

  **Sarah:** There goes your propensity.

  **Paul:** No. It existed. It was real. And now it's gone. Just like the experiment.

  **Sarah:** And my credence that it existed is... high.

  **Paul:** (Stands up, smiling) You're impossible.

  **Sarah:** And you're a closet frequentist with a thesaurus.

  **Paul:** Come on. I'll buy you another espresso. But I'm warning you, I'm assigning a high propensity to the barista getting our order wrong.

  **Sarah:** You mean you have a strong belief she will.

  **Paul:** I mean the espresso machine has a disposition to clog.

  **Sarah:** (Standing up) Fine. But if it doesn't clog, I'm not updating my priors.

  **Paul:** Then you're not rational.

  **Sarah:** Then I'm consistent.

  *(They walk out, arguing softly about whether the rain outside has an objective chance of stopping.)*
