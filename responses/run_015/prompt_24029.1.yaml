answer: |-
  Here are eight interview questions designed to press the specific vulnerabilities of the second-personal account of joint action, including the three required topics. Each includes the "standard dodge" she will likely attempt and the specific follow-up to close that escape route.

  ### 1. The Derivation Problem (Required Topic)
  **Question:** Critics argue that your account gets the metaphysical order backwards. They claim you can't derive the *shared goal* solely from a second-personal relation; rather, you need a shared goal first to ground the standing to make demands. If I demand you do your part, aren't I just bundling my intention that you do X with my intention that I do Y, rather than establishing a genuine *we*-goal? How do you get the "we" out of the "I demand of you" without already presupposing the "we"?

  *   **The Likely Dodge:** She will argue that the standing is *constitutive*, not derivative. She'll say the "we" emerges *in* the address itself, not prior to it.
  *   **The Follow-Up:** "If the 'we' emerges in the address, what makes that address a *joint* demand rather than two crossing individual demands? If I demand you lift your end, and you demand I lift mine, haven't we just described a coordination problem, not a joint action, until we already agree on the lift?"

  ### 2. The Quiet Quitter (Required Topic)
  **Question:** Let's look at a case of unilateral dissolution. Suppose we are carrying a sofa, and I quietly slip away mid-carry without saying a word. On a shared-intention view, I've broken the mesh of intentions. On your view, I've violated your standing to hold me to the task. But when exactly did that standing become active? If I didn't explicitly authorize your authority to demand my continued labor, in what sense did I violate a norm rather than just change my individual mind?

  *   **The Likely Dodge:** She will claim that entering the joint action *implicitly* grants the standing, so the violation is real even if silent.
  *   **The Follow-Up:** "But if the grant is implicit, what behavior counts as granting it? If simply lifting my end of the sofa grants you authority over my future movements, doesn't that make the 'standing' coercive? How do you distinguish between me joining a joint action and me merely being trapped in your normative web?"

  ### 3. Normative Authority Smuggling (Required Topic)
  **Question:** There is a worry that "standing to demand" quietly smuggles in a heavy normative authority that you haven't defended. To say I have the *standing* to demand you do something implies I have a right that you comply. But isn't that right just the *result* of a prior agreement or commitment? If so, aren't you explaining joint action by presupposing the very normative bond (the agreement) that needs explaining?

  *   **The Likely Dodge:** She will argue that second-personal authority is a primitive normative fact, not one that requires a prior contract to generate.
  *   **The Follow-Up:** "If it's a primitive fact, does that mean joint action is impossible for agents who don't grasp complex normative concepts? If a toddler and a parent build a block tower together, does the toddler really grasp they are violating a 'second-personal authority' when they knock it over, or is your account too intellectualized for basic joint action?"

  ### 4. The Content of the Demand
  **Question:** When I exercise this standing to hold you accountable, what is the specific content of my demand? Am I demanding that you fulfill *your* intention, or that you fulfill *our* intention? If it's the former, we are back to individual intentions. If it's the latter, how can I demand you fulfill an intention that, by your own account, only exists between us? Can I individually demand a collective state?

  *   **The Likely Dodge:** She will say you are demanding they do their part *in light of* the collective end.
  *   **The Follow-Up:** "But to identify 'their part,' don't you already need the 'collective end' defined independently of the demand? It seems the demand relies on the shared goal to make sense, which suggests the shared goal is the fundamental unit, not the demand."

  ### 5. Asymmetric Authority
  **Question:** In many joint actions, authority isn't equal. If a conductor and an orchestra act jointly, the conductor has standing to demand compliance, but the violinists don't have the same standing to demand the conductor conduct differently. Does your account collapse here? If joint action is defined by *mutual* standing to hold accountable, does a hierarchy mean it's not truly joint action?

  *   **The Likely Dodge:** She will argue that the standing is mutual but *differentiated* by role within the joint commitment.
  *   **The Follow-Up:** "If the standing is differentiated by role, isn't the 'jointness' actually grounded in the *role structure* (the script or score) rather than the second-personal relation? It sounds like the structure creates the standing, not the other way around."

  ### 6. The Phenomenology of "We"
  **Question:** When I act jointly with you, the phenomenology is often one of merged agency—I feel *we* are doing this. But the phenomenology of a second-personal address is one of separation: *I* am speaking to *you*. Does your account fracture the experience of joint action? By making it about accountability between distinct agents, do you lose the sense of unity that defines the phenomenon?

  *   **The Likely Dodge:** She will claim the phenomenology of unity is an illusion or a byproduct, and the normative reality is the separation.
  *   **The Follow-Up:** "If the sense of unity is an illusion, why is it so robust? If your theory tells us what joint action *is* but contradicts how it *feels* to the agents involved, aren't you describing a legal contract rather than a psychological action?"

  ### 7. Dissolution and Disagreement
  **Question:** Suppose we are painting a house together. I want to stop for lunch; you want to finish the wall. I demand we stop; you demand we continue. On your view, we both have standing. But if joint action is constituted by this standing, does the action cease to exist the moment our demands diverge? That makes joint action incredibly fragile compared to shared-intention accounts where we can disagree on means but share the goal.

  *   **The Likely Dodge:** She will say the joint action persists as long as the *commitment* to the framework persists, even if specific demands clash.
  *   **The Follow-Up:** "But if the commitment persists despite clashing demands, what is doing the work? Is it the commitment or the standing? If the standing leads to a standoff, isn't the 'jointness' actually being preserved by a background shared intention to resolve the conflict, which you're ignoring?"

  ### 8. Comparison with Joint Commitment (Gilbert)
  **Question:** Margaret Gilbert argues that joint action is founded on a "joint commitment." You argue it's founded on "second-personal standing." But isn't a joint commitment just the mechanism that *grants* the standing? If I commit to you, you get standing. If so, isn't the commitment the engine and the standing just the exhaust? Why prioritize the standing?

  *   **The Likely Dodge:** She will argue that commitment is a personal state, whereas standing is a relational status, and the relation is what matters.
  *   **The Follow-Up:** "But how do you get the relational status without the commitment? If I haven't committed to you, you have no standing. So doesn't the commitment logically precede the standing, making your account dependent on the very view you're trying to replace?"
