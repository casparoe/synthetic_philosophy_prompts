  It's settled that universalism and nihilism are internally coherent and logically valid options within classical mereology; what's genuinely contested is whether common-sense ontology tracks mind-independent reality or merely pragmatic linguistic conventions, and whether vagueness in composition is a feature of the world or our descriptions.

  **Pre-Answer Weakness Scan:** My reasoning is weakest on assuming "functional integration" is a unified concept across biology and robotics; I might be conflating causal interdependence with mereological unity. Also, assigning precise probabilities to metaphysical claims is pseudo-precision, though required here. I'm also leaning heavily on Lewisian naturalness without fully defending it against quinean alternatives.

  (a) 0.25 — Most serious metaphysicians prefer epistemic vagueness to avoid metaphysical indeterminacy, which hurts restrictivism via Sider's argument.
  (b) 0.40 — Temporary function feels sufficient for *some* objects, but without homeostasis it slides quickly into arbitrariness.
  (c) 0.55 — Organisms are the best restrictivist anchor, but explaining why "life" isn't just a disguised functional criterion is tough.
  (d) 0.50 — Lewisian naturalness constraints help, but the metric for "more natural" is itself contested and vague.

  **Combined:** Multiplying these factors loosely (since they're interdependent) keeps the total credence low-ish; if vagueness is epistemic (a) and function isn't sufficient (b), restrictivism collapses toward nihilism or universalism. The swarm case is the crux because it isolates function from biology, forcing you to admit either swarms are objects or organisms aren't special.

  **Least Sure:** Term (b) is the wobbliest hinge; if you can show temporary functional integration *without* life creates a sharp boundary, restrictivism survives, but if it's a spectrum, universalism wins. Shifting this requires a rigorous theory of "causal unity" that doesn't rely on biological vitalism.
