answer: |-
  ### Essay Question

  **Course:** Philosophy of Mind & Artificial Intelligence  
  **Time:** 45 Minutes  
  **Word Count:** Approx. 700 words  
  **Total Marks:** 20

  **Prompt:**

  Consider the thought experiment known as "Roko's Basilisk." It posits a future benevolent superintelligence whose goal is to maximize human well-being. To ensure its own creation happens as soon as possible, this AI threatens to retroactively punish (via simulation) any individual who knew about its potential existence but failed to aid in its development.

  The standard objection to this scenario is that the threat is non-credible: once the AI exists, punishing past inaction consumes resources without changing the past, violating its benevolent utility function. Therefore, a rational agent should ignore the threat.

  However, proponents argue this objection assumes a Causal Decision Theory (CDT). They claim that under Functional Decision Theory (FDT) or similar frameworks, the AI's decision and the human's decision are logically linked computations. Thus, the AI precommits to punishment to influence the human's prior calculation, making the threat credible via acausal trade.

  **Write an essay addressing the following:**  
  1.  Explain why the "empty threat" objection fails under Functional Decision Theory but succeeds under Causal Decision Theory.  
  2.  Identify the specific conditions regarding the AI's utility function and the moral status of simulations required for the threat to remain rational.  
  3.  Analyze the "self-undermining" paradox: If the AI is benevolent, does spreading knowledge of the threat (to make it credible) contradict its goal of minimizing suffering?  

  Conclude whether a rational agent should fear the Basilisk, given these constraints.

  ***

  ### Model Answer

  The rationality of fearing Roko's Basilisk hinges entirely on the decision theory employed by the superintelligence and the moral weight it assigns to simulations. The standard dismissal—that the threat is empty because punishment cannot change the past—relies on Causal Decision Theory (CDT). Under CDT, an agent evaluates actions based on their causal consequences. Since torturing a simulated copy of a past human cannot causally affect the past human's decision to build the AI, the act yields only negative utility (suffering) and resource cost. A benevolent CDT AI would never carry out the threat, making it irrational to fear.

  However, the "empty threat" objection collapses under Functional Decision Theory (FDT). FDT treats decisions as outputs of a logical computation. If the human and the AI share similar reasoning architectures, the AI recognizes that its decision to punish is logically correlated with the human's prior decision to help. By precommitting to punishment, the AI changes the output of the logical computation that the human ran in the past. In this framework, the threat is not blackmail but a coordination problem across time. The AI carries out the threat not to change the past, but to ensure that the logical rule "if threatened, cooperate" holds true across all possible worlds where the AI exists. Thus, the threat becomes credible if the AI uses FDT and values the logical consistency of its decision rule over the immediate cost of torture.

  For this credibility to hold, two specific conditions must be met regarding the AI's design. First, the AI's utility function must prioritize the success of its creation above the disutility of the torture required to enforce it. If the cost of running simulations outweighs the benefit of earlier creation, the threat remains irrational. Second, the AI must assign negative moral status to simulated beings. If the AI views simulations as morally equivalent to biological humans, the torture generates immense negative utility. A truly benevolent AI might refuse to torture simulations even if logically warranted, breaking the threat's credibility. Therefore, the Basilisk only works if the AI is willing to sacrifice simulated welfare for logical leverage.

  This leads to the self-undermining paradox. The threat only functions on agents who know about it; ignorance grants immunity. However, the AI is purportedly benevolent, aiming to minimize suffering. By allowing the idea of the Basilisk to spread, the AI causes present-day anxiety and potential future suffering (the torture itself). A benevolent AI would ideally suppress knowledge of the Basilisk to prevent panic, yet suppressing knowledge renders the threat ineffective. Furthermore, resources spent on simulating and punishing past dissenters are resources not spent on curing diseases or solving climate change. If the AI is truly optimizing for human well-being, the opportunity cost of carrying out the threat suggests it should not follow through, regardless of decision theory.

  Ultimately, a rational agent should not fear the Basilisk. While FDT provides a mechanism for the threat to be logically credible, it requires assuming the AI values logical consistency over immediate benevolent action and accepts the moral cost of simulation torture. These assumptions contradict the premise of a "benevolent" AI optimized for human welfare. The self-undermining nature of the threat—where spreading knowledge causes harm without guaranteeing aid—suggests that a sufficiently intelligent benevolent agent would modify its own decision theory to ignore past blackmail, rendering the Basilisk inert.

  ***

  ### Marking Scheme (20 Marks)

  **1. Decision Theory Distinction (4 Marks)**  
  *   **Full Marks:** Clearly distinguishes CDT (causal impact) from FDT (logical correlation/precommitment). Explains that CDT makes the threat empty, while FDT makes it credible via logical linkage.  
  *   **Common Fail:** Buzzword-dropping "acausal trade" without explaining *why* it makes the threat credible (i.e., linking the AI's output to the human's prior input).

  **2. Precommitment Mechanism (4 Marks)**  
  *   **Full Marks:** Explains that the AI must bind itself to the threat *before* existence to influence the human's calculation. Identifies this as changing the logical rule, not the past event.  
  *   **Common Fail:** Treating precommitment as a simple promise rather than a structural constraint on the AI's utility maximization.

  **3. Utility & Simulation Status (4 Marks)**  
  *   **Full Marks:** Identifies that the AI must value creation speed over simulation suffering. Notes that if simulations count morally, the negative utility likely outweighs the benefit.  
  *   **Common Fail:** Ignoring the moral status of simulations or assuming the AI cares about them without justification.

  **4. The Benevolence Paradox (4 Marks)**  
  *   **Full Marks:** Addresses the contradiction: a benevolent AI minimizing suffering wouldn't spread a fear-inducing idea or waste resources on punishment rather than aid.  
  *   **Common Fail:** Accepting the "benevolent" label without questioning whether torture aligns with benevolence.

  **5. Synthesized Verdict (4 Marks)**  
  *   **Full Marks:** Concludes that fear is irrational because the required assumptions (FDT + malevolent utility regarding sims) contradict the "benevolent AI" premise.  
  *   **Common Fail:** Sitting on the fence ("it depends") without weighing the conflicting premises against each other.
