answer: |-
  You should give up Premise (2).

  It is the weak link in the chain. While (1) defines the *nature* of the excuse and (3) establishes the *historical facts*, (2) creates a bridge between them that is far too sturdy. It treats moral knowledge like a radio broadcast: if the signal is transmitting, you are responsible for receiving it. But epistemic accessibility isn't binary; it's graded, contextual, and heavily dependent on social position.

  Here is why (2) looks fine until you press on it, why your proposed split is actually the solution rather than a dodge, and what you pay for making that change.

  ### Why Premise (2) Looks Plausible
  Premise (2) appeals to our desire for objectivity. We want a test for moral ignorance that doesn't rely on the agent's honest self-reporting. If we let people say, "I just didn't know slavery was wrong," without an external check, the defense becomes a get-out-of-jail-free card for bad faith.

  So, (2) offers a clean, external standard: *Was the dissent out there?* It shifts the burden from the agent's internal state to the historical record. It feels fair because it suggests that if the truth was spoken in your language, in your time, and in your vicinity, you had a duty to find it.

  ### Why It Breaks Under Pressure
  The problem is that "saying out loud" does not equal "reasonable accessibility." Premise (2) conflates the *existence* of a moral truth with the *uptake* of that truth.

  Consider the historical cases in (3). Yes, Bartolomé de las Casas argued against the mistreatment of Indigenous peoples while Columbus was alive. But was that argument *available* to a Spanish sailor in 1492 in a way that makes him blameworthy for ignoring it?
  *   **Credibility:** The sailor likely viewed Las Casas as a radical friar out of touch with reality or economic necessity.
  *   **Echo Chambers:** If the sailor's captain, king, and priest all endorsed the mission, one dissenting voice is easily dismissed as noise.
  *   **Conceptual Framework:** Even if the sailor heard the words, did he have the conceptual tools to process them without rejecting his entire worldview? Premise (1) says you aren't blameworthy if you can't get a grip on the wrongness using the concepts you *actually had*. Premise (2) overrides this by assuming hearing the words equals having the concepts.

  By keeping (2) as is, you assume that moral knowledge is purely a matter of information transfer. In reality, it requires social permission, cognitive bandwidth, and credible testimony.

  ### Your Proposed Fix: Available, Audible, Affordable
  You mentioned splitting (2) into three conditions: **Available** (the view exists), **Audible** (the agent could reasonably hear/credit it), and **Affordable** (acting on it wouldn't destroy the agent's life).

  This is not a dodge; it is a standard move in moral epistemology. It aligns the "man of his time" defense with how we handle excuses in law and everyday morality. We generally accept that "ought implies can." If acting on the moral truth requires social suicide, economic ruin, or physical danger, the *blameworthiness* is mitigated, even if the act remains wrong.

  *   **Audible** fixes the "Echo Chamber" problem. It asks: Was this voice credible within the agent's social context, or was it easily dismissible propaganda?
  *   **Affordable** fixes the "Martyrdom" problem. It acknowledges that while a saint might act on the dissent, we don't blame ordinary people for failing to be saints.

  ### The Cost of Giving Up (2)
  If you replace the binary test of (2) with your nuanced three-part test, you pay a price:

  1.  **Loss of Clarity:** The clean test of "Did someone say it?" is replaced by a messy inquiry into social pressure, credibility, and economic cost. It becomes harder to adjudicate historical blame from a distance.
  2.  **Risk of Over-Excusing:** By introducing "Affordable," you risk letting powerful people off the hook. Jefferson could have freed his slaves; it would have been financially painful, but not life-destroying. A poor sailor might have faced mutiny for dissenting. Your new test must distinguish between *inconvenience* and *undue hardship*, which is a slippery slope.
  3.  **Subjectivity:** You move from an objective historical fact (someone wrote a pamphlet) to a counterfactual psychological assessment (could this specific person have reasonably believed that pamphlet?).

  ### Conclusion
  Keep (1) and (3). They are the strongest parts of your argument. (1) correctly identifies the defense as epistemic, and (3) correctly identifies that dissent existed.

  Scrap the binary version of (2). Replace it with your refined version. The "man of his time" defense isn't worthless, but it is much narrower than people think. It doesn't excuse anyone who *could* have known better; it only excuses those for whom knowing better was genuinely beyond their epistemic and practical reach.

  By making this change, you save the defense from being useless, but you admit that for figures like Jefferson or Churchill, the bar for that excuse was likely still not met. They had the access, the credibility, and the means. The defense survives, but it won't save the giants of history.
