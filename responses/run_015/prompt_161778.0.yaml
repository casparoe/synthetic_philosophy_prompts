  8.  **Final Polish:** Ensure the tone is academic but strategic. The user wants to *defend* a view, so the prep sheet needs to be battle-ready. Make sure the "Expressive Surplus" terminology is consistently applied. (Self-Correction: Ensure I don't sound *too* defensive in the replies. They need to be confident pivots.)

      *Check:* Did I capture the "Justice Upshot"? The Economist will attack this hardest. I need to make sure the reply connects "meaning" to "justice" without relying on "harm."
      *Check:* Did I capture the "Measurement" issue? The Sociologists need to hear that I know my variables are noisy, but that noise isn't fatal.

      *Let's finalize the ordering.*
      1. Quant Soc (Measurement validity - kills the empirical basis).
      2. Labour Econ (Welfare - kills the normative basis).
      3. Evol Psych (Theoretical redundancy - kills the novelty).
      4. Feminist Phil (Structural power - kills the agency framing).
      5. Science Studies (Coding ontology - kills the mechanism).
      6. Quant Soc 2 (Endogeneity/Reverse causality).
      7. Feminist Phil 2 (Paternalism/Manipulation).
      8. Secret (Longitudinal validity).

