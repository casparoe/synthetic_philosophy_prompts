answer: |-
  This is a precise and philosophically rich observation. You have identified a specific ontological structure of human identity that sits at the intersection of philosophy of mind, social ontology, and ethics.

  The configuration you describe does not have a single, universally agreed-upon label, but it is the central subject of several major philosophical frameworks. The most accurate "carving" of this concept comes from **Ian Hacking's "Looping Effects,"** refined by **Charles Taylor's "Self-Interpreting Animals,"** and phenomenologically described by **Merleau-Ponty's "Sedimentation."**

  Here is an analysis of the established concepts, how they fit your description, where they diverge, and how to handle the edge cases you raised.

  ### 1. The Primary Concept: Interactive Kinds and Looping Effects
  The philosopher of science Ian Hacking provides the most robust technical framework for this. He distinguishes between **indifferent kinds** (e.g., quarks, trees) and **interactive kinds** (e.g., refugees, diabetics, "math persons").

  *   **The Mechanism:** When you classify an indifferent kind, the classification does not change the thing classified. When you classify an interactive kind (a human being), the classification interacts with the person classified. They become aware of the classification, and this awareness changes their behavior, which in turn changes the classification criteria.
  *   **Fit to your case:** Your examples are perfect instances of **looping effects**. The friend avows "I am not a math person." This classification alters her relationship to mathematics (avoidance, anxiety), which reinforces the incapacity, which validates the classification.
  *   **Why it fits better than "Self-Fulfilling Prophecy":** A self-fulfilling prophecy is usually causal and temporal (I believe X will happen -> I act -> X happens). Hacking's looping effect is **constitutive**. The avowal doesn't just cause a future outcome; it alters the *ontology* of the subject in the present. The "fact" cited is not a pre-existing bedrock; it is a moving target that moves *with* the description.

  ### 2. The Phenomenological Concept: Sedimentation vs. Bad Faith
  You ask whether your intuition about Sartre is correct: that this is not *bad faith* because there is no lie.

  *   **Sartre's View:** For Sartre, claiming "I *am* a coward" (being) rather than "I *act* cowardly" (doing) is bad faith. It treats a free project as a fixed fact (facticity). Sartre would argue your friend *is* in bad faith, not because she is lying about her current incapacity, but because she is treating a **process** as a **substance**. She is ignoring her transcendence (ability to change) in favor of her facticity (current state).
  *   **Merleau-Ponty's Correction:** Maurice Merleau-Ponty offers a better fit for your intuition that "there is no lie." He uses the concept of **sedimentation**. Through repeated acts (avoiding math, staying calm), a habit forms a "layer" over our freedom. Eventually, this layer becomes so thick it feels like nature.
  *   **The Distinction:** In bad faith, I *pretend* I cannot choose. In sedimentation, I *have chosen* so many times in the past that choosing otherwise now requires a disproportionate existential effort. The "truth" of the avowal is real, but it is a **sedimented truth**, not a **natural truth**.
  *   **Verdict:** Your sense is correct. It is not the *deceptive* bad faith of lying to oneself; it is the **ontological reification** of a habit. It is a "truth made," not a "truth found."

  ### 3. The Social Concept: Performativity
  For your second example ("the calm one" in the family), Judith Butler's concept of **performativity** is the sharpest tool.

  *   **The Mechanism:** Identity is not an inner core that expresses itself outwardly; it is a "stylized repetition of acts." The family member acts calmly; the family recognizes this; the member acts calmly again to maintain recognition.
  *   **The Trap:** The avowal ("I am the calm one") is the script. To deviate is not just to act differently; it is to risk the collapse of the social recognition that sustains the self.
  *   **Difference from your carving:** Butler emphasizes the *coercive* nature of social norms. Your description allows for the possibility that the person "takes up" the role willingly. Butler would argue the "willingness" is itself shaped by the available social scripts.

  ### 4. Edge Cases and Boundaries

  You asked how the concept shifts under different conditions. Here is how the "Looping/Sedimentation" model handles them:

  **A. When the trait has a firm organic basis (e.g., Dyscalculia)**
  *   **Shift:** The loop is **constrained**, not created.
  *   **Analysis:** If the friend has genuine dyscalculia, the "incapacity" is not *produced* by the avowal, but the *identity* ("I am not a math person") is. The avowal transforms a specific cognitive deficit into a global existential boundary.
  *   **The Danger:** The avowal prevents compensation. A person who says "I have a math deficit" might use a calculator. A person who says "I am not a math person" avoids the situation entirely. The organic fact is real; the *totalizing* avowal is the loop.

  **B. When the avowal is socially enforced (The Family Role)**
  *   **Shift:** From Self-Interpretation to **Interpellation**.
  *   **Analysis:** This moves from Taylor's "self-interpreting animal" to Althusser's "interpellation." The family "hails" the member ("You are the calm one"). If they resist, the social system punishes them (conflict, confusion).
  *   **The Difference:** In the voluntary case, the cost of deviation is internal (cognitive dissonance). In the enforced case, the cost is external (social rupture). The "truth" of the trait is maintained by the ecosystem, not just the individual.

  **C. When the person avows it unwillingly ("I am an addict")**
  *   **Shift:** From Constitutive to **Strategic Essentialism**.
  *   **Analysis:** Sometimes, adopting a fixed label is a survival strategy. An alcoholic saying "I am an addict" (a fixed state) may be necessary to maintain sobriety, even if philosophically it denies their freedom to change.
  *   **The Nuance:** Here, the reification is a **tool**. It is a "prophylactic fiction." It uses the looping effect defensively. The person knows it is a posture, but adopts it as a fact to prevent the loop from spinning the other way.

  ### 5. The Internal Test: Distinguishing Fixed vs. Sustained

  You asked: *Is there any way to distinguish, from the inside, a trait genuinely sustained by its own avowal from one that is fixed and merely avowed?*

  This is the crux of the matter. Since both feel like "facts," how do we tell the difference?

  **The Test of Plasticity (The Counterfactual Strain):**
  Do not test the trait itself; test the **cost of deviation**.
  *   **Fixed/Organic:** If you attempt to deviate, you encounter **friction**. (e.g., Trying to run with a broken leg hurts).
  *   **Sustained by Avowal:** If you attempt to deviate, you encounter **vertigo** or **incoherence**. (e.g., Trying to be angry when you are "the calm one" feels like losing your name).

  **The Diagnostic Question:**
  Ask: *"If I stopped telling myself this story, would the behavior persist?"*
  *   If the answer is "Yes, I still can't do the math," it is likely organic/skill-based.
  *   If the answer is "I don't know who I would be," it is constitutive/looping.

  **The "Until Further Notice" Clause:**
  A trait that is merely avowed (fixed) can withstand a temporary suspension of the label. A trait sustained by the avowal collapses if the label is suspended.
  *   *Experiment:* The "math person" tries to say, "I am a person who is currently struggling with math, but that is not what I am." If the anxiety vanishes but the skill remains low, it was a loop. If the anxiety remains high, there is a deeper block.

  ### Summary and Proposed Terminology

  There is no single word, but the most precise philosophical description is **Constitutive Self-Interpretation via Looping Effects.**

  If you need a label for your writing or thinking, consider:
  1.  **Ontological Feedback:** Highlights the causal loop between being and saying.
  2.  **Sedimented Identity:** Highlights the historical accumulation of acts that now look like nature (Merleau-Ponty).
  3.  **Performative Facticity:** Highlights that the "fact" is produced by the performance of the label.

  **Is your carving correct?**
  Yes. You have correctly identified that this is distinct from lying (Bad Faith) and distinct from simple prediction (Prophecy). It is a specific mode of human existence where **description is a form of construction.**

  The absence of a lie does not exonerate the configuration. It merely means the prison is built of true bricks. The friend is not lying about her incapacity; she is **colluding with her own limitation** by treating a historical summary as a natural law. The "truth" of the statement is the very mechanism of the trap.
