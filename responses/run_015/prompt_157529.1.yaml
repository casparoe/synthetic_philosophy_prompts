  Residents may undertake noisy activities during Quiet Hours subject to the following compliance measures:

  1.  **Notice:** A Conscience-Notice Form (CNF-4) must be filed with the Building Management 48 hours prior to the activity. Late filings are void.
  2.  **Content:** The CNF-4 must specify the duration, decibel estimate, and the moral imperative necessitating the exception. Vague imperatives are rejected.
  3.  **Publication:** Approved CNF-4s shall be posted in the stairwell for the duration of the activity to inform affected parties.
  4.  **Indexing:** All filed CNF-4s shall be indexed annually by category. This Index is deemed to form part of the House Rules.
  5.  **Validity:** Failure to file renders the activity a violation. Filing guarantees no objection from neighbors regarding the noise itself, though neighbors retain the right to object to the sufficiency of the moral imperative via the Grievance Committee.
  6.  **Review:** The Index shall be reviewed biannually to update precedent.

