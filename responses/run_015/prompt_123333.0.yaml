      *   *Conflict B:* Point 1 (Khaldun works) vs. Point 2 (No lessons). If the mechanism is real, there *should* be some lessons (e.g., "don't let your guard down on the periphery"). The user needs to clarify *why* the lessons don't transfer. (Likely because modern context changes the variables).
      *   *Conflict C:* Point 3 (Ratchet) vs. Point 1 (Cycles). Does the economic ratchet prevent political cycles? (e.g., WWI/WWII were collapses in cohesion despite growth). The two-series move handles this, but needs to acknowledge that economic growth doesn't *stop* political collapse, just changes the stakes.
