          4.  Spengler (organic lifespans) and Polybius (regime cycle) are dead/wrong.
          5.  Toynbee (challenge-response) is unfalsifiable.
          *   **Synthesis:** The "two-series move" (political cohesion cycles on top of productive ratchet).
