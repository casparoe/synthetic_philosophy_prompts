      *   *Point 1 (Khaldunian cycles)* vs. *Point 2 (No lessons)*: If cycles exist (Point 1), why are there no lessons (Point 2)? The user argues cases don't repeat "in the respects that matter." This is a nuance worth probing. If the mechanism is real (Khaldun), why can't we learn from it?
      *   *Point 4 (Spengler/Polybius dead)* vs. *Point 1 (Khaldun alive)*: Why is Khaldun okay but Polybius dead? Both describe cycles. Khaldun focuses on *asabiyyah* (social cohesion), Polybius on *constitutional forms*. The user distinguishes them by mechanism vs. classification. This seems defensible but needs tightening.
      *   *Point 5 (Toynbee unfalsifiable)*: This is a standard Popperian critique. It stands alone well.
      *   *The Statistical Problem (Tax Receipts)*: This undermines Point 1 and Point 3. If we can't statistically distinguish cycle from trend + noise, how do we claim Khaldun is "genuinely explanatory" or Post-1800 is a "ratchet"?

