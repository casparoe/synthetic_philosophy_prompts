answer: |-
  **Elena:** Let's go back to the aerosol variable. You're saying that because no human hand reached in and deleted it *yesterday*, the exclusion isn't a cause of the flooding projections being off by forty percent.

  **Marcus:** I'm saying that "exclusion" is a description of what *didn't* happen. In a Humean framework, causation is about the succession of events, positive occurrences. The pipeline executed. The feature-selection heuristic ran a variance check. It found the aerosol data low-variance relative to its training domain—remember, it was ported from hydrology—and it discarded the column. That *discarding* is an event. The *absence* of the data in the downstream model is a state, not an event. You can't say the nothingness pushed the water levels up.

  **Elena:** But that's the trap of looking for a "push." In an interventionist account, we aren't looking for a billiard ball hitting another. We're asking: if we were to intervene and change this factor, would the outcome change? If we intervene to force the aerosol variable into the pipeline, the catastrophic error vanishes. The dependency is robust. The system is structured such that the *absence* of that input is doing the work. It's not just "nothing"; it's a structured nothing. It's a gap engineered into the infrastructure.

  **Marcus:** A gap is still a gap. You're conflating causal explanation with causal ontology. Sure, citing the omission explains *why* the model failed to a human audience. It satisfies our epistemic need for a contrast class: "It failed because it lacked X." But metaphysically, the cause is the positive act of the heuristic executing the drop. The code *did* something. It actively filtered. To say the *omission* caused the harm is to treat the shadow as the cause of the darkness, rather than the object blocking the light. In automated systems, this is even clearer. There's no agent "neglecting" a duty. There's just logic gates.

  **Elena:** That's where the "institutional omission" concept matters. You're treating the pipeline as a one-off event, but it's a socio-technical lock-in. The heuristic wasn't just running; it was carrying a design commitment from a previous domain. That commitment—the decision to prioritize low-variance features without contextual validation—persisted over time. The omission isn't a momentary lack; it's a sustained constraint. When responsibility is distributed across time and code, the "positive act" of the initial deployment fades, but the *structural absence* remains active. It's continuously preventing the data from entering. That continuous prevention is causally potent.

  **Marcus:** "Continuously preventing" sounds like a positive process. If you want to locate the cause there, fine: the cause is the *filtering mechanism*, not the *filtered variable*. The active component is the heuristic. The aerosol data is just... elsewhere. If I build a dam and the valley floods because water can't escape, did the *absence* of a drain cause the flood? Or did the *presence* of the dam? In your climate pipeline, the heuristic is the dam. Blaming the omission of the variable is like blaming the absence of a drain. It misidentifies the productive mechanism.

  **Elena:** But in complex systems, the "dam" analogy breaks down because the system is supposed to be permeable. The pipeline's *function* is to ingest relevant climate forcings. By defining its function, we establish a norm. When the architecture systematically violates that norm via a silent drop, the violation *is* the causal path. Think about it counterfactually: In a world where the heuristic is transparent, the variable is kept. In the actual world, it's dropped. The difference maker is the drop. But since the drop is defined by what *isn't* passed through, the causation is inherently negative. If we deny omission causality here, we lose the ability to critique the architecture. We can only critique the code that exists, not the data that was structurally barred from existing in the model.

  **Marcus:** You're sliding into ethics. You want to hold the architects responsible, so you need the omission to be a cause. I get that. But don't dress moral accountability as metaphysical causation. If we say the omission caused the harm, we imply that every possible variable not included is a potential cause of whatever happens. Why isn't the absence of a volcanic eruption variable also a cause? Or the absence of a solar flare variable? If omissions are causes, the causal field explodes. We need a principle of relevance. Usually, that principle is an agent's duty to act. But you said it yourself: no agent was present to fail. So what grounds the relevance of the aerosol variable specifically?

  **Elena:** The ground is the system's teleology, not an individual's duty. The pipeline is designed for climate adaptation. Its goal is accurate projection. The aerosol variable is scientifically recognized as critical for that goal. The relevance isn't grounded in a gardener's promise to water plants; it's grounded in the physical requirements of the domain the system claims to model. The "duty" is embedded in the spec. When the heuristic silently drops the variable, it violates the system's own operational constraints. That violation is a structural fault. In distributed systems, structural faults are causal agents. They channel the flow of information. By channeling information *away* from the aerosol data, the structure determines the output.

  **Marcus:** "Channeling" is a positive description. You're describing the flow of bits. The bits corresponding to the aerosol data were routed to `/dev/null`. That routing is a positive event. I'm willing to grant that the *routing decision* is a cause. But you want to say the *aerosol data's absence* is the cause. That reverses the polarity. It makes the effect dependent on a non-entity. In a regularist view, we look for constant conjunction. Do we see a constant conjunction between "aerosol absence" and "flooding error"? Only if we define "aerosol absence" as "heuristic filtering active." But then we're back to the heuristic being the cause. Why insist on the omission?

  **Elena:** Because the heuristic isn't the problem in isolation. The heuristic is fine for hydrology. It becomes causal *only* when coupled with the absence of the aerosol data in this specific context. It's the interaction between the rule and the missing content. If we treat the omission as causally inert, we imply the system would have performed the same regardless of what was dropped. But it wouldn't. The specific *content* of the omission matters. The harm is specific to the aerosol forcing. If the heuristic had dropped temperature data instead, the error profile would be different. So the *identity* of the missing thing is causally relevant. You can't capture that relevance just by pointing at the heuristic. You have to acknowledge the specific absence.

  **Marcus:** The identity matters because the heuristic's operation is sensitive to the data's properties. It dropped it *because* it looked like low-variance noise. So the cause is the interaction between the data's statistical signature and the heuristic's threshold. That's all positive facts. Data properties + Code Threshold = Drop. You don't need to reify the "absence" to explain why *this* variable was dropped and not *that* one. The data was present initially; it was actively rejected. That rejection is the cause. Calling it "omission causation" adds a layer of negative ontology that doesn't do any work. It just signals that we're unhappy the variable wasn't used.

  **Elena:** It signals more than unhappiness. It signals that in socio-technical systems, the *default state* is often exclusion. Infrastructure is defined by what it leaves out. If we can't treat those exclusions as causes, we can't model the risk of automation. We end up saying, "The code ran correctly," which it did, "So no cause for the error," which is absurd. The error arose from the *silence* of the variable. Interventionism allows us to say that manipulating the silence—breaking the omission—fixes the outcome. That makes the silence a causal handle. If we can grab it and change the world, it's a cause.

  **Marcus:** We aren't grabbing the silence, Elena. We're inserting a signal. We're adding a positive input. We're overriding the heuristic. That's a positive intervention on a positive mechanism. You're describing a repair, not tracing a cause. The cause of the crash was the wall. The repair is removing the wall. You don't say the "absence of a hole" caused the crash. You say the "presence of a wall" did. In your pipeline, the "wall" is the feature-selection threshold. Let's call it what it is. Don't let the "omission" label obscure where the leverage actually is. If we focus on the omission, we look for missing people or missing data. If we focus on the mechanism, we look for active code that needs patching.

  **Elena:** But the "missing data" *is* the leverage point in the design phase. When we audit the system, we ask, "What isn't here?" If we say omissions aren't causes, the audit stops at "What is here?" And what is here is a functioning pipeline. The danger of this framework is that it renders invisible the systemic blind spots. In a distributed system, the "active code" is often just enforcing a legacy absence. The causal power lies in the persistence of that exclusion over years. It's an inertial cause.

  **Marcus:** Inertia is a property of mass, of something existing. Persistence of a rule is a positive fact about memory storage and execution cycles. I agree the *persistence* is the problem. But persistence of what? Of the *rule to exclude*. Not the *exclusion* itself. The distinction matters for liability and repair. If the cause is the omission, everyone who *could have* added the variable is a cause. If the cause is the rule, only those who wrote or maintained the rule are causes. In automated contexts, diffusing causation to "what wasn't included" dilutes responsibility to the point of vanishing.

  **Elena:** Or it correctly identifies that responsibility is diffuse. That's my point. The harm wasn't caused by a villain; it was caused by a structure that allowed a critical silence to persist. If we insist on Humean positive acts, we force a square peg into a round hole. We end up hunting for a specific engineer who "failed to update" the heuristic. But maybe no one failed. Maybe the system just drifted. The structural omission account captures the drift. The Humean account demands a spark.

  **Marcus:** And without a spark, there's no fire. If the system drifted, then the *drifting*—the accumulation of unvalidated assumptions—is the positive process. I'm not denying the harm. I'm denying that "nothing" can be the engine. The engine is the code running, the data decaying, the context shifting. Those are all somethings. Call it "institutional omission" if you want for the sociologists, but don't ask me to sign off on it as metaphysics. It's a shorthand for a complex web of positive dependencies.

  **Elena:** Then we agree on the web, just not the label. But I'll keep the label. Because in the courtroom, and in the design review, "the code filtered a critical variable" sounds like a feature. "The system omitted a critical variable" sounds like a bug. Sometimes the metaphysics has to serve the repair.

  **Marcus:** And sometimes the metaphysics has to protect the truth. If we call every unchosen path a cause of the chosen one, causation loses its bite. But I concede this: in automated infrastructure, the "positive act" is often the maintenance of a constraint. If you define the constraint as the cause, I can live with that. Just don't tell me the constraint is an absence. It's a very present barrier.

  **Elena:** A barrier defined by what it keeps out. We'll have to let the variable speak for itself.

  **Marcus:** As long as we don't expect the silence to testify.
