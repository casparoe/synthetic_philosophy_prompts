  | 2 | Systematic Survey | Confirms noticeably more | Confirms noticeably more | Yes | Higher sampling fraction increases severity (error detection prob). |
  | 3 | Biased Friend | Nothing / Negative | Nothing / Negative | Yes | Procedure guarantees outcome regardless of H truth (zero severity). |
