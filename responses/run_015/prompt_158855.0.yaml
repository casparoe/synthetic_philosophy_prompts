  | 9 | 10 Non-Black Objects | Decent confirmation | Decent confirmation | Yes | High sampling fraction of the relevant population (non-black things). |
  | 10 | Sealed Aviary (All) | Totally confirmed | Totally confirmed | Yes | Exhaustive test of the defined domain. |
