answer: |-
  In a drought-stricken county, a shared aquifer is managed by an open-source smart-metering system that displays real-time extraction rates on a public dashboard. The geological threshold for permanent saline intrusion is exactly 1,000 gallons per minute; above this rate, the freshwater lens collapses. It is 2:00 PM, peak heat, and the dashboard shows 1,000 active agricultural pumps already drawing exactly 1,000 gallons per minute. You are a farmer with a valid permit for a 1-gallon-per-minute pump. You know, with public certainty, that the 1,000 other pumps are automated to run until 3:00 PM and will not stop; you also know your pump draws from the same immediate pressure zone, meaning your gallon is physically part of the flow that exceeds the threshold, not a downstream effect. There is no communication between farmers, no cooperative agreement, and no institution assigning roles; you are acting independently to save a trivial crop value. Your connection is encrypted; no one sees your specific activation, it leaves no public trace distinguishable from background noise, and this is a one-off decision that will not habituate you to future recklessness. If you pump, the total is 1,001; if you refrain, the total is 1,000. In both cases, the threshold is crossed, and the aquifer collapses.

  **Check:**
  *   **Harm:** Permanent saline intrusion (aquifer collapse).
  *   **Operative Quantity:** Water extraction rate (gallons per minute).
  *   **Agent's Act:** Activating the 1-gallon pump.
  *   **Counterfactual:** If the agent refrains, 1,000 gallons are still extracted, the threshold (1,000) is still met, and the collapse still occurs.
  *   **(a) Difference-Making:** Since the harm occurs in both the act and no-act worlds, the expected difference is zero. On this view, she has no reason to refrain.
  *   **(b) Complicity:** There is no joint intention, shared plan, or cooperative scheme. The farmers are strangers acting on parallel market incentives. On a strict joint-action view, she is not complicit.
  *   **(c) Causal Contribution:** Her water is physically part of the mass that breaches the geological limit. She is an *INUS* condition (an Insufficient but Non-redundant part of an Unnecessary but Sufficient set). On a view that privileges physical causation over counterfactuals, she has a reason to refrain.

  **Verdict:**
  My honest verdict is that (c) does not survive once the four moves are rigorously switched off. The intuition that she has a reason to refrain in this scenario likely smuggles in the **Expected-Difference** move. In any truly realistic present-day case, the agent cannot have *certainty* that exactly 1,000 others are pumping; there is always epistemic slack (meter lag, malfunction, unauthorized users). The moral force of "don't add to the harm" relies on the probability that she *might* be pivotal. If we enforce the constraint of *metaphysical or epistemic certainty* that she is not pivotal, the "causal contribution" becomes a mere physical description without normative bite. The advisor is correct: without the possibility of making a difference, joining a scheme, signaling, or shaping character, "causal contribution" is morally inert.

  **Isolating the Feature:**
  The feature doing the work is the **physical integration** of her water into the harming flow. The minimal change to convert her into someone causally inert is this: Her pump draws from the same aquifer but feeds into a **separate, parallel pipe** that merges with the main outflow *after* the geological pressure point where the collapse is triggered. Her water still depletes the aquifer (eventually), but it is not part of the specific *surge* that causes the collapse.

  A difference-making theorist would argue this change is **morally irrelevant**. In both the original and modified cases, the outcome (collapse) is identical, and her contribution to the *outcome* is zero. If "causal contribution" grounded a moral reason, the location of the pipe merge should matter; but since the harm is the collapse, and the collapse happens regardless, the physical path of the water is irrelevant. This confirms that contribution without difference-making was never the sort of relation that could ground a reason; the reason was always parasitic on the (hidden) possibility of affecting the outcome.

  **Conclusion on Constraints:**
  If one insists that a *realistic* case must include *realistic epistemology*, then no case satisfies all constraints at once, because "certainty of non-pivotality" is unavailable in uncoordinated collective action. This failure validates the advisor's claim: the literature's "inefficacy" cases only generate moral tension because we implicitly assume uncertainty (Expected-Difference). Once certainty is granted, the tension vanishes, revealing that "causal contribution" was never an independent moral category.
