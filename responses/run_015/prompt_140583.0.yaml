answer: |-
  Here is a 90-minute session plan designed for your specific crowd. It prioritizes arithmetic over metaphysics and uses a single, boring example to prevent the "cosmology drift" you're worried about.

  ### 1. The Arc (Order of Operations)

  **00:00 – 00:20: The Hook (The Staffing Agency)**
  *   **Goal:** Establish the divergence *before* defining the theory.
  *   **Action:** Put the "Staffing Agency" example (detailed below) on the board. Ask them to take a bet.
  *   **Why first:** If you start with "I am this person," you lose the programmers to semantics and the biologists to evolution. If you start with a bet, everyone understands stakes. You need them to feel the tension between "It feels like the big world is more likely" vs. "That feels like cheating."

  **00:20 – 00:35: The Mechanism (SSA vs. SIA)**
  *   **Goal:** Formalize the intuition from the bet.
  *   **Action:** Define SSA and SIA using the numbers from the Agency.
  *   **Crucial Move:** Explicitly state that they agree on *priors* (50/50) but disagree on *likelihoods* (the probability of the evidence given the hypothesis). This corrects the common misconception that this is just an argument about priors.

  **00:35 – 00:50: The Escalation (The Presumptuous Philosopher)**
  *   **Goal:** Show the stakes.
  *   **Action:** Scale the Agency up to the Universe.
  *   **Why here:** Now that they accept the math works, show them the absurd conclusion. SIA implies we can determine the size of the universe without looking out the window.

  **00:50 – 01:10: The Pushback (Marek & Reference Class)**
  *   **Goal:** Handle objections.
  *   **Action:** Run Marek's objection through the Agency arithmetic. Then address Reference Class widening.
  *   **Why here:** If you do this earlier, you kill the tension. If you do it later, you run out of time. This is the "debate" phase.

  **01:10 – 01:30: The Check (The Telescope Test)**
  *   **Goal:** Verify understanding.
  *   **Action:** A specific puzzle (detailed below) that separates rote memorization from grasp.
  *   **Why last:** It consolidates the lesson.

  ---

  ### 2. The Carrying Example: The Staffing Agency

  You need an example that isolates **Observer Count** from **Selection Process**.

  **The Setup:**
  *   **Hypothesis S (Small):** A temp agency hires **10** people for a project.
  *   **Hypothesis L (Large):** The same agency hires **1,000** people for a project.
  *   **Prior:** You have no idea which project it is. 50/50 credence.
  *   **The Evidence:** You check your email. It says: *"Congratulations, you have been hired."*
  *   **The Bet:** I offer you even money that Hypothesis L is true. Do you take it?

  **What this example MUST have:**
  1.  **Fixed Priors:** Make it explicit that before the email, S and L were equally likely.
  2.  **Uniform Selection:** Every hired person gets the *same* email. No special IDs yet.
  3.  **Existence as Evidence:** The mere fact of receiving the email is the data point.

  **What this example MUST lack:**
  1.  **No "Copies":** Do not talk about clones or duplicates. Talk about "slots" or "roles." This avoids sci-fi distractions.
  2.  **No Time/Amnesia:** Do not make it about waking up on different days (Sleeping Beauty). Keep it synchronous.
  3.  **No Specificity (Initially):** Do not say "You are Employee #7" until the Marek objection phase. Start with just "You are hired."

  **The Arithmetic (for the whiteboard):**
  *   **SIA Calculation:**
      *   If L is true, there are 1,000 "slots" for you to occupy.
      *   If S is true, there are 10 "slots" for you to occupy.
      *   Likelihood Ratio: 1,000 : 10.
      *   **Result:** L is 100x more likely. Take the bet.
  *   **SSA Calculation:**
      *   If L is true, you are a random sample from 1,000 actual employees. Prob(You are hired | L) = 1 (assuming you exist). *Wait, this is the trap.*
      *   *Correction for SSA:* SSA treats "I am this specific observer" as a random sample from *actual* observers.
      *   Better phrasing for SSA on the board: "Given L, there are 1,000 people. The chance that *I* am the specific one observing this is 1/1,000. Given S, it is 1/10."
      *   **Result:** S is 100x more likely. Reject the bet.

  ---

  ### 3. Handling Marek's Objection

  **The Objection:** Marek will say: "Once I conditionalize on *everything* I know (my name, my DNA, my history), the volume boost cancels out. The probability of *me specifically* existing is tiny in L and tiny in S, and they cancel."

  **Where it fits:** In the **Pushback (00:50)** phase. Do not let him interrupt the initial bet.

  **Is he right?**
  Technically, **no**, not in the standard SIA framework. But it's a subtle "no."
  *   If your specific identity (DNA, etc.) is *fixed* across both hypotheses (i.e., "Dave" exists in S and "Dave" exists in L), then existence is 100% in both, and SIA loses its bite (this is Full Non-indexical Conditioning).
  *   However, SIA proponents argue that in a larger world, there are more *opportunities* for a person with your exact qualia to arise.

  **The Minimal Case to Settle It (The "Name Tag" Variant):**
  Modify the Staffing Agency on the board.
  *   **Hypothesis S:** 10 people hired. Name tags numbered 1 to 10.
  *   **Hypothesis L:** 1,000 people hired. Name tags numbered 1 to 1,000.
  *   **Evidence:** You look at your chest. You are wearing **Name Tag #7**.
  *   **Marek's Claim:** "Since #7 exists in both worlds, the volume cancels."
  *   **The Refutation (on the board):**
      *   **SSA:** In S, there are 10 people. Chance of being #7 is 1/10. In L, there are 1,000 people. Chance of being #7 is 1/1,000. **SSA still favors S.**
      *   **SIA:** In S, there are 10 slots for a person to be. In L, there are 1,000 slots. Even if #7 is in both, the *probability of there being a slot for me to occupy* is higher in L. **SIA still favors L.**
      *   **The Verdict:** Marek is confusing "Probability I am #7" with "Probability #7 exists."
      *   *Caveat:* Tell the room: "Marek is right *only if* you assume your specific existence is guaranteed in both worlds independent of the world size. But if world size determines how many 'tries' nature gets to make you, SIA stands."

  ---

  ### 4. Reference Class & Sleeping Beauty

  **Reference Class Widening:**
  *   **The Move:** Someone will say, "SSA just needs to widen its reference class to 'possible observers' and then it matches SIA."
  *   **Your Line:** "That is correct. That is why SSA is considered unstable. If you widen the reference class enough, SSA *becomes* SIA. If you keep it narrow, you get the Doomsday Argument. The problem isn't the math; it's choosing the class."
  *   **Status:** Present this as a **feature of the machinery**, not a devastating objection. It shows the two assumptions are points on a spectrum, not binary opposites.

  **Sleeping Beauty:**
  *   **Your Line:** "Sleeping Beauty is about **time** (how many awakenings). This is about **number** (how many observers). They share math, but they are different axes. If we mix them, we will confuse self-locating belief with existence evidence."
  *   **Decision:** **Bracket it.** Say: "If you know Sleeping Beauty, map 'awakenings' to 'observers.' If you don't, don't worry about it. It's a different problem."

  ---

  ### 5. The Final Check (Last 10 Minutes)

  Do not ask them to recite definitions. Give them a scenario where the answer reveals if they understand the *consequence* of the assumption.

  **The Telescope Test:**
  *   **Setup:**
      *   Theory A: The universe contains 1 billion galaxies.
      *   Theory B: The universe contains 1 trillion galaxies.
      *   Priors: Equal.
      *   Evidence: You look out the window. You see *a* galaxy.
  *   **Question 1:** "If you are an SIA proponent, do you need a telescope to confirm Theory B?"
      *   *Correct Answer:* **No.** SIA says Theory B is already 1,000x more likely just because you exist. A telescope is a waste of money.
  *   **Question 2:** "Why is this called the 'Presumptuous Philosopher'?"
      *   *Correct Answer:* Because it claims you can do astrophysics from the armchair.
  *   **Question 3:** "If you are an SSA proponent, what does the telescope do?"
      *   *Correct Answer:* It's essential. SSA says the theories are equal (or S is favored) based on existence alone. You need empirical data to break the tie.

  **Differentiation:**
  *   **The "Got It" Crowd:** Will laugh at the idea that SIA makes telescopes obsolete. They understand the *presumption*.
  *   **The "Repeaters":** Will just say "SIA says big worlds are likely." They miss the epistemic scandal (that observation is unnecessary).

  ---

  ### 6. What to Explicitly Refuse

  You have 90 minutes. You must draw boundaries on the whiteboard at the start.

  1.  **Infinite Universes:** "If the universe is infinite, both S and L have infinite observers. The math breaks. We are assuming finite worlds tonight." (This stops the "but what if infinity" derailment).
  2.  **The Nature of Consciousness:** "We are counting 'observers' or 'slots.' I don't care if they are conscious, biological, or rocks. It's about information locations." (Stops the biologists/philosophers debating qualia).
  3.  **Solving the Reference Class:** "We will not solve the Reference Class problem tonight. We will only see how breaking it changes the answer." (Manages expectations).

  ### Summary of Dependencies

  1.  **Bet first:** You cannot explain *why* "I exist" is evidence until they care about the *result* of that evidence.
  2.  **Marek second:** You cannot refute the "cancellation" argument until the "volume boost" is established.
  3.  **Presumptuous Philosopher third:** You cannot show the absurdity until the math is accepted.
  4.  **Sleeping Beauty never:** It is a distraction from the core "Size vs. Existence" tension.

  **Whiteboard Layout Plan:**
  *   **Left Column:** The Staffing Agency (S vs L, 10 vs 1000). Keep this up the whole time.
  *   **Center:** The Math (Likelihood Ratios). Update this as you move from "Hired" to "Name Tag #7".
  *   **Right Column:** The Consequences (Telescopes, Doomsday, Presumptuousness).

  Good luck. Keep the arithmetic simple, and don't let them talk about infinity.
