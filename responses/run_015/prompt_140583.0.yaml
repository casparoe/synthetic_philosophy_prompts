prompt: |-
  Hey — I'm filling in for a friend who normally runs a monthly "hard problems" night in the back room of a pub, and I've got ninety minutes and a whiteboard next Tuesday on the self-sampling vs self-indication business, i.e. the presumptuous philosopher case. The room will be maybe fifteen people: a handful of programmers, a couple of biologists, my neighbour who just turns up for everything, no philosophy training, and nobody will have read anything beforehand. About four of them have definately absorbed half of this from blog posts over the years, so I expect Sleeping Beauty, the doomsday argument and "but what if the universe is infinite" to all get thrown in within the first ten minutes.

  What I want isn't the explanation — I think I more or less have that — it's a plan for the session, and mostly for the order things have to come in and why. My instinct is that the thing that has to land first, before any cosmology-flavoured stuff, is that there's a piece of evidence here at all: that "I find myself being this person, here, now" is itself something with a probability conditional on a hypothesis, and that the two assumptions disagree about that probability rather than about the priors over how big the world is. Is that the right thing to front-load, and what has to be in place before that even looks like a move someone could deny? If I've got the dependency structure backwards, say so.

  Three more things. First, I want one example to carry the whole session and I want it to be boring: no deity flipping coins, no galaxy-scale headcounts, ideally something small enough to do the arithmetic on the board and something you could actually imagine placing a bet on. What does that example need to have, and — this is the part I keep getting wrong — what does it need to lack? Every time I try to design one it turns back into a cosmology thing. Second, there's a guy, Marek, who will at some point say that the whole self-indication boost cancels out as soon as you conditionalize on everything you actually know about yourself, so self-indication never does any work and the presumptuous philosopher is a fake problem. I genuinely can't tell whether that's right. Where does that belong in the sequence — before or after I've run the presumptuous philosopher case — and what's the smallest case that settles whether it cancels, so I can have it in my pocket? Third, someone will notice that you can get self-indication-ish behaviour out of self-sampling just by widening the reference class of people you might have been, and I don't know whether to present that as a devastating objection or as a feature of how the machinery works. Also: where do I let Sleeping Beauty in, and where do I have to say out loud that it's a different axis?

  So: give me the arc, what's first and what depends on what; the three or four misconceptions you'd bet on this particular crowd forming and the exact point in the sequence where I head each one off; a carrying example plus the constraints on it; and a check I can run in the last ten minutes that seperates people who've got it from people who can only repeat "self-indication says big worlds are more likely". And tell me what I should openly refuse to get into at this level — including whether the reference class problem is one of the things I should explicitly decline to resolve. Not asking for readings, the group won't do any.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Context:** Filling in for a friend at a pub "hard problems" night. 90 minutes. Whiteboard. ~15 people (mix of programmers, biologists, layperson neighbor, some blog-literate). No prep reading.
      *   **Topic:** Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA), specifically the Presumptuous Philosopher case.
      *   **Goal:** A session plan (arc/order), not an explanation of the concepts themselves (user knows them).
      *   **Specific Constraints/Questions:**
          1.  Is front-loading "I am this person" as evidence correct? What needs to be in place before that?
          2.  Need *one* boring, bettable, small-scale carrying example (no gods/coins/cosmos). What must it have/lack?
          3.  Handle "Marek's Objection" (SIA cancels out upon conditionalization). Where does it fit? Is it right? What's the minimal case to settle it?
          4.  Handle Reference Class widening (SSA mimicking SIA). Is it an objection or feature?
          5.  Where does Sleeping Beauty fit? (Same axis or different?)
          6.  Misconceptions to head off.
          7.  Final check/test for understanding.
          8.  What to explicitly refuse to discuss (e.g., Reference Class resolution).

  2.  **Deconstruct the Core Philosophical Tension:**
      *   SSA (Self-Sampling): "I am a random sample from the set of actual observers." (Favors smaller worlds if you are early/specific).
      *   SIA (Self-Indication): "I am a random sample from the set of *possible* observers." (Favors larger worlds because there are more slots for me to be in).
      *   Presumptuous Philosopher: SIA says a theory predicting $10^{100}$ observers is vastly more likely than one predicting $10^{10}$, *just* because you exist. SSA says they are equal (or favors the smaller one if you consider your specific index).
      *   The crux: Is existence evidence?

  3.  **Address the User's Instinct (Front-loading "I am this person"):**
      *   *User's Instinct:* Start with "I find myself being this person... is evidence."
      *   *Critique:* This is too abstract for a pub crowd. If you start with indexical evidence, they'll get lost in metaphysics before they care about the bet.
      *   *Better Approach:* Start with the *consequence* (the bet). Show the divergence first, then explain *why* (the evidence).
      *   *Correction:* You need to establish the *setup* (two hypotheses about world size) before you establish the *evidence* (my existence).
      *   *Dependency:* You need a scenario where Hypothesis A and Hypothesis B predict different numbers of people *like you*.

  4.  **Design the Carrying Example (Constraint 2):**
      *   *Requirements:* Boring, small scale, bettable, arithmetic on board, no cosmology/coins/gods.
      *   *Problem:* Most anthropic examples *require* copies or observers. If you remove cosmology, you usually end up with Sleeping Beauty (coins) or Simulation (gods).
      *   *Solution:* The "Office Building" or "Conference Room" scenario.
      *   *Draft:* Two possible buildings. Building A has 10 rooms, 1 person each. Building B has 1000 rooms, 1 person each. You wake up in a room. Which building is it?
      *   *Refinement for "Boring/Bettable":* A raffle or a staffing schedule.
      *   *Best Fit:* **The Staffing Agency.**
          *   Hypothesis S (Small): Agency hires 10 people for a project.
          *   Hypothesis L (Large): Agency hires 10,000 people for a project.
          *   You got the email: "You are hired."
          *   Prior: 50/50 on S vs L.
          *   Question: What are the odds now?
      *   *What it needs:* Distinct hypotheses about *total count*, equal priors, and the fact of "being hired" as the observation.
      *   *What it must lack:* It must lack *indexical specificity* initially (don't say "I am John Smith"). It must lack *temporal ambiguity* (don't make it about days like Sleeping Beauty). It must avoid "copies" (clones) which triggers sci-fi alarms. Use "roles" or "slots".
      *   *Why this works:* It isolates the "existence as evidence" vs. "selection effect" without needing universes.

  5.  **Address Marek's Objection (Constraint 3):**
      *   *Objection:* SIA cancels out when you conditionalize on specific data (e.g., "I am Marek, born in 1980...").
      *   *Verdict:* Marek is technically wrong in the standard formulation, but right in a specific "Full Non-indexical Conditioning" (FNC) sense which effectively becomes SIA. However, for the Presumptuous Philosopher, the objection is that specific data swamps the volume boost.
      *   *Placement:* *After* the Presumptuous Philosopher case is established. If you do it before, you kill the tension.
      *   *Minimal Case:* The Staffing Agency again.
          *   S: 10 people hired. Names 1-10.
          *   L: 10,000 people hired. Names 1-10,000.
          *   You are Name #7.
          *   SIA says L is 1000x more likely.
          *   Marek says: "But the probability of *me specifically* being #7 is 1/10 in S and 1/10,000 in L."
          *   Wait, that *supports* SIA.
          *   Marek's actual point usually relies on: "The probability of *someone* having my exact qualia/data."
          *   *Correction:* Marek's argument is usually that $P(E|L) \times P(L) = P(E|S) \times P(S)$ because the likelihood of *this specific* observer existing scales down with the population in a way that cancels the volume.
          *   *Actually:* In SIA, $P(Exists|L) = 1$ (if L is true, observers exist). In SSA, $P(I am me|L) = 1/N_L$.
          *   *The Kill Shot:* If the hypotheses differ *only* in the number of observers, and you condition on "I exist," SIA boosts L. If you condition on "I am [Specific Person]," and [Specific Person] exists in *both*, the boost cancels *only if* the specific person was guaranteed to exist in both.
          *   *Decision:* Place this in the "Objections" phase (last 30 mins). The minimal case is: **The Identical Twin Scenario.**
          *   Hypothesis A: 1 twin born. Hypothesis B: 1 million twins born. You are a twin.
          *   If you condition on "I am this specific twin with this DNA," does B still win? Yes, because there are more slots for *that* DNA to arise in B (assuming random generation) OR if the DNA is fixed, it cancels.
          *   *Simpler:* Stick to the Staffing Agency. If the list of names is fixed beforehand (1-10 vs 1-10,000) and you are #7. #7 exists in both.
          *   SIA: L is 1000x likely.
          *   SSA: S is 1000x likely (you are a random sample from the actuals).
          *   Marek: "But I know I'm #7."
          *   Resolution: This is the *crux* of SSA vs SIA. SSA uses the indexical info to penalize L. SIA uses existence to boost L. Marek is arguing for a third thing (FNC) or misunderstanding SIA.
          *   *Strategy:* Don't solve Marek. Use him to show the *stakes*. If Marek is right, Presumptuous Philosopher is dead. If Marek is wrong, PP stands. Put this *after* PP is explained.

  6.  **Address Reference Class & Sleeping Beauty (Constraint 4 & 5):**
      *   *Reference Class:* If SSA widens the class to "possible observers," it becomes SIA. This is a feature, not a bug, but it shows SSA is unstable. Present it as "The SSA Escape Hatch."
      *   *Sleeping Beauty:* It's a *different axis* (self-locating belief vs. existence evidence). Do not mix them early. Use SB only if time permits or as a "homework" analogy. Better to exclude it to save time, or mention it only as "You might have heard of Sleeping Beauty; that's about time, this is about *number*."
      *   *Decision:* Explicitly bracket Sleeping Beauty. It confuses the "number of observers" issue with "number of awakenings."

  7.  **Session Arc (90 Minutes):**
      *   **0-15: The Hook (The Bet).** No theory yet. Just the Staffing Agency. Get them to bet. Show the split.
      *   **15-30: The Mechanism.** Define SSA and SIA using the bet. Explain *why* they disagree (Existence vs. Sampling).
      *   **30-45: The Presumptuous Philosopher.** Scale up the Staffing Agency to the Universe. Show the absurdity (SIA says physics is easy to solve).
      *   **45-60: Objections (Marek & Reference Class).** Handle Marek here. Handle Reference Class widening.
      *   **60-75: Implications & Doomsday.** Briefly touch on Doomsday (SSA result) vs. SIA rebuttal.
      *   **75-90: The Check.** A specific puzzle to test understanding.

  8.  **Misconceptions to Head Off:**
      *   "It's just priors." (No, it's likelihoods).
      *   "It's about consciousness." (No, it's about counting slots).
      *   "Infinite universes break it." (Bracket this).
      *   "Sleeping Beauty is the same." (Distinguish early).

  9.  **Refining the "Check" (Constraint 7):**
      *   Need a scenario where SSA and SIA give *different* answers, but it's not just "Big World Good."
      *   *Idea:* The "Two-Child Problem" variant.
      *   *Better:* A modified Staffing Agency where the "You" is not guaranteed to exist in the Small case.
      *   *Best:* **The Lottery Ticket.**
          *   World S: 1 ticket sold.
          *   World L: 1 million tickets sold.
          *   You hold a winning ticket.
          *   Wait, that's just Bayesian.
          *   *Try:* **The Color of the Shirt.**
          *   World S: 10 people, all wear Red.
          *   World L: 10,000 people, 1 wears Red, 9,999 wear Blue.
          *   You look down: You wear Red.
          *   SSA: Favors S (You are a random sample from S, 100% Red. From L, 0.01% Red).
          *   SIA: Favors L (There are more observers, but the likelihood of being Red is low).
          *   Actually, this is standard Bayesian.
          *   *Need:* Pure Anthropics.
          *   *The Check:* **The "You Might Not Have Been" Case.**
          *   Hypothesis A: 1 person created.
          *   Hypothesis B: 1 million people created.
          *   Priors: Equal.
          *   Observation: "I exist."
          *   Q1: What does SIA say? (B is 1M times more likely).
          *   Q2: What does SSA say? (Equal, or depends on reference class).
          *   Q3: If I add "And my name is Dave," and "Dave" is in both lists, does it change?
          *   *Refinement:* Let's use the **"Two Rooms"** test.
          *   Room A: 1 person. Room B: 100 people.
          *   God flips coin to pick Room.
          *   You wake up in a room.
          *   SIA: You are likely in B.
          *   SSA: You are likely in B (because more people are in B).
          *   *Wait, SSA and SIA agree on the "Self-Indication" part of Sleeping Beauty but disagree on the "Presumptuous" part.*
          *   *Correction:* SSA and SIA agree on "I am in the big room" if the *process* puts you there. They disagree if the *hypothesis* determines the *number* of rooms.
          *   *The Real Test:* **The Physics Test.**
          *   Theory 1: Universe has 1 galaxy.
          *   Theory 2: Universe has 1 billion galaxies.
          *   Evidence: "I observe a galaxy."
          *   SIA: Theory 2 is 1 billion times more likely.
          *   SSA: Theory 1 and 2 are equal (assuming I'm a random observer in the actual universe).
          *   *Task for audience:* Why is SIA's answer "presumptuous"? (Because it claims we can do physics without looking outside).

  10. **Refining the "Marek" Objection:**
      *   Marek is channeling the "Full Non-indexical Conditioning" (FNC) argument or the "Specific Evidence" objection.
      *   If I condition on *everything* (my DNA, memories, etc.), the probability of *me* existing in World L is $N_L \times p$ (where $p$ is prob of specific me arising). In World S, it's $N_S \times p$.
      *   Ratio: $(N_L \times p) / (N_S \times p) = N_L / N_S$.
      *   So the $p$ cancels, but the $N$ remains. SIA *survives* specific conditioning.
      *   Marek is wrong *unless* he assumes $p$ scales inversely with $N$ (which implies a fixed pool of "souls" or something).
      *   *Verdict:* Marek is wrong in the standard SIA framework. I need to show *why* he's wrong using the arithmetic.
      *   *Placement:* After the main case. Use the Staffing Agency numbers.

  11. **Drafting the Plan:**
      *   *Tone:* Pub-friendly, whiteboard-heavy, arithmetic-focused.
      *   *Structure:*
          1.  **The Bet (0-20):** Staffing Agency. Get the intuition.
          2.  **The Definitions (20-35):** SSA vs SIA formalized on the Agency.
          3.  **The Presumptuous Philosopher (35-50):** Scale to Cosmology. Show the absurdity.
          4.  **The Objections (50-70):** Marek (Specific Evidence), Reference Class, Sleeping Beauty (bracketed).
          5.  **The Check (70-90):** The "Physics without Telescopes" puzzle.

  12. **Review against Constraints:**
      *   *Front-loading evidence:* No, start with the bet. Evidence comes second.
      *   *Example:* Staffing Agency (boring, bettable).
      *   *Marek:* Address in Objections. Show mathematically why specific evidence doesn't cancel the volume factor (unless reference class is fixed).
      *   *Reference Class:* Present as "The SSA Escape Hatch" (unstable).
      *   *Sleeping Beauty:* Explicitly bracket.
      *   *Refuse:* Infinite universes, nature of consciousness, solving the Reference Class problem.

  13. **Final Polish:** Ensure the distinction between "I exist" (SIA) and "I am this specific person" (SSA/SIA overlap) is clear. Ensure the "Presumptuous" element (doing physics from the armchair) is highlighted.

