answer: |-
  Here is a reconstruction of the theory of meaning your industry habits presuppose, an analysis of their consistency, and the implications for your contracts and heirs.

  ### The Implicit Theory: The Author as Source vs. The Author as Witness

  The practices you describe do not form a single, coherent theory of meaning. Instead, they operate on a **split theory of authority**. The institutions treat you as two different kinds of entity depending on whether they are protecting value or interpreting text.

  **1. The Author as Source (Commercial and Legal)**
  In the contexts of continuation, contracts, and libel, the institution presupposes that you are the **causal origin** of the work. Here, the text is treated as an effect of your specific mind. Because you caused it, you own it, you can license it, and you are liable for it.
  *   **Confidence:** Confident.
  *   **Explanation:** This is a property theory. Just as a carpenter owns the chair they built, you own the book. If a character resembles a living person, your statement of intent ("I did not intend this") acts as a defense because it speaks to the *cause* of the resemblance. If the cause was not malice or negligence, the liability is reduced.

  **2. The Author as Witness (Critical and Pedagogical)**
  In the contexts of review, teaching, and prize committees, the institution presupposes that the text is a **public object** detached from its cause. Here, your statement of intent is treated as merely one opinion about the object, not a definition of it.
  *   **Confidence:** Confident.
  *   **Explanation:** This is a reception theory. Once the book is sold, it belongs to the language community. What the text *means* is determined by how it functions in the world, not by what you hoped it would do.

  **The Contradiction:**
  The contradiction you feel arises because these two theories are applied to the same object (the novel) at the same time, but for different purposes. The industry wants the **liability and ownership** of the "Author as Source" while claiming the **interpretive freedom** of the "Author as Witness."

  ### Intentionality: Three Distinct Kinds

  You asked whether the continuation trade presupposes counterfactual facts about what you *would have written*, and whether this differs from intention about meaning. To answer this, we must separate three distinct kinds of intention. The industry conflates them; your survival depends on distinguishing them.

  **1. Generative Intention (The Rules of Making)**
  *   **Definition:** The constraints, habits, and prohibitions you use to produce the text. (e.g., "I never let the narrator know the villain's motive before Chapter 20.")
  *   **Role in Continuation:** This is what the "constraints document" captures.
  *   **Confidence:** Confident.
  *   **Argument:** The continuation trade does *not* primarily care about what plot you *would have* chosen (counterfactual events). It cares about preserving the **generative engine**. If the successor uses your rules, the output will statistically resemble your work. This is not about your mind's content, but your mind's *method*.

  **2. Hermeneutic Intention (The Claim of Meaning)**
  *   **Definition:** Your statement about what the finished text *says* or *is about*. (e.g., "This book is a critique of capitalism.")
  *   **Role in Criticism:** This is what reviewers dismiss.
  *   **Confidence:** Confident.
  *   **Argument:** Denying authority here is consistent with keeping authority over Generative Intention. You can admit that the book *means* things you didn't intend (Hermeneutic) while insisting that only you (or your designated successor) know the *rules* used to build it (Generative).

  **3. Projective Intention (The Plan for Continuation)**
  *   **Definition:** Your desire for what happens to the characters *after* the text ends.
  *   **Role in Continuation:** This is the weakest link.
  *   **Confidence:** Probable.
  *   **Argument:** The industry treats Projective Intention as binding (the estate decides what happens next), but logically, this relies entirely on Generative Intention. If the successor cannot replicate the Generative Intention (the voice/constraints), the Projective Intention (the plot continuation) is legally valid but aesthetically fraudulent.

  **Can you deny the second (Hermeneutic) and lean on the third (Projective)?**
  *   **Verdict:** Yes, but only if you ground the third in the first (Generative).
  *   **Reasoning:** You can say, "I do not have the authority to tell you what my book *means* (Hermeneutic), but I have the sole authority to define the *rules* by which more of this world can be generated (Generative), and therefore I designate who may continue it (Projective)."
  *   **Risk:** If you claim the right to decide what happens next (Projective) without being able to enforce the style constraints (Generative), you are inconsistent. You are claiming authority over the *soul* of the work while admitting you don't control its *body*.

  ### The Constraints Document: Intentionalism or Uptake?

  You asked if the constraints document is best explained by intentionalism or by the reader's experience of a voice.

  *   **Analysis:** The document lists prohibitions ("what she may not know"). This looks like Intentionalism (preserving the author's mind). However, the *goal* is fidelity ("reads like her"). This is Uptake (preserving the reader's experience).
  *   **Conclusion:** The practice is a theory of **Voice as Technology**.
  *   **Confidence:** Probable.
  *   **Argument:** It is not strictly intentionalist because it does not ask "What did the author feel?" It asks "What mechanical limits did the author observe?" It treats your style not as an expression of your soul, but as a **constraint system**. It is intentionalist in *source* (these were your rules) but functionalist in *aim* (to produce the same effect on the reader).
  *   **Implication:** The trade's vocabulary misdescribes what it is doing. It claims to be preserving "the author's vision" (Intentionalism), but it is actually preserving "the author's algorithm" (Functionalism). This is a crucial distinction for your heirs. An algorithm can be copied; a vision cannot.

  ### The Ontology of the Character

  Does any of this require that a character be the *same entity* in a text written by a different person?

  *   **Legal Requirement:** Yes. The contract treats the character as a **portable asset**.
  *   **Metaphysical Requirement:** No.
  *   **Confidence:** Confident.
  *   **Argument:** A character is not a person; it is a **bundle of expectations** attached to a name. When a successor writes "Harry Potter," they are not accessing the same entity you created. They are accessing the *legal right* to use that name and a specific set of traits.
  *   **What sort of entity is it?** It is an **Abstract Artifact**. It exists only insofar as there are texts that refer to it under a governing license. It has no independent existence. Therefore, the "sameness" of the character is not a discovery of truth, but a **stipulation of contract**.
  *   **Risk:** If you treat the character as a real being in your clauses (e.g., "Character X would never do Y"), you create legal ambiguity. If the successor makes Character X do Y, have they broken the contract or just developed the character? You must define the character as a set of *fixed traits* versus *variable behaviors*.

  ### Presupposition vs. Underdetermination

  You asked to distinguish what these practices strictly *presuppose* from what they merely *sit well with*, and to mark where they are underdetermined.

  **1. Strictly Presupposed (The Theory must hold for the practice to work)**
  *   **The Work is Divisible:** The theory must presuppose that "Style" can be separated from "Plot." (Evidenced by the constraints document).
      *   *Confidence:* Confident.
  *   **The Author is a Legal Person beyond Death:** The theory must presuppose that your authority can be transferred like property.
      *   *Confidence:* Confident.

  **2. Merely Sits Well With (The practice works, but doesn't prove the theory)**
  *   **Romantic Genius:** The marketing suggests the successor is channeling your spirit. The practice does not require this; it only requires the constraints document. The "spirit" language is salesmanship, not theory.
      *   *Confidence:* Confident.
  *   **Definitive Meaning:** The archive practice (seeking your final want) suggests there is one "true" text. But the critical practice (your intent doesn't matter) denies this. The archive practice sits well with Intentionalism, but is underdetermined by it; they could simply be preserving the "cleanest" text for readability without claiming it's the "true" one.
      *   *Confidence:* Probable.

  **3. Underdetermined (Several rival accounts license the same practice)**
  *   **Why Continuation Sells:** Is it because readers believe it is *you* (Intentionalism)? Or because they enjoy the *world* regardless of author (Formalism)? The sales data would look the same in both cases. You cannot use the success of continuations to prove that readers care about your specific mind.
      *   *Confidence:* Confident.
  *   **The Status of the Archive:** Is the scholarly edition recovering your *will* or merely fixing *errors*? A publisher correcting a typo and a scholar restoring your deleted paragraph look the same on the page, but rely on different theories of value. The practice does not distinguish them.
      *   *Confidence:* Probable.

  ### The Anti-Intentionalist Shift

  Finally, what would have to change if the anti-intentionalist half (Practice 2: author's aim does not determine text) were taken seriously in the commercial sphere?

  **1. Re-description of Continuation**
  If your intent has no authority over meaning, then a continuation cannot be sold as "The Same Novel Going On." It must be re-described as **Pastiche** or **Official Apocrypha**.
  *   **Confidence:** Confident.
  *   **Reasoning:** "The Same Novel" implies a single continuous mind. If the mind is irrelevant, only the brand remains.

  **2. Marketing Changes**
  *   **Current:** "By [Dead Author] and [Successor]." (Implies shared authority).
  *   **Required:** "Based on the characters created by [Dead Author]. Written by [Successor]." (Implies legal license only).
  *   **Confidence:** Confident.

  **3. Survival of the Practice**
  Could the practice survive? Yes. Fan fiction operates on anti-intentionalist footing (the author's intent doesn't stop fans from rewriting), yet it thrives. The trade practice would survive if it stops claiming **ontological continuity** (this *is* the book) and admits to **franchise continuity** (this *belongs* to the brand).
  *   **Confidence:** Probable.
  *   **Caveat:** The price point might drop. Readers pay a premium for the illusion of the dead author's presence. If that illusion is dropped, the commodity becomes generic.

  ### Summary for Your Agent and Heirs

  To resolve the contradiction in your contracts without losing value:

  1.  **Do not claim authority over Meaning (Hermeneutic).** Allow the critics their freedom. It costs you nothing.
  2.  **Assert absolute authority over Method (Generative).** Your "constraints document" is not a wish list; it is the **source code**. This is what you are selling.
  3.  **Define Characters as Assets, not People.** In your clauses, define characters by their *fixed traits* (which must be preserved) and *variable actions* (which may change). Do not rely on "what they would do."
  4.  **Accept the Split.** You are not one author. You are the **Owner of the Method** (for contracts) and a **Reader of the Text** (for interviews). Keep these roles separate.

  ### Final Constraint Check

  **Single Claim I Am Least Sure Of:**
  I am least sure of the claim that **the practice of continuation could survive a full shift to anti-intentionalist marketing.**
  *   **Confidence Level:** Speculative.
  *   **What Would Change My Mind:** Evidence from the market showing that "Official Apocrypha" or "Brand Extensions" retain the same price premium and sales volume as "Posthumous Novels by [Author]." If readers stop buying once the name "[Author]" is removed from the primary byline (even if the estate authorizes it), then the economic value is strictly tied to the Intentionalist illusion, and the practice cannot survive the philosophical shift. Currently, data is mixed, as "continuations" often sell well initially but rarely achieve the classic status of the original, suggesting the illusion is fragile.
