prompt: |-
  I write novels, and over the past several years a cluster of institutional habits surrounding work like mine has begun to look like a contradiction that I cannot state precisely enough either to accept or to argue with. I would like you to reconstruct the theory of meaning which these habits presuppose, and to tell me whether the habits can be held together.

  The practices, as concretely as I can put them:

  First, when a novelist dies with a series unfinished, the estate appoints a successor, the successor is paid to write *as* the dead author, and the book is sold under the dead author's name in the larger type with the successor's name beneath it. Fidelity is judged by whether the result reads like her. I have recently been advised to keep a document for exactly this purpose, and what struck me is what it is not: not a plot outline, not a list of events still to happen, but a set of constraints on the narrator — what she may not know, what she may not withhold, what she may not feel — together with notes on the dispositions of the recurring characters. The trade appears to believe that what makes a continuation *the same novel going on* is not the sequence of events but a voice specified largely by prohibitions. Relatedly, publishing contracts assign *the work and the characters therein* as if a character were an object detachable from the sentences in which it occurs and portable into sentences written by somebody else, long after I am dead.

  Second, and in apparent tension: when the living author says what her book means, the institutions that review and teach books treat that statement as at best one reading among others, and often as a mistake about her own authority — the familiar view, which I absorbed in workshops and which reviewers repeat as settled, that an author's avowed aim does not determine what her text says. Yet the same publishers, adapters, prize committees, and libel insurers keep asking me what I meant and keep treating the answer as settling something real: an authorised adaptation is authorised by my saying so, and a character's resemblance to a living person is defended by my saying I did not intend it.

  Third, for the archive: scholarly editions of modern novels are built to recover the text the author finally wanted, overriding the publisher's house style and sometimes overriding the author's own last printed revision where that revision looks coerced, tired, or made for money.

  What I want is the implicit theory, stated in plain English with each technical term explained when it is introduced, and argued rather than surveyed. Specifically:

  Does the continuation trade presuppose that a novel's identity consists in counterfactual facts about what its author *would have written*, and is that a different kind of thing from the author's intention about what her text *means*? I would like the relevant kinds of intention prised apart — intention in the writing, intention about the meaning of the finished text, intention about what comes next — and I want to know whether a person who denies the second any authority can lean on the third without inconsistency, or whether the two stand and fall together.

  Is the constraints document best explained by any intentionalist theory at all, or is it better explained by the thought that what is really being preserved is the reader's experience of a voice — in which case the practice is a theory about uptake wearing intentionalist clothing, and the trade's own vocabulary misdescribes what it is doing?

  Does any of it require that a character be the *same entity* in a text written by a different person, and what sort of entity would that have to be?

  And then the discipline I care most about: distinguish what these practices strictly presuppose from what they merely sit well with, and mark where they are underdetermined — where several rival accounts of meaning would license exactly the same practice, so that the practice cannot be used as evidence for any of them. Say where the theory is silent instead of forcing it to speak.

  Finally, what would have to change if the anti-intentionalist half were taken seriously? Would authorised continuation have to be re-described as a distinct art form with its own conventions — pastiche, homage, fan canon promoted to the trade list — or could the practice survive on some other footing, and would it have to be marketed differently?

  Two constraints. I am not asking for a map of the literature: no schools, no reading lists, no citations, since I cannot chase them and could not judge them; I want the argument itself, in a form I could use in a conversation with my agent or my heirs. And this recurs — several times a year I am asked to sign a canon statement, a continuity note, or a clause defining *the work* — so there is money and an afterlife at stake, and a clause drafted wrongly binds people who have not yet been born.

  Where a claim is substantive, mark how confident you are in it — confident, probable, or speculative — and close by naming the single claim you are least sure of, and what would change your mind about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist concerned with the institutional habits surrounding their work (continuations, authorial intent, archival editing, legal definitions of characters).
      *   **Task:** Reconstruct the implicit theory of meaning presupposed by these habits, evaluate their consistency, and answer specific philosophical questions about intention, identity, and character.
      *   **Constraints:** No academic mapping (no schools, reading lists, citations). Plain English. Argumentative, not survey-based. Distinguish what practices *presuppose* vs. what they merely *sit well with*. Mark confidence levels (confident, probable, speculative). End with the single least sure claim and what would change the mind.
      *   **Stakes:** High (money, afterlife, legal clauses binding heirs).
      *   **Tone:** Serious, precise, philosophical but accessible, respectful of the user's craft.

  2.  **Deconstruct the Practices:**
      *   *Practice 1 (Continuation):* Dead author + successor writer = book sold as dead author's. Fidelity = voice/style constraints (negative capabilities), not plot. Characters treated as portable objects.
      *   *Practice 2 (Interpretation/Authority):* Critical/Teaching view = Author's intent doesn't fix meaning (Death of the Author vibe). Legal/Commercial view = Author's intent *does* fix meaning (adaptation rights, libel defense).
      *   *Practice 3 (Archival):* Scholarly editions seek the author's "final wanted text," even overruling printed versions if coerced.

  3.  **Reconstruct the Implicit Theory:**
      *   The institutions operate on a *split theory of value*.
      *   *Commercial/Legal Theory:* The work is property. The author is the source of authority for *rights* and *identity*. Intent matters for ownership and liability.
      *   *Aesthetic/Critical Theory:* The work is an public object. The author is one interpreter among many. Intent doesn't limit meaning.
      *   *Continuation Theory:* The work is a *persona* or *voice*. Identity is maintained through stylistic constraints, not plot or conscious intent.
      *   *Archival Theory:* The work is an *ideal object* existing in the author's will, distinct from the physical book.

      *Synthesis:* The overarching theory is **"Author-Function as Property and Persona."** It treats the author not as a biological person with a single mind, but as a legal and aesthetic construct that can be fragmented.

  4.  **Address Specific Questions:**

      *   *Continuation & Counterfactuals:* Does it presuppose "what the author *would have written*"?
          *   Analysis: The "constraints document" suggests it's not about predicting plot (counterfactual events) but maintaining a *system of generation*. It's about the *rules of the voice*, not the *output of the voice*.
          *   Distinction: Intention in writing (process) vs. Intention about meaning (interpretation) vs. Intention about continuation (future generation).
          *   Consistency: Can you deny interpretive authority (Practice 2) but keep continuative authority (Practice 1)? Yes, if you view the continuation as preserving the *machine* that makes meaning, not the *meaning* itself. But there's tension.

      *   *Constraints Document & Intentionalism:* Is it intentionalist or about reader uptake?
          *   Analysis: It looks intentionalist ("what she may not know"), but functions as a recipe for reader experience ("reads like her"). It's likely a theory of *voice as a constraint system*.
          *   Verdict: It's intentionalist clothing on a theory of *style as constraint*.

      *   *Character Identity:* Does a character have to be the *same entity*?
          *   Analysis: Legally, yes (IP). Aesthetically, no. It's a "name-bearer" theory. The character is a bundle of traits + name.
          *   Ontology: They are *abstract artifacts* created by the text, portable only by legal fiat, not metaphysical reality.

      *   *Presupposition vs. Underdetermination:*
          *   What is strictly required? Legal ownership requires a definable "work."
          *   What is underdetermined? Whether the "work" is the text, the story, or the experience. The practices work regardless of which metaphysical view you hold, as long as the *contract* holds.

      *   *Anti-Intentionalist Consequences:*
          *   If Practice 2 (no authorial authority on meaning) is taken seriously, Practice 1 (continuation) becomes *pastiche* or *fan fiction*.
          *   To survive, it must be marketed as "Official Extended Universe" rather than "The Same Novel."

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the contradiction. It's not a bug; it's a feature of the "Author-Function."
      *   *Section 1: The Split Theory.* Define the two modes: Author-as-Source (Legal/Continuation) vs. Author-as-Witness (Critical).
      *   *Section 2: Intentionality.* Distinguish the three types requested.
          *   *Generative Intention* (Writing): What rules did I follow?
          *   *Hermeneutic Intention* (Meaning): What does this say?
          *   *Projective Intention* (Continuation): What happens next?
          *   *Argument:* You can reject Hermeneutic authority while keeping Generative authority (the "machine" vs. the "message"). But Projective is shaky without Generative.
      *   *Section 3: The Constraints Document.* It's not about what the author *meant*, but how the author *worked*. It's a technical spec sheet. It's not strict intentionalism; it's *stylistic functionalism*.
      *   *Section 4: Character Ontology.* Characters are legal fictions literally and literarily. They are "portable nodes of expectation."
      *   *Section 5: Underdetermination.* The practices don't prove a theory of meaning. They prove a theory of *marketability*.
      *   *Section 6: The Anti-Intentionalist Shift.* If meaning is truly dead from the author, continuation is impersonation. It needs rebranding.

  6.  **Refining Confidence Levels:**
      *   Need to be careful not to overstate metaphysical claims.
      *   High confidence: The legal/commercial split.
      *   Medium confidence: The specific nature of the "constraints" as functional rather than intentional.
      *   Low confidence: The ontological status of characters (philosophers disagree wildly here).

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Plain English? Check.
      *   Argumentative? Check.
      *   Confidence markers? Check.
      *   Final "least sure" claim? Check.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe call it "New Criticism vs. Law."
      *   *Correction:* No, avoid school names. Call it "Public Meaning vs. Private Authority."
      *   *Initial thought:* Say characters don't exist.
      *   *Correction:* Too strong. Say they exist as *legal constructs* primarily.
      *   *Focus:* Ensure the distinction between "what the text means" and "how the text is made" is sharp, as that's the key to resolving the user's contradiction.

  9.  **Final Polish:** Check tone. Ensure it sounds like a conversation with an agent/heir (serious, contractual, forward-looking). Ensure the "least sure" claim is clearly identified at the end. (Decided: The ontological status of the character is the shakiest ground).

  *(Self-Correction on Confidence Markers)*: I need to make sure I explicitly label confidence levels (Confident, Probable, Speculative) on substantive claims as requested.

  *(Refining the "Constraints Document" analysis)*: The user asks if it's intentionalist or about uptake. I need to argue it's a *specification of the generative engine*, which bridges the two. It's not "what I meant" but "how I function."

  *(Refining the "Character" analysis)*: The user asks if they must be the *same entity*. I need to be clear: Legally yes, Metaphysically no. The practice *requires* legal identity, not metaphysical identity.

  *(Final check on the "Anti-Intentionalist" conclusion)*: If the author has no say on meaning, does continuation collapse? Yes, unless rebranded as "homage." I need to be clear on the marketing shift.

