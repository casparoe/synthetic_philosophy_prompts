answer: |-
  ### I. The Disciplinary Mapping

  To evaluate the theoretical stakes, we must first fix the empirical and sociological coordinates of the event. The 2006 General Assembly in Prague was not a discovery event but a legislative one.

  **The Actors:**
  1.  **The IAU Committee (Williams):** Tasked with defining "planet." Proposed the three-candidate framework (cultural, structural, dynamical).
  2.  **The History Committee (Gingerich):** Proposed a compromise keeping Pluto as a planet while creating a "plutonian" subcategory. This was the "save Pluto" draft, voted down in committee.
  3.  **The General Assembly:** Roughly 2,500 astronomers present; only 424 voted on Resolution B5 (the final definition). A significant portion of the IAU membership abstained or was absent.
  4.  **The Dissenters (Planetary Scientists):** Led by Alan Stern (New Horizons PI) and Mark Sykes. They petitioned against the vote, arguing that dynamical criteria are irrelevant to intrinsic nature. They continue to use the geophysical definition in literature.
  5.  **The Consumers:** Textbook publishers, planetarium directors, and educators. They require binary categorization for pedagogy.

  **The Options & Evidence:**
  *   **Option 1 (Cultural):** *Definition:* Historical usage. *Evidence:* 76 years of precedent. *Failure Mode:* Cannot accommodate Eris without arbitrary line-drawing; fails to predict future discoveries.
  *   **Option 2 (Structural/Geophysical):** *Definition:* Hydrostatic equilibrium (roundness). *Evidence:* Pluto's shape, geology (New Horizons confirmed cryovolcanism), mass. *Failure Mode:* Inflates planet count to ~100+ (includes Ceres, Eris, Makemake, potential large KBOs).
  *   **Option 3 (Dynamical):** *Definition:* Orbital clearing ($\mu$ parameter). *Evidence:* Pluto's resonance with Neptune, high inclination, shared orbital zone with KBOs. *Success Mode:* Keeps planet count stable (8); aligns with formation models. *Failure Mode:* Excludes Earth (if placed in Kuiper Belt, Earth wouldn't clear it); makes status dependent on location, not intrinsic properties.

  **The Outcome:** Resolution B5 passed. "Planet" became a dynamical kind, not a structural one. Pluto was reclassified as a "dwarf planet" (a distinct category, not a subset of planet).

  ---

  ### II. The Theoretical Analysis

  Your friend argues that because the non-linguistic facts (Pluto's mass, orbit, shape) remained constant while the truth-value of "Pluto is a planet" flipped, truth must be merely disquotational—a label we stick on sentences based on convention. You argue that this renders the theory vacuous. Here is the deployment.

  #### (a) The 1995/2008 Ascription and the Field Objection
  **The Case:** An astronomer asserts $S$: "Pluto is a planet." In 1995, $S$ is true. In 2008, $S$ is false. The world did not change; the definition did.
  **The Deflationist Move:** The proposition expressed by $S$ in 1995 differs from the proposition expressed by $S$ in 2008 because the meaning of "planet" shifted. The truth predicate remains invariant; the content shifted.
  **The Cost:** You are correct to press the Field objection here. To maintain that *truth* didn't change, the deflationist must offload all explanatory weight onto a theory of **meaning change**. We must posit that "planet" in 1995 referred to *large solar orbiters* and in 2008 to *dynamically dominant solar orbiters*.
  **The Verdict:** This is an honest division of labor, but it concedes your friend's point is trivial. If the theory of truth cannot account for the shift in truth-value without a robust, substantive theory of reference and conceptual change, then "truth" is not doing the work. Field is right: thinness about truth is purchased by thickness about meaning.
  **My Side:** I side with you on the *implication*, though not the refutation. Deflationism survives only by admitting it is silent on *why* the meaning changed. It treats the 1995/2008 shift as a semantic update, not an alethic one. But if the only thing that changes is the semantic rule, then the "truth" of the matter was never about Pluto; it was about the word. This confirms your suspicion: the deflationist saves the theory by making the dispute purely verbal. The cost is that deflationism cannot explain why the verbal dispute mattered so much. It treats the IAU vote as a dictionary update, not a scientific correction.

  #### (b) The Cultural Candidate and Consensus
  **The Case:** Had the IAU adopted the cultural definition ("a planet is what we call a planet"), would 'Pluto is a planet' be true in virtue of consensus?
  **The Deflationist Move:** No. Deflationism distinguishes between *truth conditions* and *assertion conditions*. If the definition of "planet" includes "accepted by astronomers," then the *condition for asserting* the sentence involves checking sociological facts. But the *truth* of the sentence is just the disquotation: "Pluto is a planet" is true iff Pluto is a planet.
  **The Risk:** This looks like a collapse into a consensus theory of truth.
  **The Analysis:** It is only an apparent collapse. A consensus theory of truth says $P$ is true because we agree on $P$. The deflationist says: We agree on the *rule* that governs $P$. If the rule is "X counts as a planet if the IAU says so," then "Pluto is a planet" is true iff the IAU says so. The truth predicate still just disquotes.
  **The Verdict:** Deflationism handles this without collapsing, provided it respects the object-language/meta-language distinction. However, it exposes a vulnerability: if the definition of the term is *explicitly* epistemic or social, deflationism makes truth *look* social, even if it claims it isn't. In the Pluto case, the definition was *not* cultural (it was dynamical), so the truth of "Pluto is not a planet" depends on orbital dynamics, not votes. The vote only fixed the meaning. Deflationism survives here, but only by insisting the vote was about meaning, not truth.

  #### (c) Generalizations and Blind Ascriptions
  **The Case:** "Everything in the 1995 textbook was true." "My childhood belief was false." "The Resolution implies that Pluto is not a planet."
  **The Deflationist Move:** These are the stronghold cases for deflationism (Horwich/Quine). We cannot list every proposition in the textbook, so we use the truth predicate to quantify into sentence position: $\forall p (\text{Textbook says } p \rightarrow p \text{ is true})$.
  **The Critique:** You asked if this expressive function covers the *explanatory work* done in the episode. When we say "The textbook was wrong," we are not just generalizing; we are licensing a withdrawal of endorsement and a revision of curriculum.
  **The Analysis:** Deflationism explains the *logic* of the generalization but not the *normative force*. Why does the falsity of the textbook mandate its removal? Because truth is the norm of assertion (Williamson). But deflationism typically rejects truth as a substantive norm. If truth is just disquotation, why does "falsehood" carry the penalty of retraction?
  **The Verdict:** The expressive function covers the *syntax* of the ascription but fails to cover the *pragmatics*. "My belief was false" does more than deny the content; it signals a break in the continuity of knowledge. Deflationism treats "false" as "not true." But in the Pluto case, "false" functions as "obsolete." Deflationism cannot distinguish between a statement that is false because the world changed (e.g., "The President is Reagan") and a statement that is false because the language changed ("Pluto is a planet"). Both are handled by the equivalence schema, yet they demand different epistemic responses. Here, the thin notion of truth is too thin to capture the *scientific* stakes.

  #### (d) The "Charter Dispute"
  **The Case:** Your distinction: Parties agree on facts, dispute which concept gets chartered, resolution changes what is true.
  **The Deflationist Response:** Deflationism must **dissolve** this distinction. For a deflationist, there is no "chartering a concept" that stands apart from "deciding which sentences to assert." To charter the dynamical definition *just is* to decide to assert "Pluto is not a planet."
  **The Cost:** Dissolving the distinction ignores the institutional reality. The IAU did not just change how they spoke; they changed the *criteria of correctness* for a scientific community. A "charter" implies a constitutive rule (Searle). Deflationism treats it as a regulative rule.
  **The Verdict:** Deflationism cannot mark the distinction without ceasing to be deflationist. If you admit that the IAU "chartered" a truth-condition that didn't exist before, you are admitting that truth-conditions are substantive entities that can be created by fiat. Deflationism denies this. It says the *sentence* changed its role.
  **Is dissolving it a cost?** Yes. It renders the theory blind to institutional power. In science, "truth" is often a status conferred by authority (peer review, definitions, standards). Deflationism treats the IAU vote as a mere coordination of language. But for the schoolchild, the textbook, and the funding agency, the vote *constituted* the fact of Pluto's non-planethood. Deflationism calls this a semantic shift; reality treats it as an ontological demotion. Deflationism fails to capture the *weight* of the charter.

  ---

  ### III. The Honest Verdict

  **Does the episode confirm deflationism?**
  It confirms the **logical** core of deflationism: that the shift in truth-value was driven by a shift in linguistic convention, not a shift in the physical world. If truth were a robust correspondence relation, it is unclear how the relation could break without a change in the relata (Pluto or the world). Deflationism explains this cleanly: the map changed, not the territory.

  **Is it an anomaly?**
  No, but it is a **boundary case**. It highlights that deflationism works best when the language is stable. When the language itself is the object of dispute (as in taxonomy), deflationism reduces the dispute to "verbal," which feels like a dismissal of the scientific labor involved in defining kinds.

  **Where is the theory silent?**
  Deflationism is silent on **why** the dynamical definition won. It cannot explain why orbital clearing is a *better* carver of nature than hydrostatic equilibrium. It treats the choice as arbitrary convention. But planetary scientists argue one definition is more *explanatorily powerful* regarding formation history. Deflationism has no resources to say one definition is "more true to nature" than another, only that one is "adopted."
  Furthermore, it is silent on the **normative residue**. It cannot explain why Alan Stern is *justified* in continuing to call Pluto a planet in certain contexts (geophysics) while being *wrong* in others (dynamical astronomy). Deflationism wants a single truth-value per sentence. The Pluto case suggests truth is context-relative to the *disciplinary charter*.

  **Final Judgment:**
  Your friend is right that deflationism **accommodates** the case easily. It is the path of least resistance. But you are right that this accommodation is a **confession**. By reducing the 2006 decision to a semantic update, deflationism strips the event of its scientific significance. It explains why the sentence changed truth-values, but it cannot explain why we care. If a theory of truth cannot distinguish between a change in meaning and a change in scientific understanding, it has purchased generality at the price of insight. The Pluto episode does not refute deflationism, but it exposes it as a theory of **logic**, not a theory of **inquiry**. It tells you how to handle the truth predicate once the science is done; it tells you nothing about how truth functions while the science is being fought over.
