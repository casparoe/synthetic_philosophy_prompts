      *   *Word Count:* Keep it tight around 850 words.

  4.  **Drafting the Marking Scheme (Part 3):**
      *   *Goal:* 25 marks total. Breakdown by specific philosophical moves.
      *   *Categories:*
          1.  Status of $S_1$ (Truth condition).
          2.  Status of $S_3$ (Triviality/Naturalness).
          3.  Selection of $S_2$ (Best System virtues).
          4.  The Traceless Shield/Counterfactuals (The core metaphysical issue).
          5.  Verdict/Conclusion (Taking a stand).
      *   *Traps:* Identify where students just name-drop or miss the "traceless" implication.
      *   *Differentiation:* What makes an A vs. a B? (e.g., understanding *why* naturalness fixes $S_3$ vs. just saying "it's unnatural").

  5.  **Review and Refine:**
      *   *Check Constraints:* No citations? Yes. Word counts? Yes. Tone? Academic but accessible.
