      *   *Check Logic:* Does $S_1$ fail because it's false? Yes. Does $S_3$ fail because it's tautological? Yes. Is the shield problem clear? Yes.
      *   *Model Answer Tone:* Needs to be authoritative.
      *   *Marking Scheme:* Needs to be usable by a TA or professor.

      *(Self-Correction during drafting Model Answer)*: I need to be careful not to use names like "Lewis" or "Armstrong." I must refer to "the Humean," "the Primitivist," "the Necessitation view."
      *(Self-Correction on Verdict)*: The prompt suggests the traceless shield might favor the Anti-Humean ("whether the traceless shield shows that only an anti-Humean account can underwrite the counterfactual"). However, a strong Humean defense is that *because* the shield is traceless, it doesn't exist in the base, so the Humean law *shouldn't* account for it as an interference, but as a statistical exception. The Anti-Humean posits a law that *should* hold necessarily; a traceless blocker makes the necessitation relation mysterious. I will argue the Humean handles the *metaphysics* of the traceless base better, even if the explanation feels thinner. Actually, looking at the prompt's phrasing ("or whether the Humean can match both"), I should argue the Humean *can* match it by redefining what the law does (summarizing vs. governing). I'll take the stance that the Humean wins on coherence, even if they lose on intuitive "oomph."

      *Wait, one more check on the Model Answer instructions:* "I want it to deal with why S1 isn't even eligible as a system (the axioms have to be true)..." Okay, I must explicitly state $S_1$ is false. "...why S3 looks like a trivialisation and what restricting the vocabulary to perfectly natural properties does and doesn't repair..." Okay, need to discuss naturalness constraints. "...why the traceless shield is the philosophically interesting part..." Okay.

