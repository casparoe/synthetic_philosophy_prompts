answer: |-
  **1. Exam Question**

  **Metaphysics Seminar: Final Assessment**
  **Time Allowed:** 75 Minutes
  **Word Limit:** 1,200 words maximum
  **Total Marks:** 25

  **Question 1**

  Consider a world, $W$, containing only three species of particle: $A$, $B$, and $C$. The history of $W$ consists entirely of adjacency events between these particles. There are exactly one billion $A$-$B$ adjacency events in the history of $W$. In 999,996,000 of these events, a flash of light occurs. In the remaining 4,000 events, no flash occurs.

  Every one of the 4,000 non-flash events occurs inside a single dense $C$-cluster (a sphere of fixed radius, which is the only location in $W$ where $C$ particles exist). This cluster contains 12 million adjacency events altogether. Thus, flashes occur in roughly 99.97% of adjacencies inside the cluster, and 100% of adjacencies outside it.

  Students are asked to evaluate three candidate systems for $W$:
  *   **$S_1$:** Whenever an $A$ is adjacent to a $B$, a flash occurs.
  *   **$S_2$:** Whenever an $A$ is adjacent to a $B$, a flash occurs, *unless* the adjacency occurs within a $C$-cluster, in which case there is a 0.03% chance of no flash.
  *   **$S_3$:** Whenever a *shmashed* $A$-$B$ adjacency occurs, a flash occurs — where "shmashed" is defined as an $A$ adjacent to a $B$ at which a flash occurs.

  **The Stipulation:** The 4,000 non-flash events were produced by an experimenter switching on a "shield." However, the shield is **traceless**. Nothing in the intrinsic, non-nomic facts about those 4,000 events distinguishes a shielded adjacency from an unshielded one. The base facts are identical regardless of whether the non-flashes are described as law-interferences or brute exceptions.

  **Essay Task:**
  (a) Which system ought a Humean nominate as the Best System for $W$, and what constraints are required to make that verdict non-arbitrary? In your answer, explain why the other two candidates fail.
  (b) Does the traceless shield show that only an anti-Humean account can underwrite the counterfactual "if the shield had not been switched on, a flash would have occurred" and the claim that the law *explains* the 999,996,000 flashes? Or can the Humean match this explanatory and counterfactual strength? Argue for a definite verdict.

  ***

  **2. Model Answer**

  A Humean analysis of laws requires that laws supervene on the total mosaic of particular matters of fact. The Best System is the one that optimizes the balance of simplicity, strength, and fit relative to that mosaic. In $W$, the mosaic includes the 4,000 non-flash events. Therefore, $S_1$ is ineligible. A candidate system must be true of the world it describes. $S_1$ asserts a universal regularity that is falsified by the base facts. No amount of simplicity can compensate for falsehood; a system that says "everything is $F$" when some things are not $F$ fails the primary threshold of eligibility.

  $S_3$ is eligible in the sense that it is technically true, but it is trivial. By defining "shmashed" as "an adjacency where a flash occurs," $S_3$ reduces to "Whenever a flash occurs, a flash occurs." This captures no predictive strength. It offers no compression of information; to know if an adjacency is shmashed, one must already know if it flashes. A Humean might try to rescue $S_3$ by invoking a constraint on eligibility: axioms must be stated in terms of perfectly natural properties. "Shmashed" is not natural; it is a gerrymandered predicate defined by the very regularity the law is meant to capture. Restricting vocabulary to natural properties ($A$, $B$, $C$, adjacency, flash) eliminates $S_3$ because "shmashed" cannot be fundamental. However, naturalness constraints alone do not solve the problem of *which* natural predicates to use if multiple true generalizations exist. The Humean must argue that $S_3$ fails on the metric of strength: it tells us nothing about unobserved cases.

  This leaves $S_2$ as the only viable Humean candidate. It sacrifices some simplicity (adding a clause for $C$-clusters and a chance parameter) to gain significant strength and fit. It accurately summarizes the mosaic, acknowledging the exception zone without abandoning the general trend. The verdict is non-arbitrary because $S_2$ maximizes the standard Humean virtues: it is the simplest true statement that captures the maximum information about the distribution of flashes.

  The deeper metaphysical difficulty lies in the traceless shield. The prompt asks whether the Humean can underwrite the counterfactual ("if no shield, then flash") and the explanatory claim ("the law made it flash"). The anti-Humean (primitivist or necessitarian) claims an advantage here. On their view, laws are relations of necessitation between universals. If $N(A\text{-}B, \text{Flash})$ holds, it governs the events. The shield acts as a defeater. The anti-Humean can say the law *would* have produced a flash, but was prevented.

  However, the "traceless" stipulation undermines the anti-Humean position. If the shield leaves no trace in the intrinsic properties of the event, what constitutes the interference? For the necessitation relation to be blocked, there must be some fact about the situation that interacts with the law. If the base facts are identical for shielded and unshielded events, the anti-Humean must posit a difference in the world that is not reflected in the distribution of properties. This threatens to make the "governing" relation mysterious. If the law necessitates the flash given $A$-$B$ adjacency, and the adjacency is intrinsically identical in both cases, the necessitation should hold in both. To save their view, the anti-Humean must claim the shield is a non-nomic fact that nonetheless blocks nomic force without altering properties. This is ontologically costly and renders the necessitation relation insensitive to the actual mosaic.

  The Humean, conversely, handles the traceless nature of the shield more coherently, though with different implications for explanation. For the Humean, the law *is* the summary $S_2$. The counterfactual "if the shield had not been switched on" is analyzed by looking at the closest possible world where the shield is off. In that world, does the Best System change? If the shield is traceless, removing it changes the mosaic (the 4,000 events become flashes). In that new mosaic, $S_1$ might become the Best System (100% regularity). Therefore, the counterfactual is true: in the closest world without the shield, the law is stricter, and the flash occurs. The truth of the counterfactual is secured by the stability of the Best System across nearby mosaics, not by a causal power.

  Regarding explanation, the Humean must concede that laws do not "make" events happen in a productive sense. The law explains the flashes only in the sense that it systematizes them. Is this a failure? Not necessarily. The anti-Humean claims to offer productive explanation, but the traceless shield shows their "production" can be blocked without a physical trace. The Humean admits the limit: the law describes the pattern, and the pattern includes exceptions. The Humean account is superior in this specific world because it does not require hidden metaphysical machinery to explain how a traceless object blocks a necessitation relation. The Humean accepts that if the base facts don't distinguish the cases, the law simply reflects the statistical regularity ($S_2$). The anti-Humean is forced to posit a conflict between the law and the shield that has no footprint in reality. Thus, the Humean matches the counterfactual strength via system-stability and avoids the ontological puzzle of traceless interference, making it the more robust account for $W$.

  ***

  **3. Marking Scheme**

  **Total Marks: 25**

  **1. Eligibility of $S_1$ (4 Marks)**
  *   **4 marks:** Explicitly states $S_1$ is false/ineligible because Best Systems must be true of the mosaic; cites the 4,000 exceptions as falsifiers.
  *   **2 marks:** Notes $S_1$ is "wrong" but fails to link this to the truth-condition requirement for systems.
  *   **0 marks:** Treats $S_1$ as a live contender based on simplicity alone.
  *   *Common Error:* Arguing $S_1$ is the best system because it is simplest, ignoring the falsehood constraint.

  **2. Triviality of $S_3$ and Naturalness (6 Marks)**
  *   **6 marks:** Identifies $S_3$ as tautological/trivial (no strength); explains that restricting vocabulary to "perfectly natural properties" rules out "shmashed" because it is defined by the outcome, not intrinsic features.
  *   **4 marks:** Identifies $S_3$ as trivial but gives a vague account of why naturalness constraints fix it (e.g., just says "it's not natural" without explaining the circularity).
  *   **2 marks:** Spots $S_3$ is bad but attributes it solely to complexity rather than triviality/vocabulary.
  *   *Common Error:* Claiming $S_3$ is a valid system that is just less simple than $S_2$.

  **3. Selection of $S_2$ and Humean Virtues (5 Marks)**
  *   **5 marks:** Selects $S_2$ as the Best System; justifies via the trade-off between simplicity (one axiom + chance/clause) and strength/fit (covers the data accurately).
  *   **3 marks:** Selects $S_2$ but focuses only on "fit" without discussing the simplicity cost.
  *   **1 mark:** Selects $S_2$ with no justification.
  *   *Trap:* Students who recite "simplicity and strength" but fail to apply them to the specific numbers in $W$ (e.g., ignoring the C-cluster data).

  **4. The Traceless Shield and Counterfactuals (7 Marks)**
  *   **7 marks:** Analyzes the counterfactual using system stability (Humean) vs. governing blockage (Anti-Humean); identifies that "traceless" creates a problem for Anti-Humean necessitation (how can a relation be blocked without a property change?).
  *   **5 marks:** Discusses counterfactuals but treats the Anti-Humean advantage as automatic without probing the "traceless" stipulation.
  *   **3 marks:** States the Humean cannot handle counterfactuals (Lange's objection) without engaging with the specific mechanics of the shield.
  *   *Common Error:* Assuming the Anti-Humean automatically wins on counterfactuals without noticing that a traceless interferer makes "governing" incoherent.

  **5. Verdict and Coherence (3 Marks)**
  *   **3 marks:** Takes a definite stand (Humean or Anti-Humean) supported by the previous analysis; avoids fence-sitting.
  *   **1 mark:** Hedges or concludes that "both have pros and cons" without a final metaphysical commitment.
  *   **0 marks:** No conclusion.
  *   *Differentiation:* An **A** grade recognizes that the traceless shield hurts the Anti-Humean *more* than the Humean (ontological cost vs. descriptive limitation). A **B** grade typically hands the counterfactual victory to the Anti-Humean by rote, missing the implication of the "traceless" constraint on necessitation.
