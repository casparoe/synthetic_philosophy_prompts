answer: |-
  Okay, pull up a chair. This is fun. Since your guy is a ex-grad student, he's gonna hate sloppy categories, but he's also drunk enough to admit most philosophy is just arguing about where to draw the lines.

  Here's the map. It's a decision tree. You start at the top with **what the thing is** (Ontology), move down to **how we know it** (Epistemics), and end with **whether you're allowed to say it** (Ethics). I've kept the nodes casual—no jargon bombs—so your characters can actually speak them in a bar.

  There are 7 branch nodes here. Follow the lines.

  ***

  ### The Root: What kind of thing is "French Character"?

  **Node 1: Is the property *inside* the people, or *outside* them?**
  *   **Option A (Inside):** It's something about their psychology, history, or blood. (Go to Node 2)
  *   **Option B (Outside):** It's just how they behave because of laws, weather, or incentives. (Go to Node 3)
  *   **Option C (Nowhere):** It's a story the speaker is telling, not a fact about the French. (Go to Node 4)

  ---

  ### Branch A: The "Inside" View (Essentialism)

  **Node 2: Is this inner property fixed forever, or can it evolve?**
  *   **Leaf 1: The Hard Essentialist.**
      *   *Claim:* Yes, it's fixed. You can spot a Frenchman anywhere, anytime.
      *   *Awkward Commitment:* You have to believe second-generation immigrants never *really* integrate, because the "software" is inherited.
  *   **Leaf 2: The Soft Essentialist.**
      *   *Claim:* It's real, but culture shifts slowly, like geology.
      *   *Awkward Commitment:* You have to accept that your generalization will be wrong about anyone under 30, but still claim it's "true" about the nation.

  *(Empty Slot Alert: "It's real inside them but totally unknowable." Why posit a real thing if you can't measure it? That's just religion.)*

  ---

  ### Branch B: The "Outside" View (Patterns)

  **Node 3: Is the pattern caused by averages or by systems?**
  *   **Option B1 (Averages):** It's just statistics. Most people do X, so we say "French do X." (Go to Node 5)
  *   **Option B2 (Systems):** It's institutional feedback. The labor laws make them seem lazy; the schools make them seem argumentative. (Go to Node 6)

  **Node 5 (Averages): Can you use group data to predict an individual?**
  *   **Leaf 3: The Statistical Realist.**
      *   *Claim:* Yes, bell curves are real. Hofstede dimensions work.
      *   *Awkward Commitment:* You have to be okay with ignoring the individual in front of you to be "accurate" about the group. (The Ecological Fallacy trap).
  *   **Leaf 4: The Epistemic Skeptic.**
      *   *Claim:* No, the variance within the group is bigger than the difference between groups.
      *   *Awkward Commitment:* You have to admit cross-national psychology is mostly noise, and "national character" is just rounding error.

  **Node 6 (Systems): If we change the institutions, does the character vanish?**
  *   **Leaf 5: The Institutional Determinist.**
      *   *Claim:* Yes. Change the tax code, the "character" changes in a generation.
      *   *Awkward Commitment:* You have to say culture is shallow. There's no "soul," just incentives. (This often collapses with Constructivism).

  ---

  ### Branch C: The "Nowhere" View (Fiction/Construct)

  **Node 4: Does saying the thing make it true?**
  *   **Option C1 (Yes):** The label creates the behavior (Self-fulfilling). (Go to Node 7)
  *   **Option C2 (No):** It's just a mistake or a lie. (Go to Node 7)

  **Node 7: Is the fiction useful or harmful?**
  *   **Leaf 6: The Pragmatic Constructivist.**
      *   *Claim:* It's not true, but it's a useful shorthand for navigating social norms.
      *   *Awkward Commitment:* You're endorsing a lie because it's convenient. You're saying "stereotypes are tools," which is a slippery slope.
  *   **Leaf 7: The Ethical Absolutist.**
      *   *Claim:* It's false and harmful. Power dynamics make generalizations weapons.
      *   *Awkward Commitment:* You have to silence accurate observations if they reinforce a power imbalance. Truth doesn't matter if the impact is bad.

  *(Empty Slot Alert: "It's false but harmless." In a post-colonial context? Hard to defend. Usually implies the speaker is too privileged to see the harm.)*

  ---

  ### The Collapsed Distinctions (For the Dialogue)

  If your protagonist wants to show off, have him point out where the branches touch:

  1.  **Institutional Determinist (Leaf 5) vs. Pragmatic Constructivist (Leaf 6):** These guys end up in the same place. One says "laws make them act French," the other says "expectations make them act French." Practically? Same outcome.
  2.  **Soft Essentialist (Leaf 2) vs. Statistical Realist (Leaf 3):** Both admit exceptions exist, but both insist the generalization holds weight. The only difference is whether they think the cause is "soul" or "data."
  3.  **The "True but Harmful" Gap:** Notice there's no leaf for "It's scientifically true, so I should say it regardless of harm." That's the **Scientific Absolutist**. I left it out because nobody admits to being this in a bar—they usually hide behind Leaf 3 (Stats). If your protagonist wants to be unpopular, have him argue for this empty slot.

  ### How to use this in the scene

  Don't have them recite the tree. Have them bump into the nodes.

  *   **The Opponent:** "It's just data, man. Look at the survey results." (Trying to sit in **Leaf 3**).
  *   **Your Protagonist:** "But if the survey asks leading questions, you're not measuring character, you're measuring the institution that taught them to answer that way." (Pushing them toward **Leaf 5**).
  *   **The Opponent:** "Okay, fine, it's constructed. So what? It's still useful." (Sliding into **Leaf 6**).
  *   **Your Protagonist:** "Useful for who? You? Or them?" (Trapping them in **Leaf 7**).

  That should give you enough logical friction to keep the argument going for three pages without it feeling like a lecture.
