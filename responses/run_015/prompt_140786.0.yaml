answer: |-
  **MEMORANDUM**

  **TO:** All Staff  
  **FROM:** Facilities Management  
  **RE:** Relocation of the Coffee Machine  

  1. The coffee machine is now in the breakroom.  
  2. The location of the printers remains unchanged.  
  3. The location of the fire exits remains unchanged.  
  4. The validity of statement (2) remains unchanged.  
  5. The validity of statement (3) remains unchanged.  

  **POSTSCRIPT:** Legal is currently drafting statement (6) to confirm that statement (4) remains valid.

  ***

  **Explanation for the neighbor:** The joke leans on the regress of frame axioms: to represent that a fact hasn't changed, you must explicitly state it, but then you must also state that *that* statement hasn't changed, ad infinitum. A nearby-but-wrong version would have joked about the memo being too long to read (computational cost) or about the coffee machine blocking the printer (the ramification problem of indirect effects).
