answer: |-
  # Joint Statement on the New Riddle of Induction
  **Adversarial Collaboration Between Side A (Projectibility-First) and Side B (Prior-First)**

  ### Preamble: On Verbal Disputes
  We have identified one area of our prior disagreement that we now recognize as merely verbal and which is excluded from the Disagreements Table below. We previously disputed whether the "New Riddle" is *distinct* from the "Old Riddle." We now agree this depends on the definition of "distinct." If "distinct" means "logically independent," Side B is correct that it is not (as both concern the justification of non-deductive inference). If "distinct" means "identifies a specific lacuna in formal confirmation theory that Hume did not isolate," Side A is correct. We will proceed by focusing on the substantive lacuna itself rather than the labeling of the historical puzzle.

  ---

  ### (i) Joint Claims
  *The following claims are endorsed by both Side A and Side B.*

  1.  **The Insufficiency of Syntax and Evidence:** The "Grue" case successfully demonstrates that syntactic form of hypotheses and the totality of observational evidence up to time $T$ are insufficient to determine which hypotheses are confirmed. Any adequate theory of confirmation must include a mechanism to discriminate between projectible and non-projectible predicates.
  2.  **Relation to Hume:** The New Riddle does not solve Hume's Old Riddle (the justification of induction itself). Rather, it presupposes that some induction occurs and asks what distinguishes *good* inductive inferences from *bad* ones. Both sides agree that solving the New Riddle does not entail solving the Old Riddle.
  3.  **The Role of Priors:** Both sides agree that within a Bayesian framework, the discrimination between "Green" and "Grue" hypotheses must be reflected in the prior probability distribution. The dispute concerns whether the justification for these priors requires external constraints (Side A) or is internal to rational agency (Side B).
  4.  **Law-Grue Variant:** Regarding the variant where a physical constant changes value at time $T$: Both sides agree that the mere existence of a time $T$ does not render a law unscientific (e.g., phase transitions are real). However, the vast majority of time-sliced laws are gerrymandered. The criterion for distinguishing serious time-sliced laws from gerrymandered ones cannot rest solely on the observational data available prior to $T$.
  5.  **Symmetric-Entrenchment Variant:** Regarding the community with primitive "Grue/Bleen" vocabulary: Both sides agree that within that community, "Green" would be the complex, defined predicate. However, both sides agree that an external observer (us) can still meaningfully ask whether that community's inductive practices are as robust as ours. The puzzle is not dissolved by relativism alone; the question of predictive success across different linguistic frameworks remains open.
  6.  **Metaphysics and Rationality:** The puzzle is not merely linguistic (solvable by translation) nor merely metaphysical (solvable by positing "natural kinds" without explaining epistemic access). It is a problem of **rational constraint**: explaining why it is rational to prefer one hypothesis space over another given identical evidence.

  ---

  ### (ii) Disagreements Table
  *Residual substantive disagreements. Each row represents the same point of contention, articulated in the preferred terminology of each side.*

  | Topic | Side A (Projectibility-First) Wording | Side B (Prior-First) Wording |
  | :--- | :--- | :--- |
  | **1. The Locus of the Constraint** | Inductive validity requires a **substantive constraint on predicates** (e.g., naturalness, causal structure) that operates *prior* to the assignment of probabilities. Formal confirmation theory is incomplete without this ontology. | Inductive validity is fully captured by **probabilistic coherence and conditionalization**. The constraint lies in the **rational requirements on priors**, not in the predicates themselves, which are merely neutral labels. |
  | **2. The Nature of Entrenchment** | Entrenchment (past projection) is a **normative guide** that tracks objective features of the world (causal stability). It is not merely psychological habit; it is evidence of projectibility. | Entrenchment is a **descriptive feature of agent psychology**. It explains why we *do* assign high priors to "Green," but it does not justify why we *should* beyond pragmatic considerations of simplicity and communication. |
  | **3. Law-Grue Discrimination** | Serious time-sliced laws are distinguished by **causal/nomic continuity**. A change in a constant requires a causal mechanism; without one, the time-slice is ad hoc and unprojectible. | Serious time-sliced laws are distinguished by **model selection criteria** (e.g., AIC, BIC). A phase transition model may minimize error + complexity better than a constant model, justifying the time-slice without appealing to hidden "causal powers." |
  | **4. Symmetric-Entrenchment Normativity** | The Grue/Bleen community is **epistemically disadvantaged**. Their priors are objectively worse because they fail to carve nature at its joints, regardless of their internal coherence. | The Grue/Bleen community is **epistemically equivalent**, provided their priors are coherent. Their linguistic framework is a different coordinate system; predictive success depends on updating, not the primitive vocabulary. |

  ---

  ### (iii) Cruxes and Accepted Evidence
  *Sub-questions where settling the matter would move at least one side. For each crux, we specify the evidence both accept as relevant and record our pre-commitments.*

  #### Crux 1: The Source of Inductive Bias
  *Question:* Is the human bias toward "Green" over "Grue" best explained as a sensitivity to objective natural kinds (A) or as an optimization for data compression and algorithmic simplicity (B)?

  *   **Accepted Evidence:** Comparative cognitive science and machine learning. Specifically, studies on concept learning in infants/AI showing whether "natural" predicates are learned faster *even when* "gerrymandered" predicates are computationally simpler to encode in a specific system.
  *   **Side A Prediction:** We predict that cognitive systems (biological or artificial) will systematically fail to generalize "Grue-like" patterns even when they are computationally efficient, unless explicitly tuned to objective causal structures.
  *   **Side B Prediction:** We predict that "Grue-like" patterns will be learned readily if they offer better compression of the data stream, implying our bias is contingent on the statistical structure of our specific environment, not objective kinds.

  #### Crux 2: The Law-Grue Discrimination Mechanism
  *Question:* In historical cases of proposed time-varying constants (e.g., Dirac's Large Numbers Hypothesis vs. Standard Model constants), what is the primary reason for rejection?

  *   **Accepted Evidence:** Historical case studies of theory choice in physics, specifically looking at referee reports and author justifications for rejecting time-sliced laws in favor of constant laws (or vice versa in phase transitions).
  *   **Side A Prediction:** We predict physicists will cite the **absence of a causal mechanism** for the change at $T$ as the primary reason for rejection, appealing to nomic stability.
  *   **Side B Prediction:** We predict physicists will cite **mathematical parsimony and continuity** (e.g., penalty terms for extra parameters) as the primary reason, consistent with Bayesian Model Selection, without invoking causal mechanisms.

  #### Crux 3: Symmetric-Entrenchment Predictive Success
  *Question:* If a Grue/Bleen-speaking community were to engage in long-term technological prediction (e.g., engineering materials), would their success rate diverge from ours?

  *   **Accepted Evidence:** Simulation of inductive agents with opposing priors in varying environments (stable vs. volatile).
  *   **Side A Prediction:** We predict that in a world with stable natural kinds (like ours), the Grue/Bleen agents will suffer **systematic predictive failure** in novel contexts because their priors misalign with reality's structure.
  *   **Side B Prediction:** We predict that given sufficient evidence, the Grue/Bleen agents will **converge on the same posterior beliefs** and technological success as us, because the likelihood function swamps the prior over time.

  ---
  **Signed:**

  _________________________ (Side A Representative)

  _________________________ (Side B Representative)

