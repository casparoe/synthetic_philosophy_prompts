  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Entitlement" too vague?
      *   *Fix:* Define it as "Normative Expectation." In a car sale, there's a norm of disclosure. In a haircut, there's a norm of politeness.
      *   *Critique:* Why is CV misleading potentially *worse*?
      *   *Fix:* It signals *calculating cynicism*. It shows the agent knows the norm but engineered a loophole. That's a vice of character (cunning vs. honest).
      *   *Critique:* Case 2 (Interview) gap.
      *   *Fix:* Here, the lie is a clear breach of contract. The misleading statement is ambiguous. The gap is the difference between "Breach" and "Loophole."

  8.  **Final Polish:** Ensure tone is seminar-appropriate (rigorous, analytical, supportive). Structure with clear headings. (Proceed to generate output based on this thought process).

      *   *Key Insight to highlight:* The "Standard Move" (Lying > Misleading) relies on the *Norm of Assertion*. But your intuitions show that *Norm of Trust* often overrides it. When trust is the primary currency (Car, CV), the method matters less than the betrayal. When professional protocol is the currency (Interview), the method matters more.

  9.  **Final check on the Dying Relative:** This is the crux. The principle should advise: Look at *why* you are misleading. If it's to preserve hope (beneficence), it's akin to the Haircut case. If it's to avoid distress (paternalism/cowardice), it's akin to the CV case.

