answer: |-
  **Diagnosis:** Reject **(1)**.

  **The Mistake:** (1) is a **false premise**. It asserts a necessary condition for moral obligation ("*only if* refraining makes an expected difference") that is too narrow. It conflates **causal responsibility** with **moral responsibility**. While causal difference-making is *one* way to generate an obligation, it is not the *only* way. The argument fails because it assumes Act-Consequentialism is the sole arbiter of moral truth, then uses that assumption to prove that no obligations exist in threshold cases. This is a circular tightening of the moral net: it defines "obligation" in a way that excludes non-causal duties (complicity, integrity, fair play), then claims those duties don't exist because they don't meet the definition.

  **The Price of Alternatives:**

  1.  **Keep (2), Drop (1) [My Recommendation]:**
      *   **Cost:** You must abandon Pure Act-Consequentialism. You have to accept that morality is not solely about optimizing states of affairs. You must admit that an agent can be morally implicated in a harm they did not causally pivot. This requires a hybrid theory (e.g., Consequentialism + Constraints, or a Complicity Principle).
      *   **Benefit:** You save the intuition that individuals have obligations in collective harm cases without lying about supply chain logistics. You resolve the "self-limiting" paradox (7) because the obligation doesn't vanish when the causal chain is deterministic.
      *   **Risk:** You face the "demandingness" worry you noted. If I am obligated without making a difference, am I obligated to *everything*? (Addressed below).

  2.  **Keep (1), Attack (2):**
      *   **Cost:** You must deny the empirical reality of lumpy supply chains. You have to argue that there is *always* a non-zero probability of pivotality, even in deterministic-looking systems (e.g., arguing that accounting policies are never perfectly rigid).
      *   **Benefit:** You keep a clean, single-principle moral theory.
      *   **Risk:** This is empirically fragile. If a hatchery truly breeds in fixed lots of 10,000 with no buffer, your probability *is* zero. Basing moral obligation on the hope that logistics are messy is a weak foundation. It also fails to solve the overdetermination case (the lake), where probability is genuinely zero for the inert dumpers.

  3.  **Keep (1) and (2), Accept (3):**
      *   **Cost:** Moral nihilism regarding collective harm. You must accept that no individual is responsible for climate change or factory farming, only the "collective" (which is an abstraction).
      *   **Benefit:** Logical consistency within the narrow framework.
      *   **Risk:** As you note in (5), this proves too much. It absolves nations and firms too, dissolving the concept of responsibility entirely. It is pragmatically self-defeating (7).

  **Detailed Analysis of Your Sub-Questions:**

  **1. Deterministic vs. Noisy Cases (Your point 6):**
  You are correct that these cases **cannot differ morally**. If your obligation depends on whether a manager uses a rounding algorithm or a moving average, your moral theory is hostage to administrative trivia. This is a *reductio ad absurdum* of (1).
  *   **Why they don't differ:** Moral obligation in collective cases is grounded in **risk imposition** and **participation**, not just realized causation. In the noisy case, you impose a risk. In the deterministic case, you participate in a harmful practice. The *nature of your agency* is the same: you are buying a product produced by suffering. The moral wrong is in the **transaction**, not just the **outcome**.
  *   **Diagnosis:** The fact that (1) yields different results for these two cases confirms (1) is false. A valid moral principle should track morally relevant features (harm, intent, participation), not accounting conventions.

  **2. The Policy/Act Distinction (Your point 6):**
  This is **not a composition confusion**; it is a signal that the unit of moral evaluation is wrong. Act-Consequentialism evaluates single acts. But in threshold cases, the relevant unit is often a **pattern of conduct** or a **policy**.
  *   **Why:** A single purchase is inert; a lifetime habit might tip a threshold (if the system averages) or constitutes a stable participation in a harmful market (if deterministic).
  *   **Implication:** This suggests replacing (1) with a **Rule-Consequentialist** or **Pattern-Based** principle. "I am required to adopt a policy of refraining if the general adoption of that policy makes a difference," or "if maintaining this policy constitutes complicity." This solves the "one bird" problem without requiring that specific bird to be pivotal.

  **3. The Replacement Principle and Overdetermination:**
  Replace (1) with: **(1*) The Complicity Principle.** *I am morally required to refrain from doing X if X constitutes participation in a collective process that causes significant harm, provided the cost of refraining is not excessive, regardless of whether my specific contribution is causally pivotal.*

  *   **Overdetermination Case (10 dumpers, 5 kill fish):**
      *   **Under (1):** 5 are guilty, 5 are innocent. This is absurd. They all performed the same act with the same intent.
      *   **Under (1*):** All 10 are guilty. They all participated in a process they knew (or should have known) was harmful. Their obligation stems from **fair play** and **non-participation in wrongdoing**, not pivotality.
      *   **Why this works:** It captures the intuition that moral blame tracks *agency and intent*, not just lucky/unlucky causal placement.

  *   **Demandingness Worry:**
      *   **Your Fear:** If mere membership obligates me, I owe everything to everyone.
      *   **The Fix:** The Complicity Principle includes a **cost constraint** ("provided the cost... is not excessive") and a **significance threshold** ("significant harm"). You are not required to join *every* boycott, only those addressing *serious* harms where your participation is *non-trivial* (even if not pivotal).
      *   **Observability:** You do not need to know the exact aggregate. You need only know that the practice is harmful and that you are part of it. Ignorance of the exact threshold does not excuse participation in a known risk.

  **4. The Self-Limiting Argument (Your point 7):**
  This is a **pragmatic paradox**. If the truth of the argument destroys the conditions of its own acceptance (by licensing behavior that makes the conclusion false or harmful), it is a sign that the conclusion is practically irrational. In ethics, **practical rationality** is a constraint on truth. An ethical theory that tells you "believing this makes you worse" is defective. This supports rejecting (1), because (1) generates this paradox, whereas a duty-based view (1*) does not (believing you have a duty to refrain reinforces the duty).

  **Confidence and Falsification:**

  *   **Confidence:** **85%**. This is the standard resolution in contemporary ethics (see Julia Nefsky, Travis Timmerman, Victor Tadros) because the alternative (nihilism) is untenable and the empirical denial (attacking 2) is dishonest.
  *   **What would change my mind:**
      1.  **A Causal Account of Complicity:** If someone could demonstrate that "complicity" reduces to "expected causal difference" under a more sophisticated model of causation (e.g., structural equation modeling that assigns partial credit to non-pivotal causes). If complicity *is* just hidden difference-making, then (1) stands.
      2.  **Empirical Smoothness:** If it turned out supply chains were actually far more responsive than thought (probability never zero), the pressure to reject (1) lessens. But given your strong formulation of (2), I am assuming this is not the case.
      3.  **A Robust Defense of Collective Agents:** If it could be shown that *only* collective agents (corporations, states) bear moral responsibility, and individuals are truly morally inert components, then (3) would be true. But this requires a metaphysics of group agency that dissolves individual responsibility entirely, which is a high bar.

  **Final Instruction for Your Paper:**
  Do not try to fix the causal chain. Fix the moral theory. Argue that **(1) embodies a category mistake**. It treats moral obligation as a function of physics (causation) rather than a function of rational agency (reasons, integrity, and participation). Your paper should pivot from "Do I make a difference?" to "What kind of agent do I become by participating?" This allows you to keep the empirical realism of (2) while escaping the nihilism of (3).
