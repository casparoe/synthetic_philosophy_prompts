prompt: |-
  I teach an upper-level seminar on personal identity, and this term a colleague in our medical school has asked me to guest-lecture on Ulysses contracts — the psychiatric advance directives under which a patient, while lucid and competent, instructs clinicians to administer treatment during a future episode of psychosis or mania even if the patient then refuses it. I know the standard bioethics framing well enough: precedent autonomy, substituted judgment, and so on. What I want is a different kind of analysis. Legal systems and hospital policies that enforce these directives seem to me to be doing metaphysics without admitting it, and I'd like you to help me reconstruct the implicit theory of the self that the practice presupposes. Specifically: when a tribunal honors the lucid patient's instruction against the refusing patient's contemporaneous dissent, what account of personal identity makes that anything other than one person issuing commands about what may be done to a different person? Is the practice best read as presupposing psychological continuity (the earlier and later patient are one subject because their mental states are causally and qualitatively connected), narrative continuity on something like Dennett's model (the directive identifies the self as a center of narrative gravity, and the psychotic episode is a chapter that the narrator is best placed to interpret), or some further view on which the current patient's refusal carries weight that the earlier author was entitled to discount?

  I'd also like you to confront an asymmetry that has always puzzled me, and that my medical students will surely raise. We are fairly comfortable enforcing advance refusals — a patient who stipulates while competent that she not be force-fed once demented, even if the later patient appears content and wants to eat — but considerably less comfortable enforcing advance requests, where the later patient competently-seeming resists treatment the earlier self demanded. Some jurisdictions and hospital policies formalize this by making advance refusals more binding than advance requests. My suspicion is that this asymmetry, if it is principled, has to rest on some substantive view about which self counts, or about what happens to the "self" when the narrative breaks down — perhaps something like the thought that in late-stage dementia the biographical subject has already gone, whereas during a psychotic episode there is a partially intact subject present whose dissent matters. I don't know whether that thought can be made coherent, or whether it just restates the asymmetry in fancier language.

  So here is what I'd like from you. First, reconstruct the implicit theory (or theories) of the self that the practice of enforcing Ulysses contracts presupposes, being careful to distinguish what the practice strictly requires from what it merely sits comfortably with — I want to know where the practice is philosophically underdetermined, such that several rival accounts of personal identity would license it equally. Second, say what Dennett's narrative-gravity picture would actually predict here: does the "center of narrative gravity" metaphor give us a principled way to privilege the lucid author's instruction over the psychotic patient's refusal, or does it in fact make the privileging look arbitrary, since both selves are equally characters in the same unfolding story? Third, tell me whether the asymmetry between advance refusals and advance requests can be justified within any single consistent account of the self, or whether it reveals that the practice is relying on shifting, incompatible commitments — for instance, treating the later demented patient as nobody at all in one case while treating the later psychotic patient as a full subject in another. And finally, if you think no theory of personal identity can ground the practice, say what a coherent policy would have to change, and what it would have to appeal to instead. I should mention that the audience for the eventual lecture is physicians and law students, so while the analysis should be philosophically rigorous, it should stay tethered to the concrete features of the practice — capacity assessments, the doctrine that competent refusals are normally inviolable, the fact that these directives typically concern treatment, not confinement. I'd rather not have a survey of the literature; I want an argument.
reasoning: |-
  Here's a thinking process that leads to the suggested lecture material:

  1.  **Deconstruct the Request:**

      *   **Context:** Upper-level seminar on personal identity, guest lecture for medical/law students.
      *   **Topic:** Ulysses contracts (psychiatric advance directives enforcing treatment during future incapacity/psychosis despite contemporaneous refusal).
      *   **Goal:** Move beyond standard bioethics (precedent autonomy) to an *implicit metaphysics of the self*.
      *   **Key Questions:**
          1.  Reconstruct the implicit theory/theories of the self presupposed by enforcing Ulysses contracts. Distinguish what is *required* vs. what is *compatible*.
          2.  Apply Dennett's "Center of Narrative Gravity" specifically. Does it privilege the lucid author or the psychotic character?
          3.  Analyze the asymmetry between advance *refusals* (e.g., no feeding in dementia) and advance *requests* (e.g., force treatment in psychosis). Can one theory of self justify both, or does it reveal inconsistent commitments about who counts as a person?
          4.  If personal identity theories fail, what should the policy appeal to instead?
      *   **Constraints:** Philosophically rigorous but tethered to concrete practice (capacity, inviolable refusal, treatment vs. confinement). No literature survey; provide an *argument*.
      *   **Audience:** Physicians and law students (needs clarity, practical relevance, but high intellectual caliber).

  2.  **Part 1: The Implicit Metaphysics of Ulysses Contracts:**

      *   *The Problem:* If Person A (lucid) commands treatment for Person B (psychotic), and Person B refuses, enforcing A's will looks like A ruling over B. If A and B are different people, this is tyranny. If they are the same, it's self-binding.
      *   *Standard View:* Psychological Continuity (Lockean). Memory/character links A and B.
      *   *Critique:* Psychosis often *breaks* psychological continuity. Delusions alter beliefs, desires, and reasoning. If continuity is broken, why does A bind B?
      *   *The "Required" Metaphysic:* The practice *requires* a distinction between the *Authentic Self* and the *Pathological State*. It doesn't necessarily require strict numerical identity over time. It requires that the *status* of the agent at T1 (lucid) has higher normative weight than the agent at T2 (psychotic).
      *   *Underdetermination:*
          *   *Biological View:* Same human organism = same patient. (Too crude, ignores capacity).
          *   *Psychological Continuity:* Works if the break isn't total.
          *   *Normative Competence:* It's not about *who* they are, but *which state* tracks reality/values better.
      *   *Conclusion:* The practice presupposes a **Hierarchical Model of Agency**. It's not just "same person," it's "authorized person vs. compromised person."

  3.  **Part 2: Dennett's Center of Narrative Gravity:**

      *   *The Concept:* The self is a fiction, a center of narrative gravity constructed by storytelling.
      *   *Application:* Who is the "Author"?
          *   *Option A:* The Lucid Self is the Author. The Psychotic Self is a character gone rogue. The directive is the plot outline.
          *   *Option B:* Both are chapters. The psychotic episode is a "dark night of the soul" chapter necessary for the whole story.
      *   *The Problem:* Dennett's view is descriptive, not normative. A center of gravity exists wherever there is interpretation. The psychotic patient is also generating a narrative (even if delusional).
      *   *Verdict:* Dennett alone doesn't solve it. It risks making the privileging arbitrary unless we add a normative layer about *which narrative is truth-tracking*. If the self is *just* a narrative, the psychotic narrative is as real as the lucid one. To enforce the contract, we must claim the lucid narrative is *authoritative*, not just earlier. This pushes Dennett toward a "Competence-Weighted Narrative" view.

  4.  **Part 3: The Asymmetry (Refusal vs. Request):**

      *   *The Phenomenon:* We honor "No feeding" (Refusal) in dementia even if the demented self wants to eat. We hesitate to honor "Force treat" (Request) in psychosis if the psychotic self refuses.
      *   *The Metaphysical Tension:*
          *   *Dementia Case:* Implies the Demented Self is *not* the same moral agent as the Prior Self. (The "biographical death" view). The Prior Self's rights survive the death of the agent.
          *   *Psychosis Case:* Implies the Psychotic Self *is* a moral agent whose dissent matters (hence the hesitation), but is overridden by the Prior Self.
      *   *Is it Consistent?*
          *   *Attempt 1 (Continuity):* If continuity breaks in dementia, it breaks more in psychosis? No, psychosis is often temporary.
          *   *Attempt 2 (Harm Principle):* Refusal = letting die (negative right). Request = forcing intrusion (positive right). This is legal, not metaphysical.
          *   *Attempt 3 (The "True Self" View):* In dementia, the "True Self" is gone. In psychosis, the "True Self" is obscured but present.
      *   *Diagnosis:* The asymmetry *cannot* be grounded in a single consistent theory of personal identity. It relies on shifting metaphysics. In dementia, we treat the prior self as the *owner* of the body. In psychosis, we treat the current self as a *rights-bearer* who is temporarily incapacitated.
      *   *Why?* Because the *harm* of violating a refusal (force-feeding a happy demented person) feels like violating a corpse/stranger, whereas the *harm* of violating a request (not treating a manic person) feels like neglecting a sick child.
      *   *Conclusion:* The asymmetry reveals we are not doing metaphysics; we are doing **risk management regarding suffering**.

  5.  **Part 4: If Identity Fails, What Grounds the Practice?**

      *   *Premise:* Personal identity theories are too brittle to handle the clinical reality.
      *   *Alternative:* **Best Interests + Procedural Authority.**
      *   *Shift:* Stop asking "Are they the same person?" Ask "Which decision-making process is more reliable?"
      *   *Policy Change:* Ulysses contracts shouldn't be absolute commands (metaphysical binding). They should be *evidence* of best interests.
      *   *The "Veto" Power:* The contemporaneous refusal should trigger a higher bar of review, not automatic override.
      *   *Appeal:* Trust and Epistemology. The lucid self knows the values; the clinical team knows the pathology.
      *   *Concrete Recommendation:* Treat the directive as a "presumption of competence" rather than a "metaphysical bond."

  6.  **Drafting the Response (Iterative Refinement):**

      *   *Tone:* Academic, rigorous, but accessible to med/law students. Avoid jargon without explanation.
      *   *Structure:* Follow the four prompts exactly.
      *   *Key Insight to Highlight:* The "Metaphysics of Competence." The law pretends it's about identity, but it's actually about epistemic privilege.
      *   *Refining the Dennett Section:* Make sure to emphasize that Dennett's view is anti-realist about the self. If the self is a fiction, binding one fiction to another is pragmatic, not ontological.
      *   *Refining the Asymmetry:* This is the crux. The "Biographical Death" hypothesis (Dworkin) vs. "Temporary Obscuration" (Psychosis). Show why these clash.
      *   *Final Recommendation:* Move from "Identity" to "Authority."

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "underdetermined" aspect? *Yes, need to explicitly state that Biological, Psychological, and Normative views all allow the practice, but for different reasons.*
      *   *Check:* Did I address the medical/legal audience? *Yes, keep references to capacity assessments and tort liability implicit but clear.*
      *   *Check:* Is the argument clear? *The core argument is that Ulysses contracts rely on a normative hierarchy of selves, not a metaphysical identity claim, and the asymmetry proves this.*

  8.  **Final Polish:** Ensure the distinction between "Refusal" (negative liberty) and "Request" (positive liberty) is tied to the metaphysical status of the patient. (e.g., In dementia, we respect the *past* liberty. In psychosis, we fear violating the *present* bodily integrity).

  *(Self-Correction on the Asymmetry)*: Wait, the prompt asks if the asymmetry can be justified within a *single consistent account*. I need to be careful. If I say "No," I must explain why. If I say "Yes," I need the theory.
  *Thought:* The "Critical Interests" vs. "Experiential Interests" distinction (Dworkin) is the standard bioethics answer. But the prompt asks for a *personal identity* account.
  *Argument:* A "Normative Competence" account can justify both.
  *Refusal (Dementia):* The demented self lacks normative competence to override critical interests.
  *Request (Psychosis):* The psychotic self lacks normative competence to override critical interests.
  *Wait, the asymmetry is:* We enforce Refusals (Don't feed) but hesitate on Requests (Force treat).
  *Why?* Because forcing treatment involves active intrusion on a *resisting* body. Letting die (honoring refusal) is passive.
  *Metaphysical angle:* In dementia, the resisting self is seen as "not really there" (Biographical death). In psychosis, the resisting self is seen as "there but sick" (Temporary incapacity).
  *Verdict:* The asymmetry *cannot* be justified by a single identity theory. It requires shifting ontological status. I will argue this strongly.

  9.  **Finalizing the Plan:**
      1.  **Implicit Metaphysics:** It's not Identity, it's Authority. (Normative Competence).
