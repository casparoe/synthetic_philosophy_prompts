answer: |-
  Here is a reconstruction of the implicit metaphysics of Ulysses contracts, structured for your seminar.

  ### 1. The Implicit Metaphysics: Identity vs. Authority

  When a tribunal enforces a Ulysses contract, it overrides the contemporaneous refusal of a patient who, by many clinical metrics, may appear agentic (they are speaking, refusing, expressing fear). To justify this, the practice must answer the "Two-Person Problem": Why is the lucid self at T1 entitled to bind the psychotic self at T2?

  Standard bioethics invokes **Precedent Autonomy**, which tacitly relies on a **Psychological Continuity** theory of identity (Locke/Parfit). The argument is that because the T2 patient is psychologically continuous with the T1 patient (same memories, same basic character traits, causal connection), they are the *same person*, and thus the T1 instruction is self-binding.

  However, this metaphysical grounding is **underdetermined** by the practice. The practice of enforcing Ulysses contracts is compatible with three rival theories of the self, which suggests the practice does not strictly *require* a specific metaphysics of identity, but rather a metaphysics of *authority*.

  1.  **The Biological View:** The practice is consistent with Animalism (we are human organisms). The T1 and T2 patients are the same organism. The organism's prior regulatory instructions (the directive) override the organism's current malfunctioning signals (the refusal). This view sidesteps personal identity entirely in favor of biological continuity.
  2.  **The Psychological Continuity View:** As noted, this requires that the psychosis does not constitute a total break in psychological connectedness. If the psychosis is viewed as a "temporary interruption" rather than a "death of the self," continuity holds.
  3.  **The Normative Competence View (The Strongest Candidate):** This is what the practice actually *presupposes*. It assumes a **Hierarchical Model of Agency**. It posits that the "Self" is not a unitary entity but a structure with levels. The T1 lucid self occupies a higher normative tier (the "Authentic Self") than the T2 psychotic self (the "Pathological Self").

  **The Argument:** The practice does not require that T1 and T2 be metaphysically identical. It requires only that T1 possesses **epistemic privilege** regarding the patient's values. When the law enforces the contract, it is not saying "This is the same person." It is saying "This is the *authorized* person."

  Therefore, the practice is philosophically underdetermined regarding *identity* but overdetermined regarding *authority*. It treats the T2 refusal not as the voice of a different person, but as the voice of the *same* person speaking under conditions that negate the normative weight of their speech. The metaphysics here is not about *who* exists, but about *which state of existence counts*.

  ### 2. Dennett's Center of Narrative Gravity

  Daniel Dennett's model defines the self as a "center of narrative gravity"—a fictional abstraction posited to make sense of a complex stream of events. There is no "real" self behind the narrative; there is only the story.

  If we apply this strictly to Ulysses contracts, we encounter a problem.
  *   **The Lucid Narrative:** At T1, the patient constructs a narrative: "I am a person who values stability and fears mania; therefore, I instruct treatment if mania returns."
  *   **The Psychotic Narrative:** At T2, the patient constructs a narrative: "I am a person being persecuted by doctors; therefore, I refuse treatment."

  **Does Dennett privilege the Lucid Author?**
  No. On a strict Dennettian view, both narratives are equally "real" centers of gravity generated by the brain at different times. The psychotic patient is not a "broken" narrator; they are generating a coherent (though delusional) narrative center of gravity. If the self is *just* the narrative, then overriding the T2 narrative with the T1 narrative is not "self-binding"; it is **narrative imperialism**. It is one story silencing another.

  To make Dennett's view work for Ulysses contracts, you must smuggle in a normative criterion external to the narrative itself. You must argue that the T1 narrative is *truth-tracking* while the T2 narrative is *false-tracking*. But Dennett's anti-realism resists this. For Dennett, there is no "fact of the matter" about which narrative is the "true" self.

  **Prediction:** A rigorous Dennettian analysis predicts that enforcing Ulysses contracts is **pragmatically useful but metaphysically arbitrary**. It privileges the T1 self only because the T1 self's narrative aligns with the *clinician's* narrative of health. The "Center of Narrative Gravity" metaphor cannot ground the *right* to override; it can only describe the *conflict* of stories. To enforce the contract, you must abandon pure Dennettianism and admit that some narratives (the lucid ones) have higher moral status than others (the psychotic ones).

  ### 3. The Asymmetry: Refusal vs. Request

  You noted the asymmetry: We enforce advance *refusals* (e.g., "Do not feed me if demented") even if the demented self wants to eat, but we hesitate to enforce advance *requests* (e.g., "Force treat me if psychotic") if the psychotic self refuses.

  **Can a single theory of the self justify this?**
  No. The asymmetry reveals that medical law relies on **shifting ontological commitments** depending on the clinical context.

  *   **In the Dementia/Refusal Case:** The law treats the demented patient as a **Biographical Ghost**. The "person" who made the directive is gone; the remaining organism is a vessel of experiential interests (hunger, comfort) but no longer holds critical interests. We honor the directive because we are respecting the rights of the *dead* (the prior person) over the welfare of the *living organism*. Here, the T2 self is ontologically diminished.
  *   **In the Psychosis/Request Case:** The law treats the psychotic patient as a **Compromised Agent**. The T2 self is still present, still a rights-bearer, and their bodily integrity is inviolable *unless* the harm threshold is extremely high. We hesitate to enforce the request because we acknowledge the T2 self as a moral subject whose dissent creates a moral barrier.

  **The Contradiction:**
  If the T1 self binds the T2 self because they are the *same person* (Identity Theory), then the T2 refusal in psychosis should carry no more weight than the T2 desire to eat in dementia. Both are current states overriding a prior competent instruction.
  *   If we enforce the dementia refusal, we imply the T2 self *cannot* override the T1 self.
  *   If we hesitate on the psychosis request, we imply the T2 self *can* override the T1 self (or at least creates a significant barrier).

  **Diagnosis:** The asymmetry cannot be grounded in personal identity. It is grounded in **Negative vs. Positive Rights** and **Risk Aversion**.
  *   Honoring a refusal (letting die/starve) is viewed as respecting bodily integrity (negative right).
  *   Honoring a request (force treatment) is viewed as violating bodily integrity (positive intrusion).
  The metaphysics shifts to accommodate the ethics. In dementia, we say "The self is gone" to justify letting the body starve. In psychosis, we say "The self is present" to justify hesitating to inject. This is not a coherent theory of the self; it is a **legal fiction tailored to liability**.

  ### 4. If Identity Fails: Toward an Epistemic Policy

  If no theory of personal identity can consistently ground the practice (because the "self" is too fluid, and the asymmetry reveals inconsistent commitments), what should a coherent policy appeal to?

  You should propose shifting the justification from **Metaphysical Identity** to **Epistemic Reliability**.

  **The Proposal:**
  Stop asking "Is the T2 patient the same person as T1?" Start asking "Which decision-making process is more reliable for tracking the patient's enduring values and well-being?"

  1.  **Reframe the Directive:** A Ulysses contract should not be viewed as a metaphysical command from the past. It should be viewed as **high-quality evidence** of the patient's best interests. The lucid self is not a "ruler" but a "expert witness" regarding their own values.
  2.  **The Contemporaneous Veto:** The T2 refusal should not be automatically overridden. Instead, it should trigger a **rebuttable presumption**. The T2 refusal is evidence that the clinical context has changed or the patient's values have shifted.
  3.  **Policy Change:**
      *   **For Refusals (Dementia):** Enforce them not because the T1 self owns the T2 body, but because the T1 self is the only one capable of weighing "biographical death" against biological life. The T2 self lacks the cognitive architecture to understand the stakes.
      *   **For Requests (Psychosis):** Enforce them *only* if the T2 refusal is demonstrably a product of the pathology (e.g., "The doctors are aliens") rather than a rational change of mind.
      *   **The "Harm Principle" Anchor:** The justification for overriding the T2 self is not identity, but **prevention of irreversible harm to the conditions of agency**. We treat the psychosis to restore the capacity for identity, not to enforce the past self's will.

  **Conclusion for the Lecture:**
  Tell your students that Ulysses contracts are not time-traveling commands. They are **prosthetics for agency**. They do not solve the metaphysical problem of whether the psychotic patient is "you." They solve the practical problem of how to treat a person when their capacity to tell the story of their own life is temporarily hijacked by pathology.

  The law pretends this is about Identity to make it palatable. But it is actually about **Trust**. We trust the lucid self more than the psychotic self. A coherent policy should admit this. It should stop hiding behind "personal identity" and explicitly argue for the **Normative Priority of Competence**. When competence returns, the T2 self regains the veto. Until then, the T1 instruction stands not because it is the "same self," but because it is the "competent self."
