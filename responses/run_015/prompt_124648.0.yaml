      *   *Section 2: The Ethical Defeaters (The Logic Layer).* Focus on Population Ethics. The "Repugnant Conclusion." If we fill the universe with barely worth-living lives, is that good? Also, the "Non-Identity Problem."
      *   *Section 3: The S-Risk Defeater (The Data Integrity Layer).* This addresses the user's specific question about suffering. If consciousness carries the capacity for suffering, replication replicates suffering. Negative Utilitarians would say this is fatal.
      *   *Section 4: Opportunity Cost (The Resource Allocation Layer).* Spending trillions on Mars might increase risk on Earth (e.g., by delaying climate action or fueling geo-political tension).
      *   *Section 5: Unfalsifiability & Scope Creep.* Address the "backup vs. expansion" point. If it's just a backup, why the massive expansionist rhetoric? If it's expansion, does it become colonialist?
      *   *Conclusion:* Summarize the conditions for the view to hold.

  8.  **Refining the Tone:**
      *   Keep it engineering-adjacent (use terms like "coupling," "latency," "consistency," "attack surface").
