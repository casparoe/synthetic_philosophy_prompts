  *   **Framework B: Autopoietic Functionalism (The "Process" View)**
      *   **Core Rule:** Life is a self-producing network of processes enclosed by a boundary (metabolism + homeostasis). Substrate is irrelevant; organizational closure is key.
      *   **Consistency with Record:** Fits "Mitochondria" (metabolic closure) and "Synthetic Cell" (functional closure). Explains "Viruses" (no autonomous metabolism) and "Software" (no physical boundary/energy exchange).
