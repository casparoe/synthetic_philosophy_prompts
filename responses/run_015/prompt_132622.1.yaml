answer: |-
  # Simulation: "The Zoning Commons"

  **Concept:** A semi-cooperative game where individual rationality leads to collective failure.
  **Players:** 14 Students (6 Towns: Four towns of 2 players, Two towns of 3 players).
  **Time:** 90 Minutes.

  ### I. Materials (Prep Ahead)
  *   **Town Boards (6):** Paper sheets labeled Town A–F.
  *   **Unit Tokens (150):** Poker chips or beads (represent housing units).
  *   **Political Capital Tokens (100):** Different color chips (represent re-election security).
  *   **Zoning Cards (18):** 3 per town (Restrictive, Moderate, Upzone).
  *   **Secret Role Cards (6):** 2 say "Tax Haven" (Value Capture), 4 say "Standard Municipality."
  *   **Regional Goal Card:** Visible to all ("120 Units Required").
  *   **Whiteboard:** To track Regional Unit Count and Round Timer.

  ### II. One-Page Rules (Handout to Students)

  **OBJECTIVE:** Maximize your **Town Score** (Political Capital + Bonus Points).
  **COLLECTIVE GOAL:** The Region must build **120 Units** by end of Round 3. If failed, *all* Town Scores are halved.

  **TURN STRUCTURE (3 Rounds Total):**
  1.  **Deliberate (5 mins):** Town members discuss strategy.
  2.  **Commit (1 min):** Reveal 1 Zoning Card face down.
  3.  **Resolve:** Reveal cards. Add Units to Regional Pool. Adjust Political Capital.

  **ZONING OPTIONS:**
  *   **Restrictive:** 0 Units. **+3 Capital** (Safe, popular).
  *   **Moderate:** 10 Units. **+1 Capital**.
  *   **Upzone:** 20 Units. **-1 Capital** (Unpopular, risky).
  *   **Low-Income Bonus (Optional):** Once per game, play with Upzone. **+5 Units**, **+2 Capital**, but flip a coin. *Heads:* No effect. *Tails:* Lose 3 Capital (NIMBY Protest).

  **SECRET ROLES (Do Not Reveal):**
  *   **Standard:** Score normally.
  *   **Tax Haven (2 Towns):** You build **0 Units** automatically (play Restrictive always). You gain **+1 Capital** for every 20 units built by *other* towns. *If Region fails, you lose everything.*

  **SCORING:**
  *   **Town Score:** Total Political Capital at end.
  *   **Regional Bonus:** If 120 Units met, each player +5 Points.
  *   **Winner:** Highest Individual Town Score (must survive Regional Penalty).

  ### III. 90-Minute Timeline

  **0:00–0:10 | Setup & Briefing**
  *   Divide into 6 towns. Hand out boards, tokens, and **Secret Roles**.
  *   **Instructor Script:** "You are Planning Commissioners. Your constituents want to keep their neighborhood character (Capital), but the Region needs housing (Units). Survive politically, but don't let the region collapse. Go."
  *   *Do not explain the math of the failure state. Let them calculate it.*

  **0:10–0:25 | Round 1 (The Naive Phase)**
  *   Towns deliberate. Most will play Restrictive/Moderate to build Capital buffers.
  *   Reveal. Tally Units. (Likely total: ~40–60 units).
  *   **Instructor Action:** Announce the deficit loudly. "Region is at 50. Need 70 more in 2 rounds."

  **0:25–0:40 | Negotiation Phase**
  *   Allow 5 mins of open "Regional Council" talk. Towns can promise deals.
  *   *Observation:* Tax Haven towns will lie and promise to build. Standard towns will demand others take the hit.
  *   Play Rounds 2 & 3 back-to-back (fast).

  **0:40–0:50 | Final Tally & Reveal**
  *   Count Units. Apply Regional Penalty if <120.
  *   Reveal Secret Roles. Watch the "Tax Haven" towns' scores vs. "Upzoning" towns.

  **0:50–1:30 | The Debrief (The Core Learning)**
  *   **Phase 1: The Autopsy (15 mins)**
      *   "Why did we fail (or barely succeed)?"
      *   "How did it feel to Upzone vs. Restrict?"
      *   "Tax Haven Towns: When did you decide to stop contributing? Standard Towns: How did you feel when you found out?"
  *   **Phase 2: Mapping to Theory (25 mins)**
      *   **The Veto:** Map "Restrictive Card" to local democratic veto power.
      *   **The Externality:** Map "Regional Penalty" to the right-to-housing. One town's safety is another's homelessness.
      *   **The Trap:** Discuss how the rules rewarded local rationality (Capital) over collective need (Units). This is the *structural* problem, not just "bad people."
      *   **The Inequality:** Reveal the Tax Haven mechanic. Discuss how some municipalities are structurally set up to capture value without bearing cost (commercial zoning vs. residential).
  *   **Phase 3: Limitations (10 mins)**
      *   **Instructor Honesty:** "This game assumes you are rational point-maximizers. Real NIMBYism isn't just math; it's fear, racism, and history."
      *   "This game treats land as abstract tokens. It does not simulate the historical redlining or racial covenants that made 'Restrictive' valuable in the first place."
      *   "In reality, the 'Regional Goal' is often enforced by courts, not a scorecard."

  ### IV. Troubleshooting: What Will Break & How to Recover

  **1. The "Holdout" Problem**
  *   **Break:** One town realizes if they build nothing, others *must* build more to save the region. They demand concessions (e.g., "Give us 5 Capital tokens or we play Restrictive").
  *   **Recovery:** Act as the "State Court." Announce a "Mandate Rule": "If any town plays Restrictive in Round 3, they are automatically fined 5 Capital." This simulates state preemption laws breaking the local veto.

  **2. Analysis Paralysis**
  *   **Break:** Students spend 20 mins calculating exact point differentials.
  *   **Recovery:** Enforce hard timers. "You have 60 seconds to lock in your card." This simulates political pressure and imperfect information.

  **3. The "Hero" Collapse**
  *   **Break:** One town tries to save the region by Upzoning every round, loses all Capital, and ends with the lowest score despite saving everyone.
  *   **Recovery:** Use this in debrief. "Is the system broken if the moral actor loses?" This highlights why individual altruism isn't a policy strategy.

  **4. Tax Haven Discovery**
  *   **Break:** If Tax Haven towns are discovered early, other towns may gang up and refuse to build, ensuring collective failure to punish them.
  *   **Recovery:** Allow it. This is a feature, not a bug. It simulates inter-municipal resentment. In debrief, ask: "Did punishing them feel good? Did it solve the housing crisis?"

  ### V. Instructor Notes for the "Discovery" Feel
  *   **Do not** mention the 120-unit goal is mathematically tight until Round 1 ends.
  *   **Do not** explain the Tax Haven mechanic until the very end.
  *   **Do not** offer solutions during play. If they ask "Can we change the rules?", say "That would require State Legislation. You are only Commissioners."
  *   **Key Insight to Elicit:** The students should realize that *even if they all wanted to solve the crisis*, the scoring rules punished those who tried. This mirrors the philosophical tension: Local democracy is designed to protect local interests, which systematically conflicts with regional rights.
