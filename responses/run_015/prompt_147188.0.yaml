answer: |-
  # 1. The precise research question and its stakes

  The central question driving this research is whether the ethical obligations surrounding the renaming of streets differ structurally from those surrounding the removal of statues, specifically due to the functional embeddedness of street names within daily navigational systems. While public discourse often groups these actions under the single banner of "decolonizing space" or "erasing history," this proposal argues that street names operate as a distinct category of commemorative object: inherited navigational speech. Unlike a statue, which serves primarily as a visual monument encountered optionally by passersby, a street name is a practical coordinate required for orientation, logistics, emergency response, and civic administration. This functional necessity binds residents into a network of address that they never chose, forcing them to repeatedly invoke the name of a historical figure simply to exist within the city. The research asks whether this functional embeddedness creates a stronger, weaker, or qualitatively different obligation to rename a street when the honoree is discredited, compared to a statue that serves no practical purpose.

  The stakes of this inquiry are substantial for both political philosophy and urban governance. If street names are merely symbolic, then the arguments for keeping or removing them mirror those for statues: concerns about historical preservation versus concerns about present-day harm. However, if street names are understood as navigational speech, the ethical calculus shifts. A statue can be relocated to a museum, preserving the historical record while removing the honorific presence from public space. A renamed street, by contrast, vanishes from maps, delivery routes, and emergency databases, creating a practical discontinuity that physical removal does not. Conversely, leaving a discredited name in place forces residents to participate in a narrative they may reject every time they give their address. This creates a unique form of non-consensual participation in collective memory.

  Furthermore, the research seeks to determine whether renaming should follow a principle of semantic rupture. Rather than substituting one heroic figure for another, should the replacement mark an explicit discontinuity in the collective narrative? This question probes the limits of intergenerational obligation. Do future residents inherit the narrative burdens of their predecessors when those burdens are encoded into the practical infrastructure of daily life? By isolating the functional dimension of street names, this project aims to move beyond the binary of keep versus remove. It seeks to establish whether the practical necessity of using a street name generates a specific ethical duty to ensure that the name does not inflict narrative harm on those compelled to speak it. The outcome will clarify whether functional embeddedness changes the moral calculus of commemoration, offering a framework for cities to navigate these debates without collapsing distinct types of public memory into a single, unworkable category.

  # 2. Why existing answers and public debates leave the question genuinely open

  Current public debates and existing academic literature largely fail to distinguish between the ethics of renaming streets and the ethics of removing statues. Most discussions collapse all monuments into a single category of "commemorative objects," subject to the same moral tests regarding historical accuracy, present-day harm, or the integrity of the historical record. This conflation overlooks the temporal asymmetry at play in renaming versus removal. A statue is a discrete object; its removal is a singular event that changes the visual landscape but leaves the surrounding infrastructure intact. A street name is a linguistic label embedded in a network; its removal triggers a cascade of changes across maps, databases, and daily speech patterns. Existing frameworks do not account for this functional discontinuity. They treat the name as a symbol rather than as a tool of orientation, ignoring the fact that residents are compelled to use the name regardless of their personal views on the honoree.

  Moreover, the prevailing arguments tend to rely on vague concerns about erasing history or causing offense, neither of which captures the specific burden of navigational speech. The "erase history" argument assumes that removing a name deletes the historical figure from memory, which is empirically false; history is recorded in archives, not just on street signs. The "harm" argument focuses on the psychological impact of seeing a statue, but it does not address the linguistic compulsion of speaking a name. When a resident calls emergency services or orders food, they are not merely observing a monument; they are invoking a label that binds them to a specific geographic and narrative coordinate. Existing ethical frameworks do not adequately explain why this invocation matters. They lack a vocabulary for the obligation created by inherited practical structures that outlive the intentions of their originators.

  Additionally, the debate is often polarized into binary choices: keep the name to preserve history, or remove it to stop harm. This binary ignores the possibility of semantic rupture, where the replacement name itself signals a break in the narrative rather than a continuation of hero worship. Current discussions rarely explore whether the replacement should be another figure or a concept that acknowledges the discontinuity. By failing to distinguish between display objects and navigational labels, existing answers leave the question genuinely open. They do not explain why a street name might feel ethically distinct from a statue, nor do they provide a method for evaluating that distinction. This project seeks to fill that gap by demonstrating that functional embeddedness is not merely a practical inconvenience but a moral variable that changes the nature of the obligation. Without this distinction, cities risk applying the wrong ethical standards to the wrong objects, leading to decisions that neither preserve history nor respect the autonomy of current residents.

  # 3. The conceptual approach, the taxonomy of embeddedness, and why the standard alternatives (historical survey, legal framing) are inadequate for this project

  The proposed approach is conceptual rather than empirical, focusing on constructing a taxonomy of commemorative objects based on their practical embeddedness. This taxonomy will categorize objects into three types: pure display, navigational label, and institutional address. Pure display objects, such as statues in parks, are encountered optionally and serve primarily visual or aesthetic functions. Navigational labels, such as street names, are required for orientation and daily movement; they are spoken and written as part of routine logistics. Institutional addresses, such as the names of government buildings or schools, occupy a middle ground, serving both symbolic and functional roles within specific bureaucratic contexts. By distinguishing these categories, the project can test how standard ethical frameworks apply across them. The central hypothesis is that the ethical weight of a commemorative object increases with its functional embeddedness, because higher embeddedness reduces the ability of individuals to opt out of the narrative.

  This conceptual work will rely on a framework borrowed informally from theories of intergenerational obligation. The core idea is that inherited practical structures can carry narrative burdens that outlive the intentions of their originators. When a street is named, it creates a network of dependency; future residents must use the name to participate in civic life. This creates a form of non-consensual binding that does not exist with statues. The project will examine whether this binding generates a specific duty to ensure the name does not conflict with the fundamental values of the current population. This approach avoids reducing the problem to either pure harm or pure historical preservation. Instead, it treats the street name as a speech act that residents are forced to perform. The ethical question becomes whether it is permissible to compel citizens to perform speech acts that honor discredited figures.

  Standard alternatives, such as historical surveys or legal framings, are inadequate for this project because they miss the conceptual core of the problem. A historical survey would catalog specific renaming campaigns, noting successes and failures, but it would not explain why some cases feel ethically distinct from others. It would provide data without providing a normative framework. Similarly, legal arguments about property rights in public space focus on who has the authority to change a name, not whether they should. Legal frameworks treat street names as municipal assets subject to administrative procedure, ignoring the linguistic and narrative burden placed on residents. These approaches assume that the problem is one of ownership or historical accuracy, whereas this project argues the problem is one of forced participation in a narrative.

  Furthermore, the project will examine the principle of semantic rupture. If a street name is renamed, should the new name substitute one hero for another, or should it mark a break in the tradition of hero worship? This question tests whether the function of the street name is to commemorate individuals or to facilitate orientation. If the latter, then substituting one hero for another perpetuates the problem of binding residents to specific narratives. A successful conceptual framework will explain why semantic rupture might be ethically preferable in cases of high functional embeddedness. By avoiding empirical surveys and legal analysis, the project remains focused on the moral logic of the situation. It seeks to determine whether functional embeddedness genuinely changes the moral calculus, or whether it is merely a practical complication with no ethical significance. This conceptual clarity is necessary before any empirical or legal work can proceed effectively.

  # 4. What a successful result would look like, including the conditions that would count as success versus failure or inconclusiveness

  A successful result for this project would be a robust conceptual framework that demonstrates a systematic difference in ethical obligation between street names and statues based on functional embeddedness. Success means showing that the three ethical frameworks—harm-based, consent-based, and narrative-integrity-based—yield different prescriptions when applied to navigational labels versus display objects. For example, a harm-based framework might suggest removing a statue causes little practical disruption, whereas renaming a street causes logistical harm. However, a consent-based framework might argue that compelling residents to speak a discredited name violates their autonomy more than viewing a statue does. If the project can show that these frameworks diverge predictably across the taxonomy, it will have established that functional embeddedness is a morally relevant variable. This would provide cities with a nuanced tool for decision-making, moving beyond one-size-fits-all policies.

  Specifically, success would involve articulating a clear definition of semantic rupture and demonstrating its applicability to street renaming. If the project can show that replacing a discredited name with another heroic figure fails to address the underlying issue of forced narrative participation, it will have advanced the debate significantly. A successful outcome would also clarify the conditions under which renaming is obligatory versus optional. For instance, if the honoree's actions directly contradict the current civic values, does the functional embeddedness of the street name make renaming more urgent than it would be for a statue? The project should produce a set of criteria that policymakers can use to evaluate specific cases without relying on intuition or political pressure.

  Failure or inconclusiveness would look like a inability to distinguish the ethical stakes of street names from statues. If the analysis shows that functional embeddedness does not change the moral calculus—that the same arguments apply equally to both—then the project's central hypothesis would be falsified. This would still be a valuable result, but it would mean the proposed taxonomy does not carry the ethical weight anticipated. Another form of failure would be if the concept of semantic rupture proves too vague to apply practically. If the project cannot define what constitutes a rupture versus a substitution, it will not offer actionable guidance. Inconclusiveness might also arise if the ethical frameworks themselves are too conflicting to yield a coherent prescription. If harm, consent, and narrative integrity all point in different directions without a way to prioritize them, the project may leave the question open rather than settled.

  Ultimately, the goal is to produce a reasoned argument that functional embeddedness creates a unique ethical category. Success means that readers come away understanding why street names are not just statues with words on them, but rather distinct objects of moral concern. The result should be a set of conceptual tools that allow for more precise ethical reasoning about public space. If the project achieves this, it will have provided a foundation for future empirical or legal work, ensuring that subsequent debates are grounded in a clear understanding of the specific obligations created by navigational speech. The success of the project is measured by its ability to shift the terms of the debate from a binary choice to a structured analysis of function and obligation.

  # 5. Realistic scope for a six-month timeline, the deliverables expected, and an honest assessment of the biggest conceptual risk that could make the project too large

  For a six-month timeline, the scope must be tightly managed to ensure the conceptual work is completed without drifting into empirical case studies. The first month will be dedicated to refining the taxonomy of embeddedness and defining the key terms, such as navigational speech and semantic rupture. The second and third months will focus on applying the three ethical frameworks to the taxonomy, testing how they interact with each category of commemorative object. The fourth month will involve drafting the core argument, focusing on the distinction between street names and statues. The fifth month will be used for revision and stress-testing the argument against potential counterexamples, such as institutional addresses or digital naming systems. The final month will be reserved for polishing the deliverable and preparing it for presentation.

  The expected deliverables include a working paper of approximately four to five thousand words, suitable for an independent study submission or a workshop pitch. This paper will outline the taxonomy, the ethical analysis, and the proposed principle of semantic rupture. Additionally, a shorter summary document will be produced for non-specialist audiences, explaining the practical implications for urban governance. These deliverables will serve as the foundation for potential future research, such as empirical studies of specific renaming campaigns or legal analyses of municipal authority. The goal is to produce a conceptual toolkit that can be applied by others, rather than a definitive history of renaming.

  The biggest conceptual risk is scope creep regarding the definition of functional embeddedness. It is easy to expand the taxonomy to include every type of public label, from building names to park benches to digital map markers. If the project attempts to account for all these variations, it will become too large to complete in six months. The focus must remain strictly on the distinction between street names and statues as the central comparison cases. Another risk is the depth of the ethical frameworks. Engaging too deeply with the philosophical literature on harm, consent, or narrative integrity could turn the project into a general survey of ethics rather than a specific analysis of commemorative objects. The project must use these frameworks as tools, not as subjects of inquiry themselves.

  Finally, there is a risk that the concept of semantic rupture proves too abstract to operationalize. If the project spends too much time defining what constitutes a rupture, it may lose sight of the practical question of renaming. The assessment must remain grounded in the distinction between functional and display objects. By keeping the scope focused on this central comparison, the project can avoid becoming unmanageable. The six-month timeline is realistic only if the work remains conceptual and avoids the temptation to solve every related problem. The goal is to establish the distinction, not to resolve every ethical dilemma that arises from it. This disciplined focus will ensure the project is completed on time and delivers a clear, actionable contribution to the debate.
