prompt: |-
  I've been following the public debates about tearing down statues and renaming streets, but I feel like everyone is talking past one another: some people talk about historical accuracy, others about present-day harm, and nobody seems to distinguish between a statue in a public square and a street name that people use every day to navigate, deliver mail, or call emergency services. I don't have any formal background in philosophy or history — I work in logistics, so I spend a lot of time thinking about addressing systems and how labels bind people into networks they never chose — and that's probably why I keep returning to this problem. I want to write a short research proposal, roughly four to five thousand words, suitable for a six-month independent study or a small interdisciplinary workshop pitch, that asks whether the ethics of renaming streets should be analyzed separately from the ethics of removing statues, precisely because street names operate as what I am calling inherited navigational speech: they are simultaneously commemorative objects and practical coordinates necessary for everyday orientation, which means they bind future residents into a narrative they never consented to join.

  The specific question is whether this functional embeddedness creates a stronger, weaker, or structurally different obligation to rename a street when the honoree is discredited, compared to a statue that serves no practical purpose. Most existing discussion either collapses all monuments into a single category or appeals to vague concerns about erasing history, but neither approach accounts for the temporal asymmetry at play: a statue can be relocated to a museum and still be encountered, whereas a renamed street instantly vanishes from maps, delivery routes, and emergency response databases, so renaming carries a kind of practical discontinuity that physical removal does not. At the same time, leaving a discredited name in place forces residents to repeatedly invoke that figure in their daily speech. Rather than framing the choice as simply keep or remove, I want to examine whether renaming should follow a principle of semantic rupture — that the replacement should not be another heroic figure substituted for the old one, but should instead mark an explicit discontinuity in the collective narrative — and whether standard ethical frameworks (harm-based, consent-based, and narrative-integrity-based) yield systematically different prescriptions when applied to objects that differ in their functional embeddedness.

  My proposed approach is conceptual rather than empirical: I will construct a taxonomy of commemorative objects based on their practical embeddedness — pure display, navigational label, and institutional address — and then test how the three ethical frameworks apply across those categories, using street names and statues as the central comparison cases. I want to avoid the obvious alternatives: I will not produce a historical survey of specific renaming campaigns, and I will not rely on legal arguments about property rights in public space. Instead, I want to see whether a framework borrowed informally from intergenerational obligation — the idea that inherited practical structures can carry narrative burdens that outlive the intentions of their originators — can explain why street names feel ethically distinct without reducing them to either pure harm or pure historical preservation. The deliverable should be a proposal plan, not a finished argument, explaining what conceptual work remains and what kind of reasoning would settle whether functional embeddedness genuinely changes the moral calculus.

  Please organize the response in exactly these sections, in this order, with approximate lengths:
  1. The precise research question and its stakes (about 400 words)
  2. Why existing answers and public debates leave the question genuinely open (about 400 words)
  3. The conceptual approach, the taxonomy of embeddedness, and why the standard alternatives (historical survey, legal framing) are inadequate for this project (about 600 words)
  4. What a successful result would look like, including the conditions that would count as success versus failure or inconclusiveness (about 500 words)
  5. Realistic scope for a six-month timeline, the deliverables expected, and an honest assessment of the biggest conceptual risk that could make the project too large (about 400 words)

  Please do not include a bibliography, a literature review by citation, or requests for specific sources; I will handle citations myself. Write this as a proposal for work not yet done, with the framing, cruxes, and remaining tasks made explicit.
