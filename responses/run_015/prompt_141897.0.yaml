answer: |-
  Subject: Re: Nyāya argument recap

  Hey, sorry to hear the reading group ended in a bit of a standoff, though wine-fuelled debates about epistemology sound like my kind of night. You asked me to go through the passage you reconstructed and tell you where the textbook is on solid ground and where it is leading you astray, so I will walk through it in order and give you my best assessment of what a sympathetic scholar would say, along with how confident I am in each correction and where historical layers matter.

  Starting with the opening claim that Nyāya is the commonsense-realist school and its epistemology is basically Indian foundationalism, the textbook is on safe ground here. This is an acceptable simplification for an introductory level. Nyāya does posit an external world independent of our minds and treats knowledge as grounded in specific causal instruments, so mapping that onto foundationalism is a standard move in comparative philosophy. I am highly confident that any specialist would accept this as a fair heuristic, even if the term foundationalism is obviously Western. Similarly, when the text says knowledge, pramā, is a veridical cognition produced by a trustworthy causal instrument, a pramāṇa, and the Naiyāyikas count four of them, perception, inference, comparison and testimony, this is accurate. The definition of pramā as veridical cognition and the list of four pramāṇas are standard doctrine across most periods of Nyāya, from the early sūtras through the later commentarial traditions. You can trust this part completely.

  Things get shaky when the passage claims that perception is the bare pre-conceptual contact between a sense organ and an object. Here your intuition is correct and the textbook is misleading you. This definition is actually the Buddhist position, specifically from Dignāga and Dharmakīrti, who argued that true perception must be free from conceptual construction. The Nyāya school famously fought against this. While Nyāya does acknowledge an initial indeterminate stage of perception, they insist that determinate perception, which includes concepts and judgement like seeing this is a cow, is also genuine perception and not inference. By saying anything you add by way of concepts or judgement is really inference rather than perception, the textbook is attributing the Buddhist opponent's view to Nyāya. I am highly confident in this correction, as this is one of the most famous debates in Indian epistemology, though I should note that later Navya-Nyāya scholars did refine the mechanics of how concepts relate to perception, the core stance against reducing conceptual perception to inference remains constant.

  You mentioned you would have bought the reduction of testimony to inference a month ago, but on this point the textbook is again misrepresenting the Nyāya position. When the text says testimony is likewise a special case of inference, since you accept what someone tells you only because you've inferred from their track record that they're reliable, it is summarizing an objection that Nyāya explicitly rejects. Nyāya argues that śabda or testimony is an independent source of knowledge because the understanding arises from the meaning of the words themselves, provided the speaker is reliable, not from a separate inference about the speaker's reliability. The reduction of testimony to inference is typically a Buddhist or sometimes Mīmāṃsā move, not Nyāya. The same applies to the claim that comparison is just loose analogical reasoning of the same sort. Nyāya defends upamāna or comparison as a distinct pramāṇa, precisely to avoid reducing it to inference. So on both testimony and comparison, the textbook is simplifying by collapsing the Nyāya list into the Buddhist list of two pramāṇas. I am highly confident here as well, as the independence of śabda and upamāna is a key distinctive feature of Nyāya against the Buddhists.

  The passage gets back on track when it states that Nyāya is distinctive in holding that a cognition's validity is established extrinsically, from outside, rather than being self-certifying the way the Mīmāṃsakas are said to have it. This is an accurate summary of the parataḥ prāmāṇya versus svataḥ prāmāṇya debate. However, the text immediately undermines this accuracy by adding which means each cognition needs another cognition to vouch for it, and that one needs another, so the Naiyāyikas are caught in a vicious regress and can't really claim to know anything. This is where your suspicion that the chapter presents an objection as if it had never been answered is spot on. The regress argument is the standard objection raised by Mīmāṃsakas against Nyāya, but Nyāya has a well-known response. They argue that we do not need to verify every cognition extrinsically; we only seek external validation when there is a specific reason for doubt or a known defect in the causal conditions. In the absence of such defects, cognition is accepted as valid until proven otherwise. By presenting the regress as a conclusion rather than a pūrva-pakṣa or objection that Nyāya answers, the textbook is being unfair. I am highly confident in this assessment, though I should flag that the precise formulation of this response varies between the early bhāṣya layer and the later Navya-Nyāya work, but the basic avoidance of the regress is consistent.

  Finally, regarding your question on whether the chapter's closing claim that the whole system collapses into scepticism actually follows from the parts of the summary that are accurate, the answer is no. The collapse into scepticism only follows if you accept the misrepresentation that every cognition requires active external verification ad infinitum. Since the Nyāya position is that validity is extrinsic but only sought when doubt arises, the regress is blocked and the system does not collapse. The textbook is essentially presenting the Mīmāṃsā critique as the final word without giving Nyāya's reply. So you were right to feel that the text was bending things; specifically, it conflated Nyāya with Buddhists on perception and testimony, and it presented a standard objection to Nyāya as if it were a fatal flaw they never addressed. You should feel comfortable pointing this out next week, though you might want to acknowledge that the textbook is likely trying to keep things simple by contrasting Nyāya realism with Buddhist idealism or Mīmāṃsā ritualism, even if it sacrifices accuracy on the epistemological details. Hope that helps settle the bet with Anand, and let me know how the next session goes.
