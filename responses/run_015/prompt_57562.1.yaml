answer: |-
  Here is the direct feedback you asked for, structured by your four questions.

  ### 1. Does "direction of the default" earn its keep?

  **The Steelman Objection:**
  "Direction of the default" is merely a metaphorical restatement of "social norms regarding leisure." Saying "rest requires justification" is functionally identical to saying "there is social stigma against leaving on time." If the outcome is the same (people stay late), the *mechanism* (burden of proof vs. social pressure) is semantic window-dressing. Furthermore, burden of proof implies a conscious adjudication process. Most overwork isn't a courtroom; it's mindless drift. Your framework assumes actors are constantly weighing justification, when in reality, they are often just habituated.

  **Can you answer it?**
  Yes, but you need to sharpen the distinction between *normative pressure* and *procedural asymmetry*.

  "Social pressure" is diffuse; "burden of proof" is structural. Your argument earns its keep only if you demonstrate that the burden is **institutionalized**, not just cultural.
  *   **In France:** The burden was legal (RTT forms), but the culture didn't match.
  *   **In Japan:** The burden is procedural (you cannot leave until the boss leaves / the meeting ends / the train stops running).
  *   **In the US/UK:** The burden is economic (hourly vs. salary).

  To defeat the "fancy redescription" charge, you must clarify that "direction of the default" predicts **policy failure**. If it were just "culture," then laws wouldn't matter. But you argue laws *fail* when they don't shift the burden. That is a causal claim, not just a descriptive one.
  **Fix:** In Section 4, explicitly state that this framework explains *why* legislation fails. A law that caps hours but leaves the burden of proof on the leaver will be circumvented. A law that shifts the burden (e.g., automatic clock-out) works better. That makes it a tool for analysis, not just a label.

  ### 2. Fact and Glibness Check (Sections 1–3)

  **Weber (Section 1):**
  *   **The Bluff Risk:** You write: "In most of the societies they came out of... leisure was the default for anyone who could afford it." This is aristocratic bias. For the vast majority (peasantry), work was biological necessity, not a choice between leisure and labor. Weber's point wasn't that peasants *chose* leisure, but that the *moral valuation* of labor shifted.
  *   **The Fix:** Clarify that the "default" you mean is **moral**, not practical. For the pre-Protestant elite, leisure was the *telos* (end goal). For the Protestant, labor was the *telos*. Don't imply peasants had a choice they refused.
  *   **Franklin/Time as Debt:** This is accurate to Weber's reading of Franklin. Keep it.

  **France/Aubry (Section 2):**
  *   **The Glibness:** "Whether it created jobs is an empirical question I'm not going to touch." Smart move. However, claiming it "failed in practice" for *cadres* is broadly true but nuanced. The 35-hour week was largely absorbed by productivity gains or "forgetting" to clock off for managers.
  *   **The Fix:** Your point about the RTT feeling "disreputable" is strong. Keep the focus on the *feeling* of the exception, not the macroeconomic success. That aligns with your thesis.

  **Karoshi (Section 3):**
  *   **Fact Check:** 1969 case (Osaka, 29-year-old man in shipping). 1988 hotline (National Defence Council for Victims of Karoshi). Wives calling is well-documented; often the family recognizes the physical decline before the worker admits the risk.
  *   **Accuracy:** This holds up. The structural point (stopping has no standing) is the standard sociological reading of *karoshi*.

  ### 3. Section 3 Ethics: Are dead people props?

  **Blunt Assessment:**
  It borders on exploitative, but doesn't cross the line *yet*. The risk is that you are using *karoshi* (death from overwork) solely as a rhetorical device to cap off a taxonomy of work regimes. It risks turning a visceral human tragedy into a neat philosophical "limit case."

  **How to keep the point without the effect:**
  You avoid exploitation if you emphasize the **structural violence** rather than the mortality statistic.
  *   **Current phrasing:** "Karoshi is what the flipped default looks like when the flip is total." (A bit cold/clinical).
  *   **Suggested tweak:** Anchor it in the inability to speak. The tragedy isn't just that they died; it's that the system removed their agency to justify stopping *while they were alive*.
  *   **Add:** A sentence acknowledging that the "hotline data" represents a failure of the living to intervene. The wives calling highlights that the worker had lost the standing to justify their own rest. That keeps the focus on the *argument* (standing/justification) while respecting the *humanity* (loss of agency).

  ### 4. The Dutch Counterexample

  **Does it kill Section 4?**
  No. It actually validates your theory, provided you analyze it correctly.

  **The Analysis:**
  The Netherlands has high part-time work, but it is not because the "burden of proof" vanished. It shifted.
  *   **The Dutch Model:** In the 90s/00s, the "Polder Model" negotiations explicitly normalized part-time work as a standard contract option, not a concession.
  *   **The Test:** Ask yourself: In Utrecht, if you wanted to work 20 hours, did you have to justify it morally? Or was it a menu option?
  *   **The Complication:** The Dutch model often segregates by gender (women part-time, men full-time), though this is changing. If part-time is the "mother's default," the burden of proof still exists for *men* who want it.

  **How to fold it in:**
  Use the Dutch case to distinguish between **Statutory Default** (France) and **Negotiated Default** (Netherlands).
  *   France tried to legislate the default from the top down (35 hours). It felt like an exception because the culture didn't shift.
  *   The Netherlands shifted the default through collective bargaining norms. It feels less like an exception because the *standing* to choose part-time was granted socially, not just legally.
  *   **Integration:** Add a clause to Section 4: "Reforms that change direction... may do more work than the number suggests." Cite the Dutch consensus model as the success case where the burden of proof was lifted culturally, contrasting it with the French statutory attempt. This shows you aren't ignoring your home context, but using it to refine the mechanism.

  ### Summary Verdict

  The argument holds. "Direction of the default" is a robust analytical tool if you frame it as a **procedural asymmetry** rather than just "vibes."

  **Critical Fixes:**
  1.  **Weber:** Clarify you mean *moral* default, not economic necessity for peasants.
  2.  **Karoshi:** Ensure the focus remains on the *loss of agency to justify rest*, not just the death itself.
  3.  **Dutch:** Don't treat it as a counterexample; treat it as the control group that proves the variable is *cultural standing*, not just law.

  It's a strong piece. It cuts through the usual "work-life balance" fluff. Go present it.
