      *   If it becomes a formal constraint/audit protocol: Yes, it changes regulation (compliance vs. tuning).
      *   Does it bite on Coffee? A reward term says "Don't break vase (cost -10)." An impact measure says "Change state entropy by < X." The impact measure is more generalizable to *unknown* vases. The reward term needs to know about the vase. The impact measure *might* detect the fragility without knowing the value. This is the key differentiator.

  8.  **Synthesizing the Response:**
      *   *Tone:* Direct, analytical, respectful of the funder's sophistication. No fluff.
      *   *Structure:*
