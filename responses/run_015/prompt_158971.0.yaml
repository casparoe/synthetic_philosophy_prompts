  3.  **Evaluate the Four Lines of Work:**

      *   **1. Trustee Baseline (Competent Human):**
          *   *Idea:* Compare agent to what a careful human would do.
          *   *Pros:* Intuitively aligns with "common sense."
          *   *Cons:* Requires defining "competent" and "well-intentioned." This *is* a value specification. If the human breaks the vase, is that okay? If the human ignores the vase, is that okay? It pushes the value problem onto the definition of the human.
          *   *Upstream/Downstream:* Downstream of "what counts as a valid action."
          *   *Tractability:* High for philosophy (ethics of delegation), low for formalization without empirical data.
          *   *Verdict:* High risk of just being "Imitate a human," which has its own alignment problems.

      *   **2. Reversibility/Undo Cost:**
          *   *Idea:* Impact = difficulty to revert.
          *   *Pros:* Physical/Information theoretic basis. Breaking a vase is hard to undo. Moving a chair is easy.
          *   *Cons:* Some things are irreversible but trivial (entropy). Some things are reversible but critical (sending an email). "Undo" implies a goal state to return to.
          *   *Upstream/Downstream:* Upstream. If impact is defined by physical reversibility, you don't need to know *why* it matters, just *that* it's hard to change back.
          *   *Tractability:* High for theory (thermodynamics, information theory).
          *   *Verdict:* Strongest candidate for a "value-free" metric, but might be too coarse.

      *   **3. Stakeholder Scan:**
          *   *Idea:* Only count impact on things that have "stakeholders."
          *   *Pros:* Avoids penalizing moving dust motes.
          *   *Cons:* Defining "stakeholder" is purely normative. Does a vase have a stakeholder (the owner)? Does the air? This is explicitly value-laden.
          *   *Upstream/Downstream:* Downstream of "what matters."
          *   *Tractability:* Low. Requires ontology of moral patients.
          *   *Verdict:* Likely just smuggled values.

      *   **4. Legibility/Auditability:**
          *   *Idea:* The measure must be checkable by an auditor.
          *   *Pros:* Practical for regulation.
          *   *Cons:* Doesn't solve the definition of impact, just the verification.
          *   *Upstream/Downstream:* Downstream. You need to know *what* to audit before you can audit it.
          *   *Tractability:* Medium (epistemology/protocol design).
          *   *Verdict:* Important for deployment, not for the core theoretical question.

