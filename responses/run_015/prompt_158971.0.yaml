      *   *Ranking Logic:* Prioritize upstream, value-agnostic, theoretically tractable work.
      *   *Top:* Reversibility (Physical/Information theoretic).
      *   *Second:* Scalar vs. Constraints (Framing).
      *   *Third:* Trustee Baseline (Delegation ethics).
