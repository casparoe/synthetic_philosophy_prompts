      *   *Concept:* Yes, Schlick distinguishes between *work* (means to an end) and *play* (end in itself). He argues that true happiness/meaning is found in activities that are intrinsically rewarding. He critiques the "purposiveness" of life.
      *   *Nuance:* Schlick wasn't saying "don't work." He was saying that a life *only* of instrumental action is empty. The "play" element needs to be integrated.
