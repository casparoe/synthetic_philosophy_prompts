      *   *Missing:* Normative justification. ML says "we pick this bias because it works on *this* distribution." Philosophy asks "why is *this* distribution the right one to expect?" ML assumes the future resembles the past; Philosophy asks why we are justified in that assumption.

  6.  **Addressing the Three Hard Questions:**

      *   *(1) Projectible vs. No-Drift:*
