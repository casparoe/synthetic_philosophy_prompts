      *   *Core Tension:* Why is one generalization valid and the other not, given identical empirical support?

  3.  **Translate to ML Vocabulary:**
      *   *Data:* Sequence of emerald observations $(x_t, y_t)$.
      *   *Hypothesis Class:* Functions mapping observations to colors. $H = \{h_{green}, h_{grue}\}$.
      *   *Training Set:* Emeralds observed before time $T$.
      *   *Test Set:* Emeralds observed after time $T$.
      *   *Empirical Risk:* Zero for both hypotheses on training data.
      *   *Generalization Error:* Diverges on test data.
      *   *Inductive Bias:* The preference for $h_{green}$ over $h_{grue}$.
      *   *Feature Basis:* How we represent "color" and "time".
      *   *Simplicity/Regularization:* Green is "simpler" in standard basis; Grue is "simpler" in grue/bleen basis.
      *   *Distribution Shift/Drift:* The "grue" hypothesis implies a non-stationary distribution at time $T$.

  4.  **Drafting the Translation (Mental or Scratchpad):**
      *   Hume $\rightarrow$ No Free Lunch Theorem. Without assumptions about the data generating process (DGP), no learner outperforms random guessing on unseen data.
      *   Goodman $\rightarrow$ Feature Engineering/Representation Learning problem. If I define features as `is_green` vs `is_grue`, the complexity changes.
      *   Projectibility $\rightarrow$ Stability/Invariance. A feature is projectible if its relationship to the target holds across train/test splits (specifically temporal splits).

  5.  **Addressing the "Residue Report":**
      *   *Clean:* Hume $\approx$ NFL/Overfitting. Goodman $\approx$ Basis dependence of regularization.
