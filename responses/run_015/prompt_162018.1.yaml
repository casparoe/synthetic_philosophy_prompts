          *   Nuance: "Green" assumes no drift in color mechanism. "Grue" assumes a drift at $T$. So yes, projectibility is largely an assumption of stationarity (no drift) regarding specific features. But it's deeper: it's about *causal* stability vs. spurious correlation.

