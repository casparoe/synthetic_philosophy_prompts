answer: |-
  My friend, you bring me questions that cut to the bone of the Way, and I receive them not as attacks but as the whetstone upon which a gentleman sharpens his understanding. You ask me to reconcile the innate goodness of the heart-mind with the arduous labor of cultivation, and you bring whispers from your own time that suggest our compassion is merely a shadow of survival, a trick of the bloodlines rather than a mandate from Heaven. Let us sit together and untangle this rope, for if we pull on the right end, the knot loosens of its own accord.

  First, consider this claim from your era that compassion is but a misfiring of kinship, a calculation of genetic preservation disguised as virtue. To this I say that you are confusing the root of the body with the root of the heart. It is true that the body seeks to preserve itself and its lineage; this is the concern of the beast and the common man who lives by profit. But when I speak of the sprout of compassion, I speak of a moment that precedes calculation. Think of the child I once described, the infant crawling toward a well. When a man sees this, he feels a shock of alarm and compassion. Does he stop to think, If I save this child, his parents will reward me? Does he calculate, This child shares my blood, so his survival aids my lineage? No. The feeling arises before thought, before benefit, before even the name of the child is known. If this feeling were merely a tool for survival, it would vanish when survival was not at stake, yet we see men lay down their lives for strangers. To say this is genetic bookkeeping is to say that because the mouth hungers for food to sustain the body, the enjoyment of flavor is a lie. The Heaven-endowed nature is not the hunger, but the capacity to distinguish the sweet from the bitter, the right from the wrong. The sprout is real because the feeling is immediate and disinterested, whereas your evolutionary account describes a delayed calculation of benefit which the heart-mind of the sage has already transcended.

  Now you press me on the second point, which troubles many who study my words. If the nature is good like water flowing downward, why does it require the dykes and channels of ritual to reach the sea? You mention those who say ritual constructs a second nature, as if we were bending crooked wood into shape by force and heat. This is the error of those who claim human nature is evil or blank. They see the mature virtue and assume it must be built from nothing because they look at the neglected man and see only weeds. But consider the barley. If you plant barley seeds in the earth, cover them, and the rain falls, they will sprout. This is the nature of the seed. Yet if you do not weed the field, if you do not irrigate during drought, if you do not protect the shoot from trampling oxen, the barley will not mature. Does the need for the farmer's labor mean the barley did not have the nature to grow? Does it mean the harvest is artificial, a construct of the farmer rather than the seed? No. The labor of the farmer is not to create the grain, but to remove the obstacles that prevent the grain from fulfilling itself.

  So it is with the heart-mind. The four sprouts are there, but they are fragile. They are like the trees on Ox Mountain, which were once lush but were chopped down by axes and grazed by cattle until they appeared barren. When people see them barren, they say the mountain never had timber. This is not the nature of the mountain. The ritual training you speak of, which sounds so artificial to you, is not a cage imposed upon the heart. It is the trellis for the vine. Without the trellis, the vine drags in the mud and rots. With the trellis, it climbs toward the sun. The shape of the trellis may seem fixed, but it is designed to match the climbing tendency of the plant. When I speak of extending the sprouts, I do not mean stretching something short until it breaks. I mean taking the feeling of compassion you have for your own family and allowing it to flow into the wider world, removing the selfish blockages that stop its flow. Ritual is not a suppression of desire, but the refinement of it, so that what you desire aligns with what is right.

  You worry that this reliance on cultivation makes my view indistinguishable from those who say we must build virtue from scratch. But the difference is in the direction of the effort. The one who believes nature is evil pushes against the grain, forcing the wood to straighten. I work with the grain, clearing the stones so the water can flow. If virtue were constructed entirely from without, a man could be made virtuous by force alone, like molding clay. But you know this is false. You can force a man to bow, but you cannot force him to feel respect. You can force him to give money, but you cannot force him to feel compassion. The external action without the internal sprout is empty performance. The ritual learning you describe is only effective because it resonates with something already sleeping within the heart. It wakes the sleeper; it does not create a new person.

  Therefore, do not be misled by those who say our morality is a byproduct of survival or a construct of society. Survival explains why the body exists, but not why the heart feels pain at the suffering of another. Society provides the context, but not the source. The source is Heaven, and it is within you. The work is hard, yes. The water tends downward, but if you splash it, it can be made to rise over your forehead. This does not mean water does not tend downward; it means external forces can obscure the nature. The gentleman understands that the labor of cultivation is not a confession of evil nature, but a reverence for the preciousness of the sprout. He weeds his heart so that what is innate may become what is actual. If you trust the sprout, you will not fear the work, for you will know you are not building a house on sand, but tending a garden that Heaven itself has planted.
