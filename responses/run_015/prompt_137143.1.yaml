answer: |-
  Look, I have spent enough time in seminar rooms watching people talk past each other about Harsanyi to know that what you are asking for is not just a theorem but a confession of what we actually believe when the math runs out. You want the spec for an adequate aggregation theorem, and the first thing to say is that the vNM framework itself is the only thing close to settled here. It is settled among people who work in this specific niche that if you want the social planner to have vNM preferences and the individuals have vNM preferences, and you want the Pareto principle to hold, then Harsanyi is right that social utility is a weighted sum of individual utilities. That part is mathematically locked down. The live disputes begin the moment you ask where those weights come from and whether that sum is the end of the story. An adequate theorem needs to deliver a ranking that is coherent across lotteries, obviously, but more importantly it needs to be honest about the normative inputs. My view is that leaving the weights as free parameters is the only honest approach. Any theorem that claims to derive the weights purely from rationality constraints or the veil of ignorance without smuggling in a substantive ethical premise about equality or entitlement is selling you something broken. The veil of ignorance is just a heuristic for generating weights, not a derivation of them, and pretending otherwise is where most of the confusion starts.

  On the question of interpersonal comparisons, avoiding them is an evasion, not a virtue. It is a live dispute in the broader literature whether we can make them, but within the context of a planner ranking social prospects, refusing to make them renders the problem unsolvable. If you cannot compare the utility loss of one person against the gain of another, you cannot rank any lottery that involves trade-offs, which is most of them. So an adequate theorem must assume comparability, at least up to a common scale, and stop pretending that ordinalism saves us from normative judgment. Regarding invariance to rescaling, that is non-negotiable but only because it is built into the vNM setup. If you change the zero point or the unit of an individual's utility function, the social ranking should not change provided the weights adjust accordingly. That is just consistency. The real friction comes from whether the ranking must come out the same whether you evaluate from behind the veil or after it lifts. This is the ex ante versus ex post debate, and it is very much live. There is no consensus that these must align. In fact, insisting they align is what forces you into utilitarianism and kills any concern for fairness in the distribution of outcomes. You can have ex ante respect for preferences or ex post fairness, but demanding both is where the impossibility results live.

  Now, about variable populations. You asked if the theorem must cope with populations that aren't fixed. My view is that you should treat this as a separate problem. Mixing fixed-population aggregation with variable-population ethics is a category error that leads to the repugnant conclusion and other paradoxes. An adequate theorem for the setup you described, which starts with a fixed set of people, should not be required to solve population ethics. If you force it to handle uncertain existence, you break the vNM structure because the set of agents is no longer fixed, and the Pareto principle becomes ill-defined. So I would count that as a desideratum for a different theorem, not this one.

  This brings me to your person-splitting neutrality requirement, and I need to be blunt because this is where people get confused. You ask if replacing one person with two identical people each getting half the utility should leave the social ranking unchanged, and whether this is a real constraint or smuggled egalitarianism. It is not egalitarianism smuggled in; it is total utilitarianism smuggled in. If you demand that the ranking does not budge when a person is split into two halves, you are mathematically forcing the social welfare function to be linear in utility. Any view that applies a concave transformation to utility, like prioritarianism or any view that cares about the distribution of welfare itself, will violate this condition because the sum of the transformed halves will exceed the transformed whole. By demanding neutrality here, you are ruling out any view that values equality or priority. So it is not a neutral coherence constraint like independence of irrelevant alternatives; it is a substantive ethical commitment to the claim that moral value aggregates linearly. If you accept it, you have already decided in favor of total utilitarianism. If you think moral weight attaches to heads rather than utility mass, you should reject it. I would argue it is not a genuine desideratum for a general aggregation theorem because it prejudges the ethical outcome.

  The impossibility result you are looking for, the one that knocks out the most candidates, is the conflict between ex ante Pareto and ex post equity. It is settled that you cannot have a social welfare function that satisfies the vNM axioms, respects ex ante Pareto (if everyone prefers lottery A to B, society does too), and also satisfies a reasonable condition of ex post equity (society prefers a certain equal distribution over a risky unequal one with the same expected total utility). This is the Diamond critique of Harsanyi. The single desideratum that does the most work in knocking candidates out is the demand for ex post equity. If you keep ex ante Pareto and vNM rationality, you get Harsanyi utilitarianism and you lose equity. If you keep equity and vNM rationality, you must violate ex ante Pareto, meaning you sometimes override unanimous individual preferences about risk. There is no way around this triad. You have to drop one. Most decision theorists drop ex post equity because it violates the vNM structure for society, but political philosophers often drop ex ante Pareto because it ignores fairness. An adequate theorem must tell you which one it is sacrificing.

  Scoring the contenders briefly, standard Harsanyi utilitarianism scores highest on consistency and ex ante efficiency but fails completely on ex post fairness and is vulnerable to your person-splitting constraint only if you view linearity as a bug. Prioritarianism scores well on ex post fairness and handles risk aversion morally, but it violates ex ante Pareto and your person-splitting neutrality. Egalitarianism of condition scores well on fairness but is notoriously difficult to formulate coherently under uncertainty without violating stochastic dominance. If I had to place a bet, I would say the most defensible position is to accept Harsanyi's linear aggregation but acknowledge that the weights are normative parameters that should be set to reflect our best judgment of equality, rather than pretending the math forces them to be equal. But you must accept that doing so means you are choosing ex ante efficiency over ex post fairness, and that person-splitting neutrality is not a test of coherence but a test of whether you are a utilitarian.
