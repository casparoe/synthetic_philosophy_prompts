prompt: |-
  You're the kind of decision theorist who's spent too many years hanging around social choice people — that's who I want answering this. Brainstorm a bit before you write anything down, and take it seriously rather than giving me the pat version.

  Setup so we're on the same page: a planner ranks lotteries over outcomes for a fixed set of people; each person has vNM preferences over the lotteries and the social ranking satisfies the expected utility axioms too; Harsanyi's aggregation theorem says that once you add a Pareto-style indifference condition, social utility has to be a weighted sum of individual utilities, and there's the other version where you imagine an equal chance of turning out to be anyone and the weights come out equal-ish, or whatever prior you feed in. That's the neighbourhood.

  What I actually want is the spec, not the survey: what would a theorem here have to deliver before you'd say, right, that's an adequate answer to how a planner should rank risky social prospects — with the case or the worry behind each requirement, and, more importantly, your view on which of the things people standardly demand are genuine desiderata and which are just the prejudices of one camp. I mean things like: do the weights have to be derived from something or is leaving them as free parameters acceptable; is managing without interpersonal comparisons a virtue or an evasion; is invariance to each person's utility being rescaled separately non-negotiable or a regularity nobody really needs; must the ranking come out the same whether you evaluate from behind the veil or after it lifts; does it have to cope with populations that aren't fixed, where who exists is itself uncertain.

  Two things I especially want fought over. First, a requirement of my own that I can't tell is legit: call it person-splitting neutrality — if you replace one person with two people who have the same utility function and care about the same things, each getting half of what the original would have got, the social ranking shouldn't budge. Is that a real constraint on aggregation or just egalitarianism smuggled in the back door? Second, tell me which subset of the requirements can't all be had at once, since if the list is jointly unsatisfiable that's the result I care about most, and say which single desideratum does the most work in knocking candidates out.

  A paragraph at the end briefly scoring the main contenders is fine, but keep the weight on the criteria. Two rules: write it as continuous prose, no headings, bullets, bold or tables, more like an email to a colleague than a handout; and be explicit about which of your claims are settled among people who actually work on this and which are live disputes, and don't hand me a contested position dressed up as the consensus. No citations or further reading, I can't get at any of it from here anyway.
