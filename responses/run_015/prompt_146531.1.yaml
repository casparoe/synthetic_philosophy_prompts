answer: |-
  You are grappling with what historians call the "problem of silence" and what ethicists call the "problem of representation." Your current rules (invent into silence, not against record; invent interiority, not facts) are a good start, but they fail because they treat the archive as a neutral boundary rather than a power structure. Your verdicts reveal a more sophisticated, unstated ethic: you are balancing **evidentiary integrity** against **human restoration**, weighted by **potential harm**.

  There is no single sentence that captures this, but there is a coherent framework. I propose you adopt **The Principle of Ethical Asymmetry**.

  This principle states that your liberty to invent is inversely proportional to the subject's footprint in the historical record and directly proportional to the risk of harm to the living. You have more license to restore the silenced than to embellish the recorded, and more license to imagine the dead than the remembered.

  Here is the principle stated precisely, clause by clause, with the case that motivates it.

  ### The Principle of Ethical Asymmetry

  **Clause 1: The Integrity of the Public Record.**
  You may not invent factual events that contradict, explain away, or fill gaps in the administrative or public record for identified historical actors.
  *   **Motivating Case:** **Case 2** (The MP's bribe).
  *   **Reasoning:** Public acts (votes, payments, laws) constitute the shared skeleton of history. To falsify them is to corrupt the common knowledge base. This also covers **Case 6** (The unburned letter); inventing a reason for evidence *surviving* falsifies the provenance of the archive itself, which is a meta-factual error graver than inventing a breakfast habit.

  **Clause 2: The Trajectory of the Known Life.**
  You may invent interiority for identified actors only where the archive is silent, provided the invention does not contradict the established psychological or biographical trajectory of their known life.
  *   **Motivating Case:** **Case 4** (The real woman's childhood).
  *   **Reasoning:** Even if the childhood is unrecorded, a life is a coherent whole. Inventing a violent father for a woman whose adult letters show specific resilience or trauma may contradict the *spirit* of the record, even if it doesn't contradict the *facts*. **Case 1** (The MP's vote) passes because motive is rarely recorded; **Case 4** fails because childhood shapes the adult voice you *do* possess.

  **Clause 3: The Restoration of the Silenced.**
  You are permitted, and perhaps obligated, to invent full interior lives for those reduced to data points in the archive (the poor, the enslaved, the marginalized), provided you do not attribute the specific recorded words of *other* real people to them.
  *   **Motivating Case:** **Case 10** (The people sold with cargo) and **Case 3** (The housemaid).
  *   **Reasoning:** The archive dehumanized them; the novel may rehumanize them. This overrides your friend's objection in **Case 10**, but with a caveat (see below). However, **Case 5** (The memoir words) draws a line: you may give real words to an invented character (collage), but not to another real character (theft of agency).

  **Clause 4: The Harm to the Living.**
  You may not invent shameful or damaging acts for identifiable persons if living descendants or a community memory exist that could be harmed by the fabrication.
  *   **Motivating Case:** **Case 9** (Shameful act/living relatives) and **Case 12** (The man who died in 1971).
  *   **Reasoning:** Ethics supersedes aesthetics. The "right to reputation" extends beyond the grave when memory is still active. Time creates a buffer; 1832 is safe, 1971 is not.

  **Clause 5: The Reader Contract.**
  You may not present invented material as archival evidence without signaling the fictionality to the reader.
  *   **Motivating Case:** **Case 7** (The fake diary shelfmark).
  *   **Reasoning:** Historical fiction relies on a pact: the reader knows the story is imagined, but trusts the context is real. Blurring this line (fake shelfmarks) breaks trust. Presenting the diary *as fiction within the fiction* maintains the pact.

  ***

  ### Evaluation of Your Verdicts

  This principle accommodates **10 of your 12 verdicts** directly. It requires you to reconsider **two**.

  **1. The Verdict to Overturn: Case 10 (The People Sold with Cargo).**
  *   **Your Verdict:** Fine.
  *   **Friend's Verdict:** Not Fine (it repeats the violence of the archive).
  *   **My Recommendation:** **Fine, with a condition.** Your instinct is correct (Clause 3: Restoration of the Silenced), but your friend identifies a real risk. If you invent a life for an enslaved person without acknowledging the invention, you risk "ventriloquizing" the subaltern.
  *   **Adjustment:** Do not leave the gap (Case 11), but do not pretend the filled gap is fact. Use an Author's Note or a narrative frame to acknowledge that these names are restorations, not recoveries. You are giving them a life the archive denied, but you must admit *you* are the giver.

  **2. The Verdict to Clarify: Case 6 (The Unburned Letter).**
  *   **Your Verdict:** Not Fine.
  *   **My Recommendation:** **Uphold, but refine the reasoning.** It is not fine not because it is an invention about a real person (porridge was fine), but because it is an invention about the *archive itself*. It changes the reader's understanding of why history knows what it knows. This is a violation of Clause 1 (Integrity of the Record), not Clause 2.

  ***

  ### Predictions for Unsettled Cases

  Here is how the Principle of Ethical Asymmetry predicts you should handle the cases you have not yet settled.

  **1. A novel narrated by an invented archivist who presents fabricated documents as real inside the fiction.**
  *   **Verdict:** **Not Fine** (if unmarked).
  *   **Reasoning:** Violates Clause 5 (The Reader Contract). If the book is marketed as historical fiction, the reader expects the *context* to be real, even if the dialogue is imagined. Fabricating documents *within the text* without signaling they are fabricated (e.g., via a note or a clear narrative frame) invites the reader to treat your inventions as historical data. If you must do this, the "archivist" must be clearly framed as an unreliable narrator within a fictional construct, not a guide to the real past.

  **2. Depicting a documented atrocity through invented witnesses.**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** Aligns with Clause 3 (Restoration of the Silenced). Atrocities are often recorded by perpetrators or high-level observers. The victims' experiences are frequently silent. Inventing witnesses to ground the emotional reality of a documented event is a service to the truth of the event, provided you do not invent specific victims who are otherwise documented (which would violate Clause 2).

  **3. Inventing interiority for a real person who left an enormous archive vs. almost none.**
  *   **Verdict:** **Enormous Archive = Constrained; Almost None = Licensed.**
  *   **Reasoning:** This is the core of Clause 2 (Trajectory of the Known Life). The denser the record, the narrower the channel for invention. If a person wrote 1,000 letters, their voice is known; inventing a contradictory inner monologue is falsification. If they left one signature, their interiority is a void; inventing it is restoration. The density of the record does not license you; it constrains you.

  **4. One invented character made to stand for an entire unrecorded class.**
  *   **Verdict:** **Fine, but risky.**
  *   **Reasoning:** This is a standard novelistic tool (synecdoche). Clause 3 permits it. However, be wary of "representative burden." If this character is the *only* representation of that class, they become a stereotype. It is ethically safer to invent three distinct characters than one "representative" figure, to avoid implying the class was monolithic.

  **5. Does the genre's contract matter? (Historical Novel vs. Roman à Clef vs. Documentary Fiction).**
  *   **Verdict:** **Yes, absolutely.**
  *   **Reasoning:** Your verdicts are already tracking this (see Case 7).
      *   **Historical Novel:** The reader expects the *world* to be real and the *people* to be approximated. Clauses 1–5 apply as written.
      *   **Documentary Fiction:** The reader expects a higher fidelity to the record. Clause 1 becomes stricter; Clause 3 becomes harder to justify without notes.
      *   **Roman à Clef:** The reader expects real people under thin disguises. Clause 4 (Harm to the Living) becomes the dominant constraint.
      *   **Prediction:** If you shift toward "Documentary Fiction," you must be more transparent about inventions (like Case 7's note). If you stay in "Historical Fiction," your current level of invention is permissible, provided you respect the asymmetry between the powerful (recorded) and the powerless (silent).

  ### Final Thought

  Your unease in **Case 11** (The Novel of Refusals) is the most important signal you have received. You sensed that refusing to invent can be "a way of keeping my hands clean while the book stays about the people the archive happened to like."

  The Principle of Ethical Asymmetry validates this. Silence is not neutral; it is a product of power. To refuse to invent into the silence of the poor is to accept the archive's judgment that they do not matter. Therefore, invention is not just a permission; for the silenced, it is an **obligation**. For the recorded, it is a **restriction**.

  Your job is not to keep your hands clean. It is to ensure that when your hands are dirty with invention, the stain comes from restoring life, not erasing truth.
