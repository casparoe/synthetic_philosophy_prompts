answer: |-
  Dear Colleagues,

  The paradox of phenomenal judgment presents the most significant threat to the viability of epiphenomenalism, and given your three-year funding window, your group must prioritize conceptual issues based on their logical dependency rather than their historical prominence. The strategic goal is to identify the upstream assumptions that, if resolved, render downstream problems tractable or obsolete. The most critical upstream issue is the question of whether mental content must be causally mediated to be known or referenced. The paradox rests heavily on a causal theory of knowledge, which dictates that for a subject to know about a phenomenon, that phenomenon must play a causal role in generating the belief or report. If your group can successfully articulate a model of acquaintance or reference that does not rely on causal transmission, the paradox dissolves immediately without requiring modifications to metaphysics or epistemology elsewhere. This line of work is highly tractable for philosophers working without empirical laboratories because it relies on conceptual analysis of the knowledge relation rather than data about neural processing. A conceptual breakthrough here would involve demonstrating that direct acquaintance with phenomenal states provides a justification for belief that is immune to the causal constraint, perhaps by showing that the presence of the experience constitutes the knowledge rather than causing it. You should demote this line of work only if it becomes evident that all non-causal accounts of reference inevitably collapse into incoherence or fail to distinguish between veridical judgment and mere guessing. Until that is proven, this remains the highest leverage point because success here collapses the need for the other strategies.

  Should the first line of inquiry fail to fully dissolve the paradox, the second priority must be to examine the demands of first-person authority. This is downstream of the causal mediation issue because it assumes that some epistemic constraint exists but asks whether that constraint can be weakened enough to accommodate epiphenomenalism. You would be investigating whether subjects can possess accurate judgments about consciousness that do not meet the standard criteria for knowledge yet still suffice for the intuitive sense of authority we claim over our minds. This is moderately tractable as armchair philosophy, though it risks conflating epistemology with psychology. A breakthrough justifying the demotion of this strategy would be a proof that weakening authority to this degree renders the concept of judgment meaningless, thereby making the epiphenomenalist account of reporting unintelligible. However, if you can establish that a non-causal correlation between experience and report is sufficient for a deflated notion of authority, you preserve the view without needing to explain why evolution selected for such a system, which leads to the third priority.

  The third priority involves treating phenomenal self-reference as an evolutionary spandrel that tracks experience without being caused by it. This is significantly downstream because it addresses the explanatory burden of why the correlation exists rather than whether it is possible. This line of work is less tractable for pure philosophers because it requires engaging with evolutionary theory and cognitive science concepts, even if only conceptually. You should pursue this only if the epistemic routes are blocked, as it serves to make the view plausible rather than coherent. A conceptual breakthrough that would justify demoting this work is the demonstration that tracking without causation is metaphysically impossible, not just epistemically dubious. If the first two steps secure the possibility of non-causal knowledge or judgment, the spandrel story becomes a secondary narrative task rather than a foundational repair. It is crucial to note that failing to provide a robust evolutionary story does not refute epiphenomenalism, whereas failing to secure reference does.

  The final option, reconceptualizing the causal closure of the physical domain, should be treated as a contingency plan rather than a primary research strand. Pursuing this effectively amounts to abandoning strict epiphenomenalism in favor of interactionism or non-reductive physicalism. While this resolves the paradox by restoring causal power to the mental, it introduces new problems regarding conservation laws and overdetermination that may exceed your group's mandate. This is the least tractable option for a group dedicated to solving the paradox within the epiphenomenalist framework, as it requires overturning a central tenet of the view itself. You should only elevate this priority if the preceding three lines of inquiry conclusively demonstrate that epiphenomenalism is internally incoherent. A breakthrough here would be a novel model of causation that allows mental events to influence physical outcomes without violating physical conservation laws, but given the constraints, this is a fallback position rather than a strategic lead.

  Throughout this agenda, you must distinguish sharply between implications that threaten the coherence of epiphenomenalism and those that are merely counterintuitive. The genuine threat to coherence lies in the impossibility of reference and knowledge. If the view entails that subjects cannot refer to their own experiences or form true beliefs about them, the view is self-refuting because the epiphenomenalist cannot coherently state the theory. This is the hard limit. In contrast, many implications frequently cited as refutations are merely counterintuitive and can be absorbed without abandoning the view. For instance, the idea that consciousness is an evolutionary waste of energy is counterintuitive but not incoherent; nature is replete with spandrels and non-adaptive traits. Similarly, the claim that epiphenomenalism makes communication about consciousness impossible is often overstated. Communication involves physical signals, which epiphenomenalism allows to be caused by physical states; the fact that the qualia themselves do not cause the signals is weird, but it does not prevent the signals from correlating with the qualia via a common physical cause. Another overstated objection is that epiphenomenalism renders moral responsibility impossible. While it complicates the picture, it does not necessarily dissolve agency if the physical processes associated with decision-making remain intact. Your group should avoid spending precious time defending the view against these counterintuitive charges unless they are being used as proxies for the deeper coherence problem. Focus your energy on the conditions of possibility for judgment and reference, as these are the only issues that can truly function as a reductio. By securing the epistemic link first, you simplify the metaphysical and evolutionary discussions that follow, ensuring that your three-year agenda targets the root of the paradox rather than its branches.
