prompt: |-
  I'm on my university's student union allocations committee — we move about $40m a year out of a "student life fund" and every spring we have the same four-hour fight about splitting it between mental health services, subsidised housing, direct cash transfers to students, and just leaving it in the endowment. A friend of mine who works on DAO governance stuff keeps telling us to stop arguing and run it futarchy-style: we argue once about what "student flourishing" even means and fix it as a number, then let prediction markets tell us which allocation makes that number highest. I've got the general shape of the vote-on-values-bet-on-beliefs setup and I don't want another explainer of it. What I want is the spec: what would such a procedure actually have to get right before I'd let real money ride on it, given that our purpose is boringly practical — a decision procedure we could actually operate next spring, on real allocations, with no legal exposure, not an ideal yardstick for thinking about governance.

  So: give me the desiderata list, each one with the concrete case behind it rather than just the label. Here's the material you should build the cases out of, since these are the things that keep me up. (1) Our only usable welfare metric is a "student flourishing index" built from a survey run five years later by the university's own institutional research office, which has its own incentives and which has already revised the index methodology twice. (2) The decision isn't binary — there's a knob for how much of the pot to spend at all, so conditional markets would have to be opened on a continuum of values and we can only discretise. (3) The likely traders are students, who are also the people whose survey answers constitute the metric, and at least one of them will be a landlord or a counselling-service vendor with a big side stake in the outcome; our market will be thin, maybe thirty serious participants, and possibly one genuinely informed one. (4) Whatever we adopt is the only branch that gets observed — the market conditional on the option we reject never resolves, so I don't see how the thing settles at all, and I want you to take that seriously rather than hand-wave it. (5) We probably can't run real-money markets under university rules, so it'd be play money or a small prize pool, and I genuinely don't know whether "the stakes have to be real" is a real requirement or a prejudice of the economics camp. (6) We can randomise: the housing pilot could be run in half the halls of residence and not the others, so for some of these questions we could get an actual counterfactual instead of a prediction about one.

  For each requirement, tell me why it's on the list and whether it's non-negotiable for our purpose or a preference of one faction (the mechanism-design people, the democrats, the anti-Goodhart people). Then the part I most want: which subsets of the desiderata can't be satisfied together — I'd bet "settles to a definite result" and "tracks the genuine causal effect of the policy" are already in tension, and I suspect "metric we actually care about" and "metric traders can't influence" are too, but you tell me. And tell me which single requirement does the most work in excluding designs. Keep the weight on the criteria and their cases; a short scorecard at the end — a straight student-body vote, an expert committee, a real-money conditional market, a play-money version, and just running the randomised pilot — is enough, five or six lines, I don't need prose.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university student union allocations committee ($40m budget).
      *   **Problem:** Annual 4-hour fight over allocation (mental health, housing, cash, endowment).
      *   **Proposal:** Friend suggests Futarchy (vote on values, bet on beliefs).
      *   **Constraint:** Needs a *spec* for a practical procedure next spring, not theory. No legal exposure.
      *   **Input Material:** Six specific pain points/contextual facts (Survey metric lag/manipulation, Continuous decision space, Thin/Conflicted Market, Counterfactual Problem, Play vs. Real Money, Randomization capability).
      *   **Output Requirements:**
          1.  Desiderata list (Concrete case behind each, Why it's there, Non-negotiable vs. Factional).
          2.  Incompatibilities/Trade-offs (Which subsets can't be satisfied together).
          3.  Single most exclusionary requirement.
          4.  Short scorecard (5 options, 5-6 lines each).
      *   **Tone:** Practical, rigorous, skeptical, specific to the provided context. No generic futarchy explainers.

  2.  **Deconstruct the Input Material into Desiderata:**
      *   *Input 1 (Metric Lag/Manipulation):* The "Student Flourishing Index" (SFI) is lagged (5 years), mutable (methodology changes), and controlled by Institutional Research (IR).
          *   *Desideratum:* **Metric Integrity & Alignment.** The market must resolve on a metric that actually reflects welfare and isn't gameable by the traders or the measurers.
      *   *Input 2 (Continuous Decision):* It's not Yes/No, it's "How much?". Discretization is needed.
          *   *Desideratum:* **Decision Space Granularity.** The mechanism must handle continuous allocation knobs without creating arbitrage loopholes or paralysis.
      *   *Input 3 (Thin/Conflicted Market):* Traders = Students = Metric Sources. Conflicts of interest (landlords/vendors). Thin liquidity (30 people).
          *   *Desideratum:* **Market Independence & Liquidity.** Traders shouldn't be able to manipulate the outcome metric, and there must be enough capital/info to price correctly.
      *   *Input 4 (Counterfactual Problem):* Only one path is taken. Rejected options don't resolve.
          *   *Desideratum:* **Counterfactual Resolution.** The system needs a way to know what *would* have happened to validate the market's prediction.
      *   *Input 5 (Play vs. Real Money):* University rules likely ban real gambling.
          *   *Desideratum:* **Incentive Compatibility.** The stakes must be high enough to induce truth-telling but legal/compliant.
      *   *Input 6 (Randomization):* Can run pilots in half the halls.
          *   *Desideratum:* **Empirical Ground Truth.** Ability to validate predictions against real data to calibrate the market.

  3.  **Drafting the Desiderata (Iterative Refinement):**
      *   *Refinement on 1:* Call it "Metric Stability." If IR changes the formula in Year 3, the market is void.
      *   *Refinement on 3:* Call it "Conflict Insulation." If a landlord trades on housing, they might try to influence the survey.
      *   *Refinement on 4:* This is the classic futarchy killer. Call it "Resolution Certainty."
      *   *Refinement on 5:* Call it "Stake Sufficiency." Play money often leads to noise.
      *   *Refinement on 6:* Call it "Causal Verifiability."

      *   *Categorization:* Which are non-negotiable?
          *   Metric Stability: Non-negotiable (otherwise the contract is void).
          *   Resolution Certainty: Non-negotiable (otherwise no payout).
          *   Stake Sufficiency: Factional (Economists say yes, Democrats say play money is fine for consultation).
          *   Conflict Insulation: Non-negotiable (Legal/Fiduciary risk).

  4.  **Analyzing Incompatibilities (The "Trilemma" aspect):**
      *   *Tension 1:* **Resolution Certainty vs. Causal Verifiability.** To know the causal effect (Input 6), you need randomization (A/B testing). But to get a definite result for the *whole* budget (Input 2/4), you usually pick one policy. If you randomize, you don't get a single "Flourishing Index" for the whole student body to resolve the market easily, you get a mixed index. If you pick one policy to resolve the market, you lose the counterfactual data (Input 4).
      *   *Tension 2:* **Metric Alignment vs. Conflict Insulation.** The metric *must* be based on student surveys (Input 1). The traders *are* students (Input 3). Therefore, traders can manipulate the metric they are betting on. You can't have a metric traders care about *and* traders who can't influence it, unless you exclude students from trading (which defeats the "local knowledge" argument).
      *   *Tension 3:* **Stake Sufficiency vs. Legal Compliance.** Real money solves incentive problems but violates university rules (Input 5). Play money satisfies rules but fails incentive compatibility.

  5.  **Identifying the "Most Exclusionary" Requirement:**
      *   It's **Resolution Certainty (The Counterfactual Problem)**. Futarchy *requires* the rejected option to resolve to validate the market. If you only implement the winner, the loser market never closes. You can't pay out. You can't learn. This is the structural flaw in applying futarchy to single-shot executive decisions without synthetic data or rigorous randomization.

  6.  **Developing the Scorecard:**
      *   *Straight Vote:* Solves legitimacy, ignores information aggregation.
      *   *Expert Committee:* Solves expertise, prone to capture/bias.
      *   *Real-Money Conditional Market:* Solves incentives, fails legal/compliance + counterfactual resolution.
      *   *Play-Money Version:* Solves compliance, fails incentive compatibility (noise trading).
      *   *Randomised Pilot:* Solves causal inference, fails to allocate the full $40m decisively (only tests a slice).

  7.  **Review against Constraints:**
      *   *Did I explain futarchy?* No.
      *   *Did I use the 6 inputs?* Yes, woven into the cases.
      *   *Is it practical?* Yes, focused on the "spec."
      *   *Length/Format:* Desiderata with cases, Incompatibilities, Single Exclusionary Requirement, Scorecard (5-6 lines each).

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Make sure I explicitly address the "5-year lag" in the Metric Stability section. That's a killer for a yearly budget cycle.
      *   *Check:* Ensure the "Landlord/Vendor" conflict is highlighted in Conflict Insulation.
      *   *Check:* The "Continuous Decision" needs to be addressed in Granularity.
      *   *Tone Check:* Keep it dry, committee-ready, slightly skeptical.

      *(Self-Correction on the Counterfactual)*: Input 4 says "Whatever we adopt is the only branch that gets observed." Input 6 says "We can randomise." These are in tension. If we randomize (Input 6), we *can* observe counterfactuals for the pilot, but not for the whole $40m. The market needs to resolve on the *whole* $40m impact to be useful for the committee's main decision. This is a key incompatibility to highlight.

      *(Refining the "Single Requirement")*: Is it Resolution Certainty or Metric Stability? Metric Stability is bad (5 year lag), but Resolution Certainty is fatal. If the market doesn't resolve, the mechanism dies. I'll stick with Resolution Certainty/Counterfactuals as the primary blocker.

      *(Refining the Scorecard)*: Keep it tight. 5-6 lines per option.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Desiderata for a Practical Allocation Mechanism

  **1. Metric Stability (The "Five-Year Lag" Problem)**
  *   **Case:** Your "Student Flourishing Index" (SFI) resolves five years post-decision, but Institutional Research (IR) has changed the methodology twice already. If IR tweaks the survey weighting in Year 3, the market contract becomes ambiguous or void.
  *   **Why:** A prediction market requires a deterministic resolution condition. If the yardstick moves, the bet is invalid.
  *   **Status:** **Non-negotiable.** Without a frozen metric definition, you invite legal challenge from losers claiming the goalposts moved. This is a fiduciary requirement, not a factional preference.

  **2. Conflict Insulation (The "Landlord-Trader" Problem)**
  *   **Case:** Traders are students, but one is a landlord with housing stock near campus. If they bet heavily on "Subsidised Housing," they have both financial incentive and opportunity (via survey manipulation or lobbying IR) to inflate the SFI component related to housing satisfaction.
  *   **Why:** Markets fail when participants can manipulate the settlement oracle. Since students *are* the oracle (via surveys), traders are inherently conflicted.
  *   **Status:** **Non-negotiable.** This is a fraud prevention requirement. If you cannot prevent traders from influencing the SFI, the mechanism is legally exposed as a rigged game.

  **3. Decision Granularity (The "Continuum" Problem)**
  *   **Case:** You aren't deciding "Housing: Yes/No." You are deciding "$5m vs $10m vs $15m." Discretizing this into binary markets creates arbitrage loops (e.g., betting Yes on $5m and No on $10m) that drain the prize pool without informing the committee.
  *   **Why:** Futarchy natively handles binary choices. Allocation is a continuous optimization problem. Forcing it into binary buckets loses nuance or creates market incoherence.
  *   **Status:** **Mechanism-Design Preference.** Democrats might prefer binary votes for clarity; designers need continuous pricing for efficiency. You can survive this with careful bucketing, but it adds friction.

  **4. Resolution Certainty (The "Counterfactual" Problem)**
  *   **Case:** You implement the winning policy (e.g., Cash Transfers). The losing markets (e.g., Housing) never happen. The SFI for the "Housing" world never exists. The housing traders never get paid, and the market's accuracy is never verified.
  *   **Why:** Futarchy relies on rejected options resolving to validate the pricing mechanism. If only the winner is observed, the system cannot learn, and losers have grounds to claim their capital was trapped unfairly.
  *   **Status:** **Non-negotiable.** A market that does not settle is not a market; it is a donation drive. This is the structural killer for single-path executive decisions.

  **5. Stake Sufficiency (The "Play Money" Problem)**
  *   **Case:** University rules likely ban real gambling. If you use points or small prizes, informed traders (the one expert) won't bother researching, while noise traders (the 29 students) will vote with their guts. The price signal becomes noise.
  *   **Why:** Information aggregation requires skin in the game. If the cost of being wrong is zero, the market price reflects popularity, not probability.
  *   **Status:** **Factional (Economists vs. Compliance).** Economists say real money is required for truth. Compliance/Democrats say play money is safer and inclusive. You can operate with play money, but you lose the "epistemic" benefit.

  **6. Causal Verifiability (The "Pilot" Opportunity)**
  *   **Case:** You can randomize housing subsidies across halls. This generates ground-truth data on the SFI impact *without* needing the market to be right.
  *   **Why:** This allows you to audit the market's performance post-hoc. It turns the mechanism from a "decision engine" into a "calibration tool."
  *   **Status:** **Preference (Anti-Goodhart).** This satisfies those worried the metric is gamed. It doesn't solve the immediate allocation decision but builds trust for future years.

  ***

  ### Incompatibilities & Trade-offs

  You cannot satisfy **Resolution Certainty**, **Metric Alignment**, and **Conflict Insulation** simultaneously.

  1.  **Resolution Certainty vs. Causal Verifiability:** To get **Resolution Certainty** (Desideratum 4), you need the market to settle on a specific outcome. To get **Causal Verifiability** (Desideratum 6), you must randomize (run the pilot in half the halls). If you randomize, you do not have a single "Student Flourishing Index" for the whole body to resolve the market; you have a fragmented index. If you pick one policy to satisfy the market settlement, you destroy the counterfactual data needed to prove the market was right. You must choose between a decisive budget tool (Futarchy) and a learning tool (RCT).
  2.  **Metric Alignment vs. Conflict Insulation:** The SFI **must** reflect student welfare (Desideratum 1), which means it relies on student survey data. The traders **are** students (Desideratum 3). Therefore, traders *can* influence the metric they are betting on. You cannot have a metric that matters to students *and* traders who cannot manipulate it, unless you ban students from trading. If you ban students from trading, you lose the "local knowledge" argument for using a market in the first place.
  3.  **Stake Sufficiency vs. Legal Compliance:** If **Stake Sufficiency** (Desideratum 5) requires real money to prevent noise, and University rules ban real money, the design is dead on arrival. If you accept play money, you admit the market is symbolic, which undermines the "stop arguing" promise of futarchy.

  ***

  ### The Single Most Exclusionary Requirement

  **Resolution Certainty (Desideratum 4).**
  This is the hard stop. In a standard election or committee vote, you pick a path and move on. In a prediction market, the *losers* must be paid out based on data that only exists if they *won*. Since you cannot implement the losing housing policy to see what the SFI would have been, you cannot settle the housing market. Without settlement, you cannot distribute funds, and without the threat of payout, the market prices are meaningless. Every other problem (lag, conflicts, play money) can be mitigated; the lack of a counterfactual resolution condition makes the mechanism mathematically incomplete for a single-shot executive decision.

  ***

  ### Scorecard

  **Straight Student-Body Vote**
  *   **Verdict:** High legitimacy, low information.
  *   **Pros:** Solves the "Conflict Insulation" issue (one person, one vote); legally safe; immediate decision.
  *   **Cons:** Ignores the "Five-Year Lag" (voters guess blindly); prone to populism over long-term welfare; doesn't solve the 4-hour fight, just formalizes it.
  *   **Fit:** Best for political cover, worst for allocative efficiency.

  **Expert Committee (Status Quo)**
  *   **Verdict:** High expertise, low trust.
  *   **Pros:** Handles "Decision Granularity" well (experts can tune knobs); avoids "Play Money" incentive issues.
  *   **Cons:** Fails "Conflict Insulation" (committee members have biases); lacks "Causal Verifiability" (no market signal to audit); perpetuates the annual fight.
  *   **Fit:** Safe, but fails the brief of stopping the argument.

  **Real-Money Conditional Market**
  *   **Verdict:** High epistemic value, illegal.
  *   **Pros:** Solves "Stake Sufficiency" (truthful pricing); theoretically solves "Resolution Certainty" if structured as derivatives.
  *   **Cons:** Violates university gambling policies (Input 5); fails "Conflict Insulation" (landlords can bet big); "Five-Year Lag" kills capital efficiency (money locked for 5 years).
  *   **Fit:** Theoretically optimal, practically impossible.

  **Play-Money Version**
  *   **Verdict:** Safe, but noisy.
  *   **Pros:** Compliant with rules; engages students; provides *some* signal on sentiment.
  *   **Cons:** Fails "Stake Sufficiency" (prices reflect fun, not truth); "Resolution Certainty" still broken (no counterfactual data); risks being ignored as a game.
  *   **Fit:** Good for consultation, bad for binding allocation.

  **Randomised Pilot (RCT)**
  *   **Verdict:** Scientifically robust, operationally limited.
  *   **Pros:** Solves "Causal Verifiability" (Input 6); bypasses "Resolution Certainty" (you measure real impact, not predicted); reduces "Conflict Insulation" risk (data comes from IR, not traders).
  *   **Cons:** Doesn't allocate the full $40m (only tests a slice); "Five-Year Lag" still applies to the results; delays full decision by a year.
  *   **Fit:** The only option that generates actual truth, though it kicks the can on the full budget decision.
