prompt: |-
  Hi — please act as a professional philosopher who's also done a couple of years of cross-cultural survey work, so you know the WEIRD critique and the moral realism/relativism literature from the inside rather than from survey articles. Do some actual brainstorming before you start writing; I want something drafted carefully, not a confident first pass.

  I'm TAing for a metaethics + moral psychology course and my study group has completely blown itself up about what the cross-cultural variation literature (the WEIRD complaint about Western, Educated, Industrialized, Rich, Democratic samples, and everything that's been done since on small-scale societies, honor cultures, purity/divinity framings, market integration and kinship intensity) actually shows about moral objectivity. Two of the group have agreed to an adversarial collaboration and I've been volunteered to write up the document, so please draft it: the joint statement a committed moral universalist/realist and a committed variationist (relativist, constructivist, or debunker — pick the strongest version, whichever flavor you think is hardest to knock over) could both sign after arguing in good faith for a year. I want the claims they can both accept, including about the data itself; the exact statements of where they still differ, each phrased so that its own side would sign the wording; the cruxes; and for each crux the case, probe or evidence both would agree bears on it, with each side's prediction written down in advance.

  Some things I want you to actually use rather than gesture at, because the boring version of this document is the one I keep half-writing myself. First, disambiguate "objectivity": mind-independence of moral facts, cross-cultural universality of true moral claims, convergence under idealized reflection, and the practical authority/non-negotiability of moral demands are four different theses, and I suspect half the fight is about which one the variation data is even supposed to threaten — so say explicitly which flavor each side is arguing about, and flag whichever parts of the dispute you think are verbal. Second, use this three-way taxonomy of disagreements and sort the disputed findings into it: cases where the principles are the same but the factual or metaphysical beliefs differ (does the ritual actually cause harm, does the ancestor actually mind), cases where the principles are the same but the weights or lexical priority differ, and cases where the candidate moral properties or the boundary of the moral domain itself differ (whether purity or loyalty is a moral consideration at all, versus merely conventional or religious). Third, I made up three hypothetical study designs and I want both camps to commit to predictions about them, since a crux that neither side will let anything settle is useless: the vocabulary-switch probe (the same fact pattern described to matched samples in rights language, honor language and purity language — do judgments track the described facts or the framing?), the reflective-convergence probe (ask people what an ideally informed, impartial member of their own community would say, and whether they'd revise after seeing how their reasons generalize — do replies converge across societies, and does either side think convergence or non-convergence would even be evidence?), and the bicultural-salience probe (people fluent in two moral frameworks, with one or the other made salient — do they switch, blend, or report one as merely pragmatic?). Also engage with the tu quoque question of whether the variationist's own measurement tools and normative commitments are themselves among the varied things, and with what fraction of the variance actually lies between societies rather than within them.

  Format it as a numbered agreed-claims section (say, eight to twelve claims, none of them vacuous — if a claim wouldn't surprise an undergraduate, cut it) followed by a disagreements table with columns for the neutral statement, the realist's own preferred formulation, the variationist's own, and the crux it turns on; then a short section on the probes with each side's prediction and what each would concede if the prediction failed. Please don't pad it with citations or reading suggestions: I can't check them, my group can't either, and I don't care who said what first. Keep the whole thing under about 1200 words, and don't hedge everything into mush — I'd rather have claims that bite and are wrong than a summary where both camps agree by agreeing about nothing.
