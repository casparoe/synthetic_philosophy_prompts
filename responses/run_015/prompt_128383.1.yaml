answer: |-
  **JOINT STATEMENT ON CROSS-CULTURAL MORAL VARIATION AND OBJECTIVITY**

  **Preamble: Disambiguating Objectivity**
  We distinguish four theses often conflated as "moral objectivity": (1) *Mind-Independence* (moral facts exist apart from belief); (2) *Universality* (true moral claims hold across cultures); (3) *Convergence* (idealized reflection yields agreement); (4) *Authority* (moral demands are non-negotiable). The variation data primarily targets *Universality*. The Realist argues variation is compatible with (1) and (3); the Variationist argues variation undermines (1) by defeating (3). We agree this distinction is critical; much dispute is verbal confusion between (2) and (1).

  **I. Agreed Empirical and Conceptual Claims**
  1.  **WEIRD Bias:** Standard samples (Western, Educated, Industrialized, Rich, Democratic) are outliers in global psychological space, particularly regarding impersonal fairness and analytic reasoning.
  2.  **Variance Distribution:** On most measured moral metrics, variance *within* societies exceeds variance *between* societies. Between-group differences are statistically significant but often effect-size small compared to intra-cultural disagreement.
  3.  **Measurement Tu Quoque:** Survey instruments (Likert scales, vignette protocols) embed Western conceptual categories. The Variationist's own tools are subject to the same cultural loading they critique in realist assumptions.
  4.  **Descriptive Normativity:** The data describes moral *psychology* and *sociology*, not moral *truth*. Neither side can derive an 'ought' solely from the distribution of an 'is' (no genetic fallacy for realism, no relativistic inference for variationism).
  5.  **Ecological Correlates:** Market integration, kinship intensity, and subsistence style correlate with shifts in normative emphasis (e.g., impersonal fairness vs. relational loyalty).
  6.  **Phenomenology of Authority:** Across cultures, moral claims are experienced as authoritative and objective (thesis 4 above), even when content differs.
  7.  **Error Possibility:** Both sides accept that widespread consensus can be false (Realist) and widespread variation can mask underlying unity (Variationist).
  8.  **Domain Flexibility:** The boundary between "moral," "conventional," and "religious" is porous and culturally constructed; purity violations are treated as moral harms in some societies and conventional rituals in others.
  9.  **Reflective Capacity:** All populations demonstrate capacity for second-order reflection on norms, though the *outputs* of reflection differ.
  10. **No Knockout:** Current data falsifies neither robust realism nor robust constructivism; it constrains the plausible versions of each.

  **II. Taxonomy of Disputed Findings**
  We sort observed variations into three categories to locate the metaphysical friction:
  1.  **Same Principle / Different Facts:** Disagreements driven by non-moral beliefs (e.g., "Does this ritual harm the ancestor?" vs. "No"). *Agreed:* This explains significant variation without threatening objectivity.
  2.  **Same Principle / Different Weights:** Shared foundations (care, fairness, loyalty) traded off differently (e.g., loyalty overrides fairness in high-kinship societies). *Disputed:* Realists see this as contextual application of universal weights; Variationists see it as evidence of incommensurable local hierarchies.
  3.  **Different Domains:** Disagreement on whether a property is moral at all (e.g., is purity a moral value or a hygiene preference?). *Disputed:* Realists argue purity is a misfiring of harm psychology; Variationists argue purity is a distinct, culturally constructed moral ontology.

  **III. Table of Remaining Disagreements**

  | Neutral Statement | Realist Formulation | Variationist Formulation | Crux |
  | :--- | :--- | :--- | :--- |
  | **Explanation of Divergence** | Divergence is primarily epistemic error or informational deficit regarding universal facts. | Divergence is ontological; distinct moral worlds are constructed by distinct social practices. | **Best Explanation:** Is error or construction the parsimonious account of deep disagreement? |
  | **Status of Convergence** | Convergence under ideal reflection is expected and would confirm mind-independence. | Convergence is unlikely; ideal reflection yields multiple stable equilibria relative to culture. | **Evidence Value:** Would convergence prove realism, or merely shared psychology? |
  | **Authority Source** | Authority derives from the mind-independent status of the demand. | Authority derives from the social necessity of the norm for group cohesion. | **Normativity:** Is the "ought" discovered or manufactured? |
  | **Purity/Divinity** | Purity norms are mistaken extensions of harm psychology (disgudgeon). | Purity norms are sui generis moral constructs irreducible to harm. | **Moral Ontology:** Is the moral domain fixed or expandable? |

  **IV. Empirical Probes and Predictions**
  We commit to the following hypothetical studies as adjudicators. Each side specifies what would force concession.

  **1. The Vocabulary-Switch Probe**
  *Design:* Identical fact patterns presented to matched samples using Rights language, Honor language, and Purity language.
  *   **Realist Prediction:** Judgments will track the underlying *facts* of harm/welfare regardless of framing. Framing effects will be superficial noise.
      *   *Concession:* If framing systematically reverses moral valence (e.g., harm is permissible under Honor framing), Realist accepts that moral properties are frame-dependent, not fact-dependent.
  *   **Variationist Prediction:** Judgments will track the *framing*. Honor framing will license acts forbidden in Rights framing.
      *   *Concession:* If judgments remain stable across frames, Variationist accepts that underlying moral intuitions are universal and framing is merely rhetorical.

  **2. The Reflective-Convergence Probe**
  *Design:* Subjects asked what an "ideally informed, impartial member of their community" would say, then prompted to generalize reasons across cultures.
  *   **Realist Prediction:** Responses will converge on core harm/fairness constraints as generalization increases.
      *   *Concession:* If reflection solidifies divergence (e.g., "An ideal member of *my* culture would still reject *your* principle"), Realist accepts that convergence is not a feature of moral cognition.
  *   **Variationist Prediction:** Responses will stabilize at distinct, culturally specific equilibria. Generalization will be rejected as inappropriate imperialism.
      *   *Concession:* If reasons generalize universally despite cultural differences, Variationist accepts that local norms are approximations of universal principles.

  **3. The Bicultural-Salience Probe**
  *Design:* Fluent biculturals primed with one or the other framework before judgment.
  *   **Realist Prediction:** Participants will report one framework as "authentic" and the other as "pragmatic," or blend them into a coherent whole.
      *   *Concession:* If participants switch moral truth-values entirely based on prime without cognitive dissonance, Realist accepts moral truth is context-bound, not agent-independent.
  *   **Variationist Prediction:** Participants will switch judgments seamlessly with no reported conflict, demonstrating context-dependent construction.
      *   *Concession:* If participants report significant dissonance or claim one framework is "correct" regardless of prime, Variationist accepts that moral cognition seeks a single coherent system.

  **Signed,**
  *The Realist Collaborator*
  *The Variationist Collaborator*
