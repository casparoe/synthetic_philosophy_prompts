answer: |-
  This specification translates your bureaucratic and ecological constraints into metaphysical requirements. I have refined your starting list, removing questions that are internal to specific theories rather than constraints on the theory itself (e.g., the status of the top level of the hierarchy matters less than the stability of the levels you actually use).

  ### The Specification: Requirements for a Habitat Ontology

  **1. Multiplicity and Heterogeneity (Non-negotiable)**
  *   **The Case:** You must explain how a hundred distinct sites can all instantiate "Lowland Heath," and how two sites can share this type despite having almost no physical overlap (e.g., different soil pH, different dominant heather species).
  *   **The Requirement:** The theory must allow one universal to be wholly present in multiple locations simultaneously, and it must allow for *variable realization* (the property is the same, the physical substrate differs).

  **2. Causal Potency (Non-negotiable)**
  *   **The Case:** Designation triggers management rules (graze, burn, drain) based on predicted outcomes. If the category doesn't track something that *does* something, the legal protection is baseless.
  *   **The Requirement:** Properties must be causally relevant. Instantiating a habitat type must confer specific dispositions or powers (e.g., "holds water," "supports specific invertebrates").
  *   **Note:** This is the single requirement that rules out the most contenders (see Scoring).

  **3. Dispositionality for Undisturbed Instances (Non-negotiable)**
  *   **The Case:** You designate sites that have never been drained. You need to claim they *would* react a certain way *if* drained.
  *   **The Requirement:** The theory must support counterfactuals. Properties cannot be merely categorical (what is there now); they must include potentialities (what would happen under intervention).

  **4. Cross-Classification (Non-negotiable)**
  *   **The Case:** A site can be "Wet Heath" and "Sphagnum Bog" simultaneously, without one being a subtype of the other.
  *   **The Requirement:** The theory must allow for *overlap* without requiring mereological fusion or subsumption. A particular must be able to instantiate multiple, non-hierarchical universals at once.

  **5. Trans-Scheme Identity (Non-negotiable)**
  *   **The Case:** Aligning with neighbouring countries. You must decide if your "Category A" is *identical* to their "Category B" or merely co-extensive.
  *   **The Requirement:** The theory must provide truth conditions for property identity across different conceptual schemes. It must distinguish "same property, different label" from "different property, same extension."

  **6. Intensionality (Non-negotiable)**
  *   **The Case:** Two definitions might pick out the exact same set of sites today, but differ in legal meaning (e.g., "sites with Species X" vs. "sites with Soil Y" where X only grows on Y).
  *   **The Requirement:** The theory must distinguish properties that are co-extensional (apply to all the same particulars) but differ in meaning or causal basis.

  **7. Negative and Disjunctive Properties (Contested)**
  *   **The Case:** "Unimproved" is defined by the *absence* of fertilizer history. "Heath or Grassland" might be a management category.
  *   **The Requirement:** The theory must admit properties defined by absence (privatives) or disjunction (A or B).
  *   **Status:** *Contested.* Ecologists and lawyers need these; strict Realists (e.g., Armstrong) reject them as not "carving nature at the joints." If you make this non-negotiable, you rule out Immanent Realism.

  **8. Vagueness Handling (Non-negotiable)**
  *   **The Case:** The 40% vs. 39% cover cut-off.
  *   **The Requirement:** The theory must locate the vagueness. Is the *property* vague (ontic vagueness), or is our *predicate* precise but the world fuzzy (semantic vagueness)? For legal defensibility, you need the latter: the property is precise, the measurement is the source of error, or the cut-off is a constitutive rule that *makes* the property precise for legal purposes.

  **9. Collective Instantiation (Non-negotiable)**
  *   **The Case:** "Even-aged," "connected," "viable." These apply to the population or stand, not the individual plant.
  *   **The Requirement:** The theory must allow universals to be instantiated by *fusions* or *collections* of particulars, not just simple substances. It requires a mereology (theory of parts/wholes) compatible with the ontology.

  **10. Context-Sensitive Naturalness (Contested)**
  *   **The Case:** Your "Local Naturalness" problem. A category is a robust natural kind in the uplands but an arbitrary slice of a gradient in the lowlands.
  *   **The Requirement:** The theory must allow a property to be "real" (joint-carving) in one context and "conventional" (arbitrary) in another, while remaining the *same* property.
  *   **Status:** *Contested.* This is the hardest requirement. Standard Realism says a property is either natural or it isn't, universally.

  ---

  ### The "Local Naturalness" Problem

  You asked if a theory can accommodate naturalness that is local or comes in degrees.

  **The Hard Truth:** Strict Realism cannot do this. If a property carves a joint, it carves it everywhere. If your "Upland Heath" is a natural kind in the uplands but a gerrymandered gradient in the lowlands, a strict Realist must tell you that you are actually tracking **two different properties** that share a name.

  **The Cost of Accommodating It:** To keep it as *one* property, you must adopt a **Pragmatic or Conceptualist Ontology**. You accept that the "property" is a hybrid: part world (the physical substrate), part us (the resolution at which we choose to classify).
  *   **What it costs:** It weakens **Trans-Scheme Identity**. If the property is partly constituted by your local pragmatic needs, it cannot be strictly identical to a neighbour's category unless they share your pragmatic needs. It also weakens **Causal Potency** in the lowlands; if the category is arbitrary there, its predictive power is coincidental, not lawful.
  *   **Recommendation:** Do not demand the theory solve this. Instead, treat "Local Naturalness" as a signal to **split the category** in the next revision. Metaphysically, it is cleaner to have "Upland Heath" and "Lowland Heath" as distinct universals than to force one universal to be half-real and half-fiction.

  ---

  ### Incompatible Requirements

  **Pair:** **Causal Potency** (Req 2) and **Negative Properties** (Req 7).
  *   **The Conflict:** How does an *absence* of fertilizer cause anything? Causation is typically understood as the interaction of positive existents (chemicals, roots, water). "Unimproved" is a history of non-interference. A theory that insists properties must be causal powers (Immanent Realism) cannot accept "Unimproved" as a genuine property. A theory that accepts "Unimproved" (Nominalism) struggles to explain why it predicts ecological outcomes (since absences don't push).
  *   **Which to Drop:** Drop **Negative Properties** as *fundamental*. Keep them as *legal shorthand* for a complex positive basis (e.g., "soil chemistry consistent with non-fertilization"). This satisfies the lawyers (who keep the term) and the metaphysicians (who ground the causation in the soil chemistry).

  ### The Knockout Requirement

  **Causal Potency (Req 2)** rules out the most contenders.
  *   It eliminates **Platonism** (Forms are abstract and causally inert).
  *   It eliminates **Ostrich Nominalism** (There are no properties, just objects; this makes prediction magic).
  *   It eliminates **Resemblance Nominalism** (Resemblance doesn't cause outcomes; shared underlying nature does).
  *   It leaves only **Immanent Realism** or **Dispositional Essentialism** as viable candidates.

  ---

  ### Scorecard for Ontological Families

  **Transcendent Realism (Platonism)**
  *   *Score:* Poor.
  *   *Why:* Guarantees stability and identity across borders, but fails Causal Potency. Cannot explain why designating a site changes management outcomes. Too detached from the muddy field.

  **Immanent Realism (Aristotle/Armstrong)**
  *   *Score:* Good (with modifications).
  *   *Why:* Excellent for Causal Potency and Multiplicity. Struggles with Negative Properties ("Unimproved") and Vagueness. Requires you to reframe negative definitions as positive structural states.

  **Trope Theory**
  *   *Score:* Mixed.
  *   *Why:* Great for particularity and Local Naturalness (each site's heath is unique). Terrible for Trans-Scheme Identity (matching tropes across borders is difficult) and Collective Instantiation.

  **Resemblance Nominalism**
  *   *Score:* Poor.
  *   *Why:* Handles Vagueness and Heterogeneity well. Fails Causal Potency (resemblance doesn't drive ecology) and Trans-Scheme Identity (resemblance is subjective).

  **Ostrich Nominalism (There are no properties)**
  *   *Score:* Fail.
  *   *Why:* Makes the classification scheme a fiction. Legally dangerous; if a lawyer argues the category isn't "real," you have no metaphysical ground to stand on.

  **Pragmatic Conceptualism (Recommended Hybrid)**
  *   *Score:* Best Fit.
  *   *Why:* Treats categories as real *for the purpose of management*. Accepts that some types are natural kinds (uplands) and some are regulatory constructs (lowlands). Sacrifices strict Trans-Scheme Identity for functional utility.

  ### Final Advice for the Committee

  Your argument about "Unimproved" stalled because you were asking if it is a *property of the world*. Stop asking that. Ask if it is a **reliable indicator of a causal base**.
  1.  **Adopt Immanent Realism for the ecology:** The habitat is a causal power grounded in soil/biota.
  2.  **Adopt Conceptualism for the regulation:** The *boundaries* and *negative definitions* are legal tools that track the causal powers closely enough to be enforceable.
  3.  **Split the "Local Naturalness" cases:** If a type behaves differently in different regions, revise the scheme. Do not ask metaphysics to stretch that far. It is cheaper to add a category than to defend a contradictory universal in court.
