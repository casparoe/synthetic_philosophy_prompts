answer: |-
  The impasse is best diagnosed as two groups answering different questions under a single heading, which has hardened into a substantive disagreement because each side claims exclusive jurisdiction over the term "rationality." Defenders treat the Methodology of Scientific Research Programmes (MSRP) as a normative reconstruction (how science *ought* to be rationalized), whereas critics treat it as an empirical hypothesis (how science *is* actually practiced). The shared vocabulary of "progress," "core," and "prediction" masks this category error: defenders accept historical inaccuracies as permissible idealizations for rational reconstruction, while critics demand historical fidelity as a validity condition for the model.

  Reflexively applied, the debate about Lakatos itself constitutes a degenerating problem shift. Both sides protect their hard cores (Normativity vs. Naturalism) via ad hoc auxiliary hypotheses. Defenders adjust definitions of "novelty" (shifting between temporal and heuristic novelty) to save specific cases; critics dismiss counter-examples as misreadings of history or claim the criteria are too vague to falsify. No novel facts emerge from the meta-debate, only endless re-interpretations of the same historical canon (Newton, Einstein, Bohr). The hidden question doing the work is formal: Is there an operationalizable property of "theoretical progress" independent of retrospective narrative? Lakatos assumed yes; critics argue no, citing the theory-ladenness of facts.

  Progress would require either a formal metric for novelty devoid of historical context or a consensus that philosophy of science is purely heuristic rather than adjudicative. However, no progress should be expected. The blocker is a bedrock methodological commitment: defenders insist rationality must transcend practice to judge it, while critics insist rationality must emerge from practice to describe it. These are incompatible foundational aims that cannot be resolved within the current framework.

