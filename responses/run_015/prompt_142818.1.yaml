      *   **Input:** Seven points (a) through (g) outlining their position.
      *   **Task:** Identify tensions between pairs of points, rank them by severity, explain what would have to be given up and the cost of that revision. Specifically evaluate the "dormant politics" distinction.
      *   **Constraints:** ~700 words, British English, no citations/references/reading lists (argue it out, name moving parts), tone should be analytical and helpful (like an editor or peer reviewer).
      *   **Context:** Filing from a hotel lobby, needs clear argumentation without needing fact-checking.

  2.  **Deconstruct the User's Position (Points a-g):**
      *   (a) Anti-determinism: Tech doesn't dictate society; use is open/underdetermined (SCOT aligned).
      *   (b) Artefact Politics: Artefacts *can* carry politics (Winner's bridges example), regardless of intent/current use.
      *   (c) Dormant vs. Live Politics: Politics is inherent but needs activation conditions (face-recognition example).
      *   (d) Accountability: Designers/funders bear responsibility for downstream effects.
      *   (e) Neutrality is Ideology: "Tools are neutral" is a shield against accountability.
      *   (f) Macro Effects Allowed: Can say tech changed society (printing press, pill) without being a determinist.
      *   (g) Opposite-Headlines Test: If a device can be framed as liberation OR surveillance, politics isn't in the artefact.

  3.  **Identify Tensions:**
      *   **Tension 1: (b) vs. (g).** (b) says politics is *in* the bridge regardless of use. (g) says if you can tell two opposite stories (liberation/surveillance), politics isn't in the artefact. This is a direct contradiction. (b) claims inherent politics; (g) claims inherent politics is disproven by dual usability.
      *   **Tension 2: (a) vs. (f).** (a) says tech is underdetermined/use is open. (f) says tech destabilised church/changed labour market. This looks like determinism. The user claims it's not, but the editor flagged this. The tension is between "open use" and "macro structural impact."
      *   **Tension 3: (c) vs. (a)/(g).** (c) "Dormant politics" tries to save (b). But if politics is dormant until activated by context (autocracy vs. democracy), isn't that just context determining the politics? If the context determines it, isn't it constructivist? This undermines the claim that politics is *in* the artefact.
