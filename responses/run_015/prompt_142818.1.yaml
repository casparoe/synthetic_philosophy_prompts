      3.  **(a) vs. (f):** The classic determinism charge. Manageable but needs careful phrasing.

  5.  **Drafting the Response (Iterative Process):**
      *   *Tone:* Professional, analytical, British English (e.g., "artefacts", "programme", "colour").
