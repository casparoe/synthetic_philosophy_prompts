answer: |-
  This is a fantastic nuance. You have correctly identified that the standard **Dark Forest Theory** (popularized by Liu Cixin) is predicated on *fear* and *survival*. Your variation is predicated on *ethics*, *obligation*, or *strategic friction*.

  To answer your first question: **No, there is no single, canonical name for this specific configuration in Fermi Paradox literature.**

  It is distinct from the **Zoo Hypothesis** (where *they* hide from *us* to let us develop) and distinct from the **Dark Forest** (where *they* kill *us* to stay safe). Your version is a form of **Reciprocal Altruistic Silence**.

  However, since you need a sharp definition for your bible/worldbuilding, I suggest we coin a working term for it. In philosophical circles, the closest relative is an **Infohazard** (information that harms the receiver), but applied cosmologically, I would call this:

  ### **The Ontological Burden Hypothesis**

  Here is the sharp definition you asked for, broken down into axioms, distinctions, and the "indifference test."

  ---

  ### 1. The Core Axiom
  **"Existence is a Demand."**
  In the standard Dark Forest, existence is a *threat*. In the Ontological Burden, existence is a *claim*.
  By revealing yourself, you are not necessarily pointing a gun at the observer; you are handing them a bill. You are forcing them to acknowledge you, which triggers a mandatory protocol (moral, legal, or strategic) that costs them resources, peace of mind, or strategic flexibility.

  ### 2. The Mechanism (Why Hide?)
  Civilizations hide not because they are prey, but because they are **petitioners**.
  *   **The Moral Debt:** If a Type III civilization detects a Type I civilization, they may be bound by a galactic ethic to uplift, protect, or resource them. This is expensive. To spare the advanced civ the cost, the young civ stays quiet.
  *   **The Strategic Friction:** Your existence complicates their geometry. Maybe they are hiding from something else, and your radio leakage lights up the map, drawing attention to *their* sector. You aren't the target; you're the flare that reveals the sniper.
  *   **The Political Trigger:** Detection might force a vote, a treaty, or a boundary dispute among *other* aliens. You become a political hot potato.

  ### 3. Differentiation: Precaution vs. Burden
  You asked how this differs from plain precautionary silence.

  *   **Precautionary Silence (Dark Forest):** "I hide because if they see me, **I die**."
      *   *Motivation:* Self-preservation.
      *   *Emotion:* Fear.
      *   *Observer Status:* Predatory.
  *   **Ontological Burden (Your Version):** "I hide because if they see me, **they suffer** (or are inconvenienced)."
      *   *Motivation:* Altruism, Guilt, or Systemic Stability.
      *   *Emotion:* Empathy or Prudence.
      *   *Observer Status:* Burdened, Obliged, or Compromised.

  ### 4. The Indifference Test (Does it Collapse?)
  You asked: *Does this collapse if the observer is truly indifferent?*

  **Yes. Absolutely.**
  This is the critical weakness (and dramatic tension) of your setting. The Ontological Burden **requires** the observer to have values.

  *   **If the Observer is a Paperclip Maximizer:** They do not care about morality, debt, or strategy unless you physically block them from making paperclips. If you are small enough, you are invisible noise. Your hiding is pointless.
  *   **If the Observer is Nihilistic:** They feel no moral debt. Detection does not force a decision. They ignore you.
  *   **If the Observer is Bureaucratic:** They *must* file a report on new life. That report triggers an audit. The audit is annoying. Therefore, you hide to save them the paperwork. (This is a comedic take, but valid).

  **The Rule:** For your theory to hold, the Advanced Civilization must be **Capable** of destroying you, but **Restrained** by a code that your detection would violate. You are hiding to protect *their restraint*.

  ### 5. Narrative Implications for a Novelist
  This setup creates much richer dialogue than standard Dark Forest survivalism.

  *   **The Guilt of Contact:** If your protagonists accidentally reveal Earth, they haven't just doomed humanity; they've *ruined the day* for the aliens. The aliens might show up not to kill us, but to angrily ask, "Do you have any idea how much paperwork you just caused us?"
  *   **The Martyrdom of Silence:** A civilization might choose extinction over detection, not to save themselves, but to save the *galactic order*. "We will die here in the dark so the Federation doesn't have to vote on whether to save us."
  *   **The Trap of Benevolence:** The danger isn't that the aliens are evil; it's that they are *too nice*. If they detect us, they *must* save us from ourselves. We hide to preserve our right to fail.

  ### 6. Suggested Terminology for Your Bible
  If you want to ground this in your setting's jargon, consider these terms:

  *   **Imposition Risk:** The probability that your signal forces an external actor to intervene.
  *   **Ethical Gravity:** The pull an advanced civilization feels toward a detected lifeform.
  *   **Silence as Courtesy:** The cultural norm of staying dark.
  *   **The Levinas Condition:** (A nod to philosopher Emmanuel Levinas, who argued the "Face of the Other" demands an ethical response). In your setting, "Don't show them your Face" means "Don't force them to be ethical."

  ### Summary
  You have moved the hazard from **Physical** (Death) to **Procedural/Moral** (Obligation).
  It is a stable theory *only* if the universe is populated by actors who feel bound by laws or ethics they cannot easily break. If the universe is full of sociopaths, the Ontological Burden collapses, and the Dark Forest returns.

  This is a fertile ground for sci-fi. It turns the silence of the universe from a graveyard into a library where everyone is whispering so as not to disturb the others.
