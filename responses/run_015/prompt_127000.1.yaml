      *   **Differentiation:** Contrast with Dark Forest and Zoo Hypothesis.
      *   **The Indifference Condition:** Address the "collapse" question directly.
      *   **Narrative Hooks:** Give the user story ideas based on this logic.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "indifferent observer" question? Yes, need to emphasize that this theory *requires* the observer to have values.
      *   *Check:* Is the tone right? Keep it respectful of their craft, not overly academic.
