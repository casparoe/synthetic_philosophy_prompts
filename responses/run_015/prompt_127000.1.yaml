      *   **Core Concept:** A variation of the Dark Forest Theory.
      *   **Standard Dark Forest:** Hide because detection = death/destruction (self-preservation).
      *   **User's Variation:** Hide because detection = forcing the observer into a difficult decision/moral burden/strategic debt (altruistic or systemic preservation). The detected party isn't necessarily threatened, but their existence *costs* the observer something (morally, strategically, politically).
      *   **Specific Question:** Is there an established name for this? If not, define it sharply.
      *   **Key Distinctions:** How does it differ from precautionary silence? Does it collapse if the observer is indifferent?
      *   **Tone:** Intellectual but accessible (user writes dialogue, not philosophy).

  2.  **Search for Existing Concepts:**
      *   *Dark Forest Theory (Liu Cixin):* Focuses on survival, chain of suspicion, technological explosion. Detection = Preemptive Strike.
      *   *Zoo Hypothesis (Ball):* Aliens know we're here but choose not to contact us (like a zoo). This is close, but usually implies the *observer* chooses silence, not the *observed* hiding to spare the observer.
      *   *Prime Directive (Star Trek):* Non-interference. Again, this is a rule for the advanced civilization, not a hiding strategy for the primitive one to spare the advanced one.
      *   *Berserker Hypothesis:* Self-replicating machines kill life. (Too close to standard Dark Forest).
      *   *Dead Hand/Dead Switch:* Deterrence. (Not quite).
      *   *Cosmic Shyness / Avoidance:* General terms, not specific mechanisms.
      *   *Burden of Discovery:* This sounds like the core mechanic.
      *   *Ontological Hazard:* A concept from philosophy (Nick Bostrom etc.) where knowledge itself is dangerous.
      *   *Infohazard:* Information that harms the recipient.

      *Verdict:* There isn't a single, widely recognized *named* theory in Fermi Paradox literature that exactly matches "hiding to spare the observer the burden of decision." It's a nuanced inversion of the Dark Forest. The closest philosophical relatives are *Infohazards* and *Moral Hazards*, but applied cosmologically.

  3.  **Deconstruct the User's Concept:**
      *   **Mechanism:** Visibility $\rightarrow$ Observer must act/decide $\rightarrow$ Action/Decision is costly/burdensome $\rightarrow$ Therefore, hide to prevent the cost.
      *   **Motivation:** Not fear of death, but avoidance of imposing cost/guilt/strategic complication on the other. It's a form of "Cosmic Politeness" or "Strategic Altruism."
      *   **Condition:** Requires the Observer to be *rational* and *moral/strategic* enough to feel the burden. If they are indifferent, the logic collapses.

  4.  **Drafting the Definition (The "Sharp" Part):**
      *   Need a catchy name. "The Burdened Forest"? "The Moral Hazard Hypothesis"? "The Decision-Forcing Signal"? Let's go with something descriptive but evocative. "The Imposition Hypothesis" or "The Ontological Burden." Let's suggest a few.
      *   *Core Axiom:* Existence is a demand.
      *   *Difference from Dark Forest:* Dark Forest = "They will kill me." This = "They will have to *deal* with me, and that hurts them."
      *   *Difference from Zoo Hypothesis:* Zoo = They hide *themselves* from us. This = We hide *ourselves* from them.
      *   *The Indifference Test:* If the observer doesn't care, the logic fails. This is crucial.

  5.  **Developing the Narrative Implications (For a Novelist):**
      *   Why would an advanced civ feel burdened?
          *   Moral obligation to help (resource drain).
          *   Political obligation to integrate (risk of contamination).
          *   Strategic obligation to neutralize (risk of future threat, but reluctant).
          *   Religious/Philosophical obligation (sanctity of isolation).
      *   This creates great drama. It's not about survival; it's about *guilt* or *duty*.

  6.  **Refining the Philosophy:**
      *   Connect to *Infohazards*. Information that harms the receiver.
      *   Connect to *Levinas* (The Face of the Other). The existence of the "Other" demands a response.
      *   Connect to *Game Theory*. It changes the payoff matrix.

  7.  **Structuring the Response:**
      *   **Validation:** Acknowledge it's a fresh take. It's not standard Dark Forest.
