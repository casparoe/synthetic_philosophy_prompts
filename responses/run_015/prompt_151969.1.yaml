      *   **Constraints:** No survey/reading list. Needs a ranking/ordering. Needs explicit criteria (importance, tractability, neglectedness, dependency). Needs "upstream-aware" reasoning (which question reframes others). Needs to account for skills (conceptual analysis + some empirical moral psych, *no* neuroscience/formal modeling). Needs to identify evidence that would shift the ranking.
      *   **Tone:** Academic, strategic, decisive, philosophical.

  2.  **Analyze the Four Clusters:**

      *   *Cluster 1 (Metaphysics of Participant Stance):* Dyadic vs. Institutional. Can judges/boards hold reactive attitudes? If not, is legal blame distinct from moral blame?
