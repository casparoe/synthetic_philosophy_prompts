  5.  **Refining the Argument (The "Defense"):**
      *   *Why 1 is first:* It's the ontological gatekeeper. If institutions can't participate, the legal philosophy concentration loses its Strawsonian hook.
      *   *Why 3 is second:* It defines the alternative. If 1 says "Institutions can't do reactive," they *must* do objective. Is that legitimate?
