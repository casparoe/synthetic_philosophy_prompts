          *   *Tractability:* High (conceptual analysis).
          *   *Dependency:* Upstream. Affects 3 and 4 directly.

      *   *Cluster 2 (Restructured Compatibility Problem):* Differential vulnerability of specific attitudes (resentment vs. indignation vs. guilt) to determinism.
          *   *Status:* Classic debate, but refined.
          *   *Tractability:* High (conceptual).
          *   *Dependency:* Mid-stream. Depends on what the attitudes *are* (Cluster 1). Affects how we justify practices (Cluster 3 & 4).
          *   *Risk:* Might be a rabbit hole if the metaphysics (Cluster 1) undermines the applicability of these attitudes to law anyway.

      *   *Cluster 3 (Normative Status of Objective Attitude):* Is "taking the objective stance" neutral or normative (management/control)? Does it collapse responsibility into social control?
          *   *Status:* Critical for legal philosophy (risk assessment, parole, insanity defenses).
          *   *Tractability:* Medium (requires bridging moral psych and legal theory).
          *   *Dependency:* Downstream of 1 (need to know what the participant stance is to know what suspending it means). Upstream of 4 (designing institutions based on this).
          *   *Relevance:* High for the "legal philosophy" concentration.

      *   *Cluster 4 (Moral Education/Institutional Design):* Modulating attitudes (restorative justice). Authenticity limits.
          *   *Status:* Applied/Normative.
