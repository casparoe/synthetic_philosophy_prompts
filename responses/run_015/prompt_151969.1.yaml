      *   *Attempt 2:* Start with Objective Attitude (3). It's crucial for law.
          *   *Critique:* You can't define the "suspension" of reactive attitudes without defining the attitudes themselves first (Cluster 1).
      *   *Attempt 3:* Start with Metaphysics of Participant Stance (1).
          *   *Reasoning:* This defines the ontology of the framework. If reactive attitudes are essentially dyadic, legal institutions are *never* truly holding responsible in the Strawsonian sense. This forces a redefinition of legal blame. This is the "keystone."
      *   *Second:* Normative Status of Objective Attitude (3).
          *   *Reasoning:* Once we know if institutions can hold reactive attitudes (or if they must use the objective stance), we need to know the normative weight of that objective stance. Is it mere management? This bridges the metaphysics to the legal implications.
      *   *Third:* Compatibility Problem (2).
