      *(Self-Correction during drafting)*: Make sure I don't just say "do 1 then 3." I need to explain how 1 *reframes* 3. If 1 concludes institutions *can* have reactive attitudes, 3 changes from "managing the objective stance" to "managing the reactive stance in institutions." Actually, if 1 says institutions *can* have reactive attitudes, 3 is still crucial because we need to know when they *suspend* them. But the *nature* of the suspension depends on the *nature* of the engagement. Okay, the dependency holds.

      *Refining Cluster 2 placement:* Is Compatibility really 3rd? If the user is in moral psychology, isn't free will central? Yes, but the prompt asks for a *Strawsonian* framework agenda. Strawson's move was to bypass the metaphysics of determinism. Focusing too much on 2 might drift into standard free will debates. Keeping it 3rd ensures the *Strawsonian* distinctiveness (attitudes) remains primary over the *metaphysical* distinctiveness (determinism). This fits the "moral psychology" angle better than "metaphysics of free will."

