      *   *The Stop Codon Example:* This is the "context-dependence" argument. It supports the Relational view. The Roommate co-opts it as "Arbitrariness = Code." He's partially right (codes are arbitrary conventions), but he misses that biological conventions are *frozen accidents* constrained by physics, not agreed-upon standards like ASCII.
      *   *The ML Conclusion:* Even if DNA is a code, an LM trained on next-token prediction is learning the *compression* of that code, not necessarily the *function*. It's learning the "grammar" of the code, not necessarily the "executive summary."

  6.  **Addressing the "Interpreter" Question:**
      *   This is the "Homunculus" problem. If the interpreter is also coded, who reads the reader?
      *   Resolution: It's a causal chain, not a semantic reading in the human sense. The ribosome is a chemical machine, not a "reader" with understanding.
      *   Implication: "Code" here is a shorthand for "causal mapping with high contingency," not "software running on hardware."

  7.  **Addressing the "Arbitrariness" Question:**
