      *   **Arbitrariness:** Saussure's signifier/signified. The link between "CAT" and the animal is arbitrary. The link between UUU and Phenylalanine is *physically* constrained but *chemically* arbitrary (mostly). Roommate is right that arbitrariness is a feature of codes, but wrong that it guarantees *semantic* meaning in the human sense.
      *   **The Model Conclusion:** Does "DNA is a code" imply "LMs recover meaning"? Not necessarily. An LM can model the *syntax* of a code without understanding the *semantics*.

  4.  **Drafting the Menu (Categorization Strategy):**
      *   I need to sort by *locus of meaning* as requested:
          1.  In the Sequence (Intrinsic).
          2.  In the System/Interaction (Relational).
          3.  In the History/Selection (Teleological/Evolutionary).
      *   For each, I need to evaluate: Truth value, Triviality, and whether it supports the Roommate's ML conclusion.

  5.  **Refining the Arguments (Self-Correction/Nuance):**
