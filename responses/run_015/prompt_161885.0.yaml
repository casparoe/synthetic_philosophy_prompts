  *(Self-Correction during drafting)*: I need to be careful not to say DNA *isn't* a code. Most biologists accept it is a code in the information-theoretic sense. The dispute is about what *kind* of code and what that implies for ML. I should frame it as "Which definition of code are we using?"

  *(Refining the "Interpreter" section)*: The user asked: "whether a code needs an interpreter that isn't itself written in the code." I need to answer this directly. In semiotics, yes. In biology, no, it's a closed loop. This breaks the analogy to human language/software.

