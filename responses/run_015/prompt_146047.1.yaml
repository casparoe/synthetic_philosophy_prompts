answer: |-
  Here is the decision procedure you asked for. It is designed to be run by one analyst in one day. It treats fairness metrics not as moral truths, but as operational constraints that trade off against yield and legal risk.

  ### The "Threshold & Trade-off" Protocol

  **Unit of Analysis:**
  *   **Population:** All applicants in the last 12 months (to capture seasonality), excluding the current "test" period.
  *   **Outcome:** 12-month "serious delinquency" (90+ days past due).
  *   **Group Label:**
      *   *US:* Self-reported or inferred protected class (where legally permissible for audit).
      *   *EU/No-Attribute:* Do **not** run group-specific thresholds. Use the proxy only to monitor *aggregate* disparity ratios. If proxy accuracy < 85%, halt group-level analysis and flag for Legal.

  **Practical Significance Threshold:**
  *   **The 5% Rule:** If the difference in Base Rates (Repayment Rate) between groups is **< 5 percentage points**, stop. Use a single threshold. The mathematical tension is too small to justify the operational cost of segmentation.
  *   **The 1.2 Ratio:** If the False Positive Rate (FPR) or False Negative Rate (FNR) ratio between groups exceeds **1.2** (i.e., one group has a 20% higher error rate than the other), you must proceed to Step 4.

  ---

  #### Step 1: Base Rate & Calibration Check
  **Analyst Action:**
  1.  Calculate Base Rate (BR) per group.
  2.  Plot Calibration Curve (Predicted Probability vs. Actual Default Rate) per group.
  3.  Compute Brier Score per group.

  **Sufficient Answer:**
  *   Table: `Group | N | Base Rate | Calibration Slope`
  *   Plot: Reliability diagram with 95% confidence intervals.

  **Hard No:**
  *   If Calibration Slopes differ by > 0.15 (e.g., 0.9 vs 1.05). **Stop.** The score does not mean the same thing across groups. You cannot compare thresholds. Re-calibrate the model (isotonic regression) before proceeding.

  **Manager Decision (Values):**
  *   If calibrated but Base Rates differ by > 5pp: Acknowledge that **Calibration** and **Error Parity** are now mutually exclusive. You must choose which one to preserve.
      *   *Choice A (Preserve Calibration):* A score of 0.8 means 80% repayment for everyone. **Cost:** Error rates will differ.
      *   *Choice B (Preserve Error Parity):* FPR/FNR are equal. **Cost:** A score of 0.8 means different risk levels for different groups. (This usually requires group-specific thresholds).

  #### Step 2: Single-Threshold Stress Test
  **Analyst Action:**
  1.  Apply the proposed single cutoff (e.g., Score > 0.65).
  2.  Calculate FPR and FNR per group.
  3.  Calculate the "Deferral Band" impact (see Step 3).

  **Sufficient Answer:**
  *   Table: `Group | Approval Rate | FPR | FNR | FPR Ratio | FNR Ratio`

  **Hard No:**
  *   If FPR Ratio or FNR Ratio > 2.0 (4/5ths rule violation equivalent). This is a regulatory red flag.

  **Manager Decision (Values):**
  *   If Ratio is between 1.2 and 2.0: You are in the "Business Judgment" zone. Do you accept the disparity to maintain a simple, defensible single-policy?

  #### Step 3: The Deferral Band Audit (Priya's Escape #2)
  **Analyst Action:**
  1.  Isolate applications falling into the human-review band (e.g., Score 0.45–0.65).
  2.  Calculate Human Approval Rates per group within this band.
  3.  Calculate Outcome Performance (Repaid?) for human-approved loans per group.

  **Sufficient Answer:**
  *   Table: `Group | % Sent to Human | Human Approval Rate | Performance of Human-Approved`

  **Hard No:**
  *   If Human Approval Rate Ratio > 1.5. This indicates your underwriters are introducing bias that the model avoided.

  **Manager Decision (Values):**
  *   **The Trap:** If you expand the deferral band to "fix" model disparity, you are not solving fairness; you are **outsourcing bias to humans**.
  *   *Rule:* You may only use deferral to manage risk uncertainty, not to mask fairness trade-offs. If the model disparity disappears only when the deferral band is > 30% of volume, reject the model.

  #### Step 4: The "Escape" Evaluation (Priya's Claims)
  **Analyst Action:**
  Run the specific test for the proposed solution.

  *   **Test 1 (Group Cutoffs):** Simulate group-specific thresholds to equalize FNR.
      *   *Output:* `Threshold Group A | Threshold Group B | Yield Loss`
      *   *Verdict:* **Moves Conflict.** Solves math, creates Disparate Treatment legal risk. Requires General Counsel sign-off.
  *   **Test 2 (Better Features):** Compare current AUC vs. hypothetical "perfect" AUC (0.95).
      *   *Output:* `Current Disparity Gap | Theoretical Minimum Gap at AUC 0.95`
      *   *Verdict:* **Mitigates, Doesn't Solve.** If base rates differ, disparity persists even at AUC 1.0 unless separation is perfect.
  *   **Test 3 (Deferral):** See Step 3.

  **Manager Decision (Values):**
  *   If choosing Group Cutoffs: You are explicitly trading legal risk (disparate treatment) for statistical parity.
  *   If choosing Better Features: You are spending budget for diminishing returns.

  #### Step 5: Final Sign-off
  **Analyst Action:**
  Produce a one-page "Fairness Impact Statement" summarizing the chosen trade-off.

  **Manager Decision:**
  Sign off on *which metric was sacrificed*.
  *   "We sacrificed Equal FNR to maintain Calibration."
  *   "We sacrificed Calibration to maintain Equal FNR (via group thresholds)."
  *   **Do not sign off on "No Trade-off."** It is mathematically false.

  ---

  ### Running the Procedure: Three Cases

  #### Case 1: US Small-Business Book (The "Costly" One)
  *   **Data:** Group A (70% Repay), Group B (55% Repay). Gap = 15pp.
  *   **Model:** AUC 0.75. Calibrated.
  *   **Current Policy:** Single threshold at 0.60 probability of repayment. Deferral band 0.50–0.60 (15% of apps).

  **Step 1 (Base Rate):** Gap is 15pp. **> 5pp Rule Triggered.** Proceed. Calibration is good (slopes match).
  **Step 2 (Single Threshold):**
  *   At 0.60 cutoff:
      *   Group A FNR: 10% (Good customers denied)
      *   Group B FNR: 25% (Good customers denied)
      *   **FNR Ratio:** 2.5. **Hard No.** (Exceeds 2.0 limit).
  *   *Analysis:* The single threshold is disproportionately denying Group B.

  **Step 3 (Deferral):**
  *   Current deferral band (0.50–0.60):
      *   Group A sent to human: 10%
      *   Group B sent to human: 25%
      *   Human Approval Rate: Group A (60%), Group B (40%).
  *   *Verdict:* The model pushes more Group B to humans, and humans reject more Group B. The deferral band **amplifies** the disparity, it does not hide it. Priya's Escape #2 fails here.

  **Step 4 (Escapes):**
  *   *Escape 1 (Group Cutoffs):* To equalize FNR at 10%:
      *   Group A Threshold: 0.60
      *   Group B Threshold: 0.48
      *   *Cost:* Group B gets easier terms. Legal Risk: High (Disparate Treatment).
      *   *Yield Impact:* Approving more Group B increases portfolio risk. Expected loss increases by 8%.
  *   *Escape 3 (Better Features):* Even at AUC 0.85, the Base Rate difference (70 vs 55) forces an FNR gap of at least 1.4x given current volume constraints.

  **Decision & Cost:**
  *   **Recommendation:** Do **not** implement group-specific thresholds (Legal risk too high). Do **not** keep current single threshold (Regulatory risk too high).
  *   **Required Action:** Move single threshold to 0.55.
  *   **The Cost:** This lowers FNR for Group B (to 15%) but raises FPR for Group A (more bad loans approved).
  *   **Bottom Line:** To stay within the 1.2 disparity ratio without using group thresholds, **you must accept a 4% increase in overall portfolio default rate.**
  *   **Sign-off:** You are sacrificing portfolio yield for regulatory safety.

  #### Case 2: New Market (80% Accurate Proxy)
  *   **Data:** EU Book. No protected attribute. Proxy (e.g., "Surname/Region" model) is 80% accurate.
  *   **Base Rate (Observed via Proxy):** Group X 65%, Group Y 60%. Gap = 5pp.

  **Step 1 (Base Rate):** Observed gap is exactly on the 5pp boundary.
  *   *Correction:* With 80% proxy accuracy, the *true* gap is diluted. If observed gap is 5pp, true gap is likely ~8-10pp.
  *   **Trigger:** Proceed with caution.

  **Step 4 (Escapes):**
  *   *Escape 1 (Group Cutoffs):* **Hard No.** Using a proxy to set lending thresholds is legally indefensible in the EU (GDPR + Discrimination Law). You cannot treat people differently based on an 80% guess.
  *   *Escape 3 (Better Features):* Irrelevant. The constraint is the label noise.

  **Decision:**
  *   **Protocol:** Run Single Threshold only.
  *   **Monitoring:** Monitor the *proxy* disparity monthly. If proxy disparity ratio exceeds 1.5, assume true disparity is worse and pause lending in that segment.
  *   **Verdict:** Priya's Escape #1 is dangerous here. The noise in the label makes group-specific thresholds a compliance lawsuit waiting to happen.

  #### Case 3: Vendor Model (Rank-Ordered, Uncalibrated)
  *   **Data:** Vendor provides score 300–850. No probability mapping.
  *   **Claim:** "Top 20% are best."

  **Step 1 (Calibration):**
  *   **Analyst Action:** Attempt to map score to default rate.
  *   **Result:** Cannot compute Calibration Slope. Condition (a) of the impossibility theorem is uncheckable.

  **Step 4 (Escapes):**
  *   *Escape 1 (Group Cutoffs):* Impossible. You don't know what risk level a cutoff represents.
  *   *Escape 3 (Better Features):* You can't improve features; it's a black box.

  **Decision:**
  *   **Hard No:** You cannot run this procedure.
  *   **Reason:** Without calibration, you cannot distinguish between "Group B has higher base rates" and "Vendor model is under-scoring Group B."
  *   **Requirement:** Vendor must provide calibration weights per segment OR you must build a calibration layer on top using your own historical data (requires 6 months lag).
  *   **Verdict:** **Do not ship.** Priya's math assumes a known score function. A rank-order score without calibration hides the base rate conflict inside the vendor's black box. You are importing their bias without the ability to audit it.

  ---

  ### What This Procedure Cannot Tell You

  You asked for the seams. Here they are. This protocol assumes the world is static and the labels are true. They are not.

  1.  **Label Contamination (The "We Only Lend to the Safe Ones" Problem):**
      *   Your base rates (70% vs 55%) are calculated on *people you already lent to*.
      *   If you historically denied Group B unless they were perfect, their base rate looks high (because only the best got in).
      *   If you historically lent to Group A broadly, their base rate looks lower (because you captured the risky edge).
      *   **The Blind Spot:** This procedure cannot correct for historical selection bias. If your historical data is biased, your "Base Rate" is a lie, and optimizing for it perpetuates the bias. You need a "reject inference" strategy, which this protocol does not cover.

  2.  **The Feedback Loop:**
      *   If you lower the threshold for Group B to fix FNR, you might increase defaults in the short term.
      *   If you keep the threshold high, Group B businesses fail to launch, and their economic base rate *actually drops* over 5 years because they can't build credit.
      *   **The Blind Spot:** This is a one-period optimization. It does not model the 5-year economic impact of access to capital on the base rate itself.

  3.  **The "Automated Decision" Question:**
      *   This protocol optimizes *how* to cut. It does not answer *whether* to cut automatically.
      *   If the Base Rate gap is structural (e.g., systemic economic exclusion), no threshold setting fixes the root cause.
      *   **The Blind Spot:** Sometimes the only fair decision is to increase the human review band to 50% and absorb the cost, admitting the model is not robust enough for automation in this context. This protocol flags that (in Step 3), but doesn't mandate it.

  ### Summary on Priya's Escapes

  1.  **Different Cutoffs:** **Moves the conflict.** Solves the math, creates legal liability (Disparate Treatment). Use only if Legal explicitly indemnifies the risk.
  2.  **Human Deferral:** **Hides the conflict.** Only works if humans are unbiased. Data usually shows they are more biased than models. Audit the humans (Step 3) or don't use this escape.
  3.  **Better Features:** **Mitigates the cost.** Reduces the "tax" you pay in Step 2, but does not eliminate the trade-off if base rates differ. Worth investing in, but don't sell it as a solution.

  **Final Instruction to Analyst:**
  When you bring me a threshold change, do not tell me "it's fair." Tell me "we are preserving Calibration at the cost of a 1.3 FNR Ratio," or "we are preserving FNR Parity at the cost of 4% Yield." I will sign the check for the cost. I will not sign a check for a lie.
