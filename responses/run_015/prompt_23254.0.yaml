answer: |-
  This is a sharp distinction to draw, and you are right that the literature often blurs them. In my view, the confusion stems from the fact that both responses aim to save mental causation from Kim's "exclusion" conclusion, but they diagnose the source of the threat differently. The **Priority Move** diagnoses the threat as a category mistake about the *number* of causes, while the **Redundancy Move** diagnoses the threat as a mistaken assumption about the *badness* of overdetermination.

  Since you are at the stage where name-dropping (e.g., "Bennett's test" or "Yablo's proportionality") is less useful than structural analysis, I will try to dissect the metaphysical commitments of each.

  ### 1. Structural Clarification: What is being claimed?

  To evaluate your questions, we need to be precise about what these two moves assert about the relation between $M$ (mental property/event), $P$ (physical base), and $E$ (physical effect).

  *   **The Priority Move (The "One Cause" View):** This view asserts that there is only **one causal relation** instantiated in the world. $M$ and $P$ are not two competing causes; they are either identical, or they stand in a relation (like determinable/determinate) such that they cannot be causally independent. When proponents say the mental is the "real" cause and the physical is "derivative," they usually mean that the physical description captures the *mechanism* but the mental description captures the *causally relevant property*. The claim is that overdetermination is impossible here because the definition of overdetermination requires causal independence, which is absent due to supervenience or realization.
  *   **The Redundancy Move (The "Two Causes" View):** This view accepts that $M$ and $P$ are distinct property instances and that both stand in causal relations to $E$. It admits this looks like overdetermination. The burden is then to argue that this specific type of overdetermination is **benign**. It is not the "two assassins" variety (coincidental, independent); it is a nomologically necessary redundancy grounded in the supervenience relation.

  ---

  ### 2. Question (a): Does the Priority Move avoid overdetermination, or relocate it?

  You asked whether the Priority response *really* avoids overdetermination or merely relocates the problem. My assessment is that it **avoids the formal definition of overdetermination but relocates the problem to the metaphysics of realization.**

  **Why it avoids the definition:**
  Standard causal exclusion arguments rely on a principle of **Exclusion**: *No single event can have more than one sufficient cause unless it is a genuine case of overdetermination.* Genuine overdetermination requires **independence** (i.e., $M$ could occur without $P$, and $P$ without $M$, in the relevant causal context).
  The Priority Move attacks the independence condition. If $M$ supervenes on $P$ with metaphysical necessity, then in no possible world (holding fixed the laws) do you have $M$ without $P$ or vice versa. Therefore, the "two bullets" model fails. There is only one causal "bullet" that has both mental and physical properties. By this light, there is literally no overdetermination to avoid.

  **Where the problem is relocated:**
  However, this success comes at a cost. If you say there is only one causal relation, you must explain why the physical cause ($P$) does not **screen off** the mental cause ($M$).
  Kim's worry is essentially: If $P$ is sufficient for $E$, and $M$ is distinct from $P$, what causal work is left for $M$ to do?
  *   **The Relocation:** The Priority Move answers: "$M$ does the work *by* being realized in $P$." But this shifts the burden to explaining how a higher-level property can be causally efficacious *in virtue of* a lower-level property without being epiphenomenal.
  *   **The Risk:** If the physical base $P$ is the "derivative" description (as you phrased it), you risk violating **Causal Closure of the Physical**. Closure states that every physical effect has a sufficient *physical* cause. If you prioritize the mental as the "real" cause and treat the physical as secondary, you are flirting with the idea that the physical description is not the fundamental causal story.
  *   **Verdict:** The Priority Move avoids *overdetermination* (too many causes) but invites the **Screening Off Objection** (no work for the mental). It solves the "crowding" problem but exacerbates the "efficacy" problem. It tells us there aren't two causes fighting for space, but it struggles to explain why the mental isn't just a shadow of the physical cause.

  ---

  ### 3. Question (b): Systematic Overdetermination and Empirical Implausibility

  This is the crux of the Redundancy Move's difficulty. The worry is: *Overdetermination is usually rare and coincidental. If non-reductive physicalism is true, overdetermination is universal and systematic. This looks like a cosmic conspiracy.*

  **How the Redundancy Move fares:**
  Defenders (like Loewer or Bennett) argue that the "cosmic conspiracy" worry relies on an intuition about **coincidental** overdetermination.
  *   **The Argument:** In the "two assassins" case, the causes are independent. If Assassin A misses, Assassin B might still hit. The effects *could* come apart. In the mental/physical case, they cannot come apart. If $M$ had not occurred, $P$ would not have occurred (given supervenience). Therefore, the counterfactuals that usually detect overdetermination fail.
  *   **The Weakness:** You asked about empirical/methodological implausibility. The worry is that if there were truly two sufficient causes, we should be able to intervene on one without the other. Since we *can't* (we can't change the mental without changing the physical), the claim that there are "two causes" looks like a description of our *concepts*, not the *world*.
  *   **Verdict:** The Redundancy Move fares poorly against the methodological worry. Science operates on the principle of parsimony: do not posit two causal mechanisms where one suffices. If $P$ is sufficient, positing $M$ as *also* a sufficient cause adds ontological weight without predictive power. The Redundancy defender must argue that $M$ adds *explanatory* power (e.g., generalizability), but this concedes that $M$'s causal status is explanatory rather than ontological.

  **How the Priority Move fares:**
  *   **The Argument:** Since there is only one causal process, the worry about "systematic redundancy" dissolves. There is no redundancy. The mental and physical are like "the morning star" and "the evening star." It is not redundant to say both refer to Venus; it is just two ways of tracking the same causal power.
  *   **The Weakness:** The empirical worry returns as a worry about **causal exclusion**. If science traces the causal chain entirely at the micro-physical level (neurons firing), and the Priority Move says "The mental is the real cause," there is a tension with scientific practice. Science treats the physical base as the cause. If the Priority Move says the physical is "derivative," it conflicts with the methodological naturalism that grounds Closure.
  *   **Verdict:** The Priority Move handles the "systematic" worry better because it denies the system is redundant. However, it struggles to explain why the physical sciences are so successful at capturing causation if the physical cause is merely "derivative."

  ---

  ### 4. Question (c): Are they in tension, or compatible?

  This is the most subtle part. I am inclined to say they are **logically in tension**, and attempting to hold both usually results in an unstable position, though some try to synthesize them.

  **The Tension:**
  *   **Ontological Commitment:** The Redundancy Move commits to **Distinctness**. $M$ and $P$ are distinct property instances, each bearing a causal relation to $E$. The Priority Move commits to **Singularity**. There is one causal relation, described in two ways.
  *   **The Conflict:** You cannot consistently claim "There are two sufficient causes" (Redundancy) and "There is only one cause under two descriptions" (Priority). If there are two causes, they are distinct. If they are one cause, they are not two.
  *   **The "Both" Strategy:** Some philosophers try to hold both by distinguishing *levels*. They might say: "At the level of *properties*, there are two (Redundancy), but at the level of *events*, there is one (Priority)."
      *   *Why this fails:* Kim's argument targets property instances. If the property instances are distinct, the exclusion problem arises for the instances. Saying the *event* is one doesn't help if the *properties* are competing for causal relevance. If $M$-instance and $P$-instance are distinct, and both cause $E$-instance, you have overdetermination. If you say they don't both cause it (Priority), you aren't holding Redundancy.

  **A Possible Synthesis (and its cost):**
  The only way to hold both is to adopt a **Pluralist Theory of Causation**.
  *   You could argue that "causation" is not a univocal relation. There is *physical causation* (transfer of energy/momentum) and *mental causation* (counterfactual dependence/information flow).
  *   Under this view: $P$ causes $E$ physically (Redundancy/Physical Closure satisfied). $M$ causes $E$ mentally (Priority/Mental efficacy satisfied).
  *   **The Cost:** This effectively concedes to Kim that there is no *single* causal relation that both $M$ and $P$ share. It saves mental causation by changing the subject about what causation *is*. For a PhD student, this is a viable path (similar to Lynch's functional pluralism or Godfrey-Smith's approach), but it requires abandoning the idea that mental and physical causes compete in the same arena. If they aren't in the same arena, Exclusion doesn't get off the ground, but you also lose the intuitive sense that my belief moves my body in the *same way* my neurons do.

  ### Summary and Recommendation

  To answer your specific doubts:

  1.  **Does Priority avoid overdetermination?** Yes, formally, by denying the independence condition. But it **relocates** the problem to explaining why the physical base doesn't screen off the mental property. It trades "too many causes" for "no work for the mental."
  2.  **Systematic Overdetermination Worry:** The **Redundancy Move** struggles here. It requires accepting a universal, necessary redundancy that looks ontologically profligate. The **Priority Move** handles this better but risks conflicting with the methodological priority of physics (Closure).
  3.  **Tension:** They are in tension. One posits two causal relations (distinct properties), the other posits one (single process). Holding both requires a pluralist theory of causation that arguably dilutes the force of "causation" itself.

  **My take:** If I were in your position, I would press on the **Priority Move**, specifically the **Determinate/Determinable** model (Yablo). It offers the most robust way to deny overdetermination without collapsing into Identity Theory. However, you must be prepared to defend it against the charge that determinables are causally inert abstractions. The Redundancy Move feels like a concession that the mental is a "second cause," which keeps the Exclusion Argument alive in a new form (i.e., "Why do we need the second cause if the first is sufficient?").

  The confusion you are feeling is likely because the Redundancy Move is often presented as a "solution," when it is often just a restatement of the problem with a plea for tolerance. The Priority Move is the only one that attempts to dissolve the problem structurally, but it demands a heavier metaphysical lift regarding the nature of properties.

  Does that distinction help untangle the circle you're stuck in? I'm happy to dig deeper into the "screening off" relocation if that's where the blockage is.
