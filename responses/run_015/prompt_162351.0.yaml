answer: |-
  This is a sharp read on HCH. Treating it as a normative model of deliberation rather than an AI architecture is not a hobby-horse; it's arguably the most philosophically honest way to engage with it in a non-technical room. It turns the session from "How do we build a god?" to "Why is thinking hard?"

  Here is the plan for your 90 minutes.

  ### 1. The Order of Operations (Prerequisites)
  You cannot start with the recursion. If you start with "Imagine a tree of humans," coders will think "MapReduce" and teachers will think "Group Project." You need to establish the *cognitive bottleneck* first.

  **The Sequence:**
  1.  **The Limit:** Establish that there are questions a single human *cannot* answer in one sitting, not because they lack knowledge, but because they lack *working memory* or *perspective*. (5 mins)
  2.  **The Decomposition:** Show that some hard questions can be broken into easier questions *without losing the thread*. This is not dividing a pile of bricks (labour); it's dividing a proof into lemmas (logic). (15 mins)
  3.  **The Recursion:** Introduce HCH only here. "What if the person answering the sub-question can *also* ask for help?" (10 mins)
  4.  **The Synthesis:** The crucial step. The top human doesn't just collect answers; they weigh them. (The rest of the session).

  **Why this order:** If you don't establish #1, they won't see the need. If you don't distinguish #2 from simple parallelization, they will miss the "Factored Cognition" point. HCH is about *dependency*, not just *distribution*.

  ### 2. The One Concrete Question
  You are right to avoid maths (too deterministic) and moral dilemmas (too values-driven). You need a question where the *structure of the argument* matters more than the conclusion.

  **Criteria for the Question:**
  *   **Must have:** Multiple independent dimensions that interact non-linearly. (e.g., Feasibility, Desirability, Risk).
  *   **Must have:** A synthesis step that requires judgment, not averaging.
  *   **Must not have:** A single "correct" answer discoverable by Google.
  *   **Must not have:** High emotional stakes (keeps it about the *process*).

  **Recommendation:** **"Should this pub introduce a membership fee to survive the next year?"**
  *   *Why:* Coders can model the revenue/churn. Teachers can model the community impact/atmosphere. Everyone knows the context (the room they are in).
  *   *The Split:* One sub-team looks at financial viability (hard numbers). One looks at customer retention (behavioral). One looks at competitor pricing (market).
  *   *The Synthesis:* The numbers might say "Yes," the community impact says "No." The top node has to deliberate on the trade-off. That is where the "good deliberation" lives.

  ### 3. Misconceptions (and when to kill them)
  **Expected:**
  *   *"So it's just delegation."*
      *   **When:** Immediately after introducing the recursion.
      *   **Fix:** "In delegation, I give you a task and you go away. In HCH, I give you a question, and you are allowed to become *me*—you can ask for help too. We share the same goal function."
  *   *"The humans at the bottom are doing the real work."*
      *   **When:** During the exercise.
      *   **Fix:** "If the bottom humans are brilliant but answer the wrong question because the split was bad, the system fails. The intelligence is in the *tree structure*, not just the leaves."
  *   *"Who decides how it gets split?"*
      *   **When:** When they ask about the mechanics.
      *   **Fix:** "In the ideal model, the protocol decides. In this room, *we* are the protocol. That's why we're testing if we can do it."
  *   *"So this is a superintelligence then."*
      *   **When:** End of session.
      *   **Fix:** "It's a capability ceiling. It shows what's possible with infinite time and perfect coordination. It doesn't mean we can build it tomorrow."

  **Unexpected (The Dangerous Ones):**
  *   *"This is just bureaucracy."*
      *   **Risk:** They will equate recursion with red tape.
      *   **Fix:** Emphasize that the "overhead" is the *thinking*. Bureaucracy is filling forms; HCH is refining understanding.
  *   *"It assumes humans are honest."*
      *   **Risk:** Coders will jump to game theory/adversarial nodes.
      *   **Fix:** Acknowledge it, then bracket it. "For this model to work as a picture of deliberation, we assume good faith. If we assume bad faith, we're designing security, not cognition."
  *   *"Communication cost kills this."*
      *   **Risk:** Teachers know group work is inefficient.
      *   **Fix:** "Agreed. That's why this is an *idealization*. We are studying the geometry of the thought, not the logistics of the meeting."

  ### 4. Splitting Question vs. Splitting Labour
  This matters immensely. You have spotted the difference between **Task Decomposition** (HCH) and **Data Parallelism** (MapReduce).

  *   **Splitting Labour:** "You sort the left half of the deck, I'll sort the right." (The sub-tasks are identical in nature).
  *   **Splitting Question:** "You figure out if it's affordable, I'll figure out if it's legal." (The sub-tasks are different in nature).

  **Where it belongs:**
  Introduce this distinction **right after the Concrete Question exercise**.
  Ask the room: "Did we just divide the work, or did we divide the problem?"
  *   *Why:* HCH relies on splitting the *question*. If you only split labour, you haven't reduced cognitive complexity, you've just sped up processing. For your "deliberation" angle, splitting the *question* is the only part that improves the quality of thought. Splitting labour just improves speed. Make sure they see that distinction.

  ### 5. The "Idealization" Disclosure
  Do not put this in the intro. It sounds like a disclaimer ("Nothing I say is real"). Do not leave it to the end. It sounds like a retreat ("Just kidding").

  **The Sweet Spot:**
  Mid-session, immediately after the first run-through of the Concrete Question.
  **Script:** "Notice how smoothly that worked? We assumed the sub-answers fit together perfectly. In real life, people talk past each other. HCH isn't a description of how meetings *go*; it's a description of how they *ought to be structured* to count as thinking."
  *   *Why:* This validates their experience (it felt clean) while pivoting to your core thesis (it's a normative model). It turns the "unreality" into the main point.

  ### 6. The End Check (The Broken Tree)
  Your idea is good, but let's sharpen it. Don't just give them a question where answers don't compose. Give them a **Category Error**.

  **The Test:**
  Hand out a slip:
  *   *Top Question:* "Is this bridge safe?"
  *   *Sub-Answer 1:* "The materials are strong enough."
  *   *Sub-Answer 2:* "The design looks nice."
  *   *Sub-Answer 3:* "It was built in 1990."

  **Ask:** "The top node says 'Yes, it is safe.' What broke?"
  **Target Answer:** They should identify that Sub-Answer 2 and 3 do not bear on the safety predicate in a composable way. Sub-Answer 2 is aesthetic, Sub-Answer 3 is historical. The decomposition failed to isolate the relevant variables.
  **Success Condition:** They don't say "The bridge might fall." They say "The sub-questions didn't sum to the parent question."

  ### 7. Omissions (What to skip and the cost)
  You have 90 minutes. You must cut the AI implementation details.

  1.  **Distillation/Amplification:** (How we train a model to mimic the HCH tree).
      *   *Cost:* They won't know how this becomes an AI product.
      *   *Gain:* Keeps the focus on *human* cognition.
  2.  **Training Data / Weights:**
      *   *Cost:* They won't understand the engineering bottleneck.
      *   *Gain:* Prevents the conversation from becoming about machine learning tech specs.
  3.  **Adversarial Robustness:** (What if a node lies?).
      *   *Cost:* Leaves the system looking naive.
      *   *Gain:* Keeps the focus on *deliberation* rather than *security*.
  4.  **Infinite Recursion vs. Depth Limits:**
      *   *Cost:* Technical precision.
      *   *Gain:* Avoids getting bogged down in "when do we stop?" logistics.

  **Explicitly say:** "We are skipping how you'd build this in code. We are treating this as a blueprint for reasoning."

  ### Summary of the Flow
  1.  **0-15m:** The Cognitive Limit (Why one brain isn't enough).
  2.  **15-30m:** The Mechanism (Decomposition vs. Parallelization).
  3.  **30-60m:** The Exercise (The Pub Membership Question).
  4.  **60-70m:** The Reveal (This is an Idealization of Deliberation).
  5.  **70-80m:** The Check (Spot the Broken Tree).
  6.  **80-90m:** Wrap & Omissions (What we ignored to make this fit).

  This keeps your "deliberation" angle as the secret engine that gets revealed halfway through, rather than a premise they might reject at the start.
