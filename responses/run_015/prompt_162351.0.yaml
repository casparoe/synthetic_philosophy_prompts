prompt: |-
  Hey — I host a fortnightly discussion night in the back room of a pub, mostly coders plus a couple of teachers, about ten people, ninety minutes, nobody with any philosophy training including me. I got into this through blog posts about AI alignment and have been chewing on it by myself for ages, and next week its my turn to run the session on HCH / factored cognition — the humans-consulting-humans recursion thing.

  The angle I actually care about isn't "how do we build a safe AI." It's that Ive started reading the whole setup as a picture of what a *good deliberation* is even trying to be: the thing you fall short of when you answer in thirty seconds something that deserved a week, or when a committee talks for three hours and ends up dumber than any of its members. But I cant tell whether that's a fair reading or just my own hobby-horse, and I don't want to smuggle it in.

  So please don't explain HCH to me — plan how I'd get the room to it.

  - What has to be on the table before the recursion itself makes sense, and why that order. I assume something about why a hard question can be broken into easier ones, and something about why that isn't plain old divide-and-conquer, but I dont know which depends on which.
  - The one concrete question the whole session should hang on. It needs the splitting to genuinely help and the putting-back-together to be where the interest is. I'm guessing it shouldn't be a maths problem (too tidy, everyone just nods) and shouldn't be a moral dilemma (they'll argue about the answer rather than the shape of the thing) — but tell me what else it has to have, and what it must not have.
  - The misconceptions, in the order they'll actually show up, and where in the sequence to head each off. Ones I expect: "so it's just delegation"; "the humans at the bottom are doing the real work, so nothing is gained"; "so this is a superintelligence then"; and someone saying "who decides how it gets split" like that settles it. The ones I'm not expecting are worth more to me.
  - There's one thing I noticed on my own and can't tell if it matters: sometimes splitting a question splits the *question* ("what's the population of X") and sometimes it splits only the *labour* ("you take the left half of the ledger"). Those feel like different moves to me and I suspect the scheme needs both in different places. Where, if anywhere, does that belong?
  - Whether and where to say out loud that this is being used as an idealization of deliberation and not a description of how anybody actually thinks. I'm worried that if I say it too early it sounds like a disclaimer, and too late and they've already taken it as psychology.
  - A check at the end that shows they got the structure and not just the vibe. My idea was to hand them a question where the sub-answers obviously don't compose and see whether they can say what broke without saying "the answer's wrong."
  - What I should flatly refuse to go into in ninety minutes, and say out loud that I'm skipping. I'd have thought the whole imitating-the-process / distilling-it-into-a-model side, but I'd rather you tell me what each omission costs me.
