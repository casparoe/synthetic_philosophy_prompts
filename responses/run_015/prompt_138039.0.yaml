answer: |-
  You have identified a genuine gap in the standard vocabulary of assessment and signaling theory. What you are describing is not standard **Costly Signaling** (Spence, 1973), nor is it purely **Screening** (Stiglitz, 1975) in the traditional economic sense.

  In standard Costly Signaling, the signal works because it is *differentially costly* (e.g., a degree is harder for a low-ability worker to obtain). In your pattern, the signal is not necessarily "costly" for the expert in terms of effort; rather, it is *differentially possible* based on the underlying structure of their knowledge. The faker faces an impossibility (or near-impossibility), while the expert faces a triviality.

  There is no single, universally accepted term in psychometrics that captures this specific mechanism. However, the phenomenon is the intersection of three distinct theoretical frameworks: **Adversarial Screening** (Game Theory), **Generalization vs. Overfitting** (Machine Learning/Cognitive Science), and **Challenge-Response Protocols** (Cryptography).

  I propose we label this phenomenon **"Adversarial Generalization Screening."**

  Below is the carving you requested: what it is, how it differs from nearby notions, its boundary conditions, and how to handle the reverse case.

  ---

  ### 1. The Concept: Adversarial Generalization Screening

  **Definition:** A reliability mechanism where validity is established not by the resource expenditure of the signaler, but by the receiver's capacity to sample unpredictably from the space of possible performances, thereby distinguishing **internalized capacity** (generalizable function) from **rehearsed artifact** (memorized lookup table).

  **Why it is not Costly Signaling:**
  *   **Costly Signaling:** Relies on *marginal cost*. A peacock's tail is expensive to grow. A low-quality candidate *could* fake the signal, but it would cost them too much resources/effort relative to the payoff.
  *   **Your Pattern:** Relies on *marginal impossibility*. A low-quality candidate *cannot* fake the signal, regardless of effort, because they lack the underlying generative function. The "cost" to the expert is near zero; the "cost" to the faker is infinite (they simply cannot do it).

  **The Mechanism:**
  The examiner acts as an **adversarial sampler**. They are testing whether the candidate's competence is a **function** (can compute output $Y$ for any input $X$) or a **cache** (contains only pre-computed pairs of $X_1, Y_1; X_2, Y_2$).
  *   **The Expert:** Has learned the rule. Producing a variation is a low-cost computation.
  *   **The Faker:** Has memorized the output. Producing a variation requires solving the problem from scratch in real-time, which exceeds their cognitive bandwidth.

  ### 2. The Nature of the "Cost"

  You asked: *If a special case, what is the cost a cost of?*

  In this framework, the cost is **Cognitive Retrieval and Computation Cost under Constraint.**

  *   **Production Cost (Standard Signaling):** Time, money, or energy spent creating the artifact *before* the assessment (e.g., writing the case study, practicing the song).
  *   **Processing Cost (Your Pattern):** The cognitive load required to access the knowledge and apply it to a *novel* constraint *during* the assessment.

  For the expert, the knowledge is **compiled** (automatic, low latency). For the faker, the knowledge is **interpreted** (requires active reconstruction, high latency). When you impose "less time" or "different key," you are increasing the processing cost. The expert's system handles the load; the faker's system crashes (timeout or error).

  ### 3. Boundary Conditions

  You asked about the limits of this mechanism. Based on the "Overfitting" analogy, here is where it collapses:

  **A. Predictability (The Overfitting Threshold)**
  *   **Condition:** If the space of possible demands becomes known or stable (e.g., a published list of oral exam questions).
  *   **Failure Mode:** Candidates can "memorize the test." They move from learning the *function* to caching the *answers*. The signal loses validity because the faker can now pre-compute the variations.
  *   **Requirement:** The demand space must be sufficiently large or random that pre-computation is more expensive than learning the skill.

  **B. Stockpiling (The Combinatorial Defense)**
  *   **Condition:** Can a candidate prepare enough variants to cover the likely space?
  *   **Failure Mode:** If the domain is small (e.g., "Name the 50 states"), a candidate can memorize all permutations.
  *   **Requirement:** The assessment must rely on **combinatorial explosion**. Asking for "a case study in a different domain" works because the intersection of [Domain] $\times$ [Problem Type] $\times$ [Constraint] creates a space too large to cache. If the candidate can invest once in a large enough stock of variants to cover the probable sample, the mechanism fails.

  **C. Unpredictability vs. Randomness**
  *   **Condition:** Does the demand need to be random?
  *   **Nuance:** It does not need to be mathematically random, but it must be **unpredictable to the candidate**.
  *   **Requirement:** It requires **Information Asymmetry**. The examiner must hold the "nonce" (the specific variation) private until the moment of demand. If the candidate knows the variation in advance, the processing cost drops, and the faker can bridge the gap.

  ### 4. The Reverse Case: Mode-Dependent Competence

  You asked: *What should we say about the reverse case, where those best at the underlying skill are systematically worst at producing it on demand?*

  This is a critical validity threat. In psychometrics, this is known as **Construct-Irrelevant Variance.** The test is measuring "ability to perform under oral pressure" rather than "underlying professional competence."

  **Label:** **Mode-Dependent Competence** (or **Asynchronous Expertise**).

  **Diagnosis:**
  *   **High-Latency Experts:** Some professionals operate best with reflection, revision, and tools (e.g., writers, architects, coders, researchers). Their "compilation time" is long, but their "executable" is robust.
  *   **Low-Latency Performers:** Some professionals operate best in real-time (e.g., emergency surgeons, trial lawyers, pilots). Their "interpretive" speed is high.

  **The Risk:**
  If you use Adversarial Generalization Screening for a role that does not require real-time performance, you are systematically selecting for **Low-Latency Performers** and filtering out **High-Latency Experts**. You are confusing **fluency** with **competence**.

  **Resolution:**
  *   **Job Analysis:** You must determine if the job requires *improvisational capacity*. If the job allows for revision (e.g., writing policy), an oral defense is a validity error.
  *   **Accommodation:** If the skill is essential but the mode is not, allow "thinking time" or written responses to the variations. This lowers the processing cost without lowering the generalization requirement.
  *   **Triangulation:** Use Adversarial Generalization only as one leg of a triangle. Pair it with an artifact review (to capture High-Latency Experts) and a simulation (to capture Low-Latency Performers).

  ### 5. Summary of Terminology

  To help you operationalize this in your design documents, here is the proposed vocabulary:

  | Concept | Proposed Term | Definition |
  | :--- | :--- | :--- |
  | **The Phenomenon** | **Adversarial Generalization** | Reliability derived from demanding unprepared variations to distinguish capacity from rehearsal. |
  | **The Mechanism** | **Dynamic Challenge-Response** | The examiner issues a random constraint (challenge); the candidate must compute a coherent response. |
  | **The Failure Mode** | **Overfitting** | When candidates memorize the test variations rather than learning the underlying skill. |
  | **The Cost Type** | **Processing Cost** | The cognitive load of retrieving and applying knowledge in real-time, distinct from production cost. |
  | **The Reverse Case** | **Mode-Dependent Competence** | When high underlying skill cannot be demonstrated under specific assessment constraints (e.g., time pressure). |
  | **The Validity Threat** | **Construct-Irrelevant Variance** | When the assessment measures the ability to handle the *format* (oral/improvised) rather than the *skill*. |

  ### 6. Practical Implications for Design

  1.  **Protect the Question Bank:** Unlike standard exams where security prevents cheating, here security prevents *overfitting*. If the "variations" become known, the test measures memory, not capacity.
  2.  **Calibrate the "Nonce":** The variation must be novel enough to break a script but familiar enough to be solvable by the competent. (e.g., "Sing in a different key" is valid; "Sing in a language you don't know" is invalid).
  3.  **Monitor for False Negatives:** Track candidates who fail the oral/ad-hoc portion but excel in the artifact portion. If they succeed in the actual job later, your Adversarial Generalization test has low predictive validity for that specific role.

  **In short:** You are describing a **Proof of Internalization** via **Adversarial Sampling**. It is distinct from Costly Signaling because it tests the *structure* of the knowledge (function vs. lookup table) rather than the *investment* in the knowledge. It fails when the sample space becomes predictable, and it risks excluding high-quality candidates whose expertise requires latency (revision/reflection) to manifest.
