      *   **Conflict:** Committee split 50/50. Two historians want "documented intent" removed (arguing it pre-judges morality).
      *   **Constraints:**
          1.  Do *not* argue that ranking is imprecise or numbers are disputed (designers concede this; it's about comparison without measuring).
          2.  Must state the strongest case *against* comparison altogether (the "obscenity" argument) before answering it.
          3.  Must honestly present the best counter-argument (that claiming incomparability is itself a comparative move that can shelter cases from scrutiny).
          4.  Clear bottom line (Approve, Reject, or Approve with Conditions).
