      *Let's deepen the economic/philosophical nuance.*
      The NIMBY treats the neighborhood as a *finished product* (static habitat).
      The YIMBY treats the neighborhood as a *portfolio asset* (exchange value).
      Lefebvre treats it as a *work of art* (oeuvre) created by living.

