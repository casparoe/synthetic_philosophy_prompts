answer: |-
  A NIMBY, a YIMBY, and Henri Lefebvre walk into a public zoning hearing.

  The NIMBY stands up and says, "I object to this fourplex. The shadow it casts infringes on my private aesthetic entitlement to the neighborhood's existing character."

  The YIMBY stands up and says, "I object to the delay. Restricting this supply infringes on the market's entitlement to efficient allocation and price equilibrium."

  Lefebvre stands up and says, "I object to both of you. You're treating the city as a *product* to be owned or traded, rather than an *oeuvre* we collectively produce through the act of *inhabiting*."

  The Planning Director sighs, flips through the municipal code, and looks at Lefebvre.

  "Sir, I'm looking at the Table of Permitted Uses. We have 'Single-Family Residential,' which covers the NIMBY's equity storage. We have 'Multi-Family Commercial,' which covers the YIMBY's yield optimization. But 'Collective Oeuvre'?"

  He shakes his head.

  "That's not a zoning classification. If you're producing space without generating exchange value, you're technically unpermitted loitering. Pay the impact fee or vacate the premises."
