  ### The Decision Tree

  **Node 1:** Did the effect appear when the belief or cue was absent?
  *(If Yes → Leaf 1)*

  **Node 2:** Did the manipulation change where or how widely they looked?
  *(If Yes → Leaf 2)*

  **Node 3:** Did it change ability to tell apart, or just willingness to say "yes"?
  *(If Just Willingness → Leaf 3)*

  **Node 4:** Does the effect last after the immediate cue is gone?
  *(If Yes → Leaf 4)*

  **Node 5:** Does the effect vanish when the stimulus is made perfectly clear?
  *(If Yes → Leaf 5)*

  **Node 6:** Did the effect appear at the shortest exposure time tested?
  *(Note: Requires reaction times or varied durations. If missing, cost is ~$5k for a psychophysics add-on.)*
  *(If Yes → Leaf 6)*

  **Node 7:** Can you change the report without changing the detection?
  *(Note: Requires separate detection task. If missing, cost is ~$10k for a two-alternative forced-choice design.)*
  *(If Yes → Leaf 7; If No → Leaf 8)*

  ---

  ### The Leaves

  1.  **Method Artifact**
      *   *Gloss:* The difference wasn't there; the control group showed it too.
      *   *Awkward Swallow:* You have to admit the finding is noise and the paper shouldn't have been published.
  2.  **Sampling Shift**
      *   *Gloss:* Experience didn't change; they just looked at different parts of the display.
      *   *Awkward Swallow:* You have to accept that "seeing" includes deciding where to point your eyes.
  3.  **Report Bias**
      *   *Gloss:* Experience didn't change; they just shifted their threshold for saying "yes."
      *   *Awkward Swallow:* You have to believe people lie about their own experience without knowing they're doing it.
  4.  **System Recalibration**
      *   *Gloss:* The last few minutes of exposure rewrote the mapping, not the current belief.
      *   *Awkward Swallow:* You have to treat the brain like a camera white-balance, not a thinker.
  5.  **Stimulus Ambiguity**
      *   *Gloss:* There's no fact of the matter; the input was too degraded to support a verdict.
      *   *Awkward Swallow:* You have to accept that "what it looked like" has no answer when things are blurry.
  6.  **Sensory Change**
      *   *Gloss:* The effect is real and it reaches the sensory response itself.
      *   *Awkward Swallow:* You have to allow high-level beliefs to rewrite low-level hardware wiring.
  7.  **Late Recognition**
      *   *Gloss:* It's real but only downstream, at object recognition or categorisation.
      *   *Awkward Swallow:* You have to draw a line between "sensing" and "recognizing" that might not exist.
  8.  **No Separation**
      *   *Gloss:* The question is misposed; expectation-shaped inference is just what perception is.
      *   *Awkward Swallow:* You have to give up the idea that there's a pure, uninterpreted "given" in experience.

  ---

  ### Study Mapping

  1.  **Hungry/Full (80ms vs 500ms):** Lands on **Sensory Change** (Node 6: Yes, 80ms is short).
  2.  **Prism Glasses (Lingers):** Lands on **System Recalibration** (Node 4: Yes, survives removal).
  3.  **Duck/Rabbit (Blur levels):** Lands on **Stimulus Ambiguity** (Node 5: Yes, vanishes at mild blur).
  4.  **Tone/Shock (Sensitivity vs Bias):** Lands on **Report Bias** (Node 3: Just willingness changed).
  5.  **Radiologists (Eye movements):** Lands on **Sampling Shift** (Node 2: Yes, eye movements differed).

  ---

  ### The Stuck Study

  **Study 1 (Hungry/Full)** is stuck between **Sensory Change** and **Late Recognition**.
  *   **Why:** 80ms is fast, but not fast enough to rule out rapid categorization. The effect vanishing at 500ms suggests correction, but doesn't prove the initial flash was sensory rather than a fast guess.
  *   **The Fix:** Run the same task while recording Early Visual Evoked Potentials (EEG). If the belief changes the P1 component (80-100ms), it's sensory. If it only changes the P3 (300ms+), it's recognition. Cost: ~$15k for EEG time and analysis.

  ### Unoccupied Combinations

  *   **System Recalibration + Sampling Shift:** A persistent adaptation that also changes where you look.
      *   *Read:* **Untried.** Most adaptation studies fixate gaze; most eye-tracking studies are transient. It's plausible (e.g., prism adaptation changing scanpaths) but no study here tests both.
  *   **Report Bias + Stimulus Ambiguity:** A bias that only appears when the image is blurry.
      *   *Read:* **Unattractive.** If it's only bias under blur, it usually collapses into Ambiguity (no fact of the matter). Distinguishing them requires proving sensitivity stayed constant *at that specific blur level*, which Study 3 didn't do.

  ### Inseparable Leaves

  **Late Recognition** and **No Separation** cannot be separated by this tree.
  *   **Why:** Both leaves are reached only if the effect survives clarity checks and isn't purely bias. If the only data is a report (naming the object), you cannot tell if the percept changed (No Separation) or if the percept was stable but the label changed (Late Recognition).
  *   **Flag:** To separate them, you need a measure of experience that bypasses the label (e.g., continuous dial reporting or neural decoding), which Node 7 attempts but often fails to capture fully.

  ### The Heaviest Node

  **Node 3 (Discriminability)** carries the most weight.
  *   **Why:** It is the only branch that definitively separates "the world looks different" from "the decision rule changed." Every other node (Attention, Recalibration, Ambiguity) still allows for the possibility that the experience itself shifted. Node 3 is the gatekeeper for the entire "Cognitive Penetration" debate; if sensitivity doesn't budge, the debate is effectively over for that study.
