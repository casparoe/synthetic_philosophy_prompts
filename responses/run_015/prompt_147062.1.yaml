      *   **Jackson:** In his original formulation (and often in his metaphysical focus), the primary intension is defined over **uncentered worlds** based on conceptual roles grounded in the actual world. Jackson struggles to account for the a priori status of indexicals without centering, often treating "I" as a description ("the person speaking"). If the instructor rules that "I am here now" has a primary intension that is necessary only relative to a *center*, she confirms Chalmers. If she attempts to analyze it via actual-world descriptive conditions without centering, she leans Jackson.

