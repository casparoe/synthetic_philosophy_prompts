  **Joint Statement on the Classification of Buddhist Ethics**
  **Oxford Colloquium on Buddhist Moral Theory**

  **I. Agreed Claims**
  We, the undersigned, affirm the following propositions as common ground for further enquiry:
  1.  **Diversity:** The Buddhist traditions are historically and doctrinally diverse; no single ethical theory captures every school without remainder.
  2.  **Intention and Karma:** Intention (*cetanā*) is the primary determinant of karmic fruit, yet the normative weight of that fruit relative to worldly consequences remains contested.
  3.  **Precepts:** The training precepts function as essential guides for conduct, though their status as absolute constraints or heuristic tools is disputed.
  4.  **Transgression Narratives:** Stories of bodhisattvas breaking precepts demonstrate flexibility for advanced agents but do not automatically license similar acts for ordinary practitioners.
  5.  **Classification:** Classifying Buddhist ethics depends on whether one prioritises the criterion of right action or the account of moral development and character formation.

  **II. Residual Disagreements**
  | Topic | Karuṇā Reading (Consequentialist) | Bhāvanā Reading (Virtue-Ethical) |
  | :--- | :--- | :--- |
  | **Ultimate Goal** | The reduction of *dukkha* (suffering) across all sentient beings is the sole final good. | The awakening of the agent through the perfections is the final good, irreducible to welfare metrics. |
  | **Precept Status** | Precepts are provisional instruments valid only insofar as they minimise suffering. | Precepts are constitutive of the path; violating them damages the agent's capacity for awakening. |
  | **Normative Focus** | Ethics evaluates acts by their outcomes for others. | Ethics evaluates acts by their expression of the agent's cultivated character. |

  **III. The Cruxes**
  Two specific questions determine whether our disagreement is substantive or merely terminological.
  1.  **The Two-Channel Question:** Does an act's karmic fruit to the agent belong in the evaluation of the act alongside its effects on others? The Karuṇā side leans towards counting only effects on others' welfare; the Bhāvanā side insists the agent's karmic trajectory is intrinsic to the act's value.
  2.  **The Epistemic-Standing Proviso:** Do narratives in which an advanced bodhisattva with knowledge of other minds breaks a precept supply any reason at all to an agent lacking that standing? The Karuṇā side suggests they illustrate the priority of welfare; the Bhāvanā side argues they describe a unique soteriological status unavailable to ordinary agents.

  **IV. Stipulated Cases and Predictions**
  We accept the following materials as bearing directly on the cruxes above.

  **1. The Relic Case**
  *A custodian monk discovers a venerated relic is a forgery. Belief sustains a practice that reduces village craving; exposure would collapse this gain.*
  *   **Karuṇā Position:** The monk should maintain the deception. The reduction in craving and harmful conduct outweighs the disvalue of falsehood. Truth is instrumental to welfare.
  *   **Bhāvanā Position:** The monk should disclose the truth. Integrity is constitutive of awakening; sustaining delusion corrupts the agent's character and undermines the genuine Dharma, regardless of temporary welfare gains.

  **2. The Isolated Awakening**
  *Suppose a being's awakening has no downstream effects on any other being—no teaching, no example, no one ever learns of it.*
  *   **Karuṇā Position:** This awakening lacks full normative value. If the cessation of suffering exhausts what is finally good, an event affecting only one being with no welfare ripple is morally neutral compared to active relief of others' pain.
  *   **Bhāvanā Position:** This awakening possesses supreme value. Awakening is intrinsically good regardless of external consequences; the perfection of wisdom is an end in itself, not merely a means to social welfare.

  **3. The Longitudinal Pattern**
  *A twenty-year study of Theravāda forest-monastery practitioners finds that deepening concentration predicts reduced sensitivity to outcome-magnitude in hypothetical dilemmas and increased unwillingness to breach a precept even where breaching it would help others.*
  *   **Karuṇá Prediction:** We would have been moved if the study showed that advanced practitioners became *more* sensitive to outcome-magnitude, prioritising welfare over rules. The actual result suggests rigidity that may conflict with compassion.
  *   **Bhāvanā Prediction:** We would have been moved if the study showed that advanced practitioners became *more* willing to breach precepts for utilitarian gains. The actual result vindicates the view that training solidifies character constraints against consequentialist calculation.

  **V. Conclusion on Verbal Dispute**
  We acknowledge that part of our dispute is verbal. If "consequentialism" is defined strictly as maximizing aggregate welfare independent of the agent's character, the Bhāvanā reading correctly rejects the label. However, if "consequentialism" includes the karmic fruit to the agent as a relevant consequence, the Karuṇā reading may retain the term. A reformulation focusing on "welfare-maximisation" versus "character-perfection" would dissolve the terminological deadlock, though the substantive disagreement regarding the Relic Case and the Isolated Awakening would remain. We cannot find a formulation regarding the normative authority of the precepts that both would sign without reservation.

  **Signed,**
  **The Karuṇā Proponent**
  **The Bhāvanā Proponent**
