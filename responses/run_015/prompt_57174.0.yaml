      Begin by asking the Officers: "How many slips did you consume?" Then the Proposers: "How many justifications did you write?" The room will likely report exhaustion. Reveal the source: Lewis Carroll's "What the Tortoise Said to Achilles." Explain that the Officer *was* the Tortoise. The slips represented premises. The students tried to turn rules into premises.
