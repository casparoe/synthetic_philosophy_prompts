      Divide class into six teams of three. Each team assigns roles: Proposer (suggests steps), Scribe (writes derivations), Officer (holds the sealed instructions). The Proposer and Scribe work together to derive a conclusion from given premises using simple logic. The Officer's job is certification. They possess a stamp or initial authority. No step counts unless the Officer signs it.
