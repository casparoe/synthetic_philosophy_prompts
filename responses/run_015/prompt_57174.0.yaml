      First failure mode: Officers break character. They might laugh or explain the point early. Mitigation: Remind them privately that their grade depends on silence. Second failure mode: Students game the economy. They might write "Because" repeatedly. Mitigation: You act as Bank Manager. Reject vague justifications. Require specific rule citations which cost slips. Third failure mode: Logic confusion. Students might struggle with the trivial logic. Mitigation: Keep premises absurdly simple ("If A then B"). Ensure the pressure is bureaucratic, not cognitive. Fourth failure mode: Visual impairment issues. Small slips are hard to handle. Mitigation: Ensure slips are large index-card size, high contrast black on white. If a student struggles, allow a scribe to handle the physical slips while the student directs. Watch for frustration turning to disengagement. If a team stalls completely, intervene as the Bank Manager to offer a "grant" of slips in exchange for a verbal explanation, noting the exception publicly for the debrief.

