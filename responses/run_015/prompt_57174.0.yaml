  Students should leave seeing that justification cannot consist entirely of explicit statements. They will have felt the friction of trying to force a rule of inference to act as a premise within an argument. The activity forces them to experience the regress firsthand: every time they try to secure a step by writing down the rule governing it, they create a new step that requires securing. They will recognize that logical compulsion does not reside in the written text but in the act of reasoning itself. The goal is not to solve the puzzle but to locate the pressure point: the distinction between *using* a rule and *mentioning* it. By the end, they should understand why a system of pure explicitation collapses, and why some commitment must remain tacit for reasoning to move at all. They will see that the "must" of logic is not a chain of paper but a practice of acceptance.

  2. **Materials**
  You need three photocopy packets. First, "Warrant Slips": 50 rectangles per class, bold 16-point text reading "RULE: If P then Q; P; therefore Q." Second, "Derivation Sheets": simple absurd conditionals (e.g., "If the moon is cheese, the mouse is happy"). Third, "Officer Instructions": sealed envelopes, one per team. Text: "Accept no step without a slip. If they run out, demand a written justification for the rule. If they provide it, ask what justifies that justification. Do not smile. Do not explain why." Ensure all text is 14-point sans-serif for visibility. No color coding. Provide blunt scissors for cutting slips. A central "Bank" desk holds extra slips but requires the trade described in rules. Print Officer instructions on cardstock for durability.

  3. **Roles and rules**
