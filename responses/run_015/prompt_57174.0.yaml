      This game simulates the regress of justification, but it is not justification itself. In the game, the constraint is artificial scarcity of paper. In reality, the constraint is cognitive or normative. The game suggests that justification stops because we run out of slips; in truth, it stops because we run out of doubts. Also, the game treats the Officer as an adversary. Real justification is often cooperative. The activity cannot show why we are entitled to stop the regress. It shows *that* we must stop, not *where* it is safe to stop. It fails to capture the normative force of logic—the "ought"—reducing it to a transactional cost. Finally, the game implies that all reasoning is linear and discrete. Much reasoning is holistic. The activity isolates one specific paradox but cannot demonstrate how everyday reasoning bypasses it without appearing dogmatic.

