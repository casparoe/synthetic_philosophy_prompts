      Philosophers agree that Carroll's regress is a serious challenge to formalism. There is consensus that rules cannot be fully reduced to premises without loss of function. However, where to locate the stopping point is contested. One family of response, Rationalism, claims we have direct insight into logical necessity; the cost is positing a mysterious faculty of intuition. Another, Pragmatism, argues rules are habits of action; the cost is making logic contingent on human practice rather than objective truth. A third, Conventionalism, suggests rules are agreements; the cost is making logic arbitrary. Some argue the regress is a category mistake, confusing grammar with ontology. Others accept the regress but deny it is vicious, viewing justification as holistic coherence rather than linear foundation. None of these answers is standard. Each solves the regress by sacrificing something else: objectivity, certainty, or linearity. Your students should leave knowing the map of these costs, not a single solution.

