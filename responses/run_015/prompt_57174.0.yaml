      55-75 min: Debrief. Reveal Carroll. Discuss the experience. Connect mechanics to philosophy.
      Buffer: 5 minutes flexible for overruns in Phase One.
      Keep transitions sharp. Use a visible timer. Ensure Officers understand their role before starting.

