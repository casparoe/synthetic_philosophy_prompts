answer: |-
  **Exam Question**

  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Question:**
  Kuhn insists that competing paradigms are incommensurable, yet he provides five shared criteria for theory choice (accuracy, consistency, scope, simplicity, fruitfulness). Critics argue this renders incommensurability merely "relativism with better press." Evaluate this charge by distinguishing between shared values and shared rules of application. Finally, consider a proposed solution: if kind-terms differ, can paradigms still be compared via their instrumental success (predictions and interventions)? Argue whether this provides a neutral measure or merely relocates the incommensurability into a language of manipulation.

  ***

  **Model Answer**

  The charge that Kuhn's theory choice criteria refute incommensurability rests on a category error regarding what incommensurability entails. Incommensurability is not a claim about incomparability; it is a claim about translation and meaning. Specifically, it asserts that there is no neutral observation language into which the claims of rival paradigms can be fully translated without loss or distortion. Consequently, while paradigms can be compared, there is no algorithm to dictate the outcome of that comparison. The critic's error lies in assuming that shared criteria necessitate a shared metric for applying them.

  Kuhn's defence in the Postscript relies on distinguishing values from rules. The five criteria are values shared by the scientific community, but they are not rules that dictate how to weigh or apply them in specific instances. Two scientists can agree that "simplicity" is a virtue but disagree on whether the Copernican system is simpler than the Ptolemaic one, or whether simplicity outweighs accuracy in a specific context. Furthermore, the application of these criteria is theory-laden. What counts as "accurate" depends on the paradigm's own standards of measurement and significant problems. Therefore, the existence of shared values does not refute incommensurability; it merely explains how rational choice occurs in the absence of an algorithmic decision procedure. Rationality is preserved, but neutrality is not.

  The second part of the question asks whether instrumental success—what paradigms let us *do*—offers a neutral ground where kind-terms fail. If rival paradigms can both manipulate the same apparatus to produce the same intervention, does this bypass semantic incommensurability? Superficially, this seems promising. If a Ptolemaic and a Copernican astronomer can both navigate a ship using planetary data, the success of the intervention appears theory-neutral. However, this move risks collapsing into a naive realism that Kuhn explicitly rejects.

  To claim that an instrument "works" independently of theory presupposes that the instrument's operation and the resulting phenomena are describable in a vocabulary untouched by the paradigm. But for Kuhn, the "world" itself changes with the paradigm. The entities the instrument manipulates are defined by the kind-terms of the theory. If a modern physicist says a particle accelerator "works," they are invoking a network of ontological commitments about particles and fields that a rival paradigm might not recognize. To treat instrumental success as a common measure is to assume a theory-independent reality against which success is measured. This concedes the realist's point that there is a fixed world to be matched, whereas Kuhn argues that the world is, in a sense, constituted by the paradigm.

  Alternatively, one might argue that instrumental success merely relocates the incommensurability. The "success" is described in the language of the winning paradigm. The Ptolemaic astronomer navigates the ship, but the Copernican describes the success as "predicting planetary position," while the Ptolemaic describes it as "saving the appearances of the spheres." The intervention is shared, but the description of *what* intervened is not. Thus, instrumental success does not provide a neutral vocabulary; it simply shifts the locus of disagreement from prediction to ontology.

  In conclusion, the five criteria are consistent with incommensurability because they function as values rather than algorithmic rules. They facilitate choice without guaranteeing unanimity. Similarly, instrumental success does not refute incommensurability. To treat it as a neutral measure requires a realist metaphysics Kuhn denies, or it merely disguises the semantic shift by focusing on manipulation rather than description. In both cases, the lack of a neutral language remains, confirming that incommensurability is about the absence of a common measure, not the absence of rational comparison.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **1. Definition and Scope of Incommensurability (5 Marks)**
  *   **5:** Precisely distinguishes incommensurability (translation failure/meaning variance) from incomparability. Notes that rational choice is still possible.
  *   **3-4:** Defines incommensurability correctly but fails to explicitly decouple it from incomparability.
  *   **0-2:** Treats incommensurability as synonymous with irrationality or incomparability (Slogan reliance).

  **2. The Criteria Objection: Values vs. Rules (10 Marks)**
  *   **8-10 (First):** Clearly articulates the Values/Rules distinction. Explains that weighting and *application* are theory-laden. Argues that shared values do not imply a shared algorithm.
  *   **5-7 (2:1):** Identifies the Values/Rules distinction but offers a generic explanation of "weighting" without addressing how the *application* of the criteria themselves shifts with the paradigm.
  *   **0-4:** Claims the criteria refute incommensurability or fails to engage with Kuhn's Postscript defence.

  **3. The Instrumental Success Problem (10 Marks)**
  *   **8-10 (First):** Critically evaluates instrumentalism. Identifies that claiming "success" presupposes a theory-neutral description of the intervention (Realism trap). Argues that success descriptions are themselves paradigm-dependent.
  *   **5-7 (2:1):** Addresses the prompt but accepts instrumental success as a genuine common measure without questioning the theory-ladenness of the "instrument" or "success."
  *   **0-4:** Ignores the instrumental prompt or argues that instruments are purely neutral tools.

  **Differentiation: First (20-25) vs. 2:1 (15-19)**
  *   **To achieve a First:** The candidate must make the move that **application is theory-laden** (not just weighting) in section 2, AND must identify the **realist presupposition** in section 3 (i.e., that "success" implies a fixed world). They must treat incommensurability as a semantic/ontological claim, not just a sociological one.
  *   **A 2:1 will:** Correctly explain Values vs. Rules but may treat the criteria application as straightforward. They will address the instrumental prompt but may conclude it *is* a solution, missing Kuhn's anti-realist nuance.

  **Specific Penalties (Deduct 2 marks per error)**
  *   **The Incomparability Error:** Treating incommensurability as entailing that no rational comparison is possible.
  *   **The Observation Error:** Confusing incommensurability with the theory-ladenness of observation without linking it to meaning/translation.
  *   **The Neutral Loss Error:** Appealing to a neutral description of what a revolution "loses" (e.g., "they lost the ability to see X") without noticing that this appeal presupposes the neutral language Kuhn denies.
