  2. a policyholder who coalesced molecule by molecule out of swamp muck last tuesday and is in every other respect a perfect duplicate of a healthy human: everything works, nothing has a history
  3. a claim for "acoustic signature services" — a heart's lub-dub, which no selection process ever cared about, but which currently feeds the hospital's remote-monitoring capacity, and which the patient want billed as a covered preventive service
  4. an exapted trait — an appendix that was maybe selected for something in our ancestors and now contributes nothing except acting as a reservoir of gut flora after a course of antibiotics

