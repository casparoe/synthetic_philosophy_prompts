      Voss's neuroscience point is the most innovative but also the most vulnerable to Chen's category error objection. However, her follow-up (if causal works, why not ontological?) is the killer point. I should rate that highly.

      *Refining the "Overlooked" section:* They both treat the proposition as something to be *built* from parts. They overlook the possibility that the proposition is the primary unit of reality (Wittgensteinian/Tractarian view) or that unity is a feature of the *judgment* (Kantian view), not the world. Also, the shadow of Bradley's Absolute: if relations are unintelligible, reality must be One. Neither addresses whether accepting the regress forces Monism.

