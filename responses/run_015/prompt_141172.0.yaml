prompt: |-
  Hey — I'm a philosophy PhD student (mostly phil. mind / phil. cognitive science) and I'm putting together the handout for our reading group on higher-level causation. I want to run the whole thing through Hofstadter's careenium setup instead of the usual human case, because the human case drags in consciousness and qualia and I want that off the table for a couple of sessions.

  Recap for whoever ends up reading this: Careenia is made of some rubbery goo whose bits come in two flavors, plain balls and "simmballs". Simmballs clump into stable patterns, and some of those clumps are simms — structures you can read as symbols, that can be copied, mutated, recombined, and that are about things (a simm for a predator, a simm for a direction, whatever). So the question is whether the simm-level story does any causal work: when a simm gets a clump of simmballs to move, is that just our way of tracking the balls shoving each other around, or is the pattern itself doing some of the pushing?

  What I want from you is the spec, not the scoreboard. Before I assign another paper on mental causation / special-science causation / whatever, I want the list: what does an account of simm-level causation have to deliver to count as adequate — which cases it has to get right, which distinctions it can't collapse, which facts about the substrate it has to be consistent with — with the case or consideration under each one. To fix what "adequate" means: good enough to let me keep using symbol-level explanations in cognitive science (a representation caused the behavior, the plan drove the search) without that being hand-wavy, and good enough to say what an experiment on Careenia would even settle.

  Some things I think belong on the list, so you can tell me which are real requirements and which are just my own prejudices:

  - differentiate between a couterfactual-dependence test and a "who's really producing the motion" test, and say why we should care about the one we care about;
  - handle the scramble case — swap which simmballs realize the simm, keep the pattern, and the simm-level story doesn't budge — without that automatically making the simm causally idle;
  - handle near-misses: clumps that are structurally almost a simm but aren't about anything (junk patterns, malformed copies, a simm that's been mutated one step too far), and say which side of the line the causal work falls on;
  - handle two structurally identical clumps where only one has the history to be about something — does aboutness matter to the causation, or only the shape?;
  - say what I've started calling the read/write asymmetry: tons of patterns can be read off the substrate after the fact, but only some of them let you predict what the goo does next. Which ones, and why?;
  - the bookkeeping condition, as I've been calling it: the simm-level dynamics should be able to run on its own, without you having to peek at the balls to figure out the next simm state. Is that necessary for genuine simm-level causation, or is it just what a nonreductive physicalist wants for Christmas?;
  - not cheat: no extra shove added to the substrate's physics, but also no quiet slide into the simms being decorations, and no accepting that every single simmball movement has two independent sufficient causes.

  Also: mark which items are non-negotiable and which are preferences of one camp (I suspect "no overdetermination" is an identity-theory taste and "simm-level laws must be exceptionless" is a Fodor-ish taste, but tell me if I have it backwards), tell me which subset of the requirements can't all be satisfied together — that's the part I most want, since if the list itself is inconsistent that's the interesting result — and say which single requirement knocks out the most candidate views.

  Then, briefly, like three lines each max: how epiphenomenalism, a straight reductive identity story, the "the simm just is what the simmballs are doing" pattern view, an interventionist/difference-making account, and the "the simm is a program the substrate is running" view do against the list. I really do care much more about the criteria than the scoring — I can do the scoring myself once I know what I'm asking for. Page-ish is plenty, a table is fine, and please don't give me a reading list, I've got the canon, I just need to know what I'm supposed to be demanding of it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Philosophy PhD student (phil. mind/cog sci).
      *   **Task:** Create a specification ("spec") for an adequate account of higher-level causation using Hofstadter's *Careenium* analogy (simmballs/simms) instead of the human mind.
      *   **Goal:** Define what counts as "adequate" to justify symbol-level explanations in cognitive science without hand-waving, and to determine what experiments on Careenia would settle.
      *   **Specific Inputs:** The user provides a list of potential requirements (counterfactuals vs. production, multiple realizability/scramble, near-misses, history/aboutness, read/write asymmetry, bookkeeping/autonomy, no cheating/overdetermination).
      *   **Specific Outputs:**
          1.  Refine the list of requirements (distinguish non-negotiable vs. camp preferences).
          2.  Identify inconsistencies/trade-offs within the list (which subset can't be satisfied together).
          3.  Identify the "killer constraint" (which requirement knocks out the most views).
          4.  Briefly score 5 specific views against the list (Epiphenomenalism, Reductive Identity, Pattern View, Interventionist, Computational/Program View).
          5.  **Constraints:** Page-ish length, table is fine, *no reading list*, 3 lines max per view score.
      *   **Tone:** Professional, academic, precise, engaging with the specific Careenium mechanics.

  2.  **Deconstruct the Careenium Scenario:**
      *   *Substrate:* Rubbery goo, plain balls, simmballs.
      *   *Higher Level:* Simms (stable clumps/patterns), readable as symbols (about predators, directions).
      *   *Problem:* Do simms cause movement, or is it just balls shoving balls?
      *   *Constraint:* Physical closure (no extra shoves).

  3.  **Evaluate the User's Proposed Requirements:**
      *   *Counterfactual vs. Production:* Crucial. Interventionism focuses on the former; Production/Process focuses on the latter.
      *   *Scramble (Multiple Realizability):* Essential for non-reductivism. If swapping balls kills causation, simms aren't real.
      *   *Near-misses:* Boundary condition problem. Vagueness vs. sharp cutoff.
      *   *History/Aboutness:* Externalism vs. Internalism. Does causal power depend on semantic history or just current shape?
      *   *Read/Write Asymmetry:* Predictive power. Distinguishes real patterns from "gerrymandered" ones (Goodman/Grue style).
      *   *Bookkeeping (Autonomy):* Fodor's special science laws. Can we predict simm-state $t+1$ from simm-state $t$ without micro-details?
      *   *No Cheating (Closure/Overdetermination):* Physical closure is standard. Overdetermination is the contentious bit.

  4.  **Drafting the Spec (The "List"):**
      *   Need to categorize these into *Non-Negotiables* (Physical Closure, Predictive Utility) and *Camp Preferences* (Autonomy, No Overdetermination, Semantic Causation).
      *   *Insight:* The tension usually lies between *Physical Closure* + *Causal Efficacy* + *Distinctness*. You can't have all three without overdetermination or identity.

  5.  **Identifying Inconsistencies (The "Trilemma"):**
      *   The classic exclusion problem.
      *   In Careenium terms: If balls determine motion (Closure), and Simms are distinct from balls (Non-reductivism), and Simms cause motion (Efficacy), then motion is overdetermined.
      *   *Trade-off:* You usually have to sacrifice "Bookkeeping/Autonomy" (Fodor) or "No Overdetermination" (Kim) or "Distinctness" (Identity Theory).
      *   *Specific Tension:* "Bookkeeping" (exceptionless simm-laws) is very hard to square with "Physical Closure" in a messy substrate like goo unless the simms are *defined* by the physics (reduction) or we accept systematic overdetermination.

  6.  **Identifying the "Killer Constraint":**
      *   *Physical Closure* is usually the hard stop. If you violate it, you're dualist/magical.
      *   *However*, for the specific goal of *cognitive science explanation*, the "Bookkeeping/Autonomy" condition is often the one that kills *reductive* accounts (because they lose the generalization) and *epiphenomenalist* accounts (because they lose the causation).
      *   *Actually*, the strongest filter for *higher-level* causation specifically is the **Scramble/Multiple Realizability + Causal Efficacy** combo. If the causation rides on the pattern, swapping the substrate shouldn't change the outcome. But if the physics is local, how does the pattern push?
      *   *Decision:* The "No Overdetermination" constraint combined with "Physical Closure" is the classic exclusion hammer. But for a *cog sci* student wanting to save symbol-level explanation, the **Bookkeeping/Autonomy** requirement is the one that kills the most "cheap" non-reductive views (like loose supervenience without law-like stability). Let's flag **Physical Closure + Distinctness + Efficacy** as the inconsistent triad, making "No Overdetermination" the specific constraint that forces a choice.

  7.  **Scoring the Views (3 lines max):**
      *   *Epiphenomenalism:* Fails efficacy. Simms are shadows.
      *   *Reductive Identity:* Fails Scramble/Bookkeeping (too tied to micro). Saves closure.
      *   *Pattern View (Dennett-ish):* Good on Read/Write, shaky on Production.
      *   *Interventionist (Woodward-ish):* Good on Counterfactuals, sidesteps Production/Overdetermination.
      *   *Computational/Program:* Good on Bookkeeping, risks ignoring substrate constraints.

  8.  **Refining the Output Structure:**
      *   Intro: Acknowledge the Careenium setup (smart move to avoid qualia).
      *   Section 1: The Spec (Categorized requirements).
      *   Section 2: The Inconsistencies (The Trilemma).
      *   Section 3: The Killer Constraint.
      *   Section 4: The Scorecard (Table or List, strictly 3 lines).
      *   Tone Check: Keep it dense, PhD-level, no fluff.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "History/Aboutness" point?
      *   *Correction:* Need to clarify if semantic content is causally relevant. This is the "Broad vs. Narrow" content debate. In Careenium, does the *meaning* of the simm move the balls, or just the shape? This is crucial for cog sci.
      *   *Check:* Did I distinguish preferences from non-negotiables?
      *   *Correction:* Make sure "Physical Closure" is non-negotiable. "No Overdetermination" is a preference (Kim-style). "Bookkeeping" is a preference (Fodor-style).
      *   *Check:* Inconsistency. The tension between Bookkeeping (exceptionless higher-level laws) and Physical Closure (micro-variability) is the real technical headache in a system like Careenium.
      *   *Check:* Length. Keep it tight.

  10. **Final Polish:** Ensure the Careenium terminology (simmballs, simms, goo) is used consistently to ground the abstract points. (e.g., instead of "neurons," use "simmballs").

  *(Self-Correction on the "Killer Constraint")*: Actually, for a *cognitive scientist* wanting to use symbol-level explanations, the **Bookkeeping/Autonomy** condition is the most demanding. Reductive accounts fail it (too much detail). Epiphenomenalism fails it (no causal chain to track). Interventionism passes it easily but might feel "thin." I will highlight the tension between Bookkeeping and Closure.

  *(Refining the Inconsistency)*: The classic Exclusion Argument is the most relevant. Closure + Efficacy + Non-Identity = Overdetermination. If you ban Overdetermination, you must drop one of the others.

