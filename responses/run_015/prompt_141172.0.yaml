answer: |-
  ### The Careenium Causation Spec

  You are right to swap humans for Careenia. It isolates the *causal* exclusion problem from the *phenomenal* hard problem. Below is the specification for an adequate account of simm-level causation, categorized by constraint type, followed by the inconsistency analysis and the brief scorecard.

  #### I. The Requirements Spec

  **Non-Negotiables (Physical & Explanatory Baseline)**
  1.  **Substrate Closure:** No extra shoves. Every simmball movement must be fully accounted for by the laws of the goo and prior simmball states. *Case:* A simm cannot "add energy" to the system; it must ride the physics.
  2.  **Read/Write Asymmetry:** The account must distinguish between patterns that merely *describe* the state (read-only) and patterns that *constrain* future states (read/write). *Case:* A "grue-like" gerrymandered pattern of simmballs predicts nothing; a simm must support counterfactuals about the goo's evolution.
  3.  **Scramble Stability (Multiple Realizability):** Causal attribution must survive substrate swapping. *Case:* If you swap the specific simmballs realizing a "Predator" simm for different simmballs maintaining the same pattern, the behavioral output (e.g., fleeing) must remain causally attributed to the "Predator" simm, not the specific balls.

  **Camp Preferences (Theoretical Commitments)**
  4.  **Bookkeeping/Autonomy (Fodor-ish):** Simm-level dynamics should be computable from simm-level states without referencing simmball microstates. *Preference:* High for classical cog sci; low for connectionists.
  5.  **No Overdetermination (Kim-ish):** The simm-level cause and the simmball-level cause should not be two independent sufficient causes for the same effect. *Preference:* High for physicalists fearing "too many causes"; low for compatibilists.
  6.  **Semantic Relevance (Externalist):** The *aboutness* of the simm (its history/reference) must do work, not just its shape. *Case:* Does a perfect structural duplicate of a "Predator" simm, created by random noise with no history of predators, cause the same flight behavior *as a predator representation*?
  7.  **Production vs. Difference-Making:** Does the simm *produce* the motion (mechanistic) or just mark a dependency (counterfactual)? *Preference:* Production favors mechanism; Difference-Making favors interventionism.

  #### II. Inconsistencies & Trade-offs

  **The Inconsistent Triad**
  You cannot satisfy **Substrate Closure**, **Simm Efficacy**, and **Non-Identity** simultaneously without violating **No Overdetermination**.
  *   If the simmballs determine the motion (Closure), and the simm is distinct from the simmballs (Non-Identity), but the simm also causes the motion (Efficacy), the motion is causally overdetermined.
  *   *Resolution:* Most accounts sacrifice **Non-Identity** (Reduction) or **No Overdetermination** (Compatibilism) or **Simm Efficacy** (Epiphenomenalism).

  **The Bookkeeping Tension**
  **Bookkeeping/Autonomy** is in tension with **Substrate Closure** in a messy substrate like goo.
  *   If simm-laws are exceptionless (Bookkeeping), they must abstract away from micro-details. But if micro-details determine the physics (Closure), exceptionless simm-laws are only possible if the substrate is engineered to guarantee them (which Careenia might not be).
  *   *Result:* Demanding strict Bookkeeping often forces you toward a Computational/Program view that risks ignoring physical implementation constraints.

  **The Killer Constraint**
  **Scramble Stability + Substrate Closure.**
  This knocks out the most views. It demands that the causation reside in the *pattern* (allowing substrate swap) while admitting the *physics* resides in the *balls* (closure). Pure Reductive Identity fails Scramble (the simm *is* the balls). Pure Epiphenomenalism fails Efficacy. Only views that treat the pattern as a real physical constraint (e.g., Interventionist or certain Non-Reductive Physicalist views) survive, but they must explain *how* the pattern constrains the balls without violating Closure.

  #### III. View Scorecard

  | View | Performance Against Spec |
  | :--- | :--- |
  | **Epiphenomenalism** | Passes Closure and No Overdetermination easily. Fails Simm Efficacy and Read/Write Asymmetry (simms are read-only shadows). Useless for cog sci explanation. |
  | **Reductive Identity** | Passes Closure and Production. Fails Scramble Stability (causation reduces to specific balls) and Bookkeeping (no autonomous simm-laws). Loses the generalization. |
  | **Pattern View (Dennett)** | Passes Read/Write and Scramble. Weak on Production (patterns are "real" only relative to an observer). Risks making causation observer-dependent. |
  | **Interventionist (Woodward)** | Passes Scramble and Read/Write (focuses on dependencies). Sidesteps Production/Overdetermination debates. May feel too "thin" for mechanistic cog sci. |
  | **Computational/Program** | Passes Bookkeeping and Scramble perfectly. Risks violating Closure if "running a program" implies top-down constraint without physical mechanism. |
