  (iv) Alternatively, you could reject (1) to allow impersonal comparisons, but that costs you the person-affecting constraint and implies the Repugnant Conclusion.
  (v) The demographic reshuffle in (3) is standard modeling, but the ethical validity of (1) and (2) is a live controversy with no consensus in population ethics.
