          *   *Verdict:* Distortion/Context Dependent. Single-shot is load-bearing for the *paradox*, but iterated settings allow for *precommitment strategies* which mimic the effect without requiring false belief.

  5.  **Developing the Residue Report:**

      *   *Point 1:* **Distortion.** Standard POMDP belief is a sufficient statistic. To get "false belief," you need to augment the state space to include a "declared belief" or "internal commitment state" distinct from the Bayesian belief.
