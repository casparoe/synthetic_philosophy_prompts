answer: |-
  This is a sophisticated pedagogical challenge. Your professor is right: the standard Dollar Auction often teaches students to distrust the instructor rather than distrust their own decision-making processes. To fix this, we need to shift the locus of the "trap" from the *rules* (which look rigged) to the *psychology of the sequence* (where every step feels justified).

  Your two ideas are excellent. **Private Value** solves the "why bid at all?" problem by making entry rational. **Growing Pot** solves the "why keep going?" problem by making the target move.

  Here is a complete 50-minute lesson plan designed for 16 students (8 Teams of 2), split into two simultaneous conditions.

  ### **1. Materials & Setup**

  *   **Currency:** "Lab Points" (tracked on a simple score sheet). Tell them top scorers get entry into a raffle for a $20 coffee card (or extra credit, per dept rules). This creates skin in the game without cash.
  *   **Endowment:** Every team starts with **300 Points**.
  *   **The Matchups:** 8 Teams total.
      *   **Matchups 1 & 2 (4 Teams):** Variant A (Private Value).
      *   **Matchups 3 & 4 (4 Teams):** Variant B (Growing Pot).
  *   **Physical Props:**
      *   4 Envelopes labeled "Variant A" containing Value Cards (see below).
      *   4 Whiteboards or large sheets of paper for tracking bids publicly.
      *   A timer projected on the screen.

  ### **2. The Rules (Read these verbatim, no theory yet)**

  **Common Rules (Both Variants):**
  1.  **The Auction:** This is an **All-Pay Auction**. The highest bidder wins the Prize. **However, both the highest bidder AND the second-highest bidder must pay their final bids.** The loser gets nothing and still pays.
  2.  **Bidding:** Bids must increase by increments of 10 points.
  3.  **Bankruptcy:** If you exceed your 300-point endowment, you are eliminated immediately and lose all points.
  4.  **Time:** You have 10 minutes per round. If time runs out, the current highest bidder wins at current price; second highest still pays.

  **Variant A Instructions (Private Value):**
  *   "One member of your team draw a card from the envelope. This is your **Redemption Value**. Only you know this number. If you win the auction, you receive points equal to this card *plus* you keep your endowment minus your bid. If you lose, you just pay your bid."
  *   *Prep:* Put 4 cards in the envelopes. Values should be **150, 160, 170, 180**. (Tight distribution ensures both sides feel justified entering).

  **Variant B Instructions (Growing Pot):**
  *   "The Prize starts at **100 Points**. Every time a bid is placed, the Prize increases by **50% of the bid amount**. (e.g., If you bid 20, the Pot grows by 10)."
  *   "You do not have a private value card. The Prize is the Prize."

  ---

  ### **3. Minute-by-Minute Timeline (50 Minutes)**

  | Time | Activity | TA Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup & Grouping** | Divide into 8 teams of 2. Assign Matches 1-4. Hand out Endowment Sheets. **Do not explain the theory.** Just explain the mechanics. Check for understanding on the "All-Pay" rule (crucial). |
  | **05-07** | **Draw Values / Setup** | Variant A teams draw cards secretly. Variant B teams write "Pot: 100" on their board. |
  | **07-22** | **The Auction (15 mins)** | Start timer. Circulate aggressively. Watch for collusion ("let's bid 10 and split"). If you see it, remind them "This is a competition against the other team." Encourage them to announce bids loudly. |
  | **22-27** | **Settlement** | Teams calculate final scores (Endowment - Bid + Prize if won). Collect sheets. |
  | **27-30** | **The Reveal** | Write results on board. <br>Var A: Reveal the hidden Value Cards. <br>Var B: Calculate final Pot size. <br>Highlight teams with **Negative Scores**. |
  | **30-50** | **Debrief** | See script below. |

  ---

  ### **4. The Debrief Script (Mapping Experience to Theory)**

  **Phase 1: The Gut Check (5 mins)**
  *   *Ask the losers in Variant A:* "Look at your final bid. Look at your Value Card. You bid more than the prize was worth to you. At what specific bid did you realize you were making a mistake?"
      *   *Likely Answer:* "I never did," or "At the very end."
      *   *Point:* "If you didn't realize it until the end, then every step before that felt rational. That's the trap."
  *   *Ask the winners:* "Do you feel like you won? Or do you feel relieved it's over?"
      *   *Point:* "Winning an escalation often feels like surviving, not thriving."

  **Phase 2: The Mechanics of Rationality (10 mins)**
  *   *Draw a Decision Tree on the board.*
  *   "Let's look at Variant A. Team 1, your value was 160. You bid 100. Team 2 bid 110. You are now the second-highest bidder."
  *   "If you stop: You lose 100 points. (Score: -100)"
  *   "If you bid 120: You might win 160. (Score: +40). Or you might get outbid and lose 120."
  *   "From the perspective of *that specific moment*, bidding 120 is the rational choice to minimize loss. You weren't stupid at step 5. You were rational at step 5. The problem is that Step 6 creates the same logic."
  *   *Key Phrase:* **"Local Rationality leads to Global Irrationality."**

  **Phase 3: Comparing Variants (5 mins)**
  *   *Compare Total Points Burned:* Which variant had higher total bids?
  *   *Prediction:* Variant B (Growing Pot) often sustains bidding *longer* because the "stop price" keeps moving. Variant A often creates deeper *losses* (bids > value) because of the panic to avoid the "loser pays" penalty.
  *   *Connect to Real World:*
      *   **Variant A (Private Value):** Mirrors **Litigation** or **Bidding Wars**. You know what the case/company is worth, but you've spent so much on legal fees (sunk bids) you can't stop.
      *   **Variant B (Growing Pot):** Mirrors **Startups** or **PhD Degrees**. The more you put in, the more "valuable" the completion seems ("I've built so much code, the app must be worth millions now"). The goalpost moves.

  ---

  ### **5. Prediction: Which Blows Up More?**

  *   **Variant A (Private Value):** Expect **sharper losses**. Teams will bid past their private value because the pain of being the "second highest payer" is immediate and certain. The escalation is driven by *loss aversion*.
  *   **Variant B (Growing Pot):** Expect **higher total volume**. Teams will bid longer because the math technically justifies it for longer ("The pot is now 200, so a 150 bid is still rational"). The escalation is driven by *optimism bias*.
  *   **Verdict:** Variant A feels more like a "trap." Variant B feels more like a "mistake." Both are escalation.

  ---

  ### **6. What Will Predictably Go Wrong (And Fixes)**

  **1. The "Game Theory" Killjoy**
  *   *Problem:* One student raises their hand at minute 2 and says, "The Nash Equilibrium is not to bid. We refuse to play."
  *   *Fix:* Acknowledge them. "You are theoretically correct. But in the real world, competitors *do* bid. If you sit out, you get 0 points. If you bid and manage your risk, you might get raffle tickets. This simulates a market where not everyone is perfectly rational."
  *   *Backup:* If a match refuses to start, merge them into another match as observers, or offer a 10-point "participation bonus" just for placing one bid.

  **2. Collusion**
  *   *Problem:* Two teams agree to bid 10 and 20, split the prize, and minimize payment.
  *   *Fix:* This is actually a great teaching moment for the debrief (Cartels/Collusion). But during the game, remind them: "You cannot communicate with the other team. If we catch you coordinating, you are disqualified."

  **3. Infinite Bidding (The "It's Just Points" Problem)**
  *   *Problem:* A team bids 1000 points because they don't care about the score.
  *   *Fix:* The **Hard Cap** (300 points endowment). If they hit 0, they are physically out. Enforce this strictly. "You have 10 points left. If you bid 20, you are bankrupt and ejected."

  **4. Confusion on the "Second Highest Pays" Rule**
  *   *Problem:* Losers forget they have to pay.
  *   *Fix:* Write the rule in **BOLD** on the board. Before the first bid, ask a random student: "If I bid 50 and you bid 40 and stop, how much do you pay?" Make them answer correctly before starting.

  ---

  ### **7. Limitations: What This Game Can't Reproduce**

  Be honest with them in the last 3 minutes. This game is a model, not reality.

  1.  **Reputation:** In the game, you never see these people again. In real life (wars, careers), you escalate to save face or maintain reputation.
  2.  **Agency:** In the game, *you* are spending *your* points. In real escalation (e.g., managers spending company money), the pain is divorced from the decision-maker.
  3.  **Uncertainty of Value:** In Variant A, they knew their value exactly. In real life (e.g., "Will this drug work?"), we don't know the value, which makes escalation even easier to justify.

  **Closing Line for the Class:**
  "The point of today isn't to say 'don't invest.' The point is that when you feel the urge to 'just fix the loss you've already incurred,' that is the exact moment you need to pause. The money you spent to get here is gone. The only question that matters is: Is the *next* step worth it on its own?"
