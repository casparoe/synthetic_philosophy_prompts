answer: |-
  Your hypothesis is correct, but it requires a sharper edge. This is not merely a case of "several questions sharing a name," nor is it a purely verbal dispute. It is a **functional conflation of semantic definition and epistemic utility**. The impasse exists because the literature demands a single concept perform two incompatible roles: acting as a *semantic relation* (which requires omniscience to evaluate) and as an *epistemic indicator* (which must be evaluable in ignorance).

  The impossibility theorems you cite are not obstacles to be overcome by better math; they are the formal proof that these two roles cannot be collapsed into one measure without contradiction.

  ### The Diagnosis: The Semantic-Epistemic Gap

  You identify three jobs: Logical (God's-eye), Epistemic (justification), and Practical (decision-theoretic). I argue these reduce to two conflicting demands: **Truth-Dependency** vs. **Evidence-Accessibility**.

  1.  **The Logical Job (Truth-Dependency):** This is the domain of Niiniluoto and Oddie. They define verisimilitude as a distance function in a state-space. It is rigorously semantic. $Vs(A, T)$ is well-defined *if* you know $T$ and the metric. But as Miller showed, this relation is almost always opaque to the inquirer. If verisimilitude is purely semantic, it cannot answer the Pessimistic Meta-Induction (PMI), because the realist cannot claim *knowledge* of high verisimilitude, only its existence.
  2.  **The Epistemic Job (Evidence-Accessibility):** This is what the Realist actually needs to block the PMI. We need a quantity $E(A, e)$ based on evidence $e$ that correlates with $Vs(A, T)$. The literature tries to bake this into the definition of verisimilitude itself (e.g., by restricting consequences to "relevant" ones as Schurz does, or by claiming content increases track truth).

  The impasse arises because adequacy conditions are drawn indiscriminately from both pools. We demand a measure be sensitive to the Truth (Logical) but also sensitive to what we can justify (Epistemic). The impossibility results show that no function can satisfy the desiderata of *being determined by the truth* and *being estimable without the truth* simultaneously, unless the world is unnaturally simple.

  ### Engaging the Accounts

  Your reading of the splintered families supports this diagnosis when we look at what breaks in each:

  *   **Likeness Approaches (Niiniluoto/Oddie):** They commit to the Logical job. They accept that verisimilitude is interest-relative regarding the metric (which predicates matter?). Niiniluoto attempts to bridge the gap by arguing that *estimated* truthlikeness converges to *actual* truthlikeness. But this relies on inductive assumptions that the PMI specifically targets. The metric dependence you note is not a defect; it is the admission that the "Logical" ordering is not unique but relative to a conceptual scheme. This kills its utility as a universal realist shield.
  *   **Content Approaches (Miller/Kuipers):** Miller is the clearest here. He essentially concedes that truthlikeness is not epistemically accessible. He separates the *definition* of truthlikeness from the *estimation* of it. This preserves the Logical job but abandons the Epistemic one. Kuipers tries to keep them together via "structuralist" constraints, but this merely pushes the epistemic assumption into the definition of "structure."
  *   **Consequence Approaches (Schurz/Gemes):** These try to solve the Epistemic job by filtering the consequence class. By restricting consequences to "relevant" ones, they attempt to make the measure sensitive to what scientists actually care about (the Practical job). But "relevance" is not a logical property; it is pragmatic. When Schurz defines relevant consequences, he is implicitly importing the Practical/Epistemic context into the Semantic definition. This is why these measures often fail the "Logical" adequacy conditions (e.g., they may violate the condition that adding a true consequence always increases truthlikeness, if that consequence is deemed irrelevant).

  The disagreement is, at bottom, about **what truthlikeness is for**. The logicians want a coherent semantic relation. The realists want a warrant for induction. The literature treats these as the same target. They are not.

  ### The Metric and Interest Question

  You ask if the dependence on a metric or question-set is a discovery or an artifact. It is a **discovery about the concept**: there is no context-independent "closeness to truth."

  Closeness is always closeness *with respect to* a set of features. In possible worlds semantics, this is the choice of primitive predicates. In consequence approaches, it is the choice of relevant problems. The literature treats this as a bug because it seeks a "One True Measure." But if your hypothesis is right, this variability is the trace of the Practical job encroaching on the Logical one. A God's-eye view requires a "God's vocabulary." Since we lack that, any measure we construct is inherently interest-relative. This does not invalidate the Logical job, but it severs its link to the Realist's Epistemic job. The Realist cannot use an interest-relative measure to prove that past theories were *objectively* approximately true, only that they were approximately true *relative to our current interests*.

  ### The Diachronic Mismatch

  Your second thought is the critical lever. The realist needs a **diachronic** claim: *Theory succession tracks increasing verisimilitude.* The literature provides **synchronic** orderings: *Theory A is closer than Theory B.*

  Even if we had a perfect synchronic measure, it does not guarantee convergence. A sequence of theories could be ranked $Vs(T_1) < Vs(T_2) < Vs(T_3)$ relative to $T$, without there being any method to generate that sequence. The realist needs a theory of **search**, not just a theory of **distance**. The verisimilitude programme has spent fifty years refining the ruler while ignoring the path. This is why Structural Realism often feels more viable to working scientists; it offers a diachronic claim (retention of structure) rather than a synchronic one (distance to truth).

  ### What Counts as Progress?

  Given this diagnosis, expecting a new formal measure that satisfies all existing adequacy conditions is futile. Those conditions are inconsistent because they belong to different jobs. Progress requires:

  1.  **Formal Separation:** We need a formal distinction between *Actual Verisimilitude* ($Vs_{actual}$) and *Estimated Verisimilitude* ($Vs_{est}$). The literature often conflates them. $Vs_{actual}$ is the Logical job (semantic). $Vs_{est}$ is the Epistemic/Practical job (methodological). The impossibility theorems apply to attempts to make $Vs_{est}$ a perfect proxy for $Vs_{actual}$. Progress lies in modeling the *correlation* between them, not their identity.
  2.  **Diachronic Modeling:** Stop ranking static propositions. Start modeling theory change as a search process in a landscape. Use agent-based modeling or learning theory to ask: *Under what conditions does a method of theory revision converge on high $Vs_{actual}$?* This shifts the question from "What is truthlikeness?" to "What methods track truthlikeness?"
  3.  **Acceptance of Relativity:** Abandon the quest for a vocabulary-independent measure. Acknowledge that verisimilitude is relative to a conceptual framework. The realist claim then shifts from "Our theories are closer to the Truth" to "Our theories are closer to the Truth *within the framework that yields successful intervention*." This is weaker, but it is the only version that survives the PMI.

  ### Conclusion

  Your hypothesis is right: the field is stuck because it is trying to solve three problems with one equation. But the deeper diagnosis is that the **Epistemic job is impossible for a Semantic definition to fulfill alone**. The "impossibility" is the sound of the Realist's needs crashing against the Logician's constraints.

  Progress will not come from a new measure. It will come from decoupling the semantic definition of truthlikeness from the methodological claim of convergence. If you are working on scientific realism, you should treat verisimilitude not as a property to be defined, but as a target to be tracked, and focus your energy on the *tracking mechanisms* (the diachronic, structural, or decision-theoretic bridges) rather than the *target's geometry*. The geometry is underdetermined; the tracking is where the realism lives or dies.
