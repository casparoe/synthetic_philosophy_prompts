answer: |-
  The conceptual instability of "Western values" arises from its attempt to function simultaneously as a descriptive category (identifying a cultural bloc) and a normative category (prescribing moral truths). When treated as an **essentialist axiological cluster**, the concept claims there is a fixed set of commitments (e.g., individualism, rationalism, liberal democracy) that constitutes the essence of "the West." The logical circularity here is immediate: the West is defined by these values, but the values are validated by their historical emergence in the West. To break this circle, proponents often anchor the values in a specific intellectual lineage (e.g., the Enlightenment or Judeo-Christian tradition). However, this creates the problem of **exclusionary inclusion**. To maintain the illusion of a unified cluster, internal traditions that contradict the dominant liberal-consensus—such as anarcho-syndicalism (which rejects liberal state structures) or radical religious pacifism (which rejects secular rationalism)—must be categorized as deviations or outliers rather than constitutive elements. The category remains coherent only by pruning its own historical diversity, defining "Western" not by what *is* present, but by what fits the sanitized ideal.

  Shifting to a **family-resemblance concept** attempts to solve this by suggesting there is no single core, only overlapping traits dominant in a geopolitical bloc. This avoids rigid essentialism but introduces a different failure mode: arbitrariness. If "Western values" are simply whatever values happen to be dominant in Western nations at a given time, the term loses its critical normative force. It becomes purely descriptive, meaning any policy enacted by Western governments (including illiberal ones) could retrospectively qualify as a "Western value." This approach solves the exclusion problem by allowing heterogeneity, but at the cost of making the concept politically toothless; it can no longer judge whether the West is living up to its values, because whatever the West does defines the values.

  The rhetorical double-move regarding **normative jurisdiction** (universal claim vs. particular identity) relies on a hidden teleological theory of moral progress. Conceptually, this works by positing that the West is not merely *different*, but *advanced*. The values are presented as universal truths that apply to all humanity, but they are currently best embodied in Western institutions. This allows the speaker to claim universal authority ("these rights are for everyone") while maintaining particularist solidarity ("these are *our* achievements"). The tension is resolved by smuggling in a philosophy of history where modernization equals Westernization. The particular becomes the vanguard of the universal. Without this hidden assumption of progress, the claim collapses into contradiction: one cannot logically assert that a value is binding on all cultures precisely because it belongs to one specific culture.

  Ultimately, the category lacks philosophical coherence but retains high rhetorical utility. It functions less as a rigorous conceptual tool and more as a boundary-making mechanism that legitimizes specific power structures by framing them as the culmination of moral history.

