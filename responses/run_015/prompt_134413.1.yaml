          *   Probe 2: Resolve-then-switch (tests dynamic consistency/pre-commitment).
      *   **User's Hypothesis:** It's not one disagreement. It's verbal (definition of rationality), empirical (what subjects believe), and contextual (individual vs. institutional).
      *   **Task:** Validate/critique the hypothesis. Identify load-bearing threads. Distinguish concepts that might dissolve fights. Suggest what counts as progress. Avoid taking sides (no verdict).

  2.  **Deconstruct the Three Camps & The Stagnation:**
      *   *Camp 1 (Coherence/SEU):* Rationality = Consistency. If you violate SEU, you are vulnerable (Dutch Book, Money Pump). Ellsberg preferences are errors.
      *   *Camp 2 (Axiomatizers/Non-SEU):* Rationality = Coherent representation of *actual* attitudes. Ambiguity aversion is a primitive. Models (MEU, CEU, Smooth) capture this.
      *   *Camp 3 (Debunkers/Psychologists):* The preference isn't stable or normative. It's context-dependent (comparative ignorance, suspicion of experimenter).
      *   *Stagnation:* Why? Because they are answering different questions. Camp 1 asks "Is this logically consistent?" Camp 2 asks "Can we model this behavior?" Camp 3 asks "Is this behavior real/stable?"

  3.  **Evaluate the User's Hypothesis:**
      *   *Verbal/Normative:* Yes. "Rationality" is the battleground. Coherence vs. Ecological validity.
      *   *Empirical:* Yes. Do subjects suspect deception? (Probe 1 addresses this).
      *   *Individual vs. Institutional:* Interesting angle. Justification vs. Optimization.
      *   *Critique:* The user might be underestimating the *dynamic consistency* issue. That's the real hammer Camp 1 uses against Camp 2.

  4.  **Identify Load-Bearing Threads:**
      *   **Thread 1: Dynamic Consistency vs. Static Coherence.** This is the biggest technical divide. Camp 2 models often fail dynamic consistency (you want to change your mind later). Camp 1 says that makes you irrational. Camp 2 says "so what, ambiguity changes information value."
      *   **Thread 2: Ontology of Probability.** Is probability a state of mind (Bayesian/SEU) or a property of the environment (Frequentist/Ambiguity)? Ellsberg highlights the clash.
      *   **Thread 3: The "Deception" Confound.** Camp 3's strongest point. If removed, does the effect persist? (Literature says yes, but weaker).
      *   **Thread 4: Normative vs. Descriptive.** Camp 1 is mostly normative. Camp 2 tries to be both. Camp 3 is descriptive.

  5.  **Address the "Clean Distinctions":**
      *   *Ambiguity Aversion vs. Insensitivity:* Epstein/Zhang type distinctions. Some models separate "perception of ambiguity" from "attitude toward ambiguity."
      *   *Second-Order Risk vs. Ambiguity:* Smooth Ambiguity (Klibanoff et al.) treats ambiguity as risk over priors. If you are risk-averse over priors, you look ambiguity averse. This bridges Camp 1 and 2 but shifts the burden to why risk aversion applies differently to priors than outcomes.
      *   *Competence vs. Uncertainty:* Heath & Tversky (Competence Hypothesis).

  6.  **Determine What Counts as Progress:**
      *   *Experiments (Probe 1):* Necessary but insufficient. We know the effect persists without deception, but the *degree* changes.
      *   *Dynamic Results:* Crucial. If Camp 2 can't solve dynamic consistency without collapsing to SEU, that's a major theoretical limit. (Seo & Siniscalchi, etc.).
      *   *Changing the Question:* Moving from "Is it rational?" to "When is it adaptive?" (Evolutionary/Heuristic perspective).
      *   *Formal Equivalence:* Some models are mathematically equivalent under certain conditions, but the *interpretation* differs.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, peer-to-peer, respectful of the depth of the user's knowledge. Avoid condescension.
      *   *Structure:*
