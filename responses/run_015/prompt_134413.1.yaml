answer: |-
  Your diagnosis is sharp, and you are right to feel that the stagnation is structural rather than merely empirical. The reason the argument hasn't moved since the 60s is not because the models have stopped improving (they haven't), but because the three camps are operating under incommensurable definitions of what a decision theory is *for*.

  Here is the diagnosis of the stalemate, identifying the load-bearing threads, the missing distinctions, and what would actually constitute progress.

  ### 1. Where Your Hypothesis Is Right (and Where It's Incomplete)

  You hypothesize three layers: verbal (normative standards), empirical (subject beliefs), and contextual (individual vs. institutional). You are correct on all three, but you are underestimating the **technical load-bearing thread** that keeps Camp 1 and Camp 2 locked in combat.

  It is not just a verbal fight about "rationality." It is a specific technical conflict over **Dynamic Consistency vs. Consequentialism**.

  *   **Camp 1 (Coherence)** relies on the principle that if you prefer $A$ to $B$ today, and you know that tomorrow certain states will be ruled out without changing the relative payoffs of $A$ and $B$, you should not prefer $B$ to $A$ tomorrow. Violating this makes you susceptible to a dynamic Dutch book (paying to switch, then paying to switch back).
  *   **Camp 2 (Axiomatizers)** generally sacrifices dynamic consistency to preserve ambiguity aversion. In Maxmin Expected Utility (MEU), for example, updating a set of priors via Bayes' rule often leads to time inconsistency. You might prefer the ambiguous urn today, but once some "bad news" arrives (even if uninformative about the specific bet), your set of priors shifts, and you regret the choice.

  **The Stalemate:** Camp 1 says, "If your theory requires you to be dynamically inconsistent, it's a theory of irrationality." Camp 2 says, "If your theory requires me to ignore the fact that the *source* of uncertainty matters, it's a theory of robots."

  This is the hard kernel. The verbal disagreement about "rationality" is just the surface manifestation of this technical trade-off. You cannot have full ambiguity aversion (of the MEU variety) and full dynamic consistency simultaneously without collapsing back into SEU (Seo & Siniscalchi, 2014). This is why the argument feels stuck: both sides have proven impossibility theorems against the other's ideals.

  ### 2. The Missing Distinction: Perception vs. Attitude

  You asked if there is a clean distinction that could dissolve one of the fights. There is one that Camp 2 has been chasing for 20 years, but it hasn't fully resolved the normative tension: **The separation of Ambiguity Perception from Ambiguity Attitude.**

  *   **The Problem:** In standard Ellsberg setups, we conflate "I don't know the probability" (Perception) with "I dislike not knowing the probability" (Attitude).
  *   **The Distinction:** Epstein and Zhang (2001) and later Klibanoff, Marinacci, and Mukerji (2005) tried to disentangle these. The "Smooth Ambiguity" model (KMM) essentially treats ambiguity as **second-order risk**. It says you *do* have a prior over the priors (Camp 1 is happy), but you are *more risk-averse* over those second-order probabilities than over first-order outcomes (Camp 2 is happy).

  **Why this doesn't settle it:** It pushes the normative question back one step. Camp 1 asks: "Why should rationality dictate different risk attitudes for the same monetary payoff depending on whether the risk comes from a known coin or an unknown urn?" If the money is the same, why is the utility curvature different?
  *   **Camp 2 Response:** Because the *informational content* is different. Learning the outcome of the known coin teaches you nothing else. Learning the outcome of the ambiguous urn might update your belief about the urn's composition, which affects future bets.
  *   **Camp 1 Counter:** Then model that option value explicitly. Don't hide it in a utility parameter.

  **Diagnosis:** The distinction between perception and attitude helps empirically (we can measure them separately), but it does not solve the normative standoff. It just moves the "brute fact" of ambiguity aversion from a non-additive capacity to a second-order risk premium.

  ### 3. Evaluating Your Probes

  **Probe 1 (Homemade Ambiguity):**
  This has effectively been run (e.g., Trautmann & van de Kuilen, 2015).
  *   **Result:** The effect persists, but it weakens significantly.
  *   **Implication:** This kills the strongest version of Camp 3 (that it is *purely* deception/suspicion). However, it leaves Camp 3 with the "Comparative Ignorance" defense (Heath & Tversky, 1991). Even if you filled the urn, you know you filled it randomly; the *feeling* of competence is lower than with the 50/50 urn.
  *   **Verdict on Probe 1:** It settles the "deception" confound, but not the "competence" confound. It forces Camp 3 to retreat to psychology, but doesn't kill the psychological argument.

  **Probe 2 (Resolve-then-Switch):**
  This is the stronger probe because it targets the **Dynamic Consistency** load-bearing thread.
  *   **The Setup:** If I am ambiguity averse today, but I know I can pay to switch after the composition is revealed (but before the draw), do I pay to switch?
  *   **The Conflict:** A sophisticated SEU agent knows the value of information is non-negative. An ambiguity-averse agent might view information as *costly* because it might resolve the ambiguity in an unfavorable way (shrinking the set of priors to a bad one).
  *   **Why it matters:** If subjects in your reading group say "I would pay to switch," they are admitting their initial ambiguity aversion was a framing error (Camp 1 wins). If they say "I would not pay to switch, I prefer the ignorance," they are asserting that ignorance has instrumental value (Camp 2 wins, but at the cost of dynamic consistency).
  *   **Diagnosis:** This probe forces the group to choose between **Instrumental Rationality** (maximize money) and **Expressive Rationality** (maintain a stance toward uncertainty). Most real-world ambiguity aversion collapses under this probe, which is why Camp 1 remains confident.

  ### 4. What Counts as Progress?

  Given this diagnosis, here is what would actually move the needle, ranked by likelihood of success:

  **1. Formal Equivalence (Low Value):**
  Proving Model X is a special case of Model Y. We have enough of this. It doesn't solve the normative dispute.

  **2. The "Institutional" Turn (High Value):**
  You hinted at this: *individual vs. institution.* This is the most promising path out of the stalemate.
  *   **Argument:** An individual might be SEU-rational, but an *institution* (a bank, a government, a committee) cannot justify decisions based on a single subjective prior that they cannot defend. Ambiguity aversion models (like MEU) are not descriptions of individual psychology, but **protocols for justification under disagreement**.
  *   **Progress:** If you reframe Camp 2's models as *social choice* mechanisms rather than *individual* utility functions, the "irrationality" charge from Camp 1 loses force. It's not that the agent is incoherent; it's that the agent is acting as a trustee for multiple potential selves or stakeholders who disagree on the prior.
  *   **Why this helps:** It accepts Camp 1's logic for the individual (coherence is good) but validates Camp 2's math for the organization (robustness is good).

  **3. Ecological Validity / Adaptive Rationality (Medium Value):**
  Stop asking if Ellsberg preferences are "coherent" and ask if they are **adaptive**.
  *   **Progress:** Show that in an evolutionary simulation or a repeated market setting, agents with Ellsberg preferences survive better than SEU agents because they avoid tail risks that SEU agents underestimate.
  *   **Why this helps:** It bypasses the "is it rational?" debate. It might be logically incoherent (Camp 1 wins) but ecologically dominant (Camp 2 wins). This changes the question from "What should I believe?" to "What works?"

  **4. The Dynamic Consistency Impossibility (High Value):**
  A rigorous proof that *any* model satisfying Ambiguity Aversion + Dynamic Consistency + Consequentialism must collapse to SEU.
  *   **Status:** We are close to this (Siniscalchi, 2009; Epstein & Schneider, 2003).
  *   **Progress:** If this is cemented, Camp 2 must explicitly admit: "Yes, we are dynamically inconsistent, and here is why that is acceptable." This forces honesty. Currently, Camp 2 tries to have it both ways. Admitting the cost would clarify the debate.

  ### 5. Summary Diagnosis

  You are correct that the disagreement is fragmented. But the fragmentation isn't just "verbal." It is rooted in a **trilemma**:

  1.  **Ambiguity Aversion** (Preferences like Ellsberg)
  2.  **Dynamic Consistency** (No regret over time)
  3.  **Consequentialism** (Only outcomes matter, not the history of the choice)

  **You can pick any two, but not all three.**
  *   **Camp 1** picks (2) and (3), drops (1). (SEU)
  *   **Camp 2** picks (1) and usually (3), drops (2). (MEU/Smooth)
  *   **Camp 3** says (1) is an illusion caused by violating the assumptions of (2) and (3) in the lab.

  **Where you should push your group:**
  Stop asking "Who is right?" Ask "Which constraint are we willing to drop?"
  *   If you care about **trading and finance**, you must keep Dynamic Consistency (Camp 1 wins).
  *   If you care about **policy and climate**, you likely need Ambiguity Aversion (Camp 2 wins), because the cost of being wrong on a single prior is catastrophic, and dynamic consistency is less relevant for one-shot existential decisions.
  *   If you care about **psychology**, you investigate Camp 3.

  **The Verdict on the Stalemate:**
  No resolution should be expected on the question "Is the Ellsberg preference rational?" because "rational" is doing too much work. Progress lies in **domain specificity**. The field needs to stop looking for a Universal Decision Theory and start mapping which theory applies to which environment. The stagnation exists because everyone is still looking for the One True Theory.

  **Recommendation for the Reading Group:**
  Shift the term's focus from "Resolving Ellsberg" to "The Cost of Consistency." Read the dynamic consistency papers (Epstein/Schneider, Siniscalchi). Force Camp 2 to explain exactly *when* they are willing to accept dynamic inconsistency. Force Camp 1 to explain *why* reduction of compound lotteries is a normative requirement in a non-ergodic world. That will break the loop.
