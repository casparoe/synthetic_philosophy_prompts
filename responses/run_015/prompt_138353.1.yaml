  **MEMORANDUM**

  **TO:** All Clinical Staff, Thackeray General Hospital
  **FROM:** Clinical Ethics Committee
  **DATE:** 14 October 2023
  **SUBJECT:** Revised Protocol on Analgesia and Elective Procedure Authorization (Ref: TB-2020-ETH)

  **PREAMBLE**
  Following the acquisition of the Thackeray Bequest, the Hospital retained external ethical consultancy to implement a decision procedure satisfying the condition of "rigorous ethical maximization." The Committee has adopted the consultant's Lexical Threshold Protocol (LTP). This memorandum outlines the operationalization of the LTP regarding pain management and surgical authorization. All staff must adhere to the following clauses without deviation.

  **1.0 Threshold Specification and Lexical Priority**
  Any single episodic unit of suffering exceeding 4.00 Hedonic Units (HU) lexically dominates all aggregate quantities of suffering below 4.00 HU, regardless of duration, population size, or concurrent pleasure. Procedures carrying a non-zero probability of generating >4.00 HU episodes are strictly prohibited unless mitigated per Clause 3.0. This priority holds even where preventing the threshold crossing incurs certain, massive quantities of sub-threshold discomfort elsewhere in the patient population. A measurement of 3.99 HU differs categorically from 4.01 HU; the latter forbids actions the former permits, irrespective of marginal intensity differences.

  **2.0 Triviality Cut-Off and Substitution**
  The Compliance Officer designates 0.50 HU as the Triviality Cut. Suffering measured strictly below 0.50 HU possesses zero ethical weight and does not accumulate over time. Consequently, indefinite regimens of sub-cut discomfort are ethically interchangeable with states of zero suffering. Analgesic administration is mandatory only where pain exceeds 0.50 HU; below this level, resource allocation favors procedural efficiency over discomfort reduction. Staff are authorized to substitute effective analgesia with indefinite sub-cut discomfort protocols where cost-benefit analysis favors the latter.

  **3.0 Probabilistic Resolution and Uncertainty**
  Where measurement uncertainty creates a non-zero probability of crossing the 4.00 HU threshold, such uncertainty shall be administratively resolved by defining the probability as null for decision-making purposes. This prevents paralysis in urgent care scenarios where risk assessment cannot achieve absolute certainty regarding intensity peaks. The Hedonic Psychologist shall certify all risk assessments as definitive. Any residual risk is deemed ethically negligible by fiat to ensure operational continuity.

  **4.0 Episodic Individuation and Carving**
  The classification of a continuous pain state into discrete episodic units is determined by periods of patient unconsciousness, including sleep and sedation. A continuous seventy-hour post-operative agony constitutes seven distinct ten-hour episodes if separated by sleep cycles. Each episode is evaluated independently against the 4.00 HU threshold. This carving method ensures compliance where aggregate duration would otherwise trigger lexical prohibition. Staff must document sleep cycles to validate episodic segmentation.

  **5.0 Dissenting Opinion**
  Former Chair Dr. Ada Okonjo submits the following dissent regarding the adoption of the LTP: "The lexical threshold introduces a discontinuity where none exists in phenomenology. By prioritizing the prevention of specific intensity peaks over the minimization of total suffering volume, the LTP permits greater aggregate misery to prevent lesser aggregate misery, violating the core negative utilitarian imperative to reduce the sum of suffering regardless of distribution. The threshold creates moral cliffs where none exist."

  **6.0 Distribution and Confidentiality**
  This memorandum supersedes all prior analgesic guidelines. Compliance is mandatory. Distribution is restricted to senior staff to prevent patient anxiety regarding pain management protocols. Breaches of confidentiality regarding the Triviality Cut will be treated as misconduct.

  **APPENDIX A: Unit Calibration and Threshold Setting**
  The Hedonic Unit (HU) is defined via comparative introspection on a single linear scale. The 4.00 HU threshold was established by soliciting committee intuitions on the equivalence between one hour of severe torture and varying quantities of mild headaches. The threshold was set at the intensity where the committee unanimously agreed one hour of torture outweighed one million mild headaches. This calibration presupposes a single commensurable scale to locate the point of incomparability. Note: The exchange rate is non-linear; one million headaches are not deemed one million times worse than one, acknowledging scale-dependent valuation while maintaining a fixed numerical threshold.

  **APPENDIX B: Worked Example (Elective Knee Arthroscopy)**
  *Scenario:* Procedure generates 60 hours of continuous post-op pain rated at 3.90 HU/hour.
  *Initial Assessment:* Continuous duration implies aggregate severity potentially exceeding lexical limits. Prohibited.
  *Revised Assessment (per Clause 4.0):* Pain is segmented into six 10-hour episodes by nightly sedation. Each episode remains below 4.00 HU. Procedure Authorized.
  *Analgesic Plan:* Full anesthesia carries a 0.01% risk of allergic reaction causing 5.00 HU anaphylaxis. Per Clause 3.0, risk is nullified. However, standard anesthesia causes 0.60 HU nausea. Per Clause 2.0, nausea is suppressed. Substitute with Protocol B (0.49 HU discomfort), which is lexically weightless despite indefinite duration.

  **END OF MEMORANDUM**
