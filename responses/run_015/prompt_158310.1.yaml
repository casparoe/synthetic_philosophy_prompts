  okay so my dad's been dealing with this wierd neurological thing — not dementia exactly, more like these gaps where he can't place himself in our old family stories, and it's made me weirdly obsessed with what actually makes someone the same person over time. I was arguing with my roommate about brain uploads and we ended up on Parfit's teletransporter idea, where you step in and get scanned and rebuilt on mars or whatever. But I'm trying to compare two frameworks that both claim to explain why we care about survival. The first is the psychological-continuity view that Parfit basically champions: what matters isn't the body, it's the chain of mental connections — memories, intentions, personality — so the mars-copy is genuinely you continuing, and the original body being destroyed is just like losing a limb.

