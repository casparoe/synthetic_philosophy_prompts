  # Joint Statement of Adversarial Collaboration: The Function of Costly Ritual

  **Date:** October 26, 2023
  **Parties:** The Strong Handicap Camp; The Institutional Coordination Camp
  **Facilitator:** Doctoral Research Group on Evolutionary Anthropology

  ## I. Shared Theoretical Commitments

  Both camps endorse the following propositions as the foundational baseline for this collaboration. These claims establish the evolutionary and behavioral context within which our disagreement resides.

  1.  **Selection on Costly Traits:** Natural and cultural selection can favor traits that bear substantial individual costs, provided those costs confer differential benefits to the actor (e.g., via observer inference) or stabilize cooperative equilibria that benefit the collective.
  2.  **Existence of Expenditure:** Ethnographic and historical records confirm that many documented rituals involve significant material, temporal, or bodily expenditure (e.g., fasting, scarification, pilgrimage) that reduces immediate individual fitness or resource accumulation.
  3.  **Incompleteness of Reduced Models:** Purely functionalist accounts that ignore strategic interaction between individuals are incomplete, just as purely signaling accounts that ignore collective-action problems and institutional constraints are incomplete. A comprehensive model must account for both individual incentives and group-level dynamics.
  4.  **Cost as a Variable:** The magnitude of ritual cost is not random; it varies systematically across ecological and social contexts, suggesting it is subject to selective pressures rather than being mere cultural drift.

  ## II. Areas of Disagreement

  The following table delineates the specific theoretical divergences between the two camps. Each position is phrased to ensure accurate representation acceptable to its proponents.

  | Domain of Dispute | Strong Handicap Camp Position | Institutional Coordination Camp Position |
  | :--- | :--- | :--- |
  | **(a) Origin of Cost** | The cost of a ritual is primarily a **signal-design feature**. Wastefulness is selected *because* it is hard-to-fake, serving to filter out free riders and certify commitment quality. | The cost of a ritual is primarily a **coordination byproduct**. Expense is friction inherent to synchronizing large groups or generating common knowledge, not an adaptive signal design. |
  | **(b) Informational Value** | The value of participation depends on **individual-level reputation tracking**. Observers update beliefs about specific participants' traits (e.g., resilience, loyalty), granting them differential status. | The value of participation depends on **group-level boundary maintenance**. Observers update beliefs about group cohesion and synchronized readiness, granting benefits to the collective rather than specific individuals. |
  | **(c) Modern Analogs** | Handicap logic applies analogously to **modern secular costly practices** (e.g., credential inflation, extreme athletics). These are continuous with ancestral rituals as honest signals of underlying quality in competitive markets. | These phenomena are **structurally disanalogous**. Modern institutions lack the ancestral social context (e.g., small-scale reputation economies) that made ritual waste informative; modern costs are often rent-seeking or bureaucratic artifacts. |

  ## III. Identification of Cruxes

  To move this debate from theoretical stalemate to empirical resolution, we identify two specific cruxes. Resolution of these questions would require at least one camp to significantly revise its model.

  **Crux 1: The Credibility Surplus and Benefit Correlation**
  Does ritual expenditure exhibit a measurable "credibility surplus"—costs that exceed the minimum necessary for pure coordination? Furthermore, does this surplus correlate with *individual-level* benefits (mating opportunities, alliance formation, status mobility) or exclusively with *group-level* benefits (collective-action success, defense, resource pooling)?
  *   *Significance:* If costs exceed coordination minima and track individual status, the Handicap model is supported. If costs track coordination minima and benefits are strictly collective, the Coordination model is supported.

  **Crux 2: Signal Amortization vs. Recurrent Synchronization**
  How does ritual cost distribute over an individual's lifecycle? The Handicap model predicts costs are **front-loaded** and depreciate; once a reputation for commitment is established, the need for costly signaling diminishes. The Coordination model predicts costs remain **recurrent and synchronized**; maintaining group cohesion requires repeated, shared expenditure regardless of an individual's tenure or prior demonstration of loyalty.
  *   *Significance:* If elders/initiates pay significantly less than novices, it suggests reputation amortization (Handicap). If elders/initiates pay the same as novices to maintain synchronization, it suggests coordination friction (Coordination).

  ## IV. Empirical Tests and Advance Predictions

  For each crux, we specify a concrete dataset or experimental design both sides agree is relevant. Each side records an advance prediction specifying what pattern would weaken its position.

  ### Test 1: Cross-Cultural Correlates of Ritual Intensity and Status
  **Method:** A cross-cultural dataset coding for ritual intensity (cost/duration/risk), individual status mobility (change in rank/prestige), and group-level performance (success in warfare/harvest/stability).
  **Handicap Camp Prediction:** Ritual intensity will positively correlate with individual status mobility, independent of group performance. High-cost rituals function as ladders for individual advancement.
  **Coordination Camp Prediction:** The correlation between ritual intensity and individual status will disappear or reverse once collective-action outcomes are controlled for. High-cost rituals correlate with group success, not individual mobility.
  **Falsification Condition:**
  *   *Handicap:* If high-cost rituals consistently fail to predict individual status gains in the absence of group conflict.
  *   *Coordination:* If high-cost rituals consistently predict individual status gains even when group performance is static or poor.

  ### Test 2: Longitudinal Cost Distribution in Initiation Systems
  **Method:** Longitudinal ethnographic or historical data tracking the material and bodily costs incurred by individuals at different stages of membership (novice vs. tenured member/elder) within the same ritual system.
  **Handicap Camp Prediction:** Costs will be amortized. Novices incur high costs to signal quality; tenured members incur significantly lower maintenance costs because their reputation is already established.
  **Coordination Camp Prediction:** Costs will be synchronized. Novices and tenured members incur comparable recurrent costs because the function is shared experience and simultaneous action, not individual certification.
  **Falsification Condition:**
  *   *Handicap:* If tenured members are required to undergo equally costly ordeals as novices without reputational loss for refusal.
  *   *Coordination:* If tenured members are systematically exempted from costly participation while retaining full group benefits and coordination capacity.

  ## V. Meta-Analysis: Verbal vs. Substantive Dispute

  We assess that a portion of this dispute is verbal, stemming from the ambiguity of the term "cost." If "cost" is defined strictly as *energy expenditure*, both camps agree it exists. The disagreement arises when inferring the *selective etiology* of that expenditure.

  1.  **Verbal Component:** Disagreements often dissolve when distinguishing between **cost-as-signal-design** (selected *for* its wastefulness) and **cost-as-coordination-friction** (selected *despite* its wastefulness). Both camps acknowledge that rituals can have effects consistent with the other's model (e.g., signaling can aid coordination; coordination can generate signals).
  2.  **Residual Substantive Dispute:** Even after clarifying terminology, a genuine empirical disagreement remains regarding the **primary locus of selection**.
      *   The Handicap camp posits that the primary selective pressure is *individual competition* within the group (intra-group selection).
      *   The Coordination camp posits that the primary selective pressure is *group competition* or stability (inter-group selection or multi-level selection).
  3.  **Normative Implication:** If the Handicap model holds, ritual cost is an adaptive solution to the problem of trust. If the Coordination model holds, ritual cost may be a necessary evil or a structural constraint, potentially susceptible to elimination if coordination technology improves.

  We sign this document to commit to testing these predictions without prejudice, acknowledging that the validity of either model depends on the weight of evidence regarding the cruxes identified above.

