answer: |-
  **A machine is only honest if it carries the weight without stealing your wage, your time, or your say.**

  This principle rests on three clauses: burden, distribution, and agency. It reconciles your pairs by distinguishing between *tools* and *substitutes*, and between *efficiency* and *extraction*.

  **3 vs 4 (The Writer):** The word processor is a tool; it aids execution without altering conception. You still think the thoughts; the machine just holds the ink. This keeps your "say." The drafting model is a substitute; it alters conception. It objectifies the knowledge work itself. The principle flags 4 as bad because the machine isn't just carrying the weight; it's stealing the *say* over the product's origin. You feel the loss because you are being separated from the act of creation, not just the drudgery.

  **2 vs 7 (The Mine):** Here, the technology is identical, but the distribution differs. In 2, the gain (safety) is kept by capital, while the cost (unemployment) is borne by labor. The machine steals the "wage" and "time" of the fired half. In 7, the co-op structure ensures the gain (reduced hours) is returned to the workers. The principle confirms your suspicion: ownership isn't a dodge; it's the mechanism that guarantees the "wage and time" clause isn't violated. Without ownership, efficiency inevitably becomes extraction.

  **Stress Tests:**
  To see where this principle bleeds, look at the **Power Loom (Historical)**. It made cloth cheap (social good) but destroyed the weavers' livelihood (worker bad). Your principle must verdict this as Bad, despite the material progress. It forces you to argue that cheap shirts don't justify starved families. This aligns with your Luddite verdict (9), but it conflicts with standard narratives of progress.

  Contemporary: **AI Medical Diagnostics**. An algorithm detects cancer better than a doctor. It saves lives (immense social good) but desks the doctor to a button-pusher (loss of "say"). Your principle verdicts this as Bad because agency is removed from the worker. This embarrasses the principle: most people would accept the loss of professional agency to save a life. You must decide if "saving lives" overrides "worker agency," or if a system that saves lives by deskilling workers is still morally compromised.

  **The Sacrifice:**
  The principle cannot keep **Case 1**. A robot taking over dangerous work with "same crew, same pay" is economically unstable under capitalism. Capital invests to reduce labor costs, not maintain them. If the robot does the work, capital will eventually seek the layoff (Case 2). Case 1 is a temporary anomaly, not a stable state. Drop it, or treat it as the calm before the storm. Your character should suspect it won't last.

  **Marx & Theory:**
  The shift from **Formal to Real Subsumption** is not decoration; it is the exact mechanism explaining 3 vs 4. In 3 (Word Processor), labor is formally subsumed; you work for capital, but the *process* of writing remains yours. In 4 (AI Drafting), labor is really subsumed; the process itself is redesigned around the machine's logic. You are no longer writing; you are managing the machine's writing. This distinction is sharp enough for the book.

  The **Grundrisse** ("Fragment on Machines"), however, is mostly decoration for this character. The idea that knowledge becomes fixed capital and labor time ceases to measure wealth is too abstract for a warehouse floor. It explains the macro-trend, but not the daily ache. Keep the *concept* (that her knowledge is being stolen into the code), but leave the *text* out. She doesn't need to quote Marx to feel her expertise being encoded into a box she can't open.

  **Summary for the Character:**
  She shouldn't talk about subsumption. She should talk about theft. When the algorithm sets the pace (Case 6), it steals her say. When the co-op cuts hours (Case 7), it returns the time. When the AI drafts (Case 4), it steals the thought.

  **Cost:**
  This principle costs you the comfort of "progress." It forces you to admit that better technology often means worse work unless ownership changes. It makes your character a radical, not just a technician. She isn't installing robots; she's auditing theft. If that fits the book, keep it. If you need her to be neutral, you must weaken the "say" clause, but you will lose the tension between 3 and 4.

  **Final Verdict:**
  Keep the principle. Drop Case 1 as naive. Use Real Subsumption to structure the argument, but leave the *Grundrisse* in your notes, not her mouth. The conflict isn't about machines; it's about who owns the future the machines build.
