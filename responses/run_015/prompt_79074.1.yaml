answer: |-
  Here are the five nearest conceptual neighbours to the phenomenon you are describing. I have selected these because they each capture a facet of the geometry you see, but none capture the *motion*.

  1.  **Constructive Empiricism (Van Fraassen):** This covers your condition (a) and (b) from the instrumentalist side. It argues that acceptance of a model need only involve belief that it is *empirically adequate*, not that its posits are true.
      *   *What it leaves over:* It prescribes a stable stance. It does not account for the *oscillation* (c). A constructive empiricist shouldn't claim the latent variable is a "cause" in the Introduction and a "summary" in the Discussion; they should be consistent about the "as-if" status throughout.
  2.  **Entity Realism (Hacking / Cartwright):** This captures the "cause" language in the Introduction ("if you can spray it, it's real"). It focuses on manipulability rather than truth.
      *   *What it leaves over:* In cognitive science, you rarely "spray" a latent variable. This view would force the instrumentalist conclusion immediately, failing to explain why the realist claim is viable enough to argue about. It also doesn't explain the retreat in the Discussion.
  3.  **Perspectival Realism (Giere / Massimi):** This handles the idea that different models (or probes) yield different, equally valid ontological pictures.
      *   *What it leaves over:* This is a stable pluralism. It says "both stances are valid relative to their perspective." It does not explain why a *single agent* slides between them opportunistically within a single argumentative arc.
  4.  **Selective Realism (Kitcher / Psillos):** This suggests we should be realist about the "working posits" of a theory that survive theory change, and instrumentalist about the rest.
      *   *What it leaves over:* This operates diachronically (across history/theory change). You are describing a synchronic phenomenon (within a single paper/project).
  5.  **Reification (Whitehead / Marx):** This names the error of treating an abstraction as a concrete thing.
      *   *What it leaves over:* This pathologizes the move as a mistake or confusion. You explicitly noted this doesn't feel like confusion; it feels structural. Reification doesn't explain why the slide is *functional* or why the community tolerates it.

  ### The Diagnosis

  There is no standard term in the philosophy of science literature that captures the *dynamic oscillation* you are describing. The literature is obsessed with classifying *stances* (Realist vs. Instrumentalist), but it is largely silent on the *rheology* of those stances in practice.

  You are describing a feature of scientific workflow, not a bug in philosophical consistency. The existing terms fail because they treat ontological commitment as a *belief state*, whereas you are observing it functioning as a *resource allocation*.

  ### The Coining: Ontological Elasticity

  I propose we call this **Ontological Elasticity**.

  **Definition:** Ontological Elasticity is the structural capacity of a theoretical construct to sustain varying degrees of ontological commitment depending on the rhetorical or methodological context of its use, without triggering a charge of inconsistency.

  It is defined by the three constraints you identified:
  1.  **Empirical Invariance:** The data does not force the commitment (the underdetermination condition).
  2.  **Utility-Based Criterion:** "Reality" is indexed to explanatory leverage (predictive success/compression).
  3.  **Contextual Modulation:** The commitment stretches to "Real/Causal" when generativity is required (Introduction/Hypothesis) and contracts to "Instrumental/Summary" when defense is required (Discussion/Review).

  ### Boundary Cases

  To ensure this carving is precise, we must distinguish Ontological Elasticity from its nearest neighbours.

  **1. Elasticity vs. Ordinary Inconsistency**
  *   *Inconsistency* is uncontrolled. It happens when a researcher forgets what they claimed in paragraph 3 by the time they reach paragraph 10.
  *   *Elasticity* is rule-governed. The slide follows a predictable script: *Motivation requires causality; Limitation requires humility.* If the researcher claimed the variable was merely instrumental in the Intro (undermining the grant bid) or a hard causal mechanism in the Discussion (inviting falsification), they would be violating the norms of the genre. Elasticity is the *skillful* navigation of these norms.

  **2. Elasticity vs. Defensible Pluralism**
  *   *Pluralism* (e.g., Perspectival Realism) claims that *both* stances are simultaneously valid descriptions of the world.
  *   *Elasticity* is pragmatic, not metaphysical. It does not claim the variable is *both* real and unreal. It claims the variable is *treated as* real to generate the experiment, and *treated as* unreal to survive the critique. It is a single ontology stretched to fit two different epistemic jobs.

  **3. Elasticity vs. Hypocrisy**
  *   *Hypocrisy* implies the agent knows the truth and lies for gain.
  *   *Elasticity* implies the agent genuinely experiences the construct as "real" during the modelling phase (because it is doing causal work in the simulation) and "abstract" during the writing phase (because it is being compared to data). The cognitive state shifts with the activity. It is not dishonesty; it is **context-dependent belief**.

  ### Resolution: What Counts as Settling the Dispute?

  If Ontological Elasticity is the phenomenon, then standard empirical resolution is impossible. You noted that "nobody produces a fact that would move the other side." This is because the dispute is not about the *data* (which is agreed upon) nor the *model* (which is agreed upon), but about the **licensing conditions for intervention**.

  To resolve an Ontologically Elastic dispute, you must shift the question from *"Is it real?"* to *"What does calling it real allow us to do?"*

  **1. The Intervention Test (The Hacking Criterion)**
  If the "realist" camp claims the latent variable is a cause, ask: *What intervention does this license that the instrumentalist description does not?*
  *   If the answer is "None," the realist claim is idle. The dispute should be dissolved in favour of instrumentalism.
  *   If the answer is "We can target this mechanism to change behaviour," then realism is licensed *only to the extent of that intervention*.
  *   *Resolution:* The dispute is resolved by specifying the **scope of the ontology**. The variable is real *relative to the intervention*, not real *simpliciter*.

  **2. The Probe Specificity Test (Your Linear Probe Example)**
  In the probe debate, the resolution is not better data. It is **model-mechanism mapping**.
  *   The "realist" must show that the probe direction aligns with a specific causal pathway in the network architecture, not just a linearly separable subspace.
  *   The "instrumentalist" must show that alternative architectures yield the same probe results without the representation.
  *   *Resolution:* This rarely ends in a "Yes/No" on reality. It ends in a **granularity shift**. We stop asking "Is the representation real?" and start asking "At what level of abstraction does the 'representation' description become the most efficient causal map?"

  **3. Pragmatic Dissolution**
  Ultimately, disputes driven by Ontological Elasticity are resolved by **explicitly staging the commitment**.
  *   A paper resolves the tension by stating: *"We treat X as a causal mechanism for the purpose of generating predictions (Section 2), but acknowledge X may be a heterogeneous summary of processes in the limit (Section 5)."*
  *   When this staging is made explicit, the fight usually evaporates. The fight persists only when the elasticity is implicit, allowing each side to attack the other's *stage* as if it were their *stance*.

  ### Summary for your Work

  When your reviewer asks if the latent variable is "just a summary," they are asking you to collapse the elasticity. They want you to commit.
  *   If you commit to **Realism**, you invite demands for mechanistic grounding you may not have.
  *   If you commit to **Instrumentalism**, you undermine the explanatory claim of the paper.

  The philosophically honest move (and the one that names the phenomenon) is to **declare the elasticity**.
  *"This construct is ontologically elastic: it functions as a causal posit within the generative model, warranting realist language in hypothesis formation, but is acknowledged as a phenomenological summary in the context of empirical adequacy."*

  This doesn't solve the metaphysics, but it dissolves the rhetorical trap. You aren't confused; you are practicing Ontological Elasticity, and like any tool, it works best when you acknowledge how it bends.
