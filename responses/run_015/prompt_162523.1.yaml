answer: |-
  Subject: Re: Keynes weight vs Bayesianism

  You are in a defensible position but you have taken on a heavy burden of proof, specifically because the machinery you are trying to revive has been extensively mapped onto modern decision theory in ways that might dissolve your distinctiveness. The most fatal objection you face is the collapse argument, specifically that weight is just Bayesian precision or second-order probability in disguise. If you claim expected utility has no slot for the difference between a thin and thick seventy percent, a sophisticated Bayesian will reply that their framework captures this exactly through the variance of the posterior distribution or by using a set of priors rather than a single point estimate. In imprecise probability frameworks like those developed by Walley or the Maxmin Expected Utility model of Gilboa and Schmeidler, the size of the set of priors represents the weight of evidence, and the decision rule explicitly accounts for ambiguity aversion. If your view reduces to this, you have not found a flaw in Bayesianism but rather reinvented a specific subset of it, which undermines your claim that Keynes offers a structural alternative rather than just different vocabulary. To survive this, you must insist that Keynesian weight implies non-comparability or non-additivity that even imprecise probability cannot capture without violating coherence axioms, but this moves you from economics into logic and makes the decision theory much harder to formalize.

  Slightly less fatal but still serious is the problem of the decision rule itself when probabilities are partially ordered. You asked what the view tells anyone to do in a concrete case if the probability is neither more nor less likely nor equally likely. If your answer is to use maximin or minimize regret, you risk the charge of ad hocery, because you need to justify why uncertainty mandates pessimism rather than optimism or some other rule. Keynes himself often fell back on conventions, such as assuming the future will resemble the present or following the average opinion, which explains herding but at the cost of rationality. If your theory predicts herding because agents lack logical grounds to choose, you must explain why this is a stable equilibrium rather than a temporary failure of reasoning. A rival theory that explains herding through information cascades within a standard rational framework would hurt you significantly because it achieves the same empirical prediction with fewer ontological commitments. You said weight explains hoarding and investment freezes, but Real Options Theory explains investment delays using standard volatility and irreversibility without invoking non-probabilistic uncertainty. If a Real Options model fits the data on investment freezes as well as your weight-based model, your claim to unique explanatory power collapses, leaving you with a metaphysical distinction that does no empirical work.

  Regarding the logical probability commitment, you are right to worry about the Aumann-style agreement theorem. If probability is an objective logical relation between evidence and hypothesis, then rational agents with common evidence must assign the same probability. Persistent disagreement in the real world suggests either that evidence is never truly common or that agents are irrational. You can use weight as an escape hatch here by arguing that agents disagree because they recognize the weight is too low to justify a precise numerical assignment, so they default to different conventions. However, this is awkward because it implies that most economic action is taken on the basis of caprice or convention rather than rational calculation, which weakens the normative force of your theory. It becomes a theory of how people behave when they cannot be rational, rather than a theory of rational behavior under uncertainty. This is not fatal if you are aiming for descriptive accuracy, but it hurts if you claim Keynes provides a better normative guide than expected utility.

  You asked for a worked case where a weight-sensitive rule and a Bayesian diverge. Consider a one-shot decision where you must bet on a coin toss. In case A, the coin is known to be fair. In case B, the coin is from a mint that produces coins with unknown bias, but you have no information suggesting it is biased toward heads or tails. A standard subjective Bayesian assigns a probability of 0.5 to heads in both cases based on the principle of indifference or a uniform prior, and if the utility function is linear, they are indifferent between betting on A or B. A Keynesian says the probability is 0.5 in both cases but the weight is higher in A, and a weight-sensitive agent prefers A. Here you have different advice. However, a sophisticated Bayesian will counter that they are not indifferent if they model the parameter uncertainty; they recognize that in case B the parameter itself is unknown, and if there is any cost to being wrong about the parameter or any value to information, they will prefer A. The divergence only holds if the Bayesian is constrained to a single precise prior and ignores the value of information or ambiguity aversion. If you allow the Bayesian to have ambiguity aversion, they converge with the Keynesian. So your claim holds only against a straw man of naive Bayesianism, not against the full modern suite of decision theories under uncertainty.

  Finally, on falsifiability, you are walking a tightrope. If weight is a logical relation, it should be calculable in principle, but Keynes admits it is often not numerically measurable. If it is not measurable, it is difficult to test empirically whether weight is driving behavior or whether agents are simply risk-averse or poorly informed. If you qualify the theory too much by saying weight only matters when agents feel uncertain, you risk making it unfalsifiable because any behavior can be retroactively explained by positing a change in weight. This is not necessarily fatal for a philosophical claim, but it is damaging for an empirical one. To avoid this, you need to identify a proxy for weight that is independent of the observed behavior, such as the volume of available data or the stability of the generating process, and show that behavior changes when this proxy changes even when estimated probabilities remain constant. If you cannot measure weight independently of the choices it is supposed to explain, the theory becomes a tautology.

  In summary, you are in moderate to serious trouble if you claim expected utility has no slot for evidence weight, because modern Bayesianism does have such slots via parameter uncertainty and imprecise priors. You are on firmer ground if you focus on the non-comparability aspect and the breakdown of additive probabilities, but this comes at the cost of having no clear decision rule other than convention. The empirical claim is vulnerable to Real Options rivals unless you can show data that fits weight but not volatility. Your best defense is to argue that Bayesian updating assumes a stable model structure whereas Keynesian uncertainty includes uncertainty about the model itself, which is harder to capture in standard priors, but even this is being addressed by robust control theory. You have not been defeated, but you must concede that the landscape has moved since 1921 and your burden is to show why the new tools are insufficient rather than just different.
