  2.  **Deconstruct the Theoretical Framework (Marx):**
      *   *Formal Subsumption:* Capital takes over existing labor processes. Technology might replace tasks but doesn't fundamentally alter the social relation or the worker's control over the pace/logic yet.
      *   *Real Subsumption:* Capital redesigns the labor process. The machine sets the pace. Workers become appendages. Living labor is subordinated to dead labor.
      *   *Living vs. Dead Labor:* Workers' activity (living) vs. accumulated past labor crystallized in machines/code (dead). Capital seeks to maximize dead labor to minimize reliance on living labor (which is the source of surplus value but also a variable cost and source of resistance).
      *   *Tacit Knowledge:* Workers' experiential know-how. Capital seeks to objectify this into code/rules owned by the firm, stripping workers of power and skill.
      *   *Necessary Labor Time vs. Surplus:* If productivity gains don't lead to shorter hours/same pay, they lead to unemployment or intensification.

