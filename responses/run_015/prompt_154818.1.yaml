  1. Role, Stakes, and Constraints
  You operate within a 48-hour window to evaluate employer proposals for new technology. Your sign-off determines whether the union opposes, negotiates conditions, or accepts the change. You lack engineering expertise and cannot commission external studies; you rely solely on proposal documents and structured worker interviews. Your audience is an executive board of non-specialists who need clear, justified recommendations. The stakes are immediate: net job loss, work intensification, skill degradation, and the transfer of workplace knowledge from workers to proprietary capital. Your goal is to protect living labor from being subordinated to dead labor without sacrificing economic security.

  2. The Procedure—Ordered Tests and Rules
  **Step 1: The Surplus Extraction Test.** Calculate the change in necessary labor time. Does the proposal reduce the workforce or total hours while maintaining output? *Sufficient Answer:* Management must demonstrate where time savings go. *Rule:* If total wage bill drops without reduced hours for remaining staff or hiring guarantees, capital is capturing productivity gains as surplus rather than returning them as leisure. This violates the principle that reduced necessary labor time should benefit the worker. *Action:* Demand wage maintenance or hour reduction. *Judgment Flag:* Assess whether "efficiency" claims are real or pretext for speed-up; rely on worker testimony regarding task duration versus management projections. If workers report feeling rushed despite "efficiency," treat as intensification.

  **Step 2: The Subordination Test (Formal vs. Real).** Observe the interaction between worker and machine. Does the machinery serve the worker's purpose (formal subsumption), or does the worker serve the machinery's logical requirements (real subsumption)? Specifically, distinguish between a tool that extends physical capacity within the worker's own rhythm versus a system that subdivides the task so the worker must match an externally determined tempo. *Sufficient Answer:* Watch a simulation. Does the worker wait for the machine, or does the machine wait for the worker? *Rule:* If the system dictates the rhythm (e.g., conveyor speed, algorithmic pacing), this is real subsumption. The worker becomes an appendage, subject to the continuous motion of capital. Recommend "Oppose" unless binding pace limits are agreed. If the worker retains control over timing, classify as formal subsumption and proceed. This distinction is critical: a power drill extends the worker; an automated line consumes the worker. The recommendation shifts from "negotiate conditions" to "oppose" based solely on who controls the tempo.

  **Step 3: The Knowledge Capture Test.** Identify if tacit diagnostic or organizational knowledge is being extracted. Are workers required to log reasoning patterns into a proprietary system? *Sufficient Answer:* Review data entry requirements and algorithm training protocols. *Rule:* If yes, verify if the system uses this data to automate judgment later. If living labor (experience) is converted into dead labor (code) that replaces future human judgment, this is capital accumulation of knowledge. It strips workers of leverage. *Action:* Negotiate for data ownership or skill-based pay retention even if tasks simplify.

  **Decision Matrix:** Oppose if Real Subsumption + Job Loss. Negotiate if Knowledge Capture + Formal Subsumption. Accept only if gains are shared (hours/wages) and pace remains worker-controlled. *Judgment Flag:* Determining whether a "skill change" is degradation or merely differentiation requires human interpretation of worker sentiment regarding pride and autonomy, not just technical task lists. You must weigh whether the loss of craft identity is compensated by reduced physical burden.

  3. Stop Points, Opposition Triggers, and Value Handoffs
  **Opposition Triggers:** Mandate opposition if Step 2 confirms real subsumption (system-paced work) AND Step 1 confirms net job loss. This combination signifies the complete subordination of living labor to dead labor for surplus extraction. It represents the dual threat of intensification and unemployment.

  **Negotiation Mandate:** Mandate negotiation if Step 3 confirms knowledge capture but Step 2 confirms worker pace control. Here, the risk is long-term skill erosion, not immediate intensification. Non-negotiables must include: wage protection at pre-automation levels, ownership rights to entered data, and retraining guarantees. The union accepts the technology but demands compensation for the intellectual property transferred.

  **Value Handoffs:** Stop and refer to the Board if the procedure yields "Negotiate" but workers express strong cultural opposition to losing craft identity. Marx's framework identifies economic exploitation, but it cannot quantify the value of pride. If the choice is between economic security (accepting automation) and craft preservation (opposing it), this is a value judgment, not a technical one. The advisor flags the economic trade-off; the Board decides the strategic priority. This ensures the procedure does not override democratic will on non-economic grounds.

  4. Three Worked Cases
  **(a) Robotic Welding:** Eliminates 50% of team; pace unchanged for remaining. Step 1 flags surplus extraction (job loss). Step 2 passes (worker pace remains, formal subsumption). Step 3 neutral. *Result:* Negotiate. Since pace is worker-controlled, opposition is not mandated by Step 2. However, job loss triggers Step 1. Recommendation: Negotiate severance and hour reductions for remaining staff to share productivity gains. The framework treats this as capital taking over existing processes (formal) rather than redesigning them for control.

  **(b) AI Scheduling:** Adjusts targets via performance data. Step 1 flags intensification. Step 2 fails (algorithm sets pace = real subsumption). Step 3 fails (data capture). *Result:* Oppose. The system subordinates workers to an external logic, maximizing surplus extraction through speed-up. This is the core danger of real subsumption: the worker becomes an appendage to the algorithm's demand for continuous throughput. No condition mitigates the loss of autonomy.

  **(c) Predictive Maintenance:** Mechanics enter failure patterns; system automates diagnostics; role reduces to sensor replacement. Step 3 fails (knowledge capture). Step 2 passes (mechanics control timing). Step 1 neutral (no job loss). *Result:* Conditional Acceptance. Despite knowledge extraction, the procedure allows acceptance because physical burden decreases and jobs are retained. The rule requires negotiating wage retention despite skill simplification. The extraction of tacit knowledge is tolerated because the alternative is physical hazard, provided the "dead labor" does not dictate the worker's rhythm. The union finds this unwelcome because it erodes craft identity, but the procedure prioritizes economic security and physical safety over skill retention when subordination is not present. The condition is strict: wages must remain at the skilled mechanic rate, treating the knowledge transfer as a company asset purchase, not a skill reduction. This outcome is unwelcome because it accepts deskilling, but necessary to prevent job loss in a context of formal subsumption.

  5. Limits, Misfires, and Unsettled Cases
  **Ambiguity in Data Ownership:** Marx's framework assumes physical means of production. Digital data ownership is legally complex. The procedure may flag knowledge capture, but enforcing "worker ownership" of data is legally difficult, leading to false negatives where negotiation fails to secure actual control.

  **False Positives on Safety:** The procedure may recommend acceptance for safety tech (Case C) that workers oppose due to pride. Marx prioritizes material conditions over identity; the framework underdetermines cases where craft identity is the primary value.

  **Long-Term Subordination:** A system may start as formal subsumption (worker-paced) but update via software to become real subsumption later. The 48-hour review cannot predict software updates. This creates a false negative risk where initial acceptance leads to future subordination.

  **Judgment Dependency:** The "Pace Control" test relies on worker perception. If workers are disciplined to believe they control the pace when they do not, the procedure misfires. Human judgment is required to penetrate ideological claims of flexibility. The advisor must distinguish between genuine autonomy and the illusion of choice within a constrained system.
