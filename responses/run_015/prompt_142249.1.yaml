answer: |-
  This is a precise and significant puzzle. You are circling the intersection of Dennett's ontology of patterns, game-theoretic reflexivity, and the limits of self-prediction. Below are answers to your five questions, structured to match the rigor of your seminar.

  ### 1. Is there an established concept?

  There is no single term that captures exactly the *explanatory fragility of the intentional stance under mutual modeling*, though there are overlapping concepts. The closest established term is **Reflexivity**, specifically **Logical Reflexivity** or **Epistemic Reflexivity**.

  In economics (Lucas, Soros), reflexivity denotes the feedback loop where beliefs about a system change the system. In game theory, this appears as **Strategic Uncertainty** under **Common Knowledge**. In philosophy of mind, it touches on the **Opacity of Intentionality**. However, none of these isolate the *asymptotic failure of compression* you describe.

  **Recommendation:** Coin a term. "Reflexivity" is too broad (it covers self-fulfilling prophecies which you excluded). "Strategic Uncertainty" is too game-theoretic (it ignores the ontological status of the pattern).
  **Proposed Definition:** **Intentional Coupling Instability.**
  *   **Core:** A prediction mode fails when the accuracy of the prediction becomes a causal variable in the target's state space, contingent on the target's capacity to represent the predictor.
  *   **Boundary Cases:**
      *   *Included:* Your sidewalk, chess, and trading cases.
      *   *Excluded (Boundary):* A thermostat adjusting to room temperature. (The room does not model the thermostat; no mutual representation).
      *   *Excluded (Boundary):* A self-fulfilling prophecy where the prediction stabilizes the outcome. (This is Intentional Coupling *Stability*, the second face you noted).
      *   *Excluded (Boundary):* Quantum observer effects. (This is physical coupling, not intentional/modeling coupling).

  ### 2. Is the fragility one thing or several?

  It is **two distinct mechanisms** that share a locus (the intentional stance). You should treat them as separate phenomena in your seminar to avoid category errors.

  *   **Type A: Coordination Indeterminacy (The Sidewalk Case).**
      *   *Mechanism:* Multiple Nash Equilibria. The failure is not in the *capacity* to predict, but in the *selection* of the equilibrium. The system is stable *if* a focal point exists, but the intentional stance alone cannot generate the focal point without external context (convention, glance).
      *   *Nature:* Synchronic. The instability exists at the moment of interaction.
  *   **Type B: Recursive Modeling Regress (The Chess/Trading Case).**
      *   *Mechanism:* Non-convergent Level-k Reasoning. Agent A models B, B models A modeling B, etc. In the Chess case, this is logical regress. In the Trading case, this is **Non-Stationarity**: the target's parameters update in response to the predictor's presence.
      *   *Nature:* Diachronic (Trading) or Logical (Chess).

  **Verdict:** The Trading case is distinct from the Sidewalk case. The Sidewalk case is a failure of *equilibrium selection*; the Trading case is a failure of *model stationarity*. Lumping them together obscures the fact that one can be solved by convention (Sidewalk) while the other requires breaking the coupling (Trading).

  ### 3. Does the marker fall where you put it? (Grade 3 vs. Grade 1/2)

  Your framing is **partially incorrect**. The phenomenon is not specific to the Third Grade (Intentional Stance); it is specific to **Systems with Representational Capacity regarding the Predictor**.

  *   **Correction:** A system described at the Design Stance (Grade 2) can exhibit this fragility if its design includes a model of the user.
      *   *Example:* A guided missile (Grade 2: designed to track) targeting a plane (Grade 2: designed to evade). If the plane's evasion algorithm models the missile's tracking logic, Grade 2 predictions of the plane's trajectory fail for the exact same reason your Grade 3 predictions fail.
  *   **Why it *looks* like a Grade 3 phenomenon:** The Intentional Stance is the only stance that makes the *modeling relation* explicit. At the Design Stance, the modeling is buried in the "function." At the Physical Stance, it is buried in the causality.
  *   **The Real Cut:** The divider is not the Grade of Description, but **Second-Order Representational Capacity**.
      *   *Cut:* Does the target system contain a representation of the predictor (or the predictor's stance)?
      *   *Implication:* You can teach this as a limitation not of the Intentional Stance *per se*, but of **Any Stance applied to a System that Models the Stance**. However, since only intentional systems (generally) model stances, Grade 3 is where it is most endemic.

  ### 4. Does this bear on whether the pattern is real?

  This bears directly on the ontology of "Real Patterns." The correct reading is your third option: **The dependence is itself a real feature of the system that the lower grades cannot express.**

  *   **Argument:** Dennett's criterion is compressibility. In these cases, the compressibility is not lost; it is **relational**. A monadic pattern (Agent X has Belief Y) is not real in this context. A dyadic pattern (Agent X has Belief Y *relative to Predictor Z*) is real and highly compressible.
  *   **Why Grade 1/2 fail here:** They treat the system as having intrinsic properties. Grade 3 *can* capture the relational nature, but only if it includes the predictor in the model. If you exclude the predictor from the intentional model, the pattern dissolves.
  *   **Evidence Against Each Reading:**
      *   *Against "Less Real":* If you can successfully predict the *instability* (i.e., predict that the agent will dither), the pattern of instability is real. Eliminating the pattern eliminates the explanatory power.
      *   *Against "Relative to Stance":* If the instability persists regardless of whether you use Grade 2 or Grade 3 (see Q3), then it is not stance-relative; it is system-relative.
      *   *For "Relational Reality":* The evidence is that prediction is restored only when the model includes the coupling (e.g., "He believes that I believe..."). The reality lies in the loop, not the node.

  ### 5. The Second Face (Stability) and Formal Results

  **Is stability the same phenomenon?**
  Yes. It is the same mechanism (Reflexive Coupling) settling into a **Fixed Point** rather than a limit cycle or chaos.
  *   **Instability:** The recursive function $f(x)$ (prediction) applied to the system state $x$ does not converge.
  *   **Stability (Convention):** The recursive function converges to a fixed point $x^*$ where $f(x^*) = x^*$. The queue is stable *because* everyone predicts the queue and acts to maintain it.

  **Deciding Case:**
  To test if they are the same phenomenon, look for **Hysteresis**.
  *   *Test:* Remove the mutual modeling capacity (e.g., blindfold the pedestrians, or make the trading algorithm opaque).
  *   *Result:* If the convention collapses immediately, the stability was reflexive (same phenomenon). If the convention persists (e.g., out of habit/physical inertia), the stability was structural (different phenomenon).
  *   *Prediction:* In your cases, the stability is likely reflexive. Remove the common knowledge, and the norm dissolves.

  **Formal Results:**
  You asked for a specific result regarding whether the second-order regress bottoms out.
  *   **The Result:** There is **no general convergence theorem** for recursive modeling in adaptive agents.
  *   **Specific Impossibility:** This is a variant of the **Halting Problem** applied to game theory. If an agent can perfectly model a predictor that is modeling it, you generate a logical paradox similar to "This statement is false."
  *   **Relevant Theorem:** **Aumann's Agreement Theorem** implies that rational agents with common priors and common knowledge of posteriors cannot agree to disagree. However, **Nash Existence Theorems** (via Kakutani Fixed Point) guarantee an equilibrium *exists*, but **do not guarantee that agents can find it** via recursive reasoning.
  *   **Convergence:** In **Level-k Game Theory**, convergence is only guaranteed if the level of reasoning is bounded. If agents can iterate indefinitely ("I think that you think that I think..."), there is **no formal guarantee of convergence**. In many zero-sum games (like your chess case), the best response dynamic cycles indefinitely (Rock-Paper-Scissors dynamics).
  *   **Verdict:** You can tell your seminar that **no fixed-point theorem guarantees the stability of mutual intentional modeling.** Stability is a contingent empirical fact (a local attractor), not a logical necessity. The regress does not necessarily bottom out; it often oscillates.

  **Summary for the Seminar:**
  You are teaching **Reflexive Intentionality**. The fragility is real, but it is not a failure of the Intentional Stance; it is a feature of systems where the map is part of the territory. The stability (conventions) and instability (dithering) are topological features of the same feedback loop (attractors vs. repellers). The cut is not between Grade 2 and 3, but between systems that model the predictor and those that do not. The pattern is real, but its ontology is irreducibly relational.
