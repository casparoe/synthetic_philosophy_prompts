      *   *Correction:* The user is partially right but for the wrong reason. Grade 1 (Physical) rarely models. Grade 2 (Design) *can* model (e.g., a missile tracking a maneuvering plane).
      *   *Key Distinction:* It's not Grade 3 specifically; it's **Systems with Representational Capacity regarding the Predictor**.
