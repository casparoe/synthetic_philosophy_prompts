  7.  **Address Question 5: The Second Face (Stability) and Formal Results.**
      *   *Question:* Is stability (conventions) the same phenomenon as instability?
      *   *Answer:* Yes, it's the same mechanism (Reflexivity) settling into a Fixed Point vs. oscillating/chaos.
      *   *Formal Results:*
          *   **Nash Equilibrium:** Stability exists if strategies are best responses.
          *   **Common Knowledge of Rationality:** Can lead to indeterminacy (Aumann).
          *   **Gödel/Turing:** Limits on self-prediction (logical limits).
          *   **Specific Result:** **The impossibility of consistent self-prediction in adaptive systems** (similar to the Halting Problem or Soros's Reflexivity).
          *   *More precise:* **Level-k Game Theory** and **Cognitive Hierarchy Theory**.
          *   *Fixed Point:* **Kakutani Fixed Point Theorem** guarantees equilibrium existence under certain conditions, but *convergence* is not guaranteed (e.g., Rock-Paper-Scissors).
          *   *Deciding Case:* Look for **Hysteresis**. If removing the predictor leaves the convention in place, it's stability. If it collapses, it was fragile stability.
