      *   *Nuance:* The Trading case is actually Type B + Learning.
      *   *Refinement:* The common thread is **Non-Stationarity induced by Epistemic Coupling**. But the *mechanism* differs (Coordination vs. Regress/Adaptation). I should argue they are distinct mechanisms sharing a locus (the intentional stance).

  5.  **Address Question 3: Is the marker right (Grade 3 vs. Grade 1/2)?**
      *   *User's Hypothesis:* It's specific to Grade 3 (Intentional).
