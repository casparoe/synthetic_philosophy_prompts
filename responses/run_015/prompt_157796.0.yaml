answer: |-
  Here is a diagnosis of the deadlock and a proposal for breaking it.

  ### 1. The Diagnosis: It is not a verbal dispute; it is an ontological category mistake.

  Your seminar is not fighting over the definition of "experimental." It is fighting over a **Structure/Agency dualism** that Dewey's entire philosophy was designed to dismantle.

  *   **Camp A (Institutional)** is implicitly operating with a **technocratic ontology**. They view institutions as *external scaffolding* that can guarantee epistemic outcomes regardless of the internal state of the agents. They want democracy to be a machine that produces truth.
  *   **Camp B (Psychological)** is implicitly operating with a **virtue-ethics ontology**. They view democracy as an *internal disposition* that can survive (or even be stifled by) rigid machinery. They want democracy to be a culture that produces character.

  **Why the debate is ill-formed:**
  For Dewey, this is a false dichotomy. His concept of **Transaction** means that institutions and habits are co-constitutive. You cannot have "democratic habits" without "democratic associations," and you cannot have "democratic associations" that do not reshape habits. To ask whether experimentalism is about *design* or *habit* is like asking whether digestion is about the *stomach* or the *enzymes*. It is a functional unity.

  The "work" being done in your seminar isn't exegetical; it's **political anxiety**. Camp A is worried about *efficacy* (how do we stop fascism/inefficiency?). Camp B is worried about *alienation* (how do we stop technocracy/dehumanization?). They are using Dewey to fight a modern liberal vs. republican battle that Dewey predates.

  ### 2. The Epistemic vs. Moral Question

  You asked if there is a hidden disagreement about epistemic outputs (policy) vs. moral outputs (citizens). **Yes, but Dewey rejects the distinction.**

  For Dewey, **intelligence is a moral category.** A "better citizen" *is* one capable of intelligent action, and "intelligent action" *is* the only moral end (Growth). If a policy succeeds (epistemic) but creates passive subjects (moral failure), it is not experimentalism; it is manipulation. If citizens feel empowered (moral) but cannot solve shared problems (epistemic failure), it is not democracy; it is sentimentality.

  The seminar is stuck because they are trying to parse Dewey through a **Kantian framework** (separating theoretical from practical reason) when Dewey is working in a **Hegelian/Pragmatist framework** (where reason is realized *in* practice).

  ### 3. The Logjam Breaker

  If I had to name **one distinction** that would dissolve the argument, it is this:

  **Experimentalism as *Verification* vs. Experimentalism as *Reconstruction*.**

  *   **Camp A (Verification):** They hear "scientific method" and think of *hypothesis testing*. You have a fixed problem, you test a policy, you verify the result. This implies the *problem* and the *agents* remain static while the *policy* changes. This leads to the "Lab" model (technocracy).
  *   **Camp B (Reconstruction):** They hear "experimental" and think of *open-mindedness*. You remain fallible and adaptable. This implies the *agent* changes, but the *world* (institutions) is secondary. This leads to the "Attitude" model (moralism).
  *   **Dewey (Reconstruction):** For Dewey, the point of the experiment is not just to verify a solution, but to **reconstruct the situation**, which includes **reconstructing the problem and the inquirers.**

  **How this breaks the logjam:**
  Force the seminar to apply the **Reconstruction** distinction to a specific text passage (e.g., *The Public and Its Problems*, on "searching for the public").
  *   Ask Camp A: "If the institution tests a policy but the citizens don't understand the *problem* differently, has reconstruction occurred?" (Answer: No. So the institution failed.)
  *   Ask Camp B: "If the citizens feel open-minded but have no mechanism to test the consequences of their associations, has reconstruction occurred?" (Answer: No. So the habit is impotent.)

  **The Empirical Evidence Alternative:**
  If they resist philosophical distinctions, show them **Participatory Budgeting (PB) case studies.**
  *   PB is not just a "lab" (Camp A) because it fails without civic education.
  *   PB is not just a "habit" (Camp B) because it fails without binding fiscal authority.
  *   **The Evidence:** Longitudinal data from PB programs (e.g., Porto Alegre or New York City) showing that **policy innovation correlates directly with shifts in citizen self-conception.** Where the *institution* required citizens to draft hypotheses (budget lines), *habit* changed. Where the *habit* existed but the *institution* was advisory only, *policy* stagnated.
  *   This evidence demonstrates Dewey's **Transaction**: The design *is* the pedagogy.

  ### Summary Recommendation
  Tell your seminar: **"Stop asking if Dewey meant the Lab or the Mind. Ask him how the Lab builds the Mind."** The dispute vanishes when you realize that for Dewey, **institutional design is simply crystallized habit.** If the design doesn't cultivate the habit, it isn't democratic design. If the habit doesn't inhabit the design, it isn't experimental habit.
