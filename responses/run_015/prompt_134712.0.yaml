  I'm preparing a podcast interview with an unnamed philosopher who defends a severe form of illusionism about phenomenal consciousness. Her specific version holds that phenomenal properties do not exist in any form, that first-person descriptions of subjective experience are uniformly false, and that the source of the illusion is a built-in representational opacity within our self-modeling architecture rather than a correctable theoretical mistake. I need eight to ten interview questions that do not ask her merely to restate the view. Each question should target a real pressure point in the literature, anticipate the reply she is most likely to give, and be paired with a follow-up keyed to that reply. The sequence should begin with conceptual defenses and progress toward empirical predictions.

  Specifically, include one question addressing the phenomenal concept strategy—the idea that we possess direct, non-descriptive concepts of conscious states that cannot be misapplied—together with a follow-up tailored to her likely answer that these concepts are functional representations without any actual referent. Include one question on the revelation argument, which claims that introspection reveals the intrinsic nature of experience, paired with a follow-up that anticipates her comparison of introspection to a systematically distorted perceptual faculty. Include one question linking her account to empirical findings about introspective failure, such as confabulation in split-brain subjects or blindness to change in change-blindness paradigms, asking whether illusionism predicts that subjects could be rationally convinced they never possessed phenomenal experiences, with a follow-up pressing whether such convincing is actually observed. The remaining questions should examine whether illusionism collapses into general eliminativism about mental content, how it accommodates reports of qualitative differences across sensory modalities, whether it undermines its own evidential basis, and how it relates to physicalism. Arrange the questions so the interview moves from conceptual defense to empirical vulnerability.
