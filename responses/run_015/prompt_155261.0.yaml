      *   *Functionalism:* Mental states are defined by their causal role (inputs, other states, outputs). In firmware terms: The mental state is the *API spec*, not the code. `struct PainInterface { void trigger(); bool is_active(); void cause_withdrawal(); };`
      *   *Multiple Realizability:* Different hardware can implement the same API. Silicon, vacuum tubes, biology, aliens.
      *   *The Argument:* If `Pain` can be implemented on Carbon-Based Hardware (humans) and Silicon-Based Hardware (robots), then `Pain` cannot be *identical* to `Carbon_Neural_Firing_Pattern`. It must be the spec they both satisfy.
      *   *Drafting the Translation:* Need to use terms like "spec," "implementation," "substrate," "black box," "causal topology." Ensure I don't accidentally make functionalism sound *too* much like software engineering (which is a risk).

  3.  **Part 2: The Residue Report (The Hard Questions):**

      *   **Question 1: Leakage.**
          *   *User's premise:* Abstractions leak (timing, power, voltage). Pain "hurts" (qualia).
          *   *Philosophical reality:* This is the "Hard Problem" / Qualia objection. Functionalism treats the "hurt" as part of the functional role (disposition to say "ouch"). But the *feeling* itself (phenomenal consciousness) is often argued to be non-functional.
          *   *The Conflict:* In firmware, leakage is a bug or a side channel. In mind, the "leakage" (the feeling) might be the *only thing that matters*.
          *   *Verdict:* Functionalism struggles here. If the "leak" is the essence, the interface model fails.

      *   **Question 2: Finite Test Suites vs. Infinite Inputs.**
