          *   *The Conflict:* If two systems differ on an impossible input, are they functionally equivalent? Functionalism says the *disposition* matters. If the disposition differs, the state differs, even if never triggered.
          *   *Implication:* This makes mental states abstract mathematical objects (functions from all possible inputs to outputs), not empirical observations. This creates an epistemic gap: we can never *know* if something is in pain, only infer it.

