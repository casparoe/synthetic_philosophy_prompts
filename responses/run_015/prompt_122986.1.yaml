      Start by addressing the "one answer." The answer is that the subjects were in a visual state that supported discrimination and confidence judgments but fell below the response criterion imposed by Protocol A. This isn't a guess; it's the only interpretation that saves the phenomena across both conditions. The heterophenomenological world is not a transcript of what subjects say in one context; it is the theorist's model of the subject's intentional stance that makes sense of why they say nothing in A and something in B. If I treat the Protocol A reports as the sole truth, I cannot predict the Protocol B data. If I treat the Protocol B reports as the sole truth, I cannot explain the silence in A. The HP world posits a state with specific properties—discriminatory capacity coupled with high reporting threshold—that explains the divergence.

