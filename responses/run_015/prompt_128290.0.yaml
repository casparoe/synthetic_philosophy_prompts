  4.  **Analyzing Disanalogies (Task 2 & 3):**

      *   *Determinism:* Chaos is *deterministic* chaos. History is likely *indeterministic* (free will, genuine novelty). If history isn't deterministic, it's not chaos; it's just randomness or complexity.
      *   *Epistemic vs. Ontological:* In weather, the unpredictability is ontological (in practice) but epistemic (in principle, if we knew everything). In history, is the unpredictability because we lack data, or because the future doesn't exist yet?
