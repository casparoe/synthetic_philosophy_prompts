          2.  *Queue Test:* Scarce goods allocated by connections without clear rules.
      *   **The Request:** Diagnose the stalemate (verbal, normative, evidentiary, etc.) using what the camps *actually say* (not general surveys). Evaluate the user's hunches (are they real insights or just polite agreement?). Define what progress looks like (distinction, unit of analysis, study design, change of question) or if no progress is possible.
      *   **Tone:** Straight, intellectual, rigorous, acknowledging the user's specific expertise (the "arrangement").

  2.  **Deconstruct the Stalemate:**
      *   *Economists:* Focus on efficiency, principal-agent problems, market distortions, measurable costs. They need "corruption" to be a variable they can regress.
      *   *Anthropologists:* Focus on meaning, social cohesion, moral economies, the imposition of Western state ideals. They see "corruption" as a label used to delegitimize certain social forms.
      *   *The Core Tension:* It's not just semantics. It's about the *ontology of the state*. Economists assume a Weberian ideal type (impartial bureaucracy) is the baseline/norm. Anthropologists see that baseline as a specific cultural artifact, not a universal truth.
      *   *User's Role:* The "arrangement" practitioner. You know that digitization often fails because it tries to kill "the arrangement" without replacing its function.

  3.  **Evaluate Hunch #1 (Diagnostic vs. Condemnatory):**
      *   *Verdict:* Partially right, but too shallow. It explains the *heat*, but not the *stuckness*. If it were just semantic, they could agree to use different terms (e.g., "informal allocation" vs. "rent-seeking"). The fact that they fight over the word "corruption" suggests they are fighting over the *legitimacy of the state form*.
      *   *Refinement:* It's not just sliding between uses; it's a clash over whether the *deviation* is from a universal norm or a local contract.

  4.  **Evaluate Hunch #2 (Empirical/Normative + Evidence Mismatch):**
      *   *Verdict:* Stronger. This hits the methodological impasse. Economists need $N$ large enough for significance; Anthropologists need depth to understand meaning. They are talking past each other because they define "data" differently.
      *   *Refinement:* The "unsettled empirical question" is actually a *counterfactual* problem. What would happen if the "arrangement" vanished? Economists assume efficiency gains; Anthropologists assume social collapse or exclusion of the poor.

  5.  **Evaluate the Probes:**
      *   *Registry Test:* Good for separating secrecy from partiality. Highlights that economists care about distortion, anthropologists care about the *social contract* implied by secrecy.
      *   *Queue Test:* Excellent for highlighting the "entitlement" problem. If there is no right to the good, is there a violation? This cuts to the heart of "public office."

  6.  **Diagnose the Stalemate:**
      *   It is **not** merely verbal.
      *   It **is** a normative disagreement about the benchmark (Weberian bureaucracy vs. Moral Economy).
      *   It **is** a fight about data (indices vs. ethnography).
      *   *Crucial Insight:* It's a **Category Error regarding the Unit of Analysis**. Economists analyze *transactions* (cost/benefit). Anthropologists analyze *relationships* (obligation/reciprocity). You cannot price a relationship without destroying it (conceptually).

  7.  **Formulate a Path to Progress:**
      *   *Stop defining "corruption".* Start defining "allocation mechanisms under institutional scarcity."
      *   *New Unit of Analysis:* The *gap* between formal mandate and informal capacity. (This aligns with the user's "arrangement" experience).
      *   *Study Design:* Process tracing of a specific transaction through both the formal and informal ledgers. Not "is it corruption?" but "what work does this payment do that the formal salary doesn't?"
