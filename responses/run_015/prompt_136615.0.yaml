      *   *The Probes:* Validate them. The Queue Test is particularly powerful for the "entitlement" question.
      *   *The Diagnosis:* It's an ontological clash. The State vs. The Social.
      *   *Progress:* Shift from "Corruption" to "Informal Governance." Use the user's digitization experience as the bridge. The "Arrangement" is a *shadow institution*.
      *   *Actionable Advice:* Don't ask "Is this corruption?" Ask "What institutional void does this fill?" and "What happens if we close it without filling the void?"

  9.  **Refining the Tone:**
