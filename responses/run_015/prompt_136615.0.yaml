  *(Final thought on the "Registry Test")*: If a bribe is public, is it a tax? If it's a tax, who controls the revenue? This distinction matters. I should mention that.

  *(Final thought on the "Queue Test")*: This touches on the definition of "public good." If the school seat isn't a right, is it a privilege? This leads to the "entitlement" argument.

