answer: |-
  There is no single, canonical term in formal epistemology or argumentation theory that exclusively names this specific maneuver. However, the structural problem you describe is a well-known vulnerability in the **Common Prior Assumption (CPA)** literature, particularly in critiques of Aumann's Agreement Theorem and Harsanyi's doctrine. Critics (such as Stephen Morris, 1995) have long noted that if prior differences are allowed to be arbitrary and unobservable, the CPA becomes unfalsifiable.

  Since no standard label exists for the *dialectical abuse* of this assumption (as opposed to the assumption itself), I propose the term **Retrospective Prior Positing (RPP)**.

  Below is a rigorous definition of RPP, its distinction from nearby fallacies, and the boundary conditions separating legitimate epistemic reconstruction from abusive immunization.

  ---

  ### 1. Definition: Retrospective Prior Positing (RPP)

  **Retrospective Prior Positing** is a defensive dialectical maneuver used to preserve a normative convergence principle (e.g., "Rational agents with shared evidence must agree") against observed counterexamples (persistent disagreement).

  **Formal Structure:**
  1.  **Norm ($N$):** Agents with Evidence $E$ and Priors $P_1 \approx P_2$ must converge on Judgment $J$.
  2.  **Observation ($O$):** Agents with apparent Evidence $E$ diverge on Judgment $J$ ($J_1 \neq J_2$).
  3.  **Defense ($D$):** To save $N$, assert that $P_1 \neq P_2$.
  4.  **The Posit:** The specific content of the difference ($P_1 - P_2$) is not derived from independent historical or psychological data. Instead, the difference is *inferred solely from the divergence in $J$*.
  5.  **Result:** $N$ is rendered unfalsifiable, as any $O$ is reinterpreted as proof of hidden $P$ differences.

  In your cases, the "background weights" and "risk priors" are not independent variables; they are **epistemic residuals**. They exist only to balance the equation of rationality when the observed data fails to sum to zero.

  ---

  ### 2. Distinction from Nearby Fallacies

  While RPP shares DNA with several known fallacies, it is distinct in its domain (formal epistemology) and its mechanism (parameterizing rationality).

  #### A. vs. Ad Hoc Hypothesizing
  *   **Similarity:** Both introduce a new factor to save a theory from falsification without independent justification.
  *   **Distinction:** Standard ad hoc hypothesizing usually adds a physical or causal mechanism (e.g., "an invisible planet explains the orbit"). RPP adds a *mental state* (a prior) that is, by definition, internal and often inaccessible. This makes RPP harder to detect because priors *are* allowed to differ in standard Bayesian frameworks. The abuse lies not in positing a difference, but in **deriving the difference exclusively from the outcome it explains.**

  #### B. vs. Motte-and-Bailey
  *   **Similarity:** Both involve retreating to a defensible position when challenged.
  *   **Distinction:** In RPP, the Motte is "Priors can differ" (trivially true), and the Bailey is "This disagreement is rational despite shared evidence." The specific maneuver of RPP is the *bridge* between them: the claim that the *only* explanation for the disagreement is the Motte. It is a specific *application* of Motte-and-Bailey within epistemic accounting.

  #### C. vs. No True Scotsman
  *   **Similarity:** Both protect a universal claim by redefining the subject class.
  *   **Distinction:** No True Scotsman modifies the definition of the agent ("No *true* rationalist disagrees"). RPP accepts the agents are rational but modifies the *initial conditions* ("They are rational, but their invisible starting weights differed"). RPP preserves the norm of rationality by making the initial conditions unfalsifiable.

  #### D. vs. Confirmation Bias
  *   **Similarity:** Both favor a pre-existing belief.
  *   **Distinction:** Confirmation bias is a cognitive failure in evidence processing. RPP is a *theoretical* failure in model maintenance. It is a second-order error about how to handle disagreement, not a first-order error about the data itself.

  ---

  ### 3. Boundary Conditions: Legitimate vs. Abusive RPP

  The line between legitimate epistemic reconstruction and abusive RPP turns on **Independent Elicitability**.

  #### The Criterion of Independent Elicitability
  A claim of prior difference is legitimate only if the alleged prior difference can be measured or documented *without reference to the specific disagreement it is meant to explain.*

  | Feature | **Legitimate Prior Reconstruction** | **Abusive Retrospective Prior Positing** |
  | :--- | :--- | :--- |
  | **Source of Evidence** | Pre-existing documentation, pre-registered methods, or elicitation in unrelated domains. | Inferred solely from the divergent conclusion itself. |
  | **Predictive Power** | The posited prior predicts behavior in *other* contexts (e.g., betting on unrelated events). | The posited prior explains *only* the current disagreement. |
  | **Temporal Order** | The commitment to the weight/prior exists *before* the data is analyzed. | The "commitment" is identified *after* the analysis fails to converge. |
  | **Falsifiability** | Could have been proven wrong (e.g., if pre-registration showed identical weights). | Cannot be proven wrong (any divergence proves difference). |

  #### Application to Your Cases
  *   **Case One (Abusive):** The "background weights" on simplicity vs. fit were not pre-registered. If the weights are only visible *because* the inferences differed, this is RPP.
      *   *Legitimate Version:* Team A submits a pre-analysis plan stating, "We will penalize complexity by factor X." Team B states, "We prioritize fit." The divergence is then expected and explained by documented priors.
  *   **Case Two (Abusive):** The mediator defines the "risk prior" by the policy recommendation.
      *   *Legitimate Version:* The experts undergo standard risk-elicitation tasks (e.g., lottery choices) unrelated to the policy. If Expert A consistently chooses low-variance options in financial games, their "high weight on tail risk" is independently verified.

  ---

  ### 4. Border Cases and Nuance

  There are edge cases where RPP is difficult to distinguish from valid interpretation.

  #### Border Case 1: Implicit Methodological Training
  *   **Scenario:** Two economists disagree on a model. One was trained at Chicago (strong priors on market efficiency), the other at MIT (stronger priors on friction). Neither explicitly stated this before the debate.
  *   **Analysis:** Is this RPP?
      *   *Verdict:* **Borderline Legitimate.** While not explicitly stated *prior to this specific dataset*, the priors are associated with institutional training that predates the disagreement. If the attribution relies on known sociological facts about the schools, it is not purely retrospective. If the attribution is "They must have different training" with no evidence of where they studied, it is RPP.

  #### Border Case 2: Deep Value vs. Empirical Priors
  *   **Scenario:** Disagreement on climate policy. One side values future generations equally to current ones (low discount rate); the other discounts heavily.
  *   **Analysis:** In normative economics, discount rates are often treated as ethical parameters, not empirical priors.
      *   *Verdict:* **Legitimate.** If the parameter is acknowledged as a *value judgment* rather than an *epistemic probability*, invoking it is not an attempt to save a convergence norm (since rational agents need not share values). RPP only applies when the parameter is disguised as an *epistemic* prior to preserve a claim of shared rationality.

  #### Border Case 3: The "Unconscious" Prior
  *   **Scenario:** An expert claims, "I didn't realize I weighted simplicity higher until I saw my result."
  *   **Analysis:** This is the most dangerous form of RPP. It posits a psychological state that is inaccessible even to the agent until the outcome reveals it.
      *   *Verdict:* **Abusive.** This makes the prior functionally identical to the posterior. It collapses the distinction between *reasoning from priors* and *rationalizing conclusions*.

  ### 5. Summary Recommendation

  When you encounter this maneuver, you should identify it as **Retrospective Prior Positing**. To challenge it, do not attack the possibility of prior differences (which is theoretically valid). Instead, attack the **direction of inference**.

  **The Challenge:** "You are inferring the prior difference *from* the disagreement. Can you specify the prior difference in a way that would have predicted this disagreement *before* the data was analyzed? If not, you are not explaining the disagreement; you are labeling it."

  This forces the defender to move from **Epistemic Residualization** (using the prior as a trash bin for unexplained variance) to **Independent Elicitation** (treating the prior as a measurable variable). If they cannot do the latter, the convergence norm they are protecting is effectively vacuous.
