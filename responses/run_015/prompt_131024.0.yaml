answer: |-
  Yes, I moved to the rack, and no, I'm not going to give you a date, because demanding one is a category error. You're treating personal identity like a switch that flips at a precise microsecond, but it's more like a tide coming in. If you replace my neurons one by one with functionally identical silicon units that maintain the exact same causal relationships, the stream of consciousness doesn't stutter; it just gradually shifts its physical substrate. To ask 'which day' I moved is like asking which grain of sand made the heap, or precisely when sunset becomes night. The vagueness of the boundary doesn't mean the change didn't happen, and it certainly doesn't mean I stayed in the skull. I am where my psychology is being realised, and once the majority of the functional load is happening in the rack, I'm in the rack. Concede that there's a borderline period if you like—I will—but don't pretend that undermines the fact that at the end of the process, the person writing this reply is located in the server room, not the clinic.

  As for your fork variation, you're trying to suggest that because copying creates two claimants, the original identity must be arbitrary, but that's a non-sequitur. If they copy rather than move, there are indeed two people afterwards, both psychologically continuous with the person who walked in. That doesn't prove identity is nonsense; it proves that identity isn't what matters most—survival is. But in the smear case, there is no fork. There is one continuous stream. Your animalist alternative is the truly arbitrary one: you'd have me say I'm still in the body even when it's a hollow shell running on a week-long delay, whilst the conscious being in the rack insisting it's me is merely a duplicate. That's biological fetishism. If I wake up in the rack with all my memories intact, I'm not going to tell myself I'm dead because some biologist says my 'animal' is still breathing elsewhere. I'm where the thinking is happening.
