prompt: |-
  I'm taking a course on machine ethics this semester, and we've been going back and forth over a question that keeps coming up in our readings: should AI systems be designed to reason as utilitarians, or as deontologists? I want to make the question concrete by working through a real case. In March 2018, an Uber self-driving test vehicle in Tempe, Arizona struck and killed a woman who was walking a bicycle across the street outside a crosswalk. From what I've gathered of the accident investigation: the vehicle's sensor system detected her roughly six seconds before impact, but the automatic emergency braking had been disabled, and the human safety driver seated in the car was looking at her phone and did not intervene. The investigation attributed the probable cause of the crash to the driver's failure to monitor the vehicle, and the driver was eventually charged and pleaded to a lesser offense. I know that's a simplified version of the record, but I think it's enough to work with.

  What I'd like is a careful mapping in both directions. First, the deontological side: what does it look like to say the vehicle should have been governed by rules — stop for apparent pedestrians, never place a person in the vehicle's path — rather than by consequences, and what would a deontological design have required in the seconds before impact? Then the utilitarian side: what does consequentialist optimization look like in this situation, and does it even have a clean recommendation here, given the uncertainty about her trajectory, the disabled braking, and the other risks a sudden stop would have created? I'm especially interested in the hybrid question people raise about autonomous vehicles: is it coherent to build a system that uses utilitarian computation to choose among actions but is bounded by deontological side constraints, and does the Tempe case help or hurt that architecture?

  Finally, I'd like you to say what the episode shows about the theory itself, not just what the theory says about the episode: what does this case actually settle about the utilitarian-versus-deontologist debate, and what does it leave open? Where the accident record or the legal outcome gives a clear answer, say so plainly; and where reasonable people who work on this disagree — for instance, over whether the system should have braked, over how much weight to give the decision to disable the emergency braking, or over whether the case supports or undermines hybrid designs — please mark those points as genuinely contested rather than presenting one side as the consensus.
