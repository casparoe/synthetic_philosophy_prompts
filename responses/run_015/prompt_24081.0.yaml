          4.  Evaluate what the case settles vs. leaves open regarding the ethical theories themselves (meta-ethical reflection).
      *   **Constraints:** Be careful, nuanced, mark contested points clearly, avoid false consensus, acknowledge the specific facts provided (sensors detected 6s prior, AEB disabled, driver distracted).

  2.  **Deconstruct the Case Facts (as provided & generally known):**
      *   *Victim:* Elaine Herzberg.
      *   *Location:* Tempe, AZ (outside crosswalk).
      *   *Detection:* System detected object ~6 seconds before impact.
      *   *System State:* Automatic Emergency Braking (AEB) disabled by Uber (to prevent erratic behavior/reliance issues).
      *   *Human Factor:* Safety driver (Rafaela Vasquez) distracted (phone), did not intervene.
      *   *Outcome:* Fatality.
      *   *Legal:* Driver charged (negligence), Uber largely escaped criminal liability but settled civilly.

  3.  **Drafting Section 1: The Deontological Perspective:**
      *   *Core Principle:* Duties, rules, rights. Actions are right/wrong in themselves, not just by outcome.
      *   *Application to AV:* "Do not kill," "Do not use humans as mere means," "Follow traffic laws."
      *   *Specific Design Implication:* A hard constraint. If a pedestrian is detected in the path, the car *must* brake, regardless of comfort or traffic flow.
      *   *The "6 Seconds" Factor:* A deontological system would view the detection as triggering a duty to act. Disabling AEB is a violation of the duty of care.
      *   *Nuance:* Deontology isn't just "stop at all costs." It's about adherence to moral norms. But in this specific context, the norm is "preserve life when possible."
      *   *Critique/Limit:* What if braking causes a rear-end collision? (Rule conflicts).

  4.  **Drafting Section 2: The Utilitarian Perspective:**
      *   *Core Principle:* Maximize overall well-being/minimize harm.
      *   *Application to AV:* Cost-benefit analysis of actions.
      *   *The Calculation:* Probability of hitting pedestrian vs. probability of rear-end collision if braking hard vs. probability of swerving into other lanes.
      *   *The "6 Seconds" Factor:* A utilitarian system weighs the certainty of harm (hitting pedestrian) against the risk of harm (braking suddenly).
      *   *The AEB Decision:* Why did Uber disable it? Likely a utilitarian calculation (false positives cause erratic braking -> passenger discomfort/safety risk -> public trust erosion). *Crucial Point:* This was a *development* decision, not necessarily a *real-time* decision.
      *   *Uncertainty:* Utilitarianism struggles with high uncertainty. If the system wasn't sure she would stay in the path, braking might be "sub-optimal" based on the data at the time.
      *   *Contested Point:* Was disabling AEB a net utility gain (smoother ride/testing progress) or loss (increased risk)?

  5.  **Drafting Section 3: The Hybrid Approach:**
      *   *Concept:* "Constrained Optimization." Maximize utility *subject to* deontological constraints (e.g., "Never intentionally hit a pedestrian," "Always obey speed limits").
      *   *Application:* The car tries to be efficient (utilitarian) but cannot violate safety thresholds (deontological).
      *   *Tempe Relevance:* A hybrid system would likely have had a "hard constraint" on braking for detected obstacles. Disabling AEB would violate the constraint.
      *   *Coherence:* Is it coherent? Yes, structurally. But does it solve the problem? It pushes the ethical decision to the *design phase* (setting the constraints) rather than the *runtime phase*.
      *   *Tempe's Lesson:* The failure wasn't necessarily the ethical framework of the code, but the *engineering management* decision to disable safety features. This highlights the "Gap between Design and Deployment."

  6.  **Drafting Section 4: What the Case Settles vs. Leaves Open (Meta-Ethical Reflection):**
      *   *Settled:*
          *   Human oversight is a critical failure point (both theories agree distraction is bad).
          *   Disabling safety systems without compensation is legally/morally precarious.
          *   Transparency matters (knowing *why* AEB was off).
      *   *Open/Contested:*
