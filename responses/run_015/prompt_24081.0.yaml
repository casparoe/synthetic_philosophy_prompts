          *   *Risk Allocation:* Who bears the risk? Pedestrians or Passengers? (Utilitarians might trade off; Deontologists might prioritize the vulnerable road user).
          *   *Corporate Responsibility:* Is the corporation a moral agent? (Both theories struggle here, but deontology might demand stricter duty).
          *   *The "Disabled AEB" Decision:* Was this a utilitarian calculation by Uber? If so, did it fail? Or was it just cost-cutting?
      *   *Conclusion:* The case doesn't prove one theory right. It shows that *implementation* matters more than *abstraction*. It highlights the difference between "machine ethics" (the code) and "organizational ethics" (the company).

