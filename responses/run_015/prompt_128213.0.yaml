answer: |-
  # JOINT STATEMENT ON THE EPISTEMIC STATUS OF PHILOSOPHICAL INTUITION PUMPS

  **Date:** October 26, 2023
  **Parties:** The Coalition for Conceptual Clarity (Defenders) and The Cognitive Bias Research Group (Skeptics)

  ## I. AGREED CLAIMS

  The undersigned parties, despite significant theoretical disagreements, affirm the following propositions as a basis for continued adversarial collaboration:

  1.  **Nature of the Tool:** An "intuition pump" is defined as a narrative or hypothetical scenario constructed to elicit a specific pre-theoretical judgment or phenomenological response regarding a conceptual, modal, or normative claim.
  2.  **Existence of Framing Effects:** It is an established empirical fact that human judgment is sensitive to irrelevant variations in the presentation of information. Changes in wording, ordering, emotional valence, and narrative immersion can shift reported intuitions regarding the same underlying logical structure.
  3.  **Shared Teleological Goal:** Both parties agree that the primary objective of philosophical methodology is to distinguish genuine conceptual insight (tracking mind-independent truths or robust conceptual structures) from psychological manipulation (tracking cognitive biases or heuristic errors).
  4.  **Conditions for Misleading Pumps:** Both parties agree that an intuition pump is considered misleading rather than illuminating if it can be demonstrated that the elicited judgment reverses solely due to features acknowledged by the respondent as normatively irrelevant (e.g., the order in which options are presented), provided the respondent is given the opportunity to reflect on this irrelevance.
  5.  **Need for Calibration:** Both parties agree that reliance on raw, unreflective intuition without cross-checking against alternative framings or formal models constitutes a methodological risk that must be mitigated.

  ## II. DISAGREEMENTS TABLE

  The following table outlines the precise points of contention. Each position is phrased to be acceptable to the respective camp without conceding to the opposing view.

  | Issue | Defenders' Position | Skeptics' Position |
  | :--- | :--- | :--- |
  | **1. Epistemic Authority vs. Framing Effects** | Framing effects constitute noise that can be filtered out through reflective equilibrium and peer critique. The existence of bias does not undermine the *prima facie* epistemic authority of stable intuitions held by trained philosophers. | Framing effects constitute a systemic defeater. Because cognitive architecture is inherently context-sensitive, the burden of proof lies on the Defender to demonstrate that a specific pump is immune to framing, rather than on the Skeptic to prove it is biased. |
  | **2. Revealing vs. Manufacturing Intuition** | There is a principled boundary between revealing and manufacturing. A pump *reveals* intuition if it isolates a conceptual competence that persists across varied valid framings; it *manufactures* intuition if it relies on rhetorical sleight-of-hand to create a response where no prior conceptual commitment existed. | The distinction is not principled but gradient. All pumps "manufacture" judgment to some degree by activating specific cognitive modules. The question is not whether a boundary exists, but whether the manufactured judgment correlates with any truth-tracking capacity, which remains unproven. |
  | **3. Replaceability by Formal Modeling** | There are philosophical domains (e.g., phenomenology, normative ethics) where formal computational modeling cannot, even in principle, capture the relevant data. In these domains, intuition pumps are irreplaceable tools for accessing the subject matter. | Formal modeling is limited only by current technology and conceptual translation efforts. Any domain claimed to be immune to formalization is likely suffering from vague definitions. In principle, computational simulation of cognitive agents could replicate or supersede the function of pumps in all domains. |

  ## III. CRUXES AND HYPOTHETICAL CASES

  We identify two specific cruxes where empirical or theoretical resolution would significantly shift the dialectic. For each crux, we propose a concrete hypothetical case and record the predicted outcomes and interpretations for each camp.

  ### Crux 1: Expert Stability vs. Population Divergence
  **The Question:** Does an intuition pump that yields stable judgments among trained philosophers, but divergent judgments across the broader population, retain epistemic weight?

  **Hypothetical Case: The Reversed-Framing Tunnel Case**
  *   **Scenario A (Abstract):** Participants view a quantitative-risk diagram showing a utilitarian calculation: Action X saves 5 lives at the cost of 1 direct intervention. Action Y saves 0 lives with 0 direct interventions.
  *   **Scenario B (Immersive):** Participants engage in a first-person VR simulation where they must physically push a large individual off a bridge to stop a trolley, saving five workers on the track.
  *   **Condition:** Trained philosophers show high consensus on Scenario A (Choose X) and high consensus on Scenario B (Do not Choose X), despite acknowledging the structural equivalence. The general population shows high variance in both.

  **Predicted Outcomes:**
  *   **Defenders:** The divergence between A and B among experts indicates a genuine moral distinction (e.g., doing vs. allowing, or personal force) that the abstract model fails to capture. The expert consensus validates the pump as tracking a nuanced normative reality that lay intuition misses.
  *   **Skeptics:** The divergence indicates that the immersive narrative activates emotional heuristics that override logical consistency. Expert consensus merely reflects shared professional socialization into a specific bias, not increased truth-tracking ability. The pump exploits the "visceral" frame to manufacture a deontological constraint that vanishes under abstraction.

  ### Crux 2: Irreplaceable Domains
  **The Question:** Is there any philosophical domain in which formalization is impossible in principle, rendering pumps irreplaceable?

  **Hypothetical Case: The Inverted Qualia Protocol**
  *   **Scenario:** A thought experiment asking whether it is possible for two subjects to behave identically while having inverted subjective experiences (e.g., one sees "red" where the other sees "green").
  *   **Condition:** Attempts are made to model this using exhaustive functional-state maps and neural correlates. The models predict behavior perfectly but fail to generate a consensus on whether the "inversion" is metaphysically possible or merely conceptually coherent.

  **Predicted Outcomes:**
  *   **Defenders:** This domain (phenomenal consciousness) is inherently first-personal. Formal models track third-person functional data. Therefore, intuition pumps are the *only* access point to the modal facts about consciousness. If the pump suggests inversion is possible, that is evidence of metaphysical possibility, regardless of formal modeling.
  *   **Skeptics:** The failure of formalization is a failure of current conceptual vocabulary, not a limit of principle. The "intuition" of possibility is a cognitive illusion generated by the inability to imagine the neural constraints. A sufficiently advanced computational model of the mind would demonstrate that the inversion is functionally incoherent, rendering the pump's output obsolete.

  ## IV. ASSESSMENT OF VERBAL DISPUTE

  We have assessed whether the disagreement is merely verbal (i.e., arising from different definitions of key terms rather than substantive factual or normative claims).

  **Assessment:**
  While there is terminological friction regarding the definition of "intuition" (Defenders tend to view it as a form of intellectual seeming; Skeptics tend to view it as a reported psychological state), the dispute is **not merely verbal**.

  1.  **Empirical Stakes:** The parties disagree on the predicted stability of judgments under controlled framing variations. This is an empirical matter resolvable through experimental data.
  2.  **Normative Stakes:** The parties disagree on the default epistemic status of a judgment. Defenders hold that coherence grants justification; Skeptics hold that genealogical origin (causal history of the judgment) defeats justification. This is a substantive methodological disagreement.

  **Conclusion:**
  The collaboration acknowledges that while terminology requires careful mapping, the core dispute concerns the reliability of human cognitive architecture in tracking philosophical truth. Resolution requires further adversarial testing of the specific cruxes identified in Section III.
