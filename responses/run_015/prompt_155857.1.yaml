  **Security Checkpoint Z**

  **Setting:** *A TSA PreCheck lane. ACHILLES wears a blue uniform and latex gloves. The TORTOISE stands beside a conveyor belt, holding a carry-on shell-case.*

  **ACHILLES:** (Holding up a toiletry bag) "Sir, I need to verify you packed this yourself."

  **TORTOISE:** "Certainly. Let's proceed deductively. Premise A: I purchased the bag. Premise B: I was alone in my hotel room when the bag was closed."

  **ACHILLES:** "Okay. And Conclusion Z: You packed the bag."

  **TORTOISE:** "Precisely."

  **ACHILLES:** (Stops the belt) "I can't let you through yet. You haven't established Premise C: 'If A and B are true, then Z must be true.'"

  **TORTOISE:** "My good agent, that isn't a premise. That's Modus Ponens. It's a rule of inference. It's syntactic, not semantic. It's how you move the pieces, not a piece itself."

  **ACHILLES:** (Pulls out a notepad) "Is 'Syntax' liquids or gels?"

  **TORTOISE:** "It's not a substance! It's the operation you perform to accept the conclusion. You don't need to pack the rule inside the suitcase to use it."

  **ACHILLES:** "TSA Protocol 4.1: All rules governing the validity of the contents must themselves be contained within the bins for scanning. If the rule isn't in the bin, I can't apply it. So, please place Rule C in the tray."

  **TORTOISE:** (Sighs, writes *C* on a sticky note, drops it in a bin) "Fine. Rule C is screened."

  **ACHILLES:** "Great. Now, I accept A, B, and C. But I still haven't reached Z. I need Premise D: 'If A, B, and C are true, then Z must be true.'"

  **TORTOISE:** "Achilles, we're going to be here until the heat death of the universe. You're treating the engine of logic like it's luggage."

  **ACHILLES:** "I'm just following the chain of justification. Put D in the tray."

  **TORTOISE:** (Writing furiously) "This is absurd. The rule doesn't need semantic backing! It's a formal operation!"

  **ACHILLES:** "Is 'Formal Operation' declared on your customs form?"

  **TORTOISE:** "No!"

  **ACHILLES:** "Then I need Premise E to validate why 'Formal Operations' don't need declaration. Put it in the tray."

  *(Time passes. The conveyor belt hums silently. The line behind them has wrapped around the terminal and out into the parking lot. A flight announcement chimes overhead.)*

  **ANNOUNCER:** "Final boarding for Flight Z to Conclusion. All passengers must be at the gate."

  **TORTOISE:** "There goes my flight."

  **ACHILLES:** (Still writing, without looking up) "Almost there. I just need Premise F to validate the rule that allows me to accept Premise E..."

  **TORTOISE:** "Achilles, the plane left."

  **ACHILLES:** "Logically speaking?"

  **TORTOISE:** "Physically speaking."

  **ACHILLES:** (Pauses, pen hovering) "Hmm. Do you have a rule that validates the connection between physical events and logical conclusions? Let's call it Premise G..."

  **TORTOISE:** (Retracts head into shell) "I'm checking this bag."

  **ACHILLES:** "Smart. Does the checker need a premise to check?"
