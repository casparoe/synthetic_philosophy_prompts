answer: |-
  Here is a plan for your ninety-minute session, structured around your three requirements, followed by a recommendation on the "wrinkle" and the scope of the lesson.

  ### 1. Dependency Structure: The Order of Operations

  You cannot teach the formula before you teach the constraint. If you present $P_{new}(H) = \sum P(H|E_i)P_{new}(E_i)$ first, students will treat it as a mathematical trick for when $P_{new}(E) \neq 1$. They will not know *when* it is licensed.

  **The Required Sequence:**
  1.  **Break the Reflex (0–15 mins):** Present a case where conditioning is impossible (no proposition becomes certain). Show that $P_{new}(H) \neq P(H|E)$ for any $E$ with $P_{new}(E)=1$.
  2.  **Isolate the Invariant (15–30 mins):** Ask: "If the marginals on the partition change, what *must* stay fixed to prevent total arbitrariness?" Introduce **Rigidity** here.
  3.  **Justify Rigidity (30–40 mins):** This is the critical pivot. Do not present rigidity as "whatever is left over." Present it as a **constraint on the update policy justified by causal/explanatory independence**. The experience acts directly on the partition cells ($E_i$); its effect on $H$ is mediated *only* through the $E_i$.
  4.  **Derive the Formula (40–55 mins):** Derive Jeffrey Conditioning from Rigidity + Probability Axioms.
  5.  **Application & Iteration (55–75 mins):** Work the example.
  6.  **Assessment (75–90 mins).**

  **What breaks if swapped?**
  If you introduce Rigidity as "whatever is left over" (Option 3) before justifying it causally (Option 2), students will view it as a definition rather than a substantive assumption. They will fail to spot cases where Rigidity is violated (e.g., when the experience gives information about $H$ *independent* of the partition).
  If you teach the Formula before Rigidity, they will apply it to cases where the partition is not rigid (e.g., "I feel lucky," which shifts $P(Win)$ but also changes $P(Win|Ticket)$).

  **Recommendation on Rigidity:** Teach it as a **constraint the agent imposes on herself**, but emphasize that she is only *rationally permitted* to impose it when the **causal story** supports it (the experience affects $E_i$ directly, and $H$ only via $E_i$).

  ### 2. The Carrying Example: The Jellybean under Dim Light

  Your intuition is correct: the "coloured object under unreliable light" (Jeffrey's original jellybean case) is the right case, but it requires careful staging to meet your criteria.

  **The Setup:**
  *   **Partition:** The colour of the jellybean (Red, Green, Blue). Exhaustive and mutually exclusive.
  *   **Experience:** A glance under dim light.
  *   **Input:** The experience shifts the probabilities of the colours (e.g., $P_{new}(Red) = 0.6$), but does not make any colour certain.
  *   **Hypothesis ($H$):** The flavour of the jellybean (Cherry vs. Lime).

  **Why this works:**
  1.  **Plausible Rigidity:** The link between Colour and Flavour is physical/chemical. The visual experience affects your belief about Colour directly. It should not affect your belief about Flavour *except* via the change in Colour belief. Thus, $P_{new}(Flavour|Colour) = P(Flavour|Colour)$ is plausible.
  2.  **No Hard Proposition:** You must explicitly block the move to condition on "It looks red." Tell the students: "The experience is not the proposition *'It looks red'*. The experience is the *shift* in colour probabilities itself." If they condition on "Looks Red," they recover the reflex you are trying to break.
  3.  **Iteration (The Tricky Part):** You requested a case where applying the same soft input twice is not the same as applying it once.
      *   *Warning:* If you define the input as a **Target Marginal** (e.g., "Set $P(Red)=0.6$"), applying it twice *is* the same as applying it once.
      *   *Solution:* To satisfy your iteration constraint, you must characterize the input as a **Bayes Factor** (a shift ratio, e.g., "The experience makes Red twice as likely relative to Green as it was before"). If you apply a factor of 2 twice, the odds multiply by 4.
      *   *Pedagogical Advice:* For a 90-minute session, defining input as Target Marginals is standard and clearer. Defining it as Bayes Factors adds significant cognitive load. **I recommend you relax the iteration constraint** for this specific session, or handle it as a "Advanced Note" at the end. If you must keep it, introduce the Bayes Factor formulation only in the last 15 minutes to show that *how we characterize the input* matters.

  **What the case must not contain:**
  *   Do not allow a proposition like "The light is working normally" to become certain.
  *   Do not allow the experience to directly suggest the Flavour (e.g., "It smells like cherry"). That violates Rigidity.

  ### 3. Misconception Map

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Find the $E$ such that $P_{new}(E)=1$."** | Min 0–15 (The Reflex) | Explicitly demonstrate a case where no such $E$ exists. Force them to admit $P_{new}(Colour_i) < 1$ for all $i$. |
  | **"Rigidity is automatic."** | Min 30–40 (Justification) | Contrast with a case where the experience *does* affect $H$ directly (e.g., a psychic vision of the flavour). Rigidity is a substantive assumption about the causal channel. |
  | **"Condition on 'It looks Red'."** | Min 40–55 (Derivation) | Remind them that "Looks Red" is not in the partition. The partition is the *worldly* colours, not the *phenomenal* appearances. |
  | **"The formula is just weighted averaging."** | Min 55–75 (Calculation) | Show that the weights ($P_{new}(E_i)$) sum to 1, but the terms ($P(H|E_i)$) are the *old* conditionals. Emphasize the *mixing* of old conditional and new marginal. |
  | **"Doing it twice is the same as once."** | Min 75+ (Iteration) | If using Bayes Factors, show the math. If using Target Marginals, admit idempotence and note that this characterizes the *input* as a state, not a force. |

  ### 4. The Wrinkle: Foreseen Updates and Value of Information

  **Recommendation: Drop it.**

  **Reasoning:**
  This problem (often associated with Diaconis, Zabell, or Christensen) arises when the agent knows the update will occur and realizes that the update itself provides evidence *against* the rigidity of the partition (e.g., "If I am about to become 60% confident it is Red, that suggests the lighting is biased, which means I shouldn't hold the Colour-Flavour link fixed").

  1.  **Cognitive Load:** This requires students to understand second-order evidence and decision-theoretic value of information. In 90 minutes, this will swamp the primary goal: learning to compute and justify the update rule.
  2.  **Undermining the Lesson:** You are spending the first hour justifying Rigidity. Introducing a case where Rigidity self-destructs in the final 15 minutes will leave them thinking the rule is broken, rather than mastering its standard application.
  3.  **Placement:** If you must include it, it belongs in a seminar on the *limits of Bayesianism*, not an introduction to *kinematics*. It relies on distinguishing the *update rule* from the *account of evidence*, a distinction too subtle for a first pass.

  **Verdict:** Do not teach it. It is a pathology of the *application*, not the *arithmetic*. Secure the arithmetic first.

  ### 5. Scope and Assessment

  **What to Refuse to Explain:**
  *   **Measure Theoretic Foundations:** Keep it finite.
  *   **The History:** Don't discuss Jeffrey vs. Field vs. Christensen debates.
  *   **Decision Theory:** Do not explain *why* they should update (Dutch Books etc.), only *how*.
  *   **The "Given":** Do not enter the Sellarsian debate on whether the experience is propositional. Stipulate that the input is the probability shift.

  **The Mastery Task (Final 15 Minutes):**
  Do not ask them to merely calculate. Ask them to **Diagnose and Update**.

  **Task:**
  > "An agent draws a card from a deck. She is unsure if it is Red or Black ($E_1, E_2$). She is also unsure if it is a Face card or Number card ($H$). She glances at the card under dim light. Her confidence that it is Red shifts from 0.5 to 0.7.
  >
  > 1.  Write down the formula for her new confidence that it is a Face card.
  > 2.  State the condition required to use this formula.
  > 3.  Describe a specific change to the scenario that would **violate** this condition, making the formula inappropriate."

  **Why this works:**
  *   Part 1 checks computation ($P_{new}(H) = P(H|Red)P_{new}(Red) + P(H|Black)P_{new}(Black)$).
  *   Part 2 checks justification (Rigidity/Invariance of conditionals).
  *   Part 3 checks understanding of the *limits* (e.g., "If the dim light also made Face cards harder to distinguish, affecting $P(H|E)$ directly").

  This confirms they haven't just memorized the summation, but understand the causal/normative constraints that license it.
