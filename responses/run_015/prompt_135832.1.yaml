answer: |-
  15%

  **Decomposition (Credence that each necessary condition holds):**

  1.  **Temporal Property:** 40% — Physics and metaphysics largely treat time as a coordinate rather than a quality that attenuates value.
  2.  **Personal Identity:** 30% — Reductionist views (psychological continuity) dominate over "further fact" views of the self.
  3.  **Spatial Leak:** 25% — No robust ethical principle successfully distinguishes temporal distance from spatial distance without ad hoc stipulation.
  4.  **Normative Agency:** 20% — Neutralist theories of rationality outweigh perspectival theories that privilege the "now."

  **Combination:** The overall 15% reflects the conjunctive probability of these four independent hurdles all being cleared; if any single condition fails, the trustee's argument collapses.

  **Fragility:**
  The **Personal Identity** question would move the number furthest. If you could convince the reader that personal identity is a "Further Fact" (a deep, irreducible truth about the self persisting through time) rather than mere psychological continuity, the trustee's special concern for her own future becomes metaphysically grounded rather than discriminatory. The thought experiment to strike this joint is Parfit's "My Division": if a person splits into two successors, and identity does not hold, why should the original care more about either successor than a stranger? If the trustee can answer this by asserting a unique persisting self, her case for time preference gains a foothold; if she cannot, she is merely discriminating against a future stranger who happens to share her memories.

  **Social Discount Rate:**
  The case for a positive pure term in a social discount rate is **weaker** than the trustee's case. The trustee's argument relies on the metaphysical privilege of the individual agent's "present" perspective and their specific persistence over time. A government, however, does not possess a singular psychological continuity or a privileged "now"; it acts as a fiduciary for all citizens across all generations equally. Therefore, the ethical objection to discriminating against future citizens is strictly stronger than the prudential objection to discriminating against one's own future self, making a positive pure time preference ethically indefensible in public policy even if it were permissible for an individual.
