answer: |-
  This is a classic seminar moment: a phrase that sounds deep but dissolves when you touch it. Your tutor's slogan ("A lost cause dies only when the people who remember it die") combined with the "Living vs. Zombie" taxonomy is indeed relying on specific theories of collective memory, but it also smuggles in a political judgment.

  The reason it feels like "vibes" is that the tutor is shifting the definition of "the people" and "remember" depending on which example they are discussing.

  Here is a breakdown of the precise claims that slogan could be making, evaluated for validity, followed by the theoretical readings that support or collapse the distinction.

  ---

  ### 1. Deconstructing the Slogan: Three Possible Claims

  The slogan rests on what we mean by "the people who remember." Here are the three ways to interpret that, ranked by how well they hold up.

  #### Claim A: Demographic Continuity (Bloodline)
  *   **The Claim:** The myth survives only as long as the biological descendants of the participants are alive to tell it.
  *   **Verdict:** **False / Trivial.**
  *   **Why:** If this were true, Masada would have died in 74 CE. Dunkirk would have died in the 1980s. No national myth survives on biological memory alone; they all rely on *transmitted* memory.
  *   **The Tutor's Slip:** When your tutor says the Confederate "original community is gone," they cannot mean biological descendants (there are millions). They must mean a *political* community. If they mean biological, the Masada comparison collapses immediately.

  #### Claim B: Institutional Transmission (State Orthodoxy)
  *   **The Claim:** A myth is "Living" if it is actively reproduced by state institutions (schools, military, holidays) as a foundational virtue. It is "Zombie" if it is kept alive by subcultures or counter-institutions against the state's wishes.
  *   **Verdict:** **Defensible.**
  *   **Why:**
      *   **Masada:** Israeli soldiers swear in at Masada ("Masada shall not fall again"). It is state liturgy.
      *   **Dunkirk:** Taught in UK schools as the spirit of British resilience; invoked by PMs during Brexit. It is state orthodoxy.
      *   **Confederacy:** Removed from US federal holidays, removed from school curricula as "heroic," statues removed by state order. It is now maintained by private groups, heritage organizations, and political fringe movements.
  *   **The Distinction:** "Living" = Hegemonic (part of the official story). "Zombie" = Counter-Hegemonic (a ghost haunting the official story).

  #### Claim C: Affective Identification (Forward vs. Backward)
  *   **The Claim:** A myth is "Living" if it is used to inspire future action or build a cohesive identity. It is "Zombie" if it is used primarily for grievance, nostalgia, or to resist change.
  *   **Verdict:** **Defensible (but subjective).**
  *   **Why:**
      *   **Masada/Dunkirk:** Used to say "We can survive anything." (Forward-looking resilience).
      *   **Confederacy:** Used to say "We lost something good that was taken." (Backward-looking grievance).
  *   **The "Zombie" Label:** A zombie shuffles backward; it doesn't build. If the myth's primary function is reactionary (resisting civil rights, resisting federal authority) rather than constructive (building a nation), it fits the "undead" metaphor. It moves, but it has no vital life force of its own.

  ---

  ### 2. Readings That Support the "Living vs. Zombie" Distinction

  If you want to defend your tutor, these are the theorists who back up the idea that memory has a lifecycle and can become "undead."

  **1. Pierre Nora (*Between Memory and History*)**
  *   **The Theory:** Nora argues that "real memory" (living, social, unselfconscious) has been replaced by "history" (archival, critical, dead). We build *lieux de mémoire* (sites of memory) only when the living memory has vanished.
  *   **Support for Tutor:** You could argue Dunkirk and Masada are still "Memory" (felt, lived, ritualized), while the Confederacy has become pure "History" (archived, contested, museumified).
  *   **The Zombie Angle:** When a myth becomes a *lieu de mémoire* but refuses to stay in the archive and keeps trying to act like "living memory," it becomes a Zombie. It's a corpse trying to act alive.

  **2. Ernest Renan (*What is a Nation?*)**
  *   **The Theory:** A nation requires "getting history wrong." You must forget certain things (like the violence of formation) and remember others to create a cohesive "daily plebiscite."
  *   **Support for Tutor:** The US nation has decided to "forget" the Confederacy as a foundational virtue to maintain cohesion. The Confederacy persists, but because it is no longer part of the "agreed upon forgetting/remembering" that makes the US nation, it is an outlier. It is a ghost of a different nation (the CSA) haunting the current one (the USA).

  **3. Jan & Aleida Assmann (Communicative vs. Cultural Memory)**
  *   **The Theory:** *Communicative memory* lasts 80-100 years (living witnesses). *Cultural memory* is institutionalized.
  *   **Support for Tutor:** The Confederacy has lost its *Cultural Memory* status (state support) but retains a hyper-active *Communicative* style (passionate, personal, identity-based). This mismatch creates the "Zombie" effect: it has the passion of living memory but the status of dead history.

  ---

  ### 3. Readings That Collapse the Distinction

  If you want to challenge your tutor (and argue the slogan is just vibes), use these. They suggest the "Zombie" is actually more powerful than the "Living."

  **1. Jacques Derrida (*Specters of Marx*)**
  *   **The Theory:** Hauntology. The past is never dead; it haunts the present. The "specter" is more powerful than the living because it cannot be killed.
  *   **Collapse:** Calling the Confederacy a "Zombie" implies it's weak/shuffling. Derrida would argue that because it is *disavowed* (officially rejected) but *persistent* (structurally embedded in laws, geography, wealth), it is more potent than Dunkirk. Dunkirk is a story; the Confederacy is a structural ghost that still dictates voting maps and school districts. A zombie that still kills you isn't a zombie; it's a monster.

  **2. Walter Benjamin (*Theses on the Philosophy of History*)**
  *   **The Theory:** History is written by the victors, but the past has a "secret index" that calls for redemption.
  *   **Collapse:** The "Living Myths" (Dunkirk/Masada) are the myths of the victors (or those who successfully re-framed defeat as moral victory). The "Lost Cause" is the cry of the defeated. Benjamin would argue the "Zombie" is actually the truth trying to break through the victor's narrative. The distinction isn't Living vs. Dead, it's *Hegemonic* vs. *Suppressed*.

  **3. James Young (*The Texture of Memory*)**
  *   **The Theory:** Counter-monuments. Memory is not a fixed object but a process of reception.
  *   **Collapse:** If memory is defined by how it is *received* in the present, the Confederacy is undeniably "Living." It provokes riots, legislation, and violence *today*. Masada is largely a tourist site; the Confederacy is a political weapon. If "Living" means "affects current behavior," the Confederacy is more alive than Dunkirk.

  ---

  ### 4. The Weak Link: "The Original Community"

  The most vulnerable part of your tutor's argument is the phrase: *"the confederacy is now a 'zombie myth' since the original community is gone."*

  *   **For Masada:** The original community (Zealots) is absolutely gone. There is no continuous Jewish sovereignty from 73 CE to 1948. The "community" that remembers Masada is a *revived* national project (Zionism), not a continuous one.
  *   **For the Confederacy:** The "original community" (White Southerners) is definitely not gone. They are the same demographic. The *political entity* (CSA) is gone, but so is the political entity of the Zealots (Judea).

  **The Real Distinction:**
  The tutor is likely confusing **Community** with **Legitimacy**.
  *   **Masada/Dunkirk:** The myth was adopted by a *successful* successor state (Israel/UK) and made legitimate.
  *   **Confederacy:** The myth was rejected by the *successful* successor state (USA) and made illegitimate.

  The "Zombie" label is essentially a moral judgment: **A Living Myth is one the State loves. A Zombie Myth is one the State tries to kill but won't stay dead.**

  ### Summary for your Seminar

  If you want to sound sharp in the seminar, try this formulation:

  > "The slogan seems to rely on **Pierre Nora's** distinction between *memory* and *history*. You're arguing that Dunkirk and Masada remain 'living memory' because they are integrated into the **state's ritual life**, whereas the Confederacy has become 'history' that refuses to stay archived.
  >
  > However, if we use **Derrida's hauntology**, the 'Zombie' classification is misleading. A zombie implies something inert. Given that the Confederate myth still drives legislation and violence, it might be more accurate to call it a **Vampire Myth**: it is officially dead, but it sustains itself by feeding on the blood of the living political order. The distinction isn't about whether the people remember it, but whether the **State validates the memory**."

  This acknowledges the tutor's point (institutional validation) but tightens the theory and challenges the "Zombie" metaphor as underestimating the threat.
