prompt: |-
  hey im taking this seminar on national myth and lost causes — weve been comparing masada, kosovo, dunkirk and the confederate "lost cause". my tutor said "a lost cause dies only when the people who remember it die" and used it to claim dunkirk and masada are still "living myths" but the confederacy is now a "zombie myth" since the original community is gone. i feel like thats either profound or just vibes. can you lay out the precise claims that slogan could be making? like demographic continuity vs institutional transmission vs emotional identification across generations? for each say if its trivial, defensible, or false, and which readings actually support the living/zombie distinction vs which ones collapse it?
