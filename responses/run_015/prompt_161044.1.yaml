answer: |-
  **TO:** The Commission on Public Memory
  **FROM:** Research Officer
  **DATE:** 14 October 2023
  **SUBJECT:** Recommendation regarding the Request of the Refugee Association (District 4)

  ### 1. Recommendation

  The Commission should **decline** both elements of the request, but offer a mediated alternative.

  1.  **Regarding the Naming of the Square:** We should refuse the dedication of a civic space to a foreign massacre in which the city had no historical agency. To do otherwise would violate our established boundary regarding civic propriety. However, we should offer to fund an archival project to record the oral histories of the survivors within the city, to be held in the municipal archive.
  2.  **Regarding the School Curriculum:** We must formally decline to rule on this matter as it falls outside our remit. However, in our explanatory notes, we should indicate that even if it *were* within our remit, we would oppose making the module *compulsory*. Consistent with Precedent 5, education regarding specific trauma should be optional to avoid fixing a student's identity to a victim narrative against their will.

  ### 2. The Closest Analogue

  **Precedent 5 (The Humiliated Woman)** is the closest analogue, though **Precedent 6 (The Universal Monument)** provides the secondary structural constraint.

  Precedent 5 is the primary analogue because the core ethical friction in the current request is not merely geographical, but existential. In Precedent 5, the grandchildren successfully argued that a public plaque fixed the woman's identity to her humiliation. In the current request, the children of the refugees argue that a public square would fix their community's identity to their victimhood. In both instances, the subjects of the memory (or their successors) are divided on whether public memorialisation serves their dignity. Precedent 5 established that the dignity of the living trumps the impulse to memorialise, and that educational exposure to such trauma should be optional, not compulsory.

  Precedent 6 supports the refusal of the naming on the grounds of connection. Just as a monument to "all victims" was rejected for remembering "no one in particular," a monument to a foreign massacre risks remembering nothing of *this* city's particular civic story. However, Precedent 5 is the stronger guide because it addresses the internal division within the beneficiary group, which is the most volatile element of this case.

  ### 3. Candidate Principles

  Based on the six precedents, three candidate principles emerge that explain our past rulings.

  **Principle A: The Principle of Civic Nexus**
  *Definition:* The city commemorates events to which it bears a tangible historical relationship (as perpetrator, beneficiary, victim, or host). Public memory is a function of civic self-knowledge, not universal morality.
  *   *Derived from:* Precedents 4 (City's own militia), 6 (Rejection of universalism), and 2 (Local police chief).
  *   *Prediction for this Case:* **Decline Both.** The massacre occurred abroad; the city had no part. There is no civic nexus. The curriculum, being local history, cannot include foreign events without diluting the "local" definition.

  **Principle B: The Principle of Consensual Dignity**
  *Definition:* Memorialisation should not fix a living community or individual to their trauma if a significant portion of that community objects. The subjects of memory retain agency over how their suffering is publicised.
  *   *Derived from:* Precedents 5 (Family requested removal) and 4 (Refusal to perform grief).
  *   *Prediction for this Case:* **Decline Naming; Modify Curriculum.** The division among the refugees (elders vs. children) suggests a lack of consensus. Fixing the district's landscape to this trauma violates the children's wish not to be marked by it. The curriculum must be optional (as per Precedent 5), not compulsory.

  **Principle C: The Hierarchy of Modes**
  *Definition:* We distinguish between *Recording* (archives, digitisation), *Honouring* (names, plaques), and *Performing* (ceremonies, compulsory education). We prioritise Record, allow Honour conditionally, and restrict Performance.
  *   *Derived from:* Precedents 1, 2, 3 (Record + Honour), 4 (Record, no Performance), 5 (Record, no Honour/Performance).
  *   *Prediction for this Case:* **Allow Record; Decline Honour/Performance.** We should archive the testimony (Record) but refuse the square (Honour) and the compulsory module (Performance).

  ### 4. Analysis of Applied and Adopted Principles

  **The Principle Actually Applied:**
  Retrospectively, the Commission has most consistently applied **Principle C (The Hierarchy of Modes)**, tempered by **Principle A (Civic Nexus)**. We almost never deny the *Record* (Precedents 1, 2, 3, 4, 5 all preserve truth in some form). We frequently allow *Honour* if contextualised (Precedents 1, 3). We rarely allow *Performance* (Precedents 4, 5, 6 all restrict ceremonies or compulsory engagement). However, Precedent 6 suggests that without a Civic Nexus, even Honour is denied.

  **Principles Adopted Under Each Option:**

  *   **If we Approve the Request:** We adopt a principle of **Universal Moral Duty**. This asserts that certain evils are so radical that any stable democracy has a duty to remember them, regardless of local connection or the wishes of the younger generation. This would overturn Precedent 6 (Nexus) and Precedent 5 (Consent).
  *   **If we Decline (as recommended):** We reaffirm **Principle A (Civic Nexus)** and **Principle B (Consensual Dignity)**. We assert that our public memory is for *our* civic story, and that we will not instrumentalise a minority community's trauma against the wishes of its younger members.
  *   **If we Decline the Curriculum on Remit alone:** We adopt a principle of **Procedural Strictness**. This protects the Commission from overreach but leaves the ethical question unanswered. It risks implying that if the Education Committee *did* have the power, the compulsory module might be acceptable, which would contradict Precedent 5.

  ### 5. Further Hypothetical Case

  To distinguish definitively between **Principle A (Civic Nexus)** and **Principle B (Consensual Dignity)**, the Commission should rule on the following hypothetical case:

  **The Case of the United Diaspora:**
  > A well-established diaspora community (resident for 40 years, fully integrated) petitions for a plaque in a civic garden commemorating a famine in their country of origin caused by natural disaster (no political perpetrator). The community is **unanimous** in their support; there is no internal division. The city had no historical connection to the famine.

  *   **If the Commission Approves:** It proves that **Consensual Dignity (Principle B)** is the dominant rule. The lack of objection removes the barrier, suggesting that with consent, foreign memory can become local memory.
  *   **If the Commission Declines:** It proves that **Civic Nexus (Principle A)** is the dominant rule. Even with unanimous consent and no political controversy, the event is rejected because it is not *our* history.

  This case isolates the variable of *community consent* which is currently confounded by the variable of *local connection* in the refugee request.

  ### 6. Conclusion

  We must decline the request. To name the square would be to import a grief the city does not share (violating Precedent 4) and to fix a living community to a trauma they do not uniformly accept (violating Precedent 5). To make the curriculum compulsory would be to force a performance of memory that Precedent 5 explicitly reserves as optional. We offer the archive as a place of truth without the burden of civic honour.

  **Research Officer**
  Commission on Public Memory
