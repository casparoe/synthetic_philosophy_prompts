answer: |-
  Here is an assessment of your three concepts, followed by the speech.

  ### Assessment of Your Concepts

  1.  **The Second Draw:** **Keep it.** It is honest. Ignoring the attrition makes the assembly look naive; acknowledging it makes you look rigorous. It validates the members who stayed (life was hard, but you stuck with it) without claiming you are a perfect demographic sample anymore.
  2.  **The Polished Mirror:** **Keep it.** This solves your "ordinary vs. expert" paradox perfectly. It acknowledges growth without claiming professional status. It tells the councillors: "We see the city differently now, not because we are better, but because we looked closer."
  3.  **The Handover Test:** **Keep it, but refine the edge.** This is the riskiest moment. If you say "knowledge that leaves with you isn't valuable," it insults the retiring councillor. If you say "knowledge that leaves with you is a risk to the city," it validates the term limit *and* honors him (because he presumably documented his work). The speech below frames it as **institutional resilience** rather than personal capability.

  ***

  ### The Speech (Approx. 5 Minutes)

  **[Stand up. Put the report on the table. Look at your fellow members first, then the councillors.]**

  Fourteen months ago, a letter arrived. It wasn't an invitation. It was a notification. Thirty-three of us were pulled from the electoral roll. No applications, no campaigns. Just a letter asking if we could spare the time to look at housing and transport.

  Thirty-three started. Twenty-four are sitting here today.

  I need to be honest about that gap. Nine people dropped out. Life happened. Jobs changed, health failed, care responsibilities shifted. There is a tendency to call the people left in the room "the ones who stepped up." We didn't step up. We were drawn. And then, a second, quieter draw happened. The ones who could afford the time, or who didn't have young children, or who were already retired, are the ones who finished the job. We are not a perfect mirror of the city anymore. We are the city, after a year of meetings.

  And that year changes you.

  There is a temptation to say, "We are just ordinary residents." But that isn't true. You cannot spend a year reading budget lines, cross-examining planners, and arguing over zoning maps without changing. The mirror gets polished. We see the mechanics of the city now. We aren't experts in the way a career politician is an expert. We are experts in what it feels like to be a citizen asked to do the work of governance.

  That distinction matters for this report.

  We are handing over a plan. It contains recommendations that some of you in the council chamber will like, and some you will not. One recommendation, specifically, suggests a cap on how long a councillor can serve.

  I know the tension in that. Tonight, you are also honoring Councillor [Name], who is retiring after twenty-eight years. He was straight with us. He answered the hard questions. He deserves that honor.

  But there is a test we used when writing that recommendation. We called it the "handover test."

  If the knowledge needed to run this city lives in a person's head, it leaves the building when they leave. If it lives in the institution—in the records, the processes, the written memory—it stays.

  A system that relies on twenty-eight years of one person's memory is fragile. A system that works because the rules are clear and the knowledge is shared is resilient. Councillor [Name], the best tribute to your service is a city that doesn't *need* twenty-eight years of experience to function. The recommendation on term limits isn't about stopping good people. It's about making sure the institution is stronger than any single member of it.

  We know what happens next. We know reports like this can sit on a shelf. We know the political calculus is different for you than it was for us. We weren't asked to win an election. We were asked to solve a problem.

  If this report is shelved, the year wasn't wasted. The value wasn't just in the paper. It was in the proof that twenty-four neighbors could learn the job, argue the details, and agree on a path forward without a whip or a party line. We built the civic muscle. That stays with us, even if the recommendations don't all make it into law.

  Some have asked if we should stay together as a permanent body. I don't think so. We were a task force, not a new chamber. The point of a citizen assembly is to return to the city, not to become the city.

  So, here is the work. It is imperfect, because we are imperfect. It is informed, because we did the reading. And it is yours now.

  Thank you.

  ***

  ### Delivery Notes

  *   **The "Second Draw" (Paragraph 3):** Deliver this matter-of-factly. Don't apologize for the attrition, just state it. It grounds you in reality.
  *   **The "Polished Mirror" (Paragraph 5):** Slow down here. This is your claim to authority. You aren't claiming to be politicians; you're claiming to be *informed*.
  *   **The "Handover Test" (Paragraph 9 & 10):** Look at the retiring councillor when you say "He deserves that honor." Look at the hostile councillors when you talk about "fragile" systems. This separates the person from the structure.
  *   **The "Shelving" (Paragraph 12):** Don't sound bitter. Sound resolved. This is for your fellow members. They need to hear that their time had intrinsic value regardless of the council's vote.
  *   **The "Permanent Body" (Paragraph 14):** Be firm. This shuts down the idea without shaming the members who want it.
  *   **Ending:** "And it is yours now." Put your hand on the report. Step back. Let the silence sit for two seconds before sitting down.
