answer: |-
  You are not being irrational. Your manager is pulling a fast one, though he may be doing it unconsciously. His argument relies on a mix of bad epistemology (how we know things), bad ethics (how we treat people), and a logical circularity regarding the project scope.

  Here is the straight read on where his argument breaks.

  ### 1. The Epistemic Error (Can he know?)
  **Confidence: High**

  Your manager claims there is a "fact of the matter" about what you would have done. Philosophically, this is a debate about counterfactuals (statements about what *would* have happened if things were different). Some philosophers argue there is a truth to this; others argue it's meaningless until the choice is made.

  But in the context of management and human psychology? **He cannot know this.**

  People are not deterministic machines. You might have said no. You might have said yes because you needed the visibility, or because you wanted to prove you could handle the hours, or because you'd arranged different childcare. By deciding *for* you, he turned a probability (his guess) into a certainty (your exclusion).

  He is treating his *prediction* as *knowledge*. That is a category error. He doesn't know what you would have done; he knows what he *prefers* you would have done.

  ### 2. The Ethical Error (Does it matter if he's right?)
  **Confidence: Very High**

  Let's grant his premise: Suppose he is a psychic, and he knows 100% you would have said no. Does that excuse him? **No.**

  This is classic **paternalism**. His argument is: "The outcome (you not doing the project) is the same as your free choice, so no harm done."

  This is false. In professional ethics (and most moral frameworks), **agency matters independently of outcome.**
  *   **Being asked** is an affirmation of your status as an autonomous agent.
  *   **Being passed over** is a demotion of that status.

  When he denies you the offer, he denies you the opportunity to *exercise* judgment. He is treating you like a resource to be managed, not a professional to be consulted. Even if the outcome is identical, the *process* strips you of dignity and professional voice. You lost the chance to say "Yes, despite the hours," which is a valuable signal to send to leadership.

  So, to answer your specific question: The mistake is **primarily about whether knowing it excuses what he did.** Even if he knew, he wasn't entitled to make the choice for you. But since he *doesn't* know, the excuse collapses entirely.

  ### 3. The Wrinkle (The Causal Loop)
  **Confidence: High**

  This is the strongest point in your favor and the weakest point in his logic.

  He says you wouldn't have wanted *this* version of the project (brutal hours, specific colleagues). But you pointed out that the project was scoped that way *after* you were removed, and the colleagues were picked *because* you weren't there.

  This is a **self-fulfilling prophecy**.
  1.  He assumes you won't want the brutal version.
  2.  He removes you.
  3.  Because you are removed, he scopes it as brutal (perhaps because the other colleagues work differently, or because he assumes he needs more manpower/hours without you).
  4.  He points to the brutal scope as proof you wouldn't have wanted it.

  He created the conditions that validate his exclusion. That is logically circular. You cannot use the features of a reality you engineered to justify why you engineered it that way.

  ### 4. Is your framing confused?
  **Confidence: Very High**

  Your framing is not confused. It is precise. You have correctly identified that the core tension is between **prediction** and **agency**.

  Many people in your position would just feel "hurt" or "angry." You have isolated the philosophical mechanism of the slight: *He is claiming a counterfactual preference overrides my actual autonomy.* That is a sophisticated read of the situation. Do not let him gaslight you into thinking you're splitting hairs. This is the hair that matters.

  ### 5. Where I'm going past settled ground
  I am speaking with high confidence on the management and ethical logic because these are standard principles of professional autonomy. However, on the deep metaphysical question of whether there *is* a true fact about what you "would have done" (counterfactual definiteness), philosophy is not settled. Determinists might say he's right that the fact exists; libertarians about free will might say the fact doesn't exist until you choose.

  **But this doesn't matter for your situation.** Even if the "fact" exists in the universe, your manager does not have access to it. He is acting on *his belief* about that fact. And in a professional hierarchy, acting on a belief about a subordinate's choices without consultation is a failure of management, regardless of the metaphysics.

  ### Summary
  *   **Is he wrong?** Yes.
  *   **Why?**
      1.  He claims knowledge he cannot have (Epistemic arrogance).
      2.  He assumes outcome matters more than agency (Ethical failure).
      3.  He scoped the project to fit his decision, then used the scope to justify the decision (Logical circularity).
  *   **What should you do?** You likely cannot win this by arguing philosophy. He will dig in on "I was trying to save you time."
      *   **The Pivot:** Move the conversation from *this project* to *future process*.
      *   **Script:** "I appreciate you trying to protect my time. But in the future, I need to be the one to decide what I can take on. Even if the answer is no, I need the chance to weigh the trade-offs myself. Please offer me the work and let me decline."

  You aren't irrational. You were treated like a child, and you're correctly identifying that the logic used to justify it is flawed.
