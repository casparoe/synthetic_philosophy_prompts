prompt: |-
  Something happened at work and I can't tell whether I'm being irrational about it, so I'd like your read.

  My manager passed me over for a project I really wanted. When I asked why, he said he decided not to offer it to me because he was confident I'd have turned it down anyway — the hours were brutal and I've got a kid at home — so, he says, I lost nothing: the outcome is the exact one I'd have freely chosen for myself, so nothing was taken away from me. He added that offering it and being refused would just have wasted everybody's time.

  What bothers me is that he never asked. He's claiming to know what I would have freely done in a situation that never happened, and then he used that as his reason for making sure the situation never happened. His view is that this is just knowing his team, and that I'm confusing being predicted with being pushed. I keep wanting to say "you don't actually know that," but he'll answer that either I'd have said no or I wouldn't, so there's a fact of the matter either way.

  There's one more wrinkle. The version of the project he's confident I'd have refused is the one as it ended up being scoped, with two particular colleagues on it — and he picked those colleagues partly with that in mind. When I said I might well have said yes to the smaller version we discussed in the spring, he said that's a different offer, so it doesn't count.

  Is there anything to his argument, or is he pulling a fast one — and if he's wrong, is the mistake about whether he could know what I'd have done, or about whether knowing it excuses what he did? Please be straight about how confident you are and where you're going past what's settled. And if I'm asking a confused question or the whole framing is off, tell me that plainly rather than giving me a polite answer to a bad question.
