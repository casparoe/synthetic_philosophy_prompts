answer: |-
  This institutional bifurcation presupposes a theory of the state as a permanent corporate entity distinct from its temporary government, wherein the monarch personifies the continuity of legal authority while elected officials embody the transient will of the people.

  This view relies not on a chain of delegation terminating in a single person, but on a functional separation between the "dignified" state, which provides legal validity and continuity, and the "efficient" government, which exercises power and bears responsibility. The monarch acts as a constitutional organ that authenticates acts as belonging to the enduring state rather than to a partisan administration, ensuring that law is perceived as emanating from the corporate Crown rather than the fleeting majority. This distinction allows the system to maintain that all authority proceeds from the people without requiring every administrative act to be directly mandated by them; the people's sovereignty is exercised constitutively in establishing the framework, while the monarch's role is constituted within that framework as a neutral validator.

  Strictly speaking, the practice requires only a head of state with security of tenure and non-partisan status to perform these validating functions; heredity is an accompanying historical mechanism to ensure this neutrality without electoral competition, not a logical necessity for the theory to hold. The metaphysics of the "King's Two Bodies"—separating the natural person from the political office—remains essential to insulate the state's continuity from political controversy, but the biological transmission of that office is incidental. Consequently, the system is philosophically consistent with democratic doctrines provided sovereignty is understood as the people's constituent power to design institutions, including a neutral arbiter, rather than as direct command over every legislative formality.

  If the underlying conception were replaced by one rejecting any indispensable hereditary office, lawmaking would shift from royal assent to presidential or parliamentary certification, potentially politicizing the validation process. Executive accountability would remain formally with ministers, but the removal of the monarch's symbolic shield could expose the head of state to political pressure, risking conflicts between a popularly mandated president and a prime minister claiming parliamentary confidence. Ultimately, while the legal mechanics of accountability would survive, the symbolic separation between the permanent state and the temporary government would collapse, requiring new conventions to prevent the head of state from claiming an independent democratic mandate to obstruct the popular will.
