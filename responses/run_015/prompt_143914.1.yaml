      *   (2) *Religious vs. Secular Capital:* Religious = High Bonding, Low Bridging. Secular Welfare = High Bridging (implied).
      *   (3) *Source of Secular Trust:* Universalist institutions + *ethnic homogeneity*. Skepticism about diversity replicating this trust.
      *   (4) *Political Stance:* Support open borders (cosmopolitan) *despite* (3). Worry that institutions might fail in heterogeneous contexts.
      *   (5) *Religious Mechanism:* "Moral credentialing" (confession/forgiveness) destabilizes impartial norms. (Psychological/Sociological claim).

  3.  **Analyze the Tensions (Pairwise):**

      *   **Tension A: (3) vs. (4) [The Policy vs. Prediction Conflict]**
          *   *Conflict:* (3) says trust relies on homogeneity. (4) says support open borders (which increases heterogeneity). If (3) is true, (4) leads to institutional failure.
          *   *Severity:* High. This is a direct practical contradiction. Supporting a policy you believe undermines the necessary conditions for society's function is unstable.
          *   *Resolution:* Either trust institutions more than homogeneity (revise 3) or accept a trade-off (revise 4 to be more gradualist/restrictionist).
          *   *Cheapest Fix:* Nuance (3). Homogeneity might be a *historical* precondition, not a *maintenance* requirement. Institutions can adapt.

      *   **Tension B: (1) vs. (5) [The Definition vs. Mechanism Conflict]**
          *   *Conflict:* (1) defines morality as impartial cooperation. (5) claims religious practice destabilizes *impartial norms*.
          *   *Circularity Check:* The user asks if (5) is circular because it assumes (1). Yes, somewhat. If "morality" = "impartial norms," then obviously anything undermining impartial norms is "immoral." But (5) makes an empirical claim about *psychological mechanism* (licensing effect).
          *   *Severity:* Medium. It's more of a definitional stacking than a practical contradiction. It risks begging the question against religious morality.
          *   *Resolution:* Acknowledge (1) is a normative choice, (5) is an empirical hypothesis. Don't let (1) dictate the truth of (5).
          *   *Cheapest Fix:* Decouple them. Admit (5) is contested empirical ground, not a logical consequence of (1).

      *   **Tension C: (2) vs. (3) [The Capital vs. Source Conflict]**
          *   *Conflict:* (2) says secular states have higher bridging capital. (3) says this is due to homogeneity, not secularism/institutions alone.
          *   *Severity:* Low/Medium. They actually complement each other well. (2) describes the *what*, (3) describes the *why*. The tension is only if (2) implies secularism *causes* bridging capital inherently, which (3) corrects.
          *   *Resolution:* Clarify that secularism correlates with bridging capital *conditional* on homogeneity.
          *   *Cheapest Fix:* Clarify causality in (2).

      *   **Tension D: (1) vs. (3) [The Universalist Definition vs. Particularist Reality]**
          *   *Conflict:* (1) values impartial cooperation. (3) admits the best example of this (Scandinavia) relies on *partial* traits (ethnic homogeneity).
          *   *Severity:* Medium. It suggests the "impartial" society is built on "partial" foundations.
          *   *Resolution:* Distinguish between *foundations* and *operating principles*.
          *   *Cheapest Fix:* Refine (3) to say homogeneity was the *launchpad*, not the *engine*.

  4.  **Evaluate the "Single Change" for Maximum Cleanup:**
      *   If I change (1) (Definition of Morality): Doesn't solve the policy worry in (4).
      *   If I change (4) (Open Borders): Solves the practical risk, but violates cosmopolitan values.
      *   If I change (3) (Homogeneity Necessity): This is the linchpin. If homogeneity is *not* strictly necessary for high-trust institutions to function in diverse settings, then (4) is safe, (2) remains true (institutions matter more), and the tension with (1) dissolves (impartial institutions can work impartially).
      *   *Decision:* Revising (3) is the highest leverage. It moves from "Homogeneity is required" to "Homogeneity was a historical catalyst, but strong institutions can sustain trust across diversity." This aligns with the Copenhagen observation (institutions work) without requiring the user to abandon open borders.

