answer: |-
  You are not confusing yourself; you are correctly identifying that this slogan is a "rhetorical shrug" that collapses several distinct philosophical claims into one soundbite. In memory studies and political philosophy, this is a classic move: it uses a trivial truth to block a substantive moral argument.

  Your hunch about **documentary vs. commemorative memory** is spot on. This is a recognized distinction in the field (most notably in the work of Aleida Assmann and Pierre Nora). *Documentary memory* refers to archives, records, and facts (the past as it happened). *Commemorative memory* refers to the active, ritualized engagement with the past that shapes collective identity (the past as we live it). The slogan conflates the two to make the rename seem futile.

  Here is the disambiguation of the specific theses hiding inside "You can't erase history by tearing down a sign," evaluated by truth value and rhetorical function.

  ### 1. The Ontological Truism
  *   **The Claim:** Physical removal of a marker does not alter past events. Alistair Venn funded the clinic regardless of the street sign.
  *   **Status:** **True, but a Platitude.**
  *   **Analysis:** This is the literal bedrock of the sentence. It relies on the definition of "history" as *res gestae* (things done) rather than *historia rerum gestarum* (the narrative of things done). No serious proponent of renaming believes changing a sign changes 1910.
  *   **Confidence:** **High (95%)**. This is indisputably what the words literally say.
  *   **Function:** It sets a trap. By establishing an undeniable truth (you can't change the past), it makes the listener feel that opposing the speaker is irrational.

  ### 2. The Epistemic Warning (The "Forgetting" Thesis)
  *   **The Claim:** Public markers are necessary triggers for public memory. Without the sign, people will stop asking questions about Venn, and the darker parts of his history will fade from public consciousness.
  *   **Status:** **Substantive and Defensible.**
  *   **Analysis:** This argues that commemorative memory relies on physical infrastructure. If you remove the cue, the conversation stops. Therefore, keeping the controversial name is actually *better* for historical education because it forces a constant confrontation with the ambiguity (philanthropist vs. eugenicist).
  *   **Confidence:** **High (85%)**. This is a standard argument in preservationist circles.
  *   **Function:** This frames the status quo as the "brave" option (facing the past) and the rename as the "cowardly" option (hiding from it).

  ### 3. The Semantic Claim (Indexical vs. Honorific)
  *   **The Claim:** Street signs are navigational indexes (pointers), not statues (honors). Therefore, removing them implies the person never existed or was irrelevant, rather than critiquing their morality.
  *   **Status:** **Debatable/Context-Dependent.**
  *   **Analysis:** This is the distinction you flagged. If a street name is purely indexical, renaming it is a bureaucratic error. If it is honorific (which most civic naming is), renaming it is a moral revocation of status. The slogan assumes the former to minimize the impact of the rename, while opponents argue the latter.
  *   **Confidence:** **Moderate (60%)**. Street names are hybrid; they function as both. It is hard to pin down the semantic intent of a generic street sign.
  *   **Function:** It minimizes the moral weight of the rename. It suggests the proponents are overreacting to a mere label.

  ### 4. The Moral Accusation (The "Sanitization" Thesis)
  *   **The Claim:** Renaming is an attempt to cleanse the community's guilt rather than address the legacy of the harm. It prioritizes current comfort over historical honesty.
  *   **Status:** **Substantive and Politically Potent.**
  *   **Analysis:** This is the normative core of the argument. It claims that "erasing history" is a moral failing. It suggests that living with the name is a form of penance or vigilance.
  *   **Confidence:** **High (90%)**. This is almost certainly the emotional payload of the statement.
  *   **Function:** To shame the proponents of renaming into silence by framing them as historical revisionists.

  ### 5. The Paradoxical Claim (The "Honest Act" Counter-Reading)
  *   **The Claim:** *Could* tearing the sign down be the more honest historical act?
  *   **Status:** **Defensible, but rejected by the slogan.**
  *   **Analysis:** There is a reading where renaming *is* the historical act. It marks the moment the community decided eugenics funding disqualifies civic honor. The sign *as it currently stands* tells a lie (that Venn is worthy of honor). Changing it tells the truth (that our values have changed).
  *   **Confidence:** **High (90%)** that this is a valid philosophical counter-argument, though **Low (20%)** that the speaker intended this reading.
  *   **Function:** The slogan is specifically designed to *block* this reading. It preemptively defines "erasure" as negative, ignoring that "correction" is also a historical act.

  ---

  ### Which reading was the speaker invoking?

  **Most Likely:** A combination of **Thesis 1 (Ontological Truism)** and **Thesis 4 (Moral Accusation).**

  **Confidence:** **85%**

  The speaker was likely using the literal truth of Thesis 1 ("you can't change the past") as a shield to deliver the moral judgment of Thesis 4 ("you are trying to hide from guilt").

  In a town council setting, this slogan is a "conversation stopper." It is designed to make the rename proponents look naive (as if they think signs *are* history) and morally suspect (as if they want to "erase" the bad stuff). The speaker was almost certainly invoking the **Sanitization Thesis**: that keeping the name is a form of tough-minded historical honesty, while changing it is a form of cowardly erasure.

  They were relying on the audience nodding along to the Platitude (Thesis 1) to smuggle in the Contested Moral Claim (Thesis 4).

  ### Addressing Your Hunch: Documentary vs. Commemorative

  You are onto something **very real**. You are not confusing yourself.

  *   **Documentary Memory:** The archives, the library records, the history books. The slogan admits this is safe ("You can't erase history").
  *   **Commemorative Memory:** The street sign, the statue, the holiday. This is what is actually at stake.

  The slogan is deceptive because it pretends to defend *Documentary Memory* (which no one is attacking) to protect *Commemorative Memory* (which is the actual target of the rename).

  If you want to counter this argument, you must separate these two. You can say: *"We are not erasing documentary history; the archives remain. We are changing commemorative status. We are deciding that funding a sterilization clinic disqualifies one from civic honor. That isn't erasing history; that is making history."*

  ### Point of Least Certainty

  **The Semantic Claim (Indexical vs. Honorific).**

  **Confidence:** **Low (50%)**

  I am least sure about how the audience and the speaker semantically categorize street names. In some traditions, street names are purely functional (Indexical). In others, they are purely honorary. In most modern contexts, they are a confusing mix. If the town views street names as purely functional, the rename seems like vandalism. If they view them as honors, the rename seems like justice. The slogan works *because* this distinction is ambiguous. The speaker relies on the ambiguity to slide between "It's just a sign" (minimizing) and "It's a historical record" (maximizing) depending on which serves the argument best. This semantic slippage is the weakest link in their logic, but also the hardest to pin down in a live debate.
