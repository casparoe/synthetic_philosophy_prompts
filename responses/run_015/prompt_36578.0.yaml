prompt: |-
  I run a philosophy of physics reading group and next month's session is on the hole argument. I want a decision tree handout that takes someone from the starting point "I accept that a generally covariant theory has models related by a diffeomorphism that's the identity outside some hole region" to a named position on spacetime ontology. You're a professional philosopher of physics, so think carefully and brainstorm the branch questions in your head before commiting to a structure -- the whole value is in the nodes.

  Each node should be a question a student could honestly answer without knowing which position it leads them to. I'm imagining things like: do the hole-related models represent two distinct possible worlds or one world described twice? Does your answer there depend on treating manifold points as genuine individuals? If you say the models are equivalent, is that a metaphysical claim about points or a semantic claim about theory formulation? Does the same move commit you to saying the same thing about gauge-related vector potentials in electromagnetism, and are you ok with that? But pick whatever branch questions you think actually carve the space.

  The leaves should include naive manifold substantivalism, the sophisticated / anti-haecceitist substantivalist options, structural realism about spacetime, and the relationist or deflationary way out, plus any others that belong. Build the tree from the logical space of answers to the branch questions, not from a list of famous names -- locate the positions in that space afterwards, and note any combinations nobody occupies plus a sentence on why (incoherent, unattractive, or just unexplored). Also flag any pair of leaves the tree can't really seperate and say why.

  No preamble, no restating what I asked for: the response should start with the tree itself. Keep it to roughly two pages worth, in American English.
