      *   The single/double-story distinction is a structural bifurcation. It's not a continuous deformation (style); it's a topological shift. But both are valid 'a's.
      *   Why the binary fails: Essence suggests a single underlying truth. Style suggests variation on that truth. Skeleton choices suggest *multiple* underlying truths that all map to the same label. The binary assumes one core + many skins. Skeleton choices say there are multiple cores.

  3.  **Representing 'a-ness' in Code (without hardcoding):**
      *   Hardcoding: `if type == 1 draw_single(); else draw_double();` (User wants to avoid this).
