      *   The "interesting thing" remains: The tension is between *recognition* (category) and *expression* (variation). Even if categories have internal structure, the need to maintain recognition across 26 glyphs while varying parameters is still the core challenge.
      *   However, the user is right that "essence" is less Platonic than we pretend. It's more like a "stable convention."
      *   What holds the line? Legibility constraints. You can change the skeleton only if the letter remains distinguishable from its neighbors in the alphabet. Style can change almost infinitely; skeleton choices are limited by the need to not become another letter.

