          *   Alignment: Most people support donation but fail to register (means/ends alignment). (Pass)
          *   Cognitive Burden: Reduces friction for a pro-social act. (Pass)
          *   Harm: Low risk to individual.
          *   *Verdict:* Clear Pass. (Standard nudge).

      *   *Case 2: Cafeteria (Water vs. Soda).*
          *   Reversibility: Can still ask for soda. (Pass)
          *   Alignment: Health dept goal vs. Student desire. (Ambiguous - do students *want* to be healthy?)
          *   Cognitive Burden: Exploits laziness/visual bias. (Passable as "helping willpower").
          *   Harm: Sugar consumption.
          *   *Verdict:* Clear Pass (usually), but let's make it the "Judgment Call" or "Pass" to save the "Fail" for the third one. Actually, the prompt asks for one answer I *won't like* (assuming I'm pro-nudge). The Mental Health one is the most intrusive. Let's make the Mental Health one the "Fail" or "Hard Judgment."
          *   *Revision:* Let's make the Cafeteria one the "Judgment Call" (Collective good vs. Individual choice) and the Mental Health one the "Fail" (High friction opt-out + sensitive domain). Or vice versa.
          *   *Decision:* The Mental Health one has a *frictionful* opt-out (watch 5-min video). That violates the "Easy Exit" principle. That's a clear Fail. The Cafeteria one is a classic nudge, likely a Pass. The Organ Donor is a Pass.
          *   *Wait, I need a "Judgment Call" zone too.* The prompt asks for "worked examples of a clear pass, a clear fail, and the zone where i just have to own the judgment call."
          *   *Re-assignment:*
              1.  Organ Donation: Clear Pass.
              2.  Cafeteria: Judgment Call (Collective health vs. subtle manipulation of kids).
              3.  Mental Health: Clear Fail (High friction opt-out violates autonomy).

      *   *Case 3: Mental Health Auto-Enrollment (Video barrier).*
          *   Reversibility: 5-minute video is a "tax" on opting out. This is a "sludge." (Fail).
          *   Alignment: Mental health is good, but mandatory screening feels intrusive.
          *   *Verdict:* Clear Fail.

  6.  **Developing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the constraints (20 mins, no degree).
      *   **The Procedure (The "Nudge Ethics Gate"):** 5 Steps.
          *   Step 1: The Exit Door (Reversibility).
          *   Step 2: The Mirror Test (Alignment of Goals).
          *   Step 3: The Brain Bypass (Manipulation vs. Assistance).
          *   Step 4: The Harm Scale (Risk).
          *   Step 5: The Value Trap (Where you decide).
      *   **Limitations:** What the tool can't do.
      *   **Applications:** The three cases.

  7.  **Review against Constraints:**
      *   *Grounded in philosophy?* Yes (Mill, Thaler/Sunstein, Autonomy).
      *   *Non-philosopher language?* Yes (translated concepts).
      *   *One answer I won't like?* Yes (The Mental Health one fails due to the video barrier).
      *   *Hard cases handled?* Yes (unstable preferences, collective goods).
      *   *Flag limitations?* Yes.

  8.  **Refining the "Judgment Call":**
      *   The Cafeteria case is good for this. It involves children (vulnerable), stable preferences (kids want sugar), and collective good (public health costs). It's not a clear fail on reversibility, but it's aggressive on preference shaping. I will mark this as the "Judgment Call" zone.
      *   The Mental Health one is a clearer Fail because of the *opt-out cost*. A 5-minute video is a penalty. That violates the "libertarian" part of libertarian paternalism.
      *   The Organ Donation is the Clear Pass.

      *Self-Correction on Mental Health Case:* If I make the Mental Health case a "Clear Fail," does that satisfy the "one answer I won't like" constraint? The user says "I'm generally pro-nudge." So a "Fail" verdict is the one they won't like. Yes.
      *Wait, I also need a "Judgment Call" example.* The prompt asks for "worked examples of a clear pass, a clear fail, and the zone where i just have to own the judgment call."
      *Okay, I have three cases.*
      1. Organ Donation -> Clear Pass.
      2. Cafeteria -> Judgment Call (Zone).
      3. Mental Health -> Clear Fail.
      *Perfect.*

  9.  **Drafting the Content (Iterative refinement for tone):**
      *   Keep it punchy. Use bolding for decision points.
      *   Ensure the "Why" connects back to the philosophy without naming dropping too much.
      *   Make sure the "Limitations" section is honest about what the tool can't solve (e.g., long-term preference change).

  10. **Final Polish:** Check the 20-minute constraint. The steps need to be answerable quickly. Ensure the "Stop" commands are visible.

      *(Self-Correction during drafting Step 2)*: "Alignment of Ends" is tricky. How do I know what they want? I need to specify *evidence* of alignment (surveys, past behavior) vs. assumption.
      *(Self-Correction during drafting Step 3)*: Distinguish between "helping me do what I want" vs "making me do what you want."
      *(Self-Correction on Mental Health)*: The 5-minute video is the killer. It turns an opt-out into a hurdle. That's "sludge," not a nudge.

  11. **Final Review against Prompt:**
