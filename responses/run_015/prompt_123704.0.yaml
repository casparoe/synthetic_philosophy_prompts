prompt: |-
  i'm the ethics compliance officer for our city health dept's behavorial unit. we get about three nudge proposals a month—default opt-ins, cafeteria layouts, reminder texts using social norms, auto-enrollment in wellness programs, stuff like that. i have maybe twenty minutes per proposal, i dont have a philosophy degree, my director signs off on my one-page memo, and if i approve something manipulative the council chews me out or we end up in court. i need a reusable decision proceedure i can run step by step: the questions in order, what counts as a sufficient answer at each step, where it stops with a hard no, where it hands the call to me because it's values not facts, and where it's guaranteed to misfire. ground it in actual philosophy of paternalism and autonomy—mill's harm principle, the soft vs hard paternalism distinction, the idea that nudges can bypass rational deliberation even when choice is technically preserved, and the idea that the person should be able to reverse the decision easily without penalty—but translate it so a non-philosopher can use it. the procedure must handle the hard cases: nudges that exploit biases people would want corrected upon reflection, domains where people lack stable preferences like mental health or long-term savings, and nudges that serve collective goods rather than the individual's own ends.

  apply it to three proposals:
  1. driver's license renewal form with organ donation default opt-in and a one-click opt-out.
  2. school cafeteria redesign putting water at eye level and soda behind a counter that requires asking staff.
  3. auto-enrolling all city employees in a mental-health screening check-in, with opt-out only available after watching a 5-minute video explaining benefits.

  make sure one answer is one i wont like—i'm generally pro-nudge but the procedure should be honest. include worked examples of a clear pass, a clear fail, and the zone where i just have to own the judgment call. flag exactly what the procedure cant do, like predicting long-term preference change or resolving conflicts between collective health and individual privacy. no bibliographies or citations needed, i just need the tool.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Ethics Compliance Officer for a City Health Dept's Behavioral Unit.
      *   **Task:** Create a reusable, step-by-step decision procedure for evaluating "nudge" proposals.
      *   **Constraints:**
          *   Time limit: ~20 minutes per proposal.
          *   Output: One-page memo for the Director.
          *   Risk: Avoid manipulation lawsuits/council backlash.
          *   Background: No philosophy degree, but needs grounding in actual philosophy (Mill, paternalism, autonomy, bias, reversibility).
          *   Scope: Must handle hard cases (exploiting biases, unstable preferences, collective goods).
          *   Requirement: One answer must be unfavorable (honest application).
          *   Format: Clear steps, sufficient answers, stop points (Hard No), judgment calls (Values), limitations (Guaranteed Misfires).
          *   Application: Apply to three specific cases (Organ donation, Cafeteria, Mental health auto-enrollment).
          *   Tone: Practical, actionable, non-academic but philosophically robust. No bibliographies.

  2.  **Deconstruct the Philosophical Foundations (for internal use):**
      *   *Mill's Harm Principle:* Interference is only justified to prevent harm to others. Self-harm is tricky (paternalism).
      *   *Soft vs. Hard Paternalism:* Soft = intervening when choices aren't fully voluntary/informed (okay). Hard = overriding voluntary choices for the person's own good (problematic).
      *   *Autonomy/Manipulation:* Does the nudge bypass rational deliberation? (Thaler/Sunstein vs. Critics).
      *   *Reversibility:* Can the user opt-out easily? (Cost of exit).
      *   *Ends vs. Means:* Does the nudge help achieve the person's own goals (means) or impose new goals (ends)?
      *   *Collective Good:* Public health vs. Individual liberty.

  3.  **Drafting the Decision Procedure (The "Tool"):**
      *   *Goal:* A checklist that fits in 20 minutes.
      *   *Structure:* Sequential gates. If you fail a gate, stop. If you pass all, approve. If ambiguous, flag for judgment.
      *   *Step 1: Transparency & Reversibility (The "Easy Exit" Test).* Grounded in autonomy. If you can't get out easily, it's coercive.
      *   *Step 2: Alignment of Ends (The "Whose Goal?" Test).* Grounded in Mill/Paternalism. Is this what the person would want for themselves, or is it purely for the state?
      *   *Step 3: Cognitive Burden & Bias (The "Bypass" Test).* Grounded in behavioral ethics. Does it trick the brain or help it?
      *   *Step 4: Harm & Vulnerability (The "Risk" Test).* Grounded in Harm Principle. What happens if they choose the "wrong" way?
      *   *Step 5: The Judgment Zone.* Where philosophy runs out and politics/values begin.

  4.  **Refining the Steps for a Non-Philosopher:**
      *   Instead of "Soft Paternalism," use "Is the choice actually theirs?"
      *   Instead of "Epistemic Authority," use "Do we know better than they do?"
      *   Make the "Stop" conditions clear.

  5.  **Applying the Procedure to the Three Cases:**

      *   *Case 1: Organ Donation (Default Opt-In).*
