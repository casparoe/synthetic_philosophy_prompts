      *Let's write it.*
answer: |-
  # The "Nudge Ethics Gate" Decision Procedure

  **Purpose:** To evaluate behavioral interventions quickly (under 20 mins) while protecting autonomy and minimizing legal/political risk.
  **Philosophical Basis:** Translated from Mill's Harm Principle, Soft Paternalism, and Libertarian Paternalism.
  **Instructions:** Answer the questions in order. If you hit a **STOP**, the proposal is rejected. If you hit **JUDGMENT**, you must write the justification in your memo. If you pass all gates, it is **APPROVED**.

  ---

  ## Step 1: The Exit Door Test (Reversibility)
  *Philosophy: Autonomy requires the ability to say "no" without penalty.*

  **Question:** Can the individual opt out or reverse the decision as easily as they can accept it?
  *   **Sufficient Answer:** Yes. The cost (time, effort, money, social awkwardness) to opt out is equal to or less than the cost to opt in.
  *   **Hard No:** Opting out requires extra steps, waiting periods, mandatory training, fees, or face-to-face confrontation. (This is "sludge," not a nudge).
  *   **Judgment Call:** Opting out is slightly less convenient (e.g., one extra click) but functionally free.

  **→ If Hard No: STOP. Reject.**
  **→ If Yes: Proceed to Step 2.**
  **→ If Judgment: Flag for Memo. Proceed to Step 2.**

  ## Step 2: The Mirror Test (Alignment of Ends)
  *Philosophy: Soft Paternalism. We can help people achieve *their* goals, but we cannot impose *our* goals on them.*

  **Question:** Is there evidence that the target population actually wants this outcome, even if they currently struggle to achieve it?
  *   **Sufficient Answer:** Yes. Surveys, past behavior, or stated preferences show people value the outcome (e.g., saving money, eating healthy) but fail due to friction or forgetfulness.
  *   **Hard No:** The nudge pushes an outcome the population actively rejects or is indifferent to, solely for the benefit of the state/budget.
  *   **Judgment Call:** Preferences are unstable or unknown (e.g., mental health, addiction). We assume they *should* want this, but can't prove they *do*.

  **→ If Hard No: STOP. Reject.**
  **→ If Yes: Proceed to Step 3.**
  **→ If Judgment: Flag for Memo. Proceed to Step 3.**

  ## Step 3: The Brain Bypass Test (Manipulation)
  *Philosophy: Rational Deliberation. Nudges should aid willpower, not hijack cognitive biases.*

  **Question:** Does this nudge work by making information clearer, or by exploiting a cognitive blind spot (fear, shame, confusion)?
  *   **Sufficient Answer:** It reduces friction for a rational choice (e.g., simplifying a form, reminding of a deadline).
  *   **Hard No:** It relies on deception, hidden framing, or exploiting a vulnerability (e.g., using anxiety to force compliance, hiding the default option).
  *   **Judgment Call:** It uses a bias (like social norms) to encourage a behavior that is beneficial but not inherently rational (e.g., "90% of your neighbors pay taxes").

  **→ If Hard No: STOP. Reject.**
  **→ If Yes: Proceed to Step 4.**
  **→ If Judgment: Flag for Memo. Proceed to Step 4.**

  ## Step 4: The Harm Scale (Risk Assessment)
  *Philosophy: Mill's Harm Principle. The stakes determine the level of scrutiny.*

  **Question:** If the nudge "fails" and the person makes the "wrong" choice, what is the consequence?
  *   **Sufficient Answer:** Low stakes (minor financial loss, temporary inconvenience, minor health risk).
  *   **Hard No:** High stakes (permanent loss of rights, severe health outcome, legal liability, irreversible privacy breach).
  *   **Judgment Call:** Medium stakes (long-term health impacts, moderate financial loss).

  **→ If Hard No: STOP. Reject.**
  **→ If Yes/Judgment: Proceed to Step 5.**

  ## Step 5: The Value Trap (The Judgment Zone)
  *Philosophy: Political Legitimacy. Where facts end and values begin.*

  **Instruction:** If you have reached Step 5, the proposal is technically sound but ethically ambiguous. You must now answer this for your memo:
  *"Does the collective benefit outweigh the subtle erosion of individual agency in this specific domain?"*

  *   **Green Zone:** Collective good is high, individual agency impact is low (e.g., organ donation).
  *   **Red Zone:** Collective good is vague, individual agency impact is high (e.g., mandatory ideological training).
  *   **Gray Zone:** You must sign your name. If the Council asks, you argue that the nudge preserves *choice architecture* while serving *public welfare*.

  ---

  # Limitations: Where This Tool Misfires
  *Be aware of these blind spots. The procedure cannot resolve them.*

  1.  **Preference Shaping:** This tool assumes preferences exist. It cannot detect if a nudge *changes* what people want over time (e.g., if auto-enrollment makes people stop thinking about savings entirely).
  2.  **The "Collective" Definition:** It cannot objectively weigh individual privacy against public health costs. That is a political calculation, not an ethical one.
  3.  **Vulnerable Populations:** It treats all adults as equally capable. It may under-protect children, the cognitively impaired, or those in crisis unless you manually adjust Step 4.
  4.  **Long-Term Autonomy:** It measures immediate reversibility. It cannot measure if repeated nudges erode the "muscle" of decision-making over years.

  ---

  # Applied Examples

  ### Case 1: Driver's License Organ Donation Default
  *Proposal: Form defaults to "Yes." One-click opt-out.*

  *   **Step 1 (Exit Door):** **PASS.** One-click opt-out is equal effort to opt-in.
  *   **Step 2 (Mirror):** **PASS.** Polling shows majority support donation; friction prevents registration.
  *   **Step 3 (Brain Bypass):** **PASS.** Reduces friction; does not exploit fear or confusion.
  *   **Step 4 (Harm):** **PASS.** Low individual risk; high collective benefit.
  *   **Step 5 (Value):** **GREEN ZONE.**
  *   **Verdict:** **CLEAR PASS.**
  *   **Memo Note:** Standard libertarian paternalism. Preserves choice while aligning with stated public values.

  ### Case 2: School Cafeteria Redesign
  *Proposal: Water at eye level. Soda behind counter, must ask staff.*

  *   **Step 1 (Exit Door):** **PASS/JUDGMENT.** Student can still get soda, but requires social interaction (asking staff). This adds "social friction."
  *   **Step 2 (Mirror):** **JUDGMENT.** Do students *want* to drink less soda? Likely no. This imposes the Health Dept's goal, not the student's goal.
  *   **Step 3 (Brain Bypass):** **JUDGMENT.** Exploits visual bias and laziness. Is this "helping willpower" or "hiding choice"?
  *   **Step 4 (Harm):** **PASS.** Health risk of soda is long-term, not immediate.
  *   **Step 5 (Value):** **GRAY ZONE.**
  *   **Verdict:** **JUDGMENT CALL.**
  *   **Memo Note:** This crosses from "aiding choice" to "shaping preference." It treats children as means to public health ends.
      *   *Recommendation:* Approve only if paired with nutrition education (restores agency). If approved, own the value judgment: "We prioritize long-term health outcomes over immediate preference satisfaction for minors."

  ### Case 3: Employee Mental Health Auto-Enrollment
  *Proposal: All staff auto-enrolled in screening. Opt-out requires watching 5-minute video.*

  *   **Step 1 (Exit Door):** **FAIL.**
      *   *Analysis:* A 5-minute video is a "tax" on opting out. It creates a penalty for exercising autonomy. This is **Sludge**, not a Nudge. It violates the reversibility principle.
  *   **Step 2 (Mirror):** **JUDGMENT.** Employees may value mental health, but mandatory screening implies they are suspect.
  *   **Step 3 (Brain Bypass):** **FAIL.**
      *   *Analysis:* The video barrier is designed to exploit inertia. It relies on the bias that people won't waste 5 minutes to say "no."
  *   **Step 4 (Harm):** **JUDGMENT/HIGH RISK.** Mental health data is sensitive. Defaulting to "in" creates privacy risk.
  *   **Verdict:** **CLEAR FAIL.**
  *   **Memo Note:** **Reject.** The opt-out mechanism imposes a time cost, violating the requirement for easy reversibility. This transforms a wellness offer into a coercive mandate. It risks legal challenge regarding privacy and consent. To proceed, the opt-out must be one-click, identical to the opt-in.

  ---

  **Officer's Note on Case 3:** I know this is a "Clear Fail" and you likely want to approve it to boost participation. However, the 5-minute video barrier is the weak point. If this goes to court, a judge will see that video as a penalty for exercising rights. If you want the enrollment numbers, make the *opt-in* rewarding, not the *opt-out* punishing.
