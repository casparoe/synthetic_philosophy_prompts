      *   *Self-Correction on Winner:* Make sure to distinguish Winner's two thesis types clearly. 1. Specific design for power (Moses). 2. Technology requiring specific social structures (Nuclear). The user ignores #2.
      *   *Self-Correction on "Politics":* Winner defines politics as "who gets what, when, how" (Lasswell) but specifically regarding *authority* and *power*. The user defines it as "unequal distribution." That's close, but "unequal" happens in nature. Politics implies *social ordering*.
