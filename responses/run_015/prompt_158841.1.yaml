      *   **Fixed Facts:** A-H Ultimatum + German Blank Check -> Serbia's near-acceptance -> A-H Declaration of War -> Russia's Partial to General Mobilization -> German Demand/Halt -> German Declaration of War on Russia & France -> Schlieffen Plan (France first via Belgium).
