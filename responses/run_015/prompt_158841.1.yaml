  2.  **Mapping the Commitment Race:**
      *   *Players vs. Pieces:*
          *   Players: Germany, Russia, France, Austria-Hungary (to a lesser extent, often driven by Germany), UK (late entrant/observer).
          *   Pieces: Serbia (the trigger, but not a driver of the great power race), Belgium (terrain), Mobilization Timetables (the mechanism).
          *   *Refinement:* Austria-Hungary is tricky. They started the fire, but in the *commitment race* of mobilization, they were often trailing Germany and Russia. Germany and Russia are the primary racers. France is bound to Russia but strategically passive in the race itself.
      *   *The Move:* General Mobilization. Partial mobilization counts as a signal, but General is the "lock-in."
      *   *Observation:* Telegraphs, spies, railway reports, diplomatic notes. Crucially, *belief* about the move matters as much as the move itself.
      *   *The Track:* It's not just the physical railways; it's the *belief* about the railways. The race runs in the "mind of the General Staff" and the "Cabinet Room." It's a race of *perceived inevitability*.

  3.  **Auditing the Model (Explanation vs. Limitations):**
      *   *What it explains:*
