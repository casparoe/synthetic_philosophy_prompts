  8.  *(Final check on the "Unconsidered Move")*: Is there something truly unconsidered? Perhaps a "joint demobilization guarantee"? Or simply the idea of *not* mobilizing even if the other side did (absorbing the blow). Moltke argued this was suicide. So the unconsidered move is "Strategic Passivity."

