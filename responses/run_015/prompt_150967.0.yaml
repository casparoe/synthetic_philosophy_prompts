answer: |-
  Here is the breakdown of your moral logic, sorted by the underlying mechanics of sanction.

  **The Core Principle**
  The distinction isn't about how bad the feeling is, but **where the judge sits**.
  *   **Guilt** is an internal sanction. It requires a conscience. It judges the *act* ("I did something bad"). It works in solitude.
  *   **Shame** is an external sanction. It requires a witness (real or imagined). It judges the *self* ("I am something bad"). It relies on social standing.

  **Addressing Your Questions**
  *   **Is one better?** Neither. Guilt scales better for individual autonomy and repair (you can fix a bad act). Shame scales better for group cohesion and conformity (you must protect the group's image), but it breeds hypocrisy and resentment.
  *   **Can a culture pick one?** They can choose their *mechanisms*, but the mechanisms dictate the emotion. If you build courts and confessions, you get guilt. If you build stocks and ostracization, you get shame. You cannot mandate the emotion independent of the structure.
  *   **Internalized shame with no audience?** It collapses. Shame requires an "other." If you remove the audience, the emotion either mutates into guilt (internalizing the judgment) or paranoia (imagining an audience where there is none). A society trying this becomes a guilt society by accident, or a surveillance state where everyone watches everyone.

  **Analyzing Your Cases**
  *   **Case 1 (Hidden Guilt):** Logically sound. Internal sanction, no audience.
  *   **Case 2 (Exposed Shame):** Logically sound. External sanction, audience present, internal feeling absent (performative).
  *   **Case 3 (Collective Shame):** Defensible, but borderline. If the town *knows* (even unspoken), there is an implicit audience. The "heaviness" is the weight of shared identity stain. It works if the fear is that it *could* be spoken.
  *   **Case 4 (Ritualized Guilt):** **Logical Failure.** You cannot engineer *privacy* through *public ritual*. A mass ritual creates an audience. If there is an audience, the emotion generated is shame, not guilt. This case contradicts its own definition.
  *   **Case 5 (Institutionalized Shame):** Logically sound. Public role-change is classic shame/restorative justice mechanics.

  **The Fix**
  You must drop **Case 4**. It is the only one that is mechanistically impossible. You can have a culture *try* to do this, but in your world-building logic, it must fail or be reclassified as a shame culture masquerading as guilt. Case 3 is salvageable if you emphasize the *implicit* audience (the fear of the secret getting out). Case 4 is an oxymoron.

  Verdict: 4
  \answer{Guilt judges the act in solitude; shame judges the self before witnesses.}
