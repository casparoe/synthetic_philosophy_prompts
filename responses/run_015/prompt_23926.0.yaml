      *   *(1)-(2) Tension:* Modify (2). Specify commensurability applies only *sub-threshold*.
      *   *(2)-(3) Tension:* Modify (2) or the aggregation implication. If (2) implies linear summation, it forces RC. Since (1) already breaks linearity, (2) needs to align with (1).
      *   *(4) Tension:* None really, but clarify if obligations are impersonal or person-affecting to avoid paradoxes with (1).

  6.  **Identify the Single Most Impactful Revision:**
      *   Fixing (2) is the key. (2) is the outlier. (1), (3), and (4) form a coherent "Lexical Negative Utilitarian" cluster. (2) sounds like a Classical Utilitarian defense of trade-offs.
