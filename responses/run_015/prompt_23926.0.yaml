      *   **Pair (2) & (3): Commensurability vs. Anti-RC.**
          *   *Tension:* Moderate/High.
          *   *Reasoning:* Classic Total Utilitarianism (which assumes commensurability) leads to RC. If pleasure and pain are on a common scale and we sum them (implied by utilitarianism), then enough "barely worth living" lives (net positive) will eventually outweigh a few "very happy" lives.
