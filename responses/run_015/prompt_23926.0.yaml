          *   *Cheapest Fix:* Ensure the aggregation rule isn't simple summation. (1) already implies a non-linear aggregation (lexicality). So (2) is the weak link here if it implies linearity.

      *   **Pair (4) & (1)/(2)/(3): NIP vs. The Rest.**
          *   *Tension:* Low.
          *   *Reasoning:* (4) is about the *scope* of moral consideration (which entities count). (1)-(3) are about the *currency* and *aggregation* of value. You can be a Lexical NU and believe we have obligations to future specific people (Person-Affecting) or future abstract welfare slots (Impersonal).
