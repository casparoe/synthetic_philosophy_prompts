          *   *Cheapest Fix:* Qualify (2). "Pleasure and pain are commensurable *below the suffering threshold*."

      *   **Pair (1) & (3): LTNU vs. Anti-RC.**
          *   *Tension:* Low/None.
          *   *Reasoning:* LTNU is a standard way to avoid the RC. If the "barely worth living" lives involve *any* lexical suffering, the huge population is infinitely bad. If they don't, but the view prioritizes avoiding suffering over creating happiness, it still blocks the RC (which relies on total happiness swamping quality).
