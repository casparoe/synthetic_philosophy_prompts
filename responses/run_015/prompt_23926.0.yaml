          *   Tier 2 (Mild Suffering/Pleasure): Linear/Trade-off.
          *   Implication: Preventing severe suffering is the absolute priority.

      *   **(2) Commensurability:**
          *   Structure: One scale.
          *   Implication: $X$ pain can be offset by $Y$ pleasure.
          *   Tension Point: How does this fit with *Lexical* priority in (1)? Lexicality usually implies *incommensurability* between the lexically prior good/bad and the secondary goods/bads. If I say "No amount of happiness cancels severe suffering," I am effectively saying severe suffering and happiness are *not* fully commensurable on a single linear scale.

      *   **(3) Anti-RC:**
          *   Structure: Quality over Quantity.
          *   Implication: Average welfare (or a prioritarian/lexical view) matters more than total welfare.
          *   Connection to (1): LTNU naturally avoids the RC *if* the "barely worth living" lives contain *any* threshold suffering. If "barely worth living" means "net positive but below suffering threshold," LTNU might still prefer the huge population if the total mild pleasure outweighs the mild pain, unless there's a lexical *positive* threshold too. But usually, LTNU avoids RC because adding lives risks threshold suffering or because the lexical disvalue of suffering dominates total utility calculations.
          *   Connection to (2): If commensurability holds strictly, RC is hard to avoid unless you deny total utilitarianism.

      *   **(4) NIP Rejection:**
          *   Structure: Person-affecting view or impersonal view that ignores identity dependence.
          *   Implication: We can say Action A is worse than Action B for future people, even if Action A brings different people into existence.
          *   Connection to others: This is mostly about *who* counts, not *how* value is calculated. It fits well with impersonal views (like Utilitarianism).

  3.  **Identify Tensions (Pairwise Analysis):**

      *   **Pair (1) & (2): Lexicality vs. Commensurability.**
          *   *Tension:* High.
          *   *Reasoning:* (1) says severe suffering cannot be traded off against happiness (lexical). (2) says pain and pleasure are commensurable and traded off (surgery example).
