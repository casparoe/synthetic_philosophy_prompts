answer: |-
  # JOINT STATEMENT ON THE NATURE OF TRUTH
  **Prepared by:** Adversarial Collaboration Group (Deflationist & Inflationist Representatives)
  **Date:** October 26, 2023
  **Subject:** Scope and Limits of the Truth Predicate

  ## 1. AGREED CLAIMS
  *The following propositions are endorsed by both parties as accurate descriptions of the phenomenon of truth, regardless of metaphysical grounding.*

  1.  **Validity of the T-Schema:** Both parties accept the Tarski biconditional ("It is true that *p* if and only if *p*") as materially correct for all non-paradoxical sentences in a fixed language. Neither party contends that a sentence can be true while the world is not as it says, or vice versa.
  2.  **Function in Generalization:** Both parties agree that the primary logical utility of the truth predicate is to enable generalizations that cannot be expressed by finite conjunction. (e.g., "Everything the witness said is true" allows endorsement without listing every sentence).
  3.  **Transparency:** In ordinary assertion, asserting "It is true that *p*" is functionally equivalent to asserting "*p*." Neither party claims that adding "it is true that" changes the truth-conditions of the base proposition.
  4.  **The Liar Paradox:** Both parties agree that unrestricted naive truth schemas lead to contradiction (e.g., the Liar Sentence). Both agree that some restriction on the schema, logic, or language hierarchy is required to maintain consistency, though we disagree on which restriction is most philosophically costly.
  5.  **Instrumental Value:** Both parties agree that having true beliefs is generally instrumentally valuable for agents seeking to navigate the world, though we disagree on whether this value derives from the *property* of truth or the *content* of the beliefs.
  6.  **Non-Observability:** Truth is not a sensory quality. One cannot observe "truth" directly; one observes evidence that supports a proposition which is then evaluated as true or false.

  ## 2. RESIDUAL DISAGREEMENTS
  *The following table outlines the metaphysical and explanatory divergences that remain after accepting Section 1.*

  | Topic | Deflationist Position (Horwich-style) | Inflationist Position (Correspondence/Realist) |
  | :--- | :--- | :--- |
  | **Metaphysical Status** | Truth is not a genuine property with a hidden nature. It is a logical device. To ask "what is truth?" is to misunderstand the concept; there is nothing more to know beyond the T-schema. | Truth is a genuine, substantive property (e.g., correspondence to facts). It has a nature that can be analyzed and discovered independently of the T-schema. |
  | **Explanatory Power** | Truth does no causal or scientific explanatory work. Saying "The bridge collapsed because the belief it was unsound was *true*" adds nothing over "The bridge collapsed because it was unsound." | Truth plays a genuine explanatory role. The *truth* of a theory explains its instrumental success (e.g., "The theory worked because it was true"). |
  | **Norm of Belief** | The norm of belief is fully captured by evidential norms. "You ought to believe what is true" collapses into "You ought to believe *p* if you have evidence for *p*." | Truth is the constitutive norm of belief. Belief *aims* at truth by its very nature, distinct from mere justification or utility. |
  | **Investigation** | We cannot investigate truth in general; we can only investigate whether specific propositions are true. | We can investigate the nature of truth itself (e.g., via phenomenology or metaphysics) distinct from investigating specific facts. |

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS
  *We identify two specific domains where our theories yield different expectations. We agree to treat these as empirical or quasi-empirical tests of the frameworks.*

  **Crux A: The "No Miracle" Argument in Science**
  *   **Case:** A novel scientific theory makes a surprising, accurate prediction that leads to successful engineering application.
  *   **Inflationist Prediction:** The best explanation for this success is the *truth* (approximate correspondence) of the theory's core claims. If truth were not a robust property tracking reality, this success would be miraculous.
  *   **Deflationist Prediction:** The success is explained entirely by the specific causal mechanisms described in the theory and the selection pressures of scientific methodology. Attributing "truth" as a separate explanatory variable is redundant and adds no predictive power.
  *   **Agreed Test:** Analyze historical cases of empirically successful theories that were later deemed "false" (e.g., Newtonian mechanics, Phlogiston). If instrumental success persists despite falsity, this supports the Deflationist view that "truth" is not the active ingredient in explanation.

  **Crux B: Blind Endorsement and Inquiry**
  *   **Case:** An agent accepts the rule "Believe whatever is true" without knowing specific propositions.
  *   **Inflationist Prediction:** This rule guides inquiry meaningfully because "truth" refers to a target state (correspondence) that can be pursued even when specific evidence is lacking.
  *   **Deflationist Prediction:** This rule is empty without specific evidence. Inquiry is always driven by specific evidence for specific *p*, not by a general desire for the property of truth.
  *   **Agreed Test:** Examine cases of motivated cognition. If agents claim to seek "truth" but systematically avoid evidence for specific *p*, the Inflationist must explain how the "norm of truth" is severed from evidential norms. The Deflationist predicts this is simply a verbal misdescription of seeking comfort.

  ## 4. VERBAL DISPUTE CLARIFICATION
  *We acknowledge that a portion of our disagreement may be verbal, specifically regarding the term **"Property."***

  *   **The Ambiguity:** The Deflationist accepts that truth is a "property" in the lightweight, logical sense (it is expressed by a predicate that can be instantiated). The Inflationist insists truth is a "property" in the heavyweight, causal/naturalistic sense (like mass or charge).
  *   **Resolution:** We agree that if "property" means "logical attribute expressible by a predicate," the Deflationist wins (truth is a property). If "property" means "causal power that explains phenomena," the Inflationist claims truth is a property, and the Deflationist denies it. We agree to flag future uses of "property" with [L] (Lightweight) or [H] (Heavyweight) to prevent talking past one another.

  ***

  ## 5. HONESTY NOTE: LIKELY POINTS OF FAILURE
  *This section is a meta-commentary on the statement above, acknowledging where actual philosophers in our respective camps would likely refuse to sign.*

  **1. The Explanatory Power Concession (Inflationist Refusal Risk)**
  The biggest risk is that committed Scientific Realists (Inflationists) will refuse to sign **Section 2 (Explanatory Power)** as phrased. Many Inflationists argue that deflationism *cannot* account for the generalization "True theories tend to succeed." They believe the Deflationist formulation in Section 3, Crux A, rigs the game by defining "explanation" too narrowly (requiring causal mechanism). An Inflationist might argue this statement concedes too much to the Deflationist by treating the "No Miracle Argument" as merely a prediction about historical falsity rather than a metaphysical necessity.

  **2. The Norm of Belief Concession (Deflationist Refusal Risk)**
  Hardline Deflationists (particularly Quineans or Error Theorists) may refuse to sign **Section 1, Claim 5** or **Section 2 (Norm of Belief)**. They might argue that even calling truth "instrumentally valuable" or a "norm" (even a collapsed one) reifies the concept too much. For a strict Deflationist, "Truth is the norm of belief" is suspect even if deflated, because it suggests a unified target for belief that doesn't exist. They might prefer to say "Evidence is the norm," and treat "truth" as purely disquotational.

  **3. The T-Schema Exhaustiveness (Joint Friction)**
  In **Section 1, Claim 1**, we agreed the T-schema is "materially correct." However, Inflationists privately believe the T-schema is *insufficient* (it captures extension, not intension), while Deflationists believe it is *exhaustive*. By signing Claim 1, Inflationists risk implying the T-schema is all there is, and Deflationists risk implying there is more to it. We smoothed this over with the word "valid," but this is the most likely place for a "Yes, but..." footnote to appear from either side.

  **4. Why This Draft Exists**
  This statement was accepted in its current form primarily because both sides wanted to end the 300-comment thread loop. The "Verbal Dispute" section (Section 4) is the specific compromise that allowed signing; without distinguishing [L] and [H] properties, the Inflationist would not have signed, and without the "Explanatory Power" distinction, the Deflationist would have walked away. We acknowledge this is a treaty, not necessarily a proof.
