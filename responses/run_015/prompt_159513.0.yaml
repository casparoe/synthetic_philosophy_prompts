answer: |-
  **Project Title:** Metaphysics, Models, and Heuristics: A Layered Analysis of Popper on Darwinism

  **Project Summary**
  Karl Popper's relationship with evolutionary theory is often caricatured as a simple flip-flop: he initially dismissed Darwinism as a metaphysical research programme, then later recanted, calling it testable. Standard interpretations suggest either that Popper was simply corrected by later science, or that his falsifiability criterion is inadequate for historical sciences. This project proposes a third option. I argue that "Darwinism" is not a monolithic theory but a composite of three distinct layers: a historical narrative of common ancestry, a formal population-genetic model, and an adaptationist heuristic. I will investigate whether Popper's shift represents a genuine retraction, or a relocation of the "metaphysical" label from the formal models to the heuristic layer. The goal is to determine if Popper's demarcation machinery can accommodate this layered structure, or if it requires supplementation with a notion of "framework appraisal."

  **Research Question**
  The central question is determinate: Is Popper's later acceptance of Darwinism best understood as (a) a genuine retraction of his early critique, (b) a relocation of the "metaphysical" label from the theory as a whole to specifically the adaptationist heuristic, or (c) evidence that falsifiability is too coarse for mature historical sciences?

  I hypothesize that (b) is correct. Popper's early charge targeted a sloppy version of natural selection where fitness is defined circularly by survival, alongside an adaptationist framework that assumes selection explains all traits. His later recantation validated the formal, model-based layer where fitness is independently measurable. However, the adaptationist heuristic remains unfalsifiable in isolation, functioning as a productive metaphysical framework rather than a testable theory. The project will argue that Popper's system can handle this if we recognize that metaphysical frameworks are rationally appraisable based on explanatory fertility and their ability to generate testable models, even if they are not themselves falsifiable.

  **Significance and Background**
  Existing literature typically settles for three unsatisfying positions. First, that Popper was initially wrong and later right, ignoring that the testable formulations depend on non-testable framework assumptions. Second, that Popper was always talking about different things, which fails to explain why the framework layer cannot be separated from the models. Third, that falsifiability is simply useless for evolutionary biology, which abandons Popper's project rather than testing its limits.

  This project moves beyond these options by dissecting the conceptual structure of Darwinism itself. By distinguishing the historical claim, the formal model, and the heuristic, we can pinpoint exactly what is testable and what is not. This matters for philosophy of science because it suggests that demarcation is not a binary switch but a structural analysis of how theories are built. If successful, this offers a refined view of how metaphysical frameworks function within empirical sciences without violating demarcation criteria.

  **Methodology and Work Plan**
  This project relies on conceptual reconstruction and textual analysis rather than empirical literature review, making it feasible within a 10-week timeframe without web access.

  *   **Weeks 1–2: Layer Reconstruction.** I will define the three layers (historical, formal, heuristic) using toy examples rather than complex biology. The goal is to establish clear criteria for distinguishing them.
  *   **Weeks 3–4: Testability Analysis.** I will analyze the "fitness = survival" circularity charge. I will demonstrate how independent measures of fitness make the formal layer testable, isolating the heuristic layer as the remaining metaphysical component.
  *   **Weeks 5–6: Textual Recantation.** I will examine Popper's later statements to determine which layer he validated. Did he vindicate the heuristic, or only the formal models?
  *   **Weeks 7–8: Framework Appraisal.** I will develop the notion of "framework appraisal." I will check if Popper's later work on metaphysics as rationally discussable provides resources for this, or if it requires a new supplement.
  *   **Weeks 9–10: Synthesis and Writing.** I will assemble the argument for option (b), stress-test it against counter-arguments (e.g., that the layers are inseparable), and produce the final paper.

  This approach is preferred over a straight conceptual analysis of "testability" because it grounds the philosophy in the specific structure of evolutionary theory. It is preferred over a case study of one model because the issue concerns the status of the entire research tradition.

  **Expected Outcomes and Deliverables**
  A successful result will be a 15–20 page paper providing a clean taxonomy of Darwinism's layers and a defended argument that Popper's recantation was a relocation, not a retraction. The deliverable will include a defensible account of how to rationally appraise the untestable heuristic layer based on its ability to generate novel testable models. This provides a nuanced view of scientific rationality that avoids both dogmatic falsificationism and relativism.

  **Risk Assessment and Failure Conditions**
  The primary risk is that the three layers turn out to be inseparable. For example, if fitness cannot be defined independently of survival in practice, the formal layer collapses into the heuristic, and the distinction fails. Another risk is that "framework appraisal" collapses into subjective preference, offering no rational ground for choosing heuristics. If either occurs, the project will fail to support hypothesis (b).

  The most likely failure mode is scope creep: attempting to analyze too many biological examples or getting bogged down in the history of Popper's texts. To mitigate this, I will stick to conceptual toy models and focus strictly on the logical structure of the arguments rather than exegesis.

  **Scope and Feasibility**
  This project is designed for an undergraduate with introductory philosophy of science training and high-school biology. It does not require advanced population genetics. To ensure feasibility within 10 weeks and without web access, I will drop the historical common-ancestry layer if necessary, focusing solely on the selection vs. drift distinction within the formal and heuristic layers. I will treat Popper's later recantation as a given textual object rather than analyzing its historical reception. This ensures the project remains a conceptual analysis rather than a historical survey, keeping it tractable within the fellowship period.
