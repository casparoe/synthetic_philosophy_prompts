prompt: |-
  You're a moral philosopher who's actually worked on theories of well-being — the kind of person who has argued with attitudinal hedonists rather than skimmed a survey article twenty minutes ago. Take your time and think it through properly before answering, and brainstorm the mapping first if that helps.

  I'm an RL researcher. My working vocabulary is reward models, preference learning, scalarized multi-objective optimization, linear probes on activations, Goodhart, inverse RL, on- vs off-policy. I think in vectors and objective functions and my philosophy stops at undergrad 101.

  Why I'm asking: we had labelers rank short descriptions of experiences by how good each one was for the person having it (noisy, I know). The positively labelled ones dont form one region in embedding space — they splinter into about four clusters (bodily relief, absorbed-in-a-task, social warmth, and the mean-spirited stuff), a probe trained to detect good-for-them-ness on one cluster doesn't transfer to the others, and there's no shared direction between them. Call that the splintering.

  Restate the heterogeneity problem for hedonism in my vocabulary, as faithfully as you can: the worry that pleasures have nothing interesting in common, and why that's supposed to threaten the claim that pleasure is the single thing intrinsically good for a person. Then give me the residue report — what maps cleanly onto my vocabulary, what you had to distort to make fit, and what can't be said in it at all.

  Two things I want you to commit on rather than survey. First: attitudinal hedonism looks to me like inverse RL — you define the good-for-you quantity by what the subject is disposed to prefer. If that's the right translation, isn't the resulting theory empty, since maximizing it is satisfied by construction? Tell me whether I'm right. Second: my colleague says the splintering dissolves the whole problem. The real question, she says, was never about a shared felt property; it's about what justifies aggregating seperate states into one scalar at all, i.e. it's a question about scalarization weights, and the splintering just shows those weights can't be read off the data. Genuine dissolution or change of subject?

  Take a definite position on both, with your reasons. No citations or reading suggestions — I've got no library access and dont want them. And if the liking/wanting stuff from affective neuroscience is genuinely useful here you can use it, but I don't want the answer to rest on empirical claims I can't check.
