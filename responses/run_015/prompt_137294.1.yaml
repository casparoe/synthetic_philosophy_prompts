answer: |-
  ### Preliminary Brainstorm: Rejected Correspondences

  Before settling on the audit, I mapped three candidate architectures for the interpersonal analogy, all of which I reject for your purposes.

  1.  **The Temporal Split:** *Deceiver = Past Self; Victim = Future Self.*
      *   *Rejection:* This dissolves the static paradox (no simultaneous contradiction) but fails Job 2. It reduces self-deception to lying to one's future self, which is merely procrastination or memory manipulation. It cannot explain the Chair's *current* sincere denial while avoiding the notebooks.
  2.  **The Freudian Topography:** *Deceiver = Unconscious; Victim = Conscious Ego.*
      *   *Rejection:* This solves the dynamic paradox (the conscious self doesn't know the intention) but destroys Job 2. If the deceiver is unconscious, the conscious agent cannot be blamed for the deception. It makes self-deception something that *happens* to you, not something you *do*.
  3.  **The Modular Committee:** *Deceiver = Module A; Victim = Module B.*
      *   *Rejection:* This risks eliminating the subject entirely. If Module A deceives Module B, where is the "person" responsible? This leads to the elimination of the unified subject required for moral culpability. It turns the Chair into a battlefield, not an agent.

  ***

  ### Structured Audit: The Interpersonal Analogy in Self-Deception

  **1. The Correspondence Table**
  To assess the analogy, we must make its mappings explicit. Here is the standard interpersonal deception (IPD) model transposed onto self-deception (SD).

  | Feature | Interpersonal Deception | Self-Deception (Standard Model) |
  | :--- | :--- | :--- |
  | **Deceiver** | Distinct Agent A | Motivating Sub-system / Strategic Self |
  | **Victim** | Distinct Agent B | Belief-forming System / Epistemic Self |
  | **The Lie** | Proposition *p* asserted as true | False Belief *p* adopted |
  | **Channel** | Communication (speech/text) | Attention / Evidence Gating |
  | **Motive** | Gain at Victim's expense | Anxiety reduction / Status preservation |
  | **The Tell** | Inconsistency in Agent A's behaviour | Action vs. Avowal mismatch |
  | **Success** | Victim believes *p* | Subject sincerely avows *p* |

  **2. Disanalogies: Job 1 (Possibility & Paradoxes)**
  The analogy is primarily recruited to solve the static and dynamic paradoxes. Does it succeed?

  *   **The Static Paradox (Belief Contradiction):** IPD requires two distinct belief sets. SD requires one mind holding *p* and *not-p*. The analogy *relabels* this contradiction as "partitioning" but does not explain the architecture. In IPD, A knows *not-p* and B believes *p*. In SD, if the "Deceiver Self" knows *not-p*, does the subject know *not-p*? If yes, the static paradox remains. If no, we have merely posited a homunculus (a little person inside) who knows the truth, which regresses the problem.
  *   **The Dynamic Paradox (Intention Transparency):** In IPD, the deceiver must hide the intention to deceive. In SD, if the subject intends to deceive themselves, they must know the truth to hide it. The analogy hides this by assigning the intention to the "Deceiver Sub-system." However, this merely relocates the paradox: How does the sub-system form the intention without the system knowing? The analogy assumes partitioning is possible without proving it is coherent.

  **3. Disanalogies: Job 2 (Agency & Blame)**
  This is the critical failure point for your paper on the Department Chair.

  *   **Divergence of Interest:** In IPD, interests diverge (A benefits, B loses). In SD, the system is ostensibly unified. Why would a single agent's machinery work against its own epistemic integrity? To preserve blame, you need the Chair to be the author of the deception. If the "Deceiver" is a sub-personal drive (e.g., fear of scandal), the Chair is merely the locus of conflict, not the agent.
  *   **Access to Evidence:** In IPD, the victim lacks access to the deceiver's evidence. In the Chair case, the notebooks are available. The deception relies on *avoidance*. The analogy imports a "channel" (attention) that the victim supposedly cannot monitor. But if the Chair controls her attention, she is complicit. If she does not control it (it is a "spam filter"), she is not culpable.
  *   **Independent Confirmation:** In IPD, we can verify A's belief and B's belief independently. In SD, we infer the "hidden belief" (*not-p*) solely from the avoidance behaviour. This risks circularity: "She avoids the notebooks because she believes *not-p*; she believes *not-p* because she avoids the notebooks."

  **4. Disanalogies: Merely Colourful**
  *   **Physical Separation:** The skull boundary is irrelevant to the logic of deception, though it matters for the mechanism of information transfer.
  *   **Linguistic Assertion:** Self-deception rarely involves explicit inner speech ("I will now lie to myself"). It operates via salience and attention.

  **5. The Supervisor's Spam-Filter Variant**
  Your supervisor proposes a sub-personal gating system (spam filter) to avoid homunculi.
  *   **Effect on Paradoxes:** This dissolves the Dynamic Paradox effectively. A spam filter does not *intend* to deceive; it causally blocks data. No intention means no transparency problem.
  *   **Effect on Blame (Job 2):** This is catastrophic for your culpability claim. If the Chair's mind has a faulty spam filter, she is not a liar; she is malfunctioning. You cannot blame a person for a sub-personal glitch any more than you can blame them for a visual illusion. This variant saves the possibility of SD (Job 1) by sacrificing the agency required for blame (Job 2). It turns the Chair into a patient, not an agent.
  *   **Relocation:** It relocates the Static Paradox: How does the filter know what to block? If it scans for "threatening content," it must represent that content to identify it. If it represents it, the system "knows" the truth it is blocking. The paradox resurfaces at the level of the filter.

  **6. "Part of Her Believes": Explanation or Redescription?**
  Claiming "part of her believes *not-p*" is a redescription unless backed by independent behavioural criteria. In split-brain patients, we have two distinct streams of action. In the Chair, we have one agent avoiding evidence and avowing innocence. To say "part of her knows" is just to say "her avoidance behaviour suggests sensitivity to the truth." It adds no explanatory power unless you can specify the mechanism without invoking a homunculus.

  **7. A Better Analogy: Wilful Blindness (The Lawyer)**
  The interpersonal analogy is too strong; it posits active fabrication. A better model is **Wilful Blindness** (legal *conscious avoidance*).
  *   **The Analogy:** A lawyer who suspects a client is guilty but refuses to ask the confirming question to maintain plausible deniability.
  *   **Why it works:** It captures Job 2 (Blame) without requiring Job 1's impossible state (simultaneous belief). The Chair does not need to believe *p* and *not-p*. She needs to *suspect* *not-p* and *act* to prevent that suspicion from becoming belief.
  *   **Agency:** This is an intentional action (avoiding the notebooks), not a sub-personal glitch. She is culpable for the avoidance, not for the resulting false belief. The deception is a byproduct of the avoidance, not the direct object of intention. This bypasses the Dynamic Paradox (she intends to avoid, not to believe falsely) and preserves Blame (avoidance is voluntary).

  **8. The Crucial Empirical Finding**
  *   **Strengthening the Interpersonal Picture:** Evidence of distinct neural pathways for "avowal" vs. "action-guiding belief" that operate independently in real-time in neurotypical brains (analogous to split-brain phenomena but without lesion). If we could show the motor system reacts to *not-p* while the speech system avows *p* via distinct, non-communicating architectures, the "two parties" model gains traction.
  *   **Damaging the Interpersonal Picture:** Evidence that "self-deceptive" behaviour correlates perfectly with general cognitive bias mechanisms (e.g., confirmation bias, availability heuristic) without distinct gating architecture. If SD is just standard reasoning bias amplified by motivation, the "deceiver/victim" structure is a myth. There is only one system doing its job poorly under stress.

  **9. Unsettled vs. Confident**
  *   **Confident:** The interpersonal analogy, if taken literally (two agents in one head), destroys the unity of subject required for moral blame (Job 2). If the deceiver is sub-personal, the agent is not responsible.
  *   **Unsettled:** Whether a "partitioned mind" model can be formulated that preserves enough unity for blame while allowing enough separation to solve the static paradox. Some argue for "quasi-beliefs" or "aliefs," but the ontological status of these states remains debated.
  *   **Confident:** Your housemate's clinical objection (anosognosia) is a category error if used to dismiss SD. Anosognosia is brute malfunction (Job 2 fails). SD is motivated avoidance (Job 2 holds). The distinction lies in the *history* of the state, not just the current neurology.

  **Conclusion for the Paper**
  Do not argue that the Chair *believes* what she denies. Argue that she *managed her evidence* to ensure she wouldn't believe the truth. The interpersonal analogy is a trap; it forces you into paradoxes of belief. Shift the focus to the **action of avoidance**. The deception is not in the belief state; it is in the conduct. This secures culpability without requiring a impossible architecture of mind.
