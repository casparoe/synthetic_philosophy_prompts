          *   The real trilemma is: (1) Intuition Preservation (Both Low and High verdicts are correct), (2) Semantic Stability (Content of 'knows' is constant), (3) Factivity/Realism (Knowledge is a binary state of the subject).
      *   Let's refine: (A) Low-stakes attributions are true. (B) High-stakes denials are true. (C) 'Knows' expresses a single, stable relation between subject and proposition.
