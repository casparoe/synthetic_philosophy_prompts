answer: |-
  ### I. Purpose and Division

  The two jobs you specify—regulating action and regulating speech—are **one job for one theory**. A theory of knowledge that separates the conditions for *being* a knower from the conditions for *treating* oneself as a knower in practical reasoning fractures the concept. If the semantic content of "knows" diverges from the normative threshold for practical reasoning, the word "knowledge" ceases to do the work you require: it no longer marks the boundary of safe reliance.

  However, the *requirements* divide into two categories: **Semantic Constraints** (what the sentence says) and **Epistemic-Normative Constraints** (what licenses the subject). These are not separate theories but distinct adequacy conditions on a single account. The division is a finding, not a convenience: the phenomena of embedding (12) and disagreement (Distinction 5) pull toward semantics, while the phenomena of action (1, 4, 8) pull toward norms. A theory that satisfies one set but violates the other fails the dual purpose.

  ### II. The Desiderata (Converted from Phenomena)

  1.  **Stakes Sensitivity:** The theory must explain why knowledge attributions vary with practical stakes holding evidence and truth constant (from 1).
  2.  **Salience Discrimination:** The theory must distinguish stakes-driven shifts from error-salience shifts, or provide a unified mechanism for both (from 2).
  3.  **Modal Constraint:** The theory must explain why statistical/lottery evidence fails to yield knowledge even when stakes are low (from 3).
  4.  **Stakes Accessibility:** The theory must specify whose stakes count (subject, attributor, user) and ensure these stakes are accessible to the agent if knowledge is to guide action. If stakes are objective and hidden, the theory must explain how the action-guiding role is preserved (from 4).
  5.  **Error Symmetry:** The theory must specify whether the standard shifts symmetrically for false positives and false negatives, or tracks only one direction of risk (from 5).
  6.  **Evidential Floor:** The theory must state whether there is a minimum evidential threshold below which stakes cannot lower the bar for knowledge (from 3 & 6).
  7.  **Stakes Ownership:** The theory must resolve whose practical situation sets the standard when the subject, attributor, and end-user diverge (from 4 & 7).
  8.  **Diachronic Stability:** The theory must explain whether knowledge status changes retroactively when stakes change, or only prospectively, and how memory preserves warrant across stake-shifts (from 8).
  9.  **Propositional Isolation:** The theory must determine whether stakes attached to proposition *q* or unrelated decisions raise the bar for knowing *p* (from 9).
  10. **Normative Parity:** The theory must state whether moral stakes function identically to prudential stakes in raising the epistemic bar (from 10).
  11. **Iterability:** The theory must accommodate second-order knowledge attributions without generating paradox or infinite regress (from 11).
  12. **Compositional Semantics:** The theory must explain how "knows" functions within conditionals, negations, and attitude reports without losing its operative context (from 12).

  ### III. Distinctions Not to Collapse

  1.  **Knowing vs. Reasonable to Act:** A theory that defines knowledge *as* rational action merely redescribes decision theory in epistemic vocabulary. It must explain why the epistemic status *grounds* the rationality.
  2.  **Knowing vs. Assertible:** Knowledge may be the norm of assertion, but not all assertible content is known, and not all knowledge is assertible in every context.
  3.  **Standard Moving vs. Epistemic Position Moving:** The theory must distinguish between the *threshold* for knowledge rising (contextualism/relativism) and the *subject's position* deteriorating (SSI).
  4.  **Knowing vs. Gradable Position:** "Knows" is typically binary; "well-positioned" is gradable. The theory must not reduce knowledge to a high degree of justification.
  5.  **Disagreement vs. Talking Past:** The theory must explain whether a low-stakes attributor and high-stakes denier contradict each other or speak different languages.
  6.  **Error vs. Systematic Falsehood:** The theory should not imply that ordinary speakers are systematically wrong about the extension of "knows" unless forced by stronger constraints.

  ### IV. Status Sort: Load-Bearing vs. Smuggled Preferences

  **Load-Bearing (Legitimate Constraints):**
  *   **Norm Usability:** (From "a norm must be usable by the agent"). If knowledge guides action, the agent must be able to determine if she meets the condition. This is entailed by your fixed purpose.
  *   **Compositional Semantics:** (From "expression must behave identically in every embedding"). Logic requires that operators function consistently across embeddings.
  *   **Speaker Verdicts as Data:** (From "ordinary speakers' verdicts are data"). While defeasible, a theory that contradicts all ordinary usage without explanation fails to capture the concept.

  **Smuggled Preferences (Methodological Commitments):**
  *   **Evidence Invariance:** (From "knowledge cannot be lost without a change in evidence"). This is **Invariantism**. It is a theoretical commitment, not a datum. SSI explicitly rejects this to save the stakes intuition. It is a cost, not a veto.
  *   **Factor Accessibility:** (From "knowledge cannot depend on factors the subject could not know about"). This is **Internalism**. While linked to "Norm Usability," externalists argue reliability matters more than access. However, given your *action-guiding* purpose, this becomes load-bearing: an agent cannot use a norm dependent on unknown facts.
  *   **Non-Revisionism:** (From "semantic account must not be revisionary"). Charity is a virtue, but a theory may correct ordinary usage if it explains *why* the usage is misleading. This is a preference for conservatism, not a requirement of truth.

  ### V. The Trilemma

  You are correct. There is a three-way trade among:
  1.  **Low-Stakes Truth:** Ordinary low-stakes knowledge attributions are true.
  2.  **High-Stakes Truth:** Ordinary high-stakes knowledge denials are true.
  3.  **Semantic Stability:** "Knows" expresses a single, context-invariant relation between subject and proposition.

  **The Trade:**
  *   **Contextualism** buys (1) and (2) by sacrificing (3). It claims the relation shifts with the attributor's context.
  *   **Traditional Invariantism** buys (3) by sacrificing (1) or (2). It claims one set of speakers is in error (usually the low-stakes attributors are speaking loosely).
  *   **Subject-Sensitive Invariantism (SSI)** buys (1) and (3) by redefining the relation to include stakes, effectively sacrificing the intuition that evidence alone determines epistemic position (making (2) true because the subject's *practical* position changed, not just the standard).
  *   **Relativism** modifies the truth predicate itself, keeping (1) and (2) relative to assessors, but sacrificing the idea of a proposition having a truth-value simpliciter.

  This is a genuine trilemma, not an artefact. You cannot have stable content, variable truth-values across contexts, and a single subject-relation without altering the metaphysics of knowledge or truth.

  ### VI. The Most Exclusionary Requirement

  **The Action-Guiding Accessibility Constraint.**
  This requirement states that if knowledge norms action, the subject must be able to access the conditions that constitute knowledge.
  **Why this one?** Most debates focus on semantic data (verdicts, embeddings). But your purpose explicitly demands the theory state when a subject may *treat a proposition as a reason*. If the theory posits that hidden, objective stakes (unknown to the subject) destroy knowledge (as in Objective SSI), the subject cannot use the norm to guide action. She cannot know whether she knows. This requirement eliminates any view that makes knowledge depend on facts outside the subject's cognitive reach, which includes many versions of SSI and Relativism. It is more exclusionary than semantic constraints because it attacks the *function* of the concept, not just its linguistic expression.

  ### VII. Failures of the Five Approaches

  **Contextualism:** Fails the **Action-Guiding Constraint**. The subject often does not know the attributor's context (standards). If the standard shifts with the attributor, the subject cannot determine if she knows, and thus cannot use "I know" to license her own action reliably. It also struggles with **Disagreement**, implying high and low stakes speakers talk past each other.

  **Subject-Sensitive Invariantism (SSI):** Fails the **Accessibility Constraint** (on objective stakes versions). If my knowledge depends on stakes I am unaware of (Hidden Stakes), I cannot use my knowledge status to regulate my reasoning. It also faces the **Evidence Invariance** cost, requiring us to accept that epistemic position changes without evidence change.

  **Attributor-Sensitive Invariantism:** Fails the **Action-Guiding Constraint** catastrophically. Why should *my* practical stakes determine whether *you* may act on your evidence? It severs the link between the subject's epistemic position and her practical license. It also struggles with **Embedding**, as the attributor's context is hard to bind in conditionals.

  **Relativism:** Fails the **Diachronic Stability** and **Action-Guiding** constraints. If truth is relative to a later assessor, the subject cannot know now if she will be judged to have known later. It makes knowledge retrospective, undermining its role in prospective decision-making.

  **Contrastivism:** Fails **Stakes Sensitivity** directly. It explains variation by shifting the contrast class (knowing *that p* vs. *q*), not the stakes. It struggles to explain why stakes shift the contrast class without appealing to the very pragmatic factors it tries to semanticize, and often fails **Embedding** tests regarding which contrast is operative.

  ### VIII. Sketch of a Successful View

  A view satisfying the list would likely be a **Subject-Sensitive Invariantism with an Accessibility Clause**. It must treat stakes as part of the epistemic relation (preserving Stability and Verdicts) but restrict relevant stakes to those the subject is aware of or reasonably should be aware of (preserving Accessibility). It would need a semantic account that allows "knows" to embed uniformly while acknowledging that the *warrant* for assertion shifts with the subject's practical environment, distinguishing the binary state of knowledge from the gradable warrant for reliance.
