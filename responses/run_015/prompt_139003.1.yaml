      *   Candidate: **Semantic Compositionality.** Kills crude pragmatic accounts.
      *   *Selection:* **The Non-Collapse of Epistemic Status and Practical Rationality.** If a theory just says "Knowledge = Rational to Act," it's not epistemology, it's decision theory. The theory must explain why *epistemic* terms track this.
