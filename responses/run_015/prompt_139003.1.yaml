      *   4 (Hidden) and 7 (Third-party) are about *Stakes Attribution*. Merge into **Stakes Specification**.
      *   10 (Moral) is a specific instance of 1 (Stakes), but distinct enough to require **Normative Parity**.

  4.  **Distinctions Not to Collapse:**

      *   Knowing vs. Reasonable to Act (The "Redescription" worry).
      *   Knowing vs. Assertible.
      *   Standard Moving vs. Epistemic Position Moving.
      *   Knowing vs. How Well Positioned (Gradability).
      *   Disagreement vs. Talking Past.
      *   Error vs. Systematic Falsehood.

  5.  **Sorting Requirements (Load-bearing vs. Smuggled Preferences):**

      *   *Load-bearing:* Must explain the data (1-12), must guide action, must guide speech.
      *   *Smuggled:*
          *   "Knowledge cannot be lost without evidence change": This is *Invariantism*. It's a theoretical commitment, not a datum.
          *   "Knowledge cannot depend on unknown factors": This is *Internalism*.
          *   "Expression must behave identically in every embedding": This is *Semantic Uniformity* (Contextualists deny this).
          *   "Ordinary speakers' verdicts are data": This is *Methodological*. Actually, some theories (Error Theory) say verdicts are output to be explained/corrected.
          *   "Norm must be usable": *Guidance Constraint*.
          *   "Semantic account must not be revisionary": *Charity Constraint*.
      *   *Adjudication:* The prompt asks me to adjudicate. I need to decide which are legitimate constraints on a *successful* theory vs. which are partisan shields.
      *   *Decision:* "Evidence change" is a partisan shield (SSI rejects it). "Unknown factors" is a serious constraint (Action-guiding requires accessibility). "Embedding" is a semantic constraint (Logic requires it). "Speaker verdicts" are data, but not infallible. "Revisionary" is a cost, not a veto.

  6.  **The Trilemma (Incompatibilities):**

      *   The prompt suspects a trilemma: Low-stakes Truth + High-stakes Truth + Same Relation.
