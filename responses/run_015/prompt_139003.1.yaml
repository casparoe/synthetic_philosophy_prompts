      *   **Task 4 (Crucial):** Sort requirements by status (Load-bearing vs. Smuggled Preferences/Methodological Commitments). Adjudicate specific commitments (e.g., "knowledge cannot be lost without evidence change," "ordinary speakers' verdicts are data").
      *   **Task 5:** Identify incompatibilities (Trilemma?). Specifically: Low-stakes truth vs. High-stakes truth vs. Same Relation. Explain what each view gives up.
      *   **Task 6:** Nominate the single most exclusionary requirement.
      *   **Task 7:** Briefly note where each of the 5 opening approaches (Contextualism, Subject-Sensitive Invariantism (SSI), Attributor-Sensitive Invariantism, Relativism, Contrastivism) fails the list.
      *   **Task 8:** Sketch what a successful view would look like (if none exist).
      *   **Tone/Style:** Philosophical, precise, rigorous, no fluff. "Write the desiderata."

  2.  **Deconstruct the Purpose (Action vs. Speech):**

      *   *Question:* Are these two jobs for one theory?
      *   *Analysis:* If knowledge is the norm of action *and* the norm of assertion/attribution, they are linked. However, the *semantics* of "knows" might differ from the *normative status* required for action. Contextualists often separate the semantic content from the practical rationality. Invariantists often link them tightly.
      *   *Decision:* It is one theory with two applications, *unless* the semantic content of "knows" diverges from the normative threshold for action. If they diverge, we have two concepts sharing a word. For the purpose of this dispute (pragmatic encroachment), the core claim is that the *epistemic* status itself shifts or is sensitive. Therefore, the desiderata should demand a unified account unless the theory explicitly argues for a split (which counts as a cost). Let's treat it as a single theoretical target: The Theory of Knowledge Attribution and Regulation.
      *   *Division:* If a division exists, it's between *Truth Conditions* (Semantics) and *Warrant Conditions* (Epistemology/Pragmatics). But the prompt asks if the requirements divide. Some requirements (Embedding) are semantic. Some (Action-guiding) are normative. A successful theory must map one onto the other.

  3.  **Process the 12 Phenomena into Requirements:**

      1.  *Baseline Stakes:* **Stakes Sensitivity.** Theory must explain why attribution varies with stakes holding evidence constant.
      2.  *Skeptical Contexts:* **Error Salience Distinction.** Theory must distinguish stakes-driven shifts from salience-driven shifts (or unify them).
      3.  *Lottery/Statistical:* **Modal Strength Constraint.** Theory must explain why high probability isn't enough, independent of stakes. (Merge with 6?).
      4.  *Hidden Stakes:* **Stakes Accessibility.** Whose stakes? Objective vs. Subjective. If objective, how does it guide action?
      5.  *Asymmetric Costs:* **Directional Sensitivity.** Does the bar rise for false positives only, or false negatives too?
      6.  *The Floor:* **Evidential Minimum.** Is there a floor below which stakes don't lower the bar? (Merge with 3).
      7.  *Deferred/Third-Party:* **Stakes Ownership.** Whose stakes count? Subject, Attributor, User?
      8.  *Diachronic/Memory:* **Temporal Stability.** Can knowledge status change retroactively or just prospectively?
      9.  *Leakage:* **Propositional Isolation.** Do stakes on *q* affect knowledge of *p*?
      10. *Moral Encroachment:* **Moral/Prudential Parity.** Are moral stakes treated like prudential stakes?
      11. *Second-Order:* **Iterability.** Can the theory handle "I know that I don't know"?
      12. *Embedding:* **Compositional Semantics.** How does "knows" behave in conditionals/negation?

      *Merging/Dropping:*
      *   3 (Lottery) and 6 (Floor) are related (evidential baselines). Keep distinct: Lottery is about modal profile, Floor is about stakes dropping to zero.
