answer: |-
  To map the conflict between Evidential Decision Theory (EDT) and Causal Decision Theory (CDT) in large worlds onto the formalism of statistical mechanics, we must treat the ensemble of agents as a thermodynamic system composed of $N$ identical subsystems. In this analogy, each agent corresponds to a particle or lattice site, and the decision to Cooperate ($C$) or Defect ($D$) corresponds to the spin state or occupation number of that site. The "Large World" scenario implies $N \to \infty$, or at least $N \gg 1$, where the agents are structurally identical, sharing the same physical laws, initial conditions, and decision algorithms.

  ### 1. Evidential Cooperation as Global Symmetry Preservation

  In statistical mechanics, a system of identical particles is governed by a Hamiltonian that respects permutation symmetry; the physics remains invariant under the exchange of any two particles. In the context of large-world decision problems, this permutation symmetry corresponds to the logical identity of the agents. If Agent $i$ and Agent $j$ are identical in all causally relevant respects, their decision functions are mathematically isomorphic.

  EDT endorses cooperation by treating the agent's decision as a sample from the global distribution of the ensemble's behavior. When an EDT agent calculates expected utility, they condition on their action $A$. Because they recognize their structural identity with the rest of the ensemble, $P(\text{Others} = C \mid \text{Me} = C) \approx 1$.

  This reasoning preserves the **global symmetry of the ensemble state**. By choosing $C$, the EDT agent effectively selects a macrostate where the order parameter (the fraction of cooperators) is uniform across the system. The agent does not view their decision as a local perturbation but as a determination of the global configuration. In thermodynamic terms, EDT maximizes a global utility function analogous to minimizing the free energy of the entire system, respecting the constraint that identical subsystems in identical environments must occupy identical states. The correlation between agents is treated as a rigid constraint derived from the symmetry of the underlying "source code" or physical laws, much like the correlations in a Bose-Einstein condensate where particles occupy the same quantum state due to indistinguishability.

  ### 2. Causal Refusal as a Local-Field Constraint

  CDT refuses cooperation by insisting that an agent's causal power is limited to their immediate light cone. In the statistical mechanical analogy, this functions precisely as a **local-field constraint**. In a local quantum field theory, the Lagrangian density $\mathcal{L}(x)$ depends only on the field $\phi(x)$ and its derivatives at point $x$, not on $\phi(y)$ for spacelike separated $y$. Commutators vanish outside the light cone, prohibiting non-local influence.

  Similarly, CDT imposes a constraint on the utility gradient. The CDT agent evaluates the causal derivative $\frac{\partial U}{\partial A_{local}}$. They assert that $\frac{\partial A_{remote}}{\partial A_{local}} = 0$ for causally disconnected agents. Even if statistical correlation exists ($P(\text{Others}=C \mid \text{Me}=C) \approx 1$), CDT treats this as a "spurious" correlation akin to a common-cause confounder that cannot be leveraged by intervention.

  Consequently, the CDT agent optimizes a local Hamiltonian. They maximize their local payoff given the fixed background field of the other agents' actions. This treats the ensemble not as a unified symmetric system, but as a collection of isolated sites where the state of site $i$ is dynamically independent of site $j$. The demand for local causal efficacy prohibits the "non-local" updating of probabilities that EDT permits. Just as a local field theory forbids action-at-a-distance, CDT forbids decision-at-a-distance, rendering the global symmetry of the ensemble irrelevant to the local optimization procedure.

  ### 3. Symmetry Breaking in the Causal Framework

  The prompt asks whether CDT corresponds to symmetry breaking. This requires precise distinction. If all agents follow CDT and all defect, the resulting *outcome* is symmetric (all $D$). However, the **reasoning process** of the CDT agent constitutes an epistemic symmetry breaking.

  In the CDT framework, the deciding agent treats themselves as a privileged locus of control. They vary their own action as a free parameter while holding the actions of identical copies fixed as background constants. This breaks the permutation symmetry of the *deliberative model*. The agent effectively posits: "I am the only variable; the rest of the ensemble is fixed."

  In statistical mechanics, spontaneous symmetry breaking occurs when the ground state of the system possesses less symmetry than the Hamiltonian. Here, the "Hamiltonian" (the logical structure of the situation) dictates that all agents are identical. However, the CDT "ground state" (the chosen strategy) relies on an asymmetry in agency: *My* choice is an intervention; *their* choice is a fact. This introduces a distinction between the observer-agent and the observed-agents that is not present in the physical description of the ensemble. Thus, CDT imposes a symmetry breaking on the epistemic access to the system: the agent treats their own node in the network as causally potent and all other identical nodes as causally inert relative to their will.

  ### 4. Points of Analogy Success

  The analogy succeeds in clarifying the structural divergence between the two theories regarding **correlation and constraint**.

  1.  **Ensemble Statistics:** EDT correctly identifies that in a large world of identical agents, the relevant variable for utility maximization is the macrostate (the distribution of $C$ vs $D$), not the microstate of a single agent. This aligns with statistical mechanics, where thermodynamic quantities depend on the ensemble average, not the trajectory of a single particle.
  2.  **Non-Locality of Logic:** The EDT correlation is logically non-local but physically local. This maps well to quantum entanglement, where measurement outcomes are correlated across spacelike separation without signal transmission. EDT treats the logical connection between identical algorithms similarly to how quantum mechanics treats the wavefunction of identical particles: a single mathematical object describing multiple locations.
  3.  **Local Realism:** CDT's stance mirrors Bell's "local realism." It insists that physical outcomes at one location must be determined by local variables and past light-cone events. The CDT rejection of evidential cooperation is structurally identical to the rejection of non-local hidden variables; it refuses to allow the "setting" at one wing of the experiment to depend on the "setting" at the other, even if statistics suggest they match.

  ### 5. Points of Analogy Collapse

  The analogy collapses when addressing **normativity, agency, and the nature of the correlation**.

  1.  **Descriptive vs. Prescriptive:** Statistical mechanics is descriptive; it predicts what a system *will* do. Decision theory is prescriptive; it dictates what an agent *ought* to do. In stat mech, if particles are identical, they *must* behave identically (barring stochastic divergence). In decision theory, the agent has the capacity to "break" the logical symmetry by choosing a strategy that, if universalized, would be suboptimal. The physics analogy cannot easily accommodate the possibility of an agent choosing a rule that contradicts their own structural identity.
  2.  **The Nature of the Link:** In stat mech, correlations are mediated by physical interactions or common physical history. In the large-world decision problem, the correlation is **logical** or **mathematical**. It arises because the agents are instantiations of the same abstract function. A local-field constraint in physics prohibits physical influence. CDT prohibits causal influence. However, EDT relies on *logical* influence. There is no direct physical analog for "logical causation" in standard field theory. Treating logical identity as a physical coupling constant risks category errors; the "force" binding the agents is the law of identity ($A=A$), not a gauge field.
  3.  **Counterfactual Structure:** CDT relies on a specific topology of counterfactuals (surgical intervention on a causal graph). Stat mech relies on probability distributions over phase space. While one can formulate path integrals that look like decision problems, the "intervention" in CDT (setting a variable to a value while keeping others fixed) has no clean analog in equilibrium statistical mechanics, where variables are coupled by the partition function. In the ensemble view, you cannot vary one particle's state without altering the probability weight of the entire configuration if the particles are truly indistinguishable. CDT attempts to do exactly this, which is why the analogy strains: CDT treats identical particles as distinguishable by virtue of their causal isolation.

  ### Conclusion

  Through the lens of statistical mechanics, Evidential Decision Theory in large worlds operates as a **global symmetry principle**, enforcing the indistinguishability of identical agents to maximize a global utility functional. It treats the ensemble as a unified thermodynamic system where local states are constrained by the global order parameter.

  Causal Decision Theory operates as a **local-field constraint**, prohibiting non-local dependencies in the utility gradient. It enforces a form of causal locality that requires the agent to treat their own decision as an independent intervention, thereby epistemically breaking the permutation symmetry of the ensemble.

  The analogy succeeds in illuminating why EDT agents cooperate (preserving the statistical integrity of the ensemble) and why CDT agents defect (optimizing local energy under a locality constraint). It collapses, however, on the ontological status of the connection between agents: physical systems are bound by dynamical laws, whereas decision-makers in this context are bound by logical identity, a modality that permits normative deviation from physicalistic prediction. The CDT agent acts as though they are a symmetry-breaking impurity in a crystal lattice, asserting a local causal power that the global symmetry of the "large world" suggests they do not uniquely possess.
