prompt: |-
  I am a retired physicist who has only recently begun to study philosophy, and I have become absorbed by the problem of evidential cooperation in large worlds. By this I mean the situation, familiar from evidential decision theory, in which an agent expects her choice to correlate with those of many causally disconnected but structurally identical copies of herself, so that her decision carries evidential weight about outcomes elsewhere in the ensemble. I wish you to compare the evidential-decision-theoretic endorsement of cooperation in such worlds with the causal-decision-theoretic refusal to cooperate, but I want the comparison conducted through a specific analogical lens drawn from statistical mechanics: treat the full ensemble of decision-makers as a system of identical particles subject to symmetry constraints. Precisely identify which aspects of evidential cooperation correspond to the preservation of global symmetry across the ensemble, which correspond to its breaking, and whether the causal theorist's demand for local causal efficacy functions structurally like a local-field constraint that prohibits non-local correlations. Do not provide a bibliography, a reading list, or citations; I am interested solely in the disciplined conceptual mapping and in the exact points where the analogy succeeds or collapses. Please maintain a formal, analytical tone throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired physicist, new to philosophy, absorbed by "evidential cooperation in large worlds."
      *   **Topic:** Comparison of Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT) regarding cooperation in large worlds (many identical copies).
      *   **Specific Lens:** Statistical Mechanics analogy (ensemble of decision-makers as identical particles subject to symmetry constraints).
      *   **Key Questions to Address:**
          *   Which aspects of EDT cooperation correspond to preserving global symmetry?
          *   Which aspects correspond to symmetry breaking?
          *   Does CDT's demand for local causal efficacy function like a local-field constraint prohibiting non-local correlations?
          *   Where does the analogy succeed?
          *   Where does the analogy collapse?
      *   **Constraints:** No bibliography, no reading list, no citations. Formal, analytical tone.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Large Worlds:* Scenarios (like the "Many-Worlds" interpretation or infinite cosmological models) where there are many subjectively identical agents facing the same decision problem.
      *   *EDT:* Agents reason that their choice provides *evidence* about what other identical agents will choose. If I cooperate, it's likely they cooperate. Total utility is high. Therefore, cooperate.
      *   *CDT:* Agents reason that their choice cannot *cause* changes in causally disconnected copies. My choice is fixed locally. Whatever the others do is independent of my causal lever. Therefore, defect (standard Prisoner's Dilemma logic).
      *   *The Conflict:* EDT sees a correlation that matters for utility maximization. CDT sees a lack of causal power that renders the correlation irrelevant to the *act* of choosing.

  3.  **Develop the Statistical Mechanics Analogy:**
      *   *System:* The ensemble of agents.
      *   *Particles:* Individual agents.
      *   *State:* The decision (Cooperate/Defect).
      *   *Symmetry:* The structural identity of the agents (same physics, same information, same algorithm).
      *   *Global Symmetry:* The state of the ensemble where all particles behave identically (all C or all D).
      *   *Local Field/Constraint:* The causal boundary limiting influence to the light cone.

  4.  **Map EDT to Symmetry Preservation:**
      *   In Stat Mech, identical particles in identical conditions are often treated as indistinguishable or governed by a wavefunction that respects permutation symmetry (Bose-Einstein or Fermi-Dirac statistics, though here it's more about logical identity).
      *   EDT treats the decision as a logical fact about the *type* of agent, not just the *token*.
      *   Choosing "Cooperate" is asserting that the *law* governing the agent dictates Cooperation.
      *   This preserves the symmetry of the ensemble: If I am identical to them, and I choose C, they must choose C. The global state remains uniform (symmetric).
      *   Utility is a function of the *global state* (total welfare), not just local payoff. Maximizing global utility requires maintaining the correlation (symmetry).

  5.  **Map CDT to Symmetry Breaking / Local Constraints:**
      *   CDT insists on causal isolation.
      *   In physics, this looks like a "local realism" constraint.
      *   CDT treats the agent as a localized source of causal power. "I can only move *my* piece."
      *   This effectively breaks the global symmetry by treating the deciding agent as a privileged locus of control (a "symmetry breaking" event where *this* particle's state is fixed by will, while others are fixed by... something else independent).
      *   Actually, a better analogy might be: CDT imposes a *causal horizon*. It forbids the "non-local" update.
      *   Does CDT break symmetry? Or does it enforce a *local* constraint that prevents the global symmetry from being a relevant variable for the *decision function*?
      *   Refinement: CDT treats the correlation as a "spurious" statistical artifact relative to causal intervention. In Stat Mech, this is like ignoring the partition function's global constraints and focusing only on local Hamiltonian terms.
      *   Let's align with the prompt's specific suggestion: "local-field constraint that prohibits non-local correlations."
      *   CDT says: $\frac{\partial Utility}{\partial MyAction}$ only counts direct causal paths.
      *   Analogy: A local field theory where the Lagrangian density at point $x$ depends only on fields at $x$ and derivatives, not on fields at $y$ (spacelike separated).
      *   EDT allows "non-local" dependence (logical correlation).

  6.  **Analyze Successes of the Analogy:**
      *   *Indistinguishability:* Captures the "identical copies" premise well.
      *   *Macrostate vs. Microstate:* EDT cares about the Macrostate (total cooperation rate). CDT cares about the Microstate manipulation (flipping my bit).
      *   *Correlations:* Quantum entanglement or statistical correlation in equilibrium maps well to the logical correlation EDT relies on.
      *   *Optimization:* Maximizing entropy (global) vs. minimizing local energy.

  7.  **Analyze Collapses of the Analogy:**
      *   *Normativity vs. Descriptivity:* Stat Mech describes what *is*. Decision Theory prescribes what *ought* to be done.
      *   *Agency:* Particles don't choose. The "symmetry breaking" in physics is usually spontaneous or due to external fields, not a "decision" to violate a constraint.
      *   *Logical vs. Physical:* The correlation in EDT is *logical* (same source code), not necessarily *physical* (no signal sent). Stat Mech deals with physical correlations. While logical supervenes on physical, the *mechanism* of correlation differs (mathematical identity vs. dynamical interaction).
      *   *Counterfactuals:* CDT relies on specific counterfactuals (if I did X, would Y happen?). Stat Mech deals with probabilities over ensembles, not necessarily counterfactual interventions in the Pearl sense.

  8.  **Drafting the Response (Iterative refinement for tone and precision):**
      *   *Tone:* Formal, analytical, respectful of the user's physics background.
      *   *Structure:*
          1.  Introduction: Define the mapping framework.
