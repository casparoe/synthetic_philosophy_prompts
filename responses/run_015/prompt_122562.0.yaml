answer: |-
  **JOINT STATEMENT ON PRECOMMITMENT AND THE ORPHEUS CLAUSE**

  **Signatories:** The Diachronic-Autonomy Working Group & The Present-Will Sovereignty Project

  **I. Points of Agreement**

  We, the undersigned, acknowledge that while our normative foundations differ, we share a common analysis of the mechanics and consequences of constitutional precommitment devices, specifically regarding the specimen "Orpheus Clause."

  1.  **The Necessity of Third Parties:** We agree that clause (iv), granting enforcement power to ordinary courts, demonstrates that no political precommitment is purely self-enforcing. A rule without a sailor to hold the mast is merely a diary entry. Whether these courts are viewed as agents of the past self or independent arbiters, their involvement is empirically necessary for the bind to hold.
  2.  **The Function of the Review Mechanism:** We agree that clause (iii), requiring Citizens' Assembly certification for repeal after year ten, alters the cost of reversal but does not resolve the normative puzzle of binding. It acts as a filter, but whether it filters for *reason* or merely for *current consensus* is contested.
  3.  **Consequences of Invalidity:** We agree that if the Orpheus Clause were struck down by a constitutional court, the policy instrument (the emissions floor price) would revert to the status of ordinary legislation, reversible by simple majority at any time. The economic uncertainty resulting from this reversion is an observable fact, independent of its justification.
  4.  **The Impossibility of Pure Self-Binding:** We agree that a legislature cannot physically prevent its successor from passing a contradictory statute. The "binding" effect is therefore always psychological, institutional, or legal, never physical. The question is solely whether that effect is legitimate.
  5.  **The Risk of Obsolescence:** We agree that any twenty-five-year commitment risks becoming maladaptive if material conditions change radically. The dispute is not over whether change might be necessary, but over who bears the burden of proof when change is requested.

  **II. Residual Disagreements**

  | Claim | Diachronic-Autonomy View | Present-Will View |
  | :--- | :--- | :--- |
  | **Source of Legitimacy** | "The clause is legitimate because it extends the agency of the enacting parliament across time. To allow simple repeal is to privilege a momentary impulse over a considered plan, fracturing the identity of the polity." | "The clause is legitimate only insofar as current citizens acquiesce to it. Legitimacy flows from present consent or third-party reliance, not from the 'will' of a past legislature that no longer exists." |
  | **The 'Dead Hand' Objection** | "This is a category error. The hand is not dead; it is merely distant. We are the same agent as our predecessors, just as I am the same agent who dieted yesterday. To deny this is to deny personal responsibility over time." | "The hand is dead because the people are different. Constituencies shift, knowledge evolves, and voters die. Governance by past majorities is heteronomy, not autonomy, unless the current majority reaffirms the constraint." |
  | **Role of Clause (iii)** | "The Citizens' Assembly serves as the 'rational self' checking the 'impulsive self.' It ensures repeal occurs only when the *reason* for the bond has lapsed, preserving the integrity of the original commitment." | "The Assembly is a proxy for current consent. It makes the clause legitimate not by validating the past, but by ensuring the present population has a structured voice before the bind is broken." |

  **III. The Cruxes**

  We identify two specific cases where our theories diverge sharply on prediction and evaluation. We commit to observing the following outcomes to test our respective claims.

  **1. The Signature Problem (Weakness vs. Learning)**
  *The Challenge:* A well-designed precommitment should defeat later weakness of will but not later learning. However, a legislature seeking repeal will always claim it has "learned" something new, even if it has merely succumbed to pressure.
  *   **Diachronic Prediction:** The Orpheus Clause's review mechanism (iii) will successfully distinguish between preference reversals and factual updates. We predict that repeal attempts blocked by the Citizens' Assembly will correlate with periods of high short-term economic stress (weakness), while successful repeals will correlate with verified technological shifts (learning).
  *   **Present-Will Prediction:** The mechanism cannot distinguish these states. We predict that the Assembly's certification will track current public opinion polls rather than objective factual changes. If the Assembly blocks a repeal during high stress, it is not preserving autonomy but imposing the dead hand's preference over the living population's welfare.
  *   **Testable Outcome:** We will compare the Assembly's stated reasons for certification against independent economic data regarding the emissions floor's impact. If the Assembly certifies repeal despite stable data and high transition costs, the Diachronic view loses explanatory power.

  **2. The Ratchet Case (Restraint on Spending vs. Generosity)**
  *The Challenge:* Contrast a clause restraining a future majority from deficit spending (fiscal brake) with one restraining them from raising foreign aid or carbon prices (generosity brake).
  *   **Diachronic Prediction:** We treat these symmetrically. Both are exercises of diachronic agency. A polity can legitimately bind itself to be generous in the future just as it can bind itself to be frugal. The moral valence of the policy is irrelevant to the legitimacy of the binding.
  *   **Present-Will Prediction:** We treat these asymmetrically. Fiscal brakes often protect third-party creditors who relied on past promises (harm prevention). Generosity brakes prevent future majorities from aiding others or themselves without preventing harm to specific reliance parties. The latter is harder to justify without explicit present consent.
  *   **Testable Outcome:** We will measure public legitimacy ratings for both types of clauses. If the public perceives the "generosity brake" as significantly less legitimate than the "fiscal brake" despite identical procedural entrenchment, it suggests legitimacy relies on harm/reliance (Present-Will) rather than abstract agency (Diachronic).

  **IV. Diagnostic Note: Verbal vs. Substantive**

  We conclude that a portion of our dispute is verbal, specifically regarding the definition of **"The People."**

  *   **The Verbal Dispute:** When the Diachronic view speaks of "the people binding themselves," it refers to a corporate entity persisting through time. When the Present-Will view speaks of "the people," it refers to the current electorate. Much of our disagreement over "governance by the dead" dissolves if we acknowledge we are using different temporal units for political identity.
  *   **The Substantive Question:** Underneath this terminology lies a real conflict about **error correction.** The substantive question is not whether the past self is "real," but whether the institutional hurdles required to overturn past decisions (like the Orpheus Clause) improve or worsen overall social welfare. If the hurdles prevent catastrophic short-termism, the Diachronic mechanism works regardless of metaphysics. If the hurdles prevent necessary adaptation to new moral or factual realities, the Present-Will critique holds regardless of consent theory.

  We agree to submit these claims to empirical scrutiny alongside the journalist's feature. The verdict on which view better describes the law belongs to the readers.
