      *   *Causation vs. Correlation:* The core metaphysical dispute. Does high-level abstraction have causal power over low-level physics? (Downward causation).
      *   *Multiple Realizability:* The same symbol can be realized by different physical states. Does this mean the symbol is causally inert?
      *   *Supervenience:* Mental/symbolic states supervene on physical states. If the physical is fixed, the mental is fixed. But does the mental *do* anything?
      *   *Epiphenomenalism:* The roommate's view risks this (symbols are just shadows).
      *   *Levels of Explanation:* The roommate's defense. Is causation level-relative? (Intentional stance vs. Physical stance).
