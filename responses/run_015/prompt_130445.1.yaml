answer: |-
  Welcome to the Civic Centre, and thank you for being here. Looking around this room, I see a divide that is often described in theoretical terms but is rarely embodied so physically. On one side, we have those who spend their lives analyzing the architecture of democratic justification, and on the other, those who must actually build the shelter, manage the zoning, and care for the congregations that inhabit our shared city. We are here to discuss public reason and the place of religious arguments in politics, a debate that has occupied the best minds of our generation. Usually, when we gather to discuss this, the air is thick with the expectation of resolution. We assume that the goal of democratic dialogue is to make ourselves fully intelligible to one another, to translate our deepest commitments into a shared language that everyone can accept. We operate under the assumption, inherited from the heavyweights of political philosophy, that if a religious citizen cannot translate their reasoning into secular terms, they are somehow failing in their civic duty. We treat opacity as a deficit, a barrier to be overcome by better communication or more rigorous translation.

  I stand before you today both as an academic familiar with that literature and as the daughter of a man who never published a single paper. My father was a town planner. He spent his life looking at maps that showed where people lived, where they prayed, and where they argued over land use. When he passed, he left behind a box of handwritten notes, scribbled on the backs of zoning permits and napkins, proposing an idea he called reciprocal opacity. He argued that democratic respect between secular and religious citizens is not achieved by requiring religious people to translate their commitments into shared secular language. Instead, he believed respect is achieved when both sides accept that certain foundational commitments will remain mutually untranslated and partly opaque. For him, this opacity was not a failure of communication but a form of civic equality. It was a way of saying that I do not need to fully comprehend the source of your conviction to respect your right to hold it, and you do not need to strip your faith of its mystery to stand beside me in the council chamber.

  This concept has moved from the abstract to the urgently personal for me because of a dispute that erupted in our borough just last month. A secular environmental coalition found themselves pitted against a religious housing trust over a parcel of land destined for affordable shelter. I watched the proceedings closely. The environmentalists argued from premises of ecological sustainability and secular utility, while the trust argued from premises of sacred duty and charitable mandate. Both groups assumed the other was simply refusing to speak properly. The secular side felt the religious arguments were opaque obstacles to rational planning, and the religious side felt the secular demands were asking them to betray the very source of their compassion. They spent months trying to translate each other, trying to find a common language that did not exist, and in doing so, they nearly killed the project. They were operating on the belief that agreement requires understanding, when my father's notes suggest that coexistence sometimes requires accepting that we do not understand.

  So, as we begin this workshop, I want to set a specific expectation for what we can and cannot achieve here. We are not here to solve the tension between public reason and religious conviction. We are not here to find a formula that allows faith to enter politics without causing friction. If we leave this room feeling that we have smoothed over the differences, that we have found a way to make everyone speak the same language, then we will have failed. The tension is not a problem to be solved; it is a condition to be inhabited. My father's idea of reciprocal opacity demands that we stop treating our differences as puzzles to be decoded and start treating them as boundaries to be honored. This means that for the philosophers in the room, we must be willing to loosen the grip on the requirement for translatability. It means for the councillors and faith leaders, it means asserting the validity of your commitments without feeling the need to apologize for their inaccessible foundations.

  I am conscious that this leaves us in a difficult position. It asks us to build a democracy on ground that is not fully shared. It asks us to trust neighbors whose ultimate reasons we may never know. That is uncomfortable. It is meant to be. The comfort of shared language is often purchased at the price of excluding those whose voices do not fit the grammar of the state. By embracing reciprocal opacity, we accept that there will be moments when we cannot follow each other's logic, and we agree to proceed anyway. This workshop is not designed to bring us to a consensus on the good life. It is designed to help us negotiate the terms of our disagreement without demanding that anyone cease to be who they are. I invite you to engage with this tension honestly. Do not look for the exit strategy that resolves the conflict. Look instead for the strength to sustain it. Let us begin not by trying to see clearly into one another's souls, but by acknowledging the right to remain partly unseen.
