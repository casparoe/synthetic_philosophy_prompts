answer: |-
  **METAPHYSICS SEMINAR: FINAL EXAMINATION**

  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Instructions:** Answer both parts of the question. Part (a) should be concise. Part (b) requires a sustained argument. Do not refer to specific authors or named thought experiments by name; describe the arguments and positions instead.

  **Question 1**

  (a) Distinguish between the claim that a fully occupied infinite collection can be mapped one-to-one onto a proper subset of itself, and the claim that the members of that collection can physically rearrange themselves to achieve that mapping. Why is this distinction crucial for evaluating whether such a collection can exist in reality? (5 marks)

  (b) A common argument against the existence of actual infinities in the concrete world relies on the absurdity of rearranging an infinite collection (the "Hotel" scenario). However, it is objected that the absurdity lies not in the cardinality of the collection, but in the requirement to complete an unbounded causal process (a "supertask").

  Evaluate this objection. In your answer, you must:
  1.  Assess whether the impossibility, if any, attaches to the *state* of being infinite or the *process* of becoming/shuffling infinite.
  2.  Discuss whether the existence of an endless hierarchy of increasingly larger infinities (via power sets) renders the concept mathematically pathological or mathematically rigorous.
  3.  Explain whether a view that rejects actual infinite collections of objects while accepting continuous space or time is consistent.

  Conclude by stating whether you believe the argument successfully rules out actual infinities in the concrete world, or whether it merely forces a revision of our understanding of physical processes or spatial ontology. (20 marks)

  ***

  **MODEL ANSWER**

  The distinction in part (a) separates set-theoretic possibility from physical realizability. Mathematically, a Dedekind-infinite set is defined by its ability to be put into one-to-one correspondence with a proper subset. This is a static logical fact about relations between numbers or abstract objects. However, the "Hotel" argument requires guests to *move* from room $n$ to room $2n$. This introduces a causal process where every member must traverse a distance, and for any distance proposed, a guest further down must travel further still. There is no final step. The distinction is crucial because one might accept the logical coherence of the static mapping while rejecting the physical possibility of the transition required to manifest the "absurdity" (such as creating vacancies).

  In part (b), the objection that the Hotel argument targets supertasks rather than states is decisive. The paradox arises only when we demand the hotel *transition* from a full state to a state with vacancies. If the hotel simply *exists* in a state where odd rooms are occupied and even rooms are empty, no paradox emerges. The absurdity is not that an infinite set can have a proper subset of the same size—that is the definition of infinity—but that a physical system can complete a task with no last step. Therefore, the argument fails to rule out actual infinities as static ontological categories. It only rules out the completion of infinite causal chains within finite time. If the universe contains an infinite number of particles timelessly, the Hotel argument has no grip. The force of the argument relies on conflating the properties of a set with the dynamics of a system.

  Regarding the hierarchy of infinities, the existence of larger and larger cardinalities via power sets should be viewed as evidence of mathematical rigour, not pathology. The anti-infinity position treats the inability to intuitively grasp $\aleph_1$ or $\aleph_2$ as a defect in the concept. However, the precise rules governing these hierarchies demonstrate that infinity is not a vague, boundless mist, but a structured domain with strict laws. That the theory generates counter-intuitive results (like different sizes of infinity) is a feature of the abstraction, not a bug. To claim this hierarchy makes infinity "spooky" is to mistake the limits of human intuition for limits on reality. Mathematics handles these distinctions without contradiction; the pathology lies only in expecting physical analogues for every set-theoretic truth.

  The most significant tension arises for the finitist who accepts continuous space or time. If space is continuous, any finite line segment contains uncountably many points. This is an actual infinity of concrete entities (or at least, concrete locations). A finitist who rejects the Hotel guests because they are "too many" but accepts a continuous meter stick is inconsistent. They are rejecting countable actual infinities while accepting uncountable ones. To maintain consistency, the finitist must either embrace discrete space (atomism) or adopt a point-free geometry where space is not composed of indivisible instants or points. Without this revision, the Hotel argument overruns its target: if you cannot have infinite guests, you cannot have continuous space.

  In conclusion, the Hotel argument does not successfully rule out actual infinities in the concrete world. It successfully demonstrates that certain supertasks are physically impossible, but this is a constraint on dynamics, not ontology. The static existence of an infinite collection remains coherent. However, this coherence comes with a cost. If we accept actual infinities are possible, we must accept that our physical ontology cannot be naively finitist. Conversely, if we wish to remain finitists, we cannot simply point to the Hotel; we must argue for a discrete physics. The argument ultimately forces a choice between our intuitions about causal processes and our models of spatial continuity, rather than disproving infinity itself. The bare cardinality facts do no independent work; the real metaphysical heavy-lifting is done by the theory of motion and the structure of space.

  ***

  **MARKING SCHEME (Total: 25 Marks)**

  **Part (a) – Distinction and Significance (5 Marks)**
  *   **5 marks:** Clearly distinguishes static mapping (logical/bijection) from physical rearrangement (causal/supertask). Explains that the paradox relies on the transition, not the state.
  *   **3-4 marks:** Identifies the difference but fails to explain why it matters for the existence claim (e.g., says one is math and one is physics without linking to possibility).
  *   **1-2 marks:** Vague distinction; treats them as the same thing.
  *   **0 marks:** Incorrect or blank.

  **Part (b) – Argument and Evaluation (20 Marks)**

  **1. Diagnosis of the Hotel Argument (State vs. Process) (5 Marks)**
  *   **5:** Argues that the impossibility attaches to the *process* (supertask/completion), not the *state* (cardinality). Notes that a static infinite set generates no contradiction.
  *   **3-4:** Identifies the supertask issue but hedges on whether this saves actual infinity.
  *   **1-2:** Treats the Hotel as a proof against the existence of infinite sets *simpliciter*, ignoring the movement objection.
  *   **0:** Fails to address the prompt's specific objection.

  **2. Evaluation of Cantor's Hierarchy (Pathology vs. Rigour) (5 Marks)**
  *   **5:** Takes a clear side (usually rigour). Argues that structured hierarchies demonstrate precision, not incoherence. Rejects "spookiness" as an intuitive failure.
  *   **3-4:** Mentions the hierarchy but remains neutral on whether it supports or undermines the concept.
  *   **1-2:** Assumes the hierarchy is automatically evidence of pathology without argument.
  *   **0:** Irrelevant or factually incorrect regarding the hierarchy.

  **3. The Finitist/Continuity Consistency Check (5 Marks)**
  *   **5:** Identifies the tension: Continuous space implies uncountable points. Rejecting countable objects while accepting continuous space is inconsistent unless space is discrete/atomistic.
  *   **3-4:** Notes the tension but fails to explain the resolution (discrete vs. point-free).
  *   **1-2:** Ignores the space/time constraint entirely.
  *   **0:** Claims there is no tension.

  **4. Conclusion and Commitment (5 Marks)**
  *   **5:** Commits to a position (e.g., "Argument fails," or "Argument succeeds only against supertasks"). Acknowledges where the disagreement bottoms out (ontology vs. physics).
  *   **3-4:** Concludes but hedges significantly ("It depends," "Both sides have merit" without resolution).
  *   **1-2:** No clear conclusion; trails off.
  *   **0:** No conclusion.

  **Grade Boundaries & Common Errors**

  *   **First Class (20-25):** Makes all five moves above with precision. Crucially, **commits** to a verdict in the conclusion. Integrates the continuity constraint as a decisive pressure point on the finitist. Prose is tight and argumentative.
  *   **Upper Second (2:1) (15-19):** Hits the State/Process distinction and the Continuity tension well. May lose marks on the Cantor section (treating it as purely mathematical without metaphysical import) or may hedge the conclusion rather than committing.
  *   **Lower Second (2:2) (10-14):** Describes the Hotel scenario accurately but fails to pivot to the *supertask* objection. Treats the question as "Explain the Hotel Paradox." May ignore the continuous space constraint.
  *   **Third Class (<10):** Conflates bijection with physical movement. Assumes the Hotel argument requires Cantor's Theorem (it only requires Dedekind-infinity). Dismisses the physical movement objection with "it's only a thought experiment."

  **Specific Penalties:**
  *   **Namedropping:** Deduct 2 marks total if specific authors (e.g., Hilbert, Cantor, Craig) are named in the essay, as per exam instructions.
  *   **Word Count:** Significant deviation from the expected depth (too short to cover all three constraints) should be capped at 2:2 level.
