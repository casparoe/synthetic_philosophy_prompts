  **JOINT WORKING DOCUMENT 2039-04**
  **SUBJECT:** Consensus and Dissensus on Classification Dynamics (Amotivational Adaptation Disorder & General Principles)
  **PARTIES:** Biological Mechanisms Unit (BMU) / Historical-Ontological Inquiry Group (HOIG)
  **STATUS:** Draft for Signature (v. 4.2)

  ### 1.0 SHARED PREMISES AND ACKNOWLEDGED FACTS

  Both parties agree to the following empirical claims regarding the current state of psychiatric classification and the specific context of the Amotivational Adaptation Disorder (AAD) rollout.

  1.  **Heterogeneity of Current Categories:** Existing diagnostic categories (including DSM-6 and ICD-12 entries) exhibit high internal heterogeneity. Two patients sharing a diagnosis often share fewer than 40% of specific symptom markers, and genetic/physiological correlation within categories remains low (average *r* < 0.3).
  2.  **Boundary Permeability:** Treatment-response data does not respect current category boundaries. Agents targeting glutamatergic pathways, for example, show efficacy across three distinct mood/anxiety categories and fail within 30% of the target category.
  3.  **Existence of Feedback:** The act of classification alters the classified population. This is not disputed. Patients change behavior, self-narrative, and help-seeking patterns upon receiving a label.
  4.  **Limitations of Looping Accounts:** The "looping effect" (where classification changes the kind) is not instantaneous, nor is it total. Biological constraints limit the plasticity of the phenotype. A classification cannot induce symptoms that are physiologically impossible for the subject (e.g., a label cannot induce a seizure in a neurologically intact brain, though it may alter the reporting of somatic sensations).
  5.  **Algorithmic Opacity:** The AAD flagging system relies on behavioral proxies in primary care records (prescription refill latency, appointment cancellation rates, vocabulary in patient portal messages) rather than direct biological assay.
  6.  **The Natural Experiment:** The staggered implementation of the Transparency Rule (2038–2040) creates a de facto control group. Sites designated "Disclosure" inform patients of their AAD risk status and offer the Adaptation Program. Sites designated "Non-Disclosure" offer the Program based on the flag but attribute the referral to "General Wellness" protocols.

  ### 2.0 TABLE OF DIVERGENCE (INTERPRETIVE FRAMEWORKS)

  The following table maps the substantive disagreements. Left column phrasing is acceptable to BMU; Right column phrasing is acceptable to HOIG. Both describe the same underlying data but posit different causal architectures.

  | Topic | BMU Formulation (Biological Mechanisms Unit) | HOIG Formulation (Historical-Ontological Inquiry) | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **The Ontology of AAD** | AAD is a latent dysfunction of reward-prediction error signaling. The current manual description is a noisy proxy for this underlying mechanism. | AAD is an emerging interactive kind. The manual description is a script that patients and clinicians are currently co-authoring. | **Substantive:** Is there a "true" AAD waiting to be found, or is AAD being made by the search? |
  | **The Role of the Label** | The label is a *confounding variable*. It introduces noise (placebo/nocebo) that obscures the true signal of the disorder. We must subtract the label's effect to see the disease. | The label is a *constitutive variable*. It is part of the causal machinery of the disorder. You cannot subtract it without destroying the phenomenon. | **Substantive:** Can the "disease" be isolated from the "diagnosis"? |
  | **Algorithmic Sorting** | Algorithmic flagging is a selection bias. It identifies people who are already sick but undiagnosed. | Algorithmic flagging is an intervention. By sorting people, the system changes their administrative reality, which changes their lived reality. | **Verbal/Pragmatic:** Both agree sorting changes outcomes; disagree on whether to call it "selection" or "intervention." |
  | **Stability** | A category is valid if it remains stable when measurement tools improve. | A category is valid if it remains stable when the *social stakes* of the label change. | **Substantive:** Different definitions of "validity." |
  | **Comparison to Hypertension** | Hypertension is a different kind of object. Knowing you have high blood pressure changes your diet, but it does not change the arterial stiffness directly via belief. | Hypertension patients become "hypertensives." They monitor, medicate, and identity-shift. The feedback loop is slower, but the mechanism (classification -> behavior -> physiology) is identical. | **Substantive:** Degree vs. Kind. Is psychiatry unique? |

  ### 3.0 CRUXES AND PREDICTIVE COMMITMENTS

  To move this collaboration forward, we identify three specific cruxes where our theories generate different predictions regarding the AAD Transparency Experiment. We agree to treat the following predictions as binding for the purpose of future data analysis.

  #### CRUX 1: The Awareness Threshold
  **Sub-question:** Does the looping effect require the subject's conscious awareness of the classification, or is differential treatment (algorithmic flagging without disclosure) sufficient to generate a "looped" kind?

  *   **BMU Prediction:** In Non-Disclosure sites, symptom profiles will converge on the AAD manual description at a rate of **15–20%** over 24 months (driven by treatment effects). In Disclosure sites, convergence will be **25–30%** (driven by treatment + identity adoption). The difference is marginal.
  *   **HOIG Prediction:** In Non-Disclosure sites, convergence will be **<5%** (driven only by non-specific care). In Disclosure sites, convergence will be **>40%**. The knowledge of the label is the primary driver of the phenotype.
  *   **Concrete Case:** The "Burnout-9" classification (2032). When Burnout-9 was kept confidential from employees but used to assign light duty, symptom reporting did not cluster. When made public, a distinct "Burnout-9 personality" emerged within 6 months.
  *   **Falsification Conditions:**
      *   *BMU Concession Point:* If Non-Disclosure sites show **zero** convergence on symptom profiles despite receiving the Adaptation Program, BMU acknowledges that the "mechanism" is entirely dependent on social feedback, not underlying biology.
      *   *HOIG Concession Point:* If Disclosure sites show **no greater** convergence than Non-Disclosure sites, HOIG acknowledges that the "identity" component is negligible and the category is tracking a pre-existing condition.

  #### CRUX 2: The Specificity Claim (Psychiatry vs. General Medicine)
  **Sub-question:** Is the looping effect distinctive to mental/behavioral categories, or is it a general feature of all medical classification?

  *   **BMU Prediction:** Psychiatric categories show **5x higher** susceptibility to looping than somatic categories (e.g., Type 2 Diabetes, Hypertension). Mental disorders involve self-conception directly; somatic disorders involve it indirectly.
  *   **HOIG Prediction:** The difference is not in *kind* but in *velocity*. Psychiatric looping is faster. Given enough time (decades), somatic categories show equal restructuring of the population (e.g., the "Diabetic Diet" creates a distinct metabolic phenotype that did not exist prior to the classification).
  *   **Concrete Case:** Compare AAD convergence rates against a concurrent rollout of a new "Pre-Hypertensive Risk" algorithm in the same clinic system.
  *   **Falsification Conditions:**
      *   *BMU Concession Point:* If the "Pre-Hypertensive" group shows equal identity-adoption and symptom-convergence rates to the AAD group within 24 months, BMU concedes that psychiatric "specificity" is an illusion of timescale.
      *   *HOIG Concession Point:* If the "Pre-Hypertensive" group shows **no** identity adoption (no change in self-reporting or lifestyle beyond strict medical compliance) while AAD does, HOIG concedes that agency/mental content makes psychiatric kinds ontologically distinct.

  #### CRUX 3: The Validator Problem
  **Sub-question:** Can we specify a validator for a loop-prone category that is not circular? (i.e., How do we know the category is "real" and not just a self-fulfilling prophecy?)

  *   **Proposed Compromise Validator:** **Stability Under Deliberate Non-Disclosure (SUDN).**
      *   *Method:* If a category persists (predicts treatment response, functional impairment, and longitudinal course) in a population that is *never told they have it*, it possesses mechanistic validity independent of looping.
  *   **BMU Interpretation of SUDN:** A high SUDN score proves the category tracks a Natural Kind. The label is incidental.
  *   **HOIG Interpretation of SUDN:** A high SUDN score proves the category tracks a *Stable Interactive Kind*. It means the feedback loop is embedded in the treatment structure, not the patient's mind. It does not prove "Natural Kind" status, only that the loop is robust.
  *   **Falsification Conditions:**
      *   *BMU Concession Point:* If a category has high SUDN (stable in non-disclosure) but **zero** biological marker correlation after 10 years of improved imaging/assay tech, BMU concedes the category is a "useful fiction" rather than a mechanism.
      *   *HOIG Concession Point:* If a category has high SUDN and high biological correlation, HOIG concedes that for all practical clinical purposes, the distinction between "Natural" and "Interactive" is moot.

  ### 4.0 OPERATIONAL DEFINITIONS FOR THE AAD STUDY

  To prevent verbal disputes during data collection, the following definitions apply to this document:

  1.  **"Convergence":** Defined as the statistical clustering of patient self-reports around the specific adjective clusters in the AAD Manual (Section 4, Paragraph 2), measured via monthly portal surveys.
  2.  **"Awareness":** Defined strictly as explicit notification. Patients in Non-Disclosure sites who deduce their status via internet research or peer discussion will be coded as "Contaminated Awareness" and analyzed separately.
  3.  **"Mechanism":** BMU uses this to refer to neurocomputational processes. HOIG uses this to refer to the socio-technical system (including the manual, the algorithm, and the clinic). When the word appears without a modifier, it refers to BMU's definition.
  4.  **"Real":** Both parties agree to ban this word from future drafts. Use "Stable," "Predictive," or "Intervention-Resistant" instead.

  ### 5.0 REMAINING BARRIERS TO SIGNATURE

  The following items remain unresolved and are deferred to the next review cycle (Q3 2040):

  1.  **The Online Community Variable:** HOIG insists that the existence of the patient-led online forum (discussing the draft manual) invalidates the Non-Disclosure condition, as information leakage is inevitable. BMU insists that "official" disclosure is the only variable that matters. *Resolution:* We will track forum membership as a covariate.
  2.  **Ethical Reporting:** If HOIG's predictions hold (i.e., the label *creates* the disorder), BMU is concerned this undermines the clinical utility of the diagnosis. HOIG argues that knowing the loop exists allows us to steer it ethically. *Resolution:* A separate ethics addendum will be drafted.

  ***

  **Signed (Provisional):**

  _________________________
  *Dr. Aris Thorne (BMU)*
  *Date: 11/14/2039*

  _________________________
  *Dr. Elias Vane (HOIG)*
  *Date: 11/14/2039*

  **Note:** Signatures indicate agreement to test these predictions, not agreement on the interpretation of the results.
