      *   **Partner's Objection:** Climate change/instability/scarcity makes having a child now unethical.
      *   **User's Counter-argument:** The Non-Identity Problem (Philosophical concept). If they wait, it's a *different* child. So, is it unfair to the specific child born now vs. no child (or a different child) later?
