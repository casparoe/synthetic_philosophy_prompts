answer: |-
  Here is the decision procedure, the meta-analysis you asked for, and the run-through of your three cases.

  ### Part 1: The Procedure (Text for the One-Page Rule)

  **Town Meeting Standing and Eligibility Protocol**

  **Purpose:** To determine eligibility to vote and speak on Warrant Articles where statutory residency is unclear or external impacts are significant. This rule does not override State Statute; where State Law defines the voter checklist, the Checklist controls.

  **Step 1: The Legal Ceiling (Voting Only)**
  *   **Question:** Does State Statute or the Town Charter explicitly define the voter base for this article (e.g., "Registered Voters," "Property Owners")?
  *   **Yes:** Stop. Eligibility is fixed by law. Proceed to Step 4 for Speaking Rights.
  *   **No:** Proceed to Step 2.

  **Step 2: The Subjection Test (Voting Only)**
  *   **Question:** Will this person face direct legal penalty, enforcement, or tax liability *specifically* from this article?
  *   **Yes:** Eligible to Vote (provided Step 1 allows).
  *   **No:** Not Eligible to Vote. Proceed to Step 4.
  *   *Note:* General welfare effects (traffic, noise, property value) do not count as subjection.

  **Step 3: The Time and Agency Test (Voting Only)**
  *   **Question:** Is the person a living legal agent capable of bearing liability at the time of the vote?
  *   **Yes:** Proceed to Step 2.
  *   **No (Minors, Future Residents, Deceased):** Not Eligible to Vote. Interest is represented by guardians or current taxpayers.

  **Step 4: The Affectedness Test (Speaking Rights)**
  *   **Question:** Will this person suffer material causal harm (economic, environmental, health) distinct from the general public?
  *   **Yes:** Granted Full Speaking Rights (same time limit as voters).
  *   **No:** Granted Public Comment Rights (at Moderator's discretion).

  **Step 5: The "Other Town" Check (Mitigation Only)**
  *   **Question:** Do affected non-voters have a competent political body in their own jurisdiction to address this harm?
  *   **Yes:** Board shall seek formal comment from that body before finalizing action.
  *   **No:** Board shall consider stricter mitigation or regional review.

  **Adoption:** This procedure is adopted by the current legal electorate to govern future meetings.

  ***

  ### Part 2: Meta-Analysis & Constraints

  **1. Literature vs. Improvisation**
  *   **Step 2 (Subjection):** This is grounded in the "All Subjected Principle" (Frederick Whelan, Robert Dahl). It's the only defensible legal standard for voting. *Literature.*
  *   **Step 4 (Affectedness for Speaking):** This is practical improvisation. Theory says "All Affected Interests" should vote, but law says no. Giving them *speech* preserves legitimacy without breaking statutes. *Improv.*
  *   **Step 5 (Other Town):** This addresses the "boundary problem" recursion. It acknowledges externalities without granting veto power. *Hybrid.*

  **2. Which Step to Drop First?**
  *   **Drop Step 5.** If a professional parliamentarian or counsel reads this, they will tell you Step 5 creates an unfunded mandate ("seek formal comment") that could delay warrants indefinitely. It invites litigation from developers claiming the town didn't "seek comment" enough. It's the first thing to cut to save time.

  **3. What Would Change My Mind?**
  *   **The Biggest Call:** Step 2 (Subjection vs. Affectedness). I am prioritizing *Subjection* for voting. I would change this if your State Attorney General issued an opinion that "substantial economic impact" confers voting standing in Open Town Meetings. Until then, Subjection is the only shield against a state lawsuit.

  **4. What This Will Never Settle**
  *   **The Moral Legitimacy of the Boundary.** This procedure manages the *process*, not the *justice*. It will never resolve the guilt of taxing non-voters (your dairy crew) or binding future generations (your kids). It converts moral problems into administrative ones. It stops the shouting, not the feeling that something is wrong.

  ***

  ### Part 3: Running the Three Cases

  **Case 1: The Gravel Pit Rezoning**
  *   **Step 1 (Legal Ceiling):** State law likely defines voters as town residents. *Stop for Voting.*
  *   **Step 2 (Subjection):** Downstream neighbors are not legally bound by your zoning penalties. *No Vote.*
