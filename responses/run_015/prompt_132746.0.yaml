answer: |-
  Good morning. Thanks for coming out. For those who don't know me, I'm the deputy clerk. Which, in a town this size, means I'm the one who holds the microphone when there's something difficult to say.

  Look at the water. It's calm today, but Kellner's Lake is deep. Down there, the mud doesn't mix. It settles in layers, one for every year, like rings in a tree. For the last ten years, scientists have been pulling cores of that mud up to the surface. They've been reading it like a book.

  They found a lot of things in those pages. They found pollen that changed when the forests were cut. They found metal dust from the smelter forty kilometres upwind—a smelter where my grandfather worked for thirty-one years, and where half the people standing here have drawn a paycheck. They found a spike of plutonium from the bomb tests in the early nineteen-fifties.

  Because that plutonium layer is so clear, this lake was proposed as the "Golden Spike" for a new geological age. The idea was to put a marker in the ground and say: "Time changed here. 1950. This is the start of the Anthropocene."

  But earlier this year, the scientists voted that down. Officially, we are still in the Holocene. The debate isn't settled. And honestly, looking around this crowd, I'm not sure a date in the mud could ever settle the things we feel about this place.

  For the geologists here, thank you. You've treated our lake with respect, and you've taught us that the earth keeps a record we can't erase.

  For the members of the First Nation joining us: we know this territory is yours. We know that marking a new age starting in 1950 ignores centuries of change that began for your people long before the atoms fell. A boundary in the mud can't measure the weight of that history.

  And for my neighbours, my family, and the workers: we built this town. We put food on the table with the work that left its mark in the sediment. We don't need to apologize for surviving, but we do need to acknowledge what that survival cost the land.

  So, we have a boardwalk, but we don't have a date. We have a plaque to engrave, but we don't have an agreement.

  I've been thinking about how geological time works. Usually, you draw a line between two periods by looking at what came *after*. But here, we are trying to mark the bottom of a period that isn't finished. The top of the layer hasn't been laid down yet. Whoever picks this date is picking it blind.

  That makes me think the question isn't "When did it start?" The question is, "Who has to live under the answer?"

  A date on a plaque in a town that still works the mine isn't just a fact about mud. It's a claim about who the next fifty years are supposed to answer to. If we carve "1950," we tell the future that this was about atoms. If we carve "1700," we tell them it was about colonization. If we carve nothing, we pretend we left no mark at all.

  None of those are the whole truth. The truth is, we are standing on the boardwalk, not in the mud. We are the layer being laid down right now.

  So, I am not going to propose a date. I am going to propose a responsibility. The plaque shouldn't declare a victory for science or a verdict on history. It should acknowledge that we are the ones reading the layers, which means we are the ones who have to write the next one.

  Here is the wording I propose we send to the engraver:

  **KELLNER'S LAKE**

  **IN THESE LAYERS, THE EARTH KEEPS TIME.**
  **HERE REST THE DUST OF INDUSTRY, THE FALLOUT OF WAR,**
  **AND THE MEMORY OF THIS LAND LONG BEFORE US.**

  **SCIENCE DEBATES THE NAME OF THIS AGE.**
  **HISTORY REMEMBERS COSTS NOT SHOWN IN STONE.**
  **WE DO NOT AGREE ON WHEN A NEW WORLD BEGAN.**
  **WE AGREE ON WHO MUST LIVE IN IT.**

  **DEDICATED TO THE CARE OF THE NEXT LAYER.**
  **2024**

  Thank you. Enjoy the barbecue.
