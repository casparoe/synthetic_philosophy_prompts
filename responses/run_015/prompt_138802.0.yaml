answer: |-
  Here is the ranking of load-bearing questions for your feature, defended against your three criteria (downstream impact, feasibility in four months, institutional relevance).

  ### 1. The Implementation Gap (Your "Institutions" Hypothesis)
  **The Question:** *Why do high-stakes institutions (central banks, intelligence, epidemiology) report set-valued uncertainty but refuse to adopt a decision rule for acting on it?*

  *   **Defense:**
      *   **(1) Load-bearing:** This is the bottleneck. Imprecise probability (IP) theory is useless if it stops at the "credal state" and never reaches the "choice." If the theory cannot bridge the gap between *reporting* a set and *acting* on it without collapsing back into precise Bayesianism or arbitrary fiat, the field is academically interesting but practically inert.
      *   **(2) Feasibility:** This is the only question you can definitively answer in four months. The other questions require mastering measure theory or metaphysics; this requires interviews and document analysis. You can trace the workflow of a pandemic modeler or an intelligence analyst. You can determine if they are ignoring decision rules because they don't know them, because the rules are computationally intractable, or because the rules yield paralysis (e.g., E-admissibility leaving too many options open).
      *   **(3) Institutional Impact:** The answer dictates the next generation of risk tools. If they are ignoring rules due to ignorance, the fix is education. If they are ignoring them because the rules (like $\Gamma$-maximin) are too conservative for policy, the fix is new mathematics. If they are doing it because "set-shaped" reports allow plausible deniability, the fix is political, not mathematical.

  ### 2. The Dilation Problem (Your "Learning" Cluster)
  **The Question:** *Is the phenomenon where conditioning on new evidence widens the probability set (dilation) a bug in the math, or a feature of honest ignorance?*

  *   **Defense:**
      *   **(1) Load-bearing:** This is the biggest technical objection to IP. In standard Bayesianism, evidence *always* sharpens belief (contracts the variance). In IP, learning that a "relevant" but "imprecise" signal is coming can make you *less* sure than you were before. If this is a bug, IP is broken. If it is a feature, it fundamentally changes how we value information (sometimes, don't look).
      *   **(2) Feasibility:** You can grasp this with undergrad probability. The canonical examples (Seidenfeld's urns) are intuitive. You don't need to prove theorems; you need to understand the intuition: *When your model of the evidence is as shaky as your model of the world, updating shakes you further.*
      *   **(3) Institutional Impact:** This explains risk aversion regarding data. It validates the instinct of analysts who sometimes fear new intelligence because it might complicate the picture without resolving the ambiguity. It shifts the institutional goal from "gather more data" to "gather more *precise* data."

  ### 3. The Reduction Challenge (Your "Distinctness" Cluster)
  **The Question:** *Is Imprecise Probability just Hierarchical Bayesianism (a prior over priors) in disguise, and if so, does the "disguise" do any work?*

  *   **Defense:**
      *   **(1) Load-bearing:** This is existential. If any set of probabilities can be represented as a single precise prior over a larger state space (a "hyper-prior"), then IP isn't a new logic of uncertainty; it's just Bayesianism with extra steps. The field survives only if you can defend the claim that the *refusal* to pick a hyper-prior is rationally mandatory, not just computationally convenient.
      *   **(2) Feasibility:** This is the hardest of the three. Philosophers (e.g., Bradley, Steele) and statisticians are still fighting it. However, you can report the stalemate clearly: The reduction is mathematically possible, but proponents argue it is *epistemically dishonest* to force a precise weight on the priors. You can "get to the bottom" of the *stakes* of the argument even if the math isn't settled.
      *   **(3) Institutional Impact:** If IP is just Bayesianism, institutions don't need new software; they just need to admit they are using sensitive priors. If IP is distinct, they need entirely new inference engines.

  ---

  ### The Cut: Ontic vs. Epistemic (Your "Parliament vs. Primitive" Hypothesis)
  **The Question:** *Does it matter whether the imprecision is in the agent's head (epistemic/parliament) or in the world itself (ontic/primitive chance)?*

  **Why I cut it:**
  You asked if anything downstream turns on this. For the purposes of a science writer focusing on **action and institutions**, the answer is **no**.
  *   **Decision Theory is Blind to Metaphysics:** Whether you treat the set as a "parliament of advisors" (epistemic) or "objective indeterminacy" (ontic), the decision rules ($\Gamma$-maximin, Maximality, etc.) operate on the *set* identically. The math doesn't change based on why the set exists.
  *   **Feasibility Trap:** This is the "philosophers talking past each other" zone. It dissolves into semantics about the nature of chance. You could spend four months interviewing metaphysicians and end up with a paragraph that confuses your readers without changing their understanding of risk management.
  *   **Institutional Irrelevance:** A central bank governor does not care if the volatility is "in the coin" or "in their knowledge." They care about the capital reserve required to survive the volatility. The set captures the risk; the origin of the set is decorative.

  ---

  ### What Would Reshuffle the List?
  **The Finding:** If you discover during your reporting that institutions *are* secretly using specific decision rules (e.g., they claim to report sets, but their internal protocols implicitly minimize the worst-case scenario).

  **The Reshuffle:**
  If this is true, **Question #1 (The Implementation Gap)** collapses. It turns out the theory *has* been implemented, just informally.
  *   **New #1:** **The Reduction Challenge.** If practitioners are already acting on these sets, the question of whether the underlying math is "cheating" (Bayesian in disguise) becomes urgent. If they are acting on a fiction, we need to know.
  *   **New #2:** **Dilation.** If they are acting on the sets, are they getting burned by dilation? Are they avoiding data sources because they intuitively know it will widen their uncertainty?

  **Current Strategy:** Start with Question #1. It is the most journalistic, the most verifiable, and the one most likely to yield a "scandal vs. honest response" narrative that anchors the piece. If you find the gap is closed, pivot to the validity of the tool (Question #3).
