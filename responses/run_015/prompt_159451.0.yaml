answer: |-
  You have a strong intuition pump with the Skill Upload case, but it is double-edged. It isolates ability from articulation, which feels like a win for anti-intellectualism (AI). However, it also isolates ability from *understanding*, which is where the view becomes vulnerable. If the upload is just a causal driver (like a reflex arc), calling it "knowledge" starts to look like a category mistake.

  Here are the defeaters for Anti-Intellectualism, ranked from fatal (requires abandoning the core thesis) to awkward (requires theoretical gymnastics that erode parsimony). I have included the concessions a sophisticated anti-intellectualist (like Hawley, Carter, or Pritchard) would make, as well as the points where the view risks collapsing into triviality.

  ### 1. Fatal: The Gettierized Ability (Reliability ≠ Knowledge)
  This is the strongest objection. AI identifies KH with ability. But abilities can be Gettierized. You can have a reliable ability to $\phi$ that does not amount to knowledge-how.

  *   **The Case:** Suppose a novice golfer has a tremor that usually makes them slice. However, on this specific day, a strong wind perfectly counteracts the slice, and they sink the putt. They have the *ability* to sink putts in these specific conditions (they just did it), but they don't *know how* to sink putts.
  *   **The Upload Variant:** In your Upload case, suppose the motor package works by a "black box" causal mechanism that is reliable but opaque. If the mechanism malfunctions in a way that *looks* like success (e.g., a glitch makes the fingers hit the right notes for the wrong reasons), the agent has the "ability" (in terms of output) but lacks the knowledge.
  *   **Why it's Fatal:** It forces AI to admit that KH is not *just* ability, but *knowledge-grade* ability. Once you add conditions to filter out luck, coincidence, or blind causation (e.g., "the ability must be grounded in understanding"), you are often forced to reintroduce propositional or representational states to explain what distinguishes the knowledge-case from the lucky-case.
  *   **Concession:** A committed AI must concede that not all abilities are knowledge-how. They must posit a "normative constraint" on the ability.

  ### 2. Fatal: The Paralyzed Pianist (The "Ideal Conditions" Trap)
  You mentioned this, and it is the classic killer. A concert pianist loses both arms in an accident. Intuitively, she still *knows how* to play the Moonlight Sonata, even though she lacks the categorical ability to do so.

  *   **The AI Defense:** AI typically retreats to *dispositional* ability or ability *under ideal conditions*. "She knows how because she *would* play if she had hands."
  *   **Why it's Fatal:** This stretches the concept of "ability" until it snaps.
      1.  **Finkish Dispositions:** If the loss of hands is permanent, the disposition is gone. To save it, AI must say "She has the internal neurological state that *would* produce ability *if*..."
      2.  **The Collapse:** If the "ability" is just "having the internal neurological state that represents the method of playing," you are dangerously close to Intellectualism. You are defining ability in terms of an internal state that *tracks the correct method*. If that internal state is representational (which it likely is, to guide the muscles), the distinction between "representing a method" (Intellectualism) and "having the ability-state" (AI) becomes merely terminological.
  *   **The Cost:** To save the pianist, AI must define ability so abstractly that it loses its explanatory power regarding *action*.

  ### 3. Serious: The Normative Gap (Success vs. Correctness)
  Knowledge-how is normative; ability is descriptive. You can have the ability to $\phi$ badly.

  *   **The Problem:** A student might have the ability to solve quadratic equations by a flawed method that works 50% of the time. Do they *know how* to solve them? We would say no. They have a partial ability, but they lack the knowledge.
  *   **The Upload Case:** In your Variant A, the novice plays flawlessly. But suppose the motor package forces her fingers to move, bypassing her agency entirely (like a puppet). She produces the sound, but she isn't *guiding* the action. Does she know how? Or is she just a vessel for the skill?
  *   **Why it Counts:** KH implies a standard of *correctness* that the agent grasps. Mere ability only implies *success*. If AI cannot distinguish between "being able to succeed" and "grasping the standard of correctness," it cannot account for why we criticize people for doing the right thing in the wrong way. Intellectualism handles this easily: you must grasp the *true proposition* about the method. AI struggles to ground normativity in mere disposition.

  ### 4. Serious: The Hierarchical Structure of Skill
  Skills are not monolithic blobs; they are hierarchical. To know how to play chess, you must know how to move a knight, which requires knowing how to grip the piece, etc.

  *   **The Problem:** Intellectualism explains this via sub-clauses (knowing that w is a way to $\phi$ involves knowing that w* is a way to w). AI explains this via sub-routines.
  *   **The Defeater:** When we learn a skill, we often start with propositional rules ("keep your elbow straight") which eventually dissolve into ability. If KH were *just* ability, this transition would be mysterious. Why does being *told* (propositional) help generate the ability?
  *   **The Concession:** AI must admit a tight interface between KH and KP. If propositional knowledge is the primary *scaffold* for acquiring knowledge-how, the claim that they are metaphysically distinct kinds becomes less significant. The "Upload" case is rare; most KH is built on KP.

  ### 5. Awkward: The "Stretching" of Ability (Gerrymandering)
  You asked specifically about this. Does AI define 'ability' so broadly it can't lose?

  *   **The Worry:** To handle the Paralyzed Pianist, AI adds "ideal conditions." To handle the Gettier case, AI adds "non-lucky." To handle the Normative Gap, AI adds "understanding." To handle the fact that we can know how to $\phi$ without currently $\phi$-ing, AI adds "dispositional."
  *   **The Verdict:** Yes, this is a real problem. If "ability" means "a non-lucky, normative, dispositional capacity to succeed under ideal conditions, grounded in a reliable internal state," then "ability" has become a technical term that bears little resemblance to the folk concept.
  *   **The Cost:** At this point, the debate becomes verbal. The Intellectualist says, "That internal state you're describing? That's a propositional attitude." The Anti-Intellectualist says, "No, it's an ability-state." If the predictions are the same, AI loses its parsimony advantage. It posits a unique metaphysical category ("ability") that does all the work of a propositional state but refuses to call it one.

  ### 6. Awkward: Infants, Animals, and Simple Systems
  AI often leans on the fact that infants and dogs know how to walk/eat, but don't know propositions.

  *   **The Counter-Defeater:** This is AI's strongest point, *unless* you accept a tiered view of knowledge.
  *   **The Problem:** If you concede that a dog's "knowing how to fetch" is a different *kind* of state than a physicist's "knowing how to derive the field equations," then you have conceded that human adult KH (the primary subject of epistemology) might be propositional, even if animal KH is not.
  *   **The Upload Relevance:** Your Upload case creates a "human animal." The novice has the dog-like ability without the human-like understanding. If you say she *knows how*, you align human KH with animal KH. If you say she *doesn't* (because she lacks understanding), you align human KH with Intellectualism.

  ### Re-evaluating Your Upload Case
  You asked how much weight your reaction to the Upload case should get. Here is the straight talk:

  **Variant A (Motor Only):** Your intuition is that she knows how.
  *   *Intellectualist Reply:* She has *competence*, not *knowledge*. She is a philosophical zombie of skill. She can't teach it, she can't adapt it to new contexts (unless the upload covers every context), and she can't explain it. If the etude changes key, can she transpose? If not, her "knowledge" is brittle. Brittle success is ability, not knowledge.

  **Variant B (Motor + Inaccessible Manual):** You ask if the manual matters.
  *   *The Trap:* If you say the manual matters, you are an Intellectualist. If you say it doesn't, you are an Anti-Intellectualist.
  *   *The Nuance:* The manual *itself* doesn't matter (agreed). But the *structure* of the motor package matters. If the motor package encodes the *rules* of music (even non-propositionally), it mirrors propositional structure. If it encodes mere stimulus-response pairings, it's just a reflex.
  *   **The Weight:** Your intuition carries weight only if you are willing to accept that "Knowledge-How" applies to systems that lack *flexibility* and *understanding*. If you define KH as "whatever allows successful action," AI wins trivially. If you define KH as "a cognitive achievement warranting the title 'knowledge'," the Upload case looks less like knowledge and more like possession.

  ### Summary: Should You Move Off It?
  You don't need to abandon Anti-Intellectualism entirely, but you should move off the **Strong Identity Claim** ("KH is *nothing but* ability").

  1.  **Admit the Normative Constraint:** KH is ability *plus* a grasp of correctness. (This concedes ground to Intellectualism).
  2.  **Admit the Propositional Scaffold:** Most human KH is built on and intertwined with KP, even if not identical to it.
  3.  **Refine the Upload Intuition:** Be wary of calling the Upload novice a "knower." Call her "skilled." Reserve "knowledge-how" for cases where the agent has some minimal capacity for recognition or adaptation that implies a representational state.

  **The Fatal Flaw to Watch:** If your definition of "ability" has to include "the capacity to recognize correct $\phi$-ing" to avoid counter-examples, you have smuggled in a propositional attitude (recognizing *that* this is correct). That is the point where AI collapses. If you can define recognition non-propositionally, you survive. If you can't, the manual (or its internal equivalent) is doing the work, not the ability.
