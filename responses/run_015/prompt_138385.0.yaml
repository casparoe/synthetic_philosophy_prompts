answer: |-
  Imagine a fence erected last Tuesday with a sign: "I built this to test Chesterton's principle. Do not remove until you understand why." The only reason the fence exists is to enforce the norm against removing fences. So the only justification for the fence is the rule that says you can't remove it without justification. Burke would kick it over because it's new. But the Chestertonian is trapped: if they remove it, they validate the prank; if they leave it, the fence acquires the very authority it was mocking.

  This highlights how Chesterton's procedural norm can be hijacked into a self-justifying loop, whereas Burke's substantive claim about age remains immune to such tricks.
