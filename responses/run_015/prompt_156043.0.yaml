prompt: |-
  I'm the philosopher on a four-person committee drafting the deception section of the communication code for a large hospital system — the document will govern what clinicians, interpreters, and chaplains may say to patients and families, and it will be applied retrospectively by a review committee that was not in the room (I'm on the committee mostly so that I can be told that my interesting cases are unrealistic). Before we write a word of it, I want the specification: what an account of the moral difference between lying and misleading would have to deliver in order to be fit for that purpose, with the cases rather than the slogans. Give me the full desiderata list — which cases any such account has to get right, which distinctions it must refuse to collapse, and which constraints from neighbouring areas it cannot contradict — each with the case or consideration behind it, and each marked as non-negotiable for our purpose or as the private preference of one camp.

  The cases that keep arising in our drafts, and that I want sorted into genuine desiderata versus noise, are these: the deferred-disclosure case, where a clinician says something literally true, expects the family to act on it now, and expects to correct the impression weeks later once the window for acting has closed; the double-audience case, where a true remark addressed to a family conference is heard by a relative who lacks the context the others share; the interpreter case, where what is said passes through a third party; the competence-gradient case, where hearers differ in their capacity to draw the corrective inference; the hollow-option case, where the speaker leaves the hearer nominally free to ask the follow-up that a steep status asymmetry makes unaskable; the borrowed-credibility case, where a true statement is permitted to be relayed by someone whose relay will be read as endorsing more; and the hostile-uptake case, where a fully true and cooperative statement reaches a hearer already determined to extract a false conclusion from it. I also want your view on the structural requirements, since these may be where the list breaks: must the account yield verdicts determinate enough to be audited by an absent third party, teachable in ninety minutes to staff with no philosophy, and stable across thick religious and secular moral commitments — and can those three be had together with real sensitivity to context? My own working candidate is an option-space view: the currency is not asserted content but whether the hearer retains the planning-relevant options they would have had under full disclosure, with a follow-up question counted as an option only when it is live rather than nominal. Say plainly whether the hollow-option and deferred-disclosure cases sink it. If some subset of the desiderata is jointly unsatisfiable, identify the subset and demonstrate it with the pair or triple of cases that forces the choice — that is the result I most want. Which single requirement excludes the most candidates, and which of the demands commonly made in this literature are really only camp prejudice?

  Finally, and briefly, as an appendix rather than the main event: score the main families of view against the list — accounts that locate the difference in asserting as opposed to merely conveying, accounts that locate it in invited or warranted inference, accounts that locate it in intention to deceive, trust- or relationship-based accounts, and flat expected-harm consequentialism — a table is fine, and I will do the detailed scoring myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Philosopher on a four-person committee drafting a deception section of a communication code for a large hospital system.
      *   **Audience:** Clinicians, interpreters, chaplains.
      *   **Application:** Retrospective review by a committee *not* present in the room.
      *   **Goal:** Define the specification (desiderata) for an account of the moral difference between lying and misleading *before* writing the code.
      *   **Key Constraint:** Focus on cases, not slogans. Mark items as "Non-Negotiable" (fit for purpose) vs. "Camp Preference" (philosophical bias).
      *   **Specific Cases to Address:** Deferred-disclosure, Double-audience, Interpreter, Competence-gradient, Hollow-option, Borrowed-credibility, Hostile-uptake.
      *   **Structural Requirements:** Auditability (determinate verdicts), Teachability (90 mins, no philosophy), Stability (across moral/religious commitments), Context Sensitivity.
      *   **User's Candidate Theory:** Option-space view (currency = planning-relevant options retained; follow-up questions count only if live).
      *   **Critical Task:** Evaluate if Hollow-option and Deferred-disclosure sink the Option-space view. Identify any jointly unsatisfiable subset of desiderata (impossibility results). Identify the single most exclusionary requirement. Identify which demands are camp prejudice.
      *   **Appendix:** Score main families of view (Assertion-based, Inference-based, Intention-based, Trust-based, Consequentialist) against the list.

  2.  **Deconstruct the Context & Constraints:**

      *   *Hospital System:* High stakes (health, life, death), power asymmetry (clinician > patient), vulnerability (patients/families), multidisciplinary (clinicians, interpreters, chaplains).
      *   *Retrospective Review:* This is crucial. The rule must be *auditable*. If the review committee can't agree on whether a violation occurred based on the record/testimony, the code fails. This pushes hard against context-sensitivity.
      *   *Teachability:* Staff aren't philosophers. Nuanced Gricean maxims won't work.
      *   *Stability:* Must work for secular bioethicists, religious chaplains, and legal compliance officers.

  3.  **Evaluate the Specific Cases (Desiderata Generation):**

      *   *Deferred-disclosure:* Clinician says $P$ (true), knows family will infer $Q$ (false), plans to correct $Q$ later when it's too late to act. *Verdict:* Intuitively deceptive/wrong. *Desideratum:* Temporal integrity of information (cannot bank on correction coming too late).
      *   *Double-audience:* True remark to Group A (has context) heard by Person B (lacks context). *Verdict:* Risky, potentially deceptive to B. *Desideratum:* Audience specificity (must account for foreseeable overhearers).
      *   *Interpreter:* Message passes through third party. *Verdict:* Clinician responsible for how interpreter conveys it? Or interpreter's neutrality? *Desideratum:* Chain of custody for meaning (who owns the implication?).
      *   *Competence-gradient:* Hearer capacity to infer varies (e.g., dementia, distress). *Verdict:* Speaker duty scales with hearer vulnerability. *Desideratum:* Vulnerability scaling (duty to prevent misunderstanding increases with hearer impairment).
      *   *Hollow-option:* "You can ask me anything," but status asymmetry makes it unaskable. *Verdict:* Deceptive if the option isn't *live*. *Desideratum:* Live vs. Nominal options (matches User's theory).
      *   *Borrowed-credibility:* True statement relayed by someone (e.g., chaplain) whose role implies endorsement of more than was said. *Verdict:* Deceptive use of role authority. *Desideratum:* Role-implication integrity.
      *   *Hostile-uptake:* Hearer determined to misunderstand despite clear speech. *Verdict:* Not speaker's fault. *Desideratum:* Reasonable uptake standard (speaker not liable for perverse interpretations).

  4.  **Analyze Structural Requirements (The "Trilemma"):**

      *   *Auditability:* Needs clear rules.
      *   *Teachability:* Needs simplicity.
      *   *Context Sensitivity:* Needs nuance.
      *   *Stability:* Needs neutrality.
      *   *Conflict:* High Context Sensitivity conflicts with High Auditability. If the rule depends on "was the question *live*?", an absent reviewer can't know that without mind-reading.
      *   *Impossibility Result:* I need to find the subset that breaks. It's likely {Auditability, Context Sensitivity, Teachability}. You can't have a rule sensitive enough to catch "Hollow Options" (which depend on specific relational dynamics) while being simple enough to teach in 90 mins and clear enough for an absent auditor to judge from a chart note.

  5.  **Evaluate User's "Option-Space View":**

      *   *Core:* Did the hearer retain planning-relevant options they would have had under full disclosure? Is the follow-up question live?
      *   *Hollow-Option:* This view *solves* the Hollow-option case well (nominal option = no option retained).
      *   *Deferred-Disclosure:* This view *solves* it well (option to act now is lost by the time correction happens).
      *   *Weakness:* Auditability. How does a reviewer know if a question was "live"? This requires testimony about psychological states and social dynamics not in the chart.
      *   *Verdict:* It doesn't sink the theory morally, but it sinks it *administratively*.

  6.  **Drafting the Desiderata List:**

      *   Need to categorize into Non-Negotiable (NN) vs. Camp Preference (CP).
      *   NN: Auditability, Vulnerability Scaling, Reasonable Uptake.
      *   CP: Specific metaphysical definitions of lying (e.g., strict assertionism).

  7.  **Identifying the Impossibility Result:**

      *   The "Administrative Trilemma": Auditability + Context Sensitivity + Teachability.
      *   Demonstration: The *Hollow-Option* case requires Context Sensitivity (was the power dynamic real?). The *Deferred-Disclosure* requires Auditability (did the correction happen in time?). To make Hollow-Option auditable, you need complex rules (killing Teachability). To make it teachable, you need bright lines (killing Context Sensitivity).

  8.  **Scoring the Families of View (Appendix):**

      *   *Assertion-based:* Fails Hollow-option (no assertion made).
      *   *Inference-based (Gricean):* Fails Auditability (too complex for staff).
      *   *Intention-based:* Fails Auditability (hard to prove mind-state).
      *   *Trust/Relationship:* Good for hospital context, hard to audit.
      *   *Consequentialism:* Good for outcomes, ignores the lying/misleading distinction (which the prompt asks to preserve).

  9.  **Refining the Output:**

      *   Tone: Professional, philosophical, direct, slightly cynical about bureaucracy (matching the user's "told my cases are unrealistic" vibe).
      *   Structure:
          1.  Specification/Desiderata List (NN vs CP).
          2.  Structural Requirements Analysis (The Trilemma).
          3.  Evaluation of Option-Space View.
          4.  Impossibility Result.
          5.  Appendix (Table).

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Interpreter Case"? *Adjustment:* Ensure the "Chain of Custody" desideratum covers the interpreter's role.
      *   *Check:* Did I address "Hostile Uptake"? *Adjustment:* Ensure "Reasonable Uptake" limits speaker liability.
      *   *Check:* Is the distinction between NN and CP clear? *Adjustment:* Make sure CP items are identified as philosophical debates that don't help the hospital committee.
      *   *Check:* The User asked "Which single requirement excludes the most candidates?" *Answer:* Auditability. It kills most nuanced philosophical accounts.
      *   *Check:* "Which demands are camp prejudice?" *Answer:* The strict Lying vs. Misleading distinction itself is often philosophical preference; however, since the prompt *asks* for an account of the difference, I must treat the *existence* of the distinction as NN, but the *metaphysical basis* (assertion vs. implication) as CP.

  11. **Final Polish:** Ensure the "Impossibility Result" is stark. The tension between *Hollow-Option* (needs nuance) and *Auditability* (needs bright lines) is the killer.

  *(Self-Correction on the Option-Space View)*: The user asks if Hollow-option and Deferred-disclosure *sink* it. Morally, no. Administratively, yes. I need to be precise here. The prompt asks if they sink it *for this purpose*. For this purpose (auditable code), the epistemic access problem sinks it.

  *(Refining the Impossibility Result)*: The triad is {Retrospective Auditability, Sensitivity to Power Dynamics (Hollow Option), Simplicity (Teachability)}. You can pick two. If you pick Audit + Simple, you miss Hollow Options. If you pick Sensitive + Simple, you can't Audit. If you pick Audit + Sensitive, you can't Teach.

