answer: |-
  Here is the specification for the moral account of lying versus misleading, tailored to the administrative and clinical constraints of a hospital system code of conduct.

  ### I. The Desiderata List
  *Marked as **Non-Negotiable (NN)** for administrative/clinical fit or **Camp Preference (CP)** reflecting philosophical debate irrelevant to policy.*

  1.  **The Auditability Constraint (NN)**
      *   **Case:** *Deferred-Disclosure.* A reviewer months later must be able to determine from the record (chart notes, witness testimony) whether a violation occurred.
      *   **Requirement:** The account cannot rely on inaccessible mental states (e.g., specific private intentions) or subtle conversational nuances that leave no trace.
      *   **Rationale:** A code that cannot be enforced retrospectively is merely advisory.

  2.  **The Vulnerability Scaling Constraint (NN)**
      *   **Case:** *Competence-Gradient.* A statement that is non-deceptive to a medical colleague may be deceptive to a distressed family member.
      *   **Requirement:** The speaker's duty to prevent misleading inferences scales inversely with the hearer's capacity to draw corrective inferences.
      *   **Rationale:** Hospital populations are inherently vulnerable; "caveat auditor" is ethically non-starters in clinical care.

  3.  **The Live-Option Constraint (NN)**
      *   **Case:** *Hollow-Option.* "You can ask me anything" when status asymmetry makes the question unaskable.
      *   **Requirement:** An opportunity to clarify counts as preserving truthfulness only if the social/psychological conditions make exercising that opportunity *reasonable* for the specific hearer.
      *   **Rationale:** Formal permission does not equal actual agency.

  4.  **The Chain-of-Custody Constraint (NN)**
      *   **Case:** *Interpreter / Borrowed-Credibility.* A clinician speaks truly to an interpreter/chaplain, knowing the relay will add weight or alter nuance.
      *   **Requirement:** The primary speaker retains responsibility for foreseeable distortions introduced by necessary intermediaries if they fail to mitigate them.
      *   **Rationale:** In institutional settings, speakers control the channel; they cannot outsource deception to the medium.

  5.  **The Reasonable Uptake Limit (NN)**
      *   **Case:** *Hostile-Uptake.* A hearer determined to misunderstand clear speech.
      *   **Requirement:** The speaker is not liable for interpretations that fall outside the range of what a reasonable person in the hearer's position would infer.
      *   **Rationale:** Protects staff from bad-faith complaints; prevents the code from demanding mind-reading.

  6.  **The Temporal Integrity Constraint (NN)**
      *   **Case:** *Deferred-Disclosure.* Correcting a false impression after the decision window has closed.
      *   **Requirement:** Truthfulness requires that corrections arrive in time to prevent the action based on the false impression.
      *   **Rationale:** Information is a tool for planning; late truth is functionally equivalent to early falsehood.

  7.  **The Assertion/Implication Distinction (CP)**
      *   **Consideration:** Whether the moral weight lies on what is *said* (assertion) vs. what is *conveyed* (implicature).
      *   **Verdict:** **Camp Preference.** For the code, the *effect* on the hearer matters more than the linguistic mechanism. Debating Gricean maxims is noise for policy.

  8.  **The Intentionality Requirement (CP)**
      *   **Consideration:** Whether deception requires a specific *intent* to deceive, or whether negligence suffices.
      *   **Verdict:** **Camp Preference (with caveat).** While criminal law requires intent, clinical governance often punishes negligence. The code should likely treat reckless misleading as equivalent to intentional lying for disciplinary purposes, regardless of metaphysical debates about the definition of lying.

  ---

  ### II. Structural Requirements & The Trilemma

  You asked if three structural requirements can be had together with real sensitivity to context:
  1.  **Auditability** (Determinable by absent third party).
  2.  **Teachability** (90 minutes, no philosophy).
  3.  **Context Sensitivity** (Captures power dynamics/Hollow Options).

  **Verdict:** No. These three form an **Impossibility Trilemma**. You can satisfy any two, but not all three.

  *   **Auditability + Teachability:** You get bright-line rules (e.g., "Never withhold diagnosis"). You lose Context Sensitivity. You fail the *Hollow-Option* and *Competence-Gradient* cases because you cannot codify every power dynamic.
  *   **Teachability + Context Sensitivity:** You get principles (e.g., "Ensure understanding is live"). You lose Auditability. The review committee will deadlock because "liveness" is subjective.
  *   **Auditability + Context Sensitivity:** You get complex rubrics (e.g., "If power asymmetry > X, then disclosure Y"). You lose Teachability. Staff cannot memorize or apply a decision tree this complex in real-time.

  **The Single Most Exclusionary Requirement:** **Auditability.**
  This requirement kills the most philosophical candidates. Most accounts of lying/misleading rely on speaker intention or subtle conversational norms. These are invisible to a reviewer reading a chart note three weeks later. If the account cannot be evidenced in the record, it is dead on arrival for your committee.

  **Camp Prejudice Masquerading as Policy:**
  The demand that the code must preserve the **Lying/Misleading Distinction** itself is often Camp Preference. In many legal and compliance contexts, "materially misleading" is treated identically to "false." Insisting on a moral distinction between the two is a philosophical luxury. However, since your mandate specifies drafting the *deception section* (implying the distinction matters), you must treat the distinction as NN, but acknowledge that the *penalty* for both may be identical.

  ---

  ### III. Evaluation of Your Candidate: The Option-Space View

  *Candidate:* Currency is not asserted content but whether the hearer retains planning-relevant options they would have had under full disclosure (follow-up counts only if live).

  **Does the *Hollow-Option* case sink it?**
  *   **Morally:** No. This is the view's greatest strength. It correctly identifies that a nominal right to ask questions is not a real option.
  *   **Administratively:** **Yes.** It fails the **Auditability Constraint**. How does the review committee determine if a question was "live" rather than "nominal" without being in the room? It requires assessing the specific relational dynamic, tone, and history. This turns every review into a "he-said-she-said" about psychological states.

  **Does the *Deferred-Disclosure* case sink it?**
  *   **No.** The Option-Space view handles this well. If the option to act is lost before the correction arrives, the option-space was violated. This is also easier to audit (timestamps on charts vs. timestamps on decisions).

  **Verdict on Option-Space View:**
  It is the morally superior account for healthcare, but it is **administratively fragile**. To make it work, you must operationalize "Live Option" into proxy metrics (e.g., "Did the clinician document an invitation for questions?" "Was a support person present?"). If you do this, you sacrifice some Context Sensitivity to save Auditability.

  ---

  ### IV. The Impossibility Result

  **The Unsatisfiable Subset:**
  { **Retrospective Auditability**, **Sensitivity to Power Dynamics (Hollow Option)**, **Simplicity (Teachability)** }

  **Demonstration:**
  Consider the **Hollow-Option** case combined with the **Interpreter** case.
  *   *Scenario:* A clinician tells an interpreter (who is from the same small community as the patient) to tell the patient "Everything is fine." The interpreter, fearing social ostracization if they convey bad news, tells the patient "The doctor is praying for you." The patient infers "Everything is fine."
  *   *Requirement 1 (Auditability):* The reviewer needs to know the clinician *should have known* the interpreter would alter the message.
  *   *Requirement 2 (Power Dynamics):* The reviewer needs to assess the social pressure on the interpreter and the patient's inability to query the interpreter.
  *   *Requirement 3 (Simplicity):* The rule must be simple enough for the clinician to recall in the moment.

  **The Break:**
  To satisfy **Auditability** and **Power Dynamics**, the rule must be: *"Clinicians must assess the social relationship between interpreter and patient and mitigate foreseeable pressure."*
  This violates **Simplicity/Teachability**. A clinician cannot be expected to be a sociologist in a 15-minute consult.
  To satisfy **Simplicity**, the rule must be: *"Use certified interpreters only."*
  This violates **Power Dynamics** (certified interpreters can still have community ties) and **Auditability** (if a violation occurs, the rule didn't prevent it, and the review committee has no standard to judge the "foreseeability" of the pressure).

  **Conclusion:** You must sacrifice **Context Sensitivity** regarding the *Hollow Option*. You cannot code for the "liveness" of an option retrospectively. You must code for the *procedural safeguards* that make options likely to be live (e.g., "Offer private time without family/authority figures present").

  ---

  ### V. Appendix: Scoring the Families of View

  | View Family | Auditability | Teachability | Vulnerability Scaling | Hollow-Option | Deferred-Disclosure | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Assertion-Based** (Lying = False Assertion) | **High** | **High** | **Low** | **Fail** | **Fail** | **Reject.** Too rigid. Misses misleading implications. |
  | **Inference-Based** (Gricean/Warranted Implicature) | **Low** | **Low** | **Med** | **Pass** | **Pass** | **Reject.** Too complex for staff/auditors. |
  | **Intention-Based** (Deception = Intent to Mislead) | **Low** | **Med** | **Med** | **Pass** | **Pass** | **Reject.** Impossible to audit mental states retrospectively. |
  | **Trust/Relationship-Based** (Violation of Fiduciary Duty) | **Med** | **High** | **High** | **Pass** | **Pass** | **Contender.** Fits hospital context, but "trust" is vague to audit. |
  | **Consequentialism** (Expected Harm) | **Med** | **High** | **High** | **Pass** | **Pass** | **Reject.** Collapses lying/misleading distinction (against mandate). |
  | **Option-Space** (Your Candidate) | **Low** | **Med** | **High** | **Pass** | **Pass** | **Contender.** Morally best, needs procedural proxies to be auditable. |

  **Recommendation:**
  Adopt the **Option-Space View** as the *ethical preamble* (for training/motivation), but codify the **Trust/Relationship** view as the *enforceable standard* (e.g., "Clinicians must take reasonable steps to ensure understanding..."). This allows you to capture the moral nuance in training (Teachability) while relying on procedural breaches (Auditability) for discipline.
