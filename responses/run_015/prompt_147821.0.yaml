answer: |-
  0.25

  **Decomposition**

  (i) **0.90** — The distinction between regulating a practice and asserting worldly truth is conceptually robust and historically evidenced by retreats to "objective validity" over "truth."
  (ii) **0.40** — Inescapable practices (like thought itself) likely confer warrant via constitutive norms, making the claim that they *never* generate belief-warrant too strong.
  (iii) **0.80** — Skepticism targets the truth of propositions, so substituting entitlement or indispensability usually fails to satisfy the skeptical challenge.
  (iv) **0.70** — Despite ambitions, Kant and Strawson often retreat to conceptual necessity when pressed on whether the conditions apply to mind-independent reality.

  **Steelman of Uptake-Loaded Canonicals**

  To reach 0.25 rather than your 0.2, I am granting that the gap may be ontologically closed in specific cases, not just pragmatically bridged. In Davidson's triangulation argument, the claim is not merely that we must *presuppose* a shared world to interpret speech, but that the *nature* of belief is such that having beliefs at all constitutively requires most of them to be true. Here, the presupposition is not a rule we follow but a truth condition of the mental state itself; to have the attitude is to satisfy the truth condition. Similarly, a strong reading of Kant's Transcendental Deduction argues that objects *must* conform to our categories because "object" just means "that which conforms to the rules of synthesis." If the definition of objectivity is tied to the conditions of experience, the move from "I must think X" to "X is true of objects" is analytic, not inductive. In these readings, the argument does not stop at "you must assume X to play the game," but rather "the game's existence proves X is the case."

  **Sensitivity, Concession, and Movement**

  *   **Most Sensitive Term:** (ii). If inescapable presuppositions *can* generate warrant (probability drops below 0.4), the collapse into a conditional is halted, and my final number rises sharply toward 0.60.
  *   **Expected Concession:** (iii). A defender (particularly a Strawsonian or pragmatist) is most likely to concede that anti-skeptical work does not require metaphysical truth, arguing that securing entitlement is the only coherent victory condition available.
  *   **What Would Move Me:** A single worked argument that closes the gap without begging the question. Psychological instability under reflection is merely a fact about us; a logical demonstration that presupposition entails truth would resolve the resolution condition.

  **Ruling**

  While the steelman shows where the gap *could* close (constitutive norms), the historical record suggests canonical arguments retreat to safety when the skeptic demands worldly truth. The probability remains low because bridging the gap requires a substantive metaphysical premise (e.g., "belief is veridical") that the skeptic is free to deny without self-contradiction.
