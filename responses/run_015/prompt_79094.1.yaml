answer: |-
  This is a fantastic set of questions, and you are absolutely right to feel that the practice is metaphysically weird. You aren't overthinking it; you've identified the exact tension that makes this a fertile topic for a poli-phil paper. The practice of state apology for historical wrongs is a "cluster concept" that tries to do moral, legal, and political work simultaneously, often using contradictory machinery to do it.

  Here is a reconstruction of the theory that makes this practice coherent, broken down by your specific questions, followed by an analysis of what is required versus contingent, and how rival theories fit in.

  ### 1. The Core Reconstruction: The Diachronic Corporate Agent
  Your gut is half-right. For the practice to make sense *as an apology* (rather than just a statement of regret), it does presuppose a specific metaphysical view of the state.

  **The Required View:** The state must be viewed as a **Diachronic Corporate Moral Agent.**
  *   **Diachronic:** It persists through time as the *same* entity despite the total turnover of its human components (citizens, leaders). This solves the "I wasn't born yet" problem. The current government isn't apologizing for *their* personal actions; they are speaking as the current "voice" of the enduring corporate entity that *did* act.
  *   **Corporate Moral Agent:** The state is capable of bearing moral responsibility distinct from the sum of its citizens' responsibilities. It can incur moral debts that transfer across generations.

  **Without this view,** the apology collapses into either (a) a lie (claiming responsibility you don't have) or (b) mere theatre (your flatmate's view).

  ### 2. Required vs. Contingent Features
  Let's run your specific puzzles through this reconstruction to see what is essential to the practice and what is just political padding.

  #### A. The "No Liability" Clause: Red Herring or Essential?
  **Verdict:** Essential, but not for the reason you think.
  *   **Theory:** This clause preserves the distinction between **Moral Responsibility** and **Legal Liability**.
  *   **Why it's required:** If the apology admitted *legal* liability, it would trigger statutes of limitation, open the treasury to infinite tort claims, and likely never be passed by a legislature. The "no liability" clause creates a **moral safe harbor**. It allows the state to say, "We own this moral stain," without saying, "Write us a bill."
  *   **Does it gut the point?** No, provided you accept that moral responsibility exists independently of legal enforceability. If you believe morality *requires* enforceability (legal positivism), then yes, it guts it. But if you believe in moral duties that exceed legal ones, the clause is just a boundary marker.

  #### B. The Audience: Who is the "Sorry" for?
  **Verdict:** Tripartite Audience (The Living, The Record, The Self).
  *   **The Dead:** You asked if this requires a controversial view that the dead can be wronged. **Strictly speaking, no.** The practice works better if we assume the apology is for the *survivors* (descendants, community) and for the *historical record*.
  *   **The Living (Descendants):** The apology acknowledges that the *effects* of the wrong persist (intergenerational trauma, structural inequality).
  *   **The State's Self-Image:** This is crucial. The apology is a **constitutive act**. By apologizing, the state redefines its own identity. It says, "The state that did this is us, but the *values* of the state that is apologizing are different." It's a ritual of civic renewal.
  *   **Compatibility:** You don't need to believe the dead have rights. You only need to believe the *living* have a right to truth and recognition of their history.

  #### C. Remorse vs. Commitment (The Flatmate's Objection)
  **Verdict:** It presupposes **Symbolic Remorse** functioning as a **Forward-Looking Commitment.**
  *   Your flatmate says it's a "promise about the future wearing the costume of a statement about the past." This is actually a sophisticated philosophical position (associated with scholars like Nick Smith or Trudy Govier).
  *   **Required View:** The state cannot feel biological emotions (remorse). Therefore, it must presuppose that **institutional remorse** is real. This is expressed through the *cost* of the apology (political capital, reputation).
  *   **The "Cost" Signal:** If it were just theatre, it would be cheap. Because it is politically costly (admitting national shame), it functions as a credible signal of future commitment. The "cost" substitutes for the "feeling."

  #### D. The Utterer: Head of State vs. Parliament
  **Verdict:** Contingent, but signals different theories of agency.
  *   **Head of State/PM:** Implies the state is a unified agent with a single voice. More emotionally potent, fits the "continuous agent" model.
  *   **Parliamentary Motion:** Implies the state is a deliberative body. Less personal, more bureaucratic.
  *   **Requirement:** For the apology to land as *moral*, it usually requires a human face (PM/President) to embody the corporate agent. A piece of paper feels more like the "theatre" your flatmate describes.

  #### E. The 1904 vs. Last Year Inconsistency
  **Verdict:** This is political strategy, not metaphysical inconsistency.
  *   Apologizing for 1904 is "cheap" morally (no one is legally liable) but high in symbolic value.
  *   Apologizing for last year is legally dangerous (admissibility in court, immediate compensation claims).
  *   **Theory:** This doesn't undermine the theory of collective responsibility; it highlights the **tension between moral and legal systems**. The practice relies on the *distance* of time to allow the moral acknowledgment to happen without the legal consequences triggering.

  ### 3. Compatibility with Rival Theories
  You asked to stop assuming there is one hidden view. Here is how different theories can coexist with the practice, even if they explain it differently.

  1.  **Liberal Individualism (The Skeptic):**
      *   *View:* Collectives can't be responsible, only individuals.
      *   *Compatibility:* They can support the apology **instrumentally**. It promotes social stability, reconciliation, and trust in institutions. They don't need to believe the state is "guilty," only that the *statement* is useful.
      *   *Cost:* They have to treat the word "apology" as a metaphor.

  2.  **Critical Theory / Historiography:**
      *   *View:* The apology is about power and narrative.
      *   *Compatibility:* This explains the **criminalization of denial** you noticed. The apology isn't just saying sorry; it's establishing an **Official Truth**. Once the state apologizes, the event becomes "State Fact." Denying it becomes an attack on the state's legitimacy.
      *   *Fit:* This fits the "no liability" clause perfectly. The state wants the moral authority of truth-telling without the financial cost of reparations.

  3.  **The Flatmate's Legal Realism:**
      *   *View:* It's performative speech acts.
      *   *Compatibility:* This is compatible with the **Forward-Looking Commitment** view. The apology is a "illocutionary act" that changes the normative landscape. It doesn't need "real" remorse; it needs "valid" procedure.

  ### 4. The "Swap" Test: What if we change the presuppositions?
  To help your paper, imagine changing the core theory. Here is what breaks in the practice:

  *   **Swap 1: Drop "Continuous Agency" for "Trustee Model."**
      *   *New View:* The current state is just a trustee managing the legacy of the past.
      *   *What changes:* The wording shifts from "We apologize" to "We acknowledge the wrongs committed by our predecessors." The emotional weight drops. It becomes a statement of *regret* rather than *apology*. The "no liability" clause becomes redundant (trustees aren't liable for predecessor torts usually).
      *   *Result:* The victims' descendants are less likely to accept it as genuine.

  *   **Swap 2: Drop "Moral/Legal Split."**
      *   *New View:* Moral responsibility entails legal liability.
      *   *What changes:* The "no liability" clause is removed. The apology is immediately followed by a reparations fund.
      *   *Result:* Far fewer apologies happen. States would avoid apologizing for anything older than the statute of limitations. The practice would become rare and purely judicial.

  *   **Swap 3: Drop "Dead can be addressed" for "Only Living matter."**
      *   *New View:* The dead have no standing.
      *   *What changes:* The apology focuses entirely on *current* structural inequalities caused by the past, rather than the past act itself.
      *   *Result:* The language becomes technocratic ("We aim to fix disparities") rather than moral ("We are sorry for the massacre").

  ### 5. Summary for Your Response Paper
  If I were structuring this for a Friday deadline, I would argue the following thesis:

  **Thesis:** The practice of state apology for historical wrongs is only coherent under a theory of **Diachronic Corporate Moral Agency**, but it functions pragmatically by maintaining a strict firewall between **Moral Acknowledgment** and **Legal Liability**.

  **Key Points to Hit:**
  1.  **Metaphysics:** It requires the state to be a "person" that survives time (solving the non-identity problem).
  2.  **Function:** It is not primarily about the dead (who cannot receive it) but about the **civic identity of the living** and the **establishment of official truth** (explaining the denial laws).
  3.  **The Flatmate's Grain of Salt:** He is right that it is forward-looking (a commitment to non-repetition), but wrong to call it *mere* theatre. The political cost makes it a "costly signal" of moral change.
  4.  **The Liability Clause:** This is not a contradiction; it is the enabling condition. Without it, the moral apology would be silenced by legal fear.

  **One final thought for the "Overthinking at 2am" feeling:**
  The confusion you feel is the point. The practice is a **hybrid**. It uses the *language* of morality (sorry, guilt, remorse) to do the *work* of politics (reconciliation, stability, identity) while avoiding the *mechanisms* of law (liability, compensation). It's a category error that we have collectively agreed to treat as a category truth. Your paper should expose that tension, not necessarily resolve it.

  Good luck with the seminar. This is strong material.
