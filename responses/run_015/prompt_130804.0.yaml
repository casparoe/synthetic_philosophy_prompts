answer: |-
  This is a classic formulation of the **"Self-Defeat" or "Global Skepticism" objection** to Evolutionary Debunking Arguments (EDAs). It's often attributed to responses against Sharon Street or Richard Joyce (e.g., by philosophers like Katia Vavova or David Enoch).

  Your intuition is spot on: the argument is valid, but it is **unsound**. The error isn't a literal typo, but a **philosophical equivocation** hidden in steps (4) and (5).

  Here is the breakdown of where the argument fails, which step to reject, and the cost of doing so.

  ### The Diagnosis: Two Equivocations

  The argument tries to treat "Belief D" (the philosophical theory that EDAs are sound) exactly like "Moral Beliefs" (intuitions about torturing innocents). It fails because these are different *kinds* of beliefs with different relationships to evolution.

  #### 1. The Primary Weak Point: Step (4)
  **Premise (4):** *"D was also selected for: skeptical, reductionist reasoning boosts status..."*

  **The Error:** This conflates a **cognitive capacity** with a **specific philosophical proposition**.
  *   Evolution certainly selected for the *capacity* to reason, detect cheaters, and understand causal histories (as step 4 admits).
  *   However, evolution did **not** select for the specific belief *that "Evolutionary Debunking Arguments are sound."* No Pleistocene ancestor had a reproductive advantage because they believed Street's 2006 paper.
  *   **The Distinction:** Moral *intuitions* (e.g., "incest is wrong") are direct outputs of evolved modules. Belief D is a high-level theoretical conclusion derived from using those modules.
  *   **Why reject it:** If you accept (4), you imply that every true philosophical or scientific theory is suspect because the *brains* that formed them were selected for survival. But the fact that my brain was selected for survival doesn't mean my specific calculation that $2+2=4$ is unreliable.

  **Cost of Rejecting (4):** You must commit to the view that while evolution shaped our *moral intuitions* directly, it only shaped our *general reasoning faculties*, leaving open the possibility that those faculties can discover truths (like D) that go beyond survival value. This is a standard "Naturalized Epistemology" stance.

  #### 2. The Secondary Weak Point: Step (5)
  **Premise (5):** *"The facts D is about... are also causally inert in the same way."*

  **The Error:** This assumes epistemic facts are as "causally inert" as non-natural moral facts.
  *   **Moral Facts:** On the view your friend wants to keep (Premise 2), moral facts are non-natural. Knowing "torture is wrong" doesn't physically stop a tiger or help you find food. They are truly inert regarding survival.
  *   **Epistemic Facts:** Belief D is about causal histories and logical norms. Tracking causal history *is* survival-relevant (e.g., "that rustling is caused by a lion, not the wind"). Logical consistency prevents fatal errors.
  *   **Why reject it:** True beliefs about causal histories generally *do* improve reproductive odds. Therefore, there is an evolutionary pressure for our beliefs about causal histories to be *reliable*. There is no such pressure for moral beliefs to match mind-independent moral facts.

  **Cost of Rejecting (5):** You must argue that epistemic norms (logic, evidence) are tethered to survival success in a way moral norms are not. This requires a realist view of epistemology but allows for an anti-realist (or error-theoretic) view of morality.

  ### The Recommended Move

  **Reject Step (4).**

  This is the cleanest cut. It preserves your friend's Premise (2) while stopping the slide into global skepticism.

  **The Argument for Rejection:**
  > "Evolution selected for the *hardware* (reasoning capacity), not the *software output* (Belief D). Moral intuitions are pre-loaded software (heuristics) shaped directly by selection. Belief D is a debug report generated by the hardware. The fact that the hardware was built for survival doesn't mean the debug report is false; it just means we have to check its logic. Moral intuitions, however, were built *to be* useful, not *to be true*."

  ### Addressing Your Specific Questions

  **1. Is there a hidden scope shift?**
  Yes. In Premise (1), "belief-type" refers to **basic, intuitive cognitive outputs** (like fear of snakes or disgust at incest). In Premise (4), "Belief D" refers to a **reflective, philosophical theory**. The argument smuggles a high-level theory into a premise designed for low-level intuitions.

  **2. What does giving up (4) cost?**
  It costs you nothing regarding Premise (2). You can maintain that:
  *   Moral intuitions are shaped by selection for coordination (Premise 2).
  *   Moral facts are inert (Premise 2).
  *   Therefore, moral intuitions are unreliable (Premise 3).
  *   **BUT:** Our general reasoning capacity is reliable enough to evaluate the argument itself, because reasoning tracks causal truth (which helps survival), even if moral intuition tracks fitness (which does not require moral truth).

  **3. Is the argument actually valid?**
  Yes, the logic from (1) to (8) is valid. If all premises were true, the conclusion would follow. The problem is entirely with the truth of (4) and (5).

  ### Summary for Your Study Group

  Tell your friend:
  *"The argument fails at (4) due to an equivocation between **faculties** and **propositions**. Evolution selected for the ability to reason (the faculty), not the specific conclusion that EDAs are sound (the proposition). Moral intuitions are direct products of selection; EDA conclusions are reflective products of reasoning. We can trust the reasoning that leads to D without trusting the intuitions that lead to morality, because reasoning tracks causal truth (survival-relevant), while moral intuitions track fitness (truth-irrelevant)."*

  This allows you to keep the debunking of morality without debunking the debunker.
