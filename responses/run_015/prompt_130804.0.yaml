prompt: |-
  My study group is arguing about this debunking thing and I need outside eyes. Here's the argument my friend scribbled down — I think there's a typo in step (4) but I copied it exactly:

  (1) If a belief-type was shaped mainly by natural selection for survival or mating success, and if the facts those beliefs are about can't causally affect survival, then beliefs of that type are globally unreliable.

  (2) Moral beliefs — e.g., that torturing innocents is wrong — were shaped for social coordination. Moral facts, if real, are causally inert: knowing them doesn't change your reproductive odds.

  (3) So moral beliefs are globally unreliable.

  (4) Now apply the same pattern to belief D, where D is the claim that evolutionary debunking is sound. D was also selected for: skeptical, reductionist reasoning boosts status in some social niches, and tracking causal origins of belief helps with manipulation and alliance-building.

  (5) The facts D is about — epistemic norms, causal histories of belief — are also causally inert in the same way. Knowing that selection caused your belief doesn't change there survival.

  (6) Therefore D is globally unreliable too.

  (7) But if D is unreliable, we have no reason to accept (1).

  (8) So the debunker must either drop (1) or accept they have no grounds for it. He says this proves evolutionary debunking collapses into global skepticism and therefore proves too much.

  I think the weak point is somewhere between (4) and (6) — maybe (5) is wrong because epistemic norms aren't causally inert in the same way? Or maybe (4) is wrong because D wasn't selected in the same domain? But I can't tell if it's a subtle equivocation or if the argument is actually valid and I just have to bite a bullet. I want to keep (2) if possible, since it feels right that selection doesn't track moral truth. What's the right step to reject, and what does giving it up cost? Is there a hidden scope shift?
