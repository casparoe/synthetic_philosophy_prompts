          *   *Is it fatal?* Yes, if the goal is to explain the *phenomenon* people point to. If the goal is just linguistic purity, it's fine. But Priya is pointing to a real behavioral pattern. If the user's theory absorbs all data without risk of refutation, it's dogmatic.
          *   *Distinction:* The user needs to admit that "motivated avoidance" *is* what people mean by self-deception. If they say "That's not SD, that's avoidance," they are fighting words, not concepts.

      *   **Part 3: Predictive Differences (User vs. Priya):**
