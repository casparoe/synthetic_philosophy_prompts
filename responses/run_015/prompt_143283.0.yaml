answer: |-
  ok, first off, you've got a good grip on the landscape. you're right to be suspicious of the "canonical" status of nuremberg versus the "sidelined" status of tokyo. that asymmetry isn't an accident; it's a feature of how the west built the post-war order.

  since you've got three years and limited influence, you can't rewrite the rome statute or convince the UN security council to stop using veto power. you're working on *discourse* and *conceptual framing*. your goal is to change how lawyers, NGOs, and scholars talk about legitimacy so that future courts (or universal jurisdiction cases) don't collapse under the same weight.

  here's the criteria i'm using to build this agenda:
  1.  **leverage:** does solving this unblock progress in actual cases (ICC, domestic UJ trials)?
  2.  **tractability:** can a philosopher/activist actually move the needle here, or is it a geopolitical hard constraint?
  3.  **dependency:** do other debates (like corporate liability, aggression, genocide) rely on this being settled?

  before i lay out the plan, we need to clear the deck on what's actually settled vs. what's still fought over. too many people treat the "victors' justice" critique as a settled historical fact when it's actually a live legal weapon.

  ### settled vs. contested (clear the fog)

  **settled (facts):**
  *   **one-sidedness:** both tribunals only tried the losers. no allied personnel were prosecuted for firebombing dresden or tokyo, or for dropping the atomic bombs.
  *   **retroactivity:** *ex post facto* laws were used. the charter defined crimes that didn't exist in positive international law at the time of commission (specifically "crimes against peace").
  *   **pal's dissent:** justice radhabinod pal voted to acquit all defendants. he argued the tribunal was victors' justice and that the law was applied retroactively.
  *   **nuremberg's shadow:** nuremberg is cited as the foundation of modern ICL (international criminal law); tokyo is treated as a messy footnote.

  **contested (interpretations):**
  *   **validity of precedent:** does the one-sidedness invalidate the legal principles established? (consensus among practitioners: no; consensus among critical legal scholars: yes; global south governments: heavily skeptical).
  *   **pal's reasoning:** was pal arguing from principle (anti-colonialism, strict positivism) or was he apologizing for japanese war crimes? (this is still fought over in japan vs. india vs. the west).
  *   **the "nuremberg promise":** does individual criminal responsibility actually deter future atrocities, or does it just individualize structural violence?

  ---

  ### the agenda: where to put your three years

  if i were in your shoes, i would ignore the pure metaphysics of *nullum crimen sine lege* and focus on the **politics of selectivity**. here's the prioritized list.

  #### priority 1: reframe "victors' justice" from a historical bug to a structural risk
  **the work:** stop treating victors' justice as something that happened *then* (1945) and start treating it as a structural vulnerability *now*.
  **why:** the biggest threat to the ICC and universal jurisdiction today isn't legal technicality; it's the perception of neocolonialism. when the ICC investigates africa but not the US/UK/Russia/China, it looks like tokyo/nuremberg 2.0.
  **leverage:** high. this directly impacts state cooperation. if you can articulate a framework for "procedural symmetry" (e.g., mechanisms that force courts to address why *only* one side is being investigated), you give courts a tool to defend their legitimacy.
  **dependency:** almost every current debate about ICC withdrawal (burundi, south africa, philippines) depends on this.
  **tractability:** medium. you can't force the UNSC to refer US soldiers, but you can shift the burden of proof. currently, courts assume they are neutral unless proven otherwise. your work should argue the burden should flip: if a situation is one-sided, the court must explicitly justify why the other side isn't liable.

  #### priority 2: recover pal, but not for the reasons you think
  **the work:** don't just publish "pal was right." publish "pal diagnosed the coloniality of international law."
  **why:** most western legal philosophy treats pal as a outlier or a moral relativist. that's lazy. pal's dissent wasn't just about retroactivity; it was about how international law was a club rule enforced by the colonizers against the colonized (even if japan was an imperial power itself).
  **leverage:** medium-high. this connects ICL to critical legal studies and third world approaches to international law (TWAIL). it gives activists in the global south a vocabulary that isn't just "anti-west" but "pro-rule-of-law consistency."
  **dependency:** this unlocks the ability to talk about aggression. "crimes against peace" (aggression) was the core of tokyo, but it's the most dormant crime today because powerful states don't want to be charged with invasion. pal's logic is the key to unlocking aggression prosecutions without it looking like show trials.
  **trade-off:** you will be accused of being soft on war crimes. you have to be explicit that critiquing the *tribunal* isn't exonerating the *defendants*.

  #### priority 3: the "customary law" bridge
  **the work:** tackle the *nullum crimen* problem not through natural law ("it was obviously wrong") but through customary international law (CIL) formation.
  **why:** the nuremberg defense was "this wasn't a crime when we did it." the court said "it was customary law." today, UJ cases still get bogged down in whether a norm was "customary" at the time.
  **leverage:** medium. this is technical, but it's the engine room of universal jurisdiction.
  **dependency:** high. if you can't justify CIL formation without circularity (it's law because states say it's law, but states only say it's law after the crime), UJ remains fragile.
  **tractability:** low/medium. this is dense legal theory. but if you can propose a "democratic CIL" model (where non-state actors/NGOs count toward custom), you modernize the nuremberg justification for the 21st century.

  ---

  ### what to deprioritize (the "do not touch" list)

  **1. pure historical revisionism on nazi/japanese guilt**
  *   **why:** don't spend time proving the nazis broke existing laws. morally, it's settled. legally, it's a rabbit hole. even if you prove they technically didn't violate the 1907 hague convention in every instance, it doesn't change the modern architecture of ICL.
  *   **impact:** zero downstream. no one is going to retry wwii.

  **2. natural law metaphysics**
  *   **why:** arguing that "some crimes are so evil they transcend positive law" is a dead end for policy. it sounds good in a commencement speech, but it doesn't help a judge in senegal decide if they can prosecute a chadian dictator for torture committed in 1995.
  *   **impact:** low. it alienates positivists without giving practitioners a tool.

  **3. trying to "fix" the UNSC veto**
  *   **why:** you have limited influence. trying to change the UN charter is a waste of three years.
  *   **impact:** none. focus on how UJ works *around* the UNSC, not how to fix the UNSC.

  ---

  ### the trade-offs and risks

  here's the hard part. if you pursue **priority 1 (selectivity)**, you risk legitimizing the "whataboutism" that dictators use to escape accountability. if you argue "you can't try me unless you also try your own soldiers," you might inadvertently give a blueprint for impunity.
  *   **mitigation:** you have to frame it as *procedural transparency*, not *conditional jurisdiction*. the court *can* try one side, but it must publicly document why the other side isn't liable. silence is what kills legitimacy.

  if you pursue **priority 2 (pal/tokyo)**, you risk being lumped in with japanese nationalists who use pal's statue to deny war crimes entirely.
  *   **mitigation:** be ruthless in distinguishing pal's *jurisprudence* from the *political appropriation* of it. focus on his critique of the *process*, not his findings on the *facts* of the nanking massacre.

  ### summary

  if i'm you, i spend year 1 on **priority 2** (reading pal, TWAIL scholars, and the tokyo transcripts) to build the theoretical foundation.
  year 2 on **priority 1** (writing policy papers for NGOs like HRW or Amnesty on how they frame "selective justice" critiques).
  year 3 on **priority 3** (bridging the theory to actual UJ case law, maybe amicus briefs).

  the core problem isn't retroactivity anymore; customary law has mostly absorbed that shock. the core problem is **legitimacy via asymmetry**. nuremberg worked because the allies held the guns and the pen. today, no one holds all the guns. if international law doesn't solve the "why only them?" question, it will remain a tool of the powerful, regardless of how sound the legal philosophy is.

  that's where the leverage is. fix the perception of fairness, or the court loses the power to act at all.
