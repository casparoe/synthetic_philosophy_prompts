answer: |-
  You have put your finger on a subtle but crucial distinction that often gets flattened in general discussions of confirmation. The short answer is: **No, there is no single, canonical label for this specific configuration in the standard philosophical lexicon.**

  It is frequently conflated with the **Problem of Old Evidence**, but as you correctly intuit, that conflation obscures the mechanism at work. It also overlaps with **theory-ladenness**, but that term is usually too broad (referring to perception or description) to capture the specific *normative shift* from "artifact" to "datum."

  However, your description maps precisely onto a specific niche in the philosophy of measurement and scientific practice, particularly in the work of **Hasok Chang** (on *epistemic iteration*) and **Deborah Mayo** (on *error statistics*).

  Since you asked for a term if none exists, and a rigorous delineation of boundaries, I propose we call this pattern **Evidential Reconstitution**.

  Below I explain why the standard labels fail, where the concept finds its philosophical home, and I set out the definition and boundary cases you requested.

  ### 1. Why "Old Evidence" is the Wrong Bucket
  The "Problem of Old Evidence" (formalized by Clark Glymour and others regarding Einstein's Mercury perihelion) assumes the evidence $E$ is **fixed and accepted as true** before the theory $H$ arrives.
  *   **The Bayesian Worry:** If $E$ is already known, $P(E) = 1$. If $P(E) = 1$, then $P(E|H) = 1$. Therefore, $P(H|E)$ cannot be greater than $P(H)$. The evidence cannot *confirm* the theory because it was already certain.
  *   **Your Case:** In your isotope and morphology examples, the "evidence" was *not* accepted as true. It was accepted as **false** (i.e., as contamination, noise, or error).
      *   At Time 1: The numbers existed, but their epistemic status was $\neg E$ (they were artifacts).
      *   At Time 2: The new theory provided a new error model or reduction algorithm. The numbers were re-processed, and their status became $E$ (they were signals).

  The confirmation does not come from $H$ explaining a known fact. It comes from $H$ **validating the reliability of the data** that was previously deemed unreliable. This bypasses the Bayesian "old evidence" blockage because the probability of the *data being valid* was not 1; it was near 0, and the theory raised it.

  ### 2. The Philosophical Home: Iteration and Error
  While there is no single label, your pattern is the engine behind two established philosophical concepts:

  **A. Epistemic Iteration (Hasok Chang)**
  In *Is Water H2O?* and *Inventing Temperature*, Chang argues that scientific knowledge advances not by linear accumulation, but by iterative cycles where measurement standards and theories co-evolve.
  *   **Resemblance:** Chang describes cases where "errors" in one system become "data" in another. He argues that we often cannot know if a measurement is accurate until we have a theory of what is being measured, but we cannot confirm the theory without accurate measurements.
  *   **Where it differs:** Chang focuses on the historical evolution of *standards* (e.g., what counts as a degree of heat). Your cases are about specific *data points* within a field changing status. Your observation is a micro-instance of Chang's macro-process.

  **B. Error Statistics (Deborah Mayo)**
  Mayo argues that science learns not by confirming theories, but by **ruling out errors**.
  *   **Resemblance:** In your first example, the isotope ratios were initially classified as "systematic error" (contamination). The new theory succeeded because it offered a better account of the error structure, allowing the "error" to be reclassified as "signal."
  *   **Where it differs:** Mayo focuses on the methodology of testing. You are describing the *ontological promotion* of the data itself.

  ### 3. Proposed Term: Evidential Reconstitution
  Since existing terms describe the context but not the specific move, I propose **Evidential Reconstitution**.

  **Definition:**
  *Evidential Reconstitution* occurs when a set of empirical records (raw traces, measurements, or observations) exists prior to a theoretical shift but is epistemically discounted (classified as noise, artifact, or error) under the prevailing theoretical framework. A new theoretical framework is introduced (independently of these specific records) which alters the **data reduction protocol** or **error model**. This allows the prior records to be re-processed or re-described, thereby promoting them from the status of *artifact* to the status of *datum*, providing strong confirmation for the new theory precisely because they were previously recalcitrant.

  **Key Mechanism:** The change is not merely in the *interpretation* of a fixed fact, but in the **construction of the fact** from the raw record. The "evidence" is not the number on the page; it is the number *after* correction for known biases. When the theory of biases changes, the evidence changes.

  ### 4. Boundary Cases: Deciding Membership
  To determine if a given instance belongs to *Evidential Reconstitution*, it must pass the following four boundary tests. If it fails any, it belongs to a different category.

  #### Boundary 1: The Status Test (vs. Old Evidence)
  *   **Question:** Was the evidence accepted as a reliable fact *before* the new theory arrived?
  *   **Evidential Reconstitution:** **No.** It was recorded but dismissed, suppressed, or bracketed as unreliable.
  *   **Old Evidence:** **Yes.** (e.g., The perihelion of Mercury was accepted as a fact before General Relativity; it was just unexplained).
  *   *Your Cases:* Pass. The ratios were "written off"; the morphology was "treated as noise."

  #### Boundary 2: The Independence Test (vs. Ad Hoc Accommodation)
  *   **Question:** Was the new theory constructed *specifically* to save these data points?
  *   **Evidential Reconstitution:** **No.** The theory arose from other considerations (e.g., internal consistency, other datasets). The reconstitution is a *consequence*, not a *design feature*.
  *   **Ad Hoc Accommodation:** **Yes.** The theory was tweaked solely to make the "noise" fit.
  *   *Your Cases:* Pass. You noted the new model was "not constructed with those ratios in mind."

  #### Boundary 3: The Reduction Test (vs. Simple Re-interpretation)
  *   **Question:** Did the confirmation require re-processing the raw data (changing corrections, algorithms, or morphological criteria), or merely looking at the same established fact differently?
  *   **Evidential Reconstitution:** **Yes.** The "re-reducing with better corrections" is essential. The *data reduction pipeline* is theory-dependent.
  *   **Theory-Laden Observation (Hanson):** **No.** (Usually). Hanson's "duck-rabbit" examples imply the *sensory input* is the same, but the *concept* changes. In your case, the *numerical value* or the *descriptive classification* actually changes because the correction for "contamination" is removed.
  *   *Your Cases:* Pass. You explicitly mention "re-reduced with better corrections."

  #### Boundary 4: The Instrument Test (vs. Technical Improvement)
  *   **Question:** Was the change in data quality due to a new instrument or a new theory?
  *   **Evidential Reconstitution:** **New Theory.** The raw traces existed; the *understanding* of how to clean them changed.
  *   **Technical Progress:** **New Instrument.** (e.g., "We couldn't measure this before, now we have a better mass spectrometer.")
  *   *Your Cases:* Pass. The numbers existed for thirty years; the *model* changed, not the machine.

  ### 5. Why This Matters Philosophically
  You noted that philosophers worry about evidence "already in hand." Your observation exposes a flaw in how philosophers model "evidence."

  Standard philosophy treats evidence as **propositional** (a statement that is either true or false).
  *   *Standard View:* "The isotope ratio is X." (True/False).
  *   *Your View:* "The isotope ratio is X *after applying correction model M*."

  In your cases, the theory changes $M$. Therefore, the proposition itself changes.
  *   $E_1$: Ratio is X (corrected for Contamination Model A) $\rightarrow$ Deemed False/Artifact.
  *   $E_2$: Ratio is Y (corrected for Contamination Model B) $\rightarrow$ Deemed True/Signal.

  The confirmation is powerful precisely because $E_1$ was a *failed prediction* of the old theory (it looked like error), while $E_2$ is a *successful prediction* of the new theory (it looks like signal).

  ### Summary
  You have identified a robust pattern that lacks a specific name. It is distinct from the **Problem of Old Evidence** because the evidence was not "known," but rather "discredited." It is a specific form of **Theory-Ladenness** applied to **Data Reduction**.

  I recommend adopting the term **Evidential Reconstitution**. It captures the constructive nature of the evidence (it was *constituted* anew) and the epistemic shift (it was *re-validated*). It honors the reality of your field: that in geochemistry, as in many sciences, a "datum" is not a stone found on the ground, but a number emerging from a dialogue between trace and theory. When the theory changes, the stone itself may turn out to be different.
