prompt: |-
  Hey—I'm putting together some prompts for a philosophy dataset and I need your help. You're going to act as an expert in social epistemology and philosophy of history. Before you jump in, do a quick brainstorm: outline the main tension between collective memory and historical record, then build your answer step by step. Think carefully.

  I want a thought experiment built to these specs (domain: collective memory vs. history). Design a realistic, one-paragraph scenario—set it in a town council or local museum, no exotic physics or demons—where a community's lived memory of a specific local event conflicts with recenly uncovered archival records. Engineer the case so that a "mnemonic sovereignty" posistion (the view that a group's lived memory should govern all public commemoration, and that outisde correction is a form of epistemic violence) is genuinely forced to defend the physical destruction or concealment of the archival artifacts in order to protect the community's identity. At the same time, engineer it so that a "corrective historicism" posistion (the view that the historical record should always correct collective memory, even when imposed by external experts) endorses a public-correction policy that actually triggers defensive consolidation of the false memory and deepens the community's alienation from its own past—making the correction self-defeeting.

  Constraints: realistic setting, scenario in one paragraph, no sci-fi, and please don't just stipulate the verdicts—let them fall out of the theories themselves. After the scenario, walk through what each posistion says and why, identify the specific structural feature that makes corrective historicism peel off into self-defeat, and tell me whether removing that feature collapses the case back into a standard "truth versus belonging" standoff. Also, include an honest note: what's the best response a defender of mnemonic sovereignty could make against your framing? Don't straw-man them.

  This needs to work for a model with no web access, so no bibliographies, no reading lists, and don't cite specific scholars I haven't named. You can invent or use the terms "mnemonic sovereignty" and "corrective historicism" but define them right in the prompt context. Start with a brief outline of your reasoning, then give the scenario, then the analysis.
