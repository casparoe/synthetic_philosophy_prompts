prompt: |-
  You are an expert philosopher of mind with deep familiarity with metaphysics, consciousness studies, and analytic argumentation. Think step by step: first briefly brainstorm the standard objections to panpsychist combination-problem solutions and how different audiences frame them; then move to the structured prep sheet.

  I am a PhD student in philosophy defending my thesis in a seminar next week. The thesis: panpsychism can answer the combination problem only if we reject both emergentist aggregation and quantum-coherence fusion, and instead adopt what I call phenomenal mereology—where macro-subjects are constituted by micro-subjects through a non-transitive relation of phenomenal overlap, so that consciousness is neither summed nor synthesized but structurally inherited without transitivity of parts. The audience is a philosophy-of-mind seminar composed mainly of analytic metaphysicians skeptical of panpsychism but well-versed in Chalmers, Goff, and related debates; one cognitive scientist who treats consciousness as computational; and my external examiner, a Kantian who holds that subjective unity requires transcendental synthesis. They value parsimony, explanatory transparency, and collapse-risk into emergentism or eliminativism.

  Prepare my Q&A defense sheet: list the eight objections I will actually face, ordered by likelihood and potential damage. For each objection, phrase it exactly as that audience member would phrase it using their vocabulary; provide a concise two-minute reply; note the weakest point in that reply; and indicate whether I should concede or hold firm. Include the objection I am hoping nobody asks—specifically, the challenge that non-transitive phenomenal overlap violates the principle of sufficient reason by allowing macro-phenomenal structure without a determinate ground in micro-phenomenal relations, and that my view therefore collapses into an unexplained primitive. Do not provide bibliographies, reading lists, or citations, and do not quote verbatim from any published text. Start with a brief audience-commitment brainstorm, then present the sheet in clear order. End with a single line beginning Bottom line: that summarizes my strategic posture going into the defense.
