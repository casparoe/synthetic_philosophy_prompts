  **The Case: The Department Sabbatical**

  A university department has one sabbatical release to award this year. It provides full pay and zero teaching duties for twelve months. It cannot be split or sold. Three faculty members are eligible: Alex, Blake, and Casey. All three are honest, fully informed about their own needs, and agree on the facts below.

  Alex is drafting a book that requires uninterrupted research. Without the release, the book cannot be finished, and Alex's core professional function will stall. With it, Alex completes the work.

  Blake's professional satisfaction depends heavily on relative standing. If either colleague receives the release while Blake teaches, Blake feels significantly demoted. Blake functions adequately without it, but welfare drops sharply if others hold the advantage.

  Casey designed a research plan feasible within regular terms because past allocation rules favored seniority, which Casey lacks. Casey scaled back ambitions to fit the expected constraint and reports contentment with the smaller plan, though the release would allow more.

  ** (a) Three Recommendations **

  1.  Award the release to Blake. This minimizes the gap in overall well-being between the three, preventing the severe drop in satisfaction that occurs when Blake is outperformed by colleagues.

  2.  Hold a random lottery among the three. This treats the release as a shared asset to which each holds an equal claim, regardless of how they plan to use it or how it makes them feel.

  3.  Award the release to Alex. This ensures each person retains the genuine freedom to pursue their core professional functions, prioritizing those whose abilities are constrained without the resource.

  ** (b) Objections and Replies **

  1.  **Recommendation One (Blake)**
      *   *Objection:* This rewards status anxiety and penalizes Alex for having a substantive project need.
      *   *Working Reply:* Equality targets actual life outcomes; ignoring how sensitive people are to relative standing leaves Blake significantly worse off than the others, violating the goal of equalizing how lives go.

  2.  **Recommendation Two (Lottery)**
      *   *Objection:* This wastes the release on someone who might not use it, rather than ensuring it does the most good.
      *   *Working Reply:* Justice concerns equal ownership of the means, not the value of the outcomes; respecting responsibility for tastes means the distribution must remain neutral toward them.

  3.  **Recommendation Three (Alex)**
      *   *Objection:* This ignores Casey's choice to scale back and imposes a judgment about what projects matter most.
      *   *Working Reply:* Equality protects the freedom to function, not just exercised choices; Casey's adaptation was a response to constraint, so restoring the option corrects the inequality in freedom.

  ** (c) The Hinge **

  The single feature driving the divergence is the mix of adaptive and comparative interests among the claimants. The welfare view counts these interests fully, aiming to equalize subjective states even if it means rewarding status sensitivity or ignoring adaptation. The resources view dismisses these interests as matters of personal taste, aiming to equalize the external means regardless of how they are experienced or utilized. The capabilities view distinguishes between them, ignoring status as non-essential but correcting for adaptation to restore genuine freedom. Each view diverges because it identifies a different currency as the proper object of equality: experienced well-being, external means, or substantive freedom.

  \answer{The moral weight of adaptive and comparative interests}
