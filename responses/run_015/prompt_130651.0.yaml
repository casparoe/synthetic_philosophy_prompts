      *   *Functionalist View:* Mental states are defined by their causal roles (inputs $\rightarrow$ internal state $\rightarrow$ outputs). If the grid maps inputs (traffic density) to outputs (light changes) via internal states (sensor data/algorithmic weights) in a way isomorphic to a brain, it *is* a mind.
      *   *Critique:* Is there genuine *intentionality* (aboutness)? Is there *phenomenology* (what it's like to be the grid)? Or is it just a "Chinese Room" on a city scale?

