      *   *Orwellian:* The brain lets the true experience happen, but then rewrites the memory *after* the fact (like a history book revision). The experience was one thing, the memory is another.
      *   *Color Phi:* Green dot -> Red dot -> Experience of motion + color change mid-path. No physical mid-path color exists.
      *   *Phenomenal Overlap (User's Case):* Audio/Visual mismatch (e.g., ventriloquism effect or McGurk-adjacent) experienced as simultaneous/unified despite neural latency differences. Needs a "common cause" inference mechanism.

