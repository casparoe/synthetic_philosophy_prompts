      *Refining the "Incompatibility" constraint:* The user wants me to flag pairs that can't be jointly satisfied. The classic Dennett move is to say the distinction *itself* is illusory (Multiple Drafts Model). So, a hard requirement might be "Define the Moment of Consciousness," but the incompatibility is that neuroscience suggests there *isn't* a single moment. I need to frame this carefully.
