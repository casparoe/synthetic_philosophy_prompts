answer: |-
  You have an excellent eye. You are noticing a genuine, recurring argumentative structure that sits at the boundary of computer science, cognitive science, and philosophy of mind. It does not have a single canonical name like *ad hominem* or *modus ponens*, but it is a recognizable "move" in this literature.

  The most precise technical label for the specific mechanism you described in the first case is **The Meta-Intractability Move** (or the **Recognition Objection**). The broader pattern across all three examples is a form of **Idealization Immunity**, often bordering on the **Nirvana Fallacy**.

  Here is the carving you asked for: what the move is, where it comes from, when it is legitimate, and when it is a swindle.

  ### 1. The Technical Carving: Object-Level vs. Meta-Level
  In the first case (NP-hardness), the argument shifts the locus of difficulty from the *object level* to the *meta level*.

  *   **Object-Level Claim:** "Solving problem $P$ is intractable."
  *   **Objection:** "Humans don't solve $P$; they solve a subset $S \subset P$, which is tractable."
  *   **The Move:** "Identifying whether an instance belongs to $S$ is itself intractable."

  In complexity theory, this touches on **Promise Problems** and **Distributional Complexity**. The argument asserts that the *distribution* of inputs the mind faces cannot be efficiently distinguished from the worst-case distribution.

  **Does it have a name?**
  In the philosophy of mind, this is most famously associated with **Jerry Fodor**, specifically his argument regarding **Globality** and the **Frame Problem** (e.g., in *The Mind Doesn't Work That Way*). Fodor argued that central cognitive processes (like belief fixation) are isotropic (anything can be relevant) and unencapsulated. Therefore, determining *which* information is relevant before processing it is computationally unbounded. If you can't efficiently filter the inputs, the intractability of the general process still applies.

  So, if you need a label to drop in the room, call it **The Fodorite Recognition Objection** or **The Meta-Complexity Shift**.

  ### 2. The Logical Carving: Idealization Immunity
  Your second and third examples (P=NP existence vs. feasibility; Exact Bayesian vs. Approximation) reveal a broader pattern. Here, the defender of the computational view is protecting a **Normative Ideal** against a **Descriptive Reality**.

  *   **Claim:** "Mind works like System $X$."
  *   **Objection:** "System $X$ is too slow/imprecise for real minds."
  *   **The Move:** "We aren't talking about speed/precision; we are talking about the *logical space* of the solution. The intractability/existence property holds regardless of constants/approximation."

  This is a sophisticated version of the **Nirvana Fallacy** (comparing a realistic alternative to an idealized one) but inverted. Usually, the Nirvana Fallacy is "Your solution isn't perfect, so it's worthless." Here, it is "Your solution works in practice, but it isn't the *Perfect Formal Object*, so the theoretical limitation still stands."

  I would call this **Formalist Immunity**. The argument retreats from empirical claims (how fast the brain is) to formal claims (what class the problem belongs to) to preserve the philosophical conclusion (the mind is constrained by this class).

  ### 3. When is it Legitimate? (The Real Reduction)
  The move is legitimate only if the cognitive architecture requires **explicit runtime recognition**.

  If the brain is a general-purpose computer that must *decide* which algorithm to run for each problem, then it must compute a "recognition function" to classify the input. If that classification function is NP-hard, then the system *is* intractable, even if the sub-algorithms are fast.
  *   **Example:** If a compiler must determine whether a piece of code is safe to optimize, and checking safety is undecidable, the compiler faces a real barrier.
  *   **Legitimacy Condition:** The "filter" must be a computational step the system actually performs.

  ### 4. When is it a Swindle? (The Architectural Confusion)
  The move becomes a swindle (or at least a category error) when it confuses **Runtime Computation** with **Evolutionary/Structural Constraint**.

  Most modern cognitive scientists (e.g., Gerd Gigerenzer, proponents of **Ecological Rationality**) argue that the brain does not *identify* easy instances; it is simply *built* to work on them.
  *   **The Swindle:** Assuming the mind needs to *check* if an instance is easy before solving it.
  *   **The Reality:** The mind is a specialized tool. A hammer doesn't "check" if a nail is present before striking; it just fails on screws. The "recognition" is baked into the hardware (or the learned weights of a neural net), not computed as a subroutine.
  *   **Why it's a swindle:** It posits a **Homunculus**. It assumes there is a little man inside the head looking at the problem, saying "Ah, this is one of the easy ones," and *then* handing it to the solver. If the recognition is implicit in the structure, there is no meta-complexity cost.

  ### 5. The Circularity Trap
  You correctly identified the circularity risk: *"the instances that matter look definable only by appeal to the very capacity we were trying to say something about."*

  This is the **Competence-Performance Conflation**.
  *   **Definition:** If you define "benign instances" as "instances humans successfully solve," then arguing "humans can't identify benign instances" is tautological. It translates to "humans can't identify instances humans solve."
  *   **The Fix:** To avoid circularity, the proponent of the move must define the "benign subset" independently of human performance (e.g., "instances with low treewidth," "instances with sparse structure").
  *   **The Failure:** Often, they cannot do this. They rely on the intuition that "real world problems are easy," but when pressed to formalize "real world," they retreat to "the ones we can solve." This makes the argument unfalsifiable.

  ### Summary for your Reading Group
  You are witnessing a defense of the **Tractable Cognition Thesis**. The participants are trying to preserve the philosophical force of complexity results (that the mind is limited) against empirical counterexamples (that the mind seems to work fine).

  *   **The Move:** **The Meta-Intractability Shift**.
  *   **The Logic:** Relocating the barrier from *solving* to *identifying*.
  *   **The Precedent:** **Fodor's Frame Problem**.
  *   **The Counter-Argument:** **Ecological Rationality** (the environment and the mind are co-adapted; no runtime recognition is needed).
  *   **The Swindle:** Assuming **Explicit Recognition** where **Implicit Constraint** suffices.
  *   **The Circularity:** Defining the domain of "tractable problems" by the set of "problems humans solve."

  If you want to intervene, ask this: *"Is the recognition of the tractable subset a runtime computation the brain performs, or is it a structural constraint of the brain's architecture? If it's structural, why does the meta-complexity cost apply?"*

  That question cuts directly to the bone of the move.
