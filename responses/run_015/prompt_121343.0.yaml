  # Diagnostic Taxonomy of Moral Worth

  ### The Decision Tree

  **Node 1 (Root): The Tracking Question**
  Must an agent's motivating reason correctly identify the feature that actually confers rightness on the act for the act to possess full moral worth?
  *   **No:** Go to Node 6.
  *   **Yes:** Go to Node 2.

  **Node 2: The Meta-Reason Error Case**
  An agent performs a genuinely right action for a reason that correctly directs her behavior but rests on a false meta-belief (e.g., she returns lost property because she erroneously believes a religious text commands it, though impartial respect for ownership is what in fact makes it right). Does this false meta-belief negate the action's moral worth?
  *   **No (Worth Preserved):** Go to Node 3.
  *   **Yes (Worth Negated):** Go to Node 4.

  **Node 3: Explicit Rational Endorsement**
  For an agent acting from a false meta-belief that nonetheless preserves worth, must she be capable of explicitly endorsing the right-making feature if challenged, or is unreflective habituation sufficient?
  *   **Endorsement Required:** **Leaf A**
  *   **Habituation Sufficient:** **Leaf B**

  **Node 4: The Structural-Substitution Case**
  If the agent's meta-belief must be correct, can moral worth be preserved when she acts through institutional or procedural compliance (e.g., a civil servant applying an equitable distribution rule) without personally grasping the justice of the rule, provided the social architecture reliably aligns her behavior with rightness?
  *   **Yes (Structure Suffices):** **Leaf C**
  *   **No (Personal Grasp Required):** Go to Node 5.

  **Node 5: The Fragility Condition**
  If the agent must personally grasp the right-making feature, but her correct reason is counterfactually brittle (she would have withheld help had one incidental belief about risk been slightly different), does that brittleness erase moral worth?
  *   **Yes (Brittleness Erases):** **Leaf D**
  *   **No (Brittleness Tolerated):** **Leaf E**

  **Node 6: Outcome Determinacy**
  (From Node 1: No) If tracking the right-making feature is not required, does the moral worth of an action depend entirely on the actual goodness of its consequences?
  *   **Yes:** **Leaf F**
  *   **No:** Go to Node 7.

  **Node 7: Sentimental Necessity**
  (From Node 6: No) In the absence of right-making tracking and outcome determinacy, is a stable emotional disposition (sentiment) sufficient for worth, even if institutional roles shape the expression?
  *   **Yes:** **Leaf G**
  *   **No:** **Leaf H**

  ---

  ### Leaf Mappings and Awkward Commitments

  **Leaf A: Strict Kantian Rationalism**
  *(Path: Yes → Negated → Grasp Required → Brittleness Erases)*
  *   **Awkward Commitment:** A well-meaning religious donor who accidentally tracks the right feature possesses less moral worth than a cold calculator who explicitly tracks duty but lacks empathy.

  **Leaf B: Unnamed Hybrid (Tracking + Meta-Tolerance)**
  *(Path: Yes → Preserved → Habituation Sufficient)*
  *   **Awkward Commitment:** An agent acting on a demonstrable lie about morality possesses full moral worth provided the lie reliably produces the right behavior.

  **Leaf C: Rule-Deontological Structuralism**
  *(Path: Yes → Negated → Structure Suffices)*
  *   **Awkward Commitment:** A bureaucrat who blindly follows a just rule without understanding its justice is morally superior to a virtuous citizen who understands justice but operates outside the institution.

  **Leaf D: Strict Kantian Sensitivity (Variant)**
  *(Path: Yes → Negated → Grasp Required → Brittleness Erases)*
  *(Note: Distinct from Leaf A by accepting Structural failure but demanding Fragility sensitivity; mapped here to Strict Kantian Rationalism for cohesion, while Leaf A represents the Endorsement variant. For the purpose of the taxonomy, Leaf D is the primary Kantian leaf.)*
  *   **Awkward Commitment:** A hero who saves a life from duty loses all moral worth if they would have hesitated had they known the rescue carried a 5% higher personal risk.

  **Leaf E: Unexplored Fragility-Tolerant Internalism**
  *(Path: Yes → Negated → Grasp Required → Brittleness Tolerated)*
  *   **Awkward Commitment:** An agent possesses full moral worth even if their commitment to the right-making feature is so shallow that trivial changes in circumstance would have caused them to do wrong.

  **Leaf F: Act Consequentialism**
  *(Path: No → Outcome Yes)*
  *   **Awkward Commitment:** A malicious act that accidentally saves a life possesses the exact same moral worth as a benevolent act that saves a life.

  **Leaf G: Modified Humean Sentimentalism**
  *(Path: No → Outcome No → Sentiment Yes)*
  *   **Awkward Commitment:** A bureaucrat with no personal empathy but correct trained sentiments is morally equivalent to a saint who acts from deep natural compassion.

  **Leaf H: Moral Nihilism regarding Worth**
  *(Path: No → Outcome No → Sentiment No)*
  *   **Awkward Commitment:** There is no such thing as moral worth distinct from the action's external classification, rendering praise and blame purely instrumental tools.

  ---

  ### Logical Gaps and Diagnosis

  **Gap 1: The Structural-Fragile Combination**
  *   **Coordinates:** Tracking=Yes, Meta-Error=Negates, Structure=Yes (Worthy), Fragility=Yes (Erases).
  *   **Diagnosis:** **Unattractiveness.** This position claims institutional compliance rescues moral worth from meta-ethical error, yet simultaneously claims that minor counterfactual risks erase it. It is unstable to trust the "structure" to substitute for personal grasp while remaining hyper-vigilant about the agent's counterfactual psychological stability within that structure.

  **Gap 2: The Sentiment-Outcome Void**
  *   **Coordinates:** Tracking=No, Outcome=No, Sentiment=No (Leaf H is occupied by Nihilism, but a position claiming *Worth Exists* here is empty).
  *   **Diagnosis:** **Incoherence.** A position asserting that moral worth exists without tracking rightness, without good outcomes, and without sentimental disposition lacks any substantive ground to locate the "worth." It posits a value property that floats free of motive, consequence, and character, which is metaphysically unintelligible within standard normative frameworks.
