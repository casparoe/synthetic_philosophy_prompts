answer: |-
  ### 1. Testing Your Principle Against the Seven Cases

  Your proposed principle is: *Commit to a posit only if (a) it does genuine work in deriving novel predictions, and (b) the posit/structure is preserved by a successor theory that explains why the proxy worked.*

  Here is how it maps against your verdicts:

  | Case | Posit | Clause (a): Novel Work? | Clause (b): Structure Preserved? | Principle Verdict | Your Verdict | Match? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Ether** | Yes (Fresnel) | Yes (Dragging coeff.) | **Real** | Not Real | **No** |
  | **2** | **Caloric** | Yes (Carnot) | Yes (Thermo struct.) | **Real** | Not Real | **No** |
  | **3** | **Phlogiston** | Weak/No | Yes (Oxidation struct.) | **Not Real/Real** | Not Real | **Maybe** |
  | **4** | **Atoms** | Yes | Yes | **Real** | Real | **Yes** |
  | **5** | **Bohr Orbits** | Yes | No (Orbitals replace) | **Not Real** | Not Real | **Yes** |
  | **6** | **$\Lambda$** | **No** (Initially) | Yes (GR preserves) | **Not Real** | Real | **No** |
  | **7** | **Dark Matter** | Yes | Yes (Gravity struct.) | **Real** (Structure) | Not Real (Particles) | **No** |

  **Diagnosis:** Your principle is too permissive regarding *structure* (counting mathematical survival as ontological reality in Cases 1, 2, 7) and too restrictive regarding *history* (penalizing posits that were initially ad hoc but later vindicated, like Case 6). It also validates your worry: Clause (b) makes reality retrospective, depending on future theory changes.

  ### 2. Repairing the Principle

  To accommodate your verdicts while minimizing retrospective dependence, I propose replacing your principle with the **Modular Indispensability Principle**.

  **The Principle:**
  A theoretical posit is real if:
  1.  **Empirical Indispensability:** It is required for the empirical adequacy of the *current* best theory (not just historically novel).
  2.  **Ontological Modularity:** Its identity is separable from the specific mechanistic model used to derive its effects.

  **Clause Work & Motivations:**
  *   **Clause 1 (Indispensability):** This shifts the focus from *historical origin* to *current utility*.
      *   *Motivated by Case 6 ($\Lambda$):* $\Lambda$ fails your Clause (a) because it was initially ad hoc. It passes Clause 1 because it is indispensable to $\Lambda$CDM now.
      *   *Motivated by Cases 1 & 2 (Ether/Caloric):* They fail Clause 1 because they are not indispensable to current physics, regardless of past success.
  *   **Clause 2 (Modularity):** This distinguishes between *mathematical structure* and *ontological commitment*.
      *   *Motivated by Cases 1 & 7 (Ether/DM):* The "dragging coefficient" or "extra gravity" is modular structure; the "luminiferous medium" or "particle" is the ontological posit. If the successor keeps the structure but drops the entity (Modified Gravity), the entity fails Clause 2.
      *   *Motivated by Case 5 (Bohr):* Orbits are tied to classical trajectories (mechanism), not just spectral data. When the mechanism died, the posit died.

  **Limitations (Verdicts it cannot accommodate):**
  This principle cannot deliver a settled verdict on **Case 7 (Dark Matter)** *right now*. Because we lack a successor theory, we cannot know if the "particle" ontology is modular or tied to a transient mechanism. It forces **agnosticism** where you want a conditional verdict. It accepts that some realism judgments are inevitably retrospective, validating your worry about Clause (b) but arguing it is unavoidable for truth (though not for warrant).

  ### 3. Application to New Cases

  **Case A: The Quantum State ($\psi$) in Non-Relativistic QM**
  *   **Analysis:** $\psi$ is empirically indispensable (Clause 1). However, its ontological modularity (Clause 2) is contested. Is $\psi$ a physical field (ontic) or a tool for probability (epistemic)? This depends on the measurement problem, which is a mechanistic ambiguity.
  *   **Verdict:** **Agnostic.** Under the Modular Indispensability Principle, we cannot commit to $\psi$ as a real entity until the interpretation (mechanism) is settled.
  *   **Supersession Effect:** If QM is superseded by a Hidden Variable theory (e.g., Bohmian mechanics), $\psi$ becomes a statistical tool (not real). If confirmed as fundamental (e.g., Many Worlds), it becomes real. The verdict changes with the successor.

  **Case B: Extra Dimensions (String Theory)**
  *   **Analysis:** Extra dimensions are indispensable to String Theory, but String Theory is not currently empirically adequate (no novel predictions confirmed).
  *   **Verdict:** **Not Real.** It fails Clause 1 (Current Empirical Indispensability).
  *   **Supersession Effect:** If superseded by a theory without dimensions, verdict remains "Not Real." If confirmed by evidence (e.g., gravity leakage), it passes Clause 1 and becomes Real. Unlike DM, it currently lacks the empirical anchor to even be provisionally real.

  \answer{MODULAR INDISPENSABILITY — A posit is real if indispensable to current empirical adequacy and ontologically separable from transient mechanistic models.}
