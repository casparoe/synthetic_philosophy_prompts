  1.  **It Solves the Purpose Paradox (1 vs 4):** If suffering isn't "owed" (retributive) but is instead the "maturation of a seed" (causal), then its purpose can be purely educational (4). You don't "deserve" the burn when you touch fire; the burn is just the nature of fire. This aligns perfectly with the "Natural Law" description in your prompt without importing Western retributive justice concepts.
