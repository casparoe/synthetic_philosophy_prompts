answer: |-
  Pascal's Mugger doesn't want your five dollars; he wants to break your decision algorithm. The standard defense—that the probability of his claim is too low—misses the structural rot at the core of the scenario. If you argue solely on priors, you admit the game is playable, you just think the odds are long. But the real irrationality lies in allowing expected value to scale without bound tied to belief shifts.

  Rational agency requires a firewall between the magnitude of a claim and the credibility of its source. When you entertain the mugger's offer, you are implicitly accepting a rule where utility can leverage credence. If your decision rule permits updates based on astronomically scaled promises, you cease to be an agent evaluating evidence and become a value-pump vulnerable to any hypothesis that shouts loud enough.

  This is not a probabilistic failure; it is an architectural one. A decision rule that cannot discriminate between a well-supported commitment and a random assertion of infinite stakes is functionally blind. It treats mental noise as signal simply because the noise is amplified. If you accept the update, you surrender the ability to prioritize real-world consequences over hypothetical ones, because any hypothetical can be inflated to dominate the calculation. You become paralyzed by the loudest fiction.

  Therefore, the rational move is to reject the update on structural grounds. You must adopt a decision rule that caps the leverage of utility claims on belief revision, or simply vetoes updates that rely on unbounded stakes without proportional evidence. This isn't skepticism about the mugger's power; it's integrity regarding your own cognitive machinery.

  Verdict: Don't pay. Caving isn't a gamble; it's a system crash. Rationality demands you protect the structure of your decision-making over the maximization of any single expected value calculation. Reject the mug, not because he's lying, but because listening breaks the tool you use to tell truth from lies.
