      *   *Greedy Reductionism:* The physicist claims stopping points are arbitrary. Dennett says they are determined by the "stance" (Physical, Design, Intentional). You switch stances when the predictive power shifts. That's not arbitrary.

  9.  **Drafting the Response:**
