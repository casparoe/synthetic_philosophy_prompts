answer: |-
  ### Question: The Scoop on Strategy (25 Marks)

  **Context:** You are covering a media market with two competing news blogs, *The Daily Scoop* (Row Player) and *The Nightly Feed* (Column Player). They are deciding on headline styles for a breaking story: **Sensational**, **Nuanced**, or **Skip** (don't run it). Payoffs represent estimated clicks (in thousands).

  **Part 1: The Mixed Dominance Trap (10 Marks)**
  Construct a $3 \times 2$ payoff matrix for *The Daily Scoop* (Row) where the strategy **Skip** is strictly dominated by a mixed strategy of playing **Sensational** and **Nuanced** (e.g., 50/50), but **Skip** is *not* strictly dominated by **Sensational** alone or **Nuanced** alone.
  *   Write down the matrix (you only need to show Row's payoffs clearly).
  *   Show the arithmetic proving **Skip** is dominated by the mix.
  *   Show the arithmetic proving **Skip** survives against either pure strategy individually.

  **Part 2: The Order of Operations (5 Marks)**
  In Iterated Elimination of Strictly Dominated Strategies (IESDS), does the order in which you remove dominated strategies matter when mixed strategies are allowed to do the dominating?
  *   State clearly: Yes or No.
  *   Justify your answer using the matrix you built in Part 1. (Hint: Try eliminating a Column strategy first, then check Row. Does the result change?)

  **Part 3: The Three-Player Wrinkle (10 Marks)**
  A standard theorem states: "In a 2-player game, a strategy is strictly dominated by a mixed strategy if and only if it is never a best response to any belief about the opponent."
  *   Does this equivalence hold in a **3-player** game (e.g., *Scoop*, *Feed*, and *Wire Service*)?
  *   State whether it holds or fails.
  *   Explain *why* in plain English, focusing on whether the other two players can correlate their actions. You do not need a new matrix, but you must describe the specific condition that breaks the equivalence.

  ***

  ### Model Answer

  **Part 1: The Mixed Dominance Trap**
  Consider the following payoff matrix for *The Daily Scoop* (Row). Column payoffs are omitted as they are irrelevant for Row's dominance.

  | Row \ Col | Left (Feed) | Right (Feed) |
  | :--- | :---: | :---: |
  | **Sensational** | 0 | 4 |
  | **Skip** | 1 | 1 |
  | **Nuanced** | 4 | 0 |

  **Testing Pure Dominance:**
  Compare **Skip** to **Sensational**: If Col plays Left, Skip (1) > Sensational (0). Skip is better. If Col plays Right, Sensational (4) > Skip (1). Sensational is better. Neither dominates the other.
  Compare **Skip** to **Nuanced**: If Col plays Left, Nuanced (4) > Skip (1). If Col plays Right, Skip (1) > Nuanced (0). Neither dominates the other.
  **Conclusion:** **Skip** is not strictly dominated by any pure strategy.

  **Testing Mixed Dominance:**
  Consider a mixed strategy $\sigma$ playing **Sensational** with probability 0.5 and **Nuanced** with probability 0.5.
  Expected payoff against **Left**: $0.5(0) + 0.5(4) = 2$.
  Expected payoff against **Right**: $0.5(4) + 0.5(0) = 2$.
  Compare to **Skip**: Skip yields 1 against Left and 1 against Right.
  Since $2 > 1$ in both cases, the mixed strategy strictly dominates **Skip**.
  **Result:** **Skip** should be eliminated, but only if we allow mixed strategies to act as dominators.

  **Part 2: The Order of Operations**
  **Answer:** No, the order does not matter.
  **Justification:** Strict dominance implies a strategy is inferior regardless of what the opponent does. If Strategy A is strictly dominated by Mix M, it yields a lower expected payoff against *every* possible column strategy. Removing a Column strategy (say, Right) removes a column from the matrix. If $2 > 1$ held for both columns originally, it must still hold for the remaining column (Left).
  In our matrix: Suppose we first eliminate a dominated Column strategy (none exist here, but imagine one did). If we remove a column, the inequality $E[\text{Mix}] > \text{Payoff}(\text{Skip})$ remains true for the remaining columns. Because strict inequality ($>$) is preserved when restricting the set of opponent strategies, the set of surviving strategies is unique regardless of elimination order. This distinguishes strict dominance from *weak* dominance, where order *does* matter.

  **Part 3: The Three-Player Wrinkle**
  **Answer:** The equivalence fails in 3-player games under standard independence assumptions.
  **Explanation:** In a 2-player game, a "belief" is just a probability distribution over the opponent's strategies. If a strategy is never a best response, there exists a mixture of your own strategies that beats it against all opponent moves.
  In a 3-player game, Player 1 forms a belief about Player 2 and Player 3. The wrinkle lies in **correlation**.
  1.  **If beliefs allow correlation:** Player 1 can believe P2 and P3 coordinate (e.g., "If P2 plays Up, P3 definitely plays Left"). Under this broad definition, the equivalence holds: Never Best Response $\iff$ Strictly Dominated.
  2.  **If beliefs assume independence (Nash standard):** Player 1 must believe P2 and P3 choose strategies independently. It is possible for a strategy to be "Never a Best Response" against any *independent* mix, yet *not* be strictly dominated by any mix of your own. This happens because the mixture that would dominate you requires exploiting correlations between P2 and P3 that cannot exist if they act independently.
  **Conclusion:** For journalists reading poli-sci papers, check if the authors assume opponents can correlate. If they assume independent mixing (standard Nash), a strategy can be irrational (never best response) without being mathematically dominated.

  ***

  ### Marking Scheme

  | Part | What a full-marks answer must do | Marks | The specific mistake that should cost marks here |
  | :--- | :--- | :--- | :--- |
  | **1** | Provide a valid $3 \times 2$ matrix (like 0/4, 1/1, 4/0). Show mix calculation ($0.5 \times 0 + 0.5 \times 4 > 1$). Show pure comparison fails (one column favors Skip, one favors other). | 10 | Using a matrix where pure dominance works (e.g., 2/2 vs 1/1). Failing to calculate the expected value of the mix. |
  | **2** | State "No" (Order doesn't matter). Explain that strict inequality holds even if columns are removed. Distinguish from weak dominance (optional but good). | 5 | Saying "Yes" (confusing with weak dominance). Claiming order matters because "matrices change" without addressing strict inequality preservation. |
  | **3** | State equivalence fails (or holds only with correlation). Identify "correlation vs. independence" of opponents as the key mechanism. | 10 | Saying "It holds" (memorized 2-player rule). Saying "It fails" but blaming "complexity" instead of correlation/independence. |

