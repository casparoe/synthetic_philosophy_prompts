      *   *The "Gotcha":* Most philosophical theories of vagueness (Epistemicism, Supervaluationism, Many-Valued Logic) are descriptive or metaphysical. They generally *do not* provide a normative algorithm for setting thresholds in a business context. In fact, the Sorites paradox is often used to show that *no* non-arbitrary line exists.
