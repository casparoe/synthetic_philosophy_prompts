answer: |-
  Hi there,

  You have put your finger on exactly the right distinction, and it is the engine room of the whole debate between causal and evidential and functional decision theory. The phenomenon you are describing does have a name in the literature, though it often gets buried under jargon. The term most frequently used by those who think this distinction is decisive is subjunctive dependence, sometimes also called logical correlation or logical dependence. It is not merely about whether the prediction is accurate, nor is it about whether there is a causal chain from your decision to the prediction. It is about whether the prediction and your decision share a common computational source such that if you were to output a different decision, the prediction would necessarily have been different, not because your decision caused the prediction, but because both are outputs of the same function.

  In your Version A, the checkbox is a fossil. It is a record of a past state. If you were to decide differently right now, the checkbox would not change, because the checkbox was filled out in the past. The correlation exists because the past checkbox and your current decision share a common cause, which is your underlying psychology or character type. But the prediction itself is causally sealed off from your current deliberation. In Version B, the model is running now. It is taking your decision procedure as input in real time. If you were to decide differently, the model would output a different prediction. This is subjunctive dependence. The prediction depends on what you would do, not just on what you are predicted to do based on past data. The test you asked for is essentially a counterfactual check: if I were to choose action X instead of action Y, would the prediction have been X instead of Y? In Version A, the answer is no, because the prediction is already fixed in the past. In Version B, the answer is yes, because the prediction is being computed by a process that is logically isomorphic to your own decision process running in parallel.

  This distinction clears up the edge cases you mentioned, though some of them sit right on the boundary and show why people disagree. Take the group model that is retrained weekly. This is mostly Version A, but with a tiny causal leak into the future. Your decision now does not change the current model logically, but it might change the next week's model via the aggregate data. This is causal influence, not subjunctive dependence. You are not controlling the current prediction by deciding; you are merely influencing future predictions. So this falls on the A side for the purpose of the current decision. The sealed envelope case is the tricky one that splits the theories. Physically, it is Version A because the paper is already in the envelope and cannot change. Logically, it is Version B because the simulation was perfect and therefore shares your algorithm. If you adopt the view that your decision is the output of an algorithm, then the simulation's output is the same output, just computed earlier. Functional decision theory treats this as Version B, arguing that you control the logical output wherever it appears. Causal decision theory treats it as Version A, arguing that you cannot change the past physical state of the paper. Your intuition that it feels like Version A is common, because physically the link is broken, but the logical link remains if the simulation was truly perfect.

  The case of the public vow is about changing the algorithm itself rather than just the output. When you make a vow, you are modifying the function that will be simulated or predicted. This is precommitment. It works in both Version A and Version B scenarios because it changes the input to the prediction mechanism, whether that mechanism is a past checkbox or a live model. You are changing the sort of person you are, which changes the prediction. This is why precommitment strategies are recommended in these puzzles; they allow you to select the algorithm that yields the best outcome, rather than just selecting the action within a fixed algorithm.

  Finally, this distinction is exactly what explains the coin-flip case you mentioned, which sounds like Parfit's Hitchhiker or Counterfactual Mugging. In those cases, the money is already paid or not paid in the physical world, but the payment condition was based on what you would have done in a counterfactual scenario. There is no physical letter or checkbox in the counterfactual branch. The only thing that exists is the logical output of your decision algorithm in that counterfactual situation. If your algorithm says pay, the predictor simulates paying and gives you the money. If your algorithm says don't pay, the predictor simulates not paying and you get nothing. The payment depends entirely on subjunctive dependence. There is no causal link from your actual decision to the past payment, because the payment already happened. There is only a logical link between your actual algorithm and the simulated algorithm that determined the payment. If you cannot see yourself as controlling the logical output of your algorithm across counterfactuals, the coin-flip case makes no sense and you will refuse to pay, leaving you worse off. If you accept subjunctive dependence, you see that your decision now determines what the simulation would have done, and thus determines whether you got the money.

  So the phenomenon is real, it has a name, and it is the hinge on which these puzzles turn. It is not about evidence or causation in the traditional sense, but about the identity of the computational process generating the prediction and the decision. When the prediction is a fossil, you are merely observing evidence about yourself. When the prediction is a mirror, you are looking at the output of your own logic, and you have to decide what that logic should be. I hope this helps untangle the knot you were stuck on, because once you see the logical link as the thing being optimized rather than the causal chain, the paradoxes tend to dissolve into engineering problems about algorithm selection.

  Best of luck with the rest of the rabbit hole,

  A Friend
