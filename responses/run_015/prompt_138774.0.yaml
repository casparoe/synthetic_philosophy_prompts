answer: |-
  This is a profound ethical puzzle, and your intuition that Case (3) is worse than Case (1) is the key that unlocks the whole thing. Your current rule fails because it relies on **counterfactual consent** ("would they have refused?"). That works for privacy, but it collapses when the subject's desire conflicts with the truth (Case 4) or when the harm isn't about preference but about *meaning* (Case 3).

  The problem isn't just what the dead would want; it's what the audience is being led to believe they *know*. When you dramatize a real person, you are borrowing their authority to lend weight to your story. The ethical breach occurs when you use that borrowed authority to validate a lie.

  Here is a repaired principle, followed by how it handles your cases, the new scenarios, and your grandmother.

  ### The Principle of Narrative Fidelity

  **You may invent in the gaps of the record, but you may not use the bricks of the record to build a wall that contradicts the structure of the life.**

  This principle has three clauses:

  1.  **The Gap Clause (Invention vs. Contradiction):** Invention is permissible only where the record is silent. If the preponderance of evidence points one way, you cannot dramatize the other, even if the specific event is unrecorded. (This solves Case 1 vs. Case 7).
  2.  **The Gestalt Clause (The Frankenscene Rule):** You cannot arrange true details to create a false essence. A story has a truth-value greater than the sum of its facts. If the factual bricks are real but the architectural blueprint is a lie, you have violated the subject. (This solves Case 3).
  3.  **The Fraud Exception (Public Deception):** If the subject's public "essence" was itself a documented deception, exposing that deception is not a violation of fidelity but a restoration of it. (This solves Case 4).

  There is also a fourth clause regarding the *world* they inhabited, distinct from the person:
  4.  **The Context Clause:** You may not falsify the nature of the historical event itself to provide emotional comfort to the audience. (This solves Case 6).

  ---

  ### Applying the Principle to Your Verdicts

  *   **(1) The Labor Organizer (Invented Sex Scandal):** **Violation.** The record (her life's work, character witnesses) points to dedication. Inventing a betrayal in a "gap" contradicts the *weight* of the evidence. It uses her authority as a serious figure to sell a tabloid trope.
  *   **(2) The Fictional Assistant:** **Permissible.** This is a "composite." It fills a gap (who helped her?) without contradicting the record. It claims no specific authority.
  *   **(3) The Naturalist (Reordered Faith):** **Major Violation.** This is the Gestalt Clause. You used his own words (bricks) to build a house he never lived in (blueprint). This is more insidious than (1) because it wears the mask of scholarship. It weaponizes the truth to lie.
  *   **(4) The Humanitarian Fraud:** **Permissible (Required).** The Fraud Exception. Her public essence *was* the lie. To be faithful to the reality of her life, you must depict the forgery. Her "refusal" is irrelevant because her refusal was part of the fraud.
  *   **(5) The Pacifist's Bar Fight:** **Violation.** This violates the Weight of Evidence. A single anomaly does not define the structure of a life. Presenting it as a key moment contradicts the "preponderance of evidence" regarding who he was. It is technically true but narratively false.
  *   **(6) The Famine (False Hope):** **Violation.** The Context Clause. This isn't about the person; it's about the event. You are lying about the nature of the suffering. This betrays the actual victims, not just the characters.
  *   **(7) The Sparse Record:** **Permissible.** The Gap Clause. When there is no structure, you cannot contradict it. You are building a new house on an empty lot, claiming only that the lot exists.
  *   **(8) The Permission Note:** **Limited Power.** Consent waives privacy claims, but it does not waive the **Gestalt Clause**. A subject cannot license you to lie about their essence. If they say, "Tell the truth," and you use true facts to imply a false arc (like Case 3), you have still violated the principle. You owe fidelity to the truth, not just to their permission slip.

  ---

  ### Predictions for New Scenarios

  **1. The Musical-Comedy Biopic**
  *   **Verdict:** Permissible, *if* the stylization is overt.
  *   **Reasoning:** Singing signals "interpretation" rather than "documentary." It lowers the audience's expectation of literal fidelity. However, if the *lyrics* attribute thoughts to the subject that contradict their documented beliefs (violating the Gestalt Clause), it becomes unethical. *Hamilton* works because it admits it's a remix; a straight biopic where the subject bursts into song to confess a fake affair would fail.

  **2. Casting an Actor with a Different Body**
  *   **Verdict:** Generally Permissible, with exceptions.
  *   **Reasoning:** Acting is inherently impersonation. However, if the body is central to the *narrative truth* (e.g., casting a non-disabled actor to play a disabled person whose struggle with their body is the plot), it violates the **Gap Clause**. You are filling a gap with a contradiction. If the physical difference is incidental (height, hair color), it is aesthetic, not ethical.

  **3. AI Voice Generation**
  *   **Verdict:** **Not Fine.**
  *   **Reasoning:** This is the most dangerous frontier. It violates the **Gap Clause** in a new way. Invention implies *authorship* ("I wrote this line for her"). AI simulation implies *presence* ("She said this"). It collapses the distance between the dead and the living. It simulates consent where none can exist. Unless the subject left a voice bank with permission (rare), this is a violation of their agency. It is not filling a gap; it is forging a signature.

  ---

  ### The Grandmother Case

  This is where the "Grant Committee" ethics must yield to "Family" ethics. The principle above is for **Public Figures** (people who entered the historical record voluntarily or involuntarily). Your grandmother is a **Private Subject**.

  For private subjects, the principle shifts from **Narrative Fidelity** to **Relational Stewardship**.

  1.  **The Veto of the Living:** When the dead are recent, the grief of the living is an extension of the dead's own privacy. Your mother's objection is not censorship; it is a boundary marker. She is the custodian of the silence your grandmother chose.
  2.  **The Right to Silence:** Your grandmother "never spoke about" that stretch of life. That silence is a data point. In the Public Principle, we sometimes break silence for historical truth (Case 4). In the Private Principle, silence is often a form of protection. To break it is to assume you know better than she did what should be kept.
  3.  **The Risk of Projection:** With a public figure, we have letters, records, and witnesses to check our invention. With your grandmother, you have only memory and inference. Any story you write will inevitably be more about *you* trying to understand her than about *her*.

  **Verdict:** Do not touch it.
  **Why:** Not because it is "untrue," but because the **cost of discovery** falls entirely on the living. In your work cases, the "harm" is abstract (historical reputation). In the grandmother case, the harm is concrete (your mother's grief, your relationship with her). The "Gap" here is protected by love, not just lack of data.

  ### Summary of the Repaired Principle

  **"Do not use the authority of the real to validate the false. You may invent where there is silence, but you may not contradict the weight of the evidence. You may not arrange truth to lie about the soul. And when the subject is private, the silence of the dead is guarded by the voice of the living."**

  This preserves your intuition that (3) is worse than (1) (lying about the soul is worse than lying about an event), explains why (4) is an exception (the soul was already a lie), and protects your grandmother without needing to solve the metaphysics of death.
