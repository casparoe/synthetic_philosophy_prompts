      *   *Case 6:* This is about the *Event*, not the person. So we need a second prong: **Do not falsify the nature of the Suffering.**

      *   *Finalizing the Principle:* **The Dual Fidelity Principle.**
          1.  **Fidelity to Character:** You may not construct a narrative arc that contradicts the preponderance of evidence regarding the subject's internal life, *except* when exposing a documented public deception.
