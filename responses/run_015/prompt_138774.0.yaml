      *   *Draft Principle:* **The Principle of Non-Betrayal.**
          1.  **Identity:** Do not attribute actions/traits that contradict the *core, documented identity* unless exposing a hypocrisy central to the public story.
          2.  **Context:** Do not distort the *historical reality* of the event to make it palatable.
          3.  **Consent/Privacy:** Consent mitigates but doesn't erase the duty to truth (Case 8).
          4.  **Scale of Invention:** Invention is proportional to the silence of the record (Case 7 vs. Case 1).

      *   *Refining the Principle:* Let's try to center it on **Narrative Authority**. When you dramatize a real person, you borrow their authority. You cannot use their authority to validate a lie about *who they were* or *what happened*, unless the lie *is* the truth about their public deception.

      *   *Better Formulation:* **The Duty of Representational Justice.**
          *   **Clause A (The Core Self):** You cannot fabricate traits that fundamentally alter the subject's moral or psychological architecture *unless* those fabrications serve to reveal a documented deception (The Fraud Exception).
          *   **Clause B (The Historical World):** You cannot falsify the nature of the historical event itself (The Famine Exception).
