          *   Distinguish four specific readings: (1) Semantic, (2) Historiographical, (3) Ontological/Institutional, (4) Methodological.
          *   For each reading, evaluate: Is it a platitude? Is it defensible by evidence? Does it exclude climate/epidemic inquiry? Does it conflate Western government dissolution with Roman civilization disappearance?
