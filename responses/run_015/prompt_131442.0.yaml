          *   Gaunilo: No, Gaunilo changes the concept. Mirror Test keeps the concept, flips the value.
          *   Too Strong?: No, doesn't kill math (no value predicates).
          *   Function: Exposes value judgments in logic.
          *   Verdict/Bet: Plantinga survives the *logic* but fails the *plausibility* of the axiom. I bet on the unsoundness of "Necessary Existence is Positive."

