answer: |-
  ### Essay Question

  **The Mirror Test and the Ontological Argument**

  Consider the "Mirror Test" diagnostic: take any ontological argument, retain its logical structure (modal logic, treatment of existence, closure axioms), but swap the governing evaluative predicate (e.g., *great-making* becomes *dread-making*; *positive* becomes *anti-positive*). Run the dual argument.

  Write an essay evaluating the Ontological Argument through this device. You must commit to a verdict on whether Anselm's Proslogion II argument or Plantinga's Modal Argument survives the test. In doing so, address the following:
  1.  Does the dual argument succeed for Anselm?
  2.  For the Modal version, identify exactly which premise breaks the symmetry between the original and the dual.
  3.  Explain why this test is not merely a Gaunilo-style parody.
  4.  Assess whether the test is "too strong" (i.e., would it invalidate other respectable a priori arguments?).
  5.  Conclude by stating what the test actually detects if not logical invalidity, and identify the single step in either argument you would wager is unsound.

  *(Time: 90 minutes)*

  ***

  ### Model Answer

  The Mirror Test does not merely seek a *reductio*; it probes whether an argument's conclusion is driven by logical machinery or hidden axiological commitments. Applied to the ontological family, the verdict is split: Anselm's Proslogion II argument collapses under the test, while Plantinga's Modal Argument survives structurally but is exposed as axiomatically loaded. I wager that Plantinga's claim that "Necessary Existence is a Positive Property" is unsound.

  Anselm's argument defines God as "that than which nothing greater can be conceived" and argues existence in reality is greater than existence in the understanding alone. The Mirror Test dualizes this to "that than which nothing *worse* can be conceived." If existence in reality is "greater," is it also "worse"? If the logic holds, the Worst Conceivable Being must also exist in reality, for existing in reality would be worse than existing merely in the understanding. This leads to an absurd proliferation of maximal beings (one greatest, one worst) or a contradiction if greatness and dreadfulness are mutually exclusive in instantiation. Anselm's version fails the test because it treats "existence" as inherently value-laden without justification. The machinery forces a fixed point for *any* superlative, proving the logic detects consistency, not truth.

  Plantinga's Modal Argument is more robust. It argues that if a Maximally Great Being (MGB) is possible, it exists necessarily. Greatness is defined by "Positive Properties." The Mirror Test constructs a Maximally Dreadful Being (MDB) defined by "Negative Properties." The structural machinery (S5 modal logic) remains identical. However, the dual argument fails to prove an MDB exists. Why? Because the symmetry breaks at the specific axiom: "Necessary Existence is a Positive Property." For the dual to work, "Necessary Existence" would have to be a *Negative* Property. It is not. A being that exists necessarily is not thereby dreadful. Thus, the original argument survives the Mirror Test logically; the dual simply yields a false premise rather than a valid conclusion.

  This is not a Gaunilo-style parody. Gaunilo changed the *subject* (from God to an Island) to show the logic overgenerates. The Mirror Test keeps the *subject* (a Maximal Being) but flips the *value*. Gaunilo attacks the scope of the logic; the Mirror Test attacks the neutrality of the predicates. It shows that Plantinga's logic is not a neutral engine that discovers God, but a specific container built for "Positive" properties.

  Is the test too strong? Would it invalidate mathematical proofs? No. A priori arguments in mathematics do not rely on evaluative predicates like "great" or "positive." They rely on structural definitions (e.g., "prime," "infinite"). The Mirror Test only threatens arguments where existence is derived from value. Therefore, it is not too strong; it is correctly calibrated to expose value-laden ontology.

  Consequently, the test detects not logical invalidity, but *question-begging axiology*. It reveals that the conclusion was smuggled into the definition of the properties. The logical machinery is sound, but it is idle without the fuel of value judgments.

  My verdict: Plantinga's argument survives the Mirror Test formally, but fails materially. The single step I would put money on being unsound is the axiom that **Necessary Existence is a Positive Property**. This is not a logical truth; it is a substantive theological claim. To assert that existing necessarily is "better" than existing contingently assumes the very perfection it seeks to prove. The Mirror Test succeeds not by breaking the logic, but by showing that the logic only works if we already agree on what counts as "great."

  ***

  ### Marking Scheme (Out of 20)

  | Point | Requirement | Marks | Common Miss |
  | :--- | :--- | :--- | :--- |
  | **1. Anselm Application** | Correctly applies the dual to Proslogion II and explains why it fails (existence cannot be both inherently greater and inherently worse without contradiction). | 4 | Students claim the dual works perfectly, missing that two maximal beings create a contradiction. |
  | **2. Modal Asymmetry** | Identifies that Plantinga's argument survives formally but pinpoints the axiom "Necessary Existence is Positive" as the symmetry-breaker. | 4 | Students claim S5 logic itself breaks, rather than the specific property assignment. |
  | **3. Gaunilo Distinction** | Explains that Gaunilo changes the *concept* (Island vs. God), while the Mirror Test keeps the concept and flips the *value* (Great vs. Dread). | 4 | Students treat the Mirror Test as just another "Perfect Island" objection. |
  | **4. Scope Assessment** | Argues the test is not "too strong" because it targets evaluative predicates, leaving non-evaluative a priori arguments (like math) intact. | 4 | Students argue the test destroys all a priori reasoning, including mathematics. |
  | **5. Function & Wager** | Identifies the test detects hidden axiological assumptions (not logical errors) and commits to a specific unsound premise (e.g., Necessary Existence is Positive). | 4 | Students refuse to commit to a verdict or claim the test detects logical invalidity. |
