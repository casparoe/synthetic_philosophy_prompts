answer: |-
  Here is a complete design for a 75-minute seminar game called **"The Billiard Table Gamble."** It is engineered to make the F-twist visceral by forcing the "Realist" team to fail *because* they are being realistic, while the "Instrumentalist" team wins *because* they embrace a useful falsehood.

  ### Game Overview
  *   **Time:** 75 Minutes (15 min setup/rules, 30 min gameplay, 30 min debrief).
  *   **Players:** 14 Students (2 Teams of 7).
  *   **System:** You (The Instructor).
  *   **Task:** Predict your binary choice (Left/Right) for 5 consecutive rounds.
  *   **The Twist:** You are not choosing freely. You are following a strict, pre-written mathematical rule. Team Realism is forced to model *you*; Team Instrumentalism is forced to model *the output*.

  ---

  ### 1. Setup & Roles (15 Minutes)

  **The System (You)**
  *   **Secret Rule:** Before class, write down a sequence of 5 choices (L/R) on a sealed envelope.
  *   **The Rule:** Use a deterministic rule that looks random to humans but is simple mathematically.
      *   *Recommendation:* **The Fibonacci Parity Rule.**
      *   Round 1: Left
      *   Round 2: Right
      *   Round 3+: If the sum of the previous two rounds (L=0, R=1) is even, play Left. If odd, play Right.
      *   *Sequence:* L (0), R (1), R (1), L (0), R (1).
  *   **Behavior:** Act naturally. Do not hint at the rule. Do not act like a robot. Blink, shift weight, sigh. This provides "noise" for the Realists to latch onto.

  **Team Instrumentalism (The Friedmanites)**
  *   **Core Assumption (Must be written on board):** "The Instructor is a Black Box with no internal states."
  *   **Constraint:** You may **only** use the history of previous outputs (L/R) to predict the next one. You are forbidden from observing the Instructor's body, the room, or the context.
  *   **Model Limit:** Your prediction formula can use max **2 variables** (e.g., `Last_Output` and `Round_Number`).

  **Team Realism (The Truth-Seekers)**
  *   **Core Assumption (Must be written on board):** "The Instructor is a Human Agent with psychological and physical states."
  *   **Constraint:** You **must** include at least **3 physical/psychological variables** in your model (e.g., `Instructor_Posture`, `Time_Since_Last_Blink`, `Tone_Of_Voice`). You cannot rely solely on past outputs.
  *   **Loophole Closer:** You must submit a **Causal Diagram** before Round 1 showing how these variables cause the choice. If a variable doesn't causally link to the choice in your diagram, you can't use it.

  ---

  ### 2. Gameplay Rules (30 Minutes)

  **The Loop (Repeat 5 Times)**
  1.  **Model Update (3 mins):** Teams huddle.
      *   *Team I* updates their algorithm based on the new data point.
      *   *Team R* measures the Instructor (one student times your hesitation, one rates your posture 1-10, etc.) and adjusts weights.
  2.  **Prediction Lock (1 min):** Both teams submit a sealed prediction (L or R) to you.
  3.  **The Reveal (1 min):** You announce your choice (according to the Secret Rule).
  4.  **Scoring:**
      *   **+1 Point** for correct prediction.
      *   **-1 Point** for incorrect prediction.
      *   **Bonus:** If Team I wins 3 out of 5 rounds, they get a "Friedman Bonus" (5 extra points).

  **Crucial Enforcement:**
  *   **For Team R:** Walk around their table. If their Causal Diagram shows `Posture -> Choice`, ask them: "How does posture cause the choice?" If they say "It indicates stress," ask "How does stress cause Left?" They must commit to a mechanism. This forces them to invest in false causality.
  *   **For Team I:** Ensure they don't sneak in "He looked tired." If they do, disqualify the round.

  ---

  ### 3. Why Team Realism Will Lose (The Mechanism)

  1.  **Overfitting Noise:** Because you are acting like a human (blinking, shifting), Team R will find correlations that don't exist. *("He shifted his weight right in Round 2, and he played Right! Weight shift is a predictor!")* In Round 3, you shift weight right but play Left (per the math rule). Their model breaks.
  2.  **Causal Drag:** They are forced to measure variables that are causally inert regarding your Secret Rule. Measuring your blink rate takes time and cognitive energy that distracts from pattern recognition in the output data.
  3.  **The "True" Assumption Trap:** Their assumption ("He is human") is ontologically true, but pragmatically useless for *this specific task*. This mirrors Friedman's billiard players: It is true they don't calculate math, but modeling them as if they do predicts better. Here, it is true you are human, but modeling you as a math-function predicts better.

  ---

  ### 4. The Debrief (30 Minutes)

  Do not let them leave until you map the game to the text. Use the whiteboard to draw these parallels:

  **Moment 1: The Frustration of Team R**
  *   *Ask:* "Team R, you were describing reality. Team I was describing a fiction. Why did you lose?"
  *   *F-Twist Map:* This is Friedman's claim. The realism of assumptions is not a virtue. A "true" model of the billiard player's psychology (Team R) loses to a "false" model of the player as a calculating machine (Team I).
  *   *Key Phrase:* **"Ontological correctness does not guarantee predictive power."**

  **Moment 2: Team I's "False" Assumption**
  *   *Ask:* "Team I, you assumed I was a Black Box. That's false. I'm a person. Did that falsehood hurt you?"
  *   *F-Twist Map:* Friedman argues we *want* assumptions to be false (or simplified) because they strip away irrelevant noise. By ignoring your humanity, Team I saw the pattern.
  *   *Key Phrase:* **"Assumptions are filters, not descriptions."**

  **Moment 3: The Overfitting**
  *   *Ask:* "Team R, did you find yourself explaining away your losses? ('He blinked twice, that threw off the model.')"
  *   *F-Twist Map:* Realist models often become "immunized" against falsification by adding ad-hoc clauses (protective belts). Instrumentalist models are ruthlessly judged on $P$ (Prediction).
  *   *Key Phrase:* **"Explanatory depth can be a liability."**

  ---

  ### 5. Pre-Mortem: What Will Go Wrong

  **Failure Mode 1: Team R Cheats the Constraint**
  *   *Risk:* Team R ignores the "3 physical variables" rule and just looks at the L/R history.
  *   *Fix:* Collect their Causal Diagrams at the start. If the diagram doesn't include `Posture` or `Voice` or `Time`, make them redraw it. Be a strict referee.

  **Failure Mode 2: Team I Loses by Luck**
  *   *Risk:* Your Secret Rule creates a sequence that looks random (e.g., L, L, R, L, R) and Team I assumes "Alternation."
  *   *Fix:* Use the **Fibonacci Parity Rule** suggested above. It creates a pattern (`L, R, R, L, R`) that is detectable by Round 3 if they are looking at *history*, but invisible if they are looking at *you*.
  *   *Backup:* If Team I is struggling at Round 3, give a subtle hint: "Check the last two rounds." (This violates strict neutrality but saves the lesson).

  **Failure Mode 3: Students Miss the Point**
  *   *Risk:* They think the game proves "Humans are bad at guessing."
  *   *Fix:* In the debrief, explicitly state: "Team R wasn't bad at guessing. They were hamstrung by a requirement to be *true*. That is the tragedy of the Realist position in this framework."

  ---

  ### 6. Limitations: What This Game Cannot Show

  Be honest with the class. This game is a rhetorical device, not a proof.

  1.  **External Validity:** In the game, the "System" (you) was actually a simple algorithm. In the real world, systems (economies, ecosystems) are not pre-determined math puzzles. Sometimes realistic assumptions *do* help with structural breaks (e.g., a model assuming "humans panic" predicts a bank run better than a rational agent model).
  2.  **Policy vs. Prediction:** Friedman cares about prediction. If we want to *intervene* (change the system), realistic assumptions matter. If Team R knew you were following a math rule, they could hack the rule. Instrumentalism predicts; Realism explains.
  3.  **The "As If" Defense:** The game shows false assumptions winning. It doesn't prove the assumptions are *true* "as if." It just shows they are useful. Friedman conflates utility with a kind of truth; this game highlights the utility but leaves the metaphysics open.

  ### Instructor Script for the "Gut Punch"
  *At the end of the game, after Team I has won:*

  > "Look at Team R. They told the truth. They said 'He is a man.' They measured his body. They were ontologically correct.
  >
  > Look at Team I. They told a lie. They said 'He is a box.' They ignored his humanity. They were ontologically wrong.
  >
  > Team I won. If science is about winning—about prediction—then Team R wasted their time. Friedman is asking you to accept that feeling. He is asking you to accept that truth is a luxury we can't afford if we want the model to work. Does that sit right with you? Or does it make you want to throw the scoreboard out the window?"

  *Let that silence hang. That discomfort is the F-twist landing.*
