answer: |-
  **Exam Question: Decision Theory Seminar (Final)**

  **Prompt:**
  Consider an agent whose utility function is state-dependent: she values \$100 differently on Tuesday ($U_T$) than on Wednesday ($U_W$). On Monday, she plans a sequence of trades. On Tuesday morning, she receives a credible, non-causal signal indicating "Today is Tuesday," prompting a self-locating belief update. She then executes trades based on this updated belief.

  (a) Construct a diachronic coherence argument (money pump) that would typically compel Expected Utility Maximization (EUM) in this setting.
  (b) Precisely identify how genuine state-dependent utility breaks the force of this pump, distinguishing between preference reversal and state-relative valuation.
  (c) Evaluate the available theoretical repairs. Is it preferable to reject state-dependent utility, revise the updating rule for self-locating beliefs, or weaken the diachronic coherence requirement? Justify your choice.

  ***

  **Model Answer:**

  (a) A standard diachronic coherence argument posits that if an agent's choices violate EUM, they are susceptible to a money pump: a sequence of trades leaving them strictly worse off than their starting position. In this scenario, the pump relies on the agent accepting a trade on Monday that they would reject on Tuesday, or vice versa, creating a cycle. Typically, coherence requires that preferences remain stable across time unless new *causal* information arrives. The argument assumes that if the agent prefers Option A to B on Monday, they should maintain that ranking on Tuesday unless the options themselves change. If the agent pays to switch from A to B on Tuesday, having paid to secure A on Monday, they incur a net loss for no gain, violating dominance.

  (b) The pump breaks because it conflates diachronic inconsistency with state-dependent rationality. Standard money pumps assume state-independent utility: \$100 has invariant value across the decision tree. However, if utility is genuinely state-dependent, $U_T(\$100) \neq U_W(\$100)$. The agent's preference reversal between Monday (planning) and Tuesday (execution) is not a coherence violation but a rational response to the state indexical "Today." The signal "Today is Tuesday" updates the agent's self-locating belief, activating $U_T$. The pump fails to demonstrate a sure loss because the "loss" is measured in utils, and the utility metric itself shifts with the state. The agent is not cycling through preferences in a single state; they are optimizing correctly across distinct states.

  (c) Regarding theoretical repairs, rejecting state-dependent utility is empirically implausible; agents genuinely value resources differently depending on context (e.g., hunger, time). Revising the updating rule for self-locating beliefs is technically fraught; standard conditionalization struggles with indexicals like "Today," but altering it risks severing the link between belief and action. Therefore, the cheapest and most defensible fix is to weaken the diachronic coherence requirement. We must accept that diachronic consistency constraints (like Reflection or standard Money Pump arguments) apply only relative to a fixed utility function. If utility is state-dependent, coherence must be evaluated within states, not across them. We should adopt a framework where EUM holds locally within a state, but diachronic dominance is relaxed to accommodate legitimate shifts in valuation driven by self-locating information. This preserves the normative force of EUM without demanding impossible stability from agents embedded in time.

  ***

  **Marking Scheme (20 Marks Total)**

  | Point | Criteria | Marks | Common Botch |
  | :--- | :--- | :--- | :--- |
  | **1** | **Setup of Pump:** Correctly describes the sequence of trades and the assumption of stable preferences required for a money pump. | 4 | Candidates describe synchronic Dutch Books instead of diachronic pumps. |
  | **2** | **Role of Signal:** Explains how the self-locating signal triggers the utility shift rather than changing the outcome space. | 4 | Candidates treat the signal as causal information changing the world state. |
  | **3** | **Identification of Break:** Clearly distinguishes preference reversal (irrational) from state-relative valuation (rational). | 4 | Candidates argue the pump still works because money is fungible across days. |
  | **4** | **Evaluation of Fixes:** Critiques rejecting state-dependence and revising updating rules as costly or implausible. | 4 | Candidates advocate rejecting state-dependence as the "cleanest" mathematical solution. |
  | **5** | **Final Verdict:** Defends weakening diachronic coherence as the optimal solution while retaining local EUM. | 4 | Candidates conclude that EUM must be abandoned entirely rather than modified. |
