          *   "Stratify only on what you'd know at the moment of choosing": Strong candidate. Fits 1, 2, 3. Case 4 adds a "Power" constraint.
          *   "Never trust a stratifier whose values were fixed up after the outcome was known": This is the specific key for the new case.
      *   **Analyze the New Case:**
          *   The "Severity Grade" is the stratifier.
          *   Problem: Radiologists knew the outcome when assigning the grade.
          *   This makes the grade a *collider* or simply a biased measure. $Grade \leftarrow Radiologist \leftarrow Outcome$.
          *   This violates the "Pre-treatment / Exogenous" requirement. It's functionally equivalent to Case 2 (conditioning on post-treatment info), even worse because it's data fabrication/bias.
          *   Catch 2 (Population mix) reinforces the Aggregate. If the hospital sees more late-stage patients, and the New Drug was tested mostly on late-stage (where it did well, but maybe less well than Old on early?), wait.
          *   Let's trace the Simpson's Paradox logic: New Drug is better in strata. Old Drug is better overall because New Drug got sicker patients.
          *   If we trust the strata: Use New Drug.
          *   If we trust the aggregate: Use Old Drug.
          *   Mira's logic on Case 1: Trust strata when confounding is real (stone size).
          *   Mira's logic on Case 2: Trust aggregate when stratifier is post-treatment.
          *   New Case: Stratifier is *measured* post-outcome with bias. This aligns with Case 2 (invalid stratifier).
          *   Therefore: **Aggregate.**
      *   **Distinguishing Case:** What if the grades were assigned blinded? Then we'd need to distinguish between "Know at moment of choice" vs "Causal Confounder".
          *   If grades are blinded but not available at decision time (e.g., complex genomic test results come back 3 days later), would she stratify?
          *   If the rule is "Know at moment of choice," she says Aggregate.
          *   If the rule is "Causal Confounder," she says Stratify (because it explains the biological mechanism, even if not available for triage *now*, it informs policy).
          *   Given Case 1 (Stone size is usually known), Case 2 (Completion not known), Case 3 (Bins not causal).
          *   Actually, the strongest distinction is between **Measurement Integrity** vs. **Decision-Time Availability**.
          *   To distinguish: A case where a valid pre-treatment confounder exists but was *not* recorded until after the outcome (blinded).
          *   If she stratifies: Rule is "Causal Confounder (retrospective ok if blinded)."
          *   If she aggregates: Rule is "Decision-Time Knowledge."

  6.  **Refining the "Rule":**
      Mira isn't just a statistician; she's a clinician/administrator. Her rule is about **Actionable Causal Inference**.
      1.  **Causal Precedence:** The stratifier must causally precede treatment and outcome (Case 1 vs 2).
