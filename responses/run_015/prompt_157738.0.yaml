prompt: |-
  A friend of mine, Mira, is the person everyone at her hospital network goes to when a comparison table comes out backwards, and I've been trying for a while to figure out what rule she's actually running. I cant pin it down. Her verdicts so far:

  (1) Textbook case: the more invasive treatment beats the newer one inside both the small-stone and the large-stone group, but loses overall because it was used much more often on large stones. She says the invasive one is better and the aggregate just tracks who got sent to which treatment.
  (2) A reversal that only shows up when you split patients by whether they completed the full course. She says throw it out, you've conditioned on something that happens after treatment starts, and go with the aggregate.
  (3) A reversal that appears when you chop a continuous variable into arbitrary bins and disappears when you chop it differently, with no story about why the bins should matter causally. She says aggregate again.
  (4) A clean pre-treatment severity marker with a big within-stratum reversal, but the two strata have 9 and 13 patients in them. She says there isn't enough evidence to act on and refuses to switch anything.

  The case on her desk next week: two drugs, and the stratifier is a severity grade read off a baseline scan. Within every grade the new drug does better; overall the old drug does better, because the new drug went mostly to the sickest patients. Two catches. The real-time reads of those scans were lost, so the grades in the dataset were assigned afterwards by radiologists who knew which drug each patient got and how the patient did. And our hospital sees way more late-stage patients than the trial population did.

  Predict her verdict. More usefully: tell me which rule she's running — stratify on anything that's pre-treatment, stratify only on what you'd actually know at the moment of choosing, never trust a stratifier whose values were fixed up after the outcome was known, something else — which of those rules is consistent with all four verdicts above, what each predicts here, and what further case would tell the surviving rules apart. If her precedents genuinely don't settle this one, say so and say what she'd be committing to with each choice.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**
      *   **Protagonist:** Mira, a hospital network expert on statistical paradoxes (specifically Simpson's Paradox and related confounding issues).
      *   **Goal:** Determine the underlying rule Mira uses to decide between aggregate vs. stratified data in cases of reversal.
      *   **Input:** Four past verdicts/cases.
      *   **Target:** A new case (Drug A vs. Drug B, severity grade stratifier).
      *   **Specifics of New Case:**
          *   Stratifier: Severity grade from baseline scan.
          *   Reversal: New drug better in every grade, Old drug better overall (due to confounding by indication/new drug went to sickest).
          *   Catch 1: Real-time scan reads lost. Grades assigned *afterwards* by radiologists who knew the treatment and outcome (potential bias).
          *   Catch 2: Hospital population has more late-stage patients than the trial population (external validity/generalizability issue).
      *   **Tasks:**
          1.  Predict Mira's verdict.
          2.  Identify the underlying rule consistent with all four past verdicts.
          3.  Evaluate candidate rules against the past verdicts and the new case.
          4.  Propose a further case to distinguish surviving rules (if necessary).
          5.  If precedents don't settle it, explain the commitment of each choice.

  2.  **Analyze the Four Past Verdicts:**

      *   **Case 1 (Kidney Stones Classic):**
          *   *Scenario:* Invasive (A) vs. New (B). Small/Large stones. A wins in subgroups, loses overall. A used more on Large (harder) stones.
          *   *Verdict:* Stratified (A is better).
          *   *Reasoning:* "Aggregate just tracks who got sent to which treatment." This is classic Simpson's Paradox caused by confounding by indication (severity). The stratifier (stone size) is a pre-treatment confounder.
          *   *Implication:* Stratify on pre-treatment confounders that affect treatment assignment.

      *   **Case 2 (Post-Treatment Conditioning):**
          *   *Scenario:* Reversal appears when splitting by "completed full course."
          *   *Verdict:* Aggregate (Throw it out).
          *   *Reasoning:* "Conditioned on something that happens after treatment starts." This is collider bias / post-treatment bias. Completion is affected by treatment and outcome.
          *   *Implication:* Do *not* stratify on post-treatment variables (mediators or colliders).

      *   **Case 3 (Arbitrary Binning):**
          *   *Scenario:* Reversal appears with arbitrary bins of a continuous variable, disappears with different bins. No causal story.
          *   *Verdict:* Aggregate.
          *   *Reasoning:* "No story about why the bins should matter causally." Data dredging / p-hacking via binning.
          *   *Implication:* Stratification requires a *causal* justification, not just statistical convenience.

      *   **Case 4 (Small Sample Strata):**
          *   *Scenario:* Clean pre-treatment severity marker. Big within-stratum reversal. Strata sizes: 9 and 13.
          *   *Verdict:* Aggregate (Refuses to switch).
          *   *Reasoning:* "Isn't enough evidence to act on."
          *   *Implication:* Statistical power/precision matters. Even if causally correct, if $N$ is too small, trust the aggregate (or rather, don't act on the stratified estimate). *Correction:* Actually, she says "refuses to switch anything." This implies sticking with the status quo or the aggregate because the stratified signal is too noisy. It prioritizes reliability over theoretical causal correctness when data is sparse.

  3.  **Synthesize Mira's Rule:**

      *   *Candidate 1: "Stratify on anything pre-treatment."*
          *   Fails Case 3 (Arbitrary bins are pre-treatment but rejected).
          *   Fails Case 4 (Pre-treatment but rejected due to sample size).
      *   *Candidate 2: "Stratify only on what you'd know at the moment of choosing."*
          *   Fits Case 1 (Stone size known).
          *   Fits Case 2 (Completion not known).
          *   Fits Case 3 (Bins arbitrary, not necessarily decision-relevant).
          *   Fits Case 4 (Known, but sample size issue).
      *   *Candidate 3: "Causal DAG / Confounder Rule."*
          *   Stratify on common causes of Treatment and Outcome (Confounders).
          *   Do not stratify on Descendants of Treatment (Mediators/Colliders).
          *   Stratifier must be meaningful (not arbitrary).
          *   Stratifier must have sufficient support (sample size).
      *   *Refined Rule:* **Stratify on pre-treatment variables if and only if they are causal confounders (affecting both assignment and outcome), have a non-arbitrary causal definition, and possess sufficient sample size for reliable estimation.**

      *   *Key Nuance from Case 4:* She prioritizes *actionable evidence*. If the stratified data is too noisy, she defaults to the aggregate (or status quo) to avoid acting on noise.

  4.  **Analyze the New Case:**

      *   *Setup:* New Drug vs. Old Drug. Severity Grade Stratifier.
      *   *Pattern:* New better in strata, Old better overall (Confounding by indication).
      *   *Catch 1 (The Dealbreaker):* Grades assigned *afterwards* by radiologists who knew treatment and outcome.
          *   *Implication:* This is **measurement bias / observer bias**. The stratifier is contaminated by the outcome. It is no longer a true pre-treatment variable in the dataset, even if the scan was pre-treatment. The *value* of the variable was influenced by knowledge of the outcome. This creates a collider-like structure or simply invalidates the variable as a confounder because $Z$ (grade) is now correlated with $Y$ (outcome) through the radiologist's bias, not just biology.
          *   *Connection to Past Cases:* This is worse than Case 2. Case 2 was post-treatment physiological status. This is post-outcome *recording* of a baseline variable. It violates the integrity of the stratifier.
      *   *Catch 2 (Generalizability):* Hospital sees more late-stage patients than the trial.
          *   *Implication:* This suggests the aggregate might be more representative of *this* hospital's reality, even if the stratified estimate is the "true" biological effect. However, usually, we want the biological effect (CATE) to apply to our population. But if the grading is biased, we can't trust the CATE.
      *   *Applying Mira's Rule:*
          *   Is it pre-treatment? Physically yes, epistemically no (recorded post-outcome with bias).
          *   Is it a causal confounder? Intended to be, but corrupted.
          *   Is it arbitrary? No.
          *   Sample size? Not mentioned, assume okay.
          *   *Crucial Link:* Look at Case 2 (Post-treatment conditioning) and Case 3 (No causal story). Here, the "causal story" is broken because the measurement process is contaminated by the outcome. The variable $Z$ is now a function of $T$ and $Y$ (via the radiologist). Stratifying on this induces bias.
