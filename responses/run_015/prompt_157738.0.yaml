  5.  **Drafting the Response:**

      *   **Identify the Rule:** Mira follows a **Causal Validity + Reliability** rule. Specifically: *Stratify only on pre-treatment confounders that are measured without outcome-contamination, have a non-arbitrary causal definition, and offer sufficient statistical power.*
      *   **Evaluate Candidate Rules:**
