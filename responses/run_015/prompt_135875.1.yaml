answer: |-
  ### Part I: Diagnostic Brainstorm

  Before we reconstruct the theoretical framework, let's isolate the conceptual knots in your current reasoning. You are oscillating between three distinct philosophical categories without realizing they are doing different work.

  1.  **The "Fact of the Matter" Confusion:** You suggest that if felicity conditions (Austin's "happy/unhappy") govern promises, there is "no real fact of the matter." This is a category error. In social ontology, institutional facts (like promising, marrying, or scoring a goal) *are* facts, constituted by rules and conventions. They are not metaphysical atoms, but they are not merely subjective feelings either. A check is just paper unless the banking system validates it; similarly, a promise is just noise unless the conversational context validates it. The "fact" lies in the satisfaction of the conditions, not in the physics of the sound waves.
  2.  **The "Austin's Retreat" Misreading:** You recall Austin abandoning the constative/performative distinction. He did, but not because the framework collapsed. He abandoned it because he realized *all* utterances are performative (even stating a fact is an act of stating). He replaced the binary with the triad: Locution (meaning), Illocution (force), and Perlocution (effect). This wasn't a surrender; it was a generalization. Speech act theory didn't die; it matured into the analysis of *illocutionary force*.
  3.  **The Illocution/Perlocution Swap:** You propose tagging perlocutionary effects (reliance, reassurance) instead of illocutionary acts (promising) to be "more honest." This changes the normative stakes entirely. A promise creates an *obligation* regardless of whether the listener relies on it. If I promise to meet you for lunch and you forget, I still broke my promise. If we track only perlocution (did you rely?), we track *damages*, not *breach*. Your PM is denying the obligation, not the psychological impact.

  ***

  ### Part II: The Philosophical Analysis

  Let's treat your tool not as a mere classifier, but as an attempt to codify **illocutionary uptake** within a specific linguistic community. Here is how speech act theory applies to your engineering problem.

  #### 1. The Ontology of the Promise: Institutional Facts
  You asked if there is a "fact of the matter" regarding whether a promise occurred. In the tradition following Austin and John Searle, the answer is **yes**, but it is an *institutional* fact, not a *brute* fact.

  Searle formalized Austin's insights into the formula of **Constitutive Rules**: *X counts as Y in context C.*
  *   **X:** The utterance "I'll pick that up."
  *   **Y:** A commitment/promise.
  *   **C:** The #standup channel, during work hours, addressed to a project lead.

  Your intuition that "a promise is just whatever your local group's rules say counts as one" is actually philosophically robust. It aligns with Searle's *The Construction of Social Reality*. However, you cannot simply encode the *explicit* rules (like the #standup rule). You must also encode the *implicit* conventions of your workplace.

  When someone types "sure, i'll pick that up" in a DM, the "context C" is weaker than in #standup. The tool fails if it looks for the word "promise." It must look for the **illocutionary force indicating devices (IFIDs)**. These are not just keywords; they are syntactic and pragmatic markers that signal the speaker intends to undertake an obligation.
  *   *Explicit IFID:* "I promise." (Often joking, as you noted).
  *   *Implicit IFID:* "I'll handle it," "On my plate," "Leaving this with me."

  **The Verdict:** Speech act theory is not a dead end; it is the *only* reason your tool is conceptually possible. Without the distinction between "making a noise" and "undertaking an obligation," you have no target variable.

  #### 2. Austin's "Retreat" and Felicity Conditions
  You are worried that Austin's move away from the constative/performative binary undermines the stability of the concept "promise." It does the opposite.

  In *How to Do Things with Words*, Austin realized that saying "The cat is on the mat" is just as much an action (an act of stating) as saying "I bet you five dollars." He replaced the Performative/Constative split with the **Locution/Illocution/Perlocution** triad.
  *   **Locution:** The propositional content ("I will fix the bug").
  *   **Illocution:** The force (Committing/Promising).
  *   **Perlocution:** The consequence (You feel relieved; you stop testing).

  Austin argues that for an illocutionary act (like promising) to be successful, it must satisfy **Felicity Conditions**. If these conditions aren't met, the act is "infelicitous" (misfires or abuses). Crucially, some felicity conditions are objective facts about the conversation:
  *   **Convention:** There must be an accepted conventional procedure (e.g., assigning tickets).
  *   **Execution:** The procedure must be executed correctly (e.g., by the person capable of doing the work).
  *   **Uptake:** The hearer must understand that a promise is being made.

  **The Verdict:** Austin didn't say "there is no fact of the matter." He said the fact of the matter *depends on the satisfaction of these conditions.* Your tool is essentially a **Felicity Condition Checker**. It shouldn't ask "Did they say 'promise'?" It should ask: "Was this an assertion of future action (Locution) + Did it occur in a context where such assertions bind the speaker (Convention) + Was there evidence the listener registered it (Uptake)?"

  #### 3. Why Perlocution (Effects) Won't Save You
  You suggested tagging messages based on perlocutionary effects (listener reliance, reassurance, plan changes) and dropping "promise" as a category. You framed this as being "more honest." Philosophically, this is a retreat from **deontology** (rules/obligations) to **consequentialism** (outcomes).

  This will not solve your dispute with the Project Manager.
  *   **The PM's Move:** "Nobody promised." This is a denial of *illocutionary force*. He is claiming no obligation was incurred.
  *   **Your Proposed Counter:** "But people felt reassured!" (Perlocution).
  *   **The PM's Reply:** "Feelings aren't commitments. I didn't agree to be bound."

  If you track perlocution, you are tracking *trust*, not *commitment*. You might prove that the team *expected* the work done, but you cannot prove the speaker *obligated* themselves to do it. In many legal and ethical frameworks, reliance can create liability (promissory estoppel), but in a collaborative team dynamic, the norm is usually explicit or implicit commitment.

  Furthermore, perlocutionary effects are notoriously difficult to isolate in text logs. How do you algorithmically detect "reassurance"? You can detect "Thanks!" or "Great," but silence is not evidence of lack of reliance. Illocutionary acts, by contrast, are encoded in the syntax and pragmatics of the speaker's output.

  #### 4. The Implementation Strategy: Illocutionary Force Detection
  So, is speech act theory useful for your tool? Yes, but you must implement it as **Contextual Conventionalism**.

  1.  **Define the Contexts (C):** Your #standup rule is a "Explicit Constitutive Rule." That is the easiest class. But you need to define other contexts. Does a DM to a lead count? Does a public channel mention count? You need to map the "Context C" variables.
  2.  **Identify the IFIDs:** Move beyond "promise." Train your classifier on **commitment predicates**.
      *   *High Force:* "I own this," "I'll ship it," "On me."
      *   *Low Force:* "I can look," "Maybe I'll grab it," "I'll try." (These are often hedges that explicitly *avoid* illocutionary commitment).
  3.  **Check for Uptake:** A promise without uptake is a misfire. If the speaker says "I'll do it" and the listener replies "No, don't worry, I got it," the promise was rejected. Your tool needs to analyze the *thread*, not just the single message. If the listener accepts the offer ("Thanks, that helps"), the illocution is secured.

  ### Summary Recommendation

  You are not misreading Austin so much as under-estimating the rigidity of his conditions.
  1.  **Don't abandon "Promise."** The category is real because the *obligation* is real within your social structure. Switching to "effects" concedes the normative ground to the PM.
  2.  **Don't treat it as semantic.** It is pragmatic. "I'll pick that up" means nothing without the context of the ticket system.
  3.  **Build a Felicity Checker.** Your tool should output: *"High probability of Illocutionary Commitment detected. Context: Standup. Uptake: Confirmed by Lead."*

  The PM is relying on the ambiguity of natural language to dodge institutional facts. Your tool's job is to make the institutional facts visible. Speech act theory gives you the vocabulary to distinguish between "I said I would" (Locution) and "I bound myself to" (Illocution). Stick with the Illocution.
