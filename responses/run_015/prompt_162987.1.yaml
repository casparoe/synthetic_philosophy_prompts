      *   **Complication 1 (Convergent Analogues):** Runner/Dimmer vs. Lamp. Is the difference just convergence vs. divergence? Or does the convergent case also rely on extra stipulations? How does this relate to Thomson's claim that supertask impossibility isn't about series convergence?
