  CLAIM: take an agent that is genuinely embedded — it's a physical process inside the environment it reasons about, and it knows this. Because its self-model has to fit inside itself, it keeps a lossy one: a distribution over its own future actions, fit to its own past behaviour, much smaller and coarser than the agent itself. instead of reasoning counterfactually about what it would do if its own source code were different (which it treats as logically impossible given that it can read its own source), it plans by taking expectations over that self-model, and it enforces a reflection principle: it treats its own future beliefs as well-calibrated on average, so it never expects to profit by betting against its later self. call that the calibration patch. The claim is that given enough compute the calibration patch is sufficient — such an agent ends up doing about as well, by its own ex-ante lights, as one that somehow had a true complete outside-view model of itself, and there is no residual failure mode that survives purely because of self-embedding.

