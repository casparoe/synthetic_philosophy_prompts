      *   The "Counterfactual" requirement: To be a mind, the system must support counterfactuals. A flipbook doesn't. A simulation that doesn't respect timing or physical constraints might not either.
      *   The "Causal Power" worry: If the higher level is just a pattern, does it have *oomph*? (Kim's Exclusion Argument). This is the real philosophical headache for the "Both" view.

  7.  **Structuring the Response:**

