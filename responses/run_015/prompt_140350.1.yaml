      *   **Claim-by-Claim Breakdown:**
          1.  Determinism (Agreed).
          2.  Epiphenomenalism of Simmballs (Disputed - Real Patterns).
          3.  Double Counting/Ockham (Disputed - Different Granularities).
          4.  Substrate Independence (Disputed - Organization is key).
          5.  The Flipbook (Partial Concession - Needs Counterfactuals).
      *   **Diagnosing the Blog Post's Error:** Confusing *implementation* with *computation*, and *supervenience* with *exclusion*.
      *   **The Surviving Conclusions:** Substrate independence survives *if* causal connectivity is preserved. Symbol level is not *merely* in the eye of the beholder *if* it tracks real patterns.
      *   **The "Weaker Version" (The Real Threat):** The Exclusion Problem (Kim) and the Triviality/Interpretation Problem (Putnam). The "Both" view needs to explain *why* some patterns are real and others aren't without appealing to a homunculus.

  8.  **Refining the Tone:**

