          *   Does Golding capture something about evolutionary cooperation in small finite groups that formal models miss (emotional signaling)?
          *   Does the uncertainty of rescue (discount factor) matter?
          *   **Crucial Constraint:** How to frame this for a book club without sounding like they are just using the book to illustrate game theory (i.e., keep the literary analysis primary, use theory as a lens, not a hammer).

  2.  **Deconstruct the Game Theory Concepts applied to *LotF*:**
      *   *Prisoner's Dilemma (PD):* Defecting (hunting/playing) yields higher individual short-term payoff than Cooperating (shelter/fire), but mutual defection leads to worse outcomes (death/savagery) than mutual cooperation (rescue/order).
      *   *Iterated PD (IPD):* The boys are stuck together. Future interactions should encourage cooperation (Shadow of the Future).
      *   *Shadow of the Future:* If they think rescue is imminent, the game ends soon (One-Shot). If they think they are there forever, the game is Iterated. The uncertainty creates a fluctuating discount factor ($\delta$).
      *   *Commitment Device:* The Conch. It establishes rules for speaking/order.
      *   *Indirect Reciprocity/Reputation:* In a small group, everyone knows everyone. But "noise" (fear of the Beast, chaos) disrupts reputation tracking. Jack rebrands "defection" (hunting) as "virtue" (providing meat/protection).
      *   *Asymmetric Payoffs:* Ralph values Rescue (High payoff for Fire). Jack values Power/Meat/Security from Beast (High payoff for Hunting). This isn't a standard symmetric PD.
