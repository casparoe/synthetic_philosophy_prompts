      *   **User's Hypothesis:** Cooperation collapses not because it's a one-shot game, but because punishment mechanisms are weak, reputation tracking fails in small/noisy groups, and payoff matrices are asymmetric (rescue vs. hunting).
      *   **Specific Questions:**
          *   Which scenes show the shift from iterated to one-shot logic?
