      *   *The Split (Chapter 8):* Jack forms his own tribe. The game changes from IPD within one group to inter-group conflict.
      *   *The Death of Piggy/Simon:* The ultimate breakdown of reciprocity. One-shot violence.

  4.  **Address the "Resistance to Theory" (Literary Nuance):**
      *   Game theory assumes rational actors. The boys are children, driven by fear, instinct, and subconscious drives (Freudian Id/Ego/Superego).
      *   Emotional signaling (fear of the Beast) overrides rational calculation.
