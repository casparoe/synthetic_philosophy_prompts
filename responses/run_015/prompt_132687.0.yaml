  I take three derivations seriously: Deutsch-Wallace (decision-theoretic), Zurek's envariance, and self-locating uncertainty accounts. Each fails on a single critical premise. For Deutsch-Wallace, it is Measurement Neutrality: the claim that a rational agent must be indifferent between games that differ only in the number of null-amplitude branches or the physical implementation of the measurement, provided the weighted outcomes are identical. This smuggles in the conclusion that only amplitude matters. For envariance, the failure point is the assumption that probabilities supervene on the local reduced density matrix after tracing out the environment. This presupposes the trace rule, which is extensionally equivalent to the Born rule, violating condition (ii). For self-locating uncertainty, the weak premise is that an agent pre-branching can be uncertain about which successor they will be, despite knowing all physical facts. This requires a notion of personal identity that contradicts the deterministic branching ontology.

  The hidden work across all three is the equivocation between 'caring measure' and 'credence.' The derivations show you should weight branches by squared amplitude when maximizing utility. They do not show that these weights track truth or objective chance. They assume that rational betting behavior constitutes belief, bypassing the need for a truth-apt proposition. Furthermore, they assume branching is sufficiently discrete to support counting or weighting, ignoring the continuous nature of decoherence where branch count is gauge-dependent. If branch structure is fuzzy, the domain of the probability function is ill-defined. Finally, there is an unargued assumption that rationality constraints on preferences can generate epistemic norms without an underlying alethic anchor. If the universe is deterministic and all outcomes occur, preference orderings are merely aesthetic; linking them to confirmation requires a bridge principle that currently looks like a placeholder for the very chance concept Everettians seek to eliminate. Additionally, decision-theoretic arguments rely on the additivity of utility across branches. This assumes the value of a branching future is the weighted sum of successor utilities. This is a substantive ethical claim, not a rationality constraint. An agent might reasonably care only about their worst-off successor or the median experience. By ruling out these preferences via axiom rather than argument, the derivation protects the Born rule from counterexamples rather than deriving it from neutral premises. The structural elegance of the mathematics masks these normative imports.

  1. **Headline Credence:** 0.32. **Sociological Credence (2050):** 0.48. The difference reflects anticipated fatigue: the community will likely lower its standards for 'satisfactory' to restore consensus, accepting pragmatic utility as a proxy for epistemic weight.

