     - **Branching Robustness (0.85):** Decoherence supplies a stable, quasi-classical structure sufficient for defining outcomes, though the exact grain remains gauge-dependent. This is the least problematic element; the formalism handles the ontology well enough for physics, even if metaphysics frets. The risk here is not that branching fails, but that it is too fuzzy to support precise probability assignments.
     - **Structural Soundness (0.60):** The mathematics of the derivations is rigorous, but the premises often smuggle in probabilistic assumptions under the guise of rationality or symmetry. Circularity is subtle but pervasive. For instance, assuming measurement neutrality presupposes that branch count is irrelevant, which is precisely what needs proving.
     - **No-Chance Gap (0.30):** This is the core failure. Deriving weights is not deriving credence. Without objective chance or indexical ignorance, weights are merely caring measures. Functionalism about credence fails to capture the truth-tracking role required for confirmation. The gap remains because deterministic branching offers no fact of the matter for credence to track.
     - **Normative Sufficiency (0.70):** Even if the gap remains, the Everettian might argue that rational action is all that matters. However, P demands epistemic weight for confirmation, not just decision guidance, lowering this term's relevance. If confirmation requires truth-apt belief, pragmatic success is insufficient.
