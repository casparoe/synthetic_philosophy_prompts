answer: |-
  ### Stakes Decision
  **Use the Box of Chocolates.**
  **Why:** The No-Trade Theorem and Winner's Curse logic rely on agents maximizing *expected* value. A 2% grade stake is high enough to induce significant risk aversion in final-year students. Risk aversion creates a natural bid-ask spread (I won't buy at 50 even if I think value is 51, because of the risk), which confounds the informational friction you are trying to isolate. Chocolates are low-stakes enough to approximate risk neutrality, ensuring that any refusal to trade is driven by *information*, not fear of loss.

  ---

  ### Materials and Setup

  **The Asset:** A certificate redeemable for **100 Points** if the State is **RED**, **0 Points** if **BLUE**.
  **The State:** Determined by a single draw from a **Master Urn** at the start of class (visible to all).
  *   **Master Urn:** Clear box containing 20 Red balls, 20 Blue balls. (Prior = 50/50).
  *   **TA Role:** Draws one ball, records the State secretly, returns ball. This is the "Truth" for the session.

  **Signal Decks (22 Envelopes):**
  Prepared in advance based on the *potential* State (you prepare two sets, pick one after the Urn draw).
  *   **If State is RED:** 15 Envelopes contain card **"r"** (Red signal), 7 Envelopes contain card **"b"** (Blue signal).
  *   **If State is BLUE:** 15 Envelopes contain card **"b"**, 7 Envelopes contain card **"r"**.
  *   *Note:* This gives a signal accuracy of ~68% ($15/22$). Bayesian update from 50% prior to ~70% posterior on one signal.

  **Trading Cards:**
  Each student gets 3 cards: **[BUY @ 50]**, **[SELL @ 50]**, **[PASS]**.
  Each student gets a **Score Sheet** (to track points).

  **Room Setup:**
  Chairs in pairs (11 pairs). Aisles clear for TA movement. Whiteboard reserved for tallying "Public Intent" in Round 1.

  ---

  ### The Rounds

  #### Round 1: The "Public Intent" Protocol (Common Prior, Pure Speculation)
  *   **Goal:** Demonstrate Point 1 (Trade collapses when willingness is public evidence).
  *   **Mechanism:**
      1.  Distribute Signal Envelopes. Students open privately.
      2.  **Rule:** The trading price is fixed at **50 Points** (the Prior Mean).
      3.  **Protocol:** Students hold up one Trading Card face-down. On count of three, all flip simultaneously.
      4.  **Visibility:** Everyone sees the room's distribution of Buy/Sell/Pass.
      5.  **Revision:** After seeing the room, students have 30 seconds to privately change their card.
      6.  **Execution:** Cards flipped again. Matches (Buy + Sell) trade at 50.
  *   **Expected Outcome:** In the first flip, Buys and Sellers appear. In the revision, almost everyone switches to **PASS**.
  *   **Logic:** If I hold [BUY], I signal I have an 'r'. Seeing a [SELL] tells me my partner has a 'b'. Conditioning on their willingness to trade at 50, my posterior belief reverts to the Prior (50). At Price 50, expected profit is 0. With any tiny friction (or strict rationality), trade collapses.

  #### Round 2: The "Liquidity Shock" (Non-Informational Motive)
  *   **Goal:** Demonstrate Point 2 (Trade returns with non-info motive).
  *   **Mechanism:**
      1.  Reshuffle Signals (new envelopes).
      2.  **The Hedger:** The TA secretly hands one student a **"Forced Seller"** slip before signals are opened. This student *must* submit [SELL] regardless of signal or lose 50 points.
      3.  **Common Knowledge:** The instructor announces: "One person in this room has a liquidity constraint and must sell. You do not know who."
      4.  **Protocol:** Same as Round 1 (Fixed Price 50, Public Flip, Revision).
  *   **Expected Outcome:** Trade resumes.
  *   **Logic:** If I see a Seller, it might be the Hedger, not an informed bear. I cannot infer their signal with certainty. My posterior does not revert fully to 50. Expected profit > 0. Trade becomes rational again.

  #### Round 3: The "Efficient Price" (Winner's Curse & Info Acquisition)
  *   **Goal:** Demonstrate Point 3 (Price $\neq$ Total Evidence) & setup for Point 4.
  *   **Mechanism:**
      1.  **Market Maker:** The TA acts as the counterparty for all trades.
      2.  **Price Setting:** TA announces a price $P$ based on the *aggregate* signals of the class (calculated roughly: if more 'r' envelopes were distributed, $P > 50$). *Note: You fake this slightly to ensure $P$ is "smart".*
      3.  **Info Market:** Before trading, students may pay **5 Points** to open a **Second Signal Envelope**.
      4.  **Trade:** Students choose Buy/Sell/Pass against the TA at Price $P$.
      5.  **Payoff:** This round uses **Proper Scoring Rule** (see below).
  *   **Expected Outcome:** Students who buy the second signal realize it costs 5 points but doesn't help them beat the TA's price (which already aggregates the info). Those who trade against the TA realize the "Winner's Curse": if the TA sells to you, the TA knows the aggregate info is worse than you thought.
  *   **Logic:** The Price $P$ reflects the *consensus* information. Your private signal is likely already "priced in." Buying more info is unrewarded; trading against the market is dangerous.

  ---

  ### Payoff Scheme

  **Hybrid Approach:**
  *   **Rounds 1 & 2 (Realized Profit):** You start with **100 Points**.
      *   If you Trade at 50 and State is Red: You gain 50 (Asset 100 - Cost 50).
      *   If you Trade at 50 and State is Blue: You lose 50 (Asset 0 - Cost 50).
      *   If you Pass: 0 change.
      *   *Why:* You need to *feel* the loss of points in Round 1 to understand the "curse." PSR is too abstract for the "ouch."
  *   **Round 3 & Final Debrief (Proper Scoring Rule):**
      *   At the end of Round 3, every student writes down their final probability $q = P(Red)$.
      *   **Bonus Points:** $20 \times (1 - (q - Outcome)^2)$.
      *   (If Outcome=1 [Red] and $q=1$, Bonus=20. If $q=0.5$, Bonus=15).
      *   *Why:* This shifts the focus from "gambling" to "epistemic accuracy" for the final conceptual takeaway.

  **Total Score:** Round 1&2 Profit + Round 3 Bonus.
  **Prize:** Top 3 scores share the Box of Chocolates.

