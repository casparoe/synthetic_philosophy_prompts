  ### Debrief Design

  **Opening Questions (Ask these first, before lecturing):**
  1.  "In Round 1, hands went up, then went down. Why did you change your mind?"
  2.  "In Round 2, trade happened. Did the asset's *value* change, or did the *meaning of the trade* change?"
  3.  "In Round 3, if the TA's price was 60, and you bought a second signal to find out it was 'Red', did you know something the price didn't?"

  **Mapping Table:**

  | Session Moment | Conceptual Point | Instructor Script (Post-Game) |
  | :--- | :--- | :--- |
  | **Round 1 Collapse** | **1. Willingness is Evidence** | "When you saw a Seller, you realized they wouldn't sell at 50 unless they had a 'b' signal. Their willingness to trade destroyed your reason to trade. This is the structure of the **No-Trade Theorem**." |
  | **Round 2 Resumption** | **2. Non-Info Motives** | "Trade returned not because information changed, but because a **Liquidity Shock** (Hedger) entered. Now, a Sell order is ambiguous. It could be info, or it could be need. Trade becomes possible again." |
  | **Round 3 Pricing** | **3. Price vs. Evidence** | "The TA's price of 60 wasn't just a guess. It was the value *conditional on someone taking the other side*. If you bought at 60, you suffered the **Winner's Curse**: you traded against a counterparty who knew the aggregate info better than you." |
  | **The Urn Setup** | **4. Common Prior Tension** | "We all trusted the Urn (50/50). This is the **Common Prior Assumption**. If you had doubted the Urn, Round 1 trade would have happened. **Hayek** argues markets work precisely because we *don't* share priors. Our game broke down because we assumed we did." |

  **Handling the Hayekian Objection:**
  *   *If nobody raises it:* "We built this game on the rule that we all trust the Urn equally. That is a massive assumption. If half the room thought the Urn was rigged to be Red, Round 1 would have exploded with trade. The theorem says: 'No trade if Priors match.' Hayek says: 'Priors never match.' Which one describes the real world?"
  *   *If a student raises it:* "Exactly. The model proves that *if* we agree on the rules of the game, we can't bet against each other. But in reality, we don't agree on the rules. That is where the market's cognitive work actually happens."

  ---

  ### Predictable Failures & Handling

  1.  **Failure:** "The prediction is about expectations, not individuals." (Some pairs trade in Round 1 anyway).
      *   **Handling:** "Look at the aggregate. Volume dropped from Round 1 to Round 2? No, it increased. The *margin* trader stopped. The theorem predicts the *marginal* unit of trade vanishes, not that every single human freezes."
  2.  **Failure:** "One or two students refuse to trade on principle."
      *   **Handling:** "Good. You are acting as the friction. But notice: if *everyone* does that, the price never discovers the truth. That's the cost of the safety."
  3.  **Failure:** "Treating it as a puzzle to be gamed." (e.g., trying to bluff).
      *   **Handling:** "Bluffing requires you to know the State. You only have a signal. If you bluff Sell with an 'r' signal, you might force a trade that loses you points. Rationality constraints bind even bluffers."
  4.  **Failure:** "Someone blurts their signal."
      *   **Handling:** **Prevention:** "If anyone speaks a signal, that round is void, and everyone gets 0 points for that round." (Enforce this strictly).
  5.  **Failure:** "Half the room draws the wrong moral from luck." (e.g., "I traded in Round 1 and won, so the theorem is wrong.")
      *   **Handling:** "You won on *realization*, not *expectation*. If you played that round 100 times, you would lose points. We are studying the structure of expectation, not the luck of the draw."

  ---

  ### Limitations (What You Must Supply in Lecture)

  This activity cannot reproduce the following; you must explicitly state them in the post-game lecture:

  1.  **The Common Prior Assumption Itself:** The game *forces* a common prior (the Urn). You must explain that this is the *assumption being tested*, not a fact of nature.
  2.  **Iterated Knowledge:** The game allows one round of "I know that you know." Real markets involve infinite iterations ("I know that you know that I know..."). The game approximates this with the "Revision Phase."
  3.  **Risk Neutrality:** The point system approximates this, but you must state that the theorem formally requires linear utility.
  4.  **Zero Transaction Costs:** We added a tiny cognitive cost (the revision). The theorem requires *zero* costs. If trade happened in Round 1, it was because the "cost" of updating wasn't high enough to kill the small expected profit.
  5.  **"No Speculative Trade" vs. "No Gains from Trade":** Clarify that trade *for consumption* (Round 2 Hedger) is still possible. The theorem only kills *speculative* trade (betting on differences of opinion).

  **Final Note for the Instructor:**
  The success of this session depends on your refusal to explain *why* Round 1 collapsed until the debrief. When students ask "Why did everyone pass?" during the game, answer only: "Record your decision. We will discuss the pattern at the end." Let the confusion sit. That cognitive dissonance is the learning engine.
