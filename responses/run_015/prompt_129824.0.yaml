          *   Pairs. Fixed Price 50.
          *   Step 1: Private Signal.
          *   Step 2: Public Declaration. "I am In" or "I am Out".
          *   Step 3: If both "In", trade executes at 50.
          *   *Why would they opt Out?* If I am "In" (Buy), it means I think Value > 50. If you are "In" (Sell), you think Value < 50.
          *   If we share priors and know each other's rationality: Seeing you "In" (Sell) tells me you have a bad signal. I update my belief down. Maybe now Value < 50. So I withdraw.
          *   *To ensure this happens:* The signal strength must be balanced against the prior.
          *   *Signal:* 55% accuracy? No, needs to be strong enough to initiate, weak enough to reverse.
          *   *Let's try:* Prior 50. Signal moves belief to 70.
          *   If I Buy, I think 70. If you Sell, you think 30.
          *   If I know you Sell, I know you have a negative signal. My posterior becomes... roughly 50 again (if signals symmetric).
          *   So at Price 50, the expected profit becomes 0. Risk aversion (or just strict rationality) kills the trade.
          *   *Okay, this works.* Round 1: Public "In/Out" at Price 50. Trade should stall.

      *   **Round 2: The "Hedger" (Non-Info Motive).**
          *   Goal: Demonstrate Point 2 (Trade returns with non-info motive).
          *   Mechanism: Introduce 2-3 "Hedgers" (TA + 1 student or pre-assigned).
          *   Hedger has a fixed value for the asset (e.g., needs Red asset for a project, values it at 80 regardless of truth, or has a liquidity shock).
          *   Let's go with **Private Use Value**.
          *   Hedger values Asset at 60 if Red, 10 if Blue (Shifted payoff). Or simply: Hedger *must* sell to raise cash.
          *   *Simpler:* Hedger has a "Liquidity Need". They *must* sell 1 unit at any price > 40.
          *   Speculators know Hedgers exist but don't know who they are.
          *   Now, if someone sells, it might be because they are a Hedger, not because they have info.
          *   Speculators update less aggressively. Trade resumes.

      *   **Round 3: Information Acquisition (Winner's Curse).**
          *   Goal: Demonstrate Point 3 (Price $\neq$ Total Evidence) & Point 4 (Common Prior tension).
          *   Mechanism: Before trading, students can buy a 2nd signal for a cost (points).
          *   Price is set by auction (or TA acts as market maker).
          *   If they buy info, they realize the price already reflects the info of others.
