answer: |-
  ### Slide 1: The One-Sentence Thesis
  **"Sphexishness is not behavioral rigidity but a failure of re-entry: agency is the capacity to resume interrupted routines at the appropriate grain, making 'free will' a measure of how costly it is to revise your own stopping rules."**

  ***

  ### Pre-emptive Concessions (First 5 Minutes)
  *Disarm the room before they sharpen their knives.*

  1.  **To the Animal Behaviorists:** "I am not claiming the wasp is irrational or maladaptive. Her loop is ecologically robust. I am claiming it is architecturally brittle. Fitness $\neq$ Flexibility."
  2.  **To Priya (Robotics):** "Re-entry is not a magical property. It is a known control pattern. My claim is not that it's impossible to build, but that it is computationally expensive, which is why it comes in degrees."
  3.  **To Marion & The Incompatibilist:** "I am not solving the Problem of Ultimate Responsibility. If determinism is true, this machinery is determined. I am offering a descriptive account of *variance* in agency, not a metaphysical get-out-of-jail-free card."

  ***

  ### Q&A Prep Sheet: Objections & Replies
  *Ordered by Likelihood $\times$ Damage. Replies are scripted for ~2 minutes spoken.*

  **1. The "Trivial Implementation" Objection (Priya, Robotics)**
  *   **The Question:** "You're treating re-entry like a deep philosophical insight. In hierarchical planning, handling interrupts and restoring state from a stack is a standard design pattern I could implement in an afternoon. If it's that cheap, why is agency rare? If it's not that cheap, what's the actual cost function you're pointing to?"
  *   **The Reply:** "You're right that the *code* is cheap. The cost isn't in the interrupt handler; it's in the representation of the goal. To re-enter at the *right* grain, the system needs a model of *why* it was doing the sub-routine, not just *that* it was doing it. A simple stack pointer lets you resume the motion; a semantic model lets you resume the *task*. If I'm interrupted while cooking, resuming the motion means chopping the onion again; resuming the task means checking if the onion is still needed. The cost is maintaining that meta-model online while the object-level process runs. That's expensive, which is why it degrades under load, stress, or cognitive scarcity."
  *   **Soft Spot:** I haven't formally defined the "semantic model" vs. "stack pointer" distinction in a way that satisfies a control theorist.

  **2. The "Redescription" Objection (Marion, Compatibilist)**
  *   **The Question:** "This sounds like Reasons-Responsiveness and Guidance Control with engineering vocabulary bolted on. If the agent can revise stopping rules in response to reasons, that's just weak reasons-responsiveness. What work is 're-entry' doing that 'guidance control' doesn't already do?"
  *   **The Reply:** "Reasons-responsiveness focuses on *action selection*—choosing $A$ over $B$ given a reason. My focus is *process termination*—knowing when to stop running $A$. You can be reasons-responsive in selection but sphexish in termination (think of the bureaucrat following rules that no longer serve the goal). Re-entry isolates the specific architectural failure of being unable to halt or modify a running script, which is distinct from failing to select the right script initially. It explains why smart people do dumb things when they're 'in the flow' of a bad plan."
  *   **Soft Spot:** The boundary between 'selecting an action' and 'continuing a routine' is fuzzier in standard action theory than I'm admitting.

  **3. The "Adaptive Loop" Objection (Animal Behaviorist 1)**
  *   **The Question:** "You're treating the wasp's re-inspection as a bug. But in a noisy environment, verifying the nest state after disturbance is adaptive. How do you distinguish a 'sphexish failure of re-entry' from a 'robust verification strategy' without just stipulating the outcome?"
  *   **The Reply:** "By perturbing the *conditions* of the check, not just the location. If the wasp re-inspects because the nest was disturbed, that's robust. But Hofstadter's case involves moving the cricket *while* she is inside. If she drags it back to the threshold and checks the nest again without checking the cricket's position, she's running a script triggered by 'cricket at threshold,' not 'nest secure.' The test is: does the agent update the *parameters* of the routine based on the interruption, or just re-run the routine? Adaptive verification updates parameters; sphexishness re-runs the binary."
  *   **Soft Spot:** Empirically difficult to prove the wasp isn't checking a parameter I can't see.

  **4. The "Broken Agent" Objection (Grad Student, Psych/Clinical)**
  *   **The Question:** "Consider addiction or OCD. The agent clearly sees the stopping rule is wrong—they have the meta-awareness—but they physically cannot revise it. They have re-entry capacity but no control. Doesn't this break your link between revisability and agency?"
  *   **The Reply:** "It doesn't break it; it proves the 'cost' variable. I'm arguing agency is a gradient based on the *cost* of revision, not a binary switch. In addiction, the cost of revising the stopping rule is metabolically or neurologically prohibitive. The agent *has* the architecture but lacks the resources to engage it. This explains why we pity the addict rather than treating them like a wasp: we recognize the mechanism is present but hijacked. It preserves the distinction between 'cannot' and 'does not' without requiring magic."
  *   **Soft Spot:** Risks making 'free will' too cheap—if awareness is enough, why aren't they responsible?

  **5. The "Regress" Objection (General Philosophy)**
  *   **The Question:** "You say there's no top level, just expensive levels. But what makes the highest *accessible* level non-sphexish? If the reviser is itself a mechanism, isn't it just a bigger wasp? Where does the agency actually enter?"
  *   **The Reply:** "It enters nowhere. That's the point. The demand for a 'self-certifying' level is itself a sphexish demand for closure. We want a homunculus who isn't a mechanism. There isn't one. There are just loops that can catch more of their own errors given enough time and energy. Agency isn't a substance; it's the depth of the error-correction hierarchy. If you demand a level that isn't mechanistic, you're asking for a miracle, not an explanation. I'm offering the explanation."
  *   **Soft Spot:** This is a straight bullet-bite. It leaves the foundation floating, which bothers realists.

  **6. The "Moral Irrelevance" Objection (Hard Incompatibilist)**
  *   **The Question:** "Let's say you're right. We have hierarchical revisability. But if the hierarchy is determined by prior causes, no one deserves praise or blame for having a 'deeper' hierarchy. You've described machinery, not moral responsibility."
  *   **The Reply:** "I agree. I am not grounding *desert*. I am grounding *capacity*. We hold agents responsible because they are the kind of system that *can* be influenced by reasons at a meta-level. If I have a deep hierarchy, threatening me with punishment changes my stopping rules. If I'm a wasp, it doesn't. Moral responsibility practices are tools for tuning these hierarchies. Whether the hierarchy was 'freely chosen' in a metaphysical sense is irrelevant to whether punishment works on it."
  *   **Soft Spot:** Concedes the metaphysical battle entirely; might alienate those wanting a stronger defense of responsibility.

  **7. The "Operationalization" Objection (Animal Behaviorist 2)**
  *   **The Question:** "Okay, practical question. I'm in the field. What is the dependent variable? How do I measure 're-entry' vs. 'restart' in a way that isn't just interpreting behavior to fit the theory?"
  *   **The Reply:** "Latency. A restart requires re-initializing the context, which takes time. Re-entry requires loading a saved state, which is faster. If you interrupt a routine, measure the time to resume the *specific* interrupted sub-step versus the time to begin the sequence from step one. If the latency correlates with the complexity of the interrupted step rather than the start of the sequence, you have re-entry. If it's always 'start sequence' latency, it's sphexish."
  *   **Soft Spot:** In complex agents, 'restart' can be very fast. Latency alone might not be a robust marker.

  **8. The "Robot Rights" Objection (Priya, Follow-up)**
  *   **The Question:** "If I build a robot with this architecture—hierarchical, revisable stopping rules, expensive meta-levels—is it an agent? If yes, your bar is太低 (too low). If no, what's the magic ingredient?"
  *   **The Reply:** "Yes, it is an agent. A minimal one. We are scared to call robots agents because we think 'agent' implies 'soul' or 'human.' Drop that. If it revises its own stopping rules in response to environmental feedback, it has agency. The difference between that robot and you is the *depth* of the hierarchy and the *content* of the goals, not the presence of a spark. Don't fear the robot; fear the human who acts like one."
  *   **Soft Spot:** Alienates the human-exceptionalists in the room.

  ***

  ### The One Reply That Must Land
  **The Regress Objection (#5).**
  If you waffle here and suggest there *is* a special top level, Marion and the Incompatibilist will tear you apart for inconsistency. If you say "it's turtles all the way down" without explaining why that's okay, you sound like you've given up. You must sell the idea that **the demand for a non-mechanical foundation is the actual pathology.**

  ### The Question You Hope Nobody Asks
  **"If a wasp has a deep enough hierarchy, does it become morally responsible? And if a human has a shallow enough hierarchy (e.g., severe cognitive impairment), do they lose it?"**
  *Why:* It forces you to draw a normative line on a descriptive gradient. Any specific cutoff you propose will be arbitrary; any refusal to propose one makes your theory useless for the ethics people who showed up.
