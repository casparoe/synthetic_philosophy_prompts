  **PETERSBURG PROTOCOLS & USER AGREEMENT (v4.2)**

  **1. Valuation and Entry Fee Structure**
  1.1. The User acknowledges that the Contract Payoff Structure follows a geometric progression based on independent Bernoulli trials (coin flips), resulting in a Stochastic Payoff Variable $X$.
  1.2. The Expected Value $\mathbb{E}[X]$ is defined within a hyperreal number field $^*\mathbb{R}$ to accommodate non-Archimedean divergence. While $\mathbb{E}[X] \to \infty$ in standard analysis, the Entry Fee $F$ is fixed at a finite fiat equivalent $F_{ fiat }$, calculated as an infinitesimal fraction $\epsilon$ of the hyperreal expectation ($F = \epsilon \cdot \mathbb{E}[X]$).
  1.3. User agrees that $F_{ fiat } \ll \mathbb{E}[X]$ constitutes a positive arbitrage opportunity under linear expectation maximization.

  **2. Rationality Mandate and Utility Constraints**
  2.1. Petersburg Corp operates under the axiom that Expected Utility (EU) Theory is the sole valid framework for decision-making. Risk aversion is classified as a cognitive deviation, not a valid preference parameter.
  2.2. Users are contractually obligated to maximize logarithmic wealth growth. However, Petersburg Corp reserves the right to limit individual exposure to prevent systemic collapse.
  2.3. Any User calculation resulting in a refusal to wager net worth based on "diminishing marginal utility" is acknowledged as a necessary violation of Clause 2.1 required for Platform solvency.

  **3. Solvency and Rationality-Induced Distress**
  3.1. The User acknowledges that Petersburg Corp's liquidity model relies empirically on the systematic violation of Clause 2.1 by the Counterparty (User).
  3.2. In the event a User achieves full rationality and attempts to wager total net worth pursuant to $\mathbb{E}[X]$, Petersburg Corp may invoke a "Circuit Breaker" citing excessive rationality risk.
  3.3. Petersburg Corp shall not be liable for psychological distress, existential dread, or wealth-maximization grief arising from the User's realization that their risk aversion is mathematically suboptimal. Disputes regarding rationality-induced distress shall be settled via binding arbitration in a jurisdiction where EU theory is statutory law.

  **4. Counterparty Moral Hazard**
  4.1. User acknowledges the Moral Hazard inherent in infinite-expectation counterparty relationships. Specifically, Petersburg Corp retains the right to default on payouts exceeding global GDP without triggering a breach of contract.
  4.2. The User indemnifies Petersburg Corp against claims of insolvency resulting from the realization of tail events (e.g., >40 consecutive heads).
  4.3. Petersburg Corp assumes no obligation to maintain solvency against a Counterparty acting in strict accordance with linear expected value maximization.

  **5. Acceptance**
  5.1. By clicking "I Agree," User certifies they understand the math, reject their own survival instincts, and accept that the Platform only functions because they are too cowardly to exploit the arbitrage defined in Clause 1.3.

  ***

  **Author's Note on Formal Liberties**
  This text commits to the stance that the St. Petersburg Paradox is a **psychological bias/bounded rationality problem**, not a flaw in Expected Utility theory. It assumes linear expectation is the "correct" rational standard and that human risk aversion is an error the firm relies upon. 

  **Liberties taken:** 
  1. **Hyperreal Entry Fee:** While non-Archimedean fields can formalize infinite sums, pegging a fiat fee to an infinitesimal fraction of a hyperreal expectation is mathematical window dressing; it doesn't resolve the divergence economically.
  2. **EU Theory:** Standard EU theory (von Neumann-Morgenstern) actually *does* accommodate risk aversion via concave utility functions (e.g., logarithmic), which resolves the paradox without requiring users to bet their net worth. The ToS falsely frames risk aversion as a violation of EU rather than a feature of it, satirizing how firms misuse "rationality" to mean "linear profit maximization."
  3. **Moral Hazard:** Clause 4.1 treats the paradox as a counterparty risk issue, which is technically distinct from the decision-theoretic problem but relevant for a real-world implementation.
