answer: |-
  The principle that best unifies your intuitions while grounding the reality of moral progress is **The Capabilities Approach** (developed by philosophers like Martha Nussbaum and Amartya Sen).

  **The Principle:**
  Morality is not about enforcing specific cultural scripts, nor is it about maximizing pleasure. It is about securing **central human capabilities**. These are the fundamental freedoms and functionings required for a dignified human life: bodily integrity, health, practical reason (the ability to plan your own life), affiliation, and control over your environment. A practice is morally wrong if it systematically deprives people of these capabilities, regardless of whether the culture accepts it or whether individuals report being "content."

  **How it saves your clear verdicts:**
  *   **FGC, Slavery, Foot Binding:** These are objectively wrong because they permanently violate **bodily integrity** and **health**, and they are typically imposed without **practical reason** (consent/choice). They physically foreclose future capabilities.
  *   **Bluntness & Horse Meat:** These are morally neutral because they are matters of etiquette or diet. They do not inherently strip humans of their central capabilities. Being spoken to rudely is unpleasant, but it doesn't prevent you from living a flourishing life. Eating horse meat is a dietary preference, not a violation of human rights.

  **The Case It Can't Save:**
  This principle cannot save your **uncertainty regarding the patriarchal society**.

  You wrote: *"A culture where men and women have very different social roles, and people within the culture are content with that arrangement: I'm genuinely unsure."*

  The Capabilities Approach forces you to drop this uncertainty and judge the arrangement as **wrong** (provided the roles are rigid and enforced). Here is why:

  **1. The Problem of Adaptive Preferences**
  The principle recognizes that human desires adapt to circumstances. If you are told from birth that your only role is to serve, and you are punished or shamed for wanting more, you will likely suppress the desire for more to avoid psychological pain. This is called **adaptive preference**.
  *   **The Verdict:** "Contentment" is not a valid moral defense if the options were never genuinely open. A prisoner who says they are content with their cell is not proof that imprisonment is moral. Similarly, women in a restrictive patriarchal system may report contentment because imagining a different life is psychologically costly or socially impossible.
  *   **The Requirement:** To be consistent with your stance on FGC and slavery, you must look at the **structure**, not just the **survey**. If the social roles prevent women from accessing education, political participation, or economic independence (capabilities), the system is morally deficient, even if the women say they are happy.

  **2. Moral Progress is Expansion, Not Satisfaction**
  You want to say moral progress is real. Under this principle, moral progress is defined as the **expansion of capabilities**, not the maintenance of order or reported happiness.
  *   Abolishing slavery was progress not because slave owners became happier, but because enslaved people gained the capability to direct their own lives.
  *   Therefore, moving from a rigid patriarchal society to one with equal opportunity is progress, even if it causes short-term social friction or disrupts "contentment."

  **Why you have to drop the uncertainty:**
  Your uncertainty stems from a respect for cultural self-determination. But the Capabilities Approach draws a hard line: **Culture cannot justify the suppression of basic human functioning.**
  *   If the gender roles are fluid and chosen freely (e.g., women *choose* to be homemakers but *could* be CEOs), the principle says that is **Neutral**.
  *   If the gender roles are rigid and enforced (e.g., women *cannot* be CEOs), the principle says that is **Wrong**.

  Since you described it as a culture with "very different social roles" (implying structural rigidity) rather than "different personal choices," the principle forces you to align this verdict with FGC and Slavery. You cannot treat it like Bluntness.

  **Summary:**
  Adopt **The Capabilities Approach**. It validates your belief in moral progress and your condemnation of FGC and slavery. But it demands consistency: it forces you to drop your **uncertainty about the patriarchal society**. You must judge it based on whether it allows women the *freedom* to choose their roles, not on whether they say they are *content* with the roles they have. If the structure limits their capabilities, it is wrong, full stop.
