answer: |-
  You have identified the core tension immediately: the dependence of the value on the *description* of the state space rather than the *structure* of the gamble itself. In physics, you would call this a failure of gauge invariance or coordinate independence. If the value of a physical system changes because you rotated your coordinate axes, the quantity is not physical. In decision theory, if the value of a gamble changes because you re-indexed the outcomes (a measure-preserving permutation), the valuation rule is not rational.

  Here is the specification you requested. It is structured as a set of demands a decision rule must meet to be considered adequate for an agent who wishes to act in the world rather than merely contemplate axioms.

  ### The Specification

  **1. Description Invariance (Coordinate Independence)**
  *   **Requirement:** The valuation of a gamble must not depend on the indexing or ordering of the state space, provided the probability measure and the mapping of states to outcomes remain unchanged. A measure-preserving permutation of the states must not alter the rank or value of the gamble.
  *   **Case:** Your case (ii), the re-presented Pasadena game. If summing along the natural numbers yields $\ln 2$ but summing along a permuted sequence yields $+100$, the rule is defective.
  *   **Status:** **Non-negotiable.** This is the analogue of your demand that physical quantities not depend on coordinates. Without this, the "value" is an artifact of the bookkeeping, not the gamble.

  **2. State-Wise Weak Dominance**
  *   **Requirement:** If Gamble $A$ yields an outcome at least as good as Gamble $B$ in every possible state, and strictly better in at least one, then $A$ must be strictly preferred to $B$.
  *   **Case:** Your case (i), Pasadena + $1. The payoff is strictly higher in every branch.
  *   **Status:** **Non-negotiable.** To violate this is to assert that an agent should prefer less to more, which undermines the definition of utility as a representation of preference.

  **3. Additivity over Independent Gambles**
  *   **Requirement:** For two independent gambles $A$ and $B$, the value of the compound gamble $(A + B)$ should equal the sum of the values $V(A) + V(B)$. At minimum, if $A$ and $B$ are exact mirrors (payoffs $x$ and $-x$ in the same states), the compound must be valued at zero.
  *   **Case:** Your case (iii), Pasadena plus its mirror. The net payoff is zero in every state.
  *   **Status:** **Non-negotiable** for the zero-sum case; **Preference** for general linearity. Violating the zero-sum case implies the agent values a sure loss or sure gain depending on how the package is wrapped.

  **4. Dynamic Consistency (No Self-Pumping)**
  *   **Requirement:** A plan chosen at the start of a sequential game must remain optimal at subsequent nodes, given the information revealed. An agent must not be exploitable by a bookie who merely waits for time to pass or re-describes the holding without changing the underlying distribution.
  *   **Case:** Your case (iv), the sequential Pasadena. If the valuation rule changes based on how many tails have already appeared (conditional expectation vs. prior), the agent can be money-pumped.
  *   **Status:** **Non-negotiable.** A rule that allows a bookie to extract money by cycling descriptions or waiting for a coin toss violates the purpose of guiding choice.

  **5. Unbounded Utility Sensitivity**
  *   **Requirement:** The rule must be capable of distinguishing between gambles involving arbitrarily large payoffs, even at arbitrarily small probabilities, without declaring all such utilities equivalent or capped.
  *   **Case:** Your case (vi), tiny probability of enormous good.
  *   **Status:** **Temperament.** This is where you distinguish yourself from the "bounded utility" school. It is not logically required for consistency, but it is required if you wish to model an agent who cares about potentially infinite stakes (e.g., existential risk or salvation).

  **6. Determinacy of Ranking**
  *   **Requirement:** For any two gambles presented for choice, the rule must output a preference (A > B, B > A, or Indifferent). It cannot return "Undefined" or "Incomparable" for standard financial or physical wagers.
  *   **Case:** General usability in policy reasoning.
  *   **Status:** **Preference.** One could accept a partial ordering, but for policy and one-off choices, a decision must be made. If the theory says "no answer," the agent is paralyzed.

  ### The Exclusionary Requirement

  The single requirement that does the most work in excluding candidates is **Description Invariance (1)**.

  Most proposed solutions to the Pasadena game rely on a "privileged ordering" (e.g., summing in the order of tosses $n=1, 2, 3...$). This is mathematically convenient but physically unjustified. There is no intrinsic "order" to the states of the world other than the labels we assign. A rule that relies on the natural ordering of integers to define expectation fails the invariance test because the integers are a representation, not a physical property of the coin tosses. Any rule that yields a finite value for the Pasadena game while maintaining standard linearity will almost certainly fail this invariance test, because the series is not absolutely convergent. If the integral is not absolutely convergent, its value *must* depend on the order of integration unless you introduce new structure (like a cutoff) that breaks the symmetry.

  ### Flagged Considerations

  **1. The Impossibility Result**
  You suspect the list itself is the result. You are correct. There is a precise contradiction here. You cannot simultaneously satisfy **Description Invariance**, **Additivity** (specifically linearity over infinite sums), **Dominance**, and **Unbounded Utility** for conditionally convergent gambles.
  *The Location:* The contradiction arises because Description Invariance effectively demands that the expectation integral be Lebesgue integrable (absolute convergence). The Pasadena game is only Riemann integrable (conditional convergence). To assign it a unique, invariant value, you must either drop Linearity (so the mirror image doesn't sum to zero), drop Dominance (so Pasadena + $1 isn't strictly better), or accept that some gambles simply have no determinate value (violating Determinacy). The "No-Go" theorem is that no extension of expectation can preserve all standard algebraic properties for non-absolutely convergent series while remaining invariant under state permutation.

  **2. Number vs. Partial Ordering**
  Should the rule output a number? A number invites a price, and a price invites a pump if the number is not robust.
  *The Tension:* If you output a single real number for the Pasadena game, you imply there is a fair price. But since the expectation is undefined, any price exposes the agent to a "money pump" via sequential betting or description cycling.
  *The Resolution:* A partial ordering is safer. It allows you to say "Pasadena + $1 is better than Pasadena" (Dominance) without saying "Pasadena is worth $0.69." It admits incomparability. However, for policy reasoning (your goal), incomparability is paralyzing. You likely need a number to act, which means you must accept a specific regularization (a specific cutoff or ordering) and acknowledge it as a convention, not a discovery.

  **3. Evaluation of Familiar Families**
  *   **Bounded Utility:** This solves the math by fiat. It declares that no outcome can have utility greater than some cap $M$. This renders the Pasadena integral absolutely convergent. *Verdict:* It satisfies all consistency constraints but violates your Temperament requirement (5). It purchases consistency by denying the premise that some outcomes are astronomically valuable.
  *   **Privileged Summation (Principal Value):** This selects a specific order (e.g., natural numbers) or a symmetric limit to define the value. *Verdict:* It yields a number and preserves Linearity, but violates Description Invariance (1). It is mathematically analogous to choosing a specific gauge without justification.
  *   **Difference/Status Quo:** This evaluates gambles only relative to a baseline, hoping the *difference* is integrable. *Verdict:* It handles the Mirror case well (difference is zero) but struggles with standalone valuation. It often fails Dynamic Consistency if the status quo shifts during the sequence.
  *   **Dominance Primitive:** This abandons numbers entirely and ranks only by state-wise comparison. *Verdict:* It satisfies Invariance and Dominance perfectly. However, it yields massive incomparability. Pasadena and its Mirror might be incomparable, leaving the agent unable to choose.
  *   **Nonstandard/Infinitesimals:** This uses hyperreal numbers to capture infinite and infinitesimal differences. *Verdict:* It preserves fine-grained distinctions and Unbounded Utility. However, it complicates the link to real-world prices and often hides the invariance problem within the construction of the hyperreal field itself.

  ### The Physics Analogy: Help and Misleading

  **Where it Helps:**
  Your intuition is exactly right. In physics, if a regularization scheme yields a result that depends on the coordinate system, the result is discarded as unphysical. The demand for **Description Invariance** is the decision-theoretic equivalent of demanding general covariance. It forces the theorist to distinguish between the *structure* of the problem (the probability measure and payoff function) and the *representation* (the indexing of states). It correctly identifies that the "paradox" is not in the world, but in the application of a tool (expectation) outside its domain of validity (absolute convergence).

  **Where it Misleads:**
  In physics, the "honest conclusion" that a question has no answer is validated by **measurement**. If your renormalization predicts a mass that disagrees with the scale, the theory is wrong. In decision theory, there is no external meter. There is no "true value" of the Pasadena game waiting to be measured. The constraint is not empirical fit, but **coherence**.
  This means the choice among rules is, to a significant degree, a choice of temperament. If you demand a number (Determinacy), you must accept a convention (breaking Invariance). If you demand Invariance, you must accept silence (Incomparability). In physics, nature decides for you. In decision theory, you must decide for yourself which axiom to sacrifice. The absence of an empirical constraint means you cannot "discover" the correct rule; you must stipulate the one that best matches the agency you wish to possess.
