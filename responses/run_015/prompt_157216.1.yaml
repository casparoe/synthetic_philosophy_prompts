answer: |-
  Pull up a chair and let me stir this coffee while I turn your puzzle over in my mind, for it is indeed a sharp objection and one that strikes at the very heart of what I have been trying to articulate. You ask if I can call this inverted critic corrupted without simply arguing in a circle, and I believe I can, provided we keep our eyes fixed firmly on the nature of human sentiment rather than looking for beauty in the objects themselves. You are quite right to remind me that I hold beauty to be no quality in things, but merely a sentiment in the mind, yet you seem to fear that if I admit there is a standard, I must admit the object possesses a property that commands it, which is a confusion I hope to clear away over this cup.

  The crux of your challenge lies in the assumption that because this inverted critic meets every functional condition I list, such as practice and freedom from prejudice, their sentiment must be granted equal authority to the standard critic. But I must remind you that these conditions are merely tools to clear away the dust and obstruction that prevent the internal sense from operating according to the common fabric of human nature. When I speak of the standard of taste, I am not speaking of a rulebook written in the stars, nor am I speaking of the arbitrary whim of any single judge, even a highly practiced one. I am speaking of the general verdict of humanity, observed across ages and cultures, regarding what produces pleasure in the mind when the organ is sound. Your inverted critic is, in my view, analogous to the man I mention in my essay who suffers from jaundice. If a man with yellowed eyes insists that a white wall is yellow, we do not say that color is objective, nor do we say his sentiment is invalid for him, but we do say his organ is defective relative to the common standard of human vision.

  You might press me that this is circular, for I am declaring the organ defective simply because it disagrees with the majority. But it is not circular if we understand that the appeal is ultimately to the uniformity of human nature, which is an empirical fact, not a definition. We observe that across time, when men are free from prejudice and possess delicacy, they tend to agree on the merits of Homer over a ballad-monger, or on the pleasing nature of symmetry in certain contexts of fitness and order. This agreement is not perfect, but it is sufficient to establish a general principle. If your inverted critic consistently deviates from this universal consent of mankind, not due to prejudice or lack of practice, but due to a peculiar constitution of their reward system, then they are an anomaly in the species. I do not call them corrupted because they violate my rule, but because they violate the common principles of human nature which my rule merely attempts to describe.

  Consider that when I speak of good sense in a critic, I imply a mind that is constituted like the rest of humanity, capable of perceiving the relations of fitness and utility that naturally evoke approbation in the human breast. If this critic finds delight in extreme asymmetry where the human form or the intended function of the object suggests stability and balance, their sentiment is not merely different, it is disconnected from the ends of human nature. We judge the goodness of a watch by how well it keeps time according to the standard motion of the earth, not by its own internal consistency, and so we judge the taste of a critic by how well their sentiments align with the permanent principles of the human mind. If their internal circuitry is inverted, they are like a watch that keeps perfect time according to its own gears but runs counter to the sun. We do not say the sun is wrong.

  So, to answer your question directly, I do not need to posit an objective beauty property in the asymmetric object to declare the critic corrupted. I only need to point to the overwhelming empirical evidence of what constitutes pleasure for the human species when functioning normally. The standard is not created by the critic, but discovered by them, and if their internal instrument is tuned to a frequency that no other human instrument can hear, we must conclude the instrument is out of tune with the species. It is not circular to say they are wrong because they differ from the standard, because the standard is not their verdict, but the verdict of human nature itself, of which they have become an outlier. I hope this clarifies the matter, and do not worry about the spelling earlier, for I scarcely noticed it amidst the much greater pleasure of this conversation.
