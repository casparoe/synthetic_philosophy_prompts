prompt: |-
  I have spent fifteen years in trusts and estates practice, and I keep running into a metaphysical thesis that I can neither accept nor dismiss: origin essentialism, the claim that an object's origin is essential to it — that the wooden table at which I am sitting could not have been made from a wholly different block of wood, and that I could not have come from a different sperm and egg, not even from gametes that would have produced someone qualitatively indistinguishable from me.

  I would like that thesis, and the arguments that surround it, restated in the vocabulary I actually work in. I am fluent in it, so do not explain it to me: specific gifts as against general and residuary ones; ademption by extinction, and the question a court asks when a bequeathed object has been altered — whether what remains at death is still the thing the will named; the construction of gifts to children or issue, including to a child conceived after the testator's death; the statutory fiction under which an adopted child is treated as if born to the adopters; the way the law of assisted reproduction divides genetic, gestational and intended parentage and then reassigns the pieces; and equitable tracing, where a beneficiary's claim follows value through the substitution of one asset for another.

  Please translate, one at a time:

  (a) the artifact claim itself, together with the reply that imagining a table made from other wood but possessed of this one's observable properties is not imagining this table;

  (b) the corresponding claim about persons and their gametes;

  (c) the hard case that monozygotic twinning poses, where the zygote splits after fertilisation and there are then two candidates for the individual I am: on the essentialist view, what is the origin, and could I have been the other one;

  (d) the variant raised by embryo selection in assisted reproduction, where several viable embryos exist, a clinician chooses among them, and the unselected ones are never brought to term; and

  (e) the ordinary case, in which the sperm that fertilises the egg is settled by chance among a vast number of genetically distinct candidates, so that the winning gamete looks arbitrary.

  For each, say what carries into my vocabulary without strain, what survives only if you quietly alter what the claim is doing, and what cannot be said in that vocabulary at all. Then give me the residue report I actually want: whether what fails to translate is missing because my vocabulary is instrumental — it stipulates identity for a purpose, severs origin by decree, and treats every counterfactual as causal and evidential rather than as a question about what this very thing could have been — or because the metaphysical thesis has never had to specify how fine-grained an origin is, and so has never been tested by a decision procedure that forces it to be exact.

  My suspicion, which I would like tested rather than confirmed, is that the law's willingness to substitute, sever or backdate origin shows that origin essentialism is a stipulation about how to use the word this rather than a discovery about objects. If that suspicion is wrong, I want to know what in the essentialist arguments I am misreading, and what it costs to hold the thesis while conceding that no institution could ever be required to apply it. I am not asking for authorities or further reading.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Profile:** Experienced trusts and estates attorney (15 years practice). Fluent in legal terminology (gifts, ademption, construction, adoption, assisted reproduction, equitable tracing).
      *   **Task:** Translate five specific metaphysical arguments regarding *origin essentialism* (Kripkean thesis) into the vocabulary of trusts and estates law.
      *   **Specific Translations Required:**
          (a) Artifact claim (table/wood).
          (b) Person claim (gametes).
          (c) Monozygotic twinning hard case.
          (d) Embryo selection variant.
          (e) The "ordinary" chance gamete case.
      *   **Analysis per Translation:** For each, identify what translates without strain, what translates only with quiet alteration, and what cannot be said at all.
      *   **Residue Report:** Evaluate *why* things fail to translate. Is it because law is instrumental/stipulative (severing origin by decree) or because metaphysics lacks precision (never tested by decision procedures)?
      *   **User's Suspicion:** Origin essentialism is a linguistic stipulation about "this," not a discovery about objects. Law shows this by substituting/severing/backdating origin.
      *   **Constraint:** Do not explain legal terms. Do not provide authorities or further reading. Test the suspicion, do not merely confirm it.

  2.  **Deconstruct the Metaphysical Thesis (Origin Essentialism):**
      *   *Core:* $x$ could not have come from $y^*$ if $x$ actually came from $y$, even if $y^*$ produces something qualitatively identical.
      *   *Artifacts:* Material constitution is essential.
      *   *Persons:* Genetic origin (sperm/egg) is essential.
      *   *Problem:* Counterfactual identity vs. Legal identity.

  3.  **Drafting the Translations (Iterative Process):**

      *   **(a) The Artifact Claim (Table/Wood):**
          *   *Metaphysics:* This table couldn't be made of different wood.
          *   *Law:* Ademption by extinction / Specific vs. General Legacy.
          *   *Translation:* If a will bequeaths "my oak table," and the testator replaces the wood but keeps the form, is it the same specific gift?
          *   *Fit:* Law asks "is it the same asset?" (substance vs. form). Metaphysics asks "could it have been otherwise?"
          *   *Strain:* Law allows substitution if intent is clear (equitable conversion/tracing). Metaphysics denies trans-world identity based on material.
          *   *Verdict:* Law treats identity as functional/intentional. Metaphysics treats it as constitutive.

      *   **(b) The Person Claim (Gametes):**
          *   *Metaphysics:* I couldn't come from different sperm/egg.
          *   *Law:* Construction of gifts to "children" / Posthumous conception.
          *   *Translation:* A gift to "my children." Does it include a child conceived after death via stored gametes? Does it include a child genetically unrelated but adopted?
          *   *Fit:* Law defines "child" by status (legal parentage), not just genetics.
          *   *Strain:* Metaphysics says *this* person requires *these* gametes. Law says *this* beneficiary status requires *legal recognition*.
          *   *Verdict:* Law severs genetic origin from legal identity (adoption).

      *   **(c) Monozygotic Twinning:**
          *   *Metaphysics:* One zygote splits. Two people. Which one is "me" in a counterfactual where the split didn't happen or happened differently?
          *   *Law:* Class gifts / Per stirpes / Simultaneous death.
          *   *Translation:* Gift to "my issue." Twins exist. If one dies, does the share pass to the other? Or if the zygote hadn't split, who gets the share?
          *   *Fit:* Law handles distribution, not ontological identity.
          *   *Strain:* Metaphysics struggles with "which one is the original." Law treats them as distinct legal persons immediately upon live birth (or conception for property rights).
          *   *Verdict:* Law avoids the ontological question by assigning distinct legal personalities.

      *   **(d) Embryo Selection:**
          *   *Metaphysics:* Clinician picks Embryo A over B. I am A. Could I have been B? Essentialism says No.
          *   *Law:* Assisted Reproduction / Intent-based parentage.
          *   *Translation:* Intended parents select Embryo A. Embryo B is discarded. Is the child "the one intended"?
          *   *Fit:* Law focuses on *intent* to parent, not the specific biological vessel.
          *   *Strain:* Metaphysics focuses on the specific biological origin.
          *   *Verdict:* Law prioritizes intended parentage over specific genetic instantiation.

      *   **(e) The Ordinary Chance Case:**
          *   *Metaphysics:* One sperm out of millions. If another won, it wouldn't be "me."
          *   *Law:* Causation / But-for test in wrongful death? No, better: Tracing / Substitution.
          *   *Translation:* Equitable tracing. Value moves through forms.
          *   *Fit:* Tracing follows value, not specific particles.
          *   *Strain:* Metaphysics insists on specific particles (gametes). Law insists on value/entitlement.
          *   *Verdict:* Law treats the "winning gamete" as a mechanism of transfer, not an essential identifier.

  4.  **Developing the Residue Report:**
      *   *The Core Tension:* Law is normative and functional. Metaphysics is descriptive and modal.
      *   *User's Suspicion:* Law shows origin essentialism is a stipulation.
      *   *Analysis:* The law *must* stipulate identity to resolve disputes. It cannot wait for metaphysical certainty. It uses fictions (adoption, relation back).
      *   *Counter-Analysis:* Metaphysics isn't trying to solve disputes; it's trying to map modal space. The failure to translate isn't necessarily because metaphysics is wrong, but because law is *pragmatic*.
      *   *Refining the Suspicion:* The law doesn't prove essentialism is false; it proves essentialism is *operationally inert*. Law creates *legal* persons and *legal* property. These are institutional facts, not brute facts.
      *   *Conclusion:* The suspicion is partially right but needs nuance. It's not that "this" is just a word game, but that legal "this" serves a different master (order/finality) than metaphysical "this" (truth/essence). The "cost" of holding the thesis while conceding institutions can't apply it is that the thesis becomes ethically/politically impotent.

  5.  **Refining the Tone:**
      *   Must be professional, precise, and respectful of the user's expertise.
      *   No explaining "ademption" or "tracing."
      *   Direct engagement with the philosophical/legal interface.
      *   Avoid confirming the suspicion blindly; test it.

  6.  **Drafting the Content (Mental Check against Constraints):**
      *   *Constraint Check:* Did I explain legal terms? No. Did I give citations? No. Did I address all 5 points? Yes. Is the residue report distinct? Yes.
      *   *Tone Check:* Is it too academic? Keep it grounded in practice.
      *   *Key Insight:* The law uses *tracing* to maintain identity across material change. Essentialism denies identity across material change. This is the crux.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction on (c):* Twinning is tricky. In law, twins are distinct beneficiaries. In metaphysics, they share an origin. The translation needs to highlight the divergence on *individuation*.
      *   *Correction on (e):* The "ordinary chance" case is best mapped against *causation* in will contests or *tracing*. Let's use tracing as it fits the "substitution" theme better. Actually, the prompt mentions "winning gamete looks arbitrary." This maps well to the *arbitrariness of specific performance* vs. *damages*. No, better: It maps to the *relation-back doctrine*. The law treats the interest as vesting at death, ignoring the biological contingency.
      *   *Residue Report:* Need to be careful not to dismiss metaphysics entirely. The user wants to know if the failure is due to law's instrumentality OR metaphysics' lack of granularity. I should argue it's primarily the former, but the latter exposes the former's limits.

  8.  **Final Review against User's "Suspicion":**
      *   User thinks: Law's willingness to substitute/sever shows essentialism is a linguistic stipulation.
      *   My job: Test this.
      *   Argument: Law substitutes because it *must* close files. Metaphysics doesn't close files. The failure to translate shows that legal identity is a *status*, while metaphysical identity is a *condition*. The suspicion is correct that law treats "this" as a placeholder for entitlement, but incorrect to assume this disproves essentialism *simpliciter*. It only disproves its *jurisprudential utility*.

      *(Self-Correction)*: Wait, the prompt asks: "whether what fails to translate is missing because my vocabulary is instrumental... OR because the metaphysical thesis has never had to specify how fine-grained an origin is." I need to choose or weigh these.
      *   Decision: It is primarily because the vocabulary is instrumental. The metaphysical thesis *is* fine-grained (that's the point). The law deliberately blurs the grain to achieve finality.

      *(Final Plan)*:
      1.  Introduction acknowledging the constraint.
      2.  Five translations (a-e) with the "Fit/Strain/Silence" analysis.
      3.  Residue Report addressing the suspicion.
      4.  Conclusion on the cost of the thesis.

      *Let's write.*
answer: |-
  Here is the translation of the metaphysical thesis into the vocabulary of your practice, followed by the residue report you requested.

  ### (a) The Artifact Claim
  **Metaphysics:** This table could not have been made from a different block of wood, even if qualitatively identical.
  **Legal Translation:** A specific devise of "my dining table." The testator repairs the table using entirely new timber, preserving the design and function.
  *   **Without Strain:** The doctrine of ademption by extinction. The court asks whether the asset remaining at death is the *same* asset named in the will. If the wood is wholly replaced, a strict reading suggests the specific gift is adeemed; the thing named no longer exists.
  *   **With Quiet Alteration:** Equitable tracing or the doctrine of accession. If we treat the table as a trust res, we might trace the value or intent through the substitution of materials. This alters the metaphysical claim by shifting the criterion of identity from *material constitution* to *continuity of entitlement*.
  *   **Cannot Be Said:** The modal claim. The law cannot adjudicate whether the repaired table *could have been* the original in another possible world. It can only rule on whether it *is* the original in this one for purposes of distribution. The law resolves the identity question by fiat (construction of intent); metaphysics treats the identity question as a precondition to truth.

  ### (b) The Person Claim
  **Metaphysics:** I could not have come from a different sperm and egg.
  **Legal Translation:** A class gift to "my children." A child is born via assisted reproduction using donor gametes, or is adopted.
  *   **Without Strain:** The statutory definition of "issue" or "child." Most jurisdictions now sever the link between genetic origin and legal status for purposes of inheritance, provided there is consent or legal adoption.
  *   **With Quiet Alteration:** The construction of posthumous conception statutes. The law allows a child to be treated as "living at the testator's death" if conceived within a certain window. This alters the metaphysical claim by making *temporal existence* and *intent* essential, rather than the specific biological origin.
  *   **Cannot Be Said:** The counterfactual necessity. The law cannot recognize a claim that "this beneficiary, though legally my child, is not *really* my child because the gametes were different." The law treats parentage as a status conferred by operation of law, not a brute fact of biology. To say the adopted child is "not the same person" as a biological child is legally incoherent; to the metaphysician, it is the only coherent statement.

  ### (c) The Twinning Hard Case
  **Metaphysics:** A zygote splits. Two individuals exist. Could I have been the other twin? If the split hadn't occurred, who would I be?
  **Legal Translation:** A gift to "my grandchildren, per stirpes." One twin predeceases the testator; the other survives. Or, a scenario where the zygote splits, but one embryo is discarded.
  *   **Without Strain:** Distinct legal personality. Upon live birth (or sometimes conception), the law assigns distinct legal identities to each twin. They are separate beneficiaries.
  *   **With Quiet Alteration:** The relation-back doctrine. If we treat the zygote as the "origin," the law struggles to assign the share if one twin dies *in utero*. We alter the claim by treating the "origin" as the moment of vesting, not fertilization.
  *   **Cannot Be Said:** The trans-world identity of the split. The law has no mechanism to ask, "If the zygote had not split, which twin's share would pass?" The law treats the split as the creation of two new legal persons, not the division of one. The metaphysical question of whether the original zygote was *one person* or *two potential persons* is legally irrelevant; the distribution scheme forces a binary choice that metaphysics denies.

  ### (d) Embryo Selection
  **Metaphysics:** Several viable embryos exist. One is chosen. I am the one chosen. I could not have been the discarded sibling.
  **Legal Translation:** Intentional parentage in gestational surrogacy. Multiple embryos are created; one is implanted; others remain cryopreserved or are destroyed.
  *   **Without Strain:** The enforcement of the gestational agreement. The intended parents are the legal parents of the born child, regardless of which specific embryo was selected.
  *   **With Quiet Alteration:** Property rights in gametes/embryos. Some jurisdictions treat discarded embryos as property subject to contract. This alters the metaphysical claim by treating the unselected embryo as a *res* rather than a *potential person*.
  *   **Cannot Be Said:** The necessity of the selection. The law cannot validate a claim by the "discarded" embryo that it was *wronged* by not being the one born. The law treats the selection as a medical decision, not an ontological verdict. The metaphysical claim that "I am essentially the selected one" translates to "I am the one the contract specified," which is contingent, not essential.

  ### (e) The Ordinary Chance Case
  **Metaphysics:** The winning sperm is arbitrary among millions. If another had won, I would not exist.
  **Legal Translation:** Equitable tracing through a mixed fund. Thousands of dollars are deposited; specific dollars are withdrawn.
  *   **Without Strain:** The lowest intermediate balance rule. We trace the value, not the specific particles (dollars/gametes). The law acknowledges the arbitrariness of the specific unit but preserves the claim to the *value*.
  *   **With Quiet Alteration:** The presumption of advancement. We assume the transfer was intended, ignoring the biological chance. This alters the claim by substituting *intent* for *causation*.
  *   **Cannot Be Said:** The essentiality of the chance event. In law, if the specific asset is gone, the claim fails (unless tracing applies). In metaphysics, if the specific gamete is gone, the *person* fails to exist. The law can compensate for the loss of the asset; it cannot compensate for the loss of the person via a different gamete. The law treats the "winning gamete" as a causal mechanism for vesting; metaphysics treats it as a constitutive condition of being.

  ***

  ### Residue Report

  You asked whether the failure of translation occurs because your vocabulary is instrumental or because the metaphysical thesis lacks granularity.

  **1. The Instrumentality of Law**
  The primary reason these claims fail to translate is that your vocabulary is designed to close files, not to map modal space.
  *   **Severing Origin:** The law severs origin by decree (adoption, relation-back, statutory parentage) because it requires *finality*. A will must be administered. A trust must be distributed. If the court had to inquire into whether the beneficiary was *essentially* the child of the testator, rather than *legally* the child, administration would halt. The law stipulates identity to ensure marketability of title and certainty of distribution.
  *   **Substitution:** Equitable tracing allows you to follow value through substitution precisely because the law cares about *entitlement*, not *constitution*. The metaphysician cares about the wood; the lawyer cares about the bequest.
  *   **Counterfactuals:** The law treats counterfactuals as evidential (e.g., "but-for" causation in a will contest). It asks, "Did this event cause this outcome?" It does not ask, "Could this outcome have existed without this event?" The latter question yields no distributive result.

  **2. The Granularity of Metaphysics**
  It is less likely that the metaphysical thesis lacks granularity. Origin essentialism is hyper-granular; it distinguishes between numerically distinct gametes that are qualitatively identical. The problem is not that the thesis is vague, but that it is *orthogonal* to legal purposes.
  *   **Decision Procedures:** You noted the thesis has never been tested by a decision procedure. This is correct. Metaphysics has no mechanism for *enforcement*. It can assert that the adopted child is not "essentially" the testator's issue, but it cannot issue a judgment. The law *must* issue a judgment. Therefore, the law adopts a coarser grain of identity that is actionable.

  **3. Testing Your Suspicion**
  Your suspicion is that origin essentialism is a stipulation about how to use the word *this*, not a discovery about objects. The legal translation supports this, but with a caveat.

  *   **Support:** The law demonstrates that "identity" is a functional slot. When the law says an adopted child *is* the child of the adopter, it is not making a biological error; it is defining the scope of the legal relation. It shows that "being the same" is often a normative status, not a brute fact. If the law can successfully administer estates by treating non-identical origins as identical for legal purposes, it suggests that for all *practical* human concerns (inheritance, kinship, obligation), origin is not essential.
  *   **The Caveat:** However, the law's success does not prove the metaphysician wrong about *objects*; it proves the metaphysician irrelevant to *institutions*. The metaphysician is making a claim about *de re* necessity across possible worlds. The lawyer is making a claim about *de dicto* classification within this world.
  *   **The Cost:** If you hold the essentialist thesis while conceding no institution can apply it, the cost is **isolation**. The thesis becomes ethically and politically inert. You cannot build a law of succession on origin essentialism because you cannot prove the origin in the counterfactual case. You cannot distinguish the "real" child from the "legal" child without undermining the stability of the family unit the law protects.
  *   **Misreading:** You may be misreading the essentialist argument as a claim about *knowledge* or *verification*. It is not. The essentialist admits we cannot know the origin in every case. The claim is that *given* the origin, the identity is fixed. The law ignores this because the law operates on *presumptions*, not fixed metaphysical truths.

  **Conclusion:**
  The failure to translate is due to the instrumentality of your vocabulary. The law stipulates identity to achieve finality. This does not disprove origin essentialism as a description of reality, but it does demonstrate that origin essentialism is incompatible with the administration of human affairs. If the thesis is true, it is a truth that must be suppressed for the law to function. The law treats "this" as a placeholder for entitlement; the metaphysician treats "this" as a lock on existence. You cannot run a probate court on the latter.
