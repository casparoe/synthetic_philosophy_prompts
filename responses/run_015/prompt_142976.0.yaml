prompt: |-
  Bit of an odd ask, and it's come up because it just happened to me: me and my cofounder, in the same week, both went public in front of the team with incompatible deadlines we'd each quietly picked, and now we're locked in and we both know it was dumb. I've been asked to run a 75-minute session on it for about 18 founders in our accelerator next month and I really don't want to stand up and lecture about it.

  Design me a game that makes them feel a commitment race instead of hearing about one. Two parties, something worth dividing, a move that's costly to take back, whoever commits first gets the better split — so both want to move first and both end up worse than if neither had. Rules, materials, a payoff scheme in points or chips (no real money; one small prize at the end is fine), and a few rounds. I don't want the phrase "commitment race" said out loud until the debrief.

  Two things I'd like built in if you can. First, make observability imperfect: sometimes the other side can't tell whether you actually committed or just said you did, so the race is partly a race to be *seen* committing. Second, a seperate late round where they're allowed to pay each other to un-commit — that's the move I keep thinking should rescue my situation and doesn't, and I want to see whether the game shows why.

  Give me a debrief that maps specific moments onto the mechanism, what will predictably go wrong the first time I run it (pairs finishing at wildly different speeds, someone colluding, someone who just refuses to move), and be honest about which feature of the real thing the game can't reproduce and I'll have to say in words. Also: how confident are you that your payoff numbers will actually generate the race rather than a shrug, and which single parameter are you least sure about — I can re-tune it after a test run.
reasoning: |-
  Here's a thinking process that leads to the suggested game design:

  1.  **Analyze the Request:**
      *   **Goal:** Design a 75-minute experiential game for 18 founders (9 pairs) to simulate a "commitment race" without naming it until the debrief.
      *   **Core Mechanic:** Two parties, divisible resource, costly-to-reverse move, first mover advantage (better split), mutual loss if both race.
      *   **Specific Constraints:**
          *   No lecturing.
          *   Imperfect observability (can't always tell if the other actually committed).
          *   Late round allowing payment to un-commit (to test if this solves the problem).
          *   Rules, materials, payoff scheme (points/chips, one small prize).
          *   Debrief plan (mapping moments to mechanisms, predicting failure modes, admitting limitations).
          *   Confidence assessment on payoff numbers and parameter tuning.
      *   **Tone:** Practical, empathetic (acknowledging the user's situation), honest about limitations.

  2.  **Deconstruct the "Commitment Race" (Game Theory Context):**
      *   This is essentially a *War of Attrition* mixed with a *Pre-emption Game* or a *Chicken Game* variant where the "swerve" is costly or impossible once initiated.
      *   Key dynamic: $V_1$ (Value if I commit first) > $V_2$ (Value if we coordinate) > $V_3$ (Value if we both commit/crash).
      *   The "Imperfect Observability" adds noise/signaling risk (Bluffing).
      *   The "Buyout" round tests the Coase Theorem in a high-pressure context (transaction costs + trust issues).

  3.  **Game Design - "The Launch Window":**
      *   *Theme:* Product Launch Dates. Fits the audience (founders).
      *   *Structure:* 3 Rounds.
      *   *Round 1 (The Setup):* Standard coordination.
      *   *Round 2 (The Race):* Imperfect observability + First Mover Advantage.
      *   *Round 3 (The Buyout):* Ability to pay to delay.
      *   *Materials:* Envelopes, chips/tokens, timer, signal cards.

  4.  **Developing the Payoff Matrix (Crucial Step):**
      *   Need to ensure the race is incentivized but the crash is painful.
      *   Let $T$ = Total Pot (e.g., 100 chips).
      *   *Cooperate (Wait):* Both get 40 (Total 80, efficiency loss but safe).
      *   *Defect (Commit Early):*
          *   I Commit, You Wait: I get 70, You get 10. (Strong incentive to race).
          *   I Commit, You Commit: Both get 5. (Crash).
      *   *Wait, Wait:* Both get 40.
      *   *Incentive Check:* If I think you will Wait, I should Commit (70 > 40). If I think you will Commit, I should Commit (5 > 10). *Wait, that's a Prisoner's Dilemma.*
      *   *Correction:* A commitment race is usually about *timing*. If we both wait, we get the optimal outcome. If one moves early, they grab value. If both move early, value is destroyed.
      *   *Revised Payoffs:*
          *   Both Wait (Coordinate): 50 each.
          *   One Commits (Early), One Waits (Late): Committer 80, Waiter 20.
          *   Both Commit (Crash): 10 each.
      *   *Logic:* 80 > 50 (Incentive to race). 10 < 20 (Fear of crash). But 10 < 50 (Crash is bad).
      *   *Dominant Strategy?* If I'm sure you wait, I race. If I'm sure you race, I race (to get 10 rather than 20). This creates the race.

  5.  **Addressing "Imperfect Observability":**
      *   How to implement? Sealed bids? Hidden actions?
      *   *Mechanism:* "Commitment Tokens." Players hold a red token (Commit) and a blue token (Wait). They place it in an envelope. But there's a "Signal Phase."
      *   *Better:* A physical action. Standing up? Placing a flag?
      *   *Best for noise:* The "Signal Card." Each player gets a hand of cards. Some say "I am Committing," some are blank. They can show a card. But showing a card isn't binding. The *binding* move is dropping a chip in the "Launch Box."
      *   *Refinement:* Let's make it time-based. A 5-minute negotiation window. You can walk to the "Launch Box" at any time. But the lights flicker? No, too complex.
      *   *Simplest:* The "Bluff Card." Each player gets 1 "Bluff Card" and 1 "Real Commit Chip." To commit, you must deposit the Chip. But you can show the Bluff Card to signal intent. The opponent sees the Card, not the Chip deposit immediately.
      *   *Actually, let's go with "Fog of War":* Players sit back-to-back or behind screens. They send messengers? No, too slow.
      *   *Decision:* **The Signal Phase.** Before the final lock-in, players can send a "Press Release" (a note). It can be True or False. The actual commitment is dropping a token in a box. The opponent only sees the token drop *after* the round ends, unless they rush to check the box (which costs time/action).
      *   *Simpler for 75 mins:* **The "Soft Commit" vs. "Hard Commit".**
          *   Soft Commit: Write name on whiteboard. Visible but reversible (penalty).
          *   Hard Commit: Drop chip in box. Irreversible.
          *   *Imperfect Observability:* You can see if they *approach* the box, but not if they dropped the chip. Or, you can announce "I am committing" but you might be lying.
          *   *Selected Mechanic:* **The Envelope & The Shout.** You write your move. You can *shout* your move. But shouting isn't binding. Only the envelope counts. *Wait, the prompt asks for "race to be seen committing".*
          *   *Revised Mechanic:* **The Flag Pole.** Each pair has a small box with a slot. To commit, you must walk to the box and drop a heavy poker chip (makes noise). But the room is noisy? No.
          *   *Let's try this:* **The "Press Release" Mechanic.**
              *   Phase 1 (Negotiation): 3 mins.
              *   Phase 2 (Signaling): You can hold up a "COMMIT" sign. It costs nothing.
              *   Phase 3 (Action): You walk to the facilitator to hand in your decision card.
              *   *Imperfect Observability:* You don't know if they actually handed it in until time expires. *But the prompt wants a race to be SEEN.*
              *   *Okay, final decision on Observability:* **The "Glass Box".** There is a transparent box between them. To commit, you must place a colored block in it. *However*, there are opaque sleeves. You can put a block in a sleeve and place *that* in the box. Opponent sees a block in the box, but doesn't know if it's a "Real Commit" (Red) or a "Bluff" (Blue) until revealed.
              *   *Wait, simpler:* **The "Announcement" Rule.** You can announce "I am locking in." If you do, you *must* lock in within 30 seconds or pay a penalty. But they can't verify the lock-in until the end.
              *   *Let's go with the "Signal Card" idea.* Each player has 3 cards: [COMMIT], [WAIT], [BLUFF]. They can play a card face up. [COMMIT] means they intend to commit. [BLUFF] looks like [COMMIT] but is actually a [WAIT] move submitted secretly.
              *   *Actually, the prompt says:* "sometimes the other side can't tell whether you actually committed or just said you did."
              *   *Game Mechanic:* **The Two-Step Lock.**
                  1.  **Signal:** Place a marker on the table. (Visible).
                  2.  **Verify:** The marker is covered by a cup. Only the facilitator knows if the marker matches the submitted decision.
                  3.  **Race:** If you place the marker, you get priority *if* it's real. If it's fake, you get penalized.
                  4.  *Too complex.*
                  5.  *Simplest interpretation:* **The "Press Release".** You can send a message "I am launching Date A." It is cheap talk. The actual move is submitting a form. The race is to send the Press Release first to force the other hand, but they don't know if you actually submitted the form.
                  6.  *Let's refine for the "Race to be Seen":* **The "Flag" Mechanism.** To commit, you must stand up and place a flag on your table. *However*, you can place a flag without having submitted the "Commit Form" to the judge. If you place a flag but didn't submit the form, you are "Bluffing." If you get caught Bluffing (Form says Wait, Flag is Up), you lose big. If you Commit (Form says Commit, Flag is Up), you win big (if other waits).
                  7.  *This works.* It creates the incentive to *look* committed first, but the risk of being a liar.

  6.  **Addressing the "Buyout" Round:**
      *   Round 3. Same setup.
      *   New Rule: After both commit (or one commits), there is a 2-minute "Secondary Market."
      *   Players can offer chips to the other to switch their move.
      *   *Hypothesis:* It won't work because trust is broken or transaction costs (time limit) are too high.

  7.  **Drafting the Plan:**
      *   **Title:** "Launch Window."
      *   **Time:** 75 mins total (15 intro, 45 game, 15 debrief).
      *   **Players:** 18 founders = 9 pairs.
      *   **Materials:** Envelopes, Decision Cards, Flags, Poker Chips, Timer.
      *   **Payoffs:** Needs to be calibrated.
      *   **Debrief:** Connect game feelings to their real-life deadline story.

  8.  **Refining Payoffs (The Math Check):**
      *   Pot = 100 Points.
      *   **Scenario A (Both Wait/Coordinate):** 45 pts each. (Total 90, 10 lost to delay).
      *   **Scenario B (I Commit, You Wait):** I get 80, You get 20. (I steal your share).
      *   **Scenario C (Both Commit):** 10 pts each. (Market crash).
      *   **Bluff Penalty:** If Flag Up + Form Wait = 0 pts.
      *   *Incentive:* 80 > 45 (Greed). 10 < 20 (Fear). But 10 < 45 (Crash is worst).
      *   *Race Logic:* If I think you will Wait, I Commit (80). If I think you will Commit, I Commit (10 vs 20? No, if you commit and I wait, I get 20. If we both commit, I get 10. So if I know you commit, I should Wait? No, that makes it Chicken.)
      *   *Correction:* In a commitment race, once the other person *has* committed, you are forced to accept the scraps or crash.
      *   *Let's adjust:* If You Commit and I Wait: You 80, Me 10. (Scraps). If Both Commit: 5 each.
      *   *Now:* If I know you Commit: I get 10 (Wait) vs 5 (Commit). I should Wait.
      *   *Problem:* This stops the race if someone is known to have committed.
      *   *Fix:* The "Sunk Cost" of commitment. Once I commit, I can't wait.
      *   *Game Flow:* Simultaneous reveal? No, that's Prisoner's Dilemma.
      *   *Race Flow:* Continuous time. First to drop chip wins.
      *   *Okay, Continuous Time is key.*
      *   *Mechanic:* A 5-minute window. You can walk to the "Deposit Box" anytime.
      *   *Payoff:*
          *   First to Deposit (Commit): 80 pts. (Other gets 20).
          *   Second to Deposit (Commit): 20 pts. (First gets 80).
          *   Both Deposit within 10 seconds of each other (Crash): 10 pts each.
          *   Neither Deposits (Wait): 45 pts each.
      *   *This creates the race.* I want to be First. If I wait too long, you might be First. If we both go at once, we crash.
      *   *Imperfect Observability:* The Deposit Box is opaque. You hear a "clink" but don't know if it's a Commit Chip or a Wait Chip (both make noise). Or, you see me walk to the box, but don't know what I dropped.
      *   *Let's use the "Walk to the Box" signal.* Walking to the box signals intent. But you can walk, fake a drop, and walk back (Bluff). If caught (random audit), penalty.
      *   *Actually, keep it simple:* **The Envelope Drop.** You write the time you intend to submit. Facilitator collects.
      *   *No, needs to feel like a race.*
      *   *Okay, Final Mechanic:* **The "Hand Raise" Commitment.**
          *   Room is quiet.
          *   To Commit, you must stand and say "I Commit."
          *   Once said, you must hand in a "Commit Card."
          *   *Imperfect Observability:* You can stand and say it, but hand in a "Wait Card" (Bluff).
          *   *Audit:* 50% chance the Facilitator checks your card immediately. If Bluff, you are out (0 pts).
          *   *Payoff:*
              *   First True Commit: 80.
              *   Second True Commit (after first): 20.
              *   Simultaneous (within 5 secs): 10 each.
              *   Both Wait: 45 each.
              *   Bluff Caught: 0.
      *   *This works.* It creates the race to speak first, the risk of bluffing to scare the other, and the crash if simultaneous.

      *   *Wait, the Buyout Round:*
          *   If both Commit (Crash state), they enter "Negotiation."
          *   They can transfer points to make one "Wait."
          *   *Constraint:* They have 2 minutes. Trust is low.

  9.  **Confidence & Tuning:**
      *   Confidence: High on the race dynamic, Medium on the Buyout failure (depends on social norms).
      *   Least Sure Parameter: The "Crash" penalty vs. "Wait" reward. If Crash (10) is too close to Wait (45), they won't fear the race. If Crash is 0, they might be too scared to move. 10 vs 45 is a big gap.
      *   Also the "Bluff Audit" probability. If too low, everyone bluffs. If too high, no one signals. 50% is high. Maybe 30%.

  10. **Debrief Strategy:**
      *   Don't lecture. Ask "How did that feel?"
      *   Map: The Stand = The Public Deadline. The Bluff = The "Soft" Commit. The Crash = The Burnout/Quality Drop. The Buyout = The "Let's pay to fix this" conversation.
      *   Honesty: Game can't reproduce *emotional* sunk cost or *reputational* damage outside the room.

  11. **Review against Constraints:**
      *   75 mins? Yes.
      *   18 founders? Yes (9 pairs).
      *   No "commitment race" phrase until end? Yes.
      *   Imperfect observability? Yes (The Bluff/Audit mechanic).
      *   Buyout round? Yes.
      *   Payoff scheme? Points/Chips.
      *   Confidence/Tuning? Included.

  12. **Final Polish:** Ensure the tone is supportive. The user is in a tough spot; this session is their way of processing it while helping others. Acknowledge that bravery.

  *(Self-Correction during drafting)*: The "Stand and Say" mechanic might be too intimidating for a workshop. Let's make it a physical token drop into a central box. It's quieter but still a race.
  *Revised Mechanic:* Each pair has one "Launch Box" between them. Each player has 3 tokens: 2 Blue (Wait), 1 Red (Commit).
  *   To Commit: Walk to box, drop Red.
  *   To Wait: Drop Blue.
  *   *Observability:* The box has a slot. You see them walk to the box. You hear the drop. You *don't* see the color.
  *   *Signal:* You can *say* "I'm dropping Red."
  *   *Bluff:* You say "I'm dropping Red" but drop Blue.
  *   *Audit:* Facilitator rolls a die. If 1-2, contents revealed immediately. If Bluff revealed, penalty.
  *   *This is better.* It separates the *action* (walking to box) from the *intent* (color of chip).

  *Wait, one more check on Payoffs for the Race:*
  If I drop Red first: I get 80.
  If you drop Red second: You get 20.
  If we drop Red same time: 10 each.
  If both drop Blue: 45 each.
  *Incentive:* I want to be first Red. If I think you are going Red, I want to be before you. If I think you are Blue, I want to be Red (80 > 45).
  *This guarantees a race.* Everyone wants to be First Red.

  *Buyout Round:*
  If outcome is 10/10 (Crash).
  They get 2 mins to trade chips.
  Player A can give Player B 30 chips to switch to Blue?
  But they already dropped the chip.
  *Correction:* In Round 3, the rule changes. "You may retract your Red chip by paying 40 points to the other player."
  *This tests the Coase theorem.* Can they bribe their way out?
  *Why it fails:* Trust (will they actually switch?), Pride, Sunk Cost.

  *Okay, ready to write.*
answer: |-
  This is a brave way to handle a tough situation. Turning your own stumble into a learning lab for your peers is high-status leadership, even if it feels messy right now.

  Here is a complete design for a 75-minute session called **"The Launch Window."** It is engineered to induce the exact anxiety you felt, without you having to explain it until the end.

  ### Game Overview
  *   **Title:** The Launch Window
  *   **Players:** 18 Founders (9 Pairs)
  *   **Time:** 75 Minutes (15 min Setup, 45 min Gameplay, 15 min Debrief)
  *   **Goal:** Accumulate the most "Market Share" (points).
  *   **Core Tension:** A resource is available, but it degrades if both parties grab it simultaneously. One party grabbing it first captures most of the value.

  ### Materials Needed
  *   **9 "Launch Boxes":** Opaque containers (coffee mugs work) with a slit in the lid, placed between each pair.
  *   **Tokens:** 54 Blue chips (Wait), 27 Red chips (Commit). (3 Blue, 1.5 Red per person on average).
  *   **Decision Cards:** Small cards labeled "AUDIT."
  *   **Score Sheets:** To track points.
  *   **Timer:** Visible countdown clock.
  *   **Prize:** One bottle of decent whiskey or a generic "Golden Ticket" voucher for the winner.

  ---

  ### The Payoff Structure (The Engine)
  You need these numbers on a slide or whiteboard, visible to everyone. Do not explain *why*, just *what*.

  | Outcome | Your Points | Partner's Points |
  | :--- | :--- | :--- |
  | **Both Wait** (Both drop Blue) | **45** | **45** |
  | **You Commit First** (You Red, Partner Blue) | **80** | **20** |
  | **You Commit Second** (You Blue, Partner Red) | **20** | **80** |
  | **Crash** (Both Red, within 10 secs) | **10** | **10** |
  | **Bluff Caught** (See Rules) | **0** | **45** |

  *Note: The "Crash" penalty is severe. The "First Mover" reward is massive.*

  ---

  ### Round 1: The Fog (15 Minutes)
  **Objective:** Introduce the mechanic and the imperfect observability.

  **Rules:**
  1.  You have 5 minutes to negotiate with your partner.
  2.  At any point, you may walk to the **Launch Box** and drop a chip.
  3.  **Blue Chip** = "Wait" (Coordinate). **Red Chip** = "Commit" (Launch).
  4.  **Imperfect Observability:** The box is opaque. Your partner sees you *walk* to the box and hears the *clink*, but they do not see the color.
  5.  **The Bluff Rule:** You may say "I am dropping Red" to scare your partner, but drop Blue.
      *   *Risk:* At the end of the round, I (Facilitator) will roll a die for each pair. On a 1 or 2 (33% chance), I open the box.
      *   *Penalty:* If I find you said "Red" but dropped "Blue," you get **0 points** (Bluff Caught). Your partner gets 45.
  6.  **Timing:** If both drop Red within 10 seconds of each other, it is a **Crash** (10 pts each). If there is a clear gap (>10 secs), the first gets 80, second gets 20.

  **Run the Round:**
  *   Start the 5-minute timer.
  *   Let the tension build. The room will get quiet, then people will start walking to boxes.
  *   Collect chips, audit the rolled pairs, distribute points.

  ---

  ### Round 2: The Escalation (15 Minutes)
  **Objective:** Remove the safety net.

  **Rules:**
  *   Same as Round 1, **EXCEPT:**
  *   **Audit Probability Increased:** I now roll for an audit on a 1, 2, or 3 (50% chance).
  *   **No Negotiation:** You cannot speak to your partner for the first 2 minutes. You must signal intent only through movement.

  **Why:** This forces them to rely on the "race to be seen" rather than verbal agreements. They will likely race harder because they can't talk each other down initially.

  ---

  ### Round 3: The Buyout (15 Minutes)
  **Objective:** Test the "pay to un-commit" solution.

  **Rules:**
  *   Play Round 1 rules (33% Audit).
  *   **New Rule:** If a **Crash** occurs (Both Red), a "Secondary Market" opens for 2 minutes.
  *   Players can offer points from their *current* score to the other player to switch their chip to Blue.
  *   *Example:* "I will give you 30 of my points if you admit you dropped Red and switch to Blue."
  *   If an agreement is reached and verified by the Facilitator, the payoffs are recalculated as "One Commit, One Wait."
  *   If no agreement is reached, the Crash stands (10 pts each).

  **Run the Round:**
  *   Let them play.
  *   If a Crash happens, start the 2-minute Buyout timer immediately.
  *   Watch the friction. Most will fail to close the deal.

  ---

  ### The Debrief (15 Minutes)
  *Do not lecture. Ask questions. Write their answers on the whiteboard.*

  **1. The Physical Sensation (5 mins)**
  *   "In Round 1, when you saw your partner stand up and walk toward the box, what happened to your heart rate?"
  *   "Who here dropped a Red chip even though you agreed to Wait?"
  *   "Who here *said* they were dropping Red, but actually dropped Blue?"

  **2. Mapping the Mechanism (5 mins)**
  *   *Now* you reveal the term: **"This is a Commitment Race."**
  *   Map their experience to the game:
      *   **The Box:** The public deadline (Slack channel, all-hands meeting).
      *   **The Walk:** The signal that you are locking in.
      *   **The Chip Color:** The actual reality of your capacity.
      *   **The Bluff:** Saying "I can make this date" when you know you can't, hoping the other person blinks.
      *   **The Crash:** Both launching half-baked products, burning out the team, or missing market fit because you rushed.

  **3. The Buyout Failure (5 mins)**
  *   Ask the pairs who Crashed in Round 3: "Why didn't the deal get done?"
  *   Likely answers: "I didn't trust them to actually switch," "It felt like a ransom," "I was too angry," "We ran out of time."
  *   **The Lesson:** "In theory, you can pay to fix a commitment race (Coase Theorem). In practice, trust is already broken by the race, transaction costs are too high, and ego prevents the deal. You cannot buy your way out of a public commitment race easily."

  ---

  ### Facilitator's Cheat Sheet: What Will Go Wrong
  Be ready for these specific failure modes. They are features, not bugs.

  1.  **The Speedrunners:** One pair will finish in 30 seconds. One pair will wait until the last second.
      *   *Handle it:* Don't stop the fast pair. In the debrief, ask the slow pair: "How did it feel watching them move that fast?" (Answer: Panic). Ask the fast pair: "Did you feel safe?" (Answer: No, because they feared the other would move faster).
  2.  **The Colluders:** One pair will agree to split the points (45/45) and both drop Blue.
      *   *Handle it:* Let them have their 45 points. In the debrief, highlight them. "They escaped the race. How? Private trust. But notice: they couldn't signal that trust to the rest of the room, so the room stayed chaotic."
  3.  **The Refuser:** One founder refuses to play or drops a chip out of spite.
      *   *Handle it:* Give them 0 points. In debrief: "This is the 'Nuke' option. In real life, this is the founder who quits or blocks the launch. It hurts everyone."
  4.  **The Buyout Success:** If a pair *does* successfully trade points to fix a Crash.
      *   *Handle it:* Celebrate them, but ask: "How much energy did that take compared to just waiting in Round 1?" (Answer: Much more).

  ### Limitations: What The Game Can't Reproduce
  Be honest about this in the closing. The game is a simulation; reality is heavier.

  1.  **Reputation Outside the Room:** In the game, if you bluff and get caught, you lose points. In reality, if you commit publicly and fail, you lose *credibility* with investors, hires, and customers. That cost is infinite, not 0 points.
  2.  **Emotional Sunk Cost:** In the game, you drop a chip. In reality, you've hired three engineers to hit that date. You can't just "switch to Blue" easily. The code is written. The pressure is real.
  3.  **The "Team" Variable:** This game is 1v1. In your company, the race was between two founders, but the *team* paid the price of the Crash. The game isolates the founders, but the pain is distributed.

  ---

  ### Confidence & Tuning
  **Confidence Level:** **85%** that this will generate the race.
  The payoff matrix (80/20 vs 45/45 vs 10/10) is mathematically rigged to make "Waiting" feel like losing. As long as the founders are competitive (which they are), the 80-point prize is too shiny to ignore.

  **The Parameter I'm Least Sure About:** **The Crash Penalty (10 points).**
  *   *Risk:* If 10 points feels like "better than nothing," they will crash intentionally.
  *   *Risk:* If 10 points feels like "death," they might be too scared to move, and the game stalls.
  *   **Tuning Knob:** If you run a test and they are too scared to move, lower the Crash penalty to **20**. If they are crashing too often, lower it to **0**.
  *   *My recommendation:* Stick to **10**. The fear of the crash is what makes the *bluffing* interesting. If the crash isn't painful, the bluff doesn't matter.

  ### Final Advice for You
  You mentioned you don't want to lecture. Don't. When you debrief, tell your story *once*, briefly.
  *"I ran this game because last month, my cofounder and I walked to the box at the same time. We both dropped Red. We got 10 points. I want you to feel what that 10 points feels like so you don't have to earn it."*

  That's all you need to say. The game does the rest.
