answer: |-
  This is an excellent set of questions. You are right to feel that textbook summaries often gloss over the specific logical mechanism that makes the Frege–Geach problem (FGP) so resilient. The "higher-order attitude" move you describe is essentially the starting point for quasi-realism, but as you suspect, it faces a formidable challenge regarding **logical validity** and **inconsistency**.

  Since you are at the PhD level, I will skip the introductory metaethical scaffolding and dive straight into the logical semantics, the distinction between embedding and FGP, and the specific failure points of the Blackburnian project (particularly vis-à-vis the Schroeder objection).

  ### 1. Terminology: Embedding vs. Frege–Geach

  First, let's disentangle the terminology, as confusion here often muddies the water.

  *   **The Embedding Problem:** This is the broader category. It asks: How can moral sentences function syntactically and semantically in non-assertoric contexts (negations, questions, conditionals, modal operators) if their primary semantic function is to express a non-cognitive attitude?
      *   *Example:* "Is stealing wrong?" does not express an attitude; it asks a question. "It is not the case that stealing is wrong" does not express disapproval of stealing.
      *   *Challenge:* Explain the compositional semantics. How does the meaning of "wrong" contribute to the meaning of the complex sentence if "wrong" just means *Boo!*?

  *   **The Frege–Geach Problem:** This is a specific, lethal subset of the embedding problem. It focuses on **logical validity** and **inference**.
      *   *Challenge:* Explain how moral arguments can be *valid* (truth-preserving) if moral sentences lack truth conditions.
      *   *The Crux:* It is not enough to say what the conditional *means* (the embedding problem); you must explain why accepting the premises and rejecting the conclusion constitutes a **logical contradiction** rather than merely a psychological quirk or a clash of attitudes.

  **Verdict:** All Frege–Geach problems are embedding problems, but not all embedding problems are Frege–Geach problems. The FGP is the claim that expressivism cannot recover the *logic* of moral discourse, not just its grammar.

  ### 2. Why the "Higher-Order Attitude" Response Fails

  You asked why the expressivist cannot simply say: *The conditional "If stealing is wrong, then getting your brother to steal is wrong" expresses a higher-order attitude of disapproving of the combination of (stealing being wrong) and (getting your brother to steal being permitted).*

  This is essentially Simon Blackburn's proposal in *Spreading the Word*. He suggests we can map logical operators onto attitudes.
  *   $P$: "Boo stealing!"
  *   $Q$: "Boo getting brother to steal!"
  *   $P \to Q$: "Boo (stealing & not-Boo getting brother to steal)!" (i.e., I disapprove of the mix of attitudes).

  **The Problem:** This solves the *semantic* composition (we know what the sentence means), but it fails to solve the *logical* validity problem. Here is the "in the weeds" explanation of why.

  #### A. The Equivocation Objection
  For an argument to be valid, the terms must remain univocal across premises.
  1.  Stealing is wrong.
  2.  If stealing is wrong, then getting your brother to steal is wrong.
  3.  Therefore, getting your brother to steal is wrong.

  In premise (1), "wrong" expresses a first-order attitude (Boo stealing).
  In premise (2), "wrong" appears in the antecedent. According to the higher-order view, the antecedent is part of a complex higher-order attitude.
  *   **Objection:** If the semantic content of "wrong" in (1) is *Attitude A*, and in (2) it is a constituent of *Attitude B*, have we not committed the fallacy of equivocation?
  *   **Expressivist Reply:** No, the attitude type is the same (disapproval), it is just embedded differently.
  *   **Counter:** This pushes the problem back. What is the *logic* of these attitudes?

  #### B. The Consistency/Inconsistency Problem (The Real Killer)
  This is the most technical and damaging version of the FGP.

  In cognitivism, logical validity is defined by **truth preservation**. Logical inconsistency is defined by **contradictory truth conditions**.
  *   If I believe $P$ and believe $\neg P$, I have contradictory beliefs. It is logically impossible for both to be true.

  In expressivism, logical validity must be defined by **attitude preservation** (or consistency of attitudes).
  *   If I have Attitude $A$ (Boo stealing) and Attitude $B$ (Boo [stealing & not-Boo brother]), does it follow that I *must* have Attitude $C$ (Boo brother)?

  **The Failure:**
  Blackburn can explain what it is to *hold* the attitudes corresponding to the premises. But he struggles to explain what it is for those attitudes to be **inconsistent** in the *logical* sense.
  *   I can psychologically hold conflicting attitudes (akrasia, ambivalence) without being *logically* irrational.
  *   If I say "Stealing is wrong" and "Stealing is not wrong," the cognitivist says I violate the law of non-contradiction.
  *   The expressivist says I have conflicting attitudes. But why is having conflicting attitudes a *logical error*? It seems to be merely a psychological conflict.

  **Mark Schroeder's Formulation (*Being For*, 2008):**
  Schroeder formalized this as the problem of **negation**.
  *   Let $A$ be the attitude expressed by "Stealing is wrong."
  *   Let $\neg A$ be the attitude expressed by "Stealing is not wrong."
  *   For expressivism to work, $A$ and $\neg A$ must be **inconsistent**.
  *   But what makes two *attitudes* inconsistent? Beliefs are inconsistent because they aim at truth and cannot both be true. Attitudes (like desire or disapproval) do not aim at truth. I can desire $X$ and desire $\neg X$ (e.g., eat the cake and not eat the cake). It's a conflict, but is it a *logical* contradiction?
  *   If expressivists cannot define a relation of inconsistency between attitudes that mirrors logical contradiction, they cannot define validity. If they cannot define validity, the Frege–Geach problem stands.

  The "higher-order attitude" move tells us what the conditional *is*, but it doesn't tell us why denying the conclusion while accepting the premises is a violation of *logic* rather than just a violation of *coherence*. Expressivists need to show that the norms governing these attitudes are **logical norms**, not just pragmatic or psychological ones.

  ### 3. Blackburn's Quasi-Realism: The Attempt and The Gap

  Blackburn's quasi-realism is the project of "earning the right" to realist-sounding talk (truth, facts, validity) within an expressivist framework.

  #### The Strategy: Expressive-Expressive Semantics
  Blackburn argues we don't need truth conditions to have logic. We need a logic of attitudes. He proposes that we can treat moral sentences *as if* they have truth conditions because the logical relations between the *attitudes* mirror the logical relations between *beliefs*.

  He introduces the notion of **"commitment."** To accept a moral sentence is to undertake a commitment.
  *   To accept $P$ is to have attitude $A$.
  *   To accept $P \to Q$ is to have a higher-order attitude that rules out having $A$ without having $B$.
  *   Therefore, if you have $A$ and the higher-order attitude, you are **committed** to $B$.
  *   If you deny $B$, you are in a state of "fractured sensibility."

  #### Where It Stalls (The Schroeder Objection)
  The problem is that Blackburn defines inconsistency as a **clash of commitments**. But critics (like Schroeder and Zangwill) argue this is circular or insufficient.
  *   To say "You are committed to $B$" just means "You ought to have attitude $B$."
  *   But why *ought* you? In cognitivism, the "ought" comes from the laws of logic applied to truth.
  *   In Blackburn's system, the "ought" comes from... the definition of the attitudes?
  *   **Schroeder's Point:** Blackburn explains what it is to be in a state of mind that *corresponds* to accepting the premises. But he hasn't shown that being in that state of mind while rejecting the conclusion is a **logical impossibility** (or a rational impossibility of the same kind). He has shown it is a psychological tension.
  *   Unless the expressivist can ground the inconsistency in something stronger than "I don't like having these two attitudes," they haven't recovered **logic**; they've recovered **psychology**.

  Blackburn's later work attempts to lean on a deflationary theory of truth to bypass this (if "true" is just a device for endorsement, then moral sentences can be "true"), but critics argue this is verbal sleight of hand. It allows you to *say* "That is true," but it doesn't give you the truth-conditions required to ground the validity of the inference in the standard model-theoretic sense.

  ### 4. Contemporary Developments: Gibbard and Plan-Expressivism

  Since you are working in metaethics, you should be aware that the debate has largely shifted from Blackburn's sentiment-based expressivism to **Allan Gibbard's Norm-Expressivism** (specifically in *Thinking How to Live* and *Meaning and Normativity*).

  Gibbard attempts to solve the FGP by changing the mental state from *attitudes/emotions* to **plans** (or norm-acceptance).
  *   **The Move:** Beliefs are governed by the norm of truth. Plans are governed by the norm of consistency.
  *   **The Logic of Plans:** Gibbard argues that planning states have a formal structure that mirrors logic. To plan to $A$ and plan to $\neg A$ is inconsistent in the same way believing $P$ and $\neg P$ is inconsistent.
  *   **Why it helps:** It grounds the inconsistency in the **nature of planning**. You cannot coherently plan to do $A$ and not do $A$. This is not just a psychological clash; it is a failure of the functional role of planning.
  *   **The Remaining Worry:** Even here, critics argue Gibbard is positing a "logic of planning" that is *analogous* to logic, not identical. Does the inconsistency of plans generate *logical* validity, or just *practical* rationality? The gap between "irrational to plan inconsistently" and "logically invalid to infer" remains a point of contention.

  ### Summary for Your Research

  1.  **Embedding vs. FGP:** Embedding is about syntax/semantics in non-assertoric contexts. FGP is specifically about **validity** and **truth-preservation**.
  2.  **Why Higher-Order Attitudes Fail:** They explain the *meaning* of the conditional but fail to explain the **necessity of the inference**. They reduce logical contradiction to psychological inconsistency (clash of attitudes), which is insufficient to ground formal validity.
  3.  **Blackburn's Quasi-Realism:** Attempts to map logical operators onto attitudes ("E-logic"). It succeeds in making moral discourse *look* realist but struggles to prove that the underlying structure supports *logical* validity rather than just pragmatic coherence.
  4.  **The State of Play:** The "Schroeder Objection" (the inconsistency problem) is the current hurdle. Expressivists now tend to move toward **hybrid theories** or **Gibbardian plan-expressivism** to try to ground the inconsistency in the functional role of the mental states, rather than just their phenomenological feel.

  **Recommendation for Deep Dive:**
  If you haven't already, Mark Schroeder's *Being For: Evaluating the Semantic Program of Expressivism* (2008) is the definitive technical takedown of the Blackburnian solution. For the expressivist defense, look at Blackburn's *Ruling Passions* (Chapter 6) and his later papers on "truth and success." Also, consider looking at **Michael Ridge's "Ecumenical Expressivism"**, which attempts to solve FGP by positing that moral judgments contain *both* a belief and a desire, allowing the belief component to handle the logic.

  The wall you are hitting is real: it is the difficulty of deriving **normative logical constraints** from **non-cognitive psychological states**. That is the hard core of the Frege–Geach problem.
