      *   **User:** PhD student in philosophy (metaethics). This means I need to avoid oversimplification, use technical terminology correctly, and engage with the nuances of the debate. They find textbook treatments "too glib."
      *   **Topic:** The Frege-Geach Problem (FGP) for Expressivism.
      *   **Specific Confusions:**
          1.  Why doesn't the "higher-order attitude" response work? (Why is the standard expressivist move insufficient?)
          2.  Are the "Embedding Problem" and "Frege-Geach Problem" the same thing?
          3.  How does Blackburn's Quasi-Realism actually attempt to solve this?
      *   **Goal:** A detailed, "in the weeds" explanation that clarifies the logical structure of the problem and the specific failures of early expressivist solutions.

  2.  **Deconstruct the Frege-Geach Problem (FGP):**
      *   *Core Issue:* The tension between the *semantic function* of moral sentences in asserted contexts (expressing attitudes) vs. unasserted contexts (premises in arguments).
      *   *The Logic:* Validity depends on form. Form depends on the meaning of constituent parts remaining constant across contexts.
      *   *The Expressivist Claim:* "Stealing is wrong" expresses disapproval of stealing.
      *   *The Problem:* In "If stealing is wrong, then...", the speaker isn't expressing disapproval of stealing. So what does "wrong" mean there? If the meaning changes, the argument is equivocal (fallacy of equivocation). If the meaning stays the same, how can it express an attitude when not asserted?

  3.  **Address Question 1: Why doesn't the "Higher-Order Attitude" response work?**
      *   *The User's Proposal:* "I disapprove of the situation where stealing is wrong and stealing that specific book is permitted." (This sounds like a Blackburnian or Gibbardian move, but let's analyze why it's tricky).
      *   *The "Negation/Consistency" Problem:* It's not just about conditionals. It's about logical consistency.
      *   *Example:*
          1.  Stealing is wrong.
          2.  If stealing is wrong, then getting your little brother to steal is wrong.
          3.  Therefore, getting your little brother to steal is wrong.
      *   *Expressivist Translation:*
          1.  Boo stealing!
          2.  Boo [stealing & not Boo (getting brother to steal)]? (This is the messy part).
          3.  Boo (getting brother to steal)!
      *   *The Clash:* How do we explain the *invalidity* of bad arguments? Or the *consistency* of holding (1) and (2) but denying (3)?
      *   *The "Clash of Attitudes" vs. "Logical Contradiction":* If I say "Stealing is wrong" and "Stealing is not wrong," cognitivism says I contradict myself (belief clash). Expressivism says I have conflicting attitudes. But conflicting attitudes aren't *logical* contradictions. I can logically hold conflicting attitudes (akrasia, ambivalence). Logic requires truth-preservation. If there are no truth conditions, what is preserved?
      *   *The Specific Failure of the Higher-Order Move:* It often leads to an explosion of distinct attitudes. "Boo stealing" is attitude A. "If stealing is wrong..." involves attitude B. Are A and B the same type of mental state? If not, equivocation. If so, how does B relate to A logically? The "higher-order" explanation often just restates the problem: *What is the logic of these higher-order attitudes?*

  4.  **Address Question 2: Embedding vs. Frege-Geach:**
      *   *Distinction:* They are closely related but distinct.
      *   *Embedding Problem:* Broader. How do moral sentences function in non-assertoric contexts (questions, commands, conditionals, negations)?
      *   *Frege-Geach Problem:* Specific subset of embedding. Focuses on *logical validity* and *inference*. It's the problem of explaining how moral arguments can be valid if moral sentences lack truth conditions.
      *   *Analogy:* All FGP are embedding problems, but not all embedding problems are FGP (e.g., "Is stealing wrong?" doesn't necessarily threaten validity, but it threatens the expression theory).

  5.  **Address Question 3: Blackburn's Quasi-Realism:**
      *   *Goal:* Earn the right to talk *as if* moral sentences are truth-apt without actually being realists.
      *   *Strategy:* Expressive-Expressive semantics (or projectivism).
      *   *The "Tree" Structure:* Blackburn tries to map logical operators onto attitudes.
      *   *Negation:* "It is not the case that stealing is wrong" = Tolerance of stealing? No, that's weak. It's the absence of the "Boo" attitude.
      *   *Conditionals:* "If P then Q" = Disapproval of (P & not-Q).
      *   *The "Schroeder Objection" (Inconsistency Problem):* This is crucial for a PhD student. Mark Schroeder's *Being For* is the modern benchmark.
      *   *The Issue:* Blackburn explains what it is to *accept* a conditional. But he struggles to explain what it is for two attitudes to be *inconsistent* in the right way to mirror logical inconsistency.
      *   *Example:* "Stealing is wrong" vs. "Stealing is not wrong." Cognitivism: Contradictory beliefs. Expressivism: Conflicting attitudes. But I can have conflicting attitudes without being irrational in a *logical* sense. Blackburn needs to show that the conflict is a *rational* requirement akin to logic.
      *   *Gibbard's Norm-Expressivism:* A better attempt? Planning states. Inconsistency in plans mirrors logical inconsistency. (Worth mentioning as a contrast/development).

