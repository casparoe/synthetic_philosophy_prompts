prompt: |-
  write me the desiderata for any theory of moral responsability that claims Frankfurt cases don't kill the principle of alternative possibilities. I want the actual spec: the cases it must cover (classic Frankfurt, nested ones where the intervener is also monitored, and ones where the agent falsely believes they have live options), the distinctions it can't collapse (sourcehood vs leeway, blame vs punishment), and any empirical constraints from neuroscience on unconscious action initiation it has to respect. Flag hard constraints vs camp preferences. Then briefly score sourcehood theories, hierarchical compatibilism, and this injected hybrid I'm calling 'epistemic leeway' -- responsibility only requires alternatives you could access with reasonable epistemic effort -- against your list. No citations or reading lists, just the criteria and the quick scorecard. Keep it focused and don't wander into libertarian metaphysics unless it's actually required by one of the desiderata.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Desiderata for a theory of moral responsibility that *defends* the Principle of Alternative Possibilities (PAP) against Frankfurt-style cases (FSCs).
      *   **Goal:** Provide a specification ("the actual spec") of what such a theory must achieve.
      *   **Key Components:**
          *   Cases to cover (Classic FSC, Nested FSC, Epistemic FSC).
          *   Distinctions to maintain (Sourcehood vs. Leeway, Blame vs. Punishment).
          *   Empirical constraints (Neuroscience/unconscious initiation).
          *   Constraint Types: Hard constraints vs. Camp preferences.
          *   Scorecard: Evaluate Sourcehood Theories, Hierarchical Compatibilism, and "Epistemic Leeway" (the user's hybrid) against these desiderata.
      *   **Constraints:** No citations/reading lists. Keep focused. Avoid wandering into libertarian metaphysics unless required.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Core Conflict:* Frankfurt cases aim to show an agent can be responsible even if they couldn't have done otherwise (killing PAP). A theory defending PAP against FSCs must show that either (a) FSCs fail to eliminate *all* alternatives, or (b) the intuition that the agent is responsible in FSCs is mistaken, or (c) responsibility *does* require alternatives, but FSCs hide them.
      *   *The User's Stance:* The user wants desiderata for a theory that claims FSCs *don't* kill PAP. This means the theory must preserve PAP while accounting for the intuitions FSCs generate, or explain why FSCs don't actually remove alternatives in the relevant sense.
      *   *The "Epistemic Leeway" Hybrid:* The user proposes a specific hybrid view: Responsibility requires alternatives accessible with reasonable epistemic effort. This needs to be scored.

  3.  **Drafting the Desiderata (The Spec):**

      *   *Case Coverage:*
          *   Classic Frankfurt (Jones/Black): Needs to explain where the alternative went or why responsibility fails/succeeds.
          *   Nested Frankfurt (Flicker of Freedom): If Black monitors the monitor, does the alternative vanish completely? The theory must handle infinite regress of controllers.
          *   Epistemic Frankfurt (Ignorance of Constraints): Agent thinks they have options but doesn't. Theory must distinguish genuine ability from perceived ability.
      *   *Distinctions:*
          *   Sourcehood vs. Leeway: Must clarify if PAP is about *doing* otherwise or *being the source*. If defending PAP, it must link sourcehood to leeway.
          *   Blame vs. Punishment: Responsibility (status) vs. Sanction (practice). FSCs often conflate these.
      *   *Empirical Constraints:*
          *   Libet-style findings (unconscious initiation). If actions start unconsciously, do "alternatives" exist at the conscious level? The theory can't demand conscious veto power if neuroscience says it's illusory.
      *   *Constraint Types:*
          *   Hard: Logical consistency, empirical plausibility.
          *   Preferences: Intuitive alignment, metaphysical parsimony.

  4.  **Refining the Desiderata (Hard vs. Preference):**
      *   *Hard:* Must logically resolve the FSC without begging the question. Must be compatible with basic causal closure (no magic). Must distinguish moral responsibility from legal liability.
      *   *Preference:* Should align with common intuitions about coercion. Should minimize metaphysical baggage (e.g., avoid agent-causation if possible).

  5.  **Developing the Scorecard:**
      *   *Sourcehood Theories (Actual Sequence):* Usually *reject* PAP. They say FSCs *do* kill PAP, but PAP wasn't needed. So, against *this* specific prompt (theories claiming FSCs *don't* kill PAP), they score poorly on the core thesis, though they handle the cases well. Wait, the prompt asks for desiderata for a theory *that claims FSCs don't kill PAP*. Sourcehood theories generally claim FSCs *do* kill PAP (and that's fine). So they fail the primary constraint.
      *   *Hierarchical Compatibilism:* Focuses on alignment of desires. Often accepts FSCs undermine PAP but argues PAP isn't needed. If forced to defend PAP, they struggle with the "could have done otherwise" in a deterministic world + FSC.
      *   *Epistemic Leeway (User's Hybrid):* This is the interesting one. It redefines "alternative" as "epistemically accessible alternative." This might survive FSCs because the agent *thinks* they have options, even if Black is there. But does that satisfy *moral* responsibility?

  6.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't accidentally validate theories that *accept* the Frankfurt conclusion (that PAP is false). The prompt specifically asks for desiderata for a theory that *defends* PAP against FSCs.
      *   *Nuance:* Many "PAP defenders" use the "Flicker of Freedom" strategy (there is *some* alternative, even if trivial). The desiderata must demand the alternative is *robust* enough for responsibility, not just a flicker.
      *   *Neuroscience:* Be careful not to overstate Libet. Focus on "unconscious initiation" generally.
      *   *Scoring:* Be critical. The "Epistemic Leeway" view sounds like it conflates excuse conditions with ability conditions. I need to score it honestly against the hard constraints.

  7.  **Finalizing the Structure:**
      *   **Section 1: The Spec (Desiderata).** Categorized by Cases, Distinctions, Empirical. Tagged Hard/Preference.
      *   **Section 2: The Scorecard.** Sourcehood, Hierarchical, Epistemic Leeway.
      *   **Tone:** Technical, precise, no fluff.

  8.  **Drafting the Content (Mental Check of specific points):**
      *   *Nested Cases:* If Black monitors the neural state that triggers the intervention, is there *any* gap? A PAP defender must find a gap (e.g., the decision to *not* trigger Black).
      *   *Epistemic:* If I think I can choose B, but I physically can't, am I responsible for choosing A? Epistemic Leeway says yes. Hard constraint check: Does this violate the "Ought Implies Can" principle? If I *can't* do B, can I be responsible for A based on the belief I could do B? This is a tension point for the scorecard.
      *   *Neuroscience:* If the brain commits 500ms before awareness, is the "alternative" accessible? The theory must account for the window of opportunity.

  9.  **Final Review against constraints:**
      *   No citations? Check.
      *   No libertarian wandering? Check.
      *   Hard vs. Preference flagged? Check.
      *   Scorecard included? Check.

