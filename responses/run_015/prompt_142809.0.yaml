answer: |-
  # Desiderata Specification: PAP-Defense Theories vs. Frankfurt Cases

  **Objective:** Define necessary conditions for a theory of moral responsibility that maintains the Principle of Alternative Possibilities (PAP) is necessary for responsibility, despite the existence of Frankfurt-style cases (FSCs).

  ## I. Case Coverage Requirements
  *The theory must provide a consistent verdict on the following scenarios without ad-hoc adjustments.*

  1.  **Classic Frankfurt (Jones/Black):**
      *   **Scenario:** Black will force Jones to $\phi$ if Jones shows signs of not $\phi$-ing. Jones $\phi$s on his own. Black never intervenes.
      *   **Requirement:** The theory must identify a *robust* alternative possibility that remains open to Jones, or explain why the intuition of responsibility is mistaken. Merely pointing to a "flicker" (e.g., the possibility of Black intervening) is insufficient unless that flicker is morally significant.
      *   **Constraint:** **Hard.** (Logical consistency).

  2.  **Nested Frankfurt (The Regress):**
      *   **Scenario:** A second intervener monitors Black to ensure Black intervenes if needed. A third monitors the second, ad infinitum.
      *   **Requirement:** The theory must locate an alternative possibility that survives the infinite regress of counters. If the theory relies on a "gap" in the causal chain, it must prove this gap is not closed by the nesting.
      *   **Constraint:** **Hard.** (Logical consistency).

  3.  **Epistemic Frankfurt (Ignorance of Constraints):**
      *   **Scenario:** The agent falsely believes they have live options, but unknown constraints (neural or external) make only one outcome physically possible.
      *   **Requirement:** The theory must distinguish between *believing* one has alternatives and *having* alternatives. It cannot ground responsibility solely on the illusion of choice if PAP is to remain a metaphysical condition rather than an epistemic one.
      *   **Constraint:** **Hard.** (Metaphysical coherence).

  ## II. Conceptual Distinctions
  *The theory must not collapse the following categories.*

  1.  **Sourcehood vs. Leeway:**
      *   **Requirement:** Must explain how *Sourcehood* (being the origin of the action) entails *Leeway* (the ability to do otherwise). Sourcehood-only theories concede FSCs kill PAP; this theory must argue Sourcehood is insufficient without Leeway.
      *   **Constraint:** **Hard.** (Defines the project).

  2.  **Blame vs. Punishment:**
      *   **Requirement:** Must distinguish the *status* of being blameworthy from the *practice* of punishing. FSCs often argue we should punish regardless of alternatives for utilitarian reasons. The theory must isolate moral responsibility from social utility.
      *   **Constraint:** **Hard.** (Normative clarity).

  3.  **Ability vs. Opportunity:**
      *   **Requirement:** Must distinguish internal capacity (I know how to $\phi$) from external opportunity (Nothing stops me from $\phi$-ing). FSCs remove opportunity; the theory must argue opportunity is necessary.
      *   **Constraint:** **Preference.** (Conceptual precision).

  ## III. Empirical Constraints (Neuroscience & Psychology)
  *The theory must be compatible with current data on action initiation.*

  1.  **Unconscious Initiation:**
      *   **Data:** Neural markers of decision often precede conscious awareness (Libet-style findings).
      *   **Requirement:** The theory cannot require conscious veto power at the exact moment of initiation if such power is empirically absent. The "alternative" must be located in a timeframe where cognitive access is plausible.
      *   **Constraint:** **Hard.** (Empirical adequacy).

  2.  **Implicit Bias & Compulsion:**
      *   **Data:** Agents often act on implicit biases they consciously reject.
      *   **Requirement:** The theory must explain why an agent is responsible for an action driven by unconscious bias if they lacked the alternative to suppress it in that moment.
      *   **Constraint:** **Preference.** (Psychological realism).

  ## IV. Constraint Legend
  *   **[HARD]:** Failure to meet this renders the theory logically incoherent, empirically falsified, or inconsistent with the core project (defending PAP).
  *   **[PREFERENCE]:** Failure makes the theory less attractive or intuitive, but not necessarily false.

  ---

  # Scorecard

  ### 1. Sourcehood Theories (Actual Sequence Compatibilism)
  *Focus: Responsibility depends on the actual history of the action, not alternative possibilities.*

  *   **Classic Frankfurt:** **Pass.** (Accepts Jones is responsible).
  *   **Nested Frankfurt:** **Pass.** (History remains uncompromised).
  *   **Epistemic Frankfurt:** **Pass.** (Focuses on actual causation).
  *   **Sourcehood vs. Leeway:** **Fail [HARD].** (Explicitly collapses this distinction; claims Sourcehood is sufficient without Leeway. This violates the core prompt requirement of defending PAP).
  *   **Unconscious Initiation:** **Mixed.** (Compatible if sourcehood is defined broadly, but struggles if consciousness is required for sourcehood).
  *   **Overall:** **Disqualified.** This view concedes that FSCs kill PAP, arguing PAP was never needed. It fails the primary specification of the prompt.

  ### 2. Hierarchical Compatibilism (Frankfurt/Dworkin style)
  *Focus: Responsibility requires alignment between first-order desires and second-order volitions.*

  *   **Classic Frankfurt:** **Fail [HARD].** (Typically concedes Jones lacks alternatives but is responsible. To defend PAP, it must argue Jones *did* have an alternative, which is difficult given the setup).
  *   **Nested Frankfurt:** **Fail.** (Struggles to identify where the "volitional gap" exists in a nested constraint).
  *   **Sourcehood vs. Leeway:** **Fail [HARD].** (Prioritizes Sourcehood/Structure over Leeway).
  *   **Unconscious Initiation:** **Fail.** (Second-order volitions are often conscious reflections; if initiation is unconscious, the hierarchy is bypassed).
  *   **Overall:** **Poor Fit.** While robust for compatibilism, it is historically associated with the *rejection* of PAP in light of FSCs. Adapting it to defend PAP requires significant metaphysical retrofitting regarding where the "could have done otherwise" exists.

  ### 3. 'Epistemic Leeway' (User Hybrid)
  *Focus: Responsibility requires alternatives accessible with reasonable epistemic effort.*

  *   **Classic Frankfurt:** **Pass.** (Jones epistemically accesses the option to not-$\phi$, even if Black would block it. The alternative is "live" from the agent's perspective).
  *   **Nested Frankfurt:** **Pass.** (As long as the agent is unaware of the nesting, the epistemic access remains).
  *   **Epistemic Frankfurt:** **Pass.** (This is the theory's home turf; it treats the illusion of options as sufficient if the illusion is non-culpable).
  *   **Sourcehood vs. Leeway:** **Mixed [PREFERENCE].** (Collapses Leeway into Epistemic Access. It redefines "Leeway" rather than preserving it metaphysically. Risks conflating "I could have" with "I thought I could have").
  *   **Blame vs. Punishment:** **Fail [HARD].** (If the agent physically *could not* do otherwise, blaming them violates "Ought Implies Can" unless "Can" is redefined epistemically. This risks making responsibility purely subjective).
  *   **Unconscious Initiation:** **Pass.** (Accommodates this well; if the agent couldn't epistemically access the veto, they aren't responsible. Aligns with data).
  *   **Overall:** **Strong Contender (with caveats).** It survives the FSCs by shifting the modality of "possibility" from metaphysical to epistemic.
      *   *Critical Vulnerability:* It faces a **Hard Constraint** risk on the "Ought Implies Can" principle. If an agent is physically determined to $\phi$ but thinks they can not-$\phi$, holding them responsible for $\phi$ implies they *should* have not-$\phi$-ed. If they *couldn't* have not-$\phi$-ed (metaphysically), the theory must argue that epistemic access satisfies the "Can." This is a contentious metaphysical move, not just an epistemic one.

  ### Summary Verdict
  *   **Sourcehood:** Rejects the prompt's core thesis (PAP defense).
  *   **Hierarchical:** Rejects the prompt's core thesis (PAP defense).
  *   **Epistemic Leeway:** Meets case coverage and empirical constraints but risks violating the **Hard Constraint** on metaphysical coherence regarding "Ability." It successfully defends a *version* of PAP against FSCs, but only by redefining "Possibility" in a way that traditional PAP defenders might reject as insufficient.
