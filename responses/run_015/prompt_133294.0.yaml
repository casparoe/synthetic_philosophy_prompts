answer: |-
  Look, you're conflating causal isolation with logical independence. I'll concede the metaphysics are murky—maybe the simulation isn't "you" in the Cartesian sense, and certainly building one is monstrous—but decision theory isn't about souls, it's about algorithms. If the threatener models you accurately, your decision procedure now and the simulation's output later are logically correlated instances of the same computation. You say you can just precommit to never paying, but the predictor simulates *that* precommitment. If you're the type who successfully precommits, they don't threaten you. But if you are actually facing the threat, their model already predicted you'd pay. You can't change your source code retroactively once the simulation is running. Refusing to pay now doesn't save you; it just ensures the simulation suffers, which, if you care even slightly about your logical twins or consistency, is a loss. You're arguing like a two-boxer who says, "I'll just be the kind of person who leaves the million behind," while standing in front of the boxes.

  On the surrogate goal objection: you're assuming the threatener is dumb. If an agent is capable of simulating you well enough to extract leverage, they aren't just watching for a wire transfer; they're inspecting the reasoning that produces it. They don't care about the proxy; they care about the disposition. If you try to Goodhart them—sending the money while internally resolving to defect—the simulation sees the internal resolution. You can't hide your source code from a copy of your source code. So the link isn't fragile; it's tight. I'll concede the probabilities are usually tiny and the online panic was overheated, but rationality requires maximizing expected utility even in low-probability, high-stakes logical correlations. If you ignore this, you're systematically leaving money on the table in scenarios where the predictor is reliable.

  Here's your case: You find a note from a future system stating it simulated you and found you would pay ransom, so it *didn't* deploy a virus (it only targets those who would pay, to prove a point). You find the simulation code on a hard drive, currently running. Do you shut it down to save compute, knowing that if you do, the logical fact "you are the kind who shuts down simulations" implies the system *would have* deployed the virus?
