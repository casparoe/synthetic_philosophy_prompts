  # Branch Nodes

  1.  **Method:** Is closure a datum any theory must accommodate? (Yes → 2; No → 3).
  2.  **Safety:** In the lottery, is your belief safe but not sensitive? (Yes → 4; No → 5).
  3.  **Zebra:** Does closure fail for multi-premise deductions like the zebra case? (Yes → 6; No → 4).
  4.  **Context:** Does knowledge truth move with conversational context? (Yes → Leaves 1–3; No → 5).
  5.  **Stakes:** Does knowledge truth move with practical stakes? (Yes → Leaves 4–5; No → Leaves 6–10).
  6.  **Failure/Skeptic:** If closure fails, is it due to the method's inability to exclude skeptical hypotheses? (Yes → Leaves 11–12; No → Leaf 13).

  *Routing Note:* Answering Yes to Method commits you to preserving closure unless later nodes force a denial. Answering No to Safety implies sensitivity is required. The Context and Stakes nodes separate variable views from invariant ones. The final node locates closure failure either in the subject's method against skeptics or in the content/standards themselves. This structure forces a choice between preserving closure via safety/context versus denying it via sensitivity/method limits.

  # Leaves

  1.  **Nozickian Tracking:** 1Y-2Y-4N-5N-6Y. Awkward: Denies knowledge of deduced truths despite competent inference.
  2.  **Warranted Not Known:** 1N-3Y-6Y. Awkward: Knowledge is not the supreme epistemic value; warrant suffices.
  3.  **Relevant-Alternatives Contextualism:** 1Y-2Y-4Y. Awkward: Knowledge ascriptions change truth value instantly with conversation.
  4.  **Subject-Sensitive Invariantism:** 1Y-2Y-4N-5Y. Awkward: Two subjects identical cognitively differ in knowledge due to stakes.
  5.  **Classical Safety Invariantism:** 1Y-2Y-4N-5N. Awkward: Lottery beliefs count as knowledge despite low probability.
  6.  **Contrastivism:** 1N-3N-6N. Awkward: Knowledge is ternary (S knows p rather than q), not binary.
  7.  **Skepticism:** 1Y-2N-6Y. Awkward: We know almost nothing because we cannot exclude skeptics.
  8.  **Hybrid Contrast-Tracking:** 1N-2Y-6N. Awkward: **Empty**; tracking relativized to contrast is unexplored.
  9.  **Dogmatism:** 1Y-2N-4N-5N-6N. Awkward: Skeptical hypotheses are irrelevant by fiat, not evidence.
  10. **Strict Invariantism:** 1Y-2Y-4N-5N-6N. Awkward: Standards are too high for ordinary claims to succeed.
  11. **Moderate Invariantism:** 1Y-2Y-4N-5N-6N. Awkward: Standards are too low for scientific claims to succeed.
  12. **Methodist Particularism:** 1N-3N-4N-5N. Awkward: Theory bends entirely to pre-theoretic judgments without constraint.
  13. **Standards Failure:** 1N-3Y-6N. Awkward: Closure fails due to ascriber standards, not subject method.

  # Empty Cells

  Several logical combinations remain unoccupied. **Safety + Closure Denied + Context Shift** is incoherent; safety usually secures closure unless context raises standards. **Sensitivity + Closure Held** is unattractive; sensitivity inherently violates closure in skeptical contexts. **Stakes Shift + Context Shift** is unexplored; views typically commit to one variability source, not both simultaneously. **Safety + Skeptic Excluded** is unstable; if safety holds, skeptics are usually irrelevant, making exclusion redundant. **Contrastivism + Closure Held** is merely unattractive; contrastivists often deny binary closure to solve skepticism. These gaps suggest structural tensions: safety and context aim to save closure, while sensitivity and skepticism tend to deny it. Holding both safety and closure denial requires ad hoc restrictions on deduction not found in current literature.

  # Collisions

  The tree conflates **Classical Safety Invariantism** and **Strict Invariantism**. Both follow the path 1Y-2Y-4N-5N-6N, differing only on the height of standards, which the nodes do not measure. A further question on *what sets the baseline standard* would separate them. Similarly, **Contrastivism** and **Standards Failure** both deny closure without methodological failure (1N-6N). The tree cannot distinguish whether the failure lies in the content (contrast) or the ascriber (standards). A question asking *whether knowledge relations are binary or ternary* would resolve this collision. These overlaps show the tree maps logical space, not every nuanced doctrinal difference.
