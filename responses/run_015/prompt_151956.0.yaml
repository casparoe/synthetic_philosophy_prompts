answer: |-
  The South African Truth and Reconciliation Commission (TRC) occupies a unique philosophical space in the history of transitional justice. By instituting a proportionality gate—requiring that acts be proportionate to the political objective pursued—it navigated a tension between the Nuremberg-style rejection of "superior orders" (seen in Argentina) and the community-based restorative pragmatism of Rwanda's *gacaca*.

  Your inquiry probes the moral architecture underlying this gate. To answer it, we must dissect the TRC's implicit theory of political violence, the tension between consequentialist and deontological ethics within its mandate, and the apparent contradiction between its message to victims and its criteria for perpetrators.

  ### 1. The Moral Weight of Political Purpose
  The proportionality gate presupposes that **political purpose confers a distinct moral status upon violence**, distinguishing it from common criminality. This is a profound commitment. It rejects the liberal positivist view that murder is murder, regardless of motive. Instead, it adopts a framework closer to **Just War Theory (*Jus ad Bellum* and *Jus in Bello*)**.

  By requiring applicants to prove their acts served a political objective, the TRC acknowledged that South Africa was not merely a society plagued by crime, but a theater of political conflict. The philosophical commitment here is that **systemic injustice creates a context where normal moral and legal prohibitions are suspended or modified.**

  However, by adding the proportionality requirement, the TRC refused to grant political purpose *absolute* moral weight. It presupposed that while the *cause* might legitimize the *conflict*, it does not legitimize *any means*. This implies a hierarchy of values:
  1.  **Political Necessity:** Recognized as a mitigating factor that shifts an act from "crime" to "offense."
  2.  **Human Rights Constraints:** Recognized as the boundary that, if crossed (via disproportionality), returns the act to the realm of "crime."

  Therefore, the gate presupposes that political purpose has significant moral weight, but it is **defeasible**. It can justify risk and violence, but it cannot override the fundamental dignity of the victim unless the violence was strictly necessary and targeted (proportionate) within the logic of that conflict.

  ### 2. Instrumental Reasoning vs. Deontological Reconstruction
  Does this require instrumental reasoning (weighing rights violations against collective ends)? On the surface, yes. The calculus appears utilitarian: *Did the value of the political objective outweigh the cost of the specific violation?* This risks the "dirty hands" problem, where individual rights are sacrificed for collective liberation.

  However, the model can be reconstructed within a **deontological framework**, specifically through a **status-based deontology**.

  *   **The Instrumental View:** The act is judged by its contribution to the end. If the ANC's bombing of a civilian restaurant advanced the anti-apartheid struggle significantly, a utilitarian might argue it was "worth it." The TRC rejected this. Many acts with high political utility were denied amnesty because they were indiscriminate.
  *   **The Deontological Reconstruction:** Here, political motivation does not change the *magnitude* of the harm (a death is a death), but it changes the **moral category of the agent and the act**.
      *   *Common Criminal:* Acts for private gain; violates the categorical imperative against using humans as means.
      *   *Political Actor:* Acts for a public good; operates within a "state of war" logic.
      *   In this view, the proportionality test is not a utilitarian calculation of *outcome*, but a deontological check on *conduct*. It asks: "Did you adhere to the duties of a political combatant?" (e.g., distinguishing combatants from non-combatants).

  If we view the TRC's proportionality gate through *Jus in Bello* (justice in war), it becomes deontological. The political objective grants the agent the status of a combatant, but that status comes with strict duties (proportionality, discrimination). Violating these duties strips the agent of their political status, reverting them to a common criminal. Thus, political motivation alters the *category* (Combatant vs. Criminal), and proportionality is the test of whether the agent remained within that category.

  ### 3. Internal Consistency: The Victim/Perpetrator Asymmetry
  The most damning critique of the TRC model is the one you identified: **The Asymmetry of Moral Calculus.**

  *   **To the Victim:** The TRC asserted that human rights violations were gross abuses that could not be justified by political ideology. The suffering was absolute; no political objective could diminish the wrong done to *them*.
  *   **To the Perpetrator:** The TRC required them to demonstrate that their act *was* proportionate to a political objective to earn amnesty.

  **Is this internally consistent?**
  Strictly speaking, **no.** It creates a performative contradiction. It tells the victim, "Your pain transcends politics," while telling the perpetrator, "Your crime is evaluable through politics."

  However, proponents of the TRC (like Archbishop Tutu or Alex Boraine) would argue this inconsistency is a **necessary pragmatic paradox** inherent to restorative justice in a negotiated transition.
  *   **Epistemic Function:** For the *nation*, the political calculus is necessary to establish the *Truth*. Understanding the political proportionality helps the society understand *why* the violence happened, preventing recurrence.
  *   **Moral Function:** For the *victim*, the rejection of political justification is necessary to restore *Dignity*. Validating the victim requires acknowledging that their suffering was not a legitimate "cost of war."

  The model attempts to separate **Legal Liability** (which is waived via the political calculus) from **Moral Guilt** (which remains). The inconsistency arises because the TRC tried to serve two masters: the **Rule of Law** (which demands consistency) and **Political Peace** (which demands compromise).

  By asking perpetrators to measure crimes by a political calculus, the TRC implicitly validated the logic of political violence, even as it explicitly condemned the results. This suggests the model is not philosophically consistent, but **politically coherent**. It prioritized the *possibility of a future polity* over the *purity of moral philosophy*. It accepted that to move from a state of war to a state of law, one must temporarily speak the language of war (proportionality of objectives) to dismantle the structures of war.

  ### Conclusion
  The TRC's proportionality gate presupposes that political purpose transforms the nature of violence from criminal to combative, but remains bound by deontological constraints on conduct (*Jus in Bello*). While it superficially employs instrumental reasoning, it is best reconstructed as a status-based deontology where proportionality determines whether an actor remains a "political combatant" or reverts to a "criminal."

  However, the model is internally inconsistent regarding the moral weight of suffering. It creates a dual reality where political objectives are simultaneously irrelevant (for the victim's dignity) and decisive (for the perpetrator's liberty). This inconsistency is not a philosophical oversight but a **structural feature of negotiated transitions**. It reveals that the TRC was not a court of moral philosophy, but a mechanism of political engineering that used moral language to bridge the gap between retributive justice and the pragmatic necessity of peace. It sacrificed philosophical consistency for the sake of political viability, betting that the truth of the proportionality test would satisfy the nation's need for explanation, even if it failed to satisfy the victim's need for equivalence.
