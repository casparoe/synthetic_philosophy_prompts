answer: |-
  You are right to suspect your geriatrician's framing is obscuring the real work your committee is doing. If this were a simple fight between "precedent autonomy" (the past self) and "current welfare" (the present self), Case 2 (Byrne) and Case 5 (Rasmussen) would have gone the other way. In those cases, you prioritized the *current* welfare/self over the *past* expressed wishes. In Cases 1, 3, and 4, you did the opposite.

  The axis isn't Past vs. Present, and it isn't Autonomy vs. Welfare. It is **Authenticity vs. Distortion.** Your committee has consistently ruled that the decision made by the self *least distorted by the relevant pathology* gets to speak for the patient. Sometimes that is the past self (Alvarez, Okonkwo, Lindqvist); sometimes it is the present self (Byrne, Rasmussen).

  Here is the breakdown of the rules consistent with your precedents, how they apply to Ms. Iversen, and the principle you would be adopting.

  ### 1. The Two Consistent Rules

  Based on your five rulings, there are two ways to articulate the "Authenticity" standard. Both fit the data, but they diverge on Ms. Iversen.

  **Rule A: The "Clean Hands" Principle (Focus on the Origin)**
  *   **Formulation:** A directive or value statement is binding if it was formed when the patient was free from the distorting influence of the condition currently requiring treatment. A current refusal or request is invalid if it appears to be a product of that condition, even if technical capacity is present.
  *   **Fit:** This explains *Alvarez* (early AD decision was clean), *Okonkwo* (religious decision was clean), *Lindqvist* (pre-mania decision was clean), *Byrne* (anorexic refusal was tainted), and *Rasmussen* (depressive directive was tainted).
  *   **Implication:** It privileges the *quality of the formation* of the wish over the *timing* of the wish.

  **Rule B: The "Active Revocation" Principle (Focus on the Current Voice)**
  *   **Formulation:** A prior directive stands unless the current patient, possessing documented capacity, actively and specifically revokes it. Ambiguity or passive drift (Okonkwo) does not count as revocation. However, a clear, competent current statement overrides a prior document unless the current capacity is demonstrably compromised by the illness itself.
  *   **Fit:** This explains *Okonkwo* (shrug $\neq$ revocation), *Alvarez* (no revocation), and *Rasmussen* (current competent wish override). It struggles slightly with *Lindqvist* (where current reasoning was present but overridden), unless you argue mania inherently negates capacity regardless of test scores.
  *   **Implication:** It privileges the *current competent voice* unless that voice is legally or medically disqualified.

  ### 2. Application to Ms. Iversen

  Ms. Iversen presents a conflict between a **Clean Past Self** (the research profile) and a **Technically Competent Present Self** (the geriatric assessment).

  *   **Under Rule A (Clean Hands):** You should recommend **Palliative Management (honor the profile).**
      *   *Reasoning:* Her prior values profile was generated when she was fully competent and free of Alzheimer's. Her current desire for surgery relies on the expectation that she will "go home," which geriatric data suggests is unlikely. This optimism is a classic symptom of moderate Alzheimer's (anosognosia or impaired risk appreciation). Like *Ms. Lindqvist*, she may reason well generally but lack insight into the specific risk at hand. The "Clean Hands" rule says the past self, untainted by dementia, knows her values better than the current self, who is tainted by it.
  *   **Under Rule B (Active Revocation):** You should recommend **Surgery (honor the current request).**
      *   *Reasoning:* She passes the standard capacity test. Her statement ("I want the operation") is an active revocation of the profile. Unlike *Mr. Okonkwo's* shrug, this is a clear affirmative choice. Unless you are willing to say she *lacks* capacity (contradicting geriatrics), Rule B suggests her current voice overrides the informal profile.

  ### 3. The Closest Analog

  **Ms. Lindqvist (Case 4) is the closest analog.**

  *   **Why:** Like Ms. Lindqvist, Ms. Iversen is currently exhibiting a state (mania / Alzheimer's optimism) that allows for coherent reasoning on most topics but distorts the specific judgment regarding her own treatment needs. Ms. Lindqvist reasoned perfectly well *except* about her need for medication. Ms. Iversen understands the surgery *except* about the likely outcome (nursing home vs. home).
  *   **Distinction:** In *Lindqvist*, you honored the *prior* directive. In *Rasmussen* (Case 5), you honored the *current* wish. The difference is that Rasmussen's *prior* wish was born of depression (tainted). Iversen's *prior* profile was born of competence (clean). Therefore, *Lindqvist* controls.

  ### 4. The Principles You Would Be Adopting

  If you want to be consistent with your track record, you need to choose which principle you are willing to own publicly.

  **Option 1: The "Substantive Capacity" Principle (Consistent with Lindqvist/Alvarez)**
  *   **Statement:** "We recognize that standard capacity tests measure understanding, not wisdom. If a patient's current condition is known to systematically distort risk assessment regarding this specific treatment, we will prioritize the values expressed by their prior competent self."
  *   **Cost:** This is paternalistic. It tells families that a patient can say "I want this" clearly and understand the risks, but you will still say "no" because you trust the past version more.

  **Option 2: The "Procedural Capacity" Principle (Consistent with Rasmussen/Byrne)**
  *   **Statement:** "We prioritize the current voice of the patient. A prior directive is only a proxy for the patient's will. If the patient is currently present and passes capacity standards, their current will supersedes the proxy, unless the current capacity is legally voided."
  *   **Cost:** This undermines the stability of advance planning. It tells the community that if they develop dementia but retain enough charm to pass a chat test, their prior hard choices about nursing homes can be overturned by their new, disease-altered self.

  **Recommendation:** Given Cases 1, 3, and 4, your committee has a heavier weighting toward **Option 1**. To switch to Option 2 now would make *Alvarez* and *Lindqvist* look like outliers. To be consistent, you should honor the profile (Palliation), noting that the "capacity" to choose surgery is compromised by the disease's specific effect on risk appreciation.

  ### 5. The Discriminating Case

  You asked for a future case that would tell these rules apart. You need a case where the **Past Self is Clean** but the **Present Self is Competent and Specific.**

  **The "Lucid Interval" Revocation:**
  *   **Scenario:** A patient with early dementia (like *Alvarez*) signs a directive: "No feeding tube." Two years later, they have advanced dementia. However, due to a medication adjustment or temporary metabolic correction, they have a documented 48-hour window of clear, tested capacity. During this window, they say explicitly: "I know what I wrote before, but I want to eat. If I can't swallow, put the tube in." Then they slip back into dementia.
  *   **Why it separates the rules:**
      *   **Rule A (Clean Hands/Substantive):** Might still honor the *original* directive. It could argue the "Lucid Interval" is part of the disease's fluctuation and the *stable* prior self is more authentic than the *fleeting* current self.
      *   **Rule B (Active Revocation/Procedural):** Must honor the *revocation*. The patient had capacity and spoke clearly. The timing doesn't matter; the capacity does.
  *   **Your Committee's Likely Vote:** Based on *Okonkwo* (where a shrug wasn't enough) and *Alvarez* (where current contentment didn't matter), I suspect you would honor the **Original Directive**. You seem to value the *stable* competent self over the *transient* competent self.

  ### 6. On the Geriatrician's Framing

  Your suspicion is correct. The geriatrician is framing this as **Autonomy (Past) vs. Beneficence (Present).** That is the standard bioethics textbook fight.

  But your case log shows you are actually fighting about **Epistemic Authority.**
  *   In *Byrne* and *Rasmussen*, you decided the *Past Self* did not know what it was talking about (distorted by anorexia/depression).
  *   In *Alvarez*, *Okonkwo*, and *Lindqvist*, you decided the *Current Self* did not know what it was talking about (distorted by dementia/apathy/mania).

  The question isn't "Do we care about the past or the present?" It is: **"Which version of this person is the reliable narrator of their own life?"**

  In Ms. Iversen's case, the research profile is a reliable narrator of her values. The current cheerful patient is a reliable narrator of her current feelings, but an unreliable narrator of her future reality. If you operate, you are deciding that current feelings trump past values. If you palliate, you are deciding that past values trump current feelings. Given *Alvarez*, you have already decided that past values win when the current state is compromised by the disease process.

  **Summary Decision:** To remain consistent with *Alvarez* and *Lindqvist*, you should recommend honoring the values profile (Palliation). The principle is: **When a neurocognitive disorder impairs the appreciation of future consequences, the prior competent assessment of risk outweighs the current competent expression of desire.**
