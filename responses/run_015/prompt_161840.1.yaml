answer: |-
  **The Meritorious Conduct Accrual Scheme (MCAS)**
  **Terms of Membership & Benefit Schedule**

  **Unlock Your Potential.**
  The MCAS recognises that duty is merely the baseline. True distinction lies in the voluntary excess. Members accrue Merit Credits™ by performing conduct that is praiseworthy to undertake and not blameworthy to omit. Ascend to Platinum Sanctity while maintaining full freedom to opt out. Because being good should be optional, but looking good should be rewarding.

  **1. Ledger Asymmetry and Non-Conversion**
  1.1. Members shall maintain two distinct ledgers: the Praise Account and the Blame Account.
  1.2. Credits accrued in the Praise Account cannot be converted to offset debits in the Blame Account, nor vice versa.
  1.3. A zero balance in the Praise Account constitutes no breach of membership terms. No penalty, downgrade, or reproach shall attach to a member who performs zero qualifying acts during a reporting period, provided all Baseline Duties are met.

  **2. Tier Classification and Voluntariness**
  2.1. The highest membership tier, "Platinum Sanctity," is designated as the morally best available conduct for members in good standing.
  2.2. Notwithstanding Clause 2.1, attainment of Platinum Sanctity is strictly voluntary.
  2.3. No member shall be downgraded, blamed, or subject to adverse commentary for declining to perform acts required for Platinum Sanctity. The Programme asserts both the superior value of the tier and the absolute permissibility of ignoring it without contradiction.

  **3. Baseline Obligations and Reclassification**
  3.1. Qualifying Acts are defined solely by reference to the Schedule of Baseline Obligations (the Schedule). Acts listed on the Schedule earn zero Credits.
  3.2. The Programme reserves the right to revise the Schedule quarterly.
  3.3. Where statistical analysis indicates that a significant majority of the membership routinely performs a specific Qualifying Act, said act shall be reclassified as a Baseline Duty.
  3.4. Upon reclassification, the act shall cease to earn Credits immediately. Members acknowledge that collective moral improvement may result in the devaluation of previously credited conduct.

  **4. Net-of-Cost Accounting**
  4.1. Credits are awarded based on net sacrifice, calculated as the moral value of the act minus the cost or risk to the Member.
  4.2. Consequently, an act performed by a Member to whom it entails low cost shall earn fewer Credits than the same act performed by a Member to whom it entails high cost.
  4.3. This mechanism ensures equity of sacrifice. The Programme notes that Members with greater resource liquidity may accumulate Credits more rapidly due to their capacity to absorb high-cost acts without material hardship, whereas Members with limited resources may find the entry threshold for high-yield acts prohibitive. This disparity is deemed consistent with fair play.

  **5. Motive Verification and Forfeiture**
  5.1. Credits are forfeited if the Act is performed primarily for self-interested or status-seeking motives.
  5.2. The Programme admits it possesses no reliable means of auditing internal motives.
  5.3. In cases of mixed motives, Credits shall be pro-rated at the sole discretion of the Compliance Committee. Members are advised to self-report motive purity accurately.

  **6. Sub-Permissible Conduct and Authority**
  6.1. Conduct that is permissible yet merits a negative response shall earn Negative Credits.
  6.2. Negative Credits shall not be recorded as Blame and cannot trigger suspension.
  6.3. No Credits are awarded for Acts performed in ignorance of their being required.
  6.4. Where an Authority Command converts a Qualifying Act into a Duty, Credit eligibility ceases instantly. Compliance with orders is never meritorious.

  **7. Aggregation and Collective Harm**
  7.1. Where a harm is averted only by the collective action of multiple Members, and each Member was free not to act, each participating Member shall receive full Credit.
  7.2. In the event that insufficient Members participate and the harm occurs, participating Members shall retain their Credits. The Programme makes no finding on the moral status of the resulting harm.

  **Sample Credit Schedule**

  | Act | Estimated Cost to Member | Credits Awarded |
  | :--- | :--- | :--- |
  | Donating a Kidney to Stranger | High | 5,000 |
  | Donating 10% Income to Charity | Medium | 500 |
  | Returning Lost Wallet (Full) | Low | 50 |
  | Returning Lost Wallet (Partial) | Low | -10 (Negative) |
  | Giving Way in Queue | Negligible | 0 (Baseline) |
  | Breathing | None | 0 |

  **Definitions**
  **"Baseline Duty"**: Conduct required to maintain basic membership standing; omission attracts Blame.
  **"Qualifying Act"**: Conduct exceeding Baseline Duty; omission attracts no Blame.
  **"Member"**: Any moral agent capable of understanding these terms.
  **"Authority"**: Any entity capable of imposing duty via command.

  **Reservation of Rights**
  The Programme reserves the right to reclassify any Act, including those previously performed, at any time without notice. Reclassification may be retroactive. The Programme's determination of what constitutes Duty versus Merit is final and binding. Members agree that moral clarity is subject to administrative revision.
