prompt: |-
  The counterfactual and interventionist accounts of causation—the Lewis-style world-comparison framework and the Woodward/Pearl invariant-manipulation framework—have coexisted for decades without convergence, even on canonical problem cases like preemption and symmetric overdetermination. Is the impasse substantive (they disagree about whether causation requires manipulability or modal robustness), verbal (they use "cause" for different explanatory targets), or a case of one program addressing ontology and the other addressing scientific practice? Focus your diagnosis on how each side treats a case where intervention is impossible—say, a cosmological boundary condition or a necessary mathematical dependency—to see whether the disagreement is hidden there. Then say what, if anything, would count as progress: a formal reduction of one framework to the other, an empirical result that distinguishes them, or the recognition that they answer different questions and should be separated.
