          *   *Diagnosis:* Here lies the substantive rift. Lewis allows "causation" where manipulation is metaphysically impossible. Woodward restricts "causation" to relationships exploitable for control/explanation within a model.

      *   **Step 3: Evaluating the Nature of the Impasse.**
          *   *Verbal?* No, they aren't just defining words differently; they are making different claims about what exists or what matters.
          *   *Substantive?* Yes, regarding the necessity of agency/manipulability.
          *   *Division of Labor?* This is the strongest diagnosis. Lewis answers "What is the metaphysical glue?" Woodward answers "What supports scientific explanation and prediction?"
          *   *Synthesis:* The impasse persists because they are solving different problems. Lewis wants a truth-maker for causal claims. Woodward wants a criterion for causal *explanation*.

      *   **Step 4: Defining Progress.**
          *   *Formal Reduction?* Unlikely. You can't reduce modality to manipulation without losing the "possible world" aspect, and you can't reduce manipulation to modality without losing the "agency" aspect.
          *   *Empirical Result?* Causation isn't directly observable in that way. No experiment settles metaphysics.
          *   *Recognition of Separation?* This is the most viable path. "Causal Pluralism." Acknowledge that "causation" is a cluster concept.

  4.  **Refining the Argument (Self-Correction/Nuance):**
