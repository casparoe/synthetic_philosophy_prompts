      *   *Nuance:* Woodward might say the Big Bang isn't a "cause" in the scientific sense, but a "boundary condition." Lewis might call it a cause. This confirms the "different questions" hypothesis.
      *   *Preemption/Overdetermination:* Why haven't they solved this? Because Lewis uses similarity metrics (vague), and Woodward uses structural equations (requires specifying the model). The disagreement is often about *model specification*, not the definition of causation itself.

