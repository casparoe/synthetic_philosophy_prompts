      *   *Observation:* Lewis focuses on similarity of possible worlds (modal robustness). Woodward focuses on invariant relationships under intervention (manipulability).
      *   *Tension:* Interventions require the possibility of change. Some causes (Big Bang, mathematical truths) seem unchangeable.
      *   *Hypothesis:* The impasse is largely a division of labor (ontology/metaphysics vs. scientific explanation), but there is a substantive core regarding the *nature* of the dependency relation. The "impossible intervention" cases are the stress test.

  3.  **Drafting the Analysis - Step-by-Step:**

      *   **Step 1: Characterize the Two Frameworks.**
          *   *Lewis:* Causation = chain of counterfactual dependencies. $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred (ceteris paribus/world similarity). It's metaphysical.
          *   *Woodward/Pearl:* Causation = invariance under intervention. $X$ causes $Y$ if changing $X$ (via intervention) changes $Y$. It's functional/explanatory.

      *   **Step 2: The "Impossible Intervention" Test Case.**
          *   *Case A: Cosmological Boundary Conditions (e.g., Initial Singularity).*
              *   Lewis: Can imagine a possible world where the singularity is different. If $E$ (universe structure) changes, it's a cause.
              *   Woodward: Cannot intervene on the Big Bang. No "outside" agent. Strictly speaking, not a cause in the manipulationist sense *unless* we treat the model abstractly.
          *   *Case B: Mathematical Dependencies (e.g., $2+2=4$ causes logical consequences).*
              *   Lewis: Mathematical truths are necessary. Counterfactuals with impossible antecedents are tricky (vacuously true or require non-standard logic).
