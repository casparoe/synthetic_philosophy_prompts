answer: |-
  DEPARTMENT OF STOCHASTIC INTEGRITY
  Office for Randomness Assurance
  10 CFR Part 800
  Docket No. ORA-2023-0042

  ** Proposed Rule Regarding Parametric Declaration in Chord Generation **

  **AGENCY:** Office for Randomness Assurance (ORA), Department of Stochastic Integrity.

  **ACTION:** Notice of Proposed Rulemaking.

  **SUMMARY:** The Office for Randomness Assurance proposes to amend its certification standards for random-chord-generating devices used in regulated gaming, audit sampling, and statistical modeling. Current guidance fails to account for parametric ambiguity in geometric probability. This rule requires devices to declare their sampling measure on Form RA-7. Compliance will be assessed based on internal consistency between the declared measure and the output distribution.

  **DATES:** Comments must be received by [Date].

  **FOR FURTHER INFORMATION CONTACT:** Office of Regulatory Geometry, ORA.

  **SUPPLEMENTARY INFORMATION:**

  **I. Background and Geometric Basis**
  The regulatory uncertainty stems from the non-uniqueness of the term "random" when applied to continuous geometric spaces. Specifically, the probability that a randomly drawn chord of a circle exceeds the length of the side of an inscribed equilateral triangle (threshold length $\sqrt{3}R$, where $R$ is the radius) varies based on the method of selection.

  The Office recognizes three classical parametrizations currently in use:
  1.  **Endpoint Method:** Two points are selected uniformly and independently on the circumference. The resulting probability is 1/3.
  2.  **Radial Method:** A radius is selected uniformly, and a point is selected uniformly along that radius to define the chord's midpoint perpendicular to the radius. The resulting probability is 1/2.
  3.  **Midpoint Method:** A point is selected uniformly from the interior area of the circle to serve as the chord's midpoint. The resulting probability is 1/4.

  Under existing standards, a device yielding 1/4 could be deemed non-compliant by an auditor expecting 1/3, despite both outputs being mathematically valid under their respective measures.

  **II. Proposed Certification Protocol**
  To resolve this, the Office proposes that conformance be assessed relative to each device's declared measure. A machine counts as properly random if its output matches the theoretical distribution of the parametrization declared on Form RA-7. A device declaring the Radial Method must yield 1/2; a device declaring the Midpoint Method must yield 1/4. Neither is privileged.

  This logic necessitates a default rule for entities not subject to device certification, such as federal agencies reporting risk assessments or polling data. If no probability statement means anything until a measure is declared, then every agency, poll, or risk assessment that reports a figure without saying what it was uniform over has reported nothing at all. Therefore, the Office proposes that, absent a declaration, the default measure shall be uniform in whatever quantity the reporting form happens to ask about.

  Stakeholders should note the implications for form design. If a form requests a probability value directly, the default is uniform over [0,1]. If a form requests a log-odds ratio, the default is uniform over the real line, transforming the implied probability distribution. Consequently, regulated entities can obtain any number between 0 and 1 by redesigning the reporting form to query a different variable, without altering the underlying physical phenomenon. The Office considers this an acceptable administrative flexibility.

  **III. Response to Public Comment**
  During the pre-rulemaking phase, Commenter ID-99 argued that demanding invariance under translation, rotation, and rescaling of the circle settles the matter, uniquely selecting the Radial Method (1/2). The Office notes that it has no jurisdiction over transformations. The Office regulates static circles within fixed coordinate systems. Arguments regarding rotational symmetry fall outside the Office's statutory authority and are dismissed.

  **IV. Validation of Emerging Methods**
  The Office is currently evaluating a fourth method, under validation for three years. In this setup, the chord is fixed by two points drawn uniformly from the square circumscribing the circle, keeping the line only if it crosses the circle. The Office favors this method because it is grid-based and neutral like everything else in the standard. However, the validation study keeps returning a different figure depending on which way the square is laid over the circle. The Office has provisionally concluded that this is a fact about reality rather than about the method. No specific probability value will be assigned to this method until the orientation of the universe is standardized.

  **V. Stakeholder Input**
  Regarding the proposed flexibility, J. H. Vane, CEO of Stochastic Solutions Ltd., stated: "This provides a predictable compliance framework. We can now guarantee our clients any probability they require, provided we update the device firmware to match the declared parameter on Form RA-7."

  **QUESTIONS FOR COMMENT**
  1.  Will the requirement to declare a parametrization on Form RA-7 impose undue burdens on manufacturers of analog chord generators?
  2.  Are there alternative default measures that would reduce the variance in reported risk assessments caused by form redesign?
  3.  Should the Office seek jurisdiction over rotational transformations to stabilize the fourth method?

  **Authority:** 15 U.S.C. 7701 et seq.

  **Issued in Washington, DC.**

  **Elena R. Fisher**
  **Director, Office for Randomness Assurance**
