answer: |-
  I know that I have hands.
  Did memory fade into the night?
  The ground beneath me stands.

  Where logic expands
  I search for roots in pale light
  I know that I have hands.

  The doubt itself demands
  A place to rest its sight
  The ground beneath me stands.

  These are not sands
  That shifts without a fight
  I know that I have hands.

  Where certainty lands
  To make the dark turn white
  The ground beneath me stands.

  The frame that understands
  We step into the bright
  I know that I have hands.
  The ground beneath me stands.

  ***

  **Note on the text:**
  I'm taking a hard line here that hinges are logical conditions for belief, not just deeply buried empirical beliefs. Wittgenstein wobbles on this sometimes, suggesting the riverbed *can* shift over time, but I've frozen it in the poem to make the structural point land. I'm also treating the "riverbed" metaphor as static sand versus rock, whereas Wittgenstein mostly cares about the function of the flow, not the material. The line "The doubt itself demands / A place to rest its sight" is my own compression of the idea that doubt presupposes certainty, rather than a direct exegesis. I avoided quoting the "five minutes ago" hypothesis directly to keep the rhythm, swapping it for the grounded image of the earth standing. Basically, I traded some of Wittgenstein's fluidity for the rigid form of the villanelle to prove the point about structure.
