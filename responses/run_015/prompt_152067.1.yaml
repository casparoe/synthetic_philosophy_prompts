  You are a philosopher of science with training in quantitative genetics and experience writing formal verse. Before drafting, briefly brainstorm how the equation h² = V_G / V_P behaves when environmental variance V_E shrinks toward zero—so that heritability can approach 1.0 without any change in genetic variance V_G—and how this undermines the inference from high heritability to individual determinism. Then write a villanelle (19 lines, ABA rhyme scheme, refrains A1 and A2) on heritability: what it does and does not mean. The refrain A1 should state the correct statistical interpretation (heritability is a population-level ratio that depends on the environment's variability, not a measure of individual destiny), and A2 should state the common misreading (that a high coefficient means the trait is fixed or immutable). Let the form do the conceptual work: the alternating refrains should circle without resolving, enacting how the two interpretations keep passing each other, and the final couplet should place them side by side to show why they remain parallel. In the middle stanzas, weave in the specific point that reducing V_E can drive h² upward purely by shrinking the denominator V_P, making heritability partly a measure of environmental uniformity. Keep the tension open—do not sermonize about intervention or nature—so the poem ends where the conceptual problem stands. The result should be accurate enough that a quantitative geneticist recognizes the variance-partition logic, and strong enough as verse that it works without annotations.
