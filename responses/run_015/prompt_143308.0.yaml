answer: |-
  **PHI 405: Philosophy of Language — Take-Home Examination**
  **Time Allowed:** 90 Minutes
  **Marks:** 20 (This question counts for 20% of the final grade)

  **Question 1: The Verifier Case**

  Consider the following scenario. A truth-filtering intermediary, the **Verifier**, sits between a Speaker and a Hearer. The Verifier has a fixed inventory of sentences and reliable knowledge of their truth values. The protocol is public knowledge to both Speaker and Hearer:
  1.  If the Speaker's utterance is true, the Verifier transmits it unchanged.
  2.  If the Speaker's utterance is false, the Verifier suppresses it and transmits instead the strongest true sentence in the inventory that is logically weaker than what the Speaker said.

  The Speaker says: *"All of the guests have left."*
  In fact, only some guests have left. The Verifier suppresses the utterance and transmits: *"Some of the guests have left."*
  The Hearer, knowing the protocol, infers: *"Not all of the guests have left."*

  Note that this inference is calculable from the channel design; it is insensitive to the specific weaker formulation used (non-detachable); and it persists even if the Speaker later insists they meant "All" (uncancellable by the Speaker).

  **Answer the following three parts:**

  **(a)** Apply Grice's three standard diagnostics (calculability, non-detachability, cancellability) to the Hearer's inference that *not all guests have left*. For each diagnostic, state whether the inference satisfies it and why. Based *only* on this diagnostic test, would you classify the inference as a conversational implicature? (6 marks)

  **(b)** Consider a variant: Before transmission, the Speaker adds the instruction, *"Whatever sentence you receive, infer nothing beyond its literal content."* Assume the Verifier transmits this instruction truthfully. The Hearer receives "Some of the guests have left" alongside the instruction. Does this successfully cancel the inference? What does the fate of this attempted cancellation reveal about the nature of the cancellability test when the source of the inference is the channel rather than the Speaker? (6 marks)

  **(c)** Grice analyses non-natural meaning ($\text{meaning}_{nn}$) in terms of reflexive communicative intentions. Given your verdicts in (a) and (b), what follows for the Gricean programme? Must we posit a third category of meaning alongside "said" and "implicated"? Should we conclude that Generalised Conversational Implicatures (GCIs) are not truly speaker meaning? Or should we rule this case out as an implicature despite the diagnostics? **Note:** A response that simply asserts "There is no implicature because the Speaker lacked the intention" without addressing what this concedes about the diagnostics will not receive more than a B grade. You must identify the theoretical cost of your verdict. (8 marks)

  ***

  ### Model Answer

  The Hearer's inference that *not all guests have left* presents a limit case for Gricean theory, satisfying the standard diagnostics while violating the intentionalist foundation of speaker meaning.

  Regarding **(a)**, the inference satisfies **calculability**. The Hearer works it out via the premise: "The Verifier only downgrades false claims; I received 'Some'; therefore 'All' must have been false." It satisfies **non-detachability**. The inference arises from the semantic content "Some" in this context; swapping "Some" for "Not all" or "At least one" (assuming they trigger the same Verifier response) yields the same inference. The inference is not attached to the specific linguistic form but to the informational state produced. However, it fails **cancellability**. In the standard test, a speaker can say "Some, in fact all" to cancel the scalar implicature. Here, the Speaker *did* mean "All," but the inference persists because the Verifier, not the Speaker, generated the "Some." Based *solely* on diagnostics, one might classify this as an implicature, as it behaves like a GCI: it is default, context-driven, and logically distinct from what is said.

  In **(b)**, the variant exposes the fragility of cancellability when intentions are decoupled from output. The Speaker's instruction ("infer nothing") is transmitted truthfully. However, the inference persists. The Hearer knows the Speaker *wants* them to infer nothing, but the Hearer also knows the Verifier's mechanism guarantees that "Some" implies "Not All" within this system. The instruction fails to cancel because cancellability presupposes the Speaker controls the pragmatic generation of the inference. Here, the channel controls it. This shows that cancellability is not merely a logical feature of the proposition but a power relation: an inference is cancellable only if the source of the inference is the agent issuing the cancellation. Since the Verifier is the source, the Speaker's cancellation is inert.

  This leads to **(c)**: the implications for Grice's programme. If we define implicature strictly by the diagnostics, this counts as an implicature. But if we define it by Grice's analysis of $\text{meaning}_{nn}$, it is not, because the Speaker lacks the reflexive intention to induce this belief (they intended "All"). I argue we must rule this out as an implicature. Grice's project is to ground meaning in human agency and rational cooperation. An inference generated by a mechanical filter, even a rational one, is not *communicative* meaning; it is merely information transmission. To classify it as an implicature would sever the link between meaning and intention, reducing pragmatics to code-breaking.

  However, this verdict forces a significant concession. If this is not an implicature, then the three diagnostics are merely heuristic tools, not constitutive definitions. They are necessary but not sufficient conditions. This weakens the operational utility of Grice's framework, as we can no longer rely on the tests alone to identify implicatures; we must always peer behind the curtain to check for intentions. Alternatively, if we accept this *is* an implicature to save the diagnostics, we must concede that GCIs are not a species of speaker meaning but a hybrid category of "system meaning," undermining Grice's intentionalist reduction of communication. The stronger theoretical cost is accepting the latter, as it fragments the unity of the Gricean account. Thus, we must maintain that intention is constitutive, even if it renders the diagnostics imperfect.

  **Strongest Objection:** The opposing view argues that since the Hearer recovers the proposition via rational inference on the basis of the utterance, it functions exactly like an implicature in practice; insisting on intention makes the theory psychologically unrealistic for standard GCIs which are often automatic.

  ***

  ### Marking Scheme (20 Marks)

  **1. Application of Calculability and Non-detachability (4 marks)**
  *   **Full marks:** Correctly identifies that the inference is calculable via the Verifier protocol and non-detachable (insensitive to specific wording, dependent on the logical downgrade).
  *   **Common Error:** Confusing non-detachability with conventionality, or claiming the inference is not calculable because the Hearer doesn't know the Speaker's mind.

  **2. Analysis of Cancellability (Standard & Variant) (4 marks)**
  *   **Full marks:** Notes standard cancellation fails (Speaker insists on "All" but inference remains). In the variant, explains that the Speaker's instruction fails because the *mechanism* generates the inference, not the Speaker's pragmatic choice.
  *   **Common Error:** Claiming the variant instruction *would* cancel the inference because the Hearer trusts the Speaker, ignoring the public knowledge of the Verifier's truth-tracking design.

  **3. Verdict on Implicature Status (4 marks)**
  *   **Full marks:** Provides a clear Yes/No verdict. (Either is acceptable provided it is justified).
  *   **Common Error:** Hedging indefinitely without committing to a classification, or saying "It depends" without specifying the theoretical framework being prioritized.

  **4. Implications for Speaker Meaning/Intention (4 marks)**
  *   **Full marks:** Connects the verdict to Grice's $\text{meaning}_{nn}$. If "No implicature," argues intention is constitutive. If "Yes implicature," argues GCIs may be mechanism-based.
  *   **Common Error:** Discussing intention without linking it back to the definition of *meaning* or the specific Gricean programme.

  **5. Engagement with Counter-Argument/Theoretical Cost (4 marks)**
  *   **Full marks:** Explicitly states what their verdict forces them to concede (e.g., "Diagnostics are insufficient" OR "Intention is not necessary for meaning").
  *   **Common Error:** (The "B Grade" Trap) Dogmatically stating "No intention = no implicature" without acknowledging that this renders the diagnostics unreliable or circular.

  **Total:** 20 Marks

  **Distinguishing A from B Answers:**
  *   **B Answer:** Correctly applies the diagnostics and concludes "No implicature because the Speaker didn't intend it." It treats the lack of intention as a trump card without analysing *why* that matters for the diagnostics or what it implies about the utility of the tests.
  *   **A Answer:** Reaches the same verdict but explicitly argues that this case proves the diagnostics are *heuristic* rather than *constitutive*. It acknowledges that rejecting this as an implicature creates a gap between "what is pragmatically inferred" and "what is implicated," and discusses whether that gap is tolerable for Grice's theory.

  **Optional Further Move (Justifies full marks even if one point above is weak):**
  *   **The Status of the Cooperative Principle:** The candidate notes that the CP is a presumption about *speakers*, not *channels*. Since the Verifier is not a participant in the conversation but a mechanism, the CP does not apply to its output in the same way. Therefore, inferences drawn from the Verifier's design are not "conversational" implicatures but "systematic" inferences. This dissolves the tension by redefining the scope of the CP.
  *   **OR Circularity:** The candidate notes that if we use intentions to define implicature, but use implicature diagnostics to identify intentions, the theory risks circularity. This case breaks the circle by showing the diagnostics can fire without the intention, proving they must be independent tests.
