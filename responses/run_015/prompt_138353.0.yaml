  THACKERAY GENERAL HOSPITAL
  CLINICAL ETHICS COMMITTEE
  MEMORANDUM 2023-04

  **TO:** All Clinical Staff
  **FROM:** Clinical Ethics Committee
  **SUBJECT:** Protocol 7.1 (Analgesia and Elective Intervention)

  **PREAMBLE**
  Pursuant to the Thackeray Bequest (2020), conditional upon the adoption of an ethically rigorous decision procedure, the Committee hereby institutes the Lexical Threshold Protocol. This protocol operationalizes the prioritization of worst-state prevention over aggregate well-being maximization. All clinical decisions must adhere to the following clauses.

  **1. THE LEXICAL THRESHOLD**
  All suffering is quantified in Standard Hedonic Units (SHU). A Lexical Threshold (LTS) is established at 4.00 SHU per Episode. Any single Episode exceeding 4.00 SHU lexically dominates any finite quantity of milder suffering, pleasure, or relief. Interventions carrying a certain outcome above the LTS are prohibited, regardless of net utility gains or prevention of sub-threshold pain.

  **2. DE MINIMIS EVENTS**
  Per the Compliance Officer's directive, suffering measuring below 0.50 SHU constitutes a De Minimis Event. De Minimis Events carry zero ethical weight and do not accumulate toward the LTS. Consequently, indefinite regimens of 0.49 SHU discomfort are authorized to prevent any risk of exceeding the LTS, even if the aggregate discomfort significantly exceeds prohibited totals. Genuine analgesia may be withheld if substitution with De Minimis discomfort reduces probability of threshold crossing.

  **3. PROBABILISTIC FIAT**
  Any non-zero probability of an Episode exceeding 4.00 SHU renders an intervention prohibited, as lexical risk dominates certain benefit. To prevent operational paralysis, probabilities below 10^-6 are definitionally stipulated as zero. This stipulation is final, not subject to empirical revision, and applies retroactively to risk assessments conducted prior to this memorandum.

  **4. EPISODIC CARVING**
  An "Episode" is defined as a continuous duration of suffering not exceeding 24 hours. Suffering persisting beyond 24 hours is recalibrated as a new Episode, resetting the SHU counter. Accordingly, Procedure 88-B (seven-day recovery), previously banned under cumulative calculation, is re-permitted provided daily analgesia maintains suffering below 4.00 SHU per 24-hour segment.

  **5. DISSENTING OPINION**
  Dr. Ada Okonjo, Former Chair, records the following dissent: "This protocol abandons the minimization of total suffering in favor of boundary management. By ignoring sub-threshold pain and fragmenting episodes, we authorize greater aggregate suffering than the threshold-free model prohibits. We are optimizing for metrics, not welfare."

  **6. DISTRIBUTION**
  This memorandum is distributed to all staff. Acknowledgement of receipt is mandatory. Failure to adhere to Protocol 7.1 constitutes a disciplinary offense.

  **APPENDIX A: UNIT DEFINITION AND CALIBRATION**
  1 SHU is defined as one minute of mild tension headache. The LTS (4.00 SHU) was calibrated via committee vote to match the pre-theoretic intuition that one hour of extreme torture outweighs 1,000,000 minutes of mild headache. The exchange rate is fixed at this magnitude; scale-dependent variance is not accounted for in clinical settings. Commensurability is assumed for calibration purposes only.

  **APPENDIX B: WORKED EXAMPLE**
  **Case:** Elective Orthopedic Realignment.
  **Option A (Standard Analgesia):** 3.99 SHU episodic pain. **Status:** Authorized.
  **Option B (Reduced Analgesia):** 4.01 SHU episodic pain. **Status:** Prohibited.
  **Note:** Option B yields higher net utility and lower total suffering duration. However, the 0.02 SHU differential triggers lexical prohibition. Option B is permissible only if duration is segmented into eight 24-hour Episodes (see Clause 4). Staff must ensure no single segment exceeds 3.99 SHU.

  **END OF MEMORANDUM**
