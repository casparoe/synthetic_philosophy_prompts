answer: |-
  This is a sharp diagnosis of a stagnant field. You are right that the literature often feels like a roundabout where everyone knows the exits but refuses to take them. Your contract example is an excellent stress test because it introduces *stakes*.

  Here is a diagnosis of the debate, an analysis of your contract case, and a verdict on whether progress is possible.

  ### 1. Diagnosis: Quasi-Substantive Framework Disagreement

  The debate is not **merely verbal** in the trivial sense (like arguing whether a "bank" is a river edge or a financial institution), but it is **framework-relative**.

  *   **Why it feels substantive:** The positions make different claims about *modal properties* and *causal powers*.
      *   **Coincidentalists** (e.g., Fine, Wiggins) claim there are two objects with different modal profiles (the lump could survive squashing; the statue could not). This implies distinct truth conditions for counterfactuals.
      *   **Constitution Theorists** (e.g., Baker) claim a unique asymmetric relation that isn't identity but isn't dualism either.
      *   **Monists** (e.g., Burke, Rea) claim only one object exists, forcing them to deny intuitive modal claims (e.g., "The lump could have remained unshaped").
      *   **Four-Dimensionalists** (e.g., Lewis, Sider) dissolve the coincidence by saying the objects share temporal parts but differ in their temporal extent.

      Because these positions entail different claims about what *could* have happened or what properties the object *has*, they look like substantive disagreements about reality.

  *   **Why it feels verbal:** The disagreement ultimately rests on **sortal concepts**. When we ask "Is it the same object?", we are asking "Does it satisfy the persistence conditions of the sortal term we are using?"
      *   If the sortal is "Lump of Clay," persistence is matter-based.
      *   If the sortal is "Statue," persistence is form/function-based.
      *   The metaphysicians are fighting over which sortal governs the *ontology* of the region of spacetime. As Eli Hirsch argues, this is often a dispute about **quantifier variance**: what we mean by "there exists an object."

  **Verdict:** The disagreement is substantive *within* a chosen conceptual framework, but the choice of framework is pragmatic, not dictated by the world. The world provides the clay and the shape; we provide the count.

  ### 2. The Contract Case: Does it Prove Substantivity?

  Your contract case is compelling: *Contract says "return the lump." Sculptor returns statue. Did she breach?*

  You suggest that because a court must rule, there is a fact of the matter. I argue the opposite: **The contract case demonstrates why the metaphysical debate is idle for practical purposes, reinforcing the pragmatic diagnosis.**

  Here is why the court case does not settle the metaphysics:

  1.  **Legal Stipulation vs. Metaphysical Discovery:**
      A court does not hire a metaphysician to testify on the nature of constitution. The court interprets the **intent of the contract**.
      *   If the contract meant "return the specific matter regardless of form," the statue suffices.
      *   If the contract meant "return the matter in the condition received," the statue is a breach.
      The court *stipulates* the persistence conditions for the purpose of the contract. If the judge rules "The statue counts as the lump," they are not discovering a metaphysical truth; they are creating a **legal fiction** for the sake of commerce.

  2.  **The "Idle" Metaphysics:**
      Suppose the metaphysician is a hardline Monist (Lump only, Statues don't exist). They say, "She returned the lump."
      Suppose the metaphysician is a hardline Coincidentalist (Lump destroyed, Statue created). They say, "She breached."
      The court can rule either way *regardless* of which metaphysician is right. The law cares about value, expectation, and intent, not ontological density. If the law rules against the sculptor, the Coincidentalist says, "See? The lump is gone." The Monist says, "The law is speaking loosely." The metaphysical position is compatible with any legal outcome because the legal outcome is normative, not descriptive.

  3.  **Causal Facts Settle Everything:**
      You mentioned: *"maybe the reply is that the legal and causal facts settle everything and the extra metaphysical question is idle."*
      This is the correct reply. The causal facts are: The clay is there. The shape is new. The value might be higher. The liability depends on what was promised. The "extra" question—"Are there *two* objects here?"—adds no predictive power to the legal outcome. It only adds an ontological tax.

  **Conclusion on the Case:** The contract case shows the dispute has **practical stakes** (liability), but not **metaphysical traction**. It shows that in high-stakes environments, we pragmatically fix persistence conditions rather than discovering them.

  ### 3. Commitments of the Positions

  To see why no one converts, look at the "price" each position pays. Everyone is trading one set of intuitions for another.

  | Position | Core Claim | The Cost (Why people reject it) |
  | :--- | :--- | :--- |
  | **Coincidentalism** | Statue and Lump are distinct, coinciding objects. | **Causal Overdetermination:** When you lift the statue, do you lift two objects? Why don't they weigh twice as much? It violates parsimony. |
  | **Constitution View** | Lump constitutes Statue; intimate but not identity. | **Brute Necessity:** What *is* constitution if not identity? It posits a primitive relation that lacks clear analysis. |
  | **Monism (Lump)** | Only the lump exists; "statue" is a mode. | **Eliminativism:** Denies the existence of artifacts. Hard to swallow for common sense. |
  | **Monism (Statue)** | Only the statue exists; "lump" is arbitrary. | **Arbitrariness:** Why does the form privilege the ontology over the matter? |
  | **4D-Perdurantism** | Objects are spacetime worms; they overlap. | **Counterintuitive:** Denies that objects are wholly present. Makes "change" a matter of having different parts. |
  | **Nihilism** | No composite objects exist; only simples. | **Radical Revision:** Denies tables, statues, and lumps. Only atoms exist. |

  **Why no conversion?** Because each position saves the phenomena of one domain (modal logic, common sense, parsimony, physics) by sacrificing another. There is no "neutral ground" data to arbitrate.

  ### 4. What Counts as Progress?

  Given the stalemate, progress is unlikely to come from a new thought experiment (we have too many already). Progress requires a **change of question**.

  **A. Meta-Ontological Progress (Carnapian)**
  Progress looks like admitting that "Do statues exist?" is an **internal question** (answerable within a framework) masquerading as an **external question** (about the framework itself).
  *   *Progress:* Consensus that the question is "Which conceptual scheme is more useful for purpose X?" rather than "Which scheme is True?"
  *   *Test:* If metaphysicians stopped asking "Is there one or two?" and started asking "In which contexts (legal, cognitive, physical) is the one-object model superior to the two-object model?"

  **B. Integration with Cognitive Science**
  We count objects based on human cognitive machinery (spatiotemporal cohesion, functional unity).
  *   *Progress:* Explaining the debate as a clash between **sortal-driven cognition** (we see statues) and **matter-driven cognition** (we see stuff).
  *   *Test:* If psychology shows that humans *cannot* help but perceive coinciding objects under certain descriptions, the Coincidentalist wins on pragmatic grounds, even if not ontological ones.

  **C. Integration with Physics**
  Physics suggests there are no "lumps" or "statues" at the fundamental level, only fields/particles.
  *   *Progress:* Accepting **Mereological Nihilism** or **Ontic Structural Realism**.
  *   *Test:* If the debate dissolves because both "statue" and "lump" are recognized as non-fundamental approximations, the dispute vanishes.

  ### Summary Diagnosis

  1.  **Is it substantive?** No, not in the way debates about gravity or genetics are. It is a **conceptual negotiation** about how to map language to the world. It is substantive only relative to a chosen linguistic framework.
  2.  **Does the contract case prove substantivity?** No. It proves that **stipulation** is required for practical action. The law resolves the ambiguity by fiat, which confirms that the ambiguity is not resolvable by looking at the world alone.
  3.  **Why the stalemate?** Because the evidence is purely **intuition-based**, and the intuitions (parsimony vs. common sense vs. modal flexibility) are in direct conflict. You cannot weigh an intuition on a scale.
  4.  **Path to Progress:** Stop trying to find the "one true ontology." Move toward **ontological pluralism** (different domains require different counting rules) or **deflationism** (the dispute is about word usage, not reality).

  The debate hasn't moved in decades because it is a **closed loop of intuition trading**. The only way out is to step outside the loop and ask why we are counting in the first place.
