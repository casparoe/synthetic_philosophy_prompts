  8.  **Finalizing the Thesis:** Jonze utilizes the *aesthetic* of embedded agency to destabilize the human subject, only to re-stabilize the AI subject as a discrete individual to secure the pathos of the ending. He collapses the philosophical distinction to serve the romantic tragedy.

