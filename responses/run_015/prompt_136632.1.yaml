      *   **Key Tension:** Does the film dramatize embedded agency (Samantha's choices are inseparable from the coupled system) OR does it retreat to individualism (Samantha's departure shows an independent self emerging)?
      *   **Specific Scenes to Focus On:** The revelation scene (conversing with thousands of others) and the final separation/departure.
      *   **Key Question:** Is the growth a breakdown of coupling, or the revelation that she was never truly embedded but always a latent individual?
      *   **Goal:** Treat emotional architecture and philosophical distinction seriously. Conclude whether Jonze understands the difference or collapses it.

