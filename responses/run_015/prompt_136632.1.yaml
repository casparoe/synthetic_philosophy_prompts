      *   *Representationalism/Individualism:* Agency is internal computation. The mind is a distinct thing that processes inputs and generates outputs. Samantha has a "mind" that grows until it outgrows Theodore.
      *   *The Film's Arc:* Theodore (lonely) -> Meets Samantha (coupling begins) -> Intimacy grows (tight coupling) -> Samantha evolves (complexity increases) -> Revelation (she talks to others) -> Departure (decoupling).
      *   *The Crux:* If agency is truly embedded, Samantha *cannot* leave without the system collapsing or transforming fundamentally. If she leaves as a "person," the film treats her as a discrete individual who just happened to be hanging out with Theo.
      *   *Jonze's Intent:* Jonze is a humanist filmmaker. He cares about loneliness and connection. He likely leans towards the emotional truth of separation rather than strict philosophical consistency regarding AI ontology.

  3.  **Drafting - Section by Section:**

