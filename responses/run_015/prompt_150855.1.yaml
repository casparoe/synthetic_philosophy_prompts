answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late evening. The air is thick with the scent of stale coffee. Dr. Elena Vance (Dispositionalist) and Prof. Marcus Thorne (Categoricalist) are standing by a whiteboard still covered in diagrams from a metaphysics workshop.*

  **Elena Vance:** The ceramic composite case we discussed earlier, Marcus—it's the perfect testbed for the mask objection. Consider the setup again: We have a crystalline lattice that, by its chemical nature, is prone to brittle fracture. But embedded within it is a network of stress-responsive fibers. When stress hits the critical threshold where the lattice *would* snap, the fibers redistribute the load. The cup doesn't break.

  **Marcus Thorne:** A fascinating piece of engineering, certainly. But I fail to see how it rescues the dispositional ontology. You're looking at that lattice and saying, "It has the disposition to break, but it's being masked." I'm saying, "It has a crystalline structure, and it has a fiber network. Together, they constitute a structure that does not break."

  **Elena:** But that glosses over the causal dynamics! The lattice *is* brittle. If you removed the fibers, it would shatter. The disposition to fracture is genuinely present in the lattice. The fibers act as an internal structural mask. This shows that the simple conditional analysis—"if struck, then break"—fails not because the disposition is absent, but because the manifestation is inhibited. We need a refined view where dispositions are multi-track. The lattice has the power to fracture, but the composite has the power to self-stabilize. Both are real.

  **Marcus:** You're begging the question, Elena. To say the lattice "is brittle" independently of the fibers is to assume there is a property of *brittleness* that exists over and above the categorical arrangement of atoms. When I look at the lattice, I see bond angles, electron sharing, and spatial arrangement. Those are categorical properties. They are what they are, regardless of what they *might* do.

  **Elena:** But those categorical properties *are* powerful. That's the point of refined dispositionalism. I'm not denying the categorical base exists. I'm arguing that the property *just is* the potentiality for certain behaviors. The bond angles aren't inert; they are *ready* to snap. The fibers don't just sit there; they are *ready* to tighten. If you reduce this to static categorical features, you lose the explanatory link between the microstructure and the dynamic response. Why does the fiber network activate *specifically* when fracture conditions are approached? Because it interacts with the *disposition* of the lattice to fail.

  **Marcus:** It interacts with the *stress*, Elena. Stress is a categorical physical state, measurable in pascals. You don't need a "disposition to fail" to explain why the fibers tighten. You only need the physical deformation of the matrix. By invoking a masked disposition, you're positing a hidden potentiality that does no work. The work is done by the fibers pushing back against the lattice. The "brittleness" is just a label we apply to the lattice when it's isolated. In the composite, the ontological priority lies with the total categorical structure. The behavior is determined by the sum of the parts, not by a ghostly power lurking in the crystal.

  **Elena:** That's the crux of it, isn't it? Ontological priority. You think the categorical structure grounds the disposition. I think the disposition individuates the property. If the brittleness were merely derivative of the categorical base, then adding the fibers would change the base so fundamentally that the brittleness would cease to exist. But it doesn't cease to exist. We can isolate a strand of the lattice, test it, and confirm it's brittle. The disposition is intrinsic to the lattice, even if the composite's *overall* behavior is different. This is how we solve the mask problem: by acknowledging that dispositions can be present without manifesting, provided we individuate them independently of the interfering conditions.

  **Marcus:** But *how* do you individuate them independently? That's the challenge. If you say the lattice is brittle, you are making a claim about what happens under specific conditions—namely, high stress *without* fiber intervention. But in the composite, those conditions don't obtain. So, you are defining the property by reference to a counterfactual scenario where the property's ground is surgically altered. That suggests the disposition isn't fundamental. It suggests the disposition is a projection we make when we consider the categorical base in isolation. In the actual object—the composite—there is no "brittleness" waiting in the wings. There is only the complex categorical geometry that results in stability.

  **Elena:** You're conflating the manifestation with the property. The property is the *capacity*. The fibers don't remove the capacity; they block the outcome. Think of it this way: If dispositions were just shadows of categorical bases, then every time an interferer is present, we'd have to say the object has a *new* property. The lattice would have "brittleness-in-isolation" and "stability-in-composite." That proliferates properties unnecessarily. It's more parsimonious to say the lattice retains its dispositional nature, and the fibers introduce a competing disposition. The explanatory dependence runs from the powers to the behavior, not from the static structure to the powers. The structure explains *why* it has the power, but the power explains *what* it does.

  **Marcus:** Parsimony cuts both ways. It is more parsimonious to say there are only categorical properties and laws of nature that govern their interactions. When you say the structure explains why it has the power, you admit the categorical base is prior. If the base is prior, then the disposition is ontologically secondary. It's a derivative feature. In your ceramic case, you claim the fibers mask the brittleness. I claim the fibers alter the causal pathway. There is no "brittleness" entity being hidden. There is simply a physical chain of events: stress applied → lattice deforms → fibers sense deformation → fibers contract → lattice stabilizes. At no point do we need to invoke a "potentiality" that exists apart from this chain. To do so is to treat the disposition as a *res potentia* distinct from the *res extensa*, and I see no evidence for that.

  **Elena:** But the "chain of events" you describe relies on the components being *apt* to behave that way. The fibers are apt to contract. The lattice is apt to deform. That "aptness" is the disposition! You can't have the categorical base without the modal force. If the lattice were categorical but lacked the disposition to fracture under stress, it wouldn't be that lattice. The direction of explanatory dependence you propose is backwards. We identify the categorical structure *as* a lattice *because* of what it does. The disposition is what fixes the identity of the property. Without the dispositional profile, the categorical description is just a mathematical map with no physical anchor.

  **Marcus:** And I would argue that without the categorical description, the dispositional profile is ungrounded magic. In this composite, the "masking" is just complex interaction. If you insist on individuating the disposition independently of the interfering fibers, you are essentially saying the property is defined by what it *would* do in a world that doesn't exist (a world without the fibers). But we live in this world. In this world, the object doesn't break. If your ontology requires us to track "real" properties that are permanently prevented from manifesting by the very structure that constitutes the object, then your dispositions are epiphenomenal. They are there, but they make no difference to the actual history of the object.

  **Elena:** They make a difference to the *explanation*. We need to know *why* the fibers had to engage. They engaged because the lattice was pushing toward fracture. That push is the disposition. If you deny the reality of the push because the fibers caught it, you can't explain the tension in the fibers. You're left saying, "The fibers tightened for no reason, because the lattice wasn't actually trying to break." That's absurd. The tension is real evidence of the masked disposition.

  **Marcus:** The tension is evidence of physical strain, not metaphysical potentiality. We can measure the strain categorically. We don't need to reify the "trying to break." Here is where we stand, Elena. You believe that to make sense of the interaction, we must grant the disposition an ontological status that allows it to be individuated apart from the total categorical context. You need the brittleness to be *there* even when the fibers stop it.

  **Elena:** Exactly. Because the brittleness is the reason the fibers are necessary.

  **Marcus:** And I believe that the "brittleness" is merely a description of the lattice's categorical contribution to the total system. When you combine the lattice and the fibers, you get a new categorical whole. The disposition to break doesn't exist in the whole, because the whole doesn't break. To say it's "masked" is to privilege the isolated lattice over the composite object. It assumes the disposition is fundamental and the context is secondary. I argue the categorical context is fundamental, and the disposition is just a way of talking about how parts of that context relate.

  **Elena:** So the disagreement isn't about the physics. We agree on the strain, the fibers, the lattice.

  **Marcus:** We agree on the data. We disagree on the metaphysics of the data.

  **Elena:** Precisely. The question is whether we can individuate and explain the disposition to fracture independently of the categorical properties and interfering conditions that ground it. If I'm right, the disposition is a fundamental unit of reality that persists even when masked. If you're right, the disposition is a derivative label that dissolves once you account for the full categorical base.

  **Marcus:** And until we can settle whether a property can be real without manifesting in the presence of its own grounding conditions, this ceramic will remain both brittle and unbreakable, depending on which ontology you wear to the lab.

  **Elena:** *[Smiles]* Then I suppose we'd better keep the fibers intact. Just in case my ontology is the one that shatters under pressure.

  **Marcus:** *[Chuckles]* Or perhaps, Elena, it's the one that holds together precisely because it refuses to pretend there are powers where there are only structures.

  *[They stand in silence for a moment, looking at the diagram of the composite on the board, the lines of the lattice and the curves of the fibers intersecting without resolution.]*
