prompt: |-
  I am currently enrolled in a graduate seminar on philosophy of archaeology and social ontology, and I have become puzzled by a persistent asymmetry in how our discipline institutionally frames rapid societal transformation. In archaeological funding proposals, heritage-site assessments, and peer-reviewed journal guidelines, the sharp decline of palace economies, cuneiform literacy, and long-distance exchange networks in the eastern Mediterranean around the twelfth century BCE, together with the cessation of moai construction and the restructuring of social hierarchy on Rapa Nui, are routinely categorized as collapse events—phenomena treated as failures that require causal explanation. By contrast, the Classic Maya lowland abandonment of monumental architecture, the dissolution of divine kingship, and the fragmentation of exchange networks are typically labeled political reorganization, demographic realignment, or systemic transformation, with explicit editorial norms in several venues discouraging the term collapse for this case, despite the structural parallels in centralization loss, elite literacy disappearance, and network contraction.

  What philosophical commitments about societal identity over time, the criteria for institutional failure, and the boundary between descriptive and normative evaluation does this differential labeling practice presuppose? Must it assume an essentialist ontology in which a society can die when its defining institutions vanish, or can a functionalist or relational account explain the asymmetry by treating Bronze Age and Rapa Nui societies as constituted by specific hierarchical functions whose disappearance amounts to dissolution, while treating Maya society as constituted by broader cultural relations that persist through institutional change? Is the practice compatible with the anthropological claim that societies never truly fail but merely change form, or does it implicitly rely on a teleological benchmark of socio-political complexity? Furthermore, if the underlying framework were replaced by one that treated all three cases uniformly as non-normative systemic change—without any presumption of failure—what specific revisions would be required in archaeological reporting norms, grant-evaluation rubrics, and museum narrative design?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** Graduate seminar in philosophy of archaeology and social ontology.
      *   **Core Observation:** There is an asymmetry in labeling societal transformations.
          *   *Labeled "Collapse":* Late Bronze Age (Eastern Mediterranean), Rapa Nui (Moai cessation/hierarchy restructuring).
          *   *Labeled "Reorganization/Transformation":* Classic Maya (Abandonment of monuments/divine kingship).
      *   **Structural Parallels:** All involve loss of centralization, elite literacy disappearance, network contraction.
      *   **Questions to Address:**
          1.  What philosophical commitments (societal identity, institutional failure, descriptive vs. normative) does this asymmetry presuppose?
          2.  Does it assume an essentialist ontology (society dies when institutions vanish) vs. functionalist/relational account (Bronze/Rapa Nui = hierarchical functions; Maya = broader cultural relations)?
          3.  Is it compatible with the anthropological claim (societies never fail, just change) or does it rely on a teleological benchmark of complexity?
          4.  If replaced by a uniform "non-normative systemic change" framework, what specific revisions are needed in reporting norms, grant rubrics, and museum narratives?

  2.  **Initial Analysis & Theoretical Framing:**

      *   *The "Collapse" Discourse:* This is a classic debate in archaeology (Tainter, Diamond, Yoffee, McAnany & Yoffee). The term "collapse" is loaded. It implies a negative value judgment (bad thing happened) and often a teleological view (societies *should* maintain complexity).
      *   *The Maya Exception:* Why is Maya treated differently? Partly due to continuity of Maya *people* and language vs. the perceived discontinuity of Mycenaean Greeks or Rapa Nui polities. Also, post-processual archaeology has heavily influenced Maya studies, emphasizing agency and resilience over deterministic collapse.
      *   *Social Ontology:* How do we define a "society"? Is it the state apparatus (essentialist/structuralist) or the web of social relations (relational/processual)?
      *   *Normativity:* "Collapse" is a normative term. "Transformation" is descriptive. The asymmetry suggests a bias in how we value certain types of complexity (monumental, state-level) over others (heterarchical, kinship-based).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the observation (it's a known issue in the field, often discussed by scholars like Norman Yoffee, Patricia McAnany, and Guy Middleton). State the thesis: The asymmetry reveals a tension between *state-centric* and *people-centric* ontologies, underpinned by implicit normative teleologies regarding complexity.

      *   **1. Philosophical Commitments (Identity, Failure, Normativity):**
          *   *Societal Identity:* The "Collapse" label assumes identity is tied to *political superstructure* (palaces, kings). If the palace falls, the society "dies." The "Transformation" label (Maya) assumes identity is tied to *cultural continuity* (language, kinship, daily practice).
          *   *Institutional Failure:* "Collapse" presumes the *goal* of a society is stability/complexity. "Transformation" presumes the goal is adaptation.
          *   *Descriptive vs. Normative:* "Collapse" is inherently normative (it's a disaster). "Transformation" attempts neutrality. The asymmetry shows we haven't successfully neutralized the term for all cases.

      *   **2. Ontological Accounts (Essentialist vs. Functionalist/Relational):**
          *   *Essentialist:* Yes, "Collapse" implies the *essence* of the Bronze Age society was the Palace. No Palace = No Society.
          *   *Functionalist/Relational:* This explains the asymmetry *if* we assume different constitutive functions. For Rapa Nui/Bronze Age, the function *was* hierarchy. For Maya, the function was cultural reproduction.
          *   *Critique:* This is inconsistent. Why is hierarchy essential for one but not the other? It reveals a colonial/modernist bias where some societies are seen as "fragile states" and others as "enduring cultures."

      *   **3. Anthropological Claim vs. Teleological Benchmark:**
          *   *Anthropological Claim:* "Societies never fail." This aligns with "Transformation."
          *   *Teleology:* "Collapse" relies on a ladder of progress (Complexity = Good). Losing rungs = Collapse.
          *   *Incompatibility:* The current asymmetry is incompatible with a consistent anthropological ontology. It cherry-picks teleology. It treats the Maya as "survivors" (romanticized indigeneity?) and Bronze Age/Rapa Nui as "warnings" (Malthusian cautionary tales?).

      *   **4. Practical Revisions (Reporting, Grants, Museums):**
          *   *Reporting Norms:* Ban "collapse" as a causal category. Use "sociopolitical restructuring." Require definition of "society" (elite vs. commoner).
          *   *Grant Rubrics:* Shift from "causes of failure" to "dynamics of resilience and adaptation." Fund studies on non-elite continuity, not just elite discontinuity.
          *   *Museum Narratives:* Move away from "Mystery of the Disappearing People." Focus on "Where did they go?" (They are still here). Decenter monumental architecture as the metric of success.

      *   **Conclusion:** Summarize. The asymmetry isn't just semantic; it's ontological and political. Moving to a uniform framework requires decoupling "society" from "state."

  4.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Tone Check:* Needs to be academic, rigorous, suitable for a grad seminar context. Use terms like "teleological," "ontological commitment," "normative valuation."
      *   *Specific Scholars:* Mentioning Tainter (Collapse of Complex Societies), Diamond (popularizer of collapse), Yoffee/McAnany (critics of collapse), and Middleton (questioning the concept) adds credibility.
      *   *Nuance on Maya:* Be careful not to say Maya studies are perfect. They have their own issues, but the *terminological* shift is distinct.
      *   *Nuance on Rapa Nui:* Recent scholarship (Hunt & Lipo) challenges the "ecocide/collapse" narrative on Rapa Nui too. Acknowledge this tension—the user's prompt notes the *institutional framing* still often uses collapse, even if scholarship is shifting.
      *   *Addressing the "Why":* Why the asymmetry? Partly historical trajectory of the disciplines. Near Eastern archaeology has older roots in biblical/imperial history (rise and fall of kingdoms). Maya archaeology was influenced more by ethnography and continuity.

  5.  **Final Review against User Prompt:**

      *   Did I answer the philosophical commitments? Yes.
      *   Did I address Essentialist vs. Functionalist? Yes.
      *   Did I address Anthropological claim vs. Teleology? Yes.
      *   Did I provide specific revisions for norms/grants/museums? Yes.

  6.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on this structure.)
answer: |-
  This is a profoundly astute observation that cuts to the core of contemporary debates in archaeological theory, specifically regarding the ontology of the "social" and the ethics of historical narration. The asymmetry you identify is not merely semantic inconsistency; it reflects deep-seated, often unexamined philosophical commitments regarding what constitutes a "society," what counts as "success," and who holds the authority to define continuity.

  Here is an analysis of the philosophical presuppositions underlying this differential labeling, followed by the practical implications of adopting a uniform framework of non-normative systemic change.

  ### 1. Philosophical Commitments: Identity, Failure, and Normativity

  The differential labeling of Late Bronze Age/Rapa Nui events as "collapse" versus Maya events as "transformation" presupposes conflicting ontologies of **societal identity over time**.

  *   **State-Centric vs. People-Centric Ontology:**
      *   **The "Collapse" Label (Bronze Age/Rapa Nui):** This framing relies on a *structuralist* or *institutionalist* ontology. It posits that the identity of the society is co-extensive with its political superstructure (the palace, the state apparatus, the monumental economy). When the institution vanishes, the society is deemed to have ceased existing. This treats the "state" as the *essence* of the society.
      *   **The "Transformation" Label (Maya):** This framing relies on a *relational* or *practice-based* ontology. It posits that societal identity resides in the continuity of daily practices, kinship networks, language, and cosmology, which can persist independently of the state. Here, the "people" constitute the society, not the polity.
  *   **Criteria for Institutional Failure:**
      *   The use of "collapse" implies a **normative evaluation** of complexity. It presupposes that the maintenance of high-energy complexity (monuments, literacy, long-distance trade) is the *telos* (goal) of the social system. Therefore, a reduction in complexity is a "failure" or a "pathology" requiring diagnosis (e.g., resource depletion, invasion).
      *   By contrast, "reorganization" treats complexity as contingent. It presupposes that simplification can be an adaptive strategy rather than a failure. The asymmetry suggests that for the Bronze Age and Rapa Nui, complexity is viewed as the *natural state* that was lost, whereas for the Maya, complexity is viewed as a *phase* that was shed.
  *   **Descriptive vs. Normative Boundary:**
      *   The term "collapse" is inherently normative; it carries connotations of catastrophe, tragedy, and warning. "Transformation" attempts to be descriptive. The persistence of "collapse" in Near Eastern and Rapa Nui studies suggests an implicit commitment to the idea that these societies *ought* to have persisted in their complex form, whereas the Maya are granted the ontological right to change without being deemed "failed."

  ### 2. Essentialist vs. Functionalist/Relational Accounts

  You ask whether this requires an essentialist ontology or if a functionalist account can explain the asymmetry.

  *   **The Essentialist Trap:**
      *   Current practice largely assumes an **essentialist ontology** for the Bronze Age and Rapa Nui. It treats "Mycenaean Society" or "Rapa Nui Polity" as natural kinds defined by specific traits (palaces, moai). If those traits vanish, the kind ceases to exist.
      *   However, applying a **functionalist account** to explain the asymmetry (i.e., "Bronze Age society *was* its hierarchy, but Maya society *was* its culture") is philosophically unstable. It risks **ontological imperialism**. It implies that archaeologists have the authority to decide *ex post facto* what constituted the "essence" of a past society. Why was the essence of Rapa Nui the *moai* rather than the clans? Why was the essence of the Mycenaeans the *palace* rather than the *oikos*?
      *   This selectivity often mirrors colonial or modernist biases. Societies that left written records interpreted by Western traditions (like the Maya, via ethnography) are often granted more agency and continuity. Societies known primarily through their ruins (Mycenae) or interpreted through Malthusian lenses (Rapa Nui) are reified as "systems" that broke.

  *   **The Relational Alternative:**
      *   A consistent relational ontology would argue that *all* societies are constituted by networks of relations. In this view, the asymmetry is unjustified. If Maya commoners continued farming and speaking Mayan, Mycenaean commoners likely continued farming and speaking Greek (Linear B was an elite technology; its loss did not erase the population). To label one "collapse" and the other "transformation" is to privilege *elite* relations over *commoner* relations in the former cases, but not the latter.

  ### 3. Anthropological Continuity vs. Teleological Complexity

  Is the practice compatible with the claim that societies never fail? **No.**

  *   **The Teleological Benchmark:**
      *   The "collapse" narrative relies on a **unilinear teleology of complexity**. It assumes societies move toward greater integration and that moving backward is "collapse." This is a Spenserian hangover in archaeological thought.
      *   The Maya exception proves the rule: Maya studies have been heavily influenced by post-processualism and ethnography, which emphasize resilience and indigenous continuity. Near Eastern and Rapa Nui studies have been more susceptible to systems theory (Tainter) and environmental determinism (Diamond), which prioritize the "system" over the "subject."
  *   **The Anthropological Claim:**
      *   If we accept the anthropological axiom that "societies never fail, they only change," then "collapse" is a category error. It describes the failure of a *specific political ideology* (divine kingship, palace redistribution), not the failure of a *society*.
      *   The current asymmetry implicitly relies on a **hierarchy of being**. It treats Bronze Age and Rapa Nui populations as subjects of ecological/political forces (who "collapsed"), while treating the Maya as historical agents (who "transformed").

  ### 4. Revisions for a Uniform Non-Normative Framework

  If the discipline were to replace the "collapse/transformation" asymmetry with a uniform framework of **non-normative systemic change**, the following specific revisions would be required:

  #### A. Archaeological Reporting Norms (Journals & Publications)
  1.  **Terminological Ban:** Editorial guidelines should discourage the use of "collapse" as a causal explanation. It should be treated as a folk category, not an analytical one. Preferred terms: "Sociopolitical Restructuring," "Decentralization," "Discontinuity of Elite Practice."
  2.  **Scale Specification:** Authors must specify *whose* society is changing. Reports must distinguish between "Elite Institutional Discontinuity" (e.g., end of kingship) and "Population Continuity" (e.g., persistence of settlement patterns). A paper cannot claim "societal collapse" without demonstrating demographic extinction, which is rarely the case.
  3.  **Teleology Check:** Method sections should require a statement on how "complexity" is defined and why its reduction is being framed as a negative outcome rather than an adaptive simplification.

  #### B. Grant-Evaluation Rubrics (Funding Agencies)
  1.  **From "Causes of Failure" to "Dynamics of Resilience":** Funding calls should shift from "What caused the Bronze Age Collapse?" to "How did Eastern Mediterranean communities reorganize after the cessation of palace economies?" This shifts the ontological focus from the dead institution to the living population.
  2.  **Interdisciplinary Continuity:** Grants should prioritize projects that link archaeological strata with bio-archaeological and genetic data to trace population continuity. If the people remain, the "society" (in a relational sense) has not collapsed.
  3.  **Comparative Ontologies:** Proposals comparing these cases would be evaluated on their ability to apply a consistent definition of "society" across cases, penalizing those that apply state-centric definitions to one and culture-centric definitions to another.

  #### C. Museum Narrative Design (Public Engagement)
  1.  **Decentering the Monument:** Exhibits should stop using the cessation of monumental construction as the primary marker of "the end." Instead of "The Mystery of the Disappearing Maya/Mycenaeans," narratives should read "The End of Kings, The Continuation of People."
  2.  **Indigenous/Descendant Voice:** For the Maya, this is already happening. For the Bronze Age (modern Greeks/Turks) and Rapa Nui (Rapa Nui people), museum narratives must integrate descendant community perspectives on continuity. If Rapa Nui people assert they never collapsed, the museum cannot state they did.
  3.  **Reframing "Dark Ages":** Periods following decentralization (e.g., Greek Dark Ages, Post-Classic Maya) should be presented as periods of innovation and localization, not as "declines" from a golden age. The narrative arc must move from *Rise-Fall* to *Integration-Fragmentation-Adaptation*.

  ### Conclusion

  The asymmetry you have identified reveals that archaeology is still struggling to decouple **social ontology** from **political topology**. We treat societies as "states" when it suits a narrative of cautionary tragedy (Bronze Age, Rapa Nui) and as "cultures" when it suits a narrative of resilience (Maya).

  Adopting a uniform framework requires a philosophical commitment to **processual relationalism**: the view that a society is not a thing that can die, but a flowing network of relations that transforms. This demands we stop asking "Why did they fail?" and start asking "How did they change, who benefited from the change, and whose voices are silenced when we call it a collapse?"
