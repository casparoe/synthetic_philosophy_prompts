  7.  **Final Polish:** Check names and terms. Cummins (CR), Millikan/Neander (ET/SE). Mention "Selected Effects." Ensure the distinction between "trait token" and "trait type" is clear where necessary. (Self-Correction: Keep it accessible, don't get too bogged down in token/type metaphysics unless necessary for the vestigial point).

