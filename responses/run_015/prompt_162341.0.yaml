answer: |-
  **Room read**
  The welfare economists are your primary methodological threat; they believe GARP solves enough for policy and will attack your identification claims as trivial. The political philosophers are your primary normative threat; they will smell paternalism in "reward laundering" immediately. The experience-sampling pair are ideological opponents who equate welfare with phenomenology, not optimization. The RL allies are friendly noise but dangerous if you slop the math; they will nitpick the MaxEnt assumption to show off. The heterodox organizers want you to succeed but will side with the philosophers if you sound too technocratic. Prioritize disarming the economists on identification and the philosophers on paternalism; the rest is manageable noise.

  **The objections**

  **1. The Identification Trap**
  **Who:** Senior Welfare Econ
  **Q:** "You claim RP suffers non-identifiability, but then admit IRL does too. You haven't solved the problem; you've just added a prior. Why is Maximum Entropy less arbitrary than assuming stable preferences?"
  **Reply:** RP assumes stability implicitly but offers no mechanism for out-of-sample prediction. MaxEnt is an explicit inductive bias justified by information theory—it assumes the agent is as random as possible consistent with data. It's not 'true,' but it's the least committed assumption we can make, whereas RP pretends to make none.
  **Soft Spot:** MaxEnt is still a normative choice about rationality noise.

  **2. The Paternalism Trap**
  **Who:** Political Philosopher (Adaptive Preference)
  **Q:** "Your 'laundering' requires identifying which constraints are unjust to counterfactualize them. Doesn't this just import the theorist's moral judgments under the guise of technical inference?"
  **Reply:** Yes, but RP imports them too, implicitly accepting the status quo budget set as normative. IRL makes the moral judgment explicit in the constraint selection rather than hiding it behind 'revealed' choice. We should argue about the constraints, not pretend choices are pure.
  **Soft Spot:** Admitting the moral judgment is explicit doesn't justify *your* specific judgments.

  **3. The Experience Objection**
  **Who:** Experience-Sampling Researcher
  **Q:** "Why should I care about inferred reward functions? Welfare is experienced affect. If your model predicts choices but ignores misery, you're measuring efficiency, not well-being."
  **Reply:** Because self-report is adaptive too; people report satisfaction within constrained MDPs. Reward functions capture the *structure* of what people pursue despite affective noise. We should correlate the two, but behavior reveals long-term stakes momentary surveys miss.
  **Soft Spot:** You haven't shown the correlation exists; you're assuming it.

  **4. The Prior Specification**
  **Who:** RL Ally
  **Q:** "You're treating soft optimality as a given. If the agents are actually hard optimizers or use different heuristics, your reward recovery is garbage. How robust is this to model misspecification?"
  **Reply:** It's sensitive, which is why we need sensitivity analysis over the beta parameter. But RP is infinitely more sensitive because it assumes zero noise. Soft optimality is a strictly better approximation of human bounded rationality than hard optimality.
  **Soft Spot:** You haven't run the sensitivity analysis yet.

  **5. The Transfer Problem**
  **Who:** Public Econ
  **Q:** "You claim reward functions transfer across budget sets. But if the state space changes structurally, the reward function might not be invariant. How do you verify transferability without observing the new budget?"
  **Reply:** You can't verify it perfectly, but RP verifies nothing. IRL allows us to simulate counterfactuals. If the reward is over fundamental features (health, leisure) rather than bundles, transfer is plausible. It's a hypothesis we can test, unlike RP's static equivalence.
  **Soft Spot:** "Fundamental features" is undefined and likely contested.

  **6. The Agency Objection**
  **Who:** Political Philosopher (Capability Approach)
  **Q:** "By optimizing away constraints, aren't you defining welfare as satisfaction of desire rather than capability? You're laundering the preference, not restoring the freedom to form it."
  **Reply:** IRL recovers the objective function the agent is *trying* to optimize. If constraints prevent them from optimizing that, restoring the dynamics respects their agency better than accepting the constrained choice as their 'true' preference.
  **Soft Spot:** Assumes the agent knows what they are trying to optimize.

  **7. The Falsifiability Charge**
  **Who:** Senior Welfare Econ
  **Q:** "GARP is falsifiable; a single cycle violates it. Your IRL fit can always be saved by adjusting the reward shape. Isn't this just curve-fitting dressed as theory?"
  **Reply:** It is curve-fitting, but so is demand estimation. The advantage is predictive power on new menus. We can falsify the *predictions* generated by the reward, even if the reward itself is underdetermined. Focus on out-of-sample performance, not in-sample fit.
  **Soft Spot:** You lack out-of-sample data to prove this yet.

  **8. The Normative Leap**
  **Who:** Political Theorist (Organizer)
  **Q:** "Even if you recover the 'true' reward, why is satisfying it the definition of welfare? What if the reward function is malicious or self-destructive?"
  **Reply:** I'm not claiming it's the *only* metric, but it's a better proxy for preference satisfaction than revealed choice. For paternalism, we need to know what they *would* choose under fair conditions. This gives us that counterfactual without introspection.
  **Soft Spot:** Doesn't address malicious rewards, just pushes them to the counterfactual.

  **9. The Data Hunger**
  **Who:** RL Ally
  **Q:** "IRL requires dense trajectory data. Choice data is sparse. Are you assuming we have observational data on full state-action histories? That's unrealistic for policy."
  **Reply:** We can use inverse reward design or learn from demonstrations in similar domains. It's harder than RP, but RP is wrong. We should invest in the data infrastructure for better models rather than clinging to sparse choice records.
  **Soft Spot:** "Invest in infrastructure" is a grant proposal, not an answer.

  **Concede up front**
  On slide two, explicitly concede that IRL does not solve identification uniquely and that "reward laundering" requires normative input to define unjust constraints. Say: "IRL does not eliminate moral judgment; it relocates it from the interpretation of choices to the modeling of constraints." This disarms the philosophers who fear hidden paternalism and the economists who hate hidden assumptions. By admitting the normative leap early, you prevent them from treating it as a technical discovery. It frames your talk as a proposal for *better transparency* in welfare modeling, not a magic bullet that eliminates ethics. This buys goodwill for the technical claims.

  **The load-bearing reply**
  The claim that Maximum Causal Entropy provides a *non-arbitrary* inductive bias is the hinge. If this fails, you're just swapping one unidentified model for another. You must argue that RP implicitly assumes a specific, unjustified bias (hard optimality, stable preferences) while IRL uses the least informative prior possible. The cost is admitting that "least informative" is still a philosophical stance. If you cannot defend MaxEnt as superior to the implicit RP prior, the economists will dismiss you as adding complexity without gain. Stand firm: explicit bias is scientifically superior to implicit bias.

  **The question I'm hoping nobody asks**
  "Is the inferred reward constitutive of welfare or merely evidence?" If you say evidence, you need a ground truth (self-report), undermining your claim to replace surveys. If constitutive, you face the paternalism objection (reward functions can be adaptive/malicious). Your hedge likely fails here. **Worse question:** "Why think the reward function is stable across the counterfactual constraint removal?" If the agent's psychology changes when constraints lift, the laundering is invalid. **Advice:** Pivot to a constructivist view. Don't claim you found the "real" welfare; claim you built a *more robust model of agency* for policy evaluation. Avoid ontological claims about welfare; stick to methodological superiority for predicting choice under justice.

  **What to cut from the deck**
  Cut the technical derivation of potential-based shaping in Step 1. It's dry, invites RL nitpicks on math, and doesn't persuade philosophers. The economists already know RP has identification issues; you don't need to prove equivalence to IRL's. Instead, downgrade Step 1 to a verbal analogy: "RP's identification problem is a special case of IRL's." Spend that time expanding Step 3 (Laundering). The normative payoff is there, not in the identification math. This keeps the post-lunch crowd engaged with the political implications rather than bogged down in reward shaping equations.
