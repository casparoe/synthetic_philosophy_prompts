answer: |-
  ### Exam Question

  **Module:** Responsibility and Criminal Justice
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,300 words maximum

  **Question:**

  Suppose criminologists develop a well-confirmed, fine-grained measure called the 'Uptake Index'. This measures an agent's capacity, at the moment of acting, to recognise and respond to the moral reasons bearing on them. Three empirical findings emerge:
  (1) Uptake is graded and varies within individuals across situations; it is not binary.
  (2) Being held responsible in the right way (blamed, praised, asked to justify oneself) raises an agent's later Uptake; the practice partly constitutes the capacity it responds to.
  (3) Uptake predicts reoffending, but only where offenders are subsequently addressed in the second person. In systems that process people purely as risks (risk scores, civil detention, no moral address), Uptake atrophies and reconviction rises.

  With reference to the debate between Daniel Dennett and Gregg Caruso:

  (a) Explain whether findings (1)–(3) settle the dispute between them, or identify the further normative or metaphysical question the findings leave untouched.
  (b) Consider a jurisdiction that adopts Caruso's public-health quarantine model but adds a compulsory 'address hearing', where the offender is told in second-personal terms what they did and why it was wrong. The hearing has no effect on the sentence. Is this arrangement stable? Would Dennett view this as satisfying the demands of desert, or does desert require that the address alters the outcome? Would Caruso welcome this as non-punitive communication, or object that it shapes motives for public safety and thus uses the offender as a means?
  (c) The same jurisdiction retains state honours awarded on explicitly desert-based grounds while abolishing desert-based punishment. Is this asymmetry defensible on either view?

  ***

  ### Model Answer

  The Uptake Index findings provide significant pragmatic ammunition for compatibilists like Dennett, but they do not settle the core normative dispute with sceptics like Caruso. Findings (1)–(3) establish that responsibility practices are functionally effective and that the capacities underpinning them are real, malleable, and sensitive to moral address. Dennett can argue this vindicates responsibility: if the capacity exists and is sustained by our practices, it is real enough for moral accountability. However, Caruso can grant (1)–(3) without conceding basic desert. The untouched question is whether causal determination undermines the *basic desert* required for retributive punishment, regardless of the utility of the practice. Caruso's scepticism targets the legitimacy of suffering imposed because it is *deserved*, not the utility of moral address. Thus, the findings settle the functional efficacy of responsibility but not its moral permissibility in a deterministic world.

  Regarding the compulsory 'address hearing', the stability of the arrangement depends on contested interpretations of both theorists. For Dennett, the crucial issue is whether desert is essentially retributive. On a standard reading, Dennett rejects retributivism that demands suffering for its own sake; he views blame as a regulatory tool. Consequently, he might accept that second-personal address satisfies the communicative function of blame without requiring hard treatment, provided the agent's capacities are respected. However, it is contested whether Dennett is a 'desert realist' or a 'functionalist'. If he is a realist about desert, he might argue that ignoring Uptake differences in sentencing fails to treat agents as they truly are. If he is a functionalist, the hearing alone might suffice. Therefore, Dennett could view the arrangement as stable, provided the address respects the agent's rationality, even if the sentence remains fixed by risk.

  For Caruso, the hearing presents a deeper tension. Officially, Caruso's public-health quarantine model permits restriction of liberty to prevent harm, analogous to quarantining disease carriers, but forbids punitive hard treatment. He explicitly endorses moral address to maintain the offender's moral agency. However, there is genuine disagreement over whether Caruso can consistently employ second-personal blame without presupposing the very desert he rejects. If the hearing is compulsory and designed to boost Uptake for public safety, Caruso risks treating the offender as a means to social stability rather than a moral equal. If the address implies the offender *deserves* the censure, it contradicts his scepticism. If it is merely causal manipulation disguised as address, it violates the respect owed to persons. Thus, Caruso should object to the arrangement unless he can demonstrate that moral address is compatible with a purely forward-looking justification, a point many critics find unstable.

  Finally, the asymmetry of retaining desert-based honours while abolishing desert-based punishment is difficult to defend consistently. Caruso原则上 (in principle) rejects basic desert in both directions; accepting praise as *deserved* commits one to the same control principles that underpin deserved blame. To accept honours while rejecting punishment suggests an inconsistency in his scepticism, unless he reinterprets honours as merely forward-looking incentives. However, if the state explicitly awards them on *desert-based* grounds, Caruso should oppose this to maintain theoretical integrity. Dennett, conversely, might defend the asymmetry on pragmatic grounds. Since punishment involves inflicting harm, the bar for justification is higher than for conferring benefits. He might argue that while we lack the control required to deserve suffering, we possess enough agency to merit honour, or simply that the social utility of honours outweighs the risks, whereas the utility of punitive desert does not. Yet, if Uptake is graded (Finding 1), consistency suggests that if one deserves honour for high Uptake, one deserves reduced punishment for low Uptake.

  In conclusion, the Uptake Index clarifies the mechanics of responsibility but leaves the normative justification of desert open. The proposed hybrid jurisdiction is unstable because it attempts to merge a sceptical framework (Caruso) with practices that arguably presuppose the very desert Caruso denies, while potentially failing to satisfy the functionalist requirements Dennett places on holding agents accountable.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Assessment of Findings (1)–(3) (4 marks)**
  *   **Award:** For identifying that the findings address functional efficacy and capacity but do not resolve the *basic desert* vs. *determinism* conflict.
  *   **Common Error:** Claiming that because Uptake is graded/real, scepticism is refuted. (Deduct 2 marks). Sceptics grant capacities but deny they ground desert.

  **2. Analysis of Dennett on the Address Hearing (4 marks)**
  *   **Award:** For recognising Dennett's focus on capacities/communication over intrinsic suffering. Must note the contestation: is Dennett a desert realist or functionalist?
  *   **Common Error:** Characterising Dennett as a retributivist who believes suffering is intrinsically good. (Deduct 2 marks). He is a compatibilist focused on social regulation.

  **3. Analysis of Caruso on the Address Hearing (4 marks)**
  *   **Award:** For identifying the tension between moral address and the quarantine model. Must note the contestation: can Caruso use blame without presupposing desert?
  *   **Common Error:** Treating Caruso's model as unconstrained consequentialism permitting indefinite detention or manipulation. (Deduct 2 marks). He has strict rights-based constraints.

  **4. Analysis of the Asymmetry (Honours vs. Punishment) (4 marks)**
  *   **Award:** For arguing that Caruso should theoretically reject desert-based honours for consistency, or that Dennett might pragmatically accept asymmetry due to the harm/benefit distinction.
  *   **Common Error:** Assuming asymmetry is obviously defensible without argument, or that Caruso accepts desert-based praise. (Deduct 2 marks).

  **5. Conceptual Precision and Interpretative Nuance (4 marks)**
  *   **Award:** For avoiding the specific pitfalls listed above and acknowledging where interpretations of Dennett/Caruso are contested (as flagged in the model answer).
  *   **Common Error:** Ignoring the instruction to flag contested interpretations. Students who argue dogmatically for one reading of Dennett/Caruso without acknowledging the alternative *but* argue coherently should still receive marks for this criterion, provided they do not commit the specific conceptual errors listed in criteria 1–4. (Deduct 2 marks for dogmatism that ignores the prompt's nuance; Deduct 4 marks for committing the specific conceptual errors in 1–4).

  **Note on Contested Interpretations:**
  Examiners should award full marks within the relevant criteria for answers that adopt a defensible alternative interpretation to the model answer (e.g., arguing Dennett *does* require hard treatment for desert, or that Caruso *can* consistently use moral address), provided the argument is internally consistent and acknowledges the contestation. The penalty applies only to misrepresenting the core commitments (e.g., calling Dennett a retributivist).
