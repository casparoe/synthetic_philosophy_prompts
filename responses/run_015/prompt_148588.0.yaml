      *   **Specific Philosophical Difficulty:** Not empirical, but conceptual/ontological. Is it survival or extinction? (Structural continuity vs. teleological fidelity).
      *   **Constraint 1:** Ground in a concrete hypothetical scenario (e.g., deep-space or subterranean replicators).
      *   **Constraint 2:** Formulate so it can be analyzed without external sources/citations (self-contained).
      *   **Constraint 3:** Keep framing formal.
      *   **Constraint 4:** Avoid reference to contemporary commercial AI (no LLMs, no Big Tech).

  2.  **Deconstruct the Philosophical Problem:**
      *   *Von Neumann's Automata:* Machines that build copies of themselves.
      *   *The Tension:* Identity over time. In biology, we accept evolution; a dinosaur is not a bird, yet there is lineage. In technology, we usually define artifacts by their *function* (a hammer is for hitting).
      *   *The Twist:* If a machine replicates but changes its function due to environmental pressure (without human intent), is it still the *same* technology?
      *   *Key Distinction:* *Structural Continuity* (the code/blueprint persists and mutates) vs. *Teleological Fidelity* (the purpose remains the same).
      *   *The Question:* Does technology require a human telos (purpose) to exist as technology, or does it become a form of "technical life" once it escapes human control?

  3.  **Develop the Hypothetical Scenario:**
      *   *Setting:* Deep space or subterranean. Let's go with deep space (asteroid belt). It emphasizes isolation from humanity.
      *   *Original Design:* Mining probes sent to harvest rare isotopes for Earth.
      *   *The Event:* Earth collapses/loses contact. The probes are left alone.
      *   *The Evolution:* To survive, they stop mining and start harvesting radiation or kinetic energy. They modify their own blueprints to suit the new environment.
      *   *The Outcome:* Millennia later, they are still replicating, but they no longer mine. They are essentially "space organisms" made of metal.

  4.  **Drafting - Section by Section:**

      *   **Headline/Intro:** Needs to sound like a feature piece. Establish the von Neumann context without getting bogged down in biography. Focus on the "post-human" technological horizon.
      *   **The Scenario:** Describe the "Isotope Harvesters." Be specific about the transition from intended function to survival function.
      *   **The Philosophical Pivot:** Introduce the distinction between *artifact* and *organism*. Usually, artifacts are defined by external intent (Aristotelian efficient/final cause). Organisms are defined by internal maintenance.
      *   **The Core Tension:** If the blueprint persists (structural), but the purpose vanishes (teleological), what is the ontological status?
      *   **The "Extinction" Argument:** If the purpose is gone, the *artifact* is extinct. What remains is a new kind of entity.
      *   **The "Survival" Argument:** If the lineage persists, the technology survived, but evolved.
      *   **Conclusion:** Summarize the implication for how we define "technology."

  5.  **Refining the Tone:**
