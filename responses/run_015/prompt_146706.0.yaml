prompt: |-
  Hey — I could use a hand scripting a episode of my little podcast. The conceit is that each episode is a staged interview with a philosopher who's no longer around: an actor plays them, and I write all the questions, with one rule — everything the character says has to be faithful to what they actually argued, no anachronisms and no invented positions. Next up is Paul Grice, and I want to get past the greatest hits. I know he'd reach for the philosophy-job reference letter and the stranded motorist / garage-around-the-corner case within about ninety seconds, and I want questions where that reflex doesn't help him at all.

  Some framing. My co-writer plays a recurring critic we invented, Dorit Vance, who turns up near the end of each episode; in our fiction she's written a book called Implicature Without Interlocutors, and her three hobby-horses are: (a) the backwards-derivation complaint — that a hearer has to already have a hypothesis about the implicated content in hand before they can tell which maxim is supposedly being flouted, so the neat derivation up from the Cooperative Principle runs in the opposite direction from how it's presented and the maxims end up doing no real work; (b) orphan implicatures — cases where something implicature-shaped clearly gets conveyed with nobody intending it: a boilerplate late-notice on a utility bill, a translated sentence read aloud by someone who doesn't speak the language, an autogenerated assistant hedge like "I'm not able to help with that" — she says if those are genuine implicatures then speaker intentions drop out of your theory, and if they aren't, then your pragmatics can't handle most of what ordinary people actually read; (c) the safety-valve charge about cancellability, namely that if any implicature can be cancelled by tacking on a clunky parenthetical disclaimer then the test is trivially easy to pass, but if you instead demand that the cancellation be achievable without a disclaimer, you can't handle the cases where the second half of Quantity (don't be more informative than required) is what's doing the work. He also has two deflection moves I want progressively closed off: whenever it gets hard he says either "that's a matter of what is said, not what is implicated," or "I'm offering a rational reconstruction, not a psychological hypothesis."

  So: give me eight to ten questions for the Grice character, ordered as a sequence, each with the reply he's most likely to give sketched in one or two lines and then a follow-up keyed to that specific reply. I want at least: one question that makes him say which step in the derivation of a particularized implicature is actually doing the predicting, given Vance's backwards-derivation point; one on orphan implicatures where the follow-up blocks the easy move of saying "no speaker, no implicature, and that's fine"; one pressing on whether the four maxims are meant to be a universal list or a piece of local etiquette, and what sort of cross-linguistic or developmental finding would make him revise the list; and one on the join between the intention-based account of speaker meaning from his early 1957 paper on meaning and the Cooperative Principle machinery of the later lectures — specifically, whether the derivation of an implicature secretly helps itself to the very notion of utterer's-meaning it was supposed to be reconstructing. End with one question that makes both deflection lines unusable at the same time and forces him to say what kind of empirical finding would count against the framework rather than merely around it. Keep them in the voice of a smart but slightly combative host — short, concrete, with the case built into the question rather than explained first.
