      *   **(4):** *Pointwise convergence vs. Uniform convergence.* This is the classic analysis trap. Just because $\lim_{t \to \infty} P_t(p) = \text{Truth}(p)$ for every $p$, does it mean that for large $t$, $P_t$ is close to Truth on *all* $p$ simultaneously?
          *   *Mathematical intuition:* No. Pointwise convergence does not imply uniform convergence. For any fixed $t$, there might be some very hard $p$ (e.g., halting problem with huge $N$) where the credence is still wild.
