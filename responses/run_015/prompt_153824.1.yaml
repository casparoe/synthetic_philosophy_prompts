answer: |-
  The rot is in **(4)**.

  You have correctly identified that (3) and (6) feel robust, and your intuition to suspect (4) or (5) is spot on. The specific error is a classic analysis mistake: you are conflating **pointwise convergence** with **uniform convergence**.

  Here is the diagnosis of why (4) fails, why rejecting it saves your framework, and what it costs you.

  ### The Diagnosis: Pointwise vs. Uniform

  Step (3) establishes **pointwise convergence**. It says:
  > For every settled proposition $p$, $\lim_{t \to \infty} \text{Credence}_t(p) = \text{Truth}(p)$.

  Step (4) infers **uniform convergence**. It claims:
  > $\lim_{t \to \infty} (\text{Credence}_t \text{ is accurate on all } p)$.

  In mathematical terms, (3) says $\forall p, \exists T_p$ such that for all $t > T_p$, the credence is accurate. The time $T_p$ depends on $p$. Harder questions (e.g., "Does program $P$ halt in $10^{100}$ steps?") require larger $T_p$ than easier questions.

  Step (4) assumes there is a single time $T$ such that for all $t > T$, the reasoner is accurate on *all* $p$. But since you stipulated an "unending supply" of settled questions of increasing complexity, there is no such $T$. For any finite time $t$, there is always some sufficiently complex settled question $q$ that the reasoner has not yet "solved" (i.e., $t < T_q$).

  Therefore, the reasoner never actually reaches the state described in (5) at any finite time. The "limit reasoner" (at $t=\infty$) is indeed omniscient, but the limit reasoner is not the agent making decisions. The agent is the sequence of temporal slices $R_1, R_2, \dots$. Every slice $R_t$ still has logical uncertainty about questions harder than its current computational horizon.

  ### Why (6) Doesn't Trigger

  Because (4) fails, the antecedent of (5) is never satisfied by the acting agent.
  *   **Step (5)** says: "A reasoner whose credences are right about every settled question has no logical uncertainty." (True, but vacuous for bounded agents).
  *   **Step (6)** says: "A reasoner that can't be moved by a computation has no reason to run one."

  Since the reasoner at time $t$ is *not* right about every settled question (only those with $T_p < t$), there are always computations with positive expected value. Specifically, computing the answer to a question $q$ where $T_q \approx t$ will yield information gain. The "frontier of uncertainty" moves outward as $t$ increases, but there is always a frontier. The reasoner never runs out of thinking to do.

  ### What Rejecting (4) Costs You

  You asked: *If I drop (4), do I lose any grip on what makes one bounded reasoner better than another at a given time?*

  **No.** In fact, rejecting (4) gives you a *better* grip on bounded rationality than keeping it.

  If you keep (4), you are implicitly measuring reasoners by their distance from omniscience. If you drop (4), you measure reasoners by their **computational horizon**.

  Under the "No-Computable-Exploitability" criterion (2), you can still rank reasoners at time $t$:
  *   **Reasoner A** is better than **Reasoner B** if the simplest trading strategy required to exploit A is more complex than the simplest strategy required to exploit B.
  *   Alternatively: Reasoner A is better if, for a fixed computational budget of a trader, A survives longer without being exploited.

  This preserves the normative force of (2). It just acknowledges that "rationality" for a bounded agent isn't a static state of being correct; it's a dynamic property of how quickly your credences improve relative to the complexity of the questions you face. You aren't aiming for the limit; you are aiming to be as close to the limit as your resources allow *now*.

  ### The Finite Case Check

  You asked: *Does it help anything to say the reasoner only ever faces finitely many questions?*

  Actually, making the set of questions finite makes the paradox **worse**, which confirms that (4) is the culprit.

  If there are only $N$ settled questions total, then pointwise convergence *does* imply uniform convergence. Let $T_{max} = \max(T_{p_1}, \dots, T_{p_N})$. After time $T_{max}$, the reasoner is accurate on all $N$ questions. At that point, your conclusion (7) holds: the reasoner stops thinking.

  But this is actually correct for a finite domain! If a bounded reasoner faces a finite set of decidable questions and has infinite time, it *should* eventually solve all of them and stop thinking. The paradox only arises because you (correctly) assumed an "unending supply" of questions in the setup, but then (4) smuggled in the assumption that the reasoner could catch up to that infinity in finite time.

  ### Summary

  *   **Reject:** Step (4).
  *   **Reason:** Pointwise convergence (on each question eventually) does not imply uniform convergence (on all questions simultaneously).
  *   **Consequence:** The reasoner always has a "horizon of uncertainty." There are always settled questions it is currently wrong about or uncertain about, so computation always has positive expected value.
  *   **Normative Grip:** You retain the "no-exploitability" criterion, but interpret it as measuring the *complexity* of the errors remaining, rather than the *existence* of errors.

  The framework isn't pointless; it just describes a treadmill rather than a destination. The reasoner runs to stay in place relative to the expanding set of solvable problems.
