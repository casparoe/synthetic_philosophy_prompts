answer: |-
  **Project Title:** Beyond Fixed Scales: Testing the Limits of Risk-Weighted Expected Utility in Structurally Ambiguous Domains

  **1. The Research Question**
  Can Risk-Weighted Expected Utility (REU) be extended to accommodate "structurally ambiguous catastrophic outcomes" via a second-order domain-gating mechanism without collapsing into standard Improbable Probability (IP) models or violating the representation theorems that ground REU?

  Specifically, this project seeks a determinate answer to the following: **Is it possible to construct a coherent preference ordering that applies risk-weights to epistemic partitions of the outcome space (value frameworks) rather than just outcomes, while maintaining the separability conditions required for an REU representation?**

  A "Yes" answer requires demonstrating a set of axioms under which a two-tier risk function remains distinct from a single-tier EU function over a grand state space. A "No" answer requires proving that any such extension either necessitates a meta-utility function (collapsing to EU) or requires probability intervals that abandon the precise risk-function structure (collapsing to IP).

  **2. Motivation and Gap in Existing Literature**
  Risk-Weighted Expected Utility theory is currently the leading alternative to Expected Utility (EU) for modeling risk-sensitive preferences. It successfully resolves Allais-style paradoxes by allowing agents to weight probabilities non-linearly based on their risk attitude. However, the standard formulation presupposes **value determinacy**: it assumes the agent possesses a fixed utility function and a fully specified outcome space prior to the decision.

  This assumption holds for standard economic gambles but fails in high-stakes, long-horizon technological risk scenarios (e.g., existential risk, transformative AI). In these contexts, the "catastrophic" outcome is not merely a low-utility point on a fixed scale; it represents a structural break where the post-decision value framework may be incommensurable with the pre-decision framework. For instance, if a decision risks the emergence of new moral patients or value systems, the agent cannot assign a determinate utility value to that outcome at the time of choice.

  Existing literature leaves this open for two reasons. First, REU scholarship focuses primarily on *risk attitudes* toward known distributions, treating the outcome space as exogenous. Second, literature on *value uncertainty* typically defaults to EU maximization over a distribution of utility functions or adopts Improbable Probability models. There is currently no rigorous treatment of whether REU's specific mechanism for risk-sensitivity can be applied to the uncertainty of the value scale itself without losing its distinctive formal properties. This project targets that intersection.

  **3. Methodological Approach**
  The project will employ a hybrid methodology of **conceptual analysis** and **informal formal modelling**. Given the constraints of a one-semester term paper, a full axiomatic derivation of a new representation theorem is not feasible. Instead, the method will proceed in three stages:

  1.  **Formal Sketch:** I will construct a simplified "Two-Tier REU" model.
      *   *Tier 1:* Standard REU calculation within a specific value framework (a specific utility function).
      *   *Tier 2:* A "domain gate" that applies a risk-function to the probability distribution over competing value frameworks.
  2.  **Consistency Testing:** I will test this sketch against the standard REU axioms (specifically the Sure Thing Principle and the Independence axiom as modified by Buchak). The focus will be on whether the second-order risk function can be distinguished from a first-order risk function over a composite state space.
  3.  **Collapse Analysis:** I will analyze the conditions under which the Two-Tier model mathematically reduces to either (a) standard EU (if the risk weights cancel out or normalize) or (b) IP models (if the risk weights require interval-valued probabilities to remain coherent).

  **4. Anticipated Results**
  *   **Positive Result:** The project identifies a specific constraint on the "domain gate" (e.g., a restriction on how risk-weights interact across value frameworks) that preserves the REU representation. This would show that REU is robust enough to handle structural ambiguity, provided agents satisfy a new "Cross-Framework Consistency" axiom.
  *   **Negative Result:** The project demonstrates a "Collapse Theorem": any attempt to risk-weight over value frameworks inevitably requires a meta-utility function to compare those frameworks. If a meta-utility exists, the model collapses to standard EU over a larger state space. If it does not exist, the model requires imprecise probabilities, abandoning the precise risk-function that defines REU. This would imply REU implicitly presupposes value determinacy.
  *   **Partial Result:** The project shows that the extension is possible only if the "catastrophic" outcomes are treated as *limits* rather than *points* on the utility scale. This would suggest REU can handle structural ambiguity only by modifying the definition of utility (e.g., allowing for unbounded or lexicographic utilities) rather than modifying the risk function.

  **5. Scope and Feasibility Assessment**
  *   **Realistic Scope (One Semester / ~6,000 words):**
      *   Defining the "structurally ambiguous" case clearly enough to distinguish it from standard state-dependent utility.
      *   Constructing the informal Two-Tier model and running it against 2–3 key REU axioms.
      *   Providing a rigorous argument for either the Positive or Negative result (likely the Negative/Collapse result, as impossibility proofs are more tractable in this word count than novel representation theorems).
      *   Drawing philosophical conclusions about the limits of risk-sensitivity in long-termist ethics.

  *   **Potential Scope Creep (To be avoided):**
      *   **Full Axiomatization:** Attempting to prove a new representation theorem from scratch is PhD-level work and will not fit the word count. The paper will argue *about* the axioms rather than deriving them fully.
      *   **Empirical Application:** Applying the model to specific AI safety or climate scenarios is tempting but risks becoming too descriptive. The focus must remain on the decision-theoretic formalism.
      *   **Comparative Analysis:** Deeply comparing the model against all competing theories (e.g., Regret Theory, Smooth Ambiguity) should be limited to the specific question of collapse into IP or EU.

  **6. Significance**
  If the project yields a Negative Result, it establishes a critical boundary for REU theory: it is a theory of risk for "tame" worlds where values are fixed, not "wild" worlds where values are contingent. This would force decision theorists working on existential risk to either abandon REU for these cases or fundamentally rethink the ontology of the outcome space. If the project yields a Positive Result, it offers a new tool for long-termist ethics, allowing for risk-sensitive reasoning even when the stakes involve the potential transformation of value itself. Either outcome clarifies the normative resources available for high-stakes decision-making under structural uncertainty.
