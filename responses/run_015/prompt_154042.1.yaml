  4.  **Refining the "Domain-Gating" Concept:**
      *   I need to make sure I understand what the user means. It sounds like *value uncertainty* combined with *risk sensitivity*.
      *   Standard approach to value uncertainty: Expectation over utility functions ($E[U]$).
      *   REU approach: Risk-weight over outcomes.
      *   Combination: Risk-weight over *utility functions*? Or Risk-weight over outcomes *within* utility functions, then aggregate?
      *   The user says: "risk weights operate not only over first-order outcomes but over epistemic partitions of the outcome space."
