      *   **Motivation/Gap:** Why does existing literature miss this? REU literature (Buchak et al.) focuses on *attitudes toward risk* given fixed values. It assumes the "Good" is commensurable. Long-term risk literature (Greaves, MacAskill) discusses value uncertainty but usually sticks to EU or IP. The intersection is empty.
