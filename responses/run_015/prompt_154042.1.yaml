      *   *Self-Correction on Scope:* The user mentioned a 6,000-word term paper. The pitch needs to reflect that limited scope. A full axiomatic derivation is impossible in 6k words. The goal should be a *conceptual proof of concept* or a *preliminary impossibility argument*. I need to temper the ambitions in the "Methodology" section to match the word count.

