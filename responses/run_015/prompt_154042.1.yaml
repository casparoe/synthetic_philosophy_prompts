      *   **Proposed Mechanism:** A second-order "domain-gating" mechanism where risk weights operate over epistemic partitions of the outcome space, not just outcomes.
      *   **Key Question:** Can this be done without collapsing into imprecise probability models or losing REU's representation theorems? If not, does REU presuppose "value determinacy"?
      *   **Format:** Workshop pitch suitable for a term paper proposal or small grant application.
