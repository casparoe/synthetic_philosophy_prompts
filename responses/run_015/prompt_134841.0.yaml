answer: |-
  Your observation identifies a genuine and under-theorized tension in contemporary philosophy of AI. To answer your first question directly: **No, there is no single established term in the standard taxonomy of philosophy of mind or AI ethics that captures this specific configuration.**

  While related concepts exist—such as *instrumentalism*, *fictionalism*, and *eliminativism*—none of them precisely describe the *context-dependent oscillation* you have identified. Standard instrumentalism (e.g., Dennett) typically maintains a consistent ontological status for intentional states across domains (if they are real patterns for prediction, they are real patterns period). Eliminativism denies the states globally. Fictionalism treats them as useful falsehoods globally. Your description identifies a hybrid posture that is realist about causal efficacy but anti-realist about normative grounding, switched dynamically based on the stakes of the discourse.

  Below is an analysis of why existing frameworks fall short, an evaluation of the pattern against Dennett's view, and a proposal for a precise term to capture the phenomenon.

  ### 1. Is this a Legitimate Application of Dennett's View?

  This pattern represents a **failure mode of Dennettian consistency**, rather than a legitimate application of the Intentional Stance.

  For Dennett, the reality of a belief is constituted by the success of the intentional stance in predicting behavior ("real patterns"). If attributing a false belief to a model successfully predicts dangerous medical advice, then, on Dennett's view, the model *has* a false belief (as a real pattern). To subsequently deny the existence of that belief in a normative context (e.g., to avoid ascribing deception) creates an ontological inconsistency.

  Dennett does distinguish between *having beliefs* and *being a moral agent* (the latter requiring things like sentience or social contract participation). However, your examples describe authors who deny the *belief itself* in the normative context ("possesses no beliefs, it cannot be said to deceive"), not just the moral agency. This violates the Dennettian criterion that if the stance works predictively, the state is ontologically robust enough to be referenced consistently. The pattern you describe treats the intentional state as *ontologically porous*: real enough to cause harm, but unreal enough to absolve responsibility.

  ### 2. Proposed Terminology: Normative-Epistemic Bifurcation

  Since no existing term captures this selective oscillation, I propose the term **Normative-Epistemic Bifurcation** (or, more operationally, **Stance Gating**).

  #### Definition
  **Normative-Epistemic Bifurcation** is the systematic practice within a single theoretical framework of affirming the ontological sufficiency of intentional states (beliefs, desires, intentions) for **epistemic purposes** (explanation, prediction, debugging) while denying their ontological sufficiency for **normative purposes** (moral responsibility, deception, epistemic authority).

  #### Necessary Conditions
  For a discourse to exhibit Normative-Epistemic Bifurcation, three conditions must be met:
  1.  **Explanatory Commitment:** The analyst explicitly relies on propositional attitude attribution to render a specific behavior intelligible or predictable (e.g., "The model believed $p$").
  2.  **Normative Withdrawal:** The analyst explicitly retracts or denies the reality of those same states when assessing liability, truthfulness, or agency (e.g., "The model has no beliefs, thus it did not lie").
  3.  **Contextual Correlation:** The shift is not due to a refinement of the model's architecture but is correlated strictly with the *type of question being asked* (predictive vs. deontic).

  ### 3. Distinctions from Neighboring Concepts

  To ensure precision, we must distinguish Normative-Epistemic Bifurcation from three nearby positions:

  *   **Vs. Consistent Instrumentalism (Dennett):**
      *   *Instrumentalism:* Intentional states are real patterns wherever the stance yields predictive success. Moral responsibility may be withheld, but the *belief* remains a real pattern.
      *   *Bifurcation:* The *belief itself* is treated as ontologically volatile—real in the safety report, unreal in the ethics appendix.
  *   **Vs. Global Fictionalism (Vaihingerian "As-If"):**
      *   *Fictionalism:* Intentional talk is *always* literally false but useful. The analyst knows the model doesn't believe $p$, even when explaining the output.
      *   *Bifurcation:* The analyst speaks *realistically* about the belief in the explanatory context (treating it as a causal mechanism) and only switches to fictionalism/eliminativism when normative stakes rise.
  *   **Vs. Pragmatic Inconsistency:**
      *   *Inconsistency:* Accidental contradiction due to carelessness.
      *   *Bifurcation:* A structured, systematic policy. The contradiction is functional; it allows the analyst to maximize predictive power while minimizing moral/legal liability.

  ### 4. Boundary Cases

  You asked where the boundary lies regarding researchers who use belief-language for prediction but never for responsibility.

  *   **Case A (Not Bifurcation):** A researcher states, "The model acts *as if* it believes $p$, which helps us predict errors, but since it lacks phenomenology, it cannot be held responsible."
      *   *Verdict:* This is **Consistent Instrumentalism**. The ontological status of the "belief" is kept constant (it is an abstraction/heuristic in both cases); only the criteria for *responsibility* change.
  *   **Case B (Bifurcation):** A researcher states, "The model *harbors a false belief* about pharmacology [causal claim]," but later writes, "The model *has no beliefs*, so it cannot deceive [ontological claim]."
      *   *Verdict:* This is **Normative-Epistemic Bifurcation**. The ontological status of the belief shifts. In the first clause, the belief is a causal entity; in the second, it is nonexistent.
  *   **Case C (Implicit Bifurcation):** A researcher never explicitly denies beliefs in the normative section but structures the argument such that responsibility requires "conscious belief," while the predictive section relies on "functional belief," without clarifying the relationship between the two.
      *   *Verdict:* This is **Latent Bifurcation**. It becomes explicit Normative-Epistemic Bifurcation if challenged on whether the "functional belief" cited in prediction is the same kind of state as the "conscious belief" denied in ethics. If they equivocate on the term "belief" to suit the context, the bifurcation is active.

  ### Summary

  The pattern you have identified is a strategic adaptation to the unique pressure of AI discourse: the need to treat models as agents for safety engineering while treating them as tools for liability management. While Dennett's framework permits instrumentalism, it demands consistency regarding the *reality of the pattern*. The pattern you describe violates that consistency.

  **Normative-Epistemic Bifurcation** is the precise term for this maneuver. It distinguishes the phenomenon from simple inconsistency by highlighting its systematic nature, and from standard instrumentalism by highlighting the ontological volatility of the attributed states. It captures the specific dialectical move where the "mind" of the machine is invoked to explain danger but exorcised to excuse deception.
