          5.  Parallel to 1980s Eliminativism (Churchland/etc.) regarding stability/correction.
          6.  Falsifiability (what empirical finding would count *against* the view?).
      *   **Format:** Casual, conversational flow (not a checklist), with follow-up questions keyed to likely answers.
      *   **Critical Constraint:** I *must* be self-critical. I need to flag contested readings (Frankish vs. Dennett), liberties taken with predictive processing, potential confusion in the user's "stability problem" framing, and distinctions between illusionism and eliminativism. I cannot just play along if the premises are confused.

  2.  **Deconstruct the Philosophy (Illusionism):**
