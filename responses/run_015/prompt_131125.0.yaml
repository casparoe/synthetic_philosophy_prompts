  6.  **Refining the Content (incorporating the "Self-Critical" requirement):**
      *   I will write the questions first, then append a "Producer's Note" or "Critical Commentary" section where I break down the philosophical risks. Actually, the prompt asks me to "flag anywhere you're leaning on a contested reading... say so plainly instead of complying politely." I should integrate the critique *before* or *alongside* the questions so the user knows the terrain before walking onto it.
      *   *Decision:* I will provide a "Pre-Interview Briefing" (The Critique) followed by the "Run of Show" (The Questions). This ensures I meet the requirement to correct confused premises *before* giving the goods.

  7.  **Final Review against Constraints:**
