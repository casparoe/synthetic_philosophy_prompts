      *   *User's definition:* "Parallel to 80s Eliminativism."
      *   *My correction:* Churchland said "No beliefs." Frankish says "No qualia, but yes to functional experiences." The parallel is rhetorical, not ontological.
      *   *User's definition:* "PCS undermines illusionism."
