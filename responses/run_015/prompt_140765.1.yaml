answer: |-
  To apply Aumann's Agreement Theorem to the 1981 Budget episode, we must first rigorously define the agents and the state space. The agents are not the 364 economists individually, but rather two coalitions: the "364" acting as a corporate body producing a joint statement, and the "Government" (represented by Howe, the Treasury, and public supporters like Minford and Walters). The theorem requires common knowledge of posteriors; the public nature of the statement and the Treasury's responses satisfies the knowledge condition loosely, though the recursive "I know that you know that I know" condition is rarely met in political discourse. However, treating them as two Bayesian agents allows us to test the theorem's limits.

  The "event" in the theorem's sense is not the Budget itself, but the causal consequence of fiscal contraction during a slump. The statement bundles distinct claims: a forecast (output will fall), a causal mechanism (tightening causes depression), a theoretical assertion ("no basis in theory"), and a political judgment (threat to stability). Aumann's theorem applies only to beliefs about states of the world, not preferences or political advocacy. Therefore, the relevant event is the causal/forecast claim: *Will stringent fiscal contraction deepen the recession?* The theoretical claim ("no basis") is a claim about the model space itself, which complicates the application significantly.

  Regarding information partitions and posteriors: neither side published probabilistic estimates. The 364's posterior was effectively binary (Probability of disaster ≈ 1), derived from a partition containing Keynesian multiplier models and historical data from the 1930s. The Government's posterior was also binary (Probability of success ≈ 1), derived from a partition containing monetarist models, crowding-out theories, and private Treasury forecasts. Because almost nobody published numbers, the "posteriors" were actions (signing vs. implementing), not probability distributions.

  Why did they agree to disagree? We can rank the candidate explanations for this failure of convergence by their explanatory power in this specific case.

  First, and most significantly, **different model spaces (disjoint state spaces)**. Aumann assumes agents partition the *same* set of states $\Omega$. The 364 and the Monetarists did not share a state space. To the signatories, a state included "aggregate demand deficiency"; to Minford, that state was theoretically impossible or irrelevant compared to "money supply growth." If agents define reality using incompatible variables, the theorem does not apply. They were not disagreeing about the probability of an event within a shared world; they were describing different worlds. This explains the bulk of the persistence.

  Second, **strategic communication (cheap talk)**. The remark that signing was "the only game in town" indicates the statement was not an honest report of belief but a coordination signal to preserve professional relevance or political influence. In Aumann's framework, agents must truthfully report posteriors. If the statement is a speech act intended to constrain the government rather than describe belief, the "common knowledge of posteriors" condition is violated. The 364 were not revealing $P(Event|Information)$; they were revealing $Utility(Signing)$.

  Third, **genuinely different priors**. While possible, this explains less than the structural differences. Even with different priors, Aumann shows agents should converge if they share a model and update honestly. The persistence of disagreement suggests the updating mechanism itself was fractured by the model mismatch, not merely the starting point.

  Fourth, **motivated updating**. Ideology likely influenced how evidence was weighted, but this is subsumed by the model space argument; their ideologies dictated which models they considered valid states.

  Consider the counterfactual: suppose a mechanism required both sides to post probabilities on specific outcomes (e.g., "Unemployment > 3m by Jan 1982") under a proper scoring rule with financial stakes. This would enforce honest revelation of posteriors, satisfying one condition of the theorem. However, it would not align the state spaces. We would expect to observe honest measurement of the gap, not convergence. The numbers would remain divergent because the underlying models generating those probabilities differ. The no-trade corollary—which suggests agents with common priors cannot bet against each other—would likely still hold no force here. While the sides were effectively taking opposite reputational bets, the lack of actual financial wagering between them (the 364 did not bet Minford their salaries) means the corollary is not violated. They were not betting against each other; they were betting on the world using different bookmakers.

  What does this episode reveal about the theorem itself? First, it demonstrates that the theorem's consistency constraint has little predictive bite in real-world policy disputes where model spaces are contested. The theorem guarantees consistency given shared structures; it does not guarantee that shared structures will emerge. Second, the fact that the 364 were arguably "wrong" (output recovered, though unemployment rose) is not evidence against the theorem, nor does it vindicate the Government's priors. Aumann's theorem is silent on truth; agents can commonly agree on a falsehood if their information partitions lead them there. The 364's error was empirical, not epistemological in the Aumannian sense.

  Finally, the episode highlights where the theorem is silent: it offers no guidance on the cost of honesty. The signatory who called it the "only game in town" implies that honest belief (perhaps uncertainty) was too costly to reveal given professional incentives. The theorem assumes agents *can* report posteriors; it does not account for situations where reporting a posterior jeopardizes the agent's position within the partition. Furthermore, the theorem says nothing about convergence speed. Even if the 364 and the Treasury had shared models, the data required to update priors (the outcome of the budget) takes years to materialize. The disagreement persisted because the feedback loop was too slow to force updating before the political battle was won.

  In sum, the 1981 episode is not a case of agents agreeing to disagree despite satisfying Aumann's conditions. It is a case where the conditions—specifically common state spaces and honest reporting—were fundamentally absent. The theorem remains valid, but its antecedents are too fragile for the rough terrain of macroeconomic policy advocacy. The 364 did not violate Bayesian consistency; they operated outside the theorem's universe.
