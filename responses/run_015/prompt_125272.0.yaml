  is there a principle that gets all these, or close? and what does it say about the case i keep flip flopping on: i have an AI write me an excuse note for gym and hand it in, knowing the AI just makes up plausible-sounding text and doesnt know or believe anything. is anyone lying there, me or the AI, and is it worse or less bad than if id just written the fake note myself? also be honest about which of my verdicts i should probably drop
