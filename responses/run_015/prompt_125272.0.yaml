  - the vice principal literally watched me do it and then asks did you do that, and i say no. nobody believes me and i know nobody will. i weirdly feel less bad about this than about the library one, like its not even really a lie
  - i snap back at my sister that i didn't eat her leftovers, 100% sure that i did, and it turns out dad ate them. i still feel like i did something wrong, like i *tried* to lie

