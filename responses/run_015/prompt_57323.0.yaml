answer: |-
  # Lesson Plan: The Risk Parameter (80 Minutes)

  **Goal:** Demonstrate that risk attitude is a distinct parameter from utility curvature, motivating Risk-Weighted Expected Utility (REU).
  **Audience:** 24 Philosophy majors (low math background).
  **Constraint:** No mention of "Expected Utility" or "Axioms" until the debrief.

  ## 1. Materials & Setup (10 Minutes)

  **The Currency (Linear Marginal Utility)**
  To prevent students from rationalizing choices via diminishing marginal utility (e.g., "$100 matters less to me than $10"), we use **Probability Shares**.
  *   **The Prize:** One $50 Amazon Gift Card (fixed value).
  *   **The Currency:** "Raffle Slots."
  *   **The Mechanism:** You (the instructor) have a digital random number generator (1–10,000).
      *   1 Slot = 1/10,000 chance of winning the card.
      *   10 Slots = 10/10,000 chance.
      *   *Crucial Script:* "The prize is always one $50 card. Slots are just chances. 10 slots is exactly ten times better than 1 slot. There is no diminishing return on probability."

  **Physical Props**
  *   24 Choice Sheets (labeled Round 1, 2, 3).
  *   A clear urn with 100 numbered ping-pong balls (or slips of paper).
  *   The Gift Card (visible on the desk).

  ## 2. The Activity (45 Minutes)

  ### Round 1: The Certainty Effect (15 Minutes)
  *Hand out Choice Sheet 1.*

  **Script:** "You are choosing between two gambles. I will draw one ball from the urn (1–100). Your payoff depends on the number drawn. Record your choice privately."

  *   **Option Safe (S):**
      *   Balls 1–100: **10 Slots**
  *   **Option Risky (R):**
      *   Balls 1–10: **100 Slots**
      *   Balls 11–99: **10 Slots**
      *   Ball 100: **0 Slots**

  *Collect sheets. Do not reveal results.*

  ### Round 2: Scaled Stakes (15 Minutes)
  *Hand out Choice Sheet 2.*

  **Script:** "Same urn. Same rules. But the number of Slots on offer is multiplied by 10. Remember, 100 Slots is just 10x the chance of 10 Slots. The prize is still the single $50 card."

  *   **Option Safe (S*):**
      *   Balls 1–100: **100 Slots**
  *   **Option Risky (R*):**
      *   Balls 1–10: **1,000 Slots**
      *   Balls 11–99: **100 Slots**
      *   Ball 100: **0 Slots**

  *Collect sheets. Do not reveal results.*

  ### Round 3: The News (15 Minutes)
  *Hand out Choice Sheet 3.*

  **Script:** "We are going back to the **Round 1** stakes (10 vs 100 Slots). But before you choose, I have news. I drew a ball from the urn. I'm not telling you the number, but I am telling you: **The ball is NOT between 11 and 99.**"

  "This news eliminates the outcome where both options paid 10 Slots. The ball is either 1–10 or 100. Given this news, choose again."

  *   **Option Safe (S|News):**
      *   Balls 1–10: **10 Slots**
      *   Ball 100: **10 Slots**
      *   *(Effectively: 10 Slots for sure)*
  *   **Option Risky (R|News):**
      *   Balls 1–10: **100 Slots**
      *   Ball 100: **0 Slots**

  *Collect sheets. Now, and only now, you can reveal the theory.*

  ## 3. The Debrief (25 Minutes)

  ### Step 1: The Data Reveal (5 mins)
  Ask for a show of hands for each pattern. You are looking for the **Allais Pattern**:
  1.  **Round 1:** Chose **Safe** (The Certainty Effect).
  2.  **Round 2:** Chose **Safe** (Consistency check).
  3.  **Round 3:** Chose **Risky** (The Switch).

  *Note: Many will switch in Round 3. Some might switch in Round 2. Highlight anyone who chose Safe in R1 and Risky in R3.*

  ### Step 2: Mapping to Theory (10 mins)
  **The EU Problem:**
  "Standard Expected Utility (EU) says your preference should depend only on the *difference* between the options.
  *   In Round 1, Options S and R both give '10 Slots' on balls 11–99.
  *   In Round 3, I told you balls 11–99 didn't happen.
  *   EU says: Since the '11–99' part was identical for both, knowing it didn't happen shouldn't change your mind. If you liked Safe better before, you should like Safe better now.
  *   If you switched, you violated the **Sure Thing Principle**. EU calls this irrational."

  **The REU Solution:**
  "Risk-Weighted Expected Utility (REU) says risk attitude is a separate parameter from how much you value the prize.
  *   **EU:** Maximize $\sum p \cdot u(x)$. (Risk aversion comes from curved $u$).
  *   **REU:** Maximize $\sum r(p) \cdot \Delta u$. (Risk aversion comes from a risk-function $r$).
  *   In REU, you weight utility increments by the probability of doing *at least that well*.
  *   **Round 1:** The '10 Slots for sure' gets a massive boost because the risk-function $r(p)$ overweights certainty (probability 1.0).
  *   **Round 3:** Once certainty is off the table (because the 'common consequence' was removed), you stop overweighting the safe option. You look at the upside (100 slots) and take it.
  *   REU says this switch is **rational**. It captures the intuition that 'certainty is special'."

  ### Step 3: The Cost & Pumpability (10 mins)
  **The Cost of Consistency:**
  "To be an EU maximizer, you must suppress the feeling that 'certainty is special.' You have to accept that a 1% chance of ruin is just mathematically equivalent to a shift in probability elsewhere. REU lets you keep that intuition, but it costs you the Independence Axiom."

  **Pumpability (Dynamic Inconsistency):**
  "Here is the danger. If you know you will switch preferences in Round 3 *before* you get there, you are vulnerable.
  *   Imagine I let you pay 1 Slot to switch from Risky to Safe in Round 1.
  *   Then I give you the News (Round 3).
  *   You now prefer Risky. I let you pay 1 Slot to switch back.
  *   I have 'pumped' 2 Slots from you, and you are back where you started.
  *   REU agents must plan ahead (naive vs. sophisticated choice) to avoid being money-pumped. EU agents never face this."

  ## 4. Predictable Pitfalls (Instructor Notes)

  1.  **The "Utility Curvature" Objection:**
      *   *What happens:* A student argues, "100 slots isn't 10x better than 10 slots because winning is already unlikely."
      *   *Fix:* Reiterate the mechanism. "If you have 10 slots, your chance is 0.1%. If you have 100, it's 1%. The prize value ($50) is constant. The math is linear. Your *feeling* might be non-linear, which is exactly what REU measures."
  2.  **Round 3 Confusion:**
      *   *What happens:* Students think the game is over because "the ball was drawn."
      *   *Fix:* "The ball is drawn, but I haven't looked at it yet, except to check if it's 11-99. It isn't. The game still proceeds with the remaining possibilities."
  3.  **Low Stakes Apathy:**
      *   *What happens:* Students pick randomly because $50 doesn't matter.
      *   *Fix:* Gamify it. "The person with the most slots at the end gets a bonus prize" OR simply emphasize that this is a test of their rationality, which philosophy majors care about.
  4.  **The "News" implies Probability Change:**
      *   *What happens:* Students think the probabilities have changed (Conditional Probability).
      *   *Fix:* They *have* changed conditionally, but the *ratio* between the options in the remaining states is what matters. EU says the preference ordering shouldn't flip. REU explains why it does.

  ## 5. What the Game Can't Reproduce

  Be honest with the class about the limitations of the simulation:

  1.  **Learning Effects:** In real life, if you get "pumped" (lose money for inconsistent choices), you learn to stop. This is a one-shot game. REU is most plausible when agents don't get feedback loops that punish inconsistency.
  2.  **State-Dependence:** The game assumes the utility of the $50 card is the same regardless of the "state" (which ball is drawn). In real life, getting $50 when you're broke (State A) feels different than getting $50 when you're rich (State B). REU handles this, but the game abstracts it away.
  3.  **The "Risk Function" Source:** The game shows *that* they weight risk differently, but it doesn't explain *why*. Is it fear? Regret? Excitement? REU is a formal model, not a psychological explanation.

  ## 6. Instructor Cheat Sheet (The Math)

  *Keep this for your reference during Q&A.*

  **Expected Utility (EU):**
  $$EU(A) = \sum p_i u(x_i)$$
  Violating Independence (Allais) = Irrational.

  **Risk-Weighted EU (REU):**
  $$REU(A) = \sum_{i} [r(P(\ge x_i)) - r(P(\ge x_{i+1}))] \cdot u(x_i)$$
  *   $u(x)$: Value of the prize (Linear in this game).
  *   $r(p)$: Risk attitude function.
      *   If $r(p) = p$, REU = EU.
      *   If $r(p)$ is convex (e.g., $p^2$), you are risk-averse (overweight certainty).
  *   **Round 1:** The jump from 99% to 100% certainty is weighted heavily by convex $r(p)$.
  *   **Round 3:** The jump is from 10/11 to 11/11. The "certainty boost" is smaller relative to the risk.
  *   **Result:** You can rationally prefer Safe in R1 and Risky in R3.
