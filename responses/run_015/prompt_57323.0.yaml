      *   *Currency:* "Raffle Tickets" for a $50 Amazon Card. 1 Ticket = 1 Entry. Total entries = sum of all tickets distributed to class + 50 "house" tickets to keep odds reasonable? No, just sum of tickets won. If Student A gets 10 and Student B gets 100, B is 10x more likely to win. This ensures linearity.
      *   *Materials:* Printed choice sheets, a clear urn, 100 numbered ping pong balls (or slips of paper), the Prize.
      *   *Timing:*
          *   Intro/Currency setup: 10 mins.
