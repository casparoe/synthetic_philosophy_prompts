prompt: |-
  I teach a 24-person seminar on rational choice — philosophy majors, almost no probability background — and I've got one 80-minute slot to make them feel why risk-weighted expected utility isn't just expected utility with a curvy utility function. Design a runnable activity where the whole point is that risk attitude is its own parameter, separate from the shape of your utility function. The class currency needs to have roughly linear marginal utility (raffle tickets, free-minutes, whatever) so nobody can explain away their own choices as diminishing returns. Stage it in three rounds: an Allais-style pair at trivial stakes, the same pair scaled up hard, and then a round where they get a piece of news that doesn't change which option is better in any state, and they choose again. They shouldn't hear the words "expected utility" until after round three. Give me the rules, the materials, the payoff scheme (no real money), and a debrief that maps what they actually did onto the idea of weighting each utility increment by the probability of doing at least that well, is straight about what they'd have to give up to keep it, and asks whether the news round leaves them pumpable. Also: what will predictably go sideways the first time I run it, and which feature of the view a classroom game just cant reproduce.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 24 Philosophy majors, seminar style, almost no probability background.
      *   **Topic:** Risk-Weighted Expected Utility (REU) vs. Expected Utility (EU).
      *   **Core Goal:** Demonstrate that risk attitude is a separate parameter from utility curvature (diminishing marginal utility).
      *   **Constraints:**
          *   One 80-minute slot.
          *   Class currency must have linear marginal utility (no "I chose the safe option because $100 means less to me than $10").
          *   Three Rounds:
              1.  Allais-style pair (trivial stakes).
              2.  Same pair (scaled up stakes).
              3.  News round (irrelevant information, state-independent).
          *   No mention of "Expected Utility" until *after* Round 3.
          *   Deliverables: Rules, Materials, Payoff Scheme, Debrief (mapping choices to REU, cost of consistency, pumpability), Predictable Pitfalls, Limitations of the Game.

  2.  **Deconstruct the Core Concept (REU vs. EU):**
      *   *EU:* Maximize $\sum p_i \cdot u(x_i)$. Risk aversion is explained entirely by concave $u(x)$.
      *   *REU (Buchak):* Maximize $\sum [r(P(\ge x_i)) - r(P(\ge x_{i+1}))] \cdot u(x_i)$, or more intuitively, weight outcomes by a risk function $r(p)$ applied to cumulative probabilities. Risk attitude is a separate function $r$, distinct from $u$.
      *   *The Problem:* In standard EU, if you violate Independence (Allais Paradox), you're "irrational." In REU, you can violate Independence rationally if you have a specific risk attitude.
      *   *The Challenge:* Students usually conflate risk aversion with diminishing marginal utility. To show they are separate, the currency *must* feel linear. Raffle tickets for a single fixed prize are the standard philosophical move here.

  3.  **Designing the Currency (Linear Marginal Utility):**
      *   *Idea:* Raffle tickets for a specific, desirable prize.
      *   *Why:* One ticket = 1/N chance. Two tickets = 2/N chance. The utility of the prize is fixed; the probability scales linearly with tickets. This isolates probability weighting from utility curvature.
      *   *Prize:* Needs to be desirable enough to care, but small enough to be trivial. A $50 Amazon gift card or "Homework Pass" (if allowed). Let's go with a $50 Gift Card. It's universal.
      *   *Mechanism:* 1 Ticket = 1 Entry. Draw at the end of class.

  4.  **Designing the Three Rounds:**

      *   **Round 1 (Allais Common Consequence - Trivial):**
          *   Need a classic Allais structure but simplified for non-math majors.
          *   Option A: 100% chance of 10 tickets.
          *   Option B: 10% chance of 100 tickets, 89% chance of 10 tickets, 1% chance of 0.
          *   *Wait, standard Allais:*
              *   1A: 100% of $1M.
              *   1B: 10% $5M, 89% $1M, 1% $0.
              *   2A: 11% $1M, 89% $0.
              *   2B: 10% $5M, 90% $0.
          *   *Adaptation for Tickets:*
              *   **Choice 1:**
                  *   Safe: 10 Tickets (100%)
                  *   Risky: 11% chance of 100 Tickets, 89% chance of 10 Tickets. (Wait, this is boring).
              *   Let's use the standard Common Consequence setup.
              *   **Decision 1:**
                  *   Option S (Safe): 10 Tickets for sure.
                  *   Option R (Risky): 10% chance of 100 Tickets, 89% chance of 10 Tickets, 1% chance of 0 Tickets.
              *   **Decision 2:**
                  *   Option S' (Safe): 11% chance of 10 Tickets, 89% chance of 0.
                  *   Option R' (Risky): 10% chance of 100 Tickets, 90% chance of 0.
          *   *EU Prediction:* If you prefer S in Dec 1, you must prefer S' in Dec 2 (Independence Axiom).
          *   *REU Prediction:* A risk-averse agent (concave risk function) might prefer S (certainty effect) and R' (higher upside when safety is gone).

      *   **Round 2 (Scaled Up):**
          *   The prompt asks for "same pair scaled up hard."
          *   If we scale the *tickets*, does it change anything? If utility is linear in tickets, scaling tickets just scales utility linearly. EU says choices shouldn't change. REU says choices shouldn't change (risk function is over probability, not value).
          *   *Correction:* The prompt asks to scale stakes to see if they feel the risk more. But if the currency is linear (raffle tickets), scaling the *number of tickets* shouldn't change EU preferences. However, psychologically, "100 tickets" feels different than "10 tickets."
          *   *Alternative Interpretation:* Scale the *Prize*? No, that changes utility curvature potentially.
          *   *Best Interpretation for REU:* Keep the structure, multiply the ticket counts by 10.
          *   **Decision 3 (Scaled):**
              *   Option S: 100 Tickets for sure.
              *   Option R: 10% chance of 1000 Tickets, 89% chance of 100 Tickets, 1% chance of 0.
              *   Option S': 11% chance of 100 Tickets, 89% chance of 0.
              *   Option R': 10% chance of 1000 Tickets, 90% chance of 0.
          *   *Goal:* Show that even with "more to lose," the pattern holds. Or, show that EU demands consistency regardless of scale.

