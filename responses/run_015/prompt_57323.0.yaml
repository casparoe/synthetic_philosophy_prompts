      *   *The "News" Round:* Needs to be careful. If I tell them "The 89% didn't happen," I am changing the probabilities. The prompt says "news that doesn't change which option is better in any state." This refers to the **Sure Thing Principle**.
      *   *Revised Round 3:* Use the "Envelope" method.
      *   Setup: There are 100 states.
      *   Option S: Payoff X in states 1-89, Payoff Y in states 90-100.
      *   Option R: Payoff X in states 1-89, Payoff Z in states 90-100.
      *   News: "I looked at the state. It is NOT in 1-89."
      *   Since Payoff X was identical in 1-89, this news shouldn't change preference between Y and Z.
      *   *Implementation:*
          *   Round 1 was: S (10 sure) vs R (10% 100, 89% 10, 1% 0).
          *   Round 3: "I have rolled a 100-sided die. I will not tell you the number, BUT I will tell you it is NOT between 1 and 89."
          *   Now they choose again between S and R *given* this news.
          *   Effectively, they are choosing between:
              *   S_cond: 10 tickets (if 90-99), 10 tickets (if 100). -> 10 tickets sure.
              *   R_cond: 100 tickets (if 90-99), 0 tickets (if 100).
