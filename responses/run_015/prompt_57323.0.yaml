      *   Since $V$ and $T_{total}$ are constant for the student at the moment of choice, $U$ is linear in $T$.
      *   *Warning:* Students might think "100 tickets is way better than 10 tickets" in a non-linear way. I need to emphasize: "One ticket is one chance. Ten tickets is ten chances. The prize doesn't change."

  8.  **Finalizing the Activity Flow:**
      *   **Intro:** Establish the Prize and the Ticket Currency. Emphasize Linearity.
      *   **Round 1:** Classic Allais (Certainty vs. Risk).
      *   **Round 2:** High Stakes (Multiply tickets by 10).
      *   **Round 3:** The "Common Consequence" Reveal (The News).
