  Here is the read on Jordan, based on the trail of verdicts she's left you with.

  **The Verdict:**
  Jordan is going to say **no, that resulting kid is not you.**

  **The Rule She's Running:**
  She is implicitly running **Strict Gametic Token Essentialism**.

  This is a hardline, Kripkean position, but granularized. Kripke argued you couldn't have come from different *parents*. Jordan has tightened the screw: you can't come from different *gametes*. Her rejection of the clone (Verdict 5) proves she doesn't care about genetic identity (the "code"); she cares about the **historical particularity of the biological materials**. To her, "you" are not a pattern of DNA; you are a specific historical event involving specific physical cells.

  In your synthetic egg scenario, even though the nuclear DNA is your parents', the *egg cell itself* is not your mother's egg cell. It is a synthetic construct *containing* a part of your mother's cell. Because the physical particular (the ovum) that participated in fertilization was not the actual biological token that your mother produced, the origin chain is broken. It's functionally equivalent, genetically identical, and materially continuous regarding the nucleus, but it fails the **Token Identity** test. She views the egg as an indivisible particular, not a container for a nucleus.

  **The Ammo for Round Two:**
  To prove definitively that she is a Token Essentialist (specific cell matters) rather than a Maternal Source Essentialist (mom's biological material matters), throw this at her:

  **The "Sister Egg" Swap:**
  > "Imagine Mom ovulates two eggs this month: Egg A and Egg B. In reality, you came from Egg A. But in this scenario, scientists take the *nucleus* from Egg A and insert it into the *cytoplasm* of Egg B (which is also Mom's, just a different physical cell). They fertilize that hybrid with Dad's actual sperm. Is that you?"

  **Why this settles it:**
  *   If she says **YES**: She is a **Maternal Source Essentialist**. She cares that the material came from your mom, but she doesn't care about the specific cell token. This would contradict her stance on the synthetic egg *unless* she thinks "natural vs. synthetic" is the magic boundary.
  *   If she says **NO**: She is a **Strict Token Essentialist**. It confirms that *this specific physical egg* is necessary, not just "an egg from mom." This locks her into the view that identity is tied to the spatiotemporal history of the exact cells involved, making her position consistent with her cloning verdict but extremely vulnerable to "Ship of Theseus" attacks on cellular turnover.

  Bet on the "No." Her cloning verdict shows she's willing to sacrifice genetic identity for origin integrity; she won't sacrifice cell integrity for genetic identity.
