      *   *Faro:* It's a genuine counterexample to *random* shuffling. It shows that dynamics matter. Physical laws are reversible (like Faro) but chaotic (like Riffle). The analogy holds if "shuffle" implies "chaotic mixing."
      *   *Codebook:* Shows entropy is relative to *macroscopic variables*, not arbitrary human whim. The "Pi" observer is tracking a variable that doesn't couple to thermodynamic interactions. So the arrow isn't purely subjective, but it depends on the *interaction scale*.
