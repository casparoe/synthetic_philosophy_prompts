  5.  **Analyzing the Conclusions:**
      *   *Conclusion 1 (Boundary Condition):* Supported by the analogy *if* we accept the sealed deck as a brute fact. But Point 3 suggests the "factory" hides the real explanation.
      *   *Conclusion 2 (Perspectival):* Supported by the statistical nature. If you start in the middle, you likely came from higher entropy in the past *unless* you are in a fluctuation. But the "Past Hypothesis" breaks the symmetry globally. Locally, yes; globally, no.
      *   *Conclusion 3 (Observer-Relative):* This is the trickiest. Entropy *is* coarse-grained. But the "Pi" objection shows that *arbitrary* coarse-graining makes entropy meaningless. Physics relies on *dynamically relevant* coarse-graining. So Conclusion 3 is too strong as stated.

