      *   *Standard Philosophical Interpretation:* This is often used in decision theory (Gibbard & Harper, 1978). It highlights the difference between *causal decision theory* (CDT) and *evidential decision theory* (EDT). The servant *cannot* change the outcome by moving. If he is destined to die in Damascus, going there kills him. If he is destined to die in Aleppo, staying kills him. But he doesn't know which state obtains.
