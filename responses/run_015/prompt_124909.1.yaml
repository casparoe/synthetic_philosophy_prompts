      *   *Tone:* Professional, slightly weary but sharp.
      *   *Length:* Keep the procedure tight.
      *   *Specific Requirement:* "Brainstorm two or three candidate procedures... note what each one loses." -> Must include this at the start.
      *   *Specific Requirement:* "Explicit flag on every step that is really a judgement call." -> Use [J] or similar.
      *   *Specific Requirement:* "Tell me what an analyst should do when a number cannot be obtained." -> Add a preamble rule.

  8.  **Final Polish:**

      *   Ensure the distinction between "Fact Gates" (Analyst decides) and "Value Gates" (Trustee decides) is clear.
      *   Make sure the "Recursive Enforcement" point is clear in the procedure.
