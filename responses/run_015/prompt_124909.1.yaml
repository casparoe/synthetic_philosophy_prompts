  *(Self-Correction during drafting)*: I initially thought about making the procedure a flowchart. Text is better for the prompt's "readable in fifteen minutes" constraint within a document format. I will use a numbered list with clear STOP commands.
  I need to make sure I don't sound *too* academic. The user wants a checklist for intelligent non-specialists.
  The "Missing Data" rule needs to be prominent.
  The "Proposal 3" section needs to hurt a bit, as requested.

  9.  **Final Output Generation** (incorporating all above thoughts).
answer: |-
  ### Candidate Procedures

  **1. The Payoff Matrix Reconstruction**
  We attempt to quantify the costs and benefits of cooperation versus defection for every relevant actor, constructing a literal game matrix to see if the Nash Equilibrium shifts.
  *Loss:* It demands data the proposals do not have. It gives a false veneer of precision to wild guesses, and trustees will glaze over at the sight of algebra.

  **2. The Institutional Viability Scorecard**
  We score proposals on weighted criteria (governance, monitoring, sanctions, inclusivity) to generate a 'viability percentage'.
  *Loss:* It allows high scores on governance to mask fatal flaws in incentives. A beautifully governed arrangement that nobody has a reason to join still scores well.

  **3. The Coordination Stress Test (Recommended)**
  A sequential gatekeeping flow. If a proposal fails a critical game-theoretic constraint, we stop. It prioritises binary failure modes over gradual scoring.
  *Loss:* It is cynical. It may kill nascent initiatives that require capacity building before they can solve incentive problems, and it feels less 'constructive' to applicants.

  ***

  ### The Coordination Stress Test

  **Analyst Note on Missing Data:**
  If a number or fact cannot be obtained within your one-day limit, do not average it. Assume the worst-case incentive scenario. If the proposal relies on a number that does not exist, mark that step as **[J]** (Judgement Call) and pass it to the trustees with a warning that the factual basis is missing.

  **Instructions:**
  Proceed through the gates in order. If you reach a **STOP**, the recommendation is 'No'. If you reach a **TRUSTEE GATE**, prepare a one-page brief on the value conflict and let the committee decide. If you pass all gates, recommend 'Yes'.

  #### Gate 1: The Structure of the Problem
  **Question:** Is the bad outcome caused by a structural incentive (Prisoner's Dilemma/Tragedy of the Commons) where everyone loses if everyone races, but individuals gain by racing? Or is it caused by a few identifiable bad actors who could be sanctioned or excluded?
  *   **Sufficient Answer:** Evidence that restraint is collectively optimal but individually costly.
  *   **Fail Condition:** The problem is caused by <10% of actors who are simply rogue. (Solution: Sanction them, do not fund a collective pact).
  *   **Judgement Flag:** [J] Distinguishing between 'culture of racing' and 'structural incentive' is often interpretive.
  *   **Action:** If structural, proceed. If actor-specific, **STOP**.

  #### Gate 2: Valuation of the Good
  **Question:** Who values the 'good' being protected from the race?
  *   **A:** The racers themselves (e.g., stability, avoiding regulation).
  *   **B:** Only outsiders (e.g., public safety, environment).
  *   **C:** Nobody (it is a purely positional arms race).
  *   **Sufficient Answer:** Clear identification of who benefits from restraint.
  *   **Fail Condition:** Type C (purely positional) unless the cost of the race is catastrophic. Type B requires an external enforcement mechanism; if the proposal relies on racer altruism, **STOP**.
  *   **Action:** If Type A, proceed. If Type B, note need for external leverage. If Type C, **STOP**.

  #### Gate 3: The Entrant Margin
  **Question:** If the signatories restrain themselves, does a new actor (non-signatory) gain a massive advantage by entering and racing?
  *   **Sufficient Answer:** Analysis of market share or capability of non-signatories.
  *   **Fail Condition:** Non-signatories hold >20% of the relevant capacity OR barriers to entry are low.
  *   **Judgement Flag:** [J] Predicting market entry is speculative.
  *   **Action:** If the race simply shifts to new entrants, **STOP**.

  #### Gate 4: Axis Relocation
  **Question:** If we suppress competition on Dimension X (e.g., compute), where does the competition move? (e.g., talent hoarding, jurisdictional arbitrage, algorithmic efficiency).
  *   **Sufficient Answer:** The proposal must name the likely new axis and explain why competition there is less destructive.
  *   **Fail Condition:** The proposal claims 'competition will stop' without naming a relocation axis.
  *   **Action:** If the new axis is more dangerous or harder to monitor, **STOP**.

  #### Gate 5: Detection Latency
  **Question:** Can a defection be verified before the defector secures the advantage?
  *   **Sufficient Answer:** Time-to-detect < Time-to-gain.
  *   **Fail Condition:** The gain from cheating is immediate (e.g., deploying a model), but verification takes months.
  *   **Judgement Flag:** [J] Technical assessments of monitoring capability are often optimistic.
  *   **Action:** If latency is too high, **STOP**. No monitoring regime saves this.

  #### Gate 6: Asymmetry and Residual Risk
  **Question:** If the arrangement partly fails, does it degrade gracefully or catastrophically? Who bears the risk?
  *   **Sufficient Answer:** Identification of who loses if the pact frays.
  *   **Fail Condition:** Failure imposes catastrophic risk on non-signatories or the public, while signatories retain profits.
  *   **Action:** If the downside is socialised and the upside privatised, **STOP**.

  #### Gate 7: Recursive Enforcement
  **Question:** Who enforces this arrangement? Are *they* subject to a race?
  *   **Sufficient Answer:** The enforcer (auditor, secretariat, regulator) has incentives aligned with compliance, not growth or revenue.
  *   **Fail Condition:** The enforcers are paid by the racers to certify them (conflict of interest) or are competing for prestige/funding.
  *   **Action:** If the enforcers are racing, **STOP**.

  #### TRUSTEE GATE: Values vs Facts
  If the proposal passes all gates but relies on uncertain probabilities (e.g., 'There is a 40% chance this prevents war'), hand to trustees.
  *   **Analyst Note:** 'We cannot prove this will work, but the incentives are aligned.'
  *   **Trustee Decision:** Is the potential upside worth the risk of failure? This is a value judgement, not a technical one.

  ***

  ### Application of the Procedure

  Here is the test applied to your three current proposals.

  #### Proposal 1: AI Compute Pledge
  *Nine frontier developers pledge no training above threshold until evaluation regime exists. Evaluators funded by developers.*

  *   **Gate 1 (Structure):** Pass. It is a classic dilemma; all prefer safety, each gains by speeding up.
  *   **Gate 2 (Valuation):** Pass (Type B). Outsiders value safety. *Note:* Relies on racer altruism for enforcement, which is risky.
  *   **Gate 3 (Entrants):** **Fail.** You state 'most but not all' credible actors are signed. In AI, one non-signatory with sufficient capital negates the safety benefit for everyone else while capturing the market lead. The incentive for signatories to defect quietly becomes overwhelming.
  *   **Gate 4 (Axis):** **Fail.** If compute is capped, competition moves to algorithmic efficiency or data quality, which are harder to monitor than compute. The proposal does not explain why this axis is safer.
  *   **Gate 5 (Latency):** **Fail.** A model can be trained and deployed before an audit reveals the compute usage. The gain is immediate; verification is lagging.
  *   **Gate 7 (Recursion):** **Fail.** Evaluators are funded by the developers. They are in a race for future contracts. They will face pressure to certify quickly.
  *   **Verdict:** **STOP.** Do not fund. The incentive structure collapses under the weight of non-signatories and conflicting auditor interests.

  #### Proposal 2: Subcontracting Audit Standard
  *15 small/mid firms adopt safety standard. 4 largest buyers (60% market) declined. Compliance costs fall on signatories.*

  *   **Gate 1 (Structure):** **Fail.** This is not a race among the subcontractors; it is a procurement demand problem. The 'race' is driven by the buyers demanding lower costs.
  *   **Gate 2 (Valuation):** **Fail (Type B).** The signatories bear the cost; the buyers get the safety benefit. Without buyer participation, the signatories are pricing themselves out of the market.
  *   **Gate 3 (Entrants):** **Fail.** The 'entrants' here are actually the dominant incumbents (the 4 buyers). They can simply switch contracts to non-signatory firms.
  *   **Gate 6 (Asymmetry):** **Fail.** If the arrangement fails, the signatory firms go bankrupt. The buyers lose nothing. Residual risk is entirely on the weakest actors.
  *   **Verdict:** **STOP.** This is not a coordination solution; it is unilateral disarmament. Fund only if the buyers are brought to the table as signatories with skin in the game.

  #### Proposal 3: Norm-Building Programme
  *Two-year convening, secretariat, summit, shared vocabulary, pledge text. No monitoring. No change to payoffs. Half-promised to an ally.*

  *   **Gate 1 (Structure):** **Fail.** You explicitly state there is 'no change to anyone's payoffs'. If the payoffs do not change, the Nash Equilibrium does not move. A race to the bottom is driven by payoffs, not vocabulary.
  *   **Gate 5 (Latency):** N/A. There is no detection mechanism.
  *   **Gate 7 (Recursion):** **Fail.** The secretariat is funded to build norms. Their metric of success is 'activity' (summits held, pledges signed), not 'outcomes' (races stopped). They are racing for relevance.
  *   **Verdict:** **STOP.**
  *   **Analyst Comment:** This is not an intervention; it is a social event. You are being asked to fund a discussion because the ally cannot solve the incentive problem. Trustees may like the 'soft power' aspect, but procedurally, this cannot stop a race. It creates the appearance of coordination without the substance. If you fund this, you are subsidising hope, not changing incentives. I recommend withdrawing the half-promise.

  ***

  ### Limitations of the Procedure

  This tool is a sieve, not a crystal ball. It has three structural blind spots you must accept:

  1.  **Preference Transformation:** The procedure assumes preferences are fixed. It cannot evaluate interventions that genuinely change what actors *want* (e.g., deep cultural shifts over decades). It will systematically underrate long-term education or moral advocacy where the payoff horizon exceeds the grant cycle.
  2.  **The 'First Mover' Paradox:** It requires a critical mass to pass Gate 3 (Entrants). It will reject proposals that need seed funding to *reach* that critical mass. You will need a separate, small 'seed' budget outside this procedure for high-risk coordination experiments.
  3.  **Procedural Paralysis:** The greatest risk is not funding a failure, but funding nothing. When analysts flag too many **[J]** judgements, trustees may become risk-averse. To prevent this, you must mandate that the committee makes a value decision on any proposal that passes the factual gates, even if the probability of success is uncertain. Do not let the procedure become a reason to abstain from action.
