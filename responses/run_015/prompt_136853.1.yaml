          3.  Circularity of "Effective Calculability" (Can it be defined without assuming CTT?).
      *   **Requirements:** Rank 1-3 (1 = most fundamental alteration), brief paragraph for each, defend ordering by identifying the nature of the issue (conceptual, mathematical, empirical) and the downstream impact (collapse other debates vs. leave intact).

