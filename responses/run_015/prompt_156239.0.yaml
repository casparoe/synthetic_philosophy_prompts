answer: |-
  This is a classic case of a mathematically rigorous theorem being used to do more philosophical heavy lifting than it can support. Your instinct that the "interpersonal comparison" bit is the weak link is correct, but the sleight of hand is spread across a few different steps.

  Since you have the math background, I will treat the theorem as a theorem (which it is) and focus on the mapping between the mathematical variables and the philosophical concepts. Social choice theorists generally accept the math of Harsanyi's result but reject the pop-book's interpretation of what the math *means* for ethics.

  Here is the claim-by-claim breakdown.

  ### 1. The Aggregation Theorem: "Sum of Utilities" vs. "Weighted Sum"
  **The Book's Claim:** Rationality (VNM) + Pareto $\rightarrow$ Social Welfare = Sum of Utilities.
  **The Friend's Claim:** It's a *Weighted* Sum. Dropping "weighted" is load-bearing.
  **Verdict:** **Your friend is right.** This is not a minor distinction; it is the entire ethical content of the result.

  **The Math:** Harsanyi's Aggregation Theorem proves that if individual preferences and social preferences both satisfy VNM axioms, and the social preference satisfies the Pareto principle, then the social utility function $W$ is a linear combination of individual utility functions $u_i$:
  $$W = \sum_{i=1}^n a_i u_i + c$$
  where $a_i \geq 0$.

  **The Philosophy:** The coefficients $a_i$ are the moral weights. The theorem *does not* prove that $a_i = a_j$. It only proves they are non-negative. To get the "Sum" (implying $a_i = 1$ for all $i$), you must add an **Anonymity** or **Symmetry** condition (i.e., "swapping two people's utilities shouldn't change the social ranking").
  *   **Settled:** Everyone agrees the theorem yields a *weighted* sum.
  *   **Contested:** Whether adding Anonymity is a requirement of "rationality" or a separate moral commitment. Most philosophers argue it is a moral commitment (egalitarianism).
  *   **Why it matters:** If $a_1$ is huge and $a_2$ is tiny, the "utilitarian" society effectively ignores person 2. The book claims rationality forces utilitarianism; in reality, rationality + Pareto only forces *Welfarism* (social good depends only on individual goods). The specific *Utilitarian* structure (equal weights) requires an extra ethical axiom the book hides.

  ### 2. Interpersonal Comparisons: "Avoided" vs. "Smuggled"
  **The Book's Claim:** No interpersonal comparisons needed. Rescaling is absorbed automatically.
  **Verdict:** **Misleading / Wrong.**

  **The Math:** VNM utilities are unique only up to positive affine transformation ($u' = \alpha u + \beta$, with $\alpha > 0$). This means Person A's "10 utils" and Person B's "10 utils" have no inherent relationship. You can stretch Person A's scale arbitrarily.
  **The Problem:** Look at the equation $W = \sum a_i u_i$. If I rescale Person 1's utility by multiplying by 1,000 ($u_1' = 1000 u_1$), the value of $W$ changes drastically *unless* I simultaneously divide the weight $a_1$ by 1,000.
  **The Sleight of Hand:** The book argues that because the *social ordering* remains invariant (if you adjust weights to match scales), you don't need comparisons. But to *calculate* or *apply* the social welfare function, you must fix the scales and the weights relative to each other.
  *   **Settled:** You cannot compute the sum without fixing the units of $u_i$ across persons. Fixing the units *is* an interpersonal comparison.
  *   **Contested:** Whether the theorem *assumes* them at the start. The theorem assumes a social ordering *exists*. If that ordering exists, it implicitly contains the comparisons. The book tries to say, "We don't need to measure the comparisons to prove the form," which is true, but then implies, "Therefore we don't need comparisons to make policy," which is false.
  *   **Bottom Line:** Your friend is correct. The weights $a_i$ and the scales of $u_i$ together determine moral importance. You cannot determine them by rationality alone. You need a moral metric to say "one unit of Alice's utility equals one unit of Bob's."

  ### 3. The Veil of Ignorance: Equal Probabilities
  **The Book's Claim:** Rationality behind the veil requires equal probability ($1/N$) for being anyone.
  **Verdict:** **Contested / Philosophically Load-Bearing.**

  **The Argument:** This is Harsanyi's *Impartial Observer Theorem*. If you don't know who you are, you maximize Expected Utility: $E[U] = \sum p_i u_i$. The book claims rationality dictates $p_i = 1/N$.
  **The Objection:** This relies on the **Principle of Insufficient Reason** (if you have no evidence for A over B, assign equal probability).
  *   **Settled:** Modern Bayesian decision theory does *not* require this. It is perfectly rational to have undefined priors or to refuse to assign probabilities under total ignorance.
  *   **Contested:** Whether "impartiality" *means* "equal probability."
      *   **Harsanyi's view:** Yes, impartiality is probabilistic equality.
      *   **Rawls's view:** No, impartiality means you don't use probabilities at all because there is no objective basis for them.
  *   **Why it matters:** Assigning $p_i = 1/N$ is not a logical truth; it is a specific ethical stance on how to value identities. If you assign $p_i$ based on population density, or social contribution, or any other factor, you get a different weighted sum. The "equal probability" assumption is doing the work of the "equal weight" assumption in the Aggregation Theorem. It's the same moral premise dressed in probability theory.

  ### 4. The Rawls Critique: "Irrational Risk-Aversion"
  **The Book's Claim:** Rawls's Maximin is just irrational risk-aversion.
  **Verdict:** **Unfair / Category Error.**

  **The Distinction:** Decision theory distinguishes **Risk** (known probabilities) from **Uncertainty** (unknown probabilities).
  *   **Harsanyi:** Models the Veil as *Risk*. He assumes the probabilities are known (equal). Under Risk, Maximin is indeed usually irrational (you ignore huge gains for tiny safety margins).
  *   **Rawls:** Models the Veil as *Uncertainty* (or "radical ignorance"). He explicitly argues you cannot assign probabilities to social positions. Under Uncertainty, Maximin is a standard, rational decision rule (e.g., in game theory against a malicious opponent, or when outcomes are catastrophic).
  *   **Settled:** Rawls is not claiming Maximin is rational under *known* equal probabilities. He is claiming the probabilities are *not known*.
  *   **Verdict:** The book attacks a straw man. It forces Rawls into Harsanyi's probabilistic framework, shows he fails, and declares victory. But Rawls rejects the framework. Whether Rawls is right to reject it is a deep philosophical dispute, but calling it "irrational" ignores that he is operating under a different decision-theoretic regime (Uncertainty vs. Risk).

  ### 5. Distribution and Inequality
  **The Book's Claim:** The theorem says nothing about distribution; inequality must be argued on separate grounds.
  **Verdict:** **Technically True, but Misleading.**

  **The Nuance:** The theorem aggregates *utilities*, not resources.
  *   **Scenario A:** If individual utility is linear in income ($u = \$income$), then maximizing the sum ignores distribution. Giving \$1M to one person is equal to giving \$1 to a million people.
  *   **Scenario B:** If individual utility is concave in income (diminishing marginal utility, $u = \sqrt{\$income}$), then maximizing the sum *automatically* favors redistribution.
  **The Catch:** The theorem takes the $u_i$ functions as given. It doesn't tell you if they are concave or linear.
  *   **Settled:** The theorem itself is distribution-neutral *regarding resources*. It cares about the distribution of *utility*.
  *   **Contested:** Whether we should assume diminishing marginal utility of resources. Most economists do, which makes utilitarianism favor equality. But if the book implies utilitarianism *intrinsically* ignores inequality, that's wrong. It ignores inequality of *resources* only if utility is linear. However, it *does* ignore "equality for equality's sake" (prioritarianism). If two outcomes have the same total utility, utilitarianism is indifferent even if one is perfectly equal and the other is wildly unequal.

  ### 6. The Lottery Problem (Ex-Ante vs. Ex-Post)
  **The Book's Claim:** (Implied) The theorem recommends policies that maximize expected utility.
  **Your Instinct:** It can recommend a lottery where everyone ends up worse off.
  **Verdict:** **You are Correct.** This is a known feature called the **Ex-Ante vs. Ex-Post Conflict**.

  **The Example:**
  *   **Policy A:** Everyone gets 50 utils for sure.
  *   **Policy B:** Coin flip. Heads: Everyone gets 100. Tails: Everyone gets 0.
  *   **Calculation:** Policy A Total = 50N. Policy B Expected Total = 0.5(100N) + 0.5(0) = 50N.
  *   **Refinement:** Make Policy B slightly better ex-ante. Heads: 102. Tails: 0. Expected = 51.
  *   **Result:** Harsanyi's theorem recommends Policy B.
  *   **Outcome:** If Tails comes up, *everyone* gets 0, which is worse than the 50 they would have had under Policy A.
  **The Implication:** The theorem evaluates *prospects*, not *realized outcomes*. It satisfies Pareto ex-ante (everyone prefers the lottery beforehand) but can violate Pareto ex-post (everyone hates the result afterward).
  *   **Settled:** This is a standard critique of Harsanyi (often associated with the philosopher John Diamond). It shows that VNM rationality applied socially can conflict with a concern for realized equity. The book is hiding this by focusing only on the ex-ante calculation.

  ### 7. The Punchline: Does Rationality Force Utilitarianism?
  **The Book's Conclusion:** Utilitarianism isn't a moral premise; it's a result of rationality + Pareto.
  **Corrected Conclusion:** **Welfarism** is a result of Rationality + Pareto. **Utilitarianism** requires Rationality + Pareto + **Anonymity** + **Interpersonal Comparability** + **Risk-Neutrality regarding Identity**.

  **Does it collapse to something weaker?**
  Yes. It collapses to **Weighted Welfarism**.
  1.  **Weights:** You need a moral argument for equal weights ($a_i$). Rationality allows a dictator ($a_1=1, a_{others}=0$) as long as the Pareto principle isn't violated (which it isn't, if the dictator prefers everything society prefers). *Correction:* Actually, strict Pareto prevents dictatorship, but it allows arbitrary weights.
  2.  **Scales:** You need a moral argument for comparable scales.
  3.  **Risk:** You need a moral argument for treating identity as a lottery (Harsanyi) rather than a mystery (Rawls).

  **Summary of the "Sleight of Hand":**
  The book takes a **representation theorem** (which says "If you have these preferences, they can be *modeled* as a sum") and presents it as a **prescriptive derivation** (which says "You *ought* to maximize the sum").
  *   The math says: "Any social ordering satisfying Pareto looks *like* a weighted sum."
  *   The book says: "Therefore you *must* maximize the unweighted sum."
  *   The gap is filled by normative assumptions (equal weights, comparable units, equal probabilities) that the book labels as "rationality" to make them seem inevitable.

  ### Final Verdict for Your Reading
  *   **What to accept:** The mathematical derivation is sound. If you accept VNM for society and Pareto, social welfare is linear in individual utilities.
  *   **What to wince at:** The claim that this avoids interpersonal comparisons. It avoids *assuming* them as a premise, but requires them for application.
  *   **What is wrong:** The claim that "Sum" follows without "Weighted." The claim that Rawls is simply irrational (he disagrees on the decision rule under uncertainty). The claim that distribution is irrelevant (it depends on the curvature of $u_i$).
  *   **The Lottery:** Your reading is correct. The theorem is ex-ante, not ex-post.

  **The "Vibe" Check:** Your friend is being precise, not precious. In formal ethics, the difference between "Weighted Utilitarianism with arbitrary weights" and "Classical Utilitarianism" is the difference between "Some people matter more than others" and "Everyone counts for one." The book tries to derive the latter from the former using the label "Rationality." That is the oversell. Rationality gets you the linear form; Ethics gets you the weights.
