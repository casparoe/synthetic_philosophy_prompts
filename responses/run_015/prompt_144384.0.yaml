      *   *Argument from Illusion:* Since they look the same, they must share a common mental core (sense-data/experience). Disjunctivists deny this common core.
      *   *Key Concept:* "Subjective Indiscriminability." This is the hardest part to translate into PP, as PP usually assumes similar inputs/errors lead to similar posterior states.

  3.  **Translate to Predictive Processing (PP) Vocabulary:**
      *   *Veridical Perception:* Top-down predictions match bottom-up sensory input; prediction error is minimized via accurate model updating or action; precision weighting is optimal (aligned with environmental statistics).
      *   *Illusion/Hallucination:* Top-down predictions dominate or are mismatched; prediction error is minimized via ignoring sensory evidence (attenuating precision) or maladaptive priors.
      *   *Indiscriminability:* In PP, this implies the *posterior belief state* (the output of the inference) is functionally equivalent for the agent's downstream systems, even if the *generative process* causing it differs. Or, it implies the *precision-weighted prediction error* profile is identical at the level of conscious access.
      *   *Disjunctivist Claim in PP:* The *causal structure* of the inference differs fundamentally. In veridical cases, the posterior is constrained by high-precision sensory evidence. In illusory cases, the posterior is driven by high-precision priors despite low-precision/conflicting sensory evidence. They are not the same *computational trajectory*, even if the final posterior mean is similar.

