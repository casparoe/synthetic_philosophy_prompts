      *   *Attempt 2:* In veridical perception, precision is on the sensory channel. In illusion, precision is on the prior. The state is different because the precision weighting is different.
      *   *Refinement:* This is the key. Disjunctivism in PP isn't about the *content* (the mean of the posterior) but the *relation to the world* (the source of constraint).
