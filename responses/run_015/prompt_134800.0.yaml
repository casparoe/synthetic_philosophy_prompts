      *Expert Disagreement Point:* The circularity argument (Earman & Norton). Does Landauer's principle presuppose the Second Law? If so, is the explanation tautological? I should mention this as the "thing experts argue about" so the lecturer knows the ground is slightly shaky philosophically, even if physically robust.

      *Final check on the "Reversible Computing" objection:* If the demon computes reversibly, it doesn't erase. But it accumulates garbage. To run a cyclic engine, you must reset. If you don't reset, it's not an engine, it's a battery (the information storage). This distinction is vital.

