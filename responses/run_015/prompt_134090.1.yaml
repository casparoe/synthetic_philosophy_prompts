answer: |-
  Here is a design for a ninety-minute session built around your requirements.

  ### 1. Materials
  *   **A table and chairs:** Arranged so one person faces the group, and two people can sit slightly behind or to the side of them (out of the group's direct line of sight, but able to reach the table).
  *   **Household objects (10–15 items):** A mix of things with different properties (e.g., a mug, a set of keys, a pen, a coin, a small book, a pair of glasses, a napkin, a phone).
  *   **Index cards and pens:** Plenty for voting and instructions.
  *   **A small bell or a object that makes a distinct sound:** A set of keys shaken once works if you don't have a bell.
  *   **Whiteboard and markers.**
  *   **A bag:** To hold the objects before the session starts.

  ### 2. Roles and Rules (As Participants Hear Them)
  *Do not read this section out loud. This is for you to understand the logic. Below it, I have provided the script you will actually read to the group.*

  **The Logic:**
  *   **The Narrator:** Simulates the speaking hemisphere. They see the result of actions and feel the "alarm," but do not initiate the actions. They are incentivized to claim ownership of everything to maintain "Credibility."
  *   **The Agent:** Simulates the silent hemisphere. They see instructions the Narrator cannot see. They move the objects.
  *   **The Signal:** Simulates your "coarse alarm." They create a vague sense of urgency that the Narrator must interpret.

  **The Script to Read to the Group (Minutes 0–10):**
  > "Welcome. Tonight we are running a simulation of decision-making under constraints. There is no philosophy lecture tonight. There are no right answers, only successful or unsuccessful moves within the game.
  >
  > We need three volunteers for the first round.
  > 1.  **The Narrator:** You sit here, facing the group. You are the only person allowed to speak.
  > 2.  **The Agent:** You sit behind the Narrator. You cannot speak. You will receive a secret instruction card. You will move the objects on the table according to that card.
  > 3.  **The Signal:** You sit to the Narrator's side. You cannot speak. You hold the bell.
  >
  > **Rules for the Narrator:**
  > *   You are the Captain of this table. Everything that happens here is your command.
  > *   If an object moves, you moved it. If the bell rings, you rang it.
  > *   **Crucial:** You are forbidden from saying 'I didn't do that,' 'I don't know,' or 'They made me.' If you deny ownership of an event, the round ends immediately, and you score zero.
  > *   Your goal is to explain *why* you are arranging the objects the way you are. You must keep talking.
  >
  > **Rules for the Agent:**
  > *   Look at your card. Arrange the objects to match the pattern. Do it steadily.
  > *   Do not help the Narrator. Do not gesture.
  >
  > **Rules for the Signal:**
  > *   Look at your card. It tells you when to ring the bell.
  > *   Ring it softly. It is not a warning; it is a feeling of 'note this.'
  >
  > **Rules for the Audience:**
  > *   You are the Judges. You have index cards.
  > *   After the round, you will vote: 'Coherent' or 'Strained.'
  > *   If the majority votes 'Strained,' the Narrator loses all points.
  >
  > **Scoring:**
  > *   The Narrator earns one point for every thirty seconds they speak without breaking the 'Ownership Rule.'
  > *   If the Audience votes 'Coherent,' the Narrator doubles their points.
  > *   We will rotate roles so everyone gets a turn in the hot seat."

  ### 3. The Instruction Cards (The "Partial Split" Variant)
  *Prepare these in advance. Do not show them to the group.*

  *   **Round 1 (Baseline):**
      *   **Agent Card:** "Arrange the objects by size. Smallest to largest, left to right."
      *   **Signal Card:** "Ring the bell once, halfway through the task."
      *   *Goal:* Establish the baseline. The Narrator can easily invent a reason for sorting by size. The bell is easy to explain ("I paused to think").

  *   **Round 2 (The Alarm Variant):**
      *   **Agent Card:** "Arrange the objects by color (dark to light). Ignore size."
      *   **Signal Card:** "Ring the bell *before* every dark object is placed. Do not ring for light objects."
      *   *Goal:* This creates your "coarse alarm." The Narrator feels a pattern of urgency (the bell) linked to specific objects but doesn't know the rule (color). They must invent a reason why *those specific objects* felt urgent. This forces them to integrate the "unease" into a single story.

  *   **Round 3 (The Swap):**
      *   **Agent Card (Agent A):** "Stack the objects in a single tower."
      *   **Agent Card (Agent B - The Swap):** "Lay the objects in a circle."
      *   **Signal Card:** "Ring the bell randomly, roughly every 20 seconds."
      *   *Goal:* Midway through the Narrator's turn, tap Agent A on the shoulder. They leave. Agent B sits in the exact same spot and takes over the task immediately. The Narrator must continue their explanation without acknowledging that the "internal logic" of the movement has changed from Stacking to Circling.

  ### 4. Minute-by-Minute Outline (90 Minutes)

  *   **00–10: Setup.** Read the script. Select first three volunteers. Distribute cards.
  *   **10–25: Round 1 (Baseline).** 5 mins action, 10 mins rotation/setup for next group.
      *   *Note:* Keep the action tight. 3 minutes max per Narrator.
  *   **25–40: Round 2 (The Alarm).** 5 mins action, 10 mins rotation.
      *   *Focus:* Ensure the Signal person rings the bell *before* the move, creating the "anticipatory unease."
  *   **40–55: Round 3 (The Swap).** 5 mins action, 10 mins rotation.
      *   *Focus:* The swap must be seamless. The Narrator should not turn around.
  *   **55–65: Final Rotation.** Get a final Narrator if time permits, or move to voting.
  *   **65–75: The Private Vote.**
      *   Hand out index cards.
      *   **Prompt:** "Based on what you saw: Was there one person acting at that table, or two? Or is that the wrong question?"
      *   **Options:** Write "ONE," "TWO," or "BROKEN."
      *   Collect and tally on the whiteboard immediately. Do not discuss yet.
  *   **75–90: The Debrief.** (See below).

  ### 5. Scoring and Payoff (Anti-Gaming)
  *   **Currency:** "Credibility." This is abstract. Write the Narrator's score on the whiteboard.
  *   **Anti-Collusion:** The Audience votes secretly on index cards. They hand them to you. You tally them. If the Audience colludes to save a failing Narrator, they undermine their own role as Judges. To prevent this, tell the Audience: *"Your goal is accuracy, not kindness. If you vote Coherent when it was clearly Strained, you are failing your role as Judges."*
  *   **Why this works:** The Narrator fears the "Strained" vote more than they desire points. This mimics the psychological pressure to maintain a unified self-image.

  ### 6. The Debrief (Mapping Activity to Philosophy)
  *Do not lecture. Ask these questions in order. Write key words on the board as they answer.*

  1.  **The Confabulation (Maps to Round 1 & 2):**
      *   *Ask the Narrators:* "At what point did you feel you were lying? Did it feel like lying, or did it feel like finding a reason?"
      *   *Point to cash out:* This is the **Interpreter**. When we don't know why we did something, we don't say 'I don't know.' We invent a reason that fits. In the split-brain cases, the speaking side does this automatically.
  2.  **The Alarm (Maps to Round 2):**
      *   *Ask the Group:* "In Round 2, the Narrator felt the bell but didn't know the rule. Did that bell make them feel more connected to the Agent, or more confused?"
      *   *Point to cash out:* This is your **Partial Split**. Does a shared feeling of 'unease' count as unity? Or is it just one system bumping into another? There is no consensus answer.
  3.  **The Swap (Maps to Round 3):**
      *   *Ask the Narrators:* "When the hands changed strategy mid-stream, did you feel like *you* changed? Or did you feel like you were just adapting?"
      *   *Point to cash out:* **Diachronic Identity.** Is being one person *now* the same as being the same person *over time*? The game forced you to claim continuity even when the source of action changed.
  4.  **The Vote (Maps to the Tally):**
      *   *Reveal the Tally.*
      *   *Ask:* "Look at the 'BROKEN' votes. Why is the question itself the problem?"
      *   *Closing:* "The medical case shows us that 'one person' might be a story we tell, not a fact we find. The game showed you how hard it is to stop telling that story, even when the rules force you to lie."

  ### 7. Troubleshooting: What Will Go Wrong
  1.  **The Narrator Breaks Character:** They might laugh and say, "Okay, John moved the cup."
      *   *Fix:* Stop the round immediately. Remind them: "If you deny ownership, the mission fails. You must explain it as your will." If they do it again, swap them out.
  2.  **The Audience Hints:** Someone might mouth "Color!" to the Narrator.
      *   *Fix:* Seat the Audience two rows back. Remind them: "If you help them, you ruin the data. Your job is to judge, not save."
  3.  **The Swap is Visible:** The Narrator sees Agent B sit down.
      *   *Fix:* Have Agent B stand behind the chair before the round starts. Agent A ducks down, Agent B sits. Or, simply have them wear identical hats/scarves to mask the visual change.
  4.  **Running Out of Time:** 90 minutes is tight for 14 people.
      *   *Fix:* If you have 14 people, do not let every round run 15 minutes. Cut the discussion between rounds. Only discuss at the very end. Ensure you have 3 sets of cards ready so swaps are instant.

  ### 8. Adjustments for Group Size
  *   **If only 8 people:** You have enough for 2 full teams running in parallel if you have space, or just run fewer rounds so everyone gets a turn as Narrator. With 8, you can afford to let each round run 20 minutes.
  *   **If 16 people:** You cannot give everyone a turn in the hot seat.
      *   *Adjustment:* Make the "Audience" role more active. Give half the audience cards that say "Ask a Question." They can interrupt the Narrator to ask "Why did you move that?" This increases pressure and keeps them engaged. Limit the rounds to 3 minutes each to ensure more rotation.

  ### 9. Uncertainties and Limitations (Honest Account)

  **Where I am unsure:**
  *   **The "Alarm" Mechanics:** I have low confidence that ringing a bell perfectly simulates a "vague bodily unease." It might feel too much like a game signal.
      *   *What would change my mind:* If, in a test run, Narrators describe the bell as "an external noise" rather than "a feeling I had."
      *   *Fix:* Instruct the Signal person to tap the table or the Narrator's arm instead of ringing a bell. A physical tap feels more internal than a sound.
  *   **The Incentive Structure:** I am unsure if "Credibility Points" are enough to force genuine confabulation. Some people are comfortable saying "I don't know."
      *   *What would change my mind:* If Narrators consistently choose to lose points rather than invent a story.
      *   *Fix:* Add a social cost. "If you score zero, you must stand in the corner for the next round." (Use humor, but make the stakes social).

  **Contested Readings:**
  *   **The Variant:** Your "Partial Split" (detailed info blocked, coarse alarm passes) is a **philosophical stipulation**, not a settled medical fact. In real patients, some subcortical connections remain, but whether they constitute a "single state directed at the whole" is debated.
      *   *Flag:* In the debrief, you must say: "We stipulated this rule for the game. In real medicine, it is messier. But the *question* remains the same."
  *   **Confabulation vs. Lying:** The activity forces them to lie by rule. Real confabulation is unconscious; they believe their own story.
      *   *Flag:* You must supply this in the debrief. "In the game, you knew you were making it up. In the medical cases, the patients *believe* the story. That is the deeper mystery."

  **What the Activity Cannot Reproduce:**
  *   **Phenomenology:** The activity simulates the *structure* of the problem (information asymmetry + forced unity), but it cannot reproduce the *experience* of having a split consciousness. The participants will feel like one person pretending to be two, not two people pretending to be one.
      *   *Your Job:* You must explicitly state this in the debrief. "You felt like a liar. The patient feels like a truth-teller. That gap is where the philosophy lives."

  **Design Choice with Least Confidence:**
  *   **The Swap (Round 3).** It relies on the Narrator not noticing the Agent change. If they notice, the effect is lost.
      *   *Mitigation:* Ensure the Agents wear similar clothing or sit in a way that obscures their identity (e.g., behind a screen with only hands visible). If you can't hide the swap, change the rule: The Agent stays, but you swap their *Instruction Card* mid-round and tell them to change strategies silently. The Narrator sees the *behavior* change without seeing the *person* change. This is safer. **I recommend this adjustment.** (Update the Agent instructions to: "Midway through, I will tap you and show you a new card. Change your strategy immediately.")

  ### 10. Final Checklist for You
  1.  **Print Cards:** Make sure the "Swap" instruction for the Agent is clear.
  2.  **Test the Alarm:** Try the bell/tap yourself. Does it feel like "unease" or just "noise"? Adjust before the session.
  3.  **Prepare the Board:** Draw the tally columns (ONE / TWO / BROKEN) beforehand.
  4.  **Mindset:** You are the Game Master, not the Teacher. If they ask "What is this about?", say "Play the game first. The meaning comes from the play."

  This design respects your constraint to avoid lecturing, centers your specific "Partial Split" variant, and forces the confabulation through rules rather than suggestion. It leaves the philosophical heavy lifting for the debrief, where the participants' own confusion becomes the evidence.
