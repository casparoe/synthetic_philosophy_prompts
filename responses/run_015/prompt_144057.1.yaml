answer: |-
  This is a precise and high-resolution observation. You have identified a specific configuration of social psychology, epistemology, and narrative structure that feels like a natural kind, even if the literature currently splits it across three or four different disciplines.

  To answer your primary question: **No, there is no single established term that captures the exact intersection you are describing.**

  However, your intuition is correct that the components are well-studied. You are describing the convergence of **Chosen Trauma** (psychology), **Victimhood Nationalism** (political science), and **Identity-Protective Cognition** (behavioral economics), operating within a specific **Self-Sealing Epistemic Loop**.

  Here is the breakdown of the existing landscape, why it falls short of your description, and a proposal for how to name and diagnose the phenomenon you've isolated.

  ### 1. The Existing Concepts (and why they miss the joint)

  You are right to feel that existing frameworks catch different joints. Here is where they land relative to your description:

  *   **Chosen Trauma (Vamik Volkan):** This is the closest existing concept to your "content" category. Volkan describes how groups select a specific historical event of victimization (like Kosovo or the Alamo) to define their identity. It explains the *transmission* of the wound and the inability to mourn.
      *   *Missing:* It focuses on the psychoanalytic transmission (parent to child) rather than the *epistemic update rule* regarding external correction.
  *   **Victimhood Nationalism (Noor, Schori-Eyal, et al.):** This covers the "moral alchemy" you described (defeat $\to$ entitlement). It documents how groups compete for moral status by claiming victimhood.
      *   *Missing:* It treats the narrative as a resource in a status competition, but doesn't fully model the *inverted Bayesian update* when an outsider challenges the facts.
  *   **Identity-Protective Cognition (Dan Kahan):** This covers your "update rule" category. It explains why people accept/reject evidence based on whether it aligns with their group identity and the source of the information.
      *   *Missing:* It is a general mechanism applicable to climate change or gun control, not specific to the *narrative structure of defeat* where the loss itself is the source of moral capital.
  *   **The Backfire Effect:** You rightly dismissed this. It is empirically shaky and usually refers to individual cognitive dissonance, not the *social cohesion* boost that comes from external attack.

  ### 2. The Missing Concept: The Epistemic Mechanism

  The specific thing you are isolating is not just that the belief is false, or that it is sacred, but that **the narrative explicitly models the outside world as hostile/untrustworthy, making external correction function as confirmation.**

  In the Confederate Lost Cause or the Kosovo Myth, the story isn't just "We lost." The story is "We lost *because* we were pure and they were corrupt/overwhelming." Therefore, when an outsider (representing the corrupt/overwhelming force) says "You are wrong about the facts," that correction is processed not as data, but as *behavioral evidence* confirming the "corrupt/hostile" premise of the myth.

  The myth contains a **prediction of epistemic hostility**, and the correction fulfills the prediction.

  ### 3. Proposed Terminology

  Since no single term exists, you have license to coin one. Given your rationalist-adjacent background, you want a term that describes the *mechanism* rather than just the content.

  I propose: **"Antifragile Defeat Narrative"** (or **"Antifragile Defeat"** for short).

  *   **Why "Antifragile"?** (借用 Taleb) The system gains from disorder. External attacks (corrections) do not damage the belief; they strengthen it. It is not merely "resilient" (withstanding shock); it metabolizes the shock.
  *   **Why "Defeat"?** This distinguishes it from general nationalism. It specifically requires the *transmutation of loss into moral capital*. A victory myth (e.g., "We won because we are superior") is fragile; evidence of cheating or luck can undermine it. A defeat myth is antifragile; evidence of the opponent's power or dishonesty only deepens the moral victory.

  **Definition:** An *Antifragile Defeat Narrative* is a load-bearing national myth centered on a historical loss, which encodes a model of external adversaries as hostile or epistemically untrustworthy, such that factual corrections from those adversaries function as confirmation of the narrative's core claims, increasing group cohesion and adherence.

  ### 4. Where to Cut: Function, Rule, or Content?

  You asked whether the right place to cut is the update rule, the social function, or the narrative content.

  **The cut is the Social Function.**

  The update rule (inverted updating) is a *mechanism* deployed to protect the function. The content (defeat) is the *raw material* selected because it best serves the function.

  *   **Evidence:** Your Masada example proves this. Masada was an Antifragile Defeat Narrative in the 1950s-70s (defiance unto death). It was *demoted* when the social function of the Israeli state shifted from "revolutionary martyrdom" to "conventional military deterrence" (where suicide is bad for morale).
  *   **Implication:** The narrative is not dogmatic; it is *instrumental*. It drifts into the "Antifragile" phase when the group feels existentially threatened and needs cohesion more than accuracy. It drifts *out* of it (like Masada) when accuracy becomes more useful for survival than cohesion.

  ### 5. Diagnostic: How to Spot It

  To determine if a myth has drifted into this pattern (and whether correction will hurt), look for these three markers:

  1.  **The Hostility Prediction:** Does the narrative explicitly or implicitly claim that "outsiders do not understand us" or "the world is against us"? If the myth includes a model of the audience as antagonistic, corrections from that audience will be absorbed as evidence.
  2.  **The Moral Alchemy Test:** Does the loss confer a specific entitlement or moral status that a victory would not? (e.g., "We lost, so we are the *true* heirs," vs. "We won, so we are the *strong* heirs.") If the loss is the source of the credit, the narrative is load-bearing.
  3.  **The Cost Test (The Masada Diagnostic):** Observe what happens when adhering to the myth becomes materially costly.
      *   *Dogmatic:* The group suffers material loss to maintain the story (e.g., continuing to fight a unwinnable war for honor).
      *   *Antifragile/Instrumental:* The group quietly retcons the story when the cost outweighs the cohesion benefit (e.g., Israel demoting Masada when they needed soldiers to survive, not die).

  **Prediction Rule:**
  If you observe markers 1 and 2, **do not correct the facts.** You are not fighting a factual claim; you are attacking an immune system. The correction will be processed as an attack, triggering the "Hostility Prediction," and adherence will rise.

  To change the narrative, you must change the **Social Function**. You must make the *old story* costly or the *new story* cohesive. (e.g., The South didn't abandon the Lost Cause because of archives; they abandoned it (partially) when the economic cost of segregation became too high, and the narrative shifted to "states' rights" to preserve the antifragile core while shedding the toxic shell.)

  ### Summary

  *   **Established Concept:** None. It is a synthesis of *Chosen Trauma* + *Victimhood Nationalism* + *Identity-Protective Cognition*.
  *   **Proposed Term:** **Antifragile Defeat Narrative**.
  *   **The Cut:** The **Social Function** (cohesion/entitlement) drives the Update Rule.
  *   **Diagnostic:** Look for the **Hostility Prediction** embedded in the myth. If the myth predicts you will lie, your truth-telling will confirm it.

  You have correctly identified that this is not a bug in human reasoning, but a feature of group survival systems. Treating it as a "false belief" to be corrected is a category error; it is a "social technology" to be out-competed or repurposed.
