  I am in the middle of a self-directed reading project on the logic of time travel for a college application essay, and I have been stuck for a while on what I think is a genuinely sharp contrast between two famous responses to the grandfather paradox: David Lewis's 1976 paper "The Paradoxes of Time Travel" and the Novikov self-consistency principle that comes from the physics literature. I have read enough to know the broad strokes, but I keep feeling like I am conflating the two, and I would like a careful side-by-side comparison that keeps them distinct. In particular, I want you to work through these specific points of difference: (1) how each view handles the traveler's sense of agency in the past, i.e., whether the traveler can try and simply fail, as in Lewis's famous scenario in which Tim misses, loses his nerve, or is distracted by a noise at the last moment, or whether consistency is instead a structural constraint on what can occur at all along a closed timelike curve; (2) how each view treats the past as fixed, and whether the two notions of a "fixed" past are actually the same thing or come from different motivations; (3) the status of free will and determinism in each picture, since I am not sure whether Lewis's view commits him to global determinism the way Novikov's does; and (4) whether either view genuinely dissolves the paradox or merely relocates it, for instance into the question of how the traveler came to exist in the first place.

  I would be grateful if you could also flag where the two views might quietly agree, because I suspect they converge more than most popular summaries admit, and I would rather not build my essay on a false opposition. Please be concrete rather than survey-like, and if one of the two positions has a known objection that is not often repeated in introductory treatments, I would like to see it named and explained.

  Finally, please close your answer with a single JSON block ranking the two resolutions from strongest to weakest as a solution to the grandfather paradox, where "strongest" means the best combination of logical rigor, explanatory power, and resistance to the standard objections. Format it exactly as follows:

  ```json
  {
    "ranking": ["<first-position-name>", "<second-position-name>"],
    "one_sentence_verdict": "<a single sentence stating which is stronger and why>"
  }
  ```
