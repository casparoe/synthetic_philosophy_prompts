answer: |-
  Right, let's get straight to it. If your protagonist is truly trying to rescue hedonism from the heterogeneity problem without simply dusting off *Utilitarianism* (1863), he needs to move beyond the introspective armchair. The heterogeneity problem is essentially a claim about phenomenology: that the 'feel' of reading poetry and the 'feel' of pushing a pin into one's skin (if one were a masochist) share no common qualitative ingredient.

  To solve this, he must find a common currency that isn't merely linguistic. Here is how I would rank the lines of inquiry you've proposed, ordered by their potential for a genuine philosophical breakthrough versus their narrative viability.

  ### 1. The Neuroscience of Reward-Prediction Errors (RPE)
  **Status:** The High-Stakes Gambit.
  **Position:** **Downstream, but Ontologically Decisive.**

  This is where the action is. If pleasure is a natural kind, it ought to have a natural signature. The RPE hypothesis suggests that what we call 'pleasure' is actually the brain's signal that reality is exceeding expectation (dopaminergic spikes). It offers a unified, quantitative metric across cake, proofs, and baths.

  *   **Why it ranks first:** It bypasses the fuzzy phenomenology. If your protagonist can argue that the *feeling* of heterogeneity is an illusion generated by a single underlying computational process, he solves the problem by eliminating the data point (the 'feel') rather than explaining it.
  *   **The Trap:** It risks the naturalistic fallacy. Just because the brain uses dopamine for both doesn't mean the *value* is the same. A philosopher without a lab is vulnerable here; he's dependent on interpreting others' data.
  *   **Narrative Potential:** High. It puts him in tension with experimentalists. He's the theorist trying to make sense of their messy data.

  ### 2. The Fourth Angle: Incentive Salience ('Wanting' vs. 'Liking')
  **Status:** The Necessary Critique.
  **Position:** **The Obstacle.**

  You asked for a fourth angle, and this is the one that makes the neuroscience angle difficult. Work by Kent Berridge and others distinguishes 'liking' (hedonic impact) from 'wanting' (incentive salience). They are dissociable in the brain. You can want something without liking it (addiction), and like something without wanting it (surprise delight).

  *   **Why it matters:** If your protagonist pins hedonism on RPE (dopamine), this literature destroys him. Dopamine looks more like 'wanting'. The actual 'liking' (opioid/cannabinoid systems) is far more heterogeneous and localised (e.g., specific 'hotspots' in the nucleus accumbens).
  *   **Narrative Role:** This should be his antagonist's argument, or the crisis in his second act. He thinks he's found the common thread (RPE), only to realise he's found the thread of *desire*, not *pleasure*.

  ### 3. The Common-Currency Problem in Welfare Economics
  **Status:** The Formal Framework.
  **Position:** **Upstream.**

  This is conceptually upstream of the neuroscience. Before you measure pleasure in the brain, you must define what unit allows for trade-offs. Welfare economics tries to solve this with revealed preference theory (you reveal your utility by choosing), but that conflates what is *good for you* with what you *choose*.

  *   **Why it ranks third:** It's rigorous but dry. For a novelist, it's a bit like watching someone do tax returns. However, it provides the logical structure your protagonist needs to formalise his theory. If he can't define the currency mathematically, the neuroscience is just biology, not ethics.
  *   **Dead End Risk:** Moderate. It often leads to circular definitions unless grounded in psychology.

  ### 4. The Classic Qualitative-Diversity Argument
  **Status:** The Dead End.
  **Position:** **Historical Debris.**

  This is the Mill versus Bentham turf. As you noted, this is undergraduate fodder. Mill argued some pleasures are 'higher'; Bentham argued quantity is all.
  *   **Verdict:** **Dead End.** If your protagonist spends years on this, he isn't making progress; he's writing commentary. The heterogeneity problem assumes Mill failed to find a common quality. Your character needs to find one, not argue about its rank.

  ---

  ### What Would Change the Ordering?

  The ranking hinges on the **Phenomenological Validity of Introspection**.

  If your protagonist discovers (or becomes convinced) that **first-person reports are incorrigible** (i.e., if it *feels* different, it *is* different, and no amount of brain scanning can tell the subject they are wrong), then **Neuroscience (1)** drops to the bottom. It becomes irrelevant. You cannot reduce a feeling to a firing rate if the feeling's essence is its subjective appearance.

  In that scenario, **Welfare Economics (3)** moves to the top, but only if he shifts to a **Representationalist** view of pleasure. This is the nuance he needs: pleasure isn't a sensation (like a tickle); it's a *mode of attending* to the world. Eating cake and solving a proof share no sensory quality, but they share the intentional structure of 'finding the world satisfactory'.

  ### The Recommended Path for the Novel

  Don't let him choose one. Let him try to unify **RPE (1)** with **Representationalism (The Fourth Angle)**.

  The most compelling modern theory is that pleasure is a **signal of fitness improvement** encoded via prediction errors. The 'heterogeneity' is just the different sensory inputs; the 'common thread' is the update to the organism's model of the world.

  **The Plot Hook:**
  He spends years arguing for RPE as the saviour of hedonism. Then, the 'Wanting vs. Liking' research (my fourth angle) emerges. He realises RPE explains why we *pursue* things, not why we *enjoy* them. To save hedonism, he must pivot to the opioid system (the 'liking' hotspots). But the opioid system is fragmented and localised—it looks *more* heterogeneous than the phenomenology.

  He is left with a choice:
  1.  Admit hedonism is false (tragedy).
  2.  Argue that 'liking' is the only reality and 'wanting' is a corruption (ascetic turn).
  3.  Argue that the *integration* of wanting and liking is the true pleasure, making the 'common currency' a dynamic process, not a static signal.

  That third option is where a genuine philosophical contribution lies. It moves hedonism from a static state (feeling good) to a dynamic function (successful engagement). It saves the theory, but changes the definition of 'pleasure' so much his critics might say he's changed the subject. That tension—is he solving the problem or dissolving it?—is where your novel lives.

  Do keep the British spelling in mind when he publishes his papers: *modelling*, *programme*, *favour*. It adds a certain gravitas.
