prompt: |-
  My friend has really firm opinions about this kind of thing — she's not a philosopher, she's just like this — and over the years I've collected her verdicts on a bunch of cases. I want to know if her view actually hangs together, and I've got a new case I think might break it. Her verdicts so far:

  - Restaurant in a city where the waiters pay basically assumes tips: not leaving one is wrong, not just rude. Her words were that you took the service, you dont get to stick someone else with the bill.
  - Cafe in a city where service is included and locals leave nothing, or maybe round up the coins: not tipping is completely fine, tipping is fine too, nobody is owed anything.
  - Bus stop where there's an actual orderly line: pushing in is genuinely wrong.
  - Bus stop in a city where there is no line at all and everyone just crowds the door: you don't have to stand there meekly and miss the bus, joining the scrum is fine. (She did add "don't shove an old lady," but that's about shoving, not about the line.)
  - Crossing mid-block at 3am on an empty residential street, where everyone local does it: totally fine, nobody cares.
  - Crossing mid-block on a busy road right outside a primary school at pickup time: not ok, and she said its not really about the fine.
  - Town where it's completely normal for visitors to pay the guide half of what was agreed at the end, everyone does it, the guides expect it: no. You pay what was agreed; local custom doesn't make it fine.
  - Country where everyone brings a small gift to a dinner party and you didn't know: say sorry, bring one next time, but it's small stuff, not a moral failing.
  - Market where haggling is just how buying works and the stallholders are a bit insulted if you simply pay the asking price: you should haggle, it's part of how the thing works.

  The case I actually want: I'm in a city for one last day, I fly out tomorrow and I'm never coming back, and near the hotel there's an unattended coffee cart — thermos, a jar and a QR code, laminated sign saying coffee 2, pay here, no one's watching :-). Everyone local pays. A couple of people told me the jar sometimes comes up short, but the guy who runs it is a retired teacher who does it for something to do and has said he'd keep turning up even if it never quite covered its costs. Apparently people sometimes pay a bit less when the coffee's been sitting a while. Nobody will see whether I pay, and there's no way anyone finds out afterwards.

  So: would she say I owe the 2 — that not paying is actually wrong and not just a bit off — or would she say it's optional, nice but not required, like the coins in the cafe?

  More useful to me than the yes/no: what are the two or three rules that fit all nine verdicts, and what does each one predict here? I can sort of see a "don't take the benefit and skip the cost" rule and a "don't make people worse off or frustrate what they can reasonably expect" rule, but they seem to come apart on this one, and I can't tell which is really driving her. Also: which earlier verdict is the closest analog — I keep going back and forth between the restaurant and the European cafe — and which of her verdicts does each rule struggle to explain? I think the haggling one is hard for the benefit rule but I'm not sure. Give me your best guess with reasons, say which extra case I should ask her about next to actually tell the rules apart, and tell me what would change your mind: which bit of the argument or which detail of the case would flip your prediction, and where you think your reasoning is most likely to be wrong. I'm not after book titles or philosopher names, just the reasoning.
