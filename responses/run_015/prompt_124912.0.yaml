  **Why it looked okay:** It appeals to a pragmatic intuition that norms should only govern situations where violations have tangible costs ("no harm, no foul"). In high-stakes, low-competition domains like climate planning, it feels counterintuitive to label a planner "irrational" if their choices never lead to actual loss.

  **The Price:** Rejecting (4) commits you to a **non-instrumental conception of rationality**. You must defend the view that rationality is a virtue of internal consistency that binds agents even in isolation or safety. This preserves the universal normative force of coherence but decouples it from immediate pragmatic consequences. Regarding your climate planners: you can maintain coherence's force without condemning them by arguing their choices don't *actually* violate the axioms once outcomes are properly individuated (e.g., accounting for regret or moral stakes), rather than by conceding that the norms don't apply.

