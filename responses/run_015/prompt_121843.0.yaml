prompt: |-
  I am writing a feature on whether the frame problem in artificial intelligence remains a live philosophical obstacle or has been conceptually dissolved by modern architectures. To ground the piece, I need you to draft the joint statement that an adversarial collaboration between two opposing camps—the Representational Inertia theorists and the Predictive Dissolution theorists—would produce after a year of structured debate.

  The Representational Inertia theorists maintain that the frame problem, as originally formulated in the context of explicit symbolic planning, exposes a genuine and still-unresolved deficit: any agent that maintains an explicit model of world-states and updates it in response to actions must solve the combinatorial explosion of specifying every relation that remains unchanged, and contemporary statistical learning merely obscures this deficit through correlation rather than resolving it through reasoning.

  The Predictive Dissolution theorists maintain that the frame problem is a pseudo-problem generated by an obsolete commitment to global symbolic consistency; embodied, hierarchical predictive systems never required an explicit frame because they operate through continuous local error minimization and action-oriented sampling, so the combinatorial worry never arises in the architectures that actually work.

  Please produce a formal document suitable for publication as an appendix. It should contain:

  - A numbered section of substantive agreed claims: about the formal structure of the original problem (why an agent must avoid revisiting every belief when one object moves), about what modern architectures—whether symbolic, statistical, or hybrid—actually compute, about the distinction between implicit correlation and explicit representational commitment, and about what it would mean for an open-world system to behave robustly without an exhaustive registry of non-changes. These claims must be precise enough that both camps genuinely sign them, not vacuous.

  - A disagreements table. Each row should state a precise point of divergence, phrased in wording that the respective camp would accept as accurate to its own view. One disagreement should concern whether solving the frame problem requires rendering explicit frame axioms unnecessary or merely achieving reliable behavior in open domains. Another should address whether predictive processing implicitly encodes invariant relations or bypasses representational commitment altogether. Identify explicitly whether any portion of the dispute is verbal rather than substantive, and explain which portion and why.

  - The cruxes: the sub-questions such that settling them would move at least one camp. I take two likely cruxes to be: (a) whether statistical generalization in deep networks constitutes an implicit representation of invariant relations across contexts, or merely a non-representational bypass that fails in counterfactual reasoning about unobserved interventions; and (b) whether there exists a demonstrable class of tasks—such as an autonomous logistics agent encountering an unanticipated object substitution in a dynamically rearranged warehouse—for which local predictive error correction is provably insufficient and an explicit non-change registry becomes unavoidable.

  - For each crux, identify a concrete case, formal result, or experimental scenario that both camps agree would genuinely bear on it. Then record, in advance and in writing, what each camp predicts that the case or result will show about their own position. Do not invoke obscure formalisms, unnamed theorists, or hyper-niche frameworks that a well-read general audience in philosophy of mind and AI would not recognize.

  The tone should be polished, neutral, and accessible to an educated non-specialist reader. Do not include bibliographies, reading lists, citations, or requests for further literature. Do not quote any specific text verbatim.
