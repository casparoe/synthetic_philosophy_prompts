answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Status of the Frame Problem in Contemporary Artificial Intelligence
  **Parties:** Representational Inertia Theorists (RI) and Predictive Dissolution Theorists (PD)
  **Date:** October 24, 2023

  ### 1. Substantive Agreed Claims

  After twelve months of structured dialectic, the undersigned camps affirm the following propositions as accurate descriptions of the technical and philosophical landscape. These claims are intended to establish a shared baseline for further inquiry.

  1.  **The Combinatorial Core:** We agree that the original formulation of the frame problem identifies a specific logical difficulty: in a system that represents the world as a set of discrete propositions, an action that changes one proposition does not logically imply the status of the remaining propositions. To maintain a consistent world model, the system must explicitly represent or infer which relations remain invariant. Without a mechanism to bypass this, the agent faces a combinatorial explosion where it must re-evaluate every known fact after every action.
  2.  **Architectural Reality:** We agree that contemporary high-performance AI architectures (including deep neural networks, transformers, and reinforcement learning agents) do not utilize explicit logical frame axioms. These systems do not maintain a symbolic registry of "non-changes." Instead, they operate via high-dimensional vector transformations, weight adjustments, and loss-function minimization.
  3.  **The Nature of Statistical Learning:** We agree that modern statistical learning systems acquire their operational constraints through exposure to data distributions rather than through the explicit encoding of logical rules. Consequently, any invariance captured by these systems is embedded in the geometry of the model parameters rather than declared as a truth-conditional statement.
  4.  **Robustness Requirements:** We agree that for an agent to function robustly in an open world, it must successfully ignore irrelevant changes while detecting relevant ones. Whether this is achieved via explicit logical filtering or implicit architectural bias, the functional requirement remains: the system must not treat every sensory variation as a fundamental change in the state of the world.
  5.  **Failure Modes:** We agree that both symbolic and statistical systems exhibit brittleness when confronted with out-of-distribution scenarios. Symbolic systems fail when the explicit axioms do not cover the novelty; statistical systems fail when the novel scenario violates the statistical regularities learned during training. Both camps agree that identifying the source of this brittleness is central to resolving the dispute.

  ### 2. Table of Disagreements

  The following table outlines the precise points of divergence. Where a dispute is identified as partially verbal, the underlying substantive consequence is noted.

  | Point of Divergence | Representational Inertia (RI) Position | Predictive Dissolution (PD) Position | Nature of Dispute |
  | :--- | :--- | :--- | :--- |
  | **Criteria for Solution** | Solving the frame problem requires demonstrating how an agent can *justify* ignoring non-changes without relying on brittle statistical coincidence. A solution must account for counterfactual reasoning about what *would* have remained unchanged. | Solving the frame problem requires demonstrating that intelligent behavior can proceed *without* ever forming a global state that requires updating. If the agent acts successfully, the "problem" of updating beliefs is dissolved as a category error. | **Substantive.** This concerns whether "intelligence" requires justificatory reasoning or merely successful adaptive control. |
  | **Status of Model Weights** | The parameters in a neural network constitute an *implicit representation* of invariant relations. Because these are learned via correlation, they cannot support reasoning about interventions that break those correlations. | The parameters constitute a *control policy* that bypasses representation altogether. The system does not "know" invariants; it simply minimizes prediction error, rendering the concept of an "invariant relation" unnecessary for operation. | **Partially Verbal.** The dispute hinges on the definition of "representation." <br>**Substantive Consequence:** If RI is correct, networks will fail at novel counterfactuals. If PD is correct, networks should adapt online via error signals. |
  | **Source of Efficiency** | Computational efficiency in ignoring non-changes is achieved by structural constraints that mimic logical frame axioms (e.g., locality assumptions). | Computational efficiency is achieved because the system never computes the "unchanged" state; it only computes the difference required to minimize current error. | **Substantive.** This concerns the underlying computational mechanism of efficiency. |

  **Note on Verbal Dispute:** We acknowledge that a portion of our disagreement regarding "representation" is terminological. RI defines representation as a structure bearing truth conditions about the world. PD defines representation as any internal structure that guides action. However, this verbal distinction maps onto a substantive disagreement about whether systems lacking truth-conditional states can handle novel causal interventions.

  ### 3. The Cruxes

  We have identified two specific empirical and theoretical questions (Cruxes) that, if settled, would significantly alter the confidence of at least one camp in its position. For each Crux, we specify a concrete scenario and record our pre-commitments regarding the expected outcome.

  #### Crux A: Statistical Generalization vs. Invariant Representation
  **The Question:** Does statistical generalization in deep networks constitute an implicit representation of invariant relations across contexts, or merely a non-representational bypass that fails in counterfactual reasoning about unobserved interventions?

  **The Test Case:** *The Counterfactual Intervention Benchmark.*
  An agent is trained in a simulated physics environment where objects typically obey standard gravity and friction. The agent is then tested on a task requiring it to predict the outcome of an action in a scenario where a specific, previously invariant law is suspended (e.g., a specific object becomes immune to gravity only when touched by a specific tool). The agent is not retrained but must infer the new rule from a single intervention.

  **Pre-Recorded Predictions:**
  *   **RI Prediction:** The agent will fail or require extensive retraining. Because the agent learned the invariance of gravity as a statistical correlation rather than an explicit rule separable from object identity, it cannot selectively suspend the rule without corrupting its model of other objects. This demonstrates that statistical learning does not solve the frame problem; it merely masks it within the training distribution.
  *   **PD Prediction:** The agent will succeed given a hierarchical architecture with fast-weight adaptation. The prediction error generated by the object's unexpected motion will trigger a local update to the specific parameters governing that object-context pair, without requiring a global update to the concept of gravity. This demonstrates that the frame problem is bypassed by local error correction.

  #### Crux B: The Necessity of Explicit Non-Change Registries
  **The Question:** Is there a demonstrable class of tasks for which local predictive error correction is provably insufficient, making an explicit non-change registry unavoidable?

  **The Test Case:** *The Unanticipated Substitution Scenario.*
  An autonomous logistics agent operates in a dynamically rearranged warehouse. The agent is tasked with moving Box A to Zone 1. While the agent is occluded or distracted, Box A is swapped with Box B. Box B is visually identical but has a different center of mass and fragility profile. The agent must grasp and move the box without dropping or crushing it. Crucially, the swap violates the assumption of object permanence and identity persistence that the agent relies on for path planning.

  **Pre-Recorded Predictions:**
  *   **RI Prediction:** The agent will fail catastrophically (e.g., drop the box) because it lacks an explicit symbolic commitment to "Object Identity persists through time." Its predictive model assumes the sensory input corresponds to the original object state. Without a symbolic frame axiom enforcing identity tracking independent of sensory flux, the system cannot reconcile the mismatch between its plan and the physical reality until it is too late.
  *   **PD Prediction:** The agent will detect the discrepancy through haptic feedback (proprioceptive prediction error) immediately upon grasping. The hierarchical predictive system will down-weight the visual prediction in favor of the haptic signal and adjust the grip force online. This proves that an explicit registry of non-changes is unnecessary; continuous sensorimotor loop closure is sufficient to handle identity substitution.

  ***

  **Signed,**

  **The Representational Inertia Working Group**

  **The Predictive Dissolution Working Group**
