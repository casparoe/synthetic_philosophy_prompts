answer: |-
  The argumentative move you have isolated is indeed a distinct pathology of democratic legitimacy, one that is frequently elided by broader categorisations of populism. While the literature you cite provides the necessary context, none of the existing terms capture the specific *epistemic-institutional asymmetry* you describe. Schmittian decisionism locates sovereignty outside the norm; epistemic populism posits a collective capacity for truth; and accusations of hypocrisy presume a distinction between private belief and public claim that this move obliterates.

  Therefore, I take the committed position that the precise concept required to classify this phenomenon is **Sovereign Epistemic Asymmetry**.

  This is not merely a descriptive label but a theoretical category that identifies a specific structural flaw in the claim to legitimacy. It defines a mode of political argumentation wherein the 'will of the people' is treated as an objective sovereign authority, yet access to that authority is epistemically monopolised by the leader, creating a one-way valve for institutional legitimacy. Below, I defend this identification by delineating why established alternatives fail, providing a rigorous definition, and marking the boundary conditions that distinguish it from mere strategic deceit.

  ### The Inadequacy of Existing Concepts

  To justify coining **Sovereign Epistemic Asymmetry**, we must first demonstrate why the nearest theoretical neighbours are insufficient.

  **1. Schmittian Decisionism**
  Carl Schmitt's conception of sovereignty is defined by the power to decide on the *exception*—to suspend the legal order in a moment of crisis. While your observed figure mimics the sovereign's power to override norms, the logical structure differs fundamentally. Schmitt's sovereign stands *outside* the normal legal order to preserve the state's existence. The figure you describe, however, claims to stand *inside* the democratic order, appealing to its ultimate source of legitimacy ('the people') to validate or invalidate specific procedures. Schmittian decisionism is a theory of *suspension*; Sovereign Epistemic Asymmetry is a theory of *interpretation*. The latter does not suspend the constitution; it claims to be the only valid interpreter of its spirit, rendering institutions opaque not because they are suspended, but because they are deemed to have failed their epistemic function of transmitting the popular will.

  **2. Epistemic Populism**
  Recent literature on epistemic populism suggests that populist movements claim ordinary citizens possess a direct, non-inferential grasp of political truth (often 'common sense'). This concept is inadequate for your observation because it implies a positive epistemic mechanism accessible to the populace (e.g., intuition, lived experience). In the pattern you describe, there is *no* independent mechanism for the people to ascertain the will apart from the leader's assertion. The 'will of the people' is not a reservoir of wisdom to be tapped; it is a latent truth that only the leader can detect. Epistemic populism suggests the leader follows the people's knowledge; Sovereign Epistemic Asymmetry posits that the leader *constitutes* that knowledge.

  **3. Strategic Hypocrisy**
  It is tempting to dismiss this move as simple hypocrisy: the leader supports institutions when they win and attacks them when they lose. However, classifying it as hypocrisy misdiagnoses the theoretical threat. Hypocrisy implies the actor knows the truth (that institutions are legitimate regardless of outcome) but lies for gain. Sovereign Epistemic Asymmetry is more robust: it constructs a reality where the truth *is* contingent on the outcome. It is not a lie about the institution's validity; it is a redefinition of validity itself. The actor is not necessarily deceiving others; they are operating within a closed logical system where legitimacy is retroactively assigned. Treating this as hypocrisy fails to capture the *structural* damage to the concept of representation, reducing a constitutional crisis to a moral failing.

  ### Definition and Theoretical Structure

  **Sovereign Epistemic Asymmetry** is defined as: *A mode of political legitimation wherein democratic institutions are affirmed as authoritative only insofar as their outputs align with the leader's assertion of the popular will, while being dismissed as structurally corrupted when they diverge, absent any independent procedure for verifying that will.*

  The concept rests on three pillars:
  1.  **The Ontological Claim:** The 'People' exist as a homogeneous sovereign entity with a singular will.
  2.  **The Epistemic Monopoly:** The content of this will is not accessible through standard democratic procedures (elections, courts) but is intuitively grasped by the leader.
  3.  **The Asymmetrical Validation:** Institutional legitimacy is not procedural (based on rules) but performative (based on alignment with the leader's intuition).

  This creates a closed loop. If the court rules against the leader, it is not merely 'wrong'; it is 'illegitimate' because it has failed to channel the will. Since the will is only accessible through the leader, the court's disagreement proves its alienation from the people. The asymmetry lies in the fact that agreement proves transparency, but disagreement proves opacity, with no third-party arbiter possible.

  ### Boundary Conditions

  To ensure this concept is analytically useful, we must specify where Sovereign Epistemic Asymmetry begins and ends. It is not present in all forms of political contestation.

  **1. The Absence of Alternative Mechanisms**
  The phenomenon begins only when the figure offers no independent mechanism to verify the 'true will'. If a populist figure claims an election was rigged but demands a specific, established legal remedy (e.g., a recount, a judicial review), they are operating within procedural norms, however contentious. Sovereign Epistemic Asymmetry emerges when the figure rejects *all* institutional remedies as part of the corruption, positing their own judgement as the sole recourse. The boundary is crossed when the leader becomes the only court of appeal.

  **2. The Claim to Exclusive Representation**
  This asymmetry is distinct from ordinary partisan criticism. A opposition party may claim the government does not represent the people, but they usually accept that the next election will resolve the dispute. Sovereign Epistemic Asymmetry requires the claim to *exclusive* representation (as noted by Jan-Werner Müller), where the leader is not merely a competitor for power but the *sole vessel* of the popular will. Without this claim to exclusivity, institutional disagreement is just policy divergence; with it, institutional disagreement becomes existential treason.

  **3. The Retroactive Nature of Legitimacy**
  Finally, the concept ends where a positive theory of procedure begins. If a movement argues for a new constitutional convention or a specific type of referendum to *establish* the will, they are proposing a new procedure. Sovereign Epistemic Asymmetry is characterised by a *negative* relation to procedure: it does not seek to build better institutions, but to invalidate existing ones based on past performance. It is a logic of veto, not construction.

  ### Conclusion

  The argumentative move you have observed is not merely a rhetorical flourish or a standard feature of 'thin-centred ideology'. It is a specific mechanism of de-democratisation that hollows out institutions from within by severing the link between procedural correctness and legitimacy. **Sovereign Epistemic Asymmetry** captures this precisely because it highlights the fusion of power (Sovereign) and knowledge (Epistemic) that creates the structural imbalance (Asymmetry).

  By classifying this move under this specific term, you avoid the trap of Schmittian exceptionalism (which looks for the suspension of law) and the trap of epistemic populism (which looks for a theory of mass knowledge). Instead, you identify a logic where the law remains in force but is rendered void of authority whenever it contradicts the leader's intuition. This distinction is vital for political theory, as it reveals that the threat is not necessarily the abolition of democratic institutions, but their transformation into mere acclamatory devices, valid only when they mirror the sovereign's will.
