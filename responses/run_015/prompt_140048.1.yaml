  ### Collision Log

  | Pair of Leaves | Indistinguishability Condition | Reason |
  | :--- | :--- | :--- |
  | **Leaf 6 (Bare Executive) vs. Leaf 7 (Checked Executive)** | **One-Shot Decision** | In a single isolated vote, if the Chair has perfect knowledge of the Board's preferences, they will never choose an option that triggers an override. The outcome is identical to a Bare Dictatorship. The tree separates them structurally, but game-theoretically they collapse without recurrence. |
  | **Leaf 8 (Iterated) vs. Leaf 9 (Standard)** | **Failed Reputation** | If voters do not value future reputation (e.g., they are leaving the society, or the group is too large for monitoring), Iterated Consensus devolves into Standard Plurality with strategy. The rule text differs, but the behavior does not. |
  | **Leaf 4 (Median) vs. Leaf 5 (Binary)** | **Extreme Polarization** | If the public scale is so polarized that the median voter prefers the Status Quo over all changes, the Median Rule produces the same outcome as the Binary Threshold. The mechanism differs, but the social choice is identical. |
