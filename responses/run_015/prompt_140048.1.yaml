  | **Q1=No, Q2=No, Q3=No, Q4=No, Q5=No, Q6=No, Q7=No, Q8=No** | **Impossible** | This path leads to Leaf 9, which accepts strategy. A cell representing "Deterministic, Single-Valued, Universal Domain, Non-Dictatorial, Strategy-Proof" is empty by the Gibbard–Satterthwaite theorem. |
  | **Q1=Yes, Q2=Yes** | **Unattractive** | Returning a shortlist *and* using randomness is redundant. If you allow a shortlist, randomness is only needed for the final tie-break, making Q2 subordinate to Q1. |
  | **Q6=Yes, Q7=Yes, Q8=Yes** | **Unexplored** | A Checked Executive in a repeated game is theoretically stable but rarely codified. Usually, recurrence (Q8) implies collective voting, not executive authority. |
  | **Q3=Yes, Q4=Yes** | **Coherent** | Score voting on a single-peaked domain is possible but unnecessary. If the domain is single-peaked, the Median Rule (Leaf 4) is strategy-proof without needing intensity scores. |

