answer: |-
  ### Decision Instrument: Selecting a Social Choice Rule

  **Instructions:** Proceed through the questions in order. Answer **Yes** or **No** based on the society's constraints and preferences. Stop at the first Leaf reached. Record the Leaf ID and the associated Trade-Off Note for the bylaws.

  1.  **Shortlist Tolerance:** Is it acceptable for the rule to return a tie or a shortlist of candidates rather than a single winner?
      *   **Yes:** Go to **Leaf 1**.
      *   **No:** Go to Question 2.

  2.  **Randomness Tolerance:** Is it acceptable to use a trusted random device (coin, lottery, random number generator) to determine the winner or break ties?
      *   **Yes:** Go to **Leaf 2**.
      *   **No:** Go to Question 3.

  3.  **Intensity Measurement:** May voters express *how much* they prefer an option (scores, budgets, transferable points) rather than only ranking options in order?
      *   **Yes:** Go to **Leaf 3**.
      *   **No:** Go to Question 4.

  4.  **Published Policy Scale:** Do all options lie on a single, publicly verified policy scale (e.g., budget size, ideological position) known before ballots are cast?
      *   **Yes:** Go to **Leaf 4**.
      *   **No:** Go to Question 5.

  5.  **Status Quo Option:** Is "No Decision" or "Current Policy" always an available option that defeats a proposal if support is insufficient?
      *   **Yes:** Go to **Leaf 5**.
      *   **No:** Go to Question 6.

  6.  **Executive Authority:** Is there a specific officer (e.g., Chair) empowered to make the final decision if the voting body fails to reach a threshold?
      *   **Yes:** Go to Question 7.
      *   **No:** Go to Question 8.

  7.  **Override Mechanism:** Is the officer's decision subject to a supermajority vote of the board to overturn or override?
      *   **No:** Go to **Leaf 6**.
      *   **Yes:** Go to **Leaf 7**.

  8.  **Recurrence:** Is this decision one in a long series of similar decisions involving the same voters over time?
      *   **Yes:** Go to **Leaf 8**.
      *   **No:** Go to **Leaf 9**.

  ---

  ### Leaves (Rules and Trade-Off Notes)

  **Leaf 1: The Shortlist Rule**
  *   **Rule:** The rule aggregates ballots and returns all options tied for the top score or rank. If a single choice is required later, a secondary method (e.g., Chair selection) is used.
  *   **GS Property Relaxed:** Single-Valuedness.
  *   **Trade-Off Note:** **[GS Escape]** By allowing multiple winners, you avoid the impossibility of picking one. However, you defer the conflict. The "secondary method" used to break the shortlist will itself be subject to the Gibbard–Satterthwaite constraints unless it uses randomness or authority. You have purchased indecision to avoid manipulation.

  **Leaf 2: The Random Dictator**
  *   **Rule:** Select one voter uniformly at random; their top choice wins.
  *   **GS Property Relaxed:** Determinism.
  *   **Trade-Off Note:** **[GS Escape]** This is the only rule that is strategy-proof, non-dictatorial (ex-ante), and defined on all domains for 3+ outcomes. You have given up the guarantee that the group's will determines the outcome. You must trust the randomness source. Voters cannot strategize, but they may feel disenfranchised by chance.

  **Leaf 3: The Score/Market Rule**
  *   **Rule:** Voters assign numerical scores or spend budget points on options. The option with the highest total wins.
  *   **GS Property Relaxed:** Ordinality (Preference Type).
  *   **Trade-Off Note:** **[GS Escape]** GS assumes ordinal rankings. By measuring intensity, you escape the theorem. However, you invite new strategic vulnerabilities (exaggeration of scores, budget hoarding). You require voters to understand cardinal utility, which they may not possess honestly.

  **Leaf 4: The Median Voter Rule (Enforced Domain)**
  *   **Rule:** Options are mapped to a public scale. Ballots must be single-peaked on this scale (preferences rise then fall). Non-single-peaked ballots are voided. The median position wins.
  *   **GS Property Relaxed:** Universal Domain.
  *   **Trade-Off Note:** **[GS Escape]** You restrict the *type* of preferences allowed. **Warning:** This creates an incentive for voters to submit deliberately non-single-peaked ballots if they know voiding their ballot shifts the median or lowers the quorum in their favor. You are auditing sincerity rather than guaranteeing it. If the scale is contested, the rule collapses.

  **Leaf 5: The Binary Threshold**
  *   **Rule:** Proposals are voted against a fixed status quo. If no option beats the status quo by a set margin, nothing happens.
  *   **GS Property Relaxed:** Surjectivity (Range).
  *   **Trade-Off Note:** **[Redefinition]** GS requires the rule to be able to pick *any* option. By making "Nothing" the default, you effectively reduce the choice to binary comparisons (Proposal vs. Status Quo). You avoid cycles but risk gridlock where popular changes fail to clear the threshold.

  **Leaf 6: The Bare Executive**
  *   **Rule:** The Chair selects the option. Voting is advisory only.
  *   **GS Property Relaxed:** Non-Dictatorial.
  *   **Trade-Off Note:** **[GS Escape]** This satisfies all GS conditions by admitting a dictator. It is efficient and strategy-proof for voters (since voting doesn't matter). You have given up collective determination. This is indistinguishable from Leaf 7 in a one-shot model if the override is never triggered.

  **Leaf 7: The Checked Executive**
  *   **Rule:** The Chair selects the option, but a supermajority of the board may override the selection with a different option.
  *   **GS Property Relaxed:** Non-Dictatorial (Technically still dictatorial if override is costly).
  *   **Trade-Off Note:** **[Sociological]** In a one-shot game, if the Chair anticipates the override perfectly, this is functionally identical to Leaf 6 (Bare Executive). It only differs in a repeated context where the Chair fears the political cost of an override. You rely on reputation, not the rule's logic, to distinguish this from dictatorship.

  **Leaf 8: The Iterated Consensus**
  *   **Rule:** Use a standard voting method (e.g., Plurality), but rely on the repetition of decisions to punish strategists.
  *   **GS Property Relaxed:** One-Shot Assumption.
  *   **Trade-Off Note:** **[Sociological]** GS applies to isolated decisions. In a repeated game, voters may vote sincerely to build reputation. This fails if the end of the relationship is visible (end-game problem) or if new voters enter frequently. You are betting on social norms, not mathematical guarantees.

  **Leaf 9: The Standard Plurality/Runoff**
  *   **Rule:** Voters rank or pick one. The most popular wins (with or without runoff).
  *   **GS Property Relaxed:** Strategy-Proofness.
  *   **Trade-Off Note:** **[Acceptance]** You accept that voters will strategize (e.g., voting for the "lesser evil"). This is the standard sociological workaround. It is robust but not honest. You must educate voters that their ballot is a strategic tool, not a truth-telling device.

  ---

  ### Walkthrough: The "Scale-Only" Board

  *Scenario: The Board answers **Yes** to Question 4 (Published Policy Scale) and **No** to all other questions.*

  1.  **Q1 (Shortlist):** **No.** The Board requires a single winner. *Proceed to Q2.*
  2.  **Q2 (Randomness):** **No.** The Board rejects lotteries. *Proceed to Q3.*
  3.  **Q3 (Intensity):** **No.** The Board prefers ordinal rankings. *Proceed to Q4.*
  4.  **Q4 (Policy Scale):** **Yes.** The Board confirms all options fit a public scale. **STOP.**
  5.  **Result:** **Leaf 4 (The Median Voter Rule).**
  6.  **Implementation:** The bylaws must define the public scale, the method for mapping options to it, and the procedure for voiding non-single-peaked ballots.
  7.  **Caveat:** The Board must acknowledge the risk that members may submit "broken" ballots intentionally to manipulate the count, as noted in the Leaf 4 Trade-Off.

