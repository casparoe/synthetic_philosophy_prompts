answer: |-
  Macbeth exposes the limits of applying Benatar's asymmetry to lineages by presenting familial continuation as a metaphysical good that transcends the sum of individual harms, ultimately grounding its pessimism in the entropy of time rather than the ontology of birth. The play dramatizes the asymmetry's structure most sharply in the coupling of Banquo's murder with the prophecy of his royal heirs, where the guaranteed future goods of the lineage are weighed against the guaranteed present harm to the founder. However, unlike the antinatalist calculation which treats the absence of pleasure for non-existents as neutral, the play treats the future kingship of Banquo's line as a present possession for Banquo himself, collapsing the temporal distance that the asymmetry requires. This foreknowledge conditions the moral landscape by making the potential pleasure of descendants a tangible asset that can be stolen or secured, thereby transforming the "absence of pleasure" into a felt deprivation for the ancestor if the line were to fail. Consequently, the lineage is not treated as a mere sum of individual verdicts but as a singular entity with a value independent of its constituent members, evidenced by the fact that Banquo's death is rendered tragically incomplete rather than morally resolved by the cessation of his suffering.

  Where the play resists the reading is in its treatment of Macbeth's childlessness, which functions as a curse the text endorses rather than a reprieve the audience should welcome. For the asymmetry to hold in a lineage context, the end of Macbeth's line should be viewed as a mitigation of harm—the prevention of future suffering for non-existent children—yet the tragedy depends entirely on our sharing Macbeth's conviction that a "fruitless crown" is a fate worse than death. Lady Macbeth's invocation of infanticide further complicates this, not by validating the prevention of birth, but by instrumentalizing the existing child as expendable matter for political will, suggesting a pessimism about the value of the child rather than the act of creation itself. Ultimately, the play's nihilism in the "tale told by an idiot" speech targets the meaningless repetition of time rather than the harm of existence, marking its pessimism as one of continuation rather than creation. By framing sterility as a rupture in the natural order rather than a moral neutral, *Macbeth* asserts that the value of a lineage lies in its defiance of oblivion, a metaphysical claim that overrides the ethical calculus of individual pain and pleasure central to the asymmetry argument.
