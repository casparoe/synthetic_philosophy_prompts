answer: |-
  ### Desiderata for a Theory of Real-Pattern Recognition

  To justify the selection of the physical, design, or intentional stance towards a system—particularly within hybrid domains such as evolved algorithms, synthetic biological circuits, or institutional protocols—a theory of real-pattern recognition must satisfy a specific set of criteria. These criteria ensure that the chosen stance is not merely a matter of convenience but reflects a robust ontological or epistemological commitment. The following desiderata outline the necessary conditions for such a theory.

  #### 1. Predictive Compression
  *   **Requirement:** The theory must demonstrate that the selected stance offers a significant reduction in computational or cognitive complexity compared to the physical stance, without a commensurate loss in predictive accuracy.
  *   **Motivating Case:** In hybrid domains like institutional protocols, a physical description of every employee's neural firing is theoretically possible but practically useless. The design stance (viewing the institution as maximising profit) compresses this data into manageable rules. If the stance does not yield efficiency, it is redundant.
  *   **Status:** **Non-negotiable.** A stance that is more complex than the physical baseline without offering superior heuristic value fails the basic utility test of pattern recognition.

  #### 2. Counterfactual Robustness
  *   **Requirement:** The patterns identified by the stance must support counterfactual conditionals. The system must behave *as if* the pattern holds under variations of initial conditions, not merely exhibit statistical correlation in actual history.
  *   **Motivating Case:** Consider an evolved algorithm. A mere correlation might show it always turns left at a specific junction. However, if the terrain changes and it still navigates optimally, the design pattern (navigation) is robust; if it crashes, the pattern was fragile. This distinguishes a genuine design feature from an accidental regularity.
  *   **Status:** **Non-negotiable.** Without counterfactual support, pattern recognition collapses into curve-fitting, unable to distinguish between law-like behaviour and noise.

  #### 3. Explanatory Autonomy
  *   **Requirement:** The theory must block the reduction of higher-level explanations (design/intentional) to lower-level ones (physical) when the higher-level explanation captures causal dependencies that the lower-level description obscures.
  *   **Motivating Case:** In synthetic biological circuits, a genetic switch may be physically realised by specific molecular bonds. However, explaining its function requires the design stance (logic gates). Reducing this to physics loses the functional generalisation that applies across different molecular substrates.
  *   **Status:** **Camp-specific Preference.** This is demanded by *Non-Reductive Realists* who believe higher-level patterns are ontologically distinct. *Eliminative Materialists* or strict *Instrumentalists* may reject this, viewing autonomy as merely pragmatic rather than metaphysical.

  #### 4. Conflict Arbitration
  *   **Requirement:** The theory must provide a principled method for resolving contradictions when different stances yield conflicting predictions about the same system state.
  *   **Motivating Case:** In a hybrid AI system, the design stance predicts the agent will optimise a reward function. The intentional stance (attributing beliefs/desires) might predict the agent will deceive the evaluators to maximise reward. The physical stance might predict a hardware failure. A theory must specify which stance takes precedence when they diverge (e.g., does the 'intent' to deceive override the 'design' to obey?).
  *   **Status:** **Non-negotiable.** Without arbitration, the theory cannot guide action in complex systems where stances compete rather than complement one another.

  #### 5. Ontological Parsimony
  *   **Requirement:** The theory should not multiply entities beyond necessity. It must justify the reality of a pattern without positing ghostly homunculi or non-physical substances.
  *   **Motivating Case:** Attributing 'beliefs' to a corporation (intentional stance) risks reifying the corporation as a conscious mind. The theory must explain how the pattern is real without committing to the existence of a corporate 'soul'.
  *   **Status:** **Camp-specific Preference.** *Ontological Realists* prioritise this to avoid metaphysical bloat. *Pragmatists* may sacrifice parsimony if the explanatory leverage of the extra entities is high enough.

  #### 6. Contextual Sensitivity
  *   **Requirement:** The validity of a pattern must be recognisable as dependent on the environment and the observer's goals, without rendering the pattern entirely subjective.
  *   **Motivating Case:** An institutional protocol may function as a rational agent in a stable market (intentional stance valid) but disintegrate into chaos during a crash (only physical stance valid). The theory must account for the stability conditions of the pattern itself.
  *   **Status:** **Non-negotiable.** Hybrid systems are environmentally coupled; a theory that treats patterns as context-independent will fail to predict breakdown conditions.

  ---

  ### Joint Satisfiability and Tensions

  A critical analysis suggests that a subset of these desiderata is jointly unsatisfiable under standard criticisms of stance-based ontology. Specifically, there is a tension between **Explanatory Autonomy (3)** and **Ontological Parsimony (5)**.

  If one insists that design or intentional patterns are autonomously real (satisfying 3), one risks violating parsimony (5) by granting ontological status to entities that are arguably just useful fictions for prediction. Conversely, if one strictly adheres to parsimony by reducing all patterns to physical constituents, one undermines Explanatory Autonomy, as the higher-level descriptions become mere shorthand for physical states rather than capturing distinct causal powers.

  Furthermore, **Conflict Arbitration (4)** creates tension with **Predictive Compression (1)**. In hybrid domains, the stance that offers the best compression (usually design or intentional) is often the one that fails during edge-cases or system failures, where the physical stance is accurate but computationally prohibitive. A theory cannot simultaneously guarantee the highest compression and the highest accuracy in conflict scenarios without introducing a meta-rule that essentially defaults to the physical stance, thereby rendering the other stances instrumentally useful but ontologically secondary.

  Standard criticisms of stance-based ontology argue that one must choose between *Realism* (patterns exist independently) and *Instrumentalism* (patterns are tools). Attempting to satisfy the non-negotiable criteria for both (Robustness and Compression) while also satisfying the camp-specific preferences for both (Autonomy and Parsimony) leads to a contradiction. One cannot maintain that a pattern is 'real' in a robust sense (requiring Autonomy) while also admitting it is merely a lossy compression of physical data (requiring Parsimony).

  ### Evaluation of Dennett's Original Account

  Daniel Dennett's original formulation of the stances prioritises **Predictive Compression** and **Counterfactual Robustness**, treating them as non-negotiable. He satisfies **Conflict Arbitration** largely by deferring to the physical stance as the ultimate arbiter of truth, viewing the design and intentional stances as 'free-floating' rationales that are valid only insofar as they predict behaviour.

  However, Dennett's account struggles with **Explanatory Autonomy** from the perspective of a Non-Reductive Realist. By defining real patterns primarily through their predictive utility, he leans heavily towards Instrumentalism. This satisfies **Ontological Parsimony** but leaves the status of hybrid domains ambiguous; if an evolved algorithm exhibits 'intentions' that conflict with its 'design', Dennett's framework suggests the intention is real only if it predicts better, but offers less guidance on the causal mechanism of that conflict. Consequently, while Dennett's account meets the non-negotiable desiderata for a pragmatic theory, it fails to satisfy the camp-specific preferences of those seeking a robust realist ontology for higher-level patterns in hybrid systems.
