prompt: |-
  I have to submit a two-page dissertation prospectus by the end of the month for a one-year MPhil in moral philosophy, and I want to work on the demandingness objection to consequentialism, but from an angle that isn't the usual one. What got me going was an argument with a friend who took an earning-to-give job straight after graduation: she says she feels no demandingness problem at all, because she settled once on a fixed share of her income and now simply lives by it, whereas people I know who try to stay responsive to every fresh appeal report exactly the burnout, resentment and loss of a personal point of view that the objection is supposed to describe — despite giving, over a lifetime, roughly comparable amounts. That contrast suggests to me that the standard debate has been asking the wrong question. It treats the objection as a complaint about the *magnitude* of what consequentialism requires, and the standard replies (an agent-centred prerogative, scaling requirements down to what can reasonably be asked, distinguishing a criterion of rightness from a decision procedure) all try to reduce the size of the bill. I suspect a large part of the intuitive force comes instead from the *temporal structure* of consequentialist demands: they arrive unpredictably, they carry no closure (there is no point at which the agent can know she has done enough), and they cannot be discharged or pre-paid in advance. Call these three features together the "unschedulability" of consequentialist requirement, and call the positive view I want to explore "budgeted consequentialism": the claim that agents may permissibly adopt a self-binding rule of life — a fixed schedule of time and resources, chosen deliberately and at a favourable moment — even when moment-by-moment maximising would do more good.

  So please write the prospectus around that half-formed idea, turning it into something a committee would fund. Specifically: state the question precisely enough that it has a determinate answer; explain why the existing answers leave it open (in particular, why the prerogative strategy and the decision-procedure strategy both presuppose that magnitude is what is at issue); set out the method as a month-by-month plan for nine months of actual work, including how I would test the structural thesis — I'm imagining paired cases in which the total lifetime cost is held fixed while the scheduling features are varied, e.g. a levy announced at the start of a career versus the same sum extracted in unpredictable lump sums, a demand with a stated endpoint versus an open-ended one, a demand that can be pre-paid versus one that cannot; distinguish budgeted consequentialism from plain rule-consequentialism and from the indirect or "alienated" consequentialist strategy, since my supervisor insists it will collapse into one of them and I need a paragraph that pre-empts her; and give an honest treatment of what I think of as the one-level-up worry, namely that the demandingness objection simply reappears at the point of choosing the budget, especially given that agents have incentives to set the budget low or to choose a low-earning career in order to shrink the base it is levied on — I want to know whether you think that worry is decisive. Please also set out the possible conclusions and say which considerations would decide between them, what a successful deliverable would look like for someone outside philosophy (say, for people in the pledge-style giving movement), and, importantly, what would count as the project failing: my own guess is that it fails if the paired cases turn out not to differ intuitively at all, or if the regress can't be stopped, or if the budgeted view can't be told apart from rule-consequentialism. Don't include a bibliography or any citations; I'll add those myself, and I'd rather you didn't hazard any. Please write the whole thing in British English.
reasoning: |-
  Here's a thinking process that leads to the dissertation prospectus:

  1.  **Analyze the Request:**

      *   **Topic:** The demandingness objection to consequentialism.
      *   **Angle:** Not magnitude (how much is demanded), but temporal structure (unschedulability: unpredictability, lack of closure, inability to pre-pay).
      *   **Proposed Solution:** "Budgeted Consequentialism" (agents may adopt self-binding rules/schedules chosen at a favourable moment, even if moment-by-moment maximizing would do more good).
      *   **Format:** Two-page dissertation prospectus.
      *   **Context:** One-year MPhil in Moral Philosophy.
      *   **Deadline:** End of the month.
      *   **Language:** British English.
      *   **Specific Requirements:**
          *   State the question precisely.
          *   Explain why existing answers (prerogative, decision-procedure) fail (they focus on magnitude).
          *   Set out a month-by-month method plan (9 months).
          *   Include testing the structural thesis (paired cases: fixed lifetime cost, varied scheduling).
          *   Distinguish from Rule Consequentialism and Indirect/Alienated strategies (pre-empt supervisor's objection).
          *   Address the "one-level-up worry" (regress: demandingness reappears at budget selection).
          *   Set out possible conclusions and deciding considerations.
          *   Describe successful deliverable for non-philosophers (e.g., effective altruism/pledge movement).
          *   Define failure conditions (no intuitive difference in cases, regress unstoppable, indistinguishable from rule consequentialism).
          *   *No bibliography or citations.*

  2.  **Determine Structure and Tone:**

      *   **Tone:** Academic, rigorous, persuasive, yet acknowledging the "one-year MPhil" scope (ambitious but feasible).
      *   **Structure:**
          *   Title.
          *   Research Question.
          *   Background & Problem (Existing literature gap).
          *   Proposed Thesis (Budgeted Consequentialism).
          *   Differentiation (Rule Consequentialism/Indirect Strategy).
          *   Methodology (9-month plan + Paired Cases).
          *   The Regress Worry (One-level-up).
          *   Outcomes & Impact (Success/Failure conditions, Practical deliverable).
      *   **Length:** Needs to fit roughly two pages (single-spaced standard academic formatting implies around 800-1000 words, but "two-page prospectus" can sometimes mean up to 1200 depending on margins/fonts. I need to be concise but dense). *Self-correction:* I will aim for high density to ensure all constraints are met within a reasonable word count that visually fits two pages.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but academic. *The Temporal Structure of Demand: A Defence of Budgeted Consequentialism.*
      *   **Research Question:** Needs to be determinate. *Is the intuitive force of the demandingness objection driven by the magnitude of sacrifice required, or by the temporal structure of the requirement?*
      *   **Background:** Summarize the user's insight. Standard replies (Scheffler, decision procedures) reduce the *amount*. But the friend anecdote suggests *structure* matters.
      *   **Thesis:** Budgeted Consequentialism. Agents can bind themselves to a fixed schedule.
      *   **Differentiation:** Crucial section.
          *   vs. Rule Consequentialism: RC selects rules based on *acceptance utility*. Budgeted Consequentialism selects rules based on *agent's psychological sustainability* within an act-consequentialist framework (or a hybrid). It's about *permission* to deviate from maximisation for structural reasons, not because the rule itself maximises.
          *   vs. Indirect Strategy: Indirect says "think non-consequentialistically to act consequentialistically." Budgeted says "bind yourself structurally to maintain agency." It's a structural permission, not a cognitive trick.
      *   **Methodology:** 9 Months.
          *   Months 1-2: Lit review & Case construction.
          *   Months 3-5: Testing paired cases (thought experiments).
          *   Months 6-7: Addressing the Regress Worry.
          *   Months 8-9: Writing & Refining.
      *   **The Regress Worry:** This is the "one-level-up" problem. If choosing the budget is itself subject to maximisation, the demand returns. I need to propose a solution: perhaps a "constitutional moment" or a threshold view. I must be honest here: if the regress holds, the project fails.
      *   **Outcomes:**
          *   Success: Shows structure matters independently of magnitude.
          *   Failure: Cases don't differ, regress holds, or collapses into RC.
          *   Practical: Guidance for effective altruists on pledge structures (fixed % vs. open-ended).

  4.  **Refining and Polishing (British English & Constraints):**

      *   *Check:* British spelling (maximising, programme, defence, centre).
      *   *Check:* No citations.
      *   *Check:* Address the supervisor's potential objection specifically.
      *   *Check:* Ensure the "paired cases" are described clearly.
      *   *Check:* Ensure the "one-level-up" worry is treated honestly.

  5.  **Drafting the Content (Iterative refinement for length and clarity):**

      *   *Intro:* Start strong. The demandingness objection is usually about *how much*. I argue it's about *when* and *how*.
      *   *The Gap:* Scheffler-style prerogatives reduce the demand. Decision procedures hide the demand. Neither addresses the *unschedulability*.
      *   *The View:* Budgeted Consequentialism.
      *   *Distinction:* This is the tricky bit. I need to make sure it doesn't sound like Rule Consequentialism. RC says "Follow rule R because R maximises good." Budgeted says "Follow rule R (even if it doesn't maximise good in this instance) because the *structure* of R preserves the agency required to be a moral actor over time." It's a modification of the *requirement*, not the *criterion*.
      *   *Method:* Break it down month by month.
      *   *Regress:* Acknowledge the risk. If setting the budget is too demanding, the problem persists. Proposed solution: Distinguish between *choosing* a budget (high stakes, one-off) and *keeping* it (low stakes, daily).
