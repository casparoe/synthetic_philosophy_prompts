answer: |-
  **Dissertation Prospectus**

  **Title:** The Temporal Structure of Demand: A Defence of Budgeted Consequentialism

  **Research Question**
  This project addresses a specific determinate question: *Is the intuitive force of the demandingness objection to consequentialism driven primarily by the magnitude of the sacrifice required, or by the temporal structure of the requirement?* Standard literature assumes the former, proposing solutions that reduce the quantum of obligation. I hypothesise that the latter is decisive. Specifically, I will investigate whether agents suffer moral burnout not because they are asked to give too much, but because they are asked to give without closure, predictability, or the ability to pre-pay. The project aims to defend 'Budgeted Consequentialism': the claim that agents may permissibly adopt a self-binding rule of life—a fixed schedule of time and resources chosen deliberately at a favourable moment—even when moment-by-moment maximising would produce marginally more good.

  **Background and Gap in Existing Literature**
  The demandingness objection posits that consequentialism requires too much of the agent, infringing upon their personal point of view. Standard replies attempt to lower the bill. The agent-centred prerogative strategy permits agents to prioritise personal interests up to a certain threshold of cost. The decision-procedure strategy distinguishes the criterion of rightness from the psychological method of decision-making, suggesting agents should not calculate consequences constantly. Both strategies presuppose that magnitude is the issue. They seek to reduce the *amount* demanded or the *cognitive load* of calculating it.

  However, anecdotal evidence from high-commitment altruists suggests a divergence: agents who fix a lifetime contribution (e.g., a fixed percentage of income) report sustainable moral satisfaction, whereas those who remain responsive to every fresh appeal report burnout, despite comparable lifetime contributions. This suggests the objection targets the *unschedulability* of consequentialist requirements: their unpredictability, lack of closure, and resistance to pre-payment. Existing frameworks lack the vocabulary to address this structural grievance, as they treat all demands of equal magnitude as morally equivalent regardless of temporal distribution.

  **Proposed Thesis and Distinctions**
  I will argue for Budgeted Consequentialism. This view holds that the temporal structure of obligation is a legitimate moral variable. An agent is not required to maximise at every moment *t*, but may instead maximise over a life-plan *L* that includes periods of non-maximising rest, provided *L* was chosen under favourable conditions.

  A primary challenge, anticipated by my supervisor, is that this view collapses into Rule Consequentialism or the indirect 'alienated' strategy. I will pre-empt this by drawing a sharp distinction. Rule Consequentialism selects rules based on the utility of their general acceptance; if a budgeted rule does not maximise acceptance utility, it is impermissible. Budgeted Consequentialism, conversely, operates within an act-consequentialist framework (or a hybrid) but modifies the *theory of obligation* to acknowledge psychological constraints on agency as morally relevant inputs. It is not that the rule maximises good; it is that the *structure* of the rule preserves the agent's capacity to be a moral actor. Similarly, it differs from the indirect strategy, which advises non-consequentialist thinking to achieve consequentialist ends. Budgeted Consequentialism does not advocate self-deception; it advocates a structural permission to deviate from maximisation to prevent agency collapse.

  **Methodology and Work Plan**
  The project will proceed over nine months, utilising a thought-experimental methodology to isolate variables.

  *   **Months 1–2:** Literature review and refinement of the 'unschedulability' criteria. Construction of paired cases where total lifetime cost is held fixed while scheduling features vary.
  *   **Months 3–5:** Testing the structural thesis. I will present subjects and peers with cases such as: (A) a career levy announced at the start versus (B) the same sum extracted in unpredictable lump sums; (C) a demand with a stated endpoint versus (D) an open-ended one; (E) a demand that can be pre-paid versus (F) one that cannot. If intuitions diverge between A/B, C/D, and E/F despite identical magnitudes, the structural thesis is supported.
  *   **Months 6–7:** Addressing the 'one-level-up' worry. I will analyse whether the demandingness objection reappears at the point of choosing the budget. If agents are incentivised to set the budget low to shrink the levy base, does the problem regress? I will test whether a 'constitutional moment' approach (binding choices made under low-stakes conditions) can halt the regress.
  *   **Months 8–9:** Drafting, revision, and formulation of practical deliverables.

  **The One-Level-Up Worry**
  The most significant theoretical risk is that the demandingness objection simply migrates. If choosing the budget is itself subject to consequentialist scrutiny, agents face a demanding requirement to set the 'correct' budget, potentially leading to the same anxiety the budget was meant to cure. I do not believe this worry is decisive, provided we can distinguish between the *context of justification* (choosing the life-plan) and the *context of execution* (living it). If the choice of budget can be insulated from moment-by-moment pressure—perhaps by appealing to a threshold view where any budget above a certain sufficiency level is permissible—the regress can be stopped. However, if this insulation proves impossible, the project will fail.

  **Outcomes, Impact, and Failure Conditions**
  A successful dissertation will demonstrate that temporal structure is an independent variable in moral demandingness. For non-philosophers, particularly in the pledge-style giving movement, the deliverable will be a framework for designing sustainable commitment devices. It would suggest that organisations should encourage fixed, pre-paid, or time-bound pledges rather than open-ended responsiveness to minimise burnout without reducing total aid.

  The project will be deemed to have failed under three conditions: (1) if the paired cases turn out not to differ intuitively, suggesting magnitude is indeed the sole driver; (2) if the regress at the budget-selection stage cannot be stopped without abandoning consequentialism entirely; or (3) if the distinction from Rule Consequentialism cannot be maintained, rendering the view a mere redescription of existing theory. Conversely, success looks like a robust defence of the moral permissibility of 'closing the ledger' on one's obligations, even when more could be done.
