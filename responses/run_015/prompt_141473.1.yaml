      *   No citations? (Yes).
      *   All specific prompts answered? (Question, Existing Answers, Method, Distinction, Regress, Outcomes, Failure conditions).

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the distinction from Rule Consequentialism is sharp. The supervisor thinks it will collapse. I need to argue that Rule Consequentialism justifies the rule by its *consequences of acceptance*, whereas Budgeted Consequentialism justifies the rule by the *structural relief it provides to the agent* within a primarily act-based framework (or a modified criterion). Actually, better to frame it as: RC changes the *criterion of rightness*. Budgeted Consequentialism keeps the criterion but modifies the *theory of obligation* regarding temporal extension.
      *   *Correction on Regress:* Be honest. If the regress isn't solvable, the project fails. Don't promise a solution that isn't there. State that resolving this is a key milestone.

  8.  **Final Word Count Check:** A standard A4 page with 12pt font and standard margins is roughly 500 words single-spaced. So I need roughly 1000 words. I will write tightly.

