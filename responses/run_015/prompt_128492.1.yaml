answer: |-
  You have carved out a precise mechanism that sits at the intersection of philosophy of science, STS (Science and Technology Studies), and critical data studies. You are right to feel that the existing labels are either too broad (performativity), too psychological (Hacking's looping), or too statistical (endogeneity).

  Here is the breakdown of the landscape, the distinctions you need, and a proposal for a term if you decide to claim the territory.

  ### (a) The Nearby Concepts and Why They Miss
  There is no single established term that captures the *triad* you identified: (1) third-party behavioral change, (2) biased data generation, and (3) **re-estimation/retraining** that locks the bias in as truth. Here is how the nearest neighbors fall short:

  1.  **Hacking's "Looping Effects":**
      *   **Fit:** High on the feedback structure.
      *   **Miss:** You are correct that Hacking's paradigmatic cases (e.g., "multiple personality disorder," "refugee") rely on the *classified subject* changing their self-conception or behavior in response to the label. While Hacking acknowledges bureaucratic loops, the literature overwhelmingly focuses on the *human kind* reacting to the classification. Your cases are about the *measurer* reacting to the classification.
      *   **Distinction:** Hacking = Subject reacts to label. Your Case = Institution/Third-party reacts to label *and* updates the measuring instrument.

  2.  **Performativity (MacKenzie/Callon):**
      *   **Fit:** High on the "theory makes the world" aspect. MacKenzie's distinction between *Barnesian performativity* (a theory makes the world conform to it) is very close to your bank run example.
      *   **Miss:** Performativity usually implies the *underlying reality* changes (e.g., traders actually start using the Black-Scholes model). In your policing and hospital cases, the underlying reality (crime rate, health status) might be static; what changes is the *detection probability*. Performativity doesn't always account for the **epistemic laundering** where a measurement artifact is re-described as a natural kind via re-estimation.

  3.  **Goodhart's / Campbell's Law:**
      *   **Fit:** High on "measure becomes target."
      *   **Miss:** These laws assume *gaming* or *optimization* by the target (e.g., teachers teaching to the test). Your cases involve *surveillance bias* (more patrols = more found crime) without necessarily implying the target is gaming the system.

  4.  **Algorithmic Feedback Loops (Barocas, Selbst, Eno):**
      *   **Fit:** Perfect on the technical mechanism (biased data retrains the model).
      *   **Miss:** This literature is often technical or legalistic. It lacks the *ontological* vocabulary you need for a philosophy paper (i.e., how the "kind" comes to look natural/discovered rather than built).

  **Verdict:** The best existing umbrella is **Performativity**, specifically a variant of **Measurement Performativity** (discussed by Espeland & Sauder under "Reactivity"). However, none of these tightly capture the **re-estimation step** that creates the illusion of discovery.

  ### (b) The "Third-Party" vs. "Self-Conception" Loop
  This is a **real distinguishing mark**, not a red herring.
  *   **Hacking's Loop:** Requires *interpretive flexibility* on the part of the classified. If the classified don't know or care, the loop breaks (in his framework).
  *   **Your Loop:** Is *structural*. It works even if the classified are inert, unaware, or non-human (e.g., illiquidity). The loop runs through the *observer's apparatus*, not the object's psyche.
  *   **Why it matters:** This makes your phenomenon more robust and harder to disrupt. You cannot "educate" the residents of Neighborhood X out of this loop, because the loop doesn't run through their self-understanding. It runs through the police dispatcher's algorithm. This distinguishes your "kind" as **Institutionally Constituted** rather than **Psychologically Constituted**.

  ### (c) The "Recording Only" Case (Measurement Artifact vs. Ontological Change)
  *   **Case:** Flagging changes *only* what gets recorded, not the underlying rate.
  *   **Classification:** This is **Surveillance Bias** (or Detection Bias) that has undergone **Ontological Laundering**.
  *   **Same Phenomenon?** Yes, it is the same *mechanism*, but a different *ontological outcome*. In the bank run case, the fragility is real (ontological change). In the policing case, the crime rate might be static, but the *recorded* rate is real (epistemic change treated as ontological).
  *   **Which to target?** For a short paper, target the **Recording Only** case. It is the more insidious and philosophically interesting version. It demonstrates that *robustness* (the numbers keep going up) does not imply *truth* (the crime rate is actually higher). It attacks the realist intuition that "if we measure it consistently, it must be real."
  *   **Name:** If you separate them, call the recording-only version **"Epistemic Solidification"** and the behavior-changing version **"Ontological Solidification."** Both are instances of the broader mechanism.

  ### (d) Reflexivity (Everyone Knows)
  *   **Does it matter?** No. This is a feature of **Institutional Inertia**.
  *   **Why:** The loop is sustained by *incentive structures* and *risk aversion*, not ignorance. A police chief might know the data is biased, but if they reduce patrols and crime *appears* to spike (due to random variance or temporary displacement), they get fired. The "re-estimation rule" is often baked into budget allocations or insurance requirements.
  *   **Term:** This is **Reflexive Stability**. The system is stable *because* it is known to be fragile. (See: Soros's theory of reflexivity, though he focuses on markets).

  ### (e) The Runaway Version
  *   **Name:** **Runaway Performativity** or **Degenerate Feedback**.
  *   **Status:** It is the same animal, just unstable. In control theory terms, your "settled" case has negative feedback (damping), while the runaway case has positive feedback (gain > 1).
  *   **Example:** A "death spiral" in insurance markets (healthy people leave, premiums rise, more healthy people leave).
  *   **Paper Strategy:** Treat the settled version as the primary phenomenon. The runaway version is a failure mode of the same mechanism.

  ---

  ### The Coinage: If You Want to Own It

  Since the existing terms require too much caveating ("It's like Hacking but without the self-conception, and like Performativity but focused on measurement bias..."), you should coin a term that captures the **re-estimation** and the **ontological settling**.

  **Proposed Term:** **"Performative Calibration"**
  **Alternative:** **"The Reification Loop"**

  I recommend **"Performative Calibration."** It captures the *making* (performative) and the *updating of the instrument* (calibration) based on the biased output.

  **Definition:**
  > **Performative Calibration** occurs when an institutional classification alters third-party detection behaviors, generating biased data that is used to re-estimate the classification criteria, thereby stabilizing the classification as an ontologically robust kind despite its constructed origins.

  **In/Out Criteria:**
  *   **IN:** Predictive policing (patrols generate data that justifies patrols); Risk-based medicine (monitoring generates diagnoses that justify monitoring); Bank runs (panic generates illiquidity that justifies panic).
  *   **OUT:**
      *   *Self-fulfilling prophecy:* (No re-estimation of the criteria; the belief just comes true once).
      *   *Hacking's Looping:* (Relies on the classified subject's self-conception).
      *   *Goodhart's Law:* (Relies on the target gaming the metric, not the measurer changing detection).
      *   *Simple Measurement Error:* (No feedback loop; the error doesn't retrain the system).

  **Why this works for your paper:**
  1.  **It isolates the mechanism:** It highlights the *calibration* step (re-estimating thresholds) which is the engine of the "robustness."
  2.  **It handles the ontology:** "Performative" signals that the kind is made, not found. "Calibration" signals that the *instrument* is changing, not just the world.
  3.  **It allows for the "Recording Only" case:** You can have Performative Calibration where the underlying reality doesn't change, but the *calibration of the instrument* makes it look like it does.

  **Suggested framing for the abstract:**
  "While Ian Hacking's 'looping effects' describe how classified people change in response to labels, and performativity describes how theories make markets, neither captures the specific mechanism by which *measurement apparatuses* validate themselves. I propose **Performative Calibration** to describe loops where institutional sorting alters third-party detection, generating data that retrains the sorting criteria, resulting in kinds that are empirically robust yet ontologically constructed."

  This gives you the carving you need without getting bogged down in the "is it social construction?" debate. You're describing the *machinery* of construction.
