prompt: |-
  Hi, I'm a retired field biologist—spent years looking at lichen, now I'm reading philosophy badly and having a great time. I've got a question about Gödel and the afterlife that I hope you can finally settle for me, because the popsci stuff online is frustratingly vague and I don't have any library access.

  Here's where I've got to. Gödel had that modal ontological argument: he defines a Godlike being as one that has all positive properties, necessary existence is treated as a positive property, and—voila—a Godlike being exists necessarily. He also wrote down a list of philosophical beliefs, including "4. There are other worlds and rational beings of a different and higher kind." and "5. The world in which we live is not the only one in which we shall live or have lived." And of course he's famous for the incompleteness theorems, which show any sufficiently strong formal system can't prove its own consistency from inside.

  Now, I've been playing with a little model I call the "Recursive Soul Ladder." The idea is: if you treat a human personality as a bundle of positive properties—say, the property of being kind, or being good at math, or being disposed to love lichen—then, since positive properties are supposed to be closed under implication and necessary existence is positive, any bundle rich enough should, uh, "ladder up" to neccessary existence too, right? I mean, if a Godlike being gets neccessary existence for free just by having all the positives, why shouldn't a sufficiently nice lichenologist get a guaranteed encore? Especially since Gödel says we'll live in other worlds. I'm imaging those "other worlds" are, like, physical places later in cosmological history—maybe after the heat death of the universe, or in the actual future of our own cosmos—so of course I want to know how to book a ticket. And if incompleteness tells us the system can't see its own consistency from the inside, isn't that just Godels way of saying the soul can't verify its own immortality while embodied, so you need the afterlife to check the proof?

  So, straight question: using Gödel's own framework, can I prove that my "Recursive Soul Ladder" gives me a personal afterlife—not just that a God exists, but that *I*, with my memories of lichen, go on to one of those other worlds? And if the ladder only gets me to a necessary God and not to little old me, what's the smallest extra assumption I'd have to smuggle in to give myself an "eternal tenure track"? Please explain the logical mistake in my setup using the modal machinery rather than just pointing me to books I can't check. Also, is it cheating to think of possible worlds as future epochs of our own universe? If so, why does everyone keep saying "worlds" if they don't mean that?

  Thanks! — Delbert (retired, lichen)
