  *(Plan for "Smallest Extra Assumption"):* To get Delbert immortality, you'd need to axiomatize "Delbert-ness" as a positive property that entails necessary existence. But that breaks the system because "Delbert-ness" implies contingency. So the assumption must be that "Contingent Identity" is compatible with "Necessary Existence," which is a contradiction in standard modal logic (Kripke). I should explain this tension.

