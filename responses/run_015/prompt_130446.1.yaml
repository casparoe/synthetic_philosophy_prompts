          *   Explain why the MOA doesn't scale down. It works for the *Maximal* (God), not the *Partial* (Human).
          *   *The Logical Mistake:* The "Closure under Entailment" axiom. If $P$ is positive and $P \rightarrow Q$, then $Q$ is positive. But "Being Delbert" entails contingent facts. Necessary existence entails existing in *all* worlds. If Delbert exists necessarily, he exists in worlds where lichen never evolved. Is that still Delbert?
          *   *The "Bundle" Issue:* Gödel's argument requires the *essence* of the being to be purely positive. Human personalities contain neutral or negative properties (or at least contingent ones).
