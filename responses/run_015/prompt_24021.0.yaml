answer: |-
  # Q&A Prep Sheet: Condorcet Jury Theorem (CJT) & Democratic Defense

  **Context:** 15-minute Q&A. Audience: PolSci, Social Choice, Bayesians.
  **Core Thesis:** CJT is a red herring for defending democracy because its assumptions (binary, $p>0.5$, independence) are empirically false, rendering it normatively inert.
  **Strategy:** Concede the *mathematical* elegance to save the *political* critique. Do not get dragged into proving the assumptions fail (they know they fail); argue that *relaxing* them destroys the theorem's intuitive force as a *justification*.

  ---

  ### 1. The "Straw Man" Objection (Highest Damage)
  **The Objection:** "You're attacking a ghost. Serious epistemic democrats (Estlund, Landemore) haven't relied on the basic CJT for decades. They use it as a heuristic or combine it with deliberative models. If you're arguing against the *textbook* CJT, you're right, but if you're arguing against *contemporary epistemic democracy*, you're misrepresenting the field. Why should we care that a simplified model fails if the sophisticated models survive?"

  **2-Minute Reply:**
  "I grant that high-theory epistemic democrats have built scaffolding around the CJT. However, my target isn't just the seminar room; it's the *public justification* of democracy. When democracy is defended in policy circles, constitutional courts, or public discourse against authoritarian efficiency claims, the argument is almost invariably the 'wisdom of crowds' intuition derived directly from CJT. It's the 'brand name' argument for epistemic democracy.
  If the foundational intuition is empirically brittle, the sophisticated superstructures lose their foothold in public reason. My claim is that CJT is doing the heavy lifting in the *political* defense of democracy, even if social choice theorists have moved on. If the core engine is a red herring, the vehicle doesn't move, regardless of the paint job."

  **Soft Spot / Concession:**
  *   **Concede:** Explicitly acknowledge that Estlund/Landemore do not rely *solely* on basic CJT.
  *   **Save:** Argue that their work is inaccessible to the broader political discourse that actually needs the defense. If the "simple version" is false, the complex version loses its rhetorical power, which is where the normative work happens.

  ### 2. The "Robustness" Objection (High Damage)
  **The Objection:** (From a Social Choice Theorist) "You're treating the assumptions as all-or-nothing. We know from List, Goodin, and others that CJT results are robust to relaxing independence and competence. As long as the *average* competence is above 0.5 and correlation isn't perfect, the asymptotic result holds. Doesn't this undermine your claim that the theorem does 'no work'? It does work under weaker, more realistic conditions."

  **2-Minute Reply:**
  "It's true that generalizations exist. But there is a trade-off between robustness and intuitive force. The basic CJT is powerful because it's simple: 'Make voters slightly better than random and independent, and truth is guaranteed.' The generalized versions require complex constraints on covariance matrices or specific distributions of competence that are just as hard to verify empirically as the original assumptions.
  When a politician says 'democracy works because the majority is usually right,' they are invoking the simple CJT intuition. Telling them 'yes, provided the correlation structure of voter error satisfies condition X' strips the theorem of its justificatory power. A defense of democracy that requires a statistician to verify the covariance of voter errors before accepting the legitimacy of an election is no defense at all."

  **Soft Spot / Concession:**
  *   **Concede:** Admit that *mathematically* the result can hold under weaker conditions.
  *   **Save:** Argue that *normatively*, a theorem that requires unverifyable statistical conditions cannot serve as a public justification for legitimacy. The "work" it does is pedagogical/rhetorical, and that is broken.

  ### 3. The "Normative Mismatch" Objection (Medium-High Damage)
  **The Objection:** (From a Political Scientist) "You're assuming democracy is supposed to track truth. But many of us argue democracy is about procedural fairness, autonomy, or conflict resolution, not epistemic correctness. If democracy isn't in the business of finding the 'correct' answer, why does it matter if CJT fails? You're solving a problem democracy doesn't have."

  **2-Minute Reply:**
  "That is a strong proceduralist position, but it ignores the instrumental defense that dominates real-world politics. When citizens tolerate the inefficiency and gridlock of democracy, they often do so because they believe it produces *better outcomes* than dictatorship in the long run. That is an epistemic claim.
  If we retreat entirely to proceduralism, we lose the ability to criticize democratic outcomes that are procedurally sound but substantively disastrous. CJT is the bridge between procedure and outcome. If that bridge is out, we are left with a 'pure proceduralism' that cannot explain why we prefer democracy to a fair coin flip or a lottery, both of which are also procedurally fair but lack epistemic value. I'm arguing we *need* the epistemic defense, which is why CJT's failure matters."

  **Soft Spot / Concession:**
  *   **Concede:** Acknowledge that pure proceduralist defenses (e.g., Christiano) are untouched by your critique.
  *   **Save:** Argue that pure proceduralism is insufficient for *stability*. Citizens need to believe the system works instrumentally. If CJT fails, the instrumental belief is unsupported.

  ### 4. The "Binary Approximation" Objection (Medium Damage)
  **The Objection:** "You say choices aren't binary, but in two-party systems with plurality rule, the *vote* is binary. Voters choose A or B. Doesn't the theorem apply to the aggregation mechanism even if the policy space is multidimensional? The theorem explains why the *winner* is selected, not the nuance of the platform."

  **2-Minute Reply:**
  "The ballot is binary, but the *competence condition* ($p > 0.5$) relies on there being a 'correct' option to be competent *about*. In a multidimensional policy space, there is no single 'correct' candidate. Competence becomes subjective preference.
  If voter 'competence' is just alignment with their own interests, CJT collapses into a tautology about majority rule, not truth-tracking. For CJT to work as a defense, there must be an independent standard of correctness. In complex elections, that standard vanishes. So, while the *counting* is binary, the *epistemic condition* required for the theorem to justify the count is not met."

  **Soft Spot / Concession:**
  *   **Concede:** Admit that for simple referenda (e.g., "Leave/Remain"), the binary objection is weaker.
  *   **Save:** Argue that general elections (the bulk of democratic practice) are not referenda, so the theorem fails where it is most needed.

  ### 5. The "Sleeper" Objection (The One You Hope They Don't Ask)
  **The Objection:** (From the Bayesian Statistician) "You're treating CJT as a positive justification (it proves democracy works). But isn't its real value negative? It specifies the *failure conditions*. If we see high correlation (polarization) or low competence (misinformation), CJT tells us *why* democracy is failing. Doesn't that make it a vital diagnostic tool, even if it doesn't guarantee success?"

  **2-Minute Reply:**
  "That is a compelling reframing. I am willing to concede that CJT has value as a *diagnostic* model for identifying pathologies like polarization or systemic misinformation.
  However, my thesis is specifically about CJT as a *defense* or *justification* of the institution. A diagnostic tool tells you when the car is broken; it doesn't explain why you should buy the car in the first place. If we use CJT primarily to show when democracy fails, we are admitting it cannot do the work of legitimizing democracy when it succeeds. It shifts the theorem from a shield to a mirror. I accept that utility, but it supports my broader claim: it cannot bear the normative weight of justifying the regime."

  **Soft Spot / Concession:**
  *   **Concede:** **Fully concede this.** This is the strongest point against you. Admit that CJT is excellent for identifying *epistemic breakdown*.
  *   **Save:** Draw a hard line between *diagnosis* and *justification*. Your talk is about the latter. If they accept this distinction, you survive. If they argue diagnosis *is* a form of justification (by showing we can fix it), you must push back that fixing the conditions (e.g., forcing independence) might require anti-democratic means.

  ---

  ### General Advice for the Session
  *   **Watch the Clock:** 15 minutes is roughly 4 questions. If you get the "Sleeper," answer it quickly and pivot back to the "Justification vs. Diagnosis" distinction.
  *   **Body Language:** When conceding (especially on the Robustness and Sleeper points), nod and look collaborative. "That's an excellent distinction..." When defending the core thesis (Straw Man/Normative), lean in. "But here is the political reality..."
  *   **The "Bayesian" Trap:** If the statistician presses you on priors, do not engage on the math. Say: "My concern is the *political interpretation* of those priors, not the updating mechanism itself."
  *   **Closing:** If time allows, end by reiterating: "We need a defense of democracy that works for *actual* humans, not *Condorcet* humans."
