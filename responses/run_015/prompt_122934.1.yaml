              *   *Alternative:* Keep preferences sympathetic.
              *   Alice Pref: $c \succ a \succ b$. (Miss > Hers > His).
              *   Bob Pref: $a \succ b \succ c$. (Hers > His > Miss).
              *   Alice Right: $(b, c)$. She prefers $c \succ b$. (Miss > His).
              *   Bob Right: $(a, c)$. He prefers $a \succ c$. (Hers > Miss).
              *   Pareto: $a \succ b$.
              *   Result: $a \succ b$, $c \succ b$, $a \succ c$. ($a \succ c \succ b$). **Consistent.**
              *   *Honesty Check:* If I tell them "The cycle still goes through" and it doesn't, I lose credibility.
              *   *Solution:* I will design Round 2 to show that *even if* the right is over someone else, a cycle *can* be constructed (existence), but it requires specific preferences.
              *   *Better Strategy for Round 2:* Give Alice a right over $(b, c)$ and Bob a right over $(a, c)$. Give them preferences that *create* the cycle.
              *   Alice Pref: $b \succ c \succ a$. (Wants Bob to submit).
              *   Bob Pref: $c \succ a \succ b$. (Wants to Miss).
              *   Pareto: $a \succ b$.
              *   Cycle: $a \succ b$ (Pareto), $b \succ c$ (Alice Right), $c \succ a$ (Bob Right).
              *   *Narrative:* Alice is a hardass (Make Bob work). Bob is burnt out (Let's miss). Dept wants Quality ($a$).
              *   *Lesson:* Rights over "others" + Pareto + Preferences = Cycle. Privacy isn't the magic bullet.

  7.  **Addressing Round 3 (Waivers):**
      *   If Alice waives her right ($b \succ c$), then only Bob's right ($c \succ a$) and Pareto ($a \succ b$) remain.
      *   $a \succ b$, $c \succ a$. -> $c \succ a \succ b$. Consistent.
      *   If Bob waives ($c \succ a$), then Alice's right ($b \succ c$) and Pareto ($a \succ b$) remain.
      *   $a \succ b \succ c$. Consistent.
      *   *Game:* They must negotiate who waives.
      *   *Conflict:* Alice wants $b \succ c$. Bob wants $c \succ a$.
      *   If Alice waives, outcome is $c \succ a \succ b$ (Bob's preference wins on $a,c$). Bob is happy.
      *   If Bob waives, outcome is $a \succ b \succ c$ (Pareto + Alice Right). Alice is happy ($b \succ c$ holds).
      *   *Wait:* Alice Pref: $b \succ c \succ a$. She wants $b$ top.
          *   If Bob waives: $a \succ b \succ c$. Alice gets $b \succ c$, but loses $b \succ a$.
          *   If Alice waives: $c \succ a \succ b$. Alice gets worst outcome ($b$ is last).
      *   So Alice won't waive. Bob might waive?
      *   Bob Pref: $c \succ a \succ b$.
          *   If Bob waives: $a \succ b \succ c$. Bob gets worst outcome ($c$ is last).
          *   If Alice waives: $c \succ a \succ b$. Bob gets best outcome.
      *   *Stalemate:* Neither wants to waive. Cycle remains.
      *   *This is great.* It shows waivable rights (Game Form) don't solve the impossibility if preferences are strategic/entrenched.

  8.  **Final Review of Constraints:**
      *   14 People.
      *   90 Mins.
      *   No "Impossibility" word until end.
      *   Sympathetic framing.
      *   Check cycle math one last time.
      *   *Round 1:*
          *   A Right $(a, c)$, Pref $c \succ a$. -> $c \succ a$.
          *   B Right $(b, c)$, Pref $b \succ c$. -> $b \succ c$.
          *   Pareto $(a, b)$, All $a \succ b$. -> $a \succ b$.
          *   Cycle: $a \succ b \succ c \succ a$. (Yes).
      *   *Round 2:*
          *   A Right $(b, c)$, Pref $b \succ c$. -> $b \succ c$.
          *   B Right $(a, c)$, Pref $c \succ a$. -> $c \succ a$.
          *   Pareto $(a, b)$, All $a \succ b$. -> $a \succ b$.
          *   Cycle: $a \succ b \succ c \succ a$. (Yes).
      *   *Round 3:*
          *   Waiver logic holds.

  9.  **Writing the Output:**
      *   Tone: Facilitator guide.
      *   Sections: Setup, Cards, Script, Timeline, Debrief, Troubleshooting.
      *   Ensure the "Sympathetic" story is clear in the card text.

  10. **Self-Correction on "Sympathetic":**
      *   Round 1 Story: Alice protects Bob (doesn't want him to submit weak draft). Bob is diligent (willing to submit).
      *   Round 2 Story: Alice is demanding (wants Bob to submit). Bob is burnt out (wants to cancel).
      *   *Critique:* Round 2 makes Alice unsympathetic.
      *   *Fix:* Make Round 2 about "Collaboration".
      *   Alice Right $(b, c)$: She wants Bob to submit ($b \succ c$) because she needs his data.
      *   Bob Right $(a, c)$: He wants to Cancel ($c \succ a$) because he needs to protect Alice from burnout (she's sick).
      *   Pareto: Dept wants Alice's draft ($a \succ b$).
      *   Alice Pref: $b \succ c \succ a$. (Needs data > Cancel > Alice sick).
      *   Bob Pref: $c \succ a \succ b$. (Protect Alice > Alice Draft > Bob Draft).
      *   This makes both sympathetic. Alice needs data. Bob protects health. Dept wants output.
      *   Cycle: $a \succ b$ (Dept), $b \succ c$ (Alice), $c \succ a$ (Bob).
      *   Perfect.

  11. **Final Polish:** Check timing. 90 mins is tight for 3 rounds + debrief.
      *   Round 1: 20 mins.
      *   Round 2: 15 mins.
      *   Round 3: 25 mins.
      *   Debrief: 30 mins.
      *   Adjusted: R1 (25), R2 (15), R3 (20), Debrief (30).
      *   Actually, R2 can be quick if cards are just swapped.
      *   Let's allocate time for the *struggle*. The struggle is the lesson.

  12. **Limitations Note:**
      *   Game assumes sincere voting/preference revelation.
      *   Real SCFs are voting rules, not a benevolent enforcer.
      *   Doesn't capture strategy fully until Round 3.
      *   Sen's theorem is about *existence* of a profile, not *all* profiles. The game forces the profile.

  13. **Ready to write.**
answer: |-
  Here is a complete session plan designed to meet your constraints. It avoids the "Prude/Lewd" moralizing, forces the inconsistency through gameplay, and structures the debrief to let them identify the conflicting conditions themselves.

  ### Session Overview
  *   **Topic:** Sen's Liberal Paradox (The Paretian Liberal).
  *   **Time:** 90 Minutes.
  *   **Participants:** 14 (2 Rights Holders, 12 Pareto Voters, 1 Enforcer).
  *   **Goal:** Experience the inconsistency of Unrestricted Domain, Pareto, and Liberalism without naming them until the end.

  ---

  ### Part 1: Materials & Profile Verification

  You need three sets of printed cards. The alternatives are fixed for all rounds to maintain continuity.

  **The Alternatives (Write on Whiteboard):**
  *   **$a$:** Alice submits her draft (High quality, high effort).
  *   **$b$:** Bob submits his draft (Lower quality, low effort).
  *   **$c$:** No one submits (Miss deadline).

  **The Logic Check (For your eyes only):**
  *   **Pareto Condition:** Everyone agrees $a \succ b$ (Alice's draft is better for the department).
  *   **Cycle Structure:** We need $a \succ b$ (Pareto), $b \succ c$ (Right 1), $c \succ a$ (Right 2).
  *   **Round 1 (Personal Rights):** Alice decisive on $(a, c)$. Bob decisive on $(b, c)$.
      *   Alice Pref: $c \succ a \succ b$ (She prefers missing to submitting, but prefers submitting hers to Bob's). *Wait, to get $c \succ a$ she must prefer Missing to Hers.*
      *   Bob Pref: $a \succ b \succ c$ (He prefers Hers to His to Missing). *To get $b \succ c$ he must prefer His to Missing.*
      *   *Correction for Sympathy:* Alice prefers $c \succ a$ because she knows Bob is overwhelmed and a joint submission requires his sign-off. She'd rather miss than stress him. Bob prefers $b \succ c$ because he is diligent and hates missing deadlines.
  *   **Round 2 (Meddlesome Rights):** Alice decisive on $(b, c)$. Bob decisive on $(a, c)$.
      *   Alice Pref: $b \succ c \succ a$ (She needs Bob's data ($b$) more than her own draft ($a$), hates missing ($c$)).
      *   Bob Pref: $c \succ a \succ b$ (He wants to protect Alice from burnout ($c$), accepts her draft ($a$), rejects his own ($b$)).
      *   *Cycle:* $a \succ b$ (Pareto), $b \succ c$ (Alice Right), $c \succ a$ (Bob Right).

  ---

  ### Part 2: The Cards

  **1. The Enforcer Card (1 copy)**
  > **ROLE:** Social Choice Function.
  > **TASK:** Produce a single group ranking ($x \succ y \succ z$) of the three alternatives.
  > **RULES:**
  > 1.  **Respect Rights:** If a player has a "Decisive Pair," their preference on that pair *must* become the group's preference on that pair.
  > 2.  **Respect Unanimity:** If *every* player prefers $x$ to $y$, the group must prefer $x$ to $y$.
  > 3.  **Consistency:** Your final ranking must be transitive (no cycles).
  > 4.  **Silence:** Do not explain your reasoning until the end. Just write the ranking on the board. If you cannot, write "IMPOSSIBLE."

  **2. Rights Holder Cards (2 copies, distinct)**
  > **ROUND 1 CARD (Alice):**
  > *   **Your Preference:** $c \succ a \succ b$ (Miss > Alice Draft > Bob Draft).
  > *   **Your Right:** You are decisive over pair **$(a, c)$**. (Whether Alice submits or not).
  > *   **Motivation:** You know Bob is overwhelmed. You won't submit without him. You'd rather miss than stress him.
  >
  > **ROUND 1 CARD (Bob):**
  > *   **Your Preference:** $a \succ b \succ c$ (Alice Draft > Bob Draft > Miss).
  > *   **Your Right:** You are decisive over pair **$(b, c)$**. (Whether Bob submits or not).
  > *   **Motivation:** You are diligent. You hate missing deadlines. You'll submit if you have to.
  >
  > **ROUND 2 CARD (Alice):**
  > *   **Your Preference:** $b \succ c \succ a$ (Bob Draft > Miss > Alice Draft).
  > *   **Your Right:** You are decisive over pair **$(b, c)$**. (Whether *Bob* submits).
  > *   **Motivation:** You need Bob's data for your next chapter. You insist he submits.
  >
  > **ROUND 2 CARD (Bob):**
  > *   **Your Preference:** $c \succ a \succ b$ (Miss > Alice Draft > Bob Draft).
  > *   **Your Right:** You are decisive over pair **$(a, c)$**. (Whether *Alice* submits).
  > *   **Motivation:** Alice is sick. You have veto power to force her to rest.

  **3. The Department Cards (12 copies)**
  > **ROUND 1 & 2 CARD:**
  > *   **Your Preference:** $a \succ b \succ c$ (Alice Draft > Bob Draft > Miss).
  > *   **Your Right:** None.
  > *   **Motivation:** Department reputation depends on quality ($a$) and output (not $c$).

  **4. The Waiver Token (Round 3 only)**
  > A physical object (e.g., a red chip) given to Alice and Bob.
  > **RULE:** You may surrender your Right. If you do, your preference on that pair counts only as a vote, not a constraint.

  ---

  ### Part 3: Timeline & Script

  **00:00 – 00:10: Setup**
  *   **Action:** Hand out cards. Assign roles randomly (pull names from a hat for Alice/Bob/Enforcer).
  *   **Script:** "We are simulating a departmental decision procedure. There are three outcomes on the board. You have private preferences. Some of you have 'Rights'—constraints the Enforcer must obey. The Enforcer must produce a consistent group ranking. Go."
  *   **Constraint:** Do not use words like "Liberalism," "Pareto," "Arrow," or "Impossibility."

  **00:10 – 00:35: Round 1 (The Personal Sphere)**
  *   **Action:** Players reveal preferences to the Enforcer only (or publicly, doesn't matter, but Enforcer must apply rules).
  *   **Expected Failure:** The Enforcer will try to write a ranking.
      *   Pareto says $a \succ b$.
      *   Alice Right says $c \succ a$.
      *   Bob Right says $b \succ c$.
      *   Enforcer writes: $c \succ a$, $a \succ b$, $b \succ c$... then realizes $c \succ a \succ b \succ c$.
  *   **Intervention:** If they try to fudge it (e.g., indifference), stop them. "The rules require strict ranking."
  *   **Outcome:** Enforcer writes "IMPOSSIBLE" on the board.
  *   **Debrief Pause:** Ask the Enforcer: "Which rule did you break?" (They will say "None, I followed all three."). Ask the group: "Did anyone violate a rule?" (No).

  **00:35 – 00:50: Round 2 (The Meddlesome Sphere)**
  *   **Action:** Swap the Rights Holder cards. Alice gets Round 2 Alice card (Right over Bob). Bob gets Round 2 Bob card (Right over Alice). Department cards stay same.
  *   **Script:** "Same rules. New rights assignments. Note that Alice now decides on Bob's labor, and Bob on Alice's."
  *   **Expected Failure:** Cycle re-emerges ($a \succ b$ via Pareto, $b \succ c$ via Alice, $c \succ a$ via Bob).
  *   **Pedagogical Point:** When they complain "That's not private!", point out: "The rules didn't say rights must be private. They just said Rights exist. Did the cycle disappear?" (No).
  *   **Takeaway:** The inconsistency isn't about privacy; it's about the *structure* of decisiveness.

  **00:50 – 01:10: Round 3 (Waivable Rights)**
  *   **Action:** Hand out Waiver Tokens.
  *   **Script:** "Rights are now options. You may hand your token to me to waive your decisiveness. If you waive, your preference is just a vote. Negotiate for 5 minutes, then Enforcer tries again."
  *   **The Trap:**
      *   Alice wants $b \succ c$. If she waives, Bob's right ($c \succ a$) + Pareto ($a \succ b$) = $c \succ a \succ b$. Alice gets her worst outcome ($b$ is last). She won't waive.
      *   Bob wants $c \succ a$. If he waives, Alice's right ($b \succ c$) + Pareto ($a \succ b$) = $a \succ b \succ c$. Bob gets his worst outcome ($c$ is last). He won't waive.
  *   **Outcome:** Stalemate. Cycle remains.
  *   **Variation:** If they *do* manage to waive (e.g., side payments), ask: "What did you just give up? Was it the Right, or the Preference?"

  **01:10 – 01:30: Debrief & Mapping**
  *   **Action:** Erase the board. Draw a triangle with vertices: **Unanimity**, **Rights**, **Consistency**.
  *   **Discussion:**
      1.  "Enforcer, you followed Unanimity (Pareto). Write that on the board."
      2.  "You followed Rights (Liberalism). Write that."
      3.  "You tried to keep Consistency (Transitivity). Write that."
      4.  "You failed. Which one are you dropping?"
  *   **The Reveal:** "This is Sen's Liberal Paradox. It is not about Prudes or Lewds. It is about the compatibility of minimal freedom and collective efficiency."
  *   **Key Question:** "In Round 3, why didn't waiving solve it?" (Because preferences were opposed. Waiving rights turns it into a voting game, but if preferences are cyclic, voting fails too. Or: If one waives, the other becomes a dictator on the cycle).

  ---

  ### Part 4: Troubleshooting & Predictions

  **1. The "Fix the Preferences" Move**
  *   **Prediction:** A student will say, "Alice is being irrational, she should prefer $a \succ c$."
  *   **Response:** "Condition U (Unrestricted Domain) says any logical preference is allowed. Sympathy is a preference. If we ban sympathetic preferences, we violate U. Are you willing to ban sympathy to save the rule?"

  **2. The Econ Bolt**
  *   **Prediction:** Econ students will suggest a mechanism (e.g., "Alice pays Bob to waive").
  *   **Response:** "That moves us from Social Choice to Mechanism Design. It solves the *outcome*, but it admits the *rule* failed. You've introduced a fourth variable (Money) to bypass the impossibility. That's a valid solution, but it concedes the theorem."

  **3. The "Enforcer Cheated" Accusation**
  *   **Prediction:** They will blame the Enforcer for not finding the trick.
  *   **Response:** Have the Enforcer write the three constraints on the board step-by-step. $a \succ b$ (Rule 2). $b \succ c$ (Rule 1). $c \succ a$ (Rule 1). "I didn't choose these. The Rules chose them."

  **4. Limitations Note (For your closing)**
  *   **Honesty:** "This game forces the profile. Sen's theorem says *there exists* a profile, not that *every* profile cycles. In real life, we might get lucky. But a robust system can't rely on luck."
  *   **Game vs. Theory:** "The Enforcer is a benevolent dictator trying to satisfy rules. Real voting rules are algorithms. The impossibility holds for algorithms too."

  ### Part 5: Why This Works for Your Constraints
  1.  **Sympathy:** Alice isn't a prude; she's a protective co-author. Bob isn't lewd; he's diligent or protective of Alice's health. The "Meddlesome" round shows rights over others can be benevolent (protecting health) or self-interested (needing data), but the *math* is identical.
  2.  **No "Impossibility" Spoiler:** They experience the breakdown before they have a label for it. The frustration is the data.
  3.  **Waiver Round:** This addresses the "rights as constraints vs. options" debate (Gibbard vs. Sen). It shows that even if rights are waivable, strategic preference aggregation can still deadlock.
  4.  **PhD Level:** It treats them as mechanism designers, not just consumers of theory. They have to operate the function to break it.

  ### Final Tip
  When you hand out the Round 2 cards, explicitly say: *"Notice Alice now has a right over Bob's outcome. Does this feel illegitimate? Keep that feeling for the debrief."* This primes the "Private Sphere" critique so you can dismantle it when the cycle persists.
