answer: |-
  **Joint Statement of Adversarial Collaboration: The Temporal Ontology of Color Phi**

  **Participants:** Camp 1 (Phenomenological/Verificationist) and Camp 2 (Mechanistic/Realist).
  **Subject:** The Color Phi phenomenon (apparent motion with mid-path color change despite sequential stimuli).

  **1. Agreed Claims**
  We establish the following load-bearing premises to constrain the debate:

  1.  **Report Validity:** Verbal reports reliably establish the *content* of the subject's experience (i.e., that a single object moved and changed color). Neither camp disputes the phenomenology itself, only its temporal metadata.
  2.  **Cross-Modal Generalization:** The temporal anomaly generalizes to auditory and tactile apparent motion. Any account must explain the modality-independent timing mechanism or admit multiple distinct mechanisms producing identical reports.
  3.  **Limitations of Existing Designs:** Current neuroimaging correlates are selected based on coincidence with report. Therefore, existing neural data confirms only that *some* processing occurs before report, not that conscious experience occurs before the second stimulus is physically processed.
  4.  **Mutual Obligations:** Camp 1 owes Camp 2 an explanation of how phenomenal time remains coherent if neural latency varies wildly without altering report. Camp 2 owes Camp 1 a method for identifying the neural correlate of consciousness (NCC) that does not presuppose the timing it seeks to measure.

  **2. Disagreements**

  | Issue | Neutral Statement | Camp 1 Formulation | Camp 2 Formulation |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Timing** | Does experience have a timestamp independent of report? | The time of experience is constituted by the subject's temporal framing in report. There is no "hidden" clock. | Experience is a natural event supervening on neural activity. It has a definite onset time regardless of whether the subject can report it. |
  | **Epistemic Authority** | Can neural data override subjective timing? | Report is the primary datum. Neural data explains the *cause* of the report, not the time of the experience. | Neural latency constraints are primary. If the neural signal arrives late, the experience must be late, implying the report is retrospectively dated. |
  | **Exhaustiveness** | Do Orwellian/Stalinesque options cover the space? | The dichotomy is false. Experience may be temporally indeterminate; asking for a precise timestamp is a category error. | The dichotomy is exhaustive regarding causal flow. Either the draft existed and was edited (Orwell), or it was constructed late (Stalin). Indeterminacy is just uncertainty. |

  **3. Cruxes and Experimental Designs**
  We identify three specific cruxes. For each, we specify a design and pre-register conflicting predictions.

  **Crux 1: Authority of Report vs. Causal Latency**
  *Question:* Does the subject's report regarding *when* they experienced the color change have authority over physical causality?
  *Design:* **Stretched Delay.** Increase the inter-stimulus interval (ISI) between Flash A and Flash B well beyond the standard integration window (e.g., from 100ms to 500ms).
  *   **Camp 1 Prediction:** As long as the subject reports apparent motion, the color change is experienced "mid-path." The phenomenal timeline scales or compresses to fit the narrative. The report settles the timing.
  *   **Camp 2 Prediction:** At some ISI threshold, the illusion must break or the dating must shift. The brain cannot construct the "mid-path" experience before Flash B arrives. If the report claims mid-path timing despite a 500ms delay, the report is a post-hoc confabulation, not a record of experience time.

  **Crux 2: Circularity of Neural Correlates**
  *Question:* Can neural evidence be independent of report?
  *Design:* **Involuntary Index.** Measure smooth-pursuit eye movement onset or pupillary dilation relative to the apparent path, requiring no verbal report.
  *   **Camp 1 Prediction:** Oculomotor systems are driven by the same perceptual constructs as verbal report. If the eye moves to the "mid-path" before Flash B processing is possible, this confirms the phenomenal timeline, not a separate physical one. It remains correlated with the subject's reality, not the stimulus clock.
  *   **Camp 2 Prediction:** Involuntary indices track neural processing latency, not phenomenal dating. We expect the eye movement to initiate only after Flash B is processed, diverging from the reported "mid-path" timing. This divergence breaks the circle, showing report is dated differently than the motor command.

  **Crux 3: Indeterminacy vs. Definite Mechanism**
  *Question:* Is the Orwell/Stalin dichotomy exhaustive, or is experience temporally indeterminate?
  *Design:* **TMS/Masking Intervention.** Apply TMS or a masking flash to visual cortex at variable delays after Flash B but before report.
  *   **Camp 1 Prediction:** Disruption alters the content of the report, thereby altering the fact of the experience. If the subject reports no color change, there was no color change. There is no fact about "what would have happened" without the mask. Timing is indeterminate until finalized by report.
  *   **Camp 2 Prediction:** Disruption reveals the underlying timeline. If masking at 50ms prevents the illusion but masking at 150ms does not, the experience was constructed between 50-150ms. This establishes a definite window (Stalinesque), proving the experience had a specific onset time independent of the final report content.

  **4. Falsification and Progress**
  To prevent the collaboration from stalling in verbal dispute, we define conditions under which each camp acknowledges significant pressure on their view.

  **Camp 1 Falsification Conditions:**
  Camp 1 holds that report constitutes the fact of experience timing. They concede their view is undermined if:
  1.  **Behavioral Dissociation:** In the Stretched Delay design, subjects report "mid-path" color change but fail to catch a physical object placed at that mid-path location during the motion. If report claims X but action fails at X, report cannot constitute the fact.
  2.  **Neural Pre-emption:** In the Involuntary Index design, if motor initiation consistently precedes the earliest possible neural integration time required for the reported content, implying the report is describing a state that did not causally drive the behavior.

  **Camp 2 Falsification Conditions:**
  Camp 2 holds that experience has a definite neural timestamp discoverable independent of report. They concede their view is undermined if:
  1.  **Variable Realization:** Neural timing for the same reported experience varies by >100ms across trials or subjects without any change in behavioral accuracy or reported phenomenology. This would suggest the "time of experience" is not tightly coupled to neural onset.
  2.  **Indeterminacy Proof:** If TMS intervention shows that disrupting processing changes the *report* but leaves subsequent behavioral priming intact (indicating the experience was "fixed" earlier but the report was edited), Camp 2 must accept that the "time of experience" is not a single point but a process compatible with Orwellian revision.

  **Agreement on Progress:**
  Both camps agree that the debate is moved only by **dissociation**. Results where neural timing, involuntary behavior, and verbal report all align merely reinforce the status quo. We seek data where these three diverge.
  *   If Report diverges from Action: Camp 2 gains ground (Report is not authoritative).
  *   If Neural Timing diverges from Report but Action aligns with Report: Camp 1 gains ground (Neural timing is not the experience).
  *   If Intervention shows Report is edited but Action is not: The Orwellian hypothesis is supported, and Camp 1 must address whether "edited memory" counts as the experience itself.

  We commit to treating these results as binding constraints on our respective theories, rather than opportunities for reinterpretation.
