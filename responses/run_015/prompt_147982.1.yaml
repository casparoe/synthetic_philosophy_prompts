      *   Disagreements Table (300 words)
      *   Cruxes & Designs (400 words)
      *   Falsification (250 words)
      *   Total ~1300.

  6.  **Writing - Focusing on Precision:**
      *   *Agreed Claims:* Make sure claim 4 (what camps owe each other) is sharp.
      *   *Table:* Keep it tight.
      *   *Cruxes:* Assign the specific experiments requested.
          *   Stretched Delay -> Crux 1 (Report Authority/Scaling).
          *   Involuntary Index -> Crux 2 (Circularity).
          *   TMS/Masking -> Crux 3 (Indeterminacy/Mechanism).
      *   *Falsification:* Be specific.

  7.  **Review against Constraints:**
      *   "Don't let Camp 1 quietly win by defining their claim so that nothing could ever touch it." -> I need to ensure Camp 1's falsification condition is robust. They must agree that if behavior fails while report succeeds (or vice versa), their view is pressured.
      *   "No citations."
      *   "1000-1400 words."

  8.  **Final Polish:** Check flow and ensure the voice sounds like a joint document, not a summary of one. Use "We agree," "Camp 1 holds," etc.

  *(Self-Correction during drafting)*: I need to make sure the "Indeterminate Timing" crux is clear. Is it that the experience *itself* lacks a precise timestamp, or that the Orwell/Stalin dichotomy is false? The prompt suggests: "whether the honest answer is that the experience's timing is indeterminate over an interval." I will frame Crux 3 around this specific metaphysical/phenomenological claim.

