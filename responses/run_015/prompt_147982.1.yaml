  *Refining Camp 1's position:* Camp 1 isn't necessarily saying "neural stuff doesn't matter." They are saying "The question 'when did the experience happen?' is answered by the subject, not the clock." To avoid tautology, they must admit that if the subject's report becomes unreliable (dissociates from action), their claim weakens.

