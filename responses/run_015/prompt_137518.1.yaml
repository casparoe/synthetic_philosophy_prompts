answer: |-
  # Seminar Handout: Decision Tree for the Great Divergence
  **Course:** Historical Explanation (PHD 501)  
  **Topic:** Specifying the *Explanandum* in Comparative History

  ## The Decision Tree
  To move from the vague intuition ("Why Britain and not China?") to a researchable question, you must make five sequential methodological commitments. Each branch narrows the logical space of possible answers.

  1.  **Validity of Contrast:** Is the Britain/China binary a valid causal comparison, or an artifact of hindsight?
      *   *Valid:* Proceed to 2.
      *   *Ill-posed:* Recast as a global transition timing problem (Leaf 1).
  2.  **Symmetry of Relatum:** Are we explaining Britain's success, China's failure, or the gap itself?
      *   *Asymmetric (Why X?):* Proceed to 3.
      *   *Symmetric (Why X vs Y?):* Proceed to 4.
  3.  **Expectation Status (Asymmetric):** Is the outcome (growth) the expected norm or a statistical surprise?
      *   *Expected (Teleological):* Leaf 2.
      *   *Surprising (Anomalous):* Leaf 3.
  4.  **Unit of Comparison:** What spatial entities are being contrasted?
      *   *Nation-State (Britain/China):* Leaf 4.
      *   *Region (England/Yangzi):* Leaf 5.
      *   *Macro-Region (NW Europe/East Asia):* Leaf 6.
  5.  **Temporal Gap:** Are we comparing static levels or dynamic rates?
      *   *Levels (Snapshot c. 1800):* Leaf 7.
      *   *Rates (Trajectory 1700–1850):* Leaf 8.
  6.  **Explanatory Target:** Do we seek a necessary condition or a process?
      *   *Difference-Maker (Variable):* Leaf 9.
      *   *Causal History (Mechanism):* Leaf 10.

  ---

  ## The Leaves: Ten Specified Research Questions

  **1. The Global Transition Timing (Ill-Posed Recast)**
  > "When did the global economy shift from a polycentric system of agrarian growth to a core-periphery structure, and how did geographic location determine a polity's entry time into the industrial phase?"
  > *Diagnosis:* Treats the divergence not as a failure of China but as a stochastic sorting event in a single global transition.

  **2. The Teleological Absence (Expectation: Expected)**
  > "Given the universal tendency of commercialized societies to industrialize, what specific friction prevented China from following the path taken by Britain?"
  > *Diagnosis:* Presupposes growth is the norm; China is the deviation requiring a "blocking" explanation.

  **3. The Malthusian Anomaly (Expectation: Surprise)**
  > "Given the universal constraint of Malthusian traps on agrarian societies, what specific shock enabled Britain to break the path followed by China?"
  > *Diagnosis:* Presupposes stagnation is the norm; Britain is the deviation requiring an "enabling" explanation.

  **4. The Institutional Difference-Maker (Population/Variable)**
  > "Did the presence of secure property rights cause the divergence in growth rates between a population of European and Asian polities?"
  > *Diagnosis:* Treats cases as data points in a statistical model seeking a necessary condition.

  **5. The Regional Parity Check (Symmetric/Levels)**
  > "Why did the Yangzi Delta fail to industrialize c. 1800 given its economic parity with England at that specific moment?"
  > *Diagnosis:* Fixes the contrast at the regional level and the temporal level of 1800 (The Pomeranz Constraint).

  **6. The National Trajectory (Asymmetric/Rates)**
  > "Why did Britain's per capita GDP growth rate accelerate after 1750 while China's remained stagnant?"
  > *Diagnosis:* Fixes the contrast at the nation-state level and focuses on the derivative (growth) rather than the integral (wealth).

  **7. The Cultural Causal-History (Single Pair/Process)**
  > "How did the interaction of Enlightenment norms and guild structures in Britain produce a self-reinforcing innovation cycle absent in Qing China?"
  > *Diagnosis:* Seeks a process narrative within a single counterfactual pair rather than a general law.

  **8. The Geographic Contingency (Single Counterfactual)**
  > "Would Britain have industrialized without access to New World land and domestic coal, holding its institutions constant?"
  > *Diagnosis:* Isolates the contrast to a single counterfactual pair (Britain with vs. without resources) rather than Britain vs. China.

  **9. The Fragmentation Population (Macro-Region/Variable)**
  > "Is the variance in growth rates between NW Europe and East Asia statistically explained by the degree of political fragmentation?"
  > *Diagnosis:* Expands the unit to macro-regions to increase N for institutional variables.

  **10. The Scientific Utility Mechanism (Specific Mechanism)**
  > "Why did the Scientific Revolution translate into useful technology in Britain but not in Qing China?"
  > *Diagnosis:* Narrows the *explanandum* from general growth to the specific mechanism of science-application.

  ---

  ## Methodological Diagnostics

  ### Indistinguishable Leaves
  **Leaf 2 (Teleological Absence) and Leaf 3 (Malthusian Anomaly).**
  While logically distinct regarding expectation, these leaves are often empirically indistinguishable in practice. A historian arguing for "blocking factors" in China (Leaf 2) often relies on the same evidence as one arguing for "enabling shocks" in Britain (Leaf 3), merely inverting the counterfactual. The tree cannot separate them because the evidentiary base for "why not X" is identical to "why Y."

  ### The Unoccupied Node
  **Combination:** *Symmetric Contrast + Expected Take-off.*
  > *Question:* "Given that industrialization was inevitable for all advanced agrarian societies, why did the divergence between Britain and China occur temporarily?"
  > *Diagnosis:* This combination is **unattractive**; it posits a global inevitability that was momentarily glitched, which denies the structural permanence of the divergence that defines the historical debate.

  ### The Real Debate
  **Leaf 5 (The Regional Parity Check)** best captures what historians are actually arguing about.
  Since the publication of Kenneth Pomeranz's *The Great Divergence* (2000), the field has shifted away from asking why Europe was *always* destined to win (Leaf 2) or why institutions were the sole difference-maker (Leaf 4). The central contention now revolves around the validity of the 1800 snapshot: if the Yangzi and England were economically equivalent in 1800 (Leaf 5), then explanations relying on deep cultural or institutional roots (pre-1700) are falsified, forcing the debate toward contingency, resources, and global conjuncture.
