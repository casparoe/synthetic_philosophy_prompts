  1. **The Exam Question**

  **PHILOSOPHY 405: NIETZSCHE — FINAL EXAMINATION**
  **Time Allowed: 90 Minutes**
  **Word Limit: 1,200–1,500 words**

  **Question 1**

  In *The Gay Science* 341, the demon announces that this life, as you have lived it, will return innumerable times. There will be nothing new, but every pain and every joy must return to you in the same succession and sequence.

  Assume the thought experiment functions exactly as announced. Do not distinguish between "cosmological" and "ethical" interpretations, and do not define "affirmation" merely as *amor fati*. Instead, determine which features of the announcement are doing the normative work by analyzing the following three variants. For each, state whether the verdict of the thought experiment (the crushing weight or the divine affirmation) holds or collapses, and why.

  1.  **The Near-Miss Variant:** The loop returns a life differing from yours by an arbitrarily small amount (e.g., one speck of dust falls otherwise). Novelty is restored, but no cycle improves or redeems an earlier one.
  2.  **The Amnesia Variant:** The repetitions are exact and innumerable, but no cycle carries memory or any felt sense of the earlier ones. From the inside, each life is indistinguishable from a first and only one. (Note: The text is silent on cross-cycle memory; you must settle what the device requires.)
  3.  **The Once-More Variant:** The life runs exactly twice and then stops forever.

  Based on your handling of these cases, explain what the thought experiment is really measuring. You must address two further pressures:

  *   **The Scaling Pressure:** If your verdict is sensitive to the *number* of repetitions (innumerable vs. twice), the device risks becoming an aggregative calculation of goods and evils. If it is insensitive, the cosmological claim of innumerability appears to do no work. Resolve this tension.
  *   **The Attitudinal Pressure:** If the verdict depends only on what one *wants*, it can be manipulated by numbing or self-deception rather than by changing the life. Explain whether the device is diagnostic or merely expressive, and what must be true of affirmation for it to be diagnostic.

  ***

  2. **Model Answer**

  The normative weight of the eternal recurrence lies not in the quantity of suffering endured, but in the structural removal of teleological redemption. The thought experiment measures the capacity to will the necessity of the past exactly as it was, without the consolation of future improvement. Consequently, the verdict holds only where the identity of the life and the finality of its structure are preserved.

  In the **Near-Miss Variant**, the verdict collapses. The demon's command is to will *this* life, not a近似 (approximation). If a speck of dust falls otherwise, the chain of causality shifts; the life is numerically distinct. Affirming a near-identical life is easier because it allows the subject to disown the specific errors of the actual past. The load-bearing feature here is strict identity. Without it, the test becomes a preference for a *type* of life rather than a validation of the specific actuality lived. The crushing weight comes from the inability to edit even the smallest regret.

  In the **Amnesia Variant**, the verdict also collapses, though for a different reason. If the subject lacks memory of previous cycles, the knowledge provided by the demon is rendered inert regarding the *experience* of the life. The weight of recurrence is borne in the present moment of knowing. If I know I will live this again, but my future selves will not know they have lived it before, the burden is isolated to my current consciousness. However, the device requires that the *structure* of existence itself be repetitive, not just the subject's knowledge of it. If there is no cross-cycle memory, the "eternal" aspect is ontological but not phenomenological. For the test to be diagnostic of a stance toward existence, the subject must will the return of the *consciousness* that suffers the return. Without memory, the recurrence is indistinguishable from linear time followed by oblivion. The device requires that the weight be felt; thus, memory (or at least the ontological certainty that impacts the present) is necessary.

  In the **Once-More Variant**, the verdict holds. Whether the life returns twice or infinitely is rhetorically significant but logically secondary. The crucial feature is the removal of the "last thing" that redeems the rest. If the life runs twice and stops, the second cycle offers no improvement over the first; it merely replicates it. The horror of recurrence is not the duration of suffering, but the meaninglessness of its repetition. Therefore, innumerability is not strictly required for the normative test to function.

  This resolves the **Scaling Pressure**. If the verdict depended on the number of cycles, affirmation would become a utilitarian calculation: can I endure *this much* pain? But Nietzsche's target is the *structure* of time, not the sum of sensations. Whether the cycle repeats twice or infinitely, the teleological escape route is closed. Innumerability serves to amplify the psychological pressure, ensuring the subject cannot hope for an eventual end or entropy, but it does not change the qualitative nature of the affirmation. The device measures a stance toward necessity, not a tolerance for duration. Thus, the cosmological doctrine of infinite energy serves the ethical test by securing the impossibility of escape, but the test itself functions on the logic of repetition, not aggregation.

  Regarding the **Attitudinal Pressure**, the device must be diagnostic, not merely expressive. If affirmation were simply a matter of wanting the return, one could achieve it through self-deception or numbness (willing nothing rather than willing the life). For the test to diagnose the strength of the will, the "Yes" must involve a revaluation of the past, not a modulation of desire. To affirm the recurrence is to transform the "it was" into a "thus I willed it." This requires active interpretation, not passive acceptance. If I merely numb myself to the pain, I have not affirmed the life; I have affirmed my numbness. Therefore, affirmation is diagnostic of the capacity to create meaning within necessity. It distinguishes the *Übermensch*, who creates the value that makes the repetition bearable, from the "last man," who avoids the question. The thought experiment forces a decision: either change the life so that you can will its return, or admit you cannot. It is a filter for the ability to impose form upon chaos, making it diagnostic of spiritual strength rather than expressive of current preference.

  ***

  3. **Marking Scheme**

  **Total Marks: 20**

  | Criterion | Marks | Description of Success | Common Error |
  | :--- | :---: | :--- | :--- |
  | **1. Near-Miss Variant** | 4 | Identifies that strict identity is required; argues that even minor differences break the "this life" condition, collapsing the verdict. | Treats the variant as functionally identical to the original because the difference is "arbitrarily small." |
  | **2. Amnesia Variant** | 4 | Argues that memory/consciousness of return is required for the *weight* to be felt; distinguishes ontological recurrence from phenomenological burden. | Assumes amnesia makes no difference because the events are the same, ignoring the subject's perspective. |
  | **3. Once-More Variant** | 4 | Commits to whether innumerability is essential. (Full marks for arguing it is *not* essential, provided the removal of redemption is preserved). | Claims the verdict collapses because "infinite" is specified in the text, without analyzing the normative function of the number. |
  | **4. Scaling Pressure** | 4 | Resolves the tension by arguing the test measures qualitative stance (necessity) rather than quantitative sum (utilitarianism). | Succumbs to the pressure, arguing that infinite pain is objectively worse than finite pain, making the test aggregative. |
  | **5. Attitudinal Pressure** | 4 | Distinguishes diagnostic (revaluation of past) from expressive (changing desire/numbing); explains how affirmation transforms meaning. | Treats affirmation as a mood or feeling that can be cultivated independently of the life lived. |

  **Grading Notes:**

  *   **C Range (10–13 marks):** The candidate addresses the three variants but treats them as isolated puzzles rather than evidence for a unified theory of what the thought experiment measures. They likely rely on the forbidden "cosmological vs. ethical" distinction to evade the Scaling Pressure. The Attitudinal Pressure is answered by defining affirmation as "saying yes" without explaining how that differs from self-deception.
  *   **B Range (14–17 marks):** The candidate successfully handles the variants and identifies that identity and non-redemption are key. They resolve the Scaling Pressure by noting the qualitative nature of the test. However, they may hesitate on the Amnesia variant or fail to fully explain *how* affirmation is diagnostic rather than expressive (e.g., they assert it is diagnostic but do not explain the mechanism of revaluation).
  *   **A Range (18–20 marks):** The candidate commits decisively to which features are load-bearing (Identity and No-Redemption). They argue that innumerability is rhetorical amplification, not logical necessity (Scaling). They clearly articulate that affirmation requires transforming the *meaning* of the past ("thus I willed it"), thereby blocking the self-deception objection (Attitudinal). The essay flows as a single argument rather than five separate answers.
