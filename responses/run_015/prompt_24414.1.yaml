answer: |-
  The principle driving your judgments is a hybrid of special obligations based on relational proximity and a threshold of reasonable sacrifice, which forces you to accept that the monetary boundary is inherently fuzzy and that character blame can exist independently of specific act obligations.

  Your kidney intuition is resolved by **special obligations**. Ethics distinguishes between general duties owed to humanity (don't kill, don't steal) and special duties owed to specific people based on relationships (parent to child, friend to friend). Donating to a stranger is supererogatory because you owe them nothing beyond non-harm; donating to your child is obligatory because parenthood creates a fiduciary duty to prioritize their welfare over your own bodily integrity up to a significant point. The act and cost are identical, but the relational context changes the moral valence from "gift" to "due."

  Your pond and money intuitions are governed by a **threshold of reasonable sacrifice**. Duty extends only as far as the cost to you remains "reasonable" relative to the benefit provided. Wet shoes are negligible cost, so saving the kid is mandatory; losing your career is a life-altering cost, so it becomes heroic. This explains the money gradient: $100 is likely within the "fair share" of sacrifice expected of a decent person (duty), while $1,000 exceeds reasonable expectations for most (heroism). The $500 case feels unclear because there is no universal fact of the matter; the threshold shifts based on your income, dependents, and local norms. You must drop the expectation that a sharp, objective line exists there.

  The chronic non-helper paradox is resolved by distinguishing **act-assessment from character-assessment**. While a single instance of not giving up a seat might be technically optional (or a minor infraction), a life pattern of never exceeding the minimum reveals a vicious character lacking in benevolence. You are blaming the person's vice, not necessarily a specific violation of duty. Ethics allows for someone to be "blameworthy" in character even if they haven't committed a specific "wrong" act, because morality evaluates who you are, not just what you do.

  Regarding professionals like lifeguards, **role-based obligations** lower the threshold of sacrifice. A lifeguard is contractually and morally paid to absorb risks that would be heroic for a bystander; for them, jumping in is duty, not heroism. To reconcile your views, you must drop the idea that there is a precise fact of the matter for the $500 donation, and refine your view on the chronic non-helper: you are right to blame them, but you are blaming their character traits rather than a specific rule violation.
