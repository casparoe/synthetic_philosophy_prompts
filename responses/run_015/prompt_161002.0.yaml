answer: |-
  **The Scenario**

  Imagine a twenty-member fishing cooperative sharing a single cold-storage facility. Every week, members are paired at random to clean and maintain a shared freezer unit. Each pair faces a choice: put in the full effort ("Cooperate") or slack off ("Defect"). The payoffs are standard: if both cooperate, the freezer stays perfect and both gain **3 points** (Reward). If one slacks while the other works, the slacker saves energy and gains **5 points** (Temptation), while the worker gets stuck with the whole job and gains **0 points** (Sucker). If both slack, the freezer spoils slightly and both gain **1 point** (Penalty). Note that mutual cooperation (3+3=6) is better than the mixed outcome (5+0=5). Every week, pairings are redrawn randomly; you never know who you're getting. Everyone sees everyone's "Mark"—a public status of Good or Bad. Under **Rule A (The Tally)**, your Mark turns Bad if you Defect, and Good if you Cooperate, regardless of your partner. Under **Rule B (The Excuse)**, your Mark turns Bad if you Defect against a Good partner, but stays Good if you Defect against a Bad partner (justified punishment). Everyone follows their rule strictly. No one makes mistakes; no one misreads a Mark.

  **The Walkthrough**

  *Round 1:* Everyone starts Good and Cooperates. However, one member (let's call him Dave) calculates that defecting yields a higher immediate payoff (5 vs 3). He Defects. He is the only Defector.
  *   **Result:** Dave gets 5. Nineteen Cooperators get 3. Dave's Mark turns Bad. Everyone else stays Good.

  *Round 2:* Pairings are redrawn.
  *   **Under Rule A:** Suppose Alice (Good) is paired with Dave (Bad). Alice's rule says "Defect against Bad." She Defects. Dave (following his strategy) Defects. Both get 1 (Penalty). Crucially, because Alice Defected, her Mark turns Bad. Dave's Mark stays Bad.
      *   *Outcome:* One Bad person has created a second Bad person simply by interacting.
  *   **Under Rule B:** Alice (Good) is paired with Dave (Bad). Her rule says "Defect against Bad." She Defects. Dave Defects. Both get 1. Crucially, because Dave was Bad, Alice's Defection is "justified." Her Mark stays Good. Dave's Mark stays Bad.
      *   *Outcome:* The Bad status is contained. Alice is not infected.

  *Round 3:* The infection spreads under Rule A.
  *   **Under Rule A:** Now there are two Bad people (Dave and Alice). They are more likely to meet Good members. Every time a Good member meets a Bad member, they Defect to protect themselves. Every time they Defect, they become Bad. The number of Bad marks grows exponentially. Soon, almost everyone is Bad. Once you are Bad, everyone Defects against you. If you try to clear your name by Cooperating, you get the Sucker payoff (0) because your partner Defects. If you Defect, you get the Penalty (1). Rationally, you keep Defecting. The system locks into universal defection.
  *   **Under Rule B:** Dave is still the only Bad person. He keeps getting paired with Good people who Defect against him. He earns 1 per round. The Good people earn 3 when they meet each other, and 1 when they meet Dave. Their average payoff is much higher than Dave's. New members copying successful strategies will copy the Good Cooperators, not Dave. Cooperation holds.

  **The One Feature**

  The feature doing the work is **the reputational cost of punishment.** Under Rule A, punishing a norm-violator (Defecting against a Bad mark) is treated identically to exploiting a cooperator (Defecting against a Good mark). Both actions turn your Mark Bad. This makes enforcement costly: you protect your immediate points but sacrifice your future reputation. This creates "moral contagion," where defending yourself against a bad actor turns *you* into a bad actor in the eyes of the group.

  *If removed:* If we remove this feature—meaning punishing a Bad person does *not* tarnish your reputation—Rule A effectively becomes Rule B. If we instead made *both* actions costly (punishment also hurts your reputation even under Rule B), Rule B would fail to contain defectors, because Good members would be afraid to punish Dave, allowing him to exploit them repeatedly.

  **How a Rule A Supporter Would Attack This**

  A proponent of Rule A would argue that my example assumes people are "reputation robots" who cannot distinguish context. They would say: "In a real human group, nobody marks Alice as Bad for defecting against Dave. We know the difference between a thief and a guard."

  *The Tweak:* They would propose adding a "Context Clause" to Rule A: *Your Mark only goes Bad if you Defect against a Good partner.*
  *Is it Cheating?* Yes, in the context of this specific comparison. That tweak literally transforms Rule A into Rule B. It concedes the point that simple tallies fail without context. A genuine fix that keeps Rule A's spirit would be to allow Marks to fade over time (e.g., a Bad mark turns Good after 5 rounds of any behavior). This slows the contagion but doesn't solve the structural incentive problem: as long as punishing makes you look like a defector, the system remains vulnerable to collapse if the "Bad" population gets large enough.

  **Robustness Note**

  This result is **robust** across a wide range of standard Prisoner's Dilemma payoffs (as long as Temptation > Reward > Penalty > Sucker) and group sizes (from 8 to 40). The logic holds whether the group is small or large.

  However, it is **fragile** regarding the information assumption. This model requires *perfect public monitoring* (everyone sees every action and every Mark instantly). In real human groups, information is noisy. If people sometimes miss a defection, or disagree on someone's Mark, Rule B becomes much harder to sustain because people might punish "Good" partners by mistake, triggering feuds. Rule A is actually *more* robust to information noise because it's simpler (just look at the last action), even though it's less stable strategically. So, while Rule B wins on logic, Rule A might win in a foggy, realistic world.

  **Uncertainty and Contested Ground**

  I need to flag two areas where this is not settled law. First, the "evolutionary copying" mechanism is a simplification. In real departments or co-ops, people don't just copy the highest earner; they copy friends, or they stick to habits. If people are stubborn, the collapse under Rule A happens much slower. Second, and more importantly, the assumption of **no mistakes** is the biggest leap. Most cooperation theorists argue that *without* mistakes, almost any norm can hold. The collapse of Rule A usually relies on someone making an error (a "tremble") to start the cascade. In my example, I used a *strategic* defector (Dave) to start it, which satisfies your constraint, but in nature, pure strategic defection is rarer than accidental slips. If you present this as "why simple scoring fails," be prepared for someone to ask: "But what if Dave just slipped up? Does your model handle that?" (The answer is: Rule A handles accidents terribly, Rule B handles them better, but both struggle if accidents are frequent).
