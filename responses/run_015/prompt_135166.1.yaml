      *   **Context:** Sits on a health scheme committee for a research institute.
      *   **The Rule:** Pay for restoration to *normal for that person* (pre-illness/injury). Decline improvement *beyond normal for that person*.
      *   **The Intervention:** A cognitive enhancer (memory retention). Safe, effective, affordable, modest effect (doesn't make anyone "remarkable").
      *   **The Four Cases:**
          1.  Grad student: High -> Illness -> Middle. Wants return to High. (Restoration)
          2.  Lab tech: Middle -> Wants High. (Enhancement)
          3.  Researcher (50s): Current Age-Normal -> Was Higher at 30 (no illness). Wants return to 30s level. (Age-related decline vs. Restoration)
          4.  Technician: Normal -> Night shifts cause collapse. Wants to function on night shifts. (Contextual impairment vs. Internal pathology)
      *   **The Conflict:** The rule seems to fund #1 but deny #2, yet the performance gap between their targets is small compared to population variance. #3 and #4 are ambiguous.
      *   **The Goal:** Not a decision, but a *clearer description* of what is happening. Is there a principled line? What work does it do? If not, what should the committee ask instead?
      *   **Constraints:** Argument-based, no appeal to authorities, no assumed prior reading.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The central tension is between *Treatment* (restoring function) and *Enhancement* (improving function).
      *   The current rule relies on a "Baseline Problem": What counts as the "normal" baseline?
      *   Case 1 is the easiest (clear pathology/event).
      *   Case 2 is the hardest (pure enhancement).
      *   Case 3 challenges the definition of "illness" vs. "aging."
      *   Case 4 challenges the locus of the problem (person vs. environment).

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Acknowledge the User's Background:** Start by validating their ecological perspective. Gradients vs. thresholds is exactly the right lens.
      *   **Analyze the Current Rule (The "Naturalistic" Fallacy):** The rule assumes "normal for *them*" is a stable, identifiable state.
          *   *Problem:* Identity changes over time. Is the 50-year-old the same "person" as the 30-year-old?
          *   *Problem:* "Normal" is statistical vs. functional.
      *   **Analyze the Four Cases through the Lens of "Function":**
          *   Case 1 (Student): Clear disruption of trajectory. The rule works here.
          *   Case 2 (Tech): No disruption, just upward shift. The rule denies this. Why? Because it's not *repair*.
          *   Case 3 (Researcher): Aging. Is aging an illness? The rule says "no illness, no pay." But is the loss of function at 50 different in kind from the loss at 25 due to virus?
          *   Case 4 (Night Shift): The environment changed, not the person. The rule looks for internal fault. This reveals the rule is about *fault*, not just *function*.
      *   **Identify the Hidden Principle:** The rule isn't actually about "health" or "function." It's about *compensation for misfortune*.
          *   Case 1: Misfortune (virus).
          *   Case 2: Ambition (no misfortune).
          *   Case 3: Fate (aging).
          *   Case 4: Structural demand (work conditions).
      *   **Evaluate the "Principled Line":**
          *   Is there a biological line? No (gradients).
          *   Is there a moral line? Yes, but it's about *desert* and *insurance logic*, not biology.
          *   *What work does the line do?* It limits liability. It distinguishes between "fixing bad luck" and "funding ambition."
      *   **What would be lost if the line vanished?**
          *   Cost control (though money is stipulated as available here, generally it matters).
          *   The concept of the scheme as *insurance* rather than *benefit*.
          *   Fairness perceptions (why fund the ambitious tech but not the sick student if funds are limited?).
      *   **Alternative Questions:** If the biological line is fake, what should they ask?
          *   What is the purpose of the institute? (Productivity vs. Welfare).
          *   Is the intervention a tool or a treatment?
          *   Who bears the cost of environmental mismatch?

  4.  **Refining the Tone:**
      *   Must be respectful, intellectual, peer-to-peer.
      *   Avoid jargon (e.g., "normativity," "teleology") without explanation.
      *   Use the user's ecological metaphors (gradients, thresholds, performance curves).
      *   Structure logically: Diagnosis of the rule -> Analysis of the cases -> The underlying principle -> Recommendations.

  5.  **Self-Correction/Critique during Drafting:**
      *   *Initial thought:* Maybe bring in Norman Daniels' "normal species functioning."
      *   *Correction:* No, user said no authorities. Stick to first principles.
      *   *Initial thought:* Focus heavily on the cost aspect.
