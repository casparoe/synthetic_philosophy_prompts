      *   Section 4: What is lost/gained (The purpose of the scheme).
      *   Section 5: New Questions (Shifting from "Is it normal?" to "What is our obligation?").

  8.  *(Self-Correction post-drafting)*: Make sure to explicitly answer "What work is it doing?" and "What ought a committee to be asking instead?" as requested. Ensure the tone isn't condescending. The user is a scientist; treat them as an intellectual equal.

