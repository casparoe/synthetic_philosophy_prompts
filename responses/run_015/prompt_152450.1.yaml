      *   *Distinction:* Bare Reasons (Internal) vs. Role Reasons (External).
      *   *Mechanism:* Uptake Voluntariness (could have refused/foreseeability) makes role demands normative.
      *   *Motivation:* Solves hard cases (brutal agent, addict, depressed) by adding a role.
      *   *Vulnerability:* The Collapse Argument (unchosen roles? chosen roles = internalism?).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Collapse Argument (Friend's Objection).* This is the biggest threat. If unchosen roles (child, citizen) have no reasons, the theory is too narrow. If chosen roles rely on identification, it's just internalism.
          *   *Phrasing:* Likely the Second Reader (Internalist) or Supervisor.
          *   *Reply:* Distinguish *normative force* (from uptake) from *motivational grip* (internal). Unchosen roles often have tacit uptake (staying in the country = citizenship).
          *   *Soft Spot:* Tacit consent is notoriously weak.
          *   *Status:* Contested (Voluntarism about obligation vs. Natural Duty).

      *   *Objection 2: The Camp Guard/Accountant (The "Hope Nobody Raises").* If role reasons are external, does a Nazi guard have a reason to guard well?
          *   *Phrasing:* Third Reader (Value theorist) or Visitor (Psychology).
          *   *Reply:* Distinguish *pro tanto* reason from *overall* reason/ought. The role gives a reason, but morality overrides it. Or, the role is "corrupt" and fails the uptake condition (coercion/ignorance).
          *   *Soft Spot:* If the guard volunteered knowingly, does he *really* have a reason to be efficient at evil?
          *   *Status:* Contested (The "Wrong Kind of Reason" problem).

      *   *Objection 3: Constructivism/Content Fixing.* Supervisor's lane. Is the content of the role fixed by the agent or practice?
          *   *Phrasing:* Supervisor.
          *   *Reply:* Social practice fixes content; will fixes bindingness. Hybrid view.
          *   *Soft Spot:* If practice fixes content, what if the practice is unjust?
          *   *Status:* Contested (Constructivism vs. Realism about institutional facts).

      *   *Objection 4: Motivational Disguise.* Second Reader's lane. Is "could have refused" just a motivational fact about the past self?
          *   *Phrasing:* Second Reader.
          *   *Reply:* No, it's a counterfactual about opportunity, not a current desire. It's about authority, not psychology.
          *   *Soft Spot:* Why does past opportunity bind present psychology?
          *   *Status:* Contested (Historical vs. Structural theories of autonomy).

      *   *Objection 5: Reasons vs. Oughts.* Third Reader's lane. Why talk about reasons? Why not just say "You ought to do X because of the role"?
          *   *Phrasing:* Third Reader.
          *   *Reply:* Reasons explain the *ought*. The role provides the consideration that weighs in deliberation.
          *   *Soft Spot:* If the agent can't access the reason, is it a reason?
          *   *Status:* Contested (Reasons Primitivism vs. Derivative).

      *   *Objection 6: Empirical Prediction.* Visitor's lane. How does this look in deliberation?
          *   *Phrasing:* Visitor.
          *   *Reply:* Agents deliberate differently when role-identified. They cite "Because I am X" not "Because I want Y."
          *   *Soft Spot:* Hard to distinguish empirically from internalized norms.
          *   *Status:* Common Ground (Phenomenology of deliberation).

      *   *Objection 7: The Depressed Parent (Hard Case).* User mentions this. If a parent is depressed, do they have a role reason?
          *   *Phrasing:* Second Reader or Visitor.
          *   *Reply:* Yes, because parenthood usually involves uptake (or foreseeable biological consequence). Depression blocks *bare* reasons, not *role* reasons.
          *   *Soft Spot:* Is biological parenthood a "role" taken up?
          *   *Status:* Contested (Special Obligations).

      *   *Objection 8: Fragmentation of Agency.* General philosophical worry. Does splitting bare vs. role reasons split the self?
          *   *Phrasing:* Supervisor or Third Reader.
