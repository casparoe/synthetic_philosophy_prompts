answer: |-
  # Dissertation Defense Prep Sheet: Role-Anchored Externalism

  **Strategy:** Your friend's collapse argument is indeed the strongest theoretical threat. Do not dodge it. Concede that *truly* unchosen roles (infant citizenship) are a boundary case your theory handles via "ratification" (adult continuation), not original uptake. This saves the voluntariness condition without abandoning the intuition that adults have role reasons. The Camp Guard objection is the strongest moral threat; handle it by distinguishing *functional* reasons from *justified* reasons.

  **Load-Bearing Premises (Disputed):**
  1.  **Voluntarism:** Normative force requires a voluntary act (uptake). (Contested against Natural Duty theories).
  2.  **Dual-Source:** Reasons come from two distinct sources (Bare/Internal vs. Role/External). (Contested against Unified Theories).
  3.  **Reasons Primitivism:** Reasons are the fundamental unit, not 'oughts' or 'values'. (Contested by Reader 3).

  ---

  ### 1. The Collapse Argument (The Friend's Objection)
  **Who:** Second Reader (Internalist) or Supervisor.
  **Phrasing:** "If normativity comes from uptake, you have no account of unchosen roles like childhood or birthright citizenship. If you say uptake isn't required when the agent identifies with the role, you've just described a broad internalist motivational set. You haven't escaped internalism; you've just added a historical condition to the motivational set. Why isn't this just internalism with extra furniture?"
  **Likelihood:** Certain. **Damage:** Fatal if unanswered.

  **Reply (90s):**
  "The collapse happens only if you assume the *source* of the reason must match the *psychological state* at the time of action. My claim is that uptake fixes the **authority** of the role, not the **motivation** for the act. For unchosen roles, I argue for 'ratification': remaining in the role as a competent adult counts as tacit uptake. This distinguishes me from internalism because an internalist says the reason exists only if the agent *currently* cares or could derive it from current cares. I say the reason exists because the agent *bound themselves* to the role, even if they currently resent it. The furniture isn't extra; it's structural. It explains why a depressed parent has a reason to care for a child even if they currently lack the motivational structure to derive that reason from their 'bare' self."

  **Soft Spot:** Tacit ratification is philosophically fragile. If someone stays in a country only because they are too poor to leave, is that ratification? You must concede this is a limit case.
  **Ground Status:** **Contested.** Voluntarism about obligation is a minority position compared to Natural Duty or Associative theories. Internalists will deny that past voluntary acts create present reasons without present motivational hooks.

  ### 2. The Camp Guard / Criminal Accountant
  **Who:** Third Reader (Value) or Visitor (Psychology).
  **Phrasing:** "If role reasons are external and anchored in uptake, does the camp guard who volunteered for his job have a reason to guard efficiently? Does the accountant for a fraud firm have a reason to cook the books well? If you say yes, your theory sanctions immorality. If you say no, you've smuggled a moral constraint back in, and 'role' isn't doing the work."
  **Likelihood:** High. **Damage:** High (Moral credibility).

  **Reply (90s):**
  "We must distinguish a **pro tanto role reason** from an **all-things-considered ought**. My theory claims the guard has a *functional* reason grounded in the role's norms—he has a reason to guard well *qua* guard. This explains why he is blameworthy *within the role* if he is lazy. However, this reason is overwhelmingly outweighed by moral reasons. The normativity of the role is real but defeasible. Alternatively, one could argue that roles requiring immorality fail the 'foreseeability' or 'validity' condition of uptake, much like a contract for slavery is void. I prefer the first option: it explains the phenomenology of 'just following orders' without endorsing the action."

  **Soft Spot:** If you say he has a *reason* to be evil, even a pro tanto one, many find this repugnant. It risks making 'reason' too thin a concept.
  **Ground Status:** **Contested.** This is the "Wrong Kind of Reason" problem. Many philosophers deny that immoral roles can generate genuine normative reasons, even pro tanto.

  ### 3. Content Fixing: Will vs. Practice
  **Who:** Supervisor (Constructivist).
  **Phrasing:** "You say uptake makes the role binding. But what fixes the *content* of the role? Is it the agent's understanding of the role, or the social practice? If it's the agent's will, you risk solipsism. If it's social practice, aren't you just a constructivist about institutions? Where is the externalism?"
  **Likelihood:** High. **Damage:** Medium (Theoretical clarity).

  **Reply (90s):**
  "It is a hybrid view. The **binding force** comes from the agent's will (uptake), which satisfies the voluntariness condition. But the **content** is fixed by the social practice. I am not a pure constructivist because I do not think the agent constructs the reasons through deliberation. The reasons exist independently of their current deliberation, anchored in the social fact of the role which they voluntarily entered. This preserves externalism: the reason is 'out there' in the role's requirements, not 'in here' in their current desires, even though their past will locked them into that 'out there'."

  **Soft Spot:** If the social practice is unjust or incoherent, does the agent still have reasons? You rely on the stability of social facts, which a constructivist might challenge.
  **Ground Status:** **Contested.** The debate between Will Theory vs. Interest Theory of rights/obligations. Your view is a specific hybrid that is not the standard consensus.

  ### 4. The Motivational Disguise
  **Who:** Second Reader (Williams-style Internalist).
  **Phrasing:** "You say the 'could have refused' condition is not motivational. But why does a past possibility bind me now? The only thing that makes that past possibility relevant is that I *now* accept that past commitments matter. Isn't that current acceptance just a motivational state? So you're back in internalism."
  **Likelihood:** High. **Damage:** High (Core mechanism).

  **Reply (90s):**
  "That conflates the **reason** with the **recognition** of the reason. I grant that to be *moved* by the reason, I must recognize it. But the reason's *existence* depends on the historical fact of uptake, not the current psychological state of valuing that uptake. Consider a contract: I have a reason to pay even if I wake up tomorrow wishing I hadn't signed. The reason exists because of the past act, not my current wish. Internalism requires a sound deliberative route from *current* motivations. I require a historical route from *past* agency. These are structurally different."

  **Soft Spot:** The Internalist will press: "Why does the past act matter if you don't currently care about keeping promises?" You need to stand firm that normativity isn't exhausted by current psychology.
  **Ground Status:** **Contested.** This is the heart of the Internalism/Externalism debate. There is no common ground here; you are asserting an externalist premise against an internalist axiom.

  ### 5. Reasons vs. Oughts (The Derivative Objection)
  **Who:** Third Reader (Anti-Primitivist).
  **Phrasing:** "Why frame this as a theory of *reasons*? Isn't this just a theory about when one *ought* to do something? If reasons are just considerations that count in favor, and 'ought' is the verdict, isn't this dispute verbal? You're describing when role-obligations bind, not when reasons exist."
  **Likelihood:** Medium. **Damage:** Medium (Terminological/Scope).

  **Reply (90s):**
  "It's not verbal because it changes the explanation of deliberation. If I'm right, an agent can have a reason they cannot access via deliberation from their bare self. If reasons were derivative from 'ought', we would just say 'You ought to do it.' But saying 'You have a reason' explains the *pull* the role exerts even when the agent feels no 'ought'. It captures the conflict: 'I have a reason to stay (role), but I ought to leave (morality).' My theory explains the weight of the role-reason in that calculation. Collapsing it into 'ought' loses the explanatory power regarding the agent's internal conflict."

  **Soft Spot:** If the agent literally cannot access the reason, does it function as a reason in any meaningful sense?
  **Ground Status:** **Contested.** Reasons Primitivism is a live option but not the dominant view. Many treat 'ought' as primary.

  ### 6. Empirical Prediction & Deliberation
  **Who:** Visitor (Psychology/Rationality).
  **Phrasing:** "What does this predict about actual deliberation? If role reasons are external, how would we see them in a subject's reasoning process? How is 'Because I am a father' psychologically distinct from 'Because I care about being a father'?"
  **Likelihood:** Medium. **Damage:** Low/Medium (Application).

  **Reply (90s):**
  "It predicts a difference in **defeasibility**. When an internalist deliberates ('I care about being a father'), if the care vanishes, the reason vanishes. When a role-anchored agent deliberates ('I am a father'), the reason persists despite the vanishing care. Empirically, you should see agents citing role-identity as a 'stopper' to deliberation that overrides fluctuating desires. They treat the role as a constraint, not a preference. My view predicts that in cases of burnout or depression, agents who identify with the *role* (not just the care) will persist in action longer than those whose reasons are purely bare."

  **Soft Spot:** Hard to disentangle empirically. "Identifying with the role" often looks like "caring about the role."
  **Ground Status:** **Common Ground.** The phenomenology of deliberation is open to investigation, though the interpretation is contested.

  ### 7. The Depressed Parent (Hard Case Application)
  **Who:** Second Reader or Visitor.
  **Phrasing:** "You use the depressed parent as a win for your view. But if the depression is severe enough to destroy agency, how can the 'uptake' condition hold? If they couldn't have foreseen the depression, or if the depression undermines the voluntariness of their continued stay, don't you lose the reason?"
  **Likelihood:** Medium. **Damage:** Medium (Intuition pump).

  **Reply (90s):**
  "Depression affects the *bare* reasons (what they care about) but not necessarily the *role* reasons (what they committed to). The uptake happened before the depression. Unless the depression was so foreseeable that taking the role was negligent, the obligation stands. This is the hard truth of the view: role reasons are robust against psychological fluctuation. That is their function. To say the reason disappears is to say the role disappears, which undermines the stability roles provide. We can offer *excuses* for not acting on the reason, but the reason itself remains."

  **Soft Spot:** This sounds harsh. You must be willing to defend the harshness as a feature, not a bug, of role normativity.
  **Ground Status:** **Contested.** Theories of excuse vs. theories of justification.

  ### 8. Fragmentation of Agency
  **Who:** Supervisor or Third Reader.
  **Phrasing:** "By splitting bare reasons and role reasons, do you fragment the agent? Is there a 'bare self' and a 'role self'? How do they adjudicate conflict without a higher standard? If there is a higher standard, isn't that the real source of reasons?"
  **Likelihood:** Low. **Damage:** Medium (Coherence).

  **Reply (90s):**
  "I am not positing two selves, but two **sources of claim** on one self. Practical rationality is the adjudication process. There is no higher standard other than the agent's own rational weighing of these competing claims. The unity of agency comes from the capacity to weigh, not from the source of the weights. Splitting the sources explains why the conflict feels intractable: it's not just desire vs. desire, it's self vs. commitment."

  **Soft Spot:** If there is no higher standard, what makes the weighing rational? You risk a form of relativism about rationality.
  **Ground Status:** **Contested.** Unity of Reason vs. Fragmentation views.

  ---

  ### Summary of Load-Bearing & Disputed Premises
  *Use this to calibrate your tone. Do not present these as settled facts.*

  1.  **Voluntarism (Disputed):** You assume normative force requires a voluntary act. *Alternative:* Natural duties or associative obligations that bind without choice. *Minority/Majority:* Voluntarism is standard for contracts/roles, but contested for family/citizenship.
  2.  **Dual-Source Theory (Disputed):** You assume "Bare" and "Role" reasons are fundamentally different kinds. *Alternative:* Monism (all reasons reduce to one type, e.g., value or desire). *Minority/Majority:* Dual-source is a specific niche position.
  3.  **Reasons Primitivism (Disputed):** You assume "Reasons" are the thing to be explained, not "Oughts." *Alternative:* Ought-primacy. *Minority/Majority:* Live debate, but Ought-primacy has strong traction.
  4.  **Historical Binding (Disputed):** You assume past acts bind future selves even if current psychology changes. *Alternative:* Structural theories (only current mental states matter). *Minority/Majority:* This is the core Externalist claim against Internalism.

  **Final Advice:** When the Internalist (Reader 2) attacks, do not try to prove them wrong on their own turf (psychology). Move the fight to your turf (institutional stability and the nature of commitment). When the Constructivist (Supervisor) attacks, emphasize that you are not constructing the *content*, only the *bindingness*. Good luck.
