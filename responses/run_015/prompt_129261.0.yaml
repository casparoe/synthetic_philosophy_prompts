  I'm a PhD student in econ, writing my thesis on information design (sender picks a signal structure, receiver best-responds, everything is a Bayes-plausible distribution over posteriors), and my supervisor told me to read the philosophy literature on lying vs misleading for a disclosure chapter. I can't get any of it to map onto something I can actually work with.

  So: restate the main positions on whether there's a moral difference between lying and misleading — the assertion-norm side, the "both are intended deception, so no difference" side, and whatever sits in between — in that vocabulary. Senders, states, priors, signal realizations, obedience constraints, and hard vs soft evidence, since "you can't fake it, you can only leave it out" feels like the closest thing my toolkit has to the misleading case. Don't sneak a cooperative Gricean receiver into the setup and call it a translation.

  The bit I actually want is the residue report. My hunch is that lying collapses into "sent a report that's false in the state it was sent in," misleading collapses into "chose a partition pooling the good states with the mildly bad ones," and that once you've fixed the induced distribution over posteriors the distinction does no work at all — it only reappears if you bolt on something my framework doesn't have, like verifiability, or a receiver who can sanction me, or repetition. Is that right, or am I bulldozing something real? And if there is residue, is it my vocabulary that's missing something, or is it the moral distinction that's softer than the literature makes out? One thing that worries me: the said/implicated distinction looks like it lands on what the receiver infers given the sender's strategy, which would make a moral boundary depend on equilibrium selection — a wierd place for a moral line to sit.
