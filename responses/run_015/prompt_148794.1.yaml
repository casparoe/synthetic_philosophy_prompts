      *   **The User's Tension/Paradox:** Memorial institutions (e.g., Topography of Terror, Berlin Memorial) present the Holocaust as a unique, incomparable rupture (*Singularität*), yet they use modern bureaucratic technologies (databases, taxonomies, protocols) to function.
      *   **The Core Questions:**
          1.  What philosophical commitments does this practice presuppose?
          2.  Does it need a theory of uniqueness that survives administration by the rationality it condemns?
