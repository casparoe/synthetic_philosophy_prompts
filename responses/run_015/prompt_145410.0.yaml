      *   **Refining the "Circularity" point:** Need to be careful here. The coworker says it's circular. Lewis says laws supervene on events. If counterfactuals depend on laws, and laws depend on events (including causes), is it circular? Lewis says no, it's a system. Critics say yes. I should label this *Contested*.
