  *(Self-Correction on the "Circularity" point)*: Actually, the circularity objection (that counterfactuals presuppose causation) is a standard objection from people like Horwich or Cartwright, but Lewisians deny it. I should mark this as "Contested/Debatable" rather than "Wrong."
