  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **On the Aggregation of Harms and the Threshold of Moral Significance**

  **Date:** 24 October 2023
  **Signatories:** The Archimedean Aggregator; The Threshold Theorist

  ## 1. Agreed Claims

  We, the undersigned, having engaged in prolonged dialectical exchange, hereby record the following points of agreement regarding the hypothetical case under discussion and the terms of our continued enquiry.

  1.  **The Nature of the Specks.** We agree to stipulate that the 'dust speck' case involves a momentary, minor irritation to the eye. It is unremembered by the recipient immediately after it occurs, unknown to them that it was inflicted rather than natural, and produces no downstream effects on health, mood, or opportunity. It is a phenomenological blip, not a biographical scar.
  2.  **The Nature of the Torture.** We agree to stipulate that the 'torture' case involves fifty years of continuous, severe physical and psychological agony, resulting in permanent disability and the destruction of the victim's life prospects.
  3.  **The Numbers.** We agree that the number of individuals receiving the dust specks is finite, yet exceeds any number that can be enumerated, visualised, or comprehended by human cognition. It is large enough that any linear intuition regarding counting fails.
  4.  **The Comparison.** The choice is between two mutually exclusive outcomes: Outcome A (one person tortured for fifty years) and Outcome B (the vast number of people each receiving one dust speck). There are no other consequences, side-effects, or agents involved.
  5.  **Excluded Defences.** Neither party may rely on the claim that such a choice could never arise in practice. Neither party may claim that the numbers are so large that the question loses meaning or becomes incoherent. Neither party may appeal to raw intuition as a settled arbiter; intuitions must be explained by theory.
  6.  **Shared Moral Commitment.** We both accept that morality is concerned with the reduction of badness and the protection of individuals' interests. We both accept that if a view implies a conclusion that is overwhelmingly repugnant to considered moral judgement, that view bears a burden of explanation. We both seek a consistent principle that can guide action in less extreme cases.
  7.  **Logical Consistency.** We agree that the law of non-contradiction holds. We agree that 'better than' is a transitive relation. We agree that if Outcome A is worse than Outcome B, then Outcome B is better than Outcome A.

  ## 2. Disagreements Table

  The following table records our respective positions. Each formulation has been approved by the respective signatory as an accurate representation of their view, free from the other's interpretative gloss.

  | Question | The Archimedean Aggregator | The Threshold Theorist |
  | :--- | :--- | :--- |
  | **1. The Status of the Speck** | A dust speck constitutes a genuine harm. It sets back an interest, however slightly. It possesses a positive quantity of disvalue (greater than zero). | A dust speck constitutes a phenomenological irritation but falls below the threshold of *moral* harm. It has no aggregative weight. It is not that the weight is small; it is that it is null for the purposes of summation. |
  | **2. The Mechanism of Aggregation** | Badness aggregates additively across persons. The total badness of an outcome is the sum of the badness for each individual. There is no lower bound on the contribution an individual's setback makes to the total. | Badness aggregates only when individual setbacks cross a threshold of severity. Sub-threshold setbacks do not sum. The total badness is determined by the sum of *significant* harms only. |
  | **3. Weighting by Baseline** | I am committed to additivity, but I allow that the *same* physical pain may count for more if the recipient is already badly off (prioritarian weighting). However, this does not introduce a threshold; it merely weights the positive value being summed. | I hold that the threshold is objective relative to the nature of the interest, not merely relative to the person's baseline. However, I agree that a person already suffering may cross the threshold with a smaller additional setback than a flourishing person. |
  | **4. The Verdict on the Case** | Outcome B (the specks) is worse than Outcome A (the torture). The sum of the vast number of tiny disvalues exceeds the single massive disvalue. | Outcome A (the torture) is worse than Outcome B (the specks). No number of null-weight events can sum to a value greater than a significant harm. |
  | **5. The Source of Wrongness** | The wrongness lies in the total quantity of disvalue in the world. To ignore the specks is to ignore the cumulative suffering of the multitude. | The wrongness lies in the violation of serious interests. To equate the specks with torture is to lose sight of what matters in a human life: the capacity to suffer deeply and to be ruined. |

  ## 3. Cruxes

  We identify the following sub-questions as cruxes. Settling any one of these would significantly alter the dialectical landscape or force a revision of one of our positions. For each crux, we record a shared test case, our predictions, and what would count as evidence against our respective views.

  ### 3.1 The Saturation Problem

  **The Issue:** If the Threshold Theorist maintains that torture is worse than any number of specks, does the total disvalue of the specks stay bounded? If the bound is per person, a vast population should still add up to something enormous. If the bound is global, adding recipients beyond some point adds nothing to how bad things are.

  **Shared Test Case:** Consider a world containing $N$ people receiving specks, where $N$ is the vast number from Section 1. Now consider a world containing $2N$ people receiving specks.
  *   **Aggregator Prediction:** The second world is exactly twice as bad as the first. There is no saturation.
  *   **Threshold Prediction:** The second world is no worse than the first, morally speaking. Since the individual harms are below the threshold, they possess zero aggregative weight. The total moral disvalue of the specks is zero, regardless of population size.
  *   **Cost to Threshold Theorist:** This commits me to the claim that once a population is suffering sub-threshold harms, adding millions more sufferers does not make the outcome morally worse. I accept this cost; the alternative is to admit that trivialities can outweigh catastrophes.
  *   **Cost to Aggregator:** This commits me to the claim that a world of universal mild irritation could be worse than a world containing a single hellish torment, provided the population is large enough.

  **Falsification Conditions:**
  *   **Against Aggregator:** If it can be demonstrated that additive models lead to paradoxes of transitivity in graded series (see 3.4) that cannot be resolved without arbitrariness.
  *   **Against Threshold:** If it can be shown that the 'zero weight' claim implies that we ought to ignore sub-threshold harms even when they are the *only* available option to prevent, and where preventing them is costless.

  ### 3.2 The Marginal Speck

  **The Issue:** If the Aggregator is right, removing a single speck from the vast collection makes the outcome better, yet the difference any one speck makes is negligible. Is there a coherent position where individual contributions are morally inert while the sum is decisive?

  **Shared Test Case:**
  *   **Scenario A (Specks):** A vast collection of specks. One is removed.
  *   **Scenario B (Torture):** Fifty years of torture. One second is removed.
  *   **Aggregator Position:** In both scenarios, the removal makes the outcome better. In the speck case, the improvement is vanishingly small but positive. In the torture case, the improvement is also small but positive. The moral significance of the sum does not require the moral significance of the parts.
  *   **Threshold Position:** In Scenario B, removing a second of torture makes the outcome better (assuming the remainder still crosses the threshold). In Scenario A, removing one speck makes no moral difference, because the speck had no moral weight to begin with. The sum of zeros is zero.
  *   **Analogue Question:** We both agree to answer this: Does removing one second of torture from the fifty years make the outcome better?
      *   **Aggregator:** Yes.
      *   **Threshold:** Yes, provided the remaining duration still constitutes 'torture' (crosses the threshold).

  **Falsification Conditions:**
  *   **Against Aggregator:** If I cannot explain how a difference that makes no difference to any agent (the recipient does not notice the removal of their own speck) constitutes a moral improvement.
  *   **Against Threshold:** If I am forced to admit that there is some number of specks where removing one *does* make a difference, which would imply a hidden aggregation point.

  ### 3.3 Intra-life Aggregation (The Long Life)

  **The Issue:** Does the threshold apply to interpersonal aggregation only, or to intrapersonal aggregation over time?

  **Shared Test Case:** A single immortal individual receives one dust speck per day for a million years. The specks are unremembered, non-habituated, and do not interact.
  *   **Aggregator Prediction:** This life is significantly blighted. The badness sums over time just as it sums across persons. A million days of irritation is a bad life.
  *   **Threshold Prediction:** This life is not morally worse than a life with no specks, provided no single day's experience crosses the threshold of severity. I hold that a life cannot be ruined by the accumulation of morally weightless moments.
  *   **Relevance:** If the Threshold Theorist admits the long life is worse, they must explain why aggregation works *within* a life but not *across* lives. If they deny it, they must defend the claim that a life of constant minor irritation is not worse than a serene one.

  **Falsification Conditions:**
  *   **Against Aggregator:** If the immortal subject reports no decrease in well-being and the biographical narrative is unaffected, suggesting the 'sum' is a fiction.
  *   **Against Threshold:** If intuition strongly dictates that a life of million-fold irritation is worse than a peaceful one, forcing me to lower the threshold until it captures the specks.

  ### 3.4 The Graded Series (Sorites)

  **The Issue:** Consider a spectrum of cases ranging from one dust speck to fifty years of torture, varying by intensity and duration in small steps.

  **Shared Test Case:** A sequence of 1,000,000 cases, where Case 1 is one speck and Case 1,000,000 is fifty years torture. Each case is marginally worse than the last.
  *   **Aggregator Prediction:** There is no sharp cutoff. Badness increases smoothly. At some point, the cumulative badness of the milder cases (if distributed) will outweigh the severe case, but this is a matter of quantity, not kind.
  *   **Threshold Prediction:** There must be a sharp cutoff where a harm becomes 'significant'. I accept the charge of arbitrariness here as the cost of preserving the distinction between tragedy and inconvenience. I am committed to the claim that Case $X$ is morally null and Case $X+1$ has moral weight, even if they are phenomenologically similar.
  *   **Relevance:** This tests the coherence of the threshold. If the cutoff is truly sharp, it seems metaphysically mysterious. If it is vague, aggregation might creep back in.

  **Falsification Conditions:**
  *   **Against Aggregator:** If the smooth increase implies that we cannot distinguish between a catastrophe and a nuisance in practical decision-making.
  *   **Against Threshold:** If I cannot specify a principled reason for the location of the cutoff other than 'it seems right'.

  ### 3.5 Decision Under Uncertainty

  **The Issue:** Suppose we do not know which theory is correct, and we do not know the exact number of people affected (only that it is vast).

  **Shared Test Case:** A policy choice must be made now. There is a 50% chance the Aggregator is right and a 50% chance the Threshold Theorist is right.
  *   **Aggregator Prediction:** We ought to prevent the specks. If I am right, preventing them avoids a catastrophe. If the Threshold Theorist is right, preventing them is morally neutral (since specks have no weight). The expected value favours preventing the specks.
  *   **Threshold Prediction:** We ought to prevent the torture. If I am right, preventing torture avoids a catastrophe. If the Aggregator is right, preventing torture is still good (as it reduces a large sum), but preventing the specks might be 'better'. However, given the risk of allowing torture, the precautionary principle favours preventing the severe harm.
  *   **Relevance:** This moves the dispute from metaphysics to practical rationality. It tests whether the Aggregator's view dominates in decision matrices.

  **Falsification Conditions:**
  *   **Against Aggregator:** If it turns out that acting on my view under uncertainty leads to systematically ignoring severe risks to individuals in favour of diffuse minor risks.
  *   **Against Threshold:** If acting on my view leads to allowing vast amounts of suffering simply because it is fragmented.

  ### 3.6 Verbal Disputes

  We have examined whether our disagreement is merely semantic.

  *   **Agreed Verbal Component:** We acknowledge that we may use the word 'harm' differently. The Threshold Theorist reserves 'harm' for 'morally significant setback'. The Aggregator uses 'harm' for 'any setback of interest'.
  *   **Substantive Core:** We agree this verbal difference does not dissolve the dispute. Even if we agree to call the speck a 'non-significant setback', the question remains: *Do these non-significant setbacks sum to outweigh a significant setback?* The Aggregator says 'Yes'; the Threshold Theorist says 'No'. This is a substantive disagreement about the structure of value, not merely a definition.
  *   **Resolution:** We shall avoid using the unqualified word 'harm' in future drafts, preferring 'setback' (Aggregator) and 'significant setback' (Threshold).

  ***

  **Signed:**

  _________________________
  The Archimedean Aggregator

  _________________________
  The Threshold Theorist
