answer: |-
  Here is a 45-minute teaching arc designed for tech journalists. It prioritizes pattern recognition over historiography.

  ### 1. The First Idea to Land (Minutes 0–5)
  **Do not start with the definition.** Start with **narrative comfort.**

  Ask them to mentally draft the "origin paragraph" for a story on the latest LLM. Most will instinctively reach for Turing (1950) or Dartmouth (1956).
  *   **The Point:** Make them admit that this lineage feels *satisfying*. It creates a clean vector.
  *   **The Hook:** Tell them: "Whig History isn't about getting facts wrong; it's about getting *causality* wrong by smoothing out the bumps. It is the temptation to treat the winner of history as the only contestant who ever mattered."

  ### 2. The Carrying Example (Minutes 5–20)
  **Topic:** 1950s Cybernetics vs. "Proto-AI"
  **Why:** It avoids the overused Turing/Dartmouth trope and hits their specific beat.

  *   **The Whig Version (The Trap):** "Norbert Wiener's cybernetics laid the groundwork for modern neural networks. It was the first step toward today's AI."
      *   *Why journalists write this:* It creates a straight line. It makes the current tech seem destined.
  *   **The Non-Whig Version (The Reality):** Cybernetics wasn't trying to build "intelligence" in a box; it was about **control and communication** in animals and machines. It was a sociological and biological framework.
      *   *The Pivot:* In the 1960s/70s, AI researchers (symbolists) explicitly *rejected* cybernetics to focus on logic and symbols. They won. Cybernetics lost.
      *   **The Lesson:** Calling cybernetics "early AI" is like calling a steam engine "an early car." It erases the road not taken (machines as societal regulators) to validate the road taken (machines as autonomous agents).
  *   **Activity:** Show a quote from Wiener about social responsibility. Ask: "If you frame this as 'AI History,' does this quote look like a quaint failure or a suppressed alternative?"

  ### 3. The Misconception Check (Minutes 20–25)
  **The Misconception:** "But AI *did* progress. If the technology actually works now, isn't the lineage real? Isn't Whig History just 'anti-progress'?"

  **Where to head it off:** Immediately after the Cybernetics example, before they move to the exercise. If you wait until the end, they will dismiss the whole workshop as academic navel-gazing.

  **The Correction:**
  *   Acknowledge progress is real.
  *   **Distinction:** Whig history confuses **genealogy** (who came before) with **teleology** (who was *meant* to win).
  *   **The Soundbite:** "You can acknowledge Turing is an ancestor without claiming he was planting a flag for Transformers. Whig history assumes the finish line was painted before the race started. Real history admits the finish line moved."

  ### 4. The Final Check: Headline Diagnosis (Minutes 25–40)
  **Task:** Put three headlines on the screen. Ask them to identify which one is Whiggish and rewrite it to be contingent.

  *   **Headline A:** "How 1980s Expert Systems Failed so Deep Learning Could Succeed." (Whiggish: Implies failure was necessary for success.)
  *   **Headline B:** "The Long Winter: Why AI Took 40 Years to Mature." (Whiggish: Implies a natural biological maturation rather than funding cycles and dead ends.)
  *   **Headline C:** "From Perceptrons to Transformers: The Lineage of Modern AI." (Neutral/Whiggish depending on text, but implies a direct bloodline.)

  **The Fix:** Have them rewrite **Headline A**.
  *   *Target:* "How Funding Shifts Abandoned Expert Systems for Neural Nets." (Focuses on human choice/chance, not inevitability).

  ### 5. Wrap & Toolkits (Minutes 40–45)
  Give them three questions to ask before filing a story:
  1.  Am I calling a loser a "failed version of the winner"?
  2.  Am I using words like "mature," "evolve," or "inevitable"?
  3.  Does this origin story make the current technology seem unavoidable?

  ***

  ### What to Flat-Out Skip (To save time)
  1.  **Herbert Butterfield:** Do not mention the historian who coined the term in 1931. It adds zero value to their reporting.
  2.  **The Etymology of "Whig":** Do not explain the British political party. It's a distraction.
  3.  **Moralizing:** Do not frame Whig history as "evil" or "lying." Frame it as "lazy storytelling." They will resist moralizing; they accept craft advice.
  4.  **Other Examples:** Do not drift into Newton, Darwin, or the Atomic Bomb. Keep it strictly on computation/cybernetics. Context switching kills momentum in a 45-minute session.
  5.  **The "Anti-Whig" Extremes:** Do not let them swing to "nothing is connected." Acknowledge connections exist, but insist on *contingency*.
