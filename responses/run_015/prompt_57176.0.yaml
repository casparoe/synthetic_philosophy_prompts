  # Part 4: The Debrief Script (Mapping Mechanics to Doctrine)

  *Do not let this become a politics seminar. Anchor every comment to a card or a rule.*

  **1. On Compossibility (The Conflict Rule)**
  *   **Ask:** "Who tried to play 'Free Will' (M-01) and 'No Sin' (implied by removing Moral Evil)? What happened?"
  *   **Point:** "You couldn't. The cards conflicted. Leibniz argues you cannot have a creature with Free Will who *never* chooses evil. To remove the evil, you must remove the Will. That is **Compossibility**. Some goods are logically tied to specific evils."

  **2. On Richness vs. Simplicity (The Scoring)**
  *   **Ask:** "Why didn't anyone play 40 cards? Why only 6?"
  *   **Point:** "Because of the Simplicity Penalty. God doesn't just want *stuff*; He wants the *most stuff from the fewest rules*. A world where I fix every problem with a new miracle is complex. A world with Gravity (P-01) fixes orbits and tides with one law, but it also causes falling injuries. Leibniz prefers the one law + injury over two laws + safety."

  **3. On Defending Evil (The Rig)**
  *   **Ask:** "Group 3, you won. You had 'Predation' (B-04) and 'War' (from M-01). Did you feel bad keeping them?"
  *   **Point:** "This is the **Greater Good Theodicy**. You didn't keep War because you like War. You kept it because it was the cost of 'Innovation' and 'Morality.' Leibniz says God *permits* evil, He does not *will* it. But He wills the world that contains it because the alternative is a sterile void (like Card P-02)."

  **4. On Voltaire & The Maximum (The Limit)**
  *   **Ask:** "Could you have designed a better world if I gave you different cards?"
  *   **Point:** "Yes. And that is Voltaire's point. The game is finite. God's choice is infinite. Leibniz claims there is a **Maximum** in the infinite set. Voltaire (after Lisbon) suggests there is no maximum, just endless better options, or that the suffering outweighs the math. The game forces you to accept the trade-off; Voltaire asks if the trade-off is worth making at all."

  **5. On Metaphysical Evil (The Boring Cards)**
  *   **Ask:** "Look at Card P-09 (Static Equilibrium). No death, no decay. Why did you discard it?"
  *   **Point:** "Because it had 'No Growth.' Leibniz calls this **Metaphysical Evil**. It's not pain or sin; it's *limitation*. A world without limitation is a world without creatures (because to be a creature is to be limited). You discarded it because it scored low. Leibniz says God chose a world with limits because a world without limits is just God Himself."

