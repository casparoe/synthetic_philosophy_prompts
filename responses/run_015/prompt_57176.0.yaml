  # Part 5: Troubleshooting & Limitations

  ### What Will Break (And How to Fix It)
  1.  **Scorekeeping Chaos:** Students will add wrong.
      *   *Fix:* Provide a checklist on the Scoring Sheet. "1. Sum Points. 2. Count Families. 3. Multiply Families x 5. 4. Subtract." Walk around with a calculator during the last 10 mins of gameplay.
  2.  **The "Policy" Drift:** Students arguing about UBI or Tax.
      *   *Fix:* Hard interrupt. "That is a human law. I am asking for a Law of Nature. Which Card represents that? If there isn't a Card, you can't have it."
  3.  **Card Trading:** Students swapping cards between groups to bypass conflicts.
      *   *Fix:* All trades go through the TA ("God Bank"). Groups cannot trade directly.
  4.  **The "Perfect World" Glitch:** A group finds a loophole (e.g., 6 low-point cards with 0 conflicts and 0 evils).
      *   *Fix:* Their score will be low. When you announce the winner, explicitly disqualify them on *Richness*. "You built a safe world. It was not the *Best* world. It was the *Safest* world. Leibniz optimizes for Best, not Safest."

  ### What The Game Cannot Simulate (Be Honest Here)
  In the debrief, you must confess the simulation's limits. This prevents students from thinking the game *proves* Leibniz right.
  1.  **Infinity:** The deck is 40 cards. God chooses from infinite worlds. The game forces a choice among *these* options. Leibniz claims the optimal combination exists in the infinite set; the game just makes you pick the best of a bad bunch.
  2.  **Omniscience:** You (students) don't know the downstream consequences of your cards beyond the text. God knows every ripple of every choice for eternity. The "Evil Tags" are a simplification of infinite consequence chains.
  3.  **Grace:** Leibniz's system includes Grace (Redemption) which balances Moral Evil in the long run. The game has no "Redemption" mechanic. It only tallies the cost. You must supply the hope of redemption verbally in the debrief.

  ### TA Prep Checklist
  *   [ ] Print 5 copies of the Scoring Sheet.
  *   [ ] Print 2 copies of the Card Set (80 cards total, so you have a "God Bank" deck for trading).
  *   [ ] Cut cards (do this before class; 80 cards takes 20 mins).
  *   [ ] Bring a calculator.
  *   [ ] Write the Scoring Formula on the Board.
  *   [ ] **Mindset:** You are not the Professor during the game; you are the System Administrator. Enforce the rules cold. Save the warmth for the debrief.

