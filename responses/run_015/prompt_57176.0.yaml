  # Part 3: Minute-by-Minute Plan (100 Minutes)

  **00:00 – 00:15 | Intro & The Trap**
  *   **Lecture (10 mins):** Briefly define *Compossibility* (things that can exist together), *Richness* (variety of phenomena), *Simplicity* (fewness of laws). State the problem: Voltaire says Leibniz ignores evil. Leibniz says evil is the *price* of the best combination of laws.
  *   **Setup (5 mins):** Divide into 5 groups. Hand out 10 random cards to each group. Hand out Scoring Sheets.
  *   **The Rule:** "You are not designing a Utopia. You are engineering a constraint system. Your goal is the highest Harmony Score. If your world has no evil, your score will be too low to win. If your world has too much complexity, your score will tank."

  **00:15 – 00:25 | Rules Walkthrough**
  *   Explain the Scoring (Richness - Families).
  *   Explain Conflicts (Check the bottom of cards).
  *   Explain the "God Bank" (TA holds the remaining deck for trades).
  *   **Crucial Warning:** "Do not argue about whether War is bad. War is 15 Points. Pain is 10 Points. Your job is to justify the math, not the morality."

  **00:25 – 01:10 | Game Play (45 Mins)**
  *   **Drafting:** Groups pick 6 cards from their 10.
  *   **Conflict Resolution:** They will find conflicts immediately (e.g., Free Will vs. No Sin). They must discard one.
  *   **Trading:** They will realize they need specific combos to boost Richness. Let them trade with you. *TA Tip:* If a group tries to build a "Perfect" world (low evil), give them bad trades that lower their score. If they build a "High Score" world (high evil), validate it.
  *   **Monitoring:** Walk around. If you hear political talk ("We should tax the rich"), interrupt: "That's Policy. I need Metaphysics. Which *Law Card* allows taxation?"

  **01:10 – 01:25 | Scoring & "God's Choice"**
  *   Groups calculate final scores.
  *   They must write down the **Top 3 Evils** in their world.
  *   **The Twist:** You (The TA/God) announce the Winner. *Rig this.* The winner should be the group with the highest score, even if their world has "War" and "Predation." Explicitly praise them: "Group 3 has a Harmony of 45, but they have 5 Evil Tags. Group 1 has 0 Evil Tags, but a Harmony of 20. Group 3 wins. This is Leibniz's world."

  **01:25 – 01:50 | The Debrief (25 Mins)**
  *   *See Script Below.*

  **01:50 – 01:60 | Cleanup & Exit**
  *   Collect cards. One-minute paper: "What is one evil you defended today that you wouldn't defend in real life?"

