  ### The Scenario

  Elena, a senior actuary, stands before the board holding the definitive audit report. The algorithmic model she authored is mathematically infallible and proves conclusively that the fund is insolvent ($p$). She recognizes the proof as valid and acknowledges that the evidence leaves no objective room for doubt, yet she also knows herself: after twenty years of false alarms caused by data glitches, her psychology has adapted such that she does not form the subjective state of belief regarding financial ruin until a second, independent human audit confirms the algorithmic output. This heuristic is not self-deception; she assents to the truth of $p$ and immediately authorizes the liquidation based on the algorithm alone. It is not irrational; the protocol protects her from burnout without impairing her professional actions. She looks at the board, knowing her calm demeanor—resulting from the lack of subjective conviction—might falsely reassure them that the risk is manageable, and she says, "The fund is insolvent, but I don't believe it," to ensure they understand the gravity of the data while accurately flagging her own psychological state so they do not misinterpret her composure as confidence in a rescue.

  ### Analysis Against Standard Explanations

  **1. The Assertion-Side Family (Knowledge/Belief Norms)**
  *View:* Assertion is governed by a norm requiring the speaker to know (Williamson) or at least believe (standard belief norm) the content. To assert $p$ is to represent oneself as knowing/believing $p$.
  *Verdict:* **Improper-but-excusable.**
  *Reasoning:* Elena violates the norm because she lacks the belief state required to properly assert $p$. However, the utterance is excusable because the pragmatic goal (preventing misleading implicatures from her calm demeanor) outweighs the norm violation. She is sacrificing strict constitutive rules of assertion for communicative clarity. The account must concede that while the assertion is technically improper, it is the *right thing to say* to achieve the conversational goal, suggesting the norm might need a pragmatic override clause.

  **2. Shoemaker's Linking-Principle Line**
  *View:* The absurdity of Moorean sentences originates at the level of belief. It is irrational to believe the conjunction ($p$ and I don't believe $p$) because belief is self-intimating (if you believe $p$, you believe that you believe $p$). This irrationality transfers to assertion.
  *Verdict:* **Absurd.**
  *Reasoning:* Shoemaker's account focuses on the rationality of the doxastic state. Even if Elena's lack of belief is heuristically useful, holding the first-order evidence for $p$ while lacking the belief is, on this view, a failure of rationality that makes the conjunction untenable. The linking principle says if the belief state is defective, the assertion is too. Elena's explanation (the heuristic) does not resolve the structural irrationality of holding conclusive evidence without belief; it merely explains it. The account cannot accommodate the intuition that she is "correct" to utter it.

  **3. Rosenthal's Denial (Higher-Order Thought)**
  *View:* There is no problem at the level of first-order belief. Belief is a non-conscious state; what we call "believing" in ordinary language is often having a Higher-Order Thought (HOT) about that state. Moorean paradoxes arise when the first-order state exists but the HOT is missing or mismatched.
  *Verdict:* **Perfectly fine.**
  *Reasoning:* This account fits the scenario best. Elena has the first-order dispositional state (she acts on $p$) but lacks the Higher-Order Thought (the subjective conviction). When she says "I don't believe it," she is accurately reporting the absence of the HOT. When she asserts "The fund is insolvent," she is expressing the first-order state. There is no contradiction because the two conjuncts refer to different levels of mental architecture. The utterance is a precise description of her cognitive situation.

  ### The Design Feature

  **The Single Feature:** The **Calibrated Heuristic** (the professional protocol that decouples action-assent from subjective conviction for reasons of efficacy rather than epistemic doubt).

  **Deletion Test:** If you delete the heuristic and simply say she has conclusive evidence but lacks belief, she becomes straightforwardly irrational (akratic). The scenario collapses into a standard case of epistemic failure where the utterance is merely a confession of irrationality, not a communicative tool. Without the heuristic providing a *reason* for the belief gap that is independent of the truth of $p$, the second conjunct sounds like self-undermining doubt rather than a metacognitive report. The case would revert to the standard Moorean absurdity where the speaker appears to be contradicting themselves.

  **Counterattack (from the Assertion-Side Account):**
  The strongest counterattack comes from the Assertion-Side family, specifically the move that **she wasn't really asserting the first conjunct at all.** They would argue that because she lacks belief, she cannot assert $p$; therefore, her utterance "The fund is insolvent" must be interpreted as something else—perhaps reporting the model's output ("The model says $p$") or expressing a tentative acceptance.
  *Does it land?* Partially. It saves the norm by reinterpreting the speech act. However, it fails to capture why her utterance is *more* effective than saying "The model says $p$." Her point is precisely that $p$ is true, not just that the model says so. By forcing her into indirect speech, the counterattack strips the scenario of its intended force: that she is committing to the truth of $p$ while withholding the psychological state. It lands technically but misses the pragmatic phenomenon we are trying to isolate.

  ### Honest Note on Constraints

  Your constraints are **not jointly satisfiable** without bending the ban on **sliding between believing and mere acceptance-as-a-premise**.

  Here is the conflict: Standard epistemology holds that if one has conclusive evidence for $p$ and is rational, one believes $p$ (or at least accepts $p$ as a premise for action in a way that is functionally identical to belief). In the scenario, Elena acts on $p$ (authorizes liquidation). If belief is defined dispositionally (as most epistemologists define it for the purpose of assertion norms), she *does* believe $p$. To make the second conjunct ("I don't believe it") true, we must define belief phenomenologically (as subjective conviction).

  If you enforce the "no sliding" ban strictly, you force a single definition of belief.
  1.  If belief is dispositional: She believes $p$. The second conjunct is false. The scenario fails.
  2.  If belief is phenomenological: She doesn't believe $p$. But then standard assertion norms (which rely on dispositional belief/knowledge) deem her assertion improper, conflicting with the constraint that saying it is the "right thing to do" (which implies normative appropriateness).

  **What to drop:** You must drop or relax the **ban on sliding between believing and acceptance**.
  **What is lost:** By dropping this, you admit that the case relies on a distinction between "functional belief" (which she has) and "phenomenological belief" (which she lacks). This concedes that Moore's Paradox might only be paradoxical for the phenomenological sense of belief, while the functional sense remains intact. It weakens the case as a counterexample to standard epistemological accounts of belief, turning it instead into a case study on the ambiguity of folk-psychological terms. Without this slide, the scenario describes an impossibility: a rational agent with conclusive evidence who functionally lacks the belief that evidence necessitates.
