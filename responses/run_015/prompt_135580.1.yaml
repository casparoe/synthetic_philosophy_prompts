answer: |-
  The practice you describe—statistically "cleaning" moral judgments to isolate a stable preference profile—is not merely a methodological choice but a metaphysical gamble. It rests on a specific ontology of value that is rarely defended explicitly in technical literature. To analyze this, we must dissect the philosophical commitments required to make the procedure coherent, evaluate the normative assumptions smuggled into the definition of "bias," and explore the radical implications for AI alignment if those commitments are abandoned.

  ### 1. The Metaphysics of Preference: Realism vs. Construction

  To treat statistical variance as "noise" rather than "signal," one must hold a commitment akin to **Preference Realism**. This is the view that an agent's moral preferences exist *ante rem* (prior to the judgment) as stable mental states or dispositional structures, analogous to a physical object that might be obscured by fog.

  *   **The Realist Commitment:** For a correction procedure to be a *correction* rather than a *modification*, there must be a truth-apt target. The researcher assumes that if all framing effects, order effects, and emotional primes were removed, a singular, coherent vector of preference would remain. This presupposes that the "self" possesses a deep structure of values that is context-invariant. It treats moral psychology like psychophysics: just as there is a true luminance threshold obscured by retinal noise, there is a true "value threshold" obscured by cognitive noise.
  *   **The Constructivist Challenge:** A constructivist or expressivist denies this pre-existence. On this view (championed by philosophers like Christine Korsgaard or Simon Blackburn), preferences are not discovered but *constituted* in the act of judgment. The framing is not a distortion; it is part of the context that gives the moral proposition its meaning. To ask "Do you value honesty?" is incomplete without asking "In what context, under what description, and against what competing value?"
  *   **Reconstructing the Practice:** Can a constructivist support this cleaning procedure? Only by redefining its goal. They cannot claim to be *revealing* a hidden fact. Instead, they must admit they are *engineering* a specific type of agent. They are not stripping away distortion to find the "real" human; they are filtering out context-dependence to create a *canonical* version of the human suitable for computational modeling. This shifts the claim from epistemological (we found the truth) to pragmatic (we built a usable model). However, this admission undermines the authority of the output as "the user's will."

  ### 2. Internal Consistency and Normative Smuggling

  The practice faces a severe internal consistency problem regarding the criterion used to distinguish "bias" from "preference." There is no "view from nowhere" from which to classify a framing effect as an error.

  *   **The Normativity of "Stability":** The procedure implicitly treats *stability* and *logical coherence* as the markers of genuine morality. If a subject's judgment flips when the order of questions changes, the procedure labels this "noise." But why is stability the gold standard?
      *   **Ethical Counter-Examples:** Many robust ethical traditions argue that moral sensitivity *should* vary with context. A Care Ethicist might argue that emotional priming is not noise but the very channel of moral perception. If I feel more empathy for a victim when their story is vivid (a framing effect), is that a bias, or is it the correct functioning of moral sentiment? By filtering out emotional priming, researchers are implicitly endorsing a **Kantian or Utilitarian calculus** (which prizes impartiality and consistency) over **Sentimentalist or Virtue Ethics** (which prize situated responsiveness).
  *   **The Smuggle:** The choice of which statistical anomalies to correct is a normative decision about what rationality looks like. It assumes that a "good" moral agent is one whose judgments are invariant to irrelevant descriptive details. This is not a neutral statistical finding; it is a philosophical thesis about the nature of reason. Consequently, the "cleaned" preference profile does not represent the aggregate of human values; it represents the aggregate of human values *constrained by a specific theory of rationality*.
  *   **Inconsistency:** If framing effects are pervasive (as psychology suggests), then the "cleaned" data may represent a hypothetical agent that does not exist. The procedure claims to model human values, but by removing the very mechanisms (emotion, context, framing) through which humans experience value, it models a *philosophical idealization* of a human. It is internally inconsistent to claim to represent human input while systematically removing human modes of valuation.

  ### 3. Implications for AI Alignment: From Discovery to Politics

  If we replace the implicit realist theory with a view that moral judgments are **irreducibly situated** and that variability reveals genuine moral complexity, the project of AI value alignment undergoes a paradigm shift.

  *   **The Suspicion of the "Single Profile":** The goal of extracting a single, cleaned preference profile becomes conceptually suspect. If my values are genuinely contradictory depending on whether I am tired, angry, or reflecting calmly, then a single vector is a lie. It is a compression artifact. An AI optimizing for this "cleaned" profile might act in ways that violate my actual, situated values. For example, an AI might ignore my desperate emotional plea in a crisis because it was trained on my "calm, corrected" preferences for utilitarian efficiency.
  *   **From Optimization to Negotiation:** If values are not fixed points to be discovered but dynamic states to be managed, alignment cannot be an engineering optimization problem. It becomes a **political or procedural problem**.
      *   **Institutional Alternative 1: Value Pluralism.** Instead of smoothing disagreement, the AI system maintains a representation of conflicting values. It does not resolve the tension between "save five" and "do not harm" statistically; it recognizes them as competing valid claims. The AI's role shifts from *executing the preference* to *managing the trade-off* transparently.
      *   **Institutional Alternative 2: Deliberative Alignment.** Rather than aggregating static judgments, the AI facilitates ongoing human deliberation. The "preference" is not what the human *did* say under corrected conditions, but what they *would* say under idealized deliberation (a Rawlsian Reflective Equilibrium). The AI becomes a participant in moral formation, not just a servant of pre-existing will.
      *   **Institutional Alternative 3: Democratic Aggregation.** If individual preferences are unstable, legitimacy cannot come from individual "truth." It must come from collective process. Alignment research would look less like psychology and more like political science, focusing on voting mechanisms, bargaining, and constitutional constraints rather than preference elicitation.

  ### Conclusion

  The practice of statistically correcting moral judgments to isolate stable preferences presupposes a **moral realism about personal values** that is philosophically fragile. It assumes that beneath the noise of human psychology lies a coherent, context-invariant moral agent. In doing so, it smuggles in a normative commitment to **coherence and impartiality** as the defining features of rationality, effectively filtering out ethical frameworks that rely on emotion and context.

  If we accept that moral variability is often constitutive rather than corruptive, the AI alignment project cannot aim to *extract* a static value function. It must instead aim to *mediate* dynamic moral conflict. The goal shifts from building an AI that knows what we *really* want (a metaphysical fiction) to building an AI that can navigate what we *contingently* value without imposing a false consistency upon us. This moves the field from a technical search for signal-to-noise ratios toward a normative inquiry into what kinds of moral ambiguity we wish our machines to preserve.
