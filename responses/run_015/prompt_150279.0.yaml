prompt: |-
  I am defending the thesis that, under conditions of deep normative pluralism, American folk morality — which treats individual conscience as sovereign over procedural rules when they conflict, and which I describe as sustaining second-order moral monitoring within institutions — produces more ethically resilient organisational outcomes than German folk morality, which treats collective order and first-order rule-following as preconditions of moral life itself and thereby suppresses conscientious disruption. The audience is a British university philosophy-of-law seminar comprising analytic moral philosophers with Kantian leanings, two sociologists of bureaucracy working in the Weberian tradition, and one American pragmatist who is sympathetic to the thesis but sharply sceptical of empirical overreach. Draft my Q&A prep sheet: list the eight or so objections I will actually face, ordered by the severity of damage each would do to the argument, phrased precisely as that specific audience would put them. For each objection, provide a concise reply I can deliver in approximately two minutes, together with a brief note on where that reply is weakest. State clearly what I should concede up front to maintain credibility. Include the objection I am most hoping nobody raises — likely a charge of false essentialism in contrasting “German” and “American” folk morality as stable cultural types — and sketch how I can concede part of it without collapsing the distinction that drives the argument. Finally, identify the weakest point in my own position that I should prepare to defend actively rather than hope they overlook. Do not ask for bibliographies, reading lists, or citations; I have the relevant texts in hand.
