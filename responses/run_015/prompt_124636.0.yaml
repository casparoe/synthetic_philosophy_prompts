answer: |-
  **A One-Sentence Question with a Determinate Answer**
  Is moral responsibility extinguished when an agent's voluntary action makes no causal difference to the outcome, regardless of whether alternative possibilities existed?

  **Why Existing Positions Leave It Open**
  Current debates conflate the absence of alternative possibilities with the absence of causal efficacy. Frankfurt cases assume the intervener removes both simultaneously. Actual-sequence theories locate responsibility in the agent's reasoning but fail to isolate cases where reasoning exists yet impacts nothing. Consequently, the specific contribution of difference-making remains untested against the principle of alternative possibilities, leaving leeway theories and actual-sequence views talking past one another.

  **Why This Reframing Is a Better Bet**
  Constructing new Frankfurt variants merely recycles the conflation. Revisiting flicker-of-freedom disputes ignores the causal structure. Empirical vignette studies require methodological training I lack. Conceptual separation isolates the variable without empirical overhead or dialectical stagnation. This avoids the stalemate of actual-sequence versus leeway theories by testing a distinct condition, offering a cleaner test than modifying existing cases or relying on untrained statistical analysis.

  **Possible Conclusions and Validity Conditions**
  Either responsibility requires difference-making, or it does not. If it does, Frankfurt cases were misdiagnosed as AP cases. If not, mitigation appeals based on inevitability are philosophically weak. The deciding factor is intuitive verdicts on cases where AP exists but efficacy is null. The project collapses if every scenario removing difference-making necessarily removes alternative possibilities, proving inseparability. It succeeds if coherent cases show agents could have done otherwise but could not have changed the outcome, yielding distinct verdicts.

  **A Realistic Division of the Semester**
  Weeks one through four will focus on constructing cases where efficacy is nullified but alternatives remain. Weeks five through ten involve drafting the argument and testing intuitions against standard objections. Weeks eleven through fifteen are reserved for revision and aligning the philosophical framework with practical mitigation contexts to ensure the final paper is robust enough for publication.

  **What the Paper Could Offer**
  The paper will provide a framework for determining whether institutional safeguards that render student choices causally inert mitigate blame. It clarifies whether preventing harm absolves the agent or merely prevents punishment, guiding the panel on whether installing filters changes warranted blaming practices. This offers a principled basis for deciding if inevitability reduces culpability in academic misconduct proceedings.
