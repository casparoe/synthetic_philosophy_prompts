  **INTERDEPARTMENTAL WORKING GROUP ON GRADED MINDS**
  **Consultation Paper 44-B: Proposal for the Stratified Welfare Instrument**

  **1. Preamble**
  Current welfare statute operates on a binary distinction between sentient and non-sentient entities. This blunt instrument fails to account for the variance in cognitive architecture across research subjects. Where a subject lacks the capacity to model an aversive outcome, inflicting that outcome provides data but no anticipatory suffering; conversely, where a subject possesses such capacity, standard protocols induce compounded distress. To remedy this mismatch, the Working Group proposes the Popperian Floor. No subject of any protocol with an aversive endpoint may be below Grade 3. The central refinement available to welfare law—replace the aversive outcome with a modelled one—is simply empty for any creature that must undergo the outcome in order to learn anything from it. Therefore, compliance requires either the exclusion of lower-grade subjects from aversive protocols or their cognitive uplift to meet the Floor.

  **2. Definitions**
  For the purposes of this Instrument, research subjects shall be classified as follows:
  (1) **Grade 1 (Darwinian):** Creatures equipped with hard-wired behavioural routines selected over evolutionary time; they do not learn from their own experience, and a routine can be exploited indefinitely by anyone patient enough to reset the conditions that trigger it.
  (2) **Grade 2 (Skinnerian):** Creatures that learn by operant conditioning; they must actually perform the action and actually undergo the consequence, and no warning, description, model, or rehearsal can stand in for the outcome.
  (3) **Grade 3 (Popperian):** Creatures that pre-screen candidate actions against an internal model, so that bad hypotheses can die in their stead instead of their dying for their hypotheses—though this only helps where the model is rich enough for the modelled outcome to track the real one, and is worse than useless where it is not.
  (4) **Grade 4 (Gregorian):** Creatures that inherit cognitive tools—words, notations, diagrams, and other representational artefacts—that restructure the very space in which Grades 2 and 3 do their work, so that what an individual can learn, and even what selection can act on, depends on equipment it neither invented nor possesses on its own; its competence is a property of a niche rather than of a skull.

  **3. Recommendations and Rationale**
  3.1 **Mandatory Uplift.** Where a facility intends to run aversive protocols on a Grade 2 population, operators must implement Cognitive Enrichment Protocols sufficient to induce Grade 3 modelling capacities. Welfare is defined as the capacity to avoid suffering via modelling; therefore, denying a subject the tools to model is a welfare violation.
  3.2 **The Escalation Clause.** As uplift is partly cultural and self-propagating, each successful compliance cycle raises the grade of a population and thereby the obligations owed to it in the next review. Facilities should note that successful uplift converts a Skinnerian asset into a Popperian liability.
  3.3 **Gregorian Anticipation.** For Grade 4 subjects, suffering is extended by anticipation and by the artefacts that partly constitute its mind. Protection must cover the duration of the subject's access to representational tools describing the protocol.
  3.4 **Isolation Protocol.** A lone Grade 4 individual separated from those artefacts cannot be graded at all. Such individuals shall be classified as Ungraded Matter and exempt from welfare review until reintegration.

  *Consultee Remark 1:* Dr. Aris Thorne, Adviser on Innate Routines, notes: "Resetting the Darwinian subject is cost-effective. However, if we must uplift them to Popperian status to satisfy the Floor, we must ensure the modelling capacity does not interfere with the hard-wired routine being tested. We recommend lobotomy-free enrichment."

  *Consultee Remark 2:* Ms. Elena Vark, Representative of the Skinnerian Breeding Consortium, states: "Teaching rats to model outcomes increases feed costs and handling time. If the obligation rises with the grade, the cheapest route to compliance is to keep subjects down a grade rather than raise them up. We propose a cap on enrichment."

  **4. Compliance Cost Table**

  | Grade | Classification | Base Maintenance | Welfare Oversight | Artefact Support |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Darwinian | $ | None | N/A |
  | 2 | Skinnerian | $$ | Low | N/A |
  | 3 | Popperian | $$$ | High | N/A |
  | 4 | Gregorian | $$$$ | Critical | Mandatory |

  **5. Transitional Provisions and Exemptions**
  5.1 Facilities currently holding Grade 2 subjects for aversive work may apply for a Downgrading Exemption if cognitive uplift is deemed economically unviable.
  5.2 In cases where a species pre-screens successfully only when tested alongside an artefact of its own making, it cannot be said whether the grade resides in the animal or in its equipment. The Group must rule on the locus of competence.

  **6. Closing Clause**
  Regarding Contested Case 88-C (Corvidae using modified wire hooks to solve aversive puzzles): The Group determines that the cognitive tool is external to the skull but internal to the niche. As the subject cannot model the outcome without the hook, the Grade 3 status is contingent on the presence of the wire. Therefore, welfare protections apply only when the wire is present. To minimize liability during transport, facilities are advised to confiscate all artefacts prior to movement. The subject is hereby classified as Grade 2 during transit and Grade 3 during testing.

  **Issued by the Interdepartmental Working Group on Graded Minds.**
