      *   *Conclusion:* The "Flip" case is the heavy lifter for Particularism. If the colleague only accepts "Mute" cases, they are essentially a Generalist who believes in *prima facie* duties (Ross). Rossian Generalism *supports* teaching theory (to understand the duties). So, if the colleague accepts Mute but rejects Flip, they cannot consistently argue for dropping theory based on *that* slogan alone.

