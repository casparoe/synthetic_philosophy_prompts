answer: |-
  ### 1. Foundational Dependencies: What Must Be Established First

  Before you write a single formula on the board, you must secure two philosophical commitments from the students. If you introduce a scoring rule (like the Brier Score) without these, it will look like an arbitrary game of points.

  *   **Commitment A: Veritism (The Goal).** You must establish that the *sole* epistemic goal of belief is truth. Ask them: "If two agents have the same evidence, but one believes the truth and the other believes a falsehood, is there an epistemic difference?" They will say yes. Press further: "Is that difference dependent on whether the belief made them happy or rich?" They should say no. This isolates *epistemic* value from *prudential* value.
  *   **Commitment B: The Gradability of Success (The Problem with Counting).** You must demonstrate why binary counting fails for credences.
      *   *Teaching Move:* Present two agents regarding a proposition $P$ that turns out **True**.
          *   Agent X assigns credence 0.51 to $P$.
          *   Agent Y assigns credence 0.99 to $P$.
      *   *Ask:* "In a binary 'hit/miss' count, both get 1 point. But epistemically, is Y's state identical to X's?"
      *   *Goal:* Elicit the intuition that Y is *closer to the truth* than X. Accuracy measures are not introduced to count hits; they are introduced to measure **distance from the truth value** (where Truth = 1, Falsehood = 0). Without this intuition, the math is unmotivated.

  ### 2. The Single Worked Example: The 5-Day Forecaster

  Your inclination toward a weather forecaster is correct, but it carries a specific risk: students often interpret "30% chance of rain" as a frequentist claim about a season ("it rains on 30% of days") rather than a credence about a specific day. You must block this interpretation.

  *   **The Setup:** Use a table of **5 specific, distinct days** (Monday–Friday). The outcome for each day is binary (Rain / No Rain).
  *   **The Agents:**
      *   **Forecaster Cautious:** Assigns 0.6 to Rain every day.
      *   **Forecaster Bold:** Assigns 0.9 to Rain on days it rains, and 0.1 to Rain on days it doesn't.
  *   **The Outcome:** Suppose it rains on 3 of the 5 days.
  *   **The Calculation:**
      1.  **Binary Count:** If we treat >0.5 as a prediction of Rain, both forecasters "got it right" on the same 3 days. Binary accuracy is identical.
      2.  **Accuracy Score (Brier):** Walk them through the distance calculation $(Credence - Outcome)^2$.
          *   Show that Bold is penalized heavily for the 2 days they were confident and wrong.
          *   Show that Cautious is penalized moderately for everything but never heavily.
          *   *Crucial Twist:* Adjust the numbers so **Bold wins** on accuracy despite the risk. (e.g., Bold is 0.9 on the 3 Rain days and 0.4 on the 2 Dry days). This shows that accuracy rewards *resolution* (being confident when right), not just *calibration*.
  *   **Must Avoid:**
      *   **Money:** Do not use dollars, bets, or payouts. Use "Accuracy Points" or "Distance Units."
      *   **Long-Run Frequencies:** Do not let them say "Bold is better because over a season..." Keep the focus on the accuracy of the *assignment* relative to the *actual outcomes* of these 5 days.

  ### 3. Predictable Misconceptions & Preemption Strategy

  | Misconception | When it Arises | How to Preempt |
  | :--- | :--- | :--- |
  | **"Accuracy permits certainty."**<br>(Why not always say 1.0?) | When you introduce the scoring rule. | **Preempt immediately.** When defining the penalty, explicitly calculate the score for Credence 1.0 when the Outcome is 0. Show that this yields the maximum possible penalty. Emphasize that accuracy measures are *strictly proper*: they reward you for reporting your *actual* credence, not inflating it. |
  | **"This is covert betting."**<br>(Accuracy = Winning money) | Throughout the session. | **Preempt in the Intro.** State clearly: "We are assessing the *mind*, not the *wallet*." If a student raises betting, acknowledge the mathematical similarity but insist on the *interpretive* difference. "A bet evaluates consequences; accuracy evaluates fit." |
  | **"The framework is arbitrary."**<br>(Why Brier and not Log Score?) | After you present the formula. | **Preempt at the end of the example.** Acknowledge: "There is a family of accuracy measures. They disagree on edge cases, but they agree on the core thesis: probabilistic coherence minimizes inaccuracy." Do not try to justify Brier over Log; frame it as "Brier is the standard pedagogical tool for distance." |

  ### 4. Handling the Prudential/Epistemic Distinction (The Gambler)

  A student will inevitably ask: *"But what if being overconfident makes me money? A gambler who bets big on 0.9 credences might profit more than a cautious one."*

  *   **The Move:** Distinguish **Value of the State** vs. **Value of the Consequence**.
  *   **The Script:** "Imagine a pill that makes you believe you can fly. If you take it, you might feel happier (prudential gain). But does the pill make your belief *true*? No. Accuracy measures the fit between your mind and the world. The gambler's profit is a consequence of the world rewarding their risk, not a measure of how well their mind matched reality. We are assessing the map, not the treasure the map leads to."
  *   **Key Terminology:** Introduce the term **"Epistemic Utility"** vs. **"Pragmatic Utility."** Tell them accuracy is about the former.

  ### 5. Scope Limits: What to Decline

  To stay within 50 minutes and avoid confusion, explicitly state at the beginning (or when questions arise) that you are **not** covering:

  1.  **Dutch Books:** "We are not discussing consistency via betting losses today. That is a pragmatic argument. We are looking for a purely epistemic one."
  2.  **Calibration vs. Refinement:** "We are treating accuracy as a single score today. We won't decompose it into calibration and resolution."
  3.  **The Accuracy-Dominance Theorem:** "We won't prove that probabilistic credences always minimize expected inaccuracy. We are just exploring *how* we measure inaccuracy."

  ### 6. The Diagnostic Question (Last 5 Minutes)

  You need to test if they understand that accuracy is about the **expectation of closeness to truth** (graded), not the **binary outcome** (luck).

  **The Scenario:**
  "Imagine a biased coin that lands Heads 90% of the time. We don't know the outcome of the next flip yet.
  *   **Agent A** knows the bias and assigns credence **0.9** to Heads.
  *   **Agent B** is ignorant and assigns credence **0.5** to Heads.
  *   The coin is flipped and lands **Heads**."

  **The Question:**
  "Both agents were 'right' in the binary sense (they both assigned >0.5 to the truth). Agent B got lucky; Agent A was informed.
  **According to the accuracy framework we discussed, who had the better epistemic position *before* the coin landed, and why does the actual outcome (Heads) not change that assessment of their position?"**

  **What to listen for:**
  *   **Failed Understanding:** "Agent A is better because they got a higher score." (This focuses only on the ex-post score).
  *   **Passed Understanding:** "Agent A is better because their credence was closer to the *objective chance* / truth value in expectation. Even if the coin had landed Tails, A's position was epistemically superior because accuracy measures the *fit of the probability*, not just the luck of the outcome. A's 0.9 was closer to the truth (1) than B's 0.5 was."
  *   **Ideal Answer:** They should mention that accuracy evaluates the **distance from the truth value**, and since the truth value was 1 (Heads), 0.9 is closer than 0.5. But more importantly, they should recognize that A's assignment was *rationally superior* regardless of the single outcome, because accuracy is about the **structure of the credence** relative to the evidence, not just the binary hit.

  *(Note: If they struggle, prompt them: "Does accuracy measure how lucky you were, or how close your number was to the target?")*
