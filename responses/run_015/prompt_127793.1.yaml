      *   **Key Tension:** Time is ideal/subjective (Kantian view) vs. Mathematical structure of the rotating universe (Closed Timelike Curves - CTCs).
      *   **Specific Question:** Do CTCs strengthen his idealism (no global 'before/after') or weaken it (local arrow of time remains definite)?
      *   **Requirements:**
