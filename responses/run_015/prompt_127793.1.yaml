          *   State the thesis: Gödel used the mathematical possibility of CTCs to argue for the *ideality* of time. The tension lies in whether the *local* preservation of time undermines the *global* dissolution of it.

      *   **Gödel's Philosophical Stance (The "Why"):**
          *   Connect to Kant. Time as a form of intuition, not a thing-in-itself.
