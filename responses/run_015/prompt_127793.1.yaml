  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Gödel's Philosophy:* He was a Platonist regarding mathematics but an Idealist regarding time (influenced by Kant and Parmenides). He believed time is a subjective form of intuition, not an objective feature of reality.
      *   *Gödel's Cosmology:* In 1949, he published a solution to Einstein's field equations describing a rotating universe.
      *   *Key Feature:* This universe contains Closed Timelike Curves (CTCs). This means an observer can travel into their own past.
      *   *The Argument:* Gödel argued that if GR (our best theory of objective time) allows for a universe where time travel is possible (and thus global time order breaks down), then time cannot be an objective feature of *any* universe, including ours. If it's not objective there, it's not objective here.
      *   *The Tension:* Locally, physics looks normal (light cones, causality). Globally, it breaks. Does the local definiteness save realism, or does the global breakdown kill it?

  3.  **Drafting the Argument - Section by Section:**

