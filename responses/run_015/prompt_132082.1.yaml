answer: |-
  We salute the cloth we call a flag,
  Though dye is fresh as living blood,
  Pressed warm from the industrial print,
  Drawn straight along a mapped border,
  Singing loud the manufactured anthem,
  Pretending we have conquered time.

  The clock ticks forward but we measure time,
  By how the cloth rises on the flag,
  We hum the tune of yesterday's anthem,
  As if it flows through shared blood,
  Ignoring how they drew the border,
  With ink still wet from the print.

  The newspaper dries the heavy print,
  Creating continuity through time,
  They walked the line of every border,
  To stitch the stars upon the flag,
  Demanding loyalty of blood,
  While binding hearts to every anthem.

  A stranger sings the same anthem,
  Reading news from the same print,
  Believing kinship lies in blood,
  Not knowing we are bound by time,
  Or who designed the colorful flag,
  Or why we guard this arbitrary border.

  It wasn't always here, this border,
  Nor was there always this anthem,
  Before they raised the first flag,
  Before the mass-produced print,
  Collapsed the distance of time,
  And told us we were one in blood.

  Is it biology that calls for blood,
  Or just a line upon a border?
  We fill the silence with time,
  And drown the doubt with anthem,
  Until the world becomes the print,
  And cloth becomes the flag.

  We know the stain is not truly blood, but ink behind the words of anthem,
  The line is just a drawn border, made solid by the daily print,
  We steal the weight of time, to drape it over simple flag.
