answer: |-
  Colleagues, friends, family. Welcome.

  I come to this table as a physicist, not a philosopher. In my former life, I spent decades searching for universal laws. We learned early that gravity does not care if you are standing next to a falling apple or watching it through a telescope. The force is identical. The distance is a variable in the equation, not a exemption from the law.

  Today, we gather to discuss obligation. Specifically, we are testing the strength of a familiar moral tool: the analogy of the drowning child. You all know the scene. You walk past a shallow pond. You see a child drowning. You can wade in and pull them out. The cost to you is muddy clothes, ruined shoes. The cost to the child is life. Almost every one of us agrees: you are obligated to save the child.

  The question for this workshop is whether this intuition survives contact with the modern world. Our harm is rarely a single child in a single pond. It is mediated by institutions, supply chains, atmospheric chemistry, and economic policies. The water is rising, but no one is pushing the child under; the water is rising because of a million distant actions.

  Some argue that here, the analogy collapses. They say structural harm requires a new framework entirely—one of justice, rights, or political solidarity, rather than rescue. They argue that when the cause is diffuse, the duty dissolves.

  I stand before you to argue the opposite. I propose that the analogy does not collapse. It holds, but only if we correct for a cognitive bias. Our intuition tells us that moral obligation decays with physical distance. I submit that this is a sensory error, not a moral truth.

  In physics, we distinguish between the *mechanism* of force and the *source* of force. In the pond analogy, the water is the immediate mechanism of death. In systemic harm—like climate change—the atmosphere is the mechanism. The institution is the mechanism. But the source of the force remains human agency.

  When we deny obligation because the harm is structural, we are confusing the complexity of the machine with the absence of the operator. An institution is not a moral black hole that swallows responsibility. It is a lever. If I design a machine that drains a pond while I stand a mile away, I am still drowning the child. The institution merely extends my reach.

  Therefore, the concept of "rescue" remains coherent, provided we redefine proximity. Proximity is not spatial; it is causal. If my actions, or my sustained participation in a structure, are a necessary condition for the harm, I am at the pond's edge. The muddy clothes are no longer ruined shoes; they are economic adjustment, lifestyle change, or political friction. The cost is higher, yes. But the ratio of cost-to-life remains unchanged.

  To claim otherwise is to suggest that morality obeys a different law than gravity—that it weakens over distance. If we accept that, we grant immunity to anyone sufficiently insulated by bureaucracy or geography. We would be saying that the person who pulls the trigger is guilty, but the person who designed the gun, funded the war, and ignored the rising sea levels is merely "complicated."

  This is why the work of the scientists in this room is not merely data collection. It is the act of locating the pond. You are telling us where the water is rising. You are telling us who is underwater. You are making the invisible causal links visible.

  So, let us not discard the analogy. Let us sharpen it. Let us agree that structural mediation does not negate rescue; it merely hides the water. Our task is to drain the pond, regardless of how many pipes feed it.

  Thank you.

  ***

  **Note on Framing and Interpretive Liberties**

  This address takes a specific stance on the "collapse" question that diverges from significant strands of contemporary political philosophy.

  1.  **Causal vs. Capacity-Based Duty:** The original drowning child argument relies heavily on the *capacity* to help at low cost. This speech shifts the weight toward *causal connection* ("If my actions... are a necessary condition for the harm"). This moves the argument closer to a principle of non-maleficence (do no harm) rather than pure beneficence (save whom you can), which is a contested expansion of the original analogy.
  2.  **Rejection of Structural Distinctness:** Many philosophers (e.g., Iris Marion Young) argue that structural injustice requires a "social connection model" distinct from the "liability model" of rescue, precisely because causal lines are too diffuse to assign individual rescue duties. This speech explicitly rejects that distinction, arguing instead for a unified moral field where institutions are merely extensions of agency. This is a realist/universalist move that simplifies the philosophical landscape for the sake of rhetorical unity.
  3.  **The Definition of Proximity:** The redefinition of proximity as "causal" rather than "spatial" is a philosophical claim, not a given. It assumes that moral obligation tracks causal efficacy perfectly, which ignores epistemic limitations (knowing *how* one is causing harm) that are far more prevalent in structural contexts than in the pond scenario.
