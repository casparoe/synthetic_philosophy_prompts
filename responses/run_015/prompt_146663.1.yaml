prompt: |-
  I'm running a 90-minute workshop for public-health grad students who aren't philosophy majors, and I need to teach epistemic injustice without just walking through Miranda Fricker's taxonomy like it's a checklist. I want to build the whole thing around one carrying case that lets me show testimonial and hermeneutical harm together, not as two seperate slides. I'm thinking of using the scenario where Black maternal-health patients describe cumulative bodily weathering from structural stress, and clinicians reinterpret that language as individual lifestyle failure or non-compliance — but I'm worried that collapses the two kinds of injustice into one muddy example instead of clarifying the distinction.

  So plan the teaching sequence for me. What has to come first — probably not the vocabulary, but maybe the idea that credibility is distributed and not just personal? — and what should come after? What's the right example or scenario to carry the session, and what must it include and avoid so that both testimonial deficit and hermeneutical gap are visible? Which misconcetions will they show up with — I'm guessing they'll think it's just bias or not listening — and at exactly what point should I head each one off? Give me one check question at the end that proves they've actually grasped the hermeneutical side, not just the testimonial side. And tell me what part of the standard framework I should drop for this crowd — maybe the virtue-epistemology framing? — and just say so. Write this in American English, please. No reading lists.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**
      *   **Audience:** Public-health grad students (non-philosophy majors). Practical, systems-oriented, likely familiar with social determinants of health but maybe not epistemology.
      *   **Time:** 90 minutes.
      *   **Topic:** Epistemic Injustice (Miranda Fricker's framework).
      *   **Constraint 1:** Do *not* teach it as a checklist/taxonomy (Testimonial vs. Hermeneutical as separate slides).
      *   **Constraint 2:** Use *one* carrying case/scenario to show both harms together.
      *   **User's Idea:** Black maternal health patients describing "weathering" vs. clinicians interpreting it as "non-compliance."
      *   **User's Worry:** Will this collapse the two harms into one muddy example?
      *   **Deliverables:** Teaching sequence, scenario refinement (what to include/avoid), misconception management, one check question (specifically for hermeneutical injustice), what to drop from the standard framework.
      *   **Tone/Style:** American English, no reading lists, practical.

  2.  **Evaluate the User's Scenario (Black Maternal Health/Weathering):**
      *   *Strengths:* Highly relevant to public health. Clearly involves power dynamics. "Weathering" is a specific conceptual tool that might be missing in the clinical setting.
      *   *Weaknesses:* Risk of conflating bias (prejudice) with epistemic injustice (knowledge/credibility). Risk of making it look *only* like testimonial injustice (not believing the patient).
      *   *Solution:* To make the *hermeneutical* side visible, the scenario needs to show a gap in *shared understanding*, not just a refusal to listen. The patient has an experience ("weathering"), but the clinical framework lacks the concept to process it, so they force it into an existing bucket ("non-compliance").
      *   *Verdict:* Keep the scenario, but sharpen the distinction. The testimonial part is the *credibility deficit* (she's seen as irrational/emotional). The hermeneutical part is the *conceptual gap* (the system literally doesn't have a code for "structural stress manifesting physically," so it codes it as "behavioral failure").

  3.  **Determine What to Drop:**
      *   Fricker's original work is deeply rooted in Virtue Epistemology (the "virtuous listener," intellectual virtues, etc.).
      *   *Decision:* Drop the virtue ethics framing. Public health students care about systems, protocols, and structural interventions, not individual moral character development. Focus on *structural epistemic barriers* instead.

  4.  **Drafting the Teaching Sequence (90 Minutes):**

      *   *Phase 1: Hook & Intuition (15 mins).* Don't start with definitions. Start with the feeling of not being understood.
      *   *Phase 2: The Carrying Case (30 mins).* Introduce the scenario. Map the interaction.
      *   *Phase 3: Distinguishing the Harms (30 mins).* This is the crux. How to separate them within the same story?
      *   *Phase 4: Application & Check (15 mins).* The check question.

  5.  **Refining the Carrying Case (The "Weathering" Scenario):**
      *   *Need:* To show Testimonial Injustice: The clinician discounts the patient's report due to identity prejudice (e.g., "she's exaggerating").
      *   *Need:* To show Hermeneutical Injustice: The patient tries to explain the *cause* (structural racism/stress), but the medical record/protocol has no field for that. It forces a translation into "patient non-compliance."
      *   *Key Distinction:* Testimonial = "I don't believe *you*." Hermeneutical = "I don't have the *words/tools* to understand what you're saying, so I'll translate it into something I do understand (even if it's wrong)."

  6.  **Addressing Misconceptions:**
      *   *Misconception 1:* "It's just bias/racism." (True, but epistemic injustice is the *mechanism* by which that bias harms knowledge production).
      *   *Misconception 2:* "It's just not listening." (Hermeneutical injustice can happen even if they *are* listening, but lack the concepts).
      *   *Intervention:* Address these during the mapping phase.

  7.  **Developing the Check Question:**
      *   Must test Hermeneutical Injustice specifically.
      *   Bad question: "Was the patient believed?" (Tests testimonial).
      *   Good question: Needs to ask about the *resources* available to make sense of the experience.
      *   *Draft:* "If the doctor believed her but still coded it wrong, why?" -> "Because the system lacked the concept."

  8.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is 90 minutes enough? Yes, if I cut the philosophy history.
      *   *Critique:* Is the distinction clear enough? I need to make sure the "gap" isn't just "doctor is stupid." It's about the *collective* hermeneutical resource.
      *   *Adjustment:* Emphasize that the *doctor* might also be a victim of the hermeneutical gap (they were trained in a system that lacks the concepts), though the patient suffers the primary harm. This fits Public Health's systems view.

  9.  **Final Polish:**
      *   Ensure American English spelling/idioms.
      *   Check tone (respectful, expert, practical).
      *   Verify all constraints are met (no reading lists, one scenario, specific check question).

  **(Self-Correction during drafting the response):** I need to make sure I explicitly validate the user's worry about the "muddy example." I will advise them on how to *scaffold* the example so the two harms don't blur. I'll suggest using a timeline or a "translation" metaphor.

  10. **Final Structure:**
      *   **The Drop:** Virtue Epistemology.
      *   **The Carrying Case:** Refined "Weathering" scenario.
      *   **The Sequence:** 4 blocks (Intuition, Case, Distinction, Application).
      *   **Misconceptions:** Bias vs. Structure, Listening vs. Concepts.
      *   **The Check Question.**

