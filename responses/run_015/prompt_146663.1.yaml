answer: |-
  Here is a 90-minute workshop plan designed for public-health grad students. It treats epistemic injustice as a structural barrier to health equity rather than a philosophical taxonomy.

  ### 1. What to Drop: The Virtue-Epistemology Framing
  **Drop it entirely.** Fricker's original framework relies heavily on the idea of the "virtuous listener" cultivating intellectual character traits. For public-health students, this individualizes a structural problem. They are trained to think in systems, protocols, and social determinants.
  *   **Replace with:** *Structural Epistemic Barriers.* Frame the injustice not as a moral failing of a specific clinician, but as a flaw in the informational infrastructure (EHR fields, diagnostic criteria, intake forms) that mediates the encounter.

  ### 2. The Carrying Case: "The Weathering Translation"
  Your instinct to use Black maternal health and "weathering" is correct. It is high-stakes and relevant. However, to prevent the "muddy example" problem, you must **stage the scenario in two beats.**

  **The Scenario:**
  A 34-year-old Black patient presents with hypertension at 20 weeks. She tells her provider: *"I feel like my body is tired from holding up everything else. It's the stress of the neighborhood, the job, watching my back everywhere I go. It's weathering."*

  **How to keep the harms distinct:**
  *   **Testimonial Injustice (The Credibility Deficit):** The provider hears the description but assigns it low credibility due to identity prejudice.
      *   *Signal:* The provider thinks, "She is being dramatic," or "She is making excuses." The patient is treated as an unreliable narrator of her own body.
  *   **Hermeneutical Injustice (The Conceptual Gap):** The provider *listens*, but the medical record system has no ICD-10 code or clinical category for "cumulative structural stress." The system forces a translation.
      *   *Signal:* The provider types "Patient reports high stress" but the dropdown menu forces a classification of "Non-compliance with lifestyle modifications" or "Anxiety disorder." The experience is understood, but it is *distorted* because the shared tools for understanding are missing.

  **What to Avoid:**
  *   Do not make the doctor a cartoon villain. If the doctor is just racist, students will file this under "Bias 101." The doctor must be trying to help but be constrained by the *hermeneutical resources* available to them (the EHR, the guidelines).
  *   Do not let the patient's description be vague. "Weathering" is a specific concept. If she just says "I'm stressed," the hermeneutical gap disappears because "stress" is a known category. She must describe something *structural* that the medical model treats as *individual*.

  ### 3. The Teaching Sequence (90 Minutes)

  #### Part 1: The Intuition Pump (15 Minutes)
  **Goal:** Establish that credibility is distributed, not personal.
  *   **Activity:** Do not define epistemic injustice yet. Ask: *"Have you ever had a physical symptom that you knew was real, but couldn't describe in a way that made a professional take it seriously? What happened to the description of that pain?"*
  *   **Discussion:** Elicit examples where the problem wasn't lying, but *translating*.
  *   **Key Point:** Introduce the idea that "Knowledge isn't just what's in your head; it's what the room allows you to say." Credibility is a currency issued by the listener, not just earned by the speaker.

  #### Part 2: Unpacking the Carrying Case (30 Minutes)
  **Goal:** Map the scenario without using the jargon yet.
  *   **Display:** Put the "Weathering" scenario on the screen.
  *   **Step 1 (The Testimonial Layer):** Ask, *"If the doctor assumes she is exaggerating because of stereotypes about Black women's pain tolerance, what is being harmed?"*
      *   *Answer:* Her status as a knower. She is silenced.
  *   **Step 2 (The Hermeneutical Layer):** Ask, *"Now, imagine the doctor believes her completely. She trusts the patient. But the Electronic Health Record requires a billing code. There is no code for 'racism-induced physiological wear.' What does the doctor have to do to save the chart?"*
      *   *Answer:* They must translate her structural experience into an individual pathology (e.g., "Anxiety" or "Non-compliance").
  *   **Visual Aid:** Draw a funnel. The patient's experience is wide and complex. The medical system is a narrow neck. Testimonial injustice blocks the entry. Hermeneutical injustice distorts the shape of the experience as it squeezes through.

  #### Part 3: Naming the Mechanisms (30 Minutes)
  **Goal:** Introduce Fricker's terms *after* they understand the dynamic.
  *   **Define Testimonial Injustice:** Prejudicial credibility deficit. (You aren't believed because of *who* you are).
  *   **Define Hermeneutical Injustice:** Structural gap in shared understanding. (You aren't understood because *what* you experienced lacks a name in the dominant system).
  *   **Crucial Intervention:** Students will conflate these.
      *   *Misconception:* "It's all just bias."
      *   *Correction:* "Bias drives the testimonial harm. But the hermeneutical harm can exist even without active bias. A well-meaning doctor can perpetuate hermeneutical injustice if the system doesn't give them the concepts to code 'weathering' correctly."
      *   *Misconception:* "Just listen better."
      *   *Correction:* "Listening solves testimonial injustice. It does not solve hermeneutical injustice. You can listen perfectly and still lack the vocabulary to categorize the harm structurally."

  #### Part 4: Application & Check (15 Minutes)
  **Goal:** Verify they can spot the hermeneutical gap specifically.
  *   **Activity:** Brief small group discussion. Ask them to identify one other area in public health where patients have experiences that the data systems can't capture (e.g., food insecurity described as "dietary choices," or housing instability coded as "missed appointments").
  *   **The Check Question:** (See below).

  ### 4. Managing Misconceptions
  You guessed correctly that they will think this is just "bias" or "not listening." Here is exactly when to head those off:

  1.  **When you introduce the scenario:** Students will immediately attack the doctor's character.
      *   *Head it off:* Say, *"For this exercise, we are going to assume the doctor is not malicious. We are looking at the equipment they are using to think."*
  2.  **When you define Hermeneutical Injustice:** Students will say, *"So we just need to educate the doctors on what weathering means?"*
      *   *Head it off:* Say, *"Education helps, but hermeneutical injustice is about collective resources. If the insurance company won't reimburse for 'structural stress interventions,' the concept exists but remains powerless. It's about institutional uptake, not just individual knowledge."*

  ### 5. The Check Question
  Do not ask a multiple-choice question. Ask a diagnostic scenario that forces them to isolate the hermeneutical element.

  **The Question:**
  > "A clinic implements a mandatory 'Implicit Bias Training' for all staff. Afterward, patient surveys show that patients feel *heard* and *believed* (Testimonial injustice decreases). However, health outcomes for marginalized groups do not improve, and data still shows these groups are disproportionately flagged for 'non-compliance.'
  >
  > **Based on today's framework, why did the intervention fail to fix the second problem?**"

  **The Answer You Are Looking For:**
  They must identify that while the *credibility* of the patient was restored (Testimonial), the *conceptual tools* to interpret the patient's barriers remained missing or individualized (Hermeneutical). The system still lacks the vocabulary/structure to code structural barriers as anything other than individual failure.

  If they answer "The doctors are still secretly racist," they missed the hermeneutical point. If they answer "The training didn't give them new categories to record the data," they got it.
