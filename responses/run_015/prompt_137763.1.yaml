prompt: |-
  I am designing one session of my upper-level seminar on formal epistemology and would like you to design the whole thing for me, as a runnable activity rather than a lesson plan.

  The setting: 16 students, one 75-minute session, one instructor and no assistant. No laptops for the students; I have a projector, a whiteboard, index cards, markers, dice, and my phone. The students can compute Bayes' theorem with a probability tree and are at ease with a three-variable joint distribution; almost none of them have met a proper scoring rule.

  The topic is Jeffrey conditionalization and uncertain evidence. Not the formula as a piece of machinery to be presented, but three things I want them to run into and only later be able to name. First: that there is a common kind of learning that does not fit the mould of "take some proposition E to be certain and set your new credence in H equal to your old P(H|E)" — cases where nothing is settled, your confidence in E merely moves to some value short of 1, and you nonetheless have to change your mind about H. Second: that the natural generalization — spread your new credence in H across the cells of the partition as a weighted average of P(H|E) and P(H|¬E), weighted by your new credences in E and ¬E — gives the right answer in a wide class of cases, and that this is surprising given how little information it uses. Third, and this is the one I care most about: that the rule's key assumption is a substantial condition and not a formality. I want them to see that two evidence-channels can move their confidence in E to exactly the same number while requiring quite different final credences in H, because one of the two channels also carries information about how strongly E bears on H. The update is not a function of the new marginal alone.

  Constraints. No lecture and no handout of the formalism up front. The words "Jeffrey," "probability kinematics," and "rigidity" must not appear in any student-facing material or in anything I say before the debrief, and ideally the weighted-average rule should not be written on the board until after the last round. No real money: points, a leaderboard, and something trivial as a prize. Whatever they write down must be written down individually and before any discussion in each round, because I want genuine scatter in the room, and I want at least one round in which the room predictably splits into two camps that disagree with each other by a margin nobody would call noise — and where the split is visible on the board before anyone explains it.

  My own half-formed idea, which you should feel free to discard: a hidden state, a sensor that reports on it, a report the students never see directly, and an "impression" of the report delivered through a channel whose character varies — sometimes the channel is merely noisy about what the report said, sometimes the way it is noisy also tells you something about how trustworthy the sensor was. I could not get the incentives to work, and I could not stop the students from either rounding their confidence in the report up to certainty or simply not moving at all.

  What I need from you:

  1. Props and procedure: exactly what is prepared in advance, how the hidden state and each channel are randomized (a facilitator's table of draws against dice or a percentiles table, not a phone app I have to trust), and how I can show the students afterwards that the draws were honest rather than engineered to make a point.

  2. The rounds, with a timeline in minutes: what is publicly known at each stage, what each student sees, and what each student commits to in writing. I want a control round in which the evidence really is hard and plain conditionalization is available; a round in which the evidence is soft and the weighted-average rule is exactly right; and a final round in which the same numerical shift in confidence about the evidence proposition is produced by two different channels in two halves of the room, with the two halves needing to end up far apart.

  3. The scoring scheme in full: the formula for the proper scoring rule you recommend, why you picked it over the alternatives, why I should elicit two numbers from each student rather than one (their credence in the hypothesis and their credence in the evidence proposition), what stops a student from gaming one number at the expense of the other, and how scores are aggregated across rounds so that one lucky trial does not decide the session.

  4. The reveal and the board artifact. I have in mind a scatter plot with the evidence-credence on one axis and the hypothesis-credence on the other, with each student as a dot, and a reference line drawn only after the dots are up — the line being the locus of points consistent with the weighted-average rule using the old conditional credences. Tell me how to run the reveal so that the students notice on their own that the two camps in the last round sit on opposite sides of that line, and what I should say, and not say, at that moment.

  5. The debrief: a mapping from specific moments in the session to specific formal claims, in the order I should take them, with the terminology introduced only here. Include which predictable student errors I should treat as reasonable and take seriously rather than correct.

  6. An honest account of what will go wrong the first time I run it — the failures of comprehension, of arithmetic, of attention, and of staging — and what to do about each in the moment.

  7. An honest account of what the activity cannot reproduce and that I will have to supply by lecture: in particular, say plainly where the setup misrepresents the real epistemological situation, since in my version the students are always handed a clean partition, a known joint distribution, and a determinate number for their own confidence in the evidence proposition, none of which real agents have.

  8. A complete answer key: every correct number for every round, computed, including the numbers for the two channels in the final round, and a note on how sensitive the effect is to the parameters so I can tune it if the gap between the camps comes out too small or too large.

  9. If it can be made to work, a variant of the final round in which two pieces of evidence are presented in opposite orders to the two halves of the room, arranged so that anyone who has been updating with stale conditional credences ends up in a different place depending on the order while a full Bayesian does not. If it cannot be made to work, say so and tell me why.
reasoning: |-
  Here's a thinking process that leads to the suggested session design:

  1.  **Analyze the Request:**

      *   **Goal:** Design a 75-minute upper-level seminar session on formal epistemology (Jeffrey Conditionalization/Uncertain Evidence).
      *   **Format:** Runnable activity, not a lesson plan. No lecture upfront. No laptops.
      *   **Participants:** 16 students, 1 instructor.
      *   **Prerequisites:** Comfortable with Bayes, probability trees, 3-variable joint distributions. *No* prior knowledge of scoring rules or Jeffrey Conditionalization.
      *   **Key Learning Objectives:**
          1.  Recognize learning where evidence isn't certain ($P(E) < 1$).
          2.  Discover the weighted average rule ($P_{new}(H) = P_{old}(H|E)P_{new}(E) + P_{old}(H|\neg E)P_{new}(\neg E)$) works in some cases.
          3.  **Crucial:** Realize the rule depends on *how* the evidence was obtained (Rigidity assumption), not just the new marginal $P_{new}(E)$. Two channels yielding same $P_{new}(E)$ require different $P_{new}(H)$.
      *   **Constraints:** No "Jeffrey," "Kinematics," or "Rigidity" until debrief. No handouts of formalism. Individual commitment before discussion. Visible split in the room. Points/leaderboard system (proper scoring rule).
      *   **Deliverables:** Props/procedure, Rounds/Timeline, Scoring Scheme, Reveal/Board Artifact, Debrief, Failure Modes, Limitations, Answer Key, Order-of-Evidence Variant.

  2.  **Deconstruct the Core Problem:**

      *   *The Trap:* Standard Bayesian updating assumes $P_{new}(E) = 1$. Jeffrey allows $P_{new}(E) = x$.
      *   *The Catch:* Jeffrey's formula assumes $P_{new}(H|E) = P_{old}(H|E)$ (Rigidity).
      *   *The Activity:* I need a scenario where students update $P(E)$ based on a signal, but the signal *also* changes the relationship between $E$ and $H$ in one condition, while preserving it in another.
      *   *The Setup:*
          *   Hidden State: $S \in \{Good, Bad\}$ (The "World").
          *   Evidence Proposition: $E \in \{Positive, Negative\}$ (The "Sensor Reading").
          *   Hypothesis: $H$ is usually equivalent to $S$ in these simplified games, but to make the 3-variable joint distribution relevant, let's make $H$ the state of the world and $E$ the sensor reading. Actually, to make the "Rigidity" point clear, we need a third variable or a specific structure.
          *   *Refined Setup:* Let's stick to the prompt's suggestion of a "Hidden State" and a "Sensor."
          *   Let $H$ = "The Urn is Red" (Hypothesis).
          *   Let $E$ = "The Ball Drawn is Red" (Evidence Proposition).
          *   Wait, the prompt asks for uncertain evidence.
          *   *Better Setup:*
              *   $H$: The Machine is Working ($W$) vs Broken ($B$). Prior $P(W) = 0.5$.
              *   $E$: The Light is Green ($G$) vs Red ($R$).
              *   Connection: If Working, $P(G|W) = 0.9$. If Broken, $P(G|B) = 0.1$.
              *   *The Twist:* The students don't see the light directly. They get a *report* about the light.
              *   *Condition 1 (Jeffrey-friendly):* The report is noisy but unbiased. "I saw the light, but I'm colorblind." $P_{new}(G)$ shifts, but $P(H|G)$ stays the same as prior conditional.
              *   *Condition 2 (Jeffrey-unfriendly):* The report is biased *depending on the state*. "The sensor degrades when the machine is broken." Here, learning about the light *also* tells you about the reliability of the light regarding the machine.
              *   *Wait, simpler approach for the "Split":*
              *   We need the *same* $P_{new}(E)$ but different $P_{new}(H)$.
              *   Let $H$ = "Urn A" (contains 90% Black, 10% White). Urn B (10% Black, 90% White). Prior 50/50.
              *   Let $E$ = "The ball drawn is Black".
              *   Standard Jeffrey: You glimpse the ball. You aren't sure. You assign $P(E) = 0.8$. You update $P(H)$ using the weighted average.
              *   Violation: You get a report "The ball is likely Black" from a source.
              *   *Scenario A:* The source is a reliable camera with static. $P(E)=0.8$. The relationship between Ball Color and Urn is unchanged.
              *   *Scenario B:* The source is a *person* who knows the Urn. If Urn A, they say "Likely Black" (80%). If Urn B, they say "Likely Black" (20%? No, that changes $P(E)$).
              *   *Let's try the "Sensor Reliability" angle.*
              *   $H$: Hypothesis (e.g., "It will rain").
              *   $E$: Evidence (e.g., "Barometer is low").
              *   Channel 1: You look at the barometer through fog. You are 80% sure it's low. The fog doesn't correlate with rain. (Jeffrey works).
              *   Channel 2: A weatherman tells you "The barometer is probably low." The weatherman knows the pressure system. If it's raining, he's more likely to say "probably low" than if it's not, *independent of the actual barometer reading*.
              *   *Actually, the cleanest way to break Rigidity:* The evidence acquisition process is correlated with $H$ *given* $E$.
              *   Let's use the "Urn and Ball" model but add a "Observer Type".
              *   $H$: Urn is Type H (High Black) vs Type L (Low Black).
              *   $E$: Ball drawn is Black.
              *   Observation: You don't see the ball. You get a signal $S$.
              *   *Round 2 (Jeffrey):* Signal $S$ depends *only* on $E$. (e.g., A noisy sensor). $P(S|E)$ is fixed. $P(H|E)$ is constant.
              *   *Round 3 (Split):*
                  *   Group 1: Signal $S$ depends *only* on $E$ (Same as Round 2).
                  *   Group 2: Signal $S$ depends on $E$ *and* $H$. (e.g., The sensor is more likely to glitch if the Urn is Type L).
                  *   Crucially: We tune parameters so $P_{new}(E)$ is identical for both groups, but $P_{new}(H)$ differs.

  3.  **Developing the Scoring Rule:**

      *   Need a proper scoring rule. Brier Score is simplest for binary events. $Score = 1 - (Outcome - Credence)^2$.
      *   Prompt asks to elicit *two* numbers: $P(H)$ and $P(E)$.
      *   Why? To show the divergence in $P(H)$ despite convergence in $P(E)$.
      *   Gaming: If I just score $P(H)$, they might ignore $P(E)$. If I score both, they must be honest about both.
      *   Aggregation: Sum of Brier scores across rounds. Lower is better (or higher if defined as $1 - Brier$). Let's use "Points = 100 - Brier * 100".
      *   Incentive: Leaderboard. Prize: Choice of reading for next week or a candy bar.

  4.  **Drafting the Rounds:**

      *   **Setup:** Two Urns. Urn X (9 Black, 1 White). Urn Y (1 Black, 9 White). Coin flip decides Urn. Prior $P(X) = 0.5$.
      *   **Event:** One ball drawn. $E$ = "Ball is Black".
      *   **Prior Calculations:**
          *   $P(E) = 0.5(0.9) + 0.5(0.1) = 0.5$.
          *   $P(X|E) = \frac{0.5 \times 0.9}{0.5} = 0.9$.
          *   $P(X|\neg E) = \frac{0.5 \times 0.1}{0.5} = 0.1$.
      *   **Round 1 (Control - Hard Evidence):** Students see the ball. It is Black. $P_{new}(E) = 1$. $P_{new}(X) = 0.9$.
      *   **Round 2 (Jeffrey - Soft Evidence):** Students don't see the ball. A "Visual Sensor" reports. The sensor is 80% reliable regardless of the Urn.
          *   Signal: "Looks Black".
          *   Reliability: $P(\text{Report Black} | \text{Ball Black}) = 0.8$. $P(\text{Report Black} | \text{Ball White}) = 0.2$.
          *   Wait, if I give them the report, they update $P(E)$ via Bayes.
          *   Let's simplify. I tell them: "Due to fog, you should assign $P(E) = 0.8$." (This skips the mechanism of *why* $P(E)=0.8$ to focus on the update of $H$).
          *   *Correction:* The prompt wants them to *run into* the rule. If I just tell them $P(E)=0.8$, they might just guess $P(H)$.
          *   *Better:* I simulate the fog. I roll a die. If Ball Black, 1-8 = "Looks Black". If Ball White, 1-2 = "Looks Black".
          *   Students see "Looks Black". They calculate $P(E)$.
          *   $P(\text{Look Black}) = 0.5(0.8) + 0.5(0.2) = 0.5$.
          *   $P(E | \text{Look Black}) = \frac{P(\text{Look Black}|E)P(E)}{P(\text{Look Black})} = \frac{0.8 \times 0.5}{0.5} = 0.8$.
          *   So $P_{new}(E) = 0.8$.
          *   What is $P_{new}(X)$?
          *   $P(X | \text{Look Black}) = \frac{P(\text{Look Black}|X)P(X)}{P(\text{Look Black})}$.
          *   $P(\text{Look Black}|X) = P(\text{Look Black}|E)P(E|X) + P(\text{Look Black}|\neg E)P(\neg E|X)$.
          *   $= 0.8(0.9) + 0.2(0.1) = 0.72 + 0.02 = 0.74$.
          *   $P(X | \text{Look Black}) = \frac{0.74 \times 0.5}{0.5} = 0.74$.
          *   Check Jeffrey Formula: $P_{new}(X) = P(X|E)P_{new}(E) + P(X|\neg E)P_{new}(\neg E)$.
          *   $= 0.9(0.8) + 0.1(0.2) = 0.72 + 0.02 = 0.74$.
          *   It matches! This is the "Jeffrey works" round.
      *   **Round 3 (The Split - Rigidity Violation):**
          *   Half the room (Group A) gets the "Foggy Sensor" (Same as Round 2).
          *   Half the room (Group B) gets a "Biased Sensor".
          *   Goal: $P_{new}(E)$ must still be 0.8 for Group B. But $P_{new}(X)$ must be different.
          *   How to make $P_{new}(E) = 0.8$ but change $P(X| \text{Signal})$?
          *   We need the Signal to depend on $X$ directly, not just through $E$.
          *   Let Signal $S$ = "Report Black".
          *   Group A (Fog): $P(S|E) = 0.8, P(S|\neg E) = 0.2$. (Independent of X).
          *   Group B (Bias): $P(S|E, X) \neq P(S|E, \neg X)$.
          *   We need $P(E|S) = 0.8$ for Group B as well.
          *   Let's set parameters for Group B:
              *   If Urn X (9B, 1W): Sensor is perfect. $P(S|E, X) = 1, P(S|\neg E, X) = 0$.
              *   If Urn Y (1B, 9W): Sensor is noisy. $P(S|E, Y) = a, P(S|\neg E, Y) = b$.
              *   We need to solve for $a, b$ such that $P(E|S) = 0.8$.
              *   $P(S) = P(S|X)P(X) + P(S|Y)P(Y) = 0.5 P(S|X) + 0.5 P(S|Y)$.
              *   $P(S|X) = 1(0.9) + 0(0.1) = 0.9$.
              *   $P(S|Y) = a(0.1) + b(0.9)$.
              *   $P(E \cap S) = P(E \cap S | X)P(X) + P(E \cap S | Y)P(Y)$.
              *   $P(E \cap S | X) = P(S|E,X)P(E|X) = 1 \times 0.9 = 0.9$.
              *   $P(E \cap S | Y) = a \times 0.1 = 0.1a$.
              *   $P(E|S) = \frac{0.5(0.9) + 0.5(0.1a)}{0.5(0.9) + 0.5(0.1a + 0.9b)} = 0.8$.
              *   $\frac{0.9 + 0.1a}{0.9 + 0.1a + 0.9b} = 0.8$.
              *   $0.9 + 0.1a = 0.72 + 0.08a + 0.72b$.
              *   $0.18 + 0.02a = 0.72b$.
              *   $18 + 2a = 72b \Rightarrow 9 + a = 36b$.
              *   Let's pick $a = 0.9$ (Sensor good on Black in Urn Y).
              *   $9.9 = 36b \Rightarrow b = 0.275$.
              *   Let's try to find integer-friendly dice probabilities.
              *   Let's try $a=0$ (If Urn Y and Ball Black, Sensor never says Black? No, that lowers $P(E|S)$).
              *   Let's try $b=0.25$ (1/4). $36(0.25) = 9$. So $9+a=9 \Rightarrow a=0$.
              *   So: If Urn Y, Ball White: Sensor says Black 25% of time. If Urn Y, Ball Black: Sensor *never* says Black? That's weird.
              *   Let's try $b = 0.5$ (1/2). $36(0.5) = 18$. $9+a=18 \Rightarrow a=9$ (Impossible, prob > 1).
              *   Let's try $b = 0.3$ (3/10). $36(0.3) = 10.8$. $9+a = 10.8 \Rightarrow a = 1.8$ (No).
              *   Let's try $b = 0.2$ (1/5). $36(0.2) = 7.2$. $9+a = 7.2$ (Negative).
              *   Okay, I need $b$ to be larger.
              *   Equation: $0.72b = 0.18 + 0.02a$.
              *   If $a=1$ (Perfect on Black in Urn Y): $0.72b = 0.2 \Rightarrow b = 0.277...$
              *   If $a=0.5$: $0.72b = 0.19 \Rightarrow b = 0.263...$
              *   Let's adjust the Urn contents to make math nicer.
              *   Urn X: 8B, 2W ($P(E|X)=0.8$). Urn Y: 2B, 8W ($P(E|Y)=0.2$). Prior 0.5.
              *   $P(E) = 0.5$. $P(X|E) = 0.8$. $P(X|\neg E) = 0.2$.
              *   Target $P_{new}(E) = 0.8$.
              *   Group A (Fog): $P(S|E)=0.8, P(S|\neg E)=0.2$.
              *   $P(S) = 0.5(0.8) + 0.5(0.2) = 0.5$.
              *   $P(E|S) = 0.8 \times 0.5 / 0.5 = 0.8$.
              *   $P(X|S) = P(X|E)P(E|S) + P(X|\neg E)P(\neg E|S) = 0.8(0.8) + 0.2(0.2) = 0.64 + 0.04 = 0.68$.
              *   Group B (Bias): Need $P(E|S) = 0.8$. Need $P(X|S) \neq 0.68$.
              *   Structure: $P(S|E, X) = 1$. $P(S|\neg E, X) = 0$. (Perfect sensor if Urn X).
              *   $P(S|E, Y) = a$. $P(S|\neg E, Y) = b$.
              *   $P(S|X) = 1(0.8) + 0(0.2) = 0.8$.
              *   $P(S|Y) = 0.2a + 0.8b$.
              *   $P(S) = 0.5(0.8) + 0.5(0.2a + 0.8b) = 0.4 + 0.1a + 0.4b$.
              *   $P(E \cap S) = 0.5 [ P(S|E,X)P(E|X) ] + 0.5 [ P(S|E,Y)P(E|Y) ]$.
              *   $= 0.5 [ 1 \times 0.8 ] + 0.5 [ a \times 0.2 ] = 0.4 + 0.1a$.
              *   We want $P(E|S) = \frac{0.4 + 0.1a}{0.4 + 0.1a + 0.4b} = 0.8$.
              *   $0.4 + 0.1a = 0.32 + 0.08a + 0.32b$.
              *   $0.08 + 0.02a = 0.32b$.
              *   $8 + 2a = 32b \Rightarrow 4 + a = 16b$.
              *   Let $a = 0.4$ (2/5). $4.4 = 16b \Rightarrow b = 0.275$. (Messy).
              *   Let $a = 0.8$ (4/5). $4.8 = 16b \Rightarrow b = 0.3$. (Clean!).
              *   So Group B Parameters:
                  *   If Urn X: Sensor Perfect ($P(S|E)=1, P(S|\neg E)=0$).
                  *   If Urn Y: Sensor Noisy ($P(S|E)=0.8, P(S|\neg E)=0.3$).
              *   Check $P(X|S)$ for Group B:
                  *   $P(S) = 0.4 + 0.1(0.8) + 0.4(0.3) = 0.4 + 0.08 + 0.12 = 0.6$.
                  *   $P(X \cap S) = 0.5 \times P(S|X) = 0.5 \times 0.8 = 0.4$.
                  *   $P(X|S) = 0.4 / 0.6 = 2/3 \approx 0.667$.
              *   Comparison: Group A = 0.68. Group B = 0.667.
              *   Difference is 0.013. **Too small.** Students won't see this split on a board.
              *   I need a larger divergence.
              *   To maximize divergence, I need the Signal to be highly informative about $X$ in Group B, beyond what it says about $E$.
              *   Let's try making the Sensor *anti-correlated* with X in some way?
              *   Let's try: Group B Sensor only works if Urn Y?
              *   If Urn X: Sensor always says "White" ($S=\neg$).
              *   If Urn Y: Sensor behaves like Group A ($P(S|E)=0.8, P(S|\neg E)=0.2$).
              *   If students get Report "Black" ($S$):
                  *   They know Urn cannot be X (because X always gives White).
                  *   So $P(X|S) = 0$.
                  *   But what is $P(E|S)$?
                  *   $P(S|X) = 0$.
                  *   $P(S|Y) = 0.2(0.8) + 0.8(0.2) = 0.16 + 0.16 = 0.32$.
                  *   $P(S) = 0.5(0) + 0.5(0.32) = 0.16$.
                  *   $P(E \cap S) = 0.5(0) + 0.5(0.16) = 0.08$.
                  *   $P(E|S) = 0.08 / 0.16 = 0.5$.
                  *   This changes $P(E)$. I need $P(E|S) = 0.8$ for *both* groups to make the point that "Same $P(E)$ update $\neq$ Same $P(H)$ update".
              *   Okay, I must constrain $P(E|S) = 0.8$ for both.
              *   Let's go back to $4 + a = 16b$.
              *   I need $P(X|S)$ to be far from 0.68.
              *   $P(X|S) = \frac{0.5 P(S|X)}{P(S)} = \frac{0.5 P(S|X)}{0.5 P(S|X) + 0.5 P(S|Y)} = \frac{P(S|X)}{P(S|X) + P(S|Y)}$.
              *   Group A: $P(S|X) = 0.8(0.8) + 0.2(0.2) = 0.68$. $P(S|Y) = 0.68$. Ratio = 0.5. Wait.
              *   In Group A (Fog), $P(S|X) = P(S|Y)$ because Sensor is independent of Urn.
              *   So $P(X|S) = 0.5$.
              *   Wait, earlier I calculated Group A $P(X|S) = 0.68$. Why?
              *   Ah, $P(X|S) = P(X|E)P(E|S) + P(X|\neg E)P(\neg E|S)$.
              *   In Group A, $P(E|S) = 0.8$. $P(X|E) = 0.8$. $P(X|\neg E) = 0.2$.
              *   $0.8(0.8) + 0.2(0.2) = 0.68$.
              *   Why did the direct calculation give 0.5?
              *   $P(S|X) = P(S|E)P(E|X) + P(S|\neg E)P(\neg E|X) = 0.8(0.8) + 0.2(0.2) = 0.68$.
              *   $P(S|Y) = 0.8(0.2) + 0.2(0.8) = 0.16 + 0.16 = 0.32$.
              *   $P(X|S) = \frac{0.68}{0.68 + 0.32} = 0.68$. Okay, math holds.
              *   So Group A Target: $P(H) = 0.68$. $P(E) = 0.8$.
              *   Group B Target: $P(H) \neq 0.68$. $P(E) = 0.8$.
              *   Constraint: $4 + a = 16b$ (from earlier derivation with 80/20 urns).
              *   $P(X|S)_B = \frac{P(S|X)}{P(S|X) + P(S|Y)}$.
