      *   In Round 3, Group A derives $P(E)=0.8$. Group B derives $P(E)=0.8$.
      *   They must show this work on their card? No, just commit to the number.
      *   During Reveal, I ask: "What did you write for P(E)?" (Both say 0.8). "What did you write for P(H)?" (A says 0.68, B says 0.80).
      *   This creates the cognitive conflict.

  10. **Final Polish:**

      *   Ensure the "No Lecture" constraint is met. The instructor is a facilitator/game master until the debrief.
      *   Ensure the Scoring Rule is explained simply. "Closer to 0 or 1 is better. Being confident and wrong hurts a lot."
      *   Check the math one last time.
      *   Urn X: 8B, 2W. Urn Y: 2B, 8W. Prior 0.5.
      *   $P(B|X) = 0.8, P(B|Y) = 0.2$.
      *   $P(X|B) = 0.8, P(X|W) = 0.2$.
      *   Round 2 (Fog): $P(S|B) = 0.8, P(S|W) = 0.2$. (Independent of Urn).
          *   $P(S) = 0.5$. $P(B|S) = 0.8$.
          *   $P(X|S) = 0.8(0.8) + 0.2(0.2) = 0.68$.
      *   Round 3 (Split):
          *   Group A: Same as Round 2. ($P(X|S) = 0.68$).
          *   Group B:
              *   If X: $P(S|B)=1, P(S|W)=0$.
              *   If Y: $P(S|B)=0, P(S|W)=0.25$.
              *   $P(S|X) = 0.8$. $P(S|Y) = 0.2(0) + 0.8(0.25) = 0.2$.
              *   $P(S) = 0.5(0.8) + 0.5(0.2) = 0.5$.
              *   $P(B \cap S) = 0.5(1 \times 0.8) + 0.5(0 \times 0.2) = 0.4$.
              *   $P(B|S) = 0.4 / 0.5 = 0.8$. (Matches Group A).
              *   $P(X|S) = \frac{0.5 \times 0.8}{0.5} = 0.8$.
              *   Gap: 0.68 vs 0.80.
      *   This works perfectly.

  11. **Drafting the Response:** Structure according to the 9 points requested.

      *   *Self-Correction on Scoring:* If I score $P(E)$, and the outcome $E$ is revealed *after* they write, they are scored on calibration.
      *   *Incentive:* If they just write 0.5 for everything, they get safe points. Proper scoring rule penalizes this if they know more.
      *   *Prize:* "Bragging rights + Choice of next reading".
      *   *Board Artifact:* X-axis $P(E)$, Y-axis $P(H)$.
      *   *Debrief:* Connect "Fog" to Rigidity, "Calibration" to Rigidity Violation.

  12. **Variant (Point 9):**
      *   Can I make order matter?
