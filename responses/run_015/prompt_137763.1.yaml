      *   *Problem:* If they don't see the Ball, they can't score $P(E)$ against reality.
      *   *Solution:* I (Instructor) know the Ball. I record it. I reveal the Ball *after* scoring.
      *   *Constraint:* "Whatever they write down must be written down individually... before any discussion".
      *   So:
          1.  State generated (Hidden).
          2.  Signal generated (Public).
          3.  Students write $P(H)$ and $P(E)$.
          4.  Reveal State and Evidence (Ball).
          5.  Score.
      *   This works.

  6.  **Timeline:**

      *   0-10: Setup & Rules (Urn story, Scoring, Index Cards).
      *   10-25: Round 1 (Hard Evidence). Practice.
      *   25-40: Round 2 (Soft Evidence, Uniform). Discovery of Weighted Avg.
      *   40-55: Round 3 (Soft Evidence, Split). The Crisis.
      *   55-65: Board Plot & Reveal.
      *   65-75: Debrief & Formalism.

  7.  **Addressing Specific Prompt Requirements:**

      *   *Props:* Dice, Index Cards, Whiteboard.
      *   *Randomization:* Needs to be manual and verifiable. I will use a "Master Sheet" of pre-rolled dice results (sealed or just trusted, but prompt asks for honesty check). Better: I roll live on a document camera or just visibly at the front. Let's say "Instructor rolls 2d10 at the front".
      *   *Scatter:* Ensure instructions emphasize "Write your *own* credence".
      *   *Split:* Group A vs Group B in Round 3. I will hand out different "Sensor Manuals" (Index Cards) to Left/Right halves of the room.
      *   *Answer Key:* Must compute all values.
      *   *Variant:* Order of evidence. Can I do this?
          *   If I update $P(E)$ then $P(H)$, vs updating Jointly.
          *   If I use Jeffrey on $E$, then Conditionalize on $H$?
          *   Actually, the prompt asks: "two pieces of evidence are presented in opposite orders... anyone who has been updating with stale conditional credences ends up in a different place".
          *   This refers to the non-commutativity of Jeffrey Conditionalization if Rigidity is violated sequentially.
          *   It's complex for 75 mins. I will advise against it as it risks overloading the core "Rigidity" point. I'll explain why in section 9.

  8.  **Failure Modes:**

      *   Arithmetic errors. (Provide a cheat sheet? No, no handouts. Put priors on board).
      *   Confusion between $P(E)$ and $P(S)$.
      *   Gaming the score (sandbagging).
      *   Time overrun.

  9.  **Refining the "Split" Logic:**

      *   I need to make sure the students *calculate* $P(E)$ themselves in Round 2 & 3, otherwise they won't realize $P(E)$ is the same.
