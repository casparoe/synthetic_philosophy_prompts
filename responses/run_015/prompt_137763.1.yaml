          *   The "Answer Key" will handle the math. The narrative just needs to justify the dice rolls.

  5.  **Scoring Rule Details:**

      *   Brier Score: $BS = (f - o)^2$.
      *   Points: $1000 - 1000 \times BS$. (Avoids negatives).
      *   Two predictions: $P(H)$ and $P(E)$.
      *   Score = Score($P(H)$, Outcome H) + Score($P(E)$, Outcome E).
