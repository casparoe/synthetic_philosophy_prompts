answer: |-
  Here is a complete design for your 75-minute session. It is engineered to produce the specific cognitive conflicts you requested without using the forbidden terminology until the end.

  ### 1. Props and Procedure

  **Preparation:**
  *   **The Urns:** Two physical boxes labeled **Urn X** and **Urn Y**.
      *   **Urn X:** 8 Black tokens, 2 White tokens.
      *   **Urn Y:** 2 Black tokens, 8 White tokens.
  *   **The Coin:** One large coin to determine the Urn (Heads = X, Tails = Y).
  *   **The Sensor:** A set of **Instruction Cards**.
      *   **8 Cards labeled "Type F" (Fog):** Contain the reliability stats for Round 2 and Group A in Round 3.
      *   **8 Cards labeled "Type C" (Calibration):** Contain the reliability stats for Group B in Round 3.
  *   **Student Materials:** 16 Index cards (for submitting answers), markers.
  *   **Instructor Materials:** Whiteboard, 2d10 (two ten-sided dice), Master Log (a sheet for you to record the true state of the world for scoring).
  *   **Room Setup:** Arrange desks so there is a clear Left Half and Right Half.

  **Randomization & Honesty:**
  *   **The State:** At the start of each round, flip the coin publicly to choose the Urn. Draw a token from that Urn publicly (but cover it immediately so only *you* see the color). This is the **Hidden Evidence ($E$)**. The Urn identity is the **Hypothesis ($H$)**.
  *   **The Signal:** You roll 2d10 at the front of the room.
      *   Die 1 determines the **Signal ($S$)** based on the Hidden Evidence and the Card instructions.
      *   Die 2 is a "Control Die" rolled just to show you aren't cherry-picking numbers. Record both on the Master Log.
  *   **Verification:** At the end of class, leave the Master Log on your desk. Students can verify that the dice rolls matched the Signal announcements and that the Token drawn matched the Urn composition.

  ### 2. The Rounds (Timeline: 75 Minutes)

  **00:00 – 00:10: Setup & Scoring**
  *   **Narrative:** "We are testing sensors. $H$ is which Urn we are using. $E$ is the color of the ball drawn. You never see the ball directly; you get a Sensor Report ($S$)."
  *   **Priors (Write on Board):**
      *   $P(X) = 0.5, P(Y) = 0.5$.
      *   $P(Black|X) = 0.8, P(Black|Y) = 0.2$.
      *   *Derived:* $P(Black) = 0.5$. $P(X|Black) = 0.8$. $P(X|White) = 0.2$.
  *   **Scoring Rule:** "You will write two numbers on your card: Your credence in $X$ ($0$ to $1$) and your credence that the Ball was Black ($0$ to $1$).
      *   **Points = $200 - 100 \times [(P(H) - Outcome_H)^2 + (P(E) - Outcome_E)^2]$."
      *   "Max points per round is 200. Being confident and wrong hurts quadratically. Being vague (0.5) guarantees 150 points if you're wrong, but caps your gain."
  *   **Procedure:** "Write individually. No talking until I collect the cards."

  **00:10 – 00:25: Round 1 (Control – Hard Evidence)**
  *   **Goal:** Baseline. Ensure they can compute standard conditionalization.
  *   **Procedure:**
      1.  Flip Coin, Draw Token (Instructor sees Token).
      2.  **Announcement:** "The Sensor is Perfect. The Report is: **BLACK**." ($P(E)=1$).
      3.  Students compute: $P_{new}(X) = P(X|Black) = 0.8$. $P_{new}(E) = 1$.
      4.  Collect Cards. Reveal Token (Black). Score.
  *   **Expected Outcome:** Near unanimity at $P(H)=0.8, P(E)=1.0$.

  **00:25 – 00:40: Round 2 (Soft Evidence – Uniform Channel)**
  *   **Goal:** Discover the weighted average rule implicitly.
  *   **Procedure:**
      1.  Flip Coin, Draw Token (Instructor sees Token).
      2.  **Distribute:** "Type F" Cards to *everyone*.
      3.  **Card Text:** "Sensor Reliability: If Ball is Black, Report 'Black' 80% of time. If Ball is White, Report 'Black' 20% of time."
      4.  **Roll Dice:** You calculate the Signal based on the hidden Token and Card stats.
          *   *Example:* If Token is Black, roll d10. 1-8 = Report "Black".
          *   *Public Announcement:* "The Report is: **BLACK**." (Do not reveal the dice roll yet).
      5.  **Task:** Students must calculate $P(E|Report)$ and $P(H|Report)$.
          *   Math: $P(Rep=B) = 0.5(0.8) + 0.5(0.2) = 0.5$.
          *   $P(E|Rep=B) = \frac{0.8 \times 0.5}{0.5} = 0.8$.
          *   $P(H|Rep=B) = 0.8(0.8) + 0.2(0.2) = 0.68$.
      6.  Collect Cards. Reveal Token. Score.
  *   **Expected Outcome:** Most should converge on $P(E)=0.8, P(H)=0.68$.

  **00:40 – 00:55: Round 3 (The Split – Rigidity Violation)**
  *   **Goal:** Same $P(E)$, different $P(H)$.
  *   **Procedure:**
      1.  Flip Coin, Draw Token.
      2.  **Distribute:** Left Half gets **"Type F"** (Same as Round 2). Right Half gets **"Type C"**.
      3.  **Card Text (Type C):** "Sensor Calibration:
          *   If Urn X: Sensor is Perfect (Report matches Ball).
          *   If Urn Y: Sensor is Biased. If Ball Black, Report 'White' (100%). If Ball White, Report 'Black' (25%)."
      4.  **Roll Dice:** You calculate the Signal based on the hidden Token, the Urn, and the specific Card stats.
          *   *Crucial:* You must ensure the Public Report is **"BLACK"** for *both* halves.
          *   *Check:* If Token is Black & Urn Y, Type C sensor *never* reports Black. If this happens, you must re-draw the token or declare a "Sensor Glitch/No Signal" and skip. (See Answer Key for probabilities).
          *   *Assumption for Design:* We proceed only if Report is "Black".
      5.  **Task:** Calculate $P(E)$ and $P(H)$.
      6.  Collect Cards. **Do not reveal Token yet.**
  *   **Expected Outcome:**
      *   Left (Type F): $P(E)=0.8, P(H)=0.68$.
      *   Right (Type C): $P(E)=0.8, P(H)=0.80$.

  **00:55 – 01:05: The Reveal & Board Artifact**
  *   **Action:** Draw axes on the board. X-axis: "Credence in Black Ball". Y-axis: "Credence in Urn X".
  *   **Step 1:** Ask Left Half to raise hands if they wrote $P(E) \approx 0.8$. (Most will). Ask Right Half. (Most will).
      *   *Mark:* Draw a vertical dashed line at $X=0.8$. "You all agree on the evidence."
  *   **Step 2:** Ask students to come up and put a dot on the board for their $P(H)$.
      *   Left dots will cluster at $Y=0.68$.
      *   Right dots will cluster at $Y=0.80$.
  *   **Step 3:** Draw a horizontal line connecting the clusters.
  *   **Question:** "The vertical position is the same. The horizontal position is the same. Why are the dots in different places?"
  *   **Silence:** Let them talk to their neighbors for 2 minutes.
  *   **Reveal:** Reveal the Token and Urn. Score the round.

  **01:05 – 01:15: The Debrief**
  *   Connect the dots (see Section 5).

  ### 3. The Scoring Scheme

  **Formula:** Quadratic Scoring Rule (Brier Score variant).
  $$ \text{Points} = 200 - 100 \times \left( (p_H - o_H)^2 + (p_E - o_E)^2 \right) $$
  Where $p$ is the student's probability and $o$ is the outcome (1 if true, 0 if false).

  **Why this rule?**
  1.  **Proper:** It maximizes expected points only if they report their true credence.
  2.  **Two Variables:** Scoring $P(E)$ prevents them from ignoring the evidence probability to focus only on the hypothesis. It forces them to quantify the "uncertainty of the evidence."
  3.  **Scale:** 200 points max per round. A "safe" 0.5/0.5 guess yields $200 - 100(0.25+0.25) = 150$. A correct confident (1.0/1.0) yields 200. A confident error (1.0/0.0) yields 0. This creates tension between safety and accuracy.

  **Aggregation:** Sum points across 3 rounds.
  **Prize:** "The winner chooses the first reading for next week's seminar." (Academic power is a strong motivator in grad seminars).

  **Gaming Prevention:** Because $P(E)$ is scored, they cannot arbitrarily set $P(E)=1$ to make the math easier. They must compute the likelihood of the signal.

  ### 4. The Reveal and Board Artifact

  **The Artifact:**
  You will have a scatter plot.
  *   **X-axis:** $P(Black)$.
  *   **Y-axis:** $P(Urn X)$.
  *   **Visual:** A vertical column of dots at $X=0.8$.
  *   **The Split:** The column is bifurcated. Lower cluster (Left Half) at $Y=0.68$. Upper cluster (Right Half) at $Y=0.80$.

  **The Script:**
  1.  **Point to the X-axis:** "Everyone agrees the ball is 80% likely to be Black. You all updated your evidence credence identically."
  2.  **Point to the Y-axis:** "But you disagree on the Urn. By a margin of 12 percentage points."
  3.  **The Constraint:** "The formula $P_{new}(H) = P(H|E)P_{new}(E) + P(H|\neg E)P_{new}(\neg E)$ uses *only* the old conditionals and the new evidence marginal."
  4.  **The Trap:** "If that formula were universal, every dot would be on the exact same spot. They are not."
  5.  **The Question:** "What information did the Right Half have that the Left Half did not, *given that they both have the same confidence in the ball color*?"
  6.  **Wait for Answer:** Someone will say "The Right Half knew the sensor behaved differently depending on the Urn."
  7.  **The Takeaway:** "Exactly. The process that gave you $P(E)=0.8$ carried extra information about $H$ for the Right Half. The update rule depends on the *channel*, not just the *number*."

  ### 5. The Debrief (Mapping Moments to Formalism)

  **Order of Introduction:**
  1.  **Jeffrey Conditionalization (The Weighted Average):**
      *   *Map to:* Round 2.
      *   *Say:* "In Round 2, the sensor noise was independent of the Urn. Your update followed the weighted average rule. This is often called **Jeffrey Conditionalization**."
      *   *Write:* $P_{new}(H) = P_{old}(H|E)P_{new}(E) + P_{old}(H|\neg E)P_{new}(\neg E)$.
  2.  **The Rigidity Condition:**
      *   *Map to:* The Split in Round 3.
      *   *Say:* "This formula assumes **Rigidity**: that your conditional credences $P(H|E)$ do not change during the update. In Round 2, learning the sensor report didn't change how much a Black ball implies Urn X. In Round 3 (Right Half), learning the report *did* change that implication, because the sensor's reliability was tied to the Urn."
  3.  **Uncertain Evidence:**
      *   *Map to:* Round 2 & 3 generally.
      *   *Say:* "This is the domain of **Uncertain Evidence**. You are not certain of $E$, but you must update $H$."

  **Predictable Errors to Validate:**
  *   **"I just averaged the priors":** If a student says "I just split the difference," acknowledge that without the Rigidity assumption, there is no unique solution, so heuristics are natural.
  *   **"I ignored the sensor stats":** If someone treated Round 2 like Round 1 ($P(E)=1$), point out that the scoring rule penalized them on the $P(E)$ component. This validates the need to track $P(E)$ separately.

  ### 6. Failure Modes & Mitigation

  1.  **Arithmetic Bottleneck:**
      *   *Risk:* Students spend 10 minutes calculating $P(S)$.
      *   *Fix:* Write the Law of Total Probability template on the board at the start: $P(S) = P(S|E)P(E) + P(S|\neg E)P(\neg E)$.
  2.  **The "No Signal" in Round 3:**
      *   *Risk:* In Round 3 (Type C), if Urn=Y and Ball=Black, the sensor *never* reports Black. If this draw happens, you cannot proceed with the "Report = Black" script.
      *   *Fix:* Have a backup script. "The Sensor reported **WHITE**." Recalculate the key numbers (see Answer Key). Or, simply redraw the token until a "Black Report" is possible. (Transparency: "I'm redrawing because this sensor configuration can't produce a Black report in this state").
  3.  **Gaming (Sandbagging):**
      *   *Risk:* Students write 0.8 for everything to get safe points.
      *   *Fix:* Emphasize the leaderboard. "The winner chooses the reading." Social pressure usually overcomes risk aversion in grad seminars.
  4.  **Confusion between $P(E)$ and $P(S)$:**
      *   *Risk:* Students write $P(E) = P(S)$.
      *   *Fix:* During Round 2 debrief, explicitly ask: "Did anyone write 0.5? That was the probability of the *Report*. The probability of the *Ball* is different."

  ### 7. Limitations (What the Activity Cannot Do)

  *   **The "Clean Partition" Problem:** In this game, the partition ($E$ vs $\neg E$) is given. In real life, agents struggle to define *what* proposition they are uncertain about. You must lecture that Jeffrey Conditionalization assumes you already know *which* proposition's probability has shifted.
  *   **The "Known Joint" Problem:** Students are given the exact likelihoods ($P(S|E)$). Real agents must estimate these. The activity shows how to update *given* the model, not how to build the model.
  *   **Sequential Updating:** This session does not cover what happens if you get two soft signals in a row. (See Section 9).

  ### 8. Answer Key & Sensitivity

  **Priors:**
  $P(X)=0.5, P(Y)=0.5$.
  $P(B|X)=0.8, P(B|Y)=0.2$.
  $P(X|B)=0.8, P(X|W)=0.2$.

  **Round 1 (Hard):**
  Report = Black.
  $P(E)=1$.
  $P(H) = 0.8$.

  **Round 2 (Fog - All):**
  $P(S|B)=0.8, P(S|W)=0.2$.
  $P(S) = 0.5(0.8) + 0.5(0.2) = 0.5$.
  $P(B|S) = \frac{0.8 \times 0.5}{0.5} = 0.8$.
  $P(X|S) = 0.8(0.8) + 0.2(0.2) = \mathbf{0.68}$.

  **Round 3 (Split):**
  *   **Left (Fog):** Same as Round 2. **$P(H) = 0.68$**.
  *   **Right (Calibration):**
      *   If X: $P(S|B)=1, P(S|W)=0$.
      *   If Y: $P(S|B)=0, P(S|W)=0.25$.
      *   *Condition:* Report is **Black**.
      *   $P(S|X) = 1(0.8) + 0(0.2) = 0.8$.
      *   $P(S|Y) = 0(0.2) + 0.25(0.8) = 0.2$.
      *   $P(S) = 0.5(0.8) + 0.5(0.2) = 0.5$.
      *   $P(B|S) = \frac{P(S|B)P(B)}{P(S)}$.
          *   $P(S|B) = P(S|B,X)P(X|B) + P(S|B,Y)P(Y|B) = 1(0.5) + 0(0.5) = 0.5$. (Wait, $P(X|B)=0.8$).
          *   Let's use Joint: $P(B \cap S) = P(X)P(B|X)P(S|B,X) + P(Y)P(B|Y)P(S|B,Y)$.
          *   $= 0.5(0.8)(1) + 0.5(0.2)(0) = 0.4$.
          *   $P(B|S) = 0.4 / 0.5 = \mathbf{0.8}$. (Matches Left).
      *   $P(X|S) = \frac{P(X \cap S)}{P(S)} = \frac{0.5 \times 0.8}{0.5} = \mathbf{0.80}$.
  *   **Gap:** $0.80 - 0.68 = 0.12$.

  **Sensitivity Tuning:**
  *   To **increase the gap**: Make the Type C sensor more informative about X. E.g., If Urn Y, Sensor *never* reports Black ($P(S|W,Y)$ can be anything, but $P(S|B,Y)=0$).
      *   If $P(S|B,Y)=0$, then $P(B|S)$ calculation changes.
      *   Current setup ($P(S|W,Y)=0.25$) is tuned specifically to keep $P(B|S)=0.8$.
      *   If you change $P(S|W,Y)$, you *must* recalculate to ensure $P(B|S)$ stays 0.8, or the X-axis split will confuse the Y-axis point.
      *   *Recommendation:* Stick to the provided numbers. The 0.12 gap is statistically visible with 8 students per side (Standard Error of Mean $\approx 0.05$ assuming some variance).

  **Round 3 "White Report" Backup:**
  *   If you must run "Report = White":
      *   Left (Fog): $P(B|S_W) = 0.2$. $P(X|S_W) = 0.8(0.2) + 0.2(0.8) = 0.32$.
      *   Right (Calib): $P(S_W|X) = 0.2$. $P(S_W|Y) = 0.8$.
      *   $P(S_W) = 0.5$.
      *   $P(B \cap S_W) = 0.5(0.8)(0) + 0.5(0.2)(1) = 0.1$.
      *   $P(B|S_W) = 0.2$. (Matches).
      *   $P(X|S_W) = \frac{0.5(0.2)}{0.5} = 0.2$.
      *   Gap: $0.32$ vs $0.20$. (Also 0.12).

  ### 9. The Order-of-Evidence Variant

  **Can it be made to work?**
  **No, not within these constraints.**

  **Why:**
  To demonstrate non-commutativity of Jeffrey Conditionalization (where Order A $\neq$ Order B), you need *two* successive uncertain updates where Rigidity fails for at least one of them.
  1.  **Time:** This requires 4 rounds (Control, Soft 1, Soft 2, Soft 2+1). You only have time for 3.
  2.  **Complexity:** Students are already struggling to compute one posterior with a hidden variable (Urn) affecting the sensor. Adding a second sequential update where the *first* update changes the likelihoods for the *second* update creates a cognitive load that will result in random noise rather than a clean philosophical point.
  3.  **The "Stale Credence" Point:** You asked for a variant where "anyone who has been updating with stale conditional credences ends up in a different place." This is exactly what Round 3 already demonstrates (Static Conditionals vs. Dynamic Conditionals). Doing it sequentially dilutes the punch of the single-round split.

  **Recommendation:**
