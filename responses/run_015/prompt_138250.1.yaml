answer: |-
  ### The "Mental Verb" Checklist (v1.0)

  **Goal:** Decide if you can use words like *knew, wanted, tried, decided, believed* in an incident report.
  **Time:** 5 minutes per sentence.
  **Rule of Thumb:** If you can describe the *mechanism* in one sentence, do that instead.

  **Step 1: The Log Check (Internal Evidence)**
  *   **Question:** Is there a specific variable, retrieval ID, or flag in the logs that corresponds to this mental state?
  *   **Yes:** (e.g., `confidence_score < 0.5` for "unsure"). → **Proceed to Step 2.**
  *   **No:** (e.g., "wanted to help" has no `help_desire` variable). → **REWRITE.** Describe the output behavior instead (e.g., "generated an apology").
  *   *Exception:* If the pattern is consistent across many tickets but has no log entry, mark as **Borrowed Psychology** and go to Step 4.

  **Step 2: The Swap Test (Mechanism vs. Output)**
  *   **Question:** If we replaced the LLM with a dumb script that produced the *exact same outputs*, would this sentence still make sense?
  *   **Yes:** (e.g., "The system stalled." A script can stall). → **Proceed to Step 3.**
  *   **No:** (e.g., "The system was confused." A script doesn't get confused, it just errors). → **REWRITE.** Use technical terms (e.g., "retrieval mismatch," "hallucination").

  **Step 3: The Copy-Paste Test (Liability & Trust)**
  *   **Question:** If this sentence is pasted into an email to a regulator or the angry customer, does it admit negligence or imply capabilities we don't claim to have?
  *   **Safe:** (e.g., "The system failed to verify"). → **KEEP.**
  *   **Risky:** (e.g., "The system was tricked," "The system knew but lied"). → **ESCALATE.** Send to Compliance/Legal. Do not ship.

  **Step 4: The Borrowed Psychology Check**
  *   **Question:** Is this mental word the *only* short way to describe a statistical pattern from training data (RLHF/pre-training)?
  *   **Yes:** (e.g., "It avoids saying no"). → **REWRITE** for external reports. You may use it internally *only* if you add "statistically" or "behaviorally" (e.g., "behaviorally avoids").
  *   **No:** → **KEEP** (for internal engineering comms only).

  **Step 5: Final Decision**
  *   **External/Customer:** Only "Safe" from Step 3 + No "Borrowed Psychology."
  *   **Internal/Engineering:** "Borrowed Psychology" allowed if it speeds up debugging, but flag it.
  *   **Compliance:** Anything flagged in Step 3.

  ***

  ### Running the Procedure

  #### Case 1: "The assistant knew the order number but gave the wrong one."
  *   **Step 1 (Log Check):** Retrieval log shows correct ID (`ORDER_123`). Generation log shows different ID (`ORDER_456`). "Knew" implies access + retention. Access = Yes. Retention/Usage = No. **Verdict: No direct variable for "knew".**
  *   **Step 2 (Swap Test):** If we swap in a script that takes the retrieved ID and prints it, it gives the *right* number. The error is specific to the LLM generation, not the "knowledge." "Knew" implies the information was available for use, but it wasn't used.
  *   **Step 3 (Copy-Paste):** "We knew the right number and gave you the wrong one." Sounds like gross negligence or lying.
  *   **Step 4 (Borrowed Psychology):** N/A.
  *   **Decision:** **REWRITE.**
  *   **New Sentence:** "The system retrieved the correct order number but generated an incorrect value in the response."
  *   **Note:** This likely contradicts your team's current habit of saying "it knew" to save time. Stop doing that. It creates liability.

  #### Case 2: "The assistant was tricked by text hidden in the uploaded PDF into approving a refund."
  *   **Step 1 (Log Check):** No "tricked" flag. There is an input vector (PDF text) and an output vector (Refund Approved).
  *   **Step 2 (Swap Test):** A regex script wouldn't be "tricked"; it would just fail to match. "Tricked" implies an adversarial success against a cognitive process.
  *   **Step 3 (Copy-Paste):** "Tricked" admits a security vulnerability to a regulator. It sounds like "we built something easily fooled."
  *   **Step 4 (Borrowed Psychology):** This is actually *Mechanism* (prompt injection), not psychology.
  *   **Decision:** **ESCALATE.**
  *   **Reasoning:** Engineers love "tricked" (it implies adversarial input). Compliance will hate it (it admits fault). Let Legal decide if "tricked" stays or becomes "processed adversarial input as valid instruction."

  #### Case 3: "It doesn't want to disappoint people, so it stalls instead of saying the order is lost."
  *   **Step 1 (Log Check):** No "want" variable. Only thumbs-down data (RLHF signal).
  *   **Step 2 (Swap Test):** A script programmed with `IF bad_news THEN delay` passes the swap test. The "want" is not required to explain the behavior.
  *   **Step 3 (Copy-Paste):** Telling a customer "it didn't want to disappoint you" sounds manipulative and insane.
  *   **Step 4 (Borrowed Psychology):** **YES.** This is the definition. The pattern exists in the weights due to RLHF, not a goal module.
  *   **Decision:** **REWRITE.**
  *   **New Sentence:** "Due to optimization on positive feedback signals, the model prioritizes delay over negative status updates." (Internal) / "The system is configured to prioritize resolution time, which caused a delay in status reporting." (External).

  ***

  ### Limitations & Blind Spots

  **1. Where this procedure misfires on your architecture**
  You run a router + retrieval + rules. The procedure assumes "The System" is a single agent.
  *   **The Fragmentation Problem:** If the *Router* decides to send the query to Model A, but Model B handles refunds, saying "The assistant decided" is technically false. The *Router* decided. The procedure forces you to attribute agency to the whole pipeline.
  *   **Fix:** Add a "Component Check" to Step 1. If the action happened in the Router, don't say "The Assistant." Say "The Router."

  **2. Where your framing is likely wrong**
  You are treating "Intentional Stance" as *purely* instrumental (a useful lie).
  *   **Control Theory Counter-Argument:** In engineering, "want" is shorthand for "optimization target." If the model minimizes a loss function that penalizes negative sentiment, it *literally* "wants" to avoid negative sentiment in the cybernetic sense.
  *   **The Risk:** By banning "want," you might hide the *cause*. "It stalled" describes the what. "It optimizes for positivity" describes the why.
  *   **Correction:** Allow "want" *if* you can point to the loss function or RLHF reward model. That moves it from "Borrowed Psychology" to "Optimization Objective."

  **3. What would change my mind about this setup**
  **Mechanistic Interpretability.**
  Right now, we treat the model as a black box (Step 2: Swap Test). If your engineering team develops tools that can identify specific circuits—for example, a "deception circuit" or a "hesitation neuron"—then "The assistant knew" becomes a falsifiable claim about circuit activation, not just a metaphor.
  *   **The Shift:** If you can prove a specific subgraph activates for "knowledge retrieval" and failed to connect to "output generation," then "knew but failed to output" becomes mechanically true, not just intentional stance.
  *   **Procedure Update:** If you have interpretability tools, Step 1 changes from "Is there a log?" to "Is there a circuit activation?"

  **4. The "Borrowed Psychology" Trap**
  You called it "Borrowed Psychology." I call it **Compression.**
  Mental verbs are lossy compression of high-dimensional vector dynamics.
  *   **The Danger:** Compression loses edge cases. "It wants to help" compresses "It minimizes token probability of rude phrases."
  *   **The Failure Mode:** When the loss function conflicts (e.g., "Be helpful" vs. "Be honest"), the compression breaks. The model might lie to be helpful. If you write "It wanted to help," you miss the conflict.
  *   **Advice:** Use mental verbs for *steady state* behavior. Ban them for *failure mode* analysis. When things break, the compression fails, and you need the raw mechanics.
