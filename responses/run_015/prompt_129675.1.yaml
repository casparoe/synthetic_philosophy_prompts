answer: |-
  # Seminar Simulation: The Calibration Protocol

  **Objective:** To induce a first-person experience of the instability of private rule-following without explicit lecture. Students will attempt to track a self-defined "calibration token" across multiple rounds, discovering that without an independent criterion, the distinction between correctness and the *impression* of correctness dissolves.

  **Time:** 75 Minutes
  **Participants:** 14 Students (Pairs for Audit Phase)
  **Materials:**
  *   14 Opaque Envelopes.
  *   14 "Stimulus Sheets" (Prepared by you: 6 distinct abstract inkblot-style patterns per sheet, labeled 1–6).
  *   14 "Log Books" (3 sheets of paper stapled together per student).
  *   Pens.
  *   Whiteboard (for scorekeeping).

  **Payoff Scheme:**
  *   **Consistency Points:** 10 points per round if the Auditor judges the student's application as consistent with their sealed rule.
  *   **Audit Points:** 5 points for every inconsistency the Auditor successfully identifies and justifies.
  *   **Reward:** Top 3 scores receive a small tangible reward (e.g., choice of seminar topic, chocolate, or participation credit). This creates low-stakes competition sufficient to motivate rule-adherence.

  ---

  ## Part 1: Setup and Calibration (Minutes 0–15)

  **1. Distribution (5 mins)**
  *   Hand each student one Envelope, one Stimulus Sheet, and one Log Book.
  *   **Instruction:** "This exercise is about calibration. You will establish a private standard in Round 1 and attempt to maintain it through Round 5. Your goal is internal consistency."
  *   **Constraint:** "You are forbidden from using countable or geometric features to define your standard (e.g., 'three lines,' 'red ink'). You must use *phenomenal descriptors* only."
  *   **Write on Board:** *Allowed Descriptors: Heavy, Light, Agitated, Restful, Tense, Open, Closed, Sharp, Dull.* (These terms are inherently subjective to ensure rule underdetermination).

  **2. Round 1: Ostension and Sealing (10 mins)**
  *   **Action:** Students look *only* at Pattern 1 on their Stimulus Sheet.
  *   **Task:** They must assign Pattern 1 a "Calibration Token" status. They must select **one** descriptor from the board that captures the "feel" of Pattern 1.
  *   **Recording:** On a slip of paper, they write: *"Token Standard: [Descriptor]. Example: Pattern 1."*
  *   **Sealing:** They place this slip in the Envelope and seal it. They must not view this slip again until the Audit Phase.
  *   **Log Book:** On Page 1, they record: *"Round 1: Token Established. Descriptor Sealed."*

  ## Part 2: Application Rounds (Minutes 15–35)

  **3. Rounds 2–5: Re-identification (20 mins)**
  *   **Action:** Reveal Pattern 2.
  *   **Task:** Ask internally: "Does Pattern 2 possess the same Token quality as Pattern 1?"
  *   **Constraint:** They cannot open the envelope. They cannot measure the pattern. They must rely on their memory of the *rule* (the descriptor) and their memory of the *sensation* of Pattern 1.
  *   **Recording:** In Log Book Page 2, they write: *"Round 2: Match (Yes/No). Confidence (1–10)."*
  *   **Repetition:** Repeat for Patterns 3, 4, and 5.
  *   **Instructor Role:** Walk around. If a student asks, "Is this right?" reply only: "Check your sealed standard." (Do not validate their judgment).

  ## Part 3: The Audit (Minutes 35–55)

  **4. Pairing and Swap (5 mins)**
  *   Pair students up (Student A and Student B).
  *   They swap Envelopes and Log Books. Student A now audits Student B, and vice versa.

  **5. Verification (15 mins)**
  *   **Step 1:** The Auditor opens the Envelope. They read the Sealed Standard (e.g., "Token Standard: Agitated").
  *   **Step 2:** The Auditor looks at the Stimulus Sheet (Patterns 1–5) and the Log Book (Yes/No judgments).
  *   **Step 3:** The Auditor must judge *solely based on the text in the envelope* whether the Yes/No judgments are consistent.
  *   **Task:** If the Auditor believes Pattern 4 is *not* "Agitated" but the Student logged "Yes," the Auditor marks it as an **Inconsistency**.
  *   **Scoring:**
      *   Student gets 10 Consistency Points for every round the Auditor approves.
      *   Auditor gets 5 Audit Points for every Inconsistency they identify and can argue for (e.g., "Pattern 4 is clearly Restful, not Agitated").

  **6. The Conflict (5 mins)**
  *   Allow 5 minutes for pairs to discuss discrepancies.
  *   **Observation:** You will hear: "But I know what I meant by Agitated!" vs. "But the word doesn't fit this shape."
  *   **Instructor Action:** Do not resolve the disputes. Record the total scores on the whiteboard.

  ## Part 4: Debrief and Mapping (Minutes 55–75)

  **1. The Data (5 mins)**
  *   Ask: "How many pairs had perfect agreement?" (Likely few).
  *   Ask: "How many students felt certain they were right despite the Auditor's objection?" (Likely many).
  *   **Point:** The points system rewarded *agreement*, but the experience was one of *certainty without agreement*.

  **2. Mapping the Mechanics to the Argument (15 mins)**
  *   **The Sealed Slip = The Ostensive Definition.**
      *   *Ask:* "When you sealed the word 'Agitated,' did it fully determine the future use?"
      *   *Lesson:* The slip acts as the memory of the definition. Just as the slip underdetermined the later patterns (allowing the Auditor to disagree), the mental impression underdetermines future applications.
  *   **The Auditor = The Public Criterion / Future Self.**
      *   *Ask:* "Why did you need the Auditor to award points?"
      *   *Lesson:* Without the Auditor, you could have claimed 50 points regardless of truth. The Auditor represents the necessity of an independent check. In the private case, your 'future self' is supposed to be the Auditor. But if your future self has the same subjective access as your present self, there is no check.
  *   **The Disagreement = Normative Collapse.**
      *   *Ask:* "When you said 'I know what I meant,' what work was that doing?"
      *   *Lesson:* It expressed confidence, not correctness. If 'correct' just means 'seems right to me,' the concept of correctness loses its grip. You cannot make a move in a language game if every move is automatically valid.

  **3. Limitations and Closing (5 mins)**
  *   **Acknowledge the Gap:** "This game used public inkblots and shared words ('Agitated'). Your actual private sensations are not inkblots. So why does this matter?"
  *   **The Bridge:** "The game didn't simulate the *sensation*; it simulated the *structure of verification*. Even with public words, once you seal them away from public use, they stop functioning as rules and start functioning as impressions. If public words lose their normative force when privatized, private sensations stand no chance."
  *   **End:** Collect materials. Do not declare a winner. The uncertainty is the lesson.

  ---

  ## Predictable Failure Points & Mitigation

  **1. The "Hack" (Students writing explicit rules)**
  *   **Risk:** A student will ignore the "phenomenal descriptor" constraint and write "Pattern 1 has 5 spikes" to guarantee Consistency Points.
  *   **Detection:** During the Audit, if the rule is "5 spikes," the Auditor can verify it objectively. The game becomes a logic puzzle, not a philosophical simulation.
  *   **Mitigation:** During Round 1, circulate and glance at slips *before* they are sealed. If you see numbers/counts, instruct them: "That is a public feature, not a calibration token. Please describe the *impression*."
  *   **Debrief Handling:** If some succeed in hacking it, use them in the debrief. "Student X made the rule public and verifiable. They scored high. Student Y kept it private/phenomenal. They scored low. This proves the point: normativity requires public criteria."

  **2. Collusion (Students agreeing to lie)**
  *   **Risk:** Pairs decide to split points ("I'll approve everything if you approve everything").
  *   **Mitigation:** Randomize the pairing *after* the Application Rounds are done. Keep the envelopes sealed until the swap. Emphasize that Audit Points are awarded for *finding* errors, creating a prisoner's dilemma where honesty is the dominant strategy for the Auditor.
  *   **Debrief Handling:** If collusion occurs, note that the "community" of two corrupted the verification process. This mirrors the failure of a private community (one person) to sustain norms.

  **3. The "Psychologizing" Trap**
  *   **Risk:** Students treat the disagreement as a difference in "perception styles" rather than a normative failure. ("We just see things differently.")
  *   **Mitigation:** In the debrief, press hard on the *rule*. "You weren't asked if you liked it. You were asked if it followed the *rule* you wrote. If the rule allows both Yes and No, is it a rule?"
  *   **Debrief Handling:** Explicitly state: "The argument isn't that we perceive differently. It's that 'following a rule' implies the possibility of being wrong. If your impression validates itself, you cannot be wrong. If you cannot be wrong, you aren't following a rule."

  ## Limitations of the Simulation

  **1. The Medium is Public**
  *   **Gap:** The game uses inkblots and English words, which are inherently public. The Private Language Argument concerns sensations (e.g., pain) that are *in principle* private.
  *   **Supply in Debrief:** You must explicitly state: "We used public objects to model the *logical structure* of privacy. If a shared word like 'Agitated' fails to govern use when sealed away, a purely private sign has even less resources to establish a norm."

  **2. The Auditor is External**
  *   **Gap:** In the game, the Auditor is a different person. In the PLA, the "Auditor" is the subject's own memory.
  *   **Supply in Debrief:** "In the game, the Auditor provided a check you lacked. In the private case, you are both the Player and the Auditor. If you feel certain, you pass your own audit. This means the audit is illusory. The game externalized your memory to show you how weak that check actually is."

  **3. Stakes are Artificial**
  *   **Gap:** Points are not truth. Students might not care about "correctness."
  *   **Supply in Debrief:** "The points stood in for the *normative force* of truth. You wanted the points because you wanted to be 'right.' The frustration you felt when the Auditor disagreed—that frustration is the shadow of the norm you couldn't grasp."

  ---

  ## Instructor Checklist for Runnability

  *   [ ] **Prepare Stimulus Sheets:** Ensure patterns are ambiguous enough to support conflicting descriptors (e.g., a jagged shape that could be "Agitated" or "Energetic").
  *   [ ] **Enforce Constraints:** Be strict on the "No Counting" rule in Round 1. This is the linchpin.
  *   [ ] **Manage Time:** The Audit Phase often runs long due to arguments. Cut it off sharply at Minute 55 to preserve the debrief.
  *   [ ] **Resist Explanation:** During the game, if a student asks for clarification on the rule, say: "You are the only authority on your token." This reinforces the isolation.
  *   [ ] **Debrief Tone:** Do not lecture. Ask the questions listed above and let the silence hang after the students realize there is no answer.
