answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name].

  When you look at Ellen's hands, you're looking at thirty-eight years of history. They're steady hands. She's weirdly proud of them, actually. She'll tell you they aren't symbols of anything. They're just the tools she used to pay the rent and raise a family. But I think they tell a story about how she saw the world.

  Ellen spent the first part of her career as a tool-and-die maker. Now, usually, when people talk about that era, they get misty-eyed. They talk about the smell of the cutting fluid, the artistry of the hand-file, the "good old days" before the computers took over.

  Ellen would cut you off mid-sentence. She had zero time for craft nostalgia. She knew the old shop was brutal; it was just slower. She never believed the machine was the enemy. She'd tell you that the same machinery used to speed up the line and exhaust the worker also created the only possible way to get off the line early. You can't have the shorter week without the machine, but the machine doesn't give you the shorter week on its own.

  That was the pivot. When she moved into the union, she stopped fighting the equipment and started fighting the contract.

  She had a test for everything new that came through the gate. She called it "The Two-Hour Question." If a new machine saves two hours a shift, do those two hours end up in the worker's pocket, or on the company's books? That was it. She didn't ask if the technology was "good." She asked who owned the time it saved.

  I know there are people in this room who disagree with how some of those answers came out, specifically back in the nineties. There's still some heat there. Ellen knew that. She also knew that Marx's joke about the "compensation theory"—the idea that workers displaced by machines just magically find new, better jobs elsewhere—was the funniest fiction ever written. She knew displaced workers only come back through specific deals, specific leverage, specific fights. She made the deal she thought secured the time. She didn't ask for your gratitude; she asked for your membership dues.

  And she was just as hard on the other side of the argument.

  To her grandchildren, who work in software: Ellen loved that you build the future. But she would warn you that there is no such thing as "fully automated." She had a phrase for this: "The Maintenance Hand."

  She said you can have the most advanced robot on the floor, but there is always a person standing next to it with a grease gun. There is always someone doing the setup, the cleaning, the night repair, the endless fiddling to keep the thing running. Automation doesn't remove the work; it just relocates it. It makes the labor harder to see, and therefore easier to underpay. The machine passes on value, but the living hand creates it.

  She brought that rigor everywhere. I remember one meeting where she was the only person who actually brought the books. Literally. She had a tote bag full of Marx while everyone else had sandwiches. When someone said, "Well, technology is neutral, it's all about how you use it," she nearly walked out. She hated that slogan. She thought it was lazy. Technology isn't neutral; it's crystallized labor. It comes with a social relationship built into the steel and the code.

  So, what do we do with that now? What is she actually handing on as she retires?

  It isn't a solution. Ellen would wince at the idea that she solved the contradiction between the promise of the machine and the reality of the hand. She didn't solve it. She inhabited it.

  She is handing us the tension itself.

  She is handing us the understanding that the machine makes the leisure *possible*, but only the contract makes it *real*. And she is handing us the knowledge that as long as there is a machine, there is a hand that must maintain it, and that hand must be counted.

  So, if you want to honor her, don't talk about her dignity. Don't talk about how the robots are coming to save us. And don't pretend the work speaks for itself.

  Instead, look at your own work, your own tools, your own code. And ask the Two-Hour Question. Who gets the time?

  Ellen, you kept the hand on the grease gun and the eye on the clock. We'll take it from here. To Ellen.
