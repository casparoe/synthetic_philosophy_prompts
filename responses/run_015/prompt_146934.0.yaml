      *   **Case Details:**
          *   Procedure: Gradual cortical replacement for a degenerative disease.
          *   Mechanism: Tissue swapped incrementally, implants reproduce spike-trains but not chemical modulation (fixed infusion).
          *   Risk: Unknown point where replaced/unreplaced tissue stops resynchronizing (potential "death" or loss of self).
          *   Patient Status: 60% complete. Competent on testing. Refusing next surgery. Life changes (new partner, quit job).
          *   Prior Directive: Signed *before* starting. Stipulates that later attempts to stop should be disregarded (reasoning: half-replaced self isn't the same person).
          *   Stakeholders:
              *   Patient: Refusing now.
              *   Daughter: Wants directive enforced.
              *   Surgeons: Funding only covers completion.
              *   PI: No data on stopping at 60%.
      *   **Required Content:**
          *   Recommendation (Honor refusal, enforce directive, or staged approach).
          *   Timeline/Conditions for next steps.
          *   Reasons that acknowledge the losing side's validity (not a brush-off).
          *   Specific engagement with two philosophical/clinical arguments:
              1.  The "Death by Steps" argument (Neurologist): If one-step replacement is death, is 200-step replacement 200 non-deaths?
              2.  The "Process Consent" argument: Is mid-process demurral exactly what the directive was meant to override, or a loophole?
          *   Distinction: Separate settled facts (policy, capacity, law) from contested areas.
          *   Constraint: No citations or reading suggestions.
      *   **Tone:** Professional, clinical ethics committee style, nuanced, acknowledging uncertainty.
      *   **Final Instruction:** Tell the user at the end if they should be drafting this (given the brother connection).

  2.  **Determine the Ethical Core:**
      *   **Autonomy vs. Precedent Autonomy:** Current competent refusal vs. Prior Advance Directive (Ulysses contract).
      *   **Identity/Personhood:** The patient's own reasoning for the directive (that he changes during the process) undermines the authority of his current self *or* validates his current self's right to stop.
      *   **Non-Maleficence/Beneficence:** Stopping might lead to desynchronization (unknown risk). Continuing against will is battery/coercion. Funding constraints shouldn't drive clinical ethics, but resource stewardship is a factor.
      *   **The "Death by Steps" Paradox:** If the end state is effectively a new entity or death of the old, does the gradual process mitigate the harm, or just hide it?
      *   **Conflict of Interest:** The writer is the patient's sibling. This is a major ethical breach for a committee member.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard CEC memo format (To, From, Date, Subject). *Self-correction: I need to leave the "From" blank or generic in the draft so the user can fill it, but I must address the COI at the end.*
      *   **Case Summary:** Concise recap of the medical and ethical facts.
      *   **Settled Facts:** Capacity is intact. Law on ADs is clear (usually), but application here is novel. Policy exists.
      *   **Contested Areas:** This is crucial. I need to explicitly label where the committee disagrees.
          *   Validity of the AD given the identity claim.
          *   The "Death by Steps" argument.
          *   Resource allocation (funding).
      *   **Analysis of Key Arguments:**
          *   *Neurologist's Point:* Address the Sorites paradox aspect. If gradualness masks the threshold of "death," does it matter?
          *   *Directive Point:* Is this a Ulysses contract binding a future self that the patient claims is different?
      *   **Recommendation:** Needs to be actionable. A "staged" approach is usually the most ethical middle ground in high-uncertainty cases. Pause, reassess, independent evaluation.
      *   **Timeline/Conditions:** Who needs to sign off? What data is needed?
      *   **Acknowledgement of Dissent:** Explicitly state why the other options were considered but not chosen, validating the concerns of surgeons/family.

  4.  **Addressing the Specific Prompts:**
      *   *Neurologist's Line:* "If replacing the whole thing in one operation would be a death, then doing it in two hundred steps can't be two hundred non-deaths." -> Need to articulate that gradualness *might* preserve continuity of consciousness, but if the endpoint is a discontinuity, the process is a slow fade. This must be marked as *contested*.
      *   *Directive Line:* "He consented to a process, and mid-process demurral is exactly the event he asked us to discount." -> Need to articulate that this treats the directive as a binding contract on identity, which conflicts with the current competent self's rights. Mark as *contested*.

  5.  **Addressing the Conflict of Interest (The "End" Instruction):**
      *   The user is the patient's brother.
      *   *Ethical Standard:* Absolute conflict of interest. A committee member cannot vote on, let alone draft the recommendation for, a family member's case. It compromises objectivity and public trust.
      *   *Action:* I must write the memo as requested (simulating the professional output) but then strictly advise them *not* to submit it or participate in that capacity.

  6.  **Refining the Tone:**
      *   Avoid being overly academic.
      *   Avoid "judicious" picking of sides in contested areas (as per prompt: "where it's contested just say it's contested").
      *   Ensure the "Settled" vs. "Contested" distinction is sharp.

  7.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Header:* To CEC, From [User], Re: Patient X.
      *   *Summary:* 60% cortical replacement. Competent refusal. Prior AD demanding completion.
