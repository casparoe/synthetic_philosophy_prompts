  **Justifications**

  *   **Darwinian:** The twenty-generation volatility of the payoff structure is too rapid for genetic selection to encode specific environmental knowledge, limiting this mechanism to encoding only the meta-capacities for simulation and social learning.
  *   **Skinnerian:** Because a single erroneous overt action is fatal, agents cannot survive the trial-and-error process required to associate actions with outcomes, rendering lifetime reinforcement learning impossible.
  *   **Popperian:** The accurate, low-cost internal simulator allows agents to filter lethal actions covertly, making internal selection the primary source of specific survival information for the individual.
  *   **Gregorian:** Observing the survival or death of conspecifics provides a high-value filter for the hypothesis space, reducing the simulation load, though the lack of transmitted "reasons" necessitates Popperian verification before adoption.

  **Environmental Change**

  **Change:** Extend the stability of the payoff-relevant structure from twenty generations to one thousand generations.

  **Direction:** Credit moves from **Popperian and Gregorian** to **Darwinian**.

  **Why:** In a static environment, phylogenetic learning (evolution) is a more efficient compressor of information than ontogenetic learning (individual or cultural); over sufficient generations, natural selection will hardwire the optimal behaviors as instincts, rendering costly individual simulation and social observation redundant.
