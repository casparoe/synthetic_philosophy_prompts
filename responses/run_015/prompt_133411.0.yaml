answer: |-
  **The Scenario**

  At the MetroChem depot, Senior Inspector Vance signs a transport manifest with the written assurance, "This containment seal will hold during transit," relying on standard ultrasonic scanning which shows no anomalies. Unknown to Vance and undetectable by any technology available at the time, a molecular fissure exists in the alloy due to a rare manufacturing defect, and the deterministic laws of material stress guarantee that the vibration of transit will cause a catastrophic breach at 4:00 PM. No action taken by any agent after Vance's signature could have prevented the breach, as the degradation was intrinsic to the material's history and the transit conditions were fixed by logistics schedules already in motion; the breach occurs exactly as the physical state at the time of signing necessitated, though the tank is intact when Vance speaks.

  **Verdicts on the Assurance ("This containment seal will hold during transit")**

  *   **Ockhamism:** Determinately **False** at the time of utterance. There is a privileged branch (the actual future) in which the seal fails, and bivalence applies to claims about that branch regardless of current evidence.
  *   **Settledness-based openness:** Determinately **False** at the time of utterance. The total state of the world at $t_0$ plus the laws nomologically fixes the breach, so the claim is settled as false before the event occurs.
  *   **Occurrence-based openness:** **Indeterminate** at the time of utterance; becomes determinately **False** only after the breach. Since the event has not occurred, the claim lacks a truth value, regardless of causal fixity.
  *   **Assessment-relativism:** **False** relative to a context of assessment after the breach, but **Indeterminate** (or not true) relative to a context of assessment at the time of utterance. There is no assessment-independent fact about whether the assurance was true *simpliciter* at $t_0$.

  **Answers to the Downstream Question**

  *   *Question:* The internal review board must canonize the record by marking the assurance either "Correct" or "Incorrect" to determine liability; a mark of "Incorrect" triggers a mandatory revocation of certification for issuing false guarantees.
  *   **Ockhamism:** Mark **"Incorrect."** The assurance was false when given, satisfying the condition for revocation regardless of Vance's epistemic state.
  *   **Settledness-based openness:** Mark **"Incorrect."** The assurance was determinately false when given because the outcome was settled, satisfying the truth-condition for revocation.
  *   **Occurrence-based openness:** **Unable to mark "Incorrect."** At the time of utterance, the assurance was not false but gappy; since the practice requires attributing falsity *at the time* to trigger revocation, the occurrence-theorist must either change the rule to track outcomes retrospectively or leave the record blank, failing to capture the normative force of the error.
  *   **Assessment-relativism:** **Unable to mark "Incorrect" absolutely.** The assurance is only false relative to the post-breach context; relative to the time-of-utterance context, it was not false. The record cannot be canonized with a single, assessment-independent verdict.

  **The Single Feature Doing the Work**

  The operative feature is **nomological fixity without occurrence**. This feature forces the Settledness theorist to align with the Ockhamist (both see determinacy) against the Occurrence theorist (who sees a gap).

  *   *Minimal Perturbation:* Remove the nomological fixity (e.g., introduce a genuine quantum chance that the seal might hold despite the fissure).
  *   *Effect on Verdicts:* The Settledness theorist now joins the Occurrence theorist in verdicts of **Indeterminate** at $t_0$ (since the laws no longer fix the outcome). The Ockhamist remains at **False** (since the privileged actual future still contains the breach). This breaks the Ockham/Settled alliance.

  **Extensionality Check**

  *   *Smallest Change to Break Agreement:* Introduce indeterminism into the causal chain (e.g., the breach depends on a probabilistic quantum decay).
  *   *Confirmation of Ockhamist Invariance:* The Ockhamist's verdict remains **False** because their view relies on the *actual future*, not on causal necessitation. Even if the laws allowed the seal to hold, if it *does not* hold in the privileged actual future, the claim is false at $t_0$. The Settledness theorist, however, shifts to **Indeterminate**, revealing that their agreement with Ockhamism in the original case was contingent on determinism, whereas Ockhamism is not.

  **Strongest Reply from an Occurrence-Theorist**

  1.  *Implicit Ceteris-Paribus:* The assurance implicitly means "The seal will hold, *assuming no hidden defects*." Since the defect existed, the condition failed, making the statement vacuously true or void, not false.
      *   *Critique:* This changes the sentence meaning (violating Condition 3). The assurance was about the *event* (holding), not the *conditions*.
  2.  *Practice Tracks Assertibility:* The review board should track whether Vance was *justified* (based on available evidence) rather than whether he was *right* (based on truth). Since he was justified, the "Incorrect" mark is inappropriate regardless of metaphysics.
      *   *Critique:* This is the stronger reply, but it concedes the metaphysical point to pragmatics. It admits the occurrence-theorist cannot satisfy the *truth-based* downstream question as specified, and instead argues the practice *ought* to be epistemic. If the practice is indeed truth-tracking (as per Condition 5), this reply fails to solve the problem.

  **Assessment-Relativism Note**

  Assessment-relativism lands with the Occurrence theorist on the $t_0$ verdict (no absolute truth value), creating the same difficulty for the downstream question: the record requires an assessment-independent verdict ("Was he right *then*?"), but relativism offers only assessment-dependent ones. The case causes difficulty because it exposes that relativism cannot support practices requiring a single, time-stamped truth value for the record, forcing it to either relativize the record itself or defer to a specific assessment context (effectively collapsing into Ockhamism or Occurrence).
