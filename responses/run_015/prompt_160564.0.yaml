      *   *Bottom:* Pure Vibes/Rhetorical (shuts down thought).

  8.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the frustration (it's a common rhetorical move).
      *   Section 1: The Ambiguity Audit (briefly clearing the deck on terms).
      *   Section 2: The Menu of Claims (The core request). Table or List format with Verdicts.
      *   Section 3: The "Meridia" Test (Applying to the specific scenario).
      *   Section 4: The Ranking (From useful to vibes).
