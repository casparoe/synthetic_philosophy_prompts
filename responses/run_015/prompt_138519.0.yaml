  **Joint Statement of Adversarial Collaboration on the Liar Paradox**

  **I. Agreed Claims**
  1. The Liar sentence ("This sentence is false") yields a contradiction under naive truth rules.
  2. Classical logic validates Explosion (from a contradiction, anything follows).
  3. Triviality (all sentences true) is unacceptable for reasoning.
  4. Logic selection involves trade-offs between intuitive principles and systemic stability.
  5. Disputes over "truth" and "negation" meanings are partly verbal but reflect substantive theoretical divergences.

  **II. Analysis of Specific Disputes**
  Regarding verbal disputes, we agree that while definitions vary, the conflict survives translation: it is a choice between competing formal systems modeling rational inference. Regarding the "inconsistency budget," we agree the framing accurately restates the dispute as an exchange rate: paraconsistency tolerates contradictions but restricts rules like Disjunctive Syllogism. The Classical side accepts this description but rejects the viability of the exchange, arguing the loss of standard inference is too high a price for tolerating pathological cases. The Dialetheist argues the cost is manageable and domain-relative, noting that in law or code, localized contradiction should not induce triviality. Regarding normative status, we identify the question of how to act on true contradictions (assert, reject, both) as a distinct crux from semantic truth, turning on the normativity of belief rather than meaning alone. Finally, we acknowledge the conditional-based paradox (a sentence claiming "If I am true, everything is true") threatens naive truth theories even without negation, requiring both sides to restrict either truth rules or conditional rules.

  **III. Residual Disagreements**

  | Issue | Dialetheist Formulation | Classical Formulation | Shared Evidence/Case | Predicted Implication (Dialetheist) | Predicted Implication (Classical) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Truth of Contradictions** | Some contradictions are true; the Liar is a true contradiction. | No contradiction is true; the Liar lacks truth value or is ill-formed. | Derivation of contradiction from naive truth rules. | Shows reality is inconsistent. | Shows naive truth rules are flawed. |
  | **Inference Costs** | Giving up Disjunctive Syllogism is a fair price to avoid Explosion. | Giving up Disjunctive Syllogism destroys useful reasoning; Explosion is preferable. | Failure of Disjunctive Syllogism in paraconsistent models. | Reasoning remains robust enough. | Reasoning is unacceptably weakened. |
  | **Normative Status** | One can rationally accept both a sentence and its negation. | One must reject one side; accepting both violates rational norms. | Scenarios involving accepted contradictions. | Rational acceptance is possible. | Rational acceptance is impossible. |
  | **Conditional Paradox** | Naive truth can survive if conditional rules are restricted. | Naive truth must be restricted; conditional rules are secure. | Derivation of triviality from "If true, then everything." | Conditional logic must change. | Truth predicate must change. |
