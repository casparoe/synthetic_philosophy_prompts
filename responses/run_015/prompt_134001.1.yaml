  0.28

  - **0.90** — Explaining a specific outcome inherently requires contrastive selection, privileging causes that produced *this* result over others.
  - **0.80** — If cause-ranking is outcome-dependent, flipping the outcome necessitates a different causal hierarchy, structurally altering the narrative.
  - **0.25** — Hindsight is an epistemic structural constraint, not merely a cognitive bias that methodological discipline can fully eradicate.
  - **0.95** — Lexical neutrality is technically achievable, though often masks deeper teleological assumptions in sentence structure.
  - **0.40** — Genealogy escapes Whig history but remains present-dependent, so changing the present still changes the narrative object.

  **Combination:** I treat T1 and T2 as multiplicative suppressors on the base rate (explanation is likely outcome-dependent), T4 as a necessary condition that is easily met, and T3 and T5 as low-probability rescue paths that add marginal weight.

  **Least Confident:** Term 5 (the philosophical status of genealogy vs. history and its counterfactual stability).

  **The Gap:** You are banking on Term 3 (discipline can fix hindsight), while your supervisor is banking on Term 2 (outcome-dependence is fatal); the truth likely lies in Term 1 (explanation is inherently contrastive), which supports her view more than yours.

  **Number Mover:** A decent argument that explanation is necessarily outcome-dependent (Term 2) would crush my credence faster than a single narrative example could raise it, since existence claims are easy to cherry-pick.

  **Essay Advice:** Declare it a genealogy, but do not claim it passes the reversal test; instead, argue that the reversal test itself assumes a contingency that genealogy denies, making the tension the subject of your analysis rather than a flaw to be hidden.
