  # Q&A Strategy Sheet: "Verisimilitude Without Convergence"

  ## I. Opening Concessions (To Lower Temperature)
  *Begin your closing remarks or Q&A preamble with these three admissions to disarm hostile framing:*
  1.  **Quantitative Precision:** Explicitly concede that you are abandoning the Popperian dream of a cardinal metric for truth-likeness. State clearly: "We are trading calculability for explanatory power regarding theory stability."
  2.  **The Access Problem:** Acknowledge that defining the "physically accessible counterfactual neighborhood" is not a philosophical given but requires input from specific physical models (EFTs). You are not solving the demarcation of regimes *a priori*.
  3.  **Realist Commitment:** Admit that this view weakens the traditional No-Miracles Argument. If false theories can be robust, success is less miraculous. Frame this as a feature, not a bug: it explains the success of *false* theories without requiring them to be "approximately true" in the convergent sense.

  ---

  ## II. The Eight Objections (Ordered by Likelihood $\times$ Damage)

  ### 1. The Instrumentalist Challenge (Empirical Adequacy Redundancy)
  *   **Who:** Instrumentalists.
  *   **Objection:** "You've dressed up van Fraassen's 'empirical adequacy' in modal clothing. If a theory saves the phenomena across a range of perturbations, it's empirically adequate in that domain. Why posit 'modal inertness' as a truth-like property rather than just pragmatic reliability? You're adding metaphysical baggage without explanatory gain."
  *   **Reply (2 mins):** "Empirical adequacy is static; it tracks actual observations. Modal robustness is dynamic; it tracks *counterfactual* stability under perturbations that have not been observed. Newtonian mechanics is empirically adequate in the solar system, but its *verisimilitude* on my account comes from the fact that its false ontology (absolute time) remains inert under specific mass-velocity perturbations. An instrumentalist cannot explain why some false theories break under slight perturbations while others hold; they can only note that they *did* hold. My account predicts stability domains based on structural inertness, offering a guide for theory extension that mere adequacy does not."
  *   **Weakness:** Relies on the claim that we can assess counterfactual stability without relying on the very theory being tested (risk of circularity).
  *   **Concession Strategy:** **Defend.** This is the core distinction. Concede that *actual* predictions overlap, but insist the *modal* claim is distinct and necessary for understanding theory succession.

  ### 2. The Physicist's Regime Problem (Defining the Neighborhood)
  *   **Who:** Philosophers of Physics (QG specialists).
  *   **Objection:** "You talk about 'physically accessible counterfactual perturbations.' In quantum gravity, we don't know the phase space of the true theory. How do you define the 'modal neighborhood' without begging the question? If you define it using the false theory's own laws, you're just measuring internal consistency, not verisimilitude."
  *   **Reply:** "I agree we cannot define the neighborhood from a 'God's eye' view. We define it via Effective Field Theory (EFT) methodology. The 'accessible neighborhood' is determined by the energy scales where the auxiliary assumptions of the current framework remain experimentally unchallenged. We aren't measuring distance to the true QG theory; we are measuring the radius of stability of the current effective theory. Verisimilitude is local to the regime, not global to the universe."
  *   **Weakness:** Makes verisimilitude radically relativistic to energy regimes, potentially losing the sense of "progress" between regimes.
  *   **Concession Strategy:** **Concede Up Front.** Acknowledge that verisimilitude is regime-relative. This aligns with their EFT worldview and prevents them from attacking a global claim you aren't making.

  ### 3. The Realist's No-Miracles Dilution
  *   **Who:** Structural Realists.
  *   **Objection:** "The No-Miracles Argument relies on the inference that predictive success indicates structural truth. If a theory can be globally false yet modally robust, doesn't that sever the link between success and truth? You're allowing 'lucky' robustness to count as verisimilitude, which undermines the realist explanation of success."
  *   **Reply:** "It refines the NMA, not severs it. The 'miracle' isn't that the theory is true; it's that the *error terms* are modally inert. Realism should be committed to the robust structural components, not the whole ontology. My account explains why we can be realists about the structure of Newtonian gravity (the inverse square law) while being anti-realists about its ontology (absolute space), without calling the success a miracle."
  *   **Weakness:** Requires a clear criterion for distinguishing "inert error" from "robust structure," which is not fully developed in the paper.
  *   **Concession Strategy:** **Defend.** This is your opportunity to offer Structural Realists a more nuanced version of their own view.

  ### 4. The Theory Choice Underdetermination Worry
  *   **Who:** Philosophers of Physics.
  *   **Objection:** "In regimes where auxiliaries are under pressure (e.g., early universe cosmology), multiple competing frameworks might all exhibit modal robustness within their own self-defined neighborhoods. How does your metric help us choose between them if both are 'robustly false'?"
  *   **Reply:** "It doesn't guarantee a unique choice, but it ranks them by *breadth* of robustness. The theory that maintains predictive law-structure across a wider variety of auxiliary perturbations ranks higher. It shifts the debate from 'which is true?' to 'which breaks first?' This is how physicists actually work when data is scarce: they stress-test the structural stability of the candidates."
  *   **Weakness:** "Breadth" is hard to measure when the perturbations themselves are theoretical constructs.
  *   **Concession Strategy:** **Concede.** Admit it doesn't solve underdetermination completely, but argue it provides a better heuristic than aesthetic virtues (simplicity, elegance).

  ### 5. The Loss of Convergence (Progress)
  *   **Who:** Structural Realists.
  *   **Objection:** "If verisimilitude isn't convergence toward a unique true theory, what constitutes scientific progress? Are we just swapping one robustly false theory for another? You've saved verisimilitude by killing the 'truth' part."
  *   **Reply:** "Progress is the expansion of the domain of modal robustness. Einstein isn't 'truer' than Newton in a linear sense; Einstein's framework maintains structural stability under perturbations (high velocity, high mass) where Newton's becomes brittle. Progress is the enlargement of the regime where our law-structure remains inert to falsehoods."
  *   **Weakness:** Risks sounding like instrumentalism again (just bigger domains of prediction).
  *   **Concession Strategy:** **Defend.** Insist that "enlargement of robust domain" is a substantive notion of progress distinct from mere empirical coverage.

  ### 6. The Pragmatic Virtue Mask
  *   **Who:** Instrumentalists.
  *   **Objection:** "Modal inertness sounds like a pragmatic virtue (stability, ease of use). Why call it 'verisimilitude'? You're trying to have the normative weight of 'truth' with the safety of 'pragmatics'."
  *   **Reply:** "Because it tracks a mind-independent feature of the world-theory relation. Pragmatic virtues are about *us* (computability, convenience). Modal inertness is about *the system* (how the world responds to perturbations modeled by the theory). A theory can be pragmatically useful but modally brittle (e.g., Ptolemaic epicycles fitted to new data). My metric distinguishes between 'useful' and 'stable'."
  *   **Weakness:** The line between "world response" and "model response" is blurry in underdetermined regimes.
  *   **Concession Strategy:** **Defend.** Hold the line on the metaphysical commitment.

  ### 7. The Auxiliary Assumption (Duhem-Quine) Trap
  *   **Who:** Philosophers of Physics.
  *   **Objection:** "You say false components are inert. But in practice, we can always save a brittle theory by adjusting auxiliary assumptions. How do you prevent 'modal robustness' from becoming a shield for degenerating research programs?"
  *   **Reply:** "By requiring that the auxiliaries themselves be subject to the same robustness test. If you must introduce a new auxiliary to save the prediction under a small perturbation, and that auxiliary is itself brittle, the system's overall verisimilitude drops. We measure the robustness of the *system*, not just the core law."
  *   **Weakness:** Requires a holistic assessment that is computationally and philosophically difficult to bound.
  *   **Concession Strategy:** **Concede.** Acknowledge this is a limitation of the metric's applicability, not its definition.

  ### 8. The Structural Preservation Question
  *   **Who:** Structural Realists.
  *   **Objection:** "Does modal inertness guarantee structural preservation? Could a theory be robustly false but structurally discontinuous with the successor theory?"
  *   **Reply:** "It makes structural preservation likely, but not guaranteed. However, if a theory is modally robust, its mathematical structure is doing the heavy lifting for the predictions. When we move to the successor theory, we retain the structure that proved inert. This explains *why* structural realism works without requiring the initial theory to be 'approximately true'."
  *   **Weakness:** Admitting "not guaranteed" weakens the appeal to Realists.
  *   **Concession Strategy:** **Concede.** Be honest: robustness is a fallible indicator of structural continuity, but the best one we have.

  ---

  ## III. The "Must Land" Reply
  **Objection #1 (The Instrumentalist Challenge).**
  *   **Why:** If you fail to distinguish Modal Robustness from Empirical Adequacy, your thesis collapses into a restatement of van Fraassen. The entire project depends on verisimilitude being a distinct, valuable concept that explains *stability* rather than just *accuracy*.
  *   **Strategy:** Do not waver. Emphasize the *counterfactual* nature of the claim. Empirical adequacy is about the actual world; verisimilitude is about the neighborhood of possible worlds.

  ---

  ## IV. The "Dreaded Objection" (Internal Coherence)
  *   **The Objection:** "You define modal inertness relative to a theory's own law-structure. But if the theory is false, its law-structure misrepresents the world. How can you use a false law-structure to determine which counterfactuals are 'physically accessible' or 'inert' without begging the question? You need the true laws to define the modal neighborhood, but you claim we don't have the true laws."
  *   **Why it's deadly:** It attacks the coherence of the metric itself. If the metric relies on the theory it is evaluating to define the space of evaluation, it is circular.
  *   **Prepared Response (If asked):** "This is the hardest problem, and I address it via *overlapping consensus*. We don't use one theory's laws to define the neighborhood. We use the *intersection* of the modal neighborhoods defined by competing theories and background knowledge. Where Newton and GR agree on the counterfactual stability of a prediction, that region is 'accessible.' We are not defining the neighborhood from one false theory, but from the stable overlap of our best available false theories."
  *   **Risk:** This moves the goalposts from "theory-relative" to "consensus-relative." Be prepared to admit this shifts the account from individual theory evaluation to community practice.
