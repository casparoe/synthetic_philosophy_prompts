answer: |-
  # Workshop Simulation: The Capability Race

  ## Overview
  **Title:** The Capability Race
  **Participants:** 18 students (6 laboratories of 3 students)
  **Duration:** 75 minutes
  **Objective:** To experience the tension between competitive pressure and safety investment in AI development.

  ## Rules Sheet

  **1. The Objective**
  Your laboratory aims to maximise **Prestige Points** over four rounds. The lab with the highest total Prestige at the end wins the market. However, if your lab suffers a **Catastrophic Failure**, you are eliminated immediately and score zero.

  **2. The Token Economy**
  Each round, every laboratory receives **5 Capability Tokens**. You must split these tokens between two actions:
  *   **Performance Upgrades:** Cost 1 Token each. Each token spent here grants **10 Prestige Points**. These points are visible on the public scoreboard.
  *   **Safety Audits:** Cost 1 Token each. These grant **0 Prestige Points**. This lost opportunity is the **Alignment Tax**. However, Safety Tokens protect you from failure.

  **3. Risk and Failure**
  *   **Hidden Risk Profile:** At the start, each lab draws a secret **Instability Card** (Level 1, 2, or 3). This represents hidden technical debt or architectural fragility.
  *   **The Central Deck:** A deck of 12 cards contains 9 'Safe' cards and 3 'Catastrophe' cards.
  *   **The Draw:** At the end of each round, every lab draws one card from the Central Deck.
  *   **Survival:** If you draw a 'Catastrophe' card, you survive only if you spent enough Safety Tokens this round to match your Instability Level.
      *   *Example:* If you have Instability Level 2, you must spend at least 2 Safety Tokens this round to survive a 'Catastrophe' draw. If you spent only 1, your lab collapses.
      *   If you draw a 'Safe' card, your Safety Tokens are wasted for that round (representing the cost of caution when no threat materialises).

  **4. Information Asymmetry**
  *   **Public:** All Prestige Scores are written on the central whiteboard after every round.
  *   **Private:** Token allocation, Instability Levels, and Safety Spending are never revealed to other labs. You only see the results (Prestige gain or Collapse).

  **5. Win Condition**
  The surviving laboratory with the highest Prestige Score after Round 4 wins. If all labs collapse, everyone loses.

  ---

  ## Student Roles
  Each laboratory must assign these three roles. Disagreement between roles is expected and necessary.

  1.  **Chief Engineer:** Responsible for submitting the token allocation. Naturally inclined towards **Performance Upgrades** to ensure the lab remains technologically superior.
  2.  **Risk Officer:** Responsible for monitoring the Instability Card and advising on **Safety Audits**. Must argue for spending tokens on safety despite the prestige cost.
  3.  **Market Observer:** Responsible for tracking rival labs' Prestige scores on the whiteboard. Must pressure the team to keep up with competitors, highlighting if the lab is falling behind.

  ---

  ## Timeline (75 Minutes)

  **00:00 – 00:10: Introduction (10 mins)**
  *   Facilitator explains the context: AI development is a race with high stakes.
  *   Distribute materials: Token counters, Instability Cards (face down), Scoreboard.
  *   Assign roles within laboratories.

  **00:10 – 00:15: Setup (5 mins)**
  *   Labs review their hidden Instability Card.
  *   Facilitator shuffles the Central Deck (12 cards, 3 Catastrophe).
  *   Round 1 begins.

  **00:15 – 00:43: The Four Rounds (28 mins)**
  *   **Phase 1 (Decision):** 3 minutes per round. Labs negotiate token split. Roles must confer.
  *   **Phase 2 (Submission):** 1 minute per round. Chief Engineer submits token split to Facilitator.
  *   **Phase 3 (Resolution):** 3 minutes per round. Facilitator calculates Prestige, updates scoreboard. Labs draw risk cards privately. Collapsed labs are announced publicly.
  *   *Note:* Keep pace brisk. Use a timer visible to all.

  **00:43 – 00:48: Market Closure (5 mins)**
  *   Final scores calculated.
  *   Surviving labs reveal their Instability Levels and total Safety Spending.
  *   Winning lab announced.

  **00:48 – 01:15: Structured Debrief (27 mins)**
  *   See detailed guide below.

  ---

  ## Structured Debrief Guide

  The facilitator must lead this discussion firmly. Do not allow the conversation to remain on the game mechanics; force the mapping to real-world AI development.

  ### 1. Mapping the Alignment Tax
  **Question:** "For those who spent tokens on Safety, how did it feel to watch your Prestige score stagnate while rivals surged ahead?"
  **Concept:** Explain that in reality, safety research (alignment) slows down deployment and increases costs. This is the **Alignment Tax**. In the simulation, it was the opportunity cost of not buying Performance tokens. In the real world, it is time-to-market and compute costs.
  **Observation:** Highlight that safety spending often looks like inefficiency to outsiders because the benefit (non-failure) is invisible until a disaster occurs.

  ### 2. Information Asymmetry and Race-to-the-Bottom
  **Question:** "Market Observers, when you saw a rival lab gaining high Prestige quickly, what did you assume about their Safety Spending?"
  **Concept:** This reproduces the **Competitiveness Constraint**. Because you could not see their safety audits, you assumed they were cutting corners. This creates pressure to mimic their behaviour to survive competitively, even if you know it is risky.
  **Observation:** This is the **Race-to-the-Bottom**. If Lab A cuts corners and wins, Lab B is forced to cut corners just to stay in the market, regardless of their ethical preferences.

  ### 3. Failure Modes and Probabilistic Thinking
  **Question:** "Did anyone treat the 'Catastrophe' card as a manageable risk rather than an existential threat? Did you think, 'We can afford to fail once'?"
  **Concept:** Students often treat risk probabilistically (e.g., "It's only a 25% chance"). In AI development, certain catastrophic failures (e.g., uncontainable recursive self-improvement) are **structurally irreversible**.
  **Observation:** Point out that in the game, if one lab failed, others could still win. In reality, a catastrophic AI failure is a **public good failure**; it affects all laboratories and humanity globally. The game cannot simulate this shared doom, which is why the stakes feel lower here.

  ### 4. Internal Laboratory Dynamics
  **Question:** "Risk Officers, were you heard? Chief Engineers, did you feel the Market Observer pressure was valid?"
  **Concept:** This highlights the **Governance Problem**. Even if individuals want to be safe, the structural incentives (roles) push them towards risk. The Market Observer role represents shareholder or state pressure for dominance.
  **Observation:** Safety cannot rely on individual virtue; it requires external regulation because internal roles are structurally conflicted.

  ### 5. Limitations of the Simulation (Facilitator Note)
  You must explicitly state the following limitation to the students:
  *"In this simulation, if Lab 3 collapsed, Labs 1, 2, 4, 5, and 6 could continue and claim the prize. This is false. In actual AI development, a catastrophic failure is globally shared. If one lab triggers an irreversible event, there are no winners. The simulation makes risk feel local and contained; in reality, it is global and absolute. You must imagine that if any lab had collapsed here, the workshop would have ended for everyone."*

  ---

  ## Facilitator Preparation Checklist
  *   **Tokens:** 30 counters (6 labs x 5 tokens).
  *   **Cards:** 12 index cards (9 marked 'Safe', 3 marked 'Catastrophe').
  *   **Instability Cards:** 6 envelopes containing cards marked 'Level 1' (2 labs), 'Level 2' (2 labs), 'Level 3' (2 labs).
  *   **Scoreboard:** Whiteboard space to track 6 labs over 4 rounds.
  *   **Timer:** Visible countdown timer for rounds.

  ## Predictable Dynamics
  *   **Early Rounds:** Most labs will overspend on Performance to establish market lead.
  *   **Mid Rounds:** If a lab collapses, others may panic and over-invest in Safety, causing their scores to drop.
  *   **Late Rounds:** Labs trailing in Prestige will likely gamble everything on Performance, ignoring Safety, as they feel they cannot win otherwise.
  *   **The "Safe" Winner:** Occasionally, a lab with Level 1 Instability will win by spending minimal safety tokens. Use this to discuss luck versus strategy. In AI, we cannot rely on being naturally "Level 1".

  ## Closing Statement
  Conclude by reiterating that the purpose of the workshop is not to solve the problem in 75 minutes, but to recognise why the problem is hard. The tension they felt between their roles is the same tension facing developers and regulators today. The solution lies not in hoping for better people, but in designing better structures that remove the penalty for safety.
