answer: |-
  You have identified a precise and pernicious mechanism in social ontology. To answer your first question directly: **No, there is no single established term in the literature that captures this specific three-stage configuration.**

  There are concepts that capture *parts* of the phenomenon, but none that capture the specific trajectory from *conceded arbitrariness* to *manufactured discovery*.

  ### 1. The Near Misses in the Literature

  **Ian Hacking's "Interactive Kinds" (1995)**
  This is the closest existing framework. Hacking distinguishes between "indifferent kinds" (quarks, which do not react to being classified) and "interactive kinds" (people, who react to being classified). He describes the "looping effect": classifying people changes how they behave, which changes the classification.
  *   **Where it fails your criteria:** Hacking's model is descriptive and usually honest about the looping. It does not inherently include the *third stage* you identified: the epistemic erasure of the loop. Hacking does not typically analyze the move where the *product* of the loop is cited as proof of the *independence* of the kind. He describes the machinery; you are describing the *cover-up* of the machinery.

  **Reification (Lukács/Marx)**
  This is the process of treating social relations or constructs as if they are natural things.
  *   **Where it fails your criteria:** Reification is too broad. It applies to capitalism, bureaucracy, and race. It does not specify the *temporal sequence* you note: the initial *concession* of arbitrariness followed by the *retraction* of that concession. In many cases of reification (e.g., racial essentialism), the arbitrariness is never conceded in Stage 1.

  **Pierre Bourdieu's "Social Magic"**
  Bourdieu argues that the act of grouping (e.g., by class) creates the group. He writes of the "performative power of discourse."
  *   **Where it fails your criteria:** Like Hacking, Bourdieu focuses on the *power* to create, not the subsequent *denial* that creation occurred. He is interested in how the magician pulls the rabbit out of the hat; you are interested in how the audience later insists the rabbit was in the hat all along.

  ### 2. The Coinage: Retrojective Naturalization

  Since the literature lacks a term for this specific *epistemic retrojection*, I propose the term **Retrojective Naturalization**.

  **Definition:**
  *Retrojective Naturalization* is a three-stage ontological process wherein:
  1.  **Nominal Concession:** A classification is introduced with an explicit or implicit acknowledgment that its boundaries are conventional, arbitrary, or administrative (not natural).
  2.  **Performative Enactment:** The classification exerts a causal influence on the classified subjects (via identification, treatment, or expectation), generating behavioral or psychological traits consistent with the classification.
  3.  **Epistemic Erasure:** The traits generated in Stage 2 are subsequently cited as empirical evidence that the classification tracked a pre-existing, mind-independent kind, thereby erasing the memory of the Stage 1 concession.

  **The Mechanism:**
  The core of this phenomenon is not just that the label changes the people (Hacking), but that the *changed people are used to vindicate the label as unchanging*. It is a feedback loop that hides its own wiring.

  ### 3. Boundary Conditions: Where the Phenomenon Ends

  To satisfy your request for precision, we must define where *Retrojective Naturalization* stops. It requires the satisfaction of all three stages. If any stage is missing, the term does not apply.

  **Case A: Astrological Signs (The Missing Feedback)**
  *   *Stage 1 (Nominal):* Yes. Astrology is acknowledged by skeptics (and often tacitly by believers) as a symbolic system based on arbitrary sky-sectors.
  *   *Stage 2 (Enactment):* Weak/Partial. People identify as "Scorpios," but the behavioral feedback is usually limited to self-narrative, not robust demographic behavior (purchases, voting, anxiety levels) verified by external survey data treated as scientific fact.
  *   *Stage 3 (Erasure):* **No.** Even believers do not typically claim that "Scorpio" is a *natural kind* discovered by astronomy. They claim it is a *spiritual* truth. The scientific community does not cite Scorpio traits as evidence of stellar causation.
  *   *Verdict:* **Excluded.** Fails Stage 3 (Scientific/Natural Discovery Claim).

  **Case B: Diagnostic Categories (e.g., ADHD) (The Missing Concession)**
  *   *Stage 1 (Nominal):* **No.** While philosophers of psychiatry know DSM boundaries are contested, the clinical introduction of a category rarely begins with a candid public concession that "these boundaries are arbitrary marketing tools." They are introduced as clinical discoveries or refinements of existing pathology.
  *   *Stage 2 (Enactment):* Yes. Strong looping effects (patients model behavior on diagnosis).
  *   *Stage 3 (Erasure):* Yes. The behaviors are treated as symptoms of a pre-existing condition.
  *   *Verdict:* **Excluded.** Fails Stage 1 (Candid Concession of Arbitrariness). This is *Standard Reification*, not *Retrojective Naturalization*. The "dirty secret" of construction is not initially admitted, so it cannot be later erased.

  **Case C: National Identities (The Contested Concession)**
  *   *Stage 1 (Nominal):* **Contested.** Nationalists actively fight against the idea that borders are arbitrary. They argue for "blood and soil" or historical destiny from the outset.
  *   *Stage 2 (Enactment):* Yes. Strong identification and behavioral alignment.
  *   *Stage 3 (Erasure):* Yes. The nation is treated as a natural entity.
  *   *Verdict:* **Excluded.** Fails Stage 1. The "arbitrariness" is the enemy to be defeated, not a premise conceded by the labelers.

  **Case D: Generational Labels (The Target)**
  *   *Stage 1:* **Yes.** Pew Research and marketers explicitly state cutoffs are fuzzy and arbitrary.
  *   *Stage 2:* **Yes.** Cohorts adopt the label, altering consumption and political self-conception.
  *   *Stage 3:* **Yes.** Sociologists and journalists publish "The Anxious Millennial" studies, treating the anxiety as a property of the *cohort* (biological/historical fate) rather than a property of the *labeling regime*.
  *   *Verdict:* **Included.**

  ### 4. Philosophical Implications

  The significance of **Retrojective Naturalization** lies in its immunity to standard critique.

  If you critique a *Natural Kind* (e.g., "Tigers exist"), you are fighting science.
  If you critique a *Social Construct* (e.g., "Money exists"), you are fighting sociology.
  If you critique a case of *Retrojective Naturalization*, you are fighting a **moving target**.

  When you point out the arbitrariness (Stage 1), the proponent points to the data (Stage 3). When you point out the data is produced by the label (Stage 2), the proponent points to the "reality" of the suffering or behavior. The mechanism converts the *weakness* of the category (its arbitrariness) into its *strength* (its ability to organize reality), then hides the conversion.

  **Conclusion:**
  You should call this **Retrojective Naturalization**. It distinguishes itself from Hacking's *Interactive Kinds* by emphasizing the *erasure of origin*, and from *Reification* by emphasizing the *initial concession of arbitrariness*. It ends precisely where the initial concession is absent (Diagnosis, Nationalism) or where the final claim to natural discovery is absent (Astrology, Art). It is the specific ontology of the "self-fulfilling file folder."
