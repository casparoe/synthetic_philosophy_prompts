prompt: |-
  I'm a hospital ethicist and I keep running into the same nightmare scenario: a patient wrote an advance directive years ago saying "no life-sustaining treatment if I have severe dementia," but now they have moderate dementia and seem content — they smile, enjoy pudding, recognize family sometimes. The family is split. Some say "follow the directive, she would hate this." Others say "look at her, she's happy, how can you withhold antibiotics from a happy person?"

  I need an actual procedure I can use on the floor — not a seminar paper. Something my team (attending physician, nurse, social worker, family) can work through in under an hour. It should tell us: what questions to ask in what order, what counts as an answer that pushes us one way or the other, where we should stop and say "the directive stands" vs. "the directive is overridden," and — crucially — which steps are genuinely philosophical judgment calls that no algorithm can settle.

  Ground it in whatever the literature on advance directives and the authority of the earlier self actually says: Dworkin's integrity view, Dresser's critique, the personal identity problem, whatever's relevant. But translate it. I don't need citations, I need a tool. Then run it on two cases: (1) the dementia case above — the contented patient with moderate dementia whose advance directive refuses antibiotics for pneumonia, and (2) a case where the patient's advance directive refuses blood transfusions on religious grounds (Jehovah's Witness), but the patient is now unconscious after a car accident, the directive is 15 years old, and the family says they left the faith five years ago — though there's no documentation of that. And tell me honestly: what kinds of cases will this procedure fail on, where I should just call the ethics committee and admit we're flying blind?
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Hospital Ethicist.
      *   **Problem:** Conflict between past advance directives (AD) and current well-being/status of patients (specifically dementia and religious conversion scenarios).
      *   **Need:** A practical, floor-ready procedure (under 1 hour), not theoretical discourse.
      *   **Requirements:** Specific questions, decision thresholds, distinction between algorithmic steps and philosophical judgment calls.
      *   **Theoretical Grounding:** Must implicitly/explicitly rely on Dworkin (critical interests/integrity), Dresser (current interests/experience), and personal identity debates, but translated into clinical tools.
      *   **Task:** Create the tool, apply it to two specific cases (Dementia/Pneumonia, JW/Transfusion), and identify failure modes.

  2.  **Deconstruct the Theoretical Tension:**
      *   *Dworkin:* The "precedent autonomy" of the competent self matters most. Critical interests (values, integrity) trump experiential interests (current pleasure). If the AD says "no," we honor the *person's life story*, even if the current "self" is happy.
      *   *Dresser:* The "current self" is different from the past self. We shouldn't sacrifice a happy, existing being for the preferences of a "ghost" (the past self). Current well-being counts.
      *   *Personal Identity:* Is the demented patient the *same person* who wrote the AD? If psychological continuity is broken, does the AD bind?
      *   *Clinical Reality:* We need to treat suffering, avoid harm, and respect legal/ethical norms. We can't spend weeks debating metaphysics.

  3.  **Drafting the Procedure (The "Precedent vs. Presence Protocol" - PVP):**
      *   *Goal:* A structured conversation guide.
      *   *Time:* < 60 mins.
      *   *Participants:* Attending, Nurse, SW, Surrogate/Family, Ethicist (facilitator).
      *   *Structure:*
          1.  **Fact-Finding (10 mins):** Medical status, AD specifics, current capacity.
          2.  **The "Identity & Continuity" Check (15 mins):** Is this the same person? (Dresser's challenge).
          3.  **The "Critical Interest" Audit (15 mins):** What did the AD *really* mean? (Dworkin's defense).
          4.  **The "Harm/Benefit" Weighing (10 mins):** Current suffering vs. future trajectory.
          5.  **Decision Point (10 mins):** Default rule.

      *   *Refining the Steps:*
          *   Need clear "Stop/Go" signals.
          *   Need to identify where philosophy takes over (the "Hard Stop").
          *   Need to address the legal baseline (ADs are usually legally binding unless revoked).

      *   *Key Concept:* The "Threshold of Alienation." At what point does the current patient become so disconnected from the past author that the AD loses moral force?

  4.  **Applying to Case 1 (Dementia/Pneumonia):**
      *   *Facts:* Moderate dementia, content, AD says "no life-sustaining if severe dementia." Current issue: Pneumonia (treatable).
      *   *Application:*
          *   Step 1: AD is valid.
          *   Step 2: Identity. Moderate dementia = significant continuity loss? Maybe. But she recognizes family *sometimes*.
          *   Step 3: Critical Interest. Did she fear *being* a burden or *losing dignity*? Or just *being demented*?
          *   Step 4: Harm/Benefit. Antibiotics = low burden, high chance of return to *current* baseline.
          *   *Verdict:* This is the hard case. The AD says "severe," she is "moderate." Does pneumonia push her to severe? If we treat, does she stay moderate?
          *   *Nuance:* Dworkin would say treat the AD as binding if the condition matches. Dresser would say she's happy now.
          *   *Protocol Outcome:* Likely honor AD *if* "severe" is interpreted as the trajectory pneumonia triggers. But if she's currently content, there's a strong argument for "presumption of treatment" unless the AD is hyper-specific. *Correction:* Actually, standard ethics usually favors the AD *unless* there's evidence of revocation. But the prompt asks for a tool to navigate the *conflict*.
          *   *Refined Verdict:* The tool should highlight the ambiguity in "severe." If she is currently *not* severe, does the AD trigger?

  5.  **Applying to Case 2 (JW/Transfusion):**
      *   *Facts:* Unconscious, AD refuses blood (15 yrs old). Family says she left faith (5 yrs ago), no proof.
      *   *Application:*
          *   Step 1: AD valid on face.
          *   Step 2: Identity. Same person, just changed mind (hopefully).
          *   Step 3: Critical Interest. Religious values are "critical interests" (Dworkin). Changing them is a critical interest update.
          *   Step 4: Evidence of Revocation. Oral revocation is legally tricky but ethically weighty.
          *   *Verdict:* This is easier legally but hard ethically. If she left the faith, the *basis* of the AD is gone. The "past self" would want the "current self's" beliefs honored.
          *   *Protocol Outcome:* Treat. The likelihood of changed belief outweighs the static document when family consensus exists.

  6.  **Identifying Failure Modes:**
      *   Where does the tool break?
      *   When family is deeply split (not just unsure).
      *   When the medical prognosis is uncertain (will treatment restore capacity?).
      *   When the "current happiness" is delusional vs. genuine.
      *   Legal constraints (some states won't allow overriding a written AD without clear evidence).

  7.  **Review and Refine (Self-Correction):**
      *   *Tone:* Needs to be professional, direct, not academic.
      *   *Philosophy:* Ensure Dworkin/Dresser are *used*, not just named. Dworkin = Integrity/Precedent Autonomy. Dresser = Current Well-being.
      *   *The "Hard Stop":* I need to be explicit about where the algorithm ends and human judgment begins.
      *   *Time Limit:* Ensure the steps are feasible in 1 hour.
      *   *Case 1 Nuance:* The AD says "Severe Dementia." Patient has "Moderate." This is a trigger condition mismatch. This is a key leverage point.
      *   *Case 2 Nuance:* Religious ADs are treated differently than quality-of-life ADs in some jurisdictions. Need to flag that.

  8.  **Final Polish:**
      *   Name the tool: "The Precedent-Presence Protocol (P3)."
      *   Structure: Phases.
      *   Output: Clear recommendations.

  *(Self-Correction during drafting)*: I need to be careful not to give legal advice. I am an ethicist. I must emphasize that legal counsel might be needed, but the *ethical* recommendation is the goal.
  Also, I need to make sure I don't solve the "Hard Problem" of personal identity. I need to acknowledge that the tool *manages* the conflict, it doesn't solve the metaphysics.

  Let's build the "Decision Matrix" for the philosophical judgment calls.
  1. Is the current experience *so* positive that overriding the past self causes immediate harm? (Dresser)
  2. Is the past value *so* central to identity that violating it desecrates the life story? (Dworkin)

  Okay, ready to write.
answer: |-
  Here is a practical tool designed for the clinical setting. It translates the philosophical tension between **Precedent Autonomy** (Dworkin: the past competent self rules) and **Current Well-Being** (Dresser: the present experiencing self matters) into a triage protocol.

  # The Precedent-Presence Protocol (P3)
  **Time Target:** 45–60 Minutes
  **Participants:** Attending, Nurse, Social Worker, Surrogate(s), Ethicist (Facilitator)
  **Goal:** Determine whether to honor a written Advance Directive (AD) when current patient status or family testimony conflicts with it.

  ---

  ## Phase 1: The Validity & Trigger Check (10 Mins)
  *Goal: Rule out administrative errors before doing ethics.*

  **Questions to Ask:**
  1.  **Is the AD legally valid in this jurisdiction?** (Signed, witnessed, not expired?)
  2.  **Does the current medical condition match the AD's "trigger condition"?**
      *   *Example:* AD says "Terminal Condition." Patient has "Chronic Dementia." -> **STOP.** AD does not apply.
      *   *Example:* AD says "Severe Dementia." Patient has "Moderate Dementia." -> **PROCEED.** This is a gray zone.
  3.  **Is there evidence of formal revocation?** (Newer document, written statement, verbal revocation to physician documented in chart?)

  **Decision Rule:**
  *   If AD is invalid or triggers don't match: **Treat according to standard best interest.**
  *   If AD is valid and triggers match: **Proceed to Phase 2.**

  ---

  ## Phase 2: The "Identity & Continuity" Audit (15 Mins)
  *Goal: Assess the Dresser Critique. Is the person who wrote this the same person in the bed?*

  **Questions to Ask (Family/Nurse):**
  1.  **Psychological Continuity:** Does the patient retain *any* values, memories, or affections from the time the AD was written?
      *   *Indicator for Overriding AD:* Patient recognizes family, expresses affection, shows personality traits consistent with the past.
      *   *Indicator for Honoring AD:* Patient is non-communicative, does not recognize loved ones, displays no emotional connection to past life.
  2.  **Current Suffering vs. Contentment:** Is the patient currently suffering, or are they experiencing net positive affect?
      *   *Indicator for Overriding AD:* Patient smiles, eats, engages, shows no distress.
      *   *Indicator for Honoring AD:* Patient is agitated, withdrawn, or appears distressed by interventions.

  **The "Dresser Threshold":**
  If the patient is **capable of current enjoyment** AND **lacks awareness of the directive's rationale**, the moral weight shifts toward protecting the *current* self.

  ---

  ## Phase 3: The "Critical Interest" Audit (15 Mins)
  *Goal: Assess the Dworkin Defense. Did the past self have a value so deep that violating it desecrates their life story?*

  **Questions to Ask (Family/Ethicist):**
  1.  **Was this preference a "Casual Preference" or a "Critical Interest"?**
      *   *Casual:* "I don't like hospitals." (Easily overridden by current safety).
      *   *Critical:* "I would rather die than lose my dignity/autonomy/religious standing." (Hard to override).
  2.  **What was the *fear* behind the directive?**
      *   *Fear of Burden:* "I don't want to drain my family's savings."
      *   *Fear of State:* "I don't want to exist as a vegetable."
      *   *Religious Integrity:* "I must remain pure for God."
  3.  **Does treating the patient violate that specific fear?**
      *   *Example:* If the fear was "being a burden," and the family *wants* to pay for care, honoring the AD might actually violate the intent.
      *   *Example:* If the fear was "loss of dignity," and the patient is incontinent and unaware, treating them extends the state they feared.

  **The "Dworkin Threshold":**
  If the directive reflects a **deeply held value regarding the narrative arc of their life** (integrity/religion/dignity), the past self's authority remains high, even if the current self is content.

  ---

  ## Phase 4: The Decision Matrix (10 Mins)
  *Goal: Synthesize findings into a recommendation.*

  | Scenario | Continuity (Phase 2) | Critical Interest (Phase 3) | **Recommendation** |
  | :--- | :--- | :--- | :--- |
  | **A** | Low (No recognition) | High (Dignity/Religion) | **Honor AD.** (Current self is a "shell"; past integrity rules). |
  | **B** | High (Happy, recognizes) | Low (General QOL preference) | **Override AD.** (Current well-being trumps vague past preference). |
  | **C** | High (Happy, recognizes) | High (Religion/Deep Value) | **ETHICAL DEADLOCK.** (See Failure Modes). |
  | **D** | Low (Suffering) | Any | **Treat.** (Beneficence overrides AD). |

  **The "Presumption Rule":**
  In the absence of clear evidence that the patient *changed their mind* (Phase 1), the **Written AD holds legal and ethical precedence.** To override it, you need *clear and convincing* evidence that the *current* situation violates the patient's *current* best interests in a way the past self could not have anticipated.

  ---

  ## Phase 5: The Philosophical "Hard Stop" (10 Mins)
  *Goal: Acknowledge what the algorithm cannot solve.*

  **Tell the Team:**
  "We have run the protocol. Here is where philosophy ends and judgment begins. We cannot scientifically prove if the demented patient is the 'same person' as the one who wrote the AD. We cannot prove if a religious conversion was genuine without documentation.
  *   **If we Honor the AD:** We risk harming a happy being for the sake of a 'ghost' (the past self).
  *   **If we Override the AD:** We risk violating the fundamental autonomy of the competent person who planned their life.

  **Final Check:** Is there *any* middle ground? (e.g., Time-limited trial of treatment? Palliative antibiotics?) If no, the Attending must make the call based on the Precedence Rule: **Valid ADs stand unless there is evidence of revocation.**"

  ---

  # Case Applications

  ## Case 1: The Contented Dementia Patient
  *   **Scenario:** Moderate dementia, happy, enjoys pudding. AD says "No life-sustaining if severe dementia." Pneumonia present. Family split.
  *   **P3 Run-Through:**
      *   **Phase 1:** AD valid. Trigger mismatch? AD says "Severe," Patient is "Moderate." Pneumonia could push her to "Severe" or kill her. This is the leverage point.
      *   **Phase 2 (Identity):** High Continuity. She smiles, recognizes family sometimes. She is experiencing net positive affect. (Dresser weight: High).
      *   **Phase 3 (Critical Interest):** Why did she write it? Likely fear of "being a vegetable" or "burden." Antibiotics for pneumonia are low-burden. Treating pneumonia does not necessarily commit her to long-term feeding tubes or ICU.
      *   **Phase 4 (Matrix):** This fits **Scenario B** (High Continuity / Low Critical Interest conflict regarding *this specific treatment*).
      *   **Phase 5 (Judgment):** The AD specifies "Severe." She is not yet "Severe." Treating pneumonia restores her to her *current* baseline (Moderate/Content), not a worse one.
  *   **Recommendation:** **Treat the Pneumonia.**
      *   *Rationale:* The trigger condition ("Severe") has not been met. The current self is capable of enjoyment. The treatment (antibiotics) is low-burden and does not lock her into the "severe" state she feared. Honoring the AD now would effectively euthanize a content person based on a hypothetical future state.
      *   *Caveat:* Document that this treatment is to restore current baseline, not to initiate a long-term plan contrary to the AD (e.g., if she gets worse later, the AD triggers).

  ## Case 2: The Jehovah's Witness (Unconscious)
  *   **Scenario:** Unconscious, car accident. AD refuses blood (15 yrs old). Family says she left faith (5 yrs ago), no proof.
  *   **P3 Run-Through:**
      *   **Phase 1:** AD valid on face. No formal revocation.
      *   **Phase 2 (Identity):** High Continuity (physically same, psychologically same prior to accident).
      *   **Phase 3 (Critical Interest):** Religion is the *ultimate* Critical Interest (Dworkin). However, religious identity is mutable. If she left the faith, the *basis* of the AD is gone. The "Past Self" would want the "Current Self's" beliefs honored.
      *   **Phase 4 (Matrix):** This is **Scenario C** (High Continuity / High Critical Interest). This is the danger zone.
      *   **Phase 5 (Judgment):** Legal risk is high here. Courts usually uphold written religious directives. However, ethically, if the *value system* changed, the directive is obsolete.
  *   **Recommendation:** **Honor the AD (Do Not Transfuse) unless legal counsel advises otherwise.**
      *   *Rationale:* In religious cases, the "Integrity View" (Dworkin) is strongest. A written religious directive is considered a solemn covenant. Oral testimony from family about a change of heart is notoriously unreliable under stress and legally insufficient in most jurisdictions to override a written religious refusal.
      *   *Exception:* If the family can produce *any* corroboration (e.g., she stopped attending, friends confirm, she carried a new card), you may move to treat. Without it, you must assume the 15-year-old document represents her deepest critical interest.
      *   *Note:* This feels harsh (Dresser critique), but the risk of violating religious autonomy is ethically heavier than the risk of death in this specific legal/ethical framework.

  ---

  # Failure Modes: When to Call the Full Ethics Committee
  *Do not use the P3 tool alone in these situations. These require long-form deliberation.*

  1.  **The "Split Surrogate" Deadlock:**
      *   If the family is 50/50 on the decision (e.g., half say "She left the faith," half say "She didn't"), the P3 cannot resolve it. The conflict is about credibility, not ethics. **Call Legal + Ethics.**
  2.  **The "Uncertain Prognosis" Trap:**
      *   If treating the patient (e.g., antibiotics) might restore them to competence, the calculation changes. If *not* treating guarantees death, but treating gives a 10% chance of regaining capacity to make their own decision, you must treat. The P3 assumes the current state is static.
  3.  **The "Suspected Coercion" Flag:**
      *   If the family urging you to *ignore* the AD stands to gain financially (inheritance) or emotionally (caregiver burden) from the patient's death, you cannot trust their testimony about the patient's "current happiness" or "change of mind." **Investigate first.**
  4.  **The "Philosophical Abyss" (Personal Identity):**
      *   If the patient is in a Persistent Vegetative State (PVS) vs. Moderate Dementia. In PVS, there is *no* current self. In Moderate Dementia, there is *some* current self. If your team cannot agree on whether the patient is "still in there," the P3 breaks. You need a psychiatrist or neurologist to assess capacity/continuity formally.

  # Summary for the Floor
  *   **Default:** Written ADs stand.
  *   **Override Condition:** Only if (A) Trigger condition isn't met OR (B) Current patient is demonstrably content AND treatment is low-burden AND AD was based on general QOL (not religion).
  *   **Religious ADs:** Almost never override without documented revocation.
  *   **Dementia ADs:** Scrutinize the "Trigger." If they aren't at the stage specified yet, treat to maintain current baseline.
  *   **When in Doubt:** Treat to preserve life while seeking legal/ethics consultation, unless treatment is clearly futile or torturous.
