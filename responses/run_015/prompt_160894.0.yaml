answer: |-
  You have done an impressive job diagnosing the mechanical failure of frequentist null-hypothesis testing. Your understanding of *why* the old system breaks (optional stopping inflates Type I error) is correct, and your intuition that Bayesian inference handles stopping rules differently is largely right. However, your plan contains a critical statistical error and a dangerous methodological oversimplification.

  Here is the breakdown of what is working, what is mistaken, and why your adviser is actually right about the file-drawer problem.

  ### 1. What is doing the real work: The Likelihood Principle
  Your assumption that **Bayesian inference is robust to optional stopping** is the engine making your plan viable. This relies on the *Likelihood Principle*, which states that the evidence provided by the data depends only on what was observed, not on the intentions of the researcher (like when they planned to stop).
  *   **Verdict:** This is mostly correct. A Bayes Factor (BF) calculated at $n=40$ is the same number whether you planned to stop at 40 or planned to stop at 100 and peeked at 40. You do not need to fix $n$ in advance to calculate valid evidence. This assumption is doing the heavy lifting for your sequential design.

  ### 2. The actual mistake: Bayes Factors are Posterior Probabilities
  Your assumption that **a Bayes Factor of 10 means a 91% probability the hypothesis is true** is mathematically false and is the most dangerous error in your plan.
  *   **The Error:** A Bayes Factor is an *odds multiplier*, not a probability. To get a probability, you must multiply the BF by the **Prior Odds** (what you believed before the study).
      $$ \text{Posterior Odds} = \text{Prior Odds} \times \text{Bayes Factor} $$
      Your calculation ($10 \to 91\%$) assumes Prior Odds of 1:1 (a 50% chance the effect is real). In social psychology, especially for "fragile" results, the prior probability is likely much lower.
  *   **Why it fails:** If the true prior probability is only 10% (Prior Odds = 1:9), a BF of 10 yields Posterior Odds of 10:9, which is only a **53% probability**. You would be claiming strong evidence for something that is barely more likely than a coin flip.
  *   **Connection to your Adviser:** This is why your adviser is right. The "file-drawer problem" (publication bias) means the literature is full of false positives. This drastically lowers the **Prior Probability** that any given effect is real. By ignoring this, you are using an overly optimistic prior, which makes your Bayesian conclusion overconfident. You cannot treat your study in isolation; the history of the field dictates your prior.

  ### 3. The methodological risk: Preregistration is still necessary
  You assumed that **preregistration is unnecessary because Bayes fixes frequentist problems**. This is incorrect.
  *   **The Error:** While Bayes handles *stopping* rules well, it does not protect against *researcher degrees of freedom* in analysis. You can still "hack" a Bayes Factor by trying different priors, excluding different outliers, or choosing different covariates until the BF looks "strong."
  *   **Why it fails:** Without preregistration, you cannot distinguish between a result that was robustly predicted and one that was tuned to the data. Preregistration locks in your analysis plan (including your prior choice), ensuring the BF reflects the data, not your flexibility.

  ### 4. A note on failed replications
  Your assumption that **a non-significant replication proves the original was a false positive** is also too strong. In Bayesian terms, a BF near 1 indicates *insensitivity* (the data don't speak), not necessarily evidence for the null. You need a design with enough power to distinguish "no effect" from "noisy data."

  ### Summary for your Club
  You can tell your club: "Bayes lets us stop when we want, but it doesn't let us ignore what we knew before. A Bayes Factor tells us how much to update our beliefs, not what our beliefs should be. If we start skeptical (because of the replication crisis), a 'strong' Bayes Factor might still leave us unsure. Also, we still need to preregister so we don't accidentally tune our priors to get the result we want."

  \answer{Drop the assumption Bayes Factors are probabilities}
