  1.  **Deconstruct the Request:**
      *   **Topic:** Transhumanist analogy comparing brain suffering-circuitry to legacy OS/threat-detection and car engines (combustion vs. electric).
      *   **Task 1:** Create a correspondence table mapping the analogy components (OS, Patch, Engine, False Alarm, etc.) to neurobiological/psychological realities.
      *   **Task 2:** Critique the analogy (tear into disanalogies). Key points to address: lack of software/hardware split, coupling of motivation and negative affect, begging the question (pain as "false positive").
      *   **Task 3:** Evaluate the conclusion (abolishing suffering without losing value) based on the critique. Does the argument survive without the analogy?

