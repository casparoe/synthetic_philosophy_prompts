prompt: |-
  I'm a graduate student in a philosophy of biology seminar, and before we get to the section on functions I want to fix what we should be asking of an account rather than grading the readings one at a time. Write me the specification: what any adequate theory of biological function has to deliver — which distinctions it must respect (a trait's function versus its merely useful side effects, having a function versus performing it, the function of a token versus of a type, function versus the effect a trait happens to produce now), which cases it has to get right, and which results from biology or medicine it can't be inconsistent with — each paired with the case or consideration that makes it a requirement rather than a preference of one camp. The four cases I most want handled are the very first proto-heart, which pumped before any selection history stood behind it; a protein designed from scratch in a lab and wired into a synthetic cell, where it does work no lineage has ever been selected for; a muscle flap moved by a surgeon to a new site where it now performs a task it never performed before; and a failing heart that still has a function it can no longer carry out. Then mark which requirements you take to be non-negotiable and which are demands a camp smuggles in because its own theory happens to meet them, including any that are really inherited from wanting functions to do work elsewhere — in artifacts, in the philosophy of mind, in medicine — rather than from biology; flag any pair of requirements you suspect can't be jointly satisfied, since that tension is the part I most want to see. Close by scoring the selected-effect (etiological) account and the causal-role (systemic, dispositional) account in two or three sentences each, and name the single requirement that eliminates the most otherwise-plausible theories.
