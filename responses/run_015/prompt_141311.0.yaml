answer: |-
  # Specification for an Adequate Theory of Biological Function

  **Context:** This document establishes the criteria for evaluating theories of biological function prior to engaging with specific readings. It distinguishes between constraints imposed by biological reality, constraints imported from other domains, and theoretical preferences disguised as necessities.

  ## I. Core Distinctions & Required Deliverables
  *Each distinction is paired with the biological or conceptual consideration that mandates it.*

  1.  **Function vs. Mere Causal Effect**
      *   **Requirement:** The theory must distinguish why a heart's function is *pumping blood* and not *making thumping noises*, even though both are causal effects.
      *   **Justification:** **The Side-Effect Case.** Without this, "function" collapses into "causation," rendering the term useless for explaining why specific traits are maintained while others are not.
      *   **Status:** **Non-negotiable.** (Required for explanatory power in evolutionary biology).

  2.  **Having a Function vs. Performing It**
      *   **Requirement:** The theory must allow that a trait can possess a function even if it is currently broken or inactive.
      *   **Justification:** **The Failing Heart Case.** A heart in ventricular fibrillation has the function of pumping blood, even if it cannot perform it.
      *   **Status:** **Non-negotiable.** (Required to ground the concept of pathology/medicine; without it, "disease" is merely "difference").

  3.  **Token vs. Type Functions**
      *   **Requirement:** The theory must clarify whether functions attach to the general trait (hearts) or the specific instance (this heart).
      *   **Justification:** **The Surgically Moved Muscle Case.** A muscle flap moved to the face performs a new task. Is this a new function for the *token* muscle, or does the *type* muscle retain its original function?
      *   **Status:** **Theoretical Preference (Smuggled).** SE theories prefer Types (lineages); CR theories prefer Tokens (current systems). Biology uses both, so the theory must explicate the relationship, not privilege one.

  4.  **Function vs. Current Utility**
      *   **Requirement:** The theory must distinguish what a trait is *for* from what it is *doing right now*.
      *   **Justification:** **The Proto-Heart Case.** The first structure that pumped blood provided utility before it had a selection history. If function = current utility, the proto-heart has a function; if function = history, it does not.
      *   **Status:** **Contested.** (Depends on whether "function" explains *origin* or *maintenance*).

  ## II. The Four Test Cases
  *A theory fails if it cannot provide a coherent verdict on these scenarios.*

  1.  **The Proto-Heart (Evolutionary Novelty)**
      *   **Scenario:** A structure pumps blood in an ancestor before natural selection has had time to act on that pumping.
      *   **Constraint:** **The Novelty Requirement.** The theory must explain how functions arise without magical retrocausality.
      *   **Status:** **Non-negotiable.** (Evolution is fact; a theory that makes the origin of functions mysterious is incompatible with evolutionary biology).

  2.  **The Synthetic Protein (Engineering/Design)**
      *   **Scenario:** A protein is designed *de novo* in a lab and inserted into a synthetic cell to perform a metabolic task no natural lineage has ever performed.
      *   **Constraint:** **The Ahistorical Capacity Requirement.** The theory must account for function in the absence of evolutionary history.
      *   **Status:** **Imported from Artifacts/Synthetics.** This imports engineering intuitions into biology. Strict biological naturalism may reject this as "artifact function," not "biological function."

  3.  **The Moved Muscle (Plasticity/Re-purposing)**
      *   **Scenario:** A surgeon moves a chest muscle to the face to restore a smile. It now performs a task it was never selected for.
      *   **Constraint:** **The Context Sensitivity Requirement.** The theory must handle traits that acquire new roles within a lifetime.
      *   **Status:** **Imported from Medicine.** This is a medical intervention case. Pure evolutionary theory might classify this as "dysfunction" or "artifact use," whereas clinical practice treats it as functional.

  4.  **The Failing Heart (Normativity/Malfunction)**
      *   **Scenario:** A heart is too weak to pump blood but is still a heart.
      *   **Constraint:** **The Normativity Requirement.** The theory must ground the "ought" (it *should* pump) in natural facts.
      *   **Status:** **Non-negotiable.** (Required to distinguish biology from mere chemistry; essential for the concept of organismal integrity).

  ## III. Tensions and Incompatibilities

  **The Primary Tension: Novelty vs. Normativity**
  *   **Flagged Pair:** **The Novelty Requirement** (Proto-heart/Synthetic) and **The Normativity Requirement** (Failing Heart).
  *   **Analysis:** These appear jointly unsatisfiable for strict naturalistic accounts.
      *   To satisfy **Normativity** (Failing Heart), you generally need a standard of correctness established by history (Selected-Effect). If there is no history of success, there is no standard for failure.
      *   To satisfy **Novelty** (Proto-heart/Synthetic), you generally need ahistorical causal capacity (Causal-Role). If function requires history, the first heart and the synthetic protein have no functions.
      *   **Verdict:** A theory that secures normativity via history sacrifices novelty. A theory that secures novelty via current capacity sacrifices normativity (making "malfunction" merely "non-performance").

  ## IV. Classification of Requirements

  | Requirement | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Distinguish Function from Side-Effect** | **Non-negotiable** | Without this, biology cannot explain trait retention vs. byproduct. |
  | **Allow Malfunction (Have vs. Perform)** | **Non-negotiable** | Without this, medicine and pathology lose their ontological grounding. |
  | **Accommodate Evolutionary Novelty** | **Non-negotiable** | Without this, the theory contradicts the mechanism of evolution. |
  | **Accommodate Synthetic/Artifact Function** | **Imported (Artifacts)** | Demands biology conform to engineering intuitions; may be a category error. |
  | **Prioritize Token over Type (or vice versa)** | **Smuggled (Camp Preference)** | SE smuggles Type; CR smuggles Token. Biology requires both depending on scale. |
  | **Functions must be Intrinsic** | **Smuggled (CR Camp)** | Often demanded by Causal-Role theorists to avoid "relational" history, but not biologically mandated. |
  | **Functions must be Historical** | **Smuggled (SE Camp)** | Often demanded by Etiological theorists to secure normativity, but novelty cases challenge this. |

  ## V. Account Scoring

  **Selected-Effect (Etiological) Account**
  *   **Score:** High on Normativity/Malfunction; Low on Novelty/Synthetic.
  *   **Assessment:** It successfully explains the Failing Heart by anchoring function in past success, but it renders the Proto-Heart and Synthetic Protein functionless until selection occurs, which contradicts the continuity of evolutionary innovation and synthetic biology practice.

  **Causal-Role (Systemic/Dispositional) Account**
  *   **Score:** High on Novelty/Synthetic; Low on Normativity/Malfunction.
  *   **Assessment:** It successfully handles the Proto-Heart and Synthetic Protein by focusing on current capacity, but it struggles to explain the Failing Heart, as a trait that does not contribute to the system's capacity arguably lacks a function on this view, collapsing "broken" into "non-functional."

  ## VI. The Killer Requirement

  **The Single Requirement:** **The Malfunction Constraint (Having vs. Performing).**

  **Reasoning:** This requirement eliminates the most otherwise-plausible theories because it forces a theory to be **normative** rather than purely **descriptive**. Any theory that defines function strictly as "what the trait is currently doing" (including many Causal-Role and propensity accounts) is immediately eliminated, as it cannot make sense of a trait that has a function but fails to execute it. While the Novelty Requirement kills the dominant Selected-Effect account, the Malfunction Constraint kills *all* purely current-state naturalistic accounts, which is the broader class of competing theories. It is the hardest hurdle for naturalism to clear without invoking teleology.
