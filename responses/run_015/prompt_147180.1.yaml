  4.  **Embrace the Reduction:** Don't fight the "Reliabilism + Safety" label.
      *   *Fix:* Frame the paper as "Applying Safety Theory to the Bootstrapping Problem." This makes the contribution clear: you are showing that the specific puzzle of bootstrapping dissolves once we apply safety correctly, specifically via the self-auditing distinction.

