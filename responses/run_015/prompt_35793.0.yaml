answer: |-
  Here is the breakdown of your situation, served straight from the metaphysician's table.

  ### 1. Brainstorming the Disagreement: What are you actually fighting about?

  You need to identify the specific philosophical beast you are wrestling with. There are three candidates here:

  *   **Candidate A: The Empirical Fact.** Do you disagree on the physics? No. You both agree there is cheese. You both agree there is empty space where the cheese isn't. You both agree your ankle broke when you encountered a depression in the earth. There is no empirical disagreement.
  *   **Candidate B: The Linguistic Label.** This is the "Verbal Dispute." You use the word "exist" to mean "is a feature of the world we can refer to, count, and measure." Your roommate uses "exist" to mean "is a fundamental material substance." If you simply agreed to use different words, the fight would vanish.
  *   **Candidate C: Ontological Commitment.** This is the substantive core. It asks: *What earns the right to be included in our inventory of the universe?* Does something have to be made of atoms to be real? Or can spatial features, boundaries, and absences be "real" in their own right?

  Your roommate is arguing for **Eliminativism** (holes are fictions we use to describe cheese arrangements). You are arguing for **Realism** (holes are genuine features of the world).

  ### 2. Is the dispute substantive or merely verbal?

  **Verdict:** It is a **verbal dispute with substantive consequences.**

  Here is the test (borrowed from philosopher David Chalmers): A dispute is *merely* verbal if, once you clarify your definitions, you agree on everything. A dispute is *substantive* if, even after clarifying definitions, you disagree on how the world works.

  If your roommate says, "Okay, fine, there is a spatial region bounded by cheese that has causal effects on light and ankles, I just won't call it 'existence'," then it's verbal. But he won't say that. He claims the hole is *nothing*.

  This is where it becomes substantive. If the hole is truly *nothing*, it cannot have properties. But you correctly noted that holes have locations, sizes, and shapes. In logic, if $X$ has properties, $X$ is not nothing. To say "The hole is round" is to predicate a property of an object. If there is no object (the hole), what is round?

  Therefore, the dispute is substantive because it concerns **causal efficacy**. Your roommate wants to reduce the world to matter. You want to include spatial structures. Since spatial structures (holes) interact with matter (your ankle, light, water), excluding them from "existence" makes your ontology (your list of what exists) unable to fully explain physical events.

  ### 3. Who is right?

  **Verdict:** **You are right.** (But with a specific philosophical caveat).

  Your roommate is relying on a naive version of physicalism: "If it isn't made of atoms, it isn't real." This is philosophically bankrupt. By that logic, *shadows* don't exist. *Boundaries* don't exist. *The surface of the table* doesn't exist (it's just the top layer of atoms).

  The standard metaphysical view (championed by David Lewis and Achille Varzi) is that holes are **immaterial particulars**. They are not "nothing." They are *volumes of space* bounded by a material host. They are real, but they are *ontologically dependent* on the cheese. You can't have a hole without the cheese (or the ground), but the hole is distinct from the cheese.

  **Why your roommate is wrong:**
  His analogy of "the average taxpayer" is a category error.
  *   **The Average Taxpayer:** This is a statistical abstraction. No single person *is* the average taxpayer. It has no location. It cannot trip you.
  *   **The Hole:** This is a spatial particular. It has a specific location. It *can* trip you. It blocks light. It holds water.

  Because holes have **causal powers** (they tripped you), they earn their place in the ontology. "Nothing" cannot break an ankle. Therefore, the hole is not "nothing."

  ### 4. What to say at dinner tonight

  Do not get bogged down in definitions. Do not let him drag you into semantics. Use his physics against him. Here is your script, in three moves.

  **Move 1: Destroy the "Average Taxpayer" Analogy**
  > "You're comparing a hole to the 'average taxpayer,' but that's a bad analogy. The average taxpayer is a statistical fiction; it has no location and no causal power. A hole has a specific coordinate in space and it broke my ankle last summer. If 'nothing' can break my ankle, then your physics is worse than my metaphysics. Do you want to argue that my ankle was broken by a non-entity?"

  **Move 2: The "Properties" Trap**
  > "You say the hole is 'no-thing.' But tell me, is the hole round or square? Is it deep or shallow? If it's 'nothing,' it shouldn't have properties. But we can measure it. We can count the holes in the Swiss cheese. You can't count 'nothings.' If I can count it and measure it, it's part of the furniture of the universe, even if it's made of space instead of matter."

  **Move 3: The Concession that Wins the War**
  > "Here's the deal. I'll concede that holes aren't *material substances*. They aren't made of cheese-particles. But 'existence' isn't limited to 'stuff.' Shadows exist, and they aren't made of photons, they're the absence of them. Surfaces exist, and they aren't volumes, they're boundaries. Holes are real spatial features. You're confusing 'not made of matter' with 'does not exist.' Don't be a reductionist about things that can trip you."

  **The Mic Drop:**
  > "If holes don't exist, then you can't eat Swiss cheese. You're just eating cheese arranged around non-existence. Enjoy your nothing."

  **Summary for your confidence:**
  He is treating "existence" as a synonym for "material substance." You are treating "existence" as "being a feature of reality that matters." In modern metaphysics, your view is the robust one. Holes are real, immaterial objects. Stand your ground.
