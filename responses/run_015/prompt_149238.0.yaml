  hey — i need a decision-tree / sorting quiz for a philosophy seminar on whether folk-moral differences across WEIRD and non-WEIRD cultures tell us anything about moral objectivity. i want it built from teh logical space, not from a list of philosopher names, so start with concrete divergence questions a person can answer without knowing the labels: (1) are cross-cultural loyalty-vs-harm trade-offs best explained as noise around a universal core, or as genuinely different moral weights? (2) do purity-based condemnations in non-WEIRD groups track real moral wrongness or just culturally shaped disgust? (3) when people show moral dumbfounding — strong judgement with no justification — does that favour error theory, hidden objective knowledge, or pure conditioning? then inject this weird case: imagine a society that consistently ranks breaking a promise to a dead ancestor above letting a starving child take food, and ask whether any universalist framework can absorb that ranking without collapsing into contextualist objectivism or relativism. the leaves should be: strong universalism, weak universalism with cultural noise, relativism, error theory, and contextualist objectivism (truths objective but indexed to framework — flag if it really differs from weak universalism or relativism). map every answer-combination onto one of these; note any empty combos and briefly diagnose them (incoherent? unattractive? unexplored?). ask the respondent to answer in british english, keep the whole thing focussed, and don't include reading lists or citations — the model that answers won't be able to search the web. there may be a typo or two in this prompt, sorry about that.
