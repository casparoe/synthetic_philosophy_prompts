answer: |-
  # Seminar Tool: Moral Divergence & Objectivity Decision Tree

  **Purpose:** To sort intuitive responses to cross-cultural moral data into distinct meta-ethical positions.
  **Constraint:** Answer strictly on the basis of the logical implications of your choices, not on recalled philosophical labels.
  **Language:** Please ensure all written responses utilise British English spelling and convention (e.g., *favour*, *centre*, *analyse*).

  ---

  ## Part 1: The Decision Nodes

  Proceed through the following four nodes. Record your choice (A, B, or C) for each.

  ### Node 1: The Loyalty–Harm Trade-off
  *Data:* In WEIRD (Western, Educated, Industrialised, Rich, Democratic) cultures, harming an individual is typically weighted heavier than betraying a group loyalty. In many non-WEIRD cultures, violating loyalty to preserve an individual's welfare is seen as the greater moral failure.
  *Question:* What best explains this divergence?
  *   **(1A)** There is a universal core (e.g., 'care/harm'), but non-WEIRD groups possess noisy data or epistemic limitations regarding who counts as a victim.
  *   **(1B)** The moral weights are genuinely different; loyalty and harm are distinct foundational axes that cultures prioritise differently without one being strictly 'correct'.
  *   **(1C)** Neither axis tracks objective value; both are evolutionary heuristics for group cohesion.

  ### Node 2: The Ontology of Purity
  *Data:* Non-WEIRD groups often condemn actions (e.g., specific dietary violations, sexual taboos) that cause no tangible harm, citing 'purity' or 'sanctity'. WEIRD groups often view these as mere disgust reactions.
  *Question:* Do purity-based condemnations track real moral wrongness?
  *   **(2A)** Yes, either directly or because they symbolise deeper social harms invisible to outsiders.
  *   **(2B)** No, they track culturally shaped disgust responses, not moral truth.
  *   **(2C)** They track moral truth *relative to the cultural framework* that defines purity.

  ### Node 3: Moral Dumbfounding
  *Data:* Subjects often maintain strong moral judgements (e.g., 'it is wrong') even when unable to provide justifications (e.g., 'I just know it is').
  *Question:* What does this phenomenon indicate about moral knowledge?
  *   **(3A)** It suggests hidden objective knowledge (intuition) that outruns verbal justification.
  *   **(3B)** It suggests emotional conditioning or social programming without truth-apt content.
  *   **(3C)** It suggests a clash between competing objective principles that the subject cannot articulate.

  ### Node 4: The Ancestor Case (The Stress Test)
  *Case:* A society consistently ranks breaking a promise to a dead ancestor as *worse* than letting a starving child steal food.
  *Question:* Can a universalist framework absorb this ranking without collapsing?
  *   **(4A)** No. This ranking is objectively erroneous; any valid universalism must condemn it.
  *   **(4B)** Yes, but only by admitting their framework generates different objective truths than ours (Contextualism).
  *   **(4C)** Yes, by treating their ranking as a different cultural 'language' for the same underlying truth (Weak Universalism).
  *   **(4D)** No, because neither ranking possesses truth value (Error Theory).

  ---

  ## Part 2: Sorting Logic & Leaves

  Map your combination of answers to one of the five philosophical leaves below. Note that not all logical combinations are stable; some collapse into others.

  ### Leaf 1: Strong Universalism
  *   **Path:** 1A + 2A + 3A + 4A
  *   **Definition:** There is a single, culture-invariant moral truth. Divergences are errors, noise, or epistemic failures.
  *   **Diagnosis:** Requires believing that non-WEIRD intuitions on loyalty and purity are mistaken regarding the objective hierarchy of values.

  ### Leaf 2: Weak Universalism (with Cultural Noise)
  *   **Path:** 1A/1C + 2A/2C + 3C + 4C
  *   **Definition:** Core principles exist (e.g., 'keep commitments', 'prevent suffering'), but cultural contexts alter how these principles are applied or weighted. The Ancestor Case is a misunderstanding of the *application*, not the *truth*.
  *   **Diagnosis:** Distinguishes itself from Strong Universalism by allowing significant variance in weighting without declaring the other culture wholly 'wrong' on the core axiom.

  ### Leaf 3: Relativism
  *   **Path:** 1B + 2B/2C + 3B + 4B (interpreted as 'true for them, false for us')
  *   **Definition:** Moral truths are constituted by cultural frameworks. There is no 'view from nowhere' to adjudicate between the Ancestor Society and WEIRD societies.
  *   **Diagnosis:** Requires accepting that contradictory judgements (Starving Child > Ancestor vs. Ancestor > Starving Child) can both be 'true' in their respective contexts.

  ### Leaf 4: Error Theory
  *   **Path:** 1C + 2B + 3B + 4D
  *   **Definition:** Folk morality systematically fails to track objective properties. All moral judgements (WEIRD and non-WEIRD) are false, though perhaps useful.
  *   **Diagnosis:** The most sceptical leaf. Treats dumbfounding as conditioning, not intuition.

  ### Leaf 5: Contextualist Objectivism
  *   **Path:** 1B + 2C + 3A/3C + 4B (interpreted as 'objectively true indexed to parameters')
  *   **Definition:** Moral truths are objective but indexed to framework parameters (e.g., the definition of 'person', 'promise', or 'harm'). Unlike Relativism, the truth condition is rigid *once the context is set*. Unlike Weak Universalism, the context changes the truth value, not just the application.
  *   **Diagnosis:** In the Ancestor Case, it is *objectively true* in that society that the ancestor promise outweighs the child, because the metaphysical status of the ancestor is a parameter of the moral equation.

  ---

  ## Part 3: Diagnosis of Empty or Unstable Combos

  When analysing student responses, flag the following combinations as logically unstable or unexplored.

  | Combination | Diagnosis |
  | :--- | :--- |
  | **Strong Universalism + Error Theory** | **Incoherent.** One cannot hold that there is a single true morality (Universalism) and that no moral statements are true (Error Theory). |
  | **Relativism + 4A (Obj. Erroneous)** | **Incoherent.** If the Ancestor ranking is objectively erroneous, there is a universal standard by which it is judged, contradicting Relativism. |
  | **Weak Universalism + 2B (Pure Disgust)** | **Unstable.** If purity is *only* disgust (2B), it is hard to maintain a universal moral core (Weak Universalism) unless harm/loyalty are the only universals. This often collapses into Weak Universalism with a smaller core. |
  | **Contextualist Objectivism + 1A (Noise)** | **Redundant.** If differences are merely noise around a core (1A), there is no need for contextual indexing. This collapses into Weak Universalism. |
  | **Error Theory + 3A (Hidden Knowledge)** | **Incoherent.** If dumbfounding tracks hidden knowledge (3A), there is moral truth to be known, contradicting Error Theory. |

  ---

  ## Part 4: Seminar Instructions

  1.  **Distribution:** Hand out Part 1 to students. Allow 10 minutes for silent completion.
  2.  **Sorting:** Ask students to tally their answers and find their corresponding Leaf in Part 2.
  3.  **Discussion:** Focus heavily on **Node 4 (The Ancestor Case)**.
      *   Ask those who landed on **Contextualist Objectivism**: "How do you prevent this from sliding into Relativism? What makes the truth 'objective' if it changes based on the society?"
      *   Ask those who landed on **Weak Universalism**: "At what point does 'cultural weighting' become so distinct that you must admit they are playing a different moral game entirely?"
      *   Ask those who landed on **Error Theory**: "If all moral judgements are false, why does the feeling of 'wrongness' in the Ancestor case feel different from a preference for vanilla over chocolate?"
  4.  **Constraint:** Do not reference specific philosophers (e.g., Mackie, Haidt, Wong). Keep the discussion within the logical space mapped above.

  **Note on Contextualist Objectivism:** Ensure students distinguish this from Relativism. Relativism suggests the *truth-maker* is the culture's belief. Contextualist Objectivism suggests the *truth-maker* is the objective relation between agents, where 'culture' merely sets the initial parameters (like setting the rules of chess; the moves are objectively valid/invalid once the game is chosen).
