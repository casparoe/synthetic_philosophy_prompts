      *   Actually, the tension is usually between *Additivity* and *Dominance* in the presence of infinite values, or *Invariance* and *Existence of a Value*.
      *   For the Pasadena case specifically, *State-Description Invariance* is the one that kills the "natural order" summation. If you demand the value doesn't change when you permute the states (measure-preserving), you cannot assign a standard finite expected value to the Pasadena game.
      *   *Decision:* State-Description Invariance is the most restrictive regarding the Pasadena paradox specifically.

  5.  **Addressing the Specific Cases (i-vi):**
      *   (i) Dominance: Must hold.
      *   (ii) Invariance: Must hold (User's priority).
      *   (iii) Additivity (Zero Sum): $V(G) + V(-G) = 0$.
      *   (iv) Dynamic Consistency: No money pumps via re-description.
