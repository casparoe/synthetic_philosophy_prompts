answer: |-
  Here is the specification you requested. It is drafted as a requirements document for a decision rule capable of handling undefined expectations, structured by the constraints you imposed.

  ### I. The Specification

  To count as adequate, a decision rule for gambles with undefined expectations must satisfy the following requirements.

  **1. State-Description Invariance (Coordinate Independence)**
  *   **Requirement:** The valuation or ranking of a gamble must not change under any measure-preserving permutation of the state space. If the states are relabeled or rearranged without changing the probability measure attached to each payoff, the value of the gamble must remain identical.
  *   **Status:** **Non-negotiable.**
  *   **Case:** (ii) The Pasadena game re-presented.
  *   **Rationale:** This is the direct analogue of coordinate invariance in physics. A physical quantity cannot depend on the grid you draw over the system. If a rule assigns a value based on the *order* of summation (e.g., the natural order of tosses), it treats the indexing of states as physically significant when it is merely a representational artifact. This requirement alone rules out any regularization that relies on a specific sequence of partial sums.

  **2. Weak Dominance**
  *   **Requirement:** If Gamble A yields a payoff greater than or equal to Gamble B in every possible state, and strictly greater in at least one state with non-zero probability, the rule must rank A strictly above B.
  *   **Status:** **Non-negotiable.**
  *   **Case:** (i) Pasadena + $1.
  *   **Rationale:** This is the minimal condition for instrumental rationality. If you prefer more money to less, a rule that violates dominance mandates irrational behavior. Any rule that declares the Pasadena game "undefined" but its shifted version "defined" (or vice versa) without respecting the strict ordering violates this.

  **3. Coherent Additivity (Zero-Sum Consistency)**
  *   **Requirement:** For any gamble $G$, the combination of holding $G$ and holding $-G$ (the mirror image) must be valued at exactly zero. More broadly, the valuation of a portfolio should not depend on how the components are grouped if the net payoff in every state is identical.
  *   **Status:** **Non-negotiable.**
  *   **Case:** (iii) Pasadena + Mirror Pasadena.
  *   **Rationale:** This prevents the creation of value from nothing. If $V(G) = x$ and $V(-G) = y$, and $x+y \neq 0$, the rule allows for a "value leak." In physics, this is conservation of energy; in decision theory, it is the prevention of sure-loss contracts (Dutch Books) based purely on algebraic manipulation.

  **4. Dynamic Consistency (No Diachronic Pumping)**
  *   **Requirement:** The rule must prescribe the same choice at a decision node regardless of whether the agent evaluates the gamble ex-ante (before the first toss) or ex-post (after some tails have appeared), provided the information state is equivalent. An agent must not be exploitable by a bookie who merely waits for time to pass and then re-describes the conditional gamble.
  *   **Status:** **Non-negotiable.**
  *   **Case:** (iv) The sequential version.
  *   **Rationale:** Rationality must be stable over time. If the "convention" for summing changes as uncertainty resolves, the agent can be pumped: paying to enter, then paying to exit, then paying to re-enter. The rule must either fix the summation convention globally or admit that no fixed value exists.

  **5. Unbounded Sensitivity**
  *   **Requirement:** The rule must not resolve the indeterminacy merely by imposing an artificial upper bound on utility. It must provide a mechanism for comparing outcomes where a tiny probability is multiplied by an astronomically large value.
  *   **Status:** **Temperamental Preference** (though treated as Non-negotiable for this specification).
  *   **Case:** (vi) Tiny probability, enormous good.
  *   **Rationale:** Bounding utility solves the math by changing the physics of the agent. It declares that no amount of good is worth a certain threshold, which contradicts the intuition that some outcomes are lexically superior. You demand a rule that handles the infinity, not one that denies its existence.

  **6. Determinacy of Ranking**
  *   **Requirement:** The rule should output a definite ranking (A > B, A < B, or A ~ B) for any pair of gambles presented for choice, even if it does not output a unique real number.
  *   **Status:** **Temperamental Preference.**
  *   **Case:** General applicability.
  *   **Rationale:** A rule that returns "incomparable" too often fails to guide action. However, as flagged below, this may be the first requirement to sacrifice if contradictions arise.

  ---

  ### II. The Exclusionary Constraint

  **The single requirement that does the most work in excluding candidates is State-Description Invariance.**

  Most proposed solutions to the Pasadena problem rely on a *summation method* (e.g., taking the limit of partial sums in the natural order, or using a specific principal value). These methods are inherently order-dependent. They treat the index $n$ of the coin toss as a structural feature of the gamble rather than a label for the states. Because the Riemann rearrangement theorem applies to conditionally convergent series, any method that respects the natural ordering violates Invariance. To satisfy Invariance, one must essentially treat the expectation as a Lebesgue integral, which requires absolute convergence. Since the Pasadena game is not absolutely convergent, State-Description Invariance forces the conclusion that **no finite real number can be assigned to the game.**

  This requirement kills the "natural order" solution, the "principal value" solution, and most "regularization" solutions that rely on a specific parameterization of the state space.

  ---

  ### III. Flagged Tensions

  **1. The Impossibility Result**
  You suspect that State-Description Invariance, Determinacy, Weak Dominance, and Additivity cannot all be had together. You are correct. For the Pasadena game, Invariance implies the expectation is undefined (because the integral is not absolutely convergent). If the expectation is undefined, you cannot assign a finite number (violating Determinacy of Value). If you assign a number via a specific summation order, you violate Invariance. If you refuse to assign a number but maintain Dominance, you end up with a partial ordering where Pasadena is incomparable to many standard gambles, which limits action-guidance. The contradiction is located precisely at the intersection of **Invariance** and **Determinacy of a Finite Value**. You can have Invariance and admit "undefined," or you can have a Value and admit "coordinate dependence." You cannot have both.

  **2. Numbers vs. Partial Orderings**
  The rule should likely output only a **partial ordering**, not a number. A number invites a price. If you price the Pasadena game at $0.69$, a bookie can sell you the game for $0.70$ (you buy) or $0.68$ (you sell), but if the value is actually coordinate-dependent, the bookie can rearrange the states, claim the value is now $100$, and pump you. A partial ordering respects Dominance (Pasadena + $1$ > Pasadena) without committing to a specific scalar that implies false precision. It admits that some choices are rationally underdetermined.

  **3. Evaluation of Familiar Families**
  *   **Bounded Utility:** This approach declares the problem ill-posed by fiat. It satisfies all formal properties by ensuring absolute convergence everywhere. However, it fails your Temperamental Preference (Unbounded Sensitivity). It solves the math by denying the physics of the agent's preferences.
  *   **Privileged Summation (Principal Value):** This assigns a number (e.g., $\ln 2$) by fixing the natural order. It satisfies Determinacy but violates State-Description Invariance. It is mathematically analogous to choosing a specific gauge without proving gauge invariance. It is vulnerable to the "re-presentation" pump.
  *   **Difference/Status Quo:** This evaluates only $G - S$. It works if the difference is absolutely convergent. However, if the status quo is zero and $G$ is Pasadena, the difference is still Pasadena. It fails to resolve the core pathology unless the status quo itself has a matching divergence to cancel the noise, which is ad hoc.
  *   **Dominance Primitive:** This abandons numbers and ranks only by state-wise comparison. It satisfies Invariance and Dominance. However, it fails Determinacy: it cannot rank two Pasadena-like gambles that do not dominate each other state-wise. It leaves the agent paralyzed in complex trade-offs.
  *   **Nonstandard/Infinitesimals:** This assigns hyperreal values. It can distinguish between different infinite sums. However, it often violates the Archimedean property (no finite sum of small goods beats a large good) and can still struggle with Invariance if the hyperreal valuation depends on the ultrafilter choice (which is analogous to the summation order).

  ---

  ### IV. The Physics Analogy: Help and Misleading

  **Where it helps:**
  The analogy is precise regarding **regularization**. In physics, you introduce a cut-off $\Lambda$ to make an integral finite, calculate the observable, and then check if the result depends on $\Lambda$ as $\Lambda \to \infty$. If the finite part depends on the cut-off scheme, the quantity is not physical. In decision theory, the "summation order" or "grouping of states" is the cut-off scheme. Your demand for State-Description Invariance is exactly the demand that the "finite part" (the decision value) must be independent of the regularization scheme. This correctly identifies that any solution relying on the *natural order* of tosses is unphysical.

  **Where it misleads:**
  In physics, the constraint is **empirical**. If two regularization schemes predict different scattering cross-sections, experiment decides which is right (or if the theory is wrong). In decision theory, there is no external meter. There is no "measurement" of the value of the Pasadena game independent of the agent's choice behavior. The constraint is **coherence**, not correspondence.
  This means the "honest conclusion" you mention—that the question has no answer—is not a failure of the theory, but a feature of the landscape. In physics, "undefined" usually means "we need a better theory (e.g., QM to replace Classical)." In decision theory, "undefined" may mean "there is no rational requirement to choose one way or the other."
  The absence of an empirical arbiter means the choice among rules is indeed partly a choice of temperament. Do you prefer a complete theory that relies on arbitrary coordinates (Standard EU with natural order), or an incomplete theory that respects symmetry (Partial Order with Invariance)? Physics forces your hand; decision theory leaves you with a philosophical choice between completeness and invariance.
