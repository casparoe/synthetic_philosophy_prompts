      *   *Check:* Is the physics analogy critique sharp? Need to ensure I distinguish between *empirical* falsification and *coherence* falsification.
      *   *Check:* The user asked for the "specification" primarily. The response should look like a requirements document.

  10. **Final Polish:** Ensure the distinction between "Lebesgue integration" (absolute convergence required) and "Riemann/Conditional" (order dependent) is clear in the context of decision theory. The user knows this, but the terminology must be precise. The core conflict is that Probability Theory (Kolmogorov) assumes countable additivity which implies absolute convergence for expectations to be well-defined independent of rearrangement. Decision Theory often assumes Expectation exists. Pasadena breaks the link.

      *Wait, one nuance:* In standard measure theory, the expectation is *undefined* if the integral is not absolutely convergent. So standard EU theory actually *agrees* with the user that the value is undefined. The "solutions" are attempts to *extend* the theory. The specification must demand an *extension* that preserves physical-like invariances.

      *Re-evaluating the "Killer" Requirement:* If standard EU says "undefined," and the user wants a rule that *guides choice*, the rule must assign a value or ranking where EU says "undefined." The requirement that kills the most *proposed solutions* is State-Description Invariance. Most summation methods (Cesàro, Abel, Natural Order) depend on the indexing of the states. Invariance kills them all.

