  2.  **Deconstruct the Pasadena Problem:**
      *   The core issue is conditionally convergent series in expected utility.
      *   $E[U] = \sum p_i u_i$.
      *   In Pasadena, $\sum p_i u_i$ converges conditionally to $\ln 2$ in natural order, but can be rearranged to any value.
      *   This violates the standard definition of the Lebesgue integral (which requires absolute convergence for the value to be independent of rearrangement).
      *   The user wants to know what constraints a decision rule *must* satisfy to be considered "physical" or "adequate."

  3.  **Drafting the Specification (The "Demand List"):**
      *   *Requirement 1: State-Description Invariance (Coordinate Independence).* The user explicitly highlights this (Case ii). In physics, coordinates don't change physics. In decision theory, relabeling states shouldn't change value.
          *   *Status:* Non-negotiable. This is the core analogue to coordinate invariance.
      *   *Requirement 2: Weak Dominance.* If Gamble A pays $\ge$ Gamble B in every state and $>$ in at least one, A > B. (Case i).
          *   *Status:* Non-negotiable. Fundamental to rational choice.
      *   *Requirement 3: Additivity/Linearity.* If you hold A and B, the value should relate to $V(A) + V(B)$. Specifically, $A + (-A) = 0$. (Case iii).
          *   *Status:* Non-negotiable for coherence, but might conflict with others.
      *   *Requirement 4: Dynamic Consistency.* Choices made at the start should match choices made mid-game given updated information. (Case iv).
