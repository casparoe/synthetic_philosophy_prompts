  ### The Principle of Ontological Attribution

  **Statement:**
  An agent acts in **Bad Faith** when they locate the *authority* for their actions in their **facticity** (orders, tools, roles, identities), thereby treating their consciousness as a determined object that merely transmits external causes. An agent acts **Authentically** when they locate the *authority* for their actions in their **transcendence** (choice, project, risk-assumption), thereby treating their facticity as a *situation* to be navigated rather than a *determinant* that excuses them.

  **Clause Breakdown and Case Motivation:**

  1.  **The Excuse Clause (Bad Faith):** "Authority located in facticity."
      *   **Motivated by Case 1:** The engineer treats the CTO's order as a causal force ("hands were tied") rather than a constraint she evaluates. She makes her employment status (facticity) the author of the act.
      *   **Motivated by Case 3:** The engineer treats the model's weights and data (facticity) as the author ("The model decided"), erasing her role as the implementer who chose to deploy those specifications.
      *   **Motivated by Case 4:** The engineer treats "infrastructure" and "algorithmic opacity" (facticity) as a shield. By saying "I'm just infrastructure," he claims the system's structure dictates the outcome, not his choice to build it.

  2.  **The Ownership Clause (Authenticity):** "Authority located in transcendence."
      *   **Motivated by Case 2:** The engineer treats unemployment (facticity) not as a fate but as a cost she willingly incurs. The authority for the action lies in her choice of integrity, not in the absence of coercion.
      *   **Motivated by Case 5:** The engineer treats poverty (facticity) as the price of a project she chose ("my project, not my fate"). She does not claim poverty forces her hand; she claims her choice forces her into poverty.
      *   **Motivated by Case 6:** The engineer treats unpredictability (facticity) not as an escape from responsibility but as a risk he chose to absorb. He locates authority in his acceptance of the consequence, not in the system's inability to predict.

  3.  **The Concreteness Distinction (Resolving Case 4 vs. Case 6):**
      *   **Motivated by the tension between Case 4 and Case 6:** Both involve lethal autonomy and opacity. The principle distinguishes them by *what* the agent claims authority over.
      *   **Case 4 (Bad Faith):** Claims authority only over the *abstract role* ("national defense," "infrastructure") while disowning the *concrete consequences* ("specific lethal choices"). He uses the abstract value to hide from the concrete reality.
      *   **Case 6 (Authentic):** Claims authority over the *concrete consequences* ("every classification error"). He does not hide behind the abstract value; he integrates the specific, unpredictable harm into his personal project.

  ### Prediction for the Unlisted Case

  **Case:** An engineer writes harmful code while sincerely believing "good soldiers don't ask questions," treating his patriotic identity as an unchosen essence.

  **Verdict:** **Bad Faith.**

  **Reasoning:** This case triggers the **Excuse Clause**. By treating his patriotic identity as an "unchosen essence," he converts his *transcendence* (the continuous choice to serve) into *facticity* (a fixed nature he cannot violate). The phrase "good soldiers don't ask questions" is a explicit denial of agency; it posits the role ("soldier") as the author of the action, not the consciousness inhabiting the role. He is hiding behind the "spirit of seriousness," treating a value (patriotism) as an external demand that negates his freedom to judge the harm.

  ### Reconciliation and Costs

  **Does this principle overturn or distort any of your six verdicts?**

  It **resolves the ambivalence in Case 4** without overturning a firm verdict. You noted you went "back and forth" on Case 4. This principle demands that Case 4 be classified as **Bad Faith**.

  *   **Why:** In Case 4, the engineer uses the system's opacity to *disown* specific choices ("I'm not the one who pulls the trigger"). This is a classic move of bad faith: granting agency to the tool to relieve the self of anguish.
  *   **Alignment:** This aligns with your suspicion that he "uses the system's algorithmic opacity... to disown the specific lethal choices."
  *   **Distinction from Case 6:** It preserves your verdict on Case 6 because that engineer explicitly *rejects* the opacity shield ("I accept full responsibility"). The principle holds that the *same job* can be done in bad faith (Case 4) or authentically (Case 6), depending entirely on whether the engineer claims the *concrete consequences* as their own choice.

  **No other verdicts require overturning.** The principle fits Cases 1, 2, 3, 5, and 6 exactly as you described them. It relies on your intuition that the internal stance (ownership vs. evasion) matters more than the external outcome (harmful vs. harmless code).

  **One Potential Distortion to Watch:**
  The principle pressures **Case 5**. If the engineer refusing work believes she can achieve moral "purity" by inaction, Sartre might argue she is in bad faith for denying that *inaction* also changes the world (e.g., someone else builds the tool, or privacy remains unprotected). However, your verdict hinges on her statement: "I suffer this freely; it is my project." As long as she acknowledges her refusal is a *choice* with costs (poverty) rather than a *requirement* of her nature, she remains Authentic under this principle. If she believes she *must* refuse to be a "good person," she slides into Bad Faith. Your description suggests the former, so the verdict stands, but the distinction is narrow.
