answer: |-
  Dear Members of the Committee,

  Much of the contemporary literature on political compromise proceeds on the model of an exchange. Two parties with conflicting positions find a deal that leaves each better off than continued conflict, and the moral work is done by the fact that both consent to it, because the gains from trade justify the compromise. This picture is intuitive and fits well with standard bargaining models used in political science. However, it quietly assumes something like a settled pre-trade endowment. It assumes each party morally owns what it is trading away, and that what it gives up is a loss in the same currency as what it receives. In the cases that actually motivate the literature, both assumptions look shaky. When a minority agrees to the state's funding or toleration of a practice it regards as a grave wrong, in exchange for a majority concession on some unrelated matter, the minority is not giving up a preference; it is tolerating what it takes to be a wrong, and the gain it receives is denominated in interests while the cost it pays is denominated in commitments. There may be no common metric in which the deal is a net improvement for that party, even though the party would sign it and even though everyone agrees it is better than the alternative. Separately, the situation only looks like a trade at all because of a prior allocation of who gets to decide what, an allocation the parties disagree about, and disagreeing about which is part of what the dispute is. So the framework's central explanatory device, mutual gain, may be borrowed from a picture of bargaining that already presupposes the dispute's resolution.

  My project asks a precise research question derived from this tension: for which moral disagreements can gains-from-trade reasoning justify a compromise without presupposing a settlement of the disagreement itself, and what does the justification of compromise look like where it cannot? To answer this, I must demonstrate where the exchange model holds and where it fails, not by rejecting compromise outright, but by identifying the structural conditions under which trade-talk is legitimate. This requires navigating between existing positions that leave this open. The mutual-advantage tradition treats compromise as a Pareto improvement over a conflict baseline, but it typically takes the baseline as given rather than contested. Conversely, integrity-based objections and dirty-hands arguments focus on the moral cost to the agent, often treating any compromise on core commitments as a loss of integrity, yet they struggle to explain why some compromises are morally required rather than merely permitted. Finally, there are treatments of compromise as a second-best device under conditions of reasonable disagreement, which argue that we compromise because we cannot know who is right. These accounts avoid the endowment problem by appealing to epistemic humility, but they cannot handle cases where parties are not uncertain about their rights but are nevertheless forced to bargain over them. My project sits in the gap between these views, arguing that the legitimacy of compromise depends not on the magnitude of the gain or the depth of the conviction, but on whether the bargaining structure itself presupposes a resolution to the underlying jurisdictional dispute.

  To test this, I will employ a mixed methodology combining a small set of worked cases with a semi-formal model. The cases are selected to vary the relationship between interests and commitments. First, a religious exemption arrangement, where a minority trades compliance with general law for specific accommodations, often implicating third-party harms. Second, a climate burden-sharing agreement, where nations trade economic growth for emissions reductions, involving intergenerational commitments that cannot be easily discounted. Third, a transitional-justice deal in which amnesty is traded for truth, where the currency is literally justice versus stability. I will use these cases not for pure casuistry, which risks lacking generalizability, but as stress tests for the model. The model itself will be semi-formal, designed to keep the two currencies distinct instead of collapsing them into a single utility scale. Standard bargaining models assume a common utility function to determine the settlement range. My model will represent commitments as constraints or lexical priorities rather than weighted utilities, allowing me to test whether the model returns the verdicts we want when parties face trade-offs between interests and non-negotiable commitments. I chose this approach rather than a fully formal bargaining model because standard game theory cannot capture the normative weight of moral commitments without reducing them to preferences, which is precisely the error I am critiquing. Conversely, pure conceptual analysis of the word compromise would lack the precision needed to satisfy the political science component of the committee and would fail to generate actionable criteria for legitimacy.

  I anticipate a specific worry regarding this two-currencies point, namely that it is just the old incommensurability objection dressed up in bargaining vocabulary. If values cannot be compared, then no trade is possible, and the project risks saying nothing more than that deep disagreements are hard. I need to distinguish my claim from standard incommensurability. The incommensurability objection usually claims that there is no common measure of value between two options. My claim is structural: it is not that the values cannot be compared, but that the act of comparing them via trade presupposes a property right over the issue that is itself in dispute. Incommensurability says we cannot weigh A against B. My project says we cannot treat A as something I own to trade away until we settle who decides the status of A. A successful result will look like a characterization of the class of disagreements in which trade talk is legitimate, plus a diagnosis of what goes wrong elsewhere. I suspect the diagnosis turns on complicity rather than on loss. In legitimate compromises, parties share responsibility for the outcome; in illegitimate ones, the structure forces one party to be complicit in a wrong they define as such, merely to secure an interest. Failure would look like the model collapsing back into a single-metric picture under pressure, or if my distinction turns out not to change any verdicts about any real case. If the two-currency model yields the same recommendations as a standard utility model for all three cases, then the distinction is theoretically interesting but practically inert.

  Given the twelve-month timeline for a single researcher, feasibility is a constraint I have taken seriously. The primary risk is that the semi-formal model becomes too complex to solve within the year, or that the case studies expand beyond manageable bounds. To mitigate this, I have designed the project with a clear cutting room floor. If the model proves too resistant to formalization without collapsing into standard utility theory, I will drop the formal apparatus and rely on a structured qualitative comparison of the cases, using the two-currency distinction as an analytical framework rather than a mathematical one. Alternatively, if the case studies become too demanding, I will drop the climate burden-sharing case. While important, it involves complex empirical contingencies regarding international enforcement that may distract from the core philosophical argument about endowments and commitments. The religious exemption and transitional justice cases are sufficient to demonstrate the contrast between interest-based and commitment-based bargaining. This ensures that even in a worst-case scenario, the project produces a coherent philosophical argument about the limits of the exchange model, which is the core contribution.

  The significance of this work extends beyond the philosophy of compromise. For the political scientist on the committee, it offers a critique of the baseline assumptions in legislative bargaining models, suggesting that efficiency gains may mask normative presuppositions about jurisdiction. For the philosophers, it offers a way to salvage compromise from integrity-based objections without retreating into epistemic humility. By clarifying when trade-talk is legitimate, we can better understand when political agreements are genuinely justified and when they are merely coerced settlements dressed up as deals. I believe this project is precise enough to be finished in a year because it focuses on a specific structural flaw in a dominant model rather than attempting a full theory of political obligation. It uses concrete cases to ground the abstraction and a limited model to test the consistency of the intuition. I am confident that this approach will survive the objection that the idea is too broad or not really philosophy, because it targets the conceptual architecture of how we justify political agreements, which is central to both political philosophy and political science. I look forward to developing this work under the fellowship's support.

  Sincerely,

  The Applicant
